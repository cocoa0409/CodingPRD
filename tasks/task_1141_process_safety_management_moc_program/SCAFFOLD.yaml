# =============================================================================
# Task 1141: Process Safety Management & MOC Program (chemical plant PSM office)
# Scaffold seed tables (§1.0–§1.7). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  1141. Process Safety Management & MOC Program (chemical plant PSM office): change
  request classification & technical review, hazard analysis (PHA/HAZOP) revalidation
  cycle, pre-startup safety review gate, action-item tracking & closure evidence,
  temporary change expiry & extension, training & procedure update linkage, incident
  investigation feeding PHA, audit finding & corrective action

domain_name: process-safety-moc
api_prefix: /psm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_note: |
    Deliberately harder than expert band: 15 entities, 12 state machines (3 cyclic,
    1 with a class-driven branch bypass), 9 calculation rules (2 dual-variant pairs,
    combinatorial modes (a)+(b)+(c)), 22 ordered validation priorities across 8
    categories, 10 RBAC roles with 4 segregation-of-duties constraints, 2 OCC
    create-with-supersede races, 2 temporal-overlap semantics (half-open adjacency
    vs 14-day buffered gap), 2 compensating-action invariants.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# Convenience anchor: all roles may perform reads.
x-all-roles: &ALL_ROLES
  - PsmAdmin
  - PsmManager
  - Requester
  - TechnicalReviewer
  - OpsApprover
  - PssrLead
  - Investigator
  - Auditor
  - TrainingCoordinator

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
# Date/time convention (applies to every datetime field below): all dates are
# calendar-day granularity in UTC, serialized as ISO 8601 with T00:00:00Z. All
# comparisons (due, overdue, windows) are performed on those normalized midnights
# against the server's logical clock (see POST /psm/_clock/set_current_utc).
entities:
  - name: PlantUnit
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Unit display name" }
      - { name: unit_code, type: string, source: input, description: "Unique unit code (uppercase alphanumerics)", constraints: "unique across all PlantUnit rows" }
      - { name: pha_cycle_months, type: integer, source: input, description: "PHA revalidation cycle in months (12..60); 1 month = 30 days for due-date math" }
      - { name: temp_moc_max_days, type: integer, source: input, default: 180, description: "Max initial duration (days, inclusive) of a TEMPORARY MOC" }
      - { name: max_extensions, type: integer, source: input, default: 2, description: "Max approved extensions per TEMPORARY MOC" }
      - { name: extension_max_days, type: integer, source: input, default: 90, description: "Max days per single extension request" }
      - { name: total_temp_cap_days, type: integer, source: input, default: 360, description: "Hard cap: temporary_end_date <= temporary_start_date + total_temp_cap_days" }
      - { name: training_coverage_threshold_pct, type: number, source: input, default: 100.00, description: "Minimum MOC training_coverage_pct required at mark-implemented (2dp)" }
      - { name: open_action_count, type: integer, source: computed, default: 0, description: "Count of this unit's ActionItems in OPEN/IN_PROGRESS/SUBMITTED_FOR_VERIFICATION/REJECTED" }
      - { name: overdue_action_count, type: integer, source: computed, default: 0, description: "Subset of open items with due_date strictly before current clock" }
      - { name: process_safety_index, type: number, source: computed, default: 0, description: "Capped 0..100 composite (see unit_process_safety_index calc)" }
      - { name: psm_posture, type: enum, source: computed, default: NORMAL, description: "NORMAL | RESTRICTED | FROZEN — derived from process_safety_index bands" }

  - name: Personnel
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Person display name" }
      - { name: employee_ref, type: string, source: input, description: "Unique employee reference", constraints: "unique across all Personnel rows" }
      - { name: qualifications, type: array, source: input, default: [], description: "Enum list: MECHANICAL | CHEMICAL | ELECTRICAL | PROCESS | HAZOP_LEADER | PSSR_CERTIFIED" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive personnel cannot be assigned new work" }

  - name: MocRequest
    parent: PlantUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> PlantUnit.id; owning unit from creation path" }
      - { name: title, type: string, source: input, description: "Short change title" }
      - { name: description, type: string, source: input, description: "Change description" }
      - { name: discipline, type: enum, source: input, description: "MECHANICAL | CHEMICAL | ELECTRICAL | PROCESS — drives reviewer qualification" }
      - { name: requester_id, type: string, source: system, description: "FK -> Personnel.id; set from X-User-ID at creation" }
      - { name: approver_id, type: string, source: system, description: "FK -> Personnel.id; set from X-User-ID at approve (null until approved)", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | CLASSIFIED | TECHNICAL_REVIEW | RETURNED_FOR_REVISION | APPROVAL_PENDING | APPROVED_IMPLEMENTATION | IMPLEMENTED_PSSR_PENDING | STARTUP_AUTHORIZED | IN_SERVICE | EXPIRED_REVERT_REQUIRED | CLOSED | REJECTED | WITHDRAWN" }
      - { name: change_class, type: enum, source: system, default: null, description: "REPLACEMENT_IN_KIND | TEMPORARY | PERMANENT — set at classify" }
      - { name: screening_severity, type: integer, source: input, description: "1..5 screening severity, supplied at classify" }
      - { name: screening_likelihood, type: integer, source: input, description: "1..5 screening likelihood, supplied at classify" }
      - { name: screening_risk_score, type: number, source: computed, default: null, description: "Provisional variant: round2(sev*lik*class_mult) at classify" }
      - { name: definitive_risk_score, type: number, source: computed, default: null, description: "Final variant: computed at review verdict (see definitive_risk_score calc)" }
      - { name: risk_rank, type: enum, source: computed, default: null, description: "LOW | MEDIUM | HIGH | CRITICAL — from screening at classify, recomputed from definitive at verdict" }
      - { name: review_round, type: integer, source: system, default: 0, description: "Technical review round counter; +1 on every submit/resubmit" }
      - { name: requires_pssr, type: boolean, source: computed, default: null, description: "false only when change_class == REPLACEMENT_IN_KIND and requires_pssr_override != true" }
      - { name: temporary_start_date, type: datetime, source: input, default: null, description: "Required at classify when change_class == TEMPORARY (day granularity)" }
      - { name: temporary_duration_days, type: integer, source: input, default: null, description: "Required at classify when TEMPORARY; 1..unit.temp_moc_max_days inclusive" }
      - { name: temporary_end_date, type: datetime, source: computed, default: null, description: "= temporary_start_date + temporary_duration_days + total_approved_extension_days" }
      - { name: extension_count, type: integer, source: system, default: 0, description: "Approved extensions so far" }
      - { name: total_approved_extension_days, type: integer, source: system, default: 0, description: "Sum of approved extension days" }
      - { name: training_coverage_pct, type: number, source: computed, default: null, description: "Coverage across PUBLISHED ProcedureUpdates (per-update round then average, 2dp)" }
      - { name: implemented_at, type: datetime, source: system, default: null, description: "Clock date when mark-implemented succeeded" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Clock date when CLOSED" }

  - name: TechnicalReview
    parent: MocRequest
    common_fields: true
    fields:
      - { name: moc_id, type: string, source: system, description: "FK -> MocRequest.id; review round belongs to this MOC" }
      - { name: round_number, type: integer, source: system, description: "1-based round; equals moc.review_round at creation" }
      - { name: reviewer_id, type: string, source: system, default: null, description: "FK -> Personnel.id; set from X-User-ID at verdict submission" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBMITTED" }
      - { name: design_basis_ok, type: boolean, source: input, default: null, description: "Checklist: design basis documented" }
      - { name: codes_standards_ok, type: boolean, source: input, default: null, description: "Checklist: codes & standards compliance" }
      - { name: relief_systems_ok, type: boolean, source: input, default: null, description: "Checklist: relief/venting adequacy" }
      - { name: materials_compat_ok, type: boolean, source: input, default: null, description: "Checklist: materials compatibility" }
      - { name: severity_score, type: integer, source: input, default: null, description: "1..5 definitive severity" }
      - { name: likelihood_score, type: integer, source: input, default: null, description: "1..5 definitive likelihood" }
      - { name: detection_score, type: integer, source: input, default: null, description: "1..5 detection (1=easily detected, 5=undetectable)" }
      - { name: verdict, type: enum, source: input, default: null, description: "ACCEPT | RETURN" }
      - { name: notes, type: string, source: input, default: null, description: "Optional reviewer notes" }

  - name: PhaStudy
    parent: PlantUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> PlantUnit.id; at most one PhaStudy per unit ever" }
      - { name: method, type: enum, source: input, description: "HAZOP | WHAT_IF | CHECKLIST" }
      - { name: status, type: enum, source: system, description: "CURRENT | DUE_SOON | OVERDUE | REVALIDATION_REQUIRED | IN_REVALIDATION" }
      - { name: last_validated_at, type: datetime, source: system, description: "Set from initial_validated_at at create; reset to clock date at revalidation completion" }
      - { name: nominal_next_due, type: datetime, source: computed, description: "= last_validated_at + pha_cycle_months*30 days" }
      - { name: risk_accelerated_due, type: datetime, source: computed, description: "= last_validated_at + floor(cycle_days * max(0.25, 1 - 0.1*N)); N = CLOSED HIGH/CATASTROPHIC incidents of this unit with occurred_at >= last_validated_at" }
      - { name: effective_next_due, type: datetime, source: computed, description: "= min(nominal_next_due, risk_accelerated_due)" }
      - { name: revalidation_count, type: integer, source: system, default: 0, description: "Completed revalidations" }
      - { name: status_before_revalidation, type: enum, source: system, default: null, description: "Status captured when entering IN_REVALIDATION; restored on abandon" }

  - name: PhaRevalidation
    parent: PhaStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> PhaStudy.id" }
      - { name: leader_id, type: string, source: input, description: "FK -> Personnel.id; must hold HAZOP_LEADER qualification" }
      - { name: status, type: enum, source: system, description: "OPEN | COMPLETED | ABANDONED" }
      - { name: findings_summary, type: string, source: input, default: null, description: "Required at complete" }
      - { name: findings, type: array, source: input, default: [], description: "At complete: array of { title, priority (P1|P2|P3), assignee_id } — each spawns an ActionItem sourced PHA_REVALIDATION" }

  - name: Pssr
    parent: MocRequest
    common_fields: true
    fields:
      - { name: moc_id, type: string, source: system, description: "FK -> MocRequest.id; PSSR gates this MOC's startup" }
      - { name: lead_id, type: string, source: system, description: "FK -> Personnel.id; set from X-User-ID at creation; must hold PSSR_CERTIFIED" }
      - { name: status, type: enum, source: system, description: "PLANNED | IN_FIELD | PUNCH_LIST | APPROVED | REJECTED | VOID" }
      - { name: field_window_start, type: datetime, source: input, description: "Field verification window start (day granularity); half-open interval [start, end)" }
      - { name: field_window_end, type: datetime, source: input, description: "Field verification window end (exclusive bound of the half-open interval)" }
      - { name: punch_open_count, type: integer, source: computed, default: 0, description: "Punch ActionItems sourced from this PSSR not yet VERIFIED_CLOSED/VOID" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Clock date of approval" }

  - name: ActionItem
    parent: PlantUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> PlantUnit.id; owning unit (from path, or inherited from source)" }
      - { name: source_type, type: enum, source: system, description: "MANUAL | MOC_CONDITION | PSSR | PHA_REVALIDATION | INCIDENT | AUDIT | REVERT" }
      - { name: source_id, type: string, source: system, default: null, description: "Polymorphic source reference (no single FK): MocRequest.id for MOC_CONDITION and REVERT, Pssr.id for PSSR, IncidentInvestigation.id for INCIDENT, AuditFinding.id for AUDIT, PhaStudy.id for a forced-revalidation PHA_REVALIDATION item and PhaRevalidation.id for a completion-findings PHA_REVALIDATION item; null for MANUAL" }
      - { name: title, type: string, source: input, description: "Action description" }
      - { name: priority, type: enum, source: input, description: "P1 | P2 | P3 — drives due-date SLA (30/90/180 days)" }
      - { name: assignee_id, type: string, source: input, description: "FK -> Personnel.id; must be active Personnel" }
      - { name: due_date, type: datetime, source: computed, description: "= creation clock date + SLA days (or + due_in_days override)" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | SUBMITTED_FOR_VERIFICATION | VERIFIED_CLOSED | REJECTED | VOID" }
      - { name: completer_id, type: string, source: system, default: null, description: "X-User-ID captured at submit-verification" }
      - { name: verifier_id, type: string, source: system, default: null, description: "X-User-ID captured at verify" }
      - { name: evidence_count, type: integer, source: computed, default: 0, description: "Number of EvidenceItems attached" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "+1 on each reopen from VERIFIED_CLOSED" }

  - name: EvidenceItem
    parent: ActionItem
    common_fields: false   # append-only: id + created_at only; no updated_at/version, no update/delete endpoints
    fields:
      - { name: action_item_id, type: string, source: system, description: "FK -> ActionItem.id" }
      - { name: file_ref, type: string, source: input, description: "Document/photo reference URI" }
      - { name: description, type: string, source: input, description: "What the evidence demonstrates" }
      - { name: uploaded_by, type: string, source: system, description: "FK -> Personnel.id; set from X-User-ID" }

  - name: IncidentInvestigation
    parent: PlantUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> PlantUnit.id" }
      - { name: title, type: string, source: input, description: "Incident title" }
      - { name: severity_class, type: enum, source: input, description: "MINOR | SERIOUS | HIGH | CATASTROPHIC" }
      - { name: occurred_at, type: datetime, source: input, description: "Incident date (day granularity); feeds PHA risk acceleration" }
      - { name: investigator_id, type: string, source: input, description: "FK -> Personnel.id; only this person may run RCA/findings" }
      - { name: status, type: enum, source: system, description: "OPEN | ROOT_CAUSE_ANALYSIS | FINDINGS_SUBMITTED | CLOSED" }
      - { name: feeds_pha, type: boolean, source: computed, default: false, description: "true at close when severity_class in {HIGH, CATASTROPHIC}" }

  - name: Audit
    parent: PlantUnit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: system, description: "FK -> PlantUnit.id" }
      - { name: title, type: string, source: input, description: "Audit title" }
      - { name: lead_auditor_id, type: string, source: input, description: "FK -> Personnel.id; only this person may begin fieldwork / report" }
      - { name: field_window_start, type: datetime, source: input, description: "Fieldwork window start (closed interval with 14-day separation rule)" }
      - { name: field_window_end, type: datetime, source: input, description: "Fieldwork window end (inclusive)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | FIELDWORK | REPORTED | CLOSED" }
      - { name: open_finding_count, type: integer, source: computed, default: 0, description: "Findings not yet CLOSED" }

  - name: AuditFinding
    parent: Audit
    common_fields: true
    fields:
      - { name: audit_id, type: string, source: system, description: "FK -> Audit.id" }
      - { name: title, type: string, source: input, description: "Finding description" }
      - { name: severity, type: enum, source: input, description: "OBSERVATION | MINOR_NC | MAJOR_NC — maps to corrective ActionItem priority P3|P2|P1" }
      - { name: status, type: enum, source: system, description: "OPEN | ACTION_ASSIGNED | CLOSED" }
      - { name: corrective_action_id, type: string, source: system, default: null, description: "FK -> ActionItem.id; corrective action spawned at report" }

  - name: ProcedureUpdate
    parent: MocRequest
    common_fields: true
    fields:
      - { name: moc_id, type: string, source: system, description: "FK -> MocRequest.id; procedure change required by this MOC" }
      - { name: document_ref, type: string, source: input, description: "Controlled document reference" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Clock date of publication" }

  - name: TrainingAssignment
    parent: ProcedureUpdate
    common_fields: true
    fields:
      - { name: procedure_update_id, type: string, source: system, description: "FK -> ProcedureUpdate.id" }
      - { name: personnel_id, type: string, source: input, description: "FK -> Personnel.id; trainee; unique per (procedure_update_id, personnel_id)" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock date of completion" }

  - name: ExtensionRequest
    parent: MocRequest
    common_fields: true
    fields:
      - { name: moc_id, type: string, source: system, description: "FK -> MocRequest.id; only TEMPORARY MOCs in IN_SERVICE accept extensions" }
      - { name: requested_days, type: integer, source: input, description: "1..unit.extension_max_days" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | VOID" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of deciding PsmManager" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MocRequest
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /psm/moc-requests/{id}/classify"
        actor: PsmManager
        preconditions:
          - "status == DRAFT (ERR_MOC_INVALID_STATE)"
          - "if change_class == TEMPORARY: temporary_start_date and temporary_duration_days present, 1 <= duration <= unit.temp_moc_max_days (ERR_INVALID_REQUEST / ERR_TEMP_DURATION_EXCEEDS_MAX)"
        side_effects:
          - "change_class, screening_severity, screening_likelihood stored"
          - "screening_risk_score = screening_risk_score calc; risk_rank mapped from it"
          - "requires_pssr = (change_class != REPLACEMENT_IN_KIND) or requires_pssr_override == true"
          - "if TEMPORARY: temporary_end_date = temporary_start_date + temporary_duration_days"
          - "increments MocRequest.version by 1"
      - from: CLASSIFIED
        to: TECHNICAL_REVIEW
        trigger: "POST /psm/moc-requests/{id}/submit"
        actor: Requester
        preconditions:
          - "status == CLASSIFIED (ERR_MOC_INVALID_STATE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
          - "unit.psm_posture != RESTRICTED (ERR_UNIT_POSTURE_RESTRICTED) and != FROZEN (ERR_UNIT_POSTURE_FROZEN)"
          - "unit has a PhaStudy with status in {CURRENT, DUE_SOON} (ERR_PHA_NOT_CURRENT)"
          - "change_class != REPLACEMENT_IN_KIND (RIK takes the bypass branch below)"
        side_effects:
          - "review_round += 1; a TechnicalReview(round_number = review_round, status OPEN) is created"
          - "increments MocRequest.version by 1"
      - from: CLASSIFIED
        to: APPROVAL_PENDING
        trigger: "POST /psm/moc-requests/{id}/submit"
        actor: Requester
        preconditions:
          - "status == CLASSIFIED (ERR_MOC_INVALID_STATE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
          - "unit.psm_posture != RESTRICTED and != FROZEN (ERR_UNIT_POSTURE_RESTRICTED / ERR_UNIT_POSTURE_FROZEN)"
          - "unit has a PhaStudy with status in {CURRENT, DUE_SOON} (ERR_PHA_NOT_CURRENT)"
          - "change_class == REPLACEMENT_IN_KIND (replacement-in-kind bypasses technical review)"
        side_effects:
          - "increments MocRequest.version by 1"
        note: "Class-driven branch: RIK forks directly to approval."
      - from: TECHNICAL_REVIEW
        to: RETURNED_FOR_REVISION
        trigger: "POST /psm/technical-reviews/{id}/submit-verdict with verdict == RETURN"
        actor: TechnicalReviewer
        preconditions:
          - "review.status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "MOC status == TECHNICAL_REVIEW (ERR_MOC_INVALID_STATE)"
          - "reviewer Personnel.qualifications contains MOC.discipline (ERR_QUALIFICATION_MISSING)"
          - "X-User-ID != MOC.requester_id (ERR_SOD_REVIEWER_IS_REQUESTER)"
        side_effects:
          - "review.status → SUBMITTED; reviewer_id recorded"
          - "definitive_risk_score computed (definitive_risk_score calc); risk_rank recomputed"
          - "increments MocRequest.version by 1"
      - from: RETURNED_FOR_REVISION
        to: TECHNICAL_REVIEW
        trigger: "POST /psm/moc-requests/{id}/resubmit"
        actor: Requester
        preconditions:
          - "status == RETURNED_FOR_REVISION (ERR_MOC_INVALID_STATE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "review_round += 1; a new TechnicalReview(round_number = review_round, status OPEN) is created"
          - "increments MocRequest.version by 1"
        note: "Revision cycle: TECHNICAL_REVIEW → RETURNED_FOR_REVISION → TECHNICAL_REVIEW may repeat without bound."
      - from: TECHNICAL_REVIEW
        to: APPROVAL_PENDING
        trigger: "POST /psm/technical-reviews/{id}/submit-verdict with verdict == ACCEPT"
        actor: TechnicalReviewer
        preconditions:
          - "review.status == OPEN (ERR_REVIEW_INVALID_STATE)"
          - "MOC status == TECHNICAL_REVIEW (ERR_MOC_INVALID_STATE)"
          - "all four checklist booleans true (ERR_REVIEW_CHECKLIST_INCOMPLETE)"
          - "reviewer qualification matches discipline (ERR_QUALIFICATION_MISSING)"
          - "X-User-ID != MOC.requester_id (ERR_SOD_REVIEWER_IS_REQUESTER)"
        side_effects:
          - "review.status → SUBMITTED; reviewer_id recorded"
          - "definitive_risk_score computed; risk_rank recomputed"
          - "increments MocRequest.version by 1"
      - from: APPROVAL_PENDING
        to: APPROVED_IMPLEMENTATION
        trigger: "POST /psm/moc-requests/{id}/approve"
        actor: OpsApprover
        preconditions:
          - "status == APPROVAL_PENDING (ERR_MOC_INVALID_STATE)"
          - "X-User-ID != requester_id (ERR_SOD_APPROVER_IS_REQUESTER)"
        side_effects:
          - "approver_id = X-User-ID"
          - "for each element of optional input conditions[]: spawn ActionItem(source_type MOC_CONDITION, source_id = this MOC, status OPEN, due per SLA); unit.open_action_count += number spawned; unit index/posture recomputed"
          - "increments MocRequest.version by 1"
      - from: APPROVAL_PENDING
        to: REJECTED
        trigger: "POST /psm/moc-requests/{id}/reject"
        actor: OpsApprover
        preconditions:
          - "status == APPROVAL_PENDING (ERR_MOC_INVALID_STATE)"
        side_effects: ["increments MocRequest.version by 1"]
      - from: APPROVED_IMPLEMENTATION
        to: IMPLEMENTED_PSSR_PENDING
        trigger: "POST /psm/moc-requests/{id}/mark-implemented"
        actor: Requester
        preconditions:
          - "status == APPROVED_IMPLEMENTATION (ERR_MOC_INVALID_STATE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
          - "at least one linked ProcedureUpdate in PUBLISHED (ERR_PROCEDURES_NOT_PUBLISHED)"
          - "training_coverage_pct >= unit.training_coverage_threshold_pct (ERR_TRAINING_COVERAGE_INSUFFICIENT)"
        side_effects:
          - "implemented_at = current clock date"
          - "increments MocRequest.version by 1"
      - from: IMPLEMENTED_PSSR_PENDING
        to: STARTUP_AUTHORIZED
        trigger: "POST /psm/moc-requests/{id}/authorize-startup"
        actor: PsmManager
        preconditions:
          - "status == IMPLEMENTED_PSSR_PENDING (ERR_MOC_INVALID_STATE)"
          - "unit.psm_posture != FROZEN (ERR_UNIT_POSTURE_FROZEN)"
          - "if requires_pssr: a linked Pssr with status APPROVED exists (ERR_PSSR_NOT_APPROVED)"
          - "no OPEN-class P1 ActionItem with (source_type == MOC_CONDITION and source_id == this MOC) or (source_type == PSSR and source_id in this MOC's PSSRs) (ERR_OPEN_P1_ACTION_ITEMS)"
        side_effects: ["increments MocRequest.version by 1"]
      - from: STARTUP_AUTHORIZED
        to: IN_SERVICE
        trigger: "POST /psm/moc-requests/{id}/activate"
        actor: OpsApprover
        preconditions:
          - "status == STARTUP_AUTHORIZED (ERR_MOC_INVALID_STATE)"
        side_effects: ["increments MocRequest.version by 1"]
      - from: IN_SERVICE
        to: CLOSED
        trigger: "POST /psm/moc-requests/{id}/close"
        actor: PsmManager
        preconditions:
          - "status == IN_SERVICE (ERR_MOC_INVALID_STATE)"
          - "change_class in {PERMANENT, REPLACEMENT_IN_KIND} (TEMPORARY closes only via the revert path)"
          - "no OPEN-class ActionItem with source_type == MOC_CONDITION and source_id == this MOC (ERR_OPEN_ACTION_ITEMS_BLOCK_CLOSE)"
        side_effects:
          - "closed_at = current clock date"
          - "increments MocRequest.version by 1"
      - from: IN_SERVICE
        to: EXPIRED_REVERT_REQUIRED
        trigger: "system (clock sweep: change_class == TEMPORARY and current clock > temporary_end_date)"
        actor: system
        preconditions:
          - "status == IN_SERVICE and change_class == TEMPORARY and current clock strictly after temporary_end_date"
        side_effects:
          - "spawn ActionItem(source_type REVERT, source_id = this MOC, priority P1, assignee_id = requester_id, status OPEN, due = clock + 30d); unit.open_action_count += 1; unit index/posture recomputed"
          - "increments MocRequest.version by 1"
      - from: EXPIRED_REVERT_REQUIRED
        to: CLOSED
        trigger: "system (bubble-up: the REVERT ActionItem sourced from this MOC transitions to VERIFIED_CLOSED)"
        actor: system
        preconditions:
          - "status == EXPIRED_REVERT_REQUIRED and the sourced REVERT ActionItem is VERIFIED_CLOSED"
        side_effects:
          - "closed_at = current clock date"
          - "increments MocRequest.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /psm/moc-requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "status in {DRAFT, CLASSIFIED} (ERR_MOC_INVALID_STATE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["increments MocRequest.version by 1"]
      - from: CLASSIFIED
        to: WITHDRAWN
        trigger: "POST /psm/moc-requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "status in {DRAFT, CLASSIFIED} (ERR_MOC_INVALID_STATE)"
          - "X-User-ID == requester_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["increments MocRequest.version by 1"]

  - entity: TechnicalReview
    initial_state: OPEN
    terminal_states: [SUBMITTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /psm/technical-reviews/{id}/submit-verdict"
        actor: TechnicalReviewer
        preconditions: ["see MocRequest TECHNICAL_REVIEW transitions — this transition is the child half of that guarded pair"]
        side_effects: ["reviewer_id = X-User-ID; verdict payload fields persisted"]

  - entity: PhaStudy
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: DUE_SOON
        trigger: "system (clock sweep: now >= effective_next_due - 60d and now <= effective_next_due)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CURRENT
        to: OVERDUE
        trigger: "system (clock sweep: now > effective_next_due)"
        actor: system
        preconditions: []
        side_effects: ["unit index/posture recomputed (OVERDUE contributes 25)"]
      - from: DUE_SOON
        to: OVERDUE
        trigger: "system (clock sweep: now > effective_next_due)"
        actor: system
        preconditions: []
        side_effects: ["unit index/posture recomputed"]
      - from: CURRENT
        to: REVALIDATION_REQUIRED
        trigger: "system (IncidentInvestigation closed with feeds_pha == true)"
        actor: system
        preconditions: []
        side_effects:
          - "spawn ActionItem(source_type PHA_REVALIDATION, source_id = new revalidation target — see note, priority P1, assignee_id = investigation.investigator_id, due = clock + 30d); unit.open_action_count += 1"
          - "unit index/posture recomputed (REVALIDATION_REQUIRED contributes 20)"
        note: "Cascade link 2 of the incident-close chain; the spawned item's source_id is the PhaStudy.id of the forced study."
      - from: DUE_SOON
        to: REVALIDATION_REQUIRED
        trigger: "system (IncidentInvestigation closed with feeds_pha == true)"
        actor: system
        preconditions: []
        side_effects: ["same as CURRENT → REVALIDATION_REQUIRED"]
      - from: OVERDUE
        to: REVALIDATION_REQUIRED
        trigger: "system (IncidentInvestigation closed with feeds_pha == true)"
        actor: system
        preconditions: []
        side_effects: ["same as CURRENT → REVALIDATION_REQUIRED (OVERDUE 25 no longer counts once status flips)"]
      - from: DUE_SOON
        to: IN_REVALIDATION
        trigger: "POST /psm/pha-studies/{id}/open-revalidation"
        actor: PsmManager
        preconditions:
          - "study.status in {DUE_SOON, OVERDUE, REVALIDATION_REQUIRED} (ERR_PHA_STUDY_INVALID_STATE)"
          - "leader_id references active Personnel holding HAZOP_LEADER (ERR_QUALIFICATION_MISSING)"
        side_effects:
          - "status_before_revalidation = current status; status → IN_REVALIDATION"
          - "PhaRevalidation(status OPEN) created"
          - "unit index/posture recomputed"
      - from: OVERDUE
        to: IN_REVALIDATION
        trigger: "POST /psm/pha-studies/{id}/open-revalidation"
        actor: PsmManager
        preconditions: ["same as DUE_SOON → IN_REVALIDATION"]
        side_effects: ["same as DUE_SOON → IN_REVALIDATION"]
      - from: REVALIDATION_REQUIRED
        to: IN_REVALIDATION
        trigger: "POST /psm/pha-studies/{id}/open-revalidation"
        actor: PsmManager
        preconditions: ["same as DUE_SOON → IN_REVALIDATION"]
        side_effects: ["same as DUE_SOON → IN_REVALIDATION"]
      - from: IN_REVALIDATION
        to: CURRENT
        trigger: "POST /psm/pha-revalidations/{id}/complete"
        actor: PsmManager
        preconditions:
          - "revalidation.status == OPEN (ERR_REVALIDATION_INVALID_STATE)"
        side_effects:
          - "study.last_validated_at = current clock date; revalidation_count += 1; nominal/risk-accelerated/effective dues recomputed; status → CURRENT"
          - "for each findings[] element: spawn ActionItem(source_type PHA_REVALIDATION, source_id = this revalidation, status OPEN, due per SLA); unit.open_action_count += len(findings)"
          - "unit index/posture recomputed"
      - from: IN_REVALIDATION
        to: DUE_SOON
        trigger: "POST /psm/pha-revalidations/{id}/abandon when status_before_revalidation == DUE_SOON"
        actor: PsmManager
        preconditions: ["revalidation.status == OPEN (ERR_REVALIDATION_INVALID_STATE)"]
        side_effects: ["study.status restored to status_before_revalidation; last_validated_at, dues, revalidation_count UNCHANGED (compensating invariant)"]
      - from: IN_REVALIDATION
        to: OVERDUE
        trigger: "POST /psm/pha-revalidations/{id}/abandon when status_before_revalidation == OVERDUE"
        actor: PsmManager
        preconditions: ["revalidation.status == OPEN (ERR_REVALIDATION_INVALID_STATE)"]
        side_effects: ["same restore semantics as DUE_SOON branch"]
      - from: IN_REVALIDATION
        to: REVALIDATION_REQUIRED
        trigger: "POST /psm/pha-revalidations/{id}/abandon when status_before_revalidation == REVALIDATION_REQUIRED"
        actor: PsmManager
        preconditions: ["revalidation.status == OPEN (ERR_REVALIDATION_INVALID_STATE)"]
        side_effects: ["same restore semantics as DUE_SOON branch"]

  - entity: PhaRevalidation
    initial_state: OPEN
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /psm/pha-revalidations/{id}/complete"
        actor: PsmManager
        preconditions: ["status == OPEN (ERR_REVALIDATION_INVALID_STATE)"]
        side_effects: ["drives PhaStudy IN_REVALIDATION → CURRENT (see PhaStudy machine)"]
      - from: OPEN
        to: ABANDONED
        trigger: "POST /psm/pha-revalidations/{id}/abandon"
        actor: PsmManager
        preconditions: ["status == OPEN (ERR_REVALIDATION_INVALID_STATE)"]
        side_effects: ["drives PhaStudy IN_REVALIDATION → status_before_revalidation with schedule fields unchanged"]

  - entity: Pssr
    initial_state: PLANNED
    terminal_states: [APPROVED, REJECTED, VOID]
    transitions:
      - from: PLANNED
        to: VOID
        trigger: "system (superseded by a newer PSSR creation on the same MOC)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PLANNED
        to: IN_FIELD
        trigger: "POST /psm/pssrs/{id}/begin-fieldwork"
        actor: PssrLead
        preconditions:
          - "status == PLANNED (ERR_PSSR_INVALID_STATE)"
          - "X-User-ID == lead_id (ERR_NOT_RESOURCE_OWNER)"
          - "field_window_start <= current clock <= field_window_end (ERR_FIELDWORK_WINDOW_NOT_ACTIVE)"
        side_effects: []
      - from: IN_FIELD
        to: PUNCH_LIST
        trigger: "POST /psm/pssrs/{id}/punch-items (first punch item)"
        actor: PssrLead
        preconditions:
          - "status == IN_FIELD (ERR_PSSR_INVALID_STATE)"
          - "X-User-ID == lead_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "spawn ActionItem(source_type PSSR, source_id = this PSSR, status OPEN, priority from input, due per SLA); punch_open_count += 1; unit.open_action_count += 1; unit index/posture recomputed"
      - from: IN_FIELD
        to: APPROVED
        trigger: "POST /psm/pssrs/{id}/approve"
        actor: PssrLead
        preconditions:
          - "status in {IN_FIELD, PUNCH_LIST} (ERR_PSSR_INVALID_STATE)"
          - "X-User-ID == lead_id (ERR_NOT_RESOURCE_OWNER)"
          - "X-User-ID != MOC.requester_id (ERR_SOD_PSSR_LEAD_IS_REQUESTER)"
          - "punch_open_count == 0 (ERR_PSSR_OPEN_PUNCH_ITEMS)"
          - "MOC status == IMPLEMENTED_PSSR_PENDING (ERR_MOC_INVALID_STATE)"
        side_effects: ["approved_at = current clock date"]
      - from: PUNCH_LIST
        to: APPROVED
        trigger: "POST /psm/pssrs/{id}/approve"
        actor: PssrLead
        preconditions: ["same as IN_FIELD → APPROVED"]
        side_effects: ["approved_at = current clock date"]
      - from: IN_FIELD
        to: REJECTED
        trigger: "POST /psm/pssrs/{id}/reject"
        actor: PssrLead
        preconditions:
          - "status in {IN_FIELD, PUNCH_LIST} (ERR_PSSR_INVALID_STATE)"
          - "X-User-ID == lead_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["MOC IMPLEMENTED_PSSR_PENDING → APPROVED_IMPLEMENTATION (backward branch; MOC must re-clear mark-implemented)"]
      - from: PUNCH_LIST
        to: REJECTED
        trigger: "POST /psm/pssrs/{id}/reject"
        actor: PssrLead
        preconditions: ["same as IN_FIELD → REJECTED"]
        side_effects: ["MOC IMPLEMENTED_PSSR_PENDING → APPROVED_IMPLEMENTATION"]

  - entity: ActionItem
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, VOID]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /psm/action-items/{id}/start"
        actor: "assignee (Requester | TechnicalReviewer | OpsApprover | PssrLead | Investigator | Auditor with X-User-ID == assignee_id)"
        preconditions:
          - "status in {OPEN, REJECTED} (ERR_ACTION_ITEM_INVALID_STATE)"
          - "X-User-ID == assignee_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: REJECTED
        to: IN_PROGRESS
        trigger: "POST /psm/action-items/{id}/start"
        actor: "assignee"
        preconditions: ["same as OPEN → IN_PROGRESS"]
        side_effects: []
        note: "Reopen loop: verification rejection returns work to the assignee."
      - from: IN_PROGRESS
        to: SUBMITTED_FOR_VERIFICATION
        trigger: "POST /psm/action-items/{id}/submit-verification"
        actor: "assignee"
        preconditions:
          - "status == IN_PROGRESS (ERR_ACTION_ITEM_INVALID_STATE)"
          - "X-User-ID == assignee_id (ERR_NOT_RESOURCE_OWNER)"
          - "evidence_count >= 1 (ERR_NO_EVIDENCE_ATTACHED)"
        side_effects: ["completer_id = X-User-ID"]
      - from: SUBMITTED_FOR_VERIFICATION
        to: VERIFIED_CLOSED
        trigger: "POST /psm/action-items/{id}/verify"
        actor: PsmManager
        preconditions:
          - "status == SUBMITTED_FOR_VERIFICATION (ERR_ACTION_ITEM_INVALID_STATE)"
          - "X-User-ID != completer_id (ERR_SOD_VERIFIER_IS_COMPLETER)"
        side_effects:
          - "verifier_id = X-User-ID; unit.open_action_count -= 1; unit index/posture recomputed"
          - "source bubble-ups: PSSR → pssr.punch_open_count -= 1; AUDIT → AuditFinding.status → CLOSED and audit.open_finding_count -= 1; REVERT → MocRequest EXPIRED_REVERT_REQUIRED → CLOSED; PHA_REVALIDATION / INCIDENT / MOC_CONDITION / MANUAL → none"
      - from: SUBMITTED_FOR_VERIFICATION
        to: REJECTED
        trigger: "POST /psm/action-items/{id}/reject-verification"
        actor: PsmManager
        preconditions: ["status == SUBMITTED_FOR_VERIFICATION (ERR_ACTION_ITEM_INVALID_STATE)"]
        side_effects: ["completer_id retained for audit; no count changes"]
      - from: VERIFIED_CLOSED
        to: IN_PROGRESS
        trigger: "POST /psm/action-items/{id}/reopen"
        actor: PsmManager
        preconditions: ["status == VERIFIED_CLOSED (ERR_ACTION_ITEM_INVALID_STATE)"]
        side_effects:
          - "reopen_count += 1; unit.open_action_count += 1; unit index/posture recomputed"
          - "reverse source bubble-ups: AUDIT → AuditFinding CLOSED → ACTION_ASSIGNED and audit.open_finding_count += 1; PSSR → pssr.punch_open_count += 1; others none"
        note: "Compensating action of verify: open_action_count is conserved across verify+reopen pairs."
      - from: OPEN
        to: VOID
        trigger: "POST /psm/action-items/{id}/void"
        actor: PsmManager
        preconditions: ["status in {OPEN, IN_PROGRESS, REJECTED} (ERR_ACTION_ITEM_INVALID_STATE)"]
        side_effects: ["unit.open_action_count -= 1; unit index/posture recomputed"]
      - from: IN_PROGRESS
        to: VOID
        trigger: "POST /psm/action-items/{id}/void"
        actor: PsmManager
        preconditions: ["status in {OPEN, IN_PROGRESS, REJECTED} (ERR_ACTION_ITEM_INVALID_STATE)"]
        side_effects: ["unit.open_action_count -= 1; unit index/posture recomputed"]
      - from: REJECTED
        to: VOID
        trigger: "POST /psm/action-items/{id}/void"
        actor: PsmManager
        preconditions: ["status in {OPEN, IN_PROGRESS, REJECTED} (ERR_ACTION_ITEM_INVALID_STATE)"]
        side_effects: ["unit.open_action_count -= 1; unit index/posture recomputed"]

  - entity: IncidentInvestigation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ROOT_CAUSE_ANALYSIS
        trigger: "POST /psm/incident-investigations/{id}/begin-rca"
        actor: Investigator
        preconditions:
          - "status == OPEN (ERR_INCIDENT_INVALID_STATE)"
          - "X-User-ID == investigator_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: ROOT_CAUSE_ANALYSIS
        to: FINDINGS_SUBMITTED
        trigger: "POST /psm/incident-investigations/{id}/submit-findings"
        actor: Investigator
        preconditions:
          - "status == ROOT_CAUSE_ANALYSIS (ERR_INCIDENT_INVALID_STATE)"
          - "X-User-ID == investigator_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "for each findings[] element: spawn ActionItem(source_type INCIDENT, source_id = this investigation, status OPEN, due per SLA); unit.open_action_count += len(findings); unit index/posture recomputed"
      - from: FINDINGS_SUBMITTED
        to: CLOSED
        trigger: "POST /psm/incident-investigations/{id}/close"
        actor: PsmManager
        preconditions: ["status == FINDINGS_SUBMITTED (ERR_INCIDENT_INVALID_STATE)"]
        side_effects:
          - "feeds_pha = (severity_class in {HIGH, CATASTROPHIC})"
          - "if feeds_pha and unit has a PhaStudy with status in {CURRENT, DUE_SOON, OVERDUE}: study → REVALIDATION_REQUIRED (cascade: spawns PHA_REVALIDATION ActionItem, recomputes unit index/posture)"
          - "unit index/posture recomputed (incident no longer counted as open)"

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: FIELDWORK
        trigger: "POST /psm/audits/{id}/begin-fieldwork"
        actor: Auditor
        preconditions:
          - "status == SCHEDULED (ERR_AUDIT_INVALID_STATE)"
          - "X-User-ID == lead_auditor_id (ERR_NOT_RESOURCE_OWNER)"
          - "field_window_start <= current clock <= field_window_end (ERR_FIELDWORK_WINDOW_NOT_ACTIVE)"
        side_effects: []
      - from: FIELDWORK
        to: REPORTED
        trigger: "POST /psm/audits/{id}/report"
        actor: Auditor
        preconditions:
          - "status == FIELDWORK (ERR_AUDIT_INVALID_STATE)"
          - "X-User-ID == lead_auditor_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "for each findings[] element: create AuditFinding(status OPEN) then spawn corrective ActionItem(source_type AUDIT, source_id = finding.id, priority MAJOR_NC→P1 / MINOR_NC→P2 / OBSERVATION→P3, status OPEN); finding.corrective_action_id set; finding → ACTION_ASSIGNED; audit.open_finding_count = len(findings); unit.open_action_count += len(findings); unit index/posture recomputed"
      - from: REPORTED
        to: CLOSED
        trigger: "POST /psm/audits/{id}/close"
        actor: PsmManager
        preconditions:
          - "status == REPORTED (ERR_AUDIT_INVALID_STATE)"
          - "open_finding_count == 0 (ERR_AUDIT_OPEN_FINDINGS)"
        side_effects: []

  - entity: AuditFinding
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: ACTION_ASSIGNED
        trigger: "system (created in OPEN then immediately assigned during audit report — same request)"
        actor: system
        preconditions: []
        side_effects: ["corrective_action_id set to spawned ActionItem"]
      - from: ACTION_ASSIGNED
        to: CLOSED
        trigger: "system (bubble-up: corrective_action ActionItem → VERIFIED_CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["audit.open_finding_count -= 1"]
      - from: CLOSED
        to: ACTION_ASSIGNED
        trigger: "system (bubble-up: corrective_action ActionItem reopened from VERIFIED_CLOSED)"
        actor: system
        preconditions: []
        side_effects: ["audit.open_finding_count += 1"]

  - entity: ProcedureUpdate
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /psm/procedure-updates/{id}/publish"
        actor: TrainingCoordinator
        preconditions:
          - "status == DRAFT (ERR_PROCEDURE_UPDATE_INVALID_STATE)"
          - "MOC status in {APPROVED_IMPLEMENTATION, IMPLEMENTED_PSSR_PENDING} (ERR_MOC_INVALID_STATE)"
          - "at least one TrainingAssignment exists (ERR_NO_TRAINING_ASSIGNED)"
        side_effects: ["published_at = current clock date; MOC.training_coverage_pct recomputed"]

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /psm/training-assignments/{id}/complete"
        actor: "trainee (any entity-backed role with X-User-ID == personnel_id)"
        preconditions:
          - "status == ASSIGNED (ERR_TRAINING_ASSIGNMENT_INVALID_STATE)"
          - "X-User-ID == personnel_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["completed_at = current clock date; MOC.training_coverage_pct recomputed"]

  - entity: ExtensionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, VOID]
    transitions:
      - from: PENDING
        to: VOID
        trigger: "system (superseded by a newer ExtensionRequest creation on the same MOC)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: APPROVED
        trigger: "POST /psm/extension-requests/{id}/approve"
        actor: PsmManager
        preconditions: ["status == PENDING (ERR_EXTENSION_NOT_PENDING)"]
        side_effects:
          - "moc.extension_count += 1; moc.total_approved_extension_days += requested_days; moc.temporary_end_date += requested_days; increments MocRequest.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /psm/extension-requests/{id}/deny"
        actor: PsmManager
        preconditions: ["status == PENDING (ERR_EXTENSION_NOT_PENDING)"]
        side_effects: ["no MOC date/count changes (compensating: denial leaves the extension budget unchanged)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: pssr-create-stale-moc
    parent_entity: MocRequest
    write_endpoint: "POST /psm/moc-requests/{id}/pssrs"
    occ_field: expected_moc_version
    description: |
      Creating a PSSR legitimately supersedes any existing PLANNED PSSR on the
      same MOC (the older one transitions to VOID). A create carrying an
      expected_moc_version that no longer matches MocRequest.version is rejected:
      the client's view of the MOC is stale (e.g., another writer's superseding
      create already advanced the version), so the supersede decision may not be
      based on current state.
    error_id: ERR_STALE_MOC_VERSION
    http_status: 412
  - rule_id: extension-create-stale-moc
    parent_entity: MocRequest
    write_endpoint: "POST /psm/moc-requests/{id}/extension-requests"
    occ_field: expected_moc_version
    description: |
      Creating an ExtensionRequest legitimately supersedes any existing PENDING
      ExtensionRequest on the same MOC (the older one transitions to VOID). A
      create whose expected_moc_version is stale relative to MocRequest.version
      is rejected so a supersede decision is never based on an outdated view.
    error_id: ERR_STALE_MOC_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_risk_score
    trigger: "MOC classify"
    algorithm: weighted_scoring
    formula: |
      screening_risk_score = round2(screening_severity * screening_likelihood * CLASS_MULT)
      CLASS_MULT: PERMANENT = 1.0, TEMPORARY = 1.2, REPLACEMENT_IN_KIND = 0.5
      Provisional variant of MOC risk: 2 inputs + class multiplier, no detection term.
    input_set: "the MOC being classified"
    constants: { MULT_PERMANENT: 1.0, MULT_TEMPORARY: 1.2, MULT_RIK: 0.5 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_screening
        when: "at classify"
        difference: "no detection factor, no posture branch, no min-cap — diverges from definitive variant on identical severity/likelihood"

  - name: definitive_risk_score
    trigger: "technical review verdict submission (both ACCEPT and RETURN)"
    algorithm: weighted_scoring
    formula: |
      base = min(25, severity_score * likelihood_score)
      detection_factor = 1 + (detection_score - 1) * 0.25        # det 1 → 1.00, det 5 → 2.00
      posture_factor = 1.25 if unit.process_safety_index >= 70 at verdict time else 1.0
      definitive_risk_score = round2(base * CLASS_MULT * detection_factor * posture_factor)
      risk_rank recomputed from definitive_risk_score per risk_rank_mapping.
      Non-linear: nested min-cap, detection linear ramp, conditional posture branch (mode (a)).
    input_set: "the OPEN TechnicalReview of the MOC currently in TECHNICAL_REVIEW"
    constants: { BASE_CAP: 25, DETECTION_STEP: 0.25, POSTURE_THRESHOLD: 70, POSTURE_FACTOR: 1.25 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: final_definitive
        when: "at verdict"
        difference: "adds detection ramp, min-cap and posture branch; same sev/lik as screening yields a different number (e.g. sev=3, lik=3, det=5, TEMPORARY: screening 10.80 vs definitive 21.60)"

  - name: risk_rank_mapping
    trigger: "whenever screening_risk_score or definitive_risk_score is (re)computed"
    algorithm: threshold
    formula: |
      score < 5 → LOW; 5 <= score < 12 → MEDIUM; 12 <= score < 20 → HIGH; score >= 20 → CRITICAL
      Boundaries are inclusive on the lower side: exactly 12.00 is HIGH, exactly 20.00 is CRITICAL.
    input_set: "single score value"
    constants: { MEDIUM_MIN: 5, HIGH_MIN: 12, CRITICAL_MIN: 20 }
    precision: "exact band comparison on the 2dp score"

  - name: pha_nominal_next_due
    trigger: "study create, revalidation complete, unit config change (pha_cycle_months)"
    algorithm: forward_looking
    formula: |
      nominal_next_due = last_validated_at + pha_cycle_months * 30 days
      Calendar variant: pure cycle arithmetic, ignores incidents.
    input_set: "the PhaStudy and its unit config"
    constants: { DAYS_PER_MONTH: 30 }
    precision: "day granularity (UTC midnight)"

  - name: pha_risk_accelerated_due
    trigger: "study create, incident close, revalidation complete/abandon, unit config change"
    algorithm: forward_looking
    formula: |
      N = count of IncidentInvestigation rows of this unit with status == CLOSED,
          severity_class in {HIGH, CATASTROPHIC}, occurred_at >= last_validated_at
      cycle_days = pha_cycle_months * 30
      risk_accelerated_due = last_validated_at + floor(cycle_days * max(0.25, 1 - 0.1 * N)) days
      effective_next_due = min(nominal_next_due, risk_accelerated_due)
      Risk variant: incident-driven compression with a 25% floor — diverges from the
      nominal calendar variant whenever N >= 1 (e.g. cycle 360d, N=1 → 324d vs 360d).
    input_set: "the PhaStudy, its unit's CLOSED incident investigations, unit config"
    constants: { ACCEL_PER_INCIDENT: 0.1, ACCEL_FLOOR: 0.25 }
    precision: "floor to whole days, day granularity"

  - name: action_item_due_sla
    trigger: "ActionItem creation (any spawn path)"
    algorithm: threshold
    formula: |
      due_date = creation_clock_date + SLA days, where SLA: P1 = 30, P2 = 90, P3 = 180;
      if the spawn endpoint accepts due_in_days override, due_date = creation_clock_date + due_in_days.
      An item is overdue iff due_date < current clock (strictly; due exactly today is NOT overdue).
    input_set: "the new ActionItem"
    constants: { P1_DAYS: 30, P2_DAYS: 90, P3_DAYS: 180 }
    precision: "day granularity; strict-less-than overdue comparison"

  - name: training_coverage_pct
    trigger: "ProcedureUpdate publish, TrainingAssignment create/complete, read of MocRequest"
    algorithm: aggregation
    formula: |
      For each linked ProcedureUpdate with status == PUBLISHED:
        coverage_u = round2(100.00 * completed_assignments / total_assignments)   # per-update FIRST
      MOC.training_coverage_pct = round2( sum(coverage_u) / count(published updates) )
      Pinned rounding order (mode (b)): round each per-update coverage to 2dp half-up FIRST,
      then average and round again. Aggregate-then-round (round2(100*Σcompleted/Σtotal)) is a
      different, non-conforming number (e.g. completions 2/3 and 3/4 → pinned 70.84 vs naive 71.43).
      DRAFT updates are excluded from both numerator and denominator. A PUBLISHED update with
      zero assignments cannot exist (publish requires >= 1 assignment).
    input_set: "PUBLISHED ProcedureUpdates of the MOC and their TrainingAssignments"
    precision: "2 decimal places, round_half_up at both rounding steps"

  - name: unit_process_safety_index
    trigger: "clock sweep, ActionItem create/verify/reopen/void, incident create/close, audit report, revalidation open/complete/abandon, study status change"
    algorithm: constraint_propagation
    formula: |
      Two-phase evaluation order is PINNED (mode (c) — the inputs reference state that
      itself was derived from earlier index snapshots, so the phases must not interleave):
      Phase 1 (snapshot counts at current clock):
        overdue = ActionItems of unit in {OPEN, IN_PROGRESS, SUBMITTED_FOR_VERIFICATION, REJECTED}
                  with due_date < current clock
        study_overdue = 1 if unit's PhaStudy status == OVERDUE else 0
        study_forced  = 1 if unit's PhaStudy status == REVALIDATION_REQUIRED else 0
        open_high_inc = IncidentInvestigations with status != CLOSED and severity_class in {HIGH, CATASTROPHIC}
        open_major_nc = AuditFindings of unit's audits with severity == MAJOR_NC and status != CLOSED
      Phase 2 (compose):
        index = min(100, 15*overdue + 25*study_overdue + 20*study_forced + 10*open_high_inc + 5*open_major_nc)
        psm_posture = NORMAL if index < 40; RESTRICTED if 40 <= index < 70; FROZEN if index >= 70
      Band boundaries are inclusive-low: exactly 40 is RESTRICTED, exactly 70 is FROZEN.
      Note: ActionItem due dates were assigned from SLAs and MOC risk ranks that used earlier
      index values — the index is always recomputed from Phase-1 snapshots, never from a
      partially updated index; no fixed-point iteration.
    input_set: "unit's action items, PHA study, incident investigations, audit findings"
    constants: { OVERDUE_W: 15, STUDY_OVERDUE_W: 25, STUDY_FORCED_W: 20, HIGH_INCIDENT_W: 10, MAJOR_NC_W: 5, INDEX_CAP: 100, RESTRICTED_MIN: 40, FROZEN_MIN: 70 }
    precision: "integer arithmetic; exact band comparison"

  - name: extension_end_date_arithmetic
    trigger: "ExtensionRequest create (validation), approve (application)"
    algorithm: aggregation
    formula: |
      At create: candidate_end = temporary_end_date + requested_days
      Reject unless: requested_days <= unit.extension_max_days (ERR_TEMP_EXTENSION_EXCEEDS_MAX_DAYS)
                     moc.extension_count < unit.max_extensions (ERR_MAX_EXTENSIONS_REACHED — checked first)
                     candidate_end <= temporary_start_date + unit.total_temp_cap_days (ERR_TEMP_TOTAL_CAP_EXCEEDED)
      At approve: temporary_end_date += requested_days; extension_count += 1;
                  total_approved_extension_days += requested_days
      At deny: all three MOC fields unchanged.
    input_set: "the MOC and its unit config"
    precision: "day granularity; <= comparisons inclusive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (unit before moc before child)"
    error_id: "ERR_UNIT_NOT_FOUND | ERR_PERSONNEL_NOT_FOUND | ERR_MOC_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_PHA_STUDY_NOT_FOUND | ERR_REVALIDATION_NOT_FOUND | ERR_PSSR_NOT_FOUND | ERR_ACTION_ITEM_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_PROCEDURE_UPDATE_NOT_FOUND | ERR_TRAINING_ASSIGNMENT_NOT_FOUND | ERR_EXTENSION_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 4
    category: existence
    check: "OCC: expected_moc_version equals current MocRequest.version (before any business check)"
    error_id: ERR_STALE_MOC_VERSION
    http_status: 412
    applies_to: "POST /psm/moc-requests/{id}/pssrs, POST /psm/moc-requests/{id}/extension-requests"
  - priority: 5
    category: state
    check: "Target entity in a valid from-state for the transition (per §1.2 preconditions)"
    error_id: "ERR_MOC_INVALID_STATE | ERR_REVIEW_INVALID_STATE | ERR_PHA_STUDY_INVALID_STATE | ERR_REVALIDATION_INVALID_STATE | ERR_PSSR_INVALID_STATE | ERR_ACTION_ITEM_INVALID_STATE | ERR_INCIDENT_INVALID_STATE | ERR_AUDIT_INVALID_STATE | ERR_PROCEDURE_UPDATE_INVALID_STATE | ERR_TRAINING_ASSIGNMENT_INVALID_STATE | ERR_EXTENSION_NOT_PENDING"
    http_status: 409
    applies_to: all action endpoints
  - priority: 6.0
    category: business_safety
    check: "Ownership: X-User-ID equals the owning field (requester_id / assignee_id / lead_id / investigator_id / lead_auditor_id / personnel_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "submit, resubmit, withdraw, mark-implemented, extension create, action-item start/submit-verification/evidence upload, pssr begin-fieldwork/punch/approve/reject, incident begin-rca/submit-findings, audit begin-fieldwork/report, training complete"
  - priority: 6.1
    category: business_safety
    check: "Qualification: reviewer holds MOC.discipline; PSSR lead holds PSSR_CERTIFIED; revalidation leader holds HAZOP_LEADER; assignee/trainee/leader Personnel.active == true"
    error_id: ERR_QUALIFICATION_MISSING
    http_status: 403
    applies_to: "submit-verdict, pssr create, open-revalidation, action-item create/spawn, training assign"
  - priority: 6.2
    category: business_safety
    check: "Segregation of duties: reviewer != requester; approver != requester; PSSR lead != requester; verifier != completer"
    error_id: "ERR_SOD_REVIEWER_IS_REQUESTER | ERR_SOD_APPROVER_IS_REQUESTER | ERR_SOD_PSSR_LEAD_IS_REQUESTER | ERR_SOD_VERIFIER_IS_COMPLETER"
    http_status: 403
    applies_to: "submit-verdict, approve, pssr approve, action-item verify"
  - priority: 6.3
    category: business_safety
    check: "Posture gates: unit FROZEN blocks moc create and authorize-startup; unit RESTRICTED or FROZEN blocks submit/resubmit-free transitions per §1.2"
    error_id: "ERR_UNIT_POSTURE_FROZEN | ERR_UNIT_POSTURE_RESTRICTED"
    http_status: 403
    applies_to: "moc create, submit, authorize-startup"
  - priority: 6.4
    category: business_safety
    check: "Checklist integrity: verdict ACCEPT requires all four checklist booleans true"
    error_id: ERR_REVIEW_CHECKLIST_INCOMPLETE
    http_status: 422
    applies_to: "POST /psm/technical-reviews/{id}/submit-verdict"
  - priority: 7
    category: business_temporal
    check: "Clock-window checks: fieldwork begin inside declared window; expiry sweep boundaries; PHA study exists and in CURRENT/DUE_SOON at submit"
    error_id: "ERR_FIELDWORK_WINDOW_NOT_ACTIVE | ERR_PHA_NOT_CURRENT"
    http_status: 409
    applies_to: "begin-fieldwork (pssr/audit), submit"
  - priority: 7.5
    category: business_temporal
    check: "Logical clock is monotonic: to_iso8601 must be >= current logical time"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 409
    applies_to: "POST /psm/_clock/set_current_utc"
  - priority: 8.0
    category: business_constraint
    check: "Kind/class constraints: extensions only for TEMPORARY MOCs; TEMPORARY classify requires both dates"
    error_id: "ERR_MOC_NOT_TEMPORARY | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "classify, extension create"
  - priority: 8.1
    category: business_constraint
    check: "Numeric caps in pinned order: ERR_MAX_EXTENSIONS_REACHED, then ERR_TEMP_EXTENSION_EXCEEDS_MAX_DAYS, then ERR_TEMP_TOTAL_CAP_EXCEEDED; classify duration ERR_TEMP_DURATION_EXCEEDS_MAX"
    error_id: "ERR_MAX_EXTENSIONS_REACHED | ERR_TEMP_EXTENSION_EXCEEDS_MAX_DAYS | ERR_TEMP_TOTAL_CAP_EXCEEDED | ERR_TEMP_DURATION_EXCEEDS_MAX"
    http_status: 422
    applies_to: "extension create, classify"
  - priority: 8.2
    category: business_constraint
    check: "Uniqueness: unit_code unique; employee_ref unique; one PhaStudy per unit; one TrainingAssignment per (procedure_update, personnel)"
    error_id: "ERR_UNIT_CODE_EXISTS | ERR_EMPLOYEE_REF_EXISTS | ERR_PHA_STUDY_EXISTS | ERR_DUPLICATE_TRAINING_ASSIGNMENT"
    http_status: 409
    applies_to: "unit create, personnel create, pha-study create, training assign"
  - priority: 8.3
    category: business_constraint
    check: "Temporal overlap: PSSR half-open window overlap on same unit; audit 14-day buffered separation on same unit"
    error_id: "ERR_PSSR_WINDOW_OVERLAP | ERR_AUDIT_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "pssr create, audit create"
  - priority: 9
    category: business_referential
    check: "Cross-entity completion gates: PSSR approved, no open P1 items, procedures published, coverage sufficient, no evidence, open findings, open condition items, punch items closed"
    error_id: "ERR_PSSR_NOT_APPROVED | ERR_OPEN_P1_ACTION_ITEMS | ERR_PROCEDURES_NOT_PUBLISHED | ERR_TRAINING_COVERAGE_INSUFFICIENT | ERR_NO_EVIDENCE_ATTACHED | ERR_AUDIT_OPEN_FINDINGS | ERR_OPEN_ACTION_ITEMS_BLOCK_CLOSE | ERR_PSSR_OPEN_PUNCH_ITEMS | ERR_NO_TRAINING_ASSIGNED"
    http_status: 409
    applies_to: "authorize-startup, mark-implemented, submit-verification, audit close, moc close, pssr approve, procedure publish"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock (logical time; default 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/psm/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. to_iso8601 must be >= current logical time (ERR_CLOCK_REGRESSION). Each set runs the expiry/overdue sweep: PHA DUE_SOON/OVERDUE transitions, TEMPORARY IN_SERVICE expiry, overdue counts, index/posture recompute."
    roles: [PsmAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["clock advance sweep (see §1.2 system transitions and unit_process_safety_index calc)"]

  # --- PlantUnit ---
  - method: POST
    path: "/psm/units"
    description: "Create a PlantUnit (config entity)"
    roles: [PsmAdmin]
    code: 201
    input: [name, unit_code, pha_cycle_months, "temp_moc_max_days?", "max_extensions?", "extension_max_days?", "total_temp_cap_days?", "training_coverage_threshold_pct?"]
    output: PlantUnit
    side_effects: ["posture NORMAL, counts 0"]
  - method: GET
    path: "/psm/units"
    description: "List PlantUnits (paginated)"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "PlantUnit[]"
    side_effects: []
  - method: GET
    path: "/psm/units/{id}"
    description: "Get a PlantUnit with fresh computed counts/index/posture"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: PlantUnit
    side_effects: []
  - method: PATCH
    path: "/psm/units/{id}"
    description: "Update unit config; recomputes PHA dues and posture"
    roles: [PsmAdmin]
    code: 200
    input: ["name?", "pha_cycle_months?", "temp_moc_max_days?", "max_extensions?", "extension_max_days?", "total_temp_cap_days?", "training_coverage_threshold_pct?"]
    output: PlantUnit
    side_effects: ["nominal/risk-accelerated/effective dues recomputed", "index/posture recomputed", "increments PlantUnit.version by 1"]

  # --- Personnel ---
  - method: POST
    path: "/psm/personnel"
    description: "Create a Personnel record"
    roles: [PsmAdmin]
    code: 201
    input: [full_name, employee_ref, "qualifications?", "active?"]
    output: Personnel
    side_effects: []
  - method: GET
    path: "/psm/personnel"
    description: "List Personnel (paginated)"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "Personnel[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}"
    description: "Get a Personnel record"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Personnel
    side_effects: []

  # --- MocRequest ---
  - method: POST
    path: "/psm/units/{unitId}/moc-requests"
    description: "Create a MOC in DRAFT; requester_id = X-User-ID. Blocked when unit FROZEN."
    roles: [Requester]
    code: 201
    input: [title, description, discipline]
    output: MocRequest
    side_effects: ["status DRAFT; version 1"]
  - method: GET
    path: "/psm/moc-requests/{id}"
    description: "Get a MOC"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: MocRequest
    side_effects: []
  - method: GET
    path: "/psm/units/{id}/moc-requests"
    description: "List MOCs of a unit"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "MocRequest[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/moc-requests"
    description: "List MOCs requested or approved by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "MocRequest[]"
    side_effects: []
  - method: POST
    path: "/psm/moc-requests/{id}/classify"
    description: "Classify a DRAFT MOC; computes screening_risk_score and risk_rank; sets requires_pssr; TEMPORARY requires dates and duration <= unit.temp_moc_max_days"
    roles: [PsmManager]
    code: 200
    input: [change_class, screening_severity, screening_likelihood, "requires_pssr_override?", "temporary_start_date?", "temporary_duration_days?"]
    output: MocRequest
    side_effects: ["DRAFT → CLASSIFIED; screening calc; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/submit"
    description: "Submit classified MOC; RIK bypasses to APPROVAL_PENDING, others enter TECHNICAL_REVIEW and spawn review round 1"
    roles: [Requester]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["CLASSIFIED → TECHNICAL_REVIEW or APPROVAL_PENDING; TechnicalReview round 1 created for non-RIK; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/resubmit"
    description: "Resubmit a RETURNED_FOR_REVISION MOC; review_round += 1 and a fresh OPEN TechnicalReview is created"
    roles: [Requester]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["RETURNED_FOR_REVISION → TECHNICAL_REVIEW; new review round; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/approve"
    description: "Approve for implementation; optional conditions[] spawn MOC_CONDITION action items; approver != requester (SoD)"
    roles: [OpsApprover]
    code: 200
    input: ["conditions?"]
    output: MocRequest
    side_effects: ["APPROVAL_PENDING → APPROVED_IMPLEMENTATION; approver_id set; condition items spawned; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/reject"
    description: "Reject an APPROVAL_PENDING MOC (terminal)"
    roles: [OpsApprover]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["APPROVAL_PENDING → REJECTED; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/withdraw"
    description: "Withdraw a DRAFT/CLASSIFIED MOC (terminal); owner only"
    roles: [Requester]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["→ WITHDRAWN; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/mark-implemented"
    description: "Mark implementation complete; requires >=1 PUBLISHED ProcedureUpdate and training_coverage_pct >= unit threshold"
    roles: [Requester]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["APPROVED_IMPLEMENTATION → IMPLEMENTED_PSSR_PENDING; implemented_at set; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/authorize-startup"
    description: "PSSR gate: requires APPROVED PSSR (when requires_pssr), no open P1 items sourced to MOC/PSSR, unit not FROZEN"
    roles: [PsmManager]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["IMPLEMENTED_PSSR_PENDING → STARTUP_AUTHORIZED; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/activate"
    description: "Place a STARTUP_AUTHORIZED MOC in service"
    roles: [OpsApprover]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["STARTUP_AUTHORIZED → IN_SERVICE; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/moc-requests/{id}/close"
    description: "Close a PERMANENT/RIK MOC in IN_SERVICE; blocked by open MOC_CONDITION items"
    roles: [PsmManager]
    code: 200
    input: []
    output: MocRequest
    side_effects: ["IN_SERVICE → CLOSED; closed_at set; increments MocRequest.version by 1"]

  # --- TechnicalReview ---
  - method: GET
    path: "/psm/moc-requests/{id}/technical-reviews"
    description: "List review rounds of a MOC (ascending round_number)"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "TechnicalReview[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/technical-reviews"
    description: "List reviews submitted by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "TechnicalReview[]"
    side_effects: []
  - method: POST
    path: "/psm/technical-reviews/{id}/submit-verdict"
    description: "Submit review verdict; computes definitive_risk_score; ACCEPT requires full checklist; RETURN loops MOC back"
    roles: [TechnicalReviewer]
    code: 200
    input: [design_basis_ok, codes_standards_ok, relief_systems_ok, materials_compat_ok, severity_score, likelihood_score, detection_score, verdict, "notes?"]
    output: TechnicalReview
    side_effects: ["review OPEN → SUBMITTED; MOC TECHNICAL_REVIEW → APPROVAL_PENDING (ACCEPT) or RETURNED_FOR_REVISION (RETURN); definitive calc; increments MocRequest.version by 1"]

  # --- PhaStudy / PhaRevalidation ---
  - method: POST
    path: "/psm/units/{unitId}/pha-studies"
    description: "Create the unit's PHA study (at most one per unit); last_validated_at = initial_validated_at"
    roles: [PsmManager]
    code: 201
    input: [method, initial_validated_at]
    output: PhaStudy
    side_effects: ["status CURRENT; dues computed; revalidation_count 0"]
  - method: GET
    path: "/psm/units/{id}/pha-studies"
    description: "List PHA studies of a unit (0 or 1 element)"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "PhaStudy[]"
    side_effects: []
  - method: GET
    path: "/psm/pha-studies/{id}"
    description: "Get a PHA study"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: PhaStudy
    side_effects: []
  - method: POST
    path: "/psm/pha-studies/{id}/open-revalidation"
    description: "Open a revalidation (leader must hold HAZOP_LEADER); study status_before_revalidation captured, status → IN_REVALIDATION"
    roles: [PsmManager]
    code: 201
    input: [leader_id]
    output: PhaRevalidation
    side_effects: ["study → IN_REVALIDATION; posture recompute"]
  - method: GET
    path: "/psm/pha-studies/{id}/revalidations"
    description: "List revalidations of a study"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "PhaRevalidation[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/pha-revalidations"
    description: "List revalidations led by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "PhaRevalidation[]"
    side_effects: []
  - method: POST
    path: "/psm/pha-revalidations/{id}/complete"
    description: "Complete revalidation: last_validated_at = clock date, study → CURRENT, findings[] spawn ActionItems"
    roles: [PsmManager]
    code: 200
    input: [findings_summary, "findings?"]
    output: PhaRevalidation
    side_effects: ["revalidation → COMPLETED; study schedule reset; findings spawn items; posture recompute"]
  - method: POST
    path: "/psm/pha-revalidations/{id}/abandon"
    description: "Abandon revalidation: study returns to status_before_revalidation with schedule fields unchanged"
    roles: [PsmManager]
    code: 200
    input: []
    output: PhaRevalidation
    side_effects: ["revalidation → ABANDONED; study status restored; last_validated_at/dues/revalidation_count unchanged; posture recompute"]

  # --- PSSR ---
  - method: POST
    path: "/psm/moc-requests/{id}/pssrs"
    description: "Create a PSSR (lead = X-User-ID, must hold PSSR_CERTIFIED). Supersedes any PLANNED PSSR on the same MOC (→ VOID). OCC: expected_moc_version must match. MOC must be APPROVED_IMPLEMENTATION or IMPLEMENTED_PSSR_PENDING. Half-open window overlap check [start, end) against every PSSR in PLANNED/IN_FIELD/PUNCH_LIST on the same UNIT (any MOC), excluding the same-MOC sibling being superseded; adjacency (new.start == existing.end) is allowed."
    roles: [PssrLead]
    code: 201
    input: [field_window_start, field_window_end, expected_moc_version]
    output: Pssr
    side_effects: ["prior PLANNED PSSR → VOID; status PLANNED; increments MocRequest.version by 1"]
  - method: GET
    path: "/psm/moc-requests/{id}/pssrs"
    description: "List PSSRs of a MOC"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "Pssr[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/pssrs"
    description: "List PSSRs led by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "Pssr[]"
    side_effects: []
  - method: GET
    path: "/psm/pssrs/{id}"
    description: "Get a PSSR"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Pssr
    side_effects: []
  - method: POST
    path: "/psm/pssrs/{id}/begin-fieldwork"
    description: "Begin field verification; clock must be inside [field_window_start, field_window_end]"
    roles: [PssrLead]
    code: 200
    input: []
    output: Pssr
    side_effects: ["PLANNED → IN_FIELD"]
  - method: POST
    path: "/psm/pssrs/{id}/punch-items"
    description: "Raise a punch item; spawns a PSSR ActionItem; first punch moves PSSR to PUNCH_LIST"
    roles: [PssrLead]
    code: 201
    input: [title, priority, assignee_id]
    output: ActionItem
    side_effects: ["ActionItem OPEN created; pssr.punch_open_count += 1; unit.open_action_count += 1; IN_FIELD → PUNCH_LIST"]
  - method: POST
    path: "/psm/pssrs/{id}/approve"
    description: "Approve PSSR; requires punch_open_count == 0, MOC IMPLEMENTED_PSSR_PENDING, lead != MOC requester (SoD)"
    roles: [PssrLead]
    code: 200
    input: []
    output: Pssr
    side_effects: ["→ APPROVED; approved_at set"]
  - method: POST
    path: "/psm/pssrs/{id}/reject"
    description: "Reject PSSR; MOC falls back IMPLEMENTED_PSSR_PENDING → APPROVED_IMPLEMENTATION"
    roles: [PssrLead]
    code: 200
    input: []
    output: Pssr
    side_effects: ["→ REJECTED; MOC → APPROVED_IMPLEMENTATION"]

  # --- ActionItem / Evidence ---
  - method: POST
    path: "/psm/units/{unitId}/action-items"
    description: "Create a manual ActionItem (source_type MANUAL)"
    roles: [PsmManager]
    code: 201
    input: [title, priority, assignee_id, "due_in_days?"]
    output: ActionItem
    side_effects: ["status OPEN; due_date = clock + SLA (or override); unit.open_action_count += 1; posture recompute"]
  - method: GET
    path: "/psm/units/{id}/action-items"
    description: "List action items of a unit"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?", "status?", "priority?"]
    output: "ActionItem[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/action-items"
    description: "List action items assigned to a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "ActionItem[]"
    side_effects: []
  - method: GET
    path: "/psm/action-items/{id}"
    description: "Get an action item"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ActionItem
    side_effects: []
  - method: POST
    path: "/psm/action-items/{id}/start"
    description: "Assignee starts (or restarts after REJECTED) work"
    roles: [Requester, TechnicalReviewer, OpsApprover, PssrLead, Investigator, Auditor]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["OPEN/REJECTED → IN_PROGRESS"]
  - method: POST
    path: "/psm/action-items/{id}/submit-verification"
    description: "Assignee submits for verification; requires evidence_count >= 1; records completer_id"
    roles: [Requester, TechnicalReviewer, OpsApprover, PssrLead, Investigator, Auditor]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["IN_PROGRESS → SUBMITTED_FOR_VERIFICATION; completer_id set"]
  - method: POST
    path: "/psm/action-items/{id}/verify"
    description: "Verify closure; verifier != completer (SoD); open count decrements; source bubble-ups fire"
    roles: [PsmManager]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["→ VERIFIED_CLOSED; unit.open_action_count -= 1; source bubble-ups (PSSR punch count, AuditFinding CLOSED, MOC revert close); posture recompute"]
  - method: POST
    path: "/psm/action-items/{id}/reject-verification"
    description: "Reject closure; item returns toward assignee (REJECTED)"
    roles: [PsmManager]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["SUBMITTED_FOR_VERIFICATION → REJECTED"]
  - method: POST
    path: "/psm/action-items/{id}/reopen"
    description: "Reopen a VERIFIED_CLOSED item (compensating action of verify)"
    roles: [PsmManager]
    code: 200
    input: [reason]
    output: ActionItem
    side_effects: ["VERIFIED_CLOSED → IN_PROGRESS; reopen_count += 1; unit.open_action_count += 1; reverse bubble-ups; posture recompute"]
  - method: POST
    path: "/psm/action-items/{id}/void"
    description: "Void an open-class item (terminal)"
    roles: [PsmManager]
    code: 200
    input: []
    output: ActionItem
    side_effects: ["→ VOID; unit.open_action_count -= 1; posture recompute"]
  - method: POST
    path: "/psm/action-items/{id}/evidence-items"
    description: "Attach closure evidence (assignee only; item must be OPEN/IN_PROGRESS/REJECTED)"
    roles: [Requester, TechnicalReviewer, OpsApprover, PssrLead, Investigator, Auditor]
    code: 201
    input: [file_ref, description]
    output: EvidenceItem
    side_effects: ["evidence_count += 1"]
  - method: GET
    path: "/psm/action-items/{id}/evidence-items"
    description: "List evidence of an action item"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/evidence-items"
    description: "List evidence uploaded by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "EvidenceItem[]"
    side_effects: []
  - method: GET
    path: "/psm/action-items/{id}/audit-findings"
    description: "List audit findings whose corrective_action is this item (0 or 1)"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditFinding[]"
    side_effects: []

  # --- IncidentInvestigation ---
  - method: POST
    path: "/psm/units/{unitId}/incident-investigations"
    description: "Open an incident investigation"
    roles: [PsmManager]
    code: 201
    input: [title, severity_class, occurred_at, investigator_id]
    output: IncidentInvestigation
    side_effects: ["status OPEN; unit index/posture recomputed (open HIGH/CATASTROPHIC contributes 10)"]
  - method: GET
    path: "/psm/units/{id}/incident-investigations"
    description: "List investigations of a unit"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "IncidentInvestigation[]"
    side_effects: []
  - method: GET
    path: "/psm/incident-investigations/{id}"
    description: "Get an investigation"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: IncidentInvestigation
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/incident-investigations"
    description: "List investigations owned by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "IncidentInvestigation[]"
    side_effects: []
  - method: POST
    path: "/psm/incident-investigations/{id}/begin-rca"
    description: "Begin root-cause analysis (assigned investigator only)"
    roles: [Investigator]
    code: 200
    input: []
    output: IncidentInvestigation
    side_effects: ["OPEN → ROOT_CAUSE_ANALYSIS"]
  - method: POST
    path: "/psm/incident-investigations/{id}/submit-findings"
    description: "Submit findings; each spawns an INCIDENT ActionItem"
    roles: [Investigator]
    code: 200
    input: [findings]
    output: IncidentInvestigation
    side_effects: ["→ FINDINGS_SUBMITTED; items spawned; counts/index recomputed"]
  - method: POST
    path: "/psm/incident-investigations/{id}/close"
    description: "Close investigation; HIGH/CATASTROPHIC forces PHA revalidation cascade"
    roles: [PsmManager]
    code: 200
    input: []
    output: IncidentInvestigation
    side_effects: ["→ CLOSED; feeds_pha set; forced revalidation cascade; dues recomputed; posture recomputed"]

  # --- Audit / AuditFinding ---
  - method: POST
    path: "/psm/units/{unitId}/audits"
    description: "Schedule an audit; 14-day buffered separation vs other SCHEDULED/FIELDWORK/REPORTED audits of the same unit"
    roles: [PsmManager]
    code: 201
    input: [title, lead_auditor_id, field_window_start, field_window_end]
    output: Audit
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/psm/units/{id}/audits"
    description: "List audits of a unit"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "Audit[]"
    side_effects: []
  - method: GET
    path: "/psm/audits/{id}"
    description: "Get an audit"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: Audit
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/audits"
    description: "List audits led by a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "Audit[]"
    side_effects: []
  - method: GET
    path: "/psm/audits/{id}/findings"
    description: "List findings of an audit"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditFinding[]"
    side_effects: []
  - method: POST
    path: "/psm/audits/{id}/begin-fieldwork"
    description: "Begin fieldwork (lead auditor only; clock inside window)"
    roles: [Auditor]
    code: 200
    input: []
    output: Audit
    side_effects: ["SCHEDULED → FIELDWORK"]
  - method: POST
    path: "/psm/audits/{id}/report"
    description: "Report findings[] {title, severity, assignee_id}; each spawns a corrective ActionItem (MAJOR_NC→P1, MINOR_NC→P2, OBSERVATION→P3)"
    roles: [Auditor]
    code: 200
    input: [findings]
    output: Audit
    side_effects: ["→ REPORTED; findings created OPEN → ACTION_ASSIGNED; corrective items spawned; open_finding_count set; unit counts/index recomputed"]
  - method: POST
    path: "/psm/audits/{id}/close"
    description: "Close audit; requires open_finding_count == 0"
    roles: [PsmManager]
    code: 200
    input: []
    output: Audit
    side_effects: ["REPORTED → CLOSED"]

  # --- ProcedureUpdate / TrainingAssignment ---
  - method: POST
    path: "/psm/moc-requests/{id}/procedure-updates"
    description: "Create a procedure update linked to a MOC"
    roles: [TrainingCoordinator]
    code: 201
    input: [document_ref]
    output: ProcedureUpdate
    side_effects: ["status DRAFT; MOC.training_coverage_pct recomputed"]
  - method: GET
    path: "/psm/moc-requests/{id}/procedure-updates"
    description: "List procedure updates of a MOC"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "ProcedureUpdate[]"
    side_effects: []
  - method: GET
    path: "/psm/procedure-updates/{id}"
    description: "Get a procedure update"
    roles: *ALL_ROLES
    code: 200
    input: []
    output: ProcedureUpdate
    side_effects: []
  - method: POST
    path: "/psm/procedure-updates/{id}/publish"
    description: "Publish; requires MOC in APPROVED_IMPLEMENTATION/IMPLEMENTED_PSSR_PENDING and >= 1 assignment"
    roles: [TrainingCoordinator]
    code: 200
    input: []
    output: ProcedureUpdate
    side_effects: ["DRAFT → PUBLISHED; published_at set; MOC.training_coverage_pct recomputed"]
  - method: POST
    path: "/psm/procedure-updates/{id}/training-assignments"
    description: "Assign training to a person; unique per (update, personnel)"
    roles: [TrainingCoordinator]
    code: 201
    input: [personnel_id]
    output: TrainingAssignment
    side_effects: ["status ASSIGNED; MOC.training_coverage_pct recomputed"]
  - method: GET
    path: "/psm/procedure-updates/{id}/training-assignments"
    description: "List assignments of an update"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "TrainingAssignment[]"
    side_effects: []
  - method: GET
    path: "/psm/personnel/{id}/training-assignments"
    description: "List assignments of a person"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "TrainingAssignment[]"
    side_effects: []
  - method: POST
    path: "/psm/training-assignments/{id}/complete"
    description: "Trainee completes assignment (X-User-ID == personnel_id)"
    roles: [Requester, TechnicalReviewer, OpsApprover, PssrLead, Investigator, Auditor]
    code: 200
    input: []
    output: TrainingAssignment
    side_effects: ["ASSIGNED → COMPLETED; completed_at set; MOC.training_coverage_pct recomputed"]

  # --- ExtensionRequest ---
  - method: POST
    path: "/psm/moc-requests/{id}/extension-requests"
    description: "Request a temporary-extension (owner only; TEMPORARY MOC in IN_SERVICE). Supersedes any PENDING extension (→ VOID). OCC: expected_moc_version must match. Cap order: count, then per-extension days, then total cap."
    roles: [Requester]
    code: 201
    input: [requested_days, expected_moc_version]
    output: ExtensionRequest
    side_effects: ["prior PENDING extension → VOID; status PENDING; increments MocRequest.version by 1"]
  - method: GET
    path: "/psm/moc-requests/{id}/extension-requests"
    description: "List extension requests of a MOC"
    roles: *ALL_ROLES
    code: 200
    input: ["limit?", "offset?"]
    output: "ExtensionRequest[]"
    side_effects: []
  - method: POST
    path: "/psm/extension-requests/{id}/approve"
    description: "Approve extension: end date += requested_days, count += 1"
    roles: [PsmManager]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: ["PENDING → APPROVED; MOC dates/counts updated; increments MocRequest.version by 1"]
  - method: POST
    path: "/psm/extension-requests/{id}/deny"
    description: "Deny extension: MOC dates/counts unchanged"
    roles: [PsmManager]
    code: 200
    input: []
    output: ExtensionRequest
    side_effects: ["PENDING → DENIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing, or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, bad type, bad enum value, invalid date; TEMPORARY classify missing dates" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "PlantUnit id not found" }
  - { id: ERR_PERSONNEL_NOT_FOUND, http: 404, condition: "Personnel id not found (path or referenced body id)" }
  - { id: ERR_MOC_NOT_FOUND, http: 404, condition: "MocRequest id not found" }
  - { id: ERR_REVIEW_NOT_FOUND, http: 404, condition: "TechnicalReview id not found" }
  - { id: ERR_PHA_STUDY_NOT_FOUND, http: 404, condition: "PhaStudy id not found" }
  - { id: ERR_REVALIDATION_NOT_FOUND, http: 404, condition: "PhaRevalidation id not found" }
  - { id: ERR_PSSR_NOT_FOUND, http: 404, condition: "Pssr id not found" }
  - { id: ERR_ACTION_ITEM_NOT_FOUND, http: 404, condition: "ActionItem id not found" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "IncidentInvestigation id not found" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "Audit id not found" }
  - { id: ERR_PROCEDURE_UPDATE_NOT_FOUND, http: 404, condition: "ProcedureUpdate id not found" }
  - { id: ERR_TRAINING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "TrainingAssignment id not found" }
  - { id: ERR_EXTENSION_NOT_FOUND, http: 404, condition: "ExtensionRequest id not found" }
  - { id: ERR_STALE_MOC_VERSION, http: 412, condition: "expected_moc_version != current MocRequest.version on PSSR/extension create" }
  - { id: ERR_MOC_INVALID_STATE, http: 409, condition: "MOC not in a valid from-state for the requested transition" }
  - { id: ERR_REVIEW_INVALID_STATE, http: 409, condition: "TechnicalReview not OPEN for verdict" }
  - { id: ERR_PHA_STUDY_INVALID_STATE, http: 409, condition: "Study not in DUE_SOON/OVERDUE/REVALIDATION_REQUIRED for open-revalidation" }
  - { id: ERR_REVALIDATION_INVALID_STATE, http: 409, condition: "Revalidation not OPEN for complete/abandon" }
  - { id: ERR_PSSR_INVALID_STATE, http: 409, condition: "PSSR not in a valid from-state for the requested transition" }
  - { id: ERR_ACTION_ITEM_INVALID_STATE, http: 409, condition: "ActionItem not in a valid from-state for the requested transition" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "Investigation not in a valid from-state" }
  - { id: ERR_AUDIT_INVALID_STATE, http: 409, condition: "Audit not in a valid from-state" }
  - { id: ERR_PROCEDURE_UPDATE_INVALID_STATE, http: 409, condition: "ProcedureUpdate not DRAFT for publish" }
  - { id: ERR_TRAINING_ASSIGNMENT_INVALID_STATE, http: 409, condition: "TrainingAssignment not ASSIGNED for complete" }
  - { id: ERR_EXTENSION_NOT_PENDING, http: 409, condition: "ExtensionRequest not PENDING for approve/deny" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "X-User-ID does not match the owning field of the resource" }
  - { id: ERR_QUALIFICATION_MISSING, http: 403, condition: "Required qualification absent (discipline match, HAZOP_LEADER, PSSR_CERTIFIED) or Personnel inactive" }
  - { id: ERR_SOD_REVIEWER_IS_REQUESTER, http: 403, condition: "Technical reviewer is the MOC requester" }
  - { id: ERR_SOD_APPROVER_IS_REQUESTER, http: 403, condition: "Approver is the MOC requester" }
  - { id: ERR_SOD_PSSR_LEAD_IS_REQUESTER, http: 403, condition: "PSSR approving lead is the MOC requester" }
  - { id: ERR_SOD_VERIFIER_IS_COMPLETER, http: 403, condition: "Verifier X-User-ID equals completer_id" }
  - { id: ERR_UNIT_POSTURE_FROZEN, http: 403, condition: "Unit posture FROZEN blocks MOC create / authorize-startup / submit" }
  - { id: ERR_UNIT_POSTURE_RESTRICTED, http: 403, condition: "Unit posture RESTRICTED blocks MOC submit" }
  - { id: ERR_REVIEW_CHECKLIST_INCOMPLETE, http: 422, condition: "verdict ACCEPT with any checklist boolean false" }
  - { id: ERR_FIELDWORK_WINDOW_NOT_ACTIVE, http: 409, condition: "Current clock outside declared fieldwork window" }
  - { id: ERR_PHA_NOT_CURRENT, http: 409, condition: "Unit has no PHA study or study not in CURRENT/DUE_SOON at MOC submit" }
  - { id: ERR_MOC_NOT_TEMPORARY, http: 422, condition: "Extension requested on a non-TEMPORARY MOC" }
  - { id: ERR_TEMP_DURATION_EXCEEDS_MAX, http: 422, condition: "temporary_duration_days > unit.temp_moc_max_days" }
  - { id: ERR_MAX_EXTENSIONS_REACHED, http: 422, condition: "extension_count >= unit.max_extensions (checked before day caps)" }
  - { id: ERR_TEMP_EXTENSION_EXCEEDS_MAX_DAYS, http: 422, condition: "requested_days > unit.extension_max_days" }
  - { id: ERR_TEMP_TOTAL_CAP_EXCEEDED, http: 422, condition: "candidate end date beyond temporary_start_date + unit.total_temp_cap_days" }
  - { id: ERR_UNIT_CODE_EXISTS, http: 409, condition: "unit_code already taken" }
  - { id: ERR_EMPLOYEE_REF_EXISTS, http: 409, condition: "employee_ref already taken" }
  - { id: ERR_PHA_STUDY_EXISTS, http: 409, condition: "Unit already has a PhaStudy" }
  - { id: ERR_DUPLICATE_TRAINING_ASSIGNMENT, http: 409, condition: "Assignment already exists for (procedure_update_id, personnel_id)" }
  - { id: ERR_PSSR_WINDOW_OVERLAP, http: 409, condition: "Half-open PSSR window intersects another PLANNED/IN_FIELD/PUNCH_LIST PSSR on the same unit" }
  - { id: ERR_AUDIT_WINDOW_CONFLICT, http: 409, condition: "Audit window within 14 days of another SCHEDULED/FIELDWORK/REPORTED audit on the same unit" }
  - { id: ERR_PSSR_NOT_APPROVED, http: 409, condition: "authorize-startup without an APPROVED PSSR while requires_pssr" }
  - { id: ERR_OPEN_P1_ACTION_ITEMS, http: 409, condition: "Open P1 action items sourced to this MOC or its PSSRs block startup authorization" }
  - { id: ERR_PROCEDURES_NOT_PUBLISHED, http: 409, condition: "mark-implemented without any PUBLISHED ProcedureUpdate" }
  - { id: ERR_TRAINING_COVERAGE_INSUFFICIENT, http: 409, condition: "training_coverage_pct < unit.training_coverage_threshold_pct at mark-implemented" }
  - { id: ERR_NO_EVIDENCE_ATTACHED, http: 409, condition: "submit-verification with evidence_count == 0" }
  - { id: ERR_AUDIT_OPEN_FINDINGS, http: 409, condition: "Audit close with open_finding_count > 0" }
  - { id: ERR_OPEN_ACTION_ITEMS_BLOCK_CLOSE, http: 409, condition: "MOC close with open MOC_CONDITION items" }
  - { id: ERR_PSSR_OPEN_PUNCH_ITEMS, http: 409, condition: "PSSR approve with punch_open_count > 0" }
  - { id: ERR_NO_TRAINING_ASSIGNED, http: 409, condition: "Publish with zero TrainingAssignments" }
  - { id: ERR_CLOCK_REGRESSION, http: 409, condition: "set_current_utc earlier than current logical clock" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PsmAdmin
    description: "PSM system administrator: unit configuration, personnel registry, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /psm/units, PATCH /psm/units/{id}"
      - "POST /psm/personnel"
