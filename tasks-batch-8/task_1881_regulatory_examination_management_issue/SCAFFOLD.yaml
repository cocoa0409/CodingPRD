  # --- Examination ---
  - method: POST
    path: "/regulatory-exams/examinations"
    description: "Schedule a new examination"
    roles: [RegulatoryAffairsManager]
    code: 201
    input: [agency_id, exam_cycle_code, exam_type, scheduled_start_date, scheduled_end_date]
    output: Examination
    side_effects:
      - "computes first_day_letter_due_date (business-day calc)"
      - "sets posture = NORMAL, overdue_item_count = 0, repeat_finding_risk_score_bp = 0"
      - "validates no overlap against existing same-agency exams with status NOT IN {CANCELLED, CLOSED}"

  - method: GET
    path: "/regulatory-exams/examinations"
    description: "List examinations with filters"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: ["limit?", "offset?", "agency_id?", "status?", "posture?"]
    output: Examination[]
    side_effects: []

  - method: GET
    path: "/regulatory-exams/examinations/{id}"
    description: "Fetch examination"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: []
    output: Examination
    side_effects: []

  - method: POST
    path: "/regulatory-exams/examinations/{id}/issue-first-day-letter"
    description: "Transition SCHEDULED -> FIRST_DAY_ISSUED"
    roles: [RegulatoryAffairsManager]
    code: 200
    input: []
    output: Examination
    side_effects: ["sets status = FIRST_DAY_ISSUED", "increments examination.version by 1"]

  - method: POST
    path: "/regulatory-exams/examinations/{id}/begin-fieldwork"
    description: "Transition FIRST_DAY_ISSUED -> FIELDWORK; all items must be SUBMITTED or WAIVED"
    roles: [RegulatoryAffairsManager]
    code: 200
    input: []
    output: Examination
    side_effects: ["sets status = FIELDWORK", "increments examination.version by 1"]

  - method: POST
    path: "/regulatory-exams/examinations/{id}/deliver-findings"
    description: "Transition FIELDWORK -> FINDINGS_DELIVERED"
    roles: [RegulatoryAffairsManager]
    code: 200
    input: []
    output: Examination
    side_effects: ["sets status = FINDINGS_DELIVERED", "increments examination.version by 1"]

  - method: POST
    path: "/regulatory-exams/examinations/{id}/open-remediation"
    description: "Transition FINDINGS_DELIVERED -> REMEDIATION"
    roles: [RegulatoryAffairsManager]
    code: 200
    input: []
    output: Examination
    side_effects: ["sets status = REMEDIATION", "increments examination.version by 1"]

  - method: POST
    path: "/regulatory-exams/examinations/{id}/close"
    description: "Transition VALIDATION -> CLOSED"
    roles: [RegulatoryAffairsManager]
    code: 200
    input: []
    output: Examination
    side_effects: ["sets status = CLOSED", "increments examination.version by 1"]

  - method: POST
    path: "/regulatory-exams/examinations/{id}/cancel"
    description: "Transition SCHEDULED -> CANCELLED"
    roles: [RegulatoryAffairsManager]
    code: 200
    input: [cancelled_reason]
    output: Examination
    side_effects: ["sets status = CANCELLED, cancelled_reason = payload", "increments examination.version by 1"]

