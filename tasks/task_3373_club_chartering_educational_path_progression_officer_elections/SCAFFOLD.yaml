  # --- Club writes ---
  - method: POST
    path: "/toastmasters/clubs"
    description: "Create an organizing club; dues cycle 0 opens immediately"
    roles: [WorldHeadquarters]
    code: 201
    input: [club_name, club_type, district_number, division_code, area_code, venue_name, club_dues_cents, cycle_opened_at, "sponsor_club_id?", "corporate_sponsor_name?", "organizing_meeting_at?", "organizing_meeting_attendees?"]
    output: Club
    side_effects:
      - "charter_status=ORGANIZING, good_standing=GOOD, cycle_open_standing=GOOD"
      - "good_standing_score=0 when no membership, officer, meeting or completion rows exist yet"
      - "dues_cycle_index=0, cycle_closed_at=null"
      - "coaching_status=NONE"

  - method: POST
    path: "/toastmasters/clubs/{id}/charter"
    description: "Grant or reinstate a charter once the organizing requirements hold"
    roles: [WorldHeadquarters]
    code: 200
    input: []
    output: Club
    side_effects:
      - "charter_status becomes CHARTERED from ORGANIZING or SUSPENDED"
      - "charter_date = request timestamp, cycle_open_standing = good_standing"
      - "memberships of this club move PENDING to ACTIVE when dues_status is PAID, and LAPSED to ACTIVE"
      - "each reactivated membership's education paths move SUSPENDED to ACTIVE"
      - "recompute paid_member_count, total_member_count, good_standing_score"
      - "increments Club.version by 1"

  - method: POST
    path: "/toastmasters/clubs/{id}/close-cycle"
    description: "Close the open dues cycle, open the next one and re-derive standing"
    roles: [WorldHeadquarters]
    code: 200
    input: ["cycle_opened_at?", "cycle_closed_at?"]
    output: Club
    side_effects:
      - "step 1: memberships still unpaid for the closing cycle move dues_status ISSUED to OVERDUE and status ACTIVE to LAPSED; each lapsed membership's education paths move ACTIVE to SUSPENDED; each suspended path's contest entries move to DISQUALIFIED; each lapsed membership's officer terms become VACATED"
      - "step 2: dcp_recognition_points is recomputed with the cycle-close variant from the state left by step 1, using the cycle_open_standing snapshot"
      - "step 3: good_standing_score is recomputed from those points and good_standing is re-derived from the score; for clubs whose charter_status is CHARTERED or SUSPENDED, score < 60 moves CHARTERED to SUSPENDED and score < 40 moves CHARTERED or SUSPENDED to REVOKED, both evaluated here before the cycle index advances; an ORGANIZING club keeps its charter_status"
      - "step 4: dues_cycle_index increments by 1, cycle_opened_at = the supplied cycle_opened_at or the request timestamp when omitted, and cycle_open_standing = the good_standing derived in step 3; the next invoice is issued to every membership still in status PENDING or ACTIVE"
      - "step 5: officer terms whose term_index is below the new cycle index become COMPLETED; scheduled area visits with scheduled_at before cycle_closed_at become MISSED; coaching_status becomes FLAGGED for clubs whose new good_standing is PROBATION or NOT_IN_GOOD_STANDING and is still NONE"
      - "increments Club.version by 1"

  # --- Membership writes ---
  - method: POST
    path: "/toastmasters/memberships"
    description: "Enroll a person into a club; reuses the member row when member_id or email already exists"
    roles: [ClubOfficer, WorldHeadquarters]
    code: 201
    input: [club_id, "member_id?", "full_name?", "email?", "home_area_code?", join_date, first_time_member]
    output: Membership
    side_effects:
      - "status=PENDING, dues_status=ISSUED with quoted_total_cents from the renewal quote, dues_paid_through_cycle=-1"
      - "a Member row is created when neither member_id nor email matches an existing member"
      - "recompute Club.total_member_count, good_standing_score"

  - method: POST
    path: "/toastmasters/memberships/bulk"
    description: "Enroll up to 25 people into one club in a single request; best-effort with per-row results"
    roles: [ClubOfficer, WorldHeadquarters]
    code: 201
    input: [club_id, members, pay_dues_immediately]
    output: { created_count: integer, failed_count: integer, memberships: "Membership[]" }
    side_effects:
      - "one Membership is created per entry of members, in array order, reusing a Member row when the email already exists"
      - "pay_dues_immediately true sets dues_status=PAID, dues_paid_through_cycle=club.dues_cycle_index, quoted_total_cents from the renewal quote and status=ACTIVE on every created membership"
      - "a row whose email is malformed is skipped and counted in failed_count while the remaining rows are still committed"
      - "recompute Club.total_member_count, Club.paid_member_count, Club.new_member_count_this_cycle and Club.good_standing_score"

  - method: POST
    path: "/toastmasters/memberships/{id}/renew"
    description: "Pay the current cycle's dues using the applicable quote variant"
    roles: [Member, ClubOfficer]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "quoted_total_cents is recomputed with the renewal or reinstatement variant and charged"
      - "dues_status becomes PAID, dues_paid_through_cycle = club.dues_cycle_index"
      - "status moves PENDING or LAPSED to ACTIVE"
      - "each suspended education path of this membership moves to ACTIVE when the status became ACTIVE"
      - "recompute Club.paid_member_count, new_member_count_this_cycle, good_standing_score"
      - "increments Membership.version by 1"

  - method: POST
    path: "/toastmasters/memberships/{id}/refund-dues"
    description: "Reverse the most recent dues payment and restore the prior cycle counters"
    roles: [ClubOfficer]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "dues_status becomes VOID"
      - "dues_paid_through_cycle and consecutive_cycles_paid revert to the values held before the refunded payment"
      - "recompute Club.paid_member_count, good_standing_score"
      - "increments Membership.version by 1"

  # --- Education path writes ---
  - method: POST
    path: "/toastmasters/education-paths"
    description: "Enroll a membership in a Pathways path at LEVEL_1"
    roles: [Member]
    code: 201
    input: [membership_id, path_code, expected_membership_version]
    output: EducationPath
    side_effects:
      - "level=LEVEL_1, status=ACTIVE, level_started_at=request timestamp"
      - "increments Membership.version by 1"

  - method: POST
    path: "/toastmasters/education-paths/{id}/advance-level"
    description: "Advance the path one level once the published requirement table is satisfied"
    roles: [Member]
    code: 200
    input: [expected_education_path_version]
    output: EducationPath
    side_effects:
      - "level advances one step, LEVEL_5 becomes COMPLETED"
      - "level_started_at = request timestamp, last_advanced_at = request timestamp"
      - "recompute Member.highest_level_completed, Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
      - "increments EducationPath.version by 1"

  # --- Project completion writes ---
  - method: POST
    path: "/toastmasters/project-completions"
    description: "Log a project or speech completion against an education path"
    roles: [Member]
    code: 201
    input: [path_id, project_code, project_kind, level, speech_minutes, delivered_at, "evaluator_member_id?", expected_education_path_version]
    output: ProjectCompletion
    side_effects:
      - "status=LOGGED, member_id and club_id are copied from the path's membership"
      - "counts_for_level_advancement=false"
      - "increments EducationPath.version by 1"

  - method: POST
    path: "/toastmasters/project-completions/{id}/evaluation"
    description: "Record the evaluator's written evaluation"
    roles: [Member]
    code: 200
    input: [evaluation_summary]
    output: ProjectCompletion
    side_effects:
      - "status moves LOGGED or RETURNED to EVALUATED and return_reason is cleared"
      - "recompute EducationPath.approved_speeches_at_level and approved_projects_at_level"
      - "increments ProjectCompletion.version by 1"

  - method: POST
    path: "/toastmasters/project-completions/{id}/review"
    description: "Officer approves or returns an evaluated completion"
    roles: [ClubOfficer]
    code: 200
    input: [decision, "return_reason?"]
    output: ProjectCompletion
    side_effects:
      - "decision APPROVE moves EVALUATED to APPROVED; decision RETURN moves EVALUATED or APPROVED to RETURNED"
      - "an APPROVED to RETURNED review at the path's current level drops the path level by one step"
      - "recompute Member.total_speeches_delivered, Member.highest_level_completed, EducationPath.approved_speeches_at_level, EducationPath.approved_projects_at_level"
      - "recompute Club.approved_level_completions_this_cycle, Club.dcp_recognition_points, Club.good_standing_score"
      - "contest entries of the same member and club move to DISQUALIFIED when the path level drops"
      - "increments ProjectCompletion.version by 1"

  # --- Meeting writes ---
  - method: POST
    path: "/toastmasters/meetings"
    description: "Schedule a club meeting; rejected when the interval collides with another meeting at the same club"
    roles: [ClubOfficer]
    code: 201
    input: [club_id, scheduled_at, "duration_minutes?", venue_name, "theme?", expected_club_version]
    output: MeetingEvent
    side_effects:
      - "status=SCHEDULED, required_role_slots=7, filled_role_slots=0, quorum_met=false"
      - "increments Club.version by 1"

  - method: POST
    path: "/toastmasters/meetings/{id}/close"
    description: "Close a scheduled meeting as held or cancelled"
    roles: [ClubOfficer]
    code: 200
    input: [outcome, "attendance_count?", "attendee_member_ids?"]
    output: MeetingEvent
    side_effects:
      - "outcome HELD requires attendance_count >= 5 and sets quorum_met=true, held_at=request timestamp"
      - "each ASSIGNED role assignment of this meeting whose member is listed becomes COMPLETED, otherwise NO_SHOW"
      - "outcome CANCELLED releases every ASSIGNED role assignment"
      - "recompute Club.meetings_held_this_cycle, Club.good_standing_score"
      - "increments MeetingEvent.version by 1"

  # --- Role assignment writes ---
  - method: POST
    path: "/toastmasters/role-assignments"
    description: "Assign a member to a meeting role; rejected on window, capacity and duplicate violations"
    roles: [ClubOfficer]
    code: 201
    input: [meeting_id, member_id, role_code, expected_meeting_version]
    output: RoleAssignment
    side_effects:
      - "status=ASSIGNED, role_class=SPEECH when role_code is SPEAKER and FUNCTIONARY otherwise"
      - "recompute MeetingEvent.filled_role_slots"
      - "increments MeetingEvent.version by 1"

  - method: POST
    path: "/toastmasters/role-assignments/{id}/release"
    description: "Release an assigned role, freeing the slot and the rotation window"
    roles: [ClubOfficer]
    code: 200
    input: [released_reason]
    output: RoleAssignment
    side_effects:
      - "status becomes RELEASED"
      - "recompute MeetingEvent.filled_role_slots"
      - "increments RoleAssignment.version by 1"

  # --- Officer term writes ---
  - method: POST
    path: "/toastmasters/officer-terms"
    description: "Nominate a member for a club office in the current term"
    roles: [ClubOfficer]
    code: 201
    input: [club_id, member_id, office]
    output: OfficerTerm
    side_effects:
      - "status=NOMINATED, term_index=club.dues_cycle_index, nominated_at=request timestamp"

  - method: POST
    path: "/toastmasters/officer-terms/{id}/elect"
    description: "Record the election of a nominated officer"
    roles: [ClubOfficer]
    code: 200
    input: []
    output: OfficerTerm
    side_effects:
      - "status becomes ELECTED, elected_at=request timestamp, training_due_at=elected_at + 30 days"
      - "recompute Membership.officer_role for the elected member"
      - "increments OfficerTerm.version by 1"

  - method: POST
    path: "/toastmasters/officer-terms/{id}/training"
    description: "Record district officer training for an elected officer"
    roles: [DistrictDirector]
    code: 200
    input: []
    output: OfficerTerm
    side_effects:
      - "status becomes TRAINED, trained_at=request timestamp"
      - "recompute Club.officer_trained_count, Club.dcp_recognition_points, Club.good_standing_score"
      - "increments OfficerTerm.version by 1"

  # --- Contest writes ---
  - method: POST
    path: "/toastmasters/contests"
    description: "Create a club, area, division or district contest"
    roles: [DistrictDirector, WorldHeadquarters]
    code: 201
    input: ["club_id?", contest_level, contest_type, district_number, division_code, "area_code?", scheduled_at]
    output: Contest
    side_effects:
      - "status=SCHEDULED, entry_count=0, judged_entry_count=0, winner_entry_id=null"

  - method: POST
    path: "/toastmasters/contests/{id}/complete"
    description: "Rank judged entries, advance the winner and open the next contest level"
    roles: [DistrictDirector]
    code: 200
    input: []
    output: Contest
    side_effects:
      - "entries are ranked by judge_score_total descending with created_at ascending as the tie-break"
      - "the first-ranked entry becomes ADVANCED with placement 1 and becomes winner_entry_id"
      - "every other judged entry becomes ELIMINATED with placement equal to its rank"
      - "a CLUB-level winner creates a ContestEntry at the matching AREA contest when one is SCHEDULED"
      - "status becomes COMPLETED, completed_at=request timestamp"
      - "increments Contest.version by 1"

  # --- Contest entry writes ---
  - method: POST
    path: "/toastmasters/contest-entries"
    description: "Enter a member in a contest through a named club"
    roles: [Member]
    code: 201
    input: [contest_id, member_id, club_id, speech_title]
    output: ContestEntry
    side_effects:
      - "status=ENTERED, ballot_count=0, judge_score_total=0"
      - "recompute Contest.entry_count"

  - method: POST
    path: "/toastmasters/contest-entries/{id}/ballots"
    description: "Record one judge's ballot for an entry"
    roles: [DistrictDirector]
    code: 200
    input: [judge_member_id, content_score, delivery_score, language_score]
    output: ContestEntry
    side_effects:
      - "ballot_count increments by 1 and judge_score_total increases by the ballot's total_score"
      - "status moves ENTERED to JUDGED when ballot_count reaches 3"
      - "the contest moves SCHEDULED to IN_PROGRESS on the first ballot of the contest"
      - "recompute Contest.entry_count and Contest.judged_entry_count"
      - "increments ContestEntry.version by 1"

  # --- Area visit writes ---
  - method: POST
    path: "/toastmasters/area-visits"
    description: "Schedule an area director, division director or club coach visit"
    roles: [DistrictDirector]
    code: 201
    input: [club_id, director_member_id, visit_kind, scheduled_at]
    output: AreaVisit
    side_effects:
      - "status=SCHEDULED, completed_at=null"
      - "Club.coaching_status becomes ASSIGNED when visit_kind is CLUB_COACH and coaching_status is FLAGGED"

  - method: POST
    path: "/toastmasters/area-visits/{id}/complete"
    description: "Complete a scheduled governance visit and record findings"
    roles: [DistrictDirector]
    code: 200
    input: [findings]
    output: AreaVisit
    side_effects:
      - "status becomes COMPLETED, completed_at=request timestamp"
      - "Club.coaching_status becomes COACHED when visit_kind is CLUB_COACH"
      - "increments AreaVisit.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the four declared roles"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the endpoint, or an entity_backed role fails its ownership clause"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A resource named in the path or referenced by the payload does not exist"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, field type wrong, enum value outside its declared set, or a score outside 0..100"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent's current version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target resource is not in a status that admits the requested transition"

  - id: ERR_DUPLICATE_PATH_ENROLLMENT
    http: 409
    condition: "The membership already holds an education path for this path_code in status ACTIVE or SUSPENDED"

  - id: ERR_DUPLICATE_ASSIGNMENT
    http: 409
    condition: "The member already holds an ASSIGNED role assignment on this meeting"

  - id: ERR_DUPLICATE_BALLOT
    http: 409
    condition: "The judge already recorded a ballot for this contest entry"

  - id: ERR_OFFICE_ALREADY_FILLED
    http: 409
    condition: "The club, term_index and office already carry an ELECTED or TRAINED term, or the member already holds one"

  - id: ERR_MEETING_OVERLAP
    http: 409
    condition: "The candidate meeting intersects, or starts inside the 30-minute buffer of, another SCHEDULED or HELD meeting at the same club"

  - id: ERR_ROLE_WINDOW_EXCEEDED
    http: 409
    condition: "The member already holds 2 SPEECH role assignments inside the rolling 7-day window around the meeting"

  - id: ERR_ROLE_SLOTS_FULL
    http: 409
    condition: "The meeting already holds 7 role assignments in status ASSIGNED, COMPLETED or NO_SHOW"

  - id: ERR_CONTEST_NOT_OPEN
    http: 409
    condition: "Entry attempted after the contest left SCHEDULED, or a ballot attempted on a COMPLETED contest"

  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "Meeting closed as HELD with attendance_count below 5"

  - id: ERR_DUES_ALREADY_PAID
    http: 409
    condition: "Renewal attempted while dues_status is PAID or VOID"

  - id: ERR_ORGANIZING_MEETING_REQUIRED
    http: 422
    condition: "Charter requested before the organizing meeting is held with at least 3 attendees"

  - id: ERR_CHARTER_MINIMUM_NOT_MET
    http: 422
    condition: "Charter requested with fewer than 20 dues-paid memberships"

  - id: ERR_CORPORATE_SPONSOR_REQUIRED
    http: 422
    condition: "Charter requested for a CORPORATE club with no corporate_sponsor_name"

  - id: ERR_SPONSOR_NOT_IN_GOOD_STANDING
    http: 422
    condition: "The named sponsor club is not CHARTERED with good_standing GOOD"

  - id: ERR_LEVEL_REQUIREMENTS_NOT_MET
    http: 422
    condition: "The path does not hold enough approved speeches or projects for its current level"

  - id: ERR_EVALUATOR_CONFLICT
    http: 422
    condition: "evaluator_member_id equals the completion's member_id"

  - id: ERR_JUDGE_CONFLICT
    http: 422
    condition: "judge_member_id equals the entry's member_id or holds a membership at the entry's club"

  - id: ERR_ELECTION_QUORUM_NOT_MET
    http: 422
    condition: "Election attempted without a HELD meeting carrying quorum_met true after the nomination, or the nominee's membership is not ACTIVE and paid"

  - id: ERR_CLUB_NOT_CHARTERED
    http: 422
    condition: "Dues renewal attempted while the club charter_status is SUSPENDED"

  - id: ERR_CLUB_REVOKED
    http: 422
    condition: "Operation attempted against a club whose charter_status is REVOKED"

  - id: ERR_CLUB_NOT_IN_GOOD_STANDING
    http: 422
    condition: "Contest entry or level advancement attempted at a club whose good_standing is PROBATION or NOT_IN_GOOD_STANDING"

  - id: ERR_MEMBERSHIP_NOT_ACTIVE
    http: 422
    condition: "The membership is not ACTIVE or its dues_paid_through_cycle is below the club's dues_cycle_index"

  - id: ERR_NO_JUDGED_ENTRIES
    http: 422
    condition: "Contest completion attempted with no entry in status JUDGED"

  - id: ERR_NO_COACHING_CANDIDATES
    http: 404
    condition: "Coaching queue requested while no club is in PROBATION or NOT_IN_GOOD_STANDING with coaching_status NONE"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: WorldHeadquarters
    description: "Toastmasters International staff: charters and reinstates clubs, closes dues cycles and may create contests"
    identity: opaque
    exclusive_operations:
      - "POST /toastmasters/clubs — create an organizing club"
      - "POST /toastmasters/clubs/{id}/charter — grant or reinstate a charter"
      - "POST /toastmasters/clubs/{id}/close-cycle — close the dues cycle"
    shared_operations:
      - "GET /toastmasters/clubs and GET /toastmasters/clubs/{id}"
      - "POST /toastmasters/memberships — enroll a person into a club"
      - "POST /toastmasters/contests — create a contest"
      - "every GET list and single-resource read"

  - name: ClubOfficer
    description: "A club member acting for their own club; X-User-ID names a Membership whose club_id equals the club targeted by the operation, so club-scoped writes are refused for a membership of any other club"
    identity: entity_backed:Membership
    exclusive_operations:
      - "POST /toastmasters/memberships/{id}/refund-dues — reverse a dues payment"
      - "POST /toastmasters/project-completions/{id}/review — approve or return a completion"
      - "POST /toastmasters/meetings and POST /toastmasters/meetings/{id}/close"
      - "POST /toastmasters/role-assignments and POST /toastmasters/role-assignments/{id}/release"
      - "POST /toastmasters/officer-terms, POST /toastmasters/officer-terms/{id}/elect"
    shared_operations:
      - "POST /toastmasters/memberships — enroll a person into the officer's own club"
      - "POST /toastmasters/memberships/{id}/renew — pay dues for a membership of the officer's own club"
      - "GET /toastmasters/clubs/{id} and club-scoped reads for the officer's own club"

  - name: Member
    description: "An individual member, identified by the Member row that X-User-ID names"
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /toastmasters/education-paths — enroll in a path"
      - "POST /toastmasters/education-paths/{id}/advance-level — advance a level"
      - "POST /toastmasters/project-completions — log a completion"
      - "POST /toastmasters/project-completions/{id}/evaluation — record the evaluation the member wrote"
      - "POST /toastmasters/contest-entries — enter a contest"
    shared_operations:
      - "POST /toastmasters/memberships/{id}/renew — pay dues on the member's own membership"
      - "every GET list and single-resource read"

  - name: DistrictDirector
    description: "An area or division director or district coach, identified by the Member row that X-User-ID names; officer training additionally requires that X-User-ID differs from the member_id of the term being trained"
    identity: entity_backed:Member
    exclusive_operations:
      - "POST /toastmasters/officer-terms/{id}/training — record officer training"
      - "POST /toastmasters/contests and POST /toastmasters/contests/{id}/complete"
      - "POST /toastmasters/contest-entries/{id}/ballots — record a judge ballot"
      - "POST /toastmasters/area-visits and POST /toastmasters/area-visits/{id}/complete"
      - "GET /toastmasters/clubs/coaching-queue"
    shared_operations:
      - "every GET list and single-resource read"
