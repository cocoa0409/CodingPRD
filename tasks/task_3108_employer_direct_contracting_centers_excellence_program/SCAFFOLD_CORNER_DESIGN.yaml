        as: CareCoordinator
      - call: POST /coe/episodes
        payload:
          patient_id: ${p2}
          contract_id: ${ctr}
          intake_request_id: IR-EN7-2
        as: CareCoordinator
      - call: POST /coe/episodes
        payload:
          patient_id: ${p3}
          contract_id: ${ctr}
          intake_request_id: IR-EN7-3
        as: CareCoordinator
      trigger:
      - call: GET /coe/episodes
        payload:
          contract_id: ${ctr}
          limit: 2
          offset: 0
        as: ProgramAdmin
      assert:
      - page 1 returns 2 episodes, total_count == 3, has_more == true
      - a second GET with offset 2 returns 1 episode, total_count == 3, has_more == false
  - name: template_retired_blocks_new_contract_but_keeps_existing
    claim_type: Type Constraints
    grounds:
    - entities.BundleTemplate.fields.status
    - errors[ERR_TEMPLATE_RETIRED]
    distinguishing_aspect: A RETIRED template rejects new contract creation with 422 ERR_TEMPLATE_RETIRED, while a contract created before retirement still activates.
    test_recipe:
      setup:
      - Clock 2026-09-01. Employer + template. Contract C1 created, then template retired.
      setup_api_calls:
      - call: POST /coe/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /coe/rate-books
        payload:
          book_code: RB-EN8
          rates:
            ORTHO_JOINT: 2500000
        as: ProgramAdmin
        captures:
          rb: $.data.id
      - call: POST /coe/employers
        payload:
          legal_name: Psi
          ein: E-EN8
          baseline_rate_book: ${rb}
        as: ProgramAdmin
        captures:
          emp: $.data.id
      - call: POST /coe/bundle-templates
        payload:
          procedure_family: ORTHO_JOINT
          label: Knee
          warranty_days: 90
          implant_component_cap_cents: 500000
          readmit_policy: ALL_CAUSE
        as: ProgramAdmin
        captures:
          tpl: $.data.id
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          bundle_price_cents: 3000000
          rate_components:
            facility: 3000000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          c1: $.data.id
      - call: POST /coe/bundle-templates/${tpl}/retire
        payload: {}
        as: ProgramAdmin
      trigger:
      - call: POST /coe/contracts
        payload:
          employer_id: ${emp}
          template_id: ${tpl}
          effective_from: '2027-09-01T00:00:00Z'
          effective_to: '2028-09-01T00:00:00Z'
          bundle_price_cents: 3100000
          rate_components:
            facility: 3100000
          outlier_threshold_cents: 5000000
          outlier_share_pct: 0
          episode_cap_per_month: 50
          concurrent_capacity: 50
          travel_benefit_cents: 0
          lodging_benefit_cents: 0
          companion_allowed: false
        as: ProgramAdmin
        captures:
          err: $.data.error_id
      - call: POST /coe/contracts/${c1}/activate
        payload: {}
        as: ProgramAdmin
      assert:
      - new contract creation rejected 422 ERR_TEMPLATE_RETIRED
      - Contract.${c1} (created pre-retirement) activates to ACTIVE — retirement is not retroactive
      - BundleTemplate.${tpl}.template_version was pinned on C1 at creation
