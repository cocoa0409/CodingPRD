# =============================================================================
# PRD Benchmark Seed Tables — Promotional Products & Branded Swag Distributor
# Difficulty band: Expert
# =============================================================================

scenario: |
  560. Promotional Products & Branded Swag Distributor (4imprint/ASI style):
  catalog & decoration method, art proof & logo approval, quantity-tier & setup
  pricing, supplier sourcing & blank, rush & in-hands date, sample order,
  reorder, spoilage allowance

domain_name: promo-products
# Multi-root catalog + order domain. api_prefix is empty because top-level
# collections (suppliers, products, customers, orders, order-lines,
# purchase-orders, decoration-stations, shipments) are peers, not nested under a
# single resource. All endpoint paths are absolute.
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: workflow_orchestration
  complexity_layers: [rate_threshold_triggers, dual_variant_calculation, cascading_side_effects, optimistic_concurrency]

  entity_topology: hybrid
  # Order -> OrderLine -> ArtProof is a tree; Supplier/Product/PriceTier/
  # DecorationStation/Customer/PurchaseOrder/Shipment are flat peers with FK refs;
  # Order.reorder_source_order_id is self-referential.

  state_machine_shape: parallel
  # Order carries two independent axes: fulfillment_status x payment_status.
  # ArtProof is cyclic (PENDING_APPROVAL <-> CHANGES_REQUESTED). OrderLine has a
  # QC rework cycle (QC_HOLD -> PRINTING).

  relationship_patterns:
    - one_to_many         # Order->OrderLine, OrderLine->ArtProof, Supplier->Product
    - self_referential    # Order.reorder_source_order_id -> Order.id
    - cross_aggregate     # PurchaseOrder references OrderLine; OrderLine references Product/Station

  role_model: approval_chain
  # AccountManager submits art proofs; Customer (a different actor) approves them
  # (segregation on the approval step). ProductionManager owns the shop floor.
  # CatalogAdmin owns catalog/config.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier / decorator supplier name" }
      - { name: blank_unit_cost_cents, type: integer, source: input, description: "Cost the distributor pays this supplier per blank unit, in cents" }
      - { name: concurrent_capacity_units, type: integer, source: input, description: "Max blank units this supplier can have in production concurrently at any instant" }
      - { name: reserved_blank_qty, type: integer, source: computed, default: 0, description: "Read-only: SUM of ordered_blank_qty over this supplier's PurchaseOrders in ISSUED state. Invariant maintained on issue/cancel/receive." }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier that sources this blank" }
      - { name: sku, type: string, source: input, description: "Catalog SKU code" }
      - { name: name, type: string, source: input, description: "Catalog product name (e.g., 12oz Cotton Tote)" }
      - { name: min_order_qty, type: integer, source: input, description: "Minimum order quantity (a line's quantity must be >= this value)" }

  - name: PriceTier
    parent: Product
    common_fields: false
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; the product this price break belongs to" }
      - { name: decoration_method, type: enum, source: input, description: "SCREEN_PRINT | EMBROIDERY | LASER_ENGRAVE — decorated unit price applies to this method", constraints: "one of SCREEN_PRINT, EMBROIDERY, LASER_ENGRAVE" }
      - { name: min_quantity, type: integer, source: input, description: "Lower bound of this quantity tier (inclusive); tier applies when line.quantity >= min_quantity" }
      - { name: unit_price_cents, type: integer, source: input, description: "Decorated first-color unit price at this tier, in cents" }

  - name: DecorationStation
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Station / press name" }
      - { name: station_type, type: enum, source: input, description: "SCREEN_PRESS | EMBROIDERY_MACHINE | LASER — physical decoration resource", constraints: "one of SCREEN_PRESS, EMBROIDERY_MACHINE, LASER" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer / account name" }
      - { name: initial_credit_cents, type: integer, source: input, description: "Prepaid account funding at creation, in cents" }
      - { name: total_funded_cents, type: integer, source: computed, description: "Read-only: total money ever funded into this account (equals initial_credit_cents in v1); the conserved money quantity" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Read-only: available prepaid credit = total_funded_cents - SUM(escrow_cents of this customer's non-refunded orders)" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the buyer that owns this order" }
      - { name: order_type, type: enum, source: input, default: "STANDARD", description: "STANDARD | SAMPLE | REORDER", constraints: "one of STANDARD, SAMPLE, REORDER" }
      - { name: reorder_source_order_id, type: string, source: input, default: null, description: "FK -> Order.id; set only when order_type=REORDER — the DELIVERED source order copied from" }
      - { name: in_hands_date, type: datetime, source: input, description: "Date the finished goods must be in the buyer's hands (ISO 8601, midnight UTC)" }
      - { name: is_rush, type: boolean, source: computed, default: false, description: "Read-only: true when (in_hands_date - current clock date) in whole days < RUSH_THRESHOLD_DAYS; fixed at quote" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT -> QUOTED -> CONFIRMED -> IN_PRODUCTION -> SHIPPED -> DELIVERED; or CANCELLED", constraints: "one of DRAFT, QUOTED, CONFIRMED, IN_PRODUCTION, SHIPPED, DELIVERED, CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Independent axis: UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL; or REFUNDED. Derived from escrow_cents vs deposit_required_cents / quoted_total_cents", constraints: "one of UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED" }
      - { name: escrow_cents, type: integer, source: computed, default: 0, description: "Read-only: money moved from the customer's credit into this order's escrow via payments; returned to credit on cancel" }
      - { name: deposit_required_cents, type: integer, source: computed, default: 0, description: "Read-only: ceil(quoted_total_cents * DEPOSIT_PCT); set at quote" }
      - { name: art_complete, type: boolean, source: computed, default: false, description: "Read-only: true when every non-cancelled OrderLine has an APPROVED ArtProof" }
      - { name: quoted_subtotal_cents, type: integer, source: computed, default: 0, description: "Read-only: SUM of line_subtotal_cents over non-cancelled lines, using ordered quantities; set at quote" }
      - { name: quoted_rush_cents, type: integer, source: computed, default: 0, description: "Read-only: rush surcharge on the quoted subtotal; set at quote" }
      - { name: quoted_total_cents, type: integer, source: computed, default: 0, description: "Read-only: quoted_subtotal_cents + quoted_rush_cents; set at quote" }
      - { name: final_subtotal_cents, type: integer, source: computed, default: null, description: "Read-only: SUM of final_line_subtotal_cents (actual good quantities) over non-cancelled lines; set at shipment" }
      - { name: final_rush_cents, type: integer, source: computed, default: null, description: "Read-only: rush surcharge on final_subtotal_cents; set at shipment" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "Read-only: final_subtotal_cents + final_rush_cents; set at shipment" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; catalog blank being decorated" }
      - { name: station_id, type: string, source: computed, default: null, description: "FK -> DecorationStation.id; assigned at schedule (null before)" }
      - { name: decoration_method, type: enum, source: input, description: "SCREEN_PRINT | EMBROIDERY | LASER_ENGRAVE", constraints: "one of SCREEN_PRINT, EMBROIDERY, LASER_ENGRAVE" }
      - { name: quantity, type: integer, source: input, description: "Ordered quantity of decorated units" }
      - { name: imprint_color_count, type: integer, source: input, default: 1, description: "Number of imprint colors; first color included, extras add run + setup charges" }
      - { name: scheduled_start, type: datetime, source: computed, default: null, description: "Half-open production window start on station_id (set at schedule)" }
      - { name: scheduled_end, type: datetime, source: computed, default: null, description: "Half-open production window end on station_id (set at schedule)" }
      - { name: unit_price_cents, type: integer, source: computed, default: 0, description: "Read-only: selected PriceTier unit_price_cents for (product, method, quantity)" }
      - { name: line_setup_cents, type: integer, source: computed, default: 0, description: "Read-only: setup charge for this line (method-specific; extra colors add setup)" }
      - { name: line_subtotal_cents, type: integer, source: computed, default: 0, description: "Read-only: goods + setup at ordered quantity (see calc line_subtotal)" }
      - { name: locked_unit_price_cents, type: integer, source: computed, default: null, description: "Read-only: unit_price_cents pinned at order confirm (price-lock)" }
      - { name: produced_qty, type: integer, source: computed, default: null, description: "Read-only: gross units produced (set at complete-run)" }
      - { name: spoiled_qty, type: integer, source: computed, default: null, description: "Read-only: spoiled units in this run (set at complete-run)" }
      - { name: good_qty, type: integer, source: computed, default: null, description: "Read-only: produced_qty - spoiled_qty" }
      - { name: final_line_subtotal_cents, type: integer, source: computed, default: null, description: "Read-only: goods at good_qty + line_setup_cents; set when line reaches COMPLETED / at shipment" }
      - { name: status, type: enum, source: system, description: "PENDING_ART -> ART_READY -> CONFIRMED -> SCHEDULED -> PRINTING -> QC_HOLD -> COMPLETED; QC_HOLD -> PRINTING (rework); or CANCELLED", constraints: "one of PENDING_ART, ART_READY, CONFIRMED, SCHEDULED, PRINTING, QC_HOLD, COMPLETED, CANCELLED" }

  - name: ArtProof
    parent: OrderLine
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; the line whose logo/imprint this proof represents" }
      - { name: proof_url, type: string, source: input, description: "URL of the rendered art proof / mock-up" }
      - { name: notes, type: string, source: input, default: null, description: "Optional proof notes or change instructions" }
      - { name: revision_number, type: integer, source: computed, description: "Read-only: 1 for the first proof on a line, incremented for each superseding proof" }
      - { name: approved_version, type: integer, source: computed, default: null, description: "Read-only: OrderLine.version pinned at the moment this proof was APPROVED (version-pin on approval)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_APPROVAL <-> CHANGES_REQUESTED -> APPROVED; or SUPERSEDED", constraints: "one of DRAFT, PENDING_APPROVAL, CHANGES_REQUESTED, APPROVED, SUPERSEDED" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line whose blanks this PO sources" }
      - { name: order_id, type: string, source: computed, description: "FK -> Order.id; copied from the line's order" }
      - { name: product_id, type: string, source: computed, description: "FK -> Product.id; copied from the line's product" }
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; supplier fulfilling the blanks" }
      - { name: ordered_blank_qty, type: integer, source: input, description: "Number of blank units ordered from the supplier" }
      - { name: received_blank_qty, type: integer, source: computed, default: null, description: "Read-only: actual blanks received (set at receive)" }
      - { name: production_start, type: datetime, source: input, description: "Supplier production window start (half-open); load counted against supplier capacity" }
      - { name: production_end, type: datetime, source: input, description: "Supplier production window end (half-open)" }
      - { name: estimated_blank_cost_cents, type: integer, source: computed, default: null, description: "Read-only: ordered_blank_qty * supplier.blank_unit_cost_cents; set at issue" }
      - { name: actual_blank_cost_cents, type: integer, source: computed, default: null, description: "Read-only: received_blank_qty * supplier.blank_unit_cost_cents; set at receive" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> RECEIVED; or CANCELLED", constraints: "one of DRAFT, ISSUED, RECEIVED, CANCELLED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the order being shipped" }
      - { name: carrier, type: string, source: input, description: "Carrier name (e.g., UPS, FEDEX)" }
      - { name: tracking_number, type: string, source: input, default: null, description: "Optional tracking number" }
      - { name: shipped_at, type: datetime, source: computed, description: "Read-only: current clock time at shipment creation" }
      - { name: total_good_qty, type: integer, source: computed, description: "Read-only: SUM of good_qty over the order's non-cancelled lines" }
      - { name: final_total_cents, type: integer, source: computed, description: "Read-only: snapshot of the order's final_total_cents at shipment" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ------------------------------------------------------------------ Order
  # Two independent axes on the same row: fulfillment_status and payment_status.
  - entity: Order
    initial_state: DRAFT               # fulfillment_status initial; payment_status initial is UNPAID
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      # --- fulfillment axis ---
      - from: DRAFT
        to: QUOTED
        trigger: "POST /orders/{orderId}/quote"
        actor: AccountManager
        preconditions:
          - "Order.fulfillment_status == DRAFT (ERR_ORDER_NOT_DRAFT)"
          - "Order has >= 1 non-cancelled OrderLine (ERR_NO_ORDER_LINES)"
        side_effects:
          - "Compute is_rush from in_hands_date vs current clock date (calc lead_time_rush)"
          - "Compute quoted_subtotal_cents = SUM line_subtotal_cents (calc order_total variant=QUOTED)"
          - "Compute quoted_rush_cents, quoted_total_cents (calc order_total)"
          - "Compute deposit_required_cents = ceil(quoted_total_cents * DEPOSIT_PCT)"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /orders/{orderId}/confirm"
        actor: AccountManager
        preconditions:
          - "Order.fulfillment_status == QUOTED (ERR_ORDER_NOT_QUOTED)  [priority 4 state]"
          - "Every non-cancelled OrderLine has an APPROVED ArtProof i.e. art_complete==true (ERR_ART_NOT_APPROVED)  [priority 5 business_referential; cross-entity Order->ArtProof]"
          - "Whole-day lead = (in_hands_date - current clock date) >= ABSOLUTE_MIN_LEAD_DAYS (ERR_INSUFFICIENT_LEAD_TIME)  [priority 6 business_temporal]"
          - "escrow_cents >= deposit_required_cents (ERR_DEPOSIT_REQUIRED)  [priority 8 business_fiscal]"
        side_effects:
          - "Each non-cancelled OrderLine: status ART_READY -> CONFIRMED"
          - "Each non-cancelled OrderLine: locked_unit_price_cents = unit_price_cents (price-lock)"
      - from: CONFIRMED
        to: IN_PRODUCTION
        trigger: "POST /orders/{orderId}/start-production"
        actor: ProductionManager
        preconditions:
          - "Order.fulfillment_status == CONFIRMED (ERR_ORDER_NOT_CONFIRMED)"
          - "Every non-cancelled OrderLine.status == CONFIRMED (ERR_LINE_INVALID_STATE)"
        side_effects: []
      - from: IN_PRODUCTION
        to: SHIPPED
        trigger: "POST /shipments (order_id = this order)"
        actor: ProductionManager
        preconditions:
          - "Order.fulfillment_status == IN_PRODUCTION (ERR_ORDER_NOT_IN_PRODUCTION)"
          - "Every non-cancelled OrderLine.status == COMPLETED (ERR_LINE_INVALID_STATE)"
        side_effects:
          - "Compute final_subtotal_cents = SUM final_line_subtotal_cents (calc order_total variant=FINAL, actual good_qty)"
          - "Compute final_rush_cents, final_total_cents (calc order_total)"
          - "Shipment.final_total_cents = Order.final_total_cents; Shipment.total_good_qty = SUM good_qty; Shipment.shipped_at = clock"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /orders/{orderId}/deliver"
        actor: ProductionManager
        preconditions:
          - "Order.fulfillment_status == SHIPPED (ERR_ORDER_NOT_SHIPPED)"
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: AccountManager
        preconditions:
          - "Order.fulfillment_status in {DRAFT, QUOTED, CONFIRMED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "CASCADE: each non-cancelled OrderLine -> CANCELLED"
          - "Refund escrow: escrow_cents -> 0; customer.credit_balance_cents += escrow_cents; payment_status -> REFUNDED"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: AccountManager
        preconditions:
          - "Order.fulfillment_status in {DRAFT, QUOTED, CONFIRMED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Same cascade + refund as DRAFT -> CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /orders/{orderId}/cancel"
        actor: AccountManager
        preconditions:
          - "Order.fulfillment_status in {DRAFT, QUOTED, CONFIRMED} (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "CASCADE hop 1: each non-cancelled OrderLine -> CANCELLED"
          - "CASCADE hop 2: each cancelled OrderLine whose active PurchaseOrder is ISSUED -> that PurchaseOrder CANCELLED"
          - "CASCADE hop 3: each cancelled PurchaseOrder -> supplier.reserved_blank_qty -= ordered_blank_qty"
          - "Refund escrow to customer.credit_balance_cents; payment_status -> REFUNDED"
      # --- payment axis (independent of fulfillment axis) ---
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "POST /orders/{orderId}/payments"
        actor: Customer
        preconditions:
          - "customer.credit_balance_cents >= amount_cents (ERR_INSUFFICIENT_CREDIT)"
          - "After applying payment, escrow_cents >= deposit_required_cents AND escrow_cents < quoted_total_cents"
        side_effects:
          - "customer.credit_balance_cents -= amount_cents; escrow_cents += amount_cents (invariant: credit+escrow conserved)"
      - from: DEPOSIT_PAID
        to: PAID_IN_FULL
        trigger: "POST /orders/{orderId}/payments"
        actor: Customer
        preconditions:
          - "customer.credit_balance_cents >= amount_cents (ERR_INSUFFICIENT_CREDIT)"
          - "After applying payment, escrow_cents >= quoted_total_cents"
        side_effects:
          - "customer.credit_balance_cents -= amount_cents; escrow_cents += amount_cents"
      - from: UNPAID
        to: PAID_IN_FULL
        trigger: "POST /orders/{orderId}/payments"
        actor: Customer
        preconditions:
          - "customer.credit_balance_cents >= amount_cents (ERR_INSUFFICIENT_CREDIT)"
          - "After applying payment, escrow_cents >= quoted_total_cents"
        side_effects:
          - "customer.credit_balance_cents -= amount_cents; escrow_cents += amount_cents"

  # ------------------------------------------------------------------ OrderLine
  - entity: OrderLine
    initial_state: PENDING_ART
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_ART
        to: ART_READY
        trigger: "system (bubble when the line's ArtProof is APPROVED)"
        actor: system
        preconditions:
          - "An ArtProof for this line just reached APPROVED"
        side_effects:
          - "Re-evaluate parent Order.art_complete (bubble up)"
      - from: ART_READY
        to: PENDING_ART
        trigger: "system (a new ArtProof is created for the line, superseding the approved one)"
        actor: system
        preconditions:
          - "A superseding ArtProof was created (prior APPROVED proof -> SUPERSEDED)"
        side_effects:
          - "Re-evaluate parent Order.art_complete"
      - from: ART_READY
        to: CONFIRMED
        trigger: "system (cascade from Order QUOTED -> CONFIRMED)"
        actor: system
        preconditions:
          - "Parent Order transitioned to CONFIRMED"
        side_effects:
          - "locked_unit_price_cents = unit_price_cents"
      - from: CONFIRMED
        to: SCHEDULED
        trigger: "POST /order-lines/{lineId}/schedule"
        actor: ProductionManager
        preconditions:
          - "OrderLine.status == CONFIRMED (ERR_LINE_INVALID_STATE)"
          - "Parent Order.fulfillment_status == IN_PRODUCTION (ERR_ORDER_NOT_IN_PRODUCTION)"
          - "The line's active (non-CANCELLED) PurchaseOrder exists and is RECEIVED (ERR_PO_NOT_RECEIVED)  [cross-entity OrderLine->PurchaseOrder]"
          - "[scheduled_start, scheduled_end) does not overlap any other non-cancelled line's window on the same station (ERR_STATION_DOUBLE_BOOKED)"
        side_effects:
          - "station_id, scheduled_start, scheduled_end set"
      - from: SCHEDULED
        to: PRINTING
        trigger: "POST /order-lines/{lineId}/start-print"
        actor: ProductionManager
        preconditions:
          - "OrderLine.status == SCHEDULED (ERR_LINE_INVALID_STATE)"
        side_effects: []
      - from: PRINTING
        to: QC_HOLD
        trigger: "POST /order-lines/{lineId}/complete-run"
        actor: ProductionManager
        preconditions:
          - "OrderLine.status == PRINTING (ERR_LINE_INVALID_STATE)"
          - "0 <= spoiled_qty <= produced_qty (ERR_PRODUCED_QTY_INVALID)"
        side_effects:
          - "produced_qty, spoiled_qty set; good_qty = produced_qty - spoiled_qty"
      - from: QC_HOLD
        to: COMPLETED
        trigger: "POST /order-lines/{lineId}/qc  (result=PASS)"
        actor: ProductionManager
        preconditions:
          - "OrderLine.status == QC_HOLD (ERR_LINE_INVALID_STATE)"
          - "good_qty within spoilage tolerance band [min_acceptable_good, max_acceptable_good] (ERR_SPOILAGE_OUT_OF_TOLERANCE)"
        side_effects:
          - "final_line_subtotal_cents = (locked_unit_price_cents + extra-color run) * good_qty + line_setup_cents (calc order_total variant=FINAL per line)"
      - from: QC_HOLD
        to: PRINTING
        trigger: "POST /order-lines/{lineId}/qc  (result=REJECT)"
        actor: ProductionManager
        preconditions:
          - "OrderLine.status == QC_HOLD (ERR_LINE_INVALID_STATE)"
        side_effects:
          - "produced_qty, spoiled_qty, good_qty reset to null for the rework run (cyclic)"
      - from: PENDING_ART
        to: CANCELLED
        trigger: "system (cascade from Order cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "If the line's active PurchaseOrder is ISSUED -> PurchaseOrder CANCELLED (chains supplier release)"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system (cascade from Order cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "If the line's active PurchaseOrder is ISSUED -> PurchaseOrder CANCELLED (chains supplier release)"

  # ------------------------------------------------------------------ ArtProof (cyclic)
  - entity: ArtProof
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /art-proofs/{proofId}/submit"
        actor: AccountManager
        preconditions:
          - "ArtProof.status == DRAFT (ERR_ART_INVALID_STATE)"
        side_effects: []
      - from: PENDING_APPROVAL
        to: CHANGES_REQUESTED
        trigger: "POST /art-proofs/{proofId}/request-changes"
        actor: Customer
        preconditions:
          - "ArtProof.status == PENDING_APPROVAL (ERR_ART_INVALID_STATE)"
          - "Acting Customer owns the parent order (ERR_NOT_ORDER_OWNER)"
        side_effects: []
      - from: CHANGES_REQUESTED
        to: PENDING_APPROVAL
        trigger: "POST /art-proofs/{proofId}/submit"
        actor: AccountManager
        preconditions:
          - "ArtProof.status == CHANGES_REQUESTED (ERR_ART_INVALID_STATE)"
        side_effects: []
        note: "This edge closes the revision cycle PENDING_APPROVAL <-> CHANGES_REQUESTED."
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /art-proofs/{proofId}/approve"
        actor: Customer
        preconditions:
          - "ArtProof.status == PENDING_APPROVAL (ERR_ART_INVALID_STATE)"
          - "Acting Customer owns the parent order (ERR_NOT_ORDER_OWNER)"
        side_effects:
          - "approved_version = parent OrderLine.version (version-pin)"
          - "CASCADE hop 1: parent OrderLine PENDING_ART -> ART_READY"
          - "CASCADE hop 2: parent Order.art_complete recomputed (bubble up)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a newer ArtProof is created for the same line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING_APPROVAL
        to: SUPERSEDED
        trigger: "system (a newer ArtProof is created for the same line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHANGES_REQUESTED
        to: SUPERSEDED
        trigger: "system (a newer ArtProof is created for the same line)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer ArtProof is created, re-opening the line's art)"
        actor: system
        preconditions: []
        side_effects:
          - "parent OrderLine ART_READY -> PENDING_ART; Order.art_complete recomputed"

  # ------------------------------------------------------------------ PurchaseOrder
  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /purchase-orders/{poId}/issue"
        actor: AccountManager
        preconditions:
          - "PurchaseOrder.status == DRAFT (ERR_PO_INVALID_STATE)"
          - "Aggregate ISSUED ordered_blank_qty on the supplier at any instant within [production_start, production_end) plus this PO's ordered_blank_qty <= supplier.concurrent_capacity_units (ERR_SUPPLIER_CAPACITY_EXCEEDED)"
        side_effects:
          - "estimated_blank_cost_cents = ordered_blank_qty * supplier.blank_unit_cost_cents (calc blank_cost variant=ESTIMATED)"
          - "supplier.reserved_blank_qty += ordered_blank_qty"
      - from: ISSUED
        to: RECEIVED
        trigger: "POST /purchase-orders/{poId}/receive"
        actor: ProductionManager
        preconditions:
          - "PurchaseOrder.status == ISSUED (ERR_PO_INVALID_STATE)"
        side_effects:
          - "received_blank_qty set; actual_blank_cost_cents = received_blank_qty * supplier.blank_unit_cost_cents (calc blank_cost variant=ACTUAL)"
          - "supplier.reserved_blank_qty -= ordered_blank_qty (reservation released on receipt)"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /purchase-orders/{poId}/cancel"
        actor: AccountManager
        preconditions:
          - "PurchaseOrder.status in {DRAFT, ISSUED} (ERR_PO_INVALID_STATE)"
        side_effects: []
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /purchase-orders/{poId}/cancel  (or cascade from OrderLine cancel)"
        actor: AccountManager
        preconditions:
          - "PurchaseOrder.status in {DRAFT, ISSUED} (ERR_PO_INVALID_STATE)"
        side_effects:
          - "supplier.reserved_blank_qty -= ordered_blank_qty (compensating release)"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: art-proof-create-stale-line
    parent_entity: OrderLine
    write_endpoint: "POST /order-lines/{id}/art-proofs"
    occ_field: "expected_order_line_version"
    description: |
      Creating a new ArtProof against an OrderLine whose version has advanced
      since the client last observed it is rejected. A new proof legitimately
      supersedes the line's prior active proof (only one active proof per line),
      so a client acting on a stale view of the line — one where another proof
      was just created and bumped the line's version — is refused rather than
      silently superseding an unexpected proof.
    error_id: ERR_STALE_ORDER_LINE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_subtotal
    trigger: "OrderLine create; recomputed at order quote"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial mode (a): >=3 inputs (quantity tier selection, imprint_color_count,
      # method setup/run constants), non-linear tier selection + conditional branches.
      # 1. Tier selection (order-independent, deterministic):
      candidates = PriceTiers where product_id == line.product_id
                   AND decoration_method == line.decoration_method
                   AND min_quantity <= line.quantity
      if candidates is empty: reject ERR_TIER_NOT_FOUND
      tier = candidate with the LARGEST min_quantity (unique by construction)
      unit_price_cents = tier.unit_price_cents
      # 2. Extra-color run charge (per unit), method-specific:
      extra_colors = line.imprint_color_count - 1
      run_per_unit = extra_colors * METHOD[method].run_addl_per_unit_cents
      per_unit_cents = unit_price_cents + run_per_unit
      goods_cents = per_unit_cents * line.quantity
      # 3. Setup (one-time), method-specific:
      line_setup_cents = METHOD[method].setup_first_color_cents
                         + extra_colors * METHOD[method].setup_addl_color_cents
      line_subtotal_cents = goods_cents + line_setup_cents
      # SAMPLE orders: line_setup_cents forced to 0 (setup waived on samples).
    input_set: "The single OrderLine and the PriceTier set for its product+method."
    constants:
      METHOD:
        SCREEN_PRINT:  { setup_first_color_cents: 2500, setup_addl_color_cents: 1500, run_addl_per_unit_cents: 40, max_colors: 6 }
        EMBROIDERY:    { setup_first_color_cents: 4000, setup_addl_color_cents: 0,    run_addl_per_unit_cents: 0,  max_colors: 12 }
        LASER_ENGRAVE: { setup_first_color_cents: 3000, setup_addl_color_cents: 0,    run_addl_per_unit_cents: 0,  max_colors: 1 }
    precision: "integer cents; no rounding needed (all integer arithmetic)"

  - name: order_total
    trigger: "order quote (variant=QUOTED); shipment creation (variant=FINAL)"
    algorithm: aggregation
    formula: |
      # Combinatorial mode (b): rounding order is PINNED as sum-then-round.
      # The rush surcharge is a percentage; it is applied to the SUMMED subtotal and
      # rounded ONCE (round_half_up), NOT per-line then summed. This is the pinned order.
      subtotal = SUM over non-cancelled OrderLines of <line subtotal for the variant>
      rush = is_rush ? round_half_up(subtotal * RUSH_SURCHARGE_PCT) : 0
      total = subtotal + rush
    input_set: "All non-cancelled OrderLines of the order."
    constants:
      RUSH_SURCHARGE_PCT: 0.20
      DEPOSIT_PCT: 0.50
    precision: "integer cents; rush surcharge rounded half-up once, after summing lines"
    variants:
      - name: QUOTED
        when: "at order quote"
        difference: "per-line subtotal uses ordered line.quantity (forward-looking estimate) -> quoted_subtotal/quoted_rush/quoted_total"
      - name: FINAL
        when: "at shipment creation (actual production known)"
        difference: "per-line subtotal uses actual good_qty and locked_unit_price_cents (goods = (locked_unit_price_cents + extra-color run)*good_qty + line_setup_cents) -> final_subtotal/final_rush/final_total. Differs from QUOTED whenever good_qty != ordered quantity (within spoilage band)."

  - name: blank_cost
    trigger: "PurchaseOrder issue (variant=ESTIMATED); PurchaseOrder receive (variant=ACTUAL)"
    algorithm: aggregation
    formula: |
      estimated_blank_cost_cents = ordered_blank_qty  * supplier.blank_unit_cost_cents
      actual_blank_cost_cents    = received_blank_qty * supplier.blank_unit_cost_cents
    input_set: "The single PurchaseOrder and its supplier."
    precision: "integer cents"
    variants:
      - name: ESTIMATED
        when: "at issue"
        difference: "uses ordered_blank_qty (projected)"
      - name: ACTUAL
        when: "at receive"
        difference: "uses received_blank_qty (actual); differs whenever the supplier under/over-ships"

  - name: lead_time_rush
    trigger: "order quote (is_rush); order confirm (min-lead-time gate)"
    algorithm: threshold
    formula: |
      lead_days = whole days from current clock date (00:00Z) to in_hands_date (00:00Z)
      is_rush = lead_days < RUSH_THRESHOLD_DAYS          # strict <
      # confirm gate:
      if lead_days < ABSOLUTE_MIN_LEAD_DAYS: reject ERR_INSUFFICIENT_LEAD_TIME   # strict <
    input_set: "Order.in_hands_date and the logical clock (default 2026-05-01T00:00:00Z)."
    constants:
      RUSH_THRESHOLD_DAYS: 10
      ABSOLUTE_MIN_LEAD_DAYS: 3
    precision: "whole days (floor of the date difference)"

  - name: spoilage_tolerance
    trigger: "order-line QC pass"
    algorithm: threshold
    formula: |
      tol = OrderLine.quantity   # ordered quantity is the reference
      min_acceptable_good = quantity - floor(quantity * UNDERRUN_TOL)
      max_acceptable_good = quantity + floor(quantity * OVERRUN_TOL)
      pass requires: min_acceptable_good <= good_qty <= max_acceptable_good   # inclusive both ends
      else reject ERR_SPOILAGE_OUT_OF_TOLERANCE
      # SAMPLE orders: band collapses to exactly [quantity, quantity] (no allowance).
    input_set: "The single OrderLine after complete-run."
    constants:
      UNDERRUN_TOL: 0.05
      OVERRUN_TOL: 0.05
    precision: "integer units; tolerance bounds use floor()"

  - name: station_schedule_overlap
    trigger: "order-line schedule"
    algorithm: interval_merge
    formula: |
      # Interval semantics A: PAIRWISE, half-open [start, end). Adjacency (end == start)
      # is allowed (no buffer). Reject if this line's window strictly overlaps any other
      # non-cancelled line's window on the SAME station:
      overlap(x, y) := x.start < y.end AND y.start < x.end
      if any other non-cancelled OrderLine on station_id overlaps -> ERR_STATION_DOUBLE_BOOKED
    input_set: "Non-cancelled OrderLines already assigned to the target station."
    precision: "datetime comparison; half-open intervals"

  - name: supplier_capacity_load
    trigger: "purchase-order issue"
    algorithm: aggregation
    formula: |
      # Interval semantics B: AGGREGATE weighted capacity (interval stabbing), NOT pairwise.
      # For any instant t within this PO's [production_start, production_end), the sum of
      # ordered_blank_qty over ISSUED POs on the supplier whose windows contain t, plus this
      # PO's ordered_blank_qty, must not exceed supplier.concurrent_capacity_units.
      peak = max over t in [production_start, production_end) of
             ( ordered_blank_qty
               + SUM ordered_blank_qty of ISSUED POs(supplier) whose [start,end) contains t )
      if peak > supplier.concurrent_capacity_units -> ERR_SUPPLIER_CAPACITY_EXCEEDED
    input_set: "ISSUED PurchaseOrders on the same supplier with overlapping windows."
    precision: "integer units; half-open interval stabbing at window boundaries"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation (RBAC); for entity_backed Customer, X-User-ID must own the targeted order/line/proof"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve (left-to-right in path first): supplier, product, price-tier, customer, station, order, order-line, art-proof, purchase-order, shipment"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource-scoped endpoints

  - priority: 4
    category: state
    check: "Target resource is in the required state for the transition (order/line/art-proof/PO state preconditions)"
    error_id: "varies (ERR_ORDER_NOT_QUOTED, ERR_ORDER_NOT_DRAFT, ERR_ORDER_NOT_CONFIRMED, ERR_ORDER_NOT_IN_PRODUCTION, ERR_ORDER_NOT_SHIPPED, ERR_ORDER_NOT_CANCELLABLE, ERR_LINE_INVALID_STATE, ERR_ART_INVALID_STATE, ERR_PO_INVALID_STATE)"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 5
    category: business_referential
    check: "Cross-entity linkage: (confirm) every line has APPROVED art -> ERR_ART_NOT_APPROVED; (schedule) line's active PO is RECEIVED -> ERR_PO_NOT_RECEIVED; (create PO) no active PO already exists for the line -> ERR_PO_ALREADY_EXISTS; (create PO) supplier matches / product matches line -> ERR_LINE_PRODUCT_MISMATCH; (reorder) source order DELIVERED -> ERR_REORDER_SOURCE_NOT_DELIVERED"
    error_id: "varies"
    http_status: 409
    applies_to: "POST /orders/{id}/confirm, POST /order-lines/{id}/schedule, POST /purchase-orders, POST /orders/{id}/reorder"

  - priority: 6
    category: business_temporal
    check: "Time-window rules: (confirm) lead_days >= ABSOLUTE_MIN_LEAD_DAYS -> ERR_INSUFFICIENT_LEAD_TIME; (schedule) station window free -> ERR_STATION_DOUBLE_BOOKED"
    error_id: "ERR_INSUFFICIENT_LEAD_TIME | ERR_STATION_DOUBLE_BOOKED"
    http_status: 422
    applies_to: "POST /orders/{id}/confirm, POST /order-lines/{id}/schedule"

  - priority: 7
    category: business_constraint
    check: "Quantity / capacity / value constraints: (line) quantity >= product.min_order_qty -> ERR_BELOW_MIN_QUANTITY; (line) a matching PriceTier exists -> ERR_TIER_NOT_FOUND; (line) imprint_color_count <= method max_colors -> ERR_MAX_COLORS_EXCEEDED; (line) SAMPLE quantity <= SAMPLE_MAX_QTY -> ERR_SAMPLE_QTY_EXCEEDED; (quote) order has >=1 line -> ERR_NO_ORDER_LINES; (complete-run) 0<=spoiled<=produced -> ERR_PRODUCED_QTY_INVALID; (qc) good within tolerance -> ERR_SPOILAGE_OUT_OF_TOLERANCE; (PO issue) supplier capacity -> ERR_SUPPLIER_CAPACITY_EXCEEDED"
    error_id: "varies"
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /orders/{id}/quote, POST /order-lines/{id}/complete-run, POST /order-lines/{id}/qc, POST /purchase-orders/{id}/issue"

  - priority: 8
    category: business_fiscal
    check: "Money constraints: (confirm) escrow_cents >= deposit_required_cents -> ERR_DEPOSIT_REQUIRED; (payment) customer.credit_balance_cents >= amount_cents -> ERR_INSUFFICIENT_CREDIT"
    error_id: "ERR_DEPOSIT_REQUIRED | ERR_INSUFFICIENT_CREDIT"
    http_status: 402
    applies_to: "POST /orders/{id}/confirm, POST /orders/{id}/payments"

  - priority: 9
    category: business_constraint
    check: "Field-format checks resolved before deeper business rules where cheap: production_end > production_start, scheduled_end > scheduled_start, in_hands_date parseable"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /purchase-orders, POST /order-lines/{id}/schedule, POST /orders"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Supplier ----
  - { method: POST, path: "/suppliers", description: "Create a supplier", roles: [CatalogAdmin], code: 201,
      input: [name, blank_unit_cost_cents, concurrent_capacity_units], output: Supplier,
      side_effects: ["reserved_blank_qty initialized to 0"] }
  - { method: GET, path: "/suppliers/{supplierId}", description: "Get a supplier", roles: [CatalogAdmin, AccountManager, ProductionManager], code: 200, input: [], output: Supplier, side_effects: [] }

  # ---- Product & PriceTier ----
  - { method: POST, path: "/products", description: "Create a catalog product (blank)", roles: [CatalogAdmin], code: 201,
      input: [supplier_id, sku, name, min_order_qty], output: Product, side_effects: [] }
  - { method: GET, path: "/products/{productId}", description: "Get a product", roles: [CatalogAdmin, AccountManager, ProductionManager, Customer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: GET, path: "/products", description: "List products, optionally filtered by supplier", roles: [CatalogAdmin, AccountManager, ProductionManager, Customer], code: 200,
      input: ["supplier_id?", "limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: POST, path: "/products/{id}/price-tiers", description: "Add a quantity price break for a product+method", roles: [CatalogAdmin], code: 201,
      input: [decoration_method, min_quantity, unit_price_cents], output: PriceTier, side_effects: [] }
  - { method: GET, path: "/products/{id}/price-tiers", description: "List a product's price tiers (reverse-reach PriceTier->Product)", roles: [CatalogAdmin, AccountManager, ProductionManager, Customer], code: 200,
      input: ["limit?", "offset?"], output: "PriceTier[]", side_effects: [] }

  # ---- DecorationStation ----
  - { method: POST, path: "/decoration-stations", description: "Create a decoration station/press", roles: [CatalogAdmin], code: 201,
      input: [name, station_type], output: DecorationStation, side_effects: [] }
  - { method: GET, path: "/decoration-stations/{stationId}", description: "Get a decoration station", roles: [CatalogAdmin, AccountManager, ProductionManager], code: 200, input: [], output: DecorationStation, side_effects: [] }

  # ---- Customer ----
  - { method: POST, path: "/customers", description: "Create a customer prepaid account", roles: [CatalogAdmin], code: 201,
      input: [name, initial_credit_cents], output: Customer,
      side_effects: ["total_funded_cents = credit_balance_cents = initial_credit_cents"] }
  - { method: GET, path: "/customers/{customerId}", description: "Get a customer", roles: [CatalogAdmin, AccountManager, Customer], code: 200, input: [], output: Customer, side_effects: [] }

  # ---- Order ----
  - { method: POST, path: "/orders", description: "Create a draft order", roles: [Customer, AccountManager], code: 201,
      input: [customer_id, "order_type?", "reorder_source_order_id?", in_hands_date], output: Order,
      side_effects: ["fulfillment_status=DRAFT, payment_status=UNPAID, escrow_cents=0"] }
  - { method: GET, path: "/orders/{orderId}", description: "Get an order", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET, path: "/orders", description: "List orders, optionally filtered by customer or reorder source", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200,
      input: ["customer_id?", "reorder_source_order_id?", "limit?", "offset?"], output: "Order[]", side_effects: [] }
  - { method: POST, path: "/orders/{orderId}/lines", description: "Add a line to a draft order", roles: [Customer, AccountManager], code: 201,
      input: [product_id, decoration_method, quantity, "imprint_color_count?"], output: OrderLine,
      side_effects: ["status=PENDING_ART", "compute unit_price_cents, line_setup_cents, line_subtotal_cents (calc line_subtotal)", "Order.art_complete recomputed (now false)"] }
  - { method: POST, path: "/orders/{orderId}/quote", description: "Quote the order (lock pricing + rush + deposit)", roles: [AccountManager], code: 200,
      input: [], output: Order,
      side_effects: ["fulfillment_status DRAFT->QUOTED", "compute is_rush, quoted_subtotal_cents, quoted_rush_cents, quoted_total_cents, deposit_required_cents"] }
  - { method: POST, path: "/orders/{orderId}/confirm", description: "Confirm the order for production", roles: [AccountManager], code: 200,
      input: [], output: Order,
      side_effects: ["fulfillment_status QUOTED->CONFIRMED", "each line ART_READY->CONFIRMED with locked_unit_price_cents pinned"] }
  - { method: POST, path: "/orders/{orderId}/start-production", description: "Release order to the shop floor", roles: [ProductionManager], code: 200,
      input: [], output: Order, side_effects: ["fulfillment_status CONFIRMED->IN_PRODUCTION"] }
  - { method: POST, path: "/orders/{orderId}/cancel", description: "Cancel an order (cascade lines/POs, refund escrow)", roles: [AccountManager], code: 200,
      input: [], output: Order,
      side_effects: ["fulfillment_status->CANCELLED", "cascade lines->CANCELLED, ISSUED POs->CANCELLED, supplier.reserved_blank_qty released", "escrow refunded to customer.credit_balance_cents, payment_status->REFUNDED"] }
  - { method: POST, path: "/orders/{orderId}/deliver", description: "Mark a shipped order delivered", roles: [ProductionManager], code: 200,
      input: [], output: Order, side_effects: ["fulfillment_status SHIPPED->DELIVERED"] }
  - { method: POST, path: "/orders/{orderId}/payments", description: "Apply a payment from customer credit into order escrow", roles: [Customer], code: 200,
      input: [amount_cents], output: Order,
      side_effects: ["customer.credit_balance_cents -= amount_cents; escrow_cents += amount_cents", "payment_status recomputed from escrow vs deposit_required/quoted_total"] }
  - { method: POST, path: "/orders/{sourceOrderId}/reorder", description: "Create a new order by copying a DELIVERED source order's lines", roles: [Customer, AccountManager], code: 201,
      input: [in_hands_date], output: Order,
      side_effects: ["new Order order_type=REORDER, reorder_source_order_id=sourceOrderId, lines copied as PENDING_ART with recomputed pricing"] }

  # ---- OrderLine ----
  - { method: GET, path: "/order-lines/{lineId}", description: "Get an order line", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200, input: [], output: OrderLine, side_effects: [] }
  - { method: GET, path: "/order-lines", description: "List order lines filtered by order/product/station/PO (reverse-reach)", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200,
      input: ["order_id?", "product_id?", "station_id?", "limit?", "offset?"], output: "OrderLine[]", side_effects: [] }
  - { method: POST, path: "/order-lines/{lineId}/schedule", description: "Assign a station + production window to a line", roles: [ProductionManager], code: 200,
      input: [station_id, scheduled_start, scheduled_end], output: OrderLine,
      side_effects: ["status CONFIRMED->SCHEDULED", "station_id/scheduled_start/scheduled_end set (after PO-received + overlap checks)"] }
  - { method: POST, path: "/order-lines/{lineId}/start-print", description: "Begin the decoration run", roles: [ProductionManager], code: 200,
      input: [], output: OrderLine, side_effects: ["status SCHEDULED->PRINTING"] }
  - { method: POST, path: "/order-lines/{lineId}/complete-run", description: "Record produced and spoiled units", roles: [ProductionManager], code: 200,
      input: [produced_qty, spoiled_qty], output: OrderLine, side_effects: ["status PRINTING->QC_HOLD", "good_qty = produced_qty - spoiled_qty"] }
  - { method: POST, path: "/order-lines/{lineId}/qc", description: "QC decision (PASS completes, REJECT reworks)", roles: [ProductionManager], code: 200,
      input: [result], output: OrderLine,
      side_effects: ["PASS: QC_HOLD->COMPLETED with final_line_subtotal_cents (spoilage-tolerance gate)", "REJECT: QC_HOLD->PRINTING, run counters reset"] }

  # ---- ArtProof ----
  - { method: POST, path: "/order-lines/{id}/art-proofs", description: "Create a new art proof for a line (supersedes prior active proof; OCC on line version)", roles: [AccountManager], code: 201,
      input: [proof_url, "notes?", expected_order_line_version], output: ArtProof,
      side_effects: ["new proof status=DRAFT, revision_number set", "prior non-terminal proof for the line -> SUPERSEDED (approved line reverts ART_READY->PENDING_ART)", "increments OrderLine.version by 1"] }
  - { method: GET, path: "/order-lines/{id}/art-proofs", description: "List a line's art proofs (reverse-reach ArtProof->OrderLine)", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200,
      input: ["limit?", "offset?"], output: "ArtProof[]", side_effects: [] }
  - { method: GET, path: "/art-proofs/{proofId}", description: "Get an art proof", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200, input: [], output: ArtProof, side_effects: [] }
  - { method: POST, path: "/art-proofs/{proofId}/submit", description: "Submit a draft/changes-requested proof for approval", roles: [AccountManager], code: 200,
      input: [], output: ArtProof, side_effects: ["status DRAFT|CHANGES_REQUESTED -> PENDING_APPROVAL"] }
  - { method: POST, path: "/art-proofs/{proofId}/approve", description: "Customer approves the proof", roles: [Customer], code: 200,
      input: [], output: ArtProof,
      side_effects: ["status PENDING_APPROVAL->APPROVED", "approved_version pinned", "line PENDING_ART->ART_READY, Order.art_complete recomputed"] }
  - { method: POST, path: "/art-proofs/{proofId}/request-changes", description: "Customer requests changes", roles: [Customer], code: 200,
      input: ["notes?"], output: ArtProof, side_effects: ["status PENDING_APPROVAL->CHANGES_REQUESTED"] }

  # ---- PurchaseOrder ----
  - { method: POST, path: "/purchase-orders", description: "Create a draft PO to source blanks for a line", roles: [AccountManager], code: 201,
      input: [order_line_id, supplier_id, ordered_blank_qty, production_start, production_end], output: PurchaseOrder,
      side_effects: ["status=DRAFT", "order_id/product_id copied from the line", "checks: no active PO exists for the line, product/supplier consistency"] }
  - { method: GET, path: "/purchase-orders/{poId}", description: "Get a purchase order", roles: [AccountManager, ProductionManager, CatalogAdmin], code: 200, input: [], output: PurchaseOrder, side_effects: [] }
  - { method: GET, path: "/purchase-orders", description: "List POs filtered by line/order/product/supplier (reverse-reach)", roles: [AccountManager, ProductionManager, CatalogAdmin], code: 200,
      input: ["order_line_id?", "order_id?", "product_id?", "supplier_id?", "limit?", "offset?"], output: "PurchaseOrder[]", side_effects: [] }
  - { method: POST, path: "/purchase-orders/{poId}/issue", description: "Issue the PO (reserve supplier capacity)", roles: [AccountManager], code: 200,
      input: [], output: PurchaseOrder,
      side_effects: ["status DRAFT->ISSUED", "estimated_blank_cost_cents computed", "supplier.reserved_blank_qty += ordered_blank_qty (after capacity check)"] }
  - { method: POST, path: "/purchase-orders/{poId}/receive", description: "Receive blanks", roles: [ProductionManager], code: 200,
      input: [received_blank_qty], output: PurchaseOrder,
      side_effects: ["status ISSUED->RECEIVED", "actual_blank_cost_cents computed", "supplier.reserved_blank_qty -= ordered_blank_qty"] }
  - { method: POST, path: "/purchase-orders/{poId}/cancel", description: "Cancel a PO (release reservation)", roles: [AccountManager], code: 200,
      input: [], output: PurchaseOrder,
      side_effects: ["status->CANCELLED", "if was ISSUED: supplier.reserved_blank_qty -= ordered_blank_qty"] }

  # ---- Shipment ----
  - { method: POST, path: "/shipments", description: "Ship an in-production order (computes final totals, moves order to SHIPPED)", roles: [ProductionManager], code: 201,
      input: [order_id, carrier, "tracking_number?"], output: Shipment,
      side_effects: ["order fulfillment_status IN_PRODUCTION->SHIPPED", "final_subtotal/final_rush/final_total computed (calc order_total variant=FINAL)", "Shipment.final_total_cents/total_good_qty/shipped_at set"] }
  - { method: GET, path: "/shipments/{shipmentId}", description: "Get a shipment", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200, input: [], output: Shipment, side_effects: [] }
  - { method: GET, path: "/shipments", description: "List shipments filtered by order (reverse-reach Shipment->Order)", roles: [Customer, AccountManager, ProductionManager, CatalogAdmin], code: 200,
      input: ["order_id?", "limit?", "offset?"], output: "Shipment[]", side_effects: [] }

  # ---- Test-driving: logical clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (server default 2026-05-01T00:00:00Z before any call; never falls back to wall-clock). Drives in_hands lead-time and shipped_at determinism.", roles: [CatalogAdmin, AccountManager, ProductionManager], code: 200,
      input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # -- auth --
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_NOT_ORDER_OWNER, http: 403, condition: "Acting Customer's X-User-ID does not own the targeted order/line/proof" }
  # -- existence --
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "supplierId does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "productId does not exist" }
  - { id: ERR_PRICE_TIER_NOT_FOUND, http: 404, condition: "priceTierId does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customerId does not exist" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "stationId does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId does not exist" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "lineId does not exist" }
  - { id: ERR_ART_PROOF_NOT_FOUND, http: 404, condition: "proofId does not exist" }
  - { id: ERR_PURCHASE_ORDER_NOT_FOUND, http: 404, condition: "poId does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipmentId does not exist" }
  # -- format --
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field or wrong type / invalid enum value" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "end <= start on a production/scheduling window, or unparseable date" }
  # -- state --
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "quote requires order in DRAFT" }
  - { id: ERR_ORDER_NOT_QUOTED, http: 409, condition: "confirm requires order in QUOTED" }
  - { id: ERR_ORDER_NOT_CONFIRMED, http: 409, condition: "start-production requires order in CONFIRMED; or a line op requires parent order not yet IN_PRODUCTION" }
  - { id: ERR_ORDER_NOT_IN_PRODUCTION, http: 409, condition: "shipment/schedule requires order in IN_PRODUCTION" }
  - { id: ERR_ORDER_NOT_SHIPPED, http: 409, condition: "deliver requires order in SHIPPED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires order in DRAFT/QUOTED/CONFIRMED" }
  - { id: ERR_LINE_INVALID_STATE, http: 409, condition: "line not in the required state for schedule/start-print/complete-run/qc/start-production" }
  - { id: ERR_ART_INVALID_STATE, http: 409, condition: "art proof not in the required state for submit/approve/request-changes" }
  - { id: ERR_PO_INVALID_STATE, http: 409, condition: "purchase order not in the required state for issue/receive/cancel" }
  # -- OCC --
  - { id: ERR_STALE_ORDER_LINE_VERSION, http: 412, condition: "expected_order_line_version does not match the line's current version on art-proof create" }
  # -- business_referential --
  - { id: ERR_ART_NOT_APPROVED, http: 409, condition: "confirm blocked: some non-cancelled line lacks an APPROVED art proof" }
  - { id: ERR_PO_NOT_RECEIVED, http: 409, condition: "schedule blocked: line's active purchase order is not RECEIVED" }
  - { id: ERR_PO_ALREADY_EXISTS, http: 409, condition: "create PO blocked: a non-cancelled PO already exists for the line" }
  - { id: ERR_LINE_PRODUCT_MISMATCH, http: 422, condition: "PO product/order derived from line is inconsistent with the request context" }
  - { id: ERR_REORDER_SOURCE_NOT_DELIVERED, http: 409, condition: "reorder source order is not in DELIVERED state" }
  # -- business_temporal --
  - { id: ERR_INSUFFICIENT_LEAD_TIME, http: 422, condition: "confirm blocked: whole-day lead to in_hands_date < ABSOLUTE_MIN_LEAD_DAYS" }
  - { id: ERR_STATION_DOUBLE_BOOKED, http: 409, condition: "line window overlaps another non-cancelled line's window on the same station" }
  # -- business_constraint --
  - { id: ERR_BELOW_MIN_QUANTITY, http: 422, condition: "line quantity < product.min_order_qty" }
  - { id: ERR_TIER_NOT_FOUND, http: 422, condition: "no PriceTier matches product+method with min_quantity <= quantity" }
  - { id: ERR_MAX_COLORS_EXCEEDED, http: 422, condition: "imprint_color_count exceeds the decoration method's max_colors" }
  - { id: ERR_SAMPLE_QTY_EXCEEDED, http: 422, condition: "SAMPLE order line quantity > SAMPLE_MAX_QTY" }
  - { id: ERR_NO_ORDER_LINES, http: 409, condition: "quote/confirm on an order with zero non-cancelled lines" }
  - { id: ERR_PRODUCED_QTY_INVALID, http: 422, condition: "complete-run with spoiled_qty < 0 or spoiled_qty > produced_qty" }
  - { id: ERR_SPOILAGE_OUT_OF_TOLERANCE, http: 422, condition: "QC pass blocked: good_qty outside the spoilage tolerance band" }
  - { id: ERR_SUPPLIER_CAPACITY_EXCEEDED, http: 409, condition: "PO issue blocked: aggregate ISSUED load over the window exceeds supplier.concurrent_capacity_units" }
  # -- business_fiscal --
  - { id: ERR_DEPOSIT_REQUIRED, http: 402, condition: "confirm blocked: escrow_cents < deposit_required_cents" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "payment blocked: customer.credit_balance_cents < amount_cents" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CatalogAdmin
    description: "Manages catalog and configuration: suppliers, products, price tiers, decoration stations, customer accounts; operates the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /suppliers, POST /products, POST /products/{id}/price-tiers, POST /decoration-stations, POST /customers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (reads) across catalog, orders, lines, proofs, POs, shipments"

  - name: AccountManager
    description: "Internal sales: builds orders, quotes, confirms, cancels, submits art proofs, sources blanks via purchase orders, places reorders."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/quote, POST /orders/{id}/confirm, POST /orders/{id}/cancel"
      - "POST /order-lines/{id}/art-proofs, POST /art-proofs/{id}/submit"
      - "POST /purchase-orders, POST /purchase-orders/{id}/issue, POST /purchase-orders/{id}/cancel"
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/reorder (shared with Customer)"
      - "GET reads; POST /_clock/set_current_utc"

  - name: ProductionManager
    description: "Shop floor: releases production, schedules stations, runs and QCs decoration, receives blanks, ships and delivers."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/start-production, POST /orders/{id}/deliver"
      - "POST /order-lines/{id}/schedule, /start-print, /complete-run, /qc"
      - "POST /purchase-orders/{id}/receive"
      - "POST /shipments"
    shared_operations:
      - "GET reads; POST /_clock/set_current_utc"

  - name: Customer
    description: "Buyer acting on their own account: places orders, funds/pays, approves or requests changes on art proofs, reorders."
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /orders/{id}/payments (own order)"
      - "POST /art-proofs/{id}/approve, POST /art-proofs/{id}/request-changes (own order's proofs)"
    shared_operations:
      - "POST /orders, POST /orders/{id}/lines, POST /orders/{id}/reorder (shared with AccountManager; must set/own customer_id)"
      - "GET reads on own resources and catalog"
