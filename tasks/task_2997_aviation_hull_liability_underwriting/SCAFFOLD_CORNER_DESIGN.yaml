      - name: corner_cascading_side_effects_end_to_end_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /aviation/claims/{id}/settlement]
          - endpoints[POST /aviation/schedules/{id}/warranty-findings]
        excluded_because:
          difficulty_instance: settlement_cascade_claim_to_schedule_to_ledger_to_policy_totals
          rationale: >-
            The §1.8 transitive_cascade instance already drives the deepest chain this scaffold has —
            settlement moves the Claim to SETTLED, cascades the AircraftSchedule to
            TOTAL_LOSS_SETTLED, appends the SETTLEMENT_RETURN ledger row and re-derives four Policy
            totals — and asserts every hop's value end to end, including that only non-terminal rows
            are touched. Its sibling
            warranty_breach_cascade_schedule_to_claim_to_outstanding_reserve covers the second chain
            (warranty finding -> schedule suspension -> open claims referred -> outstanding reserve
            re-derived) and the ordering sensitivity between them. A §1.9 instance here would restate
            the same hops with different literals.
      - name: corner_dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.hull_settlement_amount.variants
          - calculations.pilot_qualification_score.variants
        excluded_because:
          difficulty_instance: hull_settlement_agreed_value_vs_depreciated_value_basis
          rationale: >-
            Both declared dual-variant calculations are already pinned by §1.8 with the same loss data
            settled on each basis and the delta computed exactly: the hull settlement instance
            contrasts agreed_value_basis against depreciated_value_basis on one identical loss, and
            pilot_qualification_logged_hours_vs_verified_hours contrasts the logged-hours and
            verified-hours bands including the re-rate that follows the variant switch. Variant
            selection in context (which basis is legal from which warranty state) is additionally
            covered by §1.8's claim_settlement_gated_by_schedule_warranty_status.

