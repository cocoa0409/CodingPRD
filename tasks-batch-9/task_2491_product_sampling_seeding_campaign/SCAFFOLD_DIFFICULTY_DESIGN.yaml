          - validations[priority=29]
          - entities.FulfillmentCenter.fields.daily_pick_capacity_units
        distinguishing_aspect: |
          A different contended resource (the FULFILLMENT CENTER's daily pick capacity, aggregated over many
          waves) with the opposite interval convention: HALF-OPEN, so adjacency is FREE. The wave
          [2026-08-02T00:00:00Z, 2026-08-03T00:00:00Z) touches [2026-08-01T00:00:00Z, 2026-08-02T00:00:00Z)
          at a single instant and must NOT inherit its 4 occupied units, while the genuinely overlapping
          wave [2026-08-01T12:00:00Z, 2026-08-01T18:00:00Z) must sum 4 + 4 = 8 against a center ceiling of 6
