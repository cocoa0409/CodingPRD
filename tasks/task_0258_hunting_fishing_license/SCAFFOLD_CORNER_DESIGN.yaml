              as: DrawOfficer
          trigger:
            - call: "POST /draw-pools/${pool_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pool_v}" }
              as: DrawOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412"
            - "response.data.error_id == ERR_STALE_POOL_VERSION"

      - name: occ_correct_pool_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[draw-execute-stale-pool]
          - entities.DrawPool.fields.version
        distinguishing_aspect: "execute-draw with the current expected_draw_pool_version succeeds (status DRAWN) and DrawPool.version increments by exactly 1."
        test_recipe:
          setup: ["A CLOSED pool with one entrant; version observed via close-entries response."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /species-seasons"
              payload: { species: "ELK", season_open: "2026-09-01T00:00:00Z", season_close: "2026-10-01T00:00:00Z", bag_limit: 1, draw_required: true }
              as: DrawOfficer
              captures: { seas_id: $.data.id }
            - call: "POST /species-seasons/${seas_id}/open"
              payload: {}
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "TAG-ELK", product_kind: "TAG", base_fee_cents: 4500, species_season_id: "${seas_id}", residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_tag_id: $.data.id }
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-03-10T00:00:00Z" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A1", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a1_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${a1_id}" }
              as: DrawOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pool_v: $.data.version }
          trigger:
            - call: "POST /draw-pools/${pool_id}/execute-draw"
              payload: { expected_draw_pool_version: "${pool_v}" }
              as: DrawOfficer
              captures: { new_v: $.data.version }
          assert:
            - "DrawPool.${pool_id}.status == DRAWN"
            - "response.data.version == pool_v + 1"

      - name: draw_award_cascade_ordering
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DrawPool.CLOSED_to_DRAWN
          - entities.Applicant.fields.preference_points
        excluded_because:
          difficulty_instance: transitive_cascade / draw_award_depth3_cascade_application_license_points
          rationale: "End-to-end award->mint->point-reset cascade is verified in the named §1.8 cascade instance."

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: replacement_changes_visible_same_response
        claim_type: immediate
        grounds:
          - endpoints
          - entities.Replacement.fields.replacement_license_id
        distinguishing_aspect: "POST /replacements returns the Replacement with replacement_license_id populated and the original already VOIDED in the same request (immediate consistency)."
        test_recipe:
          setup: ["Resident A_res holds ISSUED STAMP license L_orig."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /license-products"
              payload: { sku: "STAMP-DUCK", product_kind: "STAMP", base_fee_cents: 4500, residency_restriction: "ANY" }
              as: DrawOfficer
              captures: { p_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A Res", birth_date: "1980-01-01", declared_state_code: "MT" }
              as: DrawOfficer
              captures: { a_id: $.data.id }
            - call: "POST /licenses"
              payload: { applicant_id: "${a_id}", license_product_id: "${p_id}" }
              as: LicenseAgent
              captures: { l_orig_id: $.data.id }
          trigger:
            - call: "POST /replacements"
              payload: { original_license_id: "${l_orig_id}", reason: "DAMAGED" }
              as: LicenseAgent
              captures: { repl_id: $.data.id, repl_lic_id: $.data.replacement_license_id }
          assert:
            - "Replacement.${repl_id}.replacement_license_id != null"
            - "License.${l_orig_id}.status == VOIDED"
