  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: home_visit_overlaps_same_enrollment_half_open
        grounds:
          - validations[priority=13]
          - errors[ERR_HOME_VISIT_OVERLAP]
          - entities.HomeVisit.fields.window_start
        distinguishing_aspect: |
          On the Enrollment resource, two home visits on the same date with half-open windows
          [13:00,14:00) and [13:30,14:30) overlap (13:30 < 14:00) -> ERR_HOME_VISIT_OVERLAP; a visit
          starting exactly at 14:00 (touching boundary) would NOT overlap.
        test_recipe:
          setup:
            - "Enrollment ACTIVE for AB with a SCHEDULED home visit on 2026-04-01 13:00-14:00."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
              payload: { guardian_name: "B", household_size: 3, annual_income_cents: 800000, categorical_eligibility: "TANF" }
              as: EnrollmentSpecialist
              captures: { fam_id: "$.data.id" }
            - call: "POST /applications"
              payload: { program_id: "${prog_id}", cohort_id: "${coh_id}", family_id: "${fam_id}", child_first_name: "Bo", child_last_name: "B", child_dob: "2022-01-10" }
              as: EnrollmentSpecialist
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/verify-eligibility"
              payload: { verified_income_cents: 800000 }
              as: EnrollmentSpecialist
            - call: "POST /applications/${app_id}/waitlist"
              payload: {}
              as: EnrollmentSpecialist
            - call: "POST /cohorts/${coh_id}/run-selection"
              payload: {}
              as: ProgramAdmin
            - call: "GET /offers?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { offer_id: "$.data[0].id" }
            - call: "GET /cohorts/${coh_id}"
              payload: {}
              as: ProgramAdmin
              captures: { coh_v: "$.data.version" }
            - call: "POST /offers/${offer_id}/accept"
              payload: { expected_cohort_version: "${coh_v}" }
              as: Family
              as_user_id: "${fam_id}"
            - call: "GET /enrollments?application_id=${app_id}"
              payload: {}
              as: EnrollmentSpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /home-visits"
              payload: { enrollment_id: "${enr_id}", scheduled_date: "2026-04-01", window_start: "13:00", window_end: "14:00" }
              as: FamilyServicesWorker
          trigger:
            - call: "POST /home-visits"
              payload: { enrollment_id: "${enr_id}", scheduled_date: "2026-04-01", window_start: "13:30", window_end: "14:30" }
              as: FamilyServicesWorker
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == \"ERR_HOME_VISIT_OVERLAP\""

      - name: home_visit_intersects_cohort_session_window
        grounds:
          - validations[priority=14]
          - errors[ERR_VISIT_DURING_SESSION]
          - entities.AgeCohort.fields.session_start
        distinguishing_aspect: |
          On the AgeCohort resource, a home-visit window is rejected when its time-of-day intersects the
          cohort daily session [09:00,12:00) REGARDLESS of date: a visit on 2026-04-02 10:00-11:00 collides
          with the recurring session -> ERR_VISIT_DURING_SESSION. Different interval semantics (time-of-day,
          date-agnostic) and different resource entity than the same-enrollment overlap rule.
        test_recipe:
          setup:
            - "Enrollment ACTIVE for AB in a cohort with daily session 09:00-12:00."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HS", program_type: "HEAD_START", funded_enrollment: 4, age_cutoff_date: "2026-09-01", total_instructional_days: 160 }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", age_band: "PRESCHOOL_4", funded_slots: 2, min_age_months: 48, max_age_months: 60, session_start: "09:00", session_end: "12:00" }
              as: ProgramAdmin
              captures: { coh_id: "$.data.id" }
            - call: "POST /families"
