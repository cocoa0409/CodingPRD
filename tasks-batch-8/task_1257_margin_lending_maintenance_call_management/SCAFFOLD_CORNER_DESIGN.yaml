  # ==========================================================================
  # Section: rbac
  # ==========================================================================
  - section: rbac
    instances:
      - name: segregation_reviewer_cannot_approve_own_review
        claim_type: segregation_of_duties
        grounds:
          - "roles"
          - 'state_machines.AccountApplication.COMPLIANCE_REVIEW_to_APPROVED'
          - 'errors[ERR_SEGREGATION_OF_DUTIES"]'
        distinguishing_aspect: "Same X-User-ID reviewing then approving -> ERR_SEGREGATION_OF_DUTIES 403 even when the role is elevated; a different supervisor succeeds."
        test_recipe:
          setup: ["application reviewed by user 'sup-1' acting as MarginAnalyst is impossible (role-checked); instead reviewer is analyst-1 and approval attempted by analyst-1 with MarginSupervisor role is role-legal only if sup; SoD pins on X-User-ID: review by analyst-1, approve attempt with same id rejected"]
          setup_api_calls:
            - { call: "POST /margin/customers", payload: { legal_name: "So D", email: "sod@example.com" }, as: MarginAnalyst, captures: { c_id: $.data.id } }
            - { call: "POST /margin/account-applications", payload: { customer_id: "${c_id}", annual_income_cents: 15000000, liquid_net_worth_cents: 50000000, investment_experience_years: 5 }, as: Customer, as_user_id: "${c_id}", captures: { app_id: $.data.id } }
            - { call: "POST /margin/account-applications/${app_id}/review", payload: {}, as: MarginAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
            - { call: "POST /margin/account-applications/${app_id}/approve", payload: {}, as: MarginSupervisor, as_user_id: "sup-2", captures: { acct_id: $.data.account_id } }
          assert:
            - "same X-User-ID approve: error_id == ERR_SEGREGATION_OF_DUTIES and http == 403"
            - "different supervisor approve: succeeds, account created"

