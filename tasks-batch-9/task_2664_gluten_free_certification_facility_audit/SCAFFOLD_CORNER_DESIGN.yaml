            - "GET /gfco/products with applicant_id=${app_n} returns total_count == 0"
            - "GET /gfco/products with facility_id=${fac_s} returns total_count == 0"

      - name: lot_test_recorded_before_the_testing_plan_exists_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_27
          - errors.ERR_TESTING_PLAN_NOT_ACTIVE
          - endpoints."POST /gfco/lot-tests"
        distinguishing_aspect: |
          A lot result cannot be judged without a threshold, so recording against a product
          whose testing_plan_status is still NONE is refused before any verdict arithmetic -
          the ppm supplied here (3.0) would have PASSED under every possible threshold, which
          proves the gate is on the plan and not on the number.
        test_recipe:
          setup:
            - "One applicant, one facility and one product with no formula review and therefore testing_plan_status NONE and threshold_ppm null."
          setup_api_calls:
            - call: "POST /gfco/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
