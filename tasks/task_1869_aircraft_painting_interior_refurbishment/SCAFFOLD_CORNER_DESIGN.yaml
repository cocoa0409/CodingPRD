  # ------------------------------------------------------------ Cross-cutting complexity layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_scheme_approve_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[scheme-approve-stale-program]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "Sequential staleness, no parallelism: scheme A approved at program version 1 (bumps to 2); scheme B approval still carrying expected_program_version 1 is rejected 412 ERR_STALE_PROGRAM_VERSION."
        test_recipe:
          setup: ["program QUOTED v1; schemes A and B both SUBMITTED"]
          setup_api_calls:
            - { call: "POST /completion/customers", payload: { name: "Apex Aviation LLC", contact_email: "ops@apex.example" }, as: CenterAdmin, captures: { cust_id: $.data.id } }
