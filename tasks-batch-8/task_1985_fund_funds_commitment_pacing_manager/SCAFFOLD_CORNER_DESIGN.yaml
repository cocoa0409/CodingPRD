              as_user_id: "${ana}"
              captures: { rev: "$.data[0].id" }
            - call: "PUT /fof/vehicles/${veh}/dd-reviews/${rev}"
              payload: { score_strategy_fit: 80, score_track_record: 80, score_operations: 80, score_compliance: 80 }
              as: Analyst
              as_user_id: "${ana}"
            - call: "POST /fof/vehicles/${veh}/dd-reviews/${rev}/submit"
              payload: {}
              as: CIO
              captures: { err_submit: $.data.error_id }
            - call: "POST /fof/vehicles/${veh}/dd-reviews/${rev}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
            - call: "POST /fof/vehicles/${veh}/dd-reviews/${rev}/complete"
              payload: {}
              as: InvestmentCommittee
              as_user_id: "${ic}"
            - call: "POST /fof/managers/${mgr}/vehicles/${veh}/approve-vehicle"
              payload: {}
              as: InvestmentCommittee
              as_user_id: "${ic}"
            - call: "POST /fof/vehicles/${veh}/proposals"
              payload: { program_id: "${prog}", pacing_plan_id: "${plan}", proposed_amount: 5000000 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { prop: $.data.id }
            - call: "POST /fof/proposals/${prop}/recommend"
              payload: {}
              as: Analyst
              as_user_id: "${ana}"
          trigger:
            - call: "POST /fof/proposals/${prop}/ic-approve"
              payload: {}
              as: OperationsAnalyst
              as_user_id: "${ops}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED (OperationsAnalyst cannot ic-approve)"
            - "err_submit == ERR_UNAUTHORIZED (CIO cannot submit a DD review)"
            - "InvestmentProposal.${prop}.status == RECOMMENDED"

      - name: compliance_officer_cannot_suspend_program
        claim_type: rbac_denial
        grounds: [roles.ComplianceOfficer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "ComplianceOfficer (manager suspend only) calling program suspend (CIO-exclusive) -> ERR_UNAUTHORIZED; its own manager suspend succeeds."
        test_recipe:
          setup: ["Program open; manager PROSPECT with no vehicles"]
          setup_api_calls:
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ops R3", staff_role: "OPS_ANALYST", email: "opsr3@x.com" }
              as: CIO
              captures: { ops: $.data.id }
            - call: "POST /fof/staff-users"
              payload: { display_name: "Ana R3", staff_role: "ANALYST", email: "anar3@x.com" }
              as: CIO
              captures: { ana: $.data.id }
            - call: "POST /fof/programs"
              payload: { program_name: "PR3", base_currency: "USD", total_nav_budget: 50000000, strategy_cap_pct: 0.30, manager_cap_pct: 0.25, max_vintage_band_years: 4, liquidity_buffer_min: 1000000, overdue_grace_days: 10, secondary_premium_cap_pct: 0.05, secondary_discount_cap_pct: 0.10 }
              as: CIO
              captures: { prog: $.data.id }
            - call: "POST /fof/programs/${prog}/ledger-entries"
              payload: { entry_kind: "CONTRIBUTION", amount: 5000000 }
              as: OperationsAnalyst
              as_user_id: "${ops}"
            - call: "POST /fof/programs/${prog}/open"
              payload: {}
              as: CIO
            - call: "POST /fof/managers"
              payload: { legal_name: "CompCap", domicile_country: "US", relationship_since_year: 2019 }
              as: Analyst
              as_user_id: "${ana}"
              captures: { mgr: $.data.id }
          trigger:
            - call: "POST /fof/programs/${prog}/suspend"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"
            - "FoFProgram.${prog}.status == OPEN"

