scenario: "Fee-Free Overdraft Eligibility Ladder & Early Payroll Posting (Chime): eligibility scoring for a no-fee overdraft cushion based on direct deposit history, account tenure and repayment behavior, limit ladder increases and decreases with member notification and no-fee guarantee, automatic repayment from the next qualifying deposit with partial-repayment handling, early posting of payroll credits when the originator's file arrives ahead of settlement date and the reversal risk that creates, deposit-return and reclaim handling after funds were made available early, member abuse patterns such as deposit rerouting after a cushion is used, sponsor-bank ledger reconciliation between the program and the chartered institution, dispute handling on provisional credit timelines"
domain_name: "fee-free-overdraft-early-payroll"
api_prefix: "/banking"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: external_ref
        type: string
        source: input
        description: "Client-supplied unique member reference; unique across all members."
        constraints: "required; unique; 1..128 chars"
      - name: full_name
        type: string
        source: input
        description: "Member legal name."
        constraints: "required; 1..200 chars"
      - name: enrolled_at
        type: datetime
        source: input
        description: "Enrollment timestamp used as the tenure anchor."
        constraints: "required; must be <= current logical clock"
      - name: status
        type: enum
        source: system
        description: "Posture state machine: ENROLLED | ELIGIBLE | RESTRICTED | SUSPENDED | CLOSED. Gates all cushion operations."
        default: ENROLLED
        constraints: "enum {ENROLLED, ELIGIBLE, RESTRICTED, SUSPENDED, CLOSED}"
      - name: tenure_days
        type: integer
        source: computed
        description: "Whole days between enrolled_at and the current logical clock (floor)."
      - name: current_limit_cents
        type: integer
        source: computed
        description: "Effective cushion limit after the latest EFFECTIVE CushionLimitAdjustment; 0 when never evaluated."
        default: 0
      - name: consecutive_on_time_repayments
        type: integer
        source: computed
        description: "Count of consecutive OverdraftAdvance REPAID transitions with repaid_at - created_at <= 35 days; reset to 0 on any late repayment or write-off."
        default: 0
      - name: restricted_consecutive_repayments
        type: integer
        source: computed
        description: "On-time repayments since the member entered RESTRICTED; reset to 0 on entering RESTRICTED; reaching 3 while RESTRICTED triggers rehabilitation to ELIGIBLE."
        default: 0
      - name: abuse_event_count
        type: integer
        source: computed
        description: "Count of AbuseEvent rows for this member (all time)."
        default: 0
      - name: abuse_events_90d
        type: integer
        source: computed
        description: "Count of AbuseEvent rows with created_at within (now-90d, now]."
        default: 0
      - name: deposit_reroute_flag
        type: boolean
        source: system
        description: "Set true by a DEPOSIT_REROUTE AbuseEvent; cleared only by ProgramOps rehabilitation transition. Blocks advances and early posting while true."
        default: false

  - name: DepositAccount
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; owning member."
        constraints: "required; immutable"
      - name: account_type
        type: enum
        source: input
        description: "Account product type."
        constraints: "enum {SPENDING, SAVINGS}; only SPENDING accounts participate in the cushion program"
      - name: currency
        type: enum
        source: input
        description: "ISO currency."
        default: USD
        constraints: "enum {USD}"
      - name: sponsor_bank_code
        type: string
        source: input
        description: "Chartered institution code holding this account; links the account to ReconciliationRun windows for the post-early gate."
        default: SB-1
        constraints: "1..32 chars"
      - name: posted_balance_cents
        type: integer
        source: computed
        description: "Settled ledger balance at the sponsor bank. May be negative after reclaim."
        default: 0
      - name: provisional_early_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over EarlyPosting rows in status PROVISIONAL for deposits of this account."
        default: 0
      - name: holds_cents
        type: integer
        source: computed
        description: "Sum of dispute provisional credits and administrative holds not yet final."
        default: 0
      - name: outstanding_cushion_cents
        type: integer
        source: computed
        description: "Sum of outstanding_cents over OverdraftAdvance rows in status IN {OPEN, PARTIALLY_REPAID} for this account."
        default: 0
      - name: usable_cushion_cents
        type: integer
        source: computed
        description: "max(0, min(member.current_limit_cents, member.current_limit_cents - outstanding_cushion_cents)); 0 when member status != ELIGIBLE or deposit_reroute_flag is true."
        default: 0
      - name: available_optimistic_cents
        type: integer
        source: computed
        description: "calc_available_balance variant OPTIMISTIC: posted + provisional_early - holds + usable_cushion."
        default: 0
      - name: available_conservative_cents
        type: integer
        source: computed
        description: "calc_available_balance variant CONSERVATIVE: posted - holds. Excludes provisional and cushion."
        default: 0

  - name: DirectDeposit
    parent: DepositAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; destination account."
        constraints: "required; immutable"
      - name: originator_id
        type: string
        source: input
        description: "ACH originator identifier (employer payroll id)."
        constraints: "required; 1..64 chars"
      - name: originator_type
        type: enum
        source: input
        description: "PAYROLL deposits qualify for scoring, waterfall repayment, and early posting; OTHER deposits use pro-rata repayment."
        constraints: "enum {PAYROLL, OTHER}"
      - name: amount_cents
        type: integer
        source: input
        description: "Gross deposit amount."
        constraints: "required; > 0"
      - name: settlement_date
        type: datetime
        source: input
        description: "ACH settlement date on the file."
        constraints: "required"
      - name: trace_id
        type: string
        source: input
        description: "ACH trace number; unique across all deposits."
        constraints: "required; unique"
      - name: status
        type: enum
        source: system
        description: "RECEIVED_FILE | POSTED_EARLY | SETTLED | RETURNED. Overlap-conflicting registrations are refused at creation (no REJECTED state is persisted)."
        default: RECEIVED_FILE
      - name: qualifying
        type: boolean
        source: computed
        description: "true iff originator_type == PAYROLL and amount_cents >= 10000 (>= $100 boundary is inclusive)."
      - name: repaid_cents
        type: integer
        source: computed
        description: "Sum of RepaymentAllocation.amount_cents with deposit_id == this deposit."
        default: 0
      - name: settled_at
        type: datetime
        source: system
        description: "Set on the SETTLED transition; null otherwise. Drives the BATCH scoring window."

  - name: EarlyPosting
    parent: DirectDeposit
    common_fields: true
    fields:
      - name: deposit_id
        type: string
        source: input
        description: "FK -> DirectDeposit.id; the deposit posted ahead of settlement."
        constraints: "required; immutable; at most one EarlyPosting per deposit"
      - name: posted_amount_cents
        type: integer
        source: system
        description: "Amount made available early (== deposit amount_cents)."
      - name: reversal_window_end
        type: datetime
        source: computed
        description: "settlement_date + 2 calendar days; returns arriving before this instant are reversal-risk returns."
      - name: status
        type: enum
        source: system
        description: "PROVISIONAL | CONFIRMED | REVERSED."
        default: PROVISIONAL

  - name: DepositReturn
    parent: DirectDeposit
    common_fields: false
    fields:
      - name: deposit_id
        type: string
        source: input
        description: "FK -> DirectDeposit.id; the returned deposit."
        constraints: "required; immutable"
      - name: return_code
        type: enum
        source: input
        description: "ACH return reason code."
        constraints: "enum {R01_INSUFFICIENT, R02_CLOSED, R03_NO_ACCOUNT, R07_REVOKED, R08_STOPPED}"
      - name: amount_cents
        type: integer
        source: system
        description: "Returned amount (== deposit amount_cents; full returns only)."
      - name: shortfall_cents
        type: integer
        source: computed
        description: "max(0, amount_cents - max(0, posted_balance_cents + provisional_early_cents at return time)) — the unrecoverable portion converted into a reclaim advance."

  - name: OverdraftAdvance
    parent: DepositAccount
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> DepositAccount.id; account drawing the cushion."
        constraints: "required; immutable"
      - name: origin
        type: enum
        source: system
        description: "MEMBER_INITIATED (borrow) or RECLAIM_SHORTFALL (system-created from a DepositReturn shortfall)."
      - name: principal_cents
        type: integer
        source: system
        description: "Original advance amount; > 0. Never a fee is charged — the no-fee guarantee forbids any fee field."
      - name: outstanding_cents
        type: integer
        source: computed
        description: "principal_cents minus sum of RepaymentAllocation.amount_cents for this advance."
      - name: status
        type: enum
        source: system
        description: "OPEN | PARTIALLY_REPAID | REPAID | WRITTEN_OFF."
        default: OPEN
      - name: repaid_at
        type: datetime
        source: system
        description: "Set on the REPAID transition; null otherwise."
      - name: on_time
        type: boolean
        source: computed
        description: "On REPAID: repaid_at - created_at <= 35 days. Drives consecutive_on_time_repayments."

  - name: RepaymentAllocation
    parent: OverdraftAdvance
    common_fields: false
    fields:
      - name: advance_id
        type: string
        source: system
        description: "FK -> OverdraftAdvance.id; advance receiving the allocation."
      - name: deposit_id
        type: string
        source: system
        description: "FK -> DirectDeposit.id; deposit funding the allocation."
      - name: amount_cents
        type: integer
        source: system
        description: "Allocated amount in cents; > 0."
      - name: allocation_mode
        type: enum
        source: system
        description: "WATERFALL (qualifying deposit, oldest-first) or PRO_RATA (non-qualifying deposit, proportional with per-line rounding)."

  - name: EligibilityProfile
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; evaluated member."
      - name: evaluation_mode
        type: enum
        source: input
        description: "BATCH (settled-only inputs; authoritative) or REALTIME (includes in-flight deposits; preview)."
        constraints: "enum {BATCH, REALTIME}"
      - name: score
        type: integer
        source: computed
        description: "calc_eligibility_score result, 0..1000."
      - name: regularity_points
        type: integer
        source: computed
        description: "Bucket points from qualifying-deposit count: >=6 -> 400; >=4 -> 300; >=2 -> 150; else 0; demoted one step if any such deposit later RETURNED in-window."
      - name: tenure_points
        type: integer
        source: computed
        description: "round_half_up(min(tenure_days, 365) / 365 * 250)."
      - name: repayment_points
        type: integer
        source: computed
        description: "min(consecutive_on_time_repayments, 10) * 25."
      - name: abuse_penalty
        type: integer
        source: computed
        description: "150 * min(abuse_events_90d, 3)."
      - name: computed_limit_cents
        type: integer
        source: computed
        description: "calc_ladder_limit result."
      - name: delta_vs_current_cents
        type: integer
        source: computed
        description: "computed_limit_cents - member.current_limit_cents at evaluation time."
      - name: status
        type: enum
        source: system
        description: "CURRENT | SUPERSEDED. At most one CURRENT profile per evaluation_mode per member; creating a BATCH profile supersedes the prior CURRENT BATCH profile; REALTIME profiles never supersede BATCH profiles and never create CushionLimitAdjustment rows."
        default: CURRENT

  - name: CushionLimitAdjustment
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; affected member."
      - name: old_limit_cents
        type: integer
        source: system
        description: "Limit before this adjustment."
      - name: new_limit_cents
        type: integer
        source: system
        description: "Limit after this adjustment."
      - name: direction
        type: enum
        source: computed
        description: "INCREASE when new > old, DECREASE when new < old, FLAT when equal (no row is created when FLAT)."
      - name: status
        type: enum
        source: system
        description: "INCREASE rows are created EFFECTIVE; DECREASE rows are created PENDING_NOTICE -> NOTIFIED -> EFFECTIVE; PENDING_NOTICE/NOTIFIED rows may be SUPERSEDED by a newer evaluation."
      - name: effective_at
        type: datetime
        source: computed
        description: "INCREASE: creation time. DECREASE: created_at + 7 days (member notice period)."
      - name: notified_at
        type: datetime
        source: system
        description: "Set on the notify action; null while PENDING_NOTICE."

  - name: AbuseEvent
    parent: Member
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; flagged member."
      - name: event_type
        type: enum
        source: input
        description: "DEPOSIT_REROUTE (payroll rerouted away after cushion use) | CUSHION_CYCLING | FIRST_PARTY_FRAUD."
        constraints: "enum {DEPOSIT_REROUTE, CUSHION_CYCLING, FIRST_PARTY_FRAUD}"
      - name: evidence_note
        type: string
        source: input
        description: "Analyst note."
        constraints: "optional; <= 500 chars"

  - name: LedgerEntry
    parent: DepositAccount
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> DepositAccount.id; account the entry posts against."
      - name: reconciliation_run_id
        type: string
        source: system
        description: "FK -> ReconciliationRun.id; set when the entry is an adjustment created by run resolution; null otherwise."
        constraints: "nullable"
      - name: entry_type
        type: enum
        source: system
        description: "ADVANCE_CREDIT | ADVANCE_REPAYMENT_DEBIT | EARLY_POSTING_CREDIT | EARLY_POSTING_REVERSAL | DEPOSIT_SETTLEMENT | DEPOSIT_RETURN_DEBIT | PROVISIONAL_CREDIT | PROVISIONAL_REVERSAL | ADJUSTMENT."
      - name: program_leg_cents
        type: integer
        source: system
        description: "Signed program-side leg; credit positive."
      - name: bank_leg_cents
        type: integer
        source: system
        description: "Signed bank-side leg; invariant: program_leg_cents + bank_leg_cents == 0 for every entry."
      - name: status
        type: enum
        source: system
        description: "PENDING | SETTLED | VOIDED."
        default: PENDING
      - name: posted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the entry posts; drives reconciliation window selection."

  - name: ReconciliationRun
    parent: null
    common_fields: true
    fields:
      - name: sponsor_bank_code
        type: string
        source: input
        description: "Chartered institution identifier the run reconciles against."
        constraints: "required; 1..32 chars"
      - name: period_start
        type: datetime
        source: input
        description: "Half-open window start (inclusive)."
        constraints: "required; < period_end"
      - name: period_end
        type: datetime
        source: input
        description: "Half-open window end (exclusive)."
        constraints: "required; > period_start"
      - name: bank_reported_net_cents
        type: integer
        source: input
        description: "Net position reported by the sponsor bank for the window (bank-signed: credits positive from the bank's perspective)."
        constraints: "required; may be negative"
      - name: program_net_cents
        type: integer
        source: computed
        description: "Sum of program_leg_cents over LedgerEntry rows with posted_at in [period_start, period_end) and status SETTLED."
      - name: bank_net_cents
        type: integer
        source: computed
        description: "Sum of bank_leg_cents over the same rows, negated (bank perspective)."
      - name: discrepancy_cents
        type: integer
        source: computed
        description: "program_net_cents + bank_reported_net_cents."
      - name: status
        type: enum
        source: system
        description: "OPEN -> BALANCED (|discrepancy| == 0, automatic) | DISCREPANCY (|discrepancy| > 0, automatic) -> RESOLVED (ProgramOps resolve with adjusting entries)."

  - name: Dispute
    parent: Member
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: system
        description: "FK -> Member.id; filing member."
      - name: deposit_id
        type: string
        source: input
        description: "FK -> DirectDeposit.id; disputed deposit (early-posted or returned)."
        constraints: "required; immutable"
      - name: dispute_type
        type: enum
        source: input
        description: "EARLY_POSTING_REVERSAL (cushion reclaimed after return) | DEPOSIT_RETURN_CLAIM."
        constraints: "enum {EARLY_POSTING_REVERSAL, DEPOSIT_RETURN_CLAIM}"
      - name: amount_cents
        type: integer
        source: input
        description: "Disputed amount."
        constraints: "required; > 0; <= disputed deposit amount_cents"
      - name: statement
        type: string
        source: input
        description: "Member statement."
        constraints: "required; 1..1000 chars"
      - name: case_status
        type: enum
        source: system
        description: "Parallel dimension 1: FILED -> UNDER_REVIEW -> RESOLVED_MEMBER | RESOLVED_BANK."
        default: FILED
      - name: provisional_status
        type: enum
        source: system
        description: "Parallel dimension 2: NONE -> PROVISIONAL_ISSUED -> PROVISIONAL_MADE_FINAL | PROVISIONAL_RECLAIMED."
        default: NONE
      - name: provisional_due_at
        type: datetime
        source: computed
        description: "filed_at + 10 business days (Mon-Fri, no holiday calendar); provisional credit must be issued by then."
      - name: resolution_due_at
        type: datetime
        source: computed
        description: "filed_at + 45 calendar days."
      - name: provisional_overdue
        type: boolean
        source: computed
        description: "true when current clock > provisional_due_at and provisional_status == NONE."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: ENROLLED
    terminal_states: [CLOSED]
    transitions:
      - from: ENROLLED
        to: ELIGIBLE
        trigger: "POST /banking/members/{id}/eligibility-evaluations with evaluation_mode BATCH and profile.score >= 200"
        actor: ProgramOps
        preconditions:
          - "member.status == ENROLLED"
          - "computed profile.score >= 200"
        side_effects:
          - "member.current_limit_cents := profile.computed_limit_cents"
          - "create CushionLimitAdjustment (direction from delta; INCREASE created EFFECTIVE)"
      - from: ENROLLED
        to: ENROLLED
        trigger: "POST /banking/members/{id}/eligibility-evaluations with evaluation_mode BATCH and profile.score < 200"
        actor: ProgramOps
        preconditions: ["member.status == ENROLLED"]
        side_effects:
          - "no CushionLimitAdjustment created when computed limit delta is FLAT (0)"
      - from: ELIGIBLE
        to: ELIGIBLE
        trigger: "POST /banking/members/{id}/eligibility-evaluations (re-evaluation while eligible)"
        actor: ProgramOps
        preconditions: ["member.status == ELIGIBLE"]
        side_effects:
          - "create CushionLimitAdjustment when delta != 0; INCREASE effective immediately, DECREASE enters PENDING_NOTICE with effective_at = now + 7d"
          - "supersede any PENDING_NOTICE or NOTIFIED decrease for this member (status SUPERSEDED)"
      - from: RESTRICTED
        to: RESTRICTED
        trigger: "POST /banking/members/{id}/eligibility-evaluations (BATCH re-evaluation while restricted; limit may move, posture does not)"
        actor: ProgramOps
        preconditions: ["member.status == RESTRICTED"]
        side_effects:
          - "create CushionLimitAdjustment when delta != 0 (same increase/decrease rules as ELIGIBLE)"
      - from: SUSPENDED
        to: SUSPENDED
        trigger: "POST /banking/members/{id}/eligibility-evaluations (BATCH re-evaluation while suspended)"
        actor: ProgramOps
        preconditions: ["member.status == SUSPENDED"]
        side_effects:
          - "computed_limit forced to 0 effective immediately: create CushionLimitAdjustment DECREASE created directly EFFECTIVE (no notice period applies to suspension)"
      - from: ELIGIBLE
        to: RESTRICTED
        trigger: "POST /banking/members/{id}/abuse-events (first abuse event while ELIGIBLE)"
        actor: ProgramOps
        preconditions:
          - "member.status == ELIGIBLE"
          - "member.abuse_events_90d after this event == 1"
        side_effects:
          - "member.abuse_event_count += 1; member.abuse_events_90d recomputed"
          - "member.restricted_consecutive_repayments := 0"
          - "if event_type == DEPOSIT_REROUTE: member.deposit_reroute_flag := true"
      - from: RESTRICTED
        to: ELIGIBLE
        trigger: "system: OverdraftAdvance REPAID on-time while member RESTRICTED and restricted_consecutive_repayments reaches 3"
        actor: system
        preconditions:
          - "member.status == RESTRICTED"
          - "advance.on_time == true"
          - "member.restricted_consecutive_repayments + 1 == 3"
        side_effects:
          - "member.restricted_consecutive_repayments := 3"
          - "member.deposit_reroute_flag := false"
      - from: RESTRICTED
        to: RESTRICTED
        trigger: "system: OverdraftAdvance REPAID on-time while member RESTRICTED and count < 3"
        actor: system
        preconditions: ["member.status == RESTRICTED", "advance.on_time == true"]
        side_effects: ["member.restricted_consecutive_repayments += 1"]
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "POST /banking/members/{id}/abuse-events (abuse event while RESTRICTED)"
        actor: ProgramOps
        preconditions: ["member.status == RESTRICTED"]
        side_effects: ["member.deposit_reroute_flag := true"]
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /banking/members/{id}/close"
        actor: ProgramOps
        preconditions: ["member.status == SUSPENDED"]
        side_effects: ["all OPEN/PARTIALLY_REPAID advances transition to WRITTEN_OFF", "member.consecutive_on_time_repayments := 0"]

  - entity: DirectDeposit
    initial_state: RECEIVED_FILE
    terminal_states: [RETURNED]
    transitions:
      - from: RECEIVED_FILE
        to: POSTED_EARLY
        trigger: "POST /banking/deposits/{id}/post-early"
        actor: ProgramOps
        preconditions:
          - "deposit.status == RECEIVED_FILE"
          - "deposit.qualifying == true"
          - "current clock < deposit.settlement_date"
          - "account.member.status IN {ELIGIBLE, RESTRICTED} and member.deposit_reroute_flag == false"
          - "no ReconciliationRun with status == DISCREPANCY whose [period_start, period_end) contains the current clock for the account's sponsor bank"
        side_effects:
          - "create EarlyPosting (PROVISIONAL) with posted_amount_cents == amount_cents"
          - "account.provisional_early_cents += amount_cents"
          - "run calc_repayment_waterfall (funds made available early still repay outstanding advances); the unallocated remainder is spendable immediately: account.posted_balance_cents += (amount_cents - total_allocated_cents)"
          - "create LedgerEntry EARLY_POSTING_CREDIT (program +amount, bank -amount, status PENDING)"
      - from: RECEIVED_FILE
        to: SETTLED
        trigger: "POST /banking/deposits/{id}/settle on or after settlement_date"
        actor: SponsorBankOps
        preconditions:
          - "deposit.status == RECEIVED_FILE"
          - "current clock >= deposit.settlement_date"
        side_effects:
          - "account.posted_balance_cents += amount_cents"
          - "settled_at := now"
          - "run calc_repayment_waterfall; repayment clawback reduces the balance just credited: account.posted_balance_cents -= total_allocated_cents"
          - "create LedgerEntry DEPOSIT_SETTLEMENT (status SETTLED)"
      - from: POSTED_EARLY
        to: SETTLED
        trigger: "POST /banking/deposits/{id}/settle on or after settlement_date"
        actor: SponsorBankOps
        preconditions:
          - "deposit.status == POSTED_EARLY"
          - "current clock >= deposit.settlement_date"
        side_effects:
          - "EarlyPosting.status := CONFIRMED"
          - "account.provisional_early_cents -= amount_cents"
          - "account.posted_balance_cents += total_allocated_cents recorded at post-early time (the clawed-back portion of funds arrives at settlement; the remainder was already credited at post-early)"
          - "settled_at := now"
          - "EARLY_POSTING_CREDIT LedgerEntry status := SETTLED"
          - "note: waterfall already ran at post-early; settle does NOT repay twice"
      - from: POSTED_EARLY
        to: RETURNED
        trigger: "POST /banking/deposits/{id}/return"
        actor: SponsorBankOps
        preconditions: ["deposit.status == POSTED_EARLY"]
        side_effects:
          - "EarlyPosting.status := REVERSED (reversal-risk path: funds already spent)"
          - "account.provisional_early_cents -= amount_cents"
          - "create DepositReturn; shortfall_cents = max(0, amount - max(0, posted_balance))"
          - "account.posted_balance_cents -= min(amount_cents, max(0, posted_balance_cents))"
          - "if shortfall_cents > 0: create OverdraftAdvance(origin=RECLAIM_SHORTFALL, principal=shortfall) — which increments account.outstanding_cushion_cents — which reduces usable_cushion_cents on next read"
          - "create LedgerEntry EARLY_POSTING_REVERSAL + DEPOSIT_RETURN_DEBIT"
          - "EARLY_POSTING_CREDIT LedgerEntry status := VOIDED"
      - from: SETTLED
        to: RETURNED
        trigger: "POST /banking/deposits/{id}/return (late return after settlement)"
        actor: SponsorBankOps
        preconditions: ["deposit.status == SETTLED"]
        side_effects:
          - "create DepositReturn; account.posted_balance_cents -= amount_cents (may go negative)"
          - "shortfall_cents = max(0, amount_cents - max(0, posted_balance before debit)); if > 0 create RECLAIM_SHORTFALL advance"
          - "create LedgerEntry DEPOSIT_RETURN_DEBIT"
          - "this deposit no longer counts as qualifying-settled in future calc_eligibility_score runs (regularity demotion input)"

  - entity: EarlyPosting
    initial_state: PROVISIONAL
    terminal_states: [CONFIRMED, REVERSED]
    transitions:
      - from: PROVISIONAL
        to: CONFIRMED
        trigger: "cascade from DirectDeposit POSTED_EARLY -> SETTLED"
        actor: system
        preconditions: ["deposit settles"]
        side_effects: ["account.provisional_early_cents decremented (see DirectDeposit settle)"]
      - from: PROVISIONAL
        to: REVERSED
        trigger: "cascade from DirectDeposit POSTED_EARLY -> RETURNED"
        actor: system
        preconditions: ["deposit returned before settlement"]
        side_effects: ["reclaim shortfall cascade (see DirectDeposit return)"]

  - entity: OverdraftAdvance
    initial_state: OPEN
    terminal_states: [REPAID, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PARTIALLY_REPAID
        trigger: "system: calc_repayment_waterfall allocates 0 < amount < outstanding_cents"
        actor: system
        preconditions: ["allocation amount > 0", "allocation amount < outstanding_cents"]
        side_effects:
          - "outstanding_cents -= allocation"
          - "account.outstanding_cushion_cents -= allocation"
      - from: PARTIALLY_REPAID
        to: PARTIALLY_REPAID
        trigger: "system: further waterfall allocation still below remaining outstanding"
        actor: system
        preconditions: ["allocation amount > 0", "outstanding remains > 0"]
        side_effects: ["outstanding_cents -= allocation", "account.outstanding_cushion_cents -= allocation"]
      - from: OPEN
        to: REPAID
        trigger: "system: waterfall allocation exactly covers outstanding"
        actor: system
        preconditions: ["allocation amount == outstanding_cents"]
        side_effects:
          - "outstanding_cents := 0; repaid_at := now"
          - "on_time := (repaid_at - created_at <= 35 days)"
          - "member.consecutive_on_time_repayments += 1 if on_time else := 0"
          - "if member RESTRICTED and on_time: restricted_consecutive_repayments += 1 (may trigger RESTRICTED->ELIGIBLE)"
      - from: PARTIALLY_REPAID
        to: REPAID
        trigger: "system: waterfall allocation covers remaining outstanding"
        actor: system
        preconditions: ["allocation amount == outstanding_cents"]
        side_effects: ["same as OPEN -> REPAID"]
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /banking/advances/{id}/write-off (aging >= 60 days)"
        actor: ProgramOps
        preconditions:
          - "advance.status IN {OPEN, PARTIALLY_REPAID}"
          - "current clock >= advance.created_at + 60 days"
        side_effects:
          - "member.consecutive_on_time_repayments := 0"
          - "account.outstanding_cushion_cents -= outstanding_cents; outstanding recognized as program loss"
      - from: PARTIALLY_REPAID
        to: WRITTEN_OFF
        trigger: "POST /banking/advances/{id}/write-off"
        actor: ProgramOps
        preconditions: ["same as OPEN -> WRITTEN_OFF"]
        side_effects: ["same as OPEN -> WRITTEN_OFF"]

  - entity: CushionLimitAdjustment
    initial_state: PENDING_NOTICE
    terminal_states: [EFFECTIVE, SUPERSEDED]
    transitions:
      - from: PENDING_NOTICE
        to: NOTIFIED
        trigger: "POST /banking/limit-adjustments/{id}/notify"
        actor: ProgramOps
        preconditions: ["adjustment.status == PENDING_NOTICE"]
        side_effects: ["notified_at := now"]
      - from: PENDING_NOTICE
        to: EFFECTIVE
        trigger: "creation-time shortcut for INCREASE rows (created directly EFFECTIVE)"
        actor: system
        preconditions: ["direction == INCREASE"]
        side_effects: ["member.current_limit_cents := new_limit_cents at creation"]
      - from: NOTIFIED
        to: EFFECTIVE
        trigger: "system: current clock >= effective_at (7-day notice elapsed)"
        actor: system
        preconditions: ["adjustment.status == NOTIFIED", "now >= effective_at"]
        side_effects: ["member.current_limit_cents := new_limit_cents"]
      - from: PENDING_NOTICE
        to: SUPERSEDED
        trigger: "system: a newer evaluation creates another adjustment for the same member"
        actor: system
        preconditions: ["newer CushionLimitAdjustment exists for member"]
        side_effects: ["member.current_limit_cents unchanged"]
      - from: NOTIFIED
        to: SUPERSEDED
        trigger: "system: a newer evaluation creates another adjustment for the same member before effective_at"
        actor: system
        preconditions: ["newer CushionLimitAdjustment exists for member", "now < effective_at"]
        side_effects: ["member.current_limit_cents unchanged"]

  - entity: ReconciliationRun
    initial_state: OPEN
    terminal_states: [BALANCED, RESOLVED]
    transitions:
      - from: OPEN
        to: BALANCED
        trigger: "automatic at creation when discrepancy_cents == 0"
        actor: system
        preconditions: ["discrepancy_cents == 0"]
        side_effects: []
      - from: OPEN
        to: DISCREPANCY
        trigger: "automatic at creation when discrepancy_cents != 0"
        actor: system
        preconditions: ["discrepancy_cents != 0"]
        side_effects:
          - "early posting (post-early) blocked for all accounts of this sponsor bank while any DISCREPANCY run's window contains the current clock"
      - from: DISCREPANCY
        to: RESOLVED
        trigger: "POST /banking/reconciliation-runs/{id}/resolve"
        actor: ProgramOps
        preconditions:
          - "run.status == DISCREPANCY"
          - "expected_run_version matches"
        side_effects:
          - "create LedgerEntry ADJUSTMENT rows (program_leg = -discrepancy_cents, bank_leg = +discrepancy_cents) against the oldest account (by created_at ASC) with entries in the window; post-resolution invariant: sum of all legs across run entries == 0"
          - "increments ReconciliationRun.version by 1"

  - entity: Dispute
    initial_state: FILED
    terminal_states: [RESOLVED_MEMBER, RESOLVED_BANK]
    transitions:
      - from: "case_status FILED"
        to: "case_status UNDER_REVIEW"
        trigger: "POST /banking/disputes/{id}/issue-provisional-credit OR POST /banking/disputes/{id}/resolve"
        actor: DisputesAgent
        preconditions: ["case_status == FILED"]
        side_effects: []
      - from: "provisional_status NONE"
        to: "provisional_status PROVISIONAL_ISSUED"
        trigger: "POST /banking/disputes/{id}/issue-provisional-credit"
        actor: DisputesAgent
        preconditions:
          - "provisional_status == NONE"
          - "case_status IN {FILED, UNDER_REVIEW}"
          - "linked deposit.status IN {POSTED_EARLY, RETURNED} (provisional credit only exists against early-posted or returned funds)"
          - "current clock <= dispute.provisional_due_at (credit after the 10-business-day deadline is rejected, not late-issued)"
        side_effects:
          - "account.holds_cents += dispute.amount_cents"
          - "create LedgerEntry PROVISIONAL_CREDIT"
          - "case_status := UNDER_REVIEW if it was FILED"
      - from: "case_status IN {FILED, UNDER_REVIEW}"
        to: "case_status RESOLVED_MEMBER"
        trigger: "POST /banking/disputes/{id}/resolve with outcome MEMBER"
        actor: DisputesAgent
        preconditions: ["case_status IN {FILED, UNDER_REVIEW}", "current clock <= resolution_due_at"]
        side_effects:
          - "if provisional_status == PROVISIONAL_ISSUED: provisional_status := PROVISIONAL_MADE_FINAL; account.holds_cents -= amount; account.posted_balance_cents += amount"
          - "if provisional_status == NONE: account.posted_balance_cents += amount; create LedgerEntry PROVISIONAL_CREDIT SETTLED"
      - from: "case_status IN {FILED, UNDER_REVIEW}"
        to: "case_status RESOLVED_BANK"
        trigger: "POST /banking/disputes/{id}/resolve with outcome BANK"
        actor: DisputesAgent
        preconditions: ["case_status IN {FILED, UNDER_REVIEW}", "current clock <= resolution_due_at"]
        side_effects:
          - "if provisional_status == PROVISIONAL_ISSUED: provisional_status := PROVISIONAL_RECLAIMED; account.holds_cents -= amount; create LedgerEntry PROVISIONAL_REVERSAL"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — true races resolved on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: advance-create-stale-account
    parent_entity: DepositAccount
    write_endpoint: "POST /banking/accounts/{id}/advances"
    occ_field: "expected_account_version"
    description: |
      Creating an OverdraftAdvance against a DepositAccount whose version has
      advanced since the client last observed it is rejected. A prior advance
      or repayment legitimately changed usable_cushion_cents, so the client's
      headroom view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: evaluation-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /banking/members/{id}/eligibility-evaluations"
    occ_field: "expected_member_version"
    description: |
      Creating a BATCH EligibilityProfile supersedes the prior CURRENT profile;
      a request carrying a Member version that no longer matches is rejected
      because its view of the current profile/limit is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: abuse-event-stale-member
    parent_entity: Member
    write_endpoint: "POST /banking/members/{id}/abuse-events"
    occ_field: "expected_member_version"
    description: |
      Recording an AbuseEvent recomputes posture from abuse_events_90d; a
      request whose Member version is stale may double-apply a posture step
      (ELIGIBLE->RESTRICTED vs ELIGIBLE->SUSPENDED) and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: run-resolve-stale-run
    parent_entity: ReconciliationRun
    write_endpoint: "POST /banking/reconciliation-runs/{id}/resolve"
    occ_field: "expected_run_version"
    description: |
      Resolving a ReconciliationRun posts adjusting LedgerEntries computed from
      discrepancy_cents; a request with a stale run version would post
      duplicate adjustments and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_eligibility_score
    description: "Member eligibility score driving ladder band and ENROLLED->ELIGIBLE."
    trigger: "POST /banking/members/{id}/eligibility-evaluations"
    inputs: ["qualifying settled deposits in window", "tenure_days", "consecutive_on_time_repayments", "abuse_events_90d", "returned-in-window flag"]
    algorithm: weighted_scoring
    formula: |
      window = (now - 90 days, now]
      dep_set = DirectDeposit where account.member == member
                AND qualifying == true
                AND (BATCH: status == SETTLED AND settled_at in window
                     | REALTIME: status IN {RECEIVED_FILE, POSTED_EARLY, SETTLED}
                               AND created_at in window)
      n = count(dep_set)
      bucket = 400 if n >= 6 else 300 if n >= 4 else 150 if n >= 2 else 0
      returned_in_window = any qualifying deposit with settled_at in window
                           whose current status == RETURNED (settled, then returned)
      if returned_in_window:
          demote bucket one step: 400->300, 300->150, 150->0
      regularity_points = bucket
      tenure_points     = round_half_up(min(tenure_days, 365) / 365 * 250)
      repayment_points  = min(consecutive_on_time_repayments, 10) * 25
      abuse_penalty     = 150 * min(abuse_events_90d, 3)
      score = clamp(0, 1000,
                    regularity_points + tenure_points + repayment_points - abuse_penalty)
    constants:
      WINDOW_DAYS: 90
      BUCKET_GE_6: 400
      BUCKET_GE_4: 300
      BUCKET_GE_2: 150
      TENURE_MAX_POINTS: 250
      REPAY_POINT_EACH: 25
      REPAY_CAP: 10
      ABUSE_PENALTY_EACH: 150
      ABUSE_CAP: 3
    precision: "integer points; round_half_up on tenure_points"
    variants:
      - name: BATCH
        when: "evaluation_mode == BATCH (authoritative; drives ladder + posture)"
        difference: "counts only status == SETTLED qualifying deposits with settled_at in window"
      - name: REALTIME
        when: "evaluation_mode == REALTIME (preview)"
        difference: "additionally counts in-flight RECEIVED_FILE and POSTED_EARLY qualifying deposits by created_at, so the same member scores higher while payroll is in flight; REALTIME profiles never supersede the CURRENT BATCH profile and never create CushionLimitAdjustment rows"

  - name: calc_ladder_limit
    description: "Cushion limit ladder: min of three independent caps (non-linear, asymmetric up/down application)."
    trigger: "POST /banking/members/{id}/eligibility-evaluations (BATCH only)"
    inputs: ["score", "consecutive_on_time_repayments", "tenure_days"]
    algorithm: threshold
    formula: |
      score_cap  = 20000 if score >= 750 else 10000 if score >= 500
                   else 5000 if score >= 300 else 2000 if score >= 200 else 0
      repay_cap  = 20000 if consecutive_on_time_repayments >= 5
                   else 10000 if >= 3 else 5000 if >= 1 else 2000
      tenure_cap = 20000 if tenure_days >= 180 else 10000 if >= 90
                   else 5000 if >= 30 else 2000
      computed_limit_cents = min(score_cap, repay_cap, tenure_cap)
      application asymmetry:
        increase -> CushionLimitAdjustment EFFECTIVE immediately
        decrease -> PENDING_NOTICE, effective_at = now + 7 days,
                    requires notify; until EFFECTIVE the OLD (higher) limit
                    still governs usable_cushion_cents
    constants:
      BAND_750: 20000
      BAND_500: 10000
      BAND_300: 5000
      BAND_200: 2000
      NOTICE_DAYS: 7
    precision: "integer cents; all boundaries inclusive (>=')"

  - name: calc_repayment_waterfall
    description: "Automatic repayment of outstanding advances from a deposit made available (post-early or settle)."
    trigger: "DirectDeposit -> POSTED_EARLY or RECEIVED_FILE -> SETTLED"
    inputs: ["deposit amount", "outstanding advances of the account ordered by created_at ASC, tie-break none needed (created_at unique per insert order)"]
    algorithm: waterfall_allocation
    formula: |
      if deposit.qualifying:        # WATERFALL mode
          remaining = deposit.amount_cents
          for adv in advances(OPEN|PARTIALLY_REPAID, order created_at ASC):
              alloc = min(adv.outstanding_cents, remaining)
              if alloc > 0: create RepaymentAllocation(WATERFALL, alloc)
              remaining -= alloc
              if remaining == 0: break
      else:                          # PRO_RATA mode (non-qualifying deposit)
          total_out = sum(outstanding over OPEN|PARTIALLY_REPAID advances)
          if total_out == 0: no allocations
          else:
              pool = min(deposit.amount_cents, total_out)
              for each adv: share_i = round_half_up(pool * adv.outstanding / total_out)
              diff = pool - sum(share_i)          # from per-line rounding
              share_oldest += diff                # remainder cents to OLDEST advance
              create RepaymentAllocation(PRO_RATA, share_i) for each share_i > 0
      pinned rounding order: round each line FIRST (half-up), then reconcile
      the remainder against the OLDEST advance — never sum-then-round.
      every allocation also posts LedgerEntry ADVANCE_REPAYMENT_DEBIT
      (program_leg -alloc, bank_leg +alloc, status SETTLED) so ledger parity
      holds across repayment activity.
    constants:
      ON_TIME_DAYS: 35
    precision: "integer cents; per-line round_half_up, remainder to oldest"

  - name: calc_available_balance
    description: "Two read models of spendable funds; evaluation order pinned to break the cushion<->outstanding cycle."
    trigger: "GET /banking/accounts/{id} and any advance/deposit mutation"
    inputs: ["posted_balance_cents", "provisional_early_cents", "holds_cents", "outstanding_cushion_cents", "member.current_limit_cents", "member.status", "member.deposit_reroute_flag"]
    algorithm: constraint_propagation
    formula: |
      evaluation order (pinned):
        1) usable_cushion = 0 if member.status != ELIGIBLE or deposit_reroute_flag
                            else max(0, min(limit, limit - outstanding_cushion))
        2) OPTIMISTIC  = posted + provisional_early - holds + usable_cushion
        3) CONSERVATIVE = posted - holds
      the cycle (cushion depends on outstanding, outstanding mutated by
      repayment which depends on funds made available) is broken by computing
      usable_cushion from the PRE-mutation outstanding snapshot within a
      single request, then applying mutations, then recomputing for response.
    constants: {}
    precision: "integer cents"
    variants:
      - name: OPTIMISTIC
        when: "member-facing spending power"
        difference: "includes provisional early postings and usable cushion"
      - name: CONSERVATIVE
        when: "reclaim/return processing and sponsor-bank reporting"
        difference: "excludes provisional and cushion entirely; same account at the same instant yields a lower or equal figure"

  - name: calc_recon_net_position
    description: "Program vs sponsor-bank net position over a run window."
    trigger: "POST /banking/reconciliation-runs"
    inputs: ["LedgerEntry rows with posted_at in [period_start, period_end)"]
    algorithm: chronological
    formula: |
      SETTLED_ONLY (authoritative): sum program_leg over status == SETTLED rows
      FORWARD_LOOKING (diagnostic): additionally include status == PENDING rows
      discrepancy_cents = program_net_SETTLED + bank_reported_net (input)
      classification: == 0 -> BALANCED; else DISCREPANCY
    constants: {}
    precision: "integer cents"
    variants:
      - name: SETTLED_ONLY
        when: "run creation and resolution"
        difference: "excludes PENDING legs"
      - name: FORWARD_LOOKING
        when: "diagnostic read"
        difference: "includes PENDING legs, so an early-posted payroll not yet settled shows up and changes the net for identical entry data"

  - name: calc_return_shortfall
    description: "Unrecoverable portion of a returned deposit that becomes a reclaim advance."
    trigger: "DirectDeposit -> RETURNED"
    inputs: ["return amount", "posted_balance_cents before debit"]
    algorithm: threshold
    formula: |
      recoverable = min(amount_cents, max(0, posted_balance_cents))
      shortfall_cents = amount_cents - recoverable
      posted_balance_cents -= recoverable   # may remain >= 0; never driven negative by the debit itself
      if shortfall_cents > 0: create OverdraftAdvance(RECLAIM_SHORTFALL, shortfall)
    constants: {}
    precision: "integer cents; zero-shortfall boundary: shortfall == 0 creates NO advance"

  - name: calc_dispute_deadlines
    description: "Provisional-credit and resolution deadlines."
    trigger: "POST /banking/disputes"
    inputs: ["filed_at (creation clock)"]
    algorithm: threshold
    formula: |
      provisional_due_at = filed_at + 10 business days (advance calendar day;
          skip Saturday/Sunday; no holiday calendar)
      resolution_due_at  = filed_at + 45 calendar days
      provisional_overdue = now > provisional_due_at AND provisional_status == NONE
    constants:
      PROVISIONAL_BUSINESS_DAYS: 10
      RESOLUTION_CALENDAR_DAYS: 45
    precision: "datetime; boundary: issuance exactly AT provisional_due_at is allowed (inclusive)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted for this endpoint per §1.5 roles; for Member role, X-User-ID must equal the Member.id that owns the path resource (account -> member, advance -> account -> member, deposit -> account -> member, dispute -> member)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path ids resolve, validated left-to-right (member -> account -> child); wrong parent yields 404 of the CHILD, not the parent"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_constraint
    check: "request body well-formed: required fields present, enum values valid, string lengths, amount_cents > 0 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "idempotency: POST /banking/accounts/{id}/advances idempotency_key reuse with a DIFFERENT payload"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    applies_to: ["POST /banking/accounts/{id}/advances"]
  - priority: 6
    category: business_constraint
    check: "OCC: expected_*_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /banking/accounts/{id}/advances", "POST /banking/members/{id}/eligibility-evaluations", "POST /banking/members/{id}/abuse-events", "POST /banking/reconciliation-runs/{id}/resolve"]
  - priority: 7
    category: state
    check: "state-machine from-state matches (e.g., settle only from RECEIVED_FILE/POSTED_EARLY, return only from POSTED_EARLY/SETTLED, advance write-off only from OPEN/PARTIALLY_REPAID, dispute actions only from legal case/provisional states)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 8
    category: state
    check: "member posture gate: advances and post-early require member.status == ELIGIBLE (advances) or IN {ELIGIBLE, RESTRICTED} (post-early); ENROLLED/SUSPENDED rejected"
    error_id: ERR_MEMBER_POSTURE
    http_status: 409
    applies_to: ["POST /banking/accounts/{id}/advances", "POST /banking/deposits/{id}/post-early"]
  - priority: 8
    category: state
    check: "terminal lockdown: actions on entities already in a terminal state (return a RETURNED deposit, repay/act on REPAID or WRITTEN_OFF advances, act on RESOLVED_* disputes, any mutation on a CLOSED member)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: ["POST /banking/deposits/{id}/return", "POST /banking/deposits/{id}/settle", "POST /banking/deposits/{id}/post-early", "POST /banking/advances/{id}/write-off", "POST /banking/disputes/{id}/issue-provisional-credit", "POST /banking/disputes/{id}/resolve", "POST /banking/members/{id}/close"]
  - priority: 9
    category: business_safety
    check: "abuse lock: member.deposit_reroute_flag == true blocks advances and early posting regardless of posture"
    error_id: ERR_ABUSE_LOCK
    http_status: 422
    applies_to: ["POST /banking/accounts/{id}/advances", "POST /banking/deposits/{id}/post-early"]
  - priority: 10
    category: business_constraint
    check: "post-early requires deposit.qualifying == true (PAYROLL and amount_cents >= 10000)"
    error_id: ERR_NOT_QUALIFYING
    http_status: 422
    applies_to: ["POST /banking/deposits/{id}/post-early"]
  - priority: 11
    category: business_temporal
    check: "temporal windows: settle before settlement_date rejected; post-early on/after settlement_date rejected; write-off before 60 days rejected; provisional credit after provisional_due_at rejected; resolution after resolution_due_at rejected"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 422
    applies_to: ["POST /banking/deposits/{id}/settle", "POST /banking/deposits/{id}/post-early", "POST /banking/advances/{id}/write-off", "POST /banking/disputes/{id}/issue-provisional-credit", "POST /banking/disputes/{id}/resolve"]
  - priority: 12
    category: business_temporal
    check: "overlap windows: ReconciliationRun [period_start, period_end) must not overlap any existing non-terminal run (status IN {OPEN, DISCREPANCY}) for same sponsor_bank_code (half-open adjacency allowed); DirectDeposit for same account+originator with settlement_date within +/-3 days of an in-flight (RECEIVED_FILE/POSTED_EARLY) deposit is rejected"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /banking/reconciliation-runs", "POST /banking/accounts/{id}/deposits"]
  - priority: 13
    category: business_constraint
    check: "uniqueness: member external_ref unique; deposit trace_id unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /banking/members", "POST /banking/accounts/{id}/deposits"]
  - priority: 14
    category: business_referential
    check: "post-early requires no DISCREPANCY ReconciliationRun whose window contains now for the account's sponsor bank"
    error_id: ERR_REFERENTIAL_BLOCK
    http_status: 422
    applies_to: ["POST /banking/deposits/{id}/post-early"]
  - priority: 15
    category: business_fiscal
    check: "advance amount_cents <= account.usable_cushion_cents at request time; advance on SAVINGS account rejected; limit == 0 rejects any advance"
    error_id: ERR_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /banking/accounts/{id}/advances"]
  - priority: 16
    category: business_fiscal
    check: "dispute amount_cents <= disputed deposit amount_cents"
    error_id: ERR_DISPUTE_AMOUNT_EXCEEDS
    http_status: 422
    applies_to: ["POST /banking/disputes"]
  - priority: 17
    category: business_fiscal
    check: "debit amount_cents <= account.available_optimistic_cents at request time (spending may draw on posted, provisional, and usable cushion)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 422
    applies_to: ["POST /banking/accounts/{id}/debits"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: /banking/members
    description: "Enroll a member."
    roles: [ProgramOps]
    code: 201
    input: [external_ref, full_name, enrolled_at]
    output: Member
    side_effects: ["Member created in ENROLLED with current_limit_cents 0"]
  - method: GET
    path: /banking/members
    description: "List members with optional posture filter."
    roles: [ProgramOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: GET
    path: /banking/members/{id}
    description: "Read one member including computed posture fields."
    roles: [Member, ProgramOps]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: POST
    path: /banking/members/{id}/eligibility-evaluations
    description: "Run eligibility scoring (BATCH authoritative / REALTIME preview). BATCH supersedes prior CURRENT profile and may create a CushionLimitAdjustment."
    roles: [ProgramOps]
    code: 201
    input: [evaluation_mode, expected_member_version]
    output: EligibilityProfile
    side_effects: ["calc_eligibility_score", "calc_ladder_limit (BATCH)", "prior CURRENT BATCH profile SUPERSEDED", "CushionLimitAdjustment on delta != 0", "increments Member.version by 1"]
  - method: GET
    path: /banking/members/{id}/eligibility-profiles
    description: "List eligibility profiles for a member, newest first."
    roles: [Member, ProgramOps]
    code: 200
    input: ["evaluation_mode?", "limit?", "offset?"]
    output: EligibilityProfile[]
    side_effects: []
  - method: POST
    path: /banking/members/{id}/abuse-events
    description: "Record an abuse event; recomputes posture cascade."
    roles: [ProgramOps]
    code: 201
    input: [event_type, "evidence_note?", expected_member_version]
    output: AbuseEvent
    side_effects: ["member.abuse_event_count += 1", "posture transition ELIGIBLE->RESTRICTED or ->SUSPENDED per 90-day count", "deposit_reroute_flag per rules", "increments Member.version by 1"]
  - method: GET
    path: /banking/members/{id}/abuse-events
    description: "List abuse events for a member."
    roles: [ProgramOps]
    code: 200
    input: ["limit?", "offset?"]
    output: AbuseEvent[]
    side_effects: []
  - method: POST
    path: /banking/members/{id}/accounts
    description: "Open a deposit account for a member."
    roles: [SponsorBankOps]
    code: 201
    input: [account_type, "currency?"]
    output: DepositAccount
    side_effects: []
  - method: GET
    path: /banking/members/{id}/accounts
    description: "List a member's accounts."
    roles: [Member, ProgramOps, SponsorBankOps]
    code: 200
    input: ["limit?", "offset?"]
    output: DepositAccount[]
    side_effects: []
  - method: GET
    path: /banking/accounts/{id}
    description: "Read an account including both available-balance variants."
    roles: [Member, ProgramOps, SponsorBankOps]
    code: 200
    input: []
    output: DepositAccount
    side_effects: ["recompute calc_available_balance for response"]
  - method: POST
    path: /banking/accounts/{id}/advances
    description: "Draw a no-fee cushion advance (OCC on account version)."
    roles: [Member]
    code: 201
    input: [amount_cents, idempotency_key, expected_account_version]
    output: OverdraftAdvance
    side_effects: ["advance created OPEN (origin MEMBER_INITIATED)", "account.outstanding_cushion_cents += amount", "account.posted_balance_cents += amount_cents (cushion funds credited)", "create LedgerEntry ADVANCE_CREDIT", "increments DepositAccount.version by 1"]
  - method: POST
    path: /banking/accounts/{id}/debits
    description: "Spend funds (card/ACH debit). Draws on available_optimistic_cents, which includes usable cushion; a debit larger than posted balances but within cushion auto-creates a MEMBER_INITIATED OverdraftAdvance for the excess (fee-free)."
    roles: [Member]
    code: 201
    input: [amount_cents, merchant_ref, expected_account_version]
    output: LedgerEntry
    side_effects: ["account.posted_balance_cents -= amount_cents (may go negative when drawing cushion)", "if amount > posted_balance_cents: create OverdraftAdvance(origin MEMBER_INITIATED, principal = amount - posted_balance_before) OPEN and outstanding_cushion_cents += principal", "create LedgerEntry", "increments DepositAccount.version by 1"]
  - method: GET
    path: /banking/accounts/{id}/advances
    description: "List advances for an account."
    roles: [Member, ProgramOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OverdraftAdvance[]
    side_effects: []
  - method: GET
    path: /banking/accounts/{id}/ledger-entries
    description: "List ledger entries for an account."
    roles: [Member, ProgramOps, SponsorBankOps]
    code: 200
    input: ["entry_type?", "status?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: /banking/accounts/{id}/deposits
    description: "List deposits for an account."
    roles: [Member, ProgramOps, SponsorBankOps]
    code: 200
    input: ["status?", "originator_id?", "limit?", "offset?"]
    output: DirectDeposit[]
    side_effects: []
  - method: GET
    path: /banking/advances/{id}
    description: "Read one advance."
    roles: [Member, ProgramOps]
    code: 200
    input: []
    output: OverdraftAdvance
    side_effects: []
  - method: POST
    path: /banking/advances/{id}/write-off
    description: "Write off an advance aged >= 60 days."
    roles: [ProgramOps]
    code: 200
    input: [reason]
    output: OverdraftAdvance
    side_effects: ["member.consecutive_on_time_repayments := 0", "account.outstanding_cushion_cents -= outstanding_cents"]
  - method: GET
    path: /banking/advances/{id}/repayment-allocations
    description: "List allocations against an advance."
    roles: [Member, ProgramOps]
    code: 200
    input: ["limit?", "offset?"]
    output: RepaymentAllocation[]
    side_effects: []
  - method: POST
    path: /banking/accounts/{id}/deposits
    description: "Register an inbound ACH deposit file. An in-flight deposit (status IN {RECEIVED_FILE, POSTED_EARLY}) for the same account+originator whose settlement_date is within +/-3 days of the new deposit's settlement_date (distance >= 4 days is allowed; exactly 3 days is a conflict) is rejected with ERR_WINDOW_OVERLAP."
    roles: [SponsorBankOps]
    code: 201
    input: [originator_id, originator_type, amount_cents, settlement_date, trace_id]
    output: DirectDeposit
    side_effects: ["deposit created RECEIVED_FILE"]
  - method: GET
    path: /banking/deposits/{id}
    description: "Read one deposit."
    roles: [Member, ProgramOps, SponsorBankOps]
    code: 200
    input: []
    output: DirectDeposit
    side_effects: []
  - method: POST
    path: /banking/deposits/{id}/post-early
    description: "Make payroll funds available ahead of settlement."
    roles: [ProgramOps]
    code: 200
    input: []
    output: EarlyPosting
    side_effects: ["deposit POSTED_EARLY", "EarlyPosting PROVISIONAL created", "provisional_early_cents += amount", "calc_repayment_waterfall", "LedgerEntry EARLY_POSTING_CREDIT (PENDING)"]
  - method: POST
    path: /banking/deposits/{id}/settle
    description: "Settle a deposit on/after settlement date."
    roles: [SponsorBankOps]
    code: 200
    input: []
    output: DirectDeposit
    side_effects: ["deposit SETTLED", "EarlyPosting CONFIRMED if posted early", "posted_balance_cents += amount", "calc_repayment_waterfall when settling from RECEIVED_FILE only"]
  - method: POST
    path: /banking/deposits/{id}/return
    description: "Process an ACH return / reclaim."
    roles: [SponsorBankOps]
    code: 201
    input: [return_code]
    output: DepositReturn
    side_effects: ["deposit RETURNED", "EarlyPosting REVERSED if PROVISIONAL", "calc_return_shortfall", "RECLAIM_SHORTFALL advance when shortfall > 0", "LedgerEntries EARLY_POSTING_REVERSAL / DEPOSIT_RETURN_DEBIT"]
  - method: GET
    path: /banking/deposits/{id}/returns
    description: "List returns for a deposit (0 or 1)."
    roles: [ProgramOps, SponsorBankOps]
    code: 200
    input: ["limit?", "offset?"]
    output: DepositReturn[]
    side_effects: []
  - method: GET
    path: /banking/deposits/{id}/early-postings
    description: "List early postings for a deposit (0 or 1)."
    roles: [ProgramOps]
    code: 200
    input: ["limit?", "offset?"]
    output: EarlyPosting[]
    side_effects: []
  - method: GET
    path: /banking/deposits/{id}/repayment-allocations
    description: "List allocations funded by a deposit."
    roles: [ProgramOps]
    code: 200
    input: ["limit?", "offset?"]
    output: RepaymentAllocation[]
    side_effects: []
  - method: GET
    path: /banking/deposits/{id}/disputes
    description: "List disputes filed against a deposit."
    roles: [Member, ProgramOps, DisputesAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: /banking/members/{id}/close
    description: "Close a SUSPENDED member; writes off all non-terminal advances."
    roles: [ProgramOps]
    code: 200
    input: []
    output: Member
    side_effects: ["SUSPENDED -> CLOSED", "OPEN/PARTIALLY_REPAID advances -> WRITTEN_OFF"]
  - method: GET
    path: /banking/members/{id}/limit-adjustments
    description: "List ladder adjustments for a member, ordered by created_at ASC (oldest first)."
    roles: [Member, ProgramOps]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CushionLimitAdjustment[]
    side_effects: []
  - method: GET
    path: /banking/limit-adjustments/{id}
    description: "Read one adjustment."
    roles: [Member, ProgramOps]
    code: 200
    input: []
    output: CushionLimitAdjustment
    side_effects: []
  - method: POST
    path: /banking/limit-adjustments/{id}/notify
    description: "Record member notification for a pending decrease."
    roles: [ProgramOps]
    code: 200
    input: []
    output: CushionLimitAdjustment
    side_effects: ["PENDING_NOTICE -> NOTIFIED", "notified_at set"]
  - method: POST
    path: /banking/reconciliation-runs
    description: "Create a sponsor-bank reconciliation run over a half-open window."
    roles: [SponsorBankOps]
    code: 201
    input: [sponsor_bank_code, period_start, period_end, bank_reported_net_cents]
    output: ReconciliationRun
    side_effects: ["calc_recon_net_position (SETTLED_ONLY)", "auto-transition to BALANCED or DISCREPANCY"]
  - method: GET
    path: /banking/reconciliation-runs
    description: "List reconciliation runs."
    roles: [ProgramOps, SponsorBankOps]
    code: 200
    input: ["status?", "sponsor_bank_code?", "limit?", "offset?"]
    output: ReconciliationRun[]
    side_effects: []
  - method: GET
    path: /banking/reconciliation-runs/{id}
    description: "Read one run."
    roles: [ProgramOps, SponsorBankOps]
    code: 200
    input: []
    output: ReconciliationRun
    side_effects: []
  - method: POST
    path: /banking/reconciliation-runs/{id}/resolve
    description: "Resolve a DISCREPANCY run by posting adjusting entries (OCC on run version)."
    roles: [ProgramOps]
    code: 200
    input: [expected_run_version, resolution_note]
    output: ReconciliationRun
    side_effects: ["LedgerEntry ADJUSTMENT rows created", "post-resolution leg sum == 0", "increments ReconciliationRun.version by 1"]
  - method: GET
    path: /banking/reconciliation-runs/{id}/ledger-entries
    description: "List ledger entries attached to a run (adjustments)."
    roles: [ProgramOps, SponsorBankOps]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: /banking/disputes
    description: "File a dispute on an early-posted or returned deposit."
    roles: [Member]
    code: 201
    input: [deposit_id, dispute_type, amount_cents, statement]
    output: Dispute
    side_effects: ["calc_dispute_deadlines", "case_status FILED, provisional_status NONE"]
  - method: GET
    path: /banking/disputes/{id}
    description: "Read one dispute."
    roles: [Member, ProgramOps, DisputesAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: []
  - method: GET
    path: /banking/members/{id}/disputes
    description: "List a member's disputes."
    roles: [Member, ProgramOps, DisputesAgent]
    code: 200
    input: ["case_status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []
  - method: POST
    path: /banking/disputes/{id}/issue-provisional-credit
    description: "Issue provisional credit within the 10-business-day timeline."
    roles: [DisputesAgent]
    code: 200
    input: []
    output: Dispute
    side_effects: ["provisional_status PROVISIONAL_ISSUED", "case_status UNDER_REVIEW", "holds_cents += amount", "LedgerEntry PROVISIONAL_CREDIT"]
  - method: POST
    path: /banking/disputes/{id}/resolve
    description: "Resolve a dispute for member or bank."
    roles: [DisputesAgent]
    code: 200
    input: [outcome, resolution_note]
    output: Dispute
    side_effects: ["outcome MEMBER: provisional made final (or direct credit)", "outcome BANK: provisional reclaimed"]
  - method: POST
    path: /banking/_clock/set_current_utc
    description: "Test-driving endpoint: set the logical clock. Server startup default time is 2026-09-01T00:00:00Z whenever the clock has not been set; the logical clock never falls back to wall-clock time."
    roles: [ProgramOps]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances all time-derived computed fields; triggers time-based transitions (NOTIFIED->EFFECTIVE, overdue flags)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not allowed for the endpoint, or Member role acting on a resource owned by another member."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not resolve; child under wrong parent reports the child as not found."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum value, non-positive amount, over-long string."
  - id: ERR_IDEMPOTENCY_CONFLICT
    http: 409
    condition: "idempotency_key reused with a different payload on advance creation."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version (OCC)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine from-state mismatch (e.g., settle an already SETTLED deposit, write off a REPAID advance, notify an EFFECTIVE adjustment, resolve a BALANCED run)."
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Action attempted on an entity in a terminal state (RETURNED deposit, REPAID/WRITTEN_OFF advance, RESOLVED_MEMBER/RESOLVED_BANK dispute, CLOSED member). Used instead of ERR_INVALID_STATE where the domain distinguishes terminal lockdown from a mid-flight from-state mismatch."
  - id: ERR_MEMBER_POSTURE
    http: 409
    condition: "Member status does not permit the operation (ENROLLED/SUSPENDED for advances; ENROLLED/SUSPENDED for post-early)."
  - id: ERR_ABUSE_LOCK
    http: 422
    condition: "deposit_reroute_flag blocks advance creation or early posting even when posture would allow it."
  - id: ERR_TEMPORAL_VIOLATION
    http: 422
    condition: "Clock-dependent rule violated: settle before settlement_date, write-off before 60 days, provisional credit after provisional_due_at, resolution after resolution_due_at."
  - id: ERR_WINDOW_OVERLAP
    http: 409
    condition: "Reconciliation run window overlaps an existing run for the same sponsor bank, or a deposit collides with an in-flight deposit for the same account+originator within the +/-3-day buffer."
  - id: ERR_DUPLICATE
    http: 409
    condition: "Unique constraint violated: member external_ref or deposit trace_id."
  - id: ERR_REFERENTIAL_BLOCK
    http: 422
    condition: "Cross-entity block: open DISCREPANCY reconciliation window covers now (post-early), or dispute references a deposit not owned by the filing member."
  - id: ERR_LIMIT_EXCEEDED
    http: 422
    condition: "Advance amount exceeds usable_cushion_cents, or account is SAVINGS, or current limit is 0."
  - id: ERR_DISPUTE_AMOUNT_EXCEEDS
    http: 422
    condition: "Dispute amount exceeds the disputed deposit's amount_cents."
  - id: ERR_INSUFFICIENT_FUNDS
    http: 422
    condition: "Debit amount exceeds available_optimistic_cents."
  - id: ERR_NOT_QUALIFYING
    http: 422
    condition: "post-early on a non-qualifying deposit (originator_type OTHER or amount < 10000)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "The account holder; acts only on resources owned by their Member record."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /banking/accounts/{id}/advances"
      - "POST /banking/accounts/{id}/debits"
      - "POST /banking/disputes"
    shared_operations:
      - "read own member record, accounts, deposits, advances, ledger entries, limit adjustments, disputes"
  - name: ProgramOps
    description: "Program operator: enrollment, eligibility evaluation, abuse flagging, early posting, write-offs, notifications, reconciliation resolution, clock control."
    identity: "opaque"
    exclusive_operations:
      - "POST /banking/members"
      - "POST /banking/members/{id}/eligibility-evaluations"
      - "POST /banking/members/{id}/abuse-events"
      - "POST /banking/members/{id}/close"
      - "POST /banking/deposits/{id}/post-early"
      - "POST /banking/advances/{id}/write-off"
      - "POST /banking/limit-adjustments/{id}/notify"
      - "POST /banking/reconciliation-runs/{id}/resolve"
      - "POST /banking/_clock/set_current_utc"
    shared_operations:
      - "read members, accounts, deposits, advances, ledger entries, runs, disputes"
  - name: SponsorBankOps
    description: "Chartered sponsor bank operator: account opening, ACH file registration, settlement, returns, reconciliation run creation."
    identity: "opaque"
    exclusive_operations:
      - "POST /banking/members/{id}/accounts"
      - "POST /banking/accounts/{id}/deposits"
      - "POST /banking/deposits/{id}/settle"
      - "POST /banking/deposits/{id}/return"
      - "POST /banking/reconciliation-runs"
    shared_operations:
      - "read accounts, deposits, ledger entries, runs"
  - name: DisputesAgent
    description: "Dispute specialist; cannot create deposits or advances (segregation from bank ops)."
    identity: "opaque"
    exclusive_operations:
      - "POST /banking/disputes/{id}/issue-provisional-credit"
      - "POST /banking/disputes/{id}/resolve"
    shared_operations:
      - "read disputes and deposits"
