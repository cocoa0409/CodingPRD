      - name: missing_role_returns_unauthenticated
        claim_type: exclusive_operation_denied
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without a valid X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
