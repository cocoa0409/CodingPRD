  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Request without X-User-Role header returns 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /accreditation/systems/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED when X-User-Role header is absent"
            - "HTTP status == 401"

      - name: rbac_forbidden_schoolleader_cannot_decide
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
          - roles
        distinguishing_aspect: "SchoolLeader calling Commission-only decide endpoint gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Term exists"]
          setup_api_calls:
            - call: "POST /accreditation/systems"
              payload: { name: "RBAC County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /accreditation/terms/${term_id}/decide"
              payload: { outcome: "ACCREDITED" }
              as: SchoolLeader
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: duplicate_rating_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: "Second rating for the same (term, campus, standard) triplet is rejected."
        test_recipe:
          setup: ["Term PREPARATION; one rating already created for (term, campus, L1)"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Dup County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_id: $.data.id, term_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 2, expected_term_version: "${term_v}" }
              as: SchoolLeader
            - call: "GET /accreditation/terms/${term_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { term_v2: $.data.version }
          trigger:
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_id}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_v2}" }
              as: SchoolLeader
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_RESOURCE"
            - "HTTP status == 409"

      - name: aggregate_validation_second_active_term
        claim_type: aggregate_validation
        grounds:
          - validations[priority=8]
        distinguishing_aspect: "Each term individually valid, but a second term advancing to SELF_STUDY while the first is active violates the one-active-term aggregate constraint."
        test_recipe:
          setup: ["Term T1 already SELF_STUDY; second term T2 created"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "Aggregate County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
              captures: { campus_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_1: $.data.id, term_1_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_1}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_1_v}" }
              as: SchoolLeader
            - call: "POST /accreditation/terms/${term_1}/advance"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/terms"
              payload: { term_start: "2027-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_2: $.data.id, term_2_v: $.data.version }
            - call: "POST /accreditation/ratings"
              payload: { term_id: "${term_2}", campus_id: "${campus_id}", standard_id: "${std_l1}", rating: 3, expected_term_version: "${term_2_v}" }
              as: SchoolLeader
          trigger:
            - call: "POST /accreditation/terms/${term_2}/advance"
              payload: {}
              as: AccreditationOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (another term already in SELF_STUDY)"
            - "HTTP status == 409"

      - name: fiscal_violation_overpayment_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_FISCAL_VIOLATION]
        distinguishing_aspect: "Payment exceeding the outstanding balance is rejected."
        test_recipe:
          setup: ["Invoice ISSUED for 620000; no payments yet"]
          setup_api_calls:
            - call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
            - call: "POST /accreditation/fee-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", base_system_fee_cents: 500000, per_campus_fee_cents: 120000, large_campus_fee_cents: 200000, large_campus_threshold: 1000, visit_day_rate_cents: 75000 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems"
              payload: { name: "Fiscal County", system_type: "SINGLE_SCHOOL" }
              as: AccreditationOfficer
              captures: { sys_id: $.data.id }
            - call: "POST /accreditation/systems/${sys_id}/campuses"
              payload: { name: "Main", enrollment: 100 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_id}/invoices"
              payload: { billing_year: 2026, invoice_type: "ANNUAL_FEE" }
              as: SystemBursar
              captures: { inv_id: $.data.id, inv_v: $.data.version }
          trigger:
            - call: "POST /accreditation/invoices/${inv_id}/payments"
              payload: { amount_cents: 620001, paid_at: "2026-08-02T00:00:00Z", expected_invoice_version: "${inv_v}" }
              as: SystemBursar
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FISCAL_VIOLATION"
            - "HTTP status == 422"

      - name: cross_entity_validation_goal_campus_mismatch
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=7]
          - errors[ERR_REFERENTIAL_INTEGRITY]
        distinguishing_aspect: "Goal whose campus_id belongs to a different system than the term is rejected."
        test_recipe:
          setup: ["Two systems S1 and S2; term under S1; campus under S2"]
          setup_api_calls:
            - call: "POST /accreditation/standards"
              payload: { code: "L1", title: "Leadership 1", domain: "LEADERSHIP", weight_pct: 100, evidence_min_items: 0 }
              as: AccreditationOfficer
              captures: { std_l1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "S1", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_1: $.data.id }
            - call: "POST /accreditation/systems/${sys_1}/campuses"
              payload: { name: "S1 Campus", enrollment: 100 }
              as: AccreditationOfficer
            - call: "POST /accreditation/systems/${sys_1}/terms"
              payload: { term_start: "2026-09-01T00:00:00Z", term_length_years: 5 }
              as: AccreditationOfficer
              captures: { term_1: $.data.id }
            - call: "POST /accreditation/systems"
              payload: { name: "S2", system_type: "DISTRICT" }
              as: AccreditationOfficer
              captures: { sys_2: $.data.id }
            - call: "POST /accreditation/systems/${sys_2}/campuses"
              payload: { name: "S2 Campus", enrollment: 200 }
              as: AccreditationOfficer
              captures: { campus_s2: $.data.id }
          trigger:
            - call: "POST /accreditation/terms/${term_1}/goals"
              payload: { campus_id: "${campus_s2}", standard_id: "${std_l1}", title: "Bad goal", baseline_value: 1, target_value: 2, direction: "INCREASE" }
              as: SchoolLeader
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENTIAL_INTEGRITY"
            - "HTTP status == 422"

