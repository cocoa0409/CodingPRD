  # ===================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: exam_interval_half_open_overlap_rejected
        grounds:
          - validations[priority=8]
          - errors[ERR_EXAM_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Interval semantic = half-open [s,e) interval on an agency-scoped resource (Examination).
          Overlap IFF s2 < e1 AND s1 < e2; adjacency (e1 == s2) is NOT overlap. Resource entity =
          Examination.
        test_recipe:
          setup:
            - "Agency with existing exam [2026-07-06, 2026-07-10] in SCHEDULED"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "OCC6", agency_name: "OCC6", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag15: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag15}", exam_cycle_code: "P1", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex15a: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag15}", exam_cycle_code: "P2", exam_type: "COMPLIANCE", scheduled_start_date: "2026-07-09T00:00:00Z", scheduled_end_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag15}", exam_cycle_code: "P3", exam_type: "TRUST", scheduled_start_date: "2026-07-10T00:00:00Z", scheduled_end_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex15c: $.data.id }
          assert:
            - "P2 creation fails: err_id == ERR_EXAM_SCHEDULE_OVERLAP (7/09 < 7/10 and 7/06 < 7/15)"
            - "P3 creation succeeds: ex15c is valid (7/10 == e1 boundary; adjacency is NOT overlap in half-open semantics)"

      - name: meeting_point_collision_same_calendar_date
        grounds:
          - validations[priority=9]
          - errors[ERR_MEETING_DATE_CONFLICT]
        distinguishing_aspect: |
          Interval semantic = POINT collision at calendar-date grain on a different resource
          (ExaminerMeeting within an Examination). Two FINALIZED meetings on the same UTC date
          conflict even if times differ; DRAFT meetings do not count. Different geometry
          (point-vs-date) and different resource than exam-interval overlap.
        test_recipe:
          setup:
            - "Exam in FIELDWORK with one FINALIZED meeting on 2026-07-08"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FRB5", agency_name: "FRB5", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag16: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag16}", exam_cycle_code: "N", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-31T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex16: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex16}/first-day-items"
              payload: { request_ref: "FN", description: "x", due_date: "2026-07-15T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it16: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex16}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/first-day-items/${it16}/waive"
              payload: { waived_reason: "na" }
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examinations/${ex16}/begin-fieldwork"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex16}", meeting_date: "2026-07-08T09:00:00Z", attendees: ["E", "O"], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { mt16a: $.data.id }
            - call: "POST /regulatory-exams/examiner-meetings/${mt16a}/finalize"
              payload: {}
              as: RegulatoryAffairsManager
          trigger:
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex16}", meeting_date: "2026-07-08T15:00:00Z", attendees: ["E2", "O2"], minutes_summary: "m2" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex16}", meeting_date: "2026-07-09T09:00:00Z", attendees: ["E3", "O3"], minutes_summary: "m3" }
              as: RegulatoryAffairsManager
              captures: { mt16b: $.data.id }
          assert:
            - "Same-date creation fails: err_id == ERR_MEETING_DATE_CONFLICT (UTC calendar date 2026-07-08 collides even though times differ)"
            - "Different-date creation succeeds: mt16b is valid (2026-07-09 does not collide)"

  # ===================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: overdue_item_count_invariant_under_waive_and_submit
        grounds:
          - calculations.overdue_item_count
          - state_machines.FirstDayLetterItem.PENDING_to_WAIVED
          - state_machines.FirstDayLetterItem.PENDING_to_SUBMITTED
        distinguishing_aspect: |
          Conserved quantity = total FirstDayLetterItem rows for the exam. Invariant:
          count(PENDING) + count(SUBMITTED) + count(WAIVED) == constant across waive and
          submit-accept operations. overdue_item_count decreases by exactly 1 per forward
          action; undo-like compensation (submitting another item) does not drift the total.
        test_recipe:
          setup:
            - "Exam with 3 PENDING first-day items; clock advanced so all are overdue"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "OCC7", agency_name: "OCC7", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag17: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag17}", exam_cycle_code: "M", exam_type: "SAFETY_SOUNDNESS", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-31T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex17: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex17}/first-day-items"
              payload: { request_ref: "I1", description: "x", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it17_1: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex17}/first-day-items"
              payload: { request_ref: "I2", description: "x", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it17_2: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex17}/first-day-items"
              payload: { request_ref: "I3", description: "x", due_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { it17_3: $.data.id }
            - call: "POST /regulatory-exams/examinations/${ex17}/issue-first-day-letter"
              payload: {}
              as: RegulatoryAffairsManager
            - call: "POST /regulatory-exams/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /regulatory-exams/examinations/${ex17}"
              as: RegulatoryAffairsManager
              captures: { overdue_pre: $.data.overdue_item_count }
            - call: "POST /regulatory-exams/officers"
              payload: { full_name: "O17", email: "o17@x", officer_role_title: "CRO" }
              as: PlatformAdmin
              captures: { off17: $.data.id }
            - call: "POST /regulatory-exams/reviewers"
              payload: { full_name: "R17", email: "r17@x", certification_level: "L1" }
              as: PlatformAdmin
              captures: { rev17: $.data.id }
          trigger:
            - call: "POST /regulatory-exams/first-day-items/${it17_1}/waive"
              payload: { waived_reason: "waived" }
              as: RegulatoryAffairsManager
            - call: "GET /regulatory-exams/examinations/${ex17}"
              as: RegulatoryAffairsManager
              captures: { overdue_after_waive: $.data.overdue_item_count }
            - call: "POST /regulatory-exams/first-day-items/${it17_2}/submissions"
              payload: { document_manifest: [{doc_id: "d", title: "t", page_count: 1, sha256: "h"}] }
              as: RemediationOwner
              as_user_id: "${off17}"
              captures: { sub17: $.data.id }
            - call: "POST /regulatory-exams/document-submissions/${sub17}/accept"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${rev17}"
            - call: "GET /regulatory-exams/examinations/${ex17}"
              as: RegulatoryAffairsManager
              captures: { overdue_after_submit: $.data.overdue_item_count }
            - call: "GET /regulatory-exams/examinations/${ex17}/first-day-items"
              as: RegulatoryAffairsManager
          assert:
            - "overdue_pre == 3 (all 3 PENDING, due 7/20 < clock 7/25)"
            - "overdue_after_waive == 2 (waive decrements by exactly 1)"
            - "overdue_after_submit == 1 (submit-accept decrements by exactly 1 more)"
            - "Total items on exam == 3 always (conserved); status breakdown: 1 WAIVED + 1 SUBMITTED + 1 PENDING"
            - "Examination.posture transitions FROZEN (3) -> RESTRICTED (2) -> RESTRICTED (1) — never drifts to an impossible count"

      - name: plan_version_monotonic_invariant_under_revise_cycle
        grounds:
          - state_machines.RemediationPlan.REJECTED_to_DRAFT
          - state_machines.RemediationPlan.ACTIVE_to_SUPERSEDED
          - entities.RemediationPlan.fields.plan_version
        distinguishing_aspect: |
          Conserved quantity = max(plan_version) per issue and count of plans. Invariant: each
          new RemediationPlan creation increments max(plan_version) by exactly 1; revise cycle
          does NOT create a new plan nor alter plan_version; supersede does not delete the old
          plan. Different conserved quantity than first-day item count.
        test_recipe:
          setup:
            - "Issue with plan v1 REJECTED then revised (stays v1); then a NEW plan created (becomes v2)"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FRB6", agency_name: "FRB6", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
