# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2242
# Peer-to-Peer Recreational Vehicle Rental Marketplace
#
# One block per §0.5 difficulty rule_id, each with >= 2 differentiated
# instances. Every instance names the scaffold element it is grounded in, the
# falsifiable aspect that distinguishes it from its siblings, and a replayable
# test recipe whose asserts are pre-computed literals.
#
# YAML anchors (&c_*) are declared on their first use and aliased (*c_*)
# afterwards; they are the shared "canonical marketplace" setup chain so that
# every later instance replays byte-identical state. Expanding the aliases
# yields a flat list of call objects.
#
# CANONICAL PINNED ARITHMETIC (logical clock default 2026-08-01T00:00:00Z,
# listing base_nightly_rate_cents 21533, booking 2026-08-29 .. 2026-09-02):
#   nights                4        (half-open [start, end))
#   per-night cents       29070 + 29070 + 29070 + 23686
#   base_subtotal_cents   110896   (round PER NIGHT; round-once-at-end = 110895)
#   premium_cents         24951    (max(19600, 19961) = 19961, +25% towing 4990)
#   pre_discount_cents    135847 -> LOYALTY_TIER_1 (undiscounted total 152149
#                                  would wrongly read LOYALTY_TIER_2)
#   loyalty_discount      5434     discounted_subtotal 130413
#   service_fee_cents     15650    quoted_total / hold 146063
#   final_overage_cents   5813 (SEGMENT_WISE)  trip_total_overage_cents 0
#   final_total_cents     151876   balance_due_cents 5813
#   settle ledger         -151876 / +111275 / +15650 / +24951  (sum 0)
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    scaffold_basis: >-
      §1.3 metered_overage declares variants SEGMENT_WISE (pinned, billed into
      Booking.final_overage_cents) and TRIP_TOTAL (reporting, into
      Booking.trip_total_overage_cents and into estimated_overage_cents at
      confirm). §1.3 renter_driving_record_points declares variants ROLLING_36M
      (Renter.driving_record_points, the priority-18 gate) and MOST_RECENT_ONLY
      (Booking.renter_record_points_snapshot, the underwritten number).
    instances:

      - name: metered_overage_segment_wise_bills_where_trip_total_reports_zero
        grounds: >-
          §1.3 metered_overage: SEGMENT_WISE grants the mileage and generator
          allowance per consecutive reading pair, so under-use in one segment
          cannot offset over-use in another; TRIP_TOTAL pools the whole trip
          allowance and ignores MID_TRIP rows entirely. Both variants are
          computed on the same IN_TRIP -> RETURNED transition from the same
          three MeterReading rows.
        distinguishing_aspect: >-
          The two variants must disagree on identical data. Segment 1
          (08-29T15:00 -> 08-31T15:00, 2 nights) uses 260 miles against a 200
          mile allowance and 10.5 generator hours against 6.0, so it bills
          60*65 = 3900 plus ceil_to_tenth(4.5)*425 = 1913, total 5813. Segment 2
          (08-31T15:00 -> 09-02T11:00, 2 nights) uses 140 miles and 1.5 hours,
          both under allowance, and bills 0 — the surplus is NOT carried back.
          Pooled over the trip, 400 miles against 400 and 12.0 hours against
          12.0 are exactly at allowance, so TRIP_TOTAL reports 0. An
          implementation that bills the pooled number charges the renter 0
          instead of 5813; one that lets segment 2's surplus offset segment 1
          reaches the same wrong 0.
        test_recipe:
          setup: >-
            Build the canonical marketplace (clock at its 2026-08-01 default,
            one owner, one renter with a CLEAR 2-point driving record and a
            VERIFIED_BASIC towing check, three pricing seasons, the STANDARD
            protection plan, the MODERATE cancellation policy), onboard a
            TRAVEL_TRAILER listing all the way to LISTED, fund the renter's
            wallet, then take booking B1 (PICKUP, 2026-08-29..2026-09-02,
            declared 380 miles / 11.0 generator hours) through CONFIRMED and
            IN_TRIP, record PRE_TRIP / MID_TRIP / POST_TRIP readings and both
            photo phases.
          setup_api_calls:
            - &c_clock
              call: "POST /rv-marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &c_owner
              call: "POST /rv-marketplace/owners"
              payload: { display_name: "Ada Rigby", email: "ada@rvshare.test", payout_state_code: "OR" }
              as: PlatformAdmin
              captures: { owner_id: "$.data.id", owner_v: "$.data.version" }
            - &c_renter
              call: "POST /rv-marketplace/renters"
              payload: { display_name: "Ben Traveler", email: "ben@rvshare.test", date_of_birth: "1994-05-10", license_state_code: "OR" }
              as: PlatformAdmin
              captures: { renter_id: "$.data.id" }
            - &c_season_peak
              call: "POST /rv-marketplace/pricing-seasons"
              payload: { season_code: "PEAK", start_month_day: "06-01", end_month_day: "08-31", multiplier_bp: 13500 }
              as: PlatformAdmin
            - &c_season_shoulder
              call: "POST /rv-marketplace/pricing-seasons"
              payload: { season_code: "SHOULDER", start_month_day: "09-01", end_month_day: "10-31", multiplier_bp: 11000 }
              as: PlatformAdmin
            - &c_season_off
              call: "POST /rv-marketplace/pricing-seasons"
              payload: { season_code: "OFF", start_month_day: "01-01", end_month_day: "05-31", multiplier_bp: 8500 }
              as: PlatformAdmin
            - &c_plan_std
              call: "POST /rv-marketplace/protection-plans"
              payload:
                tier: "STANDARD"
                daily_premium_cents: 4900
                premium_pct_of_base_bp: 1800
                deductible_cents: 150000
                coverage_ceiling_cents: 3000000
                excluded_causes: ["AWNING_WIND"]
                eligible_vehicle_classes: ["CLASS_A", "CLASS_C", "CAMPER_VAN", "TRAVEL_TRAILER", "FIFTH_WHEEL"]
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - &c_policy_mod
              call: "POST /rv-marketplace/cancellation-policies"
              payload:
                tier: "MODERATE"
                full_refund_hours_before: 72
                partial_refund_pct_bp: 5000
                renter_cancel_penalty_points: 2
                owner_cancel_penalty_points: 6
                owner_cancel_fee_bp: 1000
              as: PlatformAdmin
              captures: { policy_id: "$.data.id" }
            - &c_qual_dr
              call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter_id}"
                check_type: "DRIVING_RECORD"
                result: "CLEAR"
                violation_points: 2
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
            - &c_qual_tow
              call: "POST /rv-marketplace/renter-qualifications"
              payload:
                renter_id: "${renter_id}"
                check_type: "TOWING_EXPERIENCE"
                result: "VERIFIED_BASIC"
                violation_points: 0
                checked_at: "2026-07-01T00:00:00Z"
                expires_on: "2027-07-01"
              as: PlatformAdmin
            - &c_listing
              call: "POST /rv-marketplace/listings"
              payload:
                owner_id: "${owner_id}"
                nickname: "Ponderosa 30BH"
                vehicle_class: "TRAVEL_TRAILER"
                gvwr_lbs: 8500
                length_ft: 30
                base_nightly_rate_cents: 21533
                included_miles_per_night: 100
                mileage_overage_rate_cents_per_mile: 65
                included_generator_hours_per_night: 3.0
                generator_overage_rate_cents_per_hour: 425
                min_renter_age: 25
                delivery_offered: true
                delivery_base_fee_cents: 12000
                delivery_per_mile_cents: 350
              as: Owner
              as_user_id: "${owner_id}"
              captures: { listing_id: "$.data.id", listing_v: "$.data.version" }
            - &c_doc_title
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "TITLE"
                expires_on: "2028-01-01"
                image_ref: "s3://docs/title-1.pdf"
                expected_listing_version: "${listing_v}"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_title_id: "$.data.id" }
            - &c_doc_reg
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "REGISTRATION"
                expires_on: "2027-06-30"
                image_ref: "s3://docs/reg-1.pdf"
                expected_listing_version: "${listing_v} + 1"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_reg_id: "$.data.id" }
            - &c_doc_ins
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSURANCE_POLICY"
                expires_on: "2027-03-31"
                image_ref: "s3://docs/ins-1.pdf"
                expected_listing_version: "${listing_v} + 2"
              as: Owner
              as_user_id: "${owner_id}"
              captures: { doc_ins_id: "$.data.id" }
            - &c_insp_front
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "EXTERIOR_FRONT"
                image_ref: "s3://insp/front.jpg"
                expected_listing_version: "${listing_v} + 3"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_insp_rear
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "EXTERIOR_REAR"
                image_ref: "s3://insp/rear.jpg"
                expected_listing_version: "${listing_v} + 4"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_insp_interior
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "INTERIOR"
                image_ref: "s3://insp/interior.jpg"
                expected_listing_version: "${listing_v} + 5"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_insp_roof
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "ROOF"
                image_ref: "s3://insp/roof.jpg"
                expected_listing_version: "${listing_v} + 6"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_insp_under
              call: "POST /rv-marketplace/vehicle-documents"
              payload:
                listing_id: "${listing_id}"
                doc_type: "INSPECTION_PHOTO"
                zone: "UNDERCARRIAGE"
                image_ref: "s3://insp/under.jpg"
                expected_listing_version: "${listing_v} + 7"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_verify_title
              call: "POST /rv-marketplace/vehicle-documents/${doc_title_id}/verify"
              as: PlatformAdmin
            - &c_verify_reg
              call: "POST /rv-marketplace/vehicle-documents/${doc_reg_id}/verify"
              as: PlatformAdmin
            - &c_verify_ins
              call: "POST /rv-marketplace/vehicle-documents/${doc_ins_id}/verify"
              as: PlatformAdmin
            - &c_submit
              call: "POST /rv-marketplace/listings/${listing_id}/submit-for-review"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_list_approve
              call: "POST /rv-marketplace/listings/${listing_id}/decision"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - &c_fund
              call: "POST /rv-marketplace/renters/${renter_id}/wallet-adjustments"
              payload: { amount_cents_delta: 800000, reason: "initial wallet top-up" }
              as: PlatformAdmin
            - &c_booking
              call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "PICKUP"
                declared_miles: 380
                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: "$.data.id", booking_v: "$.data.version" }
            - &c_bk_approve
              call: "POST /rv-marketplace/bookings/${booking_id}/approve"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_bk_confirm
              call: "POST /rv-marketplace/bookings/${booking_id}/confirm"
              as: Renter
              as_user_id: "${renter_id}"
            - &c_read_pre
              call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "PRE_TRIP"
                odometer_miles: 42000
                generator_hours: 120.0
                recorded_at: "2026-08-29T15:00:00Z"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_tp_pre_front
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "EXTERIOR_FRONT", damage_flagged: false, image_ref: "s3://trip/pre-front.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - &c_tp_pre_rear
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "EXTERIOR_REAR", damage_flagged: false, image_ref: "s3://trip/pre-rear.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - &c_tp_pre_interior
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "INTERIOR", damage_flagged: false, image_ref: "s3://trip/pre-interior.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - &c_tp_pre_roof
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "ROOF", damage_flagged: false, image_ref: "s3://trip/pre-roof.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - &c_tp_pre_under
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "PRE_TRIP", zone: "UNDERCARRIAGE", damage_flagged: false, image_ref: "s3://trip/pre-under.jpg" }
              as: Owner
              as_user_id: "${owner_id}"
            - &c_bk_start
              call: "POST /rv-marketplace/bookings/${booking_id}/start"
              as: Owner
              as_user_id: "${owner_id}"
            - &c_read_mid
              call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "MID_TRIP"
                odometer_miles: 42260
                generator_hours: 130.5
                recorded_at: "2026-08-31T15:00:00Z"
              as: Renter
              as_user_id: "${renter_id}"
            - &c_read_post
              call: "POST /rv-marketplace/meter-readings"
              payload:
                booking_id: "${booking_id}"
                reading_type: "POST_TRIP"
                odometer_miles: 42400
                generator_hours: 132.0
                recorded_at: "2026-09-02T11:00:00Z"
              as: Renter
              as_user_id: "${renter_id}"
            - &c_tp_post_front
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "POST_TRIP", zone: "EXTERIOR_FRONT", damage_flagged: false, image_ref: "s3://trip/post-front.jpg" }
              as: Renter
              as_user_id: "${renter_id}"
            - &c_tp_post_rear
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "POST_TRIP", zone: "EXTERIOR_REAR", damage_flagged: true, image_ref: "s3://trip/post-rear.jpg" }
              as: Renter
              as_user_id: "${renter_id}"
            - &c_tp_post_interior
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "POST_TRIP", zone: "INTERIOR", damage_flagged: false, image_ref: "s3://trip/post-interior.jpg" }
              as: Renter
              as_user_id: "${renter_id}"
            - &c_tp_post_roof
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "POST_TRIP", zone: "ROOF", damage_flagged: false, image_ref: "s3://trip/post-roof.jpg" }
              as: Renter
              as_user_id: "${renter_id}"
            - &c_tp_post_under
              call: "POST /rv-marketplace/trip-photos"
              payload: { booking_id: "${booking_id}", phase: "POST_TRIP", zone: "UNDERCARRIAGE", damage_flagged: false, image_ref: "s3://trip/post-under.jpg" }
              as: Renter
              as_user_id: "${renter_id}"
          trigger:
            - &c_bk_return
              call: "POST /rv-marketplace/bookings/${booking_id}/return"
              as: Owner
              as_user_id: "${owner_id}"
          assert:
            - "response 200"
            - "data.final_overage_cents == 5813"
            - "data.trip_total_overage_cents == 0"
            - "data.late_return_fee_cents == 0"
            - "data.final_total_cents == 151876"
            - "data.balance_due_cents == 5813"
            - "data.trip_status == 'RETURNED'"
            - "data.settlement_status == 'RECONCILING'"

      - name: driving_record_rolling_36m_gate_vs_most_recent_only_snapshot
        grounds: >-
          §1.3 renter_driving_record_points: ROLLING_36M sums violation_points
          over every DRIVING_RECORD check whose checked_at falls in the 36-month
          window ending at the logical clock and feeds
          Renter.driving_record_points and the priority-18 gate;
          MOST_RECENT_ONLY reads only the newest check by checked_at DESC and
          freezes Booking.renter_record_points_snapshot at creation.
        distinguishing_aspect: >-
          Unlike the metered_overage instance, which diverges because of how one
          input set is PARTITIONED, this pair diverges because of how the input
          set is FILTERED: three 2-point checks dated 2024-09-01, 2025-06-01 and
          2026-07-01 all sit inside the window starting 2023-08-01, so
          ROLLING_36M reports 6 while MOST_RECENT_ONLY reports 2. The booking is
          admitted because 6 is exactly at MAX_RECORD_POINTS, yet the number
          frozen on the booking is 2 — an implementation that writes the gate
          value into the snapshot records 6, and one that gates on the snapshot
          admits renters who should be blocked at 7 points.
        test_recipe:
          setup: >-
            Canonical marketplace and LISTED listing, but the renter carries
            three separate DRIVING_RECORD checks (2 points each, results CLEAR,
            MINOR, CLEAR, all unexpired past the booking end_date) plus the
            VERIFIED_BASIC towing check. Read the renter back before booking so
            the aggregate is observed independently of the snapshot.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - call: "POST /rv-marketplace/renter-qualifications"
              payload: { renter_id: "${renter_id}", check_type: "DRIVING_RECORD", result: "CLEAR", violation_points: 2, checked_at: "2024-09-01T00:00:00Z", expires_on: "2027-07-01" }
              as: PlatformAdmin
            - call: "POST /rv-marketplace/renter-qualifications"
              payload: { renter_id: "${renter_id}", check_type: "DRIVING_RECORD", result: "MINOR", violation_points: 2, checked_at: "2025-06-01T00:00:00Z", expires_on: "2027-07-01" }
              as: PlatformAdmin
            - call: "POST /rv-marketplace/renter-qualifications"
              payload: { renter_id: "${renter_id}", check_type: "DRIVING_RECORD", result: "CLEAR", violation_points: 2, checked_at: "2026-07-01T00:00:00Z", expires_on: "2027-07-01" }
              as: PlatformAdmin
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - call: "GET /rv-marketplace/renters/${renter_id}"
              as: PlatformAdmin
          trigger:
            - *c_booking
          assert:
            - "response 201"
            - "the preceding GET /rv-marketplace/renters/${renter_id} returned data.driving_record_points == 6 (ROLLING_36M sum of 2 + 2 + 2)"
            - "the preceding GET /rv-marketplace/renters/${renter_id} returned data.driving_record_status == 'CLEAR' (latest check by checked_at DESC)"
            - "data.renter_record_points_snapshot == 2 (MOST_RECENT_ONLY)"
            - "data.trip_status == 'REQUESTED'"
            - "data.settlement_status == 'NONE'"
            - "data.base_subtotal_cents == 110896"
            - "data.premium_cents == 24951"
            - "data.quoted_total_cents == 146063"

      - name: variant_switch_from_declared_estimate_to_segment_wise_yields_refund
        grounds: >-
          §1.3 metered_overage third clause: at confirm the TRIP_TOTAL shape is
          applied to Booking.declared_miles / declared_generator_hours to
          produce estimated_overage_cents, which enters quoted_total_cents and
          therefore hold_amount_cents; at return the SEGMENT_WISE variant
          replaces it and §1.3 final_trip_total recomputes balance_due_cents.
        distinguishing_aspect: >-
          This is the reconciliation direction the other two instances never
          exercise: the provisional variant OVERSTATES the actual charge, so the
          delta is negative. Declared 520 miles / 16.0 hours give
          estimated_overage_cents = 120*65 + 4.0*425 = 9500 and hold 155563,
          while the metered readings bill only 5813, so balance_due_cents is
          -3687 — a refund owed. An implementation that clamps balance_due at 0,
          or that keeps billing the declared estimate after return, cannot
          produce -3687.
        test_recipe:
          setup: >-
            Identical to the canonical chain except that booking B1 declares 520
            miles and 16.0 generator hours, and the same three meter readings are
            recorded, so the only thing that changes between the two variants is
            which number is authoritative.
          setup_api_calls:
            - *c_clock
            - *c_owner
            - *c_renter
            - *c_season_peak
            - *c_season_shoulder
            - *c_season_off
            - *c_plan_std
            - *c_policy_mod
            - *c_qual_dr
            - *c_qual_tow
            - *c_listing
            - *c_doc_title
            - *c_doc_reg
            - *c_doc_ins
            - *c_insp_front
            - *c_insp_rear
            - *c_insp_interior
            - *c_insp_roof
            - *c_insp_under
            - *c_verify_title
            - *c_verify_reg
            - *c_verify_ins
            - *c_submit
            - *c_list_approve
            - *c_fund
            - &c_booking_hi_declared
              call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "PICKUP"
                declared_miles: 520
                declared_generator_hours: 16.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { booking_id: "$.data.id", booking_v: "$.data.version" }
            - *c_bk_approve
            - *c_bk_confirm
            - *c_read_pre
