            - call: "POST /market-submissions/${ms_e}/quotes"
              payload: { offered_line_pct: 40.0000, quoted_rate_pct: 8.5000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: false }
              as: ReinsurerUnderwriter
