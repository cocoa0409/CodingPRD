          - validations.priority_12_ERR_FUNDING_CLASS_MISMATCH
          - errors[ERR_MENTOR_NOT_FOUND]
        distinguishing_aspect: "The class-pairing check at priority 12 cannot run until the award row is loaded, so existence at priority 3 must resolve first and in declaration order: with both mentor_id and funding_source_id unknown the answer is ERR_MENTOR_NOT_FOUND (mentor_id is declared first), with only funding_source_id unknown it is ERR_FUNDING_SOURCE_NOT_FOUND, and only once both resolve does the same FELLOWSHIP-on-a-federal-grant body finally report ERR_FUNDING_CLASS_MISMATCH."
