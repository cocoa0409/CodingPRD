              as: TalentBuyer
              captures: { df_vn_id: $.data.id }
          trigger:
            - call: "POST /artists"
              payload: { name: "Default Act", agency: "Def Talent", tier: "CLUB", historical_sellthrough_pct: 55.00 }
              as: TalentBuyer
              captures: { df_ar_id: $.data.id, df_ar_withholding: $.data.withholding_pct, df_ar_count: $.data.confirmed_show_count }
            - call: "POST /shows"
              payload: { artist_id: "${df_ar_id}", venue_id: "${df_vn_id}", event_at: "2026-11-12T02:00:00.000Z", load_in_at: "2026-11-11T14:00:00.000Z", load_out_at: "2026-11-12T08:00:00.000Z", announce_at: "2026-08-18T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 90000 }
              as: TalentBuyer
              captures: { df_sh_id: $.data.id, df_sh_v: $.data.version, df_sh_resched: $.data.rescheduled_from_show_id, df_sh_prod_pct: $.data.venue_expense_pct_production, df_sh_copro: $.data.copromote_venue_share_pct }
            - call: "POST /offers"
              payload: { show_id: "${df_sh_id}", expected_show_version: "${df_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1500000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { df_of_id: $.data.id, df_of_versus: $.data.versus_pct, df_of_backend: $.data.backend_split_artist_pct, df_of_status: $.data.status, df_of_round: $.data.round_index, df_of_expires: $.data.expires_at, df_of_counter_note: $.data.counter_note }
            - call: "POST /budget-lines"
              payload: { show_id: "${df_sh_id}", category: "PRODUCTION", description: "Stage package", budgeted_cents: 400000 }
              as: TourAccountant
              captures: { df_bl_id: $.data.id, df_bl_deductible: $.data.is_artist_deductible, df_bl_status: $.data.status, df_bl_vstatus: $.data.variance_status, df_bl_approver: $.data.required_approver_role, df_bl_cap: $.data.approved_cap_cents }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${df_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 600 }
              as: TalentBuyer
              captures: { df_tt_id: $.data.id, df_tt_status: $.data.status, df_tt_revisions: $.data.price_revision_count, df_tt_last_price: $.data.last_price_cents, df_tt_available: $.data.available_qty }
            - call: "POST /ticket-holds"
              payload: { ticket_tier_id: "${df_tt_id}", kind: "PRODUCTION_HOLD", qty: 20, holder: "Front of house mix" }
              as: TalentBuyer
              captures: { df_th_id: $.data.id, df_th_expires: $.data.expires_at, df_th_status: $.data.status, df_th_released_by: $.data.released_by_user_id }
          assert:
            - "NUMERIC ZERO — ${df_ar_withholding} == 0 (not null), ${df_ar_count} == 0"
            - "PERCENT ZEROS ON A RENTAL SHOW — ${df_sh_prod_pct} == 0 and ${df_sh_copro} == 0; the other three venue_expense_pct_* fields are likewise 0"
            - "EXPLICIT NULL — ${df_sh_resched} == null, ${df_of_expires} == null (no submit yet), ${df_of_counter_note} == null, ${df_bl_cap} == null, ${df_bl_approver} == null, ${df_tt_last_price} == null, ${df_th_expires} == null, ${df_th_released_by} == null"
            - "ZERO NOT NULL — ${df_of_versus} == 0 and ${df_of_backend} == 0 even though this is a FLAT_GUARANTEE deal where neither applies"
            - "BOOLEAN FALSE — ${df_bl_deductible} == false (not null, not 0)"
            - "INITIAL ENUMS — ${df_of_status} == DRAFT, ${df_of_round} == 1, ${df_bl_status} == ACTIVE, ${df_bl_vstatus} == WITHIN_TOLERANCE, ${df_tt_status} == DRAFT, ${df_th_status} == HELD"
            - "DERIVED-FROM-DEFAULT — ${df_tt_revisions} == 0 and ${df_tt_available} == 580 (600 allocation less the 20 held), proving available_qty is computed and not defaulted to allocation_qty"

      - name: client_supplied_computed_money_fields_are_ignored_input
        claim_type: Computed Fields
        grounds:
          - "entities.Market.committed_guarantee_cents"
          - "entities.Show.adjusted_gross_cents"
          - "entities.TicketTier.sold_qty"
          - "entities.BudgetLine.actual_cents"
        distinguishing_aspect: |
          Computed fields are not writable even when the client names them exactly. Each probe supplies
          a poisoned value for a field with `source: computed` that is NOT in the endpoint's declared
          input list; the create still succeeds and the computed field sits at its own derived value.
          An implementation that blindly spreads the request body into the row fails every assert.
        test_recipe:
          setup:
            - "Only the clock; every row in this instance is created by the trigger calls."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
          trigger:
            - call: "POST /markets"
              payload: { name: "Poison Market", region_code: "PSN", guarantee_exposure_limit_cents: 4000000, committed_guarantee_cents: 3999999, at_risk_guarantee_cents: 12345, exposure_utilization_pct: 99.99, risk_posture: "FROZEN", settled_show_count: 77, performance_index: 250 }
              as: RiskOfficer
              captures: { ci_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Poison Act", agency: "Psn Talent", tier: "ARENA", historical_sellthrough_pct: 80.00, withholding_pct: 10.00, confirmed_show_count: 42 }
