            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
            - *c_rts1
            - *c_getv1
            - *c_safe
            - *c_curb_ok
            - call: "POST /fleet/territories/${t_id}/ride-requests"
              payload: { rider_name: "Rider One", sub_service_type: "STANDARD", idempotency_key: "idem-ret-2" }
              as: FleetOperations
              captures: { r1_id: $.data.id }
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/match"
              payload: { pickup_location_id: "${pl_id}", expected_vehicle_version: "${occ_token}" }
              as: FleetOperations
            - call: "POST /fleet/territories/${t_id}/ride-requests/${r1_id}/assistance-sessions"
              payload: { reason: "ROAD_BLOCKED" }
              as: RemoteAssistanceOperator
              captures: { s1_id: $.data.id }
            - call: "POST /fleet/assistance-sessions/${s1_id}/acknowledge"
              payload: {}
              as: RemoteAssistanceOperator
          trigger:
            - call: "POST /fleet/ride-requests/${r1_id}/film-incident"
              payload: { severity: "MODERATE", description: "Low-speed contact with curb furniture" }
              as: SafetyReviewer
              captures: { i1_id: $.data.id }
          assert:
            - "IncidentReport.${i1_id}.crash_evidence_retained == true"
            - "IncidentReport.${i1_id}.retention_expires_at == 2027-06-01T00:00:00Z"

      - name: if_match_credit_per_ride_literal_open_territory
        claim_type: Correct Result
