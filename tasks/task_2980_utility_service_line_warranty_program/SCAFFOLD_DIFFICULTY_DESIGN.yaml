  - rule_id: resource_temporal_overlap
    instances:

      - name: contractor_visit_windows_collide_across_the_travel_buffer
        grounds:
          - calculations.contractor_visit_window_conflict
          - validations.contractor-window-free
          - errors.ERR_CONTRACTOR_WINDOW_CONFLICT
          - entities.Dispatch.fields.window_start
          - entities.Dispatch.fields.window_end
          - endpoints.POST /claims/{claimId}/dispatches
        distinguishing_aspect: |
          The contended resource is a contractor's CALENDAR, and the overlap test is not plain interval
          intersection: the half-open candidate interval is expanded by TRAVEL_BUFFER_MINUTES 45 on BOTH ends,
          so two windows that merely touch still collide. The test walks the exact buffer edge at
          MINUTE resolution - 13:44 is refused, 13:45 is admitted - and then proves the mirror image by
          showing that a window ENDING 45 minutes before the existing one starts is also refused, which a
          one-sided implementation lets through.
