        distinguishing_aspect: "The instantaneous per-permit threshold is evaluated on the collective figure before contingency, with a >= comparison: 4 workers at 3.00 hours in a 25 mrem/hr field give exactly 300.00 and set the flag, while 2.99 hours give 299.00 and leave it clear. One hundredth of an hour separates the two permits."
