            - "first response HTTP status is 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "after the denial: EnforcementCase.${case_id}.case_status == ADJUDICATED_UPHELD, penalty_status == ASSESSED, penalty_cents == 19320 and vacate_reason == null"
            - "second response HTTP status is 201 with case_status == VACATED and penalty_status == VACATED"
            - "second response: penalty_cents == 19320 unchanged and vacate_reason == Evidence retracted on appeal"
            - "EnforcementCase.${case_id}.adjudicated_by_user_id == admin-2, so adjudication and vacate are held by different user ids"
            - "Manufacturer.${mfr_id}.outstanding_penalty_cents == 0, vacated_penalty_cents == 19320, total_assessed_penalty_cents == 19320, upheld_case_count == 0 and standing == GOOD"

