      - name: corner_expiry_cascade_closes_parts_and_releases_storage
        claim_type: cascade_down
        grounds:
          - state_machines[BuildersRiskPolicy].IN_FORCE->EXPIRED
          - state_machines[CoveragePart].ACTIVE->CLOSED
          - state_machines[TemporaryStorageAssignment].APPROVED->RELEASED
        excluded_because:
          difficulty_instance: transitive_cascade / clock_expiry_cascades_policy_parts_storage_and_facility
          rationale: "The four-hop clock-driven expiry cascade, including the CoveragePart closure and the POLICY_EXPIRY release, is the asserted body of that §1.8 instance."

      - name: corner_final_payment_bubbles_the_claim_from_settled_to_closed
        claim_type: bubble_up
        grounds:
          - state_machines[Claim].SETTLED->CLOSED
          - state_machines[Claim].UNPAID->PAID
        excluded_because:
          difficulty_instance: transitive_cascade / loss_payment_cascades_erosion_reserve_and_closure
          rationale: "That §1.8 instance asserts the payment-driven SETTLED -> CLOSED derivation as its final cascade hop."

      - name: corner_payment_erodes_the_matching_coverage_part_and_policy_total
        claim_type: cross_entity
        grounds:
          - entities.CoveragePart.eroded_cents
          - entities.BuildersRiskPolicy.eroded_total_cents
          - calculations.coverage_erosion_reconciliation
        excluded_because:
          difficulty_instance: transitive_cascade / loss_payment_cascades_erosion_reserve_and_closure
          rationale: "The A-changes-so-B-adjusts hop from LossPayment to CoveragePart.eroded_cents and policy.eroded_total_cents is asserted there."

      - name: corner_extension_approval_appends_the_ap_row_and_moves_written_premium
        claim_type: ledger_sync
        grounds:
          - state_machines[ExtensionEndorsement].REQUESTED->APPROVED.side_effects
          - calculations.premium_ledger_balance
        excluded_because:
          difficulty_instance: compensating_invariant / extension_rescission_conserves_the_premium_ledger_balance
          rationale: "That §1.8 instance walks written_premium_cents against the ledger before and after the AP row is appended."

      - name: corner_void_reverses_every_original_payment_side_effect
        claim_type: compensation
        grounds:
          - state_machines[Claim].PAID->UNPAID.side_effects
          - entities.LossPayment.status
        excluded_because:
          difficulty_instance: compensating_invariant / payment_void_conserves_erosion_and_reserve_across_a_multi_part_claim
