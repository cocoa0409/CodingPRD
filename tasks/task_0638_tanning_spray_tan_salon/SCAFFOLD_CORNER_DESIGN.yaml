# =============================================================================
# Task 0638 — §1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Names are unique across §1.8 and §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_returns_201_pending
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with full_name, date_of_birth, skin_type, plan_id returns 201 with status=PENDING, billing_status=CURRENT, account_credit_cents=0, completed_uv_session_count=0."
        test_recipe:
          setup:
            - "One MembershipPlan exists."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "New Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id, st: $.data.status }
          assert:
            - "response.http_status == 201"
            - "Member.${m_id}.status == PENDING"
            - "Member.${m_id}.billing_status == CURRENT"
            - "Member.${m_id}.account_credit_cents == 0"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 404"
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"

      - name: create_session_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Session, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /sessions missing requested_seconds returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Plan, equipment, and an ACTIVE member exist."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Req bed", kind: "BED", max_exposure_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Req Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
          trigger:
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "WALK_IN", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z" }
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: equipment_default_turnaround_applied
        claim_type: Defaults
        grounds: [entities.Equipment.fields.turnaround_seconds]
        distinguishing_aspect: "POST /equipment omitting turnaround_seconds yields the default 600 on the created Equipment."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /equipment"
              payload: { name: "Default bed", kind: "BOOTH", max_exposure_seconds: 480 }
              as: SalonManager
              captures: { eq_id: $.data.id, turn: $.data.turnaround_seconds }
          assert:
            - "Equipment.${eq_id}.turnaround_seconds == 600"
            - "Equipment.${eq_id}.status == AVAILABLE"

      - name: spray_room_default_ventilation_applied
        claim_type: Defaults
        grounds: [entities.SprayRoom.fields.ventilation_buffer_seconds]
        distinguishing_aspect: "POST /spray-rooms omitting ventilation_buffer_seconds yields the default 300."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /spray-rooms"
              payload: { name: "Default room" }
              as: SalonManager
              captures: { room_id: $.data.id, vent: $.data.ventilation_buffer_seconds }
          assert:
            - "SprayRoom.${room_id}.ventilation_buffer_seconds == 300"
            - "SprayRoom.${room_id}.status == AVAILABLE"

      - name: session_end_at_computed_from_inputs
        claim_type: Computed Fields
        grounds: [entities.Session.fields.end_at, entities.Session.fields.requested_seconds]
        distinguishing_aspect: "Session.end_at is computed as start_at + requested_seconds; a SPRAY session reserved at 11:00:00Z for 300s has end_at 11:05:00Z."
        test_recipe:
          setup:
            - "Plan UNLIMITED includes_spray, spray room, ACTIVE member."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0, includes_spray: true }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /spray-rooms"
              payload: { name: "EndAt room" }
              as: SalonManager
              captures: { room_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "EndAt Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
          trigger:
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "SPRAY", booking_mode: "RESERVATION", spray_room_id: "${room_id}", start_at: "2026-06-15T11:00:00Z", requested_seconds: 300 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, end: $.data.end_at }
          assert:
            - "Session.${s_id}.end_at == 2026-06-15T11:05:00Z"
            - "Session.${s_id}.status == RESERVED"

      - name: member_id_input_ignored_system_minted
        claim_type: System Fields
        grounds: [entities.Member.fields.id]
        distinguishing_aspect: "POST /members does not accept an id field; the server mints a UUID without a type prefix and id is ignored if supplied."
        test_recipe:
          setup: ["One plan exists."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { full_name: "Sys Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id, v: $.data.version }
          assert:
            - "Member.${m_id}.version == 1"
            - "response.http_status == 201"

      - name: list_members_pagination_envelope
        claim_type: Listing
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "GET /members returns a paginated array envelope with total_count and has_more fields."
        test_recipe:
          setup: ["One plan, one member exist."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "List Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
          trigger:
            - call: "GET /members"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "response.response_type == array"
            - "response.meta.total_count >= 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_session_from_reserved_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Session.IN_PROGRESS_to_COMPLETED, "errors[ERR_SESSION_NOT_IN_PROGRESS]"]
        distinguishing_aspect: "POST /sessions/{id}/complete on a RESERVED (never-started) session fails with ERR_SESSION_NOT_IN_PROGRESS (409); no equipment/dose side effects fire."
        test_recipe:
          setup:
            - "ACTIVE member with a RESERVED UV session that has not been started."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Inv bed", kind: "BED", max_exposure_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Inv Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /sessions/${s_id}/complete"
              payload: {}
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_SESSION_NOT_IN_PROGRESS"
            - "Equipment.${eq_id}.sessions_since_service == 0"

      - name: cancel_already_cancelled_member_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Member.ACTIVE_to_CANCELLED, "errors[ERR_MEMBER_ALREADY_CANCELLED]"]
        distinguishing_aspect: "A second POST /members/{id}/cancel on a CANCELLED member fails with ERR_MEMBER_ALREADY_CANCELLED (409); CANCELLED is terminal."
        test_recipe:
          setup:
            - "ACTIVE member already cancelled once."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Cancel Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_act: $.data.version }
            - call: "POST /members/${m_id}/cancel"
              payload: { expected_member_version: "${v_act}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_cancel: $.data.version }
          trigger:
            - call: "POST /members/${m_id}/cancel"
              payload: { expected_member_version: "${v_cancel}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_MEMBER_ALREADY_CANCELLED"

      - name: freeze_blocked_by_open_session
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.ACTIVE_to_FROZEN, "errors[ERR_OPEN_SESSION_EXISTS]"]
        distinguishing_aspect: "POST /members/{id}/freeze fails with ERR_OPEN_SESSION_EXISTS (409) when the member has a RESERVED session; no credit is minted."
        test_recipe:
          setup:
            - "ACTIVE member with an open RESERVED UV session."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Open bed", kind: "BED", max_exposure_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Open Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_act: $.data.version }
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /members/${m_id}/freeze"
              payload: { expected_member_version: "${v_act}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_OPEN_SESSION_EXISTS"
            - "Member.${m_id}.account_credit_cents == 0"

      - name: activate_without_dues_returns_dues_not_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Member.PENDING_to_ACTIVE, "errors[ERR_DUES_NOT_PAID]"]
        distinguishing_aspect: "POST /members/{id}/activate without a SUCCEEDED first EFT_DUES payment fails with ERR_DUES_NOT_PAID (409); member stays PENDING."
        test_recipe:
          setup:
            - "PENDING member with NO first-dues charge."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Unpaid Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_DUES_NOT_PAID"
            - "Member.${m_id}.status == PENDING"

      - name: no_show_too_early_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.Session.RESERVED_to_NO_SHOW, "errors[ERR_TOO_EARLY_FOR_NO_SHOW]"]
        distinguishing_aspect: "POST /sessions/{id}/no-show before clock_now reaches start_at fails with ERR_TOO_EARLY_FOR_NO_SHOW (409)."
        test_recipe:
          setup:
            - "ACTIVE member with a future RESERVED UV session; clock is before start_at."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "Early bed", kind: "BED", max_exposure_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "Early Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-01T12:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /sessions/${s_id}/no-show"
              payload: {}
              as: FrontDeskStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_TOO_EARLY_FOR_NO_SHOW"

      - name: service_equipment_not_in_maintenance_returns_error
        claim_type: Invalid Transitions
        grounds: [state_machines.Equipment.MAINTENANCE_to_AVAILABLE, "errors[ERR_EQUIPMENT_NOT_IN_MAINTENANCE]"]
        distinguishing_aspect: "POST /equipment/{id}/service on an AVAILABLE unit fails with ERR_EQUIPMENT_NOT_IN_MAINTENANCE (409)."
        test_recipe:
          setup: ["One AVAILABLE equipment unit."]
          setup_api_calls:
            - call: "POST /equipment"
              payload: { name: "NotMaint bed", kind: "BED", max_exposure_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
          trigger:
            - call: "POST /equipment/${eq_id}/service"
              payload: { reason: "MANUAL" }
              as: SalonManager
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_EQUIPMENT_NOT_IN_MAINTENANCE"

      - name: unfreeze_non_frozen_member_returns_error
        claim_type: Invalid Transitions
        grounds: [state_machines.Member.FROZEN_to_ACTIVE, "errors[ERR_MEMBER_NOT_FROZEN]"]
        distinguishing_aspect: "POST /members/{id}/unfreeze on an ACTIVE (not frozen) member fails with ERR_MEMBER_NOT_FROZEN (409)."
        test_recipe:
          setup: ["ACTIVE member, never frozen."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "BASIC", monthly_fee_cents: 3000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "NotFrozen Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
              captures: { v_act: $.data.version }
          trigger:
            - call: "POST /members/${m_id}/unfreeze"
              payload: { expected_member_version: "${v_act}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_MEMBER_NOT_FROZEN"

      - name: retire_equipment_in_use_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.Equipment.AVAILABLE_to_RETIRED, "errors[ERR_EQUIPMENT_IN_USE]"]
        distinguishing_aspect: "POST /equipment/{id}/retire fails with ERR_EQUIPMENT_IN_USE (409) when the unit is IN_USE because a session is IN_PROGRESS."
        test_recipe:
          setup:
            - "ACTIVE member with an IN_PROGRESS UV session, making its equipment IN_USE."
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier_code: "UNLIMITED", monthly_fee_cents: 6000, weekly_uv_session_cap: 0 }
              as: SalonManager
              captures: { plan_id: $.data.id }
            - call: "POST /equipment"
              payload: { name: "InUse bed", kind: "BED", max_exposure_seconds: 600 }
              as: SalonManager
              captures: { eq_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: BillingSystem
            - call: "POST /members"
              payload: { full_name: "InUse Member", date_of_birth: "1990-01-01T00:00:00Z", skin_type: "IV", plan_id: "${plan_id}" }
              as: FrontDeskStaff
              captures: { m_id: $.data.id }
            - call: "POST /_billing/charge-first-dues"
              payload: { member_id: "${m_id}", outcome: "SUCCEEDED" }
              as: BillingSystem
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: BillingSystem
            - call: "POST /sessions"
              payload: { member_id: "${m_id}", kind: "UV", booking_mode: "RESERVATION", equipment_id: "${eq_id}", start_at: "2026-06-01T10:00:00Z", requested_seconds: 120 }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
            - call: "POST /sessions/${s_id}/start"
              payload: {}
              as: FrontDeskStaff
          trigger:
            - call: "POST /equipment/${eq_id}/retire"
              payload: {}
              as: SalonManager
              captures: { err: $.data.error_id }
          assert:
            - "response.http_status == 409"
            - "response.data.error_id == ERR_EQUIPMENT_IN_USE"

      - name: equipment_service_resets_counter_and_logs
        claim_type: Side Effect Execution
        grounds: [state_machines.Equipment.MAINTENANCE_to_AVAILABLE, entities.MaintenanceLog]
        distinguishing_aspect: "Servicing a MAINTENANCE unit creates a MaintenanceLog with sessions_at_service=2 and resets Equipment.sessions_since_service to 0, status AVAILABLE."
        test_recipe:
          setup:
