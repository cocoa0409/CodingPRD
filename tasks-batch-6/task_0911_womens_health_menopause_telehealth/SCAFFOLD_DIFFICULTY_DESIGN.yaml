  - rule_id: cross_entity_state_dependency
    instances:
      - name: refill_approval_requires_lab_reviewed_normal
        grounds:
          - state_machines.Refill.REQUESTED_to_APPROVED
          - state_machines.LabOrder.PENDING_to_REVIEWED
          - errors[ERR_LAB_REQUIRED_BEFORE_REFILL]
        distinguishing_aspect: "Refill<->LabOrder pair: a refill's approve transition is blocked while the LabOrder is PENDING (ERR_LAB_REQUIRED_BEFORE_REFILL) and succeeds only once the LabOrder is REVIEWED with result NORMAL — the prescription stays ACTIVE throughout so state does not mask it."
