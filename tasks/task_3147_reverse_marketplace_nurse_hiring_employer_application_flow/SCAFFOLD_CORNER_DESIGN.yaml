          rationale: "ERR_NURSE_HAS_LIVE_APPLICATIONS is triggered in §1.9 state-machine instance nurse_deactivate_blocked_with_live_applications."

  # ===========================================================================
  - section: roles
    instances:

      - name: platform_admin_cannot_perform_employer_exclusive_operations
        claim_type: role_exclusive_operations
        grounds:
          - roles.PlatformAdmin
          - roles.Employer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Peer-role separation: PlatformAdmin (opaque identity) cannot pause a requisition — that operation is Employer-exclusive and ownership-scoped — even though PlatformAdmin can read everything and run screening transitions."
        test_recipe:
          setup:
            - "Employer with an OPEN requisition."
          setup_api_calls:
            - *k_clock
            - *k_emp
            - *k_req
          trigger:
            - call: "POST /marketplace/requisitions/${req_id}/pause"
              payload: {}
              as: PlatformAdmin
              captures: { err_pa: $.data.error_id }
          assert:
            - "err_pa == ERR_FORBIDDEN"
            - "Requisition.${req_id}.status remains OPEN"

      - name: employer_cannot_verify_licenses_or_screenings
        claim_type: role_exclusive_operations
        grounds:
          - roles.Employer
          - roles.PlatformAdmin
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "The reverse direction: an Employer attempting the PlatformAdmin-exclusive license verify and screening clear-background is rejected ERR_FORBIDDEN — credential authority is segregated from hiring authority."
        test_recipe:
          setup:
            - "Nurse PENDING_VERIFICATION with a PENDING license; employer registered."
          setup_api_calls:
