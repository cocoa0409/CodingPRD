        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_TEMP_RANGE]"]
        distinguishing_aspect: "Freezer create with min_celsius >= max_celsius fails 400 ERR_INVALID_TEMP_RANGE."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-BAD", min_celsius: -50.0, max_celsius: -60.0, nominal_capacity: 10 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_TEMP_RANGE"

      - name: error_invalid_window_three_surfaces
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "The window-sanity rule fires identically on implant cases (end <= start), supplier documents (valid_to < valid_from), and recalls (received_window_end < start)."
        test_recipe:
          setup: ["supplier exists (for the document surface)"]
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
          trigger:
