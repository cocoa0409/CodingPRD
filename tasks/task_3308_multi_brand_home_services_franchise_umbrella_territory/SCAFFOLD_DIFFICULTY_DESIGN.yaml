              call: "POST /franchise/territories"
              payload: { territory_code: "MS-EQ", brand_id: "${ms_brand_id}", household_count: 45000, postal_codes: ["75101", "75102"], expansion_right_households: 45000, protected: true, franchisee_id: "${fr_ms_id}" }
