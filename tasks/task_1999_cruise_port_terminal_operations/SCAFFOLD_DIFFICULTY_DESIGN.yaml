            - { call: "POST /port-ops/port-calls/${pc2}/service-orders", payload: { kind: "PROVISIONING", units: 5, window_start: "2026-08-10T10:00:00Z", window_end: "2026-08-10T12:00:00Z" }, as: VesselAgent, as_user_id: "${ves2}", captures: { so2: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc1}/service-orders", payload: { kind: "WASTE_OFFLOAD", units: 3, window_start: "2026-08-10T13:00:00Z", window_end: "2026-08-10T15:00:00Z" }, as: VesselAgent, as_user_id: "${ves1}", captures: { so3: $.data.id } }
