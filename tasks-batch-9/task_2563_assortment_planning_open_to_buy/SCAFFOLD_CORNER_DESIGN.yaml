            - call: "POST /otb/option-plans"
              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", tier: "GOOD", breadth_target: 10, depth_units_per_option: 8, assumed_unit_cost_cents: 1800 }
              as: MerchandisePlanner
              as_user_id: "planner-1"
              captures: { op_id: $.data.id }
            - call: "PUT /otb/option-plans/${op_id}/size-curve"
              payload: { cells: [ { size_label: "S", size_sort_order: 1, pct_bps: 2500 }, { size_label: "M", size_sort_order: 2, pct_bps: 2500 }, { size_label: "L", size_sort_order: 3, pct_bps: 2500 }, { size_label: "XL", size_sort_order: 4, pct_bps: 2500 } ] }
              as: MerchandisePlanner
              as_user_id: "planner-1"
            - call: "POST /otb/category-plans/${plan_id}/submit"
              payload: { submission_note: "summer patio" }
              as: MerchandisePlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /otb/category-plans/${plan_id}/approve"
              payload: { approval_note: "approve seasonal" }
              as: PlanningDirector
              as_user_id: "director-1"
              captures: { budget: $.data.receipt_budget_cents }
            - call: "GET /otb/option-plans/${op_id}"
