  # =========================================================================
  - section: Endpoints
    instances:

      - name: courthouse_crud_surface_creates_reads_lists_and_patches
        claim_type: Standard CRUD
        grounds: ["endpoints[POST /courthouses]", "endpoints[GET /courthouses/{id}]", "endpoints[GET /courthouses]", "endpoints[PATCH /courthouses/{id}]"]
        distinguishing_aspect: "Courthouse is the one entity with a full create-read-list-update surface: the PATCH is partial (only the supplied keys move), it bumps version, it recomputes available_pay_cents from the new budget, and the list is name-ASC and filterable — while no delete route exists anywhere in the API."
        test_recipe:
          setup:
            - "Two courthouses so the list ordering and the county filter are observable: CH_MAIN (name 'Capitol Main Courthouse', county CAS) and CH_ANNEX (name 'Annex Courthouse', county CAS)."
          setup_api_calls:
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 2, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id", ch_main_v1: "$.data.version", ch_main_avail: "$.data.available_pay_cents", ch_main_status: "$.data.status" }
            - call: "POST /courthouses"
              payload: { name: "Annex Courthouse", county_code: "CAS", courtroom_count: 3, remote_equipment_tier: "NONE", vri_concurrent_capacity: 0, pay_budget_cents: 250000, status: "OPEN" }
              as: ProgramAdmin
              captures: { ch_annex: "$.data.id" }
          trigger:
            - call: "GET /courthouses/${ch_main}"
              payload: {}
              as: FiscalOfficer
              captures: { r_name: "$.data.name", r_cap: "$.data.vri_concurrent_capacity" }
            - call: "GET /courthouses"
              payload: { county_code: "CAS", limit: 10, offset: 0 }
              as: SchedulingCoordinator
            - call: "PATCH /courthouses/${ch_main}"
              payload: { vri_concurrent_capacity: 4, pay_budget_cents: 6000000 }
              as: ProgramAdmin
              captures: { ch_main_v2: "$.data.version", ch_main_avail2: "$.data.available_pay_cents" }
            - call: "GET /courthouses/${ch_main}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "${ch_main_status} == OPEN (the declared default) and ${ch_main_avail} == 5000000 with encumbered_pay_cents == 0 and obligated_pay_cents == 0"
            - "${r_name} == Capitol Main Courthouse and ${r_cap} == 2"
            - "second trigger returns total_count == 2, has_more == false and data[0].name == Annex Courthouse (name ASC), data[1].name == Capitol Main Courthouse"
            - "third trigger returns HTTP 200 with ${ch_main_v2} == ${ch_main_v1} + 1, vri_concurrent_capacity == 4, pay_budget_cents == 6000000 and ${ch_main_avail2} == 6000000"
            - "third trigger leaves remote_equipment_tier == CERTIFIED_VRI, county_code == CAS and courtroom_count == 12 untouched — the PATCH is partial"
            - "fourth trigger returns the patched row, and GET /courthouses?remote_equipment_tier=NONE returns total_count == 1 with data[0].id == ${ch_annex}"

