  - rule_id: compensating_invariant
    instances:

      - name: component_unit_conservation_across_reserve_commit_receipt_preempt_release_and_consume
        grounds:
          - calculations.component_availability
          - calculations.preemption_victim_selector
          - entities.LongLeadComponent.fields.quantity_on_hand
          - entities.LongLeadComponent.fields.quantity_available
          - entities.LongLeadComponent.fields.quantity_consumed
          - state_machines.ComponentAllocation.COMMITTED->RELEASED
          - state_machines.ComponentAllocation.RESERVED->PREEMPTED
        distinguishing_aspect: |
          The conserved quantity S = quantity_on_hand + quantity_consumed is 10 after RESERVE,
          10 after COMMIT (which moves 6 units between quantity_reserved and quantity_committed
          while leaving quantity_available at 4 untouched), 12 after the only operation allowed to
          raise it (a +2 receipt), and still 12 after PREEMPT, after RELEASE and after the
          FAT-PASS CONSUME that moves 6 units from quantity_on_hand to quantity_consumed
          (12 = 6 + 6); the identity quantity_on_hand == available + reserved + committed holds
          after all seven mutations, so any implementation that decrements on_hand at commit or
          forgets to exclude PREEMPTED/RELEASED rows breaks a stated equality.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "EngineeredOrder A = TX-CON-0001 (POWER_TRANSFORMER, rated_kv 12, contract_value_cents 20000000) driven to engineering_status DESIGN_RELEASED so its allocation may be committed."
            - "EngineeredOrder B = TX-CON-0002 (MV_SWITCHGEAR product family), left at ENG_OPEN - it only ever holds the preemption victim, which is never committed."
            - "One Supplier SUP-CON with one LongLeadComponent CON-BSH: quantity_on_hand 10, lead_time_days 20 (penalty tier 0 per unit), allocation_policy PREEMPTIBLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-CON-0001", customer_name: "Summit Grid", product_family: "POWER_TRANSFORMER", rated_kv: 12, contract_value_cents: 20000000, sold_at: "2026-02-01T00:00:00Z", promised_ship_at: "2026-12-01T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
              captures: { ord_a: $.data.id, ord_a_v0: $.data.version }
            - call: "POST /engineered-orders/${ord_a}/submittal-drawings"
              payload: { drawing_set_code: "DS-CON-A", authored_by_user_id: "u_de_1", expected_engineered_order_version: "${ord_a_v0}" }
              as: DesignEngineer
              captures: { dwg_a: $.data.id }
            - call: "POST /submittal-drawings/${dwg_a}/submit"
              payload: {}
              as: DesignEngineer
            - call: "POST /submittal-drawings/${dwg_a}/begin-review"
              payload: {}
              as: CustomerReviewer
            - call: "POST /submittal-drawings/${dwg_a}/disposition"
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u_cr_1", notes_count: 0 }
              as: CustomerReviewer
            - call: "POST /engineered-orders"
              payload: { order_number: "TX-CON-0002", customer_name: "Summit Grid", product_family: "MV_SWITCHGEAR", rated_kv: 15, contract_value_cents: 5000000, sold_at: "2026-02-02T00:00:00Z", promised_ship_at: "2027-01-15T00:00:00Z", owning_sales_user_id: "u_sales_1" }
              as: ContractAdmin
