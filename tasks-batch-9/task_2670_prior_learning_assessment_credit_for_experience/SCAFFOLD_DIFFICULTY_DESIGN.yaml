              payload: { program_code: "BSCS-BUF", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
