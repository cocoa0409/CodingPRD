  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request without X-User-Role / X-User-ID is rejected 401 ERR_UNAUTHENTICATED before any role, existence, or business check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders"
              payload: {}
              as: ""
              captures: { v1_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, HTTP 401 (send the request with both headers absent)"

      - name: customer_role_cannot_create_part
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - roles.Customer
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "POST /parts is exclusive to SupplyPlanner; the entity-backed Customer role is rejected 403 ERR_UNAUTHORIZED even with a well-formed payload."
        test_recipe:
          setup: ["One customer exists so the Customer role header is resolvable."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "RBAC Probe", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { v2_cust: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { part_number: "RBAC1", description: "Forbidden", package_family: "SOIC", process_technology: "CMOS_180NM" }
              as: Customer
              as_user_id: "${v2_cust}"
              captures: { v2_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED, HTTP 403"
            - "no part is created"

      - name: customer_cannot_read_other_customers_order
        claim_type: Violation to Error
        grounds:
          - validations[priority=2]
          - roles.Customer
          - entities.SalesOrder.fields.customer_id
        distinguishing_aspect: "Ownership scoping: Customer B's X-User-ID does not match order.customer_id of A's order, so the GET is 403 ERR_UNAUTHORIZED (not 404 — the resource exists)."
        test_recipe:
          setup: ["Customers A and B; one DRAFT order owned by A."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "UA741CN", description: "Op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { v3_part: $.data.id }
            - call: "POST /customers"
              payload: { name: "Owner A", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { v3_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Snooper B", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { v3_b: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${v3_a}", lines: [{ part_id: "${v3_part}", quantity: 1 }] }
              as: Customer
              as_user_id: "${v3_a}"
              captures: { v3_ord: $.data.id }
          trigger:
            - call: "GET /orders/${v3_ord}"
              payload: {}
              as: Customer
              as_user_id: "${v3_b}"
              captures: { v3_err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED, HTTP 403"
            - "the same GET as Customer A succeeds (200)"

      - name: duplicate_part_number_rejected
        claim_type: Violation to Error
        grounds:
