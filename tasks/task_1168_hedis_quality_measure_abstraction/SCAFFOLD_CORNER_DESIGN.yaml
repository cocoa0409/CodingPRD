# =============================================================================
# Task 1168 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk over §1.1–§1.7 per claim-extraction-guide. Instances already
# exercised by §1.8 are emitted as excluded_because stubs (no test_recipe).
# Logical clock default: 2026-05-01T00:00:00Z (never falls back to wall clock).
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: season_creation_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.MeasurementSeason"
          - "endpoints.POST /hedis/seasons"
        distinguishing_aspect: "A season is born DRAFT with certified_run_count 0, version 1, and server-minted id/created_at/updated_at."
        test_recipe:
          setup: ["empty DB; default logical clock 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { sid: $.data.id, st: $.data.status, crc: $.data.certified_run_count, v: $.data.version }
          assert:
            - "st == 'DRAFT' and crc == 0 and v == 1"
            - "sid is a server-minted UUID and the row carries created_at/updated_at (common_fields)"

      - name: spec_optional_field_defaults
        claim_type: defaults
        grounds:
          - "entities.MeasureSpecification.fields.hybrid_policy"
          - "entities.MeasureSpecification.fields.matching_policy"
          - "entities.MeasureSpecification.fields.sample_size_floor"
          - "entities.MeasureSpecification.fields.gender_requirement"
          - "entities.MeasureSpecification.fields.allowable_gap_days"
          - "entities.MeasureSpecification.fields.reporting_weight"
        distinguishing_aspect: "Omitting every optional spec field applies the pinned defaults: SAMPLE_ONLY / EXACT / 411 / ANY / 45 / 1.0."
        test_recipe:
          setup: ["one season exists"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
          trigger:
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", age_min: 50, age_max: 74, continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { hp: $.data.hybrid_policy, mp: $.data.matching_policy, floor: $.data.sample_size_floor, gr: $.data.gender_requirement, agd: $.data.allowable_gap_days, rw: $.data.reporting_weight }
          assert:
            - "hp == 'SAMPLE_ONLY' and mp == 'EXACT' and floor == 411"
            - "gr == 'ANY' and agd == 45 and rw == 1.0"

      - name: season_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "entities.MeasurementSeason.fields.measurement_year"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required measurement_year is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hedis/seasons"
              payload: { submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST'"

      - name: season_create_with_status_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.MeasurementSeason.fields.status"
        distinguishing_aspect: "A client-supplied status='OPEN' at creation is ignored (system-owned field): the season is DRAFT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [], status: "OPEN" }
              as: QualityAdmin
              captures: { st: $.data.status }
          assert:
            - "st == 'DRAFT' — the smuggled system field was ignored"

      - name: get_run_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "response_envelope"
        distinguishing_aspect: "Reading a random UUID returns the error envelope with ERR_NOT_FOUND and a message (404), asserting the §1.0 error shape."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /hedis/measure-runs/00000000-0000-0000-0000-000000000000", as: QualityAnalyst, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "err == 'ERR_NOT_FOUND' and msg is a non-empty string (error envelope per §1.0)"

      - name: segment_create_unknown_member_returns_not_found
        claim_type: parent_relationships
        grounds:
          - "entities.MemberEnrollmentSegment.fields.member_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "The member_id FK in the body must resolve; an unknown id yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "00000000-0000-0000-0000-000000000000", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_NOT_FOUND'"

      - name: member_create_unknown_provider_ref_returns_not_found
        claim_type: type_constraints
        grounds:
          - "entities.Member.fields.attributed_provider_ref"
          - "errors[ERR_PROVIDER_NOT_FOUND]"
          - "validations[priority=4.1]"
        distinguishing_aspect: "attributed_provider_ref is a denormalized reference that must resolve to an existing Provider.provider_ref."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F", attributed_provider_ref: "NOPE" }, as: QualityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_PROVIDER_NOT_FOUND'"

      - name: overread_review_immutable_event
        claim_type: immutability
        grounds:
          - "entities.OverReadReview"
        distinguishing_aspect: "OverReadReview has common_fields=false: rows carry id and created_at but no version/updated_at, and no update endpoint exists — a second review in the same round is impossible because the first moved the abstraction out of SUBMITTED (state guard)."
        test_recipe:
          setup:
            - "HYBRID floor-1 fixture: season OPEN (clock 2026-03-01), spec BCS floor 1 ACTIVE, member M001 enrolled all 2025, run POPULATED, sample drawn 1, chase c1 RECEIVED, abstraction a1 (HIT) SUBMITTED by abs-1 and flagged (ceil(0.10*1)=1)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", sample_size_floor: 1, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
          trigger:
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1", captures: { or1: $.data.id } }
            - { call: "GET /hedis/abstractions/${a1}/over-reads", as: QualityAnalyst, captures: { or_outcome: "$.data[0].outcome", or_rev: "$.data[0].reviewer_user_id" } }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-2", captures: { err2: $.data.error_id } }
          assert:
            - "or_outcome == 'AGREE' and or_rev == 'orr-1'"
            - "the over-read row has no 'version'/'updated_at' keys (common_fields: false event entity)"
            - "err2 == 'ERR_INVALID_STATE' — a1 is OVERREAD_PASSED, so the same-round second review is rejected by the state guard"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: season_double_open_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.MeasurementSeason"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "OPEN is not a valid from-state for open; the second open is rejected and the season stays OPEN."
        test_recipe:
          setup: ["one season created and opened"]
          setup_api_calls:
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: [] }
              as: QualityAdmin
              captures: { season_id: $.data.id }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
          trigger:
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /hedis/seasons/${season_id}", as: QualityAdmin, captures: { st: $.data.status } }
          assert:
            - "err == 'ERR_INVALID_STATE' and st == 'OPEN'"

      - name: chase_rechase_blocked_once_sample_finalized
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ChartChase.WITHDRAWN_to_REQUESTED"
          - "entities.Sample.fields.status"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "The cross-entity guard sample.status == DRAWN gates every chase mutation: after finalize, even a legal-from-state rechase (WITHDRAWN) is rejected."
        test_recipe:
          setup:
            - "HYBRID floor-2 fixture: members M001/M002, run POPULATED, sample drawn 2; c1: RECEIVED -> abstraction a1 HIT SUBMITTED -> over-read AGREE (OVERREAD_PASSED); c2: WITHDRAWN; evaluate-irr PASSED (1/1); sample FINALIZED"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", sample_size_floor: 2, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/members", payload: { member_ref: "M002", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m2: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m2}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id", c2: "$.data[1].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1" }
            - { call: "POST /hedis/chart-chases/${c2}/withdraw", as: QualityAnalyst }
            - { call: "POST /hedis/samples/${smp}/evaluate-irr", as: QualityAnalyst }
            - { call: "POST /hedis/samples/${smp}/finalize", as: QualityAnalyst, captures: { smp_st: $.data.status } }
          trigger:
            - { call: "POST /hedis/chart-chases/${c2}/rechase", as: QualityAnalyst, captures: { err: $.data.error_id } }
            - { call: "GET /hedis/chart-chases/${c2}", as: QualityAnalyst, captures: { c2_st: $.data.status, c2_rd: $.data.chase_round } }
          assert:
            - "smp_st == 'FINALIZED'"
            - "err == 'ERR_INVALID_STATE' — sample no longer DRAWN"
            - "c2_st == 'WITHDRAWN' and c2_rd == 1 — no side effects fired"

      - name: abstraction_terminal_lockdown_overread_passed
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Abstraction"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "OVERREAD_PASSED is terminal: retract and re-submit are both rejected."
        test_recipe:
          setup:
            - "HYBRID floor-1 fixture: a1 (HIT) SUBMITTED by abs-1 and over-read AGREE -> OVERREAD_PASSED"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "BCS", version_label: "2025.1", collection_method: "HYBRID", sample_size_floor: 1, age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M001", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "POST /hedis/samples", payload: { run_id: "${run_id}" }, as: QualityAnalyst, captures: { smp: $.data.id } }
            - { call: "GET /hedis/samples/${smp}/chart-chases", as: QualityAnalyst, captures: { c1: "$.data[0].id" } }
            - { call: "POST /hedis/chart-chases/${c1}/receive", as: QualityAnalyst }
            - { call: "POST /hedis/abstractions", payload: { chase_id: "${c1}", result: "HIT" }, as: Abstractor, as_user_id: "abs-1", captures: { a1: $.data.id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1" }
            - { call: "POST /hedis/over-reads", payload: { abstraction_id: "${a1}", outcome: "AGREE" }, as: OverReader, as_user_id: "orr-1" }
          trigger:
            - { call: "POST /hedis/abstractions/${a1}/retract", as: Abstractor, as_user_id: "abs-1", captures: { err1: $.data.error_id } }
            - { call: "POST /hedis/abstractions/${a1}/submit", as: Abstractor, as_user_id: "abs-1", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == 'ERR_INVALID_STATE' and err2 == 'ERR_INVALID_STATE' — OVERREAD_PASSED is terminal"

      - name: gap_close_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.GapItem"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A gap must pass through OUTREACH_DONE before close; closing an OPEN gap is rejected."
        test_recipe:
          setup:
            - "ADMIN fixture: season OPEN, spec CBP ACTIVE, member M1 enrolled all 2025; run POPULATED then RATE_COMPUTED -> one OPEN gap for M1"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
            - call: "POST /hedis/measure-specifications"
              payload: { season_id: "${season_id}", hedis_measure_code: "CBP", version_label: "2025.1", collection_method: "ADMINISTRATIVE", age_min: 0, age_max: 100, gender_requirement: "ANY", continuous_enrollment_months: 12, anchor_date: "2025-12-31T00:00:00Z", expected_season_version: "${season_v}" }
              as: QualityAdmin
              captures: { spec_id: $.data.id }
            - { call: "POST /hedis/measure-specifications/${spec_id}/activate", as: QualityAdmin }
            - { call: "POST /hedis/seasons/${season_id}/open", as: QualityAdmin }
            - { call: "POST /hedis/members", payload: { member_ref: "M1", birth_date: "1990-01-01T00:00:00Z", gender: "F" }, as: QualityAdmin, captures: { m1: $.data.id } }
            - { call: "POST /hedis/enrollment-segments", payload: { member_id: "${m1}", span_start: "2025-01-01T00:00:00Z", span_end: "2025-12-31T00:00:00Z" }, as: QualityAdmin }
            - { call: "POST /hedis/measure-runs", payload: { season_id: "${season_id}", spec_id: "${spec_id}" }, as: QualityAnalyst, captures: { run_id: $.data.id } }
            - { call: "POST /hedis/measure-runs/${run_id}/identify-population", as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_id}", as: QualityAnalyst, captures: { v1: $.data.version } }
            - { call: "POST /hedis/measure-runs/${run_id}/compute-rate", payload: { expected_measure_run_version: "${v1}" }, as: QualityAnalyst }
            - { call: "GET /hedis/measure-runs/${run_id}/gap-items", as: QualityAnalyst, captures: { g1: "$.data[0].id" } }
          trigger:
            - { call: "POST /hedis/gap-items/${g1}/close", payload: { outcome: "CLOSED_COMPLIANT" }, as: ProviderRelations, captures: { err: $.data.error_id } }
          assert:
            - "err == 'ERR_INVALID_STATE' — close requires OUTREACH_DONE"

      - name: gap_outreach_happy_path_and_provider_counter
        claim_type: side_effect_execution
        grounds:
          - "state_machines.GapItem.OPEN_to_OUTREACH_DONE"
          - "state_machines.GapItem.OUTREACH_DONE_to_CLOSED_COMPLIANT"
          - "entities.Provider.fields.open_gap_count"
        distinguishing_aspect: "OPEN -> OUTREACH_DONE -> CLOSED_COMPLIANT (MANUAL) decrements the attributed provider's open_gap_count by exactly 1 and stamps closure_source MANUAL."
        test_recipe:
          setup:
            - "ADMIN fixture: provider P1; member M1 attributed P1; run RATE_COMPUTED -> one OPEN gap g1 (P1.open_gap_count == 1)"
          setup_api_calls:
            - { call: "POST /hedis/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: QualityAdmin }
            - call: "POST /hedis/seasons"
              payload: { measurement_year: 2025, submission_deadline: "2026-06-15T00:00:00Z", admin_data_cutoff: "2026-03-31T00:00:00Z", approved_supplemental_sources: ["LAB_FEED"] }
              as: QualityAdmin
              captures: { season_id: $.data.id, season_v: $.data.version }
