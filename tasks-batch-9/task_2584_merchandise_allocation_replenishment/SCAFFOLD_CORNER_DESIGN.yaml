            - "Allocator on POST /allocation/allocation-runs/{runId}/commit returns 403 ERR_FORBIDDEN_ROLE, and this is a ROLE refusal at rung 2, not the rung 12 segregation-of-duties refusal: no Allocator can ever commit, not even one who did not propose"
