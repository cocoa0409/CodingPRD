            - "After trigger step 1: RemediationRefund.${refund_id}.state == PENDING, Merchant.${merch_id}.net_surcharge_collected_cents == 219, Transaction.${txn_id}.refunded_surcharge_cents == 0, ComplaintCase.${case_id}.refund_total_cents == 0"
            - "After trigger step 2: RemediationRefund.${refund_id}.state == ISSUED and issued_by_user_id == officer-2 and created_by_user_id == officer-1"
            - "After trigger step 2: Merchant.${merch_id}.gross_surcharge_collected_cents == 219 and net_surcharge_collected_cents == 0"
            - "After trigger step 2: Transaction.${txn_id}.refunded_surcharge_cents == 219 and ComplaintCase.${case_id}.refund_total_cents == 219"
            - "After trigger step 2: GET /surcharge-programs/${prog_id}/settlement-summary returns refunded_surcharge_cents == 219 and net_surcharge_cents == 0 and per_line_rounded_surcharge_cents == 219"
            - "After trigger step 3: RemediationRefund.${refund_id}.state == VOIDED and voided_at == 2026-08-31T00:00:00.000Z"
            - "After trigger step 3: Merchant.${merch_id}.gross_surcharge_collected_cents == 219 and net_surcharge_collected_cents == 219"
            - "After trigger step 3: Transaction.${txn_id}.refunded_surcharge_cents == 0 and ComplaintCase.${case_id}.refund_total_cents == 0"
            - "After trigger step 3: GET /surcharge-programs/${prog_id}/settlement-summary returns refunded_surcharge_cents == 0 and net_surcharge_cents == 219"
            - "SurchargeProgram.${prog_id}.status == ACTIVE and network_exposure_score == 20.00 throughout (below REMEDIATION_EXPOSURE_THRESHOLD 30)"

      - name: suspend_quarantine_cascade_reversed_only_by_explicit_restores
