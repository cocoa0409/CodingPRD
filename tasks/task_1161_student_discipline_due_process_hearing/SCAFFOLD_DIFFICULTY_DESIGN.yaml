  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: cumulative-count threshold (>10 strict)
  # vs elapsed-time window (inclusive deadline); different metrics & endpoints.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: mdr_threshold_exactly_ten_days_not_triggered
        grounds:
          - calculations.sanction_determination
          - entities.DisciplineCase.fields.mdr_required
        distinguishing_aspect: |
          Metric = cumulative day count. cumulative 4 + proposed 6 lands exactly
          on 10; the rule is strict-greater, so mdr_required stays false and no
          MDR is auto-created. Endpoint: POST /cases/{id}/sanction.
        test_recipe:
          setup:
            - "Student disability IEP; offense DISR-01 bands occ1 [1,3], occ2 [2,4]"
            - "Case 1 (incident 2026-05-04): classified occ1, sanctioned 4 days with override justification, noticed, confirmed at 2026-05-11 -> cumulative_suspension_days == 4"
            - "Case 2 (incident 2026-05-12): created and classified (occurrence 2, band [2,4])"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 2, min_days: 2, max_days: 4 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Ten", date_of_birth: "2009-10-01T00:00:00Z", grade_level: 10, demographic_group: "BLACK", guardian_id: "g6", disability_status: "IEP" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "first disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /cases/${c1_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${c1_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { c1_v2: $.data.version }
            - call: "POST /cases/${c1_id}/sanction"
              payload: { sanction_days: 4, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${c1_v2}", override_justification: "aggravated disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${c1_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${c1_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-12T00:00:00Z", description: "second disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases/${c2_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${c2_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { c2_v2: $.data.version }
          trigger:
            - call: "POST /cases/${c2_id}/sanction"
              payload: { sanction_days: 6, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${c2_v2}", override_justification: "escalating pattern" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { mdr_flag: $.data.mdr_required }
            - call: "GET /cases/${c2_id}/manifestation-determinations"
              payload: {}
              as: StudentServicesDirector
              as_user_id: "ssd_1"
          assert:
            - "sanction response mdr_required == false: cumulative 4 + proposed 6 == 10, and the trigger is strict > 10"
            - "GET manifestation-determinations returns an empty list (length 0) — no MDR auto-created at exactly 10"
            - "sanction_override == true (6 > band occ2 max 4 with justification) and proposed_sanction_days == 6"

      - name: appeal_deadline_day_five_inclusive
        grounds:
          - entities.SuspensionNotice.fields.appeal_deadline
          - "errors[ERR_APPEAL_WINDOW_CLOSED]"
        distinguishing_aspect: |
          Metric = elapsed-time window (a different metric than the cumulative
          day count) reached through a different endpoint
          (POST /cases/{id}/appeals). Filing at exactly notice.issued_at + 5
          days is inclusive-accepted.
        test_recipe:
          setup:
            - "Student NONE, guardian g7; offense DISR-01 band occ1 [1,3]; case classified, sanctioned 2 days; notice issued at 2026-05-04T09:00:00Z -> appeal_deadline 2026-05-09T09:00:00Z"
            - "Clock positioned at exactly 2026-05-09T09:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Appeal", date_of_birth: "2009-11-01T00:00:00Z", grade_level: 9, demographic_group: "ASIAN", guardian_id: "g7" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "disruption" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/notices", payload: { delivery_method: "IN_PORTAL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T09:00:00Z" }, as: DistrictAdmin }
          trigger:
            - call: "POST /cases/${case_id}/appeals"
              payload: { grounds: "filed at the deadline instant" }
              as: ParentGuardian
              as_user_id: "g7"
              captures: { appeal_status: $.data.status, filed_at: $.data.filed_at }
          assert:
            - "HTTP 201: filing at exactly issued_at + 5 days is accepted (inclusive boundary)"
            - "Appeal.status == FILED and Appeal.filed_at == 2026-05-09T09:00:00Z == notice.appeal_deadline"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency: Case<-MDR vs ReEntryPlan<-
  # AltEdPlacement (different entity pairs).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: notice_blocked_by_pending_mdr
        grounds:
          - state_machines.DisciplineCase.SANCTION_PROPOSED_to_NOTICE_ISSUED
          - "errors[ERR_MDR_INCOMPLETE]"
        distinguishing_aspect: |
          Entity pair DisciplineCase <- ManifestationDetermination: the case's
          SANCTION_PROPOSED -> NOTICE_ISSUED transition is gated on the child
          MDR's state; with an MDR PENDING the notice endpoint is rejected.
        test_recipe:
          setup:
            - "Student IEP, guardian g8; offense DISR-01 bands occ1 [1,3], occ2 [2,4]"
            - "Case 1 confirmed with 4 days (cumulative_suspension_days == 4)"
            - "Case 2 classified; sanction proposal of 7 days crosses the 10-day rule (4+7=11) -> MDR auto-created PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 2, min_days: 2, max_days: 4 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Mdr", date_of_birth: "2009-12-01T00:00:00Z", grade_level: 10, demographic_group: "BLACK", guardian_id: "g8", disability_status: "IEP" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "first" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /cases/${c1_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${c1_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { c1_v2: $.data.version }
            - call: "POST /cases/${c1_id}/sanction"
              payload: { sanction_days: 4, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${c1_v2}", override_justification: "aggravated" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${c1_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /cases/${c1_id}/confirm", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-12T00:00:00Z", description: "second" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /cases/${c2_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${c2_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { c2_v2: $.data.version }
            - call: "POST /cases/${c2_id}/sanction"
              payload: { sanction_days: 7, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${c2_v2}", override_justification: "severe escalation" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          trigger:
            - call: "POST /cases/${c2_id}/notices"
              payload: { delivery_method: "EMAIL" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MDR_INCOMPLETE (HTTP 409): case transition blocked by child MDR in PENDING"
            - "GET /cases/${c2_id}/manifestation-determinations returns exactly 1 row with status PENDING and origin AUTO_THRESHOLD"
            - "case ${c2_id} remains SANCTION_PROPOSED"

      - name: reentry_activation_blocked_until_placement_active
        grounds:
          - state_machines.ReEntryPlan.DRAFT_to_ACTIVE
          - "errors[ERR_PLACEMENT_NOT_ACTIVE]"
        distinguishing_aspect: |
          Entity pair ReEntryPlan <- AltEdPlacement (different pair than
