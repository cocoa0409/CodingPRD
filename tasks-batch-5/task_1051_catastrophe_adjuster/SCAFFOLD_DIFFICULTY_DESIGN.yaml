            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 2 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver: $.data.version } }
          trigger:
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "FEE_SCHEDULE", expected_assignment_version: "${asg_ver}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_id: $.data.id } }
