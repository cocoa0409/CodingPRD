            - { call: "GET /rack/customers/${c_id}", payload: {}, as: CreditAnalyst, captures: { expo_after_reserve: $.data.open_lifting_exposure_cents } }
            - { call: "POST /rack/lifting-tickets/${tk}/post-bol", payload: {}, as: TerminalOperator }
            - { call: "POST /rack/lifting-tickets/${tk}/invoice", payload: {}, as: BillingClerk }
            - { call: "GET /rack/customers/${c_id}", payload: {}, as: CreditAnalyst, captures: { expo_after_invoice: $.data.open_lifting_exposure_cents } }
          assert:
            - "gross_cents == 608000 (2000 * 280 + 2000 * 24)"
            - "After reserve: open_lifting_exposure_cents == 608000"
            - "After invoice: open_lifting_exposure_cents == 0 (drift == 0)"
