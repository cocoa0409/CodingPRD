scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: billing_provisional_vs_final_divergence
        grounds:
          - calculations.billing_statement_calculation
          - entities.BillingStatement.fields.provisional_total_usd
          - entities.BillingStatement.fields.final_total_usd
        distinguishing_aspect: |
          Entity domain = BillingStatement. The PROVISIONAL variant (input set SUBMITTED+VERIFIED)
          bills engine ESN-A101's unverified 290 h while the FINAL variant (VERIFIED only) drops it:
          same reports, same rates, totals 154500.00 vs 79825.00 and adjustment -74675.00.
        test_recipe:
          setup:
            - "Operator (credit B) with engines ESN-A101 (assumed 3000 h/yr, 120 cyc/mo) and ESN-A102 (assumed 3600 h/yr, 140 cyc/mo) enrolled in ACTIVE agreement LTSA-A01 (base 250.00, esc 3%, anchor 2025-09-01 -> 1 anniversary by 2026-09)"
            - "2026-09 reports: ESN-A101 290 h SUBMITTED only; ESN-A102 310 h VERIFIED"
            - "both engines' utilization bands resolve STANDARD (ESN-A101 has no verified history -> 1.00; ESN-A102 annualized 3720/3600 = 1.0333 <= 1.10)"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Meridian Air", iata_code: "M1", credit_rating: "B" }
              as: PlatformAdmin
              captures: { op1: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op1}", esn: "ESN-A101", engine_model: "CFM56-7B", base_severity_tier: "MODERATE", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e1: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op1}", esn: "ESN-A102", engine_model: "CFM56-7B", base_severity_tier: "HARSH", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e2: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-A01", base_rate_per_fh_usd: 250.00, escalation_pct: 0.03, escalation_anchor_date: "2025-09-01T00:00:00Z", start_date: "2025-09-01T00:00:00Z", end_date: "2030-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW", "REPAIRED", "USM"], max_workscope_cost_usd: 2000000 }
              as: ContractManager
              captures: { a1: $.data.id }
            - call: "POST /api/agreements/${a1}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${a1}/enroll"
              payload: { engine_id: "${e1}", assumed_annual_hours: 3000, assumed_cycles_per_month: 120 }
              as: ContractManager
            - call: "POST /api/agreements/${a1}/enroll"
              payload: { engine_id: "${e2}", assumed_annual_hours: 3600, assumed_cycles_per_month: 140 }
              as: ContractManager
            - call: "POST /api/engines/${e1}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 290, cycles: 120, observed_severity: "MODERATE" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /api/engines/${e2}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 310, cycles: 140, observed_severity: "HARSH" }
              as: Operator
              as_user_id: "${op1}"
              captures: { r2: $.data.id }
            - call: "POST /api/flight-hour-reports/${r2}/verify"
              as: FinanceController
            - call: "POST /api/agreements/${a1}/billing-statements"
              payload: { period: "2026-09" }
              as: FinanceController
              captures: { bs1: $.data.id, bs1_prov: $.data.provisional_total_usd }
          trigger:
            - call: "POST /api/billing-statements/${bs1}/settle"
              as: FinanceController
              captures: { bs1_final: $.data.final_total_usd, bs1_adj: $.data.adjustment_usd, bs1_status: $.data.status }
          assert:
            - "captured bs1_prov == 154500.00 (PROVISIONAL bills both engines at effective rate 257.5000)"
            - "captured bs1_final == 79825.00 (FINAL keeps only ESN-A102's VERIFIED line)"
            - "captured bs1_adj == -74675.00 (exactly ESN-A101's dropped provisional line 290 * 257.5000)"
            - "captured bs1_status == SETTLED"
      - name: recognition_projected_vs_actual_divergence
        grounds:
          - calculations.recognition_snapshot_calculation
          - entities.RecognitionSnapshot.fields.recognized_revenue_projected_usd
          - entities.RecognitionSnapshot.fields.recognized_revenue_actual_usd
        distinguishing_aspect: |
          Entity domain = ServiceAgreement contract accounting (different domain from billing).
          PROJECTED recognition (cost-to-date over a forward-looking lifetime projection that includes
          23 remaining months of run-rate billing and 1 forecast visit) yields 96000.00, while the
          ACTUAL variant (chronological settled billings deflated by target margin) yields 17000.00,
          and the margin floor triggers a 1020000.00 onerous accrual.
        test_recipe:
          setup:
            - "Operator (credit A) with engine ESN-B200 (BENIGN, llp 8000) enrolled in ACTIVE agreement LTSA-B02 (base 100.00, esc 2%, anchor=start 2026-09-01, end 2028-08-31, classes [NEW], cap 2000000), assumed 2400 h/yr, 100 cyc/mo"
            - "2026-09 report of 200 h VERIFIED (ratio 1.00 STANDARD; escalation anniversaries 0 -> rate 100.0000)"
            - "one COMPLETED visit with an APPROVED 300000.00 workscope (cost_to_date = 300000.00)"
            - "2026-09 statement issued and settled at 20000.00 (billed_to_date = settled = 20000.00)"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Coastal Airways", iata_code: "C2", credit_rating: "A" }
              as: PlatformAdmin
              captures: { op2: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op2}", esn: "ESN-B200", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e3: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-B02", base_rate_per_fh_usd: 100.00, escalation_pct: 0.02, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2028-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 2000000 }
              as: ContractManager
              captures: { a2: $.data.id }
            - call: "POST /api/agreements/${a2}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${a2}/enroll"
              payload: { engine_id: "${e3}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${e3}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 200, cycles: 100, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op2}"
              captures: { r3: $.data.id }
            - call: "POST /api/flight-hour-reports/${r3}/verify"
              as: FinanceController
            - call: "POST /api/engines/${e3}/shop-visits"
              payload: { planned_induction_date: "2026-09-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op2}"
              captures: { v1: $.data.id }
            - call: "POST /api/shop-visits/${v1}/induct"
              as: ShopPlanner
              captures: { v1_ver: $.data.version }
            - call: "POST /api/shop-visits/${v1}/workscopes"
              payload:
                expected_shop_visit_version: "${v1_ver}"
                items:
                  - { item_code: "MO-1", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 300000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { w1: $.data.id }
            - call: "POST /api/workscopes/${w1}/approve"
              as: Operator
              as_user_id: "${op2}"
            - call: "POST /api/shop-visits/${v1}/complete"
              as: ShopPlanner
            - call: "POST /api/agreements/${a2}/billing-statements"
              payload: { period: "2026-09" }
              as: FinanceController
              captures: { bs2: $.data.id }
            - call: "POST /api/billing-statements/${bs2}/settle"
              as: FinanceController
          trigger:
            - call: "POST /api/agreements/${a2}/recognition-snapshots"
              as: FinanceController
              captures: { snap_proj: $.data.recognized_revenue_projected_usd, snap_act: $.data.recognized_revenue_actual_usd, snap_onerous: $.data.onerous_loss_accrual_usd, snap_cost: $.data.cost_to_date_usd, snap_life_rev: $.data.lifetime_revenue_projection_usd, snap_life_cost: $.data.lifetime_cost_projection_usd }
          assert:
            - "captured snap_cost == 300000.00 (APPROVED workscope of the COMPLETED visit)"
            - "captured snap_life_rev == 480000.00 (20000.00 billed + 23 months * 20000.00 run-rate)"
            - "captured snap_life_cost == 1500000.00 (300000.00 + 1 forecast visit * 1200000 * 1.00 BENIGN)"
            - "captured snap_proj == 96000.00 (recognition_pct 0.2 * 480000.00)"
            - "captured snap_act == 17000.00 (20000.00 settled * (1 - 0.15))"
            - "captured snap_onerous == 1020000.00 (projected margin -2.125 < 0.05 floor)"
  - rule_id: combinatorial_formula
    instances:
      - name: escalated_rate_compounding_with_band_tiers
        grounds:
          - calculations.effective_rate_calculation
          - calculations.utilization_ratio_calculation
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — base rate 250.00, one compounding
          escalation anniversary (1.03), and a tiered band multiplier (1.08 because annualized
          utilization 1200/1000 = 1.20 > 1.10) multiply to 278.1000; each input flips a different
          branch of the formula.
        test_recipe:
          setup:
            - "Operator with engine ESN-C301 (BENIGN, llp 8000) enrolled in ACTIVE agreement LTSA-C03 (base 250.00, esc 3%, anchor 2025-09-01, end 2030-08-31), assumed 1000 h/yr, 100 cyc/mo"
            - "VERIFIED reports 2026-06/07/08 of 100 h each -> annualized 1200 -> ratio 1.20 -> HIGH band"
            - "2026-09 report of 50 h left SUBMITTED (still billed by the PROVISIONAL variant)"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Prairie Air", iata_code: "P3", credit_rating: "B" }
              as: PlatformAdmin
              captures: { op3: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op3}", esn: "ESN-C301", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e4: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-C03", base_rate_per_fh_usd: 250.00, escalation_pct: 0.03, escalation_anchor_date: "2025-09-01T00:00:00Z", start_date: "2025-09-01T00:00:00Z", end_date: "2030-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 2000000 }
              as: ContractManager
              captures: { a3: $.data.id }
            - call: "POST /api/agreements/${a3}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${a3}/enroll"
              payload: { engine_id: "${e4}", assumed_annual_hours: 1000, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${e4}/flight-hour-reports"
              payload: { period: "2026-06", flight_hours: 100, cycles: 50, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op3}"
              captures: { r41: $.data.id }
            - call: "POST /api/flight-hour-reports/${r41}/verify"
              as: FinanceController
            - call: "POST /api/engines/${e4}/flight-hour-reports"
              payload: { period: "2026-07", flight_hours: 100, cycles: 50, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op3}"
              captures: { r42: $.data.id }
            - call: "POST /api/flight-hour-reports/${r42}/verify"
              as: FinanceController
            - call: "POST /api/engines/${e4}/flight-hour-reports"
              payload: { period: "2026-08", flight_hours: 100, cycles: 50, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op3}"
              captures: { r43: $.data.id }
            - call: "POST /api/flight-hour-reports/${r43}/verify"
              as: FinanceController
            - call: "POST /api/engines/${e4}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 50, cycles: 25, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op3}"
          trigger:
            - call: "POST /api/agreements/${a3}/billing-statements"
              payload: { period: "2026-09" }
              as: FinanceController
              captures: { bs3_prov: $.data.provisional_total_usd, bs3_lines: $.data.line_items }
          assert:
            - "captured bs3_lines[0].effective_rate_per_fh_usd == 278.1000 (250.00 * 1.03^1 * 1.08 HIGH band)"
            - "captured bs3_lines[0].line_amount_usd == 13905.00 (50 * 278.1000)"
            - "captured bs3_prov == 13905.00"
      - name: per_line_round_then_sum_order
        grounds:
          - calculations.billing_statement_calculation
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-line-then-sum, so two engines
          at 3 h * 99.9950 produce 2 * 299.99 = 599.98, whereas the sum-then-round order would produce
          599.97; the pinned order changes the cents of the statement total.
        test_recipe:
          setup:
            - "Operator with engines ESN-D401 and ESN-D402 (BENIGN, llp 8000) enrolled in ACTIVE agreement LTSA-D04 (base 99.995, esc 0%, anchor=start 2026-09-01 -> 0 anniversaries, end 2027-08-31), assumed 2000 h/yr, 100 cyc/mo"
            - "both engines submit a 2026-09 report of 3 h (SUBMITTED; no verified history -> band factor 1.00)"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Delta Regional", iata_code: "D4", credit_rating: "C" }
              as: PlatformAdmin
              captures: { op4: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op4}", esn: "ESN-D401", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e5a: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op4}", esn: "ESN-D402", engine_model: "CFM56-7B", base_severity_tier: "BENIGN", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e5b: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-D04", base_rate_per_fh_usd: 99.995, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 1000000 }
              as: ContractManager
              captures: { a4: $.data.id }
            - call: "POST /api/agreements/${a4}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${a4}/enroll"
              payload: { engine_id: "${e5a}", assumed_annual_hours: 2000, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/agreements/${a4}/enroll"
              payload: { engine_id: "${e5b}", assumed_annual_hours: 2000, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${e5a}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 3, cycles: 1, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op4}"
            - call: "POST /api/engines/${e5b}/flight-hour-reports"
              payload: { period: "2026-09", flight_hours: 3, cycles: 1, observed_severity: "BENIGN" }
              as: Operator
              as_user_id: "${op4}"
          trigger:
            - call: "POST /api/agreements/${a4}/billing-statements"
              payload: { period: "2026-09" }
              as: FinanceController
              captures: { bs4_prov: $.data.provisional_total_usd, bs4_lines: $.data.line_items }
          assert:
            - "captured bs4_lines[0].line_amount_usd == 299.99 and bs4_lines[1].line_amount_usd == 299.99 (each line round_half_up(3 * 99.9950 = 299.985) -> 299.99)"
            - "captured bs4_prov == 599.98 (sum of rounded lines; the sum-then-round alternative 599.97 is wrong)"
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_renegotiation_cycle
        grounds:
          - state_machines.ServiceAgreement.ACTIVE_to_RENEGOTIATION
          - state_machines.ServiceAgreement.RENEGOTIATION_to_ACTIVE
          - concurrency_rules[amend-stale-agreement]
        distinguishing_aspect: |
          Entity = ServiceAgreement, shape = cycle ACTIVE -> RENEGOTIATION -> ACTIVE; while the cycle
          is open the billing gate on the same agreement rejects issuance with ERR_AGREEMENT_NOT_ACTIVE,
          and the closing amend is OCC-guarded on the agreement version.
        test_recipe:
          setup:
            - "Operator and ACTIVE agreement LTSA-E05 (base 100.00, esc 1%, anchor=start 2026-09-01, end 2027-08-31); version is 2 after activation"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Echo Air", iata_code: "E5", credit_rating: "B" }
              as: PlatformAdmin
              captures: { op5: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-E05", base_rate_per_fh_usd: 100.00, escalation_pct: 0.01, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW"], max_workscope_cost_usd: 500000 }
              as: ContractManager
              captures: { a5: $.data.id, a5_v1: $.data.version }
            - call: "POST /api/agreements/${a5}/activate"
              as: ContractManager
              captures: { a5_v2: $.data.version }
            - call: "POST /api/agreements/${a5}/open-renegotiation"
              as: ContractManager
              captures: { a5_v3: $.data.version, a5_status: $.data.status }
          trigger:
            - call: "POST /api/agreements/${a5}/billing-statements"
              payload: { period: "2026-09" }
              as: FinanceController
              captures: { bill_err: $.data.error_id }
            - call: "POST /api/agreements/${a5}/amend"
              payload: { expected_agreement_version: "${a5_v3}", base_rate_per_fh_usd: 110.00 }
              as: ContractManager
              captures: { a5_v4: $.data.version, a5_status2: $.data.status }
          assert:
            - "captured a5_v1 == 1, a5_v2 == 2, a5_v3 == 3, a5_v4 == 4 (every transition bumps version)"
            - "captured a5_status == RENEGOTIATION and a5_status2 == ACTIVE (cycle closed by amend)"
            - "captured bill_err == ERR_AGREEMENT_NOT_ACTIVE (billing blocked mid-cycle)"
      - name: workscope_version_rework_loop
        grounds:
          - state_machines.Workscope.SUBMITTED_to_REJECTED
          - state_machines.Workscope.REJECTED_to_SUPERSEDED
          - concurrency_rules[workscope-create-stale-visit]
        distinguishing_aspect: |
          Entity = Workscope, shape = branching with rework loop (SUBMITTED -> REJECTED, then a new
          version supersedes the rejected one) — a different entity and a different non-linear shape
          from the agreement renegotiation cycle.
        test_recipe:
          setup:
            - "Operator with engine ESN-F601 (MODERATE, llp 8000) enrolled in ACTIVE agreement LTSA-F06 (base 100.00, esc 0%, cap 2000000, classes [NEW, REPAIRED]), assumed 2400 h/yr 100 cyc/mo"
            - "visit INDUCTED (visit version is 2 after induction)"
          setup_api_calls:
            - call: "POST /api/operators"
              payload: { name: "Frontier Air", iata_code: "F6", credit_rating: "B" }
              as: PlatformAdmin
              captures: { op6: $.data.id }
            - call: "POST /api/engines"
              payload: { operator_id: "${op6}", esn: "ESN-F601", engine_model: "CFM56-7B", base_severity_tier: "MODERATE", llp_remaining_cycles: 8000 }
              as: PlatformAdmin
              captures: { e6: $.data.id }
            - call: "POST /api/agreements"
              payload: { contract_ref: "LTSA-F06", base_rate_per_fh_usd: 100.00, escalation_pct: 0.0, escalation_anchor_date: "2026-09-01T00:00:00Z", start_date: "2026-09-01T00:00:00Z", end_date: "2027-08-31T00:00:00Z", allowed_sourcing_classes: ["NEW", "REPAIRED"], max_workscope_cost_usd: 2000000 }
              as: ContractManager
              captures: { a6: $.data.id }
            - call: "POST /api/agreements/${a6}/activate"
              as: ContractManager
            - call: "POST /api/agreements/${a6}/enroll"
              payload: { engine_id: "${e6}", assumed_annual_hours: 2400, assumed_cycles_per_month: 100 }
              as: ContractManager
            - call: "POST /api/engines/${e6}/shop-visits"
              payload: { planned_induction_date: "2026-09-01T00:00:00Z" }
              as: Operator
              as_user_id: "${op6}"
              captures: { v2: $.data.id }
            - call: "POST /api/shop-visits/${v2}/induct"
              as: ShopPlanner
              captures: { v2_ver: $.data.version }
            - call: "POST /api/shop-visits/${v2}/workscopes"
              payload:
                expected_shop_visit_version: "${v2_ver}"
                items:
                  - { item_code: "MO-1", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 100000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { w21: $.data.id, w21_ver_scope: $.data.scope_version }
            - call: "POST /api/workscopes/${w21}/reject"
              as: Operator
              as_user_id: "${op6}"
            - call: "GET /api/shop-visits/${v2}"
              as: ShopPlanner
              captures: { v2_ver2: $.data.version }
          trigger:
            - call: "POST /api/shop-visits/${v2}/workscopes"
              payload:
                expected_shop_visit_version: "${v2_ver2}"
                items:
                  - { item_code: "MO-2", item_type: "MODULE_OVERHAUL", estimated_cost_usd: 120000, restores_cycles: 8000, directive_ref: null }
              as: ShopPlanner
              captures: { w22: $.data.id, w22_ver_scope: $.data.scope_version }
            - call: "GET /api/workscopes/${w21}"
              as: ShopPlanner
              captures: { w21_status: $.data.status }
          assert:
            - "captured w21_ver_scope == 1 and w22_ver_scope == 2 (version counter increments per visit)"
            - "captured w21_status == SUPERSEDED (rejected version superseded by the rework loop)"
  - rule_id: transitive_cascade
    instances:
      - name: verify_report_to_lease_cancel_chain
        grounds:
          - state_machines.FlightHourReport.SUBMITTED_to_VERIFIED
          - state_machines.ShopVisit.SCHEDULED_to_INDUCTED
          - state_machines.SpareEngineLease.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by report verification (different trigger from the directive
          cascade): verify -> Engine cumulative/LLP consumption -> SCHEDULED visit's forecast
          recompute and planned-date auto-advance -> out-of-window RESERVED lease auto-cancelled.
        test_recipe:
          setup:
            - "Operator (credit B), engine ESN-G701 (MODERATE, llp 500) enrolled in ACTIVE agreement LTSA-G07, assumed 2000 h/yr 100 cyc/mo"
