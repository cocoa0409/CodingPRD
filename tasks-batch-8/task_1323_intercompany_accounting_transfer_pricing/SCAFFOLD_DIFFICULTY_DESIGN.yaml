            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx: $.data.id } }
            - { call: "POST /tp/transactions/${tx}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/true_up_runs", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { run: $.data.id } }
            - { call: "POST /tp/true_up_runs/${run}/compute", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          trigger:
            - { call: "POST /tp/true_up_runs/${run}/approve", payload: {}, as: TaxManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: GroupTaxAdmin }
            - { call: "POST /tp/true_up_runs/${run}/approve", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          assert:
            - "first approve (year OPEN): error_id == ERR_YEAR_NOT_CLOSING"
            - "after begin_closing: TrueUpRun.${run}.status == APPROVED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_half_open_interval_collision_vs_adjacency
        grounds:
          - errors[ERR_AGREEMENT_PERIOD_OVERLAP]
          - entities.IntercompanyAgreement.fields.effective_from
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) on the
          agreement resource key (provider, recipient, transaction_type). An
          interior overlap is rejected; a touching interval (from == prior to)
          is accepted because the end is exclusive.
        test_recipe:
          setup:
            - "E1/E2 ACTIVE; study CURRENT; agreement A created (DRAFT) covering [2026-01-01, 2027-01-01)"
            - "Creation checks overlap against agreements in {DRAFT, ACTIVE, UNDER_AMENDMENT}"
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr_a: $.data.id } }
          trigger:
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-06-01", effective_to: "2026-12-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { err: $.data.error_id } }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 250, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2027-01-01", effective_to: "2028-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr_c: $.data.id } }
          assert:
            - "overlapping create: error_id == ERR_AGREEMENT_PERIOD_OVERLAP"
            - "adjacent create (2027-01-01 == A.effective_to): succeeds, IntercompanyAgreement.${agr_c}.status == DRAFT"

      - name: apa_covered_year_set_disjointness
        grounds:
          - errors[ERR_APA_YEAR_OVERLAP]
          - entities.AuditCase.fields.covered_year_indexes
        distinguishing_aspect: |
          Interval semantics: integer year-SET intersection on the AuditCase
          (APA) resource — no adjacency concept; any shared year index collides.
          Different resource and different interval arithmetic from the
          agreement half-open date rule.
        test_recipe:
          setup:
            - "E1 ACTIVE; APA case 1 for E1 covering [2024, 2025] exists (OPENED)"
          setup_api_calls:
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "APA", authority_country: "US", covered_year_indexes: [2024, 2025] }, as: TransferPricingLead, captures: { apa1: $.data.id } }
          trigger:
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "APA", authority_country: "DE", covered_year_indexes: [2025, 2026] }, as: TransferPricingLead, captures: { err: $.data.error_id } }
            - { call: "POST /tp/audit_cases", payload: { entity_id: "${e1}", case_type: "APA", authority_country: "DE", covered_year_indexes: [2026, 2027] }, as: TransferPricingLead, captures: { apa3: $.data.id } }
          assert:
            - "year-overlapping create (2025 shared): error_id == ERR_APA_YEAR_OVERLAP"
            - "disjoint create [2026, 2027]: succeeds, AuditCase.${apa3}.status == OPENED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: booking_plus_elimination_conserves_consolidated_net_zero
        grounds:
          - calculations.elimination_consolidation
          - entities.FiscalYear.fields.consolidated_intercompany_net_cents
        distinguishing_aspect: |
          Conserved quantity: consolidated intercompany net P&L. Forward action
          (booking a matched pair, including a 50-cent mismatch within
          tolerance) paired with its compensating elimination (which books a
          plug) leaves FiscalYear.consolidated_intercompany_net_cents == 0.
        test_recipe:
          setup:
            - "Year 2026 OPEN; agreement ACTIVE; tx1 rev=cost=1020000; tx2 rev 2040050 vs cost 2040000 (50 <= 100 tolerance)"
            - "Both transactions matched, then begin_closing auto-eliminates them"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "USCo", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "DECo", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/benchmarking_studies", payload: { transaction_type: "SERVICES", region: "EU", vintage_year: 2026, comparables_bp: [300, 400, 500, 600, 700] }, as: TaxAnalyst, as_user_id: "ana-1", captures: { study: $.data.id } }
            - { call: "POST /tp/benchmarking_studies/${study}/approve", payload: {}, as: TransferPricingLead, as_user_id: "tpl-1" }
            - { call: "POST /tp/agreements", payload: { provider_entity_id: "${e1}", recipient_entity_id: "${e2}", transaction_type: "SERVICES", pricing_method: "COST_PLUS", markup_bp: 200, true_up_method: "TO_MEDIAN", benchmarking_study_id: "${study}", effective_from: "2026-01-01", effective_to: "2027-01-01" }, as: TaxAnalyst, as_user_id: "ana-1", captures: { agr: $.data.id } }
            - { call: "POST /tp/agreements/${agr}/activate", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 1000000, provider_revenue_cents: 1020000, recipient_cost_cents: 1020000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx1: $.data.id } }
            - { call: "POST /tp/transactions", payload: { agreement_id: "${agr}", fiscal_year_id: "${fy}", cost_base_cents: 2000000, provider_revenue_cents: 2040050, recipient_cost_cents: 2040000 }, as: TaxAnalyst, as_user_id: "ana-1", captures: { tx2: $.data.id } }
            - { call: "POST /tp/transactions/${tx1}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
            - { call: "POST /tp/transactions/${tx2}/match", payload: {}, as: TaxAnalyst, as_user_id: "ana-1" }
          trigger:
            - { call: "POST /tp/fiscal_years/${fy}/begin_closing", payload: {}, as: GroupTaxAdmin, captures: { net: $.data.consolidated_intercompany_net_cents } }
          assert:
            - "FiscalYear.${fy}.consolidated_intercompany_net_cents == 0   (plug 50 absorbed the mismatch)"
            - "ICTransaction.${tx1}.elimination_status == ELIMINATED"
            - "ICTransaction.${tx2}.elimination_status == ELIMINATED"

      - name: sweep_and_reverse_sweep_conserve_pool_zero_sum
        grounds:
          - calculations.pool_netting_calculation
          - errors[ERR_POOL_NOT_ZERO_SUM]
        distinguishing_aspect: |
          Conserved quantity: total pool cash principal. A forward sweep
          (+500000/-200000/-300000) paired with its exact compensating sweep
          leaves every position at 0 and sum(balance_cents) == 0 through
          netting and settle — a different conserved quantity (cash) from the
          consolidated-P&L invariant.
        test_recipe:
          setup:
            - "Year 2026; E1/E2/E3 ACTIVE; pool created (AVERAGE_BALANCE, fee 0), version captured"
          setup_api_calls:
            - { call: "POST /tp/fiscal_years", payload: { year_index: 2026, group_revenue_eur: 100000000 }, as: GroupTaxAdmin, captures: { fy: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E1", country_code: "US", functional_currency: "USD" }, as: GroupTaxAdmin, captures: { e1: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E2", country_code: "DE", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e2: $.data.id } }
            - { call: "POST /tp/legal_entities", payload: { name: "E3", country_code: "FR", functional_currency: "EUR" }, as: GroupTaxAdmin, captures: { e3: $.data.id } }
            - { call: "POST /tp/cash_pools", payload: { fiscal_year_id: "${fy}", interest_method: "AVERAGE_BALANCE", admin_fee_cents: 0 }, as: TreasuryManager, captures: { pool: $.data.id, pool_v: $.data.version } }
          trigger:
            - { call: "POST /tp/cash_pools/${pool}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: 500000 }, { entity_id: "${e2}", amount_cents: -200000 }, { entity_id: "${e3}", amount_cents: -300000 } ], expected_cash_pool_version: "${pool_v}" }, as: TreasuryManager, captures: { pool_v2: $.data.version } }
            - { call: "POST /tp/cash_pools/${pool}/sweeps", payload: { movements: [ { entity_id: "${e1}", amount_cents: -500000 }, { entity_id: "${e2}", amount_cents: 200000 }, { entity_id: "${e3}", amount_cents: 300000 } ], expected_cash_pool_version: "${pool_v2}" }, as: TreasuryManager }
            - { call: "POST /tp/cash_pools/${pool}/begin_netting", payload: {}, as: TreasuryManager }
            - { call: "POST /tp/cash_pools/${pool}/settle", payload: {}, as: TreasuryManager, captures: { settled: $.data.status } }
          assert:
            - "after reverse sweep: every position balance_cents == 0"
            - "sum(position.balance_cents) == 0 at settle (precondition met, no ERR_POOL_NOT_ZERO_SUM)"
            - "CashPool.${pool}.status == SETTLED"
