          setup:
            - "Plant NWK has production_line_count 2 and max_width_change_in 8.0; binder BF-FREE-1 is CERTIFIED."
            - "Three SKUs exist on that binder: PL-B (width_in 23, KRAFT), PL-A (width_in 15, UNFACED) and PL-E (width_in 24, FSK)."
