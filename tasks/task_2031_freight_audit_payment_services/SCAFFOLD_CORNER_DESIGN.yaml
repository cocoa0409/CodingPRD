        claim_type: occ_stale_version
        grounds: ["concurrency_rules[contract-activate-stale-version]"]
        distinguishing_aspect: "OCC on RateContract.version: after a successful activate bumps version 1 -> 2, a second activate carrying the stale observed version 1 fails ERR_STALE_VERSION (412) before the state check."
        test_recipe:
          setup: ["Client ACTIVE; carrier ACTIVE; contract DRAFT at version 1"]
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
