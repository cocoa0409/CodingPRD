  - method: GET
    path: "/api/checks/{check_id}"
    description: "Get check"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: []
    output: Check
    side_effects: []

  - method: GET
    path: "/api/venues/{id}/checks"
    description: "List checks for a venue"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: ["status?"]
    output: Check[]
    side_effects: []

  - method: GET
    path: "/api/checks"
    description: "List checks with optional filters"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: ["venue_id?", "guest_id?", "event_id?", "status?"]
    output: Check[]
    side_effects: []

  - method: GET
    path: "/api/checks/{id}/order-lines"
    description: "List order lines on a check"
    roles: [PlatformAdmin, VenueManager, Server]
    code: 200
    input: []
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/api/checks/{check_id}/order-lines"
    description: "Add an order line"
    roles: [Server]
    code: 201
    input: [kind, portion_count]
    output: OrderLine
    side_effects:
      - "unit_price_cents and line_total_cents computed"
      - "check.subtotal_cents recomputed"

  - method: POST
    path: "/api/order-lines/{line_id}/void"
    description: "Void an order line"
    roles: [Server]
    code: 200
    input: []
    output: OrderLine
    side_effects: ["status -> VOID", "check.subtotal_cents recomputed"]

  - method: POST
    path: "/api/checks/{check_id}/settle"
    description: "Settle a check"
    roles: [Server]
    code: 200
    input: []
    output: Check
    side_effects: ["status -> SETTLED", "tax_cents and total_cents computed"]

  - method: POST
    path: "/api/checks/{check_id}/void"
    description: "Void an entire check"
    roles: [VenueManager]
    code: 200
    input: []
    output: Check
    side_effects: ["status -> VOIDED"]

