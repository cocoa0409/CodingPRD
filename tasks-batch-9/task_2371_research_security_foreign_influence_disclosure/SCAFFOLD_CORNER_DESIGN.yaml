# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
# Domain: research-security-disclosure (task 2371)
#
# Breadth probe over §1.1-§1.7. Sections and claim_type values come from
# references/claim-extraction-guide.md only. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
#
# Convention used throughout (same as §1.8): an `expected_*_version` payload value is
# ALWAYS captured from a GET issued immediately before the OCC write, because
# recomputation cascades bump the parent's version between its creation and that write.
# The logical clock is pinned with POST /_clock/set_current_utc as the first setup call
# of every instance whose asserts mention a timestamp or a clock-derived status.

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: investigator_create_returns_201_with_declared_fields
        claim_type: creation
        grounds:
          - endpoints.POST_/investigators
          - entities.Investigator
        distinguishing_aspect: "A create with every declared input returns 201 and echoes the four stored inputs while initializing all nine computed/derived fields; a partial response or a missing derived field fails."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /investigators"
              payload: { full_name: "Ada Reyes", email: "ada.reyes@uni.edu", appointment_type: "FACULTY", home_department: "Bioinformatics", institutional_base_effort_pct: 90 }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "response code 201 with response_type object and meta.api_request_id present"
            - "full_name == Ada Reyes, email == ada.reyes@uni.edu, appointment_type == FACULTY, home_department == Bioinformatics"
            - "institutional_base_effort_pct == 90, committed_effort_pct == 0.00, outside_effort_pct == 0.00, total_commitment_pct == 90.00, overcommitment_pct == 0.00"
            - "risk_score == 0, substantiated_incident_count == 0, material_discrepancy_count == 0, training_compliant == true, disclosure_posture == CLEAR"
            - "version == 1 and id is a bare UUID with no type prefix"

      - name: investigator_default_institutional_base_effort_pct_is_100
        claim_type: defaults
        grounds:
          - entities.Investigator.fields.institutional_base_effort_pct
          - endpoints.POST_/investigators
        distinguishing_aspect: "Omitting the only optional input applies the declared default of 100, which immediately shows up in total_commitment_pct; treating the omission as 0 or null yields total_commitment_pct 0.00."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /investigators"
              payload: { full_name: "Ben Solano", email: "ben.solano@uni.edu", appointment_type: "POSTDOC", home_department: "Neuroscience" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "institutional_base_effort_pct == 100"
            - "total_commitment_pct == 100.00 and overcommitment_pct == 0.00"
            - "disclosure_posture == CLEAR (a fully committed base effort is not by itself a posture trigger)"

      - name: investigator_version_and_updated_at_advance_on_every_mutation
        claim_type: system_fields
        grounds:
          - entities.Investigator
          - endpoints.POST_/disclosures
          - concurrency_rules.disclosure-create-stale-investigator
        distinguishing_aspect: "version starts at 1 and the OCC side effect of a child create bumps it to exactly 2 while created_at is unchanged and updated_at is refreshed; an implementation that bumps version only on direct writes to the row leaves it at 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one investigator INV freshly created at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Cleo Danforth", email: "cleo.danforth@uni.edu", appointment_type: "FACULTY", home_department: "Linguistics" }
              as: SystemAdmin
              captures: { inv_id: $.data.id, inv_created: $.data.created_at }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
          trigger:
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
          assert:
            - "the captured inv_ver was 1"
            - "GET /investigators/${inv_id} after the trigger returns version == 2"
            - "created_at is unchanged from the create response and updated_at is >= created_at"
            - "Disclosure.${d_id}.version == 1 and Disclosure.${d_id}.created_at == 2026-08-01T00:00:00Z"

      - name: project_get_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints.GET_/projects/{project_id}
          - entities.Project
          - calculations.project_activation_blockers
          - calculations.project_controlled_area_posture
        distinguishing_aspect: "A freshly created project already carries derived state: two blockers in BLOCKER_ORDER, a zero grant count and posture OPEN. Returning an empty activation_blockers list for a brand-new project is the failure mode."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one project with controlled_area_capacity 2 and no personnel."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /projects"
              payload: { title: "Coastal Sensor Network", agency_code: "NSF", sensitivity_level: "STANDARD", award_amount_cents: 30000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z", controlled_area_capacity: 2 }
              as: SystemAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /projects/${p_id}"
              payload: {}
              as: AgencyLiaison
              as_user_id: "liaison-1"
          assert:
            - "title == Coastal Sensor Network, agency_code == NSF, sensitivity_level == STANDARD, award_amount_cents == 30000000"
            - "award_status == PROPOSED, security_status == PENDING_CLEARANCE, security_status_reason == NONE"
            - "activation_blockers == [SECURITY_NOT_CLEARED, PERSONNEL_MISSING_PI]"
            - "active_grant_count == 0, controlled_area_posture == OPEN, open_incident_count == 0"

      - name: disclosure_items_list_filters_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/disclosure-items
          - response_envelope.pagination_fields
          - entities.DisclosureItem.fields.status
        distinguishing_aspect: "The filtered list combines disclosure_id and status and reports total_count for the FILTERED set, not the table: with two items on one disclosure and one of them DISPUTED, status=DECLARED must return total_count 1 and has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Investigator INV with disclosure D in SUBMITTED carrying two items; the second item has been moved to DISPUTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Dara Eze", email: "dara.eze@uni.edu", appointment_type: "FACULTY", home_department: "Sociology" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Neutral Academy", country_code: "SG", org_type: "UNIVERSITY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "FOREIGN_APPOINTMENT", foreign_organization_id: "${org_id}", start_date: "2025-01-05T00:00:00Z", annual_effort_hours: 0, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { it1_id: $.data.id }
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "OUTSIDE_SUPPORT", foreign_organization_id: "${org_id}", start_date: "2025-02-05T00:00:00Z", annual_effort_hours: 0, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { it2_id: $.data.id }
            - call: "POST /disclosures/${d_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /disclosure-items/${it2_id}/status"
              payload: { to_status: "DISPUTED" }
              as: ConflictReviewOfficial
              as_user_id: "cro-1"
          trigger:
            - call: "GET /disclosure-items"
              payload: { disclosure_id: "${d_id}", status: "DECLARED", limit: 10, offset: 0 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "response_type == array with total_count == 1, has_more == false, limit == 10, offset == 0"
            - "the single row is ${it1_id} with status DECLARED"
            - "Disclosure.${d_id}.item_count == 2 (DISPUTED items still count toward item_count)"

      - name: access_grant_get_unknown_id_returns_404_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/controlled-access-grants/{grant_id}
          - errors.ERR_ACCESS_GRANT_NOT_FOUND
          - validations.priority_4_path_existence
        distinguishing_aspect: "A syntactically valid but unknown UUID on the path returns the entity-specific 404 ERR_ACCESS_GRANT_NOT_FOUND, not a generic 404 or an empty 200 envelope."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /controlled-access-grants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "response code 404 with response_type error and data.error_id == ERR_ACCESS_GRANT_NOT_FOUND"
            - "data.message is a non-empty string and no grant row was created"

      - name: disclosure_create_missing_required_cycle_label_returns_400
        claim_type: required_fields
        grounds:
          - endpoints.POST_/disclosures
          - validations.priority_6_request_shape
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "cycle_label carries no default, so omitting it is a 400 ERR_INVALID_REQUEST that fires BEFORE the priority-8 version guard even though the supplied version is valid; no Disclosure row and no Investigator.version bump may result."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one investigator INV at version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /investigators"
              payload: { full_name: "Emre Falk", email: "emre.falk@uni.edu", appointment_type: "FACULTY", home_department: "Geology" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
          trigger:
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
          assert:
            - "response code 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /disclosures?investigator_id=${inv_id} returns total_count == 0"
            - "Investigator.${inv_id}.version is still 1"

      - name: disclosure_item_risk_points_computed_on_create
        claim_type: computed_fields
        grounds:
          - entities.DisclosureItem.fields.item_risk_points
          - calculations.investigator_risk_score
          - endpoints.POST_/disclosures/{disclosure_id}/items
        distinguishing_aspect: "item_risk_points is computed at create time from ITEM_POINTS x DESIGNATION_MULTIPLIER (12 x 2.0 = 24 on an ENTITY_LIST organization) while the investigator's risk_score stays 0 because only VERIFIED items enter the risk input set — the two must not move together."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ORG_EL with own_designation ENTITY_LIST; investigator INV with a DRAFT disclosure D."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Listed Systems Institute", country_code: "CN", org_type: "INSTITUTE", own_designation: "ENTITY_LIST", designated_on: "2025-05-01T00:00:00Z" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_id: $.data.id }
            - call: "POST /investigators"
              payload: { full_name: "Gita Halim", email: "gita.halim@uni.edu", appointment_type: "FACULTY", home_department: "Computer Science" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /disclosures/${d_id}/items"
              payload: { item_type: "FOREIGN_APPOINTMENT", foreign_organization_id: "${org_id}", start_date: "2025-01-05T00:00:00Z", annual_effort_hours: 0, is_paid: false }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { it_id: $.data.id }
          assert:
            - "response code 201 with item_risk_points == 24, status == DECLARED and source == SELF_REPORTED"
            - "Disclosure.${d_id}.item_count == 1, late_item_count == 0, undisclosed_item_count == 0"
            - "Disclosure.${d_id}.completeness_score == 100 and completeness_tier == A"
            - "Investigator.${inv_id}.risk_score == 0 and outside_effort_pct == 0.00 (the item is not VERIFIED yet)"

      - name: project_create_invalid_enum_agency_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.Project.fields.agency_code
          - validations.priority_6_request_shape
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "agency_code is a closed enum of five members, so a plausible-looking sponsor abbreviation outside the set is a 400, not a stored free-text value."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /projects"
              payload: { title: "Unsponsored Study", agency_code: "ONR", sensitivity_level: "STANDARD", award_amount_cents: 10000000, period_start: "2026-09-01T00:00:00Z", period_end: "2028-08-31T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "response code 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects returns total_count == 0"

      - name: project_period_end_before_start_rejected
        claim_type: type_constraints
        grounds:
          - entities.Project.fields.period_end
          - validations.priority_17_interval_sanity
          - errors.ERR_INVALID_PERIOD
        distinguishing_aspect: "The period sanity rule lives at priority 17 with its own error: period_end equal to or before period_start returns 422 ERR_INVALID_PERIOD, distinct from the 400 shape error used for enum and range violations."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /projects"
              payload: { title: "Backwards Award", agency_code: "NIH", sensitivity_level: "STANDARD", award_amount_cents: 10000000, period_start: "2027-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "response code 422 with data.error_id == ERR_INVALID_PERIOD"
            - "GET /projects returns total_count == 0"

      - name: personnel_create_under_unknown_project_returns_404_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints.POST_/projects/{project_id}/personnel
          - validations.priority_4_path_existence
          - errors.ERR_PROJECT_NOT_FOUND
        distinguishing_aspect: "The nested create takes project_id from the path, so an unknown parent is a path-existence 404 (priority 4) that must be answered before the body FK check on investigator_id, even though the body's investigator also does not exist."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /projects/00000000-0000-0000-0000-000000000000/personnel"
              payload: { investigator_id: "11111111-1111-1111-1111-111111111111", role_on_project: "PI", committed_person_months: 1.00 }
              as: SystemAdmin
          assert:
            - "response code 404 with data.error_id == ERR_PROJECT_NOT_FOUND, never ERR_INVESTIGATOR_NOT_FOUND"
            - "GET /project-personnel returns total_count == 0"

      - name: organization_ownership_cycle_rejected
        claim_type: graph
        grounds:
          - entities.ForeignOrganization.fields.parent_organization_id
          - calculations.organization_effective_designation
          - endpoints.POST_/foreign-organizations/{organization_id}/ownership
          - errors.ERR_OWNERSHIP_CYCLE
        distinguishing_aspect: "The self-referential ownership graph must reject a closing edge: pointing the root at its own 100%-owned child would make the upward walk revisit a visited node, so the ownership write returns 422 ERR_OWNERSHIP_CYCLE and leaves both designations untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ORG_A with no parent; ORG_B owned 100.00% by ORG_A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Circular Holdings", country_code: "CN", org_type: "COMPANY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_a_id: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Circular Subsidiary", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${org_a_id}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { org_b_id: $.data.id }
          trigger:
            - call: "POST /foreign-organizations/${org_a_id}/ownership"
              payload: { parent_organization_id: "${org_b_id}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
          assert:
            - "response code 422 with data.error_id == ERR_OWNERSHIP_CYCLE"
            - "ForeignOrganization.${org_a_id}.parent_organization_id is still null"
            - "ForeignOrganization.${org_b_id}.effective_designation == NONE and effective_designation_depth == 0"

      - name: organization_ownership_depth_beyond_eight_hops_rejected
        claim_type: graph
        grounds:
          - calculations.organization_effective_designation
          - endpoints.POST_/foreign-organizations
          - errors.ERR_OWNERSHIP_DEPTH_EXCEEDED
        distinguishing_aspect: "MAX_OWNERSHIP_DEPTH is 8, so a chain of eight controlling hops is accepted and the ninth is refused with 422 ERR_OWNERSHIP_DEPTH_EXCEEDED; an off-by-one guard either rejects the eighth hop or walks the ninth."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A chain ORG_0 <- ORG_1 <- ... <- ORG_8 of nine organizations, each owned 100.00% by the previous one, so ORG_8 sits at exactly depth 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 0", country_code: "CN", org_type: "COMPANY", own_designation: "NONE" }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o0: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 1", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o0}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o1: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 2", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o1}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o2: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 3", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o2}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o3: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 4", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o3}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o4: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 5", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o4}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o5: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 6", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o5}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o6: $.data.id }
            - call: "POST /foreign-organizations"
              payload: { legal_name: "Chain Level 7", country_code: "CN", org_type: "COMPANY", own_designation: "NONE", parent_organization_id: "${o6}", parent_ownership_pct: 100.00 }
              as: ResearchSecurityOfficer
              as_user_id: "rso-1"
              captures: { o7: $.data.id }
