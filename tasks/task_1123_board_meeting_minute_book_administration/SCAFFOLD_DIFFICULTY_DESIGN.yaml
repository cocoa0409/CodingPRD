              as_user_id: "${d1}"
            - call: "POST /resolutions"
              payload: { corporation_id: "${corp}", meeting_id: "${m}", origin: "MEETING", resolution_type: "ORDINARY", title: "Boundary", text: "text" }
              as: CorporateSecretary
              captures: { r: $.data.id }
            - call: "POST /resolutions/${r}/table"
              as: CorporateSecretary
          trigger:
            - call: "POST /resolutions/${r}/open_vote"
