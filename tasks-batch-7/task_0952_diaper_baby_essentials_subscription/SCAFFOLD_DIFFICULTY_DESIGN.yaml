  # =======================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pause_closed_closed_day_intervals_adjacent_ok_shared_day_rejected
        grounds:
          - calculations.pause_overlap_check
          - validations[priority=39]
          - entities.PauseRecord.fields.start_date
          - errors[ERR_PAUSE_OVERLAP]
        distinguishing_aspect: |
          INTERVAL SEMANTICS A on the Subscription resource: CLOSED-CLOSED calendar-day intervals.
          [2026-06-21, 2026-06-25] is accepted against an existing [2026-06-10, 2026-06-20]
          because the days merely touch, while [2026-06-25, 2026-06-30] is rejected because it
          shares the single day 2026-06-25.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z with one ACTIVE subscription."
            - "One SCHEDULED PauseRecord covering 2026-06-10 through 2026-06-20 inclusive."
