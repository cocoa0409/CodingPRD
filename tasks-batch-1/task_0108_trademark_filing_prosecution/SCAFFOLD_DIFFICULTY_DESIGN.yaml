          - entities.TrademarkApplication.fields.published_at
          - errors[ERR_OPPOSITION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Interval semantics A — a single closed interval with inclusive upper bound and no buffer: the
          opposition occupation interval is [published_at, published_at + OPPOSITION_WINDOW_DAYS] on the
          publication resource (TrademarkApplication); filing at 2026-03-04 against a 2026-02-01
          publication (window closes 2026-03-03 inclusive) collides with the closed window edge and is
          rejected ERR_OPPOSITION_WINDOW_CLOSED.
