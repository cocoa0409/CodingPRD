              payload: { current_utc: "2026-09-11T00:00:00Z" }
              as: PlantManager
          assert:
            - "InterruptibleWindow.${win_id}.status == LAPSED (clock passed end_at with no linked event)"
            - "EnergyEvent.${ev_id}.status == EXPIRED (clock passed released_at without activation)"
            - "GET /mills/${mill_id} reports posture == NORMAL"

