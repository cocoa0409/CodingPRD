  - rule_id: resource_temporal_overlap
    instances:
      - name: carriage_term_half_open_overlap_on_station_distributor_slot
        grounds:
          - validations[priority=31]
          - entities.CarriageAgreement.fields.effective_start_utc
          - entities.CarriageAgreement.fields.effective_end_utc
          - endpoints[POST /retrans/offers/{id}/accept]
          - errors.ERR_CARRIAGE_TERM_OVERLAP
        distinguishing_aspect: |
          Resource is the (station_id, distributor_id) carriage slot and the interval semantics are
          HALF-OPEN [start, end): a successor term starting 2029-06-01 while the incumbent runs to
          2030-01-01 is refused, but the same offer accepted with a term starting exactly on
          2030-01-01 is adjacent, not overlapping, and succeeds. The pair of calls isolates the
          boundary instant itself as the only difference.
