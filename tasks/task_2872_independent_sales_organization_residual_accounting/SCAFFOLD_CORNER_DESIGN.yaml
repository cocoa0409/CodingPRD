  - section: calculations
    instances:

      - name: profitability_uses_two_different_chargeback_filters_over_one_event_set
        claim_type: Correct Result
        grounds:
          - calculations.normalize_residual_line
          - calculations.merchant_profitability
          - calculations.residual_split_allocation
          - entities.MerchantProfitability.fields.chargeback_cost_cents
          - entities.MerchantProfitability.fields.agent_chargeable_chargeback_cents
        distinguishing_aspect: "Four chargebacks on one merchant produce two different aggregates from the same event set: chargeback_cost_cents (5000, both liabilities, period 2026-07 only) drives the house profit while agent_chargeable_chargeback_cents (2000, AGENT_CHARGED only) drives the agent basis — so profit_cents 7600 and agent_basis_cents 10600 must differ. The 2026-06 event and the July-occurring event booked to 2026-08 are both excluded, proving period_month and not occurred_on is the filter."
