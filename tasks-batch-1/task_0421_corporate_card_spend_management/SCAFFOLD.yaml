# =============================================================================
# Corporate Card & Spend Management — benchmark seed tables (v1)
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  Corporate Card & Spend Management (Brex/Ramp style): card issuance (virtual/physical) & limit,
  policy & merchant-category control, transaction capture & receipt match, approval workflow & accrual,
  out-of-pocket reimbursement, statement & repayment (charge vs credit), reward/cashback, GL coding & ERP sync

domain_name: corporate-card-spend-management
api_prefix: /

complexity_profile:
  primary_archetype: Ledger reconciliation
  secondary_archetype: Workflow orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity has a top-level collection (/companies, /cards, /transactions, ...);
  # parent/child relationships are expressed by FK fields in the body, not by URL nesting.

  state_machine_shape: parallel
  # Transaction carries two independent dimensions (auth_status x review_status);
  # Card, ApprovalRequest and ReimbursementClaim have revision cycles;
  # Statement is a linear-with-revert lifecycle.

  relationship_patterns:
    - one_to_many        # Company -> Card, Card -> Transaction, Statement -> Transaction
    - cross_aggregate    # ApprovalRequest -> Transaction; Repayment -> Statement; Receipt -> Transaction
    - self_referential   # Employee.manager_employee_id -> Employee.id

  role_model: segregation_of_duties
  # CardholderEmployee initiates spend; Approver approves (and cannot approve own spend);
  # FinanceAdmin runs statements, ERP sync, card issuance; Auditor read-only.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Company
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Company legal name" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency code" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Total corporate charge-card credit ceiling shared across all cards" }
      - { name: billing_model, type: enum, source: input, description: "CHARGE (full balance due each cycle) | CREDIT (revolving with minimum payment); constraints: one of {CHARGE, CREDIT}" }
      - { name: minimum_payment_pct, type: number, source: input, default: 0.10, description: "Fraction of closing balance that is the minimum payment when billing_model=CREDIT; ignored for CHARGE" }
      - { name: reward_rate_default_bps, type: integer, source: input, default: 100, description: "Default cashback rate in basis points (100 bps = 1.0%) for MCCs without a category override" }
      - { name: available_credit_cents, type: integer, source: computed, description: "credit_limit_cents minus open authorization holds minus posted unpaid statement balances; derived, reconciled on every spend/settle/reverse/repayment" }
      - { name: clock_utc, type: datetime, source: system, default: null, description: "Company-scoped simulated wall clock; null until set; advanced via POST /_clock/set_current_utc" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED; constraints: one of {ACTIVE, SUSPENDED}" }

  - name: SpendPolicy
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: name, type: string, source: input, description: "Policy name" }
      - { name: per_transaction_limit_cents, type: integer, source: input, description: "Maximum single-transaction amount permitted under this policy" }
      - { name: approval_threshold_cents, type: integer, source: input, description: "Transactions whose amount_cents > approval_threshold_cents require an ApprovalRequest before review can reach APPROVED" }
      - { name: blocked_mcc_codes, type: array, source: input, default: [], description: "Merchant Category Codes (4-digit strings) hard-blocked under this policy" }
      - { name: mcc_reward_overrides, type: array, source: input, default: [], description: "List of { mcc_code, reward_rate_bps } category cashback overrides" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED; constraints: one of {ACTIVE, ARCHIVED}" }

  - name: Employee
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: email, type: string, source: input, description: "Unique per company among ACTIVE employees" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: employee_role, type: enum, source: input, description: "CARDHOLDER | APPROVER | FINANCE_ADMIN; the business role, distinct from the X-User-Role header; constraints: one of {CARDHOLDER, APPROVER, FINANCE_ADMIN}" }
      - { name: manager_employee_id, type: string, source: input, default: null, description: "FK -> Employee.id; the approver for this employee's spend (self-reference; null for FINANCE_ADMIN)" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | DEACTIVATED; constraints: one of {ACTIVE, DEACTIVATED}" }

  - name: GlAccount
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: gl_code, type: string, source: input, description: "General-ledger account code, unique per company among ACTIVE accounts" }
      - { name: name, type: string, source: input, description: "GL account display name" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | ARCHIVED; constraints: one of {ACTIVE, ARCHIVED}" }

  - name: Card
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the cardholder" }
      - { name: spend_policy_id, type: string, source: input, description: "FK -> SpendPolicy.id; governs limits and MCC blocks for this card" }
      - { name: form_factor, type: enum, source: input, description: "VIRTUAL | PHYSICAL; PHYSICAL cards must be activated before use; constraints: one of {VIRTUAL, PHYSICAL}" }
      - { name: card_limit_cents, type: integer, source: input, description: "Per-card spend ceiling; sum of card_limit_cents across cards may exceed Company.credit_limit_cents (oversubscription allowed)" }
      - { name: held_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents of this card's transactions whose auth_status in {PENDING, CLEARED}; derived, reconciled on every transaction transition" }
      - { name: status, type: enum, source: system, default: null, description: "REQUESTED | ACTIVE | FROZEN | TERMINATED; VIRTUAL starts ACTIVE, PHYSICAL starts REQUESTED; constraints: one of {REQUESTED, ACTIVE, FROZEN, TERMINATED}" }

  - name: Transaction
    parent: Card
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> Card.id" }
      - { name: company_id, type: string, source: system, description: "FK -> Company.id; copied from the card" }
      - { name: statement_id, type: string, source: system, default: null, description: "FK -> Statement.id; assigned when the transaction settles into the company's currently OPEN statement" }
      - { name: merchant_name, type: string, source: input, description: "Merchant display name" }
      - { name: mcc_code, type: string, source: input, description: "4-digit Merchant Category Code" }
      - { name: amount_cents, type: integer, source: input, description: "Authorized amount in cents; must be > 0" }
      - { name: settled_amount_cents, type: integer, source: computed, default: null, description: "Final cleared amount; set on settle, may be <= amount_cents (partial capture); null until settled" }
      - { name: gl_account_id, type: string, source: input, default: null, description: "FK -> GlAccount.id; the GL code assigned during review" }
      - { name: reward_points_cents, type: integer, source: computed, default: 0, description: "Cashback accrued for this transaction in cents; recomputed on settle" }
      - { name: auth_status, type: enum, source: system, default: "PENDING", description: "Authorization dimension: PENDING -> CLEARED -> SETTLED, or -> REVERSED; constraints: one of {PENDING, CLEARED, SETTLED, REVERSED}" }
      - { name: review_status, type: enum, source: system, default: "UNREVIEWED", description: "Compliance dimension: UNREVIEWED -> NEEDS_RECEIPT -> MATCHED -> APPROVED, or -> FLAGGED; evolves independently of auth_status; constraints: one of {UNREVIEWED, NEEDS_RECEIPT, MATCHED, APPROVED, FLAGGED}" }

  - name: Receipt
    parent: Transaction
    common_fields: false
    fields:
      - { name: company_id, type: string, source: system, description: "FK -> Company.id; copied from the transaction" }
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id; the transaction this receipt is matched against" }
      - { name: amount_cents, type: integer, source: input, description: "Receipt total in cents; used for the match-tolerance check" }
      - { name: merchant_name, type: string, source: input, description: "Merchant name printed on the receipt" }
      - { name: match_result, type: enum, source: computed, description: "MATCH | MISMATCH; MATCH when |receipt.amount_cents - tx.amount_cents| <= RECEIPT_TOLERANCE_CENTS; constraints: one of {MATCH, MISMATCH}" }

  - name: ApprovalRequest
    parent: Transaction
    common_fields: true
    fields:
      - { name: transaction_id, type: string, source: input, description: "FK -> Transaction.id" }
      - { name: company_id, type: string, source: system, description: "FK -> Company.id; copied from the transaction" }
      - { name: requester_employee_id, type: string, source: system, description: "FK -> Employee.id; the cardholder whose spend is under approval" }
      - { name: approver_employee_id, type: string, source: input, default: null, description: "FK -> Employee.id; the deciding approver (set on approve/reject, cleared on resubmit)" }
      - { name: decision_note, type: string, source: input, default: null, description: "Approver note recorded on decision" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of times this request cycled back to PENDING via a REJECTED -> PENDING resubmit" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING -> APPROVED | REJECTED; REJECTED -> PENDING (resubmit cycle); constraints: one of {PENDING, APPROVED, REJECTED}" }

  - name: ReimbursementClaim
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the out-of-pocket claimant" }
      - { name: gl_account_id, type: string, source: input, description: "FK -> GlAccount.id; GL coding for the reimbursable expense" }
      - { name: merchant_name, type: string, source: input, description: "Merchant where the out-of-pocket expense occurred" }
      - { name: amount_cents, type: integer, source: input, description: "Claimed reimbursement amount in cents; must be > 0" }
      - { name: receipt_amount_cents, type: integer, source: input, description: "Amount on the attached receipt; reimbursable_cents is capped at this value" }
      - { name: reimbursable_cents, type: integer, source: computed, default: 0, description: "Approved payout in cents; min(amount_cents, receipt_amount_cents, REIMBURSEMENT_CAP_CENTS); set on approve" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT -> SUBMITTED -> APPROVED -> PAID; SUBMITTED -> REJECTED -> DRAFT (revision cycle); constraints: one of {DRAFT, SUBMITTED, APPROVED, REJECTED, PAID}" }

  - name: Statement
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: cycle_index, type: integer, source: system, description: "Monotonic per-company statement cycle counter, starts at 1" }
      - { name: opened_at, type: datetime, source: system, default: null, description: "Company clock_utc at open (null until clock is set)" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Company clock_utc at close" }
      - { name: due_at, type: datetime, source: system, default: null, description: "closed_at + 21 days; set on close" }
      - { name: closing_balance_cents, type: integer, source: computed, default: 0, description: "Total charged this cycle, computed at close per billing_model (accrual vs cash variant)" }
      - { name: minimum_due_cents, type: integer, source: computed, default: 0, description: "Amount that must be repaid by due_at; full balance for CHARGE, floored fraction for CREDIT" }
      - { name: amount_repaid_cents, type: integer, source: computed, default: 0, description: "Sum of CLEARED Repayment.amount_cents allocated to this statement" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN -> CLOSED -> DUE -> PAID | PAST_DUE; PAST_DUE -> PAID; PAID -> DUE (on repayment reversal); constraints: one of {OPEN, CLOSED, DUE, PAID, PAST_DUE}" }

  - name: Repayment
    parent: Statement
    common_fields: true
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> Statement.id; the statement being repaid" }
      - { name: company_id, type: string, source: system, description: "FK -> Company.id; copied from the statement" }
      - { name: amount_cents, type: integer, source: input, description: "Repayment amount in cents; must be > 0" }
      - { name: expected_statement_version, type: integer, source: input, description: "OCC token: the Statement.version the client last observed; rejected with ERR_STALE_VERSION if stale" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED -> CLEARED | FAILED; CLEARED -> REVERSED; constraints: one of {INITIATED, CLEARED, FAILED, REVERSED}" }

  - name: RewardAccount
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: system, description: "FK -> Company.id; one RewardAccount per Company, created with the Company" }
      - { name: accrued_points_cents, type: integer, source: computed, default: 0, description: "Lifetime cashback accrued from settled transactions and paid reimbursements, net of transaction reversals" }
      - { name: redeemed_points_cents, type: integer, source: computed, default: 0, description: "Total cashback redeemed" }
      - { name: balance_points_cents, type: integer, source: computed, default: 0, description: "accrued_points_cents - redeemed_points_cents" }

  - name: SpendAuthorization
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: scope, type: enum, source: input, description: "EMPLOYEE (budget tied to an employee) | CARD (budget tied to a specific card); the two scopes use DIFFERENT interval-overlap semantics; constraints: one of {EMPLOYEE, CARD}" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the employee the pre-authorized budget belongs to (always required)" }
      - { name: card_id, type: string, source: input, default: null, description: "FK -> Card.id; required when scope==CARD, null when scope==EMPLOYEE" }
      - { name: budget_cents, type: integer, source: input, description: "Pre-authorized budget for the window in cents; must be > 0" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the authorization window (ISO 8601)" }
      - { name: window_end, type: datetime, source: input, description: "Exclusive end of the authorization window (half-open [window_start, window_end))" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE -> CONSUMED | CANCELLED; constraints: one of {ACTIVE, CONSUMED, CANCELLED}" }

  - name: ErpSyncBatch
    parent: Company
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> Company.id" }
      - { name: statement_id, type: string, source: input, description: "FK -> Statement.id; the closed statement whose coded entries are exported" }
      - { name: entry_count, type: integer, source: computed, default: 0, description: "Number of GL-coded SETTLED Transaction rows captured into this batch at build time" }
      - { name: total_debits_cents, type: integer, source: computed, default: 0, description: "Sum of settled_amount_cents over the captured transactions" }
      - { name: status, type: enum, source: system, default: "BUILT", description: "BUILT -> POSTED | DISCARDED; constraints: one of {BUILT, POSTED, DISCARDED}" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Card
    initial_state: "REQUESTED (PHYSICAL) | ACTIVE (VIRTUAL)"
    terminal_states: [TERMINATED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: "POST /cards/{cardId}/activate"
        actor: FinanceAdmin
        preconditions:
          - "Card.form_factor == PHYSICAL (VIRTUAL cards are already ACTIVE) — else ERR_INVALID_STATE"
          - "Company.status == ACTIVE — else ERR_COMPANY_SUSPENDED"
        side_effects:
          - "Card.status -> ACTIVE"
          - "increments Card.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /cards/{cardId}/freeze"
        actor: FinanceAdmin
        preconditions:
          - "Card.status == ACTIVE — else ERR_INVALID_STATE"
        side_effects:
          - "Card.status -> FROZEN"
          - "increments Card.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /cards/{cardId}/unfreeze"
        actor: FinanceAdmin
        preconditions:
          - "Card.status == FROZEN — else ERR_INVALID_STATE"
          - "Company.status == ACTIVE — else ERR_COMPANY_SUSPENDED"
        side_effects:
          - "Card.status -> ACTIVE (revision cycle FROZEN->ACTIVE->FROZEN allowed)"
          - "increments Card.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /cards/{cardId}/terminate"
        actor: FinanceAdmin
        preconditions:
          - "Card.status in {ACTIVE, FROZEN} — else ERR_INVALID_STATE"
          - "Card has no transaction with auth_status == PENDING (ERR_CARD_HAS_OPEN_AUTH)"
        side_effects:
          - "Card.status -> TERMINATED"
          - "increments Card.version by 1"
      - from: FROZEN
        to: TERMINATED
        trigger: "POST /cards/{cardId}/terminate"
        actor: FinanceAdmin
        preconditions:
          - "Card.status in {ACTIVE, FROZEN} — else ERR_INVALID_STATE"
          - "Card has no transaction with auth_status == PENDING (ERR_CARD_HAS_OPEN_AUTH)"
        side_effects:
          - "Card.status -> TERMINATED"
          - "increments Card.version by 1"

  - entity: Transaction
    initial_state: "auth_status=PENDING, review_status=UNREVIEWED (parallel dimensions)"
    terminal_states: ["auth_status: SETTLED | REVERSED"]
    note: |
      Transaction carries TWO independent state dimensions. auth_status (PENDING -> CLEARED ->
      SETTLED | REVERSED) tracks the money; review_status (UNREVIEWED -> NEEDS_RECEIPT -> MATCHED ->
      APPROVED | FLAGGED) tracks compliance. They advance independently: a transaction may be
      SETTLED while still UNREVIEWED, or MATCHED while still PENDING.
    transitions:
      # ---- auth dimension ----
      - from: "auth_status=PENDING"
        to: "auth_status=CLEARED"
        trigger: "POST /transactions/{txId}/clear"
        actor: FinanceAdmin
        preconditions:
          - "auth_status == PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "auth_status -> CLEARED (hold remains counted in Card.held_cents and Company.available_credit_cents)"
          - "increments Transaction.version by 1"
      - from: "auth_status=CLEARED"
        to: "auth_status=SETTLED"
        trigger: "POST /transactions/{txId}/settle"
        actor: FinanceAdmin
        preconditions:
          - "auth_status == CLEARED (ERR_INVALID_STATE)"
          - "settled_amount_cents in request, 0 < settled_amount_cents <= amount_cents (ERR_INVALID_AMOUNT)"
          - "Company is ACTIVE, not SUSPENDED (ERR_COMPANY_SUSPENDED)"
        side_effects:
          - "settled_amount_cents set; Transaction.statement_id -> company's OPEN Statement (always exists: one is opened at company creation and a fresh one is opened on every close)"
          - "CASCADE link 1: Card.held_cents drops by amount_cents (hold released, replaced by posted balance)"
          - "CASCADE link 2: because Card.held_cents changed, Company.available_credit recomputed via available_credit (open_holds drops)"
          - "CASCADE link 1b: reward_points_cents computed via reward_accrual (net variant); RewardAccount.accrued_points_cents and balance_points_cents increase by reward_points_cents"
          - "increments Transaction.version by 1"
      - from: "auth_status=PENDING"
        to: "auth_status=REVERSED"
        trigger: "POST /transactions/{txId}/reverse"
        actor: FinanceAdmin
        preconditions:
          - "auth_status in {PENDING, CLEARED} (ERR_INVALID_STATE)"
        side_effects:
          - "auth_status -> REVERSED"
          - "CASCADE: Card.held_cents drops by amount_cents; Company.available_credit_cents increases by amount_cents (compensating invariant: available_credit returns to pre-authorization value)"
          - "increments Transaction.version by 1"
      - from: "auth_status=CLEARED"
        to: "auth_status=REVERSED"
        trigger: "POST /transactions/{txId}/reverse"
        actor: FinanceAdmin
        preconditions:
          - "auth_status in {PENDING, CLEARED} (ERR_INVALID_STATE)"
        side_effects:
          - "auth_status -> REVERSED"
          - "CASCADE: Card.held_cents drops by amount_cents; Company.available_credit_cents increases by amount_cents"
          - "increments Transaction.version by 1"
      # ---- review dimension ----
      - from: "review_status=UNREVIEWED"
        to: "review_status=NEEDS_RECEIPT"
        trigger: "system (automatic on transaction creation when amount_cents > RECEIPT_REQUIRED_THRESHOLD_CENTS)"
        actor: system
        preconditions:
          - "amount_cents > RECEIPT_REQUIRED_THRESHOLD_CENTS (else review_status stays UNREVIEWED)"
        side_effects:
          - "review_status -> NEEDS_RECEIPT"
      - from: "review_status=NEEDS_RECEIPT"
        to: "review_status=MATCHED"
        trigger: "POST /transactions/{txId}/receipts (system on MATCH result)"
        actor: CardholderEmployee
        preconditions:
          - "Receipt.match_result == MATCH (|receipt.amount_cents - tx.amount_cents| <= RECEIPT_TOLERANCE_CENTS) — else review_status stays NEEDS_RECEIPT and the Receipt is recorded with match_result=MISMATCH"
        side_effects:
          - "review_status -> MATCHED"
          - "increments Transaction.version by 1"
      - from: "review_status=UNREVIEWED"
        to: "review_status=MATCHED"
        trigger: "POST /transactions/{txId}/receipts (system on MATCH; small-amount tx that skipped NEEDS_RECEIPT)"
        actor: CardholderEmployee
        preconditions:
          - "amount_cents <= RECEIPT_REQUIRED_THRESHOLD_CENTS AND Receipt.match_result == MATCH"
        side_effects:
          - "review_status -> MATCHED"
          - "increments Transaction.version by 1"
      - from: "review_status=MATCHED"
        to: "review_status=APPROVED"
        trigger: "POST /transactions/{txId}/approve-review"
        actor: Approver
        preconditions:
          - "review_status == MATCHED (ERR_RECEIPT_REQUIRED if NEEDS_RECEIPT/UNREVIEWED)"
          - "Transaction.gl_account_id is set AND the referenced GlAccount is ACTIVE (ERR_GL_CODE_REQUIRED)"
          - "If Transaction.amount_cents > SpendPolicy.approval_threshold_cents then an ApprovalRequest for this transaction MUST be in status APPROVED (ERR_APPROVAL_REQUIRED) — cross-entity dependency on ApprovalRequest"
          - "Approver (X-User-ID) is not the cardholder employee of the transaction's card (segregation of duties: ERR_SELF_APPROVAL)"
        side_effects:
          - "review_status -> APPROVED"
          - "increments Transaction.version by 1"
      - from: "review_status=MATCHED"
        to: "review_status=FLAGGED"
        trigger: "POST /transactions/{txId}/flag"
        actor: Approver
        preconditions:
          - "Approver (X-User-ID) is not the cardholder employee (ERR_SELF_APPROVAL)"
        side_effects:
          - "review_status -> FLAGGED"
          - "increments Transaction.version by 1"
      - from: "review_status=NEEDS_RECEIPT"
        to: "review_status=FLAGGED"
        trigger: "POST /transactions/{txId}/flag"
        actor: Approver
        preconditions:
          - "Approver (X-User-ID) is not the cardholder employee (ERR_SELF_APPROVAL)"
        side_effects:
          - "review_status -> FLAGGED"
          - "increments Transaction.version by 1"

  - entity: ApprovalRequest
    initial_state: PENDING
    terminal_states: [APPROVED]
    note: "Cyclic: a REJECTED request may be resubmitted back to PENDING, incrementing revision_count."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /approval-requests/{arId}/approve"
        actor: Approver
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "Approver (X-User-ID) is not the requester_employee_id (ERR_SELF_APPROVAL)"
          - "Transaction auth_status != REVERSED (ERR_INVALID_STATE) — cross-entity dependency on Transaction"
        side_effects:
          - "status -> APPROVED; approver_employee_id set to X-User-ID"
          - "increments ApprovalRequest.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /approval-requests/{arId}/reject"
        actor: Approver
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "Approver (X-User-ID) is not the requester_employee_id (ERR_SELF_APPROVAL)"
        side_effects:
          - "status -> REJECTED; approver_employee_id set to X-User-ID"
          - "increments ApprovalRequest.version by 1"
      - from: REJECTED
        to: PENDING
        trigger: "POST /approval-requests/{arId}/resubmit"
        actor: CardholderEmployee
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE)"
          - "X-User-ID == requester_employee_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "status -> PENDING; revision_count += 1; approver_employee_id cleared to null"
          - "increments ApprovalRequest.version by 1"

  - entity: ReimbursementClaim
    initial_state: DRAFT
    terminal_states: [PAID]
    note: "Revision cycle: a REJECTED claim returns to DRAFT for editing and re-submission."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reimbursement-claims/{claimId}/submit"
        actor: CardholderEmployee
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "X-User-ID == ReimbursementClaim.employee_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "status -> SUBMITTED"
          - "increments ReimbursementClaim.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reimbursement-claims/{claimId}/approve"
        actor: Approver
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "Approver (X-User-ID) is not the claimant employee_id (ERR_SELF_APPROVAL)"
          - "GlAccount referenced by gl_account_id is ACTIVE (ERR_GL_CODE_REQUIRED)"
        side_effects:
          - "reimbursable_cents computed via reimbursable_amount = min(amount_cents, receipt_amount_cents, REIMBURSEMENT_CAP_CENTS)"
          - "status -> APPROVED"
          - "increments ReimbursementClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /reimbursement-claims/{claimId}/reject"
        actor: Approver
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "Approver (X-User-ID) is not the claimant employee_id (ERR_SELF_APPROVAL)"
        side_effects:
          - "status -> REJECTED"
          - "increments ReimbursementClaim.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /reimbursement-claims/{claimId}/revise"
        actor: CardholderEmployee
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE)"
          - "X-User-ID == ReimbursementClaim.employee_id (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "status -> DRAFT (revision cycle)"
          - "increments ReimbursementClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /reimbursement-claims/{claimId}/pay"
        actor: FinanceAdmin
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> PAID"
          - "CASCADE: RewardAccount.accrued_points_cents and balance_points_cents increase by round_half_up(reimbursable_cents * Company.reward_rate_default_bps / 10000)"
          - "increments ReimbursementClaim.version by 1"

  - entity: Statement
    initial_state: OPEN
    terminal_states: [PAID]
    note: "Linear-with-revert: a DUE statement that misses its due date becomes PAST_DUE; both DUE and PAST_DUE can reach PAID, and a PAID statement reverts to DUE when a cleared repayment is reversed below minimum_due."
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /statements/{stmtId}/close"
        actor: FinanceAdmin
        preconditions:
          - "Statement.status == OPEN (ERR_INVALID_STATE)"
          - "Company.clock_utc is set (ERR_CLOCK_NOT_SET)"
        side_effects:
          - "closed_at = Company.clock_utc; due_at = closed_at + 21 days"
          - "closing_balance_cents computed via statement_balance (accrual vs cash variant per billing_model)"
          - "minimum_due_cents computed via minimum_due"
          - "CASCADE: posted_unpaid component of Company.available_credit_cents increases (closing_balance now posted)"
          - "CASCADE: a new OPEN Statement with cycle_index+1 is created for the company"
          - "increments Statement.version by 1"
      - from: CLOSED
        to: DUE
        trigger: "POST /statements/{stmtId}/issue"
        actor: FinanceAdmin
        preconditions:
          - "status == CLOSED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DUE (invoice issued to company)"
          - "increments Statement.version by 1"
      - from: DUE
        to: PAID
        trigger: "system (automatic in Repayment clear when amount_repaid_cents >= minimum_due_cents)"
        actor: system
        preconditions:
          - "amount_repaid_cents >= minimum_due_cents"
        side_effects:
          - "status -> PAID"
          - "increments Statement.version by 1"
      - from: DUE
        to: PAST_DUE
        trigger: "system (automatic in POST /_clock/set_current_utc when clock_utc > due_at and amount_repaid_cents < minimum_due_cents)"
        actor: system
        preconditions:
          - "Company.clock_utc > due_at AND amount_repaid_cents < minimum_due_cents"
        side_effects:
          - "status -> PAST_DUE"
          - "increments Statement.version by 1"
      - from: PAST_DUE
        to: PAID
        trigger: "system (automatic in Repayment clear when amount_repaid_cents >= minimum_due_cents)"
        actor: system
        preconditions:
          - "amount_repaid_cents >= minimum_due_cents"
        side_effects:
          - "status -> PAID"
          - "increments Statement.version by 1"
      - from: PAID
        to: DUE
        trigger: "system (automatic in Repayment reverse when amount_repaid_cents < minimum_due_cents)"
        actor: system
        preconditions:
          - "amount_repaid_cents < minimum_due_cents after the reversal"
        side_effects:
          - "status -> DUE (compensation: a reversed repayment un-pays the statement)"
          - "increments Statement.version by 1"

  - entity: Repayment
    initial_state: INITIATED
    terminal_states: [FAILED, REVERSED]
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /repayments/{repaymentId}/clear"
        actor: FinanceAdmin
        preconditions:
          - "Repayment.status == INITIATED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> CLEARED"
          - "CASCADE link 1: Statement.amount_repaid_cents increases by amount_cents"
          - "CASCADE link 2: because amount_repaid_cents changed, Company.available_credit_cents increases by amount_cents (posted_unpaid drops)"
          - "CASCADE link 2b: if Statement.amount_repaid_cents >= minimum_due_cents, Statement (DUE or PAST_DUE) -> PAID"
          - "increments Repayment.version by 1; increments Statement.version by 1"
      - from: INITIATED
        to: FAILED
        trigger: "POST /repayments/{repaymentId}/fail"
        actor: FinanceAdmin
        preconditions:
          - "Repayment.status == INITIATED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> FAILED"
          - "increments Repayment.version by 1"
      - from: CLEARED
        to: REVERSED
        trigger: "POST /repayments/{repaymentId}/reverse"
        actor: FinanceAdmin
        preconditions:
          - "Repayment.status == CLEARED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REVERSED"
          - "CASCADE (compensating invariant): Statement.amount_repaid_cents decreases by amount_cents; Company.available_credit_cents decreases by amount_cents; if Statement was PAID and amount_repaid_cents now < minimum_due_cents, Statement -> DUE"
          - "increments Repayment.version by 1; increments Statement.version by 1"

  - entity: SpendAuthorization
    initial_state: ACTIVE
    terminal_states: [CONSUMED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "POST /spend-authorizations/{authId}/consume"
        actor: FinanceAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "status -> CONSUMED"
          - "increments SpendAuthorization.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /spend-authorizations/{authId}/cancel"
        actor: FinanceAdmin
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "status -> CANCELLED (frees its window so a later authorization may overlap it)"
          - "increments SpendAuthorization.version by 1"

  - entity: ErpSyncBatch
    initial_state: BUILT
    terminal_states: [POSTED, DISCARDED]
    transitions:
      - from: BUILT
        to: POSTED
        trigger: "POST /erp-sync-batches/{batchId}/post"
        actor: FinanceAdmin
        preconditions:
          - "status == BUILT (ERR_INVALID_STATE)"
        side_effects:
          - "status -> POSTED"
          - "increments ErpSyncBatch.version by 1"
      - from: BUILT
        to: DISCARDED
        trigger: "POST /erp-sync-batches/{batchId}/discard"
        actor: FinanceAdmin
        preconditions:
          - "status == BUILT (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DISCARDED"
          - "increments ErpSyncBatch.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: repayment-create-stale-statement
    parent_entity: Statement
    write_endpoint: "POST /repayments"
    occ_field: "expected_statement_version"
    description: |
      Creating a Repayment against a Statement whose version has advanced since the client last
      observed it is rejected. A prior Repayment that already cleared (or was reversed) legitimately
      advanced the Statement's version and changed amount_repaid_cents/status; a create that still
      carries the pre-advance version is operating on a stale view of how much remains due, and is
      rejected with a stale-version error.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: statement_balance
    trigger: "Statement CLOSED transition (POST /statements/{stmtId}/close)"
    algorithm: aggregation
    formula: |
      # Dual-variant: the closing balance of the SAME set of transactions differs by billing_model.
      # Candidate set: this company's Transactions whose statement_id == this Statement.id (SETTLED) OR
      # that are CLEARED-not-SETTLED at close (accrual sweeps these in; cash leaves them open).
      # ACCRUAL variant (billing_model == CHARGE):
      #   include every SETTLED T assigned to this statement (contributes settled_amount_cents) PLUS
      #   every CLEARED-not-SETTLED T of the company at close (contributes amount_cents, authorized);
      #   at close, accrual ALSO assigns those CLEARED transactions' statement_id to this statement.
      #   closing_balance_cents = sum( settled_amount_cents for SETTLED ) + sum( amount_cents for CLEARED-not-SETTLED )
      # CASH variant (billing_model == CREDIT):
      #   include ONLY SETTLED T assigned to this statement (cash-basis);
      #   closing_balance_cents = sum( settled_amount_cents for SETTLED T )
      # REVERSED transactions are excluded under both variants.
      # The two variants produce DIFFERENT closing_balance_cents whenever a CLEARED-but-not-SETTLED
      # transaction exists for the company at close.
    input_set: "Company's Transactions: SETTLED with statement_id == Statement.id (both variants) plus CLEARED-not-SETTLED (accrual only)"
    constants: {}
    precision: "integer cents; no rounding (all inputs already integer cents)"
    variants:
      - name: accrual
        when: "Company.billing_model == CHARGE"
        difference: "Sweeps CLEARED-not-SETTLED transactions into the cycle at amount_cents (authorized)."
      - name: cash
        when: "Company.billing_model == CREDIT"
        difference: "Includes only SETTLED; CLEARED-but-unsettled spend does NOT post this cycle."

  - name: minimum_due
    trigger: "Statement CLOSED transition, immediately after statement_balance"
    algorithm: threshold
    formula: |
      # circular-looking dependency, pinned: minimum is a function of closing_balance, but a floor
      # applies when the balance is small. Evaluation order is FIXED: statement_balance first,
      # then minimum_due reads the just-computed closing_balance_cents.
      if Company.billing_model == CHARGE:
        minimum_due_cents = closing_balance_cents                  # full balance due
      else:  # CREDIT
        if closing_balance_cents == 0:
          minimum_due_cents = 0
        elif closing_balance_cents <= MIN_PAYMENT_FLOOR_CENTS:
          minimum_due_cents = closing_balance_cents                # below the floor: pay it all
        else:
          raw = ceil(closing_balance_cents * Company.minimum_payment_pct)   # round UP to whole cents
          minimum_due_cents = max(raw, MIN_PAYMENT_FLOOR_CENTS)
    input_set: "Single Statement; closing_balance_cents from statement_balance"
    constants:
      MIN_PAYMENT_FLOOR_CENTS: 2500   # $25 minimum-payment floor for CREDIT model
    precision: "ceil to whole cents (round UP) for the raw fraction, then floor/cap logic"

  - name: reward_accrual
    trigger: "Transaction settle transition (POST /transactions/{txId}/settle)"
    algorithm: tiered_pricing
    formula: |
      # >=3 inputs with non-linear interaction: settled amount, MCC override lookup, company default,
      # and a per-transaction cashback cap selected via nested min.
      base_amount = Transaction.settled_amount_cents          # NOT amount_cents (net variant accrues on what cleared)
      # rate selection: MCC override on the card's SpendPolicy wins; else company default
      if mcc_code is a key in SpendPolicy.mcc_reward_overrides:
        rate_bps = SpendPolicy.mcc_reward_overrides[mcc_code].reward_rate_bps
      else:
        rate_bps = Company.reward_rate_default_bps
      raw_reward = round_half_up(base_amount * rate_bps / 10000)
      reward_points_cents = min(raw_reward, MAX_REWARD_PER_TXN_CENTS)   # nested cap
    input_set: "Single Transaction at settle; rate from SpendPolicy override or Company default"
    constants:
      MAX_REWARD_PER_TXN_CENTS: 5000   # $50 cashback cap per transaction
    precision: "round_half_up to whole cents BEFORE applying the per-transaction cap"
    variants:
      - name: gross
        when: "hypothetical full-authorization basis (documents the alternative; NOT used by the system)"
        difference: "Would accrue on amount_cents (authorized) rather than settled_amount_cents."
      - name: net
        when: "always — the system uses this variant"
        difference: "Accrues on settled_amount_cents, so a partial capture earns less than the authorized amount would."

  - name: statement_cashback_total
    trigger: "GET /statements/{stmtId}/cashback-summary (computed read)"
    algorithm: aggregation
    formula: |
      # Nested-rounding ORDER matters and is PINNED here.
      # PINNED ORDER: round PER-TRANSACTION first (reward_accrual already rounds each
      # Transaction.reward_points_cents at settle), THEN SUM the already-rounded per-transaction
      # values. We do NOT sum raw products and round once.
      # statement_cashback_cents = sum( T.reward_points_cents
      #                                 for T where T.statement_id == stmt.id and T.auth_status == SETTLED )
      statement_cashback_cents = sum(T.reward_points_cents for eligible T)
    input_set: "Transactions with statement_id == Statement.id and auth_status == SETTLED"
    constants: {}
    precision: "per-transaction values already round_half_up at settle; the sum adds integers (round-per-line-then-sum, NOT sum-then-round)"

  - name: available_credit
    trigger: "every transaction transition (clear/settle/reverse), statement close, every repayment clear/reverse (derived-field reconciliation)"
    algorithm: aggregation
    formula: |
      # Conserved-quantity derived field. Reconciled on each relevant mutation.
      open_holds = sum(T.amount_cents for T where T.company_id == company.id and T.auth_status in {PENDING, CLEARED})
      posted_unpaid = sum( S.closing_balance_cents - S.amount_repaid_cents
                           for S in Statements of company where S.status in {CLOSED, DUE, PAST_DUE} )
      available_credit_cents = Company.credit_limit_cents - open_holds - posted_unpaid
    input_set: "All Transactions (auth_status PENDING/CLEARED) and all CLOSED/DUE/PAST_DUE Statements of the company"
    constants: {}
    precision: "integer cents"

  - name: reimbursable_amount
    trigger: "ReimbursementClaim approve transition (POST /reimbursement-claims/{claimId}/approve)"
    algorithm: threshold
    formula: |
      reimbursable_cents = min(amount_cents, receipt_amount_cents, REIMBURSEMENT_CAP_CENTS)
    input_set: "Single ReimbursementClaim"
    constants:
      REIMBURSEMENT_CAP_CENTS: 200000   # $2,000 cap per claim
    precision: "integer cents"

# =============================================================================
# Domain constants referenced across §1.2/§1.3/§1.4
# =============================================================================
domain_constants:
  RECEIPT_REQUIRED_THRESHOLD_CENTS: 7500   # $75 — transactions above this require a receipt (NEEDS_RECEIPT)
  RECEIPT_TOLERANCE_CENTS: 100             # $1 — receipt-match tolerance (|receipt - tx| <= 100 => MATCH)
  STATEMENT_DUE_DAYS: 21                   # due_at = closed_at + 21 days
  MIN_PAYMENT_FLOOR_CENTS: 2500
  MAX_REWARD_PER_TXN_CENTS: 5000
  REIMBURSEMENT_CAP_CENTS: 200000
  AUTH_BUFFER_DAYS: 2                       # required gap between CARD-scope authorization windows

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve (company before child where both appear in body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed; required fields present; enum values valid"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_constraint
    check: "Monetary amounts (amount_cents, settled_amount_cents, receipt_amount_cents, repayment amount_cents, redeem amount_cents) must be > 0; on settle, settled_amount_cents <= amount_cents"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "create transaction, settle, create repayment, create/submit reimbursement, create receipt, redeem"

  - priority: 6
    category: business_safety
    check: "Transaction MCC must not be in the card's SpendPolicy.blocked_mcc_codes (merchant-category control)"
    error_id: ERR_MCC_BLOCKED
    http_status: 409
    applies_to: "POST /cards/{cardId}/transactions"

  - priority: 7
    category: state
    check: "Card must be ACTIVE to capture a transaction (REQUESTED physical / FROZEN / TERMINATED reject)"
    error_id: ERR_CARD_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cards/{cardId}/transactions"

  - priority: 8
    category: business_constraint
    check: "Transaction amount_cents must not exceed the card's SpendPolicy.per_transaction_limit_cents"
    error_id: ERR_PER_TXN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cards/{cardId}/transactions"

  - priority: 9
    category: business_constraint
    check: "Transaction amount_cents must not exceed Card.card_limit_cents - Card.held_cents (remaining card headroom)"
    error_id: ERR_CARD_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cards/{cardId}/transactions"

  - priority: 10
    category: business_fiscal
    check: "Transaction amount_cents must not exceed Company.available_credit_cents (company credit pool)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 402
    applies_to: "POST /cards/{cardId}/transactions"

  - priority: 11
    category: state
    check: "Target resource must be in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 12
    category: business_referential
    check: "Transaction review approval requires gl_account_id set to an ACTIVE GlAccount; reimbursement approval requires its gl_account_id ACTIVE"
    error_id: ERR_GL_CODE_REQUIRED
    http_status: 409
    applies_to: "transaction approve-review, reimbursement approve"

  - priority: 13
    category: business_referential
    check: "Approving review of a high-value transaction (amount_cents > SpendPolicy.approval_threshold_cents) requires an APPROVED ApprovalRequest"
    error_id: ERR_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /transactions/{txId}/approve-review"

  - priority: 14
    category: business_safety
    check: "Approving review requires a MATCHED receipt; NEEDS_RECEIPT/UNREVIEWED blocks approval"
    error_id: ERR_RECEIPT_REQUIRED
    http_status: 409
    applies_to: "POST /transactions/{txId}/approve-review"

  - priority: 15
    category: business_safety
    check: "Segregation of duties: the deciding Approver's X-User-ID must not equal the cardholder/requester/claimant employee id"
    error_id: ERR_SELF_APPROVAL
    http_status: 403
    applies_to: "transaction approve-review, transaction flag, approval-request approve/reject, reimbursement approve/reject"

  - priority: 16
    category: state
    check: "OCC: expected_statement_version must equal current Statement.version on repayment create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /repayments"

  - priority: 17
    category: state
    check: "Settle requires the company to be ACTIVE (a SUSPENDED company cannot post new spend to its statement). Card activation/unfreeze and settle all reject when Company.status==SUSPENDED."
    error_id: ERR_COMPANY_SUSPENDED
    http_status: 409
    applies_to: "POST /transactions/{txId}/settle, POST /cards/{cardId}/activate, POST /cards/{cardId}/unfreeze"

  - priority: 18
    category: business_constraint
    check: "Statement close requires Company.clock_utc to be set"
    error_id: ERR_CLOCK_NOT_SET
    http_status: 409
    applies_to: "POST /statements/{stmtId}/close"

  - priority: 19
    category: business_temporal
    check: "EMPLOYEE-scope SpendAuthorization window [window_start, window_end) must not overlap any ACTIVE EMPLOYEE-scope authorization for the same employee_id. Overlap test (half-open, touching allowed): new.window_start < existing.window_end AND existing.window_start < new.window_end. CANCELLED/CONSUMED authorizations do not block."
    error_id: ERR_AUTH_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /spend-authorizations (scope==EMPLOYEE)"

  - priority: 20
    category: business_temporal
    check: "CARD-scope SpendAuthorization window must keep a buffer gap of AUTH_BUFFER_DAYS from any ACTIVE CARD-scope authorization for the same card_id. Buffered test: reject unless new.window_start >= existing.window_end + AUTH_BUFFER_DAYS OR new.window_end + AUTH_BUFFER_DAYS <= existing.window_start (i.e. adjacency within the buffer is rejected, unlike the EMPLOYEE scope which allows touching)."
    error_id: ERR_AUTH_WINDOW_TOO_CLOSE
    http_status: 409
    applies_to: "POST /spend-authorizations (scope==CARD)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Company ----
  - method: POST
    path: "/companies"
    description: "Create a Company (also creates its RewardAccount and first OPEN Statement)"
    roles: [FinanceAdmin]
    code: 201
    input: ["legal_name", "credit_limit_cents", "billing_model", "currency?", "minimum_payment_pct?", "reward_rate_default_bps?"]
    output: Company
    side_effects:
      - "status=ACTIVE; available_credit_cents=credit_limit_cents; clock_utc=null"
      - "CASCADE: a RewardAccount is created for the company with zero balances"
      - "CASCADE: the company's first OPEN Statement (cycle_index=1) is created (opened_at=null until clock set)"

  - method: GET
    path: "/companies/{companyId}"
    description: "Get a Company (includes computed available_credit_cents)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Company
    side_effects: []

  - method: GET
    path: "/companies"
    description: "List Companies"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["status?"]
    output: "Company[]"
    side_effects: []

  - method: POST
    path: "/companies/{companyId}/suspend"
    description: "Suspend a Company (blocks card activation/unfreeze)"
    roles: [FinanceAdmin]
    code: 200
    input: ["reason?"]
    output: Company
    side_effects: ["status -> SUSPENDED; increments Company.version by 1"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set a company's simulated clock; triggers DUE->PAST_DUE evaluation"
    roles: [FinanceAdmin]
    code: 200
    input: ["company_id", "to_iso8601"]
    output: Company
    side_effects:
      - "Company.clock_utc = to_iso8601"
      - "CASCADE: every DUE Statement with clock_utc > due_at and amount_repaid_cents < minimum_due_cents -> PAST_DUE (Statement.version increments)"
      - "increments Company.version by 1"

  # ---- SpendPolicy ----
  - method: POST
    path: "/spend-policies"
    description: "Create a SpendPolicy"
    roles: [FinanceAdmin]
    code: 201
    input: ["company_id", "name", "per_transaction_limit_cents", "approval_threshold_cents", "blocked_mcc_codes?", "mcc_reward_overrides?"]
    output: SpendPolicy
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/spend-policies/{policyId}"
    description: "Get a SpendPolicy"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: SpendPolicy
    side_effects: []

  - method: GET
    path: "/spend-policies"
    description: "List SpendPolicies (reverse-reachability for SpendPolicy.company_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "status?"]
    output: "SpendPolicy[]"
    side_effects: []

  # ---- Employee ----
  - method: POST
    path: "/employees"
    description: "Create an Employee"
    roles: [FinanceAdmin]
    code: 201
    input: ["company_id", "email", "full_name", "employee_role", "manager_employee_id?"]
    output: Employee
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_EMAIL if email reused among ACTIVE employees of the company"]

  - method: GET
    path: "/employees/{employeeId}"
    description: "Get an Employee"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Employee
    side_effects: []

  - method: GET
    path: "/employees"
    description: "List Employees (reverse-reachability for Employee.company_id and self-ref Employee.manager_employee_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "manager_employee_id?", "employee_role?", "status?"]
    output: "Employee[]"
    side_effects: []

  # ---- GlAccount ----
  - method: POST
    path: "/gl-accounts"
    description: "Create a GlAccount"
    roles: [FinanceAdmin]
    code: 201
    input: ["company_id", "gl_code", "name"]
    output: GlAccount
    side_effects: ["status=ACTIVE; ERR_DUPLICATE_GL_CODE if gl_code reused among ACTIVE accounts of the company"]

  - method: GET
    path: "/gl-accounts/{glAccountId}"
    description: "Get a GlAccount"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: GlAccount
    side_effects: []

  - method: GET
    path: "/gl-accounts"
    description: "List GlAccounts (reverse-reachability for GlAccount.company_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "status?"]
    output: "GlAccount[]"
    side_effects: []

  # ---- Card ----
  - method: POST
    path: "/cards"
    description: "Issue a Card (virtual=ACTIVE, physical=REQUESTED)"
    roles: [FinanceAdmin]
    code: 201
    input: ["company_id", "employee_id", "spend_policy_id", "form_factor", "card_limit_cents"]
    output: Card
    side_effects:
      - "status=ACTIVE if VIRTUAL else REQUESTED; held_cents=0"
      - "ERR_NOT_FOUND if company_id/employee_id/spend_policy_id absent"

  - method: GET
    path: "/cards/{cardId}"
    description: "Get a Card (includes computed held_cents)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Card
    side_effects: []

  - method: GET
    path: "/cards"
    description: "List Cards (reverse-reachability for Card.company_id, Card.employee_id, Card.spend_policy_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "employee_id?", "spend_policy_id?", "status?"]
    output: "Card[]"
    side_effects: []

  - method: POST
    path: "/cards/{cardId}/activate"
    description: "Activate a physical Card"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Card
    side_effects: ["status -> ACTIVE; increments Card.version by 1"]

  - method: POST
    path: "/cards/{cardId}/freeze"
    description: "Freeze a Card"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Card
    side_effects: ["status -> FROZEN; increments Card.version by 1"]

  - method: POST
    path: "/cards/{cardId}/unfreeze"
    description: "Unfreeze a Card"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Card
    side_effects: ["status -> ACTIVE; increments Card.version by 1"]

  - method: POST
    path: "/cards/{cardId}/terminate"
    description: "Terminate a Card"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Card
    side_effects: ["status -> TERMINATED; increments Card.version by 1"]

  # ---- Transaction ----
  - method: POST
    path: "/cards/{cardId}/transactions"
    description: "Capture a Transaction (authorization) on a card"
    roles: [CardholderEmployee, FinanceAdmin]
    code: 201
    input: ["merchant_name", "mcc_code", "amount_cents", "gl_account_id?"]
    output: Transaction
    side_effects:
      - "auth_status=PENDING; Card.held_cents and Company.available_credit_cents recomputed (hold placed)"
      - "review_status=NEEDS_RECEIPT if amount_cents > RECEIPT_REQUIRED_THRESHOLD_CENTS else UNREVIEWED"
      - "validations ERR_MCC_BLOCKED, ERR_CARD_NOT_ACTIVE, ERR_PER_TXN_LIMIT_EXCEEDED, ERR_CARD_LIMIT_EXCEEDED, ERR_INSUFFICIENT_CREDIT apply in priority order"

  - method: GET
    path: "/transactions/{txId}"
    description: "Get a Transaction"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Transaction
    side_effects: []

  - method: GET
    path: "/transactions"
    description: "List Transactions (reverse-reachability for Transaction.card_id, company_id, statement_id, gl_account_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["card_id?", "company_id?", "statement_id?", "gl_account_id?", "auth_status?", "review_status?"]
    output: "Transaction[]"
    side_effects: []

  - method: PATCH
    path: "/transactions/{txId}"
    description: "Assign or change the GL code on a Transaction (GL coding)"
    roles: [CardholderEmployee, FinanceAdmin]
    code: 200
    input: ["gl_account_id"]
    output: Transaction
    side_effects: ["gl_account_id set; increments Transaction.version by 1; ERR_GL_CODE_REQUIRED if GlAccount not ACTIVE"]

  - method: POST
    path: "/transactions/{txId}/clear"
    description: "Advance auth dimension PENDING -> CLEARED"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: ["auth_status -> CLEARED; increments Transaction.version by 1"]

  - method: POST
    path: "/transactions/{txId}/settle"
    description: "Advance auth dimension CLEARED -> SETTLED; posts to statement and accrues reward"
    roles: [FinanceAdmin]
    code: 200
    input: ["settled_amount_cents"]
    output: Transaction
    side_effects:
      - "settled_amount_cents set; statement_id assigned to company's OPEN statement; auth_status -> SETTLED"
      - "CASCADE: Card.held_cents drops; Company.available_credit_cents recomputed; reward_points_cents computed; RewardAccount accrues"
      - "increments Transaction.version by 1"

  - method: POST
    path: "/transactions/{txId}/reverse"
    description: "Reverse a PENDING/CLEARED auth (compensating: releases hold)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "auth_status -> REVERSED"
      - "CASCADE: Card.held_cents drops by amount_cents; Company.available_credit_cents increases by amount_cents"
      - "increments Transaction.version by 1"

  - method: POST
    path: "/transactions/{txId}/receipts"
    description: "Upload a Receipt and run receipt-match (review dimension toward MATCHED)"
    roles: [CardholderEmployee, FinanceAdmin]
    code: 201
    input: ["amount_cents", "merchant_name"]
    output: Receipt
    side_effects:
      - "match_result computed (MATCH if |receipt.amount_cents - tx.amount_cents| <= RECEIPT_TOLERANCE_CENTS)"
      - "CASCADE: on MATCH, Transaction.review_status -> MATCHED and Transaction.version increments; on MISMATCH review_status unchanged"

  - method: GET
    path: "/transactions/{txId}/receipts"
    description: "List Receipts for a Transaction"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: "Receipt[]"
    side_effects: []

  - method: GET
    path: "/receipts/{receiptId}"
    description: "Get a Receipt"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: GET
    path: "/receipts"
    description: "List Receipts (reverse-reachability for Receipt.company_id and Receipt.transaction_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "transaction_id?"]
    output: "Receipt[]"
    side_effects: []

  - method: POST
    path: "/transactions/{txId}/approve-review"
    description: "Advance review dimension MATCHED -> APPROVED (segregation of duties + GL + approval gate)"
    roles: [Approver]
    code: 200
    input: []
    output: Transaction
    side_effects: ["review_status -> APPROVED; increments Transaction.version by 1"]

  - method: POST
    path: "/transactions/{txId}/flag"
    description: "Flag a Transaction for review (review dimension -> FLAGGED)"
    roles: [Approver]
    code: 200
    input: ["note?"]
    output: Transaction
    side_effects: ["review_status -> FLAGGED; increments Transaction.version by 1"]

  # ---- ApprovalRequest ----
  - method: POST
    path: "/transactions/{txId}/approval-requests"
    description: "Open an ApprovalRequest for a high-value Transaction"
    roles: [CardholderEmployee, FinanceAdmin]
    code: 201
    input: []
    output: ApprovalRequest
    side_effects:
      - "status=PENDING; requester_employee_id = the transaction card's employee_id; revision_count=0"
      - "ERR_APPROVAL_NOT_NEEDED if Transaction.amount_cents <= SpendPolicy.approval_threshold_cents"

  - method: GET
    path: "/approval-requests/{arId}"
    description: "Get an ApprovalRequest"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: ApprovalRequest
    side_effects: []

  - method: GET
    path: "/approval-requests"
    description: "List ApprovalRequests (reverse-reachability for transaction_id, company_id, requester_employee_id, approver_employee_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["transaction_id?", "company_id?", "requester_employee_id?", "approver_employee_id?", "status?"]
    output: "ApprovalRequest[]"
    side_effects: []

  - method: POST
    path: "/approval-requests/{arId}/approve"
    description: "Approve an ApprovalRequest (Approver, not the requester)"
    roles: [Approver]
    code: 200
    input: ["decision_note?"]
    output: ApprovalRequest
    side_effects: ["status -> APPROVED; approver_employee_id set; increments ApprovalRequest.version by 1"]

  - method: POST
    path: "/approval-requests/{arId}/reject"
    description: "Reject an ApprovalRequest (Approver, not the requester)"
    roles: [Approver]
    code: 200
    input: ["decision_note?"]
    output: ApprovalRequest
    side_effects: ["status -> REJECTED; approver_employee_id set; increments ApprovalRequest.version by 1"]

  - method: POST
    path: "/approval-requests/{arId}/resubmit"
    description: "Resubmit a REJECTED ApprovalRequest (cardholder/requester only) — cyclic"
    roles: [CardholderEmployee]
    code: 200
    input: []
    output: ApprovalRequest
    side_effects: ["status -> PENDING; revision_count += 1; approver_employee_id cleared; increments ApprovalRequest.version by 1"]

  # ---- ReimbursementClaim ----
  - method: POST
    path: "/reimbursement-claims"
    description: "Create an out-of-pocket ReimbursementClaim (DRAFT)"
    roles: [CardholderEmployee, FinanceAdmin]
    code: 201
    input: ["company_id", "employee_id", "gl_account_id", "merchant_name", "amount_cents", "receipt_amount_cents"]
    output: ReimbursementClaim
    side_effects: ["status=DRAFT; reimbursable_cents=0"]

  - method: GET
    path: "/reimbursement-claims/{claimId}"
    description: "Get a ReimbursementClaim"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []

  - method: GET
    path: "/reimbursement-claims"
    description: "List ReimbursementClaims (reverse-reachability for company_id, employee_id, gl_account_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "employee_id?", "gl_account_id?", "status?"]
    output: "ReimbursementClaim[]"
    side_effects: []

  - method: POST
    path: "/reimbursement-claims/{claimId}/submit"
    description: "Submit a DRAFT claim"
    roles: [CardholderEmployee]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> SUBMITTED; increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/reimbursement-claims/{claimId}/approve"
    description: "Approve a SUBMITTED claim (computes reimbursable_cents)"
    roles: [Approver]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["reimbursable_cents computed; status -> APPROVED; increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/reimbursement-claims/{claimId}/reject"
    description: "Reject a SUBMITTED claim"
    roles: [Approver]
    code: 200
    input: ["decision_note?"]
    output: ReimbursementClaim
    side_effects: ["status -> REJECTED; increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/reimbursement-claims/{claimId}/revise"
    description: "Return a REJECTED claim to DRAFT (revision cycle)"
    roles: [CardholderEmployee]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: ["status -> DRAFT; increments ReimbursementClaim.version by 1"]

  - method: POST
    path: "/reimbursement-claims/{claimId}/pay"
    description: "Pay an APPROVED claim (accrues reimbursement reward)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects:
      - "status -> PAID"
      - "CASCADE: RewardAccount accrues round_half_up(reimbursable_cents * Company.reward_rate_default_bps / 10000)"
      - "increments ReimbursementClaim.version by 1"

  # ---- Statement ----
  - method: GET
    path: "/statements/{stmtId}"
    description: "Get a Statement"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Statement
    side_effects: []

  - method: GET
    path: "/statements"
    description: "List Statements (reverse-reachability for Statement.company_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "status?"]
    output: "Statement[]"
    side_effects: []

  - method: POST
    path: "/statements/{stmtId}/close"
    description: "Close the OPEN statement; computes balance + minimum_due; opens next cycle"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Statement
    side_effects:
      - "closed_at, due_at set; closing_balance_cents and minimum_due_cents computed"
      - "CASCADE: new OPEN Statement (cycle_index+1) created; Company.available_credit_cents recomputed"
      - "increments Statement.version by 1"

  - method: POST
    path: "/statements/{stmtId}/issue"
    description: "Issue a CLOSED statement (CLOSED -> DUE)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Statement
    side_effects: ["status -> DUE; increments Statement.version by 1"]

  - method: GET
    path: "/statements/{stmtId}/cashback-summary"
    description: "Computed read: statement_cashback_total over SETTLED transactions"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: { statement_id: string, statement_cashback_cents: integer, settled_transaction_count: integer }
    side_effects: []

  # ---- Repayment ----
  - method: POST
    path: "/repayments"
    description: "Create a Repayment against a DUE/PAST_DUE statement (OCC guarded)"
    roles: [FinanceAdmin]
    code: 201
    input: ["statement_id", "amount_cents", "expected_statement_version"]
    output: Repayment
    side_effects:
      - "status=INITIATED"
      - "ERR_STALE_VERSION (412) if expected_statement_version != current Statement.version"
      - "ERR_INVALID_STATE if Statement not in {DUE, PAST_DUE}"

  - method: GET
    path: "/repayments/{repaymentId}"
    description: "Get a Repayment"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: Repayment
    side_effects: []

  - method: GET
    path: "/repayments"
    description: "List Repayments (reverse-reachability for Repayment.statement_id, company_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["statement_id?", "company_id?", "status?"]
    output: "Repayment[]"
    side_effects: []

  - method: POST
    path: "/repayments/{repaymentId}/clear"
    description: "Clear a Repayment; allocates to statement, frees credit, may PAY the statement"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Repayment
    side_effects:
      - "status -> CLEARED"
      - "CASCADE: Statement.amount_repaid_cents += amount_cents; Company.available_credit_cents += amount_cents; statement -> PAID if amount_repaid_cents >= minimum_due_cents"
      - "increments Repayment.version by 1; increments Statement.version by 1"

  - method: POST
    path: "/repayments/{repaymentId}/fail"
    description: "Fail an INITIATED Repayment"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Repayment
    side_effects: ["status -> FAILED; increments Repayment.version by 1"]

  - method: POST
    path: "/repayments/{repaymentId}/reverse"
    description: "Reverse a CLEARED Repayment (compensating: unwinds allocation)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: Repayment
    side_effects:
      - "status -> REVERSED"
      - "CASCADE: Statement.amount_repaid_cents -= amount_cents; Company.available_credit_cents -= amount_cents; PAID statement reverts to DUE if amount_repaid_cents < minimum_due_cents"
      - "increments Repayment.version by 1; increments Statement.version by 1"

  # ---- RewardAccount ----
  - method: GET
    path: "/reward-accounts/{rewardAccountId}"
    description: "Get the RewardAccount"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: RewardAccount
    side_effects: []

  - method: GET
    path: "/reward-accounts"
    description: "List RewardAccounts (reverse-reachability for RewardAccount.company_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?"]
    output: "RewardAccount[]"
    side_effects: []

  - method: POST
    path: "/reward-accounts/{rewardAccountId}/redeem"
    description: "Redeem cashback (decreases balance)"
    roles: [FinanceAdmin]
    code: 200
    input: ["amount_cents"]
    output: RewardAccount
    side_effects:
      - "redeemed_points_cents += amount_cents; balance_points_cents recomputed"
      - "ERR_INSUFFICIENT_REWARD_BALANCE if amount_cents > balance_points_cents"
      - "increments RewardAccount.version by 1"

  # ---- SpendAuthorization ----
  - method: POST
    path: "/spend-authorizations"
    description: "Create a pre-authorized spend budget over a time window (EMPLOYEE or CARD scope; overlap-checked)"
    roles: [FinanceAdmin, Approver]
    code: 201
    input: ["company_id", "scope", "employee_id", "budget_cents", "window_start", "window_end", "card_id?"]
    output: SpendAuthorization
    side_effects:
      - "status=ACTIVE"
      - "ERR_INVALID_AMOUNT if budget_cents <= 0 or window_end <= window_start"
      - "ERR_AUTH_WINDOW_OVERLAP (EMPLOYEE scope) or ERR_AUTH_WINDOW_TOO_CLOSE (CARD scope) on interval conflict"

  - method: GET
    path: "/spend-authorizations/{authId}"
    description: "Get a SpendAuthorization"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: []
    output: SpendAuthorization
    side_effects: []

  - method: GET
    path: "/spend-authorizations"
    description: "List SpendAuthorizations (reverse-reachability for company_id, employee_id, card_id)"
    roles: [FinanceAdmin, Approver, CardholderEmployee, Auditor]
    code: 200
    input: ["company_id?", "employee_id?", "card_id?", "scope?", "status?"]
    output: "SpendAuthorization[]"
    side_effects: []

  - method: POST
    path: "/spend-authorizations/{authId}/consume"
    description: "Mark a SpendAuthorization CONSUMED (ACTIVE -> CONSUMED)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: SpendAuthorization
    side_effects: ["status -> CONSUMED; increments SpendAuthorization.version by 1"]

  - method: POST
    path: "/spend-authorizations/{authId}/cancel"
    description: "Cancel a SpendAuthorization (ACTIVE -> CANCELLED; frees its window)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: SpendAuthorization
    side_effects: ["status -> CANCELLED; increments SpendAuthorization.version by 1"]

  # ---- ErpSyncBatch ----
  - method: POST
    path: "/erp-sync-batches"
    description: "Build an ERP sync batch from a CLOSED/DUE/PAST_DUE/PAID statement's GL-coded settled transactions"
    roles: [FinanceAdmin]
    code: 201
    input: ["company_id", "statement_id"]
    output: ErpSyncBatch
    side_effects:
      - "status=BUILT; entry_count and total_debits_cents captured from SETTLED transactions with this statement_id and a non-null gl_account_id"
      - "ERR_INVALID_STATE if statement not in {CLOSED, DUE, PAID, PAST_DUE}"

  - method: GET
    path: "/erp-sync-batches/{batchId}"
    description: "Get an ErpSyncBatch"
    roles: [FinanceAdmin, Auditor]
    code: 200
    input: []
    output: ErpSyncBatch
    side_effects: []

  - method: GET
    path: "/erp-sync-batches"
    description: "List ErpSyncBatches (reverse-reachability for ErpSyncBatch.company_id, statement_id)"
    roles: [FinanceAdmin, Auditor]
    code: 200
    input: ["company_id?", "statement_id?", "status?"]
    output: "ErpSyncBatch[]"
    side_effects: []

  - method: POST
    path: "/erp-sync-batches/{batchId}/post"
    description: "Post an ERP batch (BUILT -> POSTED)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: ErpSyncBatch
    side_effects: ["status -> POSTED; increments ErpSyncBatch.version by 1"]

  - method: POST
    path: "/erp-sync-batches/{batchId}/discard"
    description: "Discard an ERP batch (BUILT -> DISCARDED)"
    roles: [FinanceAdmin]
    code: 200
    input: []
    output: ErpSyncBatch
    side_effects: ["status -> DISCARDED; increments ErpSyncBatch.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint, or actor is not the resource owner where ownership is required" }
  - { id: ERR_SELF_APPROVAL, http: 403, condition: "Approver's X-User-ID equals the cardholder/requester/claimant employee id (segregation of duties)" }

  # --- existence / validation ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced company/child resource id does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, or invalid enum value" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Monetary amount <= 0, or settled_amount_cents > amount_cents on settle" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Employee email already used among ACTIVE employees of the company" }
  - { id: ERR_DUPLICATE_GL_CODE, http: 409, condition: "GL code already used among ACTIVE GlAccounts of the company" }

  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_statement_version does not match current Statement.version (OCC)" }

  # --- company / card spend gating ---
  - { id: ERR_COMPANY_SUSPENDED, http: 409, condition: "Company is SUSPENDED; card activation/unfreeze blocked" }
  - { id: ERR_MCC_BLOCKED, http: 409, condition: "Transaction MCC is in the card's SpendPolicy.blocked_mcc_codes" }
  - { id: ERR_CARD_NOT_ACTIVE, http: 409, condition: "Card not ACTIVE (REQUESTED physical / FROZEN / TERMINATED) at capture time" }
  - { id: ERR_PER_TXN_LIMIT_EXCEEDED, http: 409, condition: "Transaction amount exceeds SpendPolicy.per_transaction_limit_cents" }
  - { id: ERR_CARD_LIMIT_EXCEEDED, http: 409, condition: "Transaction amount exceeds Card.card_limit_cents - held_cents" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 402, condition: "Transaction amount exceeds Company.available_credit_cents" }
  - { id: ERR_CARD_HAS_OPEN_AUTH, http: 409, condition: "Cannot terminate a card with a transaction in auth_status PENDING" }

  # --- review / approval ---
  - { id: ERR_GL_CODE_REQUIRED, http: 409, condition: "Approval/coding requires a set, ACTIVE GlAccount" }
  - { id: ERR_APPROVAL_REQUIRED, http: 409, condition: "High-value transaction review requires an APPROVED ApprovalRequest" }
  - { id: ERR_APPROVAL_NOT_NEEDED, http: 409, condition: "ApprovalRequest opened for a transaction at/below the approval threshold" }
  - { id: ERR_RECEIPT_REQUIRED, http: 409, condition: "Approving review requires a MATCHED receipt" }

  # --- statement / repayment / reward ---
  - { id: ERR_CLOCK_NOT_SET, http: 409, condition: "Statement close attempted before Company.clock_utc is set" }
  - { id: ERR_INSUFFICIENT_REWARD_BALANCE, http: 409, condition: "Redemption amount exceeds RewardAccount.balance_points_cents" }

  # --- spend-authorization temporal overlap ---
  - { id: ERR_AUTH_WINDOW_OVERLAP, http: 409, condition: "EMPLOYEE-scope authorization window overlaps an ACTIVE EMPLOYEE-scope authorization for the same employee (half-open overlap)" }
  - { id: ERR_AUTH_WINDOW_TOO_CLOSE, http: 409, condition: "CARD-scope authorization window is within AUTH_BUFFER_DAYS of an ACTIVE CARD-scope authorization for the same card (buffered adjacency)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FinanceAdmin
    description: "Operations superuser: company/policy/card/GL setup, card lifecycle, transaction auth (clear/settle/reverse), statement close/issue, repayment lifecycle, reimbursement payout, ERP sync, redemption. Cannot perform Approver decisions."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /companies — Create company"
      - "POST /companies/{id}/suspend — Suspend company"
      - "POST /spend-policies — Create policy"
      - "POST /employees — Create employee"
      - "POST /gl-accounts — Create GL account"
      - "POST /cards — Issue card"
      - "POST /cards/{id}/activate|freeze|unfreeze|terminate — Card lifecycle"
      - "POST /transactions/{id}/clear|settle|reverse — Auth lifecycle"
      - "POST /statements/{id}/close|issue — Statement lifecycle"
      - "POST /repayments and /repayments/{id}/clear|fail|reverse — Repayment lifecycle"
      - "POST /reimbursement-claims/{id}/pay — Pay reimbursement"
      - "POST /reward-accounts/{id}/redeem — Redeem cashback"
      - "POST /spend-authorizations/{id}/consume|cancel — Spend-authorization lifecycle"
      - "POST /erp-sync-batches and /erp-sync-batches/{id}/post|discard — ERP sync"
      - "POST /_clock/set_current_utc — Set simulated clock"
    shared_operations:
      - "POST /cards/{id}/transactions — Capture transaction (shared with CardholderEmployee)"
      - "POST /spend-authorizations — Create spend authorization (shared with Approver)"
      - "PATCH /transactions/{id} — GL coding (shared with CardholderEmployee)"
      - "POST /transactions/{id}/receipts — Upload receipt (shared with CardholderEmployee)"
      - "POST /transactions/{id}/approval-requests — Open approval request (shared with CardholderEmployee)"
      - "POST /reimbursement-claims — Create claim (shared with CardholderEmployee)"
      - "GET endpoints — read access"

  - name: Approver
    description: "Manager who approves spend. Decides ApprovalRequests, approves/rejects reimbursement claims, advances transaction review to APPROVED or FLAGGED. Cannot decide on own spend (segregation of duties)."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /approval-requests/{id}/approve — Approve request"
      - "POST /approval-requests/{id}/reject — Reject request"
      - "POST /transactions/{id}/approve-review — Approve transaction review"
      - "POST /transactions/{id}/flag — Flag transaction"
      - "POST /reimbursement-claims/{id}/approve — Approve claim"
      - "POST /reimbursement-claims/{id}/reject — Reject claim"
    shared_operations:
      - "POST /spend-authorizations — Create spend authorization (shared with FinanceAdmin)"
      - "GET endpoints — read access"

  - name: CardholderEmployee
    description: "Employee who holds a card and spends. Captures transactions, uploads receipts, codes GL, opens approval requests, resubmits rejected ones, files/submits/revises reimbursement claims. Acts only on own resources where ownership applies."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /approval-requests/{id}/resubmit — Resubmit own rejected request"
      - "POST /reimbursement-claims/{id}/submit — Submit own claim"
      - "POST /reimbursement-claims/{id}/revise — Revise own rejected claim"
    shared_operations:
      - "POST /cards/{id}/transactions — Capture transaction (shared with FinanceAdmin)"
      - "PATCH /transactions/{id} — GL coding (shared with FinanceAdmin)"
      - "POST /transactions/{id}/receipts — Upload receipt (shared with FinanceAdmin)"
      - "POST /transactions/{id}/approval-requests — Open approval request (shared with FinanceAdmin)"
      - "POST /reimbursement-claims — Create claim (shared with FinanceAdmin)"
      - "GET endpoints — read access"

  - name: Auditor
    description: "Read-only oversight role. May read all resources including ERP batches. No write operations."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints — read access (all resources)"
