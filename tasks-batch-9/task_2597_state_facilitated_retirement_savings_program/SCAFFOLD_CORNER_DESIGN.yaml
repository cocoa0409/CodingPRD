        distinguishing_aspect: "The candidate filter is tested on two independent axes at the 180-day seasoning edge: a run at 2026-08-31 (179 days after first_contribution_date 2026-03-05) escalates nobody, and a run at 2026-09-01 (exactly 180 days) escalates Rosa but must still leave Ben untouched because his escalation_opt_out is true — an implementation that filters on enrollment_status alone escalates both, and one that measures seasoning from hire_date or from activation escalates on 2026-08-31."
