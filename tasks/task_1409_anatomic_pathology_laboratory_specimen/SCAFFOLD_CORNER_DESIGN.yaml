            - { call: "POST /pathology/specimens/${sp1}/gross", payload: { gross_description: "bx" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp1}/blocks", payload: { block_label: "A1" }, as: Histotech, captures: { b1: $.data.id } }
            - { call: "POST /pathology/blocks/${b1}/embed", as: Histotech }
            - { call: "POST /pathology/blocks/${b1}/slides", payload: { slide_label: "A1-1" }, as: Histotech, captures: { s1: $.data.id } }
            - { call: "POST /pathology/slides/${s1}/section", payload: { consumption_pct: 10.0 }, as: Histotech }
            - { call: "POST /pathology/slides/${s1}/stain-complete", as: Histotech }
            - { call: "POST /pathology/slides/${s1}/qc-review", payload: { result: "PASS" }, as: Histotech }
            - { call: "POST /pathology/cases/${c1}/assign", payload: { pathologist_id: "${p1}" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/submit-for-signout", as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/sign-out", payload: { diagnosis_text: "benign" }, as: Pathologist, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /pathology/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T12:00:00Z" }, as: LabAdmin }
            - { call: "POST /pathology/cases/${c1}/amend", payload: { diagnosis_text: "benign, clarified", amendment_reason: "clarification" }, as: Pathologist, as_user_id: "${p1}" }
            - { call: "POST /pathology/cases/${c1}/amend/sign", as: Pathologist, as_user_id: "${p1}" }
            - { call: "GET /pathology/cases/${c1}", as: LabAdmin }
          assert:
            - "Case.${c1}.finalized_at == 2026-08-03T12:00:00Z (first finalization kept; the 2026-08-04 amendment did not move it)"
            - "Case.${c1}.tat_breached == false and status == FINAL"

  - section: validations
    instances:
      - name: auth_missing_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected 401 before any role, existence, or state check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pathology/cases/11111111-2222-3333-4444-555555555555", captures: { err: $.data.error_id } }
          assert: ["err == ERR_UNAUTHENTICATED (http 401); the missing-id 404 is masked by the earlier auth failure"]
      - name: existence_beats_state_qc_review_on_unknown_slide
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=11]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "qc-review on a nonexistent slide id returns ERR_NOT_FOUND (404, priority 4), never the state error ERR_SLIDE_WRONG_STATE (priority 11)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pathology/slides/11111111-2222-3333-4444-555555555555/qc-review", payload: { result: "PASS" }, as: Histotech, captures: { err: $.data.error_id } }
          assert: ["err == ERR_NOT_FOUND (http 404)"]
      - name: accession_patient_identifier_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors[ERR_PATIENT_IDENTIFIER_MISMATCH]
        distinguishing_aspect: "Two-identifier safety rule: a correct mrn with a wrong date_of_birth rejects accession with ERR_PATIENT_IDENTIFIER_MISMATCH (422)."
        test_recipe:
          setup: ["patient MRN-V1 (dob 1980-01-01) with a GI case"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-V1", full_name: "Val One", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-V1", patient_dob: "1980-01-02", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:00:00Z", container_count: 1 }, as: Histotech, captures: { err: $.data.error_id } }
          assert: ["err == ERR_PATIENT_IDENTIFIER_MISMATCH (http 422); no Specimen row created"]
      - name: accession_received_before_collection_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - errors[ERR_COLLECTION_AFTER_RECEIVED]
        distinguishing_aspect: "Temporal ordering at accession: received_datetime earlier than collection_datetime fails with ERR_COLLECTION_AFTER_RECEIVED."
        test_recipe:
          setup: ["patient MRN-V2 with a GI case"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-V2", full_name: "Val Two", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-V2", patient_dob: "1980-01-01", specimen_type: "BIOPSY", anatomical_site: "Colon", collection_datetime: "2026-08-03T10:00:00Z", received_datetime: "2026-08-03T09:00:00Z", container_count: 1 }, as: Histotech, captures: { err: $.data.error_id } }
          assert: ["err == ERR_COLLECTION_AFTER_RECEIVED (http 422)"]
      - name: cold_ischemia_truncates_seconds_and_limits_at_60
        claim_type: violation_to_error
        grounds:
          - calculations.cold_ischemia_minutes
          - validations[priority=31]
          - errors[ERR_COLD_ISCHEMIA_EXCEEDED]
        distinguishing_aspect: "Cold ischemia truncates to whole minutes, so 09:00:30 -> 10:01:29 computes exactly 60 and HER2_IHC (limit 60) is allowed; 61 computed minutes rejects with ERR_COLD_ISCHEMIA_EXCEEDED."
        test_recipe:
          setup: ["WORKUP case with specimen sp60 (collection 2026-08-03T09:00:30Z, received 10:01:29Z, cold 60) carrying EMBEDDED block b60, and specimen sp61 (collection 09:00:00Z, received 10:01:00Z, cold 61) carrying EMBEDDED block b61"]
          setup_api_calls:
            - { call: "POST /pathology/patients", payload: { mrn: "MRN-V3", full_name: "Val Three", date_of_birth: "1980-01-01" }, as: LabAdmin, captures: { pat: $.data.id } }
            - { call: "POST /pathology/pathologists", payload: { full_name: "Dr Cold", subspecialties: ["GI"] }, as: LabAdmin, captures: { p1: $.data.id } }
            - { call: "POST /pathology/cases", payload: { patient_id: "${pat}", subspecialty: "GI" }, as: LabAdmin, captures: { c1: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-V3", patient_dob: "1980-01-01", specimen_type: "RESECTION", anatomical_site: "Breast", collection_datetime: "2026-08-03T09:00:30Z", received_datetime: "2026-08-03T10:01:29Z", container_count: 1 }, as: Histotech, captures: { sp60: $.data.id } }
            - { call: "POST /pathology/specimens/${sp60}/gross", payload: { gross_description: "lumpectomy" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp60}/blocks", payload: { block_label: "B1" }, as: Histotech, captures: { b60: $.data.id } }
            - { call: "POST /pathology/blocks/${b60}/embed", as: Histotech }
            - { call: "POST /pathology/cases/${c1}/specimens", payload: { patient_mrn: "MRN-V3", patient_dob: "1980-01-01", specimen_type: "RESECTION", anatomical_site: "Breast", collection_datetime: "2026-08-03T09:00:00Z", received_datetime: "2026-08-03T10:01:00Z", container_count: 1 }, as: Histotech, captures: { sp61: $.data.id } }
            - { call: "POST /pathology/specimens/${sp61}/gross", payload: { gross_description: "lumpectomy 2" }, as: PathologyAssistant }
            - { call: "POST /pathology/specimens/${sp61}/blocks", payload: { block_label: "B1" }, as: Histotech, captures: { b61: $.data.id } }
            - { call: "POST /pathology/blocks/${b61}/embed", as: Histotech }
          trigger:
            - { call: "POST /pathology/cases/${c1}/stain-orders", payload: { block_id: "${b60}", stain_type: "HER2_IHC" }, as: Pathologist, as_user_id: "${p1}", captures: { so_ok: $.data.id } }
            - { call: "POST /pathology/cases/${c1}/stain-orders", payload: { block_id: "${b61}", stain_type: "HER2_IHC" }, as: Pathologist, as_user_id: "${p1}", captures: { err: $.data.error_id } }
          assert:
            - "Specimen.${sp60}.cold_ischemia_minutes == 60 (seconds truncated) and the HER2_IHC order on b60 succeeds: StainOrder.${so_ok}.status == ORDERED"
            - "Specimen.${sp61}.cold_ischemia_minutes == 61 and the order on b61 fails: err == ERR_COLD_ISCHEMIA_EXCEEDED (http 422)"
