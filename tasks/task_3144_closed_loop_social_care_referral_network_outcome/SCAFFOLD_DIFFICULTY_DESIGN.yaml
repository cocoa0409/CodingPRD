      - name: reassign_past_max_count_boundary_auto_cancel
        grounds:
          - state_machines.Referral.ROUTED_to_DECLINED
          - entities.CareNetwork.fields.max_reassignment_count
        distinguishing_aspect: |
          Metric: reassignment_count vs max_reassignment_count on the decline
          endpoint (different metric and endpoint than the escalation window):
          with max 1, the first decline (count becomes 1, 1 > 1 false) leaves
          the referral DECLINED; after reassign and a second decline (count
          becomes 2, 2 > 1 true) the referral auto-CANCELLS — the boundary is
          exactly at count == max + 1.
