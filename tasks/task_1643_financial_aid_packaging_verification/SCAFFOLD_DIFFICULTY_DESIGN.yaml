  # =====================================================================
  # Rule 6 — boundary_precision_check on different metrics/endpoints.
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sap_pace_boundary_6666_vs_6667
        grounds:
          - calculations.sap_evaluation
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /students/{id}/evaluate-sap: pace
          6666 bps (attempted 300, completed 200) FAILS the >= 6667 floor while
          pace 6667+ passes; attempted=0 is the degenerate edge treated as
          10000 bps (pass).
        test_recipe:
          setup:
            - "Student B1 attempted 300 completed 200 gpa 250 (pace 6666 -> fail); Student B2 attempted 0 completed 0 gpa 250 (pace treated 10000 -> pass); both NOT_EVALUATED"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Pace Fail", email: "pf@example.edu", residency: "IN_STATE", dependency_status: "INDEPENDENT", enrollment_status: "FULL_TIME", grade_level: 2, cumulative_attempted_credits: 300, cumulative_completed_credits: 200, gpa_hundredths: 250 }
              as: AidOfficer
              captures: { stu_b1: "$.data.id" }
            - call: "POST /api/students"
              payload: { ssn: "123456789", full_name: "Pace Zero", email: "pz@example.edu", residency: "IN_STATE", dependency_status: "INDEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1, cumulative_attempted_credits: 0, cumulative_completed_credits: 0, gpa_hundredths: 250 }
              as: AidOfficer
              captures: { stu_b2: "$.data.id" }
          trigger:
            - call: "POST /api/students/${stu_b1}/evaluate-sap"
              payload: {}
              as: AidOfficer
            - call: "POST /api/students/${stu_b2}/evaluate-sap"
              payload: {}
              as: AidOfficer
          assert:
            - "Student.${stu_b1}.sap_status == WARNING (first failure from NOT_EVALUATED)"
            - "Student.${stu_b2}.sap_status == GOOD_STANDING (attempted==0 -> pace 10000 bps passes; gpa 250 >= 200 passes; 0 > 180 false)"

      - name: fund_pool_exhaustion_exact_boundary
        grounds:
          - calculations.packaging_waterfall
          - state_machines.FundType.ACTIVE_to_EXHAUSTED
