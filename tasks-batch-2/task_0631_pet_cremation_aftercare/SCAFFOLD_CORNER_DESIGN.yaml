  - section: state_machines
    instances:
      - name: error_invalid_state_cancel_cremated_excluded
        claim_type: Invalid Transitions
        grounds:
          - "errors[ERR_INVALID_STATE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_state_beats_fiscal_on_cancel_after_complete
          rationale: "ERR_INVALID_STATE on cancel of a CREMATED case is asserted as the winning error of the named §1.8 priority-conflict instance."

      - name: error_service_type_mismatch_excluded
        claim_type: Precondition Enforcement
        grounds:
          - "errors[ERR_SERVICE_TYPE_MISMATCH]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_safety_beats_referential_on_assign_mismatch
          rationale: "ERR_SERVICE_TYPE_MISMATCH is the asserted winner of the named §1.8 safety-vs-referential conflict instance."

  - section: errors
    instances:
