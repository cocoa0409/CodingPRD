        claim_type: soft_delete
        grounds: [entities.Recipient.fields.active, "errors[ERR_RECIPIENT_INACTIVE]"]
        distinguishing_aspect: "Recipient with active=false cannot be added to a new order line; historical line items keep their FK."
        test_recipe:
          setup: ["Recipient r deactivated"]
          setup_api_calls:
            - call: "POST /registrar/_clock/set_current_utc"
