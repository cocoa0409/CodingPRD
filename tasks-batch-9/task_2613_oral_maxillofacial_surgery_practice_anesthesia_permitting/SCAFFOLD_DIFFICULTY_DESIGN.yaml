  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: operating_room_turnover_buffer_overlap
        resource_entity: "BlockTime.room_code (the physical operating room)"
        interval_semantics: |
          The incumbent case's window is padded by Practice.turnover_buffer_minutes on the way out
          AND the candidate's window is padded on the way in, so the test is effectively
          "gap >= buffer". A gap strictly shorter than the buffer collides; a gap exactly equal to it
          does not. Enforced at hold-block time, against cases in BLOCK_HELD, CONFIRMED, IN_RECOVERY
          or COMPLETED.
        grounds:
          - validations[priority=76]
          - errors.ERR_ROOM_TURNOVER_CONFLICT
          - entities.Practice.fields.turnover_buffer_minutes
          - calculations.block_utilization
        distinguishing_aspect: |
          Room occupancy is the only overlap rule in the scaffold that pads the interval, and it is
          the only one evaluated at hold-block. Two candidates differing by ten minutes fall on
          opposite sides of the same 15-minute buffer, which pins the comparison as >= rather than >.
          No permit is needed because every case here is LOCAL_ONLY.
        test_recipe:
          setup:
            - "logical clock at 2026-09-11T10:00:00Z"
            - "practice with turnover_buffer_minutes 15, one surgeon, one patient"
            - "one 240-minute block: OR-1, 2026-09-14T13:00Z-17:00Z"
            - "incumbent LOCAL_ONLY case 13:00Z-14:00Z already holding the block"
            - "candidate A 14:05Z-15:00Z (5-minute gap) and candidate B 14:15Z-15:15Z (15-minute gap)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T10:00:00Z" }
              as: PracticeAdministrator
            - call: "POST /practices"
              payload: { name: "Northside OMS", state_code: "OH", recovery_bay_count: 2, turnover_buffer_minutes: 15 }
              as: PracticeAdministrator
              captures: { prac_id: $.data.id }
            - call: "POST /staff-members"
              payload: { practice_id: "${prac_id}", full_name: "Dr Alma Reyes", role_type: "SURGEON", acls_expires_on: "2027-06-30T00:00:00Z" }
              as: PracticeAdministrator
              captures: { surg_id: $.data.id }
            - call: "POST /patients"
              payload: { practice_id: "${prac_id}", full_name: "Pat Turnover", date_of_birth: "1980-03-15T00:00:00Z", asa_class: 2, airway_class: 2, weight_kg: 80, dental_plan_active: true }
              as: SchedulingCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /block-times"
              payload: { practice_id: "${prac_id}", surgeon_id: "${surg_id}", room_code: "OR-1", block_start: "2026-09-14T13:00:00Z", block_end: "2026-09-14T17:00:00Z", release_deadline_hours: 48 }
              as: SchedulingCoordinator
              captures: { blk_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T13:00:00Z", planned_end: "2026-09-14T14:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
              captures: { case1_id: $.data.id }
            - call: "POST /surgical-cases/${case1_id}/hold-block"
              payload: { block_id: "${blk_id}" }
              as: SchedulingCoordinator
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T14:05:00Z", planned_end: "2026-09-14T15:00:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
              captures: { case2_id: $.data.id }
            - call: "POST /surgical-cases"
              payload: { practice_id: "${prac_id}", patient_id: "${pat_id}", primary_surgeon_id: "${surg_id}", planned_anesthesia_level: "LOCAL_ONLY", procedure_category: "THIRD_MOLAR", planned_start: "2026-09-14T14:15:00Z", planned_end: "2026-09-14T15:15:00Z", total_charge_cents: 50000 }
              as: SchedulingCoordinator
              captures: { case3_id: $.data.id }
          trigger:
            - call: "POST /surgical-cases/${case2_id}/hold-block"
              payload: { block_id: "${blk_id}" }
              as: SchedulingCoordinator
            - call: "POST /surgical-cases/${case3_id}/hold-block"
              payload: { block_id: "${blk_id}" }
              as: SchedulingCoordinator
          assert:
            - "trigger[0] fails with HTTP 409 ERR_ROOM_TURNOVER_CONFLICT (a 5-minute gap is shorter than the 15-minute buffer)"
            - "after trigger[0]: SurgicalCase.${case2_id}.scheduling_status == DRAFT with block_id null, and BlockTime.${blk_id}.committed_minutes == 60"
            - "trigger[1] succeeds: SurgicalCase.${case3_id}.scheduling_status == BLOCK_HELD (a gap exactly equal to the buffer is legal)"
            - "after trigger[1]: BlockTime.${blk_id}.committed_minutes == 120, released_minutes == 0, open_minutes == 120, utilization_pct == 50.00"

      - name: monitor_half_open_overlap_without_buffer
        resource_entity: "StaffMember acting as SurgicalCase.monitor_staff_id (a person, not a room)"
        interval_semantics: |
          The case's own [planned_start, planned_end) window, half-open and with NO buffer, so
          back-to-back monitoring across two rooms is legal while any true overlap is not. Enforced
          at confirm time (priority 77), not at hold-block, and it counts BLOCK_HELD, CONFIRMED and
          IN_RECOVERY cases.
        grounds:
          - validations[priority=77]
          - errors.ERR_MONITOR_DOUBLE_BOOKED
          - calculations.sedation_staffing_requirement
        distinguishing_aspect: |
          A different resource (a person) with the opposite interval convention to the room rule: no
          padding at all, and the endpoints touch legally. The same monitor is confirmed onto two
