            - call: "GET /vehicles/${veh}"
              payload: {}
              as: Teacher
              as_user_id: "${teach_g}"
              captures: { res_after: $.data.seats_reserved }
          assert:
            - "Vehicle.${veh}.seats_reserved == 5 after confirm"
            - "Vehicle.${veh}.seats_reserved == 0 after cancel (seats fully restored)"
            - "TransportBooking.${bk}.status == CANCELLED"
