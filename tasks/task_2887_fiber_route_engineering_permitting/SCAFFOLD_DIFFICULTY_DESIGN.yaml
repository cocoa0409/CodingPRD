            - "FieldWalkout.${wo1_id}.status == ACCEPTED, untouched by this cascade"
            - "FieldWalkout.${wo2_id}.worst_pole_condition_grade == D and make_ready_flagged_pole_count == 1"

  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: make_ready_safety_gate_precedes_budget_gate
        grounds:
          - validations[priority=14]
          - validations[priority=26]
          - errors[ERR_MAKE_READY_REQUIRED]
          - errors[ERR_BUDGET_EXCEEDED]
          - calculations.make_ready_cost_and_schedule
          - calculations.route_budget_ledger
        distinguishing_aspect: |
          The conflicting pair is business_safety (priority 14, ERR_MAKE_READY_REQUIRED, 422) against business_fiscal
          (priority 26, ERR_BUDGET_EXCEEDED, 402): both conditions hold on the same accept-make-ready call and the safety
          error must win, so the response is 422 ERR_MAKE_READY_REQUIRED and never 402.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "one Route 'Shoestring Loop' (SPUR) with budget_authorized_cents 10000, so budget_available_cents is 10000"
            - "one RouteSegment: sequence_index 1, length_feet 250, terrain_class URBAN_PAVED"
            - "the segment's ACCEPTED FieldWalkout documents a grade-D pole P-002, so worst_pole_condition_grade is D and make_ready_flagged_pole_count is 1"
            - "one TELCO PoleAttachmentApplication with pole_count 1 is MAKE_READY_ESTIMATED with make_ready_items_subtotal_cents 31250, make_ready_admin_fee_bp 1200, make_ready_admin_fee_cents 3750, make_ready_cost_cents 35000 and make_ready_days 17"
            - "the estimate contains only a CLEARANCE_TRIM line — there is NO POLE_REPLACEMENT line for the grade-D pole — and 35000 also exceeds budget_available_cents 10000, so both gates are violated at once"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: NetworkRecordsAdmin
            - call: "POST /routes"
