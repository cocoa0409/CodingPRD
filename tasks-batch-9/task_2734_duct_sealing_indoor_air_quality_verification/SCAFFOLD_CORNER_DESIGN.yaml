# =============================================================================
# task_2734 — Duct Sealing & Indoor Air Quality Verification (Aeroseal dealer)
# §1.9 Scaffold Corner Design — breadth coverage index for every testable claim
# SCAFFOLD.yaml §1.1-§1.7 declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8)
# does not already cover. Sections and claim_types follow
# references/claim-extraction-guide.md; the logical clock is pinned to
# 2026-08-01T00:00:00Z in every chain.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_utility_program_returns_full_payload_and_zeroed_money_ledger
        claim_type: creation
        grounds:
          - entities.UtilityProgram
          - endpoints[POST /duct-sealing/utility-programs]
        distinguishing_aspect: "A 201 create echoes every input field verbatim and initialises the three computed money fields to 0 / 0 / annual_budget_cents with version 1 — not to null."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_version: $.data.version }
          assert:
            - "HTTP 201; envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"
            - "data.name == 'Metro Gas Duct Seal 2026', data.rebate_basis == PER_CFM, data.rate_cents_per_cfm_reduced == 1200, data.pct_of_invoice_bps == 3000, data.cap_cents == 500000, data.annual_budget_cents == 5000000, data.min_reduction_pct == 80.00"
            - "data.committed_rebate_cents == 0 and data.paid_rebate_cents == 0"
            - "data.remaining_budget_cents == 5000000"
            - "${prog_version} == 1 and data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"
            - "${prog_id} is a bare UUID with no type prefix (does not contain '_')"

      - name: get_duct_system_returns_stored_row_with_declared_defaults
        claim_type: retrieval
        grounds:
          - entities.DuctSystem
          - endpoints[GET /duct-sealing/duct-systems/{id}]
        distinguishing_aspect: "A freshly created DuctSystem reads back with BOTH state dimensions at their declared initial values (PENDING_SCREENING / SEAL_PENDING), baseline and working leakage still null, and sealed_leakage_reduction_cfm at 0.00 rather than null."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; program, technician and project created; one duct system AHU-1 with 9 registers"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
          trigger:
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { got_id: $.data.id, got_version: $.data.version }
          assert:
            - "HTTP 200 and ${got_id} == ${ds1_id}"
            - "data.project_id == ${proj_id}, data.system_label == 'AHU-1', data.total_register_count == 9, data.design_cfm == 1200.0, data.duct_material == SHEET_METAL, data.condition_grade == B"
            - "data.asbestos_screening_result == PENDING and data.lab_reference == null"
            - "data.eligibility_status == PENDING_SCREENING and data.exclusion_reason == null"
            - "data.seal_status == SEAL_PENDING and data.active_seal_job_id == null"
            - "data.baseline_leakage_cfm25 == null, data.working_leakage_cfm25 == null, data.sealed_leakage_reduction_cfm == 0.00"
            - "${got_version} == 1"

      - name: list_projects_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /duct-sealing/projects]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three projects under one program: limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false — total_count reports the filtered population, not the page size."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one UtilityProgram; three Projects all pointing at that program"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "1 Alder St", conditioned_floor_area_sqft: 1500, gas_appliance_count: 0, invoice_amount_cents: 300000 }
              as: ProgramAdmin
              captures: { projA_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "2 Birch St", conditioned_floor_area_sqft: 1800, gas_appliance_count: 1, invoice_amount_cents: 400000 }
              as: ProgramAdmin
              captures: { projB_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "3 Cedar St", conditioned_floor_area_sqft: 2100, gas_appliance_count: 2, invoice_amount_cents: 500000 }
              as: ProgramAdmin
              captures: { projC_id: $.data.id }
          trigger:
            - call: "GET /duct-sealing/projects?utility_program_id=${prog_id}&limit=2&offset=0"
              as: ProgramAdmin
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /duct-sealing/projects?utility_program_id=${prog_id}&limit=2&offset=2"
              as: ProgramAdmin
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "HTTP 200 on both calls with response_type == 'array'"
            - "First page returns exactly 2 Project rows with meta.total_count == 3, meta.limit == 2, meta.offset == 0 and meta.has_more == true"
            - "Second page returns exactly 1 Project row with meta.total_count == 3, meta.limit == 2, meta.offset == 2 and meta.has_more == false — total_count reports the filtered population, not the page size"
            - "${page1_first} != ${page1_second} and ${page2_first} is neither of them"
            - "The union of the two pages is exactly {${projA_id}, ${projB_id}, ${projC_id}} with no row repeated"

      - name: get_seal_job_unknown_uuid_returns_seal_job_not_found
        claim_type: not_found
        grounds:
          - validations[priority=40]
          - errors.ERR_SEAL_JOB_NOT_FOUND
          - endpoints[GET /duct-sealing/seal-jobs/{id}]
        distinguishing_aspect: "A well-formed but unknown UUID in the path yields the entity-specific 404 ERR_SEAL_JOB_NOT_FOUND, not a generic 400 or an empty 200 body."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; no SealJob rows exist"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /duct-sealing/seal-jobs/11111111-2222-4333-8444-555555555555"
              as: ProgramAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_id} == ERR_SEAL_JOB_NOT_FOUND"
            - "response_type == 'error' and data.message is a non-empty string"
            - "GET /duct-sealing/seal-jobs returns an empty array with total_count 0"

      - name: create_leakage_test_missing_window_end_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=50]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /duct-sealing/leakage-tests]
        distinguishing_aspect: "window_end_at is a required §1.5 input with no default; omitting it is a 400 ERR_INVALID_REQUEST checked at priority 50, i.e. after the FK existence check has already passed."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one ELIGIBLE duct system (asbestos CLEARED)"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
          trigger:
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 and ${err_id} == ERR_INVALID_REQUEST"
            - "GET /duct-sealing/duct-systems/${ds1_id}/leakage-tests returns an empty array (nothing was persisted)"
            - "DuctSystem.${ds1_id}.version == 2 (unchanged by the rejected call; the screening call was the only bump)"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.UtilityProgram.fields.requires_inspector_verification
          - entities.UtilityProgram.fields.combustion_safety_required
          - entities.Technician.fields.certification_status
          - endpoints[POST /duct-sealing/utility-programs]
          - endpoints[POST /duct-sealing/technicians]
        distinguishing_aspect: "Three optional inputs across two entities: both UtilityProgram booleans default to true and Technician.certification_status defaults to PENDING (not ACTIVE) when the field is absent from the body."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Bare Program", rebate_basis: "LESSER_OF_BOTH", rate_cents_per_cfm_reduced: 900, pct_of_invoice_bps: 2500, cap_cents: 400000, annual_budget_cents: 2000000, min_reduction_pct: 75.00 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id, prog_inspector: $.data.requires_inspector_verification, prog_combustion: $.data.combustion_safety_required }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Sam Osei", license_number: "AS-9001" }
              as: ProgramAdmin
              captures: { tech_id: $.data.id, tech_cert: $.data.certification_status, tech_expiry: $.data.certification_expires_at }
          assert:
            - "HTTP 201 on both calls"
            - "${prog_inspector} == true and ${prog_combustion} == true"
            - "${tech_cert} == PENDING and ${tech_expiry} == null"
            - "Technician.${tech_id}.open_seal_job_count == 0"

      - name: recorded_leakage_normalization_is_derived_from_pressure_and_floor_area
        claim_type: computed_fields
        grounds:
          - entities.LeakageTest.fields.normalized_leakage_cfm25
          - entities.LeakageTest.fields.leakage_per_100_sqft
          - calculations.normalized_duct_leakage
          - validations[priority=50]
        distinguishing_aspect: "Both normalized fields are computed, and neither is an input on the record endpoint: from measured_leakage_cfm 300.0 taken at exactly 25.0 Pa the power-law factor is 1.0, so normalized_leakage_cfm25 must be 300.00 rather than a rescaled number, and leakage_per_100_sqft must divide by the PROJECT's conditioned_floor_area_sqft (2000) rather than by the duct system's design_cfm (1200.0), which a confused implementation would use to produce 25.00."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; project with conditioned_floor_area_sqft 2000; ELIGIBLE duct system"
            - "PRE LeakageTest created and pressurized at 25.0 Pa (status PRESSURIZED)"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { norm: $.data.normalized_leakage_cfm25, per100: $.data.leakage_per_100_sqft, test_status: $.data.status }
          assert:
            - "HTTP 200 and ${test_status} == RECORDED"
            - "${norm} == 300.00: the test pressure is exactly 25.0 Pa, so the power-law factor is 1.0 and the measured value passes through unscaled"
            - "${per100} == 15.00 == 300.00 / 2000 * 100, computed off Project.conditioned_floor_area_sqft — NOT 25.00, which is what dividing by DuctSystem.design_cfm 1200.0 would give"
            - "Neither field is accepted as input: the record endpoint declares only measured_leakage_cfm and ambient_temp_f, so both values are server-derived on this one call"
            - "LeakageTest.${pre1_id}.measured_leakage_cfm == 300.0 and performed_by_user_id == ${tech1_id}"
            - "DuctSystem.${ds1_id}.baseline_leakage_cfm25 == null (the baseline is only set on ACCEPT, not on record)"

      - name: seal_job_system_and_computed_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.SealJob.fields.status
          - entities.SealJob.fields.masked_register_count
          - entities.SealJob.fields.sample_count
          - endpoints[POST /duct-sealing/seal-jobs]
        distinguishing_aspect: "POST /seal-jobs declares eight inputs and the SealJob entity carries nineteen more fields, every one of them source system or computed. The create must mint all of them itself — a bare UUID id, version 1, status SCHEDULED, created_at from the LOGICAL clock (2026-08-01, not wall time) — and leave all nine run-progress fields at their declared defaults, which is where an implementation that copies its response from the request body or from wall time diverges."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; ELIGIBLE duct system with an ACCEPTED PRE test (baseline 300.00); PASS PRE-phase combustion test"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "baseline accepted" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 12, co_ppm_air_free: 18.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "GET /duct-sealing/duct-systems/${ds1_id}"
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { ds1_v: $.data.version }
          trigger:
            - call: "POST /duct-sealing/seal-jobs"
              payload: { duct_system_id: "${ds1_id}", pre_test_id: "${pre1_id}", technician_id: "${tech1_id}", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T18:00:00Z", target_leakage_cfm: 60.0, expected_duct_system_version: "${ds1_v}" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { job_id: $.data.id, job_status: $.data.status, job_version: $.data.version, job_samples: $.data.sample_count }
          assert:
            - "HTTP 201 and ${job_status} == SCHEDULED — the declared initial state, even though the duct system is already fully screened and measured"
            - "${job_version} == 1: SealJob.version starts at 1, not 0"
            - "${job_id} is a server-minted bare UUID with no type prefix and is not equal to ${ds1_id} or ${pre1_id}"
