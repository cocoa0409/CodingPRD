            - call: "POST /studio/clients/${client_id}/id-verification/approve"
              payload: {}
              as: StudioManager
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-05-20T10:00:00Z", end_at: "2026-05-20T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /studio/appointments/${ap_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap_v}" }
