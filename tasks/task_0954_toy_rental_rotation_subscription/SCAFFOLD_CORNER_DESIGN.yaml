              as: OperationsManager
          trigger:
            - call: "GET /toy-rental/rotation-boxes/${b_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "RotationBox.${b_id}.status == DELIVERED, due_date == 2026-05-31T00:00:00Z, projected_late_fee_cents == 0 (clock 2026-05-01 <= due_date)"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: unknown_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An X-User-Role value that is not a declared role fails priority-1 authentication with ERR_UNAUTHENTICATED 401, before any role-list or existence check; a declared-but-unlisted role (Anonymous) on the same endpoint instead fails priority 2 with ERR_UNAUTHORIZED_ROLE 403."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /toy-rental/subscription-plans"
              as: Pirate
              captures: { err1: $.data.error_id }
            - call: "GET /toy-rental/subscription-plans"
              as: Anonymous
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_UNAUTHENTICATED (HTTP 401): 'Pirate' is not a declared role"
            - "err2 == ERR_UNAUTHORIZED_ROLE (HTTP 403): Anonymous is declared but not in this endpoint's roles list"

      - name: ownership_member_cannot_touch_other_members_subscription
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "Entity-backed ownership: Member B's X-User-ID does not match subscription.member_id of Member A's subscription -> ERR_FORBIDDEN_OWNERSHIP 403 (priority 4, before state checks)."
        test_recipe:
          setup: ["Plan STD; members A and B; A has a subscription"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.owna@x.com", full_name: "Owner A", password: "pw" }
              as: Anonymous
              captures: { m_a: $.data.id }
            - call: "POST /toy-rental/members/${m_a}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { s_a: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.ownb@x.com", full_name: "Owner B", password: "pw" }
              as: Anonymous
              captures: { m_b: $.data.id }
          trigger:
            - call: "POST /toy-rental/subscriptions/${s_a}/pause"
              payload: { start_date: "2026-05-01", duration_days: 7 }
              as: Member
              as_user_id: "${m_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_OWNERSHIP (HTTP 403); Subscription.${s_a}.status remains ACTIVE"

      - name: nested_existence_left_to_right
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "Path ids validated left-to-right: a non-existent parent member id fails with ERR_MEMBER_NOT_FOUND before any child-level check runs."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /toy-rental/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBER_NOT_FOUND (HTTP 404)"

      - name: wishlist_create_on_retired_catalog_item_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CATALOG_ITEM_RETIRED]", state_machines.CatalogItem.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Referential rule: wishlist create against a RETIRED catalog item fails ERR_CATALOG_ITEM_RETIRED 422; existing entries are unaffected."
        test_recipe:
          setup: ["Plan STD; member M with ACTIVE subscription; catalog item RETIRED via retire endpoint"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.ret@x.com", full_name: "Ret Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Old Toy", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 4, retail_value_cents: 3000, replacement_value_cents: 2000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/retire"
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-rental/members/${m_id}/wishlist-entries"
              payload: { catalog_item_id: "${ci_id}", rank: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CATALOG_ITEM_RETIRED (HTTP 422); no WishlistEntry created"

      - name: wishlist_duplicate_waiting_entry_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_WISHLIST_DUPLICATE]"]
        distinguishing_aspect: "Aggregate uniqueness: a second {WAITING, HELD} entry for the same (member, catalog_item) fails ERR_WISHLIST_DUPLICATE; a re-add after cancel is legal."
        test_recipe:
          setup: ["Plan STD; member M with ACTIVE subscription; ACTIVE catalog item X; one WAITING entry already exists"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.dup@x.com", full_name: "Dup Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/members/${m_id}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 2 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /toy-rental/wishlist-entries/${e_id}/cancel"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 3 }
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id2: $.data.id }
          assert:
            - "Duplicate while WAITING: err == ERR_WISHLIST_DUPLICATE (HTTP 409)"
            - "After cancelling the first entry, re-adding succeeds (201) with a new entry ${e_id2} status WAITING"

      - name: second_active_subscription_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SUBSCRIPTION_ACTIVE_EXISTS]"]
        distinguishing_aspect: "One non-CANCELLED subscription per member: a second subscribe while ACTIVE fails ERR_SUBSCRIPTION_ACTIVE_EXISTS; after cancel it succeeds."
        test_recipe:
          setup: ["Plan STD; member M with an ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.sub2@x.com", full_name: "Sub2 Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /toy-rental/subscriptions/${s_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id2: $.data.id }
          assert:
            - "While ACTIVE: err == ERR_SUBSCRIPTION_ACTIVE_EXISTS (HTTP 409)"
            - "After cancel: re-subscribe succeeds (201) with a new subscription ${s_id2} status ACTIVE, next_cycle_due_at == its created_at"

      - name: stale_sanitization_blocks_reservation
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_NEEDS_RESANITIZATION]", entities.ToyCopy.fields.last_sanitized_at]
        distinguishing_aspect: "Safety gate: a non-NEW copy whose last_sanitized_at is older than 30 days before the logical clock is rejected with ERR_NEEDS_RESANITIZATION on item add."
        test_recipe:
          setup:
            - "Plan STD; member M with child born 2025-01-15; ACTIVE subscription; PLANNED box"
            - "Catalog item age [12,36] with copy C1 minted FAIR at 2026-04-01 (minting stamps last_sanitized_at := created_at); clock advanced to 2026-05-20 -> sanitization 49 days stale"
          setup_api_calls:
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Kitchen Set", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 4, retail_value_cents: 12000, replacement_value_cents: 9000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-STALE-1", condition_grade: "FAIR" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.stale@x.com", full_name: "Stale Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
          trigger:
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NEEDS_RESANITIZATION (HTTP 422): last_sanitized_at 2026-04-01 is 49 days before clock 2026-05-20 (> 30)"
            - "ToyCopy.${c1}.status remains AVAILABLE; no BoxItem created"

      - name: box_create_before_cycle_due_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_BOX_CYCLE_NOT_DUE]", calculations.rotation_cadence_schedule]
        distinguishing_aspect: "Cadence gate: after box 1 CLOSED at 2026-05-10, next_cycle_due_at == 2026-06-07; a create at clock 2026-06-06 fails ERR_BOX_CYCLE_NOT_DUE, at 2026-06-07 succeeds (>=)."
        test_recipe:
          setup: ["Plan STD; member M with child born 2025-01-15; full rental loop completed: box INSPECTED with a clean inspection and zero fees, then CLOSED at clock 2026-05-10"]
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.cad@x.com", full_name: "Cad Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Ball", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 1, retail_value_cents: 2000, replacement_value_cents: 1500 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-CAD-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-CAD-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/rotation-boxes/${b_id}/initiate-return"
              payload: { carrier: "UPS", tracking_number: "1Z-CAD-RET" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sh_ret: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-08T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-09T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/rotation-boxes/${b_id}/inspect"
              payload:
                items:
                  - { box_item_id: "${it_id}", condition_returned: "GOOD", damage_severity: "NONE", missing_piece_count: 0, disposition: "RESTOCK" }
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/rotation-boxes/${b_id}/close"
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /toy-rental/subscriptions/${s_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { s_v_now: $.data.version }
          trigger:
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v_now}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v_now}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b2_id: $.data.id }
          assert:
            - "At clock 2026-06-06 (one day before due): err == ERR_BOX_CYCLE_NOT_DUE (HTTP 422); no box created"
            - "At clock 2026-06-07 (exactly next_cycle_due_at): create succeeds (201); RotationBox.${b2_id}.cycle_number == 2, status PLANNED"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: accept_hold_happy_path_creates_box_item
        claim_type: conditional_action
        grounds:
          - state_machines.WishlistEntry.HELD_to_FULFILLED
          - endpoints.accept-hold
        distinguishing_aspect: "Conditional action allowed exactly when HELD + unexpired + target box PLANNED with a free slot: accept-hold flips the entry FULFILLED and materializes a BoxItem from the held copy."
        test_recipe:
          setup:
            - "Plan STD (max_holds 2); item X age [12,36] with one NEW copy C1; member M with child born 2025-01-15, ACTIVE subscription, WAITING entry rank 1"
            - "Ops run promotes the entry -> HELD on C1 (hold_expires_at 2026-05-04T00:00:00Z); M then creates a PLANNED box"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Xylophone", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 6, retail_value_cents: 5000, replacement_value_cents: 4000 }
              as: PlatformAdmin
              captures: { ci_x: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_x}/copies"
              payload: { barcode: "BC-AHP-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.ahp@x.com", full_name: "Ahp Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/members/${m_id}/wishlist-entries"
              payload: { catalog_item_id: "${ci_x}", rank: 1 }
              as: Member
              as_user_id: "${m_id}"
              captures: { e_id: $.data.id }
            - call: "POST /toy-rental/ops/allocation-runs"
              as: OperationsManager
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /toy-rental/wishlist-entries/${e_id}/accept-hold"
              payload: { rotation_box_id: "${b_id}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/rotation-boxes/${b_id}/items"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "WishlistEntry.${e_id}.status == FULFILLED (held_copy_id stays ${c1} for audit)"
            - "Box ${b_id} now holds exactly 1 BoxItem with toy_copy_id == ${c1}, loan_status == PENDING_RETURN"
            - "ToyCopy.${c1}.status == RESERVED with reserved_member_id == ${m_id}; RotationBox.${b_id}.version incremented by the accept"

      - name: close_box_blocked_by_outstanding_fees_then_succeeds
        claim_type: conditional_action
        grounds:
          - state_machines.RotationBox.INSPECTED_to_CLOSED
          - "errors[ERR_FEES_OUTSTANDING]"
