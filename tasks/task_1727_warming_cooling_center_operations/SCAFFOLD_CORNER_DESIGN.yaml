# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Warming & Cooling Center Operations — breadth walk over §1.1–§1.7 claims that
# §1.8 does not already cover. excluded_because stubs cite §1.8 instances.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: weather_reading_is_immutable_event
        claim_type: immutability
        grounds: [entities.WeatherReading]
        distinguishing_aspect: "WeatherReading has common_fields: false — responses expose id and created_at but no version or updated_at, and §1.5 declares no update/delete endpoint for readings."
        test_recipe:
          setup: ["Episode in STANDBY"]
          setup_api_calls:
            - call: "POST /api/episodes"
              payload: { mode: "WARMING", threshold_f: 32.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
          trigger:
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 30.0, heat_index_f: 28.0 }, as: EOCManager }
            - call: "GET /api/episodes/${ep}/weather-readings"
              as: EOCManager
              captures: { rid: "$.data[0].id", rc: "$.data[0].created_at" }
          assert:
            - "Reading response contains id and created_at but no version and no updated_at field"
            - "observed_at round-trips as 2026-08-10T06:00:00Z and source defaults to MANUAL"
      - name: episode_create_applies_system_defaults
        claim_type: defaults
        grounds: [entities.Episode]
        distinguishing_aspect: "A fresh Episode starts STANDBY with trigger_met false, breach_run_minutes 0, extension_count 0, ops_run_index 0 and version 1 regardless of input."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 2, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { st: $.data.status, tm: $.data.trigger_met, br: $.data.breach_run_minutes, ec: $.data.extension_count, oi: $.data.ops_run_index, v: $.data.version }
          assert:
            - "status == STANDBY, trigger_met == false, breach_run_minutes == 0"
            - "extension_count == 0, ops_run_index == 0, version == 1"
            - "activated_at, activated_by_user_id, deactivated_at are all null"
      - name: guest_registration_minimal_barrier_defaults
        claim_type: defaults
        grounds: [entities.Guest]
        distinguishing_aspect: "Only alias is required (minimal-barrier intake); has_pets, pet_count, bag_count, medical_flag default to false/0 and medical_hold_active initializes false."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/guests"
              payload: { alias: "Jane Doe of 5th St" }
              as: IntakeStaff
              as_user_id: "intake-user-1"
              captures: { hp: $.data.has_pets, pc: $.data.pet_count, bc: $.data.bag_count, mf: $.data.medical_flag, mh: $.data.medical_hold_active }
          assert:
            - "has_pets == false, pet_count == 0, bag_count == 0, medical_flag == false, medical_hold_active == false"
            - "No name, ID, or contact field is required by the schema"
      - name: guest_missing_alias_returns_validation
        claim_type: required_fields
        grounds: [entities.Guest, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "alias is the single required input on guest creation; omitting it returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/guests"
              payload: {}
              as: IntakeStaff
              as_user_id: "intake-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http status 400"
      - name: site_capacity_override_pins_beds_effective_against_later_patch
        claim_type: computed_fields
        grounds: [entities.SiteActivation.fields.beds_effective, "concurrency_rules[site-capacity-amend-stale-version]"]
        distinguishing_aspect: "beds_effective is version-pinned at open: an activation opened with capacity_override 2 keeps beds_effective == 2 even after the parent Site's bed_capacity is amended to 50 via a successful OCC PATCH."
        test_recipe:
          setup:
            - "Episode ACTIVE; site with bed_capacity 10; SiteActivation created with capacity_override 2 and opened"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Big Hall", address: "7 Grand Ave", bed_capacity: 10, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id, site_v: $.data.version }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}", capacity_override: 2 }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead Two", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead2: $.data.id }
            - call: "POST /api/site-activations/${sa}/shifts"
              payload: { staff_member_id: "${lead1}", role_on_shift: "SITE_LEAD", start_at: "2026-08-10T22:00:00Z", end_at: "2026-08-11T06:00:00Z" }
              as: SiteLead
              as_user_id: "${lead2}"
              captures: { sh: $.data.id }
            - { call: "POST /api/shifts/${sh}/confirm", payload: {}, as: SiteLead, as_user_id: "${lead2}" }
            - { call: "POST /api/episodes/${ep}/evaluate", payload: {}, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/activate", payload: {}, as: EOCManager }
            - { call: "POST /api/site-activations/${sa}/open", payload: {}, as: SiteLead, as_user_id: "${lead1}" }
          trigger:
            - { call: "PATCH /api/sites/${site}", payload: { bed_capacity: 50, expected_site_version: "${site_v}" }, as: EOCManager }
            - call: "GET /api/site-activations/${sa}"
              as: EOCManager
              captures: { eff: $.data.beds_effective, free: $.data.beds_free }
          assert:
            - "PATCH succeeds (version matched) and Site.bed_capacity == 50 afterwards"
            - "SiteActivation.${sa}.beds_effective == 2 still (pinned at open; no retro-change)"
            - "SiteActivation.${sa}.beds_free == 2"
      - name: episode_not_found_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed UUID that does not exist returns ERR_NOT_FOUND (404), not a 500 or null envelope."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/episodes/00000000-0000-0000-0000-000000000000"
              as: EOCManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http status 404"
  - section: state_machines
    instances:
      - name: terminal_dispatch_arrived_locks_all_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TransportDispatch]
        distinguishing_aspect: "ARRIVED is terminal for TransportDispatch: both a second arrive and a cancel from ARRIVED return ERR_INVALID_STATE and leave the record unchanged."
        test_recipe:
          setup:
            - "Episode ACTIVE; SiteActivation OPEN (beds 4); dispatch ASSIGNED then ARRIVED"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T08:00:00Z" }, as: EOCManager }
            - call: "POST /api/episodes"
              payload: { mode: "COOLING", threshold_f: 100.0, sustained_hours_required: 1, scheduled_end_at: "2026-08-12T00:00:00Z" }
              as: EOCManager
              captures: { ep: $.data.id }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:15:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:30:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T06:45:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - { call: "POST /api/episodes/${ep}/weather-readings", payload: { observed_at: "2026-08-10T07:00:00Z", temp_f: 95.0, heat_index_f: 101.0 }, as: EOCManager }
            - call: "POST /api/sites"
              payload: { name: "Rec Center", address: "1 Main St", bed_capacity: 4, pet_capacity: 0, locker_capacity: 0 }
              as: EOCManager
              captures: { site: $.data.id }
            - call: "POST /api/episodes/${ep}/site-activations"
              payload: { site_id: "${site}" }
              as: EOCManager
              captures: { sa: $.data.id }
            - call: "POST /api/staff-members"
              payload: { full_name: "Lead One", skills: ["SITE_LEAD"] }
              as: EOCManager
              captures: { lead1: $.data.id }
            - call: "POST /api/staff-members"
