      - name: round_void_preserves_cost_ledger
        grounds:
          - state_machines.VerificationRound.CLOSED_to_VOIDED
          - calculations.batch_verification_cost
          - calculations.county_reimbursement_invoice
          - endpoints[POST /verification-rounds/{round_id}/void]
          - endpoints[GET /petitions/{petition_id}/verification-invoice]
        distinguishing_aspect: |
          Conserved quantity: the MONETARY CENTS LEDGER — petition.verification_cost_accrued_cents,
          each batch's stored verification_cost_cents and the whole tiered invoice derived from them —
          a different quantity and a different trigger from the batch invalidate/reinstate pair.
          Voiding the only closed round must undo the accrual exactly: 20 cents accrued and a
          19-cent TIER_A invoice must fall back to 0 across the board, the batches must return to
          AFFIDAVIT_VERIFIED, every line to PENDING with in_sample false and validated_in_round_id
          null, and the petition to SIGNATURES_FILED — after which a fresh round must see the full
          four-line pool again, which is what proves the selection flags were released and not merely
          hidden.
        test_recipe:
          setup:
            - "Identical fixture to the signature-ledger instance up to the tally: standard SOS-FULL, county ALPHA, voters VA1/VA2/VA3 ACTIVE and VA4 INACTIVE, two ALPHA batches of two lines each, one FULL_CHECK round examining all four lines."
            - "After the tally each batch is FULLY_CHECKED with verification_cost_cents 10, the petition holds verification_cost_accrued_cents 20 and round r1 holds accrued_cost_cents 20."
            - "Invoice before the void: gross 20 -> TIER_A (TIER_A_FLOOR_CENTS 20) -> discount floor(20 * 1000 / 10000) == 2 -> subtotal 18 -> surcharge ceil(18 * 250 / 10000) == 1 -> total 19."
