            - call: "POST /coop/members/${f2_id}/pet-profiles"
              payload: { pet_name: "Mochi", species: "CAT", routine_notes: "Indoor cat, feed wet food.", medical_notes: "None.", emergency_vet_name: "Maple Vet Clinic", emergency_vet_phone: "+15550911", emergency_vet_address: "12 Maple St", liability_waiver_accepted: true }
              as: Member
              as_user_id: "${f2_id}"
              captures: { pet2_id: $.data.id }
            - call: "POST /coop/sitting-requests"
              payload: { pet_profile_id: "${pet2_id}", start_at: "2026-09-20T10:00:00Z", end_at: "2026-09-20T14:00:00Z", instructions: "F2's own request" }
              as: Member
              as_user_id: "${f2_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /coop/sitting-requests/${req2_id}/claims"
              payload: { message: "F3 can cover" }
              as: Member
