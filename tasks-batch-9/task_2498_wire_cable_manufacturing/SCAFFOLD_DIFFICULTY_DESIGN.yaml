  # ===========================================================================
  # Rule 6 - boundary precision checks
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: partial_discharge_exactly_at_pd_limit_passes
        grounds:
          - calculations.cable_test_result
          - entities.CableTest.fields.pd_level_pc
          - endpoints.POST_/production-lots/{id}/tests
        metric: "CableTest.pd_level_pc against PD_LIMIT_PC[MV_15KV] = 5.0 pC"
        boundary_endpoint: "POST /production-lots/{id}/tests"
        boundary_triplet: "4.9 pC -> PASS, 5.0 pC -> PASS (inclusive), 5.1 pC -> FAIL"
        distinguishing_aspect: |
          Boundary on a physical measurement (picocoulombs of partial discharge)
          evaluated on the test-recording endpoint. The comparison is <=, so the
          exact-limit reading is conforming; an implementation that writes < here
          fails a lot that the agency would have accepted.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; copper 2026-07-30 at 4.10."
            - "MV compounds XLPE-105-INS (INSULATION, temp_rating_c 105, flame_test FT4, max_voltage_v 15000, wet_rated true) and PE-105-JKT (JACKET, 105, FT4, 15000) both QUALIFIED."
            - "ACTIVE UL file E12345; SKU MV105-2-CU: awg_size 2, COMPRESSED_37, application_rating MV_105, voltage_class MV_15KV, temp_rating_c 105, insulation_thickness_mils 175, conductor_lbs_per_kft 205.0, base_target_kft 20.0. Computed: voltage_rating_v 15000, marking_required false, pd_test_required true, so the required test set is {SPARK, HIPOT, PARTIAL_DISCHARGE} and HIPOT_REQUIRED_KV is 35.0."
            - "Order SO-PD for 4.000 kft at conversion 850.00; rod lot 20000 lbs; two lots of 2000 ft, LOT-PD-A on line EXT-3 and LOT-PD-B on line EXT-4, each drawn, stranded and extruded with measured_min_wall_mils 160.0 / measured_max_wall_mils 175.0 (concentricity 91.43 >= 85, minimum wall required 157.50), then SPARK 0 faults PASS and HIPOT 35.0 kV PASS - which is the whole INLINE set, so both lots already sit at process_state TESTED / quality_state PENDING before the off-line PD result arrives."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /metal-price-quotes"
              payload: { metal: "COPPER", effective_date: "2026-07-30", settlement_price_usd_per_lb: 4.10, source: "COMEX" }
              as: ProcurementBuyer
            - call: "POST /compounds"
              payload: { compound_code: "XLPE-105-INS", layer_role: "INSULATION", temp_rating_c: 105, flame_test: "FT4", max_voltage_v: 15000, wet_rated: true, filler_pct: 3.0 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /compounds"
              payload: { compound_code: "PE-105-JKT", layer_role: "JACKET", temp_rating_c: 105, flame_test: "FT4", max_voltage_v: 15000, wet_rated: true, filler_pct: 8.0 }
              as: ProcessEngineer
              captures: { jkt_id: $.data.id }
            - call: "POST /compounds/${jkt_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "MV-CABLE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "MV105-2-CU", awg_size: "2", conductor_metal: "COPPER", conductor_construction: "COMPRESSED_37", application_rating: "MV_105", voltage_class: "MV_15KV", temp_rating_c: 105, insulation_thickness_mils: 175, conductor_lbs_per_kft: 205.0, insulation_compound_id: "${ins_id}", jacket_compound_id: "${jkt_id}", listing_certification_id: "${cert_id}", base_target_kft: 20.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /customers"
              payload: { account_code: "UTIL", name: "Northern Utility Supply", market_region: "MIDWEST", credit_limit_usd: 500000.00, pass_through_enabled: true, reel_program: "RETURNABLE" }
              as: BillingAnalyst
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", order_number: "SO-PD", ordered_kft: 4.000, price_basis: "ORDER_DATE_LOCK", conversion_price_usd_per_kft: 850.00, order_date: "2026-07-30" }
              as: BillingAnalyst
