# ============================================================================
# SCAFFOLD.yaml — §1.0 – §1.7
# Task 2571 — Inventory Accuracy & Item-Level Tagging Program
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2571. Inventory Accuracy & Item-Level Tagging Program (retail inventory integrity team): item-level tag encoding, application at source and quality verification on receipt, cycle count scheduling by category with handheld or overhead reader coverage, count-to-system variance investigation with root cause categorization, on-hand adjustment authority and thresholds requiring supervisor approval, negative on-hand and phantom inventory detection with automatic correction rules, shrink measurement separating theft, damage, process error and vendor shortage, accuracy impact on omnichannel promising and store fulfillment eligibility, annual physical inventory with third-party counters and reconciliation to book value

domain_name: inventory-accuracy-tagging-program
api_prefix: "/inventory-integrity"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked exclusively by explicit foreign keys. Only two URL
  # families nest (count-task lines, physical-inventory lines, stock-position
  # adjustments) and those nest for creation context only — every entity is
  # independently addressable at `<prefix>/<collection>/{id}` and every
  # relationship is expressed as an FK field, never as URL ownership.

  state_machine_shape: cyclic
  # TagBatch (VERIFICATION_FAILED -> ENCODED rework loop), CountTask
  # (COUNTED -> IN_PROGRESS return-to-count loop), VarianceInvestigation
  # (CAUSE_PROPOSED -> IN_REVIEW return loop AND CAUSE_PROPOSED ->
  # CAUSE_PROPOSED supersede self-loop), PhysicalInventory
  # (FIRST_PASS_COMPLETE -> COUNTING recount loop), ShrinkPeriod
  # (PROVISIONAL_CLOSED -> OPEN reopen loop) all cycle. Adjustment adds a
  # parallel-dimension machine (approval_state x posting_state) and Store adds
  # a posture-driven derived machine on top.

  relationship_patterns:
    - one_to_many        # Category -> Item, CountTask -> CountLine, PhysicalInventory -> PhysicalInventoryLine
    - many_to_many       # Store x Item resolved through StockPosition; Store x Category resolved through CountSchedule
    - cross_aggregate    # VarianceInvestigation references CountLine AND ShrinkPeriod; Adjustment references StockPosition AND VarianceInvestigation

  role_model: segregation_of_duties
  # The user who proposes a variance root cause MUST NOT be the user who
  # approves it; the user who requests an on-hand adjustment MUST NOT be the
  # user who approves it. Enforced on X-User-ID, not merely on role.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  # --------------------------------------------------------------------------
  - name: Category
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Merchandise category code, unique across all Category rows"
        constraints: "1-32 chars, uppercase alphanumerics and hyphen; unique"
      - name: name
        type: string
        source: input
        description: "Human-readable category name"
        constraints: "1-120 chars"
      - name: count_cadence_days
        type: integer
        source: input
        description: "Default cycle-count cadence in days for schedules created against this category"
        constraints: ">= 7 and <= 365"
      - name: variance_tolerance_units
        type: integer
        source: input
        description: "Absolute unit variance a count line may show and still be treated as within tolerance"
        constraints: ">= 0"
      - name: variance_tolerance_value_cents
        type: integer
        source: input
        description: "Landed-cost variance value in cents at or above which a count line is out of tolerance (>= comparison)"
        constraints: "> 0"
      - name: landed_cost_uplift_bps
        type: integer
        source: input
        description: "Basis-point uplift applied to unit cost when valuing a count variance (freight/duty loading)"
        default: 0
        constraints: ">= 0 and <= 5000"
      - name: reader_mode_required
        type: enum
        source: input
        description: "Reader technology this category may be counted with"
        default: "EITHER"
        constraints: "one of {HANDHELD, OVERHEAD, EITHER}"
      - name: min_accuracy_pct
        type: number
        source: input
        description: "Minimum StockPosition.value_accuracy_pct for a position in this category to stay PROMISABLE (>= comparison)"
        constraints: ">= 0.00 and <= 100.00, 2 decimal places"
      - name: auto_correct_negative
        type: boolean
        source: input
        description: "When true, an integrity scan auto-posts a negative-on-hand correction within NEGATIVE_AUTO_CORRECT_MAX_UNITS; when false the correction is routed to supervisor approval and the position is held"
        default: true

  # --------------------------------------------------------------------------
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Store code, unique across all Store rows"
        constraints: "1-16 chars; unique"
      - name: name
        type: string
        source: input
        description: "Store display name"
        constraints: "1-120 chars"
      - name: reader_capability
        type: enum
        source: input
        description: "Reader hardware installed at this store"
        constraints: "one of {HANDHELD_ONLY, OVERHEAD_ONLY, BOTH}"
      - name: overhead_reader_capacity
        type: integer
        source: input
        description: "Maximum number of non-terminal OVERHEAD CountTasks whose windows may overlap at this store"
        default: 2
        constraints: ">= 0 and <= 8"
      - name: total_position_count
        type: integer
        source: computed
        description: "Count of StockPosition rows whose store_id equals this Store.id (no status filter)"
      - name: blocked_position_count
        type: integer
        source: computed
        description: "Count of StockPosition rows for this store with promising_state == BLOCKED"
      - name: restricted_position_count
        type: integer
        source: computed
        description: "Count of StockPosition rows for this store with promising_state == RESTRICTED"
      - name: accuracy_index_bps
        type: integer
        source: computed
        description: "Store-level unit-accuracy index in basis points; see calculations.store_fulfillment_posture"
      - name: fulfillment_status
        type: enum
        source: computed
        description: "Omnichannel fulfillment eligibility posture derived from accuracy_index_bps and blocked/restricted ratios; see calculations.store_fulfillment_posture"
        default: "ELIGIBLE"
        constraints: "one of {ELIGIBLE, PROBATION, SUSPENDED}"

  # --------------------------------------------------------------------------
  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Vendor code, unique across all Vendor rows"
        constraints: "1-16 chars; unique"
      - name: name
        type: string
        source: input
        description: "Vendor legal name"
        constraints: "1-160 chars"
      - name: tag_compliance_score_bps
        type: integer
        source: computed
        description: "Tag-quality compliance score in basis points; starts at 10000, moves on tag verification outcomes and on closed VENDOR_SHORTAGE attributions; see calculations.tag_verification_outcome"
        default: 10000
        constraints: ">= 0 and <= 10000"
      - name: required_verification_sample_pct
        type: integer
        source: computed
        description: "Receipt-verification sample percentage band derived from tag_compliance_score_bps; see calculations.tag_verification_outcome"
        default: 5
        constraints: "one of {5, 10, 20}"
      - name: shortage_event_count
        type: integer
        source: computed
        description: "Number of VarianceInvestigation rows in status CLOSED with approved_root_cause == VENDOR_SHORTAGE attributed to this vendor's items"
        default: 0
      - name: lifetime_chargeback_gross_cents
        type: integer
        source: computed
        description: "Running sum of chargeback_gross_cents over every chargeback issued against this vendor"
        default: 0
      - name: credited_cents
        type: integer
        source: computed
        description: "Running sum of goodwill credits plus rebuttal credits granted to this vendor"
        default: 0
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: "lifetime_chargeback_gross_cents minus credited_cents; the conserved quantity of the vendor money invariant"
        default: 0

  # --------------------------------------------------------------------------
  - name: CounterFirm
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: "Third-party counting firm code, unique across all CounterFirm rows"
        constraints: "1-16 chars; unique"
      - name: name
        type: string
        source: input
        description: "Counting firm name"
        constraints: "1-160 chars"
      - name: certification_level
        type: enum
        source: input
        description: "Certification tier of the counting firm"
        constraints: "one of {TIER_1, TIER_2}"
      - name: max_lines_per_pass
        type: integer
        source: input
        description: "Maximum PhysicalInventoryLine rows this firm may submit within a single pass_round of one physical inventory"
        constraints: ">= 1 and <= 100000"

  # --------------------------------------------------------------------------
  - name: Item
    parent: null
    common_fields: true
    fields:
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; the merchandise category this SKU belongs to"
      - name: primary_vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor a VENDOR_SHORTAGE variance on this SKU is charged back to"
      - name: sku
        type: string
        source: input
        description: "Stock-keeping unit code, unique across all Item rows"
        constraints: "1-32 chars; unique"
      - name: description
        type: string
        source: input
        description: "SKU description"
        constraints: "1-240 chars"
      - name: unit_cost_cents
        type: integer
        source: input
        description: "Book unit cost in cents; the sole cost basis for every valuation in this scaffold"
        constraints: "> 0"
      - name: retail_price_cents
        type: integer
        source: input
        description: "Ticketed retail price in cents"
        constraints: "> 0"
      - name: tag_encoding_scheme
        type: enum
        source: input
        description: "Item-level tag encoding scheme required for this SKU"
        constraints: "one of {SGTIN_96, SGTIN_198, NONE}"
      - name: epc_prefix_length
        type: integer
        source: input
        description: "Required length of the EPC company prefix on tags encoded for this SKU"
        default: 7
        constraints: ">= 6 and <= 12"
      - name: tag_required
        type: boolean
        source: input
        description: "When true, receipts of this SKU must arrive as a verified TagBatch"
        default: true

  # --------------------------------------------------------------------------
  - name: StockPosition
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store holding this position"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the SKU held"
      - name: baseline_on_hand_units
        type: integer
        source: input
        description: "Opening on-hand units declared at position creation; immutable thereafter and the anchor of the unit-conservation invariant"
        default: 0
        constraints: ">= 0"
      - name: on_hand_units
        type: integer
        source: computed
        description: "baseline_on_hand_units + sum of delta_units over every Adjustment on this position whose posting_state == POSTED; may go negative"
      - name: reserved_units
        type: integer
        source: input
        description: "Units reserved against open omnichannel orders; set at creation, never mutated by this scaffold"
        default: 0
        constraints: ">= 0"
      - name: phantom_units
        type: integer
        source: computed
        description: "Units flagged phantom by the most recent integrity scan and not yet cleared; reset to 0 once the PHANTOM_CLEAR adjustment posts"
        default: 0
      - name: book_value_cents
        type: integer
        source: computed
        description: "on_hand_units * Item.unit_cost_cents; may be negative when on_hand_units is negative"
      - name: last_counted_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent CountTask submit that included this position; null until first counted"
      - name: last_count_system_units
        type: integer
        source: computed
        description: "system_units_snapshot of the most recent counted CountLine for this position; 0 until first counted; denominator of the unit-accuracy variant"
        default: 0
      - name: last_count_book_value_cents
        type: integer
        source: computed
        description: "last_count_system_units * Item.unit_cost_cents captured from the most recent counted CountLine; 0 until first counted; denominator of the value-accuracy variant"
        default: 0
      - name: last_variance_units
        type: integer
        source: computed
        description: "variance_units of the most recent counted CountLine for this position; 0 until first counted"
        default: 0
      - name: last_variance_value_cents
        type: integer
        source: computed
        description: "variance_value_cents of the most recent counted CountLine for this position; 0 until first counted"
        default: 0
      - name: unit_accuracy_pct
        type: number
        source: computed
        description: "Unit-basis accuracy variant; see calculations.stock_accuracy_pct. Defaults to 100.00 while last_counted_at is null"
        default: 100.00
      - name: value_accuracy_pct
        type: number
        source: computed
        description: "Value-basis accuracy variant; see calculations.stock_accuracy_pct. Defaults to 100.00 while last_counted_at is null"
        default: 100.00
      - name: tag_integrity_hold
        type: boolean
        source: computed
        description: "Set true by a FAILED tag verification on this store+item and by a non-auto-correctable negative on-hand; cleared only by a VERIFIED_PASS TagBatch on the same store+item"
        default: false
      - name: negative_correction_count
        type: integer
        source: computed
        description: "Number of NEGATIVE_CORRECTION adjustments auto-posted against this position by integrity scans"
        default: 0
      - name: promising_state
        type: enum
        source: computed
        description: "Omnichannel promising gate for this position; see calculations.position_promising_state"
        default: "PROMISABLE"
        constraints: "one of {PROMISABLE, RESTRICTED, BLOCKED}"

  # --------------------------------------------------------------------------
  - name: TagBatch
    parent: null
    common_fields: true
    fields:
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; the vendor encoding and applying the tags at source"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the SKU being tagged"
      - name: destination_store_id
        type: string
        source: input
        description: "FK -> Store.id; the store that receives and verifies this batch"
      - name: encoding_scheme
        type: enum
        source: input
        description: "Encoding scheme actually used by the vendor; must equal Item.tag_encoding_scheme"
        constraints: "one of {SGTIN_96, SGTIN_198}"
      - name: epc_prefix
        type: string
        source: input
        description: "EPC company prefix printed on the tags; length must equal Item.epc_prefix_length"
        constraints: "digits only"
      - name: quantity_encoded
        type: integer
        source: input
        description: "Units tagged at source in this batch"
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "TagBatch lifecycle state; see state_machines.TagBatch"
        default: "DRAFT"
        constraints: "one of {DRAFT, ENCODED, RECEIVED, VERIFIED_PASS, VERIFICATION_FAILED, SCRAPPED}"
      - name: rework_round
        type: integer
        source: computed
        description: "Number of completed rework loops; incremented on every VERIFICATION_FAILED -> ENCODED transition"
        default: 0
      - name: required_sample_units
        type: integer
        source: computed
        description: "Sample size the receiving store must read, frozen at the DRAFT -> ENCODED transition; see calculations.tag_verification_outcome"
        default: 0
      - name: sampled_units
        type: integer
        source: computed
        description: "Units actually read during the most recent verification attempt; 0 before first verify"
        default: 0
      - name: readable_units
        type: integer
        source: computed
        description: "Units within sampled_units whose EPC decoded successfully in the most recent verification"
        default: 0
      - name: duplicate_epc_count
        type: integer
        source: computed
        description: "Duplicate EPCs observed in the most recent verification"
        default: 0
      - name: unencoded_units
        type: integer
        source: computed
        description: "Units in the sample carrying no tag at all in the most recent verification"
        default: 0
      - name: read_rate_bps
        type: integer
        source: computed
        description: "floor(10000 * readable_units / sampled_units) for the most recent verification; 0 before first verify"
        default: 0
      - name: verification_outcome
        type: enum
        source: computed
        description: "Outcome of the most recent verification; null before first verify"
        constraints: "one of {PASS, FAIL} or null"

  # --------------------------------------------------------------------------
  - name: CountSchedule
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store this cycle-count schedule applies to"
      - name: category_id
        type: string
        source: input
        description: "FK -> Category.id; the merchandise category counted on this cadence"
      - name: cadence_days
        type: integer
        source: input
        description: "Days between successive count windows; seeded from Category.count_cadence_days when omitted"
        constraints: ">= 7 and <= 365"
      - name: reader_mode
        type: enum
        source: input
        description: "Reader technology this schedule's tasks must use"
        constraints: "one of {HANDHELD, OVERHEAD}"
      - name: next_due_date
        type: string
        source: computed
        description: "Calendar date (YYYY-MM-DD) on or after which the next CountTask window may start; seeded from first_due_date, advanced by cadence_days on every RECONCILED task"
      - name: status
        type: enum
        source: computed
        description: "Schedule lifecycle state"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, PAUSED, RETIRED}"
      - name: completed_cycle_count
        type: integer
        source: computed
        description: "Number of CountTasks on this schedule that reached RECONCILED"
        default: 0

  # --------------------------------------------------------------------------
  - name: CountTask
    parent: null
    common_fields: true
    fields:
      - name: count_schedule_id
        type: string
        source: input
        description: "FK -> CountSchedule.id; the schedule that authorises this count"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; copied from CountSchedule.store_id at creation"
      - name: category_id
        type: string
        source: system
        description: "FK -> Category.id; copied from CountSchedule.category_id at creation"
      - name: reader_mode
        type: enum
        source: input
        description: "Reader technology this task is executed with"
        constraints: "one of {HANDHELD, OVERHEAD}"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the count window; intervals are half-open [window_start, window_end)"
      - name: window_end
        type: datetime
        source: input
        description: "Exclusive end of the count window; must be strictly after window_start"
      - name: status
        type: enum
        source: computed
        description: "CountTask lifecycle state; see state_machines.CountTask"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, IN_PROGRESS, COUNTED, RECONCILED, VOIDED}"
      - name: recount_round
        type: integer
        source: computed
        description: "Number of COUNTED -> IN_PROGRESS return-to-count loops executed on this task"
        default: 0
      - name: in_scope_position_count
        type: integer
        source: computed
        description: "Count of StockPosition rows where store_id == CountTask.store_id and Item.category_id == CountTask.category_id, snapshotted at the SCHEDULED -> IN_PROGRESS transition"
        default: 0
      - name: counted_line_count
        type: integer
        source: computed
        description: "Number of CountLine rows attached to this task"
        default: 0
      - name: coverage_pct
        type: number
        source: computed
        description: "Reader-weighted coverage of the in-scope population; see calculations.count_coverage_pct"
        default: 0.00
      - name: variance_line_count
        type: integer
        source: computed
        description: "Number of attached CountLine rows with within_tolerance == false, set at submit"
        default: 0
      - name: total_variance_value_cents
        type: integer
        source: computed
        description: "Sum of the already-rounded per-line variance_value_cents over every attached CountLine; see calculations.count_variance_valuation"
        default: 0

  # --------------------------------------------------------------------------
  - name: CountLine
    parent: null
    common_fields: true
    fields:
      - name: count_task_id
        type: string
        source: input
        description: "FK -> CountTask.id; the count this line belongs to"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the SKU counted"
      - name: stock_position_id
        type: string
        source: system
        description: "FK -> StockPosition.id; resolved from (CountTask.store_id, item_id) at line creation"
      - name: counted_units
        type: integer
        source: input
        description: "Physical units observed by the counter"
        constraints: ">= 0"
      - name: system_units_snapshot
        type: integer
        source: system
        description: "StockPosition.on_hand_units at the instant this line was created; frozen thereafter"
      - name: read_mode_used
        type: enum
        source: input
        description: "Reader technology actually used for this line; drives coverage weighting"
        constraints: "one of {HANDHELD, OVERHEAD}"
      - name: variance_units
        type: integer
        source: computed
        description: "counted_units - system_units_snapshot, computed at line creation"
      - name: variance_value_cents
        type: integer
        source: computed
        description: "Landed-cost value of the absolute unit variance, rounded per line; see calculations.count_variance_valuation"
      - name: within_tolerance
        type: boolean
        source: computed
        description: "true iff abs(variance_units) <= Category.variance_tolerance_units AND variance_value_cents < Category.variance_tolerance_value_cents"

  # --------------------------------------------------------------------------
  - name: VarianceInvestigation
    parent: null
    common_fields: true
    fields:
      - name: count_line_id
        type: string
        source: system
        description: "FK -> CountLine.id; the out-of-tolerance line that opened this investigation"
      - name: store_id
        type: string
        source: system
        description: "FK -> Store.id; copied from the count line's task"
      - name: shrink_period_id
        type: string
        source: system
        description: "FK -> ShrinkPeriod.id; the covering shrink period this investigation's value is attributed to"
      - name: variance_units
        type: integer
        source: system
        description: "Copied from CountLine.variance_units at open; immutable"
      - name: variance_value_cents
        type: integer
        source: system
        description: "Copied from CountLine.variance_value_cents at open; immutable and the sole amount attributed to shrink buckets"
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle state; see state_machines.VarianceInvestigation"
        default: "OPEN"
        constraints: "one of {OPEN, IN_REVIEW, CAUSE_PROPOSED, CAUSE_APPROVED, CLOSED, WAIVED}"
      - name: assigned_investigator_id
        type: string
        source: input
        description: "Opaque operator id of the analyst assigned to investigate; null until assigned"
      - name: proposed_root_cause
        type: enum
        source: input
        description: "Root cause put forward by the analyst; null until a proposal exists"
        constraints: "one of {THEFT, DAMAGE, PROCESS_ERROR, VENDOR_SHORTAGE}"
      - name: approved_root_cause
        type: enum
        source: computed
        description: "Root cause frozen at the CAUSE_PROPOSED -> CAUSE_APPROVED transition; null before approval"
        constraints: "one of {THEFT, DAMAGE, PROCESS_ERROR, VENDOR_SHORTAGE}"
      - name: proposed_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the operator whose proposal is currently on record; rewritten on every supersede"
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the supervisor who approved the cause; MUST differ from proposed_by_user_id"
      - name: proposal_round
        type: integer
        source: computed
        description: "Number of cause proposals recorded, counting supersedes and re-proposals after a return"
        default: 0
      - name: evidence_note
        type: string
        source: input
        description: "Free-text evidence supporting the proposed root cause"
        constraints: "1-2000 chars"

  # --------------------------------------------------------------------------
  - name: Adjustment
    parent: null
    common_fields: true
    fields:
      - name: stock_position_id
        type: string
        source: input
        description: "FK -> StockPosition.id; the position whose on-hand this adjustment moves"
      - name: investigation_id
        type: string
        source: input
        description: "FK -> VarianceInvestigation.id; the investigation that justifies this adjustment, or null for integrity-scan corrections"
      - name: delta_units
        type: integer
        source: input
        description: "Signed unit movement applied to StockPosition.on_hand_units when posting_state becomes POSTED"
        constraints: "!= 0"
      - name: reason_code
        type: enum
        source: input
        description: "Why the adjustment exists; NEGATIVE_CORRECTION and PHANTOM_CLEAR are mintable only by the integrity scan"
        constraints: "one of {COUNT_VARIANCE, NEGATIVE_CORRECTION, PHANTOM_CLEAR, PHYSICAL_RECONCILIATION}"
      - name: value_impact_cents
        type: integer
        source: computed
        description: "abs(delta_units) * Item.unit_cost_cents; see calculations.adjustment_authority_threshold"
      - name: authority_threshold_cents
        type: integer
        source: computed
        description: "Effective approval threshold frozen at creation; see calculations.adjustment_authority_threshold"
      - name: approval_state
        type: enum
        source: computed
        description: "Approval dimension of the parallel state machine; see state_machines.Adjustment"
        default: "NOT_REQUIRED"
        constraints: "one of {NOT_REQUIRED, PENDING, APPROVED, REJECTED}"
      - name: posting_state
        type: enum
        source: computed
        description: "Posting dimension of the parallel state machine, independent of approval_state"
        default: "UNPOSTED"
        constraints: "one of {UNPOSTED, POSTED, REVERSED}"
      - name: requested_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the operator who created the adjustment, or the literal 'system' for integrity-scan corrections"
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the approver; MUST differ from requested_by_user_id"
      - name: posted_at
        type: datetime
        source: computed
        description: "Logical-clock instant posting_state became POSTED; null while UNPOSTED"
      - name: reversed_at
        type: datetime
        source: computed
        description: "Logical-clock instant posting_state became REVERSED; null otherwise"

  # --------------------------------------------------------------------------
  - name: ShrinkPeriod
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store whose shrink is measured"
      - name: period_start
        type: string
        source: input
        description: "Inclusive first calendar date (YYYY-MM-DD) of the measurement period"
      - name: period_end
        type: string
        source: input
        description: "Inclusive last calendar date (YYYY-MM-DD) of the measurement period; must be >= period_start"
      - name: sales_at_cost_cents
        type: integer
        source: input
        description: "Period sales valued at cost; denominator of shrink_rate_bps"
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Period lifecycle state; see state_machines.ShrinkPeriod"
        default: "OPEN"
        constraints: "one of {OPEN, PROVISIONAL_CLOSED, FINAL_CLOSED}"
      - name: theft_cents
        type: integer
        source: computed
        description: "Shrink attributed to THEFT; see calculations.shrink_attribution"
        default: 0
      - name: damage_cents
        type: integer
        source: computed
        description: "Shrink attributed to DAMAGE"
        default: 0
      - name: process_error_cents
        type: integer
        source: computed
        description: "Shrink attributed to PROCESS_ERROR"
        default: 0
      - name: vendor_shortage_cents
        type: integer
        source: computed
        description: "Shrink attributed to VENDOR_SHORTAGE"
        default: 0
      - name: unresolved_cents
        type: integer
        source: computed
        description: "Shrink from investigations still in a non-terminal status; always 0 under the final variant"
        default: 0
      - name: total_attributable_variance_cents
        type: integer
        source: computed
        description: "theft_cents + damage_cents + process_error_cents + vendor_shortage_cents + unresolved_cents; the conserved quantity of the shrink-bucket invariant"
        default: 0
      - name: provisional_total_shrink_cents
        type: integer
        source: computed
        description: "Provisional variant total; see calculations.shrink_attribution"
        default: 0
      - name: final_total_shrink_cents
        type: integer
        source: computed
        description: "Final variant total; see calculations.shrink_attribution"
        default: 0
      - name: shrink_rate_bps
        type: integer
        source: computed
        description: "Basis-point shrink rate against sales_at_cost_cents, using the provisional total while status != FINAL_CLOSED and the final total once FINAL_CLOSED"
        default: 0
      - name: reopen_count
        type: integer
        source: computed
        description: "Number of PROVISIONAL_CLOSED -> OPEN reopen loops executed on this period"
        default: 0
      - name: chargeback_issued_vendor_ids
        type: array
        source: computed
        description: "Vendor ids for which a chargeback has already been issued out of this period; blocks a second issuance"
        default: []

  # --------------------------------------------------------------------------
  - name: PhysicalInventory
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store being physically counted"
      - name: counter_firm_id
        type: string
        source: input
        description: "FK -> CounterFirm.id; the third-party firm performing the count"
      - name: scheduled_start_date
        type: string
        source: input
        description: "Inclusive first calendar date (YYYY-MM-DD) of the physical count; intervals are CLOSED and carry a PHYSICAL_BLACKOUT_BUFFER_DAYS pad on both sides"
      - name: scheduled_end_date
        type: string
        source: input
        description: "Inclusive last calendar date (YYYY-MM-DD) of the physical count; must be >= scheduled_start_date"
      - name: recount_threshold_bps
        type: integer
        source: input
        description: "Net-variance basis-point level at or above which a recount is mandatory before reconciliation (>= comparison)"
        default: 150
        constraints: ">= 1 and <= 10000"
      - name: status
        type: enum
        source: computed
        description: "Physical inventory lifecycle state; see state_machines.PhysicalInventory"
        default: "PLANNED"
        constraints: "one of {PLANNED, COUNTING, FIRST_PASS_COMPLETE, RECONCILING, CERTIFIED, ABANDONED}"
      - name: recount_round
        type: integer
        source: computed
        description: "Number of FIRST_PASS_COMPLETE -> COUNTING recount loops ordered on this inventory"
        default: 0
      - name: line_count
        type: integer
        source: computed
        description: "Number of PhysicalInventoryLine rows whose pass_round equals the current recount_round"
        default: 0
      - name: book_value_cents
        type: integer
        source: computed
        description: "Sum of book_value_snapshot_cents over the current pass_round's lines; see calculations.physical_reconciliation"
        default: 0
      - name: counted_value_cents
        type: integer
        source: computed
        description: "Sum of counted_units * Item.unit_cost_cents over the current pass_round's lines"
        default: 0
      - name: net_variance_cents
        type: integer
        source: computed
        description: "counted_value_cents - book_value_cents; signed"
        default: 0
      - name: net_variance_bps
        type: integer
        source: computed
        description: "floor(10000 * abs(net_variance_cents) / book_value_cents), or 0 when book_value_cents == 0"
        default: 0
      - name: certified_at
        type: datetime
        source: computed
        description: "Logical-clock instant status became CERTIFIED; null otherwise"

  # --------------------------------------------------------------------------
  - name: PhysicalInventoryLine
    parent: null
    common_fields: true
    fields:
      - name: physical_inventory_id
        type: string
        source: input
        description: "FK -> PhysicalInventory.id; the physical count this line belongs to"
      - name: item_id
        type: string
        source: input
        description: "FK -> Item.id; the SKU counted by the third-party counter"
      - name: counted_units
        type: integer
        source: input
        description: "Units observed by the third-party counter"
        constraints: ">= 0"
      - name: book_units_snapshot
        type: integer
        source: system
        description: "StockPosition.on_hand_units for (PhysicalInventory.store_id, item_id) at line creation"
      - name: book_value_snapshot_cents
        type: integer
        source: system
        description: "book_units_snapshot * Item.unit_cost_cents, frozen at line creation"
      - name: variance_units
        type: integer
        source: computed
        description: "counted_units - book_units_snapshot"
      - name: variance_value_cents
        type: integer
        source: computed
        description: "variance_units * Item.unit_cost_cents; signed, no landed-cost uplift (physical reconciliation values at pure book cost)"
      - name: pass_round
        type: integer
        source: system
        description: "PhysicalInventory.recount_round at line creation; a later round's line supersedes an earlier round's line for the same item"
      - name: superseded
        type: boolean
        source: computed
        description: "true when a line for the same physical_inventory_id and item_id exists with a strictly greater pass_round, or with the same pass_round and a strictly greater created_at"
        default: false

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  # --------------------------------------------------------------------------
  # TagBatch — CYCLIC: ENCODED -> RECEIVED -> VERIFICATION_FAILED -> ENCODED
  # --------------------------------------------------------------------------
  - entity: TagBatch
    initial_state: DRAFT
    terminal_states: [VERIFIED_PASS, SCRAPPED]
    transitions:
      - from: DRAFT
        to: ENCODED
        trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/encode"
        actor: VendorRep
        preconditions:
          - "TagBatch.status == DRAFT"
          - "X-User-ID == TagBatch.vendor_id (VendorRep identity scope)"
          - "TagBatch.encoding_scheme == Item.tag_encoding_scheme for TagBatch.item_id, else ERR_TAG_SCHEME_MISMATCH"
          - "length(TagBatch.epc_prefix) == Item.epc_prefix_length, else ERR_TAG_SCHEME_MISMATCH"
        side_effects:
          - "freeze TagBatch.required_sample_units = ceil(quantity_encoded * Vendor.required_verification_sample_pct / 100) using the vendor's CURRENT band (calculations.tag_verification_outcome)"
          - "TagBatch.status = ENCODED"
          - "increments TagBatch.version by 1"

      - from: ENCODED
        to: RECEIVED
        trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/receive"
        actor: StoreOps
        preconditions:
          - "TagBatch.status == ENCODED"
          - "X-User-ID == TagBatch.destination_store_id (StoreOps identity scope)"
        side_effects:
          - "TagBatch.status = RECEIVED"
          - "increments TagBatch.version by 1"

      - from: RECEIVED
        to: VERIFIED_PASS
        trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/verify with a sample that satisfies calculations.tag_verification_outcome"
        actor: StoreOps
        preconditions:
          - "TagBatch.status == RECEIVED"
          - "X-User-ID == TagBatch.destination_store_id"
          - "sampled_units >= TagBatch.required_sample_units, else ERR_SAMPLE_BELOW_REQUIRED"
          - "readable_units <= sampled_units AND unencoded_units <= sampled_units, else ERR_INVALID_VERIFICATION_COUNTS"
          - "calculations.tag_verification_outcome yields PASS"
        side_effects:
          - "store sampled_units / readable_units / duplicate_epc_count / unencoded_units on the batch"
          - "TagBatch.read_rate_bps = floor(10000 * readable_units / sampled_units)"
          - "TagBatch.verification_outcome = PASS; TagBatch.status = VERIFIED_PASS"
          - "Vendor.tag_compliance_score_bps = min(10000, score + TAG_PASS_REWARD_BPS); Vendor.required_verification_sample_pct re-derived from the new band"
          - "the StockPosition for (TagBatch.destination_store_id, TagBatch.item_id), when one exists, has tag_integrity_hold set to false"
          - "that StockPosition's promising_state is re-derived (calculations.position_promising_state), then Store.fulfillment_status is re-derived (calculations.store_fulfillment_posture)"
          - "increments TagBatch.version by 1"

      - from: RECEIVED
        to: VERIFICATION_FAILED
        trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/verify with a sample that fails calculations.tag_verification_outcome"
        actor: StoreOps
        preconditions:
          - "TagBatch.status == RECEIVED"
          - "X-User-ID == TagBatch.destination_store_id"
          - "sampled_units >= TagBatch.required_sample_units, else ERR_SAMPLE_BELOW_REQUIRED"
          - "readable_units <= sampled_units AND unencoded_units <= sampled_units, else ERR_INVALID_VERIFICATION_COUNTS"
          - "calculations.tag_verification_outcome yields FAIL"
        side_effects:
          - "CASCADE HOP 1 — store the verification sample, set TagBatch.read_rate_bps, verification_outcome = FAIL, status = VERIFICATION_FAILED"
          - "Vendor.tag_compliance_score_bps = max(0, score - TAG_FAIL_PENALTY_BPS); Vendor.required_verification_sample_pct re-derived from the new band"
          - "CASCADE HOP 2 — caused by hop 1: the StockPosition for (destination_store_id, item_id), when one exists, has tag_integrity_hold set to true"
          - "CASCADE HOP 3 — caused by hop 2: that StockPosition.promising_state is re-derived and becomes BLOCKED (tag_integrity_hold dominates)"
          - "CASCADE HOP 4 — caused by hop 3: Store.blocked_position_count / accuracy_index_bps / fulfillment_status are re-derived"
          - "increments TagBatch.version by 1"

      - from: VERIFICATION_FAILED
        to: ENCODED
        trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/rework"
        actor: VendorRep
        preconditions:
          - "TagBatch.status == VERIFICATION_FAILED"
          - "X-User-ID == TagBatch.vendor_id"
          - "TagBatch.rework_round < MAX_REWORK_ROUNDS, else ERR_REWORK_LIMIT_REACHED"
        side_effects:
          - "TagBatch.rework_round += 1"
          - "TagBatch.required_sample_units re-frozen from the vendor's CURRENT (already penalised) required_verification_sample_pct"
          - "TagBatch.sampled_units / readable_units / duplicate_epc_count / unencoded_units / read_rate_bps reset to 0; verification_outcome reset to null"
          - "TagBatch.status = ENCODED"
          - "increments TagBatch.version by 1"
        note: "This edge closes the ENCODED -> RECEIVED -> VERIFICATION_FAILED -> ENCODED cycle."

      - from: VERIFICATION_FAILED
        to: SCRAPPED
        trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/scrap"
        actor: InventorySupervisor
        preconditions:
          - "TagBatch.status == VERIFICATION_FAILED"
        side_effects:
          - "TagBatch.status = SCRAPPED"
          - "the StockPosition for (destination_store_id, item_id) keeps tag_integrity_hold == true — scrapping does NOT clear the hold; only a VERIFIED_PASS batch does"
          - "increments TagBatch.version by 1"

  # --------------------------------------------------------------------------
  # CountTask — CYCLIC (COUNTED -> IN_PROGRESS) + BRANCHING (COUNTED -> RECONCILED | IN_PROGRESS)
  # --------------------------------------------------------------------------
  - entity: CountTask
    initial_state: SCHEDULED
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inventory-integrity/count-tasks/{count_task_id}/start"
        actor: StoreOps
        preconditions:
          - "CountTask.status == SCHEDULED"
          - "X-User-ID == CountTask.store_id (StoreOps identity scope)"
          - "CountSchedule.status == ACTIVE for CountTask.count_schedule_id, else ERR_COUNT_SCHEDULE_NOT_ACTIVE  # CROSS-ENTITY GUARD"
        side_effects:
          - "CountTask.in_scope_position_count snapshotted = count of StockPosition where store_id == CountTask.store_id and Item.category_id == CountTask.category_id"
          - "CountTask.status = IN_PROGRESS"
          - "increments CountTask.version by 1"

      - from: IN_PROGRESS
        to: COUNTED
        trigger: "POST /inventory-integrity/count-tasks/{count_task_id}/submit"
        actor: StoreOps
        preconditions:
          - "CountTask.status == IN_PROGRESS"
          - "X-User-ID == CountTask.store_id"
          - "CountTask.counted_line_count >= 1, else ERR_NO_COUNT_LINES"
          - "calculations.count_coverage_pct >= MIN_COVERAGE_PCT, else ERR_COUNT_COVERAGE_BELOW_MIN"
          - "when at least one attached CountLine has within_tolerance == false, a ShrinkPeriod for CountTask.store_id whose [period_start, period_end] inclusive range contains date(CountTask.window_end) and whose status is OPEN or PROVISIONAL_CLOSED must exist, else ERR_NO_COVERING_SHRINK_PERIOD"
        side_effects:
          - "CountTask.coverage_pct = calculations.count_coverage_pct"
          - "CountTask.total_variance_value_cents = sum of the already-rounded CountLine.variance_value_cents (calculations.count_variance_valuation, per-line-then-sum order)"
          - "CountTask.variance_line_count = count of attached lines with within_tolerance == false"
          - "for every attached CountLine, in ascending CountLine.created_at order: the referenced StockPosition gets last_counted_at = logical clock now, last_variance_units = line.variance_units, last_variance_value_cents = line.variance_value_cents, last_count_system_units = line.system_units_snapshot, last_count_book_value_cents = line.system_units_snapshot * Item.unit_cost_cents, and unit_accuracy_pct / value_accuracy_pct recomputed (calculations.stock_accuracy_pct)"
          - "for every attached CountLine with within_tolerance == false, a VarianceInvestigation is opened in status OPEN with variance_units / variance_value_cents copied from the line and shrink_period_id set to the covering ShrinkPeriod"
          - "each opened investigation causes the covering ShrinkPeriod's unresolved_cents to grow by the investigation's variance_value_cents under the provisional variant, and total_attributable_variance_cents / provisional_total_shrink_cents / shrink_rate_bps to be re-derived"
          - "every touched StockPosition.promising_state is re-derived, then Store.fulfillment_status is re-derived"
          - "CountTask.status = COUNTED"
          - "increments CountTask.version by 1"

      - from: COUNTED
        to: IN_PROGRESS
        trigger: "POST /inventory-integrity/count-tasks/{count_task_id}/return-to-count"
        actor: InventorySupervisor
        preconditions:
          - "CountTask.status == COUNTED"
          - "CountTask.recount_round < MAX_RECOUNT_ROUNDS, else ERR_REWORK_LIMIT_REACHED"
        side_effects:
          - "CountTask.recount_round += 1"
          - "every CountLine attached to this task is deleted; CountTask.counted_line_count / coverage_pct / variance_line_count / total_variance_value_cents reset to 0 / 0.00 / 0 / 0"
          - "every VarianceInvestigation whose count_line_id pointed at a deleted line and whose status is OPEN moves to WAIVED; its variance_value_cents is removed from the covering ShrinkPeriod's unresolved_cents and the period's totals are re-derived"
          - "investigations already past OPEN (IN_REVIEW, CAUSE_PROPOSED, CAUSE_APPROVED, CLOSED) are NOT touched; their count_line_id becomes a dangling read that GET /variance-investigations still returns"
          - "CountTask.status = IN_PROGRESS"
          - "increments CountTask.version by 1"
        note: "Closes the IN_PROGRESS -> COUNTED -> IN_PROGRESS cycle."

      - from: COUNTED
        to: RECONCILED
        trigger: "POST /inventory-integrity/count-tasks/{count_task_id}/reconcile"
        actor: InventoryAnalyst
        preconditions:
          - "CountTask.status == COUNTED"
          - "every VarianceInvestigation opened by this task is in status CLOSED or WAIVED, else ERR_OPEN_INVESTIGATIONS"
        side_effects:
          - "CountSchedule.completed_cycle_count += 1"
          - "CountSchedule.next_due_date = date(CountTask.window_end) + CountSchedule.cadence_days days"
          - "CountTask.status = RECONCILED"
          - "increments CountTask.version by 1"

      - from: IN_PROGRESS
        to: VOIDED
        trigger: "POST /inventory-integrity/count-tasks/{count_task_id}/void"
        actor: InventorySupervisor
        preconditions:
          - "CountTask.status == IN_PROGRESS"
        side_effects:
          - "every CountLine attached to this task is deleted; counted_line_count reset to 0"
          - "CountTask.status = VOIDED"
          - "CountSchedule.next_due_date is NOT advanced and completed_cycle_count is NOT incremented"
          - "increments CountTask.version by 1"

      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /inventory-integrity/count-tasks/{count_task_id}/void"
        actor: InventorySupervisor
        preconditions:
          - "CountTask.status == SCHEDULED"
        side_effects:
          - "CountTask.status = VOIDED"
          - "increments CountTask.version by 1"

  # --------------------------------------------------------------------------
  # VarianceInvestigation — CYCLIC (CAUSE_PROPOSED -> IN_REVIEW) + SELF-LOOP (supersede)
  # --------------------------------------------------------------------------
  - entity: VarianceInvestigation
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /inventory-integrity/variance-investigations/{investigation_id}/assign"
        actor: InventorySupervisor
        preconditions:
          - "VarianceInvestigation.status == OPEN"
        side_effects:
          - "VarianceInvestigation.assigned_investigator_id = request body investigator_user_id"
          - "VarianceInvestigation.status = IN_REVIEW"
          - "increments VarianceInvestigation.version by 1"

      - from: IN_REVIEW
        to: CAUSE_PROPOSED
        trigger: "POST /inventory-integrity/variance-investigations/{investigation_id}/propose-cause"
        actor: InventoryAnalyst
        preconditions:
          - "VarianceInvestigation.status == IN_REVIEW"
          - "request expected_investigation_version == VarianceInvestigation.version, else ERR_STALE_INVESTIGATION_VERSION"
        side_effects:
          - "VarianceInvestigation.proposed_root_cause = request root_cause; evidence_note stored"
          - "VarianceInvestigation.proposed_by_user_id = X-User-ID; proposal_round += 1"
          - "VarianceInvestigation.status = CAUSE_PROPOSED"
          - "increments VarianceInvestigation.version by 1"

      - from: CAUSE_PROPOSED
        to: CAUSE_PROPOSED
        trigger: "POST /inventory-integrity/variance-investigations/{investigation_id}/propose-cause (supersede)"
        actor: InventoryAnalyst
        preconditions:
          - "VarianceInvestigation.status == CAUSE_PROPOSED"
          - "request expected_investigation_version == VarianceInvestigation.version, else ERR_STALE_INVESTIGATION_VERSION"
        side_effects:
          - "the prior proposal is overwritten: proposed_root_cause, evidence_note and proposed_by_user_id are replaced by the new submission"
          - "VarianceInvestigation.proposal_round += 1"
          - "VarianceInvestigation.status stays CAUSE_PROPOSED"
          - "increments VarianceInvestigation.version by 1"
        note: "A later proposal legitimately supersedes an earlier one, so a strictly sequential second proposal would itself succeed. This is the true race resolved by OCC in §1.2.1 (rule_id: cause-proposal-stale-investigation)."

      - from: CAUSE_PROPOSED
        to: IN_REVIEW
        trigger: "POST /inventory-integrity/variance-investigations/{investigation_id}/return"
        actor: InventorySupervisor
        preconditions:
          - "VarianceInvestigation.status == CAUSE_PROPOSED"
          - "X-User-ID != VarianceInvestigation.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "VarianceInvestigation.proposed_root_cause reset to null; proposed_by_user_id reset to null; proposal_round is NOT decremented"
          - "VarianceInvestigation.status = IN_REVIEW"
          - "increments VarianceInvestigation.version by 1"
        note: "Closes the IN_REVIEW -> CAUSE_PROPOSED -> IN_REVIEW revision cycle."

      - from: CAUSE_PROPOSED
        to: CAUSE_APPROVED
        trigger: "POST /inventory-integrity/variance-investigations/{investigation_id}/approve-cause"
        actor: InventorySupervisor
        preconditions:
          - "VarianceInvestigation.status == CAUSE_PROPOSED"
          - "X-User-ID != VarianceInvestigation.proposed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the covering ShrinkPeriod's status is OPEN, else ERR_SHRINK_PERIOD_INVALID_STATE  # CROSS-ENTITY GUARD"
        side_effects:
          - "VarianceInvestigation.approved_root_cause = proposed_root_cause (frozen); approved_by_user_id = X-User-ID"
          - "VarianceInvestigation.status = CAUSE_APPROVED"
          - "the amount stays in the covering ShrinkPeriod's unresolved_cents under the provisional variant — attribution to a named bucket happens only at CLOSE"
          - "increments VarianceInvestigation.version by 1"

      - from: CAUSE_APPROVED
        to: CLOSED
        trigger: "POST /inventory-integrity/variance-investigations/{investigation_id}/close"
        actor: InventorySupervisor
        preconditions:
          - "VarianceInvestigation.status == CAUSE_APPROVED"
          - "the covering ShrinkPeriod's status is OPEN, else ERR_SHRINK_PERIOD_INVALID_STATE"
        side_effects:
          - "CASCADE HOP 1 — VarianceInvestigation.status = CLOSED"
          - "CASCADE HOP 2 — caused by hop 1: the covering ShrinkPeriod moves variance_value_cents out of unresolved_cents and into the bucket named by approved_root_cause (theft_cents / damage_cents / process_error_cents / vendor_shortage_cents); total_attributable_variance_cents is unchanged by construction; provisional_total_shrink_cents, final_total_shrink_cents and shrink_rate_bps are re-derived"
          - "CASCADE HOP 3 — caused by hop 2, and only when approved_root_cause == VENDOR_SHORTAGE: Vendor(Item.primary_vendor_id of the investigation's count line).shortage_event_count += 1 and tag_compliance_score_bps = max(0, score - VENDOR_SHORTAGE_PENALTY_BPS)"
          - "CASCADE HOP 4 — caused by hop 3: that Vendor.required_verification_sample_pct is re-derived from the new score band, which raises required_sample_units on every TagBatch subsequently encoded for that vendor"
          - "the investigation's StockPosition.promising_state is re-derived (the position is no longer blocked by an open investigation), then Store.fulfillment_status is re-derived"
          - "increments VarianceInvestigation.version by 1"

      - from: OPEN
        to: WAIVED
        trigger: "system event: COUNTED -> IN_PROGRESS return-to-count on the parent CountTask deletes the originating CountLine"
        actor: system
        preconditions:
          - "VarianceInvestigation.status == OPEN"
        side_effects:
          - "VarianceInvestigation.status = WAIVED"
          - "the covering ShrinkPeriod's unresolved_cents shrinks by variance_value_cents; total_attributable_variance_cents and both totals are re-derived"
          - "increments VarianceInvestigation.version by 1"

  # --------------------------------------------------------------------------
  # Adjustment — PARALLEL DIMENSIONS: approval_state x posting_state on one row
  # --------------------------------------------------------------------------
  - entity: Adjustment
    parallel_dimensions: [approval_state, posting_state]
    initial_state: "approval_state = NOT_REQUIRED or PENDING (decided at creation by calculations.adjustment_authority_threshold); posting_state = UNPOSTED"
    terminal_states: ["approval_state = REJECTED", "posting_state = REVERSED"]
    note: |
      The two dimensions advance independently on the SAME row. Approving an
      adjustment never posts it, and posting never changes approval_state.
      An adjustment created with approval_state == NOT_REQUIRED can be posted
      with no approval transition ever occurring; an adjustment approved but
      never posted keeps posting_state == UNPOSTED forever and contributes
      nothing to StockPosition.on_hand_units.
    transitions:
      - from: PENDING
        to: APPROVED
        dimension: approval_state
        trigger: "POST /inventory-integrity/adjustments/{adjustment_id}/approve"
        actor: InventorySupervisor
        preconditions:
          - "Adjustment.approval_state == PENDING, else ERR_ADJUSTMENT_INVALID_STATE"
          - "X-User-ID != Adjustment.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "when Adjustment.value_impact_cents > SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS the acting role must be ShrinkController, else ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP"
        side_effects:
          - "Adjustment.approved_by_user_id = X-User-ID"
          - "Adjustment.approval_state = APPROVED; posting_state stays UNPOSTED"
          - "increments Adjustment.version by 1"

      - from: PENDING
        to: REJECTED
        dimension: approval_state
        trigger: "POST /inventory-integrity/adjustments/{adjustment_id}/reject"
        actor: InventorySupervisor
        preconditions:
          - "Adjustment.approval_state == PENDING, else ERR_ADJUSTMENT_INVALID_STATE"
          - "X-User-ID != Adjustment.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Adjustment.approved_by_user_id = X-User-ID"
          - "Adjustment.approval_state = REJECTED; posting_state stays UNPOSTED and can never leave UNPOSTED"
          - "increments Adjustment.version by 1"

      - from: UNPOSTED
        to: POSTED
        dimension: posting_state
        trigger: "POST /inventory-integrity/adjustments/{adjustment_id}/post"
        actor: InventoryAnalyst
        preconditions:
          - "Adjustment.posting_state == UNPOSTED, else ERR_ADJUSTMENT_INVALID_STATE"
          - "Adjustment.approval_state IN {NOT_REQUIRED, APPROVED}, else ERR_ADJUSTMENT_APPROVAL_REQUIRED"
          - "when Adjustment.investigation_id is not null, VarianceInvestigation.status == CLOSED, else ERR_INVESTIGATION_NOT_CLOSED  # CROSS-ENTITY GUARD"
          - "StockPosition.tag_integrity_hold == false, else ERR_TAG_INTEGRITY_HOLD"
        side_effects:
          - "CASCADE HOP 1 — Adjustment.posting_state = POSTED; posted_at = logical clock now"
          - "CASCADE HOP 2 — caused by hop 1: StockPosition.on_hand_units re-derived as baseline_on_hand_units + sum(delta_units over POSTED adjustments); book_value_cents, value_accuracy_pct and unit_accuracy_pct re-derived"
          - "CASCADE HOP 3 — caused by hop 2: StockPosition.promising_state re-derived (calculations.position_promising_state) — a negative on_hand_units or a value_accuracy_pct below Category.min_accuracy_pct flips the position"
          - "CASCADE HOP 4 — caused by hop 3: Store.blocked_position_count / restricted_position_count / accuracy_index_bps / fulfillment_status re-derived (calculations.store_fulfillment_posture)"
          - "CASCADE HOP 5 — caused by hop 4, and only when Store.fulfillment_status becomes SUSPENDED: every CountSchedule for that store with status == ACTIVE has cadence_days set to max(MIN_ACCELERATED_CADENCE_DAYS, floor(cadence_days / 2)) and next_due_date set to date(logical clock now)"
          - "increments Adjustment.version by 1"

      - from: POSTED
        to: REVERSED
        dimension: posting_state
        trigger: "POST /inventory-integrity/adjustments/{adjustment_id}/reverse"
        actor: InventorySupervisor
        preconditions:
          - "Adjustment.posting_state == POSTED, else ERR_ADJUSTMENT_INVALID_STATE"
          - "X-User-ID != Adjustment.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Adjustment.posting_state = REVERSED; reversed_at = logical clock now; approval_state is left exactly as it was"
          - "COMPENSATION — the adjustment leaves the POSTED set, so StockPosition.on_hand_units re-derives to baseline_on_hand_units + sum(delta_units over the remaining POSTED adjustments); the unit-conservation invariant holds with zero drift"
          - "book_value_cents / unit_accuracy_pct / value_accuracy_pct / promising_state re-derived, then Store.fulfillment_status re-derived"
          - "a Store.fulfillment_status recovery does NOT restore the CountSchedule cadence_days or next_due_date changed by the earlier suspension cascade — schedule acceleration is deliberately one-way"
          - "increments Adjustment.version by 1"

  # --------------------------------------------------------------------------
  # ShrinkPeriod — CYCLIC (PROVISIONAL_CLOSED -> OPEN reopen loop)
  # --------------------------------------------------------------------------
  - entity: ShrinkPeriod
    initial_state: OPEN
    terminal_states: [FINAL_CLOSED]
    transitions:
      - from: OPEN
        to: PROVISIONAL_CLOSED
        trigger: "POST /inventory-integrity/shrink-periods/{shrink_period_id}/provisional-close"
        actor: ShrinkController
        preconditions:
          - "ShrinkPeriod.status == OPEN, else ERR_SHRINK_PERIOD_INVALID_STATE"
        side_effects:
          - "buckets are frozen at their provisional values; unresolved_cents keeps carrying every non-terminal investigation's amount"
          - "provisional_total_shrink_cents / final_total_shrink_cents / shrink_rate_bps re-derived (shrink_rate_bps still uses the provisional total)"
          - "ShrinkPeriod.status = PROVISIONAL_CLOSED"
          - "increments ShrinkPeriod.version by 1"

      - from: PROVISIONAL_CLOSED
        to: OPEN
        trigger: "POST /inventory-integrity/shrink-periods/{shrink_period_id}/reopen"
        actor: ShrinkController
        preconditions:
          - "ShrinkPeriod.status == PROVISIONAL_CLOSED, else ERR_SHRINK_PERIOD_INVALID_STATE"
        side_effects:
          - "ShrinkPeriod.reopen_count += 1"
          - "ShrinkPeriod.status = OPEN — investigation approve-cause and close become possible again, so a mis-attributed bucket can be re-attributed"
          - "increments ShrinkPeriod.version by 1"
        note: "Closes the OPEN -> PROVISIONAL_CLOSED -> OPEN cycle."

      - from: PROVISIONAL_CLOSED
        to: FINAL_CLOSED
        trigger: "POST /inventory-integrity/shrink-periods/{shrink_period_id}/final-close"
        actor: ShrinkController
        preconditions:
          - "ShrinkPeriod.status == PROVISIONAL_CLOSED, else ERR_SHRINK_PERIOD_INVALID_STATE"
          - "every VarianceInvestigation whose shrink_period_id is this period is in status CLOSED or WAIVED, else ERR_OPEN_INVESTIGATIONS"
        side_effects:
          - "unresolved_cents is forced to 0 (no non-terminal investigations remain, so the provisional and final variants coincide)"
          - "shrink_rate_bps switches to the final-variant total"
          - "ShrinkPeriod.status = FINAL_CLOSED"
          - "increments ShrinkPeriod.version by 1"

  # --------------------------------------------------------------------------
  # PhysicalInventory — CYCLIC (FIRST_PASS_COMPLETE -> COUNTING recount loop)
  # --------------------------------------------------------------------------
  - entity: PhysicalInventory
    initial_state: PLANNED
    terminal_states: [CERTIFIED, ABANDONED]
    transitions:
      - from: PLANNED
        to: COUNTING
        trigger: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/start"
        actor: ThirdPartyCounter
        preconditions:
          - "PhysicalInventory.status == PLANNED, else ERR_PHYSICAL_INVENTORY_INVALID_STATE"
          - "X-User-ID == PhysicalInventory.counter_firm_id (ThirdPartyCounter identity scope)"
        side_effects:
          - "PhysicalInventory.status = COUNTING"
          - "increments PhysicalInventory.version by 1"

      - from: COUNTING
        to: FIRST_PASS_COMPLETE
        trigger: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/complete-pass"
        actor: ThirdPartyCounter
        preconditions:
          - "PhysicalInventory.status == COUNTING, else ERR_PHYSICAL_INVENTORY_INVALID_STATE"
          - "X-User-ID == PhysicalInventory.counter_firm_id"
          - "PhysicalInventory.line_count >= 1, else ERR_NO_COUNT_LINES"
        side_effects:
          - "book_value_cents / counted_value_cents / net_variance_cents / net_variance_bps re-derived over the non-superseded lines of the current pass_round (calculations.physical_reconciliation)"
          - "PhysicalInventory.status = FIRST_PASS_COMPLETE"
          - "increments PhysicalInventory.version by 1"

      - from: FIRST_PASS_COMPLETE
        to: COUNTING
        trigger: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/order-recount"
        actor: ShrinkController
        preconditions:
          - "PhysicalInventory.status == FIRST_PASS_COMPLETE, else ERR_PHYSICAL_INVENTORY_INVALID_STATE"
          - "PhysicalInventory.recount_round < MAX_RECOUNT_ROUNDS, else ERR_REWORK_LIMIT_REACHED"
        side_effects:
          - "PhysicalInventory.recount_round += 1; line_count reset to 0 (lines of the prior pass_round are retained but no longer counted in the aggregates)"
          - "PhysicalInventory.status = COUNTING"
          - "increments PhysicalInventory.version by 1"
        note: "Closes the COUNTING -> FIRST_PASS_COMPLETE -> COUNTING recount cycle."

      - from: FIRST_PASS_COMPLETE
        to: RECONCILING
        trigger: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/reconcile"
        actor: ShrinkController
        preconditions:
          - "PhysicalInventory.status == FIRST_PASS_COMPLETE, else ERR_PHYSICAL_INVENTORY_INVALID_STATE"
          - "net_variance_bps < recount_threshold_bps OR recount_round >= 1, else ERR_RECOUNT_REQUIRED"
          - "a ShrinkPeriod for PhysicalInventory.store_id whose inclusive [period_start, period_end] contains scheduled_end_date and whose status is OPEN must exist, else ERR_NO_COVERING_SHRINK_PERIOD"
        side_effects:
          - "for every non-superseded line of the current pass_round whose variance_units != 0, an Adjustment with reason_code == PHYSICAL_RECONCILIATION, investigation_id == null, delta_units == line.variance_units, approval_state == NOT_REQUIRED and posting_state == POSTED is minted against the (store, item) StockPosition, in ascending PhysicalInventoryLine.created_at order"
          - "each such posting re-derives that StockPosition's on_hand_units / book_value_cents / promising_state, then Store.fulfillment_status"
          - "the covering ShrinkPeriod receives the waterfall allocation of the unexplained portion of abs(net_variance_cents) across process_error_cents, damage_cents, theft_cents and unresolved_cents (calculations.physical_reconciliation)"
          - "PhysicalInventory.status = RECONCILING"
          - "increments PhysicalInventory.version by 1"

      - from: RECONCILING
        to: CERTIFIED
        trigger: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/certify"
        actor: ShrinkController
        preconditions:
          - "PhysicalInventory.status == RECONCILING, else ERR_PHYSICAL_INVENTORY_INVALID_STATE"
          - "the ShrinkPeriod for PhysicalInventory.store_id covering scheduled_end_date is NOT in status OPEN, else ERR_SHRINK_PERIOD_STILL_OPEN  # CROSS-ENTITY GUARD"
        side_effects:
          - "PhysicalInventory.certified_at = logical clock now"
          - "PhysicalInventory.status = CERTIFIED"
          - "increments PhysicalInventory.version by 1"

      - from: PLANNED
        to: ABANDONED
        trigger: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/abandon"
        actor: ShrinkController
        preconditions:
          - "PhysicalInventory.status == PLANNED, else ERR_PHYSICAL_INVENTORY_INVALID_STATE"
        side_effects:
          - "PhysicalInventory.status = ABANDONED — the store's blackout interval is released, so a new physical inventory may be scheduled over the same dates"
          - "increments PhysicalInventory.version by 1"

  # --------------------------------------------------------------------------
  # Store — POSTURE-DRIVEN derived machine (system transitions only)
  # --------------------------------------------------------------------------
  - entity: Store
    initial_state: ELIGIBLE
    terminal_states: []
    note: |
      fulfillment_status is never set by a request body. It is re-derived by
      calculations.store_fulfillment_posture at the end of every request that
      changes any StockPosition.promising_state, unit_accuracy_pct, or the set
      of StockPosition rows for the store. All transitions below are `system`.
    transitions:
      - from: ELIGIBLE
        to: PROBATION
        trigger: "system event: recomputation of calculations.store_fulfillment_posture after a StockPosition change"
        actor: system
        preconditions:
          - "blocked_ratio_bps < 2000 AND accuracy_index_bps >= 9000"
          - "blocked_position_count >= 1 OR restricted_ratio_bps >= 3000 OR accuracy_index_bps < 9500"
        side_effects:
          - "Store.fulfillment_status = PROBATION — store fulfillment remains allowed, but every RESTRICTED position is excluded from omnichannel promising"
          - "increments Store.version by 1"

      - from: PROBATION
        to: SUSPENDED
        trigger: "system event: recomputation of calculations.store_fulfillment_posture after a StockPosition change"
        actor: system
        preconditions:
          - "blocked_ratio_bps >= 2000 OR accuracy_index_bps < 9000"
        side_effects:
          - "Store.fulfillment_status = SUSPENDED — the store is removed from omnichannel promising entirely"
          - "every CountSchedule for the store with status == ACTIVE has cadence_days set to max(MIN_ACCELERATED_CADENCE_DAYS, floor(cadence_days / 2)) and next_due_date set to date(logical clock now)"
          - "increments Store.version by 1"

      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "system event: recomputation of calculations.store_fulfillment_posture after a StockPosition change"
        actor: system
        preconditions:
          - "blocked_ratio_bps >= 2000 OR accuracy_index_bps < 9000"
        side_effects:
          - "Store.fulfillment_status = SUSPENDED"
          - "the same ACTIVE CountSchedule acceleration as PROBATION -> SUSPENDED"
          - "increments Store.version by 1"

      - from: SUSPENDED
        to: PROBATION
        trigger: "system event: recomputation after a compensating Adjustment reversal or a VERIFIED_PASS tag batch clears a hold"
        actor: system
        preconditions:
          - "blocked_ratio_bps < 2000 AND accuracy_index_bps >= 9000"
          - "blocked_position_count >= 1 OR restricted_ratio_bps >= 3000 OR accuracy_index_bps < 9500"
        side_effects:
          - "Store.fulfillment_status = PROBATION; CountSchedule cadence changes are NOT rolled back"
          - "increments Store.version by 1"

      - from: PROBATION
        to: ELIGIBLE
        trigger: "system event: recomputation after every position returns to PROMISABLE"
        actor: system
        preconditions:
          - "blocked_position_count == 0 AND restricted_ratio_bps < 3000 AND accuracy_index_bps >= 9500"
        side_effects:
          - "Store.fulfillment_status = ELIGIBLE"
          - "increments Store.version by 1"

      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "system event: recomputation after every position returns to PROMISABLE in one request"
        actor: system
        preconditions:
          - "blocked_position_count == 0 AND restricted_ratio_bps < 3000 AND accuracy_index_bps >= 9500"
        side_effects:
          - "Store.fulfillment_status = ELIGIBLE; CountSchedule cadence changes are NOT rolled back"
          - "increments Store.version by 1"

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version`
# ============================================================================

concurrency_rules:
  - rule_id: adjustment-create-stale-position
    parent_entity: StockPosition
    write_endpoint: "POST /inventory-integrity/stock-positions/{stock_position_id}/adjustments"
    occ_field: "expected_stock_position_version"
    description: |
      Creating an Adjustment against a StockPosition whose version has advanced
      since the client last read it is rejected. The product deliberately allows
      an unlimited number of adjustments per position, and every posting
      re-derives on_hand_units, so a later adjustment authored against a stale
      on-hand reading would silently double-correct the same discrepancy. The
      stale-version check makes the client re-read the position before authoring
      a second correction.
    error_id: ERR_STALE_STOCK_POSITION_VERSION
    http_status: 412

  - rule_id: physical-line-submit-stale-inventory
    parent_entity: PhysicalInventory
    write_endpoint: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/lines"
    occ_field: "expected_physical_inventory_version"
    description: |
      Submitting a PhysicalInventoryLine against a PhysicalInventory whose
      version has advanced since the counter last read it is rejected. A later
      line for the same item legitimately supersedes an earlier one
      (PhysicalInventoryLine.superseded), so a counter re-submitting an item on
      a stale read of the inventory would overwrite an aggregate that has
      already moved. The stale-version check forces a re-read.
    error_id: ERR_STALE_PHYSICAL_INVENTORY_VERSION
    http_status: 412

  - rule_id: cause-proposal-stale-investigation
    parent_entity: VarianceInvestigation
    write_endpoint: "POST /inventory-integrity/variance-investigations/{investigation_id}/propose-cause"
    occ_field: "expected_investigation_version"
    description: |
      Proposing a root cause on a VarianceInvestigation whose version has
      advanced since the analyst last read it is rejected. Because
      CAUSE_PROPOSED -> CAUSE_PROPOSED is a legitimate supersede edge, a second
      proposal authored on a stale read would silently overwrite a colleague's
      proposal and its evidence note. The stale-version check makes the analyst
      re-read the current proposal first.
    error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412

# ============================================================================
# Cross-cutting constants referenced by §1.2 / §1.4 prose
# ============================================================================

global_constants:
  MAX_REWORK_ROUNDS: 2                      # TagBatch VERIFICATION_FAILED -> ENCODED loops
  MAX_RECOUNT_ROUNDS: 1                     # CountTask return-to-count loops AND PhysicalInventory order-recount loops
  MIN_COVERAGE_PCT: 90.00                   # CountTask submit gate (>= comparison)
  MIN_ACCELERATED_CADENCE_DAYS: 7           # floor for the SUSPENDED cadence-halving cascade
  SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS: 500000
  PHYSICAL_BLACKOUT_BUFFER_DAYS: 3          # pad on both sides of a PhysicalInventory closed interval
  NEGATIVE_AUTO_CORRECT_MAX_UNITS: 5
  PHANTOM_STALE_DAYS: 45
  PHANTOM_MAX_AUTO_UNITS: 3
  TAG_PASS_REWARD_BPS: 200
  TAG_FAIL_PENALTY_BPS: 1500
  VENDOR_SHORTAGE_PENALTY_BPS: 1500
  DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:

  # --------------------------------------------------------------------------
  # RULE 2 mode (b): nested rounding where the ORDER matters.
  # --------------------------------------------------------------------------
  - name: count_variance_valuation
    trigger: "CountLine creation computes the per-line value; CountTask IN_PROGRESS -> COUNTED (submit) computes the task total"
    algorithm: aggregation
    formula: |
      # ---- per CountLine, at line creation ----
      variance_units = counted_units - system_units_snapshot
      uplift_factor  = (10000 + Category.landed_cost_uplift_bps) / 10000     # Category of Item.category_id
      raw_line_value = abs(variance_units) * Item.unit_cost_cents * uplift_factor
      variance_value_cents = round_half_up(raw_line_value, 0)                # ROUNDED HERE, PER LINE

      within_tolerance = ( abs(variance_units) <= Category.variance_tolerance_units
                           AND variance_value_cents < Category.variance_tolerance_value_cents )

      # ---- per CountTask, at submit ----
      # PINNED EVALUATION ORDER: round each line first, THEN sum the already-rounded
      # integers. The alternative order (sum the raw Decimal line values, then round
      # once) is FORBIDDEN and yields a different total.
      CountTask.total_variance_value_cents =
          sum( line.variance_value_cents for line in lines(CountTask) )      # sum of INTEGERS

      # Worked divergence, pinned so downstream generators cannot re-derive it:
      #   line A: 5 units * 1234 cents * 1.0750 = 6632.750 -> 6633
      #   line B: 3 units * 2500 cents * 1.0750 = 8062.500 -> 8063
      #   per-line-then-sum (CORRECT) = 6633 + 8063        = 14696
      #   sum-then-round  (FORBIDDEN) = round(14695.250)   = 14695
    input_set: |
      Every CountLine whose count_task_id is the task, with no status filter — a
      CountLine has no status of its own and lines are physically deleted by
      return-to-count and void, so the set is exactly the currently attached rows.
      Summation order is ascending CountLine.created_at; because integer addition
      is order-independent the order is stated only for auditability.
    constants:
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied ONCE per line, never to the task total"
    variants: []

  # --------------------------------------------------------------------------
  # RULE 1 instance A: dual variant on the StockPosition (operational accuracy) domain.
  # --------------------------------------------------------------------------
  - name: stock_accuracy_pct
    trigger: "CountTask IN_PROGRESS -> COUNTED (submit); Adjustment posting_state UNPOSTED -> POSTED; Adjustment posting_state POSTED -> REVERSED"
    algorithm: weighted_scoring
    formula: |
      # Both variants read the SAME three frozen fields on the position and
      # legitimately disagree, because the unit variant ignores the landed-cost
      # uplift that the value variant carries.
      base_units       = max(StockPosition.last_count_system_units, 1)
      base_value_cents = max(StockPosition.last_count_book_value_cents, 1)

      unit_accuracy_pct  = clamp_0_100( round_half_up( 100 * (1 - abs(last_variance_units) / base_units), 2 ) )
      value_accuracy_pct = clamp_0_100( round_half_up( 100 * (1 - last_variance_value_cents / base_value_cents), 2 ) )

      # While last_counted_at IS NULL both fields read exactly 100.00 (a position
      # that has never been counted is treated as perfectly accurate).

      # Worked divergence, pinned:
      #   last_variance_units = -5, base_units = 100          -> unit_accuracy_pct  = 95.00
      #   last_variance_value_cents = 6633, base_value = 123400 -> value_accuracy_pct = 94.62
    input_set: |
      Exactly the three frozen fields (last_variance_units,
      last_variance_value_cents, last_count_book_value_cents) written by the most
      recent CountTask submit that included this position. Adjustments do NOT
      rewrite them; a posting only re-runs the two formulas against the same
      frozen inputs, so both accuracy fields are stable across postings and
      change only on the next count.
    constants:
      ROUNDING: round_half_up
      DECIMALS: 2
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"
    variants:
      - name: unit_accuracy
        when: "consumed by calculations.store_fulfillment_posture as the store accuracy index input"
        difference: "denominator is the counted unit population; the landed-cost uplift is invisible, so the score is strictly >= the value variant whenever landed_cost_uplift_bps > 0"
      - name: value_accuracy
        when: "consumed by calculations.position_promising_state as the Category.min_accuracy_pct gate input"
        difference: "numerator carries the landed-cost uplift while the denominator is pure book cost, so an identical unit variance scores strictly lower whenever landed_cost_uplift_bps > 0"

  # --------------------------------------------------------------------------
  # RULE 1 instance B: dual variant on the ShrinkPeriod (shrink accounting) domain.
  # --------------------------------------------------------------------------
  - name: shrink_attribution
    trigger: "VarianceInvestigation OPEN creation at CountTask submit; VarianceInvestigation CAUSE_APPROVED -> CLOSED; VarianceInvestigation OPEN -> WAIVED; ShrinkPeriod provisional-close; ShrinkPeriod final-close; PhysicalInventory FIRST_PASS_COMPLETE -> RECONCILING"
    algorithm: chronological
    formula: |
      # candidate set: every VarianceInvestigation whose shrink_period_id == period.id
      # processed in ascending VarianceInvestigation.created_at (tie-break: none needed,
      # created_at carries three fractional digits and rows are minted sequentially).

      # ---- PROVISIONAL variant ----
      theft_cents = damage_cents = process_error_cents = vendor_shortage_cents = unresolved_cents = 0
      for inv in candidates ordered by created_at ASC:
          if inv.status == CLOSED:
              bucket(inv.approved_root_cause) += inv.variance_value_cents
          elif inv.status IN {OPEN, IN_REVIEW, CAUSE_PROPOSED, CAUSE_APPROVED}:
              unresolved_cents += inv.variance_value_cents
          # inv.status == WAIVED contributes NOTHING under either variant
      # plus any waterfall allocation already written by physical_reconciliation
      provisional_total_shrink_cents = theft + damage + process_error + vendor_shortage + unresolved

      # ---- FINAL variant ----
      # identical loop, but the elif branch is DELETED: non-terminal investigations
      # are excluded entirely rather than parked in unresolved_cents.
      final_total_shrink_cents = theft + damage + process_error + vendor_shortage

      total_attributable_variance_cents = theft + damage + process_error + vendor_shortage + unresolved
      shrink_rate_bps = round_half_up( 10000 * T / ShrinkPeriod.sales_at_cost_cents , 0 )
        where T = final_total_shrink_cents  when status == FINAL_CLOSED
                  provisional_total_shrink_cents  otherwise

      # Worked divergence, pinned:
      #   inv1 CLOSED/THEFT 6633 ; inv2 IN_REVIEW 32250 ; sales_at_cost = 5000000
      #   provisional: theft 6633, unresolved 32250, total 38883, rate 78 bps
      #   final      : theft 6633, unresolved 0,     total  6633, rate 13 bps
    input_set: |
      VarianceInvestigation rows filtered by shrink_period_id, partitioned by
      status: CLOSED rows enter their named bucket; OPEN / IN_REVIEW /
      CAUSE_PROPOSED / CAUSE_APPROVED rows enter unresolved_cents under the
      provisional variant only; WAIVED rows are excluded under both variants.
      Window boundary: membership is by the FK written at investigation open, not
      by date arithmetic, so a reopened period cannot silently gain or lose rows.
    constants:
      ROUNDING: round_half_up
    precision: "integer cents for every bucket; shrink_rate_bps is an integer basis-point value, round_half_up"
    variants:
      - name: provisional
        when: "ShrinkPeriod.status IN {OPEN, PROVISIONAL_CLOSED} — reported as provisional_total_shrink_cents and used by shrink_rate_bps"
        difference: "parks every non-terminal investigation's variance_value_cents in unresolved_cents, so the total includes amounts whose root cause is unknown"
      - name: final
        when: "ShrinkPeriod.status == FINAL_CLOSED — reported as final_total_shrink_cents and used by shrink_rate_bps"
        difference: "excludes non-terminal investigations entirely; unresolved_cents is 0, so the same data yields a strictly smaller total whenever any investigation is non-terminal"

  # --------------------------------------------------------------------------
  # RULE 2 mode (a): >=3 inputs, nested min/max, conditional branch on entity state.
  # --------------------------------------------------------------------------
  - name: adjustment_authority_threshold
    trigger: "Adjustment creation (POST /inventory-integrity/stock-positions/{stock_position_id}/adjustments) and integrity-scan minting"
    algorithm: threshold
    formula: |
      value_impact_cents = abs(delta_units) * Item.unit_cost_cents      # Item of the position

      # --- EXEMPTION, evaluated FIRST ---
      # Integrity-scan auto-corrections bypass the whole threshold ladder.
      if reason_code IN {NEGATIVE_CORRECTION, PHANTOM_CLEAR} and the integrity scan
         took its auto-correct branch:
             authority_threshold_cents = 0
             approval_state = NOT_REQUIRED
             STOP
      if reason_code == PHYSICAL_RECONCILIATION:
             authority_threshold_cents = 0
             approval_state = NOT_REQUIRED
             STOP

      # --- input 1: root-cause strictness (conditional branch on ANOTHER entity's state) ---
      cause = VarianceInvestigation.approved_root_cause
                when investigation_id is not null AND VarianceInvestigation.status == CLOSED
              else null
      strictness_bps = 5000  if cause == THEFT
                       7500  if cause == VENDOR_SHORTAGE
                       10000 otherwise            # DAMAGE, PROCESS_ERROR, or no linked cause

      # --- input 2: repeat-offender penalty on the same position ---
      prior_posted   = count of Adjustment rows with the same stock_position_id
                       and posting_state == POSTED   (REVERSED rows do NOT count)
      penalty_bps    = min(5000, 1000 * prior_posted)

      # --- input 3+4: nested min/max over category tolerance, store cap, category floor ---
      candidate_cents = min(Category.variance_tolerance_value_cents, STORE_CAP_CENTS)
      base_cents      = max(CATEGORY_FLOOR_CENTS, candidate_cents)

      authority_threshold_cents =
          max( MIN_EFFECTIVE_CENTS,
               floor( base_cents * strictness_bps / 10000 * (10000 - penalty_bps) / 10000 ) )

      requires_approval = value_impact_cents >= authority_threshold_cents     # >= , NOT >
      approval_state    = PENDING if requires_approval else NOT_REQUIRED

      # Worked example, pinned:
      #   Category.variance_tolerance_value_cents = 20000, cause = THEFT, prior_posted = 1
      #   candidate = min(20000, 100000) = 20000 ; base = max(5000, 20000) = 20000
      #   strictness = 5000 bps ; penalty = 1000 bps
      #   threshold = max(1000, floor(20000 * 0.5 * 0.9)) = 9000
      #   delta_units = -8 on a 1234-cent item -> value_impact = 9872 >= 9000 -> PENDING
      #   delta_units = -5 on the same item    -> value_impact = 6170 <  9000 -> NOT_REQUIRED
    input_set: |
      The adjustment's own delta_units and reason_code; the Item.unit_cost_cents
      and Category of the referenced StockPosition; the linked
      VarianceInvestigation's approved_root_cause but ONLY when that investigation
      is in status CLOSED (a CAUSE_APPROVED-but-not-closed investigation is
      treated as no linked cause); and the count of sibling Adjustment rows on the
      same stock_position_id with posting_state == POSTED, evaluated at creation
      time and frozen on the row.
    constants:
      STORE_CAP_CENTS: 100000
      CATEGORY_FLOOR_CENTS: 5000
      MIN_EFFECTIVE_CENTS: 1000
      REPEAT_PENALTY_BPS_PER_PRIOR: 1000
      MAX_PENALTY_BPS: 5000
      THEFT_STRICTNESS_BPS: 5000
      VENDOR_SHORTAGE_STRICTNESS_BPS: 7500
      DEFAULT_STRICTNESS_BPS: 10000
    precision: "integer cents; the two bps multiplications are applied left-to-right on Decimal and floored ONCE at the end"
    variants: []

  # --------------------------------------------------------------------------
  # RULE 2 mode (c): circular-looking dependency with a PINNED evaluation order.
  # --------------------------------------------------------------------------
  - name: vendor_shortage_chargeback
    trigger: "POST /inventory-integrity/vendors/{vendor_id}/chargebacks"
    algorithm: tiered_pricing
    formula: |
      # The apparent circularity: net = gross - credit, and the credit rate is a
      # tier lookup. Which amount keys the tier? PINNED: the GROSS amount keys
      # BOTH the chargeback rate tier and the goodwill-credit tier. Keying the
      # credit off `net` (the naive reading, since net is "the amount charged")
      # produces a different, forbidden answer.

      # STEP 1 — gross shortage attributable to this vendor out of this period
      shortage_value_cents = sum( inv.variance_value_cents ) over VarianceInvestigation inv where
          inv.shrink_period_id == request shrink_period_id
          AND inv.status == CLOSED
          AND inv.approved_root_cause == VENDOR_SHORTAGE
          AND Item(CountLine(inv.count_line_id).item_id).primary_vendor_id == vendor_id
      if shortage_value_cents == 0: reject with ERR_NO_VENDOR_SHORTAGE

      # STEP 2 — tier is selected on the GROSS shortage, then the rate applied
      gross_tier = TIER_1 if shortage_value_cents <= 50000
                   TIER_2 if shortage_value_cents <= 200000
                   TIER_3 otherwise
      rate_bps   = 8000 (TIER_1) | 9000 (TIER_2) | 10000 (TIER_3)
      chargeback_gross_cents = round_half_up( shortage_value_cents * rate_bps / 10000 , 0 )

      # STEP 3 — goodwill credit keyed on gross_tier from STEP 2 (NOT on net)
      credit_bps = 1500 (TIER_1) | 1000 (TIER_2) | 500 (TIER_3)
      vendor_credit_cents = round_half_up( chargeback_gross_cents * credit_bps / 10000 , 0 )

      # STEP 4 — net is derived LAST and feeds nothing back
      net_chargeback_cents = chargeback_gross_cents - vendor_credit_cents

      # STEP 5 — vendor ledger
      Vendor.lifetime_chargeback_gross_cents += chargeback_gross_cents
      Vendor.credited_cents                  += vendor_credit_cents
      Vendor.chargeback_balance_cents         = lifetime_chargeback_gross_cents - credited_cents
      ShrinkPeriod.chargeback_issued_vendor_ids append vendor_id

      # Worked divergence, pinned:
      #   shortage_value_cents = 205000 -> TIER_3, rate 10000 bps -> gross = 205000
      #   credit keyed on GROSS tier (CORRECT):  500 bps -> credit 10250 -> net 194750
      #   credit keyed on NET  tier (FORBIDDEN): net 194750 falls in TIER_2 -> 1000 bps
      #                                          -> credit 20500 -> net 184500
    input_set: |
      Only CLOSED VarianceInvestigation rows of the named ShrinkPeriod whose
      approved_root_cause is exactly VENDOR_SHORTAGE and whose count line's item
      has primary_vendor_id == the path vendor. CAUSE_APPROVED rows are excluded.
      Window boundary: membership is by shrink_period_id FK, inclusive of every
      such row regardless of the period's own status. Aggregation order is
      ascending VarianceInvestigation.created_at; integer summation makes the
      order immaterial and it is pinned only for auditability.
    constants:
      TIER_1_MAX_CENTS: 50000
      TIER_2_MAX_CENTS: 200000
      TIER_1_RATE_BPS: 8000
      TIER_2_RATE_BPS: 9000
      TIER_3_RATE_BPS: 10000
      TIER_1_CREDIT_BPS: 1500
      TIER_2_CREDIT_BPS: 1000
      TIER_3_CREDIT_BPS: 500
      ROUNDING: round_half_up
    precision: "integer cents; round_half_up applied independently at STEP 2 and STEP 3, never to the net"
    variants: []

  # --------------------------------------------------------------------------
  - name: tag_verification_outcome
    trigger: "POST /inventory-integrity/tag-batches/{tag_batch_id}/verify; the sample-size half also runs at DRAFT -> ENCODED and at VERIFICATION_FAILED -> ENCODED"
    algorithm: threshold
    formula: |
      # ---- frozen at ENCODED (and re-frozen at rework) ----
      required_sample_units = ceil( TagBatch.quantity_encoded * Vendor.required_verification_sample_pct / 100 )

      # ---- evaluated at verify ----
      read_rate_bps = floor( 10000 * readable_units / sampled_units )        # sampled_units >= 1 guaranteed by ERR_SAMPLE_BELOW_REQUIRED
      outcome = PASS  iff read_rate_bps >= MIN_READ_RATE_BPS
                       AND duplicate_epc_count == 0
                       AND unencoded_units == 0
                else FAIL

      # ---- vendor score, then band ----
      tag_compliance_score_bps = min(10000, score + TAG_PASS_REWARD_BPS)   on PASS
                                 max(0,     score - TAG_FAIL_PENALTY_BPS)  on FAIL
      required_verification_sample_pct =  5 if tag_compliance_score_bps >= 9000
                                         10 if tag_compliance_score_bps >= 7500
                                         20 otherwise

      # Worked boundary, pinned:
      #   quantity_encoded 1000, sample pct 5 -> required_sample_units = 50
      #   sampled 50 / readable 49 -> floor(10000*49/50) = 9800 == MIN_READ_RATE_BPS -> PASS
      #   sampled 50 / readable 48 -> floor(10000*48/50) = 9600 <  9800              -> FAIL
      #   FAIL from 10000 -> 8500 -> band 10% -> next 1000-unit batch needs 100 sampled
    input_set: |
      The single verification submission on the batch (sampled_units,
      readable_units, duplicate_epc_count, unencoded_units) plus the vendor's
      score at the moment of the transition. Prior verification attempts on the
      same batch are overwritten, not accumulated — rework resets all four fields
      to 0 first.
    constants:
      MIN_READ_RATE_BPS: 9800
      MAX_DUPLICATE_EPC: 0
      MAX_UNENCODED_UNITS: 0
      BAND_5_PCT_MIN_SCORE_BPS: 9000
      BAND_10_PCT_MIN_SCORE_BPS: 7500
    precision: "read_rate_bps is floored (never rounded up); required_sample_units is ceilinged"
    variants: []

  # --------------------------------------------------------------------------
  - name: count_coverage_pct
    trigger: "CountTask IN_PROGRESS -> COUNTED (submit)"
    algorithm: weighted_scoring
    formula: |
      # Reader coverage is NOT a plain line count: a line read with the wrong
      # reader technology earns partial or zero credit.
      line_weight(line) =
          1.00  if line.read_mode_used == CountTask.reader_mode
          0.50  if line.read_mode_used == HANDHELD and CountTask.reader_mode == OVERHEAD
          0.00  if line.read_mode_used == OVERHEAD and CountTask.reader_mode == HANDHELD

      effective_lines = sum( line_weight(line) for line in lines(CountTask) )   # Decimal, 2dp

      coverage_pct = 0.00
                     if CountTask.in_scope_position_count == 0                  # EMPTY-SET RULE
                     else clamp_0_100( round_half_up( 100 * effective_lines / in_scope_position_count , 2 ) )

      submit gate: coverage_pct >= MIN_COVERAGE_PCT      # >= , NOT >

      # Worked examples, pinned:
      #   in_scope 4, reader_mode OVERHEAD, lines = 3xOVERHEAD + 1xHANDHELD
      #     effective = 3.00 + 0.50 = 3.50 -> coverage = 87.50 -> BELOW 90.00 -> rejected
      #   in_scope 4, reader_mode OVERHEAD, lines = 4xOVERHEAD
      #     effective = 4.00 -> coverage = 100.00 -> passes
      #   in_scope 1, reader_mode OVERHEAD, lines = 1xOVERHEAD -> 100.00 -> passes
    input_set: |
      Every CountLine currently attached to the task (no status filter — lines
      have no status) against CountTask.in_scope_position_count, which was
      snapshotted at the SCHEDULED -> IN_PROGRESS transition and is NOT refreshed
      when new StockPosition rows appear mid-count. Summation order is ascending
      CountLine.created_at; Decimal addition of 1.00 / 0.50 / 0.00 weights is
      order-independent and the order is pinned only for auditability.
    constants:
      MIN_COVERAGE_PCT: 90.00
      WEIGHT_EXACT_MODE: 1.00
      WEIGHT_HANDHELD_FOR_OVERHEAD_TASK: 0.50
      WEIGHT_OVERHEAD_FOR_HANDHELD_TASK: 0.00
    precision: "2 decimal places, round_half_up; the weight sum is exact Decimal before the single division"
    variants: []

  # --------------------------------------------------------------------------
  - name: position_promising_state
    trigger: "Any request that changes StockPosition.on_hand_units, phantom_units, tag_integrity_hold, value_accuracy_pct, or the status of a VarianceInvestigation pointing at this position"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top to bottom; the FIRST matching clause wins.
      # 1. BLOCKED — hard integrity failure
      if StockPosition.tag_integrity_hold == true
         OR StockPosition.on_hand_units < 0
         OR StockPosition.phantom_units > 0:
             promising_state = BLOCKED
      # 2. RESTRICTED — accuracy or an unresolved variance
      elif StockPosition.value_accuracy_pct < Category.min_accuracy_pct        # < , so equality stays PROMISABLE
           OR exists VarianceInvestigation inv with
                CountLine(inv.count_line_id).stock_position_id == StockPosition.id
                AND inv.status IN {OPEN, IN_REVIEW, CAUSE_PROPOSED, CAUSE_APPROVED}:
             promising_state = RESTRICTED
      # 3. PROMISABLE
      else:
             promising_state = PROMISABLE
    input_set: |
      The position's own four gate fields, the Category of its Item, and the
      explicit status set {OPEN, IN_REVIEW, CAUSE_PROPOSED, CAUSE_APPROVED} of
      VarianceInvestigation rows reachable via CountLine.stock_position_id ==
      StockPosition.id. CLOSED and WAIVED investigations never restrict.
    constants: {}
    precision: "exact enum decision; the accuracy comparison is a strict < on 2-decimal values"
    variants: []

  # --------------------------------------------------------------------------
  - name: store_fulfillment_posture
    trigger: "Any request that changes a StockPosition.promising_state or unit_accuracy_pct for the store, or that creates a StockPosition"
    algorithm: threshold
    formula: |
      total_position_count = count of StockPosition where store_id == Store.id     # no status filter

      # EMPTY-SET RULE — a store with no positions is vacuously accurate.
      if total_position_count == 0:
          accuracy_index_bps = 10000
          blocked_position_count = 0 ; restricted_position_count = 0
          fulfillment_status = ELIGIBLE
          STOP

      accuracy_index_bps = floor( sum(p.unit_accuracy_pct for p in positions) * 100 / total_position_count )
      blocked_position_count    = count of positions with promising_state == BLOCKED
      restricted_position_count = count of positions with promising_state == RESTRICTED
      blocked_ratio_bps    = floor( 10000 * blocked_position_count    / total_position_count )
      restricted_ratio_bps = floor( 10000 * restricted_position_count / total_position_count )

      if blocked_ratio_bps >= 2000 OR accuracy_index_bps < 9000:
          fulfillment_status = SUSPENDED
      elif blocked_position_count >= 1 OR restricted_ratio_bps >= 3000 OR accuracy_index_bps < 9500:
          fulfillment_status = PROBATION
      else:
          fulfillment_status = ELIGIBLE

      # Worked examples, pinned:
      #   2 positions at 95.00 and 100.00, both PROMISABLE
      #     accuracy_index_bps = floor(195.00 * 100 / 2) = 9750 -> ELIGIBLE
      #   same 2 positions, one BLOCKED: blocked_ratio = floor(10000*1/2) = 5000 >= 2000 -> SUSPENDED
      #   6 positions, one BLOCKED: blocked_ratio = floor(10000*1/6) = 1666 < 2000, count >= 1 -> PROBATION
    input_set: |
      Every StockPosition row for the store with no status filter, read after all
      position-level recomputation of the current request has completed. Ordering
      is immaterial (sum and count only).
    constants:
      SUSPEND_BLOCKED_RATIO_BPS: 2000
      SUSPEND_ACCURACY_INDEX_BPS: 9000
      PROBATION_RESTRICTED_RATIO_BPS: 3000
      PROBATION_ACCURACY_INDEX_BPS: 9500
      EMPTY_STORE_ACCURACY_INDEX_BPS: 10000
    precision: "accuracy_index_bps floored to an integer; ratios floored to integers"
    variants: []

  # --------------------------------------------------------------------------
  - name: integrity_scan_corrections
    trigger: "POST /inventory-integrity/stock-positions/{stock_position_id}/integrity-scan"
    algorithm: constraint_propagation
    formula: |
      # RULE R1 — negative on-hand, evaluated FIRST
      negative_detected = ( StockPosition.on_hand_units < 0 )
      if negative_detected:
          if abs(on_hand_units) <= NEGATIVE_AUTO_CORRECT_MAX_UNITS
             AND Category.auto_correct_negative == true:
                 mint Adjustment( delta_units = -on_hand_units,
                                  reason_code = NEGATIVE_CORRECTION,
                                  investigation_id = null,
                                  requested_by_user_id = "system",
                                  approval_state = NOT_REQUIRED,
                                  posting_state  = POSTED )        # posts immediately, threshold exempt
                 StockPosition.negative_correction_count += 1
                 on_hand_units is re-derived (rises to exactly 0)
          else:
                 mint Adjustment( delta_units = -on_hand_units,
                                  reason_code = NEGATIVE_CORRECTION,
                                  investigation_id = null,
                                  requested_by_user_id = "system",
                                  approval_state = PENDING,
                                  posting_state  = UNPOSTED )      # requires supervisor approval
                 StockPosition.tag_integrity_hold = true
                 on_hand_units is unchanged (still negative)

      # RULE R2 — phantom inventory, evaluated on the POST-R1 on-hand value
      phantom_detected = ( on_hand_units > 0
                           AND reserved_units == 0
                           AND last_counted_at IS NOT NULL
                           AND days_between(date(last_counted_at), date(clock_now)) >= PHANTOM_STALE_DAYS
                           AND on_hand_units <= PHANTOM_MAX_AUTO_UNITS )
      if phantom_detected:
          StockPosition.phantom_units = on_hand_units
          mint Adjustment( delta_units = -phantom_units,
                           reason_code = PHANTOM_CLEAR,
                           investigation_id = null,
                           requested_by_user_id = "system",
                           approval_state = NOT_REQUIRED,
                           posting_state  = POSTED )               # threshold exempt
          StockPosition.phantom_units = 0                          # cleared once the correction posts
          on_hand_units is re-derived (falls to exactly 0)

      # FINALLY — promising_state and Store.fulfillment_status are re-derived once,
      # after both rules have run.

      # Worked examples, pinned:
      #   on_hand -4, auto_correct_negative true -> auto POSTED +4 -> on_hand 0,
      #     negative_correction_count 1, phantom not detected (on_hand not > 0)
      #   on_hand -6, auto_correct_negative true -> PENDING/UNPOSTED +6, hold set,
      #     on_hand stays -6, promising_state BLOCKED
      #   on_hand 2, reserved 0, last_counted_at 2026-06-01, clock 2026-08-01
      #     -> 61 days >= 45 and 2 <= 3 -> auto POSTED -2 -> on_hand 0
    input_set: |
      Exactly one StockPosition row plus the Category of its Item and the logical
      clock. Sibling positions are never read. The scan is idempotent in effect
      but NOT in record-keeping: a second scan on a position already corrected to
      0 detects nothing and mints no Adjustment.
    constants:
      NEGATIVE_AUTO_CORRECT_MAX_UNITS: 5
      PHANTOM_STALE_DAYS: 45
      PHANTOM_MAX_AUTO_UNITS: 3
    precision: "whole units; days_between is a calendar-date difference on the UTC date parts"
    variants: []

  # --------------------------------------------------------------------------
  - name: physical_reconciliation
    trigger: "PhysicalInventory COUNTING -> FIRST_PASS_COMPLETE computes the aggregates; FIRST_PASS_COMPLETE -> RECONCILING runs the waterfall"
    algorithm: waterfall_allocation
    formula: |
      # ---- aggregates over the CURRENT pass_round's non-superseded lines ----
      lines = PhysicalInventoryLine rows where physical_inventory_id == PI.id
              AND pass_round == PI.recount_round AND superseded == false
      book_value_cents    = sum( line.book_value_snapshot_cents for line in lines )
      counted_value_cents = sum( line.counted_units * Item.unit_cost_cents for line in lines )
      net_variance_cents  = counted_value_cents - book_value_cents                  # signed
      net_variance_bps    = 0 if book_value_cents == 0
                            else floor( 10000 * abs(net_variance_cents) / book_value_cents )
      recount_required    = ( net_variance_bps >= PI.recount_threshold_bps )        # >= , NOT >

      # ---- waterfall of the UNEXPLAINED portion into the covering ShrinkPeriod ----
      explained_cents   = ShrinkPeriod.final_total_shrink_cents      # final variant: CLOSED rows only
      unexplained_cents = max(0, abs(net_variance_cents) - explained_cents)

      # buckets are filled in this FIXED order, each capped as a share of abs(net_variance_cents)
      remaining = unexplained_cents
      for (bucket, cap_bps) in [ (process_error_cents, 3000),
                                 (damage_cents,        2000),
                                 (theft_cents,         4000) ]:
          cap        = floor( abs(net_variance_cents) * cap_bps / 10000 )
          allocation = min(remaining, cap)
          bucket    += allocation
          remaining -= allocation
      unresolved_cents += remaining        # remainder falls through, uncapped

      total_attributable_variance_cents is re-derived after the waterfall.

      # Worked example, pinned:
      #   lines: item A book 100u x 1234 = 123400 counted 90u -> 111060
      #          item B book  40u x 1500 =  60000 counted 30u ->  45000
      #   book 183400, counted 156060, net -27340, net_variance_bps = floor(10000*27340/183400) = 1490
      #   period already has one CLOSED THEFT investigation of 6633 -> explained 6633
      #   unexplained = 20707
      #   process_error cap = floor(27340*0.30) = 8202 -> takes 8202, remaining 12505
      #   damage        cap = floor(27340*0.20) = 5468 -> takes 5468, remaining  7037
      #   theft         cap = floor(27340*0.40) = 10936 -> takes 7037, remaining    0
      #   unresolved    += 0
      #   final buckets: theft 6633+7037 = 13670, damage 5468, process_error 8202,
      #                  vendor_shortage 0, unresolved 0 ; sum = 27340 = abs(net_variance_cents)
    input_set: |
      Only PhysicalInventoryLine rows of the current pass_round with superseded
      == false. Earlier pass_rounds are retained for audit and excluded from every
      aggregate. Waterfall order is the fixed bucket list above — process_error,
      then damage, then theft, then unresolved — never a data-dependent ordering.
      The explained baseline is read from the covering ShrinkPeriod's FINAL
      variant, so non-terminal investigations do not reduce the unexplained pool.
    constants:
      PROCESS_ERROR_CAP_BPS: 3000
      DAMAGE_CAP_BPS: 2000
      THEFT_CAP_BPS: 4000
    precision: "integer cents; every cap is floored, the remainder is exact so the buckets sum to abs(net_variance_cents) with zero drift"
    variants: []

  # --------------------------------------------------------------------------
  - name: physical_inventory_blackout_interval
    trigger: "POST /inventory-integrity/physical-inventories (creation)"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals with a symmetric buffer pad. Contrast with
      # count_task_window_overlap below, which uses HALF-OPEN intervals and no pad.
      existing = PhysicalInventory rows where store_id == request store_id
                 AND status IN {PLANNED, COUNTING, FIRST_PASS_COMPLETE, RECONCILING, CERTIFIED}
                 # ABANDONED rows release their interval
      for e in existing:
          e_lo = e.scheduled_start_date - PHYSICAL_BLACKOUT_BUFFER_DAYS days
          e_hi = e.scheduled_end_date   + PHYSICAL_BLACKOUT_BUFFER_DAYS days
          # CLOSED-CLOSED intersection: touching endpoints DO collide
          if request scheduled_start_date <= e_hi AND request scheduled_end_date >= e_lo:
              reject with ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT

      # Worked example, pinned:
      #   existing 2026-09-10..2026-09-12, buffer 3 -> blackout 2026-09-07..2026-09-15
      #   new 2026-09-15..2026-09-16 -> 09-15 <= 09-15 -> COLLIDES
      #   new 2026-09-16..2026-09-17 -> 09-16 >  09-15 -> ACCEPTED
    input_set: "PhysicalInventory rows for the same store_id in any status except ABANDONED; no time window filter."
    constants:
      PHYSICAL_BLACKOUT_BUFFER_DAYS: 3
    precision: "whole calendar days on UTC dates; both interval ends inclusive after padding"
    variants: []

  # --------------------------------------------------------------------------
  - name: count_task_window_overlap
    trigger: "POST /inventory-integrity/count-tasks (creation)"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [window_start, window_end), no buffer. Adjacency is legal:
      # new.window_start == existing.window_end does NOT collide.
      # TWO independent geometric checks with DIFFERENT resources.

      # CHECK A — per (store, category) exclusivity, resource = the merchandise area
      siblings_A = CountTask rows where store_id == schedule.store_id
                   AND category_id == schedule.category_id
                   AND status IN {SCHEDULED, IN_PROGRESS, COUNTED}      # RECONCILED / VOIDED release
      if any s in siblings_A with ( request window_start < s.window_end
                                    AND s.window_start < request window_end ):
          reject with ERR_COUNT_WINDOW_OVERLAP

      # CHECK B — per store OVERHEAD reader pool, resource = the reader hardware,
      #           AGGREGATE-CAPACITY semantics rather than pairwise exclusivity
      if request reader_mode == OVERHEAD:
          overlapping = count of CountTask rows where store_id == schedule.store_id
                        AND reader_mode == OVERHEAD
                        AND status IN {SCHEDULED, IN_PROGRESS, COUNTED}
                        AND ( request window_start < s.window_end AND s.window_start < request window_end )
          if overlapping >= Store.overhead_reader_capacity:
              reject with ERR_OVERHEAD_READER_CAPACITY_EXCEEDED

      # Worked examples, pinned:
      #   CHECK A: existing 2026-08-05T00:00Z..2026-08-07T00:00Z on (S,C)
      #     new 2026-08-06..2026-08-08 -> overlaps -> rejected
      #     new 2026-08-07..2026-08-09 -> start == existing end -> ACCEPTED (half-open)
      #   CHECK B: overhead_reader_capacity 2, two overlapping OVERHEAD tasks on
      #     categories C1 and C2 already exist -> a third overlapping OVERHEAD task
      #     on C3 sees overlapping == 2 >= 2 -> rejected
    input_set: |
      CHECK A: CountTask rows matching both store_id AND category_id, restricted
      to the explicit status set {SCHEDULED, IN_PROGRESS, COUNTED}.
      CHECK B: CountTask rows matching store_id AND reader_mode == OVERHEAD,
      same explicit status set, counted (not merged) against the store's declared
      capacity. CHECK A runs before CHECK B, so a same-category overlap always
      reports ERR_COUNT_WINDOW_OVERLAP even when the capacity is also exceeded.
    constants: {}
    precision: "microsecond-exact datetime comparison; intervals are half-open [start, end)"
    variants: []

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# ============================================================================
#
# Domain priority rationale: identity and existence first; then request shape;
# then optimistic-concurrency (a stale writer must be told to re-read before it
# is told anything about business state); then state preconditions; then the
# compliance tier (segregation of duties and tag-integrity holds — an audit
# finding outranks an accounting one in an inventory-integrity organisation);
# then referential coupling; then geometric/uniqueness constraints; then
# temporal constraints; and finally the fiscal tier (authority, thresholds,
# chargebacks) which is deliberately LAST so that a request failing both an
# audit rule and a money rule always reports the audit rule.
# ============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the seven declared roles; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "for entity_backed roles, X-User-ID equals the scoping id on the target: StoreOps -> Store.id via TagBatch.destination_store_id or CountTask.store_id; VendorRep -> Vendor.id via TagBatch.vendor_id or the path vendor_id; ThirdPartyCounter -> CounterFirm.id via PhysicalInventory.counter_firm_id"
    error_id: ERR_IDENTITY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every write endpoint whose roles include StoreOps, VendorRep or ThirdPartyCounter"

  - priority: 10
    category: existence
    check: "every path id resolves, validated left-to-right"
    error_id: "ERR_CATEGORY_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_STOCK_POSITION_NOT_FOUND | ERR_TAG_BATCH_NOT_FOUND | ERR_COUNT_SCHEDULE_NOT_FOUND | ERR_COUNT_TASK_NOT_FOUND | ERR_COUNT_LINE_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND | ERR_SHRINK_PERIOD_NOT_FOUND | ERR_COUNTER_FIRM_NOT_FOUND | ERR_PHYSICAL_INVENTORY_NOT_FOUND | ERR_PHYSICAL_INVENTORY_LINE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path id"

  - priority: 12
    category: existence
    check: "every foreign key supplied in the request body resolves, validated in the field order declared by the endpoint's §1.5 input list"
    error_id: "ERR_CATEGORY_NOT_FOUND | ERR_STORE_NOT_FOUND | ERR_VENDOR_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_COUNTER_FIRM_NOT_FOUND | ERR_COUNT_SCHEDULE_NOT_FOUND | ERR_SHRINK_PERIOD_NOT_FOUND | ERR_INVESTIGATION_NOT_FOUND"
    http_status: 404
    applies_to: "every POST that accepts a foreign key in the body"

  - priority: 20
    category: business_constraint
    check: "every required field of the endpoint's §1.5 input list is present and of the declared type; numeric range constraints from §1.1 hold"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "every POST"

  - priority: 22
    category: business_constraint
    check: "every enum-typed body field holds one of the values declared in §1.1 constraints"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "every POST with an enum field"

  - priority: 24
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "every GET returning a list"

  - priority: 26
    category: business_constraint
    check: "the submitted natural key is not already taken: Category.code, Store.code, Vendor.code, CounterFirm.code, Item.sku"
    error_id: "ERR_DUPLICATE_CATEGORY_CODE | ERR_DUPLICATE_STORE_CODE | ERR_DUPLICATE_VENDOR_CODE | ERR_DUPLICATE_COUNTER_FIRM_CODE | ERR_DUPLICATE_SKU"
    http_status: 409
    applies_to: "POST /inventory-integrity/categories, /stores, /vendors, /counter-firms, /items"

  - priority: 30
    category: state
    check: "expected_stock_position_version equals StockPosition.version"
    error_id: ERR_STALE_STOCK_POSITION_VERSION
    http_status: 412
    applies_to: "POST /inventory-integrity/stock-positions/{stock_position_id}/adjustments"

  - priority: 30
    category: state
    check: "expected_physical_inventory_version equals PhysicalInventory.version"
    error_id: ERR_STALE_PHYSICAL_INVENTORY_VERSION
    http_status: 412
    applies_to: "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/lines"

  - priority: 30
    category: state
    check: "expected_investigation_version equals VarianceInvestigation.version"
    error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412
    applies_to: "POST /inventory-integrity/variance-investigations/{investigation_id}/propose-cause"

  - priority: 40
    category: state
    check: "the target TagBatch is in the from-state the requested transition declares in §1.2"
    error_id: ERR_TAG_BATCH_INVALID_STATE
    http_status: 409
    applies_to: "POST /tag-batches/{id}/encode, /receive, /verify, /rework, /scrap"

  - priority: 40
    category: state
    check: "the target CountTask is in the from-state the requested transition declares in §1.2; POST /count-tasks/{id}/lines requires status == IN_PROGRESS"
    error_id: ERR_COUNT_TASK_INVALID_STATE
    http_status: 409
    applies_to: "POST /count-tasks/{id}/start, /lines, /submit, /return-to-count, /reconcile, /void"

  - priority: 40
    category: state
    check: "the target VarianceInvestigation is in the from-state the requested transition declares in §1.2"
    error_id: ERR_INVESTIGATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /variance-investigations/{id}/assign, /propose-cause, /return, /approve-cause, /close"

  - priority: 40
    category: state
    check: "the target Adjustment's relevant dimension is in the from-state the requested transition declares in §1.2 (approve/reject read approval_state; post/reverse read posting_state)"
    error_id: ERR_ADJUSTMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /adjustments/{id}/approve, /reject, /post, /reverse"

  - priority: 40
    category: state
    check: "the target ShrinkPeriod is in the from-state the requested transition declares in §1.2; also raised when investigation approve-cause or close is attempted while the covering period is not OPEN"
    error_id: ERR_SHRINK_PERIOD_INVALID_STATE
    http_status: 409
    applies_to: "POST /shrink-periods/{id}/provisional-close, /reopen, /final-close, POST /variance-investigations/{id}/approve-cause, /close"

  - priority: 40
    category: state
    check: "the target PhysicalInventory is in the from-state the requested transition declares in §1.2; POST /physical-inventories/{id}/lines requires status == COUNTING"
    error_id: ERR_PHYSICAL_INVENTORY_INVALID_STATE
    http_status: 409
    applies_to: "POST /physical-inventories/{id}/start, /lines, /complete-pass, /order-recount, /reconcile, /certify, /abandon"

  - priority: 42
    category: state
    check: "the CountSchedule backing a count task is in status ACTIVE"
    error_id: ERR_COUNT_SCHEDULE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /inventory-integrity/count-tasks, POST /count-tasks/{id}/start"

  - priority: 50
    category: business_safety
    check: "the acting X-User-ID differs from the user recorded on the step being reviewed: approve-cause and return compare against VarianceInvestigation.proposed_by_user_id; adjustment approve, reject and reverse compare against Adjustment.requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /variance-investigations/{id}/approve-cause, /return, POST /adjustments/{id}/approve, /reject, /reverse"

  - priority: 52
    category: business_safety
    check: "the target StockPosition has tag_integrity_hold == false"
    error_id: ERR_TAG_INTEGRITY_HOLD
    http_status: 409
    applies_to: "POST /adjustments/{id}/post"

  - priority: 54
    category: business_safety
    check: "the ShrinkPeriod covering PhysicalInventory.scheduled_end_date for the store is not in status OPEN"
    error_id: ERR_SHRINK_PERIOD_STILL_OPEN
    http_status: 409
    applies_to: "POST /physical-inventories/{id}/certify"

  - priority: 60
    category: business_referential
    check: "the linked VarianceInvestigation is in status CLOSED"
    error_id: ERR_INVESTIGATION_NOT_CLOSED
    http_status: 409
    applies_to: "POST /adjustments/{id}/post (only when Adjustment.investigation_id is not null)"

  - priority: 62
    category: business_referential
    check: "Item.category_id of the counted item equals CountTask.category_id"
    error_id: ERR_ITEM_CATEGORY_MISMATCH
    http_status: 409
    applies_to: "POST /count-tasks/{count_task_id}/lines"

  - priority: 63
    category: business_referential
    check: "a StockPosition exists for (store of the parent task or physical inventory, item_id)"
    error_id: ERR_ITEM_NOT_STOCKED_AT_STORE
    http_status: 409
    applies_to: "POST /count-tasks/{count_task_id}/lines, POST /physical-inventories/{physical_inventory_id}/lines"

  - priority: 64
    category: business_referential
    check: "a ShrinkPeriod for the store whose inclusive [period_start, period_end] contains the relevant date exists in the required status (OPEN or PROVISIONAL_CLOSED for count submit; OPEN for physical reconcile)"
    error_id: ERR_NO_COVERING_SHRINK_PERIOD
    http_status: 409
    applies_to: "POST /count-tasks/{id}/submit, POST /physical-inventories/{id}/reconcile"

  - priority: 65
    category: business_referential
    check: "every VarianceInvestigation in the relevant scope is in status CLOSED or WAIVED"
    error_id: ERR_OPEN_INVESTIGATIONS
    http_status: 409
    applies_to: "POST /count-tasks/{id}/reconcile, POST /shrink-periods/{id}/final-close"

  - priority: 70
    category: business_constraint
    check: "CountTask.reader_mode is supported by Store.reader_capability (HANDHELD_ONLY accepts HANDHELD only; OVERHEAD_ONLY accepts OVERHEAD only; BOTH accepts either); CountLine.read_mode_used is likewise supported"
    error_id: ERR_READER_MODE_UNSUPPORTED
    http_status: 422
    applies_to: "POST /inventory-integrity/count-tasks, POST /count-tasks/{count_task_id}/lines"

  - priority: 71
    category: business_constraint
    check: "CountSchedule.reader_mode is permitted by Category.reader_mode_required (EITHER permits both; HANDHELD and OVERHEAD permit only themselves)"
    error_id: ERR_CATEGORY_READER_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /inventory-integrity/count-schedules"

  - priority: 72
    category: business_constraint
    check: "no non-terminal CountTask on the same (store_id, category_id) has a half-open window overlapping the requested one (calculations.count_task_window_overlap CHECK A)"
    error_id: ERR_COUNT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /inventory-integrity/count-tasks"

  - priority: 73
    category: business_constraint
    check: "the number of non-terminal OVERHEAD CountTasks at the store whose half-open windows overlap the requested one is strictly below Store.overhead_reader_capacity (calculations.count_task_window_overlap CHECK B)"
    error_id: ERR_OVERHEAD_READER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /inventory-integrity/count-tasks (only when reader_mode == OVERHEAD)"

  - priority: 74
    category: business_constraint
    check: "the requested closed date interval, compared against every non-ABANDONED PhysicalInventory of the store padded by PHYSICAL_BLACKOUT_BUFFER_DAYS on both sides, does not intersect (calculations.physical_inventory_blackout_interval)"
    error_id: ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT
    http_status: 409
    applies_to: "POST /inventory-integrity/physical-inventories"

  - priority: 75
    category: business_constraint
    check: "no ShrinkPeriod for the same store has an inclusive date range intersecting the requested one"
    error_id: ERR_SHRINK_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /inventory-integrity/shrink-periods"

  - priority: 76
    category: business_constraint
    check: "no StockPosition already exists for the (store_id, item_id) pair"
    error_id: ERR_DUPLICATE_STOCK_POSITION
    http_status: 409
    applies_to: "POST /inventory-integrity/stock-positions"

  - priority: 77
    category: business_constraint
    check: "no CountLine for the same item_id is already attached to this CountTask"
    error_id: ERR_DUPLICATE_COUNT_LINE
    http_status: 409
    applies_to: "POST /count-tasks/{count_task_id}/lines"

  - priority: 78
    category: business_constraint
    check: "delta_units != 0"
    error_id: ERR_ZERO_DELTA_UNITS
    http_status: 422
    applies_to: "POST /inventory-integrity/stock-positions/{stock_position_id}/adjustments"

  - priority: 79
    category: business_constraint
    check: "the loop counter is below its ceiling: TagBatch.rework_round < MAX_REWORK_ROUNDS; CountTask.recount_round < MAX_RECOUNT_ROUNDS; PhysicalInventory.recount_round < MAX_RECOUNT_ROUNDS"
    error_id: ERR_REWORK_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /tag-batches/{id}/rework, POST /count-tasks/{id}/return-to-count, POST /physical-inventories/{id}/order-recount"

  - priority: 80
    category: business_constraint
    check: "TagBatch.encoding_scheme equals Item.tag_encoding_scheme and length(epc_prefix) equals Item.epc_prefix_length"
    error_id: ERR_TAG_SCHEME_MISMATCH
    http_status: 422
    applies_to: "POST /tag-batches/{id}/encode"

  - priority: 81
    category: business_constraint
    check: "sampled_units >= TagBatch.required_sample_units"
    error_id: ERR_SAMPLE_BELOW_REQUIRED
    http_status: 422
    applies_to: "POST /tag-batches/{id}/verify"

  - priority: 82
    category: business_constraint
    check: "readable_units <= sampled_units, unencoded_units <= sampled_units, and readable_units + unencoded_units <= sampled_units"
    error_id: ERR_INVALID_VERIFICATION_COUNTS
    http_status: 422
    applies_to: "POST /tag-batches/{id}/verify"

  - priority: 83
    category: business_constraint
    check: "at least one CountLine is attached to the task / at least one PhysicalInventoryLine exists for the current pass_round"
    error_id: ERR_NO_COUNT_LINES
    http_status: 409
    applies_to: "POST /count-tasks/{id}/submit, POST /physical-inventories/{id}/complete-pass"

  - priority: 84
    category: business_constraint
    check: "calculations.count_coverage_pct >= MIN_COVERAGE_PCT (90.00)"
    error_id: ERR_COUNT_COVERAGE_BELOW_MIN
    http_status: 409
    applies_to: "POST /count-tasks/{id}/submit"

  - priority: 85
    category: business_constraint
    check: "the number of non-superseded PhysicalInventoryLine rows in the current pass_round, counting the one being created, does not exceed CounterFirm.max_lines_per_pass"
    error_id: ERR_MAX_LINES_PER_PASS_EXCEEDED
    http_status: 409
    applies_to: "POST /physical-inventories/{physical_inventory_id}/lines"

  - priority: 90
    category: business_temporal
    check: "date(window_start) >= CountSchedule.next_due_date"
    error_id: ERR_COUNT_WINDOW_NOT_DUE
    http_status: 422
    applies_to: "POST /inventory-integrity/count-tasks"

  - priority: 91
    category: business_temporal
    check: "window_end is strictly after window_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /inventory-integrity/count-tasks"

  - priority: 92
    category: business_temporal
    check: "period_end >= period_start for a shrink period; scheduled_end_date >= scheduled_start_date for a physical inventory"
    error_id: ERR_INVALID_PERIOD_RANGE
    http_status: 422
    applies_to: "POST /inventory-integrity/shrink-periods, POST /inventory-integrity/physical-inventories"

  - priority: 100
    category: business_fiscal
    check: "when Adjustment.value_impact_cents > SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS (500000) the acting role must be ShrinkController"
    error_id: ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP
    http_status: 403
    applies_to: "POST /adjustments/{id}/approve"

  - priority: 101
    category: business_fiscal
    check: "Adjustment.approval_state IN {NOT_REQUIRED, APPROVED}"
    error_id: ERR_ADJUSTMENT_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /adjustments/{id}/post"

  - priority: 102
    category: business_fiscal
    check: "PhysicalInventory.net_variance_bps < recount_threshold_bps OR recount_round >= 1"
    error_id: ERR_RECOUNT_REQUIRED
    http_status: 409
    applies_to: "POST /physical-inventories/{id}/reconcile"

  - priority: 103
    category: business_fiscal
    check: "the vendor's attributable shortage out of the named shrink period is greater than 0"
    error_id: ERR_NO_VENDOR_SHORTAGE
    http_status: 409
    applies_to: "POST /vendors/{vendor_id}/chargebacks"

  - priority: 104
    category: business_fiscal
    check: "vendor_id is not already present in ShrinkPeriod.chargeback_issued_vendor_ids"
    error_id: ERR_CHARGEBACK_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /vendors/{vendor_id}/chargebacks"

  - priority: 105
    category: business_fiscal
    check: "credit_cents <= Vendor.chargeback_balance_cents"
    error_id: ERR_CREDIT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /vendors/{vendor_id}/chargeback-credits"

# ============================================================================
# §1.5 API Endpoint Table   (all paths are absolute and carry the api_prefix)
# ============================================================================

endpoints:

  # ---------------------------------------------------------------- reference
  - method: POST
    path: "/inventory-integrity/categories"
    description: "Register a merchandise category with its cycle-count cadence, variance tolerances, landed-cost uplift and minimum promising accuracy."
    roles: [SystemAdmin]
    code: 201
    input: [code, name, count_cadence_days, variance_tolerance_units, variance_tolerance_value_cents, min_accuracy_pct, "landed_cost_uplift_bps?", "reader_mode_required?", "auto_correct_negative?"]
    output: Category
    side_effects: []

  - method: GET
    path: "/inventory-integrity/categories/{category_id}"
    description: "Fetch one merchandise category."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Category
    side_effects: []

  - method: GET
    path: "/inventory-integrity/categories"
    description: "List merchandise categories, newest first."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["limit?", "offset?"]
    output: Category[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/stores"
    description: "Register a store with its reader hardware capability and overhead-reader concurrency capacity."
    roles: [SystemAdmin]
    code: 201
    input: [code, name, reader_capability, "overhead_reader_capacity?"]
    output: Store
    side_effects:
      - "initialise total_position_count, blocked_position_count and restricted_position_count to 0"
      - "set accuracy_index_bps = 10000 and fulfillment_status = ELIGIBLE per calculations.store_fulfillment_posture empty-set rule"

  - method: GET
    path: "/inventory-integrity/stores/{store_id}"
    description: "Fetch one store including its live accuracy index and fulfillment posture."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Store
    side_effects: []

  - method: GET
    path: "/inventory-integrity/stores"
    description: "List stores, newest first, optionally filtered by fulfillment posture."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["fulfillment_status?", "limit?", "offset?"]
    output: Store[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/vendors"
    description: "Register a vendor. Tag compliance starts at 10000 bps with a 5 percent receipt-verification sample band."
    roles: [SystemAdmin]
    code: 201
    input: [code, name]
    output: Vendor
    side_effects:
      - "set tag_compliance_score_bps = 10000, required_verification_sample_pct = 5"
      - "set shortage_event_count, lifetime_chargeback_gross_cents, credited_cents and chargeback_balance_cents to 0"

  - method: GET
    path: "/inventory-integrity/vendors/{vendor_id}"
    description: "Fetch one vendor including tag compliance score, sample band and chargeback balance."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/inventory-integrity/vendors"
    description: "List vendors, newest first."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/counter-firms"
    description: "Register a third-party counting firm used for annual physical inventories."
    roles: [SystemAdmin]
    code: 201
    input: [code, name, certification_level, max_lines_per_pass]
    output: CounterFirm
    side_effects: []

  - method: GET
    path: "/inventory-integrity/counter-firms/{counter_firm_id}"
    description: "Fetch one counting firm. CounterFirm is immutable: it carries no version field and has no update endpoint."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: CounterFirm
    side_effects: []

  - method: GET
    path: "/inventory-integrity/counter-firms"
    description: "List counting firms, newest first."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["limit?", "offset?"]
    output: CounterFirm[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/items"
    description: "Register a SKU under a category and a primary vendor, with its tag encoding scheme and cost basis."
    roles: [SystemAdmin]
    code: 201
    input: [category_id, primary_vendor_id, sku, description, unit_cost_cents, retail_price_cents, tag_encoding_scheme, "epc_prefix_length?", "tag_required?"]
    output: Item
    side_effects: []

  - method: GET
    path: "/inventory-integrity/items/{item_id}"
    description: "Fetch one SKU."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Item
    side_effects: []

  - method: GET
    path: "/inventory-integrity/items"
    description: "List SKUs, newest first, optionally filtered by category or primary vendor."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["category_id?", "primary_vendor_id?", "limit?", "offset?"]
    output: Item[]
    side_effects: []

  # ------------------------------------------------------------ stock positions
  - method: POST
    path: "/inventory-integrity/stock-positions"
    description: "Open a stock position for a (store, item) pair with a declared opening on-hand quantity. The pair is unique; on_hand_units thereafter moves only through posted adjustments."
    roles: [SystemAdmin, InventoryAnalyst]
    code: 201
    input: [store_id, item_id, "baseline_on_hand_units?", "reserved_units?"]
    output: StockPosition
    side_effects:
      - "set on_hand_units = baseline_on_hand_units and book_value_cents = on_hand_units * Item.unit_cost_cents"
      - "set phantom_units = 0, negative_correction_count = 0, tag_integrity_hold = false, last_counted_at = null, last_count_system_units = 0"
      - "set unit_accuracy_pct and value_accuracy_pct to 100.00 (never-counted positions are treated as accurate)"
      - "evaluate calculations.position_promising_state and set promising_state"
      - "increment Store.total_position_count and re-run calculations.store_fulfillment_posture for the store"

  - method: GET
    path: "/inventory-integrity/stock-positions/{stock_position_id}"
    description: "Fetch one stock position including both accuracy variants and the derived promising state."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: StockPosition
    side_effects: []

  - method: GET
    path: "/inventory-integrity/stock-positions"
    description: "List stock positions, newest first, optionally filtered by store, item or promising state."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["store_id?", "item_id?", "promising_state?", "limit?", "offset?"]
    output: StockPosition[]
    side_effects: []

  - method: GET
    path: "/inventory-integrity/stock-positions/{stock_position_id}/accuracy"
    description: "Computed read: both variants of calculations.stock_accuracy_pct side by side with the promising state and the reason it holds."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output:
      unit_accuracy_pct: number
      value_accuracy_pct: number
      last_count_system_units: integer
      last_count_book_value_cents: integer
      last_variance_units: integer
      last_variance_value_cents: integer
      promising_state: string
      promising_reason: string
      min_accuracy_pct: number
    side_effects: []

  - method: POST
    path: "/inventory-integrity/stock-positions/{stock_position_id}/integrity-scan"
    description: "Run the negative-on-hand and phantom-inventory detection rules on one position and apply calculations.integrity_scan_corrections. Auto-posted corrections bypass the adjustment authority threshold; out-of-band corrections are minted PENDING and the position is placed on tag integrity hold."
    roles: [InventoryAnalyst, InventorySupervisor]
    code: 200
    input: []
    output:
      corrections_applied: integer
      negative_corrected_units: integer
      phantom_zeroed_units: integer
      auto_posted_adjustment_ids: string[]
      pending_adjustment_ids: string[]
      resulting_on_hand_units: integer
      resulting_phantom_units: integer
      resulting_promising_state: string
      tag_integrity_hold: boolean
    side_effects:
      - "mint Adjustment rows with reason_code NEGATIVE_CORRECTION and/or PHANTOM_CLEAR per calculations.integrity_scan_corrections rules R1 then R2"
      - "auto-posted corrections set approval_state = NOT_REQUIRED and posting_state = POSTED, moving StockPosition.on_hand_units and book_value_cents"
      - "increment StockPosition.negative_correction_count for each negative correction minted"
      - "set StockPosition.tag_integrity_hold = true when a correction had to be routed to approval"
      - "re-evaluate calculations.position_promising_state, then calculations.store_fulfillment_posture for the owning store"
      - "increment StockPosition.version by 1"

  - method: POST
    path: "/inventory-integrity/stock-positions/{stock_position_id}/adjustments"
    description: "Request an on-hand adjustment against a position. The caller supplies the position version it last observed; a stale value is rejected so that the authority threshold is always computed against fresh on-hand data."
    roles: [InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 201
    input: [delta_units, reason_code, expected_stock_position_version, "investigation_id?"]
    output: Adjustment
    side_effects:
      - "compute value_impact_cents and authority_threshold_cents per calculations.adjustment_authority_threshold"
      - "set approval_state = PENDING when value_impact_cents >= authority_threshold_cents, else NOT_REQUIRED"
      - "set posting_state = UNPOSTED and requested_by_user_id = X-User-ID"
      - "increment StockPosition.version by 1"

  - method: GET
    path: "/inventory-integrity/adjustments/{adjustment_id}"
    description: "Fetch one adjustment with both of its parallel state dimensions."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Adjustment
    side_effects: []

  - method: GET
    path: "/inventory-integrity/adjustments"
    description: "List adjustments, newest first, optionally filtered by position, investigation, approval state or posting state."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["stock_position_id?", "investigation_id?", "approval_state?", "posting_state?", "limit?", "offset?"]
    output: Adjustment[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/adjustments/{adjustment_id}/approve"
    description: "Approve a pending adjustment. The approver may not be the requester, and a value impact above SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS requires a ShrinkController."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Adjustment
    side_effects:
      - "approval_state PENDING -> APPROVED"
      - "set approved_by_user_id = X-User-ID"
      - "increment Adjustment.version by 1"

  - method: POST
    path: "/inventory-integrity/adjustments/{adjustment_id}/reject"
    description: "Reject a pending adjustment. Terminal on the approval dimension; the posting dimension stays UNPOSTED forever."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: Adjustment
    side_effects:
      - "approval_state PENDING -> REJECTED"
      - "increment Adjustment.version by 1"

  - method: POST
    path: "/inventory-integrity/adjustments/{adjustment_id}/post"
    description: "Post an approved (or approval-exempt) adjustment to the position ledger. This is the head of the five-hop cascade that can suspend a store's omnichannel fulfillment eligibility."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: Adjustment
    side_effects:
      - "posting_state UNPOSTED -> POSTED, set posted_at = logical clock"
      - "recompute StockPosition.on_hand_units and book_value_cents"
      - "clear StockPosition.phantom_units to 0 when reason_code == PHANTOM_CLEAR"
      - "re-evaluate calculations.position_promising_state (hop 2)"
      - "recompute Store.blocked_position_count / restricted_position_count and calculations.store_fulfillment_posture (hop 3-4)"
      - "when the store enters SUSPENDED, every ACTIVE CountSchedule at that store has cadence_days set to max(MIN_ACCELERATED_CADENCE_DAYS, floor(cadence_days / 2)) and next_due_date set to date(logical clock now) (hop 5)"
      - "increment StockPosition.version and Adjustment.version by 1"

  - method: POST
    path: "/inventory-integrity/adjustments/{adjustment_id}/reverse"
    description: "Reverse a posted adjustment. Every side effect of the posting is undone with zero drift; the reverser may not be the requester."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: Adjustment
    side_effects:
      - "posting_state POSTED -> REVERSED, set reversed_at = logical clock"
      - "recompute StockPosition.on_hand_units and book_value_cents (the reversed row leaves the POSTED input set)"
      - "restore StockPosition.phantom_units when reason_code == PHANTOM_CLEAR"
      - "re-evaluate calculations.position_promising_state and calculations.store_fulfillment_posture"
      - "CountSchedule.cadence_days and next_due_date accelerated by the earlier suspension are deliberately NOT rolled back — schedule acceleration is one-way"
      - "increment StockPosition.version and Adjustment.version by 1"

  # ----------------------------------------------------------------- tag batches
  - method: POST
    path: "/inventory-integrity/tag-batches"
    description: "Vendor opens a source-tagging batch for one SKU destined to one store. Created in DRAFT; nothing is frozen yet."
    roles: [VendorRep, SystemAdmin]
    code: 201
    input: [vendor_id, item_id, destination_store_id, quantity_encoded]
    output: TagBatch
    side_effects:
      - "status = DRAFT, rework_round = 0"
      - "sampled_units, readable_units, duplicate_epc_count, unencoded_units and read_rate_bps all 0; verification_outcome = null"

  - method: GET
    path: "/inventory-integrity/tag-batches/{tag_batch_id}"
    description: "Fetch one tag batch including the frozen required sample size and the last verification result."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: TagBatch
    side_effects: []

  - method: GET
    path: "/inventory-integrity/tag-batches"
    description: "List tag batches, newest first, optionally filtered by vendor, item, destination store or status."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["vendor_id?", "item_id?", "destination_store_id?", "status?", "limit?", "offset?"]
    output: TagBatch[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/tag-batches/{tag_batch_id}/encode"
    description: "Vendor encodes the batch at source. The EPC scheme and prefix length must match the SKU, and the receipt-verification sample size is frozen here from the vendor's CURRENT compliance band."
    roles: [VendorRep, SystemAdmin]
    code: 200
    input: [encoding_scheme, epc_prefix]
    output: TagBatch
    side_effects:
      - "status DRAFT -> ENCODED (or VERIFICATION_FAILED -> ENCODED on rework)"
      - "freeze required_sample_units per calculations.tag_verification_outcome using Vendor.required_verification_sample_pct as it stands now"
      - "increment TagBatch.version by 1"

  - method: POST
    path: "/inventory-integrity/tag-batches/{tag_batch_id}/receive"
    description: "Receiving store acknowledges physical arrival of an encoded batch. Read-quality verification is a separate step."
    roles: [StoreOps, InventorySupervisor]
    code: 200
    input: []
    output: TagBatch
    side_effects:
      - "status ENCODED -> RECEIVED"
      - "increment TagBatch.version by 1"

  - method: POST
    path: "/inventory-integrity/tag-batches/{tag_batch_id}/verify"
    description: "Receiving store submits the read-quality sample. Outcome, vendor compliance score and the vendor's next sample band all move here; a failure holds every stock position of that SKU at the destination store."
    roles: [StoreOps, InventorySupervisor]
    code: 200
    input: [sampled_units, readable_units, duplicate_epc_count, unencoded_units]
    output: TagBatch
    side_effects:
      - "store the four submitted counts, compute read_rate_bps and verification_outcome per calculations.tag_verification_outcome"
      - "status RECEIVED -> VERIFIED_PASS on PASS, RECEIVED -> VERIFICATION_FAILED on FAIL"
      - "move Vendor.tag_compliance_score_bps by TAG_PASS_REWARD_BPS or TAG_FAIL_PENALTY_BPS and re-band Vendor.required_verification_sample_pct"
      - "on FAIL set StockPosition.tag_integrity_hold = true for the (destination_store_id, item_id) position and re-evaluate calculations.position_promising_state then calculations.store_fulfillment_posture"
      - "on PASS clear StockPosition.tag_integrity_hold for that position and re-evaluate the same two calculations"
      - "increment TagBatch.version by 1"

  - method: POST
    path: "/inventory-integrity/tag-batches/{tag_batch_id}/rework"
    description: "Send a failed batch back for re-encoding at source. Permitted only while rework_round is below MAX_REWORK_ROUNDS; all four verification counts are reset to 0."
    roles: [VendorRep, InventorySupervisor]
    code: 200
    input: []
    output: TagBatch
    side_effects:
      - "status VERIFICATION_FAILED -> ENCODED, increment rework_round by 1"
      - "reset sampled_units, readable_units, duplicate_epc_count, unencoded_units and read_rate_bps to 0 and verification_outcome to null"
      - "re-freeze required_sample_units from the vendor's current band, which the failure just widened"
      - "increment TagBatch.version by 1"

  - method: POST
    path: "/inventory-integrity/tag-batches/{tag_batch_id}/scrap"
    description: "Scrap a failed batch instead of reworking it. Terminal."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: TagBatch
    side_effects:
      - "status VERIFICATION_FAILED -> SCRAPPED"
      - "clear StockPosition.tag_integrity_hold for the (destination_store_id, item_id) position and re-evaluate calculations.position_promising_state and calculations.store_fulfillment_posture"
      - "increment TagBatch.version by 1"

  # ------------------------------------------------------------- count schedules
  - method: POST
    path: "/inventory-integrity/count-schedules"
    description: "Create a cycle-count schedule for a (store, category) pair. The reader mode must be permitted by the category and supported by the store hardware."
    roles: [InventoryAnalyst, InventorySupervisor]
    code: 201
    input: [store_id, category_id, reader_mode, first_due_date, "cadence_days?"]
    output: CountSchedule
    side_effects:
      - "status = ACTIVE, completed_cycle_count = 0"
      - "cadence_days defaults to Category.count_cadence_days when omitted"
      - "next_due_date = first_due_date"

  - method: GET
    path: "/inventory-integrity/count-schedules/{count_schedule_id}"
    description: "Fetch one cycle-count schedule including its live cadence and next due date."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: CountSchedule
    side_effects: []

  - method: GET
    path: "/inventory-integrity/count-schedules"
    description: "List cycle-count schedules, newest first, optionally filtered by store, category or status."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["store_id?", "category_id?", "status?", "limit?", "offset?"]
    output: CountSchedule[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/count-schedules/{count_schedule_id}/pause"
    description: "Pause a schedule so no new count task may be opened against it."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: CountSchedule
    side_effects:
      - "status ACTIVE -> PAUSED"
      - "increment CountSchedule.version by 1"

  - method: POST
    path: "/inventory-integrity/count-schedules/{count_schedule_id}/resume"
    description: "Return a paused schedule to ACTIVE."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: CountSchedule
    side_effects:
      - "status PAUSED -> ACTIVE"
      - "increment CountSchedule.version by 1"

  # ----------------------------------------------------------------- count tasks
  - method: POST
    path: "/inventory-integrity/count-tasks"
    description: "Open a cycle-count task on a schedule. Store and category are copied from the schedule. Reader-hardware support is checked before the window is due, the pairwise (store, category) window overlap is checked before the store-wide overhead reader capacity, and the physical-inventory blackout does not apply to cycle counts."
    roles: [InventoryAnalyst, InventorySupervisor]
    code: 201
    input: [count_schedule_id, reader_mode, window_start, window_end]
    output: CountTask
    side_effects:
      - "status = SCHEDULED, recount_round = 0, counted_line_count = 0, variance_line_count = 0, total_variance_value_cents = 0, coverage_pct = 0.00"
      - "copy store_id and category_id from the CountSchedule"
      - "in_scope_position_count stays 0 until the task is started"

  - method: GET
    path: "/inventory-integrity/count-tasks/{count_task_id}"
    description: "Fetch one cycle-count task including coverage and variance rollups."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: CountTask
    side_effects: []

  - method: GET
    path: "/inventory-integrity/count-tasks"
    description: "List cycle-count tasks, newest first, optionally filtered by schedule, store, category or status."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["count_schedule_id?", "store_id?", "category_id?", "status?", "limit?", "offset?"]
    output: CountTask[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/count-tasks/{count_task_id}/start"
    description: "Start counting. The in-scope denominator is snapshotted here and is NOT refreshed if positions appear later in the window."
    roles: [StoreOps, InventoryAnalyst, InventorySupervisor]
    code: 200
    input: []
    output: CountTask
    side_effects:
      - "status SCHEDULED -> IN_PROGRESS"
      - "snapshot in_scope_position_count = number of StockPosition rows at this store whose Item.category_id equals the task category"
      - "increment CountTask.version by 1"

  - method: POST
    path: "/inventory-integrity/count-tasks/{count_task_id}/lines"
    description: "Record one counted line. The item must belong to the task category and be stocked at the task store; the reader mode actually used is recorded and drives the coverage weight."
    roles: [StoreOps, InventoryAnalyst]
    code: 201
    input: [item_id, counted_units, read_mode_used]
    output: CountLine
    side_effects:
      - "resolve stock_position_id from (CountTask.store_id, item_id) and snapshot system_units_snapshot = StockPosition.on_hand_units"
      - "compute variance_units, variance_value_cents and within_tolerance per calculations.count_variance_valuation"
      - "increment CountTask.counted_line_count and recompute coverage_pct per calculations.count_coverage_pct"
      - "increment CountTask.version by 1"

  - method: GET
    path: "/inventory-integrity/count-lines/{count_line_id}"
    description: "Fetch one counted line with its snapshot and valued variance."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: CountLine
    side_effects: []

  - method: GET
    path: "/inventory-integrity/count-lines"
    description: "List counted lines, newest first, optionally filtered by task, item or stock position. This is the only discovery channel for lines created inside a task."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["count_task_id?", "item_id?", "stock_position_id?", "limit?", "offset?"]
    output: CountLine[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/count-tasks/{count_task_id}/submit"
    description: "Submit the count. Coverage must reach MIN_COVERAGE_PCT, a covering shrink period must exist when any line is out of tolerance, and one investigation is opened per out-of-tolerance line."
    roles: [StoreOps, InventoryAnalyst, InventorySupervisor]
    code: 200
    input: []
    output: CountTask
    side_effects:
      - "status IN_PROGRESS -> COUNTED"
      - "recompute coverage_pct, variance_line_count and total_variance_value_cents per calculations.count_coverage_pct and calculations.count_variance_valuation"
      - "open one VarianceInvestigation in status OPEN per CountLine with within_tolerance == false, stamping store_id, shrink_period_id, variance_units and variance_value_cents"
      - "set StockPosition.last_counted_at, last_count_system_units, last_count_book_value_cents, last_variance_units and last_variance_value_cents on every counted position"
      - "recompute unit_accuracy_pct and value_accuracy_pct per calculations.stock_accuracy_pct, then calculations.position_promising_state, then calculations.store_fulfillment_posture"
      - "increment CountTask.version by 1"

  - method: POST
    path: "/inventory-integrity/count-tasks/{count_task_id}/return-to-count"
    description: "Send a submitted count back to the floor for a recount. Every line is discarded and every investigation the submit opened is WAIVED; permitted only while recount_round is below MAX_RECOUNT_ROUNDS."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: CountTask
    side_effects:
      - "status COUNTED -> IN_PROGRESS, increment recount_round by 1"
      - "delete every CountLine on the task and reset counted_line_count, coverage_pct, variance_line_count and total_variance_value_cents"
      - "transition every VarianceInvestigation of this task that is still in status OPEN to WAIVED (conditional cascade: investigations past OPEN are left alone)"
      - "re-evaluate calculations.position_promising_state for the affected positions and calculations.store_fulfillment_posture"
      - "increment CountTask.version by 1"

  - method: POST
    path: "/inventory-integrity/count-tasks/{count_task_id}/reconcile"
    description: "Close out a submitted count. Every investigation it raised must be CLOSED or WAIVED; the schedule's next due date then advances by its cadence."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: CountTask
    side_effects:
      - "status COUNTED -> RECONCILED"
      - "increment CountSchedule.completed_cycle_count and advance CountSchedule.next_due_date by cadence_days from window_end"
      - "increment CountTask.version and CountSchedule.version by 1"

  - method: POST
    path: "/inventory-integrity/count-tasks/{count_task_id}/void"
    description: "Void a count task that will never be completed. Terminal."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: CountTask
    side_effects:
      - "status SCHEDULED -> VOIDED or IN_PROGRESS -> VOIDED"
      - "delete every CountLine on the task"
      - "increment CountTask.version by 1"

  # ------------------------------------------------------ variance investigations
  - method: GET
    path: "/inventory-integrity/variance-investigations/{investigation_id}"
    description: "Fetch one variance investigation with its proposed and approved root cause."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: VarianceInvestigation
    side_effects: []

  - method: GET
    path: "/inventory-integrity/variance-investigations"
    description: "List variance investigations, newest first, optionally filtered by count line, store, shrink period, status or approved root cause. This is the only discovery channel for investigations opened by a count submit."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["count_line_id?", "store_id?", "shrink_period_id?", "status?", "approved_root_cause?", "limit?", "offset?"]
    output: VarianceInvestigation[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/variance-investigations/{investigation_id}/assign"
    description: "Assign an investigator and move the investigation into review."
    roles: [InventoryAnalyst, InventorySupervisor]
    code: 200
    input: [assigned_investigator_id]
    output: VarianceInvestigation
    side_effects:
      - "status OPEN -> IN_REVIEW"
      - "increment VarianceInvestigation.version by 1"

  - method: POST
    path: "/inventory-integrity/variance-investigations/{investigation_id}/propose-cause"
    description: "Propose a root-cause categorization. Callable again from CAUSE_PROPOSED to supersede an earlier proposal; the caller must present the investigation version it last observed so a supersede cannot be built on a stale reading."
    roles: [InventoryAnalyst, InventorySupervisor]
    code: 200
    input: [proposed_root_cause, evidence_note, expected_investigation_version]
    output: VarianceInvestigation
    side_effects:
      - "status IN_REVIEW -> CAUSE_PROPOSED, or CAUSE_PROPOSED -> CAUSE_PROPOSED when superseding"
      - "overwrite proposed_root_cause and evidence_note, set proposed_by_user_id = X-User-ID, increment proposal_round by 1"
      - "increment VarianceInvestigation.version by 1"

  - method: POST
    path: "/inventory-integrity/variance-investigations/{investigation_id}/return"
    description: "Return a proposal for more evidence. The returner may not be the proposer."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: ["note?"]
    output: VarianceInvestigation
    side_effects:
      - "status CAUSE_PROPOSED -> IN_REVIEW"
      - "clear proposed_root_cause and proposed_by_user_id"
      - "increment VarianceInvestigation.version by 1"

  - method: POST
    path: "/inventory-integrity/variance-investigations/{investigation_id}/approve-cause"
    description: "Approve the proposed root cause. The approver may not be the proposer and the covering shrink period must still be OPEN."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: VarianceInvestigation
    side_effects:
      - "status CAUSE_PROPOSED -> CAUSE_APPROVED"
      - "copy proposed_root_cause into approved_root_cause and set approved_by_user_id = X-User-ID"
      - "increment VarianceInvestigation.version by 1"

  - method: POST
    path: "/inventory-integrity/variance-investigations/{investigation_id}/close"
    description: "Close an approved investigation. This is the head of the four-hop cascade that attributes the variance to a shrink bucket, moves the vendor's compliance score on a shortage finding and widens the sample size on that vendor's open tag batches."
    roles: [InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: VarianceInvestigation
    side_effects:
      - "status CAUSE_APPROVED -> CLOSED"
      - "add variance_value_cents into the ShrinkPeriod bucket named by approved_root_cause and remove it from unresolved_cents (hop 2)"
      - "recompute ShrinkPeriod.total_attributable_variance_cents, the provisional and final totals and shrink_rate_bps per calculations.shrink_attribution"
      - "on approved_root_cause == VENDOR_SHORTAGE increment Vendor.shortage_event_count and reduce tag_compliance_score_bps by VENDOR_SHORTAGE_PENALTY_BPS, re-banding required_verification_sample_pct (hop 3)"
      - "re-freeze required_sample_units on every DRAFT or ENCODED TagBatch of that vendor from the new band (hop 4)"
      - "re-evaluate calculations.position_promising_state for the investigated position and calculations.store_fulfillment_posture"
      - "increment VarianceInvestigation.version and ShrinkPeriod.version by 1"

  # --------------------------------------------------------------- shrink periods
  - method: POST
    path: "/inventory-integrity/shrink-periods"
    description: "Open a shrink measurement period for a store. Periods for one store may not overlap; the inclusive date range is what a count submit looks for when it needs a covering period."
    roles: [ShrinkController, InventorySupervisor]
    code: 201
    input: [store_id, period_start, period_end, sales_at_cost_cents]
    output: ShrinkPeriod
    side_effects:
      - "status = OPEN, reopen_count = 0, chargeback_issued_vendor_ids = []"
      - "all four attribution buckets, unresolved_cents, both totals and shrink_rate_bps start at 0"

  - method: GET
    path: "/inventory-integrity/shrink-periods/{shrink_period_id}"
    description: "Fetch one shrink period with all four attribution buckets and both totals."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: ShrinkPeriod
    side_effects: []

  - method: GET
    path: "/inventory-integrity/shrink-periods"
    description: "List shrink periods, newest first, optionally filtered by store or status."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["store_id?", "status?", "limit?", "offset?"]
    output: ShrinkPeriod[]
    side_effects: []

  - method: GET
    path: "/inventory-integrity/shrink-periods/{shrink_period_id}/attribution"
    description: "Computed read: both variants of calculations.shrink_attribution side by side, so the provisional-versus-final divergence is observable without closing the period."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output:
      theft_cents: integer
      damage_cents: integer
      process_error_cents: integer
      vendor_shortage_cents: integer
      unresolved_cents: integer
      total_attributable_variance_cents: integer
      provisional_total_shrink_cents: integer
      final_total_shrink_cents: integer
      provisional_shrink_rate_bps: integer
      final_shrink_rate_bps: integer
      active_variant: string
    side_effects: []

  - method: POST
    path: "/inventory-integrity/shrink-periods/{shrink_period_id}/provisional-close"
    description: "Provisionally close the period. The provisional variant of calculations.shrink_attribution is frozen; unresolved variance is still carried as shrink."
    roles: [ShrinkController]
    code: 200
    input: []
    output: ShrinkPeriod
    side_effects:
      - "status OPEN -> PROVISIONAL_CLOSED"
      - "freeze provisional_total_shrink_cents and shrink_rate_bps from the provisional variant"
      - "increment ShrinkPeriod.version by 1"

  - method: POST
    path: "/inventory-integrity/shrink-periods/{shrink_period_id}/reopen"
    description: "Reopen a provisionally closed period so late investigations can still be attributed to it."
    roles: [ShrinkController]
    code: 200
    input: ["note?"]
    output: ShrinkPeriod
    side_effects:
      - "status PROVISIONAL_CLOSED -> OPEN, increment reopen_count by 1"
      - "increment ShrinkPeriod.version by 1"

  - method: POST
    path: "/inventory-integrity/shrink-periods/{shrink_period_id}/final-close"
    description: "Finally close the period. Every investigation attributed to it must be CLOSED or WAIVED; the final variant drops unresolved variance out of the shrink total. Terminal."
    roles: [ShrinkController]
    code: 200
    input: []
    output: ShrinkPeriod
    side_effects:
      - "status PROVISIONAL_CLOSED -> FINAL_CLOSED"
      - "freeze final_total_shrink_cents and shrink_rate_bps from the final variant of calculations.shrink_attribution"
      - "increment ShrinkPeriod.version by 1"

  # ----------------------------------------------------------- vendor chargebacks
  - method: POST
    path: "/inventory-integrity/vendors/{vendor_id}/chargebacks"
    description: "Issue a vendor-shortage chargeback out of one shrink period. The gross tier keys both the tier rate and the goodwill credit, so the credit can never re-tier the charge."
    roles: [ShrinkController]
    code: 201
    input: [shrink_period_id]
    output:
      vendor_id: string
      shrink_period_id: string
      attributable_shortage_cents: integer
      tier: string
      chargeback_gross_cents: integer
      vendor_credit_cents: integer
      net_chargeback_cents: integer
      lifetime_chargeback_gross_cents: integer
      credited_cents: integer
      chargeback_balance_cents: integer
    side_effects:
      - "compute the tier, gross, credit and net per calculations.vendor_shortage_chargeback"
      - "add chargeback_gross_cents into Vendor.lifetime_chargeback_gross_cents and vendor_credit_cents into Vendor.credited_cents"
      - "recompute Vendor.chargeback_balance_cents"
      - "append vendor_id to ShrinkPeriod.chargeback_issued_vendor_ids"
      - "increment Vendor.version and ShrinkPeriod.version by 1"

  - method: POST
    path: "/inventory-integrity/vendors/{vendor_id}/chargeback-credits"
    description: "Grant an additional rebuttal or goodwill credit against a vendor's outstanding chargeback balance. Gross is never rewritten, so the money invariant gross - credited == balance holds."
    roles: [ShrinkController]
    code: 201
    input: [credit_cents, "note?"]
    output:
      vendor_id: string
      credit_cents: integer
      lifetime_chargeback_gross_cents: integer
      credited_cents: integer
      chargeback_balance_cents: integer
    side_effects:
      - "add credit_cents into Vendor.credited_cents and recompute chargeback_balance_cents"
      - "increment Vendor.version by 1"

  # ---------------------------------------------------------- physical inventory
  - method: POST
    path: "/inventory-integrity/physical-inventories"
    description: "Schedule an annual physical inventory with a third-party counting firm. The closed date interval is compared against every other non-abandoned physical inventory at the store padded by PHYSICAL_BLACKOUT_BUFFER_DAYS on both sides."
    roles: [ShrinkController, SystemAdmin]
    code: 201
    input: [store_id, counter_firm_id, scheduled_start_date, scheduled_end_date, "recount_threshold_bps?"]
    output: PhysicalInventory
    side_effects:
      - "status = PLANNED, recount_round = 0, line_count = 0"
      - "recount_threshold_bps defaults to 150 when omitted"
      - "book_value_cents, counted_value_cents, net_variance_cents and net_variance_bps start at 0; certified_at = null"

  - method: GET
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}"
    description: "Fetch one physical inventory with its book-to-counted reconciliation figures."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: PhysicalInventory
    side_effects: []

  - method: GET
    path: "/inventory-integrity/physical-inventories"
    description: "List physical inventories, newest first, optionally filtered by store, counting firm or status."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["store_id?", "counter_firm_id?", "status?", "limit?", "offset?"]
    output: PhysicalInventory[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/start"
    description: "Third-party counters begin the first pass."
    roles: [ThirdPartyCounter, ShrinkController]
    code: 200
    input: []
    output: PhysicalInventory
    side_effects:
      - "status PLANNED -> COUNTING"
      - "increment PhysicalInventory.version by 1"

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/lines"
    description: "Submit one counted line for the current pass. A line for the same item in the same pass supersedes the earlier one; the caller must present the physical-inventory version it last observed so a supersede cannot be built on a stale reading."
    roles: [ThirdPartyCounter, ShrinkController]
    code: 201
    input: [item_id, counted_units, expected_physical_inventory_version]
    output: PhysicalInventoryLine
    side_effects:
      - "snapshot book_units_snapshot = StockPosition.on_hand_units and book_value_snapshot_cents, stamp pass_round = PhysicalInventory.recount_round"
      - "compute variance_units and variance_value_cents"
      - "mark any earlier line for the same (physical_inventory_id, item_id, pass_round) as superseded = true"
      - "recompute PhysicalInventory.line_count over non-superseded lines of the current pass"
      - "increment PhysicalInventory.version by 1"

  - method: GET
    path: "/inventory-integrity/physical-inventory-lines/{physical_inventory_line_id}"
    description: "Fetch one physical-inventory line including its supersede flag and pass round."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output: PhysicalInventoryLine
    side_effects: []

  - method: GET
    path: "/inventory-integrity/physical-inventory-lines"
    description: "List physical-inventory lines, newest first, optionally filtered by physical inventory, item, pass round or supersede flag."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: ["physical_inventory_id?", "item_id?", "pass_round?", "superseded?", "limit?", "offset?"]
    output: PhysicalInventoryLine[]
    side_effects: []

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/complete-pass"
    description: "Close the current counting pass and roll up book value, counted value and net variance in basis points."
    roles: [ThirdPartyCounter, ShrinkController]
    code: 200
    input: []
    output: PhysicalInventory
    side_effects:
      - "status COUNTING -> FIRST_PASS_COMPLETE"
      - "recompute book_value_cents, counted_value_cents, net_variance_cents and net_variance_bps over non-superseded lines of the current pass"
      - "increment PhysicalInventory.version by 1"

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/order-recount"
    description: "Send the count back for a second pass. Permitted only while recount_round is below MAX_RECOUNT_ROUNDS; the previous pass's lines stay on file under their own pass_round."
    roles: [ShrinkController, InventorySupervisor]
    code: 200
    input: ["note?"]
    output: PhysicalInventory
    side_effects:
      - "status FIRST_PASS_COMPLETE -> COUNTING, increment recount_round by 1"
      - "reset line_count to 0 for the new pass"
      - "increment PhysicalInventory.version by 1"

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/reconcile"
    description: "Reconcile the physical count to book value. Blocked unless the net variance is inside recount_threshold_bps or a recount has already been ordered; runs the waterfall allocation of unexplained variance across the shrink buckets and mints one PHYSICAL_RECONCILIATION adjustment per varying position."
    roles: [ShrinkController]
    code: 200
    input: []
    output: PhysicalInventory
    side_effects:
      - "status FIRST_PASS_COMPLETE -> RECONCILING"
      - "mint one Adjustment per non-superseded line with variance_units != 0, reason_code PHYSICAL_RECONCILIATION, approval_state NOT_REQUIRED, posted immediately"
      - "run calculations.physical_reconciliation: explained variance from CLOSED investigations first, then the capped waterfall over process_error, damage and theft, with the uncapped remainder falling through to unresolved_cents"
      - "add the allocated amounts into the covering OPEN ShrinkPeriod buckets and recompute calculations.shrink_attribution"
      - "recompute every touched StockPosition, then calculations.position_promising_state and calculations.store_fulfillment_posture"
      - "increment PhysicalInventory.version and ShrinkPeriod.version by 1"

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/certify"
    description: "Certify the physical inventory to book value. Blocked while the covering shrink period is still OPEN, since certification asserts the shrink figures are settled. Terminal."
    roles: [ShrinkController]
    code: 200
    input: []
    output: PhysicalInventory
    side_effects:
      - "status RECONCILING -> CERTIFIED, set certified_at = logical clock"
      - "increment PhysicalInventory.version by 1"

  - method: POST
    path: "/inventory-integrity/physical-inventories/{physical_inventory_id}/abandon"
    description: "Abandon a planned physical inventory. Terminal, and it releases the store's blackout window."
    roles: [ShrinkController, SystemAdmin]
    code: 200
    input: ["note?"]
    output: PhysicalInventory
    side_effects:
      - "status PLANNED -> ABANDONED"
      - "increment PhysicalInventory.version by 1"

  # ------------------------------------------------------------- computed reads
  - method: GET
    path: "/inventory-integrity/stores/{store_id}/fulfillment-eligibility"
    description: "Computed read: the store's omnichannel fulfillment posture with every input of calculations.store_fulfillment_posture exposed, including the empty-store case which reads 10000 bps and ELIGIBLE."
    roles: [SystemAdmin, InventoryAnalyst, InventorySupervisor, ShrinkController]
    code: 200
    input: []
    output:
      store_id: string
      total_position_count: integer
      blocked_position_count: integer
      restricted_position_count: integer
      blocked_ratio_bps: integer
      restricted_ratio_bps: integer
      accuracy_index_bps: integer
      fulfillment_status: string
      demotion_reason: string
    side_effects: []

  # --------------------------------------------------------- test-driving surface
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every date and datetime rule in this domain reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects:
      - "set the logical clock; no entity is mutated and no calculation is re-run as a consequence"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:

  # ---- authentication and authorisation ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the seven declared in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_IDENTITY_SCOPE_VIOLATION
    http: 403
    condition: "an entity_backed role acts outside its own entity: StoreOps whose X-User-ID is not the store on the task or tag batch, VendorRep whose X-User-ID is not the batch or path vendor, ThirdPartyCounter whose X-User-ID is not the physical inventory's counter firm"

  # ---- existence ----
  - id: ERR_CATEGORY_NOT_FOUND
    http: 404
    condition: "the referenced category_id matches no Category"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "the referenced store_id or destination_store_id matches no Store"
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "the referenced vendor_id or primary_vendor_id matches no Vendor"
  - id: ERR_COUNTER_FIRM_NOT_FOUND
    http: 404
    condition: "the referenced counter_firm_id matches no CounterFirm"
  - id: ERR_ITEM_NOT_FOUND
    http: 404
    condition: "the referenced item_id matches no Item"
  - id: ERR_STOCK_POSITION_NOT_FOUND
    http: 404
    condition: "the referenced stock_position_id matches no StockPosition"
  - id: ERR_TAG_BATCH_NOT_FOUND
    http: 404
    condition: "the referenced tag_batch_id matches no TagBatch"
  - id: ERR_COUNT_SCHEDULE_NOT_FOUND
    http: 404
    condition: "the referenced count_schedule_id matches no CountSchedule"
  - id: ERR_COUNT_TASK_NOT_FOUND
    http: 404
    condition: "the referenced count_task_id matches no CountTask"
  - id: ERR_COUNT_LINE_NOT_FOUND
    http: 404
    condition: "the referenced count_line_id matches no CountLine"
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "the referenced investigation_id matches no VarianceInvestigation"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "the referenced adjustment_id matches no Adjustment"
  - id: ERR_SHRINK_PERIOD_NOT_FOUND
    http: 404
    condition: "the referenced shrink_period_id matches no ShrinkPeriod"
  - id: ERR_PHYSICAL_INVENTORY_NOT_FOUND
    http: 404
    condition: "the referenced physical_inventory_id matches no PhysicalInventory"
  - id: ERR_PHYSICAL_INVENTORY_LINE_NOT_FOUND
    http: 404
    condition: "the referenced physical_inventory_line_id matches no PhysicalInventoryLine"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "a required body field is absent, has the wrong type, or violates a §1.1 numeric or length constraint; also raised for a to_iso8601 that is not a valid UTC instant"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum body field carries a value outside the set declared in §1.1 (reader_capability, reader_mode, reader_mode_required, encoding_scheme, read_mode_used, reason_code, proposed_root_cause, certification_level, promising_state filter, status filter)"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset below 0 on a list endpoint"

  # ---- uniqueness ----
  - id: ERR_DUPLICATE_CATEGORY_CODE
    http: 409
    condition: "a Category with the submitted code already exists"
  - id: ERR_DUPLICATE_STORE_CODE
    http: 409
    condition: "a Store with the submitted code already exists"
  - id: ERR_DUPLICATE_VENDOR_CODE
    http: 409
    condition: "a Vendor with the submitted code already exists"
  - id: ERR_DUPLICATE_COUNTER_FIRM_CODE
    http: 409
    condition: "a CounterFirm with the submitted code already exists"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "an Item with the submitted sku already exists"
  - id: ERR_DUPLICATE_STOCK_POSITION
    http: 409
    condition: "a StockPosition already exists for the submitted (store_id, item_id) pair"
  - id: ERR_DUPLICATE_COUNT_LINE
    http: 409
    condition: "a CountLine for the submitted item_id is already attached to this CountTask"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_STOCK_POSITION_VERSION
    http: 412
    condition: "expected_stock_position_version does not equal the position's current version, so the authority threshold would be computed against on-hand data the caller has not seen"
  - id: ERR_STALE_PHYSICAL_INVENTORY_VERSION
    http: 412
    condition: "expected_physical_inventory_version does not equal the physical inventory's current version, so a supersede would be built on a stale line set"
  - id: ERR_STALE_INVESTIGATION_VERSION
    http: 412
    condition: "expected_investigation_version does not equal the investigation's current version, so a cause proposal would supersede a proposal the caller has not read"

  # ---- state preconditions ----
  - id: ERR_TAG_BATCH_INVALID_STATE
    http: 409
    condition: "the tag batch is not in the from-state the requested transition declares in §1.2, including any transition attempted out of VERIFIED_PASS or SCRAPPED"
  - id: ERR_COUNT_TASK_INVALID_STATE
    http: 409
    condition: "the count task is not in the from-state the requested transition declares in §1.2, including line submission while not IN_PROGRESS and any transition out of RECONCILED or VOIDED"
  - id: ERR_INVESTIGATION_INVALID_STATE
    http: 409
    condition: "the investigation is not in the from-state the requested transition declares in §1.2, including any transition out of CLOSED or WAIVED"
  - id: ERR_ADJUSTMENT_INVALID_STATE
    http: 409
    condition: "the adjustment's approval or posting dimension is not in the from-state the requested transition declares in §1.2, including approving an already-APPROVED row or reversing an UNPOSTED one"
  - id: ERR_SHRINK_PERIOD_INVALID_STATE
    http: 409
    condition: "the shrink period is not in the from-state the requested transition declares in §1.2, or an investigation cause approval or close was attempted while its covering period is not OPEN"
  - id: ERR_PHYSICAL_INVENTORY_INVALID_STATE
    http: 409
    condition: "the physical inventory is not in the from-state the requested transition declares in §1.2, including line submission while not COUNTING and any transition out of CERTIFIED or ABANDONED"
  - id: ERR_COUNT_SCHEDULE_NOT_ACTIVE
    http: 409
    condition: "the backing CountSchedule is PAUSED or RETIRED when a task is opened or started, or the schedule is already in the requested status on pause or resume"

  # ---- compliance and safety ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the user who performed the step now being reviewed: the proposer of a cause approving or returning it, or the requester of an adjustment approving, rejecting or reversing it"
  - id: ERR_TAG_INTEGRITY_HOLD
    http: 409
    condition: "an adjustment posting was attempted against a StockPosition whose tag_integrity_hold is true"
  - id: ERR_SHRINK_PERIOD_STILL_OPEN
    http: 409
    condition: "certification was attempted while the shrink period covering the physical inventory's scheduled_end_date is still OPEN"

  # ---- referential coupling ----
  - id: ERR_INVESTIGATION_NOT_CLOSED
    http: 409
    condition: "an adjustment carrying an investigation_id was posted while that investigation is not CLOSED"
  - id: ERR_ITEM_CATEGORY_MISMATCH
    http: 409
    condition: "the counted item's category_id differs from the count task's category_id"
  - id: ERR_ITEM_NOT_STOCKED_AT_STORE
    http: 409
    condition: "no StockPosition exists for the (store of the parent count task or physical inventory, submitted item_id) pair"
  - id: ERR_NO_COVERING_SHRINK_PERIOD
    http: 409
    condition: "no ShrinkPeriod for the store in the required status has an inclusive date range containing the relevant date, so an out-of-tolerance variance would have nowhere to be attributed"
  - id: ERR_OPEN_INVESTIGATIONS
    http: 409
    condition: "a count task reconcile or a shrink period final close was attempted while at least one investigation in scope is neither CLOSED nor WAIVED"

  # ---- geometric and cardinality constraints ----
  - id: ERR_READER_MODE_UNSUPPORTED
    http: 422
    condition: "the requested reader mode, or the reader mode actually used on a line, is not supported by Store.reader_capability"
  - id: ERR_CATEGORY_READER_MODE_MISMATCH
    http: 422
    condition: "the schedule's reader_mode is not permitted by Category.reader_mode_required"
  - id: ERR_COUNT_WINDOW_OVERLAP
    http: 409
    condition: "a non-terminal count task on the same (store_id, category_id) already holds a half-open window overlapping the requested one; touching windows where one ends exactly as the next begins do NOT overlap"
  - id: ERR_OVERHEAD_READER_CAPACITY_EXCEEDED
    http: 409
    condition: "the number of non-terminal OVERHEAD count tasks at the store with windows overlapping the requested one already equals Store.overhead_reader_capacity"
  - id: ERR_PHYSICAL_INVENTORY_BLACKOUT_CONFLICT
    http: 409
    condition: "the requested closed date interval intersects another non-abandoned physical inventory at the store after both are padded by PHYSICAL_BLACKOUT_BUFFER_DAYS; endpoints that merely touch DO conflict under closed-interval semantics"
  - id: ERR_SHRINK_PERIOD_OVERLAP
    http: 409
    condition: "another ShrinkPeriod for the same store has an inclusive date range intersecting the requested one"
  - id: ERR_ZERO_DELTA_UNITS
    http: 422
    condition: "an adjustment was requested with delta_units exactly 0, which would move no units yet consume an approval"
  - id: ERR_REWORK_LIMIT_REACHED
    http: 409
    condition: "a rework, return-to-count or recount was requested when the entity's round counter has already reached MAX_REWORK_ROUNDS or MAX_RECOUNT_ROUNDS"
  - id: ERR_TAG_SCHEME_MISMATCH
    http: 422
    condition: "the submitted encoding_scheme differs from Item.tag_encoding_scheme, or the epc_prefix length differs from Item.epc_prefix_length"
  - id: ERR_SAMPLE_BELOW_REQUIRED
    http: 422
    condition: "sampled_units is below the required_sample_units frozen on the batch at encoding time"
  - id: ERR_INVALID_VERIFICATION_COUNTS
    http: 422
    condition: "readable_units or unencoded_units exceeds sampled_units, or their sum exceeds sampled_units"
  - id: ERR_NO_COUNT_LINES
    http: 409
    condition: "a count submit or pass completion was attempted with no lines recorded for the current round"
  - id: ERR_COUNT_COVERAGE_BELOW_MIN
    http: 409
    condition: "the weighted coverage percentage is below MIN_COVERAGE_PCT, including the case where lines exist but were all read with a reader mode earning zero weight"
  - id: ERR_MAX_LINES_PER_PASS_EXCEEDED
    http: 409
    condition: "the counting firm's max_lines_per_pass would be exceeded by this line within the current pass_round"

  # ---- temporal constraints ----
  - id: ERR_COUNT_WINDOW_NOT_DUE
    http: 422
    condition: "window_start falls before the schedule's next_due_date"
  - id: ERR_INVALID_WINDOW
    http: 422
    condition: "window_end is not strictly after window_start"
  - id: ERR_INVALID_PERIOD_RANGE
    http: 422
    condition: "period_end precedes period_start, or scheduled_end_date precedes scheduled_start_date"

  # ---- fiscal authority ----
  - id: ERR_ADJUSTMENT_ABOVE_SUPERVISOR_CAP
    http: 403
    condition: "an InventorySupervisor tried to approve an adjustment whose value_impact_cents exceeds SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS; only a ShrinkController may"
  - id: ERR_ADJUSTMENT_APPROVAL_REQUIRED
    http: 409
    condition: "posting was attempted while approval_state is PENDING or REJECTED"
  - id: ERR_RECOUNT_REQUIRED
    http: 409
    condition: "reconciliation was attempted while net_variance_bps is at or above recount_threshold_bps and no recount has yet been ordered"
  - id: ERR_NO_VENDOR_SHORTAGE
    http: 409
    condition: "a chargeback was requested for a vendor with no attributable VENDOR_SHORTAGE variance in the named shrink period"
  - id: ERR_CHARGEBACK_ALREADY_ISSUED
    http: 409
    condition: "the vendor already appears in ShrinkPeriod.chargeback_issued_vendor_ids"
  - id: ERR_CREDIT_EXCEEDS_BALANCE
    http: 422
    condition: "credit_cents exceeds Vendor.chargeback_balance_cents, which would drive the balance negative and break the money invariant"

# ============================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties)
# ============================================================================

roles:

  - name: SystemAdmin
    description: "Reference-data owner. Sets up categories, stores, vendors, SKUs and counting firms, opens stock positions and drives the logical clock. Deliberately excluded from every approval, attribution and chargeback decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /inventory-integrity/categories"
      - "POST /inventory-integrity/stores"
      - "POST /inventory-integrity/vendors"
      - "POST /inventory-integrity/counter-firms"
      - "POST /inventory-integrity/items"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /inventory-integrity/stock-positions"
      - "POST /inventory-integrity/tag-batches and /encode"
      - "POST /inventory-integrity/physical-inventories and /abandon"
      - "every GET in §1.5"

  - name: InventoryAnalyst
    description: "Day-to-day integrity analyst. Builds cycle-count schedules and tasks, records lines, runs integrity scans, requests adjustments and proposes root causes. Cannot approve anything it requested or proposed."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /inventory-integrity/stock-positions"
      - "POST /inventory-integrity/stock-positions/{stock_position_id}/integrity-scan"
      - "POST /inventory-integrity/stock-positions/{stock_position_id}/adjustments"
      - "POST /inventory-integrity/count-schedules"
      - "POST /inventory-integrity/count-tasks, /start, /lines, /submit"
      - "POST /inventory-integrity/variance-investigations/{investigation_id}/assign, /propose-cause"
      - "every GET in §1.5"

  - name: InventorySupervisor
    description: "Store-level approver. Approves cause proposals it did not make, approves, rejects, posts and reverses adjustments it did not request up to SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS, returns counts for recount and reconciles them, and provisionally manages the count calendar."
    identity: "opaque"
    exclusive_operations:
      - "POST /inventory-integrity/count-tasks/{count_task_id}/return-to-count"
      - "POST /inventory-integrity/count-tasks/{count_task_id}/reconcile"
      - "POST /inventory-integrity/count-tasks/{count_task_id}/void"
      - "POST /inventory-integrity/count-schedules/{count_schedule_id}/pause, /resume"
    shared_operations:
      - "POST /inventory-integrity/adjustments/{adjustment_id}/approve, /reject, /post, /reverse"
      - "POST /inventory-integrity/variance-investigations/{investigation_id}/approve-cause, /return, /close"
      - "POST /inventory-integrity/tag-batches/{tag_batch_id}/receive, /verify, /rework, /scrap"
      - "POST /inventory-integrity/shrink-periods"
      - "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/order-recount"
      - "every GET in §1.5"

  - name: ShrinkController
    description: "Financial owner of shrink. Sole holder of shrink-period closure, vendor chargebacks and credits, physical-inventory reconciliation and certification, and adjustment approvals above the supervisor cap."
    identity: "opaque"
    exclusive_operations:
      - "POST /inventory-integrity/shrink-periods/{shrink_period_id}/provisional-close, /reopen, /final-close"
      - "POST /inventory-integrity/vendors/{vendor_id}/chargebacks"
      - "POST /inventory-integrity/vendors/{vendor_id}/chargeback-credits"
      - "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/reconcile"
      - "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/certify"
      - "approving an adjustment whose value_impact_cents exceeds SUPERVISOR_SINGLE_APPROVAL_CAP_CENTS"
    shared_operations:
      - "POST /inventory-integrity/adjustments/{adjustment_id}/approve, /reject, /post, /reverse"
      - "POST /inventory-integrity/variance-investigations/{investigation_id}/approve-cause, /return, /close"
      - "POST /inventory-integrity/shrink-periods"
      - "POST /inventory-integrity/physical-inventories and /start, /lines, /complete-pass, /order-recount, /abandon"
      - "POST /inventory-integrity/count-tasks/{count_task_id}/reconcile, /void, /return-to-count"
      - "every GET in §1.5"

  - name: StoreOps
    description: "Store receiving and counting crew. X-User-ID is the Store id; may only receive and verify tag batches destined for that store and count tasks belonging to that store."
    identity: "entity_backed:Store"
    exclusive_operations: []
    shared_operations:
      - "POST /inventory-integrity/tag-batches/{tag_batch_id}/receive, /verify"
      - "POST /inventory-integrity/count-tasks/{count_task_id}/start, /lines, /submit"

  - name: VendorRep
    description: "Supplier-side source-tagging contact. X-User-ID is the Vendor id; may open, encode and rework only its own tag batches, and can see nothing else."
    identity: "entity_backed:Vendor"
    exclusive_operations: []
    shared_operations:
      - "POST /inventory-integrity/tag-batches"
      - "POST /inventory-integrity/tag-batches/{tag_batch_id}/encode"
      - "POST /inventory-integrity/tag-batches/{tag_batch_id}/rework"

  - name: ThirdPartyCounter
    description: "Independent physical-inventory counting crew. X-User-ID is the CounterFirm id; may start, submit lines for and complete passes of only the physical inventories assigned to that firm, and may never reconcile or certify its own count."
    identity: "entity_backed:CounterFirm"
    exclusive_operations: []
    shared_operations:
      - "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/start"
      - "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/lines"
      - "POST /inventory-integrity/physical-inventories/{physical_inventory_id}/complete-pass"
