        distinguishing_aspect: "A freshly filed PORTION_SIZE grievance sits in FILED with routed_branch null, both branch flags false, remedy null and a STANDARD_WINDOW_DAYS response_due_at of 2026-08-11T00:00:00Z - it is not routed automatically by category."
