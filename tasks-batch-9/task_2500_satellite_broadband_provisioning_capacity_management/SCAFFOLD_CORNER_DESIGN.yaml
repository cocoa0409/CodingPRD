            - { call: "POST /satellite-broadband/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: NetworkOpsEngineer }
          trigger:
            - { call: "POST /satellite-broadband/terminals/${term1_id}/transfer", payload: { new_subscriber_id: "${sub2_id}" }, as: ProvisioningAgent }
          assert:
            - "trigger response HTTP status == 200"
            - "Terminal.${term1_id}.terminal_state == TRANSFER_PENDING"
            - "Terminal.${term1_id}.subscriber_id == ${sub2_id}"
            - "Terminal.${term1_id}.ownership_changed_at == 2026-08-03T00:00:00.000Z"
            - "Terminal.${term1_id}.last_scan_verdict == null"
            - "Terminal.${term1_id}.installed_at == 2026-08-01T00:00:00.000Z (the historical install instant is retained)"
