      - name: customer_reactivate_hysteresis_threshold
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CustomerAccount.SUSPENDED_to_ACTIVE
          - errors[ERR_REACTIVATION_THRESHOLD_NOT_MET]
        distinguishing_aspect: |
          Reactivation uses a hysteresis band: with credit_limit 149400 the gate
          is outstanding <= floor(149400 * 0.8) == 119520. At 149400 the call
          fails; after a 29880 payment (outstanding exactly 119520) it succeeds —
          equality to the 80% floor is enough, paying to exactly the limit is not.
        test_recipe:
          setup:
            - "ACTIVE customer with credit_limit_cents 149400; run COMPLETED so outstanding_balance_cents == 149400; customer then SUSPENDED manually"
