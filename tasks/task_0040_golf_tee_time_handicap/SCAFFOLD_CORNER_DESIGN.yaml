        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=14]", entities.TeeTime.fields.start_utc]
        distinguishing_aspect: "A second slot exactly TEE_INTERVAL_MINUTES(8) after an existing slot on the same course is allowed (boundary inclusive) -> 201."
