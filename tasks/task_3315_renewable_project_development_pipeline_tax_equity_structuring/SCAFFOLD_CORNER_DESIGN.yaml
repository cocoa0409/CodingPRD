        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.ProcurementOrder.SAFE_HARBOR_QUALIFIED_to_CANCELLED]
        distinguishing_aspect: "Immediate consistency: the cancel response and a follow-up GET in the same test step both observe the TCQ revert and the project flag flip — no reconciliation delay."
