              as: ReferralCoordinator
              captures: { error_death_before_trigger: $.data.error_id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-6903", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-07T07:30:00Z", death_pronounced_at: "2026-09-07T07:45:00Z" }
              as: ReferralCoordinator
              captures: { ok_id: $.data.id, ok_referred: $.data.referred_at, ok_status: $.data.status }
            - call: "GET /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}" }
              as: ReferralCoordinator
              captures: { first_mrn: "$.data[0].patient_mrn" }
          assert:
            - "${error_future_trigger} == ERR_REFERRAL_BEFORE_TRIGGER with HTTP 422"
            - "${error_death_before_trigger} == ERR_REFERRAL_BEFORE_TRIGGER with HTTP 422"
            - "the third call returns HTTP 201 with ${ok_referred} == 2026-09-07T08:00:00Z and ${ok_status} == RECEIVED"
            - "${first_mrn} == MRN-6903 and total_count == 1: neither rejected referral was persisted"

