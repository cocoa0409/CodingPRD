    http: 409
    condition: "an invoice with amount_paid_cents greater than 0 is voided"
  - id: ERR_CYCLE_HAS_LIVE_VISIT
    http: 409
    condition: "a billing cycle is closed while a bound visit is EN_ROUTE or IN_PROGRESS"
  - id: ERR_PLAN_RETIRED
    http: 409
    condition: "a subscription is activated or tier-changed onto a ServicePlan with status RETIRED"
  - id: ERR_SUBSCRIPTION_CANCELLED
    http: 409
    condition: "an operation requires a subscription that is not CANCELLED"
  - id: ERR_VISIT_IN_FLIGHT
    http: 409
    condition: "a subscription is cancelled while a visit on its property is EN_ROUTE or IN_PROGRESS"
  - id: ERR_APPROVAL_REQUIRED
    http: 409
    condition: "a work order is dispatched while still PENDING_APPROVAL"
  - id: ERR_STORM_CEILING_EXCEEDED
    http: 409
