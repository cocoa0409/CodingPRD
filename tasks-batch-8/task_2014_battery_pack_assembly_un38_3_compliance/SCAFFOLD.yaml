# =============================================================================
# Table 1.6 — Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Not found ---
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "IntegrationProgram not found" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "CellLot not found" }
  - { id: ERR_BOM_NOT_FOUND, http: 404, condition: "PackBOM not found" }
  - { id: ERR_PACK_NOT_FOUND, http: 404, condition: "BatteryPack not found" }
  - { id: ERR_WELD_RECORD_NOT_FOUND, http: 404, condition: "WeldingParameterRecord not found" }
  - { id: ERR_FIRMWARE_NOT_FOUND, http: 404, condition: "BMSFirmware not found" }
  - { id: ERR_DOSSIER_NOT_FOUND, http: 404, condition: "SafetyTestDossier not found" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "StorageLocation not found" }
  - { id: ERR_PLACEMENT_NOT_FOUND, http: 404, condition: "StoragePlacement not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "TransportShipment not found" }
  - { id: ERR_RMA_NOT_FOUND, http: 404, condition: "ReturnAuthorization not found" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "RecallCampaign not found" }

  # --- Generic request ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required fields, or type mismatch" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field contains a value outside its declared set" }

  # --- Program state ---
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Operation requires program OPEN" }
  - { id: ERR_PROGRAM_NOT_SUSPENDED, http: 409, condition: "Resume requires program SUSPENDED" }
  - { id: ERR_UNRESOLVED_PACKS_REMAIN, http: 409, condition: "Program close blocked by non-terminal packs" }
  - { id: ERR_OPEN_SHIPMENTS_REMAIN, http: 409, condition: "Program close blocked by open shipments" }
  - { id: ERR_ACTIVE_RECALL_EXISTS, http: 409, condition: "Program close blocked by an ACTIVE recall" }

  # --- Cell lot ---
  - { id: ERR_LOT_NOT_RECEIVED, http: 409, condition: "Quarantine transition requires lot RECEIVED" }
  - { id: ERR_LOT_NOT_IN_QUARANTINE, http: 409, condition: "Inspection requires lot QUARANTINE" }
  - { id: ERR_LOT_NOT_REJECTED, http: 409, condition: "Retest requires lot REJECTED" }
  - { id: ERR_LOT_NOT_ACCEPTED, http: 409, condition: "PackBOM creation requires ACCEPTED lot" }
  - { id: ERR_LOT_DEPLETED, http: 409, condition: "Lot has no remaining cells" }
  - { id: ERR_INSPECTION_NOT_PASS, http: 409, condition: "Acceptance requires outcome=PASS" }
  - { id: ERR_SOC_OUT_OF_TOLERANCE, http: 422, condition: "Measured SOC deviates from declared by more than ±2.0 percent" }
  - { id: ERR_RETEST_LIMIT_EXCEEDED, http: 409, condition: "quarantine_cycle_count >= 2" }

  # --- Pack / BOM ---
  - { id: ERR_PACK_NOT_BUILT, http: 409, condition: "Weld record requires pack BUILT" }
  - { id: ERR_PACK_NOT_WELD_RECORDED, http: 409, condition: "Certify requires pack WELD_RECORDED" }
  - { id: ERR_PACK_NOT_WELD_CERTIFIED, http: 409, condition: "BMS flash requires pack WELD_CERTIFIED" }
  - { id: ERR_PACK_NOT_BMS_FLASHED, http: 409, condition: "Dossier open requires pack BMS_FLASHED or TEST_QUEUED (retest)" }
  - { id: ERR_PACK_NOT_TEST_QUEUED, http: 409, condition: "Submit requires pack TEST_QUEUED" }
  - { id: ERR_PACK_NOT_CLASSIFIED, http: 409, condition: "Approve requires pack CLASSIFIED" }
  - { id: ERR_PACK_NOT_READY_TO_STORE, http: 409, condition: "Storage placement requires pack READY_TO_STORE" }
  - { id: ERR_PACK_ALREADY_STORED, http: 409, condition: "Pack already has an active placement" }
  - { id: ERR_PACK_NOT_STORED, http: 409, condition: "Pick requires logistics_status STORED" }
  - { id: ERR_PACK_NOT_PICKED, http: 409, condition: "Attach requires logistics_status PICKED" }
  - { id: ERR_PACK_ALREADY_ATTACHED, http: 409, condition: "Pack already attached to a non-terminal shipment" }
  - { id: ERR_PACK_NOT_DELIVERED, http: 409, condition: "RMA approve requires pack DELIVERED" }
  - { id: ERR_PACK_UNDER_RECALL, http: 409, condition: "Operation blocked: pack captured by an ACTIVE recall" }
  - { id: ERR_WELD_ALREADY_CERTIFIED, http: 409, condition: "Weld record already certified" }
  - { id: ERR_WELD_PROFILE_MISMATCH, http: 422, condition: "Record profile does not match PackBOM.welding_profile" }
  - { id: ERR_HEAT_DOSE_EXCEEDED, http: 422, condition: "Computed heat dose exceeds profile ceiling" }

  # --- Firmware ---
  - { id: ERR_FIRMWARE_NOT_DRAFT, http: 409, condition: "submit-review requires DRAFT (or DEPRECATED via retest path)" }
  - { id: ERR_FIRMWARE_NOT_PENDING_REVIEW, http: 409, condition: "Approval requires PENDING_REVIEW" }
  - { id: ERR_FIRMWARE_NOT_APPROVED, http: 409, condition: "Flash or deprecate requires APPROVED" }
  - { id: ERR_FIRMWARE_NOT_DEPRECATED, http: 409, condition: "Re-submit review requires DEPRECATED" }
  - { id: ERR_FIRMWARE_IN_USE, http: 409, condition: "Deprecate blocked: firmware referenced by a non-terminal pack" }

  # --- Dossier ---
  - { id: ERR_DOSSIER_ALREADY_OPEN, http: 409, condition: "A non-terminal dossier already exists for this pack" }
  - { id: ERR_DOSSIER_NOT_OPEN, http: 409, condition: "PUT matrix requires dossier OPEN" }
  - { id: ERR_DOSSIER_NOT_TESTS_RECORDED, http: 409, condition: "Submit requires dossier TESTS_RECORDED" }
  - { id: ERR_DOSSIER_NOT_SUBMITTED, http: 409, condition: "Approve requires dossier SUBMITTED" }
  - { id: ERR_DOSSIER_NOT_PASS, http: 409, condition: "Approve requires outcome=PASS" }
  - { id: ERR_INCOMPLETE_TEST_MATRIX, http: 422, condition: "All eight T1..T8 fields must be non-null" }

  # --- Storage ---
  - { id: ERR_PLACEMENT_NOT_STAGED, http: 409, condition: "Store transition requires placement STAGED" }
  - { id: ERR_SOC_BAND_NOT_ACCEPTED, http: 422, condition: "Pack soc_band not in location.accepts_soc_band" }
  - { id: ERR_LOCATION_CAPACITY_EXCEEDED, http: 422, condition: "Placement would exceed location.capacity_wh" }
  - { id: ERR_PROGRAM_CAPACITY_EXCEEDED, http: 422, condition: "Placement would exceed program.storage_capacity_wh" }

  # --- Shipment ---
  - { id: ERR_SHIPMENT_NOT_DRAFT, http: 409, condition: "Operation requires shipment DRAFT" }
  - { id: ERR_SHIPMENT_EMPTY, http: 422, condition: "Tender requires total_pack_count > 0" }
  - { id: ERR_SHIPMENT_NOT_TENDERED, http: 409, condition: "Carrier decision requires TENDERED" }
  - { id: ERR_SHIPMENT_NOT_CARRIER_ACCEPTED, http: 409, condition: "mark-in-transit requires CARRIER_ACCEPTED" }
  - { id: ERR_SHIPMENT_NOT_IN_TRANSIT, http: 409, condition: "mark-delivered requires IN_TRANSIT" }
  - { id: ERR_UN_CLASS_MISMATCH, http: 422, condition: "Pack shipping_classification does not match shipment.un_class_code" }

  # --- RMA ---
  - { id: ERR_RMA_NOT_REQUESTED, http: 409, condition: "Approve/deny requires RMA REQUESTED" }
  - { id: ERR_RMA_NOT_APPROVED, http: 409, condition: "begin-discharge requires APPROVED" }
  - { id: ERR_RMA_NOT_DISCHARGE_PENDING, http: 409, condition: "complete-discharge requires DISCHARGE_PENDING" }
  - { id: ERR_RMA_NOT_DISCHARGED, http: 409, condition: "receive requires DISCHARGED" }
  - { id: ERR_RMA_NOT_RECEIVED, http: 409, condition: "close requires RECEIVED" }
  - { id: ERR_RMA_PACK_MISMATCH, http: 409, condition: "RMA references a different pack than the path" }
  - { id: ERR_TARGET_SOC_TOO_HIGH, http: 422, condition: "target_soc_percent > SAFE_DISCHARGE_MAX_PERCENT (30.0)" }
  - { id: ERR_DISCHARGE_TARGET_NOT_MET, http: 422, condition: "final_soc_percent > target_soc_percent" }

  # --- Recall ---
  - { id: ERR_RECALL_NOT_DRAFT, http: 409, condition: "Activate requires DRAFT" }
  - { id: ERR_RECALL_NOT_ACTIVE, http: 409, condition: "mark-contained requires ACTIVE" }
  - { id: ERR_RECALL_NOT_CONTAINED, http: 409, condition: "close requires CONTAINED" }
  - { id: ERR_RECALL_SCOPE_EMPTY, http: 422, condition: "At least one scope_* selector must be set" }
  - { id: ERR_RECALL_NOT_FULLY_CONTAINED, http: 409, condition: "packs_contained < packs_in_scope" }

  # --- Segregation of duties ---
  - { id: ERR_SOD_WELD_CERTIFY, http: 403, condition: "Certifier must differ from weld operator" }
  - { id: ERR_SOD_FIRMWARE_APPROVE, http: 403, condition: "Approver must differ from firmware submitter" }
  - { id: ERR_SOD_RMA_APPROVE, http: 403, condition: "RMA approver must differ from RMA requester" }

  # --- Referential ---
  - { id: ERR_CROSS_PROGRAM_REFERENCE, http: 422, condition: "Referenced resource belongs to a different program" }

  # --- OCC ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current version" }

# =============================================================================
# Table 1.7 — RBAC Matrix
# =============================================================================
roles:
  - name: AssemblyLead
    description: "Shop-floor lead: defines BOMs, assembles packs, records welds, flashes BMS"
    identity: opaque
    exclusive_operations:
      - "POST /integration-programs/{id}/pack-boms"
      - "POST /integration-programs/{id}/battery-packs"
      - "POST /integration-programs/{id}/battery-packs/{id}/welding-records"
      - "POST /integration-programs/{id}/battery-packs/{id}/bms-flash-records"
      - "POST /integration-programs/{id}/bms-firmwares"
      - "POST /integration-programs/{id}/bms-firmwares/{id}/submit-review"
    shared_operations: []

  - name: QualityEngineer
    description: "Quality owner: receives lots, runs inspections, certifies welds, records test matrices, manages safe discharge"
    identity: opaque
    exclusive_operations:
      - "POST /integration-programs/{id}/cell-lots"
      - "POST /integration-programs/{id}/cell-lots/{id}/quarantine"
      - "POST /integration-programs/{id}/cell-lots/{id}/inspections"
      - "POST /integration-programs/{id}/cell-lots/{id}/retest"
      - "POST /integration-programs/{id}/battery-packs/{id}/welding-records/{id}/certify"
      - "POST /integration-programs/{id}/battery-packs/{id}/safety-test-dossiers"
      - "PUT /integration-programs/{id}/battery-packs/{id}/safety-test-dossiers/{id}"
      - "POST /integration-programs/{id}/return-authorizations/{id}/begin-discharge"
      - "POST /integration-programs/{id}/return-authorizations/{id}/complete-discharge"
    shared_operations: []

  - name: SafetyOfficer
    description: "Safety & compliance officer: program lifecycle, firmware approvals, dossier submit/approve, RMA approve, recall management, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /integration-programs"
      - "POST /integration-programs/{id}/suspend"
      - "POST /integration-programs/{id}/resume"
      - "POST /integration-programs/{id}/close"
      - "POST /integration-programs/{id}/bms-firmwares/{id}/approvals"
      - "POST /integration-programs/{id}/bms-firmwares/{id}/deprecate"
      - "POST /integration-programs/{id}/battery-packs/{id}/safety-test-dossiers/{id}/submit"
      - "POST /integration-programs/{id}/battery-packs/{id}/safety-test-dossiers/{id}/approve"
      - "POST /integration-programs/{id}/return-authorizations/{id}/approve"
      - "POST /integration-programs/{id}/return-authorizations/{id}/deny"
      - "POST /integration-programs/{id}/recall-campaigns"
      - "POST /integration-programs/{id}/recall-campaigns/{id}/activate"
      - "POST /integration-programs/{id}/recall-campaigns/{id}/mark-contained"
      - "POST /integration-programs/{id}/recall-campaigns/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations: []

  - name: LogisticsCoordinator
    description: "Warehouse & transport: storage slots, placements, picks, shipments, tenders"
    identity: opaque
    exclusive_operations:
      - "POST /integration-programs/{id}/storage-locations"
      - "POST /integration-programs/{id}/storage-placements"
      - "POST /integration-programs/{id}/storage-placements/{id}/store"
      - "POST /integration-programs/{id}/storage-placements/{id}/release"
      - "POST /integration-programs/{id}/battery-packs/{id}/pick"
      - "POST /integration-programs/{id}/transport-shipments"
      - "POST /integration-programs/{id}/transport-shipments/{id}/attach"
      - "POST /integration-programs/{id}/transport-shipments/{id}/tender"
    shared_operations: []

  - name: CarrierAgent
    description: "External carrier: accepts/rejects tenders, marks in-transit and delivered"
    identity: opaque
    exclusive_operations:
      - "POST /integration-programs/{id}/transport-shipments/{id}/carrier-accept"
      - "POST /integration-programs/{id}/transport-shipments/{id}/carrier-reject"
      - "POST /integration-programs/{id}/transport-shipments/{id}/mark-in-transit"
      - "POST /integration-programs/{id}/transport-shipments/{id}/mark-delivered"
    shared_operations: []

  - name: CustomerService
    description: "RMA intake and closure"
    identity: opaque
    exclusive_operations:
      - "POST /integration-programs/{id}/return-authorizations"
      - "POST /integration-programs/{id}/return-authorizations/{id}/receive"
      - "POST /integration-programs/{id}/return-authorizations/{id}/close"
    shared_operations: []

  - name: Any
    description: "Shared read-only access across all authenticated roles"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /integration-programs"
      - "GET /integration-programs/{id}"
      - "GET /integration-programs/{id}/cell-lots"
      - "GET /integration-programs/{id}/cell-lots/{id}"
      - "GET /integration-programs/{id}/cell-lots/{id}/inspections"
