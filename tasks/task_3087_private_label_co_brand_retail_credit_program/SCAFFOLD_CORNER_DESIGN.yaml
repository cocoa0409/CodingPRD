              payload: { principal_balance_cents: 190000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Cleats", amount_cents: 10000, transaction_channel: "IN_STORE", promo_requested: false }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { tx_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "GET /servicing/transactions?account_id=${acct_id} returns 1 row"
            - "the account is exactly at its limit (190000 + 10000 == 200000) and the purchase still succeeds"

      - name: credit_limit_exceeded_fires_one_cent_over
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
        distinguishing_aspect: "One cent over the limit is enough to trip ERR_CREDIT_LIMIT_EXCEEDED, distinct from the delinquency-risk scoring which only contributes at strict >."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One account with limit 200000 and 190000 principal."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/balances"
              payload: { principal_balance_cents: 190000, balance_bucket: "PRINCIPAL" }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Charts", amount_cents: 10001, transaction_channel: "DIGITAL", promo_requested: false }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_CREDIT_LIMIT_EXCEEDED"
            - "GET /servicing/transactions?account_id=${acct_id} returns 0 rows"

      - name: promo_below_minimum_charge_violation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors.ERR_PROMO_MINIMUM_CHARGE
          - entities.ProgramAgreement.fields.minimum_charge_cents
        distinguishing_aspect: "A promotional purchase one cent below the agreement minimum_charge_cents 29900 is rejected with ERR_PROMO_MINIMUM_CHARGE while a purchase exactly at the minimum succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement minimum_charge_cents 29900, one account."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
          trigger:
            - call: "POST /servicing/transactions"
              payload: { account_id: "${acct_id}", merchant_name: "Coldgate Pins", amount_cents: 29899, transaction_channel: "IN_STORE", promo_requested: true, promo_term_months: 12 }
              as: Cardholder
              as_user_id: "${acct_id}"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_PROMO_MINIMUM_CHARGE"
            - "a second purchase of exactly 29900 cents with promo_requested true succeeds at 201"
            - "GET /servicing/transactions?account_id=${acct_id} returns 1 row (only the qualifying purchase)"

      - name: prescreened_application_without_reference_violation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=8]
          - errors.ERR_PRESCREEN_REQUIRED
        distinguishing_aspect: "A PRESCREENED-channel application without a prescreen_reference is rejected, while the same application with a reference is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
          trigger:
            - call: "POST /servicing/applications"
              payload: { program_id: "${g_id}", source_channel: "PRESCREENED", requested_credit_limit_cents: 150000 }
              as: Applicant
              as_user_id: "applicant-9911"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_PRESCREEN_REQUIRED"
            - "a follow-up PRESCREENED application carrying prescreen_reference \"PS-2026-0042\" succeeds"
            - "GET /servicing/applications?program_id=${g_id} returns 1 row"

      - name: program_closed_blocks_servicing_violation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=15]
          - errors.ERR_PROGRAM_CLOSED
        excluded_because:
          difficulty_instance: account_transaction_rejected_when_program_closed
          rationale: "Closing the program and asserting ERR_PROGRAM_CLOSED on a purchase is this §1.8 instance's failure path."

      - name: revenue_share_over_one_hundred_percent_violation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=10]
          - errors.ERR_REVENUE_SHARE_INVALID
        distinguishing_aspect: "revenue_share_rate 0.70 plus promo_subsidy_rate 0.40 exceeds 1.0 and is rejected at agreement creation, while 0.60 plus 0.40 exactly equal to 1.0 is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
          trigger:
            - call: "POST /servicing/agreements"
              payload: { partner_id: "${p_id}", revenue_share_rate: 0.70, promo_subsidy_rate: 0.40, promo_term_months: 12 }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_REVENUE_SHARE_INVALID"
            - "a second agreement with revenue_share_rate 0.60 and promo_subsidy_rate 0.40 succeeds"
            - "GET /servicing/agreements?partner_id=${p_id} returns 1 row"

      - name: supersedes_closed_program_violation
        claim_type: Cross-entity Validation
        grounds:
          - validations[priority=11]
          - errors.ERR_SUPERSEDES_INVALID
          - entities.CreditProgram.fields.supersedes_program_id
        distinguishing_aspect: "A new program naming a CLOSED predecessor in supersedes_program_id is rejected, while naming an ACTIVE predecessor is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One partner, ACTIVE agreement and a CLOSED predecessor program."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
            - call: "POST /servicing/accounts/${acct_id}/post-payment"
              payload: { payment_amount_cents: 100 }
              as: Cardholder
              as_user_id: "${acct_id}"
            - call: "POST /servicing/credit-programs/${g_id}/open-renewal"
              payload: { expected_program_version: "${g_v0}", to_status: "WINDING_DOWN" }
              as: ProgramAdmin
              captures: { g_v1: "$.data.version" }
            - call: "POST /servicing/transfer-agreements"
              payload: { program_id: "${g_id}", buyer_role: "RETAILER" }
              as: ProgramAdmin
              captures: { t_id: "$.data.id" }
            - call: "POST /servicing/transfer-agreements/${t_id}/accept"
              payload: { accepted_by_role: "RETAILER" }
              as: ProgramAdmin
            - call: "POST /servicing/transfer-agreements/${t_id}/execute"
              payload: {}
              as: ProgramAdmin
            - call: "POST /servicing/credit-programs/${g_id}/close"
              payload: { expected_program_version: "${g_v1}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /servicing/credit-programs"
              payload: { partner_id: "${p_id}", agreement_id: "${ag_id}", supersedes_program_id: "${g_id}", cycle_day: 16 }
              as: ProgramAdmin
              captures: { error_id: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_SUPERSEDES_INVALID"
            - "GET /servicing/credit-programs?partner_id=${p_id} returns 1 row, the CLOSED predecessor"

      - name: purchase_price_below_floor_violation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=16]
          - errors.ERR_PURCHASE_PRICE_BELOW_FLOOR
          - entities.WindDownTransfer.fields.purchase_price_cents
        distinguishing_aspect: "A proposed price below book value times purchase_right_rate 1.04 is rejected, while the floor itself is accepted — a fiscal boundary on the transfer."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A program in WINDING_DOWN with a settled account so book value is 0."
          setup_api_calls:
