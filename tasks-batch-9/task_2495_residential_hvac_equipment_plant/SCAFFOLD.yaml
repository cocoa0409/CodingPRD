    input: []
    output: BuildOrder
    side_effects: ["state_machines.BuildOrder.RUN_PASSED_to_RELEASED_TO_STOCK; released_to_stock_at stamped", "ProductPlatform.units_built_released, rolling_claim_rate_pct, and warranty_posture recomputed", "increments BuildOrder.version by 1 and ProductPlatform.version by 1"]
  - method: POST
    path: "/plant/build-orders/{id}/cancel"
    description: "Cancels a lot that has not entered fabrication or that is on regulatory hold, releasing its pallet space."
    roles: [ProductionPlanner]
    code: 200
    input: ["reason?"]
    output: BuildOrder
    side_effects: ["state_machines.BuildOrder.DRAFT_to_CANCELLED or HOLD_REGULATORY_to_CANCELLED; ACTIVE reservations of the lot become RELEASED and each touched Warehouse.pallets_reserved_current recomputed", "increments BuildOrder.version by 1, every touched WarehouseReservation.version by 1, and Warehouse.version by 1"]
  - method: GET
    path: "/plant/build-orders/{id}/leak-tests"
    description: "Lists the leak tests recorded against this lot, oldest first."
    roles: [PlantAdmin, QualityTechnician, ProductionTechnician, ProductionPlanner, ReliabilityEngineer]
    code: 200
    input: ["method?", "verdict?"]
    output: LeakTest[]
    side_effects: []
  - method: GET
    path: "/plant/build-orders/{id}/run-tests"
    description: "Lists the run tests recorded against this lot, oldest first."
    roles: [PlantAdmin, QualityTechnician, ProductionTechnician, ProductionPlanner, ReliabilityEngineer]
    code: 200
    input: ["verdict?"]
    output: RunTest[]
    side_effects: []
  - method: GET
    path: "/plant/build-orders/{id}/warehouse-reservations"
    description: "Lists the warehouse reservations held for this lot."
    roles: [PlantAdmin, ProductionPlanner, SupplyPlanner]
    code: 200
    input: ["status?"]
    output: WarehouseReservation[]
    side_effects: []

  # ---- LeakTest ----
  - method: POST
    path: "/plant/leak-tests"
    description: "Records a leak test on a brazed lot by helium mass spectrometry or pressure decay, and advances or fails the lot."
    roles: [QualityTechnician]
    code: 201
    input: ["build_order_id", "method", "measured_leak_rate_g_per_year?", "decay_kpa?", "hold_minutes?"]
    output: LeakTest
    side_effects: ["calculations.leak_test_verdict sets applied_limit and verdict", "the lot transitions BRAZED -> LEAK_PASSED, BRAZED -> REWORK with rework_count += 1, or BRAZED -> SCRAPPED once the rework budget is spent; a scrap releases the lot's ACTIVE reservations and recomputes Warehouse.pallets_reserved_current", "increments BuildOrder.version by 1"]
  - method: GET
    path: "/plant/leak-tests"
    description: "Lists leak tests, filterable by lot, method, and verdict."
    roles: [PlantAdmin, QualityTechnician, ProductionTechnician, ProductionPlanner, ReliabilityEngineer]
    code: 200
    input: ["build_order_id?", "method?", "verdict?", "limit?", "offset?"]
    output: LeakTest[]
    side_effects: []

  # ---- RunTest ----
  - method: POST
    path: "/plant/run-tests"
    description: "Records a run test on a charged lot in a test cell, verifying corrected capacity and efficiency against the platform's ratings."
    roles: [QualityTechnician]
    code: 201
    input: ["build_order_id", "test_cell_id", "window_start_utc", "window_end_utc", "measured_capacity_btuh", "measured_power_w", "measured_ambient_c"]
    output: RunTest
    side_effects: ["calculations.test_cell_window_eligibility rejects a window that violates the cell cooldown", "calculations.run_test_performance_verdict sets corrected_capacity_btuh, capacity_ratio, efficiency_ratio, both applied tolerances, and verdict", "the lot transitions CHARGED -> RUN_PASSED, CHARGED -> REWORK with rework_count += 1 and charge_grams reset to 0, or CHARGED -> SCRAPPED once the rework budget is spent", "increments BuildOrder.version by 1"]
  - method: GET
    path: "/plant/run-tests"
    description: "Lists run tests, filterable by lot, cell, and verdict."
    roles: [PlantAdmin, QualityTechnician, ProductionTechnician, ProductionPlanner, ReliabilityEngineer]
    code: 200
    input: ["build_order_id?", "test_cell_id?", "verdict?", "limit?", "offset?"]
    output: RunTest[]
    side_effects: []

  # ---- WarrantyClaim ----
  - method: POST
    path: "/plant/warranty-claims"
    description: "Files a field warranty claim against a platform, optionally naming the failing component lot, and re-scores the platform's warranty posture."
    roles: [WarrantyAnalyst]
    code: 201
    input: ["platform_id", "failure_code", "claim_cost_cents", "build_order_id?", "component_type?", "supplier_lot_code?"]
    output: WarrantyClaim
    side_effects: ["status = OPEN; filed_by_user_id and filed_at stamped", "calculations.platform_warranty_claim_rate and calculations.platform_warranty_posture recompute ProductPlatform.rolling_claim_rate_pct and warranty_posture", "when the posture reaches CAPA_REQUIRED or DESIGN_CHANGE_REQUIRED and the claim names a matching supplier lot, a SupplierCorrectiveAction is opened per calculations.supply_derate_plan, the cited claims become LINKED_TO_CAPA, the ComponentSupply is DERATED, over-committed RESERVED lines are REVOKED, and the affected distributor orders regress their allocation_status", "increments ProductPlatform.version by 1 and the version of every claim, supply, line, and order the cascade touches"]
  - method: GET
    path: "/plant/warranty-claims"
    description: "Lists warranty claims, filterable by platform, lot, status, and component lot."
    roles: [PlantAdmin, WarrantyAnalyst, ReliabilityEngineer, DesignEngineer]
    code: 200
    input: ["platform_id?", "build_order_id?", "status?", "component_type?", "supplier_lot_code?", "failure_code?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/plant/warranty-claims/{id}"
    description: "Reads one warranty claim."
    roles: [PlantAdmin, WarrantyAnalyst, ReliabilityEngineer, DesignEngineer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  # ---- SupplierCorrectiveAction ----
  - method: GET
    path: "/plant/supplier-corrective-actions"
    description: "Lists supplier corrective actions, filterable by the supply they derate and the claim that triggered them."
    roles: [PlantAdmin, ReliabilityEngineer, SupplyPlanner, WarrantyAnalyst]
    code: 200
    input: ["component_supply_id?", "warranty_claim_id?", "status?", "component_type?", "limit?", "offset?"]
    output: SupplierCorrectiveAction[]
    side_effects: []
  - method: GET
    path: "/plant/supplier-corrective-actions/{id}"
    description: "Reads one supplier corrective action including its derate_pct and cited_claim_count."
    roles: [PlantAdmin, ReliabilityEngineer, SupplyPlanner, WarrantyAnalyst]
    code: 200
    input: []
    output: SupplierCorrectiveAction
    side_effects: []
  - method: POST
    path: "/plant/supplier-corrective-actions/{id}/close"
    description: "Closes a corrective action as effective or ineffective; the closer may not be the analyst who filed the cited claim."
    roles: [ReliabilityEngineer]
    code: 200
    input: ["resolution", "effectiveness_note?"]
    output: SupplierCorrectiveAction
    side_effects: ["state_machines.SupplierCorrectiveAction.OPEN_to_CLOSED_EFFECTIVE restores the supply to ACTIVE with derate_pct = 0 and closes the cited claims, which lowers ProductPlatform.rolling_claim_rate_pct and may relax warranty_posture", "state_machines.SupplierCorrectiveAction.OPEN_to_CLOSED_INEFFECTIVE drives the supply to CLOSED with derate_pct = 100, revokes its RESERVED lines, and leaves the cited claims counted", "increments SupplierCorrectiveAction.version by 1, ComponentSupply.version by 1, and ProductPlatform.version by 1 on the EFFECTIVE branch"]

errors:
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-Role is absent, unrecognized, or not permitted for the endpoint."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "A required field is missing, an enum is out of range, a number is out of domain, a timestamp is malformed, a leak-test payload mixes both measurement styles, a warranty claim names only one half of the component_type / supplier_lot_code pair, a rejection decision omits rejection_reason, or model_code duplicates an existing platform."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "end_date <= start_date on a reservation, or window_end_utc <= window_start_utc on a run test."
  - id: ERR_REFRIGERANT_PROGRAM_NOT_FOUND
    http: 404
    condition: "No RefrigerantProgram exists for the given id."
  - id: ERR_REGIONAL_STANDARD_NOT_FOUND
    http: 404
    condition: "No RegionalStandard exists for the given id, or no ACTIVE standard governs the region being certified."
  - id: ERR_PLATFORM_NOT_FOUND
    http: 404
    condition: "No ProductPlatform exists for the given id, including the supersedes_platform_id reference."
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "No CertificationRecord exists for the given id."
  - id: ERR_COMPONENT_SUPPLY_NOT_FOUND
    http: 404
    condition: "No ComponentSupply exists for the given id."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "No DistributorOrder exists for the given id."
  - id: ERR_BUILD_ORDER_NOT_FOUND
    http: 404
    condition: "No BuildOrder exists for the given id."
  - id: ERR_WAREHOUSE_NOT_FOUND
    http: 404
    condition: "No Warehouse exists for the given id."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "No WarehouseReservation exists for the given id."
  - id: ERR_TEST_CELL_NOT_FOUND
    http: 404
    condition: "No TestCell exists for the given id."
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "No WarrantyClaim exists for the given id."
  - id: ERR_CORRECTIVE_ACTION_NOT_FOUND
    http: 404
    condition: "No SupplierCorrectiveAction exists for the given id."
  - id: ERR_DUPLICATE_CERTIFICATION
    http: 409
    condition: "A CERTIFIED CertificationRecord already exists for the same platform and region."
  - id: ERR_STALE_SUPPLY_VERSION
    http: 412
    condition: "expected_component_supply_version does not match the version of the order's primary compressor supply row."
  - id: ERR_STALE_PLATFORM_VERSION
    http: 412
    condition: "expected_platform_version does not match the stored ProductPlatform.version."
  - id: ERR_INVALID_PLATFORM_STATE
    http: 409
    condition: "The platform is not in a state the requested operation admits."
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "The governing refrigerant program is not in the state the operation requires."
  - id: ERR_CERTIFICATION_STATE_INVALID
    http: 409
    condition: "The certification record is not DRAFT on submit or not SUBMITTED on decide."
  - id: ERR_BUILD_STAGE_INVALID
    http: 409
    condition: "The build lot is not at the stage the requested operation admits."
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "The distributor order's allocation_status or fulfillment_status does not admit the requested operation."
  - id: ERR_RESERVATION_STATE_INVALID
    http: 409
    condition: "The warehouse reservation is not ACTIVE."
  - id: ERR_CORRECTIVE_ACTION_STATE_INVALID
    http: 409
    condition: "The supplier corrective action is not OPEN."
  - id: ERR_RESERVATION_NOT_ALLOWED_FOR_BUILD
    http: 409
    condition: "The referenced lot is not a pre-season lot, or it has passed leak test, closed, or gone on regulatory hold."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID already performed the preceding step of the same workflow."
  - id: ERR_ORDER_NOT_OWNED
    http: 403
    condition: "The acting X-User-ID is not the created_by_user_id of the distributor order being cancelled."
  - id: ERR_MANUFACTURE_WINDOW_CLOSED
    http: 409
    condition: "The logical clock is at or past the program's manufacture_cutoff_utc on a manufacturing operation."
  - id: ERR_MANUFACTURE_CUTOFF_NOT_REACHED
    http: 409
    condition: "Sell-through is entered before the program's manufacture_cutoff_utc."
  - id: ERR_SELL_THROUGH_DEADLINE_NOT_REACHED
    http: 409
    condition: "A program is expired before its sell_through_deadline_utc."
  - id: ERR_SELL_THROUGH_DEADLINE_PASSED
    http: 409
    condition: "Stock is shipped at or after the program's sell_through_deadline_utc."
  - id: ERR_FLAMMABLE_REFRIGERANT_PROHIBITED
    http: 422
    condition: "An A2L platform is certified into a region whose standard prohibits flammable refrigerant."
  - id: ERR_EFFICIENCY_BELOW_REGIONAL_MINIMUM
    http: 422
    condition: "rated_seer2_submitted is below the governing standard's minimum for the platform's efficiency tier."
  - id: ERR_REGION_NOT_CERTIFIED
    http: 409
    condition: "The order's region appears in the platform's blocked_region_codes on allocate or ship."
  - id: ERR_WARRANTY_POSTURE_BLOCKED
    http: 409
    condition: "A build lot is opened against a platform whose warranty_posture is DESIGN_CHANGE_REQUIRED."
  - id: ERR_A2L_SAFETY_LIMIT_UNSET
    http: 422
    condition: "An A2L platform is submitted for engineering review without a max_charge_grams of at least 1."
  - id: ERR_FLAMMABLE_CHARGE_LIMIT_EXCEEDED
    http: 422
    condition: "charge_grams exceeds max_charge_grams on an A2L lot."
  - id: ERR_LEAK_TEST_HOLD_TOO_SHORT
    http: 422
    condition: "A pressure-decay leak test is recorded with hold_minutes below 15."
  - id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    http: 409
    condition: "Day-wise peak pallet occupancy would exceed the warehouse's pallet_capacity."
  - id: ERR_NO_ELIGIBLE_SUPPLY
    http: 409
    condition: "The allocation plan grants fewer than one unit - no kit capacity, or a pro-rata fair share that floors to zero."
  - id: ERR_TEST_CELL_WINDOW_CONFLICT
    http: 409
    condition: "The requested run-test window violates the cell's cooldown buffer against an existing run."
  - id: ERR_NO_WAREHOUSE_RESERVATION
    http: 409
    condition: "A pre-season lot is released to stock with no ACTIVE reservation covering the logical clock's date."
  - id: ERR_PLATFORM_HAS_OPEN_BUILDS
    http: 409
    condition: "A platform is retired while lots remain in fabrication, test, or charge."
  - id: ERR_SHIP_UNITS_EXCEED_ALLOCATION
    http: 422
    condition: "shipped_units does not equal the order's allocated_units."

roles:
  - name: PlantAdmin
    description: "Plant operations owner: registers refrigerant programs, warehouses, and test cells, drives program lifecycle, retires platforms, and sets the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /plant/refrigerant-programs"
      - "POST /plant/refrigerant-programs/{id}/enter-sell-through"
      - "POST /plant/refrigerant-programs/{id}/expire"
      - "POST /plant/product-platforms/{id}/retire"
      - "POST /plant/warehouses"
      - "POST /plant/test-cells"
    shared_operations:
      - "POST /plant/regional-standards"
      - "every GET in the /plant surface"
  - name: DesignEngineer
    description: "Owns the platform design record: creates and edits DRAFT platforms and submits them for engineering review."
    identity: opaque
    exclusive_operations:
      - "POST /plant/product-platforms"
      - "PATCH /plant/product-platforms/{id}"
      - "POST /plant/product-platforms/{id}/submit-engineering-review"
    shared_operations:
      - "GET /plant/product-platforms, GET /plant/product-platforms/{id}, GET /plant/product-platforms/{id}/certification-records, GET /plant/product-platforms/{id}/warranty-claims, GET /plant/product-platforms/{id}/warranty-analysis, GET /plant/warranty-claims, GET /plant/warranty-claims/{id}"
  - name: ReliabilityEngineer
    description: "Independent reviewer: releases or returns platforms under review and closes supplier corrective actions. Never the submitter of the design it judges."
    identity: opaque
    exclusive_operations:
      - "POST /plant/product-platforms/{id}/release"
      - "POST /plant/product-platforms/{id}/return-to-draft"
      - "POST /plant/supplier-corrective-actions/{id}/close"
    shared_operations:
      - "GET /plant/product-platforms and its sub-resources, GET /plant/build-orders and its sub-resources, GET /plant/leak-tests, GET /plant/run-tests, GET /plant/warranty-claims, GET /plant/supplier-corrective-actions, GET /plant/component-supplies"
  - name: CertificationEngineer
    description: "Prepares and submits efficiency-rating filings region by region."
    identity: opaque
    exclusive_operations:
      - "POST /plant/certification-records"
      - "POST /plant/certification-records/{id}/submit"
    shared_operations:
      - "GET /plant/certification-records, GET /plant/certification-records/{id}, GET /plant/product-platforms/{id}/certification-records, GET /plant/regional-standards, GET /plant/product-platforms"
  - name: RegulatoryAuditor
    description: "External-facing regulator role: publishes regional standards and decides submitted filings. Never the submitter of the filing it decides."
    identity: opaque
    exclusive_operations:
      - "POST /plant/certification-records/{id}/decide"
    shared_operations:
      - "POST /plant/regional-standards"
      - "GET /plant/certification-records and its filtered list, GET /plant/regional-standards, GET /plant/product-platforms"
  - name: SupplyPlanner
    description: "Owns component supply and allocation: registers supply months and draws component kits for distributor orders."
    identity: opaque
    exclusive_operations:
      - "POST /plant/component-supplies"
      - "POST /plant/distributor-orders/{id}/allocate"
    shared_operations:
      - "GET /plant/component-supplies and its sub-resources, GET /plant/allocation-lines, GET /plant/distributor-orders and its sub-resources, GET /plant/distributor-orders/{id}/allocation-preview, GET /plant/warehouses and its sub-resources, GET /plant/build-orders"
  - name: ProductionPlanner
    description: "Schedules build lots and pre-season pallet space, releases finished lots to stock, and stages and ships allocated orders."
    identity: opaque
    exclusive_operations:
      - "POST /plant/build-orders"
      - "POST /plant/build-orders/{id}/release-to-stock"
      - "POST /plant/build-orders/{id}/cancel"
      - "POST /plant/warehouse-reservations"
      - "POST /plant/warehouse-reservations/{id}/release"
      - "POST /plant/distributor-orders/{id}/stage"
      - "POST /plant/distributor-orders/{id}/ship"
    shared_operations:
      - "GET /plant/build-orders and its sub-resources, GET /plant/warehouses and its sub-resources, GET /plant/warehouse-reservations/{id}, GET /plant/distributor-orders and its sub-resources, GET /plant/component-supplies, GET /plant/test-cells"
  - name: ProductionTechnician
    description: "Runs the line: coil fabrication, brazing, and refrigerant charging."
    identity: opaque
    exclusive_operations:
      - "POST /plant/build-orders/{id}/start-coil-fab"
      - "POST /plant/build-orders/{id}/complete-brazing"
      - "POST /plant/build-orders/{id}/charge"
    shared_operations:
      - "GET /plant/build-orders, GET /plant/build-orders/{id}, GET /plant/build-orders/{id}/leak-tests, GET /plant/build-orders/{id}/run-tests, GET /plant/leak-tests, GET /plant/run-tests, GET /plant/product-platforms/{id}"
  - name: QualityTechnician
    description: "Records leak tests and run tests. May not run the performance test on a lot whose passing leak test the same person performed."
    identity: opaque
    exclusive_operations:
      - "POST /plant/leak-tests"
      - "POST /plant/run-tests"
    shared_operations:
      - "GET /plant/build-orders, GET /plant/build-orders/{id}, GET /plant/build-orders/{id}/leak-tests, GET /plant/build-orders/{id}/run-tests, GET /plant/leak-tests, GET /plant/run-tests, GET /plant/test-cells, GET /plant/test-cells/{id}/run-tests, GET /plant/product-platforms/{id}"
  - name: DistributorRep
    description: "Places and cancels distributor demand. X-User-ID is an opaque rep identifier stored on the order as created_by_user_id; only that identifier may cancel the order."
    identity: opaque
    exclusive_operations:
      - "POST /plant/distributor-orders"
      - "POST /plant/distributor-orders/{id}/cancel"
    shared_operations:
      - "GET /plant/distributor-orders and its sub-resources, GET /plant/distributor-orders/{id}/allocation-preview, GET /plant/allocation-lines, GET /plant/component-supplies, GET /plant/product-platforms, GET /plant/regional-standards"
  - name: WarrantyAnalyst
    description: "Files field warranty claims and reads the analysis that feeds design and supplier corrective action."
    identity: opaque
    exclusive_operations:
      - "POST /plant/warranty-claims"
    shared_operations:
      - "GET /plant/warranty-claims, GET /plant/warranty-claims/{id}, GET /plant/product-platforms/{id}/warranty-claims, GET /plant/product-platforms/{id}/warranty-analysis, GET /plant/supplier-corrective-actions, GET /plant/supplier-corrective-actions/{id}, GET /plant/component-supplies/{id}/corrective-actions, GET /plant/product-platforms"
