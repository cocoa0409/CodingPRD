  # ==========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Instance (i)  pairs category `state` (priority 12) against `business_fiscal` (50).
  # Instance (ii) pairs category `business_safety` (20) against
  #               `business_referential` (27) — a disjoint category pair.
  # Both instances include the control case that proves the lower-priority rule
  # really would have fired on its own.
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_creation_agreement_state_beats_fiscal_credit_limit
        grounds:
          - validations.priority_12_ERR_AGREEMENT_NOT_ACTIVE
          - validations.priority_50_ERR_CREDIT_LIMIT_EXCEEDED
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - errors.ERR_CREDIT_LIMIT_EXCEEDED
          - entities.Brewer.fields.chargeback_balance_cents
        distinguishing_aspect: |
          Category pair: state (12) versus business_fiscal (50), and the two errors even
          carry different HTTP statuses (409 versus 402), so a wrong ladder is visible in the
          status line alone. One single request violates both rules at once; the DRAFT
          agreement must win. Activating the agreement then re-issuing the identical request
          proves the fiscal rule was genuinely violated the first time and was merely masked.
        test_recipe:
          setup:
            - "Clock parked at 2026-08-01T23:00:00Z."
            - "Brewer with credit_limit_cents 5000 — small enough that a single 2200-cent order breaches it once a chargeback lands."
            - "Pool P1 with replacement_cost_cents 28200 and four kegs; agreement fa1 ACTIVE on P1."
            - "One keg filled (2200 cents billed, still inside the 5000 limit), then an UPHELD NOT_RETURNED_DWELL / REPLACEMENT_COST assessment drives chargeback_balance_cents to 28200."
            - "Pool P2 with four kegs and agreement fa2 left in DRAFT: P2 is at available_pct 100.00 / OPEN so no pool gate can interfere, and fa2 is on a different pool so validation 39 does not block its later activation."
            - "Two analyst user ids for the validation 26 segregation of duties."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
