              payload: { volunteer_id: "${v1}" }
              as: VolunteerCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /refuge/volunteers/${v1}/clear-background"
              payload: {}
              as: VolunteerCoordinator
            - call: "POST /refuge/programs/${prog1}/assignments"
              payload: { volunteer_id: "${v1}" }
              as: VolunteerCoordinator
              captures: { as1: $.data.id, as1_st: $.data.status }
          assert:
            - "assignment with PENDING volunteer -> error_id == ERR_VOLUNTEER_NOT_CLEARED (http 422)"
            - "after clear-background the identical assignment call succeeds with status == ACTIVE (http 201)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: burn_buffer_gap_semantics_against_nesting_window
        grounds:
          - validations[priority=7]
          - errors[ERR_NESTING_BLACKOUT]
        distinguishing_aspect: |
          Interval semantic A (buffered gap): a burn is rejected unless its
          window_end is at least NESTING_BUFFER_DAYS (14) before the nesting
          closure start. Gap 9 days (end 2027-02-20 vs start 2027-03-01) is
          rejected; gap exactly 14 (end 2027-02-15) is ACCEPTED — adjacency
          alone is insufficient under buffer semantics.
        test_recipe:
          setup:
            - "One unit; one NESTING closure 2027-03-01..2027-06-30 (SCHEDULED)."
          setup_api_calls:
            - call: "POST /refuge/management-units"
              payload: { name: "Prairie Unit", habitat_type: "GRASSLAND", acreage: 800 }
              as: RefugeManager
              captures: { u1: $.data.id }
            - call: "POST /refuge/management-units/${u1}/closures"
              payload: { closure_type: "NESTING", scope: "FULL", start_date: "2027-03-01", end_date: "2027-06-30" }
              as: Biologist
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "PRESCRIBED_BURN", window_start: "2027-02-10", window_end: "2027-02-20" }
              as: Biologist
              captures: { err: $.data.error_id }
            - call: "POST /refuge/management-units/${u1}/treatments"
              payload: { treatment_type: "PRESCRIBED_BURN", window_start: "2027-02-01", window_end: "2027-02-15" }
              as: Biologist
              captures: { t_ok: $.data.id, t_st: $.data.status }
          assert:
            - "gap-9 burn -> error_id == ERR_NESTING_BLACKOUT"
            - "gap-14 burn (window_end 2027-02-15 == 2027-03-01 - 14 days) succeeds: status == SCHEDULED (http 201)"
      - name: commercial_permit_aggregate_daily_capacity
        grounds:
          - validations[priority=16]
          - errors[ERR_COMMERCIAL_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantic B (aggregate capacity, not pairwise geometry): up
          to 2 commercial permits may overlap any calendar day on a unit;
          approving a third whose dates push any day to 3 concurrent
          {APPROVED, ACTIVE} permits is rejected even though each pairwise
          overlap was previously allowed.
        test_recipe:
          setup:
            - "One unit; FINAL COMPATIBLE COMMERCIAL_FILMING determination; C1 ACTIVE 2026-10-10..2026-10-12, C2 ACTIVE 2026-10-11..2026-10-13 (assessed 45000 each, paid); C3 UNDER_REVIEW 2026-10-12..2026-10-14."
          setup_api_calls:
