        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / grind_run_state_gate_outranks_trim_insufficiency
          rationale: "The named §1.8 instance sends one payload that violates both rules and then isolates the lower-priority rule on a SCHEDULED run."

      - name: hold_gate_outranks_the_pickup_window_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=20]
          - validations[priority=27]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / pre_order_hold_outranks_closed_pickup_window
          rationale: "The named §1.8 instance violates both rules with one PICK_UP request and then isolates priority 27 after the hold is lifted."

      - name: pre_order_confirmation_inside_the_slot_capacity_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=26]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pickup_slot_capacity_over_closed_intervals
          rationale: "The named §1.8 instance asserts the accepted confirmations either side of the refusal, including the deposit each one pins."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: retail_item_write_then_read_then_scoped_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /meat-ops/retail-items]
          - endpoints[GET /meat-ops/retail-items/{id}]
          - endpoints[GET /meat-ops/departments/{id}/retail-items]
        distinguishing_aspect: "The create response, the single read and the department-scoped listing agree on the same stored row, the listing filter narrows on price_status rather than returning every item, and the paginated envelope reports total_count and has_more from the filtered set instead of the whole table."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config."
            - "RIB01 and CHK01 are created UNPRICED; GRD80 is created and then proposed so it sits at PROPOSED."
          setup_api_calls:
            - call: "POST /meat-ops/departments"
              payload: { name: "Meat 41", store_code: "S041" }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { dept_id: $.data.id }
            - call: "POST /meat-ops/primal-purchases"
              payload: { department_id: "${dept_id}", primal_code: "BEEF_RIBEYE_LIP_ON", product_class: "WHOLE_MUSCLE", country_of_origin: "USA", vendor_name: "Prairie Packing", gross_weight_lb: 100.0, invoice_cost_cents: 84000, freight_cost_cents: 2500, vendor_allowance_cents: 500, receiving_shrink_lb: 1.5, received_at: "2026-08-05T06:00:00Z" }
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "RIB01", subprimal_code: "RIBEYE_STEAK", product_class: "WHOLE_MUSCLE" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { ri1_id: $.data.id, ri1_status: $.data.price_status, ri1_margin: $.data.target_margin_pct }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "CHK01", subprimal_code: "CHUCK_ROAST", product_class: "WHOLE_MUSCLE", target_margin_pct: 0.40 }
              as: StoreAdmin
              as_user_id: "admin-01"
              captures: { ri2_id: $.data.id, ri2_margin: $.data.target_margin_pct }
            - call: "POST /meat-ops/retail-items"
              payload: { department_id: "${dept_id}", item_code: "GRD80", subprimal_code: "GROUND_CHUCK_80", product_class: "GROUND" }
              as: MeatManager
              as_user_id: "mgr-01"
              captures: { grd_id: $.data.id }
            - call: "POST /meat-ops/retail-items/${grd_id}/price-proposals"
              payload: { primal_purchase_id: "${p1_id}" }
              as: PricingAnalyst
              as_user_id: "analyst-01"
            - call: "GET /meat-ops/retail-items/${ri1_id}"
              payload: {}
              as: MeatCutter
              as_user_id: "cutter-01"
              captures: { read_code: $.data.item_code, read_status: $.data.price_status, read_version: $.data.version }
            - call: "GET /meat-ops/departments/${dept_id}/retail-items"
              payload: { price_status: "UNPRICED", limit: 1, offset: 0 }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { page1_total: $.meta.total_count, page1_more: $.meta.has_more, page1_first: "$.data[0].id" }
            - call: "GET /meat-ops/departments/${dept_id}/retail-items"
              payload: { price_status: "UNPRICED", limit: 1, offset: 1 }
              as: PricingAnalyst
              as_user_id: "analyst-01"
              captures: { page2_total: $.meta.total_count, page2_more: $.meta.has_more }
          assert:
            - "${ri1_status} == UNPRICED with provisional_price_per_lb_cents == 0, final_price_per_lb_cents == 0, active_price_per_lb_cents == 0, yield_adjusted_cost_per_lb_cents == 0, country_of_origin_label == PENDING and version == 1"
            - "${ri1_margin} == 0.32 (inherited from the department) while ${ri2_margin} == 0.40 (item override honoured)"
            - "${read_code} == RIB01, ${read_status} == UNPRICED and ${read_version} == 1 — the read reproduces the create response exactly"
            - "${page1_total} == 2 and ${page1_more} == true — GRD80 is excluded because it is PROPOSED, so the count comes from the filtered set"
            - "${page2_total} == 2 and ${page2_more} == false, and the two pages return the two distinct ids ${ri1_id} and ${ri2_id} with no repeat"

      - name: case_plan_publish_action_endpoint_returns_the_mutated_aggregate
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /meat-ops/case-plans/{id}/transitions]
          - state_machines.CasePlan.DRAFT_to_PUBLISHED
        distinguishing_aspect: "The action endpoint answers 200 with the CasePlan itself — not the lines it governs — carrying published_by_user_id, the bumped version and the roll-up totals, while the sibling CasePlanLine rows keep their own PLANNED status because publication fills nothing."
        test_recipe:
          setup:
