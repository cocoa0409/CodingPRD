            - "After first case: active_case_count == 1, status ACTIVE (1 > max_caseload 1 is false)"
            - "After second case: active_case_count == 2 and StaffProfile.${spec}.status == OVERLOADED (link 3: case -> specialist counter -> posture flip)"

      - name: match_confirm_checklist_generation_depth2
        grounds:
