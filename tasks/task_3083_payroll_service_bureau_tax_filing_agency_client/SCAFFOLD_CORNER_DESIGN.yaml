            - "GET /deposits?payroll_run_id=${occ_run} returns exactly 1 row"

      - name: l_wire_missed_creates_lighter_strike
        claim_type: cascading_side_effects
        grounds: ["endpoints.POST_/impounds/{impoundId}/miss-wire", entities.FundingFailureEvent.fields.kind, calculations.client_credit_risk_posture]
        distinguishing_aspect: "A WIRE_NOT_CONFIRMED strike weighs 1 (vs NSF_RETURN's 2): after a HIGH-posture client's wire impound misses, the client's weighted base drops relative to an NSF — with one NSF (2) plus one wire miss (1), base is 3 -> ELEVATED, not HIGH — the contagion weighting is observable in posture."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE with one NSF strike (base 2, ELEVATED). Chain: two NSF failures (weighted base 4 -> HIGH); the third run submits WIRE_REQUIRED and its impound is initiated; miss-wire then adds a WIRE_NOT_CONFIRMED strike (weighted base 5, still HIGH; count 3 -> SUSPENDED)."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-04T00:00:00Z", period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-04T00:00:00Z", gross_pay_cents: 500000, total_tax_cents: 100000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_run1: $.data.id }
            - call: "POST /payroll-runs/${m_run1}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
            - call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { m_clv1: $.data.version }
            - call: "POST /payroll-runs/${m_run1}/initiate-impound"
              payload: { expected_client_version: "${m_clv1}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_imp1: $.data.id }
            - call: "POST /impounds/${m_imp1}/fail"
              payload: {}
              as: BureauTreasury
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-08T00:00:00Z", period_start: "2026-09-05T00:00:00Z", period_end: "2026-09-08T00:00:00Z", gross_pay_cents: 500000, total_tax_cents: 100000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_run2: $.data.id }
            - call: "POST /payroll-runs/${m_run2}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
            - call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { m_clv2: $.data.version }
            - call: "POST /payroll-runs/${m_run2}/initiate-impound"
              payload: { expected_client_version: "${m_clv2}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_imp2: $.data.id }
            - call: "POST /impounds/${m_imp2}/fail"
              payload: {}
              as: BureauTreasury
            - call: "POST /payroll-runs"
              payload: { client_id: "${ck_cl}", pay_date: "2026-09-11T00:00:00Z", period_start: "2026-09-09T00:00:00Z", period_end: "2026-09-11T00:00:00Z", gross_pay_cents: 500000, total_tax_cents: 100000 }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_run3: $.data.id }
            - call: "POST /payroll-runs/${m_run3}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_fm3: $.data.funding_model }
            - call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { m_clv3: $.data.version }
            - call: "POST /payroll-runs/${m_run3}/initiate-impound"
              payload: { expected_client_version: "${m_clv3}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { m_imp3: $.data.id }
          trigger:
            - call: "POST /impounds/${m_imp3}/miss-wire"
              payload: {}
              as: BureauTreasury
          assert:
            - "m_fm3 == WIRE_REQUIRED (client was HIGH after two NSF strikes)"
            - "Impound.${m_imp3}.status == FAILED and PayrollRun.${m_run3}.status == REVERSED"
            - "GET /clients/${ck_cl}/funding-failures returns 3 rows; exactly 1 has kind WIRE_NOT_CONFIRMED"
            - "Client.${ck_cl}.status == SUSPENDED (count reached 3)"
            - "the third CreditAssessment row has trigger FUNDING_FAILURE and new_posture HIGH"

      - name: l_deposit_read_reflects_cascaded_cancellation
        claim_type: derived_field_reconciliation
        grounds: ["endpoints.GET_/deposits/{depositId}", state_machines.PayrollRun.IMPOUNDED_to_REVERSED]
        distinguishing_aspect: "After the run reversal cascade cancels the deposit, a direct GET of the deposit shows CANCELLED — the derived/cascaded state is reconciled on the child row itself, not just on the parent."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run IMPOUNDED with a SCHEDULED deposit; impound then FAILED."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
            - *ck_impound
            - *ck_runv
            - call: "POST /payroll-runs/${ck_run}/deposits"
              payload: { jurisdiction_id: "${cj_fed}", amount_cents: 200000, expected_payroll_run_version: "${ck_runv}" }
              as: BureauTaxFiler
              captures: { rec_dep: $.data.id }
            - call: "POST /impounds/${ck_imp}/fail"
              payload: {}
              as: BureauTreasury
          trigger:
            - call: "GET /deposits/${rec_dep}"
              payload: {}
              as: BureauTaxFiler
              captures: { rec_status: $.data.status }
          assert:
            - "rec_status == CANCELLED (the cascade landed on the deposit row)"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: k_impound_side_effects_visible_in_same_response
        claim_type: immediate_atomicity
        grounds: [complexity_profile.consistency_model, "endpoints.POST_/impounds/{impoundId}/settle"]
        distinguishing_aspect: "The settle response itself carries the settled impound (status SETTLED, settled_at set) and a follow-up GET of the run in the same test step shows SETTLED — no asynchronous lag is permitted by the saga's success path."
        test_recipe:
          setup: ["Clock at default. Client ACTIVE; run IMPOUNDED."]
          setup_api_calls:
            - *ck_jfed
            - *ck_client
            - *ck_onboard
            - *ck_reg_fed
            - *ck_verify
            - *ck_activate
            - *ck_run
            - *ck_submit
            - *ck_clv
            - *ck_impound
          trigger:
            - call: "POST /impounds/${ck_imp}/settle"
              payload: {}
              as: BureauTreasury
              captures: { k_imp_status: $.data.status, k_settled_at: $.data.settled_at }
            - call: "GET /payroll-runs/${ck_run}"
              payload: {}
              as: BureauTreasury
              captures: { k_run_status: $.data.status }
          assert:
            - "k_imp_status == SETTLED and k_settled_at is non-null in the settle response itself"
            - "k_run_status == SETTLED immediately after"

      - name: k_failed_leg_compensates_prior_legs
        claim_type: saga_compensation
        grounds: [complexity_profile.consistency_model, state_machines.Impound.PENDING_to_FAILED]
        distinguishing_aspect: "Excluded: the saga compensation path (fail -> reverse -> cancel deposits) is fully exercised by the §1.8 cascade instance."
        excluded_because:
          difficulty_instance: impound_nsf_cascades_run_reversal_deposit_cancellation_and_strike
          rationale: "The full compensation chain with per-hop assertions lives there."
