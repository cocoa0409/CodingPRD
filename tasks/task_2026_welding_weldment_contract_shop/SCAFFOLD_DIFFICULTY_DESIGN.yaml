              payload: { method: "UT", scheduled_start_utc: "2026-08-03T09:30:00Z", scheduled_end_utc: "2026-08-03T10:30:00Z", vendor_id: "${vendor_id}" }
              as: CWI
              captures: { err: $.data.error_id }
          assert:
            - "Adjacent UT [10:00,11:00) created successfully (half-open semantics: end==start is not a conflict)"
            - "err == 'ERR_NDT_VENDOR_SLOT_CONFLICT' for overlapping [09:30,10:30)"

      - name: fixture_capacity_aggregate_overlap
        grounds:
          - entities.Fixture.fields.capacity_weldments
          - state_machines.Fixture
        distinguishing_aspect: |
          Resource: Fixture. Interval semantics: aggregate capacity (count of
          non-terminal weldments referencing this fixture) with no explicit
          time window — the "interval" is the entire lifecycle of each
          weldment from creation to SHIPPED/CANCELLED. Distinct semantics
          from vendor slot arithmetic: no half-open boundary, just a count.
        test_recipe:
          setup:
            - "Shop + fixture with capacity_weldments=1"
            - "Weldment A already references the fixture and is in OPEN posture (not terminal)"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S16", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "F16", capacity_weldments: 1, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-16", customer_name: "Cust P", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-A", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_a_id: $.data.id }
          trigger:
            # Second weldment on same fixture exceeds capacity
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-B", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_INVALID_REQUEST' OR a capacity-specific error is raised (fixture capacity exceeded)"
            - "Weldment WM-B is not created"

  # -------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: consumable_kg_conservation
        grounds:
          - calculations.exposure_minutes_on_return
          - entities.ConsumableLot.fields.remaining_kg
          - entities.ConsumableIssue.fields.issued_kg
        distinguishing_aspect: |
          Conserved quantity: consumable mass (kg). Forward action: issue X
          kg (remaining_kg -= X). Compensating action: return the issue
          (remaining_kg unchanged on return — only exposure is accrued; the
          consumed kg is only debited at weld-pass time). Invariant: for any
          lot, received_kg = remaining_kg + sum(WeldPass.consumable_used_kg
          for this lot) + sum(ConsumableIssue.issued_kg where status == OPEN).
        test_recipe:
          setup:
            - "Shop + oven + lot with received_kg=50; issue 20 kg to welder; record 3 kg via weld passes"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S17", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/welders"
              payload: { stencil: "W17", full_name: "Welder Seventeen" }
              as: ShopAdmin
              captures: { welder_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-17", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-17" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-17", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_id: $.data.id, wps_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_id}/approve"
              payload: { expected_wps_version: "${wps_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/welder-qualifications"
              payload: { welder_id: "${welder_id}", wps_id: "${wps_id}", process: "SMAW", qualified_at_utc: "2026-08-01T00:00:00Z" }
              as: QCManager
              captures: { qual_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/ovens"
              payload: { oven_code: "OV17", holding_temp_c: 150, capacity_electrodes_kg: 500 }
              as: MaterialController
              captures: { oven_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-lots"
              payload: { lot_number: "L17", filler_spec: "E7018", process: "SMAW", received_kg: 50, oven_id: "${oven_id}" }
              as: MaterialController
              captures: { lot_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues"
              payload: { lot_id: "${lot_id}", oven_id: "${oven_id}", issued_to_welder_id: "${welder_id}", issued_kg: 20 }
              as: MaterialController
              captures: { issue_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures"
              payload: { fixture_code: "F17", capacity_weldments: 4, owner_party: "SHOP" }
              as: ProductionPlanner
              captures: { fixture_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/fixtures/${fixture_id}/reserve"
              payload: {}
              as: ProductionPlanner
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders"
              payload: { po_number: "PO-17", customer_name: "Cust Q", promised_ship_date_utc: "2026-12-01T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/shop-orders/${order_id}/weldments"
              payload: { weldment_serial: "WM-17", fixture_id: "${fixture_id}", drawing_revision: "R1" }
              as: ProductionPlanner
              captures: { wm_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/weldments/${wm_id}/joints"
              payload: { joint_number: "J17", wps_id: "${wps_id}", base_metal_thickness_mm: 10, required_ndt_methods: ["VT"] }
              as: WeldLead
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/start-fabrication"
              payload: { expected_joint_version: "${j_v}" }
              as: WeldLead
            # Forward action: 3 weld passes of 1 kg each
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: false }
              as: Welder
              as_user_id: "${welder_id}"
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: false }
              as: Welder
              as_user_id: "${welder_id}"
            - call: "POST /weld-shop/shops/${shop_id}/joints/${j_id}/weld-passes"
              payload: { welder_id: "${welder_id}", qualification_id: "${qual_id}", consumable_lot_id: "${lot_id}", consumable_used_kg: 1, is_repair: false }
              as: Welder
              as_user_id: "${welder_id}"
          trigger:
            # Compensating action: return remaining issue
            - call: "POST /weld-shop/shops/${shop_id}/consumable-issues/${issue_id}/return"
              payload: {}
              as: MaterialController
            - call: "GET /weld-shop/shops/${shop_id}/consumable-lots/${lot_id}"
              as: Any
              captures: { remaining: $.data.remaining_kg }
          assert:
            - "After issue(20) + 3 passes(1 kg each) + return: lot.remaining_kg == 30 - 3 = 27 (received 50 - issued 20 - consumed 3 = 27; return adds back the 20 that were not consumed)"

      - name: weldment_posture_freeze_unfreeze_conservation
        grounds:
          - state_machines.Weldment.FROZEN_to_OPEN
          - calculations.frozen_threshold
        distinguishing_aspect: |
          Conserved quantity: distortion_count. Forward action: accumulate
          DistortionReports; compensating action: unfreeze the weldment.
          Invariant: unfreeze does NOT reset distortion_count — it only flips
          posture. After unfreeze, distortion_count is unchanged; a new
          NDT_FAILED on the same weldment immediately re-triggers FROZEN if
          distortion_count >= 2 still holds.
        test_recipe:
          setup:
            - "Shop + weldment with two DistortionReports (PENDING, then dispositioned USE_AS_IS) and one Joint in NDT_FAILED; posture = FROZEN"
