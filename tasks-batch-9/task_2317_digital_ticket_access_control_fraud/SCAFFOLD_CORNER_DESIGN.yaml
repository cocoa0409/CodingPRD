          - state_machines.ReconciliationReport
        distinguishing_aspect: |
          reported_attendance 3 against a derived attendance of 1 is a variance_pct of 200.00,
          far outside MAX_VARIANCE_PCT 2.00, so finalization is refused until a non-empty
          override_reason is supplied — the override does not change the figures, it only
          unlocks the transition. Once FINAL, the Event is RECONCILED and a second report is
          refused by the specific priority 17 code, not by the generic event-state rule, since
          priority 13 deliberately admits RECONCILED for this endpoint.
        test_recipe:
          setup:
            - "Event walked DRAFT -> ON_SALE -> DOORS_OPEN -> IN_PROGRESS -> CLOSED with exactly one ADMITTED scan; fire_code_capacity 200."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 150, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_v: $.data.version }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id }
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-ADA" }
              as: Patron
              as_user_id: "${p_ada_id}"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id }
            - call: "GET /tickets/${t_id}/barcode"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { bc: $.data.current_barcode }
            - call: "POST /scan-sessions/${s1_id}/scan-events"
              payload: { presented_barcode: "${bc}", device_fingerprint: "DEV-ADA", direction: "IN", dedupe_key: "R1" }
              as: GateOperator
              as_user_id: "gate-op-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "IN_PROGRESS" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "CLOSED" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_v1: $.data.version, ev_status1: $.data.status }
          trigger:
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 3, expected_event_version: "${ev_v1}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { rr_id: $.data.id, derived: $.data.scan_derived_attendance, vcount: $.data.variance_count, vpct: $.data.variance_pct, breach: $.data.fire_code_breach, rr_status: $.data.status }
            - call: "POST /reconciliation-reports/${rr_id}/finalize"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { e_variance: $.data.error_id }
            - call: "POST /reconciliation-reports/${rr_id}/finalize"
              payload: { override_reason: "Turnstile outage at G1 logged with the fire marshal" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { rr_final: $.data.status, rr_by: $.data.finalized_by_user_id, vpct2: $.data.variance_pct }
            - call: "GET /events/${ev_id}"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_status2: $.data.status, ev_v2: $.data.version }
            - call: "POST /events/${ev_id}/reconciliation-reports"
              payload: { reported_attendance: 1, expected_event_version: "${ev_v2}" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { e_already: $.data.error_id }
          assert:
            - "${ev_status1} == CLOSED and ${rr_status} == DRAFT"
            - "${derived} == 1, ${vcount} == 2 and ${vpct} == 200.00 — round_half_up(2 / 1 * 100, 2)"
            - "${breach} == false — 1 admitted is not above fire_code_capacity 200"
            - "${e_variance} == ERR_ATTENDANCE_VARIANCE_UNRESOLVED with HTTP 409 and the report is still DRAFT"
            - "${rr_final} == FINAL, ${rr_by} == admin-1 and ${vpct2} == 200.00 — the override unlocks the transition without editing the arithmetic"
            - "${ev_status2} == RECONCILED"
            - "${e_already} == ERR_EVENT_ALREADY_RECONCILED with HTTP 409 — a fresh expected_event_version was supplied, so priority 8 passed and priority 17 decided; ERR_EVENT_STATE_FORBIDS_OPERATION must NOT be returned"
            - "GET /reconciliation-reports?event_id=${ev_id} still has total_count == 1"
            - "GET /events/${ev_id}/audit-log-entries?action=RECONCILIATION_FINALIZED has total_count == 1"

      - name: voided_ticket_and_zone_capacity_codes
        claim_type: triggerability
        grounds:
          - errors.ERR_TICKET_VOIDED
          - errors.ERR_ZONE_CAPACITY_FULL
        excluded_because:
          difficulty_instance: voided_ticket_outranks_zone_capacity_full
          rationale: |
            That instance triggers ERR_TICKET_VOIDED with both rules violated and then, in its
            control leg with a clean ticket at a saturated zone, ERR_ZONE_CAPACITY_FULL, so
            both codes are exercised there.

      - name: transfer_window_code
        claim_type: triggerability
        grounds:
          - errors.ERR_EVENT_STATE_FORBIDS_TRANSFER
        excluded_because:
          difficulty_instance: transfer_blocked_by_event_transfer_window_closing_instant
          rationale: "The closing instant is tested one second before and exactly at transfer_window_closes_at, so the code is triggered there."

      - name: gate_not_scanning_code
        claim_type: triggerability
        grounds:
          - errors.ERR_GATE_NOT_SCANNING
        excluded_because:
          difficulty_instance: scan_refused_when_the_gate_of_the_session_is_no_longer_scanning
          rationale: "That instance closes the session, leaving the gate IDLE, and then scans through it, which is the only way to reach priority 11."

      - name: zone_frozen_code
        claim_type: triggerability
        grounds:
          - errors.ERR_ZONE_FROZEN
        excluded_because:
          difficulty_instance: credential_submit_refused_while_the_access_zone_posture_is_frozen
          rationale: "Posture is driven to FROZEN by issuance and the following submit is refused with this code."

      - name: barcode_epoch_code
        claim_type: triggerability
        grounds:
          - errors.ERR_BARCODE_EPOCH_INVALID
        excluded_because:
          difficulty_instance: barcode_epoch_skew_floor_is_inclusive_and_one_epoch_older_is_refused
          rationale: "The instance presents the now-1 epoch (accepted) and the now-2 epoch (refused with this code)."

      - name: device_mismatch_code
        claim_type: triggerability
        grounds:
          - errors.ERR_DEVICE_MISMATCH
        excluded_because:
          difficulty_instance: device_mismatch_denial_cascades_to_listing_suspension_and_lifecycle_revert
          rationale: "A foreign fingerprint against a BOUND ticket raises this code there, together with its full cascade."

      - name: reentry_lockout_code
        claim_type: triggerability
        grounds:
          - errors.ERR_REENTRY_LOCKOUT
        excluded_because:
          difficulty_instance: reentry_lockout_upper_bound_is_inclusive_and_next_second_admits
          rationale: "Re-entry inside the lockout window raises this code at the inclusive bound and is admitted one second later."

      - name: fraud_block_code
        claim_type: triggerability
        grounds:
          - errors.ERR_PATRON_FRAUD_BLOCKED
        excluded_because:
          difficulty_instance: fraud_block_outranks_price_cap_exceeded
          rationale: "The blocked patron's listing attempt raises this code, and its control leg raises ERR_PRICE_CAP_EXCEEDED."

      - name: price_cap_code
        claim_type: triggerability
        grounds:
          - errors.ERR_PRICE_CAP_EXCEEDED
        excluded_because:
          difficulty_instance: resale_ask_price_equal_to_cap_accepted_and_one_cent_over_refused
          rationale: "One cent above the computed cap raises this code there."

      - name: gate_session_overlap_code
        claim_type: triggerability
        grounds:
          - errors.ERR_GATE_SESSION_OVERLAP
        excluded_because:
          difficulty_instance: gate_session_interval_is_half_open_and_an_adjacent_open_is_accepted
          rationale: "A second session on a gate whose session is still OPEN raises this code there."

      - name: transfer_limit_and_recipient_verification_codes
        claim_type: triggerability
        grounds:
          - errors.ERR_TRANSFER_LIMIT_EXCEEDED
          - errors.ERR_RECIPIENT_NOT_VERIFIED
        excluded_because:
          difficulty_instance: transfer_limit_outranks_recipient_not_verified
          rationale: "Both codes are raised there: the limit when both rules are violated, the verification code in the control leg."

      - name: credential_window_capacity_code
        claim_type: triggerability
        grounds:
          - errors.ERR_ZONE_CREDENTIAL_WINDOW_CAPACITY
        excluded_because:
          difficulty_instance: credential_window_capacity_aggregates_only_overlapping_approved_requests
          rationale: "The overlapping approval that breaches credential_capacity raises this code there."

      - name: settlement_pool_code
        claim_type: triggerability
        grounds:
          - errors.ERR_SETTLEMENT_POOL_INSUFFICIENT
        excluded_because:
          difficulty_instance: settlement_pool_plus_patron_credits_is_conserved_by_remediation
          rationale: "The instance exhausts the pool and the following remediation raises this code."

      - name: max_revisions_code
        claim_type: triggerability
        grounds:
          - errors.ERR_MAX_REVISIONS_EXCEEDED
        excluded_because:
          difficulty_instance: credential_request_revision_cycle_caps_at_two_resubmissions
          rationale: "The third resubmission raises this code there, which is exactly the loop-termination claim."
  # ===========================================================================
  # Table 7 — RBAC (6 roles, role_model: segregation_of_duties)
  # The segregation-of-duties row itself is covered by
  # validations.segregation_of_duties_blocks_the_requester_from_approving_the_request.
  # ===========================================================================
  - section: rbac
    instances:
      - name: no_role_may_perform_another_roles_exclusive_operation_and_admin_is_not_a_superuser
        claim_type: exclusive_operation_denial
        grounds:
          - roles
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: |
          Priority 2 runs before body validation and before path existence, so every one of
          these refusals is ERR_FORBIDDEN_ROLE (403) even though the path ids are unknown and
          two of the bodies are incomplete. The load-bearing claim is the last pair: VenueAdmin
          is NOT a hierarchical override — it cannot bind a device or void a ticket, and
          SecurityInvestigator cannot scan — so an implementation that grants VenueAdmin
          everything fails here.
        test_recipe:
          setup:
            - "No domain data is required: the role check precedes existence and body checks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /events"
              payload: { name: "Pirate Event", venue_name: "Nowhere", fire_code_capacity: 10, barcode_anchor_at: "2026-09-12T18:00:00Z", doors_open_at: "2026-09-12T18:00:00Z", event_start_at: "2026-09-12T19:00:00Z", transfer_window_closes_at: "2026-09-12T17:00:00Z" }
              as: Patron
              as_user_id: "00000000-0000-0000-0000-0000000000a1"
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { e2: $.data.error_id }
            - call: "POST /credential-requests/00000000-0000-0000-0000-0000000000c1/approve"
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { e3: $.data.error_id }
            - call: "POST /credential-requests/00000000-0000-0000-0000-0000000000c1/submit"
              as: TicketingApprover
              as_user_id: "appr-1"
              captures: { e4: $.data.error_id }
            - call: "POST /tickets/00000000-0000-0000-0000-0000000000t1/void"
              payload: { reason: "not my job", refund_to_holder: false }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { e5: $.data.error_id }
            - call: "POST /scan-sessions/00000000-0000-0000-0000-0000000000s1/scan-events"
              payload: { presented_barcode: "SEED-1", device_fingerprint: "DEV-X", direction: "IN", dedupe_key: "X1" }
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { e6: $.data.error_id }
            - call: "POST /tickets/00000000-0000-0000-0000-0000000000t1/device-binding"
              payload: { device_fingerprint: "DEV-ADMIN" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { e7: $.data.error_id }
            - call: "POST /tickets/00000000-0000-0000-0000-0000000000t1/void"
              payload: { reason: "admin override attempt", refund_to_holder: false }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { e8: $.data.error_id }
            - call: "POST /reconciliation-reports/00000000-0000-0000-0000-0000000000r1/finalize"
              as: SecurityInvestigator
              as_user_id: "sec-1"
              captures: { e9: $.data.error_id }
          assert:
            - "${e1} through ${e9} are all ERR_FORBIDDEN_ROLE with HTTP 403"
            - "None of them returns 404 or 400 — the role check at priority 2 precedes both the body check at priority 3 and the existence check at priority 4"
            - "${e2} == ERR_FORBIDDEN_ROLE and the logical clock still reads 2026-08-01T00:00:00Z — the refused call had no effect"
            - "${e7} and ${e8} are refusals of VenueAdmin: the role model is peer segregation, not hierarchical override"
            - "GET /events has total_count == 0 — the Patron's create attempt persisted nothing"

      - name: missing_and_unknown_identity_headers_are_rejected_at_priority_one
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - roles
        distinguishing_aspect: |
          Priority 1 is above the role check, so a header problem must surface as
          ERR_UNAUTHENTICATED (401) and never as ERR_FORBIDDEN_ROLE (403): an absent
          X-User-Role, an absent X-User-ID and a role string outside the six declared roles all
          land on 401, including on a read endpoint that every role is allowed to call.
        test_recipe:
          setup:
            - "No domain data is required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /events"
              as: "(no X-User-Role header sent)"
              as_user_id: "admin-1"
              captures: { e_norole: $.data.error_id }
            - call: "GET /events"
              as: VenueAdmin
              as_user_id: "(no X-User-ID header sent)"
              captures: { e_nouser: $.data.error_id }
            - call: "GET /events"
              as: "Concessionaire"
              as_user_id: "conc-1"
              captures: { e_badrole: $.data.error_id }
            - call: "POST /events"
              payload: { name: "Aurora Night", venue_name: "Northgate Arena", fire_code_capacity: 200, barcode_anchor_at: "2026-09-12T18:00:00Z", doors_open_at: "2026-09-12T18:00:00Z", event_start_at: "2026-09-12T19:00:00Z", transfer_window_closes_at: "2026-09-12T17:00:00Z" }
              as: "concessionaire"
              as_user_id: "conc-1"
              captures: { e_case: $.data.error_id }
          assert:
            - "${e_norole}, ${e_nouser} and ${e_badrole} are all ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_case} == ERR_UNAUTHENTICATED with HTTP 401 — role names are matched exactly against the six declared strings, and an unknown role is 401 rather than 403"
            - "GET /events has total_count == 0 when called afterwards with a valid VenueAdmin identity"

      - name: patron_actions_are_scoped_to_the_patrons_own_entitlements
        claim_type: peer_role_isolation
        grounds:
          - validations[priority=7]
          - errors.ERR_NOT_TICKET_HOLDER
          - roles[Patron].identity
        distinguishing_aspect: |
          Patron is entity_backed, so X-User-ID is a Patron id and the ownership check is a
          data check, not a role check: Bob passes priority 2 (he IS a Patron) and is stopped at
          priority 7 for acting on Ada's ticket and on Ada's listing, while Ada's identical
          calls succeed. The same ticket therefore yields 403 for one Patron and 200 for another.
        test_recipe:
          setup:
            - "Event ON_SALE; AccessZone GA1; Ada and Bob verified; Ada holds a PAID ticket and lists it on VERIFIED_PARTNER."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 150, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /patrons"
              payload: { email: "ada@example.com", display_name: "Ada Lovelace" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_ada_id: $.data.id }
            - call: "POST /patrons/${p_ada_id}/verify-identity"
              payload: { document_reference: "DL-ADA-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /patrons"
              payload: { email: "bob@example.com", display_name: "Bob Bell" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { p_bob_id: $.data.id }
            - call: "POST /patrons/${p_bob_id}/verify-identity"
              payload: { document_reference: "DL-BOB-1" }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
            - call: "POST /tickets"
              payload: { event_id: "${ev_id}", access_zone_id: "${z_id}", holder_patron_id: "${p_ada_id}", ticket_type: "PAID", face_value_cents: 12000 }
              as: BoxOfficeAgent
              as_user_id: "boa-1"
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /resale-listings"
              payload: { ticket_id: "${t_id}", ask_price_cents: 12000, marketplace: "VERIFIED_PARTNER", expected_ticket_version: "${t_v}" }
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t_id}/device-binding"
              payload: { device_fingerprint: "DEV-BOB" }
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { e_bind: $.data.error_id }
            - call: "POST /resale-listings/${l_id}/delist"
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { e_delist: $.data.error_id }
            - call: "POST /transfer-requests"
              payload: { ticket_id: "${t_id}", recipient_patron_id: "${p_bob_id}" }
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { e_transfer: $.data.error_id }
            - call: "POST /resale-listings/${l_id}/delist"
              as: Patron
              as_user_id: "${p_ada_id}"
              captures: { l_status: $.data.status }
            - call: "GET /tickets/${t_id}"
              as: Patron
              as_user_id: "${p_bob_id}"
              captures: { read_holder: $.data.holder_patron_id }
          assert:
            - "${e_bind} == ERR_NOT_TICKET_HOLDER with HTTP 403 — Bob is a valid Patron, so priority 2 passes and priority 7 stops him"
            - "${e_delist} == ERR_NOT_TICKET_HOLDER with HTTP 403 and ${e_transfer} == ERR_NOT_TICKET_HOLDER with HTTP 403"
            - "${l_status} == DELISTED — the identical delist call from the holder succeeds, so the refusals were ownership-scoped and not endpoint-wide"
            - "${read_holder} == ${p_ada_id} with HTTP 200 — shared GET reads are not ownership-scoped"
            - "Ticket.${t_id}.bound_device_fingerprint == null and device_binding_status == UNBOUND — the refused bind wrote nothing"

      - name: shared_reads_are_open_to_their_declared_roles_and_closed_to_the_rest
        claim_type: shared_operation_access
        grounds:
          - roles
          - endpoints[GET /tickets/{id}].roles
          - endpoints[GET /events/{id}/audit-log-entries].roles
          - endpoints[GET /patrons].roles
          - endpoints[GET /events/{id}/occupancy].roles
        distinguishing_aspect: |
          Read access is per-endpoint, not per-role-rank: all six roles may read one ticket,
          but the audit trail is restricted to SecurityInvestigator and VenueAdmin, the patron
          LIST is closed to Patron even though the patron DETAIL read is open to it, and the
          occupancy read excludes Patron, BoxOfficeAgent and TicketingApprover.
        test_recipe:
          setup:
