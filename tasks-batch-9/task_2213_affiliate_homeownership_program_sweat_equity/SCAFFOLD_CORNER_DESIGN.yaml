            - "Program read after the approve: subsidy_pool_cents 6000000 with 1950000 committed and 4050000 available, posture OPEN"

      - name: occ_pool_adjustment_rejects_a_spent_version_and_every_write_bumps_it
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subsidy-pool-adjust-stale-program]", errors.ERR_STALE_PROGRAM_VERSION, "endpoints.POST /homeownership/programs/{id}/subsidy-pool-adjustments", entities.AffiliateProgram.fields.subsidy_pool_cents, calculations.subsidy_pool_ledger]
        distinguishing_aspect: "The same guarded endpoint used twice in a row: a TOP_UP spends the version, so replaying it for the REDUCE is refused, and the version observed across four successive accepted writes rises by exactly one each time with no gaps and no double bumps — the increment claim the layer requires, measured on the aggregate that carries the most guarded writes."
        test_recipe:
          setup:
            - "Canonical program at version 1 with a 5000000 pool, no households, no applications and therefore zero committed and zero disbursed subsidy."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id, pv_0: $.data.version } }
          trigger:
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "TOP_UP", delta_cents: 1000000, expected_program_version: "${pv_0}", memo: "Donor gift one" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { pv_1: $.data.version } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "REDUCE", delta_cents: 500000, expected_program_version: "${pv_0}", memo: "Replaying the version already spent by the top up" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { occ_err: $.data.error_id } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "REDUCE", delta_cents: 500000, expected_program_version: "${pv_1}", memo: "Reallocating to the repair program" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { pv_2: $.data.version } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "SUSPEND_PROGRAM", expected_program_version: "${pv_2}", memo: "Board pause pending audit" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { pv_3: $.data.version } }
            - { call: "POST /homeownership/programs/${prog_id}/subsidy-pool-adjustments", payload: { action: "RESUME_PROGRAM", expected_program_version: "${pv_3}", memo: "Audit cleared, program resumed" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { pv_4: $.data.version } }
            - { call: "GET /homeownership/programs/${prog_id}", as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "TOP_UP: HTTP 200, subsidy_pool_cents == 6000000 and ${pv_1} == ${pv_0} + 1"
            - "REDUCE replaying ${pv_0}: HTTP 412 and ${occ_err} == ERR_STALE_PROGRAM_VERSION, the id concurrency_rules[subsidy-pool-adjust-stale-program] declares; the pool is still 6000000, so the refused write applied no part of its delta"
            - "REDUCE on ${pv_1}: HTTP 200 with subsidy_pool_cents == 5500000 — 500000 off a pool with zero obligations stays above the committed floor"
            - "SUSPEND_PROGRAM then RESUME_PROGRAM: HTTP 200 each, status SUSPENDED with program_posture FROZEN then status ACTIVE with program_posture OPEN, and ${pv_2} == ${pv_1} + 1, ${pv_3} == ${pv_2} + 1 and ${pv_4} == ${pv_3} + 1"
            - "Final read: version == ${pv_4} == ${pv_0} + 4 across four accepted writes and one refusal, subsidy_pool_cents 5500000, subsidy_committed_cents 0, subsidy_disbursed_cents 0, subsidy_available_cents 5500000 and program_posture OPEN"

      - name: cascading_side_effects_chain_from_site_to_shift_to_seat_to_ledger
        claim_type: cascading_side_effects
        grounds: ["state_machines.BuildSite.readiness_status.READY_TO_BUILD_to_SAFETY_HOLD", "state_machines.ConstructionShift.status.SCHEDULED_to_CANCELLED", "state_machines.ShiftAssignment.status.RESERVED_to_CANCELLED", entities.ApplicantHousehold.fields.sweat_equity_credited_hours]
        excluded_because:
          difficulty_instance: safety_hold_cascade_shifts_to_assignments_to_volunteer_hours
          rationale: "That difficulty instance already walks the full four-level chain end-to-end, checks the ordering sensitivity of the cascade and confirms terminal children are left untouched, which is the whole of what this layer's row asks for."

      - name: dual_variant_calculation_produces_two_results_and_a_correct_switch_delta
        claim_type: dual_variant_calculation
        grounds: [calculations.household_selection_scoring, calculations.development_cost_basis, entities.ApplicantHousehold.fields.composite_selection_score]
        excluded_because:
          difficulty_instance: selection_scoring_preliminary_vs_final_income_basis
          rationale: "That difficulty instance drives both variants of the scoring rule on one household and asserts the exact delta the provisional-to-final switch writes to the composite, which is precisely the divergence-plus-reconciliation pair this row calls for; the cost-basis rule's variants are covered the same way by development_cost_cash_basis_vs_full_fmv_basis."

  # ===========================================================================
  # SECTION 9 — From Consistency Model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: a_credit_is_visible_in_its_own_response_and_in_the_very_next_read
        claim_type: immediate
        grounds: [entities.ApplicantHousehold.fields.sweat_equity_credited_hours, entities.ApplicantHousehold.fields.sweat_equity_satisfied, "state_machines.SweatEquityEntry.status.VERIFIED_to_CREDITED", calculations.sweat_equity_ledger_invariant]
        distinguishing_aspect: "Under an immediate model no derived field may lag: the credit response itself already reports the new entry state, and the household read issued immediately afterwards - with no clock advance and no other write in between - already shows the parent ledger and the satisfied flag moved. Two credits in a row are each visible to the read that follows them, so the second credit sees the first."
        test_recipe:
          setup:
            - "Canonical program with a SELECTED household whose adult APPLICANT holds two VERIFIED CONSTRUCTION entries dated 2026-08-01, of 6 and 8 hours, both awaiting credit. The household requires 12.0 hours and its ledger is at 0.0."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "File verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Committee minutes 2026-08-01: household selected for partnership" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", member_id: "${mem_id}", category: "CONSTRUCTION", work_date: "2026-08-01T00:00:00.000Z", hours_claimed: 6 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { se_1: $.data.id } }
            - { call: "POST /homeownership/sweat-equity-entries/${se_1}/verification", payload: { decision: "VERIFIED" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", member_id: "${mem_id}", category: "CONSTRUCTION", work_date: "2026-08-01T00:00:00.000Z", hours_claimed: 8 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { se_2: $.data.id } }
            - { call: "POST /homeownership/sweat-equity-entries/${se_2}/verification", payload: { decision: "VERIFIED" }, as: ConstructionManager, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /homeownership/sweat-equity-entries/${se_1}/credit", payload: {}, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/sweat-equity-entries/${se_2}/credit", payload: {}, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "GET /homeownership/sweat-equity-entries", payload: { household_id: "${hh_id}", status: "CREDITED" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
          assert:
            - "First credit response: HTTP 200 with status == CREDITED and hours_credited == 6.0 in the response body itself, not in a later read"
            - "Household read immediately after, with no clock advance and no intervening write: sweat_equity_credited_hours == 6.0 and sweat_equity_satisfied == false"
            - "Second credit response: status == CREDITED and hours_credited == 8.0"
            - "Household read immediately after that: sweat_equity_credited_hours == 14.0 and sweat_equity_satisfied == true — the 12.0 requirement was crossed by the write that just returned"
            - "Credited entry list: total_count == 2 and the summed hours_credited across the two rows equals the household's 14.0, with no reconciliation step in between"

      - name: an_approval_and_the_program_ledger_agree_in_the_same_breath
        claim_type: immediate
        grounds: [calculations.subsidy_pool_ledger, "state_machines.MortgageApplication.status.UNDERWRITING_to_APPROVED", entities.AffiliateProgram.fields.subsidy_committed_cents, entities.MortgageApplication.fields.silent_second_amount_cents]
        distinguishing_aspect: "The approve response and the parent program's derived ledger must not disagree for even one request: the moment approve returns 1950000 as the silent second, the program read that follows already reports the same 1950000 as committed and 3050000 as available, and a deny in the opposite direction is reflected just as immediately."
        test_recipe:
          setup:
            - "Canonical program with a 5000000 pool, a SELECTED household on 3000000 verified income, a READY_TO_BUILD site appraised at 15000000, and an application structured by officer-1 in UNDERWRITING with a 1950000 silent second. Committed and disbursed are both 0."
