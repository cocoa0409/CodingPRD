          assert:
            - "error_id == ERR_ITEM_NOT_SALVAGEABLE (triage PENDING blocks placement before any capacity/climate evaluation matters)"
            - "GET /api/items/${item}/placements returns empty array (no placement created)"
      - name: packback_confirm_blocked_by_open_claim
        grounds:
