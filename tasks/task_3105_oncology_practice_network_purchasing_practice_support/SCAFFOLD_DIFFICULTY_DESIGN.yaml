          assert:
            - "the zero-supply allocation returns 409 with error_id == ERR_THRESHOLD_NOT_MET"
            - "the same call with supply 100 but no AFFILIATED practice returns 409 with error_id == ERR_NO_ELIGIBLE_PRACTICES"
            - "after affiliating exactly one practice with baseline 0, the allocation returns 409 with ERR_NO_ELIGIBLE_PRACTICES is NOT returned; instead the single grant carries allocated_units 0 and DrugShortage.unallocated_units == 100"

