# =============================================================================
# §1.9 Scaffold Corner Design — Retail Loss Prevention & Shrink Case Management
# Breadth coverage of every testable claim in §1.1–§1.7 not already covered by
# §1.8. Sections follow references/claim-extraction-guide.md.
# Actor ids: ana-1/ana-2 (LPAnalyst), mgr-1/mgr-2 (LPManager), hr-1 (HRPartner),
# adm-1 (LPAdmin), feed-1 (PosFeed), aud-1 (Auditor).
# Clock default 2026-08-01T00:00:00Z unless set.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: store_create_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Store, "endpoints[POST /stores]"]
        distinguishing_aspect: "POST /stores returns 201 with status ACTIVE, computed totals 0, server-minted id (UUID, no prefix), created_at/updated_at, version 1; client cannot set computed fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_number: "S001", name: "Flagship", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s: $.data.id, st: $.data.status, v: $.data.version }
          assert:
            - "HTTP 201; st == ACTIVE; v == 1"
            - "Store.${s}.total_adjudicated_loss_cents == 0 and restitution_collected_cents == 0"
            - "Store.${s}.created_at == 2026-08-01T00:00:00.000Z  # logical clock default with 3 fractional digits"

      - name: store_duplicate_number_returns_409
        claim_type: type_constraint
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_STORE_NUMBER]"]
        distinguishing_aspect: "Second store reusing store_number is rejected ERR_DUPLICATE_STORE_NUMBER (409); first store unaffected."
        test_recipe:
          setup: ["Store S001 exists"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S001", name: "Flagship", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
          trigger:
            - call: "POST /stores"
              payload: { store_number: "S001", name: "Duplicate", region_code: "R2" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_STORE_NUMBER (HTTP 409)"

      - name: store_get_missing_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=5]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /stores/{random-uuid} yields ERR_NOT_FOUND with HTTP 404 and error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (HTTP 404)"

      - name: employee_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /employees without full_name yields ERR_INVALID_REQUEST (400) before any existence or state check."
        test_recipe:
          setup: ["Store S1 ACTIVE"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S010", name: "Store Ten", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /employees"
              payload: { store_id: "${s1}", employee_ref: "E-010" }
              as: HRPartner
              as_user_id: hr-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"

      - name: employee_duplicate_ref_rejected
        claim_type: type_constraint
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_EMPLOYEE_REF]"]
        distinguishing_aspect: "employee_ref uniqueness is enterprise-wide: same ref at a different store still yields ERR_DUPLICATE_EMPLOYEE_REF."
        test_recipe:
          setup: ["Stores S1, S2; employee E-100 at S1"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S011", name: "Store 11", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "S012", name: "Store 12", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s2: $.data.id }
            - call: "POST /employees"
              payload: { store_id: "${s1}", employee_ref: "E-100", full_name: "Original" }
              as: HRPartner
              as_user_id: hr-1
          trigger:
            - call: "POST /employees"
              payload: { store_id: "${s2}", employee_ref: "E-100", full_name: "Duplicate" }
              as: HRPartner
              as_user_id: hr-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_EMPLOYEE_REF (HTTP 409)"

      - name: event_invalid_exception_type_returns_invalid_request
        claim_type: type_constraint
        grounds: ["validations[priority=4]", entities.PosExceptionEvent.fields.exception_type]
        distinguishing_aspect: "exception_type outside the seven-member enum is rejected ERR_INVALID_REQUEST before aggregation runs; no alert is created."
        test_recipe:
          setup: ["Store S1 ACTIVE"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S020", name: "Store 20", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "BOGUS_TYPE", amount_cents: 5000, occurred_at: "2026-07-10T10:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
              captures: { err: $.data.error_id }
            - call: "GET /alerts?store_id=${s1}"
              as: LPAnalyst
              as_user_id: ana-1
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "GET /alerts?store_id=${s1} returns 0 items (total_count == 0)"

      - name: event_zero_amount_returns_invalid_request
        claim_type: type_constraint
        grounds: ["validations[priority=4]", entities.PosExceptionEvent.fields.amount_cents]
        distinguishing_aspect: "amount_cents == 0 violates the > 0 constraint -> ERR_INVALID_REQUEST; boundary: smallest legal value 1 is accepted."
        test_recipe:
          setup: ["Store S1 ACTIVE"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S021", name: "Store 21", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T0", exception_type: "NO_SALE_DRAWER", amount_cents: 0, occurred_at: "2026-07-10T10:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
              captures: { err: $.data.error_id }
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "NO_SALE_DRAWER", amount_cents: 1, occurred_at: "2026-07-10T10:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
              captures: { ev1: $.data.id }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)"
            - "second call 201: PosExceptionEvent.${ev1}.status == UNAGGREGATED  # score 6.0 < 40.00, no alert"

      - name: custody_event_append_only_no_version_field
        claim_type: immutability
        grounds: [entities.CustodyEvent]
        distinguishing_aspect: "CustodyEvent has common_fields: false — response carries id and created_at but no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["Store S1; EXTERNAL case assigned with evidence EV"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S022", name: "Store 22", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 5000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
            - call: "POST /evidence-items"
              payload: { case_id: "${cx}", evidence_type: "PHOTO", captured_at: "2026-07-15T10:00:00Z", retention_class: "STANDARD" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /evidence-items/${ev}/custody-events"
              payload: { action: "COLLECTED" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { ce: $.data.id }
          assert:
            - "HTTP 201; CustodyEvent.${ce} response has id and created_at"
            - "CustodyEvent.${ce} response has no version and no updated_at field"
            - "CustodyEvent.${ce}.actor_id == ana-1  # stamped from X-User-ID, not from input"

      - name: alert_computed_fields_populated_on_create
        claim_type: computed_fields
        grounds: [entities.Alert.fields.score, calculations.alert_score]
        distinguishing_aspect: "Alert created by aggregation exposes computed score (56.0), event_count (2), total_amount_cents (75000), window bounds, and subject_type derived from employee presence — client input cannot set them."
        test_recipe:
          setup: ["Store S1; employee E1"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S023", name: "Store 23", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /employees"
              payload: { store_id: "${s1}", employee_ref: "E-230", full_name: "Emp 230" }
              as: HRPartner
              as_user_id: hr-1
              captures: { e1: $.data.id }
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "HIGH_VALUE_VOID", amount_cents: 40000, occurred_at: "2026-07-12T10:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T2", exception_type: "HIGH_VALUE_VOID", amount_cents: 35000, occurred_at: "2026-07-12T12:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
          trigger:
            - call: "GET /alerts?store_id=${s1}&employee_id=${e1}"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { a: "$.data[0].id", sc: "$.data[0].score", ec: "$.data[0].event_count", ta: "$.data[0].total_amount_cents", subj: "$.data[0].subject_type" }
          assert:
            - "sc == 56.0 and ec == 2 and ta == 75000"
            - "subj == EMPLOYEE"
            - "Alert.${a}.window_start == 2026-07-12T10:00:00Z and window_end == 2026-07-12T12:00:00Z"

      - name: case_create_client_supplied_status_returns_invalid_request
        claim_type: system_fields
        grounds: [entities.Case.fields.status, "validations[priority=4]"]
        distinguishing_aspect: "status is source:system — a create body carrying status is rejected ERR_INVALID_REQUEST; the created case always starts OPEN."
        test_recipe:
          setup: ["Store S1"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S024", name: "Store 24", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 1000, status: "CLOSED_SUBSTANTIATED" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (HTTP 400)  # unknown/system field in body"

      - name: interview_end_not_after_start_returns_invalid_request
        claim_type: type_constraint
        grounds: ["validations[priority=4]", entities.Interview.fields.scheduled_end]
        distinguishing_aspect: "scheduled_end == scheduled_start is rejected (strictly-after rule); the smallest legal window (1 second) is accepted."
        test_recipe:
          setup: ["Store S1; EXTERNAL case INVESTIGATING (assigned ana-1)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S025", name: "Store 25", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 1000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
            - call: "POST /interviews"
              payload: { case_id: "${cx}", interviewer_id: "ana-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T10:00:01Z" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { iv: $.data.id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "second call 201: Interview.${iv}.status == SCHEDULED"

      - name: period_book_inventory_zero_returns_invalid_request
        claim_type: type_constraint
        grounds: ["validations[priority=4]", entities.ShrinkPeriod.fields.book_inventory_cents]
        distinguishing_aspect: "book_inventory_cents must be > 0 (division base for variance_pct); 0 is rejected ERR_INVALID_REQUEST, 1 accepted."
        test_recipe:
          setup: ["Store S1"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S026", name: "Store 26", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /shrink-periods"
              payload: { store_id: "${s1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T23:59:59Z", book_inventory_cents: 0, period_sales_cents: 100 }
              as: LPAdmin
              as_user_id: adm-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: alert_dismiss_open_by_analyst_releases_events
        claim_type: side_effect_execution
        grounds: [state_machines.Alert.OPEN_to_DISMISSED]
        distinguishing_aspect: "Dismissing an OPEN alert as LPAnalyst succeeds and every member PosExceptionEvent reverts to UNAGGREGATED (released for future re-aggregation)."
        test_recipe:
          setup:
            - "Store S1; employee E1 with events T1/T2 HIGH_VALUE_VOID 40000+35000 -> alert A1 OPEN (score 56.0, 2 members AGGREGATED)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S030", name: "Store 30", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /employees"
              payload: { store_id: "${s1}", employee_ref: "E-300", full_name: "Emp 300" }
              as: HRPartner
              as_user_id: hr-1
              captures: { e1: $.data.id }
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "HIGH_VALUE_VOID", amount_cents: 40000, occurred_at: "2026-07-12T10:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T2", exception_type: "HIGH_VALUE_VOID", amount_cents: 35000, occurred_at: "2026-07-12T11:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "GET /alerts?store_id=${s1}&employee_id=${e1}"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { a1: "$.data[0].id" }
          trigger:
            - call: "POST /alerts/${a1}/dismiss"
              payload: { reason: "Investigated; legitimate voids" }
              as: LPAnalyst
              as_user_id: ana-1
            - call: "GET /exception-events?store_id=${s1}&status=UNAGGREGATED"
              as: LPAnalyst
              as_user_id: ana-1
          assert:
            - "Alert.${a1}.status == DISMISSED and dismiss_reason recorded"
            - "GET /exception-events?store_id=${s1}&status=UNAGGREGATED total_count == 2  # members released"

      - name: alert_dismiss_escalated_by_analyst_forbidden
        claim_type: precondition_enforcement
        grounds: [state_machines.Alert.ESCALATED_to_DISMISSED, "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "Role gating flips with target state: the same dismiss call an LPAnalyst may make on an OPEN alert is ERR_FORBIDDEN_FOR_ROLE once the alert is ESCALATED (LPManager-only); the manager then succeeds."
        test_recipe:
          setup:
            - "Store S1; employee E1; alert A1 ESCALATED (score 76.0 via REFUND_NO_RECEIPT 5000, HIGH_VALUE_VOID 5000, SWEETHEART_SCAN 20000, HIGH_VALUE_VOID 4000, PRICE_OVERRIDE 2000: 15+21+24+14+8 = 82 -> wait recompute; see pinned literals)"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S031", name: "Store 31", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /employees"
              payload: { store_id: "${s1}", employee_ref: "E-310", full_name: "Emp 310" }
              as: HRPartner
              as_user_id: hr-1
              captures: { e1: $.data.id }
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "HIGH_VALUE_VOID", amount_cents: 25000, occurred_at: "2026-07-12T10:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T2", exception_type: "SWEETHEART_SCAN", amount_cents: 30000, occurred_at: "2026-07-12T11:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T3", exception_type: "SWEETHEART_SCAN", amount_cents: 30000, occurred_at: "2026-07-12T12:00:00Z", employee_id: "${e1}" }
              as: PosFeed
              as_user_id: feed-1
            - call: "GET /alerts?store_id=${s1}&employee_id=${e1}"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { a1: "$.data[0].id", sc: "$.data[0].score" }
          trigger:
            - call: "POST /alerts/${a1}/dismiss"
              payload: { reason: "Analyst attempt" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
            - call: "POST /alerts/${a1}/dismiss"
              payload: { reason: "Manager override dismissal" }
              as: LPManager
              as_user_id: mgr-1
          assert:
            - "sc == 76.0  # 28 + 24 + 24, ESCALATED at third event (>= 75.00)"
            - "err == ERR_FORBIDDEN_FOR_ROLE (HTTP 403)  # analyst cannot dismiss ESCALATED"
            - "after manager dismiss: Alert.${a1}.status == DISMISSED"

      - name: alert_convert_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Alert.OPEN_to_CONVERTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Idempotency/lockdown: converting an already-CONVERTED alert fails ERR_INVALID_STATE_TRANSITION and creates no second case."
        test_recipe:
          setup:
            - "Store S1; unattributed alert A1 (events HIGH_VALUE_VOID 40000 + 35000) CONVERTED to case C1"
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S032", name: "Store 32", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T1", exception_type: "HIGH_VALUE_VOID", amount_cents: 40000, occurred_at: "2026-07-12T10:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
            - call: "POST /exception-events"
              payload: { store_id: "${s1}", register_ref: "R1", txn_ref: "T2", exception_type: "HIGH_VALUE_VOID", amount_cents: 35000, occurred_at: "2026-07-12T11:00:00Z" }
              as: PosFeed
              as_user_id: feed-1
            - call: "GET /alerts?store_id=${s1}"
              as: LPAnalyst
              as_user_id: ana-1
              captures: { a1: "$.data[0].id" }
            - call: "POST /alerts/${a1}/convert"
              payload: { subject_type: "EXTERNAL" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /alerts/${a1}/convert"
              payload: { subject_type: "EXTERNAL" }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { err: $.data.error_id }
            - call: "GET /cases?store_id=${s1}"
              as: LPAnalyst
              as_user_id: ana-1
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (HTTP 409)"
            - "GET /cases?store_id=${s1} total_count == 1  # no duplicate case"

      - name: case_assign_from_investigating_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Case.OPEN_to_INVESTIGATING]
        distinguishing_aspect: "assign is only defined from OPEN; calling it on an INVESTIGATING case (re-assignment) is ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Store S1; EXTERNAL case assigned to ana-1 (INVESTIGATING)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_number: "S033", name: "Store 33", region_code: "R1" }
              as: LPAdmin
              as_user_id: adm-1
              captures: { s1: $.data.id }
            - call: "POST /cases"
              payload: { store_id: "${s1}", subject_type: "EXTERNAL", manual_loss_cents: 1000 }
              as: LPAnalyst
              as_user_id: ana-1
              captures: { cx: $.data.id }
            - call: "POST /cases/${cx}/assign"
              payload: { analyst_id: "ana-1" }
              as: LPManager
              as_user_id: mgr-1
          trigger:
            - call: "POST /cases/${cx}/assign"
