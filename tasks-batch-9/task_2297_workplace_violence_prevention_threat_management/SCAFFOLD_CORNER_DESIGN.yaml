      - name: training_compliance_pct_is_one_hundred_when_no_pairs_exist
        claim_type: aggregation
        grounds:
          - calculations.plan_compliance_metrics
          - entities.PreventionPlan.fields.training_compliance_pct
          - entities.TrainingModule.fields.job_function_scope
          - calculations.inspection_readiness_score
          - endpoints[POST /prevention-plans]
          - endpoints[POST /employees]
        distinguishing_aspect: |
          The (employee, module) pair set is empty while the only module is scoped to ADMIN and the only
          employee is SECURITY, so training_compliance_pct is 100.00 by the vacuous branch rather than by
          any completion; registering one ADMIN employee creates the first pair and the very same metric
          collapses to 0.00, moving readiness_subtotal from 55.00 to 30.00.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-08-01T00:00:00Z."
            - "Worksite \"North Plant\" (employee_count 20) with one WorkArea \"Front Desk\"."
            - "Exactly one Employee exists, \"Sofia Ortiz\" with job_function SECURITY, backing the SafetyOfficer role."
            - "One TrainingModule WVP-ADMIN with job_function_scope [\"ADMIN\"], so no (employee, module) pair exists at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /worksites"
              payload: { name: "North Plant", state_code: "CA", employee_count: 20 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id }
            - call: "POST /work-areas"
