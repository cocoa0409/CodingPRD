            - "trigger 2: HTTP status == 422 and error_id == 'ERR_INTERPRETER_SOURCE_MISMATCH' — a CONTRACT session with the field SUPPLIED; the same id from the opposite direction, and the language mismatch of ${dov_id} is NOT what is reported because the source check runs first"
            - "trigger 3: HTTP status == 422 and error_id == 'ERR_INTERPRETER_LANGUAGE_MISMATCH' — the source shape is now legal, so the languages array of ${dov_id} is finally examined and does not contain 'es'"
            - "trigger 4: HTTP status == 422 and error_id == 'ERR_VALIDATION' — scheduled_end_utc equal to scheduled_start_utc is rejected, so a zero-length window is not a legal session"
            - "trigger 5: HTTP status == 201 with status == 'SCHEDULED', actual_minutes == null, billed_minutes == null and billable_cents == 0 — a STAFF session accrues no money at creation"
            - "after all five triggers: GET /interpretation-sessions?matter_id=${matter_id} returns exactly 1 row — the four rejections created nothing"

      - name: err_declaration_not_certified_then_err_counseling_language_unverified_on_informed_decision
        claim_type: Error triggerable
        grounds:
          - errors[ERR_DECLARATION_NOT_CERTIFIED]
          - errors[ERR_COUNSELING_LANGUAGE_UNVERIFIED]
          - endpoints[POST /informed-decisions]
          - state_machines.Declaration
        distinguishing_aspect: "Two gates on one endpoint, and each is only reachable once the previous one is satisfied. A matter whose declaration is merely IN_REVIEW is treated exactly like one with no declaration at all — ERR_DECLARATION_NOT_CERTIFIED (409). Once CERTIFIED, counselling in a language other than the client's preferred_language_code needs a COMPLETED session of THIS matter in the CLIENT's language, so supplying a session in the counselling language rather than the client's language is still ERR_COUNSELING_LANGUAGE_UNVERIFIED (422), and the same call with no readback_session_id at all fails identically."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives a STAFFED U_VISA matter for Rosa Mena (preferred_language_code 'es', interpreter_required true) with Ada Ortiz as ACTIVE LEAD and Ben Cole as ACTIVE CO_COUNSEL."
            - "A Spanish declaration is drafted by Ada and moved to IN_REVIEW. Two COMPLETED interpretation sessions exist on the matter: one DECLARATION_READBACK in 'es' and one RIGHTS_COUNSELING in 'pt' (CONTRACT source)."
          setup_api_calls:
            - call: "TEMPLATE B, stopping just before the CERTIFY step so ${decl_id} is left at IN_REVIEW"
              payload: {}
              as: ProgramDirector
            - call: "POST /interpretation-sessions"
              payload: { matter_id: "${matter_id}", language_code: "pt", interpreter_source: "CONTRACT", purpose: "RIGHTS_COUNSELING", scheduled_start_utc: "2026-08-03T10:00:00.000Z", scheduled_end_utc: "2026-08-03T10:45:00.000Z" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
              captures: { pt_sess_id: "$.data.id" }
            - call: "POST /interpretation-sessions/${pt_sess_id}/transition"
              payload: { action: "COMPLETE", actual_minutes: 45 }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_1: "$.data.version" }
          trigger:
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${mv_1}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /declarations/${decl_id}/transition"
              payload: { action: "CERTIFY", reviewer_assignment_id: "${cocounsel_id}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_2: "$.data.version" }
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "pt", expected_matter_version: "${mv_2}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "pt", readback_session_id: "${pt_sess_id}", expected_matter_version: "${mv_2}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: ["DENIAL_RISK"], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "pt", readback_session_id: "${sess_id}", expected_matter_version: "${mv_2}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
            - call: "POST /informed-decisions"
              payload: { matter_id: "${matter_id}", counseled_by_assignment_id: "${lead_id}", decision_type: "FILE_AFFIRMATIVE", risks_disclosed: [], alternatives_disclosed: ["WITHDRAW"], counseling_language_code: "es", expected_matter_version: "${mv_2}" }
              as: CaseRepresentative
              as_user_id: "${atty_a_id}"
          assert:
            - "trigger 1: HTTP status == 409 and error_id == 'ERR_DECLARATION_NOT_CERTIFIED' — an IN_REVIEW declaration counts for nothing; CaseMatter.version is unchanged at ${mv_1}"
            - "trigger 2: HTTP status == 200 and Declaration.${decl_id}.status == 'CERTIFIED'"
            - "trigger 4: HTTP status == 422 and error_id == 'ERR_COUNSELING_LANGUAGE_UNVERIFIED' — 'pt' differs from the client's 'es' and no session was named"
            - "trigger 5: HTTP status == 422 and error_id == 'ERR_COUNSELING_LANGUAGE_UNVERIFIED' — the named session is COMPLETED and belongs to this matter, but it is in 'pt', the COUNSELLING language, whereas the rule demands the CLIENT's language"
            - "trigger 6: HTTP status == 201, language_match_verified == false and readback_session_id == '${sess_id}' — the 'es' session satisfies the gate even though counselling happened in 'pt'; CaseMatter.version == ${mv_2} + 1"
            - "trigger 7: HTTP status == 422 and error_id == 'ERR_CONSENT_SCOPE_INSUFFICIENT' — an empty risks_disclosed array is rejected by the consent gate, a different id from the language gate, and this call would also now be stale so the version gate must run last"
            - "GET /informed-decisions?matter_id=${matter_id} returns exactly 1 row with status 'PENDING'"

      - name: err_no_eligible_supervisor_when_the_matter_carries_no_supervisor_assignment_at_all
        claim_type: Error triggerable
        grounds:
          - errors[ERR_NO_ELIGIBLE_SUPERVISOR]
          - validations[priority 22]
          - calculations.supervisor_auto_selection
          - endpoints[POST /case-assignments]
        distinguishing_aspect: "An empty candidate pool must be rejected at creation rather than silently producing an unsupervised assignment, and the pool is empty for four independent reasons that must all be checked: no SUPERVISOR assignment exists at all, the only one is still PROPOSED, the only supervisor is a non-attorney, and the only supervisor lacks the client's language. A STAFF_ATTORNEY lead on the same matter is created successfully in the same test, proving the gate keys on the target's supervision requirement and not on the matter."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. Cycle FY26-H2. Ada Ortiz (STAFF_ATTORNEY, ['en','es']), Ben Cole (STAFF_ATTORNEY, ['en','es']), Sara Ruiz (STAFF_ATTORNEY screener), Dov Adler (STAFF_ATTORNEY, ['en'] only) and Vic Lang (PRO_BONO_VOLUNTEER, ['en','es']) exist."
            - "Rosa Mena (es) has an accepted U_VISA matter with NO assignments on it yet."
          setup_api_calls:
            - call: "TEMPLATE A, omitting calls 11 and 12 so the matter has no assignments"
              payload: {}
              as: ProgramDirector
            - call: "POST /representatives"
              payload: { full_name: "Dov Adler", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 10, weekly_capacity_hours: 40, bar_number: "BAR-5005" }
              as: ProgramDirector
              captures: { dov_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Vic Lang", rep_type: "PRO_BONO_VOLUNTEER", languages: ["en", "es"], max_case_load: 5, max_supervisees: 0, weekly_capacity_hours: 10 }
              as: ProgramDirector
              captures: { vic_id: "$.data.id" }
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_1: "$.data.version" }
          trigger:
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${vic_id}", role_on_case: "LEAD", expected_matter_version: "${mv_1}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${dov_id}", role_on_case: "SUPERVISOR", expected_matter_version: "${mv_1}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
              captures: { dov_sup_id: "$.data.id" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${vic_id}", role_on_case: "LEAD", expected_matter_version: "${mv_1}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments/${dov_sup_id}/transition"
              payload: { action: "ACTIVATE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /case-matters/${matter_id}"
              payload: {}
              as: ProgramDirector
              captures: { mv_2: "$.data.version" }
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${vic_id}", role_on_case: "LEAD", expected_matter_version: "${mv_2}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /case-assignments"
              payload: { matter_id: "${matter_id}", representative_id: "${atty_a_id}", role_on_case: "CO_COUNSEL", expected_matter_version: "${mv_2}" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "trigger 1: HTTP status == 422 and error_id == 'ERR_NO_ELIGIBLE_SUPERVISOR' — the matter has no SUPERVISOR assignment whatsoever, so the pool is empty; no CaseAssignment row was created and CaseMatter.version is unchanged"
            - "trigger 2: HTTP status == 201 with status == 'PROPOSED' — a SUPERVISOR assignment for a STAFF_ATTORNEY needs no supervision link of its own"
            - "trigger 3: HTTP status == 422 and error_id == 'ERR_NO_ELIGIBLE_SUPERVISOR' — the sole SUPERVISOR is still PROPOSED, and the eligibility predicate demands an ACTIVE one"
            - "trigger 6: HTTP status == 422 and error_id == 'ERR_NO_ELIGIBLE_SUPERVISOR' — Dov Adler is now ACTIVE, AUTHORIZED_ATTORNEY and under his supervisee cap, but his languages ['en'] do not contain the client's 'es', so the pool is still empty; the client-language clause alone can empty it"
            - "trigger 7: HTTP status == 201 with supervision_link_id == null and supervision_source == null — a STAFF_ATTORNEY target is exempt from the gate on the very same matter and the very same empty pool"
            - "Representative.${dov_id}.supervisee_count == 0 throughout — a rejected create moves no counter"

      - name: err_report_period_invalid_and_err_report_state_invalid_across_the_full_report_lifecycle
        claim_type: Error triggerable
        grounds:
          - errors[ERR_REPORT_PERIOD_INVALID]
          - errors[ERR_REPORT_STATE_INVALID]
          - validations[priority 21]
          - state_machines.GrantReport
          - calculations.grant_reimbursement_rollup
        distinguishing_aspect: "The period gate is a creation-time check with three separate failure shapes — reversed dates, a start before the cycle window, and an end after it — while start == end is explicitly legal. The state gate then fires on all three actions from the wrong origin: GENERATE from GENERATED, SUBMIT from DRAFT and AMEND from GENERATED, which means the SAME id covers three different origin/action pairs. A zero-matter period is a legal report whose allocated total equals its total of 0, so SUBMIT succeeds on empty data instead of raising."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives cycle FY26-H2 with window 2026-07-01..2026-12-31 and one accepted matter decided on 2026-08-03. A GrantAnalyst user Iris Cole is registered as a representative so X-User-ID resolves."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /representatives"
              payload: { full_name: "Iris Cole", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 0, max_supervisees: 0, weekly_capacity_hours: 40, bar_number: "BAR-9009" }
              as: ProgramDirector
              captures: { analyst_id: "$.data.id" }
          trigger:
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-2026", period_start_date: "2026-09-30", period_end_date: "2026-09-01", disclosure_level: "AGGREGATE_ONLY" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-2026", period_start_date: "2026-06-30", period_end_date: "2026-09-01", disclosure_level: "AGGREGATE_ONLY" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-2026", period_start_date: "2026-09-01", period_end_date: "2027-01-01", disclosure_level: "AGGREGATE_ONLY" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports"
              payload: { cycle_id: "${cycle_id}", grant_code: "EOIR-LOP-2026", period_start_date: "2026-07-01", period_end_date: "2026-07-01", disclosure_level: "AGGREGATE_ONLY" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
              captures: { rpt_id: "$.data.id" }
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "SUBMIT" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "AMEND", amendment_reason_code: "FUNDER_QUERY" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "SUBMIT" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
            - call: "POST /grant-reports/${rpt_id}/transition"
              payload: { action: "GENERATE" }
              as: GrantAnalyst
              as_user_id: "${analyst_id}"
          assert:
            - "trigger 1: HTTP status == 422 and error_id == 'ERR_REPORT_PERIOD_INVALID' — period_start_date after period_end_date, even though both dates sit inside the cycle window"
            - "trigger 2: HTTP status == 422 and error_id == 'ERR_REPORT_PERIOD_INVALID' — 2026-06-30 is one day before the cycle's inclusive start 2026-07-01"
            - "trigger 3: HTTP status == 422 and error_id == 'ERR_REPORT_PERIOD_INVALID' — 2027-01-01 is one day after the cycle's inclusive end 2026-12-31"
            - "trigger 4: HTTP status == 201 with status == 'DRAFT', amendment_round == 0, outcomes_summary == {} and every count and money field 0 — a one-day period where start equals end is legal"
            - "trigger 5: HTTP status == 409 and error_id == 'ERR_REPORT_STATE_INVALID' — SUBMIT from DRAFT; status is still 'DRAFT'"
            - "trigger 6: HTTP status == 409 and error_id == 'ERR_REPORT_STATE_INVALID' — AMEND from DRAFT; amendment_round is still 0"
            - "trigger 7: HTTP status == 200, status == 'GENERATED', reported_matter_count == 0, base_reimbursable_cents == 0, surcharge_pct == 0.00, total_reimbursable_cents == 0 and allocated_total_cents == 0 — the 2026-07-01 window contains no accepted matter, and the zero-hours branch must not raise"
            - "trigger 8: HTTP status == 409 and error_id == 'ERR_REPORT_STATE_INVALID' — GENERATE from GENERATED, the third distinct origin/action pair for the same id"
            - "trigger 9: HTTP status == 200 and status == 'SUBMITTED' — allocated_total_cents equals total_reimbursable_cents at 0, so the SUBMIT guard is satisfied by an empty report"
            - "trigger 10: HTTP status == 409 and error_id == 'ERR_REPORT_STATE_INVALID' — a SUBMITTED report is immutable until AMEND reopens it"

      - name: err_stale_recognition_version_on_renew_is_a_separate_412_from_the_matter_occ_token
        claim_type: Error triggerable
        grounds:
          - errors[ERR_STALE_RECOGNITION_VERSION]
          - concurrency_rules[POST /accreditations/{accreditation_id}/renew]
          - state_machines.Accreditation
          - state_machines.OrganizationRecognition
        distinguishing_aspect: "The renew endpoint's OCC token is expected_recognition_version, guarding the OrganizationRecognition rather than the Accreditation being renewed — so a version captured before an unrelated CONDITION transition on the recognition goes stale and yields ERR_STALE_RECOGNITION_VERSION (412), a different id and a different guarded row from the matter-scoped ERR_STALE_MATTER_VERSION. The check runs last, after the EXPIRING state gate, and the retry with the refreshed version succeeds."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00.000Z. TEMPLATE A gives a cycle. Recognition REC-2026-001 is created with all four authorized forums and expiry_date 2030-01-01."
            - "Nadia Rey (ACCREDITED_REP) receives a PARTIAL accreditation over ['USCIS'], approved by Ben Cole on 2026-08-03, giving expiry_date 2029-08-02 from ACCREDITATION_TERM_DAYS 1095."
            - "The clock is moved to 2029-06-01T09:00:00.000Z, which is inside the 90-day ACCREDITATION_EXPIRING_WINDOW, and a cycle checkpoint runs PHASE 3 so the accreditation becomes EXPIRING."
          setup_api_calls:
            - call: "TEMPLATE A"
              payload: {}
              as: ProgramDirector
            - call: "POST /organization-recognitions"
              payload: { recognition_number: "REC-2026-001", effective_date: "2026-01-01", expiry_date: "2030-01-01", authorized_forums: ["USCIS", "ASYLUM_OFFICE", "EOIR_IMMIGRATION_COURT", "BIA"] }
              as: ProgramDirector
              captures: { rec_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Rey", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { nadia_id: "$.data.id" }
            - call: "POST /accreditations"
              payload: { representative_id: "${nadia_id}", recognition_id: "${rec_id}", accreditation_type: "PARTIAL", requested_forums: ["USCIS"] }
              as: ProgramDirector
              captures: { acc_id: "$.data.id" }
            - call: "POST /accreditations/${acc_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2029-06-01T09:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles/${cycle_id}/checkpoint"
              payload: {}
              as: ProgramDirector
            - call: "GET /organization-recognitions/${rec_id}"
              payload: {}
              as: ProgramDirector
              captures: { rec_v_old: "$.data.version" }
          trigger:
            - call: "POST /organization-recognitions/${rec_id}/transition"
              payload: { action: "CONDITION", conditional_reason_code: "AUDIT_FINDING" }
              as: ProgramDirector
            - call: "POST /accreditations/${acc_id}/renew"
              payload: { expected_recognition_version: "${rec_v_old}", requested_forums: ["USCIS", "ASYLUM_OFFICE"] }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "GET /organization-recognitions/${rec_id}"
              payload: {}
              as: ProgramDirector
              captures: { rec_v_new: "$.data.version" }
            - call: "POST /accreditations/${acc_id}/renew"
              payload: { expected_recognition_version: "${rec_v_new}", requested_forums: ["USCIS", "ASYLUM_OFFICE"] }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
          assert:
            - "setup call 5: Accreditation.${acc_id}.status == 'APPROVED' with expiry_date == '2029-08-02'"
            - "setup call 7: Accreditation.${acc_id}.status == 'EXPIRING' — 2029-06-01 is inside the 90-day window that opens on 2029-05-04"
            - "trigger 1: HTTP status == 200, OrganizationRecognition.${rec_id}.status == 'CONDITIONAL' and version == ${rec_v_old} + 1; Accreditation.${acc_id}.status is still 'EXPIRING' because CONDITION suspends nothing"
            - "trigger 2: HTTP status == 412 and error_id == 'ERR_STALE_RECOGNITION_VERSION' — the token guards the RECOGNITION, and an unrelated transition on it invalidated a token captured from the accreditation's own untouched lifecycle"
            - "trigger 2: Accreditation.${acc_id}.status is still 'EXPIRING' and its version is unchanged — the 412 is raised before any write"
            - "trigger 4: HTTP status == 200, Accreditation.${acc_id}.status == 'RENEWAL_PENDING', requested_forums == ['ASYLUM_OFFICE', 'USCIS'] as the ascending-sorted triple intersection, and BOTH OrganizationRecognition.version and Accreditation.version incremented by 1"
            - "trigger 4 succeeded from a CONDITIONAL recognition, confirming the renew precondition admits {ACTIVE, CONDITIONAL} and not ACTIVE alone"

      - name: err_invariant_violation_never_fires_because_the_three_conservation_assertions_hold
        claim_type: Error triggerable
        grounds:
