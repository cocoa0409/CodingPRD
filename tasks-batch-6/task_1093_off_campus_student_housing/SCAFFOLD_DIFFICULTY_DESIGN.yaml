              captures: { l2_i1: "$.data[0].id" }
            - call: "POST /installments/${l1_i1}/pay"
              payload: { amount_cents: 98667 }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /installments/${l2_i1}/pay"
              payload: { amount_cents: 98667 }
              as: Student
              as_user_id: "${s2}"
            - call: "GET /properties/${prop1}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { prop1_v: $.data.version }
            - call: "POST /payouts"
              payload: { property_id: "${prop1}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_property_version: "${prop1_v}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { po1: $.data.id, po1_gross: $.data.gross_collected_cents, po1_hold: $.data.holdback_cents }
            - call: "POST /payouts/${po1}/decision"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              as_user_id: "admin-2"
          trigger:
            - call: "POST /payouts/${po1}/pay"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-2"
            - call: "POST /payouts/${po1}/reverse"
              payload: { reason: "Bank returned the wire" }
              as: PlatformAdmin
              as_user_id: "admin-2"
          assert:
            - "before PAY: Property.${prop1}.escrow_balance_cents == 197334 and maintenance_reserve_cents == 0 and payout_eligible == true"
            - "after PAY: Payout.${po1}.status == PAID and Payout.${po1}.approved_by_user_id == admin-2"
            - "after PAY: Property.${prop1}.escrow_balance_cents == 0"
            - "after PAY: Property.${prop1}.maintenance_reserve_cents == 3947"
            - "after PAY: Property.${prop1}.payout_eligible == false"
            - "after REVERSE: Payout.${po1}.status == REVERSED"
            - "after REVERSE: Property.${prop1}.escrow_balance_cents == 197334"
            - "after REVERSE: Property.${prop1}.maintenance_reserve_cents == 0"
            - "after REVERSE: Property.${prop1}.payout_eligible == true"
            - "the invariant escrow_balance_cents + SUM(gross_collected_cents over PAID payouts) equals 197334 at all three observation points (197334+0, 0+197334, 197334+0)"
            - "no Installment changed: Lease.${l1}.paid_cents == 98667 and Lease.${l2}.paid_cents == 98667 throughout"

      - name: bed_reservation_and_cancellation_conserve_unit_bed_partition
        grounds:
          - calculations.unit_occupancy_rollup
          - state_machines.Lease.DRAFT_to_PENDING_SIGNATURE
          - state_machines.Lease.PENDING_SIGNATURE_to_CANCELLED
          - entities.Unit.fields.leased_bed_count
          - entities.Unit.fields.available_bed_count
          - entities.Property.fields.available_bed_count
        distinguishing_aspect: |
          Conserved quantity #2 is CAPACITY, not money: the bed partition
          `len(Unit.bed_labels) == leased_bed_count + available_bed_count` holds at 4 at
          every step, and cancelling the reservation returns leased_bed_count to 0,
          available_bed_count to 4, occupancy_status to AVAILABLE and
          Property.available_bed_count to 4 with zero drift.
        test_recipe:
          setup:
            - "PREFERRED university SU, LISTED property whose only unit has four bed labels A, B, C, D."
            - "One VERIFIED student holding a DRAFT lease on bed A."
            - "Unit currently AVAILABLE with leased_bed_count 0 and available_bed_count 4."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /students/${s1}/verification-requests"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /students/${s1}/verification-decision"
              payload: { decision: "APPROVE" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
            - call: "POST /leases"
              payload: { student_id: "${s1}", unit_id: "${unit1}", bed_label: "A", term_start_date: "2026-08-15", term_end_date: "2027-08-01", installment_count: 10 }
              as: Student
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "GET /units/${unit1}"
              payload: {}
              as: Student
              as_user_id: "${s1}"
              captures: { u_leased_before: $.data.leased_bed_count, u_avail_before: $.data.available_bed_count }
          trigger:
            - call: "POST /leases/${l1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /leases/${l1}/cancel"
              payload: { reason: "Changed plans" }
              as: Student
              as_user_id: "${s1}"
          assert:
            - "before the pair: Unit.${unit1}.leased_bed_count == 0, available_bed_count == 4, occupancy_status == AVAILABLE, Property.${prop1}.available_bed_count == 4"
            - "after submit: Lease.${l1}.lease_status == PENDING_SIGNATURE"
            - "after submit: Unit.${unit1}.leased_bed_count == 1, available_bed_count == 3, occupancy_status == PARTIALLY_LEASED"
            - "after submit: Property.${prop1}.available_bed_count == 3 and Property.${prop1}.status == LISTED"
            - "after cancel: Lease.${l1}.lease_status == CANCELLED and terminated_at is not null"
            - "after cancel: Unit.${unit1}.leased_bed_count == 0, available_bed_count == 4, occupancy_status == AVAILABLE"
            - "after cancel: Property.${prop1}.available_bed_count == 4 and Property.${prop1}.total_bed_count == 4"
            - "the partition leased_bed_count + available_bed_count == 4 holds at all three observation points"
            - "GET /leases?unit_id=${unit1}&lease_status=CANCELLED returns exactly 1 row"
