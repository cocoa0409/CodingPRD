          - entities.RegionHub.fields.press_posture
          - entities.DeliveryStop.fields.status
          - validations[priority=21]
        distinguishing_aspect: "This boundary is on a different metric and endpoint — an interval-occupation boundary rather than a ratio: a second route whose dispatch window opens exactly at the previous window's close does not overlap (half-open), while a window opening one minute earlier does, so the boundary sits at exact adjacency on the dock calendar."
