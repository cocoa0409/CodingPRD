          assert:
            - "CHECKPOINT 1 (after reservation, in setup): available 49200000 + reserved 800000 + committed 0 == 50000000, and reserved equals the single RESERVED reservation's 800000"
            - "CHECKPOINT 2 (after payment, in setup): disbursed_amount_cents == 700000 == min(final 700000, initial reservation 800000); available 49300000 + reserved 0 + committed 700000 == 50000000; the 100000 release_delta went back to available, not lost"
            - "CHECKPOINT 3 (after the trigger): Program.${prog_id}.budget_available_cents == 50000000, budget_reserved_cents == 0, budget_committed_cents == 0, so available + reserved + committed == budget_total_cents with zero drift"
            - "Program.${prog_id}.budget_clawed_back_cents == 700000 and equals the sum of ClawbackAction.recovered_cents over the program's projects — the clawed-back counter is a separate tally, NOT a fourth bucket in the conservation identity"
            - "Reservation.${resv_id}.status == CLAWED_BACK with release_reason == CLAWBACK, and no reservation of this program is RESERVED or COMMITTED"
            - "GET /clawback-actions?project_id=${proj_id} returns exactly 1 action with reason == POST_PAYMENT_INSPECTION_FAILURE, disbursed_before_cents == 700000, recovered_cents == 700000 and program_budget_available_after_cents == 50000000"
            - "RebateProject.${proj_id}.status == CLAWED_BACK with disbursed_amount_cents reset to 0, and its ProjectMeasure verification_status == CLAWED_BACK"
            - "An implementation that debits committed by the original 800000 instead of the reconciled 700000 breaks the identity by 100000 and must be detected here"

      - name: household_lifetime_entitlement_conserved_across_reserve_and_expiry
        grounds:
          - calculations.household_cap_conservation
          - state_machines.Reservation.RESERVED_to_EXPIRED
          - entities.Household.fields.lifetime_cap_remaining_cents
          - entities.Household.fields.encumbered_cents
          - endpoints.POST_/programs/{id}/sweep
        distinguishing_aspect: |
          A different conserved quantity on a different aggregate — the
          HOUSEHOLD LIFETIME ENTITLEMENT — pinned as the explicit formula
            rebate_cap_cents == lifetime_cap_remaining_cents + encumbered_cents
          with the supporting identity
            encumbered_cents == sum(reserved_amount_cents of the household's
                                    RESERVED or COMMITTED reservations)
          and a different compensating action: TIME-DRIVEN EXPIRY through the
          sweep rather than a post-payment clawback. No cash ever moves here,
          which is exactly why an implementation can restore the program
          appropriation correctly and still leave the household's entitlement
          permanently encumbered.
        test_recipe:
          setup:
            - "An OPEN program with reservation_ttl_days 120, low_tier_cost_share_pct 1.00, low_tier_cap_cents 1400000 and group_cap_cents 800000."
            - "Catalog: HP-HVAC-01 unit 800000 / cap 800000 / HVAC_GROUP / 200 A / anchor."
            - "A LOW-tier household whose rebate_cap_cents is 1400000 with lifetime_cap_remaining_cents 1400000 and encumbered_cents 0 immediately after verification."
            - "An ENROLLED_ACTIVE contractor and an APPROVED assessment (assessed_panel_amps 200)."
            - "A project reserved at the default clock 2026-08-01T00:00:00Z for 800000, so the reservation expires at 2026-11-29T00:00:00Z and the household sits at remaining 600000 / encumbered 800000."
            - "The project is never installed, and the clock is advanced to 2026-11-30T00:00:00Z — one day PAST expiry, so the sweep is unambiguously due."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Entitlement", state_code: "CO", budget_total_cents: 50000000, reservation_ttl_days: 120, low_tier_cap_cents: 1400000, low_tier_cost_share_pct: 1.00, group_cap_cents: 800000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, max_quantity: 1, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true, sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Bo Nadeau", email: "bo@example.com", service_address_line1: "41 Balsam Rd", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Entitlement Heating", license_number: "MC-1313", license_expires_on: "2027-12-31", insurance_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_v1: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v1}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /rebate-projects/${proj_id}/submit"
              payload: {}
              as: Contractor
              as_user_id: "${ctr_id}"
            - call: "POST /rebate-projects/${proj_id}/review"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { prog_v1: $.data.version }
            - call: "POST /rebate-projects/${proj_id}/reservations"
              payload: { expected_program_version: "${prog_v1}" }
              as: ProgramReviewer
              as_user_id: "reviewer-2"
              captures: { resv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /programs/${prog_id}/sweep"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "CHECKPOINT 1 (after verification, in setup): Household.${hh_id}.rebate_cap_cents == 1400000 == lifetime_cap_remaining_cents 1400000 + encumbered_cents 0"
            - "CHECKPOINT 2 (after reservation, in setup): 1400000 == lifetime_cap_remaining_cents 600000 + encumbered_cents 800000, and encumbered_cents equals the household's single RESERVED reservation amount"
            - "CHECKPOINT 3 (after the sweep): Household.${hh_id}.lifetime_cap_remaining_cents == 1400000 and encumbered_cents == 0, so the identity holds with zero drift and the entitlement is fully restored"
            - "After the sweep the household has no RESERVED or COMMITTED reservation, so the supporting identity encumbered_cents == 0 is exact rather than incidental"
            - "Household.${hh_id}.rebate_cap_cents and income_tier are untouched by the whole cycle (1400000 / LOW) — expiry restores headroom, it never re-tiers the household"
            - "The sweep response reports swept_reservation_count 1 and released_cents 800000, and Program.${prog_id}.budget_available_cents == 50000000 — the program ledger recovering does NOT imply the household ledger did"
            - "Reservation.${resv_id}.status == EXPIRED and RebateProject.${proj_id}.status == EXPIRED, both terminal, so the 800000 can never be re-encumbered by this project"
