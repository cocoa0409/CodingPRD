            - "HTTP 422 with data.error_id == ERR_HANDOFF_NOT_SIGNED"
            - "SitterAssignment.${a18out}.watch_status is still ON_WATCH with completion_reason == null and documentation_status == HANDOFF_DRAFTED"
            - "HandoffRecord.${h18}.documentation_state == DRAFTED with countersigned_by_staff_id == null"
            - "GET /observation/sitter-assignments/${a18out}/cost-entries returns exactly 1 row (PROVISIONAL 16000, status POSTED); no FINAL_SEGMENT was posted and nothing was reversed"
            - "Unit.${u18}.observed_cost_to_date_cents == 32000 (both PROVISIONAL rows) and Staff.${out18}.status == ON_ASSIGNMENT"

      - name: order_loops_from_escalated_back_to_active
        claim_type: cyclic
        grounds:
          - state_machines.ObservationOrder.status.ESCALATED_to_ACTIVE
        excluded_because:
          difficulty_instance: "non_linear_state_machine / observation_order_cycles_active_escalated_active_twice"
          rationale: "That instance drives two full ACTIVE -> ESCALATED -> ACTIVE loops and asserts the non-idempotent trace the cycle leaves behind."

      - name: watch_and_documentation_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.SitterAssignment.documentation_status
        excluded_because:
          difficulty_instance: "non_linear_state_machine / sitter_assignment_documentation_dimension_moves_while_watch_status_frozen"
          rationale: "That instance asserts documentation_status moving PENDING -> HANDOFF_DRAFTED -> HANDOFF_SIGNED while watch_status is pinned at ON_WATCH."

      - name: discharge_cascades_down_to_orders_and_watches
        claim_type: cascade_down
        grounds:
          - state_machines.ObservationOrder.status.to_DISCONTINUED
        excluded_because:
          difficulty_instance: "transitive_cascade / patient_discharge_order_to_assignment_to_ledger_depth_three"
          rationale: "That instance walks the whole patient -> order -> assignment -> ledger chain from one discharge call."

      - name: incident_review_adjusts_console_and_observer_across_entities
        claim_type: cross_entity
        grounds:
          - state_machines.MonitoringStation.status.ACTIVE_MONITORING_to_IDLE
        excluded_because:
          difficulty_instance: "transitive_cascade / incident_review_modality_to_feed_to_station_to_observer_depth_four"
          rationale: "That instance asserts the console counters and the observer's duty posture after the modality-forcing cascade."

      - name: void_compensates_every_side_effect_of_scheduling
