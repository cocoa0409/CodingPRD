          DIFFERENT conserved quantity = episode ad slots. Forward (insert consumes 1 slot:
          filled 1/available 1) + compensating (cancel frees it: filled 0/available 2) keeps
          total_ad_slots == filled_slots + available_slots == 2 invariant.
        test_recipe:
          setup:
            - "ACTIVE TECH monetized show, PUBLISHED+READY episode total 2 offers PRE_ROLL"
            - "Campaign cSlot ACTIVE; placement pSlot INSERTED (filled_slots 1, available_slots 1)"
          setup_api_calls:
            - call: "POST /publishers"
