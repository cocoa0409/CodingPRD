              as: Coordinator
              captures: { b2_out: "$.data.id" }
            - call: "POST /bookings"
              payload: { property_id: "${p2}", external_ref: "IN-2", guest_name: "Guest In 2", checkin_at: "2026-08-08T16:31:00Z", checkout_at: "2026-08-11T16:00:00Z" }
              as: Coordinator
              captures: { b2_in: "$.data.id" }
          trigger:
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b1_out}", incoming_booking_id: "${b1_in}" }
              as: Coordinator
              captures: { e1: "$.data.error_id" }
            - call: "POST /turnovers"
              payload: { outgoing_booking_id: "${b1_out}", incoming_booking_id: "${b1_in}", override_reason: "owner insists on a same-slot turn" }
