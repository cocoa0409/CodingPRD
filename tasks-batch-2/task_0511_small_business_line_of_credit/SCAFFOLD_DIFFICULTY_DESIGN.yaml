  # ==========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_feed_stale_on_approve
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FEED_STALE]
        distinguishing_aspect: |
          Category pair = state(priority 6, ERR_INVALID_STATE) vs business_safety(priority 9,
          ERR_FEED_STALE). An approve on a DRAFT application whose feed is also STALE fails
          BOTH; the lower-priority-number state check wins, returning ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "An Application in DRAFT (never submitted) whose BankFeed has been marked STALE."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Iota Co", ein: "100000009", state_code: "CO", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_i", pulled_at: "2026-04-20T00:00:00Z", avg_daily_balance_cents: 2000000, nsf_count_90d: 0, deposit_volume_cents: 9000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /bank-feeds/${feed_id}/mark-stale"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Application.${app_id}.status == DRAFT"

      - name: excess_nsf_beats_score_floor_on_approve
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_EXCESS_NSF]
          - errors[ERR_SCORE_BELOW_FLOOR]
        distinguishing_aspect: |
          Category pair = business_safety(priority 10, ERR_EXCESS_NSF) vs
          business_constraint(priority 11, ERR_SCORE_BELOW_FLOOR) — a DIFFERENT pair from the
          state-vs-safety conflict above. A submitted application whose feed has nsf_count_90d=6
          (>NSF_UNDERWRITE_MAX 3) AND a resulting risk_score below 50 fails both; the
          lower-priority-number ERR_EXCESS_NSF wins.
        test_recipe:
          setup:
            - "A submitted Application whose FRESH feed has nsf_count_90d=6 (excess) and weak ratios producing risk_score below 50."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { legal_name: "Kappa Co", ein: "100000010", state_code: "NV", monthly_revenue_cents: 2000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { merch_id: $.data.id }
            - call: "POST /merchants/${merch_id}/bank-feeds"
              payload: { plaid_item_id: "plaid_k", pulled_at: "2026-04-20T00:00:00Z", avg_daily_balance_cents: 200000, nsf_count_90d: 6, deposit_volume_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { feed_id: $.data.id }
            - call: "POST /applications"
              payload: { merchant_id: "${merch_id}", bank_feed_id: "${feed_id}", requested_limit_cents: 1000000 }
              as: Underwriter
              as_user_id: "uw_1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Underwriter
              as_user_id: "uw_1"
              captures: { score: $.data.risk_score }
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: Underwriter
              as_user_id: "uw_2"
          assert:
            - "Application.${app_id}.risk_score == 0"
            - "response error_id == ERR_EXCESS_NSF"
            - "Application.${app_id}.status == SUBMITTED"

  # ==========================================================================
