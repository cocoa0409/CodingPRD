            - "Patient.${p_id}.updated_at == 2026-05-01T00:00:00.000Z"
            - "Patient.${p_id}.version == 1"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: request_with_missing_x_user_role_header_returns_unauthenticated
        claim_type: role_denied_operations
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The trigger call is issued with the X-User-Role header omitted entirely, so it is rejected at rung 1 with ERR_UNAUTHENTICATED before any existence or payload rung runs."
        test_recipe:
          setup:
            - "One Patient in program_status REFERRED."
            - "The trigger request deliberately omits the X-User-Role header; the as: value below records the role the caller would otherwise have used."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2046", full_name: "Vik Sandhu", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /palliative/patients/${p_id}"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "${err} == ERR_UNAUTHENTICATED"

      - name: chaplain_cannot_create_a_medication_order_returns_unauthorized
        claim_type: role_denied_operations
        grounds:
          - roles.Chaplain
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Chaplain is not listed on POST /palliative/medication-orders, so the request is refused at rung 2 with ERR_UNAUTHORIZED even though the payload is completely valid."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2047", full_name: "Wes Amari", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
          trigger:
            - call: "POST /palliative/medication-orders"
              payload: { patient_id: "${p_id}", drug: "MORPHINE_PO", dose_amount: 30, days_supply: 14 }
              as: Chaplain
              as_user_id: "u_chaplain_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "GET /palliative/patients/${p_id}/medication-orders returns an empty array"

      - name: caregiver_files_a_proxy_symptom_assessment_as_an_entity_backed_role
