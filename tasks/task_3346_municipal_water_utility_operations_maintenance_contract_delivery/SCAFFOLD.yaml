scenario: "Municipal Water Utility Operations & Maintenance Contract Delivery (Jacobs): contract award to operate a municipal water or wastewater system with performance standards and staffing commitments, permit compliance responsibility with penalty allocation between operator and municipality, capital versus operating expense boundary definitions determining who funds equipment replacement, employee transition from municipal to contractor employment with benefit and pension considerations, asset condition assessment at contract start establishing baseline responsibility, preventive maintenance program execution with work order documentation and reporting to the municipality, emergency response for main breaks, overflows and treatment upsets with notification obligations, contract renewal, benchmarking against public operation and transition-back planning"
domain_name: "municipal-water-utility-om-contract-delivery"
api_prefix: "/water-om"

complexity_profile:
  primary_archetype: "compliance/audit"
  secondary_archetype: "multi-party negotiation"
  complexity_layers:
    - "cascading side effects"
    - "dual-variant calculation"
    - "contagion / risk propagation"
    - "version-pinning on approval"
  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Municipality
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the municipal utility owner
        constraints: non-empty
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the municipality
        constraints: exactly 2 uppercase letters
      - name: population_served
        type: integer
        source: input
        description: retail population served by the utility system
        constraints: ">= 0"
      - name: owns_treatment_works
        type: boolean
        source: input
        description: true when the municipality owns the treatment works whose permit the operator discharges under
      - name: benchmark_index_baseline
        type: number
        source: computed
        description: municipality's public-operation benchmark cost index per million gallons, carried at contract award and used as the benchmark comparison baseline
        default: 0.0
      - name: total_operator_penalty_cents
        type: integer
        source: computed
        description: running total of allocated penalty cents that are the OPERATOR's share across all PenaltyAllocation rows under this municipality's contracts
        default: 0
  - name: Contract
    parent: Municipality
    common_fields: true
    fields:
      - name: municipality_id
        type: string
        source: input
        description: "FK -> Municipality.id; the municipal owner awarding the O&M contract"
        constraints: must exist and be the path parent
      - name: title
        type: string
        source: input
        description: short contract title
        constraints: non-empty
      - name: award_date
        type: datetime
        source: input
        description: ISO 8601 UTC date the contract was awarded
      - name: contract_start_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the operating period begins
      - name: contract_end_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the base operating period ends
        constraints: must be strictly after contract_start_date
      - name: annual_fee_cents
        type: integer
        source: input
        description: base annual operating fee payable to the operator
        constraints: ">= 1"
      - name: operator_penalty_share_pct
        type: number
        source: input
        description: contract-specified fraction of a permit penalty borne by the operator
        constraints: "0.0 <= x <= 1.0"
      - name: staffing_floor_fte
        type: number
        source: computed
        description: derived minimum operator staffing level in FTE, computed from the performance standards' criticality weights
        default: 0.0
      - name: status
        type: enum
        source: system
        description: contract lifecycle state
        constraints: "one of {AWARDED, MOBILIZING, OPERATING, UNDER_REVIEW, RENEWAL_PENDING, RENEWED, HANDING_BACK, TRANSITIONED, TERMINATED}"
      - name: baseline_frozen
        type: boolean
        source: system
        description: true once the contract-start asset condition baseline is frozen and cannot be amended
        default: false
      - name: baseline_asset_count
        type: integer
        source: computed
        description: number of AssetConditionAssessment rows frozen under this contract
        default: 0
      - name: renewal_round
        type: integer
        source: system
        description: number of completed renewal negotiation rounds for this contract
        default: 0
  - name: PerformanceStandard
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; owning contract"
        constraints: must exist and be the path parent
      - name: code
        type: string
        source: input
        description: standard code, unique within the contract
        constraints: unique per (contract_id, code)
      - name: title
        type: string
        source: input
        description: human-readable standard title
      - name: metric_type
        type: enum
        source: input
        description: what the standard measures
        constraints: "one of {TREATMENT_EFFLUENT, COLLECTION_OVERFLOW, RESPONSE_TIME, PM_COMPLETION, WORK_ORDER_CLOSURE, STAFFING_LEVEL}"
      - name: criticality_weight
        type: number
        source: input
        description: weight applied in the staffing floor and penalty weighting formulas
        constraints: "0.0 < x <= 1.0"
      - name: threshold_value
        type: number
        source: input
        description: the numerical threshold the measurement must satisfy
      - name: threshold_direction
        type: enum
        source: input
        description: whether the measurement must be at least or at most the threshold
        constraints: "one of {AT_LEAST, AT_MOST}"
      - name: breach_penalty_cents
        type: integer
        source: input
        description: penalty cents triggered by each measurement period in breach
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: standard lifecycle state
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED, BREACHED, RETIRED}"
      - name: breach_reason_code
        type: string
        source: computed
        description: most recent breach reason recorded; empty when not breached
        default: ""
      - name: status_changed_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the status last changed
  - name: PerformanceMeasurement
    parent: PerformanceStandard
    common_fields: true
    fields:
      - name: performance_standard_id
        type: string
        source: input
        description: "FK -> PerformanceStandard.id; owning standard"
        constraints: must exist and be the path parent
      - name: period_start
        type: datetime
        source: input
        description: inclusive start of the measurement period
      - name: period_end
        type: datetime
        source: input
        description: exclusive end of the measurement period
        constraints: must be strictly after period_start
      - name: measured_value
        type: number
        source: input
        description: observed value for the period
      - name: in_breach
        type: boolean
        source: computed
        description: true when the measured value violates the standard's threshold under its threshold_direction
        default: false
      - name: weighted_breach_score
        type: number
        source: computed
        description: criticality_weight multiplied by the breach severity band for this measurement
        default: 0.0
      - name: status
        type: enum
        source: system
        description: measurement lifecycle state
        constraints: "one of {RECORDED, ASSESSED, DISPUTED, WAIVED, CONFIRMED}"
  - name: StaffingCommitment
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; owning contract"
        constraints: must exist and be the path parent
      - name: role_code
        type: string
        source: input
        description: position class code, unique within the contract
        constraints: unique per (contract_id, role_code)
      - name: committed_fte
        type: number
        source: input
        description: FTE the operator committed to hold in this position class
        constraints: ">= 0"
      - name: filled_fte
        type: number
        source: computed
        description: FTE currently filled by operator-employed staff in this position class
        default: 0.0
      - name: vacancy_fte
        type: number
        source: computed
        description: committed_fte minus filled_fte, floored at zero
        default: 0.0
      - name: status
        type: enum
        source: system
        description: staffing commitment compliance state
        constraints: "one of {DRAFT, BINDING, SHORTFALL, REMEDIATING, SATISFIED, SUSPENDED}"
  - name: Employee
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; the contract the employee transfers or is hired under"
        constraints: must exist and be the path parent
      - name: role_code
        type: string
        source: input
        description: position class code; must equal the role_code of a StaffingCommitment row on the same contract
        constraints: must match a StaffingCommitment.role_code under the same contract
      - name: full_name
        type: string
        source: input
        description: employee legal name
      - name: municipal_hire_date
        type: datetime
        source: input
        description: ISO 8601 UTC date first hired by the municipality
      - name: municipal_years_of_service
        type: number
        source: computed
        description: fractional years between municipal_hire_date and the contract start date
        default: 0.0
      - name: transfer_offer_fte
        type: number
        source: input
        description: FTE offered by the operator on transfer
        constraints: "0 < x <= 1.0"
      - name: benefit_tier
        type: enum
        source: computed
        description: benefit tier assigned by the vesting formula
        constraints: "one of {NONE, BASIC, STANDARD, ENHANCED, GRANDFATHERED}"
      - name: pension_offset_cents
        type: integer
        source: computed
        description: operator-funded annual pension cost offset owed because of the employee's municipal pension shortfall
        default: 0
      - name: status
        type: enum
        source: system
        description: employee transition lifecycle state
        constraints: "one of {MUNICIPAL, OFFERED, ACCEPTED, TRANSFERRED, INDUCTION, ACTIVE, DECLINED, WITHDRAWN, SEPARATED}"
  - name: Asset
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract under which this asset is operated"
        constraints: must exist and be the path parent
      - name: asset_tag
        type: string
        source: input
        description: physical asset tag, unique within the contract
        constraints: unique per (contract_id, asset_tag)
      - name: asset_class
        type: enum
        source: input
        description: plant or linear asset class
        constraints: "one of {MAIN, PUMP, VALVE, TREATMENT_UNIT, BLOWER, FILTER, LIFT_STATION, RESERVOIR}"
      - name: install_year
        type: integer
        source: input
        description: calendar year the asset was installed
        constraints: "1900 <= x <= 2100"
      - name: useful_life_years
        type: integer
        source: input
        description: nominal useful life in years used for the capital-versus-operating boundary
        constraints: ">= 1"
      - name: criticality_rank
        type: integer
        source: input
        description: 1 is most critical; used to order preventive maintenance generation
        constraints: ">= 1"
      - name: condition_score
        type: number
        source: computed
        description: latest condition score in [0.0, 100.0] from the newest frozen or active AssetConditionAssessment
        default: 100.0
      - name: condition_band
        type: enum
        source: computed
        description: band derived from condition_score
        constraints: "one of {EXCELLENT, GOOD, FAIR, POOR, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: asset lifecycle state
        constraints: "one of {REGISTERED, BASELINE_ASSESSED, BASELINE_DISPUTED, IN_SERVICE, REPLACEMENT_FLAGGED, REPLACED, OUT_OF_SERVICE, RETIRED}"
      - name: replacement_flagged_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the asset was flagged for capital replacement
  - name: AssetConditionAssessment
    parent: Asset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; assessed asset"
        constraints: must exist and be the path parent
      - name: assessed_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the assessment was performed
      - name: assessed_score
        type: number
        source: input
        description: observed condition score
        constraints: "0.0 <= x <= 100.0"
      - name: is_baseline
        type: boolean
        source: input
        description: true when this is the contract-start baseline assessment
      - name: assessor_party
        type: enum
        source: input
        description: which party performed the assessment
        constraints: "one of {OPERATOR, MUNICIPALITY, JOINT}"
      - name: status
        type: enum
        source: system
        description: assessment lifecycle state
        constraints: "one of {DRAFTED, SUBMITTED, DISPUTED, REVISED, ACCEPTED}"
      - name: baseline_binding
        type: boolean
        source: computed
        description: true when this assessment is the frozen contract-start baseline for its asset
        default: false
  - name: Permit
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract operating under the permit"
        constraints: must exist and be the path parent
      - name: permit_number
        type: string
        source: input
        description: regulatory permit number, unique within the contract
        constraints: unique per (contract_id, permit_number)
      - name: permit_type
        type: enum
        source: input
        description: regulatory program the permit belongs to
        constraints: "one of {NPDES_DISCHARGE, WATER_ALLOCATION, SLUDGE_LAND_APPLICATION, AIR_EMISSIONS}"
      - name: regulator
        type: enum
        source: input
        description: issuing regulator
        constraints: "one of {STATE_PRIMACY_AGENCY, USEPA_REGION, LOCAL_HEALTH_DEPARTMENT}"
      - name: effective_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the permit takes effect
      - name: expiration_date
        type: datetime
        source: input
        description: ISO 8601 UTC instant the permit expires
        constraints: must be strictly after effective_date
      - name: status
        type: enum
        source: system
        description: permit lifecycle state
        constraints: "one of {APPLICATION_DRAFTED, SUBMITTED, ISSUED, ACTIVE, NOTICE_OF_VIOLATION, SUSPENDED, RENEWAL_FILED, EXPIRED}"
  - name: PenaltyAllocation
    parent: Permit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> Permit.id; permit whose violation produced the penalty"
        constraints: must exist and be the path parent
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract under which the penalty is allocated"
        constraints: must be the permit's owning contract
      - name: violation_code
        type: string
        source: input
        description: regulator citation code for the violation
      - name: total_penalty_cents
        type: integer
        source: input
        description: total penalty cents assessed by the regulator
        constraints: ">= 0"
      - name: operator_share_cents
        type: integer
        source: computed
        description: penalty cents allocated to the operator under the allocation formula
        default: 0
      - name: municipality_share_cents
        type: integer
        source: computed
        description: penalty cents retained by the municipality; equals total minus operator share
        default: 0
      - name: state_baseline_share_cents
        type: integer
        source: computed
        description: operator share computed under the chronological tiering variant instead of the forward-looking variant
        default: 0
      - name: status
        type: enum
        source: system
        description: allocation lifecycle state
        constraints: "one of {ALLOCATED, CONTESTED, ADJUSTED, SETTLED, VOIDED}"
  - name: WorkOrder
    parent: Asset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; asset the work order acts on"
        constraints: must exist and be the path parent
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract under which the work is performed"
        constraints: must be the asset's owning contract
      - name: work_type
        type: enum
        source: input
        description: classification of the work
        constraints: "one of {PREVENTIVE, CORRECTIVE, EMERGENCY, INSPECTION}"
      - name: expense_class
        type: enum
        source: input
        description: operating-versus-capital boundary classification computed from the work order's cost and the asset's replacement characteristics
        constraints: "one of {OPERATING, CAPITAL_THRESHOLD, CAPITAL_LIFE_EVENT, PENDING_CLASSIFICATION, REJECTED_AS_CAPITAL}"
      - name: estimated_cost_cents
        type: integer
        source: input
        description: operator's estimate of the work cost in cents
        constraints: ">= 0"
      - name: actual_cost_cents
        type: integer
        source: computed
        description: finalized cost in cents; 0 until the work order is completed
        default: 0
      - name: cost_variance_cents
        type: integer
        source: computed
        description: difference between the finalized cost and the estimate, computed from mixed provisional and final cost components
        default: 0
      - name: documentation_complete
        type: boolean
        source: computed
        description: true when all mandatory closure fields are populated and the closure narrative exceeds the minimum length
        default: false
      - name: submitted_to_municipality_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the work order report was transmitted to the municipality
      - name: status
        type: enum
        source: system
        description: work order lifecycle state
        constraints: "one of {DRAFT, SCHEDULED, IN_PROGRESS, PAUSED, AWAITING_PARTS, COMPLETED, VERIFIED, RETURNED, CLOSED, CANCELLED}"
  - name: PMSchedule
    parent: Asset
    common_fields: true
    fields:
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; asset the preventive maintenance schedule covers"
        constraints: must exist and be the path parent
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract under which the schedule runs"
        constraints: must be the asset's owning contract
      - name: frequency_days
        type: integer
        source: input
        description: nominal interval between occurrences in days
        constraints: ">= 1"
      - name: duration_hours
        type: number
        source: input
        description: planned occupation length in hours for each scheduled occurrence
        constraints: "> 0"
      - name: next_due_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant the next occurrence is due, derived from the previous occurrence and the frequency
      - name: compliance_rate_pct
        type: number
        source: computed
        description: percentage of generated occurrences completed within their grace window
        default: 0.0
      - name: missed_occurrence_count
        type: integer
        source: computed
        description: number of generated occurrences whose grace window closed without completion
        default: 0
      - name: status
        type: enum
        source: system
        description: schedule compliance state
        constraints: "one of {DRAFT, ACTIVE, DUE, OVERDUE, SUSPENDED, COMPLETED, RETIRED}"
  - name: EmergencyEvent
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract under which the emergency occurs"
        constraints: must exist and be the path parent
      - name: asset_id
        type: string
        source: input
        description: "FK -> Asset.id; the asset involved in the emergency"
        constraints: must exist and belong to the same contract
      - name: event_type
        type: enum
        source: input
        description: class of emergency
        constraints: "one of {MAIN_BREAK, SANITARY_OVERFLOW, TREATMENT_UPSET, POWER_LOSS, CONTAMINATION}"
      - name: severity
        type: enum
        source: input
        description: regulator-facing severity band
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: occurred_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the emergency began
      - name: notify_deadline_at
        type: datetime
        source: computed
        description: ISO 8601 UTC instant by which the regulator notification must be filed
      - name: notified_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the notification was filed
      - name: notification_late
        type: boolean
        source: computed
        description: true when the notification was filed at or after the computed deadline
        default: false
      - name: response_minutes
        type: number
        source: computed
        description: minutes from occurred_at to the recorded containment instant
        default: 0.0
      - name: status
        type: enum
        source: system
        description: emergency lifecycle state
        constraints: "one of {REPORTED, DISPATCHED, CONTAINED, RESTORED, NOTIFIED, ESCALATED, UNDER_INVESTIGATION, CLOSED}"
  - name: RenewalProposal
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract being renewed"
        constraints: must exist and be the path parent
      - name: round_number
        type: integer
        source: input
        description: negotiation round this proposal belongs to, starting at 1
        constraints: ">= 1"
      - name: proposed_fee_cents
        type: integer
        source: input
        description: annual fee proposed by the submitting side
        constraints: ">= 1"
      - name: proposed_term_years
        type: integer
        source: input
        description: renewal term length in years proposed
        constraints: ">= 1"
      - name: submitted_by
        type: enum
        source: input
        description: which party submitted the proposal
        constraints: "one of {OPERATOR, MUNICIPALITY}"
      - name: benchmark_ratio
        type: number
        source: computed
        description: proposed fee per million gallons divided by the municipality's benchmark cost index at the same volume
        default: 0.0
      - name: status
        type: enum
        source: system
        description: proposal lifecycle state
        constraints: "one of {DRAFTED, SUBMITTED, UNDER_REVIEW, COUNTERED, ACCEPTED, REJECTED, WITHDRAWN, LAPSED}"
  - name: TransitionObligation
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> Contract.id; contract entering the transition-back or renewal path"
        constraints: must exist and be the path parent
      - name: obligation_type
        type: enum
        source: input
        description: kind of hand-back obligation
        constraints: "one of {ASSET_HANDOVER, RECORDS_TRANSFER, EMPLOYEE_REINSTATE, PERMIT_TRANSFER, SPARES_INVENTORY, SCADA_ACCESS}"
      - name: due_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the obligation must be satisfied
      - name: completed_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the obligation was satisfied
      - name: is_critical
        type: boolean
        source: input
        description: true when the obligation blocks the hand-back from completing
      - name: penalty_per_day_cents
        type: integer
        source: input
        description: cents charged per full day the obligation remains outstanding past due_at
        constraints: ">= 0"
      - name: outstanding_days
        type: integer
        source: computed
        description: whole days between due_at and the evaluation instant, floored at zero
        default: 0
      - name: withholding_cents
        type: computed
        description: cents withheld from the final settlement for this obligation under the transition-back credit formula
        default: 0
      - name: status
        type: enum
        source: system
        description: obligation lifecycle state
        constraints: "one of {DRAFT, PENDING, IN_PROGRESS, SATISFIED, WAIVED, OVERDUE, DISPUTED, ESCALATED}"
state_machines:
  - entity: Contract
    initial_state: AWARDED
    terminal_states: [TRANSITIONED, TERMINATED]
    transitions:
      - from: AWARDED
        to: MOBILIZING
        trigger: "POST /water-om/contracts/{id}/mobilize"
        actor: OperatorAdmin
        preconditions:
          - "Contract.baseline_frozen == false"
          - "at least one PerformanceStandard under the contract has status ACTIVE"
          - "now >= Contract.contract_start_date"
        side_effects:
          - "each StaffingCommitment under the contract with status DRAFT is transitioned to BINDING"
          - "Contract.staffing_floor_fte recomputed by the staffing_floor formula"
          - "if Contract.staffing_floor_fte > sum of committed_fte over StaffingCommitment rows in status BINDING, the lowest-committed_fte such StaffingCommitment transitions BINDING -> SHORTFALL (tie-break: created_at ASC)"
          - "Contract.status_changed_at stamped"
        note: "Depth-4 cascade origin: mobilize -> bind commitments -> recompute staffing floor -> demote the lowest-committed class."
      - from: MOBILIZING
        to: OPERATING
        trigger: "POST /water-om/contracts/{id}/commence-operating"
        actor: OperatorAdmin
        preconditions:
          - "Contract.baseline_frozen == true"
          - "no StaffingCommitment under the contract has status SHORTFALL"
          - "sum of StaffingCommitment.filled_fte over status IN {BINDING, REMEDIATING, SATISFIED} >= Contract.staffing_floor_fte"
        side_effects:
          - "every Asset under the contract with status BASELINE_ASSESSED transitions to IN_SERVICE"
          - "every PMSchedule under the contract with status DRAFT transitions to ACTIVE"
        note: "Two sibling fan-outs; both target rows are children of the same contract."
      - from: OPERATING
        to: UNDER_REVIEW
        trigger: "POST /water-om/contracts/{id}/reviews"
        actor: MunicipalityAdmin
        preconditions:
          - "now >= Contract.contract_start_date"
          - "Contract.status == OPERATING"
        side_effects:
          - "every PerformanceStandard under the contract with status ACTIVE whose latest PerformanceMeasurement has in_breach == true transitions ACTIVE -> BREACHED"
          - "on each such standard, the owning Contract recomputes total_operator_penalty_cents via the penalty_allocation calculation"
          - "a PerformanceStandard whose recomputed operator share pushes Contract.total_operator_penalty_cents above the review tolerance is left BREACHED and its next PerformanceMeasurement is auto-created with status RECORDED"
        note: "Depth-3 cascade: review -> standard BREACHED -> contract penalty recompute -> auto-created measurement."
      - from: UNDER_REVIEW
        to: OPERATING
        trigger: "POST /water-om/contracts/{id}/reviews"
        actor: OperatorAdmin
        preconditions:
          - "Contract.status == UNDER_REVIEW"
          - "no PerformanceStandard under the contract has status BREACHED"
        side_effects:
          - "Contract.renewal_round unchanged"
          - "Contract.status_changed_at stamped"
        note: "Cycle edge: a reviewed contract that clears all breaches returns to OPERATING."
      - from: UNDER_REVIEW
        to: RENEWAL_PENDING
        trigger: "POST /water-om/contracts/{id}/renewals"
        actor: OperatorAdmin
        preconditions:
          - "now >= Contract.contract_end_date - 180 days"
          - "Contract.baseline_frozen == true"
        side_effects:
          - "Contract.status_changed_at stamped"
          - "no RenewalProposal is created by this transition; proposals are submitted separately"
      - from: RENEWAL_PENDING
        to: RENEWED
        trigger: "POST /water-om/renewal-proposals/{id}/accept"
        actor: MunicipalityAdmin
        preconditions:
          - "RenewalProposal.status == SUBMITTED or UNDER_REVIEW"
          - "RenewalProposal.round_number == Contract.renewal_round + 1"
          - "RenewalProposal.proposed_term_years >= 1"
        side_effects:
          - "Contract.renewal_round incremented by 1"
          - "Contract.annual_fee_cents set to RenewalProposal.proposed_fee_cents"
          - "Contract.contract_end_date extended by RenewalProposal.proposed_term_years * 365 days"
          - "the accepting RenewalProposal transitions to ACCEPTED and every other non-terminal RenewalProposal under the contract transitions to LAPSED"
      - from: RENEWED
        to: OPERATING
        trigger: "system event: renewal term effective at Contract.contract_start_date of the new term"
        actor: system
        preconditions:
          - "now >= Contract.contract_start_date"
        side_effects:
          - "every PerformanceStandard under the contract with status RETIRED transitions to DRAFT"
          - "Contract.staffing_floor_fte recomputed"
        note: "Cycle-closing edge: RENEWED returns the contract to OPERATING, closing the RENEWAL_PENDING -> RENEWED -> OPERATING loop."
      - from: RENEWAL_PENDING
        to: HANDING_BACK
        trigger: "POST /water-om/contracts/{id}/hand-back"
        actor: MunicipalityAdmin
        preconditions:
          - "no RenewalProposal under the contract has status SUBMITTED"
          - "Contract.baseline_frozen == true"
        side_effects:
          - "for each Asset under the contract, a TransitionObligation of obligation_type ASSET_HANDOVER is created in status PENDING"
          - "for each Employee under the contract with status IN {TRANSFERRED, INDUCTION, ACTIVE}, a TransitionObligation of obligation_type EMPLOYEE_REINSTATE is created in status PENDING"
          - "Contract.status_changed_at stamped"
      - from: UNDER_REVIEW
        to: HANDING_BACK
        trigger: "POST /water-om/contracts/{id}/hand-back"
        actor: MunicipalityAdmin
        preconditions:
          - "Contract.baseline_frozen == true"
          - "no RenewalProposal under the contract has status SUBMITTED"
        side_effects:
          - "for each Asset under the contract, a TransitionObligation of obligation_type ASSET_HANDOVER is created in status PENDING"
          - "Contract.status_changed_at stamped"
      - from: HANDING_BACK
        to: RENEWAL_PENDING
        trigger: "POST /water-om/contracts/{id}/renewals"
        actor: MunicipalityAdmin
        preconditions:
          - "every TransitionObligation under the contract with is_critical == true has status IN {SATISFIED, WAIVED}"
        side_effects:
          - "every TransitionObligation under the contract with status IN {PENDING, IN_PROGRESS} transitions to WAIVED"
          - "Contract.status_changed_at stamped"
        note: "Second cycle-closing edge: a hand-back that satisfies its critical obligations can fall back into renewal."
      - from: HANDING_BACK
        to: TRANSITIONED
        trigger: "POST /water-om/contracts/{id}/complete-hand-back"
        actor: MunicipalityAdmin
        preconditions:
          - "no TransitionObligation under the contract with is_critical == true has status IN {PENDING, IN_PROGRESS, OVERDUE, ESCALATED}"
          - "Contract.status == HANDING_BACK"
        side_effects:
          - "every Asset under the contract with status IN_SERVICE transitions to OUT_OF_SERVICE"
          - "every Permit under the contract with status ACTIVE transitions to EXPIRED"
          - "every PMSchedule under the contract with status IN {ACTIVE, DUE, OVERDUE} transitions to RETIRED"
          - "Contract.status_changed_at stamped"
      - from: OPERATING
        to: TERMINATED
        trigger: "POST /water-om/contracts/{id}/terminate"
        actor: MunicipalityAdmin
        preconditions:
          - "Contract.status == OPERATING"
        side_effects:
          - "every Employee under the contract with status IN {TRANSFERRED, INDUCTION, ACTIVE, OFFERED, ACCEPTED} transitions to SEPARATED"
          - "every Permit under the contract with status ACTIVE transitions to SUSPENDED"
          - "every PMSchedule under the contract with status IN {ACTIVE, DUE, OVERDUE} transitions to SUSPENDED"
      - from: UNDER_REVIEW
        to: TERMINATED
        trigger: "POST /water-om/contracts/{id}/terminate"
        actor: MunicipalityAdmin
        preconditions:
          - "at least one PerformanceStandard under the contract has status BREACHED"
        side_effects:
          - "every Employee under the contract with status IN {TRANSFERRED, INDUCTION, ACTIVE} transitions to SEPARATED"
          - "every Permit under the contract with status ACTIVE transitions to SUSPENDED"
  - entity: PerformanceStandard
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /water-om/contracts/{id}/performance-standards/{sid}/activate"
        actor: OperatorAdmin
        preconditions:
          - "PerformanceStandard.criticality_weight > 0.0"
          - "PerformanceStandard.threshold_value is set"
        side_effects:
          - "PerformanceStandard.status_changed_at stamped"
          - "Contract.staffing_floor_fte recomputed by the staffing_floor formula"
      - from: ACTIVE
        to: BREACHED
        trigger: "POST /water-om/performance-standards/{id}/measurements (in_breach computed true) or the UNDER_REVIEW cascade"
        actor: system
        preconditions:
          - "the latest PerformanceMeasurement under this standard has in_breach == true"
        side_effects:
          - "PerformanceStandard.breach_reason_code set to the metric_type of the breached measurement"
          - "Contract.total_operator_penalty_cents increased by the operator share computed by the penalty_allocation calculation"
          - "if Contract.total_operator_penalty_cents > Municipality.benchmark_index_baseline * 100000, the owning Municipality recomputes benchmark_index_baseline"
        note: "Depth-3 cascade link 2: standard BREACHED -> contract penalty -> municipality benchmark recompute."
      - from: BREACHED
        to: SUSPENDED
        trigger: "POST /water-om/performance-standards/{id}/suspend"
        actor: OperatorAdmin
        preconditions:
          - "PerformanceStandard.breach_reason_code != \"\""
          - "at least two PerformanceMeasurements under this standard have status CONFIRMED"
        side_effects:
          - "every PerformanceMeasurement under this standard with status IN {RECORDED, ASSESSED} transitions to WAIVED"
      - from: BREACHED
        to: ACTIVE
        trigger: "POST /water-om/performance-standards/{id}/clear-breach"
        actor: MunicipalityAdmin
        preconditions:
          - "PerformanceStandard.status_changed_at is at least 30 days before now"
          - "the latest PerformanceMeasurement under this standard has in_breach == false"
        side_effects:
          - "PerformanceStandard.breach_reason_code reset to \"\""
          - "the owning Contract recomputes total_operator_penalty_cents by subtracting the allocated operator share of the cleared breach"
        note: "Revert edge: BREACHED -> ACTIVE returns the standard to operation."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /water-om/performance-standards/{id}/reactivate"
        actor: OperatorAdmin
        preconditions:
          - "PerformanceStandard.status == SUSPENDED"
          - "Contract.status IN {MOBILIZING, OPERATING, UNDER_REVIEW, RENEWED}"
        side_effects:
          - "PerformanceStandard.breach_reason_code reset to \"\""
          - "Contract.staffing_floor_fte recomputed"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /water-om/performance-standards/{id}/retire"
        actor: MunicipalityAdmin
        preconditions:
          - "at least one PerformanceMeasurement under this standard has status CONFIRMED"
          - "no PerformanceMeasurement under this standard has status RECORDED"
        side_effects:
          - "Contract.staffing_floor_fte recomputed"
  - entity: PerformanceMeasurement
    initial_state: RECORDED
    terminal_states: [CONFIRMED, WAIVED]
    transitions:
      - from: RECORDED
        to: ASSESSED
        trigger: "POST /water-om/performance-measurements/{id}/assess"
        actor: OperatorAdmin
        preconditions:
          - "PerformanceMeasurement.in_breach computed from the owning standard's threshold_direction"
        side_effects:
          - "PerformanceMeasurement.weighted_breach_score set by the breach_score formula"
          - "if in_breach == true and weighted_breach_score >= 0.60, the owning PerformanceStandard transitions ACTIVE -> BREACHED"
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /water-om/performance-measurements/{id}/dispute"
        actor: MunicipalityAdmin
        preconditions:
          - "PerformanceMeasurement.in_breach == true"
          - "now < PerformanceMeasurement.period_end + 30 days"
        side_effects:
          - "PerformanceMeasurement.status_changed_at stamped"
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /water-om/performance-measurements/{id}/revise"
        actor: OperatorAdmin
        preconditions:
          - "PerformanceMeasurement.measured_value == the value submitted by the disputing municipality"
        side_effects:
          - "PerformanceMeasurement.weighted_breach_score recomputed by the breach_score formula"
        note: "Cycle edge: DISPUTED -> ASSESSED -> DISPUTED is permitted without limit while the period window is open."
      - from: ASSESSED
        to: CONFIRMED
        trigger: "POST /water-om/performance-measurements/{id}/confirm"
        actor: MunicipalityAdmin
        preconditions:
          - "PerformanceMeasurement.status == ASSESSED"
          - "the owning PerformanceStandard.status == BREACHED implies at least two CONFIRMED measurements exist under it"
        side_effects:
          - "PerformanceMeasurement.status_changed_at stamped"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /water-om/performance-measurements/{id}/waive"
        actor: MunicipalityAdmin
        preconditions:
          - "PerformanceMeasurement.in_breach == true"
          - "the owning Permit under the same contract has status NOTICE_OF_VIOLATION"
        side_effects:
          - "PerformanceMeasurement.in_breach reset to false"
          - "the owning PerformanceStandard recomputes breach_reason_code from its remaining in_breach measurements"
  - entity: StaffingCommitment
    initial_state: DRAFT
    terminal_states: [SUSPENDED]
    transitions:
      - from: DRAFT
        to: BINDING
        trigger: "POST /water-om/contracts/{id}/staffing-commitments/{cid}/bind or the Contract MOBILIZING cascade"
        actor: OperatorAdmin
        preconditions:
          - "StaffingCommitment.committed_fte >= 0"
          - "Contract.status == MOBILIZING"
        side_effects:
          - "StaffingCommitment.vacancy_fte recomputed as max(0, committed_fte - filled_fte)"
      - from: BINDING
        to: SHORTFALL
        trigger: "POST /water-om/staffing-commitments/{id}/evaluate or the Contract mobilization cascade"
        actor: system
        preconditions:
          - "StaffingCommitment.filled_fte < StaffingCommitment.committed_fte"
        side_effects:
          - "StaffingCommitment.vacancy_fte recomputed"
          - "if this class is the unique highest-criticality class in shortfall, the owning Employee rows in status ACTIVE under the contract are flagged for REINSTATE obligations"
      - from: SHORTFALL
        to: REMEDIATING
        trigger: "POST /water-om/staffing-commitments/{id}/remedy"
        actor: OperatorAdmin
        preconditions:
          - "a remedy plan is supplied and at least one Employee under the contract has status OFFERED for this role_code"
        side_effects:
          - "StaffingCommitment.status_changed_at stamped"
      - from: REMEDIATING
        to: SATISFIED
        trigger: "POST /water-om/staffing-commitments/{id}/evaluate"
        actor: system
        preconditions:
          - "StaffingCommitment.filled_fte >= StaffingCommitment.committed_fte"
        side_effects:
          - "StaffingCommitment.vacancy_fte reset to 0"
          - "every Employee under the contract with status OFFERED for this role_code transitions to WITHDRAWN"
      - from: REMEDIATING
        to: SHORTFALL
        trigger: "POST /water-om/staffing-commitments/{id}/evaluate"
        actor: system
        preconditions:
          - "StaffingCommitment.filled_fte < StaffingCommitment.committed_fte"
          - "now >= StaffingCommitment.status_changed_at + 30 days"
        side_effects:
          - "StaffingCommitment.vacancy_fte recomputed"
          - "the owning Contract.status is set to UNDER_REVIEW when the contract is in OPERATING"
        note: "Cycle edge: SHORTFALL -> REMEDIATING -> SHORTFALL repeats every evaluation window."
      - from: BINDING
        to: SUSPENDED
        trigger: "POST /water-om/staffing-commitments/{id}/suspend"
        actor: MunicipalityAdmin
        preconditions:
          - "Contract.status IN {HANDING_BACK, TERMINATED}"
        side_effects:
          - "StaffingCommitment.filled_fte reset to 0"
      - from: SATISFIED
        to: SUSPENDED
        trigger: "POST /water-om/staffing-commitments/{id}/suspend"
        actor: MunicipalityAdmin
        preconditions:
          - "Contract.status IN {HANDING_BACK, TERMINATED}"
        side_effects:
          - "StaffingCommitment.filled_fte reset to 0"
  - entity: Employee
    initial_state: MUNICIPAL
    terminal_states: [SEPARATED, DECLINED, WITHDRAWN]
    transitions:
      - from: MUNICIPAL
        to: OFFERED
        trigger: "POST /water-om/contracts/{id}/employees/{eid}/offer"
        actor: OperatorAdmin
        preconditions:
          - "Employee.transfer_offer_fte > 0"
          - "the matching StaffingCommitment under the contract has status IN {BINDING, REMEDIATING}"
          - "Contract.status IN {MOBILIZING, OPERATING}"
        side_effects:
          - "Employee.benefit_tier computed by the vesting formula"
          - "Employee.pension_offset_cents computed by the pension_offset formula"
          - "Employee.municipal_years_of_service computed from municipal_hire_date to Contract.contract_start_date"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /water-om/employees/{id}/accept"
        actor: Employee
        preconditions:
          - "Employee.status == OFFERED"
          - "now < Employee.status_changed_at + 21 days"
        side_effects:
          - "Employee.status_changed_at stamped"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /water-om/employees/{id}/decline"
        actor: Employee
        preconditions:
          - "Employee.status == OFFERED"
        side_effects:
          - "the matching StaffingCommitment.filled_fte recomputed as the sum of transferred_fte over Employees in status IN {TRANSFERRED, INDUCTION, ACTIVE} for that role_code"
          - "if that recomputed filled_fte < committed_fte the StaffingCommitment transitions BINDING -> SHORTFALL"
        note: "Cross-entity edge: a declined offer can demote a sibling staffing commitment."
      - from: ACCEPTED
        to: TRANSFERRED
        trigger: "POST /water-om/employees/{id}/transfer"
        actor: OperatorAdmin
        preconditions:
          - "Contract.baseline_frozen == true"
          - "now >= Contract.contract_start_date"
        side_effects:
          - "Employee.status_changed_at stamped"
          - "the matching StaffingCommitment.filled_fte increased by Employee.transfer_offer_fte"
          - "if that increased filled_fte >= committed_fte and the commitment is in SHORTFALL, it transitions SHORTFALL -> SATISFIED"
        note: "Cross-entity edge: a transfer can satisfy a sibling commitment."
      - from: TRANSFERRED
        to: INDUCTION
        trigger: "POST /water-om/employees/{id}/begin-induction"
        actor: OperatorAdmin
        preconditions:
          - "Employee.status == TRANSFERRED"
          - "now < Contract.contract_start_date + 30 days"
        side_effects:
          - "Employee.status_changed_at stamped"
      - from: INDUCTION
        to: ACTIVE
        trigger: "POST /water-om/employees/{id}/complete-induction"
        actor: OperatorAdmin
        preconditions:
          - "Employee.pension_offset_cents >= 0"
          - "at least one TransitionObligation of obligation_type EMPLOYEE_REINSTATE is not required for this employee while Contract.status == OPERATING"
        side_effects:
          - "Employee.status_changed_at stamped"
          - "the matching StaffingCommitment.filled_fte recomputed"
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /water-om/employees/{id}/separate or the Contract TERMINATED cascade"
        actor: OperatorAdmin
        preconditions:
          - "Employee.status == ACTIVE"
        side_effects:
          - "the matching StaffingCommitment.filled_fte recomputed"
          - "if that recomputed filled_fte < committed_fte the StaffingCommitment transitions BINDING -> SHORTFALL"
      - from: ACCEPTED
        to: DECLINED
        trigger: "POST /water-om/employees/{id}/decline"
        actor: Employee
        preconditions:
          - "now >= Employee.status_changed_at + 7 days"
        side_effects:
          - "the matching StaffingCommitment.filled_fte recomputed"
      - from: OFFERED
        to: MUNICIPAL
        trigger: "POST /water-om/employees/{id}/withdraw-offer"
        actor: OperatorAdmin
        preconditions:
          - "Employee.status == OFFERED"
          - "now < Contract.contract_start_date"
        side_effects:
          - "Employee.benefit_tier reset to NONE"
          - "Employee.pension_offset_cents reset to 0"
        note: "Revert edge: an offer withdrawn before the operating period returns the employee to MUNICIPAL."
  - entity: Asset
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: BASELINE_ASSESSED
        trigger: "POST /water-om/assets/{id}/baseline-assessments (first submitted assessment with is_baseline == true)"
        actor: OperatorAdmin
        preconditions:
          - "Asset.status == REGISTERED"
          - "Contract.status IN {AWARDED, MOBILIZING}"
        side_effects:
          - "Asset.condition_score set to the submitted assessed_score"
          - "Asset.condition_band recomputed from condition_score"
      - from: REGISTERED
        to: BASELINE_DISPUTED
        trigger: "POST /water-om/assets/{id}/baseline-assessments with assessor_party == MUNICIPALITY on a REGISTERED asset"
        actor: MunicipalityAdmin
        preconditions:
          - "an AssetConditionAssessment under this asset already exists with assessor_party == OPERATOR and is_baseline == true"
        side_effects:
          - "Asset.condition_score set to the municipality's assessed_score"
          - "Asset.condition_band recomputed from condition_score"
        note: "Branch divergence: a municipality-disputed baseline lands on a different state and never passes through BASELINE_ASSESSED."
      - from: BASELINE_ASSESSED
        to: IN_SERVICE
        trigger: "system cascade from Contract MOBILIZING"
        actor: system
        preconditions:
          - "the accepted AssetConditionAssessment for this asset has status ACCEPTED"
        side_effects:
          - "AssetConditionAssessment.baseline_binding set to true on the accepted baseline row"
      - from: BASELINE_DISPUTED
        to: IN_SERVICE
        trigger: "system cascade from Contract MOBILIZING"
        actor: system
        preconditions:
          - "the accepted AssetConditionAssessment for this asset has status ACCEPTED"
          - "Contract.baseline_frozen == true"
        side_effects:
          - "AssetConditionAssessment.baseline_binding set to true on the accepted baseline row"
      - from: IN_SERVICE
        to: REPLACEMENT_FLAGGED
        trigger: "POST /water-om/assets/{id}/flag-replacement or the PM overdue cascade or the work order closure cascade"
        actor: OperatorAdmin
        preconditions:
          - "Asset.condition_score < 40.0"
          - "Contract.baseline_frozen == true"
          - "now >= Asset.install_year + Asset.useful_life_years resolved to January 1 of that year"
        side_effects:
          - "Asset.replacement_flagged_at stamped"
          - "a WorkOrder of work_type CORRECTIVE with expense_class CAPITAL_LIFE_EVENT is created under this asset in status DRAFT"
        note: "Depth-4 cascade link 3: an Asset entering REPLACEMENT_FLAGGED itself creates a further WorkOrder."
      - from: REPLACEMENT_FLAGGED
        to: REPLACED
        trigger: "POST /water-om/assets/{id}/complete-replacement"
        actor: OperatorAdmin
        preconditions:
          - "the capital-class WorkOrder created by the flagging transition has status CLOSED"
          - "Asset.status == REPLACEMENT_FLAGGED"
        side_effects:
          - "Asset.install_year set from the closure payload"
          - "Asset.condition_score reset to 100.0"
          - "Asset.condition_band recomputed to EXCELLENT"
          - "every PMSchedule under this asset with status IN {ACTIVE, DUE, OVERDUE} has next_due_at advanced by frequency_days from now"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /water-om/assets/{id}/take-out-of-service or the Contract TRANSITIONED cascade"
        actor: OperatorAdmin
        preconditions:
          - "no WorkOrder under this asset has status IN {SCHEDULED, IN_PROGRESS, PAUSED, AWAITING_PARTS}"
        side_effects:
          - "every PMSchedule under this asset with status IN {ACTIVE, DUE, OVERDUE} transitions to SUSPENDED"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /water-om/assets/{id}/return-to-service"
        actor: OperatorAdmin
        preconditions:
          - "Contract.status IN {OPERATING, UNDER_REVIEW, RENEWED}"
          - "Asset.condition_score >= 40.0"
        side_effects:
          - "every PMSchedule under this asset with status SUSPENDED transitions to ACTIVE"
        note: "Revert edge: an out-of-service asset can be returned while the contract is live."
      - from: REPLACEMENT_FLAGGED
        to: IN_SERVICE
        trigger: "POST /water-om/assets/{id}/clear-replacement-flag"
        actor: MunicipalityAdmin
        preconditions:
          - "Asset.status == REPLACEMENT_FLAGGED"
          - "Asset.condition_score >= 40.0"
        side_effects:
          - "Asset.replacement_flagged_at cleared"
          - "the DRAFT capital-class WorkOrder created by the flagging transition is cancelled if it has not left DRAFT"
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /water-om/assets/{id}/retire"
        actor: MunicipalityAdmin
        preconditions:
          - "Asset.status == OUT_OF_SERVICE"
          - "Contract.status IN {HANDING_BACK, TRANSITIONED}"
        side_effects:
          - "Asset.condition_score frozen at its current value"
  - entity: AssetConditionAssessment
    initial_state: DRAFTED
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /water-om/assets/{id}/baseline-assessments"
        actor: OperatorAdmin
        preconditions:
          - "AssetConditionAssessment.assessed_score between 0.0 and 100.0"
        side_effects:
          - "AssetConditionAssessment.status_changed_at stamped"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /water-om/asset-assessments/{id}/dispute"
        actor: MunicipalityAdmin
        preconditions:
          - "now < AssetConditionAssessment.assessed_at + 30 days"
          - "the owning Contract.baseline_frozen == false"
        side_effects:
          - "the owning Asset transitions REGISTERED -> BASELINE_DISPUTED when the disputed row has is_baseline == true"
        note: "Revert-style branch: disputing a baseline assessment moves its Asset onto the BASELINE_DISPUTED branch."
      - from: DISPUTED
        to: REVISED
        trigger: "POST /water-om/asset-assessments/{id}/revise"
        actor: OperatorAdmin
        preconditions:
          - "a revised assessed_score is supplied"
          - "AssetConditionAssessment.status == DISPUTED"
        side_effects:
          - "the owning Asset.condition_score set to the revised score"
          - "Asset.condition_band recomputed"
        note: "Cycle edge: DISPUTED -> REVISED -> DISPUTED is permitted while baseline_frozen == false."
      - from: REVISED
        to: DISPUTED
        trigger: "POST /water-om/asset-assessments/{id}/dispute"
        actor: MunicipalityAdmin
        preconditions:
          - "the owning Contract.baseline_frozen == false"
        side_effects:
          - "the owning Asset transitions REGISTERED -> BASELINE_DISPUTED when the disputed row has is_baseline == true"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /water-om/asset-assessments/{id}/accept"
        actor: MunicipalityAdmin
        preconditions:
          - "AssetConditionAssessment.status == SUBMITTED"
          - "the owning Contract.status IN {AWARDED, MOBILIZING, OPERATING, UNDER_REVIEW}"
        side_effects:
          - "AssetConditionAssessment.baseline_binding set to true when is_baseline == true"
          - "the owning Asset transitions REGISTERED -> BASELINE_ASSESSED when is_baseline == true and the asset is still REGISTERED"
      - from: REVISED
        to: ACCEPTED
        trigger: "POST /water-om/asset-assessments/{id}/accept"
        actor: MunicipalityAdmin
        preconditions:
          - "AssetConditionAssessment.status == REVISED"
        side_effects:
          - "AssetConditionAssessment.baseline_binding set to true when is_baseline == true"
          - "the owning Asset transitions BASELINE_DISPUTED -> IN_SERVICE when Contract.status == MOBILIZING"
  - entity: Permit
    initial_state: APPLICATION_DRAFTED
    terminal_states: [EXPIRED]
    transitions:
      - from: APPLICATION_DRAFTED
        to: SUBMITTED
        trigger: "POST /water-om/permits/{id}/submit-application"
        actor: OperatorAdmin
        preconditions:
          - "Permit.expiration_date > Permit.effective_date"
        side_effects:
          - "Permit.status_changed_at stamped"
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /water-om/permits/{id}/issue"
        actor: MunicipalityAdmin
        preconditions:
          - "Permit.status == SUBMITTED"
          - "the owning Contract.baseline_frozen == true"
        side_effects:
          - "Permit.status_changed_at stamped"
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /water-om/permits/{id}/activate"
        actor: OperatorAdmin
        preconditions:
          - "now >= Permit.effective_date"
          - "the owning Contract.status IN {OPERATING, UNDER_REVIEW, RENEWED}"
        side_effects:
          - "Permit.status_changed_at stamped"
      - from: ACTIVE
        to: NOTICE_OF_VIOLATION
        trigger: "POST /water-om/permits/{id}/notices-of-violation"
        actor: MunicipalityAdmin
        preconditions:
          - "a PenaltyAllocation under this permit has status IN {ALLOCATED, CONTESTED, ADJUSTED}"
        side_effects:
          - "the offending PenaltyAllocation.status is set to CONTESTED when it was ALLOCATED"
        note: "Depth-2 cascade origin B: permit violation -> allocation contested."
      - from: NOTICE_OF_VIOLATION
        to: ACTIVE
        trigger: "POST /water-om/permits/{id}/clear-violation"
        actor: MunicipalityAdmin
        preconditions:
          - "every PenaltyAllocation under this permit has status IN {SETTLED, VOIDED}"
        side_effects:
          - "Permit.status_changed_at stamped"
      - from: ACTIVE
        to: RENEWAL_FILED
        trigger: "POST /water-om/permits/{id}/file-renewal"
        actor: OperatorAdmin
        preconditions:
          - "now >= Permit.expiration_date - 180 days"
        side_effects:
          - "Permit.effective_date advanced by 365 days"
          - "Permit.expiration_date advanced by 365 days"
      - from: RENEWAL_FILED
        to: ACTIVE
        trigger: "POST /water-om/permits/{id}/activate-renewal"
        actor: MunicipalityAdmin
        preconditions:
          - "Permit.status == RENEWAL_FILED"
        side_effects:
          - "Permit.status_changed_at stamped"
        note: "Cycle edge: RENEWAL_FILED -> ACTIVE closes the permit renewal loop."
      - from: RENEWAL_FILED
        to: SUSPENDED
        trigger: "POST /water-om/permits/{id}/suspend"
        actor: MunicipalityAdmin
        preconditions:
          - "at least one PenaltyAllocation under this permit has status CONTESTED"
        side_effects:
          - "every PerformanceMeasurement under the same contract with status ASSESSED and in_breach == true is eligible for waiving"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /water-om/permits/{id}/suspend or the Contract TERMINATED cascade"
        actor: MunicipalityAdmin
        preconditions:
          - "Permit.status == ACTIVE"
        side_effects:
          - "every PMSchedule under the permit's contract with status ACTIVE referencing a TREATMENT_UNIT asset transitions to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /water-om/permits/{id}/reinstate"
        actor: MunicipalityAdmin
        preconditions:
          - "no PenaltyAllocation under this permit has status IN {ALLOCATED, CONTESTED}"
        side_effects:
          - "Permit.status_changed_at stamped"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: Contract TRANSITIONED cascade"
        actor: system
        preconditions:
          - "the owning Contract.status == TRANSITIONED"
        side_effects:
          - "Permit.status_changed_at stamped"
  - entity: PenaltyAllocation
    initial_state: ALLOCATED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: ALLOCATED
        to: CONTESTED
        trigger: "POST /water-om/penalty-allocations/{id}/contest or the Permit NOTICE_OF_VIOLATION cascade"
        actor: MunicipalityAdmin
        preconditions:
          - "PenaltyAllocation.status == ALLOCATED"
          - "now < PenaltyAllocation.status_changed_at + 60 days"
        side_effects:
          - "PenaltyAllocation.status_changed_at stamped"
      - from: CONTESTED
        to: ADJUSTED
        trigger: "POST /water-om/penalty-allocations/{id}/adjust"
        actor: MunicipalityAdmin
        preconditions:
          - "a revised total_penalty_cents is supplied"
          - "PenaltyAllocation.status == CONTESTED"
        side_effects:
          - "PenaltyAllocation.operator_share_cents recomputed by the penalty_allocation formula"
          - "PenaltyAllocation.municipality_share_cents recomputed as total minus operator share"
          - "PenaltyAllocation.state_baseline_share_cents recomputed by the chronological variant"
          - "the owning Contract.total_operator_penalty_cents adjusted by the difference in operator share"
        note: "Depth-2 cascade: an adjusted allocation mutates the contract's penalty total."
      - from: CONTESTED
        to: VOIDED
        trigger: "POST /water-om/penalty-allocations/{id}/void"
        actor: MunicipalityAdmin
        preconditions:
          - "no PenaltyAllocation under the same permit has status SETTLED"
        side_effects:
          - "the owning Contract.total_operator_penalty_cents decreased by the previously allocated operator share"
      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /water-om/penalty-allocations/{id}/settle"
        actor: MunicipalityAdmin
        preconditions:
          - "the owning Municipality.total_operator_penalty_cents equals the sum of operator_share_cents over this municipality's non-void allocations"
          - "PenaltyAllocation.status == ADJUSTED"
        side_effects:
          - "PenaltyAllocation.status_changed_at stamped"
      - from: ALLOCATED
        to: SETTLED
        trigger: "POST /water-om/penalty-allocations/{id}/settle"
        actor: MunicipalityAdmin
        preconditions:
          - "the allocation was never contested within the 60 day window"
        side_effects:
          - "PenaltyAllocation.status_changed_at stamped"
      - from: ADJUSTED
        to: CONTESTED
        trigger: "POST /water-om/penalty-allocations/{id}/contest"
        actor: MunicipalityAdmin
        preconditions:
          - "PenaltyAllocation.status == ADJUSTED"
          - "now < PenaltyAllocation.status_changed_at + 60 days"
        side_effects:
          - "PenaltyAllocation.status_changed_at stamped"
        note: "Cycle edge: ADJUSTED -> CONTESTED -> ADJUSTED repeats until the 60 day window closes."
  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /water-om/work-orders/{id}/schedule"
        actor: OperatorAdmin
        preconditions:
          - "WorkOrder.estimated_cost_cents > 0"
          - "the owning Contract.status IN {MOBILIZING, OPERATING, UNDER_REVIEW, RENEWED}"
        side_effects:
          - "WorkOrder.expense_class recomputed by the expense_class boundary rule"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /water-om/work-orders/{id}/start"
        actor: OperatorAdmin
        preconditions:
          - "WorkOrder.status == SCHEDULED"
          - "WorkOrder.expense_class != REJECTED_AS_CAPITAL"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
      - from: IN_PROGRESS
        to: PAUSED
        trigger: "POST /water-om/work-orders/{id}/pause"
        actor: OperatorAdmin
        preconditions:
          - "a pause reason is supplied"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
      - from: PAUSED
        to: IN_PROGRESS
        trigger: "POST /water-om/work-orders/{id}/resume"
        actor: OperatorAdmin
        preconditions:
          - "WorkOrder.status == PAUSED"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
        note: "Revert edge: PAUSED -> IN_PROGRESS -> PAUSED repeats."
      - from: IN_PROGRESS
        to: AWAITING_PARTS
        trigger: "POST /water-om/work-orders/{id}/await-parts"
        actor: OperatorAdmin
        preconditions:
          - "the owning Contract.status == OPERATING"
          - "WorkOrder.actual_cost_cents > 0"
        side_effects:
          - "WorkOrder.cost_variance_cents recomputed by the cost_variance formula"
      - from: AWAITING_PARTS
        to: IN_PROGRESS
        trigger: "POST /water-om/work-orders/{id}/resume"
        actor: OperatorAdmin
        preconditions:
          - "WorkOrder.status == AWAITING_PARTS"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
        note: "Revert edge: AWAITING_PARTS -> IN_PROGRESS -> AWAITING_PARTS repeats."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /water-om/work-orders/{id}/complete"
        actor: OperatorAdmin
        preconditions:
          - "WorkOrder.status IN {IN_PROGRESS, PAUSED}"
          - "a closure_narrative of at least 40 characters is supplied"
        side_effects:
          - "WorkOrder.actual_cost_cents set to the sum of the supplied labour and materials cost components"
          - "WorkOrder.cost_variance_cents recomputed by the cost_variance formula"
          - "WorkOrder.documentation_complete computed from the closure field rules"
          - "WorkOrder.status is returned with 409 ERR_WORK_ORDER_DOCUMENTATION_INCOMPLETE when documentation_complete == false"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /water-om/work-orders/{id}/complete"
        actor: OperatorAdmin
        preconditions:
          - "a closure_narrative of at least 40 characters is supplied"
        side_effects:
          - "WorkOrder.actual_cost_cents set to the sum of the supplied labour and materials cost components"
          - "WorkOrder.cost_variance_cents recomputed by the cost_variance formula"
          - "WorkOrder.documentation_complete computed from the closure field rules"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /water-om/work-orders/{id}/verify"
        actor: MunicipalityAdmin
        preconditions:
          - "WorkOrder.documentation_complete == true"
          - "WorkOrder.status == COMPLETED"
        side_effects:
          - "the owning Asset.condition_score adjusted by the closure condition delta"
          - "Asset.condition_band recomputed from condition_score"
          - "if Asset.condition_score < 40.0 the owning Asset transitions IN_SERVICE -> REPLACEMENT_FLAGGED"
        note: "Depth-4 cascade link 2: work order verification -> asset condition drop -> replacement flag -> capital work order creation."
      - from: COMPLETED
        to: RETURNED
        trigger: "POST /water-om/work-orders/{id}/return"
        actor: MunicipalityAdmin
        preconditions:
          - "WorkOrder.documentation_complete == false or WorkOrder.expense_class == PENDING_CLASSIFICATION"
        side_effects:
          - "WorkOrder.actual_cost_cents reset to 0"
          - "WorkOrder.cost_variance_cents reset to 0"
      - from: RETURNED
        to: COMPLETED
        trigger: "POST /water-om/work-orders/{id}/complete"
        actor: OperatorAdmin
        preconditions:
          - "a closure_narrative of at least 40 characters is supplied"
          - "WorkOrder.status == RETURNED"
        side_effects:
          - "WorkOrder.actual_cost_cents set to the sum of the supplied labour and materials cost components"
          - "WorkOrder.documentation_complete recomputed"
        note: "Cycle edge: COMPLETED -> RETURNED -> COMPLETED repeats until documentation is complete."
      - from: VERIFIED
        to: CLOSED
        trigger: "POST /water-om/work-orders/{id}/close"
        actor: MunicipalityAdmin
        preconditions:
          - "WorkOrder.submitted_to_municipality_at is more than 5 days before now"
          - "WorkOrder.expense_class != PENDING_CLASSIFICATION"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
      - from: VERIFIED
        to: RETURNED
        trigger: "POST /water-om/work-orders/{id}/return"
        actor: MunicipalityAdmin
        preconditions: []
        side_effects:
          - "WorkOrder.documentation_complete reset to false"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /water-om/work-orders/{id}/cancel"
        actor: OperatorAdmin
        preconditions:
          - "WorkOrder.status == DRAFT"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /water-om/work-orders/{id}/cancel"
        actor: MunicipalityAdmin
        preconditions:
          - "no meter reading or closure data has been recorded for this work order"
        side_effects:
          - "WorkOrder.status_changed_at stamped"
  - entity: PMSchedule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system cascade from Contract MOBILIZING"
        actor: system
        preconditions:
          - "PMSchedule.next_due_at is set"
        side_effects:
          - "PMSchedule.next_due_at set from the owning Contract.contract_start_date plus frequency_days"
      - from: ACTIVE
        to: DUE
        trigger: "system event: the generated PM occurrence reaches its due instant"
        actor: system
        preconditions:
          - "now >= PMSchedule.next_due_at"
        side_effects:
          - "PMSchedule.status_changed_at stamped"
          - "if no PMWorkOrder already exists for this occurrence, a WorkOrder of work_type PREVENTIVE is created in status SCHEDULED under the schedule's asset"
      - from: DUE
        to: ACTIVE
        trigger: "POST /water-om/pm-schedules/{id}/regenerate"
        actor: OperatorAdmin
        preconditions:
          - "the linked preventive WorkOrder has status CLOSED"
          - "the linked preventive WorkOrder.status_changed_at is at most 7 days after PMSchedule.next_due_at"
        side_effects:
          - "PMSchedule.next_due_at advanced by frequency_days"
          - "PMSchedule.compliance_rate_pct recomputed by the PM compliance formula"
        note: "Revert edge: DUE -> ACTIVE on timely completion; this is the compliant path."
      - from: DUE
        to: OVERDUE
        trigger: "system event: the grace window closes"
        actor: system
        preconditions:
          - "now > PMSchedule.next_due_at + 7 days"
          - "the linked preventive WorkOrder.status != CLOSED"
        side_effects:
          - "PMSchedule.missed_occurrence_count incremented by 1"
          - "PMSchedule.compliance_rate_pct recomputed by the PM compliance formula"
          - "PMSchedule.next_due_at advanced by frequency_days"
          - "if the regenerated PMSchedule.missed_occurrence_count reaches exactly 3, the owning Asset transitions IN_SERVICE -> REPLACEMENT_FLAGGED"
        note: "Depth-4 cascade link 1: PM miss -> PMSchedule OVERDUE -> Asset REPLACEMENT_FLAGGED -> Asset creates a capital WorkOrder."
      - from: OVERDUE
        to: ACTIVE
        trigger: "POST /water-om/pm-schedules/{id}/regenerate"
        actor: OperatorAdmin
        preconditions:
          - "the linked preventive WorkOrder has status CLOSED"
        side_effects:
          - "PMSchedule.compliance_rate_pct recomputed by the PM compliance formula"
        note: "Revert edge: OVERDUE -> ACTIVE re-enters the cycle and the loop repeats."
      - from: OVERDUE
        to: SUSPENDED
        trigger: "POST /water-om/pm-schedules/{id}/suspend"
        actor: MunicipalityAdmin
        preconditions:
          - "the owning Contract.status IN {UNDER_REVIEW, TERMINATED, HANDING_BACK}"
        side_effects:
          - "PMSchedule.status_changed_at stamped"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /water-om/pm-schedules/{id}/reactivate"
        actor: OperatorAdmin
        preconditions:
          - "the owning Contract.status IN {OPERATING, RENEWED}"
          - "the owning Asset.status != OUT_OF_SERVICE"
        side_effects:
          - "PMSchedule.next_due_at advanced by frequency_days from now"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /water-om/pm-schedules/{id}/close-out"
        actor: MunicipalityAdmin
        preconditions:
          - "the owning Contract.status == HANDING_BACK"
        side_effects:
          - "PMSchedule.status_changed_at stamped"
      - from: COMPLETED
        to: RETIRED
        trigger: "POST /water-om/pm-schedules/{id}/retire"
        actor: MunicipalityAdmin
        preconditions:
          - "the owning Contract.status IN {HANDING_BACK, TRANSITIONED}"
        side_effects:
          - "PMSchedule.status_changed_at stamped"
  - entity: EmergencyEvent
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: DISPATCHED
        trigger: "POST /water-om/emergency-events/{id}/dispatch"
        actor: OperatorAdmin
        preconditions:
          - "EmergencyEvent.status == REPORTED"
          - "the owning Contract.status IN {OPERATING, UNDER_REVIEW, RENEWED}"
        side_effects:
          - "EmergencyEvent.notify_deadline_at computed by the notification_deadline formula"
      - from: DISPATCHED
        to: CONTAINED
        trigger: "POST /water-om/emergency-events/{id}/contain"
        actor: OperatorAdmin
        preconditions:
          - "EmergencyEvent.status == DISPATCHED"
        side_effects:
          - "EmergencyEvent.response_minutes computed from occurred_at to the containment instant"
          - "if response_minutes exceeds the applicable response-time PerformanceStandard threshold_value, that standard transitions ACTIVE -> BREACHED"
        note: "Depth-3 cascade: contain -> response time breach -> standard BREACHED -> contract penalty recompute."
      - from: CONTAINED
        to: RESTORED
        trigger: "POST /water-om/emergency-events/{id}/restore"
        actor: OperatorAdmin
        preconditions:
          - "EmergencyEvent.status == CONTAINED"
          - "no WorkOrder under the emergency's asset has status IN {IN_PROGRESS, AWAITING_PARTS}"
        side_effects:
          - "EmergencyEvent.status_changed_at stamped"
      - from: CONTAINED
        to: NOTIFIED
        trigger: "POST /water-om/emergency-events/{id}/notify"
        actor: OperatorAdmin
        preconditions:
          - "a notification reference is supplied"
        side_effects:
          - "EmergencyEvent.notified_at stamped"
          - "EmergencyEvent.notification_late computed by the notification_deadline formula"
          - "if notification_late == true the owning Permit transitions ACTIVE -> NOTICE_OF_VIOLATION"
        note: "Depth-3 alternative branch off CONTAINED, with a different side-effect set than RESTORED."
      - from: RESTORED
        to: NOTIFIED
        trigger: "POST /water-om/emergency-events/{id}/notify"
        actor: OperatorAdmin
        preconditions:
          - "a notification reference is supplied"
        side_effects:
          - "EmergencyEvent.notified_at stamped"
          - "EmergencyEvent.notification_late computed by the notification_deadline formula"
      - from: CONTAINED
        to: ESCALATED
        trigger: "POST /water-om/emergency-events/{id}/escalate"
        actor: MunicipalityAdmin
        preconditions:
          - "EmergencyEvent.severity IN {HIGH, CRITICAL}"
          - "now >= EmergencyEvent.occurred_at + 240 minutes"
        side_effects:
          - "every StaffingCommitment under the owning contract in status IN {BINDING, SATISFIED} is flagged for emergency re-staffing"
          - "the owning Contract.status is set to UNDER_REVIEW when the contract is in OPERATING"
      - from: RESTORED
        to: ESCALATED
        trigger: "POST /water-om/emergency-events/{id}/escalate"
        actor: MunicipalityAdmin
        preconditions:
          - "EmergencyEvent.severity == CRITICAL"
        side_effects:
          - "the owning Contract.status is set to UNDER_REVIEW when the contract is in OPERATING"
        note: "Second entry into the same state with a different side-effect set — branch-dependent fan-out."
      - from: NOTIFIED
        to: UNDER_INVESTIGATION
        trigger: "POST /water-om/emergency-events/{id}/investigate"
        actor: MunicipalityAdmin
        preconditions:
          - "EmergencyEvent.notified_at is set"
        side_effects:
          - "EmergencyEvent.status_changed_at stamped"
      - from: ESCALATED
        to: UNDER_INVESTIGATION
        trigger: "POST /water-om/emergency-events/{id}/investigate"
        actor: MunicipalityAdmin
        preconditions:
          - "EmergencyEvent.status == ESCALATED"
        side_effects:
          - "a PenaltyAllocation is created under the owning contract's active Permit in status ALLOCATED"
        note: "Depth-2 cascade origin A: escalation investigation -> allocation created."
      - from: UNDER_INVESTIGATION
        to: CLOSED
        trigger: "POST /water-om/emergency-events/{id}/close"
        actor: MunicipalityAdmin
        preconditions:
          - "no PenaltyAllocation created from this event has status IN {ALLOCATED, CONTESTED}"
        side_effects:
          - "EmergencyEvent.status_changed_at stamped"
  - entity: RenewalProposal
    initial_state: DRAFTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, LAPSED]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /water-om/contracts/{id}/renewal-proposals"
        actor: OperatorAdmin
        preconditions:
          - "RenewalProposal.round_number == Contract.renewal_round + 1"
          - "Contract.status == RENEWAL_PENDING"
        side_effects:
          - "RenewalProposal.benchmark_ratio recomputed by the benchmark comparison formula"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /water-om/renewal-proposals/{id}/review"
        actor: MunicipalityAdmin
        preconditions:
          - "RenewalProposal.status == SUBMITTED"
          - "RenewalProposal.benchmark_ratio <= 1.25"
        side_effects:
          - "RenewalProposal.status_changed_at stamped"
      - from: UNDER_REVIEW
        to: COUNTERED
        trigger: "POST /water-om/renewal-proposals/{id}/counter"
        actor: MunicipalityAdmin
        preconditions:
          - "a counter proposed_fee_cents and proposed_term_years are supplied"
          - "RenewalProposal.status == UNDER_REVIEW"
        side_effects:
          - "a new RenewalProposal is created under the contract in status SUBMITTED with round_number = Contract.renewal_round + 1 and submitted_by = MUNICIPALITY"
          - "RenewalProposal.status_changed_at stamped"
        note: "Cycle edge: each counter creates the next round's proposal, so COUNTERED -> SUBMITTED -> COUNTERED repeats across rounds."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /water-om/renewal-proposals/{id}/accept"
        actor: MunicipalityAdmin
        preconditions:
          - "RenewalProposal.status IN {SUBMITTED, UNDER_REVIEW}"
          - "Contract.status == RENEWAL_PENDING"
        side_effects:
          - "the owning Contract transitions RENEWAL_PENDING -> RENEWED"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /water-om/renewal-proposals/{id}/accept"
        actor: OperatorAdmin
        preconditions:
          - "RenewalProposal.submitted_by == MUNICIPALITY"
          - "RenewalProposal.status == COUNTERED"
        side_effects:
          - "the owning Contract transitions RENEWAL_PENDING -> RENEWED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /water-om/renewal-proposals/{id}/reject"
        actor: MunicipalityAdmin
        preconditions:
          - "a rejection reason is supplied"
        side_effects:
          - "RenewalProposal.status_changed_at stamped"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /water-om/renewal-proposals/{id}/withdraw"
        actor: OperatorAdmin
        preconditions:
          - "RenewalProposal.status == UNDER_REVIEW"
        side_effects:
          - "RenewalProposal.status_changed_at stamped"
        note: "Revert edge: the operator can withdraw while the municipality still has it under review."
      - from: SUBMITTED
        to: LAPSED
        trigger: "system event: the owning Contract leaves RENEWAL_PENDING"
        actor: system
        preconditions:
          - "Contract.status != RENEWAL_PENDING"
        side_effects:
          - "RenewalProposal.status_changed_at stamped"
  - entity: TransitionObligation
    initial_state: DRAFT
    terminal_states: [SATISFIED, WAIVED]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "system cascade from Contract HANDING_BACK"
        actor: system
        preconditions:
          - "Contract.status == HANDING_BACK"
        side_effects:
          - "TransitionObligation.outstanding_days computed by the transition_back_credit formula"
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /water-om/transition-obligations/{id}/start"
        actor: OperatorAdmin
        preconditions:
          - "TransitionObligation.status == PENDING"
          - "now < TransitionObligation.due_at"
        side_effects:
          - "TransitionObligation.status_changed_at stamped"
      - from: PENDING
        to: OVERDUE
        trigger: "system event: the obligation due instant passes"
        actor: system
        preconditions:
          - "now >= TransitionObligation.due_at"
        side_effects:
          - "TransitionObligation.outstanding_days computed"
          - "TransitionObligation.withholding_cents recomputed by the transition_back_credit formula"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "system event: the obligation due instant passes"
        actor: system
        preconditions:
          - "now >= TransitionObligation.due_at"
        side_effects:
          - "TransitionObligation.outstanding_days computed"
          - "TransitionObligation.withholding_cents recomputed by the transition_back_credit formula"
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "POST /water-om/transition-obligations/{id}/satisfy"
        actor: OperatorAdmin
        preconditions:
          - "TransitionObligation.status IN {PENDING, IN_PROGRESS}"
        side_effects:
          - "TransitionObligation.completed_at stamped"
          - "TransitionObligation.outstanding_days reset to 0"
          - "TransitionObligation.withholding_cents reset to 0"
      - from: OVERDUE
        to: DISPUTED
        trigger: "POST /water-om/transition-obligations/{id}/dispute"
        actor: OperatorAdmin
        preconditions:
          - "TransitionObligation.status == OVERDUE"
          - "a dispute basis is supplied"
        side_effects:
          - "TransitionObligation.status_changed_at stamped"
        note: "Revert edge: disputing an overdue obligation suspends the withholding accrual until resolution."
      - from: DISPUTED
        to: OVERDUE
        trigger: "POST /water-om/transition-obligations/{id}/uphold"
        actor: MunicipalityAdmin
        preconditions:
          - "TransitionObligation.status == DISPUTED"
        side_effects:
          - "TransitionObligation.withholding_cents recomputed by the transition_back_credit formula"
        note: "Cycle edge: DISPUTED -> OVERDUE -> DISPUTED repeats while the obligation remains outstanding."
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /water-om/transition-obligations/{id}/waive"
        actor: MunicipalityAdmin
        preconditions:
          - "TransitionObligation.is_critical == false"
        side_effects:
          - "TransitionObligation.withholding_cents reset to 0"
      - from: OVERDUE
        to: ESCALATED
        trigger: "system event: the obligation falls more than 30 whole days past due"
        actor: system
        preconditions:
          - "TransitionObligation.outstanding_days > 30"
        side_effects:
          - "TransitionObligation.status_changed_at stamped"
          - "the owning Contract.status is set to UNDER_REVIEW when the contract is in HANDING_BACK"
        note: "Depth-2 cascade: an obligation's own overdue arithmetic forces its parent contract back for review."
      - from: ESCALATED
        to: SATISFIED
        trigger: "POST /water-om/transition-obligations/{id}/satisfy"
        actor: MunicipalityAdmin
        preconditions:
          - "TransitionObligation.status == ESCALATED"
        side_effects:
          - "TransitionObligation.completed_at stamped"
          - "TransitionObligation.withholding_cents recomputed by the transition_back_credit formula"
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /water-om/transition-obligations/{id}/waive"
        actor: MunicipalityAdmin
        preconditions:
          - "TransitionObligation.is_critical == false"
        side_effects:
          - "TransitionObligation.withholding_cents reset to 0"

concurrency_rules:
  - rule_id: contract-review-stale-version
    parent_entity: Contract
    write_endpoint: "POST /water-om/contracts/{id}/reviews"
    occ_field: "expected_contract_version"
    description: |
      Opening a contract review against a Contract whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      contract's staffing or performance state moved between the client's read and
      its write, so the review would be opened against a stale view of the contract.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-handback-stale-version
    parent_entity: Contract
    write_endpoint: "POST /water-om/contracts/{id}/hand-back"
    occ_field: "expected_contract_version"
    description: |
      Starting the transition-back path against a Contract whose version has advanced
      since the client last observed it is rejected. This captures the case where a
      renewal proposal was accepted or a critical obligation was satisfied between the
      client's read and its write, changing the contract's hand-back eligibility.
    error_id: ERR_STALE_VERSION
    http_status: 412
calculations:
  - name: expense_class_boundary
    trigger: "POST /water-om/work-orders/{id}/schedule (WorkOrder DRAFT -> SCHEDULED) and any mutation of WorkOrder.estimated_cost_cents"
    algorithm: threshold
    formula: |
      # Evaluation order is PINNED: PENDING -> REJECT -> LIFE_EVENT -> THRESHOLD -> OPERATING.
      # Each branch is tested in that order and the first match wins.
      if estimated_cost_cents == 0 or Asset.status NOT IN {BASELINE_ASSESSED, IN_SERVICE, REPLACEMENT_FLAGGED}:
          return PENDING_CLASSIFICATION
      if estimated_cost_cents >= CAPITAL_REJECT_COST_FLOOR_CENTS and Asset.condition_score >= CAPITAL_REJECT_CONDITION_SCORE:
          return REJECTED_AS_CAPITAL
      if estimated_cost_cents >= OPERATING_COST_CEILING_CENTS:
          asset_end_year = Asset.install_year + Asset.useful_life_years
          current_year   = year(now)
          if current_year >= asset_end_year:
              return CAPITAL_LIFE_EVENT
          return CAPITAL_THRESHOLD
      return OPERATING
    input_set: "the single WorkOrder being classified, joined to its owning Asset's condition_score, install_year and useful_life_years; Asset.status filter is BASELINE_ASSESSED, IN_SERVICE or REPLACEMENT_FLAGGED"
    constants:
      OPERATING_COST_CEILING_CENTS: 2500000
      CAPITAL_REJECT_COST_FLOOR_CENTS: 5000000
      CAPITAL_REJECT_CONDITION_SCORE: 60.0
    precision: "integer cents; condition_score compared at 1 decimal place"
    variants:
      - name: capital_threshold_boundary_inclusive
        when: "estimated_cost_cents is exactly 2500000"
        difference: "the >= comparison classifies the work order as CAPITAL, not OPERATING; a > comparison would classify it as OPERATING and shift the funding party"
  - name: work_order_cost_variance
    trigger: "POST /water-om/work-orders/{id}/complete and POST /water-om/work-orders/{id}/await-parts"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round each cost component separately, THEN sum. Summing
      # raw components and rounding once produces different cents.
      labour_component_cents    = round_half_up(labour_hours * LOADED_LABOUR_RATE_CENTS, 0)
      materials_component_cents = round_half_up(materials_cents * MATERIALS_OVERHEAD_FACTOR, 0)
      actual_cost_cents         = labour_component_cents + materials_component_cents
      cost_variance_cents       = actual_cost_cents - estimated_cost_cents
    input_set: "the single WorkOrder being completed; labour_hours and materials_cents are supplied in the closure payload; estimated_cost_cents is the pre-closure estimate"
    constants:
      LOADED_LABOUR_RATE_CENTS: 8450
      MATERIALS_OVERHEAD_FACTOR: 1.0875
    precision: "integer cents; round_half_up applied per component before summation"
    variants:
      - name: sum_then_round
        when: "an implementation rounds (labour + materials) once at the end"
        difference: "round_per_component yields 631703 for 12.5 h at 8450 cents and 483750 cents of materials; sum_then_round yields 631703 as well only when both components are already integral — the variants diverge whenever either raw component carries a fraction, e.g. labour_hours 12.3"
  - name: penalty_allocation
    trigger: "POST /water-om/penalty-allocations (create) and POST /water-om/penalty-allocations/{id}/adjust"
    algorithm: forward_looking
    formula: |
      # DEFAULT (forward-looking) operator share — written to operator_share_cents.
      base_share   = round_half_up(total_penalty_cents * Contract.operator_penalty_share_pct, 0)
      breach_count = count(PerformanceStandard where contract_id = Contract.id and status == BREACHED)
      if breach_count >= 1:
          uplift = round_half_up(total_penalty_cents * BREACH_UPLIFT_PCT, 0)
      else:
          uplift = 0
      operator_share_cents        = min(base_share + uplift, total_penalty_cents)
      municipality_share_cents    = total_penalty_cents - operator_share_cents
    input_set: "the single PenaltyAllocation being created or adjusted, joined to its owning Contract's operator_penalty_share_pct and the count of BREACHED PerformanceStandard rows under that contract"
    constants:
      BREACH_UPLIFT_PCT: 0.15
    precision: "integer cents; round_half_up; municipality share is the exact remainder, never independently rounded"
    variants:
      - name: chronological_recidivist_tier
        when: "the alternative public-operation baseline share, written to state_baseline_share_cents"
        difference: |
          Walk the PenaltyAllocation rows under the same Permit in created_at ASC order (tie-break created_at ASC, then asset_tag of the violation's asset, never id) and treat the row being evaluated as the nth
          (1-indexed) allocation. tier_rate = Contract.operator_penalty_share_pct + min(REPEAT_TIER_STEP_PCT * (n - 1), REPEAT_TIER_CAP_PCT).
          state_baseline_share_cents = round_half_up(total_penalty_cents * tier_rate, 0), capped at total_penalty_cents. This applies no breach uplift at all, so
          the first allocation under a permit (n = 1) yields exactly 720000, while the forward-looking variant yields exactly 1620000 on
          the same inputs when one PerformanceStandard under the contract is BREACHED, and exactly 720000 when none is.
  - name: benchmark_comparison
    trigger: "POST /water-om/contracts/{id}/renewal-proposals and POST /water-om/renewal-proposals/{id}/review"
    algorithm: weighted_scoring
    formula: |
      # DEFAULT (forward-looking) index — written to Municipality.benchmark_index_baseline.
      daily_mgd(contract)      = Municipality.population_served * MGD_PER_CAPITA
      annual_mg(contract)      = daily_mgd(contract) * 365
      cost_per_mg(contract)    = Contract.annual_fee_cents / annual_mg(contract)
      included = contracts whose status IN {OPERATING, UNDER_REVIEW, RENEWED}
      benchmark_index_baseline = round_half_up(mean(cost_per_mg(c) for c in included), 4)
      if included is empty: benchmark_index_baseline = 0.0
      # RenewalProposal.benchmark_ratio is then:
      ratio_base_cents = round_half_up(Municipality.benchmark_index_baseline * Contract.staffing_floor_fte * 12, 0)
      benchmark_ratio  = round_half_up(RenewalProposal.proposed_fee_cents / ratio_base_cents, 4)
    input_set: "all Contract rows of the owning Municipality, filtered by status; the RenewalProposal being submitted supplies proposed_fee_cents and reads the owning Contract.staffing_floor_fte"
    constants:
      MGD_PER_CAPITA: 0.00011
    precision: "index rounded to 4 decimal places round_half_up; benchmark_ratio rounded to 4 decimal places round_half_up"
    variants:
      - name: chronological_all_contracts_recency_weighted
        when: "the public-operation comparison basis, computed on demand by GET /water-om/municipalities/{id}/benchmark"
        difference: |
          Uses every Contract of the municipality regardless of status, walked in award_date ASC order (tie-break award_date ASC, then created_at ASC, never id), with weight 1.0 on
          every row except the single most recently awarded row which carries weight RECENCY_WEIGHT = 1.5. The result is
          sum(weight * cost_per_mg) / sum(weight), rounded to 4 places. For two contracts at 30000.0000 and 20000.0000 cost per million gallons with the later one weighted 1.5
          this yields 24000.0000, while the forward-looking variant yields 30000.0000 when only the first contract is in a live status.
  - name: staffing_floor
    trigger: "POST /water-om/contracts/{id}/performance-standards/{sid}/activate, POST /water-om/contracts/{id}/mobilize, and any PerformanceStandard status change"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED. base_fte is computed first; the tier band is selected from
      # base_fte ONLY; the surcharge is added afterwards. Selecting the band from the running
      # total recomputes a different surcharge and is the wrong interpretation.
      active = PerformanceStandard where contract_id = Contract.id and status == ACTIVE
      base_fte = round_half_up(0.5 * count(active) + 0.25 * sum(active.criticality_weight), 2)
      if base_fte >= 6.00:   surcharge_fte = 3.00
      elif base_fte >= 3.50: surcharge_fte = 2.00
      elif base_fte >= 1.50: surcharge_fte = 1.00
      else:                  surcharge_fte = 0.00
      staffing_floor_fte = base_fte + surcharge_fte
    input_set: "PerformanceStandard rows under the contract with status exactly ACTIVE; BREACHED, SUSPENDED, DRAFT and RETIRED rows are excluded from both the count and the weight sum"
    constants:
      FTE_PER_STANDARD: 0.5
      CRITICALITY_CREDIT_FACTOR: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: band_from_running_total
        when: "an implementation selects the surcharge band from the running total instead of from base_fte"
        difference: "six ACTIVE standards each with criticality_weight 1.0 give base_fte 4.50 (band from base_fte = 2.00) so staffing_floor_fte is 6.50; selecting the band from the running total 4.50 is identical, but once base_fte lands just under a band edge the two diverge, so the pinned order is base_fte-then-band"
  - name: breach_score
    trigger: "POST /water-om/performance-measurements/{id}/assess and POST /water-om/performance-measurements/{id}/revise"
    algorithm: weighted_scoring
    formula: |
      if in_breach == false: return 0.0
      threshold = PerformanceStandard.threshold_value
      deviation_ratio = abs(measured_value - threshold) / threshold
      if deviation_ratio >= 0.50:   severity_band = 1.00
      elif deviation_ratio >= 0.25: severity_band = 0.60
      elif deviation_ratio >= 0.10: severity_band = 0.30
      else:                         severity_band = 0.10
      weighted_breach_score = round_half_up(PerformanceStandard.criticality_weight * severity_band, 4)
    input_set: "the single PerformanceMeasurement being assessed, joined to its owning PerformanceStandard's threshold_value, threshold_direction and criticality_weight; in_breach is computed first from threshold_direction"
    constants:
      SEVERE_DEVIATION_RATIO: 0.50
      MAJOR_DEVIATION_RATIO: 0.25
      MINOR_DEVIATION_RATIO: 0.10
    precision: "4 decimal places, round_half_up; deviation_ratio compared unrounded"
    variants:
      - name: measured_before_breach_test
        when: "an implementation applies the threshold_direction test against the rounded deviation rather than the in_breach flag"
        difference: "criticality_weight 0.50 against threshold_value 10.0: measured_value 12.5 gives deviation_ratio exactly 0.25, band 0.60, weighted_breach_score exactly 0.3000; measured_value 12.49 gives deviation_ratio 0.2490, band 0.10, weighted_breach_score exactly 0.0500. The pinned order is in_breach first, then the unrounded ratio"
  - name: pm_compliance_rate
    trigger: "POST /water-om/pm-schedules/{id}/regenerate, POST /water-om/pm-schedules/{id}/suspend, and the DUE -> OVERDUE system event"
    algorithm: aggregation
    formula: |
      # An occurrence is COMPLIANT when its linked preventive WorkOrder reached CLOSED at an
      # instant <= occurrence_due_at + GRACE_DAYS; the boundary is inclusive.
      window_end = occurrence_due_at + (GRACE_DAYS * 86400 seconds)
      compliant  = count(occurrences where linked_work_order.status == CLOSED and linked_work_order.status_changed_at <= window_end)
      missed     = count(occurrences where linked_work_order.status != CLOSED and now > window_end)
      if compliant + missed == 0: compliance_rate_pct = 0.00
      else: compliance_rate_pct = round_half_up(100 * compliant / (compliant + missed), 2)
    input_set: "all generated occurrences of this PMSchedule since its status first became ACTIVE, ordered by occurrence_due_at ASC (tie-break occurrence_due_at ASC, then created_at ASC, never id); occurrences for which the grace window has not yet closed are excluded from both numerator and denominator"
    constants:
      GRACE_DAYS: 7
    precision: "2 decimal places, round_half_up; empty set yields exactly 0.00"
    variants:
      - name: strict_before_deadline
        when: "an implementation treats the grace boundary as exclusive"
        difference: "a closure recorded exactly 7 days after the due instant counts as compliant under <= and as missed under <, moving three of four occurrences from 75.00 to 50.00"
  - name: notification_deadline
    trigger: "POST /water-om/emergency-events/{id}/dispatch and POST /water-om/emergency-events/{id}/notify"
    algorithm: threshold
    formula: |
      if event_type == CONTAMINATION:                    hours = CONTAMINATION_NOTIFY_HOURS
      elif event_type == SANITARY_OVERFLOW:              hours = OVERFLOW_NOTIFY_HOURS
      elif event_type == TREATMENT_UPSET:                hours = UPSET_NOTIFY_HOURS
      elif event_type == MAIN_BREAK:
          hours = MAIN_BREAK_SEVERE_HOURS if severity IN {HIGH, CRITICAL} else MAIN_BREAK_STANDARD_HOURS
      else:                                              hours = POWER_LOSS_NOTIFY_HOURS
      notify_deadline_at = occurred_at + (hours * 3600 seconds)
      notification_late  = (notified_at >= notify_deadline_at)   # boundary is INCLUSIVE
    input_set: "the single EmergencyEvent; severity is only consulted for MAIN_BREAK"
    constants:
      CONTAMINATION_NOTIFY_HOURS: 1
      OVERFLOW_NOTIFY_HOURS: 2
      UPSET_NOTIFY_HOURS: 4
      MAIN_BREAK_STANDARD_HOURS: 24
      MAIN_BREAK_SEVERE_HOURS: 4
      POWER_LOSS_NOTIFY_HOURS: 24
    precision: "whole seconds; the deadline is an exact instant, not a rounded day"
    variants:
      - name: exclusive_deadline_boundary
        when: "an implementation treats a notification filed exactly at the deadline as on time"
        difference: "a MEDIUM MAIN_BREAK occurring at 2026-05-01T00:00:00Z has deadline 2026-05-02T00:00:00Z; filing at exactly that instant sets notification_late true, and filing one second earlier sets it false"
  - name: vesting_benefit
    trigger: "POST /water-om/contracts/{id}/employees/{eid}/offer"
    algorithm: tiered_pricing
    formula: |
      years = (Contract.contract_start_date - Employee.municipal_hire_date) / 365 days, rounded to 2 places
      if years >= GRANDFATHERED_YEARS: benefit_tier = GRANDFATHERED
      elif years >= ENHANCED_YEARS:    benefit_tier = ENHANCED
      elif years >= STANDARD_YEARS:    benefit_tier = STANDARD
      elif years >= BASIC_YEARS:       benefit_tier = BASIC
      else:                            benefit_tier = NONE
      if benefit_tier IN {NONE, GRANDFATHERED}: pension_offset_cents = 0
      elif benefit_tier == ENHANCED:  pension_offset_cents = round_half_up(ENHANCED_OFFSET_PER_YEAR_CENTS * years, 0)
      elif benefit_tier == STANDARD:  pension_offset_cents = round_half_up(STANDARD_OFFSET_PER_YEAR_CENTS * years, 0)
      else:                           pension_offset_cents = round_half_up(BASIC_OFFSET_PER_YEAR_CENTS * years, 0)
    input_set: "the single Employee being offered, joined to its owning Contract.contract_start_date"
    constants:
      GRANDFATHERED_YEARS: 20
      ENHANCED_YEARS: 10
      STANDARD_YEARS: 5
      BASIC_YEARS: 1
      BASIC_OFFSET_PER_YEAR_CENTS: 120000
      STANDARD_OFFSET_PER_YEAR_CENTS: 185000
      ENHANCED_OFFSET_PER_YEAR_CENTS: 250000
    precision: "years to 2 decimal places; cents integer, round_half_up"
    variants:
      - name: strict_band_boundary
        when: "an implementation uses > instead of >= at the tier edges"
        difference: "an employee with exactly 10.00 years of service is ENHANCED with pension_offset_cents 2500000 under >=, and standard with 1850000 under >"
  - name: transition_back_credit
    trigger: "the TransitionObligation PENDING -> OVERDUE system event, the OVERDUE -> ESCALATED system event, and POST /water-om/transition-obligations/{id}/satisfy"
    algorithm: decay_function
    formula: |
      if now > due_at:
          outstanding_days = floor((now - due_at) / 86400 seconds)
      else:
          outstanding_days = 0
      if status in {SATISFIED, WAIVED}:
          withholding_cents = 0
      else:
          withholding_cents = min(outstanding_days * penalty_per_day_cents, WITHHOLDING_CAP_CENTS)
    input_set: "the single TransitionObligation; outstanding_days counts whole 24 hour periods elapsed after due_at"
    constants:
      WITHHOLDING_CAP_CENTS: 4000000
    precision: "whole days, floored; integer cents"
    variants:
      - name: calendar_day_count
        when: "an implementation counts calendar date boundaries instead of elapsed 24 hour periods"
        difference: "an obligation due at 2026-06-01T18:00:00Z evaluated at 2026-06-02T06:00:00Z yields outstanding_days 0 under elapsed-period counting and 1 under calendar-date counting, changing withholding_cents from 0 to 25000"
  - name: contract_settlement_net
    trigger: "POST /water-om/contracts/{id}/complete-hand-back and GET /water-om/contracts/{id}/settlement"
    algorithm: aggregation
    formula: |
      prorated_fee_cents   = round_half_up(Contract.annual_fee_cents * (operating_days / 365), 0)
      withholding_total    = sum(TransitionObligation.withholding_cents for obligations of this contract)
      penalty_total        = sum(PenaltyAllocation.operator_share_cents for allocations of this contract with status != VOIDED)
      net_payable_cents    = prorated_fee_cents - withholding_total - penalty_total
    input_set: "all TransitionObligation rows of the contract regardless of status (SATISFIED and WAIVED rows carry withholding_cents 0); all PenaltyAllocation rows of the contract excluding status VOIDED"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: gross_settlement
        when: "an implementation omits the withholding deduction"
        difference: "the gross variant returns prorated_fee_cents - penalty_total, which is larger by exactly withholding_total"

validations:
  - priority: 1
    category: auth
    check: X-User-Role and X-User-ID headers are present and non-empty on every request
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: X-User-Role is one of the roles declared in the RBAC matrix
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: the value of X-User-ID exists as an instance of the entity named by the role's identity when identity is entity_backed
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 401
    applies_to: all
  - priority: 4
    category: auth
    check: the role is permitted for this operation per the RBAC matrix; MunicipalityAdmin- and OperatorAdmin-exclusive operations reject other roles
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 5
    category: auth
    check: 'the acting party did not perform the opposing party''s step on the same record: an OperatorAdmin may not verify, accept or waive a record it created, and a MunicipalityAdmin may not verify or
      clear a record it created'
    error_id: ERR_CROSS_TENANT_DENIED
    http_status: 403
    applies_to: POST /water-om/work-orders/{id}/verify, POST /water-om/asset-assessments/{id}/accept, POST /water-om/performance-measurements/{id}/waive, POST /water-om/transition-obligations/{id}/waive
  - priority: 6
    category: auth
    check: X-User-ID equals the Employee.id for Employee-role self-service operations
    error_id: ERR_SELF_SERVICE_OWNER_MISMATCH
    http_status: 403
    applies_to: POST /water-om/employees/{id}/accept, POST /water-om/employees/{id}/decline
  - priority: 7
    category: existence
    check: the Municipality referenced by the path exists
    error_id: ERR_MUNICIPALITY_NOT_FOUND
    http_status: 404
    applies_to: all endpoints whose path contains a municipality id or a municipality-scoped child
  - priority: 8
    category: existence
    check: the Contract referenced by the path or payload exists
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: all contract-scoped endpoints
  - priority: 9
    category: existence
    check: the Permit referenced by the path exists
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: all permit-scoped endpoints
  - priority: 10
    category: existence
    check: the PerformanceStandard referenced by the path exists
    error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    applies_to: all performance-standard-scoped endpoints
  - priority: 11
    category: existence
    check: the PerformanceMeasurement referenced by the path exists
    error_id: ERR_MEASUREMENT_NOT_FOUND
    http_status: 404
    applies_to: all performance-measurement-scoped endpoints
  - priority: 12
    category: existence
    check: the Asset referenced by the path or payload exists
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: all asset-scoped endpoints and WorkOrder / PMSchedule / AssetConditionAssessment creation
  - priority: 13
    category: existence
    check: the AssetConditionAssessment referenced by the path exists
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: all asset-condition-assessment-scoped endpoints
  - priority: 14
    category: existence
    check: the Employee referenced by the path exists
    error_id: ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    applies_to: all employee-scoped endpoints
  - priority: 15
    category: existence
    check: the StaffingCommitment referenced by the path exists
    error_id: ERR_STAFFING_NOT_FOUND
    http_status: 404
    applies_to: all staffing-commitment-scoped endpoints
  - priority: 16
    category: existence
    check: the WorkOrder referenced by the path exists
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: all work-order-scoped endpoints
  - priority: 17
    category: existence
    check: the PMSchedule referenced by the path exists
    error_id: ERR_PM_SCHEDULE_NOT_FOUND
    http_status: 404
    applies_to: all pm-schedule-scoped endpoints
  - priority: 18
    category: existence
    check: the EmergencyEvent referenced by the path exists
    error_id: ERR_EMERGENCY_NOT_FOUND
    http_status: 404
    applies_to: all emergency-event-scoped endpoints
  - priority: 19
    category: existence
    check: the PenaltyAllocation referenced by the path exists
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: all penalty-allocation-scoped endpoints
  - priority: 20
    category: existence
    check: the RenewalProposal referenced by the path exists
    error_id: ERR_PROPOSAL_NOT_FOUND
    http_status: 404
    applies_to: all renewal-proposal-scoped endpoints
  - priority: 21
    category: existence
    check: the TransitionObligation referenced by the path exists
    error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: all transition-obligation-scoped endpoints
  - priority: 22
    category: state
    check: Contract.status equals the from-state required by this transition
    error_id: ERR_CONTRACT_INVALID_STATE
    http_status: 409
    applies_to: all contract state transitions
  - priority: 23
    category: state
    check: Asset.status equals the from-state required by this transition
    error_id: ERR_ASSET_INVALID_STATE
    http_status: 409
    applies_to: all asset state transitions
  - priority: 24
    category: state
    check: WorkOrder.status equals the from-state required by this transition
    error_id: ERR_WORK_ORDER_INVALID_STATE
    http_status: 409
    applies_to: all work-order state transitions
  - priority: 25
    category: state
    check: PMSchedule.status equals the from-state required by this transition
    error_id: ERR_PM_SCHEDULE_INVALID_STATE
    http_status: 409
    applies_to: all pm-schedule state transitions
  - priority: 26
    category: state
    check: EmergencyEvent.status equals the from-state required by this transition
    error_id: ERR_EMERGENCY_INVALID_STATE
    http_status: 409
    applies_to: all emergency-event state transitions
  - priority: 27
    category: state
    check: the target resource is not already in a terminal state for the operation requested
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: all endpoints acting on CLOSED, CANCELLED, RETIRED, SEPARATED, ACCEPTED, SETTLED, VOIDED rows
  - priority: 28
    category: state
    check: Contract.baseline_frozen is false when a baseline assessment is amended or disputed
    error_id: ERR_BASELINE_FROZEN
    http_status: 409
    applies_to: POST /water-om/asset-assessments/{id}/dispute, POST /water-om/asset-assessments/{id}/revise
  - priority: 29
    category: state
    check: no PerformanceStandard under the contract has status BREACHED when a contract returns to OPERATING
    error_id: ERR_OPEN_BREACH_BLOCKS
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/reviews (UNDER_REVIEW -> OPERATING)
  - priority: 30
    category: state
    check: no WorkOrder under the asset has status IN {SCHEDULED, IN_PROGRESS, PAUSED, AWAITING_PARTS} when the asset is taken out of service
    error_id: ERR_OPEN_WORK_ORDER_BLOCKS
    http_status: 409
    applies_to: POST /water-om/assets/{id}/take-out-of-service
  - priority: 31
    category: state
    check: the TransitionObligation is not critical when a waiver is requested
    error_id: ERR_CRITICAL_OBLIGATION_NOT_WAIVABLE
    http_status: 403
    applies_to: POST /water-om/transition-obligations/{id}/waive
  - category: state
    check: PenaltyAllocation.status is CONTESTED or ADJUSTED when an adjustment is requested
    error_id: ERR_ALLOCATION_INVALID_STATE
    http_status: 409
    applies_to: POST /water-om/penalty-allocations/{id}/adjust
    priority: 32
  - priority: 33
    category: business_safety
    check: a critical emergency notification (severity CRITICAL or event_type CONTAMINATION) requires at least two OperatorsAdmin acknowledgements before it can be closed
    error_id: ERR_CRITICAL_ACKNOWLEDGEMENT_MISSING
    http_status: 422
    applies_to: POST /water-om/emergency-events/{id}/close
  - priority: 34
    category: business_safety
    check: the operator may not reduce staffing below Contract.staffing_floor_fte while an EmergencyEvent under the contract is open
    error_id: ERR_EMERGENCY_STAFFING_FLOOR
    http_status: 409
    applies_to: POST /water-om/employees/{id}/separate, POST /water-om/staffing-commitments/{id}/suspend
  - priority: 35
    category: business_safety
    check: a sanitary overflow event requires a containment record before any restoration is attempted
    error_id: ERR_OVERFLOW_CONTAINMENT_REQUIRED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/restore
  - priority: 36
    category: business_safety
    check: the discharge monitoring report interval may not be shortened below the permit's reporting frequency
    error_id: ERR_REPORTING_FREQUENCY_VIOLATION
    http_status: 422
    applies_to: POST /water-om/performance-standards/{id}/measurements
  - category: business_safety
    check: a CONTAMINATION event or a severity CRITICAL event has a recorded containment instant before any regulator notification is filed
    error_id: ERR_CONTAMINATION_CONTAINMENT_REQUIRED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/notify
    priority: 37
  - priority: 38
    category: business_temporal
    check: 'the supplied instants satisfy their ordering: Contract.contract_end_date after contract_start_date, PerformanceMeasurement.period_end after period_start, Permit.expiration_date after effective_date'
    error_id: ERR_INVALID_DATE_WINDOW
    http_status: 400
    applies_to: POST /water-om/municipalities/{id}/contracts, POST /water-om/performance-standards/{id}/measurements, POST /water-om/contracts/{id}/permits
  - priority: 39
    category: business_temporal
    check: the emergency notification is filed strictly before notify_deadline_at
    error_id: ERR_NOTIFICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/notify
  - priority: 40
    category: business_temporal
    check: the containment instant is at or after occurred_at and within the critical containment window for severity CRITICAL
    error_id: ERR_CONTAINMENT_WINDOW_EXCEEDED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/contain
  - priority: 41
    category: business_temporal
    check: 'the PM grace window is still open: now <= PMSchedule.next_due_at + 7 days when a completed occurrence is regenerated'
    error_id: ERR_PM_WINDOW_EXPIRED
    http_status: 409
    applies_to: POST /water-om/pm-schedules/{id}/regenerate
  - priority: 42
    category: business_temporal
    check: the work order reaches CLOSED at least 5 days after submitted_to_municipality_at
    error_id: ERR_REPORTAGE_PERIOD_OPEN
    http_status: 409
    applies_to: POST /water-om/work-orders/{id}/close
  - priority: 43
    category: business_temporal
    check: PMSchedule.duration_hours plus the existing occupation on the same Asset does not extend beyond now + 30 days
    error_id: ERR_PM_WINDOW_TOO_FAR
    http_status: 409
    applies_to: POST /water-om/assets/{id}/pm-schedules
  - priority: 44
    category: business_temporal
    check: the transition-back obligation due_at is not earlier than the hand-back start instant
    error_id: ERR_OBLIGATION_DUE_BEFORE_HANDOFF
    http_status: 400
    applies_to: POST /water-om/contracts/{id}/transition-obligations
  - priority: 45
    category: business_temporal
    check: the ingested work order is not back-dated more than 7 days before now
    error_id: ERR_BACKDATED_RECORD_REJECTED
    http_status: 400
    applies_to: POST /water-om/contracts/{id}/work-orders
  - priority: 46
    category: business_temporal
    check: the PerformanceMeasurement period does not overlap an existing measurement period on the same standard
    error_id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: POST /water-om/performance-standards/{id}/measurements
  - priority: 47
    category: business_temporal
    check: the preventive maintenance occupation on the asset does not overlap an existing PMSchedule or an open PREVENTIVE WorkOrder occupation on the same asset
    error_id: ERR_PM_OCCUPATION_OVERLAP
    http_status: 409
    applies_to: POST /water-om/assets/{id}/pm-schedules, POST /water-om/pm-schedules/{id}/regenerate
  - priority: 48
    category: business_constraint
    check: PerformanceStandard.code is unique within its contract
    error_id: ERR_DUPLICATE_STANDARD_CODE
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/performance-standards
  - priority: 49
    category: business_constraint
    check: Asset.asset_tag is unique within its contract
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/assets
  - priority: 50
    category: business_constraint
    check: at most one AssetConditionAssessment under an asset may finalize as the frozen baseline
    error_id: ERR_BASELINE_ALREADY_FROZEN
    http_status: 409
    applies_to: POST /water-om/asset-assessments/{id}/accept
  - priority: 51
    category: business_constraint
    check: at most one RenewalProposal per (contract, round_number) may be SUBMITTED
    error_id: ERR_DUPLICATE_ROUND_PROPOSAL
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/renewal-proposals, POST /water-om/renewal-proposals/{id}/counter
  - priority: 52
    category: business_constraint
    check: Permit.permit_type is unique among non-EXPIRED permits on the same contract
    error_id: ERR_DUPLICATE_ACTIVE_PERMIT_TYPE
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/permits
  - priority: 53
    category: business_constraint
    check: 'the PerformanceStandard.threshold_direction and threshold_value are consistent with metric_type: ATTIME metrics require AT_LEAST, failures-per-period metrics require AT_MOST'
    error_id: ERR_THRESHOLD_DIRECTION_INVALID
    http_status: 400
    applies_to: POST /water-om/contracts/{id}/performance-standards
  - priority: 54
    category: business_constraint
    check: RenewalProposal.round_number equals Contract.renewal_round + 1
    error_id: ERR_RENEWAL_ROUND_MISMATCH
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/renewal-proposals, POST /water-om/renewal-proposals/{id}/counter
  - priority: 55
    category: business_constraint
    check: the work order post-closure cannot be amended; CLOSED work orders are immutable
    error_id: ERR_CLOSED_WORK_ORDER_IMMUTABLE
    http_status: 409
    applies_to: all work-order-scoped mutation endpoints
  - category: business_constraint
    check: a work order reaching closure does not carry expense_class PENDING_CLASSIFICATION
    error_id: ERR_EXPENSE_CLASS_UNRESOLVED
    http_status: 409
    applies_to: POST /water-om/work-orders/{id}/close
    priority: 56
  - priority: 57
    category: business_fiscal
    check: the resolved RenewalProposal.benchmark_ratio is at most 1.25
    error_id: ERR_BENCHMARK_RATIO_EXCEEDED
    http_status: 422
    applies_to: POST /water-om/contracts/{id}/renewal-proposals
  - priority: 58
    category: business_fiscal
    check: the contract's PerformanceStandard.BREACHED count is zero before a renewal proposal is submitted
    error_id: ERR_BREACH_UNRESOLVED_AT_RENEWAL
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/renewal-proposals
  - priority: 59
    category: business_fiscal
    check: the computed operator share plus the municipality share equals the regulator's total_penalty_cents exactly after allocation
    error_id: ERR_PENALTY_ALLOCATION_NOT_CONSERVED
    http_status: 422
    applies_to: POST /water-om/penalty-allocations, POST /water-om/penalty-allocations/{id}/adjust
  - priority: 60
    category: business_fiscal
    check: the settlement net payable is not negative once proration, withholding and penalties are applied
    error_id: ERR_NEGATIVE_SETTLEMENT
    http_status: 422
    applies_to: POST /water-om/contracts/{id}/complete-hand-back
  - priority: 61
    category: business_fiscal
    check: the aggregate breach penalty across all BREACHED standards under a contract does not exceed the annual fee
    error_id: ERR_PENALTY_CAP_EXCEEDED
    http_status: 409
    applies_to: POST /water-om/performance-standards/{id}/measurements, the UNDER_REVIEW review cascade
  - priority: 62
    category: business_fiscal
    check: the asset has been in service for at least 60 percent of its useful life before a capital-expense classification may be approved
    error_id: ERR_CAPITAL_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: POST /water-om/work-orders/{id}/start
  - priority: 63
    category: business_referential
    check: exactly one AssetConditionAssessment under the asset is the frozen baseline before the asset may enter service
    error_id: ERR_ASSET_BASELINE_UNRESOLVED
    http_status: 409
    applies_to: system cascade from POST /water-om/contracts/{id}/mobilize, POST /water-om/assets/{id}/return-to-service
  - priority: 64
    category: business_referential
    check: every critical TransitionObligation under the contract is SATISFIED or WAIVED before the hand-back completes
    error_id: ERR_CRITICAL_OBLIGATIONS_OUTSTANDING
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/complete-hand-back
  - priority: 65
    category: business_referential
    check: a permit with a NOTICE_OF_VIOLATION and a pending regulatory action blocks the transition-back completion
    error_id: ERR_PERMIT_ACTION_UNRESOLVED
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/complete-hand-back, POST /water-om/contracts/{id}/terminate
  - priority: 66
    category: business_referential
    check: a work order cannot be opened on an asset owned by a different contract than the path's contract
    error_id: ERR_ASSET_CONTRACT_MISMATCH
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/work-orders, POST /water-om/contracts/{id}/emergency-events

state_machines:
  - entity: Contract
    initial_state: AWARDED
    terminal_states:
    - TRANSITIONED
    - TERMINATED
    transitions:
    - from: AWARDED
      to: MOBILIZING
      trigger: POST /water-om/contracts/{id}/mobilize
      actor: OperatorAdmin
      preconditions:
      - Contract.baseline_frozen == false
      - at least one PerformanceStandard under the contract has status ACTIVE
      - now >= Contract.contract_start_date
      side_effects:
      - each StaffingCommitment under the contract with status DRAFT is transitioned to BINDING
      - Contract.staffing_floor_fte recomputed by the staffing_floor formula
      - 'if Contract.staffing_floor_fte > sum of committed_fte over StaffingCommitment rows in status BINDING, the lowest-committed_fte such StaffingCommitment transitions BINDING -> SHORTFALL (tie-break:
        created_at ASC)'
      - Contract.status_changed_at stamped
      note: 'Depth-4 cascade origin: mobilize -> bind commitments -> recompute staffing floor -> demote the lowest-committed class.'
    - from: MOBILIZING
      to: OPERATING
      trigger: POST /water-om/contracts/{id}/commence-operating
      actor: OperatorAdmin
      preconditions:
      - Contract.baseline_frozen == true
      - no StaffingCommitment under the contract has status SHORTFALL
      - sum of StaffingCommitment.filled_fte over status IN {BINDING, REMEDIATING, SATISFIED} >= Contract.staffing_floor_fte
      side_effects:
      - every Asset under the contract with status BASELINE_ASSESSED transitions to IN_SERVICE
      - every PMSchedule under the contract with status DRAFT transitions to ACTIVE
      note: Two sibling fan-outs; both target rows are children of the same contract.
    - from: OPERATING
      to: UNDER_REVIEW
      trigger: POST /water-om/contracts/{id}/reviews
      actor: MunicipalityAdmin
      preconditions:
      - now >= Contract.contract_start_date
      - Contract.status == OPERATING
      side_effects:
      - every PerformanceStandard under the contract with status ACTIVE whose latest PerformanceMeasurement has in_breach == true transitions ACTIVE -> BREACHED
      - on each such standard, the owning Contract recomputes total_operator_penalty_cents via the penalty_allocation calculation
      - a PerformanceStandard whose recomputed operator share pushes Contract.total_operator_penalty_cents above the review tolerance is left BREACHED and its next PerformanceMeasurement is auto-created with
        status RECORDED
      note: 'Depth-3 cascade: review -> standard BREACHED -> contract penalty recompute -> auto-created measurement.'
    - from: UNDER_REVIEW
      to: OPERATING
      trigger: POST /water-om/contracts/{id}/reviews
      actor: OperatorAdmin
      preconditions:
      - Contract.status == UNDER_REVIEW
      - no PerformanceStandard under the contract has status BREACHED
      side_effects:
      - Contract.renewal_round unchanged
      - Contract.status_changed_at stamped
      note: 'Cycle edge: a reviewed contract that clears all breaches returns to OPERATING.'
    - from: UNDER_REVIEW
      to: RENEWAL_PENDING
      trigger: POST /water-om/contracts/{id}/renewals
      actor: OperatorAdmin
      preconditions:
      - now >= Contract.contract_end_date - 180 days
      - Contract.baseline_frozen == true
      side_effects:
      - Contract.status_changed_at stamped
      - no RenewalProposal is created by this transition; proposals are submitted separately
    - from: RENEWAL_PENDING
      to: RENEWED
      trigger: POST /water-om/renewal-proposals/{id}/accept
      actor: MunicipalityAdmin
      preconditions:
      - RenewalProposal.status == SUBMITTED or UNDER_REVIEW
      - RenewalProposal.round_number == Contract.renewal_round + 1
      - RenewalProposal.proposed_term_years >= 1
      side_effects:
      - Contract.renewal_round incremented by 1
      - Contract.annual_fee_cents set to RenewalProposal.proposed_fee_cents
      - Contract.contract_end_date extended by RenewalProposal.proposed_term_years * 365 days
      - the accepting RenewalProposal transitions to ACCEPTED and every other non-terminal RenewalProposal under the contract transitions to LAPSED
    - from: RENEWED
      to: OPERATING
      trigger: 'system event: renewal term effective at Contract.contract_start_date of the new term'
      actor: system
      preconditions:
      - now >= Contract.contract_start_date
      side_effects:
      - every PerformanceStandard under the contract with status RETIRED transitions to DRAFT
      - Contract.staffing_floor_fte recomputed
      note: 'Cycle-closing edge: RENEWED returns the contract to OPERATING, closing the RENEWAL_PENDING -> RENEWED -> OPERATING loop.'
    - from: RENEWAL_PENDING
      to: HANDING_BACK
      trigger: POST /water-om/contracts/{id}/hand-back
      actor: MunicipalityAdmin
      preconditions:
      - no RenewalProposal under the contract has status SUBMITTED
      - Contract.baseline_frozen == true
      side_effects:
      - for each Asset under the contract, a TransitionObligation of obligation_type ASSET_HANDOVER is created in status PENDING
      - for each Employee under the contract with status IN {TRANSFERRED, INDUCTION, ACTIVE}, a TransitionObligation of obligation_type EMPLOYEE_REINSTATE is created in status PENDING
      - Contract.status_changed_at stamped
    - from: UNDER_REVIEW
      to: HANDING_BACK
      trigger: POST /water-om/contracts/{id}/hand-back
      actor: MunicipalityAdmin
      preconditions:
      - Contract.baseline_frozen == true
      - no RenewalProposal under the contract has status SUBMITTED
      side_effects:
      - for each Asset under the contract, a TransitionObligation of obligation_type ASSET_HANDOVER is created in status PENDING
      - Contract.status_changed_at stamped
    - from: HANDING_BACK
      to: RENEWAL_PENDING
      trigger: POST /water-om/contracts/{id}/renewals
      actor: MunicipalityAdmin
      preconditions:
      - every TransitionObligation under the contract with is_critical == true has status IN {SATISFIED, WAIVED}
      side_effects:
      - every TransitionObligation under the contract with status IN {PENDING, IN_PROGRESS} transitions to WAIVED
      - Contract.status_changed_at stamped
      note: 'Second cycle-closing edge: a hand-back that satisfies its critical obligations can fall back into renewal.'
    - from: HANDING_BACK
      to: TRANSITIONED
      trigger: POST /water-om/contracts/{id}/complete-hand-back
      actor: MunicipalityAdmin
      preconditions:
      - no TransitionObligation under the contract with is_critical == true has status IN {PENDING, IN_PROGRESS, OVERDUE, ESCALATED}
      - Contract.status == HANDING_BACK
      side_effects:
      - every Asset under the contract with status IN_SERVICE transitions to OUT_OF_SERVICE
      - every Permit under the contract with status ACTIVE transitions to EXPIRED
      - every PMSchedule under the contract with status IN {ACTIVE, DUE, OVERDUE} transitions to RETIRED
      - Contract.status_changed_at stamped
    - from: OPERATING
      to: TERMINATED
      trigger: POST /water-om/contracts/{id}/terminate
      actor: MunicipalityAdmin
      preconditions:
      - Contract.status == OPERATING
      side_effects:
      - every Employee under the contract with status IN {TRANSFERRED, INDUCTION, ACTIVE, OFFERED, ACCEPTED} transitions to SEPARATED
      - every Permit under the contract with status ACTIVE transitions to SUSPENDED
      - every PMSchedule under the contract with status IN {ACTIVE, DUE, OVERDUE} transitions to SUSPENDED
    - from: UNDER_REVIEW
      to: TERMINATED
      trigger: POST /water-om/contracts/{id}/terminate
      actor: MunicipalityAdmin
      preconditions:
      - at least one PerformanceStandard under the contract has status BREACHED
      side_effects:
      - every Employee under the contract with status IN {TRANSFERRED, INDUCTION, ACTIVE} transitions to SEPARATED
      - every Permit under the contract with status ACTIVE transitions to SUSPENDED
  - entity: PerformanceStandard
    initial_state: DRAFT
    terminal_states:
    - RETIRED
    transitions:
    - from: DRAFT
      to: ACTIVE
      trigger: POST /water-om/contracts/{id}/performance-standards/{sid}/activate
      actor: OperatorAdmin
      preconditions:
      - PerformanceStandard.criticality_weight > 0.0
      - PerformanceStandard.threshold_value is set
      side_effects:
      - PerformanceStandard.status_changed_at stamped
      - Contract.staffing_floor_fte recomputed by the staffing_floor formula
    - from: ACTIVE
      to: BREACHED
      trigger: POST /water-om/performance-standards/{id}/measurements (in_breach computed true) or the UNDER_REVIEW cascade
      actor: system
      preconditions:
      - the latest PerformanceMeasurement under this standard has in_breach == true
      side_effects:
      - PerformanceStandard.breach_reason_code set to the metric_type of the breached measurement
      - Contract.total_operator_penalty_cents increased by the operator share computed by the penalty_allocation calculation
      - if Contract.total_operator_penalty_cents > Municipality.benchmark_index_baseline * 100000, the owning Municipality recomputes benchmark_index_baseline
      note: 'Depth-3 cascade link 2: standard BREACHED -> contract penalty -> municipality benchmark recompute.'
    - from: BREACHED
      to: SUSPENDED
      trigger: POST /water-om/performance-standards/{id}/suspend
      actor: OperatorAdmin
      preconditions:
      - PerformanceStandard.breach_reason_code != ""
      - at least two PerformanceMeasurements under this standard have status CONFIRMED
      side_effects:
      - every PerformanceMeasurement under this standard with status IN {RECORDED, ASSESSED} transitions to WAIVED
    - from: BREACHED
      to: ACTIVE
      trigger: POST /water-om/performance-standards/{id}/clear-breach
      actor: MunicipalityAdmin
      preconditions:
      - PerformanceStandard.status_changed_at is at least 30 days before now
      - the latest PerformanceMeasurement under this standard has in_breach == false
      side_effects:
      - PerformanceStandard.breach_reason_code reset to ""
      - the owning Contract recomputes total_operator_penalty_cents by subtracting the allocated operator share of the cleared breach
      note: 'Revert edge: BREACHED -> ACTIVE returns the standard to operation.'
    - from: SUSPENDED
      to: ACTIVE
      trigger: POST /water-om/performance-standards/{id}/reactivate
      actor: OperatorAdmin
      preconditions:
      - PerformanceStandard.status == SUSPENDED
      - Contract.status IN {MOBILIZING, OPERATING, UNDER_REVIEW, RENEWED}
      side_effects:
      - PerformanceStandard.breach_reason_code reset to ""
      - Contract.staffing_floor_fte recomputed
    - from: ACTIVE
      to: RETIRED
      trigger: POST /water-om/performance-standards/{id}/retire
      actor: MunicipalityAdmin
      preconditions:
      - at least one PerformanceMeasurement under this standard has status CONFIRMED
      - no PerformanceMeasurement under this standard has status RECORDED
      side_effects:
      - Contract.staffing_floor_fte recomputed
  - entity: PerformanceMeasurement
    initial_state: RECORDED
    terminal_states:
    - CONFIRMED
    - WAIVED
    transitions:
    - from: RECORDED
      to: ASSESSED
      trigger: POST /water-om/performance-measurements/{id}/assess
      actor: OperatorAdmin
      preconditions:
      - PerformanceMeasurement.in_breach computed from the owning standard's threshold_direction
      side_effects:
      - PerformanceMeasurement.weighted_breach_score set by the breach_score formula
      - if in_breach == true and weighted_breach_score >= 0.60, the owning PerformanceStandard transitions ACTIVE -> BREACHED
    - from: ASSESSED
      to: DISPUTED
      trigger: POST /water-om/performance-measurements/{id}/dispute
      actor: MunicipalityAdmin
      preconditions:
      - PerformanceMeasurement.in_breach == true
      - now < PerformanceMeasurement.period_end + 30 days
      side_effects:
      - PerformanceMeasurement.status_changed_at stamped
    - from: DISPUTED
      to: ASSESSED
      trigger: POST /water-om/performance-measurements/{id}/revise
      actor: OperatorAdmin
      preconditions:
      - PerformanceMeasurement.measured_value == the value submitted by the disputing municipality
      side_effects:
      - PerformanceMeasurement.weighted_breach_score recomputed by the breach_score formula
      note: 'Cycle edge: DISPUTED -> ASSESSED -> DISPUTED is permitted without limit while the period window is open.'
    - from: ASSESSED
      to: CONFIRMED
      trigger: POST /water-om/performance-measurements/{id}/confirm
      actor: MunicipalityAdmin
      preconditions:
      - PerformanceMeasurement.status == ASSESSED
      - the owning PerformanceStandard.status == BREACHED implies at least two CONFIRMED measurements exist under it
      side_effects:
      - PerformanceMeasurement.status_changed_at stamped
    - from: ASSESSED
      to: WAIVED
      trigger: POST /water-om/performance-measurements/{id}/waive
      actor: MunicipalityAdmin
      preconditions:
      - PerformanceMeasurement.in_breach == true
      - the owning Permit under the same contract has status NOTICE_OF_VIOLATION
      side_effects:
      - PerformanceMeasurement.in_breach reset to false
      - the owning PerformanceStandard recomputes breach_reason_code from its remaining in_breach measurements
  - entity: StaffingCommitment
    initial_state: DRAFT
    terminal_states:
    - SUSPENDED
    transitions:
    - from: DRAFT
      to: BINDING
      trigger: POST /water-om/contracts/{id}/staffing-commitments/{cid}/bind or the Contract MOBILIZING cascade
      actor: OperatorAdmin
      preconditions:
      - StaffingCommitment.committed_fte >= 0
      - Contract.status == MOBILIZING
      side_effects:
      - StaffingCommitment.vacancy_fte recomputed as max(0, committed_fte - filled_fte)
    - from: BINDING
      to: SHORTFALL
      trigger: POST /water-om/staffing-commitments/{id}/evaluate or the Contract mobilization cascade
      actor: system
      preconditions:
      - StaffingCommitment.filled_fte < StaffingCommitment.committed_fte
      side_effects:
      - StaffingCommitment.vacancy_fte recomputed
      - if this class is the unique highest-criticality class in shortfall, the owning Employee rows in status ACTIVE under the contract are flagged for REINSTATE obligations
    - from: SHORTFALL
      to: REMEDIATING
      trigger: POST /water-om/staffing-commitments/{id}/remedy
      actor: OperatorAdmin
      preconditions:
      - a remedy plan is supplied and at least one Employee under the contract has status OFFERED for this role_code
      side_effects:
      - StaffingCommitment.status_changed_at stamped
    - from: REMEDIATING
      to: SATISFIED
      trigger: POST /water-om/staffing-commitments/{id}/evaluate
      actor: system
      preconditions:
      - StaffingCommitment.filled_fte >= StaffingCommitment.committed_fte
      side_effects:
      - StaffingCommitment.vacancy_fte reset to 0
      - every Employee under the contract with status OFFERED for this role_code transitions to WITHDRAWN
    - from: REMEDIATING
      to: SHORTFALL
      trigger: POST /water-om/staffing-commitments/{id}/evaluate
      actor: system
      preconditions:
      - StaffingCommitment.filled_fte < StaffingCommitment.committed_fte
      - now >= StaffingCommitment.status_changed_at + 30 days
      side_effects:
      - StaffingCommitment.vacancy_fte recomputed
      - the owning Contract.status is set to UNDER_REVIEW when the contract is in OPERATING
      note: 'Cycle edge: SHORTFALL -> REMEDIATING -> SHORTFALL repeats every evaluation window.'
    - from: BINDING
      to: SUSPENDED
      trigger: POST /water-om/staffing-commitments/{id}/suspend
      actor: MunicipalityAdmin
      preconditions:
      - Contract.status IN {HANDING_BACK, TERMINATED}
      side_effects:
      - StaffingCommitment.filled_fte reset to 0
    - from: SATISFIED
      to: SUSPENDED
      trigger: POST /water-om/staffing-commitments/{id}/suspend
      actor: MunicipalityAdmin
      preconditions:
      - Contract.status IN {HANDING_BACK, TERMINATED}
      side_effects:
      - StaffingCommitment.filled_fte reset to 0
  - entity: Employee
    initial_state: MUNICIPAL
    terminal_states:
    - SEPARATED
    - DECLINED
    - WITHDRAWN
    transitions:
    - from: MUNICIPAL
      to: OFFERED
      trigger: POST /water-om/contracts/{id}/employees/{eid}/offer
      actor: OperatorAdmin
      preconditions:
      - Employee.transfer_offer_fte > 0
      - the matching StaffingCommitment under the contract has status IN {BINDING, REMEDIATING}
      - Contract.status IN {MOBILIZING, OPERATING}
      side_effects:
      - Employee.benefit_tier computed by the vesting formula
      - Employee.pension_offset_cents computed by the pension_offset formula
      - Employee.municipal_years_of_service computed from municipal_hire_date to Contract.contract_start_date
    - from: OFFERED
      to: ACCEPTED
      trigger: POST /water-om/employees/{id}/accept
      actor: Employee
      preconditions:
      - Employee.status == OFFERED
      - now < Employee.status_changed_at + 21 days
      side_effects:
      - Employee.status_changed_at stamped
    - from: OFFERED
      to: DECLINED
      trigger: POST /water-om/employees/{id}/decline
      actor: Employee
      preconditions:
      - Employee.status == OFFERED
      side_effects:
      - the matching StaffingCommitment.filled_fte recomputed as the sum of transferred_fte over Employees in status IN {TRANSFERRED, INDUCTION, ACTIVE} for that role_code
      - if that recomputed filled_fte < committed_fte the StaffingCommitment transitions BINDING -> SHORTFALL
      note: 'Cross-entity edge: a declined offer can demote a sibling staffing commitment.'
    - from: ACCEPTED
      to: TRANSFERRED
      trigger: POST /water-om/employees/{id}/transfer
      actor: OperatorAdmin
      preconditions:
      - Contract.baseline_frozen == true
      - now >= Contract.contract_start_date
      side_effects:
      - Employee.status_changed_at stamped
      - the matching StaffingCommitment.filled_fte increased by Employee.transfer_offer_fte
      - if that increased filled_fte >= committed_fte and the commitment is in SHORTFALL, it transitions SHORTFALL -> SATISFIED
      note: 'Cross-entity edge: a transfer can satisfy a sibling commitment.'
    - from: TRANSFERRED
      to: INDUCTION
      trigger: POST /water-om/employees/{id}/begin-induction
      actor: OperatorAdmin
      preconditions:
      - Employee.status == TRANSFERRED
      - now < Contract.contract_start_date + 30 days
      side_effects:
      - Employee.status_changed_at stamped
    - from: INDUCTION
      to: ACTIVE
      trigger: POST /water-om/employees/{id}/complete-induction
      actor: OperatorAdmin
      preconditions:
      - Employee.pension_offset_cents >= 0
      - at least one TransitionObligation of obligation_type EMPLOYEE_REINSTATE is not required for this employee while Contract.status == OPERATING
      side_effects:
      - Employee.status_changed_at stamped
      - the matching StaffingCommitment.filled_fte recomputed
    - from: ACTIVE
      to: SEPARATED
      trigger: POST /water-om/employees/{id}/separate or the Contract TERMINATED cascade
      actor: OperatorAdmin
      preconditions:
      - Employee.status == ACTIVE
      side_effects:
      - the matching StaffingCommitment.filled_fte recomputed
      - if that recomputed filled_fte < committed_fte the StaffingCommitment transitions BINDING -> SHORTFALL
    - from: ACCEPTED
      to: DECLINED
      trigger: POST /water-om/employees/{id}/decline
      actor: Employee
      preconditions:
      - now >= Employee.status_changed_at + 7 days
      side_effects:
      - the matching StaffingCommitment.filled_fte recomputed
    - from: OFFERED
      to: MUNICIPAL
      trigger: POST /water-om/employees/{id}/withdraw-offer
      actor: OperatorAdmin
      preconditions:
      - Employee.status == OFFERED
      - now < Contract.contract_start_date
      side_effects:
      - Employee.benefit_tier reset to NONE
      - Employee.pension_offset_cents reset to 0
      note: 'Revert edge: an offer withdrawn before the operating period returns the employee to MUNICIPAL.'
  - entity: Asset
    initial_state: REGISTERED
    terminal_states:
    - RETIRED
    transitions:
    - from: REGISTERED
      to: BASELINE_ASSESSED
      trigger: POST /water-om/assets/{id}/baseline-assessments with assessor_party == OPERATOR
      actor: OperatorAdmin
      preconditions:
      - Asset.status == REGISTERED
      - Contract.status IN {AWARDED, MOBILIZING}
      side_effects:
      - Asset.condition_score set to the submitted assessed_score
      - Asset.condition_band recomputed from condition_score
    - from: BASELINE_ASSESSED
      to: BASELINE_DISPUTED
      trigger: POST /water-om/assets/{id}/baseline-assessments with assessor_party == MUNICIPALITY, or POST /water-om/asset-assessments/{id}/dispute on the operator's baseline
      actor: MunicipalityAdmin
      preconditions:
      - an AssetConditionAssessment under this asset already exists with assessor_party == OPERATOR and is_baseline == true
      side_effects:
      - Asset.condition_score set to the municipality's assessed_score
      - Asset.condition_band recomputed from condition_score
      note: 'Branch divergence: a municipality-disputed baseline lands on a different state and never passes through BASELINE_ASSESSED.'
    - from: BASELINE_ASSESSED
      to: IN_SERVICE
      trigger: system cascade from Contract MOBILIZING
      actor: system
      preconditions:
      - the accepted AssetConditionAssessment for this asset has status ACCEPTED
      side_effects:
      - AssetConditionAssessment.baseline_binding set to true on the accepted baseline row
    - from: BASELINE_DISPUTED
      to: IN_SERVICE
      trigger: system cascade from Contract MOBILIZING
      actor: system
      preconditions:
      - the accepted AssetConditionAssessment for this asset has status ACCEPTED
      - Contract.baseline_frozen == true
      side_effects:
      - AssetConditionAssessment.baseline_binding set to true on the accepted baseline row
    - from: IN_SERVICE
      to: REPLACEMENT_FLAGGED
      trigger: POST /water-om/assets/{id}/flag-replacement or the PM overdue cascade or the work order closure cascade
      actor: OperatorAdmin
      preconditions:
      - Asset.condition_score < 40.0
      - Contract.baseline_frozen == true
      - now >= Asset.install_year + Asset.useful_life_years resolved to January 1 of that year
      side_effects:
      - Asset.replacement_flagged_at stamped
      - a WorkOrder of work_type CORRECTIVE with expense_class CAPITAL_LIFE_EVENT is created under this asset in status DRAFT
      note: 'Depth-4 cascade link 3: an Asset entering REPLACEMENT_FLAGGED itself creates a further WorkOrder.'
    - from: REPLACEMENT_FLAGGED
      to: REPLACED
      trigger: POST /water-om/assets/{id}/complete-replacement
      actor: OperatorAdmin
      preconditions:
      - the capital-class WorkOrder created by the flagging transition has status CLOSED
      - Asset.status == REPLACEMENT_FLAGGED
      side_effects:
      - Asset.install_year set from the closure payload
      - Asset.condition_score reset to 100.0
      - Asset.condition_band recomputed to EXCELLENT
      - every PMSchedule under this asset with status IN {ACTIVE, DUE, OVERDUE} has next_due_at advanced by frequency_days from now
    - from: IN_SERVICE
      to: OUT_OF_SERVICE
      trigger: POST /water-om/assets/{id}/take-out-of-service or the Contract TRANSITIONED cascade
      actor: OperatorAdmin
      preconditions:
      - no WorkOrder under this asset has status IN {SCHEDULED, IN_PROGRESS, PAUSED, AWAITING_PARTS}
      side_effects:
      - every PMSchedule under this asset with status IN {ACTIVE, DUE, OVERDUE} transitions to SUSPENDED
    - from: OUT_OF_SERVICE
      to: IN_SERVICE
      trigger: POST /water-om/assets/{id}/return-to-service
      actor: OperatorAdmin
      preconditions:
      - Contract.status IN {OPERATING, UNDER_REVIEW, RENEWED}
      - Asset.condition_score >= 40.0
      side_effects:
      - every PMSchedule under this asset with status SUSPENDED transitions to ACTIVE
      note: 'Revert edge: an out-of-service asset can be returned while the contract is live.'
    - from: REPLACEMENT_FLAGGED
      to: IN_SERVICE
      trigger: POST /water-om/assets/{id}/clear-replacement-flag
      actor: MunicipalityAdmin
      preconditions:
      - Asset.status == REPLACEMENT_FLAGGED
      - Asset.condition_score >= 40.0
      side_effects:
      - Asset.replacement_flagged_at cleared
      - the DRAFT capital-class WorkOrder created by the flagging transition is cancelled if it has not left DRAFT
    - from: OUT_OF_SERVICE
      to: RETIRED
      trigger: POST /water-om/assets/{id}/retire
      actor: MunicipalityAdmin
      preconditions:
      - Asset.status == OUT_OF_SERVICE
      - Contract.status IN {HANDING_BACK, TRANSITIONED}
      side_effects:
      - Asset.condition_score frozen at its current value
    - from: IN_SERVICE
      to: REPLACEMENT_FLAGGED
      trigger: system cascade from the PMSchedule overdue evaluation
      actor: system
      preconditions:
      - PMSchedule.missed_occurrence_count reaches exactly 3 on a schedule under this asset
      - Asset.install_year + Asset.useful_life_years <= year(now)
      side_effects:
      - Asset.replacement_flagged_at stamped
      - a WorkOrder of work_type CORRECTIVE with expense_class CAPITAL_LIFE_EVENT is created under this asset in status DRAFT
      note: 'Second entry into REPLACEMENT_FLAGGED with a different precondition set than the condition-driven entry: maintenance history rather than condition score. Depth-4 cascade link 3.'
  - entity: AssetConditionAssessment
    initial_state: DRAFTED
    terminal_states:
    - ACCEPTED
    transitions:
    - from: DRAFTED
      to: SUBMITTED
      trigger: POST /water-om/assets/{id}/baseline-assessments
      actor: OperatorAdmin
      preconditions:
      - AssetConditionAssessment.assessed_score between 0.0 and 100.0
      side_effects:
      - AssetConditionAssessment.status_changed_at stamped
    - from: SUBMITTED
      to: DISPUTED
      trigger: POST /water-om/asset-assessments/{id}/dispute
      actor: MunicipalityAdmin
      preconditions:
      - now < AssetConditionAssessment.assessed_at + 30 days
      - the owning Contract.baseline_frozen == false
      side_effects:
      - the owning Asset transitions BASELINE_ASSESSED -> BASELINE_DISPUTED when the disputed row has is_baseline == true
      note: 'Revert-style branch: disputing a baseline assessment moves its Asset onto the BASELINE_DISPUTED branch.'
    - from: DISPUTED
      to: REVISED
      trigger: POST /water-om/asset-assessments/{id}/revise
      actor: OperatorAdmin
      preconditions:
      - a revised assessed_score is supplied
      - AssetConditionAssessment.status == DISPUTED
      side_effects:
      - the owning Asset.condition_score set to the revised score
      - Asset.condition_band recomputed
      note: 'Cycle edge: DISPUTED -> REVISED -> DISPUTED is permitted while baseline_frozen == false.'
    - from: REVISED
      to: DISPUTED
      trigger: POST /water-om/asset-assessments/{id}/dispute
      actor: MunicipalityAdmin
      preconditions:
      - the owning Contract.baseline_frozen == false
      side_effects:
      - the owning Asset transitions BASELINE_ASSESSED -> BASELINE_DISPUTED when the disputed row has is_baseline == true
    - from: SUBMITTED
      to: ACCEPTED
      trigger: POST /water-om/asset-assessments/{id}/accept
      actor: MunicipalityAdmin
      preconditions:
      - AssetConditionAssessment.status == SUBMITTED
      - the owning Contract.status IN {AWARDED, MOBILIZING, OPERATING, UNDER_REVIEW}
      side_effects:
      - AssetConditionAssessment.baseline_binding set to true when is_baseline == true
      - the owning Asset transitions REGISTERED -> BASELINE_ASSESSED when is_baseline == true and the asset is still REGISTERED
    - from: REVISED
      to: ACCEPTED
      trigger: POST /water-om/asset-assessments/{id}/accept
      actor: MunicipalityAdmin
      preconditions:
      - AssetConditionAssessment.status == REVISED
      side_effects:
      - AssetConditionAssessment.baseline_binding set to true when is_baseline == true
      - the owning Asset transitions BASELINE_DISPUTED -> IN_SERVICE when Contract.status == MOBILIZING
  - entity: Permit
    initial_state: APPLICATION_DRAFTED
    terminal_states:
    - EXPIRED
    transitions:
    - from: APPLICATION_DRAFTED
      to: SUBMITTED
      trigger: POST /water-om/permits/{id}/submit-application
      actor: OperatorAdmin
      preconditions:
      - Permit.expiration_date > Permit.effective_date
      side_effects:
      - Permit.status_changed_at stamped
    - from: SUBMITTED
      to: ISSUED
      trigger: POST /water-om/permits/{id}/issue
      actor: MunicipalityAdmin
      preconditions:
      - Permit.status == SUBMITTED
      - the owning Contract.baseline_frozen == true
      side_effects:
      - Permit.status_changed_at stamped
    - from: ISSUED
      to: ACTIVE
      trigger: POST /water-om/permits/{id}/activate
      actor: OperatorAdmin
      preconditions:
      - now >= Permit.effective_date
      - the owning Contract.status IN {OPERATING, UNDER_REVIEW, RENEWED}
      side_effects:
      - Permit.status_changed_at stamped
    - from: ACTIVE
      to: NOTICE_OF_VIOLATION
      trigger: POST /water-om/permits/{id}/notices-of-violation
      actor: MunicipalityAdmin
      preconditions:
      - a PenaltyAllocation under this permit has status IN {ALLOCATED, CONTESTED, ADJUSTED}
      side_effects:
      - the offending PenaltyAllocation.status is set to CONTESTED when it was ALLOCATED
      note: 'Depth-2 cascade origin B: permit violation -> allocation contested.'
    - from: NOTICE_OF_VIOLATION
      to: ACTIVE
      trigger: POST /water-om/permits/{id}/clear-violation
      actor: MunicipalityAdmin
      preconditions:
      - every PenaltyAllocation under this permit has status IN {SETTLED, VOIDED}
      side_effects:
      - Permit.status_changed_at stamped
    - from: ACTIVE
      to: RENEWAL_FILED
      trigger: POST /water-om/permits/{id}/file-renewal
      actor: OperatorAdmin
      preconditions:
      - now >= Permit.expiration_date - 180 days
      side_effects:
      - Permit.effective_date advanced by 365 days
      - Permit.expiration_date advanced by 365 days
    - from: RENEWAL_FILED
      to: ACTIVE
      trigger: POST /water-om/permits/{id}/activate-renewal
      actor: MunicipalityAdmin
      preconditions:
      - Permit.status == RENEWAL_FILED
      side_effects:
      - Permit.status_changed_at stamped
      note: 'Cycle edge: RENEWAL_FILED -> ACTIVE closes the permit renewal loop.'
    - from: RENEWAL_FILED
      to: SUSPENDED
      trigger: POST /water-om/permits/{id}/suspend
      actor: MunicipalityAdmin
      preconditions:
      - at least one PenaltyAllocation under this permit has status CONTESTED
      side_effects:
      - every PerformanceMeasurement under the same contract with status ASSESSED and in_breach == true is eligible for waiving
    - from: ACTIVE
      to: SUSPENDED
      trigger: POST /water-om/permits/{id}/suspend or the Contract TERMINATED cascade
      actor: MunicipalityAdmin
      preconditions:
      - Permit.status == ACTIVE
      side_effects:
      - every PMSchedule under the permit's contract with status ACTIVE referencing a TREATMENT_UNIT asset transitions to SUSPENDED
    - from: SUSPENDED
      to: ACTIVE
      trigger: POST /water-om/permits/{id}/reinstate
      actor: MunicipalityAdmin
      preconditions:
      - no PenaltyAllocation under this permit has status IN {ALLOCATED, CONTESTED}
      side_effects:
      - Permit.status_changed_at stamped
    - from: ACTIVE
      to: EXPIRED
      trigger: 'system event: Contract TRANSITIONED cascade'
      actor: system
      preconditions:
      - the owning Contract.status == TRANSITIONED
      side_effects:
      - Permit.status_changed_at stamped
  - entity: PenaltyAllocation
    initial_state: ALLOCATED
    terminal_states:
    - SETTLED
    - VOIDED
    transitions:
    - from: ALLOCATED
      to: CONTESTED
      trigger: POST /water-om/penalty-allocations/{id}/contest or the Permit NOTICE_OF_VIOLATION cascade
      actor: MunicipalityAdmin
      preconditions:
      - PenaltyAllocation.status == ALLOCATED
      - now < PenaltyAllocation.status_changed_at + 60 days
      side_effects:
      - PenaltyAllocation.status_changed_at stamped
    - from: CONTESTED
      to: ADJUSTED
      trigger: POST /water-om/penalty-allocations/{id}/adjust
      actor: MunicipalityAdmin
      preconditions:
      - a revised total_penalty_cents is supplied
      - PenaltyAllocation.status == CONTESTED
      side_effects:
      - PenaltyAllocation.operator_share_cents recomputed by the penalty_allocation formula
      - PenaltyAllocation.municipality_share_cents recomputed as total minus operator share
      - PenaltyAllocation.state_baseline_share_cents recomputed by the chronological variant
      - the owning Contract.total_operator_penalty_cents adjusted by the difference in operator share
      note: 'Depth-2 cascade: an adjusted allocation mutates the contract''s penalty total.'
    - from: CONTESTED
      to: VOIDED
      trigger: POST /water-om/penalty-allocations/{id}/void
      actor: MunicipalityAdmin
      preconditions:
      - no PenaltyAllocation under the same permit has status SETTLED
      side_effects:
      - the owning Contract.total_operator_penalty_cents decreased by the previously allocated operator share
    - from: ADJUSTED
      to: SETTLED
      trigger: POST /water-om/penalty-allocations/{id}/settle
      actor: MunicipalityAdmin
      preconditions:
      - the owning Municipality.total_operator_penalty_cents equals the sum of operator_share_cents over this municipality's non-void allocations
      - PenaltyAllocation.status == ADJUSTED
      side_effects:
      - PenaltyAllocation.status_changed_at stamped
    - from: ALLOCATED
      to: SETTLED
      trigger: POST /water-om/penalty-allocations/{id}/settle
      actor: MunicipalityAdmin
      preconditions:
      - the allocation was never contested within the 60 day window
      side_effects:
      - PenaltyAllocation.status_changed_at stamped
    - from: ADJUSTED
      to: CONTESTED
      trigger: POST /water-om/penalty-allocations/{id}/contest
      actor: MunicipalityAdmin
      preconditions:
      - PenaltyAllocation.status == ADJUSTED
      - now < PenaltyAllocation.status_changed_at + 60 days
      side_effects:
      - PenaltyAllocation.status_changed_at stamped
      note: 'Cycle edge: ADJUSTED -> CONTESTED -> ADJUSTED repeats until the 60 day window closes.'
  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states:
    - CLOSED
    - CANCELLED
    transitions:
    - from: DRAFT
      to: SCHEDULED
      trigger: POST /water-om/work-orders/{id}/schedule
      actor: OperatorAdmin
      preconditions:
      - WorkOrder.estimated_cost_cents > 0
      - the owning Contract.status IN {MOBILIZING, OPERATING, UNDER_REVIEW, RENEWED}
      side_effects:
      - WorkOrder.expense_class recomputed by the expense_class boundary rule
    - from: SCHEDULED
      to: IN_PROGRESS
      trigger: POST /water-om/work-orders/{id}/start
      actor: OperatorAdmin
      preconditions:
      - WorkOrder.status == SCHEDULED
      - WorkOrder.expense_class != REJECTED_AS_CAPITAL
      side_effects:
      - WorkOrder.status_changed_at stamped
    - from: IN_PROGRESS
      to: PAUSED
      trigger: POST /water-om/work-orders/{id}/pause
      actor: OperatorAdmin
      preconditions:
      - a pause reason is supplied
      side_effects:
      - WorkOrder.status_changed_at stamped
    - from: PAUSED
      to: IN_PROGRESS
      trigger: POST /water-om/work-orders/{id}/resume
      actor: OperatorAdmin
      preconditions:
      - WorkOrder.status == PAUSED
      side_effects:
      - WorkOrder.status_changed_at stamped
      note: 'Revert edge: PAUSED -> IN_PROGRESS -> PAUSED repeats.'
    - from: IN_PROGRESS
      to: AWAITING_PARTS
      trigger: POST /water-om/work-orders/{id}/await-parts
      actor: OperatorAdmin
      preconditions:
      - the owning Contract.status == OPERATING
      - WorkOrder.actual_cost_cents > 0
      side_effects:
      - WorkOrder.cost_variance_cents recomputed by the cost_variance formula
    - from: AWAITING_PARTS
      to: IN_PROGRESS
      trigger: POST /water-om/work-orders/{id}/resume
      actor: OperatorAdmin
      preconditions:
      - WorkOrder.status == AWAITING_PARTS
      side_effects:
      - WorkOrder.status_changed_at stamped
      note: 'Revert edge: AWAITING_PARTS -> IN_PROGRESS -> AWAITING_PARTS repeats.'
    - from: IN_PROGRESS
      to: COMPLETED
      trigger: POST /water-om/work-orders/{id}/complete
      actor: OperatorAdmin
      preconditions:
      - WorkOrder.status IN {IN_PROGRESS, PAUSED}
      - a closure_narrative of at least 40 characters is supplied
      side_effects:
      - WorkOrder.actual_cost_cents set to the sum of the supplied labour and materials cost components
      - WorkOrder.cost_variance_cents recomputed by the cost_variance formula
      - WorkOrder.documentation_complete computed from the closure field rules
      - WorkOrder.status is returned with 409 ERR_WORK_ORDER_DOCUMENTATION_INCOMPLETE when documentation_complete == false
    - from: PAUSED
      to: COMPLETED
      trigger: POST /water-om/work-orders/{id}/complete
      actor: OperatorAdmin
      preconditions:
      - a closure_narrative of at least 40 characters is supplied
      side_effects:
      - WorkOrder.actual_cost_cents set to the sum of the supplied labour and materials cost components
      - WorkOrder.cost_variance_cents recomputed by the cost_variance formula
      - WorkOrder.documentation_complete computed from the closure field rules
    - from: COMPLETED
      to: VERIFIED
      trigger: POST /water-om/work-orders/{id}/verify
      actor: MunicipalityAdmin
      preconditions:
      - WorkOrder.documentation_complete == true
      - WorkOrder.status == COMPLETED
      side_effects:
      - the owning Asset.condition_score adjusted by the closure condition delta
      - Asset.condition_band recomputed from condition_score
      - if Asset.condition_score < 40.0 the owning Asset transitions IN_SERVICE -> REPLACEMENT_FLAGGED
      note: 'Depth-4 cascade link 2: work order verification -> asset condition drop -> replacement flag -> capital work order creation.'
    - from: COMPLETED
      to: RETURNED
      trigger: POST /water-om/work-orders/{id}/return
      actor: MunicipalityAdmin
      preconditions:
      - WorkOrder.documentation_complete == false or WorkOrder.expense_class == PENDING_CLASSIFICATION
      side_effects:
      - WorkOrder.actual_cost_cents reset to 0
      - WorkOrder.cost_variance_cents reset to 0
    - from: RETURNED
      to: COMPLETED
      trigger: POST /water-om/work-orders/{id}/complete
      actor: OperatorAdmin
      preconditions:
      - a closure_narrative of at least 40 characters is supplied
      - WorkOrder.status == RETURNED
      side_effects:
      - WorkOrder.actual_cost_cents set to the sum of the supplied labour and materials cost components
      - WorkOrder.documentation_complete recomputed
      note: 'Cycle edge: COMPLETED -> RETURNED -> COMPLETED repeats until documentation is complete.'
    - from: VERIFIED
      to: CLOSED
      trigger: POST /water-om/work-orders/{id}/close
      actor: MunicipalityAdmin
      preconditions:
      - WorkOrder.submitted_to_municipality_at is more than 5 days before now
      - WorkOrder.expense_class != PENDING_CLASSIFICATION
      side_effects:
      - WorkOrder.status_changed_at stamped
    - from: VERIFIED
      to: RETURNED
      trigger: POST /water-om/work-orders/{id}/return
      actor: MunicipalityAdmin
      preconditions: []
      side_effects:
      - WorkOrder.documentation_complete reset to false
    - from: DRAFT
      to: CANCELLED
      trigger: POST /water-om/work-orders/{id}/cancel
      actor: OperatorAdmin
      preconditions:
      - WorkOrder.status == DRAFT
      side_effects:
      - WorkOrder.status_changed_at stamped
    - from: SCHEDULED
      to: CANCELLED
      trigger: POST /water-om/work-orders/{id}/cancel
      actor: MunicipalityAdmin
      preconditions:
      - no meter reading or closure data has been recorded for this work order
      side_effects:
      - WorkOrder.status_changed_at stamped
  - entity: PMSchedule
    initial_state: DRAFT
    terminal_states:
    - RETIRED
    transitions:
    - from: DRAFT
      to: ACTIVE
      trigger: system cascade from Contract MOBILIZING
      actor: system
      preconditions:
      - PMSchedule.next_due_at is set
      side_effects:
      - PMSchedule.next_due_at set from the owning Contract.contract_start_date plus frequency_days
    - from: ACTIVE
      to: DUE
      trigger: 'system event: the generated PM occurrence reaches its due instant'
      actor: system
      preconditions:
      - now >= PMSchedule.next_due_at
      side_effects:
      - PMSchedule.status_changed_at stamped
      - if no PMWorkOrder already exists for this occurrence, a WorkOrder of work_type PREVENTIVE is created in status SCHEDULED under the schedule's asset
    - from: DUE
      to: ACTIVE
      trigger: POST /water-om/pm-schedules/{id}/regenerate
      actor: OperatorAdmin
      preconditions:
      - the linked preventive WorkOrder has status CLOSED
      - the linked preventive WorkOrder.status_changed_at is at most 7 days after PMSchedule.next_due_at
      side_effects:
      - PMSchedule.next_due_at advanced by frequency_days
      - PMSchedule.compliance_rate_pct recomputed by the PM compliance formula
      note: 'Revert edge: DUE -> ACTIVE on timely completion; this is the compliant path.'
    - from: DUE
      to: OVERDUE
      trigger: 'system event: the grace window closes'
      actor: system
      preconditions:
      - now > PMSchedule.next_due_at + 7 days
      - the linked preventive WorkOrder.status != CLOSED
      side_effects:
      - PMSchedule.missed_occurrence_count incremented by 1
      - PMSchedule.compliance_rate_pct recomputed by the PM compliance formula
      - PMSchedule.next_due_at advanced by frequency_days
      - if the regenerated PMSchedule.missed_occurrence_count reaches exactly 3, the owning Asset transitions IN_SERVICE -> REPLACEMENT_FLAGGED
      note: 'Depth-4 cascade link 1: PM miss -> PMSchedule OVERDUE -> Asset REPLACEMENT_FLAGGED -> Asset creates a capital WorkOrder.'
    - from: OVERDUE
      to: ACTIVE
      trigger: POST /water-om/pm-schedules/{id}/regenerate
      actor: OperatorAdmin
      preconditions:
      - the linked preventive WorkOrder has status CLOSED
      side_effects:
      - PMSchedule.compliance_rate_pct recomputed by the PM compliance formula
      note: 'Revert edge: OVERDUE -> ACTIVE re-enters the cycle and the loop repeats.'
    - from: OVERDUE
      to: SUSPENDED
      trigger: POST /water-om/pm-schedules/{id}/suspend
      actor: MunicipalityAdmin
      preconditions:
      - the owning Contract.status IN {UNDER_REVIEW, TERMINATED, HANDING_BACK}
      side_effects:
      - PMSchedule.status_changed_at stamped
    - from: SUSPENDED
      to: ACTIVE
      trigger: POST /water-om/pm-schedules/{id}/reactivate
      actor: OperatorAdmin
      preconditions:
      - the owning Contract.status IN {OPERATING, RENEWED}
      - the owning Asset.status != OUT_OF_SERVICE
      side_effects:
      - PMSchedule.next_due_at advanced by frequency_days from now
    - from: ACTIVE
      to: COMPLETED
      trigger: POST /water-om/pm-schedules/{id}/close-out
      actor: MunicipalityAdmin
      preconditions:
      - the owning Contract.status == HANDING_BACK
      side_effects:
      - PMSchedule.status_changed_at stamped
    - from: COMPLETED
      to: RETIRED
      trigger: POST /water-om/pm-schedules/{id}/retire
      actor: MunicipalityAdmin
      preconditions:
      - the owning Contract.status IN {HANDING_BACK, TRANSITIONED}
      side_effects:
      - PMSchedule.status_changed_at stamped
  - entity: EmergencyEvent
    initial_state: REPORTED
    terminal_states:
    - CLOSED
    transitions:
    - from: REPORTED
      to: DISPATCHED
      trigger: POST /water-om/emergency-events/{id}/dispatch
      actor: OperatorAdmin
      preconditions:
      - EmergencyEvent.status == REPORTED
      - the owning Contract.status IN {OPERATING, UNDER_REVIEW, RENEWED}
      side_effects:
      - EmergencyEvent.notify_deadline_at computed by the notification_deadline formula
    - from: DISPATCHED
      to: CONTAINED
      trigger: POST /water-om/emergency-events/{id}/contain
      actor: OperatorAdmin
      preconditions:
      - EmergencyEvent.status == DISPATCHED
      side_effects:
      - EmergencyEvent.response_minutes computed from occurred_at to the containment instant
      - if response_minutes exceeds the applicable response-time PerformanceStandard threshold_value, that standard transitions ACTIVE -> BREACHED
      note: 'Depth-3 cascade: contain -> response time breach -> standard BREACHED -> contract penalty recompute.'
    - from: CONTAINED
      to: RESTORED
      trigger: POST /water-om/emergency-events/{id}/restore
      actor: OperatorAdmin
      preconditions:
      - EmergencyEvent.status == CONTAINED
      - no WorkOrder under the emergency's asset has status IN {IN_PROGRESS, AWAITING_PARTS}
      side_effects:
      - EmergencyEvent.status_changed_at stamped
    - from: CONTAINED
      to: NOTIFIED
      trigger: POST /water-om/emergency-events/{id}/notify
      actor: OperatorAdmin
      preconditions:
      - a notification reference is supplied
      side_effects:
      - EmergencyEvent.notified_at stamped
      - EmergencyEvent.notification_late computed by the notification_deadline formula
      - if notification_late == true the owning Permit transitions ACTIVE -> NOTICE_OF_VIOLATION
      note: Depth-3 alternative branch off CONTAINED, with a different side-effect set than RESTORED.
    - from: RESTORED
      to: NOTIFIED
      trigger: POST /water-om/emergency-events/{id}/notify
      actor: OperatorAdmin
      preconditions:
      - a notification reference is supplied
      side_effects:
      - EmergencyEvent.notified_at stamped
      - EmergencyEvent.notification_late computed by the notification_deadline formula
    - from: CONTAINED
      to: ESCALATED
      trigger: POST /water-om/emergency-events/{id}/escalate
      actor: MunicipalityAdmin
      preconditions:
      - EmergencyEvent.severity IN {HIGH, CRITICAL}
      - now >= EmergencyEvent.occurred_at + 240 minutes
      side_effects:
      - every StaffingCommitment under the owning contract in status IN {BINDING, SATISFIED} is flagged for emergency re-staffing
      - the owning Contract.status is set to UNDER_REVIEW when the contract is in OPERATING
    - from: RESTORED
      to: ESCALATED
      trigger: POST /water-om/emergency-events/{id}/escalate
      actor: MunicipalityAdmin
      preconditions:
      - EmergencyEvent.severity == CRITICAL
      side_effects:
      - the owning Contract.status is set to UNDER_REVIEW when the contract is in OPERATING
      note: Second entry into the same state with a different side-effect set — branch-dependent fan-out.
    - from: NOTIFIED
      to: UNDER_INVESTIGATION
      trigger: POST /water-om/emergency-events/{id}/investigate
      actor: MunicipalityAdmin
      preconditions:
      - EmergencyEvent.notified_at is set
      side_effects:
      - EmergencyEvent.status_changed_at stamped
    - from: ESCALATED
      to: UNDER_INVESTIGATION
      trigger: POST /water-om/emergency-events/{id}/investigate
      actor: MunicipalityAdmin
      preconditions:
      - EmergencyEvent.status == ESCALATED
      side_effects:
      - a PenaltyAllocation is created under the owning contract's active Permit in status ALLOCATED
      note: 'Depth-2 cascade origin A: escalation investigation -> allocation created.'
    - from: UNDER_INVESTIGATION
      to: CLOSED
      trigger: POST /water-om/emergency-events/{id}/close
      actor: MunicipalityAdmin
      preconditions:
      - no PenaltyAllocation created from this event has status IN {ALLOCATED, CONTESTED}
      side_effects:
      - EmergencyEvent.status_changed_at stamped
  - entity: RenewalProposal
    initial_state: DRAFTED
    terminal_states:
    - ACCEPTED
    - REJECTED
    - WITHDRAWN
    - LAPSED
    transitions:
    - from: DRAFTED
      to: SUBMITTED
      trigger: POST /water-om/contracts/{id}/renewal-proposals
      actor: OperatorAdmin
      preconditions:
      - RenewalProposal.round_number == Contract.renewal_round + 1
      - Contract.status == RENEWAL_PENDING
      side_effects:
      - RenewalProposal.benchmark_ratio recomputed by the benchmark comparison formula
    - from: SUBMITTED
      to: UNDER_REVIEW
      trigger: POST /water-om/renewal-proposals/{id}/review
      actor: MunicipalityAdmin
      preconditions:
      - RenewalProposal.status == SUBMITTED
      - RenewalProposal.benchmark_ratio <= 1.25
      side_effects:
      - RenewalProposal.status_changed_at stamped
    - from: UNDER_REVIEW
      to: COUNTERED
      trigger: POST /water-om/renewal-proposals/{id}/counter
      actor: MunicipalityAdmin
      preconditions:
      - a counter proposed_fee_cents and proposed_term_years are supplied
      - RenewalProposal.status == UNDER_REVIEW
      side_effects:
      - a new RenewalProposal is created under the contract in status SUBMITTED with round_number = Contract.renewal_round + 1 and submitted_by = MUNICIPALITY
      - RenewalProposal.status_changed_at stamped
      note: 'Cycle edge: each counter creates the next round''s proposal, so COUNTERED -> SUBMITTED -> COUNTERED repeats across rounds.'
    - from: SUBMITTED
      to: ACCEPTED
      trigger: POST /water-om/renewal-proposals/{id}/accept
      actor: MunicipalityAdmin
      preconditions:
      - RenewalProposal.status IN {SUBMITTED, UNDER_REVIEW}
      - Contract.status == RENEWAL_PENDING
      side_effects:
      - the owning Contract transitions RENEWAL_PENDING -> RENEWED
    - from: COUNTERED
      to: ACCEPTED
      trigger: POST /water-om/renewal-proposals/{id}/accept
      actor: OperatorAdmin
      preconditions:
      - RenewalProposal.submitted_by == MUNICIPALITY
      - RenewalProposal.status == COUNTERED
      side_effects:
      - the owning Contract transitions RENEWAL_PENDING -> RENEWED
    - from: SUBMITTED
      to: REJECTED
      trigger: POST /water-om/renewal-proposals/{id}/reject
      actor: MunicipalityAdmin
      preconditions:
      - a rejection reason is supplied
      side_effects:
      - RenewalProposal.status_changed_at stamped
    - from: UNDER_REVIEW
      to: WITHDRAWN
      trigger: POST /water-om/renewal-proposals/{id}/withdraw
      actor: OperatorAdmin
      preconditions:
      - RenewalProposal.status == UNDER_REVIEW
      side_effects:
      - RenewalProposal.status_changed_at stamped
      note: 'Revert edge: the operator can withdraw while the municipality still has it under review.'
    - from: SUBMITTED
      to: LAPSED
      trigger: 'system event: the owning Contract leaves RENEWAL_PENDING'
      actor: system
      preconditions:
      - Contract.status != RENEWAL_PENDING
      side_effects:
      - RenewalProposal.status_changed_at stamped
  - entity: TransitionObligation
    initial_state: DRAFT
    terminal_states:
    - SATISFIED
    - WAIVED
    transitions:
    - from: DRAFT
      to: PENDING
      trigger: system cascade from Contract HANDING_BACK
      actor: system
      preconditions:
      - Contract.status == HANDING_BACK
      side_effects:
      - TransitionObligation.outstanding_days computed by the transition_back_credit formula
    - from: PENDING
      to: IN_PROGRESS
      trigger: POST /water-om/transition-obligations/{id}/start
      actor: OperatorAdmin
      preconditions:
      - TransitionObligation.status == PENDING
      - now < TransitionObligation.due_at
      side_effects:
      - TransitionObligation.status_changed_at stamped
    - from: PENDING
      to: OVERDUE
      trigger: 'system event: the obligation due instant passes'
      actor: system
      preconditions:
      - now >= TransitionObligation.due_at
      side_effects:
      - TransitionObligation.outstanding_days computed
      - TransitionObligation.withholding_cents recomputed by the transition_back_credit formula
    - from: IN_PROGRESS
      to: OVERDUE
      trigger: 'system event: the obligation due instant passes'
      actor: system
      preconditions:
      - now >= TransitionObligation.due_at
      side_effects:
      - TransitionObligation.outstanding_days computed
      - TransitionObligation.withholding_cents recomputed by the transition_back_credit formula
    - from: IN_PROGRESS
      to: SATISFIED
      trigger: POST /water-om/transition-obligations/{id}/satisfy
      actor: OperatorAdmin
      preconditions:
      - TransitionObligation.status IN {PENDING, IN_PROGRESS}
      side_effects:
      - TransitionObligation.completed_at stamped
      - TransitionObligation.outstanding_days reset to 0
      - TransitionObligation.withholding_cents reset to 0
    - from: OVERDUE
      to: DISPUTED
      trigger: POST /water-om/transition-obligations/{id}/dispute
      actor: OperatorAdmin
      preconditions:
      - TransitionObligation.status == OVERDUE
      - a dispute basis is supplied
      side_effects:
      - TransitionObligation.status_changed_at stamped
      note: 'Revert edge: disputing an overdue obligation suspends the withholding accrual until resolution.'
    - from: DISPUTED
      to: OVERDUE
      trigger: POST /water-om/transition-obligations/{id}/uphold
      actor: MunicipalityAdmin
      preconditions:
      - TransitionObligation.status == DISPUTED
      side_effects:
      - TransitionObligation.withholding_cents recomputed by the transition_back_credit formula
      note: 'Cycle edge: DISPUTED -> OVERDUE -> DISPUTED repeats while the obligation remains outstanding.'
    - from: DISPUTED
      to: WAIVED
      trigger: POST /water-om/transition-obligations/{id}/waive
      actor: MunicipalityAdmin
      preconditions:
      - TransitionObligation.is_critical == false
      side_effects:
      - TransitionObligation.withholding_cents reset to 0
    - from: OVERDUE
      to: ESCALATED
      trigger: 'system event: the obligation falls more than 30 whole days past due'
      actor: system
      preconditions:
      - TransitionObligation.outstanding_days > 30
      side_effects:
      - TransitionObligation.status_changed_at stamped
      - the owning Contract.status is set to UNDER_REVIEW when the contract is in HANDING_BACK
      note: 'Depth-2 cascade: an obligation''s own overdue arithmetic forces its parent contract back for review.'
    - from: ESCALATED
      to: SATISFIED
      trigger: POST /water-om/transition-obligations/{id}/satisfy
      actor: MunicipalityAdmin
      preconditions:
      - TransitionObligation.status == ESCALATED
      side_effects:
      - TransitionObligation.completed_at stamped
      - TransitionObligation.withholding_cents recomputed by the transition_back_credit formula
    - from: OVERDUE
      to: WAIVED
      trigger: POST /water-om/transition-obligations/{id}/waive
      actor: MunicipalityAdmin
      preconditions:
      - TransitionObligation.is_critical == false
      side_effects:
      - TransitionObligation.withholding_cents reset to 0
concurrency_rules:
  - rule_id: contract-review-stale-version
    parent_entity: Contract
    write_endpoint: POST /water-om/contracts/{id}/reviews
    occ_field: expected_contract_version
    description: 'Opening a contract review against a Contract whose version has advanced since

      the client last observed it is rejected. This captures the case where the

      contract''s staffing or performance state moved between the client''s read and

      its write, so the review would be opened against a stale view of the contract.

      '
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-handback-stale-version
    parent_entity: Contract
    write_endpoint: POST /water-om/contracts/{id}/hand-back
    occ_field: expected_contract_version
    description: 'Starting the transition-back path against a Contract whose version has advanced

      since the client last observed it is rejected. This captures the case where a

      renewal proposal was accepted or a critical obligation was satisfied between the

      client''s read and its write, changing the contract''s hand-back eligibility.

      '
    error_id: ERR_STALE_VERSION
    http_status: 412
calculations:
  - name: expense_class_boundary
    trigger: POST /water-om/work-orders/{id}/schedule (WorkOrder DRAFT -> SCHEDULED) and any mutation of WorkOrder.estimated_cost_cents
    algorithm: threshold
    formula: "# Evaluation order is PINNED: PENDING -> REJECT -> LIFE_EVENT -> THRESHOLD -> OPERATING.\n# Each branch is tested in that order and the first match wins.\nif estimated_cost_cents == 0 or Asset.status\
      \ NOT IN {BASELINE_ASSESSED, IN_SERVICE, REPLACEMENT_FLAGGED}:\n    return PENDING_CLASSIFICATION\nif estimated_cost_cents >= CAPITAL_REJECT_COST_FLOOR_CENTS and Asset.condition_score >= CAPITAL_REJECT_CONDITION_SCORE:\n\
      \    return REJECTED_AS_CAPITAL\nif estimated_cost_cents >= OPERATING_COST_CEILING_CENTS:\n    asset_end_year = Asset.install_year + Asset.useful_life_years\n    current_year   = year(now)\n    if current_year\
      \ >= asset_end_year:\n        return CAPITAL_LIFE_EVENT\n    return CAPITAL_THRESHOLD\nreturn OPERATING\n"
    input_set: the single WorkOrder being classified, joined to its owning Asset's condition_score, install_year and useful_life_years; Asset.status filter is BASELINE_ASSESSED, IN_SERVICE or REPLACEMENT_FLAGGED
    constants:
      OPERATING_COST_CEILING_CENTS: 2500000
      CAPITAL_REJECT_COST_FLOOR_CENTS: 5000000
      CAPITAL_REJECT_CONDITION_SCORE: 60.0
    precision: integer cents; condition_score compared at 1 decimal place
    variants:
    - name: capital_threshold_boundary_inclusive
      when: estimated_cost_cents is exactly 2500000
      difference: the >= comparison classifies the work order as CAPITAL, not OPERATING; a > comparison would classify it as OPERATING and shift the funding party
  - name: work_order_cost_variance
    trigger: POST /water-om/work-orders/{id}/complete and POST /water-om/work-orders/{id}/await-parts
    algorithm: aggregation
    formula: '# Rounding order is PINNED: round each cost component separately, THEN sum. Summing

      # raw components and rounding once produces different cents.

      labour_component_cents    = round_half_up(labour_hours * LOADED_LABOUR_RATE_CENTS, 0)

      materials_component_cents = round_half_up(materials_cents * MATERIALS_OVERHEAD_FACTOR, 0)

      actual_cost_cents         = labour_component_cents + materials_component_cents

      cost_variance_cents       = actual_cost_cents - estimated_cost_cents

      '
    input_set: the single WorkOrder being completed; labour_hours and materials_cents are supplied in the closure payload; estimated_cost_cents is the pre-closure estimate
    constants:
      LOADED_LABOUR_RATE_CENTS: 8450
      MATERIALS_OVERHEAD_FACTOR: 1.0875
    precision: integer cents; round_half_up applied per component before summation
    variants:
    - name: sum_then_round
      when: an implementation rounds (labour + materials) once at the end
      difference: round_per_component yields 631703 for 12.5 h at 8450 cents and 483750 cents of materials; sum_then_round yields 631703 as well only when both components are already integral — the variants
        diverge whenever either raw component carries a fraction, e.g. labour_hours 12.3
  - name: penalty_allocation
    trigger: POST /water-om/penalty-allocations (create) and POST /water-om/penalty-allocations/{id}/adjust
    algorithm: forward_looking
    formula: "# DEFAULT (forward-looking) operator share — written to operator_share_cents.\nbase_share   = round_half_up(total_penalty_cents * Contract.operator_penalty_share_pct, 0)\nbreach_count = count(PerformanceStandard\
      \ where contract_id = Contract.id and status == BREACHED)\nif breach_count >= 1:\n    uplift = round_half_up(total_penalty_cents * BREACH_UPLIFT_PCT, 0)\nelse:\n    uplift = 0\noperator_share_cents\
      \        = min(base_share + uplift, total_penalty_cents)\nmunicipality_share_cents    = total_penalty_cents - operator_share_cents\n"
    input_set: the single PenaltyAllocation being created or adjusted, joined to its owning Contract's operator_penalty_share_pct and the count of BREACHED PerformanceStandard rows under that contract
    constants:
      BREACH_UPLIFT_PCT: 0.15
      REPEAT_TIER_STEP_PCT: 0.05
      REPEAT_TIER_CAP_PCT: 0.15
    precision: integer cents; round_half_up; municipality share is the exact remainder, never independently rounded
    variants:
    - name: chronological_recidivist_tier
      when: the alternative public-operation baseline share, written to state_baseline_share_cents
      difference: 'Walk the PenaltyAllocation rows under the same Permit in created_at ASC order (tie-break created_at ASC, then the violation_code of the allocation, never id) and treat the row being evaluated
        as the nth (1-indexed) allocation. tier_rate = Contract.operator_penalty_share_pct + min(REPEAT_TIER_STEP_PCT * (n - 1), REPEAT_TIER_CAP_PCT). state_baseline_share_cents = round_half_up(total_penalty_cents
        * tier_rate, 0), capped at total_penalty_cents. This applies no breach uplift at all: for total_penalty_cents 2000000 with operator_penalty_share_pct 0.45 the first allocation under a permit (n =
        1) yields exactly 900000, while the forward-looking variant yields exactly 1200000 on the same inputs when one PerformanceStandard under the contract is BREACHED, and exactly 900000 when none is.'
  - name: benchmark_comparison
    trigger: POST /water-om/contracts/{id}/renewal-proposals and POST /water-om/renewal-proposals/{id}/review
    algorithm: weighted_scoring
    formula: '# DEFAULT (forward-looking) index — written to Municipality.benchmark_index_baseline.

      daily_mgd(contract)      = Municipality.population_served * MGD_PER_CAPITA

      annual_mg(contract)      = daily_mgd(contract) * 365

      cost_per_mg(contract)    = Contract.annual_fee_cents / annual_mg(contract)

      included = contracts whose status IN {OPERATING, UNDER_REVIEW, RENEWED}

      benchmark_index_baseline = round_half_up(mean(cost_per_mg(c) for c in included), 4)

      if included is empty: benchmark_index_baseline = 0.0

      # RenewalProposal.benchmark_ratio is then:

      ratio_base_cents = round_half_up(Municipality.benchmark_index_baseline * Contract.staffing_floor_fte * 12, 0)

      benchmark_ratio  = round_half_up(RenewalProposal.proposed_fee_cents / ratio_base_cents, 4)

      '
    input_set: all Contract rows of the owning Municipality, filtered by status; the RenewalProposal being submitted supplies proposed_fee_cents and reads the owning Contract.staffing_floor_fte
    constants:
      MGD_PER_CAPITA: 0.00011
    precision: index rounded to 4 decimal places round_half_up; benchmark_ratio rounded to 4 decimal places round_half_up
    variants:
    - name: chronological_all_contracts_recency_weighted
      when: the public-operation comparison basis, computed on demand by GET /water-om/municipalities/{id}/benchmark
      difference: 'Uses every Contract of the municipality regardless of status, walked in award_date ASC order (tie-break award_date ASC, then created_at ASC, never id), with weight 1.0 on

        every row except the single most recently awarded row which carries weight RECENCY_WEIGHT = 1.5. The result is

        sum(weight * cost_per_mg) / sum(weight), rounded to 4 places. For two contracts at 30000.0000 and 20000.0000 cost per million gallons with the later one weighted 1.5

        this yields 24000.0000, while the forward-looking variant yields 30000.0000 when only the first contract is in a live status.

        '
  - name: staffing_floor
    trigger: POST /water-om/contracts/{id}/performance-standards/{sid}/activate, POST /water-om/contracts/{id}/mobilize, and any PerformanceStandard status change
    algorithm: constraint_propagation
    formula: '# Evaluation order is PINNED. base_fte is computed first; the tier band is selected from

      # base_fte ONLY; the surcharge is added afterwards. Selecting the band from the running

      # total recomputes a different surcharge and is the wrong interpretation.

      active = PerformanceStandard where contract_id = Contract.id and status == ACTIVE

      base_fte = round_half_up(0.5 * count(active) + 0.25 * sum(active.criticality_weight), 2)

      if base_fte >= 6.00:   surcharge_fte = 3.00

      elif base_fte >= 3.50: surcharge_fte = 2.00

      elif base_fte >= 1.50: surcharge_fte = 1.00

      else:                  surcharge_fte = 0.00

      staffing_floor_fte = base_fte + surcharge_fte

      '
    input_set: PerformanceStandard rows under the contract with status exactly ACTIVE; BREACHED, SUSPENDED, DRAFT and RETIRED rows are excluded from both the count and the weight sum
    constants:
      FTE_PER_STANDARD: 0.5
      CRITICALITY_CREDIT_FACTOR: 0.25
    precision: 2 decimal places, round_half_up
    variants:
    - name: band_from_running_total
      when: an implementation selects the surcharge band from the running total instead of from base_fte
      difference: six ACTIVE standards each with criticality_weight 1.0 give base_fte 4.50 (band from base_fte = 2.00) so staffing_floor_fte is 6.50; selecting the band from the running total 4.50 is identical,
        but once base_fte lands just under a band edge the two diverge, so the pinned order is base_fte-then-band
  - name: breach_score
    trigger: POST /water-om/performance-measurements/{id}/assess and POST /water-om/performance-measurements/{id}/revise
    algorithm: weighted_scoring
    formula: 'if in_breach == false: return 0.0

      threshold = PerformanceStandard.threshold_value

      deviation_ratio = abs(measured_value - threshold) / threshold

      if deviation_ratio >= 0.50:   severity_band = 1.00

      elif deviation_ratio >= 0.25: severity_band = 0.60

      elif deviation_ratio >= 0.10: severity_band = 0.30

      else:                         severity_band = 0.10

      weighted_breach_score = round_half_up(PerformanceStandard.criticality_weight * severity_band, 4)

      '
    input_set: the single PerformanceMeasurement being assessed, joined to its owning PerformanceStandard's threshold_value, threshold_direction and criticality_weight; in_breach is computed first from threshold_direction
    constants:
      SEVERE_DEVIATION_RATIO: 0.5
      MAJOR_DEVIATION_RATIO: 0.25
      MINOR_DEVIATION_RATIO: 0.1
    precision: 4 decimal places, round_half_up; deviation_ratio compared unrounded
    variants:
    - name: measured_before_breach_test
      when: an implementation applies the threshold_direction test against the rounded deviation rather than the in_breach flag
      difference: 'criticality_weight 0.50 against threshold_value 10.0: measured_value 12.5 gives deviation_ratio exactly 0.25, band 0.60, weighted_breach_score exactly 0.3000; measured_value 12.49 gives
        deviation_ratio 0.2490, band 0.10, weighted_breach_score exactly 0.0500. The pinned order is in_breach first, then the unrounded ratio'
  - name: pm_compliance_rate
    trigger: POST /water-om/pm-schedules/{id}/regenerate, POST /water-om/pm-schedules/{id}/suspend, and the DUE -> OVERDUE system event
    algorithm: aggregation
    formula: '# An occurrence is COMPLIANT when its linked preventive WorkOrder reached CLOSED at an

      # instant <= occurrence_due_at + GRACE_DAYS; the boundary is inclusive.

      window_end = occurrence_due_at + (GRACE_DAYS * 86400 seconds)

      compliant  = count(occurrences where linked_work_order.status == CLOSED and linked_work_order.status_changed_at <= window_end)

      missed     = count(occurrences where linked_work_order.status != CLOSED and now > window_end)

      if compliant + missed == 0: compliance_rate_pct = 0.00

      else: compliance_rate_pct = round_half_up(100 * compliant / (compliant + missed), 2)

      '
    input_set: all generated occurrences of this PMSchedule since its status first became ACTIVE, ordered by occurrence_due_at ASC (tie-break occurrence_due_at ASC, then created_at ASC, never id); occurrences
      for which the grace window has not yet closed are excluded from both numerator and denominator
    constants:
      GRACE_DAYS: 7
    precision: 2 decimal places, round_half_up; empty set yields exactly 0.00
    variants:
    - name: strict_before_deadline
      when: an implementation treats the grace boundary as exclusive
      difference: a closure recorded exactly 7 days after the due instant counts as compliant under <= and as missed under <, moving three of four occurrences from 75.00 to 50.00
  - name: notification_deadline
    trigger: POST /water-om/emergency-events/{id}/dispatch and POST /water-om/emergency-events/{id}/notify
    algorithm: threshold
    formula: "if event_type == CONTAMINATION:                    hours = CONTAMINATION_NOTIFY_HOURS\nelif event_type == SANITARY_OVERFLOW:              hours = OVERFLOW_NOTIFY_HOURS\nelif event_type == TREATMENT_UPSET:\
      \                hours = UPSET_NOTIFY_HOURS\nelif event_type == MAIN_BREAK:\n    hours = MAIN_BREAK_SEVERE_HOURS if severity IN {HIGH, CRITICAL} else MAIN_BREAK_STANDARD_HOURS\nelse:               \
      \                               hours = POWER_LOSS_NOTIFY_HOURS\nnotify_deadline_at = occurred_at + (hours * 3600 seconds)\nnotification_late  = (notified_at >= notify_deadline_at)   # boundary is INCLUSIVE\n"
    input_set: the single EmergencyEvent; severity is only consulted for MAIN_BREAK
    constants:
      CONTAMINATION_NOTIFY_HOURS: 1
      OVERFLOW_NOTIFY_HOURS: 2
      UPSET_NOTIFY_HOURS: 4
      MAIN_BREAK_STANDARD_HOURS: 24
      MAIN_BREAK_SEVERE_HOURS: 4
      POWER_LOSS_NOTIFY_HOURS: 24
    precision: whole seconds; the deadline is an exact instant, not a rounded day
    variants:
    - name: exclusive_deadline_boundary
      when: an implementation treats a notification filed exactly at the deadline as on time
      difference: a MEDIUM MAIN_BREAK occurring at 2026-05-01T00:00:00Z has deadline 2026-05-02T00:00:00Z; filing at exactly that instant sets notification_late true, and filing one second earlier sets it
        false
  - name: vesting_benefit
    trigger: POST /water-om/contracts/{id}/employees/{eid}/offer
    algorithm: tiered_pricing
    formula: 'years = (Contract.contract_start_date - Employee.municipal_hire_date) / 365 days, rounded to 2 places

      if years >= GRANDFATHERED_YEARS: benefit_tier = GRANDFATHERED

      elif years >= ENHANCED_YEARS:    benefit_tier = ENHANCED

      elif years >= STANDARD_YEARS:    benefit_tier = STANDARD

      elif years >= BASIC_YEARS:       benefit_tier = BASIC

      else:                            benefit_tier = NONE

      if benefit_tier IN {NONE, GRANDFATHERED}: pension_offset_cents = 0

      elif benefit_tier == ENHANCED:  pension_offset_cents = round_half_up(ENHANCED_OFFSET_PER_YEAR_CENTS * years, 0)

      elif benefit_tier == STANDARD:  pension_offset_cents = round_half_up(STANDARD_OFFSET_PER_YEAR_CENTS * years, 0)

      else:                           pension_offset_cents = round_half_up(BASIC_OFFSET_PER_YEAR_CENTS * years, 0)

      '
    input_set: the single Employee being offered, joined to its owning Contract.contract_start_date
    constants:
      GRANDFATHERED_YEARS: 20
      ENHANCED_YEARS: 10
      STANDARD_YEARS: 5
      BASIC_YEARS: 1
      BASIC_OFFSET_PER_YEAR_CENTS: 120000
      STANDARD_OFFSET_PER_YEAR_CENTS: 185000
      ENHANCED_OFFSET_PER_YEAR_CENTS: 250000
    precision: years to 2 decimal places; cents integer, round_half_up
    variants:
    - name: strict_band_boundary
      when: an implementation uses > instead of >= at the tier edges
      difference: an employee with exactly 10.00 years of service is ENHANCED with pension_offset_cents 2500000 under >=, and standard with 1850000 under >
  - name: transition_back_credit
    trigger: the TransitionObligation PENDING -> OVERDUE system event, the OVERDUE -> ESCALATED system event, and POST /water-om/transition-obligations/{id}/satisfy
    algorithm: decay_function
    formula: "if now > due_at:\n    outstanding_days = floor((now - due_at) / 86400 seconds)\nelse:\n    outstanding_days = 0\nif status in {SATISFIED, WAIVED}:\n    withholding_cents = 0\nelse:\n    withholding_cents\
      \ = min(outstanding_days * penalty_per_day_cents, WITHHOLDING_CAP_CENTS)\n"
    input_set: the single TransitionObligation; outstanding_days counts whole 24 hour periods elapsed after due_at
    constants:
      WITHHOLDING_CAP_CENTS: 4000000
    precision: whole days, floored; integer cents
    variants:
    - name: calendar_day_count
      when: an implementation counts calendar date boundaries instead of elapsed 24 hour periods
      difference: an obligation due at 2026-06-01T18:00:00Z evaluated at 2026-06-02T06:00:00Z yields outstanding_days 0 under elapsed-period counting and 1 under calendar-date counting, changing withholding_cents
        from 0 to 25000
  - name: contract_settlement_net
    trigger: POST /water-om/contracts/{id}/complete-hand-back and GET /water-om/contracts/{id}/settlement
    algorithm: aggregation
    formula: 'prorated_fee_cents   = round_half_up(Contract.annual_fee_cents * (operating_days / 365), 0)

      withholding_total    = sum(TransitionObligation.withholding_cents for obligations of this contract)

      penalty_total        = sum(PenaltyAllocation.operator_share_cents for allocations of this contract with status != VOIDED)

      net_payable_cents    = prorated_fee_cents - withholding_total - penalty_total

      '
    input_set: all TransitionObligation rows of the contract regardless of status (SATISFIED and WAIVED rows carry withholding_cents 0); all PenaltyAllocation rows of the contract excluding status VOIDED
    constants: {}
    precision: integer cents, round_half_up
    variants:
    - name: gross_settlement
      when: an implementation omits the withholding deduction
      difference: the gross variant returns prorated_fee_cents - penalty_total, which is larger by exactly withholding_total
validations:
  - priority: 1
    category: auth
    check: X-User-Role and X-User-ID headers are present and non-empty on every request
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: X-User-Role is one of the roles declared in the RBAC matrix
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: the value of X-User-ID exists as an instance of the entity named by the role's identity when identity is entity_backed
    error_id: ERR_ACTOR_NOT_FOUND
    http_status: 401
    applies_to: all
  - priority: 4
    category: auth
    check: the role is permitted for this operation per the RBAC matrix; MunicipalityAdmin- and OperatorAdmin-exclusive operations reject other roles
    error_id: ERR_ROLE_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 5
    category: auth
    check: 'an OperatorAdmin does not perform the municipality''s verification step on a record it produced: a WorkOrder moved to COMPLETED by an OperatorAdmin may not then be VERIFIED by that same X-User-ID,
      and an AssetConditionAssessment accepted under this rule must not have been submitted by the accepting X-User-ID'
    error_id: ERR_CROSS_TENANT_DENIED
    http_status: 403
    applies_to: POST /water-om/work-orders/{id}/verify, POST /water-om/asset-assessments/{id}/accept
  - priority: 6
    category: auth
    check: X-User-ID equals the Employee.id for Employee-role self-service operations
    error_id: ERR_SELF_SERVICE_OWNER_MISMATCH
    http_status: 403
    applies_to: POST /water-om/employees/{id}/accept, POST /water-om/employees/{id}/decline
  - priority: 7
    category: existence
    check: the Municipality referenced by the path exists
    error_id: ERR_MUNICIPALITY_NOT_FOUND
    http_status: 404
    applies_to: all endpoints whose path contains a municipality id or a municipality-scoped child
  - priority: 8
    category: existence
    check: the Contract referenced by the path or payload exists
    error_id: ERR_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: all contract-scoped endpoints
  - priority: 9
    category: existence
    check: the Permit referenced by the path exists
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: all permit-scoped endpoints
  - priority: 10
    category: existence
    check: the PerformanceStandard referenced by the path exists
    error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    applies_to: all performance-standard-scoped endpoints
  - priority: 11
    category: existence
    check: the PerformanceMeasurement referenced by the path exists
    error_id: ERR_MEASUREMENT_NOT_FOUND
    http_status: 404
    applies_to: all performance-measurement-scoped endpoints
  - priority: 12
    category: existence
    check: the Asset referenced by the path or payload exists
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: all asset-scoped endpoints and WorkOrder / PMSchedule / AssetConditionAssessment creation
  - priority: 13
    category: existence
    check: the AssetConditionAssessment referenced by the path exists
    error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    applies_to: all asset-condition-assessment-scoped endpoints
  - priority: 14
    category: existence
    check: the Employee referenced by the path exists
    error_id: ERR_EMPLOYEE_NOT_FOUND
    http_status: 404
    applies_to: all employee-scoped endpoints
  - priority: 15
    category: existence
    check: the StaffingCommitment referenced by the path exists
    error_id: ERR_STAFFING_NOT_FOUND
    http_status: 404
    applies_to: all staffing-commitment-scoped endpoints
  - priority: 16
    category: existence
    check: the WorkOrder referenced by the path exists
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: all work-order-scoped endpoints
  - priority: 17
    category: existence
    check: the PMSchedule referenced by the path exists
    error_id: ERR_PM_SCHEDULE_NOT_FOUND
    http_status: 404
    applies_to: all pm-schedule-scoped endpoints
  - priority: 18
    category: existence
    check: the EmergencyEvent referenced by the path exists
    error_id: ERR_EMERGENCY_NOT_FOUND
    http_status: 404
    applies_to: all emergency-event-scoped endpoints
  - priority: 19
    category: existence
    check: the PenaltyAllocation referenced by the path exists
    error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    applies_to: all penalty-allocation-scoped endpoints
  - priority: 20
    category: existence
    check: the RenewalProposal referenced by the path exists
    error_id: ERR_PROPOSAL_NOT_FOUND
    http_status: 404
    applies_to: all renewal-proposal-scoped endpoints
  - priority: 21
    category: existence
    check: the TransitionObligation referenced by the path exists
    error_id: ERR_OBLIGATION_NOT_FOUND
    http_status: 404
    applies_to: all transition-obligation-scoped endpoints
  - priority: 22
    category: state
    check: Contract.status equals the from-state required by this transition
    error_id: ERR_CONTRACT_INVALID_STATE
    http_status: 409
    applies_to: all contract state transitions
  - priority: 23
    category: state
    check: Asset.status equals the from-state required by this transition
    error_id: ERR_ASSET_INVALID_STATE
    http_status: 409
    applies_to: all asset state transitions
  - priority: 24
    category: state
    check: WorkOrder.status equals the from-state required by this transition
    error_id: ERR_WORK_ORDER_INVALID_STATE
    http_status: 409
    applies_to: all work-order state transitions
  - priority: 25
    category: state
    check: PMSchedule.status equals the from-state required by this transition
    error_id: ERR_PM_SCHEDULE_INVALID_STATE
    http_status: 409
    applies_to: all pm-schedule state transitions
  - priority: 26
    category: state
    check: EmergencyEvent.status equals the from-state required by this transition
    error_id: ERR_EMERGENCY_INVALID_STATE
    http_status: 409
    applies_to: all emergency-event state transitions
  - priority: 27
    category: state
    check: the target resource is not already in a terminal state for the operation requested
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: all endpoints acting on CLOSED, CANCELLED, RETIRED, SEPARATED, ACCEPTED, SETTLED, VOIDED rows
  - priority: 28
    category: state
    check: Contract.baseline_frozen is false when a baseline assessment is amended or disputed
    error_id: ERR_BASELINE_FROZEN
    http_status: 409
    applies_to: POST /water-om/asset-assessments/{id}/dispute, POST /water-om/asset-assessments/{id}/revise
  - priority: 29
    category: state
    check: no PerformanceStandard under the contract has status BREACHED when a contract returns to OPERATING
    error_id: ERR_OPEN_BREACH_BLOCKS
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/reviews (UNDER_REVIEW -> OPERATING)
  - priority: 30
    category: state
    check: no WorkOrder under the asset has status IN {SCHEDULED, IN_PROGRESS, PAUSED, AWAITING_PARTS} when the asset is taken out of service
    error_id: ERR_OPEN_WORK_ORDER_BLOCKS
    http_status: 409
    applies_to: POST /water-om/assets/{id}/take-out-of-service
  - priority: 31
    category: state
    check: the TransitionObligation is not critical when a waiver is requested
    error_id: ERR_CRITICAL_OBLIGATION_NOT_WAIVABLE
    http_status: 403
    applies_to: POST /water-om/transition-obligations/{id}/waive
  - category: state
    check: PenaltyAllocation.status is CONTESTED or ADJUSTED when an adjustment is requested
    error_id: ERR_ALLOCATION_INVALID_STATE
    http_status: 409
    applies_to: POST /water-om/penalty-allocations/{id}/adjust
    priority: 32
  - priority: 33
    category: business_safety
    check: a critical emergency notification (severity CRITICAL or event_type CONTAMINATION) requires at least two OperatorsAdmin acknowledgements before it can be closed
    error_id: ERR_CRITICAL_ACKNOWLEDGEMENT_MISSING
    http_status: 422
    applies_to: POST /water-om/emergency-events/{id}/close
  - priority: 34
    category: business_safety
    check: the operator may not reduce staffing below Contract.staffing_floor_fte while an EmergencyEvent under the contract is open
    error_id: ERR_EMERGENCY_STAFFING_FLOOR
    http_status: 409
    applies_to: POST /water-om/employees/{id}/separate, POST /water-om/staffing-commitments/{id}/suspend
  - priority: 35
    category: business_safety
    check: a sanitary overflow event requires a containment record before any restoration is attempted
    error_id: ERR_OVERFLOW_CONTAINMENT_REQUIRED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/restore
  - priority: 36
    category: business_safety
    check: the discharge monitoring report interval may not be shortened below the permit's reporting frequency
    error_id: ERR_REPORTING_FREQUENCY_VIOLATION
    http_status: 422
    applies_to: POST /water-om/performance-standards/{id}/measurements
  - category: business_safety
    check: a CONTAMINATION event or a severity CRITICAL event has a recorded containment instant before any regulator notification is filed
    error_id: ERR_CONTAMINATION_CONTAINMENT_REQUIRED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/notify
    priority: 37
  - priority: 38
    category: business_temporal
    check: 'the supplied instants satisfy their ordering: Contract.contract_end_date after contract_start_date, PerformanceMeasurement.period_end after period_start, Permit.expiration_date after effective_date'
    error_id: ERR_INVALID_DATE_WINDOW
    http_status: 400
    applies_to: POST /water-om/municipalities/{id}/contracts, POST /water-om/performance-standards/{id}/measurements, POST /water-om/contracts/{id}/permits
  - priority: 39
    category: business_temporal
    check: the emergency notification is filed strictly before notify_deadline_at
    error_id: ERR_NOTIFICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/notify
  - priority: 40
    category: business_temporal
    check: the containment instant is at or after occurred_at and within the critical containment window for severity CRITICAL
    error_id: ERR_CONTAINMENT_WINDOW_EXCEEDED
    http_status: 409
    applies_to: POST /water-om/emergency-events/{id}/contain
  - priority: 41
    category: business_temporal
    check: 'the PM grace window is still open: now <= PMSchedule.next_due_at + 7 days when a completed occurrence is regenerated'
    error_id: ERR_PM_WINDOW_EXPIRED
    http_status: 409
    applies_to: POST /water-om/pm-schedules/{id}/regenerate
  - priority: 42
    category: business_temporal
    check: the work order reaches CLOSED at least 5 days after submitted_to_municipality_at
    error_id: ERR_REPORTAGE_PERIOD_OPEN
    http_status: 409
    applies_to: POST /water-om/work-orders/{id}/close
  - priority: 43
    category: business_temporal
    check: PMSchedule.duration_hours plus the existing occupation on the same Asset does not extend beyond now + 30 days
    error_id: ERR_PM_WINDOW_TOO_FAR
    http_status: 409
    applies_to: POST /water-om/assets/{id}/pm-schedules
  - priority: 44
    category: business_temporal
    check: the transition-back obligation due_at is not earlier than the hand-back start instant
    error_id: ERR_OBLIGATION_DUE_BEFORE_HANDOFF
    http_status: 400
    applies_to: POST /water-om/contracts/{id}/transition-obligations
  - priority: 45
    category: business_temporal
    check: the ingested work order is not back-dated more than 7 days before now
    error_id: ERR_BACKDATED_RECORD_REJECTED
    http_status: 400
    applies_to: POST /water-om/contracts/{id}/work-orders
  - priority: 46
    category: business_temporal
    check: the PerformanceMeasurement period does not overlap an existing measurement period on the same standard
    error_id: ERR_MEASUREMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: POST /water-om/performance-standards/{id}/measurements
  - priority: 47
    category: business_temporal
    check: the preventive maintenance occupation on the asset does not overlap an existing PMSchedule or an open PREVENTIVE WorkOrder occupation on the same asset
    error_id: ERR_PM_OCCUPATION_OVERLAP
    http_status: 409
    applies_to: POST /water-om/assets/{id}/pm-schedules, POST /water-om/pm-schedules/{id}/regenerate
  - priority: 48
    category: business_constraint
    check: PerformanceStandard.code is unique within its contract
    error_id: ERR_DUPLICATE_STANDARD_CODE
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/performance-standards
  - priority: 49
    category: business_constraint
    check: Asset.asset_tag is unique within its contract
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/assets
  - priority: 50
    category: business_constraint
    check: at most one AssetConditionAssessment under an asset may finalize as the frozen baseline
    error_id: ERR_BASELINE_ALREADY_FROZEN
    http_status: 409
    applies_to: POST /water-om/asset-assessments/{id}/accept
  - priority: 51
    category: business_constraint
    check: at most one RenewalProposal per (contract, round_number) may be SUBMITTED
    error_id: ERR_DUPLICATE_ROUND_PROPOSAL
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/renewal-proposals, POST /water-om/renewal-proposals/{id}/counter
  - priority: 52
    category: business_constraint
    check: Permit.permit_type is unique among non-EXPIRED permits on the same contract
    error_id: ERR_DUPLICATE_ACTIVE_PERMIT_TYPE
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/permits
  - priority: 53
    category: business_constraint
    check: 'the PerformanceStandard.threshold_direction and threshold_value are consistent with metric_type: ATTIME metrics require AT_LEAST, failures-per-period metrics require AT_MOST'
    error_id: ERR_THRESHOLD_DIRECTION_INVALID
    http_status: 400
    applies_to: POST /water-om/contracts/{id}/performance-standards
  - priority: 54
    category: business_constraint
    check: RenewalProposal.round_number equals Contract.renewal_round + 1
    error_id: ERR_RENEWAL_ROUND_MISMATCH
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/renewal-proposals, POST /water-om/renewal-proposals/{id}/counter
  - priority: 55
    category: business_constraint
    check: the work order post-closure cannot be amended; CLOSED work orders are immutable
    error_id: ERR_CLOSED_WORK_ORDER_IMMUTABLE
    http_status: 409
    applies_to: all work-order-scoped mutation endpoints
  - category: business_constraint
    check: a work order reaching closure does not carry expense_class PENDING_CLASSIFICATION
    error_id: ERR_EXPENSE_CLASS_UNRESOLVED
    http_status: 409
    applies_to: POST /water-om/work-orders/{id}/close
    priority: 56
  - priority: 57
    category: business_fiscal
    check: the resolved RenewalProposal.benchmark_ratio is at most 1.25
    error_id: ERR_BENCHMARK_RATIO_EXCEEDED
    http_status: 422
    applies_to: POST /water-om/contracts/{id}/renewal-proposals
  - priority: 58
    category: business_fiscal
    check: the contract's PerformanceStandard.BREACHED count is zero before a renewal proposal is submitted
    error_id: ERR_BREACH_UNRESOLVED_AT_RENEWAL
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/renewal-proposals
  - priority: 59
    category: business_fiscal
    check: the computed operator share plus the municipality share equals the regulator's total_penalty_cents exactly after allocation
    error_id: ERR_PENALTY_ALLOCATION_NOT_CONSERVED
    http_status: 422
    applies_to: POST /water-om/penalty-allocations, POST /water-om/penalty-allocations/{id}/adjust
  - priority: 60
    category: business_fiscal
    check: the settlement net payable is not negative once proration, withholding and penalties are applied
    error_id: ERR_NEGATIVE_SETTLEMENT
    http_status: 422
    applies_to: POST /water-om/contracts/{id}/complete-hand-back
  - priority: 61
    category: business_fiscal
    check: the aggregate breach penalty across all BREACHED standards under a contract does not exceed the annual fee
    error_id: ERR_PENALTY_CAP_EXCEEDED
    http_status: 409
    applies_to: POST /water-om/performance-standards/{id}/measurements, the UNDER_REVIEW review cascade
  - priority: 62
    category: business_fiscal
    check: the asset has been in service for at least 60 percent of its useful life before a capital-expense classification may be approved
    error_id: ERR_CAPITAL_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: POST /water-om/work-orders/{id}/start
  - priority: 63
    category: business_referential
    check: exactly one AssetConditionAssessment under the asset is the frozen baseline before the asset may enter service
    error_id: ERR_ASSET_BASELINE_UNRESOLVED
    http_status: 409
    applies_to: system cascade from POST /water-om/contracts/{id}/mobilize, POST /water-om/assets/{id}/return-to-service
  - priority: 64
    category: business_referential
    check: every critical TransitionObligation under the contract is SATISFIED or WAIVED before the hand-back completes
    error_id: ERR_CRITICAL_OBLIGATIONS_OUTSTANDING
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/complete-hand-back
  - priority: 65
    category: business_referential
    check: a permit with a NOTICE_OF_VIOLATION and a pending regulatory action blocks the transition-back completion
    error_id: ERR_PERMIT_ACTION_UNRESOLVED
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/complete-hand-back, POST /water-om/contracts/{id}/terminate
  - priority: 66
    category: business_referential
    check: a work order cannot be opened on an asset owned by a different contract than the path's contract
    error_id: ERR_ASSET_CONTRACT_MISMATCH
    http_status: 409
    applies_to: POST /water-om/contracts/{id}/work-orders, POST /water-om/contracts/{id}/emergency-events
endpoints:
  - method: POST
    path: /water-om/municipalities
    description: register a municipal utility owner
    roles:
    - PlatformAdmin
    code: 201
    input:
    - name
    - state_code
    - population_served
    - owns_treatment_works
    output: Municipality
    side_effects: []
  - method: GET
    path: /water-om/municipalities/{id}
    description: read a municipality
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input: []
    output: Municipality
    side_effects: []
  - method: GET
    path: /water-om/municipalities/{id}/contracts
    description: list the contracts awarded by this municipality
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - limit?
    - offset?
    output: Contract[]
    side_effects: []
  - method: POST
    path: /water-om/municipalities/{id}/contracts
    description: award an operations and maintenance contract to the operator
    roles:
    - MunicipalityAdmin
    code: 201
    input:
    - title
    - award_date
    - contract_start_date
    - contract_end_date
    - annual_fee_cents
    - operator_penalty_share_pct
    - benchmark_index_baseline
    output: Contract
    side_effects:
    - Contract.status initialized to AWARDED
    - Contract.staffing_floor_fte computed by the staffing_floor calculation (0.00 while no standard is ACTIVE)
  - method: GET
    path: /water-om/municipalities/{id}/benchmark
    description: read the municipality's public-operation benchmark index and the chronological comparator basis
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    code: 200
    input: []
    output: BenchmarkSummary
    side_effects: []
  - method: GET
    path: /water-om/contracts/{id}
    description: read a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/mobilize
    description: begin mobilization; binds staffing commitments and demotes a class when the floor is not funded
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Contract
    side_effects:
    - each StaffingCommitment under the contract in status DRAFT transitions to BINDING
    - Contract.staffing_floor_fte recomputed by the staffing_floor calculation
    - the lowest-committed_fte StaffingCommitment transitions BINDING -> SHORTFALL when the committed total is below the floor
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/commence-operating
    description: commence the operating period once the baseline is frozen and staffing is at the floor
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Contract
    side_effects:
    - requires Contract.baseline_frozen == true, set by POST /water-om/contracts/{id}/freeze-baseline
    - each Asset in status IN {BASELINE_ASSESSED, BASELINE_DISPUTED} transitions to IN_SERVICE
    - each PMSchedule under the contract in status DRAFT transitions to ACTIVE
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/freeze-baseline
    description: freeze the contract-start asset condition baseline once every asset carries an accepted baseline assessment
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: Contract
    side_effects:
    - Contract.baseline_frozen set to true
    - Contract.baseline_asset_count set to the count of AssetConditionAssessment rows under the contract with is_baseline == true and status ACCEPTED
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/reviews
    description: open or close a contract review; the direction is taken from the contract's current state
    roles:
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - expected_contract_version
    - review_outcome
    output: Contract
    side_effects:
    - OPERATING -> UNDER_REVIEW promotes breaching standards and recomputes Contract.total_operator_penalty_cents
    - UNDER_REVIEW -> OPERATING when no BREACHED standard remains, otherwise 409
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/renewals
    description: place the contract in renewal negotiation, or return it from hand-back to renewal
    roles:
    - OperatorAdmin
    - MunicipalityAdmin
    code: 200
    input: []
    output: Contract
    side_effects:
    - from UNDER_REVIEW sets RENEWAL_PENDING; from HANDING_BACK waives remaining non-critical obligations first
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/hand-back
    description: begin the transition-back path and generate the hand-back obligations
    roles:
    - MunicipalityAdmin
    code: 200
    input:
    - expected_contract_version
    output: Contract
    side_effects:
    - one TransitionObligation of obligation_type ASSET_HANDOVER is created per Asset under the contract in status PENDING
    - one TransitionObligation of obligation_type EMPLOYEE_REINSTATE is created per Employee in status IN {TRANSFERRED, INDUCTION, ACTIVE}
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/complete-hand-back
    description: finalize the transition back to municipal operation
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: Contract
    side_effects:
    - each Asset in status IN_SERVICE transitions to OUT_OF_SERVICE
    - each Permit in status ACTIVE transitions to EXPIRED
    - each PMSchedule in status IN {ACTIVE, DUE, OVERDUE} transitions to RETIRED
    - Contract.status set to TRANSITIONED
    - increments Contract.version by 1
  - method: POST
    path: /water-om/contracts/{id}/terminate
    description: terminate the contract for cause
    roles:
    - MunicipalityAdmin
    code: 200
    input:
    - termination_reason
    output: Contract
    side_effects:
    - each Employee in status IN {TRANSFERRED, INDUCTION, ACTIVE, OFFERED, ACCEPTED} transitions to SEPARATED
    - each Permit in status ACTIVE transitions to SUSPENDED
    - Contract.status set to TERMINATED
    - increments Contract.version by 1
  - method: GET
    path: /water-om/contracts/{id}/settlement
    description: compute the net settlement payable at hand-back
    roles:
    - MunicipalityAdmin
    - PlatformAdmin
    code: 200
    input: []
    output: ContractSettlement
    side_effects: []
  - method: GET
    path: /water-om/contracts/{id}/performance-standards
    description: list the performance standards under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - limit?
    - offset?
    output: PerformanceStandard[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/performance-standards
    description: define a performance standard and its breach penalty
    roles:
    - OperatorAdmin
    code: 201
    input:
    - code
    - title
    - metric_type
    - criticality_weight
    - threshold_value
    - threshold_direction
    - breach_penalty_cents
    output: PerformanceStandard
    side_effects:
    - PerformanceStandard.status initialized to DRAFT
  - method: GET
    path: /water-om/contracts/{id}/staffing-commitments
    description: list the staffing commitments under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - limit?
    - offset?
    output: StaffingCommitment[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/staffing-commitments
    description: record a committed staffing level for a position class
    roles:
    - OperatorAdmin
    code: 201
    input:
    - role_code
    - committed_fte
    output: StaffingCommitment
    side_effects:
    - StaffingCommitment.status initialized to DRAFT
  - method: GET
    path: /water-om/contracts/{id}/employees
    description: list the employees scoped to a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - role_code?
    - limit?
    - offset?
    output: Employee[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/employees
    description: register a municipal employee eligible for transfer
    roles:
    - OperatorAdmin
    code: 201
    input:
    - role_code
    - full_name
    - municipal_hire_date
    - transfer_offer_fte
    output: Employee
    side_effects:
    - Employee.status initialized to MUNICIPAL
    - Employee.municipal_years_of_service computed from municipal_hire_date to Contract.contract_start_date
  - method: POST
    path: /water-om/contracts/{id}/employees/{eid}/offer
    description: extend a transfer offer and compute the benefit tier and pension offset
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.benefit_tier computed by the vesting_benefit calculation
    - Employee.pension_offset_cents computed by the vesting_benefit calculation
    - Employee.status set to OFFERED
  - method: GET
    path: /water-om/contracts/{id}/assets
    description: list the assets operated under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - asset_class?
    - limit?
    - offset?
    output: Asset[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/assets
    description: register an asset under the contract
    roles:
    - MunicipalityAdmin
    code: 201
    input:
    - asset_tag
    - asset_class
    - install_year
    - useful_life_years
    - criticality_rank
    output: Asset
    side_effects:
    - Asset.status initialized to REGISTERED
    - Asset.condition_score initialized to 100.0 and condition_band to EXCELLENT
  - method: GET
    path: /water-om/contracts/{id}/permits
    description: list the regulatory permits held under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - permit_type?
    - limit?
    - offset?
    output: Permit[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/permits
    description: open a permit application under the contract
    roles:
    - OperatorAdmin
    code: 201
    input:
    - permit_number
    - permit_type
    - regulator
    - effective_date
    - expiration_date
    output: Permit
    side_effects:
    - Permit.status initialized to APPLICATION_DRAFTED
  - method: GET
    path: /water-om/contracts/{id}/emergency-events
    description: list the emergency events recorded under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - event_type?
    - severity?
    - limit?
    - offset?
    output: EmergencyEvent[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/emergency-events
    description: report a main break, overflow, treatment upset or similar emergency
    roles:
    - OperatorAdmin
    code: 201
    input:
    - asset_id
    - event_type
    - severity
    - occurred_at
    output: EmergencyEvent
    side_effects:
    - EmergencyEvent.status initialized to REPORTED
    - EmergencyEvent.notify_deadline_at computed by the notification_deadline calculation
  - method: GET
    path: /water-om/contracts/{id}/work-orders
    description: list the work orders under a contract, optionally filtered by asset
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - asset_id?
    - status?
    - work_type?
    - limit?
    - offset?
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/work-orders
    description: ingest a work order against an asset of this contract
    roles:
    - OperatorAdmin
    code: 201
    input:
    - asset_id
    - work_type
    - estimated_cost_cents
    - reported_at
    output: WorkOrder
    side_effects:
    - WorkOrder.status initialized to DRAFT
    - WorkOrder.expense_class recomputed by the expense_class_boundary calculation
  - method: GET
    path: /water-om/contracts/{id}/renewal-proposals
    description: list the renewal proposals submitted for a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - round_number?
    - limit?
    - offset?
    output: RenewalProposal[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/renewal-proposals
    description: submit a renewal round proposal
    roles:
    - OperatorAdmin
    code: 201
    input:
    - round_number
    - proposed_fee_cents
    - proposed_term_years
    - submitted_by
    output: RenewalProposal
    side_effects:
    - RenewalProposal.status initialized to SUBMITTED
    - RenewalProposal.benchmark_ratio computed by the benchmark_comparison calculation
    - increments Contract.version by 1
  - method: GET
    path: /water-om/contracts/{id}/transition-obligations
    description: list the transition-back obligations for a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - obligation_type?
    - is_critical?
    - limit?
    - offset?
    output: TransitionObligation[]
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/transition-obligations
    description: record a hand-back obligation the municipality requires before transition
    roles:
    - MunicipalityAdmin
    code: 201
    input:
    - obligation_type
    - due_at
    - is_critical
    - penalty_per_day_cents
    output: TransitionObligation
    side_effects:
    - TransitionObligation.status initialized to PENDING when the contract is in HANDING_BACK, otherwise DRAFT
    - TransitionObligation.outstanding_days computed by the transition_back_credit calculation
  - method: GET
    path: /water-om/contracts/{id}/penalty-allocations
    description: list the penalty allocations recorded under a contract
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - limit?
    - offset?
    output: PenaltyAllocation[]
    side_effects: []
  - method: GET
    path: /water-om/performance-standards/{id}
    description: read a performance standard
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input: []
    output: PerformanceStandard
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/performance-standards/{sid}/activate
    description: activate a performance standard and refresh the contract staffing floor
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: PerformanceStandard
    side_effects:
    - PerformanceStandard.status set to ACTIVE
    - Contract.staffing_floor_fte recomputed by the staffing_floor calculation of the owning Contract
    - increments Contract.version by 1
  - method: POST
    path: /water-om/performance-standards/{id}/suspend
    description: suspend a breached standard while its dispute is resolved
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: PerformanceStandard
    side_effects:
    - PerformanceStandard.status set to SUSPENDED
    - each PerformanceMeasurement under this standard in status IN {RECORDED, ASSESSED} transitions to WAIVED
  - method: POST
    path: /water-om/performance-standards/{id}/clear-breach
    description: clear a breach after the 30 day holding period
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: PerformanceStandard
    side_effects:
    - PerformanceStandard.status set to ACTIVE and breach_reason_code reset
    - Contract.total_operator_penalty_cents reduced by the cleared breach's allocated operator share
    - increments Contract.version by 1
  - method: POST
    path: /water-om/performance-standards/{id}/reactivate
    description: reactivate a suspended standard
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: PerformanceStandard
    side_effects:
    - PerformanceStandard.status set to ACTIVE
    - Contract.staffing_floor_fte recomputed
  - method: POST
    path: /water-om/performance-standards/{id}/retire
    description: retire a standard that will not apply to the next term
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: PerformanceStandard
    side_effects:
    - PerformanceStandard.status set to RETIRED
    - Contract.staffing_floor_fte recomputed
  - method: GET
    path: /water-om/performance-standards/{id}/measurements
    description: list the measurements recorded against a standard
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - limit?
    - offset?
    output: PerformanceMeasurement[]
    side_effects: []
  - method: POST
    path: /water-om/performance-standards/{id}/measurements
    description: record a measurement period for a standard
    roles:
    - OperatorAdmin
    code: 201
    input:
    - period_start
    - period_end
    - measured_value
    output: PerformanceMeasurement
    side_effects:
    - PerformanceMeasurement.in_breach computed from the standard's threshold_value and threshold_direction
    - PerformanceMeasurement.status initialized to RECORDED
  - method: GET
    path: /water-om/performance-measurements/{id}
    description: read a measurement
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input: []
    output: PerformanceMeasurement
    side_effects: []
  - method: POST
    path: /water-om/performance-measurements/{id}/assess
    description: assess a measurement and cascade a breach to its standard
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: PerformanceMeasurement
    side_effects:
    - PerformanceMeasurement.weighted_breach_score computed by the breach_score calculation
    - PerformanceMeasurement.status set to ASSESSED
    - the owning PerformanceStandard transitions ACTIVE -> BREACHED when weighted_breach_score >= 0.60
  - method: POST
    path: /water-om/performance-measurements/{id}/dispute
    description: dispute a measurement as the municipality
    roles:
    - MunicipalityAdmin
    code: 200
    input:
    - disputed_measured_value
    output: PerformanceMeasurement
    side_effects:
    - PerformanceMeasurement.status set to DISPUTED
  - method: POST
    path: /water-om/performance-measurements/{id}/revise
    description: revise a disputed measurement as the operator
    roles:
    - OperatorAdmin
    code: 200
    input:
    - measured_value
    output: PerformanceMeasurement
    side_effects:
    - PerformanceMeasurement.weighted_breach_score recomputed by the breach_score calculation
    - PerformanceMeasurement.status set to ASSESSED
  - method: POST
    path: /water-om/performance-measurements/{id}/confirm
    description: confirm a measurement as final
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: PerformanceMeasurement
    side_effects:
    - PerformanceMeasurement.status set to CONFIRMED
  - method: POST
    path: /water-om/performance-measurements/{id}/waive
    description: waive a breaching measurement when a regulatory action supersedes it
    roles:
    - MunicipalityAdmin
    code: 200
    input:
    - waiver_basis
    output: PerformanceMeasurement
    side_effects:
    - PerformanceMeasurement.status set to WAIVED and in_breach reset to false
    - the owning PerformanceStandard recomputes breach_reason_code from its remaining breaching measurements
  - method: GET
    path: /water-om/staffing-commitments/{id}
    description: read a staffing commitment
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input: []
    output: StaffingCommitment
    side_effects: []
  - method: POST
    path: /water-om/contracts/{id}/staffing-commitments/{cid}/bind
    description: bind a staffing commitment during mobilization
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: StaffingCommitment
    side_effects:
    - StaffingCommitment.status set to BINDING
    - StaffingCommitment.vacancy_fte recomputed
  - method: POST
    path: /water-om/staffing-commitments/{id}/evaluate
    description: evaluate the filled versus committed staffing level
    roles:
    - OperatorAdmin
    code: 200
    input:
    - filled_fte
    output: StaffingCommitment
    side_effects:
    - StaffingCommitment.filled_fte and vacancy_fte recomputed
    - status moves BINDING -> SHORTFALL, REMEDIATING -> SATISFIED, or REMEDIATING -> SHORTFALL
  - method: POST
    path: /water-om/staffing-commitments/{id}/remedy
    description: open a remedy plan for a shortfall
    roles:
    - OperatorAdmin
    code: 200
    input:
    - remedy_plan
    output: StaffingCommitment
    side_effects:
    - StaffingCommitment.status set to REMEDIATING
  - method: POST
    path: /water-om/staffing-commitments/{id}/suspend
    description: suspend a staffing commitment as the contract winds down
    roles:
    - MunicipalityAdmin
    code: 200
    input: []
    output: StaffingCommitment
    side_effects:
    - StaffingCommitment.status set to SUSPENDED and filled_fte reset to 0
  - method: GET
    path: /water-om/employees
    description: list employees across contracts, filterable by role code and status
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - role_code?
    - status?
    - limit?
    - offset?
    output: Employee[]
    side_effects: []
  - method: GET
    path: /water-om/employees/{id}
    description: read an employee
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    - Employee
    code: 200
    input: []
    output: Employee
    side_effects: []
  - method: POST
    path: /water-om/employees/{id}/accept
    description: the employee accepts the transfer offer
    roles:
    - Employee
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.status set to ACCEPTED
  - method: POST
    path: /water-om/employees/{id}/decline
    description: the employee declines the transfer offer
    roles:
    - Employee
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.status set to DECLINED
    - the matching StaffingCommitment.filled_fte recomputed and demoted to SHORTFALL when it falls below committed_fte
  - method: POST
    path: /water-om/employees/{id}/transfer
    description: transfer an accepted employee onto the operator's payroll
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.status set to TRANSFERRED
    - the matching StaffingCommitment.filled_fte increased by the employee's transfer_offer_fte
    - the matching StaffingCommitment may transition SHORTFALL -> SATISFIED
  - method: POST
    path: /water-om/employees/{id}/begin-induction
    description: start the operator's induction programme
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.status set to INDUCTION
  - method: POST
    path: /water-om/employees/{id}/complete-induction
    description: complete induction and place the employee into active service
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.status set to ACTIVE
    - the matching StaffingCommitment.filled_fte recomputed
  - method: POST
    path: /water-om/employees/{id}/withdraw-offer
    description: withdraw a transfer offer before the operating period starts
    roles:
    - OperatorAdmin
    code: 200
    input: []
    output: Employee
    side_effects:
    - Employee.status reset to MUNICIPAL, benefit_tier reset to NONE, pension_offset_cents reset to 0
  - method: POST
    path: /water-om/employees/{id}/separate
    description: separate an active employee from the contract
    roles:
    - OperatorAdmin
    code: 200
    input:
    - separation_reason
    output: Employee
    side_effects:
    - Employee.status set to SEPARATED
    - the matching StaffingCommitment.filled_fte recomputed and demoted to SHORTFALL when it falls below committed_fte
  - method: GET
    path: /water-om/assets
    description: list assets across contracts, filterable by class and condition band
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - asset_class?
    - status?
    - condition_band?
    - limit?
    - offset?
    output: Asset[]
    side_effects: []
  - method: GET
    path: /water-om/assets/{id}
    description: read an asset
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: /water-om/assets/{id}/baseline-assessments
    description: list the condition assessments recorded for an asset
    roles:
    - PlatformAdmin
    - MunicipalityAdmin
    - OperatorAdmin
    code: 200
    input:
    - status?
    - limit?
    - offset?
    output: AssetConditionAssessment[]
    side_effects: []
  - method: POST
    path: /water-om/assets/{id}/baseline-assessments
    description: record a condition assessment, including the contract-start baseline
    roles:
    - OperatorAdmin
    - MunicipalityAdmin
    code: 201
    input:
    - assessed_at
    - assessed_score
    - is_baseline
    - assessor_party
    output: AssetConditionAssessment
    side_effects:
    - AssetConditionAssessment.status set to SUBMITTED
