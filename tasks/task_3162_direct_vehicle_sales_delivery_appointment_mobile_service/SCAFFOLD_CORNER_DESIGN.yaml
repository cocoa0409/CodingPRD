            - *c_verify
            - *c_buyer2
            - call: "POST /v1/buyers/${byr2_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - *c_order
            - call: "POST /v1/orders"
              payload: { buyer_id: "${byr2_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { ord_partial_id: $.data.id, ord_partial_v: $.data.version }
            - *c_place
