scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bill_credit_provisional_vs_final
        grounds:
          - calculations.bill_credit_calculation
          - entities.Bill.fields.provisional_credit_cents
          - entities.Bill.fields.issued_credit_cents
        distinguishing_aspect: |
          Bill-domain dual variant: the SAME bill yields provisional_credit_cents == 4600 (estimated usage
          800 kWh, no proration, no charges cap) and issued_credit_cents == 6000 (actual usage 1500 kWh
          capped by deemed 1000 kWh) — two valid algorithms over identical subscription data diverge by 1400 cents.
        test_recipe:
          setup:
            - "VOLUNTARY program OPEN with tiers 500@5 / 2000@7 / unbounded@9, kwh_per_kw_monthly default 100"
            - "Subscription ACTIVE: allocation_kw 10 (deemed 1000 kWh), estimated_usage_kwh 800, activated 2026-07-01"
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}, {up_to_kwh: 2000, rate_cents_per_kwh: 7}, {up_to_kwh: null, rate_cents_per_kwh: 9}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "PROGRAM", owner_name: "SunTariff Holding", program_id: "${p}" }
              as: RegistryAdmin
              captures: { pacc: $.data.id }
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", holding_account_id: "${pacc}" }
              as: RegistryAdmin
              captures: { pv2: $.data.version }
            - call: "POST /greenpower/programs/${p}/open"
              payload: {}
              as: RegistryAdmin
              captures: { pv3: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer One", utility_account_no: "U-1", allocation_kw: 10, estimated_usage_kwh: 800, expected_program_version: "${pv3}" }
              as: ProgramManager
              captures: { s: $.data.id }
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/subscriptions/${s}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/bills"
              payload: { subscription_id: "${s}", period_month: "2026-07", usage_kwh: 1500, charges_cents: 20000 }
              as: ProgramManager
              captures: { b: $.data.id }
          trigger:
            - call: "POST /greenpower/bills/${b}/issue"
              payload: {}
              as: ProgramManager
          assert:
            - "Bill.${b}.provisional_credit_cents == 4600  (min(800, 10*100)=800; 500*5 + 300*7 = 2500+2100)"
            - "Bill.${b}.issued_credit_cents == 6000  (min(1500, 1000)=1000; 500*5 + 500*7 = 6000; full-period proration x31/31; cap min(6000, 20000))"
            - "Bill.${b}.issued_credit_cents - Bill.${b}.provisional_credit_cents == 1400"
            - "Bill.${b}.status == ISSUED"

      - name: trade_settlement_gross_vs_net
        grounds:
          - calculations.trade_settlement
          - entities.Trade.fields.buyer_total_cents
          - entities.Trade.fields.seller_proceeds_cents
        distinguishing_aspect: |
          Trade-domain dual variant (different entity domain than Bill): identical items and price settled
          GROSS (buyer pays fee on top: 90369 / seller 90000) vs NET (fee deducted from seller: 90000 / 89631)
          — same economic inputs, two settlement variants, buyer_total and seller_proceeds both diverge.
        test_recipe:
          setup:
            - "Generator ACTIVE; certificates c120 (120 MWh, vintage 2026-07) and c80 (80 MWh, vintage 2026-08) minted and transferred to broker account b1"
            - "Broker accounts b1 (seller) and b2 (buyer) ACTIVE"
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 120000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", metered_kwh: 80000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r2: $.data.id }
            - call: "POST /greenpower/meter-readings/${r2}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r2}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c120: "$.data[0].id" }
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-08"
              as: RegistryAdmin
              captures: { c80: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker Two" }
              as: RegistryAdmin
              captures: { b2: $.data.id }
            - call: "POST /greenpower/certificates/${c120}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/certificates/${c80}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c120}", quantity_mwh: 120}, {certificate_id: "${c80}", quantity_mwh: 80}], unit_price_cents_per_mwh: 450, settlement_mode: "GROSS" }
              as: BrokerTrader
              as_user_id: "${b1}"
              captures: { tg: $.data.id }
            - call: "POST /greenpower/trades/${tg}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
          trigger:
            - call: "POST /greenpower/trades/${tg}/settle"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
              captures: { tg_line: $.data.total_line_cents, tg_fee: $.data.broker_fee_cents, tg_buyer: $.data.buyer_total_cents, tg_seller: $.data.seller_proceeds_cents }
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b2}", to_account_id: "${b1}", items: [{certificate_id: "${c120}", quantity_mwh: 120}, {certificate_id: "${c80}", quantity_mwh: 80}], unit_price_cents_per_mwh: 450, settlement_mode: "NET" }
              as: BrokerTrader
              as_user_id: "${b2}"
              captures: { tn: $.data.id }
            - call: "POST /greenpower/trades/${tn}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b1}"
            - call: "POST /greenpower/trades/${tn}/settle"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b1}"
          assert:
            - "Trade.${tg}.total_line_cents == 90000  (120*450 + 80*450)"
            - "Trade.${tg}.broker_fee_cents == 369  (round(54000*35/10000)=189 + round(36000*50/10000)=180)"
            - "Trade.${tg}.buyer_total_cents == 90369  (GROSS: lines + fee)"
            - "Trade.${tg}.seller_proceeds_cents == 90000  (GROSS: full lines)"
            - "Trade.${tn}.broker_fee_cents == 369"
            - "Trade.${tn}.buyer_total_cents == 90000  (NET: lines only)"
            - "Trade.${tn}.seller_proceeds_cents == 89631  (NET: lines - fee)"
            - "Trade.${tg}.buyer_total_cents != Trade.${tn}.buyer_total_cents and Trade.${tg}.seller_proceeds_cents != Trade.${tn}.seller_proceeds_cents for identical items and price"

  - rule_id: combinatorial_formula
    instances:
      - name: bill_credit_tier_straddle_with_proration
        grounds:
          - calculations.bill_credit_calculation
          - entities.Bill.fields.proration_active_days
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: tier-branch selection straddling the 500-kWh
          breakpoint, nested min(usage, deemed) and min(prorated, charges), and a calendar-day proration
          multiplier; mid-period activation (2026-07-16, 16 of 31 days) yields round_half_up(6000*16/31) == 3097.
        test_recipe:
          setup:
            - "Same program shape as bill_credit_provisional_vs_final; subscription activated mid-period on 2026-07-16"
            - "Bill for 2026-07 with usage 1500, charges 20000"
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}, {up_to_kwh: 2000, rate_cents_per_kwh: 7}, {up_to_kwh: null, rate_cents_per_kwh: 9}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id, pv: $.data.version }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "PROGRAM", owner_name: "SunTariff Holding", program_id: "${p}" }
              as: RegistryAdmin
              captures: { pacc: $.data.id }
            - call: "PATCH /greenpower/programs/${p}"
              payload: { expected_program_version: "${pv}", holding_account_id: "${pacc}" }
              as: RegistryAdmin
              captures: { pv2: $.data.version }
            - call: "POST /greenpower/programs/${p}/open"
              payload: {}
              as: RegistryAdmin
              captures: { pv3: $.data.version }
            - call: "POST /greenpower/subscriptions"
              payload: { program_id: "${p}", customer_name: "Customer Mid", utility_account_no: "U-9", allocation_kw: 10, estimated_usage_kwh: 800, expected_program_version: "${pv3}" }
              as: ProgramManager
              captures: { s: $.data.id }
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/subscriptions/${s}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/bills"
              payload: { subscription_id: "${s}", period_month: "2026-07", usage_kwh: 1500, charges_cents: 20000 }
              as: ProgramManager
              captures: { b: $.data.id }
          trigger:
            - call: "POST /greenpower/bills/${b}/issue"
              payload: {}
              as: ProgramManager
          assert:
            - "Bill.${b}.proration_active_days == 16  (2026-07-16 .. 2026-07-31 inclusive)"
            - "Bill.${b}.proration_days_in_period == 31"
            - "Bill.${b}.issued_credit_cents == 3097  (round_half_up(6000 * 16 / 31) = round_half_up(3096.774) ; tier straddle 500*5+500*7=6000 before proration)"
            - "Bill.${b}.provisional_credit_cents == 4600  (PROVISIONAL ignores proration and actual usage)"

      - name: trade_fee_per_line_rounding_pinned
        grounds:
          - calculations.trade_settlement
          - entities.Trade.fields.broker_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: per-line tier selection by line quantity (120 -> 35 bps,
          80 -> 50 bps) and per-line round_half_up BEFORE summation yields broker_fee_cents == 369; the
          alternative sum-then-fee algorithm (90000 * 35 bps) would yield 315 — the scaffold pins per-line-first.
        test_recipe:
          setup:
            - "Two certificates 120 MWh and 80 MWh in broker account b1; buyer b2; single trade, price 450, GROSS"
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 120000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-15T00:00:00Z", metered_kwh: 80000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r2: $.data.id }
            - call: "POST /greenpower/meter-readings/${r2}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r2}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-07"
              as: RegistryAdmin
              captures: { c120: "$.data[0].id" }
            - call: "GET /greenpower/certificates?generator_id=${g}&vintage_month=2026-08"
              as: RegistryAdmin
              captures: { c80: "$.data[0].id" }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker One" }
              as: RegistryAdmin
              captures: { b1: $.data.id }
            - call: "POST /greenpower/accounts"
              payload: { account_type: "BROKER", owner_name: "Broker Two" }
              as: RegistryAdmin
              captures: { b2: $.data.id }
            - call: "POST /greenpower/certificates/${c120}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/certificates/${c80}/transfer"
              payload: { to_account_id: "${b1}" }
              as: RegistryAdmin
            - call: "POST /greenpower/trades"
              payload: { from_account_id: "${b1}", to_account_id: "${b2}", items: [{certificate_id: "${c120}", quantity_mwh: 120}, {certificate_id: "${c80}", quantity_mwh: 80}], unit_price_cents_per_mwh: 450, settlement_mode: "GROSS" }
              as: BrokerTrader
              as_user_id: "${b1}"
              captures: { t: $.data.id }
            - call: "POST /greenpower/trades/${t}/accept"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
          trigger:
            - call: "POST /greenpower/trades/${t}/settle"
              payload: {}
              as: BrokerTrader
              as_user_id: "${b2}"
          assert:
            - "Trade.${t}.broker_fee_cents == 369  (per-line: round(54000*0.0035)=189 + round(36000*0.005)=180)"
            - "Trade.${t}.broker_fee_cents != 315  (aggregate-fee alternative 90000*0.0035 is non-conformant)"
            - "Trade.${t}.total_line_cents == 90000"

      - name: obligation_trueup_evaluation_order
        grounds:
          - calculations.compliance_coverage
          - calculations.shortfall_penalty
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order: penalty depends on deficit,
          deficit on required_mwh, and required_mwh amendment itself flips MET back to OPEN; the pinned order
          (freeze covered -> amend required -> re-derive status -> penalty at close) yields penalty 600000 cents.
        test_recipe:
          setup:
            - "Obligation 2026 CAISO required 500 MWh, penalty rate 5000 c/MWh; a 500-MWh compliance retirement makes it MET; amendment raises required to 620 (MET -> OPEN); close yields shortfall"
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 500000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r1: $.data.id }
            - call: "POST /greenpower/meter-readings/${r1}/attest"
              payload: {}
              as: MeterAttester
              as_user_id: "att-1"
            - call: "POST /greenpower/meter-readings/${r1}/accept"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/generators/${g}/mint-run"
              payload: {}
              as: RegistryAdmin
            - call: "GET /greenpower/certificates?generator_id=${g}"
              as: RegistryAdmin
              captures: { c500: "$.data[0].id" }
            - call: "POST /greenpower/compliance-obligations"
              payload: { lse_name: "LSE One", year: 2026, region_code: "CAISO", required_mwh: 500, penalty_rate_cents_per_mwh: 5000 }
              as: ComplianceOfficer
              captures: { ob: $.data.id, obv: $.data.version }
            - call: "POST /greenpower/retirements"
              payload: { certificate_id: "${c500}", purpose: "COMPLIANCE", obligation_id: "${ob}" }
              as: ComplianceOfficer
            - call: "GET /greenpower/compliance-obligations/${ob}"
              as: ComplianceOfficer
              captures: { obv2: $.data.version }
          trigger:
            - call: "PATCH /greenpower/compliance-obligations/${ob}"
              payload: { expected_obligation_version: "${obv2}", required_mwh: 620 }
              as: ComplianceOfficer
            - call: "POST /greenpower/compliance-obligations/${ob}/close"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "after retirement: ComplianceObligation.${ob}.status == MET and covered_mwh == 500"
            - "after PATCH: ComplianceObligation.${ob}.status == OPEN and covered_mwh == 500  (freeze-then-amend order)"
            - "after close: ComplianceObligation.${ob}.status == CLOSED_SHORTFALL"
            - "ComplianceObligation.${ob}.penalty_cents == 600000  ((620 - 500) * 5000)"
  - rule_id: non_linear_state_machine
    instances:
      - name: generator_suspend_reinstate_cycle
        grounds:
          - state_machines.Generator.ACTIVE_to_SUSPENDED
          - state_machines.Generator.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Generator is cyclic (ACTIVE -> SUSPENDED -> ACTIVE): while SUSPENDED a meter-reading create is
          rejected with ERR_GENERATOR_NOT_ACTIVE, and after reinstate the same payload succeeds — the machine
          loops back to a prior state rather than following a one-way pipeline.
        test_recipe:
          setup: ["Generator ACTIVE with auto-created GENERATOR account"]
          setup_api_calls:
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
            - call: "POST /greenpower/generators/${g}/submit-verification"
              payload: {}
              as: GeneratorOperator
              as_user_id: "${g}"
            - call: "POST /greenpower/generators/${g}/verify"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /greenpower/generators/${g}/suspend"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { err: $.data.error_id }
            - call: "POST /greenpower/generators/${g}/reinstate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /greenpower/meter-readings"
              payload: { generator_id: "${g}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", metered_kwh: 1000 }
              as: GeneratorOperator
              as_user_id: "${g}"
              captures: { r: $.data.id }
          assert:
            - "Generator.${g}.status transitions ACTIVE -> SUSPENDED -> ACTIVE (cycle)"
            - "while SUSPENDED: error_id == ERR_GENERATOR_NOT_ACTIVE (HTTP 409)"
            - "after reinstate: MeterReading.${r} created with status SUBMITTED"

      - name: claim_report_revision_cycle
        grounds:
          - state_machines.ClaimReport.SUBMITTED_to_REJECTED
          - state_machines.ClaimReport.REJECTED_to_DRAFT
        distinguishing_aspect: |
          ClaimReport is cyclic (DRAFT -> SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED -> ACCEPTED): rejection
          returns the report to DRAFT and revise re-pins the retirement set, letting the same report loop
          through submission rounds until acceptance.
        test_recipe:
          setup:
            - "VOLUNTARY program (no need to open); generator minted a 2-MWh certificate vintage 2026-07; voluntary retirement r pins to the program"
          setup_api_calls:
            - call: "POST /greenpower/programs"
              payload: { name: "SunTariff", market_class: "VOLUNTARY", eligible_region_codes: ["CAISO"], eligible_technologies: ["SOLAR"], capacity_cap_kw: 1000, rate_tiers: [{up_to_kwh: 500, rate_cents_per_kwh: 5}], annual_claim_cap_mwh: 10000 }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /greenpower/generators"
              payload: { legal_name: "Sierra Solar", facility_code: "SS1", technology: "SOLAR", nameplate_capacity_kw: 5000, region_code: "CAISO", commissioning_date: "2020-01-01" }
              as: RegistryAdmin
              captures: { g: $.data.id }
