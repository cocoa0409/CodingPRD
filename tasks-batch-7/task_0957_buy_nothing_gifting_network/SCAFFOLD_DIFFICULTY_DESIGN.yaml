              as: Member
              as_user_id: "${g_m_id}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /v1/gift-posts/${p_id}/publish"
              as: Member
              as_user_id: "${g_m_id}"
            - call: "POST /v1/claims"
              payload: { post_id: "${p_id}" }
              as: Member
              as_user_id: "${m_id}"
