            - { call: "GET /bank-accounts/${ba_id}/callback-verifications", payload: {}, as: Auditor, as_user_id: "u-aud-01", captures: { cb_code: "$.data[0].verification_code" } }
            - { call: "POST /bank-accounts/${ba_id}/confirm-verification", payload: { verification_code: "${cb_code}" }, as: VendorManager, as_user_id: "u-vm-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9101", amount_cents: 11111, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
              captures: { inv1: $.data.id }
            - { call: "POST /invoices/${inv1}/submit", payload: {}, as: APClerk, as_user_id: "u-ap-01" }
            - { call: "POST /invoices/${inv1}/approve", payload: { tier: 1 }, as: APSupervisor, as_user_id: "u-sup-01" }
            - call: "POST /invoices"
              payload: { vendor_id: "${v_id}", invoice_number: "INV-9102", amount_cents: 22222, cost_center: "CC-100", received_date: "2026-08-01" }
              as: APClerk
              as_user_id: "u-ap-01"
