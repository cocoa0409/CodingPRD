          rationale: "The named §1.8 instance asserts the refusal for both an overlapping and a gapped requested_term_start_on."
      - name: error_sponsor_not_licensed
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SPONSOR_NOT_LICENSED]
        excluded_because:
          difficulty_instance: salesperson_license_decision_blocked_by_suspended_sponsor
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_manufacturer_registration_lapsed
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MANUFACTURER_REGISTRATION_LAPSED]
        excluded_because:
          difficulty_instance: warranty_dispute_lapsed_manufacturer_safety_beats_rate_fiscal
          rationale: "The named §1.8 instance returns this code while a lower-priority fiscal defect is also present."
      - name: error_rate_not_above_posted
        claim_type: violation_to_error
        grounds:
          - errors[ERR_RATE_NOT_ABOVE_POSTED]
        excluded_because:
          difficulty_instance: warranty_dispute_lapsed_manufacturer_safety_beats_rate_fiscal
          rationale: "The named §1.8 instance isolates this code once the franchisor's registration is restored, proving the shadowed rule still fires on its own."
      - name: error_insufficient_ro_sample
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSUFFICIENT_RO_SAMPLE]
        excluded_because:
          difficulty_instance: warranty_sample_exactly_five_qualifying_lines_accepted
          rationale: "The named §1.8 instance asserts the four-line refusal on the low side of the MIN_QUALIFYING_LINES boundary."
      - name: error_amendment_limit_reached
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AMENDMENT_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: franchise_filing_amend_cycle_back_to_notice_served
          rationale: "The named §1.8 instance drives the amend cycle to its cap and asserts the third refusal."

  - section: rbac
    instances:
      - name: every_role_performs_its_own_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - rbac.BoardAdmin.exclusive_operations
          - rbac.Dealer.exclusive_operations
          - rbac.LicensingAnalyst.exclusive_operations
          - rbac.ComplaintInvestigator.exclusive_operations
          - rbac.Manufacturer.exclusive_operations
        distinguishing_aspect: "Each of the five acting roles succeeds on an operation reserved to it — BoardAdmin creating reference data and deciding, Dealer submitting, LicensingAnalyst issuing the deficiency notice, Manufacturer filing a franchise notice, ComplaintInvestigator intaking a complaint — inside a single chain, so the positive half of the matrix is proved before any denial is asserted."
        test_recipe:
          setup:
            - "Nothing pre-existing; every row in the chain is created by the role that owns the operation."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_r1_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_r1_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_r1_id}", application_type: "INITIAL", facility_sqft: 5000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_r1_id}"
              captures: { app_r1_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_r1_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_r1_id}"
            - call: "POST /dealer-board/license-applications/${app_r1_id}/deficiency-notice"
              payload: { deficiency_note: "floor plan short of the statutory minimum" }
              as: LicensingAnalyst
            - call: "POST /dealer-board/license-applications/${app_r1_id}/resubmit"
              payload: { facility_sqft: 9000 }
              as: Dealer
              as_user_id: "${dlr_r1_id}"
            - call: "POST /dealer-board/license-applications/${app_r1_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_r1_id}", filing_type: "TERMINATION", proposed_effective_on: "2026-12-01", affected_dealer_id: "${dlr_r1_id}", termination_cause_code: "FAILURE_TO_MEET_SALES_PERFORMANCE" }
              as: Manufacturer
              as_user_id: "${mfr_r1_id}"
            - call: "POST /dealer-board/consumer-complaints"
              payload: { dealer_id: "${dlr_r1_id}", complainant_name: "Rosa Ibarra", allegation_code: "DEPOSIT_RETENTION", alleged_loss_cents: 75000 }
              as: ComplaintInvestigator
              as_user_id: "inv-r1"
          assert:
            - "every trigger returns 200 or 201 with success true"
            - "LicenseApplication.${app_r1_id} walked DRAFT -> SUBMITTED -> DEFICIENT -> SUBMITTED -> APPROVED with resubmission_count 1"
            - "Dealer.${dlr_r1_id}.license_status == LICENSED AND franchise_status == TERMINATION_PENDING"
            - "the filing was created by the Manufacturer role and the complaint by the ComplaintInvestigator role"

      - name: role_cannot_perform_another_roles_exclusive_operation_or_act_unauthenticated
        claim_type: unauthorized_operation
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_UNAUTHENTICATED]
          - rbac.BoardAdmin.exclusive_operations
          - rbac.HearingClerk.exclusive_operations
        distinguishing_aspect: "The authorization ladder is checked before anything else: a Dealer deciding its own application, a LicensingAnalyst deciding one, a HearingClerk creating reference data and a Manufacturer filing a protest all get 403 ERR_UNAUTHORIZED, while a missing X-User-ID, a missing X-User-Role and an unknown role get 401 ERR_UNAUTHENTICATED even though the same body would otherwise be valid."
        test_recipe:
          setup:
            - "One dealer with a SUBMITTED INITIAL application."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "USED_ONLY", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0 }
              as: BoardAdmin
              captures: { dlr_r2_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_r2_id}", application_type: "INITIAL", facility_sqft: 2500, display_spaces: 4, service_bays: 0, bond_amount_cents: 2500000, insurance_liability_cents: 50000000, zoning_certificate_status: "APPROVED", line_make_count: 0 }
              as: Dealer
              as_user_id: "${dlr_r2_id}"
              captures: { app_r2_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_r2_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_r2_id}"
          trigger:
            - call: "POST /dealer-board/license-applications/${app_r2_id}/decision"
              payload: { outcome: "APPROVED" }
              as: Dealer
              as_user_id: "${dlr_r2_id}"
            - call: "POST /dealer-board/license-applications/${app_r2_id}/decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Clerk's Own Dealership", dealer_type: "USED_ONLY", county_tier: "TIER_1", site_x_km: 1, site_y_km: 1 }
              as: HearingClerk
            - call: "POST /dealer-board/license-applications/${app_r2_id}/deficiency-notice"
              payload: { deficiency_note: "not my job" }
              as: ComplaintInvestigator
            - call: "POST /dealer-board/license-applications/${app_r2_id}/decision"
              payload: { outcome: "APPROVED" }
              as: "(X-User-Role header absent)"
            - call: "POST /dealer-board/license-applications/${app_r2_id}/decision"
              payload: { outcome: "APPROVED" }
              as: "BoardAdmin (X-User-ID header absent)"
            - call: "POST /dealer-board/license-applications/${app_r2_id}/decision"
              payload: { outcome: "APPROVED" }
              as: "SuperRegulator (undeclared role)"
          assert:
            - "triggers 1-4: HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "triggers 5-7: HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the 401s outrank the 403s in the sense that an absent role never falls through to the role check"
            - "LicenseApplication.${app_r2_id}.status is still SUBMITTED and Dealer.${dlr_r2_id}.license_status is still PROSPECTIVE"
            - "GET /dealer-board/dealers reports total_count == 1 (the clerk's dealer was never created)"

      - name: dealer_cannot_act_on_another_dealers_application_or_salesperson
        claim_type: peer_roles
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - rbac.Dealer.identity_entity_backed
          - rbac.Manufacturer.identity_entity_backed
        distinguishing_aspect: "Entity-backed identity is enforced per row, not per role: Northgate holds the Dealer role yet may neither submit Lakeside's application nor sponsor a salesperson under Lakeside's id, and a second franchisor may not serve notice on the first franchisor's filing — while both dealers may read each other's rows through the shared GET endpoints."
        test_recipe:
          setup:
            - "Two dealers (Lakeside, Northgate), two franchisors (AURORA, BOREAS); Lakeside owns a DRAFT application and AURORA owns a DRAFT filing."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_r3_a_id: $.data.id }
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Boreas Motor Works", line_make: "BOREAS", home_office_state: "OH", posted_warranty_labor_rate_cents: 5500 }
              as: BoardAdmin
              captures: { mfr_r3_b_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_r3_a_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Northgate Boreas", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_1", site_x_km: 5, site_y_km: 0, line_make: "BOREAS" }
              as: BoardAdmin
              captures: { dlr_r3_b_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_r3_a_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_r3_a_id}"
              captures: { app_r3_id: $.data.id }
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_r3_a_id}", filing_type: "TERMINATION", proposed_effective_on: "2026-12-01", affected_dealer_id: "${dlr_r3_a_id}", termination_cause_code: "FAILURE_TO_MEET_SALES_PERFORMANCE" }
              as: Manufacturer
              as_user_id: "${mfr_r3_a_id}"
              captures: { fil_r3_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/license-applications/${app_r3_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_r3_b_id}"
            - call: "POST /dealer-board/salespersons"
              payload: { sponsoring_dealer_id: "${dlr_r3_a_id}", full_name: "Not Mine", disclosed_prior_discipline: false }
              as: Dealer
              as_user_id: "${dlr_r3_b_id}"
            - call: "POST /dealer-board/franchise-filings/${fil_r3_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_r3_b_id}"
            - call: "GET /dealer-board/license-applications/${app_r3_id}"
              as: Dealer
              as_user_id: "${dlr_r3_b_id}"
            - call: "POST /dealer-board/license-applications/${app_r3_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_r3_a_id}"
          assert:
            - "triggers 1-3: HTTP 403 with error_id ERR_NOT_RESOURCE_OWNER"
            - "trigger 4: HTTP 200 — shared reads are open to both dealers"
            - "trigger 5: HTTP 200 — the owning dealer's identical call succeeds and the application becomes SUBMITTED"
            - "FranchiseFiling.${fil_r3_id}.status is still DRAFT with notice_served_on null"
            - "GET /dealer-board/salespersons?sponsoring_dealer_id=${dlr_r3_a_id} reports total_count == 0"

      - name: same_user_cannot_investigate_and_then_resolve_one_complaint
        claim_type: segregation_of_duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - rbac.role_model_segregation_of_duties
        distinguishing_aspect: "The bar is on the X-User-ID, not on the role: the investigator's id resolving its own complaint is refused with 403 even when it presents the BoardAdmin role, while any other id resolves the same complaint immediately."
        test_recipe:
          setup:
            - "A dealer and a complaint investigated by user inv-r4 (alleged loss 100000, allegation ODOMETER_MISREPRESENTATION)."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "USED_ONLY", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0 }
              as: BoardAdmin
              captures: { dlr_r4_id: $.data.id }
            - call: "POST /dealer-board/consumer-complaints"
              payload: { dealer_id: "${dlr_r4_id}", complainant_name: "Ola Fenn", allegation_code: "ODOMETER_MISREPRESENTATION", alleged_loss_cents: 100000 }
              as: ComplaintInvestigator
              as_user_id: "inv-r4"
              captures: { cmp_r4_id: $.data.id }
            - call: "POST /dealer-board/consumer-complaints/${cmp_r4_id}/investigation"
              payload: { findings_code: "ODOMETER_ROLLBACK_CONFIRMED" }
              as: ComplaintInvestigator
              as_user_id: "inv-r4"
          trigger:
            - call: "POST /dealer-board/consumer-complaints/${cmp_r4_id}/resolution"
