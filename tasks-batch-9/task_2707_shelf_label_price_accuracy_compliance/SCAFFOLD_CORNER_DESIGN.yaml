            - "${e_25} == ERR_INVALID_REQUEST (HTTP 400): the unparseable scheduled_start_at outranks both bogus ids"
            - "${e_30} == ERR_PRICE_CHANGE_FILE_NOT_FOUND (HTTP 404): the path parameter is resolved before any body FK"
            - "${e_32} == ERR_STORE_NOT_FOUND (HTTP 404): with the path valid and two body FKs bogus, the endpoint's input order (store_id before aisle_id) decides, so it is never ERR_AISLE_NOT_FOUND"
            - "${e_40} == ERR_FILE_INVALID_STATE (HTTP 409): the DRAFT file's own state outranks the deliberately stale ${ver_0}, so the response is a 409 and not a 412"
            - "${e_45} == ERR_STALE_PRICE_CHANGE_FILE_VERSION (HTTP 412): the stale version outranks the degenerate scheduled window carried in the same request"
            - "${e_58} == ERR_INVALID_WINDOW (HTTP 422): with the version now correct, the zero-length window outranks the duplicate (line_1, store_a) tuple that the same request also violates"
            - "${e_66} == ERR_AISLE_STORE_MISMATCH (HTTP 422): aisle B01 belongs to store_b, and this outranks the associate mismatch in the same request"
            - "${e_67} == ERR_ASSOCIATE_STORE_MISMATCH (HTTP 422): aisle B01 now matches store_b, so the store_a associate is the first violation, ahead of store_b being out of scope"
            - "${e_68} == ERR_STORE_OUT_OF_FILE_SCOPE (HTTP 422): aisle and associate both belong to store_b, leaving only the scope violation"
            - "${ver_3} == ${ver_2}: nine rejected writes bumped nothing, and GET /price-integrity/label-tasks?price_change_line_id=${line_2} returns total_count 0"

      - name: corner_temporal_windows_reject_degenerate_intervals_and_the_passed_deadline
        claim_type: temporal_validation
        grounds:
          - validations.priority_56
          - validations.priority_58
          - errors.ERR_EFFECTIVE_DATE_PASSED
          - errors.ERR_INVALID_WINDOW
          - errors.ERR_NO_QUALIFYING_AUDIT_DATA
        distinguishing_aspect: "The distribution deadline is effective_date + grace_period_hours and the comparison is strict (clock_now < deadline), so one second earlier succeeds and the exact instant fails; the same ERR_INVALID_WINDOW covers start == end and start > end on all four interval-carrying endpoints, and it outranks the exception report's empty-data guard so an ill-formed period never reports missing data."
        test_recipe:
          setup:
            - "Jurisdiction with grace_period_hours 48; one store, one aisle, certified sm1, la1 and pa1; two single-line files both effective 2026-08-03T00:00:00Z, so the distribution deadline is 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
