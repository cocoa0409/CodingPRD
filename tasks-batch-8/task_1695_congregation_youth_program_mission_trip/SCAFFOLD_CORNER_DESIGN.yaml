  - section: cross_cutting_layers
    instances:
      - name: occ_program_policy_stale_version
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[scholarship-policy-stale-program]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "PUT scholarship-policy with the just-read version succeeds and bumps version 1 -> 2; replaying the same expected_program_version is then rejected deterministically with 412 — the sequential OCC loser."
        test_recipe:
          setup: ["program created; version captured"]
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "P", ministry_year: "2026-2027", scholarship_fund_total_cents: 1000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog: $.data.id, pv: $.data.version} }
          trigger:
            - { call: "PUT /youth-ministry/programs/${prog}/scholarship-policy", payload: {max_award_pct_bp: 6000, per_registration_cap_cents: 90000, expected_program_version: "${pv}"}, as: ProgramDirector, captures: {pv2: $.data.version, bp: $.data.max_award_pct_bp} }
            - { call: "PUT /youth-ministry/programs/${prog}/scholarship-policy", payload: {max_award_pct_bp: 7000, per_registration_cap_cents: 80000, expected_program_version: "${pv}"}, as: ProgramDirector, captures: {e_stale: $.data.error_id} }
            - { call: "GET /youth-ministry/programs/${prog}", as: ProgramDirector, captures: {bp_final: $.data.max_award_pct_bp} }
          assert:
            - "pv == 1 and pv2 == 2 and bp == 6000 (first write wins by version)"
            - "e_stale == ERR_STALE_PROGRAM_VERSION (412)"
            - "bp_final == 6000 — the stale write applied nothing"

      - name: layer_cascading_side_effects
        claim_type: cascade_chain
        grounds:
          - state_machines.Trip.REGISTRATION_CLOSED_to_CANCELLED
          - state_machines.BackgroundCheck.SCREENING_to_FLAGGED
        excluded_because:
          difficulty_instance: trip_cancel_depth3_registration_scholarship_program
          rationale: "Depth-3 and depth-2 cascades verified end-to-end in §1.8 (trip_cancel_depth3..., screening_flag_cascade...)."

      - name: layer_dual_variant_calculation
        claim_type: variant_divergence
        grounds:
          - calculations.provisional_cost_share
          - calculations.fundraising_positions
        excluded_because:
          difficulty_instance: cost_share_provisional_vs_final_at_lock
          rationale: "Both dual-variant domains asserted with literals in §1.8 (cost share; fundraising gross/net)."

      - name: layer_ops_run_checkpoint_clock_sweeps
        claim_type: ops_run_epoch
        grounds:
          - endpoints."POST /youth-ministry/_clock/set-current-utc"
          - calculations.late_fee_assessment
        excluded_because:
          difficulty_instance: payment_deadline_inclusive_timestamp_boundary
          rationale: "Delinquency sweep epoch and its strict-> boundary asserted there; the EXPIRED sweep epoch is asserted in this file's screening_expiry_sweep_at_exact_expiry_cascades instance. Default clock 2026-08-01T00:00:00Z is asserted by background_check_lifecycle_and_uniqueness (cleared_at equals the default with no prior clock call)."

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_visibility
        grounds:
