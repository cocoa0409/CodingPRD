              as: ServiceMember
              as_user_id: "${mem_id}"
            - *c_case
            - call: "POST /reemployment/benefit-assessments"
              payload: { case_id: "${case_id}" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/benefit-assessments"
