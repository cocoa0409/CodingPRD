scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rent_settlement_provisional_vs_final
        grounds:
          - calculations.rent_settlement
          - entities.Settlement.fields.total_rent_cents
          - state_machines.Settlement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: "On identical orders, the PROVISIONAL variant (ACCEPTED+FULFILLED sales) yields total_rent_cents 360000 while the FINAL variant (FULFILLED only) yields 200000 - a rent/settlement-domain dual variant."
        test_recipe:
          setup:
            - "Open stall (active lease, active vendor, ISSUED permit) at hall hours 08:00-22:00; clock 2026-06-15T18:00Z."
            - "Lease base_rent 200000, rate 0.08, breakpoint 5000000, cap 100000000, term 2026-06-01..2026-12-31."
            - "Order O1 gross 3000000 left ACCEPTED; Order O2 gross 4000000 FULFILLED; settlement period 2026-06-01..2026-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320, event_buffer_minutes: 60 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { lv: $.data.version }
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 3000000, item_count: 2 }
              as: POSOperator
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 4000000, item_count: 3 }
              as: POSOperator
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /orders/${o2}/fulfill"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { se: $.data.id, prov_total: $.data.total_rent_cents }
            - call: "POST /settlements/${se}/finalize"
              payload: {}
              as: HallManager
              captures: { fin_total: $.data.total_rent_cents }
          assert:
            - "Settlement.${se}.total_rent_cents == 360000 at creation (provisional: gross_sales_cents 7000000)"
            - "Settlement.${se}.total_rent_cents == 200000 after finalize (final: gross_sales_cents 4000000)"

      - name: compliance_grade_latest_vs_weighted
        grounds:
          - calculations.stall_compliance_grade
          - endpoints[GET /stalls/{id}/compliance-grade]
          - entities.Inspection.fields.score
        distinguishing_aspect: "For the same two conducted inspections (newest 78, prior 95), LATEST returns score 78 grade C while WEIGHTED returns score 85 grade B - a stall-compliance-domain dual variant, distinct from the rent domain."
        test_recipe:
          setup:
            - "One stall with two CONDUCTED inspections: older score 95, newer score 78."
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /inspections"
              payload: { stall_id: "${st}", scheduled_for: "2026-04-01T09:00:00Z" }
              as: HealthInspector
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/conduct"
              payload: { score: 95 }
              as: HealthInspector
            - call: "POST /inspections"
              payload: { stall_id: "${st}", scheduled_for: "2026-05-01T09:00:00Z" }
              as: HealthInspector
              captures: { i2: $.data.id }
            - call: "POST /inspections/${i2}/conduct"
              payload: { score: 78 }
              as: HealthInspector
          trigger:
            - call: "GET /stalls/${st}/compliance-grade?method=LATEST"
              payload: { method: "LATEST" }
              as: HallManager
              captures: { latest_grade: $.data.grade, latest_score: $.data.score }
            - call: "GET /stalls/${st}/compliance-grade?method=WEIGHTED"
              payload: { method: "WEIGHTED" }
              as: HallManager
              captures: { weighted_grade: $.data.grade, weighted_score: $.data.score }
          assert:
            - "LATEST response: score == 78, grade == \"C\""
            - "WEIGHTED response: score == 85, grade == \"B\""

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rent_total_nested_min_max
        grounds:
          - calculations.rent_settlement
          - entities.Lease.fields.rent_cap_cents
          - entities.Settlement.fields.percentage_rent_cents
        distinguishing_aspect: "Mode (a): total = min(rent_cap, base + round(rate*max(0, S-breakpoint))) has 4+ inputs with nested min/max; with S=7000000 percentage_rent_cents == 160000 and total == 360000 (below cap, so min() is a no-op that must still be evaluated)."
        test_recipe:
          setup:
            - "Open stall + active lease (base 200000, rate 0.08, breakpoint 5000000, cap 100000000); one ACCEPTED order 3000000 + one FULFILLED order 4000000 in period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { lv: $.data.version }
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 3000000, item_count: 2 }
              as: POSOperator
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 4000000, item_count: 3 }
              as: POSOperator
              captures: { o2: $.data.id }
            - call: "POST /orders/${o2}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /orders/${o2}/fulfill"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
          trigger:
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { se: $.data.id }
          assert:
            - "Settlement.${se}.percentage_rent_cents == 160000"
            - "Settlement.${se}.base_rent_charged_cents == 200000"
            - "Settlement.${se}.total_rent_cents == 360000"

      - name: prorated_base_round_then_sum
        grounds:
          - calculations.prorated_base_rent
          - calculations.rent_settlement
          - entities.Settlement.fields.base_rent_charged_cents
        distinguishing_aspect: "Mode (b): base is prorated 20/30 days -> round(133333.33)=133333 and percentage rent round(0.08*1250003)=round(100000.24)=100000 are each rounded THEN summed (233333); the sum-then-round alternative would give 233334, so pinning the order changes the cent."
        test_recipe:
          setup:
            - "Open stall + active lease with lease.start_date 2026-06-11 (mid-period), base 200000; settlement period 2026-06-01..2026-06-30 (30 days, 20 active days)."
            - "One FULFILLED order gross 6250003 in period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-11", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { lv: $.data.version }
            - call: "POST /orders"
              payload: { food_hall_id: "${fh}", stall_id: "${st}", gross_amount_cents: 6250003, item_count: 5 }
              as: POSOperator
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /orders/${o1}/fulfill"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { se: $.data.id }
          trigger:
            - call: "POST /settlements/${se}/finalize"
              payload: {}
              as: HallManager
              captures: { fin_total: $.data.total_rent_cents }
          assert:
            - "Settlement.${se}.base_rent_charged_cents == 133333"
            - "Settlement.${se}.percentage_rent_cents == 100000"
            - "Settlement.${se}.total_rent_cents == 233333 (round-then-sum; NOT 233334)"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_dispute_cycle
        grounds:
          - state_machines.Settlement.PROVISIONAL_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_PROVISIONAL
        distinguishing_aspect: "Settlement cycles PROVISIONAL->DISPUTED->PROVISIONAL: after dispute then resolve-dispute the status returns to PROVISIONAL, a revert cycle on the Settlement entity."
        test_recipe:
          setup:
            - "Open stall + active lease; a PROVISIONAL settlement exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:00:00Z" }
              as: HallManager
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
              captures: { lv: $.data.version }
            - call: "POST /settlements"
              payload: { lease_id: "${ls}", period_start: "2026-06-01", period_end: "2026-06-30", expected_lease_version: "${lv}" }
              as: HallManager
              captures: { se: $.data.id }
          trigger:
            - call: "POST /settlements/${se}/dispute"
              payload: {}
              as: Vendor
              as_user_id: "${v}"
              captures: { disputed_status: $.data.status }
            - call: "POST /settlements/${se}/resolve-dispute"
              payload: {}
              as: HallManager
              captures: { resolved_status: $.data.status }
          assert:
            - "Settlement.${se}.status == DISPUTED after dispute"
            - "Settlement.${se}.status == PROVISIONAL after resolve-dispute"

      - name: lease_renewal_self_loop
        grounds:
          - state_machines.Lease.ACTIVE_to_ACTIVE
          - entities.Lease.fields.end_date
        distinguishing_aspect: "Lease has an ACTIVE->ACTIVE renewal self-loop on a different entity than Settlement: renew keeps status ACTIVE, extends end_date to 2027-06-30, and bumps version - a cyclic (self-loop) transition."
        test_recipe:
          setup:
            - "Open stall + active lease with end_date 2026-12-31, version 2 after activation."
          setup_api_calls:
            - call: "POST /food-halls"
              payload: { name: "Hall", total_seating_capacity: 100, common_area_capacity: 500, hall_open_minutes: 480, hall_close_minutes: 1320 }
              as: HallManager
              captures: { fh: $.data.id }
            - call: "POST /vendors"
              payload: { legal_name: "V", contact_email: "v@x.com" }
              as: HallManager
              captures: { v: $.data.id }
            - call: "POST /vendors/${v}/activate"
              payload: {}
              as: HallManager
            - call: "POST /stalls"
              payload: { food_hall_id: "${fh}", stall_code: "A-1", size_sqft: 200, open_minutes: 480, close_minutes: 1320 }
              as: HallManager
              captures: { st: $.data.id }
            - call: "POST /permits"
              payload: { stall_id: "${st}", permit_number: "P-1", expires_on: "2027-01-01" }
              as: HealthInspector
              captures: { pm: $.data.id }
            - call: "POST /permits/${pm}/issue"
              payload: {}
              as: HealthInspector
            - call: "POST /leases"
              payload: { stall_id: "${st}", vendor_id: "${v}", start_date: "2026-06-01", end_date: "2026-12-31", base_rent_cents: 200000, percentage_rate: 0.08, natural_breakpoint_cents: 5000000, rent_cap_cents: 100000000, security_deposit_cents: 100000 }
              as: HallManager
              captures: { ls: $.data.id }
            - call: "POST /leases/${ls}/activate"
              payload: {}
              as: HallManager
          trigger:
            - call: "POST /leases/${ls}/renew"
              payload: { new_end_date: "2027-06-30" }
              as: HallManager
              captures: { renewed_status: $.data.status, renewed_end: $.data.end_date }
          assert:
            - "Lease.${ls}.status == ACTIVE after renew"
            - "Lease.${ls}.end_date == \"2027-06-30\""

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_cascade
        grounds:
          - state_machines.Inspection.SCHEDULED_to_CONDUCTED
          - state_machines.HealthPermit.ISSUED_to_SUSPENDED
          - state_machines.Order.ROUTED_to_REJECTED
          - state_machines.SeatingAllocation.RESERVED_to_RELEASED
        distinguishing_aspect: "Depth-4 chain from an Inspection conduct: FAIL -> permit ISSUED->SUSPENDED -> stall posture SUSPENDED -> order ROUTED->REJECTED -> its seating RESERVED->RELEASED, each link caused by the prior link."
        test_recipe:
          setup:
            - "Open stall (active lease, ISSUED permit) with a ROUTED order o1 and a RESERVED seating sa1 linked to o1; a SCHEDULED inspection insp."
          setup_api_calls:
