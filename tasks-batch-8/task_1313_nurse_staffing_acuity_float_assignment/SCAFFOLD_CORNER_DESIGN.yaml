              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
          trigger:
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: StaffNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE (HTTP 403)"

      - name: regulator_cannot_submit_report_rejected
        claim_type: rbac_exclusive_denial
        grounds: [roles]
        distinguishing_aspect: "Submit is NurseAdmin-exclusive; the Regulator may only return/accept."
        test_recipe:
          setup: ["DRAFT report for 2026-08-17"]
          setup_api_calls:
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-17" }
              as: NurseAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep}/submit"
              as: Regulator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"

      - name: admin_cannot_return_report_rejected
        claim_type: rbac_exclusive_denial
        grounds: [roles]
        distinguishing_aspect: "Return is Regulator-exclusive (segregation between reporter and reviewer)."
        test_recipe:
          setup: ["DRAFT report for 2026-08-18"]
          setup_api_calls:
            - call: "POST /compliance-reports"
              payload: { report_date: "2026-08-18" }
              as: NurseAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /compliance-reports/${rep}/return"
              payload: { return_reason: "overreach" }
              as: NurseAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"

      - name: float_coordinator_cannot_create_assignments_rejected
        claim_type: rbac_exclusive_denial
        grounds: [roles]
        distinguishing_aspect: "Direct assignment creation is ChargeNurse-exclusive; the FloatCoordinator must go through float requests."
        test_recipe:
          setup: ["ICU unit with matrix; shift required 2; float nurse exists"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU R3", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Float Finn", employment_type: "FLOAT_POOL", competencies: ["ICU"], base_hourly_rate_cents: 6000 }
              as: NurseAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${f1}", expected_shift_version: "${sh_v}" }
              as: FloatCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE"

  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_shift_version_rejected
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[assignment-create-stale-shift]", "errors[ERR_STALE_SHIFT_VERSION]"]
        distinguishing_aspect: "OCC: after a first assignment create advances Shift.version 1 -> 2, a second create carrying the stale expected_shift_version 1 is rejected with 412."
        test_recipe:
          setup: ["ICU unit with matrix; DAY shift required 4 (version 1); two CORE ICU nurses"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU X1", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 2, census_moderate: 3, census_high: 2, census_critical: 1 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /nurses"
              payload: { full_name: "Occ One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Occ Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n2: $.data.id }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n2}", expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_SHIFT_VERSION (HTTP 412; Shift.version is now 2 but the request carried the stale version 1)"

      - name: posture_threshold_walk
        claim_type: rate_threshold_triggers
        grounds: [calculations.staffing_posture_evaluation]
        distinguishing_aspect: "Posture steps through exact thresholds: counted 0 -> CRITICAL (<= required-2), counted 1 -> UNDERSTAFFED (== required-1), counted 2 with charge -> ADEQUATE and status flips to STAFFED."
        test_recipe:
          setup: ["ICU unit with matrix; DAY shift required 2; charge-qualified nurse N1 and nurse N2"]
          setup_api_calls:
            - call: "POST /units"
              payload: { name: "ICU X2", unit_type: "ICU", bed_count: 12, incentive_budget_cents: 500000 }
              as: NurseAdmin
              captures: { u: $.data.id }
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "LOW", patients_per_nurse: 4 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "MODERATE", patients_per_nurse: 3 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "HIGH", patients_per_nurse: 2 }
              as: NurseAdmin
            - call: "POST /matrix-rules"
              payload: { unit_type: "ICU", acuity_level: "CRITICAL", patients_per_nurse: 1 }
              as: NurseAdmin
            - call: "POST /acuity-snapshots"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY", census_low: 4, census_moderate: 0, census_high: 0, census_critical: 0 }
              as: ChargeNurse
            - call: "POST /shifts"
              payload: { unit_id: "${u}", shift_date: "2026-08-10", shift_code: "DAY" }
              as: NurseAdmin
              captures: { sh: $.data.id, sh_v: $.data.version, p0: $.data.staffing_posture }
            - call: "POST /nurses"
              payload: { full_name: "Walk One", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, charge_qualified: true, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n1: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Walk Two", employment_type: "CORE", competencies: ["ICU"], base_hourly_rate_cents: 5000, home_unit_id: "${u}" }
              as: NurseAdmin
              captures: { n2: $.data.id }
          trigger:
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n1}", is_charge: true, expected_shift_version: "${sh_v}" }
              as: ChargeNurse
              captures: { a1: $.data.id }
            - call: "POST /assignments/${a1}/accept"
              as: StaffNurse
              as_user_id: "${n1}"
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { p1: $.data.staffing_posture, v2: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${n2}", expected_shift_version: "${v2}" }
              as: ChargeNurse
              captures: { a2: $.data.id }
            - call: "POST /assignments/${a2}/accept"
              as: StaffNurse
              as_user_id: "${n2}"
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { p2: $.data.staffing_posture, st2: $.data.status }
          assert:
            - "At creation: staffing_posture == CRITICAL (0 <= 2 - 2)"
            - "After one ACCEPTED charge assignment: staffing_posture == UNDERSTAFFED (1 == 2 - 1)"
            - "After two ACCEPTED (charge covered): staffing_posture == ADEQUATE and status == STAFFED"

      - name: acuity_supersede_stamp
        claim_type: side_effect_execution
        grounds: [state_machines.AcuitySnapshot.SUBMITTED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: acuity_amendment_triggers_float_deployment
          rationale: "Supersede of the prior snapshot and the shift recompute are asserted as hops 1-2 of the depth-3 cascade instance."

      - name: auto_offer_on_adequecy_loss
        claim_type: side_effect_execution
        grounds: [state_machines.ShiftAssignment.ACCEPTED_to_CANCELLED, calculations.incentive_budget_ledger]
        excluded_because:
          difficulty_instance: cancel_triggers_auto_incentive_offer
          rationale: "The cancel -> posture -> auto-offer chain and its reserve amounts are asserted by the depth-2 cascade instance."

      - name: fill_rate_variant_values
        claim_type: variant_divergence
        grounds: [calculations.compliance_fill_rates]
        excluded_because:
          difficulty_instance: census_vs_shift_weighted_fill_rate
          rationale: "Both variant values and their divergence are asserted with exact literals in the difficulty instance."

      - name: budget_reserve_withdraw_pair
        claim_type: compensation
        grounds: [calculations.incentive_budget_ledger]
        excluded_because:
          difficulty_instance: incentive_budget_reserve_release_invariant
          rationale: "Create+withdraw conservation of the budget ledger is the difficulty instance's assertion."
