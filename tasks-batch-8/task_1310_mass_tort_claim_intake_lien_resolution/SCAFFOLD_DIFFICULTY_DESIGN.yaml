              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 6000000 }
              as: ProgramAdministrator
              captures: { tmid_high: $.data.id }
            - call: "POST /settlement-programs/${pid_high}/tier-matrices/${tmid_high}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid_high}/claimants"
              payload: { full_name: "Dave", date_of_birth: "1960-01-01", ssn_last4: "2222", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid_high: $.data.id }
            - call: "POST /settlement-programs/${pid_high}/claims"
