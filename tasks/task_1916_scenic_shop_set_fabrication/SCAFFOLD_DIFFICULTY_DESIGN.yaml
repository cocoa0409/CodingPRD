  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (3 instances, 3 category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_build_state_before_safety
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ENGINEERING_NOT_APPROVED]
        distinguishing_aspect: |
          Category pair state (p4) vs business_safety (p5): a start-build on
          an ON_HOLD production whose reviews include a REVISION_REQUIRED one
          violates both gates; the state error ERR_INVALID_STATE must win
          because priority 4 is evaluated before priority 5.
        test_recipe:
          setup:
            - "Production ON_HOLD: was IN_BUILD, then a second review was kicked back (REVISION_REQUIRED) — so both the state gate (not IN_BUILD) and the safety gate (unapproved review) fail"
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
