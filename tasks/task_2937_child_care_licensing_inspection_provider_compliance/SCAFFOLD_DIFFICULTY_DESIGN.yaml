  # =======================================================================
  # Rule 9 — compensating invariant over two different conserved quantities
  #   1 = violation points  (lifetime == open + resolved)
  #   2 = capacity slots    (licensed + suspended == total_authorized_slots)
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invariant_violation_points_lifetime_equals_open_plus_resolved
        grounds:
          - calculations.violation_point_conservation
          - calculations.violation_point_assessment
          - calculations.inspection_compliance_score
          - calculations.provider_risk_assessment
          - state_machines.Violation.transitions
          - entities.Provider.fields.open_violation_points
          - entities.Provider.fields.resolved_violation_points
          - entities.Provider.fields.lifetime_violation_points
          - endpoints.POST_licensing_violations_disposition
        distinguishing_aspect: |
          Conserved quantity: violation points. lifetime_violation_points must
          equal open_violation_points + resolved_violation_points after every
          single mutation. A correction MOVES points from open to resolved
          (lifetime unchanged), while a vacatur REMOVES them from both sides
          (lifetime shrinks) — two different compensations over the same ledger.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "ChecklistItems SU-102 CRITICAL and RA-201 SERIOUS, both applicable to PRESCHOOL, neither infant_sensitive."
            - "One Inspector certified for PRESCHOOL, one CENTER provider, one screened-in Complaint."
            - "A COMPLAINT inspection carrying SU-102/PRESCHOOL (15 points) and RA-201/PRESCHOOL (8 points), submitted FAIL and FINALIZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-102", title: "Written supervision plan on file", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Marlowe Center", county_code: "CTY-01", site_address: "31 Marlowe St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "WEB", allegation_category: "RATIO", affected_age_group: "PRESCHOOL", narrative: "Web report of thin staffing in the preschool room.", anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
            - call: "POST /licensing/complaints/${cmp}/screen"
              payload: { decision: "SCREEN_IN" }
              as: ComplaintIntakeSpecialist
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su}", primary_age_group: "PRESCHOOL", narrative: "No written supervision plan on file." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_crit: $.data.id, pts_crit: $.data.assessed_points }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "Preschool room over ratio at mid-morning." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_ser: $.data.id, pts_ser: $.data.assessed_points }
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
          trigger:
            - call: "GET /licensing/providers/${prov}/risk-assessment"
              payload: { variant: "ENFORCEMENT_REVIEW" }
              as: AgencyAdmin
              captures: { risk_after_cite: $.data.risk_score }
            - call: "POST /licensing/violations/${v_crit}/disposition"
              payload: { disposition: "VERIFIED_CORRECTED" }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "FINAL" }
              as: LicensingSupervisor
              captures: { score_after_correct: $.data.compliance_score }
            - call: "POST /licensing/violations/${v_ser}/disposition"
              payload: { disposition: "VACATED", vacated_reason: "The ratio finding was recorded against the wrong classroom." }
              as: LicensingSupervisor
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "FINAL" }
              as: LicensingSupervisor
              captures: { score_after_vacate: $.data.compliance_score }
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "PRELIMINARY" }
              as: LicensingSupervisor
              captures: { prelim_live: $.data.compliance_score }
            - call: "GET /licensing/providers/${prov}/risk-assessment"
              payload: { variant: "ENFORCEMENT_REVIEW" }
              as: AgencyAdmin
              captures: { risk_after_vacate: $.data.risk_score }
          assert:
            - "${pts_crit} == 15 and ${pts_ser} == 8 (neither violation is infant-exposed and both are depth 0)"
            - "state (0,0,0): before any citation Provider.${prov} has open_violation_points 0, resolved_violation_points 0, lifetime_violation_points 0 — invariant holds trivially"
            - "state (15,0,15): after the CRITICAL citation open 15, resolved 0, lifetime 15 — 15 == 15 + 0"
            - "state (23,0,23): after the SERIOUS citation open 23, resolved 0, lifetime 23 — 23 == 23 + 0; critical_open_count == 1 and critical_violation_count_24mo == 1"
            - "at finalize Inspection.${insp_id}.preliminary_compliance_score == 77.00 and final_compliance_score == 77.00 (15.00 + 8.00 deducted), and ${risk_after_cite} == 33.00 with risk_tier \"MODERATE\" (23 points + CRITICAL_FLOOR_BONUS 10)"
            - "state (8,15,23): after VERIFIED_CORRECTED on ${v_crit} open 8, resolved 15, lifetime STILL 23 — the correction MOVED points between the two buckets and conserved the total; critical_open_count drops to 0 while critical_violation_count_24mo stays 1"
            - "${score_after_correct} == 86.00 (15 * 1.000 * 0.400 = 6.00 plus 8.00 = 14.00 deducted) — the ledger move is visible in the FINAL score"
            - "state (0,15,15): after VACATED on ${v_ser} open 0, resolved 15, lifetime 15 — the vacatur REMOVED the 8 points from BOTH sides, so lifetime shrank by exactly 8 and the invariant still holds"
            - "${score_after_vacate} == 94.00 (6.00 + 0.00 deducted, STATUS_FACTOR[VACATED] == 0.000)"
            - "${prelim_live} == 85.00: the live PRELIMINARY variant drops the VACATED row entirely and forces status_factor 1.000 on the survivor (100 - 15.00), while the STORED Inspection.${insp_id}.preliminary_compliance_score is still frozen at 77.00"
            - "${risk_after_vacate} == 10.00 with risk_tier \"LOW\" — 0 points plus the CRITICAL_FLOOR_BONUS, because critical_violation_count_24mo counts CITATIONS and the corrected critical was never vacated"
            - "at no point does lifetime_violation_points exceed the running sum of assessed_points of non-VACATED violations, and no counter is ever negative"

      - name: invariant_capacity_slots_conserved_across_suspension_and_appeal
        grounds:
          - calculations.capacity_slot_conservation
          - calculations.enforcement_fine_amount
          - calculations.provider_risk_assessment
          - state_machines.EnforcementAction.transitions.ISSUED_to_EFFECTIVE
          - state_machines.EnforcementAction.transitions.APPEALED_to_VACATED
          - validations.priority_91_ERR_CAPACITY_SLOT_IMBALANCE
          - entities.Provider.fields.licensed_capacity
          - entities.Provider.fields.suspended_capacity
          - entities.EnforcementAction.fields.capacity_held_slots
