  - rule_id: transitive_cascade
    instances:
      - name: member_disenroll_depth3_cascade
        grounds:
          - state_machines.Member.ACTIVE_to_DISENROLLED
          - state_machines.DietPrescription.ACTIVE_to_REVOKED
          - state_machines.MenuCycle.FROZEN_to_CANCELLED
          - state_machines.Delivery.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 transitive cascade from the disenroll trigger: member
          DISENROLLED mutates the ACTIVE prescription (link 1 -> REVOKED); the
          revocation mutates pinned PLANNED/FROZEN cycles (link 2 -> CANCELLED);
          each cycle cancellation mutates its open deliveries (link 3 ->
          CANCELLED + reserved-unit release). Each link is caused by the
          previous mutation, not by the disenroll directly.
