              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints"
              payload: { project_id: "${proj_id}", room_label: "Living Room", complaint_type: "TOO_COLD", reported_by: "Alice Nguyen" }
              as: ProgramAdmin
              captures: { comp_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/diagnose"
              payload: { diagnosis_code: "DAMPER_MISADJUSTED", tolerance_pct: 10.00 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/airflow-readings"
              payload: { room_label: "Living Room", reading_seq: 1, measured_cfm: 110.0, design_cfm: 100.0, damper_position_pct: 60.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { lr1_dev: $.data.deviation_pct, lr1_within: $.data.within_tolerance }
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/airflow-readings"
              payload: { room_label: "Living Room", reading_seq: 1, measured_cfm: 105.0, design_cfm: 100.0, damper_position_pct: 55.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/airflow-readings"
              payload: { room_label: "Den", reading_seq: 1, measured_cfm: 95.0, design_cfm: 100.0, damper_position_pct: 80.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { den1_dev: $.data.deviation_pct }
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/airflow-readings"
              payload: { room_label: "Living Room", reading_seq: 2, measured_cfm: 92.0, design_cfm: 100.0, damper_position_pct: 45.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { lr2_dev: $.data.deviation_pct }
            - call: "GET /duct-sealing/comfort-complaints/${comp_id}"
              as: ProgramAdmin
              captures: { balanced_rooms: $.data.balanced_room_count, comp_status: $.data.status }
          assert:
            - "Call 1: HTTP 201, ${lr1_dev} == 10.00 and ${lr1_within} == true (|10.00| <= tolerance_pct 10.00)"
            - "Call 2 (Living Room, reading_seq 1 again): HTTP 422 ERR_DUPLICATE_READING_SEQ"
            - "Call 3 (Den, reading_seq 1): HTTP 201 with ${den1_dev} == -5.00 — the same seq is free under a different room_label"
            - "Call 4 (Living Room, reading_seq 2): HTTP 201 with ${lr2_dev} == -8.00"
            - "${balanced_rooms} == 2 — counted over the latest reading per distinct room (Living Room seq 2 and Den seq 1), not over the three rows"
            - "${comp_status} == DIAGNOSED and rebalance_count == 0: readings recorded before the balance call neither resolve nor revert the complaint"
            - "GET /duct-sealing/comfort-complaints/${comp_id}/airflow-readings returns exactly 3 rows; the rejected duplicate wrote nothing"

