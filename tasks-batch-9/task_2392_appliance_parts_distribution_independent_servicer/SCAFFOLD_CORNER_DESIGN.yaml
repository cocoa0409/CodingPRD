      - name: withdrawing_a_pending_substitute_request_backorders_the_line
        claim_type: valid_transition
        grounds:
          - state_machines.SubstituteRequest.transitions.PENDING_to_WITHDRAWN
          - state_machines.OrderLine.transitions.SUBSTITUTE_PENDING_to_BACKORDERED
          - endpoints.POST_/substitute-requests/{id}/withdraw
        distinguishing_aspect: "The servicer form of PENDING -> WITHDRAWN pushes the line to BACKORDERED (not RESOLVED, which is the rollback form) and drops the line out of subtotal_cents, leaving the order's subtotal at 0."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL; NET_30 account; Part P_OBS W10-OLDPUMP MECHANICAL created directly with lifecycle_status OBSOLETE."
            - "A WILL_CALL order whose single line requests P_OBS: chain terminates OBSOLETE, so the line lands SUBSTITUTE_PENDING with a PENDING SubstituteRequest (source CHAIN_TERMINAL_OBSOLETE) and the order's subtotal excludes it."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
