      - name: state_member_pause_and_resume_round_trip_bumps_version_twice
        claim_type: valid_transition
        grounds:
          - "state_machines.Member.transitions.ACTIVE_to_PAUSED"
          - "state_machines.Member.transitions.PAUSED_to_ACTIVE"
          - "endpoints.POST /members/{member_id}/pause"
          - "endpoints.POST /members/{member_id}/resume"
        distinguishing_aspect: >-
          The pause/resume pair is the only reversible edge in the Member machine and both directions declare a
          version increment, so a member created at version 1 must read PAUSED at version 2 and ACTIVE again at
          version 3. An implementation that treats resume as a no-op when the member is already ACTIVE-by-default,
          or that mutates status without touching version, breaks the OCC token that POST
          /reservations/{reservation_id}/swap depends on.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4 exists"
            - "member Nora Ellery on SIG4 is ACTIVE at version 1 with units_out_count 0 and no reservations"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /membership-plans"
              payload: { code: "SIG4", name: "Signature 4", item_slots: 3, monthly_fee_cents: 10000, monthly_swaps_allowed: 2, shipping_cadence_days: 7, waiver_monthly_fee_cents: 1800, waiver_coverage_cents: 10000 }
              as: PlatformAdmin
              captures: { plan_sig4_id: "$.data.id" }
            - call: "POST /members"
              payload: { membership_plan_id: "${plan_sig4_id}", email: "nora@example.com", full_name: "Nora Ellery", waiver_active: false, preferred_categories: ["GOWN", "DRESS"], size_profile: "M" }
              as: PlatformAdmin
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "POST /members/${member_id}/pause"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /members/${member_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "pause: HTTP 200, Member.status == PAUSED, Member.version == 2"
            - "resume: HTTP 200, Member.status == ACTIVE, Member.version == 3"
            - "Member.units_out_count == 0 throughout"
      - name: state_resume_after_cancellation_returns_resource_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Member.terminal_states"
          - "state_machines.Member.transitions.ACTIVE_to_CANCELLED"
          - "validations.priority 16"
          - "errors[ERR_RESOURCE_TERMINAL]"
        distinguishing_aspect: >-
          CANCELLED is the Member machine's only terminal state, so a cancelled membership can never be revived:
          resume must answer ERR_RESOURCE_TERMINAL with HTTP 409 and status must remain CANCELLED. Cancellation
          itself is allowed here only because outstanding_fee_cents is 0, which separates this claim from the
          priority-56 balance guard.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "membership plan SIG4 exists"
            - "member Nora Ellery on SIG4 has outstanding_fee_cents 0 and no reservations, and has been cancelled"
