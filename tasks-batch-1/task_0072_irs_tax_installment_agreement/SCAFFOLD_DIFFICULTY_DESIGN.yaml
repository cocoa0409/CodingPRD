              as: RevenueOfficer
              captures: { agr1: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
              captures: { acct_v1: $.data.version }
            - call: "POST /collections/installment-agreements/${agr1}/approve"
              payload: { expected_tax_account_version: "${acct_v1}" }
              as: RevenueOfficer
            - call: "POST /collections/installment-agreements"
              payload: { tax_account_id: "${acct}", agreement_type: "SHORT_TERM", payment_method: "MANUAL", monthly_payment_cents: 2000000, term_months: 12, active_from: "2025-01-15T00:00:00.000Z", active_to: "2026-01-15T00:00:00.000Z", low_income_flag: false }
              as: RevenueOfficer
              captures: { agr2: $.data.id }
            - call: "GET /collections/tax-accounts/${acct}"
              payload: {}
              as: RevenueOfficer
