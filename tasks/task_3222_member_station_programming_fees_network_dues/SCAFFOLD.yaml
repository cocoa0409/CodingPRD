        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == PROBATION", "station.dues_arrears_cents > 0"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
      - from: SUSPENDED
        to: UNDER_REVIEW
        trigger: "POST /network/member-stations/{id}/reinstate"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == SUSPENDED", "station.dues_arrears_cents == 0"]
        side_effects: ["station.eligibility_status is the only field reset; dues_arrears_cents is preserved", "station.updated_at refreshed and station.version incremented by 1"]
      - from: APPLICANT
        to: WITHDRAWN
        trigger: "POST /network/member-stations/{id}/withdraw"
        actor: StationManager
        preconditions: ["station.eligibility_status == APPLICANT or station.eligibility_status == DEFICIENT"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
      - from: DEFICIENT
        to: WITHDRAWN
        trigger: "POST /network/member-stations/{id}/withdraw"
        actor: StationManager
        preconditions: ["station.eligibility_status == DEFICIENT"]
        side_effects: ["station.updated_at refreshed and station.version incremented by 1"]
      - from: REMEDIATION_SUBMITTED
        to: ELIGIBLE
        trigger: "POST /network/member-stations/{id}/approve-eligibility"
        actor: NetworkComplianceAuditor
        preconditions: ["station.eligibility_status == REMEDIATION_SUBMITTED", "remediation satisfies the deficiency that produced it"]
        side_effects: ["station.membership_class recomputed by membership_class_assignment", "a ProgrammingFeeAssessment is cascaded with assessment_status = INITIAL on the station", "a DuesVoteEligibilityProjection row is upserted with station.dues_vote_eligible = true", "station.updated_at refreshed and station.version incremented by 1"]
  - entity: CarriageAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network/carriage-agreements/{id}/submit"
        actor: StationManager
        preconditions: ["agreement.agreement_status == DRAFT", "agreement carries at least one BroadcastWindow"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /network/carriage-agreements/{id}/review"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == SUBMITTED"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: UNDER_REVIEW
        to: CLEARED
        trigger: "POST /network/carriage-agreements/{id}/clear"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == UNDER_REVIEW", "every BroadcastWindow whose window.parent_agreement_id == agreement.id has is_cleared == true"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: CLEARED
        to: CARRIED
        trigger: "POST /network/carriage-agreements/{id}/publish"
        actor: NetworkScheduler
        preconditions: ["agreement.agreement_status == CLEARED", "every BroadcastWindow under the agreement has is_cleared == true"]
        side_effects: ["agreement.published_at = clock.now()", "every BroadcastWindow under the agreement moves CLEARED to SCHEDULED", "NationalProgram with program_code == agreement.program_code increments publication_cycle by 1", "for each distinct station carrying a window under the agreement, MemberStation.dues_arrears_cents += programming_fee_final_adjusted(schedule, station) - drive_dues_deduction(station drive for this fiscal year)", "agreement.updated_at refreshed and agreement.version incremented by 1"]
        note: "Origin of the C2 cascade and of the F4 publication-cycle hop"
      - from: CARRIED
        to: CLEARED
        trigger: "POST /network/carriage-agreements/{id}/republish"
        actor: NetworkScheduler
        preconditions: ["agreement.agreement_status == CARRIED"]
        side_effects: ["agreement.published_at = null", "every BroadcastWindow under the agreement moves SCHEDULED to CLEARED", "NationalProgram with program_code == agreement.program_code increments publication_cycle by 1 again"]
      - from: CARRIED
        to: EMBARGOED
        trigger: "POST /network/national-programs/{id}/premiere-embargo"
        actor: NetworkComplianceAuditor
        preconditions: ["program.production_status == RUNNING", "program.national_premiere_at > clock.now()", "the agreement carries program.program_code"]
        side_effects: ["every BroadcastWindow under the agreement whose window_start < program.national_premiere_at becomes clearance_status = VIOLATED with rejection_reason = PREMIERE_EMBARGO"]
      - from: EMBARGOED
        to: CARRIED
        trigger: "POST /network/carriage-agreements/{id}/lift-publish-embargo"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == EMBARGOED", "clock.now() > program.national_premiere_at"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: CARRIED
        to: EXPIRED
        trigger: "POST /network/carriage-agreements/{id}/expire"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == CARRIED", "clock.now() > agreement.clearance_deadline"]
        side_effects: ["every BroadcastWindow under the agreement in status SCHEDULED moves to MISSED"]
      - from: CLEARED
        to: TERMINATED
        trigger: "POST /network/carriage-agreements/{id}/terminate"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == CLEARED or agreement.agreement_status == CARRIED", "termination_reason is non-empty"]
        side_effects: ["every BroadcastWindow under the agreement in status DRAFT, PENDING_CLEARANCE or CLEARED moves to REJECTED", "every UplinkSlot linked to those windows in status RESERVED or SCHEDULED moves to RELEASED, releasing feed capacity"]
      - from: CARRIED
        to: TERMINATED
        trigger: "POST /network/national-programs/{id}/retire"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == PUBLISHED", "the agreement carries program.program_code"]
        side_effects: ["every BroadcastWindow under the agreement becomes REJECTED", "agreement.updated_at refreshed and agreement.version incremented by 1"]
        note: "Third hop of the F4 program-retirement cascade"
  - entity: BroadcastWindow
    initial_state: DRAFT
    terminal_states: [BROADCAST, MISSED, VIOLATED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: PENDING_CLEARANCE
        trigger: "POST /network/broadcast-windows/{id}/request-clearance"
        actor: StationManager
        preconditions: ["window.clearance_status == DRAFT", "window.window_start < window.window_end", "window.embargo_until is null or window.window_start >= window.embargo_until"]
        side_effects: ["window.updated_at refreshed and window.version incremented by 1"]
      - from: PENDING_CLEARANCE
        to: CLEARED
        trigger: "POST /network/broadcast-windows/{id}/clear"
        actor: NetworkComplianceAuditor
        preconditions: ["window.clearance_status == PENDING_CLEARANCE", "window.embargo_until is null or clock.now() >= window.embargo_until", "window.window_start >= clock.now()"]
        side_effects: ["window.is_cleared recomputed to true", "window.updated_at refreshed and window.version incremented by 1"]
      - from: PENDING_CLEARANCE
        to: REJECTED
        trigger: "POST /network/broadcast-windows/{id}/reject"
        actor: NetworkComplianceAuditor
        preconditions: ["window.clearance_status == PENDING_CLEARANCE", "rejection_reason is non-empty"]
        side_effects: ["window.carriage_exception_liability_cents recomputed by exception_liability_accrual", "the parent agreement's exception liability rollup recomputed by carriage_clearance_ratio", "window.updated_at refreshed and window.version incremented by 1"]
        note: "First hop of the C4 cascade"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /network/carriage-agreements/{id}/terminate"
        actor: NetworkComplianceAuditor
        preconditions: ["the window's parent agreement moves CLEARED or CARRIED to TERMINATED"]
        side_effects: ["window.carriage_exception_liability_cents recomputed by exception_liability_accrual", "window.updated_at refreshed and window.version incremented by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /network/broadcast-windows/{id}/remediating"
        actor: StationManager
        preconditions: ["window.clearance_status == REJECTED", "the window's parent agreement is not TERMINATED"]
        side_effects: ["window.rejection_reason = null", "window.updated_at refreshed and window.version incremented by 1"]
        note: "Revert edge: closes the cyclic window clearance loop"
      - from: CLEARED
        to: SCHEDULED
        trigger: "POST /network/carriage-agreements/{id}/publish"
        actor: NetworkScheduler
        preconditions: ["the window's parent agreement moves CLEARED to CARRIED", "window.is_cleared == true", "an UplinkSlot reservation exists for this window with slot_status in {RESERVED, SCHEDULED, AIRED}"]
        side_effects: ["window.updated_at refreshed and window.version incremented by 1"]
      - from: SCHEDULED
        to: CLEARED
        trigger: "POST /network/carriage-agreements/{id}/republish"
        actor: NetworkScheduler
        preconditions: ["the window's parent agreement moves CARRIED to CLEARED"]
        side_effects: ["window.updated_at refreshed and window.version incremented by 1"]
      - from: CLEARED
        to: VIOLATED
        trigger: "POST /network/series/embargo-check"
        actor: NetworkComplianceAuditor
        preconditions: ["window.clearance_status == CLEARED", "NationalProgram.national_premiere_at > clock.now()", "window.window_start < NationalProgram.national_premiere_at"]
        side_effects: ["window.rejection_reason = PREMIERE_EMBARGO", "window.carriage_exception_liability_cents recomputed with the VIOLATED_COVERAGE_BREACH basis", "the parent agreement's exception liability rollup recomputed by carriage_clearance_ratio and capped at exception_liability_cap_cents"]
      - from: SCHEDULED
        to: BROADCAST
        trigger: "POST /network/uplink-slots/{id}/air"
        actor: NetworkScheduler
        preconditions: ["window.clearance_status == SCHEDULED", "clock.now() >= window.window_start", "clock.now() < window.window_end", "the reserving UplinkSlot's DistributionFeed.feed_status == ONLINE"]
        side_effects: ["window.updated_at refreshed and window.version incremented by 1"]
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /network/broadcast-windows/{id}/expire"
        actor: NetworkComplianceAuditor
        preconditions: ["window.clearance_status == SCHEDULED", "clock.now() >= window.window_end"]
        side_effects: ["window.carriage_exception_liability_cents recomputed with the MISSED_SLOT basis", "the parent agreement's exception liability rollup recomputed by carriage_clearance_ratio"]
  - entity: DistributionFeed
    initial_state: PLANNED
    terminal_states: [SUSPENDED]
    shape: linear
    transitions:
      - from: PLANNED
        to: ONLINE
        trigger: "POST /network/distribution-feeds/{id}/bring-online"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == PLANNED", "feed.total_capacity_units >= 1"]
        side_effects: ["feed.crowded recomputed from reserved_capacity_units / total_capacity_units"]
      - from: ONLINE
        to: CROWDED
        trigger: "POST /network/uplink-slots or POST /network/uplink-slots/block"
        actor: StationManager
        preconditions: ["feed.feed_status == ONLINE", "feed.reserved_capacity_units + requested_units <= feed.total_capacity_units", "the computed ratio would be >= max_reserved_capacity_ratio"]
        side_effects: ["feed.reserved_capacity_units += requested capacity units", "feed.crowded recomputed to true", "every UplinkSlot on this feed with slot_status IN {RESERVED, SCHEDULED} and priority_rank > preemptible_priority_rank_floor is moved to PREEMPTED", "every BroadcastWindow named by a preempted slot's window_id moves SCHEDULED to CLEARED, so the preemption propagates one hop past the slot itself"]
        note: "Origin of the C3 cascade: congestion preemption releases the preempted slot and then its window"
      - from: CROWDED
        to: ONLINE
        trigger: "POST /network/uplink-slots/{id}/release"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == CROWDED", "the released slot brings the ratio below max_reserved_capacity_ratio"]
        side_effects: ["feed.reserved_capacity_units -= released units", "feed.crowded recomputed to false"]
      - from: ONLINE
        to: MAINTENANCE
        trigger: "POST /network/distribution-feeds/{id}/maintenance"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == ONLINE or feed.feed_status == CROWDED", "clock.now() >= maintenance_start", "clock.now() < maintenance_end"]
        side_effects: ["every UplinkSlot on this feed in status RESERVED or SCHEDULED moves to CANCELLED"]
      - from: CROWDED
        to: MAINTENANCE
        trigger: "POST /network/distribution-feeds/{id}/maintenance"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == CROWDED", "clock.now() >= maintenance_start"]
        side_effects: ["every UplinkSlot on this feed in status RESERVED or SCHEDULED moves to CANCELLED"]
      - from: MAINTENANCE
        to: ONLINE
        trigger: "POST /network/distribution-feeds/{id}/restore"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == MAINTENANCE", "clock.now() >= maintenance_end"]
        side_effects: ["feed.updated_at refreshed and feed.version incremented by 1"]
      - from: ONLINE
        to: OFFLINE
        trigger: "POST /network/distribution-feeds/{id}/take-offline"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == ONLINE or feed.feed_status == CROWDED", "feed.reserved_capacity_units == 0"]
        side_effects: ["feed.updated_at refreshed and feed.version incremented by 1"]
      - from: OFFLINE
        to: PLANNED
        trigger: "POST /network/distribution-feeds/{id}/replan"
        actor: NetworkScheduler
        preconditions: ["feed.feed_status == OFFLINE"]
        side_effects: ["feed.reserved_capacity_units = 0", "feed.crowded recomputed to false"]
        note: "Revert edge of the feed lifecycle: an offline feed returns to PLANNED and may be brought online again"
      - from: ONLINE
        to: SUSPENDED
        trigger: "POST /network/distribution-feeds/{id}/suspend"
        actor: PlatformAdmin
        preconditions: ["feed.feed_status == ONLINE", "suspension_reason is non-empty"]
        side_effects: ["every UplinkSlot on this feed in status RESERVED or SCHEDULED moves to CANCELLED"]
  - entity: UplinkSlot
    initial_state: RESERVED
    terminal_states: [CANCELLED, RELEASED, AIRED]
    shape: linear
    transitions:
      - from: RESERVED
        to: SCHEDULED
        trigger: "POST /network/broadcast-windows/{id}/clear"
        actor: NetworkComplianceAuditor
        preconditions: ["slot.slot_status == RESERVED", "the slot's window clears in the same request"]
        side_effects: ["slot.updated_at refreshed and slot.version incremented by 1"]
      - from: RESERVED
        to: PREEMPTED
        trigger: "POST /network/uplink-slots or POST /network/uplink-slots/block"
        actor: StationManager
        preconditions: ["slot.slot_status == RESERVED", "slot.priority_rank > preemptible_priority_rank_floor", "the feed becomes CROWDED in the same request"]
        side_effects: ["the slot's window moves SCHEDULED to CLEARED when the window was SCHEDULED", "the feed's reserved_capacity_units is decremented by the preempted units"]
      - from: SCHEDULED
        to: PREEMPTED
        trigger: "POST /network/uplink-slots or POST /network/uplink-slots/block"
        actor: StationManager
        preconditions: ["slot.slot_status == SCHEDULED", "slot.priority_rank > preemptible_priority_rank_floor", "the feed becomes CROWDED in the same request"]
        side_effects: ["the slot's window moves SCHEDULED to CLEARED", "the feed's reserved_capacity_units is decremented by the preempted units"]
      - from: PREEMPTED
        to: RESERVED
        trigger: "POST /network/uplink-slots/{id}/preemption-review"
        actor: NetworkScheduler
        preconditions: ["slot.slot_status == PREEMPTED", "the feed's feed_status == ONLINE and reserved_capacity_units + slot units <= total_capacity_units"]
        side_effects: ["slot.updated_at refreshed and slot.version incremented by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /network/distribution-feeds/{id}/maintenance"
        actor: NetworkScheduler
        preconditions: ["the slot's feed moves to MAINTENANCE in the same request"]
        side_effects: ["the slot's window moves SCHEDULED to CLEARED"]
      - from: SCHEDULED
        to: AIRED
        trigger: "POST /network/uplink-slots/{id}/air"
        actor: NetworkScheduler
        preconditions: ["slot.slot_status == SCHEDULED", "clock.now() >= slot.slot_start", "clock.now() < slot.slot_end", "the slot's window is in clearance_status == SCHEDULED"]
        side_effects: ["slot.updated_at refreshed and slot.version incremented by 1"]
      - from: RESERVED
        to: RELEASED
        trigger: "POST /network/uplink-slots/{id}/release"
        actor: NetworkScheduler
        preconditions: ["slot.slot_status == RESERVED or slot.slot_status == PREEMPTED"]
        side_effects: ["feed.reserved_capacity_units decremented", "feed.crowded recomputed"]
  - entity: UnderwritingAgreement
    initial_state: SUBMITTED
    terminal_states: [AIRING_COMPLETE, REJECTED, NO_AIRED]
    shape: parallel
    state_dimensions:
      - name: agreement_status
        values: [SUBMITTED, COMPLIANCE_REVIEW, APPROVED, SCHEDULED, AIRING, AIRING_COMPLETE, REJECTED, NO_AIRED]
      - name: airplay_status
        values: [NOT_SCHEDULED, SLOTTED, PARTIALLY_AIRED, FULLY_AIRED, AIRING_BLOCKED]
    transitions:
      - from: SUBMITTED
        to: COMPLIANCE_REVIEW
        trigger: "POST /network/underwriting-agreements/{id}/submit-for-review"
        actor: UnderwritingCoordinator
        preconditions: ["agreement.agreement_status == SUBMITTED", "agreement.consideration_cents > 0"]
        side_effects: ["agreement.disclosure_test_passed recomputed by underwriting_acknowledgment_check", "agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: COMPLIANCE_REVIEW
        to: APPROVED
        trigger: "POST /network/underwriting-agreements/{id}/approve"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == COMPLIANCE_REVIEW", "agreement.disclosure_test_passed == true", "the airplay_status dimension is NOT_SCHEDULED"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: COMPLIANCE_REVIEW
        to: REJECTED
        trigger: "POST /network/underwriting-agreements/{id}/reject"
        actor: NetworkComplianceAuditor
        preconditions: ["agreement.agreement_status == COMPLIANCE_REVIEW", "agreement.disclosure_test_passed == false"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /network/underwriting-agreements/{id}/schedule"
        actor: UnderwritingCoordinator
        preconditions: ["agreement.agreement_status == APPROVED", "the airplay_status dimension is NOT_SCHEDULED"]
        side_effects: ["airplay_status dimension moves NOT_SCHEDULED to SLOTTED"]
      - from: SCHEDULED
        to: AIRING
        trigger: "POST /network/underwriting-agreements/{id}/air-segment"
        actor: UnderwritingCoordinator
        preconditions: ["agreement.agreement_status == SCHEDULED", "agreement.aired_segment_count < agreement.compliance_segment_count"]
        side_effects: ["agreement.aired_segment_count += 1", "airplay_status dimension moves SLOTTED to PARTIALLY_AIRED when aired_segment_count < compliance_segment_count, else to FULLY_AIRED"]
      - from: AIRING
        to: AIRING_COMPLETE
        trigger: "system: agreement.aired_segment_count == agreement.compliance_segment_count"
        actor: system
        preconditions: ["agreement.agreement_status == AIRING", "agreement.aired_segment_count == agreement.compliance_segment_count"]
        side_effects: ["agreement.updated_at refreshed and agreement.version incremented by 1"]
      - from: AIRING
        to: NO_AIRED
        trigger: "system: agreement.aired_segment_count == 0 at period close"
        actor: system
        preconditions: ["agreement.agreement_status == AIRING", "agreement.aired_segment_count == 0", "the posting period has closed"]
        side_effects: ["agreement.airplay_status dimension moves to AIRING_BLOCKED", "station.dues_arrears_cents unchanged because the NO_AIRED branch never applies the credit"]
      - from: AIRING
        to: AIRING
        trigger: "POST /network/underwriting-agreements/{id}/air-segment"
        actor: UnderwritingCoordinator
        preconditions: ["agreement.agreement_status == AIRING", "agreement.aired_segment_count > 0", "agreement.aired_segment_count < agreement.compliance_segment_count"]
        side_effects: ["agreement.aired_segment_count += 1"]
        note: "Cyclic self-loop: the agreement stays in AIRING across segments until full airplay; the airplay dimension advances PARTIALLY_AIRED to FULLY_AIRED on the final segment"
  - entity: NationalProgram
    initial_state: DEVELOPMENT
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: DEVELOPMENT
        to: PRODUCTION
        trigger: "POST /network/national-programs/{id}/move-to-production"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == DEVELOPMENT", "program.program_title is non-empty"]
        side_effects: ["program.updated_at refreshed and program.version incremented by 1"]
      - from: PRODUCTION
        to: SCHEDULED
        trigger: "POST /network/national-programs/{id}/schedule"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == PRODUCTION", "program.national_premiere_at > clock.now()"]
        side_effects: ["program.updated_at refreshed and program.version incremented by 1"]
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /network/national-programs/{id}/premiere"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == SCHEDULED", "clock.now() >= program.national_premiere_at", "if program.clearance_required then every BroadcastWindow under every agreement carrying program.program_code has is_cleared == true"]
        side_effects: ["program.updated_at refreshed and program.version incremented by 1"]
      - from: RUNNING
        to: PUBLISHED
        trigger: "POST /network/national-programs/{id}/publish"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == RUNNING", "program.licensed_contribution_count >= 1"]
        side_effects: ["program.publication_cycle += 1", "program.updated_at refreshed and program.version incremented by 1"]
      - from: PUBLISHED
        to: RESCHEDULED
        trigger: "POST /network/national-programs/{id}/reschedule-airings"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == PUBLISHED", "new_premiere_at > clock.now()"]
        side_effects: ["program.national_premiere_at = new_premiere_at", "program.publication_cycle += 1"]
      - from: PUBLISHED
        to: RESCHEDULED
        trigger: "POST /network/national-programs/{id}/return-to-development"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == PUBLISHED"]
        side_effects: ["program.publication_cycle += 1", "every ContentContribution with contribution_status == LICENSED under this program moves to WITHDRAWN"]
        note: "Second hop of the F4 cascade"
      - from: RESCHEDULED
        to: PRODUCTION
        trigger: "POST /network/national-programs/{id}/move-to-production"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == RESCHEDULED"]
        side_effects: ["program.updated_at refreshed and program.version incremented by 1"]
        note: "Revert edge: closes the cyclic program lifecycle"
      - from: RESCHEDULED
        to: RETIRED
        trigger: "POST /network/national-programs/{id}/retire"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == RESCHEDULED or program.production_status == PUBLISHED"]
        side_effects: ["every ContentContribution under this program in status LICENSED, USED, DRAFT or SUBMITTED moves to REJECTED", "program.licensed_contribution_count -= number of LICENSED contributions that left LICENSED", "every CarriageAgreement with agreement.program_code == program.program_code moves CARRIED to TERMINATED", "program.preliminary_license_credit_cents += sum over the contributions of content_compensation_credit", "program.updated_at refreshed and program.version incremented by 1"]
        note: "Third hop of the F4 cascade; the bumped credit mass is what archive_credit_ledger_invariant must return to zero"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /network/national-programs/{id}/retire"
        actor: NationalProgramEditor
        preconditions: ["program.production_status == PUBLISHED"]
        side_effects: ["every ContentContribution under this program in status LICENSED, USED, DRAFT or SUBMITTED moves to REJECTED", "program.licensed_contribution_count -= number of LICENSED contributions that left LICENSED", "every CarriageAgreement with agreement.program_code == program.program_code moves CARRIED to TERMINATED", "program.updated_at refreshed and program.version incremented by 1"]
  - entity: ContentContribution
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, REJECTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network/content-contributions/{id}/submit"
        actor: StationManager
        preconditions: ["contribution.contribution_status == DRAFT", "contribution.duration_seconds >= 1"]
        side_effects: ["contribution.last_request_at = null", "contribution.compensation_credit_cents recomputed by content_compensation_credit"]
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /network/content-contributions/{id}/shortlist"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == SUBMITTED", "the contributing station's eligibility_status IN {ELIGIBLE, PROBATION}"]
        side_effects: ["contribution.updated_at refreshed and contribution.version incremented by 1"]
      - from: SHORTLISTED
        to: DRAFT
        trigger: "POST /network/content-contributions/{id}/request-resubmission"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == SHORTLISTED"]
        side_effects: ["contribution.last_request_at = clock.now()", "contribution.compensation_credit_cents recomputed by content_compensation_credit", "contribution.updated_at refreshed and contribution.version incremented by 1"]
        note: "Revert edge: closes the local-report revision loop; the F6 tie-break resolves candidates where last_request_at collides"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /network/content-contributions/{id}/submit"
        actor: StationManager
        preconditions: ["contribution.contribution_status == DRAFT", "contribution.last_request_at is not null or the contribution has never been shortlisted"]
        side_effects: ["contribution.revision_count += 1", "contribution.updated_at refreshed and contribution.version incremented by 1"]
        note: "Revision round closes the cycle back to SUBMITTED"
      - from: SHORTLISTED
        to: LICENSED
        trigger: "POST /network/content-contributions/{id}/license"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == SHORTLISTED", "the contributing station's eligibility_status != SUSPENDED and != WITHDRAWN"]
        side_effects: ["contribution.compensation_credit_cents recomputed by content_compensation_credit", "NationalProgram.licensed_contribution_count += 1 for the program named by contribution.program_id", "the contributing station's contribution_credit_cents += contribution.compensation_credit_cents", "the station exchanges the credit into arrears relief through POST /network/member-stations/{id}/apply-contribution-credit"]
      - from: LICENSED
        to: USED
        trigger: "POST /network/content-contributions/{id}/mark-used"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == LICENSED"]
        side_effects: ["contribution.compensation_credit_cents recomputed by content_compensation_credit"]
      - from: USED
        to: WITHDRAWN
        trigger: "POST /network/national-programs/{id}/return-to-development"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == USED", "the program named by contribution.program_id moves PUBLISHED to RESCHEDULED"]
        side_effects: ["NationalProgram.licensed_contribution_count -= 1 for that program"]
        note: "Second hop of the F4 cascade for a piece that had already aired"
      - from: LICENSED
        to: WITHDRAWN
        trigger: "POST /network/national-programs/{id}/return-to-development"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == LICENSED", "the program named by contribution.program_id moves PUBLISHED to RESCHEDULED"]
        side_effects: ["NationalProgram.licensed_contribution_count -= 1 for that program"]
        note: "Second hop of the F4 cascade"
      - from: SHORTLISTED
        to: REJECTED
        trigger: "POST /network/content-contributions/{id}/reject"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == SUBMITTED or contribution.contribution_status == SHORTLISTED", "rejection_reason is non-empty"]
        side_effects: ["contribution.updated_at refreshed and contribution.version incremented by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /network/content-contributions/{id}/reject"
        actor: NationalProgramEditor
        preconditions: ["contribution.contribution_status == SUBMITTED", "rejection_reason is non-empty"]
        side_effects: ["contribution.updated_at refreshed and contribution.version incremented by 1"]
  - entity: MembershipDrive
    initial_state: PLANNED
    terminal_states: [SETTLED, CANCELLED]
    shape: linear
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /network/membership-drives/{id}/open"
        actor: StationManager
        preconditions: ["drive.drive_status == PLANNED", "the station's eligibility_status IN {ELIGIBLE, PROBATION}", "drive carries at least one AudienceReport for the current fiscal year"]
        side_effects: ["drive.pledged_cents = 0", "drive.collected_cents = 0", "drive.updated_at refreshed and drive.version incremented by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /network/membership-drives/{id}/pledge"
        actor: StationManager
        preconditions: ["drive.drive_status == ACTIVE", "pledge_cents > 0"]
        side_effects: ["drive.pledged_cents += pledge_cents", "drive.collection_ratio_bps recomputed as collected_cents relative to the recomputed pledged_cents", "drive.updated_at refreshed and drive.version incremented by 1"]
        note: "Cyclic self-loop: pledges accrue during the active drive and each one re-derives the collection ratio and the dues deduction"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /network/membership-drives/{id}/close"
        actor: StationManager
        preconditions: ["drive.drive_status == ACTIVE", "clock.now() >= drive_close_at"]
        side_effects: ["drive.updated_at refreshed and drive.version incremented by 1"]
      - from: CLOSED
        to: REPORTED
        trigger: "POST /network/membership-drives/{id}/report"
        actor: StationManager
        preconditions: ["drive.drive_status == CLOSED"]
        side_effects: ["drive.drive_deduction_cents recomputed by drive_dues_deduction", "drive.updated_at refreshed and drive.version incremented by 1"]
      - from: REPORTED
        to: SETTLED
        trigger: "POST /network/membership-drives/{id}/settle"
        actor: NetworkComplianceAuditor
        preconditions: ["drive.drive_status == REPORTED", "drive.collection_ratio_bps >= 6000"]
        side_effects: ["MemberStation.dues_arrears_cents += ProgrammingFeeSchedule.base_fee_cents for the drive's fiscal year", "drive.updated_at refreshed and drive.version incremented by 1"]
        note: "First hop of the C5 cascade; the base-fee term is the one that settles on closure"
      - from: REPORTED
        to: CANCELLED
        trigger: "POST /network/membership-drives/{id}/cancel"
        actor: NetworkComplianceAuditor
        preconditions: ["drive.drive_status == REPORTED or drive.drive_status == PLANNED"]
        side_effects: ["drive.drive_deduction_cents = 0"]
  - entity: BoardElection
    initial_state: OPEN
    terminal_states: [FINALIZED]
    shape: cyclic
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /network/board-elections/{id}/close"
        actor: NetworkGovernanceOfficer
        preconditions: ["election.election_status == OPEN", "clock.now() >= election.certification_deadline"]
        side_effects: ["election.updated_at refreshed and election.version incremented by 1"]
      - from: CLOSED
        to: CERTIFIED
        trigger: "POST /network/board-elections/{id}/certify"
        actor: NetworkGovernanceOfficer
        preconditions: ["election.election_status == CLOSED", "the election has at least one candidacy in status QUALIFIED", "every QUALIFIED candidacy has last_candidacy_cycle <= clock.now()"]
        side_effects: ["election.cycle_number += 1", "the QUALIFIED candidacy with the highest votes_recorded moves to ELECTED and every other QUALIFIED candidacy moves to DEFEATED", "each ELECTED candidacy's BoardSeat moves VACANT to FILLED with station_id and term_start = clock.now(), which itself causes the seat-holding MemberStation to have dues_arrears_cents set to 0, which in turn recomputes that station's DuesVoteEligibilityProjection row"]
        note: "Origin of the C6 cascade and of the F7 rankings"
      - from: CERTIFIED
        to: CONTESTED
        trigger: "POST /network/board-elections/{id}/contest"
        actor: NetworkGovernanceOfficer
        preconditions: ["election.election_status == CERTIFIED", "contest_reason is non-empty"]
        side_effects: ["the ELECTED candidacy moves back to QUALIFIED", "the matching BoardSeat moves FILLED to CONTESTED"]
      - from: CONTESTED
        to: REOPENED
        trigger: "POST /network/board-elections/{id}/reopen"
        actor: NetworkGovernanceOfficer
        preconditions: ["election.election_status == CONTESTED"]
        side_effects: ["every candidate's votes_recorded = 0", "the BoardSeat in CONTESTED moves back to VACANT"]
      - from: REOPENED
        to: OPEN
        trigger: "POST /network/board-elections/{id}/close"
        actor: NetworkGovernanceOfficer
        preconditions: ["election.election_status == REOPENED", "clock.now() < certification_deadline"]
        side_effects: ["election.updated_at refreshed and election.version incremented by 1"]
        note: "Revert edge: closes the cyclic election lifecycle"
      - from: CERTIFIED
        to: FINALIZED
        trigger: "POST /network/board-elections/{id}/finalize"
        actor: NetworkGovernanceOfficer
        preconditions: ["election.election_status == CERTIFIED", "the certification deadline has passed without a contest"]
        side_effects: ["every BoardSeat created by this election is retained with seat_status == FILLED", "election.updated_at refreshed and election.version incremented by 1"]
  - entity: BoardCandidate
    initial_state: FILED
    terminal_states: [ELECTED, DEFEATED, LAPSED, WITHDRAWN]
    shape: cyclic
    transitions:
      - from: FILED
        to: QUALIFIED
        trigger: "POST /network/board-candidates/{id}/qualify"
        actor: NetworkGovernanceOfficer
        preconditions: ["candidate.candidate_status == FILED", "the station named by candidate.station_id has eligible_from <= clock.now()"]
        side_effects: ["candidate.last_candidacy_cycle = clock.now()", "candidate.updated_at refreshed and candidate.version incremented by 1"]
      - from: FILED
        to: LAPSED
        trigger: "POST /network/board-candidates/{id}/lapse"
        actor: NetworkGovernanceOfficer
        preconditions: ["candidate.candidate_status == FILED", "the station named by candidate.station_id has dues_vote_eligible == false"]
        side_effects: ["candidate.updated_at refreshed and candidate.version incremented by 1"]
      - from: ELECTED
        to: QUALIFIED
        trigger: "POST /network/board-elections/{id}/contest"
        actor: NetworkGovernanceOfficer
        preconditions: ["the election moves CERTIFIED to CONTESTED"]
        side_effects: ["candidate.votes_recorded = 0", "candidate.last_candidacy_cycle = clock.now()"]
        note: "Revert edge: closes the cyclic candidacy lifecycle"
      - from: QUALIFIED
        to: LAPSED
        trigger: "POST /network/board-elections/{id}/close"
        actor: NetworkGovernanceOfficer
        preconditions: ["the station named by candidate.station_id lost vote eligibility before closure"]
        side_effects: ["candidate.updated_at refreshed and candidate.version incremented by 1"]
      - from: QUALIFIED
        to: WITHDRAWN
        trigger: "POST /network/board-candidates/{id}/withdraw"
        actor: StationManager
        preconditions: ["candidate.candidate_status IN {FILED, QUALIFIED}", "the acting StationManager owns the station named by candidate.station_id"]
        side_effects: ["candidate.updated_at refreshed and candidate.version incremented by 1"]
      - from: QUALIFIED
        to: ELECTED
        trigger: "POST /network/board-elections/{id}/certify"
        actor: NetworkGovernanceOfficer
        preconditions: ["candidate.candidate_status == QUALIFIED", "candidate has the lowest board_rank among QUALIFIED candidacies when sorted by votes_recorded DESC", "votes_recorded >= 1"]
        side_effects: ["candidate.updated_at refreshed and candidate.version incremented by 1"]
  - entity: BoardSeat
    initial_state: VACANT
    terminal_states: [RECALLED]
    shape: cyclic
    transitions:
      - from: VACANT
        to: FILLED
        trigger: "POST /network/board-elections/{id}/certify"
        actor: NetworkGovernanceOfficer
        preconditions: ["the election moves CLOSED to CERTIFIED", "seat.seats_available slot is assigned to the elected candidate's station"]
        side_effects: ["seat.station_id = elected candidate's station_id", "seat.term_start = clock.now()", "seat.term_end = awarded_term_end", "seat.updated_at refreshed and seat.version incremented by 1"]
      - from: FILLED
        to: CONTESTED
        trigger: "POST /network/board-elections/{id}/contest"
        actor: NetworkGovernanceOfficer
        preconditions: ["the election moves CERTIFIED to CONTESTED", "seat.station_id == the station of the un-certified elected candidate"]
        side_effects: ["seat.updated_at refreshed and seat.version incremented by 1"]
      - from: CONTESTED
        to: VACANT
        trigger: "POST /network/board-elections/{id}/reopen"
        actor: NetworkGovernanceOfficer
        preconditions: ["the election moves CONTESTED to REOPENED"]
        side_effects: ["seat.station_id = null", "seat.term_start = null"]
      - from: CONTESTED
        to: HOLDOVER
        trigger: "POST /network/board-elections/{id}/hold-over"
        actor: NetworkGovernanceOfficer
        preconditions: ["seat.seat_status == CONTESTED", "clock.now() < seat.term_end"]
        side_effects: ["seat.updated_at refreshed and seat.version incremented by 1"]
      - from: HOLDOVER
        to: VACANT
        trigger: "POST /network/board-elections/{id}/vacate-seat"
        actor: NetworkGovernanceOfficer
        preconditions: ["seat.seat_status == HOLDOVER", "clock.now() > seat.term_end"]
        side_effects: ["seat.station_id = null"]
      - from: FILLED
        to: VACANT
        trigger: "POST /network/board-seats/{id}/deallocate"
        actor: NetworkGovernanceOfficer
        preconditions: ["seat.seat_status == FILLED", "deallocation_of_seat_id equals this seat's id"]
        side_effects: ["seat.station_id = null", "seat.term_start = null", "seat.carried_credit_cents = 0"]
        note: "Compensating action of the F7 board-seat allocation invariant"
      - from: FILLED
        to: RECALLED
        trigger: "POST /network/board-seats/{id}/recall"
        actor: NetworkGovernanceOfficer
        preconditions: ["seat.seat_status == FILLED", "recall_resolution_ref is non-empty"]
        side_effects: ["seat.station_id = null"]
  - entity: DuesStructureProposal
    initial_state: DRAFT
    terminal_states: [ENACTMENT_CLOSED, REJECTED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /network/dues-proposals/{id}/open"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == DRAFT", "proposal.quorum_required_votes <= eligible_station_count for the proposal's fiscal year", "proposal.proposed_revenue_rate_bps >= 0"]
        side_effects: ["proposal.eligible_station_count = count of MemberStations whose DuesVoteEligibilityProjection row has station.dues_vote_eligible == true and station.eligible_from <= clock.now()", "proposal.current_rate_bps = the network-wide prevailing rate at open time", "proposal.yes_votes = 0", "proposal.no_votes = 0", "proposal.votes_cast_count = 0"]
      - from: OPEN
        to: PASSED
        trigger: "POST /network/dues-proposals/{id}/tally"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == OPEN", "proposal.votes_cast_count >= proposal.quorum_required_votes", "proposal.yes_votes > proposal.no_votes"]
        side_effects: ["proposal.updated_at refreshed and proposal.version incremented by 1"]
      - from: OPEN
        to: REJECTED
        trigger: "POST /network/dues-proposals/{id}/tally"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == OPEN", "proposal.votes_cast_count >= proposal.quorum_required_votes", "proposal.yes_votes <= proposal.no_votes"]
        side_effects: ["proposal.updated_at refreshed and proposal.version incremented by 1"]
      - from: OPEN
        to: TABLED
        trigger: "POST /network/dues-proposals/{id}/table"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == OPEN", "proposal.votes_cast_count < proposal.quorum_required_votes"]
        side_effects: ["proposal.updated_at refreshed and proposal.version incremented by 1"]
      - from: TABLED
        to: OPEN
        trigger: "POST /network/dues-proposals/{id}/open"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == TABLED", "quorum_required_votes <= the current eligible_station_count"]
        side_effects: ["proposal.cycle re-entry preserves prior votes_cast_count"]
        note: "Revert edge: a tabled proposal reopens the same round"
      - from: PASSED
        to: ENACTED
        trigger: "POST /network/dues-proposals/{id}/enact"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == PASSED", "clock.now() >= proposal.effective_from"]
        side_effects: ["every ProgrammingFeeSchedule whose effective_from <= proposal.effective_from <= effective_to has base_fee_cents set to proposal.proposed_base_fee_cents and revenue_rate_bps set to proposal.proposed_revenue_rate_bps", "proposal.proposal_cycle += 1", "proposal.updated_at refreshed and proposal.version incremented by 1"]
      - from: ENACTED
        to: ENACTMENT_CLOSED
        trigger: "POST /network/dues-proposals/{id}/close-enactment"
        actor: NetworkGovernanceOfficer
        preconditions: ["proposal.proposal_status == ENACTED", "clock.now() >= proposal.effective_from"]
        side_effects: ["proposal.updated_at refreshed and proposal.version incremented by 1"]
  - entity: StationVote
    initial_state: RECORDED
    terminal_states: [INVALIDATED]
    shape: cyclic
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "POST /network/station-votes/{id}/supersede"
        actor: StationManager
        preconditions: ["vote.vote_status == RECORDED", "the proposal named by vote.parent_proposal_id is in OPEN", "the acting StationManager owns the station named by vote.station_id"]
        side_effects: ["vote.recorded_weight recomputed to 0 by slate_weighted_vote_scoring", "a replacement StationVote row is created in RECORDED with the new choice", "the proposal's yes_votes, no_votes and votes_cast_count recomputed", "vote.superseded_by_vote_id = the replacement row's id", "vote.updated_at refreshed and vote.version incremented by 1"]
        note: "Forward action of the F9 vote-weight pair"
      - from: SUPERSEDED
        to: RECORDED
        trigger: "POST /network/station-votes/{id}/restore"
        actor: NetworkGovernanceOfficer
        preconditions: ["vote.vote_status == SUPERSEDED", "the superseding row named by vote.superseded_by_vote_id is in RECORDED"]
        side_effects: ["the superseding row moves RECORDED to INVALIDATED", "vote.recorded_weight recomputed by slate_weighted_vote_scoring and restored to the weight its class carries", "the proposal's yes_votes, no_votes and votes_cast_count recomputed", "vote.updated_at refreshed and vote.version incremented by 1"]
        note: "Compensating action of the F9 vote-weight pair; the pair conserves total recorded weight"
      - from: SUPERSEDED
        to: INVALIDATED
        trigger: "POST /network/dues-proposals/{id}/close-enactment"
        actor: NetworkGovernanceOfficer
        preconditions: ["the proposal named by vote.parent_proposal_id moves ENACTED to ENACTMENT_CLOSED"]
        side_effects: ["vote.recorded_weight recomputed to 0"]
      - from: RECORDED
        to: INVALIDATED
        trigger: "POST /network/station-votes/{id}/restore"
        actor: NetworkGovernanceOfficer
        preconditions: ["vote.vote_status == RECORDED", "vote.superseded_by_vote_id is not null"]
        side_effects: ["vote.recorded_weight recomputed to 0"]
concurrency_rules:
  - rule_id: dues-vote-cast-stale-station
    parent_entity: MemberStation
    write_endpoint: "POST /network/dues-proposals/{id}/votes"
    occ_field: "expected_station_version"
    description: |
      Casting a StationVote against a MemberStation whose version has advanced
      since the client last observed it is rejected. The station's version
      advances on every eligibility decision and every dues-arrears mutation, so
      a client holding a stale view would otherwise record a vote whose weight
      reflects an eligibility state the station no longer has.
    error_id: ERR_STALE_STATION_VERSION
    http_status: 412
  - rule_id: content-license-stale-program
    parent_entity: NationalProgram
    write_endpoint: "POST /network/content-contributions/{id}/license"
    occ_field: "expected_program_version"
    description: |
      Licensing a ContentContribution against a NationalProgram whose version
      has advanced since the client last observed it is rejected. The program's
      version advances on every production-status change, and a license decision
      taken against a stale program view would bill the originating station
      against a program whose licensed_contribution_count and lifecycle state
      have already moved.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: seat-fill-stale-election
    parent_entity: BoardElection
    write_endpoint: "POST /network/board-elections/{id}/certify"
    occ_field: "expected_election_version"
    description: |
      Certifying a BoardElection whose version has advanced since the client
      last observed it is rejected. Certification allocates the region's seats
      to candidacies whose vote tallies are bound to a specific election
      version, so certifying against a stale view would seat a candidate under a
      tally the client has not seen.
    error_id: ERR_STALE_ELECTION_VERSION
    http_status: 412
  - rule_id: proposal-enact-stale-proposal
    parent_entity: DuesStructureProposal
    write_endpoint: "POST /network/dues-proposals/{id}/enact"
    occ_field: "expected_proposal_version"
    description: |
      Enacting a DuesStructureProposal whose version has advanced since the
      client last observed it is rejected. The proposal's version advances on
      every vote tally mutation, so enacting against a stale view would rewrite
      every member schedule's pricing from a vote count the client never saw.
    error_id: ERR_STALE_PROPOSAL_VERSION
    http_status: 412
calculations:
  - name: station_operations_score
    trigger: "whenever a MemberStation is created, an eligibility submission or decision is recorded, or a staffing/coverage field is updated"
    algorithm: weighted_scoring
    formula: |
      coverage_index = min(100, floor(MemberStation.coverage_population / 100000) * 9)
      staffing_index = min(100, MemberStation.full_time_staff_count * 5)
      newsroom_index = min(100, MemberStation.newsroom_staff_count * 10)
      operations_score = round_half_up(
          0.40 * coverage_index + 0.35 * staffing_index + 0.25 * newsroom_index, 2)
      # The weights sum to 1.00 and are applied to the three indices AFTER each
      # index is individually capped at 100; capping the weighted total instead
      # would give a different number for any station whose indices exceed 100.
    input_set: "the single MemberStation named by the triggering request"
    constants:
      WEIGHT_COVERAGE: 0.40
      WEIGHT_STAFFING: 0.35
      WEIGHT_NEWSROOM: 0.25
      COVERAGE_INDEX_STEP_PERSONS: 100000
      COVERAGE_INDEX_PER_STEP: 9
      STAFFING_INDEX_PER_FTE: 5
      NEWSROOM_INDEX_PER_FTE: 10
      INDEX_CAP: 100
    precision: "2 decimal places, round_half_up"
  - name: membership_class_assignment
    trigger: "whenever station_operations_score recomputes or MemberStation.dma_households is updated"
    algorithm: threshold
    formula: |
      households_index = min(100, floor(MemberStation.dma_households / 50000) * 5)
      # Gate ladder is evaluated in this fixed order; the FIRST gate whose pair
      # of conditions both hold wins. Ladder order is part of the contract.
      if operations_score >= 75.00 and households_index >= 45: class = CLASS_A
      elif operations_score >= 60.00 and households_index >= 30: class = CLASS_B
      elif operations_score >= 45.00 and households_index >= 15: class = CLASS_C
      else: class = CLASS_D
      MemberStation.membership_class = class
    input_set: "the single MemberStation named by the triggering request"
    constants:
      CLASS_A_SCORE_MIN: 75.00
      CLASS_A_HOUSEHOLD_INDEX_MIN: 45
      CLASS_B_SCORE_MIN: 60.00
      CLASS_B_HOUSEHOLD_INDEX_MIN: 30
      CLASS_C_SCORE_MIN: 45.00
      CLASS_C_HOUSEHOLD_INDEX_MIN: 15
      HOUSEHOLD_INDEX_STEP: 50000
      HOUSEHOLD_INDEX_PER_STEP: 5
      HOUSEHOLD_INDEX_CAP: 100
    precision: "operations_score compared at 2 decimal places, round_half_up before comparison"
  - name: programming_fee_provisional
    trigger: "when a MemberStation's eligibility is approved, and whenever the assessment is re-derived from the schedule"
    algorithm: tiered_pricing
    formula: |
      # Rounding is pinned: each component is rounded to the cent BEFORE the sum.
      tier = 1 if dma_market_rank <= schedule.market_tier_1_max_rank
             else 2 if dma_market_rank <= schedule.market_tier_2_max_rank
             else 3 if dma_market_rank <= schedule.market_tier_3_max_rank
             else 4
      market_multiplier_bps = schedule.market_size_multiplier_bps if tier == 1
                              else MARKET_TIER_MULTIPLIER_BPS[tier]
      rate_component_cents   = round_half_up_to_cent(annual_local_revenue_cents * schedule.revenue_rate_bps / 10000)
      market_component_cents = membership_class_fee_multiplier(schedule, station.membership_class)
      # The base market component is 1200000 cents at the fixture schedule; the
      # membership-class multiplier is then applied on top of it, which is why a
      # CLASS_A station at revenue 4800000 lands on 1860000 rather than 1500000.
      provisional_fee_cents  = rate_component_cents + market_component_cents
      provisional_fee_cents  = clamp(provisional_fee_cents, schedule.minimum_fee_cents, schedule.maximum_fee_cents)
    input_set: "one MemberStation (must be in eligibility_status ELIGIBLE, PROBATION or SUSPENDED) paired with the ProgrammingFeeSchedule whose [effective_from, effective_to) contains the assessment's fiscal-year anchor"
    constants:
      MARKET_TIER_MULTIPLIER_BPS: {2: 14000, 3: 15500, 4: 16500}
      TIER_1_MULTIPLIER_SOURCE: "schedule.market_size_multiplier_bps"
    precision: "cents, round_half_up per component, then integer sum; clamp applied last"
    worked_example: "schedule(base_fee_cents=1200000, revenue_rate_bps=250, tier bounds 25/75/150, market_size_multiplier_bps=12500, min=100000, max=5000000); station(dma_market_rank=60, annual_local_revenue_cents=4800000, membership_class CLASS_A) -> tier=3 -> tier component round(1200000*15500/10000)=1860000 -> class multiplier 11500 applied on top -> market_component=1860000 -> rate_component=120000 -> provisional=1980000"
    boundary_example: "station(annual_local_revenue_cents=4999999) -> 4999999*250/10000 = 124999.975 -> rate_component=125000 (half-up to the cent, not truncation)"
  - name: programming_fee_final_adjusted
    trigger: "when a CarriageAgreement carrying this station's program publishes, and when a DuesStructureProposal enacts a new network rate"
    algorithm: aggregation
    formula: |
      adjusted_raw_cents = provisional_fee_cents * (10000 + schedule.annual_adjustment_bps) / 10000
      final_fee_cents    = round_half_up_to_cent(adjusted_raw_cents)
      MemberStation.dues_arrears_cents += final_fee_cents - drive_dues_deduction(current fiscal year drive)
    input_set: "the MemberStation paired with the same ProgrammingFeeSchedule used by programming_fee_provisional; the annual_adjustment_bps term is applied only when clock.now() >= schedule.effective_from"
    constants:
      ADJUSTMENT_SCALE_BPS: 10000
    precision: "cents, round_half_up applied once to the adjusted total"
    variants:
      - name: per_station_projection
        when: "the schedule's annual adjustment epoch has been reached (clock.now() >= schedule.effective_from)"
        difference: "applies schedule.annual_adjustment_bps, so an input set that yields 1980000 provisional yields 2158200 final when annual_adjustment_bps = 900"
      - name: schedule_unadjusted
        when: "the schedule's annual adjustment epoch has not been reached (clock.now() < schedule.effective_from)"
        difference: "annual_adjustment_bps is not applied, so the same input set yields 1980000, which is 178200 cents lower than the projected variant"
    worked_example: "provisional=1980000, annual_adjustment_bps=900 -> 1980000*10900/10000 = 2158200.00 -> final_fee_cents=2158200"
  - name: membership_class_fee_multiplier
    trigger: "whenever membership_class_assignment writes MemberStation.membership_class"
    algorithm: threshold
    formula: |
      MEMBERSHIP_CLASS_FEE_MULTIPLIER_BPS = {CLASS_A: 11500, CLASS_B: 10000, CLASS_C: 8750, CLASS_D: 7500}
      # Applied to the market_component_cents only, never to rate_component_cents.
      class_adjusted_market_component_cents = round_half_up_to_cent(
          schedule.base_fee_cents * MEMBERSHIP_CLASS_FEE_MULTIPLIER_BPS[class] / 10000)
    input_set: "a MemberStation whose membership_class is CLASS_A..CLASS_D; CLASS_A members pay a surcharge and CLASS_D members receive a reduction"
    constants:
      CLASS_A_MULTIPLIER_BPS: 11500
      CLASS_B_MULTIPLIER_BPS: 10000
      CLASS_C_MULTIPLIER_BPS: 8750
      CLASS_D_MULTIPLIER_BPS: 7500
    precision: "cents, round_half_up"
    worked_example: "schedule.base_fee_cents=1200000, class=CLASS_A -> round(1200000*11500/10000) = 1380000.00 = 1380000"
    boundary_example: "schedule.base_fee_cents=3960000, class=CLASS_C -> 3960000*8750/10000 = 3465000.00 exactly; schedule.base_fee_cents=3960001, class=CLASS_C -> 3465000.875 -> 3465001"
  - name: carriage_clearance_ratio
    trigger: "whenever a BroadcastWindow's clearance_status changes, and when a CarriageAgreement publishes"
    algorithm: aggregation
    formula: |
      # Pinned evaluation order (the agreement's own inputs are themselves
      # outputs of this rule, so the order is part of the contract):
      #   1. recompute each child window's carriage_exception_liability_cents
      #      via exception_liability_accrual,
      #   2. sum those into agreement_exception_liability_cents_raw,
      #   3. round the SUM once (never per window),
      #   4. clamp to agreement.exception_liability_cap_cents,
      #   5. derive the ratio from the CLAMPED total.
      windows_in_scope = BroadcastWindow where
          BroadcastWindow.parent_agreement_id == agreement.id
          AND BroadcastWindow.clearance_status IN {CLEARED, SCHEDULED, BROADCAST}
      in_scope_count     = count(windows_in_scope)
      cleared_count      = count(w where w.is_cleared == true)
      broadcast_count    = count(w where w.clearance_status == BROADCAST)
      cleared_units      = (cleared_count + broadcast_count) * 10000
      clearance_ratio_bps = CLEARED_WHEN_EMPTY_BPS if in_scope_count == 0
                            else floor_div(cleared_units, in_scope_count)
      agreement_exception_liability_cents_raw = sum over ALL windows under
          agreement.id of w.carriage_exception_liability_cents
      agreement_exception_liability_cents = min(
          round_half_up_to_cent(agreement_exception_liability_cents_raw),
          agreement.exception_liability_cap_cents)
    input_set: "all BroadcastWindows under the agreement, unfiltered for liability; only CLEARED, SCHEDULED and BROADCAST windows populate the ratio denominator"
    constants:
      CLEARED_WHEN_EMPTY_BPS: 10000
      RATIO_SCALE_BPS: 10000
    precision: "basis points, floor for the ratio; cents, round_half_up applied once to the summed liability"
    worked_example: "two windows both CLEARED -> denominator 2, numerator 2 -> 10000 bps, not 5000"
    boundary_example: "one CLEARED and one VIOLATED window -> denominator 1 (VIOLATED excluded), numerator 1 -> 10000 bps while liability is non-zero"
  - name: exception_liability_accrual
    trigger: "whenever a BroadcastWindow enters REJECTED, VIOLATED or MISSED"
    algorithm: chronological
    formula: |
      if window.clearance_status == REJECTED:
          exception_liability_cents = round_half_up_to_cent(REJECTED_BASE_CENTS)
      elif window.clearance_status == VIOLATED:
          coverage_breach_bps = min(COVERAGE_BREACH_CAP_BPS, window.duration_minutes * 100)
          exception_liability_cents = round_half_up_to_cent(
              VIOLATED_BASE_CENTS + VIOLATED_BASE_CENTS * coverage_breach_bps / 10000)
      elif window.clearance_status == MISSED:
          exception_liability_cents = round_half_up_to_cent(UNFILLED_SLOT_BASE_CENTS)
      else:
          exception_liability_cents = 0
      # Chronological component: a window that is MISSED and then also VIOLATED
      # carries BOTH bases; the accrual replays the window's status history in
      # clock order and adds each terminal basis, so the accrue order changes
      # nothing but the SUM does depend on how many bases applied.
    input_set: "the single BroadcastWindow named by the triggering request; its own status history in clock order"
    constants:
      REJECTED_BASE_CENTS: 25000
      VIOLATED_BASE_CENTS: 75000
      UNFILLED_SLOT_BASE_CENTS: 40000
      COVERAGE_BREACH_BPS_PER_MINUTE: 100
      COVERAGE_BREACH_CAP_BPS: 10000
    precision: "cents, round_half_up"
    worked_example: "window.duration_minutes=60 on a 3600-second window, status VIOLATED -> coverage_breach_bps=min(10000, 6000)=6000 -> 75000 + 75000*6000/10000 = 75000 + 45000 = 120000"
  - name: content_compensation_credit
    trigger: "when a ContentContribution is licensed, marked used, submitted, shortlisted, or returned for resubmission"
    algorithm: weight_and_decay
    formula: |
      duration_factor_bps = min(DURATION_FACTOR_CAP_BPS,
                                floor_div(duration_seconds * 10000, NOMINAL_DURATION_SECONDS))
      base_credit_cents   = round_half_up_to_cent(BASE_CREDIT_CENTS * duration_factor_bps / 10000)
      class_credit_cents  = round_half_up_to_cent(
          base_credit_cents * CONTRIBUTING_CLASS_FACTOR_BPS[contributing station membership_class] / 10000)
      revision_multiplier_bps = max(MIN_REVISION_MULTIPLIER_BPS,
                                    10000 - revision_count * REVISION_MULTIPLIER_STEP_BPS)
      shelf_credit_cents = round_half_up_to_cent(class_credit_cents * revision_multiplier_bps / 10000)
      # Variant selector: the published branch applies the flat conference rate
      # as a FLOOR on top of the shelf branch; the working branch does not.
      published_branch = contribution_status IN {LICENSED, USED}
      raw_credit_cents = max(shelf_credit_cents, CONFERENCE_RATE_CENTS) if published_branch
                         else shelf_credit_cents
      compensation_credit_cents = min(raw_credit_cents, CAP_CENTS)
    input_set: "the single ContentContribution named by the triggering request, joined to its contributing MemberStation for the class factor"
    constants:
      BASE_CREDIT_CENTS: 50000
      NOMINAL_DURATION_SECONDS: 180
      CONTRIBUTING_CLASS_FACTOR_BPS: {CLASS_A: 10000, CLASS_B: 9500, CLASS_C: 8500, CLASS_D: 8000}
      REVISION_MULTIPLIER_STEP_BPS: 500
      MIN_REVISION_MULTIPLIER_BPS: 5000
      CONFERENCE_RATE_CENTS: 60000
      DURATION_FACTOR_CAP_BPS: 20000
      CAP_CENTS: 250000
    precision: "cents, round_half_up at each of the three multiplies; factors compared in basis points"
    variants:
      - name: conference_rate
        when: "the piece is licensed or marked used (the published branch)"
        difference: "applies CONFERENCE_RATE_CENTS as a floor over the shelf branch, so a 180-second CLASS_B piece with revision_count = 1 yields 60000 rather than the 45125 the shelf branch alone produces"
      - name: shelf_rate
        when: "the piece is submitted or shortlisted but not yet licensed"
        difference: "uses the shelf branch alone, yielding 45125 for the same 180-second CLASS_B piece with revision_count = 1, which is 14875 lower than the conference-rate variant"
    worked_example: "duration_seconds=180 -> duration_factor_bps=min(20000, floor(1800000/180))=10000; base_credit=round(50000*10000/10000)=50000; CLASS_B 9500 -> class_credit=round(50000*9500/10000)=47500; revision_count=1 -> multiplier=max(5000,9500)=9500; shelf_credit=round(47500*9500/10000)=45125; SUBMITTED -> shelf_rate=45125; LICENSED -> max(45125,60000)=60000"
    boundary_example: "duration_seconds=360 -> floor(3600000/180)=20000, exactly at the cap -> duration_factor_bps=20000; duration_seconds=361 -> floor(3610000/180)=20055, capped to 20000; duration_seconds=359 -> floor(3590000/180)=19944"
  - name: drive_dues_deduction
    trigger: "when a MembershipDrive is reported, and whenever a pledge is recorded during an ACTIVE drive"
    algorithm: aggregation
    formula: |
      # Pinned rounding order: the basis is rounded to the cent, the ratio is
      # floor-divided to a whole percent, and only then are they multiplied.
      # Rounding the product instead gives different cents.
      basis_cents          = round_half_up_to_cent(pledged_cents if variant == pledge_base
                                                   else collected_cents)
      ratio_percent        = min(100, floor_div(collected_cents * 100, pledged_cents))
                             when pledged_cents > 0 else 0
      raw_deduction_cents  = round_half_up_to_cent(basis_cents * ratio_percent / 100)
      matured_dues_cents   = provisional_fee_cents - DUES_ROUNDING_HEADROOM_CENTS
      drive_dues_deduction_cents = min(raw_deduction_cents, matured_dues_cents)
    input_set: "the single MembershipDrive named by the triggering request"
    constants:
      DUES_ROUNDING_HEADROOM_CENTS: 500000
    precision: "cents, round_half_up; ratio floor-divided to a whole percent before use"
    variants:
      - name: pledge_base
        when: "the drive's pledges are counted toward the deduction basis"
        difference: "the basis is pledged_cents, so a drive with pledged 100000 and collected 55000 deducts 550 (not 303)"
      - name: fulfilled_base
        when: "only fulfilled pledges are counted toward the deduction basis"
        difference: "the basis is collected_cents, so a drive with pledged 100000 and collected 55000 deducts 303, which is 247 lower than the pledge-base variant"
    worked_example: "pledged_cents=100000, collected_cents=55000 -> ratio_percent=floor(5500000/100000)=55; pledge_base -> basis=100000, raw=round(100000*55/100)=55000; fulfilled_base -> basis=55000, raw=round(55000*55/100)=30250; matured_dues_cents=1980000-500000=1480000 so neither is clamped"
  - name: underwriting_acknowledgment_check
    trigger: "whenever an UnderwritingAgreement is submitted for review or approved"
    algorithm: constraint_propagation
    formula: |
      # Checks are evaluated in VIOLATION_ORDER and the FIRST violation found is
      # the one reported; a script failing several checks always surfaces the
      # earliest one, so the reported reason is order-dependent.
      superlative_count   = count of FORBIDDEN_PHRASES matched case-insensitively as whole words in ack_script_text
      comparative_count   = count of COMPARATIVE_TOKENS matched in ack_script_text
      has_price_invitation = ("price" in ack_script_text) or ("$" in ack_script_text)
      has_call_to_action  = any of CALL_TO_ACTION_TOKENS matched in ack_script_text
      over_word_limit     = len(split_whitespace(ack_script_text)) > MAX_ACK_WORDS
      if superlative_count > 0:                       violation = SUPERLATIVE
      elif comparative_count > 0:                     violation = COMPARATIVE
      elif has_price_invitation:                      violation = PRICE_INVITATION
      elif has_call_to_action:                        violation = CALL_TO_ACTION
      elif over_word_limit:                           violation = LENGTH
      else:                                           violation = NONE
      agreement.disclosure_test_passed = (violation == NONE)
    input_set: "the single UnderwritingAgreement named by the triggering request; ack_script_text is the only input"
    constants:
      FORBIDDEN_PHRASES: ["best", "cheapest", "lowest price", "guarantee", "free", "sale", "bestseller", "recommend"]
      COMPARATIVE_TOKENS: ["better than", "outperforms", "cheaper than"]
      CALL_TO_ACTION_TOKENS: ["call now", "visit today", "buy"]
      MAX_ACK_WORDS: 30
      VIOLATION_ORDER: [SUPERLATIVE, COMPARATIVE, PRICE_INVITATION, CALL_TO_ACTION, LENGTH]
    precision: "boolean; no rounding"
    worked_example: "ack_script_text = 'The best coffee in town, call now' -> matches SUPERLATIVE and CALL_TO_ACTION; VIOLATION_ORDER reports SUPERLATIVE, disclosure_test_passed = false"
    boundary_example: "a 31-word script containing no forbidden phrase -> LENGTH violation only, disclosure_test_passed = false; a 30-word script containing no forbidden phrase -> NONE, disclosure_test_passed = true"
  - name: network_dues_pool_allocation
    trigger: "when a ProgrammingFeeAssessment batch is finalized for a fiscal year"
    algorithm: waterfall_allocation
    formula: |
      # Flat tier share first, then the remainder in whole cents.
      remainder_cents = total_pot_cents
                        - Σ over WATERFALL_TIER_ORDER of (STATION_TIER_SHARE_CENTS * station_count_in_that_class)
      # Selector order, applied only to decide WHO receives the remainder cents:
      #   membership_class ascending through WATERFALL_TIER_ORDER, then
      #   station.operations_score DESC, then station.dues_arrears_cents DESC,
      #   then station.created_at ASC.
      # The fourth key is server-stamped with microsecond resolution and is the
      # final tie-break; station.id is never consulted.
      ranked_stations = the assessment batch's stations sorted by SELECTOR_ORDER
      for rank_i, station in enumerate(ranked_stations):
          station.allocated_dues_cents = STATION_TIER_SHARE_CENTS + (1 if rank_i < remainder_cents else 0)
      Σ station.allocated_dues_cents == total_pot_cents  # invariant
    input_set: "every MemberStation in the batch whose eligibility_status IN {ELIGIBLE, PROBATION}; SUSPENDED and APPLICANT stations are excluded from both the counts and the ranking"
    constants:
      STATION_TIER_SHARE_CENTS: 120000
      WATERFALL_TIER_ORDER: [CLASS_A, CLASS_B, CLASS_C, CLASS_D]
      SELECTOR_ORDER: [membership_class ASC, operations_score DESC, dues_arrears_cents DESC, created_at ASC]
    precision: "cents, integer; no rounding occurs"
    worked_example: "total_pot_cents = 240001 with 2 eligible stations (one CLASS_A, one CLASS_B) -> remainder = 240001 - 240000 = 1 -> the CLASS_A station (rank 0 by WATERFALL_TIER_ORDER) receives 120001 and the CLASS_B station receives 120000; Σ = 240001 == total_pot_cents"
    boundary_example: "total_pot_cents = 239999 with 2 eligible stations -> remainder = -1, which is less than every rank index, so BOTH stations receive the flat 120000 and Σ = 240000 exceeds the pot; the batch is rejected with ERR_POOL_OVER_ALLOCATED rather than scaling the shares down"
  - name: slate_weighted_vote_scoring
    trigger: "whenever a StationVote is recorded, superseded or restored, and when a DuesStructureProposal is tallied"
    algorithm: weighted_scoring
    formula: |
      MEMBERSHIP_CLASS_VOTE_WEIGHT = {CLASS_A: 3, CLASS_B: 2, CLASS_C: 1, CLASS_D: 0}
      for each station with a vote row whose vote_status == RECORDED:
          w = MEMBERSHIP_CLASS_VOTE_WEIGHT[station.membership_class]
          if vote_choice == YES: recorded_weight = w
          else:                  recorded_weight = max(1, (w + 1) // 2) if w > 0 else 0
      proposal.yes_votes        = Σ recorded_weight over rows with vote_status == RECORDED and vote_choice == YES
      proposal.no_votes         = Σ recorded_weight over rows with vote_status == RECORDED and vote_choice == NO
      # Quorum denominator. Pinned variant: weighted_participation.
      proposal.votes_cast_count = count of DISTINCT station_id over rows with vote_status == RECORDED
      quorum_met = proposal.votes_cast_count >= proposal.quorum_required_votes
      passed     = quorum_met and proposal.yes_votes > proposal.no_votes
    input_set: "only rows whose vote_status == RECORDED contribute; SUPERSEDED and INVALIDATED rows contribute zero to all three tallies"
    constants:
      MEMBERSHIP_CLASS_VOTE_WEIGHT: {CLASS_A: 3, CLASS_B: 2, CLASS_C: 1, CLASS_D: 0}
      NO_VOTE_FLOOR_DIVISOR: 2
      PINNED_QUORUM_VARIANT: weighted_participation
    precision: "integer weights; no rounding"
    variants:
      - name: weighted_participation
        when: "the pinned variant; quorum is decided by how many distinct stations recorded a vote"
        difference: "a CLASS_D station casts recorded_weight 0 yet still counts toward votes_cast_count, so a proposal with a quorum of 4 reaches quorum when four stations have recorded rows"
      - name: weighted_quorum
        when: "the rejected alternative; quorum is decided only by stations whose recorded_weight is above zero"
        difference: "the same four-station proposal reports votes_cast_count 3 rather than 4, so it fails quorum with quorum_required_votes = 4"
    worked_example: "stations A (CLASS_A, YES), B (CLASS_B, NO), C (CLASS_C, YES) and D (CLASS_D, YES): recorded_weight A=3, B=max(1,(2+1)//2)=1, C=1, D=0 -> yes_votes=4, no_votes=1; votes_cast_count=4 under the pinned variant, 3 under the alternative"
    boundary_example: "one CLASS_C station voting NO -> recorded_weight = max(1, (1+1)//2) = 1, so a single CLASS_C NO weighs exactly as much as a single CLASS_C YES"
  - name: archive_credit_ledger_invariant
    trigger: "whenever a ContentContribution is licensed, whenever a station applies contribution credit, and whenever a NationalProgram is retired"
    algorithm: aggregation
    formula: |
      # Invariant rule, not an allocation. The compensating pair is
      #   forward  : POST /network/content-contributions/{id}/license
      #              (program pool goes DOWN by the credit, station balance
      #               goes UP by the same credit)
      #   reverse  : POST /network/member-stations/{id}/apply-contribution-credit
      #              (station balance goes DOWN, applied_relief goes UP by the
      #               same amount)
      # Conservation sum; every hop moves mass between terms, never in or out.
      credit_conservation_sum_cents = (program.preliminary_license_credit_cents
                                       + Σ MemberStation.contribution_credit_cents
                                       + Σ MemberStation.applied_relief_cents)
      invariant_holds = (credit_conservation_sum_cents == INITIAL_SUM_CENTS)
      # Retirement closes the ledger and MUST NOT touch any of the three terms;
      # a retire that zeroes the pool leaves the sum off by the retired mass.
    input_set: "the single NationalProgram named by the triggering request, plus every MemberStation ever credited for that program"
    constants:
      INITIAL_SUM_CENTS: 0
      CONSERVED_QUANTITY: credit_conservation_sum_cents
    precision: "cents, exact integer arithmetic; no rounding"
    worked_example: "program pool starts at 0 -> license a 60000-cent contribution: pool -60000, station balance 60000, relief 0, sum 0; apply-contribution-credit 60000: pool -60000, balance 0, relief 60000, sum 0"
    boundary_example: "a program with zero licensed contributions keeps pool 0, balances 0 and relief 0, so the sum is 0 and the invariant holds trivially; a retire that zeroed the pool after one license would leave the sum at 60000 and violate it"
  - name: member_station_standings
    trigger: "on read of the standings projection, and whenever any station field named in a ranking key mutates"
    algorithm: weighted_scoring
    formula: |
      eligible_set = MemberStation where eligibility_status == ELIGIBLE
                     AND dues_vote_eligible == true
      ranking_key  = (dues_arrears_cents DESC, operations_score DESC,
                      membership_class ASC, created_at ASC)
      # created_at is server-stamped with microsecond resolution and is the FINAL
      # tie-break. MemberStation.id is NEVER a ranking input, not even as a last
      # resort: two stations that share all four keys share a rank, and the next
      # distinct key value takes the next rank (dense ranking, not ordinal).
      standings_rank[i] = number of DISTINCT ranking_key values strictly
                          greater than ranking_key[i], plus 1
      exhausted_fallback = CAUSE_EXHAUSTED when eligible_set is empty
    input_set: "stations in eligibility_status ELIGIBLE with dues_vote_eligible == true; PROBATION stations hold no vote weight and are excluded"
    constants:
      MATCH_BUDGET_PER_STATION_CENTS: 450000
      EFFICIENCY_FLOOR_BPS: 8000
      SELECTOR_RANKING: "(dues_arrears_cents DESC, operations_score DESC, membership_class ASC, created_at ASC)"
      EMPTY_CANDIDATE_FALLBACK: CAUSE_EXHAUSTED
    precision: "operations_score compared at 2 decimal places; integer fields exact"
    worked_example: "station X (arrears 500000, score 88.00, CLASS_A, created 2026-03-01T00:00:00.000Z) and station Y (arrears 500000, score 88.00, CLASS_A, created 2026-04-01T00:00:00.000Z) -> standing_rank(X) == 1, standing_rank(Y) == 2; the two keys before the created_at tie-break are equal, so created_at decides"
    boundary_example: "an empty eligible set -> POST /network/member-stations/{id}/cost-efficiency-match returns ERR_NO_ELIGIBLE_STATION_CAUSE rather than an empty result, and GET /network/member-station-standings returns total_count 0"
validations:
  - {priority: 1, category: auth, check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role in §1.7", error_id: ERR_MISSING_AUTH, http_status: 401, applies_to: all}
  - {priority: 2, category: auth, check: "the acting role is permitted for this operation per §1.7, and every endpoint variant that carries an acting-station attribution applies the pairing rule", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: all}
  - {priority: 3, category: existence, check: "every required input field is present, every enum member is declared, and every numeric range constraint on the request body holds", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all}
  - {priority: 4, category: existence, check: "every resource named in the path or in a required FK input exists", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: all}
  - {priority: 5, category: existence, check: "MemberStation.call_sign is not already taken", error_id: ERR_CALL_SIGN_TAKEN, http_status: 409, applies_to: "POST /network/member-stations, PATCH /network/member-stations/{id}"}
  - {priority: 6, category: existence, check: "NationalProgram.program_code is not already taken", error_id: ERR_PROGRAM_CODE_TAKEN, http_status: 409, applies_to: "POST /network/national-programs"}
  - {priority: 7, category: existence, check: "DistributionFeed.feed_code is not already taken", error_id: ERR_FEED_CODE_TAKEN, http_status: 409, applies_to: "POST /network/distribution-feeds"}
  - {priority: 8, category: state, check: "the target resource is in a from-state of the requested transition and satisfies every precondition on that transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "every transition endpoint in §1.2"}
  - {priority: 9, category: state, check: "the target resource is not already in a terminal state", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "every transition endpoint in §1.2"}
  - {priority: 10, category: state, check: "the acting station's eligibility_status IN {ELIGIBLE, PROBATION}", error_id: ERR_STATION_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /network/carriage-agreements, POST /network/membership-drives/{id}/open"}
  - {priority: 11, category: state, check: "the acting station's eligibility_status is neither SUSPENDED nor WITHDRAWN", error_id: ERR_STATION_SUSPENDED, http_status: 409, applies_to: "POST /network/content-contributions/{id}/license, POST /network/dues-proposals/{id}/votes, POST /network/carriage-agreements/{id}/submit"}
  - {priority: 12, category: state, check: "this station holds no StationVote whose vote_status == RECORDED on this proposal; a re-vote must first supersede the recorded row", error_id: ERR_VOTE_ALREADY_RECORDED, http_status: 409, applies_to: "POST /network/dues-proposals/{id}/votes"}
  - {priority: 13, category: state, check: "every BroadcastWindow under the agreement has is_cleared == true", error_id: ERR_REVIEW_INCOMPLETE, http_status: 409, applies_to: "POST /network/carriage-agreements/{id}/clear, POST /network/carriage-agreements/{id}/publish"}
  - {priority: 14, category: state, check: "the window's parent agreement is not TERMINATED", error_id: ERR_CARRIAGE_AGREEMENT_TERMINATED, http_status: 409, applies_to: "POST /network/broadcast-windows/{id}/remediating, POST /network/broadcast-windows/{id}/request-clearance"}
  - {priority: 15, category: state, check: "aired_segment_count < compliance_segment_count before another segment is aired", error_id: ERR_SEGMENT_COUNT_EXCEEDED, http_status: 409, applies_to: "POST /network/underwriting-agreements/{id}/air-segment"}
  - {priority: 16, category: state, check: "every QUALIFIED candidacy under the election has last_candidacy_cycle <= clock.now(), so no candidacy is mid-review", error_id: ERR_CANDIDACY_NOT_QUALIFIED, http_status: 409, applies_to: "POST /network/board-elections/{id}/certify"}
  - {priority: 17, category: business_temporal, check: "no sibling BroadcastWindow under the same agreement on the same station overlaps the requested [window_start, window_end) interval; touching intervals that share exactly one endpoint are adjacent and are allowed", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /network/broadcast-windows, PATCH /network/broadcast-windows/{id}"}
  - {priority: 18, category: business_temporal, check: "window.window_start >= window.embargo_until when an embargo_until is declared, and window_start < national_premiere_at for any program the window carries", error_id: ERR_EMBARGO_VIOLATION, http_status: 409, applies_to: "POST /network/broadcast-windows, POST /network/broadcast-windows/{id}/request-clearance, POST /network/broadcast-windows/{id}/clear"}
  - {priority: 19, category: business_referential, check: "window.program_code equals the parent agreement's program_code", error_id: ERR_PROGRAM_CODE_MISMATCH, http_status: 409, applies_to: "POST /network/broadcast-windows, POST /network/carriage-agreements/{id}/submit"}
  - {priority: 20, category: business_referential, check: "the station named by the slot's window_id matches the slot's own station_id", error_id: ERR_SLOT_STATION_MISMATCH, http_status: 409, applies_to: "POST /network/uplink-slots"}
  - {priority: 21, category: business_constraint, check: "no sibling UplinkSlot on the same DistributionFeed overlaps the requested [slot_start, slot_end) interval in whole units; touching intervals are adjacent and are allowed", error_id: ERR_UPLINK_CAPACITY_CONFLICT, http_status: 409, applies_to: "POST /network/uplink-slots, PATCH /network/uplink-slots/{id}"}
  - {priority: 22, category: business_constraint, check: "the feed's reserved_capacity_units plus the requested capacity units does not exceed total_capacity_units", error_id: ERR_UPLINK_CAPACITY_EXHAUSTED, http_status: 409, applies_to: "POST /network/uplink-slots"}
  - {priority: 23, category: business_constraint, check: "ContentContribution.station_id names a station whose eligibility_status IN {ELIGIBLE, PROBATION}", error_id: ERR_CONTRIBUTION_STATION_INELIGIBLE, http_status: 409, applies_to: "POST /network/content-contributions, POST /network/content-contributions/{id}/shortlist"}
  - {priority: 24, category: business_safety, check: "ack_script_text violates no sponsorship acknowledgment rule, evaluated in VIOLATION_ORDER", error_id: ERR_ACK_LANGUAGE_VIOLATION, http_status: 422, applies_to: "POST /network/underwriting-agreements/{id}/submit-for-review, POST /network/underwriting-agreements/{id}/approve"}
  - {priority: 25, category: business_safety, check: "the station is not subject to an active coverage-and-operations freeze that bars new underwriting", error_id: ERR_TRANSMISSION_FREEZE, http_status: 422, applies_to: "POST /network/underwriting-agreements, POST /network/underwriting-agreements/{id}/schedule"}
  - {priority: 26, category: business_fiscal, check: "this proposal has no outstanding superseding StationVote row for the same station in the current cycle; such a row must first be invalidated", error_id: ERR_DUES_VOTE_IN_PROGRESS, http_status: 422, applies_to: "POST /network/dues-proposals/{id}/votes"}
  - {priority: 27, category: business_fiscal, check: "on enactment, the total allocated dues across the batch equals the fiscal year's total_pot_cents after remainder allocation", error_id: ERR_POOL_OVER_ALLOCATED, http_status: 422, applies_to: "POST /network/dues-proposals/{id}/enact"}
  - {priority: 28, category: business_fiscal, check: "Σ MemberStation.contribution_credit_cents over all stations ever credited for the program equals the program's pool magnitude when the program is archived", error_id: ERR_ARCHIVE_INVARIANT_VIOLATED, http_status: 422, applies_to: "POST /network/national-programs/{id}/retire"}
  - {priority: 29, category: business_fiscal, check: "the number of block reservations in one request does not exceed 3", error_id: ERR_SLOT_REQUEST_LIMIT_EXCEEDED, http_status: 422, applies_to: "POST /network/uplink-slots/block"}
  - {priority: 30, category: business_constraint, check: "MemberStation.version equals the submitted expected_station_version", error_id: ERR_STALE_STATION_VERSION, http_status: 412, applies_to: "POST /network/dues-proposals/{id}/votes"}
  - {priority: 31, category: business_constraint, check: "NationalProgram.version equals the submitted expected_program_version", error_id: ERR_STALE_PROGRAM_VERSION, http_status: 412, applies_to: "POST /network/content-contributions/{id}/license"}
  - {priority: 32, category: business_constraint, check: "BoardElection.version equals the submitted expected_election_version", error_id: ERR_STALE_ELECTION_VERSION, http_status: 412, applies_to: "POST /network/board-elections/{id}/certify"}
  - {priority: 33, category: business_constraint, check: "DuesStructureProposal.version equals the submitted expected_proposal_version", error_id: ERR_STALE_PROPOSAL_VERSION, http_status: 412, applies_to: "POST /network/dues-proposals/{id}/enact"}
endpoints:
  - {method: POST, path: "/network/member-stations", description: "Register a new member station as an APPLICANT and derive its operations score, membership class and dues eligibility projection", roles: [PlatformAdmin], code: 201, input: [call_sign, licensee_name, state_code, dma_market_rank, dma_households, coverage_population, full_time_staff_count, newsroom_staff_count, annual_local_revenue_cents, board_seat_region], output: MemberStation, side_effects: ["station_operations_score recomputed", "membership_class_assignment recomputed", "a DuesVoteEligibilityProjection row is upserted with station.dues_vote_eligible = false", "increments MemberStation.version by 1"]}
  - {method: GET, path: "/network/member-stations", description: "List member stations with filters; the reverse-reachability entry point for every child entity that references a station", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor, NationalProgramEditor, NetworkGovernanceOfficer], code: 200, input: ["eligibility_status?", "membership_class?", "board_seat_region?", "call_sign?", "limit?", "offset?"], output: "MemberStation[]", side_effects: []}
  - {method: GET, path: "/network/member-stations/{id}", description: "Read one member station including its derived operations score, membership class and dues eligibility projection", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor, NationalProgramEditor, NetworkGovernanceOfficer], code: 200, input: [], output: MemberStation, side_effects: []}
  - {method: PATCH, path: "/network/member-stations/{id}", description: "Update a station's coverage, staffing, operations or revenue inputs; every derived field is re-derived in the same request", roles: [StationManager, NetworkComplianceAuditor], code: 200, input: ["call_sign?", "dma_households?", "coverage_population?", "full_time_staff_count?", "newsroom_staff_count?", "annual_local_revenue_cents?", "board_seat_region?"], output: MemberStation, side_effects: ["station_operations_score recomputed", "membership_class_assignment recomputed", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/submit-eligibility", description: "Move a station into UNDER_REVIEW or, from REMEDIATION_SUBMITTED, back into UNDER_REVIEW", roles: [StationManager], code: 200, input: [], output: MemberStation, side_effects: ["APPLICANT_to_UNDER_REVIEW or REMEDIATION_SUBMITTED_to_UNDER_REVIEW transition", "station_operations_score recomputed", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/record-deficiency", description: "Record a coverage, staffing or operations deficiency and move an UNDER_REVIEW station to DEFICIENT", roles: [NetworkComplianceAuditor], code: 200, input: [deficiency_factors], output: MemberStation, side_effects: ["UNDER_REVIEW_to_DEFICIENT transition", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/remediation", description: "Submit remediation evidence and move a DEFICIENT station to REMEDIATION_SUBMITTED", roles: [StationManager], code: 200, input: [remediated_factors], output: MemberStation, side_effects: ["DEFICIENT_to_REMEDIATION_SUBMITTED transition", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/approve-eligibility", description: "Approve a station's eligibility; mints the fiscal-year ProgrammingFeeAssessment and marks the station dues-vote eligible", roles: [NetworkComplianceAuditor], code: 200, input: [], output: MemberStation, side_effects: ["UNDER_REVIEW_to_ELIGIBLE or REMEDIATION_SUBMITTED_to_ELIGIBLE transition", "a ProgrammingFeeAssessment is cascaded with assessment_status = INITIAL", "membership_class_assignment recomputed", "DuesVoteEligibilityProjection row upserted with dues_vote_eligible = true", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/probation", description: "Place an ELIGIBLE station on probation, revoke its vote weight and void its non-terminal windows", roles: [NetworkComplianceAuditor], code: 200, input: [reason_code], output: MemberStation, side_effects: ["ELIGIBLE_to_PROBATION transition", "every non-terminal BroadcastWindow owned by the station becomes VIOLATED", "the station's DuesVoteEligibilityProjection row flips to dues_vote_eligible = false", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/restore-eligibility", description: "Restore a PROBATION station to ELIGIBLE when its operations score has recovered", roles: [NetworkComplianceAuditor], code: 200, input: [], output: MemberStation, side_effects: ["PROBATION_to_ELIGIBLE transition", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/suspend", description: "Suspend an ELIGIBLE or PROBATION station, removing it from dues-proposal quorum denominators", roles: [NetworkComplianceAuditor], code: 200, input: [suspension_reason], output: MemberStation, side_effects: ["ELIGIBLE_to_SUSPENDED or PROBATION_to_SUSPENDED transition", "every DuesStructureProposal recomputes its quorum denominator", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/reinstate", description: "Return a SUSPENDED station to UNDER_REVIEW once its dues arrears reach zero", roles: [NetworkComplianceAuditor], code: 200, input: [], output: MemberStation, side_effects: ["SUSPENDED_to_UNDER_REVIEW transition", "dues_arrears_cents is preserved across the transition", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/withdraw", description: "Withdraw an APPLICANT or DEFICIENT station from membership", roles: [StationManager], code: 200, input: [], output: MemberStation, side_effects: ["APPLICANT_to_WITHDRAWN or DEFICIENT_to_WITHDRAWN transition", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/apply-contribution-credit", description: "Convert part of a station's content-sharing credit balance into dues-arrears relief", roles: [StationManager], code: 200, input: [credit_cents], output: MemberStation, side_effects: ["station.contribution_credit_cents -= credit_cents", "station.applied_relief_cents += credit_cents", "station.dues_arrears_cents -= credit_cents", "increments MemberStation.version by 1"]}
  - {method: POST, path: "/network/member-stations/{id}/cost-efficiency-match", description: "Select the offsetting station for a cost-efficiency match using the member_station_standings ranking key", roles: [NetworkGovernanceOfficer], code: 200, input: [match_budget_cents, requesting_station_id], output: MemberStation, side_effects: ["the selected station's matched_budget_cents is debited", "increments MemberStation.version by 1"]}
  - {method: GET, path: "/network/member-station-standings", description: "Read the dense-ranked standings of dues-vote-eligible stations under the member_station_standings ranking key", roles: [PlatformAdmin, NetworkGovernanceOfficer, NetworkComplianceAuditor], code: 200, input: ["limit?", "offset?"], output: "MemberStation[]", side_effects: []}
  - {method: GET, path: "/network/member-stations/{id}/assessments", description: "List the programming fee assessments cascaded onto a station", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: ["assessment_status?", "limit?", "offset?"], output: "ProgrammingFeeAssessment[]", side_effects: []}
  - {method: POST, path: "/network/programming-fee-schedules", description: "Create a fiscal-year programming fee schedule with its tier bounds, rate and annual adjustment", roles: [PlatformAdmin], code: 201, input: [schedule_code, fiscal_year, base_fee_cents, revenue_rate_bps, "market_tier_1_max_rank?", "market_tier_2_max_rank?", "market_tier_3_max_rank?", market_size_multiplier_bps, minimum_fee_cents, maximum_fee_cents, annual_adjustment_bps, "rounding_mode?", effective_from, effective_to], output: ProgrammingFeeSchedule, side_effects: []}
  - {method: GET, path: "/network/programming-fee-schedules", description: "List fee schedules by fiscal year", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: ["fiscal_year?", "limit?", "offset?"], output: "ProgrammingFeeSchedule[]", side_effects: []}
  - {method: GET, path: "/network/programming-fee-schedules/{id}", description: "Read one schedule", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: [], output: ProgrammingFeeSchedule, side_effects: []}
  - {method: GET, path: "/network/programming-fee-schedules/{id}/preview", description: "Compute the provisional and final fee for a station under this schedule without persisting", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: [station_id], output: ProgrammingFeeAssessment, side_effects: ["programming_fee_provisional evaluated", "programming_fee_final_adjusted evaluated"]}
  - {method: POST, path: "/network/programming-fee-assessments/{id}/finalize", description: "Finalize an INITIAL assessment and apply its net charge to the station's dues arrears", roles: [NetworkComplianceAuditor], code: 200, input: [expected_station_version], output: ProgrammingFeeAssessment, side_effects: ["programming_fee_provisional recomputed", "programming_fee_final_adjusted recomputed", "station.dues_arrears_cents += final_fee_cents - drive_deduction_cents", "increments MemberStation.version by 1"]}
  - {method: GET, path: "/network/programming-fee-assessments", description: "List assessments by station, fiscal year or status", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: ["station_id?", "schedule_id?", "fiscal_year?", "assessment_status?", "limit?", "offset?"], output: "ProgrammingFeeAssessment[]", side_effects: []}
  - {method: GET, path: "/network/programming-fee-assessments/{id}", description: "Read one assessment", roles: [PlatformAdmin, StationManager, NetworkComplianceAuditor], code: 200, input: [], output: ProgrammingFeeAssessment, side_effects: []}
  - {method: POST, path: "/network/programming-fee-assessments/{id}/allocate-pool", description: "Distribute the fiscal year's dues pool across the batch via network_dues_pool_allocation and write each station's allocated share", roles: [NetworkGovernanceOfficer], code: 200, input: [total_pot_cents], output: "ProgrammingFeeAssessment[]", side_effects: ["network_dues_pool_allocation evaluated", "rejects with ERR_POOL_OVER_ALLOCATED when the remainder goes negative"]}
  - {method: POST, path: "/network/carriage-agreements", description: "Create a carriage agreement as DRAFT under a station holding ELIGIBLE or PROBATION status", roles: [StationManager], code: 201, input: [station_id, program_code, obligation_type, clearance_deadline, exception_liability_cap_cents], output: CarriageAgreement, side_effects: []}
  - {method: GET, path: "/network/carriage-agreements", description: "List carriage agreements", roles: [StationManager, NetworkComplianceAuditor, NetworkScheduler, NationalProgramEditor], code: 200, input: ["program_code?", "agreement_status?", "limit?", "offset?"], output: "CarriageAgreement[]", side_effects: []}
  - {method: GET, path: "/network/carriage-agreements/{id}", description: "Read one carriage agreement including its rolled-up exception liability and clearance ratio", roles: [StationManager, NetworkComplianceAuditor, NetworkScheduler, NationalProgramEditor], code: 200, input: [], output: CarriageAgreement, side_effects: []}
  - {method: GET, path: "/network/carriage-agreements/{id}/windows", description: "List the BroadcastWindows under one agreement (FK reverse reachability)", roles: [StationManager, NetworkComplianceAuditor, NetworkScheduler], code: 200, input: ["clearance_status?", "limit?", "offset?"], output: "BroadcastWindow[]", side_effects: []}
  - {method: POST, path: "/network/carriage-agreements/{id}/submit", description: "Submit a DRAFT agreement for clearance review", roles: [StationManager], code: 200, input: [], output: CarriageAgreement, side_effects: ["DRAFT_to_SUBMITTED transition", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/review", description: "Advance a SUBMITTED agreement to UNDER_REVIEW", roles: [NetworkComplianceAuditor], code: 200, input: [], output: CarriageAgreement, side_effects: ["SUBMITTED_to_UNDER_REVIEW transition", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/clear", description: "Clear an agreement once every child window is cleared", roles: [NetworkComplianceAuditor], code: 200, input: [], output: CarriageAgreement, side_effects: ["UNDER_REVIEW_to_CLEARED transition", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/publish", description: "Publish a CLEARED agreement: schedule its windows, bump the program's publication cycle and charge each carrying station", roles: [NetworkScheduler], code: 200, input: [], output: CarriageAgreement, side_effects: ["CLEARED_to_CARRIED transition", "every window moves CLEARED to SCHEDULED", "NationalProgram.publication_cycle += 1", "each carrying station's dues_arrears_cents += final_fee_cents - drive_deduction_cents", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/republish", description: "Return a CARRIED agreement to CLEARED and bump the program's publication cycle again", roles: [NetworkScheduler], code: 200, input: [], output: CarriageAgreement, side_effects: ["CARRIED_to_CLEARED transition", "every window moves SCHEDULED to CLEARED", "NationalProgram.publication_cycle += 1", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/lift-publish-embargo", description: "Lift a premiere embargo once the program's premiere instant has passed", roles: [NetworkComplianceAuditor], code: 200, input: [], output: CarriageAgreement, side_effects: ["EMBARGOED_to_CARRIED transition", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/expire", description: "Expire a CARRIED agreement past its clearance deadline and miss its scheduled windows", roles: [NetworkComplianceAuditor], code: 200, input: [], output: CarriageAgreement, side_effects: ["CARRIED_to_EXPIRED transition", "every SCHEDULED window moves to MISSED", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/carriage-agreements/{id}/terminate", description: "Terminate a CLEARED or CARRIED agreement, rejecting its windows and releasing their uplink capacity", roles: [NetworkComplianceAuditor], code: 200, input: [termination_reason], output: CarriageAgreement, side_effects: ["CLEARED_to_TERMINATED or CARRIED_to_TERMINATED transition", "every DRAFT, PENDING_CLEARANCE or CLEARED window moves to REJECTED", "every linked UplinkSlot moves to RELEASED", "increments CarriageAgreement.version by 1"]}
  - {method: POST, path: "/network/broadcast-windows", description: "Create a broadcast window under a carriage agreement with overlap, embargo and program-code checks", roles: [StationManager], code: 201, input: [parent_agreement_id, station_id, program_code, window_start, window_end, "embargo_until?"], output: BroadcastWindow, side_effects: []}
  - {method: GET, path: "/network/broadcast-windows", description: "List broadcast windows by station, program or clearance status (FK reverse reachability)", roles: [StationManager, NetworkComplianceAuditor, NetworkScheduler], code: 200, input: ["station_id?", "program_code?", "clearance_status?", "limit?", "offset?"], output: "BroadcastWindow[]", side_effects: []}
  - {method: GET, path: "/network/broadcast-windows/{id}", description: "Read one broadcast window", roles: [StationManager, NetworkComplianceAuditor, NetworkScheduler], code: 200, input: [], output: BroadcastWindow, side_effects: []}
  - {method: POST, path: "/network/broadcast-windows/{id}/request-clearance", description: "Move a DRAFT window to PENDING_CLEARANCE after embargo and interval checks", roles: [StationManager], code: 200, input: [], output: BroadcastWindow, side_effects: ["DRAFT_to_PENDING_CLEARANCE transition", "increments BroadcastWindow.version by 1"]}
  - {method: POST, path: "/network/broadcast-windows/{id}/clear", description: "Clear a PENDING_CLEARANCE window and promote its uplink reservation to SCHEDULED", roles: [NetworkComplianceAuditor], code: 200, input: [], output: BroadcastWindow, side_effects: ["PENDING_CLEARANCE_to_CLEARED transition", "window.is_cleared recomputed to true", "the linked UplinkSlot moves RESERVED to SCHEDULED", "increments BroadcastWindow.version by 1"]}
  - {method: POST, path: "/network/broadcast-windows/{id}/reject", description: "Reject a PENDING_CLEARANCE window and accrue its exception liability", roles: [NetworkComplianceAuditor], code: 200, input: [rejection_reason], output: BroadcastWindow, side_effects: ["PENDING_CLEARANCE_to_REJECTED transition", "exception_liability_accrual recomputed", "carriage_clearance_ratio recomputed on the parent agreement", "increments BroadcastWindow.version by 1"]}
  - {method: POST, path: "/network/broadcast-windows/{id}/remediating", description: "Return a REJECTED window to DRAFT for another clearance pass", roles: [StationManager], code: 200, input: [], output: BroadcastWindow, side_effects: ["REJECTED_to_DRAFT transition", "window.rejection_reason cleared", "increments BroadcastWindow.version by 1"]}
  - {method: POST, path: "/network/broadcast-windows/{id}/expire", description: "Mark a SCHEDULED window MISSED once its end instant has passed", roles: [NetworkComplianceAuditor], code: 200, input: [], output: BroadcastWindow, side_effects: ["SCHEDULED_to_MISSED transition", "exception_liability_accrual recomputed with the MISSED_SLOT basis", "carriage_clearance_ratio recomputed on the parent agreement", "increments BroadcastWindow.version by 1"]}
  - {method: POST, path: "/network/distribution-feeds", description: "Create a satellite, digital or hybrid distribution feed", roles: [NetworkScheduler], code: 201, input: [feed_code, feed_type, total_capacity_units, max_reserved_capacity_ratio], output: DistributionFeed, side_effects: []}
  - {method: GET, path: "/network/distribution-feeds", description: "List distribution feeds with their reserved capacity and congestion flag", roles: [NetworkScheduler, NetworkComplianceAuditor, PlatformAdmin], code: 200, input: ["feed_type?", "feed_status?", "limit?", "offset?"], output: "DistributionFeed[]", side_effects: []}
  - {method: GET, path: "/network/distribution-feeds/{id}", description: "Read one feed", roles: [NetworkScheduler, NetworkComplianceAuditor, PlatformAdmin], code: 200, input: [], output: DistributionFeed, side_effects: []}
  - {method: GET, path: "/network/distribution-feeds/{id}/uplink-slots", description: "List the uplink slots on one feed (FK reverse reachability)", roles: [NetworkScheduler, NetworkComplianceAuditor], code: 200, input: ["slot_status?", "limit?", "offset?"], output: "UplinkSlot[]", side_effects: []}
  - {method: POST, path: "/network/distribution-feeds/{id}/bring-online", description: "Bring a PLANNED feed ONLINE", roles: [NetworkScheduler], code: 200, input: [], output: DistributionFeed, side_effects: ["PLANNED_to_ONLINE transition", "feed.crowded recomputed"]}
