# =============================================================================
# SCAFFOLD.yaml — task_2735 Lateral Partner Hiring & Portable Business Diligence
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines · §1.2.1 Concurrency
# §1.3 Calculations · §1.4 Validations · §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2735. Lateral Partner Hiring & Portable Business Diligence (law firm lateral recruiting committee):
  candidate sourcing and confidential approach with search firm engagement terms, lateral partner
  questionnaire covering client list, billings, collections, rates and matter types, portable business
  validation through historical collection data and client concentration analysis, conflicts clearance
  across the candidate's client base with waiver strategy and matter declination consequences,
  compensation offer modeling against expected contribution and integration cost, notice period,
  client transition and non-solicitation constraints at the prior firm, integration plan with practice
  group assignment and cross-selling introductions, post-hire performance tracking against the
  business plan

domain_name: "lateral-partner-hiring"
api_prefix: "/lateral-hiring"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: "expert_plus"
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: graph
  # ClientBookEntry ← CollectionRecord → Candidate is a cross-aggregate diamond;
  # ConflictCheck → ConflictWaiver → MatterDeclination → ClientBookEntry →
  # PortabilityAssessment → CompensationOffer forms a directed propagation graph
  # that re-enters PracticeGroup (budget ledger) and SearchFirmEngagement (fee).
  # Not a tree: CollectionRecord, MatterDeclination, IntegrationPlan and
  # PerformanceReview each carry two independent FKs into different aggregates.

  state_machine_shape: cyclic
  # LateralQuestionnaire: SUBMITTED → UNDER_REVIEW → REVISION_REQUESTED → SUBMITTED (bounded loop).
  # CompensationOffer: DRAFTED → COMMITTEE_REVIEW → COUNTER_REQUESTED → DRAFTED (bounded loop),
  #   plus a branching fork COMMITTEE_REVIEW → {APPROVED, REJECTED, COUNTER_REQUESTED}.
  # Candidate: two parallel dimensions on one row — pipeline_status × clearance_status.
  # ConflictCheck: PENDING → WAIVER_PENDING → {CLEAR, BLOCKED}, and BLOCKED → CLEAR on rescind.

  relationship_patterns:
    - one_to_many        # Candidate → LateralQuestionnaire → ClientBookEntry → ConflictCheck
    - cross_aggregate    # CollectionRecord references both Candidate and ClientBookEntry
    - polymorphic_window # CollectionRecord.record_type selects which aggregation consumes the row

  role_model: segregation_of_duties
  # The sponsoring user (Candidate.sponsor_user_id) may not vote on that candidate's offer,
  # and the user who created an offer may not finalize it. Both are enforced on X-User-ID.

  consistency_model: immediate
  # Every cascade, ledger adjustment and derived-field recompute lands inside the
  # triggering request. Staleness is modelled EXPLICITLY as a status enum
  # (PortabilityAssessment.status = STALE, CompensationOffer.status =
  # REPRICE_REQUIRED), never as asynchronous lag.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: PracticeGroup
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Practice group display name, e.g. 'Litigation'."
        constraints: "1-120 chars; unique across PracticeGroup"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Gate on lateral activity for this group."
        constraints: "OPEN | HIRING_FROZEN"
      - name: guarantee_budget_total_usd
        type: number
        source: input
        description: "Total annual guaranteed-compensation budget the group may commit to laterals."
        constraints: ">= 0; 2 decimal places"
      - name: available_guarantee_budget_usd
        type: number
        source: computed
        description: "Unreserved, uncommitted portion of guarantee_budget_total_usd. See calculations.guarantee_budget_ledger."
      - name: reserved_guarantee_budget_usd
        type: number
        source: computed
        default: 0.00
        description: "Sum of guaranteed_comp_usd over CompensationOffer rows in status COMMITTEE_REVIEW for candidates targeting this group."
      - name: committed_guarantee_total_usd
        type: number
        source: computed
        default: 0.00
        description: "Sum of guaranteed_comp_usd over CompensationOffer rows in status ACCEPTED for candidates targeting this group."
      - name: onboarding_capacity
        type: integer
        source: input
        description: "Maximum number of simultaneously ACTIVE IntegrationPlan rows this group can absorb."
        constraints: ">= 1"
      - name: active_onboarding_count
        type: integer
        source: computed
        default: 0
        description: "Count of IntegrationPlan rows with practice_group_id == this group and status == ACTIVE."
      - name: leverage_ratio
        type: number
        source: input
        description: "Associates-per-partner ratio; drives the expected-contribution uplift branch."
        constraints: "> 0; 2 decimal places"
      - name: target_standard_rate_usd
        type: number
        source: input
        description: "The group's standard hourly rate for partners; numerator of the rate-alignment factor."
        constraints: "> 0; 2 decimal places"

  - name: SearchFirm
    parent: null
    common_fields: true
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Legal recruiting firm name."
        constraints: "1-120 chars; unique across SearchFirm"
      - name: max_fee_pct
        type: number
        source: input
        description: "Highest placement-fee percentage this firm is permitted to charge on any engagement."
        constraints: "0 < max_fee_pct <= 0.40; 4 decimal places"
      - name: max_concurrent_engagements
        type: integer
        source: input
        description: "Aggregate capacity: how many of this firm's engagements may have time-overlapping exclusivity windows."
        constraints: ">= 1"
      - name: engagement_count
        type: integer
        source: computed
        default: 0
        description: "Count of SearchFirmEngagement rows with search_firm_id == this firm, any status."

  - name: SearchFirmEngagement
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: search_firm_id
        type: string
        source: input
        description: "FK -> SearchFirm.id; the retained recruiter."
      - name: practice_group_id
        type: string
        source: input
        description: "FK -> PracticeGroup.id; the group whose lateral search is exclusive to this engagement."
      - name: fee_pct
        type: number
        source: input
        description: "Placement fee percentage applied to the fee base selected by calculations.search_fee_liability."
        constraints: "0 < fee_pct <= SearchFirm.max_fee_pct; 4 decimal places"
      - name: fee_cap_usd
        type: number
        source: input
        description: "Hard ceiling on fee_amount_usd."
        constraints: "> 0; 2 decimal places"
      - name: exclusivity_start_date
        type: datetime
        source: input
        description: "Inclusive start of the exclusivity window (ISO 8601 UTC, 3 fractional digits)."
      - name: exclusivity_end_date
        type: datetime
        source: input
        description: "EXCLUSIVE end of the exclusivity window; the window is half-open [start, end)."
        constraints: "exclusivity_end_date > exclusivity_start_date"
      - name: tail_off_days
        type: integer
        source: input
        description: "Fee-protection tail after exclusivity_end_date; also the mandatory quiet gap before the next engagement on the same practice group may start."
        constraints: ">= 0 and <= 365"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Engagement lifecycle."
        constraints: "ACTIVE | EXPIRED | TERMINATED"
      - name: fee_status
        type: enum
        source: computed
        default: NOT_DUE
        description: "Whether a placement fee has crystallised."
        constraints: "NOT_DUE | FEE_DUE | FEE_WAIVED"
      - name: fee_basis
        type: enum
        source: computed
        default: NONE
        description: "Which variant of calculations.search_fee_liability produced fee_amount_usd."
        constraints: "NONE | DIRECT_PLACEMENT | TAIL_OFF_CLAIM"
      - name: fee_amount_usd
        type: number
        source: computed
        default: 0.00
        description: "Crystallised placement fee. See calculations.search_fee_liability."

  - name: Candidate
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Candidate partner's name."
        constraints: "1-120 chars"
      - name: prior_firm_name
        type: string
        source: input
        description: "Firm the candidate would depart from."
        constraints: "1-120 chars"
      - name: target_practice_group_id
        type: string
        source: input
        description: "FK -> PracticeGroup.id; the group that would receive the lateral."
      - name: sourcing_engagement_id
        type: string
        source: input
        description: "FK -> SearchFirmEngagement.id; the engagement that surfaced this candidate."
      - name: sponsor_user_id
        type: string
        source: input
        description: "Opaque X-User-ID of the internal sponsor. Segregation of duties: this user may not cast a CommitteeVote on this candidate's offers."
        constraints: "1-64 chars"
      - name: current_standard_rate_usd
        type: number
        source: input
        description: "Candidate's standard hourly rate at the prior firm; denominator of the rate-alignment factor."
        constraints: "> 0; 2 decimal places"
      - name: notice_period_days
        type: integer
        source: input
        description: "Contractual notice owed to the prior firm; drives earliest_start_date and the ramp branch of expected contribution."
        constraints: ">= 0 and <= 365"
      - name: non_solicit_days
        type: integer
        source: input
        description: "Days after resignation_date during which the candidate may not solicit prior-firm clients; gates CrossSellIntroduction slots."
        constraints: ">= 0 and <= 730"
      - name: approach_confidential
        type: boolean
        source: input
        default: true
        description: "When true the approach is confidential: no CrossSellIntroduction may name a prior-firm client whose ACTIVE ClientBookEntry is still CONSENT_PENDING."
      - name: pipeline_status
        type: enum
        source: system
        default: SOURCED
        description: "Recruiting-pipeline dimension. Evolves independently of clearance_status."
        constraints: "SOURCED | APPROACHED | DILIGENCE | OFFER_OUT | HIRED | DECLINED | WITHDRAWN"
      - name: clearance_status
        type: enum
        source: computed
        default: NOT_STARTED
        description: "Conflicts-clearance dimension, derived from this candidate's ConflictCheck rows. Evolves independently of pipeline_status."
        constraints: "NOT_STARTED | IN_PROGRESS | CLEARED | BLOCKED"
      - name: resignation_date
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the candidate accepted an offer; null before acceptance."
      - name: earliest_start_date
        type: datetime
        source: computed
        default: null
        description: "resignation_date + notice_period_days. Null while resignation_date is null."
      - name: hire_date
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which pipeline_status became HIRED; equals resignation_date."
      - name: open_offer_id
        type: string
        source: system
        default: null
        description: "Id of the CompensationOffer for this candidate that is not in a terminal status; null when none."

  - name: LateralQuestionnaire
    parent: Candidate
    common_fields: true
    entity_kind: resource
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the LPQ respondent."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "LPQ lifecycle with a bounded revision loop."
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | ACCEPTED | ABANDONED"
      - name: revision_round
        type: integer
        source: computed
        default: 0
        description: "Number of times request-revision has fired on this LPQ. Bounded by MAX_REVISION_ROUNDS."
      - name: declared_prior_year_billings_usd
        type: number
        source: input
        description: "Candidate-declared prior-year billings across the whole book."
        constraints: ">= 0; 2 decimal places"
      - name: declared_prior_year_collections_usd
        type: number
        source: input
        description: "Candidate-declared prior-year collections across the whole book."
        constraints: ">= 0 and <= declared_prior_year_billings_usd; 2 decimal places"
      - name: declared_realization_rate
        type: number
        source: input
        description: "Candidate-declared blended realization rate."
        constraints: "0 < declared_realization_rate <= 1.0000; 4 decimal places"
      - name: primary_matter_types
        type: array
        source: input
        description: "Matter-type labels the candidate self-identifies with (array of strings)."
        constraints: "1-10 entries; each 1-60 chars"
      - name: entry_count
        type: integer
        source: computed
        default: 0
        description: "Count of ClientBookEntry rows with questionnaire_id == this LPQ and status == ACTIVE."
      - name: latest_assessment_id
        type: string
        source: system
        default: null
        description: "Denormalized pointer (NOT an FK declaration) to the most recently created PortabilityAssessment on this LPQ; null before the first assessment."

  - name: ClientBookEntry
    parent: LateralQuestionnaire
    common_fields: true
    entity_kind: resource
    fields:
      - name: questionnaire_id
        type: string
        source: input
        description: "FK -> LateralQuestionnaire.id; the LPQ this client line belongs to."
      - name: client_name
        type: string
        source: input
        description: "Client entity name."
        constraints: "1-120 chars; unique per questionnaire_id among status == ACTIVE rows"
      - name: relationship_role
        type: enum
        source: input
        description: "Candidate's role on the relationship; selects role_factor in calculations.entry_validated_portable_amount."
        constraints: "BILLING_ATTORNEY | RELATIONSHIP_PARTNER | SERVICE_PARTNER"
      - name: client_consent_status
        type: enum
        source: input
        default: CONSENT_PENDING
        description: "Whether the client has confirmed it would move; selects consent_factor."
        constraints: "CONSENT_PENDING | CONSENT_CONFIRMED"
      - name: claimed_annual_billings_usd
        type: number
        source: input
        description: "Candidate-claimed annual billings for this client."
        constraints: "> 0; 2 decimal places"
      - name: claimed_portability_pct
        type: number
        source: input
        description: "Candidate-claimed share of this client that would move."
        constraints: "0 < claimed_portability_pct <= 1.0000; 4 decimal places"
      - name: claimed_realization_rate
        type: number
        source: input
        description: "Candidate-claimed realization rate on this client; capped at REALIZATION_CAP by the validated variant."
        constraints: "0 < claimed_realization_rate <= 1.0000; 4 decimal places"
      - name: matter_types
        type: array
        source: input
        description: "Ordered array of matter-type strings for this client. Array ORDER is significant: the rounding remainder in calculations.declination_revenue_split lands on index 0."
        constraints: "1-6 entries; each 1-60 chars; no duplicates"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "Soft-delete flag. WITHDRAWN rows are excluded from every aggregation and from list responses unless include_withdrawn=true."
        constraints: "ACTIVE | WITHDRAWN"
      - name: portable_status
        type: enum
        source: computed
        default: UNVALIDATED
        description: "Set to VALIDATED when an assessment computes this entry, and to DECLINED when a ConflictCheck on this entry reaches BLOCKED."
        constraints: "UNVALIDATED | VALIDATED | DECLINED"
      - name: baseline_portable_amount_usd
        type: number
        source: computed
        default: 0.00
        description: "Validated portable amount IGNORING portable_status. Conserved across declination and rescission. See calculations.entry_validated_portable_amount."
      - name: validated_portable_amount_usd
        type: number
        source: computed
        default: 0.00
        description: "baseline_portable_amount_usd, or 0.00 when portable_status == DECLINED."
      - name: verified_record_count
        type: integer
        source: computed
        default: 0
        description: "Count of CollectionRecord rows with client_book_entry_id == this entry, record_type == HISTORICAL and status == VERIFIED."

  - name: CollectionRecord
    parent: null
    common_fields: false
    entity_kind: event
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the partner whose collections this row reports."
      - name: client_book_entry_id
        type: string
        source: input
        default: null
        description: "FK -> ClientBookEntry.id; null for POST_HIRE firm-ledger rows that are not tied to a declared client line."
      - name: record_type
        type: enum
        source: input
        description: "HISTORICAL rows feed portable-business validation; POST_HIRE rows feed performance tracking."
        constraints: "HISTORICAL | POST_HIRE"
      - name: period_end_date
        type: datetime
        source: input
        description: "End instant of the collection period this row reports (ISO 8601 UTC, 3 fractional digits)."
      - name: amount_usd
        type: number
        source: input
        description: "Cash collected in the period."
        constraints: ">= 0; 2 decimal places"
      - name: status
        type: enum
        source: input
        default: UNVERIFIED
        description: "Provenance verification. Only VERIFIED rows enter any aggregation. Immutable once written."
        constraints: "UNVERIFIED | VERIFIED"
      - name: source
        type: enum
        source: input
        description: "Where the figure came from."
        constraints: "PRIOR_FIRM_STATEMENT | CANDIDATE_ATTESTATION | FIRM_LEDGER"

  - name: PortabilityAssessment
    parent: LateralQuestionnaire
    common_fields: true
    entity_kind: resource
    fields:
      - name: questionnaire_id
        type: string
        source: input
        description: "FK -> LateralQuestionnaire.id; the LPQ whose client book this assessment values."
      - name: baseline_date
        type: datetime
        source: input
        description: "EXCLUSIVE upper bound of the historical-collections lookback window."
      - name: lookback_start_date
        type: datetime
        source: computed
        description: "baseline_date minus LOOKBACK_YEARS calendar years; INCLUSIVE lower bound. Window is half-open [lookback_start_date, baseline_date)."
      - name: governing_basis
        type: enum
        source: input
        default: VALIDATED
        description: "Which dual variant drives adjusted_portable_total_usd and therefore offer economics."
        constraints: "SELF_REPORTED | VALIDATED"
      - name: entry_count_in_scope
        type: integer
        source: computed
        description: "Count of ClientBookEntry rows with status == ACTIVE on this LPQ at assessment time."
      - name: self_reported_total_usd
        type: number
        source: computed
        description: "SELF_REPORTED variant total. See calculations.portable_book_valuation."
      - name: validated_portable_total_usd
        type: number
        source: computed
        description: "VALIDATED variant total over non-declined entries."
      - name: gross_baseline_total_usd
        type: number
        source: computed
        description: "Sum of baseline_portable_amount_usd over in-scope entries. Conserved quantity: validated_portable_total_usd + declined_portable_total_usd == gross_baseline_total_usd."
      - name: declined_portable_total_usd
        type: number
        source: computed
        default: 0.00
        description: "Sum of baseline_portable_amount_usd over in-scope entries with portable_status == DECLINED."
      - name: variance_pct
        type: number
        source: computed
        description: "(self_reported_total_usd - validated_portable_total_usd) / self_reported_total_usd, 4 dp."
      - name: top_client_share
        type: number
        source: computed
        description: "Largest single entry's baseline share of gross_baseline_total_usd, 4 dp. Drives concentration_grade."
      - name: top3_client_share
        type: number
        source: computed
        description: "Top-3 entries' combined baseline share, 4 dp. REPORTED ONLY — not an input to concentration_grade."
      - name: concentration_grade
        type: enum
        source: computed
        description: "HIGH when top_client_share >= 0.30; MEDIUM when >= 0.20; else LOW."
        constraints: "LOW | MEDIUM | HIGH"
      - name: concentration_haircut_pct
        type: number
        source: computed
        description: "0.15 for HIGH, 0.07 for MEDIUM, 0.00 for LOW."
      - name: adjusted_portable_total_usd
        type: number
        source: computed
        description: "Governing-basis total after the concentration haircut. Feeds calculations.expected_contribution_model."
      - name: status
        type: enum
        source: system
        default: CURRENT
        description: "CURRENT until a newer assessment supersedes it or an upstream entry amount changes."
        constraints: "CURRENT | STALE | SUPERSEDED"

  - name: ConflictCheck
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: client_book_entry_id
        type: string
        source: input
        description: "FK -> ClientBookEntry.id; the client line being cleared."
      - name: adverse_party_name
        type: string
        source: input
        description: "Existing firm client or matter adverse to the candidate's client."
        constraints: "1-120 chars"
      - name: affected_matter_types
        type: array
        source: input
        description: "Subset of ClientBookEntry.matter_types the conflict touches (array of strings)."
        constraints: "1-6 entries; every element MUST appear in the entry's matter_types"
      - name: severity
        type: enum
        source: input
        description: "Ethical-wall feasibility class."
        constraints: "DIRECT_ADVERSE | POSITIONAL | IMPUTED"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Clearance lifecycle."
        constraints: "PENDING | CLEAR | WAIVER_PENDING | BLOCKED"
      - name: resolution_note
        type: string
        source: input
        default: null
        description: "Free-text clearance rationale recorded on clear / grant / refuse."
        constraints: "0-500 chars"

  - name: ConflictWaiver
    parent: ConflictCheck
    common_fields: true
    entity_kind: resource
    fields:
      - name: conflict_check_id
        type: string
        source: input
        description: "FK -> ConflictCheck.id; the check this waiver would resolve."
      - name: waiver_strategy
        type: enum
        source: input
        description: "How the conflict would be cured."
        constraints: "ADVANCE_CONSENT | ETHICAL_WALL | MATTER_CARVE_OUT"
      - name: requested_from_client
        type: string
        source: input
        description: "Name of the client asked to sign the waiver."
        constraints: "1-120 chars"
      - name: response_deadline_date
        type: datetime
        source: input
        description: "Instant after which an undecided waiver auto-expires on the next clock advance."
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Waiver lifecycle."
        constraints: "REQUESTED | GRANTED | REFUSED | EXPIRED"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of grant / refuse / expiry."

  - name: MatterDeclination
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: conflict_check_id
        type: string
        source: input
        description: "FK -> ConflictCheck.id; the BLOCKED check that forced this declination."
      - name: client_book_entry_id
        type: string
        source: input
        description: "FK -> ClientBookEntry.id; the client line whose matter is declined."
      - name: matter_type
        type: string
        source: system
        description: "One element of ClientBookEntry.matter_types, copied at creation."
      - name: foregone_annual_revenue_usd
        type: number
        source: computed
        description: "This matter's share of the entry's baseline_portable_amount_usd. See calculations.declination_revenue_split."
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE while the declination stands; RESCINDED after the client later consents."
        constraints: "ACTIVE | RESCINDED"
      - name: rescinded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of rescission."

  - name: CompensationOffer
    parent: Candidate
    common_fields: true
    entity_kind: resource
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the offeree."
      - name: portability_assessment_id
        type: string
        source: input
        description: "FK -> PortabilityAssessment.id; the assessment whose adjusted_portable_total_usd this offer prices against."
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CommitteeChair who created the offer. Segregation of duties: this user may not finalize the offer."
      - name: guaranteed_comp_usd
        type: number
        source: input
        description: "First-year guaranteed compensation. Reserved against PracticeGroup budget while in COMMITTEE_REVIEW."
        constraints: "> 0; 2 decimal places"
      - name: signing_bonus_usd
        type: number
        source: input
        description: "One-time signing bonus. Included in the DIRECT_PLACEMENT fee base, excluded from TAIL_OFF_CLAIM."
        constraints: ">= 0; 2 decimal places"
      - name: round_number
        type: integer
        source: computed
        default: 1
        description: "Negotiation round; incremented by the counter transition. Bounded by MAX_NEGOTIATION_ROUNDS."
      - name: status
        type: enum
        source: system
        default: DRAFTED
        description: "Offer lifecycle: cyclic (COUNTER_REQUESTED -> DRAFTED) plus a three-way fork out of COMMITTEE_REVIEW."
        constraints: "DRAFTED | COMMITTEE_REVIEW | APPROVED | REJECTED | COUNTER_REQUESTED | REPRICE_REQUIRED | ACCEPTED | LAPSED"
      - name: eligible_voter_count
        type: integer
        source: system
        default: null
        description: "Committee roll size snapshotted at the most recent submit; quorum denominator. Null before first submit."
      - name: adjusted_portable_total_snapshot_usd
        type: number
        source: computed
        description: "Copy of PortabilityAssessment.adjusted_portable_total_usd taken at offer creation. NOT refreshed when the assessment goes STALE."
      - name: expected_contribution_usd
        type: number
        source: computed
        description: "See calculations.expected_contribution_model."
      - name: total_first_year_comp_usd
        type: number
        source: computed
        description: "STEP 1 of calculations.net_first_year_economics: guaranteed_comp_usd + signing_bonus_usd."
      - name: search_fee_amount_usd
        type: number
        source: computed
        description: "STEP 2: the search fee this offer would crystallise. See calculations.search_fee_liability."
      - name: integration_cost_total_usd
        type: number
        source: computed
        description: "STEP 3. See calculations.net_first_year_economics."
      - name: net_first_year_economics_usd
        type: number
        source: computed
        description: "STEP 4: expected_contribution_usd - total_first_year_comp_usd - integration_cost_total_usd."
      - name: guarantee_true_up_amount_usd
        type: number
        source: computed
        default: 0.00
        description: "STEP 5, tiered on net_first_year_economics_usd. NEVER fed back into STEPS 1-4."
      - name: votes_cast_total
        type: integer
        source: computed
        default: 0
        description: "Lifetime count of CommitteeVote rows on this offer across all rounds. Conserved: == active_vote_count + voided_vote_count."
      - name: active_vote_count
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeVote rows on this offer with status == ACTIVE."
      - name: voided_vote_count
        type: integer
        source: computed
        default: 0
        description: "Count of CommitteeVote rows on this offer with status == VOIDED."
      - name: accepted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of candidate acceptance."

  - name: CommitteeVote
    parent: CompensationOffer
    common_fields: true
    entity_kind: event
    fields:
      - name: offer_id
        type: string
        source: input
        description: "FK -> CompensationOffer.id; the offer being voted on."
      - name: voter_user_id
        type: string
        source: system
        description: "X-User-ID of the CommitteeMember or CommitteeChair who cast the vote."
      - name: decision
        type: enum
        source: input
        description: "Vote value."
        constraints: "APPROVE | REJECT | ABSTAIN"
      - name: round_number
        type: integer
        source: input
        description: "Negotiation round the voter believes is open; MUST equal CompensationOffer.round_number."
        constraints: ">= 1"
      - name: rationale
        type: string
        source: input
        default: null
        description: "Optional written rationale."
        constraints: "0-500 chars"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE while the vote counts toward the current round; VOIDED after a counter resets the round."
        constraints: "ACTIVE | VOIDED"

  - name: IntegrationPlan
    parent: Candidate
    common_fields: true
    entity_kind: resource
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the incoming lateral."
      - name: practice_group_id
        type: string
        source: input
        description: "FK -> PracticeGroup.id; the assigned practice group. Consumes one unit of onboarding_capacity while ACTIVE."
      - name: offer_id
        type: string
        source: input
        description: "FK -> CompensationOffer.id; the accepted offer this plan implements."
      - name: onboarding_start_date
        type: datetime
        source: input
        description: "INCLUSIVE start of the onboarding window; CrossSellIntroduction slots must be contained in [start, end]."
      - name: onboarding_end_date
        type: datetime
        source: input
        description: "INCLUSIVE end of the onboarding window (closed interval)."
        constraints: "onboarding_end_date > onboarding_start_date"
      - name: planned_standard_rate_usd
        type: number
        source: input
        description: "Rate assumed by the business plan; denominator of the RATE_ADJUSTED_BASIS variance variant."
        constraints: "> 0; 2 decimal places"
      - name: cross_sell_target_count
        type: integer
        source: input
        description: "Number of cross-selling introductions the business plan commits to."
        constraints: ">= 0 and <= 50"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Plan lifecycle."
        constraints: "DRAFT | ACTIVE | COMPLETED | ABANDONED"
      - name: introduction_count
        type: integer
        source: computed
        default: 0
        description: "Count of CrossSellIntroduction rows on this plan with status IN {PROPOSED, COMPLETED}."
      - name: completed_introduction_count
        type: integer
        source: computed
        default: 0
        description: "Count of CrossSellIntroduction rows on this plan with status == COMPLETED."

  - name: CrossSellIntroduction
    parent: IntegrationPlan
    common_fields: true
    entity_kind: resource
    fields:
      - name: integration_plan_id
        type: string
        source: input
        description: "FK -> IntegrationPlan.id; the plan whose onboarding window contains this slot."
      - name: target_client_name
        type: string
        source: input
        description: "Existing firm client being introduced to the lateral."
        constraints: "1-120 chars"
      - name: introducing_partner_name
        type: string
        source: input
        description: "Existing partner making the introduction."
        constraints: "1-120 chars"
      - name: slot_start_at
        type: datetime
        source: input
        description: "INCLUSIVE start of the introduction slot. Slots on one plan are pairwise non-overlapping under CLOSED interval semantics."
      - name: slot_end_at
        type: datetime
        source: input
        description: "INCLUSIVE end of the introduction slot."
        constraints: "slot_end_at > slot_start_at"
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Introduction lifecycle."
        constraints: "PROPOSED | COMPLETED | CANCELLED"
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of completion; bounds cross_sell_credit_count in a PerformanceReview period."

  - name: PerformanceReview
    parent: Candidate
    common_fields: true
    entity_kind: resource
    fields:
      - name: candidate_id
        type: string
        source: input
        description: "FK -> Candidate.id; the hired lateral under review."
      - name: integration_plan_id
        type: string
        source: input
        description: "FK -> IntegrationPlan.id; the business plan the actuals are measured against."
      - name: period_start_date
        type: datetime
        source: input
        description: "INCLUSIVE start of the review period."
      - name: period_end_date
        type: datetime
        source: input
        description: "INCLUSIVE end of the review period (closed interval)."
        constraints: "period_end_date > period_start_date"
      - name: period_days
        type: integer
        source: computed
        description: "Inclusive day count: (period_end_date.date - period_start_date.date).days + 1."
      - name: variance_basis
        type: enum
        source: input
        description: "Which dual variant of calculations.performance_variance is applied."
        constraints: "PLAN_BASIS | RATE_ADJUSTED_BASIS"
      - name: realized_standard_rate_usd
        type: number
        source: input
        description: "Actual standard rate realized in the period; numerator of the RATE_ADJUSTED_BASIS adjustment."
        constraints: "> 0; 2 decimal places"
      - name: actual_collections_usd
        type: number
        source: computed
        description: "Sum of VERIFIED POST_HIRE CollectionRecord.amount_usd whose period_end_date falls in the CLOSED review period."
      - name: plan_target_usd
        type: number
        source: computed
        description: "Pro-rated expected contribution for the period. See calculations.performance_variance."
      - name: plan_target_adjusted_usd
        type: number
        source: computed
        description: "plan_target_usd scaled by realized/planned rate. Populated for BOTH variants; only RATE_ADJUSTED_BASIS uses it for variance_usd."
      - name: variance_usd
        type: number
        source: computed
        description: "actual_collections_usd minus the basis-selected target."
      - name: attainment_pct
        type: number
        source: computed
        description: "actual_collections_usd / plan_target_usd, 4 dp; 0.0000 when plan_target_usd == 0."
      - name: cross_sell_credit_count
        type: integer
        source: computed
        description: "Count of COMPLETED CrossSellIntroduction rows on integration_plan_id with completed_at <= period_end_date."
      - name: performance_flag
        type: enum
        source: computed
        description: "ON_PLAN when attainment_pct >= 0.90; WATCH when >= 0.70; else BELOW_PLAN."
        constraints: "ON_PLAN | WATCH | BELOW_PLAN"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: SearchFirmEngagement
    state_field: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED, TERMINATED]
    shape: linear_with_system_expiry
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /lateral-hiring/search-firm-engagements"
        actor: RecruitingCoordinator
        preconditions:
          - "SearchFirm exists; PracticeGroup exists"
          - "fee_pct <= SearchFirm.max_fee_pct"
          - "No SearchFirmEngagement with the same practice_group_id and status == ACTIVE whose exclusivity window (half-open) overlaps the requested window, and requested exclusivity_start_date >= existing.exclusivity_end_date + existing.tail_off_days days"
          - "Count of SearchFirmEngagement rows with the same search_firm_id, status == ACTIVE, whose CLOSED exclusivity window [start, end] intersects the requested CLOSED window, is < SearchFirm.max_concurrent_engagements"
        side_effects:
          - "SearchFirm.engagement_count incremented by 1"
          - "increments SearchFirm.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /lateral-hiring/search-firm-engagements/{engagement_id}/terminate"
        actor: RecruitingCoordinator
        preconditions:
          - "engagement.status == ACTIVE"
        side_effects:
          - "fee_status := FEE_WAIVED; fee_basis := NONE; fee_amount_usd := 0.00"
          - "Candidate rows with sourcing_engagement_id == this engagement and pipeline_status IN {SOURCED, APPROACHED} are unaffected (they remain sourceable) — no cascade"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /lateral-hiring/_clock/set_current_utc advances the clock to or past exclusivity_end_date + tail_off_days days"
        actor: system
        preconditions:
          - "engagement.status == ACTIVE"
          - "new_clock >= exclusivity_end_date + tail_off_days days"
        side_effects:
          - "fee_status unchanged (a fee already crystallised as FEE_DUE survives expiry)"
        note: "Applied to every qualifying engagement in one clock advance, ordered by created_at ASC."

  - entity: Candidate
    state_field: pipeline_status
    initial_state: SOURCED
    terminal_states: [HIRED, DECLINED, WITHDRAWN]
    shape: branching_parallel_dimension
    note: "Dimension 1 of 2 on the Candidate row. Evolves independently of clearance_status; neither dimension's transitions read the other's current value except where a precondition says so explicitly."
    transitions:
      - from: null
        to: SOURCED
        trigger: "POST /lateral-hiring/candidates"
        actor: RecruitingCoordinator
        preconditions:
          - "target PracticeGroup exists and status == OPEN"
          - "sourcing SearchFirmEngagement exists and status == ACTIVE"
        side_effects:
          - "clearance_status := NOT_STARTED"
      - from: SOURCED
        to: APPROACHED
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/approach"
        actor: RecruitingCoordinator
        preconditions:
          - "candidate.pipeline_status == SOURCED"
          - "sourcing SearchFirmEngagement.status == ACTIVE"
          - "current clock is inside the half-open exclusivity window [exclusivity_start_date, exclusivity_end_date) of the sourcing engagement"
        side_effects:
          - "approach_confidential retained as recorded at creation"
      - from: APPROACHED
        to: DILIGENCE
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/questionnaires issues the first LPQ"
        actor: system
        preconditions:
          - "candidate.pipeline_status == APPROACHED"
        side_effects:
          - "LateralQuestionnaire created in DRAFT"
      - from: DILIGENCE
        to: OFFER_OUT
        trigger: "system event: POST /lateral-hiring/offers/{offer_id}/finalize resolves to APPROVED"
        actor: system
        preconditions:
          - "candidate.pipeline_status == DILIGENCE"
        side_effects:
          - "open_offer_id set to the approved offer id"
      - from: OFFER_OUT
        to: HIRED
        trigger: "system event: POST /lateral-hiring/offers/{offer_id}/accept (cascade HOP 2)"
        actor: system
        preconditions:
          - "candidate.pipeline_status == OFFER_OUT"
          - "candidate.clearance_status == CLEARED"
        side_effects:
          - "resignation_date := current logical clock; hire_date := current logical clock"
          - "earliest_start_date := resignation_date + notice_period_days days"
          - "HOP 3 (caused by this hop): the sourcing SearchFirmEngagement crystallises its fee — fee_basis and fee_amount_usd computed by calculations.search_fee_liability, fee_status := FEE_DUE"
      - from: OFFER_OUT
        to: DECLINED
        trigger: "system event: POST /lateral-hiring/offers/{offer_id}/finalize resolves to REJECTED"
        actor: system
        preconditions:
          - "candidate.pipeline_status IN {DILIGENCE, OFFER_OUT}"
        side_effects:
          - "open_offer_id := null"
      - from: DILIGENCE
        to: DECLINED
        trigger: "system event: POST /lateral-hiring/offers/{offer_id}/finalize resolves to REJECTED"
        actor: system
        preconditions:
          - "candidate.pipeline_status == DILIGENCE"
        side_effects:
          - "open_offer_id := null"
      - from: SOURCED
        to: WITHDRAWN
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/withdraw"
        actor: RecruitingCoordinator
        preconditions:
          - "candidate.pipeline_status NOT IN {HIRED, DECLINED, WITHDRAWN}"
        side_effects:
          - "cascade HOP 2: non-terminal LateralQuestionnaire rows (status NOT IN {ACCEPTED, ABANDONED}) -> ABANDONED"
      - from: APPROACHED
        to: WITHDRAWN
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/withdraw"
        actor: RecruitingCoordinator
        preconditions:
          - "candidate.pipeline_status NOT IN {HIRED, DECLINED, WITHDRAWN}"
        side_effects:
          - "cascade HOP 2: non-terminal LateralQuestionnaire rows -> ABANDONED"
      - from: DILIGENCE
        to: WITHDRAWN
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/withdraw"
        actor: RecruitingCoordinator
        preconditions:
          - "candidate.pipeline_status NOT IN {HIRED, DECLINED, WITHDRAWN}"
        side_effects:
          - "cascade HOP 2: non-terminal LateralQuestionnaire rows -> ABANDONED; the candidate's CompensationOffer in status IN {DRAFTED, COMMITTEE_REVIEW, APPROVED, COUNTER_REQUESTED, REPRICE_REQUIRED} -> LAPSED"
          - "cascade HOP 3 (caused by HOP 2's offer LAPSED): PracticeGroup.reserved_guarantee_budget_usd reduced by that offer's guaranteed_comp_usd and available_guarantee_budget_usd increased by the same amount (only when the offer was in COMMITTEE_REVIEW or APPROVED — the two statuses that hold a live reservation); the IntegrationPlan with offer_id == that offer and status IN {DRAFT, ACTIVE} -> ABANDONED"
          - "cascade HOP 4 (caused by HOP 3's plan ABANDONED): that plan's CrossSellIntroduction rows with status == PROPOSED -> CANCELLED; if the plan was ACTIVE, PracticeGroup.active_onboarding_count decremented by 1"
      - from: OFFER_OUT
        to: WITHDRAWN
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/withdraw"
        actor: RecruitingCoordinator
        preconditions:
          - "candidate.pipeline_status NOT IN {HIRED, DECLINED, WITHDRAWN}"
        side_effects:
          - "open_offer_id := null"
          - "cascade HOP 2: non-terminal LateralQuestionnaire rows -> ABANDONED; the candidate's CompensationOffer in status APPROVED -> LAPSED"
          - "cascade HOP 3 (caused by HOP 2's offer LAPSED): PracticeGroup.reserved_guarantee_budget_usd reduced by that offer's guaranteed_comp_usd and available_guarantee_budget_usd increased by the same amount; committed_guarantee_total_usd UNCHANGED (the offer was never accepted)"
          - "cascade HOP 4 (caused by HOP 3's plan ABANDONED, when one exists): that plan's CrossSellIntroduction rows with status == PROPOSED -> CANCELLED; if the plan was ACTIVE, PracticeGroup.active_onboarding_count decremented by 1"

  - entity: Candidate
    state_field: clearance_status
    initial_state: NOT_STARTED
    terminal_states: []
    shape: compound_derived
    note: "Dimension 2 of 2 on the Candidate row. Recomputed from the candidate's ConflictCheck rows on every ConflictCheck status change. Cyclic: BLOCKED can return to CLEARED via declination rescission."
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "system event: POST /lateral-hiring/client-book-entries/{entry_id}/conflict-checks creates the candidate's first ConflictCheck"
        actor: system
        preconditions:
          - "at least one ConflictCheck exists on an ACTIVE ClientBookEntry of the candidate's ACCEPTED-or-UNDER_REVIEW LPQ"
        side_effects: ["none beyond the field write"]
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "system event: any ConflictCheck status change that leaves zero non-CLEAR checks"
        actor: system
        preconditions:
          - "every ConflictCheck on every ACTIVE ClientBookEntry of the candidate's LPQ has status == CLEAR"
          - "entry_count of the candidate's LPQ >= 1"
        side_effects: ["none beyond the field write"]
      - from: IN_PROGRESS
        to: BLOCKED
        trigger: "system event: a ConflictCheck reaches BLOCKED (cascade HOP 2 of the waiver-refusal chain)"
        actor: system
        preconditions:
          - "at least one ConflictCheck on the candidate's ACTIVE entries has status == BLOCKED"
        side_effects: ["none beyond the field write"]
      - from: CLEARED
        to: BLOCKED
        trigger: "system event: a ConflictCheck reaches BLOCKED"
        actor: system
        preconditions:
          - "at least one ConflictCheck on the candidate's ACTIVE entries has status == BLOCKED"
        side_effects: ["none beyond the field write"]
      - from: CLEARED
        to: IN_PROGRESS
        trigger: "system event: POST /lateral-hiring/client-book-entries/{entry_id}/conflict-checks creates a new ConflictCheck on an ACTIVE entry of the candidate's LPQ after clearance was already complete"
        actor: system
        preconditions:
          - "at least one ConflictCheck on the candidate's ACTIVE entries has status IN {PENDING, WAIVER_PENDING}"
          - "no ConflictCheck on those entries has status == BLOCKED"
        side_effects: ["none beyond the field write"]
        note: "A newly discovered conflict reopens clearance. This edge does NOT retract anything already granted downstream — an offer that reached COMMITTEE_REVIEW while the candidate was CLEARED stays in COMMITTEE_REVIEW, because ERR_CLEARANCE_INCOMPLETE is only evaluated at offer submit and offer accept."
      - from: BLOCKED
        to: CLEARED
        trigger: "system event: POST /lateral-hiring/matter-declinations/{declination_id}/rescind returns the last BLOCKED check to CLEAR"
        actor: system
        preconditions:
          - "after the rescission, every ConflictCheck on the candidate's ACTIVE entries has status == CLEAR"
        side_effects: ["none beyond the field write"]
        note: "This edge plus BLOCKED<-CLEARED makes the clearance dimension cyclic."

  - entity: LateralQuestionnaire
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, ABANDONED]
    shape: cyclic
    note: "SUBMITTED -> UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED is a bounded loop; revision_round increments on each REVISION_REQUESTED entry and is capped at MAX_REVISION_ROUNDS = 3."
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/questionnaires"
        actor: RecruitingCoordinator
        preconditions:
          - "candidate.pipeline_status == APPROACHED"
          - "candidate has no LateralQuestionnaire in status NOT IN {ACCEPTED, ABANDONED}"
        side_effects:
          - "Candidate.pipeline_status APPROACHED -> DILIGENCE"
          - "revision_round := 0; entry_count := 0"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /lateral-hiring/questionnaires/{questionnaire_id}/submit"
        actor: Candidate
        preconditions:
          - "questionnaire.status IN {DRAFT, REVISION_REQUESTED}"
          - "X-User-ID == questionnaire.candidate_id"
          - "entry_count >= 1"
          - "candidate.sourcing_engagement_id engagement status == ACTIVE"
        side_effects:
          - "entry_count refreshed from ACTIVE ClientBookEntry rows"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /lateral-hiring/questionnaires/{questionnaire_id}/submit"
        actor: Candidate
        preconditions:
          - "questionnaire.status IN {DRAFT, REVISION_REQUESTED}"
          - "X-User-ID == questionnaire.candidate_id"
          - "entry_count >= 1"
          - "candidate.sourcing_engagement_id engagement status == ACTIVE"
        side_effects:
          - "entry_count refreshed from ACTIVE ClientBookEntry rows"
        note: "The loop-closing edge."
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /lateral-hiring/questionnaires/{questionnaire_id}/start-review"
        actor: RecruitingCoordinator
        preconditions:
          - "questionnaire.status == SUBMITTED"
        side_effects: ["none beyond the status write"]
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /lateral-hiring/questionnaires/{questionnaire_id}/request-revision"
        actor: RecruitingCoordinator
        preconditions:
          - "questionnaire.status == UNDER_REVIEW"
          - "revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "revision_round incremented by 1"
          - "ClientBookEntry rows become mutable again (create and soft-delete are permitted in REVISION_REQUESTED)"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /lateral-hiring/questionnaires/{questionnaire_id}/accept"
        actor: RecruitingCoordinator
        preconditions:
          - "questionnaire.status == UNDER_REVIEW"
          - "at least one PortabilityAssessment exists on this LPQ with status == CURRENT"
        side_effects:
          - "ClientBookEntry rows become immutable (create and soft-delete rejected)"
      - from: DRAFT
        to: ABANDONED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions:
          - "questionnaire.status NOT IN {ACCEPTED, ABANDONED}"
        side_effects: ["none beyond the status write"]
      - from: SUBMITTED
        to: ABANDONED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions:
          - "questionnaire.status NOT IN {ACCEPTED, ABANDONED}"
        side_effects: ["none beyond the status write"]
      - from: UNDER_REVIEW
        to: ABANDONED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions:
          - "questionnaire.status NOT IN {ACCEPTED, ABANDONED}"
        side_effects: ["none beyond the status write"]
      - from: REVISION_REQUESTED
        to: ABANDONED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions:
          - "questionnaire.status NOT IN {ACCEPTED, ABANDONED}"
        side_effects: ["none beyond the status write"]

  - entity: ClientBookEntry
    state_field: portable_status
    initial_state: UNVALIDATED
    terminal_states: []
    shape: cyclic
    transitions:
      - from: UNVALIDATED
        to: VALIDATED
        trigger: "system event: POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments computes this entry"
        actor: system
        preconditions:
          - "entry.status == ACTIVE"
          - "entry.verified_record_count >= MIN_VERIFIED_RECORDS (3) inside the assessment lookback window"
        side_effects:
          - "baseline_portable_amount_usd := calculations.entry_validated_portable_amount output"
          - "validated_portable_amount_usd := baseline_portable_amount_usd"
      - from: VALIDATED
        to: DECLINED
        trigger: "system event: cascade HOP 3 of POST /lateral-hiring/conflict-waivers/{waiver_id}/refuse"
        actor: system
        preconditions:
          - "a ConflictCheck with client_book_entry_id == entry.id reached BLOCKED in HOP 2"
        side_effects:
          - "validated_portable_amount_usd := 0.00; baseline_portable_amount_usd UNCHANGED (the conserved quantity)"
          - "one MatterDeclination row created per element of entry.matter_types, amounts from calculations.declination_revenue_split"
          - "HOP 4 (caused by this hop): every PortabilityAssessment on entry.questionnaire_id with status == CURRENT -> STALE with validated_portable_total_usd, declined_portable_total_usd and adjusted_portable_total_usd recomputed"
      - from: DECLINED
        to: VALIDATED
        trigger: "system event: POST /lateral-hiring/matter-declinations/{declination_id}/rescind rescinds the LAST ACTIVE declination on this entry"
        actor: system
        preconditions:
          - "after the rescission, zero MatterDeclination rows with client_book_entry_id == entry.id have status == ACTIVE"
        side_effects:
          - "validated_portable_amount_usd := baseline_portable_amount_usd (restored exactly, no drift)"
          - "the parent ConflictCheck BLOCKED -> CLEAR"
          - "every PortabilityAssessment on entry.questionnaire_id with status IN {CURRENT, STALE} recomputes validated_portable_total_usd, declined_portable_total_usd and adjusted_portable_total_usd"
        note: "Compensating action for the VALIDATED -> DECLINED edge; closes the cycle and restores the conserved quantity."

  - entity: PortabilityAssessment
    state_field: status
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    shape: branching
    transitions:
      - from: null
        to: CURRENT
        trigger: "POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"
        actor: RecruitingCoordinator
        preconditions:
          - "questionnaire.status IN {UNDER_REVIEW, ACCEPTED}"
          - "expected_questionnaire_version == questionnaire.version"
          - "questionnaire.entry_count >= 1"
          - "every ACTIVE ClientBookEntry on the LPQ has >= MIN_VERIFIED_RECORDS (3) VERIFIED HISTORICAL CollectionRecord rows with period_end_date inside [lookback_start_date, baseline_date)"
        side_effects:
          - "every prior PortabilityAssessment on this LPQ with status IN {CURRENT, STALE} -> SUPERSEDED"
          - "each in-scope ClientBookEntry recomputed (portable_status UNVALIDATED -> VALIDATED)"
          - "LateralQuestionnaire.latest_assessment_id := new assessment id"
          - "increments LateralQuestionnaire.version by 1"
      - from: CURRENT
        to: STALE
        trigger: "system event: cascade HOP 4 — an in-scope ClientBookEntry's validated_portable_amount_usd changed"
        actor: system
        preconditions:
          - "assessment.status == CURRENT"
        side_effects:
          - "validated_portable_total_usd, declined_portable_total_usd, adjusted_portable_total_usd recomputed; gross_baseline_total_usd unchanged"
          - "HOP 5 (caused by this hop): every CompensationOffer with portability_assessment_id == this assessment and status == COMMITTEE_REVIEW -> REPRICE_REQUIRED"
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system event: a newer PortabilityAssessment is created on the same LPQ"
        actor: system
        preconditions: ["assessment.status IN {CURRENT, STALE}"]
        side_effects: ["none beyond the status write"]
      - from: STALE
        to: SUPERSEDED
        trigger: "system event: a newer PortabilityAssessment is created on the same LPQ"
        actor: system
        preconditions: ["assessment.status IN {CURRENT, STALE}"]
        side_effects: ["none beyond the status write"]

  - entity: ConflictCheck
    state_field: status
    initial_state: PENDING
    terminal_states: []
    shape: branching_with_revert
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /lateral-hiring/client-book-entries/{entry_id}/conflict-checks"
        actor: ConflictsCounsel
        preconditions:
          - "entry.status == ACTIVE"
          - "entry.questionnaire.status IN {UNDER_REVIEW, REVISION_REQUESTED, ACCEPTED}"
          - "every element of affected_matter_types appears in entry.matter_types"
        side_effects:
          - "Candidate.clearance_status NOT_STARTED -> IN_PROGRESS (first check only)"
      - from: PENDING
        to: CLEAR
        trigger: "POST /lateral-hiring/conflict-checks/{conflict_check_id}/clear"
        actor: ConflictsCounsel
        preconditions:
          - "check.status == PENDING"
          - "check.severity != DIRECT_ADVERSE (a direct-adverse conflict cannot be cleared without a waiver)"
        side_effects:
          - "resolution_note recorded"
          - "Candidate.clearance_status recomputed (may become CLEARED)"
      - from: PENDING
        to: WAIVER_PENDING
        trigger: "system event: POST /lateral-hiring/conflict-checks/{conflict_check_id}/waivers"
        actor: system
        preconditions:
          - "check.status == PENDING"
        side_effects:
          - "ConflictWaiver created in REQUESTED"
      - from: WAIVER_PENDING
        to: CLEAR
        trigger: "system event: POST /lateral-hiring/conflict-waivers/{waiver_id}/grant"
        actor: system
        preconditions:
          - "check.status == WAIVER_PENDING"
          - "waiver.status == REQUESTED"
        side_effects:
          - "Candidate.clearance_status recomputed (may become CLEARED)"
      - from: WAIVER_PENDING
        to: BLOCKED
        trigger: "system event: POST /lateral-hiring/conflict-waivers/{waiver_id}/refuse — cascade HOP 2"
        actor: system
        preconditions:
          - "check.status == WAIVER_PENDING"
        side_effects:
          - "HOP 3 (caused by this hop): the ClientBookEntry VALIDATED -> DECLINED with MatterDeclination rows created, and Candidate.clearance_status -> BLOCKED"
      - from: WAIVER_PENDING
        to: BLOCKED
        trigger: "system event: POST /lateral-hiring/_clock/set_current_utc advances past waiver.response_deadline_date with the waiver still REQUESTED"
        actor: system
        preconditions:
          - "check.status == WAIVER_PENDING"
          - "waiver.status == REQUESTED and new_clock > waiver.response_deadline_date"
        side_effects:
          - "waiver.status := EXPIRED, waiver.decided_at := new clock"
          - "same HOP 3 / HOP 4 / HOP 5 chain as the refusal path"
        note: "Auto-expiry path — identical downstream cascade, different trigger."
      - from: BLOCKED
        to: CLEAR
        trigger: "system event: POST /lateral-hiring/matter-declinations/{declination_id}/rescind rescinds the last ACTIVE declination on the entry"
        actor: system
        preconditions:
          - "check.status == BLOCKED"
          - "zero remaining ACTIVE MatterDeclination rows on the entry after the rescission"
        side_effects:
          - "the ClientBookEntry DECLINED -> VALIDATED with validated_portable_amount_usd restored"
          - "Candidate.clearance_status recomputed"

  - entity: ConflictWaiver
    state_field: status
    initial_state: REQUESTED
    terminal_states: [GRANTED, REFUSED, EXPIRED]
    shape: branching
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /lateral-hiring/conflict-checks/{conflict_check_id}/waivers"
        actor: ConflictsCounsel
        preconditions:
          - "check.status == PENDING"
          - "response_deadline_date > current logical clock"
          - "waiver_strategy == ETHICAL_WALL is rejected when check.severity == DIRECT_ADVERSE"
        side_effects:
          - "ConflictCheck PENDING -> WAIVER_PENDING"
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /lateral-hiring/conflict-waivers/{waiver_id}/grant"
        actor: ConflictsCounsel
        preconditions:
          - "waiver.status == REQUESTED"
          - "current logical clock <= waiver.response_deadline_date"
        side_effects:
          - "decided_at := current logical clock"
          - "ConflictCheck WAIVER_PENDING -> CLEAR"
      - from: REQUESTED
        to: REFUSED
        trigger: "POST /lateral-hiring/conflict-waivers/{waiver_id}/refuse"
        actor: ConflictsCounsel
        preconditions:
          - "waiver.status == REQUESTED"
        side_effects:
          - "decided_at := current logical clock"
          - "HOP 2 (caused by this hop): ConflictCheck WAIVER_PENDING -> BLOCKED"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system event: POST /lateral-hiring/_clock/set_current_utc advances past response_deadline_date"
        actor: system
        preconditions:
          - "waiver.status == REQUESTED and new_clock > response_deadline_date"
        side_effects:
          - "decided_at := new clock; ConflictCheck WAIVER_PENDING -> BLOCKED and the full HOP 3-5 cascade"
        note: "Applied to qualifying waivers ordered by response_deadline_date ASC, tie-break created_at ASC."

  - entity: MatterDeclination
    state_field: status
    initial_state: ACTIVE
    terminal_states: [RESCINDED]
    shape: linear
    transitions:
      - from: null
        to: ACTIVE
        trigger: "system event: cascade HOP 3 of a waiver refusal or expiry"
        actor: system
        preconditions:
          - "the ConflictCheck reached BLOCKED in HOP 2"
        side_effects:
          - "foregone_annual_revenue_usd set by calculations.declination_revenue_split"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /lateral-hiring/matter-declinations/{declination_id}/rescind"
        actor: ConflictsCounsel
        preconditions:
          - "declination.status == ACTIVE"
          - "the parent ConflictCheck.status == BLOCKED"
        side_effects:
          - "rescinded_at := current logical clock"
          - "when this was the last ACTIVE declination on the entry: ClientBookEntry DECLINED -> VALIDATED, ConflictCheck BLOCKED -> CLEAR, assessments recomputed, Candidate.clearance_status recomputed"

  - entity: CompensationOffer
    state_field: status
    initial_state: DRAFTED
    terminal_states: [ACCEPTED, REJECTED, LAPSED]
    shape: cyclic_and_branching
    note: "COMMITTEE_REVIEW forks three ways {APPROVED, REJECTED, COUNTER_REQUESTED} with divergent side-effect sets; COUNTER_REQUESTED -> DRAFTED closes the negotiation loop, capped at MAX_NEGOTIATION_ROUNDS = 3."
    transitions:
      - from: null
        to: DRAFTED
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/offers"
        actor: CommitteeChair
        preconditions:
          - "candidate.pipeline_status == DILIGENCE"
          - "expected_candidate_version == candidate.version"
          - "referenced PortabilityAssessment.questionnaire_id belongs to a LateralQuestionnaire whose candidate_id == candidate.id"
          - "referenced PortabilityAssessment.status == CURRENT"
        side_effects:
          - "adjusted_portable_total_snapshot_usd copied from the assessment"
          - "expected_contribution_usd, total_first_year_comp_usd, search_fee_amount_usd, integration_cost_total_usd, net_first_year_economics_usd, guarantee_true_up_amount_usd all computed"
          - "Candidate.open_offer_id := new offer id; increments Candidate.version by 1"
          - "round_number := 1; votes_cast_total := 0"
      - from: DRAFTED
        to: COMMITTEE_REVIEW
        trigger: "POST /lateral-hiring/offers/{offer_id}/submit"
        actor: CommitteeChair
        preconditions:
          - "offer.status IN {DRAFTED}"
          - "candidate.clearance_status == CLEARED"
          - "referenced PortabilityAssessment.status == CURRENT"
          - "eligible_voter_count >= MIN_COMMITTEE_SIZE (3)"
          - "PracticeGroup.status == OPEN"
          - "guaranteed_comp_usd <= PracticeGroup.available_guarantee_budget_usd"
        side_effects:
          - "eligible_voter_count snapshotted from the request"
          - "PracticeGroup.reserved_guarantee_budget_usd increased by guaranteed_comp_usd; available_guarantee_budget_usd decreased by the same amount"
      - from: COMMITTEE_REVIEW
        to: APPROVED
        trigger: "POST /lateral-hiring/offers/{offer_id}/finalize resolving to APPROVED"
        actor: CommitteeChair
        preconditions:
          - "offer.status == COMMITTEE_REVIEW"
          - "X-User-ID != offer.created_by_user_id (segregation of duties)"
          - "quorum_met per calculations.committee_quorum_tally"
          - "approval_met per calculations.committee_quorum_tally"
        side_effects:
          - "Candidate.pipeline_status DILIGENCE -> OFFER_OUT"
          - "reserved guarantee stays reserved (not yet committed)"
      - from: COMMITTEE_REVIEW
        to: REJECTED
        trigger: "POST /lateral-hiring/offers/{offer_id}/finalize resolving to REJECTED"
        actor: CommitteeChair
        preconditions:
          - "offer.status == COMMITTEE_REVIEW"
          - "X-User-ID != offer.created_by_user_id"
          - "quorum_met per calculations.committee_quorum_tally"
          - "approval_met is FALSE"
        side_effects:
          - "PracticeGroup.reserved_guarantee_budget_usd reduced by guaranteed_comp_usd; available_guarantee_budget_usd increased by the same amount"
          - "Candidate.pipeline_status -> DECLINED; Candidate.open_offer_id := null"
        note: "Divergent side-effect set vs the APPROVED branch: this branch releases the reserve and terminates the candidate."
      - from: COMMITTEE_REVIEW
        to: COUNTER_REQUESTED
        trigger: "POST /lateral-hiring/offers/{offer_id}/counter"
        actor: CommitteeChair
        preconditions:
          - "offer.status IN {COMMITTEE_REVIEW, REPRICE_REQUIRED}"
          - "offer.round_number < MAX_NEGOTIATION_ROUNDS (3)"
        side_effects:
          - "every CommitteeVote on this offer with status == ACTIVE -> VOIDED; active_vote_count := 0; voided_vote_count += the number voided; votes_cast_total UNCHANGED"
          - "PracticeGroup.reserved_guarantee_budget_usd reduced by guaranteed_comp_usd; available_guarantee_budget_usd increased by the same amount"
          - "round_number incremented by 1; eligible_voter_count := null"
      - from: REPRICE_REQUIRED
        to: COUNTER_REQUESTED
        trigger: "POST /lateral-hiring/offers/{offer_id}/counter"
        actor: CommitteeChair
        preconditions:
          - "offer.status IN {COMMITTEE_REVIEW, REPRICE_REQUIRED}"
          - "offer.round_number < MAX_NEGOTIATION_ROUNDS (3)"
        side_effects:
          - "identical to the COMMITTEE_REVIEW -> COUNTER_REQUESTED side-effect set"
      - from: COUNTER_REQUESTED
        to: DRAFTED
        trigger: "PATCH /lateral-hiring/offers/{offer_id}"
        actor: CommitteeChair
        preconditions:
          - "offer.status == COUNTER_REQUESTED"
        side_effects:
          - "guaranteed_comp_usd and signing_bonus_usd replaced from the request body"
          - "all six economics fields recomputed against the SAME adjusted_portable_total_snapshot_usd"
        note: "Loop-closing edge of the negotiation cycle."
      - from: COMMITTEE_REVIEW
        to: REPRICE_REQUIRED
        trigger: "system event: cascade HOP 5 — the referenced PortabilityAssessment went STALE"
        actor: system
        preconditions:
          - "offer.status == COMMITTEE_REVIEW"
        side_effects:
          - "every ACTIVE CommitteeVote -> VOIDED; active_vote_count := 0; voided_vote_count += the number voided; votes_cast_total UNCHANGED"
          - "PracticeGroup.reserved_guarantee_budget_usd reduced by guaranteed_comp_usd; available_guarantee_budget_usd increased by the same amount"
      - from: APPROVED
        to: ACCEPTED
        trigger: "POST /lateral-hiring/offers/{offer_id}/accept"
        actor: Candidate
        preconditions:
          - "offer.status == APPROVED"
          - "X-User-ID == offer.candidate_id"
          - "candidate.clearance_status == CLEARED"
        side_effects:
          - "accepted_at := current logical clock"
          - "PracticeGroup.reserved_guarantee_budget_usd reduced by guaranteed_comp_usd; committed_guarantee_total_usd increased by the same amount; available_guarantee_budget_usd UNCHANGED"
          - "HOP 2 (caused by this hop): Candidate.pipeline_status OFFER_OUT -> HIRED with resignation_date, hire_date and earliest_start_date set"
          - "HOP 3 (caused by HOP 2): the sourcing SearchFirmEngagement crystallises fee_basis / fee_amount_usd and fee_status := FEE_DUE"
      - from: DRAFTED
        to: LAPSED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions: ["offer.status NOT IN {ACCEPTED, REJECTED, LAPSED}"]
        side_effects: ["Candidate.open_offer_id := null"]
      - from: COMMITTEE_REVIEW
        to: LAPSED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions: ["offer.status NOT IN {ACCEPTED, REJECTED, LAPSED}"]
        side_effects:
          - "HOP 3: reserved guarantee released to available; IntegrationPlan with offer_id == this offer -> ABANDONED"
          - "Candidate.open_offer_id := null"
      - from: APPROVED
        to: LAPSED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions: ["offer.status NOT IN {ACCEPTED, REJECTED, LAPSED}"]
        side_effects:
          - "HOP 3: reserved guarantee released to available; IntegrationPlan with offer_id == this offer -> ABANDONED"
          - "Candidate.open_offer_id := null"
      - from: COUNTER_REQUESTED
        to: LAPSED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions: ["offer.status NOT IN {ACCEPTED, REJECTED, LAPSED}"]
        side_effects: ["Candidate.open_offer_id := null"]
      - from: REPRICE_REQUIRED
        to: LAPSED
        trigger: "system event: POST /lateral-hiring/candidates/{candidate_id}/withdraw (cascade HOP 2)"
        actor: system
        preconditions: ["offer.status NOT IN {ACCEPTED, REJECTED, LAPSED}"]
        side_effects: ["Candidate.open_offer_id := null"]

  - entity: CommitteeVote
    state_field: status
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    shape: linear
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /lateral-hiring/offers/{offer_id}/votes"
        actor: CommitteeMember
        preconditions:
          - "offer.status == COMMITTEE_REVIEW"
          - "X-User-ID != Candidate.sponsor_user_id (segregation of duties)"
          - "request round_number == offer.round_number"
          - "no ACTIVE CommitteeVote on this offer already has voter_user_id == X-User-ID"
          - "offer.active_vote_count < offer.eligible_voter_count"
        side_effects:
          - "offer.votes_cast_total incremented by 1; offer.active_vote_count incremented by 1"
          - "increments CompensationOffer.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "system event: POST /lateral-hiring/offers/{offer_id}/counter, or cascade HOP 5 REPRICE_REQUIRED"
        actor: system
        preconditions:
          - "vote.status == ACTIVE"
        side_effects:
          - "offer.active_vote_count decremented by 1; offer.voided_vote_count incremented by 1; offer.votes_cast_total UNCHANGED"

  - entity: IntegrationPlan
    state_field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABANDONED]
    shape: linear_with_system_completion
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /lateral-hiring/candidates/{candidate_id}/integration-plans"
        actor: PracticeGroupLeader
        preconditions:
          - "candidate.pipeline_status == HIRED"
          - "referenced CompensationOffer.candidate_id == candidate.id and offer.status == ACCEPTED"
          - "X-User-ID == candidate.target_practice_group_id and practice_group_id == candidate.target_practice_group_id"
          - "onboarding_start_date >= candidate.earliest_start_date"
        side_effects:
          - "introduction_count := 0; completed_introduction_count := 0"
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /lateral-hiring/integration-plans/{plan_id}/activate"
        actor: PracticeGroupLeader
        preconditions:
          - "plan.status == DRAFT"
          - "PracticeGroup.status == OPEN"
          - "PracticeGroup.active_onboarding_count < PracticeGroup.onboarding_capacity"
        side_effects:
          - "PracticeGroup.active_onboarding_count incremented by 1; increments PracticeGroup.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system event: POST /lateral-hiring/_clock/set_current_utc advances past onboarding_end_date"
        actor: system
        preconditions:
          - "plan.status == ACTIVE and new_clock > onboarding_end_date"
        side_effects:
          - "PracticeGroup.active_onboarding_count decremented by 1"
          - "CrossSellIntroduction rows with status == PROPOSED -> CANCELLED"
        note: "Applied ordered by onboarding_end_date ASC, tie-break created_at ASC."
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /lateral-hiring/integration-plans/{plan_id}/abandon"
        actor: PracticeGroupLeader
        preconditions:
          - "plan.status == DRAFT"
          - "X-User-ID == plan.practice_group_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status := ABANDONED"
          - "HOP 2: PROPOSED CrossSellIntroduction rows on this plan -> CANCELLED"
        note: "A DRAFT plan never consumed an onboarding slot, so active_onboarding_count is UNCHANGED. The same target state is also reached as cascade HOP 3 of POST /lateral-hiring/candidates/{candidate_id}/withdraw when a plan exists for a non-HIRED candidate."
      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /lateral-hiring/integration-plans/{plan_id}/abandon"
        actor: PracticeGroupLeader
        preconditions:
          - "plan.status == ACTIVE"
          - "X-User-ID == plan.practice_group_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "status := ABANDONED"
          - "HOP 2: PROPOSED CrossSellIntroduction rows on this plan -> CANCELLED"
          - "HOP 3: PracticeGroup.active_onboarding_count decremented by 1; increments PracticeGroup.version by 1"

  - entity: CrossSellIntroduction
    state_field: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, CANCELLED]
    shape: branching
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /lateral-hiring/integration-plans/{plan_id}/introductions"
        actor: PracticeGroupLeader
        preconditions:
          - "plan.status == ACTIVE"
          - "candidate.pipeline_status == HIRED"
          - "NOT (candidate.approach_confidential == true AND target_client_name equals the client_name of an ACTIVE ClientBookEntry on the candidate's LateralQuestionnaire whose client_consent_status == CONSENT_PENDING) — a confidentially approached candidate may not be introduced to a prior-firm client that has not yet confirmed consent"
          - "slot_start_at >= plan.onboarding_start_date AND slot_end_at <= plan.onboarding_end_date (closed containment)"
          - "slot_start_at >= candidate.resignation_date + candidate.non_solicit_days days"
          - "no other CrossSellIntroduction on this plan with status IN {PROPOSED, COMPLETED} whose CLOSED slot [slot_start_at, slot_end_at] intersects the requested CLOSED slot"
        side_effects:
          - "plan.introduction_count incremented by 1; increments IntegrationPlan.version by 1"
      - from: PROPOSED
        to: COMPLETED
        trigger: "POST /lateral-hiring/introductions/{introduction_id}/complete"
        actor: PracticeGroupLeader
        preconditions:
          - "introduction.status == PROPOSED"
          - "current logical clock >= introduction.slot_start_at"
        side_effects:
          - "completed_at := current logical clock; plan.completed_introduction_count incremented by 1"
      - from: PROPOSED
        to: CANCELLED
        trigger: "system event: plan -> ABANDONED (cascade HOP 4) or plan -> COMPLETED on clock advance"
        actor: system
        preconditions: ["introduction.status == PROPOSED"]
        side_effects:
          - "plan.introduction_count decremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================

concurrency_rules:
  - rule_id: offer-create-stale-candidate
    parent_entity: Candidate
    write_endpoint: "POST /lateral-hiring/candidates/{candidate_id}/offers"
    occ_field: "expected_candidate_version"
    description: |
      Creating a CompensationOffer against a Candidate whose version has advanced
      since the client last observed it is rejected. This captures the case where a
      previously created offer legitimately supersedes the prior draft (the chair's
      CREATE-with-supersede pattern sets Candidate.open_offer_id), so the current
      writer's view of the candidate — including which offer is open and what the
      clearance dimension says — is stale.
    error_id: ERR_STALE_CANDIDATE_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-questionnaire
    parent_entity: LateralQuestionnaire
    write_endpoint: "POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"
    occ_field: "expected_questionnaire_version"
    description: |
      Creating a PortabilityAssessment against a LateralQuestionnaire whose version
      has advanced since the client last observed it is rejected. A newly created
      assessment legitimately supersedes every prior assessment on the same LPQ and
      rewrites latest_assessment_id, so a writer holding an outdated version has an
      outdated view of the client book it intends to value.
    error_id: ERR_STALE_QUESTIONNAIRE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================

calculations:

  - name: entry_validated_portable_amount
    trigger: "On the PortabilityAssessment CURRENT-creation transition (POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments), once per in-scope ClientBookEntry; writes ClientBookEntry.baseline_portable_amount_usd and ClientBookEntry.validated_portable_amount_usd."
    algorithm: threshold
    combinatorial_mode: "(a) formula with >= 3 inputs and non-linear interaction: tiered role/consent factor selection, a min() realization cap, and a second min() hard cap on the result"
    formula: |
      # ---- inputs: 5 independent entity fields + 1 cross-entity aggregate ----
      historical_base = SUM(cr.amount_usd) over CollectionRecord cr WHERE
            cr.client_book_entry_id == entry.id
        AND cr.record_type == 'HISTORICAL'
        AND cr.status == 'VERIFIED'
        AND cr.period_end_date >= assessment.lookback_start_date      # INCLUSIVE
        AND cr.period_end_date <  assessment.baseline_date            # EXCLUSIVE (half-open)
      # no tie-break needed: SUM is order-insensitive and every summand is 2dp exact

      avg_annual_collections = ROUND_HALF_UP(historical_base / LOOKBACK_YEARS, 2)

      role_factor    = { BILLING_ATTORNEY: 1.00, RELATIONSHIP_PARTNER: 0.85,
                         SERVICE_PARTNER: 0.55 }[entry.relationship_role]
      consent_factor = 1.00 if entry.client_consent_status == 'CONSENT_CONFIRMED' else 0.60
      realization    = MIN(entry.claimed_realization_rate, REALIZATION_CAP)

      raw    = avg_annual_collections * role_factor * consent_factor * realization
      capped = MIN(raw, avg_annual_collections * PORTABILITY_HARD_CAP)

      # STEP ORDER IS PINNED: the two factors are multiplied at full precision and
      # rounded exactly ONCE, here, before any summation happens upstream.
      entry.baseline_portable_amount_usd  = ROUND_HALF_UP(capped, 2)
      entry.validated_portable_amount_usd = 0.00 if entry.portable_status == 'DECLINED'
                                            else entry.baseline_portable_amount_usd
    input_set: "ClientBookEntry rows with questionnaire_id == assessment.questionnaire_id AND status == ACTIVE. WITHDRAWN entries are excluded entirely. CollectionRecord rows must be record_type == HISTORICAL AND status == VERIFIED AND period_end_date in the half-open window [lookback_start_date, baseline_date)."
    constants:
      LOOKBACK_YEARS: 3
      REALIZATION_CAP: 0.95
      PORTABILITY_HARD_CAP: 0.90
      MIN_VERIFIED_RECORDS: 3
    precision: "2 decimal places, ROUND_HALF_UP, applied exactly once at the end of this calculation"

  - name: portable_book_valuation
    trigger: "On the PortabilityAssessment CURRENT-creation transition, and again on the CURRENT -> STALE transition (cascade HOP 4) and on declination rescission; writes PortabilityAssessment.self_reported_total_usd, validated_portable_total_usd, gross_baseline_total_usd, declined_portable_total_usd, variance_pct."
    algorithm: aggregation
    combinatorial_mode: "(b) nested rounding where order matters: per-entry ROUND_HALF_UP then SUM, never SUM then ROUND"
    formula: |
      scope = ClientBookEntry rows WHERE questionnaire_id == assessment.questionnaire_id
              AND status == 'ACTIVE',  processed in created_at ASC order
      # ---- ROUNDING ORDER IS PINNED (mode b) --------------------------------
      # Each entry's amount is rounded to 2dp by entry_validated_portable_amount
      # FIRST; the totals below are plain sums of ALREADY-ROUNDED per-entry values
      # and are NOT re-rounded. "sum then round" is explicitly WRONG here and
      # produces different cents.
      gross_baseline_total_usd      = SUM(e.baseline_portable_amount_usd  for e in scope)
      validated_portable_total_usd  = SUM(e.validated_portable_amount_usd for e in scope)
      declined_portable_total_usd   = SUM(e.baseline_portable_amount_usd  for e in scope
                                          if e.portable_status == 'DECLINED')
      self_reported_total_usd       = SUM( ROUND_HALF_UP(e.claimed_annual_billings_usd
                                                        * e.claimed_portability_pct, 2)
                                           for e in scope )   # same per-line rounding rule

      variance_pct = ROUND_HALF_UP((self_reported_total_usd - validated_portable_total_usd)
                                    / self_reported_total_usd, 4)
                     if self_reported_total_usd > 0 else 0.0000

      # CONSERVED QUANTITY (see compensating_invariant):
      #   validated_portable_total_usd + declined_portable_total_usd
      #     == gross_baseline_total_usd    (exact, at every observable instant)
    input_set: "ACTIVE ClientBookEntry rows on the LPQ. Both variants read the SAME scope; they differ only in which fields they consume."
    constants: {}
    precision: "totals: 2 decimal places (already-rounded summands, no re-rounding). variance_pct: 4 decimal places, ROUND_HALF_UP."
    variants:
      - name: SELF_REPORTED
        when: "assessment.governing_basis == 'SELF_REPORTED' — used when no verified prior-firm statements exist and the committee prices off the candidate's own numbers."
        difference: "Governing total is self_reported_total_usd = SUM(round(claimed_annual_billings_usd * claimed_portability_pct, 2)). It IGNORES role_factor, consent_factor, REALIZATION_CAP, PORTABILITY_HARD_CAP and every CollectionRecord row. Same client book, materially larger number."
      - name: VALIDATED
        when: "assessment.governing_basis == 'VALIDATED' (default) — used when >= MIN_VERIFIED_RECORDS verified statements back each entry."
        difference: "Governing total is validated_portable_total_usd, built from VERIFIED HISTORICAL collections through role/consent/realization factors and the 0.90 hard cap, and zeroed for DECLINED entries. Same client book, materially smaller number."

  - name: client_concentration_analysis
    trigger: "On the PortabilityAssessment CURRENT-creation transition, and re-evaluated on CURRENT -> STALE and on declination rescission; writes top_client_share, top3_client_share, concentration_grade, concentration_haircut_pct, adjusted_portable_total_usd."
    algorithm: threshold
    formula: |
      scope = ACTIVE ClientBookEntry rows on the LPQ
      ranked = scope sorted by baseline_portable_amount_usd DESC,
                             tie-break created_at ASC        # never by id
      top_client_share  = ROUND_HALF_UP(ranked[0].baseline_portable_amount_usd
                                         / gross_baseline_total_usd, 4)
                          if gross_baseline_total_usd > 0 else 0.0000
      top3_client_share = ROUND_HALF_UP(SUM(ranked[0:3].baseline_portable_amount_usd)
                                         / gross_baseline_total_usd, 4)
                          if gross_baseline_total_usd > 0 else 0.0000
                          # REPORTED ONLY — not an input to the grade

      # BOUNDARY IS INCLUSIVE (>=), NOT STRICT (>)
      concentration_grade = 'HIGH'   if top_client_share >= CONCENTRATION_HIGH_THRESHOLD
                       else 'MEDIUM' if top_client_share >= CONCENTRATION_MEDIUM_THRESHOLD
                       else 'LOW'
      concentration_haircut_pct = { HIGH: 0.15, MEDIUM: 0.07, LOW: 0.00 }[concentration_grade]

      governing_total = self_reported_total_usd if assessment.governing_basis == 'SELF_REPORTED'
                        else validated_portable_total_usd
      adjusted_portable_total_usd = ROUND_HALF_UP(governing_total
                                                  * (1 - concentration_haircut_pct), 2)
    input_set: "ACTIVE ClientBookEntry rows on the LPQ, using baseline_portable_amount_usd (NOT validated_portable_amount_usd) so that a declination does not flatter the concentration profile."
    constants:
      CONCENTRATION_HIGH_THRESHOLD: 0.30
      CONCENTRATION_MEDIUM_THRESHOLD: 0.20
      HIGH_HAIRCUT_PCT: 0.15
      MEDIUM_HAIRCUT_PCT: 0.07
      LOW_HAIRCUT_PCT: 0.00
    precision: "shares: 4 decimal places ROUND_HALF_UP. adjusted_portable_total_usd: 2 decimal places ROUND_HALF_UP."

  - name: expected_contribution_model
    trigger: "On CompensationOffer creation (POST /lateral-hiring/candidates/{candidate_id}/offers) and on every PATCH /lateral-hiring/offers/{offer_id} re-draft; writes CompensationOffer.expected_contribution_usd."
    algorithm: weighted_scoring
    combinatorial_mode: "(a) formula with >= 3 inputs and non-linear interaction: a conditional branch on Candidate.notice_period_days, a conditional uplift on PracticeGroup.leverage_ratio, a MIN() cap on their sum, and a nested MIN(MAX(...)) clamp on the rate ratio"
    formula: |
      adjusted = offer.adjusted_portable_total_snapshot_usd     # copied at creation

      # branch 1: ramp penalty for a long notice period (STRICT >, not >=)
      ramp_factor = RAMP_LONG_NOTICE if candidate.notice_period_days > NOTICE_RAMP_THRESHOLD_DAYS
                    else RAMP_SHORT_NOTICE
      # branch 2: leverage uplift (INCLUSIVE >=)
      practice_uplift = LEVERAGE_UPLIFT if practice_group.leverage_ratio >= LEVERAGE_THRESHOLD
                        else 0.00
      effective_multiplier = MIN(ramp_factor + practice_uplift, RAMP_CAP)

      # nested MIN(MAX(...)) clamp, rounded to 4dp BEFORE use
      rate_alignment_factor = ROUND_HALF_UP(
            MIN( MAX(practice_group.target_standard_rate_usd
                     / candidate.current_standard_rate_usd,
                     RATE_ALIGNMENT_FLOOR),
                 RATE_ALIGNMENT_CEILING), 4)

      # single left-to-right product, rounded exactly once
      expected_contribution_usd = ROUND_HALF_UP(
            adjusted * effective_multiplier * rate_alignment_factor, 2)
    input_set: "The offer's snapshotted adjusted_portable_total_snapshot_usd (NOT the live assessment value), the Candidate row, and the Candidate's target PracticeGroup row."
    constants:
      NOTICE_RAMP_THRESHOLD_DAYS: 60
      RAMP_SHORT_NOTICE: 0.85
      RAMP_LONG_NOTICE: 0.70
      LEVERAGE_THRESHOLD: 3.00
      LEVERAGE_UPLIFT: 0.05
      RAMP_CAP: 0.92
      RATE_ALIGNMENT_FLOOR: 0.80
      RATE_ALIGNMENT_CEILING: 1.10
    precision: "rate_alignment_factor: 4 decimal places ROUND_HALF_UP. expected_contribution_usd: 2 decimal places ROUND_HALF_UP, applied once."

  - name: search_fee_liability
    trigger: "On the Candidate OFFER_OUT -> HIRED transition (cascade HOP 3 of POST /lateral-hiring/offers/{offer_id}/accept), writing SearchFirmEngagement.fee_basis / fee_amount_usd / fee_status; ALSO evaluated speculatively at CompensationOffer creation and re-draft to populate CompensationOffer.search_fee_amount_usd (STEP 2 of net_first_year_economics)."
    algorithm: tiered_pricing
    formula: |
      eng = SearchFirmEngagement WHERE id == candidate.sourcing_engagement_id
      # for the speculative (offer-time) evaluation, hire_probe = current logical clock;
      # for the crystallising (accept-time) evaluation, hire_probe = candidate.hire_date
      IF eng.exclusivity_start_date <= hire_probe < eng.exclusivity_end_date:
          basis    = 'DIRECT_PLACEMENT'
          fee_base = offer.total_first_year_comp_usd          # guaranteed + signing bonus
          fee_raw  = ROUND_HALF_UP(fee_base * eng.fee_pct, 2)
      ELIF eng.exclusivity_end_date <= hire_probe
           < eng.exclusivity_end_date + eng.tail_off_days days:
          basis    = 'TAIL_OFF_CLAIM'
          fee_base = offer.guaranteed_comp_usd                # signing bonus EXCLUDED
          fee_raw  = ROUND_HALF_UP(fee_base * eng.fee_pct * TAIL_OFF_DISCOUNT, 2)
      ELSE:
          basis = 'NONE';  fee_raw = 0.00
      fee_amount_usd = MIN(fee_raw, eng.fee_cap_usd)
    input_set: "Exactly one SearchFirmEngagement — the candidate's sourcing_engagement_id — regardless of status. Engagements in TERMINATED status yield basis NONE and fee 0.00 because fee_status was already set to FEE_WAIVED."
    constants:
      TAIL_OFF_DISCOUNT: 0.50
    precision: "2 decimal places, ROUND_HALF_UP, then the fee_cap_usd MIN is applied to the rounded value"
    variants:
      - name: DIRECT_PLACEMENT
        when: "The hire instant falls inside the half-open exclusivity window [exclusivity_start_date, exclusivity_end_date)."
        difference: "Fee base is total_first_year_comp_usd (guaranteed_comp_usd + signing_bonus_usd) at full fee_pct. For guaranteed 850000.00 + bonus 100000.00 at fee_pct 0.2500 this is 237500.00."
      - name: TAIL_OFF_CLAIM
        when: "The hire instant falls in the tail-off period [exclusivity_end_date, exclusivity_end_date + tail_off_days)."
        difference: "Fee base excludes signing_bonus_usd AND the rate is halved by TAIL_OFF_DISCOUNT. For the same offer this is 106250.00 — a different number from identical offer inputs, on a different entity domain (vendor fee liability) than portable_book_valuation's client-book domain."

  - name: net_first_year_economics
    trigger: "On CompensationOffer creation and on every PATCH /lateral-hiring/offers/{offer_id} re-draft; writes total_first_year_comp_usd, integration_cost_total_usd, net_first_year_economics_usd, guarantee_true_up_amount_usd."
    algorithm: constraint_propagation
    combinatorial_mode: "(c) circular-looking dependency with an explicitly pinned evaluation order: the true-up is keyed on the net, the net depends on the integration cost, the integration cost depends on the search fee, and the search fee depends on the total comp — which the true-up would otherwise feed back into"
    formula: |
      # ================= EVALUATION ORDER IS PINNED =========================
      # STEP 1
      total_first_year_comp_usd = offer.guaranteed_comp_usd + offer.signing_bonus_usd
      #        ^ EXCLUDES guarantee_true_up_amount_usd. This is the cut that makes
      #          the dependency graph acyclic.
      # STEP 2
      search_fee_amount_usd = calculations.search_fee_liability(offer, hire_probe = clock)
      # STEP 3
      integration_cost_total_usd = search_fee_amount_usd
                                 + OFFICE_BUILDOUT_COST_USD
                                 + PARALEGAL_SUPPORT_COST_USD
                                 + ROUND_HALF_UP(ONBOARDING_OVERHEAD_PCT
                                                 * total_first_year_comp_usd, 2)
      # STEP 4
      net_first_year_economics_usd = ROUND_HALF_UP(
            offer.expected_contribution_usd
            - total_first_year_comp_usd
            - integration_cost_total_usd, 2)
      # STEP 5 — reads the net, writes a field that NOTHING in STEPS 1-4 reads
      guarantee_true_up_amount_usd =
            ROUND_HALF_UP(TRUE_UP_HIGH_PCT * offer.guaranteed_comp_usd, 2)
                 if net_first_year_economics_usd >= TRUE_UP_HIGH_NET_THRESHOLD
            else ROUND_HALF_UP(TRUE_UP_LOW_PCT * offer.guaranteed_comp_usd, 2)
                 if net_first_year_economics_usd >= 0
            else 0.00
      # ======================================================================
    input_set: "The single CompensationOffer row plus the sourcing SearchFirmEngagement. No aggregation."
    constants:
      OFFICE_BUILDOUT_COST_USD: 50000.00
      PARALEGAL_SUPPORT_COST_USD: 35000.00
      ONBOARDING_OVERHEAD_PCT: 0.04
      TRUE_UP_HIGH_NET_THRESHOLD: 500000.00
      TRUE_UP_HIGH_PCT: 0.10
      TRUE_UP_LOW_PCT: 0.05
    precision: "2 decimal places, ROUND_HALF_UP, applied at each numbered step as written"

  - name: declination_revenue_split
    trigger: "On MatterDeclination creation (cascade HOP 3 of a waiver refusal or expiry); writes MatterDeclination.foregone_annual_revenue_usd."
    algorithm: waterfall_allocation
    formula: |
      n = LENGTH(entry.matter_types)                # array order is significant
      per_matter = ROUND_DOWN(entry.baseline_portable_amount_usd / n, 2)   # floor to cents
      remainder  = entry.baseline_portable_amount_usd - (per_matter * n)
      FOR i, mt IN ENUMERATE(entry.matter_types):   # index order, never created_at, never id
          foregone_annual_revenue_usd = per_matter + (remainder if i == 0 else 0.00)
      # INVARIANT: SUM(foregone_annual_revenue_usd over the created rows)
      #            == entry.baseline_portable_amount_usd   (exact, to the cent)
    input_set: "Exactly one ClientBookEntry and its matter_types array. One MatterDeclination row per array element."
    constants: {}
    precision: "per_matter floored to 2 decimal places (ROUND_DOWN); the entire remainder is allocated to array index 0"

  - name: committee_quorum_tally
    trigger: "On POST /lateral-hiring/offers/{offer_id}/finalize; decides whether the offer forks to APPROVED or REJECTED, or is rejected with ERR_QUORUM_NOT_MET."
    algorithm: threshold
    formula: |
      votes = CommitteeVote WHERE offer_id == offer.id
                              AND round_number == offer.round_number
                              AND status == 'ACTIVE'
      approve_count = COUNT(votes WHERE decision == 'APPROVE')
      reject_count  = COUNT(votes WHERE decision == 'REJECT')
      abstain_count = COUNT(votes WHERE decision == 'ABSTAIN')
      cast_count    = approve_count + reject_count + abstain_count

      quorum_minimum = CEIL(QUORUM_FRACTION * offer.eligible_voter_count)   # integer
      quorum_met     = cast_count >= quorum_minimum                         # INCLUSIVE >=

      # integer arithmetic, no floats: approve must be at least two thirds of the
      # non-abstaining votes. INCLUSIVE at the exact boundary.
      approval_met = (approve_count * 3) >= (2 * (approve_count + reject_count))

      IF NOT quorum_met:  reject the request with ERR_QUORUM_NOT_MET
      ELIF approval_met:  offer -> APPROVED
      ELSE:               offer -> REJECTED
    input_set: "ACTIVE CommitteeVote rows on this offer whose round_number equals the offer's current round_number. VOIDED votes and votes from earlier rounds are excluded."
    constants:
      QUORUM_FRACTION: 0.60
      MIN_COMMITTEE_SIZE: 3
      MAX_NEGOTIATION_ROUNDS: 3
    precision: "integer counts only; CEIL on the quorum minimum; no floating-point comparison anywhere"

  - name: guarantee_budget_ledger
    trigger: "On CompensationOffer DRAFTED -> COMMITTEE_REVIEW (reserve), COMMITTEE_REVIEW -> {REJECTED, COUNTER_REQUESTED, REPRICE_REQUIRED, LAPSED} (release), and APPROVED -> ACCEPTED (commit); writes PracticeGroup.available_guarantee_budget_usd, reserved_guarantee_budget_usd, committed_guarantee_total_usd."
    algorithm: aggregation
    formula: |
      # Maintained incrementally, but ALWAYS equal to these definitions:
      reserved_guarantee_budget_usd = SUM(o.guaranteed_comp_usd) over CompensationOffer o
            WHERE o.status == 'COMMITTEE_REVIEW'
              AND Candidate[o.candidate_id].target_practice_group_id == pg.id
      committed_guarantee_total_usd = SUM(o.guaranteed_comp_usd) over CompensationOffer o
            WHERE o.status == 'ACCEPTED'
              AND Candidate[o.candidate_id].target_practice_group_id == pg.id
      available_guarantee_budget_usd = pg.guarantee_budget_total_usd
                                     - reserved_guarantee_budget_usd
                                     - committed_guarantee_total_usd

      # CONSERVED QUANTITY (see compensating_invariant):
      #   guarantee_budget_total_usd == available_guarantee_budget_usd
      #                              + reserved_guarantee_budget_usd
      #                              + committed_guarantee_total_usd
      # holds after EVERY mutation, including every release path.
    input_set: "CompensationOffer rows whose candidate targets this practice group, filtered to status COMMITTEE_REVIEW (reserved) and ACCEPTED (committed). All other statuses contribute 0."
    constants: {}
    precision: "2 decimal places; every summand is already 2dp so no rounding is introduced"

  - name: performance_variance
    trigger: "On POST /lateral-hiring/candidates/{candidate_id}/performance-reviews; writes period_days, actual_collections_usd, plan_target_usd, plan_target_adjusted_usd, variance_usd, attainment_pct, cross_sell_credit_count, performance_flag."
    algorithm: chronological
    formula: |
      period_days = (period_end_date.date - period_start_date.date).days + 1   # INCLUSIVE both ends

      actual_collections_usd = SUM(cr.amount_usd) over CollectionRecord cr WHERE
            cr.candidate_id == candidate.id
        AND cr.record_type == 'POST_HIRE'
        AND cr.status == 'VERIFIED'
        AND cr.period_end_date >= review.period_start_date     # INCLUSIVE
        AND cr.period_end_date <= review.period_end_date       # INCLUSIVE (closed)

      offer = CompensationOffer WHERE id == plan.offer_id      # the ACCEPTED offer
      plan_target_usd = ROUND_HALF_UP(offer.expected_contribution_usd
                                       * period_days / DAYS_PER_YEAR, 2)
      plan_target_adjusted_usd = ROUND_HALF_UP(plan_target_usd
                                       * review.realized_standard_rate_usd
                                       / plan.planned_standard_rate_usd, 2)

      cross_sell_credit_count = COUNT(CrossSellIntroduction i WHERE
              i.integration_plan_id == review.integration_plan_id
          AND i.status == 'COMPLETED'
          AND i.completed_at <= review.period_end_date)        # INCLUSIVE

      attainment_pct = ROUND_HALF_UP(actual_collections_usd / plan_target_usd, 4)
                       if plan_target_usd > 0 else 0.0000
      performance_flag = 'ON_PLAN'    if attainment_pct >= ON_PLAN_THRESHOLD
                    else 'WATCH'      if attainment_pct >= WATCH_THRESHOLD
                    else 'BELOW_PLAN'
      # attainment_pct and performance_flag ALWAYS use plan_target_usd, never the
      # rate-adjusted target — only variance_usd is basis-dependent.
    input_set: "VERIFIED POST_HIRE CollectionRecord rows for the candidate whose period_end_date lies in the CLOSED review period. UNVERIFIED rows and HISTORICAL rows are excluded; a period with no qualifying rows yields actual_collections_usd == 0.00, not an error."
    constants:
      DAYS_PER_YEAR: 365
      ON_PLAN_THRESHOLD: 0.90
      WATCH_THRESHOLD: 0.70
    precision: "money: 2 decimal places ROUND_HALF_UP. attainment_pct: 4 decimal places ROUND_HALF_UP."
    variants:
      - name: PLAN_BASIS
        when: "review.variance_basis == 'PLAN_BASIS' — measures against the business plan exactly as committed."
        difference: "variance_usd = ROUND_HALF_UP(actual_collections_usd - plan_target_usd, 2). Ignores realized_standard_rate_usd entirely."
      - name: RATE_ADJUSTED_BASIS
        when: "review.variance_basis == 'RATE_ADJUSTED_BASIS' — neutralises rate slippage so the partner is measured on volume, not on discounting."
        difference: "variance_usd = ROUND_HALF_UP(actual_collections_usd - plan_target_adjusted_usd, 2). For identical collections and period, a realized rate below the planned rate makes this variance strictly less negative than PLAN_BASIS — different number, same inputs, on the post-hire-performance entity domain."

  - name: vote_ledger_reconciliation
    trigger: "On CommitteeVote creation, on POST /lateral-hiring/offers/{offer_id}/counter, and on the COMMITTEE_REVIEW -> REPRICE_REQUIRED cascade; writes CompensationOffer.votes_cast_total, active_vote_count, voided_vote_count."
    algorithm: aggregation
    formula: |
      active_vote_count = COUNT(CommitteeVote WHERE offer_id == offer.id AND status == 'ACTIVE')
      voided_vote_count = COUNT(CommitteeVote WHERE offer_id == offer.id AND status == 'VOIDED')
      votes_cast_total  = COUNT(CommitteeVote WHERE offer_id == offer.id)   # all rounds, all statuses

      # CONSERVED QUANTITY (see compensating_invariant):
      #   votes_cast_total == active_vote_count + voided_vote_count
      # A counter VOIDS votes; it never deletes them, so votes_cast_total is
      # monotonic non-decreasing and the identity holds after every round reset.
    input_set: "Every CommitteeVote row with offer_id == offer.id, across all rounds and both statuses."
    constants: {}
    precision: "integer counts"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
# Business-rule ordering rationale for this domain: professional-responsibility
# and segregation-of-duties checks (safety) outrank everything, because a firm may
# not price or vote on a hire it is ethically barred from making. Referential
# integrity of cross-aggregate pointers comes next, then temporal/exclusivity
# geometry, then structural caps, and finally money — a partner's guarantee budget
# is the LAST thing that stops a lateral hire.

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the declared roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the target endpoint's roles in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-templated resource exists, validated LEFT-TO-RIGHT in path order; then body-referenced foreign keys are validated in the declaration order given by the endpoint's input list"
    error_id: "ERR_PRACTICE_GROUP_NOT_FOUND | ERR_SEARCH_FIRM_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_QUESTIONNAIRE_NOT_FOUND | ERR_CLIENT_BOOK_ENTRY_NOT_FOUND | ERR_COLLECTION_RECORD_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_CONFLICT_CHECK_NOT_FOUND | ERR_WAIVER_NOT_FOUND | ERR_DECLINATION_NOT_FOUND | ERR_OFFER_NOT_FOUND | ERR_VOTE_NOT_FOUND | ERR_INTEGRATION_PLAN_NOT_FOUND | ERR_INTRODUCTION_NOT_FOUND | ERR_PERFORMANCE_REVIEW_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path or body resource references"

  - priority: 4
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, types correct, enum members valid, numeric ranges honored, array cardinalities honored, ISO 8601 datetimes parseable, and pagination limit in [1,100] with offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "OCC: expected_candidate_version equals Candidate.version on offer creation; expected_questionnaire_version equals LateralQuestionnaire.version on assessment creation"
    error_id: "ERR_STALE_CANDIDATE_VERSION | ERR_STALE_QUESTIONNAIRE_VERSION"
    http_status: 412
    applies_to: "POST /lateral-hiring/candidates/{candidate_id}/offers, POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"

  - priority: 6
    category: auth
    check: "For entity_backed roles, X-User-ID owns the target resource: Candidate role acting on a LateralQuestionnaire/ClientBookEntry/CompensationOffer must equal the owning candidate_id; PracticeGroupLeader acting on an IntegrationPlan/CrossSellIntroduction/PerformanceReview must equal that plan's practice_group_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /lateral-hiring/questionnaires/{questionnaire_id}/client-book-entries, DELETE /lateral-hiring/client-book-entries/{entry_id}, POST /lateral-hiring/questionnaires/{questionnaire_id}/submit, POST /lateral-hiring/offers/{offer_id}/accept, POST /lateral-hiring/candidates/{candidate_id}/integration-plans, POST /lateral-hiring/integration-plans/{plan_id}/activate, POST /lateral-hiring/integration-plans/{plan_id}/introductions, POST /lateral-hiring/introductions/{introduction_id}/complete, POST /lateral-hiring/candidates/{candidate_id}/performance-reviews"

  - priority: 7
    category: state
    check: "The target resource's state_field permits this transition per §1.2 (the requested transition's `from:` matches the current value)"
    error_id: "ERR_CANDIDATE_INVALID_STATE | ERR_QUESTIONNAIRE_INVALID_STATE | ERR_ENGAGEMENT_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE | ERR_CONFLICT_CHECK_INVALID_STATE | ERR_WAIVER_INVALID_STATE | ERR_DECLINATION_INVALID_STATE | ERR_OFFER_INVALID_STATE | ERR_INTEGRATION_PLAN_INVALID_STATE | ERR_INTRODUCTION_INVALID_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint"

  - priority: 8
    category: business_safety
    check: "Segregation of duties on votes: X-User-ID != Candidate.sponsor_user_id for the candidate whose offer is being voted on"
    error_id: ERR_SPONSOR_CANNOT_VOTE
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/votes"

  - priority: 9
    category: business_safety
    check: "Segregation of duties on finalization: X-User-ID != CompensationOffer.created_by_user_id"
    error_id: ERR_OFFER_CREATOR_CANNOT_FINALIZE
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/finalize"

  - priority: 10
    category: business_safety
    check: "Conflicts clearance is complete: Candidate.clearance_status == CLEARED"
    error_id: ERR_CLEARANCE_INCOMPLETE
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/submit, POST /lateral-hiring/offers/{offer_id}/accept"

  - priority: 11
    category: business_safety
    check: "A ConflictCheck with severity == DIRECT_ADVERSE cannot be cleared directly, and a DIRECT_ADVERSE check cannot be waived with waiver_strategy == ETHICAL_WALL"
    error_id: ERR_DIRECT_ADVERSE_REQUIRES_WAIVER
    http_status: 409
    applies_to: "POST /lateral-hiring/conflict-checks/{conflict_check_id}/clear, POST /lateral-hiring/conflict-checks/{conflict_check_id}/waivers"

  - priority: 12
    category: business_safety
    check: "Prior-firm constraints: a CrossSellIntroduction slot_start_at must be >= Candidate.resignation_date + non_solicit_days days, and — when Candidate.approach_confidential is true — target_client_name must not equal the client_name of an ACTIVE ClientBookEntry on the candidate's LateralQuestionnaire whose client_consent_status == CONSENT_PENDING"
    error_id: "ERR_NON_SOLICIT_RESTRICTION | ERR_CONFIDENTIAL_APPROACH_RESTRICTION"
    http_status: 409
    applies_to: "POST /lateral-hiring/integration-plans/{plan_id}/introductions"

  - priority: 13
    category: business_safety
    check: "Notice period: IntegrationPlan.onboarding_start_date must be >= Candidate.earliest_start_date (resignation_date + notice_period_days)"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /lateral-hiring/candidates/{candidate_id}/integration-plans"

  - priority: 14
    category: business_referential
    check: "Cross-aggregate pointers agree: PortabilityAssessment.questionnaire_id's LPQ has candidate_id == the path candidate; CompensationOffer.candidate_id == the path candidate for a plan; ClientBookEntry.questionnaire_id == the path questionnaire; ConflictCheck.affected_matter_types is a subset of the entry's matter_types"
    error_id: "ERR_ASSESSMENT_CANDIDATE_MISMATCH | ERR_OFFER_CANDIDATE_MISMATCH | ERR_MATTER_TYPE_NOT_ON_ENTRY"
    http_status: 422
    applies_to: "POST /lateral-hiring/candidates/{candidate_id}/offers, POST /lateral-hiring/candidates/{candidate_id}/integration-plans, POST /lateral-hiring/client-book-entries/{entry_id}/conflict-checks"

  - priority: 15
    category: business_referential
    check: "Vote round agreement: request round_number == CompensationOffer.round_number"
    error_id: ERR_VOTE_ROUND_MISMATCH
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/votes"

  - priority: 16
    category: business_referential
    check: "The referenced PortabilityAssessment status == CURRENT; status == STALE yields ERR_ASSESSMENT_STALE and status == SUPERSEDED yields ERR_ASSESSMENT_INVALID_STATE"
    error_id: "ERR_ASSESSMENT_STALE | ERR_ASSESSMENT_INVALID_STATE"
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/submit, POST /lateral-hiring/candidates/{candidate_id}/offers"

  - priority: 17
    category: business_temporal
    check: "SearchFirmEngagement exclusivity geometry on the PRACTICE GROUP resource, HALF-OPEN [start, end) with a mandatory quiet gap: no existing ACTIVE engagement on the same practice_group_id may have a half-open window overlapping the requested one, and the requested exclusivity_start_date must be >= existing.exclusivity_end_date + existing.tail_off_days days"
    error_id: ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT
    http_status: 409
    applies_to: "POST /lateral-hiring/search-firm-engagements"

  - priority: 18
    category: business_temporal
    check: "SearchFirm aggregate concurrency on the SEARCH FIRM resource, CLOSED [start, end] intervals: the count of ACTIVE engagements for the same search_firm_id whose CLOSED window intersects the requested CLOSED window must be < SearchFirm.max_concurrent_engagements. Touching endpoints (existing.end == requested.start) DO intersect under closed semantics."
    error_id: ERR_SEARCH_FIRM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /lateral-hiring/search-firm-engagements"

  - priority: 19
    category: business_temporal
    check: "CrossSellIntroduction slot geometry on the INTEGRATION PLAN resource, CLOSED [start, end] pairwise exclusion plus closed containment: the requested slot must satisfy plan.onboarding_start_date <= slot_start_at AND slot_end_at <= plan.onboarding_end_date, and must not intersect any PROPOSED/COMPLETED slot on the same plan under closed semantics"
    error_id: "ERR_INTRODUCTION_OUTSIDE_WINDOW | ERR_INTRODUCTION_SLOT_CONFLICT"
    http_status: 409
    applies_to: "POST /lateral-hiring/integration-plans/{plan_id}/introductions"

  - priority: 20
    category: business_temporal
    check: "Window sanity: exclusivity_end_date > exclusivity_start_date; onboarding_end_date > onboarding_start_date; slot_end_at > slot_start_at; period_end_date > period_start_date; assessment baseline_date > current logical clock is REJECTED (a baseline may not be in the future); waiver response_deadline_date > current logical clock"
    error_id: ERR_LOOKBACK_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /lateral-hiring/search-firm-engagements, POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments, POST /lateral-hiring/conflict-checks/{conflict_check_id}/waivers, POST /lateral-hiring/candidates/{candidate_id}/integration-plans, POST /lateral-hiring/integration-plans/{plan_id}/introductions, POST /lateral-hiring/candidates/{candidate_id}/performance-reviews"

  - priority: 21
    category: business_constraint
    check: "PracticeGroup.status == OPEN for any operation that adds lateral commitment (candidate creation, offer submit, plan activate)"
    error_id: ERR_PRACTICE_GROUP_FROZEN
    http_status: 409
    applies_to: "POST /lateral-hiring/candidates, POST /lateral-hiring/offers/{offer_id}/submit, POST /lateral-hiring/integration-plans/{plan_id}/activate"

  - priority: 22
    category: business_constraint
    check: "SearchFirmEngagement.fee_pct <= SearchFirm.max_fee_pct"
    error_id: ERR_FEE_PCT_ABOVE_FIRM_MAX
    http_status: 422
    applies_to: "POST /lateral-hiring/search-firm-engagements"

  - priority: 23
    category: business_constraint
    check: "ClientBookEntry.client_name is unique per questionnaire_id among rows with status == ACTIVE"
    error_id: ERR_DUPLICATE_CLIENT_ENTRY
    http_status: 409
    applies_to: "POST /lateral-hiring/questionnaires/{questionnaire_id}/client-book-entries"

  - priority: 24
    category: business_constraint
    check: "Client-book data sufficiency: the questionnaire has >= 1 ACTIVE ClientBookEntry at submit and entry_count >= 1 at assessment (else empty book), and at assessment every ACTIVE ClientBookEntry has >= MIN_VERIFIED_RECORDS (3) VERIFIED HISTORICAL CollectionRecord rows with period_end_date inside the half-open lookback window"
    error_id: "ERR_EMPTY_CLIENT_BOOK | ERR_UNVERIFIED_COLLECTION_DATA"
    http_status: 422
    applies_to: "POST /lateral-hiring/questionnaires/{questionnaire_id}/submit, POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"

  - priority: 25
    category: business_constraint
    check: "Round caps: LateralQuestionnaire.revision_round < MAX_REVISION_ROUNDS (3) on request-revision; CompensationOffer.round_number < MAX_NEGOTIATION_ROUNDS (3) on counter"
    error_id: "ERR_REVISION_LIMIT_EXCEEDED | ERR_NEGOTIATION_ROUND_LIMIT_EXCEEDED"
    http_status: 409
    applies_to: "POST /lateral-hiring/questionnaires/{questionnaire_id}/request-revision, POST /lateral-hiring/offers/{offer_id}/counter"

  - priority: 26
    category: business_constraint
    check: "Committee integrity: eligible_voter_count >= MIN_COMMITTEE_SIZE (3) at submit; no ACTIVE vote already exists from this voter_user_id on this offer; offer.active_vote_count < offer.eligible_voter_count"
    error_id: "ERR_COMMITTEE_TOO_SMALL | ERR_DUPLICATE_VOTE | ERR_VOTE_ROLL_FULL"
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/submit, POST /lateral-hiring/offers/{offer_id}/votes"

  - priority: 27
    category: business_constraint
    check: "Quorum: cast_count >= CEIL(0.60 * eligible_voter_count) per calculations.committee_quorum_tally"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /lateral-hiring/offers/{offer_id}/finalize"

  - priority: 28
    category: business_constraint
    check: "Onboarding capacity, INCLUSIVE boundary: PracticeGroup.active_onboarding_count < PracticeGroup.onboarding_capacity. Equality is a rejection."
    error_id: ERR_ONBOARDING_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /lateral-hiring/integration-plans/{plan_id}/activate"

  - priority: 29
    category: business_fiscal
    check: "Guarantee budget, INCLUSIVE boundary: offer.guaranteed_comp_usd <= PracticeGroup.available_guarantee_budget_usd. Equality is allowed; exceeding by any amount is rejected."
    error_id: ERR_GUARANTEE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /lateral-hiring/offers/{offer_id}/submit"

# =============================================================================
# §1.5 Endpoint Table  (every path is rooted at api_prefix /lateral-hiring)
# =============================================================================
# Naming: FK filter parameters on list endpoints are spelled exactly as the FK
# field on the child entity, so every FK in §1.1 is reverse-reachable.

endpoints:

  # --- PracticeGroup ---------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/practice-groups"
    purpose: "Register a practice group that can sponsor lateral hires and carry a guarantee budget."
    roles: [SystemAdmin]
    input: [name, guarantee_budget_total_usd, onboarding_capacity, leverage_ratio, target_standard_rate_usd]
    output: PracticeGroup
    success_status: 201
    side_effects:
      - "status := OPEN; available_guarantee_budget_usd := guarantee_budget_total_usd; reserved_guarantee_budget_usd := 0.00; committed_guarantee_total_usd := 0.00; active_onboarding_count := 0"

  - method: GET
    path: "/lateral-hiring/practice-groups/{practice_group_id}"
    purpose: "Read one practice group including its live guarantee-budget ledger."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: []
    output: PracticeGroup
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/practice-groups"
    purpose: "List practice groups."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["status?", "limit?", "offset?"]
    output: PracticeGroup[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/practice-groups/{practice_group_id}/freeze"
    purpose: "Freeze lateral hiring for a practice group (OPEN -> HIRING_FROZEN)."
    roles: [SystemAdmin]
    input: [reason]
    output: PracticeGroup
    success_status: 200
    side_effects:
      - "status := HIRING_FROZEN"
      - "cascade: every DRAFTED CompensationOffer whose candidate targets this group is left untouched, but submit is subsequently refused by validations.priority 21"

  - method: POST
    path: "/lateral-hiring/practice-groups/{practice_group_id}/unfreeze"
    purpose: "Reopen lateral hiring for a practice group (HIRING_FROZEN -> OPEN)."
    roles: [SystemAdmin]
    input: []
    output: PracticeGroup
    success_status: 200
    side_effects:
      - "status := OPEN"

  # --- SearchFirm ------------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/search-firms"
    purpose: "Register a legal search firm with its negotiated fee ceiling and concurrency cap."
    roles: [SystemAdmin]
    input: [name, max_fee_pct, max_concurrent_engagements]
    output: SearchFirm
    success_status: 201
    side_effects:
      - "engagement_count := 0"

  - method: GET
    path: "/lateral-hiring/search-firms/{search_firm_id}"
    purpose: "Read one search firm."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: []
    output: SearchFirm
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/search-firms"
    purpose: "List search firms."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["limit?", "offset?"]
    output: SearchFirm[]
    success_status: 200
    side_effects: []

  # --- SearchFirmEngagement --------------------------------------------------
  - method: POST
    path: "/lateral-hiring/search-firm-engagements"
    purpose: "Engage a search firm on a practice group under exclusivity and tail-off terms."
    roles: [RecruitingCoordinator]
    input: [search_firm_id, practice_group_id, fee_pct, fee_cap_usd, exclusivity_start_date, exclusivity_end_date, tail_off_days]
    output: SearchFirmEngagement
    success_status: 201
    side_effects:
      - "status := ACTIVE; fee_status := NOT_DUE; fee_basis := null; fee_amount_usd := null"
      - "SearchFirm.engagement_count incremented by 1"

  - method: GET
    path: "/lateral-hiring/search-firm-engagements/{engagement_id}"
    purpose: "Read one search firm engagement."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: []
    output: SearchFirmEngagement
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/search-firm-engagements"
    purpose: "List engagements, optionally narrowed to one search firm or one practice group."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["search_firm_id?", "practice_group_id?", "status?", "limit?", "offset?"]
    output: SearchFirmEngagement[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/search-firm-engagements/{engagement_id}/terminate"
    purpose: "Terminate an engagement early (ACTIVE -> TERMINATED); tail-off exposure survives."
    roles: [RecruitingCoordinator]
    input: [reason]
    output: SearchFirmEngagement
    success_status: 200
    side_effects:
      - "status := TERMINATED"
      - "cascade: sourced candidates remain, but a later hire bills under the TAIL_OFF_CLAIM variant of search_fee_liability"

  # --- Candidate -------------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/candidates"
    purpose: "Open a confidential lateral candidate record against a practice group and sourcing engagement."
    roles: [RecruitingCoordinator]
    input: [full_name, prior_firm_name, target_practice_group_id, sourcing_engagement_id, sponsor_user_id, current_standard_rate_usd, notice_period_days, non_solicit_days, "approach_confidential?"]
    output: Candidate
    success_status: 201
    side_effects:
      - "pipeline_status := SOURCED; clearance_status := NOT_STARTED; resignation_date := null; earliest_start_date := null; hire_date := null; open_offer_id := null"

  - method: GET
    path: "/lateral-hiring/candidates/{candidate_id}"
    purpose: "Read one candidate with both status dimensions."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair, Candidate]
    input: []
    output: Candidate
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/candidates"
    purpose: "List candidates, optionally narrowed by target practice group or sourcing engagement."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["target_practice_group_id?", "sourcing_engagement_id?", "pipeline_status?", "clearance_status?", "limit?", "offset?"]
    output: Candidate[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/approach"
    purpose: "Record the confidential approach (SOURCED -> APPROACHED)."
    roles: [RecruitingCoordinator]
    input: []
    output: Candidate
    success_status: 200
    side_effects:
      - "pipeline_status := APPROACHED; approach_confidential retained as recorded at creation"

  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/withdraw"
    purpose: "Withdraw a candidate from the pipeline; triggers the four-hop abandonment cascade."
    roles: [RecruitingCoordinator]
    input: [withdrawal_reason]
    output: Candidate
    success_status: 200
    side_effects:
      - "pipeline_status := WITHDRAWN"
      - "cascade HOP 2: the candidate's non-terminal LateralQuestionnaire -> ABANDONED and any open CompensationOffer -> LAPSED"
      - "cascade HOP 3: guarantee reservation released to the practice group and the linked IntegrationPlan -> ABANDONED"
      - "cascade HOP 4: that plan's PROPOSED CrossSellIntroduction rows -> CANCELLED and active_onboarding_count decremented when the plan was ACTIVE"

  # --- LateralQuestionnaire --------------------------------------------------
  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/questionnaires"
    purpose: "Open the lateral partner questionnaire for a candidate."
    roles: [RecruitingCoordinator]
    input: [declared_prior_year_billings_usd, declared_prior_year_collections_usd, declared_realization_rate, primary_matter_types]
    output: LateralQuestionnaire
    success_status: 201
    side_effects:
      - "status := DRAFT; revision_round := 0; entry_count := 0; latest_assessment_id := null"

  - method: GET
    path: "/lateral-hiring/questionnaires/{questionnaire_id}"
    purpose: "Read one lateral partner questionnaire."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair, Candidate]
    input: []
    output: LateralQuestionnaire
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/questionnaires"
    purpose: "List questionnaires, optionally narrowed to one candidate."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["candidate_id?", "status?", "limit?", "offset?"]
    output: LateralQuestionnaire[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/questionnaires/{questionnaire_id}/submit"
    purpose: "Candidate submits the questionnaire for firm review (DRAFT|REVISION_REQUESTED -> SUBMITTED)."
    roles: [Candidate]
    input: []
    output: LateralQuestionnaire
    success_status: 200
    side_effects:
      - "status := SUBMITTED; entry_count refreshed from ACTIVE ClientBookEntry rows"

  - method: POST
    path: "/lateral-hiring/questionnaires/{questionnaire_id}/start-review"
    purpose: "Begin diligence review (SUBMITTED -> UNDER_REVIEW)."
    roles: [RecruitingCoordinator]
    input: []
    output: LateralQuestionnaire
    success_status: 200
    side_effects:
      - "status := UNDER_REVIEW"

  - method: POST
    path: "/lateral-hiring/questionnaires/{questionnaire_id}/request-revision"
    purpose: "Send the questionnaire back for correction (UNDER_REVIEW -> REVISION_REQUESTED); bounded loop."
    roles: [RecruitingCoordinator]
    input: [revision_note]
    output: LateralQuestionnaire
    success_status: 200
    side_effects:
      - "status := REVISION_REQUESTED; revision_round incremented by 1"

  - method: POST
    path: "/lateral-hiring/questionnaires/{questionnaire_id}/accept"
    purpose: "Accept the questionnaire as the diligence of record (UNDER_REVIEW -> ACCEPTED)."
    roles: [RecruitingCoordinator]
    input: []
    output: LateralQuestionnaire
    success_status: 200
    side_effects:
      - "status := ACCEPTED"

  # --- ClientBookEntry -------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/questionnaires/{questionnaire_id}/client-book-entries"
    purpose: "Disclose one client relationship with claimed billings, portability and realization."
    roles: [Candidate]
    input: [client_name, relationship_role, "client_consent_status?", claimed_annual_billings_usd, claimed_portability_pct, claimed_realization_rate, matter_types]
    output: ClientBookEntry
    success_status: 201
    side_effects:
      - "status := ACTIVE; portable_status := UNVALIDATED; baseline_portable_amount_usd := null; validated_portable_amount_usd := null; verified_record_count := 0"
      - "LateralQuestionnaire.entry_count incremented by 1"
      - "any CURRENT PortabilityAssessment on this questionnaire -> STALE"

  - method: GET
    path: "/lateral-hiring/client-book-entries/{entry_id}"
    purpose: "Read one client book entry with its validated portable amount."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair, Candidate]
    input: []
    output: ClientBookEntry
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/client-book-entries"
    purpose: "List client book entries, optionally narrowed to one questionnaire; WITHDRAWN rows are hidden by default."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["questionnaire_id?", "status?", "include_withdrawn?", "limit?", "offset?"]
    output: ClientBookEntry[]
    success_status: 200
    side_effects: []

  - method: DELETE
    path: "/lateral-hiring/client-book-entries/{entry_id}"
    purpose: "Soft-delete a disclosed client relationship (-> WITHDRAWN); the row remains referenceable."
    roles: [Candidate]
    input: []
    output: ClientBookEntry
    success_status: 200
    side_effects:
      - "status := WITHDRAWN"
      - "LateralQuestionnaire.entry_count decremented by 1"
      - "any CURRENT PortabilityAssessment on this questionnaire -> STALE"

  # --- CollectionRecord (immutable event log) --------------------------------
  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/collection-records"
    purpose: "Append one immutable historical or projected collection observation."
    roles: [SystemAdmin, RecruitingCoordinator]
    input: ["client_book_entry_id?", record_type, period_end_date, amount_usd, "status?", source]
    output: CollectionRecord
    success_status: 201
    side_effects:
      - "row is append-only: no version field, no update endpoint, no delete endpoint"
      - "any CURRENT PortabilityAssessment on the candidate's questionnaire -> STALE when record_type == HISTORICAL and status == VERIFIED"

  - method: GET
    path: "/lateral-hiring/collection-records/{record_id}"
    purpose: "Read one collection record."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: []
    output: CollectionRecord
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/collection-records"
    purpose: "List collection records, optionally narrowed to one candidate or one client book entry."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["candidate_id?", "client_book_entry_id?", "record_type?", "status?", "limit?", "offset?"]
    output: CollectionRecord[]
    success_status: 200
    side_effects: []

  # --- PortabilityAssessment -------------------------------------------------
  - method: POST
    path: "/lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"
    purpose: "Validate portable business against historical collections and grade client concentration. Guarded by OCC on the parent questionnaire."
    roles: [RecruitingCoordinator]
    input: [baseline_date, "governing_basis?", expected_questionnaire_version]
    output: PortabilityAssessment
    success_status: 201
    side_effects:
      - "requires expected_questionnaire_version == LateralQuestionnaire.version, else ERR_STALE_QUESTIONNAIRE_VERSION (412)"
      - "lookback_start_date := baseline_date - LOOKBACK_MONTHS (36) months"
      - "every in-scope ClientBookEntry gets baseline_portable_amount_usd and validated_portable_amount_usd computed and portable_status -> VALIDATED"
      - "self_reported_total_usd, gross_baseline_total_usd, validated_portable_total_usd, declined_portable_total_usd, variance_pct, top_client_share, top3_client_share, concentration_grade, concentration_haircut_pct and adjusted_portable_total_usd computed"
      - "status := CURRENT; any previously CURRENT assessment on this questionnaire -> SUPERSEDED"
      - "LateralQuestionnaire.latest_assessment_id := this assessment id; LateralQuestionnaire.version incremented"

  - method: GET
    path: "/lateral-hiring/portability-assessments/{assessment_id}"
    purpose: "Read one portability assessment with its full validation and concentration output."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: []
    output: PortabilityAssessment
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/portability-assessments"
    purpose: "List portability assessments, optionally narrowed to one questionnaire."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["questionnaire_id?", "status?", "limit?", "offset?"]
    output: PortabilityAssessment[]
    success_status: 200
    side_effects: []

  # --- ConflictCheck ---------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/client-book-entries/{entry_id}/conflict-checks"
    purpose: "Open a conflicts check against one disclosed client relationship."
    roles: [ConflictsCounsel]
    input: [adverse_party_name, affected_matter_types, severity]
    output: ConflictCheck
    success_status: 201
    side_effects:
      - "status := PENDING; resolution_note := null"
      - "Candidate.clearance_status NOT_STARTED -> IN_PROGRESS on the first check"

  - method: GET
    path: "/lateral-hiring/conflict-checks/{conflict_check_id}"
    purpose: "Read one conflicts check."
    roles: [SystemAdmin, RecruitingCoordinator, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: []
    output: ConflictCheck
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/conflict-checks"
    purpose: "List conflicts checks, optionally narrowed to one client book entry."
    roles: [SystemAdmin, RecruitingCoordinator, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["client_book_entry_id?", "status?", "severity?", "limit?", "offset?"]
    output: ConflictCheck[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/conflict-checks/{conflict_check_id}/clear"
    purpose: "Clear a non-adverse conflicts check outright (PENDING -> CLEAR)."
    roles: [ConflictsCounsel]
    input: [resolution_note]
    output: ConflictCheck
    success_status: 200
    side_effects:
      - "status := CLEAR"
      - "Candidate.clearance_status recomputed and may become CLEARED"

  # --- ConflictWaiver --------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/conflict-checks/{conflict_check_id}/waivers"
    purpose: "Pursue a waiver strategy on a conflicted relationship (check PENDING -> WAIVER_PENDING)."
    roles: [ConflictsCounsel]
    input: [waiver_strategy, requested_from_client, response_deadline_date]
    output: ConflictWaiver
    success_status: 201
    side_effects:
      - "status := REQUESTED; decided_at := null"
      - "ConflictCheck.status := WAIVER_PENDING"

  - method: GET
    path: "/lateral-hiring/conflict-waivers/{waiver_id}"
    purpose: "Read one conflict waiver."
    roles: [SystemAdmin, RecruitingCoordinator, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: []
    output: ConflictWaiver
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/conflict-waivers"
    purpose: "List conflict waivers, optionally narrowed to one conflicts check."
    roles: [SystemAdmin, RecruitingCoordinator, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["conflict_check_id?", "status?", "limit?", "offset?"]
    output: ConflictWaiver[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/conflict-waivers/{waiver_id}/grant"
    purpose: "Record that the client granted the waiver (REQUESTED -> GRANTED)."
    roles: [ConflictsCounsel]
    input: [resolution_note]
    output: ConflictWaiver
    success_status: 200
    side_effects:
      - "status := GRANTED; decided_at := current logical clock"
      - "ConflictCheck WAIVER_PENDING -> CLEAR; Candidate.clearance_status recomputed"

  - method: POST
    path: "/lateral-hiring/conflict-waivers/{waiver_id}/refuse"
    purpose: "Record that the client refused the waiver (REQUESTED -> REFUSED); triggers the declination cascade."
    roles: [ConflictsCounsel]
    input: [resolution_note]
    output: ConflictWaiver
    success_status: 200
    side_effects:
      - "status := REFUSED; decided_at := current logical clock"
      - "cascade HOP 2: ConflictCheck WAIVER_PENDING -> BLOCKED"
      - "cascade HOP 3: one MatterDeclination per affected matter type is created, the ClientBookEntry VALIDATED -> DECLINED, and Candidate.clearance_status -> BLOCKED"
      - "cascade HOP 4: the CURRENT PortabilityAssessment is recomputed so declined_portable_total_usd absorbs the entry and adjusted_portable_total_usd shrinks"

  # --- MatterDeclination (system-created by the refusal cascade) --------------
  - method: GET
    path: "/lateral-hiring/matter-declinations/{declination_id}"
    purpose: "Read one matter declination with its foregone-revenue share."
    roles: [SystemAdmin, RecruitingCoordinator, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: []
    output: MatterDeclination
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/matter-declinations"
    purpose: "List matter declinations, optionally narrowed to one conflicts check or one client book entry."
    roles: [SystemAdmin, RecruitingCoordinator, ConflictsCounsel, CommitteeMember, CommitteeChair]
    input: ["conflict_check_id?", "client_book_entry_id?", "status?", "limit?", "offset?"]
    output: MatterDeclination[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/matter-declinations/{declination_id}/rescind"
    purpose: "Compensating action: rescind a declination (ACTIVE -> RESCINDED) and restore the entry when it was the last one."
    roles: [ConflictsCounsel]
    input: [rescission_note]
    output: MatterDeclination
    success_status: 200
    side_effects:
      - "status := RESCINDED; rescinded_at := current logical clock"
      - "when this was the last ACTIVE declination on the entry: ClientBookEntry DECLINED -> VALIDATED, ConflictCheck BLOCKED -> CLEAR, the CURRENT assessment recomputed, Candidate.clearance_status recomputed"
      - "the assessment identity validated_portable_total_usd + declined_portable_total_usd == gross_baseline_total_usd holds before and after"

  # --- CompensationOffer -----------------------------------------------------
  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/offers"
    purpose: "Model a compensation offer against the assessed portable book. Guarded by OCC on the parent candidate."
    roles: [CommitteeChair]
    input: [portability_assessment_id, guaranteed_comp_usd, signing_bonus_usd, expected_candidate_version]
    output: CompensationOffer
    success_status: 201
    side_effects:
      - "requires expected_candidate_version == Candidate.version, else ERR_STALE_CANDIDATE_VERSION (412)"
      - "created_by_user_id := X-User-ID; status := DRAFTED; round_number := 1; eligible_voter_count := null; votes_cast_total := 0; active_vote_count := 0; voided_vote_count := 0"
      - "adjusted_portable_total_snapshot_usd, expected_contribution_usd, total_first_year_comp_usd, search_fee_amount_usd, integration_cost_total_usd, net_first_year_economics_usd and guarantee_true_up_amount_usd computed"
      - "Candidate.open_offer_id := this offer id; Candidate.version incremented"

  - method: GET
    path: "/lateral-hiring/offers/{offer_id}"
    purpose: "Read one compensation offer with its full economics model."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair, Candidate]
    input: []
    output: CompensationOffer
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/offers"
    purpose: "List offers, optionally narrowed to one candidate or one portability assessment."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["candidate_id?", "portability_assessment_id?", "status?", "limit?", "offset?"]
    output: CompensationOffer[]
    success_status: 200
    side_effects: []

  - method: PATCH
    path: "/lateral-hiring/offers/{offer_id}"
    purpose: "Re-draft the economics of an offer that came back COUNTER_REQUESTED (-> DRAFTED)."
    roles: [CommitteeChair]
    input: [guaranteed_comp_usd, signing_bonus_usd]
    output: CompensationOffer
    success_status: 200
    side_effects:
      - "status := DRAFTED"
      - "all seven computed economics fields recomputed from the new inputs against the still-pinned adjusted_portable_total_snapshot_usd"

  - method: POST
    path: "/lateral-hiring/offers/{offer_id}/submit"
    purpose: "Send the offer to the lateral hiring committee (DRAFTED -> COMMITTEE_REVIEW) and reserve the guarantee."
    roles: [CommitteeChair]
    input: [eligible_voter_count]
    output: CompensationOffer
    success_status: 200
    side_effects:
      - "status := COMMITTEE_REVIEW; eligible_voter_count snapshotted from the request"
      - "PracticeGroup.reserved_guarantee_budget_usd increased by guaranteed_comp_usd and available_guarantee_budget_usd decreased by the same amount"

  - method: POST
    path: "/lateral-hiring/offers/{offer_id}/finalize"
    purpose: "Close committee voting and tally quorum (COMMITTEE_REVIEW -> APPROVED | REJECTED)."
    roles: [CommitteeChair]
    input: []
    output: CompensationOffer
    success_status: 200
    side_effects:
      - "requires X-User-ID != created_by_user_id (segregation of duties)"
      - "status := APPROVED when 2 * approve_count >= 2 * quorum_minimum is satisfied by the two-thirds rule of calculations.committee_quorum_tally, else REJECTED"
      - "on REJECTED: the guarantee reservation is released back to available_guarantee_budget_usd"

  - method: POST
    path: "/lateral-hiring/offers/{offer_id}/counter"
    purpose: "Candidate counters an approved offer (APPROVED -> COUNTER_REQUESTED); voids the round."
    roles: [CommitteeChair]
    input: [counter_note]
    output: CompensationOffer
    success_status: 200
    side_effects:
      - "status := COUNTER_REQUESTED; round_number incremented by 1; eligible_voter_count := null"
      - "every ACTIVE CommitteeVote -> VOIDED; active_vote_count := 0; voided_vote_count increased by the number voided; votes_cast_total UNCHANGED"
      - "the guarantee reservation is released back to available_guarantee_budget_usd"

  - method: POST
    path: "/lateral-hiring/offers/{offer_id}/accept"
    purpose: "Candidate accepts an approved offer (APPROVED -> ACCEPTED); commits the guarantee and hires."
    roles: [Candidate]
    input: []
    output: CompensationOffer
    success_status: 200
    side_effects:
      - "status := ACCEPTED; accepted_at := current logical clock"
      - "PracticeGroup.reserved_guarantee_budget_usd reduced by guaranteed_comp_usd and committed_guarantee_total_usd increased by the same amount; available_guarantee_budget_usd UNCHANGED"
      - "cascade HOP 2: Candidate.pipeline_status OFFER_OUT -> HIRED with resignation_date, hire_date and earliest_start_date set"
      - "cascade HOP 3: the sourcing SearchFirmEngagement fee crystallises (fee_status := FEE_DUE, fee_basis := DIRECT_PLACEMENT or TAIL_OFF_CLAIM, fee_amount_usd computed)"

  # --- CommitteeVote ---------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/offers/{offer_id}/votes"
    purpose: "Cast one committee vote on the offer's current round."
    roles: [CommitteeMember, CommitteeChair]
    input: [decision, round_number, "rationale?"]
    output: CommitteeVote
    success_status: 201
    side_effects:
      - "voter_user_id := X-User-ID; status := ACTIVE"
      - "requires X-User-ID != Candidate.sponsor_user_id (segregation of duties)"
      - "offer.votes_cast_total and offer.active_vote_count each incremented by 1"

  - method: GET
    path: "/lateral-hiring/votes/{vote_id}"
    purpose: "Read one committee vote."
    roles: [SystemAdmin, CommitteeMember, CommitteeChair]
    input: []
    output: CommitteeVote
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/votes"
    purpose: "List committee votes, optionally narrowed to one offer."
    roles: [SystemAdmin, CommitteeMember, CommitteeChair]
    input: ["offer_id?", "status?", "round_number?", "limit?", "offset?"]
    output: CommitteeVote[]
    success_status: 200
    side_effects: []

  # --- IntegrationPlan -------------------------------------------------------
  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/integration-plans"
    purpose: "Draft the integration plan: practice group assignment, onboarding window and cross-sell target."
    roles: [PracticeGroupLeader]
    input: [practice_group_id, offer_id, onboarding_start_date, onboarding_end_date, planned_standard_rate_usd, cross_sell_target_count]
    output: IntegrationPlan
    success_status: 201
    side_effects:
      - "status := DRAFT; introduction_count := 0; completed_introduction_count := 0"

  - method: GET
    path: "/lateral-hiring/integration-plans/{plan_id}"
    purpose: "Read one integration plan."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair, Candidate]
    input: []
    output: IntegrationPlan
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/integration-plans"
    purpose: "List integration plans, optionally narrowed to one candidate, practice group or offer."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["candidate_id?", "practice_group_id?", "offer_id?", "status?", "limit?", "offset?"]
    output: IntegrationPlan[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/integration-plans/{plan_id}/abandon"
    purpose: "Abandon an integration plan ({DRAFT, ACTIVE} -> ABANDONED); cancels its PROPOSED introductions and returns the onboarding slot when the plan was ACTIVE."
    roles: [PracticeGroupLeader]
    input: [abandonment_reason]
    output: IntegrationPlan
    success_status: 200
    side_effects:
      - "status := ABANDONED"
      - "every CrossSellIntroduction on this plan with status == PROPOSED -> CANCELLED"
      - "PracticeGroup.active_onboarding_count decremented by 1 ONLY when the plan was ACTIVE"

  - method: POST
    path: "/lateral-hiring/integration-plans/{plan_id}/activate"
    purpose: "Activate the integration plan (DRAFT -> ACTIVE) and consume one onboarding slot."
    roles: [PracticeGroupLeader]
    input: []
    output: IntegrationPlan
    success_status: 200
    side_effects:
      - "status := ACTIVE"
      - "PracticeGroup.active_onboarding_count incremented by 1"

  # --- CrossSellIntroduction -------------------------------------------------
  - method: POST
    path: "/lateral-hiring/integration-plans/{plan_id}/introductions"
    purpose: "Schedule a cross-selling introduction inside the onboarding window."
    roles: [PracticeGroupLeader]
    input: [target_client_name, introducing_partner_name, slot_start_at, slot_end_at]
    output: CrossSellIntroduction
    success_status: 201
    side_effects:
      - "status := PROPOSED; completed_at := null"
      - "IntegrationPlan.introduction_count incremented by 1"

  - method: GET
    path: "/lateral-hiring/introductions/{introduction_id}"
    purpose: "Read one cross-selling introduction."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: []
    output: CrossSellIntroduction
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/introductions"
    purpose: "List cross-selling introductions, optionally narrowed to one integration plan."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["integration_plan_id?", "status?", "limit?", "offset?"]
    output: CrossSellIntroduction[]
    success_status: 200
    side_effects: []

  - method: POST
    path: "/lateral-hiring/introductions/{introduction_id}/complete"
    purpose: "Mark an introduction as held (PROPOSED -> COMPLETED)."
    roles: [PracticeGroupLeader]
    input: []
    output: CrossSellIntroduction
    success_status: 200
    side_effects:
      - "status := COMPLETED; completed_at := current logical clock"
      - "IntegrationPlan.completed_introduction_count incremented by 1"

  # --- PerformanceReview -----------------------------------------------------
  - method: POST
    path: "/lateral-hiring/candidates/{candidate_id}/performance-reviews"
    purpose: "Score post-hire performance against the business plan on the requested variance basis."
    roles: [PracticeGroupLeader]
    input: [integration_plan_id, period_start_date, period_end_date, variance_basis, realized_standard_rate_usd]
    output: PerformanceReview
    success_status: 201
    side_effects:
      - "period_days, actual_collections_usd, plan_target_usd, plan_target_adjusted_usd, variance_usd, attainment_pct, cross_sell_credit_count and performance_flag computed"

  - method: GET
    path: "/lateral-hiring/performance-reviews/{review_id}"
    purpose: "Read one post-hire performance review."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair, Candidate]
    input: []
    output: PerformanceReview
    success_status: 200
    side_effects: []

  - method: GET
    path: "/lateral-hiring/performance-reviews"
    purpose: "List performance reviews, optionally narrowed to one candidate or one integration plan."
    roles: [SystemAdmin, RecruitingCoordinator, PracticeGroupLeader, CommitteeMember, CommitteeChair]
    input: ["candidate_id?", "integration_plan_id?", "performance_flag?", "limit?", "offset?"]
    output: PerformanceReview[]
    success_status: 200
    side_effects: []

  # --- Test-driving clock ----------------------------------------------------
  - method: POST
    path: "/lateral-hiring/_clock/set_current_utc"
    purpose: "Set the logical current UTC instant used by every date-sensitive rule. The default logical clock before any call is 2026-08-01T00:00:00Z. Advancing the clock past an engagement's exclusivity_end_date + tail_off_days days expires that engagement."
    roles: [SystemAdmin]
    input: [to_iso8601]
    output: "null"
    success_status: 200
    side_effects:
      - "logical clock := to_iso8601"
      - "ACTIVE SearchFirmEngagement rows whose exclusivity_end_date + tail_off_days days is at or before the new clock -> EXPIRED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================

errors:

  # --- auth / authz ---------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own: Candidate X-User-ID != the owning candidate_id, or PracticeGroupLeader X-User-ID != the plan's practice_group_id"

  # --- request schema -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, unknown enum member, numeric out of declared range, unparseable ISO 8601 value, empty required array, or pagination limit outside [1,100]"

  # --- existence ------------------------------------------------------------
  - id: ERR_PRACTICE_GROUP_NOT_FOUND
    http: 404
    condition: "practice_group_id in the path or body matches no PracticeGroup"
  - id: ERR_SEARCH_FIRM_NOT_FOUND
    http: 404
    condition: "search_firm_id in the path or body matches no SearchFirm"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "engagement_id or sourcing_engagement_id matches no SearchFirmEngagement"
  - id: ERR_CANDIDATE_NOT_FOUND
    http: 404
    condition: "candidate_id in the path or body matches no Candidate"
  - id: ERR_QUESTIONNAIRE_NOT_FOUND
    http: 404
    condition: "questionnaire_id in the path or body matches no LateralQuestionnaire"
  - id: ERR_CLIENT_BOOK_ENTRY_NOT_FOUND
    http: 404
    condition: "entry_id or client_book_entry_id matches no ClientBookEntry"
  - id: ERR_COLLECTION_RECORD_NOT_FOUND
    http: 404
    condition: "record_id matches no CollectionRecord"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id or portability_assessment_id matches no PortabilityAssessment"
  - id: ERR_CONFLICT_CHECK_NOT_FOUND
    http: 404
    condition: "conflict_check_id matches no ConflictCheck"
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "waiver_id matches no ConflictWaiver"
  - id: ERR_DECLINATION_NOT_FOUND
    http: 404
    condition: "declination_id matches no MatterDeclination"
  - id: ERR_OFFER_NOT_FOUND
    http: 404
    condition: "offer_id matches no CompensationOffer"
  - id: ERR_VOTE_NOT_FOUND
    http: 404
    condition: "vote_id matches no CommitteeVote"
  - id: ERR_INTEGRATION_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id or integration_plan_id matches no IntegrationPlan"
  - id: ERR_INTRODUCTION_NOT_FOUND
    http: 404
    condition: "introduction_id matches no CrossSellIntroduction"
  - id: ERR_PERFORMANCE_REVIEW_NOT_FOUND
    http: 404
    condition: "review_id matches no PerformanceReview"

  # --- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_CANDIDATE_VERSION
    http: 412
    condition: "expected_candidate_version != Candidate.version on POST /lateral-hiring/candidates/{candidate_id}/offers"
  - id: ERR_STALE_QUESTIONNAIRE_VERSION
    http: 412
    condition: "expected_questionnaire_version != LateralQuestionnaire.version on POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"

  # --- state transitions ---------------------------------------------------
  - id: ERR_CANDIDATE_INVALID_STATE
    http: 409
    condition: "The candidate's pipeline_status or clearance_status does not permit the requested transition"
  - id: ERR_QUESTIONNAIRE_INVALID_STATE
    http: 409
    condition: "The questionnaire's status does not permit the requested transition (e.g. accept from DRAFT, or adding a client book entry while ACCEPTED)"
  - id: ERR_ENGAGEMENT_INVALID_STATE
    http: 409
    condition: "The engagement is not ACTIVE when terminate is requested, or a questionnaire is opened against a non-ACTIVE sourcing engagement"
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "A CompensationOffer create or submit references a PortabilityAssessment whose status is SUPERSEDED (a newer assessment exists on the same questionnaire)"
  - id: ERR_CONFLICT_CHECK_INVALID_STATE
    http: 409
    condition: "The conflicts check is not PENDING when clear or waiver creation is requested, or not BLOCKED when a declination is being rescinded against it"
  - id: ERR_WAIVER_INVALID_STATE
    http: 409
    condition: "The waiver is not REQUESTED when grant or refuse is requested"
  - id: ERR_DECLINATION_INVALID_STATE
    http: 409
    condition: "The declination is already RESCINDED when rescind is requested"
  - id: ERR_OFFER_INVALID_STATE
    http: 409
    condition: "The offer's status does not permit the requested transition (patch outside COUNTER_REQUESTED, submit outside DRAFTED, finalize outside COMMITTEE_REVIEW, accept or counter outside APPROVED, vote outside COMMITTEE_REVIEW)"
  - id: ERR_INTEGRATION_PLAN_INVALID_STATE
    http: 409
    condition: "The plan is not DRAFT when activate is requested, or is not IN {DRAFT, ACTIVE} when abandon is requested, or not ACTIVE when an introduction is scheduled"
  - id: ERR_INTRODUCTION_INVALID_STATE
    http: 409
    condition: "The introduction is not PROPOSED when complete is requested"

  # --- professional responsibility / segregation of duties -----------------
  - id: ERR_SPONSOR_CANNOT_VOTE
    http: 409
    condition: "X-User-ID equals Candidate.sponsor_user_id on POST /lateral-hiring/offers/{offer_id}/votes"
  - id: ERR_OFFER_CREATOR_CANNOT_FINALIZE
    http: 409
    condition: "X-User-ID equals CompensationOffer.created_by_user_id on POST /lateral-hiring/offers/{offer_id}/finalize"
  - id: ERR_CLEARANCE_INCOMPLETE
    http: 409
    condition: "Candidate.clearance_status != CLEARED when an offer is submitted to committee or accepted"
  - id: ERR_DIRECT_ADVERSE_REQUIRES_WAIVER
    http: 409
    condition: "A ConflictCheck with severity == DIRECT_ADVERSE is cleared directly, or is waived with waiver_strategy == ETHICAL_WALL"
  - id: ERR_NON_SOLICIT_RESTRICTION
    http: 409
    condition: "A CrossSellIntroduction slot_start_at falls before Candidate.resignation_date + non_solicit_days days"
  - id: ERR_CONFIDENTIAL_APPROACH_RESTRICTION
    http: 409
    condition: "An introduction names a target_client_name equal to the client_name of an ACTIVE ClientBookEntry on the candidate's LateralQuestionnaire whose client_consent_status == CONSENT_PENDING, while Candidate.approach_confidential is true"
  - id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http: 409
    condition: "IntegrationPlan.onboarding_start_date is earlier than Candidate.earliest_start_date"

  # --- referential integrity across aggregates -----------------------------
  - id: ERR_ASSESSMENT_CANDIDATE_MISMATCH
    http: 422
    condition: "The referenced PortabilityAssessment belongs to a questionnaire of a different candidate than the path candidate"
  - id: ERR_OFFER_CANDIDATE_MISMATCH
    http: 422
    condition: "The referenced CompensationOffer belongs to a different candidate than the path candidate"
  - id: ERR_MATTER_TYPE_NOT_ON_ENTRY
    http: 422
    condition: "affected_matter_types contains a value absent from the client book entry's matter_types"
  - id: ERR_VOTE_ROUND_MISMATCH
    http: 409
    condition: "The vote's round_number does not equal CompensationOffer.round_number"
  - id: ERR_ASSESSMENT_STALE
    http: 409
    condition: "A CompensationOffer create or submit references a PortabilityAssessment whose status is STALE (an in-scope client book entry was declined after the assessment was computed)"

  # --- temporal / interval geometry ----------------------------------------
  - id: ERR_ENGAGEMENT_EXCLUSIVITY_CONFLICT
    http: 409
    condition: "On the practice group resource: the requested half-open [start, end) exclusivity window overlaps an ACTIVE engagement's window, or starts before that engagement's exclusivity_end_date + tail_off_days quiet gap has elapsed"
  - id: ERR_SEARCH_FIRM_CAPACITY_EXCEEDED
    http: 409
    condition: "On the search firm resource: the count of ACTIVE engagements whose CLOSED [start, end] window intersects the requested CLOSED window has reached SearchFirm.max_concurrent_engagements"
  - id: ERR_INTRODUCTION_OUTSIDE_WINDOW
    http: 409
    condition: "The requested introduction slot is not closed-contained in [onboarding_start_date, onboarding_end_date]"
  - id: ERR_INTRODUCTION_SLOT_CONFLICT
    http: 409
    condition: "The requested introduction slot intersects a PROPOSED or COMPLETED slot on the same plan under closed [start, end] semantics, touching endpoints included"
  - id: ERR_LOOKBACK_WINDOW_INVALID
    http: 422
    condition: "A window is degenerate or inverted (end not after start), or an assessment baseline_date / waiver response_deadline_date is on the wrong side of the current logical clock"

  # --- structural constraints ----------------------------------------------
  - id: ERR_PRACTICE_GROUP_FROZEN
    http: 409
    condition: "PracticeGroup.status == HIRING_FROZEN on candidate creation, offer submit or plan activate"
  - id: ERR_FEE_PCT_ABOVE_FIRM_MAX
    http: 422
    condition: "SearchFirmEngagement.fee_pct exceeds SearchFirm.max_fee_pct"
  - id: ERR_DUPLICATE_CLIENT_ENTRY
    http: 409
    condition: "An ACTIVE ClientBookEntry with the same client_name already exists on this questionnaire"
  - id: ERR_EMPTY_CLIENT_BOOK
    http: 422
    condition: "A questionnaire is submitted while it has zero ACTIVE ClientBookEntry rows, or a portability assessment is requested on a questionnaire whose entry_count is 0"
  - id: ERR_UNVERIFIED_COLLECTION_DATA
    http: 422
    condition: "An in-scope ClientBookEntry has fewer than MIN_VERIFIED_RECORDS (3) VERIFIED HISTORICAL CollectionRecord rows inside the half-open lookback window"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "LateralQuestionnaire.revision_round has reached MAX_REVISION_ROUNDS (3) when request-revision is called"
  - id: ERR_NEGOTIATION_ROUND_LIMIT_EXCEEDED
    http: 409
    condition: "CompensationOffer.round_number has reached MAX_NEGOTIATION_ROUNDS (3) when counter is called"
  - id: ERR_COMMITTEE_TOO_SMALL
    http: 409
    condition: "eligible_voter_count is below MIN_COMMITTEE_SIZE (3) on offer submit"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "An ACTIVE CommitteeVote from the same voter_user_id already exists on this offer"
  - id: ERR_VOTE_ROLL_FULL
    http: 409
    condition: "offer.active_vote_count has reached offer.eligible_voter_count"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "The number of ACTIVE votes is below CEIL(0.60 * eligible_voter_count) when finalize is called"
  - id: ERR_ONBOARDING_CAPACITY_REACHED
    http: 409
    condition: "PracticeGroup.active_onboarding_count already equals PracticeGroup.onboarding_capacity on plan activate"

  # --- fiscal ---------------------------------------------------------------
  - id: ERR_GUARANTEE_BUDGET_EXCEEDED
    http: 402
    condition: "offer.guaranteed_comp_usd exceeds PracticeGroup.available_guarantee_budget_usd on offer submit; equality is permitted"

# =============================================================================
# §1.7 RBAC Matrix   (role_model: segregation_of_duties)
# =============================================================================
# Two independent separations are enforced by §1.4 priorities 8 and 9:
#   (1) the sponsoring partner may not vote on the offer for the candidate they sponsor;
#   (2) the chair who drafted an offer may not be the one who finalizes the vote.
# Both compare X-User-ID against a stored user id, never against an entity id.

roles:

  - name: SystemAdmin
    description: "Firm systems operator: seeds practice groups and search firms, ingests collection data from the accounting system, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /lateral-hiring/practice-groups"
      - "POST /lateral-hiring/practice-groups/{practice_group_id}/freeze"
      - "POST /lateral-hiring/practice-groups/{practice_group_id}/unfreeze"
      - "POST /lateral-hiring/search-firms"
      - "POST /lateral-hiring/_clock/set_current_utc"
    shared_operations:
      - "POST /lateral-hiring/candidates/{candidate_id}/collection-records"
      - "all GET reads except GET /lateral-hiring/candidates/{candidate_id} scoped reads reserved to the Candidate role"

  - name: RecruitingCoordinator
    description: "Runs the lateral pipeline: engages search firms, opens candidate records and questionnaires, reviews diligence, and produces portability assessments."
    identity: "opaque"
    exclusive_operations:
      - "POST /lateral-hiring/search-firm-engagements"
      - "POST /lateral-hiring/search-firm-engagements/{engagement_id}/terminate"
      - "POST /lateral-hiring/candidates"
      - "POST /lateral-hiring/candidates/{candidate_id}/approach"
      - "POST /lateral-hiring/candidates/{candidate_id}/withdraw"
      - "POST /lateral-hiring/candidates/{candidate_id}/questionnaires"
      - "POST /lateral-hiring/questionnaires/{questionnaire_id}/start-review"
      - "POST /lateral-hiring/questionnaires/{questionnaire_id}/request-revision"
      - "POST /lateral-hiring/questionnaires/{questionnaire_id}/accept"
      - "POST /lateral-hiring/questionnaires/{questionnaire_id}/portability-assessments"
    shared_operations:
      - "POST /lateral-hiring/candidates/{candidate_id}/collection-records"
      - "GET reads across candidates, questionnaires, client book entries, assessments, conflicts, offers, plans and reviews"

  - name: ConflictsCounsel
    description: "General counsel's office: runs conflicts clearance across the candidate's client base, pursues waivers, and rescinds declinations."
    identity: "opaque"
    exclusive_operations:
      - "POST /lateral-hiring/client-book-entries/{entry_id}/conflict-checks"
      - "POST /lateral-hiring/conflict-checks/{conflict_check_id}/clear"
      - "POST /lateral-hiring/conflict-checks/{conflict_check_id}/waivers"
      - "POST /lateral-hiring/conflict-waivers/{waiver_id}/grant"
      - "POST /lateral-hiring/conflict-waivers/{waiver_id}/refuse"
      - "POST /lateral-hiring/matter-declinations/{declination_id}/rescind"
    shared_operations:
      - "GET reads across candidates, questionnaires, client book entries, conflict checks, waivers and declinations"

  - name: CommitteeChair
    description: "Chair of the lateral hiring committee: models and submits offers, may vote, and finalizes the tally — but never on an offer they drafted."
    identity: "opaque"
    exclusive_operations:
      - "POST /lateral-hiring/candidates/{candidate_id}/offers"
      - "PATCH /lateral-hiring/offers/{offer_id}"
      - "POST /lateral-hiring/offers/{offer_id}/submit"
      - "POST /lateral-hiring/offers/{offer_id}/finalize"
      - "POST /lateral-hiring/offers/{offer_id}/counter"
    shared_operations:
      - "POST /lateral-hiring/offers/{offer_id}/votes"
      - "GET reads across practice groups, candidates, assessments, offers, votes, plans and reviews"

  - name: CommitteeMember
    description: "Voting member of the lateral hiring committee. Reads the diligence package and votes; cannot draft, submit or finalize."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /lateral-hiring/offers/{offer_id}/votes"
      - "GET reads across practice groups, candidates, questionnaires, client book entries, assessments, conflicts, offers, votes, plans and reviews"

  - name: PracticeGroupLeader
    description: "Leader of the receiving practice group: owns the integration plan, cross-selling introductions and post-hire performance reviews for their own group."
    identity: "entity_backed:PracticeGroup"
    exclusive_operations:
      - "POST /lateral-hiring/candidates/{candidate_id}/integration-plans"
      - "POST /lateral-hiring/integration-plans/{plan_id}/activate"
      - "POST /lateral-hiring/integration-plans/{plan_id}/abandon"
      - "POST /lateral-hiring/integration-plans/{plan_id}/introductions"
      - "POST /lateral-hiring/introductions/{introduction_id}/complete"
      - "POST /lateral-hiring/candidates/{candidate_id}/performance-reviews"
    shared_operations:
      - "GET reads across practice groups, candidates, questionnaires, assessments, offers, plans, introductions and reviews"

  - name: Candidate
    description: "The lateral partner candidate: fills in the questionnaire, discloses and withdraws client book entries, submits the questionnaire, and accepts the offer."
    identity: "entity_backed:Candidate"
    exclusive_operations:
      - "POST /lateral-hiring/questionnaires/{questionnaire_id}/client-book-entries"
      - "DELETE /lateral-hiring/client-book-entries/{entry_id}"
      - "POST /lateral-hiring/questionnaires/{questionnaire_id}/submit"
      - "POST /lateral-hiring/offers/{offer_id}/accept"
    shared_operations:
      - "GET /lateral-hiring/candidates/{candidate_id}"
      - "GET /lateral-hiring/questionnaires/{questionnaire_id}"
      - "GET /lateral-hiring/client-book-entries/{entry_id}"
      - "GET /lateral-hiring/offers/{offer_id}"
      - "GET /lateral-hiring/integration-plans/{plan_id}"
      - "GET /lateral-hiring/performance-reviews/{review_id}"
