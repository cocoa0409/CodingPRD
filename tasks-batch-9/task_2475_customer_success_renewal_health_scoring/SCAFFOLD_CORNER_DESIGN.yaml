              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 90, licensed_seats: 100, feature_depth_pct: 80.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/segmentation"
              payload: {}
              as: CsOpsAdmin
              captures: { acct_v_seg: $.data.version }
          trigger:
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v1}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /coverage-assignments"
              payload: { account_id: "${acct_id}", expected_account_version: "${acct_v_seg}", csm_id: "${csm_a_id}" }
              as: CsOpsAdmin
              captures: { ca1_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 412 with data.error_id == \"ERR_STALE_ACCOUNT_VERSION\" and writes no CoverageAssignment."
            - "Csm.${csm_a_id}.capacity_units_committed == 0 immediately after the rejected call."
            - "The second trigger call returns HTTP 201: CoverageAssignment.${ca1_id}.state == \"COMMITTED\" and load_units == 17."
            - "Csm.${csm_a_id}.capacity_units_committed == 17 and capacity_units_available == 23."
            - "Account.${acct_id}.version is strictly greater than ${acct_v1} and coverage_posture == \"OPEN\"."

