  # =========================================================================
  # 7. RBAC (§1.7) — role_model: segregation_of_duties
  # =========================================================================
  - section: rbac
    instances:
      - name: every_role_exercises_its_own_exclusive_and_shared_operations
        claim_type: exclusive_operations
        grounds:
          - roles[SellerUser]
          - roles[CounterpartyAnalyst]
          - roles[QCReviewer]
          - roles[LockDeskTrader]
          - roles[PurchaseReviewer]
          - roles[PlatformAdmin]
        distinguishing_aspect: |
          One end-to-end pass in which every one of the six roles performs at
          least one of its own exclusive operations AND both partners of four
          shared operations act in turn: the lock and the delivery are done once
          by LockDeskTrader and once by SellerUser, the statement is filed by
          the seller itself, the waiver by PlatformAdmin, the settlement by
          PlatformAdmin, and the standing action once by each of its two owners.
          Not a single call may answer ERR_FORBIDDEN_ROLE.
        test_recipe:
          setup:
            - "no pre-existing state; the recipe IS the traversal"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/products"
              payload: { product_code: "CONF30F", base_price_pct: 101.250, min_fico: 680, max_ltv_pct: 95.0, max_loan_amount_cents: 76650000, allowed_commitment_types: ["MANDATORY", "BEST_EFFORTS"], allowed_occupancies: ["PRIMARY", "SECOND_HOME"], srp_pct: 1.250 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { p_conf: $.data.id }
            - call: "POST /correspondent/products/${p_conf}/pricing-adjustments"
              payload: { adjustment_code: "LLPA-F700-L85", fico_min: 700, fico_max: 739, ltv_min_pct: 80.0, ltv_max_pct: 85.0, price_adjustment_bps: -50 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/sellers"
              payload: { legal_name: "Harbor Point Mortgage LLC", tin: "823391045", seller_type: "NON_BANK_IMB" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /correspondent/sellers/${s1}/financial-statements"
              payload: { fiscal_year_end: "2025-12-31", audited: true, tangible_net_worth_cents: 300000000, liquid_assets_cents: 80000000 }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { fs1: $.data.id }
            - call: "POST /correspondent/financial-statements/${fs1}/review"
              payload: { decision: "ACCEPT", review_note: "audited statement accepted" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/sellers/${s1}/qc-reviews"
              payload: { review_type: "PRE_APPROVAL" }
              as: QCReviewer
              as_user_id: "u-qc-1"
              captures: { q1: $.data.id }
            - call: "POST /correspondent/qc-reviews/${q1}/complete"
              payload: { findings_count: 2, critical_findings_count: 0 }
              as: QCReviewer
              as_user_id: "u-qc-1"
            - call: "POST /correspondent/sellers/${s1}/approval-decision"
              payload: { decision: "APPROVE" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "MANDATORY", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { c_desk: $.data.id, cdv: $.data.version }
            - call: "POST /correspondent/commitments"
              payload: { seller_id: "${s1}", product_id: "${p_conf}", commitment_type: "BEST_EFFORTS", notional_amount_cents: 100000000, delivery_window_start: "2026-08-01", delivery_expiry_date: "2026-08-31", reference_fico: 720, reference_ltv_pct: 82.5 }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { c_seller: $.data.id, csv: $.data.version }
            - call: "POST /correspondent/commitments/${c_desk}/loans"
              payload: { expected_commitment_version: "${cdv}", seller_loan_number: "HP-0001", note_amount_cents: 40000000, note_rate_pct: 6.500, fico: 720, ltv_pct: 82.5, occupancy: "PRIMARY", servicing_election: "RETAINED", closing_date: "2026-07-28", first_payment_due_date: "2026-09-01" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { l_a: $.data.id }
            - call: "POST /correspondent/commitments/${c_seller}/loans"
              payload: { expected_commitment_version: "${csv}", seller_loan_number: "HP-0002", note_amount_cents: 40000000, note_rate_pct: 6.500, fico: 720, ltv_pct: 82.5, occupancy: "PRIMARY", servicing_election: "RETAINED", closing_date: "2026-07-28", first_payment_due_date: "2026-09-01" }
              as: LockDeskTrader
              as_user_id: "u-ld-1"
              captures: { l_b: $.data.id }
            - call: "POST /correspondent/loans/${l_a}/review"
              payload: { note: "opening review" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l_a}/defects"
              payload: { defect_code: "UW-DTI-2305", category: "UNDERWRITING", severity: "MEDIUM" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d_a: $.data.id }
            - call: "POST /correspondent/defects/${d_a}/waive"
              payload: { price_adjustment_bps: -20 }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/loans/${l_a}/clear"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { lva: $.data.version }
            - call: "POST /correspondent/loans/${l_a}/purchase-advices"
              payload: { expected_loan_version: "${lva}" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { adv_a: $.data.id }
            - call: "POST /correspondent/purchase-advices/${adv_a}/settle"
              payload: { funding_reference: "WIRE-A-0001" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
            - call: "POST /correspondent/loans/${l_b}/review"
              payload: {}
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
            - call: "POST /correspondent/loans/${l_b}/defects"
              payload: { defect_code: "UW-RESERVES-2311", category: "UNDERWRITING", severity: "MEDIUM" }
              as: PurchaseReviewer
              as_user_id: "u-pr-1"
              captures: { d_b: $.data.id }
            - call: "POST /correspondent/defects/${d_b}/cure"
              payload: { cure_document_reference: "CURE-RES-0001" }
              as: SellerUser
              as_user_id: "${s1}"
              captures: { d_b_status: $.data.status }
            - call: "POST /correspondent/loans/${l_b}/expire-conditions"
              payload: {}
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { swept: $.data.expired_condition_count }
            - call: "POST /correspondent/sellers/${s1}/scorecards"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { sc1: $.data.id }
            - call: "POST /correspondent/sellers/${s1}/standing-actions"
              payload: { action: "SUSPEND", note: "manual review of a delivery pattern" }
              as: CounterpartyAnalyst
              as_user_id: "u-ca-1"
              captures: { standing_susp: $.data.delivery_standing }
            - call: "POST /correspondent/sellers/${s1}/standing-actions"
              payload: { action: "REINSTATE" }
              as: PlatformAdmin
              as_user_id: "u-adm-1"
              captures: { standing_back: $.data.delivery_standing }
          assert:
            - "every call in the trigger returns its declared 2xx code and no call returns ERR_FORBIDDEN_ROLE"
            - "the statement filed by the seller itself is accepted (shared with CounterpartyAnalyst) and reaches ACCEPTED on the analyst's review"
            - "both locks are created — one by LockDeskTrader, one by the SellerUser — and both deliveries are accepted, one from each partner role"
            - "${d_b_status} == CURED: cure is SellerUser-exclusive and the seller may cure its own file"
            - "the waiver executed by PlatformAdmin and the settlement executed by PlatformAdmin both succeed (shared with PurchaseReviewer)"
            - "${swept} == 0 — PlatformAdmin may run the per-loan sweep (shared with PurchaseReviewer)"
            - "the scorecard ${sc1} is opened by PlatformAdmin (shared with CounterpartyAnalyst)"
            - "${standing_susp} == SUSPENDED then ${standing_back} == GOOD_STANDING — the standing action is exercised by each of its two owners"

      - name: each_role_is_forbidden_from_other_roles_exclusive_operations
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles[CounterpartyAnalyst]
          - roles[QCReviewer]
          - roles[LockDeskTrader]
          - roles[PurchaseReviewer]
          - roles[PlatformAdmin]
          - roles[SellerUser]
          - validations[priority 2]
        distinguishing_aspect: |
          Six crossings, one per role, each aimed at an operation that is
          exclusive to a DIFFERENT role and each answered with
          ERR_FORBIDDEN_ROLE (403) before any state or business gate is
          consulted — including PlatformAdmin, which despite being the operator
          is NOT a hierarchical override and cannot clear a loan, and
          CounterpartyAnalyst, which cannot pair off a line.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CHAIN-APPROVED seller ${s1}, product CONF30F ${p_conf}, MANDATORY commitment ${c1} notional 100000000, loan ${l1} of 40000000 delivered and in review"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
