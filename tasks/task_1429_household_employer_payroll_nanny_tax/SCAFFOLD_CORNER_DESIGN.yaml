# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Household Employer Payroll & Nanny Tax Service
# Breadth coverage of every testable claim in SCAFFOLD.yaml §1.1–§1.7 that
# §1.8 does not already exercise. excluded_because stubs mark the overlap.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: employer_create_defaults_and_computed_fields
        claim_type: creation_and_defaults
        grounds: [entities.HouseholdEmployer, endpoints.POST_/household-payroll/employers]
        distinguishing_aspect: "Create succeeds with 201; omitted prior_year_schedule_h_cents defaults to 0; server-owned fields (status, compliance_posture) initialized ONBOARDING/CLEAR regardless of client input."
        test_recipe:
          setup: ["Rule pack AA exists"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Def", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_status: "$.data.status", e_posture: "$.data.compliance_posture", e_prior: "$.data.prior_year_schedule_h_cents", e_v: "$.data.version" } }
          assert:
            - "response 201 with HouseholdEmployer.status == ONBOARDING and compliance_posture == CLEAR"
            - "prior_year_schedule_h_cents == 0 (default applied)"
            - "version == 1 and id is a bare UUID (no type prefix)"
      - name: employer_create_status_input_ignored
        claim_type: computed_fields
        grounds: [entities.HouseholdEmployer.fields.status]
        distinguishing_aspect: "Client-supplied status in the create body is ignored; the system value ONBOARDING wins."
        test_recipe:
          setup: ["Rule pack AA exists"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Ig", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY", status: "ACTIVE" }, as: PayrollAdmin, captures: { e_status: "$.data.status" } }
          assert:
            - "HouseholdEmployer.status == ONBOARDING (client input for the system field ignored)"
      - name: employer_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required fein -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Rule pack AA exists"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Bad", primary_state_code: "AA", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"
      - name: employer_create_invalid_enum_returns_400
        claim_type: type_constraints
        grounds: ["validations[priority=4]", "entities.HouseholdEmployer.fields.pay_frequency"]
        distinguishing_aspect: "pay_frequency 'DAILY' is not a declared enum member -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Rule pack AA exists"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Enum", primary_state_code: "AA", fein: "123456789", pay_frequency: "DAILY" }, as: PayrollAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: worker_get_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent worker UUID -> ERR_NOT_FOUND 404, error envelope shape per §1.0."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "GET /household-payroll/workers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PayrollAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404, envelope has meta.api_request_id and response_type == error"
      - name: state_rule_pack_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.StateRulePack]
        distinguishing_aspect: "StateRulePack has common_fields: false and no PUT/PATCH endpoint; the only mutation path is create. Verified by absence of version/updated_at in the create response."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "GG", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.0, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin, captures: { pack_id: "$.data.id" } }
          assert:
            - "201 response body has id and created_at but no version and no updated_at (immutable configuration entity)"
      - name: agreement_supersede_sets_effective_to_and_chain
        claim_type: computed_fields
        grounds: [state_machines.EmploymentAgreement.ACTIVE_to_SUPERSEDED, entities.EmploymentAgreement.fields.effective_to]
        distinguishing_aspect: "Creating a second agreement supersedes the first: effective_to = new effective_from - 1 day and superseded_by_id points at the newcomer; the /superseded reverse GET returns exactly the old agreement."
        test_recipe:
          setup: ["Employer AA, worker CLASSIFIED (EMPLOYEE) with agreement A1 effective 2026-01-01"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Sup", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Sue Persede", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { a1_id: "$.data.id" } }
            - { call: "GET /household-payroll/workers/${w_id}", as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v3: "$.data.version" } }
          trigger:
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3600, pay_method: "HOURLY", effective_from: "2026-03-01", expected_worker_version: "${w_v3}" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { a2_id: "$.data.id" } }
            - { call: "GET /household-payroll/agreements/${a1_id}", as: PayrollAdmin, captures: { a1_st: "$.data.status", a1_to: "$.data.effective_to", a1_sup: "$.data.superseded_by_id" } }
            - { call: "GET /household-payroll/agreements/${a2_id}/superseded", as: PayrollAdmin, captures: { sup0: "$.data[0].id" } }
          assert:
            - "Agreement A1.status == SUPERSEDED and effective_to == 2026-02-28 (2026-03-01 minus 1 day, closed interval)"
            - "Agreement A1.superseded_by_id == ${a2_id}"
            - "GET /agreements/${a2_id}/superseded returns exactly [A1]"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: employer_auto_activates_on_first_registration
        claim_type: side_effect_execution
        grounds: [state_machines.HouseholdEmployer.ONBOARDING_to_ACTIVE]
        distinguishing_aspect: "System auto-transition: the first StateRegistration activation flips the employer ONBOARDING -> ACTIVE without any employer-scoped write."
        test_recipe:
          setup: ["Rule pack AA; employer created (ONBOARDING); one DRAFT registration submitted"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Auto", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "GET /household-payroll/employers/${e_id}", as: PayrollAdmin, captures: { e_status: "$.data.status" } }
          assert:
            - "HouseholdEmployer.status == ACTIVE after the first registration activation"
      - name: employer_suspend_reinstate_cycle
        claim_type: valid_transition
        grounds: [state_machines.HouseholdEmployer.ACTIVE_to_SUSPENDED, state_machines.HouseholdEmployer.SUSPENDED_to_ACTIVE]
        distinguishing_aspect: "ACTIVE -> SUSPENDED -> ACTIVE loop works; while SUSPENDED, pay-run create fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Rule pack AA; employer with one ACTIVE registration (so employer is ACTIVE)"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Sus", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
          trigger:
            - { call: "POST /household-payroll/employers/${e_id}/suspend", as: ComplianceOfficer, as_user_id: "officer-1", captures: { st1: "$.data.status" } }
            - { call: "POST /household-payroll/employers/${e_id}/pay-runs", payload: { period_start: "2026-01-05", period_end: "2026-01-12", pay_date: "2026-01-12" }, as: PayrollAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /household-payroll/employers/${e_id}/reinstate", as: ComplianceOfficer, as_user_id: "officer-1", captures: { st2: "$.data.status" } }
          assert:
            - "status SUSPENDED after suspend; pay-run create during suspension fails ERR_INVALID_STATE; status ACTIVE after reinstate"
      - name: suspend_from_onboarding_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.HouseholdEmployer.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "Suspend requires ACTIVE; an ONBOARDING employer cannot be suspended."
        test_recipe:
          setup: ["Rule pack AA; employer created, never registered (ONBOARDING)"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Orb", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/employers/${e_id}/suspend", as: ComplianceOfficer, as_user_id: "officer-1", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (409)"
      - name: registration_activate_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.StateRegistration.SUBMITTED_to_ACTIVE]
        distinguishing_aspect: "activate requires SUBMITTED; calling it on a DRAFT registration fails."
        test_recipe:
          setup: ["Rule pack AA; employer with a DRAFT registration"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Reg", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "SUTA", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "X-1" }, as: PayrollAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; registration stays DRAFT"
      - name: worker_terminate_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DomesticWorker.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "From TERMINATED no further transitions exist: a second terminate and a classify attempt both fail with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Employer AA ACTIVE (NEW_HIRE reg), worker EMPLOYEE ACTIVE, then terminated"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Term", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Ted Term", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/agreements", payload: { hourly_rate_cents: 3000, pay_method: "HOURLY", effective_from: "2026-01-01", expected_worker_version: "${w_v2}" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/activate", payload: { new_hire_report_date: "2026-01-06" }, as: HouseholdClient, as_user_id: "${e_id}" }
            - { call: "POST /household-payroll/workers/${w_id}/terminate", as: HouseholdClient, as_user_id: "${e_id}" }
          trigger:
            - { call: "POST /household-payroll/workers/${w_id}/terminate", as: HouseholdClient, as_user_id: "${e_id}", captures: { err1: "$.data.error_id" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "WORKER" }, { question_key: "supplies_own_tools", answer: "WORKER" }, { question_key: "hires_own_substitutes", answer: "ALLOWED" }, { question_key: "paid_by", answer: "PROJECT_NOT_HOURS" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { err2: "$.data.error_id" } }
          assert:
            - "second terminate -> ERR_INVALID_STATE; classify on TERMINATED -> ERR_INVALID_STATE (terminal lockdown)"
      - name: timesheet_submit_from_submitted_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Timesheet.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting an already-SUBMITTED timesheet is not idempotent: second submit fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Employer AA ACTIVE, worker ACTIVE with agreement, timesheet DRAFT created and submitted"]
          setup_api_calls:
            - { call: "POST /household-payroll/state-rule-packs", payload: { state_code: "AA", min_pay_frequency: "WEEKLY", weekly_ot_threshold_minutes: 2400, daily_ot_threshold_minutes: 0, daily_dt_threshold_minutes: 0, live_in_weekly_ot_eligible: false, live_in_daily_ot_eligible: false, min_wage_cents: 1000, sit_rate: 0.05, suta_rate: 0.02, suta_wage_base_cents: 10000000, workers_comp_required: false, new_hire_report_days: 20, pay_stub_required: true }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers", payload: { legal_name: "Fam Idm", primary_state_code: "AA", fein: "123456789", pay_frequency: "WEEKLY" }, as: PayrollAdmin, captures: { e_id: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /household-payroll/employers/${e_id}/registrations", payload: { state_code: "AA", agency: "NEW_HIRE_DIRECTORY", expected_employer_version: "${e_v}" }, as: PayrollAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /household-payroll/registrations/${reg_id}/submit", as: PayrollAdmin }
            - { call: "POST /household-payroll/registrations/${reg_id}/activate", payload: { agency_account_number: "NH-001" }, as: PayrollAdmin }
            - { call: "POST /household-payroll/employers/${e_id}/workers", payload: { full_name: "Ida Idm", work_state_code: "AA", hire_date: "2026-01-05", work_arrangement: "LIVE_OUT" }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_id: "$.data.id", w_v: "$.data.version" } }
            - { call: "POST /household-payroll/workers/${w_id}/classify", payload: { classification_answers: [ { question_key: "controls_schedule", answer: "EMPLOYER" }, { question_key: "supplies_own_tools", answer: "EMPLOYER" }, { question_key: "hires_own_substitutes", answer: "NOT_ALLOWED" }, { question_key: "paid_by", answer: "HOURLY" } ] }, as: HouseholdClient, as_user_id: "${e_id}", captures: { w_v2: "$.data.version" } }
