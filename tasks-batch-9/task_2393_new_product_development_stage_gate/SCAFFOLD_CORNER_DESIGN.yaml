          - endpoints[POST /shelf-life-studies/{id}/timepoints].output
          - endpoints[POST /deliverables/{id}/submit].output
        distinguishing_aspect: |
          A transition answers with the row it changed, already carrying the recomputed fields, so
          the caller never needs a follow-up read: screen returns the project with its score and
          new dev_status, submit returns the deliverable with submission_count 1, and a timepoint
          returns the parent study rather than the reading that was posted.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
