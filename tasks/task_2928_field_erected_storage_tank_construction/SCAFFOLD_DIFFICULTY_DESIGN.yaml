              as: CivilContractor
              captures: { good_survey: $.data.id }
            - call: "POST /hydrotest-plans/${plan_id}/approval"
              payload: { decision: "APPROVE" }
              as: ProjectEngineer
              as_user_id: "pe-1"
          assert:
