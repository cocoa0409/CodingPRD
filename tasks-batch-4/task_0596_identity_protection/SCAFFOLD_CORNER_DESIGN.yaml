          assert:
            - "credit-summary.composite_credit_score == 695"
            - "credit-summary.baseline_composite_credit_score == 700  # written on the FIRST non-null composite (EQUIFAX alone)"
            - "credit-summary.scored_bureau_count == 3 AND bureau_count == 3"
            - "credit-summary.monitoring_status == 'MONITORED'"

