              payload: { action: "RESUBMIT", remediation_note: "cycle 4 remediation" }
              as: Fiduciary
              as_user_id: "${fid1_id}"
          assert:
            - "the fourth RESUBMIT returns HTTP 409 with error_id ERR_INFO_CYCLE_LIMIT"
            - "PlatformRequest.${req_id}.info_cycle_count == 3"
            - "PlatformRequest.${req_id}.status == INFO_REQUESTED"
            - "PlatformRequest.${req_id}.review_window_start == null"
            - "PlatformRequest.${req_id}.review_window_end == null"
            - "a DECIDE attempt from INFO_REQUESTED returns HTTP 409 with error_id ERR_INVALID_REQUEST_STATE"
            - "a subsequent WITHDRAW from INFO_REQUESTED succeeds and PlatformRequest.${req_id}.status == WITHDRAWN"
            - "after WITHDRAWN a RESUBMIT returns HTTP 409 with error_id ERR_INVALID_REQUEST_STATE"
            - "AuthorityGrant list filtered by platform_request_id == ${req_id} is empty (no grant was ever created)"

      - name: delete_election_detours_through_countersign_and_purged_refuses_reverse
        grounds:
          - state_machines.DispositionElection.initial_state
          - state_machines.DispositionElection.transitions[PENDING_COUNTERSIGN->DRAFT]
          - state_machines.DispositionElection.transitions[EXECUTED->REVERSED]
          - state_machines.DigitalAsset.transitions[disposition_status ELECTED->PURGED]
          - validations[priority=47]
          - validations[priority=48]
          - validations[priority=32]
        distinguishing_aspect: |
          Two elections created on the same estate through the same endpoint enter the machine at
          DIFFERENT initial states purely because of the `election` value — MEMORIALIZE at DRAFT and
          DELETE at PENDING_COUNTERSIGN — so DELETE traverses an extra node, must be countersigned by
          a DIFFERENT fiduciary, and once executed lands on PURGED, the one disposition_status with
          no REVERSE edge: the identical REVERSE call that succeeds for the MEMORIALIZE election is
          refused with ERR_INVALID_ELECTION_STATE for the DELETE election.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one platform CloudVault supporting both memorialization and deletion"
            - "one estate with TWO fiduciaries whose letters are both ISSUED (each has its own VERIFIED LETTERS_OF_AUTHORITY document)"
            - "two CLOUD_STORAGE assets, both CATALOG_DISCLOSED by one APPROVED CATALOG_ACCESS request"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
