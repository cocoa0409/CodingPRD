              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == 'ERR_INVALID_STATE' (priority 10 state check beats the priority 22 ERR_LOUDNESS_OUT_OF_SPEC safety check, since the episode is in EDITING not REVIEW)."

      - name: temporal_overlap_vs_constraint_engineer_inactive_on_session
        grounds:
          - validations[priority=24]
          - validations[priority=29]
          - state_machines.Session.BOOKED_to_LIVE
        distinguishing_aspect: |
          Error-category pair = business_temporal (priority 24, ERR_SESSION_OVERLAP)
          vs business_constraint (priority 29, ERR_ENGINEER_INACTIVE) — a different
          pair from the first instance. Booking a STUDIO session that BOTH overlaps
          an existing STUDIO session for the same engineer AND targets an inactive
          engineer must return ERR_SESSION_OVERLAP (priority 24 < 29).
        test_recipe:
          setup:
            - "Engineer 'Eng Active' (active=true) holds one BOOKED STUDIO session [10:00,12:00) on 2026-03-03; the trigger books an OVERLAPPING window on this same active engineer so the priority-24 overlap rule fires."
            - "Engineer 'Eng Inactive' (active=false) exists to demonstrate the lower-priority ERR_ENGINEER_INACTIVE (priority 29) is live: a separate booking attempt on it is rejected by that rule. On the active engineer's overlapping window both rules could conceptually compete, and the priority-24 temporal rule wins."
          setup_api_calls:
            - call: "POST /shows"
