              payload: { crew_id: "${crew_id}", kind: "STANDBY", activation_date: "2026-08-05" }
              as: UTILITY_DISPATCHER
          trigger:
            - call: "POST /contracts/${cid}/storm-activations"
              payload: { crew_id: "${crew_id}", kind: "CALLOUT", activation_date: "2026-08-05" }
              as: UTILITY_DISPATCHER
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_STANDBY and http status == 409"

      - name: crew_on_storm_duty_blocks_assignment
        claim_type: violation_to_error
        grounds:
          - validations[priority=9e]
          - errors[ERR_CREW_ON_STORM_DUTY]
        distinguishing_aspect: "A crew with an ACTIVE storm activation cannot be given a regular assignment: ERR_CREW_ON_STORM_DUTY."
        test_recipe:
