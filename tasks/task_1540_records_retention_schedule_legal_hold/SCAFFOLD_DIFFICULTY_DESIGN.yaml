  - rule_id: resource_temporal_overlap
    instances:
      - name: rule_window_half_open_adjacency
        grounds:
          - state_machines.RetentionRule.DRAFT_to_ACTIVE
          - state_machines.RetentionRule.DRAFT_to_PENDING_CONFLICT
          - entities.RetentionRule.fields.effective_from
          - entities.RetentionRule.fields.effective_to
        distinguishing_aspect: |
          Half-open [effective_from, effective_to) semantics on RetentionRule window
          resources: a challenger whose window starts exactly at the incumbent's
          effective_to (2025-01-01 == 2025-01-01) is adjacent, NOT overlapping, and
          activates cleanly; one starting a single day earlier overlaps and lands in
          PENDING_CONFLICT.
        test_recipe:
          setup:
            - "Program; class; jurisdiction"
            - "INC rule ACTIVE with window [2020-01-01, 2025-01-01)"
            - "CH-ADJ with window [2025-01-01, 2030-01-01); CH-OVR with window [2024-06-01, 2024-12-01)"
          setup_api_calls:
            - call: "POST /ig/programs"
              payload: { name: "Window Program", fiscal_year_end_month: 12, fiscal_year_end_day: 31 }
              as: PlatformAdmin
              captures: { p: "$.data.id" }
