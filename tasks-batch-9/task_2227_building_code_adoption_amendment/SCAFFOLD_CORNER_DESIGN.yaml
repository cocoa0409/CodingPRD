  # ===========================================================================
  - section: errors
    instances:

      - name: create_jurisdiction_without_an_identity_header_returns_4xx
        claim_type: triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "With X-User-ID absent the request fails at priority 1 with 401 ERR_UNAUTHENTICATED before any role or payload check, and no Jurisdiction row is created."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *k_clock0801
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Riverbend", population: 1200000, local_authority_level: "FULL", host_seat_capacity: 60, official_headcount: 5 }
              as: CouncilAdmin
              as_user_id: ""
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "GET /jurisdictions returns total_count == 0"

      - name: second_code_cycle_with_the_same_year_and_edition_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_DUPLICATE_CODE_CYCLE
          - validations[priority=13]
        distinguishing_aspect: "A second POST /code-cycles carrying cycle_year 2027 with model_code_edition IBC-2027 returns 409 ERR_DUPLICATE_CODE_CYCLE even though intake dates differ, leaving exactly one cycle."
        test_recipe:
          setup:
            - "One CodeCycle 2027 / IBC-2027 exists in DRAFT."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
          trigger:
            - call: "POST /code-cycles"
              payload: { cycle_year: 2027, model_code_edition: "IBC-2027", intake_opens_at: "2026-09-01T00:00:00Z", intake_closes_at: "2026-11-01T00:00:00Z" }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_CODE_CYCLE"
            - "GET /code-cycles returns total_count == 1"

      - name: second_energy_committee_on_the_same_cycle_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_DUPLICATE_COMMITTEE_DISCIPLINE
          - validations[priority=13]
        distinguishing_aspect: "The cycle already carries a live ENERGY committee, so a second ENERGY committee returns 409 ERR_DUPLICATE_COMMITTEE_DISCIPLINE while a MECHANICAL committee on the same cycle is accepted."
        test_recipe:
          setup:
            - "CodeCycle 2027 in DRAFT with one FORMING ENERGY committee of 6 voting seats."
          setup_api_calls:
            - *k_clock0801
            - *k_cycle
            - *k_cte
          trigger:
            - call: "POST /code-cycles/${cycle_id}/discipline-committees"
              payload: { discipline: "ENERGY", voting_seat_count: 5 }
              as: CouncilAdmin
              as_user_id: "admin-ops-1"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_COMMITTEE_DISCIPLINE"
            - "GET /code-cycles/${cycle_id}/discipline-committees returns total_count == 1"
            - "DisciplineCommittee.${cte_id}.voting_seat_count == 6"

      - name: seventh_voting_member_on_a_six_seat_committee_is_rejected
        claim_type: triggerability
        grounds:
          - errors.ERR_SEAT_LIMIT_EXCEEDED
          - entities.DisciplineCommittee.fields.voting_seat_count
          - entities.DisciplineCommittee.fields.active_voting_member_count
        distinguishing_aspect: "Adding a seventh voting member to a 6-seat committee returns 409 ERR_SEAT_LIMIT_EXCEEDED and active_voting_member_count stays at 6, while a non-voting member is still admissible."
        test_recipe:
          setup:
