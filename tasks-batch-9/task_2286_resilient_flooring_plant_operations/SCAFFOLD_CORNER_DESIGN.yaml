  # ===========================================================================
  # Guide section 8 — one entry per ACTIVE complexity layer
  #   complexity_layers: dual_variant_calculation, cascading_side_effects,
  #                      version_pinning_on_approval, optimistic_concurrency
  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: formulation_revision_occ_rejects_the_outdated_view_then_admits_the_refreshed_one
        layer: optimistic_concurrency
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.formulation-revision-supersede-stale"
          - "validations.V-OCC-1"
          - "errors.ERR_STALE_FORMULATION_VERSION"
          - "endpoints.POST /formulations/{id}/revisions input [formulation_code, expected_formulation_version]"
        distinguishing_aspect: |
          The parent stays APPROVED after a revision is created — only open_revision_count and
          version move — so a second revision request is perfectly legal under the state machine
          and NOTHING but the stale version distinguishes it. An implementation that guarded this
          endpoint with a state precondition instead of a version comparison would pass a naive
          test and fail here, and one that only compared versions on the FIRST write would let
          the second through.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *fminRev
          trigger:
            - call: "POST /formulations/${f_min_id}/revisions"
              payload: { formulation_code: "F-MIN-R3", expected_formulation_version: "${f_min_version}" }
              as: Formulator
              as_user_id: "form-001"
              captures: { occ1_err: $.data.error_id }
            - call: "GET /formulations/${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { occ1_v_after_stale: $.data.version, occ1_open_after_stale: $.data.open_revision_count, occ1_status: $.data.status }
            - call: "POST /formulations/${f_min_id}/revisions"
              payload: { formulation_code: "F-MIN-R3", expected_formulation_version: "${occ1_v_after_stale}" }
              as: Formulator
              as_user_id: "form-001"
              captures: { occ1_r3_id: $.data.id, occ1_r3_rev: $.data.revision }
            - call: "GET /formulations/${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { occ1_v_final: $.data.version, occ1_open_final: $.data.open_revision_count }
          assert:
            - "${f_min_version} == 2 (the approval incremented F-MIN from 1) and the first revision moved the parent to version 3, so ${occ1_v_after_stale} == 3"
            - "${occ1_err} == ERR_STALE_FORMULATION_VERSION with HTTP 412 — expected_formulation_version 2 no longer matches"
            - "the refused request wrote nothing: ${occ1_open_after_stale} == 1, ${occ1_status} == APPROVED, and GET /formulations?supersedes_formulation_id=${f_min_id} still returns total_count == 1"
            - "replaying the identical payload with the refreshed version succeeds: HTTP 201 with ${occ1_r3_rev} == 2 and ${occ1_r3_id} != ${f_min_r2_id} — two sibling revisions of the same parent are legal, which is why only the version check can reject the first attempt"
            - "${occ1_v_final} == 4 and ${occ1_open_final} == 2 — the version incremented again on the successful write"

      - name: allocation_fill_occ_rejects_the_outdated_remaining_quantity
        layer: optimistic_concurrency
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.allocation-fill-stale"
          - "validations.V-OCC-2"
          - "errors.ERR_STALE_ALLOCATION_VERSION"
          - "endpoints.POST /allocations/{id}/fill input [expected_allocation_version]"
        distinguishing_aspect: |
          A PARTIALLY_FILLED allocation legitimately accepts a further fill, so no state
          precondition can catch the replay; the version comparison sits at priority band 6,
          ahead of both the referential candidate search (ERR_NO_ELIGIBLE_BATCH) and the
          over-request guard, so the 412 must be returned even though fresh stock has since
          arrived and the request would otherwise succeed.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - call: "POST /allocations"
              payload: { allocation_code: "ALLOC-OCC", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 1500.00 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { occ2_id: $.data.id, occ2_v1: $.data.version }
            - call: "POST /allocations/${occ2_id}/fill"
              payload: { expected_allocation_version: "${occ2_v1}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { occ2_status1: $.data.status, occ2_qty1: $.data.allocated_quantity_sqm, occ2_v2: $.data.version }
            - *runA3
            - *clock0730
            - *runA3Setup
            - *runA3Start
            - *runA3Complete
            - *qcRelease3
            - *batchA3Get
          trigger:
            - call: "POST /allocations/${occ2_id}/fill"
              payload: { expected_allocation_version: "${occ2_v1}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { occ2_err: $.data.error_id }
            - call: "GET /allocations/${occ2_id}"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { occ2_v_after_stale: $.data.version, occ2_qty_after_stale: $.data.allocated_quantity_sqm }
            - call: "POST /allocations/${occ2_id}/fill"
              payload: { expected_allocation_version: "${occ2_v_after_stale}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { occ2_status2: $.data.status, occ2_qty2: $.data.allocated_quantity_sqm, occ2_v3: $.data.version }
          assert:
            - "${occ2_v1} == 1 and after the first fill ${occ2_status1} == PARTIALLY_FILLED with ${occ2_qty1} == 1200.00 and ${occ2_v2} == 2"
            - "${occ2_err} == ERR_STALE_ALLOCATION_VERSION with HTTP 412, NOT ERR_NO_ELIGIBLE_BATCH and NOT ERR_ALLOCATION_OVER_REQUEST — 300.00 sqm of RUN-A3-B1 is available and would have been drawn"
            - "the refusal is inert: ${occ2_v_after_stale} == 2, ${occ2_qty_after_stale} == 1200.00, GET /allocations/${occ2_id}/lines still returns total_count == 1 and GET /batches/${batch_a3_id} still reports available_quantity_sqm 300.00"
            - "the refreshed version succeeds: ${occ2_status2} == FILLED, ${occ2_qty2} == 1500.00 and ${occ2_v3} == 3, so the version incremented on this write too"

      - name: cost_revaluation_moves_live_recipes_and_leaves_pinned_snapshots_frozen
        layer: version_pinning_on_approval
        claim_type: version_pinning
        grounds:
          - "endpoints.POST /raw-materials/{id}/cost side_effects"
          - "entities.Formulation.fields.cost_basis"
          - "entities.FormulationComponent.fields.material_cost_snapshot_cents"
          - "calculations.formulation_blend_metrics"
        distinguishing_aspect: |
          One revaluation, two recipes on the SAME material, opposite outcomes: the APPROVED
          recipe is frozen because approval wrote per-component cost snapshots, while the DRAFT
          recipe recomputes from the new purchase cost. This separates a real snapshot from an
          implementation that merely caches the blended figure, and it distinguishes pinning
          from staleness — pin_stale stays false because the Formulation's version never moved.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *rmFiller
            - *fmin
            - *fminC1
            - *fminC2
            - *fstd
            - *rmSoft
            - *fstdC1
            - *fstdC2
            - *fstdC3
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - call: "GET /formulations/${f_std_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { pin_std_cost_before: $.data.blended_cost_per_kg_cents, pin_std_v_before: $.data.version }
          trigger:
            - call: "POST /raw-materials/${rm_resin_id}/cost"
              payload: { cost_per_kg_cents: 200 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pin_rm_cost: $.data.cost_per_kg_cents, pin_rm_v: $.data.version }
            - call: "GET /formulations/${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { pin_fmin_cost: $.data.blended_cost_per_kg_cents, pin_fmin_v: $.data.version, pin_fmin_basis: $.data.cost_basis }
            - call: "GET /formulations/${f_std_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { pin_fstd_cost: $.data.blended_cost_per_kg_cents, pin_fstd_v: $.data.version, pin_fstd_basis: $.data.cost_basis }
            - call: "GET /product-skus/${sku_a_id}/cost-summary"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pin_pinned: $.data.pinned_basis_standard_cost_cents_per_sqm, pin_live: $.data.live_basis_standard_cost_cents_per_sqm, pin_delta: $.data.basis_delta_cents_per_sqm, pin_stale_flag: $.data.pin_stale }
          assert:
            - "${pin_rm_cost} == 200 and ${pin_rm_v} == 2 — RM-RESIN was revalued from 180"
            - "${pin_fmin_basis} == PINNED, ${pin_fmin_cost} == 201 (unchanged: 100*180 + 3*900 over 103.00) and ${pin_fmin_v} == 2 — the revaluation did NOT increment the approved recipe's version"
            - "GET /formulations/${f_min_id}/components still reports material_cost_snapshot_cents 180 on the RM-RESIN row and 900 on the RM-STAB row"
            - "${pin_fstd_basis} == LIVE with ${pin_std_cost_before} == 165 recomputed to ${pin_fstd_cost} == 178 ((100*200 + 25*300 + 40*45) / 165.00 = 177.575758) and ${pin_fstd_v} > ${pin_std_v_before}"
            - "GET /product-skus/${sku_a_id} still reports standard_cost_cents_per_sqm 1157 and list_price_cents_per_sqm 1562"
            - "${pin_pinned} == 1157, ${pin_live} == 1247 (core ROUND(220 * 1.90 * 2.50) == 1045 replaces 955), ${pin_delta} == 90 and ${pin_stale_flag} == false"

      - name: version_counter_advances_on_every_write_and_never_on_a_read
        layer: optimistic_concurrency
        claim_type: optimistic_concurrency
        grounds:
          - "entities.RawMaterial.fields.version"
          - "entities.PressLine.fields.version"
          - "entities.DesignLicense.fields.version"
          - "endpoints.POST /raw-materials/{id}/cost side_effects 'increments RawMaterial.version by 1'"
        distinguishing_aspect: |
          The version counter is asserted on three entity kinds that carry NO expected_*_version
          input of their own, and across a repeated round trip on the same row. This catches the
          common shortcut of maintaining version only on the two OCC-guarded entities, and the
          equally common bug of bumping the counter inside a GET handler that touches updated_at.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - *rmFiller
            - call: "POST /raw-materials/${rm_filler_id}/cost"
              payload: { cost_per_kg_cents: 50 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { vc_rm_v2: $.data.version }
            - call: "GET /raw-materials/${rm_filler_id}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { vc_rm_read: $.data.version }
            - call: "POST /raw-materials/${rm_filler_id}/status"
              payload: { to_status: RESTRICTED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { vc_rm_v3: $.data.version, vc_rm_status: $.data.status }
            - *pl1
            - call: "POST /press-lines/${pl1_id}/status"
              payload: { to_status: MAINTENANCE }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { vc_pl_v2: $.data.version }
            - *lic
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: SUSPENDED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { vc_lic_v2: $.data.version }
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: ACTIVE }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { vc_lic_v3: $.data.version, vc_lic_status: $.data.status }
          assert:
            - "the RawMaterial is created at version 1, ${vc_rm_v2} == 2 after the revaluation and ${vc_rm_v3} == 3 after the status write, with ${vc_rm_status} == RESTRICTED"
            - "${vc_rm_read} == 2 — the interleaved GET returned the current version and did not advance it"
            - "${vc_pl_v2} == 2 and ${vc_lic_v2} == 2, ${vc_lic_v3} == 3 with ${vc_lic_status} == ACTIVE — the cyclic SUSPENDED -> ACTIVE return still counts as a write"
            - "no response body echoes an expected_*_version field: these three entities are versioned without being OCC-guarded"

      - name: cascading_side_effect_layer_is_exercised
        layer: cascading_side_effects
        claim_type: cascading_side_effect
        excluded_because:
          difficulty_instance: "raw_material_restriction_five_hop_cascade_to_allocation"
          rationale: |
            The layer's deepest instance is the five-hop restriction cascade, which is already
            asserted hop by hop there (formulation RETIRED, SKU certification SUSPENDED and
            commercial HOLD, batch HELD, line VOIDED, allocation stepped back), together with a
            control row on an unrelated material that must NOT move. Two further cascades —
            licence termination and panel failure — are covered by the sibling instances of the
            same rule. A corner-level restatement would add no distinguishing power.

      - name: dual_variant_calculation_layer_is_exercised
        layer: dual_variant_calculation
        claim_type: dual_variant_divergence
        excluded_because:
          difficulty_instance: "sku_standard_cost_live_versus_pinned_material_basis"
          rationale: |
            Variant selection, divergence and reconciliation for the three dual-variant
            calculations (sku_standard_cost, warranty_settlement, license_volume_ledger) are
            asserted there and in the two sibling instances of the same rule, each with both
            variants computed from one fixture. The corner-level pinning instance above already
            covers the snapshot mechanics that make the divergence possible.

  # ===========================================================================
  # Guide section 9 — consistency_model: immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_consequence_is_visible_in_the_same_response
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model immediate"
          - "endpoints.POST /allocations/{id}/fill side_effects"
          - "entities.Batch.fields.available_quantity_sqm"
          - "entities.AllocationLine"
        distinguishing_aspect: |
          The write response itself — not a later read — already carries the recomputed status
          and allocated quantity, and the FIRST read of every touched neighbour is already
          correct: the junction rows exist, the batch's available quantity is decremented and the
          licence ledger reflects the run. There is no refresh, recompute, reconcile or job
          endpoint anywhere in the endpoint table, so any implementation that defers derivation
          to a background pass has nowhere to hide.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - *alloc1
          trigger:
            - call: "POST /allocations/${alloc1_id}/fill"
              payload: { expected_allocation_version: "${alloc1_v1}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ic_status: $.data.status, ic_qty: $.data.allocated_quantity_sqm, ic_v: $.data.version }
            - call: "GET /allocations/${alloc1_id}/lines"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { ic_line_qty: "$.data[0].quantity_sqm", ic_line_status: "$.data[0].status" }
            - call: "GET /batches/${batch_a1_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { ic_batch_avail: $.data.available_quantity_sqm, ic_batch_qty: $.data.quantity_sqm }
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { ic_consumed: $.data.consumed_volume_sqm, ic_royalty: $.data.accrued_royalty_cents }
          assert:
            - "the fill RESPONSE itself already reports ${ic_status} == FILLED, ${ic_qty} == 100.00 and ${ic_v} == 2 — no follow-up read is needed to observe the recomputed status"
            - "${ic_line_qty} == 100.00 with ${ic_line_status} == ACTIVE on the very first read of the junction collection"
            - "${ic_batch_qty} == 1200.00 with ${ic_batch_avail} == 1100.00 — the neighbour aggregate was decremented inside the same request"
            - "${ic_consumed} == 1200.00 and ${ic_royalty} == 126000, values written by the run completion earlier in the chain and never recomputed since"
            - "the endpoint table contains no refresh, recompute, reconcile, sync or job endpoint, so there is no second step at which any of these could become correct"
