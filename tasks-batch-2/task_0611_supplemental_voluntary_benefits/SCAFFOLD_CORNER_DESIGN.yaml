# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Supplemental & Voluntary Benefits — EXPERT band
# Breadth probe across the claim-extraction-guide sections. §1.8 instance names
# are cited verbatim in excluded_because stubs.
#
# Shared fixture conventions (same as §1.8):
#   default clock 2026-01-01T00:00:00Z; GI window [2026-03-01,2026-04-01);
#   Product A base 1200, cap 500000, eoi_bps 1500, loadup_bps 1000.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_employer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Employer, endpoints]
        distinguishing_aspect: "POST /benefits/employers with only legal_name applies section_125_plan_active=true and pay_periods_per_year=52 defaults; status=ACTIVE; id/created_at/version system-minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Solo Co" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "response status == 201"
            - "Employer.${emp_id}.section_125_plan_active == true"
            - "Employer.${emp_id}.pay_periods_per_year == 52"
            - "Employer.${emp_id}.status == ACTIVE"
            - "Employer.${emp_id}.version == 1"

      - name: get_employer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Employer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /benefits/employers/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /benefits/employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_plan_product_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.PlanProduct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /benefits/plan-products omitting weekly_premium_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One employer exists."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "ReqCo" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "X", annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_plan_product_bad_enum_policy_type_rejected
        claim_type: Type Constraints
        grounds: [entities.PlanProduct.fields.policy_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "policy_type outside {ACCIDENT,CRITICAL_ILLNESS,HOSPITAL_INDEMNITY} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One employer exists."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "EnumCo" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "DENTAL", product_name: "X", weekly_premium_cents: 1000, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: disbursement_account_bad_routing_number_rejected
        claim_type: Type Constraints
        grounds: [entities.DisbursementAccount.fields.routing_number, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "routing_number not exactly 9 digits returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One employee exists."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "RtCo" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Rt Emp", email: "rt@x.test" }
              as: BenefitsAdmin
              captures: { emp_e_id: $.data.id }
          trigger:
            - call: "POST /benefits/disbursement-accounts"
              payload: { employee_id: "${emp_e_id}", routing_number: "12345", account_last4: "0001" }
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: employee_total_deduction_is_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Employee.fields.total_weekly_deduction_cents]
        distinguishing_aspect: "total_weekly_deduction_cents is computed; a freshly-created employee has it = 0 regardless of any client input."
        test_recipe:
          setup: ["One employer exists."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "CompCo" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Comp Emp", email: "comp@x.test" }
              as: BenefitsAdmin
              captures: { emp_e_id: $.data.id }
          assert:
            - "response status == 201"
            - "Employee.${emp_e_id}.total_weekly_deduction_cents == 0"
            - "Employee.${emp_e_id}.employment_status == EMPLOYED"

      - name: schedule_item_no_version_field_immutable_entity
        claim_type: Immutability
        grounds: [entities.BenefitScheduleItem]
        distinguishing_aspect: "BenefitScheduleItem has common_fields:false — its read carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup: ["A DRAFT product with one schedule item."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "SiCo" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "SiPlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
              captures: { si_id: $.data.id }
          trigger:
            - call: "GET /benefits/schedule-items/${si_id}"
              payload: {}
              as: BenefitsAdmin
          assert:
            - "response status == 200"
            - "BenefitScheduleItem.${si_id} response has no `version` field"
            - "BenefitScheduleItem.${si_id}.flat_benefit_cents == 200000"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: start_review_from_under_review_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.SUBMITTED_to_UNDER_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling start-review on a claim already UNDER_REVIEW returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["One ACTIVE funded enrollment with a FRACTURE claim already moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "IsCo", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "IsPlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Is Emp", email: "is@x.test" }
              as: BenefitsAdmin
              captures: { emp_e_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts"
              payload: { employee_id: "${emp_e_id}", routing_number: "123456789", account_last4: "7777" }
              as: BenefitsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts/${acct_id}/verify"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_e_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 0, outcome: "POSTED" }
              as: Payroll
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "FRACTURE", event_date: "2026-03-20T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /benefits/claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /benefits/claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == UNDER_REVIEW"

      - name: terminal_paid_claim_cannot_void
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Claim.APPROVED_to_VOIDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PAID claim is terminal for void; POST .../void on a PAID claim returns ERR_INVALID_STATE (409) (it is not APPROVED)."
        test_recipe:
          setup: ["One ACTIVE funded enrollment with a FRACTURE claim approved, disbursed (PAID), VERIFIED account."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "PaidCo", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "PaidPlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Paid Emp", email: "paid@x.test" }
              as: BenefitsAdmin
              captures: { emp_e_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts"
              payload: { employee_id: "${emp_e_id}", routing_number: "123456789", account_last4: "8888" }
              as: BenefitsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts/${acct_id}/verify"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_e_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 0, outcome: "POSTED" }
              as: Payroll
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "FRACTURE", event_date: "2026-03-20T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /benefits/claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_id}/disburse"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /benefits/claims/${claim_id}/void"
              payload: {}
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == PAID"

      - name: reopen_paid_claim_returns_already_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.Claim.APPROVED_to_UNDER_REVIEW, "errors[ERR_CLAIM_ALREADY_PAID]"]
        distinguishing_aspect: "Reopen requires APPROVED with no SETTLED disbursement; on a PAID claim it is not APPROVED so it returns ERR_INVALID_STATE, but on an APPROVED claim re-derived from a SETTLED then RETURNED disbursement the precondition is satisfied. Here we test the ERR_CLAIM_ALREADY_PAID path is unreachable from PAID and instead document that reopen from PAID is ERR_INVALID_STATE."
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_branch_revert_approved_to_under_review
          rationale: "The APPROVED->UNDER_REVIEW reopen happy path and its benefit credit-back are asserted by the named §1.8 instance; the PAID-blocking precondition is covered by terminal_paid_claim_cannot_void above."

      - name: disbursement_return_reverts_claim_to_approved
        claim_type: Compensation
        grounds: [state_machines.Disbursement.SETTLED_to_RETURNED, entities.Claim.fields.paid_cents, entities.Enrollment.fields.benefit_paid_cents]
        distinguishing_aspect: "POST .../disbursements/{id}/return on a SETTLED disbursement sets it RETURNED, credits enrollment.benefit_paid_cents back to 0, and reverts the claim to APPROVED with paid_cents=0."
        test_recipe:
          setup: ["A PAID claim (approved+disbursed 200000) with a SETTLED disbursement on a funded enrollment."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "RetCo", section_125_plan_active: true, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "RetPlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "Ret Emp", email: "ret@x.test" }
              as: BenefitsAdmin
              captures: { emp_e_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts"
              payload: { employee_id: "${emp_e_id}", routing_number: "123456789", account_last4: "1212" }
              as: BenefitsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /benefits/disbursement-accounts/${acct_id}/verify"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_e_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}" }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollments/${enr_id}/payroll-deductions"
              payload: { pay_period_index: 0, outcome: "POSTED" }
              as: Payroll
            - call: "POST /benefits/claims"
              payload: { enrollment_id: "${enr_id}", disbursement_account_id: "${acct_id}", event_code: "FRACTURE", event_date: "2026-03-20T00:00:00Z" }
              as: BenefitsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /benefits/claims/${claim_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /benefits/claims/${claim_id}/disburse"
              payload: {}
              as: ClaimsAdjuster
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /benefits/disbursements/${disb_id}/return"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "Disbursement.${disb_id}.status == RETURNED"
            - "Claim.${claim_id}.status == APPROVED"
            - "Claim.${claim_id}.paid_cents == 0"
            - "Enrollment.${enr_id}.benefit_paid_cents == 0"

      - name: open_product_with_empty_schedule_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.PlanProduct.DRAFT_to_OPEN, "errors[ERR_SCHEDULE_EMPTY]"]
        distinguishing_aspect: "Opening a DRAFT product that has zero BenefitScheduleItems returns ERR_SCHEDULE_EMPTY (409); product stays DRAFT."
        test_recipe:
          setup: ["A DRAFT product with no schedule items."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "EmptyCo" }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "EmptyPlan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
          trigger:
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SCHEDULE_EMPTY"
            - "PlanProduct.${prod_a_id}.status == DRAFT"

      - name: pretax_enrollment_activate_blocked_when_section125_inactive
        claim_type: Precondition Enforcement
        grounds: [state_machines.Enrollment.PENDING_to_ACTIVE, "validations[priority=6]", "errors[ERR_SECTION125_INACTIVE]"]
        distinguishing_aspect: "Activating a pretax enrollment when employer.section_125_plan_active=false returns ERR_SECTION125_INACTIVE (409); enrollment stays PENDING and no Section125Election is created."
        test_recipe:
          setup: ["Employer with section_125_plan_active=false; a pretax enrollment created PENDING."]
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "No125 Co", section_125_plan_active: false, pay_periods_per_year: 52 }
              as: BenefitsAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/plan-products"
              payload: { employer_id: "${emp_id}", policy_type: "ACCIDENT", product_name: "No125Plan", weekly_premium_cents: 1200, annual_benefit_cap_cents: 500000 }
              as: BenefitsAdmin
              captures: { prod_a_id: $.data.id }
            - call: "POST /benefits/schedule-items"
              payload: { plan_product_id: "${prod_a_id}", event_code: "FRACTURE", flat_benefit_cents: 200000 }
              as: BenefitsAdmin
            - call: "POST /benefits/plan-products/${prod_a_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/enrollment-periods"
              payload: { employer_id: "${emp_id}", label: "OE-2026", gi_window_start: "2026-03-01T00:00:00Z", gi_window_end: "2026-04-01T00:00:00Z", benefit_year_start: "2026-01-01T00:00:00Z" }
              as: BenefitsAdmin
              captures: { period_id: $.data.id }
            - call: "POST /benefits/enrollment-periods/${period_id}/open"
              payload: {}
              as: BenefitsAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${emp_id}", full_name: "No125 Emp", email: "no125@x.test" }
              as: BenefitsAdmin
              captures: { emp_e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: System
            - call: "POST /benefits/enrollments"
              payload: { employee_id: "${emp_e_id}", plan_product_id: "${prod_a_id}", enrollment_period_id: "${period_id}", pretax: true }
              as: BenefitsAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /benefits/enrollments/${enr_id}/activate"
              payload: {}
              as: BenefitsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_SECTION125_INACTIVE"
            - "Enrollment.${enr_id}.lifecycle_status == PENDING"

  # ===========================================================================
  - section: calculations
    instances:
      - name: wellness_claim_uncapped_bypasses_benefit_ledger
        claim_type: Variant Selection
        grounds: [calculations.claim_adjudication, entities.BenefitScheduleItem.fields.is_wellness, entities.Enrollment.fields.benefit_paid_cents]
