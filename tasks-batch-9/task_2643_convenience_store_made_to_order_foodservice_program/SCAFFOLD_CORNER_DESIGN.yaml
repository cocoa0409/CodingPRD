          - validations[priority=40]
          - errors[ERR_DAYPART_PLAN_NOT_PUBLISHED]
        distinguishing_aspect: |
          The order violates two rules at once: its store's LUNCH plan is still DRAFT (priority 14) and its
          subtotal 899 is far under the 5000 catering minimum (priority 40). The response must carry
          ERR_DAYPART_PLAN_NOT_PUBLISHED (409), not ERR_ORDER_MINIMUM_NOT_MET (422) - an implementation that
          validates the money before the operating state returns the wrong code and a different HTTP status.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH but its only LUNCH plan for 2026-08-01 is left DRAFT"
            - "one DRAFT anonymous CATERING order for the window 23:00:00Z to 23:30:00Z with a single hoagie, subtotal 899"
