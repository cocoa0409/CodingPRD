# =============================================================================
# Logistics WMS — Scaffold Difficulty Design (§1.8 Test Targeting Index)
#
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules.
# Every grounds[] entry resolves to a declared element in SCAFFOLD.yaml.
# Every test_recipe reproduces the scenario from empty-DB state using only
# endpoints declared in §1.5.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: pick_lot_selection_fefo_vs_fifo
        grounds:
          - calculations.pick_lot_selection
          - entities.Order.fields.pick_strategy
          - entities.Lot.fields.expiry_date
          - entities.Lot.fields.received_at
          - state_machines.Order.CREATED_to_ALLOCATED
        distinguishing_aspect: |
          Pick allocation operates on the Order/Inventory/Lot domain. For two
          ACTIVE lots of the same SKU where lotA has earlier received_at but
          later expiry_date, and lotB has later received_at but earlier
          expiry_date, an Order with pick_strategy=FEFO produces a PickTask
          referencing lotB while an Order with pick_strategy=FIFO produces a
          PickTask referencing lotA — same inventory state, different lot.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): name=W1, dock_position_x=0, dock_position_y=0, putaway_strategy=DISTANCE_OPTIMIZED → W"
            - "POST /_clock/advance (WarehouseManager): warehouse_id=W, new_time=2025-01-01T00:00:00Z"
            - "POST /warehouses/W/bins (WarehouseManager): bin_code=BIN1, zone=AMBIENT, position=(1,0), capacity_volume_cm3=100000, capacity_weight_g=100000 → BIN1"
            - "POST /warehouses/W/lots (WarehouseManager): lot_code=LOT_A, sku=PEN, category=AMBIENT, unit_weight_g=10, unit_volume_cm3=20, unit_value_cents=100, manufacture_date=2024-01-01T00:00:00Z, expiry_date=2030-06-01T00:00:00Z, supplier_lot_ref=SUP_A → LOT_A"
            - "POST /warehouses/W/lots (WarehouseManager): lot_code=LOT_B, sku=PEN, category=AMBIENT, unit_weight_g=10, unit_volume_cm3=20, unit_value_cents=100, manufacture_date=2024-01-01T00:00:00Z, expiry_date=2025-12-31T00:00:00Z, supplier_lot_ref=SUP_B → LOT_B"
            - "Putaway 50 units of LOT_A via inbound shipment cycle (start_inspection + complete_inspection with 0 defects + putaway). LOT_A.received_at = 2025-01-01T00:00:00Z"
            - "POST /_clock/advance: warehouse_id=W, new_time=2025-02-01T00:00:00Z"
            - "Putaway 50 units of LOT_B via second inbound shipment cycle. LOT_B.received_at = 2025-02-01T00:00:00Z"
            - "POST /warehouses/W/orders (WarehouseStaff): order_number=ORD_FEFO, customer_name=Alice, requested_lines=[{sku:PEN, qty_units:30}], pick_strategy=FEFO, carrier=UPS → ORD_FEFO"
            - "POST /warehouses/W/orders (WarehouseStaff): order_number=ORD_FIFO, customer_name=Bob, requested_lines=[{sku:PEN, qty_units:30}], pick_strategy=FIFO, carrier=UPS → ORD_FIFO"
          trigger:
            - "POST /warehouses/W/orders/ORD_FEFO/allocate"
            - "POST /warehouses/W/orders/ORD_FIFO/allocate"
          assert:
            - "ORD_FEFO has exactly one PickTask with lot_id == LOT_B.id and planned_units == 30"
            - "ORD_FIFO has exactly one PickTask with lot_id == LOT_A.id and planned_units == 30"
            - "ORD_FEFO.PickTask.lot_id != ORD_FIFO.PickTask.lot_id (the two variants select different lots for identical request inputs)"

      - name: bin_putaway_distance_vs_capacity
        grounds:
          - calculations.bin_putaway_selection
          - entities.Warehouse.fields.putaway_strategy
          - entities.Bin.fields.distance_from_dock
          - entities.Bin.fields.remaining_volume_cm3
          - state_machines.InboundShipment.PASSED_to_PUTAWAY
        distinguishing_aspect: |
          Bin selection operates on the Bin/InboundShipment domain. For two
          candidate bins of the same zone where binC is closer to the dock
          (distance 2.0) but has smaller capacity (2000 cm3) and binD is
          farther (distance 5.0) but has larger capacity (10000 cm3),
          warehouse.putaway_strategy=DISTANCE_OPTIMIZED selects binC and
          warehouse.putaway_strategy=CAPACITY_OPTIMIZED selects binD —
          same candidate set, different bin chosen.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): name=W_DIST, dock=(0,0), putaway_strategy=DISTANCE_OPTIMIZED → W_DIST"
            - "POST /warehouses (WarehouseManager): name=W_CAP, dock=(0,0), putaway_strategy=CAPACITY_OPTIMIZED → W_CAP"
            - "For each warehouse: POST bins BIN_C (zone=AMBIENT, position=(2,0), capacity_volume_cm3=2000, capacity_weight_g=10000) and BIN_D (zone=AMBIENT, position=(5,0), capacity_volume_cm3=10000, capacity_weight_g=10000)"
            - "For each warehouse: create LOT (sku=PEN, category=AMBIENT, unit_weight_g=10, unit_volume_cm3=500, unit_value_cents=100, expiry=2030-06-01, supplier_lot_ref=SUP)"
            - "For each warehouse: create InboundShipment (asn=ASN1, supplier=ACME, declared_total_units=1, lines=[{lot_id=LOT, declared_units=1}])"
            - "For each warehouse: POST /inbound_shipments/{is}/start_inspection then complete_inspection with inspection_defect_count=0 and lines=[{lot_id=LOT, received_units=1}] → status=PASSED"
          trigger:
            - "POST /warehouses/W_DIST/inbound_shipments/{is}/putaway"
            - "POST /warehouses/W_CAP/inbound_shipments/{is}/putaway"
          assert:
            - "W_DIST: the resulting InboundLine.bin_id equals W_DIST's BIN_C.id (distance 2.0 < 5.0)"
            - "W_CAP: the resulting InboundLine.bin_id equals W_CAP's BIN_D.id (remaining_volume_cm3 10000 > 2000)"
            - "W_DIST.line.bin.bin_code == 'BIN_C' AND W_CAP.line.bin.bin_code == 'BIN_D' (different selection for identical candidate set across strategies)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial formulas across different modes (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_three_weighted_inputs_mode_a
        grounds:
          - calculations.risk_score
          - entities.Warehouse.fields.shrinkage_value_30d_cents
          - entities.Warehouse.fields.abnormal_event_count_24h
          - entities.Warehouse.fields.recall_count_open
          - entities.Warehouse.fields.posture
        distinguishing_aspect: |
          Mode (a) — risk_score combines three independent inputs
          (shrinkage_value_30d_cents, abnormal_event_count_24h,
          recall_count_open) with three different weights (denominator 100,
          ×10, ×100), then applies a non-linear cap (min(., 1000)) and a
          tiered threshold (>200 FROZEN; >100 RESTRICTED; else OPEN). Three
          inputs interact non-linearly via the cap-and-threshold pipeline.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W with default putaway_strategy"
            - "POST /_clock/advance: warehouse_id=W, new_time=2025-01-01T00:00:00Z"
            - "Create lot L1 and inbound shipment with declared_total_units=20 and 1 line declaring 20 units, then complete inspection with inspection_defect_count=1 → defect_rate=0.05 > 0.025 → status=FAILED → abnormal_event_count_24h += 1"
            - "Create lot L2 and inbound shipment, complete inspection with defects=1 → FAILED → abnormal_event_count_24h += 1 (now 2)"
            - "Create lot L3 (any state) — POST /lots/L3/recall (WarehouseManager, recall_reason=SAFETY_ISSUE) → recall_count_open=1, abnormal_event_count_24h still 2"
            - "shrinkage_value_30d_cents remains 0 (no approved cycle counts)"
          trigger:
            - "GET /warehouses/W"
          assert:
            - "Warehouse.abnormal_event_count_24h == 2"
            - "Warehouse.recall_count_open == 1"
            - "Warehouse.shrinkage_value_30d_cents == 0"
            - "Warehouse.risk_score == 120.00 (raw = 0/100 + 2*10 + 1*100 = 120; capped at 1000; rounded to 2 decimals)"
            - "Warehouse.posture == 'RESTRICTED' (risk_score 120 > 100 and not > 200)"

      - name: carton_count_sum_then_ceil_mode_b
        grounds:
          - calculations.carton_count_calc
          - entities.Order.fields.provisional_carton_count
          - entities.Order.fields.final_carton_count
          - state_machines.Order.CREATED_to_ALLOCATED
        distinguishing_aspect: |
          Mode (b) — carton_count_calc pins the rounding (ceil) order: total
          volume is summed across all order lines first, THEN ceiled against
          CARTON_VOLUME_CM3. Per-line ceil-then-sum produces a different
          result. With 2 SKUs each contributing 60000 cm3, sum-then-ceil =
          ceil(120000/50000) = 3, whereas per-line-then-sum = ceil(60000/50000) +
          ceil(60000/50000) = 4. The scaffold pins 3.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W with default putaway_strategy"
            - "POST /_clock/advance: warehouse_id=W, new_time=2025-01-01T00:00:00Z"
            - "POST /warehouses/W/bins: bin_code=B1, zone=AMBIENT, position=(1,0), capacity_volume_cm3=200000, capacity_weight_g=50000"
            - "Create lot L_PEN (sku=PEN, unit_volume_cm3=30000, unit_weight_g=100, unit_value_cents=100, expiry=2030-01-01) and lot L_WID (sku=WIDGET, unit_volume_cm3=30000, unit_weight_g=100, unit_value_cents=100, expiry=2030-01-01)"
            - "Putaway 2 units of L_PEN and 2 units of L_WID via inbound shipments (declared_total_units summed correctly, defects=0)"
            - "POST /warehouses/W/orders: order_number=O1, customer_name=Alice, requested_lines=[{sku:PEN, qty_units:2}, {sku:WIDGET, qty_units:2}], pick_strategy=FEFO, carrier=UPS → O1"
          trigger:
            - "POST /warehouses/W/orders/O1/allocate"
          assert:
            - "Order.provisional_carton_count == 3 (ceil((2*30000 + 2*30000) / 50000) = ceil(2.4) = 3 carton volume; ceil((2*100 + 2*100) / 20000) = 1 carton weight; max(3, 1, 1) = 3)"
            - "Order.provisional_carton_count != 4 (per-line-ceil-then-sum would give ceil(60000/50000) + ceil(60000/50000) = 2 + 2 = 4 — the scaffold pins sum-then-ceil)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: inbound_shipment_failed_to_inspecting_cycle
        grounds:
          - state_machines.InboundShipment.FAILED_to_INSPECTING
          - state_machines.InboundShipment.INSPECTING_to_FAILED
          - state_machines.InboundShipment.INSPECTING_to_PASSED
        distinguishing_aspect: |
          InboundShipment exhibits a cyclic transition: INSPECTING→FAILED via
          /complete_inspection with defect_rate>0.025, and FAILED→INSPECTING
          via /rework — the same shipment can re-enter INSPECTING and
          re-attempt a transition that previously failed, producing a
          rework loop on a single entity instance.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W"
            - "POST /_clock/advance: W, 2025-01-01T00:00:00Z"
            - "Create bin and lot in the warehouse"
            - "POST /warehouses/W/inbound_shipments (WarehouseStaff): asn=ASN1, supplier=ACME, declared_total_units=20, lines=[{lot_id, declared_units=20}] → IS"
            - "POST /inbound_shipments/IS/start_inspection (WarehouseStaff) → status=INSPECTING; inspection_sample_size=8 (declared_total_units=20 ≤ 50)"
          trigger:
            - "POST /inbound_shipments/IS/complete_inspection (WarehouseStaff): inspection_defect_count=1, lines=[{lot_id, received_units=20}] → status=FAILED (defect_rate=1/8=0.125 > 0.025)"
            - "POST /inbound_shipments/IS/rework (WarehouseStaff)"
            - "POST /inbound_shipments/IS/complete_inspection (WarehouseStaff): inspection_defect_count=0, lines=[{lot_id, received_units=20}] → status=PASSED"
          assert:
            - "After first complete_inspection: InboundShipment.status == 'FAILED'"
            - "After /rework: InboundShipment.status == 'INSPECTING' (cycle FAILED→INSPECTING)"
            - "After second complete_inspection: InboundShipment.status == 'PASSED' (proves the cyclic re-entry was successful)"
            - "InboundShipment.inspection_defect_count is null after /rework and reset to 0 after second complete_inspection"

      - name: order_short_picked_to_allocated_cycle
        grounds:
          - state_machines.Order.SHORT_PICKED_to_ALLOCATED
          - state_machines.Order.PICKING_to_SHORT_PICKED
          - state_machines.Order.CREATED_to_ALLOCATED
          - state_machines.PickTask.PICKING_to_SHORT_PICKED
        distinguishing_aspect: |
          Order exhibits a cyclic transition: PICKING→SHORT_PICKED on partial
          pick completion, and SHORT_PICKED→ALLOCATED via /replan — the
          same order re-enters ALLOCATED to regenerate pick tasks for the
          residual units, producing a replan loop on a single Order
          instance distinct from InboundShipment.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W"
            - "POST /_clock/advance: W, 2025-01-01T00:00:00Z"
            - "Create bin and lot (sku=PEN, unit_volume=20, unit_weight=10), putaway 50 units"
            - "Create order O with requested_lines=[{sku:PEN, qty_units:30}], pick_strategy=FEFO, carrier=UPS"
            - "POST /orders/O/allocate → status=ALLOCATED, 1 PickTask with planned_units=30"
            - "Create wave with order_ids=[O], release the wave"
            - "POST /pick_tasks/{pt}/start → PickTask.status=PICKING; Order.status=PICKING"
          trigger:
            - "POST /pick_tasks/{pt}/complete (WarehouseStaff): picked_units=10 → PickTask.status=SHORT_PICKED → Order.status=SHORT_PICKED"
            - "POST /orders/O/replan (WarehouseStaff)"
          assert:
            - "Before /replan: Order.status == 'SHORT_PICKED'"
            - "After /replan: Order.status == 'ALLOCATED' (cycle SHORT_PICKED→ALLOCATED)"
            - "After /replan: a NEW PickTask exists with planned_units == 20 (residual = 30 - 10) and status == 'CREATED'"
            - "The original PickTask is retained (status remains SHORT_PICKED) for audit"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive cascade chains from different triggers (≥2;
  #         one of depth ≥3, the other of depth ≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lot_recall_cascade_depth_4
        grounds:
          - state_machines.Lot.ACTIVE_to_RECALLED
          - state_machines.PickTask.PICKING_to_FAILED
          - state_machines.Order.PICKING_to_SHORT_PICKED
          - calculations.risk_score
          - entities.Warehouse.fields.abnormal_event_count_24h
          - entities.Warehouse.fields.recall_count_open
        distinguishing_aspect: |
          Trigger: POST /lots/{id}/recall. Hop 1: Lot.status → RECALLED.
          Hop 2 (caused by hop 1): all PICKING/CREATED PickTasks for the lot
          → FAILED. Hop 3 (caused by hop 2): the Order whose pick tasks all
          became terminal with at least one FAILED → SHORT_PICKED. Hop 4
          (caused by hop 3): Warehouse.abnormal_event_count_24h += 1, then
          risk_score recomputed — depth ≥ 4 distinct hops, each caused by
          the previous hop, not by the original /recall request directly.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W"
            - "POST /_clock/advance: W, 2025-01-01T00:00:00Z"
            - "Create bin BIN1 and lot LOT1 (sku=PEN); putaway 50 units"
            - "Create order O (requested_lines=[{sku:PEN, qty_units:10}], pick_strategy=FEFO, carrier=UPS); allocate O → 1 PickTask referencing LOT1"
            - "Create wave W_v with [O]; release; start the pick task → PickTask.status=PICKING; Order.status=PICKING"
            - "Capture pre-test value: warehouse.abnormal_event_count_24h_pre = current value"
            - "Capture pre-test value: warehouse.recall_count_open_pre = current value"
          trigger:
            - "POST /warehouses/W/lots/LOT1/recall (WarehouseManager): recall_reason=SAFETY_ISSUE"
          assert:
            - "Hop 1: Lot.status == 'RECALLED' AND Lot.recalled_at == 2025-01-01T00:00:00Z"
            - "Hop 2: PickTask.status == 'FAILED' (cascaded from lot recall)"
            - "Hop 3: Order.status == 'SHORT_PICKED' (cascaded from pick task)"
            - "Hop 4: Warehouse.abnormal_event_count_24h == abnormal_event_count_24h_pre + 1 (cascaded from order short-pick)"
            - "Warehouse.recall_count_open == recall_count_open_pre + 1"
            - "Warehouse.risk_score recomputed (changed from pre-test value because abnormal_event_count_24h and recall_count_open both changed)"
            - "Inventory.reserved_units for the (BIN1, LOT1) row == 0 after cascade (the 10 reserved units were released)"

      - name: cycle_count_adjust_cascade_depth_3
        grounds:
          - state_machines.CycleCount.VARIANCE_FOUND_to_ADJUSTED
          - calculations.bin_remaining_capacity
          - entities.Inventory.fields.qty_units
          - entities.Bin.fields.used_volume_cm3
          - entities.Warehouse.fields.shrinkage_value_30d_cents
        distinguishing_aspect: |
          Trigger: POST /cycle_counts/{id}/approve_adjustment. Hop 1:
          CycleCount.status → ADJUSTED. Hop 2 (caused by hop 1):
          Inventory.qty_units = counted_qty (the inventory write). Hop 3
          (caused by hop 2): Bin.used_volume_cm3 and used_weight_g
          recomputed via §1.3 bin_remaining_capacity. Independently from
          hop 1: Warehouse.shrinkage_value_30d_cents += variance_value_cents
          (a parallel side effect of hop 1, not on the chain) — the chain
          itself is depth 3 originating from a different trigger than rule
          4 instance 1.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W"
            - "POST /_clock/advance: W, 2025-01-01T00:00:00Z"
            - "Create bin BIN1 (capacity_volume_cm3=10000, capacity_weight_g=10000) and lot LOT1 (sku=PEN, unit_volume_cm3=20, unit_weight_g=10, unit_value_cents=100)"
            - "Putaway 100 units of LOT1 to BIN1: Inventory.qty_units=100; Bin.used_volume_cm3=2000; Bin.used_weight_g=1000"
            - "POST /warehouses/W/cycle_counts (WarehouseStaff, X-User-ID=USER_S1): bin_id=BIN1, lot_id=LOT1 → CC; CC.book_qty=100; BIN1.status=FROZEN"
            - "POST /cycle_counts/CC/start (WarehouseStaff)"
            - "POST /cycle_counts/CC/submit_count (WarehouseStaff, X-User-ID=USER_S1): counted_qty=95 → CC.status=VARIANCE_FOUND; variance_units=-5; variance_value_cents=500"
          trigger:
            - "POST /cycle_counts/CC/approve_adjustment (Auditor, X-User-ID=USER_A1)"
          assert:
            - "Hop 1: CycleCount.status == 'ADJUSTED' AND approved_by_user_id == 'USER_A1'"
            - "Hop 2: Inventory(BIN1, LOT1).qty_units == 95 (cascaded from approval)"
            - "Hop 3: BIN1.used_volume_cm3 == 1900 (= 95 * 20; recomputed from new qty) AND BIN1.used_weight_g == 950 (= 95 * 10)"
            - "Side effect on warehouse: Warehouse.shrinkage_value_30d_cents == 500 (5 * 100, rounded per cycle count)"
            - "Bin.status == 'ACTIVE' and frozen_by_cycle_count_id == null after approval"

  # ---------------------------------------------------------------------------
  # Rule 5 — validation priority conflicts across different category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pick_start
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_LOT_NOT_PICKABLE
          - state_machines.PickTask.CREATED_to_PICKING
        distinguishing_aspect: |
          Category pair: state (priority 5, ERR_INVALID_STATE) vs
          business_safety (priority 6, ERR_LOT_NOT_PICKABLE). On
          /pick_tasks/{id}/start, when the PickTask is in CANCELLED state
          AND the referenced Lot is RECALLED, both checks fail; the
          scaffold's priority order pins ERR_INVALID_STATE as the winner.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W"
            - "Create bin, lot LOT1 (sku=PEN); putaway 50 units"
            - "Create order O; allocate (1 PickTask referencing LOT1, status=CREATED)"
            - "POST /orders/O/cancel → cascades PickTask to CANCELLED"
            - "POST /lots/LOT1/recall (WarehouseManager, reason=SAFETY_ISSUE) → LOT1.status=RECALLED"
          trigger:
            - "POST /pick_tasks/{pt}/start (WarehouseStaff)"
          assert:
            - "Response status code == 409"
            - "Response body data.error_id == 'ERR_INVALID_STATE' (not 'ERR_LOT_NOT_PICKABLE'; priority 5 < 6)"
            - "PickTask.status == 'CANCELLED' (unchanged)"

      - name: capacity_vs_safety_order_allocate
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_INSUFFICIENT_INVENTORY
          - errors.ERR_POSTURE_FROZEN
          - state_machines.Order.CREATED_to_ALLOCATED
          - calculations.risk_score
        distinguishing_aspect: |
          Category pair: business_capacity (priority 13,
          ERR_INSUFFICIENT_INVENTORY) vs business_safety (priority 14,
          ERR_POSTURE_FROZEN). Different pair from instance 1 (which uses
          state vs business_safety). On /orders/{id}/allocate, when both
          inventory is insufficient AND warehouse posture is FROZEN, the
          scaffold pins ERR_INSUFFICIENT_INVENTORY as the winner.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W"
            - "POST /_clock/advance: W, 2025-01-01T00:00:00Z"
            - "Create lots LOT_R1, LOT_R2, LOT_R3 in W (any sku/category)"
            - "POST /lots/LOT_R1/recall, /lots/LOT_R2/recall, /lots/LOT_R3/recall (WarehouseManager, reason=SUPPLIER_RECALL each) → recall_count_open=3"
            - "Warehouse.risk_score = 0/100 + 0*10 + 3*100 = 300; posture=FROZEN (300 > 200)"
            - "Create order O with requested_lines=[{sku:NONEXISTENT_SKU, qty_units:10}], carrier=UPS, pick_strategy=FEFO (no inventory exists for this sku → ERR_INSUFFICIENT_INVENTORY would fire)"
          trigger:
            - "POST /warehouses/W/orders/O/allocate (WarehouseStaff)"
          assert:
            - "Response status code == 409"
            - "Response body data.error_id == 'ERR_INSUFFICIENT_INVENTORY' (not 'ERR_POSTURE_FROZEN'; priority 13 < 14)"
            - "Order.status == 'CREATED' (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bin_volume_capacity_inclusive_boundary
        grounds:
          - calculations.bin_putaway_selection
          - calculations.bin_remaining_capacity
          - entities.Bin.fields.capacity_volume_cm3
          - state_machines.InboundShipment.PASSED_to_PUTAWAY
          - errors.ERR_NO_BIN_AVAILABLE
        distinguishing_aspect: |
          Metric: bin volume capacity in cm3 at the /putaway endpoint. The
          filter is bin.remaining_volume_cm3 >= received_units *
          lot.unit_volume_cm3 (>= inclusive). At the boundary where
          remaining equals required exactly, putaway succeeds; one unit
          larger fails with ERR_NO_BIN_AVAILABLE.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W (default DISTANCE_OPTIMIZED, dock=(0,0))"
            - "POST /warehouses/W/bins: BIN1 (zone=AMBIENT, capacity_volume_cm3=1000, capacity_weight_g=100000, position=(1,0))"
            - "POST /warehouses/W/lots: LOT1 (sku=PEN, category=AMBIENT, unit_volume_cm3=200, unit_weight_g=10, unit_value_cents=100, expiry=2030-01-01)"
            - "Pre-fill BIN1 with 0 units used_volume_cm3 (initial state). remaining_volume_cm3 = 1000."
            - "Case A: Create InboundShipment IS_A with line declaring 5 units of LOT1 (volume = 5*200 = 1000 cm3 — exactly equals remaining). Run start_inspection + complete_inspection (defects=0)."
            - "Case B (separate warehouse run): Create another inbound shipment IS_B with line declaring 6 units of LOT1 (volume = 6*200 = 1200 cm3 — exceeds remaining by 200)."
          trigger:
            - "Case A: POST /warehouses/W/inbound_shipments/IS_A/putaway"
            - "Case B: POST /warehouses/W/inbound_shipments/IS_B/putaway"
          assert:
            - "Case A succeeds with HTTP 200; line.bin_id == BIN1.id; BIN1.used_volume_cm3 == 1000 (boundary inclusive)"
            - "Case B fails with HTTP 409 and data.error_id == 'ERR_NO_BIN_AVAILABLE' (1200 > 1000 — strict less-than fails the >= filter)"

      - name: near_expiry_days_inclusive_boundary
        grounds:
          - calculations.near_expiry_marker
          - state_machines.Lot.ACTIVE_to_NEAR_EXPIRY
          - entities.Lot.fields.expiry_date
          - entities.Warehouse.fields.clock_now
        distinguishing_aspect: |
          Metric: days_to_expiry in days at the /_clock/advance endpoint
          (different metric and different endpoint from instance 1). The
          NEAR_EXPIRY threshold is days_to_expiry <= 30 (≤ inclusive). At
          exactly 30 days, lot transitions to NEAR_EXPIRY; at 31 days,
          status remains ACTIVE.
        test_recipe:
          setup:
            - "POST /warehouses (WarehouseManager): W (clock_now initialized to epoch 1970-01-01T00:00:00Z)"
            - "POST /warehouses/W/lots (WarehouseManager): LOT_30 with sku=PEN, category=AMBIENT, unit_weight_g=10, unit_volume_cm3=20, unit_value_cents=100, manufacture_date=1970-01-01, expiry_date=2025-01-31T00:00:00Z (creation succeeds at epoch clock; expiry will be exactly 30 days from the trigger's new_time)"
            - "POST /warehouses/W/lots: LOT_31 with sku=PEN, ..., expiry_date=2025-02-01T00:00:00Z (will be 31 days from the trigger's new_time)"
          trigger:
            - "POST /_clock/advance (WarehouseManager): warehouse_id=W, new_time=2025-01-01T00:00:00Z — advances clock from epoch and runs near_expiry_marker scan"
          assert:
            - "Lot LOT_30.status == 'NEAR_EXPIRY' (days_to_expiry = floor((2025-01-31 - 2025-01-01) / 86400s) = 30 ≤ 30 inclusive)"
            - "Lot LOT_31.status == 'ACTIVE' (days_to_expiry = 31 > 30 — strict less-than fails the ≤30 filter)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pick_task_depends_on_bin_status
        grounds:
          - state_machines.PickTask.CREATED_to_PICKING
          - state_machines.CycleCount.SCHEDULED_to_COUNTING
          - entities.Bin.fields.status
          - errors.ERR_BIN_FROZEN
        distinguishing_aspect: |
          Entity pair: PickTask ↔ Bin. PickTask.CREATED→PICKING precondition
          requires the source Bin.status == ACTIVE. Scheduling a CycleCount
          on the bin transitions Bin.status → FROZEN without cascading to
          the PickTask, so the PickTask remains CREATED while its source
          Bin becomes non-pickable; /pick_tasks/{id}/start then fails on
          the cross-entity Bin gate alone.
        test_recipe:
          setup:
            - "Create warehouse W (default putaway_strategy)"
            - "Create bin BIN1 (zone=AMBIENT) and lot LOT1 (sku=PEN, category=AMBIENT)"
            - "Putaway 30 units of LOT1 to BIN1 via inbound shipment cycle"
            - "Create order O (requested_lines=[{sku:PEN, qty_units:10}], pick_strategy=FEFO, carrier=UPS); allocate → 1 PickTask referencing BIN1+LOT1, status=CREATED"
            - "Create wave with [O] and release → PickTask remains CREATED (start has not been called)"
            - "POST /warehouses/W/cycle_counts (WarehouseStaff, X-User-ID=USER_S1): bin_id=BIN1, lot_id=LOT1 → BIN1.status=FROZEN"
          trigger:
            - "POST /warehouses/W/pick_tasks/{pt}/start (WarehouseStaff)"
          assert:
            - "Response status code == 409"
            - "Response body data.error_id == 'ERR_BIN_FROZEN'"
            - "PickTask.status == 'CREATED' (unchanged; the cross-entity gate on Bin blocked the transition)"
            - "BIN1.status == 'FROZEN' (the cross-entity field driving the rejection)"

      - name: order_allocate_depends_on_warehouse_posture
        grounds:
          - state_machines.Order.CREATED_to_ALLOCATED
          - calculations.risk_score
          - entities.Warehouse.fields.posture
          - errors.ERR_POSTURE_FROZEN
        distinguishing_aspect: |
          Entity pair: Order ↔ Warehouse (different from instance 1). Order
          CREATED→ALLOCATED precondition requires Warehouse.posture IN
          {OPEN, RESTRICTED}. Warehouse.posture is a derived field from
          Warehouse-level rolling counters; an Order's allowed transition
          depends on Warehouse state, not on its own.
        test_recipe:
          setup:
            - "Create warehouse W"
            - "Recall 3 lots in W → recall_count_open=3 → risk_score=300 → posture=FROZEN"
            - "Create lot LOT_PEN (sku=PEN), bin, putaway 50 units of LOT_PEN"
            - "Create order O with requested_lines=[{sku:PEN, qty_units:10}], pick_strategy=FEFO, carrier=UPS"
          trigger:
            - "POST /warehouses/W/orders/O/allocate (WarehouseStaff)"
          assert:
            - "Response status code == 409"
            - "Response body data.error_id == 'ERR_POSTURE_FROZEN'"
            - "Order.status == 'CREATED' (unchanged)"
            - "Warehouse.posture == 'FROZEN' (the gating cross-entity field that blocks the Order's transition)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across different interval
  #         semantics on different resources (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: bin_freeze_per_bin_closed_open_interval
        grounds:
          - state_machines.CycleCount.SCHEDULED_to_COUNTING
          - entities.Bin.fields.status
          - entities.Bin.fields.frozen_by_cycle_count_id
          - errors.ERR_BIN_FROZEN
          - concurrency_rules[bin_freeze]
        distinguishing_aspect: |
          Resource: Bin (per-bin scope). Interval semantics: closed-open
          [scheduled_at, terminal_at) — a Bin is FROZEN from the moment a
          CycleCount is created on it (status SCHEDULED, COUNTING, or
          VARIANCE_FOUND) until the CycleCount reaches a terminal status
          (RECONCILED, ADJUSTED, DISPUTED). A second SCHEDULE on the same
          bin during that interval is rejected with ERR_BIN_FROZEN; bins
          NOT under cycle count are unaffected.
        test_recipe:
          setup:
            - "Create warehouse W, bin BIN1, bin BIN2, lot LOT1; putaway 50 units of LOT1 to BIN1"
            - "POST /warehouses/W/cycle_counts (WarehouseStaff, X-User-ID=USER_S1): bin_id=BIN1, lot_id=LOT1 → CC1; BIN1.status=FROZEN"
          trigger:
            - "POST /warehouses/W/cycle_counts (WarehouseStaff): bin_id=BIN1, lot_id=LOT1 (overlap on same bin)"
            - "POST /warehouses/W/cycle_counts (WarehouseStaff): bin_id=BIN2, lot_id=LOT1 (different bin — should succeed)"
          assert:
            - "First overlap attempt: Response status 409, data.error_id == 'ERR_BIN_FROZEN'"
            - "Second attempt on BIN2: Response status 201; BIN2.status becomes FROZEN; this proves the overlap rule is per-bin (closed-open interval scoped to the bin), not warehouse-wide"

      - name: wave_per_warehouse_singleton_exclusion
        grounds:
          - state_machines.Wave.PLANNED_to_RELEASED
          - errors.ERR_WAVE_OVERLAP
          - concurrency_rules[wave_overlap]
        distinguishing_aspect: |
          Resource: Warehouse (warehouse-wide scope, different from per-bin
          scope in instance 1). Interval semantics: warehouse-wide
          singleton — only ONE Wave per warehouse may be in {RELEASED,
          IN_PROGRESS} at a time. Multiple PLANNED waves are allowed; only
          the release transition is gated. This is a different geometric
          treatment from the per-bin closed-open interval.
        test_recipe:
          setup:
            - "Create warehouse W, bin BIN1, lot LOT1; putaway 100 units of LOT1"
            - "Create order O1 (qty=10 LOT1 sku); allocate"
            - "Create order O2 (qty=10 LOT1 sku); allocate"
            - "Create wave WAVE_A with order_ids=[O1] (PLANNED)"
            - "Create wave WAVE_B with order_ids=[O2] (PLANNED)"
            - "POST /waves/WAVE_A/release → WAVE_A.status=RELEASED"
          trigger:
            - "POST /warehouses/W/waves/WAVE_B/release"
          assert:
            - "Response status 409, data.error_id == 'ERR_WAVE_OVERLAP'"
            - "WAVE_A.status remains 'RELEASED'; WAVE_B.status remains 'PLANNED'"
            - "Distinguishing geometry: the rule rejects on warehouse-wide existence of any RELEASED/IN_PROGRESS wave, not per-bin or per-order — proves the singleton-per-warehouse semantics"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants across different conserved
  #         quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reserved_units_invariant_allocate_then_cancel
        grounds:
          - state_machines.Order.CREATED_to_ALLOCATED
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - calculations.pick_lot_selection
          - entities.Inventory.fields.reserved_units
        distinguishing_aspect: |
          Conserved quantity: Inventory.reserved_units for a given (bin_id,
          lot_id). Forward action: Order /allocate increments reserved_units
          by sum of the order's PickTask.planned_units for that row.
          Compensating action: Order /cancel from ALLOCATED decrements
          reserved_units by the same total. Invariant: reserved_units after
          allocate→cancel exactly equals reserved_units before allocate
          (no drift).
        test_recipe:
          setup:
            - "Create warehouse W, bin BIN1, lot LOT1 (sku=PEN); putaway 50 units"
            - "Inventory(BIN1, LOT1).qty_units=50, reserved_units=0 (baseline)"
            - "Capture baseline: pre_reserved = Inventory.reserved_units = 0"
            - "Create order O with requested_lines=[{sku:PEN, qty_units:30}], pick_strategy=FEFO, carrier=UPS"
          trigger:
            - "POST /warehouses/W/orders/O/allocate (forward) → reserved_units becomes 30"
            - "POST /warehouses/W/orders/O/cancel (compensating, status=ALLOCATED) → reserved_units back to 0"
          assert:
            - "After allocate: Inventory(BIN1, LOT1).reserved_units == 30 (forward effect)"
            - "After cancel: Inventory(BIN1, LOT1).reserved_units == 0 (compensating effect, equals pre_reserved)"
            - "Invariant: post_cancel_reserved_units == pre_reserved (= 0); no drift"
            - "qty_units unchanged at 50 throughout (separate conserved quantity)"

      - name: qty_units_invariant_putaway_then_dispose
        grounds:
          - state_machines.InboundShipment.PASSED_to_PUTAWAY
          - state_machines.Lot.ACTIVE_to_RECALLED
          - state_machines.Lot.RECALLED_to_DISPOSED
          - entities.Inventory.fields.qty_units
        distinguishing_aspect: |
          Conserved quantity: Inventory.qty_units for a given lot
          (warehouse-wide), measured before-putaway and after-dispose.
          Different conserved quantity from instance 1 (qty_units, not
          reserved_units; warehouse-wide aggregate, not per-row reservation).
          Forward action: InboundShipment /putaway increments qty_units.
          Compensating action: Lot /recall then /dispose zeros qty_units
          for that lot. Invariant: pre-putaway total qty_units (= 0)
          equals post-dispose total qty_units (= 0).
        test_recipe:
          setup:
            - "Create warehouse W, bin BIN1, lot LOT1 (sku=PEN, unit_volume_cm3=20, unit_weight_g=10, unit_value_cents=100, expiry=2030-01-01)"
            - "Capture baseline: pre_total_qty = sum(Inventory.qty_units for inv where lot_id == LOT1.id) = 0 (no putaways yet)"
          trigger:
            - "Forward: Create InboundShipment with line declaring 50 units of LOT1; complete inspection (defects=0); POST /inbound_shipments/{is}/putaway → Inventory(BIN1, LOT1).qty_units=50"
            - "Compensating: POST /lots/LOT1/recall (WarehouseManager, reason=SUPPLIER_RECALL); POST /lots/LOT1/dispose (WarehouseStaff)"
          assert:
            - "After putaway: sum(Inventory.qty_units for lot_id==LOT1) == 50 (forward effect)"
            - "After dispose: sum(Inventory.qty_units for lot_id==LOT1) == 0 (compensating effect, equals pre_total_qty)"
            - "Invariant: post_dispose_total_qty == pre_total_qty (= 0); no drift in qty_units"
            - "Lot.status == 'DISPOSED'; BIN1.used_volume_cm3 == 0 (cascaded recompute reflects the zero qty)"
