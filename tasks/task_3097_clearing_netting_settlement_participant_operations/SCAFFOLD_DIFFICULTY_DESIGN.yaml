              captures: { win_emp: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_eb}", security_id: "${sec_emp}", side: "BUY", quantity: 10, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_ea}"
              captures: { t_emp: $.data.id }
            - call: "POST /clearing/trade-submissions"
              payload: { counterparty_participant_id: "${p_ea}", security_id: "${sec_emp}", side: "SELL", quantity: 10, trade_price_cents: 4000, trade_date: "2026-09-08T14:00:00Z" }
              as: ClearingMember
              as_user_id: "${p_eb}"
              captures: { t_emp_b: $.data.id }
            - call: "POST /clearing/trade-submissions/${t_emp}/lock-in"
              payload: {}
              as: ClearingMember
