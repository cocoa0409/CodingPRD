            - "turn3 start-cycle rejected with 2 active cycles (2 == slot_capacity): ${err} == ERR_STERILIZER_CAPACITY_EXCEEDED"
            - "turn3 remains DECONTAMINATING; turn1 and turn2 remain STERILIZING"

  - rule_id: compensating_invariant
