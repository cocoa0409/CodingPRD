scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: percentage_rent_billing_mode_divergence_on_lease_year
        grounds:
          - calculations.percentage_rent_charge
          - entities.Lease.fields.billing_mode
          - entities.LeaseYear.fields.billing_mode_snapshot
          - entities.LeaseYear.fields.cumulative_billed_cents
          - state_machines.SalesReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Two leases with byte-identical economics and byte-identical sales bill different
          money because CUMULATIVE_YTD tests the annual breakpoint once (60,000,000 net vs a
          40,000,000 breakpoint -> 1,200,000 total) while PERIOD_STANDALONE tests a pro-rated
          monthly breakpoint per period (3,333,333 -> 1,600,000 twice = 3,200,000); the subject
          of this dual variant is billed money on a LeaseYear.
        test_recipe:
          setup:
            - "One center, two INLINE tenants, two ACTIVE leases identical in every field except billing_mode and suite_code."
            - "Each lease has LeaseYear 1 spanning 2026-09-01 to 2027-09-01 with breakpoint_cents 40000000 and percentage_rate_bps_snapshot 600."
            - "Each lease year has two monthly reports; the September report of each is already ACCEPTED at 30,000,000 gross with no exclusions; the October report of each is SUBMITTED at 30,000,000."
            - "After the September acceptances the CUMULATIVE_YTD year has 0 issued charges and the PERIOD_STANDALONE year already has one 1,600,000 charge."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000, fiscal_year_start_month: 9 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Bright Shoes LLC", trade_name: "Bright Shoes", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t_cum_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Bright Shoes West LLC", trade_name: "Bright Shoes West", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t_std_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t_cum_id}", suite_code: "101", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 40000000, billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_cum_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t_std_id}", suite_code: "102", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 40000000, billing_mode: "PERIOD_STANDALONE", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_std_id: $.data.id }
            - call: "POST /retail/leases/${lease_cum_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_std_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_cum_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_cum_id: $.data.id }
            - call: "POST /retail/leases/${lease_std_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_std_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_cum_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r_cum_1: $.data.id }
            - call: "POST /retail/lease-years/${ly_cum_id}/sales-reports"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r_cum_2: $.data.id }
            - call: "POST /retail/lease-years/${ly_std_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r_std_1: $.data.id }
            - call: "POST /retail/lease-years/${ly_std_id}/sales-reports"
              payload: { period_start: "2026-10-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r_std_2: $.data.id }
            - call: "POST /retail/sales-reports/${r_cum_1}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${t_cum_id}"
            - call: "POST /retail/sales-reports/${r_cum_1}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${r_std_1}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${t_std_id}"
            - call: "POST /retail/sales-reports/${r_std_1}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${r_cum_2}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${t_cum_id}"
            - call: "POST /retail/sales-reports/${r_std_2}/submit"
              payload: { gross_sales_cents: 30000000 }
              as: TenantUser
              as_user_id: "${t_std_id}"
          trigger:
            - call: "POST /retail/sales-reports/${r_cum_2}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${r_std_2}/accept"
              payload: {}
              as: LeaseAdministrator
          assert:
            - "LeaseYear.${ly_cum_id}.cumulative_net_sales_cents == 60000000"
            - "LeaseYear.${ly_std_id}.cumulative_net_sales_cents == 60000000"
            - "LeaseYear.${ly_cum_id}.cumulative_billed_cents == 1200000"
            - "LeaseYear.${ly_std_id}.cumulative_billed_cents == 3200000"
            - "GET /retail/charges with lease_year_id=${ly_cum_id} returns exactly 1 row, charge_type == PERIODIC, billing_status == ISSUED, amount_cents == 1200000"
            - "GET /retail/charges with lease_year_id=${ly_std_id} returns exactly 2 rows, each charge_type == PERIODIC, billing_status == ISSUED, amount_cents == 1600000"

      - name: co_tenancy_relief_type_divergence_on_lease_rent
        grounds:
          - calculations.co_tenancy_relief
          - entities.CoTenancyClause.fields.relief_type
          - entities.Lease.fields.effective_monthly_rent_cents
          - entities.Lease.fields.relief_monthly_credit_cents
          - state_machines.CoTenancyEvent.CURE_PENDING_to_RELIEF_ACTIVE
        distinguishing_aspect: |
          Two leases with the same 12,000,000 annual base rent, the same 800 relief_pct_bps and
          the same single 9,000,000 accepted net-sales history land on different
          effective_monthly_rent_cents - 920,000 under RENT_REDUCTION versus 720,000 under
          ALTERNATIVE_SALES_RENT; the subject of this dual variant is contract rent on a Lease,
          a different entity domain from the LeaseYear billing instance.
        test_recipe:
          setup:
            - "One center with one OPERATING ANCHOR tenant (120,000 sqft) and two INLINE tenants."
            - "Two ACTIVE leases identical in every field (annual_base_rent_cents 12000000, NATURAL breakpoint, rate 600), each with LeaseYear 1 and one ACCEPTED September report at 9,000,000 gross and no exclusions."
            - "Each lease carries one CoTenancyClause with required_open_anchor_count 1, required_occupancy_bps 0, cure_period_days 0, relief_pct_bps 800, termination_right_after_days 180 - differing only in relief_type."
            - "The anchor has gone DARK, so both clauses are VIOLATED and each has one CoTenancyEvent already acknowledged into CURE_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000, fiscal_year_start_month: 9 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Anchor Dept Store LLC", trade_name: "AnchorMart", category: "ANCHOR", gla_sqft: 120000 }
              as: CenterAdmin
              captures: { anchor_id: $.data.id }
            - call: "POST /retail/tenants/${anchor_id}/status"
              payload: { to_status: "OPERATING" }
              as: CenterAdmin
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "RR Tenant LLC", trade_name: "RR Shop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t_rr_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "ALT Tenant LLC", trade_name: "ALT Shop", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { t_alt_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t_rr_id}", suite_code: "201", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_rr_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${t_alt_id}", suite_code: "202", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "NATURAL", billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_alt_id: $.data.id }
            - call: "POST /retail/leases/${lease_rr_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_alt_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_rr_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_rr_id: $.data.id }
            - call: "POST /retail/leases/${lease_alt_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_alt_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_rr_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r_rr_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_alt_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r_alt_id: $.data.id }
            - call: "POST /retail/sales-reports/${r_rr_id}/submit"
              payload: { gross_sales_cents: 9000000 }
              as: TenantUser
              as_user_id: "${t_rr_id}"
            - call: "POST /retail/sales-reports/${r_rr_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${r_alt_id}/submit"
              payload: { gross_sales_cents: 9000000 }
              as: TenantUser
              as_user_id: "${t_alt_id}"
            - call: "POST /retail/sales-reports/${r_alt_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/leases/${lease_rr_id}/co-tenancy-clauses"
              payload: { required_open_anchor_count: 1, required_occupancy_bps: 0, cure_period_days: 0, relief_type: "RENT_REDUCTION", relief_pct_bps: 800, termination_right_after_days: 180 }
              as: CenterAdmin
              captures: { clause_rr_id: $.data.id }
            - call: "POST /retail/leases/${lease_alt_id}/co-tenancy-clauses"
              payload: { required_open_anchor_count: 1, required_occupancy_bps: 0, cure_period_days: 0, relief_type: "ALTERNATIVE_SALES_RENT", relief_pct_bps: 800, termination_right_after_days: 180 }
              as: CenterAdmin
              captures: { clause_alt_id: $.data.id }
            - call: "POST /retail/tenants/${anchor_id}/status"
              payload: { to_status: "DARK" }
              as: CenterAdmin
            - call: "GET /retail/co-tenancy-events"
              payload: { clause_id: "${clause_rr_id}" }
              as: CenterAdmin
              captures: { ev_rr_id: "$.data[0].id" }
            - call: "GET /retail/co-tenancy-events"
              payload: { clause_id: "${clause_alt_id}" }
              as: CenterAdmin
              captures: { ev_alt_id: "$.data[0].id" }
            - call: "POST /retail/co-tenancy-events/${ev_rr_id}/acknowledge"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/co-tenancy-events/${ev_alt_id}/acknowledge"
              payload: {}
              as: LeaseAdministrator
          trigger:
            - call: "POST /retail/co-tenancy-events/${ev_rr_id}/activate-relief"
              payload: {}
              as: CenterAdmin
              as_user_id: "ca-relief-1"
            - call: "POST /retail/co-tenancy-events/${ev_alt_id}/activate-relief"
              payload: {}
              as: CenterAdmin
              as_user_id: "ca-relief-1"
          assert:
            - "Lease.${lease_rr_id}.natural_breakpoint_cents == 200000000"
            - "Lease.${lease_rr_id}.effective_monthly_rent_cents == 920000"
            - "Lease.${lease_rr_id}.relief_monthly_credit_cents == 80000"
            - "Lease.${lease_alt_id}.effective_monthly_rent_cents == 720000"
            - "Lease.${lease_alt_id}.relief_monthly_credit_cents == 280000"
            - "Lease.${lease_rr_id}.status == RELIEF_ACTIVE and Lease.${lease_alt_id}.status == RELIEF_ACTIVE"
            - "Lease.${lease_rr_id}.relief_approved_by_user_id == \"ca-relief-1\""

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: exclusion_cap_waterfall_nonlinear_mode_a
        grounds:
          - calculations.net_reported_sales
          - entities.Lease.fields.exclusion_profile
          - entities.SalesExclusion.fields.allowed_cents
          - entities.SalesExclusion.fields.status
          - entities.SalesReport.fields.net_sales_cents
        distinguishing_aspect: |
          Mode (a): each exclusion line's allowance is max(0, min(claimed, min(gross*cap_bps/10000,
          hard_cap))) - four inputs with nested min/max and a branch on Lease.exclusion_profile -
          and the lines are then trimmed by an aggregate cap through a descending waterfall, so
          the 3,000,000 result cannot be reproduced by any single linear formula.
        test_recipe:
          setup:
            - "One ACTIVE lease with exclusion_profile STANDARD, ARTIFICIAL breakpoint 40000000, rate 600, MONTHLY reporting."
            - "LeaseYear 1 is OPEN with one PENDING September report."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Bright Shoes LLC", trade_name: "Bright Shoes", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "101", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 40000000, billing_mode: "CUMULATIVE_YTD", reporting_frequency: "MONTHLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /retail/sales-reports/${r1_id}/submit"
              payload: { gross_sales_cents: 20000000, exclusions: [ { code: "RETURNS_AND_ALLOWANCES", claimed_cents: 3000000 }, { code: "GIFT_CARD_ISSUANCE", claimed_cents: 600000 }, { code: "EMPLOYEE_DISCOUNT", claimed_cents: 300000 } ] }
              as: TenantUser
              as_user_id: "${tenant_id}"
          assert:
            - "SalesReport.${r1_id}.allowed_exclusions_cents == 3000000"
            - "SalesReport.${r1_id}.net_sales_cents == 17000000"
            - "SalesReport.${r1_id}.status == SUBMITTED"
            - "GET /retail/sales-reports/${r1_id}/exclusions returns 3 rows; the RETURNS_AND_ALLOWANCES row has allowed_cents == 2250000 and status == PARTIALLY_ALLOWED"
            - "The GIFT_CARD_ISSUANCE row has allowed_cents == 500000 and status == PARTIALLY_ALLOWED"
            - "The EMPLOYEE_DISCOUNT row has allowed_cents == 250000 and status == PARTIALLY_ALLOWED"

      - name: annual_true_up_sum_then_round_versus_round_per_period_mode_b
        grounds:
          - calculations.annual_true_up
          - calculations.percentage_rent_charge
          - entities.LeaseYear.fields.true_up_delta_cents
          - state_machines.LeaseYear.RECONCILING_to_RECONCILED
        distinguishing_aspect: |
          Mode (b): four quarters of 15,000,005 net sales bill 300,000 each after per-period
          rounding (1,200,000 total), while the annual recompute sums the exact cents first
          (60,000,020) and rounds once to 1,200,001 - so the pinned SUM-THEN-ROUND order yields
          a true_up_delta_cents of exactly 1, a value no ROUND-THEN-SUM implementation can hit.
        test_recipe:
          setup:
            - "One ACTIVE lease with billing_mode PERIOD_STANDALONE, reporting_frequency QUARTERLY, ARTIFICIAL breakpoint 40000000 and percentage_rate_bps 600."
            - "LeaseYear 1 spans 2026-09-01 to 2027-09-01 with four ACCEPTED quarterly reports of 15,000,005 gross and no exclusions."
            - "Each quarter was billed round_half_up((15000005 - 10000000) * 600 / 10000) = 300000, so cumulative_billed_cents is 1200000."
            - "The lease year has been closed for reconciliation (status RECONCILING)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
            - call: "POST /retail/centers"
              payload: { name: "Northgate Commons", code: "NGC", total_gla_sqft: 400000, anchor_gla_sqft: 200000 }
              as: CenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /retail/tenants"
              payload: { center_id: "${center_id}", legal_name: "Quarterly Goods LLC", trade_name: "QGoods", category: "INLINE", gla_sqft: 4000 }
              as: CenterAdmin
              captures: { tenant_id: $.data.id }
            - call: "POST /retail/leases"
              payload: { center_id: "${center_id}", tenant_id: "${tenant_id}", suite_code: "301", leased_sqft: 4000, annual_base_rent_cents: 12000000, percentage_rate_bps: 600, breakpoint_type: "ARTIFICIAL", artificial_breakpoint_cents: 40000000, billing_mode: "PERIOD_STANDALONE", reporting_frequency: "QUARTERLY", reporting_deadline_days: 10, exclusion_profile: "STANDARD" }
              as: CenterAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /retail/leases/${lease_id}/activate"
              payload: {}
              as: CenterAdmin
            - call: "POST /retail/leases/${lease_id}/lease-years"
              payload: { year_index: 1, period_start: "2026-09-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { ly_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { q1_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2026-12-01T00:00:00Z", period_end: "2027-03-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { q2_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2027-03-01T00:00:00Z", period_end: "2027-06-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { q3_id: $.data.id }
            - call: "POST /retail/lease-years/${ly_id}/sales-reports"
              payload: { period_start: "2027-06-01T00:00:00Z", period_end: "2027-09-01T00:00:00Z" }
              as: LeaseAdministrator
              captures: { q4_id: $.data.id }
            - call: "POST /retail/sales-reports/${q1_id}/submit"
              payload: { gross_sales_cents: 15000005 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "POST /retail/sales-reports/${q1_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${q2_id}/submit"
              payload: { gross_sales_cents: 15000005 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "POST /retail/sales-reports/${q2_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${q3_id}/submit"
              payload: { gross_sales_cents: 15000005 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "POST /retail/sales-reports/${q3_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/sales-reports/${q4_id}/submit"
              payload: { gross_sales_cents: 15000005 }
              as: TenantUser
              as_user_id: "${tenant_id}"
            - call: "POST /retail/sales-reports/${q4_id}/accept"
              payload: {}
              as: LeaseAdministrator
            - call: "POST /retail/lease-years/${ly_id}/close-period"
              payload: {}
              as: LeaseAdministrator
          trigger:
