            - call: "POST /nature-center/training-records/${tr_id}/assess"
              payload: { outcome: "FAIL", score: 55 }
              as: CurriculumSpecialist
              as_user_id: "cs-02"
              captures: { n2: $.data.attempt_count }
            - call: "POST /nature-center/training-records/${tr_id}/reenroll"
              payload: {}
