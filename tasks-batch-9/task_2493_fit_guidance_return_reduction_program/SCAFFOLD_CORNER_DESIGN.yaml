# ===========================================================================
# 1.9 Scaffold Corner Design (Breadth Probe)
# Task 2493 - Fit Guidance & Return Reduction Program
# Walked from references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs (no test_recipe) naming that instance.
# Every numeric literal in `assert:` was computed against §1.3's formulas and
# constants. Shared fixture conventions match §1.8: the logical clock is set
# explicitly as the first call, FitAnalyst acts as "analyst-7", ReturnsAuditor
# operators are "auditor-1" (classify), "auditor-2" (resolve), "auditor-3"
# (void), VendorUser acts as `${vendor_id}` and Customer as `${customer_id}`,
# and every negative trigger captures `err_id: $.data.error_id`.
# ===========================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: vendor_creation_returns_declared_fields_with_computed_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /fit-program/vendors]
          - entities.Vendor.fields.correction_spend_cents
          - entities.Vendor.fields.correction_round_count
          - entities.Vendor.fields.quality_chargeback_count
          - entities.Vendor.fields.reliability_score_bp
          - entities.Vendor.fields.status
        distinguishing_aspect: |
          A freshly registered Vendor returns 201 with every §1.1 field populated: the three
          input fields echoed, all four computed counters at their declared defaults
          (correction_spend_cents 0, correction_round_count 0, quality_chargeback_count 0,
          reliability_score_bp 10000), status ACTIVE, and version 1 - no penalty has been
          applied because no correction round or chargeback exists yet.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id, v_ver: $.data.version }
            - call: "GET /fit-program/vendors/${vendor_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { read_brand: $.data.brand_code }
          assert:
            - "Vendor.${vendor_id}.name == \"Northwind Apparel\""
            - "Vendor.${vendor_id}.brand_code == \"NRTH\""
            - "Vendor.${vendor_id}.correction_budget_cents == 250000"
            - "Vendor.${vendor_id}.correction_spend_cents == 0"
            - "Vendor.${vendor_id}.correction_round_count == 0"
            - "Vendor.${vendor_id}.quality_chargeback_count == 0"
            - "Vendor.${vendor_id}.reliability_score_bp == 10000"
            - "Vendor.${vendor_id}.status == \"ACTIVE\""
            - "${v_ver} == 1"
            - "Vendor.${vendor_id}.created_at == \"2026-06-01T00:00:00Z\""
            - "Vendor.${vendor_id}.updated_at == \"2026-06-01T00:00:00Z\""
            - "${read_brand} == \"NRTH\""

      - name: catalog_item_creation_defaults_both_state_axes_and_pdp_fields
        claim_type: defaults
        grounds:
          - endpoints[POST /fit-program/catalog-items]
          - entities.CatalogItem.fields.listing_status
          - entities.CatalogItem.fields.fit_readiness
          - entities.CatalogItem.fields.fit_watch_state
          - entities.CatalogItem.fields.model_measurements_published
          - entities.CatalogItem.fields.detail_image_count
          - entities.CatalogItem.fields.pdp_review_required
          - entities.CatalogItem.fields.delist_reason_code
        distinguishing_aspect: |
          Omitting every optional product-page field on item creation applies the declared
          defaults on BOTH state axes independently (listing_status DRAFT, fit_readiness
          UNVERIFIED) plus fit_watch_state NORMAL, model_measurements_published false,
          model_height_cm null, model_worn_size_label null, detail_image_count 0,
          pdp_review_required false and delist_reason_code null.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "One Vendor NRTH exists; no items yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id, i_ver: $.data.version }
          assert:
            - "CatalogItem.${item_id}.listing_status == \"DRAFT\""
            - "CatalogItem.${item_id}.fit_readiness == \"UNVERIFIED\""
            - "CatalogItem.${item_id}.fit_watch_state == \"NORMAL\""
            - "CatalogItem.${item_id}.model_measurements_published == false"
            - "CatalogItem.${item_id}.model_height_cm == null"
            - "CatalogItem.${item_id}.model_worn_size_label == null"
            - "CatalogItem.${item_id}.detail_image_count == 0"
            - "CatalogItem.${item_id}.pdp_review_required == false"
            - "CatalogItem.${item_id}.delist_reason_code == null"
            - "CatalogItem.${item_id}.units_sold_count == 0"
            - "CatalogItem.${item_id}.total_return_count == 0"
            - "CatalogItem.${item_id}.return_cost_accrued_cents == 0"
            - "CatalogItem.${item_id}.fit_signal_weight_total == 0"
            - "CatalogItem.${item_id}.active_fit_feedback_count == 0"
            - "${i_ver} == 1"

      - name: catalog_item_list_filters_by_vendor_and_listing_axis_with_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /fit-program/catalog-items]
          - entities.CatalogItem.fields.listing_status
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three items of one vendor of which exactly two are LISTED, the filtered list
          returns total_count 2 for the LISTED filter, and limit 1 / offset 0 yields one row
          with has_more true while offset 1 yields the other row with has_more false - the
          DRAFT item is never in either page.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with three TOPS items; items 1 and 2 are LISTED, item 3 stays DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_1_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_1_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-02", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2495 }
              as: MerchOpsAdmin
              captures: { item_2_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_2_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-03", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2695 }
              as: MerchOpsAdmin
              captures: { item_3_id: $.data.id }
          trigger:
            - call: "GET /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", listing_status: "LISTED", limit: 1, offset: 0 }
              as: MerchOpsAdmin
              captures:
                p1_total: $.total_count
                p1_has_more: $.has_more
                p1_limit: $.limit
                p1_offset: $.offset
                p1_first_id: $.data[0].id
            - call: "GET /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", listing_status: "LISTED", limit: 1, offset: 1 }
              as: MerchOpsAdmin
              captures:
                p2_total: $.total_count
                p2_has_more: $.has_more
                p2_first_id: $.data[0].id
            - call: "GET /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", fit_readiness: "UNVERIFIED", limit: 10, offset: 0 }
              as: MerchOpsAdmin
              captures: { p3_total: $.total_count, p3_has_more: $.has_more }
          assert:
            - "${p1_total} == 2"
            - "${p1_has_more} == true"
            - "${p1_limit} == 1"
            - "${p1_offset} == 0"
            - "${p2_total} == 2"
            - "${p2_has_more} == false"
            - "${p1_first_id} != ${p2_first_id}"
            - "${p1_first_id} != \"${item_3_id}\""
            - "${p2_first_id} != \"${item_3_id}\""
            - "${p3_total} == 3"
            - "${p3_has_more} == false"

      - name: measurement_spec_read_with_unknown_id_returns_spec_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_SPEC_NOT_FOUND]
          - endpoints[GET /fit-program/measurement-specs/{id}]
        distinguishing_aspect: |
          A GET on /fit-program/measurement-specs/{id} with an unallocated UUID returns 404
          ERR_SPEC_NOT_FOUND - the entity-specific code from priority 3's list, not the generic
          ERR_ITEM_NOT_FOUND - even though other rows (a Vendor) do exist in the database.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; one Vendor exists so the database is not empty, but no MeasurementSpec has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "GET /fit-program/measurement-specs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == \"ERR_SPEC_NOT_FOUND\""
            - "http_status == 404"
            - "response_type == \"error\""

      - name: measurement_spec_without_base_size_label_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.MeasurementSpec.fields.base_size_label
        distinguishing_aspect: |
          POST /fit-program/measurement-specs with size_points and grade_rules present but the
          required base_size_label omitted returns 400 ERR_INVALID_REQUEST and writes no
          MeasurementSpec row, so a follow-up filtered list for the item returns total_count 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one DRAFT TOPS item and no specification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /fit-program/measurement-specs"
              payload:
                item_id: "${item_id}"
                size_system: "US_ALPHA"
                fabric_stretch_class: "RIGID"
                size_points:
                  - { size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }
                  - { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }
                grade_rules:
                  - { measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", limit: 10, offset: 0 }
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { spec_total: $.total_count }
          assert:
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "http_status == 400"
            - "${spec_total} == 0"

      - name: catalog_item_with_undeclared_category_code_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
          - entities.CatalogItem.fields.category_code
        distinguishing_aspect: |
          category_code "SWIMWEAR" is not one of the five declared enum members
          (TOPS|BOTTOMS|DRESSES|OUTERWEAR|FOOTWEAR), so item creation returns 400
          ERR_INVALID_REQUEST rather than being coerced or stored.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; Vendor NRTH exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-SWM-01", category_code: "SWIMWEAR", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", limit: 10, offset: 0 }
              as: MerchOpsAdmin
              captures: { item_total: $.total_count }
          assert:
            - "${err_id} == \"ERR_INVALID_REQUEST\""
            - "http_status == 400"
            - "${item_total} == 0"

      - name: order_line_gross_line_cents_computed_from_price_times_quantity
        claim_type: computed_fields
        grounds:
          - entities.OrderLine.fields.gross_line_cents
          - endpoints[POST /fit-program/order-lines]
          - calculations.item_chronic_return_score
          - calculations.customer_abuse_and_policy_class
        distinguishing_aspect: |
          quantity 3 at unit_price_cents 2295 stores gross_line_cents 6885 (3 * 2295) on the
          line and simultaneously advances the item's units_sold_count to 3 and the purchaser's
          purchase_line_count to 1, while the item's rates stay 0 because no return exists.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; one shopper profile."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-c6@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
          trigger:
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 3, unit_price_cents: 2295, shipping_allocated_cents: 495, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id, gross: $.data.gross_line_cents, line_status: $.data.status }
          assert:
            - "${gross} == 6885"
            - "${line_status} == \"DELIVERED\""
            - "OrderLine.${line_id}.shipping_allocated_cents == 495"
            - "CatalogItem.${item_id}.units_sold_count == 3"
            - "CatalogItem.${item_id}.fit_return_rate_bp == 0"
            - "CatalogItem.${item_id}.expectation_return_rate_bp == 0"
            - "CatalogItem.${item_id}.chronic_return_score_bp == 0"
            - "CatalogItem.${item_id}.fit_watch_state == \"NORMAL\""
            - "CustomerProfile.${customer_id}.purchase_line_count == 1"
            - "CustomerProfile.${customer_id}.return_case_count == 0"
            - "CustomerProfile.${customer_id}.return_rate_bp == 0"

      - name: customer_profile_tier_default_drives_standard_policy_class
        claim_type: defaults
        grounds:
          - entities.CustomerProfile.fields.tier
          - entities.CustomerProfile.fields.policy_class
          - entities.CustomerProfile.fields.abuse_status
          - calculations.customer_abuse_and_policy_class
        distinguishing_aspect: |
          Omitting tier stores STANDARD and derives policy_class STANDARD_WINDOW, while an
          explicit tier PLUS on an otherwise identical creation derives EXTENDED_WINDOW - the
          same abuse_status CLEAR produces two different policy classes purely from tier.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "std-c7@example.com" }
              as: MerchOpsAdmin
              captures: { std_id: $.data.id, std_tier: $.data.tier, std_class: $.data.policy_class }
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "plus-c7@example.com", tier: "PLUS" }
              as: MerchOpsAdmin
              captures: { plus_id: $.data.id, plus_tier: $.data.tier, plus_class: $.data.policy_class }
          assert:
            - "${std_tier} == \"STANDARD\""
            - "${std_class} == \"STANDARD_WINDOW\""
            - "CustomerProfile.${std_id}.abuse_status == \"CLEAR\""
            - "CustomerProfile.${std_id}.abuse_strike_count == 0"
            - "CustomerProfile.${std_id}.refunded_total_cents == 0"
            - "${plus_tier} == \"PLUS\""
            - "${plus_class} == \"EXTENDED_WINDOW\""
            - "CustomerProfile.${plus_id}.abuse_status == \"CLEAR\""

      - name: return_cost_postings_are_append_only_rows_without_a_version_field
        claim_type: immutability
        grounds:
          - entities.ReturnCostPosting.fields.posting_kind
          - entities.ReturnCostPosting.fields.amount_cents
          - endpoints[GET /fit-program/return-cases/{id}/cost-postings]
          - calculations.return_case_cost_postings
        distinguishing_aspect: |
          ReturnCostPosting is declared common_fields: false, so §1.5 exposes only a read of the
          ledger: resolving a FIT case on a 2295-cent line writes exactly five ORIGINAL rows in
          component order (795, 558, 34, 0, 67 = 1454) and no endpoint in §1.5 can update or
          delete any of them, nor do they carry a version field.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item priced 2295; TOPS category default policy, 30-day window, refundable shipping."
            - "One shopper with a single delivered line of quantity 1 (gross 2295) whose FIT return case is resolved RESELLABLE_A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-c9@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /fit-program/return-cases/${case_id}/classify"
              payload: { reason_code: "FIT_TOO_SMALL" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures: { total_cost: $.data.total_cost_cents, refund: $.data.refund_amount_cents }
          trigger:
            - call: "GET /fit-program/return-cases/${case_id}/cost-postings"
              payload: {}
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures:
                p0_component: $.data[0].component
                p0_amount: $.data[0].amount_cents
                p0_kind: $.data[0].posting_kind
                p1_component: $.data[1].component
                p1_amount: $.data[1].amount_cents
                p4_component: $.data[4].component
                p4_amount: $.data[4].amount_cents
          assert:
            - "count(ReturnCostPosting where return_case_id == ${case_id}) == 5"
            - "${p0_component} == \"FREIGHT_INBOUND\""
            - "${p0_amount} == 795"
            - "${p0_kind} == \"ORIGINAL\""
            - "${p1_component} == \"PROCESSING_LABOR\""
