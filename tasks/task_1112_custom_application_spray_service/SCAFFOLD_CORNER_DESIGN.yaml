        excluded_because:
          difficulty_instance: boundary_precision_check / wind_exactly_at_envelope_max_passes
          rationale: "These codes are asserted as error paths across the Rule-5/6/7/8/9 difficulty instances (weather/REI/overlap/prescription-state/rinsate-overflow/invalid-state); all remaining catalog codes get their trigger in the validations section of this file."

  # ===================================================== state_machines =====
  - section: state_machines
    instances:
      - name: pass_calibration_restores_equipment
        claim_type: valid_transition
        grounds: [state_machines.Equipment.CALIBRATION_DUE_to_AVAILABLE, calculations.calibration_verdict]
        distinguishing_aspect: "Equipment machine closes its loop: after a FAIL marks the unit CALIBRATION_DUE, a later PASS restores AVAILABLE and refreshes calibration_valid_until to the new performed_at + 180 days."
        test_recipe:
          setup: ["applicator AP1; equipment EQ1 with a PASS at default clock (valid until 2026-10-28T00:00:00Z), then a FAIL marking it CALIBRATION_DUE; clock advanced to 2026-06-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 22.0 }, as: Applicator, as_user_id: "${ap}", captures: { v_fail: $.data.verdict } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: CoopAdmin }
          trigger:
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.4 }, as: Applicator, as_user_id: "${ap}", captures: { v_pass: $.data.verdict } }
            - { call: "GET /api/equipment/${eq}", as: CoopAdmin, captures: { eq_st: $.data.status, eq_valid: $.data.calibration_valid_until } }
          assert:
            - "FAIL record verdict == FAIL; recovery record verdict == PASS (2.0% error)"
            - "Equipment.${eq}.status == AVAILABLE again"
            - "Equipment.${eq}.calibration_valid_until == 2026-11-28T00:00:00Z (new performed_at 2026-06-01 + 180 days)"

