# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Visitor Management & Lobby Check-In — Expert band
# Breadth probe across §1.1-§1.7 claim surface (claim-extraction-guide taxonomy)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_site_returns_201_with_computed_badge_fields
        claim_type: Creation
        grounds: [entities.Site, endpoints]
        distinguishing_aspect: "POST /sites with name+badge_total → 201; badge_in_use=0, badge_available==badge_total, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 7 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
          assert:
            - "Site.${site_id}.badge_in_use == 0"
            - "Site.${site_id}.badge_available == 7"
            - "Site.${site_id}.version == 1"

      - name: get_visit_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Visit, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /visits/{nonexistent-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /visits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_visit_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Visit.fields.visitor_full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /visits omitting visitor_full_name → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A Site, Floor, Host exist."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_company: "ACo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z" }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_host_default_department_facilities
        claim_type: Defaults
        grounds: [entities.Host.fields.department]
        distinguishing_aspect: "POST /hosts omitting department → department defaults to FACILITIES."
        test_recipe:
          setup: ["A Site exists."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
          assert:
            - "Host.${host_id}.department == FACILITIES"
            - "Host.${host_id}.notify_count == 0"

      - name: create_site_negative_badge_total_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Site.fields.badge_total, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /sites with badge_total=-1 violates '>= 0' constraint → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: -1 }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_visit_bad_carrier_enum_on_delivery_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.DeliveryLog.fields.carrier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /deliveries with carrier='OWL_POST' (not in enum) → ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A Site and Host exist."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /deliveries"
              payload: { host_id: "${host_id}", carrier: "OWL_POST", parcel_fees_cents: [100] }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_floor_with_nonexistent_site_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Floor.fields.site_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /floors with a site_id that does not exist → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /floors"
              payload: { site_id: "00000000-0000-4000-8000-000000000000", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: list_visits_pagination_envelope
        claim_type: Listing
        grounds: [entities.Visit, endpoints]
        distinguishing_aspect: "GET /visits returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["A Site, Floor, Host and two PREREGISTERED visits exist."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "V One", visitor_company: "OneCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "V Two", visitor_company: "TwoCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
          trigger:
            - call: "GET /visits"
              payload: { limit: 1, offset: 0, host_id: "${host_id}" }
              as: LobbyAttendant
          assert:
            - "response meta has total_count == 2"
            - "response has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sign_out_from_preregistered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /visits/{id}/sign-out on a PREREGISTERED visit → ERR_INVALID_STATE; no badge/floor change."
        test_recipe:
          setup: ["A Site, Floor, Host and one PREREGISTERED visit."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Pre Reg", visitor_company: "PreCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/sign-out"
              payload: {}
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Visit.${visit_id}.status == PREREGISTERED"

      - name: revoke_then_suspend_terminal_lockdown_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ContractorPass, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After a ContractorPass is REVOKED (terminal), POST /suspend → ERR_INVALID_STATE."
        test_recipe:
          setup: ["A Site, Host and a REVOKED ContractorPass."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /contractor-passes"
              payload: { host_id: "${host_id}", contractor_name: "Pat Builder", contractor_company: "BuildCo", access_valid_from: "2026-06-01T00:00:00Z", access_valid_until: "2026-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { pass_id: $.data.id }
            - call: "POST /contractor-passes/${pass_id}/revoke"
              payload: {}
              as: SecurityOfficer
          trigger:
            - call: "POST /contractor-passes/${pass_id}/suspend"
              payload: {}
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ContractorPass.${pass_id}.status == REVOKED"

      - name: new_visit_starts_in_preregistered
        claim_type: Initial State
        grounds: [state_machines.Visit]
        distinguishing_aspect: "A freshly created Visit has status PREREGISTERED and risk_score 0."
        test_recipe:
          setup: ["A Site, Floor, Host exist."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
          trigger:
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Fresh V", visitor_company: "FreshCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
          assert:
            - "Visit.${visit_id}.status == PREREGISTERED"
            - "Visit.${visit_id}.risk_score == 0"

      - name: sign_in_idempotency_second_attempt_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Visit.SIGNED_IN_to_SIGNED_OUT, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling sign-in twice on the same visit: second call (visit now SIGNED_IN) → ERR_INVALID_STATE; occupancy not double-counted."
        test_recipe:
          setup: ["A Site (badge_total 5), Floor (capacity 5), Host; one SIGNED_IN visit, clock set."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Once In", visitor_company: "OnceCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
            - call: "GET /floors/${floor_id}"
              payload: {}
              as: LobbyAttendant
              captures: { floor_v1: $.data.version }
          trigger:
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v1}" }
              as: LobbyAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Floor.${floor_id}.current_occupancy == 1"

      - name: clear_clean_visit_from_screening_auto_advances
        claim_type: Valid Transition
        grounds: [state_machines.Visit.SCREENING_to_CLEARED]
        distinguishing_aspect: "Screening a visit with no matching watchlist entries auto-advances SCREENING→CLEARED with risk_score 0."
        test_recipe:
          setup: ["A Site, Floor, Host; no watchlist entries; one PREREGISTERED visit id_scanned true."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Clean V", visitor_company: "CleanCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.status == CLEARED"
            - "Visit.${visit_id}.risk_score == 0"

      - name: clearance_clear_flagged_visit_by_officer_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Visit.FLAGGED_to_CLEARED]
        distinguishing_aspect: "A SecurityOfficer (not the host) clears a FLAGGED visit with CLEAR → status CLEARED; Visit.version increments."
        test_recipe:
          setup: ["A Site, Floor, Host; one active COMPANY REVIEW watchlist entry; a visit FLAGGED on screen."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /watchlist-entries"
              payload: { site_id: "${site_id}", match_type: "COMPANY", match_value_normalized: "acme corp", severity: "REVIEW", active: true }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Rev Visitor", visitor_company: "Acme Corp", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
              captures: { visit_v: $.data.version }
          trigger:
            - call: "POST /visits/${visit_id}/clearance"
              payload: { decision: "CLEAR", expected_visit_version: "${visit_v}" }
              as: SecurityOfficer
              as_user_id: "officer-1"
          assert:
            - "Visit.${visit_id}.status == CLEARED"

      - name: deny_visit_cascades_pending_agreement_void
        claim_type: side_effect_compensation
        grounds: [state_machines.Visit.SCREENING_to_DENIED, state_machines.Agreement.PENDING_to_VOID]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_screen_deny_voids_agreement_depth3
          rationale: "The cascade that voids the PENDING agreement on Visit DENIED is asserted by the named §1.8 depth-3 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: visit_duration_91_minutes_round_up
        claim_type: Correct Result
        grounds: [calculations.visit_duration]
        distinguishing_aspect: "Sign in 09:00:00 then sign out 10:31:00 (5460s) → visit_duration_minutes == 91 (exact, ceil)."
        test_recipe:
          setup: ["A Site (badge_total 5), Floor (capacity 5), Host; visit signed in at 09:00:00, clock moved to 10:31:00 before sign-out."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", visitor_full_name: "Dur V", visitor_company: "DurCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T11:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${visit_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T10:31:00Z" }
              as: SecurityOfficer
          trigger:
            - call: "POST /visits/${visit_id}/sign-out"
              payload: {}
              as: LobbyAttendant
          assert:
            - "Visit.${visit_id}.visit_duration_minutes == 91"

      - name: contractor_billing_total_across_two_signed_out_visits
        claim_type: Correct Result
        grounds: [calculations.contractor_billing_total, entities.Visit.fields.contractor_pass_id]
        distinguishing_aspect: "Two SIGNED_OUT covered visits of 91 min (200c) and 300 min (1100c) → billing_total_cents == 1300."
        test_recipe:
          setup:
            - "A Site (badge_total 5), Floor (capacity 5), Host, ACTIVE ContractorPass."
            - "Visit A covered, signed in 09:00:00 then out 10:31:00 (91 min)."
            - "Visit B covered, signed in 09:00:00 then out 14:00:00 (300 min)."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "HQ", badge_total: 5 }
              as: SecurityOfficer
              captures: { site_id: $.data.id }
            - call: "POST /floors"
              payload: { site_id: "${site_id}", label: "L3", capacity: 5 }
              as: SecurityOfficer
              captures: { floor_id: $.data.id, floor_v0: $.data.version }
            - call: "POST /hosts"
              payload: { site_id: "${site_id}", full_name: "Dana Host", email: "dana@x.com" }
              as: SecurityOfficer
              captures: { host_id: $.data.id }
            - call: "POST /contractor-passes"
              payload: { host_id: "${host_id}", contractor_name: "Pat Builder", contractor_company: "BuildCo", access_valid_from: "2026-06-01T00:00:00Z", access_valid_until: "2026-12-31T23:59:59Z" }
              as: SecurityOfficer
              captures: { pass_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T09:00:00Z" }
              as: SecurityOfficer
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", contractor_pass_id: "${pass_id}", visitor_full_name: "Pat Builder", visitor_company: "BuildCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T15:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_a_id: $.data.id }
            - call: "POST /visits/${v_a_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${v_a_id}/sign-in"
              payload: { expected_floor_version: "${floor_v0}" }
              as: LobbyAttendant
            - call: "GET /floors/${floor_id}"
              payload: {}
              as: LobbyAttendant
              captures: { floor_v1: $.data.version }
            - call: "POST /visits"
              payload: { site_id: "${site_id}", host_id: "${host_id}", floor_id: "${floor_id}", contractor_pass_id: "${pass_id}", visitor_full_name: "Pat Builder", visitor_company: "BuildCo", scheduled_start: "2026-06-16T09:00:00Z", scheduled_end: "2026-06-16T15:00:00Z", id_scanned: true }
              as: LobbyAttendant
              captures: { v_b_id: $.data.id }
            - call: "POST /visits/${v_b_id}/screen"
              payload: {}
              as: LobbyAttendant
            - call: "POST /visits/${v_b_id}/sign-in"
              payload: { expected_floor_version: "${floor_v1}" }
              as: LobbyAttendant
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-16T10:31:00Z" }
              as: SecurityOfficer
