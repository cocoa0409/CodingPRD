      - name: request_state_not_eligible_beats_referential_outside_service_area
        grounds:
          - "validations[priority=7]"
          - "validations[priority=12]"
          - "errors[ERR_RIDER_NOT_ELIGIBLE]"
          - "errors[ERR_OUTSIDE_SERVICE_AREA]"
          - entities.Rider.fields.eligibility_status
        distinguishing_aspect: |
          On one trip request by an UNCERTIFIED rider (state, priority 7) with an out-of-service-area pickup
          (business_referential, priority 12), ERR_RIDER_NOT_ELIGIBLE wins — category pair {state,
          business_referential}, a different pair than instance 1's {business_safety, business_constraint}.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Rider registered but never certified (eligibility_status UNCERTIFIED)."
            - "Pickup coords 41.0,-74.0 are ~69 miles from the ZA center, far outside the 0.75-mile radius."
