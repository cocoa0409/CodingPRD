# =============================================================================
# task_0532_utility_locate — §1.9 Scaffold Corner Design (breadth probe)
# Walks references/claim-extraction-guide.md against §1.1–§1.7.
# All setup_api_calls/trigger chains use only §1.5 endpoints.
# Clock default before any set_current_utc is 2026-05-01T00:00:00Z (Fri).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_locate_ticket_returns_201_with_intake_defaults
        claim_type: Creation
        grounds:
          - entities.LocateTicket.fields.status
          - entities.LocateTicket.fields.response_posture
        distinguishing_aspect: "POST /locate-tickets with all required fields -> 201; status=INTAKE, response_posture=INTAKE, is_white_lined defaults false, version=1."
        test_recipe:
          setup:
            - "One excavator registered."
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c1@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "trench" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id, st: $.data.status, wl: $.data.is_white_lined, v: $.data.version }
          assert:
            - "response.status == 201"
            - "LocateTicket.${tid}.status == 'INTAKE'"
            - "LocateTicket.${tid}.response_posture == 'INTAKE'"
            - "LocateTicket.${tid}.is_white_lined == false"
            - "LocateTicket.${tid}.version == 1"

      - name: get_locate_ticket_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_TICKET_NOT_FOUND]"]
        distinguishing_aspect: "GET /locate-tickets/{random-uuid} -> ERR_TICKET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB except one excavator for auth identity."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c2@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
          trigger:
            - call: "GET /locate-tickets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == 'ERR_TICKET_NOT_FOUND'"

      - name: create_ticket_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /locate-tickets missing ticket_type -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One excavator."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c3@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "no type" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: invalid_dig_polygon_geometry_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_GEOMETRY]"]
        distinguishing_aspect: "POST /locate-tickets with dig_polygon max_x<=min_x -> ERR_INVALID_GEOMETRY (422)."
        test_recipe:
          setup: ["One excavator."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c4@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 20, min_y: 10, max_x: 20, max_y: 20 }, work_description: "degenerate box" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == 'ERR_INVALID_GEOMETRY'"

      - name: create_ticket_missing_excavator_fk_returns_404
        claim_type: Parent Relationships
        grounds: ["errors[ERR_EXCAVATOR_NOT_FOUND]"]
        distinguishing_aspect: "POST /locate-tickets with non-existent excavator_id -> ERR_EXCAVATOR_NOT_FOUND (404)."
        test_recipe:
          setup: ["One excavator (only for auth identity)."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c5@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /locate-tickets"
              payload: { excavator_id: "11111111-1111-4111-8111-111111111111", ticket_type: "NORMAL", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "bad fk" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == 'ERR_EXCAVATOR_NOT_FOUND'"

      - name: list_tickets_pagination_envelope
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /locate-tickets returns response_type=array with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["One excavator, two INTAKE tickets."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c6@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 1, min_y: 1, max_x: 2, max_y: 2 }, work_description: "t1" }
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "NORMAL", dig_polygon: { min_x: 1, min_y: 1, max_x: 2, max_y: 2 }, work_description: "t2" }
              as: Excavator
              as_user_id: "${exc_id}"
          trigger:
            - call: "GET /locate-tickets"
              payload: { excavator_id: "${exc_id}", limit: 1, offset: 0 }
              as: Excavator
              as_user_id: "${exc_id}"
          assert:
            - "response.response_type == 'array'"
            - "response.data length == 1 and total_count == 2 and has_more == true"

      - name: computed_liability_input_ignored_on_create
        claim_type: Computed Fields
        grounds: [entities.DamageReport.fields.excavator_liability_cents]
        distinguishing_aspect: "excavator_liability_cents is source:computed; not accepted as input on POST /damage-reports (unknown field rejected) and remains unset until review."
        test_recipe:
          setup: ["One excavator, one member, one ticket."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c7@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /damage-reports"
              payload: { ticket_id: "${tid}", member_utility_id: "${mem_id}", repair_cost_cents: 5000, dug_within_marks: false }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { dr: $.data.id, st: $.data.status }
          assert:
            - "response.status == 201"
            - "DamageReport.${dr}.status == 'FILED'"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_ticket_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LocateTicket.INTAKE_to_SUBMITTED, "errors[ERR_TICKET_NOT_IN_INTAKE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED ticket -> ERR_TICKET_NOT_IN_INTAKE (409); no new notifications created."
        test_recipe:
          setup: ["Submitted ticket."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c8@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
          trigger:
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_TICKET_NOT_IN_INTAKE'"

      - name: cancel_closed_ticket_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.LocateTicket.INTAKE_to_CANCELLED, "errors[ERR_TICKET_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling a MARKED/CLOSED ticket -> ERR_TICKET_NOT_CANCELLABLE (409); cancel only from INTAKE/SUBMITTED."
        test_recipe:
          setup: ["Ticket advanced to MARKED (past cancellable states)."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c9@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${tid}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${tid}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${tid}", marks_count: 2 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk_id: $.data.id }
            - call: "POST /mark-outs/${mk_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /locate-tickets/${tid}/cancel"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_TICKET_NOT_CANCELLABLE'"

      - name: assignment_en_route_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LocateAssignment.DISPATCHED_to_EN_ROUTE, "errors[ERR_ASSIGNMENT_NOT_DISPATCHED]"]
        distinguishing_aspect: "en-route on a COMPLETED assignment -> ERR_ASSIGNMENT_NOT_DISPATCHED (409)."
        test_recipe:
          setup: ["Assignment fully COMPLETED (ticket MARKED)."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c10@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${tid}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${tid}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${tid}", marks_count: 2 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk_id: $.data.id }
            - call: "POST /mark-outs/${mk_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /locate-assignments/${asg_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_ASSIGNMENT_NOT_DISPATCHED'"

      - name: assignment_breached_on_clock_advance_past_deadline
        claim_type: Side Effect Execution
        grounds: [state_machines.LocateAssignment.DISPATCHED_to_BREACHED, entities.LocateAssignment.fields.sla_breached]
        distinguishing_aspect: "Advancing clock past sla_deadline_at auto-transitions a DISPATCHED assignment to BREACHED and sets sla_breached=true; tech.active_assignment_count decremented."
        test_recipe:
          setup: ["EMERGENCY assignment DISPATCHED at default clock; GAS member emergency_contact_minutes=60 -> high-priority ceil(60*0.5)=30 -> deadline 00:30."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c11@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 }, emergency_contact_minutes: 60 }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${tid}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${tid}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:31:00Z" }
              as: Admin
            - call: "GET /locate-assignments/${asg_id}"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { st: $.data.status, br: $.data.sla_breached }
            - call: "GET /locate-techs/${tech_id}"
              payload: {}
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { cnt: $.data.active_assignment_count }
          assert:
            - "LocateAssignment.${asg_id}.status == 'BREACHED'"
            - "LocateAssignment.${asg_id}.sla_breached == true"
            - "LocateTech.${tech_id}.active_assignment_count == 0"

      - name: ticket_expired_on_clock_past_dig_window
        claim_type: Side Effect Execution
        grounds: [state_machines.LocateTicket.MARKED_to_EXPIRED, entities.MarkOut.fields.status]
        distinguishing_aspect: "Advancing clock past dig_window_expires_at auto-transitions MARKED ticket -> EXPIRED and cascades the active COMPLETE MarkOut -> EXPIRED."
        test_recipe:
          setup: ["Ticket MARKED at default clock (mark completed 05-01, window expires 2026-05-22)."]
          setup_api_calls:
            - call: "POST /excavators"
              payload: { company_name: "DigCo", contact_email: "c12@x.com", state_code: "CA" }
              as: CallCenter
              captures: { exc_id: $.data.id }
            - call: "POST /member-utilities"
              payload: { name: "Gas Co", facility_type: "GAS", service_polygon: { min_x: 0, min_y: 0, max_x: 100, max_y: 100 } }
              as: CallCenter
              captures: { mem_id: $.data.id }
            - call: "POST /locate-techs"
              payload: { full_name: "Tina", member_utility_id: "${mem_id}", certified_facility_types: ["GAS"] }
              as: CallCenter
              captures: { tech_id: $.data.id }
            - call: "POST /locate-tickets"
              payload: { excavator_id: "${exc_id}", ticket_type: "EMERGENCY", dig_polygon: { min_x: 10, min_y: 10, max_x: 20, max_y: 20 }, work_description: "job" }
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tid: $.data.id }
            - call: "POST /locate-tickets/${tid}/submit"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
            - call: "GET /utility-notifications"
              payload: { ticket_id: "${tid}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { note_id: $.data.0.id }
            - call: "POST /positive-responses"
              payload: { notification_id: "${note_id}", outcome: "CLEAR" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
            - call: "POST /locate-assignments"
              payload: { ticket_id: "${tid}", notification_id: "${note_id}", locate_tech_id: "${tech_id}" }
              as: FacilityOwner
              as_user_id: "${mem_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /locate-assignments/${asg_id}/en-route"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
            - call: "POST /mark-outs"
              payload: { assignment_id: "${asg_id}", ticket_id: "${tid}", marks_count: 2 }
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mk_id: $.data.id }
            - call: "POST /mark-outs/${mk_id}/complete"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-23T00:00:00Z" }
              as: Admin
            - call: "GET /locate-tickets/${tid}"
              payload: {}
              as: Excavator
              as_user_id: "${exc_id}"
              captures: { tst: $.data.status }
            - call: "GET /mark-outs/${mk_id}"
              payload: {}
              as: LocateTech
              as_user_id: "${tech_id}"
              captures: { mst: $.data.status }
          assert:
            - "LocateTicket.${tid}.status == 'EXPIRED'"
            - "MarkOut.${mk_id}.status == 'EXPIRED'"

      - name: close_ticket_after_dig_window_expired_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.LocateTicket.MARKED_to_CLOSED, "errors[ERR_DIG_WINDOW_EXPIRED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / sla_breach_at_exact_due_instant_ticket_expiry
