  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: grace_period_blocks_new_placement_but_still_permits_delivery_of_confirmed_order
        grounds:
          - validations[priority=9]
          - state_machines.BenefitPeriod.OPEN_to_GRACE
          - state_machines.Order.CONFIRMED_to_DELIVERED
          - errors.ERR_PERIOD_NOT_OPEN
        distinguishing_aspect: |
          The SAME BenefitPeriod state gates two different Order transitions in OPPOSITE directions:
          in GRACE a place is refused with ERR_PERIOD_NOT_OPEN while a deliver of an already
          CONFIRMED order still succeeds and still moves money on that very period, so GRACE cannot
          be implemented as a blanket freeze.
        test_recipe:
          setup:
            - "Program / Engineering / HQ dock / Thai Garden / Ada with an OPEN 2026-08 period."
            - "Ada's 3 x 1000 order with tip 200 for 2026-08-03 is PLACED and CONFIRMED (reserved 2500)."
            - "A second DRAFT order for 2026-08-04, so the daily meal limit of 1 is not the binding constraint."
            - "The period is then closed with mode GRACE."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /meal-programs", payload: { employer_name: "Acme Corp", billing_account_ref: "ACCT-ACME-1", eligible_cuisines: ["THAI", "SALAD", "PIZZA"], max_delivery_radius_km: 8.0 }, as: PlatformAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /meal-programs/${prog_id}/employee-groups", payload: { name: "Engineering", headcount_planned: 2 }, as: ProgramAdmin, captures: { grp_eng_id: $.data.id, grp_eng_v: $.data.version } }
            - { call: "POST /employee-groups/${grp_eng_id}/budget-rules", payload: { effective_from: "2026-08-01T00:00:00Z", per_meal_cap_cents: 2500, daily_meal_limit: 1, monthly_allocation_cents: 50000, eligible_weekdays: [1, 2, 3, 4, 5], eligible_window_start_minute: 660, eligible_window_end_minute: 840, overage_policy: "PERSONAL_CARD", tip_coverage_policy: "EMPLOYEE_PAYS_TIP" }, as: BenefitsController, as_user_id: "ctrl-drafter", captures: { rule_eng_id: $.data.id } }
            - { call: "POST /budget-rules/${rule_eng_id}/activate", payload: { expected_employee_group_version: "${grp_eng_v}" }, as: BenefitsController, as_user_id: "ctrl-approver" }
            - { call: "POST /meal-programs/${prog_id}/delivery-locations", payload: { label: "HQ Lobby", grid_x_km: 0.0, grid_y_km: 0.0, dock_buffer_minutes: 15 }, as: ProgramAdmin, captures: { loc_hq_id: $.data.id } }
            - { call: "POST /restaurants", payload: { name: "Thai Garden", cuisine: "THAI", grid_x_km: 3.0, grid_y_km: 4.0, delivery_radius_km: 10.0, max_concurrent_group_deliveries: 1 }, as: PlatformAdmin, captures: { rest_thai_id: $.data.id } }
            - { call: "POST /employees", payload: { program_id: "${prog_id}", group_id: "${grp_eng_id}", full_name: "Ada Byron", email: "ada@acme.test", personal_card_on_file: true }, as: ProgramAdmin, captures: { emp_ada_id: $.data.id } }
            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_ada_id}", period_month: "2026-08" }, as: ProgramAdmin, captures: { per_ada_id: $.data.id, per_ada_v: $.data.version } }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-03T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 }, { item_name: "Green Curry", unit_price_cents: 1000, quantity: 1 }, { item_name: "Mango Rice", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 200 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord_inflight_id: $.data.id } }
            - { call: "POST /orders/${ord_inflight_id}/place", payload: { expected_benefit_period_version: "${per_ada_v}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord_inflight_id}/confirm", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "POST /orders", payload: { employee_id: "${emp_ada_id}", benefit_period_id: "${per_ada_id}", restaurant_id: "${rest_thai_id}", delivery_location_id: "${loc_hq_id}", requested_delivery_at: "2026-08-04T12:00:00Z", lines: [ { item_name: "Pad Thai", unit_price_cents: 1000, quantity: 1 } ], tip_cents: 0 }, as: Employee, as_user_id: "${emp_ada_id}", captures: { ord_late_id: $.data.id } }
            - { call: "POST /benefit-periods/${per_ada_id}/close", payload: { mode: "GRACE" }, as: ProgramAdmin, captures: { per_ada_v3: $.data.version } }
          trigger:
            - { call: "POST /orders/${ord_late_id}/place", payload: { expected_benefit_period_version: "${per_ada_v3}" }, as: Employee, as_user_id: "${emp_ada_id}" }
            - { call: "POST /orders/${ord_inflight_id}/deliver", as: Restaurant, as_user_id: "${rest_thai_id}" }
            - { call: "GET /benefit-periods/${per_ada_id}", as: ProgramAdmin }
          assert:
            - "the ${ord_late_id} place returns 409 with error_id ERR_PERIOD_NOT_OPEN"
            - "the ${ord_inflight_id} deliver succeeds: fulfillment_status DELIVERED, settlement_status CAPTURED"
            - "BenefitPeriod.${per_ada_id}.status == GRACE after both calls (delivery does not reopen it)"
            - "BenefitPeriod.${per_ada_id}.reserved_cents == 0 and spent_cents == 2500: the GRACE period still capitalises the delivery"
            - "an ImputedIncomeRecord for 2026-08 exists in status ACCRUING with taxable_cents 500, since GRACE is not a payroll lock"

      - name: restaurant_suspension_blocks_group_submit_and_reinstatement_unblocks_it
        grounds:
          - validations[priority=11]
          - state_machines.Restaurant.ELIGIBLE_to_SUSPENDED
          - state_machines.Restaurant.SUSPENDED_to_ELIGIBLE
          - state_machines.GroupOrder.LOCKED_to_SUBMITTED
          - errors.ERR_RESTAURANT_NOT_ELIGIBLE
        distinguishing_aspect: |
          A CYCLIC dependency entity gates a transition on a different aggregate: the same LOCKED
          group order is refused then accepted purely because Restaurant.status toggled SUSPENDED and
          back to ELIGIBLE, and the group order does not leave LOCKED during the refusal.
