            - "data.schedule_state == 'CONSTRUCTION_COMPLETE' (recompute is not a state transition)"
            - "data.version == 3 (create 1, baseline-schedule 2, recompute-schedule 3)"
            - "GET /pre-opening/milestones/${ms_cc} still returns earliest_finish_date '2026-10-01' and is_critical true"

      - name: guarantee_is_allowed_only_while_the_commercial_dimension_is_booking_open
        claim_type: conditional_action
        grounds:
          - "§1.2 ReservationBlock ACCEPTED -> GUARANTEED requires program.commercial_state == BOOKING_OPEN (else ERR_BOOKING_NOT_OPEN) and readiness_posture != FROZEN; §1.3 adds guarantee_penalty_cents to the block's contingency after the tier is selected."
        distinguishing_aspect: "The same guarantee call is refused with ERR_BOOKING_NOT_OPEN while the program is BOOKING_SUSPENDED and then succeeds unchanged after booking reopens, raising the block's contingency from 262500 to 412500 by the 150000 penalty."
