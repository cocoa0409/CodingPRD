  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: grant_budget_debit_equals_posted_charges
        grounds:
          - calculations.per_diem_billing
          - state_machines.BillingRun.FINALIZED_to_POSTED
          - entities.Grant.fields.budget_remaining_cents
        distinguishing_aspect: |
          Conserved fiscal quantity: for any grant, budget_remaining_cents ==
          budget_total_cents - sum(amount_cents over POSTED PerDiemCharge rows
          for that grant). A billing run that is finalized then voided before
          posting debits nothing — the invariant holds across forward+compensate.
        test_recipe:
          setup:
            - "Grant budget_total_cents == 500000"
            - "One mouse cage billed 2625 in run X (posted); run Y for a later period finalized then voided (compensating action)"
          setup_api_calls:
            - call: "POST /iacuc/investigators"
              payload: { full_name: "Dr. Inv", email: "inv@uni.edu", department: "Bio" }
              as: IacucAdministrator
              captures: { inv_id: $.data.id }
            - call: "POST /iacuc/grants"
              payload: { grant_number: "R01-960", investigator_id: "${inv_id}", budget_total_cents: 500000, expires_on: "2027-01-01T00:00:00Z" }
              as: IacucAdministrator
              captures: { grant_id: $.data.id }
            - call: "POST /iacuc/protocols"
              payload: { investigator_id: "${inv_id}", grant_id: "${grant_id}", title: "Inv study", species: "MOUSE", max_animals_justified: 5, pain_category: "C", review_path: "DMR" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { proto_id: $.data.id }
            - call: "POST /iacuc/protocols/${proto_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /iacuc/protocols/${proto_id}/review-decisions"
              payload:
                decisions:
                  - reviewer_kind: "DESIGNATED_MEMBER"
                    decision: "APPROVE"
              as: IacucAdministrator
            - call: "POST /iacuc/cages"
              payload: { cage_barcode: "INV-1", room_code: "VIV-701", species: "MOUSE", cage_kind: "STANDARD", capacity_adults: 5, protocol_id: "${proto_id}" }
              as: FacilityManager
              captures: { cage_id: $.data.id }
            - call: "POST /iacuc/animals"
              payload: { animal_tag: "INV-M1", cage_id: "${cage_id}", protocol_id: "${proto_id}", species: "MOUSE", date_of_birth: "2026-05-01T00:00:00Z", sex: "M" }
              as: AnimalCareStaff
            - call: "POST /iacuc/census-records"
              payload: { cage_id: "${cage_id}", census_date: "2026-08-01T00:00:00Z", physical_count: 1 }
              as: AnimalCareStaff
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-22T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_x: $.data.id }
            - call: "POST /iacuc/billing-runs/${run_x}/compute-provisional"
              payload: {}
              as: BillingCoordinator
              captures: { run_x_v: $.data.version }
            - call: "POST /iacuc/billing-runs/${run_x}/finalize"
              payload: { expected_billing_run_version: "${run_x_v}" }
              as: BillingCoordinator
            - call: "POST /iacuc/billing-runs/${run_x}/post"
              payload: {}
              as: BillingCoordinator
            - call: "POST /iacuc/billing-runs"
              payload: { period_start: "2026-08-22T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: BillingCoordinator
              captures: { run_y: $.data.id }
            - call: "POST /iacuc/census-records"
