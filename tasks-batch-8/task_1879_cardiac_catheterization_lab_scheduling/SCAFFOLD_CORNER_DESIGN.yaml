      - name: staff_deactivation_blocked_by_active_assignment
        claim_type: precondition_enforcement
        grounds: ["endpoints.PATCH_/cath-lab/staff/{staffId}", "errors[ERR_RESOURCE_IN_USE]"]
        distinguishing_aspect: "A technologist with an ASSIGNED assignment on a SCHEDULED case cannot be deactivated (ERR_RESOURCE_IN_USE); after release, deactivation succeeds."
