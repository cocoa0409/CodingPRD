            - { call: "POST /api/hives/${hv1}/split", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/hives/${hv2}/split", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { child: $.data.id, parent: $.data.parent_hive_id, child_posture: $.data.posture } }
            - { call: "GET /api/hives", payload: { parent_hive_id: "${hv2}" }, as: PlatformOps }
          assert:
            - "captured ${err} == ERR_INVALID_STATE (WATCH parent may not split)"
            - "captured ${parent} == ${hv2} and ${child_posture} == STABLE (child starts STABLE until its own inspection)"
            - "GET /api/hives filtered by parent_hive_id=${hv2} returns exactly the child ${child}"

      - name: swarm_capture_creates_hive_cross_reference
        claim_type: cross_reference_link
        grounds: [state_machines.SwarmEvent.DISPATCHED_to_CAPTURED, entities.Hive.fields.source_swarm_event_id]
        distinguishing_aspect: "Capture cross-creates a Hive whose source_swarm_event_id points back to the event; the event's captured_hive_id and the filtered hive list must agree."
        test_recipe:
          setup: ["host ACTIVE; site CLEAR; agreement ACTIVE; swarm REPORTED and DISPATCHED to bk-1"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Cap Host", email: "cap2@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
