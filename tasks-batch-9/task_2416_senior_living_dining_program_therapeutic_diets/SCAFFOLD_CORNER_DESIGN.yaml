              as_user_id: "rd-1"
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 2, week_count: 1, effective_start_date: "2026-08-16", effective_end_date: "2026-08-22" }
              as: DiningServicesManager
              captures: { c2_id: $.data.id }
            - call: "POST /menu-cycles/${c2_id}/items"
              payload: { item_code: "C2-COD", name: "Baked Cod", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR" }
              as: DiningServicesManager
            - call: "POST /menu-cycles/${c2_id}/submit"
              payload: {}
              as: DiningServicesManager
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 3, week_count: 1, effective_start_date: "2026-08-17", effective_end_date: "2026-08-23" }
              as: DiningServicesManager
              captures: { c3_id: $.data.id }
            - call: "POST /menu-cycles/${c3_id}/items"
              payload: { item_code: "C3-COD", name: "Baked Cod", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR" }
              as: DiningServicesManager
            - call: "POST /menu-cycles/${c3_id}/submit"
              payload: {}
              as: DiningServicesManager
          trigger:
            - call: "POST /menu-cycles/${c2_id}/publish"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { ov_error: $.data.error_id, ov_message: $.data.message }
            - call: "POST /menu-cycles/${c3_id}/publish"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-1"
              captures: { c3_status: $.data.status }
            - call: "GET /menu-cycles/${c2_id}"
              payload: {}
              as: DiningServicesManager
              captures: { c2_status_after: $.data.status }
            - call: "GET /menu-cycles/${c1_id}"
              payload: {}
              as: DiningServicesManager
              captures: { c1_status_after: $.data.status }
          assert:
            - "${ov_error} == ERR_MENU_CYCLE_DATE_OVERLAP with HTTP 409 (2026-08-16 is shared by both closed ranges)"
            - "${c3_status} == PUBLISHED — 2026-08-17 starts after 2026-08-16, so the ranges are disjoint"
            - "${c2_status_after} == PENDING_DIETITIAN_SIGNOFF — the refused cycle keeps its state"
            - "${c1_status_after} == ARCHIVED (archived by the C3 publish cascade)"
      - name: observation_future_date_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - errors[id=ERR_OBSERVATION_FUTURE_DATE]
        distinguishing_aspect: "The comparison is against the logical clock date and is inclusive: 2026-08-11 is refused while 2026-08-10, the clock's own date, is accepted."
