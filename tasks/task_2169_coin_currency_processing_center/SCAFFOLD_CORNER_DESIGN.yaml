scaffold_corner_design:

  - section: entities
    instances:
      - name: vault_creation_applies_defaults_and_starts_at_version_one
        claim_type: Creation
        grounds:
          - entities.Vault.fields.posture
          - entities.Vault.fields.pickup_concurrency_limit
          - endpoints.POST_/cash-vault/vaults
        distinguishing_aspect: "POST /cash-vault/vaults with only vault_code and name returns 201 with posture OPEN, pickup_concurrency_limit 2, cash_letter_adjustment_cents 0, coin_face_value_on_hand_cents 0 and version 1."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /cash-vault/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: VaultManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C01", name: "Corner Vault One" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id, v_posture: $.data.posture, v_limit: $.data.pickup_concurrency_limit, v_version: $.data.version, v_face: $.data.coin_face_value_on_hand_cents }
          assert:
            - "HTTP status of the trigger response == 201"
            - "${v_posture} == OPEN"
            - "${v_limit} == 2"
            - "${v_version} == 1"
            - "${v_face} == 0"
            - "Vault.${v_id}.cash_letter_adjustment_cents == 0"

      - name: customer_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CustomerAccount.fields.customer_name
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cash-vault/customer-accounts omitting the required customer_name is rejected with ERR_INVALID_REQUEST at 400 and creates no row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C02", name: "Corner Vault Two" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C02" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger response == 400"

      - name: sealed_bag_defaults_zero_when_optional_declared_counts_omitted
        claim_type: Defaults
        grounds:
          - entities.SealedBag.fields.declared_note_count
          - entities.SealedBag.fields.declared_coin_weight_grams
          - entities.SealedBag.fields.custody_status
          - entities.SealedBag.fields.count_status
        distinguishing_aspect: "A SealedBag created without declared_note_count or declared_coin_weight_grams reads 0 for both and starts at custody_status SEALED / count_status PENDING with version 1."
        test_recipe:
          setup:
            - "Vault CV-C03, CustomerAccount ACC-C03, DepositTicket MAN-C03 in INTAKE."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C03", name: "Corner Vault Three" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C03", customer_name: "Corner Cafe Three", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C03", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C03", bag_type: "CURRENCY", declared_amount_cents: 50000 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id, b_notes: $.data.declared_note_count, b_coin: $.data.declared_coin_weight_grams, b_cust: $.data.custody_status, b_cnt: $.data.count_status }
          assert:
            - "${b_notes} == 0"
            - "${b_coin} == 0"
            - "${b_cust} == SEALED"
            - "${b_cnt} == PENDING"
            - "SealedBag.${b_id}.version == 1"
            - "DepositTicket.${t_id}.declared_total_cents == 50000"

      - name: deposit_ticket_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=20]
          - errors[ERR_TICKET_NOT_FOUND]
        distinguishing_aspect: "GET /cash-vault/deposit-tickets/{id} for a well-formed but unknown UUID returns ERR_TICKET_NOT_FOUND at 404."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C04", name: "Corner Vault Four" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /cash-vault/deposit-tickets/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TICKET_NOT_FOUND"
            - "HTTP status of the trigger response == 404"

      - name: custody_event_is_immutable_and_exposes_only_id_and_created_at
        claim_type: Immutability
        grounds:
          - entities.CustodyEvent.fields.sequence_no
          - entities.CustodyEvent.fields.seal_intact
          - entities.CustodyEvent.fields.actor_user_id
        distinguishing_aspect: "CustodyEvent declares common_fields false, so its create response carries id and created_at but no version and no updated_at, and sequence_no is 1 for the first hop with seal_intact true and actor_user_id taken from X-User-ID."
        test_recipe:
          setup:
            - "Vault CV-C05, CustomerAccount ACC-C05, ticket MAN-C05, bag S-C05 in custody_status SEALED."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C05", name: "Corner Vault Five" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C05", customer_name: "Corner Deli Five", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C05", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C05", bag_type: "CURRENCY", declared_amount_cents: 50000, declared_note_count: 50, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-C05" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { e_seq: $.data.sequence_no, e_intact: $.data.seal_intact, e_actor: $.data.actor_user_id }
          assert:
            - "HTTP status of the trigger response == 201"
            - "${e_seq} == 1"
            - "${e_intact} == true"
            - "${e_actor} == u-car-1"
            - "the CustodyEvent response body contains id and created_at and contains neither version nor updated_at"
            - "SealedBag.${b_id}.custody_status == IN_TRANSIT"
            - "SealedBag.${b_id}.version == 2"

      - name: counting_machine_invalid_enum_machine_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.CountingMachine.fields.machine_type
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /cash-vault/counting-machines with machine_type outside {CURRENCY_SORTER, COIN_COUNTER, MIXED_PROCESSOR} returns ERR_INVALID_REQUEST at 400."
        test_recipe:
          setup:
            - "Vault CV-C06 exists."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C06", name: "Corner Vault Six" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/counting-machines"
              payload: { vault_id: "${v_id}", machine_code: "BAD-1", machine_type: "SHREDDER" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger response == 400"
            - "GET /cash-vault/counting-machines?vault_id=${v_id} returns total_count 0"

      - name: sealed_bag_with_unknown_deposit_ticket_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.SealedBag.fields.deposit_ticket_id
          - validations[priority=25]
          - errors[ERR_TICKET_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys are checked for existence: POST /cash-vault/sealed-bags naming an unknown deposit_ticket_id returns ERR_TICKET_NOT_FOUND at 404."
        test_recipe:
          setup:
            - "Empty database apart from one vault."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C07", name: "Corner Vault Seven" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "99999999-8888-4777-8666-555555555555", seal_number: "S-C07", bag_type: "CURRENCY", declared_amount_cents: 50000 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TICKET_NOT_FOUND"
            - "HTTP status of the trigger response == 404"

      - name: deposit_ticket_list_paginates_and_filters_by_customer
        claim_type: Listing
        grounds:
          - endpoints.GET_/cash-vault/deposit-tickets
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /cash-vault/deposit-tickets?customer_account_id=...&limit=2&offset=0 returns exactly 2 DepositTicket rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 with has_more false."
        test_recipe:
          setup:
            - "Vault CV-C08, CustomerAccount ACC-C08, and three DepositTickets MAN-C08A, MAN-C08B, MAN-C08C all in INTAKE for that account."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C08", name: "Corner Vault Eight" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C08", customer_name: "Corner Grocer Eight", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C08A", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C08B", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C08C", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
          trigger:
            - call: "GET /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", limit: 2, offset: 0 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { first_page: $.data }
            - call: "GET /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", limit: 2, offset: 2 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { second_page: $.data }
          assert:
            - "the first response's data array length == 2, meta pagination total_count == 3 and has_more == true"
            - "the second response's data array length == 1 and has_more == false"
            - "every returned DepositTicket has customer_account_id == ${a_id}"

      - name: pagination_limit_above_maximum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_REQUEST]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "A limit of 101 exceeds the declared maximum of 100 and is rejected with ERR_INVALID_REQUEST at 400 rather than silently clamped."
        test_recipe:
          setup:
            - "Vault CV-C09 and CustomerAccount ACC-C09 exist; no tickets."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C09", name: "Corner Vault Nine" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C09", customer_name: "Corner Market Nine", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
          trigger:
            - call: "GET /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", limit: 101, offset: 0 }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status of the trigger response == 400"

  - section: state_machines
    instances:
      - name: deposit_ticket_initial_state_is_intake
        claim_type: Initial State
        grounds:
          - state_machines.DepositTicket.initial_state
          - entities.DepositTicket.fields.status
        distinguishing_aspect: "A newly created DepositTicket reads status INTAKE with counted_total_cents 0, provisional_credit_cents 0 and material_variance_open_count 0."
        test_recipe:
          setup:
            - "Vault CV-C10 and CustomerAccount ACC-C10 exist."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C10", name: "Corner Vault Ten" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C10", customer_name: "Corner Bistro Ten", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C10", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id, t_status: $.data.status, t_carrier: $.data.carrier_courier_user_id }
          assert:
            - "${t_status} == INTAKE"
            - "${t_carrier} == u-car-1"
            - "DepositTicket.${t_id}.counted_total_cents == 0"
            - "DepositTicket.${t_id}.provisional_credit_cents == 0"
            - "DepositTicket.${t_id}.material_variance_open_count == 0"

      - name: verify_on_already_verified_ticket_rejects_with_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DepositTicket.INTAKE_to_VERIFIED
          - validations[priority=40]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The INTAKE -> VERIFIED transition is not re-enterable: a second verify on a ticket already in VERIFIED returns ERR_INVALID_STATE at 409 and does not re-run declared_total_cents."
        test_recipe:
          setup:
            - "Vault CV-C11, CustomerAccount ACC-C11, ticket MAN-C11 with one bag S-C11 at VAULT_RECEIVED, ticket already VERIFIED."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C11", name: "Corner Vault Eleven" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C11", customer_name: "Corner Diner Eleven", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C11", declared_bag_count: 1 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C11", bag_type: "CURRENCY", declared_amount_cents: 60000, declared_note_count: 60, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-C11" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-C11-DOCK", observed_seal_number: "S-C11" }
              as: VaultTeller
              as_user_id: "u-tel-1"
            - call: "POST /cash-vault/deposit-tickets/${t_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { first_status: $.data.status }
          trigger:
            - call: "POST /cash-vault/deposit-tickets/${t_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { err: $.data.error_id }
          assert:
            - "${first_status} == VERIFIED"
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status of the trigger response == 409"
            - "DepositTicket.${t_id}.status == VERIFIED"
            - "DepositTicket.${t_id}.declared_total_cents == 60000"

      - name: verify_rejected_when_bag_count_differs_from_declared_bag_count
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=43]
          - errors[ERR_BAG_COUNT_MISMATCH]
          - state_machines.DepositTicket.INTAKE_to_VERIFIED
        distinguishing_aspect: "A ticket declaring 2 bags but carrying only 1 registered bag is rejected at verify with ERR_BAG_COUNT_MISMATCH at 409, ahead of any custody check on the single bag."
        test_recipe:
          setup:
            - "Vault CV-C12, CustomerAccount ACC-C12, ticket MAN-C12 declaring 2 bags but only bag S-C12 registered and already VAULT_RECEIVED."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C12", name: "Corner Vault Twelve" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C12", customer_name: "Corner Laundry Twelve", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /cash-vault/deposit-tickets"
              payload: { customer_account_id: "${a_id}", vault_id: "${v_id}", courier_manifest_number: "MAN-C12", declared_bag_count: 2 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { t_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags"
              payload: { deposit_ticket_id: "${t_id}", seal_number: "S-C12", bag_type: "CURRENCY", declared_amount_cents: 60000, declared_note_count: 60, declared_coin_weight_grams: 0 }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
              captures: { b_id: $.data.id }
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "PICKUP", location_code: "SITE-CUST", observed_seal_number: "S-C12" }
              as: ArmoredCarrier
              as_user_id: "u-car-1"
            - call: "POST /cash-vault/sealed-bags/${b_id}/custody-events"
              payload: { event_type: "VAULT_RECEIPT", location_code: "CV-C12-DOCK", observed_seal_number: "S-C12" }
              as: VaultTeller
              as_user_id: "u-tel-1"
          trigger:
            - call: "POST /cash-vault/deposit-tickets/${t_id}/verify"
              payload: {}
              as: VaultTeller
              as_user_id: "u-tel-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BAG_COUNT_MISMATCH"
            - "HTTP status of the trigger response == 409"
            - "DepositTicket.${t_id}.status == INTAKE"

      - name: vault_receipt_with_mismatched_seal_number_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SealedBag.IN_TRANSIT_to_VAULT_RECEIVED
          - validations[priority=69]
          - errors[ERR_SEAL_TAMPERED]
        distinguishing_aspect: "A VAULT_RECEIPT hop whose observed_seal_number differs from SealedBag.seal_number is rejected with ERR_SEAL_TAMPERED at 409, the bag stays IN_TRANSIT and no CustodyEvent is appended."
        test_recipe:
          setup:
            - "Vault CV-C13, CustomerAccount ACC-C13, ticket MAN-C13, bag S-C13 already IN_TRANSIT after a PICKUP hop."
          setup_api_calls:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C13", name: "Corner Vault Thirteen" }
              as: VaultManager
              as_user_id: "u-mgr-1"
              captures: { v_id: $.data.id }
            - call: "POST /cash-vault/customer-accounts"
              payload: { account_number: "ACC-C13", customer_name: "Corner Salon Thirteen", tier: "STANDARD", status: "ACTIVE" }
              as: VaultManager
              as_user_id: "u-mgr-1"
