      - name: corner_pagination_bounds_rejected_at_zero_and_101
        claim_type: violation_to_error
        grounds: [validations.priority_32_ERR_INVALID_PAGINATION, endpoints.GET_/pricing/products]
        distinguishing_aspect: "The pagination window is the closed range 1..100 for limit and 0.. for offset, so limit=0, limit=101 and offset=-1 are all refused while limit=100 with offset=0 is accepted — an off-by-one at either end changes the verdict."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; market US-WEST with two products."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-PG-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 20000, unit_cost_cents: 8000 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-PG-2", category_code: "APPLIANCE", brand: "Nordis", own_price_cents: 30000, unit_cost_cents: 12000 }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
          trigger:
            - call: "GET /pricing/products?market_id=${m_id}&limit=0"
              payload: {}
              as: PricingAnalyst
              captures: { err_zero: $.data.error_id }
            - call: "GET /pricing/products?market_id=${m_id}&limit=101"
              payload: {}
              as: PricingAnalyst
              captures: { err_over: $.data.error_id }
            - call: "GET /pricing/products?market_id=${m_id}&offset=-1"
              payload: {}
              as: PricingAnalyst
              captures: { err_neg: $.data.error_id }
            - call: "GET /pricing/products?market_id=${m_id}&limit=100&offset=0"
              payload: {}
              as: PricingAnalyst
              captures: { ok_count: $.data }
          assert:
            - "limit=0, limit=101 and offset=-1 each return HTTP 422 with error_id == ERR_INVALID_PAGINATION"
            - "limit=100 with offset=0 returns HTTP 200 with total_count == 2, has_more == false and two rows"
            - "limit=1 with offset=1 returns HTTP 200 with total_count == 2, has_more == false and exactly one row"

