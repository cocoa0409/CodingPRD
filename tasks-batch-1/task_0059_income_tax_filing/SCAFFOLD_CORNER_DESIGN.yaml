  # -----------------------------------------------------------------
  # Errors
  # -----------------------------------------------------------------
  - section: errors
    instances:
      - name: error_invalid_request_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]"]
        excluded_because:
          difficulty_instance: combinatorial_formula / aotc_two_step_floor_rounding_order_mode_b
          rationale: "ERR_INVALID_REQUEST is exercised by §1.9 entity instances (create_taxreturn_missing_required_field_invalid_request, create_income_document_negative_amount_invalid_request)."
      - name: error_stale_return_version_efile
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_RETURN_VERSION]", "concurrency_rules[efile-create-stale-return]"]
        distinguishing_aspect: "efile carrying an expected_return_version one less than the current version (a later compute bumped it) returns ERR_STALE_RETURN_VERSION (412)."
        test_recipe:
          setup: ["Taxpayer + TaxReturn computed READY (client holds a pre-recompute version), then recomputed once more so the held version is stale."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "er1@x.com", full_name: "ER1", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
