              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/vehicles"
              payload: { label: "Van 13", ambulatory_seats: 8, wheelchair_stations: 2, turnaround_minutes: 30 }
              as: ActivityDirector
              captures: { veh_id: $.data.id }
            - call: "POST /recreation/outings"
              payload: { program_id: "${prog_id}", vehicle_id: "${veh_id}", destination: "County Fair", departure_at: "2026-08-31T09:00:00Z", return_at: "2026-08-31T13:00:00Z", escort_count: 2 }
              as: ActivityDirector
              captures: { outing_id: $.data.id }
            - call: "POST /recreation/outings/${outing_id}/consents"
