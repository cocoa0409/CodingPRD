              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_ofa_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_ofa_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_ofa_id}", home_site_id: "${site_ofa_id}", alias: "OFA-A", tg_decimal_id: 2301, kind: "DISPATCH", encryption_mode: "CLEAR" }
              as: AgencyRadioManager
              as_user_id: "${agency_ofa_id}"
              captures: { tg_ofa_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_ofa_id}", serial_number: "OFA0001", radio_id: 42001, model: "PORTABLE" }
              as: AgencyRadioManager
