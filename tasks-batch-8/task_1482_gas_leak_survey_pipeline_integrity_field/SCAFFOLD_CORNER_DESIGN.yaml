        grounds:
          - errors[ERR_CREW_AT_CAPACITY]
        excluded_because:
          difficulty_instance: crew_at_capacity_boundary_exact_max
          rationale: "Asserted at the exact capacity boundary in the named §1.8 boundary-precision instance."

      - name: error_no_valid_excavation_permit_covered
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_VALID_EXCAVATION_PERMIT]
        excluded_because:
          difficulty_instance: temporal_vs_constraint_on_repair_dispatch
          rationale: "Asserted as the winning error in the named §1.8 priority-conflict instance (expired permit beats crew capacity); also exercised by excavation_permit_expiry_exclusive_bound."

  # =============================================================================
  # Section: rbac — Table 7 claims: exclusive ops denied to other roles, shared
  # ops allowed, segregation-of-duties role model.
  # =============================================================================
  - section: rbac
    instances:
      - name: field_technician_cannot_create_pipe_segment
        claim_type: role_denied
        grounds:
          - roles.IntegrityAnalyst
          - roles.FieldTechnician
          - endpoints.POST /pipe-segments
        distinguishing_aspect: "POST /pipe-segments is IntegrityAnalyst-exclusive; FieldTechnician gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "FT-1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
          trigger:
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-RB1", install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"
            - "HTTP status == 403"

      - name: dispatch_coordinator_cannot_accept_survey_run
        claim_type: role_denied
        grounds:
          - roles.DispatchCoordinator
          - endpoints.POST /survey-runs/{id}/accept
        distinguishing_aspect: "POST /survey-runs/{id}/accept is IntegrityAnalyst-exclusive; DispatchCoordinator gets 403 ERR_FORBIDDEN even for an existing run id."
        test_recipe:
          setup:
            - "DC-1 exists; the probed run id need not exist (authz precedes existence per priority 2 < 3)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /dispatch-coordinators"
              payload: { employee_code: "DC-1", full_name: "Disp One" }
              as: IntegrityAnalyst
              captures: { dc_id: $.data.id }
          trigger:
            - call: "POST /survey-runs/00000000-0000-0000-0000-000000000000/accept"
              payload: {}
              as: DispatchCoordinator
              as_user_id: "${dc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: integrity_analyst_cannot_create_instrument
        claim_type: role_denied
        grounds:
          - roles.CalibrationTech
          - endpoints.POST /instruments
        distinguishing_aspect: "Instrument inventory is CalibrationTech-exclusive; even the program-owning IntegrityAnalyst gets 403 ERR_FORBIDDEN (peer-roles separation, no hierarchical override)."
        test_recipe:
          setup:
            - "IA-1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /integrity-analysts"
              payload: { employee_code: "IA-1", full_name: "Analyst One" }
              as: IntegrityAnalyst
              captures: { ia_id: $.data.id }
          trigger:
            - call: "POST /instruments"
              payload: { serial_number: "I-CGI-RB3", instrument_type: "CGI" }
              as: IntegrityAnalyst
              as_user_id: "${ia_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: compliance_officer_cannot_dispatch_repair_order
        claim_type: role_denied
        grounds:
          - roles.ComplianceOfficer
          - endpoints.POST /repair-orders/{id}/dispatch
        distinguishing_aspect: "Repair dispatch is DispatchCoordinator-exclusive; ComplianceOfficer gets 403 ERR_FORBIDDEN (segregation: permit approver cannot also dispatch crews)."
        test_recipe:
          setup:
            - "CO-1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /compliance-officers"
              payload: { employee_code: "CO-1", full_name: "Officer One", jurisdiction_scope: ["PHMSA"] }
              as: IntegrityAnalyst
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /repair-orders/00000000-0000-0000-0000-000000000000/dispatch"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${co_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: field_technician_cannot_list_compliance_reports
        claim_type: role_denied
        grounds:
          - roles.FieldTechnician
          - endpoints.GET /compliance-reports
        distinguishing_aspect: "GET /compliance-reports is shared only between ComplianceOfficer and IntegrityAnalyst; FieldTechnician (not in the endpoint's roles list) gets 403 ERR_FORBIDDEN — read-side RBAC, not just writes."
        test_recipe:
          setup:
            - "FT-1 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /field-technicians"
              payload: { employee_code: "FT-1", full_name: "Tech One", qualified_methods: ["WALKING"], home_region: "NORTH" }
              as: IntegrityAnalyst
              captures: { ft_id: $.data.id }
          trigger:
            - call: "GET /compliance-reports"
              payload: {}
              as: FieldTechnician
              as_user_id: "${ft_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: shared_segment_list_allowed_for_peer_roles
        claim_type: role_allowed
        grounds:
          - roles.DispatchCoordinator
          - roles.ComplianceOfficer
          - endpoints.GET /pipe-segments
        distinguishing_aspect: "GET /pipe-segments lists four roles in §1.5; both DispatchCoordinator and ComplianceOfficer receive 200 with response_type 'array' (shared_operations honored)."
        test_recipe:
          setup:
            - "One segment exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrityAnalyst
            - call: "POST /pipe-segments"
              payload: { segment_code: "SEG-RB6", install_year: 2001, material: "STEEL", diameter_inches: 6.0, length_feet: 1000.0, operating_pressure_psi: 60.0, pressure_class: "DISTRIBUTION", is_high_consequence_area: false }
              as: IntegrityAnalyst
          trigger:
            - call: "GET /pipe-segments"
              payload: {}
              as: DispatchCoordinator
              captures: { total_dc: $.meta.total_count }
            - call: "GET /pipe-segments"
              payload: {}
              as: ComplianceOfficer
              captures: { total_co: $.meta.total_count }
          assert:
            - "total_dc == 1 AND total_co == 1 (both peer roles allowed)"

