  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pasture_aggregate_au_capacity_overlap
        grounds:
          - calculations.animal_unit_load
          - validations[priority=12]
          - errors[ERR_PASTURE_OVER_CAPACITY]
          - entities.Pasture.fields.capacity_au
        distinguishing_aspect: "Aggregate-capacity interval semantics on a PEN: a second 454 kg animal applied during the same overlap window pushes projected aggregate AU to 2.0 > capacity 1.0 and is rejected — the geometric treatment is summed concurrent occupation, not adjacency."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd, PEN capacity_au 1.0, two 454 kg animals. First animal applied into the pen (current_au_load 1.0). Second animal planned into the same pen overlapping the same window."
