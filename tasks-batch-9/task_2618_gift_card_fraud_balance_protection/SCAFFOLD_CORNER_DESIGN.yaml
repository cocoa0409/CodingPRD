            - "cardD: DIGITAL face 5000 minted by screening a DIGITAL request with clean signals, one redemption of 2000 at store1, so balance 3000."
            - "One OPEN LiabilityPeriod 2026-08-01..2026-09-01 so the writeoff leg has somewhere to land."
            - "Two SUBMITTED VictimClaims, each with purchase_receipt_ref only and no packaging_photo_ref, taken in by analyst-62."
