            - call: "POST /v1/substitutions/${sub_rec}/accept"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "data.error_id == ERR_SUBSTITUTION_NOT_PROPOSED"

      - name: err_line_not_picked_oos_before_capture
        claim_type: violation_to_error
        grounds: ["errors[ERR_LINE_NOT_PICKED]", state_machines.OrderLine.PICKED_to_OUT_OF_STOCK]
        distinguishing_aspect: "The post-capture out-of-stock path requires a PICKED line on a STAGED captured order; invoking it on a PENDING line of a PICKING order takes the pre-capture branch instead, so to exercise ERR_LINE_NOT_PICKED we target a SUBSTITUTED line (not PICKED) on a captured order."
        excluded_because:
          difficulty_instance: transitive_cascade / tc_out_of_stock_refund_depth3
          rationale: "The PICKED->OUT_OF_STOCK transition and its state precondition are exercised positively by the §1.8 depth-3 cascade; the negative ERR_LINE_NOT_PICKED guard is the same transition's from-state check and needs no separate breadth fixture."

