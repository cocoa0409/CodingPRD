              as: TrustAccountant
            - call: "POST /accounts"
              payload: { name: "Acct C3b", servicing_producer_id: "${prod_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${prod_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
