  - rule_id: boundary_precision_check
    instances:
      - name: ebook_rate_band_upper_boundary_999_vs_1000
        grounds:
          - calculations.royalty_per_unit
          - entities.Channel.fields.ebook_rate_high_threshold_cents
          - entities.ChannelPrice.fields.royalty_per_unit_cents
        distinguishing_aspect: "At list 999 (== high threshold, inclusive) the ebook rate is 0.70 with a 30c delivery fee => royalty 669; at 1000 (threshold+1) it flips to 0.35 with no fee => royalty 350, on the POST /formats/{id}/prices endpoint."
