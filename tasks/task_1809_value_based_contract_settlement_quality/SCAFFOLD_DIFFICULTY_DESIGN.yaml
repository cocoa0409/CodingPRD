      - name: quality_result_validate_correction_loop
        grounds:
          - state_machines.QualityMeasureResult.REPORTED_to_VALIDATED
          - state_machines.QualityMeasureResult.VALIDATED_to_REPORTED
          - state_machines.QualityMeasureResult.VALIDATED_to_LOCKED
        distinguishing_aspect: |
          QualityMeasureResult loops REPORTED -> VALIDATED -> REPORTED ->
          VALIDATED -> LOCKED: the correction loop clears computed scoring
          (rate_bp/achievement_points back to null) and revalidation recomputes
          them — a cycle on a different entity than the Settlement loop.
        test_recipe:
          setup:
            - "Program, group, contract (HBA1C weight 10000), year opened for attribution; no quality results yet"
          setup_api_calls:
            - { call: "POST /vbc/_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: PayerAdmin }
