            - call: "POST /draft-ops/eligibility-waivers/${waiver_id}/review"
              payload: { action: "OPEN_REVIEW" }
              as: EligibilityCommittee
              as_user_id: "U-COMM-1"
            - call: "POST /draft-ops/eligibility-waivers/${waiver_id}/review"
              payload: { action: "REQUEST_INFO", decision_note: "Need transcript" }
              as: EligibilityCommittee
              as_user_id: "U-COMM-1"
            - call: "POST /draft-ops/eligibility-waivers/${waiver_id}/review"
              payload: { action: "OPEN_REVIEW" }
              as: EligibilityCommittee
