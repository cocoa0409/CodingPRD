# =============================================================================
# Task 1018 — §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# =============================================================================
scaffold_corner_design:

  # ----------------------------- Entities ----------------------------------
  - section: entities
    instances:
      - name: corner_product_create_returns_full_entity
        claim_type: creation
        grounds: ["entities.Product.fields.status", "entities.Product.fields.stock_state"]
        distinguishing_aspect: "POST /products with all required fields returns 201, status=ACTIVE, stock_state=OUT_OF_STOCK, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { name: "Ceylon Cinnamon", category: "SPICE", kind: "SIMPLE", unit_price_cents_per_gram: 3.5, tare_default_grams: 10, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
          assert:
            - "Product.${cham_id}.status == ACTIVE"
            - "Product.${cham_id}.stock_state == OUT_OF_STOCK"
            - "Product.${cham_id}.version == 1"

      - name: corner_product_get_not_found
        claim_type: not_found
        grounds: ["\"errors[ERR_PRODUCT_NOT_FOUND]\""]
        distinguishing_aspect: "GET /products/{unknown uuid} -> ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: CatalogManager
          assert:
            - "response error_id == ERR_PRODUCT_NOT_FOUND"

      - name: corner_add_line_missing_required_grams
        claim_type: required_fields
        grounds: ["\"entities.OrderLine.fields.requested_grams\"", "\"errors[ERR_VALIDATION]\""]
        distinguishing_aspect: "POST /orders/{id}/lines without requested_grams -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["An account and a DRAFT order and a product exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}" }
              as: SalesAgent
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: corner_product_stock_state_out_of_stock_on_create
        claim_type: computed_fields
        grounds: ["entities.Product.fields.stock_state"]
        distinguishing_aspect: "A product with no lots reads stock_state=OUT_OF_STOCK (input cannot set it)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
          trigger:
            - call: "GET /products/${cham_id}"
              payload: {}
              as: CatalogManager
          assert:
            - "Product.${cham_id}.stock_state == OUT_OF_STOCK"

  # --------------------------- State Machines ------------------------------
  - section: state_machines
    instances:
      - name: corner_ship_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["\"state_machines.CustomerOrder.PACKED_to_SHIPPED\"", "\"errors[ERR_INVALID_STATE]\""]
        distinguishing_aspect: "POST /orders/{id}/ship on a DRAFT order -> ERR_INVALID_STATE; ship is only valid from PACKED."
        test_recipe:
          setup: ["A DRAFT order exists."]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /orders/${ord_id}/ship"
              payload: {}
              as: SalesAgent
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: corner_price_twice_returns_invalid_state
        claim_type: idempotency
        grounds: ["\"state_machines.CustomerOrder.DRAFT_to_PRICED\"", "\"errors[ERR_INVALID_STATE]\""]
        distinguishing_aspect: "Pricing an already-PRICED order again -> ERR_INVALID_STATE (price is only valid from DRAFT)."
        test_recipe:
          setup: ["A priced order (one Chamomile line) exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: corner_reinstate_active_account_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["\"state_machines.WholesaleAccount.SUSPENDED_to_ACTIVE\"", "\"errors[ERR_INVALID_STATE]\""]
        distinguishing_aspect: "Reinstating an already-ACTIVE account -> ERR_INVALID_STATE (reinstate is only valid from SUSPENDED)."
        test_recipe:
          setup: ["A fresh ACTIVE account exists."]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /wholesale-accounts/${acc_id}/reinstate"
              payload: {}
              as: SalesAgent
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # ---------------------------- Calculations -------------------------------
  - section: calculations
    instances:
      - name: corner_fefo_selects_earliest_best_by
        claim_type: correct_result
        grounds: ["calculations.fefo_allocation", "entities.OrderLine.fields.allocated_lot_id"]
        distinguishing_aspect: "With two AVAILABLE lots (best_by 2026-08-01 vs 2026-09-01) the packed line allocates from the earlier-expiry lot."
        test_recipe:
          setup: ["Chamomile with lotA best_by 2026-09-01 and lotB best_by 2026-08-01, both 500g; order confirmed; net 100 packed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "LATE", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-09-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_a: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "EARLY", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-08-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_b: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: true }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 108, tare_grams: 8 } ] }
              as: ProductionOperator
          assert:
            - "OrderLine.${line_id}.allocated_lot_id == ${lot_b}"
            - "InventoryLot.${lot_b}.grams_on_hand == 400"
            - "InventoryLot.${lot_a}.grams_on_hand == 500"

      - name: corner_tin_run_allergen_set_union
        claim_type: correct_result
        grounds: ["calculations.effective_allergens", "entities.TinRun.fields.allergen_set"]
        distinguishing_aspect: "A tin run over Sweet Almond (TREE_NUTS) + Chamomile computes allergen_set = [TREE_NUTS]."
        test_recipe:
          setup: ["Sweet Almond (TREE_NUTS) and Chamomile products; one station."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Sweet Almond Bits", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 5.0, tare_default_grams: 5, allergen_tags: ["TREE_NUTS"] }
              as: CatalogManager
              captures: { sa_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /labeling-stations"
              payload: { name: "Station A" }
              as: ProductionOperator
              captures: { station_id: $.data.id }
          trigger:
            - call: "POST /tin-runs"
              payload: { labeling_station_id: "${station_id}", product_ids: ["${sa_id}", "${cham_id}"], scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T09:00:00Z" }
              as: ProductionOperator
              captures: { run_id: $.data.id }
          assert:
            - "TinRun.${run_id}.allergen_set includes TREE_NUTS"

      - name: corner_lot_expired_status_on_read
        claim_type: correct_result
        grounds: ["calculations.freshness_status", "entities.InventoryLot.fields.status"]
        distinguishing_aspect: "A lot whose best_by (2026-08-01) is <= the clock (2026-09-01) reads status=EXPIRED."
        test_recipe:
          setup: ["Clock 2026-09-01; a Chamomile lot best_by 2026-08-01 received."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "OLD", grams_received: 100, received_at: "2026-05-01T00:00:00Z", best_by: "2026-08-01T00:00:00Z" }
              as: CatalogManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: CatalogManager
          assert:
            - "InventoryLot.${lot_id}.status == EXPIRED"

  # ---------------------------- Validations --------------------------------
  - section: validations
    instances:
      - name: corner_produce_non_blend_returns_not_blend
        claim_type: violation_to_error
        grounds: ["\"state_machines.Batch.PLANNED_to_PRODUCED\"", "\"errors[ERR_PRODUCT_NOT_BLEND]\""]
        distinguishing_aspect: "Producing a batch whose blend_product_id is a SIMPLE product -> ERR_PRODUCT_NOT_BLEND (422)."
        test_recipe:
          setup: ["A SIMPLE product, a line, and a PLANNED batch pointing at the SIMPLE product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "Line 1" }
              as: ProductionOperator
              captures: { line_id: $.data.id }
            - call: "POST /batches"
              payload: { blend_product_id: "${cham_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /batches/${batch_id}/produce"
              payload: {}
              as: ProductionOperator
          assert:
            - "response error_id == ERR_PRODUCT_NOT_BLEND"

      - name: corner_produce_invalid_ratio
        claim_type: violation_to_error
        grounds: ["\"calculations.batch_component_draw\"", "\"errors[ERR_INVALID_RATIO]\""]
        distinguishing_aspect: "Producing a blend whose component ratios sum to 9000 bps (not 10000) -> ERR_INVALID_RATIO (422)."
        test_recipe:
          setup: ["Almond Chai blend with components 7000 + 2000 bps; both components well stocked; a PLANNED batch."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Black Tea Base", category: "TEA", kind: "SIMPLE", unit_price_cents_per_gram: 4.0, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { bt_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Sweet Almond Bits", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 5.0, tare_default_grams: 5, allergen_tags: ["TREE_NUTS"] }
              as: CatalogManager
              captures: { sa_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Almond Chai Blend", category: "TEA", kind: "BLEND", unit_price_cents_per_gram: 7.2, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { chai_id: $.data.id }
            - call: "POST /blend-components"
              payload: { blend_product_id: "${chai_id}", component_product_id: "${bt_id}", weight_ratio_bps: 7000 }
              as: CatalogManager
            - call: "POST /blend-components"
              payload: { blend_product_id: "${chai_id}", component_product_id: "${sa_id}", weight_ratio_bps: 2000 }
              as: CatalogManager
            - call: "POST /inventory-lots"
              payload: { product_id: "${bt_id}", lot_code: "BT", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
            - call: "POST /inventory-lots"
              payload: { product_id: "${sa_id}", lot_code: "SA", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
            - call: "POST /production-lines"
              payload: { name: "Line 1" }
              as: ProductionOperator
              captures: { line_id: $.data.id }
            - call: "POST /batches"
              payload: { blend_product_id: "${chai_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T08:00:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /batches/${batch_id}/produce"
              payload: {}
              as: ProductionOperator
          assert:
            - "response error_id == ERR_INVALID_RATIO"

      - name: corner_blend_component_duplicate
        claim_type: violation_to_error
        grounds: ["\"entities.BlendComponent.fields.component_product_id\"", "\"errors[ERR_DUPLICATE_COMPONENT]\""]
        distinguishing_aspect: "Attaching the same component_product_id to a blend twice -> ERR_DUPLICATE_COMPONENT (409)."
        test_recipe:
          setup: ["Almond Chai blend with Black Tea already attached."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Black Tea Base", category: "TEA", kind: "SIMPLE", unit_price_cents_per_gram: 4.0, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { bt_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Almond Chai Blend", category: "TEA", kind: "BLEND", unit_price_cents_per_gram: 7.2, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { chai_id: $.data.id }
            - call: "POST /blend-components"
              payload: { blend_product_id: "${chai_id}", component_product_id: "${bt_id}", weight_ratio_bps: 5000 }
              as: CatalogManager
          trigger:
            - call: "POST /blend-components"
              payload: { blend_product_id: "${chai_id}", component_product_id: "${bt_id}", weight_ratio_bps: 5000 }
              as: CatalogManager
          assert:
            - "response error_id == ERR_DUPLICATE_COMPONENT"

      - name: corner_batch_window_invalid
        claim_type: violation_to_error
        grounds: ["\"entities.Batch.fields.scheduled_start\"", "\"errors[ERR_WINDOW_INVALID]\""]
        distinguishing_aspect: "Scheduling a batch with scheduled_start >= scheduled_end -> ERR_WINDOW_INVALID (409)."
        test_recipe:
          setup: ["A blend product and a line exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Almond Chai Blend", category: "TEA", kind: "BLEND", unit_price_cents_per_gram: 7.2, tare_default_grams: 5, allergen_tags: [] }
              as: CatalogManager
              captures: { chai_id: $.data.id }
            - call: "POST /production-lines"
              payload: { name: "Line 1" }
              as: ProductionOperator
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /batches"
              payload: { blend_product_id: "${chai_id}", production_line_id: "${line_id}", target_output_grams: 100, scheduled_start: "2026-07-10T10:00:00Z", scheduled_end: "2026-07-10T10:00:00Z" }
              as: ProductionOperator
          assert:
            - "response error_id == ERR_WINDOW_INVALID"

      - name: corner_pack_insufficient_stock
        claim_type: violation_to_error
        grounds: ["\"calculations.fefo_allocation\"", "\"errors[ERR_INSUFFICIENT_STOCK]\""]
        distinguishing_aspect: "Packing a line whose product has no AVAILABLE lot -> ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup: ["Chamomile with NO lots; order confirmed with one line; allergen_ack true."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: true }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 50 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 58, tare_grams: 8 } ] }
              as: ProductionOperator
          assert:
            - "response error_id == ERR_INSUFFICIENT_STOCK"

  # ----------------------------- Endpoints ---------------------------------
  - section: endpoints
    instances:
      - name: corner_list_orders_returns_pagination_envelope
        claim_type: listing
        grounds: ["entities.CustomerOrder.fields.wholesale_account_id"]
        distinguishing_aspect: "GET /orders?wholesale_account_id returns a response_type=array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["One account with two DRAFT orders."]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
          trigger:
            - call: "GET /orders?wholesale_account_id=${acc_id}"
              payload: {}
              as: SalesAgent
          assert:
            - "response_type == array"
            - "response.meta contains total_count == 2 and has_more == false"

      - name: corner_reverse_reach_order_lines_by_order
        claim_type: filtered_list
        grounds: ["entities.OrderLine.fields.order_id"]
        distinguishing_aspect: "GET /order-lines?order_id returns the order's lines (FK reverse-reachability)."
        test_recipe:
          setup: ["An order with one Chamomile line."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /order-lines?order_id=${ord_id}"
              payload: {}
              as: SalesAgent
          assert:
            - "response_type == array"
            - "response.data includes an OrderLine whose id == ${line_id}"

  # ------------------------------- RBAC ------------------------------------
  - section: rbac
    instances:
      - name: corner_wholesaler_cannot_create_product
        claim_type: role_denial
        grounds: ["\"roles.Wholesaler\"", "\"errors[ERR_UNAUTHORIZED]\""]
        distinguishing_aspect: "A Wholesaler calling POST /products (a CatalogManager-exclusive op) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A wholesale account (the Wholesaler acts as it)."]
          setup_api_calls:
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: Wholesaler
              as_user_id: "${acc_id}"
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: corner_sales_agent_cannot_pack_order
        claim_type: role_denial
        grounds: ["\"roles.ProductionOperator\"", "\"errors[ERR_UNAUTHORIZED]\""]
        distinguishing_aspect: "A SalesAgent calling POST /orders/{id}/pack (a ProductionOperator-exclusive op) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A CONFIRMED order with a stocked Chamomile line."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { product_id: "${cham_id}", lot_code: "CH", grams_received: 500, received_at: "2026-06-01T00:00:00Z", best_by: "2026-12-01T00:00:00Z" }
              as: CatalogManager
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}", allergen_ack: true }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
              captures: { line_id: $.data.id }
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/pack"
              payload: { line_measurements: [ { line_id: "${line_id}", gross_grams: 108, tare_grams: 8 } ] }
              as: SalesAgent
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

  # ----------------- Cross-Cutting Complexity Layers -----------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_stale_account_version_on_confirm
        claim_type: optimistic_concurrency
        grounds: ["\"concurrency_rules[order-confirm-stale-account]\"", "\"errors[ERR_STALE_VERSION]\""]
        distinguishing_aspect: |
          Confirming order A bumps the account version 1->2; a subsequent confirm of order B still
          carrying expected_wholesale_account_version=1 (stale) is rejected ERR_STALE_VERSION (412).
          Two strictly sequential requests; zero parallelism.
        test_recipe:
          setup: ["Account (version 1) with two PRICED orders A and B; A confirmed (version -> 2)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { orda_id: $.data.id }
            - call: "POST /orders/${orda_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${orda_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ordb_id: $.data.id }
            - call: "POST /orders/${ordb_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${ordb_id}/price"
              payload: {}
              as: SalesAgent
            - call: "POST /orders/${orda_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ordb_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: corner_order_confirm_success_bumps_account_version
        claim_type: optimistic_concurrency
        grounds: ["state_machines.CustomerOrder.PRICED_to_CONFIRMED", "entities.WholesaleAccount.fields.committed_exposure_cents"]
        distinguishing_aspect: "Confirm with the correct expected_wholesale_account_version succeeds, bumps account.version 1->2, and adds the 250c hold."
        test_recipe:
          setup: ["Account version 1 with one PRICED order (provisional 250)."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Chamomile", category: "HERB", kind: "SIMPLE", unit_price_cents_per_gram: 2.5, tare_default_grams: 8, allergen_tags: [] }
              as: CatalogManager
              captures: { cham_id: $.data.id }
            - call: "POST /wholesale-accounts"
              payload: { business_name: "Acme Co", credit_limit_cents: 100000 }
              as: SalesAgent
              captures: { acc_id: $.data.id, acc_v: $.data.version }
            - call: "POST /orders"
              payload: { wholesale_account_id: "${acc_id}" }
              as: SalesAgent
              captures: { ord_id: $.data.id }
            - call: "POST /orders/${ord_id}/lines"
              payload: { product_id: "${cham_id}", requested_grams: 100 }
              as: SalesAgent
            - call: "POST /orders/${ord_id}/price"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /orders/${ord_id}/confirm"
              payload: { expected_wholesale_account_version: "${acc_v}" }
              as: SalesAgent
          assert:
            - "CustomerOrder.${ord_id}.fulfillment_status == CONFIRMED"
            - "WholesaleAccount.${acc_id}.committed_exposure_cents == 250"
            - "WholesaleAccount.${acc_id}.version == 2"

  # -------------------------- Errors (stubs) -------------------------------
  - section: errors
    instances:
      - name: corner_order_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_ORDER_NOT_FOUND]\""]
        distinguishing_aspect: "GET /orders/{unknown uuid} -> ERR_ORDER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
          assert:
            - "response error_id == ERR_ORDER_NOT_FOUND"

      - name: corner_account_not_found_returns_404
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_ACCOUNT_NOT_FOUND]\""]
        distinguishing_aspect: "GET /wholesale-accounts/{unknown uuid} -> ERR_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /wholesale-accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAgent
          assert:
            - "response error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: corner_error_invalid_state_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_INVALID_STATE]\""]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_fiscal_on_confirm"
          rationale: "ERR_INVALID_STATE is exercised as the winning error of the state-vs-fiscal §1.8 conflict."

      - name: corner_error_credit_limit_exceeded_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_CREDIT_LIMIT_EXCEEDED]\""]
        excluded_because:
          difficulty_instance: "boundary_precision_check / credit_limit_exact_boundary_on_confirm"
          rationale: "ERR_CREDIT_LIMIT_EXCEEDED is the reject path of the credit boundary §1.8 instance."

      - name: corner_error_lot_expired_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_LOT_EXPIRED]\""]
        excluded_because:
          difficulty_instance: "boundary_precision_check / freshness_expiry_inclusive_at_pack"
          rationale: "ERR_LOT_EXPIRED is the reject path of the freshness boundary §1.8 instance."

      - name: corner_error_line_window_conflict_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_LINE_WINDOW_CONFLICT]\""]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / production_line_window_overlap_half_open"
          rationale: "ERR_LINE_WINDOW_CONFLICT is asserted in the production-line overlap §1.8 instance."

      - name: corner_error_station_buffer_conflict_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_STATION_BUFFER_CONFLICT]\""]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / labeling_station_cleaning_buffer"
          rationale: "ERR_STATION_BUFFER_CONFLICT is asserted in the station buffer §1.8 instance."

      - name: corner_error_product_discontinued_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_PRODUCT_DISCONTINUED]\""]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / price_requires_product_active"
          rationale: "ERR_PRODUCT_DISCONTINUED is the reject path of the price-requires-active §1.8 instance."

      - name: corner_error_account_suspended_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_ACCOUNT_SUSPENDED]\""]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / confirm_requires_account_active"
          rationale: "ERR_ACCOUNT_SUSPENDED is the reject path of the confirm-requires-active §1.8 instance."

      - name: corner_error_allergen_label_required_covered
        claim_type: violation_to_error
        grounds: ["\"errors[ERR_ALLERGEN_LABEL_REQUIRED]\""]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / safety_beats_temporal_on_pack"
          rationale: "ERR_ALLERGEN_LABEL_REQUIRED is the winning error of the safety-vs-temporal §1.8 conflict."

  # -------------------------- Consistency model ----------------------------
  - section: consistency_model
    instances:
      - name: corner_immediate_visibility_on_confirm
        claim_type: immediate
        grounds: ["entities.WholesaleAccount.fields.committed_exposure_cents"]
        excluded_because:
          difficulty_instance: "compensating_invariant / credit_conservation_confirm_cancel"
          rationale: "Immediate reconciliation of committed/available credit on confirm and cancel is asserted in the credit-conservation §1.8 instance."
