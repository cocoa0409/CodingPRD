      - name: credit_approval_cascades_to_underfunded_program_status
        grounds:
          - state_machines.FeeCreditApplication.SUBMITTED_to_APPROVED
          - calculations.credit_adjusted_net_fee
          - entities.StormwaterAccount.fields.current_net_fee_cents
          - entities.PermitTerm.fields.projected_annual_revenue_cents
          - entities.PermitTerm.fields.funding_adequacy_status
        distinguishing_aspect: |
          A depth-4 chain on the funding spine rather than the compliance spine:
          FeeCreditApplication.APPROVED -> StormwaterAccount.total_credit_pct / net fee ->
          PermitTerm.projected_annual_revenue_cents -> funding_adequacy_status flips ADEQUATE
          to UNDERFUNDED as revenue falls from 29264 to 21202 against a 25000 target.
        test_recipe:
          setup:
            - "ACTIVE permit term with funding_target_cents 25000 and all six control measures"
            - "one COMMERCIAL account of 9020 sqft -> gross_billable_cents 29264, current_net_fee_cents 29264"
            - "PermitTerm.projected_annual_revenue_cents 29264 and funding_adequacy_status ADEQUATE"
            - "one SUBMITTED credit application for 0.2755 on that account"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-9020", owner_name: "Harborline Retail LLC", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              captures: { acct_a_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.2755, bmp_description: "Bioretention basin retrofit", expected_stormwater_account_version: "${acct_v1}" }
              as: UtilityBillingClerk
              captures: { app_a_id: $.data.id }
          trigger:
            - call: "POST /stormwater/fee-credit-applications/${app_a_id}/review"
              payload: { decision: "APPROVE", approved_credit_pct: 0.2755 }
              as: UtilityBillingClerk
          assert:
            - "level 1 — FeeCreditApplication.${app_a_id}.status == APPROVED and approved_credit_pct == 0.2755"
            - "level 2 — StormwaterAccount.${acct_a_id}.total_credit_pct == 0.2755 and current_net_fee_cents == 21202 (29264 - 8062)"
            - "level 3 — PermitTerm.${term_id}.projected_annual_revenue_cents == 21202"
            - "level 4 — PermitTerm.${term_id}.funding_adequacy_status == UNDERFUNDED"
            - "StormwaterAccount.${acct_a_id}.gross_billable_cents == 29264 unchanged: the credit never rewrites the gross fee"
            - "PermitTerm.${term_id}.compliance_posture == COMPLIANT: the funding spine does not touch the compliance census"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: missing_site_fk_outranks_inspection_subject_mismatch
        grounds:
          - validations[priority=50]
          - validations[priority=75]
          - errors.ERR_SITE_NOT_FOUND
          - errors.ERR_INSPECTION_SUBJECT_MISMATCH
        distinguishing_aspect: |
          business_referential (50) versus business_safety (75) on POST /stormwater/inspections:
          the body names a non-existent construction_site_id AND supplies a real
          post_construction_facility_id alongside inspection_type CONSTRUCTION_ESC, so the FK
          check and the subject-set check are both violated; only the referential error surfaces.
        test_recipe:
          setup:
            - "ACTIVE permit term with all six control measures"
            - "site SITE-D with plan_status APPROVED and field_status ACTIVE_DISTURBANCE"
            - "a real PostConstructionFacility on that site, so the second FK resolves"
