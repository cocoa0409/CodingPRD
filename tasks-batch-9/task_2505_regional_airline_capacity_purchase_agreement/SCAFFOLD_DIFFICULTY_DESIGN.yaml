          A DIFFERENT entity pair from the induction gate — Invoice ← PassThroughClaim.
          A DRAFT invoice that was legally created becomes un-issuable the moment a
          new pass-through claim is opened on its cycle, and becomes issuable again
          only once that foreign claim reaches a terminal state; the invoice's own
          frozen components never change, so the dependency is purely on the other
          entity's status.
