# =============================================================================
# task_0713 — Commercial Cleaning Bid & Janitorial Sales (Expert)
# Seed tables §1.0–§1.7. §1.8 / §1.9 live in sibling files.
# =============================================================================

scenario: |
  Commercial Cleaning Bid & Janitorial Sales: RFP/walkthrough & square-footage
  bid, scope/frequency & labor-loading estimate, proposal & margin, contract &
  start-up, supply/equipment provisioning, account onboarding handoff,
  retention/renewal, upsell (floor/window)

domain_name: commercial-cleaning-janitorial
api_prefix: /accounts

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic            # proposal revision loops + parallel contract dims
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many                       # CrewShift links Crew <-> StartupPlan
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (13 entities)
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Prospect/customer legal name" }
      - { name: industry, type: enum, source: input, description: "OFFICE | MEDICAL | INDUSTRIAL | RETAIL | EDUCATION" }
      - { name: owner_user_id, type: string, source: input, description: "AccountManager user id who owns this account post-handoff; null until onboarding handoff" }
      - { name: lifecycle_stage, type: enum, source: system, description: "PROSPECT -> ACTIVE_CUSTOMER -> CHURNED; set by handoff and renewal flows" }
      - { name: health_score, type: integer, source: computed, default: 100, description: "Retention health 0..100; debited by missed-startup and churn-risk cascades, floored at 0" }

  - name: RfpOpportunity
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: title, type: string, source: input, description: "RFP title" }
      - { name: due_at, type: datetime, source: input, description: "ISO8601 proposal-submission deadline" }
      - { name: estimated_total_sqft, type: integer, source: input, description: "Buyer-stated total square footage; must be > 0" }
      - { name: status, type: enum, source: system, description: "OPEN -> WALKTHROUGH_SCHEDULED -> BIDDING -> PROPOSED -> WON / LOST; PROPOSED->BIDDING on revision (cyclic)" }

  - name: Walkthrough
    parent: RfpOpportunity
    common_fields: true
    fields:
      - { name: rfp_id, type: string, source: input, description: "FK -> RfpOpportunity.id" }
      - { name: site_contact_id, type: string, source: input, description: "FK -> SiteContact.id; whose availability windows gate scheduling" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 walkthrough start (closed interval start)" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 walkthrough end; must be > start_at" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETED / NO_SHOW / CANCELLED" }

  - name: SiteContact
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: full_name, type: string, source: input, description: "On-site contact name" }
      - { name: avail_start_at, type: datetime, source: input, description: "ISO8601 inclusive start of the contact's bookable availability window" }
      - { name: avail_end_at, type: datetime, source: input, description: "ISO8601 inclusive end of availability window; must be > avail_start_at" }

  - name: ServiceArea
    parent: RfpOpportunity
    common_fields: true
    fields:
      - { name: rfp_id, type: string, source: input, description: "FK -> RfpOpportunity.id" }
      - { name: label, type: string, source: input, description: "Area label e.g. 'Main office floor'" }
      - { name: sqft, type: integer, source: input, description: "Cleanable square footage; must be > 0" }
      - { name: soil_level, type: enum, source: input, description: "LIGHT | MEDIUM | HEAVY; selects production_rate and supply rate" }
      - { name: frequency_per_week, type: integer, source: input, description: "Cleanings per week; integer 1..7" }
      - { name: weekly_hours, type: number, source: computed, description: "Read-only = sqft/production_rate(soil_level) * frequency_per_week, rounded per §1.3 load_estimate variant" }

  - name: BidEstimate
    parent: RfpOpportunity
    common_fields: true
    fields:
      - { name: rfp_id, type: string, source: input, description: "FK -> RfpOpportunity.id" }
      - { name: base_wage_cents, type: integer, source: input, description: "Cleaner base hourly wage in cents; must be > 0" }
      - { name: target_margin_pct, type: number, source: input, description: "Desired gross margin 0.00..0.90 used to mark up total_cost" }
      - { name: loading_method, type: enum, source: input, default: "ESTIMATE", description: "ESTIMATE (round-then-sum) | LOADED (sum-then-round); picks §1.3 load_estimate variant" }
      - { name: monthly_labor_hours, type: number, source: computed, description: "Read-only = sum of ServiceArea weekly_hours * WEEKS_PER_MONTH per §1.3 labor_load" }
      - { name: labor_cost_cents, type: integer, source: computed, description: "Read-only loaded labor cost, §1.3 bid_buildup" }
      - { name: supply_cost_cents, type: integer, source: computed, description: "Read-only monthly supply cost, §1.3 bid_buildup" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Read-only = labor + supply + equipment + overhead, §1.3 bid_buildup" }
      - { name: base_bid_cents, type: integer, source: computed, description: "Read-only = total_cost / (1 - target_margin_pct), §1.3 bid_buildup" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PRICED; recompute on PRICED re-run keeps PRICED" }

  - name: Proposal
    parent: RfpOpportunity
    common_fields: true
    fields:
      - { name: rfp_id, type: string, source: input, description: "FK -> RfpOpportunity.id" }
      - { name: bid_estimate_id, type: string, source: input, description: "FK -> BidEstimate.id; must be PRICED" }
      - { name: monthly_price_cents, type: integer, source: computed, description: "Read-only final price = base_bid less volume_discount, §1.3 proposal_pricing" }
      - { name: achieved_margin_pct, type: number, source: computed, description: "Read-only = (monthly_price - total_cost)/monthly_price, §1.3 proposal_pricing" }
      - { name: revision_round, type: integer, source: system, default: 1, description: "Increments each time a SENT proposal is revised back to DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SENT -> ACCEPTED / DECLINED; SENT -> DRAFT on revise (cyclic)" }

  - name: CleaningContract
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id; must be ACCEPTED" }
      - { name: monthly_value_cents, type: integer, source: system, description: "Snapshot of Proposal.monthly_price_cents at signing (immutable until renewal)" }
      - { name: term_months, type: integer, source: input, description: "Contract length in months; must be >= 1" }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT -> SIGNED -> STARTUP -> SERVICING -> ENDED; parallel to billing_status" }
      - { name: billing_status, type: enum, source: system, description: "PENDING -> ACTIVE -> SUSPENDED -> CLOSED; parallel axis, evolves independently of lifecycle_status" }

  - name: StartupPlan
    parent: CleaningContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> CleaningContract.id; must be SIGNED" }
      - { name: planned_monthly_hours, type: number, source: system, description: "Snapshot of BidEstimate.monthly_labor_hours via the contract's proposal" }
      - { name: allocated_hours, type: number, source: computed, description: "Read-only sum of active CrewShift.shift_hours, §1.3 hour_allocation" }
      - { name: go_live_at, type: datetime, source: input, description: "ISO8601 target service start; must be > now" }
      - { name: status, type: enum, source: system, description: "PLANNING -> CREWED -> READY -> LIVE / ABORTED; READY requires fully allocated hours" }

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Crew name" }
      - { name: weekly_capacity_hours, type: number, source: input, description: "Max schedulable hours/week for this crew; must be > 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RETIRED" }

  - name: CrewShift
    parent: StartupPlan
    common_fields: true
    fields:
      - { name: startup_plan_id, type: string, source: input, description: "FK -> StartupPlan.id; must be PLANNING or CREWED" }
      - { name: crew_id, type: string, source: input, description: "FK -> Crew.id; must be AVAILABLE" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 shift start (half-open interval start)" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 shift end; must be > start_at" }
      - { name: shift_hours, type: number, source: computed, description: "Read-only = (end_at - start_at) in hours, 2dp" }
      - { name: status, type: enum, source: system, description: "ASSIGNED -> CANCELLED; cancel releases allocated hours back" }

  - name: SupplyBudget
    parent: CleaningContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> CleaningContract.id" }
      - { name: total_cents, type: integer, source: input, description: "Total monthly supply budget in cents; must be > 0" }
      - { name: committed_cents, type: integer, source: computed, default: 0, description: "Read-only sum of APPROVED SupplyRequisition.amount_cents" }
      - { name: remaining_cents, type: integer, source: computed, description: "Read-only = total_cents - committed_cents; must satisfy committed + remaining == total" }

  - name: SupplyRequisition
    parent: SupplyBudget
    common_fields: true
    fields:
      - { name: supply_budget_id, type: string, source: input, description: "FK -> SupplyBudget.id" }
      - { name: item_label, type: string, source: input, description: "Supply/equipment item" }
      - { name: amount_cents, type: integer, source: input, description: "Requested spend in cents; must be > 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED -> CANCELLED; APPROVED debits budget, CANCELLED credits back" }

  - name: RenewalCycle
    parent: CleaningContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> CleaningContract.id; must be SERVICING" }
      - { name: escalation_method, type: enum, source: input, description: "CPI | FLAT; selects §1.3 renewal_escalation variant" }
      - { name: proposed_monthly_cents, type: integer, source: computed, description: "Read-only escalated price, §1.3 renewal_escalation" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OFFERED -> RENEWED / LAPSED; RENEWED bumps contract value, LAPSED churns account" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- RfpOpportunity : cyclic (PROPOSED -> BIDDING revision loop) ----
  - entity: RfpOpportunity
    initial_state: OPEN
    terminal_states: [WON, LOST]
    transitions:
      - from: OPEN
        to: WALKTHROUGH_SCHEDULED
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/walkthroughs"
        actor: SalesRep
        preconditions:
          - "RfpOpportunity.status == OPEN (ERR_INVALID_STATE)"
          - "Walkthrough [start_at,end_at] lies within SiteContact [avail_start_at,avail_end_at] inclusive (ERR_OUTSIDE_AVAILABILITY)"
          - "No other SCHEDULED Walkthrough on the same SiteContact overlaps [start_at,end_at] as a closed interval (ERR_WALKTHROUGH_OVERLAP)"
        side_effects:
          - "Create Walkthrough in SCHEDULED"
      - from: WALKTHROUGH_SCHEDULED
        to: BIDDING
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/walkthroughs/{wtId}/complete"
        actor: SalesRep
        preconditions:
          - "Walkthrough.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Set Walkthrough.status = COMPLETED"
      - from: BIDDING
        to: PROPOSED
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/send"
        actor: SalesRep
        preconditions:
          - "Proposal.status == DRAFT (ERR_INVALID_STATE)"
          - "Proposal.achieved_margin_pct*100 >= MIN_MARGIN_PCT (ERR_MARGIN_BELOW_FLOOR)"
        side_effects:
          - "Set Proposal.status = SENT"
      - from: PROPOSED
        to: BIDDING
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/revise"
        actor: SalesRep
        preconditions:
          - "Proposal.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Set Proposal.status = DRAFT"
          - "Increment Proposal.revision_round by 1"
        note: "Cyclic: PROPOSED returns to BIDDING for re-pricing/re-send."
      - from: PROPOSED
        to: WON
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/accept"
        actor: SalesRep
        preconditions:
          - "Proposal.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Set Proposal.status = ACCEPTED"
      - from: PROPOSED
        to: LOST
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/decline"
        actor: SalesRep
        preconditions:
          - "Proposal.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Set Proposal.status = DECLINED"

  # ---- Walkthrough : SCHEDULED -> COMPLETED / NO_SHOW / CANCELLED ----
  - entity: Walkthrough
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/walkthroughs/{wtId}/complete"
        actor: SalesRep
        preconditions:
          - "Walkthrough.status == SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "Parent RfpOpportunity.status WALKTHROUGH_SCHEDULED -> BIDDING"

  # ---- Crew : AVAILABLE -> RETIRED ----
  - entity: Crew
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /crews/{crewId}/retire"
        actor: OperationsManager
        preconditions:
          - "Crew.status == AVAILABLE (ERR_INVALID_STATE)"
        side_effects: []

  # ---- Proposal : its own DRAFT<->SENT cycle (mirrors RFP revise loop) ----
  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/send"
        actor: SalesRep
        preconditions:
          - "Parent RfpOpportunity.status == BIDDING (ERR_INVALID_STATE)"
          - "Proposal.achieved_margin_pct*100 >= MIN_MARGIN_PCT (ERR_MARGIN_BELOW_FLOOR)"
        side_effects:
          - "Parent RfpOpportunity.status -> PROPOSED"
      - from: SENT
        to: DRAFT
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/revise"
        actor: SalesRep
        preconditions:
          - "Proposal.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Increment revision_round by 1"
          - "Parent RfpOpportunity.status -> BIDDING"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/accept"
        actor: SalesRep
        preconditions:
          - "Proposal.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Parent RfpOpportunity.status -> WON"
      - from: SENT
        to: DECLINED
        trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/decline"
        actor: SalesRep
        preconditions:
          - "Proposal.status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "Parent RfpOpportunity.status -> LOST"

  # ---- CleaningContract : PARALLEL dimensions (lifecycle_status x billing_status) ----
  - entity: CleaningContract
    initial_state: DRAFT          # lifecycle_status initial; billing_status initial = PENDING
    terminal_states: [ENDED]
    transitions:
      # --- lifecycle_status axis ---
      - from: DRAFT
        to: SIGNED
        trigger: "POST /accounts/{accountId}/contracts/{contractId}/sign"
        actor: SalesRep
        preconditions:
          - "lifecycle_status == DRAFT (ERR_INVALID_STATE)"
          - "Linked Proposal (CleaningContract.proposal_id) is ACCEPTED (ERR_PROPOSAL_NOT_ACCEPTED)"
        side_effects:
          - "Snapshot monthly_value_cents from Proposal.monthly_price_cents"
          - "Create StartupPlan in PLANNING with planned_monthly_hours snapshot"
      - from: SIGNED
        to: STARTUP
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/crew (first ASSIGNED shift)"
        actor: OperationsManager
        preconditions:
          - "lifecycle_status == SIGNED (ERR_INVALID_STATE)"
        side_effects:
          - "StartupPlan.status PLANNING -> CREWED on first shift"
      - from: STARTUP
        to: SERVICING
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/go-live"
        actor: OperationsManager
        preconditions:
          - "lifecycle_status == STARTUP (ERR_INVALID_STATE)"
          - "StartupPlan.status == READY (ERR_STARTUP_NOT_READY)"
        side_effects:
          - "StartupPlan.status READY -> LIVE"
          - "Account.lifecycle_stage PROSPECT -> ACTIVE_CUSTOMER (onboarding handoff)"
          - "billing_status PENDING -> ACTIVE (cross-axis activation)"
      - from: SERVICING
        to: ENDED
        trigger: "POST /accounts/{accountId}/contracts/{contractId}/end"
        actor: AccountManager
        preconditions:
          - "lifecycle_status == SERVICING (ERR_INVALID_STATE)"
        side_effects:
          - "billing_status -> CLOSED"
          - "Account.lifecycle_stage -> CHURNED if no other SERVICING contract"
      # --- billing_status axis (independent) ---
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /accounts/{accountId}/contracts/{contractId}/billing/suspend"
        actor: AccountManager
        preconditions:
          - "billing_status == ACTIVE (ERR_INVALID_STATE)"
          - "lifecycle_status == SERVICING (ERR_CONTRACT_NOT_SERVICING)"
        side_effects:
          - "Account.health_score debited by HEALTH_SUSPEND_PENALTY, floored at 0"
        note: "Parallel axis: billing transitions do not change lifecycle_status."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /accounts/{accountId}/contracts/{contractId}/billing/resume"
        actor: AccountManager
        preconditions:
          - "billing_status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Account.health_score credited by HEALTH_SUSPEND_PENALTY, capped at 100"

  # ---- StartupPlan : branching READY/ABORTED with allocation gate ----
  - entity: StartupPlan
    initial_state: PLANNING
    terminal_states: [LIVE, ABORTED]
    transitions:
      - from: PLANNING
        to: CREWED
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/crew"
        actor: OperationsManager
        preconditions:
          - "StartupPlan.status == PLANNING (ERR_INVALID_STATE)"
          - "Parent CleaningContract.lifecycle_status == SIGNED (ERR_CONTRACT_NOT_SIGNED)"
          - "Crew.status == AVAILABLE (ERR_CREW_UNAVAILABLE)"
          - "New shift does not overlap an existing ASSIGNED CrewShift on the same Crew under half-open + CREW_TRAVEL_BUFFER_MIN buffer (ERR_SHIFT_OVERLAP)"
        side_effects:
          - "Create CrewShift in ASSIGNED; recompute allocated_hours; advance CleaningContract.lifecycle_status SIGNED -> STARTUP"
      - from: CREWED
        to: CREWED
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/crew (additional shift)"
        actor: OperationsManager
        preconditions:
          - "StartupPlan.status == CREWED (ERR_INVALID_STATE)"
          - "Crew.status == AVAILABLE (ERR_CREW_UNAVAILABLE)"
          - "No half-open buffered overlap on the Crew (ERR_SHIFT_OVERLAP)"
        side_effects:
          - "Create CrewShift; recompute allocated_hours"
      - from: CREWED
        to: READY
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/mark-ready"
        actor: OperationsManager
        preconditions:
          - "StartupPlan.status == CREWED (ERR_INVALID_STATE)"
          - "allocated_hours >= planned_monthly_hours (ERR_HOURS_UNDERALLOCATED)"
        side_effects: []
      - from: READY
        to: LIVE
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/go-live"
        actor: OperationsManager
        preconditions:
          - "StartupPlan.status == READY (ERR_INVALID_STATE)"
        side_effects:
          - "Advance CleaningContract.lifecycle_status STARTUP -> SERVICING"
      - from: PLANNING
        to: ABORTED
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/abort"
        actor: OperationsManager
        preconditions:
          - "StartupPlan.status IN {PLANNING, CREWED, READY} (ERR_INVALID_STATE)"
        side_effects:
          - "Cancel all ASSIGNED CrewShift (status -> CANCELLED), each releasing allocated_hours back"
          - "Account.health_score debited by HEALTH_ABORT_PENALTY, floored at 0"
      - from: CREWED
        to: ABORTED
        trigger: "POST /accounts/{accountId}/startup-plans/{planId}/abort"
        actor: OperationsManager
        preconditions:
          - "StartupPlan.status IN {PLANNING, CREWED, READY} (ERR_INVALID_STATE)"
        side_effects:
          - "Cancel all ASSIGNED CrewShift, releasing allocated_hours"
          - "Account.health_score debited by HEALTH_ABORT_PENALTY, floored at 0"

  # ---- CrewShift : simple ASSIGNED -> CANCELLED with compensating release ----
  - entity: CrewShift
    initial_state: ASSIGNED
    terminal_states: [CANCELLED]
    transitions:
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/crew-shifts/{shiftId}/cancel"
        actor: OperationsManager
        preconditions:
          - "CrewShift.status == ASSIGNED (ERR_INVALID_STATE)"
          - "Parent StartupPlan.status != LIVE (ERR_INVALID_STATE)"
        side_effects:
          - "StartupPlan.allocated_hours -= shift_hours (compensating release; invariant allocated + unallocated == planned)"

  # ---- SupplyRequisition : REQUESTED -> APPROVED -> CANCELLED with budget conservation ----
  - entity: SupplyRequisition
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /accounts/{accountId}/supply-requisitions/{reqId}/approve"
        actor: OperationsManager
        preconditions:
          - "SupplyRequisition.status == REQUESTED (ERR_INVALID_STATE)"
          - "amount_cents <= SupplyBudget.remaining_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "SupplyBudget.committed_cents += amount_cents; remaining_cents recomputed"
          - "Increment SupplyBudget.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/supply-requisitions/{reqId}/cancel"
        actor: OperationsManager
        preconditions:
          - "SupplyRequisition.status == APPROVED (ERR_INVALID_STATE)"
        side_effects:
          - "SupplyBudget.committed_cents -= amount_cents (compensating credit; invariant committed + remaining == total)"
          - "Increment SupplyBudget.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /accounts/{accountId}/supply-requisitions/{reqId}/cancel"
        actor: OperationsManager
        preconditions:
          - "SupplyRequisition.status == REQUESTED (ERR_INVALID_STATE)"
        side_effects:
          - "No budget change (was never committed)"

  # ---- RenewalCycle : DRAFT -> OFFERED -> RENEWED / LAPSED ----
  - entity: RenewalCycle
    initial_state: DRAFT
    terminal_states: [RENEWED, LAPSED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /accounts/{accountId}/renewal-cycles/{cycleId}/offer"
        actor: AccountManager
        preconditions:
          - "RenewalCycle.status == DRAFT (ERR_INVALID_STATE)"
          - "Parent CleaningContract.lifecycle_status == SERVICING (ERR_CONTRACT_NOT_SERVICING)"
        side_effects: []
      - from: OFFERED
        to: RENEWED
        trigger: "POST /accounts/{accountId}/renewal-cycles/{cycleId}/accept"
        actor: AccountManager
        preconditions:
          - "RenewalCycle.status == OFFERED (ERR_INVALID_STATE)"
        side_effects:
          - "CleaningContract.monthly_value_cents = proposed_monthly_cents"
          - "Account.health_score credited by HEALTH_RENEW_BONUS, capped at 100"
      - from: OFFERED
        to: LAPSED
        trigger: "POST /accounts/{accountId}/renewal-cycles/{cycleId}/lapse"
        actor: AccountManager
        preconditions:
          - "RenewalCycle.status == OFFERED (ERR_INVALID_STATE)"
        side_effects:
          - "CleaningContract.lifecycle_status SERVICING -> ENDED"
          - "CleaningContract.billing_status -> CLOSED"
          - "Account.lifecycle_stage -> CHURNED if no other SERVICING contract; Account.health_score debited by HEALTH_LAPSE_PENALTY, floored at 0"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: requisition-approve-stale-budget
    parent_entity: SupplyBudget
    write_endpoint: "POST /accounts/{accountId}/supply-requisitions/{reqId}/approve"
    occ_field: "expected_supply_budget_version"
    description: |
      Approving a SupplyRequisition against a SupplyBudget whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another approval has already committed funds (legitimately
      reducing remaining_cents) and the current writer's view of the budget is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: renewal-accept-stale-contract
    parent_entity: CleaningContract
    write_endpoint: "POST /accounts/{accountId}/renewal-cycles/{cycleId}/accept"
    occ_field: "expected_contract_version"
    description: |
      Accepting a RenewalCycle against a CleaningContract whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another renewal or billing action already mutated the contract
      (changing monthly_value_cents or status) and the current view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: labor_load
    trigger: "POST /accounts/{accountId}/rfps/{rfpId}/bid-estimates/{bidId}/price (BidEstimate DRAFT->PRICED)"
    algorithm: aggregation
    formula: |
      production_rate(soil_level): LIGHT=4000, MEDIUM=3000, HEAVY=2000 (sqft/hour)
      per_area_weekly_hours(area) = (area.sqft / production_rate(area.soil_level)) * area.frequency_per_week
      # ESTIMATE variant (round-then-sum): weekly_total = sum( round(per_area_weekly_hours, 2) )
      # LOADED   variant (sum-then-round): weekly_total = round( sum(per_area_weekly_hours), 2 )
      monthly_labor_hours = round(weekly_total * WEEKS_PER_MONTH, 2)
    input_set: "All ServiceArea rows whose rfp_id == BidEstimate.rfp_id; no status filter (areas have no lifecycle)."
    constants:
      PROD_RATE_LIGHT: 4000
      PROD_RATE_MEDIUM: 3000
      PROD_RATE_HEAVY: 2000
      WEEKS_PER_MONTH: 4.33
    precision: "2 decimal places, round_half_up; rounding ORDER is pinned by loading_method (round-then-sum vs sum-then-round)."
    variants:
      - name: ESTIMATE
        when: "BidEstimate.loading_method == ESTIMATE"
        difference: "Round each area's weekly hours to 2dp BEFORE summing (round-then-sum)."
      - name: LOADED
        when: "BidEstimate.loading_method == LOADED"
        difference: "Sum raw area weekly hours THEN round once (sum-then-round); diverges from ESTIMATE in the cents."

  - name: bid_buildup
    trigger: "POST /accounts/{accountId}/rfps/{rfpId}/bid-estimates/{bidId}/price (BidEstimate DRAFT->PRICED)"
    algorithm: tiered_pricing
    formula: |
      # labor burden tier on monthly_labor_hours (instantaneous, >= boundary):
      burden = 1.20 if monthly_labor_hours <= 160
               else 1.28 if monthly_labor_hours <= 320
               else 1.35
      loaded_wage_cents = round_half_up(base_wage_cents * burden)         # cents, integer
      labor_cost_cents  = round_half_up(monthly_labor_hours * loaded_wage_cents)
      supply_cost_cents = round_half_up( sum over ServiceArea of
                            sqft * SUPPLY_RATE_CENTS_PER_SQFT(soil_level) )
      direct_cost_cents = labor_cost_cents + supply_cost_cents + EQUIP_AMORT_CENTS
      overhead_cents    = round_half_up(direct_cost_cents * OVERHEAD_PCT)
      total_cost_cents  = direct_cost_cents + overhead_cents
      base_bid_cents    = round_half_up(total_cost_cents / (1 - target_margin_pct))
    input_set: "ServiceArea rows of the RFP; monthly_labor_hours from labor_load variant in force."
    constants:
      SUPPLY_RATE_CENTS_PER_SQFT_LIGHT: 1.0
      SUPPLY_RATE_CENTS_PER_SQFT_MEDIUM: 1.5
      SUPPLY_RATE_CENTS_PER_SQFT_HEAVY: 3.0
      EQUIP_AMORT_CENTS: 7500
      OVERHEAD_PCT: 0.15
      BURDEN_T1: 1.20
      BURDEN_T2: 1.28
      BURDEN_T3: 1.35
      BURDEN_BREAK_1: 160
      BURDEN_BREAK_2: 320
    precision: "All money in integer cents, round_half_up at each pinned step; burden multiplies wage BEFORE labor_cost."

  - name: proposal_pricing
    trigger: "POST /accounts/{accountId}/rfps/{rfpId}/proposals (Proposal create)"
    algorithm: tiered_pricing
    formula: |
      # circular-looking: volume_discount keyed on the base_bid tier, then margin recomputed on the discounted price.
      # Evaluation order is PINNED: (1) read base_bid, (2) pick discount tier from base_bid, (3) apply, (4) recompute margin.
      base_bid_cents = BidEstimate.base_bid_cents
      discount_pct = 0.00 if base_bid_cents < 500000
                     else 0.03 if base_bid_cents < 800000
                     else 0.05
      monthly_price_cents = round_half_up(base_bid_cents * (1 - discount_pct))
      achieved_margin_pct = (monthly_price_cents - BidEstimate.total_cost_cents) / monthly_price_cents
    input_set: "Single referenced BidEstimate (must be PRICED)."
    constants:
      DISCOUNT_BREAK_1_CENTS: 500000
      DISCOUNT_BREAK_2_CENTS: 800000
      DISCOUNT_T1_PCT: 0.03
      DISCOUNT_T2_PCT: 0.05
      MIN_MARGIN_PCT: 15.0
    precision: "monthly_price_cents integer; achieved_margin_pct ratio kept to 4dp internally, compared *100 vs MIN_MARGIN_PCT."

  - name: renewal_escalation
    trigger: "POST /accounts/{accountId}/renewal-cycles (RenewalCycle create)"
    algorithm: threshold
    formula: |
      base = CleaningContract.monthly_value_cents
      # CPI variant: percentage escalation; FLAT variant: fixed dollar add.
      proposed_monthly_cents = round_half_up(base * (1 + CPI_PCT))   if escalation_method == CPI
                               else base + FLAT_INCREASE_CENTS        if escalation_method == FLAT
    input_set: "Single CleaningContract (must be SERVICING)."
    constants:
      CPI_PCT: 0.032
      FLAT_INCREASE_CENTS: 15000
    precision: "Integer cents, round_half_up."
    variants:
      - name: CPI
        when: "escalation_method == CPI"
        difference: "Multiplicative escalation base*(1+CPI_PCT)."
      - name: FLAT
        when: "escalation_method == FLAT"
        difference: "Additive escalation base + FLAT_INCREASE_CENTS; diverges from CPI for the same contract value."

  - name: hour_allocation
    trigger: "On CrewShift create/cancel and StartupPlan abort"
    algorithm: aggregation
    formula: |
      allocated_hours = round_half_up( sum of shift_hours over CrewShift
                          where startup_plan_id == plan.id AND status == ASSIGNED )
      unallocated_hours = max(planned_monthly_hours - allocated_hours, 0)
      # invariant pinned: allocated_hours + unallocated_hours == planned_monthly_hours when fully crewed within plan
    input_set: "CrewShift rows of the plan filtered to status == ASSIGNED."
    constants: {}
    precision: "2 decimal places, round_half_up; CrewShift order is created_at ASC for deterministic accumulation."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path resources exist, validated left-to-right (account, then rfp, then nested)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: existence, check: "Referenced FK body ids (bid_estimate_id, proposal_id, crew_id, site_contact_id, supply_budget_id) exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "create/link endpoints" }
  - { priority: 5, category: business_constraint, check: "Required input fields present and well-typed", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 6, category: business_constraint, check: "Enum fields are within declared domain (industry, soil_level, loading_method, escalation_method)", error_id: ERR_INVALID_ENUM, http_status: 422, applies_to: "all writes" }
  - { priority: 7, category: business_constraint, check: "Numeric ranges: sqft>0, frequency_per_week in 1..7, target_margin_pct in 0..0.90, term_months>=1, end>start", error_id: ERR_INVALID_RANGE, http_status: 422, applies_to: "ServiceArea, BidEstimate, Walkthrough, CrewShift, CleaningContract" }
  - { priority: 8, category: state, check: "Target resource is in the correct state for this transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transitions" }
  - { priority: 9, category: business_referential, check: "Cross-entity state preconditions (Proposal ACCEPTED before sign; contract SIGNED before crew; contract SERVICING before renewal/suspend)", error_id: ERR_PROPOSAL_NOT_ACCEPTED, http_status: 409, applies_to: "sign/crew/renewal" }
  - { priority: 10, category: business_temporal, check: "Walkthrough window lies within SiteContact availability (inclusive)", error_id: ERR_OUTSIDE_AVAILABILITY, http_status: 422, applies_to: "walkthrough create" }
  - { priority: 11, category: business_temporal, check: "Walkthrough closed-interval overlap on the same SiteContact", error_id: ERR_WALKTHROUGH_OVERLAP, http_status: 409, applies_to: "walkthrough create" }
  - { priority: 12, category: business_temporal, check: "CrewShift half-open + travel-buffer overlap on the same Crew", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "crew shift create" }
  - { priority: 13, category: business_safety, check: "Crew is AVAILABLE before assignment", error_id: ERR_CREW_UNAVAILABLE, http_status: 409, applies_to: "crew shift create" }
  - { priority: 14, category: business_constraint, check: "StartupPlan hours fully allocated before READY", error_id: ERR_HOURS_UNDERALLOCATED, http_status: 409, applies_to: "mark-ready" }
  - { priority: 15, category: business_fiscal, check: "Proposal achieved margin >= MIN_MARGIN_PCT before send", error_id: ERR_MARGIN_BELOW_FLOOR, http_status: 422, applies_to: "proposal send" }
  - { priority: 16, category: business_fiscal, check: "SupplyRequisition amount <= budget remaining at approval", error_id: ERR_BUDGET_EXCEEDED, http_status: 409, applies_to: "requisition approve" }
  - { priority: 17, category: state, check: "OCC expected_*_version matches parent version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "requisition approve, renewal accept" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Account ----
  - { method: POST, path: "/accounts", description: "Create prospect account", roles: [SalesRep], code: 201, input: [legal_name, industry], output: Account, side_effects: ["lifecycle_stage=PROSPECT", "health_score=100"] }
  - { method: GET, path: "/accounts/{accountId}", description: "Get account", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: Account, side_effects: [] }
  - { method: GET, path: "/accounts", description: "List accounts", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["owner_user_id?", "limit?", "offset?"], output: "Account[]", side_effects: [] }

  # ---- SiteContact (FK -> Account) ----
  - { method: POST, path: "/accounts/{accountId}/site-contacts", description: "Add a site contact with availability window", roles: [SalesRep], code: 201, input: [full_name, avail_start_at, avail_end_at], output: SiteContact, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/site-contacts", description: "List site contacts of account (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: "SiteContact[]", side_effects: [] }

  # ---- RfpOpportunity (FK -> Account) ----
  - { method: POST, path: "/accounts/{accountId}/rfps", description: "Create RFP opportunity", roles: [SalesRep], code: 201, input: [title, due_at, estimated_total_sqft], output: RfpOpportunity, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}", description: "Get RFP", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: RfpOpportunity, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/rfps", description: "List RFPs of account (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "RfpOpportunity[]", side_effects: [] }

  # ---- Walkthrough (FK -> RfpOpportunity, FK -> SiteContact) ----
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/walkthroughs", description: "Schedule walkthrough (RFP OPEN->WALKTHROUGH_SCHEDULED)", roles: [SalesRep], code: 201, input: [site_contact_id, start_at, end_at], output: Walkthrough, side_effects: ["RFP->WALKTHROUGH_SCHEDULED", "Walkthrough=SCHEDULED"] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}/walkthroughs", description: "List walkthroughs of RFP (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["site_contact_id?"], output: "Walkthrough[]", side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/walkthroughs/{wtId}/complete", description: "Complete walkthrough (RFP->BIDDING)", roles: [SalesRep], code: 200, input: [], output: Walkthrough, side_effects: ["Walkthrough=COMPLETED", "RFP->BIDDING"] }

  # ---- ServiceArea (FK -> RfpOpportunity) ----
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/service-areas", description: "Add a service area to the RFP scope", roles: [SalesRep, BidEstimator], code: 201, input: [label, sqft, soil_level, frequency_per_week], output: ServiceArea, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}/service-areas", description: "List service areas of RFP (FK reverse-reach)", roles: [SalesRep, BidEstimator, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: "ServiceArea[]", side_effects: [] }

  # ---- BidEstimate (FK -> RfpOpportunity) ----
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/bid-estimates", description: "Create a draft bid estimate", roles: [BidEstimator], code: 201, input: [base_wage_cents, target_margin_pct, "loading_method?"], output: BidEstimate, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}/bid-estimates/{bidId}", description: "Get bid estimate", roles: [BidEstimator, SalesRep, PlatformAdmin], code: 200, input: [], output: BidEstimate, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}/bid-estimates", description: "List bid estimates of RFP (FK reverse-reach)", roles: [BidEstimator, SalesRep, PlatformAdmin], code: 200, input: [], output: "BidEstimate[]", side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/bid-estimates/{bidId}/price", description: "Run labor_load + bid_buildup (DRAFT->PRICED, recompute idempotent on PRICED)", roles: [BidEstimator], code: 200, input: [], output: BidEstimate, side_effects: ["compute monthly_labor_hours, labor_cost_cents, supply_cost_cents, total_cost_cents, base_bid_cents", "status->PRICED"] }

  # ---- Proposal (FK -> RfpOpportunity, FK -> BidEstimate) ----
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/proposals", description: "Create proposal from a PRICED bid (runs proposal_pricing)", roles: [SalesRep], code: 201, input: [bid_estimate_id], output: Proposal, side_effects: ["compute monthly_price_cents, achieved_margin_pct", "status=DRAFT", "revision_round=1"] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}", description: "Get proposal", roles: [SalesRep, AccountManager, PlatformAdmin], code: 200, input: [], output: Proposal, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/rfps/{rfpId}/proposals", description: "List proposals of RFP (FK reverse-reach)", roles: [SalesRep, AccountManager, PlatformAdmin], code: 200, input: ["bid_estimate_id?"], output: "Proposal[]", side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/send", description: "Send proposal (margin floor gate; RFP->PROPOSED)", roles: [SalesRep], code: 200, input: [], output: Proposal, side_effects: ["status DRAFT->SENT", "RFP BIDDING->PROPOSED"] }
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/revise", description: "Revise sent proposal (cyclic; RFP->BIDDING)", roles: [SalesRep], code: 200, input: [], output: Proposal, side_effects: ["status SENT->DRAFT", "revision_round+1", "RFP PROPOSED->BIDDING"] }
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/accept", description: "Accept proposal (RFP->WON)", roles: [SalesRep], code: 200, input: [], output: Proposal, side_effects: ["status SENT->ACCEPTED", "RFP PROPOSED->WON"] }
  - { method: POST, path: "/accounts/{accountId}/rfps/{rfpId}/proposals/{proposalId}/decline", description: "Decline proposal (RFP->LOST)", roles: [SalesRep], code: 200, input: [], output: Proposal, side_effects: ["status SENT->DECLINED", "RFP PROPOSED->LOST"] }

  # ---- CleaningContract (FK -> Account, FK -> Proposal) ----
  - { method: POST, path: "/accounts/{accountId}/contracts", description: "Create contract draft from an ACCEPTED proposal", roles: [SalesRep], code: 201, input: [proposal_id, term_months], output: CleaningContract, side_effects: ["lifecycle_status=DRAFT", "billing_status=PENDING"] }
  - { method: GET, path: "/accounts/{accountId}/contracts/{contractId}", description: "Get contract", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: CleaningContract, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/contracts", description: "List contracts of account (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["proposal_id?", "limit?", "offset?"], output: "CleaningContract[]", side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/sign", description: "Sign contract (creates StartupPlan; lifecycle DRAFT->SIGNED)", roles: [SalesRep], code: 200, input: [], output: CleaningContract, side_effects: ["snapshot monthly_value_cents", "create StartupPlan PLANNING", "lifecycle->SIGNED"] }
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/end", description: "End a servicing contract", roles: [AccountManager], code: 200, input: [], output: CleaningContract, side_effects: ["lifecycle SERVICING->ENDED", "billing->CLOSED", "Account.lifecycle_stage->CHURNED if last"] }
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/billing/suspend", description: "Suspend billing (parallel axis)", roles: [AccountManager], code: 200, input: [], output: CleaningContract, side_effects: ["billing ACTIVE->SUSPENDED", "Account.health_score -= HEALTH_SUSPEND_PENALTY"] }
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/billing/resume", description: "Resume billing (parallel axis)", roles: [AccountManager], code: 200, input: [], output: CleaningContract, side_effects: ["billing SUSPENDED->ACTIVE", "Account.health_score += HEALTH_SUSPEND_PENALTY"] }

  # ---- StartupPlan (FK -> CleaningContract) ----
  - { method: GET, path: "/accounts/{accountId}/startup-plans/{planId}", description: "Get startup plan", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: [], output: StartupPlan, side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/startup-plans", description: "List startup plans (FK reverse-reach by contract_id)", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: ["contract_id?"], output: "StartupPlan[]", side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/startup-plans/{planId}/crew", description: "Assign a CrewShift (PLANNING->CREWED; cascades contract SIGNED->STARTUP on first)", roles: [OperationsManager], code: 201, input: [crew_id, start_at, end_at], output: CrewShift, side_effects: ["create CrewShift ASSIGNED", "recompute allocated_hours", "plan PLANNING->CREWED", "contract SIGNED->STARTUP on first shift"] }
  - { method: POST, path: "/accounts/{accountId}/startup-plans/{planId}/mark-ready", description: "Mark plan READY (hours allocation gate)", roles: [OperationsManager], code: 200, input: [], output: StartupPlan, side_effects: ["status CREWED->READY"] }
  - { method: POST, path: "/accounts/{accountId}/startup-plans/{planId}/go-live", description: "Go live (plan READY->LIVE; contract STARTUP->SERVICING; account handoff)", roles: [OperationsManager], code: 200, input: [], output: StartupPlan, side_effects: ["plan READY->LIVE", "contract STARTUP->SERVICING", "billing PENDING->ACTIVE", "Account ACTIVE_CUSTOMER"] }
  - { method: POST, path: "/accounts/{accountId}/startup-plans/{planId}/abort", description: "Abort plan (cancels shifts, releases hours, health penalty)", roles: [OperationsManager], code: 200, input: [], output: StartupPlan, side_effects: ["cancel all ASSIGNED shifts releasing hours", "status->ABORTED", "Account.health_score -= HEALTH_ABORT_PENALTY"] }

  # ---- Crew (top-level) ----
  - { method: POST, path: "/crews", description: "Create a crew", roles: [OperationsManager], code: 201, input: [name, weekly_capacity_hours], output: Crew, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/crews/{crewId}", description: "Get crew", roles: [OperationsManager, PlatformAdmin], code: 200, input: [], output: Crew, side_effects: [] }
  - { method: POST, path: "/crews/{crewId}/retire", description: "Retire a crew", roles: [OperationsManager], code: 200, input: [], output: Crew, side_effects: ["status=RETIRED"] }

  # ---- CrewShift reverse-reach + cancel ----
  - { method: GET, path: "/accounts/{accountId}/startup-plans/{planId}/crew-shifts", description: "List crew shifts of a plan (FK reverse-reach by startup_plan_id)", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: ["crew_id?"], output: "CrewShift[]", side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/crew-shifts", description: "List crew shifts (FK reverse-reach by crew_id)", roles: [OperationsManager, PlatformAdmin], code: 200, input: ["crew_id?", "startup_plan_id?"], output: "CrewShift[]", side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/crew-shifts/{shiftId}/cancel", description: "Cancel a shift (compensating hour release)", roles: [OperationsManager], code: 200, input: [], output: CrewShift, side_effects: ["status ASSIGNED->CANCELLED", "StartupPlan.allocated_hours -= shift_hours"] }

  # ---- SupplyBudget (FK -> CleaningContract) ----
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/supply-budget", description: "Create supply budget for contract", roles: [OperationsManager], code: 201, input: [total_cents], output: SupplyBudget, side_effects: ["committed_cents=0", "remaining_cents=total_cents"] }
  - { method: GET, path: "/accounts/{accountId}/contracts/{contractId}/supply-budget", description: "List supply budget of contract (FK reverse-reach)", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: "SupplyBudget[]", side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/supply-budgets/{budgetId}", description: "Get supply budget", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: SupplyBudget, side_effects: [] }

  # ---- SupplyRequisition (FK -> SupplyBudget) ----
  - { method: POST, path: "/accounts/{accountId}/supply-budgets/{budgetId}/requisitions", description: "Create a supply requisition", roles: [OperationsManager], code: 201, input: [item_label, amount_cents], output: SupplyRequisition, side_effects: ["status=REQUESTED"] }
  - { method: GET, path: "/accounts/{accountId}/supply-budgets/{budgetId}/requisitions", description: "List requisitions of a budget (FK reverse-reach)", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: "SupplyRequisition[]", side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/supply-requisitions/{reqId}", description: "Get requisition", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: SupplyRequisition, side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/supply-requisitions/{reqId}/approve", description: "Approve requisition (OCC on budget; debits remaining)", roles: [OperationsManager], code: 200, input: [expected_supply_budget_version], output: SupplyRequisition, side_effects: ["status REQUESTED->APPROVED", "SupplyBudget.committed_cents += amount_cents", "increments SupplyBudget.version by 1"] }
  - { method: POST, path: "/accounts/{accountId}/supply-requisitions/{reqId}/cancel", description: "Cancel requisition (compensating credit if APPROVED)", roles: [OperationsManager], code: 200, input: [], output: SupplyRequisition, side_effects: ["status->CANCELLED", "SupplyBudget.committed_cents -= amount_cents if was APPROVED", "increments SupplyBudget.version by 1 if was APPROVED"] }

  # ---- RenewalCycle (FK -> CleaningContract) ----
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/renewal-cycles", description: "Create renewal cycle (runs renewal_escalation)", roles: [AccountManager], code: 201, input: [escalation_method], output: RenewalCycle, side_effects: ["compute proposed_monthly_cents", "status=DRAFT"] }
  - { method: GET, path: "/accounts/{accountId}/contracts/{contractId}/renewal-cycles", description: "List renewal cycles of contract (FK reverse-reach)", roles: [AccountManager, PlatformAdmin], code: 200, input: [], output: "RenewalCycle[]", side_effects: [] }
  - { method: GET, path: "/accounts/{accountId}/renewal-cycles/{cycleId}", description: "Get renewal cycle", roles: [AccountManager, PlatformAdmin], code: 200, input: [], output: RenewalCycle, side_effects: [] }
  - { method: POST, path: "/accounts/{accountId}/renewal-cycles/{cycleId}/offer", description: "Offer renewal (DRAFT->OFFERED)", roles: [AccountManager], code: 200, input: [], output: RenewalCycle, side_effects: ["status DRAFT->OFFERED"] }
  - { method: POST, path: "/accounts/{accountId}/renewal-cycles/{cycleId}/accept", description: "Accept renewal (OCC on contract; bumps contract value)", roles: [AccountManager], code: 200, input: [expected_contract_version], output: RenewalCycle, side_effects: ["status OFFERED->RENEWED", "contract.monthly_value_cents=proposed_monthly_cents", "Account.health_score += HEALTH_RENEW_BONUS"] }
  - { method: POST, path: "/accounts/{accountId}/renewal-cycles/{cycleId}/lapse", description: "Lapse renewal (churns contract + account)", roles: [AccountManager], code: 200, input: [], output: RenewalCycle, side_effects: ["status OFFERED->LAPSED", "contract->ENDED/CLOSED", "Account churn + health penalty"] }

  # ---- Upsell: floor/window add-on service line ----
  - { method: POST, path: "/accounts/{accountId}/contracts/{contractId}/upsell", description: "Add a floor/window upsell line raising contract value (OCC on contract)", roles: [AccountManager], code: 200, input: [upsell_type, monthly_addon_cents, expected_contract_version], output: CleaningContract, side_effects: ["contract.monthly_value_cents += monthly_addon_cents", "increments CleaningContract.version by 1", "Account.health_score += HEALTH_UPSELL_BONUS"] }

  # ---- Flat read surface: single-resource GET (segment derivation) + filtered-list GET
  #      (FK reverse-reachability). Each child entity is reachable by its own collection
  #      under the /accounts prefix, filtered by every declared FK field. ----
  - { method: GET, path: "/accounts/rfp-records/{rfpId}", description: "Get RFP (flat)", roles: [SalesRep, OperationsManager, AccountManager, BidEstimator, PlatformAdmin], code: 200, input: [], output: RfpOpportunity, side_effects: [] }
  - { method: GET, path: "/accounts/rfp-records", description: "List RFPs filtered by account_id (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, BidEstimator, PlatformAdmin], code: 200, input: ["account_id?", "limit?", "offset?"], output: "RfpOpportunity[]", side_effects: [] }

  - { method: GET, path: "/accounts/site-contacts/{contactId}", description: "Get site contact (flat)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: SiteContact, side_effects: [] }
  - { method: GET, path: "/accounts/site-contacts", description: "List site contacts filtered by account_id (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["account_id?"], output: "SiteContact[]", side_effects: [] }

  - { method: GET, path: "/accounts/walkthrough-records/{wtId}", description: "Get walkthrough (flat)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: Walkthrough, side_effects: [] }
  - { method: GET, path: "/accounts/walkthrough-records", description: "List walkthroughs filtered by rfp_id or site_contact_id (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["rfp_id?", "site_contact_id?"], output: "Walkthrough[]", side_effects: [] }

  - { method: GET, path: "/accounts/service-area-records/{areaId}", description: "Get service area (flat)", roles: [SalesRep, BidEstimator, PlatformAdmin], code: 200, input: [], output: ServiceArea, side_effects: [] }
  - { method: GET, path: "/accounts/service-area-records", description: "List service areas filtered by rfp_id (FK reverse-reach)", roles: [SalesRep, BidEstimator, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["rfp_id?"], output: "ServiceArea[]", side_effects: [] }

  - { method: GET, path: "/accounts/bid-estimate-records/{bidId}", description: "Get bid estimate (flat)", roles: [BidEstimator, SalesRep, PlatformAdmin], code: 200, input: [], output: BidEstimate, side_effects: [] }
  - { method: GET, path: "/accounts/bid-estimate-records", description: "List bid estimates filtered by rfp_id (FK reverse-reach)", roles: [BidEstimator, SalesRep, PlatformAdmin], code: 200, input: ["rfp_id?"], output: "BidEstimate[]", side_effects: [] }

  - { method: GET, path: "/accounts/proposal-records/{proposalId}", description: "Get proposal (flat)", roles: [SalesRep, AccountManager, PlatformAdmin], code: 200, input: [], output: Proposal, side_effects: [] }
  - { method: GET, path: "/accounts/proposal-records", description: "List proposals filtered by rfp_id or bid_estimate_id (FK reverse-reach)", roles: [SalesRep, AccountManager, PlatformAdmin], code: 200, input: ["rfp_id?", "bid_estimate_id?"], output: "Proposal[]", side_effects: [] }

  - { method: GET, path: "/accounts/contract-records/{contractId}", description: "Get contract (flat)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: CleaningContract, side_effects: [] }
  - { method: GET, path: "/accounts/contract-records", description: "List contracts filtered by account_id or proposal_id (FK reverse-reach)", roles: [SalesRep, OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["account_id?", "proposal_id?", "limit?", "offset?"], output: "CleaningContract[]", side_effects: [] }

  - { method: GET, path: "/accounts/startup-plan-records/{planId}", description: "Get startup plan (flat)", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: [], output: StartupPlan, side_effects: [] }
  - { method: GET, path: "/accounts/startup-plan-records", description: "List startup plans filtered by contract_id (FK reverse-reach)", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: ["contract_id?"], output: "StartupPlan[]", side_effects: [] }

  - { method: GET, path: "/accounts/crew-shift-records/{shiftId}", description: "Get crew shift (flat)", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: [], output: CrewShift, side_effects: [] }
  - { method: GET, path: "/accounts/crew-shift-records", description: "List crew shifts filtered by startup_plan_id or crew_id (FK reverse-reach)", roles: [OperationsManager, SalesRep, PlatformAdmin], code: 200, input: ["startup_plan_id?", "crew_id?"], output: "CrewShift[]", side_effects: [] }

  - { method: GET, path: "/accounts/supply-budget-records/{budgetId}", description: "Get supply budget (flat)", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: SupplyBudget, side_effects: [] }
  - { method: GET, path: "/accounts/supply-budget-records", description: "List supply budgets filtered by contract_id (FK reverse-reach)", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["contract_id?"], output: "SupplyBudget[]", side_effects: [] }

  - { method: GET, path: "/accounts/supply-requisition-records/{reqId}", description: "Get supply requisition (flat)", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: [], output: SupplyRequisition, side_effects: [] }
  - { method: GET, path: "/accounts/supply-requisition-records", description: "List supply requisitions filtered by supply_budget_id (FK reverse-reach)", roles: [OperationsManager, AccountManager, PlatformAdmin], code: 200, input: ["supply_budget_id?"], output: "SupplyRequisition[]", side_effects: [] }

  - { method: GET, path: "/accounts/renewal-cycle-records/{cycleId}", description: "Get renewal cycle (flat)", roles: [AccountManager, PlatformAdmin], code: 200, input: [], output: RenewalCycle, side_effects: [] }
  - { method: GET, path: "/accounts/renewal-cycle-records", description: "List renewal cycles filtered by contract_id (FK reverse-reach)", roles: [AccountManager, PlatformAdmin], code: 200, input: ["contract_id?"], output: "RenewalCycle[]", side_effects: [] }

  - { method: GET, path: "/accounts/crew-records/{crewId}", description: "Get crew (flat segment derivation for Crew)", roles: [OperationsManager, PlatformAdmin], code: 200, input: [], output: Crew, side_effects: [] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ now: string }", side_effects: ["logical clock set"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced FK resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or malformed body" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum value outside declared domain" }
  - { id: ERR_INVALID_RANGE, http: 422, condition: "Numeric/temporal range violated (sqft<=0, freq not 1..7, margin not 0..0.90, end<=start, term<1)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state permitting this transition" }
  - { id: ERR_PROPOSAL_NOT_ACCEPTED, http: 409, condition: "Sign requires the linked Proposal to be ACCEPTED" }
  - { id: ERR_BID_NOT_PRICED, http: 409, condition: "Proposal create requires the BidEstimate to be PRICED" }
  - { id: ERR_CONTRACT_NOT_SIGNED, http: 409, condition: "Crewing requires the contract lifecycle_status == SIGNED" }
  - { id: ERR_CONTRACT_NOT_SERVICING, http: 409, condition: "Renewal/suspend requires contract lifecycle_status == SERVICING" }
  - { id: ERR_STARTUP_NOT_READY, http: 409, condition: "go-live requires StartupPlan.status == READY" }
  - { id: ERR_HOURS_UNDERALLOCATED, http: 409, condition: "mark-ready requires allocated_hours >= planned_monthly_hours" }
  - { id: ERR_MARGIN_BELOW_FLOOR, http: 422, condition: "Proposal achieved margin < MIN_MARGIN_PCT at send" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "Requisition amount > SupplyBudget.remaining_cents at approval" }
  - { id: ERR_CREW_UNAVAILABLE, http: 409, condition: "Crew is not AVAILABLE for assignment" }
  - { id: ERR_OUTSIDE_AVAILABILITY, http: 422, condition: "Walkthrough window not within SiteContact availability window" }
  - { id: ERR_WALKTHROUGH_OVERLAP, http: 409, condition: "Walkthrough closed-interval overlap on the same SiteContact" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "CrewShift half-open + travel-buffer overlap on the same Crew" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match parent.version" }
  - { id: ERR_UPSELL_INVALID, http: 422, condition: "Upsell on a contract not in SERVICING, or monthly_addon_cents <= 0" }
  - { id: ERR_SITE_CONTACT_MISMATCH, http: 409, condition: "Walkthrough site_contact_id belongs to a different Account than the RFP" }
  - { id: ERR_SERVICE_AREA_REQUIRED, http: 409, condition: "Bid price run with zero ServiceArea rows on the RFP" }
  - { id: ERR_VALIDATION_LIMIT, http: 422, condition: "Pagination limit outside 1..100" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SalesRep
    description: "Owns RFP capture, walkthrough scheduling, bidding hand-off, proposals, contract signing"
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{accountId}/rfps"
      - "POST /accounts/{accountId}/site-contacts"
      - "walkthrough schedule/complete"
      - "proposal create/send/revise/accept/decline"
      - "contract create/sign"
    shared_operations:
      - "service-area create (with BidEstimator)"
      - "read accounts/rfps/proposals/contracts/startup-plans"

  - name: BidEstimator
    description: "Owns square-footage labor-loading and bid pricing"
    identity: "opaque"
    exclusive_operations:
      - "bid-estimate create"
      - "bid-estimate price (labor_load + bid_buildup)"
    shared_operations:
      - "service-area create (with SalesRep)"
      - "read bid-estimates/service-areas"

  - name: OperationsManager
    description: "Owns start-up crewing, shifts, supply provisioning, crews"
    identity: "opaque"
    exclusive_operations:
      - "crew create/retire"
      - "startup-plan crew/mark-ready/go-live/abort"
      - "crew-shift cancel"
      - "supply-budget create"
      - "supply-requisition create/approve/cancel"
    shared_operations:
      - "read startup-plans/crew-shifts/supply-budgets/requisitions"

  - name: AccountManager
    description: "Owns post-handoff account: billing, renewal, retention, upsell. entity_backed: when acting on an account the X-User-ID equals Account.owner_user_id"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "contract end"
      - "billing suspend/resume"
      - "renewal-cycle create/offer/accept/lapse"
      - "contract upsell"
    shared_operations:
      - "read accounts/contracts/renewal-cycles"

  - name: PlatformAdmin
    description: "Operator: read-everything + logical clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "read all collections"
