# =============================================================================
# §1.9 Scaffold Corner Design — Reinsurance Broker Placement & Treaty Marketing
#
# Breadth probe over the claim-extraction-guide taxonomy. §1.8 (depth) is the
# sibling file SCAFFOLD_DIFFICULTY_DESIGN.yaml; every corner it already asserts
# appears here as an `excluded_because:` stub naming the §1.8 instance.
#
# Conventions reused from §1.8 (do not restate per instance):
#   * the logical clock is set first in every chain; server default is
#     2026-08-01T00:00:00.000Z, so chains that need 2026 placement dates set
#     2026-01-01T00:00:00.000Z explicitly
#   * opaque role identities used throughout: lead-1 (BrokerPlacementLead),
#     act-1 (BrokerActuary), acct-1 (BrokerAccountant), compl-1
#     (ComplianceOfficer), admin-1 (PlatformAdmin); CedentUnderwriter and
#     ReinsurerUnderwriter are entity-backed, so their as_user_id is the
#     Cedent.id / Reinsurer.id captured earlier in the chain
#   * money is an integer in minor units; percentages carry 4 decimals; scores
#     and index figures carry 2; every instant is ISO-8601 UTC with exactly
#     three fractional digits
#   * canonical placement prologue (referred to as "the DRAFT prologue",
#     "the IN_MARKET prologue", "the BOUND prologue"):
#       clock -> POST /cedents -> POST /reinsurers -> POST /programs
#       -> POST /programs/{id}/exposure-submissions -> POST /programs/{id}/layers
#       -> submit-for-review -> signoff -> go-to-market
#       -> market-submissions -> quotes -> GET /layers/{id} -> firm-order
#       -> brokerage-disclosures -> disclose -> decision ACKNOWLEDGE -> bind
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES
  # ===========================================================================
  - section: entities
    instances:
      - name: cedent_and_reinsurer_creation_returns_system_defaults_and_zero_derived_fields
        claim_type: Creation
        grounds:
          - entities.Cedent.fields.status
          - entities.Cedent.fields.settled_receipts_minor
          - entities.Reinsurer.fields.security_status
          - entities.Reinsurer.fields.available_capacity_minor
          - endpoints.POST /cedents
          - endpoints.POST /reinsurers
        distinguishing_aspect: |
          Registry creation with every declared required field returns 201 and materialises the
          system/computed columns the client never supplied: Cedent.status ACTIVE with a null
          suspension_reason, Reinsurer.security_status APPROVED, and derived money/capacity fields
          seeded at 0 rather than left null — available_capacity_minor equals the full
          capacity_limit_minor because no line exists yet.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id, ced_status: $.data.status, ced_receipts: $.data.settled_receipts_minor }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 1000000000, max_line_pct: 100.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { rein_id: $.data.id, sec_status: $.data.security_status, avail: $.data.available_capacity_minor }
          assert:
            - "both calls return HTTP 201 with response_type == \"object\""
            - "${ced_status} == ACTIVE and Cedent.${ced_id}.suspension_reason == null"
            - "${ced_receipts} == 0 and Cedent.${ced_id}.outstanding_reinstatement_premium_minor == 0"
            - "${sec_status} == APPROVED"
            - "Reinsurer.${rein_id}.committed_capacity_minor == 0 and ${avail} == 1000000000"
            - "both rows expose id, created_at == 2026-01-01T00:00:00.000Z, updated_at and version == 1"

      - name: program_creation_applies_declared_defaults_for_currency_brokerage_and_signdown
        claim_type: Defaults
        grounds:
          - entities.Program.fields.currency_code
          - entities.Program.fields.brokerage_pct
          - entities.Program.fields.signdown_method
          - entities.Program.fields.placement_status
          - endpoints.POST /programs
        distinguishing_aspect: |
          Omitting every optional input on POST /programs applies the declared defaults exactly —
          currency_code USD, brokerage_pct 2.5000, signdown_method PRO_RATA, placement_status
          DRAFT, documentation_status NOT_STARTED, disclosure_acknowledged false — and
          prior_program_id stays null rather than being invented.
        test_recipe:
          setup:
            - "One Cedent exists; no program exists for it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id, ccy: $.data.currency_code, brok: $.data.brokerage_pct, meth: $.data.signdown_method }
          assert:
            - "HTTP 201; ${ccy} == USD, ${brok} == 2.5000, ${meth} == PRO_RATA"
            - "Program.${prog_id}.placement_status == DRAFT and documentation_status == NOT_STARTED"
            - "Program.${prog_id}.disclosure_acknowledged == false"
            - "Program.${prog_id}.prior_program_id == null"
            - "Program.${prog_id}.fiduciary_holding_minor == 0 and rounding_residue_minor == 0"

      - name: program_creation_materialises_the_contract_certainty_deadline_thirty_days_after_inception
        claim_type: Computed Fields
        grounds:
          - calculations.contract_certainty_window
          - entities.Program.fields.contract_certainty_deadline
          - endpoints.POST /programs
        distinguishing_aspect: |
          contract_certainty_deadline is computed at creation as inception_date +
          CONTRACT_CERTAINTY_DAYS (30) — 2026-01-01T00:00:00.000Z becomes exactly
          2026-01-31T00:00:00.000Z — and a client-supplied value for it is impossible because the
          field is not in the endpoint's input list.
        test_recipe:
          setup:
            - "One Cedent exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
          trigger:
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id, deadline: $.data.contract_certainty_deadline }
          assert:
            - "${deadline} == 2026-01-31T00:00:00.000Z"
            - "GET /programs/${prog_id} returns the identical contract_certainty_deadline"
            - "Program.${prog_id}.documentation_status == NOT_STARTED  # the deadline alone is not a breach"

      - name: layer_creation_prices_the_quota_share_premium_and_seeds_placement_counters_at_zero
        claim_type: Computed Fields
        grounds:
          - calculations.layer_technical_premium
          - entities.Layer.fields.quoted_gross_premium_minor
          - entities.Layer.fields.written_line_total_pct
          - endpoints.POST /programs/{program_id}/layers
        distinguishing_aspect: |
          A QUOTA_SHARE layer of subject_premium_base_minor 2000000000 at base_rate_pct 40.0000
          with no reinstatements prices at provisional 800000000, which lands in volume tier 3, so
          quoted_gross_premium_minor is 740000000 (800000000 less the 7.5000% tier discount). Every
          placement counter starts at zero and the status starts at OPEN.
        test_recipe:
          setup:
            - "One Cedent and one DRAFT Program (PROPERTY, 2026)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP QS 40%", layer_type: "QUOTA_SHARE", attachment_minor: 0, limit_minor: 2000000000, cession_pct: 40.0000, base_rate_pct: 40.0000, subject_premium_base_minor: 2000000000, expected_loss_cost_minor: 500000000, ceding_commission_pct: 30.0000 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id, premium: $.data.quoted_gross_premium_minor, lstat: $.data.status }
          assert:
            - "HTTP 201; ${premium} == 740000000 and ${lstat} == OPEN"
            - "Layer.${layer_id}.written_line_total_pct == 0.0000 and signed_line_total_pct == 0.0000"
            - "Layer.${layer_id}.limit_eroded_minor == 0 and reinstatements_used == 0"
            - "Layer.${layer_id}.incurred_ceded_minor == 0 and program_id == ${prog_id}"
            - "Layer.${layer_id}.excluded_perils == []  # declared default applied"

      - name: exposure_submission_creation_scores_completeness_and_starts_in_draft
        claim_type: Creation
        grounds:
          - calculations.submission_completeness_score
          - entities.ExposureSubmission.fields.completeness_score
          - state_machines.ExposureSubmission.initial_state
          - endpoints.POST /programs/{program_id}/exposure-submissions
        distinguishing_aspect: |
          (records 1000, flags 20, years 5, loss completeness 90.0000, report true) scores
          40*0.98 + 25*1 + 25*0.9 + 10 = 96.70 at creation, before any review step, and the row
          starts in DRAFT with a null actuary_signoff_user_id.
        test_recipe:
          setup:
            - "One Cedent and one DRAFT Program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-PROP-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id, score: $.data.completeness_score, sstat: $.data.status }
          assert:
            - "HTTP 201; ${score} == 96.70 and ${sstat} == DRAFT"
            - "ExposureSubmission.${sub_id}.actuary_signoff_user_id == null and signed_off_at == null"
            - "ExposureSubmission.${sub_id}.program_id == ${prog_id}"
            - "Program.${prog_id}.placement_status == DRAFT  # creation alone advances nothing"

      - name: exposure_submission_system_fields_are_server_generated_and_client_input_ignored
        claim_type: System Fields
        grounds:
          - entities.ExposureSubmission.fields.program_id
          - entities.ExposureSubmission.fields.status
          - entities.ExposureSubmission.fields.completeness_score
          - endpoints.POST /programs/{program_id}/exposure-submissions
        distinguishing_aspect: |
          id, created_at, updated_at, version, program_id, status and completeness_score are
          server-owned. A body that also carries program_id, status and completeness_score cannot
          steer them: program_id follows the URL, status is DRAFT and the score is recomputed to
          96.70 rather than the 12.00 supplied.
        test_recipe:
          setup:
            - "Two DRAFT Programs of the same cedent in different lines of business, so a hijacked program_id would be observable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Marine 2026", line_of_business: "MARINE", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 500000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { other_prog: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-PROP-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true, program_id: "${other_prog}", status: "SIGNED_OFF", completeness_score: 12.00 }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id, sprog: $.data.program_id, sstat: $.data.status, score: $.data.completeness_score }
          assert:
            - "${sprog} == ${prog_id} and ${sprog} != ${other_prog}"
            - "${sstat} == DRAFT and ${score} == 96.70"
            - "ExposureSubmission.${sub_id}.version == 1 and created_at == 2026-01-01T00:00:00.000Z"
            - "GET /programs/${other_prog}/exposure-submissions returns 0 rows"

      - name: layer_create_missing_a_required_input_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors.ERR_VALIDATION
          - endpoints.POST /programs/{program_id}/layers
        distinguishing_aspect: |
          Every input without a declared default must be present. Omitting subject_premium_base_minor
          — which the premium formula needs and which has no default — is a 422 ERR_VALIDATION, and
          no Layer row is created; omitting only the defaulted fields succeeds.
        test_recipe:
          setup:
            - "One Cedent and one DRAFT Program."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, expected_loss_cost_minor: 60000000 }
              as: BrokerPlacementLead
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "HTTP 422 with ${err} == ERR_VALIDATION"
            - "${msg} names subject_premium_base_minor"
            - "GET /programs/${prog_id}/layers returns 0 rows"
            - "Program.${prog_id}.version is unchanged"

      - name: out_of_range_and_undeclared_enum_values_are_rejected_with_validation
        claim_type: Type Constraints
        grounds:
          - validations[priority=6]
          - errors.ERR_VALIDATION
          - entities.Cedent.fields.financial_rating
          - entities.Program.fields.underwriting_year
          - entities.ExposureSubmission.fields.data_quality_flags_count
        distinguishing_aspect: |
          Four distinct type/range violations all resolve to ERR_VALIDATION at priority 6 and none
          of them creates a row: an undeclared enum member (financial_rating AA), an out-of-range
          integer (underwriting_year 2019 against 2020..2035), a percentage carrying five decimals
          (brokerage_pct 2.55555), and a datetime without exactly three fractional digits.
        test_recipe:
          setup:
            - "One Cedent and one DRAFT Program exist so the layer/submission targets are reachable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
          trigger:
            - call: "POST /cedents"
              payload: { name: "Southwind Mutual", domicile_code: "USNYC", financial_rating: "AA" }
              as: PlatformAdmin
              captures: { err_enum: $.data.error_id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2019", line_of_business: "PROPERTY", underwriting_year: 2019, inception_date: "2019-01-01T00:00:00.000Z", expiry_date: "2020-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000 }
              as: BrokerPlacementLead
              captures: { err_range: $.data.error_id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.55555 }
              as: BrokerPlacementLead
              captures: { err_scale: $.data.error_id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000 }
              as: BrokerPlacementLead
              captures: { err_instant: $.data.error_id }
          assert:
            - "all four calls return HTTP 422"
            - "${err_enum} == ERR_VALIDATION and ${err_range} == ERR_VALIDATION"
            - "${err_scale} == ERR_VALIDATION and ${err_instant} == ERR_VALIDATION"
            - "GET /cedents returns exactly 1 row — only Northwind Mutual"
            - "GET /programs returns exactly 0 rows"

      - name: unknown_path_ids_on_read_endpoints_return_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
          - validations[priority=19]
          - validations[priority=20]
          - errors.ERR_CEDENT_NOT_FOUND
          - errors.ERR_REINSURER_NOT_FOUND
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_EXPOSURE_SUBMISSION_NOT_FOUND
          - errors.ERR_LAYER_NOT_FOUND
          - errors.ERR_MARKET_SUBMISSION_NOT_FOUND
          - errors.ERR_QUOTE_NOT_FOUND
          - errors.ERR_SIGNING_LINE_NOT_FOUND
          - errors.ERR_DISCLOSURE_NOT_FOUND
          - errors.ERR_TRANSACTION_NOT_FOUND
          - errors.ERR_CLAIM_ADVOCACY_NOT_FOUND
          - errors.ERR_CESSION_DISPUTE_NOT_FOUND
        distinguishing_aspect: |
          One well-formed but unused UUID probed against each read endpoint family returns 404 with
          the error_id of THAT family — twelve different ids, never a generic 404 and never a 500.
          The existence ladder is entity-specific even on an empty database.
        test_recipe:
          setup:
            - "Empty database apart from the clock; the probe id 11111111-1111-4111-8111-111111111111 is not the id of any row."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cedents/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /reinsurers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /programs/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /exposure-submissions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /layers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /market-submissions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /quotes/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /signing-lines/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /brokerage-disclosures/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /fiduciary-transactions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /claim-advocacies/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e11: $.data.error_id }
            - call: "GET /cession-disputes/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: PlatformAdmin
              captures: { e12: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type == \"error\""
