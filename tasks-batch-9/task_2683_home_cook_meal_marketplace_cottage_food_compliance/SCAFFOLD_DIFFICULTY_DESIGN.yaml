  - rule_id: non_linear_state_machine
    instances:
      - name: cook_onboarding_and_standing_dimensions_move_independently
        grounds:
          - state_machines.Cook.onboarding_status
          - state_machines.Cook.compliance_standing
          - state_machines.Cook.CLEAR_to_SUSPENDED
          - state_machines.Cook.SUSPENDED_to_CLEAR
          - state_machines.MenuItem.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          Two parallel state dimensions on one entity. A SUSPEND action moves compliance_standing
          CLEAR -> SUSPENDED but must leave onboarding_status pinned at ACTIVE, and a later
          REINSTATE must move compliance_standing back to CLEAR without ever re-running the
          onboarding path. The combined state (ACTIVE, SUSPENDED) is the one that blocks
          POST /menu-items/{id}/submit even though the onboarding dimension is fully satisfied,
          so a single-dimension implementation returns 200 where the scaffold demands 409.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Eli reached onboarding_status ACTIVE with compliance_standing CLEAR."
            - "Eli owns one MenuItem still in review_status DRAFT (never approved, so no CASCADE-A delisting can fire)."
            - "Eli has zero SafetyIncidents, which is the precondition REINSTATE needs."
          setup_api_calls:
            - call: "POST /state-policies"
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
