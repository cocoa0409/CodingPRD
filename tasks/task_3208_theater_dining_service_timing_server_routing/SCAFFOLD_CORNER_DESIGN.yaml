              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 1, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 2, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 3, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /showtimes/${x1_id}/dining-capacity"
              payload: {}
              as: KitchenLead
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 4, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 5, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}", capacity_ack: true }
              as: Server
              as_user_id: "${srv_id}"
          assert:
            - "data.entree_load_points == 3, being the three accepted 1x E1 slips at 1 point each"
            - "data.load_pct == 12, since floor(3 * 100 / (1 * 25)) == 12, so the read reports capacity_band == \"NORMAL\""
            - "data.entry_stage == 3, the reported count of accepted slips on the showtime"
            - "the unacknowledged placement is refused with data.error_id == \"ERR_KITCHEN_CAPACITY_BAND\", because the ceiling computation makes the entree latest-accept instant already past"
            - "the same placement carrying capacity_ack true succeeds with HTTP 201 and data.status == \"ACCEPTED\", which is exactly what the LATE band prescribes"

