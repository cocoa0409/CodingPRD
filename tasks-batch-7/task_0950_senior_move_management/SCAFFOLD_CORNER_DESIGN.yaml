        grounds: ['calculations.package_overage_charge', 'calculations.labor_charge_pipeline_selector', 'calculations.crew_overtime_split', 'entities.InvoiceLine.fields.line_type']
        distinguishing_aspect: "PACKAGE_INCLUDED_HOURS_STUDIO is 18 and the overage is max(0, billing_hours_total - allowance), so a move day that lands on exactly 18.00 hours produces no OVERAGE_LABOR line at all rather than a zero-amount one, even though each crew member individually earned an hour of overtime."
        test_recipe:
