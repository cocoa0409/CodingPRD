            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "ASSESSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "PROPOSED" }, as: SaleManager }
            - { call: "PATCH /estate/projects/${proj_id}", payload: { status: "CONTRACTED" }, as: Client, as_user_id: "${cli_id}" }
            - { call: "POST /estate/lots", payload: { project_id: "${proj_id}", title: "Bookshelf", list_price_cents: 5000, reserve_price_cents: 100 }, as: Appraiser, captures: { lot_id: "$.data.id" } }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "RESEARCHED" }, as: Appraiser }
            - { call: "PATCH /estate/lots/${lot_id}", payload: { status: "PRICED" }, as: Appraiser }
