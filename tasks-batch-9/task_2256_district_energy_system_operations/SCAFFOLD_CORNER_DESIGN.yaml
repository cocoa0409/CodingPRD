            - call: "POST /district-energy/metering-points/${mp_t1_id}/readings"
              payload: { read_at: "2026-06-01T00:00:00Z", cumulative_energy_mwh: 0.000, peak_demand_kw: 40.0, read_type: "ACTUAL" }
