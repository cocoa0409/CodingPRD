        excluded_because:
          difficulty_instance: dual_variant_calc / draw_basis_variant_divergence_wip_deposit_vs_milestone_set
          rationale: "Two draws over one unchanged module population, one per basis_mode, with the delta asserted."

      - name: defect_allocation_variant_divergence_on_identical_claim_data
        claim_type: Variant Divergence
        grounds:
          - calculations.defect_responsibility_allocation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / defect_allocation_variant_divergence_presumption_vs_evidence
          rationale: "Round 1 presumption versus round 2 evidence weighting on the same claim, with both allocations asserted."

      - name: wip_ledger_reconciliation_when_a_certified_draw_is_reversed
        claim_type: Reconciliation
        grounds:
          - calculations.draw_certification_amount
          - entities.Project.fields.wip_certified_cents
        excluded_because:
          difficulty_instance: compensating_invariant / project_wip_certified_cents_reverses_exactly_on_draw_rejection
          rationale: "The ledger delta on reversal and the drift-free re-certification are asserted there."

  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_outranks_every_later_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: |
          One request violates priorities 1, 2 and 3 at once: no X-User-Role header, a role-guarded
          endpoint, and a payload missing every required field. Priority 1 must win, so the response
          leaks nothing about the payload or the role table.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; no fixtures required"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /modular/factories"
              payload: { name: "Ghost Plant" }
              as: "(request sent with no X-User-Role and no X-User-ID header)"
              captures: { err: "$.data.error_id", msg: "$.data.message" }
          assert:
            - "${err} == 'ERR_UNAUTHENTICATED' with HTTP 401 — not ERR_ROLE_NOT_PERMITTED and not ERR_INVALID_REQUEST"
            - "${msg} is a non-empty string and the envelope carries success == false with data == null"
            - "GET /modular/factories as ProgramAdmin returns total_count == 0 — the rejected call created nothing"

      - name: role_check_outranks_payload_shape_validation
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - rbac[FactoryProductionManager]
        distinguishing_aspect: |
          A LenderDrawAdministrator posting a module with a malformed body violates priority 2 and
          priority 3 together. The role error must be returned, so an implementation that parses the
          body first (a very common ordering slip) fails this corner.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; Project with a DRAFT design package"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/design-packages"
              payload: { project_id: "${proj}", revision_index: 1, module_split_count: 4, expected_project_version: "${projv}", connection_detail_state: "COMPLETE" }
              as: DesignEngineer
              as_user_id: "eng-001"
              captures: { pkg: "$.data.id" }
          trigger:
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg}", module_code: "M-01" }
              as: LenderDrawAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403, even though set_sequence_index, the three dimensions and gross_weight_lb are all missing"
            - "GET /modular/modules with project_id filter returns total_count == 0"

      - name: path_id_existence_outranks_the_state_precondition
        claim_type: Cascading validation
        grounds:
          - validations[priority=4]
          - validations[priority=51]
        distinguishing_aspect: |
          Priority 4 must run before any state check, otherwise the state precondition would be
          evaluated against a null row. Dispatching a shipment id that was never stored must return
          the not-found error, not the not-permitted state error.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; one real DRAFT shipment exists so the table is not empty"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
            - call: "POST /modular/shipments"
              payload: { project_id: "${proj}", carrier_code: "NWHEAVY", route_state_codes: ["WA"], planned_departure_at: "2026-09-08T13:00:00Z", planned_arrival_at: "2026-09-08T21:00:00Z" }
              as: TransportCoordinator
              captures: { ship: "$.data.id", shipv: "$.data.version" }
          trigger:
            - call: "POST /modular/shipments/00000000-0000-4000-8000-000000000000/dispatch"
              as: TransportCoordinator
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_SHIPMENT_NOT_FOUND' with HTTP 404 — not ERR_SHIPMENT_NOT_PERMITTED"
            - "GET /modular/shipments/${ship} shows the real shipment untouched at status 'DRAFT'"

      - name: foreign_factory_manager_cannot_schedule_a_slot
        claim_type: Violation → Error
        grounds:
          - validations[priority=6]
          - rbac[FactoryProductionManager]
          - endpoints[POST /modular/modules/{moduleId}/schedule-line-slot]
        distinguishing_aspect: |
          FactoryProductionManager is entity_backed: its X-User-ID must equal project.factory_id.
          A manager holding the id of a SECOND, real factory is a permitted role acting on the wrong
          aggregate, which must fail at priority 6 rather than at the role check.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; two factories PMP1 and PMP2; project Rainier Flats belongs to PMP1"
