          - calculations.per_diem_claim_amount
        distinguishing_aspect: |
          A claim's submittability depends on the parent VeteransHome's recognition_status, an
          entirely different entity and aggregate. The identical submit call fails while the home is
          SUSPENDED and succeeds once RESTORE returns it to RECOGNIZED, stamping
          recognition_verified true and claim_amount_cents 367567 for 31 resident days at 11857.
