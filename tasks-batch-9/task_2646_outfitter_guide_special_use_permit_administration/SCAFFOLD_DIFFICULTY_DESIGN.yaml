  - rule_id: resource_temporal_overlap
    instances:

      - name: use_report_half_open_period_adjacency
        grounds:
          - validations.priority_10.ERR_REPORTING_PERIOD_OVERLAP
          - entities.TripUseReport.fields.period_start_date
          - entities.TripUseReport.fields.period_end_date
        distinguishing_aspect: |
          INTERVAL SEMANTICS: HALF-OPEN [period_start_date, period_end_date). RESOURCE: one Permit's
          reporting timeline, contended by TripUseReport rows in SUBMITTED or ACCEPTED. Because the
          interval is half-open, two periods that share an endpoint do NOT collide and must both be
          accepted, while a single overlapping day must be refused — the opposite convention from the
          closed permit-term and closed certificate intervals used by the other two instances here.
          SUPERSEDED rows drop out of contention, but an amendment's replacement inherits the same
          period, so the slot stays occupied.
