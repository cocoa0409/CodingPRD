      - name: corner_entity_immutability_ledger_and_snapshot_rows_are_append_only
        claim_type: immutability
        grounds:
          - entities.ReserveEntry.common_fields
          - entities.LossEstimateSnapshot.common_fields
          - endpoints[POST /claims/{claimId}/reserve-entries]
          - endpoints[GET /reserve-entries]
          - endpoints[GET /loss-estimates]
        distinguishing_aspect: |
          ReserveEntry and LossEstimateSnapshot are the scaffold's only two `common_fields: false` entities:
          they carry no version and no updated_at, and §1.5 exposes no PUT/PATCH/DELETE for either. A
          correction is therefore an APPENDED row with the next sequence_no, never an in-place edit — the
          original INITIAL_CASE row must be bit-identical afterwards. The snapshot proves the same point from
          the other side: its stored gross_estimate / reported_component / ibnr_component / high-water are
          frozen, and only the DERIVED `stale` flag changes, because stale is re-evaluated on read rather
          than written back into the immutable row.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1010' (HAIL, TX, expected_severity_index 0.0000)."
            - "One cat-coded Claim: reported_loss_amount 40000, one DWELLING line limit 100000 / deductible 0 / estimated_damage 50000."
            - "Triage stamps severity 38.00 (base 40.00 * 0.95) -> STANDARD and appends ReserveEntry #1 INITIAL_CASE delta_case_reserve max(40000, 50000-0) * 0.45 = 22500.00."
            - "One EXPOSURE_BASED LossEstimateSnapshot is taken while sequence_no 1 is the ledger high-water."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1010", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 400, avg_insured_value: 150000, expected_severity_index: 0.0000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-1010A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }], event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "GET /reserve-entries"
              payload: { claim_id: "${cl}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { e1: "$.data[0].id", e1_delta: "$.data[0].delta_case_reserve", e1_seq: "$.data[0].sequence_no", e1_effective: "$.data[0].effective_utc" }
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { les: $.data.id, gross_at_create: $.data.gross_estimate, reported_at_create: $.data.reported_component, ibnr_at_create: $.data.ibnr_component, hw: $.data.input_reserve_sequence_high_water, stale_at_create: $.data.stale }
            - call: "GET /claims/${cl}"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl_v: $.data.version }
          trigger:
            - call: "POST /claims/${cl}/reserve-entries"
              payload: { expected_claim_version: "${cl_v}", entry_type: "REVISION", delta_case_reserve: 5000, delta_paid: 0 }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "response HTTP status == 201"
            - "response.data.entry_type == REVISION and response.data.sequence_no == 2 and response.data.reverses_entry_id == null"
            - "response.data.delta_case_reserve == 5000.00 and response.data.delta_paid == 0.00"
            - "response.data.effective_utc == 2026-08-01T00:00:00.000Z"
            - "response.data has NO `version` key and NO `updated_at` key (ReserveEntry.common_fields == false)"
            - "${e1_seq} == 1 and ${e1_delta} == 22500.00"
            - "GET /reserve-entries?claim_id=${cl} returns meta.total_count == 2 in sequence_no ASC order"
            - "that list's row 0 still has id == ${e1}, delta_case_reserve == ${e1_delta}, sequence_no == ${e1_seq} and effective_utc == ${e1_effective} — the correction appended, it did not rewrite"
            - "that list's row 0 has NO `version` key and NO `updated_at` key"
            - "Claim.${cl}.case_reserve == 27500.00   # 22500.00 + 5000.00"
            - "Claim.${cl}.version == 3   # create 1 -> triage 2 -> revision 3; the CLAIM is versioned even though its ledger rows are not"
            - "CatastropheEvent.${ev}.case_reserve_total == 27500.00 and paid_total == 0.00"
            - "CatastropheEvent.${ev}.incurred_total == 27500.00   # round(22500.00+0.00 + 5000.00+0.00, 2)"
            - "${hw} == 1 and ${stale_at_create} == false"
            - "GET /loss-estimates?event_id=${ev} returns meta.total_count == 1 and row 0 has id == ${les}"
            - "that row's gross_estimate == ${gross_at_create}, reported_component == ${reported_at_create}, ibnr_component == ${ibnr_at_create} — the stored components are frozen"
            - "that row's input_reserve_sequence_high_water == ${hw}   # still 1; the snapshot was not re-based"
            - "that row's stale == true   # derived on read from sequence_no 2 > high-water 1, not written into the immutable row"
            - "that row has NO `version` key and NO `updated_at` key (LossEstimateSnapshot.common_fields == false)"
            - "§1.5 exposes no PUT, PATCH or DELETE on /reserve-entries/{id} or /loss-estimates/{id}: the append endpoints are the only writes that touch either table"

      - name: corner_entity_parent_relationships_unknown_event_rejected_before_any_write
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_EVENT_NOT_FOUND]
          - endpoints[POST /housing-blocks]
          - endpoints[POST /claims/{claimId}/assign-cat-code]
        distinguishing_aspect: |
          Two different shapes of the same parent reference are probed: HousingBlock.event_id, a MANDATORY
          parent supplied at creation, and Claim.event_id, an OPTIONAL parent attached later by
          assign-cat-code. Both must resolve the parent at priority 4 and fail with ERR_EVENT_NOT_FOUND /
          404 before any row is written or mutated, then both must succeed against the real parent in the
          same run — so the failure is attributable to the reference, not to the payload.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One DECLARED CatastropheEvent 'CAT-2026-1011' (HAIL, TX)."
            - "One INTAKE Claim taken with event_id omitted, so its optional parent is still null."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1011", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 350, avg_insured_value: 160000, expected_severity_index: 0.0500 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-1011A", loss_state: "TX", loss_date_utc: "2026-07-26T00:00:00.000Z", reported_loss_amount: 40000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 0, estimated_damage_amount: 50000 }] }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id, parent_at_create: $.data.event_id }
          trigger:
            - call: "POST /housing-blocks"
              payload: { event_id: "00000000-0000-4000-8000-0000000000bb", hotel_name: "Orphan Inn", city: "Waco", rooms_total: 5, nightly_rate: 120, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-05T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /claims/${cl}/assign-cat-code"
              payload: { event_id: "00000000-0000-4000-8000-0000000000bb" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "POST /housing-blocks"
              payload: { event_id: "${ev}", hotel_name: "Orphan Inn", city: "Waco", rooms_total: 5, nightly_rate: 120, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-05T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /claims/${cl}/assign-cat-code"
              payload: { event_id: "${ev}" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "${parent_at_create} == null"
            - "trigger call 1 response HTTP status == 404 and response.data.error_id == ERR_EVENT_NOT_FOUND"
            - "trigger call 2 response HTTP status == 404 and response.data.error_id == ERR_EVENT_NOT_FOUND"
            - "after trigger call 2, GET /claims/${cl} still shows event_id == null and handling_status == INTAKE — the failed reference mutated nothing"
            - "trigger call 3 response HTTP status == 201, status == PENDING, rooms_total == 5, rooms_occupied == 0, rooms_available == 5, block_night_count == 4"
            - "trigger call 3 response.data.event_id == ${ev}"
            - "trigger call 4 response HTTP status == 200 and Claim.${cl}.event_id == ${ev} and handling_status == INTAKE"
            - "GET /housing-blocks?event_id=${ev} returns meta.total_count == 1 — exactly one block, so the 404 attempt left no orphan"
            - "GET /claims?event_id=${ev} returns meta.total_count == 1"
            - "CatastropheEvent.${ev}.open_claim_count == 1"

      - name: corner_entity_topology_flat_cross_reference_integrity_across_two_events
        claim_type: topology
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=30]
          - errors[ERR_EVENT_SCOPE_MISMATCH]
          - endpoints[POST /inspection-assignments]
          - endpoints[GET /inspection-assignments]
        distinguishing_aspect: |
          entity_topology is `flat`, so nothing in the URL scopes an InspectionAssignment to an event: the
          claim and the deployment are two independent FKs that can silently name DIFFERENT events. The
          probe holds every earlier check satisfied — the adjuster is licensed in both states (priority 27),
          the mode equals the claim's computed inspection_mode (priority 29) and the assignment window sits
          inside the deployment window (priority 26) — so the only thing left to fail is cross-reference
          integrity at priority 30. The same call then succeeds against a deployment on the claim's own
          event, and the list filters demonstrate FK reverse-reachability in both directions.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "Two DECLARED events: A 'CAT-2026-1012A' (HAIL, TX) and B 'CAT-2026-1012B' (HAIL, OK)."
            - "Adjuster ADJ_BOTH is licensed in [TX, OK]; adjuster ADJ_TX is licensed in [TX] only. Both STAFF, daily_rate 600, per_diem_rate 80."
            - "One cat-coded Claim on event A: reported 40000, DWELLING 100000/0/50000 -> severity 38.00 STANDARD, inspection_mode FIELD (reported 40000 > 10000.00), case_reserve 22500.00."
            - "CONFIRMED FIELD Deployment DEP_B for ADJ_BOTH on event B, 2026-09-01 -> 2026-09-10, no housing block."
            - "CONFIRMED FIELD Deployment DEP_A for ADJ_TX on event A, 2026-09-01 -> 2026-09-10, no housing block."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-1012A", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-26T00:00:00.000Z", exposure_count: 400, avg_insured_value: 150000, expected_severity_index: 0.0000 }
