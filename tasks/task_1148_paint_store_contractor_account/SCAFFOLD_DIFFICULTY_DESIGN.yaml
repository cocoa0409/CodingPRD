scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: rebate_provisional_vs_final_divergence
        grounds:
          - calculations.rebate_provisional
          - calculations.rebate_final
          - entities.RebateStatement.fields.provisional_amount_cents
          - entities.RebateStatement.fields.final_amount_cents
        distinguishing_aspect: |
          Dual-variant logic on the REBATE SETTLEMENT domain (RebateStatement): the forward-looking
          provisional variant (annualize-then-prorate, run mid-period) and the chronological
          final variant (straddling marginal sweep over payment events, run after period close)
          produce 174065 vs 280000 for the same paid orders.
        test_recipe:
          setup:
            - "Contractor account with credit 100000000, one job in a rule-free jurisdiction, one FLAT product priced 6000000"
            - "Order O1 (qty 1) paid at 2026-04-10; statement for period [2026-04-01, 2026-07-01) generated at 2026-05-01"
            - "Order O2 (qty 1) paid at 2026-05-20; statement finalized at 2026-07-01"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /contractor-accounts", payload: { company_name: "Rebate Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: $.data.id, av0: $.data.version } }
            - { call: "POST /jurisdictions", payload: { code: "TX-OPEN", name: "Texas Open" }, as: CorporateAdmin, captures: { jur: $.data.id } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "HQ", site_address: "1 Main St" }, as: StoreAssociate, captures: { job: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-REB-1", name: "Bulk Flat", category: "FLAT", voc_gpl: 100, list_price_cents: 6000000, tintable: false }, as: CorporateAdmin, captures: { prod: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: CorporateAdmin, captures: { stmt: $.data.id, prov: $.data.provisional_amount_cents } }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o2: $.data.id } }
            - { call: "POST /orders/${o2}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: CorporateAdmin }
          trigger:
            - { call: "POST /rebate-statements/${stmt}/finalize", payload: {}, as: CorporateAdmin }
          assert:
            - "RebateStatement.${stmt}.provisional_amount_cents == 174065 (floor(floor(6000000*91/30) banded => 528000 * 30/91))"
            - "RebateStatement.${stmt}.final_amount_cents == 280000 (chronological: 120000 for the first 6000000, then 4000000@2% + 2000000@4% = 160000 for the second)"
            - "provisional and final variants disagree for identical order data: 174065 != 280000"

      - name: pull_through_ordered_vs_delivered_divergence
        grounds:
          - calculations.pull_through
          - entities.SpecLine.fields.ordered_qty
          - entities.SpecLine.fields.delivered_qty
          - entities.SpecSheet.fields.pull_through_ordered_pct
          - entities.SpecSheet.fields.pull_through_delivered_pct
        distinguishing_aspect: |
          Dual-variant logic on the SPEC PULL-THROUGH domain (SpecSheet/SpecLine): the ordered-basis
          variant counts PAID orders (100.0 pct) while the delivered-basis variant counts only
          DELIVERED orders (40.0 pct) for the same sheet.
        test_recipe:
          setup:
            - "Account, job, product P-PT-1 (list 100000); APPROVED spec sheet with one line specified_qty 10"
            - "Order O1: 6 units attributed to the spec line, paid, never delivered"
            - "Order O2: 4 units attributed to the spec line, paid and fully delivered"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Pull Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: $.data.id, av0: $.data.version } }
            - { call: "POST /jurisdictions", payload: { code: "OR-OPEN", name: "Oregon Open" }, as: CorporateAdmin, captures: { jur: $.data.id } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Tower", site_address: "9 Oak Ave" }, as: StoreAssociate, captures: { job: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-PT-1", name: "Spec Flat", category: "FLAT", voc_gpl: 100, list_price_cents: 100000, tintable: false }, as: CorporateAdmin, captures: { prod: $.data.id } }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-PT", architect_name: "A A", title: "Lobby Spec", lines: [{ product_id: "${prod}", specified_qty: 10 }] }, as: SpecWriter, captures: { sheet: $.data.id } }
            - { call: "GET /spec-lines?spec_sheet_id=${sheet}", payload: {}, as: SpecWriter, captures: { sline: "$.data[0].id" } }
            - { call: "POST /spec-sheets/${sheet}/submit", payload: {}, as: SpecWriter }
            - { call: "POST /spec-sheets/${sheet}/approve", payload: {}, as: CorporateAdmin }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 6, spec_line_id: "${sline}" }] }, as: StoreAssociate, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: $.data.version } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${prod}", quantity: 4, spec_line_id: "${sline}" }] }, as: StoreAssociate, captures: { o2: $.data.id } }
            - { call: "POST /orders/${o2}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /deliveries", payload: { order_id: "${o2}", job_account_id: "${job}", window_start: "2026-06-10T09:00:00Z", window_end: "2026-06-10T10:00:00Z" }, as: StoreManager, captures: { d2: $.data.id } }
            - { call: "POST /deliveries/${d2}/dispatch", payload: {}, as: StoreManager }
          trigger:
            - { call: "POST /deliveries/${d2}/mark-delivered", payload: {}, as: StoreManager }
          assert:
            - "SpecLine.${sline}.ordered_qty == 10 and delivered_qty == 4"
            - "SpecSheet.${sheet}.pull_through_ordered_pct == 100.0 (min(6,10)+min(4,10) over 10)"
            - "SpecSheet.${sheet}.pull_through_delivered_pct == 40.0 (only the delivered order counts)"

  - rule_id: combinatorial_formula
    instances:
      - name: line_pricing_unit_round_first
        grounds:
          - calculations.line_pricing
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: line_pricing rounds the discounted unit price first, then
          multiplies by quantity — GOLD tier, list 999, qty 7 yields 6293; the alternative
          extend-then-round order would yield 6294, so the pinned order is observable.
        test_recipe:
          setup:
            - "Account driven to GOLD tier by a 15000000-subtotal paid order (boundary meets >= GOLD_MIN_CENTS)"
            - "Second product priced 999 cents; order of 7 units (below QTY_BREAK_MIN 10, no quantity break)"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Round Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: $.data.id, av0: $.data.version } }
            - { call: "POST /jurisdictions", payload: { code: "WA-OPEN", name: "Washington Open" }, as: CorporateAdmin, captures: { jur: $.data.id } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Shop", site_address: "3 Pine St" }, as: StoreAssociate, captures: { job: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-TIER", name: "Drum", category: "FLAT", voc_gpl: 100, list_price_cents: 15000000, tintable: false }, as: CorporateAdmin, captures: { p_tier: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-ROUND", name: "Quart", category: "FLAT", voc_gpl: 100, list_price_cents: 999, tintable: false }, as: CorporateAdmin, captures: { p_round: $.data.id } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${p_tier}", quantity: 1 }] }, as: StoreAssociate, captures: { o0: $.data.id } }
            - { call: "POST /orders/${o0}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /contractor-accounts/${acct}/evaluate-tier", payload: {}, as: CorporateAdmin }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: $.data.version } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${p_round}", quantity: 7 }] }, as: StoreAssociate, captures: { o1: $.data.id } }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
          assert:
            - "OrderLine.${ln}.unit_price_cents == 899 (round_half_up(999 * 0.90) applied per unit FIRST)"
            - "OrderLine.${ln}.line_total_cents == 6293 (899 * 7); the rejected extend-then-round order would give 6294"
            - "Order.${o1}.subtotal_cents == 6293, tax_cents == 519 (round_half_up(6293 * 0.0825)), total_cents == 6812"

      - name: rebate_payable_cap_binds_over_adjustment
        grounds:
          - calculations.rebate_payable
          - entities.RebateStatement.fields.payable_cents
          - entities.RebateStatement.fields.adjustment_cents
        distinguishing_aspect: |
          Mode (a) non-linear multi-input interaction: payable_cents = max(0, min(final + adjustment,
          5% of period_net)) — with final 600000, adjustment +500000, and period_net 20000000 the
          cap (1000000) binds below the adjusted figure (1100000); a different mode than the
          rounding-order instance above.
        test_recipe:
          setup:
            - "Account with one paid order of subtotal 20000000 in period [2026-04-01, 2026-07-01)"
            - "Statement generated and finalized after period close; contractor disputes; admin resolves with +500000 adjustment"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-05T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /contractor-accounts", payload: { company_name: "Cap Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: $.data.id, av0: $.data.version } }
            - { call: "POST /jurisdictions", payload: { code: "AZ-OPEN", name: "Arizona Open" }, as: CorporateAdmin, captures: { jur: $.data.id } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Mall", site_address: "7 Palm Rd" }, as: StoreAssociate, captures: { job: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-CAP", name: "Tote", category: "FLAT", voc_gpl: 100, list_price_cents: 20000000, tintable: false }, as: CorporateAdmin, captures: { prod: $.data.id } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /rebate-statements", payload: { contractor_account_id: "${acct}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }, as: CorporateAdmin, captures: { stmt: $.data.id } }
            - { call: "POST /rebate-statements/${stmt}/finalize", payload: {}, as: CorporateAdmin }
            - { call: "POST /rebate-statements/${stmt}/dispute", payload: {}, as: Contractor, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /rebate-statements/${stmt}/resolve-dispute", payload: { adjustment_cents: 500000 }, as: CorporateAdmin }
          assert:
            - "RebateStatement.${stmt}.final_amount_cents == 600000 (chronological straddle: 10000000@2% = 200000 plus 10000000@4% = 400000)"
            - "RebateStatement.${stmt}.period_net_cents == 20000000"
            - "RebateStatement.${stmt}.payable_cents == 1000000 — cap round_half_up(0.05 * 20000000) binds below final+adjustment == 1100000"
            - "RebateStatement.${stmt}.status == FINALIZED after the dispute cycle"

  - rule_id: non_linear_state_machine
    instances:
      - name: color_match_revision_cycle_loops
        grounds:
          - state_machines.ColorMatchRequest.SUBMITTED_to_PROPOSED
          - state_machines.ColorMatchRequest.PROPOSED_to_REVISION_REQUESTED
          - state_machines.ColorMatchRequest.REVISION_REQUESTED_to_PROPOSED
          - state_machines.ColorMatchRequest.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Cyclic shape on ColorMatchRequest: SUBMITTED -> PROPOSED -> REVISION_REQUESTED -> PROPOSED
          -> APPROVED, with the rejected proposal formula retired on the loop-back and the revision
          counter advancing per cycle.
        test_recipe:
          setup:
            - "Account and a tintable product; one color match request"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Match Co", credit_limit_cents: 1000000 }, as: CorporateAdmin, captures: { acct: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-CM", name: "Match Base", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: true }, as: CorporateAdmin, captures: { prod: $.data.id } }
            - { call: "POST /color-match-requests", payload: { contractor_account_id: "${acct}", product_id: "${prod}", sample_reference: "S-1" }, as: StoreAssociate, captures: { cmr: $.data.id } }
            - { call: "POST /color-match-requests/${cmr}/proposals", payload: { color_code: "SW 7008", name: "Alabaster-ish", shots: [{ colorant_code: "B1", ounces_128ths: 24 }] }, as: StoreAssociate, captures: { f1: $.data.formula_id } }
            - { call: "POST /color-match-requests/${cmr}/request-revision", payload: {}, as: Contractor, as_user_id: "${acct}" }
          trigger:
            - { call: "POST /color-match-requests/${cmr}/proposals", payload: { color_code: "SW 7008", name: "Alabaster v2", shots: [{ colorant_code: "B1", ounces_128ths: 32 }] }, as: StoreAssociate, captures: { f2: $.data.formula_id } }
            - { call: "POST /color-match-requests/${cmr}/approve", payload: {}, as: Contractor, as_user_id: "${acct}" }
          assert:
            - "ColorMatchRequest.${cmr}.status == APPROVED and iteration_count == 2"
            - "TintFormula.${f1}.status == RETIRED (withdrawn when the revision was requested)"
            - "TintFormula.${f2}.status == ACTIVE, revision == 2, source == COLOR_MATCH"

      - name: order_payment_fulfillment_parallel_dimensions
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.PENDING_to_OUT_FOR_DELIVERY
          - state_machines.Order.OUT_FOR_DELIVERY_to_DELIVERED
          - state_machines.Order.PAID_to_PARTIALLY_REFUNDED
        distinguishing_aspect: |
          Parallel state dimensions on Order (a different entity and a different non-linear shape
          than the ColorMatchRequest cycle): payment and fulfillment evolve independently — paying
          does not advance fulfillment, dispatching does not advance payment, and a payment-side
          return leaves fulfillment DELIVERED untouched.
        test_recipe:
          setup:
            - "Account, job, product priced 5000; order of 2 units"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Par Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: $.data.id, av0: $.data.version } }
            - { call: "POST /jurisdictions", payload: { code: "NV-OPEN", name: "Nevada Open" }, as: CorporateAdmin, captures: { jur: $.data.id } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Depot", site_address: "4 Elm St" }, as: StoreAssociate, captures: { job: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-PAR", name: "Gal", category: "FLAT", voc_gpl: 100, list_price_cents: 5000, tintable: false }, as: CorporateAdmin, captures: { prod: $.data.id } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 2 }] }, as: StoreAssociate, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /deliveries", payload: { order_id: "${o1}", job_account_id: "${job}", window_start: "2026-06-11T09:00:00Z", window_end: "2026-06-11T10:00:00Z" }, as: StoreManager, captures: { d1: $.data.id } }
            - { call: "POST /deliveries/${d1}/dispatch", payload: {}, as: StoreManager }
            - { call: "POST /deliveries/${d1}/mark-delivered", payload: {}, as: StoreManager }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
          trigger:
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 1 }, as: StoreAssociate }
          assert:
            - "after pay: payment_status == PAID while fulfillment_status was still PENDING (dimensions independent)"
            - "after dispatch: payment_status remained PAID while fulfillment moved to OUT_FOR_DELIVERY"
            - "after mark-delivered + return of 1 unit: payment_status == PARTIALLY_REFUNDED and fulfillment_status == DELIVERED (payment-side event leaves fulfillment untouched)"
            - "Order.${o1}.refunded_cents == 5413 (5000 merchandise + round_half_up(5000 * 0.0825) = 413 tax)"

  - rule_id: transitive_cascade
    instances:
      - name: bulletin_effect_discontinuation_chain
        grounds:
          - state_machines.ProductBulletin.PUBLISHED_to_EFFECTIVE
          - state_machines.Product.ACTIVE_to_DISCONTINUED
          - state_machines.TintFormula.ACTIVE_to_RETIRED
          - state_machines.SpecSheet.APPROVED_to_NEEDS_REVISION
        distinguishing_aspect: |
          Depth-3 cascade triggered by bulletin take-effect: bulletin -> product DISCONTINUED ->
          (spec lines obsoleted) -> APPROVED spec sheet forced to NEEDS_REVISION, with the
          formula-retirement branch retiring the product's ACTIVE formulas at hop 2.
        test_recipe:
          setup:
            - "Products OLD (with ACTIVE formula) and NEW (same category, ACTIVE); APPROVED spec sheet whose single line specifies OLD"
            - "Published bulletin discontinuing OLD in favor of NEW, effective 2026-06-01; clock advanced to the effective date"
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P-OLD", name: "Legacy Flat", category: "FLAT", voc_gpl: 100, list_price_cents: 10000, tintable: true }, as: CorporateAdmin, captures: { p_old: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-NEW", name: "Successor Flat", category: "FLAT", voc_gpl: 120, list_price_cents: 11000, tintable: true }, as: CorporateAdmin, captures: { p_new: $.data.id } }
            - { call: "POST /tint-formulas", payload: { product_id: "${p_old}", color_code: "SW 1000", name: "Legacy White", shots: [{ colorant_code: "W1", ounces_128ths: 16 }] }, as: CorporateAdmin, captures: { f_old: $.data.id } }
            - { call: "POST /spec-sheets", payload: { project_code: "PRJ-DC", architect_name: "A A", title: "Facade Spec", lines: [{ product_id: "${p_old}", specified_qty: 5 }] }, as: SpecWriter, captures: { sheet: $.data.id } }
            - { call: "GET /spec-lines?spec_sheet_id=${sheet}", payload: {}, as: SpecWriter, captures: { sline: "$.data[0].id" } }
            - { call: "POST /spec-sheets/${sheet}/submit", payload: {}, as: SpecWriter }
            - { call: "POST /spec-sheets/${sheet}/approve", payload: {}, as: CorporateAdmin }
            - { call: "POST /product-bulletins", payload: { product_id: "${p_old}", replacement_product_id: "${p_new}", title: "P-OLD discontinuation", effective_date: "2026-06-01T00:00:00Z" }, as: CorporateAdmin, captures: { bul: $.data.id } }
            - { call: "POST /product-bulletins/${bul}/publish", payload: {}, as: CorporateAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: CorporateAdmin }
          trigger:
            - { call: "POST /product-bulletins/${bul}/take-effect", payload: {}, as: CorporateAdmin }
          assert:
            - "Product.${p_old}.status == DISCONTINUED and replacement_product_id == ${p_new}"
            - "TintFormula.${f_old}.status == RETIRED (hop 2 branch: product mutation retires its ACTIVE formulas)"
            - "SpecLine.${sline}.obsoleted == true (hop 2 branch: product mutation flags spec lines on non-terminal sheets)"
            - "SpecSheet.${sheet}.status == NEEDS_REVISION (hop 3: the SpecLine mutation itself drives the sheet transition)"
            - "ProductBulletin.${bul}.status == EFFECTIVE"

      - name: return_refund_loyalty_clawback_chain
        grounds:
          - state_machines.Order.PAID_to_PARTIALLY_REFUNDED
          - calculations.return_refund
          - calculations.loyalty_clawback
          - calculations.job_spent
        distinguishing_aspect: |
          Depth-3 cascade from a DIFFERENT trigger (line return, not bulletin): return ->
          ReturnRecord/OrderLine mutation -> order refund recompute (payment_status flips) ->
          loyalty CLAWBACK posting AND job spent recompute — each hop caused by the previous one.
        test_recipe:
          setup:
            - "STANDARD account with a paid order: 4 units at 20000 list (subtotal 80000, tax 6600, total 86600); EARN posted 800 points at pay; job spent 86600"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Claw Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: $.data.id, av0: $.data.version } }
            - { call: "POST /jurisdictions", payload: { code: "UT-OPEN", name: "Utah Open" }, as: CorporateAdmin, captures: { jur: $.data.id } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Barn", site_address: "2 Birch Ln" }, as: StoreAssociate, captures: { job: $.data.id } }
            - { call: "POST /products", payload: { sku: "P-RET", name: "Pail", category: "FLAT", voc_gpl: 100, list_price_cents: 20000, tintable: false }, as: CorporateAdmin, captures: { prod: $.data.id } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 4 }] }, as: StoreAssociate, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/pay", payload: {}, as: StoreAssociate }
            - { call: "GET /order-lines?order_id=${o1}", payload: {}, as: StoreAssociate, captures: { ln: "$.data[0].id" } }
          trigger:
            - { call: "POST /order-lines/${ln}/return", payload: { quantity: 1 }, as: StoreAssociate }
          assert:
            - "OrderLine.${ln}.returned_quantity == 1 (hop 1: line mutation)"
            - "Order.${o1}.refunded_cents == 21650 and payment_status == PARTIALLY_REFUNDED (hop 2: refund recompute flips payment state)"
            - "ContractorAccount.${acct}.loyalty_points_balance == 600 (hop 3a: CLAWBACK of floor(20000/100)*1 = 200 points against the 800 earned)"
            - "JobAccount.${job}.spent_cents == 64950 (hop 3b: 86600 - 21650)"
            - "loyalty ledger for ${acct} contains a CLAWBACK entry with points_delta == -200"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_account_beats_credit_limit
        grounds:
          - validations[priority=8]
          - validations[priority=39]
          - errors[ERR_ACCOUNT_SUSPENDED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: one POST /orders violates both
          ERR_ACCOUNT_SUSPENDED (priority 8) and ERR_CREDIT_LIMIT_EXCEEDED (priority 39);
          the state error must win.
        test_recipe:
          setup:
            - "Account with credit_limit_cents 50000 and one UNPAID order of total 43300 (outstanding balance 43300)"
            - "Account then suspended; a second identical order would push outstanding to 86600 > 50000"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Tight Co", credit_limit_cents: 50000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "OH-OPEN", name: "Ohio Open" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "Shed", site_address: "5 Ash Dr" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-CR", name: "Can", category: "FLAT", voc_gpl: 100, list_price_cents: 40000, tintable: false }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate, captures: { o1: "$.data.id" } }
            - { call: "POST /contractor-accounts/${acct}/suspend", payload: {}, as: CorporateAdmin }
            - { call: "GET /contractor-accounts/${acct}", payload: {}, as: CorporateAdmin, captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av1}", lines: [{ product_id: "${prod}", quantity: 1 }] }, as: StoreAssociate }
          assert:
            - "response is HTTP 409 with error_id ERR_ACCOUNT_SUSPENDED (state, priority 8)"
            - "NOT ERR_CREDIT_LIMIT_EXCEEDED even though outstanding 43300 + new total 43300 = 86600 exceeds credit_limit_cents 50000 (business_fiscal, priority 39)"

      - name: voc_check_beats_retired_formula
        grounds:
          - validations[priority=19]
          - validations[priority=34]
          - errors[ERR_VOC_LIMIT_EXCEEDED]
          - errors[ERR_FORMULA_RETIRED]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_referential (different pair than the
          state/fiscal conflict): one order line violates both VOC compliance (priority 19) and
          formula-retired referential integrity (priority 34); the safety error must win.
        test_recipe:
          setup:
            - "Jurisdiction with VocRule FLAT max_voc_gpl 250 effective from 2026-01-01 open-ended; job in that jurisdiction"
            - "Product PV: FLAT, voc_gpl 300, tintable; formula F on PV created then retired"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "Voc Co", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acct: "$.data.id", av0: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "CA-SCAQMD", name: "SCAQMD" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /voc-rules", payload: { jurisdiction_id: "${jur}", category: "FLAT", max_voc_gpl: 250, effective_from: "2026-01-01T00:00:00Z" }, as: CorporateAdmin }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acct}", jurisdiction_id: "${jur}", job_name: "LA Site", site_address: "1 Sunset Blvd" }, as: StoreAssociate, captures: { job: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-VOC", name: "Hot Flat", category: "FLAT", voc_gpl: 300, list_price_cents: 10000, tintable: true }, as: CorporateAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /tint-formulas", payload: { product_id: "${prod}", color_code: "SW 2000", name: "Hot White", shots: [{ colorant_code: "W1", ounces_128ths: 8 }] }, as: CorporateAdmin, captures: { frm: "$.data.id" } }
            - { call: "POST /tint-formulas/${frm}/retire", payload: {}, as: CorporateAdmin }
          trigger:
            - { call: "POST /orders", payload: { contractor_account_id: "${acct}", job_account_id: "${job}", expected_contractor_account_version: "${av0}", lines: [{ product_id: "${prod}", quantity: 1, formula_id: "${frm}" }] }, as: StoreAssociate }
          assert:
            - "response is HTTP 422 with error_id ERR_VOC_LIMIT_EXCEEDED (business_safety, priority 19; 300 > 250)"
            - "NOT ERR_FORMULA_RETIRED even though the referenced formula is RETIRED (business_referential, priority 34)"

  - rule_id: boundary_precision_check
    instances:
      - name: tier_gold_threshold_inclusive
        grounds:
          - calculations.tier_evaluation
          - entities.ContractorAccount.fields.tier
        distinguishing_aspect: |
          Boundary on the year-net-merchandise-volume metric: volume exactly equal to
          GOLD_MIN_CENTS (15000000) earns GOLD (>= inclusive), while one cent below stays SILVER.
        test_recipe:
          setup:
            - "Account A with one paid order of subtotal exactly 15000000"
            - "Account B with one paid order of subtotal exactly 14999999"
          setup_api_calls:
            - { call: "POST /contractor-accounts", payload: { company_name: "A Exact", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acctA: "$.data.id", avA: "$.data.version" } }
            - { call: "POST /contractor-accounts", payload: { company_name: "B Below", credit_limit_cents: 100000000 }, as: CorporateAdmin, captures: { acctB: "$.data.id", avB: "$.data.version" } }
            - { call: "POST /jurisdictions", payload: { code: "TX-B", name: "Texas B" }, as: CorporateAdmin, captures: { jur: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acctA}", jurisdiction_id: "${jur}", job_name: "JA", site_address: "1 A St" }, as: StoreAssociate, captures: { jobA: "$.data.id" } }
            - { call: "POST /job-accounts", payload: { contractor_account_id: "${acctB}", jurisdiction_id: "${jur}", job_name: "JB", site_address: "1 B St" }, as: StoreAssociate, captures: { jobB: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-EXACT", name: "Exact Drum", category: "FLAT", voc_gpl: 100, list_price_cents: 15000000, tintable: false }, as: CorporateAdmin, captures: { pA: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "P-BELOW", name: "Below Drum", category: "FLAT", voc_gpl: 100, list_price_cents: 14999999, tintable: false }, as: CorporateAdmin, captures: { pB: "$.data.id" } }
            - { call: "POST /orders", payload: { contractor_account_id: "${acctA}", job_account_id: "${jobA}", expected_contractor_account_version: "${avA}", lines: [{ product_id: "${pA}", quantity: 1 }] }, as: StoreAssociate, captures: { oA: "$.data.id" } }
            - { call: "POST /orders/${oA}/pay", payload: {}, as: StoreAssociate }
            - { call: "POST /orders", payload: { contractor_account_id: "${acctB}", job_account_id: "${jobB}", expected_contractor_account_version: "${avB}", lines: [{ product_id: "${pB}", quantity: 1 }] }, as: StoreAssociate, captures: { oB: "$.data.id" } }
            - { call: "POST /orders/${oB}/pay", payload: {}, as: StoreAssociate }
          trigger:
            - { call: "POST /contractor-accounts/${acctA}/evaluate-tier", payload: {}, as: CorporateAdmin }
            - { call: "POST /contractor-accounts/${acctB}/evaluate-tier", payload: {}, as: CorporateAdmin }
          assert:
            - "ContractorAccount.${acctA}.tier == GOLD (V == 15000000 meets >= GOLD_MIN_CENTS)"
            - "ContractorAccount.${acctB}.tier == SILVER (V == 14999999 is one cent below GOLD_MIN_CENTS)"

      - name: voc_limit_equality_compliant
        grounds:
          - validations[priority=19]
          - errors[ERR_VOC_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Boundary on a DIFFERENT metric (VOC grams-per-liter) reachable through a DIFFERENT
          endpoint (POST /orders, not evaluate-tier): product voc_gpl exactly equal to the rule
          max (250) is compliant (<= inclusive); 251 is rejected.
        test_recipe:
          setup:
            - "Jurisdiction with VocRule FLAT max_voc_gpl 250 open-ended from 2026-01-01; job in it"
            - "Product EQ (voc_gpl 250) and product OVER (voc_gpl 251)"
          setup_api_calls:
