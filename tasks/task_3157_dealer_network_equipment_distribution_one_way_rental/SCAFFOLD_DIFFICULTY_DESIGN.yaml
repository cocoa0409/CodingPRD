              as: NetworkAdmin
              captures: { unit_1: $.data.id }
            - call: "POST /rental-network/lane-rates"
              payload: { origin_location_id: "${loc_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", season: "OFF_PEAK", base_rate_cents: 5000, reposition_surcharge_cents: 0, commission_rate: 0.10 }
              as: PricingManager
              captures: { rate_1: $.data.id }
            - call: "POST /rental-network/lane-rates/${rate_1}/activate"
              payload: {}
              as: PricingManager
            - call: "POST /rental-network/vehicle-profiles"
              payload: { label: "Sedan", make: "Honda", model: "Accord", year: 2020, curb_weight_lbs: 3300, tow_capacity_lbs: 0, hitch_class: "NONE" }
              as: Customer
              captures: { veh_1: $.data.id }
            - call: "POST /rental-network/customers"
              payload: { email: "c13@x.com", full_name: "Cust Thirteen", vehicle_profile_id: "${veh_1}" }
              as: Customer
              captures: { cust_1: $.data.id }
            - call: "POST /rental-network/customers/${cust_1}/verify-license"
              payload: {}
              as: DealerAgent
              as_user_id: "${dealer_a}"
            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_1}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-12T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { rsv_1: $.data.id, rsv_1_v: $.data.version }
            - call: "POST /rental-network/dealers/${dealer_a}/suspend"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /rental-network/reservations/${rsv_1}/confirm"
              payload: { expected_reservation_version: "${rsv_1_v}" }
              as: Customer
              as_user_id: "${cust_1}"
              captures: { err: $.data.error_id }
          assert:
            - "Dealer.${dealer_a}.status == SUSPENDED"
            - "trigger response error_id == ERR_DEALER_SUSPENDED (reservation's own state QUOTED is valid; the DEALER's state blocks the transition)"
            - "HTTP 409"

      - name: settle_blocked_by_open_damage_claim_and_location_close_blocked_by_fleet
        grounds:
          - validations[priority=18]
          - state_machines.RentalAgreement.RETURNED_to_SETTLED
          - state_machines.Location.OPEN_to_CLOSED
          - entities.DamageClaim.fields.status
        distinguishing_aspect: |
          Pair RentalAgreement -> DamageClaim AND Location -> EquipmentUnit
          (two different cross-entity pairs than Reservation->Dealer): settle
          on a RETURNED agreement with a FILED claim fails with
          ERR_OPEN_CLAIMS; closing a location that still holds an AVAILABLE
