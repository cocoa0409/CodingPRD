scenario: |
  Generate task harder than expert level!

  2573. Fixed-Wireless Rural ISP Tower & Subscriber Installation (Rise Broadband):
  serviceability qualification by line-of-sight and tower sector capacity, subscriber
  install survey with mast height and mounting decision, sector oversubscription
  monitoring and capacity-hold on new sales, spectrum license and interference
  coordination between towers, data-usage tier and deprioritization policy,
  weather-related outage credit and SLA exceptions, equipment rental vs purchase and
  return on cancellation, tower lease payments and backhaul circuit provisioning

domain_name: "fixed-wireless-rural-isp"
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Sector sits at the centre of a many-to-many graph: InterferenceCoordination is a
  # self-referential junction between two Sectors, CapacityHold joins Sector x
  # ServiceabilityRequest, Subscriber joins Sector x ServiceabilityRequest x ServicePlan,
  # and OutageCredit joins Subscriber x OutageEvent. URL paths stay flat (no nesting
  # deeper than one sub-resource segment) because no single ownership tree exists.

  state_machine_shape: parallel
  # Subscriber carries two independent state dimensions (service_status x usage_priority).
  # InterferenceCoordination is cyclic (REVISION_REQUESTED -> REQUESTED negotiation rounds,
  # capped at MAX_COORDINATION_ROUNDS). InstallWorkOrder is a branching fork-join whose
  # survey transition fans into four target states with disjoint side-effect sets, and
  # loops back through RESURVEY_REQUIRED -> SCHEDULED. BackhaulCircuit cycles
  # ACCEPTED -> DEGRADED -> ACCEPTED.

  relationship_patterns:
    - one_to_many          # Tower -> Sector, Subscriber -> UsageRecord
    - many_to_many         # Sector <-> Sector via InterferenceCoordination
    - self_referential     # InterferenceCoordination.requesting_sector_id / neighbor_sector_id
    - cross_aggregate      # OutageCredit spans the RF aggregate (OutageEvent/Tower) and the
                           # commercial aggregate (Subscriber/ServicePlan)

  role_model: segregation_of_duties
  # Two enforced separations, both on X-User-ID and both across different role pairs:
  # (1) the FieldTech who recorded an InstallWorkOrder survey may not be the user who
  #     approves its mounting exception (NetworkEngineer);
  # (2) the BillingAdmin who prepared an OutageCredit may not be the user who applies it
  #     (FinanceApprover).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Tower
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: "Operator site code printed on the tower placard"
        constraints: "4-32 chars, unique across all Towers (case-sensitive)"
      - name: latitude
        type: number
        source: input
        description: "Tower base latitude in decimal degrees"
        constraints: "-90.0 .. 90.0, 4 decimal places"
      - name: longitude
        type: number
        source: input
        description: "Tower base longitude in decimal degrees"
        constraints: "-180.0 .. 180.0, 4 decimal places"
      - name: ground_elevation_m
        type: number
        source: input
        description: "Above-mean-sea-level elevation of the tower base, metres"
        constraints: "0.0 .. 4500.0, 1 decimal place"
      - name: antenna_agl_m
        type: number
        source: input
        description: "Height above ground level of the sector antenna mounting band, metres"
        constraints: "6.0 .. 120.0, 1 decimal place"
      - name: status
        type: enum
        source: system
        description: "Tower lifecycle state"
        default: PLANNED
        constraints: "PLANNED | ACTIVE | MAINTENANCE | DECOMMISSIONED"
      - name: lease_landowner_name
        type: string
        source: input
        description: "Counterparty on the ground lease"
      - name: lease_monthly_base_rent_cents
        type: integer
        source: input
        description: "Year-1 monthly ground rent in cents (no escalator applied)"
        constraints: ">= 0"
      - name: lease_escalator_pct
        type: number
        source: input
        description: "Annual rent escalator as a decimal fraction (0.0275 == 2.75%/yr)"
        constraints: "0.0 .. 0.15, 4 decimal places"
      - name: lease_start_date
        type: string
        source: input
        description: "Lease commencement date, YYYY-MM-DD; anniversaries are measured from this date"
      - name: lease_term_months
        type: integer
        source: input
        description: "Total committed lease term in months"
        constraints: "12 .. 240, must be an exact multiple of 12"
      - name: current_monthly_rent_cents
        type: integer
        source: computed
        description: "Escalated monthly rent for the lease year containing the logical clock; output of calculation tower_lease_escalation"
      - name: active_sector_count
        type: integer
        source: computed
        description: "Count of Sector rows with tower_id == this Tower and status == ACTIVE"
      - name: backhaul_accepted_mbps
        type: integer
        source: computed
        description: "committed_mbps of this Tower's BackhaulCircuit whose state == ACCEPTED; 0 when no circuit is in state ACCEPTED"

  - name: BackhaulCircuit
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the tower this circuit hauls traffic for"
      - name: carrier_name
        type: string
        source: input
        description: "Transport carrier delivering the circuit"
      - name: circuit_ref
        type: string
        source: input
        description: "Carrier circuit identifier"
        constraints: "unique across all BackhaulCircuit rows"
      - name: committed_mbps
        type: integer
        source: input
        description: "Committed information rate of the circuit in Mbps"
        constraints: ">= 1"
      - name: monthly_cost_cents
        type: integer
        source: input
        description: "Recurring transport cost in cents"
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: "Provisioning state of the circuit"
        default: ORDERED
        constraints: "ORDERED | INSTALLED | ACCEPTED | DEGRADED | CANCELLED"
      - name: measured_mbps
        type: number
        source: input
        description: "Throughput measured on the most recent ACCEPTED or DEGRADED state change; null before acceptance"
        default: null
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first transition into ACCEPTED; null before that"
        default: null
      - name: degraded_since
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent transition into DEGRADED; cleared to null on restore to ACCEPTED"
        default: null

  - name: SpectrumLicense
    parent: null
    common_fields: true
    fields:
      - name: license_ref
        type: string
        source: input
        description: "Regulator licence identifier"
        constraints: "unique across all SpectrumLicense rows"
      - name: band
        type: enum
        source: input
        description: "Licensed band family"
        constraints: "CBRS_3_5GHZ | EBS_2_5GHZ | LTE_700MHZ"
      - name: channel_center_mhz
        type: number
        source: input
        description: "Centre frequency of the licensed block in MHz"
        constraints: "600.0 .. 6000.0, 1 decimal place"
      - name: channel_width_mhz
        type: number
        source: input
        description: "Width of the licensed block in MHz"
        constraints: "5.0 .. 200.0, 1 decimal place"
      - name: max_eirp_dbm
        type: number
        source: input
        description: "Maximum permitted effective isotropic radiated power in dBm"
        constraints: "20.0 .. 65.0, 1 decimal place"
      - name: license_area_code
        type: string
        source: input
        description: "Regulator geographic area code the licence covers"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the licence validity window"
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the licence validity window"
        constraints: "must be strictly after effective_from"
      - name: lower_edge_mhz
        type: number
        source: computed
        description: "channel_center_mhz - channel_width_mhz / 2"
      - name: upper_edge_mhz
        type: number
        source: computed
        description: "channel_center_mhz + channel_width_mhz / 2"
      - name: status
        type: enum
        source: computed
        description: "PENDING when clock_now < effective_from; ACTIVE when effective_from <= clock_now < effective_to; EXPIRED when clock_now >= effective_to. Recomputed on every read against the logical clock"
        constraints: "PENDING | ACTIVE | EXPIRED"

  - name: Sector
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the tower carrying this sector"
      - name: spectrum_license_id
        type: string
        source: input
        description: "FK -> SpectrumLicense.id; the licence authorising this sector's channel"
      - name: azimuth_deg
        type: number
        source: input
        description: "Boresight azimuth of the sector antenna in degrees clockwise from true north"
        constraints: "0.0 .. 359.9, 1 decimal place"
      - name: beamwidth_deg
        type: number
        source: input
        description: "Horizontal 3 dB beamwidth in degrees"
        constraints: "15.0 .. 180.0, 1 decimal place"
      - name: channel_center_mhz
        type: number
        source: input
        description: "Centre frequency this sector transmits on, MHz"
        constraints: "600.0 .. 6000.0, 1 decimal place"
      - name: channel_width_mhz
        type: number
        source: input
        description: "Occupied channel width, MHz"
        constraints: "5.0 .. 100.0, 1 decimal place"
      - name: tx_power_dbm
        type: number
        source: input
        description: "Conducted transmit power at the radio port, dBm"
        constraints: "0.0 .. 40.0, 1 decimal place"
      - name: antenna_gain_dbi
        type: number
        source: input
        description: "Antenna gain in dBi used for the EIRP compliance check"
        constraints: "0.0 .. 30.0, 1 decimal place"
      - name: eirp_dbm
        type: number
        source: computed
        description: "tx_power_dbm + antenna_gain_dbi, rounded to 1 decimal place"
      - name: lower_edge_mhz
        type: number
        source: computed
        description: "channel_center_mhz - channel_width_mhz / 2"
      - name: upper_edge_mhz
        type: number
        source: computed
        description: "channel_center_mhz + channel_width_mhz / 2"
      - name: capacity_mbps
        type: integer
        source: input
        description: "Usable aggregate downstream throughput of the sector in Mbps"
        constraints: ">= 1"
      - name: max_oversubscription_ratio
        type: number
        source: input
        description: "Maximum permitted committed_mbps / capacity_mbps for this sector"
        default: 8.0
        constraints: "1.0 .. 20.0, 1 decimal place"
      - name: status
        type: enum
        source: system
        description: "Sector lifecycle state"
        default: PLANNED
        constraints: "PLANNED | ACTIVE | DISABLED"
      - name: sold_mbps
        type: integer
        source: computed
        description: "Output of calculation sector_capacity_posture: summed plan downstream_mbps of Subscribers on this sector in service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED}"
      - name: held_mbps
        type: integer
        source: computed
        description: "Output of calculation sector_capacity_posture: summed held_mbps of CapacityHolds on this sector with status == HELD and expires_at > clock_now"
      - name: committed_mbps
        type: integer
        source: computed
        description: "sold_mbps + held_mbps"
      - name: oversubscription_ratio
        type: number
        source: computed
        description: "committed_mbps / capacity_mbps, round_half_up to 3 decimal places"
      - name: remaining_allowance_mbps
        type: integer
        source: computed
        description: "floor(capacity_mbps * max_oversubscription_ratio) - committed_mbps; the downstream Mbps a new reservation or plan upgrade may still take on this sector, never below 0"
      - name: capacity_posture
        type: enum
        source: computed
        description: "Output of calculation sector_capacity_posture; gates new capacity holds, new subscriber creation and plan upgrades"
        constraints: "OPEN | WATCH | HOLD | FROZEN"
      - name: capacity_policy_note
        type: string
        source: system
        description: "Justification recorded by the most recent POST /sectors/{id}/capacity-policy call; null until first override"
        default: null

  - name: InterferenceCoordination
    parent: null
    common_fields: true
    fields:
      - name: requesting_sector_id
        type: string
        source: input
        description: "FK -> Sector.id; the sector asking to (re)tune"
      - name: neighbor_sector_id
        type: string
        source: input
        description: "FK -> Sector.id; the sector whose operator must consent"
        constraints: "must belong to a different Tower than requesting_sector_id"
      - name: proposed_channel_center_mhz
        type: number
        source: input
        description: "Centre frequency the requesting sector wants to move to, MHz"
      - name: proposed_channel_width_mhz
        type: number
        source: input
        description: "Channel width the requesting sector wants to occupy, MHz"
      - name: proposed_eirp_dbm
        type: number
        source: input
        description: "EIRP the requesting sector wants to radiate toward the neighbour, dBm"
      - name: guard_band_mhz
        type: number
        source: input
        description: "Guard band the two operators agree to keep between their occupied edges, MHz"
        constraints: "0.0 .. 20.0, 1 decimal place"
      - name: effective_from
        type: datetime
        source: input
        description: "Instant the coordinated parameters take effect once ACCEPTED"
      - name: round_number
        type: integer
        source: system
        description: "Negotiation round; starts at 1 and increments on every accepted revision"
        default: 1
      - name: status
        type: enum
        source: system
        description: "Negotiation state"
        default: REQUESTED
        constraints: "REQUESTED | REVISION_REQUESTED | ACCEPTED | REJECTED | WITHDRAWN"
      - name: decision_note
        type: string
        source: input
        description: "Free-text note attached by the most recent response; null before the first response"
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who recorded the most recent response; null before the first response"
        default: null
      - name: last_response_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent response; null before the first response"
        default: null

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: tier_code
        type: string
        source: input
        description: "Marketing tier code"
        constraints: "unique across all ServicePlan rows"
      - name: downstream_mbps
        type: integer
        source: input
        description: "Advertised downstream rate; also the bandwidth a subscriber or hold consumes on a sector"
        constraints: ">= 1"
      - name: upstream_mbps
        type: integer
        source: input
        description: "Advertised upstream rate"
        constraints: ">= 1"
      - name: monthly_price_cents
        type: integer
        source: input
        description: "Monthly recurring charge in cents; base for SLA credits"
        constraints: ">= 0"
      - name: soft_cap_gb
        type: number
        source: input
        description: "Monthly priority-data allowance in GB; exceeding it deprioritizes the subscriber"
        constraints: "> 0, 1 decimal place"
      - name: deprioritization_factor
        type: number
        source: input
        description: "Multiplier applied to downstream_mbps while usage_priority == DEPRIORITIZED"
        constraints: "0.05 .. 1.0, 2 decimal places"
      - name: sla_uptime_pct
        type: number
        source: input
        description: "Committed monthly uptime percentage used by the outage-credit calculation"
        constraints: "90.0 .. 100.0, 3 decimal places"
      - name: sla_credit_method
        type: enum
        source: input
        description: "Selects which variant of calculation outage_credit_amount applies to this plan's subscribers"
        constraints: "SLA_SHORTFALL | PER_INCIDENT"
      - name: equipment_policy
        type: enum
        source: input
        description: "Which acquisition modes a subscriber on this plan may choose"
        constraints: "RENTAL_ONLY | PURCHASE_ONLY | RENTAL_OR_PURCHASE"

  - name: ServiceabilityRequest
    parent: null
    common_fields: true
    fields:
      - name: candidate_tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the tower the premise is being qualified against"
      - name: requested_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; plan the prospect asked for; its downstream_mbps is the bandwidth qualified and held"
      - name: contact_name
        type: string
        source: input
        description: "Prospect name recorded on the qualification"
      - name: premise_latitude
        type: number
        source: input
        description: "Premise latitude in decimal degrees"
        constraints: "-90.0 .. 90.0, 4 decimal places"
      - name: premise_longitude
        type: number
        source: input
        description: "Premise longitude in decimal degrees"
        constraints: "-180.0 .. 180.0, 4 decimal places"
      - name: premise_ground_elevation_m
        type: number
        source: input
        description: "AMSL ground elevation at the premise, metres"
        constraints: "0.0 .. 4500.0, 1 decimal place"
      - name: roof_height_m
        type: number
        source: input
        description: "Height of the intended roof mounting point above premise ground, metres"
        constraints: "0.0 .. 20.0, 1 decimal place"
      - name: declared_tree_line_height_m
        type: number
        source: input
        description: "Height of the tallest obstruction above premise ground as read from the desktop LiDAR layer, metres"
        constraints: "0.0 .. 60.0, 1 decimal place"
      - name: obstruction_class
        type: enum
        source: input
        description: "Desktop obstruction classification of the path"
        constraints: "CLEAR | PARTIAL | BLOCKED"
      - name: path_distance_km
        type: number
        source: input
        description: "Great-circle distance from the tower to the premise, kilometres"
        constraints: "> 0.0, 1 decimal place"
      - name: intake_sequence
        type: integer
        source: system
        description: "Monotonically increasing intake counter (1, 2, 3, ...) assigned at creation across all ServiceabilityRequest rows; used as the final tie-break for deferred-request promotion so that no random identifier ever decides ordering"
      - name: qualified_sector_id
        type: string
        source: computed
        description: "FK -> Sector.id; sector chosen by calculation sector_selection; null unless status IN {QUALIFIED, CONSUMED}"
        default: null
      - name: desktop_los_margin_m
        type: number
        source: computed
        description: "Output of calculation los_qualification variant DESKTOP_LIDAR: tower antenna AMSL minus required antenna AMSL, 1 decimal place"
      - name: desktop_required_mast_height_m
        type: number
        source: computed
        description: "Output of calculation los_qualification variant DESKTOP_LIDAR: mast height above the roof mounting point, rounded up to the next 0.5 m"
      - name: desktop_mounting_type
        type: enum
        source: computed
        description: "Mounting band implied by desktop_required_mast_height_m; null when the request is DENIED for a reason evaluated before the mounting decision"
        default: null
        constraints: "WALL_BRACKET | NON_PEN_ROOF_TRIPOD | ROOF_MAST_GUYED | GROUND_POLE_MAST"
      - name: status
        type: enum
        source: system
        description: "Qualification state; EVALUATING exists only for the duration of the creating request, which always leaves the row in one of QUALIFIED, CAPACITY_DEFERRED or DENIED"
        default: EVALUATING
        constraints: "EVALUATING | QUALIFIED | CAPACITY_DEFERRED | DENIED | CONSUMED | EXPIRED"
      - name: denial_reason
        type: enum
        source: computed
        description: "Why the request was denied; null unless status == DENIED"
        default: null
        constraints: "LINK_DISTANCE_EXCEEDED | OBSTRUCTION_BLOCKED | NO_LINE_OF_SIGHT | MAST_LIMIT_EXCEEDED | NO_ACTIVE_SECTOR"
      - name: qualification_expires_at
        type: datetime
        source: computed
        description: "clock_now + QUALIFICATION_VALID_DAYS at the moment the request reaches QUALIFIED or CAPACITY_DEFERRED; null for DENIED requests"
        default: null

  - name: CapacityHold
    parent: Sector
    common_fields: true
    fields:
      - name: serviceability_request_id
        type: string
        source: input
        description: "FK -> ServiceabilityRequest.id; the qualification this hold reserves bandwidth for"
      - name: sector_id
        type: string
        source: computed
        description: "FK -> Sector.id; copied from ServiceabilityRequest.qualified_sector_id at creation and never changed"
      - name: held_mbps
        type: integer
        source: computed
        description: "Copied from the request's ServicePlan.downstream_mbps at creation; the caller cannot choose it"
      - name: hold_days
        type: integer
        source: input
        description: "Number of days the reservation lives"
        default: 14
        constraints: "1 .. 30"
      - name: expires_at
        type: datetime
        source: computed
        description: "clock_now + hold_days days, fixed at creation"
      - name: status
        type: enum
        source: system
        description: "Reservation state"
        default: HELD
        constraints: "HELD | CONSUMED | RELEASED | EXPIRED"
      - name: release_reason
        type: enum
        source: system
        description: "Why the hold left HELD without being consumed; null while HELD or once CONSUMED"
        default: null
        constraints: "MANUAL | BACKHAUL_DEGRADED | SECTOR_DISABLED | LAPSED"
      - name: origin
        type: enum
        source: system
        description: "DIRECT for holds created by POST /capacity-holds; AUTO_PROMOTION for holds minted by the deferred-request promotion cascade"
        default: DIRECT
        constraints: "DIRECT | AUTO_PROMOTION"

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - name: serviceability_request_id
        type: string
        source: input
        description: "FK -> ServiceabilityRequest.id; the qualification consumed to create this account"
      - name: service_plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; current plan, changed by POST /subscribers/{id}/plan-changes"
      - name: sector_id
        type: string
        source: computed
        description: "FK -> Sector.id; copied from the consumed request's qualified_sector_id and never changed afterwards"
      - name: account_number
        type: string
        source: system
        description: "Deterministic sequential account number of the form RB-000001, assigned in creation order"
      - name: billing_email
        type: string
        source: input
        description: "Billing contact address"
      - name: equipment_mode
        type: enum
        source: input
        description: "Whether the CPE is rented or purchased; must be permitted by the plan's equipment_policy"
        constraints: "RENTAL | PURCHASE"
      - name: service_status
        type: enum
        source: system
        description: "First state dimension: commercial lifecycle of the account"
        default: PENDING_INSTALL
        constraints: "PENDING_INSTALL | ACTIVE | SUSPENDED | CANCELLED"
      - name: usage_priority
        type: enum
        source: system
        description: "Second state dimension, independent of service_status: whether traffic is deprioritized under the data-usage policy"
        default: STANDARD
        constraints: "STANDARD | DEPRIORITIZED"
      - name: cycle_start_date
        type: string
        source: system
        description: "First day of the current usage cycle, YYYY-MM-DD; set to the install date at activation and advanced by CYCLE_DAYS on every cycle close"
        default: null
      - name: cycle_usage_gb
        type: number
        source: computed
        description: "Output of calculation usage_cycle_deprioritization: total GB inside the current cycle window, 1 decimal place"
      - name: effective_downstream_mbps
        type: number
        source: computed
        description: "Plan downstream_mbps while usage_priority == STANDARD, otherwise the deprioritized rate, 1 decimal place"
      - name: consecutive_breach_cycles
        type: integer
        source: system
        description: "Number of consecutive closed cycles in which cycle_usage_gb exceeded the plan soft cap; reset to 0 by a clean cycle"
        default: 0
      - name: sticky_deprioritization_active
        type: boolean
        source: system
        description: "True when the account entered the current cycle already deprioritized because consecutive_breach_cycles reached STICKY_BREACH_CYCLES at the last close"
        default: false
      - name: deprioritized_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the current DEPRIORITIZED state began; null while STANDARD"
        default: null
      - name: service_start_date
        type: datetime
        source: system
        description: "Logical-clock instant of the install completion that first activated the account; null while PENDING_INSTALL"
        default: null
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation; null unless service_status == CANCELLED"
        default: null
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Sum of credit_cents over this subscriber's OutageCredit rows with status == APPLIED"
      - name: settlement_balance_cents
        type: integer
        source: computed
        description: "Sum of settlement_cents over this subscriber's EquipmentAssignment rows; positive is owed by the subscriber, negative is owed to them"
      - name: equipment_monthly_charge_cents
        type: integer
        source: computed
        description: "monthly_rental_cents of this subscriber's EquipmentAssignment while its status == DEPLOYED, otherwise 0"

  - name: InstallWorkOrder
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; account being installed"
      - name: scheduled_at
        type: datetime
        source: input
        description: "Appointment instant for the survey/install truck roll"
      - name: status
        type: enum
        source: system
        description: "Work-order state; the survey transition fans out into four different target states"
        default: SCHEDULED
        constraints: "SCHEDULED | EXCEPTION_PENDING | MOUNT_APPROVED | RESURVEY_REQUIRED | INSTALLED | SURVEY_FAILED | CANCELLED"
      - name: measured_tree_line_height_m
        type: number
        source: input
        description: "Obstruction height above premise ground measured on site with an inclinometer, metres"
        default: null
        constraints: "0.0 .. 60.0, 1 decimal place"
      - name: measured_roof_height_m
        type: number
        source: input
        description: "Roof mounting point height measured on site, metres"
        default: null
        constraints: "0.0 .. 20.0, 1 decimal place"
      - name: structure_penetration_allowed
        type: boolean
        source: input
        description: "Whether the property owner permits a penetrating (lag-bolted) roof mount"
        default: null
      - name: field_los_margin_m
        type: number
        source: computed
        description: "Output of calculation los_qualification variant FIELD_SURVEY, 1 decimal place; null before the survey"
        default: null
      - name: recommended_mast_height_m
        type: number
        source: computed
        description: "Output of calculation los_qualification variant FIELD_SURVEY, rounded up to the next 0.5 m; null before the survey"
        default: null
      - name: recommended_mounting_type
        type: enum
        source: computed
        description: "Mounting band implied by recommended_mast_height_m; null before the survey"
        default: null
        constraints: "WALL_BRACKET | NON_PEN_ROOF_TRIPOD | ROOF_MAST_GUYED | GROUND_POLE_MAST"
      - name: approved_mounting_type
        type: enum
        source: system
        description: "Mounting actually authorised: equals recommended_mounting_type when no exception was needed, otherwise the type recorded on the exception decision"
        default: null
        constraints: "WALL_BRACKET | NON_PEN_ROOF_TRIPOD | ROOF_MAST_GUYED | GROUND_POLE_MAST"
      - name: surveyed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FieldTech who recorded the most recent survey; null before the first survey"
        default: null
      - name: exception_approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the NetworkEngineer who approved the mounting exception; must differ from surveyed_by_user_id"
        default: null
      - name: resurvey_count
        type: integer
        source: system
        description: "Number of times this work order has been sent back for resurvey"
        default: 0
      - name: installed_mast_height_m
        type: number
        source: input
        description: "Mast height actually erected, metres; recorded at completion"
        default: null
        constraints: "0.0 .. 12.0, 1 decimal place"
      - name: radio_serial
        type: string
        source: input
        description: "Serial number of the CPE radio left on site; stamped onto the EquipmentAssignment at completion"
        default: null
      - name: install_invoice_total_cents
        type: integer
        source: computed
        description: "Output of calculation install_invoice_total; null before completion"
        default: null
      - name: installed_at
        type: datetime
        source: system
        description: "Logical-clock instant of completion; null unless status == INSTALLED"
        default: null

  - name: EquipmentAssignment
    parent: Subscriber
    common_fields: true
    fields:
      - name: subscriber_id
        type: string
        source: computed
        description: "FK -> Subscriber.id; owner of the CPE. The row itself is minted as a side effect of POST /subscribers, so it never appears in a creation response"
      - name: acquisition_mode
        type: enum
        source: computed
        description: "Copied from Subscriber.equipment_mode at creation"
        constraints: "RENTAL | PURCHASE"
      - name: radio_serial
        type: string
        source: system
        description: "Serial recorded at install completion; null before deployment"
        default: null
      - name: status
        type: enum
        source: system
        description: "Custody state of the CPE"
        default: ASSIGNED
        constraints: "ASSIGNED | DEPLOYED | RETURN_PENDING | RETURNED | UNRETURNED_BILLED | VOIDED"
      - name: monthly_rental_cents
        type: integer
        source: system
        description: "RENTAL_MONTHLY_CENTS for acquisition_mode == RENTAL, 0 for PURCHASE"
        default: 1000
      - name: purchase_price_cents
        type: integer
        source: system
        description: "PURCHASE_PRICE_CENTS for acquisition_mode == PURCHASE, 0 for RENTAL"
        default: 0
      - name: replacement_cost_cents
        type: integer
        source: system
        description: "REPLACEMENT_COST_CENTS, the unreturned-equipment liability"
        default: 34900
      - name: deployed_at
        type: datetime
        source: system
        description: "Logical-clock instant the CPE was left on site; null before deployment"
        default: null
      - name: return_due_at
        type: datetime
        source: system
        description: "deployed_at-independent deadline set to clock_now + RETURN_WINDOW_DAYS when the assignment enters RETURN_PENDING; null otherwise"
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant the CPE came back; null unless status == RETURNED"
        default: null
      - name: return_condition
        type: enum
        source: input
        description: "Condition recorded at return; null unless status == RETURNED"
        default: null
        constraints: "GOOD | DAMAGED"
      - name: months_in_service
        type: integer
        source: computed
        description: "Whole months from deployed_at to the settlement instant, truncated toward zero; 0 when never deployed"
      - name: settlement_cents
        type: integer
        source: computed
        description: "Output of calculation equipment_settlement; positive is a charge to the subscriber, negative is a refund owed to them, 0 before any settlement"
        default: 0
      - name: settlement_basis
        type: enum
        source: computed
        description: "Which variant of equipment_settlement produced settlement_cents; null before any settlement"
        default: null
        constraints: "RENTAL_CREDIT_OFFSET | RENTAL_DAMAGE | DEPRECIATED_REFUND | NONE"

  - name: UsageRecord
    parent: Subscriber
    common_fields: false
    fields:
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; account the traffic belongs to"
      - name: usage_date
        type: string
        source: input
        description: "Calendar day the traffic was metered, YYYY-MM-DD"
      - name: downstream_gb
        type: number
        source: input
        description: "Downstream volume for the day in GB"
        constraints: ">= 0.0, 1 decimal place"
      - name: upstream_gb
        type: number
        source: input
        description: "Upstream volume for the day in GB"
        constraints: ">= 0.0, 1 decimal place"
      - name: total_gb
        type: number
        source: computed
        description: "downstream_gb + upstream_gb, 1 decimal place"
      - name: ingest_sequence
        type: integer
        source: system
        description: "Monotonically increasing ingest counter (1, 2, 3, ...) across all UsageRecord rows; final tie-break for the chronological usage replay so that no random identifier decides ordering"
      - name: in_current_cycle
        type: boolean
        source: computed
        description: "True when usage_date falls inside [Subscriber.cycle_start_date, cycle_start_date + CYCLE_DAYS)"

  - name: OutageEvent
    parent: Tower
    common_fields: true
    fields:
      - name: tower_id
        type: string
        source: input
        description: "FK -> Tower.id; the site that went down"
      - name: cause
        type: enum
        source: input
        description: "Root cause class, which decides SLA excludability together with peak_wind_mph and planned_notice_days"
        constraints: "WEATHER_WIND | WEATHER_ICE | WEATHER_FLOOD | POWER | BACKHAUL | EQUIPMENT | PLANNED_MAINTENANCE"
      - name: started_at
        type: datetime
        source: input
        description: "Inclusive start of the outage window"
      - name: ended_at
        type: datetime
        source: input
        description: "Exclusive end of the outage window; null while status == OPEN"
        default: null
      - name: peak_wind_mph
        type: number
        source: input
        description: "Peak sustained wind recorded at the site; null when not measured, and treated as 0.0 by the exclusion rule"
        default: null
      - name: planned_notice_days
        type: integer
        source: input
        description: "Days of advance notice given to subscribers for PLANNED_MAINTENANCE; null for unplanned causes"
        default: null
      - name: status
        type: enum
        source: system
        description: "Outage lifecycle"
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Whole minutes from started_at to ended_at, truncated toward zero; null while OPEN"
        default: null
      - name: sla_excluded
        type: boolean
        source: computed
        description: "True when the outage is a force-majeure or noticed-maintenance exception and therefore contributes zero minutes to any SLA credit"
        default: false
      - name: total_credited_cents
        type: integer
        source: computed
        description: "Sum of credit_cents over this event's OutageCredit rows with status == APPLIED"
        default: 0

  - name: OutageCredit
    parent: null
    common_fields: true
    fields:
      - name: outage_event_id
        type: string
        source: input
        description: "FK -> OutageEvent.id; the incident being credited"
      - name: subscriber_id
        type: string
        source: input
        description: "FK -> Subscriber.id; account receiving the credit"
      - name: method
        type: enum
        source: computed
        description: "Copied from the subscriber's ServicePlan.sla_credit_method at creation; selects the calculation variant"
        constraints: "SLA_SHORTFALL | PER_INCIDENT"
      - name: cycle_outage_minutes
        type: integer
        source: computed
        description: "For SLA_SHORTFALL, creditable minutes summed across the cycle; for PER_INCIDENT, the clipped minutes of this event only"
      - name: measured_uptime_pct
        type: number
        source: computed
        description: "SLA_SHORTFALL only: 100 * (SLA_MONTHLY_MINUTES - cycle_outage_minutes) / SLA_MONTHLY_MINUTES, round_half_up to 3 decimal places; 0.0 for PER_INCIDENT"
      - name: shortfall_pct
        type: number
        source: computed
        description: "SLA_SHORTFALL only: max(0, plan.sla_uptime_pct - measured_uptime_pct), 3 decimal places; 0.0 for PER_INCIDENT"
      - name: prior_cycle_credited_cents
        type: integer
        source: computed
        description: "SLA_SHORTFALL only: sum of credit_cents already issued to this subscriber for the same cycle in status IN {PENDING, APPLIED}; 0 for PER_INCIDENT"
      - name: credit_cents
        type: integer
        source: computed
        description: "Output of calculation outage_credit_amount; 0 when denied"
      - name: status
        type: enum
        source: system
        description: "Credit lifecycle"
        default: PENDING
        constraints: "PENDING | APPLIED | DENIED | REVERSED"
      - name: denial_reason
        type: enum
        source: computed
        description: "Why the credit was created already DENIED; null otherwise"
        default: null
        constraints: "SLA_EXCLUDED | BELOW_MINIMUM_DURATION | NO_SHORTFALL"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BillingAdmin who created the credit"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FinanceApprover who applied the credit; must differ from prepared_by_user_id"
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: "Free-text reason recorded when an APPLIED credit is reversed; null otherwise"
        default: null

state_machines:
  - entity: Tower
    initial_state: PLANNED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /towers/{id}/status-changes with to_status=ACTIVE"
        actor: NetworkEngineer
        preconditions:
          - "Tower.status == PLANNED"
          - "at least one BackhaulCircuit with tower_id == Tower.id has state == ACCEPTED, else ERR_BACKHAUL_NOT_ACCEPTED"
        side_effects:
          - "recompute Tower.backhaul_accepted_mbps"
          - "recompute capacity_posture on every Sector with tower_id == Tower.id (calculation sector_capacity_posture)"
          - "increments Tower.version by 1"
      - from: ACTIVE
        to: MAINTENANCE
        trigger: "POST /towers/{id}/status-changes with to_status=MAINTENANCE"
        actor: NetworkEngineer
        preconditions:
          - "Tower.status == ACTIVE"
        side_effects:
          - "increments Tower.version by 1"
        note: "MAINTENANCE does not freeze sectors; it is an operational marker used by outage reporting."
      - from: MAINTENANCE
        to: ACTIVE
        trigger: "POST /towers/{id}/status-changes with to_status=ACTIVE"
        actor: NetworkEngineer
        preconditions:
          - "Tower.status == MAINTENANCE"
          - "at least one BackhaulCircuit with tower_id == Tower.id has state == ACCEPTED, else ERR_BACKHAUL_NOT_ACCEPTED"
        side_effects:
          - "recompute capacity_posture on every Sector with tower_id == Tower.id"
          - "increments Tower.version by 1"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /towers/{id}/status-changes with to_status=DECOMMISSIONED"
        actor: NetworkEngineer
        preconditions:
          - "Tower.status IN {ACTIVE, MAINTENANCE}"
          - "no Subscriber whose sector_id belongs to a Sector with tower_id == Tower.id has service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED}, else ERR_TOWER_HAS_ACTIVE_SUBSCRIBERS"
        side_effects:
          - "every Sector with tower_id == Tower.id and status IN {PLANNED, ACTIVE} transitions to DISABLED"
          - "because each of those Sectors left status ACTIVE, every CapacityHold with sector_id in that set and status == HELD transitions to RELEASED with release_reason = SECTOR_DISABLED"
          - "because each of those holds left HELD, every ServiceabilityRequest referenced by them with status IN {QUALIFIED, CAPACITY_DEFERRED} transitions to EXPIRED"
          - "increments Tower.version by 1"
      - from: MAINTENANCE
        to: DECOMMISSIONED
        trigger: "POST /towers/{id}/status-changes with to_status=DECOMMISSIONED"
        actor: NetworkEngineer
        preconditions:
          - "Tower.status IN {ACTIVE, MAINTENANCE}"
          - "no Subscriber whose sector_id belongs to a Sector with tower_id == Tower.id has service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED}, else ERR_TOWER_HAS_ACTIVE_SUBSCRIBERS"
        side_effects:
          - "same cascade as the ACTIVE -> DECOMMISSIONED transition"
          - "increments Tower.version by 1"

  - entity: BackhaulCircuit
    initial_state: ORDERED
    terminal_states: [CANCELLED]
    transitions:
      - from: ORDERED
        to: INSTALLED
        trigger: "POST /backhaul-circuits/{id}/state-changes with to_state=INSTALLED"
        actor: NetworkEngineer
        preconditions:
          - "BackhaulCircuit.state == ORDERED"
        side_effects:
          - "increments BackhaulCircuit.version by 1"
      - from: INSTALLED
        to: ACCEPTED
        trigger: "POST /backhaul-circuits/{id}/state-changes with to_state=ACCEPTED and measured_mbps supplied"
        actor: NetworkEngineer
        preconditions:
          - "BackhaulCircuit.state == INSTALLED"
          - "measured_mbps is present in the request body, else ERR_VALIDATION"
        side_effects:
          - "set BackhaulCircuit.measured_mbps from the request and BackhaulCircuit.accepted_at = clock_now"
          - "clear BackhaulCircuit.degraded_since"
          - "recompute Tower.backhaul_accepted_mbps for the parent Tower"
          - "recompute capacity_posture on every Sector with tower_id == BackhaulCircuit.tower_id"
          - "increments BackhaulCircuit.version by 1"
      - from: ACCEPTED
        to: DEGRADED
        trigger: "POST /backhaul-circuits/{id}/state-changes with to_state=DEGRADED"
        actor: NetworkEngineer
        preconditions:
          - "BackhaulCircuit.state == ACCEPTED"
        side_effects:
          - "set BackhaulCircuit.degraded_since = clock_now and BackhaulCircuit.measured_mbps from the request when supplied"
          - "recompute Tower.backhaul_accepted_mbps, which becomes 0 because no circuit on the tower is in state ACCEPTED"
          - "because the tower now has no ACCEPTED circuit, every Sector with tower_id == BackhaulCircuit.tower_id recomputes capacity_posture and lands on FROZEN"
          - "because those Sectors are FROZEN, every CapacityHold with sector_id in that set and status == HELD transitions to RELEASED with release_reason = BACKHAUL_DEGRADED and the sectors' held_mbps drop accordingly"
          - "because each of those holds left HELD, every ServiceabilityRequest referenced by them with status IN {QUALIFIED, CAPACITY_DEFERRED} transitions to EXPIRED"
          - "increments BackhaulCircuit.version by 1"
        note: "Cascade chain X, depth 4: circuit -> sector posture -> capacity hold -> serviceability request. Each hop is caused by the preceding hop, not by the original request."
      - from: DEGRADED
        to: ACCEPTED
        trigger: "POST /backhaul-circuits/{id}/state-changes with to_state=ACCEPTED and measured_mbps supplied"
        actor: NetworkEngineer
        preconditions:
          - "BackhaulCircuit.state == DEGRADED"
          - "measured_mbps is present in the request body, else ERR_VALIDATION"
        side_effects:
          - "set BackhaulCircuit.measured_mbps from the request, clear degraded_since, leave accepted_at at its original value"
          - "recompute Tower.backhaul_accepted_mbps"
          - "recompute capacity_posture on every Sector with tower_id == BackhaulCircuit.tower_id; already-RELEASED CapacityHolds are NOT restored"
          - "increments BackhaulCircuit.version by 1"
        note: "The ACCEPTED -> DEGRADED -> ACCEPTED loop makes this machine cyclic."
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /backhaul-circuits/{id}/state-changes with to_state=CANCELLED"
        actor: NetworkEngineer
        preconditions:
          - "BackhaulCircuit.state IN {ORDERED, INSTALLED}"
        side_effects:
          - "increments BackhaulCircuit.version by 1"
      - from: INSTALLED
        to: CANCELLED
        trigger: "POST /backhaul-circuits/{id}/state-changes with to_state=CANCELLED"
        actor: NetworkEngineer
        preconditions:
          - "BackhaulCircuit.state IN {ORDERED, INSTALLED}"
        side_effects:
          - "increments BackhaulCircuit.version by 1"

  - entity: Sector
    initial_state: PLANNED
    terminal_states: [DISABLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /sectors/{id}/activation"
        actor: NetworkEngineer
        preconditions:
          - "Sector.status == PLANNED"
          - "the parent Tower.status == ACTIVE, else ERR_INVALID_TOWER_STATE"
          - "the linked SpectrumLicense.status == ACTIVE at clock_now, else ERR_LICENSE_NOT_EFFECTIVE"
        side_effects:
          - "recompute Tower.active_sector_count"
          - "recompute Sector.capacity_posture (calculation sector_capacity_posture)"
          - "increments Sector.version by 1"
        note: "Cross-entity state dependency: Sector activation is gated on Tower.status, a different entity pair from InstallWorkOrder completion being gated on Subscriber.service_status."
      - from: ACTIVE
        to: DISABLED
        trigger: "system event: the parent Tower transitions to DECOMMISSIONED"
        actor: system
        preconditions:
          - "Sector.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "recompute Tower.active_sector_count"
          - "set Sector.capacity_posture = FROZEN and Sector.capacity_policy_note = 'sector disabled with the tower'"
          - "release every HELD CapacityHold on this Sector with release_reason = SECTOR_DISABLED (see the Tower cascade)"
          - "increments Sector.version by 1"
      - from: PLANNED
        to: DISABLED
        trigger: "system event: the parent Tower transitions to DECOMMISSIONED"
        actor: system
        preconditions:
          - "Sector.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "set Sector.capacity_posture = FROZEN"
          - "increments Sector.version by 1"

  - entity: InterferenceCoordination
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /interference-coordinations/{id}/responses with decision=ACCEPT"
        actor: NetworkEngineer
        preconditions:
          - "InterferenceCoordination.status IN {REQUESTED}, else ERR_COORDINATION_NOT_OPEN"
          - "the responding X-User-ID differs from InterferenceCoordination.created_by is NOT required; coordination has no segregation-of-duties gate"
        side_effects:
          - "set InterferenceCoordination.last_response_at = clock_now and decided_by_user_id = X-User-ID"
          - "apply the negotiated plan to the requesting Sector: channel_center_mhz = proposed_channel_center_mhz, channel_width_mhz = proposed_channel_width_mhz, tx_power_dbm = proposed_eirp_dbm - antenna_gain_dbi"
          - "recompute the requesting Sector's lower_edge_mhz, upper_edge_mhz and eirp_dbm"
          - "increments InterferenceCoordination.version by 1 and Sector.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /interference-coordinations/{id}/responses with decision=REJECT"
        actor: NetworkEngineer
        preconditions:
          - "InterferenceCoordination.status IN {REQUESTED}, else ERR_COORDINATION_NOT_OPEN"
        side_effects:
          - "set last_response_at = clock_now, decided_by_user_id = X-User-ID, decision_note from the request"
          - "the requesting Sector is left untouched"
          - "increments InterferenceCoordination.version by 1"
      - from: REQUESTED
        to: REVISION_REQUESTED
        trigger: "POST /interference-coordinations/{id}/responses with decision=REQUEST_REVISION"
        actor: NetworkEngineer
        preconditions:
          - "InterferenceCoordination.status IN {REQUESTED}, else ERR_COORDINATION_NOT_OPEN"
          - "InterferenceCoordination.round_number < MAX_COORDINATION_ROUNDS (3), else ERR_COORDINATION_ROUND_LIMIT"
        side_effects:
          - "set last_response_at = clock_now, decided_by_user_id = X-User-ID"
          - "when revised_channel_center_mhz or revised_eirp_dbm are supplied, record them as the neighbour's counter-proposal in decision_note"
          - "increments InterferenceCoordination.version by 1"
      - from: REVISION_REQUESTED
        to: REQUESTED
        trigger: "POST /interference-coordinations/{id}/revisions"
        actor: NetworkEngineer
        preconditions:
          - "InterferenceCoordination.status == REVISION_REQUESTED, else ERR_COORDINATION_NOT_OPEN"
          - "InterferenceCoordination.round_number < MAX_COORDINATION_ROUNDS (3), else ERR_COORDINATION_ROUND_LIMIT"
          - "the revised proposal passes the same spectrum checks as creation (ERR_CHANNEL_OUTSIDE_LICENSE, ERR_EIRP_EXCEEDS_LICENSE, ERR_CHANNEL_OVERLAP_GUARD_BAND)"
        side_effects:
          - "overwrite proposed_channel_center_mhz, proposed_channel_width_mhz, proposed_eirp_dbm and guard_band_mhz from the request"
          - "round_number += 1"
          - "increments InterferenceCoordination.version by 1"
        note: "REQUESTED -> REVISION_REQUESTED -> REQUESTED makes this machine cyclic; the loop terminates at MAX_COORDINATION_ROUNDS."
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /interference-coordinations/{id}/responses with decision=WITHDRAW"
        actor: NetworkEngineer
        preconditions:
          - "InterferenceCoordination.status IN {REQUESTED, REVISION_REQUESTED}, else ERR_COORDINATION_NOT_OPEN"
        side_effects:
          - "set last_response_at = clock_now"
          - "increments InterferenceCoordination.version by 1"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /interference-coordinations/{id}/responses with decision=WITHDRAW"
        actor: NetworkEngineer
        preconditions:
          - "InterferenceCoordination.status IN {REQUESTED, REVISION_REQUESTED}, else ERR_COORDINATION_NOT_OPEN"
        side_effects:
          - "set last_response_at = clock_now"
          - "increments InterferenceCoordination.version by 1"

  - entity: ServiceabilityRequest
    initial_state: EVALUATING
    terminal_states: [DENIED, CONSUMED, EXPIRED]
    transitions:
      - from: EVALUATING
        to: QUALIFIED
        trigger: "POST /serviceability-requests (system, inside the creating request)"
        actor: system
        preconditions:
          - "calculation los_qualification_mast_height variant DESKTOP_LIDAR yields desktop_los_margin_m >= 0 and desktop_required_mast_height_m <= MAX_MAST_HEIGHT_M"
          - "path_distance_km <= MAX_LINK_DISTANCE_KM and obstruction_class != BLOCKED"
          - "calculation sector_selection returns a non-empty eligible pool"
        side_effects:
          - "set qualified_sector_id from calculation sector_selection"
          - "set desktop_los_margin_m, desktop_required_mast_height_m, desktop_mounting_type"
          - "set qualification_expires_at = clock_now + QUALIFICATION_VALID_DAYS (30) days"
      - from: EVALUATING
        to: CAPACITY_DEFERRED
        trigger: "POST /serviceability-requests (system, inside the creating request)"
        actor: system
        preconditions:
          - "the line-of-sight checks all pass"
          - "calculation sector_selection finds at least one Sector on the candidate Tower with status == ACTIVE but every such Sector is excluded solely by capacity (capacity_posture IN {HOLD, FROZEN} or remaining allowance < plan downstream_mbps)"
        side_effects:
          - "leave qualified_sector_id null"
          - "set desktop_los_margin_m, desktop_required_mast_height_m, desktop_mounting_type"
          - "set qualification_expires_at = clock_now + QUALIFICATION_VALID_DAYS (30) days"
      - from: EVALUATING
        to: DENIED
        trigger: "POST /serviceability-requests (system, inside the creating request)"
        actor: system
        preconditions:
          - "at least one denial condition holds, evaluated in the pinned order of calculation los_qualification_mast_height"
        side_effects:
          - "set denial_reason to the first failing condition (LINK_DISTANCE_EXCEEDED, OBSTRUCTION_BLOCKED, NO_LINE_OF_SIGHT, MAST_LIMIT_EXCEEDED, NO_ACTIVE_SECTOR)"
          - "leave qualified_sector_id and qualification_expires_at null"
      - from: CAPACITY_DEFERRED
        to: QUALIFIED
        trigger: "system event: a Sector on the candidate Tower recomputes capacity_posture and leaves {HOLD, FROZEN}"
        actor: system
        preconditions:
          - "ServiceabilityRequest.status == CAPACITY_DEFERRED and clock_now < qualification_expires_at"
          - "the recomputed Sector satisfies calculation sector_selection's eligibility filter for this request's plan"
          - "this request is the first row when all CAPACITY_DEFERRED requests for that Tower are ordered by created_at ASC, intake_sequence ASC"
        side_effects:
          - "set qualified_sector_id to the recomputed Sector"
          - "create a CapacityHold with origin = AUTO_PROMOTION, hold_days = 14, held_mbps = plan downstream_mbps"
          - "because that hold now exists, the Sector's held_mbps rises and capacity_posture is recomputed again"
        note: "Cascade chain Y hop 3-4. Exactly one request is promoted per posture recompute; ordering never consults id."
      - from: QUALIFIED
        to: CONSUMED
        trigger: "POST /subscribers"
        actor: SalesAgent
        preconditions:
          - "ServiceabilityRequest.status == QUALIFIED, else ERR_REQUEST_NOT_QUALIFIED"
          - "clock_now < ServiceabilityRequest.qualification_expires_at, else ERR_QUALIFICATION_EXPIRED"
          - "a CapacityHold with serviceability_request_id == this request and status == HELD exists, else ERR_HOLD_NOT_HELD"
        side_effects:
          - "the linked CapacityHold transitions HELD -> CONSUMED"
          - "the Sector's held_mbps decreases by the hold's held_mbps and sold_mbps increases by the same amount, leaving sold_mbps + held_mbps unchanged"
          - "recompute Sector.capacity_posture"
      - from: QUALIFIED
        to: EXPIRED
        trigger: "system event: the linked CapacityHold leaves status HELD without being consumed (manual release, backhaul degradation, sector disable, or lapse)"
        actor: system
        preconditions:
          - "ServiceabilityRequest.status == QUALIFIED"
        side_effects:
          - "clear qualified_sector_id"
        note: "Cascade chain X hop 4. There is NO clock-driven transition out of QUALIFIED: a request whose qualification_expires_at has passed keeps status QUALIFIED and is refused at the point of use by ERR_QUALIFICATION_EXPIRED (priority 8). Likewise a CAPACITY_DEFERRED request whose qualification_expires_at has passed keeps status CAPACITY_DEFERRED but is filtered out of the sector_selection promotion candidate set, so it can never be promoted."

  - entity: CapacityHold
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, EXPIRED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /subscribers"
        actor: SalesAgent
        preconditions:
          - "CapacityHold.status == HELD, else ERR_HOLD_NOT_HELD"
        side_effects:
          - "Sector.held_mbps -= CapacityHold.held_mbps and Sector.sold_mbps += CapacityHold.held_mbps"
          - "recompute Sector.committed_mbps, oversubscription_ratio and capacity_posture"
          - "increments Sector.version by 1 and CapacityHold.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "POST /capacity-holds/{id}/release"
        actor: CapacityPlanner
        preconditions:
          - "CapacityHold.status == HELD, else ERR_HOLD_NOT_HELD"
        side_effects:
          - "set release_reason = MANUAL"
          - "Sector.held_mbps -= CapacityHold.held_mbps, then recompute Sector.committed_mbps, oversubscription_ratio and capacity_posture"
          - "the linked ServiceabilityRequest transitions QUALIFIED -> EXPIRED"
          - "increments Sector.version by 1 and CapacityHold.version by 1"
      - from: HELD
        to: RELEASED
        trigger: "system event: the hold's Sector recomputes capacity_posture to FROZEN because its Tower has no BackhaulCircuit in state ACCEPTED"
        actor: system
        preconditions:
          - "CapacityHold.status == HELD"
        side_effects:
          - "set release_reason = BACKHAUL_DEGRADED"
          - "Sector.held_mbps -= CapacityHold.held_mbps"
          - "the linked ServiceabilityRequest transitions QUALIFIED -> EXPIRED"
        note: "Cascade chain X hop 3."
      - from: HELD
        to: RELEASED
        trigger: "system event: the hold's Sector transitions to status DISABLED"
        actor: system
        preconditions:
          - "CapacityHold.status == HELD"
        side_effects:
          - "set release_reason = SECTOR_DISABLED"
          - "Sector.held_mbps -= CapacityHold.held_mbps"
          - "the linked ServiceabilityRequest transitions QUALIFIED -> EXPIRED"
      - from: HELD
        to: EXPIRED
        trigger: "system event: clock_now >= CapacityHold.expires_at"
        actor: system
        preconditions:
          - "CapacityHold.status == HELD"
        side_effects:
          - "set release_reason = LAPSED"
          - "Sector.held_mbps -= CapacityHold.held_mbps, then recompute committed_mbps, oversubscription_ratio and capacity_posture"
          - "the linked ServiceabilityRequest transitions QUALIFIED -> EXPIRED"
        note: "Evaluated lazily at the start of any request that reads or writes this CapacityHold, its Sector, or its ServiceabilityRequest, so the outcome depends only on the logical clock."

  - entity: Subscriber
    initial_state: PENDING_INSTALL
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_INSTALL
        to: ACTIVE
        trigger: "POST /install-work-orders/{id}/completion"
        actor: FieldTech
        preconditions:
          - "Subscriber.service_status == PENDING_INSTALL, else ERR_SUBSCRIBER_NOT_ACTIVE"
        side_effects:
          - "set service_start_date = clock_now and cycle_start_date = the calendar date of clock_now"
          - "because the account went ACTIVE, its EquipmentAssignment transitions ASSIGNED -> DEPLOYED"
          - "because the assignment is DEPLOYED, Subscriber.equipment_monthly_charge_cents is recomputed from EquipmentAssignment.monthly_rental_cents"
          - "increments Subscriber.version by 1"
        note: "Cascade chain Z hops 2-4: work order -> subscriber -> equipment assignment -> derived monthly charge."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /subscribers/{id}/status-changes with to_status=SUSPENDED"
        actor: BillingAdmin
        preconditions:
          - "Subscriber.service_status == ACTIVE, else ERR_SUBSCRIBER_NOT_ACTIVE"
        side_effects:
          - "Sector.sold_mbps is NOT released: a suspended account still occupies its sector allowance"
          - "increments Subscriber.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /subscribers/{id}/status-changes with to_status=ACTIVE"
        actor: BillingAdmin
        preconditions:
          - "Subscriber.service_status == SUSPENDED, else ERR_SUBSCRIBER_NOT_ACTIVE"
        side_effects:
          - "increments Subscriber.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscribers/{id}/status-changes with to_status=CANCELLED"
        actor: BillingAdmin
        preconditions:
          - "Subscriber.service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED}"
        side_effects:
          - "set cancelled_at = clock_now"
          - "the Sector's sold_mbps decreases by the plan's downstream_mbps, then committed_mbps, oversubscription_ratio and capacity_posture are recomputed"
          - "because the recomputed posture left {HOLD, FROZEN}, the first CAPACITY_DEFERRED ServiceabilityRequest on that Tower ordered by created_at ASC, intake_sequence ASC transitions to QUALIFIED and a CapacityHold with origin = AUTO_PROMOTION is created"
          - "because that hold now exists, the Sector's held_mbps rises and capacity_posture is recomputed again"
          - "the EquipmentAssignment transitions DEPLOYED -> RETURN_PENDING with return_due_at = clock_now + RETURN_WINDOW_DAYS (21) days"
          - "increments Subscriber.version by 1"
        note: "Cascade chain Y, depth 4: subscriber -> sector posture -> deferred request promotion + hold -> sector posture again."
      - from: PENDING_INSTALL
        to: CANCELLED
        trigger: "POST /subscribers/{id}/status-changes with to_status=CANCELLED"
        actor: BillingAdmin
        preconditions:
          - "Subscriber.service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED}"
        side_effects:
          - "set cancelled_at = clock_now"
          - "the Sector's sold_mbps decreases by the plan's downstream_mbps and posture is recomputed, with the same promotion cascade as the ACTIVE -> CANCELLED transition"
          - "the EquipmentAssignment transitions ASSIGNED -> VOIDED because the CPE was never deployed"
          - "every InstallWorkOrder for this Subscriber with status IN {SCHEDULED, EXCEPTION_PENDING, RESURVEY_REQUIRED} transitions to CANCELLED"
          - "increments Subscriber.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscribers/{id}/status-changes with to_status=CANCELLED"
        actor: BillingAdmin
        preconditions:
          - "Subscriber.service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED}"
        side_effects:
          - "same cascade as the ACTIVE -> CANCELLED transition"
          - "increments Subscriber.version by 1"

  - entity: Subscriber
    initial_state: STANDARD
    terminal_states: []
    transitions:
      - from: STANDARD
        to: DEPRIORITIZED
        trigger: "POST /subscribers/{id}/usage-records whose ingestion pushes cycle_usage_gb strictly above the plan soft_cap_gb"
        actor: system
        preconditions:
          - "Subscriber.service_status IN {ACTIVE, SUSPENDED}"
          - "calculation usage_cycle_deprioritization yields cycle_usage_gb > ServicePlan.soft_cap_gb (strictly greater)"
        side_effects:
          - "set deprioritized_at = clock_now"
          - "recompute effective_downstream_mbps = round_half_up(ServicePlan.downstream_mbps * ServicePlan.deprioritization_factor, 1)"
        note: "This dimension is independent of service_status: a SUSPENDED account can still flip STANDARD <-> DEPRIORITIZED, and an ACTIVE account can sit in either priority. Parallel state dimensions on one entity."
      - from: DEPRIORITIZED
        to: STANDARD
        trigger: "POST /subscribers/{id}/cycle-close"
        actor: BillingAdmin
        preconditions:
          - "the closing cycle's cycle_usage_gb <= ServicePlan.soft_cap_gb"
          - "consecutive_breach_cycles after the close is < STICKY_BREACH_CYCLES (2)"
        side_effects:
          - "set consecutive_breach_cycles = 0, sticky_deprioritization_active = false, deprioritized_at = null"
          - "advance cycle_start_date by CYCLE_DAYS (30) days"
          - "recompute cycle_usage_gb over the new window and effective_downstream_mbps = ServicePlan.downstream_mbps"
      - from: DEPRIORITIZED
        to: DEPRIORITIZED
        trigger: "POST /subscribers/{id}/cycle-close where the closing cycle also breached the soft cap"
        actor: BillingAdmin
        preconditions:
          - "the closing cycle's cycle_usage_gb > ServicePlan.soft_cap_gb"
        side_effects:
          - "consecutive_breach_cycles += 1"
          - "when consecutive_breach_cycles >= STICKY_BREACH_CYCLES (2), set sticky_deprioritization_active = true so the account opens the next cycle already DEPRIORITIZED even at zero usage"
          - "advance cycle_start_date by CYCLE_DAYS (30) days and recompute cycle_usage_gb and effective_downstream_mbps"
      - from: STANDARD
        to: STANDARD
        trigger: "POST /subscribers/{id}/cycle-close on a clean cycle"
        actor: BillingAdmin
        preconditions:
          - "the closing cycle's cycle_usage_gb <= ServicePlan.soft_cap_gb"
        side_effects:
          - "set consecutive_breach_cycles = 0 and advance cycle_start_date by CYCLE_DAYS (30) days"

  - entity: InstallWorkOrder
    initial_state: SCHEDULED
    terminal_states: [INSTALLED, SURVEY_FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: MOUNT_APPROVED
        trigger: "POST /install-work-orders/{id}/survey"
        actor: FieldTech
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED}, else ERR_WORK_ORDER_STATE_INVALID"
          - "calculation los_qualification_mast_height variant FIELD_SURVEY yields field_los_margin_m >= 0"
          - "recommended_mast_height_m <= MAX_MAST_HEIGHT_M (12.0)"
          - "recommended_mounting_type IN {WALL_BRACKET, NON_PEN_ROOF_TRIPOD}"
        side_effects:
          - "set field_los_margin_m, recommended_mast_height_m, recommended_mounting_type, surveyed_by_user_id = X-User-ID"
          - "set approved_mounting_type = recommended_mounting_type (no engineering exception needed for these two bands)"
          - "increments InstallWorkOrder.version by 1"
        note: "Branch 1 of the fork. The survey trigger fans out into four target states with disjoint side-effect sets."
      - from: SCHEDULED
        to: EXCEPTION_PENDING
        trigger: "POST /install-work-orders/{id}/survey"
        actor: FieldTech
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED}"
          - "field_los_margin_m >= 0 and recommended_mast_height_m <= MAX_MAST_HEIGHT_M"
          - "recommended_mounting_type IN {ROOF_MAST_GUYED, GROUND_POLE_MAST}"
          - "structure_penetration_allowed == true when recommended_mounting_type == ROOF_MAST_GUYED"
        side_effects:
          - "set field_los_margin_m, recommended_mast_height_m, recommended_mounting_type, surveyed_by_user_id = X-User-ID"
          - "leave approved_mounting_type null until a NetworkEngineer decides"
          - "increments InstallWorkOrder.version by 1"
        note: "Branch 2 of the fork; the tall-mast bands require an engineering exception."
      - from: SCHEDULED
        to: RESURVEY_REQUIRED
        trigger: "POST /install-work-orders/{id}/survey"
        actor: FieldTech
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED}"
          - "field_los_margin_m >= 0 and recommended_mast_height_m <= MAX_MAST_HEIGHT_M"
          - "recommended_mounting_type == ROOF_MAST_GUYED and structure_penetration_allowed == false"
        side_effects:
          - "set field_los_margin_m, recommended_mast_height_m, recommended_mounting_type, surveyed_by_user_id = X-User-ID"
          - "resurvey_count += 1"
          - "increments InstallWorkOrder.version by 1"
        note: "Branch 3 of the fork; a guyed roof mast is impossible without penetration, so the crew must find another mounting point."
      - from: SCHEDULED
        to: SURVEY_FAILED
        trigger: "POST /install-work-orders/{id}/survey"
        actor: FieldTech
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED}"
          - "field_los_margin_m < 0 OR recommended_mast_height_m > MAX_MAST_HEIGHT_M (12.0)"
        side_effects:
          - "set field_los_margin_m, recommended_mast_height_m, surveyed_by_user_id = X-User-ID; leave recommended_mounting_type null when the mast limit is exceeded"
          - "increments InstallWorkOrder.version by 1"
        note: "Branch 4 of the fork; terminal. The Subscriber is NOT auto-cancelled - operations decide separately."
      - from: EXCEPTION_PENDING
        to: MOUNT_APPROVED
        trigger: "POST /install-work-orders/{id}/exception-decision with decision=APPROVE"
        actor: NetworkEngineer
        preconditions:
          - "InstallWorkOrder.status == EXCEPTION_PENDING, else ERR_WORK_ORDER_STATE_INVALID"
          - "X-User-ID != InstallWorkOrder.surveyed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "approved_mounting_type, when supplied, is a band whose ceiling is >= recommended_mast_height_m, else ERR_MOUNTING_INCOMPATIBLE"
        side_effects:
          - "set approved_mounting_type (the supplied band, or recommended_mounting_type when omitted) and exception_approved_by_user_id = X-User-ID"
          - "increments InstallWorkOrder.version by 1"
        note: "Join point of the fork: branches 1 and 2 converge on MOUNT_APPROVED before completion is possible."
      - from: EXCEPTION_PENDING
        to: RESURVEY_REQUIRED
        trigger: "POST /install-work-orders/{id}/exception-decision with decision=REQUEST_RESURVEY"
        actor: NetworkEngineer
        preconditions:
          - "InstallWorkOrder.status == EXCEPTION_PENDING"
          - "X-User-ID != InstallWorkOrder.surveyed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "InstallWorkOrder.resurvey_count < MAX_RESURVEYS (2), else ERR_RESURVEY_LIMIT_REACHED"
        side_effects:
          - "resurvey_count += 1"
          - "clear field_los_margin_m, recommended_mast_height_m, recommended_mounting_type"
          - "increments InstallWorkOrder.version by 1"
      - from: EXCEPTION_PENDING
        to: SURVEY_FAILED
        trigger: "POST /install-work-orders/{id}/exception-decision with decision=REJECT"
        actor: NetworkEngineer
        preconditions:
          - "InstallWorkOrder.status == EXCEPTION_PENDING"
          - "X-User-ID != InstallWorkOrder.surveyed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set exception_approved_by_user_id = X-User-ID for audit even though the outcome is a rejection"
          - "increments InstallWorkOrder.version by 1"
      - from: RESURVEY_REQUIRED
        to: SCHEDULED
        trigger: "POST /install-work-orders/{id}/reschedule"
        actor: FieldTech
        preconditions:
          - "InstallWorkOrder.status == RESURVEY_REQUIRED, else ERR_WORK_ORDER_STATE_INVALID"
          - "InstallWorkOrder.resurvey_count <= MAX_RESURVEYS (2), else ERR_RESURVEY_LIMIT_REACHED"
        side_effects:
          - "set scheduled_at from the request"
          - "increments InstallWorkOrder.version by 1"
        note: "SCHEDULED -> RESURVEY_REQUIRED -> SCHEDULED is the loop that makes this machine cyclic as well as branching."
      - from: MOUNT_APPROVED
        to: INSTALLED
        trigger: "POST /install-work-orders/{id}/completion"
        actor: FieldTech
        preconditions:
          - "InstallWorkOrder.status == MOUNT_APPROVED, else ERR_WORK_ORDER_STATE_INVALID - with the single exception that status == EXCEPTION_PENDING is refused with ERR_MOUNT_EXCEPTION_REQUIRED (422) because approved_mounting_type is still null there"
          - "the linked Subscriber.service_status == PENDING_INSTALL, else ERR_SUBSCRIBER_NOT_ACTIVE"
          - "installed_mast_height_m <= the ceiling of approved_mounting_type's band, else ERR_MAST_EXCEEDS_STRUCTURAL_LIMIT"
        side_effects:
          - "set installed_at = clock_now, radio_serial and installed_mast_height_m from the request"
          - "compute install_invoice_total_cents (calculation install_invoice_total)"
          - "the linked Subscriber transitions PENDING_INSTALL -> ACTIVE"
          - "because the Subscriber went ACTIVE, its EquipmentAssignment transitions ASSIGNED -> DEPLOYED with deployed_at = clock_now and radio_serial copied from this work order"
          - "because the assignment is DEPLOYED, Subscriber.equipment_monthly_charge_cents is recomputed"
          - "increments InstallWorkOrder.version by 1"
        note: "Cascade chain Z, depth 4. Cross-entity state dependency on Subscriber.service_status - a different entity pair from Sector activation gating on Tower.status."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: the linked Subscriber transitions to CANCELLED"
        actor: system
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED, EXCEPTION_PENDING, RESURVEY_REQUIRED}"
        side_effects:
          - "increments InstallWorkOrder.version by 1"
      - from: EXCEPTION_PENDING
        to: CANCELLED
        trigger: "system event: the linked Subscriber transitions to CANCELLED"
        actor: system
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED, EXCEPTION_PENDING, RESURVEY_REQUIRED}"
        side_effects:
          - "increments InstallWorkOrder.version by 1"
      - from: RESURVEY_REQUIRED
        to: CANCELLED
        trigger: "system event: the linked Subscriber transitions to CANCELLED"
        actor: system
        preconditions:
          - "InstallWorkOrder.status IN {SCHEDULED, EXCEPTION_PENDING, RESURVEY_REQUIRED}"
        side_effects:
          - "increments InstallWorkOrder.version by 1"

  - entity: EquipmentAssignment
    initial_state: ASSIGNED
    terminal_states: [RETURNED, UNRETURNED_BILLED, VOIDED]
    transitions:
      - from: ASSIGNED
        to: DEPLOYED
        trigger: "system event: the linked Subscriber transitions PENDING_INSTALL -> ACTIVE"
        actor: system
        preconditions:
          - "EquipmentAssignment.status == ASSIGNED"
        side_effects:
          - "set deployed_at = clock_now and radio_serial from the completing InstallWorkOrder"
          - "recompute Subscriber.equipment_monthly_charge_cents"
          - "increments EquipmentAssignment.version by 1"
      - from: DEPLOYED
        to: RETURN_PENDING
        trigger: "system event: the linked Subscriber transitions to CANCELLED"
        actor: system
        preconditions:
          - "EquipmentAssignment.status == DEPLOYED"
        side_effects:
          - "set return_due_at = clock_now + RETURN_WINDOW_DAYS (21) days"
          - "recompute Subscriber.equipment_monthly_charge_cents, which becomes 0"
          - "increments EquipmentAssignment.version by 1"
      - from: RETURN_PENDING
        to: RETURNED
        trigger: "POST /equipment-assignments/{id}/return"
        actor: FieldTech
        preconditions:
          - "EquipmentAssignment.status == RETURN_PENDING, else ERR_ASSIGNMENT_NOT_RETURNABLE"
        side_effects:
          - "set returned_at = clock_now and return_condition from the request"
          - "compute months_in_service, settlement_cents and settlement_basis (calculation equipment_settlement)"
          - "recompute Subscriber.settlement_balance_cents"
          - "increments EquipmentAssignment.version by 1"
      - from: RETURN_PENDING
        to: UNRETURNED_BILLED
        trigger: "POST /equipment-assignments/{id}/unreturned-settlement"
        actor: BillingAdmin
        preconditions:
          - "EquipmentAssignment.status == RETURN_PENDING, else ERR_ASSIGNMENT_NOT_RETURNABLE"
          - "clock_now >= EquipmentAssignment.return_due_at, else ERR_RETURN_WINDOW_OPEN"
        side_effects:
          - "compute months_in_service, settlement_cents and settlement_basis (calculation equipment_settlement)"
          - "recompute Subscriber.settlement_balance_cents"
          - "increments EquipmentAssignment.version by 1"
      - from: ASSIGNED
        to: VOIDED
        trigger: "system event: the linked Subscriber transitions PENDING_INSTALL -> CANCELLED before any install completion"
        actor: system
        preconditions:
          - "EquipmentAssignment.status == ASSIGNED"
        side_effects:
          - "set settlement_cents = 0 and settlement_basis = NONE"
          - "increments EquipmentAssignment.version by 1"

  - entity: OutageEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /outage-events/{id}/closure"
        actor: NetworkEngineer
        preconditions:
          - "OutageEvent.status == OPEN, else ERR_OUTAGE_ALREADY_CLOSED"
          - "ended_at > OutageEvent.started_at, else ERR_INTERVAL_INVALID"
          - "the closed interval [started_at, ended_at) does not overlap any other OutageEvent on the same Tower whose status == CLOSED, else ERR_OUTAGE_WINDOW_OVERLAP"
        side_effects:
          - "set ended_at and peak_wind_mph from the request"
          - "compute duration_minutes and sla_excluded"
          - "increments OutageEvent.version by 1"

  - entity: OutageCredit
    initial_state: PENDING
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /outage-credits/{id}/application"
        actor: FinanceApprover
        preconditions:
          - "OutageCredit.status == PENDING, else ERR_CREDIT_NOT_PENDING"
          - "X-User-ID != OutageCredit.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "set approved_by_user_id = X-User-ID"
          - "recompute Subscriber.credit_balance_cents (+ credit_cents)"
          - "recompute OutageEvent.total_credited_cents (+ credit_cents)"
          - "increments OutageCredit.version by 1"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /outage-credits/{id}/reversal"
        actor: FinanceApprover
        preconditions:
          - "OutageCredit.status == APPLIED, else ERR_CREDIT_NOT_APPLIED"
        side_effects:
          - "set reversal_reason from the request"
          - "recompute Subscriber.credit_balance_cents (- credit_cents)"
          - "recompute OutageEvent.total_credited_cents (- credit_cents)"
          - "increments OutageCredit.version by 1"
        note: "Compensating action: after reversal both conserved money quantities equal their pre-application values exactly, with no rounding drift, because credit_cents itself is never recomputed."
      - from: PENDING
        to: DENIED
        trigger: "POST /outage-credits (system, inside the creating request)"
        actor: system
        preconditions:
          - "the outage is SLA-excluded, or the clipped minutes are below MIN_CREDITABLE_MINUTES, or the computed shortfall is zero"
        side_effects:
          - "set credit_cents = 0 and denial_reason to SLA_EXCLUDED, BELOW_MINIMUM_DURATION or NO_SHORTFALL"
        note: "The row is created directly in DENIED; PENDING is never observable for a denied credit."

concurrency_rules:
  - rule_id: capacity-hold-create-stale-sector
    parent_entity: Sector
    write_endpoint: "POST /capacity-holds"
    occ_field: "expected_sector_version"
    description: |
      Creating a CapacityHold against a Sector whose version has advanced since the
      client last read it is rejected. A sales desk that read the sector at version 7,
      saw capacity_posture OPEN and remaining allowance sufficient, then submitted a
      hold after another writer had already consumed part of that allowance (advancing
      the sector to version 8) is working from a stale view of the allowance it is
      about to reserve. Because a second reservation on the same sector is itself a
      legitimate operation under the oversubscription policy, this cannot be reduced
      to a state precondition, so the write carries expected_sector_version and is
      rejected when it does not equal Sector.version.
    error_id: ERR_STALE_SECTOR_VERSION
    http_status: 412

  - rule_id: plan-change-stale-subscriber
    parent_entity: Subscriber
    write_endpoint: "POST /subscribers/{id}/plan-changes"
    occ_field: "expected_subscriber_version"
    description: |
      Changing a Subscriber's ServicePlan when the account's version has advanced
      since the client last read it is rejected. A plan change legitimately supersedes
      the previous plan and re-derives the sector allowance the account occupies, so a
      second plan change is a valid operation rather than a forbidden state - the only
      protection is that the caller's view of the account must be current, which is
      expressed as expected_subscriber_version equal to Subscriber.version.
    error_id: ERR_STALE_SUBSCRIBER_VERSION
    http_status: 412

calculations:
  - name: los_qualification_mast_height
    trigger: "POST /serviceability-requests (variant DESKTOP_LIDAR, writing ServiceabilityRequest.desktop_los_margin_m / desktop_required_mast_height_m / desktop_mounting_type) and POST /install-work-orders/{id}/survey (variant FIELD_SURVEY, writing InstallWorkOrder.field_los_margin_m / recommended_mast_height_m / recommended_mounting_type)"
    algorithm: threshold
    formula: |
      # All arithmetic is decimal; every intermediate keeps 1 decimal place unless stated.
      tower_antenna_amsl_m  = Tower.ground_elevation_m + Tower.antenna_agl_m

      # obstruction_height_m and roof_m are variant-specific (see variants below)
      obstruction_top_amsl_m = premise_ground_elevation_m + obstruction_height_m
      roof_amsl_m            = premise_ground_elevation_m + roof_m

      # clearance band is selected on path_distance_km, half-open on the LOWER bound:
      if   path_distance_km <= 3.0                          : clearance_m = 1.5
      elif path_distance_km >  3.0 and path_distance_km <=  8.0 : clearance_m = 3.0
      elif path_distance_km >  8.0 and path_distance_km <= 15.0 : clearance_m = 4.5
      # path_distance_km > MAX_LINK_DISTANCE_KM never reaches here (denied at step 1)

      # obstruction_class is read from ServiceabilityRequest for BOTH variants
      extra_m = PARTIAL_OBSTRUCTION_EXTRA_M if ServiceabilityRequest.obstruction_class == PARTIAL else 0.0

      required_antenna_amsl_m = obstruction_top_amsl_m + clearance_m + extra_m + SAFETY_MARGIN_M
      los_margin_m            = round_half_up(tower_antenna_amsl_m - required_antenna_amsl_m, 1)

      raw_mast_m       = max(0.0, required_antenna_amsl_m - roof_amsl_m)
      required_mast_m  = ceil(raw_mast_m / MAST_STEP_M) * MAST_STEP_M     # next 0.5 m, exact decimal

      # mounting band, selected on required_mast_m, upper bounds INCLUSIVE:
      if   required_mast_m <=  1.0 : mounting_type = WALL_BRACKET
      elif required_mast_m <=  3.0 : mounting_type = NON_PEN_ROOF_TRIPOD
      elif required_mast_m <=  6.0 : mounting_type = ROOF_MAST_GUYED
      elif required_mast_m <= 12.0 : mounting_type = GROUND_POLE_MAST
      else                         : mounting_type = null   # MAST_LIMIT_EXCEEDED

      # Denial precedence (variant DESKTOP_LIDAR only), evaluated in exactly this order;
      # the FIRST condition that holds sets ServiceabilityRequest.denial_reason:
      #   1. path_distance_km > MAX_LINK_DISTANCE_KM        -> LINK_DISTANCE_EXCEEDED
      #   2. obstruction_class == BLOCKED                   -> OBSTRUCTION_BLOCKED
      #   3. los_margin_m < 0                               -> NO_LINE_OF_SIGHT
      #   4. required_mast_m > MAX_MAST_HEIGHT_M            -> MAST_LIMIT_EXCEEDED
      #   5. no Sector with tower_id == candidate_tower_id has status == ACTIVE
      #                                                     -> NO_ACTIVE_SECTOR
      # Only when none hold does calculation sector_selection run.
    input_set: "Exactly one Tower (ServiceabilityRequest.candidate_tower_id) and the geometry fields of one ServiceabilityRequest; the FIELD_SURVEY variant additionally reads the two measured heights of one InstallWorkOrder. No aggregation over collections."
    constants:
      SAFETY_MARGIN_M: 0.5
      MAST_STEP_M: 0.5
      MAX_MAST_HEIGHT_M: 12.0
      MAX_LINK_DISTANCE_KM: 15.0
      PARTIAL_OBSTRUCTION_EXTRA_M: 1.0
      CLEARANCE_M_AT_OR_BELOW_3KM: 1.5
      CLEARANCE_M_3_TO_8KM: 3.0
      CLEARANCE_M_8_TO_15KM: 4.5
      WALL_BRACKET_MAX_MAST_M: 1.0
      NON_PEN_ROOF_TRIPOD_MAX_MAST_M: 3.0
      ROOF_MAST_GUYED_MAX_MAST_M: 6.0
      GROUND_POLE_MAST_MAX_MAST_M: 12.0
      QUALIFICATION_VALID_DAYS: 30
    precision: "los_margin_m: 1 decimal place, round_half_up. required_mast_m: exact multiple of 0.5 obtained by ceiling, never rounded down. All heights are decimals, never binary floats."
    variants:
      - name: DESKTOP_LIDAR
        when: "POST /serviceability-requests, before any truck roll"
        difference: "obstruction_height_m = ServiceabilityRequest.declared_tree_line_height_m and roof_m = ServiceabilityRequest.roof_height_m, both taken from the LiDAR desktop study; the outputs land on the ServiceabilityRequest's desktop_* fields and can DENY the request."
      - name: FIELD_SURVEY
        when: "POST /install-work-orders/{id}/survey, on site"
        difference: "obstruction_height_m = InstallWorkOrder.measured_tree_line_height_m and roof_m = InstallWorkOrder.measured_roof_height_m, both measured with an inclinometer; the outputs land on the InstallWorkOrder's field_los_margin_m / recommended_* fields and never mutate the ServiceabilityRequest. Identical premise geometry with a taller measured obstruction yields a strictly taller mast and can therefore select a different mounting band than the desktop study did, which is what forces the EXCEPTION_PENDING branch."

  - name: sector_capacity_posture
    trigger: "recomputed on every side effect that names capacity_posture: POST /capacity-holds, POST /capacity-holds/{id}/release, POST /subscribers, POST /subscribers/{id}/plan-changes, POST /subscribers/{id}/status-changes, POST /sectors/{id}/activation, POST /sectors/{id}/capacity-policy, POST /backhaul-circuits/{id}/state-changes, POST /towers/{id}/status-changes, and the lazy CapacityHold expiry sweep"
    algorithm: threshold
    formula: |
      sold_mbps = sum of ServicePlan.downstream_mbps over every Subscriber with
                  sector_id == Sector.id AND service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED},
                  each subscriber contributing its CURRENT service_plan_id's downstream_mbps
      held_mbps = sum of CapacityHold.held_mbps over every CapacityHold with
                  sector_id == Sector.id AND status == HELD
      committed_mbps = sold_mbps + held_mbps
      oversubscription_ratio = round_half_up(committed_mbps / Sector.capacity_mbps, 3)

      r_watch  = Sector.max_oversubscription_ratio * WATCH_FRACTION
      r_hold   = Sector.max_oversubscription_ratio * HOLD_FRACTION
      r_freeze = Sector.max_oversubscription_ratio

      # non-linear interaction of four inputs: ratio, sector status, tower status, backhaul rate
      if Sector.status == DISABLED or Tower.status == DECOMMISSIONED:
          capacity_posture = FROZEN
      elif Tower.backhaul_accepted_mbps == 0:
          capacity_posture = FROZEN            # no BackhaulCircuit on the tower is in state ACCEPTED
      elif oversubscription_ratio >= r_freeze:
          capacity_posture = FROZEN
      else:
          if   oversubscription_ratio >= r_hold  : base = HOLD
          elif oversubscription_ratio >= r_watch : base = WATCH
          else                                   : base = OPEN
          backhaul_ratio = round_half_up(committed_mbps / max(Tower.backhaul_accepted_mbps, 1), 3)
          if backhaul_ratio >= BACKHAUL_ESCALATION_RATIO and base IN {OPEN, WATCH}:
              base = HOLD                      # transport-limited, independent of the sector air ratio
          capacity_posture = base
    input_set: "Subscribers on this Sector in service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED} (CANCELLED excluded); CapacityHolds on this Sector in status == HELD (CONSUMED, RELEASED and EXPIRED excluded); the single parent Tower row; the parent Tower's BackhaulCircuit rows only through Tower.backhaul_accepted_mbps."
    constants:
      WATCH_FRACTION: 0.50
      HOLD_FRACTION: 0.75
      BACKHAUL_ESCALATION_RATIO: 12.0
    precision: "oversubscription_ratio and backhaul_ratio: 3 decimal places, round_half_up. All threshold comparisons are >= (a ratio landing exactly on a threshold escalates)."

  - name: sector_selection
    trigger: "POST /serviceability-requests (choosing ServiceabilityRequest.qualified_sector_id) and the CAPACITY_DEFERRED -> QUALIFIED promotion cascade"
    algorithm: waterfall_allocation
    formula: |
      plan = the ServicePlan referenced by ServiceabilityRequest.requested_plan_id

      # (a) eligibility filter - explicit predicate, no adjectives
      eligible = every Sector S where
            S.tower_id == ServiceabilityRequest.candidate_tower_id
        AND S.status == ACTIVE
        AND S.spectrum_license -> SpectrumLicense.status == ACTIVE at clock_now
        AND S.capacity_posture IN {OPEN, WATCH}
        AND remaining_allowance(S) >= plan.downstream_mbps
      where remaining_allowance(S) =
            floor(S.capacity_mbps * S.max_oversubscription_ratio) - S.committed_mbps

      # (b) ranking expression, ascending on each key in order
      rank by (S.oversubscription_ratio ASC, S.azimuth_deg ASC, S.created_at ASC)
      # (c) tie-break: created_at ASC is the final key; Sector.id is NEVER consulted
      # (d) empty candidate set:
      #     if any Sector on the tower has status == ACTIVE but was excluded ONLY by
      #        capacity_posture IN {HOLD, FROZEN} or by remaining_allowance
      #        -> ServiceabilityRequest.status = CAPACITY_DEFERRED (no error)
      #     elif no Sector on the tower has status == ACTIVE
      #        -> status = DENIED, denial_reason = NO_ACTIVE_SECTOR
      #     else (excluded only because every ACTIVE sector's licence is not ACTIVE)
      #        -> status = DENIED, denial_reason = NO_ACTIVE_SECTOR

      # promotion selector, used by the CAPACITY_DEFERRED -> QUALIFIED cascade:
      # among ServiceabilityRequests with candidate_tower_id == the recomputed Sector's
      # tower_id, status == CAPACITY_DEFERRED and clock_now < qualification_expires_at,
      # order by (created_at ASC, intake_sequence ASC) and promote exactly the FIRST row
      # whose plan still fits the recomputed Sector. id is never consulted.
    input_set: "Sectors of the candidate Tower with status == ACTIVE and an ACTIVE SpectrumLicense; ServiceabilityRequests with status == CAPACITY_DEFERRED and an unexpired qualification for the promotion selector."
    constants: {}
    precision: "remaining_allowance uses floor on capacity_mbps * max_oversubscription_ratio so the sector never oversells a fractional Mbps; comparisons on it are >=."

  - name: usage_cycle_deprioritization
    trigger: "POST /subscribers/{id}/usage-records (recomputing Subscriber.cycle_usage_gb, usage_priority and effective_downstream_mbps) and POST /subscribers/{id}/cycle-close"
    algorithm: chronological
    formula: |
      window_start = Subscriber.cycle_start_date                       # inclusive
      window_end   = Subscriber.cycle_start_date + CYCLE_DAYS days      # exclusive
      records = every UsageRecord with subscriber_id == Subscriber.id
                AND window_start <= usage_date < window_end
      process records in order (usage_date ASC, ingest_sequence ASC)    # id is never consulted
      running_gb = 0.0
      for r in records:
          running_gb = round_half_up(running_gb + r.downstream_gb + r.upstream_gb, 1)
      cycle_usage_gb = running_gb

      breached = cycle_usage_gb > ServicePlan.soft_cap_gb               # STRICTLY greater
      usage_priority = DEPRIORITIZED if (breached OR Subscriber.sticky_deprioritization_active)
                                     else STANDARD

      if usage_priority == DEPRIORITIZED:
          effective_downstream_mbps = round_half_up(
              max(ServicePlan.downstream_mbps * ServicePlan.deprioritization_factor,
                  MIN_EFFECTIVE_MBPS), 1)
      else:
          effective_downstream_mbps = ServicePlan.downstream_mbps

      # cycle close (POST /subscribers/{id}/cycle-close):
      if breached: consecutive_breach_cycles += 1
      else       : consecutive_breach_cycles  = 0
      sticky_deprioritization_active = (consecutive_breach_cycles >= STICKY_BREACH_CYCLES)
      cycle_start_date += CYCLE_DAYS days
      # then re-run the block above over the NEW window, so an account that opens the
      # next cycle with zero usage but sticky_deprioritization_active == true stays
      # DEPRIORITIZED.
    input_set: "UsageRecord rows of this Subscriber whose usage_date falls in the half-open current cycle window; rows outside the window are excluded even when ingested during it."
    constants:
      CYCLE_DAYS: 30
      STICKY_BREACH_CYCLES: 2
      MIN_EFFECTIVE_MBPS: 0.1
    precision: "cycle_usage_gb and effective_downstream_mbps: 1 decimal place, round_half_up, accumulated record-by-record in chronological order (round per record, then add), NOT summed at full precision and rounded once."

  - name: outage_credit_amount
    trigger: "POST /outage-credits (setting OutageCredit.method, cycle_outage_minutes, measured_uptime_pct, shortfall_pct, prior_cycle_credited_cents, credit_cents, denial_reason)"
    algorithm: aggregation
    formula: |
      plan   = the ServicePlan referenced by Subscriber.service_plan_id
      method = plan.sla_credit_method                       # selects the variant
      tower  = the Tower of the Sector referenced by Subscriber.sector_id
      cycle  = [Subscriber.cycle_start_date, cycle_start_date + CYCLE_DAYS days)   # half-open

      # sla_excluded, computed on the OutageEvent at closure:
      #   cause == WEATHER_WIND                -> excluded iff coalesce(peak_wind_mph, 0.0) >= SEVERE_WIND_MPH
      #   cause IN {WEATHER_ICE, WEATHER_FLOOD}-> always excluded (declared force majeure)
      #   cause == PLANNED_MAINTENANCE         -> excluded iff coalesce(planned_notice_days, 0) >= PLANNED_NOTICE_MIN_DAYS
      #   cause IN {POWER, BACKHAUL, EQUIPMENT}-> never excluded

      clipped_minutes(E) = whole minutes of [E.started_at, E.ended_at) intersected with `cycle`,
                           truncated toward zero
      creditable_minutes(E) = 0 if (E.sla_excluded
                                    OR E.status != CLOSED
                                    OR clipped_minutes(E) < MIN_CREDITABLE_MINUTES)
                              else clipped_minutes(E)
      cap_cents = floor(plan.monthly_price_cents * MAX_CREDIT_PCT_OF_MRC)

      if method == SLA_SHORTFALL:
          cycle_outage_minutes = sum of creditable_minutes(E) over every OutageEvent E with
                                 tower_id == tower.id AND status == CLOSED, ordered by
                                 (started_at ASC, created_at ASC) - order does not change the sum
          measured_uptime_pct = round_half_up(
              100 * (SLA_MONTHLY_MINUTES - cycle_outage_minutes) / SLA_MONTHLY_MINUTES, 3)
          shortfall_pct = round_half_up(max(0, plan.sla_uptime_pct - measured_uptime_pct), 3)
          cycle_credit_cents = min(
              round_half_up(plan.monthly_price_cents * shortfall_pct / 100 * SHORTFALL_MULTIPLIER, 0),
              cap_cents)
          prior_cycle_credited_cents = sum of credit_cents over every OTHER OutageCredit with
              subscriber_id == Subscriber.id, status IN {PENDING, APPLIED}, and whose
              OutageEvent intersects the same `cycle`
          credit_cents = max(0, cycle_credit_cents - prior_cycle_credited_cents)
      else:   # method == PER_INCIDENT
          cycle_outage_minutes       = creditable_minutes(this OutageEvent)
          measured_uptime_pct        = 0.0
          shortfall_pct              = 0.0
          prior_cycle_credited_cents = 0
          credit_cents = min(
              round_half_up(plan.monthly_price_cents * cycle_outage_minutes / SLA_MONTHLY_MINUTES, 0),
              cap_cents)

      # denial, evaluated in this order:
      #   1. this OutageEvent.sla_excluded            -> DENIED, denial_reason = SLA_EXCLUDED
      #   2. clipped_minutes(this event) < MIN_CREDITABLE_MINUTES
      #                                               -> DENIED, denial_reason = BELOW_MINIMUM_DURATION
      #   3. credit_cents == 0                        -> DENIED, denial_reason = NO_SHORTFALL
      #   otherwise the row is created PENDING with credit_cents > 0.
    input_set: "For SLA_SHORTFALL: every CLOSED OutageEvent on the subscriber's Tower whose window intersects the subscriber's current cycle, excluding SLA-excluded events and events shorter than MIN_CREDITABLE_MINUTES; plus the subscriber's other PENDING/APPLIED credits for the same cycle. For PER_INCIDENT: only the single OutageEvent named in the request. REVERSED and DENIED credits never count toward prior_cycle_credited_cents."
    constants:
      SLA_MONTHLY_MINUTES: 43200
      SHORTFALL_MULTIPLIER: 10
      MAX_CREDIT_PCT_OF_MRC: 0.50
      MIN_CREDITABLE_MINUTES: 60
      SEVERE_WIND_MPH: 58.0
      PLANNED_NOTICE_MIN_DAYS: 7
      CYCLE_DAYS: 30
    precision: "measured_uptime_pct and shortfall_pct: 3 decimal places, round_half_up. credit_cents: whole cents, round_half_up, and the SLA_SHORTFALL variant aggregates ALL cycle minutes first and rounds ONCE at the end before subtracting prior_cycle_credited_cents - it never rounds per event and sums. cap_cents uses floor, so a 6999-cent plan caps at 3499, not 3500."
    variants:
      - name: SLA_SHORTFALL
        when: "the subscriber's ServicePlan.sla_credit_method == SLA_SHORTFALL"
        difference: "Credit is driven by the cycle-wide uptime shortfall against plan.sla_uptime_pct and multiplied by SHORTFALL_MULTIPLIER, then reduced by credits already issued for the same cycle, so the second credit in a cycle is an increment rather than a full amount."
      - name: PER_INCIDENT
        when: "the subscriber's ServicePlan.sla_credit_method == PER_INCIDENT"
        difference: "Credit is a pure pro-rata slice of the monthly price for this one event's minutes with no multiplier, no uptime target and no cross-event netting, so identical outage minutes on the same monthly price produce a materially smaller amount than SLA_SHORTFALL."

  - name: install_invoice_total
    trigger: "POST /install-work-orders/{id}/completion (setting InstallWorkOrder.install_invoice_total_cents)"
    algorithm: tiered_pricing
    formula: |
      labor_cents = LABOR_CENTS_BY_MOUNTING[InstallWorkOrder.approved_mounting_type]
      mast_kit_cents = MAST_KIT_CENTS_PER_HALF_METRE
                       * ceil(InstallWorkOrder.installed_mast_height_m / 0.5)
      subtotal_cents = TRIP_CHARGE_CENTS + labor_cents + mast_kit_cents

      # EVALUATION ORDER IS PINNED. The promo tier is keyed on subtotal_cents ONLY, and the
      # regulatory recovery fee is keyed on the POST-DISCOUNT net. The tier is never
      # re-evaluated after the fee is added, even though the fee raises the total back
      # across a tier boundary - that is what makes the value well-defined.
      if   subtotal_cents >= 30000 : promo_discount_cents = 5000
      elif subtotal_cents >= 20000 : promo_discount_cents = 3000
      elif subtotal_cents >= 10000 : promo_discount_cents = 1000
      else                         : promo_discount_cents = 0

      net_cents = subtotal_cents - promo_discount_cents
      regulatory_recovery_cents = round_half_up(net_cents * REG_RECOVERY_PCT, 0)
      install_invoice_total_cents = net_cents + regulatory_recovery_cents
    input_set: "One InstallWorkOrder row: its approved_mounting_type and installed_mast_height_m. No aggregation."
    constants:
      TRIP_CHARGE_CENTS: 9900
      LABOR_CENTS_BY_MOUNTING_WALL_BRACKET: 4900
      LABOR_CENTS_BY_MOUNTING_NON_PEN_ROOF_TRIPOD: 9900
      LABOR_CENTS_BY_MOUNTING_ROOF_MAST_GUYED: 19900
      LABOR_CENTS_BY_MOUNTING_GROUND_POLE_MAST: 34900
      MAST_KIT_CENTS_PER_HALF_METRE: 1750
      PROMO_TIER_1_MIN_SUBTOTAL_CENTS: 10000
      PROMO_TIER_1_DISCOUNT_CENTS: 1000
      PROMO_TIER_2_MIN_SUBTOTAL_CENTS: 20000
      PROMO_TIER_2_DISCOUNT_CENTS: 3000
      PROMO_TIER_3_MIN_SUBTOTAL_CENTS: 30000
      PROMO_TIER_3_DISCOUNT_CENTS: 5000
      REG_RECOVERY_PCT: 0.0325
    precision: "Whole cents throughout. regulatory_recovery_cents: round_half_up to 0 decimals on the post-discount net. Discount tiers use >= on subtotal_cents."

  - name: equipment_settlement
    trigger: "POST /equipment-assignments/{id}/return and POST /equipment-assignments/{id}/unreturned-settlement (setting EquipmentAssignment.months_in_service, settlement_cents and settlement_basis, then recomputing Subscriber.settlement_balance_cents)"
    algorithm: decay_function
    formula: |
      months_in_service = floor(whole_days(EquipmentAssignment.deployed_at -> clock_now)
                                / DAYS_PER_SETTLEMENT_MONTH)
                          # 0 when deployed_at is null

      if acquisition_mode == RENTAL:
          if the assignment is entering UNRETURNED_BILLED:
              rental_credit_cents = min(monthly_rental_cents * months_in_service,
                                        floor(replacement_cost_cents * RENTAL_CREDIT_CAP_PCT))
              settlement_cents  = replacement_cost_cents - rental_credit_cents
              settlement_basis  = RENTAL_CREDIT_OFFSET
          elif return_condition == DAMAGED:
              settlement_cents  = round_half_up(replacement_cost_cents * DAMAGE_CHARGE_PCT, 0)
              settlement_basis  = RENTAL_DAMAGE
          else:   # returned GOOD
              settlement_cents  = 0
              settlement_basis  = NONE
      else:   # acquisition_mode == PURCHASE
          if the assignment is entering UNRETURNED_BILLED:
              settlement_cents  = 0           # the subscriber already owns the radio
              settlement_basis  = NONE
          else:   # returned within the window, either condition
              residual_cents = round_half_up(
                  purchase_price_cents
                  * max(0, DEPRECIATION_MONTHS - months_in_service) / DEPRECIATION_MONTHS, 0)
              restock_cents  = round_half_up(residual_cents * RESTOCK_FEE_PCT, 0)
              settlement_cents = -(residual_cents - restock_cents)   # negative = refund owed
              settlement_basis = DEPRECIATED_REFUND

      Subscriber.settlement_balance_cents = sum of settlement_cents over every
          EquipmentAssignment with subscriber_id == Subscriber.id and
          status IN {RETURNED, UNRETURNED_BILLED, VOIDED}
    input_set: "One EquipmentAssignment row plus the logical clock; the subscriber-level roll-up sums only assignments in status IN {RETURNED, UNRETURNED_BILLED, VOIDED} (ASSIGNED, DEPLOYED and RETURN_PENDING contribute 0)."
    constants:
      REPLACEMENT_COST_CENTS: 34900
      RENTAL_MONTHLY_CENTS: 1000
      PURCHASE_PRICE_CENTS: 29900
      RENTAL_CREDIT_CAP_PCT: 0.60
      DAMAGE_CHARGE_PCT: 0.50
      DEPRECIATION_MONTHS: 36
      RESTOCK_FEE_PCT: 0.15
      RETURN_WINDOW_DAYS: 21
      DAYS_PER_SETTLEMENT_MONTH: 30
    precision: "Whole cents; residual_cents is rounded to whole cents BEFORE the restock fee is taken (round-then-fee, not fee-then-round). RENTAL_CREDIT_CAP_PCT uses floor so the cap on a 34900-cent radio is 20940."
    variants:
      - name: RENTAL_LIABILITY
        when: "EquipmentAssignment.acquisition_mode == RENTAL"
        difference: "The operator owns the radio, so the settlement is a CHARGE: full replacement cost offset by rent already collected (capped at 60% of replacement), or half replacement cost when the unit comes back damaged."
      - name: PURCHASE_REFUND
        when: "EquipmentAssignment.acquisition_mode == PURCHASE"
        difference: "The subscriber owns the radio, so the settlement is a straight-line depreciated REFUND net of a restock fee (a negative settlement_cents), and never returning the unit costs the subscriber nothing at all - the sign of the money flow is inverted relative to RENTAL_LIABILITY for identical months_in_service."

  - name: tower_lease_escalation
    trigger: "GET /towers/{id}/lease-schedule and every read of Tower.current_monthly_rent_cents"
    algorithm: decay_function
    formula: |
      years_elapsed = the number of lease anniversaries of Tower.lease_start_date that
                      are <= clock_now (an anniversary on exactly clock_now counts)
      rent[0] = Tower.lease_monthly_base_rent_cents
      for y in 1 .. years_elapsed:
          rent[y] = round_half_up(rent[y-1] * (1 + Tower.lease_escalator_pct), 0)
      current_monthly_rent_cents = rent[years_elapsed]

      # ROUNDING ORDER IS PINNED: the rent is rounded to WHOLE CENTS AT EACH ANNIVERSARY
      # and the next year compounds on the ALREADY-ROUNDED value. Compounding at full
      # precision and rounding once at the end is a DIFFERENT number (45000 cents at
      # 2.75% for three years gives 48817 under the pinned order and 48816 under
      # compound-then-round) and is wrong.
      total_committed_cents = sum over y in 0 .. (Tower.lease_term_months / 12 - 1)
                              of rent[y] * 12
      next_anniversary_date = Tower.lease_start_date + (years_elapsed + 1) years
    input_set: "One Tower row plus the logical clock. No aggregation over other entities."
    constants:
      MONTHS_PER_LEASE_YEAR: 12
    precision: "Whole cents at every anniversary, round_half_up, compounding on the rounded value. total_committed_cents sums the twelve equal monthly rents of each lease year over the whole lease_term_months."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body shape: required fields present, types correct, enum members declared, numeric ranges and decimal places within the field's constraints (including latitude/longitude ranges, non-negative volumes, hold_days 1..30, and measured_mbps present on ACCEPTED state changes)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: business_constraint
    check: "pagination inputs are within bounds: 1 <= limit <= 100 and offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints (GET /sectors, GET /serviceability-requests, GET /capacity-holds, GET /subscribers, GET /outage-credits, GET /interference-coordinations, GET /subscribers/{id}/usage-records, GET /towers/{id}/backhaul-circuits, GET /towers/{id}/outage-events, GET /subscribers/{id}/install-work-orders, GET /subscribers/{id}/equipment-assignments, GET /sectors/{id}/interference-coordinations)"
  - priority: 5
    category: existence
    check: "every id in the URL path exists, validated left to right"
    error_id: ERR_TOWER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id; the error_id is the one matching the missing path segment (ERR_TOWER_NOT_FOUND, ERR_CIRCUIT_NOT_FOUND, ERR_LICENSE_NOT_FOUND, ERR_SECTOR_NOT_FOUND, ERR_COORDINATION_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_HOLD_NOT_FOUND, ERR_SUBSCRIBER_NOT_FOUND, ERR_WORK_ORDER_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_OUTAGE_NOT_FOUND, ERR_CREDIT_NOT_FOUND)"
  - priority: 6
    category: existence
    check: "every id referenced in the request body exists, validated in the order the fields are listed in the endpoint's input"
    error_id: ERR_SECTOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /backhaul-circuits, POST /sectors, POST /interference-coordinations, POST /serviceability-requests, POST /capacity-holds, POST /subscribers, POST /subscribers/{id}/plan-changes, POST /install-work-orders, POST /outage-events, POST /outage-credits"
  - priority: 7
    category: auth
    check: "when X-User-Role is Subscriber, X-User-ID equals the Subscriber.id that owns the addressed resource"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "GET /subscribers/{id}, GET /subscribers/{id}/usage-records, GET /subscribers/{id}/install-work-orders, GET /subscribers/{id}/equipment-assignments, GET /outage-credits"
  - priority: 8
    category: state
    check: "the addressed resource is in a state that permits the operation, per the §1.2 transition's from/preconditions (circuit state, tower status, sector status, coordination status, request status and qualification expiry, hold status, subscriber service_status, work-order status, assignment status, outage status, credit status)"
    error_id: ERR_INVALID_SECTOR_STATE
    http_status: 409
    applies_to: "all state-changing endpoints; the error_id is the state error of the addressed entity (ERR_INVALID_TOWER_STATE, ERR_INVALID_CIRCUIT_STATE, ERR_INVALID_SECTOR_STATE, ERR_COORDINATION_NOT_OPEN, ERR_REQUEST_NOT_QUALIFIED, ERR_QUALIFICATION_EXPIRED, ERR_HOLD_NOT_HELD, ERR_SUBSCRIBER_NOT_ACTIVE, ERR_WORK_ORDER_STATE_INVALID, ERR_ASSIGNMENT_NOT_RETURNABLE, ERR_OUTAGE_ALREADY_CLOSED, ERR_OUTAGE_NOT_CLOSED, ERR_CREDIT_NOT_PENDING, ERR_CREDIT_NOT_APPLIED). One carve-out: POST /install-work-orders/{id}/completion on a work order whose status == EXCEPTION_PENDING is NOT reported here - it is refused by the priority-11 ERR_MOUNT_EXCEPTION_REQUIRED rule, because the actionable defect is the missing engineering approval rather than the status label; every other non-MOUNT_APPROVED status still yields ERR_WORK_ORDER_STATE_INVALID"
  - priority: 9
    category: state
    check: "expected_sector_version equals Sector.version (concurrency_rules capacity-hold-create-stale-sector)"
    error_id: ERR_STALE_SECTOR_VERSION
    http_status: 412
    applies_to: "POST /capacity-holds"
  - priority: 9
    category: state
    check: "expected_subscriber_version equals Subscriber.version (concurrency_rules plan-change-stale-subscriber)"
    error_id: ERR_STALE_SUBSCRIBER_VERSION
    http_status: 412
    applies_to: "POST /subscribers/{id}/plan-changes"
  - priority: 10
    category: business_safety
    check: "the proposed EIRP does not exceed the licence ceiling: proposed_eirp_dbm <= SpectrumLicense.max_eirp_dbm of the requesting Sector's licence"
    error_id: ERR_EIRP_EXCEEDS_LICENSE
    http_status: 422
    applies_to: "POST /sectors, POST /interference-coordinations, POST /interference-coordinations/{id}/revisions"
  - priority: 10
    category: business_safety
    check: "the proposed channel lies wholly inside the licence: proposed lower_edge_mhz >= SpectrumLicense.lower_edge_mhz AND proposed upper_edge_mhz <= SpectrumLicense.upper_edge_mhz"
    error_id: ERR_CHANNEL_OUTSIDE_LICENSE
    http_status: 422
    applies_to: "POST /sectors, POST /interference-coordinations, POST /interference-coordinations/{id}/revisions"
  - priority: 10
    category: business_safety
    check: "the SpectrumLicense of the sector being activated or coordinated has status == ACTIVE at clock_now (effective_from <= clock_now < effective_to)"
    error_id: ERR_LICENSE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /sectors/{id}/activation, POST /interference-coordinations"
  - priority: 10
    category: business_temporal
    check: "the guard-band-inflated channel of the requesting sector's proposal does not overlap the neighbour sector's occupied channel: intervals [proposed_lower - guard_band_mhz, proposed_upper + guard_band_mhz) and [neighbour.lower_edge_mhz, neighbour.upper_edge_mhz) must be disjoint under STRICT inequality, so edges that merely touch are allowed. The check applies only when the circular azimuth separation between the two sectors is < MIN_AZIMUTH_SEPARATION_DEG (60)."
    error_id: ERR_CHANNEL_OVERLAP_GUARD_BAND
    http_status: 422
    applies_to: "POST /interference-coordinations, POST /interference-coordinations/{id}/revisions"
  - priority: 11
    category: business_safety
    check: "installed_mast_height_m does not exceed the ceiling of InstallWorkOrder.approved_mounting_type's band (WALL_BRACKET 1.0, NON_PEN_ROOF_TRIPOD 3.0, ROOF_MAST_GUYED 6.0, GROUND_POLE_MAST 12.0)"
    error_id: ERR_MAST_EXCEEDS_STRUCTURAL_LIMIT
    http_status: 422
    applies_to: "POST /install-work-orders/{id}/completion"
  - priority: 11
    category: business_safety
    check: "the work order carries a non-null approved_mounting_type before completion is accepted: because approved_mounting_type is null exactly while the work order sits in EXCEPTION_PENDING, completion on an EXCEPTION_PENDING work order returns ERR_MOUNT_EXCEPTION_REQUIRED (422) and NOT the priority-8 state error; completion from SCHEDULED, RESURVEY_REQUIRED, INSTALLED, SURVEY_FAILED or CANCELLED returns ERR_WORK_ORDER_STATE_INVALID (409)"
    error_id: ERR_MOUNT_EXCEPTION_REQUIRED
    http_status: 422
    applies_to: "POST /install-work-orders/{id}/completion"
  - priority: 11
    category: business_safety
    check: "the approved_mounting_type supplied on an exception decision is a band whose ceiling is >= InstallWorkOrder.recommended_mast_height_m"
    error_id: ERR_MOUNTING_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /install-work-orders/{id}/exception-decision"
  - priority: 12
    category: business_safety
    check: "the acting X-User-ID differs from the user who performed the preceding step of the same control: the exception approver is not the surveyor, and the credit applier is not the preparer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /install-work-orders/{id}/exception-decision, POST /outage-credits/{id}/application"
  - priority: 12
    category: business_constraint
    check: "the negotiation has not exhausted its rounds: InterferenceCoordination.round_number < MAX_COORDINATION_ROUNDS (3)"
    error_id: ERR_COORDINATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /interference-coordinations/{id}/revisions, POST /interference-coordinations/{id}/responses"
  - priority: 12
    category: business_constraint
    check: "the work order has not exhausted its resurveys: InstallWorkOrder.resurvey_count < MAX_RESURVEYS (2)"
    error_id: ERR_RESURVEY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /install-work-orders/{id}/exception-decision, POST /install-work-orders/{id}/reschedule"
  - priority: 13
    category: business_referential
    check: "interference coordination is between sectors on DIFFERENT towers: the neighbour Sector's tower_id != the requesting Sector's tower_id"
    error_id: ERR_SAME_TOWER_COORDINATION
    http_status: 422
    applies_to: "POST /interference-coordinations"
  - priority: 13
    category: business_referential
    check: "the ServicePlan is compatible with the subscriber's equipment choice: equipment_mode == RENTAL requires equipment_policy IN {RENTAL_ONLY, RENTAL_OR_PURCHASE}, equipment_mode == PURCHASE requires equipment_policy IN {PURCHASE_ONLY, RENTAL_OR_PURCHASE}; and on POST /subscribers the service_plan_id must equal the qualified request's requested_plan_id"
    error_id: ERR_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /subscribers, POST /subscribers/{id}/plan-changes"
  - priority: 13
    category: business_referential
    check: "the credited Subscriber is served by a Sector whose tower_id equals OutageEvent.tower_id"
    error_id: ERR_SUBSCRIBER_NOT_AFFECTED
    http_status: 422
    applies_to: "POST /outage-credits"
  - priority: 13
    category: business_referential
    check: "the subscriber has no InstallWorkOrder in status IN {SCHEDULED, EXCEPTION_PENDING, RESURVEY_REQUIRED, MOUNT_APPROVED}"
    error_id: ERR_WORK_ORDER_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /install-work-orders"
  - priority: 14
    category: business_constraint
    check: "site_code is unique across all Towers"
    error_id: ERR_DUPLICATE_SITE_CODE
    http_status: 409
    applies_to: "POST /towers"
  - priority: 14
    category: business_constraint
    check: "circuit_ref is unique across all BackhaulCircuits"
    error_id: ERR_DUPLICATE_CIRCUIT_REF
    http_status: 409
    applies_to: "POST /backhaul-circuits"
  - priority: 14
    category: business_constraint
    check: "license_ref is unique across all SpectrumLicenses"
    error_id: ERR_DUPLICATE_LICENSE_REF
    http_status: 409
    applies_to: "POST /spectrum-licenses"
  - priority: 14
    category: business_constraint
    check: "tier_code is unique across all ServicePlans"
    error_id: ERR_DUPLICATE_TIER_CODE
    http_status: 409
    applies_to: "POST /service-plans"
  - priority: 14
    category: business_constraint
    check: "(subscriber_id, usage_date) is unique across UsageRecord rows"
    error_id: ERR_DUPLICATE_USAGE_RECORD
    http_status: 409
    applies_to: "POST /subscribers/{id}/usage-records"
  - priority: 14
    category: business_constraint
    check: "(outage_event_id, subscriber_id) has no existing OutageCredit in status IN {PENDING, APPLIED}"
    error_id: ERR_CREDIT_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /outage-credits"
  - priority: 15
    category: business_temporal
    check: "the outage interval is well formed: ended_at > started_at"
    error_id: ERR_INTERVAL_INVALID
    http_status: 409
    applies_to: "POST /outage-events/{id}/closure"
  - priority: 15
    category: business_temporal
    check: "the closed interval [started_at, ended_at) shares no minute with any other CLOSED OutageEvent on the same Tower; intervals that merely abut (one ends exactly when the next starts) are accepted"
    error_id: ERR_OUTAGE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /outage-events/{id}/closure"
  - priority: 15
    category: business_temporal
    check: "usage_date falls inside the subscriber's current cycle window [cycle_start_date, cycle_start_date + CYCLE_DAYS)"
    error_id: ERR_USAGE_DATE_OUT_OF_CYCLE
    http_status: 409
    applies_to: "POST /subscribers/{id}/usage-records"
  - priority: 15
    category: business_temporal
    check: "the return window has closed before an unreturned settlement may be billed: clock_now >= EquipmentAssignment.return_due_at"
    error_id: ERR_RETURN_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /equipment-assignments/{id}/unreturned-settlement"
  - priority: 15
    category: business_referential
    check: "the tower has at least one BackhaulCircuit in state ACCEPTED before it may become ACTIVE"
    error_id: ERR_BACKHAUL_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /towers/{id}/status-changes"
  - priority: 15
    category: business_referential
    check: "no Subscriber on any Sector of the tower is in service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED} before the tower may be decommissioned"
    error_id: ERR_TOWER_HAS_ACTIVE_SUBSCRIBERS
    http_status: 409
    applies_to: "POST /towers/{id}/status-changes"
  - priority: 16
    category: business_fiscal
    check: "the qualified Sector's capacity_posture is not HOLD: a sector at or above 75% of its oversubscription ceiling accepts no new reservations"
    error_id: ERR_SECTOR_CAPACITY_HOLD
    http_status: 409
    applies_to: "POST /capacity-holds"
  - priority: 16
    category: business_fiscal
    check: "the qualified Sector's capacity_posture is not FROZEN: a sector at its ceiling, disabled, or whose tower has no ACCEPTED backhaul accepts no reservations at all"
    error_id: ERR_SECTOR_FROZEN
    http_status: 409
    applies_to: "POST /capacity-holds"
  - priority: 16
    category: business_fiscal
    check: "remaining_allowance(Sector) = floor(capacity_mbps * max_oversubscription_ratio) - committed_mbps is >= the plan's downstream_mbps being reserved or upgraded to"
    error_id: ERR_INSUFFICIENT_SECTOR_CAPACITY
    http_status: 409
    applies_to: "POST /capacity-holds, POST /subscribers/{id}/plan-changes"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock to an arbitrary instant. The logical clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline, expiry, anniversary and cycle-window rule is evaluated against that fixed default and never against real wall-clock time."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, FieldTech, BillingAdmin, FinanceApprover]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "advances or rewinds the logical clock used by every computed datetime, expiry sweep and lease anniversary count"

  - method: POST
    path: "/towers"
    description: "Register a tower site with its ground-lease terms."
    roles: [NetworkEngineer]
    code: 201
    input: [site_code, latitude, longitude, ground_elevation_m, antenna_agl_m, lease_landowner_name, lease_monthly_base_rent_cents, lease_escalator_pct, lease_start_date, lease_term_months]
    output: Tower
    side_effects:
      - "status = PLANNED, active_sector_count = 0, backhaul_accepted_mbps = 0"
      - "compute current_monthly_rent_cents (calculation tower_lease_escalation)"
  - method: GET
    path: "/towers/{id}"
    description: "Read one tower with its derived lease, sector and backhaul roll-ups."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, FieldTech, BillingAdmin, FinanceApprover]
    code: 200
    input: []
    output: Tower
    side_effects: []
  - method: POST
    path: "/towers/{id}/status-changes"
    description: "Move a tower through PLANNED -> ACTIVE -> MAINTENANCE -> DECOMMISSIONED."
    roles: [NetworkEngineer]
    code: 200
    input: ["to_status", "reason?"]
    output: Tower
    side_effects:
      - "applies the §1.2 Tower transition and its cascade (sector disable, hold release, request expiry)"
      - "recompute Tower.backhaul_accepted_mbps and active_sector_count"
      - "recompute capacity_posture on every Sector of the tower"
      - "increments Tower.version by 1"
  - method: GET
    path: "/towers/{id}/lease-schedule"
    description: "Computed read of the ground-lease escalation schedule for this tower at the current logical clock."
    roles: [NetworkEngineer, BillingAdmin, FinanceApprover]
    code: 200
    input: []
    output: "{ tower_id: string, years_elapsed: integer, current_monthly_rent_cents: integer, next_anniversary_date: string, total_committed_cents: integer }"
    side_effects: []
  - method: GET
    path: "/towers/{id}/backhaul-circuits"
    description: "List the backhaul circuits ordered for this tower."
    roles: [NetworkEngineer, CapacityPlanner, BillingAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: BackhaulCircuit[]
    side_effects: []
  - method: GET
    path: "/towers/{id}/outage-events"
    description: "List the outage events recorded against this tower."
    roles: [NetworkEngineer, CapacityPlanner, BillingAdmin, FinanceApprover]
    code: 200
    input: ["status?", "cause?", "limit?", "offset?"]
    output: OutageEvent[]
    side_effects: []

  - method: POST
    path: "/backhaul-circuits"
    description: "Order a transport circuit for a tower."
    roles: [NetworkEngineer]
    code: 201
    input: [tower_id, carrier_name, circuit_ref, committed_mbps, monthly_cost_cents]
    output: BackhaulCircuit
    side_effects:
      - "state = ORDERED"
  - method: GET
    path: "/backhaul-circuits/{id}"
    description: "Read one backhaul circuit."
    roles: [NetworkEngineer, CapacityPlanner, BillingAdmin]
    code: 200
    input: []
    output: BackhaulCircuit
    side_effects: []
  - method: POST
    path: "/backhaul-circuits/{id}/state-changes"
    description: "Advance a circuit through ORDERED -> INSTALLED -> ACCEPTED, degrade it, restore it, or cancel it."
    roles: [NetworkEngineer]
    code: 200
    input: ["to_state", "measured_mbps?", "note?"]
    output: BackhaulCircuit
    side_effects:
      - "applies the §1.2 BackhaulCircuit transition"
      - "recompute Tower.backhaul_accepted_mbps"
      - "recompute capacity_posture on every Sector of the tower (calculation sector_capacity_posture)"
      - "on DEGRADED, cascade chain X: sector posture -> FROZEN, HELD CapacityHolds -> RELEASED with release_reason BACKHAUL_DEGRADED, their ServiceabilityRequests -> EXPIRED"
      - "increments BackhaulCircuit.version by 1"

  - method: POST
    path: "/spectrum-licenses"
    description: "Record a spectrum licence and its channel envelope."
    roles: [NetworkEngineer]
    code: 201
    input: [license_ref, band, channel_center_mhz, channel_width_mhz, max_eirp_dbm, license_area_code, effective_from, effective_to]
    output: SpectrumLicense
    side_effects:
      - "compute lower_edge_mhz, upper_edge_mhz and the clock-derived status"
  - method: GET
    path: "/spectrum-licenses/{id}"
    description: "Read one spectrum licence with its computed edges and clock-derived status."
    roles: [NetworkEngineer, CapacityPlanner]
    code: 200
    input: []
    output: SpectrumLicense
    side_effects: []

  - method: POST
    path: "/sectors"
    description: "Create a tower sector bound to a spectrum licence."
    roles: [NetworkEngineer]
    code: 201
    input: ["tower_id", "spectrum_license_id", "azimuth_deg", "beamwidth_deg", "channel_center_mhz", "channel_width_mhz", "tx_power_dbm", "antenna_gain_dbi", "capacity_mbps", "max_oversubscription_ratio?"]
    output: Sector
    side_effects:
      - "status = PLANNED, sold_mbps = 0, held_mbps = 0, committed_mbps = 0"
      - "compute eirp_dbm, lower_edge_mhz, upper_edge_mhz"
      - "compute capacity_posture (calculation sector_capacity_posture)"
  - method: GET
    path: "/sectors/{id}"
    description: "Read one sector with its live capacity roll-ups and posture."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, FieldTech, BillingAdmin, FinanceApprover]
    code: 200
    input: []
    output: Sector
    side_effects: []
  - method: GET
    path: "/sectors"
    description: "List sectors filtered by tower, licence, posture or status."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent]
    code: 200
    input: ["tower_id?", "spectrum_license_id?", "capacity_posture?", "status?", "limit?", "offset?"]
    output: Sector[]
    side_effects: []
  - method: POST
    path: "/sectors/{id}/activation"
    description: "Bring a PLANNED sector on air."
    roles: [NetworkEngineer]
    code: 200
    input: []
    output: Sector
    side_effects:
      - "status = ACTIVE"
      - "recompute Tower.active_sector_count"
      - "recompute Sector.capacity_posture"
      - "increments Sector.version by 1"
  - method: POST
    path: "/sectors/{id}/capacity-policy"
    description: "Change a sector's oversubscription ceiling, which immediately re-derives its posture against the existing commitments."
    roles: [CapacityPlanner]
    code: 200
    input: [max_oversubscription_ratio, justification]
    output: Sector
    side_effects:
      - "set max_oversubscription_ratio and capacity_policy_note = justification"
      - "recompute oversubscription_ratio and capacity_posture (calculation sector_capacity_posture)"
      - "when the recomputed posture leaves {HOLD, FROZEN}, promote the first CAPACITY_DEFERRED ServiceabilityRequest on the tower ordered by created_at ASC, intake_sequence ASC"
      - "increments Sector.version by 1"
  - method: GET
    path: "/sectors/{id}/interference-coordinations"
    description: "List the coordination records in which this sector is the requester."
    roles: [NetworkEngineer, CapacityPlanner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InterferenceCoordination[]
    side_effects: []

  - method: POST
    path: "/interference-coordinations"
    description: "Open a channel/EIRP coordination request from one tower's sector to a neighbouring tower's sector."
    roles: [NetworkEngineer]
    code: 201
    input: [requesting_sector_id, neighbor_sector_id, proposed_channel_center_mhz, proposed_channel_width_mhz, proposed_eirp_dbm, guard_band_mhz, effective_from]
    output: InterferenceCoordination
    side_effects:
      - "status = REQUESTED, round_number = 1"
  - method: GET
    path: "/interference-coordinations/{id}"
    description: "Read one coordination record."
    roles: [NetworkEngineer, CapacityPlanner]
    code: 200
    input: []
    output: InterferenceCoordination
    side_effects: []
  - method: GET
    path: "/interference-coordinations"
    description: "List coordination records by requesting sector, neighbour sector or status."
    roles: [NetworkEngineer, CapacityPlanner]
    code: 200
    input: ["requesting_sector_id?", "neighbor_sector_id?", "status?", "limit?", "offset?"]
    output: InterferenceCoordination[]
    side_effects: []
  - method: POST
    path: "/interference-coordinations/{id}/responses"
    description: "The neighbouring operator accepts, rejects, requests a revision, or the requester withdraws."
    roles: [NetworkEngineer]
    code: 200
    input: ["decision", "revised_channel_center_mhz?", "revised_eirp_dbm?", "note?"]
    output: InterferenceCoordination
    side_effects:
      - "applies the §1.2 InterferenceCoordination transition; on ACCEPT the requesting Sector's channel_center_mhz, channel_width_mhz and tx_power_dbm are overwritten from the proposal and its edges and eirp_dbm are recomputed"
      - "set last_response_at = clock_now and decided_by_user_id = X-User-ID"
      - "increments InterferenceCoordination.version by 1"
  - method: POST
    path: "/interference-coordinations/{id}/revisions"
    description: "The requester submits a revised proposal, opening another negotiation round."
    roles: [NetworkEngineer]
    code: 200
    input: [proposed_channel_center_mhz, proposed_channel_width_mhz, proposed_eirp_dbm, guard_band_mhz]
    output: InterferenceCoordination
    side_effects:
      - "overwrite the proposal fields, round_number += 1, status = REQUESTED"
      - "increments InterferenceCoordination.version by 1"

  - method: POST
    path: "/service-plans"
    description: "Publish a data plan with its soft cap, deprioritization factor, SLA target and equipment policy."
    roles: [CapacityPlanner]
    code: 201
    input: [tier_code, downstream_mbps, upstream_mbps, monthly_price_cents, soft_cap_gb, deprioritization_factor, sla_uptime_pct, sla_credit_method, equipment_policy]
    output: ServicePlan
    side_effects: []
  - method: GET
    path: "/service-plans/{id}"
    description: "Read one service plan."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, BillingAdmin, FinanceApprover]
    code: 200
    input: []
    output: ServicePlan
    side_effects: []

  - method: POST
    path: "/serviceability-requests"
    description: "Qualify a premise against a candidate tower: runs the desktop line-of-sight study and the sector selector, then lands the request in QUALIFIED, CAPACITY_DEFERRED or DENIED inside this one call."
    roles: [SalesAgent]
    code: 201
    input: [candidate_tower_id, requested_plan_id, contact_name, premise_latitude, premise_longitude, premise_ground_elevation_m, roof_height_m, declared_tree_line_height_m, obstruction_class, path_distance_km]
    output: ServiceabilityRequest
    side_effects:
      - "assign intake_sequence as the next monotonic integer"
      - "compute desktop_los_margin_m, desktop_required_mast_height_m, desktop_mounting_type (calculation los_qualification_mast_height variant DESKTOP_LIDAR)"
      - "run calculation sector_selection and set qualified_sector_id, status, denial_reason and qualification_expires_at"
  - method: GET
    path: "/serviceability-requests/{id}"
    description: "Read one qualification with its desktop study outputs."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, FieldTech]
    code: 200
    input: []
    output: ServiceabilityRequest
    side_effects: []
  - method: GET
    path: "/serviceability-requests"
    description: "List qualifications by candidate tower, qualified sector, requested plan or status."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent]
    code: 200
    input: ["candidate_tower_id?", "qualified_sector_id?", "requested_plan_id?", "status?", "limit?", "offset?"]
    output: ServiceabilityRequest[]
    side_effects: []

  - method: POST
    path: "/capacity-holds"
    description: "Reserve the qualified plan's downstream bandwidth on the qualified sector. Carries expected_sector_version so a caller working from a stale view of the sector's allowance is rejected."
    roles: [SalesAgent, CapacityPlanner]
    code: 201
    input: ["serviceability_request_id", "expected_sector_version", "hold_days?"]
    output: CapacityHold
    side_effects:
      - "sector_id and held_mbps are copied from the request and its plan; origin = DIRECT; status = HELD"
      - "expires_at = clock_now + hold_days days"
      - "Sector.held_mbps += held_mbps, then recompute committed_mbps, oversubscription_ratio and capacity_posture"
      - "increments Sector.version by 1"
  - method: GET
    path: "/capacity-holds/{id}"
    description: "Read one capacity hold."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent]
    code: 200
    input: []
    output: CapacityHold
    side_effects: []
  - method: GET
    path: "/capacity-holds"
    description: "List capacity holds by sector, qualification or status."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent]
    code: 200
    input: ["sector_id?", "serviceability_request_id?", "status?", "origin?", "limit?", "offset?"]
    output: CapacityHold[]
    side_effects: []
  - method: POST
    path: "/capacity-holds/{id}/release"
    description: "Give a reservation back to the sector."
    roles: [CapacityPlanner]
    code: 200
    input: ["note?"]
    output: CapacityHold
    side_effects:
      - "status = RELEASED, release_reason = MANUAL"
      - "Sector.held_mbps -= held_mbps, then recompute committed_mbps, oversubscription_ratio and capacity_posture"
      - "the linked ServiceabilityRequest transitions QUALIFIED -> EXPIRED"
      - "increments Sector.version by 1 and CapacityHold.version by 1"

  - method: POST
    path: "/subscribers"
    description: "Convert a qualified request into an account: consumes the capacity hold, converts held bandwidth into sold bandwidth, and mints the CPE assignment."
    roles: [SalesAgent]
    code: 201
    input: [serviceability_request_id, service_plan_id, billing_email, equipment_mode]
    output: Subscriber
    side_effects:
      - "account_number assigned as the next sequential RB-###### value; service_status = PENDING_INSTALL; usage_priority = STANDARD"
      - "sector_id copied from ServiceabilityRequest.qualified_sector_id"
      - "the ServiceabilityRequest transitions QUALIFIED -> CONSUMED and its CapacityHold HELD -> CONSUMED"
      - "Sector.held_mbps -= hold.held_mbps and Sector.sold_mbps += hold.held_mbps, leaving sold_mbps + held_mbps unchanged, then recompute committed_mbps, oversubscription_ratio and capacity_posture"
      - "create one EquipmentAssignment with status = ASSIGNED, acquisition_mode = equipment_mode, monthly_rental_cents / purchase_price_cents set from the mode, replacement_cost_cents = 34900 (discoverable only via GET /subscribers/{id}/equipment-assignments)"
      - "increments Sector.version by 1"
  - method: GET
    path: "/subscribers/{id}"
    description: "Read one account with its usage, credit and settlement roll-ups."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, FieldTech, BillingAdmin, FinanceApprover, Subscriber]
    code: 200
    input: []
    output: Subscriber
    side_effects: []
  - method: GET
    path: "/subscribers"
    description: "List accounts by sector, qualification, plan, service status or usage priority."
    roles: [NetworkEngineer, CapacityPlanner, SalesAgent, BillingAdmin, FinanceApprover]
    code: 200
    input: ["sector_id?", "serviceability_request_id?", "service_plan_id?", "service_status?", "usage_priority?", "limit?", "offset?"]
    output: Subscriber[]
    side_effects: []
  - method: POST
    path: "/subscribers/{id}/plan-changes"
    description: "Move an account to a different plan. Carries expected_subscriber_version because a plan change legitimately supersedes the previous plan and re-derives the sector allowance the account occupies."
    roles: [SalesAgent, BillingAdmin]
    code: 200
    input: [service_plan_id, expected_subscriber_version]
    output: Subscriber
    side_effects:
      - "set service_plan_id"
      - "Sector.sold_mbps adjusts by the difference in downstream_mbps, then recompute committed_mbps, oversubscription_ratio and capacity_posture"
      - "recompute cycle_usage_gb, usage_priority and effective_downstream_mbps against the new plan's soft_cap_gb and deprioritization_factor"
      - "increments Subscriber.version by 1 and Sector.version by 1"
  - method: POST
    path: "/subscribers/{id}/status-changes"
    description: "Suspend, restore or cancel an account."
    roles: [BillingAdmin]
    code: 200
    input: [to_status, reason]
    output: Subscriber
    side_effects:
      - "applies the §1.2 Subscriber service_status transition"
      - "on CANCELLED, cascade chain Y: Sector.sold_mbps drops and posture is recomputed, the oldest CAPACITY_DEFERRED ServiceabilityRequest on the tower is promoted to QUALIFIED with an AUTO_PROMOTION CapacityHold, and that new hold raises held_mbps so posture is recomputed again"
      - "on CANCELLED, the EquipmentAssignment moves DEPLOYED -> RETURN_PENDING (or ASSIGNED -> VOIDED) and open InstallWorkOrders are CANCELLED"
      - "increments Subscriber.version by 1"
  - method: POST
    path: "/subscribers/{id}/usage-records"
    description: "Ingest one day of metered traffic and re-derive the deprioritization posture."
    roles: [BillingAdmin]
    code: 201
    input: [usage_date, downstream_gb, upstream_gb]
    output: UsageRecord
    side_effects:
      - "assign ingest_sequence as the next monotonic integer and compute total_gb and in_current_cycle"
      - "recompute Subscriber.cycle_usage_gb, usage_priority, effective_downstream_mbps and deprioritized_at (calculation usage_cycle_deprioritization)"
      - "increments Subscriber.version by 1"
  - method: GET
    path: "/subscribers/{id}/usage-records"
    description: "List the metered days of an account."
    roles: [BillingAdmin, FinanceApprover, CapacityPlanner, Subscriber]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []
  - method: POST
    path: "/subscribers/{id}/cycle-close"
    description: "Close the current usage cycle, roll the breach counter, and open the next 30-day window."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Subscriber
    side_effects:
      - "consecutive_breach_cycles and sticky_deprioritization_active are rolled per calculation usage_cycle_deprioritization"
      - "cycle_start_date advances by 30 days and cycle_usage_gb, usage_priority and effective_downstream_mbps are recomputed over the new window"
      - "increments Subscriber.version by 1"
  - method: GET
    path: "/subscribers/{id}/install-work-orders"
    description: "List the install work orders of an account."
    roles: [NetworkEngineer, SalesAgent, FieldTech, BillingAdmin, Subscriber]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InstallWorkOrder[]
    side_effects: []
  - method: GET
    path: "/subscribers/{id}/equipment-assignments"
    description: "List the CPE assignments of an account. This is the only discovery channel for the assignment minted as a side effect of POST /subscribers."
    roles: [NetworkEngineer, FieldTech, BillingAdmin, FinanceApprover, Subscriber]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentAssignment[]
    side_effects: []

  - method: POST
    path: "/install-work-orders"
    description: "Schedule a survey-and-install truck roll. Accepted for any Subscriber whose service_status is in {PENDING_INSTALL, ACTIVE, SUSPENDED} so that re-visits on a live account are possible; a CANCELLED account is refused with ERR_SUBSCRIBER_NOT_ACTIVE. Only the MOUNT_APPROVED -> INSTALLED completion requires service_status == PENDING_INSTALL, so a re-visit work order on an ACTIVE account can be surveyed and approved but never completed."
    roles: [FieldTech, SalesAgent]
    code: 201
    input: [subscriber_id, scheduled_at]
    output: InstallWorkOrder
    side_effects:
      - "status = SCHEDULED, resurvey_count = 0"
  - method: GET
    path: "/install-work-orders/{id}"
    description: "Read one install work order with its survey outputs and invoice total."
    roles: [NetworkEngineer, SalesAgent, FieldTech, BillingAdmin]
    code: 200
    input: []
    output: InstallWorkOrder
    side_effects: []
  - method: POST
    path: "/install-work-orders/{id}/survey"
    description: "Record the on-site measurements. Runs the FIELD_SURVEY variant of the line-of-sight calculation and fans out into MOUNT_APPROVED, EXCEPTION_PENDING, RESURVEY_REQUIRED or SURVEY_FAILED."
    roles: [FieldTech]
    code: 200
    input: ["measured_tree_line_height_m", "measured_roof_height_m", "structure_penetration_allowed", "note?"]
    output: InstallWorkOrder
    side_effects:
      - "compute field_los_margin_m, recommended_mast_height_m, recommended_mounting_type (calculation los_qualification_mast_height variant FIELD_SURVEY)"
      - "set surveyed_by_user_id = X-User-ID and select the branch target state"
      - "on the RESURVEY_REQUIRED branch, resurvey_count += 1"
      - "increments InstallWorkOrder.version by 1"
  - method: POST
    path: "/install-work-orders/{id}/exception-decision"
    description: "A network engineer approves, downgrades, rejects or sends back a tall-mast mounting exception. The approver may not be the surveyor."
    roles: [NetworkEngineer]
    code: 200
    input: ["decision", "approved_mounting_type?", "note"]
    output: InstallWorkOrder
    side_effects:
      - "on APPROVE, set approved_mounting_type and exception_approved_by_user_id = X-User-ID"
      - "on REQUEST_RESURVEY, resurvey_count += 1 and the survey outputs are cleared"
      - "increments InstallWorkOrder.version by 1"
  - method: POST
    path: "/install-work-orders/{id}/reschedule"
    description: "Book a new truck roll after a resurvey was demanded."
    roles: [FieldTech]
    code: 200
    input: [scheduled_at]
    output: InstallWorkOrder
    side_effects:
      - "status = SCHEDULED and scheduled_at is replaced"
      - "increments InstallWorkOrder.version by 1"
  - method: POST
    path: "/install-work-orders/{id}/completion"
    description: "Close out the install: prices the invoice, activates the account and deploys the CPE."
    roles: [FieldTech]
    code: 200
    input: [installed_mast_height_m, radio_serial]
    output: InstallWorkOrder
    side_effects:
      - "compute install_invoice_total_cents (calculation install_invoice_total) and set installed_at = clock_now"
      - "cascade chain Z: the Subscriber transitions PENDING_INSTALL -> ACTIVE, which moves its EquipmentAssignment ASSIGNED -> DEPLOYED, which sets Subscriber.equipment_monthly_charge_cents"
      - "Subscriber.cycle_start_date is set to the calendar date of clock_now"
      - "increments InstallWorkOrder.version by 1 and Subscriber.version by 1"

  - method: GET
    path: "/equipment-assignments/{id}"
    description: "Read one CPE assignment with its settlement outcome."
    roles: [NetworkEngineer, FieldTech, BillingAdmin, FinanceApprover]
    code: 200
    input: []
    output: EquipmentAssignment
    side_effects: []
  - method: POST
    path: "/equipment-assignments/{id}/return"
    description: "Book a returned radio and settle it (rental damage charge or purchase depreciated refund)."
    roles: [FieldTech]
    code: 200
    input: [return_condition]
    output: EquipmentAssignment
    side_effects:
      - "status = RETURNED, returned_at = clock_now"
      - "compute months_in_service, settlement_cents and settlement_basis (calculation equipment_settlement)"
      - "recompute Subscriber.settlement_balance_cents"
      - "increments EquipmentAssignment.version by 1"
  - method: POST
    path: "/equipment-assignments/{id}/unreturned-settlement"
    description: "Bill an unreturned radio once the return window has closed."
    roles: [BillingAdmin]
    code: 200
    input: ["note?"]
    output: EquipmentAssignment
    side_effects:
      - "status = UNRETURNED_BILLED"
      - "compute months_in_service, settlement_cents and settlement_basis (calculation equipment_settlement)"
      - "recompute Subscriber.settlement_balance_cents"
      - "increments EquipmentAssignment.version by 1"

  - method: POST
    path: "/outage-events"
    description: "Open an outage record against a tower."
    roles: [NetworkEngineer]
    code: 201
    input: ["tower_id", "cause", "started_at", "planned_notice_days?"]
    output: OutageEvent
    side_effects:
      - "status = OPEN, sla_excluded = false, total_credited_cents = 0"
  - method: GET
    path: "/outage-events/{id}"
    description: "Read one outage event with its duration, exclusion flag and credited total."
    roles: [NetworkEngineer, CapacityPlanner, BillingAdmin, FinanceApprover]
    code: 200
    input: []
    output: OutageEvent
    side_effects: []
  - method: POST
    path: "/outage-events/{id}/closure"
    description: "Close an outage, fixing its duration and whether it is an SLA exception."
    roles: [NetworkEngineer]
    code: 200
    input: ["ended_at", "peak_wind_mph?"]
    output: OutageEvent
    side_effects:
      - "status = CLOSED, ended_at and peak_wind_mph recorded"
      - "compute duration_minutes and sla_excluded"
      - "increments OutageEvent.version by 1"

  - method: POST
    path: "/outage-credits"
    description: "Prepare an SLA credit for one affected subscriber. The plan's sla_credit_method selects the calculation variant, and the row is created PENDING or already DENIED."
    roles: [BillingAdmin]
    code: 201
    input: [outage_event_id, subscriber_id]
    output: OutageCredit
    side_effects:
      - "set method from the subscriber's plan and prepared_by_user_id = X-User-ID"
      - "compute cycle_outage_minutes, measured_uptime_pct, shortfall_pct, prior_cycle_credited_cents, credit_cents (calculation outage_credit_amount)"
      - "status = PENDING when credit_cents > 0, otherwise DENIED with denial_reason"
  - method: GET
    path: "/outage-credits/{id}"
    description: "Read one SLA credit with its full derivation."
    roles: [BillingAdmin, FinanceApprover, CapacityPlanner]
    code: 200
    input: []
    output: OutageCredit
    side_effects: []
  - method: GET
    path: "/outage-credits"
    description: "List SLA credits by subscriber, outage or status."
    roles: [BillingAdmin, FinanceApprover, CapacityPlanner, Subscriber]
    code: 200
    input: ["subscriber_id?", "outage_event_id?", "status?", "limit?", "offset?"]
    output: OutageCredit[]
    side_effects: []
  - method: POST
    path: "/outage-credits/{id}/application"
    description: "Apply a prepared credit to the account. The approver may not be the preparer."
    roles: [FinanceApprover]
    code: 200
    input: ["note?"]
    output: OutageCredit
    side_effects:
      - "status = APPLIED, approved_by_user_id = X-User-ID"
      - "Subscriber.credit_balance_cents += credit_cents and OutageEvent.total_credited_cents += credit_cents"
      - "increments OutageCredit.version by 1"
  - method: POST
    path: "/outage-credits/{id}/reversal"
    description: "Reverse an applied credit, restoring both money roll-ups to their pre-application values."
    roles: [FinanceApprover]
    code: 200
    input: [reversal_reason]
    output: OutageCredit
    side_effects:
      - "status = REVERSED, reversal_reason recorded"
      - "Subscriber.credit_balance_cents -= credit_cents and OutageEvent.total_credited_cents -= credit_cents"
      - "increments OutageCredit.version by 1"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "X-User-Role is Subscriber and X-User-ID is not the id of the addressed account"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required body field, wrong type, undeclared enum member, out-of-range number, or measured_mbps omitted on a circuit state change to ACCEPTED"
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit < 1, limit > 100, or offset < 0 on a list endpoint"
  - id: ERR_TOWER_NOT_FOUND
    http: 404
    condition: "no Tower with the given id"
  - id: ERR_CIRCUIT_NOT_FOUND
    http: 404
    condition: "no BackhaulCircuit with the given id"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "no SpectrumLicense with the given id"
  - id: ERR_SECTOR_NOT_FOUND
    http: 404
    condition: "no Sector with the given id"
  - id: ERR_COORDINATION_NOT_FOUND
    http: 404
    condition: "no InterferenceCoordination with the given id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no ServicePlan with the given id"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "no ServiceabilityRequest with the given id"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "no CapacityHold with the given id"
  - id: ERR_SUBSCRIBER_NOT_FOUND
    http: 404
    condition: "no Subscriber with the given id"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "no InstallWorkOrder with the given id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no EquipmentAssignment with the given id"
  - id: ERR_OUTAGE_NOT_FOUND
    http: 404
    condition: "no OutageEvent with the given id"
  - id: ERR_CREDIT_NOT_FOUND
    http: 404
    condition: "no OutageCredit with the given id"
  - id: ERR_INVALID_TOWER_STATE
    http: 409
    condition: "the requested Tower status change is not a declared transition from the tower's current status, or a sector activation names a Tower whose status != ACTIVE"
  - id: ERR_INVALID_CIRCUIT_STATE
    http: 409
    condition: "the requested BackhaulCircuit state change is not a declared transition from the circuit's current state"
  - id: ERR_INVALID_SECTOR_STATE
    http: 409
    condition: "activation of a Sector whose status != PLANNED, or a capacity operation on a Sector whose status == DISABLED"
  - id: ERR_COORDINATION_NOT_OPEN
    http: 409
    condition: "a response is posted to a coordination whose status is not REQUESTED (or not in {REQUESTED, REVISION_REQUESTED} for WITHDRAW), or a revision is posted to a coordination whose status != REVISION_REQUESTED"
  - id: ERR_REQUEST_NOT_QUALIFIED
    http: 409
    condition: "a capacity hold or subscriber creation names a ServiceabilityRequest whose status is not QUALIFIED"
  - id: ERR_QUALIFICATION_EXPIRED
    http: 409
    condition: "clock_now >= ServiceabilityRequest.qualification_expires_at on a capacity hold or subscriber creation"
  - id: ERR_HOLD_NOT_HELD
    http: 409
    condition: "a release targets a CapacityHold whose status != HELD, or a subscriber creation finds no HELD hold for the qualification"
  - id: ERR_SUBSCRIBER_NOT_ACTIVE
    http: 409
    condition: "the requested Subscriber service_status change is not a declared transition, or an install completion targets an account whose service_status != PENDING_INSTALL, or a work-order creation targets a CANCELLED account"
  - id: ERR_WORK_ORDER_STATE_INVALID
    http: 409
    condition: "survey, exception decision, reschedule or completion is called on an InstallWorkOrder whose status does not permit that transition; the one exception is completion on an EXCEPTION_PENDING work order, which is refused with ERR_MOUNT_EXCEPTION_REQUIRED instead"
  - id: ERR_ASSIGNMENT_NOT_RETURNABLE
    http: 409
    condition: "a return or unreturned settlement targets an EquipmentAssignment whose status != RETURN_PENDING"
  - id: ERR_OUTAGE_ALREADY_CLOSED
    http: 409
    condition: "closure is called on an OutageEvent whose status == CLOSED"
  - id: ERR_OUTAGE_NOT_CLOSED
    http: 409
    condition: "a credit is prepared against an OutageEvent whose status == OPEN"
  - id: ERR_CREDIT_NOT_PENDING
    http: 409
    condition: "application is called on an OutageCredit whose status != PENDING"
  - id: ERR_CREDIT_NOT_APPLIED
    http: 409
    condition: "reversal is called on an OutageCredit whose status != APPLIED"
  - id: ERR_STALE_SECTOR_VERSION
    http: 412
    condition: "expected_sector_version != Sector.version on POST /capacity-holds (concurrency_rules capacity-hold-create-stale-sector)"
  - id: ERR_STALE_SUBSCRIBER_VERSION
    http: 412
    condition: "expected_subscriber_version != Subscriber.version on POST /subscribers/{id}/plan-changes (concurrency_rules plan-change-stale-subscriber)"
  - id: ERR_EIRP_EXCEEDS_LICENSE
    http: 422
    condition: "a sector's eirp_dbm or a coordination's proposed_eirp_dbm exceeds the licence's max_eirp_dbm"
  - id: ERR_CHANNEL_OUTSIDE_LICENSE
    http: 422
    condition: "the channel edges fall outside [SpectrumLicense.lower_edge_mhz, SpectrumLicense.upper_edge_mhz]"
  - id: ERR_CHANNEL_OVERLAP_GUARD_BAND
    http: 422
    condition: "the guard-band-inflated proposed channel overlaps the neighbour sector's occupied channel while the two azimuths are within MIN_AZIMUTH_SEPARATION_DEG of each other"
  - id: ERR_LICENSE_NOT_EFFECTIVE
    http: 422
    condition: "the SpectrumLicense's clock-derived status is PENDING or EXPIRED when a sector activation or coordination requires it to be ACTIVE"
  - id: ERR_MAST_EXCEEDS_STRUCTURAL_LIMIT
    http: 422
    condition: "installed_mast_height_m exceeds the ceiling of the approved mounting band"
  - id: ERR_MOUNT_EXCEPTION_REQUIRED
    http: 422
    condition: "completion is attempted while InstallWorkOrder.approved_mounting_type is null, i.e. on a work order still in status EXCEPTION_PENDING awaiting a NetworkEngineer decision"
  - id: ERR_MOUNTING_INCOMPATIBLE
    http: 422
    condition: "the approved_mounting_type supplied on an exception decision has a band ceiling below recommended_mast_height_m"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the exception approver equals InstallWorkOrder.surveyed_by_user_id, or the credit applier equals OutageCredit.prepared_by_user_id"
  - id: ERR_RESURVEY_LIMIT_REACHED
    http: 409
    condition: "InstallWorkOrder.resurvey_count has reached MAX_RESURVEYS (2)"
  - id: ERR_COORDINATION_ROUND_LIMIT
    http: 409
    condition: "InterferenceCoordination.round_number has reached MAX_COORDINATION_ROUNDS (3)"
  - id: ERR_SAME_TOWER_COORDINATION
    http: 422
    condition: "the requesting and neighbour Sectors share the same tower_id"
  - id: ERR_PLAN_MISMATCH
    http: 422
    condition: "equipment_mode is not permitted by the plan's equipment_policy, or POST /subscribers names a service_plan_id different from the qualified request's requested_plan_id"
  - id: ERR_SUBSCRIBER_NOT_AFFECTED
    http: 422
    condition: "the credited subscriber's sector belongs to a tower other than OutageEvent.tower_id"
  - id: ERR_WORK_ORDER_ALREADY_OPEN
    http: 409
    condition: "the subscriber already has an InstallWorkOrder in status IN {SCHEDULED, EXCEPTION_PENDING, RESURVEY_REQUIRED, MOUNT_APPROVED}"
  - id: ERR_DUPLICATE_SITE_CODE
    http: 409
    condition: "another Tower already uses the site_code"
  - id: ERR_DUPLICATE_CIRCUIT_REF
    http: 409
    condition: "another BackhaulCircuit already uses the circuit_ref"
  - id: ERR_DUPLICATE_LICENSE_REF
    http: 409
    condition: "another SpectrumLicense already uses the license_ref"
  - id: ERR_DUPLICATE_TIER_CODE
    http: 409
    condition: "another ServicePlan already uses the tier_code"
  - id: ERR_DUPLICATE_USAGE_RECORD
    http: 409
    condition: "the subscriber already has a UsageRecord for that usage_date"
  - id: ERR_CREDIT_ALREADY_ISSUED
    http: 409
    condition: "the subscriber already has an OutageCredit in status IN {PENDING, APPLIED} for that OutageEvent"
  - id: ERR_INTERVAL_INVALID
    http: 409
    condition: "ended_at <= started_at on an outage closure"
  - id: ERR_OUTAGE_WINDOW_OVERLAP
    http: 409
    condition: "the closed interval shares at least one minute with another CLOSED OutageEvent on the same Tower"
  - id: ERR_USAGE_DATE_OUT_OF_CYCLE
    http: 409
    condition: "usage_date falls outside the subscriber's current cycle window"
  - id: ERR_RETURN_WINDOW_OPEN
    http: 409
    condition: "clock_now < EquipmentAssignment.return_due_at when an unreturned settlement is billed"
  - id: ERR_BACKHAUL_NOT_ACCEPTED
    http: 409
    condition: "no BackhaulCircuit on the tower is in state ACCEPTED when the tower is asked to become ACTIVE"
  - id: ERR_TOWER_HAS_ACTIVE_SUBSCRIBERS
    http: 409
    condition: "a subscriber on one of the tower's sectors is still in service_status IN {PENDING_INSTALL, ACTIVE, SUSPENDED} when decommissioning is attempted"
  - id: ERR_SECTOR_CAPACITY_HOLD
    http: 409
    condition: "the qualified Sector's capacity_posture == HOLD when a reservation is attempted"
  - id: ERR_SECTOR_FROZEN
    http: 409
    condition: "the qualified Sector's capacity_posture == FROZEN when a reservation is attempted"
  - id: ERR_INSUFFICIENT_SECTOR_CAPACITY
    http: 409
    condition: "remaining_allowance(Sector) is below the downstream_mbps being reserved or upgraded to"

