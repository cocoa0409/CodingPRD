      - name: interstate_share_capped_at_ninety_for_hsip
        claim_type: constants_applied
        grounds:
          - calculations.federal_share_determination
          - constants.INTERSTATE_SHARE_CAP
        distinguishing_aspect: "HSIP base 0.90 plus the 0.10 interstate bump is clamped by the 0.90 cap: the determined share is 0.90, not 1.00, because the safety override does not apply to ROAD_RESURFACING."
        test_recipe:
          setup: ["HSIP program; STIP (land 0.00) approved with one interstate ROAD_RESURFACING project."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/funding-programs"
              payload: { code: "HSIP", name: "HSIP", eligible_activity_codes: ["ROAD_RESURFACING"] }
              as: PlatformAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /federal-aid/stips"
              payload: { state_code: "UT", state_federal_land_pct: 0.0, start_federal_fiscal_year: 2027, description: "UT STIP" }
              as: StateDOTPlanner
              captures: { stip_id: $.data.id }
