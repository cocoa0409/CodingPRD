      - name: getaway_list_price_clamped_up_to_the_floor
        claim_type: precision
        grounds: ["calculations.getaway_list_price", "matching_run_step_order[step 5]", "operational_constants.GETAWAY_SWEEP_WITHIN_DAYS"]
        distinguishing_aspect: >-
          getaway_list_price rounds exactly once and then clamps, which is the deliberate mirror image
          of deposit_trading_power's double rounding. A low-demand studio swept close to expiry prices
          out at 12782 cents before the clamp, so the published price must be the 29900-cent floor —
          proving the clamp is applied after the discount rather than as an input guard, and that a
          negative demand premium is applied multiplicatively rather than dropped.
        test_recipe:
          setup: >-
            Tier PLUS. Resort C, name "Pine Hollow Lodge", region_code US-MI, units_per_size 3,
            demand_index 2, initial_quality_rating STANDARD, with a single SILVER band 01-01..12-31,
            affiliated at the default clock. Member M1 on PLUS with dues paid through 2030-12-31 banks
            a STUDIO week checking in 2026-11-01, worth 27 (30 * 1.00 * 0.90 = 27, +0, lead 92 gives
            factor 1.00), expiring 2028-10-31T00:00:00Z. Nobody ever files a request for it. The clock
            then advances to 2028-10-01, thirty days before expiry, so the deposit falls inside
            GETAWAY_SWEEP_WITHIN_DAYS but is not yet expired.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
              as: NetworkOperator
              payload: { name: "Pine Hollow Lodge", region_code: "US-MI", required_annual_deposit_units: 1, initial_quality_rating: "STANDARD", units_per_size: 3, demand_index: 2 }
              captures: { resort_c: "$.data.id" }
            - call: "POST /exchange-network/season-bands"
              as: NetworkOperator
              payload: { resort_id: "${resort_c}", band_code: "SILVER", start_month_day: "01-01", end_month_day: "12-31" }
            - call: "POST /exchange-network/resorts/${resort_c}/affiliation"
              as: NetworkOperator
              payload: {}
            - call: "POST /exchange-network/members"
              as: NetworkOperator
              payload: { email: "m1@example.com", full_name: "Dana Oyelaran", tier_id: "${plus_tier}" }
              captures: { m1: "$.data.id", m1_v: "$.data.version" }
            - call: "POST /exchange-network/members/${m1}/dues-payments"
              as: Member
              as_user_id: "${m1}"
              payload: { amount_cents: 100000, paid_through_date: "2030-12-31", expected_member_version: "${m1_v}" }
            - call: "POST /exchange-network/deposits"
              as: Member
              as_user_id: "${m1}"
              payload: { member_id: "${m1}", resort_id: "${resort_c}", unit_size: "STUDIO", check_in_date: "2026-11-01" }
              captures: { dep: "$.data.id" }
            - call: "POST /exchange-network/_clock/set_current_utc"
              as: NetworkOperator
              payload: { to_iso8601: "2028-10-01T00:00:00Z" }
          trigger:
            - call: "POST /exchange-network/matching-runs"
              as: NetworkOperator
              payload: { note: "pre-expiry getaway sweep" }
              captures: { run1: "$.data.id" }
            - call: "GET /exchange-network/getaway-offers?deposit_id=${dep}"
              as: NetworkOperator
              payload: {}
              captures: { offer: "$.data[0].id", price: "$.data[0].list_price_cents" }
          assert:
            - "the run returns HTTP 201 with expired_deposit_count == 0 and getaway_listed_count == 1; expiry is 2028-10-31, still thirty days away"
            - "GET /exchange-network/deposits/${dep} — settlement_power == 23 (step_1 27, step_2 27, lead -700 gives factor 0.85, round_half_up(22.95) = 23) and rental_status == \"LISTED_GETAWAY\" while deposit_status is still \"BANKED\""
            - "the offer's list_price_cents == 29900 exactly — the raw price is 23*900 = 20700, the -5 percent demand premium gives 19665, the 35 percent urgency discount gives 12782.25 -> 12782, and the GETAWAY_FLOOR_CENTS clamp lifts it to 29900"
            - "the offer's urgency_discount_pct == 35 and created_by_run_id == \"${run1}\"; the clamp does not rewrite the discount that produced it"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 0; listing forfeits the remaining 27 points"
            - "GET /exchange-network/ledger-entries?member_id=${m1}&entry_type=GETAWAY_LISTING_FORFEIT — total_count == 1 with power_delta -27"

      - name: resort_compliance_counts_only_banked_reserved_and_used_deposits
        claim_type: input_set_filtering
        grounds: ["calculations.resort_deposit_obligation_shortfall.COUNTED_DEPOSIT_STATUSES", "endpoints[GET /exchange-network/resorts/{resort_id}/compliance]"]
        distinguishing_aspect: >-
          The obligation count is a filtered aggregate, not a row count: a week that was banked and
          then withdrawn must leave the counted set even though the Deposit row still exists and still
          sits inside the affiliation year. The resort's own deposits_committed_count and
          committed_nights counters have to move in step, so a server that decrements one and not the
          other is caught by the same read.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with required_annual_deposit_units 3 (so the shortfall is non-zero
            either way), units_per_size 2, affiliated at the default clock 2026-08-01, giving the
            affiliation year [2026-08-01, 2027-08-01). Member M1 on PLUS with dues paid banks three
            weeks at Resort A, all with check-in dates inside that year: a ONE_BR on 2027-06-15 worth
            82, a TWO_BR on 2027-05-10 worth 107 and a STUDIO on 2027-06-15 worth 56. M1 then
            withdraws the TWO_BR week.
          setup_api_calls:
            - call: "POST /exchange-network/membership-tiers"
              as: NetworkOperator
              payload: { tier_code: "PLUS", annual_dues_cents: 19900, base_exchange_fee_cents: 20900, priority_surcharge_cents: 2500, priority_window_days: 365, deposit_first_bonus_pct: 10, max_active_requests: 3, cancellation_fee_cents: 8900, reinstatement_fee_cents: 10900, extension_fee_cents_per_month: 3400 }
              captures: { plus_tier: "$.data.id" }
            - call: "POST /exchange-network/resorts"
