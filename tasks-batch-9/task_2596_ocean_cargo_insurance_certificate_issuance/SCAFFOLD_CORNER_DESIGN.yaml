            - call: "POST /vessels"
              payload: { name: "MV Age26", imo_number: "9100012", year_built: 2000, classification_society: "LR", flag_code: "SG", vessel_accumulation_limit_amount: 8000000 }
              as: Underwriter
              captures: { v26_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV Age30", imo_number: "9100013", year_built: 1996, classification_society: "ABS", flag_code: "PA", vessel_accumulation_limit_amount: 8000000 }
              as: Underwriter
              captures: { v30_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV Age31", imo_number: "9100014", year_built: 1995, classification_society: "DNV", flag_code: "PA", vessel_accumulation_limit_amount: 8000000 }
              as: Underwriter
              captures: { v31_id: $.data.id }
            - call: "POST /vessels"
              payload: { name: "MV NewUnclassed", imo_number: "9100015", year_built: 2024, classification_society: "UNCLASSED", flag_code: "PA", vessel_accumulation_limit_amount: 8000000 }
              as: Underwriter
              captures: { vunc_id: $.data.id }
          trigger:
            - call: "POST /vessels/${v25_id}/classification-review"
              payload: {}
              as: Underwriter
              captures: { s25: $.data.status, p25: $.data.overage_surcharge_pct }
            - call: "POST /vessels/${v26_id}/classification-review"
              payload: {}
              as: Underwriter
              captures: { s26: $.data.status, p26: $.data.overage_surcharge_pct }
            - call: "POST /vessels/${v30_id}/classification-review"
              payload: {}
              as: Underwriter
              captures: { s30: $.data.status, p30: $.data.overage_surcharge_pct }
            - call: "POST /vessels/${v31_id}/classification-review"
              payload: {}
              as: Underwriter
              captures: { s31: $.data.status, p31: $.data.overage_surcharge_pct }
            - call: "POST /vessels/${vunc_id}/classification-review"
              payload: {}
              as: Underwriter
              captures: { sunc: $.data.status, punc: $.data.overage_surcharge_pct }
          assert:
            - "${s25} == \"APPROVED\" and ${p25} == 0.00 — age exactly 25 is not over age"
            - "${s26} == \"OVERAGE_SURCHARGED\" and ${p26} == 0.25"
            - "${s30} == \"OVERAGE_SURCHARGED\" and ${p30} == 0.25 — age exactly 30 is not yet blocked"
            - "${s31} == \"BLOCKED\" and ${p31} == 0.00"
            - "${sunc} == \"BLOCKED\" and ${punc} == 0.00 — an unapproved society blocks a 2-year-old hull"
            - "each review returns HTTP 200 and increments that vessel's version by 1"

      - name: transit_termination_binds_on_the_earliest_of_three_clocks
        claim_type: correct_result
        grounds:
          - calculations.transit_termination_instant
          - entities.Port.fields.storage_free_days
          - entities.OpenPolicy.fields.warehouse_to_warehouse
        distinguishing_aspect: |
          transit_termination_at is a three-way minimum and each clock is made
          to win exactly once on the same discharge_date 2026-09-05: the port's
          30 free-storage days give 2026-10-05T00:00:00Z, a 60-day port meets
          the WW_MAX_STORAGE_DAYS cap at 2026-11-04T00:00:00Z, a policy with
          warehouse_to_warehouse false short-circuits the whole minimum to the
          discharge instant 2026-09-05T00:00:00Z, and a policy expiring
          2026-09-20 truncates cover to 2026-09-20T00:00:00Z even though 25
