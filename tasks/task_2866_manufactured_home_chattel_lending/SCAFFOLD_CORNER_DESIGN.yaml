  - section: errors
    instances:

      - name: unknown_path_ids_return_the_matching_not_found_error
        claim_type: triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_COMMUNITY_NOT_FOUND]
          - errors[ERR_VALUATION_NOT_FOUND]
          - errors[ERR_FILING_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_PAYMENT_NOT_FOUND]
          - errors[ERR_RECOVERY_CASE_NOT_FOUND]
        distinguishing_aspect: "The path-parameter resolution rule at priority 4 raises one error per entity family rather than a single generic 404: on an empty database six reads with well-formed but unknown UUIDs return six distinct error_ids - ERR_COMMUNITY_NOT_FOUND, ERR_VALUATION_NOT_FOUND, ERR_FILING_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_PAYMENT_NOT_FOUND and ERR_RECOVERY_CASE_NOT_FOUND - each with HTTP 404, which is what makes every member of the not-found family triggerable."
        test_recipe:
          setup:
            - "Empty database; nothing is created, so every id below is unknown."
          setup_api_calls: []
          trigger:
            - call: "GET /chattel/communities/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PlatformAdmin
              captures: { e_community: "$.data.error_id" }
            - call: "GET /chattel/valuations/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: PlatformAdmin
              captures: { e_valuation: "$.data.error_id" }
            - call: "GET /chattel/lien-filings/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: PlatformAdmin
              captures: { e_filing: "$.data.error_id" }
            - call: "GET /chattel/insurance-policies/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e_policy: "$.data.error_id" }
            - call: "GET /chattel/payments/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: PlatformAdmin
              captures: { e_payment: "$.data.error_id" }
            - call: "GET /chattel/recovery-cases/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: PlatformAdmin
              captures: { e_case: "$.data.error_id" }
          assert:
            - "${e_community} == ERR_COMMUNITY_NOT_FOUND with HTTP 404"
            - "${e_valuation} == ERR_VALUATION_NOT_FOUND with HTTP 404"
            - "${e_filing} == ERR_FILING_NOT_FOUND with HTTP 404"
            - "${e_policy} == ERR_POLICY_NOT_FOUND with HTTP 404"
            - "${e_payment} == ERR_PAYMENT_NOT_FOUND with HTTP 404"
            - "${e_case} == ERR_RECOVERY_CASE_NOT_FOUND with HTTP 404"
            - "every response carries the error envelope: data.error_id and data.message, plus meta.api_request_id and meta.api_request_timestamp"
            - "the corresponding collection reads (GET /chattel/communities, /chattel/valuations, /chattel/lien-filings, /chattel/insurance-policies, /chattel/payments, /chattel/recovery-cases) all return HTTP 200 with total_count 0 - an empty list is not a not-found"

      - name: calls_without_an_x_user_id_header_are_unauthenticated
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is checked at priority 1, before the role check, before reference resolution and before body validation: the same POST that would otherwise fail on a missing required field, and a GET of a resource that does not exist, both return ERR_UNAUTHENTICATED (401) when no identity header is sent - and the identical calls succeed or fail on their own merits once the header is present."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705 }
              as: "(no identity header sent)"
              captures: { err1: "$.data.error_id" }
            - call: "GET /chattel/borrowers/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: "(no identity header sent)"
              captures: { err2: "$.data.error_id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705 }
              as: PlatformAdmin
              captures: { err3: "$.data.error_id" }
          assert:
            - "${err1} == ERR_UNAUTHENTICATED with HTTP 401 - the missing monthly_income_cents and state_code fields are never even reached"
            - "${err2} == ERR_UNAUTHENTICATED with HTTP 401 rather than ERR_BORROWER_NOT_FOUND"
            - "${err3} == ERR_INVALID_REQUEST with HTTP 422 - with the header present the very same body now fails at priority 6, proving priority 1 was what answered before"
            - "no Borrower row exists after any of the three calls"
  - section: rbac
    instances:

      - name: each_role_cannot_reach_another_roles_exclusive_operation
        claim_type: role_cannot_perform_others_exclusive
        grounds:
          - roles[PlatformAdmin].exclusive_operations
          - roles[CreditAnalyst].exclusive_operations
          - roles[Servicer].exclusive_operations
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "The exclusivity is per operation, not per resource family: a CreditAnalyst who legitimately creates loans still cannot create the Borrower those loans point at, a ClosingAgent who funds loans cannot publish a book-value guide, and a Servicer who posts cash cannot move the logical clock. All three return ERR_ROLE_NOT_PERMITTED (403) on an empty database, before any resource has to exist."
        test_recipe:
          setup:
            - "Empty database; no setup is required because the role check at priority 2 runs before any reference resolution."
          setup_api_calls: []
          trigger:
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: CreditAnalyst
              captures: { err1: "$.data.error_id" }
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: ClosingAgent
              captures: { err2: "$.data.error_id" }
            - call: "POST /chattel/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Servicer
              captures: { err3: "$.data.error_id" }
          assert:
            - "${err1} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${err2} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${err3} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "no Borrower and no BookValueGuide row was created, and the logical clock still reads its 2026-08-01T00:00:00Z default"

      - name: the_certifier_of_the_valuation_cannot_approve_the_loan_it_secures
        claim_type: segregation_of_duties
        grounds:
          - roles[CreditAnalyst].note
          - validations[priority=34]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The role model is segregation_of_duties, so holding the CreditAnalyst role is necessary but not sufficient: the X-User-ID that certified the origination valuation is barred from approving the loan secured by it (ERR_SEGREGATION_OF_DUTIES, 409), and a second analyst approves the identical loan without any other change to state."
        test_recipe:
          setup:
            - "A private-land unit certified at 6098330 by user analyst-val-01, and a loan of 1500000 submitted for underwriting."
          setup_api_calls:
            - call: "POST /chattel/book-value-guides"
              payload: { guide_edition: "NADA-2026-SPRING", region_code: "SOUTH_ATLANTIC", effective_date: "2026-01-01T00:00:00Z", base_value_per_sqft_cents: 4500, single_wide_multiplier_bps: 10000, multi_wide_multiplier_bps: 11500, annual_depreciation_bps: 350 }
              as: PlatformAdmin
              captures: { g: "$.data.id" }
            - call: "POST /chattel/borrowers"
              payload: { full_name: "Dana Whitfield", credit_score: 705, monthly_income_cents: 520000, state_code: "GA" }
              as: PlatformAdmin
              captures: { b: "$.data.id" }
            - call: "POST /chattel/units"
              payload: { hud_label_number: "ALB0412345", manufacturer: "Clayton", model_year: 2018, width_class: "MULTI_WIDE", square_feet: 1440, condition_grade: "GOOD", installation_type: "PIER_AND_ANCHOR", wind_zone: 2, placement_type: "PRIVATE_LAND", land_owner_borrower_id: "${b}", land_parcel_apn: "072-114-003", land_county: "Bibb" }
              as: ClosingAgent
              captures: { u: "$.data.id", u_v: "$.data.version" }
            - call: "POST /chattel/valuations"
              payload: { unit_id: "${u}", guide_id: "${g}", variant: "ORIGINATION", expected_unit_version: "${u_v}" }
              as: CreditAnalyst
              captures: { v: "$.data.id" }
            - call: "POST /chattel/valuations/${v}/certify"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
            - call: "POST /chattel/loans"
              payload: { borrower_id: "${b}", unit_id: "${u}", origination_valuation_id: "${v}", principal_cents: 1500000, requested_term_months: 240 }
              as: CreditAnalyst
              captures: { l: "$.data.id" }
            - call: "POST /chattel/loans/${l}/submit-underwriting"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
          trigger:
            - call: "POST /chattel/loans/${l}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-val-01"
              captures: { err: "$.data.error_id" }
            - call: "POST /chattel/loans/${l}/approve"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-uw-02"
          assert:
            - "${err} == ERR_SEGREGATION_OF_DUTIES with HTTP 409 - the acting user equals Valuation.${v}.certified_by_user_id"
            - "${err} is NOT ERR_ROLE_NOT_PERMITTED: the caller does hold CreditAnalyst, which is why the check is on identity and not on role"
            - "submit-underwriting by the certifying user is fine: only approve carries the duty split, so Loan.${l}.underwriting_state was SUBMITTED before the refusal and stayed SUBMITTED after it"
            - "Valuation.${v}.certified_by_user_id == analyst-val-01"
            - "the second approve returns HTTP 200 with underwriting_state == APPROVED and approved_by_user_id == analyst-uw-02"

      - name: community_operator_cannot_execute_another_parks_agreement
        claim_type: peer_roles
        grounds:
          - roles[CommunityOperator].identity
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "CommunityOperator is entity_backed:Community, so its X-User-ID IS the community id: operator A holding the right role is still refused with ERR_NOT_RESOURCE_OWNER (403) when it executes park B's proposed agreement, and the ownership check at priority 3 fires ahead of the agreement-status check at priority 23."
        test_recipe:
          setup:
            - "Two communities, each with a PROPOSED operator agreement, and no other state."
          setup_api_calls:
            - call: "POST /chattel/communities"
              payload: { name: "Pine Ridge MHC", state_code: "GA", lot_count: 180, monthly_lot_rent_cents: 52000, sales_commission_bps: 150 }
              as: PlatformAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /chattel/communities"
              payload: { name: "Cedar Glen MHC", state_code: "GA", lot_count: 96, monthly_lot_rent_cents: 47500 }
              as: PlatformAdmin
              captures: { c2: "$.data.id" }
            - call: "POST /chattel/communities/${c1}/operator-agreement"
              payload: { action: "PROPOSE" }
              as: PlatformAdmin
            - call: "POST /chattel/communities/${c2}/operator-agreement"
              payload: { action: "PROPOSE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /chattel/communities/${c2}/operator-agreement"
              payload: { action: "EXECUTE" }
              as: CommunityOperator
              as_user_id: "${c1}"
              captures: { err: "$.data.error_id" }
            - call: "POST /chattel/communities/${c2}/operator-agreement"
              payload: { action: "EXECUTE" }
              as: CommunityOperator
              as_user_id: "${c2}"
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER with HTTP 403"
            - "Community.${c2}.operator_agreement_status was still PROPOSED and lender_access_rights false after the refusal"
            - "the second call returns HTTP 200 with Community.${c2}.operator_agreement_status == EXECUTED, lender_access_rights == true and agreement_executed_at set to the logical clock"
            - "Community.${c1}.operator_agreement_status is still PROPOSED - acting on ${c2} never touched ${c1}"

      - name: every_role_can_perform_its_own_operations
        claim_type: role_can_perform
        grounds:
          - roles[ClosingAgent].exclusive_operations
          - roles[Servicer].exclusive_operations
          - roles[RecoveryManager].exclusive_operations
        excluded_because:
          difficulty_instance: non_linear_state_machine / loan_three_state_dimensions_advance_independently
          rationale: "That §1.8 instance drives one loan through PlatformAdmin, CreditAnalyst, ClosingAgent, Servicer and RecoveryManager operations in sequence and asserts each one succeeded, so the positive half of the role matrix is covered there and in the setup spine of every other instance."

