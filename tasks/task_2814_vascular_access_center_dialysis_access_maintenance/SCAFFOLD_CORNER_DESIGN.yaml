      - name: the_suspension_band_flips_the_posture_between_fifty_two_and_forty_eight
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.facility_partnership_score.constants.SUSPENSION_SCORE_MAX
          - validations.priority_22_ERR_FACILITY_SUSPENDED
          - state_machines.DialysisFacility.PROBATION_to_SUSPENDED
        distinguishing_aspect: "The posture bands are closed intervals on the score: 52 is inside PROBATION (50..69) and 48 is inside SUSPENDED (<= 49), so bumping one facility's missed count from 12 to 13 crosses the lower edge and immediately closes triage with ERR_FACILITY_SUSPENDED. The grace credit also collapses to zero once the tier has fallen to WATCH, which is what makes the single extra missed treatment worth a full 4 points."
