              captures: { committed_post: $.data.stipend_committed_cents, posture_post: $.data.casting_posture }
          assert:
            - "${committed_pre} == 2326625"
            - "${a_status} == VOIDED"
            - "${a_reason} == BUSINESS_AFFAIRS_VOID"
            - "${a_total} == 0"
            - "${committed_post} == 220000"
            - "${committed_pre} - ${committed_post} == 2106625"
            - "ParticipantAgreement.${agr_b_id}.total_stipend_commitment_cents == 220000"
            - "ParticipantAgreement.${agr_b_id}.status == EXECUTED"
            - "${posture_post} == OPEN"
            - "GET /casting/participant-agreements/${agr_a_id}/post-obligations returns total_count == 3 with every status == EXCUSED"

      - name: minor_trust_escrow_conserved_across_deposit_then_withdrawal
        grounds:
          - calculations.trust_escrow_rollup
          - calculations.minor_trust_deposit_schedule
          - state_machines.Applicant.CLEARED_to_WITHDRAWN
          - state_machines.MinorProtection.COMPLETE_to_RELEASED
          - entities.Production.fields.trust_escrow_balance_cents
        distinguishing_aspect: |
          Conserved quantity #2 — the blocked minor trust escrow, a different quantity
          type from the stipend pool. Production.trust_escrow_balance_cents ==
          SUM(trust_deposited_cents over non-RELEASED MinorProtection rows) must read
          315,996 after the deposit and exactly 0 after the applicant withdrawal
          refunds it, with the packet RELEASED and its per_installment_cents zeroed.
        test_recipe:
          setup:
            - "COMPETITION_HIGH_STRESS / CA production, episode_order 10, minor_participant_cap 2, stipend_pool_cents 50,000,000."
            - "One minor applicant with a COMPLETE MinorProtection (permit to 2027-03-31, 15 education hours, trust_deposit_pct 0.15)."
            - "That minor's agreement is EXECUTED at 2,106,625 with 2 press appearances and a reunion, and 6 trust installments have been deposited (315,996 total)."
          setup_api_calls:
            - call: "POST /casting/productions"
              payload: { title: "Teen Trials S4", format_type: "COMPETITION_HIGH_STRESS", jurisdiction_code: "CA", season_number: 4, episode_order: 10, photography_start_utc: "2026-09-15T00:00:00Z", photography_end_utc: "2026-12-15T00:00:00Z", stipend_pool_cents: 50000000, welfare_budget_cents: 10000000, minor_participant_cap: 2 }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /casting/casting-calls"
              payload: { production_id: "${prod_id}", channel: "REFERRAL", min_age: 13, max_age: 45, exclusivity_window_days: 90 }
              as: CastingDirector
              captures: { call_id: $.data.id }
            - call: "POST /casting/casting-calls/${call_id}/publish"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Vic Lorne", date_of_birth: "2011-05-20", residency_state_code: "CA", guardian_name: "Wren Lorne" }
              as: CastingDirector
              captures: { app_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/minor-protections"
              payload: { work_permit_number: "CA-WP-77120", permit_expires_on: "2027-03-31", education_hours_scheduled_weekly: 15, trust_deposit_pct: 0.15 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mp_id: $.data.id }
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "INTERVIEW", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "BACKGROUND_CHECK", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "MEDICAL_EXAM", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /casting/applicants/${app_id}/screening-items"
              payload: { kind: "PSYCH_EVAL", outcome: "PASS", severity_flags: 0 }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "GET /casting/applicants/${app_id}"
              payload: {}
              as: BusinessAffairs
              captures: { app_ver: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_id}", production_id: "${prod_id}", exclusivity_window_days: 90, confidentiality_tier: "ENHANCED", depiction_rights_scope: "LIMITED", stipend_structure: "PER_EPISODE", base_stipend_cents: 250000, episodes_committed: 6, press_appearance_obligation_count: 2, reunion_obligation: true, expected_applicant_version: "${app_ver}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_id: $.data.id }
            - call: "POST /casting/participant-agreements/${agr_id}/send"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_1"
            - call: "POST /casting/participant-agreements/${agr_id}/execute"
              payload: {}
              as: BusinessAffairs
              as_user_id: "ba_2"
            - call: "POST /casting/minor-protections/${mp_id}/trust-deposits"
              payload: { installment_count: 6 }
              as: BusinessAffairs
              as_user_id: "ba_1"
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
              captures: { escrow_pre: $.data.trust_escrow_balance_cents, committed_pre: $.data.stipend_committed_cents, minors_pre: $.data.minor_participant_count }
          trigger:
            - call: "POST /casting/applicants/${app_id}/withdraw"
              payload: { reason: "Family withdrew consent before principal photography." }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { app_status: $.data.screening_status }
            - call: "GET /casting/productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
              captures: { escrow_post: $.data.trust_escrow_balance_cents, committed_post: $.data.stipend_committed_cents, minors_post: $.data.minor_participant_count, posture_post: $.data.casting_posture }
          assert:
            - "${escrow_pre} == 315996"
            - "${committed_pre} == 2106625"
            - "${minors_pre} == 1"
            - "${app_status} == WITHDRAWN"
            - "${escrow_post} == 0"
            - "${committed_post} == 0"
            - "${minors_post} == 0"
            - "${posture_post} == OPEN"
            - "MinorProtection.${mp_id}.status == RELEASED"
            - "MinorProtection.${mp_id}.trust_deposited_cents == 0"
            - "MinorProtection.${mp_id}.per_installment_cents == 0"
            - "ParticipantAgreement.${agr_id}.status == VOIDED"
            - "ParticipantAgreement.${agr_id}.void_reason == APPLICANT_WITHDRAWN"
            - "ParticipantAgreement.${agr_id}.total_stipend_commitment_cents == 0"
            - "GET /casting/participant-agreements/${agr_id}/post-obligations returns total_count == 3 with every status == EXCUSED"
