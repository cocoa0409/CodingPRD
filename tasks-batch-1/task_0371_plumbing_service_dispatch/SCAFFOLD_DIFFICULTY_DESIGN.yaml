            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${j1}", technician_id: "${tech_id}", window_start: "2026-01-01T10:00:00.000Z", window_end: "2026-01-01T12:00:00.000Z", eta: "2026-01-01T10:15:00.000Z", expected_job_version: "${j1v0}" }
              as: Dispatcher
              captures: { a1: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${a1}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${a1}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${a1}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${j1}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { j1vo: $.data.version }
            - call: "POST /plumbing/service-jobs/${j1}/estimates"
