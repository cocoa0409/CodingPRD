            - "${i_g} - ${j_g} == 9000  # one cent of extra combined income lowers the obligation by 9000 cents"
            - "${j_basic} != 103000  # 103000 is the blended answer 0.28 * 400000 + 0.25 * 1 rounded, which the declared algorithm never computes"

      - name: void_and_satisfied_charges_leave_the_interest_input_set
        claim_type: input_set_filtering
        grounds:
          - "calculations.arrears_interest_accrual.input_set"
          - "entities.SupportCase.fields.interest_receivable_cents"
          - "entities.Participant.fields.total_arrears_certified_cents"
          - "endpoints[POST /child-support/charges/{charge_id}/voidance]"
          - "endpoints[POST /child-support/cases/{case_id}/payments]"
        distinguishing_aspect: >
          Three 75000 CURRENT_SUPPORT charges are aged to 2026-11-01, then one is
          VOIDED and one is driven to SATISFIED by an exact payment. Both exits are
          retroactive: the aggregate receivable falls 2250 -> 1125 -> 375 and the
          certified figure falls 226125 -> 150375 -> 75000, because the removed
          charges also vanish from every earlier month-end snapshot. An
          implementation that merely stops future accrual, or that keeps a stored
          interest total, cannot reproduce the drop from 2250 to 1125 on a voidance
          that touches only the OLDEST charge.
        test_recipe:
          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z."
            - "CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD, two children, non-TANF."
            - "PRESUMED_MARITAL paternity so the order can be entered; monthly_obligation_cents is 75000."
            - "Three CURRENT_SUPPORT charges of 75000, due 2026-08-15, 2026-09-15 and 2026-10-15."
            - "Clock is then advanced to 2026-11-01T00:00:00Z with all three still OPEN."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Marta Vandeveld", ssn_last4: "6141", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpk: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Joris Vandeveld", ssn_last4: "6142", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpk: "$.data.id" }
            - call: "POST /child-support/participants/${ncpk}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpk}", noncustodial_party_id: "${ncpk}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casek: "$.data.id" }
            - call: "POST /child-support/cases/${casek}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casek}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { orderk: "$.data.id" }
            - call: "POST /child-support/orders/${orderk}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${orderk}/entry"
              payload: {}
              as: SupervisingAttorney
            - call: "POST /child-support/orders/${orderk}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { k1: "$.data.id" }
            - call: "POST /child-support/orders/${orderk}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { k2: "$.data.id" }
            - call: "POST /child-support/orders/${orderk}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
              captures: { k3: "$.data.id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /child-support/cases/${casek}"
              as: FinanceOfficer
              captures: { s0_int: "$.data.interest_receivable_cents", s0_prin: "$.data.arrears_principal_cents" }
            - call: "GET /child-support/participants/${ncpk}"
              as: CaseWorker
              captures: { c0: "$.data.total_arrears_certified_cents" }
          trigger:
            - call: "POST /child-support/charges/${k1}/voidance"
              payload: {}
              as: FinanceOfficer
              captures: { k1_status: "$.data.status" }
            - call: "GET /child-support/cases/${casek}"
              as: FinanceOfficer
              captures: { s1_int: "$.data.interest_receivable_cents", s1_prin: "$.data.arrears_principal_cents" }
            - call: "GET /child-support/participants/${ncpk}"
              as: CaseWorker
              captures: { c1: "$.data.total_arrears_certified_cents" }
            - call: "POST /child-support/cases/${casek}/payments"
              payload: { source: "DIRECT_PAY", amount_cents: 75000 }
              as: FinanceOfficer
              captures: { pay_ar: "$.data.applied_arrears_cents", pay_int: "$.data.applied_interest_cents", pay_cur: "$.data.applied_current_cents" }
            - call: "GET /child-support/charges/${k2}"
              as: FinanceOfficer
              captures: { k2_status: "$.data.status", k2_paid: "$.data.paid_cents" }
            - call: "GET /child-support/cases/${casek}"
              as: FinanceOfficer
              captures: { s2_int: "$.data.interest_receivable_cents", s2_prin: "$.data.arrears_principal_cents" }
            - call: "GET /child-support/participants/${ncpk}"
              as: CaseWorker
              captures: { c2: "$.data.total_arrears_certified_cents" }
          assert:
            - "${s0_int} == 2250 and ${s0_prin} == 225000  # aggregate_month_end at 2026-11-01: 08-31 pool 75000 -> 375, 09-30 pool 150000 -> 750, 10-31 pool 225000 -> 1125"
            - "${c0} == 226125  # certified uses statutory_per_charge: 750 + 375 + 0 == 1125 on top of principal 225000"
            - "${k1_status} == VOID"
            - "${s1_int} == 1125  # the voided charge leaves the 08-31, 09-30 and 10-31 pools alike: 0 + 375 + 750"
            - "${s1_prin} == 150000 and ${c1} == 150375  # statutory now 375 + 0"
            - "${pay_cur} == 0  # received_at 2026-11-01 is outside every charge period (10-01 <= 11-01 < 11-01 is false), so bucket 1 is empty"
            - "${pay_ar} == 75000 and ${pay_int} == 0  # bucket 3 takes the oldest OPEN charge (due 2026-09-15) in full and nothing is left for bucket 4"
            - "${k2_status} == SATISFIED and ${k2_paid} == 75000"
            - "${s2_int} == 375  # only the 10-15 charge survives: 08-31 and 09-30 pools are empty, 10-31 pool is 75000 -> 375"
            - "${s2_prin} == 75000 and ${c2} == 75000  # statutory is 0 because 2026-10-15 to 2026-11-01 is not a whole month"
            - "${s0_int} > ${s1_int} > ${s2_int}  # each exit removes interest that had already been posted for earlier months"

      - name: waterfall_fills_current_then_medical_then_arrears_then_interest_then_genetic_cost
        claim_type: waterfall_allocation
        grounds:
          - "calculations.payment_allocation_waterfall"
          - "calculations.payment_allocation_waterfall.constants.ALLOCATION_ORDER"
          - "calculations.payment_distribution_split"
          - "entities.PaymentTransaction"
          - "endpoints[POST /child-support/cases/{case_id}/payments]"
        distinguishing_aspect: >
          One 200000 payment is sized to overflow every bucket in turn so all six
          appear in a single response: 75000 current, 20000 medical, 30000 arrears
          principal, 150 interest, 48000 genetic test cost and 26850 unapplied
          credit. The order is forced, not incidental - the arrears charge is the
          OLDEST charge on the case, so an implementation that pays oldest-first
          would send 30000 to arrears before current support and leave the current
          period short; and the interest bucket sits BELOW arrears principal, so it
          receives money only because 200000 clears all three charge buckets first.
