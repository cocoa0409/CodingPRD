              as: Inspector
            - call: "POST /projects/${proj_id}/material-orders"
              payload: { mix_type: "STANDARD", pour_scheduled_start: "2026-07-01T12:00:00Z", pour_duration_hours: 4 }
              as: ProjectManager
            - call: "POST /crews"
              payload: { crew_name: "C9", skill: "FLATWORK", headcount: 4 }
              as: ProjectManager
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/crew-assignments"
              payload: { crew_id: "${crew_id}", window_start: "2026-07-01T12:00:00Z", window_end: "2026-07-01T18:00:00Z" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /projects/${proj_id}/hold"
              payload: {}
              as: ProjectManager
              captures: { held_status: $.data.status, held_sbh: $.data.status_before_hold }
          trigger:
            - call: "POST /projects/${proj_id}/resume"
              payload: {}
              as: ProjectManager
              captures: { resumed_status: $.data.status, resumed_sbh: $.data.status_before_hold }
          assert:
            - "Project.status at held_status == ON_HOLD"
            - "Project.status_before_hold at held_sbh == SCHEDULED"
            - "Project.${proj_id}.status == SCHEDULED"
            - "Project.${proj_id}.status_before_hold == null"
