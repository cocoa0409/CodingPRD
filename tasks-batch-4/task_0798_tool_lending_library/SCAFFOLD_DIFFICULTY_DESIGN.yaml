# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Tool & Gear Lending Library. 9 rules x 2 instances = 18 instances.
# Checkouts/returns/maintenance/intake run as Coordinator (opaque; superset of
# Volunteer). Member-owned mutations run as Member with as_user_id.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: late_fee_accruing_vs_finalized_on_loan
        grounds:
          - calculations.late_fee
          - state_machines.Loan.ACTIVE_to_OVERDUE
          - state_machines.Fee.ACCRUING_to_PENDING
          - entities.Fee.fields.amount_cents
        distinguishing_aspect: |
          On the SAME Loan, the ACCRUING late fee observed at clock 2026-03-11 is 100
          cents while the FINALIZED late fee frozen at the 2026-03-13 return is 300 cents
          — dual variants on the Loan entity domain.
        test_recipe:
          setup:
            - "ACTIVE member; TOOL item (daily_late_fee_cents=100, replacement_value_cents=12000, loan_period_days=7); one GOOD copy; clock 2026-03-01; copy checked out (due 2026-03-08); clock advanced to 2026-03-11 and ops-run makes the loan OVERDUE with an ACCRUING late fee of 100."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Ada", email: "ada1@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Drill", category: "TOOL", replacement_value_cents: 12000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "T-1", acquired_on: "2024-03-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/_ops/run"
              payload: {}
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan_id}" }
              as: Coordinator
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "GOOD" }
              as: Coordinator
          assert:
            - "Fee.${fee_id}.amount_cents == 300"
            - "Fee.${fee_id}.status == PENDING"
            - "Loan.${loan_id}.status == RETURNED"

      - name: damage_repair_vs_replace_on_damage_fee
        grounds:
          - calculations.damage_assessment
          - state_machines.ItemCopy.GOOD_to_NEEDS_MAINTENANCE
          - entities.Fee.fields.fee_type
        distinguishing_aspect: |
          On the damage-charge domain (ItemCopy/Fee, distinct from the Loan late-fee
          domain), a MINOR_DAMAGE return yields a REPAIR DAMAGE fee of 1500 cents while a
          MAJOR_DAMAGE return on an identical-age copy yields a REPLACE REPLACEMENT fee of
          9875 cents.
        test_recipe:
          setup:
            - "ACTIVE member; item (replacement_value_cents=12345, daily_late_fee_cents=100, loan_period_days=7); two GOOD copies acquired 2024-03-01; clock 2026-03-13; both copies checked out same-day (not overdue)."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Boro", email: "boro@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Saw", category: "TOOL", replacement_value_cents: 12345, loan_period_days: 7, daily_late_fee_cents: 100, max_renewals: 2 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "S-1", acquired_on: "2024-03-01T00:00:00Z" }
              as: Coordinator
              captures: { copy1: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "S-2", acquired_on: "2024-03-01T00:00:00Z" }
              as: Coordinator
              captures: { copy2: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv1: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy1}", expected_item_version: "${iv1}" }
              as: Coordinator
              captures: { loan1: $.data.id }
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv2: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy2}", expected_item_version: "${iv2}" }
              as: Coordinator
              captures: { loan2: $.data.id }
          trigger:
            - call: "POST /library/loans/${loan1}/return"
              payload: { return_condition: "MINOR_DAMAGE" }
              as: Coordinator
            - call: "POST /library/loans/${loan2}/return"
              payload: { return_condition: "MAJOR_DAMAGE" }
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan1}" }
              as: Coordinator
              captures: { fee_minor: "$.data[0].id" }
            - call: "GET /library/fees"
              payload: { loan_id: "${loan2}" }
              as: Coordinator
              captures: { fee_major: "$.data[0].id" }
          assert:
            - "Fee.${fee_minor}.amount_cents == 1500"
            - "Fee.${fee_minor}.fee_type == DAMAGE"
            - "Fee.${fee_major}.amount_cents == 9875"
            - "Fee.${fee_major}.fee_type == REPLACEMENT"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: late_fee_min_cap_binds_mode_a
        grounds:
          - calculations.late_fee
          - entities.Item.fields.replacement_value_cents
          - state_machines.Loan.ACTIVE_to_OVERDUE
        distinguishing_aspect: |
          Mode (a): late_fee = min(daily_late_fee_cents * max(0, days_overdue - GRACE_DAYS),
          replacement_value_cents) with three inputs and nested max/min; with daily=100,
          days_overdue=19, raw=1700 but replacement_value_cents=250, so the min-cap binds
          and the fee is exactly 250, not 1700.
        test_recipe:
          setup:
            - "ACTIVE member; cheap item (replacement_value_cents=250, daily_late_fee_cents=100, loan_period_days=7); one copy; clock 2026-03-01; checked out (due 2026-03-08); clock advanced to 2026-03-27 (19 days overdue) and ops-run makes it OVERDUE."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Cy", email: "cy@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Trowel", category: "OUTDOOR", replacement_value_cents: 250, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "O-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-27T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/_ops/run"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "GOOD" }
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan_id}" }
              as: Coordinator
              captures: { fee_id: "$.data[0].id" }
          assert:
            - "Fee.${fee_id}.amount_cents == 250"
            - "Fee.${fee_id}.fee_type == LATE"

      - name: damage_nested_rounding_order_mode_b
        grounds:
          - calculations.damage_assessment
          - entities.Item.fields.replacement_value_cents
          - entities.ItemCopy.fields.acquired_on
        distinguishing_aspect: |
          Mode (b): the pinned order is round the per-year depreciation FIRST
          (round_half_up(12345*0.10)=1235), then subtract 1235*2 from 12345 = 9875. The
          unpinned order (round(12345*(1-0.10*2))) would give 9876. The REPLACE charge
          must be 9875.
        test_recipe:
          setup:
            - "ACTIVE member; item (replacement_value_cents=12345); one GOOD copy acquired 2024-03-01 (age 2 years at observation); clock 2026-03-13; copy checked out same-day."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Del", email: "del@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Ladder", category: "TOOL", replacement_value_cents: 12345, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "L-1", acquired_on: "2024-03-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "MAJOR_DAMAGE" }
              as: Coordinator
            - call: "GET /library/fees"
              payload: { loan_id: "${loan_id}" }
              as: Coordinator
              captures: { fee_id: "$.data[0].id" }
          assert:
            - "Fee.${fee_id}.amount_cents == 9875"
            - "Fee.${fee_id}.fee_type == REPLACEMENT"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_renewal_cycle_active_to_active
        grounds:
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - entities.Loan.fields.renewals_used
          - entities.Loan.fields.due_date
        distinguishing_aspect: |
          The Loan state machine has a cycle: ACTIVE -> ACTIVE via renew. Two renewals
          leave status ACTIVE, renewals_used=2, and due_date advanced by two loan periods
          to 2026-03-22.
        test_recipe:
          setup:
            - "ACTIVE member; item (loan_period_days=7, max_renewals=2); one copy; clock 2026-03-01; checked out (due 2026-03-08); item has no holds."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Eve", email: "eve@x.com", tier: "PLUS" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Wrench", category: "TOOL", replacement_value_cents: 5000, loan_period_days: 7, daily_late_fee_cents: 100, max_renewals: 2 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "W-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${loan_id}/renew"
              payload: {}
              as: Coordinator
            - call: "POST /library/loans/${loan_id}/renew"
              payload: {}
              as: Coordinator
          assert:
            - "Loan.${loan_id}.status == ACTIVE"
            - "Loan.${loan_id}.renewals_used == 2"
            - "Loan.${loan_id}.due_date == 2026-03-22T00:00:00Z"

      - name: itemcopy_parallel_axes_independence
        grounds:
          - state_machines.ItemCopy.ON_LOAN_to_AVAILABLE
          - state_machines.ItemCopy.GOOD_to_NEEDS_MAINTENANCE
          - entities.ItemCopy.fields.availability_status
          - entities.ItemCopy.fields.condition_status
        distinguishing_aspect: |
          ItemCopy carries two independent axes: after a MINOR_DAMAGE return the copy is
          availability_status=AVAILABLE yet condition_status=NEEDS_MAINTENANCE, so
          item.available_copies_count==0 (availability alone is not enough) — the axes hold
          divergent values from different triggers.
        test_recipe:
          setup:
            - "ACTIVE member; item with one GOOD copy; clock 2026-03-01; copy checked out same-day (ON_LOAN, GOOD)."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Fin", email: "fin@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Blender", category: "KITCHEN", replacement_value_cents: 8000, loan_period_days: 14, daily_late_fee_cents: 50 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "K-1", acquired_on: "2025-06-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "GET /library/items/${item_id}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copy_id}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /library/loans/${loan_id}/return"
              payload: { return_condition: "MINOR_DAMAGE" }
              as: Coordinator
          assert:
            - "ItemCopy.${copy_id}.availability_status == AVAILABLE"
            - "ItemCopy.${copy_id}.condition_status == NEEDS_MAINTENANCE"
            - "Item.${item_id}.available_copies_count == 0"
            - "Item.${item_id}.maintenance_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: return_fee_suspends_member_cancels_reservation
        grounds:
          - state_machines.Loan.OVERDUE_to_RETURNED
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.PENDING_to_CANCELLED
          - state_machines.ItemCopy.RESERVED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-4 cascade from a single loan return: return -> REPLACEMENT Fee 9875 ->
          member.outstanding_balance_cents 9875 -> member ACTIVE->SUSPENDED -> the member's
          PENDING reservation on another item -> CANCELLED -> that reserved copy
          RESERVED->AVAILABLE. Each hop is caused by the previous.
        test_recipe:
          setup:
            - "ACTIVE member; itemA (replacement_value_cents=12345) with copyA acquired 2024-03-01; itemB with copyB; clock 2026-03-13; member has a PENDING reservation on itemB (copyB RESERVED, window 2026-04-01..2026-04-05); copyA checked out same-day."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Gus", email: "gus@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Chainsaw", category: "OUTDOOR", replacement_value_cents: 12345, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { itemA: $.data.id }
            - call: "POST /library/items/${itemA}/copies"
              payload: { asset_tag: "A-1", acquired_on: "2024-03-01T00:00:00Z" }
              as: Coordinator
              captures: { copyA: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Tent", category: "OUTDOOR", replacement_value_cents: 6000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { itemB: $.data.id }
            - call: "POST /library/items/${itemB}/copies"
              payload: { asset_tag: "B-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copyB: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-13T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/reservations"
              payload: { member_id: "${m_id}", item_id: "${itemB}", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-05T00:00:00Z" }
              as: Member
              as_user_id: "${m_id}"
              captures: { res_id: $.data.id }
            - call: "GET /library/items/${itemA}"
              payload: {}
              as: Coordinator
              captures: { iv: $.data.version }
            - call: "POST /library/loans"
              payload: { member_id: "${m_id}", copy_id: "${copyA}", expected_item_version: "${iv}" }
              as: Coordinator
              captures: { loanA: $.data.id }
          trigger:
            - call: "POST /library/loans/${loanA}/return"
              payload: { return_condition: "MAJOR_DAMAGE" }
              as: Coordinator
          assert:
            - "Member.${m_id}.outstanding_balance_cents == 9875"
            - "Member.${m_id}.status == SUSPENDED"
            - "Reservation.${res_id}.status == CANCELLED"
            - "ItemCopy.${copyB}.availability_status == AVAILABLE"

      - name: maintenance_return_promotes_waitlist_head
        grounds:
          - state_machines.MaintenanceTicket.OPEN_to_RESOLVED
          - state_machines.ItemCopy.NEEDS_MAINTENANCE_to_GOOD
          - state_machines.Hold.PENDING_to_PROMOTED
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (maintenance resolve): resolve
          RETURN_TO_SERVICE -> copy condition GOOD + availability AVAILABLE -> item_availability
          recompute promotes the queue-head Hold PENDING->PROMOTED -> a WAITLIST_PROMOTION
          Reservation is minted and the copy goes AVAILABLE->RESERVED.
        test_recipe:
          setup:
            - "Two ACTIVE members; item with one copy that is under a MANUAL maintenance ticket (copy NEEDS_MAINTENANCE, item has 0 available copies); member2 has a PENDING hold on the item; clock 2026-03-01."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Hal", email: "hal@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m1: $.data.id }
            - call: "POST /library/members"
              payload: { name: "Ivy", email: "ivy@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m2: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Router", category: "TOOL", replacement_value_cents: 9000, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item_id: $.data.id }
            - call: "POST /library/items/${item_id}/copies"
              payload: { asset_tag: "R-1", acquired_on: "2025-01-01T00:00:00Z" }
              as: Coordinator
              captures: { copy_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /library/maintenance-tickets"
              payload: { copy_id: "${copy_id}", reason: "ROUTINE" }
              as: Coordinator
              captures: { ticket_id: $.data.id }
            - call: "POST /library/holds"
              payload: { member_id: "${m2}", item_id: "${item_id}" }
              as: Member
              as_user_id: "${m2}"
              captures: { hold_id: $.data.id }
          trigger:
            - call: "POST /library/maintenance-tickets/${ticket_id}/resolve"
              payload: { outcome: "RETURN_TO_SERVICE" }
              as: Coordinator
          assert:
            - "ItemCopy.${copy_id}.condition_status == GOOD"
            - "ItemCopy.${copy_id}.availability_status == RESERVED"
            - "Hold.${hold_id}.status == PROMOTED"
            - "Hold.${hold_id}.promoted_reservation_id != null"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkout_member_suspended_beats_balance_limit
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - errors[ERR_BALANCE_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 6, ERR_MEMBER_NOT_ACTIVE) vs business_fiscal
          (priority 14, ERR_BALANCE_LIMIT_EXCEEDED): a SUSPENDED member with
          outstanding_balance_cents=9875 attempting checkout fails both; the state error
          wins, so error_id==ERR_MEMBER_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Member suspended with outstanding_balance_cents=9875 (from a MAJOR_DAMAGE return on item1); item2 has one AVAILABLE GOOD copy; clock 2026-03-13."
          setup_api_calls:
            - call: "POST /library/members"
              payload: { name: "Jo", email: "jo@x.com", tier: "BASIC" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Auger", category: "OUTDOOR", replacement_value_cents: 12345, loan_period_days: 7, daily_late_fee_cents: 100 }
              as: Coordinator
              captures: { item1: $.data.id }
            - call: "POST /library/items/${item1}/copies"
              payload: { asset_tag: "AU-1", acquired_on: "2024-03-01T00:00:00Z" }
              as: Coordinator
              captures: { copy1: $.data.id }
            - call: "POST /library/items"
              payload: { name: "Mixer", category: "KITCHEN", replacement_value_cents: 4000, loan_period_days: 14, daily_late_fee_cents: 50 }
              as: Coordinator
