          Different metric and endpoint from the SAP bps boundary: fund pool
          reservation equality. SEOG pool 350000 with reserved 350000 (exactly
          equal) is EXHAUSTED (>= comparison) and the next student receives NO
          SEOG line; a pool of 350001 would leave 1 cent of headroom and produce
          a 1-cent line. Exercised via POST /award-packages/{id}/build.
        test_recipe:
          setup:
            - "AidYear OPEN; SEOG ACTIVE cap 200000 pool 350000 rank 1"
            - "Student E1 built first (SEOG offer 200000, reserved 200000); Student E2 built second (offer min(200000, 150000)=150000, reserved 350000 -> EXHAUSTED); Student E3 built third"
