          setup:
            - "ProductModel PM-RWK-KM with wall_cv_max_pct 12.00, wall_thickness_min_mm 4.50, impact_test_min_joules 90.00, min_cooling_minutes 30, gross_cube_m3 2.0000, nest_factor 0.5000, unit_weight_kg 24.000, nominal_charge_kg 12.000."
