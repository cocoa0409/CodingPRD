            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1 }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id", sale_st0: "$.data.status" } }
          trigger:
            - { call: "POST /grillops/devices/00000000-0000-4000-8000-000000000009/firmware", payload: { action: "UPDATE", target_version: "2.1.0" }, as: AppUser, captures: { e0: "$.data.error_id" } }
            - { call: "POST /grillops/devices/pair", payload: { sale_id: "${sale_id}", app_account_id: "acct-77" }, as: AppUser, captures: { dev_id: "$.data.id", fw0: "$.data.firmware_version", tok: "$.data.pairing_token" } }
