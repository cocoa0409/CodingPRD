      - name: submit_residency_beats_window
        grounds:
          - validations[priority=60]
          - validations[priority=70]
          - entities.Seat.fields.residency_requirement
        distinguishing_aspect: "On application submit, a residency violation (pri 60, business_referential) and a closed-window violation (pri 70, business_temporal) both hold; residency wins -> ERR_RESIDENCY_REQUIREMENT_NOT_MET."
