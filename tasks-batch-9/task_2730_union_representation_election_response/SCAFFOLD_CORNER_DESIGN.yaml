          difficulty_instance: cascade_fan_out_breadth / presenter_decertification_three_hop
          rationale: "The named \u00a71.8 instance records the substantiated violation and walks the whole three-hop consequence chain (certification revoked, approved messages BLOCKED with PRESENTER_DECERTIFIED, Petition.retraining_required true)."

