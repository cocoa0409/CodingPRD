scenario: "Drive-In & Outdoor Cinema: showtime & lot/stall capacity, per-car vs per-person pricing, FM-audio & concession pre-order, reservation & gate scan, double-feature scheduling, weather/refund, private-rental/event, season pass"
domain_name: "drive-in-cinema"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Derived field reconciliation"
    - "Scheduled / deferred actions"

  entity_topology: flat
  # Peer entities linked by foreign keys (Venue, Lot, Film, Showtime, Reservation,
  # ConcessionItem, ConcessionOrder, SeasonPass, PrivateRental, FmChannelAssignment,
  # WeatherEvent, RefundRecord). No deep URL nesting; children carry FK fields.

  state_machine_shape: parallel
  # Reservation carries TWO independent state dimensions (occupancy_status ×
  # payment_status); Showtime is cyclic (SCHEDULED↔WEATHER_HOLD); PrivateRental
  # branches (REQUESTED→{APPROVED,REJECTED}); ConcessionOrder is linear-with-revert.

  relationship_patterns:
    - one_to_many        # Venue→Lot, Venue→Showtime, Showtime→Reservation, Reservation→ConcessionOrder
    - cross_aggregate    # Reservation references Showtime, Lot, SeasonPass across aggregates
    - polymorphic        # RefundRecord.source_type references either Reservation or ConcessionOrder

  role_model: peer_roles
  # GateAttendant, VenueOperator, Patron each own distinct operations; PlatformAdmin
  # is the opaque operator surface for catalog + clock + weather injection.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the drive-in / outdoor cinema venue."
      - name: timezone
        type: string
        source: input
        description: "IANA timezone string; all showtime windows interpreted in this zone."
        default: "UTC"
      - name: fm_channel_pool
        type: array
        source: input
        description: "Ordered list of available FM frequency strings (e.g. ['87.9','88.1','88.3']). Waterfall-assigned in list order. Shared airspace across all lots of this venue."
        constraints: "Non-empty array of distinct frequency strings."
      - name: turnaround_buffer_minutes
        type: integer
        source: input
        description: "Required cleanup gap between consecutive showtimes on the same lot."
        default: 30
        constraints: ">= 0"
      - name: no_show_grace_minutes
        type: integer
        source: input
        description: "Minutes after a showtime's start during which an unscanned CONFIRMED reservation is still honored; the no-show sweep runs at start + this value."
        default: 15
        constraints: ">= 0"

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; the venue this parking lot belongs to."
      - name: name
        type: string
        source: input
        description: "Lot label (e.g. 'North Field')."
      - name: stall_count
        type: integer
        source: input
        description: "Total number of car stalls in this lot; upper bound on PER_CAR reservations per showtime."
        constraints: ">= 1"
      - name: person_capacity
        type: integer
        source: input
        description: "Maximum total occupants allowed for a PER_PERSON showtime in this lot (walk-in lawn capacity)."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state of the lot."
        default: "OPEN"
        constraints: "One of {OPEN, CLOSED}"

  - name: Film
    parent: null
    common_fields: false
    fields:
      - name: title
        type: string
        source: input
        description: "Film title."
      - name: runtime_minutes
        type: integer
        source: input
        description: "Feature runtime in minutes; used to derive a showtime's end instant."
        constraints: ">= 1"
      - name: rating
        type: enum
        source: input
        description: "Content rating."
        constraints: "One of {G, PG, PG13, R}"

  - name: Showtime
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue hosting this showtime."
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; lot the showtime occupies (single lot per showtime)."
      - name: primary_film_id
        type: string
        source: input
        description: "FK -> Film.id; first feature."
      - name: secondary_film_id
        type: string
        source: input
        description: "FK -> Film.id; second feature when is_double_feature is true, else null."
        default: null
      - name: is_double_feature
        type: boolean
        source: input
        description: "True when this showtime screens two features back-to-back."
        default: false
      - name: start_utc
        type: datetime
        source: input
        description: "Gate-open / first-feature start instant (ISO 8601 UTC)."
      - name: end_utc
        type: datetime
        source: computed
        description: "Computed last-feature end instant = start_utc + primary.runtime + (secondary.runtime if double else 0). Used for lot interval-overlap checks."
      - name: pricing_mode
        type: enum
        source: input
        description: "Determines which pricing formula applies."
        constraints: "One of {PER_CAR, PER_PERSON}"
      - name: base_price_cents
        type: integer
        source: input
        description: "PER_CAR: price for one car including up to included_occupants. PER_PERSON: price per occupant."
        constraints: ">= 0"
      - name: included_occupants
        type: integer
        source: input
        description: "PER_CAR only: occupants covered by base_price_cents before per_extra_person_cents applies. Ignored for PER_PERSON."
        default: 2
        constraints: ">= 1"
      - name: per_extra_person_cents
        type: integer
        source: input
        description: "PER_CAR only: charge per occupant beyond included_occupants. Ignored for PER_PERSON."
        default: 0
        constraints: ">= 0"
      - name: double_feature_surcharge_cents
        type: integer
        source: input
        description: "Flat surcharge added when is_double_feature is true; charged even to season-pass redemptions."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Operational state of the showtime."
        default: "SCHEDULED"
        constraints: "One of {SCHEDULED, WEATHER_HOLD, CANCELLED, COMPLETED}"
      - name: reserved_stall_count
        type: integer
        source: computed
        description: "Derived count of stalls held by reservations in occupancy_status IN {CONFIRMED, CHECKED_IN, SCANNED} for this showtime. Reconciled on every reservation create/cancel/no-show."
        default: 0
      - name: reserved_person_count
        type: integer
        source: computed
        description: "Derived sum of occupant_count over reservations in occupancy_status IN {CONFIRMED, CHECKED_IN, SCANNED} for a PER_PERSON showtime. Reconciled on every reservation create/cancel/no-show."
        default: 0

  - name: FmChannelAssignment
    parent: null
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: input
        description: "FK -> Showtime.id; the showtime this FM channel is allocated to."
      - name: venue_id
        type: string
        source: computed
        description: "Denormalized copy of the parent showtime's venue_id (copied at assignment); identifies the shared airspace pool. Discover assignments via GET /showtimes/{id}/fm-channel."
      - name: frequency
        type: string
        source: computed
        description: "Waterfall-assigned FM frequency: first entry of Venue.fm_channel_pool (in list order) not already assigned to a time-overlapping showtime of the same venue. Empty pool slice -> ERR_NO_FM_CHANNEL."
      - name: status
        type: enum
        source: system
        description: "Assignment state."
        default: "ACTIVE"
        constraints: "One of {ACTIVE, RELEASED}"

  - name: SeasonPass
    parent: null
    common_fields: true
    fields:
      - name: patron_id
        type: string
        source: input
        description: "Opaque patron identifier that owns this pass; matched against X-User-ID for Patron-role redemptions."
      - name: tier
        type: enum
        source: input
        description: "Pass tier."
        constraints: "One of {SILVER, GOLD}"
      - name: max_redemptions
        type: integer
        source: input
        description: "Total number of reservations this pass may cover over its validity window."
        constraints: ">= 1"
      - name: redemptions_used
        type: integer
        source: computed
        description: "Count of reservations currently CONFIRMED/CHECKED_IN/SCANNED that were created against this pass. Decremented when such a reservation is cancelled or swept to NO_SHOW."
        default: 0
      - name: valid_from_utc
        type: datetime
        source: input
        description: "Inclusive start of the pass validity window."
      - name: valid_to_utc
        type: datetime
        source: input
        description: "Inclusive end of the pass validity window; a redemption is valid only when showtime.start_utc <= valid_to_utc."
      - name: status
        type: enum
        source: system
        description: "Pass lifecycle."
        default: "ACTIVE"
        constraints: "One of {ACTIVE, REVOKED}"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: showtime_id
        type: string
        source: input
        description: "FK -> Showtime.id; the screening reserved."
      - name: lot_id
        type: string
        source: computed
        description: "FK -> Lot.id; copied from the showtime at creation for capacity bookkeeping."
      - name: patron_id
        type: string
        source: input
        description: "Opaque patron identifier owning this reservation; matched against X-User-ID for Patron operations."
      - name: occupant_count
        type: integer
        source: input
        description: "Number of people in the party; drives PER_PERSON pricing and per-person capacity."
        constraints: ">= 1"
      - name: season_pass_id
        type: string
        source: input
        description: "FK -> SeasonPass.id; non-null when this reservation is paid via a season pass, else null."
        default: null
      - name: promo_pct
        type: number
        source: input
        description: "Optional percentage discount as a fraction (e.g. 0.10 for 10%) applied to the priced gross. Ignored for season-pass reservations except on the double-feature surcharge."
        default: 0
        constraints: ">= 0 and <= 1"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "Priced charge for this reservation computed by reservation_pricing at creation (see §1.3)."
        default: 0
      - name: amount_paid_cents
        type: computed
        source: computed
        description: "Cents actually captured; equals amount_due_cents once payment_status is PAID, else 0."
        default: 0
      - name: stalls_used
        type: integer
        source: computed
        description: "1 for a PER_CAR reservation, 0 for a PER_PERSON reservation; the stall debit this reservation places on its showtime."
        default: 0
      - name: gate_code
        type: string
        source: system
        description: "Server-minted scan token (not the id) presented at the gate; consumed by the SCANNED transition."
      - name: occupancy_status
        type: enum
        source: system
        description: "Occupancy state dimension (independent of payment_status)."
        default: "CONFIRMED"
        constraints: "One of {CONFIRMED, CHECKED_IN, SCANNED, NO_SHOW, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment state dimension (independent of occupancy_status)."
        default: "UNPAID"
        constraints: "One of {UNPAID, PAID, REFUNDED}"

  - name: ConcessionItem
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue whose menu lists this item."
      - name: name
        type: string
        source: input
        description: "Menu item name."
      - name: unit_price_cents
        type: integer
        source: input
        description: "Per-unit price."
        constraints: ">= 0"
      - name: tax_rate
        type: number
        source: input
        description: "Sales-tax fraction applied per line (e.g. 0.0725). Zero for non-taxable items."
        default: 0
        constraints: ">= 0 and < 1"
      - name: available
        type: boolean
        source: input
        description: "Whether the item may be added to a new concession order."
        default: true

  - name: ConcessionOrder
    parent: null
    common_fields: true
    fields:
      - name: reservation_id
        type: string
        source: input
        description: "FK -> Reservation.id; the reservation this pre-order is attached to."
      - name: lines
        type: array
        source: input
        description: "Array of {concession_item_id, qty} objects (qty >= 1). Must be non-empty."
        constraints: "Length >= 1; each qty >= 1."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum over lines of unit_price_cents * qty (see concession_order_total §1.3)."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Per-line tax rounded half-up per line then summed (see concession_order_total §1.3)."
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * SERVICE_FEE_PCT), computed once on the subtotal."
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents + tax_cents + service_fee_cents."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Order lifecycle."
        default: "PENDING"
        constraints: "One of {PENDING, PAID, FULFILLED, CANCELLED}"

  - name: PrivateRental
    parent: null
    common_fields: true
    fields:
      - name: venue_id
        type: string
        source: input
        description: "FK -> Venue.id; venue being rented."
      - name: lot_id
        type: string
        source: input
        description: "FK -> Lot.id; lot held exclusively for the private event."
      - name: organizer_id
        type: string
        source: input
        description: "Opaque organizer identifier."
      - name: start_utc
        type: datetime
        source: input
        description: "Inclusive start of the exclusive hold window."
      - name: end_utc
        type: datetime
        source: input
        description: "Inclusive end of the exclusive hold window."
      - name: flat_venue_fee_cents
        type: integer
        source: input
        description: "Flat base fee for the rental."
        constraints: ">= 0"
      - name: per_hour_cents
        type: integer
        source: input
        description: "Hourly charge applied to the rounded-up duration."
        constraints: ">= 0"
      - name: quote_cents
        type: integer
        source: computed
        description: "Computed rental quote (see private_rental_quote §1.3)."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Rental lifecycle."
        default: "REQUESTED"
        constraints: "One of {REQUESTED, APPROVED, REJECTED, CANCELLED}"

  - name: WeatherEvent
    parent: null
    common_fields: false
    fields:
      - name: showtime_id
        type: string
        source: input
        description: "FK -> Showtime.id; the showtime impacted by weather."
      - name: severity
        type: enum
        source: input
        description: "ADVISORY puts the showtime on WEATHER_HOLD (resumable); CANCELLATION forces showtime cancellation with refunds."
        constraints: "One of {ADVISORY, CANCELLATION}"
      - name: features_remaining
        type: integer
        source: input
        description: "Number of unscreened features at the moment of a CANCELLATION (1 or 2); drives pro-rata weather refunds. Ignored for ADVISORY."
        default: 0
        constraints: ">= 0 and <= 2"

  - name: RefundRecord
    parent: null
    common_fields: false
    fields:
      - name: source_type
        type: enum
        source: system
        description: "Polymorphic source of the refund."
        constraints: "One of {RESERVATION, CONCESSION_ORDER}"
      - name: reservation_id
        type: string
        source: system
        description: "FK -> Reservation.id; set when source_type is RESERVATION, else null."
        default: null
      - name: concession_order_id
        type: string
        source: system
        description: "FK -> ConcessionOrder.id; set when source_type is CONCESSION_ORDER, else null."
        default: null
      - name: reason
        type: enum
        source: system
        description: "Why the refund was issued."
        constraints: "One of {WEATHER, VOLUNTARY_CANCEL, RESERVATION_CASCADE}"
      - name: amount_cents
        type: integer
        source: system
        description: "Cents refunded; computed by refund_amount (§1.3) for reservations, or the order's total_cents for cascaded concession refunds."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Reservation: PARALLEL dimensions (occupancy_status × payment_status) ----
  - entity: Reservation
    initial_state: "CONFIRMED/UNPAID"
    terminal_states: ["CANCELLED", "NO_SHOW"]
    note: "Two independent dimensions evolve on one row: occupancy_status {CONFIRMED→CHECKED_IN→SCANNED, →NO_SHOW, →CANCELLED} and payment_status {UNPAID→PAID→REFUNDED}. Transitions below are tagged by dimension."
    transitions:
      - from: "occupancy=CONFIRMED"
        to: "occupancy=CHECKED_IN"
        trigger: "POST /reservations/{id}/check-in"
        actor: GateAttendant
        preconditions:
          - "reservation.occupancy_status == CONFIRMED"
          - "reservation.payment_status == PAID"
          - "showtime.status IN {SCHEDULED}"
          - "logical clock now >= showtime.start_utc - 60 minutes"
        side_effects:
          - "occupancy_status := CHECKED_IN"
          - "increments Reservation.version by 1"
      - from: "occupancy=CHECKED_IN"
        to: "occupancy=SCANNED"
        trigger: "POST /reservations/{id}/scan"
        actor: GateAttendant
        preconditions:
          - "reservation.occupancy_status == CHECKED_IN"
          - "request gate_code == reservation.gate_code"
        side_effects:
          - "occupancy_status := SCANNED"
          - "increments Reservation.version by 1"
      - from: "occupancy=CONFIRMED"
        to: "occupancy=NO_SHOW"
        trigger: "POST /showtimes/{id}/run-no-show-sweep (system, per showtime)"
        actor: system
        preconditions:
          - "reservation.occupancy_status == CONFIRMED"
          - "logical clock now >= showtime.start_utc + venue.no_show_grace_minutes"
        side_effects:
          - "occupancy_status := NO_SHOW"
          - "showtime.reserved_stall_count -= reservation.stalls_used  (derived-field reconciliation)"
          - "showtime.reserved_person_count -= reservation.occupant_count (PER_PERSON showtimes)"
          - "if reservation.season_pass_id != null: SeasonPass.redemptions_used -= 1 (conserved-quantity restore)"
          - "increments Reservation.version by 1"
        note: "No refund on no-show; the seat is forfeited."
      - from: "occupancy IN {CONFIRMED, CHECKED_IN}"
        to: "occupancy=CANCELLED"
        trigger: "POST /reservations/{id}/cancel"
        actor: Patron
        preconditions:
          - "reservation.occupancy_status IN {CONFIRMED, CHECKED_IN}"
          - "showtime.status IN {SCHEDULED, WEATHER_HOLD}"
          - "expected_reservation_version matches reservation.version (OCC)"
        side_effects:
          - "occupancy_status := CANCELLED"
          - "showtime.reserved_stall_count -= reservation.stalls_used (derived-field reconciliation)"
          - "showtime.reserved_person_count -= reservation.occupant_count (PER_PERSON showtimes)"
          - "if reservation.season_pass_id != null: SeasonPass.redemptions_used -= 1 (conserved-quantity restore)"
          - "if reservation.payment_status == PAID: compute refund_amount(VOLUNTARY_CANCEL); payment_status := REFUNDED; create RefundRecord{source_type=RESERVATION, reason=VOLUNTARY_CANCEL, amount_cents=refund}"
          - "CASCADE: any ConcessionOrder on this reservation with status IN {PENDING, PAID} -> status=CANCELLED; if that order was PAID create RefundRecord{source_type=CONCESSION_ORDER, reason=RESERVATION_CASCADE, amount_cents=order.total_cents}"
          - "increments Reservation.version by 1"
        note: "Depth-3 cascade: cancel(Reservation) -> Reservation.payment REFUNDED & RefundRecord -> ConcessionOrder CANCELLED -> ConcessionOrder RefundRecord."
      - from: "payment=UNPAID"
        to: "payment=PAID"
        trigger: "POST /reservations/{id}/pay"
        actor: Patron
        preconditions:
          - "reservation.payment_status == UNPAID"
          - "reservation.occupancy_status == CONFIRMED"
        side_effects:
          - "payment_status := PAID"
          - "amount_paid_cents := amount_due_cents"
          - "increments Reservation.version by 1"
        note: "Season-pass reservations with amount_due_cents == 0 may still be transitioned to PAID (zero capture) so they can be checked in."

  # ---- Showtime: CYCLIC (SCHEDULED <-> WEATHER_HOLD) + terminal CANCELLED/COMPLETED ----
  - entity: Showtime
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    note: "Cyclic: an ADVISORY puts SCHEDULED->WEATHER_HOLD and a clearance returns WEATHER_HOLD->SCHEDULED; repeatable."
    transitions:
      - from: SCHEDULED
        to: WEATHER_HOLD
        trigger: "POST /showtimes/{id}/weather-events (severity=ADVISORY)"
        actor: VenueOperator
        preconditions:
          - "showtime.status == SCHEDULED"
        side_effects:
          - "status := WEATHER_HOLD"
          - "increments Showtime.version by 1"
      - from: WEATHER_HOLD
        to: SCHEDULED
        trigger: "POST /showtimes/{id}/clear-weather-hold"
        actor: VenueOperator
        preconditions:
          - "showtime.status == WEATHER_HOLD"
        side_effects:
          - "status := SCHEDULED"
          - "increments Showtime.version by 1"
      - from: "SCHEDULED or WEATHER_HOLD"
        to: CANCELLED
        trigger: "POST /showtimes/{id}/weather-events (severity=CANCELLATION)"
        actor: VenueOperator
        preconditions:
          - "showtime.status IN {SCHEDULED, WEATHER_HOLD}"
        side_effects:
          - "status := CANCELLED"
          - "CASCADE for every Reservation on this showtime with occupancy_status IN {CONFIRMED, CHECKED_IN, SCANNED}: occupancy_status := CANCELLED; release stall/person counts; restore season-pass redemption; if payment_status==PAID compute refund_amount(WEATHER, features_remaining) -> payment_status=REFUNDED + RefundRecord{reason=WEATHER}; further CASCADE each such reservation's PENDING/PAID ConcessionOrder -> CANCELLED + (if PAID) RefundRecord{reason=RESERVATION_CASCADE}"
          - "FmChannelAssignment for this showtime: status := RELEASED (frees the frequency)"
          - "increments Showtime.version by 1"
        note: "Depth-3 weather cascade: cancel(Showtime) -> Reservation CANCELLED+REFUNDED -> ConcessionOrder CANCELLED+RefundRecord."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /showtimes/{id}/complete"
        actor: VenueOperator
        preconditions:
          - "showtime.status == SCHEDULED"
          - "logical clock now >= showtime.end_utc"
        side_effects:
          - "status := COMPLETED"
          - "FmChannelAssignment for this showtime: status := RELEASED"
          - "increments Showtime.version by 1"

  # ---- PrivateRental: BRANCHING (REQUESTED -> {APPROVED, REJECTED}) ----
  - entity: PrivateRental
    initial_state: REQUESTED
    terminal_states: [REJECTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /private-rentals/{id}/approve"
        actor: VenueOperator
        preconditions:
          - "rental.status == REQUESTED"
          - "no other APPROVED PrivateRental on rental.lot_id whose [start_utc,end_utc] closed interval overlaps this one"
          - "no Showtime on rental.lot_id with status IN {SCHEDULED, WEATHER_HOLD} whose [start_utc,end_utc) intersects this hold window"
          - "expected_private_rental_version matches rental.version (OCC)"
        side_effects:
          - "status := APPROVED"
          - "Lot.status := CLOSED for the hold (lot is exclusively held)"
          - "increments PrivateRental.version by 1"
        note: "Closed-interval, whole-lot exclusive hold (distinct interval semantics from showtime half-open+buffer scheduling)."
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /private-rentals/{id}/reject"
        actor: VenueOperator
        preconditions:
          - "rental.status == REQUESTED"
        side_effects:
          - "status := REJECTED"
          - "increments PrivateRental.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /private-rentals/{id}/cancel"
        actor: VenueOperator
        preconditions:
          - "rental.status == APPROVED"
        side_effects:
          - "status := CANCELLED"
          - "Lot.status := OPEN (releases the exclusive hold)"
          - "increments PrivateRental.version by 1"

  # ---- ConcessionOrder: LINEAR WITH REVERT (PENDING->PAID->FULFILLED, ->CANCELLED) ----
  - entity: ConcessionOrder
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "POST /concession-orders/{id}/pay"
        actor: Patron
        preconditions:
          - "order.status == PENDING"
          - "parent Reservation.occupancy_status IN {CONFIRMED, CHECKED_IN, SCANNED}"
        side_effects:
          - "status := PAID"
          - "increments ConcessionOrder.version by 1"
      - from: PAID
        to: FULFILLED
        trigger: "POST /concession-orders/{id}/fulfill"
        actor: GateAttendant
        preconditions:
          - "order.status == PAID"
          - "parent Reservation.occupancy_status == SCANNED"
        side_effects:
          - "status := FULFILLED"
          - "increments ConcessionOrder.version by 1"
        note: "Cross-entity guard: order can only be fulfilled after the patron has physically scanned in."
      - from: "PENDING or PAID"
        to: CANCELLED
        trigger: "POST /concession-orders/{id}/cancel OR cascade from Reservation/Showtime cancel"
        actor: Patron
        preconditions:
          - "order.status IN {PENDING, PAID}"
        side_effects:
          - "status := CANCELLED"
          - "if order.status was PAID: create RefundRecord{source_type=CONCESSION_ORDER, reason=VOLUNTARY_CANCEL when patron-initiated / RESERVATION_CASCADE when cascaded, amount_cents=order.total_cents}"
          - "increments ConcessionOrder.version by 1"

  # ---- SeasonPass: simple lifecycle with revocation (terminal REVOKED) ----
  - entity: SeasonPass
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /season-passes/{id}/revoke"
        actor: VenueOperator
        preconditions:
          - "pass.status == ACTIVE"
        side_effects:
          - "status := REVOKED"
          - "increments SeasonPass.version by 1"
        note: "Revocation does not retroactively cancel reservations already created against the pass; it only blocks new redemptions."

# =============================================================================
# 1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-showtime
    parent_entity: Showtime
    write_endpoint: "POST /reservations"
    occ_field: "expected_showtime_version"
    description: |
      Creating a Reservation against a Showtime whose version has advanced since
      the client last observed it is rejected with a stale-version error. A
      reservation create legitimately succeeds against identical observed state
      (capacity permitting), so two strictly sequential creates that both carry
      the same observed showtime version cannot both bind the same last stall:
      the first create advances Showtime.version (via reserved_stall_count
      reconciliation), and the second — still carrying the old version — is
      rejected as stale before its capacity check runs.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: rental-approve-stale-rental
    parent_entity: PrivateRental
    write_endpoint: "POST /private-rentals/{id}/approve"
    occ_field: "expected_private_rental_version"
    description: |
      Approving a PrivateRental whose version has advanced since the client last
      observed it is rejected with a stale-version error. This guards the case
      where the rental record was mutated (e.g. another operator already acted on
      it) after the approving client read it; the stale view is rejected before
      the interval-overlap check runs.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: reservation_pricing
    trigger: "POST /reservations (computes amount_due_cents at creation)"
    algorithm: tiered_pricing
    formula: |
      # Mode-branching combinatorial formula with >=3 inputs and non-linear interaction.
      if reservation.season_pass_id != null:
          # Pass covers regular admission; double-feature surcharge is still charged.
          gross = (showtime.double_feature_surcharge_cents if showtime.is_double_feature else 0)
          # promo_pct does NOT apply to a pass redemption.
          amount_due_cents = gross
      else:
          if showtime.pricing_mode == "PER_CAR":
              extra_people = max(0, reservation.occupant_count - showtime.included_occupants)
              gross = (showtime.base_price_cents
                       + extra_people * showtime.per_extra_person_cents
                       + (showtime.double_feature_surcharge_cents if showtime.is_double_feature else 0))
          else:  # PER_PERSON
              gross = (reservation.occupant_count * showtime.base_price_cents
                       + (showtime.double_feature_surcharge_cents if showtime.is_double_feature else 0))
          # Discount is computed on the whole gross, rounded once (sum-then-round).
          discount = round_half_up(gross * reservation.promo_pct)
          amount_due_cents = gross - discount
    input_set: "Single Showtime + single Reservation under construction; no aggregation over siblings."
    constants: {}
    precision: "Integer cents; round_half_up on the single discount step."
    variants:
      - name: per_car_pricing
        when: "showtime.pricing_mode == PER_CAR and season_pass_id == null"
        difference: "Base covers included_occupants; only occupants beyond that are charged per_extra_person_cents. occupant_count below the included threshold does NOT reduce the base."
      - name: per_person_pricing
        when: "showtime.pricing_mode == PER_PERSON and season_pass_id == null"
        difference: "Every occupant is charged base_price_cents; included_occupants/per_extra_person_cents are ignored entirely."
      - name: season_pass_pricing
        when: "season_pass_id != null"
        difference: "Regular admission waived to 0; only the double-feature surcharge is charged and promo_pct is ignored."

  - name: refund_amount
    trigger: "Reservation cancel (VOLUNTARY_CANCEL) and Showtime weather cancellation (WEATHER)"
    algorithm: threshold
    formula: |
      # DUAL-VARIANT: two valid algorithms over the same amount_paid_cents.
      paid = reservation.amount_paid_cents
      if reason == "WEATHER":
          # Pro-rata by unscreened features at the moment of cancellation.
          total_features = 2 if showtime.is_double_feature else 1
          remaining = min(weather_event.features_remaining, total_features)
          refund = round_half_up(paid * remaining / total_features)   # sum-then-round
      elif reason == "VOLUNTARY_CANCEL":
          # Chronological policy tier by hours between (now) and showtime.start_utc.
          hours_before = (showtime.start_utc - clock_now) / 3600 seconds
          if   hours_before >= 48: pct = 1.00
          elif hours_before >= 24: pct = 0.50
          elif hours_before >=  2: pct = 0.25
          else:                    pct = 0.00
          refund = round_half_up(paid * pct)
      # RESERVATION_CASCADE concession refunds are not computed here (full order total).
    input_set: "The reservation being cancelled; for WEATHER also the triggering WeatherEvent; clock_now from the logical clock."
    constants:
      TIER_48H_PCT: 1.00
      TIER_24H_PCT: 0.50
      TIER_2H_PCT: 0.25
      TIER_LATE_PCT: 0.00
    precision: "Integer cents; round_half_up once on the final product."
    variants:
      - name: weather_pro_rata
        when: "reason == WEATHER"
        difference: "Forward-looking: refund proportional to unscreened features, independent of timing; a double feature stopped after feature 1 refunds 50% even if cancelled mid-event."
      - name: voluntary_policy_tier
        when: "reason == VOLUNTARY_CANCEL"
        difference: "Chronological: refund driven purely by hours-before-start tier (>= boundaries), independent of how many features would have been seen."

  - name: concession_order_total
    trigger: "POST /reservations/{id}/concession-orders (computes subtotal/tax/service_fee/total at creation)"
    algorithm: aggregation
    formula: |
      # Nested-rounding combinatorial formula: ORDER OF ROUNDING IS PINNED.
      subtotal_cents = 0
      tax_cents = 0
      for line in order.lines:                       # iterate lines in REQUEST ORDER
          item = ConcessionItem(line.concession_item_id)
          line_total = item.unit_price_cents * line.qty
          subtotal_cents += line_total
          tax_cents += round_half_up(line_total * item.tax_rate)   # ROUND PER LINE, then sum
      service_fee_cents = round_half_up(subtotal_cents * SERVICE_FEE_PCT)  # round ONCE on subtotal
      total_cents = subtotal_cents + tax_cents + service_fee_cents
    input_set: "All lines of the single order under construction; each line's ConcessionItem must be available==true."
    constants:
      SERVICE_FEE_PCT: 0.05
    precision: "Integer cents; round_half_up PER LINE for tax, then a SINGLE round_half_up for the service fee. 'round-per-line then sum' is pinned; 'sum then round' is explicitly NOT used."
    variants:
      - name: per_line_tax_rounding
        when: "always (this is the pinned order)"
        difference: "Tax is rounded for each line and the rounded line-taxes are summed; summing exact line taxes then rounding once would yield a different cent total."

  - name: private_rental_quote
    trigger: "POST /private-rentals (computes quote_cents at creation)"
    algorithm: tiered_pricing
    formula: |
      duration_hours = ceil((rental.end_utc - rental.start_utc) / 3600 seconds)  # round UP to whole hours
      quote_cents = rental.flat_venue_fee_cents + rental.per_hour_cents * duration_hours
    input_set: "Single PrivateRental under construction."
    constants: {}
    precision: "Integer cents; duration ceil to whole hours."
    variants:
      - name: ceil_hours_billing
        when: "always"
        difference: "Any partial hour is billed as a full hour (ceil); a 3h01m hold bills 4 hours."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /venues bootstrap admin endpoints (still require headers)"
  - priority: 2
    category: auth
    check: "The acting role is permitted to call this endpoint per §1.7."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "For a Patron acting on a Reservation/ConcessionOrder/SeasonPass, X-User-ID equals the owning patron_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Patron-owned reservation/concession/pass mutations"
  - priority: 4
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 5
    category: business_constraint
    check: "Request body is well-formed: required fields present, enums valid, numeric ranges respected (occupant_count>=1, qty>=1, promo_pct in [0,1], pricing_mode valid)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/update endpoints"
  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is allowed (see §1.2 from-states)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /reservations; POST /private-rentals/{id}/approve; POST /reservations/{id}/cancel"
  - priority: 8
    category: business_referential
    check: "Showtime film/lot consistency: showtime.lot_id belongs to showtime.venue_id; secondary_film_id non-null IFF is_double_feature true; films exist."
    error_id: ERR_SHOWTIME_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /showtimes"
  - priority: 9
    category: business_temporal
    check: "Showtime scheduling: the showtime's [start_utc, end_utc) plus turnaround buffer must not collide with another SCHEDULED/WEATHER_HOLD showtime on the same lot (half-open + buffer interval semantics)."
    error_id: ERR_SHOWTIME_OVERLAP
    http_status: 409
    applies_to: "POST /showtimes"
  - priority: 10
    category: business_temporal
    check: "Private rental scheduling: the rental's [start_utc, end_utc] closed window must not overlap any APPROVED PrivateRental or any SCHEDULED/WEATHER_HOLD Showtime on the same lot (closed whole-lot exclusive interval semantics)."
    error_id: ERR_RENTAL_CONFLICT
    http_status: 409
    applies_to: "POST /private-rentals/{id}/approve"
  - priority: 11
    category: business_referential
    check: "Reservation pricing mode match: a PER_PERSON showtime reservation must omit vehicle-only fields; a season_pass_id (if present) must be ACTIVE, owned by the patron, within its validity window, not exhausted, and the showtime.start_utc <= pass.valid_to_utc."
    error_id: ERR_PASS_INVALID
    http_status: 422
    applies_to: "POST /reservations"
  - priority: 12
    category: business_constraint
    check: "Season pass redemption budget: a reservation create against a pass requires pass.redemptions_used < pass.max_redemptions."
    error_id: ERR_PASS_EXHAUSTED
    http_status: 409
    applies_to: "POST /reservations (with season_pass_id)"
  - priority: 13
    category: business_constraint
    check: "Concession item availability: every line's ConcessionItem.available must be true and belong to the reservation's venue."
    error_id: ERR_ITEM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /reservations/{id}/concession-orders"
  - priority: 14
    category: business_fiscal
    check: "Stall capacity: a PER_CAR reservation requires showtime.reserved_stall_count < lot.stall_count."
    error_id: ERR_LOT_FULL
    http_status: 409
    applies_to: "POST /reservations (PER_CAR)"
  - priority: 15
    category: business_fiscal
    check: "Person capacity: a PER_PERSON reservation requires showtime.reserved_person_count + occupant_count <= lot.person_capacity."
    error_id: ERR_PERSON_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /reservations (PER_PERSON)"
  - priority: 16
    category: business_fiscal
    check: "FM channel exhaustion: when assigning a channel, at least one frequency in venue.fm_channel_pool must be free of time-overlapping showtimes."
    error_id: ERR_NO_FM_CHANNEL
    http_status: 409
    applies_to: "POST /showtimes/{id}/fm-channel"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Catalog / setup ----
  - method: POST
    path: "/venues"
    description: "Create a venue with its FM channel pool and operational buffers."
    roles: [PlatformAdmin]
    code: 201
    input: [name, "timezone?", fm_channel_pool, "turnaround_buffer_minutes?", "no_show_grace_minutes?"]
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{id}"
    description: "Fetch a venue."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: POST
    path: "/lots"
    description: "Create a parking lot under a venue."
    roles: [PlatformAdmin, VenueOperator]
    code: 201
    input: [venue_id, name, stall_count, person_capacity]
    output: Lot
    side_effects: []
  - method: GET
    path: "/lots/{id}"
    description: "Fetch a lot (includes derived status)."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: Lot
    side_effects: []
  - method: GET
    path: "/lots"
    description: "List lots, optionally filtered by venue_id."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []
  - method: POST
    path: "/films"
    description: "Create a film in the catalog."
    roles: [PlatformAdmin, VenueOperator]
    code: 201
    input: [title, runtime_minutes, rating]
    output: Film
    side_effects: []
  - method: GET
    path: "/films/{id}"
    description: "Fetch a film."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: Film
    side_effects: []
  - method: POST
    path: "/concession-items"
    description: "Create a concession menu item for a venue."
    roles: [PlatformAdmin, VenueOperator]
    code: 201
    input: [venue_id, name, unit_price_cents, "tax_rate?", "available?"]
    output: ConcessionItem
    side_effects: []
  - method: GET
    path: "/concession-items/{id}"
    description: "Fetch a single concession item."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: ConcessionItem
    side_effects: []
  - method: GET
    path: "/concession-items"
    description: "List concession items, optionally filtered by venue_id."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: ConcessionItem[]
    side_effects: []

  # ---- Showtimes ----
  - method: POST
    path: "/showtimes"
    description: "Schedule a showtime on a lot; computes end_utc, enforces overlap+buffer and config validity."
    roles: [VenueOperator]
    code: 201
    input: [venue_id, lot_id, primary_film_id, "secondary_film_id?", "is_double_feature?", start_utc, pricing_mode, base_price_cents, "included_occupants?", "per_extra_person_cents?", "double_feature_surcharge_cents?"]
    output: Showtime
    side_effects: ["compute end_utc from film runtimes", "ERR_SHOWTIME_OVERLAP on lot interval collision", "ERR_SHOWTIME_CONFIG_INVALID on film/lot/double-feature mismatch"]
  - method: GET
    path: "/showtimes/{id}"
    description: "Fetch a showtime incl. derived reserved_stall_count / reserved_person_count."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: Showtime
    side_effects: []
  - method: GET
    path: "/showtimes"
    description: "List showtimes, filterable by venue_id and lot_id."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: ["venue_id?", "lot_id?", "primary_film_id?", "secondary_film_id?", "limit?", "offset?"]
    output: Showtime[]
    side_effects: []
  - method: POST
    path: "/showtimes/{id}/fm-channel"
    description: "Waterfall-assign the first free FM frequency from the venue pool to this showtime."
    roles: [VenueOperator]
    code: 201
    input: []
    output: FmChannelAssignment
    side_effects: ["assign frequency = first pool entry free of time-overlapping showtimes", "ERR_NO_FM_CHANNEL when none free"]
  - method: GET
    path: "/showtimes/{id}/fm-channel"
    description: "List FM channel assignment(s) for a showtime (reverse-reachability for FmChannelAssignment.showtime_id)."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: FmChannelAssignment[]
    side_effects: []
  - method: POST
    path: "/showtimes/{id}/weather-events"
    description: "Record a weather event: ADVISORY -> WEATHER_HOLD; CANCELLATION -> cancel showtime with pro-rata refund cascade."
    roles: [VenueOperator]
    code: 201
    input: [severity, "features_remaining?"]
    output: WeatherEvent
    side_effects: ["ADVISORY: showtime SCHEDULED->WEATHER_HOLD", "CANCELLATION: showtime->CANCELLED; cascade reservation+concession cancellations and refunds; release FM channel"]
  - method: GET
    path: "/showtimes/{id}/weather-events"
    description: "List weather events for a showtime (reverse-reachability for WeatherEvent.showtime_id)."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: WeatherEvent[]
    side_effects: []
  - method: POST
    path: "/showtimes/{id}/clear-weather-hold"
    description: "Return a WEATHER_HOLD showtime to SCHEDULED (cyclic clearance)."
    roles: [VenueOperator]
    code: 200
    input: []
    output: Showtime
    side_effects: ["showtime WEATHER_HOLD->SCHEDULED"]
  - method: POST
    path: "/showtimes/{id}/complete"
    description: "Mark a showtime COMPLETED once the logical clock has passed end_utc; releases FM channel."
    roles: [VenueOperator]
    code: 200
    input: []
    output: Showtime
    side_effects: ["showtime SCHEDULED->COMPLETED; release FM channel"]
  - method: POST
    path: "/showtimes/{id}/run-no-show-sweep"
    description: "Sweep CONFIRMED-but-unscanned reservations to NO_SHOW once clock >= start_utc + grace; releases their stall/person counts and pass redemptions."
    roles: [VenueOperator, GateAttendant]
    code: 200
    input: []
    output: Showtime
    side_effects: ["each eligible reservation occupancy CONFIRMED->NO_SHOW; reconcile reserved counts; restore season-pass redemptions"]

  # ---- Reservations ----
  - method: POST
    path: "/reservations"
    description: "Create a reservation against a showtime; prices it, debits capacity, OCC-checks the showtime version."
    roles: [Patron]
    code: 201
    input: [showtime_id, patron_id, occupant_count, "season_pass_id?", "promo_pct?", expected_showtime_version]
    output: Reservation
    side_effects: ["compute amount_due_cents via reservation_pricing", "mint gate_code", "showtime.reserved_stall_count/reserved_person_count += this reservation (derived reconciliation)", "if season_pass_id: SeasonPass.redemptions_used += 1", "increments Showtime.version by 1"]
  - method: GET
    path: "/reservations/{id}"
    description: "Fetch a reservation (both occupancy_status and payment_status, plus gate_code for the owner)."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: Reservation
    side_effects: []
  - method: GET
    path: "/reservations"
    description: "List reservations, filterable by showtime_id, lot_id, patron_id, season_pass_id."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: ["showtime_id?", "lot_id?", "patron_id?", "season_pass_id?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []
  - method: POST
    path: "/reservations/{id}/pay"
    description: "Capture payment for a reservation (UNPAID->PAID); sets amount_paid_cents."
    roles: [Patron]
    code: 200
    input: []
    output: Reservation
    side_effects: ["payment_status UNPAID->PAID", "amount_paid_cents := amount_due_cents"]
  - method: POST
    path: "/reservations/{id}/check-in"
    description: "Gate check-in (CONFIRMED->CHECKED_IN) within the pre-show window."
    roles: [GateAttendant]
    code: 200
    input: []
    output: Reservation
    side_effects: ["occupancy CONFIRMED->CHECKED_IN"]
  - method: POST
    path: "/reservations/{id}/scan"
    description: "Validate the gate code and admit (CHECKED_IN->SCANNED)."
    roles: [GateAttendant]
    code: 200
    input: [gate_code]
    output: Reservation
    side_effects: ["occupancy CHECKED_IN->SCANNED if gate_code matches"]
  - method: POST
    path: "/reservations/{id}/cancel"
    description: "Cancel a reservation; releases capacity, refunds per policy tier, cascades concession order cancellation/refund. OCC-guarded."
    roles: [Patron]
    code: 200
    input: [expected_reservation_version]
    output: Reservation
    side_effects: ["occupancy ->CANCELLED", "release reserved counts; restore pass redemption", "if PAID: refund_amount(VOLUNTARY_CANCEL)->REFUNDED + RefundRecord", "CASCADE concession orders CANCELLED + RefundRecord", "increments Reservation.version by 1"]

  # ---- Concession orders ----
  - method: POST
    path: "/reservations/{id}/concession-orders"
    description: "Create a concession pre-order on a reservation; computes subtotal/tax/service_fee/total."
    roles: [Patron]
    code: 201
    input: [lines]
    output: ConcessionOrder
    side_effects: ["compute totals via concession_order_total", "ERR_ITEM_UNAVAILABLE if any line item unavailable"]
  - method: GET
    path: "/reservations/{id}/concession-orders"
    description: "List concession orders for a reservation (reverse-reachability for ConcessionOrder.reservation_id)."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: ConcessionOrder[]
    side_effects: []
  - method: POST
    path: "/concession-orders/{id}/pay"
    description: "Pay a concession order (PENDING->PAID)."
    roles: [Patron]
    code: 200
    input: []
    output: ConcessionOrder
    side_effects: ["status PENDING->PAID"]
  - method: POST
    path: "/concession-orders/{id}/fulfill"
    description: "Fulfill a paid order (PAID->FULFILLED); requires parent reservation SCANNED."
    roles: [GateAttendant]
    code: 200
    input: []
    output: ConcessionOrder
    side_effects: ["status PAID->FULFILLED"]
  - method: POST
    path: "/concession-orders/{id}/cancel"
    description: "Cancel a concession order; refunds if it was PAID."
    roles: [Patron]
    code: 200
    input: []
    output: ConcessionOrder
    side_effects: ["status ->CANCELLED", "if was PAID: RefundRecord{reason=VOLUNTARY_CANCEL}"]

  # ---- Season passes ----
  - method: POST
    path: "/season-passes"
    description: "Issue a season pass to a patron."
    roles: [VenueOperator]
    code: 201
    input: [patron_id, tier, max_redemptions, valid_from_utc, valid_to_utc]
    output: SeasonPass
    side_effects: []
  - method: GET
    path: "/season-passes/{id}"
    description: "Fetch a season pass incl. redemptions_used."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: []
    output: SeasonPass
    side_effects: []
  - method: GET
    path: "/season-passes"
    description: "List season passes, filterable by patron_id."
    roles: [PlatformAdmin, VenueOperator, GateAttendant, Patron]
    code: 200
    input: ["patron_id?", "limit?", "offset?"]
    output: SeasonPass[]
    side_effects: []
  - method: POST
    path: "/season-passes/{id}/revoke"
    description: "Revoke a season pass (ACTIVE->REVOKED); blocks new redemptions."
    roles: [VenueOperator]
    code: 200
    input: []
    output: SeasonPass
    side_effects: ["status ACTIVE->REVOKED"]

  # ---- Private rentals ----
  - method: POST
    path: "/private-rentals"
    description: "Request a private rental of a lot for a window; computes quote_cents."
    roles: [VenueOperator]
    code: 201
    input: [venue_id, lot_id, organizer_id, start_utc, end_utc, flat_venue_fee_cents, per_hour_cents]
    output: PrivateRental
    side_effects: ["compute quote_cents via private_rental_quote"]
  - method: GET
    path: "/private-rentals/{id}"
    description: "Fetch a private rental."
    roles: [PlatformAdmin, VenueOperator, GateAttendant]
    code: 200
    input: []
    output: PrivateRental
    side_effects: []
  - method: GET
    path: "/private-rentals"
    description: "List private rentals, filterable by venue_id and lot_id."
    roles: [PlatformAdmin, VenueOperator, GateAttendant]
    code: 200
    input: ["venue_id?", "lot_id?", "limit?", "offset?"]
    output: PrivateRental[]
    side_effects: []
  - method: POST
    path: "/private-rentals/{id}/approve"
    description: "Approve a rental (REQUESTED->APPROVED); closes the lot exclusively. OCC-guarded; rejects on lot interval conflict."
    roles: [VenueOperator]
    code: 200
    input: [expected_private_rental_version]
    output: PrivateRental
    side_effects: ["status REQUESTED->APPROVED", "Lot.status->CLOSED", "ERR_RENTAL_CONFLICT on interval overlap", "increments PrivateRental.version by 1"]
  - method: POST
    path: "/private-rentals/{id}/reject"
    description: "Reject a rental request (REQUESTED->REJECTED)."
    roles: [VenueOperator]
    code: 200
    input: []
    output: PrivateRental
    side_effects: ["status REQUESTED->REJECTED"]
  - method: POST
    path: "/private-rentals/{id}/cancel"
    description: "Cancel an approved rental (APPROVED->CANCELLED); reopens the lot."
    roles: [VenueOperator]
    code: 200
    input: []
    output: PrivateRental
    side_effects: ["status APPROVED->CANCELLED", "Lot.status->OPEN"]

  # ---- Refund records (read) ----
  - method: GET
    path: "/refund-records/{id}"
    description: "Fetch a refund record."
    roles: [PlatformAdmin, VenueOperator, Patron]
    code: 200
    input: []
    output: RefundRecord
    side_effects: []
  - method: GET
    path: "/refund-records"
    description: "List refund records, filterable by reservation_id and concession_order_id (reverse-reachability for RefundRecord FKs)."
    roles: [PlatformAdmin, VenueOperator, Patron]
    code: 200
    input: ["reservation_id?", "concession_order_id?", "limit?", "offset?"]
    output: RefundRecord[]
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to an arbitrary instant for deterministic time-gated tests. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock := to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unrecognized role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted to call this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Patron acting on a reservation/concession-order/season-pass not owned by X-User-ID."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A referenced venue/lot/film/showtime/reservation/order/pass/rental/refund/item does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, out-of-range number (occupant_count<1, qty<1, promo_pct outside [0,1])."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not allowed from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version on a guarded write."
  - id: ERR_SHOWTIME_CONFIG_INVALID
    http: 422
    condition: "Showtime film/lot mismatch, lot not in venue, or is_double_feature/secondary_film_id inconsistency."
  - id: ERR_SHOWTIME_OVERLAP
    http: 409
    condition: "New showtime's [start,end) plus turnaround buffer collides with another active showtime on the same lot."
  - id: ERR_RENTAL_CONFLICT
    http: 409
    condition: "Rental approval window overlaps an APPROVED rental or active showtime on the same lot."
  - id: ERR_PASS_INVALID
    http: 422
    condition: "Season pass not ACTIVE, not owned, outside validity window, or showtime.start_utc > pass.valid_to_utc."
  - id: ERR_PASS_EXHAUSTED
    http: 409
    condition: "Season pass has redemptions_used >= max_redemptions at reservation create."
  - id: ERR_ITEM_UNAVAILABLE
    http: 409
    condition: "A concession order line references an item with available==false or belonging to a different venue."
  - id: ERR_LOT_FULL
    http: 409
    condition: "PER_CAR reservation when showtime.reserved_stall_count >= lot.stall_count."
  - id: ERR_PERSON_CAPACITY_EXCEEDED
    http: 409
    condition: "PER_PERSON reservation when reserved_person_count + occupant_count > lot.person_capacity."
  - id: ERR_NO_FM_CHANNEL
    http: 409
    condition: "No FM frequency in the venue pool is free of time-overlapping showtimes at assignment time."
  - id: ERR_GATE_CODE_MISMATCH
    http: 409
    condition: "Scan presented a gate_code that does not match the reservation's gate_code."
  - id: ERR_CHECKIN_WINDOW_CLOSED
    http: 409
    condition: "Check-in attempted before showtime.start_utc - 60 minutes."
  - id: ERR_COMPLETE_TOO_EARLY
    http: 409
    condition: "Showtime complete attempted before the logical clock reaches end_utc."
  - id: ERR_SWEEP_TOO_EARLY
    http: 409
    condition: "No-show sweep attempted before logical clock reaches showtime.start_utc + no_show_grace_minutes."
  - id: ERR_WEATHER_FEATURES_INVALID
    http: 422
    condition: "CANCELLATION weather event with features_remaining outside [0, total_features] for the showtime."
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "Pagination limit out of [1,100] or offset negative."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator surface for top-level catalog bootstrap and the test clock; not tied to a persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /venues"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /lots, POST /films, POST /concession-items (with VenueOperator)"
      - "all GET reads"
  - name: VenueOperator
    description: "Runs a venue: schedules showtimes, manages weather/rentals/passes/FM channels."
    identity: "opaque"
    exclusive_operations:
      - "POST /showtimes and all /showtimes/{id}/* operator actions (fm-channel, weather-events, clear-weather-hold, complete)"
      - "POST /season-passes and /season-passes/{id}/revoke"
      - "POST /private-rentals and /private-rentals/{id}/{approve,reject,cancel}"
    shared_operations:
      - "POST /lots, POST /films, POST /concession-items (with PlatformAdmin)"
      - "POST /showtimes/{id}/run-no-show-sweep (with GateAttendant)"
      - "all GET reads"
  - name: GateAttendant
    description: "Works the gate: check-in, scan, no-show sweep, concession fulfillment."
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations/{id}/check-in"
      - "POST /reservations/{id}/scan"
      - "POST /concession-orders/{id}/fulfill"
    shared_operations:
      - "POST /showtimes/{id}/run-no-show-sweep (with VenueOperator)"
      - "all GET reads"
  - name: Patron
    description: "End customer: makes reservations, pays, pre-orders concessions, cancels. X-User-ID is the opaque patron_id stored on owned resources."
    identity: "opaque"
    exclusive_operations:
      - "POST /reservations and /reservations/{id}/{pay,cancel}"
      - "POST /reservations/{id}/concession-orders and /concession-orders/{id}/{pay,cancel}"
    shared_operations:
      - "all GET reads (own resources)"
