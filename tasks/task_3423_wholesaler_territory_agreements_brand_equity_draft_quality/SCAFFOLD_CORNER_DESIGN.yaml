              as: BrewerAdmin
              captures: { rvd_id: $.data.id }
          trigger:
            - call: "POST /performance-reviews/${rvd_id}/response"
              payload: { action: "DISPUTE", dispute_reason: "share undercounted in chain accounts" }
              as: WholesalerPrincipal
              as_user_id: "${wdp_id}"
              captures: { rvd_status: $.data.status }
            - call: "POST /performance-reviews/${rvd_id}/response"
