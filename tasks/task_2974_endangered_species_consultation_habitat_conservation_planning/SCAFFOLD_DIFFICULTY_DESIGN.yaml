              captures: {hcp_id: "$.data.id", hcp_v1: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "PERMITTEE_RESPONSIBLE", units: 10.00, expected_hcp_version: "${hcp_v1}"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {c1_endow: "$.data.endowment_contribution_cents", c1_base_fee: "$.data.base_fee_cents"}
            - call: "GET /habitat-conservation-plans/${hcp_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_v2: "$.data.version", required: "$.data.endowment_required_cents", base: "$.data.endowment_base_cents"}
          trigger:
            - call: "POST /habitat-conservation-plans/${hcp_id}/funding-assurances"
              payload: {contribution_cents: 701399, instrument_type: "IRREVOCABLE_LETTER_OF_CREDIT"}
              as: Proponent
              as_user_id: "${proponent_id}"
          assert:
            - "the captured ${c1_base_fee} == 2100000 (10.00 * 210000), ${c1_endow} == 1252500, ${base} == 1252500 and ${required} == 1402800"
            - "the trigger returns 200 with endowment_secured_cents == 701399"
            - "funding_status == 'UNFUNDED': 701399 * 2 == 1402798 < 1402800, one cent short of the exact half"
            - "funded_ratio == 0.5000 in the very same response (round_half_up(701399 / 1402800, 4) from 0.49999928...), so the reporting field and the status deliberately disagree"
            - "a second contribution of exactly 1 cent takes endowment_secured_cents to 701400 and funding_status to 'PARTIALLY_ASSURED' while funded_ratio is STILL 0.5000 — the status flips with no visible change in the ratio"
            - "a third contribution of 701400 cents takes endowment_secured_cents to 1402800, funded_ratio to 1.0000 and funding_status to 'FULLY_ASSURED' (the >= comparison, met exactly)"
            - "plan_status stays 'DRAFT' throughout: the UNFUNDED -> UNFUNDED contribution is accepted (UNFUNDED is a declared from-state for this trigger), it simply moves no dimension, and it is NOT an ERR_INVALID_STATE_TRANSITION"
            - "one more contribution of 1 cent after FULLY_ASSURED is still accepted, giving endowment_secured_cents 1402801 and funded_ratio 1.0000 with funding_status unchanged — over-funding is not an error"

      - name: empty_candidate_set_is_no_effect_not_an_error
        grounds:
          - calculations.effect_determination_matrix.input_set
          - calculations.effect_determination_matrix.constants.NO_EFFECT_OVERLAP_PCT_MAX
          - calculations.presence_status_derivation
          - state_machines[ProjectAction].transitions["SCREENING -> CLEARED_NO_EFFECT"]
          - errors["ERR_NO_PRESENCE_DETERMINATIONS"]
          - endpoints["POST /project-actions/{id}/effect-determination"]
        distinguishing_aspect: >-
          METRIC: SET CARDINALITY at zero, plus the 0.00 acreage boundary, probed
          on POST /project-actions/{id}/effect-determination — a third endpoint
          and a third kind of boundary (an empty aggregate rather than a ratio or
          a cent comparison). Two rows exist but both are filtered out, so the
          action must reach the terminal CLEARED_NO_EFFECT with total_overlap_acres
          0.00 even though 19.75 acres of habitat overlap are on file; the
          neighbouring zero-ROWS case is the error instead.
        test_recipe:
          setup:
            - "SP-E is registered with survey season months 4..7."
            - "The action has footprint_acres 200.00 and two presence determinations, both filtered out of the candidate set: PD1 is FIELD_SURVEY NOT_DETECTED with an in-season window 2026-05-04..2026-05-08 and habitat_overlap_acres 12.50 -> ABSENT; PD2 is DATABASE_QUERY NOT_DETECTED with habitat_overlap_acres 7.25 -> PRESUMED_ABSENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "NOT_DETECTED", habitat_overlap_acres: 12.50, survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd1_status: "$.data.presence_status", pd1_in_season: "$.data.survey_in_season"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "DATABASE_QUERY", detection_result: "NOT_DETECTED", habitat_overlap_acres: 7.25}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {pd2_status: "$.data.presence_status", pd2_in_season: "$.data.survey_in_season"}
          trigger:
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
          assert:
            - "the captured ${pd1_status} == 'ABSENT' with ${pd1_in_season} == true, and ${pd2_status} == 'PRESUMED_ABSENT' with ${pd2_in_season} == false"
            - "the trigger returns 200 (not an error) with ProjectAction.effect_determination == 'NO_EFFECT'"
            - "total_overlap_acres == 0.00 and overlap_pct == 0.00 — the 12.50 and 7.25 acres of the filtered rows are NOT summed"
            - "status == 'CLEARED_NO_EFFECT', the entity's only terminal state, and active_consultation_id == null: this branch creates no Consultation at all"
            - "GET /project-actions/${action_id}/consultations returns an empty list with total_count == 0"
            - "the neighbouring cardinality case is an error, not NO_EFFECT: the same call on a second action with ZERO presence determinations returns ERR_NO_PRESENCE_DETERMINATIONS (422)"
            - "the seasonality boundary is what makes PD1 filterable: an otherwise identical FIELD_SURVEY NOT_DETECTED row with an out-of-season window 2026-01-10..2026-01-14 derives 'PRESUMED_PRESENT', and on a third action that row alone yields overlap_pct 6.25 and effect_determination 'LAA'"
            - "POST /project-actions/${action_id}/effect-determination a second time returns ERR_INVALID_STATE_TRANSITION (409): CLEARED_NO_EFFECT is terminal"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: plan_approval_reads_biological_opinion_conclusion_of_another_aggregate
        grounds:
          - state_machines[HabitatConservationPlan].state_field["plan_status"].transitions["SUBMITTED -> APPROVED"]
          - entities.BiologicalOpinion.fields.conclusion
          - entities.BiologicalOpinion.fields.rpa_description
          - validations[priority 16]
          - errors["ERR_JEOPARDY_UNRESOLVED"]
          - endpoints["POST /habitat-conservation-plans/{id}/decision"]
        distinguishing_aspect: >-
          ENTITY PAIR: HabitatConservationPlan depends on BiologicalOpinion — two
          rows in different aggregates, reachable only through
          HabitatConservationPlan -> ProjectAction -> Consultation ->
          BiologicalOpinion, with no FK between them. Everything local to the
          plan is in order here (FULLY_ASSURED, no shortfall, plan_status
          SUBMITTED), so the ONLY reason the transition fails is a field on the
          far entity. Unlike the priority-pair instance that also uses this
          error, exactly one rule is violated.
        test_recipe:
          setup:
            - "SP-E has recovery_unit_population 80, so the biological opinion issued with no rpa_description concludes JEOPARDY (jeopardy_fraction 0.0500, rpa_required true)."
            - "The action has one FIELD_SURVEY DETECTED determination for SP-E, 10.00 acres, citing CHU-1 -> final_mitigation_units 45.00 (10.00 * 3.0 * 1.5)."
            - "The plan commits exactly 45.00 bank credits (endowment_base_cents 3381750, reserve 405810, endowment_required_cents 3787560) and funds it in full, so secured_mitigation_units 45.00 >= final_mitigation_units 45.00 and funding_status is FULLY_ASSURED."
            - "The plan is submitted, leaving plan_status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 80, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /conservation-banks"
              payload: {bank_name: "Mojave Habitat Bank", covered_species_id: "${species_e_id}", service_area_county_codes: ["06037"], credit_price_cents: 250000, credits_total_minted: 500.00}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {bank_id: "$.data.id"}
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {action_id: "$.data.id"}
            - call: "POST /project-actions/${action_id}/presence-determinations"
              payload: {species_id: "${species_e_id}", method: "FIELD_SURVEY", detection_result: "DETECTED", habitat_overlap_acres: 10.00, critical_habitat_unit_id: "${chu1_id}", survey_window_start: "2026-05-04", survey_window_end: "2026-05-08"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /project-actions/${action_id}/effect-determination"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {consultation_id: "$.data.active_consultation_id"}
            - call: "POST /consultations/${consultation_id}/biological-assessment"
              payload: {ba_narrative: "Effects analysis for 10.00 acres of designated critical habitat.", ba_effects_analysis_complete: true}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "POST /consultations/${consultation_id}/biological-opinion"
              payload: {}
              as: WildlifeAgency
              as_user_id: "fws-user-issuer"
              captures: {bo_id: "$.data.id", bo_conclusion: "$.data.conclusion", bo_rpa_desc: "$.data.rpa_description"}
            - call: "POST /project-actions/${action_id}/habitat-conservation-plans"
              payload: {plan_name: "Sunrise Park HCP", covered_acres: 20.00, permit_term_years: 30}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_id: "$.data.id", hcp_v1: "$.data.version"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/mitigation-commitments"
              payload: {mechanism: "CONSERVATION_BANK_CREDIT", units: 45.00, expected_hcp_version: "${hcp_v1}", conservation_bank_id: "${bank_id}"}
              as: Proponent
              as_user_id: "${proponent_id}"
            - call: "GET /habitat-conservation-plans/${hcp_id}"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {hcp_v2: "$.data.version", required: "$.data.endowment_required_cents"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/funding-assurances"
              payload: {contribution_cents: 3787560, instrument_type: "IRREVOCABLE_LETTER_OF_CREDIT"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {fs: "$.data.funding_status"}
            - call: "POST /habitat-conservation-plans/${hcp_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {final_units: "$.data.final_mitigation_units", secured_units: "$.data.secured_mitigation_units"}
          trigger:
            - call: "POST /habitat-conservation-plans/${hcp_id}/decision"
              payload: {decision: "APPROVE", decision_note: "All local issuance criteria satisfied."}
              as: WildlifeAgency
              as_user_id: "fws-user-approver"
          assert:
            - "the captured ${bo_conclusion} == 'JEOPARDY' with ${bo_rpa_desc} == null, ${required} == 3787560, ${fs} == 'FULLY_ASSURED', ${final_units} == 45.00 and ${secured_units} == 45.00 — every plan-local criterion passes"
            - "the trigger returns ERR_JEOPARDY_UNRESOLVED with HTTP 422, decided entirely by a field on a BiologicalOpinion row that the request never names"
            - "GET /habitat-conservation-plans/${hcp_id} still reports plan_status == 'SUBMITTED', approved_by_user_id == null and funding_status == 'FULLY_ASSURED'"
            - "GET /habitat-conservation-plans/${hcp_id}/mitigation-commitments shows the commitment still 'RESERVED', and GET /conservation-banks/${bank_id} shows credits_reserved == 45.00 with credits_transferred == 0.00"
            - "the dependency is on the conclusion VALUE, not on the mere existence of an opinion: an otherwise identical run whose opinion was issued WITH rpa_description (conclusion 'JEOPARDY_WITH_RPA') has the same APPROVE call return 200, plan_status 'APPROVED', the commitment 'SECURED' and the bank at credits_reserved 0.00 / credits_transferred 45.00"
            - "the gate is APPROVE-specific: POST /habitat-conservation-plans/${hcp_id}/decision with decision 'RETURN_FOR_REVISION' succeeds on the JEOPARDY plan, taking plan_status to 'DRAFT', the commitment to 'RELEASED', endowment_required_cents to 0 and funding_status to 'UNFUNDED'"
            - "GET /consultations/${consultation_id}/biological-opinions still returns exactly one row: no decision attempt rewrote the opinion"

