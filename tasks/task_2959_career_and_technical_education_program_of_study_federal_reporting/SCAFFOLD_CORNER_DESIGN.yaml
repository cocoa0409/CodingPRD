        grounds:
          - state_machines.ProgramOfStudy.CERTIFIED_to_EXPIRED
          - state_machines.ProgramOfStudy.EXPIRED_to_DATA_COLLECTION
          - validations[priority=14]
          - errors[ERR_LABOR_MARKET_DATA_STALE]
          - endpoints[PATCH /cte/programs-of-study/{id}]
          - entities.ProgramOfStudy.fields.clna_expires_on
