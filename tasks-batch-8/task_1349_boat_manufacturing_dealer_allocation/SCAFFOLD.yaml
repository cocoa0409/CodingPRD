# =============================================================================
# Scaffold: Boat Manufacturing & Dealer Allocation (Brunswick-style)
# =============================================================================

scenario: |
  Boat Manufacturing & Dealer Allocation (Brunswick style boat builder): model/option configuration & build slot booking, hull identification number assignment & certification, dealer order allocation & floor-plan financing, options change cutoff & production sequence, warranty registration & claim reimbursement rates, recall/safety defect notification, seasonal build vs demand & inventory carrying, boat show order surge

domain_name: boat-manufacturing-dealer-allocation
api_prefix: ""

complexity_profile:
  primary_archetype: quota-allocation
  secondary_archetype: compliance-audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all links via FK fields)
# =============================================================================
entities:
  - name: BoatModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique builder model code, e.g. SP190", constraints: "unique across BoatModel" }
      - { name: model_name, type: string, source: input, description: "Marketing name of the model" }
      - { name: model_year, type: integer, source: input, description: "Model year, e.g. 2027" }
      - { name: base_price_cents, type: integer, source: input, description: "MSRP base price in cents; never discounted by dealer standing", constraints: "> 0" }
      - { name: length_feet, type: number, source: input, description: "Hull length in feet" }
      - { name: production_hours, type: integer, source: input, description: "Base production-line hours consumed per boat of this model", constraints: "> 0" }
      - { name: status, type: enum, source: input, default: ORDERABLE, description: "ORDERABLE | DISCONTINUED; set at creation (catalog seeding), immutable thereafter", constraints: "one of ORDERABLE, DISCONTINUED" }

  - name: OptionPackage
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> BoatModel.id; the model this option fits" }
      - { name: option_code, type: string, source: input, description: "Unique option code, e.g. WAKE-TOWER", constraints: "unique across OptionPackage" }
      - { name: name, type: string, source: input, description: "Option display name" }
      - { name: price_cents, type: integer, source: input, description: "Option MSRP in cents before standing discount", constraints: "> 0" }
      - { name: production_hours, type: integer, source: input, description: "Additional line hours this option adds to the build", constraints: ">= 0" }
      - { name: incompatible_with_option_id, type: string, source: input, description: "FK -> OptionPackage.id; optional self-referential incompatibility (symmetric: if A declares B, B is treated as incompatible with A)", constraints: "nullable" }

  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: dealer_code, type: string, source: input, description: "Unique dealer code", constraints: "unique across Dealer" }
      - { name: name, type: string, source: input, description: "Dealership name" }
      - { name: region, type: string, source: input, description: "Sales region code, e.g. SE, NW" }
      - { name: standing, type: enum, source: input, default: STANDARD, description: "PREFERRED | STANDARD | PROBATION; drives option-line discount and deposit rate delta", constraints: "one of PREFERRED, STANDARD, PROBATION" }
      - { name: annual_allocation_quota, type: integer, source: input, description: "Maximum number of pipeline orders (status in ALLOCATED, COMMITTED, IN_PRODUCTION, DELIVERED) the dealer may hold", constraints: ">= 0" }
      - { name: allocation_used, type: integer, source: computed, default: 0, description: "Count of this dealer's orders with status in {ALLOCATED, COMMITTED, IN_PRODUCTION, DELIVERED}; WAITLISTED, RETAILED, CANCELLED excluded; recomputed on every order status change" }
      - { name: floor_plan_limit_cents, type: integer, source: input, description: "Floor-plan credit ceiling in cents", constraints: "> 0" }
      - { name: floor_plan_utilized_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding_principal_cents over this dealer's FloorPlanAdvance rows with status OPEN; invariant maintained on deliver/curtail" }
      - { name: current_rate_tier, type: enum, source: computed, default: TIER_STANDARD, description: "TIER_STANDARD | TIER_ELEVATED | TIER_HIGH; recomputed from floor_plan_utilized_cents/floor_plan_limit_cents on every advance open or curtailment", constraints: "one of TIER_STANDARD, TIER_ELEVATED, TIER_HIGH" }

  - name: BoatShowEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_name, type: string, source: input, description: "Show name, e.g. Miami International Boat Show" }
      - { name: region, type: string, source: input, description: "Region the show occupies; same-region shows may not overlap (closed interval)" }
      - { name: start_date, type: string, source: input, description: "First show day, ISO date; window is CLOSED: [start_date, end_date] inclusive both ends" }
      - { name: end_date, type: string, source: input, description: "Last show day, ISO date; must be >= start_date" }
      - { name: surge_deposit_rate, type: number, source: input, description: "Base deposit rate for BOAT_SHOW-source orders placed in this window, e.g. 0.05" }
      - { name: allocation_boost, type: integer, source: input, description: "Priority tier boost for waitlist promotion of orders tied to this event while clock is inside its window" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: plant_line_code, type: string, source: input, description: "Production line identifier; windows on the same line may not overlap (half-open)" }
      - { name: season, type: enum, source: input, description: "PEAK | SHOULDER | OFF_PEAK; drives seasonal carrying-cost weighting", constraints: "one of PEAK, SHOULDER, OFF_PEAK" }
      - { name: build_week_start, type: string, source: input, description: "ISO date; run occupies half-open window [build_week_start, build_week_end)" }
      - { name: build_week_end, type: string, source: input, description: "ISO date; must equal build_week_start + 7 days exactly" }
      - { name: option_change_cutoff_at, type: datetime, source: input, description: "UTC instant after which ALLOCATED-order option amendments are rejected; must be <= build_week_end end-of-day" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> CLOSED (terminal) via POST /production-runs/{id}/close", constraints: "one of OPEN, CLOSED" }
      - { name: total_carrying_actual_cents, type: integer, source: computed, default: 0, description: "Sum over AT_PLANT hulls of this run's slots of actual-days carrying cost at close (ACTUAL_DAYS variant)" }
      - { name: total_carrying_seasonal_cents, type: integer, source: computed, default: 0, description: "Sum over AT_PLANT hulls of this run's slots of season-weighted carrying cost at close (SEASON_WEIGHTED variant)" }
      - { name: closed_at, type: datetime, source: system, description: "Clock instant of close; null while OPEN", constraints: "nullable" }

  - name: BuildSlot
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: input, description: "FK -> ProductionRun.id; the run this capacity bucket belongs to" }
      - { name: slot_code, type: string, source: input, description: "Human slot label, unique within a run", constraints: "unique per run_id" }
      - { name: capacity_hours, type: integer, source: input, description: "Total production hours this slot can host", constraints: "> 0" }
      - { name: reserved_hours, type: integer, source: computed, default: 0, description: "Sum of production_hours of orders in {ALLOCATED, COMMITTED, IN_PRODUCTION} on this slot; conservation invariant target" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> RELEASED at run close (terminal); RELEASED slots reject new bookings", constraints: "one of OPEN, RELEASED" }

  - name: DealerOrder
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; must equal X-User-ID when role is DealerPrincipal" }
      - { name: model_id, type: string, source: input, description: "FK -> BoatModel.id" }
      - { name: slot_id, type: string, source: system, description: "FK -> BuildSlot.id; null while WAITLISTED; set on booking/promotion", constraints: "nullable" }
      - { name: show_event_id, type: string, source: input, description: "FK -> BoatShowEvent.id; required iff source == BOAT_SHOW, forbidden otherwise", constraints: "nullable" }
      - { name: source, type: enum, source: input, description: "RETAIL | FLEET | BOAT_SHOW", constraints: "one of RETAIL, FLEET, BOAT_SHOW" }
      - { name: status, type: enum, source: system, description: "WAITLISTED | ALLOCATED | COMMITTED | IN_PRODUCTION | DELIVERED | RETAILED | CANCELLED; creation lands in ALLOCATED when a slot is secured, else WAITLISTED", constraints: "see state machine" }
      - { name: base_price_cents, type: integer, source: computed, description: "Snapshot of BoatModel.base_price_cents at creation (price lock)" }
      - { name: options_total_cents, type: integer, source: computed, description: "Sum of OrderOptionLine.line_total_cents (per-line rounded, then summed — pinned order)" }
      - { name: surcharge_cents, type: integer, source: computed, description: "round_half_up((base_price_cents + options_total_cents) * 0.03)" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "base_price_cents + options_total_cents + surcharge_cents" }
      - { name: required_deposit_cents, type: integer, source: computed, description: "max(50000, round_half_up(invoice_total_cents * effective_rate)) per required_deposit calculation" }
      - { name: deposit_paid_cents, type: integer, source: input, description: "Deposit tendered at booking; amendable pre-cutoff", constraints: ">= 0" }
      - { name: production_hours, type: integer, source: computed, description: "model.production_hours + sum of line option production_hours" }
      - { name: cancel_fee_cents, type: integer, source: computed, description: "Restocking fee charged at cancel; null until CANCELLED", constraints: "nullable" }
      - { name: refund_cents, type: integer, source: computed, description: "max(0, deposit_paid_cents - cancel_fee_cents) at cancel; null until CANCELLED", constraints: "nullable" }

  - name: OrderOptionLine
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> DealerOrder.id" }
      - { name: option_package_id, type: string, source: input, description: "FK -> OptionPackage.id" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of OptionPackage.price_cents at line creation" }
      - { name: discount_pct_applied, type: number, source: computed, description: "Standing discount captured at line creation: PREFERRED 0.10, STANDARD 0.05, PROBATION 0.00" }
      - { name: line_total_cents, type: integer, source: computed, description: "round_half_up(unit_price_cents * (1 - discount_pct_applied)) — per-line rounding pinned" }

  - name: Hull
    parent: null
    common_fields: true
    fields:
      - { name: hin, type: string, source: computed, description: "12-char hull identification number per hin_assignment calculation; unique" }
      - { name: serial_no, type: integer, source: computed, description: "Per-(model_id, model_year) serial sequence starting at 1; next = max(existing)+1" }
      - { name: order_id, type: string, source: input, description: "FK -> DealerOrder.id; exactly one hull per order", constraints: "unique across Hull" }
      - { name: slot_id, type: string, source: system, description: "FK -> BuildSlot.id; copied from the order's booked slot" }
      - { name: model_id, type: string, source: system, description: "FK -> BoatModel.id; copied from the order" }
      - { name: certification_status, type: enum, source: system, default: UNCERTIFIED, description: "UNCERTIFIED -> CERTIFIED -> RECALL_HOLD -> CERTIFIED (parallel dimension 1)", constraints: "one of UNCERTIFIED, CERTIFIED, RECALL_HOLD" }
      - { name: delivery_status, type: enum, source: system, default: AT_PLANT, description: "AT_PLANT -> DELIVERED (parallel dimension 2; deliver gated on certification dimension)", constraints: "one of AT_PLANT, DELIVERED" }
      - { name: completed_at, type: datetime, source: system, description: "Clock instant of hull creation (production completion)" }
      - { name: delivered_at, type: datetime, source: system, description: "Clock instant of deliver; null until delivered", constraints: "nullable" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ProductionPlanner who created the hull; segregation-of-duties anchor" }
      - { name: carrying_cost_cents, type: integer, source: computed, default: 0, description: "Accumulated SEASON_WEIGHTED carrying cost posted at run close while AT_PLANT" }

  - name: FloorPlanAdvance
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; copied from the delivered order" }
      - { name: hull_id, type: string, source: system, description: "FK -> Hull.id; one advance per hull", constraints: "unique across FloorPlanAdvance" }
      - { name: principal_cents, type: integer, source: computed, description: "Order invoice_total_cents at delivery" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Remaining principal after curtailments" }
      - { name: accrued_interest_cents, type: integer, source: computed, default: 0, description: "Interest settled into curtailments so far (cumulative paid interest)" }
      - { name: rate_tier, type: enum, source: computed, description: "TIER_STANDARD | TIER_ELEVATED | TIER_HIGH; locked at opening from utilization INCLUDING this advance", constraints: "one of TIER_STANDARD, TIER_ELEVATED, TIER_HIGH" }
      - { name: annual_rate, type: number, source: computed, description: "0.06 | 0.075 | 0.095 per locked rate_tier" }
      - { name: opened_at, type: datetime, source: system, description: "Clock instant of delivery (advance opening)" }
      - { name: last_accrual_date, type: string, source: computed, description: "ISO date through which interest has been settled; initialized to opened_at date" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> PAID when outstanding_principal_cents reaches 0 via curtailment", constraints: "one of OPEN, PAID" }

  - name: WarrantyRegistration
    parent: null
    common_fields: true
    fields:
      - { name: hull_id, type: string, source: input, description: "FK -> Hull.id; exactly one registration per hull", constraints: "unique across WarrantyRegistration" }
      - { name: dealer_id, type: string, source: input, description: "FK -> Dealer.id; selling dealer; must own the delivered order and equal X-User-ID for DealerPrincipal" }
      - { name: retail_sale_date, type: string, source: input, description: "ISO date of retail sale; must be <= clock date and >= clock date - 45 days" }
      - { name: registered_at, type: datetime, source: system, description: "Clock instant of registration" }
      - { name: coverage_end_date, type: string, source: computed, description: "retail_sale_date + 36 months" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (constant; lapse is enforced temporally via coverage_end_date)", constraints: "one of ACTIVE" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> WarrantyRegistration.id" }
      - { name: recall_notice_id, type: string, source: input, description: "FK -> RecallNotice.id; optional recall linkage selecting the RECALL_GOODWILL variant", constraints: "nullable" }
      - { name: defect_description, type: string, source: input, description: "Free-text defect description" }
      - { name: labor_hours, type: number, source: input, description: "Claimed labor hours", constraints: "> 0" }
      - { name: parts_cents, type: integer, source: input, description: "Claimed parts cost in cents", constraints: ">= 0" }
      - { name: variant_applied, type: enum, source: computed, description: "RECALL_GOODWILL iff recall_notice_id present, else STANDARD", constraints: "one of STANDARD, RECALL_GOODWILL" }
      - { name: labor_charge_cents, type: integer, source: computed, description: "Labor component computed at approve (variant formula); null until decided", constraints: "nullable" }
      - { name: parts_credit_cents, type: integer, source: computed, description: "Parts component computed at approve; null until decided", constraints: "nullable" }
      - { name: reimbursement_cents, type: integer, source: computed, description: "labor_charge_cents + parts_credit_cents; null until APPROVED", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED | REJECTED (terminal)", constraints: "one of SUBMITTED, APPROVED, REJECTED" }

  - name: RecallCampaign
    parent: null
    common_fields: true
    fields:
      - { name: campaign_code, type: string, source: input, description: "Unique campaign code, e.g. RC-2026-014", constraints: "unique across RecallCampaign" }
      - { name: severity, type: enum, source: input, description: "SAFETY_STOP | SAFETY_STANDARD | EMISSIONS", constraints: "one of SAFETY_STOP, SAFETY_STANDARD, EMISSIONS" }
      - { name: model_code, type: string, source: input, description: "Target model code (criteria string matched via Hull.model_id -> BoatModel.model_code; not a hard FK — campaigns may precede affected models)" }
      - { name: model_year, type: integer, source: input, description: "Target model year" }
      - { name: hin_serial_start, type: integer, source: input, description: "Inclusive lower bound of affected Hull.serial_no", constraints: ">= 1, <= hin_serial_end" }
      - { name: hin_serial_end, type: integer, source: input, description: "Inclusive upper bound of affected Hull.serial_no (closed range)", constraints: ">= hin_serial_start" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ISSUED -> CLOSED; CLOSED auto when open_notice_count reaches 0 (including 0-match issues)", constraints: "one of DRAFT, ISSUED, CLOSED" }
      - { name: issued_at, type: datetime, source: system, description: "Clock instant of issue; null while DRAFT", constraints: "nullable" }
      - { name: notice_count, type: integer, source: computed, default: 0, description: "Total RecallNotice rows generated at issue" }
      - { name: open_notice_count, type: integer, source: computed, default: 0, description: "Notices still NOTIFIED; decremented on remedy; drives auto-close posture" }

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> RecallCampaign.id" }
      - { name: hull_id, type: string, source: system, description: "FK -> Hull.id" }
      - { name: status, type: enum, source: system, default: NOTIFIED, description: "NOTIFIED -> REMEDIED (terminal)", constraints: "one of NOTIFIED, REMEDIED" }
      - { name: notified_at, type: datetime, source: system, description: "Clock instant of campaign issue" }
      - { name: remedied_at, type: datetime, source: system, description: "Clock instant of remedy; null while NOTIFIED", constraints: "nullable" }
      - { name: remedy_path, type: enum, source: system, description: "WARRANTY_CLAIM (claim approve) | PLANT_REMEDY (POST /recall-notices/{id}/remedy); null until REMEDIED", constraints: "nullable; one of WARRANTY_CLAIM, PLANT_REMEDY" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DealerOrder
    initial_state: WAITLISTED
    terminal_states: [RETAILED, CANCELLED]
    note: "Creation lands directly in ALLOCATED when a slot is secured (explicit slot_id with capacity, or auto-select success), else WAITLISTED. Amend self-loops keep the state but bump version and reprice."
    transitions:
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "POST /dealer-orders (creation with slot secured) OR system waitlist promotion on slot release"
        actor: DealerPrincipal | system
        preconditions:
          - "Chosen slot's run is OPEN and slot is OPEN (ERR_RUN_NOT_OPEN)"
          - "slot.reserved_hours + order.production_hours <= slot.capacity_hours (ERR_SLOT_CAPACITY_EXCEEDED when slot_id explicit)"
          - "dealer.allocation_used < dealer.annual_allocation_quota (ERR_QUOTA_EXCEEDED)"
        side_effects:
          - "slot.reserved_hours += production_hours; slot.updated_at refreshed; slot.version += 1"
          - "dealer.allocation_used recomputed (+1); dealer.version += 1"
          - "order.version += 1 on promotion (creation starts at version 1)"
      - from: ALLOCATED
        to: ALLOCATED
        trigger: "PATCH /dealer-orders/{id} (option/deposit amendment)"
        actor: DealerPrincipal
        preconditions:
          - "expected_order_version matches order.version (ERR_STALE_ORDER_VERSION)"
          - "logical clock < slot's run.option_change_cutoff_at (ERR_OPTION_CUTOFF_PASSED)"
          - "replacement option set passes compatibility checks (ERR_OPTION_INCOMPATIBLE)"
          - "new production_hours fit the SAME slot: reserved_hours - old_hours + new_hours <= capacity_hours (ERR_SLOT_CAPACITY_EXCEEDED)"
          - "deposit_paid_cents (new or carried) >= new required_deposit_cents (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "OrderOptionLine rows atomically replaced (old lines deleted, new lines created with fresh price snapshots)"
          - "invoice_total_cents, options_total_cents, surcharge_cents, required_deposit_cents, production_hours recomputed"
          - "slot.reserved_hours adjusted by (new_hours - old_hours); slot.version += 1"
          - "order.version += 1"
      - from: WAITLISTED
        to: WAITLISTED
        trigger: "PATCH /dealer-orders/{id} (amendment without a booked slot)"
        actor: DealerPrincipal
        preconditions:
          - "expected_order_version matches order.version (ERR_STALE_ORDER_VERSION)"
          - "replacement option set passes compatibility checks (ERR_OPTION_INCOMPATIBLE)"
          - "deposit_paid_cents >= new required_deposit_cents (ERR_DEPOSIT_INSUFFICIENT)"
          - "no cutoff applies while WAITLISTED (no slot's run is bound)"
        side_effects:
          - "OrderOptionLine rows replaced; pricing fields recomputed; order.version += 1"
      - from: ALLOCATED
        to: COMMITTED
        trigger: "POST /dealer-orders/{id}/confirm"
        actor: DealerPrincipal
        preconditions:
          - "order.status == ALLOCATED (ERR_INVALID_ORDER_STATE)"
          - "deposit_paid_cents >= required_deposit_cents (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "order.version += 1"
      - from: COMMITTED
        to: IN_PRODUCTION
        trigger: "system (on POST /hulls creation for this order)"
        actor: system
        preconditions:
          - "order.status == COMMITTED (ERR_INVALID_ORDER_STATE)"
        side_effects:
          - "Hull row created (see Hull machine); order.version += 1"
      - from: IN_PRODUCTION
        to: DELIVERED
        trigger: "system (on POST /hulls/{id}/deliver)"
        actor: system
        preconditions: []
        side_effects:
          - "order.version += 1"
      - from: DELIVERED
        to: RETAILED
        trigger: "system (on POST /warranty-registrations for this hull)"
        actor: system
        preconditions: []
        side_effects:
          - "order.version += 1"
          - "dealer.allocation_used recomputed (DELIVERED still counts; RETAILED does not -> -1); dealer.version += 1"
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /dealer-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions: []
        side_effects:
          - "cancel_fee_cents = 0; refund_cents = deposit_paid_cents; order.version += 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /dealer-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions: []
        side_effects:
          - "cancel_fee_cents = restocking_fee(order) (5% tier; BOAT_SHOW: max(5% fee, deposit_paid)); refund_cents = max(0, deposit - fee)"
          - "slot.reserved_hours -= production_hours; slot.version += 1"
          - "dealer.allocation_used recomputed (-1); dealer.version += 1"
          - "waitlist promotion cascade: best eligible WAITLISTED order promoted per waitlist_promotion_selector (which itself re-reserves the slot and recomputes its dealer's allocation_used)"
          - "order.version += 1"
      - from: COMMITTED
        to: CANCELLED
        trigger: "POST /dealer-orders/{id}/cancel"
        actor: DealerPrincipal
        preconditions: []
        side_effects:
          - "cancel_fee_cents = restocking_fee(order) (12% tier; BOAT_SHOW: max(12% fee, deposit_paid)); refund_cents = max(0, deposit - fee)"
          - "slot release + waitlist promotion cascade identical to ALLOCATED cancel"
          - "dealer.allocation_used recomputed (-1); dealer.version += 1; order.version += 1"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /dealer-orders/{id}/cancel (rejected)"
        actor: DealerPrincipal
        preconditions:
          - "REJECTED: orders in IN_PRODUCTION, DELIVERED, RETAILED, CANCELLED cannot cancel (ERR_INVALID_ORDER_STATE)"
        side_effects: []

  - entity: Hull_certification
    note: "Parallel dimension 1 of Hull (certification_status). Evolves independently of delivery_status; deliver gates on this dimension."
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /hulls/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "hull.certification_status == UNCERTIFIED (ERR_INVALID_HULL_STATE)"
          - "X-User-ID != hull.created_by_user_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "hull.version += 1"
      - from: CERTIFIED
        to: RECALL_HOLD
        trigger: "system (on POST /recall-campaigns/{id}/issue when hull matches campaign criteria)"
        actor: system
        preconditions: []
        side_effects:
          - "RecallNotice row created (NOTIFIED) for this hull"
          - "hull.version += 1"
      - from: RECALL_HOLD
        to: CERTIFIED
        trigger: "system (on remedy of this hull's last NOTIFIED notice: linked claim approve or POST /recall-notices/{id}/remedy)"
        actor: system
        preconditions:
          - "No other RecallNotice for this hull remains NOTIFIED (hold persists while any open notice exists)"
        side_effects:
          - "hull.version += 1"

  - entity: Hull_delivery
    note: "Parallel dimension 2 of Hull (delivery_status)."
    initial_state: AT_PLANT
    terminal_states: [DELIVERED]
    transitions:
      - from: AT_PLANT
        to: DELIVERED
        trigger: "POST /hulls/{id}/deliver"
        actor: ProductionPlanner
        preconditions:
          - "hull.delivery_status == AT_PLANT (ERR_INVALID_HULL_STATE)"
          - "hull.certification_status != RECALL_HOLD (ERR_HULL_RECALL_HOLD)"
          - "hull.certification_status == CERTIFIED (ERR_HULL_NOT_CERTIFIED)"
          - "dealer.floor_plan_utilized_cents + order.invoice_total_cents <= dealer.floor_plan_limit_cents (ERR_FLOOR_PLAN_LIMIT_EXCEEDED)"
        side_effects:
          - "FloorPlanAdvance created: principal = order.invoice_total_cents, OPEN, rate_tier locked from utilization INCLUDING this advance (hop 1)"
          - "dealer.floor_plan_utilized_cents += principal (hop 2, caused by advance opening); dealer.version += 1"
          - "dealer.current_rate_tier recomputed from new utilization ratio (hop 3, caused by hop 2)"
          - "order.status IN_PRODUCTION -> DELIVERED; order.version += 1"
          - "hull.delivered_at = clock; hull.version += 1"

  - entity: ProductionRun
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /production-runs/{id}/close"
        actor: ProductionPlanner
        preconditions:
          - "run.status == OPEN (ERR_RUN_NOT_OPEN)"
        side_effects:
          - "Carrying accrual: for every Hull on this run's slots with delivery_status == AT_PLANT, days = whole days from completed_at to clock; actual = days * 750; seasonal = round_half_up(actual * season_factor(run.season)); hull.carrying_cost_cents += seasonal; run.total_carrying_actual_cents += actual; run.total_carrying_seasonal_cents += seasonal"
          - "All slots of this run -> RELEASED (terminal); their version += 1"
          - "Orders in ALLOCATED on this run's slots -> CANCELLED with cancel_fee_cents = 0 and full refund (season rollover; no waitlist promotion fires at close)"
          - "COMMITTED orders persist and may still create hulls after close (pinned exception: hull creation does not require run OPEN)"
          - "run.closed_at = clock; run.version += 1"

  - entity: FloorPlanAdvance
    initial_state: OPEN
    terminal_states: [PAID]
    note: "Self-loop partial curtailments keep OPEN; exact full payoff transitions to PAID."
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /dealers/{id}/curtailments (partial payoff)"
        actor: DealerPrincipal
        preconditions:
          - "expected_dealer_version matches dealer.version (ERR_STALE_DEALER_VERSION)"
          - "amount_cents <= total due across dealer's OPEN advances (interest-to-date + principal) (ERR_CURTAILMENT_EXCEEDS_BALANCE)"
        side_effects:
          - "Waterfall: advances ordered opened_at ASC (tie: created_at ASC); per advance settle interest first, then principal"
          - "dealer.floor_plan_utilized_cents -= principal repaid; dealer.current_rate_tier recomputed; dealer.version += 1"
      - from: OPEN
        to: PAID
        trigger: "POST /dealers/{id}/curtailments (payment zeroes outstanding principal and interest)"
        actor: DealerPrincipal
        preconditions:
          - "same as OPEN -> OPEN"
        side_effects:
          - "same waterfall; advance.status -> PAID when outstanding_principal_cents reaches 0"
          - "dealer recomputes identical to partial path"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "claim_reimbursement computed per variant_applied; labor_charge_cents, parts_credit_cents, reimbursement_cents set"
          - "If claim.recall_notice_id present: notice NOTIFIED -> REMEDIED (hop 1), hull RECALL_HOLD lifted if no other open notices (hop 2), campaign.open_notice_count -= 1 (hop 3) and campaign -> CLOSED when it reaches 0 (hop 4)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: WarrantyAdministrator
        preconditions:
          - "claim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects: []

  - entity: RecallCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /recall-campaigns/{id}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "campaign.status == DRAFT (ERR_CAMPAIGN_NOT_DRAFT)"
        side_effects:
          - "Fan-out: for each Hull whose model.model_code == campaign.model_code AND model.model_year == campaign.model_year AND hin_serial_start <= hull.serial_no <= hin_serial_end AND hull.certification_status == CERTIFIED: create RecallNotice NOTIFIED and flip hull CERTIFIED -> RECALL_HOLD (hull.version += 1)"
          - "campaign.notice_count = N, open_notice_count = N, issued_at = clock"
          - "If N == 0 (empty match set), campaign immediately auto-transitions ISSUED -> CLOSED"
      - from: ISSUED
        to: CLOSED
        trigger: "system (automatic when open_notice_count reaches 0)"
        actor: system
        preconditions:
          - "open_notice_count == 0"
        side_effects:
          - "campaign.version += 1"

  - entity: RecallNotice
    initial_state: NOTIFIED
    terminal_states: [REMEDIED]
    transitions:
      - from: NOTIFIED
        to: REMEDIED
        trigger: "POST /recall-notices/{id}/remedy (plant path) OR POST /warranty-claims/{id}/approve with recall_notice_id (retail path)"
        actor: ComplianceOfficer | system
        preconditions:
          - "notice.status == NOTIFIED (ERR_INVALID_NOTICE_STATE)"
        side_effects:
          - "remedied_at = clock; remedy_path = PLANT_REMEDY | WARRANTY_CLAIM"
          - "hull RECALL_HOLD -> CERTIFIED iff no other NOTIFIED notice remains for the hull"
          - "campaign.open_notice_count -= 1; campaign -> CLOSED at 0"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; serially observable)
# =============================================================================
concurrency_rules:
  - rule_id: order-amend-stale-version
    parent_entity: DealerOrder
    write_endpoint: "PATCH /dealer-orders/{id}"
    occ_field: "expected_order_version"
    description: |
      Amending an order with an expected_order_version the server has already
      advanced past is rejected. This captures the case where another writer
      has just amended the same order (a legitimate superseding amendment) and
      the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: dealer-update-stale-version
    parent_entity: Dealer
    write_endpoint: "PATCH /dealers/{id}"
    occ_field: "expected_dealer_version"
    description: |
      Updating a dealer's quota, floor-plan limit, or standing with a stale
      expected_dealer_version is rejected. Cascades (order booking, delivery,
      curtailment) advance Dealer.version between a client's read and its
      write; the stale write is refused so quota/limit changes are never based
      on superseded utilization state.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

  - rule_id: dealer-curtail-stale-version
    parent_entity: Dealer
    write_endpoint: "POST /dealers/{id}/curtailments"
    occ_field: "expected_dealer_version"
    description: |
      Posting a curtailment with a stale expected_dealer_version is rejected.
      A payment applied against a utilization/balance the client never observed
      (e.g., a delivery cascade opened a new advance after the client's last
      read) would settle the waterfall against the wrong oldest advance; the
      stale version refusal forces a re-read.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_invoice_total
    trigger: "POST /dealer-orders and PATCH /dealer-orders/{id} (booking and every amendment)"
    algorithm: aggregation
    formula: |
      1. base_price_cents = snapshot of BoatModel.base_price_cents (price lock at creation; amendments reuse the locked base).
      2. Per option line (pinned rounding order — round PER LINE first):
           line_total_cents = round_half_up(unit_price_cents * (1 - discount_pct(standing)))
         discount_pct: PREFERRED 0.10, STANDARD 0.05, PROBATION 0.00.
      3. options_total_cents = SUM(line_total_cents)   (sum AFTER per-line rounding; sum-then-round is a rejected alternative)
      4. subtotal = base_price_cents + options_total_cents   (base is NEVER discounted)
      5. surcharge_cents = round_half_up(subtotal * 0.03)
      6. invoice_total_cents = subtotal + surcharge_cents
    input_set: "Order's option lines after replacement; dealer standing at calculation time; locked base price"
    constants:
      SURCHARGE_RATE: 0.03
      DISCOUNT_PREFERRED: 0.10
      DISCOUNT_STANDARD: 0.05
      DISCOUNT_PROBATION: 0.00
    precision: "integer cents; round_half_up at step 2 (per line) and step 5 (surcharge); order pinned 2 -> 3 -> 5"

  - name: required_deposit
    trigger: "computed with order_invoice_total at booking and amendment"
    algorithm: tiered_pricing
    formula: |
      base_rate(source): RETAIL 0.10 | FLEET 0.15 | BOAT_SHOW -> show_event.surge_deposit_rate
      standing_delta(standing): PREFERRED -0.02 | STANDARD 0.00 | PROBATION +0.05
      effective_rate = max(MIN_RATE, base_rate(source) + standing_delta(standing))
      required_deposit_cents = max(MIN_DEPOSIT_CENTS, round_half_up(invoice_total_cents * effective_rate))
    input_set: "order.invoice_total_cents, order.source, dealer.standing, BoatShowEvent.surge_deposit_rate when BOAT_SHOW"
    constants:
      MIN_RATE: 0.03
      MIN_DEPOSIT_CENTS: 50000
      RATE_RETAIL: 0.10
      RATE_FLEET: 0.15
    precision: "integer cents; round_half_up before the outer max"

  - name: floor_plan_interest_accrual
    trigger: "POST /hulls/{id}/deliver (tier lock) and POST /dealers/{id}/curtailments (interest settlement)"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED to break the circular dependency
      (tier depends on utilization, utilization includes this advance, advance rate depends on tier):
      1. utilization_ratio = (dealer.floor_plan_utilized_cents_before + new_principal_cents) / dealer.floor_plan_limit_cents
      2. rate_tier: utilization_ratio < 0.50 -> TIER_STANDARD (0.06)
                    0.50 <= ratio < 0.80        -> TIER_ELEVATED (0.075)
                    ratio >= 0.80               -> TIER_HIGH (0.095)
         (boundary: exactly 0.50 is TIER_ELEVATED; exactly 0.80 is TIER_HIGH)
      3. advance.rate_tier and annual_rate LOCKED at opening.
      4. Interest settlement (at curtailment, per advance):
           days = whole days from advance.last_accrual_date to clock date (floor of seconds/86400; 0 if same day)
           interest_cents = round_half_up(outstanding_principal_cents * annual_rate * days / 365)
      5. Payment waterfall per advance: interest first, then principal.
    input_set: "dealer's OPEN advances; the new advance principal at delivery; clock"
    constants:
      TIER_STANDARD_RATE: 0.06
      TIER_ELEVATED_RATE: 0.075
      TIER_HIGH_RATE: 0.095
      TIER_ELEVATED_FLOOR: 0.50
      TIER_HIGH_FLOOR: 0.80
      DAY_COUNT: 365
    precision: "integer cents; round_half_up per settlement"

  - name: carrying_cost_accrual
    trigger: "POST /production-runs/{id}/close"
    algorithm: aggregation
    formula: |
      For each Hull on this run's slots with delivery_status == AT_PLANT at close:
        days = whole days from hull.completed_at to clock (floor of seconds/86400; may be 0)
        actual_cents = days * DAILY_RATE_CENTS
        seasonal_cents = round_half_up(actual_cents * season_factor(run.season))
      Aggregates: run.total_carrying_actual_cents = SUM(actual_cents);
                  run.total_carrying_seasonal_cents = SUM(seasonal_cents);
      Posting rule: hull.carrying_cost_cents += seasonal_cents (SEASON_WEIGHTED is the persisted variant).
      Empty set: no AT_PLANT hulls -> both totals 0, no error.
    input_set: "Hulls on slots of the closed run with delivery_status == AT_PLANT; DELIVERED hulls excluded"
    constants:
      DAILY_RATE_CENTS: 750
      SEASON_FACTOR_PEAK: 1.25
      SEASON_FACTOR_SHOULDER: 1.00
      SEASON_FACTOR_OFF_PEAK: 0.60
    precision: "integer cents; round_half_up on the season weighting"
    variants:
      - name: ACTUAL_DAYS
        when: "reported on the run as total_carrying_actual_cents (planning/statement view)"
        difference: "no season weighting: pure days * 750"
      - name: SEASON_WEIGHTED
        when: "posted to hull.carrying_cost_cents and run.total_carrying_seasonal_cents (inventory-carrying ledger)"
        difference: "actual cost multiplied by run.season factor; same inputs, different total whenever season != SHOULDER"

  - name: claim_reimbursement
    trigger: "POST /warranty-claims/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      Component rounding pinned: compute labor, round; compute parts, round; then sum.
      STANDARD variant:
        labor = round_half_up(min(labor_hours, 2.0) * 9000) + round_half_up(max(0, labor_hours - 2.0) * 9000 * 0.85)
        parts_credit = round_half_up(parts_cents * 0.85)
      RECALL_GOODWILL variant (claim.recall_notice_id present):
        labor = round_half_up(labor_hours * 9000)
        parts_credit = parts_cents
      reimbursement_cents = labor + parts_credit
    input_set: "claim.labor_hours, claim.parts_cents, presence of recall_notice_id"
    constants:
      BASE_LABOR_RATE_CENTS: 9000
      STANDARD_TIER1_HOURS: 2.0
      STANDARD_TIER2_FACTOR: 0.85
      STANDARD_PARTS_FACTOR: 0.85
    precision: "integer cents; round_half_up per component before summing"
    variants:
      - name: STANDARD
        when: "no recall_notice_id on the claim"
        difference: "labor beyond 2.0h paid at 85%, parts paid at 85%"
      - name: RECALL_GOODWILL
        when: "claim linked to a NOTIFIED recall notice"
        difference: "labor paid at 100% flat (no tier discount), parts at 100%; same inputs produce a higher total than STANDARD"

  - name: hin_assignment
    trigger: "POST /hulls (hull creation)"
    algorithm: chronological
    formula: |
      serial_no = 1 + max(serial_no of existing Hull with same (model_id, model.model_year)); 1 when none exist.
      hin = "BRW" + zero_pad(serial_no, 5) + month_letter(completed_at month) + last_digit(completed_at year) + zero_pad(model_year mod 100, 2)
      month_letter: A=Jan, B=Feb, ..., L=Dec (I is skipped by construction of the 12-letter map).
      Example: first hull of model year 2027 completed in August 2026 -> "BRW00001H627".
    input_set: "existing Hull rows for the same model and model year; clock"
    constants:
      MIC: "BRW"
      SERIAL_WIDTH: 5
    precision: "exact string composition; uniqueness enforced per (model_id, model_year, serial_no)"

  - name: waitlist_promotion_selector
    trigger: "system, after a slot release caused by order cancel (ALLOCATED or COMMITTED)"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (candidate set):
        order.status == WAITLISTED
        AND order.production_hours <= freed slot's available hours AFTER release
        AND order.dealer.allocation_used < order.dealer.annual_allocation_quota
      Ranking:
        key1: show_boost = 1 if order.source == BOAT_SHOW AND clock date inside its event's CLOSED [start_date, end_date] window, else 0  (DESC)
        key2: order.created_at ASC (earliest first)
        tie-break beyond created_at: none needed (timestamps are unique at millisecond precision; id is NEVER consulted)
      Fallback: candidate set empty -> slot remains OPEN with freed hours; no error raised.
      Promotion side effects: order -> ALLOCATED on the freed slot; slot.reserved_hours += order.production_hours; dealer.allocation_used recomputed (+1).
      Exactly ONE order is promoted per release event, even if more hours remain.
    input_set: "WAITLISTED orders; the freed slot; clock"
    constants:
      SHOW_BOOST_ACTIVE: 1
      SHOW_BOOST_INACTIVE: 0
    precision: "deterministic selector; no randomness"

  - name: restocking_fee
    trigger: "POST /dealer-orders/{id}/cancel and season-rollover auto-cancel at run close"
    algorithm: threshold
    formula: |
      state_fee_pct: WAITLISTED 0.00 | ALLOCATED 0.05 | COMMITTED 0.12
      base_fee = round_half_up(invoice_total_cents * state_fee_pct(status))
      If order.source == BOAT_SHOW: cancel_fee_cents = max(base_fee, deposit_paid_cents)  (deposit fully forfeited when larger)
      Else: cancel_fee_cents = base_fee
      refund_cents = max(0, deposit_paid_cents - cancel_fee_cents)
      Season-rollover auto-cancel at run close: cancel_fee_cents = 0, refund_cents = deposit_paid_cents (waived).
    input_set: "order.status at cancel, order.source, invoice_total_cents, deposit_paid_cents"
    constants:
      FEE_ALLOCATED: 0.05
      FEE_COMMITTED: 0.12
    precision: "integer cents; round_half_up before max with deposit"

  - name: allocation_usage_count
    trigger: "any DealerOrder status change (booking, promotion, cancel, delivery, retail)"
    algorithm: aggregation
    formula: |
      dealer.allocation_used = COUNT(orders of dealer with status IN {ALLOCATED, COMMITTED, IN_PRODUCTION, DELIVERED})
      Explicitly EXCLUDED: WAITLISTED (no production committed), RETAILED (pipeline exited), CANCELLED.
      Quota gate at booking/promotion: allowed iff allocation_used < annual_allocation_quota
      (boundary: allocation_used == quota rejects; quota - 1 -> booking lands used == quota exactly and succeeds).
    input_set: "dealer's orders by status"
    constants: {}
    precision: "integer count; recomputed, never incrementally guessed"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present, non-empty, and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per RBAC; for DealerPrincipal writes, X-User-ID must equal the owning dealer id (order.dealer_id / path dealer id / registration dealer)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body schema and field domains: required fields present; enum members valid; dates well-formed with start <= end; ProductionRun.build_week_end == build_week_start + 7 days; amounts non-negative; hin_serial_start <= hin_serial_end; BOAT_SHOW source requires show_event_id and other sources forbid it; option_package_ids non-empty when provided on amend; no duplicate option ids in one order"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_DEALER_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_HULL_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_CAMPAIGN_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_MODEL_NOT_FOUND)"
    http_status: 404
    applies_to: "endpoints with path ids"

  - priority: 5
    category: existence
    check: "Body-referenced FK ids exist: model_id, dealer_id, slot_id, show_event_id, run_id, order_id, hull_id, registration_id, recall_notice_id, each option_package_id, incompatible_with_option_id"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_MODEL_NOT_FOUND, ERR_DEALER_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_SHOW_EVENT_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_HULL_NOT_FOUND, ERR_REGISTRATION_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_OPTION_NOT_FOUND)"
    http_status: 404
    applies_to: "create/link endpoints with FK payloads"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_DEALER_VERSION"
    http_status: 412
    applies_to: "PATCH /dealer-orders/{id}, PATCH /dealers/{id}, POST /dealers/{id}/curtailments"

  - priority: 7
    category: state
    check: "Entity state preconditions (incl. cross-entity): model ORDERABLE (ERR_MODEL_NOT_ORDERABLE); run OPEN for bookings and slot creation and close (ERR_RUN_NOT_OPEN); order state legal for confirm/cancel/amend/hull creation (ERR_INVALID_ORDER_STATE); no existing hull for order (ERR_HULL_ALREADY_EXISTS); hull dims legal for certify/deliver (ERR_INVALID_HULL_STATE); claim SUBMITTED (ERR_CLAIM_NOT_SUBMITTED); campaign DRAFT (ERR_CAMPAIGN_NOT_DRAFT); notice NOTIFIED (ERR_INVALID_NOTICE_STATE)"
    error_id: "ERR_MODEL_NOT_ORDERABLE | ERR_RUN_NOT_OPEN | ERR_INVALID_ORDER_STATE | ERR_HULL_ALREADY_EXISTS | ERR_INVALID_HULL_STATE | ERR_CLAIM_NOT_SUBMITTED | ERR_CAMPAIGN_NOT_DRAFT | ERR_INVALID_NOTICE_STATE"
    http_status: 409
    applies_to: "state transition and create endpoints"

  - priority: 8
    category: business_safety
    check: "Segregation of duty on certify (ERR_SEGREGATION_OF_DUTY); deliver blocked under recall hold (ERR_HULL_RECALL_HOLD) and without certification (ERR_HULL_NOT_CERTIFIED)"
    error_id: "ERR_SEGREGATION_OF_DUTY | ERR_HULL_RECALL_HOLD | ERR_HULL_NOT_CERTIFIED"
    http_status: 409
    applies_to: "POST /hulls/{id}/certify, POST /hulls/{id}/deliver"

  - priority: 9
    category: business_temporal
    check: "Amend before cutoff (ERR_OPTION_CUTOFF_PASSED); show order created inside event window (ERR_SHOW_EVENT_NOT_ACTIVE); registration within 45-day window and sale not in future (ERR_REGISTRATION_WINDOW_EXPIRED); claim inside coverage unless recall-linked (ERR_COVERAGE_EXPIRED)"
    error_id: "ERR_OPTION_CUTOFF_PASSED | ERR_SHOW_EVENT_NOT_ACTIVE | ERR_REGISTRATION_WINDOW_EXPIRED | ERR_COVERAGE_EXPIRED"
    http_status: 422
    applies_to: "PATCH /dealer-orders/{id}, POST /dealer-orders, POST /warranty-registrations, POST /warranty-claims"

  - priority: 10
    category: business_constraint
    check: "No half-open window overlap on same plant line (ERR_LINE_WINDOW_OVERLAP); no closed-window overlap on same region shows (ERR_SHOW_WINDOW_OVERLAP); option compatibility and model match (ERR_OPTION_INCOMPATIBLE); one registration per hull (ERR_DUPLICATE_REGISTRATION); registration dealer == order dealer (ERR_SELLING_DEALER_MISMATCH); recall notice hull == registration hull (ERR_RECALL_NOTICE_MISMATCH)"
    error_id: "ERR_LINE_WINDOW_OVERLAP | ERR_SHOW_WINDOW_OVERLAP | ERR_OPTION_INCOMPATIBLE | ERR_DUPLICATE_REGISTRATION | ERR_SELLING_DEALER_MISMATCH | ERR_RECALL_NOTICE_MISMATCH"
    http_status: 409
    applies_to: "POST /production-runs, POST /boat-show-events, POST /dealer-orders, PATCH /dealer-orders/{id}, POST /warranty-registrations, POST /warranty-claims"

  - priority: 11
    category: business_fiscal
    check: "Dealer quota headroom (ERR_QUOTA_EXCEEDED); slot hours capacity (ERR_SLOT_CAPACITY_EXCEEDED); deposit covers required (ERR_DEPOSIT_INSUFFICIENT); floor-plan headroom at delivery (ERR_FLOOR_PLAN_LIMIT_EXCEEDED); curtailment not exceeding total due (ERR_CURTAILMENT_EXCEEDS_BALANCE)"
    error_id: "ERR_QUOTA_EXCEEDED | ERR_SLOT_CAPACITY_EXCEEDED | ERR_DEPOSIT_INSUFFICIENT | ERR_FLOOR_PLAN_LIMIT_EXCEEDED | ERR_CURTAILMENT_EXCEEDS_BALANCE"
    http_status: 422
    applies_to: "POST /dealer-orders, PATCH /dealer-orders/{id}, POST /dealer-orders/{id}/confirm, POST /hulls/{id}/deliver, POST /dealers/{id}/curtailments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Catalog ---
  - method: POST
    path: "/boat-models"
    description: "Register a boat model (status defaults to ORDERABLE; may be seeded DISCONTINUED)"
    roles: [SystemAdmin]
    code: 201
    input: [model_code, model_name, model_year, base_price_cents, length_feet, production_hours, "status?"]
    output: BoatModel
    side_effects: ["status defaults to ORDERABLE when omitted"]

  - method: GET
    path: "/boat-models"
    description: "List boat models"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BoatModel[]"
    side_effects: []

  - method: GET
    path: "/boat-models/{id}"
    description: "Get one boat model"
    roles: [Any]
    code: 200
    input: []
    output: BoatModel
    side_effects: []

  - method: POST
    path: "/option-packages"
    description: "Register an option package for a model; optional self-referential incompatibility"
    roles: [SystemAdmin]
    code: 201
    input: [model_id, option_code, name, price_cents, production_hours, "incompatible_with_option_id?"]
    output: OptionPackage
    side_effects: []

  - method: GET
    path: "/option-packages"
    description: "List option packages (FK reverse channel for model_id and incompatible_with_option_id)"
    roles: [Any]
    code: 200
    input: ["model_id?", "incompatible_with_option_id?", "limit?", "offset?"]
    output: "OptionPackage[]"
    side_effects: []

  - method: GET
    path: "/option-packages/{id}"
    description: "Get one option package"
    roles: [Any]
    code: 200
    input: []
    output: OptionPackage
    side_effects: []

  # --- Dealers & shows ---
  - method: POST
    path: "/dealers"
    description: "Onboard a dealer with quota and floor-plan limit"
    roles: [AllocationManager]
    code: 201
    input: [dealer_code, name, region, annual_allocation_quota, floor_plan_limit_cents, "standing?"]
    output: Dealer
    side_effects: ["standing defaults STANDARD; allocation_used=0; floor_plan_utilized_cents=0; current_rate_tier=TIER_STANDARD"]

  - method: GET
    path: "/dealers"
    description: "List dealers"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "Dealer[]"
    side_effects: []

  - method: GET
    path: "/dealers/{id}"
    description: "Get one dealer (version, quota usage, utilization, tier)"
    roles: [Any]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: PATCH
    path: "/dealers/{id}"
    description: "Update dealer quota / floor-plan limit / standing under OCC"
    roles: [AllocationManager]
    code: 200
    input: [expected_dealer_version, "annual_allocation_quota?", "floor_plan_limit_cents?", "standing?"]
    output: Dealer
    side_effects: ["increments Dealer.version by 1", "current_rate_tier recomputed when limit changes"]

  - method: POST
    path: "/dealers/{id}/curtailments"
    description: "Dealer pays down floor-plan advances; waterfall oldest-first, interest then principal; OCC-guarded"
    roles: [DealerPrincipal]
    code: 200
    input: [expected_dealer_version, amount_cents]
    output: Dealer
    side_effects:
      - "waterfall across dealer's OPEN advances (opened_at ASC, created_at ASC tie-break): interest to clock date first, then principal"
      - "advances reaching zero principal -> PAID"
      - "dealer.floor_plan_utilized_cents reduced; current_rate_tier recomputed"
      - "increments Dealer.version by 1"

  - method: POST
    path: "/boat-show-events"
    description: "Register a boat show window; same-region closed-interval overlap rejected"
    roles: [AllocationManager]
    code: 201
    input: [event_name, region, start_date, end_date, surge_deposit_rate, allocation_boost]
    output: BoatShowEvent
    side_effects: []

  - method: GET
    path: "/boat-show-events"
    description: "List boat show events"
    roles: [Any]
    code: 200
    input: ["region?", "limit?", "offset?"]
    output: "BoatShowEvent[]"
    side_effects: []

  # --- Production runs & slots ---
  - method: POST
    path: "/production-runs"
    description: "Open a one-week production run on a plant line; half-open window overlap rejected"
    roles: [ProductionPlanner]
    code: 201
    input: [plant_line_code, season, build_week_start, build_week_end, option_change_cutoff_at]
    output: ProductionRun
    side_effects: ["status=OPEN; carrying totals zeroed"]

  - method: GET
    path: "/production-runs"
    description: "List production runs"
    roles: [Any]
    code: 200
    input: ["plant_line_code?", "status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: GET
    path: "/production-runs/{id}"
    description: "Get one production run (carrying totals, status)"
    roles: [Any]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: POST
    path: "/production-runs/{id}/close"
    description: "Season checkpoint: accrue carrying costs (both variants), release slots, auto-cancel ALLOCATED orders with waived fee"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionRun
    side_effects:
      - "carrying_cost_accrual for AT_PLANT hulls on this run's slots (SEASON_WEIGHTED posted to hull; both totals on run)"
      - "slots -> RELEASED (version += 1)"
      - "ALLOCATED orders on this run's slots -> CANCELLED with cancel_fee_cents=0 and full refund (no promotion at close)"
      - "status -> CLOSED; closed_at = clock"

  - method: POST
    path: "/build-slots"
    description: "Add a capacity slot to an OPEN run"
    roles: [ProductionPlanner]
    code: 201
    input: [run_id, slot_code, capacity_hours]
    output: BuildSlot
    side_effects: ["reserved_hours=0; status=OPEN"]

  - method: GET
    path: "/build-slots"
    description: "List build slots (FK reverse channel for run_id)"
    roles: [Any]
    code: 200
    input: ["run_id?", "limit?", "offset?"]
    output: "BuildSlot[]"
    side_effects: []

  - method: GET
    path: "/build-slots/{id}"
    description: "Get one build slot"
    roles: [Any]
    code: 200
    input: []
    output: BuildSlot
    side_effects: []

  # --- Dealer orders ---
  - method: POST
    path: "/dealer-orders"
    description: "Book a dealer order with option lines; secures a slot (explicit or auto-select) or lands WAITLISTED"
    roles: [DealerPrincipal]
    code: 201
    input: [dealer_id, model_id, source, deposit_paid_cents, option_package_ids, "slot_id?", "show_event_id?"]
    output: DealerOrder
    side_effects:
      - "OrderOptionLine rows created with price snapshots; order_invoice_total + required_deposit computed"
      - "slot secured (explicit fit or auto-select: OPEN runs' OPEN slots with capacity, ranked build_week_start ASC then slot_code ASC) -> status ALLOCATED and slot.reserved_hours += production_hours; else WAITLISTED"
      - "dealer.allocation_used recomputed when ALLOCATED; dealer.version += 1"

  - method: GET
    path: "/dealer-orders"
    description: "List orders (FK reverse channel for dealer_id, model_id, slot_id, show_event_id)"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "model_id?", "slot_id?", "show_event_id?", "status?", "limit?", "offset?"]
    output: "DealerOrder[]"
    side_effects: []

  - method: GET
    path: "/dealer-orders/{id}"
    description: "Get one order"
    roles: [Any]
    code: 200
    input: []
    output: DealerOrder
    side_effects: []

  - method: PATCH
    path: "/dealer-orders/{id}"
    description: "Amend options/deposit while WAITLISTED or ALLOCATED (cutoff applies when ALLOCATED); OCC-guarded"
    roles: [DealerPrincipal]
    code: 200
    input: [expected_order_version, "option_package_ids?", "deposit_paid_cents?"]
    output: DealerOrder
    side_effects:
      - "OrderOptionLine rows replaced; pricing recomputed per order_invoice_total/required_deposit"
      - "ALLOCATED: slot.reserved_hours adjusted by hours delta (slot.version += 1)"
      - "increments DealerOrder.version by 1"

  - method: POST
    path: "/dealer-orders/{id}/confirm"
    description: "Dealer commits an ALLOCATED order"
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: DealerOrder
    side_effects: ["status ALLOCATED -> COMMITTED; order.version += 1"]

  - method: POST
    path: "/dealer-orders/{id}/cancel"
    description: "Cancel from WAITLISTED/ALLOCATED/COMMITTED with tiered restocking fee; releases slot and fires waitlist promotion"
    roles: [DealerPrincipal]
    code: 200
    input: []
    output: DealerOrder
    side_effects:
      - "restocking_fee computed; refund_cents = max(0, deposit - fee)"
      - "slot released (reserved_hours -= production_hours) -> waitlist_promotion_selector promotes at most one WAITLISTED order (its dealer allocation_used recomputed)"
      - "dealer.allocation_used recomputed; dealer.version += 1; order.version += 1"

  - method: GET
    path: "/order-option-lines"
    description: "List option lines (FK reverse channel for order_id and option_package_id)"
    roles: [Any]
    code: 200
    input: ["order_id?", "option_package_id?", "limit?", "offset?"]
    output: "OrderOptionLine[]"
    side_effects: []

  - method: GET
    path: "/order-option-lines/{id}"
    description: "Get one option line"
    roles: [Any]
    code: 200
    input: []
    output: OrderOptionLine
    side_effects: []

  # --- Hulls ---
  - method: POST
    path: "/hulls"
    description: "Report production completion for a COMMITTED order; assigns HIN; hull born UNCERTIFIED/AT_PLANT"
    roles: [ProductionPlanner]
    code: 201
    input: [order_id]
    output: Hull
    side_effects:
      - "hin_assignment (serial per model+model_year); completed_at = clock; created_by_user_id = X-User-ID"
      - "order COMMITTED -> IN_PRODUCTION; order.version += 1"

  - method: GET
    path: "/hulls"
    description: "List hulls (FK reverse channel for order_id, slot_id, model_id)"
    roles: [Any]
    code: 200
    input: ["order_id?", "slot_id?", "model_id?", "limit?", "offset?"]
    output: "Hull[]"
    side_effects: []

  - method: GET
    path: "/hulls/{id}"
    description: "Get one hull"
    roles: [Any]
    code: 200
    input: []
    output: Hull
    side_effects: []

  - method: POST
    path: "/hulls/{id}/certify"
    description: "Certify a hull's HIN/build compliance; certifier must differ from the creating planner (segregation of duties)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Hull
    side_effects: ["certification_status UNCERTIFIED -> CERTIFIED; hull.version += 1"]

  - method: POST
    path: "/hulls/{id}/deliver"
    description: "Deliver a certified, hold-free hull to its dealer; opens the floor-plan advance and cascades dealer utilization/tier"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: Hull
    side_effects:
      - "FloorPlanAdvance created (principal = order.invoice_total_cents, rate tier locked incl. this advance)"
      - "dealer.floor_plan_utilized_cents += principal; current_rate_tier recomputed; dealer.version += 1"
      - "order IN_PRODUCTION -> DELIVERED; order.version += 1"
      - "hull.delivery_status -> DELIVERED; delivered_at = clock; hull.version += 1"

  - method: GET
    path: "/floor-plan-advances"
    description: "List floor-plan advances (FK reverse channel for dealer_id, hull_id)"
    roles: [Any]
    code: 200
    input: ["dealer_id?", "hull_id?", "status?", "limit?", "offset?"]
    output: "FloorPlanAdvance[]"
    side_effects: []

  - method: GET
    path: "/floor-plan-advances/{id}"
    description: "Get one floor-plan advance"
    roles: [Any]
    code: 200
    input: []
    output: FloorPlanAdvance
    side_effects: []

  # --- Warranty ---
  - method: POST
    path: "/warranty-registrations"
    description: "Register retail sale of a delivered hull; opens 36-month coverage; order -> RETAILED"
    roles: [DealerPrincipal]
    code: 201
    input: [hull_id, dealer_id, retail_sale_date]
    output: WarrantyRegistration
    side_effects:
      - "coverage_end_date = retail_sale_date + 36 months"
      - "order DELIVERED -> RETAILED; order.version += 1; dealer.allocation_used recomputed (-1)"

  - method: GET
    path: "/warranty-registrations"
    description: "List registrations (FK reverse channel for hull_id, dealer_id)"
    roles: [Any]
    code: 200
    input: ["hull_id?", "dealer_id?", "limit?", "offset?"]
    output: "WarrantyRegistration[]"
    side_effects: []

  - method: GET
    path: "/warranty-registrations/{id}"
    description: "Get one registration"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyRegistration
    side_effects: []

  - method: POST
    path: "/warranty-claims"
    description: "Dealer submits a claim; recall linkage selects RECALL_GOODWILL variant and bypasses coverage window"
    roles: [DealerPrincipal]
    code: 201
    input: [registration_id, defect_description, labor_hours, parts_cents, "recall_notice_id?"]
    output: WarrantyClaim
    side_effects: ["variant_applied computed; status=SUBMITTED"]

  - method: GET
    path: "/warranty-claims"
    description: "List claims (FK reverse channel for registration_id, recall_notice_id)"
    roles: [Any]
    code: 200
    input: ["registration_id?", "recall_notice_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get one claim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Adjudicate claim: computes reimbursement per variant; recall-linked approval remedies the notice and cascades campaign posture"
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "claim_reimbursement per variant_applied"
      - "recall-linked: notice -> REMEDIED (path WARRANTY_CLAIM); hull hold lifted when last open notice; campaign.open_notice_count -= 1; campaign auto-CLOSED at 0"

  - method: POST
    path: "/warranty-claims/{id}/reject"
    description: "Reject a SUBMITTED claim (no financial side effects)"
    roles: [WarrantyAdministrator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> REJECTED"]

  # --- Recalls ---
  - method: POST
    path: "/recall-campaigns"
    description: "Draft a recall campaign by model code, model year, and inclusive HIN serial range"
    roles: [ComplianceOfficer]
    code: 201
    input: [campaign_code, severity, model_code, model_year, hin_serial_start, hin_serial_end]
    output: RecallCampaign
    side_effects: ["status=DRAFT; counters zeroed"]

  - method: GET
    path: "/recall-campaigns"
    description: "List recall campaigns"
    roles: [Any]
    code: 200
    input: ["model_code?", "status?", "limit?", "offset?"]
    output: "RecallCampaign[]"
    side_effects: []

  - method: POST
    path: "/recall-campaigns/{id}/issue"
    description: "Issue campaign: fan-out notices to matching CERTIFIED hulls and flip them to RECALL_HOLD; zero-match issue auto-closes"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecallCampaign
    side_effects:
      - "RecallNotice NOTIFIED created per matching CERTIFIED hull; hull CERTIFIED -> RECALL_HOLD (version += 1)"
      - "notice_count = open_notice_count = N; issued_at = clock; N == 0 -> auto CLOSED"

  - method: GET
    path: "/recall-notices"
    description: "List recall notices (FK reverse channel for campaign_id, hull_id)"
    roles: [Any]
    code: 200
    input: ["campaign_id?", "hull_id?", "status?", "limit?", "offset?"]
    output: "RecallNotice[]"
    side_effects: []

  - method: GET
    path: "/recall-notices/{id}"
    description: "Get one recall notice"
    roles: [Any]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []

  - method: POST
    path: "/recall-notices/{id}/remedy"
    description: "Plant remedy path for not-yet-retailed hulls: closes the notice, lifts the hull hold when last open notice, cascades campaign posture"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: RecallNotice
    side_effects:
      - "notice NOTIFIED -> REMEDIED (path PLANT_REMEDY); remedied_at = clock"
      - "hull RECALL_HOLD -> CERTIFIED iff no other NOTIFIED notice for the hull"
      - "campaign.open_notice_count -= 1; campaign auto-CLOSED at 0"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; all temporal rules (cutoff, show windows, registration window, coverage, interest day counts, carrying day counts) evaluate against this clock."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced (monotonic not enforced; tests may set any instant)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty/unknown role" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for endpoint, or DealerPrincipal acting on a dealer other than X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema/field-domain violation (missing required field, bad enum, unordered dates, run week not exactly 7 days, negative amounts, serial range inverted, show linkage mismatch with source, duplicate option ids)" }
  # not found
  - { id: ERR_MODEL_NOT_FOUND, http: 404, condition: "BoatModel id unknown (path or body FK)" }
  - { id: ERR_OPTION_NOT_FOUND, http: 404, condition: "OptionPackage id unknown (option_package_ids element or incompatible_with_option_id)" }
  - { id: ERR_DEALER_NOT_FOUND, http: 404, condition: "Dealer id unknown" }
  - { id: ERR_SHOW_EVENT_NOT_FOUND, http: 404, condition: "BoatShowEvent id unknown" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "ProductionRun id unknown" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "BuildSlot id unknown" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "DealerOrder id unknown" }
  - { id: ERR_HULL_NOT_FOUND, http: 404, condition: "Hull id unknown" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "WarrantyRegistration id unknown" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "WarrantyClaim id unknown" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "RecallCampaign id unknown" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "RecallNotice id unknown" }
  # OCC
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "expected_order_version != current DealerOrder.version on amend" }
  - { id: ERR_STALE_DEALER_VERSION, http: 412, condition: "expected_dealer_version != current Dealer.version on PATCH or curtailment" }
  # state
  - { id: ERR_MODEL_NOT_ORDERABLE, http: 409, condition: "Order references a BoatModel with status DISCONTINUED" }
  - { id: ERR_RUN_NOT_OPEN, http: 409, condition: "Booking/slot-creation targets a CLOSED run, or close issued on an already-CLOSED run" }
  - { id: ERR_INVALID_ORDER_STATE, http: 409, condition: "Order state forbids the action: confirm from non-ALLOCATED; cancel from IN_PRODUCTION/DELIVERED/RETAILED/CANCELLED; amend from COMMITTED/IN_PRODUCTION/DELIVERED/RETAILED/CANCELLED; hull creation for non-COMMITTED order" }
  - { id: ERR_HULL_ALREADY_EXISTS, http: 409, condition: "Second hull creation attempt for the same order" }
  - { id: ERR_INVALID_HULL_STATE, http: 409, condition: "Hull dimension forbids the action: certify when not UNCERTIFIED; deliver when delivery_status != AT_PLANT" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Approve/reject requires claim SUBMITTED" }
  - { id: ERR_CAMPAIGN_NOT_DRAFT, http: 409, condition: "Issue requires campaign DRAFT" }
  - { id: ERR_INVALID_NOTICE_STATE, http: 409, condition: "Remedy or claim-linkage requires notice NOTIFIED" }
  # safety
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Certify X-User-ID equals hull.created_by_user_id" }
  - { id: ERR_HULL_RECALL_HOLD, http: 409, condition: "Deliver attempted while hull.certification_status == RECALL_HOLD" }
  - { id: ERR_HULL_NOT_CERTIFIED, http: 409, condition: "Deliver attempted while hull.certification_status == UNCERTIFIED" }
  # temporal
  - { id: ERR_OPTION_CUTOFF_PASSED, http: 422, condition: "Amend of an ALLOCATED order at or after its run's option_change_cutoff_at (rule: clock < cutoff required; exactly equal rejects)" }
  - { id: ERR_SHOW_EVENT_NOT_ACTIVE, http: 422, condition: "BOAT_SHOW order created outside its event's closed [start_date, end_date] window" }
  - { id: ERR_REGISTRATION_WINDOW_EXPIRED, http: 422, condition: "retail_sale_date more than 45 days before clock date, or in the future" }
  - { id: ERR_COVERAGE_EXPIRED, http: 422, condition: "Claim submitted after registration coverage_end_date (waived for recall-linked claims)" }
  # constraint
  - { id: ERR_LINE_WINDOW_OVERLAP, http: 409, condition: "Same plant_line_code run with overlapping half-open [build_week_start, build_week_end) windows (adjacent end==start allowed)" }
  - { id: ERR_SHOW_WINDOW_OVERLAP, http: 409, condition: "Same region show with overlapping closed [start_date, end_date] windows (shared single day is a conflict)" }
  - { id: ERR_OPTION_INCOMPATIBLE, http: 422, condition: "Option set contains a declared incompatible pair (either direction) or an option belonging to a different model" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Hull already has a WarrantyRegistration" }
  - { id: ERR_SELLING_DEALER_MISMATCH, http: 422, condition: "Registration dealer_id differs from the delivered order's dealer_id" }
  - { id: ERR_RECALL_NOTICE_MISMATCH, http: 422, condition: "Claim recall_notice_id belongs to a different hull than the registration's hull" }
  # fiscal
  - { id: ERR_QUOTA_EXCEEDED, http: 422, condition: "Booking/promotion would push dealer.allocation_used above annual_allocation_quota (== quota rejects)" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 422, condition: "Explicit slot booking or amend exceeds slot.capacity_hours (reserved + needed == capacity allowed)" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "deposit_paid_cents < required_deposit_cents at create/amend/confirm" }
  - { id: ERR_FLOOR_PLAN_LIMIT_EXCEEDED, http: 402, condition: "Delivery would push floor_plan_utilized_cents above floor_plan_limit_cents (== limit allowed)" }
  - { id: ERR_CURTAILMENT_EXCEEDS_BALANCE, http: 422, condition: "Curtailment amount exceeds total due (interest-to-date + outstanding principal) across dealer's OPEN advances; exact payoff allowed" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Platform operator: catalog seeding and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /boat-models"
      - "POST /option-packages"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: AllocationManager
    description: "Manufacturer allocation desk: dealer onboarding, quota/floor-plan administration, boat show calendar"
    identity: opaque
    exclusive_operations:
      - "POST /dealers"
      - "PATCH /dealers/{id}"
      - "POST /boat-show-events"
    shared_operations: ["all GET endpoints"]

  - name: ProductionPlanner
    description: "Plant production office: runs, slots, hull completion, delivery"
    identity: opaque
    exclusive_operations:
      - "POST /production-runs"
      - "POST /production-runs/{id}/close"
      - "POST /build-slots"
      - "POST /hulls"
      - "POST /hulls/{id}/deliver"
    shared_operations: ["all GET endpoints"]

  - name: ComplianceOfficer
    description: "Regulatory/QA officer: HIN certification (must differ from the hull's creator), recall campaigns, plant remedies"
    identity: opaque
    exclusive_operations:
      - "POST /hulls/{id}/certify"
      - "POST /recall-campaigns"
      - "POST /recall-campaigns/{id}/issue"
      - "POST /recall-notices/{id}/remedy"
    shared_operations: ["all GET endpoints"]

  - name: WarrantyAdministrator
    description: "Warranty adjudicator: approves/rejects claims"
    identity: opaque
    exclusive_operations:
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/reject"
    shared_operations: ["all GET endpoints"]

  - name: DealerPrincipal
    description: "Dealership principal: books and amends own orders, confirms/cancels, pays floor-plan, registers retail sales, files claims"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /dealer-orders (dealer_id must equal X-User-ID)"
      - "PATCH /dealer-orders/{id} (order's dealer must equal X-User-ID)"
      - "POST /dealer-orders/{id}/confirm"
      - "POST /dealer-orders/{id}/cancel"
      - "POST /dealers/{id}/curtailments (path id must equal X-User-ID)"
      - "POST /warranty-registrations (dealer_id must equal X-User-ID)"
      - "POST /warranty-claims (registration's dealer must equal X-User-ID)"
    shared_operations: ["all GET endpoints"]

  - name: Any
    description: "Shared read access for every authenticated role"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
