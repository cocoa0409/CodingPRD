      - name: duration_height_factor_floors_below_base_height
        claim_type: threshold
        grounds:
          - calculations.class_duration_estimate
          - calculations.class_duration_estimate.constants.HEIGHT_FACTOR_BASE_CM
        distinguishing_aspect: |
          The height factor is 1 + max(0, jump_height_cm - 100) / 200, so 100 cm is a
          one-sided threshold: below it the factor is CLAMPED at 1.0 and above it the
          factor grows. Three hunter classes at 60, 100 and 101 cm with four entered
          horses each give 26, 26 and 27 minutes. An implementation that drops the
          max(0, ...) clamp computes 0.8 for the 60 cm class and returns 25, so the
          threshold-1 probe is what falsifies it; the 101 cm probe proves the term is
          live just above the threshold.
