  - section: endpoints
    instances:
      - name: occ_patch_order_stale_version_rejected_current_succeeds
        claim_type: Conditional action
        grounds:
          - concurrency_rules[order-modify-stale-version]
          - errors.ERR_STALE_VERSION
          - endpoints.PATCH_/sleep/orders/{id}
        distinguishing_aspect: "OCC happy+sad path on the order: read version 1, PATCH with expected 1 succeeds and recomputes totals (version 2); a second PATCH still carrying expected 1 is 412 ERR_STALE_VERSION; PATCH with expected 2 succeeds (version 3)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. PLACED order with one MAT-150 line; models MAT-150 (150000) and BASE-180 (180000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-150", name: "M150", category: "MATTRESS", price_cents: 150000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "BASE-180", name: "B180", category: "ADJUSTABLE_BASE", price_cents: 180000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "h@x.com", full_name: "Hal H" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-150", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, order_v: $.data.version }
          trigger:
            - call: "PATCH /sleep/orders/${order_id}"
              payload: { expected_order_version: "${order_v}", line_items: [{ sku: "MAT-150", qty: 1 }, { sku: "BASE-180", qty: 1 }] }
              as: SalesAssociate
            - call: "PATCH /sleep/orders/${order_id}"
