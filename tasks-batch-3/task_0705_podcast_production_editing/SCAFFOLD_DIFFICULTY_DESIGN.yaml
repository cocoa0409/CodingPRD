      - name: remote_buffer_exact_gap_allowed_zero_violation
        grounds:
          - validations[priority=25]
          - entities.Engineer.fields.remote_buffer_minutes
          - state_machines.Session.BOOKED_to_LIVE
        distinguishing_aspect: |
          Metric = REMOTE inter-session gap in minutes against
          engineer.remote_buffer_minutes (default 30), reached via POST /sessions —
          a different metric and different endpoint behavior than the lifetime-cents
          threshold. A gap exactly equal to the buffer (later.start == earlier.end +
          30 min) is allowed (no ERR_REMOTE_BUFFER_VIOLATION); one minute less is
          rejected. Boundary is the >= on the gap.
        test_recipe:
          setup:
            - "Engineer H active, remote_buffer_minutes=30. One BOOKED REMOTE session [10:00,11:00) on 2026-03-04."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Rem S", format: "SOLO", billing_model: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
