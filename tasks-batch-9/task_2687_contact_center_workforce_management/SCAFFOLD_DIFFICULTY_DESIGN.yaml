              as: SchedulingManager
              captures: { ag1_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-MON-AM", skill_code: "VOICE_EN", start_time_local: "08:00", duration_minutes: 480, unpaid_break_minutes: 30, days_of_week: [0], slots_total: 1 }
              as: SchedulingManager
              captures: { tpl_id: "$.data.id" }
            - call: "POST /schedule-shifts"
              payload: { planning_cycle_id: "${cyc_id}", agent_id: "${ag1_id}", shift_template_id: "${tpl_id}", service_date: "2026-09-07" }
