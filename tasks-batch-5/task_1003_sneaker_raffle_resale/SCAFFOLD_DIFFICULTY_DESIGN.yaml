scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_payout_provisional_vs_final_downgrade
        grounds:
          - calculations.seller_payout
          - entities.Order.fields.provisional_payout_cents
          - entities.Order.fields.final_payout_cents
          - state_machines.Order.SHIPPED_TO_BUYER_to_VERIFIED
        distinguishing_aspect: "On the Order domain, PROVISIONAL payout (27300, downgrade forced to 0 at creation) diverges from FINAL payout (22800) once inspection downgrades condition DEADSTOCK->USED and applies a 4500 adjustment."
        test_recipe:
          setup:
            - "A verified seller (STANDARD) and verified buyer; a FIXED listing at ask 30000 bought by the buyer; the item shipped in, received, inspected PASS but authenticated as USED (worse than the DEADSTOCK it was listed as); order shipped to buyer."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "DZ5485-612", name: "AJ1 High", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller1@x.com", full_name: "Seller One" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer1@x.com", full_name: "Buyer One" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "10.5", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /authenticators"
              payload: { name: "Auth A", location_code: "NJ1" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { order_id: "${order_id}", seller_account_id: "${seller_id}", sku_id: "${sku_id}", declared_condition_grade: "DEADSTOCK", declared_box_grade: "PERFECT", declared_accessories_complete: true }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /consignment-items/${ci_id}/receive"
              payload: {}
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /consignment-items/${ci_id}/schedule-inspection"
              payload: { authenticator_id: "${auth_id}", inspection_window_start: "2026-07-01T09:00:00Z", inspection_window_end: "2026-07-01T09:30:00Z" }
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /consignment-items/${ci_id}/complete-inspection"
              payload: { inspection_result: "PASS", authenticated_condition_grade: "USED", authenticated_box_grade: "PERFECT", authenticated_accessories_complete: true }
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /orders/${order_id}/ship-to-buyer"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/verify"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
          assert:
            - "Order.${order_id}.provisional_payout_cents == 27300"
            - "Order.${order_id}.downgrade_adjustment_cents == 4500"
            - "Order.${order_id}.final_payout_cents == 22800"

      - name: consignment_grade_declared_vs_authenticated
        grounds:
          - calculations.grade_score
          - entities.ConsignmentItem.fields.declared_grade_score
          - entities.ConsignmentItem.fields.authenticated_grade_score
          - state_machines.ConsignmentItem.UNDER_AUTHENTICATION_to_AUTHENTICATED
        distinguishing_aspect: "On the ConsignmentItem domain, DECLARED grade_score (1.0 from DEADSTOCK/PERFECT/true) diverges from AUTHENTICATED grade_score (0.71 from USED/GOOD/true) computed at inspection."
        test_recipe:
          setup:
            - "A received consignment item declared DEADSTOCK/PERFECT/accessories-complete (declared_grade_score 1.0), scheduled for inspection."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "CT8532-800", name: "AJ4", brand: "Nike", retail_price_cents: 21000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller2@x.com", full_name: "Seller Two" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer2@x.com", full_name: "Buyer Two" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "9", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 25000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /authenticators"
              payload: { name: "Auth B", location_code: "CA1" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { order_id: "${order_id}", seller_account_id: "${seller_id}", sku_id: "${sku_id}", declared_condition_grade: "DEADSTOCK", declared_box_grade: "PERFECT", declared_accessories_complete: true }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /consignment-items/${ci_id}/receive"
              payload: {}
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /consignment-items/${ci_id}/schedule-inspection"
              payload: { authenticator_id: "${auth_id}", inspection_window_start: "2026-07-01T10:00:00Z", inspection_window_end: "2026-07-01T10:30:00Z" }
              as: Authenticator
              as_user_id: "${auth_id}"
          trigger:
            - call: "POST /consignment-items/${ci_id}/complete-inspection"
              payload: { inspection_result: "PASS", authenticated_condition_grade: "USED", authenticated_box_grade: "GOOD", authenticated_accessories_complete: true }
              as: Authenticator
              as_user_id: "${auth_id}"
          assert:
            - "ConsignmentItem.${ci_id}.declared_grade_score == 1.0"
            - "ConsignmentItem.${ci_id}.authenticated_grade_score == 0.71"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: transaction_fee_tiered_band_clamp_mode_a
        grounds:
          - calculations.transaction_fee
          - entities.Order.fields.transaction_fee_cents
          - entities.Account.fields.seller_level
        distinguishing_aspect: "Mode (a): transaction_fee combines >=3 inputs (seller_level tier 0.09, high-value band -0.01 because 60000>=50000, and MIN/MAX clamp) via nested max/min -> 4800; not a single linear rate."
        test_recipe:
          setup:
            - "A verified STANDARD seller lists at ask 60000 (>= HIGH_VALUE_CENTS); a verified buyer buys it."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "DV1748-601", name: "AJ11", brand: "Nike", retail_price_cents: 22500 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller3@x.com", full_name: "Seller Three" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer3@x.com", full_name: "Buyer Three" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "10", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 60000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.transaction_fee_cents == 4800"

      - name: processing_fee_pre_fee_subtotal_mode_c
        grounds:
          - calculations.buyer_charge_breakdown
          - entities.Order.fields.payment_processing_fee_cents
          - entities.Order.fields.buyer_total_cents
        distinguishing_aspect: "Mode (c): the circular-looking 'fee is a % of the grand total' is pinned so processing fee is charged on the PRE-FEE subtotal (30000+1500) -> 944, and buyer_total = 32444; charging on the grand total would give a different number."
        test_recipe:
          setup:
            - "A verified STANDARD seller lists at ask 30000; a verified buyer buys it (shipping 1500)."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "DD1391-100", name: "Dunk Low", brand: "Nike", retail_price_cents: 11000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller4@x.com", full_name: "Seller Four" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer4@x.com", full_name: "Buyer Four" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "8.5", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.payment_processing_fee_cents == 944"
            - "Order.${order_id}.buyer_total_cents == 32444"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_vs_fulfillment_axes
        grounds:
          - state_machines.Order.AWAITING_SHIPMENT_to_IN_AUTHENTICATION
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: "On Order, the fulfillment axis advances to IN_AUTHENTICATION on receive while the payment axis stays AUTHORIZED — two independent parallel state dimensions on the same row."
        test_recipe:
          setup:
            - "A FIXED resale order whose item has just been received by the authenticator."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "FQ8080-063", name: "AJ3", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller5@x.com", full_name: "Seller Five" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer5@x.com", full_name: "Buyer Five" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "11", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /authenticators"
              payload: { name: "Auth C", location_code: "TX1" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { order_id: "${order_id}", seller_account_id: "${seller_id}", sku_id: "${sku_id}", declared_condition_grade: "DEADSTOCK", declared_box_grade: "PERFECT", declared_accessories_complete: true }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /consignment-items/${ci_id}/receive"
              payload: {}
              as: Authenticator
              as_user_id: "${auth_id}"
          assert:
            - "Order.${order_id}.fulfillment_status == IN_AUTHENTICATION"
            - "Order.${order_id}.payment_status == AUTHORIZED"

      - name: consignment_fork_authenticated_vs_rejected
        grounds:
          - state_machines.ConsignmentItem.UNDER_AUTHENTICATION_to_REJECTED
          - entities.ConsignmentItem.fields.status
          - entities.Account.fields.strikes
          - entities.Order.fields.payment_status
        distinguishing_aspect: "The UNDER_AUTHENTICATION fork to REJECTED (FAIL) fires a divergent side-effect set from the AUTHENTICATED (PASS) branch: order -> FAILED_AUTH, payment -> VOIDED, seller.strikes += 1."
        test_recipe:
          setup:
            - "A FIXED resale order whose item is scheduled and under authentication."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "HF3776-101", name: "AJ5", brand: "Nike", retail_price_cents: 21000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller6@x.com", full_name: "Seller Six" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "buyer6@x.com", full_name: "Buyer Six" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /accounts/${buyer_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /listings"
              payload: { sku_id: "${sku_id}", seller_account_id: "${seller_id}", size: "9.5", condition: "DEADSTOCK", pricing_mode: "FIXED", ask_price_cents: 30000 }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /listings/${listing_id}/buy"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_id}"
              captures: { order_id: $.data.id }
            - call: "POST /authenticators"
              payload: { name: "Auth D", location_code: "FL1" }
              as: PlatformAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { order_id: "${order_id}", seller_account_id: "${seller_id}", sku_id: "${sku_id}", declared_condition_grade: "DEADSTOCK", declared_box_grade: "PERFECT", declared_accessories_complete: true }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /consignment-items/${ci_id}/receive"
              payload: {}
              as: Authenticator
              as_user_id: "${auth_id}"
            - call: "POST /consignment-items/${ci_id}/schedule-inspection"
              payload: { authenticator_id: "${auth_id}", inspection_window_start: "2026-07-01T11:00:00Z", inspection_window_end: "2026-07-01T11:30:00Z" }
              as: Authenticator
              as_user_id: "${auth_id}"
          trigger:
            - call: "POST /consignment-items/${ci_id}/complete-inspection"
              payload: { inspection_result: "FAIL" }
              as: Authenticator
              as_user_id: "${auth_id}"
          assert:
            - "ConsignmentItem.${ci_id}.status == REJECTED"
            - "Order.${order_id}.fulfillment_status == FAILED_AUTH"
            - "Order.${order_id}.payment_status == VOIDED"
            - "Account.${seller_id}.strikes == 1"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: verify_credits_seller_then_recomputes_level_depth3
        grounds:
          - state_machines.Order.SHIPPED_TO_BUYER_to_VERIFIED
          - entities.Account.fields.balance_cents
          - entities.Account.fields.completed_sales_count
          - entities.Account.fields.seller_level
        distinguishing_aspect: "Trigger POST /orders/{id}/verify: link1 order finalize+capture -> link2 seller.balance += 27300 and completed_sales_count += 1 -> link3 seller_level recomputed from the new count; each hop is caused by the prior, depth 3."
        test_recipe:
          setup:
            - "A FIXED resale order (ask 30000, clean PASS at DEADSTOCK) shipped to the buyer; seller balance 0, completed_sales_count 0."
          setup_api_calls:
            - call: "POST /skus"
              payload: { style_code: "AA1234-001", name: "AJ12", brand: "Nike", retail_price_cents: 20000 }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /accounts"
              payload: { email: "seller7@x.com", full_name: "Seller Seven" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /accounts/${seller_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /accounts"
