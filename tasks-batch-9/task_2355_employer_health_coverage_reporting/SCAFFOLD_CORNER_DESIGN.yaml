            - "After the withdraw: Form1095C.${form_id}.furnishing_status == REDELIVERY_REQUIRED and the member ledger is still 6000 (a state change is not a charge)"
            - "After the trigger: HTTP 200 and Form1095C.${form_id}.furnishing_status == FURNISHED_PAPER"
            - "Form1095C.${form_id}.late_furnishing_penalty_cents == 12000, recomputed for the new furnish_date 2027-04-15"
            - "GroupMember.${member_id}.furnishing_penalty_total_cents == 12000: the ledger absorbed the delta 12000 - 6000, so it is neither 18000 nor 6000"
