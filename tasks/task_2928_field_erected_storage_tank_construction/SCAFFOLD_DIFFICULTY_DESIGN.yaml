              as_user_id: "pe-1"
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 9000, specified_prep_standard: "SSPC_SP6", specified_min_dft_mils: 8.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "acrylic 3 coat" }
              as: ProjectEngineer
              captures: { ca_ext_id: $.data.id }
            - call: "POST /coating-applications/${ca_ext_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP6", profile_mils: 2.5, dew_point_spread_f: 9.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_ext_id}/dft-readings"
              payload: { spot_readings: [ [ 8.0, 9.0, 10.0 ] ] }
              as: QcInspector
          trigger:
            - call: "POST /coating-applications/${ca_ext_id}/holiday-test"
              payload: { holidays_found: 3, test_voltage_v: 200 }
              as: QcInspector
          assert:
            - "before the trigger: Tank.${tank_id}.construction_phase == COATED, quality_posture == OPEN, and CommissioningPackage.${pkg_id}.status == SUBMITTED with submitted_by_user_id == pe-1 and deficiency_count == 0"
            - "before the trigger: HydrotestPlan.${plan_id}.status == PASSED, settlement_survey_count == 4, water_cost_usd == 1332.00, disposal_cost_usd == 840.00, subtotal_usd == 2172.00, permit_surcharge_pct == 0.05, surcharge_usd == 108.60, total_cost_usd == 2280.60"
            - "before the trigger: WaterWithdrawal.${wd_id}.status == CONSUMED and WaterSource.${ws_id}.consumed_volume_gal == 400000.00 with reserved_volume_gal == 0.0 and available_volume_gal == 1600000.00"
            - "hop 1: CoatingApplication.${ca_ext_id}.status == REWORK_REQUIRED with holidays_found == 3 and holiday_test_voltage_v == 200"
            - "hop 2: Tank.${tank_id}.open_nonconformance_count == 1 and quality_posture == RESTRICTED"
            - "hop 3: Tank.${tank_id}.construction_phase == HYDROTEST_PASSED"
            - "hop 4: CommissioningPackage.${pkg_id}.status == RETURNED_FOR_CORRECTION, deficiency_count == 1, next_internal_due_utc == null, next_external_due_utc == null, reviewed_by_user_id == null"
            - "CoatingApplication.${ca_int_id}.status is still ACCEPTED - the cascade touches only the application that failed its holiday test"

      - name: reexamination_three_hop_phase_revert_without_posture_change
        grounds:
          - state_machines.WeldSeam.RT_ACCEPTED_to_EXAM_SCHEDULED
          - state_machines.ShellCourse.RT_ACCEPTED_to_WELDED
          - state_machines.Tank.construction_phase.SHELL_COMPLETE_to_ERECTION_IN_PROGRESS
        distinguishing_aspect: |
          Depth 3 from a creation call rather than a decision call: merely scheduling a
          further radiograph on an already accepted seam walks WeldSeam -> ShellCourse ->
          Tank.construction_phase. Nothing is wrong yet, so open_nonconformance_count and
          quality_posture must not move at all - the discriminator against the two
          rejection cascades above, which both run through the posture dimension.
        test_recipe:
          setup:
            - "A tank at SHELL_COMPLETE with exactly one course whose single seam V1 is RT_ACCEPTED (the same build chain as the five-hop instance, without any water sourcing)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { seam_id: $.data.id }
            - call: "POST /weld-seams/${seam_id}/weld-log"
              payload: { welder_id: "${w1_id}" }
              as: Welder
              as_user_id: "${w1_id}"
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-11T10:00:00Z", window_end_utc: "2026-08-11T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r1_id: $.data.id }
            - call: "POST /nde-reports/${r1_id}/result"
              payload: { decision: "ACCEPT", indication_count: 0, film_count: 4 }
              as: QcInspector
              as_user_id: "qc-1"
            - call: "POST /tanks/${tank_id}/phase-transitions"
              payload: { target_phase: "SHELL_COMPLETE" }
              as: ProjectEngineer
          trigger:
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-13T10:00:00Z", window_end_utc: "2026-08-13T11:00:00Z", coverage_pct: 20, technician_stamp: "RT-4" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r2_id: $.data.id }
          assert:
            - "before the trigger: WeldSeam.${seam_id}.status == RT_ACCEPTED, ShellCourse.${course_id}.status == RT_ACCEPTED, Tank.${tank_id}.construction_phase == SHELL_COMPLETE"
            - "hop 1: WeldSeam.${seam_id}.status == EXAM_SCHEDULED and last_nde_report_id == ${r2_id}"
            - "hop 2: ShellCourse.${course_id}.status == WELDED"
            - "hop 3: Tank.${tank_id}.construction_phase == ERECTION_IN_PROGRESS"
            - "Tank.${tank_id}.open_nonconformance_count == 0 and quality_posture == OPEN (unchanged)"
            - "NdeReport.${r1_id}.status is still REPORTED_ACCEPT and nonconformance_open == false"
            - "Tank.${tank_id}.weld_reject_rate == 0.0 and required_examination_pct == 10.0"

