      - name: itt_and_per_protocol_lift_diverge_on_the_same_conversion_data
        claim_type: variant_divergence
        grounds:
          - calculations.campaign_lift_and_diversion_penalty.variants
          - complexity_profile.complexity_layers.dual_variant_calculation
          - entities.LiftAnalysis.fields.treated_count
        distinguishing_aspect: "Two screened non-holdout enrollments where only the first ever received a DELIVERED sample: ITT keeps both in the treated denominator (1/2 == 0.5, lift 50.00) while PER_PROTOCOL keeps only the delivered one (1/1 == 1.0, lift 100.00). The delta comes purely from the denominator, since the numerator PurchaseMatch set is identical."
        test_recipe:
          setup:
            - "One campaign with holdout_pct 0.0 and window 2026-07-01 .. 2026-09-30, driven to REVIEW_WINDOW."
            - "Enrollment one: screened, non-holdout, shipment allocated / shipped / DELIVERED, plus one PurchaseMatch at confidence 0.9 inside the conversion window."
            - "Enrollment two: screened, non-holdout, never allocated a shipment and has no PurchaseMatch."
            - "One ITT analysis has already been computed, so the PER_PROTOCOL run must supersede it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { name: "ITT vs PP", objective_type: "TRIAL_GENERATION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: [], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, holdout_pct: 0.0 }
