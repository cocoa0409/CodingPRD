            - "gas_volume_conservation residual == 0.000: 3000000.000 == 3000000.000 + 0.000 + 0.000 - 0.000"
            - "contract ${c1} holds exactly 2 DAILY_IMBALANCE entries for gas_day 2026-08-02, +2000.000 and -2000.000, both with amount_usd == 0.00"
            - "GasMovementTicket.${t1}.total_charge_usd == 7084.80 is still stamped (the money fields are not unwound)"
            - "StorageField.${f1}.version increased by exactly 1 over the reversal"
            - "Nomination.${n1}.status == CONFIRMED with confirmed_volume_dth == 80000 (the schedule is untouched)"

      - name: cash_out_reversal_restores_credit_and_contract_status_without_restoring_the_schedule
        grounds:
          - state_machines.StorageContract.transitions.SUSPENDED_to_ACTIVE
          - entities.ImbalanceLedgerEntry.fields.entry_type
          - entities.Shipper.fields.outstanding_penalty_usd
        distinguishing_aspect: |
          The reversal is a partial compensation by design: the money is conserved exactly (a CASH_OUT_REVERSAL
          entry of -55605.38 drives outstanding_penalty_usd back to 0.00, credit_status back to GOOD, both
          contracts back to ACTIVE, cash_out_amount_usd back to 0.00, cash_out_through_date back to null and
          CD's imbalance_dth back to the pre-cash-out -12345.000), while the physical schedule is NOT restored
          — the nomination curtailed by the suspension stays CURTAILED at confirmed_volume_dth 0 and CE's
          scheduled_injection_dth stays 0. An implementation that "undoes everything" wrongly resurrects the
          nomination; one that only flips the contract status leaves the shipper's penalty outstanding.
        test_recipe:
          setup:
            - "The world of the credit-suspension cascade: field F_STD with one well, one shipper with penalty_threshold_usd 50000.00, contract CD (FIRM, DAILY_RATCHET, index 3.4500) and contract CE (FIRM, MONTHLY_AGGREGATE)."
            - "CD holds a CONFIRMED nomination of 80000 Dth for gas day 2026-08-05 whose CONFIRMED ticket metered 67655 Dth (imbalance -12345.000); CE holds a CONFIRMED nomination of 50000 Dth for gas day 2026-08-25 with no ticket."
            - "POST /storage-contracts/{CD}/cash-out for 2026-08-01..2026-08-31 has already assessed 55605.38 USD, suspending the shipper and both contracts and curtailing CE's nomination."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Aurora Dome", field_code: "F-AUR", total_capacity_dth: 10000000, cushion_gas_dth: 2000000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 3000000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 400000 }, { inventory_pct: 25, withdrawal_dth_per_day: 150000, injection_dth_per_day: 350000 }, { inventory_pct: 50, withdrawal_dth_per_day: 300000, injection_dth_per_day: 250000 }, { inventory_pct: 75, withdrawal_dth_per_day: 450000, injection_dth_per_day: 150000 }, { inventory_pct: 100, withdrawal_dth_per_day: 600000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "AUR-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 50000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CD-RATCHET", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "DAILY_RATCHET" }
              as: SchedulingCoordinator
              captures: { cd: $.data.id }
            - call: "POST /storage-contracts/${cd}/activate"
              payload: {}
              as: SchedulingCoordinator
              captures: { cd_v1: $.data.version }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CE-MONTHLY", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { ce: $.data.id }
            - call: "POST /storage-contracts/${ce}/activate"
              payload: {}
              as: SchedulingCoordinator
              captures: { ce_v1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${cd}", gas_day: "2026-08-05", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cd_v1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { nd: $.data.id }
            - call: "POST /nominations/${nd}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${nd}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${nd}", well_id: "${w1}", actual_volume_dth: 67655 }
              as: FieldOperator
              captures: { td: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { f1_v1: $.data.version }
            - call: "POST /gas-movement-tickets/${td}/confirm"
              payload: { expected_storage_field_version: "${f1_v1}" }
              as: FieldOperator
            - call: "POST /nominations"
              payload: { contract_id: "${ce}", gas_day: "2026-08-25", direction: "INJECTION", nominated_volume_dth: 50000, expected_contract_version: "${ce_v1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { ne: $.data.id }
            - call: "POST /nominations/${ne}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${ne}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /storage-contracts/${cd}/cash-out"
              payload: { period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: SchedulingCoordinator
          trigger:
            - call: "POST /storage-contracts/${cd}/cash-out-reversal"
              payload: { reason: "Index price restated by the pipeline; assessment withdrawn." }
              as: SchedulingCoordinator
          assert:
            - "contract ${cd} holds one CASH_OUT entry with amount_usd == 55605.38 and one CASH_OUT_REVERSAL entry with amount_usd == -55605.38, both with gas_day == null"
            - "Shipper.${s1}.outstanding_penalty_usd == 0.00 and credit_status == GOOD"
            - "StorageContract.${cd}.status == ACTIVE and StorageContract.${ce}.status == ACTIVE"
            - "StorageContract.${cd}.cash_out_amount_usd == 0.00 and cash_out_through_date == null"
            - "StorageContract.${cd}.imbalance_dth == -12345.000 (recomputed once the cash-out horizon is lifted)"
            - "Nomination.${ne}.status == CURTAILED with confirmed_volume_dth == 0 and curtailed_volume_dth == 50000 (the schedule is deliberately NOT restored)"
            - "StorageContract.${ce}.scheduled_injection_dth == 0 and its CURTAILMENT_CREDIT entry of -50000.000 remains"
            - "Nomination.${nd}.status == CONFIRMED and GasMovementTicket.${td}.status == CONFIRMED"
            - "StorageField.${f1}.working_gas_inventory_dth == 3067655.000 (no gas moved during either money operation)"
