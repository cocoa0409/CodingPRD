# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Domain: retail-energy-refrigeration-ops   API prefix: /energy-ops
#   Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file
#   changes no declared behaviour. All numeric asserts were computed with
#   Decimal / ROUND_HALF_UP against the §1.3 formulas and constants.
#   The logical clock default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bill_peak_basis_variant_divergence_on_utility_bill
        grounds:
          - calculations.period_peak_demand
          - calculations.bill_recompute_total
          - entities.UtilityBill.fields.peak_basis
          - entities.UtilityAccount.fields.rate_family
          - state_machines.UtilityBill.transitions.bill_recompute_validated
          - state_machines.UtilityBill.transitions.bill_recompute_flagged
        distinguishing_aspect: |
          Cost accounting on UtilityBill: the coincident_peak variant ranks only
          is_on_peak intervals and the anytime_peak variant ranks every interval,
          so the SAME metered data and the SAME kWh produce billable_demand_kw
          1310.5 vs 1402.0, recomputed_amount_usd 99996.04 vs 101393.20, and
          push one bill to VARIANCE_FLAGGED while the other reaches VALIDATED.
        test_recipe:
          setup:
            - "one store with a published MIXED / SUPERCENTER SUMMER standard, BMS ACTIVE"
            - "two utility accounts on that store carrying identical rates (0.1450 / 0.0800 / 14.50, ratchet 1500.0) and differing only in rate_family: TOU_DEMAND and FLAT_DEMAND"
            - "each account holds the same three June intervals: an on-peak 1310.5, an off-peak 1402.0 and an on-peak 1200.0"
            - "each account holds the same June bill: 240000 on-peak kWh, 518000 off-peak kWh, billed_amount_usd 102500.00"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-DV1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0 }
              as: EnergyManager
              captures: { acct_tou_id: "$.data.id" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "FLAT-GS3", rate_family: "FLAT_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0 }
              as: EnergyManager
              captures: { acct_flat_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_tou_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-10T18:00:00Z", kw_demand: 1310.5, is_on_peak: true }, { interval_start_iso: "2026-06-10T02:00:00Z", kw_demand: 1402.0, is_on_peak: false }, { interval_start_iso: "2026-06-11T18:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_flat_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-10T18:00:00Z", kw_demand: 1310.5, is_on_peak: true }, { interval_start_iso: "2026-06-10T02:00:00Z", kw_demand: 1402.0, is_on_peak: false }, { interval_start_iso: "2026-06-11T18:00:00Z", kw_demand: 1200.0, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_tou_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 240000, off_peak_kwh: 518000, billed_kwh: 758000, billed_peak_kw: 1402.0, billed_amount_usd: 102500.00 }
              as: EnergyAnalyst
              captures: { bill_tou_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_flat_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 240000, off_peak_kwh: 518000, billed_kwh: 758000, billed_peak_kw: 1402.0, billed_amount_usd: 102500.00 }
              as: EnergyAnalyst
              captures: { bill_flat_id: "$.data.id" }
          trigger:
            - call: "POST /energy-ops/utility-bills/${bill_tou_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              as_user_id: "u_analyst_dv1"
            - call: "POST /energy-ops/utility-bills/${bill_flat_id}/recompute"
              payload: {}
              as: EnergyAnalyst
              as_user_id: "u_analyst_dv1"
          assert:
            - "UtilityBill.${bill_tou_id}.peak_basis == COINCIDENT_PEAK"
            - "UtilityBill.${bill_tou_id}.billable_demand_kw == 1310.5"
            - "UtilityBill.${bill_tou_id}.recomputed_energy_cost_usd == 76240.00"
            - "UtilityBill.${bill_tou_id}.recomputed_demand_cost_usd == 19002.25"
            - "UtilityBill.${bill_tou_id}.recomputed_rider_cost_usd == 3571.58"
            - "UtilityBill.${bill_tou_id}.recomputed_surcharge_usd == 1182.21"
            - "UtilityBill.${bill_tou_id}.recomputed_amount_usd == 99996.04"
            - "UtilityBill.${bill_tou_id}.variance_pct == 2.50"
            - "UtilityBill.${bill_tou_id}.validation_state == VARIANCE_FLAGGED"
            - "UtilityBill.${bill_flat_id}.peak_basis == ANYTIME_PEAK"
            - "UtilityBill.${bill_flat_id}.billable_demand_kw == 1402.0"
            - "UtilityBill.${bill_flat_id}.recomputed_energy_cost_usd == 76240.00"
            - "UtilityBill.${bill_flat_id}.recomputed_demand_cost_usd == 20329.00"
            - "UtilityBill.${bill_flat_id}.recomputed_rider_cost_usd == 3621.34"
            - "UtilityBill.${bill_flat_id}.recomputed_surcharge_usd == 1202.86"
            - "UtilityBill.${bill_flat_id}.recomputed_amount_usd == 101393.20"
            - "UtilityBill.${bill_flat_id}.variance_pct == 1.09"
            - "UtilityBill.${bill_flat_id}.validation_state == VALIDATED"
            - "UtilityBill.${bill_flat_id}.recomputed_amount_usd - UtilityBill.${bill_tou_id}.recomputed_amount_usd == 1397.16"

      - name: retrofit_priority_basis_variant_divergence_on_capital_project
        grounds:
          - calculations.retrofit_priority_score
          - entities.RetrofitProject.fields.priority_basis
          - entities.RetrofitProject.fields.priority_score
          - state_machines.RetrofitProject.transitions.retrofit_approve
        distinguishing_aspect: |
          Capital risk scoring on RetrofitProject (a different entity domain from
          the UtilityBill cost variant): the same capex 240240.00 and the same
          520000.00 kWh projection score 58.0 under simple_payback at proposal and
          50.6 under risk_adjusted at approval, because the risk_adjusted variant
          haircuts savings by DEFAULT_REALIZATION_RATE 0.85 before dividing.
        test_recipe:
          setup:
            - "one MIXED / EXPRESS store with the default blended_rate_usd_per_kwh 0.11 and BMS ACTIVE"
            - "no fault diagnostics at all, so the risk_adjusted fault-density bonus is 0"
            - "one retrofit project proposed by u_analyst_r1 with capex_usd 240240.00 and projected_annual_savings_kwh 520000.00"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-DV2", climate_zone: "MIXED", store_format: "EXPRESS", floor_area_sqft: 18000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/retrofit-projects"
              payload: { measure_type: "LED_RETROFIT", capex_usd: 240240.00, projected_annual_savings_kwh: 520000.00 }
              as: EnergyAnalyst
              as_user_id: "u_analyst_r1"
              captures: { proj_id: "$.data.id", proposal_score: "$.data.priority_score" }
          trigger:
            - call: "POST /energy-ops/retrofit-projects/${proj_id}/approve"
              payload: { decision: "APPROVE" }
              as: EnergyManager
              as_user_id: "u_manager_r2"
          assert:
            - "${proposal_score} == 58.0"
            - "RetrofitProject.${proj_id}.priority_basis == RISK_ADJUSTED"
            - "RetrofitProject.${proj_id}.annual_savings_usd == 48620.00"
            - "RetrofitProject.${proj_id}.payback_years == 4.94"
            - "RetrofitProject.${proj_id}.priority_score == 50.6"
            - "RetrofitProject.${proj_id}.state == APPROVED"
            - "RetrofitProject.${proj_id}.approved_by_user_id == u_manager_r2"
            - "the variant switch moved priority_score by exactly -7.4 (58.0 -> 50.6)"

  - rule_id: combinatorial_formula
    instances:
      - name: bill_rider_then_surcharge_evaluation_order_pinned
        grounds:
          - calculations.bill_recompute_total
          - entities.UtilityBill.fields.recomputed_rider_cost_usd
          - entities.UtilityBill.fields.recomputed_surcharge_usd
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the rider is a percentage of
          base_subtotal, the surcharge is a percentage of the excess of
          (base_subtotal + rider) over 20000.00, and the total is the sum of all
          three - so the surcharge depends on the rider while the rider must NOT
          be charged on the surcharge. The pinned order yields rider 3571.58 and
          surcharge 1182.21; charging the rider on the pre-surcharge total or the
          surcharge on the whole subtotal both give a different total.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE and a TOU_DEMAND account (0.1450 / 0.0800 / 14.50, ratchet 1500.0)"
            - "one on-peak interval of 1310.5 kW inside the June period"
            - "one June bill of 240000 on-peak kWh and 518000 off-peak kWh"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-CF1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-06-10T18:00:00Z", kw_demand: 1310.5, is_on_peak: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/utility-bills"
              payload: { period_start_iso: "2026-06-01T00:00:00Z", period_end_iso: "2026-07-01T00:00:00Z", on_peak_kwh: 240000, off_peak_kwh: 518000, billed_kwh: 758000, billed_peak_kw: 1310.5, billed_amount_usd: 99996.04 }
              as: EnergyAnalyst
              captures: { bill_id: "$.data.id" }
          trigger:
            - call: "POST /energy-ops/utility-bills/${bill_id}/recompute"
              payload: {}
              as: EnergyAnalyst
          assert:
            - "UtilityBill.${bill_id}.recomputed_energy_cost_usd == 76240.00"
            - "UtilityBill.${bill_id}.recomputed_demand_cost_usd == 19002.25"
            - "UtilityBill.${bill_id}.recomputed_rider_cost_usd == 3571.58"
            - "UtilityBill.${bill_id}.recomputed_surcharge_usd == 1182.21"
            - "UtilityBill.${bill_id}.recomputed_amount_usd == 99996.04"
            - "UtilityBill.${bill_id}.variance_pct == 0.00"
            - "UtilityBill.${bill_id}.validation_state == VALIDATED"
            - "recomputed_rider_cost_usd is 0.0375 of (energy + demand) only: 3571.58 != 3705.52 (the value it would take if the rider were charged on the pre-surcharge total)"

      - name: dr_settlement_round_per_interval_then_sum
        grounds:
          - calculations.dr_event_settlement
          - calculations.dr_baseline_kw
          - entities.DemandResponseEvent.fields.total_reduction_kwh
          - state_machines.DemandResponseEvent.transitions.dr_settle
        distinguishing_aspect: |
          Mode (b) nested-rounding order on a different metric from the bill
          instance: each 15-minute reduction is rounded to 2 dp BEFORE the sum,
          giving total_reduction_kwh 207.54, whereas summing the unrounded
          products and rounding once gives 207.55 - a one-cent-of-kWh divergence
          that changes incentive_usd.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE and one TOU_DEMAND account"
            - "three eligible on-peak non-event intervals at 1290.5, 1275.0 and 1245.0 kW before the curtailment window, plus an excluded event-day interval at 1500.0 and an excluded off-peak interval at 1600.0"
            - "one event over 2026-08-05T14:00Z-15:00Z with target_reduction_kw 200.0, notified and activated, whose four in-window intervals are 1050.0, 1020.5, 1100.0 and 1080.0 kW"
            - "the clock advanced past curtailment_end_iso so the sweep has completed the event"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-CF2", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Midland Power", rate_schedule_code: "TOU-GS3", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800, ratchet_peak_kw: 1500.0 }
              as: EnergyManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-04T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-08-04T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-08-04T16:00:00Z", kw_demand: 1245.0, is_on_peak: true }, { interval_start_iso: "2026-08-03T14:00:00Z", kw_demand: 1500.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-04T02:00:00Z", kw_demand: 1600.0, is_on_peak: false } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-08-05T14:00:00Z", kw_demand: 1050.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:15:00Z", kw_demand: 1020.5, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:30:00Z", kw_demand: 1100.0, is_on_peak: true, is_dr_event_day: true }, { interval_start_iso: "2026-08-05T14:45:00Z", kw_demand: 1080.0, is_on_peak: true, is_dr_event_day: true } ] }
              as: EnergyAnalyst
            - call: "POST /energy-ops/utility-accounts/${acct_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-05T14:00:00Z", curtailment_end_iso: "2026-08-05T15:00:00Z", target_reduction_kw: 200.0 }
              as: EnergyManager
              captures: { event_id: "$.data.id" }
            - call: "POST /energy-ops/demand-response-events/${event_id}/notify"
              payload: {}
              as: EnergyManager
              captures: { baseline: "$.data.baseline_kw" }
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/demand-response-events/${event_id}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T15:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /energy-ops/demand-response-events/${event_id}/settle"
              payload: {}
              as: EnergyAnalyst
          assert:
            - "${baseline} == 1270.17"
            - "DemandResponseEvent.${event_id}.total_reduction_kwh == 207.54"
            - "DemandResponseEvent.${event_id}.total_reduction_kwh != 207.55"
            - "DemandResponseEvent.${event_id}.performance_pct == 103.8"
            - "DemandResponseEvent.${event_id}.incentive_usd == 87.17"
            - "DemandResponseEvent.${event_id}.penalty_usd == 0.00"
            - "DemandResponseEvent.${event_id}.event_state == COMPLETED"
            - "DemandResponseEvent.${event_id}.settlement_state == SETTLED"
            - "UtilityAccount.${acct_id}.dr_incentive_accrued_usd == 87.17"

  - rule_id: non_linear_state_machine
    instances:
      - name: excursion_acknowledge_rebreach_cycle
        grounds:
          - state_machines.TempExcursion.transitions.excursion_acknowledge
          - state_machines.TempExcursion.transitions.excursion_rebreach
          - state_machines.RefrigerationCase.transitions.case_alarm_on_breach_run
          - calculations.excursion_exposure
        distinguishing_aspect: |
          Cyclic ACKNOWLEDGED -> OPEN -> ACKNOWLEDGED on TempExcursion: a further
          breaching reading below ESCALATE_MINUTES reopens an excursion the store
          manager already acknowledged, so the same state is visited twice on one
          row while exposure_minutes and peak_temp_f keep advancing monotonically
          (15 -> 30) and consecutive_breach_count keeps climbing (2 -> 3).
        test_recipe:
          setup:
            - "one COLD / NEIGHBORHOOD store with BMS ACTIVE"
            - "one MEDIUM_TEMP DAIRY case with alarm_high_f 41.0 and alarm_low_f 28.0"
            - "the clock at 2026-08-01T12:00:00Z so all reading instants are in the past"
            - "two breaching readings 42.0 at 04:00Z and 42.5 at 04:15Z, which arm the alarm and open the excursion"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-NL1", climate_zone: "COLD", store_format: "NEIGHBORHOOD", floor_area_sqft: 42000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "NEIGHBORHOOD", season: "SUMMER", cooling_setpoint_f: 73.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 700 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-NL1-01", case_type: "MEDIUM_TEMP", product_class: "DAIRY", alarm_high_f: 41.0, alarm_low_f: 28.0, product_value_usd: 6400.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { r1_state: "$.data.monitoring_state", r1_count: "$.data.consecutive_breach_count" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 42.5, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_id: "$.data.excursion_id", r2_state: "$.data.excursion_state", r2_exposure: "$.data.exposure_minutes" }
          trigger:
            - call: "POST /energy-ops/excursions/${exc_id}/acknowledge"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 41.5, reading_iso: "2026-08-01T04:30:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { r3_state: "$.data.excursion_state", r3_exposure: "$.data.exposure_minutes", r3_peak: "$.data.peak_temp_f", r3_count: "$.data.consecutive_breach_count" }
            - call: "POST /energy-ops/excursions/${exc_id}/acknowledge"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
          assert:
            - "${r1_state} == ARMED"
            - "${r1_count} == 1"
            - "${r2_state} == OPEN"
            - "${r2_exposure} == 15"
            - "RefrigerationCase.${case_id}.monitoring_state == ALARM"
            - "after the first acknowledge TempExcursion.${exc_id}.state == ACKNOWLEDGED"
