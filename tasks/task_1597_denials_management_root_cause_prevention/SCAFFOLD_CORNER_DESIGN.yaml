        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_SCORECARD_PERIOD]"]
        distinguishing_aspect: "(department, period_start_date) uniqueness: a second CODING scorecard starting 2026-08-01 fails with ERR_DUPLICATE_SCORECARD_PERIOD even with a different end date."
        test_recipe:
