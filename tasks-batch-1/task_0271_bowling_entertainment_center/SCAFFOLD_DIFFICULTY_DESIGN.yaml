  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cancel_checked_in_state_beats_fiscal_refund
        grounds:
          - validations[priority=30]
          - validations[priority=60]
          - state_machines.Reservation.DRAFT_to_HELD
        distinguishing_aspect: "Error-category pair state (P30) vs business_fiscal (P60): a re-hold of an already-HELD reservation whose Customer is also SUSPENDED trips BOTH the invalid-state check (P30, not DRAFT) and the suspended-customer fiscal check (P60); P30 wins, so ERR_INVALID_STATE (409) is returned, not ERR_CUSTOMER_SUSPENDED."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE, Customer C, Reservation R HELD; then Customer C is SUSPENDED while R remains HELD (suspension expires HELD bookings, so this R is created and held, then C suspended — but R was already HELD so the cascade expires it; to keep R HELD we suspend AFTER capturing a second DRAFT reservation that is held). Concretely: C holds R (HELD); C is suspended (R -> EXPIRED by cascade). The dual-failure is observed on a re-hold of the now-EXPIRED R: P30 invalid-state (EXPIRED is terminal, not DRAFT) AND P60 customer suspended both hold."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "P1", per_game_cents: 1000, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
