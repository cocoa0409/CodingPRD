scenario: "Trademark Filing & Prosecution: mark/Nice class, USPTO application (use vs intent-to-use), office action response, statement of use, TTAB opposition/cancellation, §8/§9 renewal, Madrid international, docketing deadlines"
domain_name: trademark-filing-prosecution
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - rate_threshold_triggers

  entity_topology: graph
  # Flat peer entities (Application, OfficeAction, StatementOfUse, TTABProceeding,
  # Registration, MaintenanceFiling, MadridApplication) linked by FK references,
  # plus a deadline ledger that fans across many parents. No nesting in URL paths.

  state_machine_shape: cyclic
  # TrademarkApplication has an office-action revision loop
  # (UNDER_EXAMINATION -> OFFICE_ACTION_ISSUED -> UNDER_EXAMINATION) and the
  # registration maintenance lifecycle revisits ACTIVE after each §8/§9 cycle.
  # TTABProceeding carries parallel claim/defense dimensions.

  relationship_patterns:
    - one_to_many        # Application -> GoodsServicesItem, Application -> OfficeAction, Application -> DocketDeadline
    - many_to_many       # Application <-> NiceClass via GoodsServicesItem
    - cross_aggregate    # TTABProceeding references the registration/application it attacks; MadridApplication references its basic application
    - polymorphic        # DocketDeadline.subject references one of several parent entity types

  role_model: peer_roles
  # Applicant owns its own marks; Attorney prosecutes on behalf of applicants;
  # Examiner (opaque USPTO operator) issues office actions and approves;
  # TTABClerk (opaque operator) administers board proceedings.

  consistency_model: immediate

# ============================================================================
# 1.0 Response Envelope (FIXED — emitted verbatim)
# ============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: legal_name
        type: string
        source: input
        description: legal name of the trademark owner
        constraints: non-empty
      - name: entity_type
        type: enum
        source: input
        description: owner legal form
        constraints: one of INDIVIDUAL, CORPORATION, PARTNERSHIP, LLC
      - name: country_code
        type: string
        source: input
        description: ISO-3166 alpha-2 domicile country
        constraints: 2 uppercase letters
      - name: is_foreign_domiciled
        type: boolean
        source: computed
        description: "true iff country_code != 'US'; foreign-domiciled applicants must act through an Attorney (see validations)"
      - name: open_application_count
        type: integer
        source: computed
        description: "count of TrademarkApplication rows with this applicant_id whose status NOT IN {REGISTERED, ABANDONED}"
        default: 0

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: full_name
        type: string
        source: input
        description: attorney name
        constraints: non-empty
      - name: bar_number
        type: string
        source: input
        description: US state bar registration number
        constraints: non-empty, unique across Attorney
      - name: bar_state
        type: string
        source: input
        description: two-letter US state of bar admission
        constraints: 2 uppercase letters
      - name: status
        type: enum
        source: system
        description: bar standing; only ACTIVE attorneys may file
        default: ACTIVE
        constraints: one of ACTIVE, SUSPENDED

  - name: TrademarkApplication
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the owner of this mark
      - name: attorney_id
        type: string
        source: input
        description: "FK -> Attorney.id; prosecuting attorney of record; nullable when applicant is US-domiciled and self-represents"
        constraints: nullable
      - name: mark_text
        type: string
        source: input
        description: literal element of the mark (standard-character)
        constraints: non-empty, max 200 chars
      - name: filing_basis
        type: enum
        source: input
        description: "statutory filing basis: USE (§1(a), mark already in commerce) or INTENT (§1(b), intent-to-use)"
        constraints: one of USE, INTENT
      - name: filing_tier
        type: enum
        source: input
        description: "TEAS application tier; TEAS_PLUS requires goods/services drawn from the ID Manual (pre_approved=true on every item)"
        constraints: one of TEAS_PLUS, TEAS_STANDARD
      - name: status
        type: enum
        source: system
        description: prosecution lifecycle state
        default: DRAFT
        constraints: one of DRAFT, FILED, UNDER_EXAMINATION, OFFICE_ACTION_ISSUED, PUBLISHED, ALLOWED, ABANDONED, REGISTERED
      - name: class_count
        type: integer
        source: computed
        description: "count of distinct nice_class_id across this application's GoodsServicesItem rows"
        default: 0
      - name: filing_fee_cents
        type: integer
        source: computed
        description: "total government filing fee in USD cents; tiered per filing_tier × class_count (see calc application_filing_fee)"
        default: 0
      - name: office_action_round
        type: integer
        source: computed
        description: "number of office actions issued on this application so far; increments each OFFICE_ACTION_ISSUED entry"
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: "timestamp the application transitioned DRAFT -> FILED; null while DRAFT"
        constraints: nullable
      - name: published_at
        type: datetime
        source: system
        description: "timestamp the application transitioned to PUBLISHED (opens the 30-day opposition window); null until published"
        constraints: nullable
      - name: notice_of_allowance_at
        type: datetime
        source: system
        description: "timestamp an INTENT application transitioned to ALLOWED (starts the §1(d) SOU clock); null otherwise"
        constraints: nullable

  - name: NiceClass
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: class_number
        type: integer
        source: input
        description: International (Nice) class number
        constraints: integer 1..45, unique across NiceClass
      - name: title
        type: string
        source: input
        description: short heading of the class
        constraints: non-empty
      - name: is_service_class
        type: boolean
        source: computed
        description: "true iff class_number BETWEEN 35 AND 45 (service classes); false for goods classes 1..34"

  - name: GoodsServicesItem
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: application_id
        type: string
        source: input
        description: FK -> TrademarkApplication.id; the application this item belongs to
      - name: nice_class_id
        type: string
        source: input
        description: FK -> NiceClass.id; the Nice class this item is filed under
      - name: description
        type: string
        source: input
        description: identification of the specific goods or services
        constraints: non-empty, max 500 chars
      - name: pre_approved
        type: boolean
        source: input
        description: "true iff the identification is drawn verbatim from the USPTO ID Manual; TEAS_PLUS requires this on every item"
        default: false
      - name: use_status
        type: enum
        source: system
        description: "per-item use status; for INTENT applications all items start NOT_IN_USE and flip IN_USE only via an accepted StatementOfUse"
        default: NOT_IN_USE
        constraints: one of NOT_IN_USE, IN_USE

  - name: OfficeAction
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: application_id
        type: string
        source: input
        description: FK -> TrademarkApplication.id; application the action is issued against
      - name: round_number
        type: integer
        source: system
        description: "1-based ordinal of this action within the application (1 = first action, 2 = final action, ...)"
      - name: is_final
        type: boolean
        source: input
        description: "true for a FINAL office action; a second substantive action on the same ground is final"
        default: false
      - name: ground
        type: enum
        source: input
        description: refusal/requirement ground cited by the examiner
        constraints: one of LIKELIHOOD_OF_CONFUSION, MERELY_DESCRIPTIVE, SPECIMEN_DEFECT, IDENTIFICATION_INDEFINITE
      - name: issued_at
        type: datetime
        source: system
        description: timestamp the office action was issued (starts the response clock)
      - name: response_deadline
        type: datetime
        source: computed
        description: "issued_at + RESPONSE_PERIOD_DAYS (see calc docket_deadline_windows); a DocketDeadline row mirrors this"
      - name: status
        type: enum
        source: system
        description: office-action lifecycle
        default: OUTSTANDING
        constraints: one of OUTSTANDING, RESPONDED, EXPIRED

  - name: OfficeActionResponse
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: office_action_id
        type: string
        source: input
        description: FK -> OfficeAction.id; the action being responded to
      - name: argument_text
        type: string
        source: input
        description: substantive argument/remarks
        constraints: non-empty
      - name: amends_identification
        type: boolean
        source: input
        description: "true iff the response narrows/amends the goods-services identification to overcome the refusal"
        default: false
      - name: submitted_at
        type: datetime
        source: system
        description: timestamp the response was submitted
      - name: days_late
        type: integer
        source: computed
        description: "max(0, ceil((submitted_at - office_action.response_deadline)/1 day)); 0 when on or before the deadline"
        default: 0

  - name: StatementOfUse
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: application_id
        type: string
        source: input
        description: FK -> TrademarkApplication.id; the INTENT application alleging use
      - name: specimen_url
        type: string
        source: input
        description: URL of the specimen of use
        constraints: non-empty
      - name: first_use_date
        type: datetime
        source: input
        description: date of first use of the mark in commerce
      - name: extension_number
        type: integer
        source: input
        description: "0 for the SOU filed in the initial 6-month window, else the Nth granted extension request (1..5) the SOU is filed under"
        default: 0
        constraints: integer 0..5
      - name: status
        type: enum
        source: system
        description: SOU review lifecycle
        default: SUBMITTED
        constraints: one of SUBMITTED, ACCEPTED

  - name: TTABProceeding
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: proceeding_type
        type: enum
        source: input
        description: "OPPOSITION (against a PUBLISHED application) or CANCELLATION (against a REGISTERED mark)"
        constraints: one of OPPOSITION, CANCELLATION
      - name: target_application_id
        type: string
        source: input
        description: "FK -> TrademarkApplication.id; the published application opposed; required when proceeding_type=OPPOSITION, else null"
        constraints: nullable
      - name: target_registration_id
        type: string
        source: input
        description: "FK -> Registration.id; the registration challenged; required when proceeding_type=CANCELLATION, else null"
        constraints: nullable
      - name: petitioner_applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the party bringing the proceeding
      - name: claim_status
        type: enum
        source: system
        description: "claim dimension (advances independently of defense_status); the petitioner's pleading lifecycle"
        default: PLEADED
        constraints: one of PLEADED, TRIAL, SUSTAINED, DISMISSED, WITHDRAWN
      - name: defense_status
        type: enum
        source: system
        description: "defense dimension (advances independently of claim_status); the defendant's answer lifecycle"
        default: AWAITING_ANSWER
        constraints: one of AWAITING_ANSWER, ANSWERED, DEFAULTED
      - name: filed_at
        type: datetime
        source: system
        description: timestamp the proceeding was instituted
      - name: answer_deadline
        type: datetime
        source: computed
        description: "filed_at + ANSWER_PERIOD_DAYS; mirrored by a DocketDeadline row"

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: application_id
        type: string
        source: input
        description: FK -> TrademarkApplication.id; the application that matured into this registration
      - name: registration_number
        type: string
        source: system
        description: server-assigned registration serial; unique across Registration
        constraints: unique
      - name: registered_at
        type: datetime
        source: system
        description: registration date (anchors all §8/§9 maintenance windows)
      - name: status
        type: enum
        source: system
        description: registration maintenance lifecycle
        default: ACTIVE
        constraints: one of ACTIVE, GRACE, CANCELLED, EXPIRED
      - name: maintenance_cycle
        type: integer
        source: computed
        description: "number of accepted MaintenanceFiling rows for this registration; 0 at registration, increments on each acceptance"
        default: 0
      - name: next_maintenance_due_at
        type: datetime
        source: computed
        description: "the deadline of the next required §8/§9 filing relative to registered_at (see calc maintenance_window); null once EXPIRED/CANCELLED"

  - name: MaintenanceFiling
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: registration_id
        type: string
        source: input
        description: FK -> Registration.id; the registration being maintained
      - name: filing_type
        type: enum
        source: input
        description: "SECTION_8 (declaration of continued use) or SECTION_9 (renewal, always combined with §8 at the 10-year mark)"
        constraints: one of SECTION_8, SECTION_8_AND_9
      - name: filed_at
        type: datetime
        source: system
        description: timestamp filed
      - name: in_grace_period
        type: boolean
        source: computed
        description: "true iff filed_at falls in the 6-month grace window after next_maintenance_due_at (triggers grace surcharge)"
        default: false
      - name: fee_cents
        type: integer
        source: computed
        description: "maintenance fee in USD cents incl. per-class component and grace surcharge (see calc maintenance_fee)"
        default: 0
      - name: status
        type: enum
        source: system
        description: review lifecycle
        default: SUBMITTED
        constraints: one of SUBMITTED, ACCEPTED

  - name: MadridApplication
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: basic_application_id
        type: string
        source: input
        description: "FK -> TrademarkApplication.id; the basic US application/registration this international application is based on"
      - name: designated_countries
        type: array
        source: input
        description: array of ISO-3166 alpha-2 country codes designated for protection
        constraints: non-empty, each 2 uppercase letters, no duplicates
      - name: status
        type: enum
        source: system
        description: Madrid lifecycle
        default: PENDING_CERTIFICATION
        constraints: one of PENDING_CERTIFICATION, CERTIFIED, FORWARDED_TO_WIPO, CEASED
      - name: dependency_end_at
        type: datetime
        source: computed
        description: "basic_application.filed_at + DEPENDENCY_YEARS; before this date a central attack on the basic mark cascades a ceasing of the international registration"
      - name: fee_cents
        type: integer
        source: computed
        description: "international filing fee in USD cents = base + per-designated-country component (see calc madrid_fee)"
        default: 0

  - name: DocketDeadline
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID, no prefix; identity only, never a business-decision input
      - name: subject_type
        type: enum
        source: input
        description: "polymorphic parent kind this deadline belongs to"
        constraints: one of OFFICE_ACTION, OPPOSITION_ANSWER, SOU, MAINTENANCE, OPPOSITION_WINDOW
      - name: subject_id
        type: string
        source: input
        description: "polymorphic id of the parent row identified by subject_type (OfficeAction.id, TTABProceeding.id, TrademarkApplication.id, or Registration.id)"
      - name: application_id
        type: string
        source: input
        description: "FK -> TrademarkApplication.id; the application this deadline rolls up to for docket listing; null for MAINTENANCE deadlines"
        constraints: nullable
      - name: due_at
        type: datetime
        source: input
        description: the deadline timestamp (computed by the creating transition and passed in)
      - name: status
        type: enum
        source: system
        description: docket lifecycle
        default: PENDING
        constraints: one of PENDING, MET, MISSED, CANCELLED

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: TrademarkApplication
    initial_state: DRAFT
    terminal_states: [REGISTERED, ABANDONED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /applications/{id}/file"
        actor: Attorney
        preconditions:
          - "class_count >= 1 (at least one GoodsServicesItem)"
          - "attorney of record has status ACTIVE"
          - "if applicant.is_foreign_domiciled then attorney_id is not null"
          - "if filing_tier == TEAS_PLUS then every GoodsServicesItem.pre_approved == true"
        side_effects:
          - "set filed_at = now; set filing_fee_cents per calc application_filing_fee"
          - "increment applicant.open_application_count by 1"
          - "increment TrademarkApplication.version by 1"
        note: "filing fee is locked at FILED time and does not change if classes are later amended"
      - from: FILED
        to: UNDER_EXAMINATION
        trigger: "POST /applications/{id}/assign-examination"
        actor: Examiner
        preconditions:
          - "status == FILED"
        side_effects:
          - "increment TrademarkApplication.version by 1"
      - from: UNDER_EXAMINATION
        to: OFFICE_ACTION_ISSUED
        trigger: "POST /office-actions"
        actor: Examiner
        preconditions:
          - "application.status == UNDER_EXAMINATION"
        side_effects:
          - "create OfficeAction (round_number = application.office_action_round + 1, status OUTSTANDING, response_deadline per calc docket_deadline_windows)"
          - "increment application.office_action_round by 1"
          - "create DocketDeadline(subject_type=OFFICE_ACTION, subject_id=officeAction.id, due_at=officeAction.response_deadline, status PENDING)"
          - "increment TrademarkApplication.version by 1"
      - from: OFFICE_ACTION_ISSUED
        to: UNDER_EXAMINATION
        trigger: "POST /office-action-responses (on the OUTSTANDING action)"
        actor: Attorney
        preconditions:
          - "the application's latest OfficeAction.status == OUTSTANDING"
          - "submitted_at <= office_action.response_deadline OR office_action.is_final == false (a non-final action accepts late filings within grace; a final action does not — see validations)"
        side_effects:
          - "set OfficeAction.status = RESPONDED"
          - "set DocketDeadline(subject_id=officeAction.id).status = MET"
          - "increment TrademarkApplication.version by 1"
        note: "revision loop: each response returns the application to UNDER_EXAMINATION; a fresh examination may issue another OfficeAction"
      - from: UNDER_EXAMINATION
        to: PUBLISHED
        trigger: "POST /applications/{id}/approve-publication"
        actor: Examiner
        preconditions:
          - "application.status == UNDER_EXAMINATION"
          - "no OfficeAction on this application has status OUTSTANDING"
        side_effects:
          - "set published_at = now"
          - "create DocketDeadline(subject_type=OPPOSITION_WINDOW, subject_id=application.id, due_at = published_at + OPPOSITION_WINDOW_DAYS, status PENDING)"
          - "increment TrademarkApplication.version by 1"
        note: "opens the 30-day opposition window"
      - from: PUBLISHED
        to: ALLOWED
        trigger: "POST /applications/{id}/issue-allowance"
        actor: Examiner
        preconditions:
          - "application.status == PUBLISHED"
          - "application.filing_basis == INTENT"
          - "no TTABProceeding with target_application_id == this id has claim_status IN {PLEADED, TRIAL}"
        side_effects:
          - "set notice_of_allowance_at = now"
          - "create DocketDeadline(subject_type=SOU, subject_id=application.id, due_at = notice_of_allowance_at + SOU_INITIAL_DAYS, status PENDING)"
          - "increment TrademarkApplication.version by 1"
        note: "INTENT-only branch: a Notice of Allowance starts the §1(d) Statement-of-Use clock"
      - from: PUBLISHED
        to: REGISTERED
        trigger: "POST /applications/{id}/register"
        actor: Examiner
        preconditions:
          - "application.status == PUBLISHED"
          - "application.filing_basis == USE"
          - "no TTABProceeding with target_application_id == this id has claim_status IN {PLEADED, TRIAL}"
        side_effects:
          - "create Registration (status ACTIVE, maintenance_cycle 0, registered_at = now, next_maintenance_due_at per calc maintenance_window)"
          - "create DocketDeadline(subject_type=MAINTENANCE, subject_id=registration.id, due_at=registration.next_maintenance_due_at, status PENDING)"
          - "cancel any PENDING DocketDeadline(subject_type=OPPOSITION_WINDOW, subject_id=application.id)"
          - "increment TrademarkApplication.version by 1"
        note: "USE branch registers directly from publication"
      - from: ALLOWED
        to: REGISTERED
        trigger: "POST /statements-of-use/{id}/accept"
        actor: Examiner
        preconditions:
          - "application.status == ALLOWED"
          - "a StatementOfUse for this application has status SUBMITTED"
        side_effects:
          - "set StatementOfUse.status = ACCEPTED"
          - "set every GoodsServicesItem.use_status = IN_USE for this application"
          - "create Registration (status ACTIVE, maintenance_cycle 0, registered_at = now, next_maintenance_due_at per calc maintenance_window)"
          - "set DocketDeadline(subject_type=SOU, subject_id=application.id).status = MET"
          - "create DocketDeadline(subject_type=MAINTENANCE, subject_id=registration.id, due_at=registration.next_maintenance_due_at, status PENDING)"
          - "increment TrademarkApplication.version by 1"
      - from: OFFICE_ACTION_ISSUED
        to: ABANDONED
        trigger: "POST /office-actions/{id}/expire (response_deadline passed with no response)"
        actor: system
        preconditions:
          - "office_action.status == OUTSTANDING"
          - "current clock >= office_action.response_deadline + (FINAL_GRACE_DAYS if office_action.is_final else NONFINAL_GRACE_DAYS)"
        side_effects:
          - "set OfficeAction.status = EXPIRED"
          - "set DocketDeadline(subject_id=officeAction.id).status = MISSED"
          - "decrement applicant.open_application_count by 1"
          - "increment TrademarkApplication.version by 1"
        note: "abandonment for failure to respond"
      - from: ALLOWED
        to: ABANDONED
        trigger: "POST /applications/{id}/abandon-sou-lapsed (SOU deadline + all extensions exhausted)"
        actor: system
        preconditions:
          - "application.status == ALLOWED"
          - "current clock >= notice_of_allowance_at + SOU_MAX_DAYS"
          - "no StatementOfUse for this application has status ACCEPTED"
        side_effects:
          - "set DocketDeadline(subject_type=SOU, subject_id=application.id).status = MISSED"
          - "decrement applicant.open_application_count by 1"
          - "increment TrademarkApplication.version by 1"

  - entity: TTABProceeding
    initial_state: "claim_status=PLEADED, defense_status=AWAITING_ANSWER"
    terminal_states: ["claim_status IN {SUSTAINED, DISMISSED, WITHDRAWN}"]
    transitions:
      - from: "defense_status=AWAITING_ANSWER"
        to: "defense_status=ANSWERED"
        trigger: "POST /ttab-proceedings/{id}/answer"
        actor: Applicant
        preconditions:
          - "defense_status == AWAITING_ANSWER"
          - "current clock <= answer_deadline"
          - "claim_status IN {PLEADED, TRIAL}"
        side_effects:
          - "set DocketDeadline(subject_type=OPPOSITION_ANSWER, subject_id=proceeding.id).status = MET"
          - "increment TTABProceeding.version by 1"
        note: "defense dimension advances independently of claim_status"
      - from: "defense_status=AWAITING_ANSWER"
        to: "defense_status=DEFAULTED"
        trigger: "POST /ttab-proceedings/{id}/enter-default (answer_deadline passed)"
        actor: TTABClerk
        preconditions:
          - "defense_status == AWAITING_ANSWER"
          - "current clock > answer_deadline"
        side_effects:
          - "set DocketDeadline(subject_type=OPPOSITION_ANSWER, subject_id=proceeding.id).status = MISSED"
          - "set claim_status = SUSTAINED"
          - "if proceeding_type == OPPOSITION: set target_application.status = ABANDONED and decrement that applicant.open_application_count by 1"
          - "if proceeding_type == CANCELLATION: set target_registration.status = CANCELLED and set target_registration.next_maintenance_due_at = null"
          - "increment TTABProceeding.version by 1"
        note: "default judgment cascades to the attacked mark"
      - from: "claim_status=PLEADED"
        to: "claim_status=TRIAL"
        trigger: "POST /ttab-proceedings/{id}/set-for-trial"
        actor: TTABClerk
        preconditions:
          - "claim_status == PLEADED"
          - "defense_status == ANSWERED"
        side_effects:
          - "increment TTABProceeding.version by 1"
      - from: "claim_status=TRIAL"
        to: "claim_status=SUSTAINED"
        trigger: "POST /ttab-proceedings/{id}/decide (petitioner prevails)"
        actor: TTABClerk
        preconditions:
          - "claim_status == TRIAL"
          - "request body decision == SUSTAIN"
        side_effects:
          - "if proceeding_type == OPPOSITION: set target_application.status = ABANDONED and decrement that applicant.open_application_count by 1"
          - "if proceeding_type == CANCELLATION: set target_registration.status = CANCELLED and set target_registration.next_maintenance_due_at = null; for each MadridApplication whose basic_application_id == target_registration.application_id and current clock < dependency_end_at: set its status = CEASED"
          - "increment TTABProceeding.version by 1"
        note: "central-attack cascade: a sustained cancellation within the dependency period ceases dependent Madrid registrations"
      - from: "claim_status=TRIAL"
        to: "claim_status=DISMISSED"
        trigger: "POST /ttab-proceedings/{id}/decide (defendant prevails)"
        actor: TTABClerk
        preconditions:
          - "claim_status == TRIAL"
          - "request body decision == DISMISS"
        side_effects:
          - "increment TTABProceeding.version by 1"
        note: "no cascade; the attacked mark survives"
      - from: "claim_status=PLEADED"
        to: "claim_status=WITHDRAWN"
        trigger: "POST /ttab-proceedings/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "claim_status == PLEADED"
        side_effects:
          - "cancel any PENDING DocketDeadline(subject_type=OPPOSITION_ANSWER, subject_id=proceeding.id)"
          - "increment TTABProceeding.version by 1"

  - entity: Registration
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /maintenance-filings/{id}/accept (timely §8/§9 filing accepted)"
        actor: Examiner
        preconditions:
          - "registration.status == ACTIVE"
          - "the MaintenanceFiling.status == SUBMITTED"
          - "filing.in_grace_period == false"
        side_effects:
          - "set MaintenanceFiling.status = ACCEPTED"
          - "increment registration.maintenance_cycle by 1"
          - "set registration.next_maintenance_due_at per calc maintenance_window"
          - "set DocketDeadline(subject_type=MAINTENANCE, subject_id=registration.id).status = MET"
          - "create DocketDeadline(subject_type=MAINTENANCE, subject_id=registration.id, due_at = new next_maintenance_due_at, status PENDING) if next_maintenance_due_at is not null"
          - "increment Registration.version by 1"
        note: "maintenance loop revisits ACTIVE after each cycle"
      - from: ACTIVE
        to: GRACE
        trigger: "POST /registrations/{id}/enter-grace (next_maintenance_due_at passed with no accepted filing)"
        actor: system
        preconditions:
          - "registration.status == ACTIVE"
          - "current clock > registration.next_maintenance_due_at"
          - "no MaintenanceFiling for this registration with status ACCEPTED for the current cycle"
        side_effects:
          - "set DocketDeadline(subject_type=MAINTENANCE, subject_id=registration.id).status = MISSED"
          - "increment Registration.version by 1"
      - from: GRACE
        to: ACTIVE
        trigger: "POST /maintenance-filings/{id}/accept (grace-period §8/§9 filing accepted)"
        actor: Examiner
        preconditions:
          - "registration.status == GRACE"
          - "the MaintenanceFiling.status == SUBMITTED"
          - "filing.in_grace_period == true"
          - "current clock <= registration.next_maintenance_due_at + GRACE_WINDOW_DAYS"
        side_effects:
          - "set MaintenanceFiling.status = ACCEPTED"
          - "increment registration.maintenance_cycle by 1"
          - "set registration.next_maintenance_due_at per calc maintenance_window"
          - "create DocketDeadline(subject_type=MAINTENANCE, subject_id=registration.id, due_at = new next_maintenance_due_at, status PENDING) if next_maintenance_due_at is not null"
          - "increment Registration.version by 1"
      - from: GRACE
        to: EXPIRED
        trigger: "POST /registrations/{id}/expire (grace window elapsed)"
        actor: system
        preconditions:
          - "registration.status == GRACE"
          - "current clock > registration.next_maintenance_due_at + GRACE_WINDOW_DAYS"
        side_effects:
          - "set registration.next_maintenance_due_at = null"
          - "increment Registration.version by 1"

  - entity: MadridApplication
    initial_state: PENDING_CERTIFICATION
    terminal_states: [FORWARDED_TO_WIPO, CEASED]
    transitions:
      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /madrid-applications/{id}/certify"
        actor: Examiner
        preconditions:
          - "status == PENDING_CERTIFICATION"
          - "basic_application.status IN {FILED, UNDER_EXAMINATION, OFFICE_ACTION_ISSUED, PUBLISHED, ALLOWED, REGISTERED}"
        side_effects:
          - "set fee_cents per calc madrid_fee"
          - "increment MadridApplication.version by 1"
      - from: CERTIFIED
        to: FORWARDED_TO_WIPO
        trigger: "POST /madrid-applications/{id}/forward"
        actor: Examiner
        preconditions:
          - "status == CERTIFIED"
        side_effects:
          - "increment MadridApplication.version by 1"
      - from: PENDING_CERTIFICATION
        to: CEASED
        trigger: "system cascade from a sustained central attack on the basic mark"
        actor: system
        preconditions:
          - "status IN {PENDING_CERTIFICATION, CERTIFIED, FORWARDED_TO_WIPO}"
          - "the basic mark was abandoned/cancelled and current clock < dependency_end_at"
        side_effects:
          - "increment MadridApplication.version by 1"
        note: "no own endpoint — reached only as a cascade side-effect of TTABProceeding decide/SUSTAINED"
      - from: CERTIFIED
        to: CEASED
        trigger: "system cascade from a sustained central attack on the basic mark"
        actor: system
        preconditions:
          - "current clock < dependency_end_at"
        side_effects:
          - "increment MadridApplication.version by 1"
      - from: FORWARDED_TO_WIPO
        to: CEASED
        trigger: "system cascade from a sustained central attack on the basic mark"
        actor: system
        preconditions:
          - "current clock < dependency_end_at"
        side_effects:
          - "increment MadridApplication.version by 1"

# ----------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: sou-create-stale-application
    parent_entity: TrademarkApplication
    write_endpoint: "POST /statements-of-use"
    occ_field: "expected_application_version"
    description: |
      Filing a StatementOfUse against a TrademarkApplication whose version has
      advanced since the client last observed it is rejected as stale. A second
      SOU can legitimately supersede a prior one (the product allows refiling a
      corrected SOU while the application is ALLOWED), so a writer whose view of
      the application is stale must be turned away on the version check rather
      than silently overwriting the newer state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: maintenance-create-stale-registration
    parent_entity: Registration
    write_endpoint: "POST /maintenance-filings"
    occ_field: "expected_registration_version"
    description: |
      Filing a MaintenanceFiling against a Registration whose version has
      advanced since the client last read it is rejected as stale. A corrected
      §8/§9 filing may legitimately supersede a prior SUBMITTED one for the same
      cycle, so a stale-version writer is rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: application_filing_fee
    trigger: "on TrademarkApplication DRAFT -> FILED (POST /applications/{id}/file)"
    algorithm: tiered_pricing
    formula: |
      # class_count = number of distinct nice_class_id among this application's GoodsServicesItem rows
      per_class = TEAS_PLUS_PER_CLASS_CENTS  if filing_tier == TEAS_PLUS
                  else TEAS_STANDARD_PER_CLASS_CENTS
      filing_fee_cents = per_class * class_count
      # FILING-BASIS variant adjusts the per-class amount (see variants)
    input_set: "distinct nice_class_id over GoodsServicesItem where application_id == this application"
    constants:
      TEAS_PLUS_PER_CLASS_CENTS: 25000
      TEAS_STANDARD_PER_CLASS_CENTS: 35000
      INTENT_SURCHARGE_PER_CLASS_CENTS: 10000
    precision: "integer cents, exact (no rounding needed; all inputs are whole cents)"
    variants:
      - name: use_basis
        when: "filing_basis == USE"
        difference: "per_class amount used as-is"
      - name: intent_basis
        when: "filing_basis == INTENT"
        difference: "per_class amount += INTENT_SURCHARGE_PER_CLASS_CENTS before multiplying by class_count (an ITU application reserves the mark and is surcharged per class)"

  - name: maintenance_fee
    trigger: "on MaintenanceFiling creation (POST /maintenance-filings)"
    algorithm: tiered_pricing
    formula: |
      # class_count = distinct nice_class_id among GoodsServicesItem of the registration's application
      base = SECTION_8_PER_CLASS_CENTS * class_count
      if filing_type == SECTION_8_AND_9:
          base += SECTION_9_PER_CLASS_CENTS * class_count
      surcharge = (GRACE_SURCHARGE_PER_CLASS_CENTS * class_count) if in_grace_period else 0
      fee_cents = base + surcharge
      # in_grace_period := (registered_at-anchored window has passed AND filed_at within grace window) — see maintenance_window
    input_set: "distinct nice_class_id over the GoodsServicesItem of the registration's underlying application"
    constants:
      SECTION_8_PER_CLASS_CENTS: 22500
      SECTION_9_PER_CLASS_CENTS: 30000
      GRACE_SURCHARGE_PER_CLASS_CENTS: 10000
    precision: "integer cents, exact"
    variants:
      - name: timely
        when: "in_grace_period == false"
        difference: "no surcharge component"
      - name: grace
        when: "in_grace_period == true"
        difference: "adds GRACE_SURCHARGE_PER_CLASS_CENTS * class_count"

  - name: madrid_fee
    trigger: "on MadridApplication PENDING_CERTIFICATION -> CERTIFIED (POST /madrid-applications/{id}/certify)"
    algorithm: aggregation
    formula: |
      # designated_countries is the input array (no duplicates by validation)
      n = length(designated_countries)
      fee_cents = MADRID_BASE_CENTS + (MADRID_PER_COUNTRY_CENTS * n)
    input_set: "the designated_countries array on this MadridApplication"
    constants:
      MADRID_BASE_CENTS: 65300
      MADRID_PER_COUNTRY_CENTS: 10000
    precision: "integer cents, exact"

  - name: docket_deadline_windows
    trigger: "on every DocketDeadline-creating transition (office-action issue, publication, allowance, registration, TTAB institution)"
    algorithm: threshold
    formula: |
      # This calc pins ALL docketing windows used by §1.2 transitions so they are
      # well-defined and testable. All offsets are added to a transition timestamp.
      office_action.response_deadline = office_action.issued_at + RESPONSE_PERIOD_DAYS days
      # Grace tail differs by finality and is applied at EXPIRY, NOT at issue time:
      #   non-final action abandons at response_deadline + NONFINAL_GRACE_DAYS
      #   final action     abandons at response_deadline + FINAL_GRACE_DAYS (0)
      # days_late on a response = max(0, ceil((submitted_at - response_deadline)/1 day))
      # Late responses are ACCEPTED for a non-final action while clock <=
      #   response_deadline + NONFINAL_GRACE_DAYS; for a FINAL action ANY late response
      #   is rejected. This is the boundary-precision split: > vs >= differs by finality.
      opposition_window_close = application.published_at + OPPOSITION_WINDOW_DAYS days
      ttab.answer_deadline     = proceeding.filed_at      + ANSWER_PERIOD_DAYS days
      sou_initial_deadline     = application.notice_of_allowance_at + SOU_INITIAL_DAYS days
      sou_final_deadline       = application.notice_of_allowance_at + SOU_MAX_DAYS days   # initial + all extensions
      madrid.dependency_end_at = basic_application.filed_at + DEPENDENCY_YEARS years
    input_set: "the single transition timestamp plus the relevant offset constant"
    constants:
      RESPONSE_PERIOD_DAYS: 90
      NONFINAL_GRACE_DAYS: 30
      FINAL_GRACE_DAYS: 0
      OPPOSITION_WINDOW_DAYS: 30
      ANSWER_PERIOD_DAYS: 40
      SOU_INITIAL_DAYS: 180
      SOU_MAX_DAYS: 1260
      DEPENDENCY_YEARS: 5
    precision: "whole days for day-offsets (ceil for partial-day lateness); calendar years for DEPENDENCY_YEARS preserving month/day"

  - name: maintenance_window
    trigger: "on Registration creation and on each accepted MaintenanceFiling (recomputes next_maintenance_due_at)"
    algorithm: threshold
    formula: |
      # cycle = registration.maintenance_cycle AFTER this acceptance (0 at registration)
      # The first §8 declaration is due in the 5th-6th year; thereafter every 10 years
      # (combined §8&9). We anchor every window to registered_at:
      if cycle == 0:
          next_maintenance_due_at = registered_at + 6 years      # first §8 window close
      else:
          next_maintenance_due_at = registered_at + (6 + 10*cycle) years   # each §8&9 renewal
      # The window OPENS one year before it closes:
      window_open_at = next_maintenance_due_at - WINDOW_LEAD_YEARS years    # 5th year for cycle 0
      # A filing is PREMATURE (ERR_MAINTENANCE_WINDOW_NOT_OPEN) iff filed_at < window_open_at.
      # in_grace_period for a filing = (filed_at > next_maintenance_due_at AND
      #                                 filed_at <= next_maintenance_due_at + GRACE_WINDOW_DAYS)
      # A timely (non-grace) filing has window_open_at <= filed_at <= next_maintenance_due_at.
    input_set: "the registration's registered_at and current maintenance_cycle"
    constants:
      FIRST_WINDOW_YEARS: 6
      RENEWAL_PERIOD_YEARS: 10
      WINDOW_LEAD_YEARS: 1
      GRACE_WINDOW_DAYS: 180
    precision: "calendar arithmetic; years added to registered_at preserving month/day"

  - name: prosecution_risk_score
    trigger: "computed on read of GET /applicants/{id}/risk-score"
    algorithm: weighted_scoring
    formula: |
      # Risk that an applicant's portfolio lapses; bounded 0..100. Distinct
      # entity domain (Applicant) from the fee calcs (Application/Registration).
      base = 0
      base += W_OPEN_OA   * (count of OfficeAction with status OUTSTANDING across this applicant's applications)
      base += W_LATE_RESP * (count of OfficeActionResponse with days_late > 0 across this applicant's applications)
      base += W_DEFAULT   * (count of TTABProceeding with defense_status == DEFAULTED where the targeted mark belongs to this applicant)
      base += W_GRACE_REG * (count of Registration with status == GRACE owned by this applicant via application)
      score = min(SCORE_CEILING, base)
    input_set: "all OfficeAction/OfficeActionResponse/TTABProceeding/Registration reachable from this applicant's applications, with the named status filters"
    constants:
      W_OPEN_OA: 15
      W_LATE_RESP: 10
      W_DEFAULT: 40
      W_GRACE_REG: 20
      SCORE_CEILING: 100
    precision: "integer score, min-capped at SCORE_CEILING"
    variants:
      - name: snapshot
        when: "default"
        difference: "counts entities in their current persisted status"
      - name: projected
        when: "GET /applicants/{id}/risk-score?include_pending_deadlines=true"
        difference: "additionally adds W_OPEN_OA for each PENDING DocketDeadline whose due_at < current clock (deadline already blown but not yet swept to MISSED), modeling imminent abandonment risk"

# ============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role in X-User-Role is permitted to perform this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path/body resource id resolves to an existing row, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "for entity_backed acting roles, X-User-ID owns the targeted resource (Applicant owns its application/proceeding; Attorney is the attorney_of_record)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "applicant/attorney-scoped mutations"
  - priority: 5
    category: state
    check: "the target resource is in a state from which this transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "the second/duplicate trigger on an already-advanced resource is rejected (e.g., responding to an OfficeAction whose status != OUTSTANDING)"
    error_id: ERR_ACTION_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /office-action-responses, POST /ttab-proceedings/{id}/answer"
  - priority: 7
    category: business_constraint
    check: "OCC: expected_<parent>_version equals the parent's current version on supersede-style creates"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /statements-of-use, POST /maintenance-filings"
  - priority: 8
    category: business_safety
    check: "attorney of record has status ACTIVE at file time"
    error_id: ERR_ATTORNEY_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /applications/{id}/file"
  - priority: 9
    category: business_safety
    check: "a foreign-domiciled applicant (is_foreign_domiciled == true) must have a non-null attorney_id to file"
    error_id: ERR_FOREIGN_REQUIRES_ATTORNEY
    http_status: 422
    applies_to: "POST /applications/{id}/file"
  - priority: 10
    category: business_constraint
    check: "TEAS_PLUS filing requires every GoodsServicesItem.pre_approved == true"
    error_id: ERR_TEAS_PLUS_REQUIRES_PREAPPROVED
    http_status: 422
    applies_to: "POST /applications/{id}/file"
  - priority: 11
    category: business_constraint
    check: "an application must have at least one GoodsServicesItem (class_count >= 1) to be filed"
    error_id: ERR_NO_GOODS_SERVICES
    http_status: 422
    applies_to: "POST /applications/{id}/file"
  - priority: 12
    category: business_constraint
    check: "OPPOSITION requires a non-null target_application_id whose application.status == PUBLISHED; CANCELLATION requires a non-null target_registration_id whose registration.status IN {ACTIVE, GRACE}"
    error_id: ERR_PROCEEDING_TARGET_INVALID
    http_status: 422
    applies_to: "POST /ttab-proceedings"
  - priority: 13
    category: business_temporal
    check: "an OPPOSITION may be filed only while current clock <= target_application.published_at + OPPOSITION_WINDOW_DAYS"
    error_id: ERR_OPPOSITION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /ttab-proceedings"
  - priority: 14
    category: business_temporal
    check: "a FINAL OfficeAction response submitted after response_deadline is rejected; a non-final response is rejected only after response_deadline + NONFINAL_GRACE_DAYS"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /office-action-responses"
  - priority: 15
    category: business_constraint
    check: "a StatementOfUse may be filed only for an INTENT-basis application in status ALLOWED, and extension_number must not exceed the application's granted-extension count"
    error_id: ERR_SOU_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /statements-of-use"
  - priority: 16
    category: business_temporal
    check: "a MaintenanceFiling whose filed clock is before window_open_at (= next_maintenance_due_at - WINDOW_LEAD_YEARS, see calc maintenance_window) is premature"
    error_id: ERR_MAINTENANCE_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /maintenance-filings"
  - priority: 17
    category: business_constraint
    check: "designated_countries on a MadridApplication is non-empty and contains no duplicates and excludes 'US'"
    error_id: ERR_MADRID_COUNTRIES_INVALID
    http_status: 422
    applies_to: "POST /madrid-applications"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
endpoints:
  # --- Applicant ---
  - method: POST
    path: "/applicants"
    description: register a trademark owner
    roles: [Attorney, Applicant]
    code: 201
    input: [legal_name, entity_type, country_code]
    output: Applicant
    side_effects: ["set is_foreign_domiciled = (country_code != 'US'); open_application_count = 0"]
  - method: GET
    path: "/applicants/{id}"
    description: fetch an applicant
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: []
    output: Applicant
    side_effects: []
  - method: GET
    path: "/applicants/{id}/risk-score"
    description: "computed prosecution risk score (snapshot, or projected when include_pending_deadlines=true)"
    roles: [Attorney, Examiner]
    code: 200
    input: ["include_pending_deadlines?"]
    output: "{ applicant_id: string, risk_score: integer, variant: string }"
    side_effects: ["runs calc prosecution_risk_score"]

  # --- Attorney ---
  - method: POST
    path: "/attorneys"
    description: register a prosecuting attorney
    roles: [Attorney]
    code: 201
    input: [full_name, bar_number, bar_state]
    output: Attorney
    side_effects: ["status defaults ACTIVE"]
  - method: GET
    path: "/attorneys/{id}"
    description: fetch an attorney
    roles: [Attorney, Examiner, TTABClerk]
    code: 200
    input: []
    output: Attorney
    side_effects: []
  - method: POST
    path: "/attorneys/{id}/suspend"
    description: mark an attorney SUSPENDED (bar discipline)
    roles: [Examiner]
    code: 200
    input: []
    output: Attorney
    side_effects: ["set status = SUSPENDED; increment Attorney.version by 1"]

  # --- Nice classes ---
  - method: POST
    path: "/nice-classes"
    description: seed a Nice class code
    roles: [Examiner]
    code: 201
    input: [class_number, title]
    output: NiceClass
    side_effects: ["set is_service_class = (class_number BETWEEN 35 AND 45)"]
  - method: GET
    path: "/nice-classes/{id}"
    description: fetch a Nice class
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: []
    output: NiceClass
    side_effects: []
  - method: GET
    path: "/nice-classes/{id}/goods-services"
    description: "list goods/services items filed under a Nice class (reverse-reachability for GoodsServicesItem.nice_class_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: GoodsServicesItem[]
    side_effects: []

  # --- Application core ---
  - method: POST
    path: "/applications"
    description: create a DRAFT application
    roles: [Attorney, Applicant]
    code: 201
    input: [applicant_id, "attorney_id?", mark_text, filing_basis, filing_tier]
    output: TrademarkApplication
    side_effects: ["status DRAFT; computed fields default to 0"]
  - method: GET
    path: "/applications/{id}"
    description: fetch an application
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: []
    output: TrademarkApplication
    side_effects: []
  - method: GET
    path: "/applications"
    description: "filtered list of applications (reverse-reachability for TrademarkApplication.applicant_id and TrademarkApplication.attorney_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: ["applicant_id?", "attorney_id?", "status?", "limit?", "offset?"]
    output: TrademarkApplication[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/goods-services"
    description: add a goods/services item under a Nice class
    roles: [Attorney, Applicant]
    code: 201
    input: [nice_class_id, description, "pre_approved?"]
    output: GoodsServicesItem
    side_effects: ["recompute application.class_count (distinct nice_class_id)"]
  - method: GET
    path: "/applications/{id}/goods-services"
    description: "list goods/services items of an application (reverse-reachability for GoodsServicesItem.application_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: GoodsServicesItem[]
    side_effects: []
  - method: POST
    path: "/applications/{id}/file"
    description: file the application (DRAFT -> FILED)
    roles: [Attorney, Applicant]
    code: 200
    input: []
    output: TrademarkApplication
    side_effects: ["set filed_at, filing_fee_cents; applicant.open_application_count += 1; version += 1"]
  - method: POST
    path: "/applications/{id}/assign-examination"
    description: assign to an examiner (FILED -> UNDER_EXAMINATION)
    roles: [Examiner]
    code: 200
    input: []
    output: TrademarkApplication
    side_effects: ["version += 1"]
  - method: POST
    path: "/applications/{id}/approve-publication"
    description: approve for publication (UNDER_EXAMINATION -> PUBLISHED)
    roles: [Examiner]
    code: 200
    input: []
    output: TrademarkApplication
    side_effects: ["set published_at; create OPPOSITION_WINDOW DocketDeadline; version += 1"]
  - method: POST
    path: "/applications/{id}/issue-allowance"
    description: issue Notice of Allowance for an INTENT application (PUBLISHED -> ALLOWED)
    roles: [Examiner]
    code: 200
    input: []
    output: TrademarkApplication
    side_effects: ["set notice_of_allowance_at; create SOU DocketDeadline; version += 1"]
  - method: POST
    path: "/applications/{id}/register"
    description: register a USE application directly from publication (PUBLISHED -> REGISTERED)
    roles: [Examiner]
    code: 201
    input: []
    output: Registration
    side_effects: ["create Registration; create MAINTENANCE DocketDeadline; cancel OPPOSITION_WINDOW deadline; version += 1"]
  - method: POST
    path: "/applications/{id}/abandon-sou-lapsed"
    description: "abandon an ALLOWED application whose SOU period (incl. extensions) lapsed (ALLOWED -> ABANDONED)"
    roles: [Examiner]
    code: 200
    input: []
    output: TrademarkApplication
    side_effects: ["set SOU DocketDeadline MISSED; applicant.open_application_count -= 1; version += 1"]
  - method: GET
    path: "/applications/{id}/docket-deadlines"
    description: "list docket deadlines rolled up to an application (reverse-reachability for DocketDeadline.application_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DocketDeadline[]
    side_effects: []

  # --- Office actions ---
  - method: POST
    path: "/office-actions"
    description: issue an office action (UNDER_EXAMINATION -> OFFICE_ACTION_ISSUED)
    roles: [Examiner]
    code: 201
    input: [application_id, ground, "is_final?"]
    output: OfficeAction
    side_effects: ["set round_number, issued_at, response_deadline; application.office_action_round += 1; create OFFICE_ACTION DocketDeadline; application.version += 1"]
  - method: GET
    path: "/office-actions/{id}"
    description: fetch an office action
    roles: [Attorney, Applicant, Examiner]
    code: 200
    input: []
    output: OfficeAction
    side_effects: []
  - method: GET
    path: "/applications/{id}/office-actions"
    description: "list office actions of an application (reverse-reachability for OfficeAction.application_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OfficeAction[]
    side_effects: []
  - method: POST
    path: "/office-actions/{id}/expire"
    description: "sweep an OUTSTANDING action past its grace tail to abandonment (system)"
    roles: [Examiner]
    code: 200
    input: []
    output: OfficeAction
    side_effects: ["set status EXPIRED; set DocketDeadline MISSED; abandon application; applicant.open_application_count -= 1; application.version += 1"]
  - method: POST
    path: "/office-action-responses"
    description: submit a response to the outstanding office action (OFFICE_ACTION_ISSUED -> UNDER_EXAMINATION)
    roles: [Attorney, Applicant]
    code: 201
    input: [office_action_id, argument_text, "amends_identification?"]
    output: OfficeActionResponse
    side_effects: ["compute days_late; set OfficeAction RESPONDED; set DocketDeadline MET; application.version += 1"]
  - method: GET
    path: "/office-actions/{id}/responses"
    description: "list responses to an office action (reverse-reachability for OfficeActionResponse.office_action_id)"
    roles: [Attorney, Applicant, Examiner]
    code: 200
    input: ["limit?", "offset?"]
    output: OfficeActionResponse[]
    side_effects: []

  # --- Statement of use ---
  - method: POST
    path: "/statements-of-use"
    description: file a Statement of Use for an ALLOWED INTENT application (supersede-style; OCC-guarded)
    roles: [Attorney, Applicant]
    code: 201
    input: [application_id, specimen_url, first_use_date, "extension_number?", expected_application_version]
    output: StatementOfUse
    side_effects: ["status SUBMITTED; increments TrademarkApplication.version by 1 (so a later stale-version SOU create is rejected)"]
  - method: POST
    path: "/statements-of-use/{id}/accept"
    description: examiner accepts the SOU (ALLOWED -> REGISTERED)
    roles: [Examiner]
    code: 201
    input: []
    output: Registration
    side_effects: ["SOU ACCEPTED; all GoodsServicesItem.use_status IN_USE; create Registration; SOU DocketDeadline MET; create MAINTENANCE DocketDeadline; application.version += 1"]
  - method: GET
    path: "/applications/{id}/statements-of-use"
    description: "list statements of use for an application (reverse-reachability for StatementOfUse.application_id)"
    roles: [Attorney, Applicant, Examiner]
    code: 200
    input: ["limit?", "offset?"]
    output: StatementOfUse[]
    side_effects: []

  # --- TTAB proceedings ---
  - method: POST
    path: "/ttab-proceedings"
    description: institute an opposition or cancellation
    roles: [Attorney, Applicant]
    code: 201
    input: [proceeding_type, "target_application_id?", "target_registration_id?", petitioner_applicant_id]
    output: TTABProceeding
    side_effects: ["set filed_at, answer_deadline; create OPPOSITION_ANSWER DocketDeadline"]
  - method: GET
    path: "/ttab-proceedings/{id}"
    description: fetch a proceeding
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: []
    output: TTABProceeding
    side_effects: []
  - method: GET
    path: "/ttab-proceedings"
    description: "filtered list of proceedings (reverse-reachability for TTABProceeding.target_application_id, TTABProceeding.target_registration_id, TTABProceeding.petitioner_applicant_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: ["target_application_id?", "target_registration_id?", "petitioner_applicant_id?", "limit?", "offset?"]
    output: TTABProceeding[]
    side_effects: []
  - method: POST
    path: "/ttab-proceedings/{id}/answer"
    description: defendant files an answer (defense_status AWAITING_ANSWER -> ANSWERED)
    roles: [Attorney, Applicant]
    code: 200
    input: []
    output: TTABProceeding
    side_effects: ["set OPPOSITION_ANSWER DocketDeadline MET; version += 1"]
  - method: POST
    path: "/ttab-proceedings/{id}/enter-default"
    description: "clerk enters default (defense_status -> DEFAULTED, claim_status -> SUSTAINED, cascade)"
    roles: [TTABClerk]
    code: 200
    input: []
    output: TTABProceeding
    side_effects: ["DocketDeadline MISSED; claim SUSTAINED; cascade abandon/cancel target; version += 1"]
  - method: POST
    path: "/ttab-proceedings/{id}/set-for-trial"
    description: clerk sets proceeding for trial (claim_status PLEADED -> TRIAL)
    roles: [TTABClerk]
    code: 200
    input: []
    output: TTABProceeding
    side_effects: ["version += 1"]
  - method: POST
    path: "/ttab-proceedings/{id}/decide"
    description: clerk decides the proceeding (claim_status TRIAL -> SUSTAINED|DISMISSED)
    roles: [TTABClerk]
    code: 200
    input: [decision]
    output: TTABProceeding
    side_effects: ["on SUSTAIN cascade abandon/cancel target and cease dependent Madrid; version += 1"]
  - method: POST
    path: "/ttab-proceedings/{id}/withdraw"
    description: petitioner withdraws (claim_status PLEADED -> WITHDRAWN)
    roles: [Attorney, Applicant]
    code: 200
    input: []
    output: TTABProceeding
    side_effects: ["cancel OPPOSITION_ANSWER DocketDeadline; version += 1"]

  # --- Registration & maintenance ---
  - method: GET
    path: "/registrations/{id}"
    description: fetch a registration
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/applications/{id}/registration"
    description: "find the registration of an application (reverse-reachability for Registration.application_id)"
    roles: [Attorney, Applicant, Examiner, TTABClerk]
    code: 200
    input: []
    output: Registration[]
    side_effects: []
  - method: POST
    path: "/registrations/{id}/enter-grace"
    description: "move a registration to GRACE after a missed maintenance window (system)"
    roles: [Examiner]
    code: 200
    input: []
    output: Registration
    side_effects: ["set MAINTENANCE DocketDeadline MISSED; version += 1"]
  - method: POST
    path: "/registrations/{id}/expire"
    description: "expire a registration whose grace window elapsed (system)"
    roles: [Examiner]
    code: 200
    input: []
    output: Registration
    side_effects: ["set next_maintenance_due_at null; version += 1"]
  - method: POST
    path: "/maintenance-filings"
    description: file a §8 or §8&9 maintenance filing (supersede-style; OCC-guarded)
    roles: [Attorney, Applicant]
    code: 201
    input: [registration_id, filing_type, expected_registration_version]
    output: MaintenanceFiling
    side_effects: ["compute in_grace_period, fee_cents; status SUBMITTED; increments Registration.version by 1 (so a later stale-version maintenance create is rejected)"]
  - method: POST
    path: "/maintenance-filings/{id}/accept"
    description: examiner accepts a maintenance filing (Registration ACTIVE/GRACE -> ACTIVE)
    roles: [Examiner]
    code: 200
    input: []
    output: Registration
    side_effects: ["filing ACCEPTED; registration.maintenance_cycle += 1; recompute next_maintenance_due_at; MAINTENANCE DocketDeadline MET + new PENDING; registration.version += 1"]
  - method: GET
    path: "/registrations/{id}/maintenance-filings"
    description: "list maintenance filings of a registration (reverse-reachability for MaintenanceFiling.registration_id)"
    roles: [Attorney, Applicant, Examiner]
    code: 200
    input: ["limit?", "offset?"]
    output: MaintenanceFiling[]
    side_effects: []

  # --- Madrid ---
  - method: POST
    path: "/madrid-applications"
    description: create an international application based on a US application
    roles: [Attorney, Applicant]
    code: 201
    input: [basic_application_id, designated_countries]
    output: MadridApplication
    side_effects: ["compute dependency_end_at from basic_application.filed_at; status PENDING_CERTIFICATION"]
  - method: GET
    path: "/madrid-applications/{id}"
    description: fetch a Madrid application
    roles: [Attorney, Applicant, Examiner]
    code: 200
    input: []
    output: MadridApplication
    side_effects: []
  - method: POST
    path: "/madrid-applications/{id}/certify"
    description: examiner certifies the international application (PENDING_CERTIFICATION -> CERTIFIED)
    roles: [Examiner]
    code: 200
    input: []
    output: MadridApplication
    side_effects: ["compute fee_cents per calc madrid_fee; version += 1"]
  - method: POST
    path: "/madrid-applications/{id}/forward"
    description: forward certified application to WIPO (CERTIFIED -> FORWARDED_TO_WIPO)
    roles: [Examiner]
    code: 200
    input: []
    output: MadridApplication
    side_effects: ["version += 1"]
  - method: GET
    path: "/applications/{id}/madrid-applications"
    description: "list Madrid applications based on an application (reverse-reachability for MadridApplication.basic_application_id)"
    roles: [Attorney, Applicant, Examiner]
    code: 200
    input: ["limit?", "offset?"]
    output: MadridApplication[]
    side_effects: []

  # --- Test-driving clock control ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the server's current UTC clock to drive time-gated transitions deterministically"
    roles: [Examiner]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["all subsequent now() reads return this value until reset"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a referenced resource id (path or body FK) does not resolve"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity-backed acting role is not the owner/attorney-of-record of the targeted resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which this transition is allowed"
  - id: ERR_ACTION_ALREADY_CLOSED
    http: 409
    condition: "duplicate trigger on an OfficeAction/TTAB step already advanced past OUTSTANDING/AWAITING_ANSWER"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version on a supersede-style create"
  - id: ERR_ATTORNEY_NOT_ACTIVE
    http: 422
    condition: "attorney of record is SUSPENDED at file time"
  - id: ERR_FOREIGN_REQUIRES_ATTORNEY
    http: 422
    condition: "foreign-domiciled applicant attempts to file without an attorney_id"
  - id: ERR_TEAS_PLUS_REQUIRES_PREAPPROVED
    http: 422
    condition: "TEAS_PLUS application has a GoodsServicesItem with pre_approved == false at file time"
  - id: ERR_NO_GOODS_SERVICES
    http: 422
    condition: "application filed with zero GoodsServicesItem (class_count == 0)"
  - id: ERR_PROCEEDING_TARGET_INVALID
    http: 422
    condition: "TTAB target wrong kind or not in a challengeable state (opposition target not PUBLISHED, cancellation target not ACTIVE/GRACE)"
  - id: ERR_OPPOSITION_WINDOW_CLOSED
    http: 422
    condition: "opposition filed after published_at + OPPOSITION_WINDOW_DAYS"
  - id: ERR_RESPONSE_DEADLINE_PASSED
    http: 422
    condition: "office-action response after response_deadline (final) or after response_deadline + NONFINAL_GRACE_DAYS (non-final)"
  - id: ERR_SOU_NOT_PERMITTED
    http: 422
    condition: "SOU filed for a non-INTENT or non-ALLOWED application, or extension_number exceeds granted extensions"
  - id: ERR_MAINTENANCE_WINDOW_NOT_OPEN
    http: 422
    condition: "maintenance filing before the registration's current maintenance window opens"
  - id: ERR_MADRID_COUNTRIES_INVALID
    http: 422
    condition: "designated_countries empty, contains duplicates, or includes 'US'"
  - id: ERR_VALIDATION
    http: 400
    condition: "generic malformed request: missing required body field, bad enum value, or type mismatch"
  - id: ERR_DUPLICATE_BAR_NUMBER
    http: 409
    condition: "attorney bar_number already registered"
  - id: ERR_DUPLICATE_NICE_CLASS
    http: 409
    condition: "nice class_number already seeded"

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Applicant
    description: "trademark owner acting on its own marks"
    identity: "entity_backed:Applicant"
    exclusive_operations: []
    shared_operations:
      - "POST /applicants"
      - "POST /applications"
      - "POST /applications/{id}/goods-services"
      - "POST /applications/{id}/file"
      - "POST /office-action-responses"
      - "POST /statements-of-use"
      - "POST /ttab-proceedings"
      - "POST /ttab-proceedings/{id}/answer"
      - "POST /ttab-proceedings/{id}/withdraw"
      - "POST /maintenance-filings"
      - "POST /madrid-applications"
      - "GET reads of own applications/proceedings/registrations"
  - name: Attorney
    description: "prosecuting attorney filing and responding on behalf of applicants"
    identity: "entity_backed:Attorney"
    exclusive_operations:
      - "POST /attorneys"
    shared_operations:
      - "POST /applicants"
      - "POST /applications"
      - "POST /applications/{id}/goods-services"
      - "POST /applications/{id}/file"
      - "POST /office-action-responses"
      - "POST /statements-of-use"
      - "POST /ttab-proceedings"
      - "POST /ttab-proceedings/{id}/answer"
      - "POST /ttab-proceedings/{id}/withdraw"
      - "POST /maintenance-filings"
      - "POST /madrid-applications"
      - "GET reads"
  - name: Examiner
    description: "USPTO examining attorney — issues office actions, approves publication, registers, accepts SOU/maintenance, runs system sweeps and the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /nice-classes"
      - "POST /attorneys/{id}/suspend"
      - "POST /applications/{id}/assign-examination"
      - "POST /office-actions"
      - "POST /office-actions/{id}/expire"
      - "POST /applications/{id}/approve-publication"
      - "POST /applications/{id}/issue-allowance"
      - "POST /applications/{id}/register"
      - "POST /applications/{id}/abandon-sou-lapsed"
      - "POST /statements-of-use/{id}/accept"
      - "POST /registrations/{id}/enter-grace"
      - "POST /registrations/{id}/expire"
      - "POST /maintenance-filings/{id}/accept"
      - "POST /madrid-applications/{id}/certify"
      - "POST /madrid-applications/{id}/forward"
      - "POST /_clock/set_current_utc"
      - "GET /applicants/{id}/risk-score"
    shared_operations:
      - "GET reads"
  - name: TTABClerk
    description: "Trademark Trial and Appeal Board administrator — manages proceeding lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /ttab-proceedings/{id}/enter-default"
      - "POST /ttab-proceedings/{id}/set-for-trial"
      - "POST /ttab-proceedings/{id}/decide"
    shared_operations:
      - "GET reads"
