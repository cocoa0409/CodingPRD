              captures: { stay_id: $.data.id }
            - call: "POST /api/stays/${stay_id}/contribution-requests"
              payload: { nightly_rate_cents: 2500, planned_nights: 4, hardship_tier: "NONE" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { cr1_id: $.data.id }
            - call: "POST /api/stays/${stay_id}/contribution-requests"
              payload: { nightly_rate_cents: 1000, planned_nights: 4, hardship_tier: "NONE" }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { cr2_id: $.data.id }
          trigger:
            - call: "POST /api/contribution-requests/${cr1_id}/record-payment"
              payload: { amount_cents: 3000 }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/contribution-requests/${cr2_id}/record-payment"
              payload: { amount_cents: 1000 }
              as: FamilyContact
              as_user_id: "${fam_id}"
            - call: "POST /api/contribution-requests/${cr2_id}/waive"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/stays/${stay_id}/check-out"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/contribution-requests/${cr1_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
            - call: "GET /api/contribution-requests/${cr2_id}"
              payload: {}
              as: HouseManager
              as_user_id: "hm-1"
          assert:
            - "CR1 after payment: paid_cents == 3000 and outstanding_cents == 7000  (10000 == 3000 + 0 + 0 + 7000)"
            - "CR2 after payment+waive: status == WAIVED, paid_cents == 1000, waived_cents == 3000, outstanding_cents == 0  (4000 == 1000 + 3000 + 0 + 0); checkout leaves WAIVED requests untouched"
            - "CR1 after checkout: requested_amount_cents == 5000 (re-anchored to settled 2500*2), paid_cents == 3000, forgiven_cents == 2000, outstanding_cents == 0, status == FORGIVEN  (5000 == 3000 + 0 + 2000 + 0)"
            - "checkout succeeded despite the unpaid CR1 balance — contributions are never a condition of stay"
