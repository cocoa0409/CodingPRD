            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1001", customer_name: "Alma Reyes", service_address: "12 Cedar St", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_a_id: $.data.id }
            - call: "POST /meters"
