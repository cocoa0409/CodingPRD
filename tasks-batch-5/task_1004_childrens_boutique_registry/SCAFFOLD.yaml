scenario: "1004. Children's Boutique & Baby Registry: SKU & size/stage, registry & completion discount, gift & wishlist, seasonal & consignment corner, loyalty, BOPIS, outgrown trade-in, special order"
domain_name: "childrens-boutique-registry"
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Store display name"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code, e.g. CA"
      - name: open_minute
        type: integer
        source: input
        default: 540
        description: "Daily opening time as minutes from local midnight (default 540 = 09:00); pickup windows must fall within [open_minute, close_minute]"
      - name: close_minute
        type: integer
        source: input
        default: 1200
        description: "Daily closing time as minutes from local midnight (default 1200 = 20:00)"
      - name: pickup_station_count
        type: integer
        source: input
        default: 2
        description: "Number of BOPIS pickup stations; valid station_no is 1..pickup_station_count"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer full name"
      - name: email
        type: string
        source: input
        description: "Customer email (unique login handle)"
      - name: lifetime_spend_cents
        type: integer
        source: system
        default: 0
        description: "Cumulative merchandise value (order.total_before_credit_cents) paid; seedable at creation via initial_lifetime_spend_cents; drives loyalty_tier"
      - name: store_credit_balance_cents
        type: integer
        source: system
        default: 0
        description: "Store-credit wallet balance in cents; seedable via initial_store_credit_cents; credited by trade-in acceptance and consignor payouts, debited by STORE_CREDIT order payments, refunded on order cancellation"
      - name: loyalty_points
        type: integer
        source: system
        default: 0
        description: "Loyalty points balance; seedable via initial_loyalty_points; accrued on order payment and registry-completion bonus"
      - name: loyalty_tier
        type: enum
        source: computed
        description: "Derived from lifetime_spend_cents via LOYALTY_TIER_THRESHOLDS_CENTS"
        constraints: "one of {BRONZE, SILVER, GOLD, PLATINUM}"

  - name: SKU
    parent: null
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; the store that stocks this SKU"
      - name: sku_code
        type: string
        source: input
        description: "Human catalog code"
      - name: name
        type: string
        source: input
        description: "Product name"
      - name: category
        type: enum
        source: input
        description: "Merchandise category"
        constraints: "one of {CLOTHING, GEAR, TOY, FEEDING, NURSERY}"
      - name: size_stage
        type: enum
        source: input
        description: "Child size / developmental stage"
        constraints: "one of {NEWBORN, M0_3, M3_6, M6_12, M12_24, T2, T3, T4}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Catalog unit price in cents; basis for registry valuation and trade-in quotes"
      - name: on_hand_qty
        type: integer
        source: system
        default: 0
        description: "Physical units in stock; seedable via initial_on_hand_qty; raised by restock, lowered by pickup/special-order fulfillment"
      - name: reserved_qty
        type: integer
        source: system
        default: 0
        description: "Units reserved by RESERVED/READY orders and ALLOCATED special orders; available = on_hand_qty - reserved_qty"
      - name: availability_status
        type: enum
        source: computed
        description: "Derived from available = on_hand_qty - reserved_qty (see sku_availability)"
        constraints: "one of {IN_STOCK, LOW_STOCK, OUT_OF_STOCK}"

  - name: Registry
    parent: null
    common_fields: true
    fields:
      - name: registrant_customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owner of the registry (only the registrant earns the completion discount)"
      - name: kind
        type: enum
        source: input
        default: BABY_REGISTRY
        description: "Registry vs personal wishlist; only BABY_REGISTRY earns a completion discount"
        constraints: "one of {BABY_REGISTRY, WISHLIST}"
      - name: title
        type: string
        source: input
        description: "Registry title"
      - name: event_date
        type: datetime
        source: input
        description: "Shower/event date (ISO 8601 UTC); separates PROVISIONAL (order.created_at < event_date) from FINAL (>= event_date) completion-discount variants"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Lifecycle; auto-transitions ACTIVE<->COMPLETION_UNLOCKED as completion_pct crosses COMPLETION_THRESHOLD"
        constraints: "one of {DRAFT, ACTIVE, COMPLETION_UNLOCKED, ARCHIVED}"
      - name: desired_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over the registry's RegistryItems of desired_qty * SKU.base_price_cents (see registry_completion)"
      - name: fulfilled_value_cents
        type: integer
        source: computed
        default: 0
        description: "Sum over the registry's RegistryItems of min(fulfilled_qty, desired_qty) * SKU.base_price_cents"
      - name: completion_pct
        type: number
        source: computed
        default: 0
        description: "fulfilled_value_cents / desired_value_cents, 4 decimals; 0 when desired_value_cents == 0"

  - name: RegistryItem
    parent: Registry
    common_fields: true
    fields:
      - name: registry_id
        type: string
        source: input
        description: "FK -> Registry.id; owning registry"
      - name: sku_id
        type: string
        source: input
        description: "FK -> SKU.id; desired product"
      - name: desired_qty
        type: integer
        source: input
        description: "Quantity the registrant wants"
      - name: fulfilled_qty
        type: integer
        source: system
        default: 0
        description: "Quantity gifted so far (sum of RegistryGift.qty against this item)"

  - name: RegistryGift
    parent: Registry
    common_fields: true
    fields:
      - name: registry_id
        type: string
        source: input
        description: "FK -> Registry.id; registry the gift is bought for"
      - name: registry_item_id
        type: string
        source: input
        description: "FK -> RegistryItem.id; the item being gifted"
      - name: gifter_customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the acting Customer purchasing the gift"
      - name: qty
        type: integer
        source: input
        description: "Quantity gifted (must not exceed the item's remaining desired_qty - fulfilled_qty)"
      - name: amount_cents
        type: integer
        source: computed
        description: "qty * SKU.base_price_cents at time of purchase"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the buyer"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; BOPIS pickup store; all line SKUs must belong to this store"
      - name: registry_id
        type: string
        source: input
        description: "FK -> Registry.id; optional; when set and buyer == registrant, completion discount may apply"
      - name: lines
        type: array
        source: input
        description: "Array of line objects {sku_id, qty} on input; server augments each with unit_price_cents, line_total_cents, fulfilled_qty. Must be non-empty."
      - name: pickup_start
        type: datetime
        source: input
        description: "BOPIS pickup window start (ISO 8601 UTC)"
      - name: pickup_end
        type: datetime
        source: input
        description: "BOPIS pickup window end (ISO 8601 UTC); must be strictly after pickup_start"
      - name: station_no
        type: integer
        source: input
        description: "Pickup station index (1..Store.pickup_station_count)"
      - name: payment_status
        type: enum
        source: system
        default: UNPAID
        description: "Payment axis (independent of fulfillment_status)"
        constraints: "one of {UNPAID, PAID, REFUNDED}"
      - name: fulfillment_status
        type: enum
        source: system
        default: RESERVED
        description: "Fulfillment axis (independent of payment_status)"
        constraints: "one of {RESERVED, READY, PICKED_UP, CANCELLED}"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of line_total_cents"
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: "Per-line-rounded loyalty discount (see order_pricing)"
      - name: completion_discount_cents
        type: integer
        source: computed
        description: "Registry completion discount (see registry_completion_discount); 0 when not eligible"
      - name: applied_discount_cents
        type: integer
        source: computed
        description: "min(loyalty_discount_cents + completion_discount_cents, round_half_up(subtotal_cents * MAX_DISCOUNT_PCT))"
      - name: total_before_credit_cents
        type: integer
        source: computed
        description: "subtotal_cents - applied_discount_cents"
      - name: store_credit_applied_cents
        type: integer
        source: computed
        default: 0
        description: "Store credit consumed at payment (STORE_CREDIT only); 0 until paid"
      - name: amount_due_cents
        type: integer
        source: computed
        description: "total_before_credit_cents - store_credit_applied_cents"

  - name: ConsignmentShelf
    parent: Store
    common_fields: true
    fields:
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store hosting the shelf"
      - name: shelf_code
        type: string
        source: input
        description: "Physical shelf label"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of ConsignmentItems whose display windows may overlap at any instant"
      - name: season
        type: enum
        source: input
        description: "Seasonal corner assignment"
        constraints: "one of {SPRING_SUMMER, FALL_WINTER}"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN accepts displays; CLOSED rejects them"
        constraints: "one of {OPEN, CLOSED}"

  - name: ConsignmentItem
    parent: null
    common_fields: true
    fields:
      - name: consignor_customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the consignor who receives the payout"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; store where the item is consigned"
      - name: shelf_id
        type: string
        source: input
        description: "FK -> ConsignmentShelf.id; null until displayed, set by the display action"
      - name: title
        type: string
        source: input
        description: "Item description"
      - name: condition
        type: enum
        source: input
        description: "Condition grade; feeds the payout split bonus"
        constraints: "one of {LIKE_NEW, GOOD, FAIR}"
      - name: season
        type: enum
        source: input
        description: "Seasonality of the item; feeds the payout split base"
        constraints: "one of {IN_SEASON, OFF_SEASON}"
      - name: list_price_cents
        type: integer
        source: input
        description: "Asking price in cents"
      - name: display_start
        type: datetime
        source: system
        description: "Display window start (ISO 8601 UTC); set by the display action"
      - name: display_end
        type: datetime
        source: system
        description: "Display window end (ISO 8601 UTC); set by the display action"
      - name: payout_cents
        type: integer
        source: computed
        default: 0
        description: "Consignor store-credit payout computed at sale (see consignor_payout); 0 until sold"
      - name: status
        type: enum
        source: system
        default: RECEIVED
        description: "Lifecycle"
        constraints: "one of {RECEIVED, ON_DISPLAY, SOLD}"

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the person trading in an outgrown item"
      - name: sku_id
        type: string
        source: input
        description: "FK -> SKU.id; the catalog equivalent used to value the trade-in"
      - name: submitted_condition
        type: enum
        source: input
        description: "Condition claimed at submission; feeds the QUOTED valuation"
        constraints: "one of {LIKE_NEW, GOOD, FAIR}"
      - name: inspected_condition
        type: enum
        source: system
        description: "Condition confirmed at acceptance (defaults to submitted_condition); feeds the FINAL valuation"
        constraints: "one of {LIKE_NEW, GOOD, FAIR}"
      - name: quoted_value_cents
        type: integer
        source: computed
        description: "QUOTED variant computed at submission (percent-of-retail, no cap)"
      - name: final_value_cents
        type: integer
        source: computed
        default: 0
        description: "FINAL variant computed at acceptance (percent-of-retail capped by CONDITION_CAP_CENTS); credited to the customer wallet"
      - name: status
        type: enum
        source: system
        default: SUBMITTED
        description: "Lifecycle"
        constraints: "one of {SUBMITTED, ACCEPTED, REJECTED}"

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; requester"
      - name: sku_id
        type: string
        source: input
        description: "FK -> SKU.id; requested product"
      - name: store_id
        type: string
        source: input
        description: "FK -> Store.id; fulfilling store"
      - name: qty
        type: integer
        source: input
        default: 1
        description: "Requested quantity"
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Resolved at creation to ALLOCATED (stock available -> reserved) or WAITLISTED (queued FIFO by created_at); auto-promoted to ALLOCATED when stock frees up"
        constraints: "one of {REQUESTED, ALLOCATED, WAITLISTED, FULFILLED, CANCELLED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Registry
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    note: "Cyclic: ACTIVE <-> COMPLETION_UNLOCKED as completion_pct crosses COMPLETION_THRESHOLD (0.80)."
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /registries/{id}/activate"
        actor: Customer
        preconditions: ["registry.status == DRAFT", "acting Customer is the registrant"]
        side_effects: ["recompute registry_completion", "registry.version += 1"]
      - from: ACTIVE
        to: COMPLETION_UNLOCKED
        trigger: "system (auto) on POST /registries/{id}/gifts or POST /registries/{id}/items recompute"
        actor: system
        preconditions: ["kind == BABY_REGISTRY", "completion_pct >= COMPLETION_THRESHOLD (0.80)"]
        side_effects:
          - "registrant Customer.loyalty_points += REGISTRY_COMPLETION_BONUS (250)"
          - "recompute loyalty_accrual for registrant (tier re-evaluated)"
          - "registry.updated_at refreshed"
        note: "Boundary is inclusive: completion_pct == 0.80 unlocks."
      - from: COMPLETION_UNLOCKED
        to: ACTIVE
        trigger: "system (auto) on POST /registries/{id}/items recompute"
        actor: system
        preconditions: ["completion_pct < COMPLETION_THRESHOLD (0.80) after adding the new item"]
        side_effects: ["registry.updated_at refreshed"]
        note: "Revert leg of the cycle; the REGISTRY_COMPLETION_BONUS already granted is NOT clawed back."
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /registries/{id}/archive"
        actor: Customer
        preconditions: ["acting Customer is the registrant"]
        side_effects: ["registry.version += 1"]
      - from: COMPLETION_UNLOCKED
        to: ARCHIVED
        trigger: "POST /registries/{id}/archive"
        actor: Customer
        preconditions: ["acting Customer is the registrant"]
        side_effects: ["registry.version += 1"]

  - entity: Order
    initial_state: "payment_status=UNPAID, fulfillment_status=RESERVED"
    terminal_states: ["fulfillment_status in {PICKED_UP, CANCELLED}"]
    note: "Parallel dimensions: payment_status (UNPAID->PAID->REFUNDED) evolves independently of fulfillment_status (RESERVED->READY->PICKED_UP, RESERVED/READY->CANCELLED)."
    transitions:
      - from: "fulfillment_status=RESERVED (on create)"
        to: "fulfillment_status=RESERVED"
        trigger: "POST /orders"
        actor: Customer
        preconditions:
          - "lines non-empty"
          - "every line SKU.store_id == order.store_id"
          - "for every line, SKU.on_hand_qty - SKU.reserved_qty >= line.qty"
          - "pickup window within store hours and station_no valid and no slot conflict"
        side_effects:
          - "for each line: SKU.reserved_qty += line.qty; recompute sku_availability"
          - "compute order_pricing (subtotal, loyalty_discount, completion_discount, applied_discount, total_before_credit, amount_due)"
      - from: "payment_status=UNPAID"
        to: "payment_status=PAID"
        trigger: "POST /orders/{id}/pay"
        actor: Customer
        preconditions:
          - "payment_status == UNPAID"
          - "if payment_method == STORE_CREDIT: Customer.store_credit_balance_cents >= total_before_credit_cents"
        side_effects:
          - "if STORE_CREDIT: store_credit_applied_cents = total_before_credit_cents; Customer.store_credit_balance_cents -= store_credit_applied_cents"
          - "if CARD: store_credit_applied_cents = 0"
          - "amount_due_cents = total_before_credit_cents - store_credit_applied_cents"
          - "Customer.lifetime_spend_cents += total_before_credit_cents"
          - "Customer.loyalty_points += floor(total_before_credit_cents / 100) (loyalty_accrual)"
          - "recompute Customer.loyalty_tier"
      - from: "fulfillment_status=RESERVED"
        to: "fulfillment_status=READY"
        trigger: "POST /orders/{id}/mark-ready"
        actor: StoreStaff
        preconditions: ["fulfillment_status == RESERVED"]
        side_effects: ["order.updated_at refreshed"]
      - from: "fulfillment_status=READY"
        to: "fulfillment_status=PICKED_UP"
        trigger: "POST /orders/{id}/complete-pickup"
        actor: StoreStaff
        preconditions: ["fulfillment_status == READY", "payment_status == PAID"]
        side_effects:
          - "for each line: SKU.on_hand_qty -= line.qty; SKU.reserved_qty -= line.qty; recompute sku_availability"
      - from: "fulfillment_status in {RESERVED, READY}"
        to: "fulfillment_status=CANCELLED"
        trigger: "POST /orders/{id}/cancel"
        actor: Customer
        preconditions: ["fulfillment_status in {RESERVED, READY}"]
        side_effects:
          - "for each line: SKU.reserved_qty -= line.qty; recompute sku_availability (CASCADE: freed availability auto-promotes earliest WAITLISTED SpecialOrder for that SKU to ALLOCATED)"
          - "if payment_status == PAID: refund store_credit_applied_cents to Customer.store_credit_balance_cents; payment_status -> REFUNDED; reverse Customer.lifetime_spend_cents and the accrued loyalty_points for this order"

  - entity: TradeIn
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    note: "Branching fork with divergent side effects per branch."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /trade-ins/{id}/accept"
        actor: StoreStaff
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "inspected_condition = provided value or submitted_condition"
          - "compute trade_in_valuation FINAL -> final_value_cents"
          - "Customer.store_credit_balance_cents += final_value_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /trade-ins/{id}/reject"
        actor: StoreStaff
        preconditions: ["status == SUBMITTED"]
        side_effects: ["no credit issued; final_value_cents stays 0"]

  - entity: ConsignmentShelf
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /consignment-shelves/{id}/close"
        actor: StoreStaff
        preconditions: ["status == OPEN"]
        side_effects: ["status -> CLOSED; further displays onto this shelf are rejected with ERR_SHELF_CLOSED"]

  - entity: ConsignmentItem
    initial_state: RECEIVED
    terminal_states: [SOLD]
    transitions:
      - from: RECEIVED
        to: ON_DISPLAY
        trigger: "POST /consignment-items/{id}/display"
        actor: StoreStaff
        preconditions:
          - "status == RECEIVED"
          - "target ConsignmentShelf.status == OPEN"
          - "display window does not push overlapping-item count above shelf.capacity"
        side_effects: ["shelf_id set; display_start/display_end set; status -> ON_DISPLAY"]
      - from: ON_DISPLAY
        to: SOLD
        trigger: "POST /consignment-items/{id}/sell"
        actor: StoreStaff
        preconditions: ["status == ON_DISPLAY"]
        side_effects:
          - "compute consignor_payout -> payout_cents"
          - "consignor Customer.store_credit_balance_cents += payout_cents"

  - entity: SpecialOrder
    initial_state: REQUESTED
    terminal_states: [FULFILLED, CANCELLED]
    note: "Branching at creation plus system auto-promotion; guarded by SKU availability."
    transitions:
      - from: REQUESTED
        to: ALLOCATED
        trigger: "POST /special-orders (create)"
        actor: Customer
        preconditions: ["SKU.on_hand_qty - SKU.reserved_qty >= qty"]
        side_effects: ["SKU.reserved_qty += qty; recompute sku_availability"]
      - from: REQUESTED
        to: WAITLISTED
        trigger: "POST /special-orders (create)"
        actor: Customer
        preconditions: ["SKU.on_hand_qty - SKU.reserved_qty < qty"]
        side_effects: ["queued FIFO by created_at ASC"]
      - from: WAITLISTED
        to: ALLOCATED
        trigger: "system (auto) when SKU availability rises via order cancel or restock"
        actor: system
        preconditions: ["this SpecialOrder is the earliest WAITLISTED for the SKU ordered by created_at ASC (created_at is unique per row, so no further tie-break is required)", "SKU.on_hand_qty - SKU.reserved_qty >= qty"]
        side_effects: ["SKU.reserved_qty += qty; recompute sku_availability"]
      - from: ALLOCATED
        to: FULFILLED
        trigger: "POST /special-orders/{id}/fulfill"
        actor: StoreStaff
        preconditions: ["status == ALLOCATED"]
        side_effects: ["SKU.on_hand_qty -= qty; SKU.reserved_qty -= qty; recompute sku_availability"]
      - from: "status in {REQUESTED, WAITLISTED, ALLOCATED}"
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Customer
        preconditions: ["status in {REQUESTED, WAITLISTED, ALLOCATED}"]
        side_effects: ["if status == ALLOCATED: SKU.reserved_qty -= qty; recompute sku_availability (may promote next WAITLISTED)"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: gift-create-stale-registry
    parent_entity: Registry
    write_endpoint: "POST /registries/{id}/gifts"
    occ_field: "expected_registry_version"
    description: |
      Buying a gift against a Registry whose version has advanced since the
      client last observed it is rejected. A gift purchase legitimately
      supersedes the client's view: another gift (or an item add) may have
      already moved the registry's completion_pct across COMPLETION_THRESHOLD,
      unlocking the completion discount and changing which items still need
      funding. The current writer's stale registry view is therefore rejected
      until it re-reads the registry.
    error_id: ERR_STALE_REGISTRY_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: sku_availability
    trigger: "on any change to SKU.on_hand_qty or SKU.reserved_qty"
    algorithm: threshold
    formula: |
      available = on_hand_qty - reserved_qty
      if available <= 0:        availability_status = OUT_OF_STOCK
      elif available <= LOW_STOCK_THRESHOLD: availability_status = LOW_STOCK
      else:                     availability_status = IN_STOCK
    input_set: "single SKU row"
    constants:
      LOW_STOCK_THRESHOLD: 3
    precision: "integer units"

  - name: registry_completion
    trigger: "on POST /registries/{id}/items, POST /registries/{id}/gifts, POST /registries/{id}/activate"
    algorithm: aggregation
    formula: |
      desired_value_cents  = sum over the registry's RegistryItems of (desired_qty * SKU.base_price_cents)
      fulfilled_value_cents = sum over the registry's RegistryItems of (min(fulfilled_qty, desired_qty) * SKU.base_price_cents)
      completion_pct = 0 if desired_value_cents == 0 else round(fulfilled_value_cents / desired_value_cents, 4)
      # status side effects (BABY_REGISTRY only):
      #   ACTIVE -> COMPLETION_UNLOCKED when completion_pct >= COMPLETION_THRESHOLD
      #   COMPLETION_UNLOCKED -> ACTIVE when completion_pct <  COMPLETION_THRESHOLD
    input_set: "all RegistryItems belonging to the registry"
    constants:
      COMPLETION_THRESHOLD: 0.80
    precision: "cents for value fields (integer); completion_pct 4 decimals, round_half_up"

  - name: registry_completion_discount
    trigger: "on POST /orders when order.registry_id set and order.customer_id == registry.registrant_customer_id and registry.kind == BABY_REGISTRY"
    algorithm: tiered_pricing
    formula: |
      # eligible_line = an order line whose sku_id matches a RegistryItem of the registry
      # needed_qty(line) = max(0, registry_item.desired_qty - registry_item.fulfilled_qty)
      # per eligible line, discountable_qty = min(line.qty, needed_qty(line))
      completion_discount_cents = sum over eligible lines of round_half_up(discountable_qty * SKU.base_price_cents * COMPLETION_DISCOUNT_PCT)
      # Eligibility gate differs by variant (see variants).
    input_set: "eligible order lines vs the registry's items"
    constants:
      COMPLETION_DISCOUNT_PCT: 0.15
    precision: "round_half_up to whole cents, per eligible line then summed"
    variants:
      - name: PROVISIONAL
        when: "order.created_at < registry.event_date"
        difference: "discount applies ONLY when registry.status == COMPLETION_UNLOCKED (completion_pct >= 0.80) at order time; otherwise completion_discount_cents = 0"
      - name: FINAL
        when: "order.created_at >= registry.event_date"
        difference: "discount applies to eligible lines regardless of completion_pct or unlock status (post-event 'finish the registry' perk); the inclusion set (still-needed registry lines) is identical but the eligibility gate is removed, so an identical cart yields a different amount than PROVISIONAL when the registry is not unlocked"

  - name: order_pricing
    trigger: "on POST /orders"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned and non-negotiable:
      # 1) line_total_cents = qty * unit_price_cents (unit_price_cents := SKU.base_price_cents snapshot)
      # 2) subtotal_cents = sum(line_total_cents)
      # 3) loyalty_discount_cents = sum over ALL lines of round_half_up(line_total_cents * LOYALTY_TIER_PCT[buyer.loyalty_tier])
      #    (PINNED: round per line, THEN sum -- NOT round(subtotal * pct))
      # 4) completion_discount_cents = registry_completion_discount (0 if not eligible)
      # 5) gross_discount_cents = loyalty_discount_cents + completion_discount_cents
      # 6) applied_discount_cents = min(gross_discount_cents, round_half_up(subtotal_cents * MAX_DISCOUNT_PCT))
      # 7) total_before_credit_cents = subtotal_cents - applied_discount_cents
      # 8) amount_due_cents = total_before_credit_cents - store_credit_applied_cents (store_credit_applied_cents set at payment)
    input_set: "all order lines; buyer.loyalty_tier as of order creation (BEFORE this order's spend is accrued)"
    constants:
      LOYALTY_TIER_PCT: { BRONZE: 0.00, SILVER: 0.05, GOLD: 0.10, PLATINUM: 0.15 }
      MAX_DISCOUNT_PCT: 0.25
    precision: "round_half_up to whole cents; loyalty discount rounded per line then summed"

  - name: loyalty_accrual
    trigger: "on POST /orders/{id}/pay success; and REGISTRY_COMPLETION_BONUS on registry unlock"
    algorithm: threshold
    formula: |
      # tier is a pure function of lifetime_spend_cents, re-evaluated after each accrual:
      loyalty_tier = PLATINUM if lifetime_spend_cents >= 400000
                     else GOLD   if lifetime_spend_cents >= 150000
                     else SILVER if lifetime_spend_cents >= 50000
                     else BRONZE
      # points on payment:
      points_earned = floor(total_before_credit_cents / 100)
      # ordering: the tier used to DISCOUNT an order is read at order creation; lifetime_spend and points
      # update only at payment, so order N is discounted at its pre-order tier (resolves the apparent circularity).
    input_set: "single Customer row"
    constants:
      LOYALTY_TIER_THRESHOLDS_CENTS: { BRONZE: 0, SILVER: 50000, GOLD: 150000, PLATINUM: 400000 }
      REGISTRY_COMPLETION_BONUS: 250
    precision: "integer points"

  - name: consignor_payout
    trigger: "on POST /consignment-items/{id}/sell"
    algorithm: tiered_pricing
    formula: |
      # >= 3 inputs (sale_price_cents, item.season, item.condition) with tiered selection + nested min:
      split_pct = SEASON_SPLIT[item.season] + (CONDITION_BONUS if item.condition == LIKE_NEW else 0)
      gross_payout_cents = round_half_up(sale_price_cents * split_pct)
      processing_fee_cents = min(round_half_up(sale_price_cents * PROCESSING_FEE_PCT), PROCESSING_FEE_CAP_CENTS)
      payout_cents = gross_payout_cents - processing_fee_cents
    input_set: "single ConsignmentItem at sale"
    constants:
      SEASON_SPLIT: { IN_SEASON: 0.60, OFF_SEASON: 0.50 }
      CONDITION_BONUS: 0.05
      PROCESSING_FEE_PCT: 0.03
      PROCESSING_FEE_CAP_CENTS: 200
    precision: "round_half_up to whole cents; gross and fee rounded independently, THEN subtracted (pinned)"

  - name: trade_in_valuation
    trigger: "QUOTED on POST /trade-ins; FINAL on POST /trade-ins/{id}/accept"
    algorithm: tiered_pricing
    formula: |
      percent_of_retail = round_half_up(SKU.base_price_cents * CONDITION_FACTOR[condition] * TRADE_IN_BASE_PCT)
      # QUOTED variant: no cap
      # FINAL   variant: capped
    input_set: "single TradeIn vs its SKU"
    constants:
      TRADE_IN_BASE_PCT: 0.30
      CONDITION_FACTOR: { LIKE_NEW: 1.00, GOOD: 0.70, FAIR: 0.40 }
      CONDITION_CAP_CENTS: { LIKE_NEW: 2500, GOOD: 1500, FAIR: 800 }
    precision: "round_half_up to whole cents"
    variants:
      - name: QUOTED
        when: "at submission, using submitted_condition"
        difference: "quoted_value_cents = percent_of_retail(submitted_condition); CONDITION_CAP ignored"
      - name: FINAL
        when: "at acceptance, using inspected_condition"
        difference: "final_value_cents = min(percent_of_retail(inspected_condition), CONDITION_CAP_CENTS[inspected_condition]); the cap can lower the value below the quote even when the condition is unchanged"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /customers and public GETs"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed Customer actions on an owned resource, X-User-ID equals the resource owner FK (registrant_customer_id / customer_id / consignor_customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /registries/{id}/activate, /archive, /items; POST /orders/{id}/pay, /cancel; POST /special-orders/{id}/cancel"
  - priority: 4
    category: existence
    check: "all referenced resources exist, validated left-to-right in the path then body FKs"
    error_id: ERR_STORE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing store_id"
  - priority: 4
    category: existence
    check: "referenced Customer exists"
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing a customer id"
  - priority: 4
    category: existence
    check: "referenced SKU exists"
    error_id: ERR_SKU_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing sku_id"
  - priority: 4
    category: existence
    check: "referenced Registry exists"
    error_id: ERR_REGISTRY_NOT_FOUND
    http_status: 404
    applies_to: "registry endpoints"
  - priority: 4
    category: existence
    check: "referenced RegistryItem / Order / Shelf / ConsignmentItem / TradeIn / SpecialOrder exists"
    error_id: ERR_REGISTRY_ITEM_NOT_FOUND
    http_status: 404
    applies_to: "endpoints referencing those ids (each has its own ERR_*_NOT_FOUND)"
  - priority: 5
    category: business_constraint
    check: "request body well-formed: required fields present, enums in range, integers non-negative"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST"
  - priority: 5
    category: business_constraint
    check: "order.lines is non-empty"
    error_id: ERR_EMPTY_ORDER
    http_status: 422
    applies_to: "POST /orders"
  - priority: 5
    category: business_temporal
    check: "pickup_end strictly after pickup_start"
    error_id: ERR_INVALID_PICKUP_WINDOW
    http_status: 422
    applies_to: "POST /orders"
  - priority: 6
    category: state
    check: "target resource in the correct state for the requested transition"
    error_id: ERR_INVALID_REGISTRY_STATE
    http_status: 409
    applies_to: "POST /registries/{id}/activate (must be DRAFT)"
  - priority: 6
    category: state
    check: "registry.status in {ACTIVE, COMPLETION_UNLOCKED} for gifting"
    error_id: ERR_REGISTRY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /registries/{id}/gifts"
  - priority: 6
    category: state
    check: "registry not already ARCHIVED for archive/items"
    error_id: ERR_REGISTRY_ALREADY_ARCHIVED
    http_status: 409
    applies_to: "POST /registries/{id}/archive, POST /registries/{id}/items"
  - priority: 6
    category: state
    check: "order.payment_status == UNPAID"
    error_id: ERR_ORDER_ALREADY_PAID
    http_status: 409
    applies_to: "POST /orders/{id}/pay"
  - priority: 6
    category: state
    check: "order.fulfillment_status == RESERVED"
    error_id: ERR_ORDER_NOT_RESERVED
    http_status: 409
    applies_to: "POST /orders/{id}/mark-ready"
  - priority: 6
    category: state
    check: "order.fulfillment_status == READY (and payment_status == PAID)"
    error_id: ERR_ORDER_NOT_READY
    http_status: 409
    applies_to: "POST /orders/{id}/complete-pickup"
  - priority: 6
    category: state
    check: "order.fulfillment_status in {RESERVED, READY}"
    error_id: ERR_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /orders/{id}/cancel"
  - priority: 6
    category: state
    check: "trade_in.status == SUBMITTED"
    error_id: ERR_TRADE_IN_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /trade-ins/{id}/accept, /reject"
  - priority: 6
    category: state
    check: "consignment_item.status == RECEIVED for display"
    error_id: ERR_CONSIGNMENT_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/display"
  - priority: 6
    category: state
    check: "consignment_item.status == ON_DISPLAY for sell"
    error_id: ERR_CONSIGNMENT_NOT_ON_DISPLAY
    http_status: 409
    applies_to: "POST /consignment-items/{id}/sell"
  - priority: 6
    category: state
    check: "special_order.status == ALLOCATED for fulfill"
    error_id: ERR_SPECIAL_ORDER_NOT_ALLOCATED
    http_status: 409
    applies_to: "POST /special-orders/{id}/fulfill"
  - priority: 6
    category: state
    check: "special_order.status in {REQUESTED, WAITLISTED, ALLOCATED} for cancel"
    error_id: ERR_SPECIAL_ORDER_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /special-orders/{id}/cancel"
  - priority: 7
    category: state
    check: "ConsignmentShelf.status == OPEN for display"
    error_id: ERR_SHELF_CLOSED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/display"
  - priority: 8
    category: business_referential
    check: "every order line SKU.store_id == order.store_id"
    error_id: ERR_SKU_STORE_MISMATCH
    http_status: 409
    applies_to: "POST /orders"
  - priority: 9
    category: business_temporal
    check: "pickup window [pickup_start, pickup_end) time-of-day within [Store.open_minute, Store.close_minute]"
    error_id: ERR_PICKUP_OUTSIDE_HOURS
    http_status: 422
    applies_to: "POST /orders"
  - priority: 10
    category: business_constraint
    check: "station_no in 1..Store.pickup_station_count"
    error_id: ERR_INVALID_STATION
    http_status: 422
    applies_to: "POST /orders"
  - priority: 11
    category: business_constraint
    check: "pickup window does not conflict with another non-cancelled order at the same store+station_no within PICKUP_BUFFER_MIN (15) minutes (half-open intervals plus buffer)"
    error_id: ERR_PICKUP_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /orders"
  - priority: 11
    category: business_constraint
    check: "adding this display window would not raise the count of overlapping ON_DISPLAY items on the shelf above shelf.capacity (closed intervals, aggregate capacity)"
    error_id: ERR_SHELF_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /consignment-items/{id}/display"
  - priority: 11
    category: business_constraint
    check: "gift qty <= registry_item.desired_qty - registry_item.fulfilled_qty"
    error_id: ERR_GIFT_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /registries/{id}/gifts"
  - priority: 12
    category: business_fiscal
    check: "for each order line, SKU.on_hand_qty - SKU.reserved_qty >= line.qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /orders"
  - priority: 13
    category: business_fiscal
    check: "STORE_CREDIT payment: Customer.store_credit_balance_cents >= order.total_before_credit_cents"
    error_id: ERR_INSUFFICIENT_STORE_CREDIT
    http_status: 402
    applies_to: "POST /orders/{id}/pay"
  - priority: 14
    category: state
    check: "expected_registry_version == Registry.version (OCC)"
    error_id: ERR_STALE_REGISTRY_VERSION
    http_status: 412
    applies_to: "POST /registries/{id}/gifts"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Create a store"
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "state_code", "open_minute?", "close_minute?", "pickup_station_count?"]
    output: Store
    side_effects: []
  - method: GET
    path: "/stores/{id}"
    description: "Fetch a store"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Store
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a customer; optional seed fields import loyalty/wallet history"
    roles: [Anonymous]
    code: 201
    input: ["full_name", "email", "initial_lifetime_spend_cents?", "initial_store_credit_cents?", "initial_loyalty_points?"]
    output: Customer
    side_effects: ["loyalty_tier computed from lifetime_spend_cents"]
  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer (wallet, points, tier)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- SKU ---
  - method: POST
    path: "/skus"
    description: "Create a SKU under a store"
    roles: [StoreStaff, PlatformAdmin]
    code: 201
    input: ["store_id", "sku_code", "name", "category", "size_stage", "base_price_cents", "initial_on_hand_qty?"]
    output: SKU
    side_effects: ["availability_status computed"]
  - method: GET
    path: "/skus/{id}"
    description: "Fetch a SKU"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: SKU
    side_effects: []
  - method: GET
    path: "/skus"
    description: "List SKUs (reverse-reachability for SKU.store_id)"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["store_id?", "category?", "size_stage?", "availability_status?", "limit?", "offset?"]
    output: "SKU[]"
    side_effects: []
  - method: POST
    path: "/skus/{id}/restock"
    description: "Add physical stock to a SKU"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: ["add_qty"]
    output: SKU
    side_effects: ["on_hand_qty += add_qty; recompute sku_availability; CASCADE promote earliest WAITLISTED SpecialOrder(s) for this SKU"]

  # --- Registry ---
  - method: POST
    path: "/registries"
    description: "Create a registry (DRAFT)"
    roles: [Customer]
    code: 201
    input: ["registrant_customer_id", "title", "event_date", "kind?"]
    output: Registry
    side_effects: []
  - method: GET
    path: "/registries/{id}"
    description: "Fetch a registry (completion fields included)"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Registry
    side_effects: []
  - method: GET
    path: "/registries"
    description: "List registries (reverse-reachability for Registry.registrant_customer_id)"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["registrant_customer_id?", "kind?", "status?", "limit?", "offset?"]
    output: "Registry[]"
    side_effects: []
  - method: POST
    path: "/registries/{id}/activate"
    description: "Activate a DRAFT registry"
    roles: [Customer]
    code: 200
    input: []
    output: Registry
    side_effects: ["status DRAFT -> ACTIVE; recompute registry_completion; version += 1"]
  - method: POST
    path: "/registries/{id}/archive"
    description: "Archive a registry"
    roles: [Customer]
    code: 200
    input: []
    output: Registry
    side_effects: ["status -> ARCHIVED; version += 1"]
  - method: POST
    path: "/registries/{id}/items"
    description: "Add a desired item to a registry"
    roles: [Customer]
    code: 201
    input: ["sku_id", "desired_qty"]
    output: RegistryItem
    side_effects: ["recompute registry_completion (desired_value/fulfilled_value/completion_pct); may auto-revert COMPLETION_UNLOCKED -> ACTIVE; registry.version += 1"]
  - method: GET
    path: "/registry-items/{id}"
    description: "Fetch a registry item"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: RegistryItem
    side_effects: []
  - method: GET
    path: "/registry-items"
    description: "List registry items (reverse-reachability for registry_id and sku_id)"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["registry_id?", "sku_id?", "limit?", "offset?"]
    output: "RegistryItem[]"
    side_effects: []

  # --- Registry Gift ---
  - method: POST
    path: "/registries/{id}/gifts"
    description: "Purchase a gift against a registry item (OCC on registry.version)"
    roles: [Customer]
    code: 201
    input: ["registry_item_id", "qty", "expected_registry_version"]
    output: RegistryGift
    side_effects:
      - "gifter_customer_id = X-User-ID; amount_cents = qty * SKU.base_price_cents"
      - "RegistryItem.fulfilled_qty += qty (CASCADE hop 1)"
      - "recompute registry_completion -> Registry.fulfilled_value_cents/completion_pct (CASCADE hop 2)"
      - "if completion_pct crosses >= COMPLETION_THRESHOLD: status ACTIVE -> COMPLETION_UNLOCKED and registrant Customer.loyalty_points += REGISTRY_COMPLETION_BONUS (CASCADE hop 3)"
      - "registry.version += 1"
  - method: GET
    path: "/registry-gifts/{id}"
    description: "Fetch a registry gift"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: RegistryGift
    side_effects: []
  - method: GET
    path: "/registry-gifts"
    description: "List registry gifts (reverse-reachability for registry_id, registry_item_id, gifter_customer_id)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["registry_id?", "registry_item_id?", "gifter_customer_id?", "limit?", "offset?"]
    output: "RegistryGift[]"
    side_effects: []

  # --- Order (BOPIS) ---
  - method: POST
    path: "/orders"
    description: "Create a BOPIS order (reserves stock, books pickup window, computes pricing)"
    roles: [Customer]
    code: 201
    input: ["customer_id", "store_id", "lines", "pickup_start", "pickup_end", "station_no", "registry_id?"]
    output: Order
    side_effects:
      - "validate stock, store hours, station, slot conflict"
      - "reserve each line SKU.reserved_qty += qty; recompute sku_availability"
      - "compute order_pricing"
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders (reverse-reachability for customer_id, store_id, registry_id)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["customer_id?", "store_id?", "registry_id?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []
  - method: POST
    path: "/orders/{id}/pay"
    description: "Pay for an order (STORE_CREDIT or CARD)"
    roles: [Customer]
    code: 200
    input: ["payment_method"]
    output: Order
    side_effects:
      - "payment_status -> PAID; set store_credit_applied_cents and amount_due_cents"
      - "if STORE_CREDIT: debit Customer.store_credit_balance_cents"
      - "Customer.lifetime_spend_cents += total_before_credit_cents; loyalty_accrual; recompute loyalty_tier"
  - method: POST
    path: "/orders/{id}/mark-ready"
    description: "Mark an order ready for pickup"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status RESERVED -> READY"]
  - method: POST
    path: "/orders/{id}/complete-pickup"
    description: "Complete BOPIS pickup"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["fulfillment_status READY -> PICKED_UP; for each line SKU.on_hand_qty -= qty and SKU.reserved_qty -= qty; recompute sku_availability"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order (releases stock, refunds store credit)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED; release each line SKU.reserved_qty -= qty; recompute sku_availability (CASCADE promote earliest WAITLISTED SpecialOrder)"
      - "if payment_status == PAID: refund store_credit_applied_cents; payment_status -> REFUNDED; reverse lifetime_spend and accrued points"

  # --- Consignment Shelf ---
  - method: POST
    path: "/stores/{id}/consignment-shelves"
    description: "Create a consignment shelf under a store"
    roles: [StoreStaff, PlatformAdmin]
    code: 201
    input: ["shelf_code", "capacity", "season"]
    output: ConsignmentShelf
    side_effects: []
  - method: GET
    path: "/consignment-shelves/{id}"
    description: "Fetch a shelf"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: ConsignmentShelf
    side_effects: []
  - method: GET
    path: "/consignment-shelves"
    description: "List shelves (reverse-reachability for ConsignmentShelf.store_id)"
    roles: [Anonymous, Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["store_id?", "limit?", "offset?"]
    output: "ConsignmentShelf[]"
    side_effects: []
  - method: POST
    path: "/consignment-shelves/{id}/close"
    description: "Close a shelf (seasonal corner teardown); blocks further displays"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: ConsignmentShelf
    side_effects: ["status OPEN -> CLOSED"]

  # --- Consignment Item ---
  - method: POST
    path: "/consignment-items"
    description: "Consign an item (RECEIVED)"
    roles: [Customer]
    code: 201
    input: ["consignor_customer_id", "store_id", "title", "condition", "season", "list_price_cents"]
    output: ConsignmentItem
    side_effects: []
  - method: GET
    path: "/consignment-items/{id}"
    description: "Fetch a consignment item"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: ConsignmentItem
    side_effects: []
  - method: GET
    path: "/consignment-items"
    description: "List consignment items (reverse-reachability for consignor_customer_id, store_id, shelf_id)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["consignor_customer_id?", "store_id?", "shelf_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentItem[]"
    side_effects: []
  - method: POST
    path: "/consignment-items/{id}/display"
    description: "Put a consignment item on a shelf for a display window"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: ["shelf_id", "display_start", "display_end"]
    output: ConsignmentItem
    side_effects: ["status RECEIVED -> ON_DISPLAY; set shelf_id, display_start, display_end"]
  - method: POST
    path: "/consignment-items/{id}/sell"
    description: "Sell a displayed consignment item and pay out the consignor"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: ["sale_price_cents"]
    output: ConsignmentItem
    side_effects: ["status ON_DISPLAY -> SOLD; compute consignor_payout -> payout_cents; consignor Customer.store_credit_balance_cents += payout_cents"]

  # --- Trade-In ---
  - method: POST
    path: "/trade-ins"
    description: "Submit an outgrown item for trade-in (computes QUOTED value)"
    roles: [Customer]
    code: 201
    input: ["customer_id", "sku_id", "submitted_condition"]
    output: TradeIn
    side_effects: ["compute trade_in_valuation QUOTED -> quoted_value_cents"]
  - method: GET
    path: "/trade-ins/{id}"
    description: "Fetch a trade-in"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: TradeIn
    side_effects: []
  - method: GET
    path: "/trade-ins"
    description: "List trade-ins (reverse-reachability for customer_id, sku_id)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["customer_id?", "sku_id?", "limit?", "offset?"]
    output: "TradeIn[]"
    side_effects: []
  - method: POST
    path: "/trade-ins/{id}/accept"
    description: "Accept a trade-in after inspection (issues store credit)"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: ["inspected_condition?"]
    output: TradeIn
    side_effects: ["status -> ACCEPTED; compute trade_in_valuation FINAL -> final_value_cents; Customer.store_credit_balance_cents += final_value_cents"]
  - method: POST
    path: "/trade-ins/{id}/reject"
    description: "Reject a trade-in"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: TradeIn
    side_effects: ["status -> REJECTED"]

  # --- Special Order ---
  - method: POST
    path: "/special-orders"
    description: "Request a special order (ALLOCATED if stock, else WAITLISTED)"
    roles: [Customer]
    code: 201
    input: ["customer_id", "sku_id", "store_id", "qty?"]
    output: SpecialOrder
    side_effects: ["if available >= qty: reserve and ALLOCATED, else WAITLISTED (FIFO by created_at)"]
  - method: GET
    path: "/special-orders/{id}"
    description: "Fetch a special order"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []
  - method: GET
    path: "/special-orders"
    description: "List special orders (reverse-reachability for customer_id, sku_id, store_id)"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: ["customer_id?", "sku_id?", "store_id?", "status?", "limit?", "offset?"]
    output: "SpecialOrder[]"
    side_effects: []
  - method: POST
    path: "/special-orders/{id}/fulfill"
    description: "Fulfill an allocated special order"
    roles: [StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status ALLOCATED -> FULFILLED; SKU.on_hand_qty -= qty; SKU.reserved_qty -= qty; recompute sku_availability"]
  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a special order"
    roles: [Customer, StoreStaff, PlatformAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["status -> CANCELLED; if was ALLOCATED release reservation and promote next WAITLISTED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock)."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role on a protected endpoint"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for the operation"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Customer acts on a registry/order/consignment/special-order it does not own"
  - id: ERR_STORE_NOT_FOUND
    http: 404
    condition: "Referenced store_id does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "Referenced customer id does not exist"
  - id: ERR_SKU_NOT_FOUND
    http: 404
    condition: "Referenced sku_id does not exist"
  - id: ERR_REGISTRY_NOT_FOUND
    http: 404
    condition: "Referenced registry id does not exist"
  - id: ERR_REGISTRY_ITEM_NOT_FOUND
    http: 404
    condition: "Referenced registry_item_id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order id does not exist"
  - id: ERR_SHELF_NOT_FOUND
    http: 404
    condition: "Referenced shelf_id does not exist"
  - id: ERR_CONSIGNMENT_ITEM_NOT_FOUND
    http: 404
    condition: "Referenced consignment item id does not exist"
  - id: ERR_TRADE_IN_NOT_FOUND
    http: 404
    condition: "Referenced trade-in id does not exist"
  - id: ERR_SPECIAL_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced special-order id does not exist"
  - id: ERR_VALIDATION
    http: 422
    condition: "Malformed body: missing required field, bad enum, negative integer, wrong type"
  - id: ERR_EMPTY_ORDER
    http: 422
    condition: "POST /orders with an empty lines array"
  - id: ERR_INVALID_PICKUP_WINDOW
    http: 422
    condition: "pickup_end not strictly after pickup_start"
  - id: ERR_INVALID_REGISTRY_STATE
    http: 409
    condition: "Activate attempted on a non-DRAFT registry"
  - id: ERR_REGISTRY_NOT_ACTIVE
    http: 409
    condition: "Gift attempted on a registry not in {ACTIVE, COMPLETION_UNLOCKED}"
  - id: ERR_REGISTRY_ALREADY_ARCHIVED
    http: 409
    condition: "Archive or add-item on an already-ARCHIVED registry"
  - id: ERR_ORDER_ALREADY_PAID
    http: 409
    condition: "Pay attempted on an order not in payment_status UNPAID"
  - id: ERR_ORDER_NOT_RESERVED
    http: 409
    condition: "mark-ready on an order not in fulfillment_status RESERVED"
  - id: ERR_ORDER_NOT_READY
    http: 409
    condition: "complete-pickup on an order not READY or not PAID"
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "cancel on an order in fulfillment_status PICKED_UP or CANCELLED"
  - id: ERR_TRADE_IN_NOT_SUBMITTED
    http: 409
    condition: "accept/reject on a trade-in not in SUBMITTED"
  - id: ERR_CONSIGNMENT_NOT_RECEIVED
    http: 409
    condition: "display on a consignment item not in RECEIVED"
  - id: ERR_CONSIGNMENT_NOT_ON_DISPLAY
    http: 409
    condition: "sell on a consignment item not ON_DISPLAY"
  - id: ERR_SHELF_CLOSED
    http: 409
    condition: "display onto a CLOSED shelf"
  - id: ERR_SPECIAL_ORDER_NOT_ALLOCATED
    http: 409
    condition: "fulfill on a special order not ALLOCATED"
  - id: ERR_SPECIAL_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "cancel on a special order already FULFILLED or CANCELLED"
  - id: ERR_SKU_STORE_MISMATCH
    http: 409
    condition: "Order line SKU.store_id != order.store_id"
  - id: ERR_PICKUP_OUTSIDE_HOURS
    http: 422
    condition: "Pickup window falls outside the store's [open_minute, close_minute]"
  - id: ERR_INVALID_STATION
    http: 422
    condition: "station_no not in 1..Store.pickup_station_count"
  - id: ERR_PICKUP_SLOT_CONFLICT
    http: 409
    condition: "Pickup window conflicts with another order at the same station within the 15-minute buffer"
  - id: ERR_SHELF_CAPACITY_EXCEEDED
    http: 409
    condition: "Display window would exceed the shelf's overlapping-item capacity"
  - id: ERR_GIFT_EXCEEDS_REMAINING
    http: 422
    condition: "Gift qty exceeds registry_item.desired_qty - fulfilled_qty"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "Order line qty exceeds SKU available (on_hand_qty - reserved_qty)"
  - id: ERR_INSUFFICIENT_STORE_CREDIT
    http: 402
    condition: "STORE_CREDIT payment with balance < total_before_credit_cents"
  - id: ERR_STALE_REGISTRY_VERSION
    http: 412
    condition: "expected_registry_version does not match Registry.version"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may register and read public catalog/registry data"
    identity: opaque
    exclusive_operations: ["POST /customers"]
    shared_operations:
      - "GET /stores/{id}"
      - "GET /skus/{id}"
      - "GET /skus"
      - "GET /registries/{id}"
      - "GET /registries"
      - "GET /registry-items/{id}"
      - "GET /registry-items"
      - "GET /consignment-shelves/{id}"
      - "GET /consignment-shelves"
  - name: Customer
    description: "Registered shopper acting on their own registries, orders, consignments, trade-ins, special orders; may gift to any registry"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /registries"
      - "POST /registries/{id}/activate"
      - "POST /registries/{id}/archive"
      - "POST /registries/{id}/items"
      - "POST /registries/{id}/gifts"
      - "POST /orders"
      - "POST /orders/{id}/pay"
      - "POST /consignment-items"
      - "POST /trade-ins"
      - "POST /special-orders"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /orders/{id}"
      - "GET /orders"
      - "POST /orders/{id}/cancel"
      - "GET /registry-gifts/{id}"
      - "GET /registry-gifts"
      - "GET /consignment-items/{id}"
      - "GET /consignment-items"
      - "GET /trade-ins/{id}"
      - "GET /trade-ins"
      - "GET /special-orders/{id}"
      - "GET /special-orders"
      - "POST /special-orders/{id}/cancel"
  - name: StoreStaff
    description: "Store operator: catalog, stock, order fulfillment, consignment display/sale, trade-in decisions, special-order fulfillment"
    identity: opaque
    exclusive_operations:
      - "POST /skus"
      - "POST /skus/{id}/restock"
      - "POST /orders/{id}/mark-ready"
      - "POST /orders/{id}/complete-pickup"
      - "POST /stores/{id}/consignment-shelves"
      - "POST /consignment-shelves/{id}/close"
      - "POST /consignment-items/{id}/display"
      - "POST /consignment-items/{id}/sell"
      - "POST /trade-ins/{id}/accept"
      - "POST /trade-ins/{id}/reject"
      - "POST /special-orders/{id}/fulfill"
    shared_operations:
      - "GET /customers/{id}"
      - "GET /orders/{id}"
      - "GET /orders"
      - "POST /orders/{id}/cancel"
      - "GET /consignment-items/{id}"
      - "GET /consignment-items"
      - "GET /trade-ins/{id}"
      - "GET /trade-ins"
      - "GET /special-orders/{id}"
      - "GET /special-orders"
      - "POST /special-orders/{id}/cancel"
  - name: PlatformAdmin
    description: "Operational superuser: store/catalog setup and logical clock; superset of StoreStaff reads"
    identity: opaque
    exclusive_operations:
      - "POST /stores"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /skus"
      - "POST /skus/{id}/restock"
      - "GET /customers/{id}"
      - "GET /orders/{id}"
      - "GET /orders"
      - "POST /orders/{id}/mark-ready"
      - "POST /orders/{id}/complete-pickup"
      - "POST /orders/{id}/cancel"
      - "GET /consignment-items/{id}"
      - "GET /consignment-items"
      - "GET /trade-ins/{id}"
      - "GET /trade-ins"
      - "GET /special-orders/{id}"
      - "GET /special-orders"
      - "POST /special-orders/{id}/fulfill"
      - "POST /special-orders/{id}/cancel"
