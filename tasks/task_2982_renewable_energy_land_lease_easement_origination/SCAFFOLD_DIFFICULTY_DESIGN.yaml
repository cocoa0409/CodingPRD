  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: security_gross_exactly_at_five_million_tier_edge
        endpoint: "POST /land-origination/option-agreements/{optionId}/exercise"
        metric: gross_security_cents
        boundary: "SECURITY_TIER_1_CENTS == 5000000, the first threshold of the ADMIN_RATE ladder (600 bps below it, 450 bps from it up to SECURITY_TIER_2_CENTS 15000000)"
        probes: ["4999500 (below)", "5000000 (exactly at)", "5300000 (above)"]
        grounds:
          - calculations.decommissioning_security_amount
          - calculations.decommissioning_security_amount.constants
          - entities.LeaseAgreement.fields.admin_rate_bps
          - entities.LeaseAgreement.fields.total_security_required_cents
        distinguishing_aspect: |
          Threshold-ladder boundary on the money metric gross_security_cents,
          probed at 4999500 / 5000000 / 5300000 by three parcels whose
          buildable_acres are 99.99 / 100.00 / 106.00 and SECURITY_PER_ACRE_CENTS
          50000. The ladder is inclusive at the bottom of each band, so exactly
          5000000 draws 450 bps, not 600. The payoff is a non-monotonicity: the
          99.99-acre parcel's total (5299470) is LARGER than the 100.00-acre
          parcel's total (5225000) even though its gross is smaller. This instance
          probes a money threshold; the second instance in this rule probes a
          greater-of comparison edge instead.
