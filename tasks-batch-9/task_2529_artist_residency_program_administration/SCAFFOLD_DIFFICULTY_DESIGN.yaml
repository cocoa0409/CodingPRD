            - call: "POST /panel-assignments"
              payload: { application_id: "${app}", panelist_id: "${p4}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { pa4: "$.data.id" }
          trigger:
            - call: "POST /panel-assignments/${pa1}/scores"
              payload: { score_artistic_merit: 9, score_feasibility: 8, score_community_fit: 8,
