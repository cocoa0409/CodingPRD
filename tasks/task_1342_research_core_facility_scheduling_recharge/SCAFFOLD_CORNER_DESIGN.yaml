            - { call: "POST /usage-logs/${ul1}/validate", payload: {}, as: CoreStaff, as_user_id: "staff-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T08:55:00Z" }, as: FacilityAdmin, as_user_id: "admin-1" }
