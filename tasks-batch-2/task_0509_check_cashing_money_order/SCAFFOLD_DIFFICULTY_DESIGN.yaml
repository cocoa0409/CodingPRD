scaffold_difficulty_design:

  # =========================================================================
  # RULE 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: check_cash_fee_float_gross_on_full_face
        grounds:
          - calculations.check_cash_fee
          - entities.Transaction.fields.fee_cents
          - entities.Transaction.fields.face_amount_cents
        distinguishing_aspect: |
          Fee variant operates on the Transaction domain — float_gross charges the fee on the FULL
          check face (2449 cents for face=150000 under the GOVT-like schedule), independent of any
          later settlement outcome; this is structurally different from the Customer-domain risk
          calculation below.
        test_recipe:
          setup:
            - "A StoreManager screens a customer to VERIFIED."
            - "An active fee schedule with base_fee_cents=99, percent_rate_bps=100, tier_breakpoint_cents=500000, high_percent_rate_bps=200, max_fee_cents=50000."
            - "An OPEN cash drawer with opening_float_cents=1000000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pat River", id_type: "DRIVERS_LICENSE", id_number: "DL-1", date_of_birth: "1990-01-01" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S1", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.fee_cents == 1099"
            - "Transaction.${txn_id}.lifecycle_state == POSTED"
            - "Transaction.${txn_id}.settlement_state == SETTLED"

      - name: customer_risk_score_provisional_vs_confirmed
        grounds:
          - calculations.customer_risk_score
          - entities.Customer.fields.risk_score
          - entities.CheckItem.fields.verification_state
          - state_machines.CheckItem.RISK_HELD_to_CLEARED
        distinguishing_aspect: |
          Risk-score variant operates on the Customer domain — the provisional value surfaced while a
          check is RISK_HELD is NOT written to Customer.risk_score (stays 0), and only the confirmed
          variant on release writes +60 (AMOUNT_HOLD_PTS). This subject (Customer.risk_score) and shape
          (provisional what-if vs persisted) differ from the Transaction-domain fee variant above.
        test_recipe:
          setup:
            - "A VERIFIED customer; an active PAYROLL fee schedule; an OPEN drawer."
            - "A CHECK_CASH transaction for face_amount_cents=350000 (>= HOLD_THRESHOLD_CENTS 300000) creating a RISK_HELD CheckItem with hold_reason=AMOUNT_THRESHOLD; Teller teller-1 created it."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dana Holt", id_type: "PASSPORT", id_number: "P-2", date_of_birth: "1985-03-03" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "PAYROLL", base_fee_cents: 199, percent_rate_bps: 150, tier_breakpoint_cents: 199999, high_percent_rate_bps: 275, max_fee_cents: 2000000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S2", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 350000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              captures: { real_check_id: "$.data[0].id" }
          trigger:
            - call: "POST /check-items/${real_check_id}/release"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "before release: Customer.${cust_id}.risk_score == 0 (provisional not persisted)"
            - "after release: Customer.${cust_id}.risk_score == 60"
            - "after release: Customer.${cust_id}.risk_tier == STANDARD"
            - "CheckItem.${real_check_id}.verification_state == CLEARED"

  # =========================================================================
  # RULE 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: check_cash_fee_per_leg_floor_then_sum_mode_b
        grounds:
          - calculations.check_cash_fee
          - entities.FeeSchedule.fields.tier_breakpoint_cents
          - entities.FeeSchedule.fields.high_percent_rate_bps
        distinguishing_aspect: |
          MODE (b) nested rounding where order matters: with base=199, percent_rate_bps=150,
          tier_breakpoint_cents=199999, high_percent_rate_bps=275 and face=250001, flooring each percent
          leg BEFORE summing yields low=2999, high=1375 -> fee=4573, whereas sum-then-floor would yield
          4574. The scaffold pins per-leg-then-sum, so the asserted value is 4573 not 4574.
        test_recipe:
          setup:
            - "A VERIFIED customer; an OPEN drawer with float 2000000; the divergent PAYROLL schedule (bp=199999, pr=150, hpr=275, base=199, max=2000000)."
            - "face=250001 is below HOLD_THRESHOLD_CENTS=300000 and maker LOW, so the check auto-clears."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Lee Mode", id_type: "STATE_ID", id_number: "SID-3", date_of_birth: "1979-07-07" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "PAYROLL", base_fee_cents: 199, percent_rate_bps: 150, tier_breakpoint_cents: 199999, high_percent_rate_bps: 275, max_fee_cents: 2000000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S3", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 250001, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.fee_cents == 4573"
            - "Transaction.${txn_id}.lifecycle_state == POSTED"

      - name: service_fee_greater_of_and_cap_mode_a
        grounds:
          - calculations.service_fee
          - entities.Transaction.fields.txn_type
          - entities.Transaction.fields.fee_cents
        distinguishing_aspect: |
          MODE (a) formula with >=3 inputs and non-linear interaction branching on txn_type: PREPAID_LOAD
          uses max(PREPAID_FLAT_CENTS=395, face*30/10000); for face=200000 the percent leg 600 wins ->
          fee=600 (greater-of, NOT additive). This is a different combinatorial mode from the per-leg
          rounding instance above, on a non-CHECK_CASH product.
        test_recipe:
          setup:
            - "A VERIFIED customer; an OPEN drawer; PREPAID_LOAD takes no fee schedule (fee_schedule_id null)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sam Card", id_type: "MILITARY_ID", id_number: "M-4", date_of_birth: "1992-09-09" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /cash-drawers"
              payload: { store_code: "S4", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "PREPAID_LOAD", face_amount_cents: 200000, card_last_four: "4242" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          assert:
            - "Transaction.${txn_id}.fee_cents == 600"
            - "Transaction.${txn_id}.settlement_state == SETTLED"

  # =========================================================================
  # RULE 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: checkitem_branch_verifying_to_riskheld_then_reject
        grounds:
          - state_machines.CheckItem.VERIFYING_to_RISK_HELD
          - state_machines.CheckItem.RISK_HELD_to_REJECTED
          - entities.CheckItem.fields.verification_state
        distinguishing_aspect: |
          CheckItem is a BRANCHING machine: VERIFYING forks to {CLEARED, RISK_HELD}, and RISK_HELD forks
          again to {CLEARED, REJECTED} with divergent side-effects (release POSTS the txn and moves cash;
          reject VOIDS it and moves no cash). This non-linearity lives on CheckItem, distinct from the
          ReturnedItem cycle below.
        test_recipe:
          setup:
            - "A VERIFIED customer; PAYROLL schedule; OPEN drawer; a CHECK_CASH face=350000 (AMOUNT hold) created by teller-1, now RISK_HELD."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rae Branch", id_type: "DRIVERS_LICENSE", id_number: "DL-5", date_of_birth: "1988-02-02" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "PAYROLL", base_fee_cents: 199, percent_rate_bps: 150, tier_breakpoint_cents: 199999, high_percent_rate_bps: 275, max_fee_cents: 2000000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S5", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 350000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              captures: { check_id: "$.data[0].id" }
          trigger:
            - call: "POST /check-items/${check_id}/reject"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "CheckItem.${check_id}.hold_reason == AMOUNT_THRESHOLD (before reject)"
            - "CheckItem.${check_id}.verification_state == REJECTED"
            - "Transaction.${txn_id}.lifecycle_state == VOIDED"
            - "Transaction.${txn_id}.settlement_state == UNSETTLED"

      - name: returned_item_cyclic_partial_recovery_loop
        grounds:
          - state_machines.ReturnedItem.PARTIALLY_RECOVERED_to_PARTIALLY_RECOVERED
          - state_machines.ReturnedItem.PARTIALLY_RECOVERED_to_RECOVERED
          - entities.ReturnedItem.fields.recovered_cents
        distinguishing_aspect: |
          ReturnedItem is a CYCLIC machine: PARTIALLY_RECOVERED -> PARTIALLY_RECOVERED can repeat across
          multiple recover calls before reaching RECOVERED. This loop on ReturnedItem is a different
          entity and a different non-linear shape (cycle, not branch) from the CheckItem instance above.
        test_recipe:
          setup:
            - "A VERIFIED customer; OPEN drawer; GOVT schedule; a POSTED+SETTLED CHECK_CASH face=100000 created by teller-1, then RETURNED -> ReturnedItem (total_owed = 100000 + RETURN_FEE_CENTS 2500 = 102500)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mo Loop", id_type: "STATE_ID", id_number: "SID-6", date_of_birth: "1975-05-05" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S6", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/return"
              payload: { return_reason: "NSF" }
              as: StoreManager
              as_user_id: "manager-9"
              captures: { ri_id: $.data.id }
            - call: "POST /returned-items/${ri_id}/recover"
              payload: { amount_cents: 40000 }
              as: Teller
              as_user_id: "teller-1"
          trigger:
            - call: "POST /returned-items/${ri_id}/recover"
              payload: { amount_cents: 30000 }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "after first recover: ReturnedItem.${ri_id}.status == PARTIALLY_RECOVERED and recovered_cents == 40000"
            - "after second recover (trigger): ReturnedItem.${ri_id}.status == PARTIALLY_RECOVERED and recovered_cents == 70000"
            - "Transaction.${txn_id}.settlement_state == RETURNED (not yet RECOVERED)"

  # =========================================================================
  # RULE 4 — transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_cascade_depth3_recovery_then_risk_tier_bump
        grounds:
          - state_machines.Transaction.settlement_SETTLED_to_settlement_RETURNED
          - entities.Customer.fields.outstanding_recovery_cents
          - entities.Customer.fields.risk_score
          - entities.Customer.fields.risk_tier
        distinguishing_aspect: |
          Depth-3 chain from POST /transactions/{id}/return: (1) the return creates a ReturnedItem; (2)
          that ReturnedItem creation bumps Customer.outstanding_recovery_cents by 102500; (3) the same
          accrual bumps Customer.risk_score by RETURN_RISK_DELTA 250 each return, and after the SECOND
          return the cumulative 500 crosses the ELEVATED threshold (>=350) bumping risk_tier. Each hop is
          caused by the prior hop, not by the original return directly.
        test_recipe:
          setup:
            - "A VERIFIED customer; OPEN drawer with float 2000000; GOVT schedule."
            - "Two POSTED+SETTLED CHECK_CASH checks of face=100000 each (teller-1), one already RETURNED so risk_score==250 (STANDARD)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cas Cade", id_type: "PASSPORT", id_number: "P-7", date_of_birth: "1983-08-08" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "GOVERNMENT", base_fee_cents: 99, percent_rate_bps: 100, tier_breakpoint_cents: 500000, high_percent_rate_bps: 200, max_fee_cents: 50000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S7", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn1_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn2_id: $.data.id }
            - call: "POST /transactions/${txn1_id}/return"
              payload: { return_reason: "NSF" }
              as: StoreManager
              as_user_id: "manager-9"
          trigger:
            - call: "POST /transactions/${txn2_id}/return"
              payload: { return_reason: "ACCOUNT_CLOSED" }
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "Customer.${cust_id}.outstanding_recovery_cents == 205000"
            - "Customer.${cust_id}.risk_score == 500"
            - "Customer.${cust_id}.risk_tier == ELEVATED"
            - "Transaction.${txn2_id}.settlement_state == RETURNED"

      - name: void_cascade_depth2_drawer_and_velocity_reversal
        grounds:
          - state_machines.Transaction.lifecycle_POSTED_to_lifecycle_VOIDED
          - calculations.drawer_expected_cash
          - entities.CashDrawer.fields.expected_cash_cents
          - entities.Customer.fields.daily_transaction_count
        distinguishing_aspect: |
          Depth-2 chain from POST /transactions/{id}/void, a DIFFERENT trigger than the return cascade:
          (1) void flips lifecycle to VOIDED, which (2) recomputes CashDrawer.expected_cash_cents by
          reversing the original net impact AND decrements Customer.daily_transaction_count. The drawer
          recompute is caused by the void, not requested directly.
        test_recipe:
          setup:
            - "A VERIFIED customer; OPEN drawer float 1000000; a POSTED MONEY_ORDER face=50000 (fee 349) created by teller-1, so expected_cash_cents=1050349, daily_transaction_count=1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Van Void", id_type: "DRIVERS_LICENSE", id_number: "DL-8", date_of_birth: "1991-11-11" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /cash-drawers"
              payload: { store_code: "S8", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "MONEY_ORDER", face_amount_cents: 50000, payee_name: "Acme" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/void"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "before void: CashDrawer.${drawer_id}.expected_cash_cents == 1050349"
            - "after void: CashDrawer.${drawer_id}.expected_cash_cents == 1000000"
            - "after void: Customer.${cust_id}.daily_transaction_count == 0"
            - "Transaction.${txn_id}.lifecycle_state == VOIDED"

  # =========================================================================
  # RULE 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_beats_kyc_on_release
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_KYC_NOT_VERIFIED]
        distinguishing_aspect: |
          Category pair business_constraint(SoD, priority 5) vs business_safety(KYC, priority 6): a
          release attempt that BOTH is performed by the creating teller AND targets a customer whose
          kyc_status is no longer VERIFIED returns ERR_SEGREGATION_OF_DUTIES (priority 5 wins), not
          ERR_KYC_NOT_VERIFIED.
        test_recipe:
          setup:
            - "A customer screened VERIFIED, a RISK_HELD check created by teller-1, then the customer re-screened to REJECTED (kyc_status no longer VERIFIED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pri Order", id_type: "STATE_ID", id_number: "SID-9", date_of_birth: "1980-01-01" }
              as: Teller
              captures: { cust_id: $.data.id }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: true }
              as: StoreManager
            - call: "POST /fee-schedules"
              payload: { check_type: "PAYROLL", base_fee_cents: 199, percent_rate_bps: 150, tier_breakpoint_cents: 199999, high_percent_rate_bps: 275, max_fee_cents: 2000000, active: true }
              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S9", business_date: "2026-05-01", opening_float_cents: 2000000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 350000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
              captures: { txn_id: $.data.id }
            - call: "GET /transactions/${txn_id}/check-items"
              payload: {}
              as: StoreManager
              captures: { check_id: "$.data[0].id" }
            - call: "POST /compliance-screens"
              payload: { customer_id: "${cust_id}", ofac_list_hit: false, kyc_documents_valid: false }
              as: StoreManager
          trigger:
            - call: "POST /check-items/${check_id}/release"
              payload: {}
              as: StoreManager
              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_SEGREGATION_OF_DUTIES"
            - "response http_status == 403"
            - "CheckItem.${check_id}.verification_state == RISK_HELD (unchanged)"

      - name: drawer_not_open_beats_daily_limit_on_post
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors[ERR_DRAWER_NOT_OPEN]
          - errors[ERR_DAILY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal(drawer state, priority 9) vs business_fiscal(daily limit,
          priority 13): a CHECK_CASH post against a RECONCILING drawer for an amount that would also blow
          the daily cash limit returns ERR_DRAWER_NOT_OPEN (priority 9 wins) before the fiscal limit is
          ever evaluated.
