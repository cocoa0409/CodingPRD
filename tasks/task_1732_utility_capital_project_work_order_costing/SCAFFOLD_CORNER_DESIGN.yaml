          setup: ["RegulatoryAsset proposed by rates-1"]
          setup_api_calls:
            - { call: "POST /ucp/regulatory-assets", payload: { description: "Dubious deferral", original_cents: 9000, amortization_months: 3 }, as: RateAnalyst, as_user_id: rates-1, captures: { ra: $.data.id } }
          trigger:
            - { call: "POST /ucp/regulatory-assets/${ra}/reject", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { st: $.data.status } }
            - { call: "POST /ucp/regulatory-assets/${ra}/approve", payload: {}, as: Controller, as_user_id: ctrl-1, captures: { err: $.data.error_id } }
          assert:
            - "Rejected: status ${st} == REJECTED"
            - "Approve after reject: ${err} == ERR_INVALID_STATE"

