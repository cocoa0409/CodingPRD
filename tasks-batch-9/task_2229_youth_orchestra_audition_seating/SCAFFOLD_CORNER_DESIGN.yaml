  # =========================================================================
  # Table 6 (Errors) - claim_type error_triggerable. The bundles below cover
  # every §1.6 error id that is NOT already produced by a §1.8 instance or by
  # an earlier §1.9 section; each bundle groups ids that share one fixture.
  # Already produced elsewhere and therefore not repeated here:
  #   ERR_INVALID_REQUEST, ERR_SEASON_NOT_FOUND, ERR_ENSEMBLE_NOT_FOUND,
  #   ERR_MEMBER_NOT_FOUND, ERR_PLACEMENT_NOT_FOUND, ERR_ENSEMBLE_EVENT_NOT_FOUND
  #   (entities section), ERR_INVALID_SEASON_TRANSITION,
  #   ERR_INVALID_STATE_FOR_OPERATION, ERR_ENSEMBLE_NOT_SEATED (state_machines),
  #   ERR_SECTION_CAPACITY_EXCEEDED, ERR_SECTION_FULL_AT_ACCEPTANCE,
  #   ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS, ERR_EVENT_KIND_NOT_ELIGIBLE,
  #   ERR_MEMBER_NOT_IN_ENSEMBLE (validations), ERR_SLOT_INSTRUMENT_MISMATCH,
  #   ERR_REPERTOIRE_REQUIREMENTS_UNMET, ERR_SLOT_OUTSIDE_AUDITION_WINDOW,
  #   ERR_ROOM_DOUBLE_BOOKED, ERR_PANELIST_UNAVAILABLE,
  #   ERR_MEMBER_EVENT_CONFLICT, ERR_AID_REQUEST_EXCEEDS_ASSESSMENT,
  #   ERR_AID_REQUEST_NOT_ALLOWED_IN_STATE, ERR_DELINQUENT_ACCOUNT_BLOCKS_CLOSE,
  #   ERR_SOLOIST_NOT_ELIGIBLE, ERR_GUEST_ARTIST_FEE_CAP_EXCEEDED (§1.8), and
  #   ERR_STALE_ENSEMBLE_VERSION / ERR_STALE_SEASON_VERSION
  #   (cross_cutting_complexity_layers, below).
  - section: errors
    instances:
      - name: auth_envelope_and_pagination_errors_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_INVALID_PAGINATION]
          - rbac.roles
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - validations[priority 7]
        distinguishing_aspect: |
          The four envelope-level errors are distinguished by cause, not by target: an
          unknown role string and an absent role header both yield 401
          ERR_MISSING_AUTH_HEADERS (priority 1); a real role acting outside its §1.5 roles
          list yields 403 ERR_UNAUTHORIZED (priority 2); a real role that IS listed but is
          entity-backed and points at someone else's row yields 403 ERR_NOT_RESOURCE_OWNER
          (priority 3) - Ada's Guardian may not read Ben's audition and Panel Violin 2 may
          not sign Panel Violin 1's score sheet; and a well-authorised list read with
          limit 101 or offset -1 yields 400 ERR_INVALID_PAGINATION (priority 7).
        test_recipe:
          setup:
            - "Season in AUDITIONS_OPEN with the Philharmonic VIOLIN section, three VIOLIN"
            - "panelists (Panel Violin 1..3), Ada Strings with a SCHEDULED audition, and a"
            - "second member Ben Bow. The current Ensemble.version was captured as ens_v0 so"
            - "the rejected placement attempt still carries a live OCC token."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1, sibling_enrolled: false, alumni_engagement_opt_in: false }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_1: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 2", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_2: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel Violin 3", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { p_violin_3: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T11:00:00Z", panelist_ids: ["${p_violin_1}", "${p_violin_2}", "${p_violin_3}"], instrument_focus: "VIOLIN", quorum_required: 3, capacity: 8 }
              as: RegistrarStaff
              captures: { slot_violin: "$.data.id" }
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Bruch Concerto mvt I", excerpt_ids: ["EX1"], scale_attested: true }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /auditions/${a1_id}/schedule"
              payload: { slot_id: "${slot_violin}" }
              as: RegistrarStaff
            - call: "POST /members"
              payload: { legal_name: "Ben Bow", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1, sibling_enrolled: false, alumni_engagement_opt_in: false }
              as: RegistrarStaff
              captures: { m2_id: "$.data.id" }
            - call: "GET /ensembles/${ens_id}"
              as: ArtisticDirector
              captures: { ens_v0: "$.data.version" }
          trigger:
            - call: "GET /seasons/${season_id}"
              as: Treasurer
              captures: { e_role: "$.data.error_id" }
            - call: "GET /seasons/${season_id}"
              as: "(X-User-Role header absent)"
              captures: { e_hdr: "$.data.error_id" }
            - call: "GET /members"
              as: Panelist
              as_user_id: "${p_violin_1}"
              captures: { e_unauth_list: "$.data.error_id" }
            - call: "GET /members/${m1_id}"
              as: Panelist
              as_user_id: "${p_violin_1}"
              captures: { e_unauth_read: "$.data.error_id" }
            - call: "POST /placements"
              payload: { audition_id: "${a1_id}", ensemble_id: "${ens_id}", offer_kind: "OFFER", expected_ensemble_version: "${ens_v0}" }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { e_unauth_write: "$.data.error_id" }
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Impostor Program", excerpt_ids: ["EX1"] }
              as: Guardian
              as_user_id: "${m2_id}"
              captures: { e_owner_body: "$.data.error_id" }
            - call: "GET /auditions/${a1_id}"
              as: Guardian
              as_user_id: "${m2_id}"
              captures: { e_owner_read: "$.data.error_id" }
            - call: "POST /auditions/${a1_id}/panel-scores"
              payload: { panelist_id: "${p_violin_1}", tone_score: 20, rhythm_score: 20, intonation_score: 20, sight_reading_score: 20 }
              as: Panelist
              as_user_id: "${p_violin_2}"
              captures: { e_owner_panel: "$.data.error_id" }
            - call: "GET /members?limit=101"
              as: RegistrarStaff
              captures: { e_page_limit: "$.data.error_id" }
            - call: "GET /panelists?offset=-1"
              as: RegistrarStaff
              captures: { e_page_offset: "$.data.error_id" }
          assert:
            - "trigger[0] -> 401 with data.error_id == \"ERR_MISSING_AUTH_HEADERS\" (Treasurer is not one of the five declared roles)"
            - "trigger[1] -> 401 with data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "trigger[2] -> 403 with data.error_id == \"ERR_UNAUTHORIZED\" (Panelist is absent from GET /members roles)"
            - "trigger[3] -> 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "trigger[4] -> 403 with data.error_id == \"ERR_UNAUTHORIZED\" (Guardian may not create placements; the role band outranks every business rule this body also breaks)"
            - "trigger[5] -> 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" (body member_id is Ada, the acting Guardian is Ben)"
            - "trigger[6] -> 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" (Audition.member_id is Ada)"
            - "trigger[7] -> 403 with data.error_id == \"ERR_NOT_RESOURCE_OWNER\" (submitted panelist_id != acting X-User-ID)"
            - "trigger[8] -> 400 with data.error_id == \"ERR_INVALID_PAGINATION\" (limit above the declared max of 100)"
            - "trigger[9] -> 400 with data.error_id == \"ERR_INVALID_PAGINATION\" (offset below 0)"
            - "no row was created by trigger[4] or trigger[5]: GET /placements returns meta.total_count == 0 and GET /auditions?member_id=${m1_id} still returns exactly 1 row"

      - name: every_remaining_resource_family_reports_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SECTION_QUOTA_NOT_FOUND]
          - errors[ERR_PANELIST_NOT_FOUND]
          - errors[ERR_AUDITION_SLOT_NOT_FOUND]
          - errors[ERR_AUDITION_NOT_FOUND]
          - errors[ERR_PANEL_SCORE_NOT_FOUND]
          - errors[ERR_SEAT_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_TUITION_ACCOUNT_NOT_FOUND]
          - errors[ERR_PARTICIPATION_NOT_FOUND]
          - validations[priority 4]
          - validations[priority 6]
        distinguishing_aspect: |
          §1.6 declares one NOT_FOUND id per resource family and priority 4 resolves path
          ids left to right, so an unknown id must never collapse into a generic 404: each
          family answers with its own error_id, on read routes and on action routes alike.
          The panelist family is additionally reachable through priority 6 - an element of
          the panelist_ids ARRAY in a POST /audition-slots body that matches no Panelist -
          which proves body FKs are resolved with the same per-family vocabulary.
        test_recipe:
          setup:
            - "A Season exists (so the slot body's season_id resolves) and nothing else: no"
            - "quota, panelist, slot, audition, score, seat, account or participation row has"
            - "ever been created. 00000000-0000-4000-8000-000000000999 and ...888 are"
            - "well-formed ids that match nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
