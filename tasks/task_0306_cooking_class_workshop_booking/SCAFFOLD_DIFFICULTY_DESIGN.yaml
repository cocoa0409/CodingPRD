              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST15", event_type: "GROUP", start_at: "2026-10-09T08:00:00Z", end_at: "2026-10-09T10:00:00Z", planned_seats: 2 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "egg", qty_per_seat: 0.1, unit_cost_cents: 30 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_i}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_i}"
              captures: { bk_i: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_14: $.data.version }
            - call: "POST /culinary/bookings/${bk_i}/confirm"
              payload: { expected_session_version: "${occ_sv_14}" }
              as: Member
              as_user_id: "${mem_i}"
            - call: "GET /culinary/gift-cards/${gc_i}"
              payload: {}
              as: Member
              as_user_id: "${mem_i}"
              captures: { gc_bal_after_confirm: $.data.balance_cents }
          trigger:
            - call: "POST /culinary/bookings/${bk_i}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mem_i}"
          assert:
            - "GiftCard.${gc_i}.balance_cents == 0 after confirm (gc_bal_after_confirm)"
            - "GiftCard.${gc_i}.balance_cents == 8700 after cancel (gift-card portion reversed first)"
            - "Member.${mem_i}.wallet_credit_cents == 0 (entire refund returned to gift card, none spilled to wallet)"
            - "GiftCard.${gc_i}.balance_cents + Member.${mem_i}.wallet_credit_cents == 8700 (conserved minus the 300 fee)"
