          ENTITY PAIR (RetreadJob depends on Casing): two jobs sit in the SAME FAILED_CURE
          state, on the same line kind, with the same free slot available — yet one can be
          re-booked and the other never can, purely because CASING_FAILURE condemned its
          casing to REJECTED while CURE_DEFECT returned the other casing to INSPECTED. The
          job's own state is not sufficient information to decide the transition.
