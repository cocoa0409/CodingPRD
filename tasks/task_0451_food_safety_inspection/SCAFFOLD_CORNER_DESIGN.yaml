        distinguishing_aspect: "An inspection with one CRITICAL base 25 + one NON_CRITICAL base 20 (both uncorrected, critical_count 1) gives final_score 55 (<60), grade CLOSED, and the auto-created closure has reason_code GRADE_C_AUTOCLOSE (score cause, since criticals < 3)."
