        distinguishing_aspect: "Driver role calling a LeagueAdmin-exclusive endpoint gets ERR_FORBIDDEN (403) before existence/state checks."
        test_recipe:
          setup: ["driver exists and is ACTIVE"]
          setup_api_calls:
            - { call: "POST /karting/drivers", payload: { full_name: "D", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_d: $.data.id } }
