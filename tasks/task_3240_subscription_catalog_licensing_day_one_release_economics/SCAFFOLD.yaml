    roles: [CatalogAdmin, CatalogAnalyst, Subscriber]
    code: 200
    input: ["region_code?", "title_id?", "deal_id?", "status?", "limit?", "offset?"]
    output: "CatalogEntry[]"
    side_effects: []

  - method: POST
    path: "/catalog/catalog-entries/{entry_id}/publish"
    description: "Publish a planned entry into the catalog and resolve entitlements for eligible subscriptions"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: CatalogEntry
    side_effects:
      - "status becomes ADDED with actual_add_date set to the logical clock"
      - "removal_notice_days and subscriber_impact_count recomputed"
      - "one Entitlement row is resolved per eligible subscription in the entry's region and tiers, ACTIVE for PAID subscriptions and GRACE for FAILED ones"
      - "Title.status becomes RELEASED and Title.weighted_engagement_score recomputed"
      - "the region's capacity figures recomputed"

  - method: POST
    path: "/catalog/catalog-entries/{entry_id}/announce-removal"
    description: "Announce that an ADDED entry is leaving the catalog"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: CatalogEntry
    side_effects: ["status becomes REMOVING", "subscriber_impact_count recomputed", "removal notice published to subscribers"]

  - method: POST
    path: "/catalog/catalog-entries/{entry_id}/cancel-removal"
    description: "Revert an announced removal before the revert cutoff"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: CatalogEntry
    side_effects: ["status reverts to ADDED", "subscriber_impact_count recomputed"]

  - method: POST
    path: "/catalog/catalog-entries/{entry_id}/retire"
    description: "Retire an entry, cascading delisting across the title's North American entries and revoking entitlements"
    roles: [CatalogAdmin]
    code: 200
    input: []
    output: CatalogEntry
    side_effects:
      - "status becomes DELISTED"
      - "CASCADE C1 hop 2: every CatalogEntry of the same Title in region NA with status IN {ADDED, REMOVING} becomes DELISTED"
      - "CASCADE C1 hop 3: each delisted entry's entitlements are REVOKED unless the retention clause holds; retained rows keep ACTIVE with retained_until set"
      - "CASCADE C1 hop 3: CatalogEntry.subscriber_impact_count recomputed for every delisted entry"
      - "Title.status becomes RETIRED when the title has no entry left in status IN {ADDED, REMOVING}"
      - "Title.weighted_engagement_score recomputed"

