# =============================================================================
# Skate & Surf Shop — PRD Benchmark Scaffold (Expert)
# §1.0–§1.7 live in this file. §1.8 → SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 → SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: "Skate & Surf Shop: SKU & board build/setup, grip/wheel/wax service, lesson/rental linkage, team/sponsor & event, trade-in/consignment, loyalty, special order, inventory"

domain_name: skate-surf-shop
# Flat topology: every entity is a top-level collection at the API root; children
# link to parents by foreign key (no nested URL ownership). api_prefix is the
# empty root so all collections (/products, /customers, /rentals, …) sit directly
# under it and the FK reverse-reachability check resolves each collection segment.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation          # finite inventory reserved/committed/released
  secondary_archetype: temporal_windowing      # coach lessons + asset rentals over intervals
  complexity_layers:
    - optimistic_concurrency                    # OCC on SpecialOrder.version (revise supersede)
    - cascading_side_effects                    # Lesson→Rental→RentalAsset ; Event→EventEntry→Customer
    - dual_variant_calculation                  # TradeIn cash/credit ; BoardBuild provisional/final
    - derived_field_reconciliation              # Product.available_qty, Customer.tier/points

  entity_topology: flat
  state_machine_shape: parallel                 # Rental has parallel fulfillment×payment dims; SpecialOrder is cyclic
  relationship_patterns:
    - one_to_many                               # Customer→Rental/Build/Ticket/…, Event→EventEntry
    - cross_aggregate                           # Rental references Lesson & RentalAsset across aggregates
    - polymorphic                               # loyalty accrual fed by builds/tickets/rentals/orders/entries
  role_model: peer_roles                        # staff roles own distinct resource surfaces; Customer entity-backed
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Product
    parent: null
    common_fields: true      # id, created_at, updated_at, version
    fields:
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique across products" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: category, type: enum, source: input, description: "DECK | TRUCKS | WHEELS | GRIP | WAX | COMPLETE | SURFBOARD | WETSUIT | ACCESSORY", constraints: "one of the 9 category enum values" }
      - { name: unit_price_cents, type: integer, source: input, description: "Retail price in integer cents; >= 0" }
      - { name: rental_day_rate_cents, type: integer, source: input, default: 0, description: "Per-day rental rate in cents; used when is_rentable" }
      - { name: is_rentable, type: boolean, source: input, default: false, description: "Whether RentalAssets may be created against this product" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Units physically in stock; starts 0, changed by inventory-adjustments, build/ticket/order consumption" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units reserved by BoardBuilds in RESERVED status; never negative" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "Derived = on_hand_qty - reserved_qty (product_availability calc)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED", constraints: "ACTIVE at creation; DISCONTINUED via discontinue" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: loyalty_points, type: integer, source: computed, default: 0, description: "Running loyalty point balance; accrued on spend, reduced on redemption, reversed on compensating cancel; floor 0" }
      - { name: lifetime_spend_cents, type: integer, source: computed, default: 0, description: "Cumulative spend used for tier; only ever increases" }
      - { name: store_credit_cents, type: integer, source: computed, default: 0, description: "Store credit balance from trade-in/consignment payouts" }
      - { name: tier, type: enum, source: computed, default: BRONZE, description: "BRONZE | SILVER | GOLD derived from lifetime_spend_cents (loyalty_tier calc)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only value in this version)", constraints: "ACTIVE" }

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Instructor name" }
      - { name: discipline, type: enum, source: input, description: "SURF | SKATE — discipline this coach teaches" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE (only value in this version)", constraints: "ACTIVE" }

  - name: RentalAsset
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the rentable SKU this physical unit instantiates" }
      - { name: asset_tag, type: string, source: input, description: "Physical asset tag; unique across rental assets" }
      - { name: condition, type: enum, source: input, default: GOOD, description: "GOOD | FAIR | NEEDS_SERVICE" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | RESERVED | OUT — driven by Rental lifecycle", constraints: "AVAILABLE at creation" }

  - name: Lesson
    parent: null
    common_fields: true
    fields:
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; the instructing coach (scheduling resource)" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booked customer" }
      - { name: discipline, type: enum, source: input, description: "SURF | SKATE; must match coach.discipline" }
      - { name: start_at, type: datetime, source: input, description: "Lesson start (ISO 8601 UTC), half-open interval start" }
      - { name: end_at, type: datetime, source: input, description: "Lesson end (ISO 8601 UTC); must be > start_at" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW", constraints: "SCHEDULED at creation" }

  - name: Rental
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the renter" }
      - { name: rental_asset_id, type: string, source: input, description: "FK -> RentalAsset.id; the physical unit rented (scheduling resource)" }
      - { name: lesson_id, type: string, source: input, default: null, description: "FK -> Lesson.id; optional linked lesson (lesson/rental linkage). Null when standalone" }
      - { name: start_at, type: datetime, source: input, description: "Rental window start (ISO 8601 UTC), half-open" }
      - { name: end_at, type: datetime, source: input, description: "Rental window end (ISO 8601 UTC); must be > start_at" }
      - { name: deposit_cents, type: integer, source: input, description: "Security deposit held in cents; >= 0" }
      - { name: rental_fee_cents, type: integer, source: computed, default: 0, description: "rental_fee calc = ceil(window_days) * product.rental_day_rate_cents" }
      - { name: late_fee_cents, type: integer, source: computed, default: 0, description: "rental_late_fee calc; set on return; 0 when returned on/before end_at" }
      - { name: returned_at, type: datetime, source: system, default: null, description: "Clock time captured at return" }
      - { name: fulfillment_status, type: enum, source: system, default: RESERVED, description: "RESERVED | PICKED_UP | RETURNED | RELEASED (dimension 1)", constraints: "RESERVED at creation" }
      - { name: payment_status, type: enum, source: system, default: DEPOSIT_HELD, description: "DEPOSIT_HELD | DEPOSIT_CAPTURED | DEPOSIT_REFUNDED (dimension 2, evolves independently)", constraints: "DEPOSIT_HELD at creation" }

  - name: BoardBuild
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; who the build is for" }
      - { name: components, type: array, source: input, description: "Array of {product_id, qty} line items (each product_id references a Product; qty integer >= 1). Component inventory is reserved on reserve and consumed on complete" }
      - { name: provisional_cost_cents, type: integer, source: computed, default: 0, description: "board_build_cost provisional variant; set at reserve (no bundle discount)" }
      - { name: final_cost_cents, type: integer, source: computed, default: 0, description: "board_build_cost final variant; set at complete (per-line bundle discount, rounded per line)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | RESERVED | COMPLETED | CANCELLED", constraints: "DRAFT at creation" }

  - name: ServiceTicket
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the service customer" }
      - { name: board_description, type: string, source: input, description: "Free text describing the board serviced" }
      - { name: parts, type: array, source: input, description: "Array of {product_id, qty, unit_price_cents} part lines used in the service (grip/wheel/wax parts)" }
      - { name: labor_cents, type: integer, source: input, description: "Labor charge in cents before tax; >= 0" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "service_ticket_total calc; set at ready (per-line taxed rounding then sum)" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | READY | PICKED_UP | CANCELLED", constraints: "INTAKE at creation" }

  - name: TradeIn
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the consignor/seller" }
      - { name: item_description, type: string, source: input, description: "Description of the used gear" }
      - { name: mode, type: enum, source: input, description: "TRADE_IN | CONSIGNMENT — controls the accept branch", constraints: "TRADE_IN or CONSIGNMENT" }
      - { name: appraised_value_cents, type: integer, source: system, default: 0, description: "Set at appraise from the appraiser's input value; base for offers" }
      - { name: cash_offer_cents, type: integer, source: computed, default: 0, description: "tradein_offers cash variant = round_half_up(appraised_value_cents * CASH_RATE)" }
      - { name: store_credit_offer_cents, type: integer, source: computed, default: 0, description: "tradein_offers credit variant = round_half_up(appraised_value_cents * STORE_CREDIT_RATE)" }
      - { name: payout_choice, type: enum, source: input, default: null, description: "CASH | STORE_CREDIT chosen at accept (TRADE_IN mode only)" }
      - { name: list_price_cents, type: integer, source: input, default: 0, description: "Consignment listing price in cents (CONSIGNMENT mode)" }
      - { name: sold_price_cents, type: integer, source: system, default: 0, description: "Actual sale price captured at sell" }
      - { name: consignor_credit_cents, type: integer, source: computed, default: 0, description: "consignor_credit calc = round_half_up(sold_price_cents * CONSIGNMENT_RATE)" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | APPRAISED | ACCEPTED | REJECTED | LISTED | SOLD", constraints: "RECEIVED at creation" }

  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; ordering customer" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; the SKU being special-ordered" }
      - { name: quantity, type: integer, source: input, description: "Units requested; >= 1" }
      - { name: quoted_price_cents, type: integer, source: system, default: 0, description: "Total quoted price set at quote" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of revise rounds; incremented each revise" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | QUOTED | CUSTOMER_REVIEW | APPROVED | FULFILLED | CANCELLED", constraints: "DRAFT at creation" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: sponsor, type: string, source: input, description: "Sponsoring brand/team" }
      - { name: venue, type: string, source: input, description: "Venue name" }
      - { name: start_at, type: datetime, source: input, description: "Event start (ISO 8601 UTC)" }
      - { name: capacity, type: integer, source: input, description: "Maximum registered entries; >= 1" }
      - { name: entry_fee_cents, type: integer, source: input, description: "Per-entry fee in cents; >= 0; drives entry loyalty accrual" }
      - { name: entry_count, type: integer, source: computed, default: 0, description: "Count of REGISTERED entries; incremented on entry create, decremented on entry cancel" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | CANCELLED", constraints: "DRAFT at creation" }

  - name: EventEntry
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the event entered" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the participant" }
      - { name: role, type: enum, source: input, default: PUBLIC, description: "TEAM_RIDER | PUBLIC — team/sponsor participation flag" }
      - { name: points_awarded, type: integer, source: computed, default: 0, description: "Loyalty points accrued for this entry (loyalty_accrual, event bonus); reversed exactly on cancel" }
      - { name: status, type: enum, source: system, default: REGISTERED, description: "REGISTERED | CANCELLED", constraints: "REGISTERED at creation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Product
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /products/{id}/discontinue"
        actor: ShopManager
        preconditions:
          - "Product is ACTIVE (else ERR_PRODUCT_INVALID_STATE... reuse ERR_VALIDATION? use state error)"
        side_effects:
          - "status → DISCONTINUED; product remains queryable but is rejected as a build component (business_safety) and as a special-order target"

  - entity: RentalAsset
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (Rental created against this asset)"
        actor: system
        preconditions: ["No overlapping Rental occupies this asset for the requested window (asset_schedule_overlap)"]
        side_effects: ["asset held for the rental window"]
      - from: RESERVED
        to: OUT
        trigger: "system (linked Rental checked out)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OUT
        to: AVAILABLE
        trigger: "system (linked Rental returned)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (linked Rental released)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Lesson
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /lessons/{id}/complete (outcome=COMPLETED)"
        actor: SalesAssociate
        preconditions: ["Lesson is SCHEDULED (else ERR_LESSON_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /lessons/{id}/complete (outcome=NO_SHOW)"
        actor: SalesAssociate
        preconditions: ["Lesson is SCHEDULED (else ERR_LESSON_INVALID_STATE)"]
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lessons/{id}/cancel"
        actor: SalesAssociate
        preconditions: ["Lesson is SCHEDULED (else ERR_LESSON_INVALID_STATE)"]
        side_effects:
          - "CASCADE (hop 1→2): every linked Rental (rental.lesson_id == this lesson AND fulfillment_status == RESERVED) is released — Rental.fulfillment_status RESERVED → RELEASED"
          - "The Rental release (hop 2→3) itself sets Rental.payment_status DEPOSIT_HELD → DEPOSIT_REFUNDED and transitions its RentalAsset RESERVED → AVAILABLE"

  - entity: Rental
    field: "fulfillment_status × payment_status (parallel dimensions)"
    initial_state: RESERVED
    terminal_states: [RETURNED, RELEASED]
    transitions:
      - from: RESERVED
        to: PICKED_UP
        trigger: "POST /rentals/{id}/checkout"
        actor: SalesAssociate
        preconditions:
          - "Rental.fulfillment_status == RESERVED (else ERR_RENTAL_INVALID_STATE)"
          - "If lesson_id is set, the linked Lesson.status == SCHEDULED (else ERR_LESSON_NOT_SCHEDULED) — cross-entity Rental→Lesson"
        side_effects:
          - "fulfillment_status RESERVED → PICKED_UP (dimension 1); payment_status unchanged (DEPOSIT_HELD)"
          - "RentalAsset RESERVED → OUT"
      - from: PICKED_UP
        to: RETURNED
        trigger: "POST /rentals/{id}/return"
        actor: SalesAssociate
        preconditions: ["Rental.fulfillment_status == PICKED_UP (else ERR_RENTAL_INVALID_STATE)"]
        side_effects:
          - "returned_at = clock now; compute late_fee_cents (rental_late_fee calc)"
          - "fulfillment_status PICKED_UP → RETURNED (dimension 1)"
          - "payment_status → DEPOSIT_CAPTURED when late_fee_cents > 0, else DEPOSIT_REFUNDED (dimension 2, independent)"
          - "RentalAsset OUT → AVAILABLE"
          - "Customer.lifetime_spend_cents += rental_fee_cents + late_fee_cents; loyalty_accrual (is_event_bonus=false); recompute Customer.tier"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /rentals/{id}/release OR system (linked Lesson cancelled)"
        actor: SalesAssociate | system
        preconditions: ["Rental.fulfillment_status == RESERVED (else ERR_RENTAL_INVALID_STATE)"]
        side_effects:
          - "fulfillment_status RESERVED → RELEASED (dimension 1)"
          - "payment_status DEPOSIT_HELD → DEPOSIT_REFUNDED (dimension 2)"
          - "RentalAsset RESERVED → AVAILABLE"

  - entity: BoardBuild
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /board-builds/{id}/reserve"
        actor: BenchTech
        preconditions:
          - "BoardBuild is DRAFT (else ERR_BUILD_INVALID_STATE)"
          - "No component Product is DISCONTINUED (else ERR_COMPONENT_INCOMPATIBLE — business_safety)"
          - "For every component, Product.available_qty >= line qty (else ERR_INSUFFICIENT_STOCK — business_fiscal)"
        side_effects:
          - "provisional_cost_cents computed (board_build_cost provisional variant)"
          - "for each component: Product.reserved_qty += qty; Product.available_qty recomputed (product_availability)"
      - from: RESERVED
        to: COMPLETED
        trigger: "POST /board-builds/{id}/complete"
        actor: BenchTech
        preconditions: ["BoardBuild is RESERVED (else ERR_BUILD_INVALID_STATE)"]
        side_effects:
          - "final_cost_cents computed (board_build_cost final variant)"
          - "for each component: Product.reserved_qty -= qty; Product.on_hand_qty -= qty; Product.available_qty recomputed"
          - "Customer.lifetime_spend_cents += final_cost_cents; loyalty_accrual (is_event_bonus=false); recompute Customer.tier"
      - from: [DRAFT, RESERVED]
        to: CANCELLED
        trigger: "POST /board-builds/{id}/cancel"
        actor: BenchTech
        preconditions: ["BoardBuild is DRAFT or RESERVED (else ERR_BUILD_INVALID_STATE)"]
        side_effects:
          - "if was RESERVED: for each component Product.reserved_qty -= qty; Product.available_qty recomputed (compensating release — leaves on_hand_qty unchanged)"

  - entity: ServiceTicket
    field: status
    initial_state: INTAKE
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: INTAKE
        to: READY
        trigger: "POST /service-tickets/{id}/ready"
        actor: BenchTech
        preconditions: ["ServiceTicket is INTAKE (else ERR_SERVICE_INVALID_STATE)"]
        side_effects: ["total_cents computed (service_ticket_total calc)"]
      - from: READY
        to: PICKED_UP
        trigger: "POST /service-tickets/{id}/pickup"
        actor: BenchTech
        preconditions: ["ServiceTicket is READY (else ERR_SERVICE_INVALID_STATE)"]
        side_effects:
          - "Customer.lifetime_spend_cents += total_cents; loyalty_accrual (is_event_bonus=false); recompute Customer.tier"
      - from: [INTAKE, READY]
        to: CANCELLED
        trigger: "POST /service-tickets/{id}/cancel"
        actor: BenchTech
        preconditions: ["ServiceTicket is INTAKE or READY (else ERR_SERVICE_INVALID_STATE)"]
        side_effects: []

  - entity: TradeIn
    field: status
    initial_state: RECEIVED
    terminal_states: [REJECTED, SOLD]
    transitions:
      - from: RECEIVED
        to: APPRAISED
        trigger: "POST /trade-ins/{id}/appraise"
        actor: ShopManager
        preconditions: ["TradeIn is RECEIVED (else ERR_TRADE_IN_INVALID_STATE)"]
        side_effects:
          - "appraised_value_cents set from input; cash_offer_cents & store_credit_offer_cents computed (tradein_offers)"
      - from: APPRAISED
        to: ACCEPTED
        trigger: "POST /trade-ins/{id}/accept (mode == TRADE_IN branch)"
        actor: Customer
        preconditions:
          - "TradeIn is APPRAISED (else ERR_TRADE_IN_INVALID_STATE)"
          - "mode == TRADE_IN; payout_choice provided (CASH or STORE_CREDIT)"
        side_effects:
          - "if payout_choice == STORE_CREDIT: Customer.store_credit_cents += store_credit_offer_cents (CASH pays out externally, no credit)"
      - from: APPRAISED
        to: LISTED
        trigger: "POST /trade-ins/{id}/accept (mode == CONSIGNMENT branch)"
        actor: Customer
        preconditions:
          - "TradeIn is APPRAISED (else ERR_TRADE_IN_INVALID_STATE)"
          - "mode == CONSIGNMENT; list_price_cents > 0"
        side_effects: ["item is listed for consignment sale at list_price_cents"]
      - from: APPRAISED
        to: REJECTED
        trigger: "POST /trade-ins/{id}/reject"
        actor: Customer
        preconditions: ["TradeIn is APPRAISED (else ERR_TRADE_IN_INVALID_STATE)"]
        side_effects: ["offer declined; no payout"]
      - from: LISTED
        to: SOLD
        trigger: "POST /trade-ins/{id}/sell"
        actor: ShopManager
        preconditions: ["TradeIn is LISTED (else ERR_TRADE_IN_INVALID_STATE)"]
        side_effects:
          - "sold_price_cents set from input; consignor_credit_cents computed (consignor_credit)"
          - "Customer.store_credit_cents += consignor_credit_cents"

  - entity: SpecialOrder
    field: status
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: [DRAFT, CUSTOMER_REVIEW]
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: ShopManager
        preconditions: ["SpecialOrder is DRAFT or CUSTOMER_REVIEW (else ERR_ORDER_INVALID_STATE)"]
        side_effects:
          - "quoted_price_cents set from input; version increments by 1"
      - from: QUOTED
        to: CUSTOMER_REVIEW
        trigger: "POST /special-orders/{id}/revise"
        actor: SalesAssociate
        preconditions:
          - "SpecialOrder is QUOTED (else ERR_ORDER_INVALID_STATE)"
          - "expected_special_order_version matches current version (else ERR_STALE_VERSION — OCC)"
        side_effects:
          - "revision_count += 1; increments SpecialOrder.version by 1 (cycle back to QUOTED via a new quote)"
      - from: QUOTED
        to: APPROVED
        trigger: "POST /special-orders/{id}/approve"
        actor: Customer
        preconditions: ["SpecialOrder is QUOTED (else ERR_ORDER_INVALID_STATE)"]
        side_effects: []
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /special-orders/{id}/fulfill"
        actor: ShopManager
        preconditions:
          - "SpecialOrder is APPROVED (else ERR_ORDER_INVALID_STATE)"
          - "Product.available_qty >= quantity (else ERR_INSUFFICIENT_STOCK — business_fiscal)"
        side_effects:
          - "Product.on_hand_qty -= quantity; Product.available_qty recomputed"
          - "Customer.lifetime_spend_cents += quoted_price_cents; loyalty_accrual (is_event_bonus=false); recompute Customer.tier"
      - from: [DRAFT, QUOTED, CUSTOMER_REVIEW, APPROVED]
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: SalesAssociate
        preconditions: ["SpecialOrder is not terminal (else ERR_ORDER_INVALID_STATE)"]
        side_effects: []

  - entity: Event
    field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /events/{id}/publish"
        actor: ShopManager
        preconditions: ["Event is DRAFT (else ERR_EVENT_INVALID_STATE)"]
        side_effects: ["entries may now be created against this event"]
      - from: [DRAFT, PUBLISHED]
        to: CANCELLED
        trigger: "POST /events/{id}/cancel"
        actor: ShopManager
        preconditions: ["Event is DRAFT or PUBLISHED (else ERR_EVENT_INVALID_STATE)"]
        side_effects:
          - "CASCADE (hop 1→2): every REGISTERED EventEntry for this event → CANCELLED"
          - "each entry cancel (hop 2→3) reverses its points_awarded from Customer.loyalty_points and decrements Event.entry_count"

  - entity: EventEntry
    field: status
    initial_state: REGISTERED
    terminal_states: [CANCELLED]
    transitions:
      - from: (none)
        to: REGISTERED
        trigger: "POST /event-entries"
        actor: Customer
        preconditions:
          - "Event.status == PUBLISHED (else ERR_EVENT_NOT_OPEN — cross-entity EventEntry→Event)"
          - "Event.entry_count < Event.capacity (else ERR_EVENT_FULL)"
        side_effects:
          - "Event.entry_count += 1"
          - "points_awarded = loyalty_accrual(entry_fee_cents, customer.tier, is_event_bonus=true); Customer.loyalty_points += points_awarded"
          - "Customer.lifetime_spend_cents += entry_fee_cents; recompute Customer.tier"
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /event-entries/{id}/cancel OR system (parent Event cancelled)"
        actor: Customer | system
        preconditions: ["EventEntry is REGISTERED (else ERR_ENTRY_INVALID_STATE)"]
        side_effects:
          - "Event.entry_count -= 1"
          - "Customer.loyalty_points -= points_awarded (compensating reversal; exact, restores pre-entry balance)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: revise-supersede-stale-order
    parent_entity: SpecialOrder
    write_endpoint: "POST /special-orders/{id}/revise"
    occ_field: "expected_special_order_version"
    description: |
      Submitting a revise against a SpecialOrder whose version has advanced
      since the client last observed it is rejected. A revise opens a new
      negotiation round that supersedes the prior quote; if another writer has
      already re-quoted or revised the order (advancing its version) the
      current writer's view is stale and the revise is refused. Resolved by
      comparing expected_special_order_version to the live version — no timing
      assumptions.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: product_availability
    trigger: "any change to on_hand_qty or reserved_qty (build reserve/complete/cancel, order fulfill, inventory-adjustments)"
    algorithm: aggregation
    formula: |
      available_qty = on_hand_qty - reserved_qty
    precision: "integer units"
    note: "Derived-field reconciliation; recomputed on every mutation of its inputs. Never negative under valid transitions."

  - name: loyalty_accrual
    trigger: "BoardBuild complete, ServiceTicket pickup, Rental return, SpecialOrder fulfill, EventEntry create, loyalty-adjustments(kind=EARN)"
    algorithm: tiered_pricing
    formula: |
      # >= 3 inputs (amount, tier snapshot, event flag) with tiered selection + conditional multiplier
      base_points = floor(amount_cents / 100)                 # 1 base point per whole dollar
      tier_mult   = TIER_MULTIPLIER[tier_at_time]             # tier snapshot BEFORE this txn's spend is applied
      event_mult  = EVENT_MULTIPLIER if is_event_bonus else 1.0
      earned      = floor(base_points * tier_mult * event_mult)   # single floor at the very end
      Customer.loyalty_points += earned
    input_set: "amount_cents = the transaction total for this event; tier_at_time = Customer.tier evaluated on lifetime_spend_cents BEFORE adding amount_cents"
    constants:
      TIER_MULTIPLIER: { BRONZE: 1.0, SILVER: 1.25, GOLD: 1.5 }
      EVENT_MULTIPLIER: 2.0
    precision: "integer points; floor once at the end (never per-factor)"

  - name: loyalty_tier
    trigger: "after any increment to lifetime_spend_cents"
    algorithm: threshold
    formula: |
      if   lifetime_spend_cents >= GOLD_THRESHOLD_CENTS:   tier = GOLD     # boundary is inclusive (>=)
      elif lifetime_spend_cents >= SILVER_THRESHOLD_CENTS: tier = SILVER   # inclusive (>=)
      else:                                                tier = BRONZE
    constants:
      SILVER_THRESHOLD_CENTS: 50000
      GOLD_THRESHOLD_CENTS: 100000
    precision: "exact integer comparison; >= boundaries"

  - name: tradein_offers
    trigger: "TradeIn appraise"
    algorithm: dual_variant
    formula: |
      cash_offer_cents         = round_half_up(appraised_value_cents * CASH_RATE)
      store_credit_offer_cents = round_half_up(appraised_value_cents * STORE_CREDIT_RATE)
    constants:
      CASH_RATE: 0.50
      STORE_CREDIT_RATE: 0.70
    precision: "integer cents, round_half_up"
    variants:
      - { name: cash, when: "customer chooses CASH payout on accept", difference: "pays 50% of appraised value in cash (no store credit)" }
      - { name: store_credit, when: "customer chooses STORE_CREDIT payout on accept", difference: "grants 70% of appraised value as store credit — a strictly higher figure for identical appraised input" }

  - name: consignor_credit
    trigger: "TradeIn sell (CONSIGNMENT)"
    algorithm: aggregation
    formula: |
      consignor_credit_cents = round_half_up(sold_price_cents * CONSIGNMENT_RATE)
    constants:
      CONSIGNMENT_RATE: 0.60
    precision: "integer cents, round_half_up"

  - name: board_build_cost
    trigger: "BoardBuild reserve (provisional) and BoardBuild complete (final)"
    algorithm: tiered_pricing
    formula: |
      # provisional variant (at reserve): no discount, summed then labor added
      provisional_cost_cents = ( sum over components of (product.unit_price_cents * qty) ) + BUILD_LABOR_CENTS
      # final variant (at complete): per-line bundle discount, ROUND PER LINE, then sum, then add labor
      # pinned order: round_half_up EACH component line AFTER applying (1 - BUILD_BUNDLE_DISCOUNT), THEN sum, THEN add labor (labor untaxed/undiscounted)
      final_cost_cents = ( sum over components of round_half_up(product.unit_price_cents * qty * (1 - BUILD_BUNDLE_DISCOUNT)) ) + BUILD_LABOR_CENTS
    input_set: "components = the build's line items; product.unit_price_cents read at the moment of the transition"
    constants:
      BUILD_LABOR_CENTS: 2500
      BUILD_BUNDLE_DISCOUNT: 0.10
    precision: "integer cents; final variant rounds per component line (round_half_up) BEFORE summing"
    variants:
      - { name: provisional, when: "computed at reserve", difference: "list-price sum + labor, no bundle discount" }
      - { name: final, when: "computed at complete", difference: "10% per-line bundle discount rounded per line then summed + labor; differs from provisional for identical components" }

  - name: service_ticket_total
    trigger: "ServiceTicket ready"
    algorithm: aggregation
    formula: |
      # nested rounding — pinned: apply tax and round_half_up PER LINE, then sum lines, then add the taxed labor line
      part_lines_total = sum over parts of round_half_up(unit_price_cents * qty * (1 + TAX_RATE))
      labor_line       = round_half_up(labor_cents * (1 + TAX_RATE))
      total_cents      = part_lines_total + labor_line
      # NOT round_half_up((sum of raw part subtotals + labor) * (1 + TAX_RATE)) — the per-line order is authoritative
    constants:
      TAX_RATE: 0.0725
    precision: "integer cents; round_half_up applied per line BEFORE summing (order pinned)"

  - name: rental_fee
    trigger: "Rental create"
    algorithm: aggregation
    formula: |
      window_days   = ceil((end_at - start_at) / 86400 seconds)    # partial day counts as a full day
      rental_fee_cents = window_days * product.rental_day_rate_cents
    precision: "integer cents; ceil on day count"

  - name: rental_late_fee
    trigger: "Rental return"
    algorithm: threshold
    formula: |
      if returned_at (clock now) <= end_at: late_fee_cents = 0
      else:
        late_days      = ceil((returned_at - end_at) / 86400 seconds)   # any lateness rounds up to a full day
        late_fee_cents = late_days * LATE_FEE_PER_DAY_CENTS
    constants:
      LATE_FEE_PER_DAY_CENTS: 1000
    precision: "integer cents; boundary returned_at == end_at yields 0 (on-time, inclusive)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and valid", error_id: ERR_MISSING_AUTH_CONTEXT, http_status: 401, applies_to: all }
  - { priority: 2, category: auth, check: "Role permitted for this operation per §1.7", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: all }
  - { priority: 3, category: existence, check: "Path/body-referenced resources exist, validated left-to-right (path id before body FKs)", error_id: "ERR_*_NOT_FOUND (per entity)", http_status: 404, applies_to: all }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, types/enums valid, end_at > start_at, qty/amount ranges", error_id: ERR_VALIDATION, http_status: 400, applies_to: all writes }
  - { priority: 5, category: state, check: "Target resource in a state that permits the requested transition", error_id: "ERR_*_INVALID_STATE (per entity)", http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 6, category: business_safety, check: "No BoardBuild component Product is DISCONTINUED", error_id: ERR_COMPONENT_INCOMPATIBLE, http_status: 422, applies_to: "POST /board-builds/{id}/reserve" }
  - { priority: 7, category: business_referential, check: "Uniqueness: Product.sku, RentalAsset.asset_tag unique", error_id: "ERR_DUPLICATE_SKU | ERR_DUPLICATE_ASSET_TAG", http_status: 409, applies_to: "POST /products, POST /rental-assets" }
  - { priority: 8, category: business_temporal, check: "Coach schedule: new lesson must not overlap an existing SCHEDULED lesson on the same coach, and must be separated by SETUP_BUFFER_MINUTES (=15); half-open [start,end); reject if new.start_at < existing.end_at + buffer AND intervals collide", error_id: ERR_COACH_UNAVAILABLE, http_status: 409, applies_to: "POST /lessons" }
  - { priority: 9, category: business_temporal, check: "Asset schedule: new rental must not overlap an existing non-terminal (RESERVED/PICKED_UP) rental on the same asset; half-open [start,end) with adjacency allowed (new.start_at == existing.end_at is OK, no buffer)", error_id: ERR_ASSET_UNAVAILABLE, http_status: 409, applies_to: "POST /rentals" }
  - { priority: 10, category: business_constraint, check: "Rental checkout cross-entity: if lesson_id set, linked Lesson.status == SCHEDULED", error_id: ERR_LESSON_NOT_SCHEDULED, http_status: 409, applies_to: "POST /rentals/{id}/checkout" }
  - { priority: 11, category: business_constraint, check: "EventEntry cross-entity: Event.status == PUBLISHED", error_id: ERR_EVENT_NOT_OPEN, http_status: 409, applies_to: "POST /event-entries" }
  - { priority: 12, category: business_constraint, check: "Event capacity: entry_count < capacity", error_id: ERR_EVENT_FULL, http_status: 409, applies_to: "POST /event-entries" }
  - { priority: 13, category: business_fiscal, check: "Sufficient stock: for build reserve every component available_qty >= qty; for order fulfill available_qty >= quantity", error_id: ERR_INSUFFICIENT_STOCK, http_status: 402, applies_to: "POST /board-builds/{id}/reserve, POST /special-orders/{id}/fulfill" }
  - { priority: 14, category: business_fiscal, check: "Sufficient loyalty points for redemption", error_id: ERR_INSUFFICIENT_POINTS, http_status: 402, applies_to: "POST /customers/{id}/loyalty-adjustments (kind=REDEEM)" }
  - { priority: 15, category: state, check: "OCC: expected_special_order_version matches live SpecialOrder.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /special-orders/{id}/revise" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Product ----
  - { method: POST, path: "/products", description: "Create a product/SKU", roles: [ShopManager], code: 201, input: [sku, name, category, unit_price_cents, "rental_day_rate_cents?", "is_rentable?"], output: Product, side_effects: ["status=ACTIVE; on_hand_qty=0; reserved_qty=0; available_qty=0"] }
  - { method: GET, path: "/products", description: "List products", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["limit?", "offset?"], output: "Product[]", side_effects: [] }
  - { method: GET, path: "/products/{id}", description: "Get a product", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: Product, side_effects: [] }
  - { method: POST, path: "/products/{id}/inventory-adjustments", description: "Adjust on-hand stock (receive/shrink)", roles: [ShopManager], code: 200, input: [delta_on_hand], output: Product, side_effects: ["on_hand_qty += delta_on_hand; recompute available_qty"] }
  - { method: POST, path: "/products/{id}/discontinue", description: "Discontinue a product", roles: [ShopManager], code: 200, input: [], output: Product, side_effects: ["status ACTIVE → DISCONTINUED"] }

  # ---- Customer ----
  - { method: POST, path: "/customers", description: "Create a loyalty customer", roles: [ShopManager, SalesAssociate], code: 201, input: [email, full_name], output: Customer, side_effects: ["loyalty_points=0; lifetime_spend_cents=0; store_credit_cents=0; tier=BRONZE; status=ACTIVE"] }
  - { method: GET, path: "/customers", description: "List customers", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/customers/{id}", description: "Get a customer", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/customers/{id}/loyalty-adjustments", description: "Accrue points on recorded spend (EARN) or redeem points (REDEEM)", roles: [ShopManager, SalesAssociate], code: 200, input: [kind, "spend_cents?", "points?"], output: Customer, side_effects: ["EARN: lifetime_spend_cents += spend_cents; loyalty_accrual (is_event_bonus=false); recompute tier", "REDEEM: loyalty_points -= points (>= 0 required)"] }

  # ---- Coach ----
  - { method: POST, path: "/coaches", description: "Create a coach", roles: [ShopManager], code: 201, input: [name, discipline], output: Coach, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/coaches", description: "List coaches", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["limit?", "offset?"], output: "Coach[]", side_effects: [] }
  - { method: GET, path: "/coaches/{id}", description: "Get a coach", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: Coach, side_effects: [] }

  # ---- RentalAsset ----
  - { method: POST, path: "/rental-assets", description: "Create a physical rental unit for a rentable product", roles: [ShopManager], code: 201, input: [product_id, asset_tag, "condition?"], output: RentalAsset, side_effects: ["status=AVAILABLE"] }
  - { method: GET, path: "/rental-assets", description: "List rental assets (filter by product_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["product_id?", "limit?", "offset?"], output: "RentalAsset[]", side_effects: [] }
  - { method: GET, path: "/rental-assets/{id}", description: "Get a rental asset", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: RentalAsset, side_effects: [] }

  # ---- Lesson ----
  - { method: POST, path: "/lessons", description: "Book a lesson on a coach", roles: [SalesAssociate, ShopManager], code: 201, input: [coach_id, customer_id, discipline, start_at, end_at], output: Lesson, side_effects: ["status=SCHEDULED; coach overlap+buffer validated (asset? no — coach_schedule)"] }
  - { method: GET, path: "/lessons", description: "List lessons (filter by coach_id, customer_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["coach_id?", "customer_id?", "limit?", "offset?"], output: "Lesson[]", side_effects: [] }
  - { method: GET, path: "/lessons/{id}", description: "Get a lesson", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: Lesson, side_effects: [] }
  - { method: POST, path: "/lessons/{id}/complete", description: "Complete or mark no-show", roles: [SalesAssociate, ShopManager], code: 200, input: ["outcome?"], output: Lesson, side_effects: ["status → COMPLETED (default) or NO_SHOW"] }
  - { method: POST, path: "/lessons/{id}/cancel", description: "Cancel a scheduled lesson", roles: [SalesAssociate, ShopManager], code: 200, input: [], output: Lesson, side_effects: ["status → CANCELLED; cascade release linked RESERVED Rentals (Lesson→Rental→RentalAsset)"] }

  # ---- Rental ----
  - { method: POST, path: "/rentals", description: "Reserve a rental asset for a window (optionally linked to a lesson)", roles: [SalesAssociate, ShopManager], code: 201, input: [customer_id, rental_asset_id, "lesson_id?", start_at, end_at, deposit_cents], output: Rental, side_effects: ["fulfillment_status=RESERVED; payment_status=DEPOSIT_HELD; rental_fee computed; RentalAsset AVAILABLE→RESERVED; asset overlap validated"] }
  - { method: GET, path: "/rentals", description: "List rentals (filter by customer_id, rental_asset_id, lesson_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["customer_id?", "rental_asset_id?", "lesson_id?", "limit?", "offset?"], output: "Rental[]", side_effects: [] }
  - { method: GET, path: "/rentals/{id}", description: "Get a rental", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: Rental, side_effects: [] }
  - { method: POST, path: "/rentals/{id}/checkout", description: "Pick up a reserved rental", roles: [SalesAssociate, ShopManager], code: 200, input: [], output: Rental, side_effects: ["fulfillment RESERVED→PICKED_UP; RentalAsset RESERVED→OUT; requires linked Lesson SCHEDULED if lesson_id set"] }
  - { method: POST, path: "/rentals/{id}/return", description: "Return a picked-up rental", roles: [SalesAssociate, ShopManager], code: 200, input: [], output: Rental, side_effects: ["fulfillment PICKED_UP→RETURNED; late_fee computed; payment→DEPOSIT_CAPTURED if late_fee>0 else DEPOSIT_REFUNDED; RentalAsset OUT→AVAILABLE; loyalty accrual on rental_fee+late_fee"] }
  - { method: POST, path: "/rentals/{id}/release", description: "Release a still-reserved rental", roles: [SalesAssociate, ShopManager], code: 200, input: [], output: Rental, side_effects: ["fulfillment RESERVED→RELEASED; payment DEPOSIT_HELD→DEPOSIT_REFUNDED; RentalAsset RESERVED→AVAILABLE"] }

  # ---- BoardBuild ----
  - { method: POST, path: "/board-builds", description: "Create a draft board build with components", roles: [BenchTech, ShopManager], code: 201, input: [customer_id, components], output: BoardBuild, side_effects: ["status=DRAFT; costs 0"] }
  - { method: GET, path: "/board-builds", description: "List board builds (filter by customer_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "BoardBuild[]", side_effects: [] }
  - { method: GET, path: "/board-builds/{id}", description: "Get a board build", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: BoardBuild, side_effects: [] }
  - { method: POST, path: "/board-builds/{id}/reserve", description: "Reserve component stock and price provisionally", roles: [BenchTech, ShopManager], code: 200, input: [], output: BoardBuild, side_effects: ["status DRAFT→RESERVED; provisional_cost_cents computed; Product.reserved_qty += qty per component; available recomputed; component-DISCONTINUED and stock checks"] }
  - { method: POST, path: "/board-builds/{id}/complete", description: "Complete build, consume stock, finalize price", roles: [BenchTech, ShopManager], code: 200, input: [], output: BoardBuild, side_effects: ["status RESERVED→COMPLETED; final_cost_cents computed; Product.on_hand_qty-=qty & reserved_qty-=qty; loyalty accrual on final_cost_cents"] }
  - { method: POST, path: "/board-builds/{id}/cancel", description: "Cancel a build (release any reservation)", roles: [BenchTech, ShopManager], code: 200, input: [], output: BoardBuild, side_effects: ["status → CANCELLED; if was RESERVED release reserved_qty (compensating; on_hand unchanged)"] }

  # ---- ServiceTicket ----
  - { method: POST, path: "/service-tickets", description: "Open a grip/wheel/wax service ticket", roles: [BenchTech, ShopManager], code: 201, input: [customer_id, board_description, parts, labor_cents], output: ServiceTicket, side_effects: ["status=INTAKE"] }
  - { method: GET, path: "/service-tickets", description: "List service tickets (filter by customer_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "ServiceTicket[]", side_effects: [] }
  - { method: GET, path: "/service-tickets/{id}", description: "Get a service ticket", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: ServiceTicket, side_effects: [] }
  - { method: POST, path: "/service-tickets/{id}/ready", description: "Mark service ready (compute total)", roles: [BenchTech, ShopManager], code: 200, input: [], output: ServiceTicket, side_effects: ["status INTAKE→READY; total_cents computed (service_ticket_total)"] }
  - { method: POST, path: "/service-tickets/{id}/pickup", description: "Customer picks up (record spend)", roles: [BenchTech, ShopManager], code: 200, input: [], output: ServiceTicket, side_effects: ["status READY→PICKED_UP; loyalty accrual on total_cents"] }
  - { method: POST, path: "/service-tickets/{id}/cancel", description: "Cancel a service ticket", roles: [BenchTech, ShopManager], code: 200, input: [], output: ServiceTicket, side_effects: ["status → CANCELLED"] }

  # ---- TradeIn ----
  - { method: POST, path: "/trade-ins", description: "Intake a trade-in or consignment item", roles: [SalesAssociate, ShopManager, Customer], code: 201, input: [customer_id, item_description, mode, "list_price_cents?"], output: TradeIn, side_effects: ["status=RECEIVED"] }
  - { method: GET, path: "/trade-ins", description: "List trade-ins (filter by customer_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["customer_id?", "limit?", "offset?"], output: "TradeIn[]", side_effects: [] }
  - { method: GET, path: "/trade-ins/{id}", description: "Get a trade-in", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: TradeIn, side_effects: [] }
  - { method: POST, path: "/trade-ins/{id}/appraise", description: "Set appraised value and compute offers", roles: [ShopManager], code: 200, input: [appraised_value_cents], output: TradeIn, side_effects: ["status RECEIVED→APPRAISED; cash_offer_cents & store_credit_offer_cents computed (tradein_offers)"] }
  - { method: POST, path: "/trade-ins/{id}/accept", description: "Accept offer (TRADE_IN→ACCEPTED with payout, or CONSIGNMENT→LISTED)", roles: [Customer, SalesAssociate, ShopManager], code: 200, input: ["payout_choice?"], output: TradeIn, side_effects: ["TRADE_IN: → ACCEPTED, STORE_CREDIT payout adds store_credit_offer_cents to Customer.store_credit_cents", "CONSIGNMENT: → LISTED"] }
  - { method: POST, path: "/trade-ins/{id}/reject", description: "Reject the appraisal offer", roles: [Customer, SalesAssociate, ShopManager], code: 200, input: [], output: TradeIn, side_effects: ["status APPRAISED→REJECTED"] }
  - { method: POST, path: "/trade-ins/{id}/sell", description: "Record a consignment sale", roles: [ShopManager], code: 200, input: [sold_price_cents], output: TradeIn, side_effects: ["status LISTED→SOLD; consignor_credit_cents computed; Customer.store_credit_cents += consignor_credit_cents"] }

  # ---- SpecialOrder ----
  - { method: POST, path: "/special-orders", description: "Open a special order for a SKU", roles: [SalesAssociate, ShopManager, Customer], code: 201, input: [customer_id, product_id, quantity], output: SpecialOrder, side_effects: ["status=DRAFT; quoted_price_cents=0; revision_count=0"] }
  - { method: GET, path: "/special-orders", description: "List special orders (filter by customer_id, product_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["customer_id?", "product_id?", "limit?", "offset?"], output: "SpecialOrder[]", side_effects: [] }
  - { method: GET, path: "/special-orders/{id}", description: "Get a special order", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: SpecialOrder, side_effects: [] }
  - { method: POST, path: "/special-orders/{id}/quote", description: "Quote (or re-quote) the order price", roles: [ShopManager], code: 200, input: [quoted_price_cents], output: SpecialOrder, side_effects: ["status DRAFT|CUSTOMER_REVIEW → QUOTED; quoted_price_cents set; version += 1"] }
  - { method: POST, path: "/special-orders/{id}/revise", description: "Open a revision round (OCC-guarded)", roles: [SalesAssociate, ShopManager], code: 200, input: [expected_special_order_version], output: SpecialOrder, side_effects: ["status QUOTED→CUSTOMER_REVIEW; revision_count += 1; version += 1"] }
  - { method: POST, path: "/special-orders/{id}/approve", description: "Customer approves the current quote", roles: [Customer, SalesAssociate, ShopManager], code: 200, input: [], output: SpecialOrder, side_effects: ["status QUOTED→APPROVED"] }
  - { method: POST, path: "/special-orders/{id}/fulfill", description: "Fulfill from stock", roles: [ShopManager], code: 200, input: [], output: SpecialOrder, side_effects: ["status APPROVED→FULFILLED; Product.on_hand_qty -= quantity; loyalty accrual on quoted_price_cents; stock check"] }
  - { method: POST, path: "/special-orders/{id}/cancel", description: "Cancel a non-terminal special order", roles: [SalesAssociate, ShopManager, Customer], code: 200, input: [], output: SpecialOrder, side_effects: ["status → CANCELLED"] }

  # ---- Event ----
  - { method: POST, path: "/events", description: "Create a sponsor/team event", roles: [ShopManager], code: 201, input: [name, sponsor, venue, start_at, capacity, entry_fee_cents], output: Event, side_effects: ["status=DRAFT; entry_count=0"] }
  - { method: GET, path: "/events", description: "List events", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["limit?", "offset?"], output: "Event[]", side_effects: [] }
  - { method: GET, path: "/events/{id}", description: "Get an event", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: Event, side_effects: [] }
  - { method: POST, path: "/events/{id}/publish", description: "Publish an event (opens entries)", roles: [ShopManager], code: 200, input: [], output: Event, side_effects: ["status DRAFT→PUBLISHED"] }
  - { method: POST, path: "/events/{id}/cancel", description: "Cancel an event (cascade cancel entries)", roles: [ShopManager], code: 200, input: [], output: Event, side_effects: ["status → CANCELLED; cascade cancel REGISTERED entries; reverse loyalty per entry (Event→EventEntry→Customer)"] }

  # ---- EventEntry ----
  - { method: POST, path: "/event-entries", description: "Register a customer (team rider or public) for a published event", roles: [Customer, SalesAssociate, ShopManager], code: 201, input: [event_id, customer_id, "role?"], output: EventEntry, side_effects: ["status=REGISTERED; Event.entry_count += 1; points_awarded accrued (event bonus); Customer.loyalty_points/lifetime_spend/tier updated"] }
  - { method: GET, path: "/event-entries", description: "List entries (filter by event_id, customer_id)", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: ["event_id?", "customer_id?", "limit?", "offset?"], output: "EventEntry[]", side_effects: [] }
  - { method: GET, path: "/event-entries/{id}", description: "Get an entry", roles: [ShopManager, BenchTech, SalesAssociate, Customer], code: 200, input: [], output: EventEntry, side_effects: [] }
  - { method: POST, path: "/event-entries/{id}/cancel", description: "Cancel an entry (reverse loyalty accrual)", roles: [Customer, SalesAssociate, ShopManager], code: 200, input: [], output: EventEntry, side_effects: ["status REGISTERED→CANCELLED; Event.entry_count -= 1; reverse points_awarded from Customer.loyalty_points"] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default (never real wall-clock).", roles: [ShopManager], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock set to to_iso8601; governs rental_late_fee returned_at"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type/enum, or end_at <= start_at, or non-positive qty/amount" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Referenced Product does not exist" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced Customer does not exist" }
  - { id: ERR_COACH_NOT_FOUND, http: 404, condition: "Referenced Coach does not exist" }
  - { id: ERR_RENTAL_ASSET_NOT_FOUND, http: 404, condition: "Referenced RentalAsset does not exist" }
  - { id: ERR_LESSON_NOT_FOUND, http: 404, condition: "Referenced Lesson does not exist" }
  - { id: ERR_RENTAL_NOT_FOUND, http: 404, condition: "Referenced Rental does not exist" }
  - { id: ERR_BOARD_BUILD_NOT_FOUND, http: 404, condition: "Referenced BoardBuild does not exist" }
  - { id: ERR_SERVICE_TICKET_NOT_FOUND, http: 404, condition: "Referenced ServiceTicket does not exist" }
  - { id: ERR_TRADE_IN_NOT_FOUND, http: 404, condition: "Referenced TradeIn does not exist" }
  - { id: ERR_SPECIAL_ORDER_NOT_FOUND, http: 404, condition: "Referenced SpecialOrder does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Referenced Event does not exist" }
  - { id: ERR_EVENT_ENTRY_NOT_FOUND, http: 404, condition: "Referenced EventEntry does not exist" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Product.sku already exists" }
  - { id: ERR_DUPLICATE_ASSET_TAG, http: 409, condition: "RentalAsset.asset_tag already exists" }
  - { id: ERR_LESSON_INVALID_STATE, http: 409, condition: "Lesson not in a state permitting the transition" }
  - { id: ERR_RENTAL_INVALID_STATE, http: 409, condition: "Rental fulfillment_status not in a state permitting the transition" }
  - { id: ERR_BUILD_INVALID_STATE, http: 409, condition: "BoardBuild not in a state permitting the transition" }
  - { id: ERR_SERVICE_INVALID_STATE, http: 409, condition: "ServiceTicket not in a state permitting the transition" }
  - { id: ERR_TRADE_IN_INVALID_STATE, http: 409, condition: "TradeIn not in a state permitting the transition" }
  - { id: ERR_ORDER_INVALID_STATE, http: 409, condition: "SpecialOrder not in a state permitting the transition" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "Event not in a state permitting the transition" }
  - { id: ERR_ENTRY_INVALID_STATE, http: 409, condition: "EventEntry not in a state permitting the transition" }
  - { id: ERR_COMPONENT_INCOMPATIBLE, http: 422, condition: "A BoardBuild component Product is DISCONTINUED" }
  - { id: ERR_COACH_UNAVAILABLE, http: 409, condition: "Lesson overlaps another SCHEDULED lesson on the coach or violates the setup buffer" }
  - { id: ERR_ASSET_UNAVAILABLE, http: 409, condition: "Rental window overlaps another active rental on the asset" }
  - { id: ERR_LESSON_NOT_SCHEDULED, http: 409, condition: "Rental checkout while linked Lesson is not SCHEDULED" }
  - { id: ERR_EVENT_NOT_OPEN, http: 409, condition: "EventEntry create while Event is not PUBLISHED" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "EventEntry create while entry_count == capacity" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 402, condition: "available_qty below required qty on build reserve or order fulfill" }
