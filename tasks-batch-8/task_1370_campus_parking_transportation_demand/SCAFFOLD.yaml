# =============================================================================
# Task 1370: Campus Parking & Transportation Demand Management
# =============================================================================

scenario: |
  Campus Parking & Transportation Demand Management (campus parking services): permit type & eligibility by role/residency, lot capacity allocation & waitlist, virtual permit/LPR enforcement & citation appeals, event parking & lot closure coordination, shuttle service planning & ridership, alternative-commute incentive program, revenue funding of transportation operations, construction displacement planning

domain_name: campus-parking-transportation-demand
api_prefix: /parking

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation        # lot capacity quota, waitlist offers, displacement
  secondary_archetype: temporal windowing      # closures, permit validity windows, fleet windows
  complexity_layers:
    - optimistic_concurrency                   # OCC on LotAllocation.version for purchase/claim/quota-adjust
    - cascading_side_effects                   # closure activation -> lot posture -> permit displacement -> allocation flips
    - dual_variant_calculation                 # permit fee proration policies; citation fine schedules
    - derived_field_reconciliation             # allocated_count, outstanding_balance, fund balances, points
  entity_topology: flat                        # peer entities joined by FK references; no URL nesting
  state_machine_shape: cyclic                  # waitlist requeue cycle, citation appeal cycle, permit suspend/reinstate, route suspend/resume
  relationship_patterns:
    - one_to_many                              # lot -> allocations; patron -> permits/citations
    - cross_aggregate                          # citation -> permit/lot/patron; closure -> lot + fallback lot
  role_model: segregation_of_duties            # issuing officer may not adjudicate that citation's appeal
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Campus member's full name" }
      - { name: campus_role, type: enum, source: input, description: "STUDENT | STAFF | FACULTY — drives permit eligibility and waitlist role weight" }
      - { name: residency, type: enum, source: input, description: "ON_CAMPUS | OFF_CAMPUS — drives permit eligibility and waitlist residency bonus" }
      - { name: primary_commute_mode, type: enum, source: input, description: "DRIVE_ALONE | CARPOOL | TRANSIT | BIKE | WALK — DRIVE_ALONE patrons are ineligible for the incentive program" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of fine_amount_cents over this patron's citations with status == ISSUED (UNDER_APPEAL, PAID, VOIDED excluded). Starts at 0." }
      - { name: standing, type: enum, source: computed, description: "GOOD_STANDING | BLOCKED. BLOCKED iff outstanding_balance_cents >= BLOCK_THRESHOLD_CENTS (10000); recomputed on every citation issue/pay/appeal-decision." }

  - name: ParkingLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Unique human code, e.g. LOT_NORTH_1" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: zone, type: enum, source: input, description: "CORE | PERIMETER | REMOTE" }
      - { name: capacity_total, type: integer, source: input, description: "Total physical stalls; must be >= 1" }
      - { name: posture, type: enum, source: system, description: "OPEN | CLOSED_EVENT | CLOSED_CONSTRUCTION. OPEN at creation; set by closure activate; restored to OPEN by lift." }
      - { name: reserved_spaces_total, type: integer, source: computed, description: "Sum of reserved_spaces over closures on this lot with status IN {SCHEDULED, ACTIVE}. Starts at 0." }
      - { name: available_capacity, type: integer, source: computed, description: "capacity_total - reserved_spaces_total - sum of allocated_count over this lot's allocations" }

  - name: LotAllocation
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; the lot whose stalls this allocation sells" }
      - { name: permit_code, type: string, source: input, description: "Permit class code, e.g. RESIDENT_STUDENT. Unique per lot: (lot_id, permit_code)." }
      - { name: eligible_roles, type: array, source: input, description: "Non-empty subset of [STUDENT, STAFF, FACULTY]; patron.campus_role must be a member" }
      - { name: residency_rule, type: enum, source: input, description: "ANY | ON_CAMPUS_ONLY | OFF_CAMPUS_ONLY — checked against patron.residency" }
      - { name: base_fee_cents, type: integer, source: input, description: "Full-term list price in cents, >= 0" }
      - { name: proration_policy, type: enum, source: input, description: "PRORATED_WEEKLY | FLAT_HALF_TERM — selects the permit_fee_calculation variant" }
      - { name: term_start, type: string, source: input, description: "Term first date, ISO date YYYY-MM-DD" }
      - { name: term_end, type: string, source: input, description: "Term last date, ISO date; permits are valid through this date inclusive; must be > term_start" }
      - { name: quota, type: integer, source: input, description: "Maximum seats this allocation may have committed (ACTIVE+SUSPENDED permits plus OFFERED waitlist holds), >= 0" }
      - { name: allocated_count, type: integer, source: computed, description: "Count of permits on this allocation with status IN {ACTIVE, SUSPENDED}. Starts at 0; mutated by purchase, claim, cancel, expiry sweep, displacement in/out." }
      - { name: offers_outstanding, type: integer, source: computed, description: "Count of waitlist entries on this allocation with status == OFFERED. Starts at 0." }
      - { name: status, type: enum, source: system, description: "OPEN | WAITLISTING. OPEN at creation when quota > 0 else WAITLISTING. System flips: -> WAITLISTING when allocated_count + offers_outstanding >= quota; -> OPEN when < quota." }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: input, description: "FK -> LotAllocation.id; the allocation this entry queues for" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; the waiting patron" }
      - { name: status, type: enum, source: system, description: "WAITING | OFFERED | CLAIMED | EXPIRED | WITHDRAWN" }
      - { name: waiting_since, type: datetime, source: system, description: "Logical-clock timestamp of the latest entry into WAITING (creation or requeue); wait_days derives from this" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock timestamp when the entry last entered OFFERED; null until first offer" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + OFFER_TTL_HOURS (72h); an offer is expired iff current logical time is strictly greater than this" }
      - { name: decline_count, type: integer, source: system, description: "Starts 0; +1 on expiry requeue and on withdraw while OFFERED; feeds the priority-score penalty" }
      - { name: requeue_count, type: integer, source: system, description: "Starts 0; +1 each EXPIRED -> WAITING requeue; requeue allowed only while requeue_count < MAX_REQUEUES (2), otherwise the entry goes WITHDRAWN" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; permit holder" }
      - { name: allocation_id, type: string, source: input, description: "FK -> LotAllocation.id; allocation this permit occupies (repointed by construction displacement)" }
      - { name: displaced_from_allocation_id, type: string, source: system, description: "FK -> LotAllocation.id; nullable. Set when a construction closure displaces this permit to a fallback allocation; cleared when the closure is lifted and the permit moves back." }
      - { name: plate_number, type: string, source: input, description: "Vehicle license plate (virtual permit / LPR identity). At most one non-terminal permit per plate may cover any given date (inclusive windows)." }
      - { name: valid_from, type: string, source: input, description: "ISO date; defaults to max(current logical date, allocation.term_start); must lie within [term_start, term_end]" }
      - { name: valid_to, type: string, source: system, description: "ISO date; always allocation.term_end (inclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CANCELLED | EXPIRED. ACTIVE at creation; SUSPENDED while patron.standing == BLOCKED." }
      - { name: fee_base_cents, type: integer, source: computed, description: "Prorated base fee before surcharge (per permit_fee_calculation)" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Transportation sustainability surcharge = round_half_up(fee_base_cents * SURCHARGE_PCT)" }
      - { name: fee_total_cents, type: integer, source: computed, description: "fee_base_cents + surcharge_cents" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Incentive credit applied at purchase/claim (0 if none)" }
      - { name: fee_paid_cents, type: integer, source: computed, description: "fee_total_cents - credit_applied_cents; the cash amount recognized as permit revenue" }
      - { name: refund_cents, type: integer, source: computed, description: "Set on cancellation per permit_refund_calculation; null before cancellation" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; lot where the violation was observed" }
      - { name: plate_number, type: string, source: input, description: "Plate observed by the LPR scan; must resolve to at least one existing permit (latest by created_at)" }
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id; the resolved permit for the plate — the permit with this plate_number having the latest created_at (any status)" }
      - { name: patron_id, type: string, source: system, description: "FK -> Patron.id; denormalized from the resolved permit at issuance" }
      - { name: violation_type, type: enum, source: input, description: "NO_VALID_PERMIT | EXPIRED_PERMIT | WRONG_ZONE | CLOSED_LOT" }
      - { name: fine_amount_cents, type: integer, source: computed, description: "Per citation_fine_calculation at issuance; recomputed downward on appeal outcome REDUCED" }
      - { name: status, type: enum, source: system, description: "ISSUED | UNDER_APPEAL | PAID | VOIDED" }
      - { name: issued_by_officer_id, type: string, source: system, description: "X-User-ID of the issuing EnforcementOfficer; the appeals officer deciding this citation's appeal must differ (segregation of duties)" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance; drives the repeat-offense 365-day window" }
      - { name: appeal_reason, type: string, source: input, description: "Required when filing an appeal; null until filed" }
      - { name: appeal_outcome, type: enum, source: system, description: "NONE | PENDING | UPHELD | REDUCED | VOIDED. NONE at issuance; PENDING while UNDER_APPEAL; terminal outcome after decision." }
      - { name: appeal_decided_by, type: string, source: system, description: "X-User-ID of the AppealsOfficer who decided; null until decided" }
      - { name: reduction_pct, type: integer, source: input, description: "Required (1..99) when the decision outcome is REDUCED; otherwise must be absent/null" }

  - name: LotClosure
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> ParkingLot.id; lot being closed or partially reserved" }
      - { name: reason, type: enum, source: input, description: "EVENT | CONSTRUCTION" }
      - { name: event_name, type: string, source: input, description: "Required when reason == EVENT; must be null otherwise" }
      - { name: expected_attendance, type: integer, source: input, description: "Optional attendance estimate for EVENT closures" }
      - { name: reserved_spaces, type: integer, source: input, description: "Stalls reserved while the closure is SCHEDULED or ACTIVE; required >= 1 for EVENT, must be 0 for CONSTRUCTION; added to lot.reserved_spaces_total at creation and released on lift/cancel" }
      - { name: fallback_lot_id, type: string, source: input, description: "FK -> ParkingLot.id; nullable. Required when reason == CONSTRUCTION — the lot receiving displaced permits; must differ from lot_id." }
      - { name: starts_at, type: datetime, source: input, description: "Closure window start (inclusive), ISO 8601" }
      - { name: ends_at, type: datetime, source: input, description: "Closure window end (exclusive), ISO 8601; must be strictly after starts_at. Closures on one lot use half-open [starts_at, ends_at) semantics: adjacency (a.ends_at == b.starts_at) does NOT overlap." }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | LIFTED | CANCELLED" }
      - { name: displaced_permit_count, type: integer, source: system, description: "Number of ACTIVE permits repointed to the fallback allocation at activation (CONSTRUCTION); 0 for EVENT and before activation" }

  - name: ShuttleRoute
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> TransportationFund.id; fund that underwrites this route's operating cost" }
      - { name: route_code, type: string, source: input, description: "Unique route code, e.g. BLUE_LOOP" }
      - { name: fleet_group, type: string, source: input, description: "Vehicle pool identifier; routes sharing a fleet_group must respect the fleet window buffer rule" }
      - { name: service_window_start_minutes, type: integer, source: input, description: "Daily service window start in minutes after midnight, 0..1439" }
      - { name: service_window_end_minutes, type: integer, source: input, description: "Daily service window end in minutes after midnight, strictly greater than start, <= 1440" }
      - { name: headway_minutes, type: integer, source: input, description: "Minutes between runs, >= 1" }
      - { name: vehicle_capacity, type: integer, source: input, description: "Passengers per run, >= 1" }
      - { name: projected_daily_ridership, type: integer, source: input, description: "Planning forecast of daily boardings, >= 0" }
      - { name: annual_operating_cost_cents, type: integer, source: input, description: "Annual operating cost committed from the fund at activation, >= 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | SUSPENDED" }
      - { name: planned_daily_runs, type: integer, source: computed, description: "floor((service_window_end_minutes - service_window_start_minutes) / headway_minutes)" }
      - { name: daily_capacity, type: integer, source: computed, description: "planned_daily_runs * vehicle_capacity" }
      - { name: ridership_total, type: integer, source: computed, description: "Sum of boardings over all ridership logs posted to this route; starts at 0" }

  - name: IncentiveAccount
    parent: null
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id; exactly one account per patron" }
      - { name: points_balance, type: integer, source: computed, description: "Accrued points minus redeemed points; starts at 0" }
      - { name: lifetime_points, type: integer, source: computed, description: "Total points ever accrued; starts at 0" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Redeemed credit not yet applied to a permit purchase; starts at 0. Restored in full when a purchase that applied credit is cancelled." }

  - name: TransportationFund
    parent: null
    common_fields: true
    fields:
      - { name: fund_code, type: string, source: input, description: "Unique fund code, e.g. PTS_OPERATING" }
      - { name: permit_revenue_cents, type: integer, source: computed, description: "Net cash recognized from permits: += fee_paid_cents at purchase/claim; -= refund_cents at cancellation. Starts at 0." }
      - { name: citation_revenue_cents, type: integer, source: computed, description: "Cash recognized from citations: += fine_amount_cents at payment only (cash basis). Starts at 0." }
      - { name: committed_shuttle_funding_cents, type: integer, source: computed, description: "Sum of annual_operating_cost_cents over shuttle routes with status IN {ACTIVE, SUSPENDED} on this fund. Starts at 0." }
      - { name: available_balance_cents, type: integer, source: computed, description: "permit_revenue_cents + citation_revenue_cents - committed_shuttle_funding_cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LotAllocation
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: WAITLISTING
        trigger: "system — after any mutation that leaves allocated_count + offers_outstanding >= quota (permit purchase, waitlist claim, offer extension, quota reduction, construction displacement into this allocation)"
        actor: system
        preconditions: []
        side_effects: ["New POST /parking/permits against this allocation are rejected (ERR_ALLOCATION_NOT_OPEN); waitlist joins become allowed"]
      - from: WAITLISTING
        to: OPEN
        trigger: "system — after any mutation that leaves allocated_count + offers_outstanding < quota (permit cancellation, permit expiry sweep, offer expiry requeue/withdrawal, quota increase, displacement out of this allocation)"
        actor: system
        preconditions: []
        side_effects: ["Direct purchases become allowed again"]

  - entity: WaitlistEntry
    initial_state: WAITING
    terminal_states: [CLAIMED, WITHDRAWN]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "system via POST /parking/allocations/{allocationId}/extend-offers, or automatically after a permit cancellation/expiry frees seats on the entry's allocation"
        actor: system
        preconditions:
          - "free seats = quota - allocated_count - offers_outstanding > 0"
          - "selector: candidates are entries on this allocation with status == WAITING, ranked by waitlist_priority_score DESC, tie-break waiting_since ASC (earliest waiter first); at most `free seats` entries are promoted"
        side_effects:
          - "offered_at := current logical time; offer_expires_at := offered_at + 72h"
          - "allocation.offers_outstanding += 1 per promoted entry; allocation status re-evaluated (may flip OPEN -> WAITLISTING); allocation.version increments"
      - from: OFFERED
        to: CLAIMED
        trigger: "POST /parking/waitlist-entries/{entryId}/claim"
        actor: Commuter
        preconditions:
          - "entry status == OFFERED (ERR_OFFER_NOT_PENDING)"
          - "current logical time <= offer_expires_at (ERR_OFFER_EXPIRED; on breach the entry first transitions OFFERED -> EXPIRED and immediately requeues per the EXPIRED transition)"
          - "patron eligible for the allocation (role + residency) and standing == GOOD_STANDING"
          - "expected_allocation_version matches the allocation's current version (ERR_STALE_VERSION)"
        side_effects:
          - "a Permit is created on the entry's allocation (fee per permit_fee_calculation, valid_from := max(current logical date, term_start), valid_to := term_end); the Permit is the response body"
          - "allocation.offers_outstanding -= 1; allocated_count += 1; status re-evaluated; version increments"
          - "fund.permit_revenue_cents += fee_paid_cents; incentive credit applied if requested"
      - from: OFFERED
        to: EXPIRED
        trigger: "system — lazily, when a claim arrives after offer_expires_at, or swept at the start of extend-offers"
        actor: system
        preconditions: []
        side_effects: ["allocation.offers_outstanding -= 1; status re-evaluated; immediately followed by the EXPIRED -> WAITING or EXPIRED -> WITHDRAWN transition"]
      - from: EXPIRED
        to: WAITING
        trigger: "system — automatic requeue when requeue_count < MAX_REQUEUES (2)"
        actor: system
        preconditions: []
        side_effects: ["requeue_count += 1; decline_count += 1; waiting_since := current logical time (wait clock resets); offered_at/offer_expires_at cleared"]
      - from: EXPIRED
        to: WITHDRAWN
        trigger: "system — automatic when requeue_count == MAX_REQUEUES (2)"
        actor: system
        preconditions: []
        side_effects: ["decline_count += 1"]
      - from: WAITING
        to: WITHDRAWN
        trigger: "POST /parking/waitlist-entries/{entryId}/withdraw"
        actor: Commuter
        preconditions: ["entry status == WAITING or OFFERED (ERR_OFFER_NOT_PENDING otherwise)"]
        side_effects: []
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /parking/waitlist-entries/{entryId}/withdraw (declining an offer)"
        actor: Commuter
        preconditions: ["entry status == WAITING or OFFERED"]
        side_effects: ["decline_count += 1; allocation.offers_outstanding -= 1; status re-evaluated; version increments"]

  - entity: Permit
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /parking/permits/{permitId}/cancel"
        actor: Commuter | ParkingAdmin
        preconditions: ["permit status == ACTIVE or SUSPENDED (ERR_PERMIT_NOT_ACTIVE otherwise)"]
        side_effects:
          - "refund_cents computed per permit_refund_calculation; fund.permit_revenue_cents -= refund_cents"
          - "credit_applied_cents restored to the patron's IncentiveAccount.credit_balance_cents (if any was applied)"
          - "allocation.allocated_count -= 1; status re-evaluated; version increments"
          - "system immediately extends waitlist offers on the freed allocation (same selector as extend-offers)"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /parking/permits/{permitId}/cancel"
        actor: Commuter | ParkingAdmin
        preconditions: ["same as ACTIVE -> CANCELLED"]
        side_effects: ["same as ACTIVE -> CANCELLED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — swept by POST /parking/_clock/set_current_utc when valid_to is strictly before the new logical date"
        actor: system
        preconditions: []
        side_effects: ["allocation.allocated_count -= 1; status re-evaluated; offers extended on freed seats; no refund"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — when the holder's patron.standing flips to BLOCKED (citation issuance cascade)"
        actor: system
        preconditions: []
        side_effects: ["A SUSPENDED permit still occupies its allocation seat (allocated_count unchanged) but is not valid for parking"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — when the holder's patron.standing flips back to GOOD_STANDING (payment or appeal decision cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /parking/citations/{citationId}/pay"
        actor: Commuter
        preconditions: ["citation status == ISSUED (ERR_CITATION_NOT_ISSUED); acting Commuter owns citation.patron_id"]
        side_effects:
          - "patron.outstanding_balance_cents -= fine_amount_cents; standing recomputed; if standing flips to GOOD_STANDING, the patron's SUSPENDED permits return to ACTIVE"
          - "fund.citation_revenue_cents += fine_amount_cents"
      - from: ISSUED
        to: UNDER_APPEAL
        trigger: "POST /parking/citations/{citationId}/appeal"
        actor: Commuter
        preconditions:
          - "citation status == ISSUED (ERR_CITATION_NOT_ISSUED)"
          - "citation.appeal_outcome == NONE (ERR_APPEAL_ALREADY_EXISTS — a citation may be appealed at most once)"
        side_effects:
          - "appeal_outcome := PENDING; appeal_reason recorded"
          - "patron.outstanding_balance_cents -= fine_amount_cents (UNDER_APPEAL fines are excluded from outstanding); standing recomputed; SUSPENDED permits may return to ACTIVE"
      - from: UNDER_APPEAL
        to: ISSUED
        trigger: "POST /parking/citations/{citationId}/decide-appeal with outcome UPHELD or REDUCED"
        actor: AppealsOfficer
        preconditions:
          - "citation status == UNDER_APPEAL (ERR_CITATION_NOT_ISSUED)"
          - "decider X-User-ID != citation.issued_by_officer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "outcome REDUCED requires reduction_pct in 1..99 (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "UPHELD: fine unchanged. REDUCED: fine_amount_cents := round_half_up(fine_amount_cents * (100 - reduction_pct) / 100)."
          - "appeal_outcome := UPHELD | REDUCED; appeal_decided_by := decider X-User-ID"
          - "patron.outstanding_balance_cents += (post-decision) fine_amount_cents; standing recomputed; if standing flips to BLOCKED, the patron's ACTIVE permits flip to SUSPENDED"
      - from: UNDER_APPEAL
        to: VOIDED
        trigger: "POST /parking/citations/{citationId}/decide-appeal with outcome VOIDED"
        actor: AppealsOfficer
        preconditions: ["same as UNDER_APPEAL -> ISSUED"]
        side_effects:
          - "appeal_outcome := VOIDED; appeal_decided_by := decider X-User-ID"
          - "no balance effect (the fine was already excluded from outstanding while UNDER_APPEAL); standing recomputed"

  - entity: LotClosure
    initial_state: SCHEDULED
    terminal_states: [LIFTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /parking/closures/{closureId}/activate"
        actor: ParkingAdmin
        preconditions:
          - "closure status == SCHEDULED (ERR_CLOSURE_INVALID_STATE)"
          - "overlap re-check: no other closure on the same lot with status IN {SCHEDULED, ACTIVE} whose [starts_at, ends_at) intersects (ERR_CLOSURE_OVERLAP)"
          - "CONSTRUCTION only: fallback lot's matching allocation (same permit_code as each source allocation holding ACTIVE permits) must satisfy allocated_count + incoming_displaced <= quota (ERR_DISPLACEMENT_OVER_CAPACITY)"
        side_effects:
          - "lot.posture := CLOSED_EVENT (reason EVENT) or CLOSED_CONSTRUCTION (reason CONSTRUCTION); lot.version increments"
          - "CONSTRUCTION cascade: every permit with status == ACTIVE on allocations of the closed lot is repointed: permit.allocation_id := the fallback lot's allocation with the same permit_code, permit.displaced_from_allocation_id := original allocation"
          - "each repoint decrements the source allocation's allocated_count and increments the target's; both allocations re-evaluate OPEN/WAITLISTING status and increment version; displaced_permit_count recorded"
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /parking/closures/{closureId}/lift"
        actor: ParkingAdmin
        preconditions: ["closure status == ACTIVE (ERR_CLOSURE_INVALID_STATE)"]
        side_effects:
          - "lot.posture := OPEN"
          - "EVENT: lot.reserved_spaces_total -= reserved_spaces (availability recomputed)"
          - "CONSTRUCTION: every permit whose displaced_from_allocation_id points to an allocation of this lot (and which currently sits on the fallback allocation) is repointed back; displaced_from_allocation_id cleared; allocation counts and statuses re-evaluated on both sides"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /parking/closures/{closureId}/cancel"
        actor: ParkingAdmin
        preconditions: ["closure status == SCHEDULED (ERR_CLOSURE_INVALID_STATE)"]
        side_effects: ["EVENT: lot.reserved_spaces_total -= reserved_spaces (release the reservation made at creation)"]

  - entity: ShuttleRoute
    initial_state: PLANNED
    terminal_states: []
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /parking/shuttle-routes/{routeId}/activate"
        actor: ParkingAdmin
        preconditions:
          - "route status == PLANNED or SUSPENDED (ERR_ROUTE_INVALID_STATE)"
          - "coverage: daily_capacity >= projected_daily_ridership (ERR_INSUFFICIENT_SHUTTLE_CAPACITY)"
          - "funding: fund.available_balance_cents >= annual_operating_cost_cents (ERR_INSUFFICIENT_FUNDING)"
          - "fleet window buffer re-check against ACTIVE routes in the same fleet_group (ERR_FLEET_WINDOW_CONFLICT)"
        side_effects: ["fund.committed_shuttle_funding_cents += annual_operating_cost_cents"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /parking/shuttle-routes/{routeId}/activate (resume)"
        actor: ParkingAdmin
        preconditions: ["same as PLANNED -> ACTIVE"]
        side_effects: ["fund commitment unchanged (already committed at first activation); no double-commit"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /parking/shuttle-routes/{routeId}/suspend"
        actor: ParkingAdmin
        preconditions: ["route status == ACTIVE (ERR_ROUTE_INVALID_STATE)"]
        side_effects: ["fund commitment retained while SUSPENDED"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-quota-adjust-stale
    parent_entity: LotAllocation
    write_endpoint: "PATCH /parking/allocations/{allocationId}"
    occ_field: expected_allocation_version
    description: |
      Adjusting an allocation's quota against a stale observed version of the
      LotAllocation is rejected: the client's view of allocated_count, quota and
      status no longer matches the server, so the adjustment must be re-based on
      a fresh read before it can proceed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: permit-purchase-stale-allocation
    parent_entity: LotAllocation
    write_endpoint: "POST /parking/permits"
    occ_field: expected_allocation_version
    description: |
      Purchasing a permit carries the LotAllocation version the client observed
      when quoting availability; if the allocation's version has since advanced
      (another purchase, claim, cancellation cascade, displacement, or quota
      adjustment), the purchase is rejected as stale so the client re-quotes
      against current availability.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: waitlist-claim-stale-allocation
    parent_entity: LotAllocation
    write_endpoint: "POST /parking/waitlist-entries/{entryId}/claim"
    occ_field: expected_allocation_version
    description: |
      Claiming a waitlist offer consumes a held seat on the allocation; a claim
      submitted against an allocation version that has advanced since the client
      last read the allocation is rejected as stale so the claim is re-based on
      the current quota picture.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: permit_fee_calculation
    trigger: "permit purchase (POST /parking/permits) and waitlist claim (POST /parking/waitlist-entries/{entryId}/claim)"
    algorithm: tiered_pricing
    formula: |
      Inputs: allocation.base_fee_cents, allocation.proration_policy,
              allocation.term_start, allocation.term_end, permit.valid_from.
      total_days = (term_end - term_start).days + 1  (both dates inclusive)
      Variant PRORATED_WEEKLY:
        term_weeks   = ceil(total_days / 7)
        remaining_days = (term_end - valid_from).days + 1  (valid_from counted)
        weeks_remaining = ceil(remaining_days / 7)
        weekly_rate  = round_half_up(base_fee_cents / term_weeks)   # ROUND FIRST
        fee_base_cents = weekly_rate * weeks_remaining              # exact integer multiply
      Variant FLAT_HALF_TERM:
        midterm_date = term_start + floor(total_days / 2) days
        fee_base_cents = base_fee_cents if valid_from <= midterm_date
                         else round_half_up(base_fee_cents * 0.5)
      Common tail (both variants):
        surcharge_cents  = round_half_up(fee_base_cents * SURCHARGE_PCT)   # surcharge computed from the ROUNDED fee_base
        fee_total_cents  = fee_base_cents + surcharge_cents
        credit_applied_cents = min(requested apply_credit_cents, fee_total_cents) when supplied, else 0
        fee_paid_cents   = fee_total_cents - credit_applied_cents
      Evaluation order is pinned exactly as written: prorate -> round weekly rate
      (PRORATED_WEEKLY only) -> multiply -> surcharge on the rounded base -> sum
      -> apply credit last.
    input_set: "the target LotAllocation; the patron's IncentiveAccount when apply_credit_cents is supplied"
    constants:
      SURCHARGE_PCT: 0.05
    precision: "integer cents; round_half_up wherever a division or percentage is evaluated"
    variants:
      - name: prorated_weekly
        when: "allocation.proration_policy == PRORATED_WEEKLY"
        difference: "fee scales with ceil-weeks remaining in term; weekly rate is rounded before multiplication"
      - name: flat_half_term
        when: "allocation.proration_policy == FLAT_HALF_TERM"
        difference: "full fee up to the midterm date, half fee (rounded) after it — identical inputs yield a different fee than prorated_weekly"

  - name: permit_refund_calculation
    trigger: "permit cancellation (POST /parking/permits/{permitId}/cancel)"
    algorithm: aggregation
    formula: |
      Let today = current logical date.
      If today < permit.valid_from:  refund_cents = fee_paid_cents            (full, no admin fee)
      Else:
        total_days     = (valid_to - valid_from).days + 1
        remaining_days = (valid_to - today).days          # cancel day itself is consumed
        refund_cents   = max(0, round_half_up(fee_paid_cents * remaining_days / total_days) - ADMIN_FEE_CENTS)
      In both cases credit_applied_cents is separately restored to the patron's
      IncentiveAccount.credit_balance_cents in full (not prorated).
    input_set: "the Permit being cancelled; current logical date"
    constants:
      ADMIN_FEE_CENTS: 500
    precision: "integer cents; round_half_up on the prorated share"

  - name: citation_fine_calculation
    trigger: "citation issuance (POST /parking/citations); recomputed downward on appeal outcome REDUCED"
    algorithm: threshold
    formula: |
      base = VIOLATION_BASE_CENTS[violation_type]
      repeat_count = number of citations for this patron with status == PAID
                     and issued_at >= (current logical time - REPEAT_WINDOW_DAYS days)   # >= : exactly 365 days old still counts
      multiplier = ESCALATION_MULTIPLIER if repeat_count >= REPEAT_THRESHOLD else 1.0
      event_surcharge = EVENT_DAY_SURCHARGE_CENTS if the cited lot has a closure with
                        reason == EVENT and status == ACTIVE whose [starts_at, ends_at)
                        contains the current logical time, else 0
      fine_amount_cents = round_half_up(base * multiplier) + event_surcharge
      Order pinned: escalate the base first (rounded), then add the flat event surcharge.
    input_set: "the patron's citation history (PAID within the trailing window); ACTIVE EVENT closures on the cited lot"
    constants:
      VIOLATION_BASE_CENTS: { NO_VALID_PERMIT: 7500, EXPIRED_PERMIT: 5000, WRONG_ZONE: 4000, CLOSED_LOT: 6000 }
      REPEAT_WINDOW_DAYS: 365
      REPEAT_THRESHOLD: 2
      ESCALATION_MULTIPLIER: 1.5
      EVENT_DAY_SURCHARGE_CENTS: 1500
    precision: "integer cents; round_half_up on the escalated product"
    variants:
      - name: standard_schedule
        when: "repeat_count < REPEAT_THRESHOLD"
        difference: "fine = base (+ event surcharge)"
      - name: repeat_escalated_schedule
        when: "repeat_count >= REPEAT_THRESHOLD"
        difference: "fine = base * 1.5 (+ event surcharge) — identical violation/lot/time yields a larger fine purely from patron history"

  - name: waitlist_priority_score
    trigger: "offer selection during POST /parking/allocations/{allocationId}/extend-offers and automatic offers after a seat frees"
    algorithm: weighted_scoring
    formula: |
      wait_days = floor((current logical time - entry.waiting_since) / 86400 seconds)
      score = ROLE_WEIGHT[patron.campus_role]
              + min(wait_days, WAIT_DAY_CAP) * WAIT_DAY_POINTS
              + (RESIDENCY_BONUS if patron.residency == ON_CAMPUS else 0)
              - DECLINE_PENALTY * entry.decline_count
      Selection: candidates = entries on the allocation with status == WAITING;
      rank by score DESC; ties broken by waiting_since ASC; promote at most
      (quota - allocated_count - offers_outstanding) entries.
    input_set: "WAITING WaitlistEntry rows on the allocation joined to their Patron"
    constants:
      ROLE_WEIGHT: { FACULTY: 100, STAFF: 80, STUDENT: 60 }
      WAIT_DAY_CAP: 30
      WAIT_DAY_POINTS: 2
      RESIDENCY_BONUS: 10
      DECLINE_PENALTY: 15
    precision: "integer score; no rounding"

  - name: lot_availability_calculation
    trigger: "recomputed on closure create/lift/cancel, permit purchase/claim/cancel/expiry, and displacement"
    algorithm: aggregation
    formula: |
      lot.reserved_spaces_total = sum(reserved_spaces) over closures on the lot
                                  with status IN {SCHEDULED, ACTIVE}
      lot.available_capacity = capacity_total - reserved_spaces_total
                               - sum(allocated_count) over allocations with lot_id == lot.id
    input_set: "closures status IN {SCHEDULED, ACTIVE}; all LotAllocations on the lot"
    precision: "integer stalls"

  - name: fund_balance_calculation
    trigger: "permit purchase/claim/cancel, citation payment, shuttle route activation"
    algorithm: aggregation
    formula: |
      permit_revenue_cents   += fee_paid_cents at purchase/claim; -= refund_cents at cancel
      citation_revenue_cents += fine_amount_cents at payment (cash basis only)
      committed_shuttle_funding_cents = sum(annual_operating_cost_cents) over routes
                                        with status IN {ACTIVE, SUSPENDED} on this fund
      available_balance_cents = permit_revenue_cents + citation_revenue_cents - committed_shuttle_funding_cents
    input_set: "all routes on the fund with status IN {ACTIVE, SUSPENDED}; permit and citation cash events"
    precision: "integer cents"

  - name: shuttle_coverage_calculation
    trigger: "shuttle route creation and activation"
    algorithm: threshold
    formula: |
      planned_daily_runs = floor((service_window_end_minutes - service_window_start_minutes) / headway_minutes)
      daily_capacity = planned_daily_runs * vehicle_capacity
      Activation requires daily_capacity >= projected_daily_ridership   # equality is sufficient
    input_set: "the route's own planning fields"
    precision: "integer runs/seats"

  - name: incentive_points_calculation
    trigger: "POST /parking/incentive-accounts/{accountId}/accruals and .../redeem"
    algorithm: threshold
    formula: |
      Accrual: points = days_commuted * POINTS_PER_DAY; days_commuted must be 1..31.
               points_balance += points; lifetime_points += points.
      Redemption of `blocks` blocks:
               requires blocks >= 1 and points_balance >= blocks * REDEMPTION_BLOCK_POINTS  # equality sufficient
               points_balance      -= blocks * REDEMPTION_BLOCK_POINTS
               credit_balance_cents += blocks * REDEMPTION_BLOCK_CREDIT_CENTS
    input_set: "the IncentiveAccount"
    constants:
      POINTS_PER_DAY: 10
      REDEMPTION_BLOCK_POINTS: 500
      REDEMPTION_BLOCK_CREDIT_CENTS: 2500
    precision: "integer points/cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Ownership: a Commuter's X-User-ID must equal the target resource's patron_id (permit purchase/cancel, waitlist join/claim/withdraw, citation pay/appeal, incentive enroll/redeem)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /parking/permits, POST /parking/permits/{id}/cancel, POST /parking/waitlist-entries, POST /parking/waitlist-entries/{id}/claim, POST /parking/waitlist-entries/{id}/withdraw, POST /parking/citations/{id}/pay, POST /parking/citations/{id}/appeal, POST /parking/incentive-accounts, POST /parking/incentive-accounts/{id}/redeem"

  - priority: 4
    category: existence
    check: "Path ids and body FK references exist, validated left-to-right (patron, lot, allocation, entry, permit, citation, closure, route, incentive account, fund)"
    error_id: "ERR_PATRON_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_CITATION_NOT_FOUND | ERR_CLOSURE_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_INCENTIVE_ACCOUNT_NOT_FOUND | ERR_FUND_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids or body FKs

  - priority: 5
    category: state
    check: "OCC: expected_allocation_version equals the LotAllocation's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /parking/permits, POST /parking/waitlist-entries/{id}/claim, PATCH /parking/allocations/{id}"

  - priority: 6
    category: existence
    check: "Request shape: required fields present, enums in domain, dates parseable; ends_at strictly after starts_at; service_window_end_minutes > start; reduction_pct present iff outcome == REDUCED; event_name and reserved_spaces >= 1 required iff reason == EVENT; fallback_lot_id required (and != lot_id) iff reason == CONSTRUCTION"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_INTERVAL | ERR_FALLBACK_LOT_REQUIRED"
    http_status: 400
    applies_to: all write endpoints

  - priority: 7
    category: state
    check: "Target resource state permits the operation: allocation OPEN for purchase; allocation WAITLISTING for waitlist join; entry OFFERED for claim; entry WAITING/OFFERED for withdraw; permit ACTIVE/SUSPENDED for cancel; citation ISSUED for pay/appeal; citation UNDER_APPEAL for decide-appeal; closure SCHEDULED for activate/cancel; closure ACTIVE for lift; route PLANNED/SUSPENDED for activate; route ACTIVE for suspend"
    error_id: "ERR_ALLOCATION_NOT_OPEN | ERR_ALLOCATION_NOT_WAITLISTING | ERR_OFFER_NOT_PENDING | ERR_PERMIT_NOT_ACTIVE | ERR_CITATION_NOT_ISSUED | ERR_CLOSURE_INVALID_STATE | ERR_ROUTE_INVALID_STATE"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 8
    category: business_referential
    check: "Plate resolution: citation plate_number must match at least one existing permit (latest by created_at is bound)"
    error_id: ERR_PLATE_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /parking/citations"

  - priority: 9
    category: business_temporal
    check: "Interval conflicts: closure half-open [starts_at, ends_at) overlap on the same lot (adjacency allowed); permit plate double-booking — inclusive [valid_from, valid_to] windows on the same plate among permits with status IN {ACTIVE, SUSPENDED} (a touching date IS an overlap); fleet window buffer — routes in one fleet_group need a >= 30 minute gap between daily windows; offer not expired (current time <= offer_expires_at); valid_from within [term_start, term_end]"
    error_id: "ERR_CLOSURE_OVERLAP | ERR_DUPLICATE_ACTIVE_PERMIT | ERR_FLEET_WINDOW_CONFLICT | ERR_OFFER_EXPIRED | ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "POST /parking/closures, POST /parking/permits, POST /parking/shuttle-routes, POST /parking/waitlist-entries/{id}/claim"
    note: "ERR_OFFER_EXPIRED and ERR_INVALID_REQUEST return 422 and 400 respectively; the temporal category outranks business_fiscal on every endpoint"

  - priority: 10
    category: business_safety
    check: "Eligibility & duties: patron.campus_role in allocation.eligible_roles and residency_rule satisfied (purchase/join/claim); incentive enrollment requires primary_commute_mode != DRIVE_ALONE; segregation of duties — appeal decider must differ from issuing officer"
    error_id: "ERR_PATRON_INELIGIBLE | ERR_INELIGIBLE_COMMUTE_MODE | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "POST /parking/permits, POST /parking/waitlist-entries, POST /parking/waitlist-entries/{id}/claim, POST /parking/incentive-accounts, POST /parking/citations/{id}/decide-appeal"

  - priority: 11
    category: business_constraint
    check: "Uniqueness: (lot_id, permit_code) unique among allocations; at most one waitlist entry with status IN {WAITING, OFFERED} per (patron, allocation); at most one appeal per citation; exactly one incentive account per patron"
    error_id: "ERR_DUPLICATE_ALLOCATION_CODE | ERR_ALREADY_WAITLISTED | ERR_APPEAL_ALREADY_EXISTS | ERR_ACCOUNT_EXISTS"
    http_status: 409
    applies_to: "POST /parking/allocations, POST /parking/waitlist-entries, POST /parking/citations/{id}/appeal, POST /parking/incentive-accounts"

  - priority: 12
    category: business_fiscal
    check: "Capacity & money: patron standing must be GOOD_STANDING (purchase/claim); apply_credit_cents <= incentive credit balance; construction activation displacement fits the fallback allocation quota; route activation funding and seat-coverage checks; redemption point balance"
    error_id: "ERR_PATRON_BLOCKED | ERR_INSUFFICIENT_CREDIT | ERR_DISPLACEMENT_OVER_CAPACITY | ERR_INSUFFICIENT_FUNDING | ERR_INSUFFICIENT_SHUTTLE_CAPACITY | ERR_INSUFFICIENT_POINTS"
    http_status: 402
    applies_to: "POST /parking/permits, POST /parking/waitlist-entries/{id}/claim, POST /parking/closures/{id}/activate, POST /parking/shuttle-routes/{id}/activate, POST /parking/incentive-accounts/{id}/redeem"
    note: "ERR_PATRON_BLOCKED and ERR_INSUFFICIENT_FUNDING return 402; ERR_DISPLACEMENT_OVER_CAPACITY returns 409; ERR_INSUFFICIENT_CREDIT / ERR_INSUFFICIENT_SHUTTLE_CAPACITY / ERR_INSUFFICIENT_POINTS return 422. Fiscal checks always run after state (p7) and temporal (p9) checks. Within route activation, the seat-coverage check (ERR_INSUFFICIENT_SHUTTLE_CAPACITY) is evaluated before the funding check (ERR_INSUFFICIENT_FUNDING); on permit purchase/claim, the patron-standing check (ERR_PATRON_BLOCKED) is evaluated before the credit check (ERR_INSUFFICIENT_CREDIT)."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Patron ---
  - method: POST
    path: "/parking/patrons"
    description: "Register a campus member"
    roles: [ParkingAdmin]
    code: 201
    input: [full_name, campus_role, residency, primary_commute_mode]
    output: Patron
    side_effects: ["standing := GOOD_STANDING; outstanding_balance_cents := 0"]

  - method: GET
    path: "/parking/patrons"
    description: "List patrons"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "campus_role?", "residency?", "standing?"]
    output: "Patron[]"
    side_effects: []

  - method: GET
    path: "/parking/patrons/{patronId}"
    description: "Get a patron"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: Patron
    side_effects: []

  # --- ParkingLot ---
  - method: POST
    path: "/parking/lots"
    description: "Create a parking lot"
    roles: [ParkingAdmin]
    code: 201
    input: [lot_code, name, zone, capacity_total]
    output: ParkingLot
    side_effects: ["posture := OPEN; reserved_spaces_total := 0"]

  - method: GET
    path: "/parking/lots"
    description: "List parking lots"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "posture?", "zone?"]
    output: "ParkingLot[]"
    side_effects: []

  - method: GET
    path: "/parking/lots/{lotId}"
    description: "Get a parking lot"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: ParkingLot
    side_effects: []

  # --- LotAllocation ---
  - method: POST
    path: "/parking/allocations"
    description: "Create a permit-class allocation on a lot (permit type definition incl. eligibility, fee, proration policy, term, quota)"
    roles: [ParkingAdmin]
    code: 201
    input: [lot_id, permit_code, eligible_roles, residency_rule, base_fee_cents, proration_policy, term_start, term_end, quota]
    output: LotAllocation
    side_effects: ["status := OPEN if quota > 0 else WAITLISTING; allocated_count := 0; offers_outstanding := 0"]

  - method: GET
    path: "/parking/allocations"
    description: "List allocations (FK reverse lookup for lot_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "lot_id?", "permit_code?", "status?"]
    output: "LotAllocation[]"
    side_effects: []

  - method: GET
    path: "/parking/allocations/{allocationId}"
    description: "Get an allocation (canonical read before any OCC write)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: LotAllocation
    side_effects: []

  - method: PATCH
    path: "/parking/allocations/{allocationId}"
    description: "Adjust an allocation's quota (OCC-guarded)"
    roles: [ParkingAdmin]
    code: 200
    input: [quota, expected_allocation_version]
    output: LotAllocation
    side_effects: ["quota updated; allocated_count unchanged; status re-evaluated (OPEN <-> WAITLISTING); increments LotAllocation.version by 1"]

  - method: POST
    path: "/parking/allocations/{allocationId}/extend-offers"
    description: "Run one offer round: expire overdue OFFERED entries (requeue per policy), then promote top-scored WAITING entries into free seats"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: "{ offered_count: integer, offered_entry_ids: string[] }"
    side_effects: ["expired offers swept first; selected entries WAITING -> OFFERED with 72h expiry; offers_outstanding and status updated; version increments when any entry changes"]

  # --- WaitlistEntry ---
  - method: POST
    path: "/parking/waitlist-entries"
    description: "Join an allocation's waitlist"
    roles: [Commuter, ParkingAdmin]
    code: 201
    input: [patron_id, allocation_id]
    output: WaitlistEntry
    side_effects: ["status := WAITING; waiting_since := current logical time; decline_count/requeue_count := 0"]

  - method: GET
    path: "/parking/waitlist-entries"
    description: "List waitlist entries (FK reverse lookup for allocation_id, patron_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "allocation_id?", "patron_id?", "status?"]
    output: "WaitlistEntry[]"
    side_effects: []

  - method: GET
    path: "/parking/waitlist-entries/{entryId}"
    description: "Get a waitlist entry"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []

  - method: POST
    path: "/parking/waitlist-entries/{entryId}/claim"
    description: "Claim an outstanding offer; creates and returns the Permit (OCC-guarded on the allocation)"
    roles: [Commuter]
    code: 201
    input: [expected_allocation_version, "apply_credit_cents?"]
    output: Permit
    side_effects:
      - "entry OFFERED -> CLAIMED; permit created ACTIVE (fee per permit_fee_calculation; valid_from := max(current logical date, term_start); valid_to := term_end)"
      - "allocation.offers_outstanding -= 1; allocated_count += 1; status re-evaluated; increments LotAllocation.version by 1"
      - "fund.permit_revenue_cents += fee_paid_cents; incentive credit debited when applied"

  - method: POST
    path: "/parking/waitlist-entries/{entryId}/withdraw"
    description: "Withdraw (WAITING) or decline (OFFERED) a waitlist entry"
    roles: [Commuter]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["entry -> WITHDRAWN; if it was OFFERED: decline_count += 1, offers_outstanding -= 1, allocation status re-evaluated"]

  # --- Permit ---
  - method: POST
    path: "/parking/permits"
    description: "Purchase a permit on an OPEN allocation (OCC-guarded)"
    roles: [Commuter, ParkingAdmin]
    code: 201
    input: [patron_id, allocation_id, plate_number, "valid_from?", expected_allocation_version, "apply_credit_cents?"]
    output: Permit
    side_effects:
      - "fee computed per permit_fee_calculation; permit created ACTIVE"
      - "allocation.allocated_count += 1; status re-evaluated; increments LotAllocation.version by 1"
      - "fund.permit_revenue_cents += fee_paid_cents; incentive credit debited when applied"

  - method: GET
    path: "/parking/permits"
    description: "List permits (FK reverse lookup for patron_id, allocation_id, displaced_from_allocation_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "patron_id?", "allocation_id?", "displaced_from_allocation_id?", "plate_number?", "status?"]
    output: "Permit[]"
    side_effects: []

  - method: GET
    path: "/parking/permits/{permitId}"
    description: "Get a permit"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/parking/permits/{permitId}/cancel"
    description: "Cancel a permit; refund per permit_refund_calculation and restore any applied incentive credit"
    roles: [Commuter, ParkingAdmin]
    code: 200
    input: []
    output: Permit
    side_effects:
      - "permit -> CANCELLED; refund_cents set; fund.permit_revenue_cents -= refund_cents"
      - "credit_applied_cents restored to IncentiveAccount.credit_balance_cents"
      - "allocation.allocated_count -= 1; status re-evaluated; waitlist offers extended on freed seats"

  # --- Citation ---
  - method: POST
    path: "/parking/citations"
    description: "Issue a citation from an LPR observation (plate resolves to the latest permit by created_at)"
    roles: [EnforcementOfficer]
    code: 201
    input: [lot_id, plate_number, violation_type]
    output: Citation
    side_effects:
      - "fine computed per citation_fine_calculation; citation ISSUED; issued_by_officer_id := X-User-ID; issued_at := current logical time"
      - "patron.outstanding_balance_cents += fine_amount_cents; standing recomputed; if standing flips to BLOCKED, the patron's ACTIVE permits flip to SUSPENDED"

  - method: GET
    path: "/parking/citations"
    description: "List citations (FK reverse lookup for lot_id, permit_id, patron_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "lot_id?", "permit_id?", "patron_id?", "plate_number?", "status?"]
    output: "Citation[]"
    side_effects: []

  - method: GET
    path: "/parking/citations/{citationId}"
    description: "Get a citation"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: POST
    path: "/parking/citations/{citationId}/pay"
    description: "Pay an issued citation (cash-basis revenue recognition)"
    roles: [Commuter]
    code: 200
    input: []
    output: Citation
    side_effects: ["citation -> PAID; outstanding reduced; standing recomputed (permits may reinstate); fund.citation_revenue_cents += fine"]

  - method: POST
    path: "/parking/citations/{citationId}/appeal"
    description: "File an appeal against an issued citation (at most one appeal per citation)"
    roles: [Commuter]
    code: 200
    input: [reason]
    output: Citation
    side_effects: ["citation -> UNDER_APPEAL; appeal_outcome := PENDING; outstanding excludes the fine while under appeal; standing recomputed"]

  - method: POST
    path: "/parking/citations/{citationId}/decide-appeal"
    description: "Adjudicate an appeal (UPHELD | REDUCED | VOIDED); decider must not be the issuing officer"
    roles: [AppealsOfficer]
    code: 200
    input: [outcome, "reduction_pct?"]
    output: Citation
    side_effects: ["outcome per Citation state machine; fine recomputed on REDUCED; outstanding and standing recomputed; permits suspend/reinstate accordingly"]

  # --- LotClosure (event parking + construction displacement) ---
  - method: POST
    path: "/parking/closures"
    description: "Schedule a lot closure (EVENT reserves stalls immediately; CONSTRUCTION requires a fallback lot)"
    roles: [ParkingAdmin]
    code: 201
    input: [lot_id, reason, starts_at, ends_at, "event_name?", "expected_attendance?", "reserved_spaces?", "fallback_lot_id?"]
    output: LotClosure
    side_effects: ["status := SCHEDULED; EVENT: lot.reserved_spaces_total += reserved_spaces (availability recomputed, allocations may flip to WAITLISTING)"]

  - method: GET
    path: "/parking/closures"
    description: "List closures (FK reverse lookup for lot_id, fallback_lot_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "lot_id?", "fallback_lot_id?", "reason?", "status?"]
    output: "LotClosure[]"
    side_effects: []

  - method: GET
    path: "/parking/closures/{closureId}"
    description: "Get a closure"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: LotClosure
    side_effects: []

  - method: POST
    path: "/parking/closures/{closureId}/activate"
    description: "Activate a scheduled closure; CONSTRUCTION activation runs the displacement cascade onto the fallback lot"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: LotClosure
    side_effects: ["closure -> ACTIVE; lot.posture set; CONSTRUCTION: ACTIVE permits repointed to fallback allocations, counts/statuses/versions updated on both allocations, displaced_permit_count recorded"]

  - method: POST
    path: "/parking/closures/{closureId}/lift"
    description: "Lift an active closure; reverses displacement and releases event reservations"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: LotClosure
    side_effects: ["closure -> LIFTED; lot.posture := OPEN; EVENT: reserved spaces released; CONSTRUCTION: displaced permits repointed back, displaced_from_allocation_id cleared"]

  - method: POST
    path: "/parking/closures/{closureId}/cancel"
    description: "Cancel a scheduled closure (releases any event reservation)"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: LotClosure
    side_effects: ["closure -> CANCELLED; EVENT: lot.reserved_spaces_total -= reserved_spaces"]

  # --- ShuttleRoute ---
  - method: POST
    path: "/parking/shuttle-routes"
    description: "Plan a shuttle route (fleet window buffer rule checked against non-terminal routes in the same fleet_group)"
    roles: [ParkingAdmin]
    code: 201
    input: [fund_id, route_code, fleet_group, service_window_start_minutes, service_window_end_minutes, headway_minutes, vehicle_capacity, projected_daily_ridership, annual_operating_cost_cents]
    output: ShuttleRoute
    side_effects: ["status := PLANNED; planned_daily_runs and daily_capacity computed; ridership_total := 0"]

  - method: GET
    path: "/parking/shuttle-routes"
    description: "List shuttle routes (FK reverse lookup for fund_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "fund_id?", "fleet_group?", "status?"]
    output: "ShuttleRoute[]"
    side_effects: []

  - method: GET
    path: "/parking/shuttle-routes/{routeId}"
    description: "Get a shuttle route"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: ShuttleRoute
    side_effects: []

  - method: POST
    path: "/parking/shuttle-routes/{routeId}/activate"
    description: "Activate (or resume) a route; commits its annual operating cost from the fund on first activation"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: ShuttleRoute
    side_effects: ["route -> ACTIVE; on PLANNED -> ACTIVE only: fund.committed_shuttle_funding_cents += annual_operating_cost_cents"]

  - method: POST
    path: "/parking/shuttle-routes/{routeId}/suspend"
    description: "Suspend an active route (funding commitment retained)"
    roles: [ParkingAdmin]
    code: 200
    input: []
    output: ShuttleRoute
    side_effects: ["route -> SUSPENDED"]

  - method: POST
    path: "/parking/shuttle-routes/{routeId}/ridership-logs"
    description: "Log one day of boardings for a route"
    roles: [ParkingAdmin]
    code: 201
    input: [log_date, boardings]
    output: ShuttleRoute
    side_effects: ["ridership_total += boardings"]

  # --- IncentiveAccount (alternative-commute program) ---
  - method: POST
    path: "/parking/incentive-accounts"
    description: "Enroll a patron in the alternative-commute incentive program"
    roles: [Commuter]
    code: 201
    input: [patron_id]
    output: IncentiveAccount
    side_effects: ["points_balance/lifetime_points/credit_balance_cents := 0"]

  - method: GET
    path: "/parking/incentive-accounts"
    description: "List incentive accounts (FK reverse lookup for patron_id)"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?", "patron_id?"]
    output: "IncentiveAccount[]"
    side_effects: []

  - method: GET
    path: "/parking/incentive-accounts/{accountId}"
    description: "Get an incentive account"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: IncentiveAccount
    side_effects: []

  - method: POST
    path: "/parking/incentive-accounts/{accountId}/accruals"
    description: "Post verified alternative-commute days; points accrue at POINTS_PER_DAY (10), at most 31 days per posting"
    roles: [ParkingAdmin]
    code: 201
    input: [days_commuted]
    output: IncentiveAccount
    side_effects: ["points_balance += days_commuted * 10; lifetime_points += same"]

  - method: POST
    path: "/parking/incentive-accounts/{accountId}/redeem"
    description: "Redeem points in 500-point blocks for parking credit (2500 cents per block)"
    roles: [Commuter]
    code: 200
    input: [blocks]
    output: IncentiveAccount
    side_effects: ["points_balance -= blocks * 500; credit_balance_cents += blocks * 2500"]

  # --- TransportationFund (revenue funding of transportation operations) ---
  - method: POST
    path: "/parking/transportation-funds"
    description: "Create a transportation operations fund"
    roles: [ParkingAdmin]
    code: 201
    input: [fund_code]
    output: TransportationFund
    side_effects: ["all computed balances := 0"]

  - method: GET
    path: "/parking/transportation-funds"
    description: "List funds with computed balances"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "TransportationFund[]"
    side_effects: []

  - method: GET
    path: "/parking/transportation-funds/{fundId}"
    description: "Get a fund with computed balances"
    roles: [Commuter, ParkingAdmin, EnforcementOfficer, AppealsOfficer]
    code: 200
    input: []
    output: TransportationFund
    side_effects: []

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/parking/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to wall-clock time. Side effects of advancing: ACTIVE permits whose valid_to is strictly before the new date flip to EXPIRED (freeing seats and extending waitlist offers). Waitlist offer expiry is evaluated lazily at claim and at the start of extend-offers, not here."
    roles: [ParkingAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["permit expiry sweep as described; allocations re-evaluated; waitlist offers extended on freed seats"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-ID or X-User-Role header missing, or role not one of the declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is authenticated but not in the endpoint's roles list" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Commuter's X-User-ID does not equal the target resource's patron_id" }
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "No patron with the given id" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "No parking lot with the given id" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "No lot allocation with the given id" }
  - { id: ERR_ENTRY_NOT_FOUND, http: 404, condition: "No waitlist entry with the given id" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "No permit with the given id" }
  - { id: ERR_CITATION_NOT_FOUND, http: 404, condition: "No citation with the given id" }
  - { id: ERR_CLOSURE_NOT_FOUND, http: 404, condition: "No lot closure with the given id" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "No shuttle route with the given id" }
  - { id: ERR_INCENTIVE_ACCOUNT_NOT_FOUND, http: 404, condition: "No incentive account with the given id" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "No transportation fund with the given id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_allocation_version does not match the LotAllocation's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown enum value, unparsable date, reduction_pct missing for REDUCED (or present otherwise), valid_from outside the allocation term, or other malformed input" }
  - { id: ERR_INVALID_INTERVAL, http: 400, condition: "ends_at <= starts_at on a closure, or service_window_end_minutes <= start" }
  - { id: ERR_FALLBACK_LOT_REQUIRED, http: 400, condition: "CONSTRUCTION closure created without fallback_lot_id, or fallback equals the closed lot" }
  - { id: ERR_ALLOCATION_NOT_OPEN, http: 409, condition: "Permit purchase requires allocation status == OPEN" }
  - { id: ERR_ALLOCATION_NOT_WAITLISTING, http: 409, condition: "Waitlist join requires allocation status == WAITLISTING" }
  - { id: ERR_OFFER_NOT_PENDING, http: 409, condition: "Claim requires entry status == OFFERED; withdraw requires WAITING or OFFERED" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Cancel requires permit status ACTIVE or SUSPENDED" }
  - { id: ERR_CITATION_NOT_ISSUED, http: 409, condition: "Pay/appeal require status ISSUED; decide-appeal requires UNDER_APPEAL" }
  - { id: ERR_CLOSURE_INVALID_STATE, http: 409, condition: "Activate/cancel require SCHEDULED; lift requires ACTIVE" }
  - { id: ERR_ROUTE_INVALID_STATE, http: 409, condition: "Activate requires PLANNED or SUSPENDED; suspend requires ACTIVE" }
  - { id: ERR_PLATE_NOT_REGISTERED, http: 422, condition: "Citation plate does not resolve to any existing permit" }
  - { id: ERR_CLOSURE_OVERLAP, http: 409, condition: "Another SCHEDULED/ACTIVE closure on the same lot intersects [starts_at, ends_at) (half-open; adjacency allowed)" }
  - { id: ERR_DUPLICATE_ACTIVE_PERMIT, http: 409, condition: "Same plate already covered by an ACTIVE/SUSPENDED permit on an inclusive [valid_from, valid_to] window that intersects (touching dates count)" }
  - { id: ERR_FLEET_WINDOW_CONFLICT, http: 409, condition: "Another non-terminal route in the same fleet_group has a daily window whose gap to this window is < 30 minutes" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "Claim after offer_expires_at (strictly later); the entry is moved OFFERED -> EXPIRED and requeued" }
  - { id: ERR_PATRON_INELIGIBLE, http: 403, condition: "Patron role not in allocation.eligible_roles, or residency_rule not satisfied" }
  - { id: ERR_INELIGIBLE_COMMUTE_MODE, http: 403, condition: "Incentive enrollment requires primary_commute_mode != DRIVE_ALONE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Appeal decider's X-User-ID equals the citation's issued_by_officer_id" }
  - { id: ERR_DUPLICATE_ALLOCATION_CODE, http: 409, condition: "An allocation with the same (lot_id, permit_code) already exists" }
  - { id: ERR_ALREADY_WAITLISTED, http: 409, condition: "Patron already has a WAITING or OFFERED entry on this allocation" }
  - { id: ERR_APPEAL_ALREADY_EXISTS, http: 409, condition: "Citation has already been appealed (appeal_outcome != NONE)" }
  - { id: ERR_ACCOUNT_EXISTS, http: 409, condition: "Patron already has an incentive account" }
  - { id: ERR_PATRON_BLOCKED, http: 402, condition: "Patron standing == BLOCKED (outstanding_balance_cents >= 10000) blocks permit purchase and offer claim" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 422, condition: "apply_credit_cents exceeds the patron's incentive credit balance, or no account exists" }
  - { id: ERR_DISPLACEMENT_OVER_CAPACITY, http: 409, condition: "Fallback allocation cannot absorb the displaced permits within its quota" }
  - { id: ERR_INSUFFICIENT_FUNDING, http: 402, condition: "fund.available_balance_cents < route.annual_operating_cost_cents at activation" }
  - { id: ERR_INSUFFICIENT_SHUTTLE_CAPACITY, http: 422, condition: "daily_capacity < projected_daily_ridership at activation (equality would pass)" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 422, condition: "points_balance < blocks * 500 at redemption" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Commuter
    description: "Campus member (student/staff/faculty) buying permits, joining waitlists, paying and appealing citations, participating in the incentive program"
    identity: "entity_backed:Patron"
    exclusive_operations:
      - "POST /parking/citations/{citationId}/pay"
      - "POST /parking/citations/{citationId}/appeal"
      - "POST /parking/waitlist-entries/{entryId}/claim"
      - "POST /parking/waitlist-entries/{entryId}/withdraw"
      - "POST /parking/incentive-accounts"
      - "POST /parking/incentive-accounts/{accountId}/redeem"
    shared_operations:
      - "POST /parking/permits and POST /parking/permits/{permitId}/cancel (shared with ParkingAdmin; Commuter limited to own patron_id)"
      - "POST /parking/waitlist-entries (shared with ParkingAdmin)"
      - "All GET endpoints (shared with all roles)"

  - name: ParkingAdmin
    description: "Parking & transportation services operator: manages lots, allocations, closures, shuttle routes, funds, incentive accruals, waitlist offer rounds, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /parking/patrons"
      - "POST /parking/lots"
      - "POST /parking/allocations, PATCH /parking/allocations/{allocationId}"
      - "POST /parking/allocations/{allocationId}/extend-offers"
      - "POST /parking/closures and activate/lift/cancel"
      - "POST /parking/shuttle-routes and activate/suspend/ridership-logs"
      - "POST /parking/incentive-accounts/{accountId}/accruals"
      - "POST /parking/transportation-funds"
      - "POST /parking/_clock/set_current_utc"
    shared_operations:
      - "POST /parking/permits, POST /parking/permits/{permitId}/cancel, POST /parking/waitlist-entries (on behalf of any patron)"
      - "All GET endpoints"

  - name: EnforcementOfficer
    description: "LPR enforcement officer issuing citations; identified by X-User-ID which is recorded as issued_by_officer_id"
    identity: "opaque"
    exclusive_operations:
      - "POST /parking/citations"
    shared_operations:
      - "All GET endpoints"

  - name: AppealsOfficer
    description: "Citation appeals adjudicator; may not decide an appeal on a citation they issued (segregation of duties with EnforcementOfficer via X-User-ID comparison)"
    identity: "opaque"
    exclusive_operations:
      - "POST /parking/citations/{citationId}/decide-appeal"
    shared_operations:
      - "All GET endpoints"
