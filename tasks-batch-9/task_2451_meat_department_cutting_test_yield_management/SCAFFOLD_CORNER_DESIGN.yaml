            - "TrimLot.${tlb_id}.country_of_origin == CAN with cost_per_lb_cents == 225.0000 and lean_pct == 90.0"
            - "After START: GrindRun.${gr1_id}.batch_weight_lb == 20.00, blended_lean_pct == 85.00, blend_cost_per_lb_cents == 212.5000, coo_label == MULTIPLE"
