            - "GET /exchange-network/disputes/${disp} — status == \"UNDER_REVIEW\" (the rejected third request leaves the cycle where the second response left it) and round_count == 2"
            - "GET /exchange-network/disputes/${disp} — granted_power_adjustment == 0 and resolution_note == null"
            - "GET /exchange-network/deposits/${dep} — awarded_power == 82 (unchanged by the dispute lifecycle)"
            - "GET /exchange-network/members/${m1} — trading_power_balance == 82"

      - name: deposit_status_and_rental_status_advance_independently
        entity: Deposit
        dimensions: [deposit_status, rental_status]
        why_hard: >-
          The getaway sweep moves rental_status NOT_LISTED -> LISTED_GETAWAY and forfeits the
          deposit's remaining power while leaving deposit_status at BANKED. An implementation that
          models one combined status enum will report something like "LISTED" instead of the pair
          (BANKED, LISTED_GETAWAY), and withdrawing the offer must restore rental_status to
          NOT_LISTED and re-credit the power without ever touching deposit_status. The
          settlement_power frozen by the sweep uses a NEGATIVE lead time (-700 days), so the 0.85
          lead factor branch must be reachable.
        test_recipe:
          setup: >-
            Tier PLUS. Resort A with units_per_size 2, demand_index 4, GOLD_CROWN and a GOLD band
            04-01..06-30, affiliated at the default clock. Member M1 on PLUS, dues-paid through
            2030-12-31, banks a ONE_BR week checking in 2027-06-15, worth 82, which expires
