              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v0: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v0}" }
              as: ProgramCoordinator
              captures: { resv_a: $.data.id }
          trigger:
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", setup_minutes: 20, teardown_minutes: 15, expected_program_version: "${prog_v0}" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /library/programs/${prog}"
              payload: {}
              as: ProgramCoordinator
              captures: { prog_v1: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
