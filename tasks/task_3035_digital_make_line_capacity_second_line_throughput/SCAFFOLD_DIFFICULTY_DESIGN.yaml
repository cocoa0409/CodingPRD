          UNVERIFIED -> MISMATCHED -> VERIFIED via a rework-and-reverify loop.
          A FAIL verification does not terminate the order; the rework loop
          returns accuracy to VERIFIED so mark-ready can proceed. Distinct shape
          (cycle) from the parallel-axes instance, on the same entity but a
          different state dimension.
