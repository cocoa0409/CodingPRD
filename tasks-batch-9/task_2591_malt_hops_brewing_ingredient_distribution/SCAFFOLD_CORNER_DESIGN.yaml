              as: WarehouseOperator
              captures: { sw_err_zero: $.data.error_id }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${sw_o_id}", cold_storage_zone_id: "${sw_zone_id}", expected_sales_order_version: "${sw_o_v}", pallet_count: 1, stage_from: "2026-08-01T06:00:00Z", stage_until: "2026-08-01T05:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { sw_err_inverted: $.data.error_id }
            - call: "POST /cold-chain-shipments"
              payload: { sales_order_id: "${sw_o_id}", cold_storage_zone_id: "${sw_zone_id}", expected_sales_order_version: "${sw_o_v}", pallet_count: 1, stage_from: "2026-08-01T06:00:00Z", stage_until: "2026-08-01T07:00:00Z", reefer_setpoint_c: 2.0, reefer_tolerance_c: 2.0 }
              as: WarehouseOperator
              captures: { sw_s_id: $.data.id, sw_s_status: $.data.status }
          assert:
            - "zero-length window: HTTP 422 with ${sw_err_zero} == ERR_INVALID_STAGING_WINDOW"
            - "inverted window: HTTP 422 with ${sw_err_inverted} == ERR_INVALID_STAGING_WINDOW"
            - "strictly forward window: HTTP 201 with ${sw_s_status} == STAGED"
            - "the two refusals did not consume the order's version: ColdStorageZone.${sw_zone_id}.occupied_pallets is 0 while the clock sits before 06:00 and the accepted shipment is the only row"
            - "ColdChainShipment.${sw_s_id}.excursion_minutes == 0, reading_count == 0 and held_for_credit == false"

      - name: cold_chain_certification_is_demanded_only_by_reefer_orders
        claim_type: Conditional validation
        grounds:
          - validations[priority=21]
          - errors.ERR_COLD_CHAIN_NOT_CERTIFIED
          - entities.SalesOrder.fields.requires_cold_chain
        distinguishing_aspect: "The certification gate keys off the ORDER's derived requires_cold_chain rather than the brewer's ambition, so the same uncertified brewer confirms an ambient malt order and is refused on a hop order, and adding a single cold-chain line is what flips the outcome."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with cold_chain_certified false and credit_limit_cents 5000000."
            - "Ambient PALE-ALE with a RELEASED 5000 lb lot; Citra with cold_storage_required true."
            - "Order AMBIENT holds a 1000 lb MALT line. Order REEFER holds an 880 lb SPOT Citra line."
