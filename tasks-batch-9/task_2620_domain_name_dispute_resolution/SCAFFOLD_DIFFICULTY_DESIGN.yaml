  - rule_id: priority_pair_validation_conflict
    instances:

      - name: case_state_gate_at_priority_40_beats_response_deadline_at_priority_71
        grounds:
          - validations[priority=40].ERR_CASE_NOT_IN_RESPONSE_WINDOW
          - validations[priority=71].ERR_RESPONSE_DEADLINE_PASSED
          - state_machines.Case.COMMENCED_to_DEFAULT
          - calculations.response_deadline_projection
        distinguishing_aspect: |
          On the defaulted case both rules are live at the same clock reading - the status is DEFAULT
          rather than COMMENCED and the deadline plus grace has lapsed - and the ladder must return
          ERR_CASE_NOT_IN_RESPONSE_WINDOW with HTTP 409 rather than ERR_RESPONSE_DEADLINE_PASSED. A
