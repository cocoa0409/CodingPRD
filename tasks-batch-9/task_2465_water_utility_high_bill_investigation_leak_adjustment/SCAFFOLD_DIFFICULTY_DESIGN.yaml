  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      # -------- depth 4, trigger = approve a leak adjustment (fiscal chain) --------
      - name: transitive_cascade_approve_adjustment_ledger_to_balance_to_credit_to_service
        grounds:
          - endpoints[POST /leak-adjustments/{id}/approve]
          - state_machines.LeakAdjustment
          - state_machines.ServiceAccount
          - calculations.account_balance
          - calculations.account_credit_status
          - entities.AccountLedgerEntry
          - entities.ServiceAccount.fields.shutoff_scheduled_for
        distinguishing_aspect: |
          TRIGGER: POST /leak-adjustments/{id}/approve. DEPTH 4, all fiscal:
          link 1 writes two AccountLedgerEntry rows (-9154 credit and +1500 admin fee);
          link 2 replays the ledger into ServiceAccount.balance_cents (9887 becomes 2233);
          link 3 re-derives credit_status from the new balance (PAST_DUE becomes CURRENT because
          2233 is at or below the 5000 threshold);
          link 4 re-derives service_status from the new credit_status (SHUTOFF_HELD becomes ACTIVE
          and shutoff_scheduled_for is nulled).
          Each link is observable and each is strictly caused by the one before it: had the
          payment been 20000 instead of 21000 the balance would land at 3233 and links 3 and 4
          would still fire, but had it been 5000 the balance would land at 18233 and links 3 and 4
          would NOT fire while links 1 and 2 still would.
        test_recipe:
          setup:
            - "RS-STD-2026, the four SUMMER periods, and ServiceAccount ACC-1002 with a 1.0 inch master (initial_register_value 100000) exist."
            - "Reads 100000 / 104000 / 108000 / 112000 / 124000 give four bills of 4000, 4000, 4000 and 12000 gallons; all four are ISSUED and the receivable is 30887."
            - "A 21000-cent payment leaves balance_cents 9887 with credit_status PAST_DUE, so a shutoff can be scheduled and then held by the investigation."
            - "The determination is recorded by csr-1 and the approval is performed by sup-1, a different user, so segregation of duties is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
