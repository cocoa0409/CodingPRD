  # ===========================================================================
  # Section 2 — State Machines (Table 2): valid/invalid transitions, terminal
  # lockdown, initial state, precondition enforcement, side effects, guarded
  # (cross-entity) transitions. §1.8 already covers: the harassment appeal
  # cycle, the deployment revision loop + safety fork, the three cascades, and
  # the notice day-release side effects — those land as excluded_because stubs.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: deployment_board_from_scheduled_rejected_safety_check_required
        claim_type: invalid_transition
        grounds:
          - state_machines.Deployment.READY_TO_DEPLOY_to_AT_SEA
          - errors[ERR_SAFETY_CHECK_REQUIRED]
        distinguishing_aspect: |
          POST /deployments/{id}/board is valid only from READY_TO_DEPLOY; from
          SCHEDULED (no PASS inspection recorded) the board attempt fails with
          ERR_SAFETY_CHECK_REQUIRED (409) and no transition occurs.
        test_recipe:
          setup:
            - "Deployment D in SCHEDULED (no safety inspection yet) for vessel V / observer OBS"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-SM1", name: "SM1 Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
