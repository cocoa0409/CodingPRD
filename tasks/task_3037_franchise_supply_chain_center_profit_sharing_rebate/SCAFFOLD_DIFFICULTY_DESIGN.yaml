              as: SupplyChainAdmin
              captures: { store_x_id: $.data.id, store_x_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_x_id}/activate"
              payload: {}
              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/stores/${store_x_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_x_id}"
              captures: { po_x_id: $.data.id, po_x_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_x_id}/purchase-orders/${po_x_id}/lines"
              payload: { product_id: "${product_id}", quantity: 99 }
              as: StoreManager
              as_user_id: "${store_x_id}"
            - call: "POST /supply-centers/${center_id}/stores/${store_x_id}/purchase-orders"
              payload: { week_start_date: "2026-09-07T00:00:00Z" }
              as: StoreManager
              as_user_id: "${store_x_id}"
              captures: { po_y_id: $.data.id, po_y_v: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_x_id}/purchase-orders/${po_y_id}/lines"
              payload: { product_id: "${product_id}", quantity: 100 }
              as: StoreManager
              as_user_id: "${store_x_id}"
          trigger:
            - call: "GET /supply-centers/${center_id}/stores/${store_x_id}"
              payload: {}
              as: Any
              captures: { store_x_v_fresh: $.data.version }
            - call: "POST /supply-centers/${center_id}/stores/${store_x_id}/purchase-orders/${po_x_id}/submit"
              payload: { expected_store_version: "${store_x_v_fresh}" }
              as: StoreManager
              as_user_id: "${store_x_id}"
            - call: "GET /supply-centers/${center_id}/stores/${store_x_id}"
