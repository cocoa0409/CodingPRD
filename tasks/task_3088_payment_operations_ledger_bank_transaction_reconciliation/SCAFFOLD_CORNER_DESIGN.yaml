          name: Defaults Ledger
          currency: EUR
        as: PlatformAdmin
        captures:
          c6_ledger: $.data.id
      assert:
      - Ledger.${c6_ledger}.period_index == 1 and period_closed_through_index == 0 and status == OPEN
