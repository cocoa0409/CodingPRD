# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1-§1.7 that §1.8 does not already cover.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: create_jurisdiction_returns_computed_defaults
        claim_type: Creation
        grounds:
          - 'entities.Jurisdiction'
          - 'endpoints."POST /jurisdictions"'
        distinguishing_aspect: "POST /jurisdictions with required fields -> 201; total_population==0, ideal_district_population==0, version==1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 3 }
              as: Cartographer
              captures: { jid: $.data.id }
          trigger:
            - call: "GET /jurisdictions/${jid}"
              payload: {}
              as: Cartographer
          assert:
            - "Jurisdiction.${jid}.total_population == 0"
            - "Jurisdiction.${jid}.ideal_district_population == 0"
            - "Jurisdiction.${jid}.version == 1"

      - name: jurisdiction_totals_recompute_on_block_add
        claim_type: Computed Fields
        grounds:
          - 'entities.Jurisdiction.fields.total_population'
          - 'calculations.jurisdiction_ideal_population'
        distinguishing_aspect: "After adding blocks 600 and 900 to a target_district_count=3 jurisdiction, total_population==1500 and ideal_district_population==500.0000."
        test_recipe:
          setup: ["jurisdiction with target_district_count=3"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 3 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: 600, voting_age_population: 500, minority_vap: 100, registered_voters: 400 }
              as: Cartographer
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G2", population: 900, voting_age_population: 700, minority_vap: 200, registered_voters: 500 }
              as: Cartographer
          trigger:
            - call: "GET /jurisdictions/${jid}"
              payload: {}
              as: Cartographer
          assert:
            - "Jurisdiction.${jid}.total_population == 1500"
            - "Jurisdiction.${jid}.ideal_district_population == 500.0"

      - name: get_jurisdiction_not_found
        claim_type: Not Found
        grounds:
          - 'errors[ERR_JURISDICTION_NOT_FOUND]'
          - 'endpoints."GET /jurisdictions/{jurisdictionId}"'
        distinguishing_aspect: "GET /jurisdictions/{random uuid} -> 404 ERR_JURISDICTION_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /jurisdictions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Cartographer
          assert: ["response error_id == ERR_JURISDICTION_NOT_FOUND"]

      - name: create_census_block_negative_population_rejected
        claim_type: Type Constraints
        grounds:
          - 'entities.CensusBlock.fields.population'
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "POST census-block with population -5 (violates >= 0) -> 422 ERR_VALIDATION."
        test_recipe:
          setup: ["jurisdiction J"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
          trigger:
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: -5, voting_age_population: 500, minority_vap: 100, registered_voters: 400 }
              as: Cartographer
          assert: ["response error_id == ERR_VALIDATION"]

      - name: census_block_vap_exceeds_population_rejected
        claim_type: Type Constraints
        grounds:
          - 'entities.CensusBlock.fields.voting_age_population'
          - 'errors[ERR_VALIDATION]'
          - 'validations[priority=12]'
        distinguishing_aspect: "voting_age_population (900) > population (800) -> 422 ERR_VALIDATION."
        test_recipe:
          setup: ["jurisdiction J"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
          trigger:
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: 800, voting_age_population: 900, minority_vap: 100, registered_voters: 400 }
              as: Cartographer
          assert: ["response error_id == ERR_VALIDATION"]

      - name: duplicate_geoid_within_jurisdiction_rejected
        claim_type: Type Constraints
        grounds:
          - 'errors[ERR_DUPLICATE_GEOID]'
          - 'validations[priority=7]'
        distinguishing_aspect: "Second census block reusing geoid 'G1' in the same jurisdiction -> 409 ERR_DUPLICATE_GEOID."
        test_recipe:
          setup: ["jurisdiction J with block geoid G1"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: 800, voting_age_population: 600, minority_vap: 100, registered_voters: 400 }
              as: Cartographer
          trigger:
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
          assert: ["response error_id == ERR_DUPLICATE_GEOID"]

      - name: compliance_check_is_immutable_no_version
        claim_type: Immutability
        grounds:
          - 'entities.ComplianceCheck'
        distinguishing_aspect: "ComplianceCheck has common_fields:false — it exposes id and created_at but no version/updated_at and has no update endpoint."
        test_recipe:
          setup: ["a plan with at least one district and a compliance check run"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id }
            - call: "POST /plans/${pid}/compliance-checks"
              payload: { check_type: "CONTIGUITY" }
              as: Demographer
              captures: { cc: $.data.id }
          trigger:
            - call: "GET /plans/${pid}/compliance-checks"
              payload: {}
              as: Demographer
          assert:
            - "the ComplianceCheck ${cc} in the list has no version field"
            - "ComplianceCheck.${cc}.result_status == PASS (no districts -> vacuously contiguous)"

      - name: incumbent_retained_computed_true
        claim_type: Computed Fields
        grounds:
          - 'entities.District.fields.incumbent_retained'
          - 'entities.District.fields.incumbent_home_geoid'
        distinguishing_aspect: "A district whose incumbent_home_geoid == 'A' with block A ACTIVE-assigned to it reports incumbent_retained == true."
        test_recipe:
          setup: ["single-district plan; District 1 has incumbent_home_geoid 'A'; block A assigned to it"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1000, voting_age_population: 800, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "P" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1, incumbent_name: "Rep. Lee", incumbent_home_geoid: "A" }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
          trigger:
            - call: "GET /plans/${pid}/districts"
              payload: {}
              as: Cartographer
          assert:
            - "District.${d1}.incumbent_retained == true"

  # ------------------------------------------------------------- State Machines
  - section: state_machines
    instances:
      - name: hold_hearing_before_start_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.Hearing.SCHEDULED_to_HELD'
          - 'errors[ERR_HEARING_NOT_STARTED]'
        distinguishing_aspect: "With the logical clock at the 2026-05-01 default, holding a hearing scheduled for 2026-06-01T10:00 -> 409 ERR_HEARING_NOT_STARTED."
        test_recipe:
          setup: ["F1 plan at HEARING_SCHEDULED with hearing H1 at 2026-06-01T10:00; clock left at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jh", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Ph" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
            - call: "POST /plans/${pid}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${pid}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
              as: Demographer
            - call: "POST /plans/${pid}/open-comment"
              payload: {}
              as: CommissionChair
            - call: "POST /jurisdictions/${jid}/venues"
              payload: { name: "Hall", capacity: 100 }
              as: ElectionClerk
              captures: { vid: $.data.id }
            - call: "POST /plans/${pid}/hearings"
              payload: { venue_id: "${vid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: CommissionChair
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /hearings/${h1}/hold"
              payload: {}
              as: CommissionChair
          assert: ["response error_id == ERR_HEARING_NOT_STARTED"]

      - name: cancel_hearing_reverts_plan_to_comment_open
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.Hearing.SCHEDULED_to_CANCELLED'
          - 'state_machines.RedistrictingPlan.COMMENT_OPEN_to_HEARING_SCHEDULED'
        distinguishing_aspect: "Cancelling the only SCHEDULED hearing on a HEARING_SCHEDULED plan reverts the plan to COMMENT_OPEN (cross-entity bubble-up)."
        test_recipe:
          setup: ["F1 plan at HEARING_SCHEDULED with a single SCHEDULED hearing H1"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jcc", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pcc" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d2}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
            - call: "POST /plans/${pid}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${pid}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
              as: Demographer
            - call: "POST /plans/${pid}/open-comment"
              payload: {}
              as: CommissionChair
            - call: "POST /jurisdictions/${jid}/venues"
              payload: { name: "Hall", capacity: 100 }
              as: ElectionClerk
              captures: { vid: $.data.id }
            - call: "POST /plans/${pid}/hearings"
              payload: { venue_id: "${vid}", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }
              as: CommissionChair
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /hearings/${h1}/cancel"
              payload: {}
              as: CommissionChair
          assert:
            - "Hearing.${h1}.status == CANCELLED"
            - "RedistrictingPlan.${pid}.status == COMMENT_OPEN"

      - name: retire_nonempty_precinct_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.Precinct.ACTIVE_to_RETIRED'
          - 'errors[ERR_PRECINCT_NOT_EMPTY]'
        distinguishing_aspect: "Retiring a precinct that still contains an ACTIVE census block -> 409 ERR_PRECINCT_NOT_EMPTY."
        test_recipe:
          setup: ["precinct PR containing one block"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jr", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "G1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
              captures: { blk: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${blk}"] }
              as: ElectionClerk
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /precincts/${pr}/retire"
              payload: {}
              as: ElectionClerk
          assert: ["response error_id == ERR_PRECINCT_NOT_EMPTY"]

      - name: split_non_partitioning_groups_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.Precinct.ACTIVE_to_SPLIT'
          - 'errors[ERR_INCOMPLETE_PARTITION]'
          - 'validations[priority=7]'
        distinguishing_aspect: "Split groups that omit one of the precinct's blocks (['S1'] and ['S1']) do not partition its blocks -> 409 ERR_INCOMPLETE_PARTITION."
        test_recipe:
          setup: ["precinct PR containing blocks S1 and S2"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jsp2", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "S1", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
              captures: { s1: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "S2", population: 700, voting_age_population: 600, minority_vap: 200, registered_voters: 500 }
              as: Cartographer
              captures: { s2: $.data.id }
            - call: "POST /jurisdictions/${jid}/precincts"
              payload: { name: "PR", census_block_ids: ["${s1}", "${s2}"] }
              as: ElectionClerk
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /precincts/${pr}/split"
              payload: { child_a_name: "A", child_a_block_geoids: ["S1"], child_b_name: "B", child_b_block_geoids: ["S1"] }
              as: ElectionClerk
          assert: ["response error_id == ERR_INCOMPLETE_PARTITION"]

      - name: submit_review_incomplete_partition_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.RedistrictingPlan.DRAFT_to_UNDER_REVIEW'
          - 'errors[ERR_INCOMPLETE_PARTITION]'
        distinguishing_aspect: "submit-review with block B unassigned (only A assigned) -> 409 ERR_INCOMPLETE_PARTITION."
        test_recipe:
          setup: ["plan with District 1; block A assigned, block B unassigned"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jip", state_code: "CA", target_district_count: 2 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pip" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
          trigger:
            - call: "POST /plans/${pid}/submit-review"
              payload: {}
              as: Cartographer
          assert: ["response error_id == ERR_INCOMPLETE_PARTITION"]

      - name: open_comment_deviation_fail_blocks
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.RedistrictingPlan.UNDER_REVIEW_to_COMMENT_OPEN'
          - 'errors[ERR_DEVIATION_CHECK_FAILED]'
          - 'calculations.compliance_check_result_status'
        distinguishing_aspect: "With both blocks in District 1 (+/-100%), the POPULATION_DEVIATION check is FAIL, so open-comment -> 422 ERR_DEVIATION_CHECK_FAILED."
        test_recipe:
          setup: ["plan UNDER_REVIEW with FAIL deviation check (both blocks in District 1)"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Joc", state_code: "CA", target_district_count: 2 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Poc" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 1 }
              as: Cartographer
              captures: { d1: $.data.id }
            - call: "POST /plans/${pid}/districts"
              payload: { district_number: 2 }
              as: Cartographer
              captures: { d2: $.data.id }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkA}", expected_plan_version: "${pv0}" }
              as: Cartographer
            - call: "GET /plans/${pid}"
              payload: {}
              as: Cartographer
              captures: { pv1: $.data.version }
            - call: "POST /plans/${pid}/block-assignments"
              payload: { district_id: "${d1}", census_block_id: "${blkB}", expected_plan_version: "${pv1}" }
              as: Cartographer
            - call: "POST /plans/${pid}/submit-review"
              payload: {}
              as: Cartographer
            - call: "POST /plans/${pid}/compliance-checks"
              payload: { check_type: "POPULATION_DEVIATION" }
              as: Demographer
          trigger:
            - call: "POST /plans/${pid}/open-comment"
              payload: {}
              as: CommissionChair
          assert: ["response error_id == ERR_DEVIATION_CHECK_FAILED"]

      - name: adopt_without_held_hearing_rejected
        claim_type: Precondition Enforcement
        grounds:
          - 'state_machines.RedistrictingPlan.HEARING_SCHEDULED_to_ADOPTED'
          - 'errors[ERR_NO_HELD_HEARING]'
        distinguishing_aspect: "Adopting a compliant HEARING_SCHEDULED plan whose hearing is still SCHEDULED (never HELD) -> 422 ERR_NO_HELD_HEARING."
        test_recipe:
          setup: ["F1 plan at HEARING_SCHEDULED, hearing not yet held, adopter != creator"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jnh", state_code: "CA", target_district_count: 2, required_majority_minority_districts: 0 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 1049, voting_age_population: 800, minority_vap: 500, registered_voters: 700 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 951, voting_age_population: 700, minority_vap: 200, registered_voters: 600 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pnh" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
