scaffold_corner_design:

  # =====================================================================
  - section: entities
    instances:
      - name: sku_create_returns_all_fields_and_computed_availability
        claim_type: Creation
        grounds: ["entities.SKU", "entities.SKU.fields.availability_status"]
        distinguishing_aspect: "POST /skus with all required fields returns 201; server-minted id/created_at/version present and availability_status computed IN_STOCK for on_hand 10, reserved 0."
        test_recipe:
          setup: ["Store S exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 10 }
              as: StoreStaff
              captures: { a_id: $.data.id }
          assert:
            - "SKU.${a_id}.availability_status == IN_STOCK"
            - "SKU.${a_id}.reserved_qty == 0"
            - "SKU.${a_id}.version == 1"

      - name: sku_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.SKU", "errors[ERR_SKU_NOT_FOUND]"]
        distinguishing_aspect: "GET /skus/{unknown-uuid} returns ERR_SKU_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /skus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
          assert:
            - "response.error_id == ERR_SKU_NOT_FOUND"
            - "response.http_status == 404"

      - name: sku_create_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["entities.SKU.fields.base_price_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /skus omitting required base_price_cents returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Store S exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3" }
              as: StoreStaff
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: store_create_defaults_applied_when_omitted
        claim_type: Defaults
        grounds: ["entities.Store.fields.open_minute", "entities.Store.fields.pickup_station_count"]
        distinguishing_aspect: "POST /stores omitting open_minute/close_minute/pickup_station_count applies defaults 540/1200/2."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          assert:
            - "Store.${s_id}.open_minute == 540"
            - "Store.${s_id}.close_minute == 1200"
            - "Store.${s_id}.pickup_station_count == 2"

      - name: sku_create_invalid_enum_category_returns_validation
        claim_type: Type Constraints
        grounds: ["entities.SKU.fields.category", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /skus with category outside {CLOTHING,GEAR,TOY,FEEDING,NURSERY} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Store S exists."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "SPACESHIP", size_stage: "M0_3", base_price_cents: 4000 }
              as: StoreStaff
          assert:
            - "response.error_id == ERR_VALIDATION"
            - "response.http_status == 422"

      - name: customer_loyalty_tier_computed_from_seed_lifetime_spend
        claim_type: Computed Fields
        grounds: ["entities.Customer.fields.loyalty_tier", "calculations.loyalty_accrual"]
        distinguishing_aspect: "POST /customers with initial_lifetime_spend_cents 60000 yields computed loyalty_tier SILVER (>=50000, <150000)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", initial_lifetime_spend_cents: 60000 }
              as: Anonymous
              captures: { c_id: $.data.id }
          assert:
            - "Customer.${c_id}.loyalty_tier == SILVER"
            - "Customer.${c_id}.loyalty_points == 0"

      - name: skus_list_returns_pagination_envelope
        claim_type: Listing
        grounds: ["entities.SKU", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /skus returns an array envelope with total_count and has_more; one SKU created -> total_count >= 1."
        test_recipe:
          setup: ["Store S with one SKU A."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 10 }
              as: StoreStaff
          trigger:
            - call: "GET /skus"
              payload: { store_id: "${s_id}" }
              as: Anonymous
          assert:
            - "response.response_type == array"
            - "response.meta present and data is a list with total_count >= 1"

  # =====================================================================
  - section: state_machines
    instances:
      - name: registry_created_is_draft_initial_state
        claim_type: Initial State
        grounds: ["state_machines.Registry", "entities.Registry.fields.status"]
        distinguishing_aspect: "A newly created Registry starts in status DRAFT with completion_pct 0."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
          assert:
            - "Registry.${r_id}.status == DRAFT"
            - "Registry.${r_id}.completion_pct == 0"

      - name: activate_already_active_registry_returns_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.Registry.DRAFT_to_ACTIVE", "errors[ERR_INVALID_REGISTRY_STATE]"]
        distinguishing_aspect: "Activating a registry that is already ACTIVE returns ERR_INVALID_REGISTRY_STATE (409); no second transition."
        test_recipe:
          setup: ["Registry R activated (ACTIVE)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_INVALID_REGISTRY_STATE"
            - "response.http_status == 409"

      - name: complete_pickup_on_reserved_order_returns_not_ready
        claim_type: invalid_transition
        grounds: ["state_machines.Order", "errors[ERR_ORDER_NOT_READY]"]
        distinguishing_aspect: "complete-pickup on an order whose fulfillment_status is RESERVED (not READY) returns ERR_ORDER_NOT_READY (409)."
        test_recipe:
          setup: ["Order O created (RESERVED, UNPAID)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 10 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /orders/${o_id}/complete-pickup"
              payload: {}
              as: StoreStaff
          assert:
            - "response.error_id == ERR_ORDER_NOT_READY"
            - "response.http_status == 409"

      - name: cancel_picked_up_order_returns_not_cancellable
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Order", "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "From terminal fulfillment_status PICKED_UP, cancel returns ERR_ORDER_NOT_CANCELLABLE (409)."
        test_recipe:
          setup: ["Order O paid (CARD), marked ready, and picked up (fulfillment PICKED_UP)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 10 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
            - call: "POST /orders/${o_id}/pay"
              payload: { payment_method: "CARD" }
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /orders/${o_id}/mark-ready"
              payload: {}
              as: StoreStaff
            - call: "POST /orders/${o_id}/complete-pickup"
              payload: {}
              as: StoreStaff
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "response.error_id == ERR_ORDER_NOT_CANCELLABLE"
            - "response.http_status == 409"

      - name: trade_in_reject_issues_no_store_credit
        claim_type: Side Effect Execution
        grounds: ["state_machines.TradeIn.SUBMITTED_to_REJECTED", "entities.Customer.fields.store_credit_balance_cents"]
        distinguishing_aspect: "Rejecting a SUBMITTED trade-in moves it to REJECTED and leaves final_value_cents 0 and the customer's store_credit_balance_cents unchanged at 0."
        test_recipe:
          setup: ["TradeIn T submitted (GOOD) for SKU A by Customer C (0 credit)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${c_id}", sku_id: "${a_id}", submitted_condition: "GOOD" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${t_id}/reject"
              payload: {}
              as: StoreStaff
          assert:
            - "TradeIn.${t_id}.status == REJECTED"
            - "TradeIn.${t_id}.final_value_cents == 0"
            - "Customer.${c_id}.store_credit_balance_cents == 0"

      - name: special_order_fulfill_decrements_stock
        claim_type: Side Effect Execution
        grounds: ["state_machines.SpecialOrder.ALLOCATED_to_FULFILLED", "entities.SKU.fields.on_hand_qty"]
        distinguishing_aspect: "Fulfilling an ALLOCATED special order (SKU on_hand 5, reserved 1) sets status FULFILLED and drops SKU on_hand_qty to 4 and reserved_qty to 0."
        test_recipe:
          setup: ["SKU A on_hand 5; SpecialOrder SO for A qty 1 ALLOCATED (reserved 1)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 5 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c_id}", sku_id: "${a_id}", store_id: "${s_id}", qty: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_id}/fulfill"
              payload: {}
              as: StoreStaff
          assert:
            - "SpecialOrder.${so_id}.status == FULFILLED"
            - "SKU.${a_id}.on_hand_qty == 4"
            - "SKU.${a_id}.reserved_qty == 0"

      - name: display_onto_closed_shelf_returns_shelf_closed
        claim_type: guarded_transition
        grounds: ["state_machines.ConsignmentShelf.OPEN_to_CLOSED", "errors[ERR_SHELF_CLOSED]"]
        distinguishing_aspect: "Displaying a RECEIVED item onto a CLOSED shelf returns ERR_SHELF_CLOSED (409) — cross-entity guard ConsignmentItem->ConsignmentShelf."
        test_recipe:
          setup: ["Store S; shelf SH closed; item CI RECEIVED."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /stores/${s_id}/consignment-shelves"
              payload: { shelf_code: "SH1", capacity: 5, season: "SPRING_SUMMER" }
              as: StoreStaff
              captures: { sh_id: $.data.id }
            - call: "POST /consignment-shelves/${sh_id}/close"
              payload: {}
              as: StoreStaff
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /consignment-items"
              payload: { consignor_customer_id: "${c_id}", store_id: "${s_id}", title: "Coat", condition: "GOOD", season: "IN_SEASON", list_price_cents: 4000 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ci_id: $.data.id }
          trigger:
            - call: "POST /consignment-items/${ci_id}/display"
              payload: { shelf_id: "${sh_id}", display_start: "2026-07-01T00:00:00Z", display_end: "2026-07-31T00:00:00Z" }
              as: StoreStaff
          assert:
            - "response.error_id == ERR_SHELF_CLOSED"
            - "response.http_status == 409"

  # =====================================================================
  - section: calculations
    instances:
      - name: order_pricing_bronze_no_discount_total_equals_subtotal
        claim_type: Correct Result
        grounds: ["calculations.order_pricing", "entities.Order.fields.total_before_credit_cents"]
        distinguishing_aspect: "BRONZE buyer (0%) with no registry: loyalty_discount_cents 0, applied_discount_cents 0, so total_before_credit_cents == subtotal_cents == 4000 for one 4000c unit."
        test_recipe:
          setup: ["Store S; SKU A 4000 on_hand 10; Customer C BRONZE."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 10 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", store_id: "${s_id}", lines: [ { sku_id: "${a_id}", qty: 1 } ], pickup_start: "2026-07-01T10:00:00Z", pickup_end: "2026-07-01T10:30:00Z", station_no: 1 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { o_id: $.data.id }
          assert:
            - "Order.${o_id}.subtotal_cents == 4000"
            - "Order.${o_id}.loyalty_discount_cents == 0"
            - "Order.${o_id}.total_before_credit_cents == 4000"

      - name: trade_in_quoted_value_good_condition_percent_of_retail
        claim_type: Variant Selection
        grounds: ["calculations.trade_in_valuation", "entities.TradeIn.fields.quoted_value_cents"]
        distinguishing_aspect: "QUOTED at submission for GOOD on SKU base 10000: round(10000 * 0.70 * 0.30) = 2100 (no cap applied at quote)."
        test_recipe:
          setup: ["Store S; SKU A base 10000; Customer C."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${c_id}", sku_id: "${a_id}", submitted_condition: "GOOD" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { t_id: $.data.id }
          assert:
            - "TradeIn.${t_id}.quoted_value_cents == 2100"
            - "TradeIn.${t_id}.status == SUBMITTED"

      - name: sku_availability_low_stock_at_threshold_three
        claim_type: Constants Applied
        grounds: ["calculations.sku_availability", "entities.SKU.fields.availability_status"]
        distinguishing_aspect: "available = 3 (<= LOW_STOCK_THRESHOLD 3, > 0) yields availability_status LOW_STOCK at creation."
        test_recipe:
          setup: ["Store S."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 3 }
              as: StoreStaff
              captures: { a_id: $.data.id }
          assert:
            - "SKU.${a_id}.availability_status == LOW_STOCK"

      - name: registry_desired_value_aggregates_items
        claim_type: Correct Result
        grounds: ["calculations.registry_completion", "entities.Registry.fields.desired_value_cents"]
        distinguishing_aspect: "Adding item (SKU 10000, desired 5) to an ACTIVE registry sets desired_value_cents 50000, fulfilled_value_cents 0, completion_pct 0."
        test_recipe:
          setup: ["Registry R ACTIVE; SKU A 10000."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 10000, initial_on_hand_qty: 100 }
              as: StoreStaff
              captures: { a_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /registries"
              payload: { registrant_customer_id: "${c_id}", title: "Baby R", event_date: "2026-09-01T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { r_id: $.data.id }
            - call: "POST /registries/${r_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /registries/${r_id}/items"
              payload: { sku_id: "${a_id}", desired_qty: 5 }
              as: Customer
              as_user_id: "${c_id}"
          assert:
            - "Registry.${r_id}.desired_value_cents == 50000"
            - "Registry.${r_id}.fulfilled_value_cents == 0"
            - "Registry.${r_id}.completion_pct == 0"

  # =====================================================================
  - section: validations
    instances:
      - name: order_line_sku_from_other_store_returns_mismatch
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SKU_STORE_MISMATCH]"]
        distinguishing_aspect: "POST /orders on store S1 with a line SKU that belongs to store S2 returns ERR_SKU_STORE_MISMATCH (409)."
        test_recipe:
          setup: ["Store S1 and S2; SKU A belongs to S2; Customer C; order placed against S1."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S1", state_code: "CA" }
              as: PlatformAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "S2", state_code: "CA" }
              as: PlatformAdmin
              captures: { s2_id: $.data.id }
            - call: "POST /skus"
              payload: { store_id: "${s2_id}", sku_code: "A", name: "Onesie", category: "CLOTHING", size_stage: "M0_3", base_price_cents: 4000, initial_on_hand_qty: 10 }
