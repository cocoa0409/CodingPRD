# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - §1.9 Corner Design
# Task 2679 - Mineral and Royalty Interest Acquisition & Division Order Administration
#
# Walk of references/claim-extraction-guide.md against §1.1-§1.7 of SCAFFOLD.yaml.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub naming the covering §1.8 instance and no test_recipe.
#
# Canonical fixture reused throughout (all values pre-computed, not formulas):
#   Tract          Reeves TX, gross_acres 640.0000, operator_activity_tier HIGH
#   Title chain    PATENT 1902-05-01 fraction 1.0        -> running 640.0000
#                  DEED   1955-03-12 conveyed 480.0000   -> running 160.0000
#                  PROBATE 1988-07-20 fraction 0.5       -> running  80.0000
#                  ASSIGNMENT 2011-01-05 fraction 0.0625 -> burden 0.0625
#                  => net_mineral_acres_certified 80.0000, existing_burden_fraction 0.0625
#   MineralInterest seller_share 0.5, lease_royalty_rate 0.1875
#                  => net_mineral_acres 40.0000, existing_burden_fraction 0.0625
#   Valuation      monthly 1200.00, decline 0.18, undeveloped 20.0000, HIGH tier
#                  => pdp_pv 39589.70, undeveloped_pv 19440.00,
#                     bid_floor 37115.34, max_bid 55340.34
#   OfferLetter    48000.00, expires_on 2026-09-01
#   Unit           1280.0000 acres, royalty_rate_cap 0.2500, depths 2 of 3
#   Allocation     320.0000 acres, [2026-01-01, 2028-01-01), POOLED
#                  => expected_decimal 0.00195313
#   RevenueDetail  2026-06 OIL, gross_value 62000.00, operator_decimal_used
#                  0.00180000 => reported_gross 111.60, severance 5.13,
#                  net 106.47; expected_gross 121.09, expected_net 115.52,
#                  variance 9.05 => VARIANCE_HELD
#   Default logical clock 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
- section: entities
  instances:
  - name: create_tract_returns_201_with_all_declared_fields
    claim_type: Creation
    grounds:
    - entities.Tract
    distinguishing_aspect: POST /tracts with county, state_code, gross_acres and operator_activity_tier returns 201 and every declared Tract field, with title_status at its initial state RESEARCH and both computed acreage figures still null.
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      - no tract exists yet
      setup_api_calls: []
      trigger:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
          gross_acres: 640.0
          operator_activity_tier: HIGH
        as: TitleAnalyst
        captures:
          c1: $.data.id
      assert:
      - 'HTTP 201 with the standard envelope: data present, error_id null'
      - data.county == Reeves, data.state_code == TX, data.gross_acres == 640.0000, data.operator_activity_tier == HIGH
      - data.title_status == RESEARCH
      - data.net_mineral_acres_certified is null and data.existing_burden_fraction is null - neither is computed before certification
      - data.chain_entry_count == 0
      - data.certified_at is null
      - data.id, data.created_at, data.updated_at and data.version are all present
  - name: create_tract_without_activity_tier_defaults_to_moderate
    claim_type: Defaults
    grounds:
    - entities.Tract.fields.operator_activity_tier
    distinguishing_aspect: Omitting the optional operator_activity_tier applies the declared default MODERATE, which is the 1.00 multiplier row of valuation_bid_band.
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
          gross_acres: 640.0
        as: TitleAnalyst
        captures:
          c2: $.data.id
      assert:
      - HTTP 201 and data.operator_activity_tier == MODERATE
      - GET /tracts/${c2} also reports operator_activity_tier == MODERATE
  - name: create_tract_missing_gross_acres_returns_400
    claim_type: Required Fields
    grounds:
    - entities.Tract.fields.gross_acres
    distinguishing_aspect: 'A required input field with no default cannot be omitted: POST /tracts without gross_acres returns ERR_INVALID_REQUEST (400).'
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
        as: TitleAnalyst
        captures:
          err: $.data.error_id
      assert:
      - HTTP 400 with data.error_id == ERR_INVALID_REQUEST
      - no Tract row is created
  - name: create_unit_with_unknown_state_code_returns_400
    claim_type: Type Constraints
    grounds:
    - entities.Unit.fields.state_code
    distinguishing_aspect: The Unit.state_code enum admits only {TX, OK, NM, ND} because it selects the severance-tax row; any other value returns ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /units
        payload:
          unit_name: Bad State Unit
          formation: Wolfcamp
          state_code: CO
          unit_gross_acres: 1280.0
          royalty_rate_cap: 0.25
          producing_depth_count: 2
          total_depth_count: 3
        as: Operator
        as_user_id: op-user-001
        captures:
          err: $.data.error_id
      assert:
      - HTTP 400 with data.error_id == ERR_INVALID_REQUEST
      - no Unit row is created
  - name: create_unit_ignores_client_supplied_system_fields
    claim_type: System Fields
    grounds:
    - entities.Unit.fields.operator_user_id
    distinguishing_aspect: 'System-sourced fields are server-assigned: operator_user_id comes from the X-User-ID header, and unallocated_acres and active_allocation_count are computed, so client-supplied values for them are ignored.'
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /units
        payload:
          unit_name: Reeves Unit 10H
          formation: Wolfcamp
          state_code: TX
          unit_gross_acres: 1280.0
          royalty_rate_cap: 0.25
          producing_depth_count: 2
          total_depth_count: 3
        as: Operator
        as_user_id: op-user-001
        captures:
          c5: $.data.id
      assert:
      - HTTP 201 and data.operator_user_id == op-user-001, taken from the header and not from the body
      - data.unallocated_acres == 1280.0000 and data.active_allocation_count == 0
      - data.version == 1 and data.created_at == data.updated_at on creation
  - name: certify_title_computes_certified_acreage_and_burden_from_chain
    claim_type: Computed Fields
    grounds:
    - entities.Tract.fields.net_mineral_acres_certified
    - entities.Tract.fields.existing_burden_fraction
    - entities.Tract.fields.chain_entry_count
    - calculations.net_mineral_acres_from_chain
    - calculations.tract_burden_fraction
    distinguishing_aspect: 'chain_entry_count tracks every insert immediately, but net_mineral_acres_certified and existing_burden_fraction stay null until POST /tracts/{id}/certify-title replays the chain: the four canonical instruments certify to 80.0000 acres and a 0.0625 burden.'
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      - a RESEARCH tract with gross_acres 640.0000 and no chain entries
      setup_api_calls:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
          gross_acres: 640.0
          operator_activity_tier: HIGH
        as: TitleAnalyst
        captures:
          c6: $.data.id
      trigger:
      - call: POST /tracts/${c6}/title-chain-entries
        payload:
          instrument_type: PATENT
          instrument_date: '1902-05-01'
          conveyed_fraction: 1.0
          county_book_page: 100/1
          grantor_name: United States
          grantee_name: A Patentee
        as: TitleAnalyst
      - call: POST /tracts/${c6}/title-chain-entries
        payload:
          instrument_type: DEED
          instrument_date: '1955-03-12'
          conveyed_acres: 480.0
          county_book_page: 220/45
          grantor_name: A Patentee
          grantee_name: B Grantee
        as: TitleAnalyst
      - call: POST /tracts/${c6}/title-chain-entries
        payload:
          instrument_type: PROBATE
          instrument_date: '1988-07-20'
          conveyed_fraction: 0.5
          county_book_page: 500/12
          grantor_name: A Patentee Estate
          grantee_name: C Heir
        as: TitleAnalyst
      - call: POST /tracts/${c6}/title-chain-entries
        payload:
          instrument_type: ASSIGNMENT
          instrument_date: '2011-01-05'
          conveyed_fraction: 0.0625
          county_book_page: 780/301
          grantor_name: C Heir
          grantee_name: ORRI Holder
        as: TitleAnalyst
      - call: GET /tracts/${c6}
        payload: {}
        as: TitleAnalyst
      - call: POST /tracts/${c6}/certify-title
        payload: {}
        as: TitleAnalyst
      assert:
      - after each of the four inserts data.chain_entry_count reads 1, 2, 3 then 4
      - the GET before certification reports net_mineral_acres_certified null, existing_burden_fraction null, title_status == RESEARCH
      - the certify-title response reports net_mineral_acres_certified == 80.0000 - the replay is 640.0000 then 160.0000 then 80.0000, with the ASSIGNMENT leaving acreage untouched
      - the certify-title response reports existing_burden_fraction == 0.0625, title_status == CERTIFIED and certified_at == 2026-08-01T00:00:00Z
      - Tract.${c6}.version == 6 after four inserts and one certification
  - name: title_chain_entry_is_immutable_and_has_no_version_field
    claim_type: Immutability
    grounds:
    - entities.TitleChainEntry
    distinguishing_aspect: 'TitleChainEntry is declared with common_fields false: it exposes no update endpoint and no version field, so the recorded chain can only be appended to.'
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      - a tract with one PATENT chain entry
      setup_api_calls:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
          gross_acres: 640.0
          operator_activity_tier: HIGH
        as: TitleAnalyst
        captures:
          c7: $.data.id
      - call: POST /tracts/${c7}/title-chain-entries
        payload:
          instrument_type: PATENT
          instrument_date: '1902-05-01'
          conveyed_fraction: 1.0
          county_book_page: 100/1
          grantor_name: United States
          grantee_name: A Patentee
        as: TitleAnalyst
        captures:
          ce7: $.data.id
      trigger:
      - call: GET /tracts/${c7}/title-chain-entries
        payload:
          instrument_type: PATENT
        as: TitleAnalyst
      assert:
      - §1.5 declares no PATCH, PUT or DELETE route for /title-chain-entries - the only write is the nested POST
      - the created entry ${ce7} carries id and created_at but no version and no updated_at field
      - data[0].instrument_type == PATENT, data[0].instrument_date == 1902-05-01, data[0].county_book_page == 100/1
      - total_count == 1 for the instrument_type PATENT filter
  - name: create_chain_entry_under_unknown_tract_returns_404
    claim_type: Parent Relationships
    grounds:
    - entities.TitleChainEntry.parent
    distinguishing_aspect: A child write against a non-existent parent path id returns ERR_TRACT_NOT_FOUND (404) from validation priority 5, before any body validation.
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /tracts/00000000-0000-0000-0000-000000000000/title-chain-entries
        payload:
          instrument_type: PATENT
          instrument_date: '1902-05-01'
          conveyed_fraction: 1.0
          county_book_page: 100/1
          grantor_name: United States
          grantee_name: A Patentee
        as: TitleAnalyst
        captures:
          err: $.data.error_id
      assert:
      - HTTP 404 with data.error_id == ERR_TRACT_NOT_FOUND
  - name: get_mineral_interest_with_unknown_id_returns_404
    claim_type: Not Found
    grounds:
    - entities.MineralInterest
    distinguishing_aspect: GET /mineral-interests/{id} with a well-formed but unknown id returns ERR_MINERAL_INTEREST_NOT_FOUND (404).
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: GET /mineral-interests/00000000-0000-0000-0000-000000000000
        payload: {}
        as: AcquisitionManager
        captures:
          err: $.data.error_id
      assert:
      - HTTP 404 with data.error_id == ERR_MINERAL_INTEREST_NOT_FOUND
      - the response still uses the standard envelope with data.message present
  - name: get_mineral_interest_returns_stored_and_derived_fields
    claim_type: Retrieval
    grounds:
    - entities.MineralInterest
    distinguishing_aspect: 'GET /mineral-interests/{id} echoes the stored inputs and the two figures frozen from the tract at creation: net_mineral_acres 40.0000 and existing_burden_fraction 0.0625.'
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      - a CERTIFIED tract with net_mineral_acres_certified 80.0000 and existing_burden_fraction 0.0625
      setup_api_calls:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
          gross_acres: 640.0
          operator_activity_tier: HIGH
        as: TitleAnalyst
        captures:
          c9: $.data.id
      - call: POST /tracts/${c9}/title-chain-entries
        payload:
          instrument_type: PATENT
          instrument_date: '1902-05-01'
          conveyed_fraction: 1.0
          county_book_page: 100/1
          grantor_name: United States
          grantee_name: A Patentee
        as: TitleAnalyst
      - call: POST /tracts/${c9}/title-chain-entries
        payload:
          instrument_type: DEED
          instrument_date: '1955-03-12'
          conveyed_acres: 480.0
          county_book_page: 220/45
          grantor_name: A Patentee
          grantee_name: B Grantee
        as: TitleAnalyst
      - call: POST /tracts/${c9}/title-chain-entries
        payload:
          instrument_type: PROBATE
          instrument_date: '1988-07-20'
          conveyed_fraction: 0.5
          county_book_page: 500/12
          grantor_name: A Patentee Estate
          grantee_name: C Heir
        as: TitleAnalyst
      - call: POST /tracts/${c9}/title-chain-entries
        payload:
          instrument_type: ASSIGNMENT
          instrument_date: '2011-01-05'
          conveyed_fraction: 0.0625
          county_book_page: 780/301
          grantor_name: C Heir
          grantee_name: ORRI Holder
        as: TitleAnalyst
      - call: POST /tracts/${c9}/certify-title
        payload: {}
        as: TitleAnalyst
      - call: POST /royalty-owners
        payload:
          legal_name: C Heir
          state_code: TX
          mailing_address: 1 Pecos Rd, Pecos TX
          tax_id_on_file: true
        as: DivisionOrderAdmin
        captures:
          own9c: $.data.id
      - call: POST /mineral-interests
        payload:
          tract_id: ${c9}
          seller_owner_id: ${own9c}
          seller_share_fraction: 0.5
          lease_royalty_rate: 0.1875
          undeveloped_net_acres: 20.0
        as: AcquisitionManager
        captures:
          mi9c: $.data.id
      trigger:
      - call: GET /mineral-interests/${mi9c}
        payload: {}
        as: AcquisitionManager
      assert:
      - HTTP 200 with data.id == ${mi9c}
      - data.tract_id == ${c9} and data.seller_owner_id == ${own9c}
      - data.seller_share_fraction == 0.5 and data.lease_royalty_rate == 0.1875
      - data.net_mineral_acres == 40.0000, frozen as 80.0000 certified acres times the 0.5 seller share
      - data.existing_burden_fraction == 0.0625, copied from the tract at creation
      - data.interest_status == PROSPECT and data.current_valuation_id is null
  - name: list_mineral_interests_paginates_and_filters_by_tract
    claim_type: Listing
    grounds:
    - endpoints[GET /mineral-interests]
    distinguishing_aspect: GET /mineral-interests honours the tract_id filter together with limit and offset and reports total_count and has_more consistently across pages.
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      - one CERTIFIED tract carrying three MineralInterests with seller shares 0.5, 0.25 and 0.125
      - a second CERTIFIED tract carrying one MineralInterest that must never appear in the filtered results
      setup_api_calls:
      - call: POST /tracts
        payload:
          county: Reeves
          state_code: TX
          gross_acres: 640.0
          operator_activity_tier: HIGH
        as: TitleAnalyst
        captures:
          c10: $.data.id
      - call: POST /tracts/${c10}/title-chain-entries
        payload:
          instrument_type: PATENT
          instrument_date: '1902-05-01'
          conveyed_fraction: 1.0
          county_book_page: 100/1
          grantor_name: United States
          grantee_name: A Patentee
        as: TitleAnalyst
      - call: POST /tracts/${c10}/title-chain-entries
        payload:
          instrument_type: DEED
          instrument_date: '1955-03-12'
          conveyed_acres: 480.0
          county_book_page: 220/45
          grantor_name: A Patentee
          grantee_name: B Grantee
        as: TitleAnalyst
      - call: POST /tracts/${c10}/title-chain-entries
        payload:
          instrument_type: PROBATE
          instrument_date: '1988-07-20'
          conveyed_fraction: 0.5
          county_book_page: 500/12
          grantor_name: A Patentee Estate
          grantee_name: C Heir
        as: TitleAnalyst
      - call: POST /tracts/${c10}/certify-title
        payload: {}
        as: TitleAnalyst
      - call: POST /royalty-owners
        payload:
          legal_name: C Heir
          state_code: TX
          mailing_address: 1 Pecos Rd, Pecos TX
          tax_id_on_file: true
        as: DivisionOrderAdmin
        captures:
          own10c: $.data.id
      - call: POST /mineral-interests
        payload:
          tract_id: ${c10}
          seller_owner_id: ${own10c}
          seller_share_fraction: 0.5
          lease_royalty_rate: 0.1875
          undeveloped_net_acres: 20.0
        as: AcquisitionManager
      - call: POST /mineral-interests
        payload:
          tract_id: ${c10}
          seller_owner_id: ${own10c}
          seller_share_fraction: 0.25
          lease_royalty_rate: 0.1875
          undeveloped_net_acres: 10.0
        as: AcquisitionManager
      - call: POST /mineral-interests
        payload:
          tract_id: ${c10}
          seller_owner_id: ${own10c}
          seller_share_fraction: 0.125
          lease_royalty_rate: 0.1875
          undeveloped_net_acres: 5.0
        as: AcquisitionManager
      - call: POST /tracts
        payload:
          county: Loving
          state_code: TX
          gross_acres: 320.0
          operator_activity_tier: LOW
        as: TitleAnalyst
        captures:
          c10b: $.data.id
      - call: POST /tracts/${c10b}/title-chain-entries
        payload:
          instrument_type: PATENT
          instrument_date: '1905-06-01'
          conveyed_fraction: 1.0
          county_book_page: 310/7
          grantor_name: United States
          grantee_name: D Patentee
        as: TitleAnalyst
      - call: POST /tracts/${c10b}/certify-title
        payload: {}
        as: TitleAnalyst
      - call: POST /mineral-interests
        payload:
          tract_id: ${c10b}
          seller_owner_id: ${own10c}
          seller_share_fraction: 0.5
          lease_royalty_rate: 0.2
          undeveloped_net_acres: 8.0
        as: AcquisitionManager
      trigger:
      - call: GET /mineral-interests
        payload:
          tract_id: ${c10}
          limit: 2
          offset: 0
        as: AcquisitionManager
      - call: GET /mineral-interests
        payload:
          tract_id: ${c10}
          limit: 2
          offset: 2
        as: AcquisitionManager
      assert:
      - the first page returns HTTP 200 with exactly 2 elements, total_count == 3 and has_more == true
      - the second page returns exactly 1 element, total_count == 3 and has_more == false
      - no element of either page has tract_id == ${c10b}
      - the two pages together cover the three interests with no duplicate id
  - name: create_unit_with_producing_depths_above_total_returns_400
    claim_type: Type Constraints
    grounds:
    - entities.Unit.fields.producing_depth_count
    distinguishing_aspect: 'The declared numeric relationship producing_depth_count <= total_depth_count is enforced at creation: 4 of 3 returns ERR_INVALID_REQUEST (400).'
    test_recipe:
      setup:
      - logical clock at its default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /units
        payload:
          unit_name: Deep Unit
          formation: Wolfcamp
          state_code: TX
          unit_gross_acres: 1280.0
          royalty_rate_cap: 0.25
          producing_depth_count: 4
          total_depth_count: 3
        as: Operator
        as_user_id: op-user-001
        captures:
          err: $.data.error_id
      assert:
      - HTTP 400 with data.error_id == ERR_INVALID_REQUEST
      - no Unit row is created

# ===========================================================================
# 2. STATE MACHINES
# ===========================================================================
- section: state_machines
  instances:

  - name: new_division_order_starts_in_sent_with_null_pinned_decimal
    claim_type: Initial State
    grounds:
    - state_machines.DivisionOrder.initial_state
    - entities.DivisionOrder.fields.do_status
    - entities.DivisionOrder.fields.pinned_decimal
    distinguishing_aspect: "A freshly created DivisionOrder is in the declared initial state SENT with pinned_decimal, operator_decimal and effective_production_month all null and dispute_reason NONE, while expected_decimal is already computed as 0.00195313."
    test_recipe:
      setup:
      - "logical clock at its default 2026-08-01T00:00:00Z"
      - "a CERTIFIED tract, a MineralInterest with net_mineral_acres 40.0000 and a Unit with one ACTIVE 320.0000-acre POOLED allocation of that tract"
      setup_api_calls:
      - call: "POST /tracts"
        payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
        as: TitleAnalyst
        captures: { s1t: $.data.id }
      - call: "POST /tracts/${s1t}/title-chain-entries"
        payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
        as: TitleAnalyst
      - call: "POST /tracts/${s1t}/title-chain-entries"
        payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
        as: TitleAnalyst
      - call: "POST /tracts/${s1t}/title-chain-entries"
        payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
        as: TitleAnalyst
      - call: "POST /tracts/${s1t}/title-chain-entries"
        payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
        as: TitleAnalyst
      - call: "POST /tracts/${s1t}/certify-title"
        payload: {}
        as: TitleAnalyst
      - call: "POST /royalty-owners"
        payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
        as: DivisionOrderAdmin
        captures: { s1o: $.data.id }
      - call: "POST /mineral-interests"
        payload: { tract_id: "${s1t}", seller_owner_id: "${s1o}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
