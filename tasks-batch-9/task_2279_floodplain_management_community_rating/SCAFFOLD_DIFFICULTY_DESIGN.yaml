  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: panel_effective_date_must_be_strictly_after_incumbent
        grounds:
          - validations[priority=73]
          - errors[ERR_PANEL_EFFECTIVE_DATE_OVERLAP]
          - entities.FirmPanel.fields.effective_date
        distinguishing_aspect: |
          Panel succession uses strictly-increasing (half-open) semantics on a single instant:
          a revision whose effective_date equals the EFFECTIVE incumbent's 2026-06-01 is
          rejected, while the same revision dated 2026-06-02 is accepted and activates.
        test_recipe:
          setup:
            - "Community with panel 48001C0100 suffix H (AE, BFE 12.0, effective_date 2026-06-01T00:00:00Z) in EFFECTIVE."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2026-06-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_h_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_h_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
          trigger:
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "J", flood_zone: "AE", effective_date: "2026-06-01T00:00:00Z", base_flood_elevation_ft: 14.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "K", flood_zone: "AE", effective_date: "2026-06-02T00:00:00Z", base_flood_elevation_ft: 14.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_k_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 422 with response.data.error_id == ERR_PANEL_EFFECTIVE_DATE_OVERLAP"
            - "The second trigger call returns HTTP 201"
            - "FirmPanel.${panel_k_id}.status == PENDING_REVISION"
            - "FirmPanel.${panel_k_id}.effective_date == 2026-06-02T00:00:00Z"
            - "FirmPanel.${panel_h_id}.status == EFFECTIVE"
            - "GET /floodplain/firm-panels?panel_number=48001C0100 returns total_count == 2"

      - name: crs_cycle_windows_are_closed_so_shared_endpoint_is_an_overlap
        grounds:
          - validations[priority=74]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
          - entities.CrsCycle.fields.cycle_start_date
          - entities.CrsCycle.fields.cycle_end_date
        distinguishing_aspect: |
          Cycle coverage windows are closed on both ends, the opposite convention to panel
          succession: a 2027 cycle starting exactly on the 2026 cycle's end date 2026-12-31 is
          rejected as an overlap, while starting one day later on 2027-01-01 is accepted.
        test_recipe:
          setup:
            - "Community with CrsCycle 2026 covering the closed interval 2026-01-01 to 2026-12-31, status OPEN."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2026, cycle_start_date: "2026-01-01T00:00:00Z", cycle_end_date: "2026-12-31T00:00:00Z", due_at: "2026-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_2026_id: $.data.id }
          trigger:
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2027, cycle_start_date: "2026-12-31T00:00:00Z", cycle_end_date: "2027-12-31T00:00:00Z", due_at: "2027-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/crs-cycles"
              payload: { community_id: "${comm_id}", cycle_year: 2027, cycle_start_date: "2027-01-01T00:00:00Z", cycle_end_date: "2027-12-31T00:00:00Z", due_at: "2027-09-30T00:00:00Z" }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { cycle_2027_id: $.data.id }
          assert:
            - "The first trigger call returns HTTP 422 with response.data.error_id == ERR_CYCLE_WINDOW_OVERLAP"
            - "The second trigger call returns HTTP 201"
            - "CrsCycle.${cycle_2027_id}.cycle_start_date == 2027-01-01T00:00:00Z"
            - "CrsCycle.${cycle_2027_id}.status == OPEN"
            - "CrsCycle.${cycle_2026_id}.status == OPEN"
            - "GET /floodplain/crs-cycles?community_id=${comm_id} returns total_count == 2"

      - name: inspection_sweep_windows_conflict_after_buffer_expansion
        grounds:
          - validations[priority=75]
          - errors[ERR_SWEEP_WINDOW_CONFLICT]
          - endpoints["POST /floodplain/communities/{communityId}/inspection-sweep"]
        distinguishing_aspect: |
          Sweep windows use buffer-expanded intersection, a third distinct interval semantics:
          a declaration dated 2026-07-05 does not touch the raw window
          [2026-06-01, 2026-07-01] but its 7-day expansion starting 2026-06-28 does and is
          rejected, while a declaration dated 2026-07-09 expands to 2026-07-02 and is accepted.
        test_recipe:
          setup:
            - "Community with one EFFECTIVE AE panel, one parcel and one RESIDENTIAL structure inside the special flood hazard area."
            - "An existing sweep DR-4700-TX for event_date 2026-06-01 with a 30-day window, i.e. deadline_at 2026-07-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0181", mapped_area_code: "RLA-1", owner_name: "V Owner", owner_email: "v@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: true, construction_year: 1971, market_value_usd: 180000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/communities/${comm_id}/inspection-sweep"
              payload: { declaration_code: "DR-4700-TX", event_date: "2026-06-01T00:00:00Z", inspection_window_days: 30 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          trigger:
            - call: "POST /floodplain/communities/${comm_id}/inspection-sweep"
              payload: { declaration_code: "DR-4711-TX", event_date: "2026-07-05T00:00:00Z", inspection_window_days: 30 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
            - call: "POST /floodplain/communities/${comm_id}/inspection-sweep"
              payload: { declaration_code: "DR-4712-TX", event_date: "2026-07-09T00:00:00Z", inspection_window_days: 30 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
          assert:
            - "The first trigger call returns HTTP 422 with response.data.error_id == ERR_SWEEP_WINDOW_CONFLICT"
            - "The second trigger call returns HTTP 201 with inspections_created == 1"
            - "GET /floodplain/inspections?declaration_code=DR-4711-TX returns total_count == 0"
            - "GET /floodplain/inspections?declaration_code=DR-4712-TX returns total_count == 1"
            - "GET /floodplain/inspections?structure_id=${struct_id} returns total_count == 2"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reversal_record_restores_ledger_aggregates_without_mutating_history
        grounds:
          - entities.ImprovementRecord.fields.reverses_record_id
          - entities.ImprovementRecord.fields.reversed
          - calculations.structure_improvement_aggregates
          - state_machines.DeterminationCase.DETERMINED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: the structure's counted cumulative cost. Reversing the
          45000.00 anchor drops cumulative_counted_cost_usd from 105000.00 back to exactly the
          60000.00 that existed before that record, re-anchors on the 2019 record at 30.00
          percent, and withdraws the determination — while the reversed record's own
          cost_usd stays 45000.00 because the ledger is append-only.
        test_recipe:
          setup:
            - "Community cumulative_period_years 10; one RESIDENTIAL structure with market_value_usd 200000.00."
            - "Counted records 60000.00 on 2019-03-01 and 45000.00 on 2026-03-01, giving cumulative_improvement_pct 52.50 and an auto-opened CUMULATIVE case."
            - "That auto-opened case determined as SUBSTANTIAL, so substantial_status is SUBSTANTIAL_IMPROVEMENT."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0191", mapped_area_code: "RLA-1", owner_name: "W Owner", owner_email: "w2@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: true, construction_year: 1964, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2019-03-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2019_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 45000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_2026_id: $.data.id }
            - call: "GET /floodplain/determination-cases"
              payload: { structure_id: "${struct_id}" }
