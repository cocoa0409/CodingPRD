scaffold_corner_design:
- section: entities
  instances:
  - name: nonprofit_create_defaults_and_initial_posture
    claim_type: creation_defaults_computed
    grounds:
    - entities.Nonprofit.fields.compliance_posture
    - entities.Nonprofit.fields.current_fiscal_year
    distinguishing_aspect: A fresh nonprofit starts with version 1, compliance_posture NON_COMPLIANT (no ACTIVE D&O policy exists), and current_fiscal_year 2026 under
      the default clock with a December FYE.
    test_recipe:
      setup:
      - Empty DB; clock never set (default 2026-08-01T00:00:00Z)
      setup_api_calls: []
      trigger:
      - call: POST /boardgov/nonprofits
        payload:
          name: Fresh Org
          ein: EIN-C1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 4000000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
          v: $.data.version
          posture: $.data.compliance_posture
          fy: $.data.current_fiscal_year
      assert:
      - v == 1 and posture == NON_COMPLIANT and fy == 2026
      - GET /boardgov/nonprofits/${np} returns the same stored fields (retrieval)
  - name: nonprofit_duplicate_ein_rejected
    claim_type: type_constraint_uniqueness
    grounds:
    - errors[ERR_DUPLICATE_EIN]
    - entities.Nonprofit.fields.ein
    distinguishing_aspect: 'EIN uniqueness is global across nonprofits: the second create with the same EIN fails with ERR_DUPLICATE_EIN.'
    test_recipe:
      setup:
      - One nonprofit with ein EIN-DUP-1 exists
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: First
          ein: EIN-DUP-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
      trigger:
      - call: POST /boardgov/nonprofits
        payload:
          name: Second
          ein: EIN-DUP-1
          state_of_incorporation: NY
          fiscal_year_end_month: 6
          annual_gross_receipts_cents: 2000000
        as: GovernanceAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_EIN (409)
  - name: nonprofit_get_not_found_returns_404
    claim_type: not_found
    grounds:
    - errors[ERR_NOT_FOUND]
    - validations[priority=5]
    distinguishing_aspect: GET on a well-formed but nonexistent nonprofit id returns 404 ERR_NOT_FOUND.
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: GET /boardgov/nonprofits/00000000-0000-4000-8000-000000000000
        payload: {}
        as: GovernanceAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_NOT_FOUND (404)
  - name: board_member_email_uniqueness_scoped_per_nonprofit
    claim_type: type_constraint_uniqueness
    grounds:
    - errors[ERR_DUPLICATE_MEMBER_EMAIL]
    - entities.BoardMember.fields.email
    distinguishing_aspect: 'Email uniqueness is PER NONPROFIT: duplicate within the org fails, but the same email under a different nonprofit succeeds.'
    test_recipe:
      setup:
      - Two nonprofits; org1 has member a@x.org
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O1
          ein: EIN-EM-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          o1: $.data.id
      - call: POST /boardgov/nonprofits
        payload:
          name: O2
          ein: EIN-EM-2
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          o2: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${o1}
          full_name: A
          email: a@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
      trigger:
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${o1}
          full_name: A2
          email: a@x.org
          skill_tags:
          - LEGAL
        as: GovernanceAdmin
        captures:
          err: $.data.error_id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${o2}
          full_name: A
          email: a@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
        captures:
          ok_id: $.data.id
      assert:
      - err == ERR_DUPLICATE_MEMBER_EMAIL (same org)
      - ok_id is a new member id (cross-org reuse allowed)
  - name: board_member_invalid_skill_tag_rejected
    claim_type: type_constraint_enum
    grounds:
    - entities.BoardMember.fields.skill_tags
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: skill_tags values outside the eight-skill recruitment enum are rejected with ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - One nonprofit
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-SK-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      trigger:
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: Bad
          email: bad@x.org
          skill_tags:
          - UNDERWATER_BASKET_WEAVING
        as: GovernanceAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST (400)
  - name: board_term_end_date_and_bylaws_pinning_computed
    claim_type: computed_fields
    grounds:
    - entities.BoardTerm.fields.end_date
    - entities.BoardTerm.fields.bylaws_id
    - entities.BoardTerm.fields.chain_index
    distinguishing_aspect: Term creation computes end_date = start + bylaws.term_length_years and pins bylaws_id to the bylaws ADOPTED at election; both are server-computed,
      not client input.
    test_recipe:
      setup:
      - Org with adopted bylaws (term_length_years 2); chair and nominee exist
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-TD-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: N
          email: n@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
        captures:
          m: $.data.id
      trigger:
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${m}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
        captures:
          end: $.data.end_date
          byl: $.data.bylaws_id
          ci: $.data.chain_index
          st: $.data.status
      assert:
      - end == 2028-01-01T00:00:00Z (2-year length from the pinned bylaws)
      - byl == ${by} (version-pinned) and ci == 1 (new chain)
      - st == ACTIVE (start <= default clock < end); BoardMember.${m}.status == ACTIVE (creation side effect)
  - name: coi_disclosure_has_conflict_computed_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.COIDisclosure.fields.has_conflict
    distinguishing_aspect: 'has_conflict derives from answers only: passing has_conflict=true in the create payload is ignored while all answers are false.'
    test_recipe:
      setup:
      - Org; chair C ACTIVE
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-HC-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: C
          email: c@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          c: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      trigger:
      - call: POST /boardgov/coi-disclosures
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          fiscal_year: 2026
          answers:
          - question_key: q1
            answer: false
          has_conflict: true
        as: BoardChair
        as_user_id: ${c}
        captures:
          hc: $.data.has_conflict
      assert:
      - hc == false (client-supplied true ignored; computed from answers)
  - name: vote_records_immutable_and_duplicate_rejected
    claim_type: immutability
    grounds:
    - entities.Vote
    - errors[ERR_DUPLICATE_VOTE]
    distinguishing_aspect: 'Vote is append-only (common_fields false: no version/updated_at, no PATCH/DELETE endpoint exists); a second vote by the same member on
      the same motion is the only ''change'' attempt available and fails ERR_DUPLICATE_VOTE.'
    test_recipe:
      setup:
      - Org; chair C and director D1 ACTIVE; meeting in session with GOVERNANCE motion VOTING_OPEN; D1 already voted AYE
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-VT-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: C
          email: c@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          c: $.data.id
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: D1
          email: d1@x.org
          skill_tags:
          - FINANCE
        as: GovernanceAdmin
        captures:
          d1: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${d1}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-08-01T00:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          mt: $.data.id
      - call: POST /boardgov/meetings/${mt}/call_to_order
        payload:
          attendance:
          - ${c}
          - ${d1}
        as: BoardChair
        as_user_id: ${c}
      - call: POST /boardgov/motions
        payload:
          nonprofit_id: ${np}
          meeting_id: ${mt}
          title: X
          category: GOVERNANCE
        as: BoardChair
        as_user_id: ${c}
        captures:
          mo: $.data.id
      - call: POST /boardgov/motions/${mo}/open_voting
        payload: {}
        as: BoardChair
        as_user_id: ${c}
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d1}
          choice: AYE
        as: BoardDirector
        as_user_id: ${d1}
        captures:
          vt: $.data.id
      trigger:
      - call: POST /boardgov/votes
        payload:
          nonprofit_id: ${np}
          motion_id: ${mo}
          board_member_id: ${d1}
          choice: NAY
        as: BoardDirector
        as_user_id: ${d1}
        captures:
          err: $.data.error_id
      - call: GET /boardgov/votes/${vt}
        payload: {}
        as: GovernanceAdmin
        captures:
          choice: $.data.choice
      assert:
      - err == ERR_DUPLICATE_VOTE (the first record is immutable)
      - choice == AYE still (original vote unchanged); Motion.${mo}.votes_for == 1 and votes_against == 0
  - name: meeting_quorum_fields_null_until_call_to_order
    claim_type: defaults
    grounds:
    - entities.Meeting.fields.quorum_base
    - entities.Meeting.fields.quorum_met
    distinguishing_aspect: A freshly scheduled meeting has status SCHEDULED and quorum_base/quorum_required/quorum_met uncomputed (null); attendance is empty until
      call_to_order.
    test_recipe:
      setup:
      - Org exists
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-MQ-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      trigger:
      - call: POST /boardgov/meetings
        payload:
          nonprofit_id: ${np}
          scheduled_start: '2026-09-01T10:00:00Z'
          duration_minutes: 60
          notice_waived: true
        as: GovernanceAdmin
        captures:
          st: $.data.status
          qb: $.data.quorum_base
          qm: $.data.quorum_met
      assert:
      - st == SCHEDULED and qb == null and qm == null
  - name: state_registration_duplicate_jurisdiction_rejected
    claim_type: type_constraint_uniqueness
    grounds:
    - errors[ERR_DUPLICATE_REGISTRATION]
    distinguishing_aspect: 'One registration per (nonprofit, state_code): second CA registration fails.'
    test_recipe:
      setup:
      - Org with CA registration
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-SR-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/state-registrations
        payload:
          nonprofit_id: ${np}
          state_code: CA
          current_period_end: '2027-06-01T00:00:00Z'
        as: ComplianceOfficer
      trigger:
      - call: POST /boardgov/state-registrations
        payload:
          nonprofit_id: ${np}
          state_code: CA
          current_period_end: '2028-01-01T00:00:00Z'
        as: ComplianceOfficer
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_REGISTRATION
  - name: audit_committee_independence_forced_default
    claim_type: defaults
    grounds:
    - entities.Committee.fields.requires_all_independent
    distinguishing_aspect: Creating a type=AUDIT committee without passing requires_all_independent stores requires_all_independent == true (forced by type), while
      a FINANCE committee keeps the default false.
    test_recipe:
      setup:
      - Org; chair ACTIVE (needed to create committees as BoardChair) — or create via GovernanceAdmin
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-AC-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      trigger:
      - call: POST /boardgov/committees
        payload:
          nonprofit_id: ${np}
          name: Audit
          type: AUDIT
          min_members: 3
          authorized_size: 5
        as: GovernanceAdmin
        captures:
          ai: $.data.requires_all_independent
      - call: POST /boardgov/committees
        payload:
          nonprofit_id: ${np}
          name: Fin
          type: FINANCE
          min_members: 2
          authorized_size: 4
        as: GovernanceAdmin
        captures:
          fi: $.data.requires_all_independent
      assert:
      - ai == true (forced) and fi == false (default)
  - name: executive_evaluation_duplicate_year_rejected
    claim_type: type_constraint_uniqueness
    grounds:
    - errors[ERR_DUPLICATE_EVALUATION]
    distinguishing_aspect: At most one evaluation per (nonprofit, fiscal_year); the second FY2026 evaluation fails.
    test_recipe:
      setup:
      - Org; chair ACTIVE; FY2026 evaluation exists
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-EV-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: C
          email: c@x.org
          skill_tags:
          - GOVERNANCE
          officer_role: CHAIR
        as: GovernanceAdmin
        captures:
          c: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${c}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/executive-evaluations
        payload:
          nonprofit_id: ${np}
          fiscal_year: 2026
          executive_name: ED
        as: BoardChair
        as_user_id: ${c}
      trigger:
      - call: POST /boardgov/executive-evaluations
        payload:
          nonprofit_id: ${np}
          fiscal_year: 2026
          executive_name: ED
        as: BoardChair
        as_user_id: ${c}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_EVALUATION
  - name: form990_duplicate_root_filing_rejected
    claim_type: type_constraint_uniqueness
    grounds:
    - errors[ERR_DUPLICATE_FILING]
    distinguishing_aspect: A second ROOT filing (no supersedes_filing_id) for the same fiscal year fails ERR_DUPLICATE_FILING; the amendment path is the only way
      to revise.
    test_recipe:
      setup:
      - Org; treasurer ACTIVE; FY2025 root filing exists
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-FD-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: T
          email: t@x.org
          skill_tags:
          - FINANCE
          officer_role: TREASURER
        as: GovernanceAdmin
        captures:
          t: $.data.id
      - call: POST /boardgov/board-terms
        payload:
          nonprofit_id: ${np}
          board_member_id: ${t}
          start_date: '2026-01-01T00:00:00Z'
        as: GovernanceAdmin
      - call: POST /boardgov/form990-filings
        payload:
          nonprofit_id: ${np}
          fiscal_year: 2025
          total_revenue_cents: 100000000
          total_expenses_cents: 60000000
          contributions_cents: 70000000
          program_service_revenue_cents: 20000000
          preparer_user_id: staff-1
        as: Treasurer
        as_user_id: ${t}
      trigger:
      - call: POST /boardgov/form990-filings
        payload:
          nonprofit_id: ${np}
          fiscal_year: 2025
          total_revenue_cents: 1
          total_expenses_cents: 1
          contributions_cents: 1
          program_service_revenue_cents: 0
          preparer_user_id: staff-1
        as: Treasurer
        as_user_id: ${t}
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_FILING
  - name: form990_amendment_of_unfiled_target_rejected
    claim_type: parent_relationship_state
    grounds:
    - entities.Form990Filing.fields.supersedes_filing_id
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: An amendment filing may only supersede a FILED or PUBLIC_DISCLOSED filing; superseding a DRAFT fails ERR_INVALID_STATE.
    test_recipe:
      setup:
      - Org; treasurer ACTIVE; FY2025 root filing still DRAFT
      setup_api_calls:
      - call: POST /boardgov/nonprofits
        payload:
          name: O
          ein: EIN-FA-1
          state_of_incorporation: CA
          fiscal_year_end_month: 12
          annual_gross_receipts_cents: 1000000
        as: GovernanceAdmin
        captures:
          np: $.data.id
      - call: POST /boardgov/bylaws
        payload:
          nonprofit_id: ${np}
          quorum_pct: 50
          quorum_basis: SEATED
          amendment_threshold_pct: 67
          term_length_years: 2
          max_consecutive_terms: 3
          term_cooloff_years: 1
          board_size: 5
        as: GovernanceAdmin
        captures:
          by: $.data.id
      - call: POST /boardgov/bylaws/${by}/adopt
        payload: {}
        as: GovernanceAdmin
      - call: POST /boardgov/board-members
        payload:
          nonprofit_id: ${np}
          full_name: T
          email: t@x.org
          skill_tags:
          - FINANCE
