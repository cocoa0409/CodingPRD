            - "StateRegulator-only calls succeeded: notice ACTIVATE, the LABEL decision, the permit decision"
            - "ComplianceOfficer-only calls succeeded: the LABEL filing, the state license, the permit create and submit, the excise filing"
            - "CellarOperator-only calls succeeded: tank service-free create, batch start and condition, run create and complete, keg clean and fill"
