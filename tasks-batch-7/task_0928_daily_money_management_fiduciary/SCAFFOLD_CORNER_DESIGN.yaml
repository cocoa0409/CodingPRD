  - section: endpoints
    instances:

      - name: corner_logical_clock_defaults_to_the_fixed_startup_instant
        claim_type: Computed read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - global_constants.DEFAULT_CLOCK_UTC
        distinguishing_aspect: "Before any call to POST /_clock/set_current_utc the logical clock reads exactly 2026-05-01T00:00:00Z and never real wall-clock time, so the first rows created carry that instant as their created_at."
        test_recipe:
          setup:
            - "an entirely fresh server with the clock never set"
          setup_api_calls:
            - call: "POST /dmm/surety-bonds"
              payload: { carrier_name: "Atlas Surety", bond_number: "SB-DEFAULT", coverage_cents: 100000000, effective_date: "2026-01-01", expiry_date: "2026-12-31" }
              as: PlatformAdmin
              as_user_id: "u-admin"
              captures: { bond_id: $.data.id }
          trigger:
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-C070" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.created_at }
          assert:
            - "SuretyBond.${bond_id}.created_at == 2026-05-01T00:00:00.000Z"
            - "the Client create response carries created_at 2026-05-01T00:00:00.000Z"

      - name: corner_checkpoint_returns_its_three_counters
        claim_type: Computed read
        grounds:
          - endpoints[POST /dmm/ops/checkpoint]
        distinguishing_aspect: "The checkpoint response is an object carrying authorizations_expired, alerts_escalated and coordination_requests_escalated, all 0 on a run with nothing due."
        excluded_because:
          difficulty_instance: coordination_request_reroute_self_loop_stops_at_cap
          rationale: "The checkpoint counter shape is asserted in corner_checkpoint_expires_a_lapsed_authorization and corner_checkpoint_escalates_fraud_alert_at_the_acknowledgement_deadline, which read authorizations_expired and alerts_escalated from the same response object."

  - section: consistency_model
    instances:

      - name: corner_cascade_results_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Authorization.fields.cascaded_payments_cancelled
        distinguishing_aspect: "The consistency model is immediate, so the revocation response itself already carries cascaded_payments_cancelled 1 - no second read is needed for the cascade to be observable."
        excluded_because:
          difficulty_instance: authorization_revoke_cancels_payment_and_restores_budget_line
          rationale: "That instance asserts Authorization.cascaded_payments_cancelled == 1 together with every downstream aggregate straight after the single revocation request."
