# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Task: task_3048_drive_thru_only_coffee_stand_throughput_crew
#
# Breadth probe over the §1.1–§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Shared anchor chains: &k_boot brings up region + stand + approval + operator
# crew + ACTIVE agreement + OPEN stand; &k_menu adds an activated CORE recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: region_create_returns_system_fields_and_initial_version
        claim_type: Creation
        grounds:
          - entities.Region
          - endpoints.POST_/regions
        distinguishing_aspect: "POST /regions with name+code returns 201 with server-minted id, created_at, updated_at, version 1; Region carries no status field at all."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z (no set call needed)."
          setup_api_calls: []
          trigger:
            - call: "POST /regions"
              payload: { name: "High Desert", code: "HD" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Region.${region_id}.name == \"High Desert\" and code == \"HD\""
            - "Region.${region_id}.version == 1 with non-null id, created_at, updated_at"
            - "response carries meta.api_request_id and meta.api_request_timestamp"

      - name: stand_create_defaults_proposed_and_zero_breach_counter
        claim_type: Defaults
        grounds:
          - entities.Stand.fields.status
          - entities.Stand.fields.consecutive_breach_windows
          - endpoints.POST_/stands
        distinguishing_aspect: "Omitting status/consecutive_breach_windows (they are not inputs) yields status PROPOSED and consecutive_breach_windows 0 on the 201 response."
        test_recipe:
          setup: ["Region NW exists."]
          setup_api_calls:
            - &k_region
              call: "POST /regions"
              payload: { name: "Northwest", code: "NW" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
          trigger:
            - call: "POST /stands"
              payload: { region_id: "${region_id}", name: "Corner Lot", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 5 }, { lane_code: "B", max_stack_cars: 5 }] }
              as: PlatformAdmin
              captures: { stand_id: $.data.id }
          assert:
            - "Stand.${stand_id}.status == PROPOSED"
            - "Stand.${stand_id}.consecutive_breach_windows == 0"
            - "Stand.${stand_id}.lane_occupancy == {} (no cars yet)"

      - name: loyalty_account_computed_tier_and_points_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.LoyaltyAccount.fields.points
          - entities.LoyaltyAccount.fields.tier
          - endpoints.POST_/loyalty-accounts
        distinguishing_aspect: "points and tier are computed — a create that smuggles points/tier fields is rejected as ERR_INVALID_PAYLOAD (unknown fields), and the created account starts points 0 / tier NONE."
        test_recipe:
          setup: ["Stand booted via anchor chain."]
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T06:00:00Z" }
              as: PlatformAdmin
            - *k_region
            - &k_stand
              call: "POST /stands"
              payload: { region_id: "${region_id}", name: "Stand 42", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 6 }, { lane_code: "B", max_stack_cars: 6 }] }
              as: PlatformAdmin
              captures: { stand_id: $.data.id }
            - &k_approve
              call: "POST /stands/${stand_id}/approve"
              payload: {}
              as: PlatformAdmin
            - &k_op
              call: "POST /crew-members"
              payload: { full_name: "Op One", home_stand_id: "${stand_id}", hired_on: "2024-01-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { op_id: $.data.id }
            - &k_agr
              call: "POST /operator-agreements"
              payload: { stand_id: "${stand_id}", crew_member_id: "${op_id}", revenue_share_pct: 0.30 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { agr_id: $.data.id }
            - &k_agr_ok
              call: "POST /operator-agreements/${agr_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - &k_agr_act
              call: "POST /operator-agreements/${agr_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - &k_open
              call: "POST /stands/${stand_id}/open"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Sneaky Sam", home_stand_id: "${stand_id}", points: 999, tier: "GOLD" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /loyalty-accounts"
              payload: { full_name: "Honest Hal", home_stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "create with smuggled computed fields rejected ERR_INVALID_PAYLOAD (400)"
            - "LoyaltyAccount.${acct_id}.points == 0 and tier == NONE"

      - name: recipe_seasonal_requires_season_window
        claim_type: Type Constraints
        grounds:
          - entities.Recipe.fields.season_start
          - validations[priority=4]
          - errors[ERR_INVALID_PAYLOAD]
        distinguishing_aspect: "A SEASONAL recipe without season_start/season_end (or with season_end <= season_start) fails ERR_INVALID_PAYLOAD at create; a well-formed seasonal window is accepted."
        test_recipe:
          setup: ["Clock at 2026-09-01T06:00:00Z."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /recipes"
              payload: { name: "Pumpkin Cloud", channel: "SEASONAL", base_price_cents: 525, base_build_seconds: 70, temperature_class: "HOT" }
              as: PlatformAdmin
              captures: { err_missing: $.data.error_id }
            - call: "POST /recipes"
              payload: { name: "Backwards Brew", channel: "SEASONAL", base_price_cents: 525, base_build_seconds: 70, temperature_class: "HOT", season_start: "2026-12-01", season_end: "2026-09-01" }
              as: PlatformAdmin
              captures: { err_inverted: $.data.error_id }
            - call: "POST /recipes"
              payload: { name: "Autumn Gold", channel: "SEASONAL", base_price_cents: 525, base_build_seconds: 70, temperature_class: "HOT", season_start: "2026-09-01", season_end: "2026-12-01" }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
          assert:
            - "missing season window -> ERR_INVALID_PAYLOAD (400)"
            - "inverted season window -> ERR_INVALID_PAYLOAD (400)"
            - "well-formed SEASONAL recipe created 201 with status ACTIVE"

      - name: order_get_returns_all_three_status_dimensions
        claim_type: Retrieval
        grounds:
          - entities.Order
          - endpoints.GET_/orders/{orderId}
        distinguishing_aspect: "GET on a freshly created window order round-trips stand_id, source, lane_code, lane_seq 1, queue_status MERGED, payment_status UNPAID, build_status QUEUED, and computed totals."
        test_recipe:
          setup: ["Stand booted; CORE recipe activated."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - &k_taker
              call: "POST /crew-members"
              payload: { full_name: "Taker Tim", home_stand_id: "${stand_id}", hired_on: "2025-06-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { taker_id: $.data.id }
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - &k_recipe
              call: "POST /recipes"
              payload: { name: "Carmelizer", channel: "CORE", base_price_cents: 450, base_build_seconds: 60, temperature_class: "ICED", modifiers: [{ name: "EXTRA_SHOT", price_cents: 50, build_seconds_adder: 10 }] }
              as: PlatformAdmin
              captures: { recipe_id: $.data.id }
            - &k_dist
              call: "POST /recipe-distributions"
              payload: { recipe_id: "${recipe_id}", stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { dist_id: $.data.id }
            - &k_dist_act
              call: "POST /recipe-distributions/${dist_id}/activate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
            - &k_stand_v
              call: "GET /stands/${stand_id}"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { stand_v: $.data.version }
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 2, modifier_names: ["EXTRA_SHOT"] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
          assert:
            - "queue_status == MERGED, payment_status == UNPAID, build_status == QUEUED"
            - "lane_code == \"A\" and lane_seq == 1"
            - "subtotal_cents == 1000 ((450+50)*2), discount_cents == 0, total_cents == 1000"
            - "outstanding_build_seconds == 70 (60+10, default staffing ×1.0)"

      - name: stands_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/stands
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With 3 stands, limit=2&offset=0 returns 2 rows, total_count 3, has_more true; offset=2 returns 1 row, has_more false — total_count spans the filtered set, not the page."
        test_recipe:
          setup: ["Region with three stands."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - call: "POST /stands"
              payload: { region_id: "${region_id}", name: "S1", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 6 }, { lane_code: "B", max_stack_cars: 6 }] }
              as: PlatformAdmin
            - call: "POST /stands"
              payload: { region_id: "${region_id}", name: "S2", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 6 }, { lane_code: "B", max_stack_cars: 6 }] }
              as: PlatformAdmin
            - call: "POST /stands"
              payload: { region_id: "${region_id}", name: "S3", min_ingress_gap_seconds: 45, lane_configs: [{ lane_code: "A", max_stack_cars: 6 }, { lane_code: "B", max_stack_cars: 6 }] }
              as: PlatformAdmin
          trigger:
            - call: "GET /stands"
              payload: { region_id: "${region_id}", limit: 2, offset: 0 }
              as: RegionalManager
              as_user_id: "rm-1"
              captures: { page1: "$.data" }
            - call: "GET /stands"
              payload: { region_id: "${region_id}", limit: 2, offset: 2 }
              as: RegionalManager
              as_user_id: "rm-1"
          assert:
            - "page 1: data length 2, pagination fields total_count == 3 and has_more == true"
            - "page 2: data length 1, total_count == 3, has_more == false"

      - name: nonexistent_stand_get_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_STAND_NOT_FOUND]
          - endpoints.GET_/stands/{standId}
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_STAND_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /stands/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_STAND_NOT_FOUND"
            - "response_type == error and meta block present"

      - name: order_missing_required_source_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_PAYLOAD]
          - endpoints.POST_/orders
        distinguishing_aspect: "Omitting required field `source` from POST /orders fails ERR_INVALID_PAYLOAD before any state or business check runs."
        test_recipe:
          setup: ["Stand booted with recipe activated."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_PAYLOAD (400) — required field source missing"

      - name: order_quantity_zero_rejected
        claim_type: Type Constraints
        grounds:
          - entities.OrderItem.fields.quantity
          - errors[ERR_INVALID_QUANTITY]
        distinguishing_aspect: "quantity 0 (lower-bound edge, distinct from the empty-array edge covered in §1.8) fails ERR_INVALID_QUANTITY."
        test_recipe:
          setup: ["Stand booted with recipe activated."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
          trigger:
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 0, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_QUANTITY (422)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: closed_stand_is_terminal_and_rejects_resume
        claim_type: invalid_transition
        grounds:
          - state_machines.Stand
          - errors[ERR_STAND_INVALID_TRANSITION]
        distinguishing_aspect: "After OPEN -> CLOSED (queue drained), every further transition — resume, throttle, open — fails ERR_STAND_INVALID_TRANSITION; CLOSED is terminal."
        test_recipe:
          setup: ["Stand booted and OPEN with empty queue."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - call: "POST /stands/${stand_id}/close"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { closed_status: $.data.status }
          trigger:
            - call: "POST /stands/${stand_id}/resume"
              payload: {}
              as: ShiftLead
              as_user_id: "${op_id}"
              captures: { err_resume: $.data.error_id }
            - call: "POST /stands/${stand_id}/open"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err_open: $.data.error_id }
          assert:
            - "close succeeded: status == CLOSED"
            - "resume rejected ERR_STAND_INVALID_TRANSITION (409)"
            - "open rejected ERR_STAND_INVALID_TRANSITION (409)"

      - name: stand_close_blocked_while_queue_not_drained
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Stand.OPEN_to_CLOSED
          - errors[ERR_STAND_INVALID_TRANSITION]
        distinguishing_aspect: "Close with a MERGED order still in a lane fails ERR_STAND_INVALID_TRANSITION — the drain precondition, not the from-state, is what blocks."
        test_recipe:
          setup: ["Stand OPEN with one MERGED window order."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /stands/${stand_id}/close"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STAND_INVALID_TRANSITION (409)"
            - "stand remains OPEN"

      - name: handoff_side_effects_fire_in_full
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Order.AT_WINDOW_to_SERVED
          - entities.Order.fields.handoff_at
        distinguishing_aspect: "A legal handoff sets handoff_at to the logical clock, flips build_status to HANDED_OFF, and releases the lane slot (lane_occupancy back to 0) — all four side effects verified, not just the status flip."
        test_recipe:
          setup: ["Stand OPEN; one window order built READY, authorized, at window, captured; clock at 2026-09-01T07:30:00Z."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - &k_lead
              call: "POST /crew-members"
              payload: { full_name: "Lead Lena", home_stand_id: "${stand_id}", hired_on: "2025-06-01", food_handler_cert_expires_on: "2027-12-31" }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "GET /order-items"
              payload: { order_id: "${order_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item_id: "$.data[0].id" }
            - call: "POST /order-items/${item_id}/start-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /order-items/${item_id}/complete-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /orders/${order_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /payments/${pay_id}/capture"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T07:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /orders/${order_id}/handoff"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { end_queue: $.data.queue_status, end_build: $.data.build_status, handoff: $.data.handoff_at }
            - call: "GET /stands/${stand_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { occ: "$.data.lane_occupancy.A" }
          assert:
            - "queue_status == SERVED and build_status == HANDED_OFF"
            - "handoff_at == 2026-09-01T07:30:00Z (logical clock, not wall clock)"
            - "lane_occupancy.A == 0 (slot released)"

      - name: handoff_without_capture_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.AT_WINDOW_to_SERVED
          - errors[ERR_PAYMENT_INVALID_STATE]
        distinguishing_aspect: "Handoff with build READY but payment only AUTHORIZED fails ERR_PAYMENT_INVALID_STATE — the payment-dimension guard inside the queue transition."
        test_recipe:
          setup: ["Stand OPEN; window order at window, item READY, payment AUTHORIZED but not captured."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_lead
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
            - *k_recipe
            - *k_dist
            - *k_dist_act
            - *k_stand_v
            - call: "POST /orders"
              payload: { stand_id: "${stand_id}", source: "WINDOW", lane_code: "A", items: [{ recipe_id: "${recipe_id}", quantity: 1, modifier_names: [] }], expected_stand_version: "${stand_v}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { order_id: $.data.id }
            - call: "GET /order-items"
              payload: { order_id: "${order_id}" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { item_id: "$.data[0].id" }
            - call: "POST /order-items/${item_id}/start-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /order-items/${item_id}/complete-build"
              payload: {}
              as: CrewMember
              as_user_id: "${taker_id}"
            - call: "POST /orders/${order_id}/payments/authorize"
              payload: { card_token: "VISA-OK" }
              as: CrewMember
              as_user_id: "${taker_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /orders/${order_id}/call-to-window"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
          trigger:
            - call: "POST /orders/${order_id}/handoff"
              payload: {}
              as: ShiftLead
              as_user_id: "${lead_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PAYMENT_INVALID_STATE (409)"
            - "order remains AT_WINDOW"

      - name: second_authorize_on_paid_order_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Payment
          - errors[ERR_ORDER_INVALID_STATE]
        distinguishing_aspect: "Repeating authorize on an order whose payment is already AUTHORIZED fails ERR_ORDER_INVALID_STATE — the trigger is not idempotent and the second attempt is an error, not a replay."
        test_recipe:
          setup: ["Stand OPEN; window order with AUTHORIZED payment."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_agr
            - *k_agr_ok
