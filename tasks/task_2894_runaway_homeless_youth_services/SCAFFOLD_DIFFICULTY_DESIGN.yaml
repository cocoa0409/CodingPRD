  - rule_id: priority_pair_validation_conflict
    instances:
      - name: escalated_screening_outranks_bed_capacity_on_admission
        grounds:
          - validations[priority=19]
          - validations[priority=43]
          - errors.ERR_SCREENING_ESCALATED_BLOCKS_ACTION
          - errors.ERR_BED_CAPACITY_EXCEEDED
          - calculations.program_posture
        distinguishing_aspect: |
          One request violates a business_safety rule (priority 19, latest screening ESCALATED) and a
          business_fiscal rule (priority 43, waitlist_opt_out true against a FROZEN program) at the
          same time. Only ERR_SCREENING_ESCALATED_BLOCKS_ACTION (422) may be returned; an
          implementation that checks bed inventory before youth safety leaks
          ERR_BED_CAPACITY_EXCEEDED (409) instead, and the two rules even disagree on the HTTP status,
          so the status code alone falsifies the ordering.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Riverside Emergency Shelter' with licensed_bed_capacity 1, band 12..17"
            - "youth Ava Reyes (dob 2010-03-15) holds the only bed with an ACTIVE admission, so occupied_beds == licensed_bed_capacity and posture is FROZEN"
            - "youth Bo Nakamura (dob 2012-06-10, age 14, inside the band) has one SafetyScreening dispositioned ESCALATED with specialized_response_code ADVOCATE_ASSIGNED, so his latest screening is ESCALATED and risk_posture is FROZEN"
            - "the admission request for Bo carries waitlist_opt_out true, which is exactly the shape priority 43 rejects"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 1, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { pp1_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ava", legal_last_name: "Reyes", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { pp1_ava_id: $.data.id }
            - call: "POST /ryhs/youths/${pp1_ava_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { pp1_ava_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${pp1_ava_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${pp1_ava_id}", program_id: "${pp1_program_id}", planned_discharge_at: "2026-08-20T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { pp1_ava_adm_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Bo", legal_last_name: "Nakamura", date_of_birth: "2012-06-10", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { pp1_bo_id: $.data.id }
            - call: "POST /ryhs/youths/${pp1_bo_id}/safety-screenings"
              payload: { indicator_codes: ["RECRUITER_PRESENT"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { pp1_bo_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${pp1_bo_scr_id}/disposition"
              payload: { disposition: "ESCALATED", specialized_response_code: "ADVOCATE_ASSIGNED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${pp1_bo_id}", program_id: "${pp1_program_id}", planned_discharge_at: "2026-08-25T00:00:00Z", waitlist_opt_out: true }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { pp1_err_id: $.data.error_id, pp1_err_message: $.data.message }
          assert:
            - "the request returns HTTP 422 with error_id ERR_SCREENING_ESCALATED_BLOCKS_ACTION"
            - "the request does NOT return HTTP 409 and does NOT return error_id ERR_BED_CAPACITY_EXCEEDED"
            - "SafetyScreening.${pp1_bo_scr_id}.status == ESCALATED"
            - "SafetyScreening.${pp1_bo_scr_id}.specialized_response_code == ADVOCATE_ASSIGNED"
            - "Youth.${pp1_bo_id}.risk_posture == FROZEN"
            - "Youth.${pp1_bo_id}.status == PROSPECT"
            - "ShelterProgram.${pp1_program_id}.posture == FROZEN"
            - "ShelterProgram.${pp1_program_id}.occupied_beds == 1"
            - "ShelterProgram.${pp1_program_id}.waitlisted_count == 0"
            - "GET /ryhs/admissions?youth_id=${pp1_bo_id} returns total_count 0"

      - name: case_state_outranks_mediation_cooldown_on_session_scheduling
        grounds:
          - validations[priority=14]
          - validations[priority=29]
          - errors.ERR_CASE_INVALID_STATE
          - errors.ERR_MEDIATION_COOLDOWN_ACTIVE
          - state_machines.ReunificationCase
        distinguishing_aspect: |
          A second, disjoint priority pair: a state rule (priority 14, the case must be OPENED or
          MEDIATION_HELD to accept a session) against a business_temporal rule (priority 29, the
          72-hour cooldown measured from the last held_at). Both are HTTP 409, so unlike the
          escalated-screening pair the status code cannot disambiguate them - only the error_id can,
          which is precisely why an implementation that evaluates temporal buffers before lifecycle
          state fails this test silently.
        test_recipe:
          setup:
            - "youth Rio Delgado created at the default clock 2026-08-01T00:00:00Z with no admissions, so risk_posture is OPEN"
            - "one ReunificationCase with one MediationSession scheduled 2026-08-03T14:00:00Z..15:00:00Z whose PROGRESS outcome is recorded at the clock 2026-08-03T15:00:00Z, so held_at is 2026-08-03T15:00:00Z, mediation_round is 1 and the cooldown floor is 2026-08-06T15:00:00Z"
            - "a CONDITIONAL home assessment then moves the case to HOME_ASSESSMENT, which is not in {OPENED, MEDIATION_HELD}"
            - "the candidate window 2026-08-04T10:00:00Z..11:00:00Z is disjoint from the held session's window (so priority 28 does not fire) and lies after the clock (so priority 32 does not fire), leaving exactly priorities 14 and 29 violated"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Rio", legal_last_name: "Delgado", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { rio_id: $.data.id, rio_v1: $.data.version }
            - call: "POST /ryhs/reunification-cases"
              payload: { youth_id: "${rio_id}", guardian_household_label: "Delgado household - father", expected_youth_version: "${rio_v1}" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { rio_case_id: $.data.id }
            - call: "POST /ryhs/reunification-cases/${rio_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-03T14:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { rio_session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T15:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/mediation-sessions/${rio_session_id}/record-outcome"
              payload: { outcome: "PROGRESS" }
              as: ReunificationSpecialist
              as_user_id: "rs-2"
            - call: "POST /ryhs/reunification-cases/${rio_case_id}/home-assessment"
              payload: { safety_assessment_result: "CONDITIONAL" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
          trigger:
            - call: "POST /ryhs/reunification-cases/${rio_case_id}/mediation-sessions"
              payload: { scheduled_start_at: "2026-08-04T10:00:00Z", scheduled_end_at: "2026-08-04T11:00:00Z" }
              as: ReunificationSpecialist
              as_user_id: "rs-1"
              captures: { rio_err_id: $.data.error_id, rio_err_message: $.data.message }
            - call: "GET /ryhs/reunification-cases/${rio_case_id}/mediation-sessions"
              payload: {}
              as: ReunificationSpecialist
              as_user_id: "rs-1"
          assert:
            - "the request returns HTTP 409 with error_id ERR_CASE_INVALID_STATE"
            - "the request does NOT return error_id ERR_MEDIATION_COOLDOWN_ACTIVE"
            - "ReunificationCase.${rio_case_id}.status == HOME_ASSESSMENT"
            - "ReunificationCase.${rio_case_id}.safety_assessment_result == CONDITIONAL"
            - "ReunificationCase.${rio_case_id}.mediation_round == 1"
            - "MediationSession.${rio_session_id}.held_at == 2026-08-03T15:00:00Z"
            - "MediationSession.${rio_session_id}.recorded_by_user_id == rs-2"
            - "GET /ryhs/reunification-cases/${rio_case_id}/mediation-sessions returns total_count 1"

  - rule_id: boundary_precision_check
    instances:
      - name: age_exactly_at_max_age_years_boundary_on_admission
        grounds:
          - calculations.youth_age_years
          - validations[priority=25]
          - errors.ERR_AGE_OUTSIDE_PROGRAM_BAND
          - entities.ShelterProgram.fields.max_age_years
          - entities.Youth.fields.age_years
        distinguishing_aspect: |
          Metric under test: Youth.age_years against ShelterProgram.max_age_years (17), an inclusive
          integer threshold, exercised through POST /ryhs/admissions. The two youths' birth dates are
          one calendar day apart - 2008-08-02 is still 17 at the clock 2026-08-01T00:00:00Z because
          the birthday has not arrived, while 2008-08-01 has just turned 18 because the birthday
          comparison is >= - so the pair pins both the inclusive band edge and the >= birthday rule at
          once. A day-of-year off-by-one or an exclusive band comparison flips exactly one of the two
          outcomes.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Riverside Emergency Shelter' with licensed_bed_capacity 2, min_age_years 12, max_age_years 17"
            - "the logical clock is the default 2026-08-01T00:00:00Z"
            - "youth Tess Whitmore, date_of_birth 2008-08-02, whose 18th birthday is one day in the future, so age_years is exactly 17 - the inclusive upper edge"
            - "youth Uma Braddock, date_of_birth 2008-08-01, whose 18th birthday is today, so age_years is 18 - one past the edge"
            - "both youths carry a CLEARED SafetyScreening so priority 25 is the only rule that can fire"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { band_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Tess", legal_last_name: "Whitmore", date_of_birth: "2008-08-02", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { tess_id: $.data.id, tess_age: $.data.age_years }
            - call: "POST /ryhs/youths/${tess_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { tess_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${tess_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Uma", legal_last_name: "Braddock", date_of_birth: "2008-08-01", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { uma_id: $.data.id, uma_age: $.data.age_years }
            - call: "POST /ryhs/youths/${uma_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { uma_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${uma_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${tess_id}", program_id: "${band_program_id}", planned_discharge_at: "2026-08-08T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { tess_adm_id: $.data.id }
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${uma_id}", program_id: "${band_program_id}", planned_discharge_at: "2026-08-08T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { uma_err_id: $.data.error_id }
          assert:
            - "Youth.${tess_id}.age_years == 17"
            - "Youth.${uma_id}.age_years == 18"
            - "Tess's admission returns HTTP 201"
            - "Admission.${tess_adm_id}.status == ACTIVE"
            - "Admission.${tess_adm_id}.projected_billable_nights == 7"
            - "Uma's admission returns HTTP 422 with error_id ERR_AGE_OUTSIDE_PROGRAM_BAND"
            - "Youth.${uma_id}.status == PROSPECT"
            - "GET /ryhs/admissions?youth_id=${uma_id} returns total_count 0"
            - "ShelterProgram.${band_program_id}.occupied_beds == 1"

      - name: empty_electorate_zero_count_edge_on_close_vote
        grounds:
          - calculations.governance_adoption_tally
          - validations[priority=41]
          - errors.ERR_NO_ELIGIBLE_ELECTORATE
          - entities.GovernanceProposal.fields.eligible_electorate_size
          - entities.GovernanceProposal.fields.support_ratio_bp
        distinguishing_aspect: |
          A structurally different boundary from the age band: the metric is the CARDINALITY of an
          empty collection, not a numeric threshold, and it is exercised through a different endpoint
          (POST /ryhs/governance-proposals/{id}/close-vote). With zero resident youths the electorate
          is empty, so support_ratio_bp must be reported as 0 rather than crashing on a divide by
          zero, the proposal must stay OPEN_FOR_VOTE, and the request must fail with
          ERR_NO_ELIGIBLE_ELECTORATE - a naive implementation either divides by zero or silently
          REJECTS the proposal because 0 bp is below the 5000 bp adoption ratio.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Harbor Street Shelter' with licensed_bed_capacity 2 and no admissions and no placements at all, so no Youth satisfies the electorate filter"
            - "one GovernanceProposal opened by ProgramAdmin with voting_closes_at 2026-08-10T00:00:00Z, which is after the default clock 2026-08-01T00:00:00Z so priority 32 passes"
            - "no GovernanceVote rows exist, so support_vote_count and oppose_vote_count are both 0 as well"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Harbor Street Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { empty_program_id: $.data.id }
            - call: "POST /ryhs/shelter-programs/${empty_program_id}/governance-proposals"
              payload: { title: "Later weeknight quiet hours", category: "HOUSE_RULES", voting_closes_at: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { empty_proposal_id: $.data.id }
          trigger:
            - call: "POST /ryhs/governance-proposals/${empty_proposal_id}/close-vote"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { empty_err_id: $.data.error_id, empty_err_message: $.data.message }
            - call: "GET /ryhs/governance-proposals/${empty_proposal_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the close-vote request returns HTTP 422 with error_id ERR_NO_ELIGIBLE_ELECTORATE"
            - "GovernanceProposal.${empty_proposal_id}.status == OPEN_FOR_VOTE"
            - "GovernanceProposal.${empty_proposal_id}.eligible_electorate_size == 0"
            - "GovernanceProposal.${empty_proposal_id}.support_vote_count == 0"
            - "GovernanceProposal.${empty_proposal_id}.oppose_vote_count == 0"
            - "GovernanceProposal.${empty_proposal_id}.support_ratio_bp == 0"
            - "GovernanceProposal.${empty_proposal_id}.adopted_at == null"
            - "GovernanceProposal.${empty_proposal_id}.decided_by_user_id == null"
            - "GET /ryhs/governance-proposals/${empty_proposal_id}/votes returns total_count 0"

      - name: savings_balance_exactly_meets_required_is_in_compliance_one_cent_below_is_deficient
        grounds:
          - calculations.required_savings
          - calculations.savings_match_award
          - entities.TlpPlacement.fields.compliance_status
          - entities.TlpPlacement.fields.required_savings_cents
          - entities.SavingsLedgerEntry.fields.signed_amount_cents
        distinguishing_aspect: |
          A third, whole-cent boundary on a third endpoint (POST
          /ryhs/tlp-placements/{id}/compliance-review): at day 30 the requirement is exactly 24000
          cents and a single 19200-cent deposit plus its 4800-cent match lands the balance on exactly
          24000, which the inclusive >= comparison must score IN_COMPLIANCE. A one-cent WITHDRAWAL
          then drops the balance to 23999 - still above the 12000-cent half-requirement floor - so the
          very next review must score SAVINGS_DEFICIENT rather than PROBATION, and
          consecutive_probation_reviews must stay 0.
        test_recipe:
          setup:
            - "one TRANSITIONAL_LIVING program 'Northside Transitional Living' with band 16..20, max_placement_days 540, savings_match_rate_bp 2500 and required_savings_rate_bp 2000"
            - "youth Ivy Marchetti (dob 2010-03-15, age 16) with a CLEARED SafetyScreening"
            - "an EMERGENCY_SHELTER program (licensed_bed_capacity 2, band 12..17) and an ACTIVE Admission for the youth, whose 24-hour GuardianNotification is attempted once by PHONE and then resolved CONTACTED - this is the only reachable path to Youth.status SHELTERED with risk_posture OPEN, which state_machines.Youth requires before SHELTERED -> TLP_ENROLLED"
            - "TlpPlacement placed at 2026-08-01T00:00:00Z with documented_monthly_income_cents 120000, so the monthly requirement is 24000 cents"
            - "the logical clock is moved to 2026-08-31T00:00:00Z, exactly 30 days later, so months_elapsed_full is 1 and required_savings_cents is 24000"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ivy_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ivy_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ivy", legal_last_name: "Marchetti", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ivy_id: $.data.id }
            - call: "POST /ryhs/youths/${ivy_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ivy_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${ivy_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${ivy_id}", program_id: "${ivy_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ivy_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${ivy_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { ivy_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${ivy_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${ivy_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${ivy_id}", program_id: "${ivy_program_id}", documented_monthly_income_cents: 120000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ivy_plc_id: $.data.id, ivy_plc_v1: $.data.version }
            - call: "POST /ryhs/tlp-placements/${ivy_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 19200, expected_placement_version: "${ivy_plc_v1}", source_note: "month 1 savings" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ivy_dep_id: $.data.id, ivy_dep_balance: $.data.balance_after_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/tlp-placements/${ivy_plc_id}/compliance-review"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ivy_review1_status: $.data.compliance_status, ivy_plc_v2: $.data.version }
            - call: "POST /ryhs/tlp-placements/${ivy_plc_id}/savings-entries"
              payload: { entry_type: "WITHDRAWAL", amount_cents: 1, expected_placement_version: "${ivy_plc_v2}", source_note: "one cent bus fare" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ivy_wd_id: $.data.id, ivy_wd_balance: $.data.balance_after_cents }
            - call: "POST /ryhs/tlp-placements/${ivy_plc_id}/compliance-review"
              payload: {}
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { ivy_review2_status: $.data.compliance_status }
          assert:
            - "SavingsLedgerEntry.${ivy_dep_id}.match_component_cents == 4800"
            - "SavingsLedgerEntry.${ivy_dep_id}.balance_after_cents == 24000"
            - "TlpPlacement.${ivy_plc_id}.days_elapsed == 30"
            - "TlpPlacement.${ivy_plc_id}.required_savings_cents == 24000"
            - "after review 1 TlpPlacement.${ivy_plc_id}.compliance_status == IN_COMPLIANCE"
            - "SavingsLedgerEntry.${ivy_wd_id}.signed_amount_cents == -1"
            - "SavingsLedgerEntry.${ivy_wd_id}.match_component_cents == 0"
            - "SavingsLedgerEntry.${ivy_wd_id}.balance_after_cents == 23999"
            - "TlpPlacement.${ivy_plc_id}.savings_balance_cents == 23999"
            - "after review 2 TlpPlacement.${ivy_plc_id}.compliance_status == SAVINGS_DEFICIENT"
            - "after review 2 TlpPlacement.${ivy_plc_id}.consecutive_probation_reviews == 0"
            - "Youth.${ivy_id}.lifetime_savings_deposited_cents == 19200"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: tlp_placement_blocked_until_latest_screening_is_cleared
        grounds:
          - validations[priority=30]
          - errors.ERR_SCREENING_REQUIRED
          - state_machines.SafetyScreening
          - entities.TlpPlacement.fields.tenancy_status
          - entities.Youth.fields.status
        distinguishing_aspect: |
          Entity pair TlpPlacement -> SafetyScreening: whether POST /ryhs/tlp-placements succeeds
          depends on the status of a row in a completely different aggregate, and specifically on the
          MOST RECENT screening rather than on any cleared screening ever recorded. The youth already
          owns a CLEARED screening, so an implementation that tests "exists a CLEARED screening"
          passes the placement through; only an implementation that orders screenings by created_at
          and inspects the newest one rejects it while the newer screening is still SUBMITTED, then
          admits the identical request once that screening is dispositioned CLEARED.
        test_recipe:
          setup:
            - "one TRANSITIONAL_LIVING program 'Northside Transitional Living' with licensed_bed_capacity 3, band 16..20, so bed inventory never gates the request"
            - "youth Jade Kimura (dob 2010-03-15, age 16) with a first SafetyScreening dispositioned CLEARED"
            - "an EMERGENCY_SHELTER program (licensed_bed_capacity 2, band 12..17) and an ACTIVE Admission for the youth, whose 24-hour GuardianNotification is attempted once by PHONE and then resolved CONTACTED - this is the only reachable path to Youth.status SHELTERED with risk_posture OPEN, which state_machines.Youth requires before SHELTERED -> TLP_ENROLLED"
            - "a SECOND SafetyScreening is then submitted with indicator_codes [CURFEW_ENFORCED] - score 10, tier LOW, status SUBMITTED - so the youth's newest screening is not CLEARED while risk_posture stays OPEN (no ESCALATED screening, no open guardian obligation, tier not CRITICAL), which keeps priority 48 quiet"
            - "the youth holds no other TlpPlacement, so priority 31 cannot fire, and the transitional-living program has spare beds, so priority 43 cannot fire either"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { jade_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { jade_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Jade", legal_last_name: "Kimura", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { jade_id: $.data.id }
            - call: "POST /ryhs/youths/${jade_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { jade_scr1_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${jade_scr1_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${jade_id}", program_id: "${jade_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { jade_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${jade_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { jade_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${jade_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${jade_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/youths/${jade_id}/safety-screenings"
              payload: { indicator_codes: ["CURFEW_ENFORCED"] }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { jade_scr2_id: $.data.id, jade_scr2_score: $.data.score }
          trigger:
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${jade_id}", program_id: "${jade_program_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { jade_blocked_err_id: $.data.error_id }
            - call: "POST /ryhs/safety-screenings/${jade_scr2_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${jade_id}", program_id: "${jade_program_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { jade_plc_id: $.data.id }
          assert:
            - "SafetyScreening.${jade_scr1_id}.status == CLEARED"
            - "the first placement attempt returns HTTP 422 with error_id ERR_SCREENING_REQUIRED"
            - "immediately after the first attempt GET /ryhs/tlp-placements?youth_id=${jade_id} returns total_count 0"
            - "SafetyScreening.${jade_scr2_id}.score == 10"
            - "SafetyScreening.${jade_scr2_id}.tier == LOW"
            - "SafetyScreening.${jade_scr2_id}.status == CLEARED after the disposition"
            - "the second placement attempt returns HTTP 201"
            - "TlpPlacement.${jade_plc_id}.tenancy_status == PLACED"
            - "TlpPlacement.${jade_plc_id}.compliance_status == IN_COMPLIANCE"
            - "TlpPlacement.${jade_plc_id}.placed_at == 2026-08-01T00:00:00Z"
            - "TlpPlacement.${jade_plc_id}.base_allowance_days == 540"
            - "Youth.${jade_id}.status == TLP_ENROLLED"
            - "ShelterProgram.${jade_program_id}.occupied_beds == 1"
            - "GET /ryhs/tlp-placements?youth_id=${jade_id} returns total_count 1"

      - name: admission_landing_state_determined_by_program_posture
        grounds:
          - state_machines.Admission.PENDING_SCREENING_to_WAITLISTED
          - calculations.program_posture
          - validations[priority=43]
          - entities.Admission.fields.capacity_blocked
          - entities.ShelterProgram.fields.waitlisted_count
        distinguishing_aspect: |
          A different entity pair - Admission -> ShelterProgram - and a different kind of dependency:
          the parent program's derived posture does not merely permit or forbid the write, it selects
          which STATE the new child lands in. The same POST /ryhs/admissions body produces ACTIVE
          against an OPEN program and WAITLISTED with capacity_blocked true, admitted_at null and no
          GuardianNotification against a FROZEN one; adding waitlist_opt_out true to that same
          FROZEN-program request converts the soft waitlist landing into a hard 409
          ERR_BED_CAPACITY_EXCEEDED. The FROZEN capacity branch is also evaluated BEFORE the
          cleared-screening short circuit, so a youth with a CLEARED screening is still waitlisted.
        test_recipe:
          setup:
            - "one EMERGENCY_SHELTER program 'Riverside Emergency Shelter' with licensed_bed_capacity 1, band 12..17, so posture is OPEN while empty and FROZEN once the single bed is taken"
            - "youth Ava Reyes (dob 2010-03-15, age 16) with a CLEARED SafetyScreening takes the bed first, landing ACTIVE against the then-OPEN program"
            - "youth Bo Nakamura (dob 2012-06-10, age 14) and youth Cy Ferrer (dob 2014-01-20, age 12) both carry CLEARED screenings, so validations priority 19 and 30 stay quiet and only the posture decides their fate"
            - "Bo's request omits waitlist_opt_out; Cy's request sets waitlist_opt_out true"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 1, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { post_program_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ava", legal_last_name: "Reyes", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { post_ava_id: $.data.id }
            - call: "POST /ryhs/youths/${post_ava_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { post_ava_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${post_ava_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${post_ava_id}", program_id: "${post_program_id}", planned_discharge_at: "2026-08-20T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { post_ava_adm_id: $.data.id, post_ava_status: $.data.status }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Bo", legal_last_name: "Nakamura", date_of_birth: "2012-06-10", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { post_bo_id: $.data.id }
            - call: "POST /ryhs/youths/${post_bo_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { post_bo_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${post_bo_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Cy", legal_last_name: "Ferrer", date_of_birth: "2014-01-20", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { post_cy_id: $.data.id }
            - call: "POST /ryhs/youths/${post_cy_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { post_cy_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${post_cy_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${post_bo_id}", program_id: "${post_program_id}", planned_discharge_at: "2026-08-25T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { post_bo_adm_id: $.data.id, post_bo_status: $.data.status }
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${post_cy_id}", program_id: "${post_program_id}", planned_discharge_at: "2026-08-25T00:00:00Z", waitlist_opt_out: true }
              as: ShelterCaseManager
