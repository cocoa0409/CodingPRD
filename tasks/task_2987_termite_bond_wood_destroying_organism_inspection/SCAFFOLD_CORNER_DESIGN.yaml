              as: FieldInspector
              as_user_id: "${i1}"
              captures: { ins1: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${p1}", inspector_id: "${i1}", purpose: "MONTHLY", scheduled_start_at: "2026-08-02T13:00:00Z", scheduled_end_at: "2026-08-02T15:00:00Z" }
              as: FieldInspector
