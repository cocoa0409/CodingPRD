scenario: "2230. Consumer Health Application Data Compliance (consumer health technology company): applicability analysis distinguishing covered health entity status from consumer health data regulation, consumer health data definition mapping across collected data elements including inferences, consent architecture with separate consent for collection, sharing and sale plus withdrawal mechanisms, privacy policy content requirements with data category, purpose and third-party disclosure specificity, consumer rights fulfillment across access, deletion and confirmation with verification and response deadlines, geofencing restrictions around health facilities where prohibited by law, vendor and processor agreements with flow-down obligations and audit rights, breach notification analysis across health-specific and general breach rules, security program requirements with risk assessment documentation"
domain_name: "consumer-health-data-compliance"
api_prefix: "/health-data"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Access control matrix"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: AppProduct
    parent: null
    common_fields: true
    fields:
      - name: product_name
        type: string
        source: input
        description: consumer health application trade name
      - name: company_legal_name
        type: string
        source: input
        description: legal entity operating the application
      - name: primary_state_code
        type: string
        source: input
        description: two-letter US state code of the operator's principal place of business
        constraints: "one of {WA, NV, CT, CA, TX}"
      - name: consumer_count
        type: integer
        source: input
        description: number of natural persons whose data the product processes per year
        constraints: ">= 0"
      - name: annual_revenue_cents
        type: integer
        source: input
        description: prior-year gross revenue in cents
        constraints: ">= 0"
      - name: hipaa_covered_transaction_ratio
        type: number
        source: input
        description: fraction of the product's data flows arising from HIPAA covered functions
        constraints: "0.00 <= value <= 1.00, exactly 2 decimal places"
      - name: small_business_flag
        type: boolean
        source: computed
        description: "true iff consumer_count < 100000 AND annual_revenue_cents < 2500000000; see calculations.applicability_determination"
      - name: applicability_status
        type: enum
        source: computed
        description: "regulatory track pinned by the APPROVED ApplicabilityAssessment; UNDETERMINED until one exists"
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, HIPAA_ONLY, DUAL_TRACK, CHD_REGULATED}"
      - name: regulated_scope
        type: enum
        source: computed
        description: "breadth of regulated data copied from the APPROVED ApplicabilityAssessment.regulated_scope"
        default: NONE
        constraints: "one of {NONE, PARTIAL, FULL}"
      - name: active_element_count
        type: integer
        source: computed
        description: "count of DataElement rows with app_product_id == this id AND status == ACTIVE"
        default: 0
      - name: regulated_element_count
        type: integer
        source: computed
        description: "count of DataElement rows with app_product_id == this id AND status == ACTIVE AND chd_classification IN {CHD, CHD_BY_INFERENCE}"
        default: 0
      - name: compliance_deadline_date
        type: string
        source: computed
        description: "ISO 8601 date (YYYY-MM-DD) copied from the APPROVED ApplicabilityAssessment.compliance_deadline_date; null when applicability_status == HIPAA_ONLY or UNDETERMINED"
      - name: active_share_consent_count
        type: integer
        source: computed
        description: "count of ConsentRecord rows whose consumer_id belongs to a Consumer with app_product_id == this id AND record_state == ACTIVE AND sharing_state == GRANTED"
        default: 0
      - name: exposure_cents
        type: integer
        source: computed
        description: "sum of BreachIncident.exposure_contribution_cents over BreachIncident rows with app_product_id == this id AND state IN {REPORTABLE, NOTIFIED}"
        default: 0
      - name: policy_compliance_state
        type: enum
        source: computed
        description: "NO_POLICY when no PrivacyPolicyVersion for this product has ever reached PUBLISHED; CURRENT when exactly one PrivacyPolicyVersion has state == PUBLISHED; LAPSED when the most recently published PrivacyPolicyVersion has state == SUPERSEDED_PENDING_UPDATE"
        default: NO_POLICY
        constraints: "one of {NO_POLICY, CURRENT, LAPSED}"
      - name: security_program_state
        type: enum
        source: computed
        description: "NONE when no SecurityRiskAssessment for this product has state == FINALIZED; CURRENT when the FINALIZED SecurityRiskAssessment with the greatest created_at has risk_tier IN {LOW, MODERATE}; STALE when that assessment has risk_tier IN {HIGH, CRITICAL}"
        default: NONE
        constraints: "one of {NONE, CURRENT, STALE}"

  - name: ApplicabilityAssessment
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product whose regulatory track this assessment determines"
      - name: entity_status_claim
        type: enum
        source: input
        description: operator's self-declared HIPAA status used by STEP 1 of the determination
        constraints: "one of {COVERED_ENTITY, BUSINESS_ASSOCIATE, NOT_COVERED}"
      - name: analyst_note
        type: string
        source: input
        description: free-text rationale recorded with the assessment
      - name: determination
        type: enum
        source: computed
        description: "regulatory track produced by calculations.applicability_determination STEP 1"
        constraints: "one of {HIPAA_ONLY, DUAL_TRACK, CHD_REGULATED}"
      - name: regulated_element_count_snapshot
        type: integer
        source: computed
        description: "regulated element count frozen at submit time by calculations.applicability_determination STEP 3"
        default: 0
      - name: active_element_count_snapshot
        type: integer
        source: computed
        description: "count of DataElement rows with status == ACTIVE frozen at submit time by calculations.applicability_determination STEP 3"
        default: 0
      - name: regulated_scope
        type: enum
        source: computed
        description: "breadth classification produced by calculations.applicability_determination STEP 4"
        constraints: "one of {NONE, PARTIAL, FULL}"
      - name: compliance_deadline_date
        type: string
        source: computed
        description: "ISO 8601 date (YYYY-MM-DD) produced by calculations.applicability_determination STEP 4; null when determination == HIPAA_ONLY"
      - name: state
        type: enum
        source: computed
        description: review lifecycle position of this assessment
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, RETURNED, SUPERSEDED}"
      - name: revision_count
        type: integer
        source: computed
        description: number of times this assessment has been returned to DRAFT by a revise call
        default: 0
      - name: submitted_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the PrivacyOfficer who submitted this assessment; null while state == DRAFT and never submitted"
      - name: approved_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceApprover who approved this assessment; null until state == APPROVED"
      - name: return_reason
        type: string
        source: computed
        description: reason text supplied by the ComplianceApprover on the most recent return

  - name: DataElement
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product that collects this data element"
      - name: element_key
        type: string
        source: input
        description: stable machine key for the element
        constraints: "unique per app_product_id across DataElement rows with status IN {ACTIVE, RETIRED}"
      - name: display_name
        type: string
        source: input
        description: human-readable element label used in privacy policy text
      - name: source_kind
        type: enum
        source: input
        description: how the product acquires the element
        constraints: "one of {USER_PROVIDED, DEVICE_SENSOR, THIRD_PARTY, DERIVED_INFERENCE}"
      - name: health_signal_kind
        type: enum
        source: input
        description: health meaning carried by the element itself
        constraints: "one of {DIAGNOSIS, TREATMENT, MEASUREMENT, REPRODUCTIVE, PRECISE_LOCATION, BIOMETRIC, NON_HEALTH}"
      - name: derived_from_element_id
        type: string
        source: input
        description: "FK -> DataElement.id; parent element this inference is derived from; null when source_kind != DERIVED_INFERENCE"
      - name: hipaa_flow_only
        type: boolean
        source: input
        description: true when the element is processed solely inside a HIPAA covered function
        default: false
      - name: inference_depth
        type: integer
        source: computed
        description: "number of derived_from_element_id hops from this element to its non-derived root; 0 when derived_from_element_id is null"
        default: 0
      - name: chd_classification
        type: enum
        source: computed
        description: "consumer health data classification produced by calculations.chd_classification"
        constraints: "one of {CHD, CHD_BY_INFERENCE, NON_CHD}"
      - name: status
        type: enum
        source: computed
        description: whether the element is still collected by the product
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"
      - name: retired_reason
        type: string
        source: computed
        description: reason text recorded when the element was retired; null while status == ACTIVE

  - name: ProcessingPurpose
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product that declares this processing purpose"
      - name: purpose_key
        type: string
        source: input
        description: stable machine key for the purpose
        constraints: "unique per app_product_id"
      - name: description_text
        type: string
        source: input
        description: purpose description as it appears in the privacy policy
      - name: purpose_kind
        type: enum
        source: input
        description: business character of the processing
        constraints: "one of {PRIMARY_SERVICE, ANALYTICS, ADVERTISING, RESEARCH, SALE}"
      - name: activity_kind
        type: enum
        source: input
        description: regulated activity the purpose performs on the data
        constraints: "one of {COLLECT, SHARE, SELL}"
      - name: consent_axis
        type: enum
        source: computed
        description: "consent axis this purpose consumes; equals activity_kind (COLLECT -> COLLECT, SHARE -> SHARE, SELL -> SELL)"
        constraints: "one of {COLLECT, SHARE, SELL}"
      - name: requires_separate_consent
        type: boolean
        source: computed
        description: "true iff activity_kind IN {SHARE, SELL} OR purpose_kind IN {ADVERTISING, RESEARCH, SALE}"
      - name: third_party_disclosure_required
        type: boolean
        source: computed
        description: "true iff activity_kind IN {SHARE, SELL}; when true an ElementPurposeMapping on this purpose must name a Vendor"

  - name: ElementPurposeMapping
    parent: null
    common_fields: true
    fields:
      - name: data_element_id
        type: string
        source: input
        description: "FK -> DataElement.id; element being processed"
      - name: processing_purpose_id
        type: string
        source: input
        description: "FK -> ProcessingPurpose.id; purpose the element is processed for"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; recipient of the disclosure; null when the purpose's activity_kind == COLLECT"
      - name: disclosure_specificity
        type: enum
        source: input
        description: granularity at which this mapping is disclosed in the privacy policy
        constraints: "one of {ELEMENT_NAMED, CATEGORY_NAMED}"
      - name: status
        type: enum
        source: computed
        description: whether this element-purpose pairing is live
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, SUSPENDED, RETIRED}"
      - name: suspension_reason
        type: string
        source: computed
        description: reason text recorded when the mapping was suspended by a cascade or by an operator
      - name: regulated_flag
        type: boolean
        source: computed
        description: "true iff the referenced DataElement.chd_classification IN {CHD, CHD_BY_INFERENCE}"

  - name: Consumer
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product this consumer uses"
      - name: external_ref
        type: string
        source: input
        description: operator-side pseudonymous account reference
        constraints: "unique per app_product_id"
      - name: residency_state_code
        type: string
        source: input
        description: two-letter US state code of the consumer's residence
        constraints: "one of {WA, NV, CT, CA, TX}"
      - name: age_band
        type: enum
        source: input
        description: age bracket used by the minor-sale prohibition
        constraints: "one of {ADULT, MINOR_13_16, UNDER_13}"
      - name: verification_token
        type: string
        source: system
        description: server-issued token the consumer presents to verify a rights request
      - name: deletion_completed_count
        type: integer
        source: computed
        description: "count of ConsumerRequest rows with consumer_id == this id AND request_kind == DELETE AND state == FULFILLED"
        default: 0

  - name: ConsentRecord
    parent: Consumer
    common_fields: true
    fields:
      - name: consumer_id
        type: string
        source: input
        description: "FK -> Consumer.id; consumer whose consent this record holds"
      - name: collection_state
        type: enum
        source: computed
        description: consent axis governing collection of consumer health data
        default: NOT_REQUESTED
        constraints: "one of {NOT_REQUESTED, GRANTED, WITHDRAWN}"
      - name: sharing_state
        type: enum
        source: computed
        description: consent axis governing disclosure to third parties
        default: NOT_REQUESTED
        constraints: "one of {NOT_REQUESTED, GRANTED, WITHDRAWN}"
      - name: sale_state
        type: enum
        source: computed
        description: authorization axis governing sale of consumer health data
        default: NOT_REQUESTED
        constraints: "one of {NOT_REQUESTED, AUTHORIZED, REVOKED}"
      - name: record_state
        type: enum
        source: computed
        description: whether this record is the live consent record for the consumer
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"
      - name: collection_granted_at
        type: datetime
        source: computed
        description: logical-clock instant at which collection_state became GRANTED
      - name: sharing_granted_at
        type: datetime
        source: computed
        description: logical-clock instant at which sharing_state became GRANTED
      - name: sale_authorized_at
        type: datetime
        source: computed
        description: logical-clock instant at which sale_state became AUTHORIZED
      - name: last_withdrawn_axis
        type: enum
        source: computed
        description: axis named by the most recent withdrawal accepted on this record
        constraints: "one of {COLLECT, SHARE, SELL}"
      - name: last_withdrawn_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent accepted withdrawal
      - name: processing_halt_deadline_at
        type: datetime
        source: computed
        description: "last_withdrawn_at + PROCESSING_HALT_DAYS; null while no withdrawal has been accepted"

  - name: PrivacyPolicyVersion
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product this policy version governs"
      - name: applicability_assessment_id
        type: string
        source: input
        description: "FK -> ApplicabilityAssessment.id; assessment whose determination this policy is drafted against"
      - name: version_label
        type: string
        source: input
        description: operator-facing label of the policy version
      - name: specificity_mode
        type: enum
        source: input
        description: disclosure granularity variant selected for this policy version
        constraints: "one of {ELEMENT_LEVEL, CATEGORY_LEVEL}"
      - name: disclosed_category_count
        type: integer
        source: input
        description: number of distinct data categories or named elements disclosed by the policy text
        constraints: ">= 0"
      - name: disclosed_purpose_count
        type: integer
        source: input
        description: number of processing purposes disclosed by the policy text
        constraints: ">= 0"
      - name: disclosed_third_party_count
        type: integer
        source: input
        description: number of third-party recipients the policy text acknowledges
        constraints: ">= 0"
      - name: named_third_party_count
        type: integer
        source: input
        description: number of those recipients the policy text names individually
        constraints: "0 <= named_third_party_count <= disclosed_third_party_count"
      - name: effective_from
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) on which this policy version takes effect
      - name: effective_to
        type: string
        source: computed
        description: "ISO 8601 date (YYYY-MM-DD) at which this policy version stopped being effective; set when a later version is published; null while state IN {DRAFT, IN_REVIEW, PUBLISHED, SUPERSEDED_PENDING_UPDATE}"
      - name: completeness_score
        type: number
        source: computed
        description: "policy content completeness produced by calculations.policy_completeness_score, one decimal place"
        default: 0.0
      - name: gap_count
        type: integer
        source: computed
        description: "number of the three completeness components whose ratio is strictly below 1.0"
        default: 0
      - name: state
        type: enum
        source: computed
        description: publication lifecycle position of this policy version
        default: DRAFT
        constraints: "one of {DRAFT, IN_REVIEW, PUBLISHED, SUPERSEDED_PENDING_UPDATE, SUPERSEDED}"
      - name: authored_by_user_id
        type: string
        source: system
        description: X-User-ID of the PrivacyOfficer who created this policy version
      - name: published_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the ComplianceApprover who published this policy version; null until state has reached PUBLISHED"

  - name: ConsumerRequest
    parent: Consumer
    common_fields: true
    fields:
      - name: consumer_id
        type: string
        source: input
        description: "FK -> Consumer.id; consumer exercising the right"
      - name: request_kind
        type: enum
        source: input
        description: consumer right being exercised
        constraints: "one of {ACCESS, DELETE, CONFIRM}"
      - name: submitted_channel
        type: enum
        source: input
        description: intake channel the request arrived on
        constraints: "one of {IN_APP, EMAIL, WEB_FORM}"
      - name: received_at
        type: datetime
        source: system
        description: logical-clock instant at which the request was created
      - name: state
        type: enum
        source: computed
        description: fulfillment lifecycle position of this request
        default: RECEIVED
        constraints: "one of {RECEIVED, VERIFICATION_PENDING, VERIFIED, FULFILLED, DENIED}"
      - name: verification_rounds_used
        type: integer
        source: computed
        description: number of times the operator has asked this consumer for more identity information
        default: 0
      - name: verification_window_ends_at
        type: datetime
        source: computed
        description: "instant at which the open identity-verification window closes; null unless state == VERIFICATION_PENDING"
      - name: verified_at
        type: datetime
        source: computed
        description: logical-clock instant at which identity verification succeeded
      - name: extension_granted
        type: boolean
        source: computed
        description: whether the one permitted response-deadline extension has been taken
        default: false
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "governing response deadline produced by calculations.request_response_deadline"
      - name: outstanding_task_count
        type: integer
        source: computed
        description: "count of DeletionTask rows with consumer_request_id == this id AND state IN {PENDING, NOTIFIED, FAILED}"
        default: 0
      - name: denial_reason
        type: string
        source: computed
        description: reason text recorded when the request was denied

  - name: DeletionTask
    parent: ConsumerRequest
    common_fields: true
    fields:
      - name: consumer_request_id
        type: string
        source: input
        description: "FK -> ConsumerRequest.id; DELETE request that spawned this downstream task"
      - name: vendor_id
        type: string
        source: input
        description: "FK -> Vendor.id; recipient that must delete its copy of the data"
      - name: hop_distance
        type: integer
        source: computed
        description: "number of subprocessor_of_id hops from the directly-mapped Vendor to this task's Vendor; 0 for a directly-mapped Vendor"
        default: 0
      - name: state
        type: enum
        source: computed
        description: downstream deletion progress for this vendor
        default: PENDING
        constraints: "one of {PENDING, NOTIFIED, CONFIRMED, FAILED}"
      - name: attempt_count
        type: integer
        source: computed
        description: number of notify calls issued on this task
        default: 0
      - name: due_at
        type: datetime
        source: computed
        description: "instant at which this vendor's deletion confirmation is due; set on notify to notified_at + Vendor.deletion_sla_days days"
      - name: confirmed_at
        type: datetime
        source: computed
        description: logical-clock instant at which the vendor confirmed deletion
      - name: failure_reason
        type: string
        source: computed
        description: reason text recorded when the task was marked FAILED

  - name: Vendor
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product that engaged this vendor"
      - name: vendor_name
        type: string
        source: input
        description: legal name of the vendor
        constraints: "unique per app_product_id"
      - name: vendor_kind
        type: enum
        source: input
        description: role the vendor plays with respect to the data
        constraints: "one of {PROCESSOR, THIRD_PARTY_RECIPIENT, PURCHASER}"
      - name: subprocessor_of_id
        type: string
        source: input
        description: "FK -> Vendor.id; vendor that engaged this vendor as a subprocessor; null for a directly-engaged vendor"
      - name: flow_down_clause
        type: boolean
        source: input
        description: contract obliges the vendor to impose equivalent terms on its own subprocessors
        default: false
      - name: audit_rights_clause
        type: boolean
        source: input
        description: contract grants the operator inspection and audit rights
        default: false
      - name: sale_authorization_clause
        type: boolean
        source: input
        description: contract authorizes the vendor to purchase consumer health data
        default: false
      - name: deletion_sla_days
        type: integer
        source: input
        description: contractual number of days the vendor has to confirm a deletion instruction
        default: 30
        constraints: "1 <= deletion_sla_days <= 90"
      - name: agreement_state
        type: enum
        source: computed
        description: execution status of the vendor agreement
        default: DRAFT
        constraints: "one of {DRAFT, EXECUTED, TERMINATED}"
      - name: agreement_compliance
        type: enum
        source: computed
        description: "COMPLIANT iff flow_down_clause == true AND audit_rights_clause == true AND (vendor_kind != PURCHASER OR sale_authorization_clause == true); otherwise DEFICIENT"
        default: DEFICIENT
        constraints: "one of {COMPLIANT, DEFICIENT}"
      - name: executed_at
        type: datetime
        source: computed
        description: logical-clock instant at which the agreement was executed
      - name: terminated_at
        type: datetime
        source: computed
        description: logical-clock instant at which the agreement was terminated

  - name: GeofenceZone
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product that registered this zone"
      - name: zone_name
        type: string
        source: input
        description: label of the health facility zone
      - name: state_code
        type: string
        source: input
        description: two-letter US state code the facility sits in
        constraints: "one of {WA, NV, CT, CA, TX}"
      - name: facility_kind
        type: enum
        source: input
        description: sensitivity class of the facility
        constraints: "one of {SENSITIVE_HEALTH, GENERAL_HEALTH, NON_HEALTH}"
      - name: center_label
        type: string
        source: input
        description: operator-facing label of the zone centre point
      - name: radius_meters
        type: integer
        source: input
        description: radius of the facility zone in metres
        constraints: "1 <= radius_meters <= 5000"
      - name: prohibition_rule
        type: enum
        source: computed
        description: "geofencing rule produced by GEOFENCE_LAW_BY_STATE[state_code] combined with facility_kind; see calculations.geofence_standoff"
        constraints: "one of {PROHIBITED_ALL, PROHIBITED_SENSITIVE_ONLY, PERMITTED}"
      - name: min_standoff_meters
        type: integer
        source: computed
        description: "minimum permitted standoff produced by calculations.geofence_standoff; 500 when prohibition_rule == PROHIBITED_SENSITIVE_ONLY, 0 when PERMITTED, not applicable when PROHIBITED_ALL"
        default: 0
      - name: last_campaign_activated_at
        type: datetime
        source: computed
        description: logical-clock instant at which a GeofenceCampaign on this zone most recently entered ACTIVE

  - name: GeofenceCampaign
    parent: GeofenceZone
    common_fields: true
    fields:
      - name: geofence_zone_id
        type: string
        source: input
        description: "FK -> GeofenceZone.id; zone this campaign targets near"
      - name: processing_purpose_id
        type: string
        source: input
        description: "FK -> ProcessingPurpose.id; purpose the campaign processes location data for"
      - name: campaign_name
        type: string
        source: input
        description: label of the campaign
      - name: target_radius_meters
        type: integer
        source: input
        description: radius of the campaign's own targeting circle in metres
        constraints: "1 <= target_radius_meters <= 5000"
      - name: distance_to_zone_center_meters
        type: integer
        source: input
        description: surveyed distance in metres from the campaign centre to the zone centre
        constraints: ">= 0"
      - name: standoff_meters
        type: integer
        source: computed
        description: "clearance between the campaign circle and the zone circle produced by calculations.geofence_standoff"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the campaign's occupation window on the zone
      - name: window_end_at
        type: datetime
        source: input
        description: inclusive end of the campaign's occupation window on the zone
      - name: state
        type: enum
        source: computed
        description: run status of the campaign
        default: PLANNED
        constraints: "one of {PLANNED, ACTIVE, PAUSED, ENDED}"
      - name: pause_reason
        type: string
        source: computed
        description: reason text recorded when the campaign was paused by a cascade or by an operator

  - name: BreachIncident
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product whose data was exposed"
      - name: incident_label
        type: string
        source: input
        description: operator-facing label of the incident
      - name: discovered_at
        type: datetime
        source: input
        description: instant at which the operator discovered the breach
      - name: breach_scope
        type: enum
        source: input
        description: categories of data involved, selecting which notification rules apply
        constraints: "one of {CHD_ONLY, GENERAL_PII_ONLY, MIXED}"
      - name: protection_state
        type: enum
        source: input
        description: whether the exposed data was rendered unusable by encryption
        constraints: "one of {UNPROTECTED, ENCRYPTED_SECURED}"
      - name: affected_consumer_count
        type: integer
        source: input
        description: total number of consumers whose data was exposed
        constraints: ">= 0"
      - name: affected_state_max_count
        type: integer
        source: input
        description: largest number of affected consumers resident in any single state
        constraints: "0 <= affected_state_max_count <= affected_consumer_count"
      - name: state
        type: enum
        source: computed
        description: notification lifecycle position of this incident
        default: DISCOVERED
        constraints: "one of {DISCOVERED, REPORTABLE, NOT_REPORTABLE, NOTIFIED}"
      - name: health_rule_deadline_at
        type: datetime
        source: computed
        description: "health-specific notification deadline produced by calculations.breach_notification_deadline; null when the health-specific rule does not apply"
      - name: general_rule_deadline_at
        type: datetime
        source: computed
        description: "general breach notification deadline produced by calculations.breach_notification_deadline; null when the general rule does not apply"
      - name: governing_deadline_at
        type: datetime
        source: computed
        description: "earlier of the applicable deadlines produced by calculations.breach_notification_deadline; null when state == NOT_REPORTABLE"
      - name: media_notice_required
        type: boolean
        source: computed
        description: "true iff state IN {REPORTABLE, NOTIFIED} AND affected_state_max_count >= MEDIA_NOTICE_THRESHOLD"
        default: false
      - name: media_notice_sent
        type: boolean
        source: input
        description: whether substitute media notice accompanied the notification
        default: false
      - name: notified_at
        type: datetime
        source: computed
        description: logical-clock instant at which notification was recorded
      - name: exposure_contribution_cents
        type: integer
        source: computed
        description: "affected_consumer_count * PER_CONSUMER_EXPOSURE_CENTS when state IN {REPORTABLE, NOTIFIED}; 0 otherwise"
        default: 0

  - name: SecurityRiskAssessment
    parent: AppProduct
    common_fields: true
    fields:
      - name: app_product_id
        type: string
        source: input
        description: "FK -> AppProduct.id; product whose security program this assessment documents"
      - name: assessment_label
        type: string
        source: input
        description: operator-facing label of the risk assessment
      - name: admin_control_score
        type: integer
        source: input
        description: administrative safeguard maturity score
        constraints: "0 <= admin_control_score <= 100"
      - name: technical_control_score
        type: integer
        source: input
        description: technical safeguard maturity score
        constraints: "0 <= technical_control_score <= 100"
      - name: physical_control_score
        type: integer
        source: input
        description: physical safeguard maturity score
        constraints: "0 <= physical_control_score <= 100"
      - name: vendor_oversight_score
        type: integer
        source: input
        description: vendor oversight maturity score
        constraints: "0 <= vendor_oversight_score <= 100"
      - name: documented_gap_count
        type: integer
        source: input
        description: number of documented control gaps carried into the penalty multiplier
        constraints: ">= 0"
      - name: remediation_plan_present
        type: boolean
        source: input
        description: whether a written remediation plan accompanies the assessment
        default: false
      - name: residual_risk_score
        type: number
        source: computed
        description: "residual risk produced by calculations.residual_risk_score, two decimal places"
        default: 0.00
      - name: risk_tier
        type: enum
        source: computed
        description: "band of residual_risk_score produced by calculations.residual_risk_score"
        default: LOW
        constraints: "one of {LOW, MODERATE, HIGH, CRITICAL}"
      - name: state
        type: enum
        source: computed
        description: documentation lifecycle position of this assessment
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED}"
      - name: finalized_at
        type: datetime
        source: computed
        description: logical-clock instant at which the assessment was finalized

state_machines:
  - entity: ApplicabilityAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /health-data/applicability-assessments/{id}/submit"
        actor: PrivacyOfficer
        preconditions:
          - "assessment.state == DRAFT"
          - "AppProduct has at least one DataElement with status == ACTIVE"
        side_effects:
          - "runs calculations.applicability_determination and writes determination, regulated_element_count_snapshot, active_element_count_snapshot, regulated_scope, compliance_deadline_date"
          - "sets submitted_by_user_id to the caller's X-User-ID"
          - "recomputes AppProduct.small_business_flag"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /health-data/applicability-assessments/{id}/approve"
        actor: ComplianceApprover
        preconditions:
          - "assessment.state == SUBMITTED"
          - "caller X-User-ID != assessment.submitted_by_user_id"
        side_effects:
          - "sets approved_by_user_id to the caller's X-User-ID"
          - "sets AppProduct.applicability_status = assessment.determination, AppProduct.regulated_scope = assessment.regulated_scope, AppProduct.compliance_deadline_date = assessment.compliance_deadline_date"
          - "every other ApplicabilityAssessment on the same app_product_id with state == APPROVED transitions to SUPERSEDED"
          - "increments AppProduct.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /health-data/applicability-assessments/{id}/return"
        actor: ComplianceApprover
        preconditions:
          - "assessment.state == SUBMITTED"
        side_effects:
          - "sets return_reason from the request body"
          - "leaves AppProduct.applicability_status unchanged"
      - from: RETURNED
        to: DRAFT
        trigger: "POST /health-data/applicability-assessments/{id}/revise"
        actor: PrivacyOfficer
        preconditions:
          - "assessment.state == RETURNED"
          - "assessment.revision_count < MAX_ASSESSMENT_REVISIONS"
        side_effects:
          - "increments revision_count by 1"
          - "clears determination, regulated_scope, compliance_deadline_date and submitted_by_user_id to null"
        note: "cycle RETURNED -> DRAFT -> SUBMITTED -> RETURNED, bounded by MAX_ASSESSMENT_REVISIONS"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: another ApplicabilityAssessment on the same app_product_id is approved"
        actor: system
        preconditions:
          - "assessment.state == APPROVED"
        side_effects:
          - "no change to AppProduct fields; the approving assessment's side effects already rewrote them"

  - entity: DataElement
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /health-data/data-elements/{id}/retire"
        actor: DataSteward
        preconditions:
          - "element.status == ACTIVE"
        side_effects:
          - "sets retired_reason from the request body"
          - "cascade hop 2: every DataElement with derived_from_element_id == this id AND status == ACTIVE transitions ACTIVE -> RETIRED with retired_reason SOURCE_ELEMENT_RETIRED, applied transitively over the derivation chain in ascending created_at order"
          - "cascade hop 3: because those elements became RETIRED, every ElementPurposeMapping whose data_element_id is any element retired by hops 1-2 and whose status IN {PROPOSED, ACTIVE, SUSPENDED} transitions to RETIRED"
          - "cascade hop 4: because the retired mapping set changed, AppProduct.active_element_count and AppProduct.regulated_element_count are recomputed"
      - from: RETIRED
        to: ACTIVE
        trigger: "POST /health-data/data-elements/{id}/reinstate"
        actor: DataSteward
        preconditions:
          - "element.status == RETIRED"
          - "element.derived_from_element_id is null OR the referenced parent DataElement.status == ACTIVE"
        side_effects:
          - "clears retired_reason to null"
          - "recomputes chd_classification and inference_depth via calculations.chd_classification"
          - "recomputes AppProduct.active_element_count and AppProduct.regulated_element_count"
        note: "cycle ACTIVE -> RETIRED -> ACTIVE; retired mappings are NOT revived"

  - entity: ElementPurposeMapping
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /health-data/element-purpose-mappings/{id}/activate"
        actor: DataSteward
        preconditions:
          - "mapping.status == PROPOSED"
          - "referenced DataElement.status == ACTIVE"
          - "AppProduct.applicability_status IN {DUAL_TRACK, CHD_REGULATED}"
          - "AppProduct.policy_compliance_state != LAPSED"
          - "when the referenced ProcessingPurpose.third_party_disclosure_required == true: mapping.vendor_id is not null, the referenced Vendor.agreement_state == EXECUTED and Vendor.agreement_compliance == COMPLIANT"
        side_effects:
          - "recomputes regulated_flag from the referenced DataElement.chd_classification"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /health-data/element-purpose-mappings/{id}/suspend OR system event: the referenced Vendor agreement is terminated"
        actor: DataSteward
        preconditions:
          - "mapping.status == ACTIVE"
        side_effects:
          - "sets suspension_reason from the request body, or to VENDOR_AGREEMENT_TERMINATED when driven by the Vendor termination cascade"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /health-data/element-purpose-mappings/{id}/activate"
        actor: DataSteward
        preconditions:
          - "mapping.status == SUSPENDED"
          - "referenced DataElement.status == ACTIVE"
          - "AppProduct.policy_compliance_state != LAPSED"
          - "when the referenced ProcessingPurpose.third_party_disclosure_required == true: the referenced Vendor.agreement_state == EXECUTED and Vendor.agreement_compliance == COMPLIANT"
        side_effects:
          - "clears suspension_reason to null"
        note: "cycle ACTIVE -> SUSPENDED -> ACTIVE"
      - from: PROPOSED
        to: RETIRED
        trigger: "POST /health-data/element-purpose-mappings/{id}/retire OR system event: the referenced DataElement is retired"
        actor: DataSteward
        preconditions:
          - "mapping.status == PROPOSED"
        side_effects:
          - "sets suspension_reason to the retire reason supplied, or to SOURCE_ELEMENT_RETIRED when driven by the DataElement retirement cascade"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /health-data/element-purpose-mappings/{id}/retire OR system event: the referenced DataElement is retired"
        actor: DataSteward
        preconditions:
          - "mapping.status == ACTIVE"
        side_effects:
          - "sets suspension_reason as above"
          - "recomputes AppProduct.regulated_element_count"
      - from: SUSPENDED
        to: RETIRED
        trigger: "POST /health-data/element-purpose-mappings/{id}/retire OR system event: the referenced DataElement is retired"
        actor: DataSteward
        preconditions:
          - "mapping.status == SUSPENDED"
        side_effects:
          - "sets suspension_reason as above"

  - entity: ConsentRecord
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /health-data/consent-records/{id}/grants with axes == [COLLECT]"
        actor: Consumer
        preconditions:
          - "record.record_state == ACTIVE"
          - "record.collection_state IN {NOT_REQUESTED, WITHDRAWN}"
          - "the request body carries exactly one axis"
        side_effects:
          - "sets collection_state = GRANTED and collection_granted_at to the logical clock"
        note: "parallel dimension 1 of 3; collection_state advances independently of sharing_state and sale_state"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /health-data/consent-records/{id}/grants with axes == [SHARE]"
        actor: Consumer
        preconditions:
          - "record.record_state == ACTIVE"
          - "record.collection_state == GRANTED"
          - "record.sharing_state IN {NOT_REQUESTED, WITHDRAWN}"
          - "the request body carries exactly one axis"
        side_effects:
          - "sets sharing_state = GRANTED and sharing_granted_at to the logical clock"
          - "increments AppProduct.active_share_consent_count by 1"
        note: "parallel dimension 2 of 3, guarded by dimension 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /health-data/consent-records/{id}/grants with axes == [SELL]"
        actor: Consumer
        preconditions:
          - "record.record_state == ACTIVE"
          - "record.sharing_state == GRANTED"
          - "record.sale_state IN {NOT_REQUESTED, REVOKED}"
          - "the Consumer.age_band == ADULT"
          - "the request body carries exactly one axis"
        side_effects:
          - "sets sale_state = AUTHORIZED and sale_authorized_at to the logical clock"
        note: "parallel dimension 3 of 3, guarded by dimension 2"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /health-data/consent-records/{id}/withdrawals with axis == COLLECT"
        actor: Consumer
        preconditions:
          - "record.record_state == ACTIVE"
          - "record.collection_state == GRANTED"
        side_effects:
          - "sets collection_state = WITHDRAWN, last_withdrawn_axis = COLLECT, last_withdrawn_at to the logical clock and processing_halt_deadline_at = last_withdrawn_at + PROCESSING_HALT_DAYS days"
          - "cascade hop 2: because collection consent was withdrawn, sharing_state transitions GRANTED -> WITHDRAWN when it is GRANTED"
          - "cascade hop 3: because sharing consent was withdrawn by hop 2, sale_state transitions AUTHORIZED -> REVOKED when it is AUTHORIZED"
          - "cascade hop 4: because sharing_state left GRANTED in hop 2, AppProduct.active_share_consent_count is decremented by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /health-data/consent-records/{id}/withdrawals with axis == SHARE"
        actor: Consumer
        preconditions:
          - "record.record_state == ACTIVE"
          - "record.sharing_state == GRANTED"
        side_effects:
          - "sets sharing_state = WITHDRAWN, last_withdrawn_axis = SHARE, last_withdrawn_at to the logical clock and processing_halt_deadline_at = last_withdrawn_at + PROCESSING_HALT_DAYS days"
          - "sale_state transitions AUTHORIZED -> REVOKED when it is AUTHORIZED"
          - "decrements AppProduct.active_share_consent_count by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /health-data/consent-records/{id}/withdrawals with axis == SELL"
        actor: Consumer
        preconditions:
          - "record.record_state == ACTIVE"
          - "record.sale_state == AUTHORIZED"
        side_effects:
          - "sets sale_state = REVOKED, last_withdrawn_axis = SELL, last_withdrawn_at to the logical clock and processing_halt_deadline_at = last_withdrawn_at + PROCESSING_HALT_DAYS days"
          - "leaves collection_state and sharing_state unchanged"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: a new ConsentRecord is created for the same consumer_id via POST /health-data/consent-records"
        actor: system
        preconditions:
          - "record.record_state == ACTIVE"
        side_effects:
          - "decrements AppProduct.active_share_consent_count by 1 when this record's sharing_state == GRANTED"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system event: a DELETE ConsumerRequest for this consumer reaches FULFILLED"
        actor: system
        preconditions:
          - "record.record_state == ACTIVE"
        side_effects:
          - "sets collection_state = WITHDRAWN when it is GRANTED, sharing_state = WITHDRAWN when it is GRANTED, sale_state = REVOKED when it is AUTHORIZED"
          - "sets last_withdrawn_axis = COLLECT, last_withdrawn_at to the logical clock and processing_halt_deadline_at = last_withdrawn_at + PROCESSING_HALT_DAYS days"
          - "decrements AppProduct.active_share_consent_count by 1 when sharing_state left GRANTED"

  - entity: PrivacyPolicyVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /health-data/privacy-policy-versions/{id}/submit-review"
        actor: PrivacyOfficer
        preconditions:
          - "policy.state == DRAFT"
          - "the referenced ApplicabilityAssessment.state == APPROVED"
        side_effects:
          - "runs calculations.policy_completeness_score and writes completeness_score and gap_count"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /health-data/privacy-policy-versions/{id}/return-to-draft"
        actor: ComplianceApprover
        preconditions:
          - "policy.state == IN_REVIEW"
        side_effects:
          - "resets completeness_score to 0.0 and gap_count to 0"
        note: "cycle DRAFT -> IN_REVIEW -> DRAFT"
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /health-data/privacy-policy-versions/{id}/publish"
        actor: ComplianceApprover
        preconditions:
          - "policy.state == IN_REVIEW"
          - "caller X-User-ID != policy.authored_by_user_id"
          - "policy.completeness_score >= POLICY_PUBLISH_THRESHOLD"
          - "policy.effective_from is not earlier than the logical clock date"
          - "policy.effective_from does not fall inside the half-open window [effective_from, effective_to) of any other PrivacyPolicyVersion on the same app_product_id with state IN {PUBLISHED, SUPERSEDED_PENDING_UPDATE, SUPERSEDED}, where a PUBLISHED or SUPERSEDED_PENDING_UPDATE version's effective_to is treated as unbounded; a date exactly equal to a SUPERSEDED window's effective_to is therefore admitted"
        side_effects:
          - "sets published_by_user_id to the caller's X-User-ID"
          - "every PrivacyPolicyVersion on the same app_product_id with state IN {PUBLISHED, SUPERSEDED_PENDING_UPDATE} transitions to SUPERSEDED with effective_to set to this policy's effective_from"
          - "sets AppProduct.policy_compliance_state = CURRENT"
      - from: PUBLISHED
        to: SUPERSEDED_PENDING_UPDATE
        trigger: "system event: an ACTIVE ElementPurposeMapping on this product is suspended by the Vendor termination cascade"
        actor: system
        preconditions:
          - "policy.state == PUBLISHED"
        side_effects:
          - "cascade hop 4: because this policy left PUBLISHED, AppProduct.policy_compliance_state becomes LAPSED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: a later PrivacyPolicyVersion on the same app_product_id is published"
        actor: system
        preconditions:
          - "policy.state == PUBLISHED"
        side_effects:
          - "sets effective_to to the newly published policy's effective_from"
      - from: SUPERSEDED_PENDING_UPDATE
        to: SUPERSEDED
        trigger: "system event: a later PrivacyPolicyVersion on the same app_product_id is published"
        actor: system
        preconditions:
          - "policy.state == SUPERSEDED_PENDING_UPDATE"
        side_effects:
          - "sets effective_to to the newly published policy's effective_from"

  - entity: ConsumerRequest
    initial_state: RECEIVED
    terminal_states: [FULFILLED, DENIED]
    transitions:
      - from: RECEIVED
        to: VERIFICATION_PENDING
        trigger: "POST /health-data/consumer-requests/{id}/request-more-info"
        actor: PrivacyOfficer
        preconditions:
          - "request.state == RECEIVED"
          - "request.verification_rounds_used < MAX_VERIFICATION_ROUNDS"
        side_effects:
          - "increments verification_rounds_used by 1"
          - "sets verification_window_ends_at = logical clock + VERIFICATION_WINDOW_DAYS days"
      - from: VERIFICATION_PENDING
        to: RECEIVED
        trigger: "POST /health-data/consumer-requests/{id}/resubmit-identity"
        actor: Consumer
        preconditions:
          - "request.state == VERIFICATION_PENDING"
          - "the logical clock is not later than request.verification_window_ends_at"
        side_effects:
          - "clears verification_window_ends_at to null"
        note: "cycle RECEIVED -> VERIFICATION_PENDING -> RECEIVED, bounded by MAX_VERIFICATION_ROUNDS"
      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /health-data/consumer-requests/{id}/verify"
        actor: PrivacyOfficer
        preconditions:
          - "request.state == RECEIVED"
          - "the submitted verification_token equals the Consumer.verification_token"
        side_effects:
          - "sets verified_at to the logical clock and re-runs calculations.request_response_deadline"
          - "when request_kind == DELETE: runs calculations.deletion_task_fanout and creates one DeletionTask in PENDING for each selected Vendor, then recomputes outstanding_task_count"
          - "when request_kind == DELETE and the selected Vendor set is empty: outstanding_task_count stays 0 and the request transitions VERIFIED -> FULFILLED in the same call"
      - from: VERIFIED
        to: FULFILLED
        trigger: "POST /health-data/consumer-requests/{id}/fulfill OR system event: the last outstanding DeletionTask is confirmed"
        actor: PrivacyOfficer
        preconditions:
          - "request.state == VERIFIED"
          - "request.outstanding_task_count == 0"
          - "the logical clock is not later than request.response_deadline_at"
        side_effects:
          - "cascade hop 3: when request_kind == DELETE, the Consumer's ConsentRecord with record_state == ACTIVE withdraws every granted axis and Consumer.deletion_completed_count is recomputed"
          - "cascade hop 4: because that record's sharing_state left GRANTED, AppProduct.active_share_consent_count is decremented by 1"
      - from: RECEIVED
        to: DENIED
        trigger: "POST /health-data/consumer-requests/{id}/deny"
        actor: PrivacyOfficer
        preconditions:
          - "request.state == RECEIVED"
        side_effects:
          - "sets denial_reason from the request body"
      - from: VERIFICATION_PENDING
        to: DENIED
        trigger: "POST /health-data/consumer-requests/{id}/deny"
        actor: PrivacyOfficer
        preconditions:
          - "request.state == VERIFICATION_PENDING"
        side_effects:
          - "sets denial_reason from the request body and clears verification_window_ends_at to null"
      - from: VERIFIED
        to: DENIED
        trigger: "POST /health-data/consumer-requests/{id}/deny"
        actor: PrivacyOfficer
        preconditions:
          - "request.state == VERIFIED"
        side_effects:
          - "sets denial_reason from the request body"
          - "every DeletionTask with consumer_request_id == this id AND state IN {PENDING, NOTIFIED, FAILED} transitions to FAILED with failure_reason REQUEST_DENIED"

  - entity: DeletionTask
    initial_state: PENDING
    terminal_states: [CONFIRMED]
    transitions:
      - from: PENDING
        to: NOTIFIED
        trigger: "POST /health-data/deletion-tasks/{id}/notify"
        actor: PrivacyOfficer
        preconditions:
          - "task.state == PENDING"
          - "the referenced Vendor.agreement_state == EXECUTED"
          - "task.attempt_count < MAX_TASK_ATTEMPTS"
        side_effects:
          - "increments attempt_count by 1 and sets due_at = logical clock + the referenced Vendor.deletion_sla_days days"
      - from: NOTIFIED
        to: CONFIRMED
        trigger: "POST /health-data/deletion-tasks/{id}/confirm"
        actor: PrivacyOfficer
        preconditions:
          - "task.state == NOTIFIED"
        side_effects:
          - "sets confirmed_at to the logical clock"
          - "cascade hop 1: recomputes ConsumerRequest.outstanding_task_count"
          - "cascade hop 2: because outstanding_task_count reached 0, the ConsumerRequest transitions VERIFIED -> FULFILLED and its own cascade hops 3 and 4 run"
      - from: NOTIFIED
        to: FAILED
        trigger: "POST /health-data/deletion-tasks/{id}/fail"
        actor: PrivacyOfficer
        preconditions:
          - "task.state == NOTIFIED"
        side_effects:
          - "sets failure_reason from the request body and recomputes ConsumerRequest.outstanding_task_count"
      - from: FAILED
        to: NOTIFIED
        trigger: "POST /health-data/deletion-tasks/{id}/reissue"
        actor: PrivacyOfficer
        preconditions:
          - "task.state == FAILED"
          - "task.attempt_count < MAX_TASK_ATTEMPTS"
          - "the referenced Vendor.agreement_state == EXECUTED"
        side_effects:
          - "increments attempt_count by 1, clears failure_reason to null and sets due_at = logical clock + the referenced Vendor.deletion_sla_days days"
        note: "cycle NOTIFIED -> FAILED -> NOTIFIED, bounded by MAX_TASK_ATTEMPTS"
      - from: PENDING
        to: FAILED
        trigger: "system event: the parent ConsumerRequest is denied"
        actor: system
        preconditions:
          - "task.state == PENDING"
        side_effects:
          - "sets failure_reason to REQUEST_DENIED and recomputes ConsumerRequest.outstanding_task_count"

  - entity: Vendor
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /health-data/vendors/{id}/execute-agreement"
        actor: PrivacyOfficer
        preconditions:
          - "vendor.agreement_state == DRAFT"
          - "vendor.flow_down_clause == true"
          - "vendor.audit_rights_clause == true"
          - "vendor.subprocessor_of_id is null OR the referenced parent Vendor.agreement_state == EXECUTED"
        side_effects:
          - "sets executed_at to the logical clock and recomputes agreement_compliance"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /health-data/vendors/{id}/terminate-agreement"
        actor: PrivacyOfficer
        preconditions:
          - "vendor.agreement_state == EXECUTED"
        side_effects:
          - "cascade hop 1: sets terminated_at to the logical clock"
          - "cascade hop 2: because this vendor's agreement ended, every ElementPurposeMapping with vendor_id == this id AND status == ACTIVE transitions ACTIVE -> SUSPENDED with suspension_reason VENDOR_AGREEMENT_TERMINATED"
          - "cascade hop 3: because at least one ACTIVE mapping was suspended by hop 2, the PrivacyPolicyVersion on the same app_product_id with state == PUBLISHED transitions PUBLISHED -> SUPERSEDED_PENDING_UPDATE"
          - "cascade hop 4: because that policy left PUBLISHED in hop 3, AppProduct.policy_compliance_state becomes LAPSED"
          - "cascade hop 5: because AppProduct.policy_compliance_state became LAPSED in hop 4, every GeofenceCampaign whose geofence_zone_id belongs to a GeofenceZone with app_product_id == this vendor's app_product_id AND state == ACTIVE transitions ACTIVE -> PAUSED with pause_reason POLICY_LAPSED, processed in ascending created_at order"

  - entity: GeofenceCampaign
    initial_state: PLANNED
    terminal_states: [ENDED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /health-data/geofence-campaigns/{id}/activate"
        actor: DataSteward
        preconditions:
          - "campaign.state == PLANNED"
          - "the referenced GeofenceZone.prohibition_rule != PROHIBITED_ALL"
          - "campaign.standoff_meters >= the referenced GeofenceZone.min_standoff_meters"
          - "campaign.window_start_at .. window_end_at does not overlap the closed interval of any other GeofenceCampaign on the same geofence_zone_id with state IN {PLANNED, ACTIVE, PAUSED}"
          - "the referenced GeofenceZone.last_campaign_activated_at is null OR logical clock - last_campaign_activated_at is not strictly less than ZONE_COOLDOWN_HOURS hours"
          - "AppProduct.policy_compliance_state != LAPSED"
        side_effects:
          - "sets the referenced GeofenceZone.last_campaign_activated_at to the logical clock"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /health-data/geofence-campaigns/{id}/pause OR system event: AppProduct.policy_compliance_state becomes LAPSED"
        actor: DataSteward
        preconditions:
          - "campaign.state == ACTIVE"
        side_effects:
          - "sets pause_reason from the request body, or to POLICY_LAPSED when driven by the Vendor termination cascade"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /health-data/geofence-campaigns/{id}/activate"
        actor: DataSteward
        preconditions:
          - "campaign.state == PAUSED"
          - "the referenced GeofenceZone.prohibition_rule != PROHIBITED_ALL"
          - "campaign.standoff_meters >= the referenced GeofenceZone.min_standoff_meters"
          - "AppProduct.policy_compliance_state != LAPSED"
        side_effects:
          - "clears pause_reason to null and sets the referenced GeofenceZone.last_campaign_activated_at to the logical clock"
        note: "cycle ACTIVE -> PAUSED -> ACTIVE; the zone cooldown is not re-checked on resume"
      - from: PLANNED
        to: ENDED
        trigger: "POST /health-data/geofence-campaigns/{id}/end"
        actor: DataSteward
        preconditions:
          - "campaign.state == PLANNED"
        side_effects:
          - "releases the campaign's window on the zone for overlap purposes"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /health-data/geofence-campaigns/{id}/end"
        actor: DataSteward
        preconditions:
          - "campaign.state == ACTIVE"
        side_effects:
          - "releases the campaign's window on the zone for overlap purposes"
      - from: PAUSED
        to: ENDED
        trigger: "POST /health-data/geofence-campaigns/{id}/end"
        actor: DataSteward
        preconditions:
          - "campaign.state == PAUSED"
        side_effects:
          - "releases the campaign's window on the zone for overlap purposes"

  - entity: BreachIncident
    initial_state: DISCOVERED
    terminal_states: [NOTIFIED, NOT_REPORTABLE]
    transitions:
      - from: DISCOVERED
        to: REPORTABLE
        trigger: "POST /health-data/breach-incidents/{id}/assess"
        actor: SecurityEngineer
        preconditions:
          - "incident.state == DISCOVERED"
          - "incident.protection_state == UNPROTECTED"
        side_effects:
          - "runs calculations.breach_notification_deadline and writes health_rule_deadline_at, general_rule_deadline_at, governing_deadline_at and media_notice_required"
          - "sets exposure_contribution_cents = affected_consumer_count * PER_CONSUMER_EXPOSURE_CENTS and adds it to AppProduct.exposure_cents"
        note: "branch 1 of the assessment fork"
      - from: DISCOVERED
        to: NOT_REPORTABLE
        trigger: "POST /health-data/breach-incidents/{id}/assess"
        actor: SecurityEngineer
        preconditions:
          - "incident.state == DISCOVERED"
          - "incident.protection_state == ENCRYPTED_SECURED"
        side_effects:
          - "leaves health_rule_deadline_at, general_rule_deadline_at and governing_deadline_at null"
          - "leaves media_notice_required false and exposure_contribution_cents 0, so AppProduct.exposure_cents is unchanged"
        note: "branch 2 of the assessment fork; divergent side-effect set from branch 1"
      - from: REPORTABLE
        to: NOTIFIED
        trigger: "POST /health-data/breach-incidents/{id}/notify"
        actor: SecurityEngineer
        preconditions:
          - "incident.state == REPORTABLE"
          - "the logical clock is not later than incident.governing_deadline_at"
          - "incident.media_notice_required == false OR the request body sets media_notice_sent == true"
        side_effects:
          - "sets notified_at to the logical clock and media_notice_sent from the request body"
      - from: REPORTABLE
        to: DISCOVERED
        trigger: "POST /health-data/breach-incidents/{id}/retract"
        actor: SecurityEngineer
        preconditions:
          - "incident.state == REPORTABLE"
        side_effects:
          - "clears health_rule_deadline_at, general_rule_deadline_at, governing_deadline_at to null and media_notice_required to false"
          - "subtracts the previous exposure_contribution_cents from AppProduct.exposure_cents and resets exposure_contribution_cents to 0"
        note: "cycle DISCOVERED -> REPORTABLE -> DISCOVERED; compensates the assess side effects exactly"

  - entity: SecurityRiskAssessment
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /health-data/security-risk-assessments/{id}/finalize"
        actor: SecurityEngineer
        preconditions:
          - "assessment.state == DRAFT"
          - "the AppProduct has an ApplicabilityAssessment with state == APPROVED"
          - "assessment.risk_tier IN {LOW, MODERATE} OR assessment.remediation_plan_present == true"
        side_effects:
          - "sets finalized_at to the logical clock"
          - "recomputes AppProduct.security_program_state from this assessment's risk_tier"

concurrency_rules:
  - rule_id: policy-version-create-stale-product
    parent_entity: AppProduct
    write_endpoint: "POST /health-data/privacy-policy-versions"
    occ_field: "expected_app_product_version"
    description: |
      Creating a PrivacyPolicyVersion against an AppProduct whose version has
      advanced since the client last read it is rejected on the stale version.
      A new policy version legitimately supersedes the incumbent on publication,
      so the request carries the product version the author drafted against;
      when an approved assessment or an earlier publication has since rewritten
      the product's applicability_status or policy_compliance_state, the drafted
      content no longer matches the product it claims to describe.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
  - rule_id: consent-record-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /health-data/consent-records"
    occ_field: "expected_consumer_version"
    description: |
      Creating a ConsentRecord for a Consumer whose version has advanced since
      the client last read it is rejected on the stale version. A new record
      legitimately supersedes the consumer's incumbent ACTIVE record, so the
      caller must present the consumer version whose consent posture it intends
      to replace; a stale version means the posture being replaced is not the
      one the caller observed.
    error_id: ERR_STALE_CONSUMER_VERSION
    http_status: 412

calculations:
  - name: chd_classification
    trigger: "on POST /health-data/data-elements, on PATCH /health-data/data-elements/{id}, on DataElement ACTIVE -> RETIRED, on DataElement RETIRED -> ACTIVE, and as STEP 2 of applicability_determination"
    algorithm: topological
    formula: |
      STEP 1 — resolve the derivation chain:
        walk derived_from_element_id upward until an element with derived_from_element_id == null is reached.
        inference_depth = number of hops walked (0 when derived_from_element_id is null).
        A walk that revisits an already-visited element id is rejected at write time with ERR_INFERENCE_CYCLE.
        A walk whose hop count would exceed MAX_INFERENCE_DEPTH is rejected at write time with ERR_INFERENCE_DEPTH_EXCEEDED.
      STEP 2 — evaluation order: elements are classified in ascending inference_depth, tie-broken by
        ascending created_at, so an element's parent classification is always already known.
      STEP 3 — per-element rule, first matching branch wins:
        if hipaa_flow_only == true AND source_kind != THIRD_PARTY        -> NON_CHD
        elif health_signal_kind IN DIRECT_HEALTH_SIGNALS                 -> CHD
        elif health_signal_kind == PRECISE_LOCATION                      -> CHD_BY_INFERENCE
        elif inference_depth == 0                                        -> NON_CHD
        elif parent element chd_classification IN {CHD, CHD_BY_INFERENCE} -> CHD_BY_INFERENCE
        else                                                            -> NON_CHD
    input_set: "all DataElement rows with app_product_id == the product under evaluation, regardless of status; AppProduct.active_element_count and AppProduct.regulated_element_count then filter to status == ACTIVE"
    constants:
      MAX_INFERENCE_DEPTH: 5
      DIRECT_HEALTH_SIGNALS: [DIAGNOSIS, TREATMENT, MEASUREMENT, REPRODUCTIVE, BIOMETRIC]
    precision: "integer counts; enum output"

  - name: applicability_determination
    trigger: "on ApplicabilityAssessment DRAFT -> SUBMITTED"
    algorithm: constraint_propagation
    formula: |
      The determination and the regulated scope look mutually dependent (a product's track
      seems to depend on how much regulated data it holds, while the regulated data set seems
      to depend on the track). The evaluation order below is PINNED; no step may read a value
      produced by a later step.
      STEP 1 — entity status, from AppProduct input fields and assessment.entity_status_claim ONLY:
        small_business_flag = (consumer_count < SMALL_BUSINESS_CONSUMER_MAX)
                              AND (annual_revenue_cents < SMALL_BUSINESS_REVENUE_CENTS_MAX)
        if entity_status_claim IN {COVERED_ENTITY, BUSINESS_ASSOCIATE}
           AND hipaa_covered_transaction_ratio >= HIPAA_ONLY_RATIO      -> determination = HIPAA_ONLY
        elif entity_status_claim IN {COVERED_ENTITY, BUSINESS_ASSOCIATE}
           AND hipaa_covered_transaction_ratio >= DUAL_TRACK_RATIO      -> determination = DUAL_TRACK
        else                                                            -> determination = CHD_REGULATED
      STEP 2 — element classification: run calculations.chd_classification over every DataElement
        with app_product_id == assessment.app_product_id. STEP 2 MUST NOT read determination.
      STEP 3 — counts, over DataElement rows with status == ACTIVE only:
        active_element_count_snapshot    = count of those rows
        regulated_element_count_snapshot = count of those rows with chd_classification IN {CHD, CHD_BY_INFERENCE}
        Both snapshots are computed even when determination == HIPAA_ONLY.
      STEP 4 — scope and deadline, reading STEP 1 and STEP 3 only:
        if determination == HIPAA_ONLY                          -> regulated_scope = NONE,
                                                                   compliance_deadline_date = null
        elif regulated_element_count_snapshot == 0              -> regulated_scope = NONE
        elif regulated_element_count_snapshot
             >= ceil(FULL_SCOPE_RATIO * active_element_count_snapshot) -> regulated_scope = FULL
        else                                                    -> regulated_scope = PARTIAL
        when determination != HIPAA_ONLY:
          compliance_deadline_date = SMALL_BUSINESS_DEADLINE when small_business_flag == true
                                     else STANDARD_DEADLINE
    input_set: "the assessment's AppProduct row plus all DataElement rows with app_product_id == assessment.app_product_id; DataElement rows with status == RETIRED are excluded from STEP 3 counts only"
    constants:
      SMALL_BUSINESS_CONSUMER_MAX: 100000
      SMALL_BUSINESS_REVENUE_CENTS_MAX: 2500000000
      HIPAA_ONLY_RATIO: 0.95
      DUAL_TRACK_RATIO: 0.50
      FULL_SCOPE_RATIO: 0.5
      SMALL_BUSINESS_DEADLINE: "2026-06-30"
      STANDARD_DEADLINE: "2026-03-31"
    precision: "ratio comparisons use the stored 2-decimal value with >=; ceil() rounds up to the next integer"

  - name: policy_completeness_score
    trigger: "on PrivacyPolicyVersion DRAFT -> IN_REVIEW"
    algorithm: weighted_scoring
    formula: |
      STEP 1 — denominators:
        category_denominator = AppProduct.regulated_element_count      when specificity_mode == ELEMENT_LEVEL
                             = REQUIRED_CATEGORY_COUNT                 when specificity_mode == CATEGORY_LEVEL
        purpose_denominator  = count of ProcessingPurpose rows with app_product_id == policy.app_product_id
      STEP 2 — components, each an exact rational capped at 1 and NEVER rounded here:
        category_component    = 1 when category_denominator == 0
                                else min(disclosed_category_count / category_denominator, 1)
        purpose_component     = 1 when purpose_denominator == 0
                                else min(disclosed_purpose_count / purpose_denominator, 1)
        third_party_component = 1 when disclosed_third_party_count == 0
                                else min(named_third_party_count / disclosed_third_party_count, 1)
      STEP 3 — gap_count = number of the three components strictly less than 1
      STEP 4 — completeness_score = round(100 * (W_CATEGORY * category_component
                                                 + W_PURPOSE * purpose_component
                                                 + W_THIRD_PARTY * third_party_component), 1)
               with ROUND_HALF_UP; exactly one rounding step, applied after weighting
    input_set: "the policy version's own disclosed_* input fields, the AppProduct.regulated_element_count at the moment of the submit-review call, and the count of ProcessingPurpose rows on the same app_product_id"
    constants:
      W_CATEGORY: 0.40
      W_PURPOSE: 0.35
      W_THIRD_PARTY: 0.25
      REQUIRED_CATEGORY_COUNT: 6
      POLICY_PUBLISH_THRESHOLD: 90.0
    precision: "1 decimal place, round_half_up, single rounding step"
    variants:
      - name: element_level_specificity
        when: "policy.specificity_mode == ELEMENT_LEVEL"
        difference: "category_denominator is AppProduct.regulated_element_count, so the policy must name each regulated element individually"
      - name: category_level_specificity
        when: "policy.specificity_mode == CATEGORY_LEVEL"
        difference: "category_denominator is the fixed REQUIRED_CATEGORY_COUNT of 6 statutory categories, so the same disclosed_category_count yields a different score than element_level_specificity whenever regulated_element_count != 6"

  - name: residual_risk_score
    trigger: "on POST /health-data/security-risk-assessments, on PATCH /health-data/security-risk-assessments/{id} and on SecurityRiskAssessment DRAFT -> FINALIZED"
    algorithm: weighted_scoring
    formula: |
      The rounding order is PINNED: weight first, sum the unrounded weighted terms, round ONCE at
      the end. Rounding each weighted domain term to 2 decimals before summing is WRONG and yields
      a different score for some inputs.
      STEP 1 — penalty multiplier:
        penalty_multiplier = min(1 + GAP_PENALTY_PER_GAP * documented_gap_count, MAX_PENALTY_MULTIPLIER)
      STEP 2 — per-domain raw gap, in the fixed domain order ADMIN, TECHNICAL, PHYSICAL, VENDOR:
        raw_gap(ADMIN)     = 100 - admin_control_score
        raw_gap(TECHNICAL) = 100 - technical_control_score
        raw_gap(PHYSICAL)  = 100 - physical_control_score
        raw_gap(VENDOR)    = 100 - vendor_oversight_score
      STEP 3 — weighted term per domain, NOT rounded:
        term(d) = raw_gap(d) * penalty_multiplier * WEIGHT(d)
      STEP 4 — residual_risk_score = round(term(ADMIN) + term(TECHNICAL) + term(PHYSICAL) + term(VENDOR), 2)
               with ROUND_HALF_UP
      STEP 5 — risk_tier:
        residual_risk_score < TIER_MODERATE_MIN                              -> LOW
        TIER_MODERATE_MIN <= residual_risk_score < TIER_HIGH_MIN             -> MODERATE
        TIER_HIGH_MIN     <= residual_risk_score < TIER_CRITICAL_MIN         -> HIGH
        residual_risk_score >= TIER_CRITICAL_MIN                             -> CRITICAL
    input_set: "the four control scores, documented_gap_count and remediation_plan_present of this SecurityRiskAssessment row only; no cross-entity input"
    constants:
      WEIGHT_ADMIN: 0.30
      WEIGHT_TECHNICAL: 0.35
      WEIGHT_PHYSICAL: 0.10
      WEIGHT_VENDOR: 0.25
      GAP_PENALTY_PER_GAP: 0.035
      MAX_PENALTY_MULTIPLIER: 2.00
      TIER_MODERATE_MIN: 20
      TIER_HIGH_MIN: 40
      TIER_CRITICAL_MIN: 60
    precision: "2 decimal places, round_half_up, exactly one rounding step applied after the four weighted terms are summed"

  - name: breach_notification_deadline
    trigger: "on BreachIncident DISCOVERED -> REPORTABLE and on BreachIncident DISCOVERED -> NOT_REPORTABLE"
    algorithm: threshold
    formula: |
      STEP 1 — safe harbour:
        if protection_state == ENCRYPTED_SECURED:
          health_rule_deadline_at = null, general_rule_deadline_at = null,
          governing_deadline_at = null, media_notice_required = false,
          exposure_contribution_cents = 0 and the incident becomes NOT_REPORTABLE. Stop.
      STEP 2 — rule applicability:
        health_applicable  = breach_scope IN {CHD_ONLY, MIXED}
        general_applicable = breach_scope IN {GENERAL_PII_ONLY, MIXED}
      STEP 3 — per-rule deadlines:
        health_rule_deadline_at  = discovered_at + HEALTH_RULE_DAYS days  when health_applicable  else null
        general_rule_deadline_at = discovered_at + GENERAL_RULE_DAYS days when general_applicable else null
      STEP 4 — governing deadline = the earlier of the non-null values from STEP 3
      STEP 5 — media_notice_required = affected_state_max_count >= MEDIA_NOTICE_THRESHOLD
      STEP 6 — exposure_contribution_cents = affected_consumer_count * PER_CONSUMER_EXPOSURE_CENTS
               and AppProduct.exposure_cents increases by exactly that amount
    input_set: "the BreachIncident row's own input fields only; AppProduct.exposure_cents aggregates over BreachIncident rows with state IN {REPORTABLE, NOTIFIED}"
    constants:
      HEALTH_RULE_DAYS: 60
      GENERAL_RULE_DAYS: 30
      MEDIA_NOTICE_THRESHOLD: 500
      PER_CONSUMER_EXPOSURE_CENTS: 1200
    precision: "deadlines are exact UTC instants; day arithmetic adds whole days without timezone shift"
    variants:
      - name: health_specific_rule
        when: "breach_scope == CHD_ONLY, so only the health-specific rule applies"
        difference: "governing_deadline_at is discovered_at + 60 days"
      - name: general_breach_rule
        when: "breach_scope == GENERAL_PII_ONLY or MIXED, so the general rule applies"
        difference: "governing_deadline_at is discovered_at + 30 days, which for MIXED overrides the co-applicable 60-day health deadline"

  - name: request_response_deadline
    trigger: "on POST /health-data/consumer-requests, on ConsumerRequest RECEIVED -> VERIFIED and on POST /health-data/consumer-requests/{id}/extend"
    algorithm: threshold
    formula: |
      base_deadline     = received_at + RESPONSE_BASE_DAYS days
      extended_deadline = base_deadline + RESPONSE_EXTENSION_DAYS days when extension_granted == true
                          else base_deadline
      response_deadline_at =
        min(extended_deadline, verified_at + DELETE_FULFILLMENT_DAYS days)
            when request_kind == DELETE AND verified_at is not null
        min(extended_deadline, received_at + CONFIRM_MAX_DAYS days)
            when request_kind == CONFIRM
        extended_deadline
            otherwise
    input_set: "the ConsumerRequest row's received_at, request_kind, extension_granted and verified_at only"
    constants:
      RESPONSE_BASE_DAYS: 45
      RESPONSE_EXTENSION_DAYS: 45
      DELETE_FULFILLMENT_DAYS: 30
      CONFIRM_MAX_DAYS: 30
      VERIFICATION_WINDOW_DAYS: 10
      MAX_VERIFICATION_ROUNDS: 3
    precision: "exact UTC instants; whole-day arithmetic"

  - name: deletion_task_fanout
    trigger: "on ConsumerRequest RECEIVED -> VERIFIED when request_kind == DELETE"
    algorithm: topological
    formula: |
      STEP 1 — direct recipients (hop_distance 0): the distinct vendor_id values over
        ElementPurposeMapping rows satisfying ALL of:
          status == ACTIVE
          AND regulated_flag == true
          AND vendor_id is not null
          AND the referenced ProcessingPurpose.activity_kind IN {SHARE, SELL}
          AND the referenced DataElement.app_product_id == the Consumer's app_product_id
          AND the referenced Vendor.agreement_state == EXECUTED
      STEP 2 — flow-down expansion: for each already-selected Vendor at hop_distance h where
        h < MAX_FLOW_DOWN_HOPS AND that Vendor.flow_down_clause == true, add every Vendor with
        subprocessor_of_id == that Vendor.id AND agreement_state == EXECUTED at hop_distance h + 1.
        Repeat until no new Vendor is added or h reaches MAX_FLOW_DOWN_HOPS.
      STEP 3 — dedupe: a Vendor reachable at several hop distances is kept once, at the smallest hop_distance.
      STEP 4 — creation order: one DeletionTask per selected Vendor, created in ascending hop_distance,
        tie-broken by ascending Vendor.created_at. Each task starts in PENDING with attempt_count 0.
      STEP 5 — empty candidate set: when STEP 1 selects no Vendor, no DeletionTask is created,
        outstanding_task_count stays 0 and the ConsumerRequest transitions VERIFIED -> FULFILLED
        inside the same verify call.
    input_set: "ElementPurposeMapping rows with status == ACTIVE joined to their DataElement, ProcessingPurpose and Vendor rows, plus Vendor rows with agreement_state == EXECUTED reachable through subprocessor_of_id"
    constants:
      MAX_FLOW_DOWN_HOPS: 3
    precision: "integer hop counts; ordering by hop_distance then created_at ASC, never by id"

  - name: consent_posture_derivation
    trigger: "on POST /health-data/processing-purposes, on POST /health-data/consent-records, on every ConsentRecord grant and withdrawal transition, on POST /health-data/vendors, on PATCH /health-data/vendors/{id} and on Vendor DRAFT -> EXECUTED"
    algorithm: projection
    formula: |
      STEP 1 — ProcessingPurpose derived fields:
        consent_axis = activity_kind
        requires_separate_consent = activity_kind IN {SHARE, SELL} OR purpose_kind IN {ADVERTISING, RESEARCH, SALE}
        third_party_disclosure_required = activity_kind IN {SHARE, SELL}
      STEP 2 — Vendor.agreement_compliance:
        COMPLIANT when flow_down_clause == true AND audit_rights_clause == true
                  AND (vendor_kind != PURCHASER OR sale_authorization_clause == true)
        DEFICIENT otherwise
      STEP 3 — ConsentRecord.processing_halt_deadline_at:
        null when last_withdrawn_at is null,
        otherwise last_withdrawn_at + PROCESSING_HALT_DAYS days
      STEP 4 — AppProduct.active_share_consent_count = count of ConsentRecord rows whose consumer_id
        belongs to a Consumer with app_product_id == the product AND record_state == ACTIVE
        AND sharing_state == GRANTED. This count is the conserved quantity that a SHARE grant
        increments by exactly 1 and its compensating SHARE withdrawal decrements by exactly 1.
      STEP 5 — bounded-retry caps used by the cyclic state machines:
        an assessment revise call is admitted only while revision_count < MAX_ASSESSMENT_REVISIONS,
        a request-more-info call only while verification_rounds_used < MAX_VERIFICATION_ROUNDS,
        a notify or reissue call only while attempt_count < MAX_TASK_ATTEMPTS.
    input_set: "the ProcessingPurpose, Vendor and ConsentRecord rows being written, plus for STEP 4 all ConsentRecord rows joined to Consumer rows with app_product_id == the product"
    constants:
      PROCESSING_HALT_DAYS: 15
      MAX_ASSESSMENT_REVISIONS: 2
      MAX_VERIFICATION_ROUNDS: 3
      MAX_TASK_ATTEMPTS: 2
    precision: "integer counts; exact UTC instants for processing_halt_deadline_at"

  - name: geofence_standoff
    trigger: "on POST /health-data/geofence-zones, on POST /health-data/geofence-campaigns and on GeofenceCampaign activate transitions"
    algorithm: threshold
    formula: |
      STEP 1 — zone prohibition_rule from the state law table and the facility class:
        law = GEOFENCE_LAW_BY_STATE[zone.state_code]
        if law == PROHIBITED_ALL:
          prohibition_rule = PROHIBITED_ALL              when facility_kind IN {SENSITIVE_HEALTH, GENERAL_HEALTH}
                           = PERMITTED                   when facility_kind == NON_HEALTH
        elif law == PROHIBITED_SENSITIVE_ONLY:
          prohibition_rule = PROHIBITED_ALL              when facility_kind == SENSITIVE_HEALTH
                           = PROHIBITED_SENSITIVE_ONLY   when facility_kind == GENERAL_HEALTH
                           = PERMITTED                   when facility_kind == NON_HEALTH
        else:
          prohibition_rule = PERMITTED
      STEP 2 — zone.min_standoff_meters:
        SENSITIVE_STANDOFF_METERS when prohibition_rule == PROHIBITED_SENSITIVE_ONLY
        0                         when prohibition_rule == PERMITTED
        not applicable            when prohibition_rule == PROHIBITED_ALL (no campaign may activate)
      STEP 3 — campaign.standoff_meters = distance_to_zone_center_meters
                                          - target_radius_meters
                                          - the referenced GeofenceZone.radius_meters
               (may be zero or negative; no clamping)
      STEP 4 — activation admits the campaign iff prohibition_rule != PROHIBITED_ALL
               AND standoff_meters >= zone.min_standoff_meters
    input_set: "the GeofenceZone row and the GeofenceCampaign row under activation"
    constants:
      GEOFENCE_LAW_BY_STATE: { WA: PROHIBITED_ALL, NV: PROHIBITED_ALL, CT: PROHIBITED_SENSITIVE_ONLY, CA: PROHIBITED_SENSITIVE_ONLY, TX: PERMITTED }
      SENSITIVE_STANDOFF_METERS: 500
      ZONE_COOLDOWN_HOURS: 24
    precision: "integer metres; comparison uses >= so a standoff exactly equal to min_standoff_meters is admitted"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names a role declared in the RBAC matrix, and X-User-ID is present for every role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the caller's role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every {id} path segment resolves, validated left to right. Per-entity ids: AppProduct -> ERR_APP_PRODUCT_NOT_FOUND, Consumer -> ERR_CONSUMER_NOT_FOUND, Vendor -> ERR_VENDOR_NOT_FOUND, DataElement -> ERR_DATA_ELEMENT_NOT_FOUND, ProcessingPurpose -> ERR_PURPOSE_NOT_FOUND, and every other entity type (ApplicabilityAssessment, ElementPurposeMapping, ConsentRecord, PrivacyPolicyVersion, ConsumerRequest, DeletionTask, GeofenceZone, GeofenceCampaign, BreachIncident, SecurityRiskAssessment) -> ERR_RESOURCE_NOT_FOUND"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying an {id} path segment"
  - priority: 4
    category: existence
    check: "the request body contains every required field for the endpoint, enum fields carry a declared member, integers are within their declared range, named_third_party_count <= disclosed_third_party_count, and no field named computed or system in §1.1 is accepted from input"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST and PATCH endpoints"
  - priority: 5
    category: existence
    check: "every foreign-key field in the request body resolves, validated in the field order app_product_id, applicability_assessment_id, consumer_id, data_element_id, derived_from_element_id, processing_purpose_id, vendor_id, subprocessor_of_id, geofence_zone_id, consumer_request_id, using the same per-entity 404 ids as priority 3"
    error_id: ERR_APP_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "all POST and PATCH endpoints carrying foreign-key fields"
  - priority: 6
    category: business_referential
    check: "all foreign keys in one request body resolve to rows belonging to the same AppProduct: a DataElement and a ProcessingPurpose named by one ElementPurposeMapping share app_product_id, the Vendor named by that mapping has the same app_product_id, a derived_from_element_id names a DataElement on the same app_product_id, a subprocessor_of_id names a Vendor on the same app_product_id, and a GeofenceCampaign's ProcessingPurpose shares app_product_id with the GeofenceZone"
    error_id: ERR_CROSS_PRODUCT_REFERENCE
    http_status: 409
    applies_to: "POST /health-data/element-purpose-mappings, POST /health-data/data-elements, POST /health-data/vendors, POST /health-data/geofence-campaigns, POST /health-data/privacy-policy-versions"
  - priority: 7
    category: auth
    check: "when the caller's role is Consumer, X-User-ID equals the Consumer.id that owns the target resource: the consumer_id of the ConsentRecord or ConsumerRequest being acted on"
    error_id: ERR_CONSUMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /health-data/consent-records/{id}/grants, POST /health-data/consent-records/{id}/withdrawals, POST /health-data/consumer-requests, POST /health-data/consumer-requests/{id}/resubmit-identity"
  - priority: 8
    category: state
    check: "the target resource is in a from-state the requested transition declares in §1.2; ERR_ELEMENT_RETIRED when a DataElement action requires status == ACTIVE, ERR_POLICY_NOT_IN_REVIEW when a policy publish or return-to-draft requires state == IN_REVIEW, ERR_VENDOR_AGREEMENT_NOT_EXECUTED when a notify or reissue requires the Vendor agreement_state == EXECUTED, ERR_ALREADY_TERMINAL when the target is already in one of its terminal_states, ERR_INVALID_STATE for every other from-state mismatch"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "expected_app_product_version equals the current AppProduct.version on POST /health-data/privacy-policy-versions; expected_consumer_version equals the current Consumer.version on POST /health-data/consent-records"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /health-data/privacy-policy-versions, POST /health-data/consent-records"
  - priority: 10
    category: business_constraint
    check: "segregation of duties: the caller's X-User-ID differs from ApplicabilityAssessment.submitted_by_user_id on approve, and differs from PrivacyPolicyVersion.authored_by_user_id on publish"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /health-data/applicability-assessments/{id}/approve, POST /health-data/privacy-policy-versions/{id}/publish"
  - priority: 11
    category: business_safety
    check: "the referenced GeofenceZone.prohibition_rule != PROHIBITED_ALL"
    error_id: ERR_GEOFENCE_PROHIBITED
    http_status: 403
    applies_to: "POST /health-data/geofence-campaigns/{id}/activate"
  - priority: 12
    category: business_safety
    check: "GeofenceCampaign.standoff_meters >= the referenced GeofenceZone.min_standoff_meters"
    error_id: ERR_GEOFENCE_STANDOFF_VIOLATION
    http_status: 422
    applies_to: "POST /health-data/geofence-campaigns/{id}/activate"
  - priority: 13
    category: business_safety
    check: "a SELL grant is refused when the Consumer.age_band IN {MINOR_13_16, UNDER_13}"
    error_id: ERR_MINOR_SALE_PROHIBITED
    http_status: 403
    applies_to: "POST /health-data/consent-records/{id}/grants"
  - priority: 14
    category: business_safety
    check: "a grant request carries exactly one axis in its axes array; two or more axes in one call is bundled consent"
    error_id: ERR_CONSENT_BUNDLING_PROHIBITED
    http_status: 422
    applies_to: "POST /health-data/consent-records/{id}/grants"
  - priority: 15
    category: business_safety
    check: "a SHARE grant requires collection_state == GRANTED on the same record"
    error_id: ERR_COLLECTION_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /health-data/consent-records/{id}/grants"
  - priority: 16
    category: business_safety
    check: "a SELL grant requires sharing_state == GRANTED on the same record"
    error_id: ERR_SHARING_CONSENT_REQUIRED
    http_status: 409
    applies_to: "POST /health-data/consent-records/{id}/grants"
  - priority: 17
    category: business_constraint
    check: "element_key is unique per app_product_id across DataElement rows with status IN {ACTIVE, RETIRED}"
    error_id: ERR_DUPLICATE_ELEMENT_KEY
    http_status: 409
    applies_to: "POST /health-data/data-elements"
  - priority: 18
    category: business_constraint
    check: "purpose_key is unique per app_product_id; external_ref is unique per app_product_id on Consumer via ERR_DUPLICATE_CONSUMER_REF; vendor_name is unique per app_product_id on Vendor via ERR_DUPLICATE_VENDOR_NAME"
    error_id: ERR_DUPLICATE_PURPOSE_KEY
    http_status: 409
    applies_to: "POST /health-data/processing-purposes, POST /health-data/consumers, POST /health-data/vendors"
  - priority: 19
    category: business_constraint
    check: "source_kind == DERIVED_INFERENCE requires derived_from_element_id to be non-null, and a non-null derived_from_element_id requires source_kind == DERIVED_INFERENCE"
    error_id: ERR_DERIVATION_SOURCE_REQUIRED
    http_status: 422
    applies_to: "POST /health-data/data-elements, PATCH /health-data/data-elements/{id}"
  - priority: 20
    category: business_constraint
    check: "the derivation walk from derived_from_element_id never revisits an element id"
    error_id: ERR_INFERENCE_CYCLE
    http_status: 422
    applies_to: "POST /health-data/data-elements, PATCH /health-data/data-elements/{id}"
  - priority: 21
    category: business_constraint
    check: "the derivation walk from derived_from_element_id has at most MAX_INFERENCE_DEPTH hops"
    error_id: ERR_INFERENCE_DEPTH_EXCEEDED
    http_status: 422
    applies_to: "POST /health-data/data-elements, PATCH /health-data/data-elements/{id}"
  - priority: 22
    category: business_constraint
    check: "reinstating a DataElement requires derived_from_element_id to be null or the referenced parent DataElement.status == ACTIVE"
    error_id: ERR_ELEMENT_PARENT_RETIRED
    http_status: 409
    applies_to: "POST /health-data/data-elements/{id}/reinstate"
  - priority: 23
    category: business_constraint
    check: "revise is admitted only while ApplicabilityAssessment.revision_count < MAX_ASSESSMENT_REVISIONS"
    error_id: ERR_ASSESSMENT_REVISION_LIMIT
    http_status: 409
    applies_to: "POST /health-data/applicability-assessments/{id}/revise"
  - priority: 24
    category: business_constraint
    check: "request-more-info is admitted only while ConsumerRequest.verification_rounds_used < MAX_VERIFICATION_ROUNDS"
    error_id: ERR_VERIFICATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /health-data/consumer-requests/{id}/request-more-info"
  - priority: 25
    category: business_constraint
    check: "notify and reissue are admitted only while DeletionTask.attempt_count < MAX_TASK_ATTEMPTS"
    error_id: ERR_TASK_ATTEMPT_LIMIT
    http_status: 409
    applies_to: "POST /health-data/deletion-tasks/{id}/notify, POST /health-data/deletion-tasks/{id}/reissue"
  - priority: 26
    category: business_constraint
    check: "extend is admitted only while ConsumerRequest.extension_granted == false"
    error_id: ERR_EXTENSION_ALREADY_GRANTED
    http_status: 409
    applies_to: "POST /health-data/consumer-requests/{id}/extend"
  - priority: 27
    category: business_referential
    check: "submit-review requires the referenced ApplicabilityAssessment.state == APPROVED; finalize requires the AppProduct to have an ApplicabilityAssessment with state == APPROVED"
    error_id: ERR_ASSESSMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /health-data/privacy-policy-versions/{id}/submit-review, POST /health-data/security-risk-assessments/{id}/finalize"
  - priority: 28
    category: business_referential
    check: "activating an ElementPurposeMapping requires AppProduct.applicability_status IN {DUAL_TRACK, CHD_REGULATED}"
    error_id: ERR_APPLICABILITY_UNDETERMINED
    http_status: 409
    applies_to: "POST /health-data/element-purpose-mappings/{id}/activate"
  - priority: 29
    category: business_referential
    check: "when the referenced ProcessingPurpose.third_party_disclosure_required == true, the mapping's vendor_id is not null"
    error_id: ERR_VENDOR_REQUIRED_FOR_DISCLOSURE
    http_status: 422
    applies_to: "POST /health-data/element-purpose-mappings, POST /health-data/element-purpose-mappings/{id}/activate"
  - priority: 30
    category: business_referential
    check: "when the referenced ProcessingPurpose.third_party_disclosure_required == true, the referenced Vendor.agreement_compliance == COMPLIANT"
    error_id: ERR_VENDOR_AGREEMENT_DEFICIENT
    http_status: 409
    applies_to: "POST /health-data/element-purpose-mappings/{id}/activate"
  - priority: 31
    category: business_constraint
    check: "executing a vendor agreement requires flow_down_clause == true"
    error_id: ERR_FLOW_DOWN_CLAUSE_MISSING
    http_status: 422
    applies_to: "POST /health-data/vendors/{id}/execute-agreement"
  - priority: 32
    category: business_constraint
    check: "executing a vendor agreement requires audit_rights_clause == true"
    error_id: ERR_AUDIT_RIGHTS_MISSING
    http_status: 422
    applies_to: "POST /health-data/vendors/{id}/execute-agreement"
  - priority: 33
    category: business_referential
    check: "executing a vendor agreement requires subprocessor_of_id to be null or the referenced parent Vendor.agreement_state == EXECUTED"
    error_id: ERR_SUBPROCESSOR_PARENT_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /health-data/vendors/{id}/execute-agreement"
  - priority: 34
    category: business_referential
    check: "activating an ElementPurposeMapping or a GeofenceCampaign requires AppProduct.policy_compliance_state != LAPSED"
    error_id: ERR_POLICY_LAPSED
    http_status: 409
    applies_to: "POST /health-data/element-purpose-mappings/{id}/activate, POST /health-data/geofence-campaigns/{id}/activate"
  - priority: 35
    category: business_temporal
    check: "publish requires PrivacyPolicyVersion.effective_from to be on or after the logical clock date"
    error_id: ERR_EFFECTIVE_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /health-data/privacy-policy-versions/{id}/publish"
  - priority: 36
    category: business_temporal
    check: "publish requires effective_from to fall outside the half-open window [effective_from, effective_to) of every other PrivacyPolicyVersion on the same app_product_id whose state IN {PUBLISHED, SUPERSEDED_PENDING_UPDATE, SUPERSEDED}; a PUBLISHED or SUPERSEDED_PENDING_UPDATE version's effective_to is treated as unbounded, and a date exactly equal to a SUPERSEDED window's effective_to is admitted because the upper bound is exclusive"
    error_id: ERR_POLICY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /health-data/privacy-policy-versions/{id}/publish"
  - priority: 37
    category: business_temporal
    check: "window_end_at is strictly later than window_start_at on a GeofenceCampaign"
    error_id: ERR_WINDOW_END_BEFORE_START
    http_status: 422
    applies_to: "POST /health-data/geofence-campaigns"
  - priority: 38
    category: business_temporal
    check: "activating a GeofenceCampaign requires its closed interval [window_start_at, window_end_at] to share no instant with the closed interval of any other GeofenceCampaign on the same geofence_zone_id whose state IN {PLANNED, ACTIVE, PAUSED}; touching endpoints collide"
    error_id: ERR_CAMPAIGN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /health-data/geofence-campaigns/{id}/activate"
  - priority: 39
    category: business_temporal
    check: "activating a GeofenceCampaign requires GeofenceZone.last_campaign_activated_at to be null or the elapsed logical-clock time since it to be not strictly less than ZONE_COOLDOWN_HOURS hours; checked only on the PLANNED -> ACTIVE transition"
    error_id: ERR_ZONE_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /health-data/geofence-campaigns/{id}/activate"
  - priority: 40
    category: business_temporal
    check: "resubmit-identity requires the logical clock to be not later than ConsumerRequest.verification_window_ends_at"
    error_id: ERR_VERIFICATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /health-data/consumer-requests/{id}/resubmit-identity"
  - priority: 41
    category: business_constraint
    check: "the verification_token submitted on verify equals the Consumer.verification_token"
    error_id: ERR_VERIFICATION_TOKEN_MISMATCH
    http_status: 422
    applies_to: "POST /health-data/consumer-requests/{id}/verify"
  - priority: 42
    category: business_temporal
    check: "fulfill requires the logical clock to be not later than ConsumerRequest.response_deadline_at"
    error_id: ERR_RESPONSE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /health-data/consumer-requests/{id}/fulfill"
  - priority: 43
    category: business_constraint
    check: "fulfill requires ConsumerRequest.outstanding_task_count == 0"
    error_id: ERR_DELETION_TASKS_OUTSTANDING
    http_status: 409
    applies_to: "POST /health-data/consumer-requests/{id}/fulfill"
  - priority: 44
    category: business_temporal
    check: "notify requires the logical clock to be not later than BreachIncident.governing_deadline_at"
    error_id: ERR_NOTIFICATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /health-data/breach-incidents/{id}/notify"
  - priority: 45
    category: business_safety
    check: "notify requires media_notice_sent == true whenever BreachIncident.media_notice_required == true"
    error_id: ERR_MEDIA_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /health-data/breach-incidents/{id}/notify"
  - priority: 46
    category: business_fiscal
    check: "publish requires PrivacyPolicyVersion.completeness_score >= POLICY_PUBLISH_THRESHOLD"
    error_id: ERR_POLICY_COMPLETENESS_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /health-data/privacy-policy-versions/{id}/publish"
  - priority: 47
    category: business_fiscal
    check: "finalize requires remediation_plan_present == true whenever risk_tier IN {HIGH, CRITICAL}"
    error_id: ERR_REMEDIATION_PLAN_REQUIRED
    http_status: 422
    applies_to: "POST /health-data/security-risk-assessments/{id}/finalize"
  - priority: 48
    category: business_constraint
    check: "submit requires the AppProduct to have at least one DataElement with status == ACTIVE"
    error_id: ERR_NO_ACTIVE_ELEMENTS
    http_status: 409
    applies_to: "POST /health-data/applicability-assessments/{id}/submit"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the logical clock used by every computed timestamp, deadline and window check"]

  - method: POST
    path: "/health-data/app-products"
    description: "Registers a consumer health application product"
    roles: [PlatformAdmin]
    code: 201
    input: [product_name, company_legal_name, primary_state_code, consumer_count, annual_revenue_cents, hipaa_covered_transaction_ratio]
    output: AppProduct
    side_effects: ["computes small_business_flag", "initialises applicability_status to UNDETERMINED, policy_compliance_state to NO_POLICY, security_program_state to NONE and every counter to 0"]
  - method: GET
    path: "/health-data/app-products/{id}"
    description: "Reads one app product with its derived compliance counters"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: AppProduct
    side_effects: []
  - method: GET
    path: "/health-data/app-products"
    description: "Lists app products"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["limit?", "offset?", "applicability_status?"]
    output: AppProduct[]
    side_effects: []
  - method: PATCH
    path: "/health-data/app-products/{id}"
    description: "Updates the product's size and HIPAA-ratio inputs before an assessment is submitted"
    roles: [PlatformAdmin]
    code: 200
    input: ["product_name?", "consumer_count?", "annual_revenue_cents?", "hipaa_covered_transaction_ratio?"]
    output: AppProduct
    side_effects: ["recomputes small_business_flag", "increments AppProduct.version by 1"]
  - method: GET
    path: "/health-data/app-products/{id}/compliance-summary"
    description: "Computed read of the product's whole compliance posture"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: "{ app_product_id: string, applicability_status: enum, regulated_scope: enum, active_element_count: integer, regulated_element_count: integer, active_share_consent_count: integer, policy_compliance_state: enum, security_program_state: enum, exposure_cents: integer, open_request_count: integer, outstanding_deletion_task_count: integer }"
    side_effects: []

  - method: POST
    path: "/health-data/applicability-assessments"
    description: "Creates a DRAFT applicability assessment for a product"
    roles: [PrivacyOfficer]
    code: 201
    input: [app_product_id, entity_status_claim, analyst_note]
    output: ApplicabilityAssessment
    side_effects: ["creates the assessment in DRAFT with revision_count 0"]
  - method: GET
    path: "/health-data/applicability-assessments/{id}"
    description: "Reads one applicability assessment"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: ApplicabilityAssessment
    side_effects: []
  - method: GET
    path: "/health-data/applicability-assessments"
    description: "Lists applicability assessments, filterable by product"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "state?", "limit?", "offset?"]
    output: ApplicabilityAssessment[]
    side_effects: []
  - method: POST
    path: "/health-data/applicability-assessments/{id}/submit"
    description: "Submits the assessment for approval and runs the applicability determination"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ApplicabilityAssessment
    side_effects: ["DRAFT -> SUBMITTED", "runs calculations.applicability_determination", "sets submitted_by_user_id", "recomputes AppProduct.small_business_flag"]
  - method: POST
    path: "/health-data/applicability-assessments/{id}/approve"
    description: "Approves the assessment and pins the product's regulatory track"
    roles: [ComplianceApprover]
    code: 200
    input: []
    output: ApplicabilityAssessment
    side_effects: ["SUBMITTED -> APPROVED", "writes AppProduct.applicability_status, regulated_scope and compliance_deadline_date", "supersedes any previously APPROVED assessment on the product", "increments AppProduct.version by 1"]
  - method: POST
    path: "/health-data/applicability-assessments/{id}/return"
    description: "Returns the assessment to the privacy officer with a reason"
    roles: [ComplianceApprover]
    code: 200
    input: [return_reason]
    output: ApplicabilityAssessment
    side_effects: ["SUBMITTED -> RETURNED", "sets return_reason"]
  - method: POST
    path: "/health-data/applicability-assessments/{id}/revise"
    description: "Reopens a returned assessment for revision"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: ApplicabilityAssessment
    side_effects: ["RETURNED -> DRAFT", "increments revision_count by 1", "clears determination, regulated_scope, compliance_deadline_date and submitted_by_user_id"]

  - method: POST
    path: "/health-data/data-elements"
    description: "Declares a collected data element, classifying it as consumer health data"
    roles: [DataSteward]
    code: 201
    input: [app_product_id, element_key, display_name, source_kind, health_signal_kind, "derived_from_element_id?", "hipaa_flow_only?"]
    output: DataElement
    side_effects: ["runs calculations.chd_classification and writes inference_depth and chd_classification", "recomputes AppProduct.active_element_count and AppProduct.regulated_element_count"]
  - method: GET
    path: "/health-data/data-elements/{id}"
    description: "Reads one data element with its classification"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: DataElement
    side_effects: []
  - method: GET
    path: "/health-data/data-elements"
    description: "Lists data elements, filterable by product and by derivation parent"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["app_product_id?", "derived_from_element_id?", "status?", "limit?", "offset?"]
    output: DataElement[]
    side_effects: []
  - method: PATCH
    path: "/health-data/data-elements/{id}"
    description: "Edits a data element's descriptive and classification inputs"
    roles: [DataSteward]
    code: 200
    input: ["display_name?", "source_kind?", "health_signal_kind?", "derived_from_element_id?", "hipaa_flow_only?"]
    output: DataElement
    side_effects: ["re-runs calculations.chd_classification for this element and every element derived from it", "recomputes AppProduct.regulated_element_count"]
  - method: POST
    path: "/health-data/data-elements/{id}/retire"
    description: "Retires a data element and cascades to its derived elements and mappings"
    roles: [DataSteward]
    code: 200
    input: [retired_reason]
    output: DataElement
    side_effects: ["ACTIVE -> RETIRED", "cascade hop 2: transitively retires ACTIVE elements derived from it", "cascade hop 3: retires their non-RETIRED ElementPurposeMapping rows", "cascade hop 4: recomputes AppProduct.active_element_count and regulated_element_count"]
  - method: POST
    path: "/health-data/data-elements/{id}/reinstate"
    description: "Reinstates a retired data element"
    roles: [DataSteward]
    code: 200
    input: []
    output: DataElement
