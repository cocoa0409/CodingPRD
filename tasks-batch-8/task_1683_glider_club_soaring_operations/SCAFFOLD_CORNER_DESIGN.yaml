            - call: "POST /soaring/members"
              payload: { full_name: "Owner Six", tier_id: "${trb3}" }
              as: ClubAdmin
              captures: { mo6: $.data.id }
            - call: "POST /soaring/duty-roster"
              payload: { duty_date: "2026-09-05T00:00:00Z", member_id: "${mo5}" }
              as: ClubAdmin
              captures: { s5: $.data.id }
          trigger:
