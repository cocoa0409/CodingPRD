              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PI_ADVANCE", amount_usd: 60000, advanced_on: "2026-02-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_a_id: "$.data.id" }
            - call: "POST /special-servicing/advances"
              payload: { loan_id: "${loan_id}", advance_type: "PROPERTY_PROTECTION_ADVANCE", amount_usd: 290000, advanced_on: "2026-04-01T00:00:00Z" }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { advance_b_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
