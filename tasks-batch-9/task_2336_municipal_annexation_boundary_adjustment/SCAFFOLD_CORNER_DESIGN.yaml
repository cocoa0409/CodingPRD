            - "GET /parcel-owner-consents?petition_id=${pet_r6}&consent_status=SIGNED returns total_count == 1"

  # =====================================================================================
  # SECTION 7 — Complexity layers
  # =====================================================================================
  - section: complexity_layers
    instances:
      - name: a_stale_expected_case_version_on_a_fiscal_analysis_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[POST /fiscal-impact-analyses]
          - validations[priority=25]
          - endpoints[POST /fiscal-impact-analyses]
        distinguishing_aspect: |
          The case version the analyst read is invalidated by a territory certification he never
          saw, so the analysis he authors against version 2 must be refused with 412 even though
          every other field is valid; re-reading the case yields version 3 and the identical body
          succeeds. The version counter is per-case and advances on every write, including the
          parcel add and the certification.
        test_recipe:
          setup:
            - "A DRAFT case with one 100,000,000-cent parcel; the case version read back before certification."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_c1: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_c1}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_c1: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_c1: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_c1}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c1}"
              captures: { case_c1: $.data.id, c1_ver_create: $.data.version }
            - call: "POST /annexation-cases/${case_c1}/parcels"
              payload: { primary_owner_id: "${ow_c1}", parcel_apn: "C1-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c1}"
            - call: "GET /annexation-cases/${case_c1}"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { c1_ver_stale: $.data.version }
          trigger:
            - call: "POST /annexation-cases/${case_c1}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_c1}"
              captures: { c1_ver_after_certify: $.data.version }
            - call: "POST /fiscal-impact-analyses"
              payload: { annexation_case_id: "${case_c1}", analysis_method: "AVERAGE_COST", projected_population: 5, expected_case_version: "${c1_ver_stale}" }
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { c1_e_stale: $.data.error_id }
            - call: "GET /annexation-cases/${case_c1}"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { c1_ver_fresh: $.data.version }
            - call: "POST /fiscal-impact-analyses"
              payload: { annexation_case_id: "${case_c1}", analysis_method: "AVERAGE_COST", projected_population: 5, expected_case_version: "${c1_ver_fresh}" }
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { an_c1: $.data.id, c1_net: $.data.net_annual_impact_cents }
            - call: "GET /annexation-cases/${case_c1}"
              payload: {}
              as: FiscalAnalyst
              as_user_id: "fa-01"
              captures: { c1_ver_final: $.data.version }
          assert:
            - "${c1_ver_create} == 1"
            - "${c1_ver_stale} == 2"
            - "${c1_ver_after_certify} == 3"
            - "${c1_e_stale} == ERR_STALE_CASE_VERSION with status 412"
            - "${c1_ver_fresh} == 3 — the refused write did not advance the version"
            - "the second analysis create returns status 201"
            - "${c1_net} == 948000"
            - "${c1_ver_final} == 4"
            - "GET /fiscal-impact-analyses?annexation_case_id=${case_c1} returns total_count == 1"

      - name: a_stale_expected_plan_version_on_a_service_commitment_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[POST /service-commitments]
          - validations[priority=26]
          - endpoints[POST /service-commitments]
        distinguishing_aspect: |
          The second optimistic-concurrency rule guards a different parent with a different error:
          the plan version returned at plan creation is spent by the first commitment, so a second
          commitment quoting it is refused with ERR_STALE_PLAN_VERSION rather than the case-level
          412. Re-reading the plan and quoting version 2 lets the write through, and because the
          two commitments share a service_type the accepted one supersedes the first into VOIDED.
        test_recipe:
          setup:
            - "A TERRITORY_CERTIFIED case with a DRAFT plan of services carrying one DRAFT POLICE commitment created against the plan's initial version."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"] }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_c2: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_c2}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { muni_c2: $.data.id }
            - call: "POST /municipalities/${muni_c2}/service-providers"
              payload: { provider_name: "Cedar Grove Police", service_types: ["POLICE"], concurrent_project_capacity: 1 }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { prov_c2: $.data.id }
            - call: "POST /property-owners"
              payload: { owner_name: "Ann Reyes", contact_email: "ann@example.test" }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { ow_c2: $.data.id }
            - call: "POST /annexation-cases"
              payload: { municipality_id: "${muni_c2}", method: "INVOLUNTARY_ORDINANCE", shared_boundary_feet: 20000, total_lot_count: 1, developed_lot_count: 1, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { case_c2: $.data.id }
            - call: "POST /annexation-cases/${case_c2}/parcels"
              payload: { primary_owner_id: "${ow_c2}", parcel_apn: "C2-1", assessed_value_cents: 100000000, acreage: 5.00, is_developed: true, dwelling_units: 4 }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
            - call: "POST /annexation-cases/${case_c2}/certify-territory"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
            - call: "POST /plans-of-services"
              payload: { annexation_case_id: "${case_c2}" }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { plan_c2: $.data.id, c2_plan_ver_stale: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_c2}", service_provider_id: "${prov_c2}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-15", cost_cents: 500000, committed_account_count: 0, expected_plan_of_services_version: "${c2_plan_ver_stale}" }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { cm_c2a: $.data.id }
          trigger:
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_c2}", service_provider_id: "${prov_c2}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-10", cost_cents: 400000, committed_account_count: 0, expected_plan_of_services_version: "${c2_plan_ver_stale}" }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { c2_e_stale: $.data.error_id }
            - call: "GET /plans-of-services/${plan_c2}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { c2_plan_ver_fresh: $.data.version }
            - call: "POST /service-commitments"
              payload: { plan_of_services_id: "${plan_c2}", service_provider_id: "${prov_c2}", service_type: "POLICE", window_start_date: "2026-08-01", window_end_date: "2026-09-10", cost_cents: 400000, committed_account_count: 0, expected_plan_of_services_version: "${c2_plan_ver_fresh}" }
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
              captures: { cm_c2b: $.data.id, c2_days_b: $.data.timeline_days }
            - call: "GET /plans-of-services/${plan_c2}"
              payload: {}
              as: MunicipalPlanner
              as_user_id: "${muni_c2}"
