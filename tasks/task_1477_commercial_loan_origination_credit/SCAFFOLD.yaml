# =============================================================================
# Scaffold: Commercial Loan Origination & Credit Memorandum
# Commercial bank lending group: intake & spreading, risk rating & policy
# exceptions, collateral appraisal, committee hierarchy, term sheet,
# commitment letter & documentation, closing & funding, covenants,
# participation / hold-level decision.
# =============================================================================

scenario: |
  Commercial Loan Origination & Credit Memorandum (commercial bank lending group): application intake & financial statement spreading, risk rating model & policy exception identification, collateral appraisal/evaluation ordering & review, loan committee approval hierarchy by size, term sheet, commitment letter & documentation checklist, closing conditions & funding authorization, covenant setup for ongoing monitoring, participation/hold-level decision

domain_name: commercial-loan-origination
api_prefix: /credit

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party_negotiation      # committee approval hierarchy with quorum, recusal, remand
  secondary_archetype: compliance_audit           # segregation of duties, Reg O insider handling, waiver audit trail
  complexity_layers:
    - optimistic_concurrency                      # OCC on LoanApplication.version for term-sheet supersede and committee-decision open
    - cascading_side_effects                      # decline / expiry / breach cascades spanning 3+ entities
    - dual_variant_calculation                    # BANK_STANDARD vs REGULATORY_STRESS DSCR; LENDING_BASIS vs LIQUIDATION_BASIS collateral
    - rate_threshold_triggers                     # committee tier by amount, DSCR/LTV policy thresholds, quorum breakpoints
  entity_topology: flat                           # peer collections under /credit, linked by FK fields in bodies
  state_machine_shape: branching                  # fork at finalize-spreads + remand cycle; cyclic machines on children
  relationship_patterns:
    - one_to_many                                 # LoanApplication -> statements, appraisals, exceptions, ...
    - self_referential                            # FinancialStatement.restatement_of_id
    - cross_aggregate                             # Appraisal.appraiser_id, CommitteeDecision.committee_session_id
  role_model: segregation_of_duties               # originator cannot finalize spreads, cannot vote, requester cannot authorize own funding
  consistency_model: immediate                    # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: BankOfficer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Officer full name; anchors X-User-ID for entity_backed roles" }

  - name: Borrower
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Borrower legal name" }
      - { name: naics_code, type: string, source: input, description: "6-digit NAICS industry code" }
      - { name: is_reg_o_insider, type: boolean, source: input, default: false, description: "Regulation O insider flag; forces committee level bump and liquidation-basis LTV floor" }
      - { name: relationship_since, type: string, source: input, description: "ISO date (YYYY-MM-DD) the banking relationship began; feeds tenure_points" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | EXITED; SUSPENDED set by covenant breach, restored on cure/waiver" }
      - { name: committed_exposure_cents, type: integer, source: computed, default: 0, description: "Sum over this borrower's applications whose letter status IN {ACCEPTED, FUNDED} of (letter.committed_amount_cents - application.funded_amount_cents); i.e. unfunded committed balance" }
      - { name: funded_exposure_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over FundingAuthorizations with status RELEASED for this borrower's applications" }
      - { name: total_exposure_cents, type: integer, source: computed, default: 0, description: "= committed_exposure_cents + funded_exposure_cents (conserved across letter-accept/funding-release pair)" }

  - name: LoanApplication
    parent: null
    common_fields: true
    fields:
      - { name: borrower_id, type: string, source: input, description: "FK -> Borrower.id; borrowing entity" }
      - { name: originating_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set from X-User-ID at creation; drives SoD recusal/finalize checks" }
      - { name: product_type, type: enum, source: input, description: "CRE_TERM | CRE_CONSTRUCTION | CI_WORKING_CAPITAL | EQUIPMENT | AGRICULTURE" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Requested loan amount in cents (> 0)" }
      - { name: term_months, type: integer, source: input, description: "Requested amortization term in months (12..360)" }
      - { name: purpose, type: string, source: input, required: false, description: "Free-text loan purpose" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | SPREADING | EXCEPTION_REVIEW | APPRAISAL_REVIEW | COMMITTEE_REVIEW | TERM_SHEET_NEGOTIATION | COMMITMENT | DOCUMENTATION | CLOSING | FUNDED | DECLINED | WITHDRAWN | EXPIRED" }
      - { name: dscr_standard, type: number, source: computed, description: "BANK_STANDARD DSCR (4 dp, round_half_up), null until finalize-spreads" }
      - { name: dscr_stress, type: number, source: computed, description: "REGULATORY_STRESS DSCR (4 dp), null until finalize-spreads" }
      - { name: risk_rating, type: integer, source: computed, description: "1..10 risk rating (1 best); provisional at finalize-spreads, full at submit-to-committee" }
      - { name: rating_basis, type: enum, source: computed, description: "PROVISIONAL (coverage factor excluded, weights renormalized) | FULL (all four factors)" }
      - { name: proposed_amount_cents, type: integer, source: computed, description: "Sized amount = min(requested, dscr_max, ltv_max, borrower_cap_headroom), computed at submit-to-committee" }
      - { name: committee_level_required, type: enum, source: computed, description: "SMALL | STANDARD | LARGE; computed at committee-decision creation from proposed amount + bump rules" }
      - { name: total_appraised_value_cents, type: integer, source: computed, default: 0, description: "Sum of appraised_value_cents over ACCEPTED appraisals" }
      - { name: total_eligible_collateral_cents, type: integer, source: computed, default: 0, description: "Sum of eligible_value_cents (LENDING_BASIS) over ACCEPTED appraisals" }
      - { name: total_liquidation_collateral_cents, type: integer, source: computed, default: 0, description: "Sum of liquidation_basis_value_cents over ACCEPTED appraisals" }
      - { name: bank_hold_amount_cents, type: integer, source: computed, default: 0, description: "= committed_amount_cents - sum(Participation.allocated_amount_cents where status IN {PROPOSED, COMMITTED, FUNDED}); 0 until a commitment letter exists" }
      - { name: bank_hold_fee_cents, type: integer, source: computed, description: "= letter.origination_fee_cents - sum(Participation.fee_share_cents over COMMITTED|FUNDED); null until a letter exists; remainder absorbs per-share rounding" }
      - { name: funded_amount_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over RELEASED FundingAuthorizations" }

  - name: FinancialStatement
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: restatement_of_id, type: string, source: input, required: false, description: "FK -> FinancialStatement.id; when set, this statement restates the referenced one (same application, same period_end_date)" }
      - { name: period_end_date, type: string, source: input, description: "ISO date of fiscal period end" }
      - { name: revenue_cents, type: integer, source: input, description: "Total revenue" }
      - { name: ebitda_cents, type: integer, source: input, description: "Reported EBITDA before addbacks" }
      - { name: addbacks_cents, type: integer, source: input, description: "Requested discretionary addbacks (capped at 25% of EBITDA in BANK_STANDARD variant)" }
      - { name: distributions_cents, type: integer, source: input, description: "Owner distributions / dividends" }
      - { name: maintenance_capex_cents, type: integer, source: input, description: "Maintenance capital expenditures" }
      - { name: existing_annual_debt_service_cents, type: integer, source: input, description: "Annual principal+interest on existing debt" }
      - { name: total_assets_cents, type: integer, source: input, description: "Balance sheet total assets" }
      - { name: total_liabilities_cents, type: integer, source: input, description: "Balance sheet total liabilities" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | SPREAD | FINAL | SUPERSEDED" }
      - { name: spread_by_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set from X-User-ID at spread" }
      - { name: finalized_by_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set from X-User-ID at finalize; audit anchor for SoD" }

  - name: PolicyException
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id" }
      - { name: rule_code, type: enum, source: system, description: "DSCR_MINIMUM | STRESS_DSCR_MINIMUM | SINGLE_BORROWER_LIMIT | REG_O_INSIDER | LTV_MAXIMUM | COLLATERAL_COVERAGE_MIN | COVENANT_BREACH | REQUIRED_DOC_WAIVER" }
      - { name: severity, type: enum, source: system, description: "HIGH: DSCR_MINIMUM, SINGLE_BORROWER_LIMIT, LTV_MAXIMUM, COLLATERAL_COVERAGE_MIN, COVENANT_BREACH; LOW: STRESS_DSCR_MINIMUM, REG_O_INSIDER, REQUIRED_DOC_WAIVER" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | WAIVED | RESOLVED_BY_CHANGE" }
      - { name: detail, type: string, source: system, description: "Machine-generated context (metric values at detection)" }
      - { name: waived_by_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set on waive" }
      - { name: waiver_rationale, type: string, source: input, description: "Required rationale on waive (>= 20 chars)" }

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Appraisal firm name" }
      - { name: license_number, type: string, source: input, description: "State license number" }
      - { name: max_concurrent_engagements, type: integer, source: input, default: 2, description: "Aggregate capacity cap for overlapping engagement windows (>= 1)" }
      - { name: status, type: enum, source: system, default: ELIGIBLE, description: "ELIGIBLE | SUSPENDED" }

  - name: Appraisal
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: appraiser_id, type: string, source: input, description: "FK -> Appraiser.id" }
      - { name: collateral_class, type: enum, source: input, description: "REAL_ESTATE | EQUIPMENT | RECEIVABLES | INVENTORY | AGRICULTURAL" }
      - { name: engagement_start_date, type: string, source: input, description: "ISO date; CLOSED interval start" }
      - { name: engagement_end_date, type: string, source: input, description: "ISO date; CLOSED interval end (>= start)" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Appraiser's concluded market value (set at receive-report)" }
      - { name: orderly_liquidation_value_cents, type: integer, source: input, description: "Orderly liquidation value (set at receive-report)" }
      - { name: eligible_value_cents, type: integer, source: computed, description: "LENDING_BASIS: concluded value x advance_rate(collateral_class), floor to cents; set at ACCEPTED" }
      - { name: liquidation_basis_value_cents, type: integer, source: computed, description: "LIQUIDATION_BASIS: orderly_liquidation_value x 0.85 x advance_rate, floor to cents; set at ACCEPTED" }
      - { name: status, type: enum, source: system, default: ENGAGED, description: "ENGAGED | REPORT_RECEIVED | ACCEPTED | REJECTED | CANCELLED" }

  - name: CommitteeSession
    parent: null
    common_fields: true
    fields:
      - { name: level, type: enum, source: input, description: "SMALL | STANDARD | LARGE; must match decision's computed level_required" }
      - { name: starts_at, type: string, source: input, description: "ISO8601 datetime; HALF-OPEN interval start (inclusive)" }
      - { name: ends_at, type: string, source: input, description: "ISO8601 datetime; HALF-OPEN interval end (exclusive); back-to-back sessions allowed" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | ADJOURNED" }

  - name: CommitteeDecision
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: committee_session_id, type: string, source: input, description: "FK -> CommitteeSession.id; session level must equal level_required" }
      - { name: level_required, type: enum, source: computed, description: "SMALL | STANDARD | LARGE from amount tiers with Reg-O / HIGH-exception bump" }
      - { name: votes_required, type: integer, source: computed, description: "Quorum: SMALL 2 of 2 | STANDARD 2 of 3 | LARGE 4 of 5 (LARGE also requires chair APPROVE)" }
      - { name: votes, type: array, source: system, default: [], description: "Vote records: { officer_id, vote: APPROVE|DECLINE|REMAND, cast_at }" }
      - { name: votes_for, type: integer, source: computed, default: 0, description: "Count of APPROVE votes" }
      - { name: votes_against, type: integer, source: computed, default: 0, description: "Count of DECLINE votes" }
      - { name: chair_approved, type: boolean, source: computed, default: false, description: "True once a CommitteeChair APPROVE vote is recorded" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | APPROVED | DECLINED | REMANDED" }

  - name: TermSheet
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: amount_cents, type: integer, source: input, description: "Offered amount (must equal application.proposed_amount_cents)" }
      - { name: rate_bps, type: integer, source: input, description: "Offered fixed rate in basis points (1..3000)" }
      - { name: term_months, type: integer, source: input, description: "Offered term" }
      - { name: expires_at, type: string, source: input, description: "ISO8601 datetime; sheet auto-EXPIRED when clock passes while ISSUED" }
      - { name: origination_fee_cents, type: integer, source: computed, description: "Tiered fee: per-tier slice rounded half-up to cents THEN summed (pinned order tier1,tier2,tier3)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACCEPTED | DECLINED | SUPERSEDED | EXPIRED" }

  - name: CommitmentLetter
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: system, description: "FK -> LoanApplication.id; created DRAFT when a term sheet is ACCEPTED" }
      - { name: committed_amount_cents, type: integer, source: system, description: "= accepted term sheet amount_cents" }
      - { name: rate_bps, type: integer, source: system, description: "= accepted term sheet rate" }
      - { name: term_months, type: integer, source: system, description: "= accepted term sheet term" }
      - { name: origination_fee_cents, type: integer, source: system, description: "= accepted term sheet computed fee" }
      - { name: expiry_date, type: string, source: input, description: "ISO date; set at issue; letter EXPIRED by clock sweep if still ISSUED at/after this date" }
      - { name: rate_lock_expires_at, type: string, source: input, description: "ISO8601 datetime; funding release blocked after this instant; must be <= expiry_date end-of-day" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ISSUED | ACCEPTED | FUNDED | EXPIRED | TERMINATED" }

  - name: DocumentChecklistItem
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: category, type: enum, source: input, description: "DOCUMENT (gates DOCUMENTATION->CLOSING) | CLOSING_CONDITION (gates funding release)" }
      - { name: label, type: string, source: input, description: "Item label, e.g. 'UCC-1 filed'" }
      - { name: is_required, type: boolean, source: input, default: true, description: "Optional items never gate transitions" }
      - { name: severity, type: enum, source: input, default: STANDARD, description: "STANDARD | CRITICAL; CRITICAL items may never be waived" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | RECEIVED | APPROVED | REJECTED | WAIVED | CANCELLED" }
      - { name: waived_by_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set on waive" }
      - { name: waiver_rationale, type: string, source: input, description: "Required on waive (>= 20 chars)" }

  - name: FundingAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: amount_cents, type: integer, source: input, description: "Tranche amount (> 0)" }
      - { name: disbursement_date, type: string, source: input, description: "ISO date of planned disbursement" }
      - { name: requested_by_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set from X-User-ID at request" }
      - { name: authorized_by_officer_id, type: string, source: system, description: "FK -> BankOfficer.id; set at authorize; must differ from requested_by_officer_id" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | AUTHORIZED | RELEASED | CANCELLED" }

  - name: Covenant
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: covenant_type, type: enum, source: input, description: "DSCR_MIN (pass when measured >= threshold) | LEVERAGE_MAX | CAPEX_LIMIT | DISTRIBUTION_BLOCK (pass when measured <= threshold)" }
      - { name: threshold_value, type: number, source: input, description: "Ratio (4 dp) for DSCR_MIN/LEVERAGE_MAX; cents for CAPEX_LIMIT/DISTRIBUTION_BLOCK" }
      - { name: frequency, type: enum, source: input, description: "ANNUAL | QUARTERLY" }
      - { name: status, type: enum, source: system, default: MONITORING, description: "MONITORING | COMPLIANT | BREACH_PENDING | CURED | WAIVED" }
      - { name: last_reviewed_period, type: string, source: system, description: "period_end_date of latest review" }

  - name: Participation
    parent: null
    common_fields: true
    fields:
      - { name: loan_application_id, type: string, source: input, description: "FK -> LoanApplication.id" }
      - { name: participant_bank_name, type: string, source: input, description: "Participant institution name" }
      - { name: allocated_amount_cents, type: integer, source: input, description: "Sold share (> 0); reduces bank_hold_amount_cents while status IN {PROPOSED, COMMITTED, FUNDED}" }
      - { name: fee_share_cents, type: integer, source: computed, description: "Participation's share of the origination fee, computed at commit: round_half_up(letter.origination_fee_cents * allocated_amount_cents / committed_amount_cents); null until COMMITTED; cleared on RELEASED" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | COMMITTED | FUNDED | RELEASED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LoanApplication
    initial_state: INTAKE
    terminal_states: [FUNDED, DECLINED, WITHDRAWN, EXPIRED]
    transitions:
      - from: INTAKE
        to: SPREADING
        trigger: "POST /credit/loan-applications/{id}/submit"
        actor: RelationshipManager
        preconditions:
          - "status == INTAKE (ERR_INVALID_STATE)"
          - "at least one FinancialStatement for this application (ERR_STATEMENTS_NOT_FINAL)"
        side_effects: []

      - from: SPREADING
        to: EXCEPTION_REVIEW
        trigger: "POST /credit/loan-applications/{id}/finalize-spreads"
        actor: CreditAnalyst
        preconditions:
          - "status == SPREADING (ERR_INVALID_STATE)"
          - "every FinancialStatement of the application has status FINAL or SUPERSEDED, and at least one is FINAL (ERR_STATEMENTS_NOT_FINAL)"
          - "X-User-ID != originating_officer_id (ERR_SOD_SPREAD_FINALIZE_BY_ORIGINATOR)"
        side_effects:
          - "compute dscr_standard and dscr_stress (calculations.dscr_computation, both variants, same inputs)"
          - "compute provisional risk_rating (rating_basis = PROVISIONAL)"
          - "auto-create PolicyExceptions: DSCR_MINIMUM if dscr_standard < 1.2500; STRESS_DSCR_MINIMUM if dscr_stress < 1.0000; SINGLE_BORROWER_LIMIT if borrower.total_exposure_cents + requested_amount_cents > 5000000000; REG_O_INSIDER if borrower.is_reg_o_insider"
          - "branch: if any PolicyException with status OPEN exists -> EXCEPTION_REVIEW"
      - from: SPREADING
        to: APPRAISAL_REVIEW
        trigger: "POST /credit/loan-applications/{id}/finalize-spreads"
        actor: CreditAnalyst
        preconditions:
          - "same as SPREADING -> EXCEPTION_REVIEW"
        side_effects:
          - "same computations as above; branch: no OPEN exceptions -> APPRAISAL_REVIEW"

      - from: EXCEPTION_REVIEW
        to: APPRAISAL_REVIEW
        trigger: "POST /credit/loan-applications/{id}/clear-exceptions"
        actor: CreditPolicyOfficer
        preconditions:
          - "status == EXCEPTION_REVIEW (ERR_INVALID_STATE)"
          - "no PolicyException with status OPEN for this application (ERR_OPEN_POLICY_EXCEPTIONS)"
        side_effects: []

      - from: APPRAISAL_REVIEW
        to: COMMITTEE_REVIEW
        trigger: "POST /credit/loan-applications/{id}/submit-to-committee"
        actor: CreditAnalyst
        preconditions:
          - "status == APPRAISAL_REVIEW (ERR_INVALID_STATE)"
          - "at least one Appraisal with status ACCEPTED (ERR_NO_ACCEPTED_APPRAISAL)"
          - "no Appraisal with status ENGAGED or REPORT_RECEIVED (ERR_APPRAISALS_NOT_SETTLED)"
          - "sizing result > 0 (ERR_NO_SIZEABLE_AMOUNT)"
        side_effects:
          - "recompute total_appraised_value_cents / total_eligible_collateral_cents / total_liquidation_collateral_cents over ACCEPTED appraisals"
          - "compute proposed_amount_cents (calculations.maximum_sizing; pinned evaluation order)"
          - "auto-create exceptions against the REQUESTED amount (the deal as asked): LTV_MAXIMUM if requested_amount_cents/total_appraised > max_ltv(product_type); COLLATERAL_COVERAGE_MIN if total_eligible < requested_amount_cents; for Reg O insider also test liquidation basis (requested/total_liquidation > max_ltv -> COLLATERAL_COVERAGE_MIN whose detail notes liquidation basis)"
          - "recompute risk_rating with FULL basis (coverage factor uses total_eligible / requested_amount_cents)"

      - from: COMMITTEE_REVIEW
        to: TERM_SHEET_NEGOTIATION
        trigger: "system (CommitteeDecision auto-closes APPROVED on quorum)"
        actor: system
        preconditions: ["closing decision status == APPROVED"]
        side_effects: []
      - from: COMMITTEE_REVIEW
        to: DECLINED
        trigger: "system (CommitteeDecision auto-closes DECLINED)"
        actor: system
        preconditions: ["closing decision status == DECLINED"]
        side_effects:
          - "cascade hop 2: all Appraisals of the application with status ENGAGED or REPORT_RECEIVED -> CANCELLED (frees appraiser engagement windows)"
      - from: COMMITTEE_REVIEW
        to: EXCEPTION_REVIEW
        trigger: "system (CommitteeChair casts REMAND vote; decision -> REMANDED)"
        actor: system
        preconditions: ["closing decision status == REMANDED"]
        side_effects:
          - "remand cycle: application returns to EXCEPTION_REVIEW; exceptions may be waived or resolved-by-change; a NEW CommitteeDecision may be opened after re-submission"

      - from: TERM_SHEET_NEGOTIATION
        to: COMMITMENT
        trigger: "system (TermSheet respond with outcome=ACCEPTED)"
        actor: system
        preconditions: ["accepted sheet status == ACCEPTED"]
        side_effects:
          - "create CommitmentLetter (DRAFT) mirroring sheet amount/rate/term/fee"
      - from: COMMITMENT
        to: DOCUMENTATION
        trigger: "POST /credit/commitment-letters/{id}/accept"
        actor: CreditAdministrator
        preconditions:
          - "letter status == ISSUED (ERR_INVALID_STATE)"
          - "logical clock date < letter.expiry_date (ERR_COMMITMENT_EXPIRED)"
        side_effects:
          - "letter -> ACCEPTED; borrower.committed_exposure_cents += committed_amount_cents; total_exposure recompute"
      - from: DOCUMENTATION
        to: CLOSING
        trigger: "POST /credit/loan-applications/{id}/submit-for-closing"
        actor: CreditAdministrator
        preconditions:
          - "status == DOCUMENTATION (ERR_INVALID_STATE)"
          - "every DocumentChecklistItem with category=DOCUMENT and is_required=true has status APPROVED or WAIVED (ERR_CHECKLIST_INCOMPLETE)"
          - "at least one Covenant exists for the application (ERR_NO_COVENANTS_CONFIGURED)"
        side_effects: []
      - from: CLOSING
        to: FUNDED
        trigger: "system (first FundingAuthorization RELEASED)"
        actor: system
        preconditions: ["funding release succeeds"]
        side_effects:
          - "letter ACCEPTED -> FUNDED"
          - "application.funded_amount_cents += released amount; borrower.funded_exposure_cents += released amount"
          - "compensating pair: the application's funded_amount increment simultaneously reduces its committed contribution (committed_amount - funded_amount) by the same amount, so borrower.total_exposure_cents is unchanged by the release"
          - "all Participations with status COMMITTED -> FUNDED"
      - from: FUNDED
        to: FUNDED
        trigger: "system (subsequent FundingAuthorization RELEASED tranches)"
        actor: system
        preconditions: ["funding release succeeds"]
        side_effects:
          - "application.funded_amount_cents += released amount; borrower.funded_exposure_cents += released amount"
          - "same compensating pair keeps borrower.total_exposure_cents unchanged on every tranche"
      - from: COMMITMENT
        to: EXPIRED
        trigger: "system (POST /credit/_clock/set_current_utc sweep: letter ISSUED and expiry_date <= clock date)"
        actor: system
        preconditions: ["letter status == ISSUED"]
        side_effects:
          - "cascade hop 1: CommitmentLetter ISSUED -> EXPIRED"
          - "cascade hop 2: LoanApplication COMMITMENT -> EXPIRED"
          - "cascade hop 3: DocumentChecklistItems PENDING|RECEIVED|REJECTED -> CANCELLED; Participations PROPOSED|COMMITTED -> RELEASED (allocated headroom returns to bank_hold_amount_cents)"
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects:
          - "if CommitmentLetter ACCEPTED: letter -> TERMINATED and borrower.committed_exposure_cents -= committed_amount_cents"
          - "Appraisals ENGAGED|REPORT_RECEIVED -> CANCELLED; Participations PROPOSED|COMMITTED -> RELEASED"
      - from: SPREADING
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set"]
      - from: EXCEPTION_REVIEW
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set"]
      - from: APPRAISAL_REVIEW
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set"]
      - from: COMMITTEE_REVIEW
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set; OPEN CommitteeDecision -> REMANDED is NOT applied; decision is left OPEN but votes on a withdrawn application are rejected by session/state checks"]
      - from: TERM_SHEET_NEGOTIATION
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set; ISSUED TermSheets -> SUPERSEDED"]
      - from: COMMITMENT
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set"]
      - from: DOCUMENTATION
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set; letter TERMINATED path applies"]
      - from: CLOSING
        to: WITHDRAWN
        trigger: "POST /credit/loan-applications/{id}/withdraw"
        actor: RelationshipManager
        preconditions: ["status is non-terminal (ERR_INVALID_STATE)"]
        side_effects: ["same withdrawal compensation set; FundingAuthorizations REQUESTED|AUTHORIZED -> CANCELLED"]

  - entity: FinancialStatement
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SPREAD
        trigger: "POST /credit/financial-statements/{id}/spread"
        actor: CreditAnalyst
        preconditions:
          - "statement status == SUBMITTED (ERR_INVALID_STATE)"
          - "parent application status IN {INTAKE, SPREADING, EXCEPTION_REVIEW} (ERR_AMEND_NOT_PERMITTED)"
        side_effects: ["spread_by_officer_id := X-User-ID"]
      - from: SPREAD
        to: FINAL
        trigger: "POST /credit/financial-statements/{id}/finalize"
        actor: CreditAnalyst
        preconditions:
          - "statement status == SPREAD (ERR_INVALID_STATE)"
          - "parent application status IN {SPREADING, EXCEPTION_REVIEW} (ERR_AMEND_NOT_PERMITTED)"
        side_effects:
          - "finalized_by_officer_id := X-User-ID"
          - "if restatement_of_id is set: referenced statement FINAL -> SUPERSEDED (self-referential restatement cycle)"
          - "if parent application status == EXCEPTION_REVIEW: recompute dscr_standard/dscr_stress, refresh auto exceptions (OPEN -> RESOLVED_BY_CHANGE when the triggering condition no longer holds; create newly triggered ones; never resurrect WAIVED)"
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (a restatement statement referencing this one reaches FINAL)"
        actor: system
        preconditions: ["restatement statement's finalize transition fired"]
        side_effects: []

  - entity: Appraisal
    initial_state: ENGAGED
    terminal_states: [ACCEPTED, REJECTED, CANCELLED]
    transitions:
      - from: ENGAGED
        to: REPORT_RECEIVED
        trigger: "POST /credit/appraisals/{id}/receive-report"
        actor: AppraisalManager
        preconditions: ["status == ENGAGED (ERR_INVALID_STATE)"]
        side_effects: ["appraised_value_cents, orderly_liquidation_value_cents recorded"]
      - from: REPORT_RECEIVED
        to: ACCEPTED
        trigger: "POST /credit/appraisals/{id}/review with outcome=ACCEPTED"
        actor: AppraisalManager
        preconditions: ["status == REPORT_RECEIVED (ERR_INVALID_STATE)"]
        side_effects:
          - "compute eligible_value_cents (LENDING_BASIS) and liquidation_basis_value_cents (LIQUIDATION_BASIS) from concluded values"
          - "recompute application collateral aggregates over ACCEPTED appraisals"
      - from: REPORT_RECEIVED
        to: REJECTED
        trigger: "POST /credit/appraisals/{id}/review with outcome=REJECTED"
        actor: AppraisalManager
        preconditions: ["status == REPORT_RECEIVED (ERR_INVALID_STATE)"]
        side_effects:
          - "engagement window freed (no longer counts toward appraiser overlap capacity)"
          - "a replacement Appraisal may be ordered (reorder loop)"
      - from: ENGAGED
        to: CANCELLED
        trigger: "system (application DECLINED / WITHDRAWN / EXPIRED cascade)"
        actor: system
        preconditions: []
        side_effects: ["engagement window freed"]
      - from: REPORT_RECEIVED
        to: CANCELLED
        trigger: "system (application DECLINED / WITHDRAWN / EXPIRED cascade)"
        actor: system
        preconditions: []
        side_effects: ["engagement window freed"]

  - entity: CommitteeSession
    initial_state: SCHEDULED
    terminal_states: [ADJOURNED]
    transitions:
      - from: SCHEDULED
        to: ADJOURNED
        trigger: "system (logical clock passes ends_at)"
        actor: system
        preconditions: []
        side_effects: ["OPEN CommitteeDecisions in this session can no longer receive votes (ERR_COMMITTEE_SESSION_NOT_OPEN)"]

  - entity: CommitteeDecision
    initial_state: OPEN
    terminal_states: [APPROVED, DECLINED, REMANDED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "system (vote tally: votes_for >= votes_required AND (level != LARGE OR chair_approved))"
        actor: system
        preconditions: ["evaluated after each accepted vote, APPROVE rule evaluated before DECLINE rule"]
        side_effects: ["LoanApplication COMMITTEE_REVIEW -> TERM_SHEET_NEGOTIATION"]
      - from: OPEN
        to: DECLINED
        trigger: "system (vote tally: votes_against >= size - votes_required + 1; size SMALL 2 / STANDARD 3 / LARGE 5)"
        actor: system
        preconditions: ["evaluated after APPROVE rule"]
        side_effects:
          - "LoanApplication COMMITTEE_REVIEW -> DECLINED"
          - "cascade: Appraisals ENGAGED|REPORT_RECEIVED -> CANCELLED"
      - from: OPEN
        to: REMANDED
        trigger: "POST /credit/committee-decisions/{id}/votes with vote=REMAND (chair only)"
        actor: CommitteeChair
        preconditions: ["decision OPEN; session window open; chair not recused; chair has not yet voted"]
        side_effects: ["LoanApplication COMMITTEE_REVIEW -> EXCEPTION_REVIEW (remand cycle)"]

  - entity: TermSheet
    initial_state: ISSUED
    terminal_states: [ACCEPTED, DECLINED, SUPERSEDED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /credit/term-sheets/{id}/respond with outcome=ACCEPTED"
        actor: RelationshipManager
        preconditions:
          - "sheet status == ISSUED (ERR_INVALID_STATE)"
          - "application status == TERM_SHEET_NEGOTIATION (ERR_INVALID_STATE)"
        side_effects:
          - "application TERM_SHEET_NEGOTIATION -> COMMITMENT"
          - "create CommitmentLetter DRAFT mirroring amount/rate/term/fee"
      - from: ISSUED
        to: DECLINED
        trigger: "POST /credit/term-sheets/{id}/respond with outcome=DECLINED"
        actor: RelationshipManager
        preconditions: ["sheet status == ISSUED (ERR_INVALID_STATE)"]
        side_effects: ["application remains TERM_SHEET_NEGOTIATION; a replacement sheet may be created"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a new TermSheet is created for the same application)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock sweep: expires_at < now)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CommitmentLetter
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /credit/commitment-letters/{id}/issue"
        actor: CreditAdministrator
        preconditions: ["status == DRAFT (ERR_INVALID_STATE)", "rate_lock_expires_at <= expiry_date 23:59:59Z (ERR_VALIDATION)"]
        side_effects: []
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /credit/commitment-letters/{id}/accept"
        actor: CreditAdministrator
        preconditions: ["status == ISSUED (ERR_INVALID_STATE)", "clock date < expiry_date (ERR_COMMITMENT_EXPIRED)"]
        side_effects:
          - "application COMMITMENT -> DOCUMENTATION"
          - "borrower.committed_exposure_cents += committed_amount_cents"
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock sweep: expiry_date <= clock date)"
        actor: system
        preconditions: []
        side_effects: ["cascade: application -> EXPIRED; checklist items CANCELLED; participations RELEASED"]
      - from: ACCEPTED
        to: FUNDED
        trigger: "system (first funding release)"
        actor: system
        preconditions: []
        side_effects: ["exposure bookkeeping is formula-driven (calculations.exposure_ledger): the application's growing funded_amount_cents shrinks its committed contribution cent-for-cent; no direct decrement is written"]
      - from: ACCEPTED
        to: TERMINATED
        trigger: "system (application withdrawn)"
        actor: system
        preconditions: []
        side_effects: ["borrower.committed_exposure_cents -= committed_amount_cents"]

  - entity: DocumentChecklistItem
    initial_state: PENDING
    terminal_states: [APPROVED, WAIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /credit/document-checklist-items/{id}/transition to=RECEIVED"
        actor: CreditAdministrator
        preconditions: ["status == PENDING (ERR_INVALID_STATE)"]
        side_effects: []
      - from: RECEIVED
        to: APPROVED
        trigger: "transition to=APPROVED"
        actor: CreditAdministrator
        preconditions: ["status == RECEIVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "transition to=REJECTED"
        actor: CreditAdministrator
        preconditions: ["status == RECEIVED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: REJECTED
        to: PENDING
        trigger: "transition to=PENDING (resubmission cycle)"
        actor: CreditAdministrator
        preconditions: ["status == REJECTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: PENDING
        to: WAIVED
        trigger: "transition to=WAIVED"
        actor: CreditPolicyOfficer
        preconditions:
          - "status == PENDING or RECEIVED (ERR_INVALID_STATE)"
          - "severity != CRITICAL (ERR_CONDITION_NOT_WAIVABLE)"
          - "waiver_rationale >= 20 chars (ERR_VALIDATION)"
        side_effects:
          - "if is_required: auto-create PolicyException REQUIRED_DOC_WAIVER (severity LOW) unless one already OPEN for same item"
      - from: RECEIVED
        to: WAIVED
        trigger: "transition to=WAIVED"
        actor: CreditPolicyOfficer
        preconditions: ["same as PENDING -> WAIVED"]
        side_effects: ["same as PENDING -> WAIVED"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (commitment expiry cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: CANCELLED
        trigger: "system (commitment expiry cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: CANCELLED
        trigger: "system (commitment expiry cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FundingAuthorization
    initial_state: REQUESTED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /credit/funding-authorizations/{id}/authorize"
        actor: CreditPolicyOfficer
        preconditions:
          - "status == REQUESTED (ERR_INVALID_STATE)"
          - "X-User-ID != requested_by_officer_id (ERR_SOD_FUNDING_SELF_AUTHORIZE)"
        side_effects: ["authorized_by_officer_id := X-User-ID"]
      - from: AUTHORIZED
        to: RELEASED
        trigger: "POST /credit/funding-authorizations/{id}/release"
        actor: CreditAdministrator
        preconditions:
          - "status == AUTHORIZED (ERR_INVALID_STATE)"
          - "application status IN {CLOSING, FUNDED} (ERR_INVALID_STATE)"
          - "no PolicyException with status OPEN and severity HIGH for the application (ERR_UNRESOLVED_POLICY_EXCEPTION)"
          - "every DocumentChecklistItem with category=CLOSING_CONDITION and is_required=true has status APPROVED or WAIVED (ERR_CHECKLIST_INCOMPLETE)"
          - "logical clock <= letter.rate_lock_expires_at (ERR_RATE_LOCK_EXPIRED)"
          - "letter status IN {ACCEPTED, FUNDED} (ERR_COMMITMENT_NOT_ACCEPTED)"
          - "funded_amount_cents + amount_cents <= letter.committed_amount_cents (ERR_FUNDING_OVER_COMMITMENT)"
        side_effects:
          - "borrower.funded_exposure_cents += amount_cents; application.funded_amount_cents += amount_cents"
          - "first release: letter ACCEPTED -> FUNDED, committed_exposure decremented, application CLOSING -> FUNDED, COMMITTED participations -> FUNDED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "system (application withdrawn/declined/expired)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "system (application withdrawn/declined/expired)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Covenant
    initial_state: MONITORING
    terminal_states: [WAIVED]
    transitions:
      - from: MONITORING
        to: COMPLIANT
        trigger: "POST /credit/covenants/{id}/review (measurement passes)"
        actor: CreditAnalyst
        preconditions: ["application status == FUNDED (ERR_INVALID_STATE)"]
        side_effects: ["last_reviewed_period := input period_end_date"]
      - from: COMPLIANT
        to: COMPLIANT
        trigger: "review (pass)"
        actor: CreditAnalyst
        preconditions: ["application FUNDED"]
        side_effects: []
      - from: MONITORING
        to: BREACH_PENDING
        trigger: "review (measurement fails)"
        actor: CreditAnalyst
        preconditions: ["application FUNDED"]
        side_effects:
          - "cascade hop 1: auto-create PolicyException COVENANT_BREACH (severity HIGH)"
          - "cascade hop 2: Borrower status -> SUSPENDED (blocks new applications: ERR_BORROWER_NOT_ACTIVE)"
      - from: COMPLIANT
        to: BREACH_PENDING
        trigger: "review (fail)"
        actor: CreditAnalyst
        preconditions: ["application FUNDED"]
        side_effects: ["same breach cascade"]
      - from: BREACH_PENDING
        to: CURED
        trigger: "review (subsequent measurement passes)"
        actor: CreditAnalyst
        preconditions: ["application FUNDED"]
        side_effects:
          - "linked OPEN COVENANT_BREACH exception -> RESOLVED_BY_CHANGE"
          - "if borrower has no other Covenant in BREACH_PENDING: borrower status -> ACTIVE"
      - from: CURED
        to: BREACH_PENDING
        trigger: "review (fail again; breach/cure cycle)"
        actor: CreditAnalyst
        preconditions: ["application FUNDED"]
        side_effects: ["same breach cascade"]
      - from: BREACH_PENDING
        to: WAIVED
        trigger: "POST /credit/covenants/{id}/waive-breach"
        actor: CreditPolicyOfficer
        preconditions: ["status == BREACH_PENDING (ERR_INVALID_STATE)", "waiver_rationale >= 20 chars (ERR_VALIDATION)"]
        side_effects:
          - "linked OPEN COVENANT_BREACH exception -> WAIVED"
          - "if borrower has no other Covenant in BREACH_PENDING: borrower status -> ACTIVE"

  - entity: Participation
    initial_state: PROPOSED
    terminal_states: [FUNDED, RELEASED]
    transitions:
      - from: PROPOSED
        to: COMMITTED
        trigger: "POST /credit/participations/{id}/commit"
        actor: RelationshipManager
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
          - "CommitmentLetter status IN {ISSUED, ACCEPTED, FUNDED} (ERR_COMMITMENT_NOT_ACCEPTED)"
        side_effects: []
      - from: PROPOSED
        to: RELEASED
        trigger: "POST /credit/participations/{id}/release"
        actor: RelationshipManager
        preconditions: ["status IN {PROPOSED, COMMITTED} (ERR_INVALID_STATE)"]
        side_effects: ["allocated headroom returns: bank_hold_amount_cents += allocated_amount_cents (compensating invariant)"]
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /credit/participations/{id}/release"
        actor: RelationshipManager
        preconditions: ["status IN {PROPOSED, COMMITTED} (ERR_INVALID_STATE)"]
        side_effects: ["same compensating release"]
      - from: COMMITTED
        to: FUNDED
        trigger: "system (first funding release)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: term-sheet-supersede-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /credit/term-sheets"
    occ_field: expected_loan_application_version
    description: |
      Creating a TermSheet supersedes the application's currently ISSUED sheet
      and advances the application's version. A creation request carrying an
      expected_loan_application_version older than the application's current
      version is rejected: the client negotiated against a superseded view of
      the deal (e.g., another sheet has since been issued, or terms were
      re-sized by committee remand), so its terms no longer reflect the
      current application state.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: committee-decision-open-stale-application
    parent_entity: LoanApplication
    write_endpoint: "POST /credit/committee-decisions"
    occ_field: expected_loan_application_version
    description: |
      Opening a CommitteeDecision pins the application's current version.
      A creation request whose expected_loan_application_version is behind the
      application's current version is rejected: the chair convened against a
      stale credit memorandum (e.g., a collateral aggregate or sizing figure
      changed after the chair's review), so the decision must be re-based on
      the current version before votes are taken.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dscr_computation
    trigger: "POST .../finalize-spreads (initial); POST /credit/financial-statements/{id}/finalize while application in EXCEPTION_REVIEW (recompute); PATCH /credit/loan-applications/{id} while EXCEPTION_REVIEW (recompute)"
    algorithm: aggregation
    description: "Underwriting debt-service-coverage ratio. Two variants computed from the SAME statement produce different ratios; both are persisted on LoanApplication."
    input_set: "The application's FinancialStatements with status == FINAL; select the one with max period_end_date. Invariant: at most one FINAL statement exists per period_end_date per application (restatement supersedes), so no tie-break is ever needed."
    formula: |
      r  = POLICY_RATE_BPS / 10000 / 12                      # monthly rate = 0.07/12
      pmt = round_half_up_cents( requested_amount_cents * r / (1 - (1 + r) ** (-term_months)) )
      annual_debt_service = pmt * 12 + statement.existing_annual_debt_service_cents
      # Variant BANK_STANDARD:
      addback_allowed = min(statement.addbacks_cents, floor(statement.ebitda_cents * ADDBACK_CAP_RATIO))
      cf_standard = statement.ebitda_cents + addback_allowed - statement.distributions_cents - statement.maintenance_capex_cents
      dscr_standard = round_half_up_4dp( cf_standard / annual_debt_service )
      # Variant REGULATORY_STRESS:
      ebitda_stress = statement.ebitda_cents - round_half_up_cents(statement.revenue_cents * STRESS_REVENUE_HAIRCUT)
      cf_stress = ebitda_stress - statement.distributions_cents - statement.maintenance_capex_cents   # addbacks EXCLUDED
      dscr_stress = round_half_up_4dp( cf_stress / annual_debt_service )
    constants:
      POLICY_RATE_BPS: 700          # 7.00% underwriting rate
      ADDBACK_CAP_RATIO: 0.25
      STRESS_REVENUE_HAIRCUT: 0.15
      DSCR_MIN: 1.25                # exception when dscr_standard < 1.2500 (>= passes)
      STRESS_DSCR_MIN: 1.0          # exception when dscr_stress < 1.0000
    precision: "money integer cents; ratios 4 decimal places, round_half_up"
    variants:
      - name: BANK_STANDARD
        when: "primary underwriting basis; drives DSCR_MINIMUM exception and dscr_points in risk rating"
        difference: "addbacks included up to 25% of EBITDA; no revenue haircut"
      - name: REGULATORY_STRESS
        when: "regulatory stress basis; drives STRESS_DSCR_MINIMUM (LOW severity) exception"
        difference: "addbacks excluded entirely AND EBITDA reduced by 15% of revenue"

  - name: risk_rating_model
    trigger: "POST .../finalize-spreads (PROVISIONAL basis); POST .../submit-to-committee (FULL basis)"
    algorithm: weighted_scoring
    description: "Combinatorial rating: four tiered factor lookups combined with fixed weights; PROVISIONAL basis renormalizes weights when collateral coverage is not yet knowable."
    input_set: "latest FINAL statement (as dscr_computation), application/borrower fields, collateral aggregates (FULL basis only)"
    formula: |
      dscr_points:     dscr_standard >= 1.50 -> 100 | >= 1.35 -> 80 | >= 1.25 -> 60 | >= 1.10 -> 40 | else 20
      leverage_points: liabilities/assets <= 0.50 -> 100 | <= 0.65 -> 80 | <= 0.75 -> 60 | <= 0.85 -> 40 | else 20
                       (ratio computed 4dp round_half_up; boundary <= is inclusive)
      coverage_points: total_eligible_collateral_cents / requested_amount_cents >= 1.25 -> 100 | >= 1.00 -> 75 | >= 0.75 -> 50 | else 25
      tenure_points:   floor((logical_clock_date - borrower.relationship_since) in years) >= 10 -> 100 | >= 5 -> 75 | >= 2 -> 50 | else 25
      FULL basis:        score = 0.40*dscr + 0.30*leverage + 0.20*coverage + 0.10*tenure  (round_half_up to 2dp)
      PROVISIONAL basis: score = (0.40*dscr + 0.30*leverage + 0.10*tenure) / 0.80           (weights renormalized; round_half_up 2dp)
      rating band: score >= 90 -> 1 | >= 80 -> 2 | >= 70 -> 3 | >= 60 -> 4 | >= 50 -> 5 | >= 40 -> 6 | >= 30 -> 7 | >= 20 -> 8 | >= 10 -> 9 | else 10
    constants:
      W_DSCR: 0.40
      W_LEVERAGE: 0.30
      W_COVERAGE: 0.20
      W_TENURE: 0.10
    precision: "score 2 decimal places, round_half_up"

  - name: maximum_sizing
    trigger: "POST .../submit-to-committee"
    algorithm: constraint_propagation
    description: "Circular-looking sizing dependency with PINNED evaluation order. DSCR was computed on the requested amount at finalize-spreads and is NOT recomputed on the sized amount; the DSCR constraint is inverted algebraically to a principal cap."
    input_set: "application requested_amount_cents/term_months, cf_standard from dscr_computation, ACCEPTED-appraisal aggregates, borrower exposure"
    formula: |
      # PINNED ORDER — evaluate exactly in this sequence; no iteration back:
      # (1) DSCR principal cap from the ALREADY-COMPUTED cf_standard:
      max_annual_proposed_ds = floor_cents( cf_standard / DSCR_MIN ) - statement.existing_annual_debt_service_cents
      if max_annual_proposed_ds <= 0: reject ERR_NO_SIZEABLE_AMOUNT
      pmt_max = max_annual_proposed_ds / 12
      dscr_max = floor_cents( pmt_max * (1 - (1 + r) ** (-term_months)) / r )     # annuity inversion, r as in dscr_computation
      # (2) LTV principal cap:
      ltv_max = floor_cents( total_appraised_value_cents * MAX_LTV[product_type] )
      # (3) single-borrower cap headroom:
      cap_headroom = SINGLE_BORROWER_CAP_CENTS - borrower.total_exposure_cents
      # (4) proposed:
      proposed_amount_cents = min(requested_amount_cents, dscr_max, ltv_max, cap_headroom)
      if proposed_amount_cents <= 0: reject ERR_NO_SIZEABLE_AMOUNT
    constants:
      SINGLE_BORROWER_CAP_CENTS: 5000000000     # $50,000,000.00
      MAX_LTV: { CRE_TERM: 0.80, CRE_CONSTRUCTION: 0.75, CI_WORKING_CAPITAL: 0.60, EQUIPMENT: 0.85, AGRICULTURE: 0.75 }
    precision: "integer cents, floor for caps"

  - name: eligible_collateral_value
    trigger: "POST /credit/appraisals/{id}/review with outcome=ACCEPTED"
    algorithm: weighted_scoring
    description: "Dual-variant collateral valuation: same appraised inputs, two basis conventions, different eligible values. LENDING_BASIS drives coverage/ltv exceptions; LIQUIDATION_BASIS additionally gates Reg O insider deals."
    input_set: "the single appraisal being accepted (per-appraisal values), then summed over all ACCEPTED appraisals of the application"
    formula: |
      # Variant LENDING_BASIS (per appraisal):
      eligible_value_cents = floor_cents( appraised_value_cents * ADVANCE_RATE[collateral_class] )
      # Variant LIQUIDATION_BASIS (per appraisal):
      liquidation_basis_value_cents = floor_cents( orderly_liquidation_value_cents * LIQUIDATION_HAIRCUT * ADVANCE_RATE[collateral_class] )
      # Aggregates (recomputed on every acceptance):
      total_eligible_collateral_cents    = sum(eligible_value_cents over ACCEPTED appraisals)
      total_liquidation_collateral_cents = sum(liquidation_basis_value_cents over ACCEPTED appraisals)
    constants:
      ADVANCE_RATE: { REAL_ESTATE: 0.75, EQUIPMENT: 0.80, RECEIVABLES: 0.50, INVENTORY: 0.50, AGRICULTURAL: 0.70 }
      LIQUIDATION_HAIRCUT: 0.85
    precision: "integer cents, floor"
    variants:
      - name: LENDING_BASIS
        when: "standard policy basis for LTV_MAXIMUM and COLLATERAL_COVERAGE_MIN tests and coverage_points"
        difference: "appraised market value x advance rate"
      - name: LIQUIDATION_BASIS
        when: "additional floor test applied only when borrower.is_reg_o_insider is true (Reg O)"
        difference: "orderly liquidation value x 0.85 haircut x advance rate — strictly lower than LENDING_BASIS for identical inputs"

  - name: origination_fee
    trigger: "POST /credit/term-sheets (compute on offered amount_cents)"
    algorithm: tiered_pricing
    description: "Tiered fee on the offered amount; rounding pinned defensively (per-slice round_half_up, then sum in tier order) so downstream fee allocation has a single canonical total. The rounding-ORDER divergence difficulty lives in calculations.participation_fee_allocation."
    input_set: "term sheet amount_cents"
    formula: |
      tier1_base = min(amount_cents, 100000000)                       # first $1,000,000.00
      tier2_base = min(max(amount_cents - 100000000, 0), 400000000)   # next  $4,000,000.00
      tier3_base = max(amount_cents - 500000000, 0)                   # above $5,000,000.00
      fee = round_half_up_cents(tier1_base * 0.0100)
          + round_half_up_cents(tier2_base * 0.0075)
          + round_half_up_cents(tier3_base * 0.0050)                  # evaluated tier1 -> tier2 -> tier3, each rounded, then summed
    constants:
      TIER1_CAP_CENTS: 100000000
      TIER2_CAP_CENTS: 400000000
      TIER1_BPS: 0.0100
      TIER2_BPS: 0.0075
      TIER3_BPS: 0.0050
    precision: "per-slice round_half_up to cents, then integer sum"

  - name: committee_quorum_rule
    trigger: "POST /credit/committee-decisions (level/quorum stamped at creation); each POST .../votes (closure evaluation)"
    algorithm: threshold
    description: "Approval hierarchy by deal size with policy bump; quorum and decline thresholds derive from level."
    input_set: "application.proposed_amount_cents, borrower.is_reg_o_insider, existence of any PolicyException severity=HIGH with status IN {OPEN, WAIVED} for the application"
    formula: |
      base_level: proposed_amount_cents <= 100000000 -> SMALL        # $1,000,000.00 exactly stays SMALL (inclusive)
                  | <= 1000000000 -> STANDARD                        # $10,000,000.00 exactly stays STANDARD
                  | else LARGE
      bump: if borrower.is_reg_o_insider OR any HIGH exception with status IN {OPEN, WAIVED}: level = one tier up (SMALL->STANDARD, STANDARD->LARGE, LARGE->LARGE)
      level_required: SMALL | STANDARD | LARGE
      (size, votes_required, decline_threshold): SMALL (2, 2, 1) | STANDARD (3, 2, 2) | LARGE (5, 4, 2)
      closure after each vote, APPROVE rule first:
        APPROVED when votes_for >= votes_required AND (level != LARGE OR chair_approved)
        DECLINED when votes_against >= decline_threshold
        REMANDED immediately on a chair REMAND vote
    constants:
      TIER_SMALL_CAP_CENTS: 100000000
      TIER_STANDARD_CAP_CENTS: 1000000000
    precision: "integer cents comparisons, inclusive upper bounds"

  - name: participation_hold_reconciliation
    trigger: "POST /credit/participations; POST .../participations/{id}/commit|release; expiry cascade; funding release"
    algorithm: aggregation
    description: "Hold-level derived field with conservation invariant."
    input_set: "CommitmentLetter (latest non-DRAFT) committed_amount_cents; all Participations of the application"
    formula: |
      allocated = sum(allocated_amount_cents over Participations with status IN {PROPOSED, COMMITTED, FUNDED})
      bank_hold_amount_cents = committed_amount_cents - allocated       # 0 when no letter exists
      INVARIANT: committed_amount_cents == bank_hold_amount_cents + allocated   (create/commit/release/fund round-trips conserve it)
    precision: "integer cents"

  - name: participation_fee_allocation
    trigger: "POST /credit/participations/{id}/commit (compute share); POST /credit/participations/{id}/release (return share to bank hold); funding release (shares persist on FUNDED)"
    algorithm: tiered_pricing
    description: "Nested-rounding allocation (mode b): each participation's fee share is rounded half-up to cents INDIVIDUALLY at commit time, in participation created_at ASC order; the bank hold share is the unrounded-remainder absorber. The alternative 'round the bank's pro-rata share too' produces different cents and is NOT used."
    input_set: "CommitmentLetter.origination_fee_cents; participations with status IN {COMMITTED, FUNDED} ordered by created_at ASC"
    formula: |
      for each participation p in (COMMITTED|FUNDED, ordered created_at ASC):
        p.fee_share_cents = round_half_up_cents( letter.origination_fee_cents * p.allocated_amount_cents / letter.committed_amount_cents )
      bank_hold_fee_cents = letter.origination_fee_cents - sum(p.fee_share_cents)
      INVARIANT: sum(fee_share_cents over COMMITTED|FUNDED) + bank_hold_fee_cents == origination_fee_cents (release returns the share to the bank hold)
    precision: "per-share round_half_up to cents; bank remainder unrounded (exact integer difference)"

  - name: exposure_ledger
    trigger: "letter accept / funding release / letter TERMINATED / application withdraw after acceptance"
    algorithm: aggregation
    description: "Borrower exposure rollup with compensating-action conservation across the accept->fund lifecycle."
    input_set: "all CommitmentLetters and FundingAuthorizations over all of the borrower's applications"
    formula: |
      committed_exposure_cents = sum over applications with letter status IN {ACCEPTED, FUNDED}
                                 of ( letter.committed_amount_cents - application.funded_amount_cents )
      funded_exposure_cents    = sum(amount_cents over FundingAuthorizations with status == RELEASED)
      total_exposure_cents     = committed_exposure_cents + funded_exposure_cents
      INVARIANT: a funding release of amount A changes committed_exposure by -A and funded_exposure by +A,
                 leaving total_exposure_cents unchanged; letter accept (+X committed) paired with full
                 termination/withdrawal of an unfunded letter (-X committed) also conserves.
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role value recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this operation (endpoint roles list; to=WAIVED restricted to CreditPolicyOfficer; REMAND restricted to CommitteeChair)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: business_constraint
    check: "Request body schema: required fields present, types valid, enum members valid, numeric ranges valid (amounts > 0, term 12..360, dates parseable, engagement_end_date >= engagement_start_date, session ends_at > starts_at, waiver_rationale >= 20 chars where required, rate_lock_expires_at <= expiry_date end-of-day)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a body"
  - priority: 5
    category: state
    check: "OCC: expected_loan_application_version == LoanApplication.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /credit/term-sheets, POST /credit/committee-decisions"
    note: "schema validation (priority 4) runs before this; OCC runs before all remaining state/business checks"
  - priority: 6
    category: state
    check: "Entity in a legal from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 7
    category: state
    check: "Parent LoanApplication in a mutable stage for child edits: statement create/spread/finalize and PATCH application require app status IN {INTAKE|SPREADING|EXCEPTION_REVIEW} per endpoint"
    error_id: ERR_AMEND_NOT_PERMITTED
    http_status: 409
    applies_to: "PATCH /credit/loan-applications/{id}, POST /credit/financial-statements, POST .../spread, POST .../finalize"
  - priority: 8
    category: state
    check: "Commitment letter presence/state: participation create/commit require letter ISSUED|ACCEPTED|FUNDED; funding release requires letter ACCEPTED|FUNDED"
    error_id: ERR_COMMITMENT_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /credit/participations, POST .../participations/{id}/commit, POST .../funding-authorizations/{id}/release"
  - priority: 9
    category: business_safety
    check: "Segregation of duties: finalize-spreads officer != originating_officer_id"
    error_id: ERR_SOD_SPREAD_FINALIZE_BY_ORIGINATOR
    http_status: 403
    applies_to: "POST .../loan-applications/{id}/finalize-spreads"
  - priority: 10
    category: business_safety
    check: "Segregation of duties: voting officer != application originating_officer_id (recusal)"
    error_id: ERR_SOD_COMMITTEE_RECUSAL
    http_status: 403
    applies_to: "POST /credit/committee-decisions/{id}/votes"
  - priority: 11
    category: business_safety
    check: "Segregation of duties: funding authorizer != requested_by_officer_id"
    error_id: ERR_SOD_FUNDING_SELF_AUTHORIZE
    http_status: 403
    applies_to: "POST /credit/funding-authorizations/{id}/authorize"
  - priority: 12
    category: business_safety
    check: "No PolicyException with status OPEN and severity HIGH may exist at funding release"
    error_id: ERR_UNRESOLVED_POLICY_EXCEPTION
    http_status: 403
    applies_to: "POST /credit/funding-authorizations/{id}/release"
  - priority: 13
    category: business_constraint
    check: "Borrower status == ACTIVE when creating an application"
    error_id: ERR_BORROWER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /credit/loan-applications"
  - priority: 14
    category: business_constraint
    check: ">= 1 statement at submit; all statements FINAL|SUPERSEDED with >= 1 FINAL at finalize-spreads"
    error_id: ERR_STATEMENTS_NOT_FINAL
    http_status: 409
    applies_to: "POST .../submit, POST .../finalize-spreads"
  - priority: 15
    category: business_constraint
    check: "No OPEN PolicyException when clearing exceptions"
    error_id: ERR_OPEN_POLICY_EXCEPTIONS
    http_status: 409
    applies_to: "POST .../clear-exceptions"
  - priority: 16
    category: business_constraint
    check: ">= 1 ACCEPTED appraisal at submit-to-committee"
    error_id: ERR_NO_ACCEPTED_APPRAISAL
    http_status: 409
    applies_to: "POST .../submit-to-committee"
  - priority: 17
    category: business_constraint
    check: "No appraisal still ENGAGED or REPORT_RECEIVED at submit-to-committee"
    error_id: ERR_APPRAISALS_NOT_SETTLED
    http_status: 409
    applies_to: "POST .../submit-to-committee"
  - priority: 18
    category: business_constraint
    check: "Appraiser status == ELIGIBLE when ordering"
    error_id: ERR_APPRAISER_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /credit/appraisals"
  - priority: 19
    category: business_constraint
    check: "Appraiser engagement overlap: CLOSED intervals [start, end] (adjacent end==start IS a conflict); count of the appraiser's appraisals with status IN {ENGAGED, REPORT_RECEIVED} intersecting the new window must be < max_concurrent_engagements"
    error_id: ERR_APPRAISER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /credit/appraisals"
  - priority: 20
    category: business_constraint
    check: "CommitteeSession overlap: HALF-OPEN intervals [starts_at, ends_at); a new SCHEDULED session conflicts iff existing.starts_at < new.ends_at AND new.starts_at < existing.ends_at; back-to-back (new.starts_at == existing.ends_at) is allowed"
    error_id: ERR_COMMITTEE_SESSION_CONFLICT
    http_status: 409
    applies_to: "POST /credit/committee-sessions"
  - priority: 21
    category: business_constraint
    check: "At most one OPEN CommitteeDecision per application"
    error_id: ERR_DECISION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /credit/committee-decisions"
  - priority: 22
    category: business_constraint
    check: "Voting officer has not already voted on this decision"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /credit/committee-decisions/{id}/votes"
  - priority: 23
    category: business_constraint
    check: "REMAND vote may only be cast by CommitteeChair"
    error_id: ERR_ONLY_CHAIR_MAY_REMAND
    http_status: 403
    applies_to: "POST /credit/committee-decisions/{id}/votes"
  - priority: 24
    category: business_constraint
    check: "Session level == computed level_required for the application"
    error_id: ERR_SESSION_LEVEL_MISMATCH
    http_status: 422
    applies_to: "POST /credit/committee-decisions"
  - priority: 25
    category: business_constraint
    check: "All required DOCUMENT-category items APPROVED|WAIVED at submit-for-closing; all required CLOSING_CONDITION-category items APPROVED|WAIVED at funding release"
    error_id: ERR_CHECKLIST_INCOMPLETE
    http_status: 409
    applies_to: "POST .../submit-for-closing, POST .../funding-authorizations/{id}/release"
  - priority: 26
    category: business_constraint
    check: "CRITICAL severity items may not be waived"
    error_id: ERR_CONDITION_NOT_WAIVABLE
    http_status: 422
    applies_to: "POST /credit/document-checklist-items/{id}/transition (to=WAIVED)"
  - priority: 27
    category: business_constraint
    check: ">= 1 Covenant exists before submit-for-closing"
    error_id: ERR_NO_COVENANTS_CONFIGURED
    http_status: 409
    applies_to: "POST .../submit-for-closing"
  - priority: 28
    category: business_temporal
    check: "Vote cast while logical clock in [session.starts_at, session.ends_at) AND session SCHEDULED"
    error_id: ERR_COMMITTEE_SESSION_NOT_OPEN
    http_status: 409
    applies_to: "POST /credit/committee-decisions/{id}/votes"
  - priority: 29
    category: business_temporal
    check: "Letter accept requires clock date < expiry_date"
    error_id: ERR_COMMITMENT_EXPIRED
    http_status: 409
    applies_to: "POST /credit/commitment-letters/{id}/accept"
  - priority: 30
    category: business_temporal
    check: "Funding release requires logical clock <= letter.rate_lock_expires_at"
    error_id: ERR_RATE_LOCK_EXPIRED
    http_status: 409
    applies_to: "POST /credit/funding-authorizations/{id}/release"
  - priority: 31
    category: business_referential
    check: "restatement_of_id: references an existing statement of the SAME application with status FINAL and identical period_end_date; a statement may not restate itself"
    error_id: ERR_RESTATEMENT_TARGET_INVALID
    http_status: 422
    applies_to: "POST /credit/financial-statements"
  - priority: 32
    category: business_fiscal
    check: "borrower.total_exposure_cents + requested_amount_cents <= 5000000000 at application creation"
    error_id: ERR_SINGLE_BORROWER_LIMIT
    http_status: 402
    applies_to: "POST /credit/loan-applications"
  - priority: 33
    category: business_fiscal
    check: "allocated_amount_cents <= current unallocated headroom (bank_hold_amount_cents) — exact equality allowed"
    error_id: ERR_PARTICIPATION_OVERALLOCATION
    http_status: 422
    applies_to: "POST /credit/participations"
  - priority: 34
    category: business_fiscal
    check: "application.funded_amount_cents + amount_cents <= letter.committed_amount_cents at release"
    error_id: ERR_FUNDING_OVER_COMMITMENT
    http_status: 422
    applies_to: "POST /credit/funding-authorizations/{id}/release"
  - priority: 35
    category: business_fiscal
    check: "Sizing result > 0 at submit-to-committee (maximum_sizing steps 1 and 4)"
    error_id: ERR_NO_SIZEABLE_AMOUNT
    http_status: 422
    applies_to: "POST .../submit-to-committee"

# =============================================================================
# §1.5 API Endpoint Table
# (All GET endpoints allow every authenticated role; writes are role-restricted
#  per §1.7. List GETs support limit/offset pagination per §1.0.)
# =============================================================================
endpoints:
  # --- BankOfficers ---
  - method: POST
    path: "/credit/bank-officers"
    description: "Register a bank officer (identity anchor for entity_backed roles)"
    roles: [BankAdmin]
    code: 201
    input: [full_name]
    output: BankOfficer
    side_effects: []
  - method: GET
    path: "/credit/bank-officers/{id}"
    description: "Get one officer"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: BankOfficer
    side_effects: []
  - method: GET
    path: "/credit/bank-officers/{id}/policy-exceptions"
    description: "List policy exceptions waived by an officer (FK reverse reachability: PolicyException.waived_by_officer_id)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "PolicyException[]"
    side_effects: []
  - method: GET
    path: "/credit/bank-officers/{id}/document-checklist-items"
    description: "List checklist items waived by an officer (FK reverse reachability: DocumentChecklistItem.waived_by_officer_id)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "DocumentChecklistItem[]"
    side_effects: []
  - method: GET
    path: "/credit/bank-officers/{id}/funding-authorizations"
    description: "List funding authorizations requested or authorized by an officer (FK reverse reachability: FundingAuthorization.requested_by_officer_id / authorized_by_officer_id)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "FundingAuthorization[]"
    side_effects: []

  # --- Borrowers ---
  - method: POST
    path: "/credit/borrowers"
    description: "Create a borrower"
    roles: [RelationshipManager]
    code: 201
    input: [legal_name, naics_code, relationship_since, "is_reg_o_insider?"]
    output: Borrower
    side_effects: ["status = ACTIVE; exposure counters initialized to 0"]
  - method: GET
    path: "/credit/borrowers"
    description: "List borrowers (filter: status?)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: ["status?"]
    output: "Borrower[]"
    side_effects: []
  - method: GET
    path: "/credit/borrowers/{id}"
    description: "Get one borrower (includes computed exposure fields)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: Borrower
    side_effects: []
  - method: GET
    path: "/credit/borrowers/{id}/loan-applications"
    description: "List applications of a borrower (FK reverse reachability: LoanApplication.borrower_id)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "LoanApplication[]"
    side_effects: []
  - method: PATCH
    path: "/credit/borrowers/{id}"
    description: "Update borrower attributes; status may be manually set ACTIVE <-> EXITED only (SUSPENDED is system-driven by covenant breach)"
    roles: [RelationshipManager]
    code: 200
    input: ["legal_name?", "naics_code?", "relationship_since?", "is_reg_o_insider?", "status?"]
    output: Borrower
    side_effects: ["status input restricted to ACTIVE|EXITED (ERR_VALIDATION on SUSPENDED)"]

  # --- Loan Applications ---
  - method: POST
    path: "/credit/loan-applications"
    description: "Create a loan application in INTAKE"
    roles: [RelationshipManager]
    code: 201
    input: [borrower_id, product_type, requested_amount_cents, term_months, "purpose?"]
    output: LoanApplication
    side_effects:
      - "status = INTAKE; originating_officer_id := X-User-ID"
      - "validations: borrower ACTIVE (ERR_BORROWER_NOT_ACTIVE); single-borrower cap (ERR_SINGLE_BORROWER_LIMIT)"
  - method: GET
    path: "/credit/loan-applications"
    description: "List applications (filters: borrower_id?, status?, originating_officer_id?)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: ["borrower_id?", "status?", "originating_officer_id?"]
    output: "LoanApplication[]"
    side_effects: []
  - method: GET
    path: "/credit/loan-applications/{id}"
    description: "Get one application (all computed underwriting fields)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: LoanApplication
    side_effects: []
  - method: PATCH
    path: "/credit/loan-applications/{id}"
    description: "Amend request terms while INTAKE/SPREADING/EXCEPTION_REVIEW; in EXCEPTION_REVIEW re-runs DSCR and exception refresh"
    roles: [RelationshipManager]
    code: 200
    input: ["requested_amount_cents?", "term_months?", "purpose?"]
    output: LoanApplication
    side_effects:
      - "ERR_AMEND_NOT_PERMITTED unless status IN {INTAKE, SPREADING, EXCEPTION_REVIEW}"
      - "in EXCEPTION_REVIEW: recompute dscr_standard/dscr_stress; OPEN auto exceptions whose condition no longer holds -> RESOLVED_BY_CHANGE; newly triggered conditions create exceptions; WAIVED exceptions untouched"
  - method: POST
    path: "/credit/loan-applications/{id}/submit"
    description: "INTAKE -> SPREADING"
    roles: [RelationshipManager]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["requires >= 1 statement (ERR_STATEMENTS_NOT_FINAL)"]
  - method: POST
    path: "/credit/loan-applications/{id}/finalize-spreads"
    description: "SPREADING -> EXCEPTION_REVIEW | APPRAISAL_REVIEW (branch on OPEN exceptions); computes dual-variant DSCR + provisional rating + auto exceptions"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "dscr_standard, dscr_stress, risk_rating (PROVISIONAL) computed"
      - "PolicyExceptions auto-created per rules (DSCR_MINIMUM / STRESS_DSCR_MINIMUM / SINGLE_BORROWER_LIMIT / REG_O_INSIDER)"
      - "SoD: X-User-ID != originating_officer_id"
      - "increments LoanApplication.version by 1"
  - method: POST
    path: "/credit/loan-applications/{id}/clear-exceptions"
    description: "EXCEPTION_REVIEW -> APPRAISAL_REVIEW"
    roles: [CreditPolicyOfficer]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["requires zero OPEN exceptions (ERR_OPEN_POLICY_EXCEPTIONS)"]
  - method: POST
    path: "/credit/loan-applications/{id}/submit-to-committee"
    description: "APPRAISAL_REVIEW -> COMMITTEE_REVIEW; collateral aggregation, sizing (pinned order), LTV/coverage exceptions, FULL rating"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "collateral aggregates recomputed over ACCEPTED appraisals"
      - "proposed_amount_cents computed (calculations.maximum_sizing)"
      - "LTV_MAXIMUM / COLLATERAL_COVERAGE_MIN exceptions auto-created (liquidation-basis test added for Reg O insider)"
      - "risk_rating recomputed FULL basis"
      - "increments LoanApplication.version by 1"
  - method: POST
    path: "/credit/loan-applications/{id}/submit-for-closing"
    description: "DOCUMENTATION -> CLOSING"
    roles: [CreditAdministrator]
    code: 200
    input: []
    output: LoanApplication
    side_effects: ["requires required DOCUMENT items APPROVED|WAIVED (ERR_CHECKLIST_INCOMPLETE) and >= 1 covenant (ERR_NO_COVENANTS_CONFIGURED)"]
  - method: POST
    path: "/credit/loan-applications/{id}/withdraw"
    description: "Any non-terminal state -> WITHDRAWN with compensation cascades"
    roles: [RelationshipManager]
    code: 200
    input: []
    output: LoanApplication
    side_effects:
      - "ACCEPTED letter -> TERMINATED and borrower.committed_exposure_cents decremented"
      - "Appraisals ENGAGED|REPORT_RECEIVED -> CANCELLED; Participations PROPOSED|COMMITTED -> RELEASED; ISSUED TermSheets -> SUPERSEDED; FundingAuthorizations REQUESTED|AUTHORIZED -> CANCELLED"

  # --- Financial Statements ---
  - method: POST
    path: "/credit/financial-statements"
    description: "Attach a statement (optionally a restatement) to an application"
    roles: [CreditAnalyst]
    code: 201
    input: [loan_application_id, period_end_date, revenue_cents, ebitda_cents, addbacks_cents, distributions_cents, maintenance_capex_cents, existing_annual_debt_service_cents, total_assets_cents, total_liabilities_cents, "restatement_of_id?"]
    output: FinancialStatement
    side_effects: ["status = SUBMITTED; app must be INTAKE|SPREADING|EXCEPTION_REVIEW (ERR_AMEND_NOT_PERMITTED); restatement target validation (ERR_RESTATEMENT_TARGET_INVALID)"]
  - method: GET
    path: "/credit/financial-statements"
    description: "List statements (filters: loan_application_id?, restatement_of_id?, spread_by_officer_id?, finalized_by_officer_id?) — FK reverse reachability for all FKs"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: ["loan_application_id?", "restatement_of_id?", "spread_by_officer_id?", "finalized_by_officer_id?"]
    output: "FinancialStatement[]"
    side_effects: []
  - method: GET
    path: "/credit/financial-statements/{id}"
    description: "Get one statement"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: FinancialStatement
    side_effects: []
  - method: POST
    path: "/credit/financial-statements/{id}/spread"
    description: "SUBMITTED -> SPREAD"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: FinancialStatement
    side_effects: ["spread_by_officer_id := X-User-ID"]
  - method: POST
    path: "/credit/financial-statements/{id}/finalize"
    description: "SPREAD -> FINAL; supersedes restatement target; re-runs underwriting when app in EXCEPTION_REVIEW"
    roles: [CreditAnalyst]
    code: 200
    input: []
    output: FinancialStatement
    side_effects:
      - "finalized_by_officer_id := X-User-ID"
      - "restatement target FINAL -> SUPERSEDED"
      - "if app EXCEPTION_REVIEW: recompute DSCR + refresh auto exceptions (OPEN -> RESOLVED_BY_CHANGE when cured; create newly triggered; WAIVED untouched)"

  # --- Policy Exceptions ---
  - method: GET
    path: "/credit/loan-applications/{id}/policy-exceptions"
    description: "List exceptions of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: ["status?", "rule_code?"]
    output: "PolicyException[]"
    side_effects: []
  - method: POST
    path: "/credit/policy-exceptions/{id}/waive"
    description: "OPEN -> WAIVED with rationale"
    roles: [CreditPolicyOfficer]
    code: 200
    input: [waiver_rationale]
    output: PolicyException
    side_effects: ["waived_by_officer_id := X-User-ID; status WAIVED"]

  # --- Appraisers / Appraisals ---
  - method: POST
    path: "/credit/appraisers"
    description: "Register an appraiser"
    roles: [AppraisalManager]
    code: 201
    input: [name, license_number, "max_concurrent_engagements?"]
    output: Appraiser
    side_effects: ["status = ELIGIBLE"]
  - method: GET
    path: "/credit/appraisers/{id}"
    description: "Get one appraiser"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: Appraiser
    side_effects: []
  - method: PATCH
    path: "/credit/appraisers/{id}"
    description: "Update appraiser; status ELIGIBLE <-> SUSPENDED (suspension blocks new engagement orders)"
    roles: [AppraisalManager]
    code: 200
    input: ["name?", "status?"]
    output: Appraiser
    side_effects: []
  - method: POST
    path: "/credit/appraisals"
    description: "Order an appraisal engagement (closed-interval, aggregate-capacity overlap rule)"
    roles: [AppraisalManager]
    code: 201
    input: [loan_application_id, appraiser_id, collateral_class, engagement_start_date, engagement_end_date]
    output: Appraisal
    side_effects:
      - "status = ENGAGED"
      - "app must be APPRAISAL_REVIEW, EXCEPTION_REVIEW, or COMMITTEE_REVIEW (committee may order additional collateral opinions mid-review) (ERR_INVALID_STATE)"
      - "appraiser ELIGIBLE (ERR_APPRAISER_NOT_ELIGIBLE); overlap capacity (ERR_APPRAISER_WINDOW_CONFLICT)"
  - method: GET
    path: "/credit/loan-applications/{id}/appraisals"
    description: "List appraisals of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "Appraisal[]"
    side_effects: []
  - method: GET
    path: "/credit/appraisers/{id}/appraisals"
    description: "List appraisals of an appraiser (FK reverse reachability: Appraisal.appraiser_id)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "Appraisal[]"
    side_effects: []
  - method: POST
    path: "/credit/appraisals/{id}/receive-report"
    description: "ENGAGED -> REPORT_RECEIVED with value conclusions"
    roles: [AppraisalManager]
    code: 200
    input: [appraised_value_cents, orderly_liquidation_value_cents]
    output: Appraisal
    side_effects: []
  - method: POST
    path: "/credit/appraisals/{id}/review"
    description: "REPORT_RECEIVED -> ACCEPTED | REJECTED; acceptance computes dual-basis eligible values and re-aggregates collateral"
    roles: [AppraisalManager]
    code: 200
    input: [outcome]
    output: Appraisal
    side_effects:
      - "outcome=ACCEPTED: eligible_value_cents + liquidation_basis_value_cents computed; application collateral aggregates recomputed"
      - "outcome=REJECTED: engagement window freed (reorder loop enabled)"

  # --- Committee Sessions / Decisions / Votes ---
  - method: POST
    path: "/credit/committee-sessions"
    description: "Schedule a committee session (half-open interval, capacity 1, adjacency allowed)"
    roles: [CommitteeChair]
    code: 201
    input: [level, starts_at, ends_at]
    output: CommitteeSession
    side_effects: ["overlap -> ERR_COMMITTEE_SESSION_CONFLICT"]
  - method: GET
    path: "/credit/committee-sessions/{id}"
    description: "Get one session"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: CommitteeSession
    side_effects: []
  - method: GET
    path: "/credit/committee-sessions/{id}/committee-decisions"
    description: "List decisions taken in a session (FK reverse reachability: CommitteeDecision.committee_session_id)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "CommitteeDecision[]"
    side_effects: []
  - method: POST
    path: "/credit/committee-decisions"
    description: "Open a committee decision (OCC-guarded); stamps level_required/votes_required"
    roles: [CommitteeChair]
    code: 201
    input: [loan_application_id, committee_session_id, expected_loan_application_version]
    output: CommitteeDecision
    side_effects:
      - "OCC check expected_loan_application_version == application.version (ERR_STALE_VERSION)"
      - "app must be COMMITTEE_REVIEW (ERR_INVALID_STATE); no other OPEN decision (ERR_DECISION_ALREADY_OPEN); session level match (ERR_SESSION_LEVEL_MISMATCH)"
      - "increments LoanApplication.version by 1"
  - method: GET
    path: "/credit/loan-applications/{id}/committee-decisions"
    description: "List decisions of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "CommitteeDecision[]"
    side_effects: []
  - method: POST
    path: "/credit/committee-decisions/{id}/votes"
    description: "Cast a vote; auto-closes decision on quorum/decline thresholds; REMAND is chair-only"
    roles: [CommitteeMember, CommitteeChair]
    code: 201
    input: [vote]
    output: CommitteeDecision
    side_effects:
      - "vote appended; votes_for/votes_against/chair_approved recomputed"
      - "closure: APPROVED -> application TERM_SHEET_NEGOTIATION; DECLINED -> application DECLINED + appraisal cancellation cascade; chair REMAND -> REMANDED + application EXCEPTION_REVIEW"
      - "checks: session window (ERR_COMMITTEE_SESSION_NOT_OPEN), recusal (ERR_SOD_COMMITTEE_RECUSAL), duplicate (ERR_DUPLICATE_VOTE), chair-only REMAND (ERR_ONLY_CHAIR_MAY_REMAND)"

  # --- Term Sheets ---
  - method: POST
    path: "/credit/term-sheets"
    description: "Issue a term sheet (OCC-guarded); supersedes prior ISSUED sheet; computes tiered origination fee"
    roles: [RelationshipManager]
    code: 201
    input: [loan_application_id, amount_cents, rate_bps, term_months, expires_at, expected_loan_application_version]
    output: TermSheet
    side_effects:
      - "OCC check (ERR_STALE_VERSION); app must be TERM_SHEET_NEGOTIATION (ERR_INVALID_STATE); amount must equal proposed_amount_cents (ERR_VALIDATION)"
      - "prior ISSUED sheet -> SUPERSEDED; origination_fee_cents computed (per-slice rounding then sum)"
      - "increments LoanApplication.version by 1"
  - method: GET
    path: "/credit/loan-applications/{id}/term-sheets"
    description: "List term sheets of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "TermSheet[]"
    side_effects: []
  - method: POST
    path: "/credit/term-sheets/{id}/respond"
    description: "Record borrower response: ACCEPTED (creates DRAFT commitment letter, app -> COMMITMENT) | DECLINED"
    roles: [RelationshipManager]
    code: 200
    input: [outcome]
    output: TermSheet
    side_effects: ["on ACCEPTED: application -> COMMITMENT; CommitmentLetter DRAFT created mirroring terms"]

  # --- Commitment Letters ---
  - method: GET
    path: "/credit/commitment-letters"
    description: "List commitment letters (filter: loan_application_id?) — FK reverse reachability"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: ["loan_application_id?"]
    output: "CommitmentLetter[]"
    side_effects: []
  - method: GET
    path: "/credit/commitment-letters/{id}"
    description: "Get one commitment letter"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: CommitmentLetter
    side_effects: []
  - method: POST
    path: "/credit/commitment-letters/{id}/issue"
    description: "DRAFT -> ISSUED; sets expiry and rate-lock window"
    roles: [CreditAdministrator]
    code: 200
    input: [expiry_date, rate_lock_expires_at]
    output: CommitmentLetter
    side_effects: ["rate_lock_expires_at <= expiry_date end-of-day (ERR_VALIDATION)"]
  - method: POST
    path: "/credit/commitment-letters/{id}/accept"
    description: "ISSUED -> ACCEPTED; application -> DOCUMENTATION; borrower committed exposure incremented"
    roles: [CreditAdministrator]
    code: 200
    input: []
    output: CommitmentLetter
    side_effects: ["clock date < expiry_date (ERR_COMMITMENT_EXPIRED); borrower.committed_exposure_cents += committed_amount_cents"]

  # --- Document Checklist Items (documents + closing conditions share this lifecycle) ---
  - method: POST
    path: "/credit/document-checklist-items"
    description: "Add a checklist item (category DOCUMENT gates closing; CLOSING_CONDITION gates funding)"
    roles: [CreditAdministrator]
    code: 201
    input: [loan_application_id, category, label, "is_required?", "severity?"]
    output: DocumentChecklistItem
    side_effects: ["app status must be COMMITMENT|DOCUMENTATION|CLOSING (ERR_INVALID_STATE); status = PENDING"]
  - method: GET
    path: "/credit/loan-applications/{id}/document-checklist-items"
    description: "List checklist items of an application (FK reverse reachability; filter: category?, status?)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: ["category?", "status?"]
    output: "DocumentChecklistItem[]"
    side_effects: []
  - method: POST
    path: "/credit/document-checklist-items/{id}/transition"
    description: "Move item through PENDING -> RECEIVED -> APPROVED/REJECTED (-> PENDING resubmit) or WAIVED (policy officer only)"
    roles: [CreditAdministrator, CreditPolicyOfficer]
    code: 200
    input: [to, "waiver_rationale?"]
    output: DocumentChecklistItem
    side_effects:
      - "to=WAIVED requires role CreditPolicyOfficer (ERR_ONLY_POLICY_OFFICER_MAY_WAIVE) and severity != CRITICAL (ERR_CONDITION_NOT_WAIVABLE) and waiver_rationale >= 20 chars"
      - "waiving a required item auto-creates PolicyException REQUIRED_DOC_WAIVER (LOW) if none OPEN for this item"

  # --- Funding Authorizations ---
  - method: POST
    path: "/credit/funding-authorizations"
    description: "Request a funding tranche (app CLOSING or FUNDED)"
    roles: [CreditAdministrator]
    code: 201
    input: [loan_application_id, amount_cents, disbursement_date]
    output: FundingAuthorization
    side_effects: ["app status IN {CLOSING, FUNDED} (ERR_INVALID_STATE); requested_by_officer_id := X-User-ID; status = REQUESTED"]
  - method: GET
    path: "/credit/loan-applications/{id}/funding-authorizations"
    description: "List funding authorizations of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "FundingAuthorization[]"
    side_effects: []
  - method: POST
    path: "/credit/funding-authorizations/{id}/authorize"
    description: "REQUESTED -> AUTHORIZED; authorizer must differ from requester (SoD)"
    roles: [CreditPolicyOfficer]
    code: 200
    input: []
    output: FundingAuthorization
    side_effects: ["ERR_SOD_FUNDING_SELF_AUTHORIZE if X-User-ID == requested_by_officer_id"]
  - method: POST
    path: "/credit/funding-authorizations/{id}/release"
    description: "AUTHORIZED -> RELEASED; first release funds the loan (letter FUNDED, app FUNDED, participations FUNDED, exposure compensating pair)"
    roles: [CreditAdministrator]
    code: 200
    input: []
    output: FundingAuthorization
    side_effects:
      - "checks in priority order: state -> OPEN HIGH exceptions (ERR_UNRESOLVED_POLICY_EXCEPTION) -> closing conditions (ERR_CHECKLIST_INCOMPLETE) -> rate lock (ERR_RATE_LOCK_EXPIRED) -> letter state (ERR_COMMITMENT_NOT_ACCEPTED) -> cumulative cap (ERR_FUNDING_OVER_COMMITMENT)"
      - "borrower.funded_exposure_cents += amount; app.funded_amount_cents += amount"
      - "first release: letter ACCEPTED -> FUNDED (committed -= committed_amount), app -> FUNDED, COMMITTED participations -> FUNDED"

  # --- Covenants ---
  - method: POST
    path: "/credit/covenants"
    description: "Set up a monitoring covenant (app DOCUMENTATION|CLOSING|FUNDED)"
    roles: [CreditAdministrator]
    code: 201
    input: [loan_application_id, covenant_type, threshold_value, frequency]
    output: Covenant
    side_effects: ["status = MONITORING"]
  - method: GET
    path: "/credit/loan-applications/{id}/covenants"
    description: "List covenants of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "Covenant[]"
    side_effects: []
  - method: POST
    path: "/credit/covenants/{id}/review"
    description: "Record a compliance measurement; pass -> COMPLIANT (or CURED from BREACH_PENDING); fail -> BREACH_PENDING with exception + borrower suspension cascade"
    roles: [CreditAnalyst]
    code: 200
    input: [measured_value, period_end_date]
    output: Covenant
    side_effects:
      - "pass rule: DSCR_MIN passes when measured_value >= threshold_value; LEVERAGE_MAX/CAPEX_LIMIT/DISTRIBUTION_BLOCK pass when measured_value <= threshold_value"
      - "breach: auto-create COVENANT_BREACH exception (HIGH) + borrower -> SUSPENDED"
      - "cure: linked exception -> RESOLVED_BY_CHANGE; borrower -> ACTIVE if no other BREACH_PENDING covenant"
  - method: POST
    path: "/credit/covenants/{id}/waive-breach"
    description: "BREACH_PENDING -> WAIVED with rationale; waives linked exception; reactivates borrower if clear"
    roles: [CreditPolicyOfficer]
    code: 200
    input: [waiver_rationale]
    output: Covenant
    side_effects: ["linked COVENANT_BREACH exception -> WAIVED; borrower -> ACTIVE if no other BREACH_PENDING covenant"]

  # --- Participations ---
  - method: POST
    path: "/credit/participations"
    description: "Propose a participation sale against the commitment (hold-level decision)"
    roles: [RelationshipManager]
    code: 201
    input: [loan_application_id, participant_bank_name, allocated_amount_cents]
    output: Participation
    side_effects:
      - "app status IN {COMMITMENT, DOCUMENTATION, CLOSING, FUNDED} and letter ISSUED|ACCEPTED|FUNDED (ERR_COMMITMENT_NOT_ACCEPTED)"
      - "allocated_amount_cents <= bank_hold_amount_cents headroom (ERR_PARTICIPATION_OVERALLOCATION); equality allowed"
      - "bank_hold_amount_cents -= allocated_amount_cents"
  - method: GET
    path: "/credit/loan-applications/{id}/participations"
    description: "List participations of an application (FK reverse reachability)"
    roles: [BankAdmin, RelationshipManager, CreditAnalyst, AppraisalManager, CommitteeChair, CommitteeMember, CreditPolicyOfficer, CreditAdministrator]
    code: 200
    input: []
    output: "Participation[]"
    side_effects: []
  - method: POST
    path: "/credit/participations/{id}/commit"
    description: "PROPOSED -> COMMITTED; computes the participation's fee share (per-share rounding, created_at ASC order)"
    roles: [RelationshipManager]
    code: 200
    input: []
    output: Participation
    side_effects:
      - "letter must be ISSUED|ACCEPTED|FUNDED (ERR_COMMITMENT_NOT_ACCEPTED)"
      - "fee_share_cents := round_half_up(letter.origination_fee_cents * allocated / committed_amount); bank_hold_fee_cents recomputed as remainder"
  - method: POST
    path: "/credit/participations/{id}/release"
    description: "PROPOSED|COMMITTED -> RELEASED; allocation and fee share return to bank hold (compensating invariant)"
    roles: [RelationshipManager]
    code: 200
    input: []
    output: Participation
    side_effects: ["bank_hold_amount_cents += allocated_amount_cents; bank_hold_fee_cents += fee_share_cents (if COMMITTED); fee_share_cents cleared"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/credit/_clock/set_current_utc"
    description: "Set the logical clock (ISO8601). Server startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Sweeps on set: ISSUED CommitmentLetters with expiry_date <= clock date -> EXPIRED (+ application/items/participations cascade); ISSUED TermSheets with expires_at < now -> EXPIRED; CommitteeSessions with ends_at <= now -> ADJOURNED."
    roles: [BankAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["expiry sweep cascade per state machines"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing/unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint/operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum member, range violation, malformed date, short rationale, rate-lock after expiry, term-sheet amount != proposed_amount_cents" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (checked left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_loan_application_version != current LoanApplication.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a legal from-state for the requested transition" }
  - { id: ERR_AMEND_NOT_PERMITTED, http: 409, condition: "Application not in a mutable stage for this child edit (INTAKE|SPREADING|EXCEPTION_REVIEW as applicable)" }
  - { id: ERR_COMMITMENT_NOT_ACCEPTED, http: 409, condition: "Commitment letter absent or not in required state (ISSUED|ACCEPTED|FUNDED for participation ops; ACCEPTED|FUNDED for funding release)" }
  - { id: ERR_COMMITMENT_EXPIRED, http: 409, condition: "Acceptance attempted on/after expiry_date" }
  - { id: ERR_SOD_SPREAD_FINALIZE_BY_ORIGINATOR, http: 403, condition: "finalize-spreads officer == originating_officer_id" }
  - { id: ERR_SOD_COMMITTEE_RECUSAL, http: 403, condition: "Voting officer == application originating_officer_id" }
  - { id: ERR_SOD_FUNDING_SELF_AUTHORIZE, http: 403, condition: "Funding authorizer == requested_by_officer_id" }
  - { id: ERR_UNRESOLVED_POLICY_EXCEPTION, http: 403, condition: "OPEN HIGH-severity PolicyException exists at funding release" }
  - { id: ERR_BORROWER_NOT_ACTIVE, http: 409, condition: "Borrower status != ACTIVE at application creation" }
  - { id: ERR_STATEMENTS_NOT_FINAL, http: 409, condition: "No statement at submit; or statements not all FINAL|SUPERSEDED (>= 1 FINAL) at finalize-spreads" }
  - { id: ERR_OPEN_POLICY_EXCEPTIONS, http: 409, condition: "clear-exceptions attempted while an OPEN exception exists" }
  - { id: ERR_NO_ACCEPTED_APPRAISAL, http: 409, condition: "submit-to-committee with zero ACCEPTED appraisals" }
  - { id: ERR_APPRAISALS_NOT_SETTLED, http: 409, condition: "submit-to-committee with appraisals still ENGAGED or REPORT_RECEIVED" }
  - { id: ERR_APPRAISER_NOT_ELIGIBLE, http: 409, condition: "Appraiser status != ELIGIBLE when ordering" }
  - { id: ERR_APPRAISER_WINDOW_CONFLICT, http: 409, condition: "Closed-interval engagement overlap meets/exceeds appraiser max_concurrent_engagements" }
  - { id: ERR_COMMITTEE_SESSION_CONFLICT, http: 409, condition: "Half-open session window intersects an existing SCHEDULED session" }
  - { id: ERR_COMMITTEE_SESSION_NOT_OPEN, http: 409, condition: "Vote outside [starts_at, ends_at) or session ADJOURNED" }
  - { id: ERR_DECISION_ALREADY_OPEN, http: 409, condition: "An OPEN CommitteeDecision already exists for the application" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Officer already voted on this decision" }
  - { id: ERR_ONLY_CHAIR_MAY_REMAND, http: 403, condition: "REMAND vote cast by non-chair role" }
  - { id: ERR_ONLY_POLICY_OFFICER_MAY_WAIVE, http: 403, condition: "to=WAIVED attempted by non-CreditPolicyOfficer" }
  - { id: ERR_SESSION_LEVEL_MISMATCH, http: 422, condition: "Session level != decision level_required" }
  - { id: ERR_CHECKLIST_INCOMPLETE, http: 409, condition: "Required DOCUMENT items unresolved at submit-for-closing / required CLOSING_CONDITION items unresolved at release" }
  - { id: ERR_CONDITION_NOT_WAIVABLE, http: 422, condition: "Waiver attempted on CRITICAL severity item" }
  - { id: ERR_NO_COVENANTS_CONFIGURED, http: 409, condition: "submit-for-closing with zero covenants" }
  - { id: ERR_RATE_LOCK_EXPIRED, http: 409, condition: "Release attempted after rate_lock_expires_at" }
  - { id: ERR_RESTATEMENT_TARGET_INVALID, http: 422, condition: "Restatement target missing, wrong application, not FINAL, period mismatch, or self-reference" }
  - { id: ERR_SINGLE_BORROWER_LIMIT, http: 402, condition: "total_exposure + requested_amount > $50,000,000.00 cap at creation" }
  - { id: ERR_PARTICIPATION_OVERALLOCATION, http: 422, condition: "allocated_amount_cents exceeds unallocated commitment headroom" }
  - { id: ERR_FUNDING_OVER_COMMITMENT, http: 422, condition: "Cumulative released + this tranche exceeds committed_amount_cents" }
  - { id: ERR_NO_SIZEABLE_AMOUNT, http: 422, condition: "Sizing yields <= 0 at submit-to-committee" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BankAdmin
    description: "Bank platform administrator; manages officer registry and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /credit/bank-officers"
      - "POST /credit/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: RelationshipManager
    description: "Originating officer; owns borrower relationships, applications, term sheets, participations"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /credit/borrowers"
      - "PATCH /credit/borrowers/{id}"
      - "POST /credit/loan-applications"
      - "PATCH /credit/loan-applications/{id}"
      - "POST /credit/loan-applications/{id}/submit"
      - "POST /credit/loan-applications/{id}/withdraw"
      - "POST /credit/term-sheets"
      - "POST /credit/term-sheets/{id}/respond"
      - "POST /credit/participations"
      - "POST /credit/participations/{id}/commit"
      - "POST /credit/participations/{id}/release"
    shared_operations: ["all GET endpoints"]
  - name: CreditAnalyst
    description: "Credit analyst; spreads statements, runs underwriting, routes to committee, reviews covenants"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /credit/financial-statements"
      - "POST /credit/financial-statements/{id}/spread"
      - "POST /credit/financial-statements/{id}/finalize"
      - "POST /credit/loan-applications/{id}/finalize-spreads"
      - "POST /credit/loan-applications/{id}/submit-to-committee"
      - "POST /credit/covenants/{id}/review"
    shared_operations: ["all GET endpoints"]
  - name: AppraisalManager
    description: "Appraisal desk; manages appraisers, orders and reviews appraisals"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /credit/appraisers"
      - "PATCH /credit/appraisers/{id}"
      - "POST /credit/appraisals"
      - "POST /credit/appraisals/{id}/receive-report"
      - "POST /credit/appraisals/{id}/review"
    shared_operations: ["all GET endpoints"]
  - name: CommitteeChair
    description: "Loan committee chair; schedules sessions, opens decisions, may vote and exclusively remand"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /credit/committee-sessions"
      - "POST /credit/committee-decisions"
      - "REMAND vote via POST /credit/committee-decisions/{id}/votes"
    shared_operations: ["all GET endpoints", "APPROVE/DECLINE votes"]
  - name: CommitteeMember
    description: "Loan committee member; casts APPROVE/DECLINE votes"
    identity: "entity_backed:BankOfficer"
    exclusive_operations: []
    shared_operations: ["all GET endpoints", "APPROVE/DECLINE votes via POST /credit/committee-decisions/{id}/votes"]
  - name: CreditPolicyOfficer
    description: "Credit policy & exception authority; clears exceptions, waives items/breaches, authorizes funding"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /credit/loan-applications/{id}/clear-exceptions"
      - "POST /credit/policy-exceptions/{id}/waive"
      - "POST /credit/funding-authorizations/{id}/authorize"
      - "POST /credit/covenants/{id}/waive-breach"
      - "to=WAIVED via POST /credit/document-checklist-items/{id}/transition"
    shared_operations: ["all GET endpoints"]
  - name: CreditAdministrator
    description: "Loan operations/closing administrator; commitment letters, documentation, closing, funding release, covenant setup"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /credit/commitment-letters/{id}/issue"
      - "POST /credit/commitment-letters/{id}/accept"
      - "POST /credit/document-checklist-items"
      - "POST /credit/loan-applications/{id}/submit-for-closing"
      - "POST /credit/funding-authorizations"
      - "POST /credit/funding-authorizations/{id}/release"
      - "POST /credit/covenants"
    shared_operations: ["all GET endpoints", "non-WAIVED transitions via POST /credit/document-checklist-items/{id}/transition"]
