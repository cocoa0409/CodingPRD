          setup:
            - "PlanYear 2027 OPEN, one MEDICARE_GROUP_WRAP option MED-WRAP in subsidy state NOT_STARTED."
            - "R1 Rosa Alvarez with one DRAFT determination for 2027 created by analyst-01."
