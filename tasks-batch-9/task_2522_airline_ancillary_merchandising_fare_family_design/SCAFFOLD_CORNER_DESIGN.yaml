            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite Rebuilt", cabin_class: "BUSINESS", base_fare_cents: 90000, bundle_price_cents: 95000, refundability: "FULLY_REFUNDABLE", change_fee_cents: 0, boarding_priority_tier: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err_code: $.data.error_id }
            - call: "POST /distribution-channels"
              payload: { channel_code: "DIRECT_WEB", channel_type: "OTA", commission_bp: 900, markup_bp: 500, max_ancillary_price_cents: 1000, supported_categories: ["BAGGAGE"], parity_required: false }
              as: DistributionManager
              as_user_id: "dm-001"
              captures: { err_channel: $.data.error_id }
          assert:
            - "all three responses are HTTP 409"
            - "err_sku == \"ERR_DUPLICATE_SKU\", err_code == \"ERR_DUPLICATE_FAMILY_CODE\", err_channel == \"ERR_DUPLICATE_CHANNEL_CODE\""
            - "GET /ancillary-products returns total_count == 1 with category \"BAGGAGE\" and list_price_cents 3500 (the original row is untouched)"
            - "GET /fare-families returns total_count == 1 with cabin_class \"ECONOMY\" and GET /distribution-channels returns total_count == 1 with channel_type \"DIRECT\""

      - name: reusing_the_record_locator_of_a_cancelled_booking_returns_duplicate_record_locator
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_RECORD_LOCATOR]
          - validations[priority 33]
          - entities.Booking.fields.record_locator
        distinguishing_aspect: "record_locator uniqueness spans terminal bookings too: after DUP001 is cancelled the locator is still taken, and a different channel and passenger do not free it."
        test_recipe:
          setup:
            - "booking DUP001 on DRAFT family ECO_BARE via DIRECT_WEB on PRESALE flight AC557 was cancelled with cancel_reason \"passenger withdrew\""
            - "a second channel OTA_ONE also exists"
          setup_api_calls:
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
