          assert:
            - "call 1 returns HTTP 422 ERR_GUIDE_OUTFITTER_MISMATCH: guide ${gc_id} resolves and is QUALIFIED, but belongs to Cedar while the permit is held by Alpine"
            - "call 2 returns HTTP 422 ERR_SUCCESSION_PREDECESSOR_INVALID: the predecessor permit exists and is ISSUED, but its holder is not the applicant"
            - "call 3 returns HTTP 422 ERR_SUCCESSION_PREDECESSOR_INVALID for the mirror-image fault — application_type NEW forbids predecessor_permit_id entirely"
            - "call 4 returns HTTP 422 ERR_NEEDS_ASSESSMENT_NOT_PUBLISHED: ${na2_id} exists for the right area but is DRAFT, so it cannot authorize a solicitation"
