      - "integrity_points = leaderboard_integrity_cap (ceiling applies; integrity_flagged forces 0)"
      - "device.total_workouts incremented by 1"
      - "parent Membership.total_streams_observed and posture recomputed"
      - "ERR_CONTENT_LOCKED when the device content_access_allowed is false"

  - method: POST
    path: "/fitness/class-enrollments/{enrollmentId}/drop"
