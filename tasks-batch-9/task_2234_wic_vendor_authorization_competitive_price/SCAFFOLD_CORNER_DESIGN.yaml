          - errors.ERR_VISIT_BLACKOUT_CONFLICT
        distinguishing_aspect: |
          A scheduled_for of 2026-08-08 under a clock of 2026-08-10 violates both the
          past-date rule (priority 29) and the blackout rule (priority 30, four days
          from the existing 2026-08-12 visit); the lower priority number wins, so the
          response is ERR_VISIT_DATE_IN_PAST and never ERR_VISIT_BLACKOUT_CONFLICT.
        test_recipe:
          setup:
            - "CHAIN A: vendor v1 AUTHORIZED in PG-SUPER-A"
