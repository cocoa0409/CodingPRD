            - "data[0].watch_time_minutes_at_allocation == 800000 and data[0].methodology_snapshot == 'PRO_RATA_WATCH_TIME'"
            - "data[1].rank == 2 and data[1].creator_id == '${cr_b}' and data[1].amount_cents == 20000"

      - name: tier_bonus_is_read_from_lifetime_paid_at_evaluation_time
