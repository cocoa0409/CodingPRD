      - name: press_line_selection_scores_headroom_speed_and_capability_surplus
        grounds:
          - calculations.press_line_selection
          - entities.PressLine.fields.capabilities
          - entities.PrintRun.fields.selection_score
          - entities.PrintRun.fields.selection_mode
          - validations[priority=64]
        distinguishing_aspect: |
          Mode (a) — a non-linear formula over three or more independent inputs: score mixes
          headroom (daily_sheet_capacity - committed_sheet_count) at 6000 bp, sheets_per_hour at
          4000 bp and a subtractive 500-point penalty per surplus capability, so PL-ALPHA's raw
          4200.00 falls to 3200.00 and the slower, less capable PL-DELTA wins at 4120.00.
        test_recipe:
          setup:
            - "Client CL-PS with dr_readiness_required false; ACTIVE template T-PS: duplex_required true, sheets_per_document 1, color_pages_per_document 0, no inserts, so required capabilities are exactly {DUPLEX}."
