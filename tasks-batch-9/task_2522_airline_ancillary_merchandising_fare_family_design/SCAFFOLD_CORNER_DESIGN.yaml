            - "Booking.ancillary_gross_cents == 0 (ALLOCATION rows never count as ancillary gross)"
            - "Booking.commission_cents == 1260 == round_half_up(14000 * 900 / 10000)"
            - "Booking.incentive_credit_cents == 0 because the provisional total 15260 is below the 30000 tier threshold"
            - "Booking.channel_settlement_total_cents == 15260"
            - "Booking.recognized_ancillary_net_cents == 3035 from the BAGGAGE ALLOCATION row"

      - name: bundle_valuation_excludes_withdrawn_attribute_from_every_output
        claim_type: input_set_filtering
        grounds:
          - calculations.fare_family_bundle_valuation
          - calculations.fare_family_fee_fingerprint
          - entities.FamilyAttribute.fields.attribute_state
          - entities.FareFamily.fields.included_attribute_count
        distinguishing_aspect: "Withdrawing the PRIORITY_BOARDING attribute drops ECO_TWO from 4750/16750/1045 to 3500/15500/323 and shortens the fingerprint to a single part, while the withdrawn row itself survives with its own fields intact."
        test_recipe:
          setup:
            - "DRAFT family ECO_TWO (base 12000, bundle 15000) has two ACTIVE INCLUDED attributes: BAG_CHECKED_1 (3500) and PRIORITY_BOARDING (1250)"
            - "before the withdrawal the family reports unbundled 4750, a_la_carte 16750 and bundle_discount_bp 1045"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /ancillary-products"
              payload: { sku: "PRIORITY_BOARDING", name: "Priority boarding", category: "BOARDING", list_price_cents: 1250, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4400" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_board_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_TWO", name: "Economy Two", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 15000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_two_id: $.data.id }
            - call: "POST /fare-families/${f_two_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
            - call: "POST /fare-families/${f_two_id}/attributes"
              payload: { ancillary_product_id: "${p_board_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_board_id: $.data.id }
          trigger:
            - call: "PATCH /family-attributes/${a_board_id}"
              payload: { attribute_state: "WITHDRAWN" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          assert:
            - "GET /fare-families/${f_two_id} reports unbundled_value_cents 3500, a_la_carte_total_cents 15500, bundle_discount_bp 323 and included_attribute_count 1"
            - "FareFamily.fee_fingerprint == \"ECO_TWO|1|BAG_CHECKED_1:INCLUDED:1:3500\" - the PRIORITY_BOARDING part is gone"
