        claim_type: priority_ordering
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        excluded_because:
          difficulty_instance: checkin_state_beats_size_mismatch
          rationale: "§1.8 instance asserts ERR_MEMBER_NOT_ACTIVE wins over ERR_DOG_SIZE_AREA_MISMATCH."

      - name: checkin_priority_safety_vs_capacity_covered
        claim_type: priority_ordering
        grounds:
          - validations[priority=9]
          - validations[priority=12]
