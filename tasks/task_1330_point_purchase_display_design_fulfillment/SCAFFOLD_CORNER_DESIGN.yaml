              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S1", address: "1 Main St" }
              as: ProgramManager
            - call: "POST /pop/stores"
              payload: { program_id: "${program_id}", store_number: "S2", address: "2 Main St" }
              as: ProgramManager
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 0, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /pop/production-runs/${run_id}/mark-produced"
              payload: {}
              as: ProductionPlanner
          assert:
            - "GET /pop/production-runs/${run_id}/kits returns 2 kits, all status == PENDING"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: production_quantity_uses_ceiling
        claim_type: correct_result
        grounds: [calculations.production_quantity_rule]
        distinguishing_aspect: "store_count=77, overage=5 -> ceil(80.85) = 81 (ceiling, not round)"
        test_recipe:
          setup:
            - "Program store_count=77 in PRODUCTION; design APPROVED; run PLANNED overage=5"
          setup_api_calls:
            - call: "POST /pop/clients"
              payload: { name: "Acme Corp", contact_email: "ops@acme.example" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /pop/programs"
              payload: { client_id: "${client_id}", retailer_name: "BigBox", program_name: "Ceil", store_count: 77, program_revenue_cents: 5000000 }
              as: ProgramManager
              captures: { program_id: $.data.id, program_v: $.data.version }
            - call: "POST /pop/programs/${program_id}/compliance-rules"
              payload: { program_id: "${program_id}", dimension: "MAX_WIDTH_IN", limit_value: "48" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/start-design"
              payload: {}
              as: ProgramManager
            - call: "POST /pop/designs"
              payload: { program_id: "${program_id}", design_code: "D1", width_in: 40, height_in: 60, depth_in: 24, weight_lb: 30, material: "CORRUGATE" }
              as: Designer
              captures: { design_id: $.data.id }
            - call: "POST /pop/designs/${design_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /pop/designs/${design_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
              captures: { design_v: $.data.version }
            - call: "POST /pop/designs/${design_id}/approve"
              payload: { expected_design_version: "${design_v}" }
              as: ComplianceOfficer
            - call: "POST /pop/programs/${program_id}/authorize-production"
              payload: {}
              as: ProgramManager
              captures: { program_v2: $.data.version }
            - call: "POST /pop/production-runs"
              payload: { program_id: "${program_id}", design_id: "${design_id}", overage_pct: 5, expected_program_version: "${program_v2}" }
              as: ProductionPlanner
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /pop/production-runs/${run_id}/authorize"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ProductionRun.${run_id}.production_quantity == 81"
            - "ProductionRun.${run_id}.unit_cost_cents == 2500"
            - "ProductionRun.${run_id}.total_cost_cents == 202500"
      - name: roi_provisional_excludes_damage
        claim_type: variant_divergence
        grounds: [calculations.program_roi.variants.provisional]
        distinguishing_aspect: "provisional ROI computed at first PRODUCED run uses committed cost only and ignores any later damage-claim costs"
