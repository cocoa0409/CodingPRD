  # ===========================================================================
  # Section 3 — Calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: leveled_value_with_alternate_and_repriced_allowance
        claim_type: correct_result
        grounds: [calculations.leveled_value, entities.Bid.fields.leveled_value_cents]
        distinguishing_aspect: "leveled_value applies the latest round's dispositions: 9000000 base + 50000 selected alternate + (120000 - 100000) repriced allowance = 9070000."
        test_recipe:
          setup: ["bid with one allowance (alw-1, 100000) and one alternate (alt-1, +50000); subcontract created from it"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-C1", project_number: "C1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "C1-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "O1", contact_email: "o1@x.com", base_bid_cents: 9000000, allowances: [{ allowance_id: "alw-1", amount_cents: 100000 }], alternates: [{ alternate_id: "alt-1", price_delta_cents: 50000 }], bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "O2", contact_email: "o2@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "O1", source_bid_id: "${bid_1}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subcontracts/${sub_id}/recommend-award"
              payload: { contract_value_cents: 9070000, allowance_dispositions: [{ allowance_id: "alw-1", action: "REPRICE", priced_cents: 120000 }], alternate_selections: [{ alternate_id: "alt-1", selected: true }] }
              as: BuyoutLead
            - call: "GET /bids/${bid_1}"
              as: BuyoutLead
              captures: { lv: $.data.leveled_value_cents }
          assert:
            - "lv == 9070000 (9000000 + 50000 + (120000 - 100000))"

      - name: leveled_value_ignores_undispositioned_allowance
        claim_type: input_set_filtering
        grounds: [calculations.leveled_value]
        distinguishing_aspect: "Before any negotiation round, an outstanding allowance contributes zero adjustment: leveled_value_cents equals base_bid_cents exactly."
        test_recipe:
          setup: ["package PUBLISHED; bid with one allowance (alw-1, 250000)"]
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-C2", project_number: "C2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "C2-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "P1", contact_email: "p1@x.com", base_bid_cents: 9000000, allowances: [{ allowance_id: "alw-1", amount_cents: 250000 }], bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_1: $.data.id }
          trigger:
            - call: "GET /bids/${bid_1}"
