      - call: POST /vehicle-hub/vehicles/${vm_veh1}/list
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${vm_veh2}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${vm_veh2}/list
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${vm_veh3}/start-recon
