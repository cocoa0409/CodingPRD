            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_oc}", kit_id: "${kit_oc}", installer_id: "${inst_oc}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_oc: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_oc}/confirm", payload: {}, as: Installer, as_user_id: "${inst_oc}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
