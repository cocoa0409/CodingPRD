          A different entity pair - MachinePlacement depending on ServiceTicket, i.e. on a SIBLING
          aggregate rather than on its own parent - and the gate is not a single state but a set:
          {DISPATCHED, ON_SITE, PENDING_VERIFICATION} blocks while QUEUED does not, because a QUEUED
          ticket was already auto-cancelled when the retrieval order was raised. The blocking ticket
