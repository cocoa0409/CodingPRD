      - name: prices_round_once_and_clamp_at_the_declared_floor_and_ceiling
        claim_type: precision
        grounds:
          - calculations.slot_dynamic_price.precision
          - calculations.slot_dynamic_price.constants
        distinguishing_aspect: |
          Three precision obligations in one walk. First the single-rounding rule: on the OFFPEAK
          early cell of a 35833-cent run the exact product is 25799.76, which rounds half-up to
          25800, whereas rounding after the tier multiplier and again after the lead multiplier
          yields 25799 — a one-cent fingerprint of a forbidden intermediate round. Then both clamps
          on runs priced at the extremes: 648 raw is lifted to PRICE_FLOOR_CENTS 1000 and 126720 raw
          is cut to PRICE_CEILING_CENTS 100000, and the clamp is applied AFTER rounding.
