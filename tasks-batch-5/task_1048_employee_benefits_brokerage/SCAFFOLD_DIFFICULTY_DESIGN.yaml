# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. All grounds resolve into SCAFFOLD.yaml
# §1.1-§1.7. All setup_api_calls drive empty-DB -> precondition using §1.5 only.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_estimated_vs_finalized_on_policy
        grounds:
          - calculations.commission_estimation
          - calculations.commission_finalization
          - entities.Policy.fields.estimated_commission_cents
          - entities.Policy.fields.finalized_commission_cents
          - state_machines.Policy.ACTIVE_to_ACTIVE
        distinguishing_aspect: "For the same Policy the estimated variant annualizes (x12) with a volume-tier multiplier (528000) while the finalized variant multiplies actual months elapsed with no volume multiplier (240000) — same inputs, different numbers, on entity Policy."
        test_recipe:
          setup:
            - "Empty DB; logical clock at startup default 2026-07-01T00:00:00Z."
            - "One ACTIVE MEDICAL Policy for a client: monthly_premium_cents=1000000, commission_rate_pct=0.04, effective_date=2026-01-01 (6 whole months before the clock)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Alpha Co", ein: "100000001", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id", est_at_bind: "$.data.estimated_commission_cents" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
          trigger:
            - { call: "POST /policies/${pol_id}/finalize-commission", payload: {}, as: BenefitsConsultant, captures: { fin: "$.data.finalized_commission_cents", est: "$.data.estimated_commission_cents" } }
          assert:
            - "Policy.${pol_id}.estimated_commission_cents == 528000"
            - "Policy.${pol_id}.finalized_commission_cents == 240000"
            - "Policy.${pol_id}.commission_status == FINALIZED"
            - "Policy.${pol_id}.estimated_commission_cents != Policy.${pol_id}.finalized_commission_cents"

      - name: affordability_rate_of_pay_vs_fpl_on_census_member
        grounds:
          - calculations.aca_affordability
          - entities.CensusMember.fields.affordable_rate_of_pay
          - entities.CensusMember.fields.affordable_fpl
        distinguishing_aspect: "For the same CensusMember the rate-of-pay safe harbor (threshold 45600, affordable=true) and the FPL safe harbor (threshold 11446, affordable=false) disagree — dual-variant on entity CensusMember, a different domain than the commission dual-variant on Policy."
        test_recipe:
          setup:
            - "Empty DB; one client."
            - "A member with annual_salary_cents=6000000 and monthly_contribution_cents=30000."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Beta Co", ein: "100000002", industry: "RETAIL", fiscal_year_end_month: 6 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
          trigger:
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "Pat Lee", birth_date: "1990-01-01", annual_salary_cents: 6000000, monthly_contribution_cents: 30000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { mem_id: "$.data.id" } }
          assert:
            - "CensusMember.${mem_id}.affordable_rate_of_pay == true"
            - "CensusMember.${mem_id}.affordable_fpl == false"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: commission_estimation_tiered_nonlinear_mode_a
        grounds:
          - calculations.commission_estimation
          - entities.Policy.fields.estimated_commission_cents
          - entities.CarrierQuote.fields.monthly_premium_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction — annual-premium volume tier (1.05 at 8.4M), coverage_line multiplier (DENTAL 0.90) and commission rate combine multiplicatively to 396900."
        test_recipe:
          setup:
            - "Empty DB; a SELECTED DENTAL quote with monthly_premium_cents=700000 (annual 8.4M, in tier 1) and commission_rate_pct=0.05."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Gamma Co", ein: "100000003", industry: "OTHER", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "DENTAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Dental Plus", monthly_premium_cents: 700000, commission_rate_pct: 0.05 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
          trigger:
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
          assert:
            - "Policy.${pol_id}.estimated_commission_cents == 396900"

      - name: election_premium_round_then_sum_mode_b
        grounds:
          - calculations.election_premium_rounding
          - entities.EnrollmentWindow.fields.total_confirmed_cents
          - entities.Election.fields.monthly_cost_cents
          - state_machines.EnrollmentWindow.OPEN_to_FINALIZED
        distinguishing_aspect: "Mode (b): rounding order is pinned round-per-election-then-sum — EMPLOYEE_CHILD (175018) + FAMILY (285029) = 460047, whereas sum-then-round would give 460046."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE MEDICAL Policy with monthly_premium_cents=100010."
            - "An OPEN EnrollmentWindow (opens 2026-07-01, closes 2026-07-31); two members each with a SELECTED election (one EMPLOYEE_CHILD, one FAMILY); clock advanced to 2026-08-01 so the window can finalize."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Delta Co", ein: "100000004", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 100010, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win_id: "$.data.id" } }
            - { call: "POST /enrollment-windows/${win_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "Child Elector", birth_date: "1988-05-05", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m1: "$.data.id" } }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "Family Elector", birth_date: "1985-03-03", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m2: "$.data.id" } }
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m1}", policy_id: "${pol_id}", coverage_tier: "EMPLOYEE_CHILD" }, as: ClientContact, as_user_id: "${client_id}", captures: { e1: "$.data.id" } }
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m2}", policy_id: "${pol_id}", coverage_tier: "FAMILY" }, as: ClientContact, as_user_id: "${client_id}", captures: { e2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /enrollment-windows/${win_id}/finalize", payload: {}, as: BenefitsConsultant, captures: { total: "$.data.total_confirmed_cents" } }
          assert:
            - "Election.${e1}.monthly_cost_cents == 175018"
            - "Election.${e2}.monthly_cost_cents == 285029"
            - "EnrollmentWindow.${win_id}.total_confirmed_cents == 460047"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: renewal_negotiation_cycle
        grounds:
          - state_machines.Renewal.NEGOTIATING_to_NEGOTIATING
          - state_machines.Renewal.OPEN_to_NEGOTIATING
          - entities.Renewal.fields.round_count
          - entities.Renewal.fields.proposing_side
        distinguishing_aspect: "Renewal loops NEGOTIATING->NEGOTIATING via alternating counters (broker then carrier); round_count reaches 2 and proposing_side flips back to CARRIER — a cycle on entity Renewal."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy (premium 1000000); an OPEN Renewal with initial_offer 1000000 (proposing_side CARRIER)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Epsilon Co", ein: "100000005", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant, captures: { pol_v: "$.data.version" } }
            - { call: "POST /renewals", payload: { policy_id: "${pol_id}", expected_policy_version: "${pol_v}", initial_offer_premium_cents: 1000000 }, as: BenefitsConsultant, captures: { ren_id: "$.data.id" } }
            - { call: "POST /renewals/${ren_id}/counter", payload: { proposed_premium_cents: 950000 }, as: BenefitsConsultant }
          trigger:
            - { call: "POST /renewals/${ren_id}/counter", payload: { proposed_premium_cents: 980000 }, as: CarrierRep, captures: { rc: "$.data.round_count" } }
          assert:
            - "Renewal.${ren_id}.status == NEGOTIATING"
            - "Renewal.${ren_id}.round_count == 2"
            - "Renewal.${ren_id}.proposing_side == CARRIER"
            - "Renewal.${ren_id}.current_offer_premium_cents == 980000"

      - name: election_branch_confirm_vs_waive
        grounds:
          - state_machines.Election.SELECTED_to_CONFIRMED
          - state_machines.Election.SELECTED_to_WAIVED
          - entities.Client.fields.enrolled_headcount
        distinguishing_aspect: "From SELECTED the Election forks to CONFIRMED (enrolled_headcount +1) or WAIVED (no headcount change); the two branches carry divergent side-effect sets on entity Election, distinct from the Renewal cycle."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy; OPEN EnrollmentWindow; two members; election e1 already CONFIRMED (headcount 1); election e2 SELECTED."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Zeta Co", ein: "100000006", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win_id: "$.data.id" } }
            - { call: "POST /enrollment-windows/${win_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "M One", birth_date: "1990-01-01", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m1: "$.data.id" } }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "M Two", birth_date: "1991-02-02", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m2: "$.data.id" } }
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m1}", policy_id: "${pol_id}", coverage_tier: "EMPLOYEE_ONLY" }, as: ClientContact, as_user_id: "${client_id}", captures: { e1: "$.data.id" } }
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m2}", policy_id: "${pol_id}", coverage_tier: "EMPLOYEE_ONLY" }, as: ClientContact, as_user_id: "${client_id}", captures: { e2: "$.data.id" } }
            - { call: "POST /elections/${e1}/confirm", payload: {}, as: ClientContact, as_user_id: "${client_id}" }
          trigger:
            - { call: "POST /elections/${e2}/waive", payload: {}, as: ClientContact, as_user_id: "${client_id}" }
          assert:
            - "Election.${e1}.status == CONFIRMED"
            - "Election.${e2}.status == WAIVED"
            - "Client.${client_id}.enrolled_headcount == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: renewal_accept_cascade_policy_then_client
        grounds:
          - state_machines.Renewal.OPEN_to_AGREED
          - entities.Policy.fields.monthly_premium_cents
          - entities.Client.fields.active_premium_total_cents
          - calculations.active_premium_ledger
        distinguishing_aspect: "Depth-3: settling a Renewal (A) sets Policy.monthly_premium_cents to the agreed 900000 (B); that premium change recomputes Client.active_premium_total_cents to 900000 (C). Each hop is caused by the prior; trigger is renewal ACCEPT."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy (original_premium 1000000, active_premium_total 1000000); OPEN Renewal with initial_offer 900000 (>= floor 500000)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Eta Co", ein: "100000007", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant, captures: { pol_v: "$.data.version" } }
            - { call: "POST /renewals", payload: { policy_id: "${pol_id}", expected_policy_version: "${pol_v}", initial_offer_premium_cents: 900000 }, as: BenefitsConsultant, captures: { ren_id: "$.data.id" } }
          trigger:
            - { call: "POST /renewals/${ren_id}/settle", payload: { action: "ACCEPT" }, as: BenefitsConsultant }
          assert:
            - "Renewal.${ren_id}.status == AGREED"
            - "Policy.${pol_id}.monthly_premium_cents == 900000"
            - "Policy.${pol_id}.renewal_status == RENEWED"
            - "Client.${client_id}.active_premium_total_cents == 900000"

      - name: window_finalize_cascade_election_then_client
        grounds:
          - state_machines.EnrollmentWindow.OPEN_to_FINALIZED
          - state_machines.Election.SELECTED_to_CONFIRMED
          - entities.Client.fields.enrolled_headcount
          - calculations.enrolled_headcount_ledger
        distinguishing_aspect: "Depth-3: finalizing a Window (A) confirms its SELECTED Election (B); that confirmation increments Client.enrolled_headcount to 1 (C). Trigger is window finalize — a different origin than the renewal cascade."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy; OPEN Window (closes 2026-07-31); one SELECTED Election; clock advanced to 2026-08-01."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Theta Co", ein: "100000008", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win_id: "$.data.id" } }
            - { call: "POST /enrollment-windows/${win_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "Solo Elector", birth_date: "1990-01-01", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m1: "$.data.id" } }
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m1}", policy_id: "${pol_id}", coverage_tier: "EMPLOYEE_ONLY" }, as: ClientContact, as_user_id: "${client_id}", captures: { e1: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /enrollment-windows/${win_id}/finalize", payload: {}, as: BenefitsConsultant }
          assert:
            - "EnrollmentWindow.${win_id}.status == FINALIZED"
            - "Election.${e1}.status == CONFIRMED"
            - "Client.${client_id}.enrolled_headcount == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_renewal_settle
        grounds:
          - validations[priority=5]
          - validations[priority=15]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PREMIUM_BELOW_FLOOR]
        distinguishing_aspect: "A single settle ACCEPT on a DECLINED renewal whose current_offer (100000) is also below the floor (500000) violates both the state check (priority 5) and the business_fiscal floor (priority 15); the state error wins -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy (original_premium 1000000, floor 500000); a Renewal opened with initial_offer 100000 (below floor) then DECLINED."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Iota Co", ein: "100000009", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant, captures: { pol_v: "$.data.version" } }
            - { call: "POST /renewals", payload: { policy_id: "${pol_id}", expected_policy_version: "${pol_v}", initial_offer_premium_cents: 100000 }, as: BenefitsConsultant, captures: { ren_id: "$.data.id" } }
            - { call: "POST /renewals/${ren_id}/settle", payload: { action: "DECLINE" }, as: BenefitsConsultant }
          trigger:
            - { call: "POST /renewals/${ren_id}/settle", payload: { action: "ACCEPT" }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: safety_beats_referential_on_certify
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_NO_ACTIVE_COVERAGE]
          - state_machines.ComplianceFiling.PREPARED_to_CERTIFIED
        distinguishing_aspect: "Certifying with the same X-User-ID that prepared (SoD, priority 7) on a client that also has no ACTIVE policy (referential, priority 8) violates both; business_safety wins -> ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
            - "Empty DB; a client with NO active policy; a PREPARED ACA_1094C filing prepared by X-User-ID 'officer-a'."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Kappa Co", ein: "100000010", industry: "HEALTHCARE", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /filings", payload: { client_id: "${client_id}", filing_type: "ACA_1094C", plan_year: 2026, due_date: "2027-03-31T00:00:00Z" }, as: ComplianceOfficer, as_user_id: "officer-a", captures: { fil_id: "$.data.id" } }
            - { call: "POST /filings/${fil_id}/prepare", payload: {}, as: ComplianceOfficer, as_user_id: "officer-a" }
          trigger:
            - { call: "POST /filings/${fil_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "officer-a", captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_SEGREGATION_OF_DUTIES"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: stop_loss_attachment_strict_boundary
        grounds:
          - calculations.stop_loss_recovery
          - entities.StopLossPolicy.fields.reimbursed_cents
          - entities.StopLossPolicy.fields.attachment_point_cents
        distinguishing_aspect: "Reimbursement uses strict > attachment: after cumulative claims reach EXACTLY the attachment point 5000000, reimbursed_cents is 0 (not >0) — a numeric-threshold boundary on POST /stop-loss-policies/{id}/record-claim."
        test_recipe:
          setup:
            - "Empty DB; a StopLossPolicy with attachment_point_cents=5000000, wellness_credit_pct=0.05; one claim of 4999999 recorded (cumulative 4999999, reimbursed 0)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Lambda Co", ein: "100000011", industry: "MANUFACTURING", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /stop-loss-policies", payload: { client_id: "${client_id}", attachment_point_cents: 5000000, aggregate_limit_cents: 50000000, wellness_credit_pct: 0.05 }, as: BenefitsConsultant, captures: { sl_id: "$.data.id" } }
            - { call: "POST /stop-loss-policies/${sl_id}/record-claim", payload: { claim_amount_cents: 4999999 }, as: BenefitsConsultant }
          trigger:
            - { call: "POST /stop-loss-policies/${sl_id}/record-claim", payload: { claim_amount_cents: 1 }, as: BenefitsConsultant, captures: { r: "$.data.reimbursed_cents" } }
          assert:
            - "StopLossPolicy.${sl_id}.cumulative_claims_cents == 5000000"
            - "StopLossPolicy.${sl_id}.reimbursed_cents == 0"

      - name: enrollment_finalize_empty_confirmed_set
        grounds:
          - calculations.election_premium_rounding
          - state_machines.EnrollmentWindow.OPEN_to_FINALIZED
          - entities.EnrollmentWindow.fields.total_confirmed_cents
          - entities.Client.fields.enrolled_headcount
        distinguishing_aspect: "Finalizing a Window with ZERO elections yields total_confirmed_cents==0 and leaves enrolled_headcount==0 — an empty-collection edge on POST /enrollment-windows/{id}/finalize, a different metric and endpoint than the stop-loss threshold."
        test_recipe:
          setup:
            - "Empty DB; an OPEN Window with no elections; clock advanced past closes_at."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Mu Co", ein: "100000012", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win_id: "$.data.id" } }
            - { call: "POST /enrollment-windows/${win_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /enrollment-windows/${win_id}/finalize", payload: {}, as: BenefitsConsultant, captures: { total: "$.data.total_confirmed_cents" } }
          assert:
            - "EnrollmentWindow.${win_id}.status == FINALIZED"
            - "EnrollmentWindow.${win_id}.total_confirmed_cents == 0"
            - "Client.${client_id}.enrolled_headcount == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: renewal_requires_active_policy
        grounds:
          - state_machines.Renewal.OPEN_to_NEGOTIATING
          - entities.Policy.fields.lifecycle_status
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Opening a Renewal is rejected because the referenced Policy is BOUND not ACTIVE (Renewal depends on Policy state); with a correct expected_policy_version the OCC check passes and the state check fails -> ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Empty DB; a BOUND (not activated) Policy."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Nu Co", ein: "100000013", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 1000000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id", pol_v: "$.data.version" } }
          trigger:
            - { call: "POST /renewals", payload: { policy_id: "${pol_id}", expected_policy_version: "${pol_v}", initial_offer_premium_cents: 900000 }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

      - name: election_create_requires_open_window
        grounds:
          - entities.EnrollmentWindow.fields.status
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/elections
        distinguishing_aspect: "Creating an Election is rejected because its EnrollmentWindow is SCHEDULED not OPEN (Election depends on EnrollmentWindow state) — a different entity pair than Renewal->Policy."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy; one ACTIVE member; a SCHEDULED (not opened) EnrollmentWindow."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Xi Co", ein: "100000014", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "Early Bird", birth_date: "1990-01-01", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m1: "$.data.id" } }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win_id: "$.data.id" } }
          trigger:
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m1}", policy_id: "${pol_id}", coverage_tier: "EMPLOYEE_ONLY" }, as: ClientContact, as_user_id: "${client_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: enrollment_window_overlap_half_open
        grounds:
          - validations[priority=11]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.EnrollmentWindow.fields.opens_at
          - entities.EnrollmentWindow.fields.closes_at
        distinguishing_aspect: "Two EnrollmentWindows for the same client with half-open [opens_at, closes_at) intervals that strictly overlap are rejected; the geometric rule is half-open so touching endpoints would be allowed but [2027-01-15,2027-03-01) overlaps [2027-01-01,2027-02-01)."
        test_recipe:
          setup:
            - "Empty DB; a client with one window [2027-01-01, 2027-02-01)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Omicron Co", ein: "100000015", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2027, opens_at: "2027-01-01T00:00:00Z", closes_at: "2027-02-01T00:00:00Z" }, as: BenefitsConsultant, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2027, opens_at: "2027-01-15T00:00:00Z", closes_at: "2027-03-01T00:00:00Z" }, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_WINDOW_OVERLAP"

      - name: policy_coverage_overlap_closed_touching
        grounds:
          - validations[priority=12]
          - errors[ERR_COVERAGE_OVERLAP]
          - state_machines.Policy.BOUND_to_ACTIVE
          - entities.Policy.fields.effective_date
        distinguishing_aspect: "Activating a second MEDICAL Policy for the same client whose [effective_date, expiration_date] closed interval touches an ACTIVE policy's endpoint (both include 2026-06-30) is rejected — closed-interval semantics where touching DOES conflict, unlike the half-open window rule, and on a different resource entity."
        test_recipe:
          setup:
            - "Empty DB; an ACTIVE MEDICAL Policy [2026-01-01, 2026-06-30]; a second BOUND MEDICAL Policy [2026-06-30, 2026-12-31] for the same client (from a second campaign/quote)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Pi Co", ein: "100000016", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { c1: "$.data.id" } }
            - { call: "POST /campaigns/${c1}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${c1}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q1: "$.data.id" } }
            - { call: "POST /quotes/${q1}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${q1}", effective_date: "2026-01-01", expiration_date: "2026-06-30" }, as: BenefitsConsultant, captures: { p1: "$.data.id" } }
            - { call: "POST /policies/${p1}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-07-01" }, as: BenefitsConsultant, captures: { c2: "$.data.id" } }
            - { call: "POST /campaigns/${c2}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${c2}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { q2: "$.data.id" } }
            - { call: "POST /quotes/${q2}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${q2}", effective_date: "2026-06-30", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { p2: "$.data.id" } }
          trigger:
            - { call: "POST /policies/${p2}/activate", payload: {}, as: BenefitsConsultant, captures: { err: "$.data.error_id" } }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_COVERAGE_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: enrolled_headcount_conserved_confirm_then_withdraw
        grounds:
          - state_machines.Election.SELECTED_to_CONFIRMED
          - state_machines.Election.CONFIRMED_to_WITHDRAWN
          - entities.Client.fields.enrolled_headcount
          - calculations.enrolled_headcount_ledger
        distinguishing_aspect: "Confirm (+1) then withdraw (-1) leaves Client.enrolled_headcount == COUNT(Election status==CONFIRMED) == 0 — the conserved quantity is the enrolled headcount, with no drift."
        test_recipe:
          setup:
            - "Empty DB; ACTIVE Policy; OPEN Window; one member; a CONFIRMED election (headcount 1)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Rho Co", ein: "100000017", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 500000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
            - { call: "POST /enrollment-windows", payload: { client_id: "${client_id}", plan_year: 2026, opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T00:00:00Z" }, as: BenefitsConsultant, captures: { win_id: "$.data.id" } }
            - { call: "POST /enrollment-windows/${win_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /census-members", payload: { client_id: "${client_id}", full_name: "Toggle Member", birth_date: "1990-01-01", annual_salary_cents: 5000000, monthly_contribution_cents: 20000, employment_type: "FULL_TIME" }, as: BenefitsConsultant, captures: { m1: "$.data.id" } }
            - { call: "POST /elections", payload: { window_id: "${win_id}", census_member_id: "${m1}", policy_id: "${pol_id}", coverage_tier: "EMPLOYEE_ONLY" }, as: ClientContact, as_user_id: "${client_id}", captures: { e1: "$.data.id" } }
            - { call: "POST /elections/${e1}/confirm", payload: {}, as: ClientContact, as_user_id: "${client_id}" }
          trigger:
            - { call: "POST /elections/${e1}/withdraw", payload: {}, as: ClientContact, as_user_id: "${client_id}" }
          assert:
            - "Election.${e1}.status == WITHDRAWN"
            - "Client.${client_id}.enrolled_headcount == 0"

      - name: active_premium_total_conserved_activate_then_terminate
        grounds:
          - state_machines.Policy.BOUND_to_ACTIVE
          - state_machines.Policy.ACTIVE_to_TERMINATED
          - entities.Client.fields.active_premium_total_cents
          - calculations.active_premium_ledger
        distinguishing_aspect: "Activate (+800000) then terminate (-800000) leaves Client.active_premium_total_cents == SUM(monthly_premium_cents over ACTIVE policies) == 0 — the conserved quantity is the premium-money ledger, a different quantity than enrolled headcount."
        test_recipe:
          setup:
            - "Empty DB; an ACTIVE MEDICAL Policy with monthly_premium_cents=800000 (active_premium_total 800000)."
          setup_api_calls:
            - { call: "POST /clients", payload: { legal_name: "Sigma Co", ein: "100000018", industry: "TECH", fiscal_year_end_month: 12 }, as: BenefitsConsultant, captures: { client_id: "$.data.id" } }
            - { call: "POST /campaigns", payload: { client_id: "${client_id}", coverage_line: "MEDICAL", target_effective_date: "2026-01-01" }, as: BenefitsConsultant, captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/open", payload: {}, as: BenefitsConsultant }
            - { call: "POST /quotes", payload: { campaign_id: "${camp_id}", carrier_name: "Acme Health", monthly_premium_cents: 800000, commission_rate_pct: 0.04 }, as: CarrierRep, captures: { quote_id: "$.data.id" } }
            - { call: "POST /quotes/${quote_id}/select", payload: {}, as: BenefitsConsultant }
            - { call: "POST /policies", payload: { client_id: "${client_id}", quote_id: "${quote_id}", effective_date: "2026-01-01", expiration_date: "2026-12-31" }, as: BenefitsConsultant, captures: { pol_id: "$.data.id" } }
            - { call: "POST /policies/${pol_id}/activate", payload: {}, as: BenefitsConsultant }
          trigger:
            - { call: "POST /policies/${pol_id}/terminate", payload: {}, as: BenefitsConsultant }
          assert:
            - "Policy.${pol_id}.lifecycle_status == TERMINATED"
            - "Client.${client_id}.active_premium_total_cents == 0"
