            - "No CreditInsurancePolicy exists for the buyer, so the LC_ACCEPTED charge was the uninsured_passthrough variant and insured_exposure_usd is 0.00 throughout."
            - "The logical clock never moves from 2026-08-01T00:00:00Z, strictly before expiry_date, so every amendment and review passes validation 19."
          setup_api_calls:
            - call: "POST /foreign-buyers"
              payload: { legal_name: "Osaka Fastener KK", country_code: "JP", credit_rating: "BBB", sanctions_tier: "NONE", restricted_party_flag: false }
              as: TradeComplianceOfficer
