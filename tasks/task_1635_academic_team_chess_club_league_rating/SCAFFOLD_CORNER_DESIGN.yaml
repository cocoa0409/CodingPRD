  # =====================================================================
  # Section: rbac
  # =====================================================================
  - section: rbac
    instances:
      - name: rbac_coach_cannot_create_season
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.FederationAdmin"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "ClubCoach calling FederationAdmin-exclusive POST /api/seasons gets ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: ClubCoach, as_user_id: "00000000-0000-0000-0000-000000000001", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403) — got ${err}"

      - name: rbac_treasurer_cannot_reverse_ledger
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.Auditor"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Reverse is Auditor-exclusive: a Treasurer (who may post) gets ERR_INSUFFICIENT_PERMISSIONS on reverse."
        test_recipe:
          setup: ["Season ACTIVE; club A with ADJUSTMENT +1200"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 1200, memo: "seed", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1", captures: { le: $.data.id } }
          trigger:
            - { call: "POST /api/ledger-entries/${le}/reverse", payload: {}, as: Treasurer, as_user_id: "treasurer-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403) — got ${err}"

      - name: rbac_auditor_cannot_post_adjustment
        claim_type: exclusive_operation_denied
        grounds:
          - "roles.Treasurer"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Posting adjustments is Treasurer-exclusive: an Auditor gets ERR_INSUFFICIENT_PERMISSIONS on POST ledger-entries (the mirror of the reverse denial enforces segregation of duties at the role level)."
        test_recipe:
          setup: ["Season ACTIVE; club A"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
          trigger:
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 100, memo: "x", expected_club_version: "${cav}" }, as: Auditor, as_user_id: "auditor-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403) — got ${err}"

      - name: rbac_proctor_confirm_others_assignment_forbidden
        claim_type: ownership_denied
        grounds:
          - "roles.Proctor"
          - "validations[priority=5]"
          - "errors[ERR_FORBIDDEN_RESOURCE_OWNERSHIP]"
        distinguishing_aspect: "Proctor identity is entity_backed:Coach — confirming an assignment whose coach_id differs from X-User-ID fails ERR_FORBIDDEN_RESOURCE_OWNERSHIP."
        test_recipe:
          setup: ["Season ACTIVE; clubs A,B; coaches X (club A) and Y (club B); meet DRAFT; assignment for coach X"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach X", email: "cx@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_x: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_b}", full_name: "Coach Y", email: "cy@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_y: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id } }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_x}", event_type: "MEET", meet_id: "${meet_id}" }, as: FederationAdmin, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /api/proctor-assignments/${asg}/confirm", payload: {}, as: Proctor, as_user_id: "${coach_y}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_RESOURCE_OWNERSHIP (403) — got ${err}"

      - name: rbac_coach_other_club_player_forbidden
        claim_type: ownership_denied
        grounds:
          - "roles.ClubCoach"
          - "validations[priority=5]"
          - "errors[ERR_FORBIDDEN_RESOURCE_OWNERSHIP]"
        distinguishing_aspect: "ClubCoach may only create players in their own club: coach of club A posting club_id of club B fails ERR_FORBIDDEN_RESOURCE_OWNERSHIP."
        test_recipe:
          setup: ["Season ACTIVE; clubs A,B with coaches"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
          trigger:
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "Poach", grade_level: 9 }, as: ClubCoach, as_user_id: "${coach_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_RESOURCE_OWNERSHIP (403) — got ${err}"

      - name: rbac_all_roles_can_list_seasons
        claim_type: shared_operation_allowed
        grounds:
          - "roles.FederationAdmin"
          - "roles.ClubCoach"
          - "roles.Proctor"
          - "roles.Treasurer"
          - "roles.Auditor"
        distinguishing_aspect: "Shared GET surface: all five roles can GET /api/seasons (200 with array envelope)."
        test_recipe:
          setup: ["One season exists"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
          trigger:
            - { call: "GET /api/seasons", as: FederationAdmin }
            - { call: "GET /api/seasons", as: ClubCoach, as_user_id: "00000000-0000-0000-0000-000000000002" }
            - { call: "GET /api/seasons", as: Proctor, as_user_id: "00000000-0000-0000-0000-000000000002" }
            - { call: "GET /api/seasons", as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "GET /api/seasons", as: Auditor, as_user_id: "auditor-1" }
          assert:
            - "All five calls return 200 with response_type == array and total_count == 1"

  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_pairing_stale_meet_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[pairing-create-stale-meet]"
          - "validations[priority=6]"
        distinguishing_aspect: "OCC on Meet.version: a pairing create carrying the pre-schedule version is rejected ERR_STALE_VERSION (412); re-reading and resubmitting with the current version succeeds."
        test_recipe:
          setup: ["Season ACTIVE; clubs A,B with players + WAIVED memberships; meet created (version captured at 1) then SCHEDULED (version advanced to 2)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "B", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "W", grade_level: 9 }, as: FederationAdmin, captures: { pw: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_b}", full_name: "B1", grade_level: 9 }, as: FederationAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${pw}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${pb}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
            - { call: "POST /api/memberships/${m2}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${sid}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet_id: $.data.id, mv_stale: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/schedule", payload: {}, as: FederationAdmin }
          trigger:
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pw}", black_player_id: "${pb}", expected_meet_version: "${mv_stale}" }, as: FederationAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /api/meets/${meet_id}", as: FederationAdmin, captures: { mv_fresh: $.data.version } }
            - { call: "POST /api/meets/${meet_id}/pairings", payload: { round_number: 1, board_number: 1, white_player_id: "${pw}", black_player_id: "${pb}", expected_meet_version: "${mv_fresh}" }, as: FederationAdmin, captures: { pair_id: $.data.id } }
          assert:
            - "Stale write (version ${mv_stale} captured before /schedule): ERR_STALE_VERSION (412) — got ${err}"
            - "Fresh write (version ${mv_fresh}): 201, pairing ${pair_id} created; Meet.version incremented again"

      - name: occ_ledger_stale_club_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[ledger-adjust-stale-club]"
          - "validations[priority=6]"
        distinguishing_aspect: "OCC on Club.version: a second adjustment reusing the version observed before the first post is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Season ACTIVE; club A (version 1 captured); first adjustment +500 posted (version now 2)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 500, memo: "first", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1" }
          trigger:
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 300, memo: "second-stale", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1", captures: { err: $.data.error_id } }
            - { call: "GET /api/clubs/${club_a}", as: Treasurer, captures: { bal: $.data.account_balance_cents, cv: $.data.version } }
          assert:
            - "Second adjustment with the stale version: ERR_STALE_VERSION (412) — got ${err}"
            - "Balance == 500 and version == 2 (the rejected write changed nothing) — got ${bal} / ${cv}"

      - name: occ_standings_stale_season_version
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[standings-finalize-stale-season]"
          - "validations[priority=6]"
        distinguishing_aspect: "OCC on Season.version: standings/finalize legitimately supersedes prior snapshots, so the only guard is the version check — a repeated finalize with the pre-first version is rejected ERR_STALE_VERSION."
        test_recipe:
          setup: ["Season FINALIZING with one club; version captured before first finalize"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/seasons/${sid}/finalize", payload: {}, as: FederationAdmin }
            - { call: "GET /api/seasons/${sid}", as: FederationAdmin, captures: { sv: $.data.version } }
          trigger:
            - { call: "POST /api/seasons/${sid}/standings/finalize", payload: { expected_season_version: "${sv}" }, as: FederationAdmin, captures: { snaps: $.data } }
            - { call: "POST /api/seasons/${sid}/standings/finalize", payload: { expected_season_version: "${sv}" }, as: FederationAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First finalize with current version: 201 with 1 snapshot (club A, all-zero standings)"
            - "Second finalize with the same (now stale) version: ERR_STALE_VERSION (412) — got ${err}"

      - name: bid_selector_tiebreak_by_rating
        claim_type: selector_policy
        grounds:
          - "calculations.qualification_bid_selection"
        distinguishing_aspect: "Selector determinism: two players tied on 6 points are ranked by rating DESC — the single slot goes to the 1500-rated player, not the 1400 one; ids play no role."
        test_recipe:
          setup: ["Season (slots 1) FINALIZING; players P1 (init 1500/25) and P2 (init 1400/25), both club A, both 6 points via three check-ins each; memberships WAIVED"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 1, travel_base_cents: 1500 }, as: FederationAdmin, captures: { sid: $.data.id } }
            - { call: "POST /api/seasons/${sid}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${sid}", name: "A", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach A", email: "ca@x.com", certification_level: "CLUB" }, as: FederationAdmin, captures: { coach_a: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P2", grade_level: 10, initial_rating: 1400, initial_rated_games: 25 }, as: FederationAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/players", payload: { club_id: "${club_a}", full_name: "P1", grade_level: 11, initial_rating: 1500, initial_rated_games: 25 }, as: FederationAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/memberships", payload: { player_id: "${p1}", season_id: "${sid}" }, as: FederationAdmin, captures: { m1: $.data.id } }
            - { call: "POST /api/memberships/${m1}/waive", payload: {}, as: FederationAdmin }
            - { call: "POST /api/memberships", payload: { player_id: "${p2}", season_id: "${sid}" }, as: FederationAdmin, captures: { m2: $.data.id } }
