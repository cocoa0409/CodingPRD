              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/permits"
              payload: { job_id: "${job_id}", jurisdiction: "City", permit_number: "PV1-PN" }
              as: Dispatcher
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/issue"
              payload: {}
              as: Inspector
            - call: "POST /v1/permits/${permit_id}/schedule-inspection"
              payload: { inspection_at: "2026-07-10T09:00:00Z" }
              as: Dispatcher
            - call: "POST /v1/permits/${permit_id}/record-inspection"
              payload: { result: "PASS" }
              as: Inspector
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-10T10:00:00Z", window_end: "2026-07-10T11:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
