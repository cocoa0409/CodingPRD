  # ===========================================================================
  # Rule 6: boundary_precision_check — different metrics on different endpoints.
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: yes_vote_quorum_boundary_exactly_two
        grounds:
          - state_machines.ICMemo.UNDER_VOTE_to_APPROVED
        distinguishing_aspect: |
          Metric: COUNT(YES votes). Boundary: IC_QUORUM_YES = 2 uses >=, not >.
          Exactly 2 YES votes (with 0 NO) flips the memo to APPROVED; 1 YES
          vote does not. Endpoint: POST /re-underwriting/ic-memos/{id}/vote.
        test_recipe:
          setup:
            - "Deal in IC_REVIEW with memo UNDER_VOTE"
          setup_api_calls:
            - call: "POST /re-underwriting/deals"
              payload: { deal_code: "D-BND1", deal_name: "B1", strategy: "CORE", target_purchase_price_cents: 100000000 }
              as: Analyst
              as_user_id: "u-analyst-1"
              captures: { deal_id: $.data.id }
            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1", market: "M", property_type: "OFFICE", units: 10, rentable_sqft: 20000, year_built: 2000 }
