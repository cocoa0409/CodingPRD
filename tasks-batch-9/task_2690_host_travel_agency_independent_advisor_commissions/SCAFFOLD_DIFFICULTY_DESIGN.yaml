      - name: advisor_suspend_reinstate_cycle_regated_on_fresh_registration
        grounds:
          - state_machines.Advisor.ACTIVE_to_SUSPENDED
          - state_machines.Advisor.SUSPENDED_to_ACTIVE
          - state_machines.ComplianceCredential.VERIFIED_to_REVOKED
          - validations[priority=50]
          - errors[ERR_SELLER_OF_TRAVEL_INVALID]
        distinguishing_aspect: |
          The non-linearity is a RE-GATED CYCLE on Advisor: SUSPENDED -> ACTIVE is a backward
          edge whose guard is re-evaluated against other entities at traversal time, not a
          counter on the advisor. The first reinstate attempt fails with
          ERR_SELLER_OF_TRAVEL_INVALID and the advisor stays SUSPENDED; only after a fresh
          credential is filed and VERIFIED does the same call succeed, which is the structural
          opposite of the integer-guarded claim loop.
