  instances:
  - name: yield_tier_ladder_all_boundaries
    claim_type: constants_applied
    grounds:
    - calculations.yield_projection
    distinguishing_aspect: 'All four tier edges in one sweep: 95.0 -> 1.00, 94.9 -> 0.90, 85.0 -> 0.90, 84.9 -> 0.75 — the >= boundaries belong to the UPPER tier.'
    test_recipe:
      setup:
      - Crop KALE-01 ACTIVE recipe (12.5 lb/tower); four SEEDED 4-tower batches B1..B4 across racks R-01/R-02 (8 towers each)
      setup_api_calls:
