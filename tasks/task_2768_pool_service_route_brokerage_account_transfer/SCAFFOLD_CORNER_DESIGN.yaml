            - "The whole 20000 base was CANCELLED (NATURAL) on 2026-09-15 by broker-ops-1: guaranteed 20000, allowance 1000, compensable 19000, effective multiple 10.0, raw adjustment 190000, cap 36000."
            - "A DRAFT REPLACEMENT_BASIS settlement exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
