              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { child_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}", child_id: "${child_id}", consumption_rate_per_day: 6, pack_count: 2 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c1: $.data.id }
            - call: "POST /cycles/${c1}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /skus/${sku_cheap}/stock-adjustments"
              payload: { delta_packs: 50 }
              as: OpsAdmin
            - call: "POST /subscriptions/${sub_id}/cycles"
              payload: {}
              as: OpsAdmin
              captures: { c2: $.data.id }
            - call: "POST /cycles/${c2}/allocate"
              payload: {}
              as: OpsAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /cycles/${c1}/lock"
              payload: {}
              as: OpsAdmin
