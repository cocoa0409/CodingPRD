              payload: { code: "EXPRESS", name: "Express", guarantee_hours: 24, guaranteed: true }
              as: CarrierAdmin
              captures: { sl: $.data.id }
            - call: "POST /rate-contracts"
              payload:
                shipper_id: "${sh}"
                effective_from: "2026-01-01"
                effective_to: "2026-12-31"
                dim_divisor: 139
                min_charge_cents: 1195
                rate_table: [{zone: 2, min_lbs: 1, max_lbs: 20, cents_per_lb: 380}, {zone: 2, min_lbs: 21, max_lbs: 70, cents_per_lb: 340}, {zone: 2, min_lbs: 71, max_lbs: 9999, cents_per_lb: 305}]
                tier_discount_table: [{min_transportation_subtotal_cents: 50000, discount_bps: 550}]
              as: CarrierAdmin
              captures: { c1: $.data.id }
            - call: "POST /rate-contracts/${c1}/activate"
              payload: { expected_shipper_account_version: "${sh_v}" }
              as: CarrierAdmin
            - call: "POST /shipments"
              payload: { shipper_id: "${sh}", service_level_id: "${sl}", tracking_number: "1Z-V-0001", zone: 2, residential_declared: false, declared_length_in: 10, declared_width_in: 10, declared_height_in: 20, declared_weight_lbs: 30.0 }
              as: CarrierOps
              captures: { p: $.data.id, p_v1: $.data.version }
          trigger:
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "MANUAL_REWEIGH", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 22, scanned_weight_lbs: 31.0, expected_shipment_version: "${p_v1}" }
              as: CarrierOps
              captures: { scan1: $.data.id }
            - call: "GET /shipments/${p}"
              payload: {}
              as: CarrierOps
              captures: { ms: $.data.measurement_status, p_v2: $.data.version }
