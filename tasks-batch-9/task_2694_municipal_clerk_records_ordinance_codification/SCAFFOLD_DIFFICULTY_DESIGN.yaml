  # ===================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: close_violating_both_disclosure_state_and_fee_balance_returns_not_closable
        grounds:
          - validations[priority=40]
          - validations[priority=80]
          - errors[ERR_REQUEST_NOT_CLOSABLE]
          - errors[ERR_FEE_BALANCE_OUTSTANDING]
        distinguishing_aspect: |
          A close request violates priority 40 (state: fulfillment_status is
          UNDER_REVIEW, not one of RELEASED / PARTIALLY_RELEASED / DENIED) AND
          priority 80 (business_fiscal: fee_balance_cents is 1875, not zero).
          The state category outranks the fiscal category, so the response is
          exactly ERR_REQUEST_NOT_CLOSABLE (409) and never
          ERR_FEE_BALANCE_OUTSTANDING.
        test_recipe:
          setup:
            - "A public records request in fulfillment_status UNDER_REVIEW with an assessed FLAT_SCHEDULE fee of 1875 cents and nothing paid."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Ada Vance", requester_email: "ada@example.org", subject_description: "Council correspondence 2025", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-01"
              captures: { req: $.data.id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/assess-fee"
              payload: { fee_schedule_variant: "FLAT_SCHEDULE", fee_lines: [ { page_count: 60, staff_minutes: 45, delivery_medium: "PAPER" } ] }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/records-requests/${req}/close"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_REQUEST_NOT_CLOSABLE"
            - "${err} != ERR_FEE_BALANCE_OUTSTANDING"
            - "PublicRecordsRequest.${req}.fulfillment_status == UNDER_REVIEW"
            - "PublicRecordsRequest.${req}.fee_balance_cents == 1875"
            - "PublicRecordsRequest.${req}.closed_on == null"

      - name: reschedule_violating_both_notice_deadline_and_venue_window_returns_notice_deadline_missed
        grounds:
          - validations[priority=50]
          - validations[priority=64]
          - errors[ERR_NOTICE_DEADLINE_MISSED]
          - errors[ERR_VENUE_WINDOW_CONFLICT]
          - calculations.meeting_notice_requirement
        distinguishing_aspect: |
          A reschedule violates priority 50 (business_safety: moving the start to
          2026-09-14T19:00:00Z puts the already-posted packet's recomputed
          deadline at 2026-09-11T19:00:00Z, before the 2026-09-12T18:00:00Z
          clock) AND priority 64 (business_temporal: the new window overlaps a
          second NOTICED meeting occupying the same venue until 2026-09-14T21:30:00Z
          once its 30-minute teardown buffer is applied). The safety category
          outranks the temporal category, so the response is exactly
          ERR_NOTICE_DEADLINE_MISSED (409).
        test_recipe:
          setup:
            - "One venue with teardown_buffer_minutes 30."
            - "Meeting mA on 2026-09-25T18:00:00Z-21:00:00Z with its packet posted at 2026-09-12T18:00:00Z (deadline 2026-09-22T18:00:00Z, compliant)."
            - "Meeting mB on the same venue at 2026-09-14T18:00:00Z-21:00:00Z."
            - "Clock left at 2026-09-12T18:00:00Z."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_main: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-09-14T18:00:00Z", scheduled_end: "2026-09-14T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mB: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-09-25T18:00:00Z", scheduled_end: "2026-09-25T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mA: $.data.id, mAv: $.data.version }
            - call: "POST /clerk/meetings/${mA}/agenda-packets"
              payload: { expected_meeting_version: "${mAv}", late_addendum: false }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pA: $.data.id }
            - call: "POST /clerk/agenda-packets/${pA}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Quarterly finance report" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pA}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/meetings/${mA}/reschedule"
              payload: { scheduled_start: "2026-09-14T19:00:00Z", scheduled_end: "2026-09-14T22:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_NOTICE_DEADLINE_MISSED"
            - "${err} != ERR_VENUE_WINDOW_CONFLICT"
            - "Meeting.${mA}.scheduled_start == 2026-09-25T18:00:00Z"
            - "Meeting.${mA}.status == NOTICED"
            - "AgendaPacket.${pA}.notice_deadline_at == 2026-09-22T18:00:00Z"
            - "AgendaPacket.${pA}.notice_compliant == true"

      - name: destruction_batch_violating_both_legal_hold_and_item_count_returns_series_under_legal_hold
        grounds:
          - validations[priority=52]
          - validations[priority=62]
          - errors[ERR_SERIES_UNDER_LEGAL_HOLD]
          - errors[ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE]
          - entities.RecordSeries.fields.legal_hold_status
        distinguishing_aspect: |
          Proposing a batch violates priority 52 (business_safety: the series
          carries LITIGATION_HOLD) AND priority 62 (business_constraint:
          item_count 500 exceeds active_item_count 100). The safety category
          outranks the constraint category, so the response is exactly
          ERR_SERIES_UNDER_LEGAL_HOLD (409) — a 409, not the 422 the count rule
          would have produced.
        test_recipe:
          setup:
            - "RecordSeries CC-01 with retention_trigger CREATION and retention_years 5, one accession of 100 items on 2019-06-15 (eligible_through_on 2024-06-15, already elapsed at the 2026-08-01 clock)."
            - "The series is then placed under LITIGATION_HOLD."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-01", name: "Council correspondence", retention_years: 5, retention_trigger: "CREATION", permanent: false, legal_hold_status: "NONE" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 100, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "PUT /clerk/record-series/${series}"
              payload: { legal_hold_status: "LITIGATION_HOLD" }
              as: RecordsOfficer
              as_user_id: "ro-01"
          trigger:
            - call: "POST /clerk/destruction-batches"
              payload: { series_id: "${series}", item_count: 500, cutoff_on: "2024-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_SERIES_UNDER_LEGAL_HOLD"
            - "${err} != ERR_DESTRUCTION_COUNT_EXCEEDS_ACTIVE"
            - "RecordSeries.${series}.eligible_through_on == 2024-06-15"
            - "RecordSeries.${series}.active_item_count == 100"
            - "RecordSeries.${series}.total_accessioned_count == 100"
            - "GET /clerk/destruction-batches?series_id=${series} returns total_count == 0"

      - name: fourth_client_submission_with_wrong_section_returns_cycle_submission_capacity
        grounds:
          - validations[priority=60]
          - validations[priority=90]
          - errors[ERR_CYCLE_SUBMISSION_CAPACITY]
          - errors[ERR_CODE_SECTION_UNKNOWN]
          - entities.SupplementCycle.fields.client_submission_count
        distinguishing_aspect: |
          The fourth client-origin filing violates priority 60
