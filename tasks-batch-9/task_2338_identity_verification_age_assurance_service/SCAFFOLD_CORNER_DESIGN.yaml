        payload: {}
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: "POST /idv/bias-audits/${audit_id}/remediation"
        payload:
          expected_method_profile_version: "${p_doc_v}"
          remediation_note: vendor recalibration
        as: ComplianceOfficer
        as_user_id: co-2
        captures: *id001
      assert:
      - response status is 412 and $.data.error_id == ERR_STALE_METHOD_PROFILE_VERSION
      - "$.data.error_id != ERR_SEGREGATION_OF_DUTIES because co-2 did not evaluate"
      - "MethodProfile.${p_doc_id}.bias_state == RESTRICTED with restricted_at == 2026-08-01T00:00:00Z and version == 2"
      - "BiasAudit.${audit_id}.state == REMEDIATION_REQUIRED with remediation_round == 0 and remediated_at == null"
      - a retry presenting expected_method_profile_version 2 would succeed and would push the profile to version 3
  - name: ladder_selector_skips_the_method_code_already_accepted
