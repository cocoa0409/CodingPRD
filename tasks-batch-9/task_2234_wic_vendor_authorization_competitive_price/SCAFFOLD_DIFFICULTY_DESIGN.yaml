              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-09-08T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-08-25T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-09-09T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /monitoring-visits"
              payload: { vendor_id: "${v1}", visit_type: "ROUTINE", scheduled_for: "2026-08-24T00:00:00Z" }
              as: VendorUnitAnalyst
          assert:
            - "Exactly +7 days (2026-09-08T00:00:00Z): HTTP 409 with error_id == ERR_VISIT_BLACKOUT_CONFLICT — abs difference == 7 days is inside the closed buffer"
            - "Exactly -7 days (2026-08-25T00:00:00Z): HTTP 409 with error_id == ERR_VISIT_BLACKOUT_CONFLICT — the buffer is symmetric, not forward-only"
            - "Exactly +8 days (2026-09-09T00:00:00Z): HTTP 201 with status == SCHEDULED and auto_generated == false"
            - "Exactly -8 days (2026-08-24T00:00:00Z): HTTP 201 — it is 8 days from the anchor and 16 days from the newly created 2026-09-09 visit, so it clears both"
            - "GET /monitoring-visits?vendor_id=${v1}&status=SCHEDULED returns total_count == 3, holding scheduled_for 2026-08-24T00:00:00Z, 2026-09-01T00:00:00Z and 2026-09-09T00:00:00Z"
            - "MonitoringVisit.${visit_anchor} is untouched: status == SCHEDULED, outcome == PENDING, conducted_at == null"

      - name: price_cycle_window_allows_touching_boundary_but_rejects_overlap
        grounds:
          - validations[priority=13]
          - validations[priority=12]
          - validations[priority=11]
          - errors[ERR_CYCLE_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Price cycle windows are half-open, so a new window starting exactly at an
          existing window's submission_due_at is accepted while an overlap of a
          single millisecond is refused — and the two cheaper rules that guard the
          same endpoint (duplicate code at priority 11, inverted window at priority
          12) still pre-empt the overlap check.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z"
            - "Exactly one price cycle exists: 2026Q3 over the half-open window [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), status OPEN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
          trigger:
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q4", submission_open_at: "2026-09-01T00:00:00Z", submission_due_at: "2026-10-01T00:00:00Z" }
              as: VendorUnitSupervisor
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3-BIS", submission_open_at: "2026-08-31T23:59:59.999Z", submission_due_at: "2026-09-15T00:00:00Z" }
              as: VendorUnitSupervisor
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3-DUP", submission_open_at: "2026-08-15T00:00:00Z", submission_due_at: "2026-08-15T00:00:00Z" }
              as: VendorUnitSupervisor
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-11-01T00:00:00Z", submission_due_at: "2026-12-01T00:00:00Z" }
              as: VendorUnitSupervisor
          assert:
            - "2026Q4 starting exactly at 2026Q3's submission_due_at returns HTTP 201 with status == OPEN: the windows touch but the half-open intervals do not intersect"
            - "2026Q3-BIS starting at 2026-08-31T23:59:59.999Z returns HTTP 409 with error_id == ERR_CYCLE_WINDOW_OVERLAP: one millisecond of intersection with 2026Q3 is an overlap, and 2026Q4 (already created) also intersects it"
            - "2026Q3-DUP with submission_open_at == submission_due_at returns HTTP 422 with error_id == ERR_INVALID_CYCLE_WINDOW, not ERR_CYCLE_WINDOW_OVERLAP, even though [2026-08-15, 2026-08-15) sits inside 2026Q3's window — priority 12 precedes priority 13"
            - "Re-using cycle_code 2026Q3 with the non-overlapping window [2026-11-01, 2026-12-01) returns HTTP 409 with error_id == ERR_DUPLICATE_CYCLE_CODE — priority 11 precedes both temporal rules"
            - "PriceCycle.${cycle_q3} is unchanged: status == OPEN, submission_open_at == 2026-08-01T00:00:00Z, submission_due_at == 2026-09-01T00:00:00Z"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: adjustment_apply_then_reverse_conserves_claim_and_vendor_money
        grounds:
          - state_machines.ReimbursementAdjustment.APPLIED_to_REVERSED
          - state_machines.RedemptionClaim.ADJUSTED_to_ADJUDICATED
          - calculations.adjustment_proration
          - entities.Vendor.fields.recoupment_balance_cents
        distinguishing_aspect: |
          Apply then reverse must restore the claim, every line and the vendor
          balance to their exact pre-apply values with no rounding drift, even
          though the recoupment was rounded per line (3 x 12 == 36) rather than on
          the total (round_half_up(37.2) == 37); the money invariant
          adjudicated_total == net_payable + sum(APPLIED recoupments) holds at all
          three checkpoints.
        test_recipe:
          setup:
            - "Chain A plus a JUICE category and ITEM_JUICE upc 00077788899; cycle 2026Q3 closed and published with an ACTIVE juice ceiling of 124 cents"
            - "A claim for 2026-07 with three juice lines of one container at 124 cents each, adjudicated to adjudicated_total_cents 372"
            - "One PENDING adjustment at recoupment_rate 0.10 created by ana-001, with recoupment_cents 36"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "JUICE", name: "Juice bottle", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 2, min_variety_count: 1, max_units_per_transaction: 4, stock_required: false }
              as: VendorUnitSupervisor
              captures: { cat_juice: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_juice}", upc: "00077788899", brand: "Statewide Juice", container_size_oz: 64, contract_brand: false, required_for_authorization: false }
              as: VendorUnitSupervisor
              captures: { item_juice: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors/${v1}/record-training"
              payload: { training_type: "INITIAL", completed_at: "2026-07-15T00:00:00Z" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/submit-application"
              payload: {}
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { sub_v1_milk: $.data.id }
            - call: "POST /price-submissions/${sub_v1_milk}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v1}", food_item_id: "${item_juice}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 118 }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { sub_v1_juice: $.data.id }
            - call: "POST /price-submissions/${sub_v1_juice}/review"
              payload: { decision: "ACCEPT" }
              as: VendorUnitAnalyst
            - call: "POST /vendors/${v1}/authorize"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /price-cycles/${cycle_q3}/close"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /price-cycles/${cycle_q3}/publish-ceilings"
              payload: {}
              as: VendorUnitSupervisor
            - call: "POST /redemption-claims"
              payload: { vendor_id: "${v1}", claim_month: "2026-07", lines: [ { line_number: 1, upc: "00077788899", quantity: 1, charged_unit_price_cents: 124, medical_doc_on_file: false }, { line_number: 2, upc: "00077788899", quantity: 1, charged_unit_price_cents: 124, medical_doc_on_file: false }, { line_number: 3, upc: "00077788899", quantity: 1, charged_unit_price_cents: 124, medical_doc_on_file: false } ] }
              as: VendorOperator
              as_user_id: "${v1}"
              captures: { claim_e: $.data.id }
            - call: "POST /redemption-claims/${claim_e}/adjudicate"
              payload: {}
              as: VendorUnitAnalyst
            - call: "GET /redemption-claims/${claim_e}"
              payload: {}
              as: VendorUnitAnalyst
              captures: { claim_e_v: $.data.version }
            - call: "POST /reimbursement-adjustments"
              payload: { redemption_claim_id: "${claim_e}", reason_code: "OVERCHARGE", recoupment_rate: 0.10, expected_claim_version: "${claim_e_v}" }
              as: VendorUnitAnalyst
              as_user_id: "ana-001"
              captures: { adj_e: $.data.id }
          trigger:
            - call: "POST /reimbursement-adjustments/${adj_e}/apply"
              payload: {}
              as: VendorUnitSupervisor
              as_user_id: "sup-001"
            - call: "POST /reimbursement-adjustments/${adj_e}/reverse"
              payload: { reversal_reason: "Overcharge finding withdrawn after vendor produced shelf tags" }
              as: VendorUnitSupervisor
              as_user_id: "sup-001"
          assert:
            - "Checkpoint 1 (before apply): RedemptionClaim.${claim_e}.adjudicated_total_cents == 372, net_payable_cents == 372, Vendor.${v1}.recoupment_balance_cents == 0, every line recouped_cents == 0, and 372 == 372 + 0"
            - "ReimbursementAdjustment.${adj_e}.recoupment_cents == 36 with line_recoupments recoupment_cents 12, 12, 12 (round_half_up(12.4) per line), not the 37 that round_half_up(37.2) on the total would give"
            - "Checkpoint 2 (after apply): status == APPLIED with applied_by_user_id == sup-001, RedemptionClaim.${claim_e}.status == ADJUSTED with net_payable_cents == 336, each of the three lines recouped_cents == 12, Vendor.${v1}.recoupment_balance_cents == 36, and 372 == 336 + 36"
            - "Checkpoint 3 (after reverse): ReimbursementAdjustment.${adj_e}.status == REVERSED with reversed_at == 2026-08-01T00:00:00Z and the reversal_reason stored"
            - "Checkpoint 3: RedemptionClaim.${claim_e}.status is back to ADJUDICATED with net_payable_cents == 372 exactly, each line recouped_cents == 0 exactly, Vendor.${v1}.recoupment_balance_cents == 0, and 372 == 372 + 0 — no cent of drift from the per-line rounding"
            - "ReimbursementAdjustment.${adj_e}.recoupment_cents is still 36 and line_recoupments is unchanged: the reversal does not rewrite the proration it undid"
            - "RedemptionClaim.${claim_e}.adjudicated_total_cents == 372 and adjudicated_at == 2026-08-01T00:00:00Z at all three checkpoints"

      - name: authorize_then_disqualify_conserves_peer_group_membership_headcount
        grounds:
          - calculations.peer_group_member_count
          - state_machines.Vendor.AUTHORIZED_to_DISQUALIFIED
          - state_machines.SanctionCase.DISQUALIFICATION_IMPOSED_to_CLOSED
          - concurrency_rules.sanction-open-stale-vendor
        distinguishing_aspect: |
          The denormalized member_count is conserved against a full recount across
          a forward/compensating pair on a different aggregate: disqualifying one of
          two members decrements it exactly once, and closing the case from
          DISQUALIFICATION_IMPOSED neither decrements it again nor re-adds the
          sanction points that the disqualification already credited.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; PG-SUPER-A; MILK; ITEM_MILK upc 00011122233; cycle 2026Q3 left OPEN (never closed)"
