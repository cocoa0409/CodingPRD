            - "trigger 1 returns HTTP 200, PickTask.${task_flat}.status == COMPLETED"
            - "OrderLine.${line_flat}.line_status == PICKED, final_line_price_cents == 1400, picked_units == 2"
            - "OrderLine.${line_flat}.nominal_weight_grams == null and picked_weight_grams == null (the supplied 1200 grams is discarded for a non-catchweight line)"
            - "trigger 2 returns HTTP 422 and ${err_weight} == ERR_WEIGHT_OUT_OF_TOLERANCE (deviation_ratio 0.2000 > 0.0500)"
            - "after trigger 2 PickTask.${task_cw}.status is still RETRIEVING and OrderLine.${line_cw}.line_status is still PENDING with final_line_price_cents == null"
            - "trigger 3 returns HTTP 200, PickTask.${task_cw}.status == COMPLETED"
            - "OrderLine.${line_cw}.nominal_weight_grams == 500, picked_weight_grams == 1000, final_line_price_cents == 1200"
            - "CustomerOrder.${order_id}.merchandise_subtotal_cents == 2600, delivery_fee_cents == 599, order_total_cents == 3199"
            - "InventorySku.${sku_flat}.physical_units == 98 and InventorySku.${sku_cw}.physical_units == 98"

      # ---- validation rows already owned by the depth probe (§1.8) ----
      - name: priority_ordering_route_mismatch_beats_minimum_order_excluded
        claim_type: priority_ordering
        grounds:
          - validations[priority=18].ERR_ROUTE_MISMATCH
          - validations[priority=33].ERR_MINIMUM_ORDER_NOT_MET
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_beats_fiscal_on_slot_booking
          rationale: "A single POST /slot-bookings that violates the referential rule at priority 18 and the fiscal rule at priority 33 simultaneously, asserting the 409 rather than the 422, is exactly the named §1.8 instance."
      - name: temporal_validation_maintenance_buffer_overlap_excluded
        claim_type: temporal_validation
        grounds:
          - validations[priority=22].ERR_MAINTENANCE_WINDOW_OVERLAP
          - global_constants.MAINTENANCE_BUFFER_MINUTES
        excluded_because:
          difficulty_instance: resource_temporal_overlap / maintenance_window_buffer_overlap_on_same_grid_zone
          rationale: "A window that is disjoint on raw instants but overlapping once both intervals are widened by MAINTENANCE_BUFFER_MINUTES is the named §1.8 instance; the dock-bay aggregate variant of the same row is dock_bay_aggregate_concurrency_overlap."

  - section: endpoints
    # Coverage notes for this section:
    #   * The `Action endpoint` row (state transition triggers correctly; preconditions enforced)
    #     is discharged wholesale by this file's state_machines section -- every POST action
    #     endpoint in §1.5 appears there with its preconditions exercised.
    #   * The `Conditional action` row is discharged by
    #     loading_sequence_without_a_dock_returns_dock_not_assigned and
    #     release_capacity_promotes_at_most_one_waitlisted_booking in the state_machines section,
    #     plus withhold_capacity_bumps_a_confirmed_booking_but_never_breaches_the_physical_ceiling
    #     in the validations section.
    instances:
      - name: crud_surface_is_create_and_read_only_for_grid_infrastructure
        claim_type: standard_crud
        grounds:
          - endpoints[POST /grid-zones]
          - endpoints[GET /grid-zones/{zoneId}]
          - endpoints[POST /dock-bays]
          - endpoints[GET /dock-bays/{bayId}]
          - endpoints[POST /maintenance-windows]
          - endpoints[GET /maintenance-windows]
        distinguishing_aspect: "§1.5 declares only creates and reads for the infrastructure entities -- there is no PUT, PATCH or DELETE anywhere in the API -- so the CRUD claim is that each created row is byte-faithfully readable both by id and through its declared list filters, with the computed fields at their documented defaults (zone OPERATIONAL with both accuracy scores and last_audited_at null, window SCHEDULED)."
        test_recipe:
          setup:
            - "Clock at the boot default. One AMBIENT grid zone A1 (bot_count 4), one dock bay B1 (parallel_van_capacity 2), and two non-overlapping SCHEDULED maintenance windows on A1: MW1 2026-08-10T01:00-03:00 and MW2 2026-08-10T04:00-06:00 (a 60-minute gap, comfortably beyond the 15-minute buffer)."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /dock-bays"
              payload: { bay_code: "B1", parallel_van_capacity: 2 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { bay_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-10T01:00:00.000Z", window_end: "2026-08-10T03:00:00.000Z" }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { window_1: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", window_start: "2026-08-10T04:00:00.000Z", window_end: "2026-08-10T06:00:00.000Z" }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { window_2: $.data.id }
          trigger:
            - call: "GET /grid-zones/${zone_amb}"
              as: GridEngineer
              as_user_id: "engineer-1"
            - call: "GET /dock-bays/${bay_id}"
              as: WavePlanner
              as_user_id: "planner-1"
            - call: "GET /maintenance-windows/${window_2}"
              as: GridEngineer
              as_user_id: "engineer-1"
            - call: "GET /maintenance-windows"
              payload: { grid_zone_id: "${zone_amb}", status: "SCHEDULED", limit: 10, offset: 0 }
              as: GridEngineer
              as_user_id: "engineer-1"
          assert:
            - "every read returns HTTP 200"
            - "GridZone.${zone_amb}: zone_code == A1, temperature_zone == AMBIENT, bot_count == 4, status == OPERATIONAL, accuracy_score_unit_weighted == null, accuracy_score_sku_weighted == null, last_audited_at == null"
            - "DockBay.${bay_id}: bay_code == B1, parallel_van_capacity == 2"
            - "MaintenanceWindow.${window_2}: grid_zone_id == ${zone_amb}, window_start == 2026-08-10T04:00:00.000Z, window_end == 2026-08-10T06:00:00.000Z, status == SCHEDULED"
            - "the filtered list returns total_count == 2, has_more == false, limit == 10, offset == 0 and contains both ${window_1} and ${window_2}"
            - "no PUT, PATCH or DELETE endpoint is declared for GridZone, DockBay or MaintenanceWindow in §1.5, so the only mutations are the declared POST actions (activate, complete, audit-counts)"
            - "id, created_at and updated_at are present and system-generated on all three created rows"

      - name: bulk_audit_counts_are_applied_all_or_nothing
        claim_type: bulk_action
        grounds:
          - endpoints[POST /grid-zones/{zoneId}/audit-counts]
          - validations[priority=6].ERR_<RESOURCE>_NOT_FOUND
          - validations[priority=8].ERR_INVALID_REQUEST
          - calculations.zone_inventory_accuracy
        distinguishing_aspect: "The counts array is the API's only bulk payload and it has rollback (not skip) semantics: one bogus sku_id anywhere in the array rejects the whole call with ERR_SKU_NOT_FOUND (404) and one SKU belonging to a different zone rejects it with ERR_INVALID_REQUEST (422), in both cases leaving every SKU's last_count_* fields null, every physical_units untouched and the zone still OPERATIONAL with last_audited_at null. Only the fully valid array writes anything, and then it writes every element atomically."
        test_recipe:
          setup:
            - "AMBIENT zone A1 holds AMB-1 (10 physical units) and AMB-2 (10 physical units); CHILLED zone C1 holds CHL-1 (10 physical units)."
          setup_api_calls:
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "C1", temperature_zone: "CHILLED", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_chl: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_1: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-2", name: "Penne", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 750, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_2: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "CHL-1", name: "Fresh Cream", grid_zone_id: "${zone_chl}", temperature_zone: "CHILLED", substitution_group_code: "DAIRY", is_catchweight: false, unit_price_cents: 900, physical_units: 10 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_chl: $.data.id }
          trigger:
            - call: "POST /grid-zones/${zone_amb}/audit-counts"
              payload: { counts: [{ sku_id: "${sku_1}", counted_units: 9 }, { sku_id: "00000000-0000-4000-8000-0000000000a7", counted_units: 5 }] }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /grid-zones/${zone_amb}/audit-counts"
              payload: { counts: [{ sku_id: "${sku_1}", counted_units: 9 }, { sku_id: "${sku_chl}", counted_units: 9 }] }
              as: GridEngineer
              as_user_id: "engineer-1"
              captures: { err_foreign: $.data.error_id }
            - call: "POST /grid-zones/${zone_amb}/audit-counts"
              payload: { counts: [{ sku_id: "${sku_1}", counted_units: 9 }, { sku_id: "${sku_2}", counted_units: 10 }] }
              as: GridEngineer
              as_user_id: "engineer-1"
          assert:
            - "trigger 1 returns HTTP 404 and ${err_missing} == ERR_SKU_NOT_FOUND"
            - "trigger 2 returns HTTP 422 and ${err_foreign} == ERR_INVALID_REQUEST (CHL-1 does not belong to zone A1)"
            - "after triggers 1 and 2: InventorySku.${sku_1}.physical_units == 10 and last_count_system_units == null and last_count_counted_units == null and last_count_variance_units == null"
            - "after triggers 1 and 2: GridZone.${zone_amb}.status == OPERATIONAL, accuracy_score_unit_weighted == null, last_audited_at == null"
            - "after triggers 1 and 2: InventorySku.${sku_chl}.physical_units == 10 and last_count_system_units == null"
            - "trigger 3 returns HTTP 200 and writes both elements: InventorySku.${sku_1} has last_count_system_units == 10, last_count_counted_units == 9, last_count_variance_units == 1, physical_units == 9, on_hand_units == 9"
            - "trigger 3 also writes InventorySku.${sku_2}: last_count_system_units == 10, last_count_counted_units == 10, last_count_variance_units == 0, physical_units == 10"
            - "GridZone.${zone_amb}.accuracy_score_unit_weighted == 0.9500 (1 - 1/20) and accuracy_score_sku_weighted == 0.9500 (mean of 0.9 and 1.0)"
            - "GridZone.${zone_amb}.status == AUDIT_HOLD and last_audited_at == 2026-08-01T00:00:00.000Z"
            - "GridZone.${zone_chl}.status == OPERATIONAL (the other zone is never touched)"

      - name: assign_tote_links_a_task_only_to_a_tote_of_its_own_wave
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /pick-tasks/{taskId}/assign-tote]
          - state_machines.PickTask[QUEUED -> QUEUED]
          - entities.Tote.assigned_line_count
          - validations[priority=6].ERR_<RESOURCE>_NOT_FOUND
        distinguishing_aspect: "Both sides of the link must exist AND belong together: a non-existent tote_id yields ERR_TOTE_NOT_FOUND (404) from the body-FK check, while an existing OPEN tote of the OTHER wave yields ERR_INVALID_STATE (409) even though its temperature_zone matches perfectly. Only the same-wave tote links, and the link is visible from both ends -- task.tote_id is set and that tote's assigned_line_count becomes 1 while the foreign tote's stays 0."
        test_recipe:
          setup:
            - "Route R1, AMBIENT zone A1, AMBIENT station S1 (max 3 totes), SKU AMB-1 at 700 cents with 100 units, and two far-future slots on R1 with total_capacity_units 10 each."
            - "Order A (2 x AMB-1) is confirmed on slot 1 and waved into WA; order B (2 x AMB-1) is confirmed on slot 2 and waved into WB; both waves are started, so each line has a QUEUED PickTask with tote_id null."
            - "Tote TA is opened on WA and tote TB on WB, both AMBIENT and both at S1."
          setup_api_calls:
            - call: "POST /delivery-routes"
              payload: { route_code: "R1", service_area_name: "North", van_capacity_totes: 40, base_delivery_fee_cents: 599, per_km_cost_cents: 150 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { route_id: $.data.id }
            - call: "POST /grid-zones"
              payload: { zone_code: "A1", temperature_zone: "AMBIENT", bot_count: 4 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { zone_amb: $.data.id }
            - call: "POST /pick-stations"
              payload: { station_code: "S1", temperature_zone_capability: ["AMBIENT"], max_concurrent_totes: 3 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { station_id: $.data.id }
            - call: "POST /inventory-skus"
              payload: { sku_code: "AMB-1", name: "Pasta", grid_zone_id: "${zone_amb}", temperature_zone: "AMBIENT", substitution_group_code: "DRY", is_catchweight: false, unit_price_cents: 700, physical_units: 100 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { sku_id: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T10:00:00.000Z", window_end: "2026-08-05T12:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_1: $.data.id }
            - call: "POST /delivery-slots"
              payload: { route_id: "${route_id}", window_start: "2026-08-05T14:00:00.000Z", window_end: "2026-08-05T16:00:00.000Z", total_capacity_units: 10, withheld_units: 0 }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { slot_2: $.data.id }
            - call: "POST /customer-accounts"
              payload: { email: "a@example.com", full_name: "Ada Lane", loyalty_tier: "BASIC", home_route_id: "${route_id}" }
              as: FulfillmentAdmin
              as_user_id: "admin-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customer-orders"
              payload: { stop_distance_km: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_a: $.data.id }
            - call: "POST /customer-orders/${order_a}/lines"
              payload: { sku_id: "${sku_id}", ordered_qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_a: $.data.id }
            - call: "GET /customer-orders/${order_a}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { va: $.data.version }
            - call: "POST /slot-bookings"
