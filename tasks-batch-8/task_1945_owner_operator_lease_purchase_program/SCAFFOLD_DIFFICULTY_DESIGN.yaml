        grounds:
          - state_machines.LeaseAgreement.ACTIVE_to_DEFAULTED
          - state_machines.LeaseAgreement.DEFAULTED_to_ACTIVE
          - calculations.missed_payment_tracking
        distinguishing_aspect: |
          LeaseAgreement cycles ACTIVE -> DEFAULTED -> ACTIVE (cure) and may then be
          defaulted again — a cycle on LeaseAgreement, distinct from the settlement
          dispute cycle; cure resets missed_payment_count to 0 so a fresh declare-default
          immediately after cure fails with ERR_LEASE_NOT_DEFAULT_ELIGIBLE.
        test_recipe:
          setup:
            - "ACTIVE lease (standard terms, cap 500000) with lane ACCEPTED"
            - "W1, W2, W3 finalized as all-zero short payments (load_declined true) -> missed_payment_count 3, arrears 195000"
          setup_api_calls:
            - { call: "POST /lease-program/owner-operators", payload: { legal_name: "Pat Owner", cdl_number: "CDL-NL1" }, as: LeaseAdmin, captures: { op: $.data.id } }
            - { call: "POST /lease-program/compliance-documents", payload: { owner_operator_id: "${op}", doc_type: "W9", expires_on: "2027-08-01" }, as: ComplianceOfficer, captures: { d1: $.data.id } }
