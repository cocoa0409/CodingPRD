scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: idr_save_vs_ibr_same_borrower_diverge
        grounds:
          - calculations.idr_monthly_payment
          - entities.RepaymentPlan.fields.monthly_payment_cents
          - entities.IncomeCertification.fields.agi_cents
        distinguishing_aspect: |
          Same Borrower (AGI=$60,000, family_size=2, CONTIGUOUS_48) yields
          monthly_payment_cents=35513 under IBR variant and 10513 under SAVE
          variant — divergence on RepaymentPlan entity from one IDR formula
          tree across plan_type variants.
        test_recipe:
          setup:
            - "Borrower exists with full_name='Jane Borrower', is_veteran=false"
            - "Loan exists for the borrower: DIRECT_UNSUB, principal=$30,000, rate=5.33%, in REPAYMENT"
            - "IncomeCertification CERTIFIED: agi_cents=6_000_000, family_size=2, state_code=CA"
            - "Two RepaymentPlans created (IBR and SAVE), both for the same loan, both PENDING"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Jane Borrower", ssn_last4: "1234", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 3000000, interest_rate_bps: 533, disbursement_date: "2023-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v: $.data.version }
            - call: "POST /loan-servicing/income-certifications"
              payload: { borrower_id: "${b_id}", agi_cents: 6000000, family_size: 2, state_code: "CA", effective_date: "2026-05-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /loan-servicing/income-certifications/${ic_id}/certify"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "IBR", effective_date: "2026-06-01T00:00:00Z", expected_loan_version: "${ln_v}" }
              as: LoanServicer
              captures: { ibr_id: $.data.id, ibr_mp: $.data.monthly_payment_cents, ln_v2: $.data.version }
          trigger:
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "SAVE", effective_date: "2026-06-01T00:00:00Z", expected_loan_version: "${ln_v2}" }
              as: LoanServicer
              captures: { save_id: $.data.id, save_mp: $.data.monthly_payment_cents }
          assert:
            - "${ibr_mp} == 35513"
            - "${save_mp} == 10513"
            - "${ibr_mp} != ${save_mp}"

      - name: interest_accrual_chronological_vs_sum_then_round_diverge
        grounds:
          - calculations.interest_accrual
          - entities.Loan.fields.accrued_interest_cents
        distinguishing_aspect: |
          On Loan entity domain, the chronological_per_day_rounding variant
          accrues 4560 cents over 30 days (152*30) for principal=1_111_111
          at 5.00%; sum_then_round variant would accrue 4566 cents.
          Different entity (Loan, not RepaymentPlan) and different formula
          family from the IDR dual-variant.
        test_recipe:
          setup:
            - "Borrower and DIRECT_UNSUB Loan exist with principal=1_111_111 cents, rate=500 bps"
            - "Loan is in REPAYMENT status from 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Acc B", ssn_last4: "0001", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1111111, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LoanServicer
          assert:
            - "Loan.${ln_id}.accrued_interest_cents == 4560"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: idr_payment_mode_a_3_inputs_nonlinear
        grounds:
          - calculations.idr_monthly_payment
          - entities.IncomeCertification.fields.state_code
        distinguishing_aspect: |
          Mode (a): ≥3 inputs (AGI, family_size, state_code-keyed poverty
          guideline, plan_type) feed nested branches: state-keyed tier
          selection AND plan-type-keyed (rate × discretionary multiplier)
          selection. AK uses pg_base=1_947_000 / pg_per=686_000 while CA
          uses 1_558_000 / 548_000, so identical AGI yields different
          monthly_payment_cents under SAVE. Alaska borrower AGI=6_000_000,
          family_size=2, SAVE plan → expected monthly = round_half_up(0.10
          * max(0, 6_000_000 - 2.25 * (1_947_000 + 686_000)) / 12) =
          round_half_up(0.10 * 75750 / 12) = 631 cents. (Below CA's 10513
          for the same AGI and family — interaction of state_code with
          plan_type is non-linear.)
        test_recipe:
          setup:
            - "Borrower with an Alaska income certification (state_code=AK) AGI=6_000_000"
            - "Loan exists in REPAYMENT for the borrower"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "AK Borrower", ssn_last4: "9991", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 2000000, interest_rate_bps: 500, disbursement_date: "2023-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v: $.data.version }
            - call: "POST /loan-servicing/income-certifications"
              payload: { borrower_id: "${b_id}", agi_cents: 6000000, family_size: 2, state_code: "AK", effective_date: "2026-05-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /loan-servicing/income-certifications/${ic_id}/certify"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "SAVE", effective_date: "2026-06-01T00:00:00Z", expected_loan_version: "${ln_v}" }
              as: LoanServicer
              captures: { p_id: $.data.id, mp: $.data.monthly_payment_cents }
          assert:
            - "${mp} == 631"

      - name: interest_accrual_mode_b_round_per_day_then_sum_pinned
        grounds:
          - calculations.interest_accrual
          - calculations.interest_accrual.variants.chronological_per_day_rounding
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. 'Round per day
          then sum' (pinned) yields 4560 cents over 30 days at P=1_111_111,
          rate=5.00%; 'sum then round' yields 4566. The scaffold pins the
          per-day-then-sum order; this instance asserts the pinned order
          is enforced (the assertion would FAIL for the alternative order).
          Distinct mode from idr_payment_mode_a (which is mode-a multi-input
          branching with no rounding-order ambiguity).
        test_recipe:
          setup:
            - "DIRECT_UNSUB Loan in REPAYMENT since 2026-06-01, principal=1_111_111, rate=500 bps"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Rnd B", ssn_last4: "0002", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1111111, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: LoanServicer
          assert:
            - "Loan.${ln_id}.accrued_interest_cents == 4560"
            - "Loan.${ln_id}.accrued_interest_cents != 4566"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_cyclic_repayment_deferment_repayment
        grounds:
          - state_machines.Loan.transitions.REPAYMENT_to_DEFERMENT
          - state_machines.Loan.transitions.DEFERMENT_to_REPAYMENT
        distinguishing_aspect: |
          Loan state machine is cyclic: REPAYMENT -> DEFERMENT -> REPAYMENT
          (also REPAYMENT -> FORBEARANCE -> REPAYMENT and DEFAULT ->
          REPAYMENT via rehabilitation). The Loan entity exhibits at least
          one A->B->A cycle, distinct from any linear-only pipeline.
        test_recipe:
          setup:
            - "Loan in REPAYMENT"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Cyc B", ssn_last4: "0010", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1000000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/request-deferment"
              payload: {}
              as: Borrower
              as_user_id: "${b_id}"
              captures: { ln_v_def: $.data.version, st1: $.data.status }
            - call: "POST /loan-servicing/loans/${ln_id}/resume-repayment"
              payload: {}
              as: LoanServicer
              captures: { st2: $.data.status }
          assert:
            - "${st1} == DEFERMENT"
            - "${st2} == REPAYMENT"

      - name: discharge_application_branching_approve_or_deny
        grounds:
          - state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_APPROVED
          - state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_DENIED
        distinguishing_aspect: |
          Different entity (DischargeApplication, not Loan): non-linear
          branching shape — from UNDER_REVIEW the same fork point reaches
          either APPROVED (with cascades) or DENIED (terminal-no-cascade).
          The two branches have divergent side-effect sets — APPROVED fires
          a 3-level cascade (DischargeApp -> Loan -> Payment), DENIED has
          no cascade.
        test_recipe:
          setup:
            - "DischargeApplication in UNDER_REVIEW, discharge_type=VETERAN_TOTAL_DISABILITY, borrower is_veteran=true"
            - "Parent Loan in REPAYMENT"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Vet B", ssn_last4: "0011", is_veteran: true }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1000000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/discharge-applications"
              payload: { loan_id: "${ln_id}", discharge_type: "VETERAN_TOTAL_DISABILITY" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { da_id: $.data.id }
            - call: "POST /loan-servicing/discharge-applications/${da_id}/begin-review"
              payload: {}
              as: LoanServicer
              captures: { da_v: $.data.version }
          trigger:
            - call: "POST /loan-servicing/discharge-applications/${da_id}/approve"
              payload: { review_notes: "VA disability rating verified", expected_application_version: "${da_v}" }
              as: LoanServicer
              captures: { da_status: $.data.status }
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { ln_status: $.data.status, ln_bal: $.data.principal_balance_cents }
          assert:
            - "${da_status} == APPROVED"
            - "${ln_status} == DISCHARGED"
            - "${ln_bal} == 0"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: discharge_approve_depth3_app_loan_payment
        grounds:
          - state_machines.DischargeApplication.transitions.UNDER_REVIEW_to_APPROVED
          - state_machines.Loan.transitions.REPAYMENT_to_DISCHARGED
          - state_machines.Payment.transitions.PENDING_to_REVERSED
        distinguishing_aspect: |
          Depth-3 chain triggered by discharge-approve: A (DischargeApp
          UNDER_REVIEW->APPROVED) causes B (parent Loan REPAYMENT->
          DISCHARGED with balance zeroing); B's own transition then triggers
          C (every PENDING Payment of that Loan -> REVERSED). Each link
          is caused by the previous link's side_effects.
        test_recipe:
          setup:
            - "Veteran borrower, Loan in REPAYMENT"
            - "One PENDING Payment exists for the loan (status=PENDING)"
            - "DischargeApplication in UNDER_REVIEW for VETERAN_TOTAL_DISABILITY"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Casc V", ssn_last4: "0020", is_veteran: true }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 500000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/payments"
              payload: { loan_id: "${ln_id}", amount_cents: 10000, payment_date: "2026-06-01T00:00:00Z" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { pay_id: $.data.id }
            - call: "POST /loan-servicing/discharge-applications"
              payload: { loan_id: "${ln_id}", discharge_type: "VETERAN_TOTAL_DISABILITY" }
              as: Borrower
              as_user_id: "${b_id}"
              captures: { da_id: $.data.id }
            - call: "POST /loan-servicing/discharge-applications/${da_id}/begin-review"
              payload: {}
              as: LoanServicer
              captures: { da_v: $.data.version }
          trigger:
            - call: "POST /loan-servicing/discharge-applications/${da_id}/approve"
              payload: { review_notes: "approved", expected_application_version: "${da_v}" }
              as: LoanServicer
            - call: "GET /loan-servicing/payments/${pay_id}"
              payload: {}
              as: LoanServicer
              captures: { pay_status: $.data.status }
            - call: "GET /loan-servicing/loans/${ln_id}"
              payload: {}
              as: LoanServicer
              captures: { ln_status: $.data.status }
          assert:
            - "${ln_status} == DISCHARGED"
            - "${pay_status} == REVERSED"

      - name: default_declare_depth2_loan_plan
        grounds:
          - state_machines.Loan.transitions.REPAYMENT_to_DEFAULT
          - state_machines.RepaymentPlan.transitions.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Different trigger (declare-default vs discharge-approve): a
          depth-2 cascade A (Loan REPAYMENT->DEFAULT) causes B (the ACTIVE
          RepaymentPlan transitions ACTIVE->SUPERSEDED via the cascade
          arm whose preconditions are 'parent Loan -> DEFAULT'). The B
          transition is caused by A's side-effects (cascade-supersede),
          not by a direct API call.
        test_recipe:
          setup:
            - "Loan in REPAYMENT with a CURRENTLY ACTIVE RepaymentPlan (STANDARD plan), Loan.delinquency_days >= 270"
            - "(delinquency achieved by setting the clock forward 280 days past the start-repayment date with no payment posted; default_delinquency_days computed from server clock minus expected first scheduled date)"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2025-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Def B", ssn_last4: "0030", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 1000000, interest_rate_bps: 500, disbursement_date: "2025-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
            - call: "POST /loan-servicing/loans/${ln_id}/enter-school"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/graduate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/loans/${ln_id}/start-repayment"
              payload: {}
              as: LoanServicer
              captures: { ln_v_sr: $.data.version }
            - call: "POST /loan-servicing/repayment-plans"
              payload: { loan_id: "${ln_id}", plan_type: "STANDARD", effective_date: "2025-06-01T00:00:00Z", expected_loan_version: "${ln_v_sr}" }
              as: LoanServicer
              captures: { rp_id: $.data.id }
            - call: "POST /loan-servicing/repayment-plans/${rp_id}/activate"
              payload: {}
              as: LoanServicer
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: LoanServicer
          trigger:
            - call: "POST /loan-servicing/loans/${ln_id}/declare-default"
              payload: {}
              as: CollectionsAgent
              captures: { ln_status: $.data.status }
            - call: "GET /loan-servicing/repayment-plans/${rp_id}"
              payload: {}
              as: LoanServicer
              captures: { rp_status: $.data.status }
          assert:
            - "${ln_status} == DEFAULT"
            - "${rp_status} == SUPERSEDED"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_vs_business_safety_default_threshold_wins_over_invalid_state
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair: state (ERR_INVALID_STATE) vs business_constraint
          (ERR_DEFAULT_THRESHOLD_NOT_MET). Calling declare-default on a
          loan in IN_SCHOOL (wrong from-state) AND with delinquency_days <
          270 — both checks fail. Higher-priority state check (priority 6)
          wins → ERR_INVALID_STATE, not ERR_DEFAULT_THRESHOLD_NOT_MET.
        test_recipe:
          setup:
            - "Loan in IN_SCHOOL (not REPAYMENT)"
          setup_api_calls:
            - call: "POST /loan-servicing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
            - call: "POST /loan-servicing/borrowers"
              payload: { full_name: "Pri B", ssn_last4: "0040", is_veteran: false }
              as: LoanServicer
              captures: { b_id: $.data.id }
            - call: "POST /loan-servicing/loans"
              payload: { borrower_id: "${b_id}", loan_type: "DIRECT_UNSUB", principal_cents: 100000, interest_rate_bps: 500, disbursement_date: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              captures: { ln_id: $.data.id }
