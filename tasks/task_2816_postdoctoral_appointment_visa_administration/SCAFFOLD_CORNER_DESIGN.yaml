              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_58"
              captures: { p58_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${p58_id}", mentor_id: "${m58_id}", funding_source_id: "${f58_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 58000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_58"
              captures: { a58_id: "$.data.id", a58_ver: "$.data.version", a58_floor: "$.data.salary_floor_usd", a58_prep: "$.data.prepared_by_user_id" }
          trigger:
            - call: "POST /appointments/${a58_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_58"
              captures: { below_err: "$.data.error_id" }
            - call: "POST /appointments/${a58_id}/salary-exception"
              payload: { expected_appointment_version: "${a58_ver}", exception_floor_usd: 61008.00, justification: "Match the scale floor exactly." }
              as: HRCompensationApprover
              as_user_id: "hr_appr_16"
