# =============================================================================
# PRD Benchmark Seed Tables
# Task 3082: Do-It-Yourself Tax Software Tier Gating & Free-File Eligibility
# (TurboTax-style)
# =============================================================================

scenario: |
  Do-It-Yourself Tax Software Tier Gating & Free-File Eligibility (TurboTax):
  question flow that classifies a return's complexity and determines the
  required product tier, free filing eligibility determined by form usage and
  income with disclosure obligations, mid-return upgrade prompts with price
  change acknowledgment and downgrade paths, prior-year data import and
  carryforward of depreciation, basis and loss items, refund transfer product
  paying fees from the refund with bank partner disclosures, calculation
  accuracy guarantee claim handling with penalty reimbursement, electronic
  filing rejection codes with guided correction and resubmission, state
  return add-ons and multi-state allocation logic

domain_name: diy-tax-tier-gating
api_prefix: /tax

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: TaxpayerAccount
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Unique account email across all accounts" }
      - { name: full_name, type: string, source: input, description: "Taxpayer legal name" }
      - { name: filing_status, type: enum, source: input, description: "SINGLE | MARRIED_FILING_JOINTLY | MARRIED_FILING_SEPARATELY | HEAD_OF_HOUSEHOLD | QUALIFYING_WIDOWER" }
      - { name: agi_cents, type: integer, source: input, description: "Adjusted gross income in whole cents; >= 0; drives the free-file income gate" }
      - { name: resident_state_code, type: string, source: input, description: "Two-letter state of residence; marks the resident StateReturn" }
      - { name: accuracy_guarantee_enrolled, type: boolean, source: input, default: true, description: "Whether the account is enrolled in the calculation accuracy guarantee program" }
      - { name: disclosure_accepted_version, type: string, source: system, description: "Version tag of the refund-transfer bank disclosure the taxpayer last accepted; null until accepted" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; SUSPENDED blocks all return mutations" }

  - name: ProductTier
    parent: null
    common_fields: false
    fields:
      - { name: code, type: enum, source: input, description: "FREE | DELUXE | PREMIER | SELF_EMPLOYED; unique" }
      - { name: price_cents, type: integer, source: input, description: "Federal product price in cents; >= 0" }
      - { name: state_addon_price_cents, type: integer, source: input, description: "Per-state add-on price in cents; >= 0" }
      - { name: supported_forms, type: array, source: input, description: "Array of FormSpec codes this tier supports natively" }
      - { name: tier_rank, type: integer, source: input, description: "Ordinal rank: FREE=0, DELUXE=1, PREMIER=2, SELF_EMPLOYED=3; drives minimum-tier classification" }

  - name: FormSpec
    parent: null
    common_fields: false
    fields:
      - { name: code, type: string, source: input, description: "Form code, e.g. F1040, SCH_C, SCH_D, F8949, SCH_E, F4562, W2_WH; unique" }
      - { name: minimum_tier, type: enum, source: input, description: "FREE | DELUXE | PREMIER | SELF_EMPLOYED — the cheapest tier supporting this form" }
      - { name: disqualifies_free_file, type: boolean, source: input, description: "If true, presence of this form on a return makes the return ineligible for free filing regardless of income" }
      - { name: counts_toward_refund, type: boolean, source: input, default: false, description: "If true, the amount_cents of ACTIVE forms with this code sum into TaxReturn.federal_refund_cents (withholding / estimated payments)" }

  - name: PriorYearReturnSnapshot
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> TaxpayerAccount.id; owner of this snapshot" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year of the source return" }
      - { name: carryforward_items, type: array, source: input, description: "Array of { item_type: DEPRECIATION|CAPITAL_LOSS|BASIS, asset_tag: string, remaining_amount_cents: integer }" }
      - { name: import_status, type: enum, source: system, description: "AVAILABLE | IMPORTED | SUPERSEDED; a snapshot becomes SUPERSEDED when a newer snapshot for the same (account, tax_year) is registered" }

  - name: TaxReturn
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> TaxpayerAccount.id; owner of this return" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year being filed" }
      - { name: current_tier, type: enum, source: system, description: "FREE | DELUXE | PREMIER | SELF_EMPLOYED; the tier the return is currently priced at; starts FREE and ratchets up via prompt acknowledgment or select-tier" }
      - { name: minimum_required_tier, type: enum, source: computed, description: "Cheapest tier covering every ACTIVE form; recomputed on form add/remove, prior-year import, and at submit-review (settled pass)" }
      - { name: free_file_eligible, type: boolean, source: computed, description: "True iff (no ACTIVE form whose FormSpec.disqualifies_free_file) AND (account.agi_cents <= FREE_FILE_AGI_LIMIT_CENTS)" }
      - { name: upgrade_prompt_pending, type: boolean, source: computed, description: "True while any UpgradePrompt for this return is PENDING; gates submit-review" }
      - { name: refund_transfer_selected, type: boolean, source: system, default: false, description: "Set true by refund-transfer disclosure acceptance, false by void; never set directly" }
      - { name: federal_refund_cents, type: integer, source: computed, description: "Sum of amount_cents over ACTIVE ReturnForms whose FormSpec.counts_toward_refund is true; negative means amount owed; drives refund-transfer feasibility" }
      - { name: total_fees_due_cents, type: integer, source: computed, description: "tier price + per-state add-on prices + refund-transfer service fee (when elected); recomputed on tier change, state-return add/remove, refund-transfer election/void, and at submit-review" }
      - { name: status, type: enum, source: system, description: "DRAFT | READY_FOR_REVIEW | SUBMITTED | ACCEPTED | REJECTED | AMENDED" }

  - name: ReturnForm
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; the return this form is attached to" }
      - { name: form_code, type: string, source: input, description: "FK -> FormSpec.code; which form this row represents" }
      - { name: source, type: enum, source: system, description: "MANUAL | IMPORTED; IMPORTED rows are created only by prior-year import" }
      - { name: carryforward_item_type, type: enum, source: system, description: "DEPRECIATION | CAPITAL_LOSS | BASIS | NONE; set for imported carryforward rows, NONE for manual" }
      - { name: amount_cents, type: integer, source: input, description: "Dollar amount in cents carried on this form line; may be negative for losses" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED; REMOVED rows are excluded from classification and refund math but retained for audit" }

  - name: UpgradePrompt
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; the return that triggered the prompt" }
      - { name: from_tier, type: enum, source: system, description: "return.current_tier at prompt creation" }
      - { name: to_tier, type: enum, source: system, description: "minimum_required_tier at prompt creation" }
      - { name: price_delta_cents, type: integer, source: computed, description: "ProductTier[to_tier].price_cents - ProductTier[from_tier].price_cents, frozen at creation for price-change acknowledgment" }
      - { name: acknowledged, type: boolean, source: system, description: "True once the taxpayer accepts the price change" }
      - { name: status, type: enum, source: system, description: "PENDING | ACKNOWLEDGED | DECLINED_DOWNGRADED | SUPERSEDED" }

  - name: StateReturn
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; parent federal return" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code for this add-on return" }
      - { name: is_resident_state, type: boolean, source: computed, description: "True iff state_code == account.resident_state_code" }
      - { name: allocation_numerator_cents, type: integer, source: input, description: "Non-resident states: income sourced to this state in cents; >= 0; must be <= allocation_denominator_cents" }
      - { name: allocation_denominator_cents, type: integer, source: input, description: "Non-resident states: total allocation base income in cents; required > 0 whenever numerator > 0" }
      - { name: residency_start_date, type: string, source: input, description: "Optional ISO date (YYYY-MM-DD); part-year residency window start for this state" }
      - { name: residency_end_date, type: string, source: input, description: "Optional ISO date (YYYY-MM-DD); half-open window end; required whenever residency_start_date is present and must be > start" }
      - { name: allocated_tax_cents, type: integer, source: computed, description: "State tax after the allocation fraction (non-resident) or full AGI tax (resident)" }
      - { name: status, type: enum, source: system, description: "DRAFT | READY | FILED | REMOVED" }

  - name: FilingAttempt
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; return this attempt transmitted" }
      - { name: attempt_sequence, type: integer, source: computed, description: "1-based monotonically increasing sequence per return; assigned at creation in created_at order" }
      - { name: transmission_payload_hash, type: string, source: input, description: "Client-supplied hash of the transmitted payload; identifies resubmissions" }
      - { name: outcome, type: enum, source: system, description: "PENDING | ACCEPTED | REJECTED" }
      - { name: rejection_code, type: enum, source: system, description: "Null unless REJECTED; R0000_SSN_MISMATCH | R0500_NAME_CONTROL | R1000_DUPLICATE_FILED | R2000_DEPENDENT_CLAIMED | R3000_MATH_ERROR" }
      - { name: correction_hint, type: string, source: computed, description: "Guided-correction text mapped from rejection_code; null until REJECTED" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock timestamp when outcome left PENDING; anchors the amendment hold window" }

  - name: RefundTransferAgreement
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; the return whose fees are paid from the refund" }
      - { name: bank_partner_code, type: string, source: input, description: "Code of the partner bank receiving the refund" }
      - { name: service_fee_cents, type: integer, source: computed, description: "Fixed REFUND_TRANSFER_FEE_CENTS charged by the bank partner; frozen at agreement creation" }
      - { name: disclosure_version, type: string, source: system, description: "Bank disclosure version presented; fixed at agreement creation from the active disclosure registry" }
      - { name: status, type: enum, source: system, description: "PENDING_DISCLOSURE | ACTIVE | SETTLED | VOIDED" }

  - name: AccuracyClaim
    parent: TaxpayerAccount
    common_fields: true
    fields:
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id; the filed return the claim is against" }
      - { name: claimed_error_amount_cents, type: integer, source: input, description: "Penalty/interest the taxpayer attributes to a software calculation error; > 0" }
      - { name: reviewed_error_amount_cents, type: integer, source: system, description: "Amount the ClaimsAdjuster verified as software-caused; set at adjudication" }
      - { name: reimbursement_cents, type: integer, source: computed, description: "min(reviewed, claimed) capped at GUARANTEE_CAP_CENTS; 0 while pending or denied" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | APPROVED | PARTIALLY_APPROVED | DENIED | PAID" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TaxpayerAccount
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tax/accounts/{accountId}/suspend"
        actor: PlatformOperator
        preconditions: []
        side_effects:
          - "all mutating endpoints on the account's returns begin failing with ERR_ACCOUNT_SUSPENDED"
        note: "One-way; no reactivation endpoint exists in this surface"

  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: READY_FOR_REVIEW
        trigger: "POST /tax/returns/{returnId}/submit-review"
        actor: Taxpayer
        preconditions:
          - "account.status == ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "no PENDING UpgradePrompt exists for this return (ERR_UPGRADE_ACK_REQUIRED)"
          - "settled minimum_required_tier rank <= current_tier rank (ERR_TIER_BELOW_REQUIRED)"
          - "at least one ReturnForm with status == ACTIVE exists (ERR_NO_FORMS_ON_RETURN)"
          - "if current_tier == FREE then free_file_eligible must be true (ERR_FREE_FILE_INELIGIBLE)"
        side_effects:
          - "settled_classification recompute of minimum_required_tier"
          - "total_fees_due_cents recomputed"
          - "increments TaxReturn.version by 1"

      - from: AMENDED
        to: READY_FOR_REVIEW
        trigger: "POST /tax/returns/{returnId}/submit-review"
        actor: Taxpayer
        preconditions:
          - "same preconditions as DRAFT -> READY_FOR_REVIEW"
        side_effects:
          - "same side effects as DRAFT -> READY_FOR_REVIEW"

      - from: READY_FOR_REVIEW
        to: DRAFT
        trigger: "POST /tax/returns/{returnId}/reopen"
        actor: Taxpayer
        preconditions:
          - "no FilingAttempt with outcome == PENDING exists for this return (ERR_FILING_IN_FLIGHT)"
        side_effects:
          - "increments TaxReturn.version by 1"
        note: "Revision loop: DRAFT <-> READY_FOR_REVIEW may cycle any number of times"

      - from: READY_FOR_REVIEW
        to: SUBMITTED
        trigger: "POST /tax/returns/{returnId}/file"
        actor: Taxpayer
        preconditions:
          - "no FilingAttempt with outcome == PENDING exists (ERR_FILING_IN_FLIGHT)"
          - "amendment hold: if any prior FilingAttempt for this return reached ACCEPTED at resolved_at T, the logical clock must read strictly later than T + AMENDMENT_HOLD_HOURS (closed interval — at exactly T + hold the call is still rejected, ERR_AMENDMENT_HOLD_ACTIVE)"
          - "if refund_transfer_selected == true then a RefundTransferAgreement with status == ACTIVE exists for this return (ERR_REFUND_TRANSFER_NOT_ACTIVE)"
          - "if refund_transfer_selected == true then federal_refund_cents >= total_fees_due_cents (ERR_REFUND_INSUFFICIENT_FOR_FEES)"
        side_effects:
          - "create FilingAttempt(outcome=PENDING, attempt_sequence = max(existing) + 1)"
          - "every StateReturn with status == READY transitions to FILED"
          - "increments TaxReturn.version by 1"

      - from: AMENDED
        to: SUBMITTED
        trigger: "POST /tax/returns/{returnId}/file"
        actor: Taxpayer
        preconditions:
          - "FORBIDDEN — an AMENDED return must pass through READY_FOR_REVIEW first (ERR_INVALID_STATE)"
        side_effects: []
        note: "Explicitly forbidden direct transition, retained for invalid-transition testing"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /tax/_authority/filing-callback with outcome=ACCEPTED (system)"
        actor: system
        preconditions:
          - "targeted FilingAttempt outcome == PENDING"
        side_effects:
          - "FilingAttempt PENDING -> ACCEPTED; resolved_at set from logical clock"
          - "if an ACTIVE RefundTransferAgreement exists: it transitions to SETTLED and total fees are deducted from the refund by the bank partner"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /tax/_authority/filing-callback with outcome=REJECTED (system)"
        actor: system
        preconditions:
          - "targeted FilingAttempt outcome == PENDING"
        side_effects:
          - "FilingAttempt PENDING -> REJECTED; rejection_code recorded; correction_hint computed; resolved_at set"
          - "every StateReturn with status == FILED for this return reverts to READY"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /tax/returns/{returnId}/reopen"
        actor: Taxpayer
        preconditions: []
        side_effects:
          - "increments TaxReturn.version by 1"
        note: "Guided-correction loop: REJECTED -> DRAFT -> READY_FOR_REVIEW -> SUBMITTED may repeat; each file call creates a new FilingAttempt with incremented attempt_sequence"

      - from: ACCEPTED
        to: AMENDED
        trigger: "POST /tax/returns/{returnId}/amend"
        actor: Taxpayer
        preconditions:
          - "at least one FilingAttempt with outcome == ACCEPTED exists for this return"
        side_effects:
          - "return reopens for edits; forms may be added/removed"
          - "increments TaxReturn.version by 1"
        note: "ACCEPTED remains terminal for the ORIGINAL filing; AMENDED starts a new filing cycle governed by the amendment hold window"

  - entity: UpgradePrompt
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, DECLINED_DOWNGRADED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /tax/returns/{returnId}/upgrade-prompts/{promptId}/acknowledge"
        actor: Taxpayer
        preconditions:
          - "return.status IN {DRAFT, AMENDED} (ERR_RETURN_NOT_EDITABLE)"
        side_effects:
          - "acknowledged := true"
          - "return.current_tier := prompt.to_tier"
          - "return.upgrade_prompt_pending recomputed (false when this was the last PENDING prompt)"
          - "total_fees_due_cents recomputed at the new tier"
          - "increments TaxReturn.version by 1"

      - from: PENDING
        to: DECLINED_DOWNGRADED
        trigger: "POST /tax/returns/{returnId}/upgrade-prompts/{promptId}/decline"
        actor: Taxpayer
        preconditions:
          - "return.status IN {DRAFT, AMENDED} (ERR_RETURN_NOT_EDITABLE)"
          - "no ACTIVE ReturnForm with source == IMPORTED has a FormSpec.minimum_tier outranking prompt.from_tier — imported carryforward forms must be explicitly removed first (ERR_DOWNGRADE_WOULD_LEAVE_GAP)"
        side_effects:
          - "every ACTIVE ReturnForm with source == MANUAL whose FormSpec.minimum_tier outranks prompt.from_tier transitions to REMOVED"
          - "minimum_required_tier and free_file_eligible recomputed"
          - "return.upgrade_prompt_pending recomputed"
          - "increments TaxReturn.version by 1"

      - from: PENDING
        to: SUPERSEDED
        trigger: "system (automatic when a newer PENDING UpgradePrompt is created for the same return)"
        actor: system
        preconditions: []
        side_effects: []
        note: "At most one PENDING prompt per return at any time"

  - entity: StateReturn
    initial_state: DRAFT
    terminal_states: [REMOVED]
    transitions:
      - from: DRAFT
        to: READY
        trigger: "POST /tax/returns/{returnId}/state-returns/{stateReturnId}/ready"
        actor: Taxpayer
        preconditions:
          - "return.status IN {DRAFT, AMENDED} (ERR_INVALID_STATE)"
        side_effects: []

      - from: READY
        to: FILED
        trigger: "system (on TaxReturn READY_FOR_REVIEW -> SUBMITTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FILED
        to: READY
        trigger: "system (on authority rejection of the parent filing)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Rejection roll-back: the state add-on must be re-filed with the corrected federal return"

      - from: DRAFT
        to: REMOVED
        trigger: "POST /tax/returns/{returnId}/state-returns/{stateReturnId}/remove"
        actor: Taxpayer
        preconditions:
          - "return.status IN {DRAFT, AMENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "total_fees_due_cents recomputed (state add-on price removed)"

      - from: READY
        to: REMOVED
        trigger: "POST /tax/returns/{returnId}/state-returns/{stateReturnId}/remove"
        actor: Taxpayer
        preconditions:
          - "return.status IN {DRAFT, AMENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "total_fees_due_cents recomputed (state add-on price removed)"

  - entity: FilingAttempt
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /tax/_authority/filing-callback"
        actor: system
        preconditions: []
        side_effects:
          - "parent TaxReturn SUBMITTED -> ACCEPTED"
          - "ACTIVE RefundTransferAgreement -> SETTLED when elected"
          - "resolved_at := logical clock"

      - from: PENDING
        to: REJECTED
        trigger: "POST /tax/_authority/filing-callback"
        actor: system
        preconditions: []
        side_effects:
          - "parent TaxReturn SUBMITTED -> REJECTED"
          - "correction_hint set from rejection_code mapping"
          - "StateReturn FILED -> READY (cascade roll-back)"
          - "resolved_at := logical clock"

  - entity: RefundTransferAgreement
    initial_state: PENDING_DISCLOSURE
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: PENDING_DISCLOSURE
        to: ACTIVE
        trigger: "POST /tax/returns/{returnId}/refund-transfer/accept-disclosure"
        actor: Taxpayer
        preconditions:
          - "return.status IN {DRAFT, AMENDED, READY_FOR_REVIEW} (ERR_INVALID_STATE)"
        side_effects:
          - "account.disclosure_accepted_version := agreement.disclosure_version"
          - "return.refund_transfer_selected := true"
          - "total_fees_due_cents recomputed (service_fee_cents added)"
          - "increments TaxReturn.version by 1"

      - from: ACTIVE
        to: SETTLED
        trigger: "system (on FilingAttempt ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "bank partner deducts total_fees_due_cents from the refund before disbursement"

      - from: PENDING_DISCLOSURE
        to: VOIDED
        trigger: "POST /tax/returns/{returnId}/refund-transfer/void"
        actor: Taxpayer
        preconditions: []
        side_effects:
          - "return.refund_transfer_selected := false (no-op if never elected)"
          - "total_fees_due_cents recomputed (service fee removed if it was included)"
          - "increments TaxReturn.version by 1"

      - from: ACTIVE
        to: VOIDED
        trigger: "POST /tax/returns/{returnId}/refund-transfer/void"
        actor: Taxpayer
        preconditions:
          - "no FilingAttempt with outcome == PENDING exists for the return (ERR_FILING_IN_FLIGHT)"
        side_effects:
          - "return.refund_transfer_selected := false"
          - "total_fees_due_cents recomputed (service fee removed)"
          - "increments TaxReturn.version by 1"

  - entity: AccuracyClaim
    initial_state: FILED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /tax/claims/{claimId}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "owning account.accuracy_guarantee_enrolled == true (ERR_GUARANTEE_NOT_ENROLLED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /tax/claims/{claimId}/adjudicate with reviewed_error_amount_cents == claimed_error_amount_cents"
        actor: ClaimsAdjuster
        preconditions:
          - "reviewed_error_amount_cents > 0 (ERR_INVALID_CLAIM_AMOUNT)"
        side_effects:
          - "reimbursement_cents computed per accuracy_reimbursement"

      - from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: "POST /tax/claims/{claimId}/adjudicate with 0 < reviewed_error_amount_cents < claimed_error_amount_cents"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "reimbursement_cents computed per accuracy_reimbursement"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /tax/claims/{claimId}/adjudicate with reviewed_error_amount_cents == 0"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects:
          - "reimbursement_cents := 0"

      - from: PARTIALLY_APPROVED
        to: UNDER_REVIEW
        trigger: "POST /tax/claims/{claimId}/reopen-review"
        actor: ClaimsAdjuster
        preconditions:
          - "claim has never reached PAID"
        side_effects:
          - "reimbursement_cents reset to 0 pending new adjudication"
        note: "Revision cycle: UNDER_REVIEW <-> PARTIALLY_APPROVED may loop until PAID locks the claim"

      - from: APPROVED
        to: PAID
        trigger: "POST /tax/claims/{claimId}/pay"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []

      - from: PARTIALLY_APPROVED
        to: PAID
        trigger: "POST /tax/claims/{claimId}/pay"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: []

  - entity: PriorYearReturnSnapshot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IMPORTED
        trigger: "POST /tax/accounts/{accountId}/prior-year-snapshots/{snapshotId}/import"
        actor: Taxpayer
        preconditions:
          - "target return.status IN {DRAFT, AMENDED} (ERR_RETURN_NOT_EDITABLE)"
          - "snapshot.tax_year < return.tax_year (ERR_SNAPSHOT_YEAR_INVALID)"
        side_effects:
          - "for each carryforward_items entry: create ReturnForm(source=IMPORTED) with mapped form_code (DEPRECIATION -> F4562, CAPITAL_LOSS -> SCH_D, BASIS -> F8949) and amount_cents = remaining_amount_cents"
          - "minimum_required_tier and free_file_eligible recomputed on the target return"
          - "if recomputed minimum_required_tier outranks current_tier: create a PENDING UpgradePrompt (any existing PENDING prompt -> SUPERSEDED)"
          - "increments TaxReturn.version by 1"

      - from: AVAILABLE
        to: SUPERSEDED
        trigger: "system (on registration of a newer snapshot for the same account and tax_year)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IMPORTED
        to: SUPERSEDED
        trigger: "system (on registration of a newer snapshot for the same account and tax_year)"
        actor: system
        preconditions: []
        side_effects: []
        note: "SUPERSEDED snapshots may not be imported (ERR_SNAPSHOT_SUPERSEDED)"

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: return-form-add-stale-return
    parent_entity: TaxReturn
    write_endpoint: "POST /tax/returns/{returnId}/forms"
    occ_field: "expected_return_version"
    description: |
      Adding a form to a TaxReturn whose version has advanced since the client
      last observed it is rejected with a stale-version error. A prior form
      add/remove or prior-year import already mutated minimum_required_tier
      and possibly created or superseded an UpgradePrompt, so the stale
      writer's view of the return's tier state is outdated.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: return-submit-stale-version
    parent_entity: TaxReturn
    write_endpoint: "POST /tax/returns/{returnId}/submit-review"
    occ_field: "expected_return_version"
    description: |
      Submitting review with an expected_return_version older than the
      return's current version is rejected with a stale-version error; an
      intervening upgrade acknowledgment, form removal, or state-return
      change may have altered fee and tier state after the client last read
      the return.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: minimum_tier_classification
    trigger: "ReturnForm created (MANUAL or IMPORTED), ReturnForm removed, prior-year import, submit-review"
    algorithm: aggregation
    formula: |
      active_forms = ReturnForm[return_id = r, status == ACTIVE]
      if active_forms is empty: minimum_required_tier = FREE
      else:
        required_rank = max over f in active_forms of tier_rank(FormSpec[f.form_code].minimum_tier)
        minimum_required_tier = ProductTier whose tier_rank == required_rank
      free_file_eligible recomputed alongside (see free_file_eligibility)
    input_set: "ACTIVE ReturnForms only; REMOVED rows excluded"
    constants:
      TIER_RANK_FREE: 0
      TIER_RANK_DELUXE: 1
      TIER_RANK_PREMIER: 2
      TIER_RANK_SELF_EMPLOYED: 3
    precision: "enum rank, exact"
    variants:
      - name: provisional_classification
        when: "evaluated eagerly at form-add / form-remove / import time, BEFORE any prompt is resolved; drives upgrade_prompt_pending and the frozen price_delta_cents shown on the created UpgradePrompt"
        difference: "input set includes freshly IMPORTED carryforward forms, so the provisional minimum can sit above the tier the return will ultimately settle at"
      - name: settled_classification
        when: "recomputed at submit-review, AFTER all prompts resolved and downgrade removals applied; gates ERR_TIER_BELOW_REQUIRED"
        difference: "same formula over a possibly strictly smaller ACTIVE set (post-decline REMOVED transitions), so a return that provisionally required SELF_EMPLOYED can settle at FREE after decline-downgrade removes the offending forms"

  - name: free_file_eligibility
    trigger: "ReturnForm create/remove, prior-year import"
    algorithm: threshold
    formula: |
      disqualifying = any ACTIVE ReturnForm f where FormSpec[f.form_code].disqualifies_free_file == true
      income_ok = account.agi_cents <= FREE_FILE_AGI_LIMIT_CENTS   # inclusive: exactly AT the limit stays eligible
      free_file_eligible = (not disqualifying) and income_ok
    input_set: "ACTIVE ReturnForms + owning account.agi_cents"
    constants:
      FREE_FILE_AGI_LIMIT_CENTS: 8400000   # $84,000.00 — inclusive upper bound
    precision: "integer cents, exact comparison"
    variants:
      - name: income_only_check
        when: "the return has no ACTIVE forms (empty form set)"
        difference: "disqualifying is vacuously false, so eligibility collapses to the pure income threshold — an account at exactly the limit is eligible, one cent over is not"

  - name: total_fees_due
    trigger: "tier change (acknowledge / select-tier), StateReturn add/remove, refund-transfer disclosure accept or void, submit-review"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking dependency pinned by explicit evaluation order:
      # the refund-transfer fee is a component of total_fees_due, yet refund-
      # transfer feasibility compares federal_refund_cents to total_fees_due.
      # Order: (1) base tier price, (2) state add-ons, (3) service fee,
      # (4) sum. Feasibility is only ever checked at file time against the
      # fully computed total — never mid-computation.
      base = ProductTier[current_tier].price_cents
      state_fees = count(StateReturn[return_id = r, status IN {DRAFT, READY, FILED}]) * ProductTier[current_tier].state_addon_price_cents
      rt_fee = REFUND_TRANSFER_FEE_CENTS if refund_transfer_selected else 0
      total_fees_due_cents = base + state_fees + rt_fee
    input_set: "current_tier, non-REMOVED StateReturns, refund_transfer_selected"
    constants:
      REFUND_TRANSFER_FEE_CENTS: 4000   # $40.00 bank-partner service fee
    precision: "integer cents, exact sum — no rounding stage"

  - name: state_allocation_tax
    trigger: "StateReturn created (and re-derived whenever allocation inputs change)"
    algorithm: tiered_pricing
    formula: |
      # Rounding order PINNED: the allocation ratio is carried as an exact
      # rational and only the final product is rounded — never pre-round the
      # ratio to a percentage.
      if is_resident_state:
        allocated_tax_cents = round_half_up(account.agi_cents * STATE_FLAT_RATE)
      else:
        if allocation_numerator_cents == 0:
          allocated_tax_cents = 0
        else:
          require allocation_denominator_cents > 0 and allocation_numerator_cents <= allocation_denominator_cents
          ratio = allocation_numerator_cents / allocation_denominator_cents   # exact rational
          allocated_tax_cents = round_half_up(account.agi_cents * ratio * STATE_FLAT_RATE)
    input_set: "single StateReturn row + owning account.agi_cents"
    constants:
      STATE_FLAT_RATE: 0.05   # 5% flat rate for every state in this scaffold
    precision: "final product rounded to integer cents, round_half_up; ratio never pre-rounded"
    variants:
      - name: resident_full_tax
        when: "is_resident_state == true"
        difference: "allocation inputs are ignored entirely; full AGI is taxed at the flat rate — same formula shape, different input set and result for identical allocation inputs"

  - name: federal_refund
    trigger: "ReturnForm created/removed (any form whose FormSpec.counts_toward_refund)"
    algorithm: aggregation
    formula: |
      federal_refund_cents = sum over ACTIVE ReturnForm f of f.amount_cents
                             where FormSpec[f.form_code].counts_toward_refund == true
      # Negative total means the taxpayer owes; refund transfer requires
      # federal_refund_cents >= total_fees_due_cents at file time.
    input_set: "ACTIVE ReturnForms whose FormSpec counts toward refund"
    constants: {}
    precision: "integer cents, exact sum"

  - name: accuracy_reimbursement
    trigger: "AccuracyClaim adjudication"
    algorithm: threshold
    formula: |
      raw = min(reviewed_error_amount_cents, claimed_error_amount_cents)
      reimbursement_cents = min(raw, GUARANTEE_CAP_CENTS)
      # A claim whose reviewed amount lands exactly on the cap reimburses exactly the cap.
    input_set: "single AccuracyClaim under adjudication"
    constants:
      GUARANTEE_CAP_CENTS: 100000   # $1,000.00 per-return guarantee cap
    precision: "integer cents"

  - name: amendment_hold_window
    trigger: "POST /tax/returns/{returnId}/file when a prior ACCEPTED FilingAttempt exists"
    algorithm: threshold
    formula: |
      last_accepted = FilingAttempt[return_id = r, outcome == ACCEPTED] with the greatest resolved_at
      if last_accepted exists and logical_clock_now <= last_accepted.resolved_at + AMENDMENT_HOLD_HOURS:
        reject with ERR_AMENDMENT_HOLD_ACTIVE
      # Closed interval: filing AT exactly resolved_at + hold is still rejected;
      # one second past the boundary is allowed.
    input_set: "ACCEPTED FilingAttempts of the return + logical clock"
    constants:
      AMENDMENT_HOLD_HOURS: 24
    precision: "second granularity on the logical clock"

  - name: bank_partner_registry
    trigger: "POST /tax/returns/{returnId}/refund-transfer"
    algorithm: aggregation
    formula: |
      bank_partner_code must be in REGISTERED_BANK_PARTNERS else ERR_BANK_PARTNER_NOT_FOUND
      disclosure_version stamped from ACTIVE_BANK_DISCLOSURE_VERSION at creation
    input_set: "the agreement being created"
    constants:
      REGISTERED_BANK_PARTNERS: "BANK_A, BANK_B"
      ACTIVE_BANK_DISCLOSURE_VERSION: "RTD-2026-1"
    precision: "exact string match"

  - name: correction_hint_mapping
    trigger: "FilingAttempt transitions to REJECTED"
    algorithm: projection
    formula: |
      hint = CORRECTION_HINTS[rejection_code]
      # R0000_SSN_MISMATCH    -> "Verify the SSN exactly as printed on the Social Security card."
      # R0500_NAME_CONTROL    -> "Name control mismatch: check last-name spelling against SSA records."
      # R1000_DUPLICATE_FILED -> "A return for this SSN was already accepted; amend instead of refiling."
      # R2000_DEPENDENT_CLAIMED -> "A dependent on this return was claimed elsewhere; review the dependent list."
      # R3000_MATH_ERROR      -> "The authority recomputed a line; review the flagged worksheet totals."
    input_set: "the rejected FilingAttempt"
    constants: {}
    precision: "exact string mapping"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be permitted for the endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right (account -> return -> child resource)"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_FORM_NOT_FOUND | ERR_PROMPT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_SNAPSHOT_NOT_FOUND | ERR_STATE_RETURN_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced resources must exist (form_code registered in FormSpec, bank_partner_code registered)"
    error_id: "ERR_FORM_SPEC_NOT_FOUND | ERR_BANK_PARTNER_NOT_FOUND"
    http_status: 404
    applies_to: "POST forms, POST refund-transfer"

  - priority: 5
    category: state
    check: "TaxpayerAccount.status must be ACTIVE for any return-graph mutation"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "all TaxReturn/ReturnForm/StateReturn/UpgradePrompt/RefundTransfer mutating endpoints"

  - priority: 6
    category: state
    check: "Target resource must be in a legal from-state for the requested transition (covers terminal-state lockdown, AMENDED->SUBMITTED direct file, prompt double-resolution, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "OCC: expected_return_version (when supplied on a guarded endpoint) must equal the return's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "all endpoints taking expected_return_version"

  - priority: 8
    category: business_safety
    check: "Outstanding PENDING UpgradePrompt must be resolved before review (upgrade acknowledgment or decline-downgrade with disclosure of the price change)"
    error_id: ERR_UPGRADE_ACK_REQUIRED
    http_status: 409
    applies_to: "POST submit-review"

  - priority: 9
    category: business_safety
    check: "Free-file disclosure: a return with current_tier == FREE whose free_file_eligible == false must not pass review"
    error_id: ERR_FREE_FILE_INELIGIBLE
    http_status: 422
    applies_to: "POST submit-review"

  - priority: 10
    category: business_safety
    check: "Refund-transfer disclosure: agreement must be ACTIVE (bank-partner disclosure accepted) before filing with refund_transfer_selected"
    error_id: ERR_REFUND_TRANSFER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST file"

  - priority: 11
    category: business_constraint
    check: "Form code uniqueness per return: an ACTIVE ReturnForm with the same form_code already exists"
    error_id: ERR_DUPLICATE_FORM_ON_RETURN
    http_status: 409
    applies_to: "POST forms"

  - priority: 12
    category: business_constraint
    check: "State add-on uniqueness per return: a non-REMOVED StateReturn with the same state_code already exists"
    error_id: ERR_DUPLICATE_STATE_RETURN
    http_status: 409
    applies_to: "POST state-returns"

  - priority: 13
    category: business_constraint
    check: "At most one PENDING FilingAttempt per return"
    error_id: ERR_FILING_IN_FLIGHT
    http_status: 409
    applies_to: "POST file, POST reopen (from READY_FOR_REVIEW), POST refund-transfer/void (from ACTIVE)"

  - priority: 14
    category: business_temporal
    check: "Part-year residency overlap: residency windows of non-REMOVED StateReturns on the same return are half-open [start_date, end_date); two windows overlap iff A.start < B.end AND B.start < A.end; adjacency (A.end == B.start) is allowed"
    error_id: ERR_RESIDENCY_OVERLAP
    http_status: 409
    applies_to: "POST state-returns"

  - priority: 15
    category: business_temporal
    check: "Amendment hold: after a FilingAttempt resolves ACCEPTED at resolved_at T, re-filing is rejected while logical clock <= T + AMENDMENT_HOLD_HOURS (closed interval, inclusive endpoint)"
    error_id: ERR_AMENDMENT_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST file"

  - priority: 16
    category: business_temporal
    check: "Snapshot import requires snapshot.tax_year < return.tax_year and snapshot not SUPERSEDED"
    error_id: "ERR_SNAPSHOT_YEAR_INVALID | ERR_SNAPSHOT_SUPERSEDED"
    http_status: 422
    applies_to: "POST import"

  - priority: 17
    category: business_referential
    check: "AccuracyClaim requires the referenced return to have reached ACCEPTED at least once (status ACCEPTED or AMENDED)"
    error_id: ERR_RETURN_NOT_FILED
    http_status: 409
    applies_to: "POST claims"

  - priority: 18
    category: business_constraint
    check: "Non-resident allocation_numerator_cents must be <= allocation_denominator_cents; denominator must be > 0 when numerator > 0"
    error_id: ERR_ALLOCATION_EXCEEDS_BASE
    http_status: 422
    applies_to: "POST state-returns"

  - priority: 19
    category: business_fiscal
    check: "Refund-transfer feasibility: federal_refund_cents >= total_fees_due_cents when refund_transfer_selected"
    error_id: ERR_REFUND_INSUFFICIENT_FOR_FEES
    http_status: 402
    applies_to: "POST file"

  - priority: 20
    category: business_fiscal
    check: "Claim amounts: claimed_error_amount_cents > 0; adjudication reviewed_error_amount_cents >= 0"
    error_id: ERR_INVALID_CLAIM_AMOUNT
    http_status: 422
    applies_to: "POST claims, POST adjudicate"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / ops endpoints ---
  - method: POST
    path: "/tax/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Before any set call the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time; the amendment-hold window and FilingAttempt.resolved_at read this clock."
    roles: [PlatformOperator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced"]

  - method: POST
    path: "/tax/_authority/filing-callback"
    description: "Simulated tax-authority callback resolving a PENDING FilingAttempt (test-driving endpoint, system actor)."
    roles: [PlatformOperator]
    code: 200
    input: [filing_attempt_id, outcome, "rejection_code?"]
    output: FilingAttempt
    side_effects: ["FilingAttempt PENDING -> ACCEPTED/REJECTED with full cascade"]

  - method: POST
    path: "/tax/_tiers/seed"
    description: "Register a ProductTier configuration row (ops catalog surface)."
    roles: [PlatformOperator]
    code: 201
    input: [code, price_cents, state_addon_price_cents, supported_forms, tier_rank]
    output: ProductTier
    side_effects: []

  - method: POST
    path: "/tax/_forms/seed"
    description: "Register a FormSpec row (ops catalog surface)."
    roles: [PlatformOperator]
    code: 201
    input: [code, minimum_tier, disqualifies_free_file, "counts_toward_refund?"]
    output: FormSpec
    side_effects: []

  - method: POST
    path: "/tax/accounts/{id}/suspend"
    description: "Suspend a taxpayer account (ops action; one-way)."
    roles: [PlatformOperator]
    code: 200
    input: []
    output: TaxpayerAccount
    side_effects: ["account.status -> SUSPENDED"]

  # --- TaxpayerAccount ---
  - method: POST
    path: "/tax/accounts"
    description: "Register a taxpayer account (bootstrap: no prior account id required)"
    roles: [Taxpayer]
    code: 201
    input: [email, full_name, filing_status, agi_cents, resident_state_code, "accuracy_guarantee_enrolled?"]
    output: TaxpayerAccount
    side_effects: ["status=ACTIVE; disclosure_accepted_version=null"]

  - method: GET
    path: "/tax/accounts/{id}"
    description: "Fetch an account"
    roles: [Taxpayer, PlatformOperator, ClaimsAdjuster]
    code: 200
    input: []
    output: TaxpayerAccount
    side_effects: []

  # --- Catalog reads ---
  - method: GET
    path: "/tax/tiers"
    description: "List product tiers"
    roles: [Taxpayer, PlatformOperator, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProductTier[]"
    side_effects: []

  - method: GET
    path: "/tax/form-specs"
    description: "List form specifications"
    roles: [Taxpayer, PlatformOperator, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "FormSpec[]"
    side_effects: []

  # --- PriorYearReturnSnapshot ---
  - method: POST
    path: "/tax/accounts/{id}/prior-year-snapshots"
    description: "Register a prior-year return snapshot for carryforward import"
    roles: [Taxpayer]
    code: 201
    input: [tax_year, carryforward_items]
    output: PriorYearReturnSnapshot
    side_effects: ["any existing snapshot for the same (account, tax_year) in AVAILABLE or IMPORTED -> SUPERSEDED"]

  - method: GET
    path: "/tax/accounts/{id}/prior-year-snapshots"
    description: "List snapshots for an account"
    roles: [Taxpayer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PriorYearReturnSnapshot[]"
    side_effects: []

  - method: GET
    path: "/tax/accounts/{id}/prior-year-snapshots/{snapshotId}"
    description: "Fetch a single snapshot"
    roles: [Taxpayer]
    code: 200
    input: []
    output: PriorYearReturnSnapshot
    side_effects: []

  - method: POST
    path: "/tax/accounts/{id}/prior-year-snapshots/{snapshotId}/import"
    description: "Import carryforward items (depreciation, basis, loss) from a snapshot into a target return"
    roles: [Taxpayer]
    code: 200
    input: [return_id, expected_return_version]
    output: TaxReturn
    side_effects:
      - "creates one IMPORTED ReturnForm per carryforward item (mapped form codes)"
      - "recomputes minimum_required_tier, free_file_eligible, federal_refund_cents"
      - "creates a PENDING UpgradePrompt (superseding any existing) if the minimum tier ratchets above current_tier"
      - "snapshot AVAILABLE -> IMPORTED"
      - "increments TaxReturn.version by 1"

  # --- TaxReturn ---
  - method: POST
    path: "/tax/accounts/{id}/returns"
    description: "Start a new tax return"
    roles: [Taxpayer]
    code: 201
    input: [tax_year]
    output: TaxReturn
    side_effects: ["status=DRAFT, current_tier=FREE, minimum_required_tier=FREE, free_file_eligible per income-only check"]

  - method: GET
    path: "/tax/accounts/{id}/returns"
    description: "List returns for an account"
    roles: [Taxpayer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "TaxReturn[]"
    side_effects: []

  - method: GET
    path: "/tax/returns/{id}"
    description: "Fetch a return with all computed fields"
    roles: [Taxpayer, ClaimsAdjuster, PlatformOperator]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []

  - method: POST
    path: "/tax/returns/{id}/select-tier"
    description: "Voluntary paid-tier selection (upgrade only). Required path for over-income filers stuck at FREE."
    roles: [Taxpayer]
    code: 200
    input: [target_tier, expected_return_version]
    output: TaxReturn
    side_effects:
      - "target_tier rank must be strictly greater than current_tier rank (ERR_INVALID_REQUEST otherwise)"
      - "target_tier rank must be >= minimum_required_tier rank (ERR_TIER_BELOW_REQUIRED)"
      - "return.current_tier := target_tier"
      - "total_fees_due_cents recomputed"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/forms"
    description: "Add a form to a return (question-flow answer)"
    roles: [Taxpayer]
    code: 201
    input: [form_code, amount_cents, expected_return_version]
    output: ReturnForm
    side_effects:
      - "recomputes minimum_required_tier, free_file_eligible, federal_refund_cents"
      - "creates a PENDING UpgradePrompt (superseding any existing PENDING prompt) if minimum_required_tier outranks current_tier"
      - "increments TaxReturn.version by 1"

  - method: GET
    path: "/tax/returns/{id}/forms"
    description: "List forms on a return (includes REMOVED rows)"
    roles: [Taxpayer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReturnForm[]"
    side_effects: []

  - method: POST
    path: "/tax/returns/{id}/forms/{formId}/remove"
    description: "Remove (soft-delete) a form from a return"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: ReturnForm
    side_effects:
      - "form ACTIVE -> REMOVED"
      - "recomputes minimum_required_tier, free_file_eligible, federal_refund_cents"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/submit-review"
    description: "Submit the return for pre-filing review"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: TaxReturn
    side_effects:
      - "DRAFT/AMENDED -> READY_FOR_REVIEW"
      - "settled_classification recompute of minimum_required_tier"
      - "total_fees_due_cents recomputed"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/reopen"
    description: "Reopen a return from READY_FOR_REVIEW or REJECTED back to DRAFT"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: TaxReturn
    side_effects:
      - "READY_FOR_REVIEW/REJECTED -> DRAFT"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/file"
    description: "E-file the return (creates a FilingAttempt)"
    roles: [Taxpayer]
    code: 201
    input: [transmission_payload_hash, expected_return_version]
    output: FilingAttempt
    side_effects:
      - "READY_FOR_REVIEW -> SUBMITTED"
      - "creates FilingAttempt(PENDING)"
      - "StateReturn READY -> FILED"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/amend"
    description: "Amend an accepted return"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: TaxReturn
    side_effects:
      - "ACCEPTED -> AMENDED"
      - "increments TaxReturn.version by 1"

  # --- FilingAttempt reads ---
  - method: GET
    path: "/tax/returns/{id}/filing-attempts"
    description: "List filing attempts for a return"
    roles: [Taxpayer, ClaimsAdjuster, PlatformOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "FilingAttempt[]"
    side_effects: []

  # --- UpgradePrompt ---
  - method: GET
    path: "/tax/returns/{id}/upgrade-prompts"
    description: "List upgrade prompts for a return"
    roles: [Taxpayer]
    code: 200
    input: ["limit?", "offset?"]
    output: "UpgradePrompt[]"
    side_effects: []

  - method: POST
    path: "/tax/returns/{id}/upgrade-prompts/{promptId}/acknowledge"
    description: "Accept the tier upgrade and price change"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: UpgradePrompt
    side_effects:
      - "PENDING -> ACKNOWLEDGED"
      - "return.current_tier := prompt.to_tier"
      - "total_fees_due_cents recomputed"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/upgrade-prompts/{promptId}/decline"
    description: "Decline upgrade: downgrade path removes offending MANUAL forms"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: UpgradePrompt
    side_effects:
      - "PENDING -> DECLINED_DOWNGRADED"
      - "ACTIVE MANUAL forms whose FormSpec.minimum_tier outranks from_tier -> REMOVED"
      - "minimum_required_tier and free_file_eligible recomputed"
      - "increments TaxReturn.version by 1"

  # --- StateReturn ---
  - method: POST
    path: "/tax/returns/{id}/state-returns"
    description: "Add a state return add-on (with optional part-year residency window and non-resident allocation)"
    roles: [Taxpayer]
    code: 201
    input: [state_code, "allocation_numerator_cents?", "allocation_denominator_cents?", "residency_start_date?", "residency_end_date?", expected_return_version]
    output: StateReturn
    side_effects:
      - "allocated_tax_cents computed per state_allocation_tax"
      - "total_fees_due_cents recomputed (state add-on price added)"
      - "increments TaxReturn.version by 1"

  - method: GET
    path: "/tax/returns/{id}/state-returns"
    description: "List state returns for a return"
    roles: [Taxpayer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "StateReturn[]"
    side_effects: []

  - method: POST
    path: "/tax/returns/{id}/state-returns/{stateReturnId}/ready"
    description: "Mark a state return ready for filing"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: StateReturn
    side_effects:
      - "DRAFT -> READY"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/state-returns/{stateReturnId}/remove"
    description: "Remove a state return add-on"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: StateReturn
    side_effects:
      - "DRAFT/READY -> REMOVED"
      - "total_fees_due_cents recomputed (state add-on price removed)"
      - "increments TaxReturn.version by 1"

  # --- RefundTransferAgreement ---
  - method: POST
    path: "/tax/returns/{id}/refund-transfer"
    description: "Create a refund-transfer agreement (pay fees from the refund via a bank partner)"
    roles: [Taxpayer]
    code: 201
    input: [bank_partner_code, expected_return_version]
    output: RefundTransferAgreement
    side_effects:
      - "agreement created PENDING_DISCLOSURE with service_fee_cents frozen at REFUND_TRANSFER_FEE_CENTS"
      - "increments TaxReturn.version by 1"

  - method: GET
    path: "/tax/returns/{id}/refund-transfer"
    description: "List refund-transfer agreements for a return (0..1 active at a time)"
    roles: [Taxpayer, PlatformOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: "RefundTransferAgreement[]"
    side_effects: []

  - method: POST
    path: "/tax/returns/{id}/refund-transfer/accept-disclosure"
    description: "Accept the bank-partner disclosure, activating the agreement"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: RefundTransferAgreement
    side_effects:
      - "PENDING_DISCLOSURE -> ACTIVE"
      - "account.disclosure_accepted_version := agreement.disclosure_version"
      - "return.refund_transfer_selected := true"
      - "total_fees_due_cents recomputed (service fee added)"
      - "increments TaxReturn.version by 1"

  - method: POST
    path: "/tax/returns/{id}/refund-transfer/void"
    description: "Void the refund-transfer agreement"
    roles: [Taxpayer]
    code: 200
    input: [expected_return_version]
    output: RefundTransferAgreement
    side_effects:
      - "PENDING_DISCLOSURE/ACTIVE -> VOIDED"
      - "return.refund_transfer_selected := false"
      - "total_fees_due_cents recomputed (service fee removed)"
      - "increments TaxReturn.version by 1"

  # --- AccuracyClaim ---
  - method: POST
    path: "/tax/returns/{id}/claims"
    description: "File a calculation-accuracy guarantee claim"
    roles: [Taxpayer]
    code: 201
    input: [claimed_error_amount_cents]
    output: AccuracyClaim
    side_effects: ["status=FILED"]

  - method: GET
    path: "/tax/returns/{id}/claims"
    description: "List claims for a return"
    roles: [Taxpayer, ClaimsAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: "AccuracyClaim[]"
    side_effects: []

  - method: POST
    path: "/tax/claims/{claimId}/start-review"
    description: "Move a claim into review"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: AccuracyClaim
    side_effects: ["FILED -> UNDER_REVIEW"]

  - method: POST
    path: "/tax/claims/{claimId}/adjudicate"
    description: "Adjudicate a claim with a reviewed error amount (APPROVED / PARTIALLY_APPROVED / DENIED by amount)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [reviewed_error_amount_cents]
    output: AccuracyClaim
    side_effects:
      - "UNDER_REVIEW -> APPROVED | PARTIALLY_APPROVED | DENIED per reviewed amount"
      - "reimbursement_cents computed per accuracy_reimbursement"

  - method: POST
    path: "/tax/claims/{claimId}/reopen-review"
    description: "Reopen a partially approved claim for re-adjudication"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: AccuracyClaim
    side_effects: ["PARTIALLY_APPROVED -> UNDER_REVIEW; reimbursement reset to 0"]

  - method: POST
    path: "/tax/claims/{claimId}/pay"
    description: "Pay an approved or partially approved claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: AccuracyClaim
    side_effects: ["APPROVED/PARTIALLY_APPROVED -> PAID"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "accountId does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "returnId does not exist" }
  - { id: ERR_FORM_NOT_FOUND, http: 404, condition: "formId does not exist on the return" }
  - { id: ERR_PROMPT_NOT_FOUND, http: 404, condition: "upgrade prompt id does not exist on the return" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id does not exist" }
  - { id: ERR_SNAPSHOT_NOT_FOUND, http: 404, condition: "snapshot id does not exist for the account" }
  - { id: ERR_STATE_RETURN_NOT_FOUND, http: 404, condition: "state return id does not exist on the return" }
  - { id: ERR_FORM_SPEC_NOT_FOUND, http: 404, condition: "form_code not registered in FormSpec" }
  - { id: ERR_BANK_PARTNER_NOT_FOUND, http: 404, condition: "bank_partner_code is not a registered partner" }
  - { id: ERR_ACCOUNT_SUSPENDED, http: 409, condition: "Account is SUSPENDED; return-graph mutations blocked" }
  - { id: ERR_ALLOCATION_EXCEEDS_BASE, http: 422, condition: "allocation_numerator_cents > allocation_denominator_cents for a non-resident state" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a legal from-state for the requested transition (terminal lockdown, AMENDED->SUBMITTED direct file, double-resolved prompt, etc.)" }
  - { id: ERR_RETURN_NOT_EDITABLE, http: 409, condition: "Operation requires return status DRAFT or AMENDED" }
  - { id: ERR_UPGRADE_ACK_REQUIRED, http: 409, condition: "A PENDING UpgradePrompt exists; submit-review blocked until acknowledged or decline-downgraded" }
  - { id: ERR_FREE_FILE_INELIGIBLE, http: 422, condition: "Return priced at FREE tier but free_file_eligible is false (disqualifying form present or AGI above the limit)" }
  - { id: ERR_TIER_BELOW_REQUIRED, http: 422, condition: "current/selected tier rank is below minimum_required_tier rank at settled classification" }
  - { id: ERR_DOWNGRADE_WOULD_LEAVE_GAP, http: 409, condition: "Declining the prompt while ACTIVE IMPORTED carryforward forms still require a tier above from_tier; remove them explicitly first" }
  - { id: ERR_REFUND_TRANSFER_NOT_ACTIVE, http: 409, condition: "Filing with refund_transfer_selected but the agreement is not ACTIVE (disclosure not accepted)" }
  - { id: ERR_REFUND_INSUFFICIENT_FOR_FEES, http: 402, condition: "federal_refund_cents < total_fees_due_cents under refund transfer" }
  - { id: ERR_DUPLICATE_FORM_ON_RETURN, http: 409, condition: "An ACTIVE ReturnForm with the same form_code already exists on the return" }
  - { id: ERR_DUPLICATE_STATE_RETURN, http: 409, condition: "A non-REMOVED StateReturn with the same state_code already exists on the return" }
  - { id: ERR_RESIDENCY_OVERLAP, http: 409, condition: "Part-year residency window (half-open) collides with another non-REMOVED StateReturn's window on the same return" }
  - { id: ERR_AMENDMENT_HOLD_ACTIVE, http: 409, condition: "Re-filing within the closed hold window after an ACCEPTED filing (logical clock <= resolved_at + AMENDMENT_HOLD_HOURS)" }
  - { id: ERR_FILING_IN_FLIGHT, http: 409, condition: "A PENDING FilingAttempt exists; conflicting operation blocked" }
  - { id: ERR_INVALID_CLAIM_AMOUNT, http: 422, condition: "Claimed amount <= 0, or reviewed amount negative / inconsistent with the adjudication transition" }
  - { id: ERR_GUARANTEE_NOT_ENROLLED, http: 409, condition: "Account not enrolled in the accuracy guarantee program" }
  - { id: ERR_RETURN_NOT_FILED, http: 409, condition: "Accuracy claim requires the return to have reached ACCEPTED at least once" }
  - { id: ERR_SNAPSHOT_YEAR_INVALID, http: 422, condition: "snapshot.tax_year >= return.tax_year on import" }
  - { id: ERR_SNAPSHOT_SUPERSEDED, http: 422, condition: "Snapshot has been superseded by a newer registration for the same tax year" }
  - { id: ERR_NO_FORMS_ON_RETURN, http: 422, condition: "submit-review requires at least one ACTIVE form" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_return_version does not match the return's current version (OCC)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, invalid enum, or select-tier target not strictly above current tier" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Taxpayer
    description: "The DIY filer; owns accounts, returns, forms, state returns, prompts, refund transfer, and claim filing. X-User-ID equals the owning TaxpayerAccount.id for account-scoped operations."
    identity: "entity_backed:TaxpayerAccount"
    exclusive_operations:
      - "POST /tax/accounts (bootstrap registration)"
      - "POST /tax/accounts/{id}/returns"
      - "POST /tax/accounts/{id}/prior-year-snapshots (+ /import)"
      - "POST /tax/returns/{id}/select-tier | /forms (+ /remove) | /submit-review | /reopen | /file | /amend"
      - "POST /tax/returns/{id}/upgrade-prompts/{pid}/acknowledge | /decline"
      - "POST /tax/returns/{id}/state-returns (+ /ready | /remove)"
      - "POST /tax/returns/{id}/refund-transfer (+ /accept-disclosure | /void)"
      - "POST /tax/returns/{id}/claims"
    shared_operations:
      - "GET endpoints for own resources; GET /tax/tiers; GET /tax/form-specs"

  - name: ClaimsAdjuster
    description: "Reviews and adjudicates accuracy-guarantee claims; read access to returns for verification"
    identity: "opaque"
    exclusive_operations:
      - "POST /tax/claims/{id}/start-review | /adjudicate | /reopen-review | /pay"
    shared_operations:
      - "GET /tax/accounts/{id}; GET /tax/accounts/{id}/returns; GET /tax/returns/{id}; GET forms / state-returns / claims / filing-attempts lists; GET /tax/tiers; GET /tax/form-specs"

  - name: PlatformOperator
    description: "Operations/system role: seeds tier and form catalogs, suspends accounts, sets the logical clock, injects authority callbacks"
    identity: "opaque"
    exclusive_operations:
      - "POST /tax/_tiers/seed; POST /tax/_forms/seed"
      - "POST /tax/_authority/filing-callback"
      - "POST /tax/_clock/set_current_utc"
      - "POST /tax/accounts/{id}/suspend"
    shared_operations:
      - "GET /tax/returns/{id}; GET filing-attempts; GET refund-transfer list; GET /tax/tiers; GET /tax/form-specs"
