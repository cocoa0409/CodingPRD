scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: diversion_report_provisional_vs_final_net
        grounds:
          - calculations.diversion_net_kg
          - entities.DiversionReport.fields.method
          - state_machines.ProcessingBatch.OPEN_to_CLOSED_ACCEPTED
        distinguishing_aspect: |
          Same DropEvent set, two variants (PROVISIONAL_NET vs FINAL_NET)
          produce different net_diverted_kg because FINAL_NET uses
          batch-reconciled final_net_kg (smaller after partner-measured
          contamination) while PROVISIONAL_NET uses provisional_net_kg. Entity
          domain: DiversionReport (municipal tonnage).
        test_recipe:
          setup:
            - "Program ACTIVE with default diversion_credit_rate=1.0"
            - "Site OPERATIONAL, capacity 10000, ACTIVE agreement [2026-01-01, 2027-01-01)"
            - "Material FOOD accepted year-round"
            - "Participant ACTIVE with ACTIVE AccessGrant at the site"
            - "One ACCEPTED DropEvent gross=10.00, contamination=1.00, provisional_net=9.00"
            - "Route collecting 10.00 kg, COMPLETED; batch opened with input_gross=10.00"
            - "Batch CLOSED_ACCEPTED with measured_contamination_kg=2.00 → measured_net=8.00; drop final_net_kg=8.00, credit_state FINALLY_CREDITED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food scraps", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P One", household_size: 2 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 2, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { site_v: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 10.00, contamination_kg: 1.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${site_v}" }
              as: Participant
              as_user_id: "${part_id}"
              captures: { drop_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops/${drop_id}/accept"
              payload: {}
              as: SiteHost
            - call: "POST /programs/${prog_id}/partners"
              payload: { name: "PP", intake_capacity_kg_per_day: 10000, yield_ratio: 0.5, contamination_reject_threshold_pct: 25.0 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes"
              payload: { route_code: "R1", vehicle_capacity_kg: 5000, processing_partner_id: "${partner_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: RouteOperator
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops"
              payload: { site_id: "${site_id}", planned_pickup_kg: 9, stop_sequence: 1, expected_route_version: "${route_v}" }
              as: RouteOperator
              captures: { stop_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes/${route_id}/dispatch"
              payload: {}
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops/${stop_id}/collect"
              payload: { actual_pickup_kg: 10.00 }
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${route_id}/complete"
              payload: {}
              as: RouteOperator
            - call: "GET /programs/${prog_id}/partners/${partner_id}/batches"
              payload: {}
              as: ProgramAdmin
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/partners/${partner_id}/batches/${batch_id}/close"
              payload: { measured_contamination_kg: 2.00 }
              as: ProcessingPartner
              as_user_id: "${partner_id}"
          trigger:
            - call: "POST /programs/${prog_id}/diversion-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", method: "PROVISIONAL_NET" }
              as: MunicipalAuditor
              captures: { rep_prov: $.data.id }
            - call: "POST /programs/${prog_id}/diversion-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", method: "FINAL_NET" }
              as: MunicipalAuditor
              captures: { rep_final: $.data.id }
          assert:
            - "DiversionReport.${rep_prov}.net_diverted_kg == 9.00"
            - "DiversionReport.${rep_final}.net_diverted_kg == 8.00"
            - "DiversionReport.${rep_prov}.net_diverted_kg != DiversionReport.${rep_final}.net_diverted_kg"
            - "DiversionReport.${rep_final}.diversion_rate_pct == 80.00"

      - name: site_posture_capacity_vs_complaint_domains
        grounds:
          - calculations.site_posture
          - entities.Site.fields.posture
          - state_machines.Site.OPERATIONAL_to_OPERATIONAL
        distinguishing_aspect: |
          Different entity domain (Site posture, not DiversionReport): posture
          evaluates capacity AND complaint-window axes on the same stored_kg;
          with stored=100 kg on a 1000 kg site, posture is OPEN with zero
          unresolved complaints but WATCH when two unresolved complaints sit in
          the rolling 14-day window — identical mass, different derived output,
          variant selection driven by complaint-window membership.
        test_recipe:
          setup:
            - "Program ACTIVE; posture_complaint_threshold=2"
            - "Site capacity 1000, OPERATIONAL, stored_kg = 100 (10% < 80% capacity threshold)"
            - "ACTIVE agreement; year-round material; one participant"
            - "Clock advanced to 2026-08-13; two complaints reported 2026-08-10 (within 14-day window)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P2", fiscal_year: 2026, posture_complaint_threshold: 2 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 1000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "p@x.com", full_name: "P", household_size: 1 }
              as: Anonymous
              captures: { part_id: $.data.id, part_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${part_id}/verify"
              payload: { verification_token: "${part_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${part_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 2, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { grant_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { site_v1: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${part_id}", access_grant_id: "${grant_id}", material_category_id: "${mat_id}", gross_weight_kg: 100.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${site_v1}" }
              as: Participant
              as_user_id: "${part_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints"
              payload: { reporter_contact: "n1", kind: "ODOR", description: "smell", reported_at: "2026-08-10T09:00:00Z" }
              as: Anonymous
              captures: { complaint_a: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints"
              payload: { reporter_contact: "n2", kind: "VECTOR", description: "flies", reported_at: "2026-08-10T10:00:00Z" }
              as: Anonymous
              captures: { complaint_b: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { posture_with: $.data.posture }
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${complaint_a}/resolve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${complaint_b}/resolve"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { posture_without: $.data.posture, stored_final: $.data.stored_kg }
          assert:
            - "posture_with == WATCH (two unresolved complaints within 14-day window meet threshold 2)"
            - "posture_without == OPEN after both resolved"
            - "stored_final == 100.0 — mass unchanged across posture flip (derived state, not mass-driven)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: distribution_fair_share_three_input_min
        grounds:
          - calculations.distribution_fair_share
          - entities.DistributionAllocation.fields.allocation_kg
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction —
          allocation_kg = round(min(requested, min(household_share,
          credit_cap), equal_split_cap), 2). With pool 40.00, households
          A=4 / B=1 (total 5), A requests 50 kg with 3 credits, B requests
          10 kg with 10 credits: household_share(A)=40*4/5=32.00,
          credit_cap(A)=3.00, equal_split_cap=40/2=20.00 →
          min(50, min(32.00, 3.00), 20.00) = 3.00 kg.
        test_recipe:
          setup:
            - "Program ACTIVE with diversion_credit_rate=1.0"
            - "Batch with finished_compost_kg=40.00 (input 40.00, yield 1.0); distribution total_pool_kg=40.00"
            - "Participant A household_size=4 with >= 3 credits; Participant B household_size=1 with >= 10 credits"
            - "A REQUESTED 50 kg / 3 credits; B REQUESTED 10 kg / 10 credits"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P3", fiscal_year: 2026 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites"
              payload: { name: "S1", address: "1 A St", capacity_kg: 10000 }
              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements"
              payload: { site_id: "${site_id}", host_name: "H", term_start: "2026-01-01T00:00:00Z", term_end: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /programs/${prog_id}/host-agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/materials"
              payload: { code: "FOOD", description: "food", accepted_start_month_day: "01-01", accepted_end_month_day: "12-31", contamination_sensitivity: "LOW" }
              as: ProgramAdmin
              captures: { mat_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "a@x.com", full_name: "A", household_size: 4 }
              as: Anonymous
              captures: { pa_id: $.data.id, pa_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${pa_id}/verify"
              payload: { verification_token: "${pa_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/register"
              payload: { email: "b@x.com", full_name: "B", household_size: 1 }
              as: Anonymous
              captures: { pb_id: $.data.id, pb_tok: $.data.verification_token }
            - call: "POST /programs/${prog_id}/participants/${pb_id}/verify"
              payload: { verification_token: "${pb_tok}" }
              as: Anonymous
            - call: "POST /programs/${prog_id}/participants/${pa_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { ga_id: $.data.id }
            - call: "POST /programs/${prog_id}/participants/${pb_id}/grants"
              payload: { site_id: "${site_id}", bucket_quota: 5, expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { gb_id: $.data.id }
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv1: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${pa_id}", access_grant_id: "${ga_id}", material_category_id: "${mat_id}", gross_weight_kg: 10.00, contamination_kg: 0.00, occurred_at: "2026-08-01T10:00:00Z", expected_site_version: "${sv1}" }
              as: Participant
              as_user_id: "${pa_id}"
              captures: { drop_a: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops/${drop_a}/accept"
              payload: {}
              as: SiteHost
            - call: "GET /programs/${prog_id}/sites/${site_id}"
              payload: {}
              as: ProgramAdmin
              captures: { sv2: $.data.version }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops"
              payload: { participant_id: "${pb_id}", access_grant_id: "${gb_id}", material_category_id: "${mat_id}", gross_weight_kg: 30.00, contamination_kg: 0.00, occurred_at: "2026-08-01T11:00:00Z", expected_site_version: "${sv2}" }
              as: Participant
              as_user_id: "${pb_id}"
              captures: { drop_b: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/drops/${drop_b}/accept"
              payload: {}
              as: SiteHost
            - call: "POST /programs/${prog_id}/partners"
              payload: { name: "PP", intake_capacity_kg_per_day: 10000, yield_ratio: 1.0, contamination_reject_threshold_pct: 25.0 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes"
              payload: { route_code: "R1", vehicle_capacity_kg: 5000, processing_partner_id: "${partner_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: RouteOperator
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops"
              payload: { site_id: "${site_id}", planned_pickup_kg: 40, stop_sequence: 1, expected_route_version: "${route_v}" }
              as: RouteOperator
              captures: { stop_id: $.data.id }
            - call: "POST /programs/${prog_id}/routes/${route_id}/dispatch"
              payload: {}
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${route_id}/stops/${stop_id}/collect"
              payload: { actual_pickup_kg: 40.00 }
              as: RouteOperator
            - call: "POST /programs/${prog_id}/routes/${route_id}/complete"
              payload: {}
              as: RouteOperator
            - call: "GET /programs/${prog_id}/partners/${partner_id}/batches"
              payload: {}
              as: ProgramAdmin
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /programs/${prog_id}/partners/${partner_id}/batches/${batch_id}/close"
              payload: { measured_contamination_kg: 0.00 }
              as: ProcessingPartner
              as_user_id: "${partner_id}"
            - call: "POST /programs/${prog_id}/distributions"
              payload: { batch_id: "${batch_id}" }
              as: ProgramAdmin
              captures: { dist_id: $.data.id, dist_v: $.data.version }
            - call: "POST /programs/${prog_id}/distributions/${dist_id}/allocations"
              payload: { participant_id: "${pa_id}", requested_kg: 50.00, credits_redeemed: 3, expected_distribution_version: "${dist_v}" }
              as: Participant
              as_user_id: "${pa_id}"
              captures: { alloc_a: $.data.id }
            - call: "GET /programs/${prog_id}/distributions/${dist_id}"
              payload: {}
              as: ProgramAdmin
              captures: { dist_v2: $.data.version }
            - call: "POST /programs/${prog_id}/distributions/${dist_id}/allocations"
              payload: { participant_id: "${pb_id}", requested_kg: 10.00, credits_redeemed: 10, expected_distribution_version: "${dist_v2}" }
              as: Participant
              as_user_id: "${pb_id}"
              captures: { alloc_b: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/distributions/${dist_id}/allocations/${alloc_a}/distribute"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}/participants/${pa_id}"
              payload: {}
              as: ProgramAdmin
              captures: { pa_bal_after: $.data.bucket_credit_balance }
          assert:
            - "DistributionAllocation.${alloc_a}.allocation_kg == 3.00 (credit_cap binds: min(50, min(32.00, 3.00), 20.00) = 3.00)"
            - "DistributionAllocation.${alloc_a}.status == DISTRIBUTED"
            - "pa_bal_after == 7 (10 granted − 3 redeemed)"

      - name: diversion_nested_rounding_per_event_then_sum
        grounds:
          - calculations.diversion_net_kg
          - calculations.drop_provisional_net_kg
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — provisional_net_kg
          rounds each event to 0.01 half-up and the report sums the rounded
          values. Three ACCEPTED drops of (3.333−0.001), (3.333−0.001),
          (3.334−0.002) give per-event 3.33+3.33+3.33 = 9.99; raw-then-round
          would give 10.00. Pinned order produces 9.99. Distinct mode from
          the fair-share min-formula above.
        test_recipe:
          setup:
            - "Program ACTIVE; site OPERATIONAL with agreement and year-round material"
            - "Participant with grant"
            - "Three ACCEPTED DropEvents: d1 3.333/0.001 → 3.33; d2 3.333/0.001 → 3.33; d3 3.334/0.002 → 3.33"
          setup_api_calls:
