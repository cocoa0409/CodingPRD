      - name: support_has_full_account_mutation_but_no_config
        claim_type: role_allowed
        grounds:
          - roles.Support
        distinguishing_aspect: "Support CAN suspend/reactivate any account and read the revenue report but CANNOT create plans — hierarchical_override: Support sits below PlatformAdmin on config, above Subscriber on accounts."
        test_recipe:
          setup: ["subscriber exists; Support suspends then reactivates"]
          setup_api_calls:
            - call: "POST /streaming/subscriber-accounts"
              payload: { email: "rb6@x.com", full_name: "RB Six" }
