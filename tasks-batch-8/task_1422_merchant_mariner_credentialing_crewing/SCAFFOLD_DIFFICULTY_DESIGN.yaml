      - name: budget_reserve_release_conservation
        grounds:
          - state_machines.TrainingEnrollment.ENROLLED_to_NO_SHOW
          - entities.TrainingBudget.fields.reserved_cents
          - entities.TrainingBudget.fields.available_cents
          - calculations.training_reimbursement
        distinguishing_aspect: |
          Conserved quantity: budget cents (different quantity type than the seat count). The
          forward/compensating pair enroll (reserved += 160000) then NO_SHOW (reserved -=
          160000) restores available_cents to EXACTLY the pre-pair value 500000 with used_cents
          untouched at 0 — while the seat is deliberately NOT released (asymmetric side effect
          the invariant must absorb without drift).
        test_recipe:
          setup:
            - "M activated (default cap 500000); course cost 250000 DIRECT -> provisional 160000"
            - "Enrollment ENROLLED (reserved 160000, available 340000)"
          setup_api_calls:
            - { call: "POST /mariners", payload: { full_name: "Budget One", mariner_reference_number: "MRN-CI2-1", home_port_code: "SFO", hire_channel: "DIRECT", rank_track: "DECK", rank_grade: 5, primary_endorsement_code: "DECK_AB" }, as: FleetAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/medical-certificates", payload: { cert_type: "USCG_MEDICAL", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2027-06-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/credentials", payload: { credential_type: "MMC_BASE", endorsement_code: "DECK_AB", issue_date: "2026-01-01T00:00:00Z", expiry_date: "2030-01-01T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/drug-tests", payload: { test_type: "PRE_EMPLOYMENT", scheduled_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer, captures: { dt_id: $.data.id } }
            - { call: "POST /mariners/${m_id}/drug-tests/${dt_id}/record-result", payload: { result: "NEGATIVE", collected_date: "2026-01-02T00:00:00Z" }, as: CredentialingOfficer }
            - { call: "POST /mariners/${m_id}/activate", payload: {}, as: FleetAdmin }
            - { call: "POST /training-courses", payload: { course_code: "CI2-C1", title: "Budget Course", provider: "MaritimeEd", start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-05T00:00:00Z", seat_capacity: 5, cost_cents: 250000 }, as: FleetAdmin, captures: { course_id: $.data.id } }
            - { call: "POST /training-courses/${course_id}/enrollments", payload: {}, as: Mariner, as_user_id: "${m_id}", captures: { e_id: $.data.id } }
            - { call: "POST /training-enrollments/${e_id}/approve", payload: {}, as: CrewingManager, as_user_id: "cm-031" }
            - { call: "POST /training-enrollments/${e_id}/enroll", payload: {}, as: FleetAdmin, captures: { e_prov: $.data.provisional_amount_cents } }
            - { call: "GET /mariners/${m_id}/training-budgets", as: FleetAdmin, captures: { b_res_p1: "$.data[0].reserved_cents", b_avail_p1: "$.data[0].available_cents" } }
          trigger:
            - { call: "POST /training-enrollments/${e_id}/record-completion", payload: { outcome: "NO_SHOW" }, as: FleetAdmin, captures: { e_status: $.data.status } }
            - { call: "GET /mariners/${m_id}/training-budgets", as: FleetAdmin, captures: { b_res_p2: "$.data[0].reserved_cents", b_used_p2: "$.data[0].used_cents", b_avail_p2: "$.data[0].available_cents" } }
            - { call: "GET /mariners/${m_id}", as: FleetAdmin, captures: { m_strikes: $.data.no_show_strike_count } }
            - { call: "GET /training-courses/${course_id}", as: FleetAdmin, captures: { c_res: $.data.seats_reserved } }
          assert:
            - "e_prov == 160000"
            - "b_res_p1 == 160000 and b_avail_p1 == 340000 (forward action)"
            - "e_status == NO_SHOW (compensating action)"
            - "b_res_p2 == 0 and b_used_p2 == 0 and b_avail_p2 == 500000 (available restored EXACTLY to cap; conserved quantity: budget cents)"
            - "c_res == 1 (asymmetry: the NO_SHOW seat is retained, only budget is compensated)"
            - "m_strikes == 1"
      - name: slot_onboard_count_relief_conservation
        grounds:
