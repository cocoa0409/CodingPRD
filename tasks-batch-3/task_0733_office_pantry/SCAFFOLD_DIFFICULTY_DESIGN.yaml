  # =========================================================================
  # Rule 8 - resource_temporal_overlap (different interval semantics, different resources)
  # (i)  Delivery scheduled_at BUFFER semantics (min-gap 24h) on Location
  # (ii) RotationCycle half-open INTERVAL DISJOINTNESS on Subscription
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: delivery_scheduled_at_buffer_24h_violation
        grounds:
          - validations[priority=18]
          - errors[ERR_DELIVERY_SCHEDULE_CONFLICT]
          - entities.Delivery.fields.scheduled_at
          - entities.Location
        distinguishing_aspect: |
          Interval semantics: min-gap buffer (24h) between successive
          Delivery.scheduled_at at the same Location. Resource: Location.
          Distinct semantics from the half-open disjointness rule below.
        test_recipe:
          setup:
            - "ACTIVE Sub with OPEN RC; one existing SCHEDULED delivery at 2026-06-01T12:00:00Z at Location L"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "S", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "BufCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 20 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "B-1", name: "B", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { first_delv_id: "$.data.id" }
          trigger:
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-02T11:59:00Z" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == 'ERR_DELIVERY_SCHEDULE_CONFLICT'"

      - name: rotation_cycle_half_open_disjointness
        grounds:
          - validations[priority=19]
          - errors[ERR_ROTATION_CYCLE_OVERLAP]
          - entities.RotationCycle.fields.effective_from
          - entities.RotationCycle.fields.effective_to
        distinguishing_aspect: |
          Interval semantics: half-open [effective_from, effective_to) disjointness
          on RotationCycle. Resource: Subscription (rotations per subscription).
          Distinct semantics (adjacency-plus-disjointness) from the min-gap buffer
          on Delivery/Location.
        test_recipe:
          setup:
            - "ACTIVE Sub with OPEN RC1 (effective_from=2026-06-01, effective_to=2026-07-01)"
            - "attempting to generate a delivery scheduled at 2026-08-15 -- outside RC1's window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "S", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "OverlapCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "O-1", name: "O", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
          trigger:
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "err == 'ERR_ROTATION_CYCLE_OVERLAP'"

  # =========================================================================
  # Rule 9 - compensating_invariant (different conserved quantities)
  # (i)  MONEY (cents): delivery.provisional_cents == final_cents + dispute_credit_cents
  # (ii) TIME (days): cumulative_active_days conserves wall-clock ACTIVE across pause/resume
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: money_conservation_delivery_dispute_cycle
        grounds:
          - calculations.delivery_provisional_charge
          - calculations.delivery_final_charge
          - state_machines.Delivery.SCHEDULED_to_EN_ROUTE
          - state_machines.Delivery.DISPUTED_to_FINALIZED
          - entities.Delivery.fields.provisional_cents
          - entities.Delivery.fields.final_cents
          - entities.Delivery.fields.dispute_credit_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY (cents). Invariant across dispatch + dispute +
          resolve: delivery.provisional_cents == delivery.final_cents +
          delivery.dispute_credit_cents. Any drift makes the client either
          over-credited or under-credited.
        test_recipe:
          setup:
            - "DISPUTED Delivery: PANTRY location, single line planned=10 units at 100 cents, actual=7"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "S", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "Money", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 20 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "M-1", name: "M", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 10 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /subscriptions/${sub_id}/rotation-cycles"
              payload: {}
              as: PlatformAdmin
              captures: { rc0_id: "$.data[0].id" }
            - call: "POST /rotation-cycles/${rc0_id}/deliveries"
              payload: { location_id: "${loc_id}", scheduled_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { delv_id: "$.data.id" }
            - call: "POST /deliveries/${delv_id}/dispatch"
              payload: {}
              as: PlatformAdmin
            - call: "POST /deliveries/${delv_id}/confirm"
              payload: {}
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /deliveries/${delv_id}/dispute"
              payload: { dispute_reason: "short" }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "GET /deliveries/${delv_id}/lines"
              payload: {}
              as: PlatformAdmin
              captures: { line0_id: "$.data[0].id" }
            - call: "PATCH /delivery-lines/${line0_id}/actual"
              payload: { actual_units: 7 }
              as: LocationManager
              as_user_id: "${loc_id}"
          trigger:
            - call: "POST /deliveries/${delv_id}/resolve-dispute"
              payload: {}
              as: PlatformAdmin
              captures: { prov: "$.data.provisional_cents", fin: "$.data.final_cents", credit: "$.data.dispute_credit_cents" }
          assert:
            - "prov == 1000"
            - "fin == 700"
            - "credit == 300"
            - "prov == fin + credit"

      - name: time_conservation_cumulative_active_days
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.cumulative_active_days
        distinguishing_aspect: |
          Conserved quantity: TIME (days ACTIVE). Invariant: cumulative_active_days
          accumulates ONLY when subscription exits ACTIVE. A pause+resume+pause
          cycle adds each ACTIVE segment's length exactly once; no double-count,
          no drift. Different-quantity Rule 9 twin to money conservation above.
        test_recipe:
          setup:
            - "clock at 2026-06-01T00:00:00Z; ACTIVE Subscription created at day 0; cumulative_active_days = 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /plans"
              payload: { tier: "S", billing_type: "FLAT", flat_fee_cents: 1000, volume_discount_threshold_headcount: 50 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "TimeCo", headcount: 5 }
              as: PlatformAdmin
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
            - call: "POST /clients/${client_id}/locations"
              payload: { name: "L", kind: "PANTRY", capacity_units: 5 }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { loc_id: "$.data.id" }
            - call: "POST /products"
              payload: { sku: "T-1", name: "T", category: "SNACK", unit_cost_cents: 100 }
              as: PlatformAdmin
              captures: { prod_id: "$.data.id" }
            - call: "POST /locations/${loc_id}/par-levels"
              payload: { product_id: "${prod_id}", par_units: 1 }
              as: LocationManager
              as_user_id: "${loc_id}"
            - call: "POST /clients/${client_id}/subscriptions"
              payload: { plan_id: "${plan_id}", expected_client_version: "${client_v}" }
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { cumulative0: "$.data.cumulative_active_days" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { cumulative1: "$.data.cumulative_active_days" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: ClientAdmin
              as_user_id: "${client_id}"
              captures: { cumulative2: "$.data.cumulative_active_days" }
          assert:
            - "cumulative0 == 0"
            - "cumulative1 == 10"
            - "cumulative2 == 15"
