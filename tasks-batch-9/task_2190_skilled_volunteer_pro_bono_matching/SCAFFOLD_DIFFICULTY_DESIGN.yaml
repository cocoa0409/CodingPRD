      - name: match_offer_four_terminals_diverge
        grounds:
          - state_machines.MatchOffer.OFFERED_to_DECLINED
          - state_machines.MatchOffer.OFFERED_to_WITHDRAWN
          - state_machines.MatchOffer.OFFERED_to_EXPIRED
