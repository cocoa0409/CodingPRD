          - entities.Abstraction.fields.rework_round
          - validations[priority=62]
          - errors[ERR_REWORK_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The same abstraction traverses DRAFT -> SUBMITTED_FOR_QA -> REWORK_REQUIRED -> DRAFT
          three times; the identical reopen-draft call returns 200 on rounds 1 and 2 and 409
          ERR_REWORK_LIMIT_EXCEEDED on round 3, so the machine is a bounded cycle rather than a
          re-entrant loop or a linear chain.
