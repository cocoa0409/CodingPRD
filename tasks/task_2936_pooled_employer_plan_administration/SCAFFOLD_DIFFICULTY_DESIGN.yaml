            - "FiduciaryRoleAllocation.${alloc_im_id}.status == REVOKED with revoked_reason == SUPERSEDED_BY_NEW_ALLOCATION and revoked_at set, while ${alloc_im2_id}.status == ALLOCATED with acknowledged_at null"
