            - call: "POST /bag-kits/${id}/dispatch"
              payload: {}
              as: ZoneOperator
            - call: "POST /bag-kits/${id}/deliver"
              payload: {}
              as: Driver
            - call: "POST /pickup-requests"
              payload: { resident_id: "${id}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z", bags_claimed: 10 }
              as: Resident
              as_user_id: "${id}"
              captures: { p_id: $.data.id }
            - call: "POST /pickup-requests/${id}/route"
              payload: { driver_id: "drv-1", service_date: "2026-05-10" }
              as: ZoneOperator
            - call: "POST /pickup-requests/${id}/mark-collected"
              payload: { provisional_weight_kg: 40.0 }
              as: Driver
              as_user_id: "drv-1"
              captures: { t_id: $.data.id }
            - call: "POST /weight-tickets/${id}/certify"
              payload: { certified_weight_kg: 12.5, grade: "RESALE" }
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/routing-assignments"
              payload: {}
              as: ZoneOperator
              captures: { a_id: $.data.id, a_w: $.data.assigned_weight_kg }
          trigger:
            - call: "POST /routing-assignments/${id}/accept"
              payload: {}
              as: PartnerManager
              as_user_id: "${id}"
              captures: { a_st1: $.data.status }
            - call: "GET /partners/${id}"
              as: ZoneOperator
              captures: { com1: $.data.committed_kg, done1: $.data.completed_kg, rem1: $.data.remaining_kg }
            - call: "POST /routing-assignments/${id}/complete"
              payload: {}
              as: PartnerManager
