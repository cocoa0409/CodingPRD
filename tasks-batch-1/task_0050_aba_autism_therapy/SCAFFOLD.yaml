# =============================================================================
# Scaffold: ABA Autism Behavioral Therapy benchmark seed tables
# =============================================================================

scenario: |
  50. ABA Autism Behavioral Therapy: diagnostic evaluation, treatment plan,
  unit-hour pre-authorization, BCBA supervision ratio, parent training,
  insurance reimbursement cycle, therapist scheduling, Authorization Renewal

domain_name: aba-autism-therapy
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency      # OCC on Authorization.version for renewal-supersede
    - cascading_side_effects      # session deliver/void chains pool ledger + supervision + claim
    - dual_variant_calculation    # provisional (scheduled) vs final (delivered) billed amount
    - rate_threshold_triggers     # BCBA supervision ratio breakpoint (>= vs >)

  entity_topology: flat
  # Peer entities linked by foreign keys; URL paths are flat collections
  # (/authorizations/{id}, /therapy-sessions/{id}) rather than deeply nested.

  state_machine_shape: branching
  # DiagnosticEvaluation, TreatmentPlan, Authorization, TherapySession, Claim each
  # fork (approve/reject, deliver/no-show, paid/denied) with divergent side effects.

  relationship_patterns:
    - one_to_many        # Authorization has many TherapySession; TreatmentPlan has many Authorization
    - cross_aggregate    # TherapySession references Provider and Authorization across aggregates
    - self_referential   # Authorization.superseded_by_id -> Authorization.id (renewal chain)

  role_model: peer_roles
  # IntakeCoordinator, BCBA, RBT, BillingSpecialist, Caregiver each own distinct operations.

  consistency_model: immediate
  # All ledger, supervision, and posture recomputations are atomic within the request.

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Child's full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: caregiver_user_id, type: string, source: input, description: "Opaque caregiver/guardian identifier who acts as Caregiver for this client" }
      - { name: insurance_payer_id, type: string, source: input, description: "FK -> Payer.id; the client's insurance payer" }
      - { name: status, type: enum, source: system, description: "INTAKE | ACTIVE | DISCHARGED", default: "INTAKE", constraints: "INTAKE on create; ACTIVE when a TreatmentPlan is APPROVED; DISCHARGED via discharge endpoint" }

  - name: Payer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Insurance payer / plan name" }
      - { name: allowed_rate_cents, type: integer, source: input, description: "Contracted allowed amount per 15-minute unit, in cents" }
      - { name: coinsurance_pct, type: number, source: input, description: "Patient coinsurance fraction of allowed amount, e.g. 0.20", constraints: "0 <= coinsurance_pct <= 1" }
      - { name: supervision_ratio_pct, type: number, source: input, description: "Minimum BCBA supervision as fraction of RBT direct-therapy delivered units, e.g. 0.10", constraints: "0 < supervision_ratio_pct <= 1" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Provider full name" }
      - { name: credential, type: enum, source: input, description: "BCBA | RBT", constraints: "BCBA supervises and bills supervision; RBT delivers direct therapy" }
      - { name: npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: supervising_bcba_id, type: string, source: input, description: "FK -> Provider.id; for an RBT, the BCBA who supervises them; null for a BCBA" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE", constraints: "ACTIVE on create; INACTIVE via deactivate endpoint" }

  - name: DiagnosticEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the evaluated child" }
      - { name: evaluator_bcba_id, type: string, source: input, description: "FK -> Provider.id; BCBA who performs the evaluation" }
      - { name: assessment_score, type: integer, source: input, description: "Composite severity score from the diagnostic instrument (0-180)", constraints: "0 <= assessment_score <= 180" }
      - { name: severity_level, type: enum, source: computed, description: "MILD | MODERATE | SEVERE — derived from assessment_score thresholds" }
      - { name: recommended_weekly_units, type: integer, source: computed, description: "Recommended weekly direct-therapy units derived from severity_level" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FINALIZED | REJECTED", default: "DRAFT", constraints: "DRAFT on create; SUBMITTED on submit; FINALIZED or REJECTED on review" }

  - name: TreatmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the child the plan covers" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> DiagnosticEvaluation.id; the FINALIZED evaluation backing this plan" }
      - { name: author_bcba_id, type: string, source: input, description: "FK -> Provider.id; BCBA who authored the plan" }
      - { name: requested_direct_units, type: integer, source: input, description: "Requested total direct-therapy units for the plan period", constraints: ">= 1" }
      - { name: requested_supervision_units, type: integer, source: input, description: "Requested total BCBA supervision units", constraints: ">= 0" }
      - { name: requested_parent_training_units, type: integer, source: input, description: "Requested total caregiver/parent-training units", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REVISION_REQUESTED | RETIRED", default: "DRAFT", constraints: "DRAFT on create; SUBMITTED on submit; APPROVED or REVISION_REQUESTED on review; REVISION_REQUESTED can re-SUBMIT (revision loop); RETIRED when superseded" }

  - name: Authorization
    parent: null
    common_fields: true   # supplies version for OCC renewal-supersede
    fields:
      - { name: treatment_plan_id, type: string, source: input, description: "FK -> TreatmentPlan.id; the APPROVED plan this authorization funds" }
      - { name: payer_id, type: string, source: input, description: "FK -> Payer.id; authorizing insurance payer" }
      - { name: authorized_direct_units, type: integer, source: input, description: "Pre-authorized direct-therapy unit pool", constraints: ">= 0" }
      - { name: authorized_supervision_units, type: integer, source: input, description: "Pre-authorized BCBA supervision unit pool", constraints: ">= 0" }
      - { name: authorized_parent_training_units, type: integer, source: input, description: "Pre-authorized parent-training unit pool", constraints: ">= 0" }
      - { name: period_start, type: string, source: input, description: "ISO date; authorization window start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date; authorization window end (inclusive)" }
      - { name: reserved_direct_units, type: integer, source: computed, description: "Direct units tied to SCHEDULED sessions on this authorization" }
      - { name: delivered_direct_units, type: integer, source: computed, description: "Direct units committed by DELIVERED sessions on this authorization" }
      - { name: reserved_supervision_units, type: integer, source: computed, description: "Supervision units tied to SCHEDULED supervision sessions" }
      - { name: delivered_supervision_units, type: integer, source: computed, description: "Supervision units committed by DELIVERED supervision sessions" }
      - { name: reserved_parent_training_units, type: integer, source: computed, description: "Parent-training units tied to SCHEDULED parent-training sessions" }
      - { name: delivered_parent_training_units, type: integer, source: computed, description: "Parent-training units committed by DELIVERED parent-training sessions" }
      - { name: remaining_direct_units, type: integer, source: computed, description: "= authorized_direct_units - reserved_direct_units - delivered_direct_units" }
      - { name: supervision_status, type: enum, source: computed, description: "COMPLIANT | DEFICIENT — derived by comparing delivered_supervision_units against the payer ratio over delivered_direct_units" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED | RENEWED", default: "ACTIVE", constraints: "ACTIVE on create; EXHAUSTED when all pools fully consumed; EXPIRED past period_end via close endpoint; RENEWED when a successor supersedes it" }
      - { name: superseded_by_id, type: string, source: computed, description: "FK -> Authorization.id; the renewal authorization that supersedes this one; null until renewed" }

  - name: TherapySession
    parent: null
    common_fields: true
    fields:
      - { name: authorization_id, type: string, source: input, description: "FK -> Authorization.id; the unit pool this session draws from" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; therapist delivering the session" }
      - { name: service_line, type: enum, source: input, description: "DIRECT_THERAPY | SUPERVISION | PARENT_TRAINING", constraints: "DIRECT_THERAPY drawn by RBT; SUPERVISION by BCBA; PARENT_TRAINING by BCBA" }
      - { name: scheduled_start, type: string, source: input, description: "ISO 8601 UTC session start" }
      - { name: scheduled_end, type: string, source: input, description: "ISO 8601 UTC session end; intervals are half-open [start,end)" }
      - { name: scheduled_units, type: integer, source: input, description: "15-minute units reserved at scheduling (e.g. 8 = 2 hours)", constraints: ">= 1" }
      - { name: delivered_units, type: integer, source: input, description: "Actual units rendered, supplied on DELIVERED transition; 0 < delivered_units <= scheduled_units" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DELIVERED | NO_SHOW | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED on create; DELIVERED, NO_SHOW, or CANCELLED on transition" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> TherapySession.id; the DELIVERED session being billed" }
      - { name: payer_id, type: string, source: computed, description: "FK -> Payer.id; copied from the session's authorization payer" }
      - { name: billed_cents, type: integer, source: computed, description: "Provider's billed amount; provisional at create, finalized at adjudication" }
      - { name: allowed_cents, type: integer, source: computed, description: "Payer-allowed amount set at adjudication" }
      - { name: patient_responsibility_cents, type: integer, source: computed, description: "Coinsurance portion of allowed_cents owed by the family" }
      - { name: payer_paid_cents, type: integer, source: computed, description: "= allowed_cents - patient_responsibility_cents on PAID" }
      - { name: denial_reason, type: enum, source: input, description: "NONE | NOT_AUTHORIZED | SUPERVISION_DEFICIENT | DUPLICATE — set on DENIED", default: "NONE" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PAID | DENIED", default: "DRAFT", constraints: "DRAFT on create; SUBMITTED on submit; PAID or DENIED on adjudication" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DiagnosticEvaluation
    initial_state: DRAFT
    terminal_states: [FINALIZED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /diagnostic-evaluations/{id}/submit"
        actor: BCBA
        preconditions:
          - "Acting provider is the evaluator_bcba_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "severity_level and recommended_weekly_units recomputed via diagnostic_severity calc"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /diagnostic-evaluations/{id}/review"
        actor: IntakeCoordinator
        preconditions:
          - "decision == FINALIZE in body"
        side_effects:
          - "Evaluation becomes eligible to back a TreatmentPlan"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /diagnostic-evaluations/{id}/review"
        actor: IntakeCoordinator
        preconditions:
          - "decision == REJECT in body"
        side_effects: []

  - entity: TreatmentPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /treatment-plans/{id}/submit"
        actor: BCBA
        preconditions:
          - "Acting provider is the author_bcba_id (ERR_NOT_RESOURCE_OWNER)"
          - "Backing DiagnosticEvaluation.status == FINALIZED (ERR_EVALUATION_NOT_FINALIZED)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /treatment-plans/{id}/review"
        actor: IntakeCoordinator
        preconditions:
          - "decision == APPROVE in body"
        side_effects:
          - "Client.status -> ACTIVE if currently INTAKE (bubble-up)"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /treatment-plans/{id}/review"
        actor: IntakeCoordinator
        preconditions:
          - "decision == REQUEST_REVISION in body"
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /treatment-plans/{id}/submit"
        actor: BCBA
        preconditions:
          - "Acting provider is the author_bcba_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
        note: "Revision loop: a plan may cycle SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
      - from: APPROVED
        to: RETIRED
        trigger: "system: retire on plan supersede"
        actor: system
        preconditions:
          - "A newer APPROVED TreatmentPlan exists for the same client_id"
        side_effects: []

  - entity: Authorization
    initial_state: ACTIVE
    terminal_states: [EXPIRED, RENEWED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: recomputed after any TherapySession state change against this authorization (schedule, deliver, no-show, cancel)"
        actor: system
        preconditions:
          - "remaining_direct_units == 0 after the pool-ledger recompute (reserved_direct_units + delivered_direct_units == authorized_direct_units)"
        side_effects:
          - "New DIRECT_THERAPY sessions against this authorization are rejected with ERR_UNITS_EXCEEDED"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: recomputed after any TherapySession state change that frees reserved units (no-show, cancel)"
        actor: system
        preconditions:
          - "remaining_direct_units > 0 after the freeing recompute"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /authorizations/{id}/close"
        actor: BillingSpecialist
        preconditions:
          - "current clock date > period_end (ERR_AUTHORIZATION_NOT_EXPIRABLE)"
        side_effects:
          - "All SCHEDULED sessions on this authorization are CANCELLED (cascade), freeing their reserved units"
      - from: ACTIVE
        to: RENEWED
        trigger: "POST /authorizations/{id}/renew"
        actor: BillingSpecialist
        preconditions:
          - "expected_authorization_version matches Authorization.version (ERR_STALE_VERSION)"
        side_effects:
          - "A successor Authorization is created with authorized_direct_units = body.authorized_direct_units + predecessor.remaining_direct_units (carry-forward of unconsumed direct units); authorized_supervision_units and authorized_parent_training_units taken from the body verbatim"
          - "this.superseded_by_id set to the successor id"
          - "increments Authorization.version by 1"

  - entity: TherapySession
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /therapy-sessions/{id}/deliver"
        actor: BCBA
        preconditions:
          - "Owning Authorization.status IN {ACTIVE, EXHAUSTED} — i.e. not EXPIRED and not RENEWED (ERR_AUTHORIZATION_NOT_ACTIVE)"
          - "0 < delivered_units <= scheduled_units (ERR_DELIVERED_UNITS_INVALID)"
          - "For SUPERVISION line, acting provider credential == BCBA (ERR_CREDENTIAL_MISMATCH)"
        side_effects:
          - "Authorization reserved_<line>_units -= scheduled_units; delivered_<line>_units += delivered_units (pool ledger sync; net (scheduled-delivered) returns to remaining)"
          - "Authorization.supervision_status recomputed via supervision_ratio calc"
          - "If pools now fully consumed, Authorization ACTIVE -> EXHAUSTED (bubble-up)"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /therapy-sessions/{id}/no-show"
        actor: RBT
        preconditions: []
        side_effects:
          - "Authorization reserved_<line>_units -= scheduled_units (reservation released back to remaining)"
          - "If Authorization was EXHAUSTED and now has remaining units, EXHAUSTED -> ACTIVE (bubble-up)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /therapy-sessions/{id}/cancel"
        actor: RBT
        preconditions: []
        side_effects:
          - "Authorization reserved_<line>_units -= scheduled_units (reservation released back to remaining)"
          - "If Authorization was EXHAUSTED and now has remaining units, EXHAUSTED -> ACTIVE (bubble-up)"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "No other SUBMITTED or PAID Claim exists for the same session_id (ERR_DUPLICATE_CLAIM)"
        side_effects:
          - "billed_cents finalized to delivered-unit basis via claim_billed calc (final variant)"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /claims/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "decision == PAY in body"
          - "Owning Authorization.supervision_status == COMPLIANT (ERR_SUPERVISION_DEFICIENT)"
        side_effects:
          - "allowed_cents, patient_responsibility_cents, payer_paid_cents computed via claim_remittance calc"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /claims/{id}/adjudicate"
        actor: BillingSpecialist
        preconditions:
          - "decision == DENY in body"
        side_effects:
          - "denial_reason set from body; allowed_cents=0, payer_paid_cents=0, patient_responsibility_cents=0"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: authorization-renew-stale-version
    parent_entity: Authorization
    write_endpoint: "POST /authorizations/{id}/renew"
    occ_field: "expected_authorization_version"
    description: |
      Renewing an Authorization whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      already renewed the authorization (which legitimately supersedes it and
      carries remaining units into a successor), so the current writer's view of
      the authorization is stale and a second renewal would double-issue the
      successor pool.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: diagnostic_severity
    trigger: "DiagnosticEvaluation DRAFT -> SUBMITTED"
    algorithm: threshold
    formula: |
      # assessment_score in [0,180]; tiered severity then recommended weekly units
      if assessment_score >= 120:
        severity_level = SEVERE;   recommended_weekly_units = 160   # 40 h/wk
      elif assessment_score >= 60:
        severity_level = MODERATE; recommended_weekly_units = 100   # 25 h/wk
      else:
        severity_level = MILD;     recommended_weekly_units = 40    # 10 h/wk
    input_set: "Single DiagnosticEvaluation; assessment_score only"
    constants:
      SEVERE_FLOOR: 120
      MODERATE_FLOOR: 60
      SEVERE_WEEKLY_UNITS: 160
      MODERATE_WEEKLY_UNITS: 100
      MILD_WEEKLY_UNITS: 40
    precision: "integer units; thresholds are inclusive lower bounds (>=)"

  - name: supervision_ratio
    trigger: "TherapySession SCHEDULED -> DELIVERED (recompute on owning Authorization); also read for Claim adjudication gate"
    algorithm: threshold
    formula: |
      # required supervision is a ceiling fraction of delivered DIRECT units
      required_supervision_units = ceil(authorization.delivered_direct_units
                                        * payer.supervision_ratio_pct)
      if authorization.delivered_supervision_units >= required_supervision_units:
        supervision_status = COMPLIANT
      else:
        supervision_status = DEFICIENT
    input_set: "delivered_direct_units and delivered_supervision_units of one Authorization; payer.supervision_ratio_pct"
    constants:
      ROUNDING: "ceil on the required-units product"
    precision: "integer units; boundary is delivered_supervision_units >= required (>=, not >)"

  - name: claim_billed
    trigger: "Claim create (provisional variant) and Claim DRAFT -> SUBMITTED (final variant)"
    algorithm: forward_looking
    formula: |
      unit_rate_cents = SERVICE_LINE_RATE_CENTS[session.service_line]
      # provisional (at Claim create): bill the scheduled (reserved) units
      provisional billed_cents = session.scheduled_units * unit_rate_cents
      # final (at SUBMITTED): bill the actually delivered units
      final billed_cents       = session.delivered_units * unit_rate_cents
    input_set: "One TherapySession; its scheduled_units vs delivered_units"
    constants:
      SERVICE_LINE_RATE_CENTS:
        DIRECT_THERAPY: 3200
        SUPERVISION: 4800
        PARENT_TRAINING: 2400
    precision: "integer cents; no rounding (unit * rate is exact)"
    variants:
      - name: provisional
        when: "at Claim creation, before session reconciliation"
        difference: "uses session.scheduled_units (reserved estimate)"
      - name: final
        when: "at Claim SUBMITTED"
        difference: "uses session.delivered_units (actuals); differs from provisional whenever delivered_units < scheduled_units"

  - name: claim_remittance
    trigger: "Claim SUBMITTED -> PAID"
    algorithm: aggregation
    formula: |
      unit_rate_cents = SERVICE_LINE_RATE_CENTS[session.service_line]
      allowed_cents = session.delivered_units * payer.allowed_rate_cents
      patient_responsibility_cents = round_half_up(allowed_cents * payer.coinsurance_pct)
      payer_paid_cents = allowed_cents - patient_responsibility_cents
    input_set: "The PAID Claim's session.delivered_units and its payer's allowed_rate_cents + coinsurance_pct"
    constants:
      ROUNDING: "round_half_up on patient_responsibility_cents, then subtract"
    precision: "integer cents; round_half_up applied to coinsurance BEFORE subtracting (pinned order: compute patient share first, payer share is the remainder)"

  - name: authorization_pool_ledger
    trigger: "Any TherapySession state change against an Authorization"
    algorithm: aggregation
    formula: |
      reserved_<line>_units  = sum(scheduled_units for sessions of <line> in SCHEDULED)
      delivered_<line>_units = sum(delivered_units for sessions of <line> in DELIVERED)
      remaining_direct_units = authorized_direct_units
                               - reserved_direct_units - delivered_direct_units
      # INVARIANT: reserved_direct_units + delivered_direct_units + remaining_direct_units
      #            == authorized_direct_units, at all times.
    input_set: "All non-terminal-freed TherapySession rows for one Authorization, grouped by service_line and status"
    constants: {}
    precision: "integer units; status filter is explicit (SCHEDULED -> reserved, DELIVERED -> delivered; NO_SHOW/CANCELLED contribute to neither)"
    variants:
      - name: reservation_basis
        when: "while a session is SCHEDULED — its full scheduled_units are held against the pool"
        difference: "remaining_direct_units subtracts scheduled_units (the reservation), so a session scheduled for 8 units holds 8 even if it will later deliver fewer"
      - name: delivered_basis
        when: "after the session transitions to DELIVERED — only the actual delivered_units are committed"
        difference: "remaining_direct_units subtracts delivered_units instead of scheduled_units; the (scheduled_units - delivered_units) difference returns to the pool, so the two bases diverge whenever delivered_units < scheduled_units"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2.5
    category: business_constraint
    check: "Request body is well-formed JSON, all required input fields present, enum/numeric values within declared ranges (e.g. assessment_score in [0,180], coinsurance_pct in [0,1], scheduled_units >= 1)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all mutating endpoints"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body foreign-key resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting provider must own the resource for owner-gated transitions (evaluator_bcba_id / author_bcba_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "evaluation submit, treatment-plan submit"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /submit, /review, /deliver, /no-show, /cancel, /adjudicate, /close, /renew endpoints"

  - priority: 6
    category: business_referential
    check: "TreatmentPlan submit requires backing DiagnosticEvaluation.status == FINALIZED"
    error_id: ERR_EVALUATION_NOT_FINALIZED
    http_status: 409
    applies_to: "POST /treatment-plans/{id}/submit"

  - priority: 7
    category: business_referential
    check: "Provider credential must match service_line (DIRECT_THERAPY->RBT, SUPERVISION/PARENT_TRAINING->BCBA)"
    error_id: ERR_CREDENTIAL_MISMATCH
    http_status: 409
    applies_to: "POST /therapy-sessions (create), POST /therapy-sessions/{id}/deliver"

  - priority: 8
    category: business_temporal
    check: "Authorization window must cover the session: period_start <= scheduled_start date <= period_end"
    error_id: ERR_OUTSIDE_AUTH_WINDOW
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 9
    category: business_temporal
    check: "Provider must not already have a SCHEDULED/DELIVERED session overlapping [scheduled_start, scheduled_end) (half-open)"
    error_id: ERR_PROVIDER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 10
    category: business_temporal
    check: "Client must not have any SCHEDULED/DELIVERED session within 15 minutes of [scheduled_start, scheduled_end) (buffered overlap)"
    error_id: ERR_CLIENT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 10.5
    category: state
    check: "Session deliver requires owning Authorization.status IN {ACTIVE, EXHAUSTED} (not EXPIRED/RENEWED)"
    error_id: ERR_AUTHORIZATION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /therapy-sessions/{id}/deliver"

  - priority: 11
    category: business_constraint
    check: "delivered_units supplied on deliver must satisfy 0 < delivered_units <= scheduled_units"
    error_id: ERR_DELIVERED_UNITS_INVALID
    http_status: 422
    applies_to: "POST /therapy-sessions/{id}/deliver"

  - priority: 12
    category: business_fiscal
    check: "Scheduling must not push reserved+delivered above authorized pool for the session's service_line"
    error_id: ERR_UNITS_EXCEEDED
    http_status: 409
    applies_to: "POST /therapy-sessions"

  - priority: 13
    category: business_fiscal
    check: "Claim adjudication to PAID requires owning Authorization.supervision_status == COMPLIANT"
    error_id: ERR_SUPERVISION_DEFICIENT
    http_status: 409
    applies_to: "POST /claims/{id}/adjudicate"

  - priority: 14
    category: business_constraint
    check: "At most one non-terminal-or-PAID Claim per session_id"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /claims, POST /claims/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "Claim may only be created for a session whose status == DELIVERED"
    error_id: ERR_SESSION_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /claims"

  - priority: 16
    category: business_temporal
    check: "Authorization close requires current clock date strictly after period_end"
    error_id: ERR_AUTHORIZATION_NOT_EXPIRABLE
    http_status: 409
    applies_to: "POST /authorizations/{id}/close"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock (time-gated authorization window/close) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock for deterministic time-gated tests"
    roles: [BillingSpecialist, IntakeCoordinator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server current time set to to_iso8601 for window and close checks"]

  # ---- Payer ----
  - method: POST
    path: "/payers"
    description: "Create an insurance Payer"
    roles: [IntakeCoordinator, BillingSpecialist]
    code: 201
    input: [name, allowed_rate_cents, coinsurance_pct, supervision_ratio_pct]
    output: Payer
    side_effects: []
  - method: GET
    path: "/payers/{id}"
    description: "Get a Payer"
    roles: [IntakeCoordinator, BillingSpecialist, BCBA]
    code: 200
    input: []
    output: Payer
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a Client (child) in INTAKE status"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, date_of_birth, caregiver_user_id, insurance_payer_id]
    output: Client
    side_effects: ["status=INTAKE"]
  - method: GET
    path: "/clients/{id}"
    description: "Get a Client"
    roles: [IntakeCoordinator, BCBA, BillingSpecialist, Caregiver]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/clients"
    description: "List Clients, optionally filtered by insurance payer"
    roles: [IntakeCoordinator, BCBA, BillingSpecialist]
    code: 200
    input: ["insurance_payer_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/clients/{id}/discharge"
    description: "Discharge a Client"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Client
    side_effects: ["status=DISCHARGED"]

  # ---- Provider ----
  - method: POST
    path: "/providers"
    description: "Create a Provider (BCBA or RBT)"
    roles: [IntakeCoordinator]
    code: 201
    input: [full_name, credential, npi, "supervising_bcba_id?"]
    output: Provider
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/providers/{id}"
    description: "Get a Provider"
    roles: [IntakeCoordinator, BCBA, RBT, BillingSpecialist]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/providers/{id}/deactivate"
    description: "Deactivate a Provider"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: Provider
    side_effects: ["status=INACTIVE"]
  - method: GET
    path: "/providers"
    description: "List Providers, optionally filtered by supervising BCBA"
    roles: [IntakeCoordinator, BCBA, BillingSpecialist]
    code: 200
    input: ["supervising_bcba_id?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  # ---- DiagnosticEvaluation ----
  - method: POST
    path: "/diagnostic-evaluations"
    description: "Create a DiagnosticEvaluation in DRAFT"
    roles: [BCBA]
    code: 201
    input: [client_id, evaluator_bcba_id, assessment_score]
    output: DiagnosticEvaluation
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/diagnostic-evaluations/{id}"
    description: "Get a DiagnosticEvaluation"
    roles: [BCBA, IntakeCoordinator]
    code: 200
    input: []
    output: DiagnosticEvaluation
    side_effects: []
  - method: GET
    path: "/diagnostic-evaluations"
    description: "List DiagnosticEvaluations, optionally filtered by client"
    roles: [BCBA, IntakeCoordinator]
    code: 200
    input: ["client_id?", "evaluator_bcba_id?", "limit?", "offset?"]
    output: DiagnosticEvaluation[]
    side_effects: []
  - method: POST
    path: "/diagnostic-evaluations/{id}/submit"
    description: "Submit a DiagnosticEvaluation for review"
    roles: [BCBA]
    code: 200
    input: []
    output: DiagnosticEvaluation
    side_effects: ["computes severity_level + recommended_weekly_units; status DRAFT->SUBMITTED"]
  - method: POST
    path: "/diagnostic-evaluations/{id}/review"
    description: "Finalize or reject a submitted evaluation"
    roles: [IntakeCoordinator]
    code: 200
    input: [decision]
    output: DiagnosticEvaluation
    side_effects: ["status SUBMITTED->FINALIZED or SUBMITTED->REJECTED"]

  # ---- TreatmentPlan ----
  - method: POST
    path: "/treatment-plans"
    description: "Create a TreatmentPlan in DRAFT"
    roles: [BCBA]
    code: 201
    input: [client_id, evaluation_id, author_bcba_id, requested_direct_units, requested_supervision_units, requested_parent_training_units]
    output: TreatmentPlan
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/treatment-plans/{id}"
    description: "Get a TreatmentPlan"
    roles: [BCBA, IntakeCoordinator, BillingSpecialist]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []
  - method: GET
    path: "/treatment-plans"
    description: "List TreatmentPlans, optionally filtered by client, evaluation, or author"
    roles: [BCBA, IntakeCoordinator, BillingSpecialist]
    code: 200
    input: ["client_id?", "evaluation_id?", "author_bcba_id?", "limit?", "offset?"]
    output: TreatmentPlan[]
    side_effects: []
  - method: POST
    path: "/treatment-plans/{id}/submit"
    description: "Submit (or resubmit after revision) a TreatmentPlan"
    roles: [BCBA]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status DRAFT|REVISION_REQUESTED -> SUBMITTED"]
  - method: POST
    path: "/treatment-plans/{id}/review"
    description: "Approve or request revision of a submitted plan"
    roles: [IntakeCoordinator]
    code: 200
    input: [decision]
    output: TreatmentPlan
    side_effects: ["APPROVE: status->APPROVED, Client INTAKE->ACTIVE, retire prior APPROVED plan for same client; REQUEST_REVISION: status->REVISION_REQUESTED"]

  # ---- Authorization ----
  - method: POST
    path: "/authorizations"
    description: "Create an Authorization (unit-hour pre-authorization) for an APPROVED plan"
    roles: [BillingSpecialist]
    code: 201
    input: [treatment_plan_id, payer_id, authorized_direct_units, authorized_supervision_units, authorized_parent_training_units, period_start, period_end]
    output: Authorization
    side_effects: ["status=ACTIVE; reserved/delivered pools=0; remaining_direct_units=authorized_direct_units"]
  - method: GET
    path: "/authorizations/{id}"
    description: "Get an Authorization (with computed pool ledger and supervision_status)"
    roles: [BillingSpecialist, BCBA, IntakeCoordinator]
    code: 200
    input: []
    output: Authorization
    side_effects: []
  - method: GET
    path: "/authorizations"
    description: "List Authorizations, optionally filtered by treatment plan, payer, or superseding authorization"
    roles: [BillingSpecialist, BCBA, IntakeCoordinator]
    code: 200
    input: ["treatment_plan_id?", "payer_id?", "superseded_by_id?", "limit?", "offset?"]
    output: Authorization[]
    side_effects: []
  - method: POST
    path: "/authorizations/{id}/renew"
    description: "Renew an Authorization, creating a successor that carries remaining units forward (OCC-guarded)"
    roles: [BillingSpecialist]
    code: 201
    input: [expected_authorization_version, authorized_direct_units, authorized_supervision_units, authorized_parent_training_units, period_start, period_end]
    output: Authorization
    side_effects: ["successor Authorization created (authorized_direct_units = body.authorized_direct_units + predecessor.remaining_direct_units); this.superseded_by_id set; this.status ACTIVE->RENEWED; increments Authorization.version by 1"]
  - method: POST
    path: "/authorizations/{id}/close"
    description: "Close (expire) an Authorization past its period_end"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Authorization
    side_effects: ["status ACTIVE->EXPIRED; cascade-cancel SCHEDULED sessions, freeing reserved units"]

  # ---- TherapySession ----
  - method: POST
    path: "/therapy-sessions"
    description: "Schedule a TherapySession, reserving units against an Authorization"
    roles: [RBT, BCBA]
    code: 201
    input: [authorization_id, provider_id, service_line, scheduled_start, scheduled_end, scheduled_units]
    output: TherapySession
    side_effects: ["status=SCHEDULED; Authorization reserved_<line>_units += scheduled_units; remaining_direct_units recomputed; possible Authorization ACTIVE->EXHAUSTED if remaining_direct_units hits 0"]
  - method: GET
    path: "/therapy-sessions/{id}"
    description: "Get a TherapySession"
    roles: [RBT, BCBA, BillingSpecialist]
    code: 200
    input: []
    output: TherapySession
    side_effects: []
  - method: GET
    path: "/therapy-sessions"
    description: "List TherapySessions, optionally filtered by authorization or provider"
    roles: [RBT, BCBA, BillingSpecialist]
    code: 200
    input: ["authorization_id?", "provider_id?", "limit?", "offset?"]
    output: TherapySession[]
    side_effects: []
  - method: POST
    path: "/therapy-sessions/{id}/deliver"
    description: "Mark a session DELIVERED with actual units"
    roles: [BCBA, RBT]
    code: 200
    input: [delivered_units]
    output: TherapySession
    side_effects: ["status SCHEDULED->DELIVERED; pool ledger sync; supervision_ratio recompute; possible Authorization ACTIVE->EXHAUSTED"]
  - method: POST
    path: "/therapy-sessions/{id}/no-show"
    description: "Mark a session NO_SHOW, releasing its reservation"
    roles: [RBT, BCBA]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["status SCHEDULED->NO_SHOW; reservation released; possible Authorization EXHAUSTED->ACTIVE"]
  - method: POST
    path: "/therapy-sessions/{id}/cancel"
    description: "Cancel a scheduled session, releasing its reservation"
    roles: [RBT, BCBA]
    code: 200
    input: []
    output: TherapySession
    side_effects: ["status SCHEDULED->CANCELLED; reservation released; possible Authorization EXHAUSTED->ACTIVE"]

  # ---- Claim ----
  - method: POST
    path: "/claims"
    description: "Create a DRAFT Claim for a DELIVERED session (provisional billed amount)"
    roles: [BillingSpecialist]
    code: 201
    input: [session_id]
    output: Claim
    side_effects: ["status=DRAFT; payer_id copied; billed_cents=provisional (scheduled-unit basis)"]
  - method: GET
    path: "/claims/{id}"
    description: "Get a Claim"
    roles: [BillingSpecialist, BCBA]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "List Claims, optionally filtered by session or payer"
    roles: [BillingSpecialist, BCBA]
    code: 200
    input: ["session_id?", "payer_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/claims/{id}/submit"
    description: "Submit a Claim, finalizing billed_cents to the delivered-unit basis"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DRAFT->SUBMITTED; billed_cents finalized (delivered-unit basis)"]
  - method: POST
    path: "/claims/{id}/adjudicate"
    description: "Adjudicate a submitted Claim (pay or deny)"
    roles: [BillingSpecialist]
    code: 200
    input: [decision, "denial_reason?"]
    output: Claim
    side_effects: ["PAY: status->PAID, remittance computed (allowed/patient/payer); DENY: status->DENIED, denial_reason set, money zeroed"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body resource does not exist" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body, missing required field, or out-of-range value" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Acting provider is not the owner (evaluator/author) of an owner-gated resource" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_EVALUATION_NOT_FINALIZED, http: 409, condition: "TreatmentPlan submit requires a FINALIZED backing evaluation" }
  - { id: ERR_CREDENTIAL_MISMATCH, http: 409, condition: "Provider credential does not match the session service_line" }
  - { id: ERR_OUTSIDE_AUTH_WINDOW, http: 409, condition: "Session start date is outside the authorization period window" }
  - { id: ERR_PROVIDER_DOUBLE_BOOKED, http: 409, condition: "Provider already has an overlapping SCHEDULED/DELIVERED session" }
  - { id: ERR_CLIENT_BUFFER_CONFLICT, http: 409, condition: "Client has another session within the 15-minute buffer window" }
  - { id: ERR_DELIVERED_UNITS_INVALID, http: 422, condition: "delivered_units not in (0, scheduled_units]" }
  - { id: ERR_UNITS_EXCEEDED, http: 409, condition: "Scheduling would exceed the authorized unit pool for the service line" }
  - { id: ERR_AUTHORIZATION_NOT_ACTIVE, http: 409, condition: "Session deliver requires the owning Authorization to be ACTIVE or EXHAUSTED (not EXPIRED/RENEWED)" }
  - { id: ERR_SUPERVISION_DEFICIENT, http: 409, condition: "Claim cannot be paid while the Authorization supervision_status is DEFICIENT" }
  - { id: ERR_DUPLICATE_CLAIM, http: 409, condition: "Another non-DENIED/non-DRAFT Claim already exists for the session" }
  - { id: ERR_SESSION_NOT_DELIVERED, http: 409, condition: "Claim can only be created for a DELIVERED session" }
  - { id: ERR_AUTHORIZATION_NOT_EXPIRABLE, http: 409, condition: "Authorization close requires the clock to be past period_end" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_authorization_version does not match current Authorization.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Operations staff who onboard clients/providers and review evaluations and plans"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /clients/{id}/discharge — discharge client"
      - "POST /providers — create provider"
      - "POST /providers/{id}/deactivate — deactivate provider"
      - "POST /diagnostic-evaluations/{id}/review — finalize/reject evaluation"
      - "POST /treatment-plans/{id}/review — approve/request-revision plan"
    shared_operations:
      - "POST /payers — create payer (shared with BillingSpecialist)"
      - "GET reads on clients, providers, payers, evaluations, plans, authorizations"

  - name: BCBA
    description: "Board Certified Behavior Analyst: authors evaluations and plans, supervises, delivers supervision/parent-training sessions"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /diagnostic-evaluations — create evaluation"
      - "POST /diagnostic-evaluations/{id}/submit — submit own evaluation"
      - "POST /treatment-plans — create plan"
      - "POST /treatment-plans/{id}/submit — submit own plan"
    shared_operations:
      - "POST /therapy-sessions — schedule session (shared with RBT)"
      - "POST /therapy-sessions/{id}/deliver — deliver session (shared with RBT)"
      - "POST /therapy-sessions/{id}/no-show — mark no-show (shared with RBT)"
      - "POST /therapy-sessions/{id}/cancel — cancel session (shared with RBT)"
      - "GET reads on providers, evaluations, plans, authorizations, sessions, claims, payers, clients"

  - name: RBT
    description: "Registered Behavior Technician: delivers direct-therapy sessions under BCBA supervision"
    identity: "entity_backed:Provider"
    exclusive_operations: []
    shared_operations:
      - "POST /therapy-sessions — schedule session (shared with BCBA)"
      - "POST /therapy-sessions/{id}/deliver — deliver session (shared with BCBA)"
      - "POST /therapy-sessions/{id}/no-show — mark no-show (shared with BCBA)"
      - "POST /therapy-sessions/{id}/cancel — cancel session (shared with BCBA)"
      - "GET reads on providers, sessions"

  - name: BillingSpecialist
    description: "Manages authorizations, renewals, and the insurance reimbursement cycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /authorizations — create authorization"
      - "POST /authorizations/{id}/renew — renew authorization"
      - "POST /authorizations/{id}/close — close authorization"
      - "POST /claims — create claim"
      - "POST /claims/{id}/submit — submit claim"
      - "POST /claims/{id}/adjudicate — adjudicate claim"
    shared_operations:
      - "POST /payers — create payer (shared with IntakeCoordinator)"
      - "POST /_clock/set_current_utc — set clock (shared with IntakeCoordinator)"
      - "GET reads on payers, clients, providers, plans, authorizations, sessions, claims"

  - name: Caregiver
    description: "Parent/guardian of a Client; read-only visibility into their child's record"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /clients/{id} — read own child's client record"
