  - entity: Venue
    field: status
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /v1/venues/{id}/archive"
        actor: President
        preconditions: []
        side_effects: ["ARCHIVED venues reject new bookings (ERR_VENUE_ARCHIVED); existing CONFIRMED bookings unaffected"]

  - entity: Concert
    field: status
    initial_state: PLANNING
    terminal_states: [PERFORMED, CANCELLED]
    transitions:
      - from: PLANNING
        to: VENUE_BOOKED
        trigger: "system (bubble-up: its VenueBooking reaches CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VENUE_BOOKED
        to: PROGRAM_LOCKED
        trigger: "POST /v1/concerts/{id}/transition (action=LOCK_PROGRAM)"
        actor: ChoirDirector
        preconditions:
          - "Booking CONFIRMED (ERR_BOOKING_NOT_CONFIRMED)"
          - "At least one non-VOID ProgramPiece and every non-VOID piece is CONFIRMED (ERR_NO_CONFIRMED_PIECES)"
          - "program_duration_seconds <= (booking end_at - start_at) - 900 seconds (ERR_PROGRAM_TOO_LONG)"
        side_effects: []
      - from: PROGRAM_LOCKED
        to: READY
        trigger: "POST /v1/concerts/{id}/transition (action=MARK_READY)"
        actor: ChoirDirector
        preconditions: ["Every CONFIRMED piece with guest_contract_id has that contract in PAID (ERR_CONTRACT_UNPAID)"]
        side_effects: []
      - from: READY
        to: PERFORMED
        trigger: "POST /v1/concerts/{id}/transition (action=PERFORM)"
        actor: ChoirDirector
        preconditions: ["clock now >= booking start_at (ERR_CONCERT_TOO_EARLY)"]
        side_effects: []
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /v1/concerts/{id}/transition (action=CANCEL)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["concert-cancel cascade (links below)"]
      - from: VENUE_BOOKED
        to: CANCELLED
        trigger: "POST /v1/concerts/{id}/transition (action=CANCEL)"
        actor: ChoirDirector
        preconditions: []
        side_effects:
          - "Link 1: its VenueBooking (REQUESTED|CONFIRMED) -> RELEASED"
          - "Link 2: booking release refunds deposit_cents to season treasury"
          - "Link 1b: non-VOID ProgramPieces -> VOID"
          - "Link 2b: piece void cancels linked GuestContracts in OFFERED|COUNTERED|ACCEPTED|APPROVED -> CANCELLED"
          - "Link 3b: contract cancellation after ACCEPTED posts cancellation_fee_cents (20% of quoted) as treasury debit"
      - from: PROGRAM_LOCKED
        to: CANCELLED
        trigger: "POST /v1/concerts/{id}/transition (action=CANCEL)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["Same cascade as VENUE_BOOKED -> CANCELLED"]
      - from: READY
        to: CANCELLED
        trigger: "POST /v1/concerts/{id}/transition (action=CANCEL)"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["Same cascade as VENUE_BOOKED -> CANCELLED; PAID contracts are NOT cancelled (ERR_INVALID_STATE if a PAID contract is linked — cancel those contracts' refunds manually first)"]
        note: "READY concerts with PAID guest contracts cannot be cancelled; contracts must be settled first"

  - entity: VenueBooking
    field: status
    initial_state: REQUESTED
    terminal_states: [DECLINED, RELEASED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /v1/venue-bookings/{id}/confirm"
        actor: Treasurer
        preconditions: ["treasury_balance_cents >= deposit_cents (ERR_INSUFFICIENT_TREASURY)"]
        side_effects: ["treasury debited deposit_cents; concert PLANNING -> VENUE_BOOKED bubble-up"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /v1/venue-bookings/{id}/decline"
        actor: ChoirDirector
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /v1/venue-bookings/{id}/release or system (concert cancel cascade)"
        actor: "ChoirDirector | system"
        preconditions: ["concert not PERFORMED"]
        side_effects: ["treasury credited deposit_cents; concert VENUE_BOOKED -> PLANNING if released manually"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /v1/venue-bookings/{id}/release"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["No treasury movement (no deposit was posted)"]

  - entity: ProgramPiece
    field: status
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /v1/program-pieces/{id}/confirm"
        actor: ChoirDirector
        preconditions:
          - "Concert in PLANNING or VENUE_BOOKED (ERR_INVALID_STATE)"
          - "Every member in featured_member_ids has performance_eligible == true (ERR_MEMBER_NOT_ELIGIBLE)"
          - "If guest_contract_id set: contract in ACCEPTED | APPROVED | PAID (ERR_CONTRACT_NOT_ACCEPTED)"
        side_effects: ["concert.program_duration_seconds recomputed"]
      - from: DRAFT
        to: VOID
        trigger: "POST /v1/program-pieces/{id}/void or system (concert cancel cascade)"
        actor: "ChoirDirector | system"
        preconditions: []
        side_effects: ["Linked GuestContract cancellation per concert-cancel cascade link 2b"]
      - from: CONFIRMED
        to: VOID
        trigger: "POST /v1/program-pieces/{id}/void or system (concert cancel cascade)"
        actor: "ChoirDirector | system"
        preconditions: ["Manual void: concert not PROGRAM_LOCKED or later (ERR_INVALID_STATE)"]
        side_effects: ["concert.program_duration_seconds recomputed; linked GuestContract cancellation per cascade link 2b"]

  - entity: GuestContract
    field: status
    initial_state: DRAFT
    terminal_states: [DECLINED, PAID, CANCELLED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /v1/guest-contracts/{id}/offer"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["quoted_fee_cents recomputed if service_lines changed; increments GuestContract.version by 1"]
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /v1/guest-contracts/{id}/counter"
        actor: ChoirDirector
        preconditions: ["OCC: expected_guest_contract_version matches (ERR_STALE_VERSION)"]
        side_effects: ["counter_count += 1; service_lines/travel_stipend replaced; quoted_fee_cents recomputed; increments version by 1"]
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /v1/guest-contracts/{id}/offer"
        actor: ChoirDirector
        preconditions: []
        side_effects: ["quoted_fee_cents recomputed; increments version by 1"]
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /v1/guest-contracts/{id}/accept"
        actor: ChoirDirector
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /v1/guest-contracts/{id}/decline"
        actor: ChoirDirector
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: DECLINED
        trigger: "POST /v1/guest-contracts/{id}/decline"
        actor: ChoirDirector
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: APPROVED
        trigger: "POST /v1/guest-contracts/{id}/approve"
        actor: President
        preconditions: []
        side_effects: ["approved_by_user_id set"]
      - from: APPROVED
        to: PAID
        trigger: "POST /v1/guest-contracts/{id}/pay"
        actor: Treasurer
        preconditions:
          - "Segregation of duties: paid_by_user_id != approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "treasury_balance_cents >= quoted_fee_cents (ERR_INSUFFICIENT_TREASURY)"
        side_effects: ["treasury debited quoted_fee_cents; paid_by_user_id set"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /v1/guest-contracts/{id}/cancel or system (concert cascade)"
        actor: "ChoirDirector | system"
        preconditions: []
        side_effects: ["No cancellation fee before ACCEPTED"]
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /v1/guest-contracts/{id}/cancel or system (concert cascade)"
        actor: "ChoirDirector | system"
        preconditions: []
        side_effects: ["No cancellation fee before ACCEPTED"]
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /v1/guest-contracts/{id}/cancel or system (concert cascade)"
        actor: "ChoirDirector | system"
        preconditions: []
        side_effects: ["No cancellation fee before ACCEPTED"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /v1/guest-contracts/{id}/cancel or system (concert cascade)"
        actor: "ChoirDirector | system"
        preconditions: ["treasury_balance_cents >= cancellation fee (ERR_INSUFFICIENT_TREASURY)"]
        side_effects: ["cancellation_fee_cents = round_half_up(0.20 * quoted_fee_cents) debited from treasury"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /v1/guest-contracts/{id}/cancel or system (concert cascade)"
        actor: "ChoirDirector | system"
        preconditions: ["treasury_balance_cents >= cancellation fee (ERR_INSUFFICIENT_TREASURY)"]
        side_effects: ["cancellation fee debited from treasury"]

  - entity: TourTrip
    field: status
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "POST /v1/tours/{id}/transition (action=OPEN_REGISTRATION)"
        actor: President
        preconditions: ["departure_at > clock now (ERR_TOUR_IN_PAST)", "seat_count >= min_seats >= 1 (ERR_INVALID_REQUEST)"]
        side_effects: ["provisional_share_cents computed"]
      - from: REGISTRATION_OPEN
        to: ROSTER_LOCKED
        trigger: "POST /v1/tours/{id}/transition (action=LOCK_ROSTER)"
        actor: President
        preconditions: ["confirmed_count >= min_seats (ERR_BELOW_MIN_SEATS)"]
        side_effects:
          - "final_share_cents = round_half_up(transport_lodging_cost_cents / confirmed_count)"
          - "Each CONFIRMED registration: share_charge_cents = final_share_cents; refund_cents = deposit_paid_cents - final_share_cents; treasury credited refund back to member (treasury debited refund_cents per registration)"
          - "WAITLISTED registrations -> CANCELLED (no charge, no refund)"
      - from: ROSTER_LOCKED
        to: COMPLETED
        trigger: "POST /v1/tours/{id}/transition (action=COMPLETE)"
        actor: President
        preconditions: ["clock now >= return_at (ERR_TOUR_NOT_RETURNED)"]
        side_effects: []
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /v1/tours/{id}/transition (action=CANCEL)"
        actor: President
        preconditions: []
        side_effects: ["Non-terminal registrations -> CANCELLED (no charges posted)"]
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /v1/tours/{id}/transition (action=CANCEL)"
        actor: President
        preconditions: []
        side_effects: ["CONFIRMED registrations -> REFUNDED with refund_cents = deposit_paid_cents (treasury debited); REGISTERED/WAITLISTED -> CANCELLED"]

  - entity: TourRegistration
    field: status
    initial_state: REGISTERED
    terminal_states: [CANCELLED, REFUNDED]
    transitions:
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (seat freed by cancellation, or checkpoint promotion)"
        actor: system
        preconditions: ["Tour REGISTRATION_OPEN and free seat exists"]
        side_effects: ["Selector: oldest WAITLISTED by created_at ASC"]
      - from: REGISTERED
        to: CONFIRMED
        trigger: "POST /v1/tour-registrations/{id}/confirm"
        actor: Treasurer
        preconditions: []
        side_effects: ["deposit_paid_cents = tour.provisional_share_cents; treasury credited; tour.confirmed_count recomputed"]
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /v1/tour-registrations/{id}/cancel"
        actor: "Member (self) | Treasurer"
        preconditions: ["Tour in REGISTRATION_OPEN (ERR_ROSTER_LOCKED)"]
        side_effects: ["Seat freed; waitlist promotion runs"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /v1/tour-registrations/{id}/cancel"
        actor: "Member (self) | Treasurer"
        preconditions: ["Tour in REGISTRATION_OPEN (ERR_ROSTER_LOCKED)", "treasury covers refund (ERR_INSUFFICIENT_TREASURY)"]
        side_effects: ["refund_cents per tour_refund_schedule; treasury debited; seat freed; waitlist promotion runs"]
      - from: CONFIRMED
        to: REFUNDED
        trigger: "system (tour CANCELLED)"
        actor: system
        preconditions: []
        side_effects: ["refund_cents = deposit_paid_cents"]

  - entity: Committee
    field: status
    initial_state: FORMING
    terminal_states: [DISSOLVED]
    transitions:
      - from: FORMING
        to: ACTIVE
        trigger: "POST /v1/committees/{id}/transition (action=ACTIVATE)"
        actor: President
        preconditions: ["chair_member_id references a Member with status ACTIVE (ERR_CHAIR_NOT_ACTIVE)"]
        side_effects: []
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /v1/committees/{id}/transition (action=DISSOLVE)"
        actor: President
        preconditions: []
        side_effects: ["PLEDGED pledges -> CANCELLED (cascade); FULFILLED pledges unaffected"]

  - entity: FundraiserPledge
    field: status
    initial_state: PLEDGED
    terminal_states: [CANCELLED, REFUNDED]
    transitions:
      - from: PLEDGED
        to: FULFILLED
        trigger: "POST /v1/pledges/{id}/fulfill"
        actor: Treasurer
        preconditions: ["Segregation of duties: fulfilled_by_user_id != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["treasury credited amount_cents; committee.raised_cents recomputed; recognition_tier computed"]
      - from: PLEDGED
        to: CANCELLED
        trigger: "POST /v1/pledges/{id}/cancel or system (committee dissolve cascade)"
        actor: "Treasurer | system"
        preconditions: []
        side_effects: []
      - from: FULFILLED
        to: REFUNDED
        trigger: "POST /v1/pledges/{id}/refund"
        actor: Treasurer
        preconditions: ["treasury_balance_cents >= amount_cents (ERR_INSUFFICIENT_TREASURY)"]
        side_effects: ["treasury debited amount_cents; committee.raised_cents recomputed (compensation)"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: season-config-stale-write
    parent_entity: Season
    write_endpoint: "PATCH /v1/seasons/{id}"
    occ_field: "expected_season_version"
    description: |
      Updating season configuration against a Season whose version has advanced
      since the client last observed it is rejected. Another writer may have
      legitimately changed dues policy or checkpointed the season in between;
      the stale writer must re-read before writing.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: season-checkpoint-stale-write
    parent_entity: Season
    write_endpoint: "POST /v1/seasons/{id}/checkpoint"
    occ_field: "expected_season_version"
    description: |
      Running the ops checkpoint against a stale Season version is rejected.
      Each successful checkpoint legitimately advances ops_week_index and the
      season version, so a request carrying an older observed version is
      rejected rather than double-applying epoch side effects.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: guest-contract-counter-stale-write
    parent_entity: GuestContract
    write_endpoint: "POST /v1/guest-contracts/{id}/counter"
    occ_field: "expected_guest_contract_version"
    description: |
      Recording a counter-offer against a GuestContract whose version has
      advanced since the client last observed it is rejected. A counter-offer
      legitimately supersedes the terms of the current offer, so the stale
      writer's terms must not silently overwrite the newer ones.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: audition_composite_score
    trigger: "POST /v1/auditions/{id}/score"
    algorithm: weighted_scoring
    formula: |
      composite_score = 0.40 * tone_score + 0.35 * pitch_score + 0.25 * sight_score
      Rounded to 2 decimal places, round_half_up.
    input_set: "The three scores just submitted (integers 0-10)"
    constants: { TONE_W: 0.40, PITCH_W: 0.35, SIGHT_W: 0.25, ACCEPT_THRESHOLD: 7.0 }
    precision: "2 decimal places, round_half_up"

  - name: attendance_rate
    trigger: "attendance recording, excuse, rehearsal cancel, checkpoint"
    algorithm: weighted_scoring
    formula: |
      Counted rehearsals = Rehearsals of the member's season with status COMPLETED
      and scheduled_at >= member.enrolled_at (CANCELLED excluded).
      If counted set is empty: attendance_rate = 1.0.
      P = count of records PRESENT, L = LATE, X = ABSENT_EXCUSED, U = ABSENT_UNEXCUSED
      attendance_rate = (P + 0.5 * L + 0.75 * X + 0 * U) / N
      where N = number of counted rehearsals in which the member has a record.
      Rehearsals where the member has no record count as ABSENT_UNEXCUSED.
      (Equivalently N = counted rehearsals; unrecorded rehearsals contribute 0.)
      Rounded to 4 decimal places, round_half_up.
    input_set: "COMPLETED rehearsals on/after member.enrolled_at; the member's AttendanceRecords"
    constants: { LATE_W: 0.5, EXCUSED_W: 0.75, UNEXCUSED_W: 0.0 }
    precision: "4 decimal places, round_half_up"

  - name: performance_eligibility
    trigger: "member status change, attendance_rate change, dues_balance_cents change, checkpoint"
    algorithm: threshold
    formula: |
      performance_eligible = (status == ACTIVE)
        AND (attendance_rate >= season.attendance_threshold)
        AND (dues_balance_cents == 0)
      Boundary: rate exactly equal to threshold IS eligible (>=).
    input_set: "The member row and its season config"
    constants: {}
    precision: "boolean"

  - name: dues_invoice_amount
    trigger: "invoice issuance (provisional), first payment or scholarship application (final)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL variant (at issuance):
        if issued_at <= season.early_bird_cutoff:
          provisional = round_half_up(base_dues_cents * (1 - early_bird_pct))
        else:
          provisional = base_dues_cents
      FINAL variant (revealed at first payment or scholarship application):
        early-bird is earned only if received_at <= season.early_bird_cutoff;
        final = round_half_up(base_dues_cents * (1 - early_bird_pct)) when earned,
        else base_dues_cents.
      The two variants diverge when an invoice issued before the cutoff is paid
      after the cutoff: provisional assumes the discount, final removes it.
    input_set: "season dues config; invoice issued_at; payment received_at"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "At invoice creation; stored on provisional_amount_cents"
        difference: "Discount eligibility keyed on issued_at"
      - name: final
        when: "On first payment or scholarship application; stored on final_amount_cents"
        difference: "Discount eligibility keyed on payment received_at; can exceed provisional"

  - name: late_fee_accrual
    trigger: "checkpoint, when an invoice is or becomes OVERDUE"
    algorithm: threshold
    formula: |
      weeks_overdue = floor((clock_now - season.dues_due_date) / 7 days), floored at 0
      late_fee_cents = min(season.late_fee_cap_cents, weeks_overdue * season.late_fee_weekly_cents)
      Boundary: exactly 7.00 days overdue => 1 week (>= per full week).
    input_set: "OVERDUE invoices of the season"
    constants: {}
    precision: "integer cents"

  - name: payment_waterfall
    trigger: "POST /v1/dues-payments"
    algorithm: waterfall_allocation
    formula: |
      On payment creation, reveal final_amount_cents for any of the member's
      invoices that have not revealed it yet (received_at determines early-bird).
      Open invoices = member's invoices with status in {ISSUED, PARTIAL, OVERDUE},
      ordered by issued_at ASC, tie-break created_at ASC.
      remaining = amount_cents
      for each invoice in order:
        take = min(remaining, invoice.balance_cents)
        allocations.append({invoice_id, amount_cents: take}); remaining -= take
      if remaining > 0: reject entire payment with ERR_OVERPAYMENT (no partial write).
      treasury credited amount_cents on success.
    input_set: "Member's open invoices"
    constants: {}
    precision: "integer cents"

  - name: checkout_fine_accrual
    trigger: "checkpoint, for CHECKED_OUT checkouts past due_date; and on OVERDUE checkpoints"
    algorithm: threshold
    formula: |
      On transition to OVERDUE: fine_cents = OVERDUE_WEEKLY_FINE_CENTS.
      Each subsequent checkpoint while still OVERDUE: fine_cents += OVERDUE_WEEKLY_FINE_CENTS,
      capped at score.replacement_cost_cents.
    input_set: "OVERDUE checkouts of the season"
    constants: { OVERDUE_WEEKLY_FINE_CENTS: 200 }
    precision: "integer cents"

  - name: guest_fee_quote
    trigger: "contract create, offer, counter"
    algorithm: tiered_pricing
    formula: |
      ROUNDING ORDER IS PINNED: round each service line first, then sum.
      line_total(i) = round_half_up(rate_cents(i) * units(i))   # per line, integer cents
      quoted_fee_cents = sum(line_total(i)) + travel_stipend_cents
      (Sum-then-round is a different, non-conforming result.)
    input_set: "service_lines and travel_stipend_cents"
    constants: {}
    precision: "integer cents, round_half_up per line"

  - name: tour_cost_share
    trigger: "tour OPEN_REGISTRATION (provisional), LOCK_ROSTER (final)"
    algorithm: tiered_pricing
    formula: |
      PROVISIONAL: provisional_share_cents = round_half_up(transport_lodging_cost_cents / min_seats)
      FINAL:       final_share_cents       = round_half_up(transport_lodging_cost_cents / confirmed_count)
      Variants diverge whenever confirmed_count != min_seats at lock.
    input_set: "tour cost and seat configuration; confirmed registrations at lock"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "While REGISTRATION_OPEN; deposit amount at confirm"
        difference: "Denominator is min_seats"
      - name: final
        when: "At LOCK_ROSTER; share_charge_cents per registration"
        difference: "Denominator is actual confirmed_count"

  - name: tour_refund_schedule
    trigger: "registration cancel (CONFIRMED), tour cancel"
    algorithm: threshold
    formula: |
      days_before = floor((tour.departure_at - clock_now) / 86400 seconds)
      refund_pct = 1.00 if days_before >= 60
                 = 0.50 if 30 <= days_before < 60
                 = 0.00 if days_before < 30
      refund_cents = round_half_up(deposit_paid_cents * refund_pct)
      Boundary: exactly 60 days => 100%; exactly 30 days => 50%; 29 days => 0%.
    input_set: "The cancelled CONFIRMED registration"
    constants: { FULL_REFUND_DAYS: 60, HALF_REFUND_DAYS: 30 }
    precision: "integer cents, round_half_up"

  - name: treasury_balance
    trigger: "every fiscal event (payment, refund, pledge fulfill/refund, booking confirm/release, contract pay/cancel, tour confirm/refund)"
    algorithm: aggregation
    formula: |
      treasury_balance_cents =
          sum(DuesPayment.amount_cents where status == POSTED)
        - sum(DuesPayment.amount_cents where status == REFUNDED)
        + sum(FundraiserPledge.amount_cents where status == FULFILLED)
        - sum(FundraiserPledge.amount_cents where status == REFUNDED)
        - sum(VenueBooking.deposit_cents where status == CONFIRMED)
        + sum(deposit_cents of bookings that transitioned CONFIRMED -> RELEASED)
        - sum(GuestContract.quoted_fee_cents where status == PAID)
        - sum(GuestContract.cancellation_fee_cents where status == CANCELLED after ACCEPTED)
        + sum(TourRegistration.deposit_paid_cents where status == CONFIRMED)
        - sum(TourRegistration.refund_cents where status in {CANCELLED, REFUNDED})
      Scoped to one season.
    input_set: "All fiscal entities of the season in the listed statuses"
    constants: {}
    precision: "integer cents"

  - name: scholarship_pool_ledger
    trigger: "grant decision, apply, revoke"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity): scholarship_pool_cents ==
        pool_available_cents + pool_reserved_cents + pool_spent_cents
      approve: available -= approved; reserved += approved
      apply:   reserved -= approved; spent += applied; available += (approved - applied)
      revoke:  reserved -= approved; available += approved
    input_set: "Season pool fields and the grant being transitioned"
    constants: {}
    precision: "integer cents"

  - name: section_balance
    trigger: "member enrollment, drop, resign, section reassignment, OPEN->REHEARSING gate"
    algorithm: aggregation
    formula: |
      section.active_count = count(Members with section_id == section.id
        AND status in {ENROLLED, ACTIVE, PROBATION})
      Balance gate for OPEN->REHEARSING: for every section with status OPEN,
      target_min <= active_count <= target_max.
    input_set: "Members of the season in the listed statuses"
    constants: {}
    precision: "integer"

  - name: member_waitlist_promotion
    trigger: "checkpoint"
    algorithm: constraint_propagation
    formula: |
      Candidates: Members status == WAITLISTED.
      Ranking: composite_score of their COMPLETED audition DESC, tie-break audition created_at ASC.
      Assignment: iterate ranked candidates; assign each to the OPEN section with the
      largest (target_max - active_count) gap among sections with a positive gap,
      tie-break section created_at ASC; stop when no positive-gap OPEN section remains.
      Empty candidate set or no gap: no-op (no error).
    input_set: "WAITLISTED members and OPEN sections of the season"
    constants: {}
    precision: "n/a"

  - name: program_duration
    trigger: "piece confirm, void, concert LOCK_PROGRAM"
    algorithm: aggregation
    formula: |
      program_duration_seconds = sum(duration_seconds of CONFIRMED pieces of the concert)
      LOCK_PROGRAM requires program_duration_seconds <= booking_seconds - PROGRAM_BUFFER_SECONDS
      where booking_seconds = booking.end_at - booking.start_at.
    input_set: "CONFIRMED ProgramPieces; the CONFIRMED VenueBooking"
    constants: { PROGRAM_BUFFER_SECONDS: 900 }
    precision: "integer seconds"

  - name: recognition_tier
    trigger: "pledge fulfill"
    algorithm: threshold
    formula: |
      tier = GOLD   if amount_cents >= 50000
           = SILVER if amount_cents >= 10000
           = BRONZE otherwise
      Boundary: exactly 10000 => SILVER; exactly 50000 => GOLD (>=).
    input_set: "The fulfilled pledge"
    constants: { SILVER_MIN_CENTS: 10000, GOLD_MIN_CENTS: 50000 }
    precision: "n/a"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted for this endpoint per endpoint roles list", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Member role may only touch resources whose member_id equals X-User-ID (own record, invoices, payments, registrations, grants, attendance, checkouts)", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "member-scoped endpoints" }
  - { priority: 4, category: existence, check: "Path and body resource ids exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all with ids" }
  - { priority: 5, category: existence, check: "Required fields present, types correct, unknown fields rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all writes" }
  - { priority: 5, category: existence, check: "Enum fields carry a declared member value", error_id: ERR_INVALID_ENUM, http_status: 400, applies_to: "all writes with enums" }
  - { priority: 6, category: state, check: "OCC expected_*_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /v1/seasons/{id}, POST /v1/seasons/{id}/checkpoint, POST /v1/guest-contracts/{id}/counter" }
  - { priority: 7, category: state, check: "Season posture permits the operation (enrollment/audition/dues: OPEN or REHEARSING unless noted; rehearsal/attendance: REHEARSING+; checkout: OPEN+; tours: OPEN+)", error_id: ERR_SEASON_POSTURE, http_status: 409, applies_to: "all season-scoped writes" }
  - { priority: 7, category: state, check: "Season not ARCHIVED for any write", error_id: ERR_SEASON_TERMINAL, http_status: 409, applies_to: "all season-scoped writes" }
  - { priority: 8, category: state, check: "Target resource in a valid from-state for the requested transition/action", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition and action endpoints" }
  - { priority: 8, category: state, check: "Audition must be COMPLETED before decision", error_id: ERR_AUDITION_NOT_SCORED, http_status: 409, applies_to: "POST /v1/auditions/{id}/decision" }
  - { priority: 8, category: state, check: "Tour must be REGISTRATION_OPEN for registration create/cancel", error_id: ERR_TOUR_NOT_OPEN, http_status: 409, applies_to: "POST /v1/tour-registrations (create); ERR_ROSTER_LOCKED for cancel when ROSTER_LOCKED" }
  - { priority: 8, category: state, check: "Tour not ROSTER_LOCKED (or beyond) for registration cancel", error_id: ERR_ROSTER_LOCKED, http_status: 409, applies_to: "POST /v1/tour-registrations/{id}/cancel" }
  - { priority: 8, category: state, check: "Grant must be APPROVED for apply; REQUESTED for decision (checked BEFORE the invoice-state check within this tier)", error_id: ERR_GRANT_NOT_APPROVED, http_status: 409, applies_to: "POST /v1/scholarship-grants/{id}/apply" }
  - { priority: 8, category: state, check: "Invoice must be ISSUED/PARTIAL/OVERDUE with positive balance for scholarship apply", error_id: ERR_INVOICE_NOT_OPEN, http_status: 409, applies_to: "POST /v1/scholarship-grants/{id}/apply" }
  - { priority: 8, category: state, check: "Checkout must be CHECKED_OUT or OVERDUE for return/mark-lost", error_id: ERR_CHECKOUT_NOT_ACTIVE, http_status: 409, applies_to: "return, mark-lost" }
  - { priority: 8, category: state, check: "Booking must be CONFIRMED before LOCK_PROGRAM", error_id: ERR_BOOKING_NOT_CONFIRMED, http_status: 409, applies_to: "POST /v1/concerts/{id}/transition LOCK_PROGRAM" }
  - { priority: 9, category: business_safety, check: "Featured members must be performance_eligible", error_id: ERR_MEMBER_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /v1/program-pieces/{id}/confirm" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: payer != approver (contracts), fulfiller != recorder (pledges)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "pay, fulfill" }
  - { priority: 9, category: business_safety, check: "Audition composite >= 7.0 for ACCEPT or WAITLIST", error_id: ERR_SCORE_BELOW_THRESHOLD, http_status: 409, applies_to: "POST /v1/auditions/{id}/decision" }
  - { priority: 10, category: business_referential, check: "Linked GuestContract must be ACCEPTED/APPROVED/PAID at piece confirm", error_id: ERR_CONTRACT_NOT_ACCEPTED, http_status: 409, applies_to: "POST /v1/program-pieces/{id}/confirm" }
  - { priority: 10, category: business_referential, check: "All linked contracts PAID before MARK_READY", error_id: ERR_CONTRACT_UNPAID, http_status: 409, applies_to: "POST /v1/concerts/{id}/transition MARK_READY" }
  - { priority: 10, category: business_referential, check: "Member dues_balance_cents == 0 and performance_eligible for tour registration", error_id: ERR_DUES_NOT_CURRENT, http_status: 409, applies_to: "POST /v1/tour-registrations" }
  - { priority: 10, category: business_referential, check: "Member has no OVERDUE checkout for new checkout", error_id: ERR_LIBRARY_HOLD, http_status: 409, applies_to: "POST /v1/score-checkouts" }
  - { priority: 10, category: business_referential, check: "Section status OPEN for audition ACCEPT", error_id: ERR_SECTION_CLOSED, http_status: 409, applies_to: "POST /v1/auditions/{id}/decision" }
  - { priority: 10, category: business_referential, check: "Venue ACTIVE for new booking", error_id: ERR_VENUE_ARCHIVED, http_status: 409, applies_to: "POST /v1/venue-bookings" }
  - { priority: 10, category: business_referential, check: "Score ACTIVE for new checkout", error_id: ERR_SCORE_RETIRED, http_status: 409, applies_to: "POST /v1/score-checkouts" }
  - { priority: 10, category: business_referential, check: "Committee ACTIVE for new pledge", error_id: ERR_COMMITTEE_NOT_ACTIVE, http_status: 409, applies_to: "POST /v1/pledges" }
  - { priority: 11, category: business_constraint, check: "Email unique among members of the season", error_id: ERR_DUPLICATE_MEMBERSHIP, http_status: 409, applies_to: "POST /v1/members" }
  - { priority: 11, category: business_constraint, check: "voice_part unique among sections of the season", error_id: ERR_DUPLICATE_SECTION, http_status: 409, applies_to: "POST /v1/sections" }
  - { priority: 11, category: business_constraint, check: "One attendance record per member per rehearsal", error_id: ERR_DUPLICATE_ATTENDANCE, http_status: 409, applies_to: "POST /v1/rehearsals/{id}/attendance" }
  - { priority: 11, category: business_constraint, check: "sequence_no unique per concert among non-VOID pieces", error_id: ERR_PROGRAM_SEQUENCE_CONFLICT, http_status: 409, applies_to: "POST /v1/program-pieces, PATCH /v1/program-pieces/{id}" }
  - { priority: 11, category: business_constraint, check: "Section active_count < target_max for ACCEPT", error_id: ERR_SECTION_FULL, http_status: 409, applies_to: "POST /v1/auditions/{id}/decision" }
  - { priority: 11, category: business_constraint, check: "Buffered audition slots: |start_a - start_b| >= audition_slot_minutes for any two non-cancelled auditions of a season", error_id: ERR_AUDITION_OVERLAP, http_status: 409, applies_to: "POST /v1/auditions" }
  - { priority: 11, category: business_constraint, check: "Half-open venue interval overlap: [start_at, end_at) intersects existing non-terminal booking of same venue", error_id: ERR_VENUE_OVERLAP, http_status: 409, applies_to: "POST /v1/venue-bookings" }
  - { priority: 11, category: business_constraint, check: "Member not already REGISTERED/CONFIRMED/WAITLISTED on this tour", error_id: ERR_ALREADY_REGISTERED, http_status: 409, applies_to: "POST /v1/tour-registrations" }
  - { priority: 11, category: business_constraint, check: "copies_available > 0 for new checkout", error_id: ERR_NO_COPIES_AVAILABLE, http_status: 409, applies_to: "POST /v1/score-checkouts" }
  - { priority: 11, category: business_constraint, check: "concert.expected_attendance <= venue.capacity", error_id: ERR_VENUE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /v1/venue-bookings" }
  - { priority: 11, category: business_constraint, check: "program duration fits booking window minus buffer at LOCK_PROGRAM", error_id: ERR_PROGRAM_TOO_LONG, http_status: 422, applies_to: "POST /v1/concerts/{id}/transition LOCK_PROGRAM" }
  - { priority: 11, category: business_constraint, check: "At least one non-VOID piece and all non-VOID pieces CONFIRMED at LOCK_PROGRAM", error_id: ERR_NO_CONFIRMED_PIECES, http_status: 409, applies_to: "POST /v1/concerts/{id}/transition LOCK_PROGRAM" }
  - { priority: 12, category: business_temporal, check: "booking start_at >= clock now + 72 hours", error_id: ERR_BOOKING_LEAD_TIME, http_status: 409, applies_to: "POST /v1/venue-bookings" }
  - { priority: 12, category: business_temporal, check: "rehearsal.scheduled_at <= clock now for attendance recording", error_id: ERR_REHEARSAL_NOT_HELD, http_status: 409, applies_to: "POST /v1/rehearsals/{id}/attendance" }
  - { priority: 12, category: business_temporal, check: "tour departure_at in the future for OPEN_REGISTRATION", error_id: ERR_TOUR_IN_PAST, http_status: 409, applies_to: "POST /v1/tours/{id}/transition OPEN_REGISTRATION" }
  - { priority: 12, category: business_temporal, check: "clock now >= booking start_at for PERFORM", error_id: ERR_CONCERT_TOO_EARLY, http_status: 409, applies_to: "POST /v1/concerts/{id}/transition PERFORM" }
  - { priority: 12, category: business_temporal, check: "clock now >= return_at for COMPLETE", error_id: ERR_TOUR_NOT_RETURNED, http_status: 409, applies_to: "POST /v1/tours/{id}/transition COMPLETE" }
  - { priority: 13, category: business_fiscal, check: "approved_cents <= season.pool_available_cents", error_id: ERR_SCHOLARSHIP_POOL_EXHAUSTED, http_status: 409, applies_to: "POST /v1/scholarship-grants/{id}/decision" }
  - { priority: 13, category: business_fiscal, check: "explicit amount_cents <= min(approved_cents, invoice.balance_cents)", error_id: ERR_GRANT_EXCEEDS_INVOICE_BALANCE, http_status: 409, applies_to: "POST /v1/scholarship-grants/{id}/apply" }
  - { priority: 13, category: business_fiscal, check: "treasury covers debits (booking deposit, contract pay, cancellation fee, refunds)", error_id: ERR_INSUFFICIENT_TREASURY, http_status: 409, applies_to: "confirm booking, pay contract, cancel contract, refund payment, refund pledge, cancel confirmed registration" }
  - { priority: 13, category: business_fiscal, check: "payment amount_cents <= member total open invoice balance", error_id: ERR_OVERPAYMENT, http_status: 409, applies_to: "POST /v1/dues-payments" }
  - { priority: 13, category: business_fiscal, check: "confirmed_count >= min_seats at roster lock", error_id: ERR_BELOW_MIN_SEATS, http_status: 409, applies_to: "POST /v1/tours/{id}/transition LOCK_ROSTER" }
  - { priority: 13, category: business_fiscal, check: "chair member ACTIVE at committee activation", error_id: ERR_CHAIR_NOT_ACTIVE, http_status: 409, applies_to: "POST /v1/committees/{id}/transition ACTIVATE" }
  - { priority: 13, category: business_fiscal, check: "All concerts terminal before CONCERT_LOCK -> ARCHIVED", error_id: ERR_CONCERTS_OPEN, http_status: 409, applies_to: "POST /v1/seasons/{id}/posture ARCHIVED" }
  - { priority: 13, category: business_fiscal, check: "Balance gate + no pending auditions for OPEN -> REHEARSING", error_id: ERR_SECTION_UNBALANCED, http_status: 409, applies_to: "POST /v1/seasons/{id}/posture REHEARSING" }
  - { priority: 13, category: business_fiscal, check: "No SCHEDULED auditions outstanding for OPEN -> REHEARSING", error_id: ERR_AUDITIONS_PENDING, http_status: 409, applies_to: "POST /v1/seasons/{id}/posture REHEARSING" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [President]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Season ---
  - method: POST
    path: "/v1/seasons"
    description: "Create a season in DRAFT posture"
    roles: [President]
    code: 201
    input: [name, base_dues_cents, early_bird_pct, early_bird_cutoff, dues_due_date, late_fee_weekly_cents, late_fee_cap_cents, scholarship_pool_cents, "audition_slot_minutes?", "attendance_threshold?"]
    output: Season
    side_effects: ["posture=DRAFT, ops_week_index=0, pool_available=scholarship_pool_cents, treasury=0"]

  - method: GET
    path: "/v1/seasons/{id}"
    description: "Get a season"
    roles: [President, Treasurer, ChoirDirector, Librarian, Member]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: GET
    path: "/v1/seasons"
    description: "List seasons (paginated)"
    roles: [President, Treasurer, ChoirDirector, Librarian, Member]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Season[]
    side_effects: []

  - method: PATCH
    path: "/v1/seasons/{id}"
    description: "Update season config (OCC-guarded)"
    roles: [President]
    code: 200
    input: [expected_season_version, "name?", "base_dues_cents?", "early_bird_pct?", "early_bird_cutoff?", "dues_due_date?", "late_fee_weekly_cents?", "late_fee_cap_cents?", "scholarship_pool_cents?", "audition_slot_minutes?", "attendance_threshold?"]
    output: Season
    side_effects: ["increments Season.version by 1"]

  - method: POST
    path: "/v1/seasons/{id}/posture"
    description: "Advance season posture"
    roles: [President]
    code: 200
    input: [posture]
    output: Season
    side_effects: ["Posture transition with gates; increments Season.version by 1"]

  - method: POST
    path: "/v1/seasons/{id}/checkpoint"
    description: "Run ops checkpoint (OCC-guarded): bump ops_week_index; expire auditions; overdue invoices + late fees + suspensions; attendance probation sweep; member & tour waitlist promotion; checkout overdue + fines"
    roles: [President]
    code: 200
    input: [expected_season_version]
    output: Season
    side_effects: ["ops_week_index += 1; all epoch sweeps; increments Season.version by 1"]

