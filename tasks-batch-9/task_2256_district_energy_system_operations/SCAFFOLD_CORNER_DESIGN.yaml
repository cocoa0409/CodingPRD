            - "the ESTIMATED invoice response status is 201"
            - "${est_energy} == 3.000"
            - "Invoice.${est_invoice_id}.billed_demand_kw == 60.00"
            - "${est_lf} == 6.94"
            - "Invoice.${est_invoice_id}.energy_charge == 330.00"
            - "${est_total} == 3000.00 with minimum_bill_applied true"

      - name: optimize_refuses_a_loop_whose_only_asset_is_out_of_service
