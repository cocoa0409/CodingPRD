          - state_machines.ReviewRound.VOTING_OPEN_to_CANCELLED
          - state_machines.ClockExtensionRequest.PENDING_to_CANCELLED
          - state_machines.Vote.CAST_to_RETRACTED
        distinguishing_aspect: |
          Depth-2+ chain from a DIFFERENT trigger (candidate withdraw): case
          DEPT_COMMITTEE -> WITHDRAWN (hop 1) causes the open ReviewRound
          VOTING_OPEN -> CANCELLED (hop 2); the round cancellation causes its
          CAST votes -> RETRACTED with system-stamped retracted_at (hop 3) —
          plus sibling branches from the same hop-1 mutation: the PENDING clock extension -> CANCELLED and the
          candidate -> WITHDRAWN.
