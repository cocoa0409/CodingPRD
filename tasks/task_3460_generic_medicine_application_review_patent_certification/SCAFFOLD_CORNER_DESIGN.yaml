        excluded_because:
          difficulty_instance: patent_expiry_cascade_auto_approves_tentative
          rationale: "The depth-3 clock -> patent -> certification-posture -> application cascade is asserted hop by hop in the named 1.8 instance (and the lapse cascade in deficiency_lapse_cascade_forfeits_exclusivity)."

