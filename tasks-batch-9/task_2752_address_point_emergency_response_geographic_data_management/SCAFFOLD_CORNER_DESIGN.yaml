      - name: road_transition_frozen_by_an_open_discrepancy
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: road_frozen_safety_beats_range_overlap
          rationale: "The §1.8 priority_pair_validation_conflict instance already triggers ERR_ROAD_FROZEN_BY_DISCREPANCY on a validate that simultaneously breaks priority 21, and asserts that priority 10 wins."

      - name: boundary_activation_by_a_suspended_agency
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: boundary_activate_requires_active_agency
          rationale: "The §1.8 cross_entity_state_dependency instance already triggers ERR_AGENCY_NOT_ACTIVE by suspending the owning Agency between propose and activate, and shows the same activate succeeding once the agency is ACTIVE."

      - name: seal_against_an_uncertified_report
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: package_seal_requires_certified_report
          rationale: "The §1.8 cross_entity_state_dependency instance already triggers ERR_QC_REPORT_NOT_CERTIFIED from a GENERATED report and then seals successfully after certification."

  # =========================================================================
  # SECTION: rbac  (guide Table 7 + the peer_roles / segregation-of-duties rows)
  # =========================================================================
  - section: rbac
    instances:
      - name: every_roles_exclusive_operations_are_denied_to_the_other_roles_rejected
        claim_type: exclusive_operations
        grounds:
          - roles.SystemAdmin.exclusive_operations
          - roles.GisAnalyst.exclusive_operations
          - roles.QcCertifier.exclusive_operations
          - roles.ProvisioningOfficer.exclusive_operations
          - roles.PermitCoordinator.exclusive_operations
          - roles.AgencyLiaison.exclusive_operations
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "One sweep across all six roles: each exclusive operation refuses the wrong role with 403 ERR_UNAUTHORIZED, and because priority 2 precedes priorities 3, 4 and 5 the refusal wins even when the path id and the body FK are the all-zero non-existent uuid."
        test_recipe:
          setup:
            - "One jurisdiction LARCO and one ACTIVE agency (Larimer County Sheriff, LAW) so the AgencyLiaison caller has a real identity."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/agencies"
              payload: { name: "Larimer County Sheriff", agency_type: "LAW", jurisdiction_id: "${j_id}" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Weld County", code: "WELDCO", jurisdiction_type: "COUNTY", postal_city: "GREELEY" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e1: $.data.error_id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "JURISDICTION", jurisdiction_id: "${j_id}" }
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { e3: $.data.error_id }
            - call: "POST /gis/qc-defects/00000000-0000-0000-0000-000000000000/waive"
              payload: { waiver_reason: "Not my job" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e4: $.data.error_id }
            - call: "POST /gis/provisioning-packages"
              payload: { channel: "MAPPING", jurisdiction_id: "${j_id}", qc_report_id: "00000000-0000-0000-0000-000000000000" }
              as: QcCertifier
              as_user_id: "qc-1"
              captures: { e5: $.data.error_id }
            - call: "POST /gis/emergency-service-boundaries"
              payload: { agency_id: "${a1_id}", effective_start: "2026-08-01T00:00:00Z" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { e6: $.data.error_id }
            - call: "POST /gis/discrepancy-cases/00000000-0000-0000-0000-000000000000/adopt"
              payload: {}
              as: AgencyLiaison
              as_user_id: "${a1_id}"
              captures: { e7: $.data.error_id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "00000000-0000-0000-0000-000000000000", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "00000000-0000-0000-0000-000000000000" }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { e8: $.data.error_id }
            - call: "POST /gis/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
