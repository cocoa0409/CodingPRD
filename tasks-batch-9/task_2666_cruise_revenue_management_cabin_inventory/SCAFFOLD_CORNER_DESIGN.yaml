              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_gt}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 289995, third_berth_fare_cents: 90000, fourth_berth_fare_cents: 70000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_gt}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { gtv1: $.data.version }
            - call: "POST /promotions"
