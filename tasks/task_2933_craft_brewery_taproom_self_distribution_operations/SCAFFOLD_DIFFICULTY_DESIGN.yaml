# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2933 - Craft Brewery Taproom & Self-Distribution Operations
#
# 9 rule_ids x 2 instances = 18 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.6; every `setup_api_calls` chain starts from an empty DB
# and uses only endpoints declared in §1.5; every numeric assert literal was
# computed by executing the relevant §1.3 formula with Decimal/ROUND_HALF_UP.
#
# Shared constants used by the literals below:
#   OZ_PER_BBL 3968 | OZ_PER_GAL 128 | BBL_PER_UNIT[HALF_BBL_KEG] 0.5
#   FED_TIER1_LIMIT_BBL 60000 / 350c | FED_TIER2 1600c
#   STATE_TAPROOM 1085c | STATE_DISTRIBUTION 870c | small-brewer state credit 0.50 up to 15000 bbl
#   FREIGHT_PER_MILE_CENTS 30 | FREIGHT_PER_BBL_CENTS 1200 | FRANCHISE_FEE_PCT 0.03
#   KEG_SHRINKAGE_TOLERANCE_PCT 0.02 | TANK_CIP_BUFFER_HOURS 12
#   MAX_CONCURRENT_OFFSITE_PERMITS_PER_STATE 2 | logical clock default 2026-08-01T00:00:00Z

scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: taproom_basis_metered_pour_vs_whole_keg_removal_divergence
        grounds:
          - calculations.taproom_taxable_barrels
          - calculations.federal_state_excise_tax
          - entities.ExciseReport.fields.taproom_basis
          - entities.ExciseReport.fields.taproom_bbl
          - entities.KegAsset.fields.tapped_at_utc
          - entities.TaproomPour.fields.volume_oz
        distinguishing_aspect: |
          Entity domain: excise determination on the ExciseReport / TaproomPour side of the house.
          One tapped half-barrel keg and three 16 oz pints inside the same period yield
          taproom_bbl 0.012 under METERED_POUR (48 / 3968) and 0.500 under WHOLE_KEG_REMOVAL
          (the keg's whole size_bbl at tap) - a 0.488 bbl divergence on byte-identical underlying data.
        test_recipe:
          setup:
            - "Brewery singleton exists with notice_status ACTIVE."
            - "Beer 'Ridgeline IPA' created with requires_formula false, so registration_state is FORMULA_EXEMPT and taproom_sellable is true; no COLA is needed for taproom draft."
            - "Batch B-1001 on tank FV-01 conditioned at actual_yield_bbl 16.000."
            - "One COMPLETED TAPROOM HALF_BBL_KEG run of 10 units (bbl_removed 5.000); batch remaining_bbl 11.000, so the batch is still CONDITIONING."
            - "Keg KEG-0001 (0.5 bbl) cleaned, filled from that run (filled_volume_oz 1984.00) and TAPPED at 2026-08-10T12:00:00Z."
            - "Exactly three PINT_16OZ pours recorded against the keg (48 oz total)."
            - "Logical clock advanced to 2026-09-01T00:00:00Z so the August period is closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BreweryAdmin
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${run_id}" }
              as: CellarOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: BreweryAdmin
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: BreweryAdmin
          trigger:
            - call: "POST /excise-reports"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", taproom_basis: "METERED_POUR" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { rep_metered_id: $.data.id }
            - call: "POST /excise-reports"
              payload: { period_start_utc: "2026-08-01T00:00:00Z", period_end_utc: "2026-09-01T00:00:00Z", taproom_basis: "WHOLE_KEG_REMOVAL" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { rep_keg_id: $.data.id }
          assert:
            - "ExciseReport.${rep_metered_id}.taproom_bbl == 0.012"
            - "ExciseReport.${rep_metered_id}.distribution_bbl == 0.000"
            - "ExciseReport.${rep_metered_id}.total_taxable_bbl == 0.012"
            - "ExciseReport.${rep_metered_id}.federal_tax_cents == 4"
            - "ExciseReport.${rep_metered_id}.state_tax_cents == 7"
            - "ExciseReport.${rep_metered_id}.total_tax_due_cents == 11"
            - "ExciseReport.${rep_keg_id}.taproom_bbl == 0.500"
            - "ExciseReport.${rep_keg_id}.distribution_bbl == 0.000"
            - "ExciseReport.${rep_keg_id}.federal_tax_cents == 175"
            - "ExciseReport.${rep_keg_id}.state_tax_cents == 272"
            - "ExciseReport.${rep_keg_id}.total_tax_due_cents == 447"
            - "ExciseReport.${rep_keg_id}.taproom_bbl - ExciseReport.${rep_metered_id}.taproom_bbl == 0.488"
            - "Both reports have state DRAFT and read the same three TaproomPour rows and the same tapped KegAsset."

      - name: packaging_loss_basis_pro_rata_vs_last_run_absorbs_divergence
        grounds:
          - calculations.packaging_loss_allocation
          - entities.Batch.fields.loss_basis
          - entities.Batch.fields.total_loss_bbl
          - entities.PackagingRun.fields.loss_share_bbl
          - state_machines.Batch.CONDITIONING_to_PACKAGED
        distinguishing_aspect: |
          Entity domain: brewhouse loss accounting on the Batch / PackagingRun side, not excise
          determination. Two batches with identical shape (actual_yield_bbl 16.000, three COMPLETED
          runs of 5.000 bbl each, total_loss_bbl 1.000) distribute that loss as
          0.334 / 0.333 / 0.333 under PRO_RATA and 0.000 / 0.000 / 1.000 under LAST_RUN_ABSORBS.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer 'Ridgeline IPA' FORMULA_EXEMPT."
            - "Two tanks FV-01 and FV-02, each 30.00 bbl."
            - "Batch B-PRO on FV-01 with loss_basis PRO_RATA and batch B-LRA on FV-02 with loss_basis LAST_RUN_ABSORBS; both conditioned at actual_yield_bbl 16.000."
            - "Each batch has two COMPLETED HALF_BBL_KEG runs of 10 units (5.000 bbl each) and one PLANNED third run of 10 units, so completing the third leaves remaining_bbl exactly 1.000 and auto-closes the batch."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_a_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-02", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_b_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_a_id}", batch_code: "B-PRO", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_a_id: $.data.id }
            - call: "POST /batches/${batch_a_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_a_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_a_v1: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_a_id}", run_code: "R-PRO-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_a_v1}" }
              as: CellarOperator
              captures: { run_a1_id: $.data.id }
            - call: "POST /packaging-runs/${run_a1_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_a_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_a_v2: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_a_id}", run_code: "R-PRO-2", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_a_v2}" }
              as: CellarOperator
              captures: { run_a2_id: $.data.id }
            - call: "POST /packaging-runs/${run_a2_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_a_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_a_v3: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_a_id}", run_code: "R-PRO-3", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_a_v3}" }
              as: CellarOperator
              captures: { run_a3_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_b_id}", batch_code: "B-LRA", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "LAST_RUN_ABSORBS" }
              as: CellarOperator
              captures: { batch_b_id: $.data.id }
            - call: "POST /batches/${batch_b_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_b_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_b_v1: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_b_id}", run_code: "R-LRA-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_b_v1}" }
              as: CellarOperator
              captures: { run_b1_id: $.data.id }
            - call: "POST /packaging-runs/${run_b1_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_b_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_b_v2: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_b_id}", run_code: "R-LRA-2", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_b_v2}" }
              as: CellarOperator
              captures: { run_b2_id: $.data.id }
            - call: "POST /packaging-runs/${run_b2_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "GET /batches/${batch_b_id}"
              payload: {}
              as: CellarOperator
              captures: { batch_b_v3: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_b_id}", run_code: "R-LRA-3", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_b_v3}" }
              as: CellarOperator
              captures: { run_b3_id: $.data.id }
          trigger:
            - call: "POST /packaging-runs/${run_a3_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /packaging-runs/${run_b3_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
          assert:
            - "Batch.${batch_a_id}.state == PACKAGED"
            - "Batch.${batch_a_id}.packaged_bbl == 15.000"
            - "Batch.${batch_a_id}.remaining_bbl == 1.000"
            - "Batch.${batch_a_id}.total_loss_bbl == 1.000"
            - "PackagingRun.${run_a1_id}.loss_share_bbl == 0.334"
            - "PackagingRun.${run_a2_id}.loss_share_bbl == 0.333"
            - "PackagingRun.${run_a3_id}.loss_share_bbl == 0.333"
            - "Batch.${batch_b_id}.state == PACKAGED"
            - "Batch.${batch_b_id}.total_loss_bbl == 1.000"
            - "PackagingRun.${run_b1_id}.loss_share_bbl == 0.000"
            - "PackagingRun.${run_b2_id}.loss_share_bbl == 0.000"
            - "PackagingRun.${run_b3_id}.loss_share_bbl == 1.000"
            - "Sum of loss_share_bbl over the three PRO_RATA runs == 1.000 (the 0.001 rounding remainder landed on the earliest-created run, not spread)"
            - "Sum of loss_share_bbl over the three LAST_RUN_ABSORBS runs == 1.000"
            - "Tank.${tank_a_id}.status == DIRTY"
            - "Tank.${tank_b_id}.status == DIRTY"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: landed_cost_pinned_evaluation_order_discount_before_franchise_fee
        mode: c
        grounds:
          - calculations.distribution_order_landed_cost
          - entities.DistributionOrder.fields.freight_cents
          - entities.DistributionOrder.fields.franchise_fee_cents
          - entities.DistributionOrder.fields.landed_cost_cents
          - validations.priority_52
        distinguishing_aspect: |
          Mode (c) - order-of-operations sensitivity. The tier is chosen from the ROUNDED
          product_cents, the discount is rounded on its own before subtraction, and the 3%
          franchise fee is taken on the DISCOUNTED subtotal. Levying the fee on the
          un-discounted subtotal (225000 -> 6750) yields landed_cost_cents 228750 instead of the
          correct 228660: a 90-cent fingerprint of the wrong step order.
        test_recipe:
          setup:
            - "Brewery ACTIVE, home state OR."
            - "Beer 'Ridgeline IPA' is FORMULA_EXEMPT and COLA_APPROVED, so distribution_sellable is true."
            - "WA StateLicense of license_type WHOLESALER_ONLY, franchise_state true, annual_barrel_cap 0.00 - the brewery has no self-distribution privilege in WA at all."
            - "An ACTIVE ALL_BRANDS DistributorAppointment on that license, proposed by u_admin_1 and approved by u_compliance_1 (segregation of duties satisfied), so the order's channel is forced to WHOLESALER."
            - "No packaging inventory is needed: landed cost is computed at order creation, before any allocation."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "15.5 GAL", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "WA", license_type: "WHOLESALER_ONLY", annual_barrel_cap: 0.00, franchise_state: true, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z", termination_notice_days: 90 }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id, lic_v: $.data.version }
            - call: "POST /distributor-appointments"
              payload: { state_license_id: "${lic_id}", distributor_name: "Evergreen Beverage Co", expected_state_license_version: "${lic_v}" }
              as: BreweryAdmin
              as_user_id: "u_admin_1"
              captures: { appt_id: $.data.id }
            - call: "POST /distributor-appointments/${appt_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          trigger:
            - call: "POST /distribution-orders"
              payload: { beer_id: "${beer_id}", state_license_id: "${lic_id}", order_code: "SO-3001", bbl_requested: 5.00, ship_to_state_code: "WA", distance_miles: 300, requested_ship_utc: "2026-08-15T15:00:00Z" }
              as: BreweryAdmin
              captures: { order_id: $.data.id }
          assert:
            - "DistributionOrder.${order_id}.channel == WHOLESALER"
            - "DistributionOrder.${order_id}.appointment_id == ${appt_id}"
            - "DistributionOrder.${order_id}.product_cents == 210000"
            - "DistributionOrder.${order_id}.freight_cents == 12000"
            - "DistributionOrder.${order_id}.franchise_fee_cents == 6660"
            - "DistributionOrder.${order_id}.landed_cost_cents == 228660"
            - "DistributionOrder.${order_id}.state == SUBMITTED"
            - "DistributorAppointment.${appt_id}.brand_scope == ALL_BRANDS"
            - "The wrong order (fee on the 225000 un-discounted subtotal) would give franchise_fee_cents 6750 and landed_cost_cents 228750; both must be absent."

      - name: taproom_ounce_aggregation_before_barrel_rounding_cascades_into_tax
        mode: b
        grounds:
          - calculations.taproom_taxable_barrels
          - calculations.federal_state_excise_tax
          - entities.TaproomPour.fields.volume_oz
          - entities.ExciseReport.fields.total_taxable_bbl
        distinguishing_aspect: |
          Mode (b) - nested rounding. Ounces are summed FIRST and the single total is converted to
          barrels once: round(256 / 3968, 3) = 0.065. Rounding each 64 oz growler independently
          (0.016 each) and summing gives 0.064, which then cascades through two more independently
          rounded tax components into federal 22 / state 35 / total 57 instead of 23 / 36 / 59.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT and taproom_sellable."
            - "One COMPLETED TAPROOM HALF_BBL_KEG run; keg KEG-0001 cleaned, filled (1984.00 oz) and TAPPED."
            - "Exactly four GROWLER_64OZ fills (256 oz total), each sanitized at 200 ppm for 90 s, fully labelled, poured by u_taproom_1 and attested by u_taproom_2."
            - "Clock advanced past the period end before the report is drafted."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
