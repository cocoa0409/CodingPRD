# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Automatic Portability & Small-Balance Force-Out — 22 instances over 9 rules.
# All chains start from empty DB; logical clock default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: vested_balance_valuation_basis_divergence
        grounds:
          - calculations.vested_balance_determination
          - calculations.force_out_path_selection
          - entities.Plan.fields.valuation_basis
          - entities.DistributionCase.fields.vested_balance_cents
        distinguishing_aspect: |
          Same case inputs (separation balance 90000, processing balance 120000, vesting 100) produce
          DIFFERENT vested balances and DIFFERENT force-out bands depending on plan.valuation_basis:
          SEPARATION_DATE yields 90000/CASH_OUT while PROCESSING_DATE yields 120000/SAFE_HARBOR_IRA —
          entity domain: DistributionCase valuation (distinct from the IRA fee domain of the sibling instance).
        test_recipe:
          setup:
            - "One ACTIVE recordkeeper; plan P_SEP with valuation_basis=SEPARATION_DATE and plan P_PROC with valuation_basis=PROCESSING_DATE"
            - "Each plan has an OPEN batch with one case: separation_date_balance_cents=90000, processing_date_balance_cents=120000, vesting_percent=100"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan SEP", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}", valuation_basis: "SEPARATION_DATE" }, as: PlanSponsor, captures: { plan_sep: $.data.id } }
            - { call: "POST /plans", payload: { plan_name: "Plan PROC", sponsor_ein: "22-2222222", recordkeeper_id: "${rk_a}", valuation_basis: "PROCESSING_DATE" }, as: PlanSponsor, captures: { plan_proc: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-b", full_name: "Bob B", date_of_birth: "1981-02-02", mailing_address_line1: "2 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_b: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_sep}" }, as: PlanSponsor, captures: { b_sep: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_proc}" }, as: PlanSponsor, captures: { b_proc: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_sep}", plan_id: "${plan_sep}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 90000, processing_date_balance_cents: 120000 }, as: PlanSponsor, captures: { c_sep: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_proc}", plan_id: "${plan_proc}", participant_id: "${p_b}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 90000, processing_date_balance_cents: 120000 }, as: PlanSponsor, captures: { c_proc: $.data.id } }
          trigger:
            - { call: "POST /distribution-batches/${b_sep}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-batches/${b_proc}/lock", payload: {}, as: PlanSponsor }
          assert:
            - "DistributionCase.${c_sep}.quoted_balance_cents == 90000 (provisional quote always uses the separation-date variant)"
            - "DistributionCase.${c_proc}.quoted_balance_cents == 90000"
            - "DistributionCase.${c_sep}.vested_balance_cents == 90000 and force_out_path == CASH_OUT"
            - "DistributionCase.${c_proc}.vested_balance_cents == 120000 and force_out_path == SAFE_HARBOR_IRA"
            - "The variant choice flips the band: identical inputs land on opposite sides of the 100000-cent cash-out threshold"

      - name: ira_fee_day_count_convention_divergence
        grounds:
          - calculations.ira_fee_assessment
          - entities.SafeHarborIRA.fields.fee_day_count_convention
          - entities.IRAFeeAssessment.fields.amount_cents
        distinguishing_aspect: |
          Same accrual period (2026-08-01 -> 2026-09-01) and same 6000-cent annual fee produce DIFFERENT
          assessments under the two day-count variants: ACTUAL_365 counts 31 days -> 510 cents; THIRTY_360
          counts 30 days -> 500 cents. Entity domain: SafeHarborIRA fee ledger (distinct from the
          DistributionCase valuation domain of the sibling instance).
        test_recipe:
          setup:
            - "One ACTIVE recordkeeper, one plan (defaults), one batch with two cases; both participants elect SAFE_HARBOR_IRA within the window"
            - "Batch EXECUTED at the default clock 2026-08-01T00:00:00Z; IRA_A established ACTUAL_365, IRA_B THIRTY_360; both funded 300000 cents; FEE_DISCLOSURE delivered for both cases"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-b", full_name: "Bob B", date_of_birth: "1981-02-02", mailing_address_line1: "2 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_b: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_b}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_b: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /distribution-cases/${c_b}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_b: $.data.id } }
            - { call: "POST /notices/${n_b}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "GET /distribution-cases/${c_b}", payload: {}, as: ProviderOps, captures: { c_b_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_b}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_b_v}" }, as: Participant, as_user_id: "${p_b}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_a}", fee_day_count_convention: "ACTUAL_365" }, as: ProviderOps, captures: { ira_a: $.data.id } }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_b}", fee_day_count_convention: "THIRTY_360" }, as: ProviderOps, captures: { ira_b: $.data.id } }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FEE_DISCLOSURE" }, as: ProviderOps, captures: { nfa: $.data.id } }
            - { call: "POST /notices/${nfa}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /distribution-cases/${c_b}/notices", payload: { notice_type: "FEE_DISCLOSURE" }, as: ProviderOps, captures: { nfb: $.data.id } }
            - { call: "POST /notices/${nfb}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProviderOps }
          trigger:
            - { call: "POST /safe-harbor-iras/${ira_a}/assess-fee", payload: {}, as: ProviderOps, captures: { fee_a: $.data.amount_cents } }
            - { call: "POST /safe-harbor-iras/${ira_b}/assess-fee", payload: {}, as: ProviderOps, captures: { fee_b: $.data.amount_cents } }
          assert:
            - "IRAFeeAssessment.${fee_a} amount: fee_a == 510 (round_half_up(6000 * 31 / 365)); days_in_period == 31"
            - "IRAFeeAssessment.${fee_b} amount: fee_b == 500 (round_half_up(6000 * 30 / 360)); days_in_period == 30"
            - "SafeHarborIRA.${ira_a}.balance_cents == 299490 and total_fees_cents == 510"
            - "SafeHarborIRA.${ira_b}.balance_cents == 299500 and total_fees_cents == 500"

  - rule_id: combinatorial_formula
    instances:
      - name: match_score_weighted_gate_banding
        grounds:
          - calculations.match_score
          - entities.MatchCandidate.fields.match_score
          - state_machines.MatchCandidate.CANDIDATE_to_EXPIRED
        distinguishing_aspect: |
          Mode (a): a 3-input weighted formula (0.55*ssn_exact + 0.30*name_similarity + 0.15*dob_match)
          with non-linear banding and an SSN gate. A 0.652 feed lands CANDIDATE; a subsequent 0.910 feed
          auto-confirms and EXPIRES the sibling candidate on the same IRA.
        test_recipe:
          setup:
            - "IRA ${ira} OPEN, funded 300000, established via elected path at default clock; destination plan P2 at a second ACTIVE recordkeeper RK2 with network_reachable == true"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-B", legal_name: "Recordkeeper B" }, as: ProviderOps, captures: { rk_b: $.data.id } }
            - { call: "POST /recordkeepers/${rk_b}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /plans", payload: { plan_name: "Plan Y", sponsor_ein: "33-3333333", recordkeeper_id: "${rk_b}" }, as: PlanSponsor, captures: { plan_y: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { ira: $.data.id } }
          trigger:
            - { call: "POST /safe-harbor-iras/${ira}/match-searches", payload: { new_plan_id: "${plan_y}", new_recordkeeper_id: "${rk_b}", employment_start_date: "2026-08-10", ssn_exact: true, name_similarity: 0.34, dob_match: false }, as: ProviderOps, captures: { m1: $.data.id, m1_score: $.data.match_score } }
            - { call: "POST /safe-harbor-iras/${ira}/match-searches", payload: { new_plan_id: "${plan_y}", new_recordkeeper_id: "${rk_b}", employment_start_date: "2026-08-12", ssn_exact: true, name_similarity: 0.70, dob_match: true }, as: ProviderOps, captures: { m2: $.data.id, m2_score: $.data.match_score } }
          assert:
            - "MatchCandidate.${m1}.match_score == 0.652 (0.55 + 0.30*0.34 = 0.55+0.102) and match_status == CANDIDATE after creation"
            - "MatchCandidate.${m2}.match_score == 0.910 (0.55 + 0.21 + 0.15) and match_status == CONFIRMED (auto band >= 0.850 with ssn_exact)"
            - "After m2 auto-confirm: MatchCandidate.${m1}.match_status == EXPIRED (sibling expiry)"
            - "SafeHarborIRA.${ira}.ira_status == MATCHED"

      - name: withholding_per_component_rounding_order
        grounds:
          - calculations.net_check_withholding
          - entities.Check.fields.amount_cents
          - entities.Check.fields.fed_withholding_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-component rounding (round fed, round state,
          then subtract) yields net 75006 for gross 100007 at 5% state rate, while the forbidden
          sum-then-round order yields 75005. The scaffold pins the per-component order.
        test_recipe:
          setup:
            - "Plan with state_withholding_rate 0.05; case vested exactly 100007 cents (elected LUMP_SUM_CASH); batch EXECUTED at default clock"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}", state_withholding_rate: 0.05 }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 100007, processing_date_balance_cents: 100007 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "LUMP_SUM_CASH", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
          trigger:
            - { call: "POST /checks", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { chk: $.data.id } }
          assert:
            - "Check.${chk}.gross_amount_cents == 100007"
            - "Check.${chk}.fed_withholding_cents == 20001 (round_half_up(100007 * 0.20) = round_half_up(20001.40))"
            - "Check.${chk}.state_withholding_cents == 5000 (round_half_up(100007 * 0.05) = round_half_up(5000.35))"
            - "Check.${chk}.amount_cents == 75006 (100007 - 20001 - 5000); the sum-then-round order would give 75005 and is forbidden"

      - name: transfer_amount_evaluation_order
        grounds:
          - calculations.transfer_available_amount
          - calculations.ira_fee_assessment
          - entities.Transfer.fields.amount_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by evaluation order — the transferable amount is
          balance minus accrued unbilled fee, where the accrual is computed on the PRE-transfer balance
          snapshot (299490), not on the post-transfer remainder. Snapshot 299490, 15-day ACTUAL_365
          accrual 247 -> amount 299243.
        test_recipe:
          setup:
            - "IRA ${ira} funded 300000 at 2026-08-01T00:00:00Z (elected path), ACTUAL_365; FEE_DISCLOSURE delivered; one fee posted at 2026-09-01 (510 cents); AUTO_PORTABILITY_PRENOTICE delivered 2026-08-01 (deadline 2026-08-31, elapsed); CONFIRMED match to plan Y at RK-B; clock at 2026-09-16T00:00:00Z"
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-B", legal_name: "Recordkeeper B" }, as: ProviderOps, captures: { rk_b: $.data.id } }
            - { call: "POST /recordkeepers/${rk_b}/activate", payload: {}, as: ProviderOps }
            - { call: "POST /plans", payload: { plan_name: "Plan X", sponsor_ein: "11-1111111", recordkeeper_id: "${rk_a}" }, as: PlanSponsor, captures: { plan_x: $.data.id } }
            - { call: "POST /plans", payload: { plan_name: "Plan Y", sponsor_ein: "33-3333333", recordkeeper_id: "${rk_b}" }, as: PlanSponsor, captures: { plan_y: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 300000, processing_date_balance_cents: 300000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "GET /distribution-cases/${c_a}", payload: {}, as: ProviderOps, captures: { c_a_v: $.data.version } }
            - { call: "POST /distribution-cases/${c_a}/elections", payload: { election_type: "SAFE_HARBOR_IRA", expected_case_version: "${c_a_v}" }, as: Participant, as_user_id: "${p_a}" }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /safe-harbor-iras", payload: { distribution_case_id: "${c_a}", fee_day_count_convention: "ACTUAL_365" }, as: ProviderOps, captures: { ira: $.data.id } }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FEE_DISCLOSURE" }, as: ProviderOps, captures: { nf: $.data.id } }
            - { call: "POST /notices/${nf}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "AUTO_PORTABILITY_PRENOTICE" }, as: ProviderOps, captures: { np: $.data.id } }
            - { call: "POST /notices/${np}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProviderOps }
            - { call: "POST /safe-harbor-iras/${ira}/assess-fee", payload: {}, as: ProviderOps }
            - { call: "POST /safe-harbor-iras/${ira}/match-searches", payload: { new_plan_id: "${plan_y}", new_recordkeeper_id: "${rk_b}", employment_start_date: "2026-08-10", ssn_exact: true, name_similarity: 0.90, dob_match: true }, as: ProviderOps, captures: { m1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: ProviderOps }
            - { call: "GET /safe-harbor-iras/${ira}", payload: {}, as: ProviderOps, captures: { ira_v: $.data.version } }
          trigger:
            - { call: "POST /safe-harbor-iras/${ira}/transfers", payload: { expected_ira_version: "${ira_v}" }, as: ProviderOps, captures: { tr: $.data.id } }
          assert:
            - "Transfer.${tr}.amount_cents == 299243 (snapshot 299490 minus accrued unbilled 247 = round_half_up(6000*15/365))"
            - "Transfer.${tr}.accrued_fee_offset_cents == 247"
            - "SafeHarborIRA.${ira}.balance_cents == 247 and in_flight_cents == 299243 and ira_status == TRANSFER_PENDING"
            - "Computing the accrual on the post-transfer remainder instead of the snapshot would produce a different amount and is forbidden"

  - rule_id: non_linear_state_machine
    instances:
      - name: case_renotice_cycle_notified_identified
        grounds:
          - state_machines.DistributionCase.NOTIFIED_to_IDENTIFIED
          - state_machines.DistributionCase.IDENTIFIED_to_NOTIFIED
          - entities.Participant.fields.address_quality
        distinguishing_aspect: |
          Cyclic machine on DistributionCase: NOTIFIED -> IDENTIFIED (returned mail) -> NOTIFIED
          (fresh notice after address repair). The cycle is gated by participant.address_quality
