# =============================================================================
# 1.9 Scaffold Corner Design — breadth walk of references/claim-extraction-guide.md
# against this scaffold's §1.1-§1.7 surface.
#
# Conventions shared by every instance below:
#   * the logical clock is always set explicitly as the first setup call;
#   * ISO week 32 of 2026 is Monday 2026-08-03 .. Sunday 2026-08-09;
#   * "${BOGUS}" is never used - unknown ids are written as the literal
#     00000000-0000-4000-8000-000000000000, which no fixture ever mints;
#   * operator user ids: admin-001 (AgencyAdmin), cm-001 (CaseManager),
#     sch-001 (Scheduler), sup-001/sup-002/sup-003 (ClinicalSupervisor);
#     a PayerReviewer always sends the payer's own id as X-User-ID.
# Instances already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# excluded_because stub naming that §1.8 instance and no test_recipe.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: payer_creation_echoes_every_declared_field
        claim_type: Creation
        grounds:
          - entities.Payer
          - endpoints[POST /pdn/payers]
          - response_envelope.success
        distinguishing_aspect: >-
          A POST /pdn/payers carrying every declared input returns 201 and every field comes back with
          the submitted value, wrapped in the declared success envelope with response_type object.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84, evv_required: true, billing_edit_ruleset: "STRICT_15MIN", appeal_window_days: 45, reduction_notice_days: 20 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
          assert:
            - "HTTP 201 and the body has meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Payer.${payer_id}.name == \"Sunrise MCO\", plan_type == \"MEDICAID_MCO\", weekly_hour_cap == 84"
            - "Payer.${payer_id}.evv_required == true, billing_edit_ruleset == \"STRICT_15MIN\""
            - "Payer.${payer_id}.appeal_window_days == 45 and reduction_notice_days == 20"
            - "Payer.${payer_id}.version == 1"

      - name: omitted_optional_inputs_fall_back_to_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Payer.evv_required
          - entities.Payer.billing_edit_ruleset
          - entities.Nurse.max_weekly_hours
          - entities.Patient.requires_vent
          - entities.Case.concurrent_nurse_limit
        distinguishing_aspect: >-
          Every optional input is omitted, so the response must carry the scaffold's declared defaults
          (evv_required true, STANDARD_15MIN, appeal 30, notice 10, max_weekly_hours 40, all clinical
          flags false) rather than nulls.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /pdn/payers"
              payload: { name: "Lakeside Waiver", plan_type: "MEDICAID_WAIVER", weekly_hour_cap: 70 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/nurses"
              payload: { full_name: "Ivy Lane", license_type: "LPN", license_number: "LPN-200001", license_expires_on: "2027-06-30" }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { nurse_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Eli Ford", date_of_birth: "2021-02-02", primary_diagnosis: "Spinal muscular atrophy" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
          assert:
            - "Payer.${payer_id}.evv_required == true, billing_edit_ruleset == \"STANDARD_15MIN\", appeal_window_days == 30, reduction_notice_days == 10"
            - "Nurse.${nurse_id}.max_weekly_hours == 40 and status == \"ACTIVE\""
            - "Patient.${patient_id}.requires_trach == false, requires_vent == false, requires_feeding_tube == false, parent_backup_available == false"
            - "Patient.${patient_id}.status == \"ACTIVE\""
            - "Nurse.${nurse_id}.verified_skills == [] (no competency has been validated yet)"

      - name: nurse_get_by_id_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - entities.Nurse
          - endpoints[GET /pdn/nurses/{id}]
        distinguishing_aspect: >-
          The single-resource read returns exactly the persisted nurse, including the computed
          verified_skills list assembled from the VALID competencies, and never a partial projection.
        test_recipe:
          setup:
            - "One nurse with a VALID TRACH competency exists."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Nora Vance", license_type: "RN", license_number: "RN-100001", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { nurse_id: $.data.id }
            - call: "POST /pdn/nurses/${nurse_id}/competencies"
              payload: { skill: "TRACH", validated_on: "2026-06-01", expires_on: "2027-07-01" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
              captures: { competency_id: $.data.id }
          trigger:
            - call: "GET /pdn/nurses/${nurse_id}"
              payload: {}
              as: Scheduler
              as_user_id: "sch-001"
          assert:
            - "HTTP 200 with data.id == ${nurse_id} and full_name == \"Nora Vance\""
            - "license_type == \"RN\", license_number == \"RN-100001\", max_weekly_hours == 48"
            - "verified_skills == [\"TRACH\"] and scheduled_minutes_this_week == 0"
            - "NurseCompetency.${competency_id}.validated_by_user_id == \"sup-001\" and status == \"VALID\""
            - "the response_type is \"object\" and no pagination fields are present"

      - name: nurse_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /pdn/nurses]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: >-
          Three nurses exist; limit 2 returns two rows with total_count 3 and has_more true, offset 2
          returns the last row with has_more false, and a status filter narrows total_count to the
          filtered population rather than the whole table.
        test_recipe:
          setup:
            - "Three nurses exist; the third has been SUSPENDED."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Nora Vance", license_type: "RN", license_number: "RN-100001", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { n1_id: $.data.id }
            - call: "POST /pdn/nurses"
              payload: { full_name: "Dana Ross", license_type: "RN", license_number: "RN-100002", license_expires_on: "2027-06-30", max_weekly_hours: 48 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { n2_id: $.data.id }
            - call: "POST /pdn/nurses"
              payload: { full_name: "Ivy Lane", license_type: "LPN", license_number: "LPN-200001", license_expires_on: "2027-06-30" }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { n3_id: $.data.id }
            - call: "POST /pdn/nurses/${n3_id}/status"
              payload: { status: "SUSPENDED" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /pdn/nurses"
              payload: { limit: 2, offset: 0 }
              as: Scheduler
              as_user_id: "sch-001"
            - call: "GET /pdn/nurses"
              payload: { limit: 2, offset: 2 }
              as: Scheduler
              as_user_id: "sch-001"
            - call: "GET /pdn/nurses"
              payload: { status: "SUSPENDED", limit: 10, offset: 0 }
              as: Scheduler
              as_user_id: "sch-001"
          assert:
            - "first page: HTTP 200, response_type == \"array\", 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "filtered read: 1 row whose id == ${n3_id}, total_count == 1, has_more == false"
            - "the filtered total_count is 1, not 3: the filter is applied before the count"
            - "no row is returned twice across the two pages (${n1_id}, ${n2_id} and ${n3_id} each appear once)"

      - name: patient_get_with_an_unknown_id_returns_patient_not_found
        claim_type: Not Found
        grounds:
          - validations[priority 5 path existence]
          - errors[ERR_PATIENT_NOT_FOUND]
          - endpoints[GET /pdn/patients/{id}]
        distinguishing_aspect: >-
          A well-formed but unknown UUID in the path yields the entity-specific 404 error_id, not a
          generic not-found and not a 500.
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "GET /pdn/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "HTTP 404 with data.error_id == \"ERR_PATIENT_NOT_FOUND\""
            - "response_type == \"error\" and data.message is a non-empty string"
            - "meta.api_request_id is present on the error envelope too"

      - name: plan_of_care_without_the_ordering_physician_npi_is_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority 7 ERR_INVALID_REQUEST]
          - entities.PlanOfCare.ordering_physician_npi
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          ordering_physician_npi has source input and no default, so omitting it is a 400 request-shape
          failure; a 10-digit value is accepted and a 9-digit value is rejected by the same rule.
        test_recipe:
          setup:
            - "One payer and one patient exist."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure", requires_trach: true, requires_vent: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01", ordering_physician_npi: "123456789" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", limit: 10, offset: 0 }
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "the omitted-field call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the 9-digit call also returns HTTP 400 with error_id ERR_INVALID_REQUEST (exactly 10 digits required)"
            - "the list read returns total_count == 0: neither rejected call persisted a plan of care"

      - name: shift_scheduled_minutes_is_derived_from_the_window
        claim_type: Computed Fields
        grounds:
          - entities.Shift.scheduled_minutes
          - entities.Shift.staffing_status
          - entities.Shift.evv_status
          - endpoints[POST /pdn/shifts]
        distinguishing_aspect: >-
          scheduled_minutes has source computed and is not an input: a 2026-08-05 08:00-16:00 window
          yields exactly 480 whatever the client sends, and the two state axes start at OPEN and
          NOT_STARTED with escalation_tier NONE and cancel_reason NONE.
        test_recipe:
          setup:
            - "An ACTIVE case on an ACTIVE 40.00 h/wk authorization exists."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure", requires_trach: true, requires_vent: true, parent_backup_available: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01", ordering_physician_npi: "1234567893" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_id: $.data.id }
            - call: "POST /pdn/plans-of-care/${poc_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_v: $.data.version }
            - call: "POST /pdn/authorizations"
              payload: { plan_of_care_id: "${poc_id}", payer_id: "${payer_id}", approved_hours_per_week: 40, effective_start: "2026-08-03T00:00:00Z", effective_end: "2026-11-01T00:00:00Z", expected_plan_of_care_version: "${poc_v}" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /pdn/authorizations/${auth_id}/activate"
              payload: {}
              as: PayerReviewer
              as_user_id: "${payer_id}"
            - call: "POST /pdn/cases"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", assigned_supervisor_user_id: "sup-001" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id }
            - call: "POST /pdn/cases/${case_id}/activate"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /pdn/shifts"
              payload: { case_id: "${case_id}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T16:00:00Z", required_skills: ["TRACH", "VENT"] }
              as: Scheduler
              as_user_id: "sch-001"
              captures: { shift_id: $.data.id }
          assert:
            - "HTTP 201 with Shift.${shift_id}.scheduled_minutes == 480"
            - "Shift.${shift_id}.staffing_status == \"OPEN\" and evv_status == \"NOT_STARTED\""
            - "Shift.${shift_id}.escalation_tier == \"NONE\", escalated_at is null, cancel_reason == \"NONE\""
            - "Shift.${shift_id}.required_skills == [\"TRACH\", \"VENT\"] and version == 1"
            - "Case.${case_id}.unfilled_shift_count == 1 and fill_rate == 0.0000"

      - name: payer_system_fields_are_server_minted
        claim_type: System Fields
        grounds:
          - entities.Payer
          - endpoints[POST /pdn/payers]
          - endpoints[GET /pdn/payers/{id}]
        distinguishing_aspect: >-
          id, created_at, updated_at and version are server-minted: the id is a bare UUID with no type
          prefix, version starts at 1, and a client-supplied id or version in the body is ignored
          rather than honoured.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-03T00:00:00Z."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
          trigger:
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "GET /pdn/payers/${payer_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "Payer.${payer_id}.id is a bare UUID string with no type prefix such as \"pay_\""
            - "Payer.${payer_id}.version == 1"
            - "created_at and updated_at are ISO 8601 UTC instants with three fractional digits and are equal on a freshly created row"
            - "the GET returns the same id, created_at and version as the POST response"

      - name: illegal_enum_values_and_inverted_windows_are_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority 7 ERR_INVALID_REQUEST]
          - entities.Payer.plan_type
          - entities.Nurse.license_type
          - entities.PlanOfCare.end_date
        distinguishing_aspect: >-
          Enum members outside the declared sets and windows whose end precedes their start are both
          request-shape failures at priority 7, so all three calls come back 400 with
          ERR_INVALID_REQUEST and nothing is persisted.
        test_recipe:
          setup:
            - "One payer and one patient exist for the plan-of-care attempt."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
          trigger:
            - call: "POST /pdn/payers"
              payload: { name: "Medicare Direct", plan_type: "MEDICARE", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/nurses"
              payload: { full_name: "Ada Poole", license_type: "APRN", license_number: "APRN-1", license_expires_on: "2027-06-30" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-11-01", end_date: "2026-08-03", ordering_physician_npi: "1234567893" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /pdn/nurses"
              payload: { limit: 10, offset: 0 }
              as: Scheduler
              as_user_id: "sch-001"
          assert:
            - "the MEDICARE plan_type call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the APRN license_type call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the inverted start_date/end_date call returns HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "the nurse list read returns total_count == 0: the rejected nurse was not persisted"

      - name: supervisory_visit_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.SupervisoryVisit
          - endpoints[POST /pdn/cases/{id}/supervisory-visits]
          - endpoints[GET /pdn/cases/{id}/supervisory-visits]
        distinguishing_aspect: >-
          SupervisoryVisit is the one entity declared common_fields false: the created row carries no
          version field and §1.5 offers no update or delete route for it, so the audit record can only
          be appended to.
        test_recipe:
          setup:
            - "An ACTIVE case on an ACTIVE authorization exists for a vent-dependent patient."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
            - call: "POST /pdn/payers"
              payload: { name: "Sunrise MCO", plan_type: "MEDICAID_MCO", weekly_hour_cap: 84 }
              as: AgencyAdmin
              as_user_id: "admin-001"
              captures: { payer_id: $.data.id }
            - call: "POST /pdn/patients"
              payload: { payer_id: "${payer_id}", full_name: "Mia Reyes", date_of_birth: "2019-04-12", primary_diagnosis: "Chronic respiratory failure", requires_trach: true, requires_vent: true }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { patient_id: $.data.id }
            - call: "POST /pdn/plans-of-care"
              payload: { patient_id: "${patient_id}", requested_hours_per_week: 56, start_date: "2026-08-03", end_date: "2026-11-01", ordering_physician_npi: "1234567893" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_id: $.data.id }
            - call: "POST /pdn/plans-of-care/${poc_id}/submit"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { poc_v: $.data.version }
            - call: "POST /pdn/authorizations"
              payload: { plan_of_care_id: "${poc_id}", payer_id: "${payer_id}", approved_hours_per_week: 40, effective_start: "2026-08-03T00:00:00Z", effective_end: "2026-11-01T00:00:00Z", expected_plan_of_care_version: "${poc_v}" }
              as: PayerReviewer
              as_user_id: "${payer_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /pdn/authorizations/${auth_id}/activate"
              payload: {}
              as: PayerReviewer
              as_user_id: "${payer_id}"
            - call: "POST /pdn/cases"
              payload: { patient_id: "${patient_id}", authorization_id: "${auth_id}", assigned_supervisor_user_id: "sup-001" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_id: $.data.id }
            - call: "POST /pdn/cases/${case_id}/activate"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /pdn/cases/${case_id}/supervisory-visits"
              payload: { visit_at: "2026-08-03T06:00:00Z", outcome: "PASS", notes: "home vent settings verified against the plan of care" }
              as: ClinicalSupervisor
              as_user_id: "sup-001"
              captures: { visit_id: $.data.id }
