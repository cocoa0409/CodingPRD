# =============================================================================
# §1.8 Scaffold Difficulty Design — FRAGMENT C
# Rules covered here: priority_pair_validation_conflict (Rule 5),
#                     resource_temporal_overlap (Rule 8),
#                     compensating_invariant (Rule 9)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: resource_temporal_overlap
    instances:
      - name: resource_temporal_overlap__price_rule_half_open_abut_legal_then_one_second_collision
        grounds:
          - validations[priority=34]
          - entities.PriceRule.fields.effective_to
          - entities.PriceRule.fields.effective_from
          - entities.PriceRule.fields.status
          - calculations.price_rule_selector
        distinguishing_aspect: |
          PriceRule occupation on the (facility_id, revenue_code_id) resource uses HALF-OPEN
          [effective_from, effective_to) interval semantics, so a new rule whose effective_from
          exactly equals an existing ACTIVE rule's effective_to is ACCEPTED (201) while a rule
          starting one second earlier is REJECTED with ERR_PRICE_RULE_OVERLAP — the opposite
          adjacency verdict from the PayerContract closed-interval rule at priority 35.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z (the fixed startup default, re-set explicitly)."
            - "One OPEN facility with one ACTIVE revenue code 0300 (pricing_class PROCEDURE)."
            - "One ACTIVE PriceRule R1 on scope (facility, revenue code 0300) occupying the half-open interval [2026-09-01T00:00:00Z, 2026-12-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
            - call: "POST /chargemaster/facilities"
              payload: { name: "St Vitus Medical Center", cms_certification_number: "CCN-2193-HALFOPEN", rounding_mode: "NEAREST_DOLLAR", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { rc_lab_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "FLAT_FEE", flat_fee_cents: 50000, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
              captures: { pr1_id: $.data.id }
          trigger:
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "FLAT_FEE", flat_fee_cents: 60000, effective_from: "2026-12-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
              captures: { pr2_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_lab_id}", pricing_method: "FLAT_FEE", flat_fee_cents: 70000, effective_from: "2026-11-30T23:59:59Z", effective_to: "2027-06-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
          assert:
            - "trigger step 1 response.http_status == 201 (abutting boundary effective_from == existing.effective_to is LEGAL under half-open semantics)"
            - "PriceRule.${pr2_id}.effective_from == 2026-12-01T00:00:00Z"
            - "PriceRule.${pr2_id}.effective_to == null"
            - "PriceRule.${pr2_id}.status == ACTIVE"
            - "trigger step 2 response.http_status == 409"
            - "trigger step 2 response.error.error_id == ERR_PRICE_RULE_OVERLAP"
            - "PriceRule.${pr1_id}.status == ACTIVE"
            - "PriceRule.${pr1_id}.effective_to == 2026-12-01T00:00:00Z"
            - "PriceRule.${pr1_id}.superseded_by_rule_id == null"
            - "GET /chargemaster/price-rules?facility_id=${fac_id}&status=ACTIVE returns exactly 2 rows (the rejected third rule was never persisted)"

      - name: resource_temporal_overlap__payer_contract_closed_abut_collides_then_exact_notice_gap_buffer_violation
        grounds:
          - validations[priority=35]
          - validations[priority=36]
          - entities.PayerContract.fields.term_start_date
          - entities.PayerContract.fields.term_end_date
          - entities.PayerContract.fields.renegotiation_notice_days
        distinguishing_aspect: |
          PayerContract occupation on the (facility_id, payer_code, product_line) resource uses
          CLOSED [term_start_date, term_end_date] interval semantics PLUS a notice-buffer margin,
          so term_start_date == prior.term_end_date COLLIDES (ERR_CONTRACT_TERM_OVERLAP, the
          opposite verdict from the half-open PriceRule rule) and a clear gap of exactly
          renegotiation_notice_days = 30 days still fails with ERR_CONTRACT_TERM_BUFFER_VIOLATION
          because the buffer requires a STRICTLY greater gap.
        test_recipe:
          setup:
            - "Logical clock set to 2026-01-15T00:00:00Z so the prior term is still ACTIVE (not auto-EXPIRED by the clock endpoint)."
            - "One OPEN facility."
            - "One ACTIVE PayerContract C1 on scope (facility, BCBS_STATE, COMMERCIAL) with closed term [2026-01-01T00:00:00Z, 2026-06-30T00:00:00Z] and renegotiation_notice_days = 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
            - call: "POST /chargemaster/facilities"
              payload: { name: "St Vitus Medical Center", cms_certification_number: "CCN-2193-CLOSED", rounding_mode: "NEAREST_DOLLAR" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4500, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-06-30T00:00:00Z", trailing_units: 40, renegotiation_notice_days: 30 }
              as: ContractManager
              as_user_id: "contract_mgr_1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4700, term_start_date: "2026-06-30T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", renegotiation_notice_days: 30 }
              as: ContractManager
              as_user_id: "contract_mgr_1"
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4700, term_start_date: "2026-07-30T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", renegotiation_notice_days: 30 }
              as: ContractManager
              as_user_id: "contract_mgr_1"
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4700, term_start_date: "2026-07-31T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", renegotiation_notice_days: 30 }
              as: ContractManager
              as_user_id: "contract_mgr_1"
              captures: { c2_id: $.data.id }
          assert:
            - "trigger step 1 response.http_status == 409"
            - "trigger step 1 response.error.error_id == ERR_CONTRACT_TERM_OVERLAP"
            - "trigger step 2 response.http_status == 409"
            - "trigger step 2 response.error.error_id == ERR_CONTRACT_TERM_BUFFER_VIOLATION"
            - "trigger step 3 response.http_status == 201 (gap of 31 days is STRICTLY greater than renegotiation_notice_days = 30)"
            - "PayerContract.${c2_id}.term_start_date == 2026-07-31T00:00:00Z"
            - "PayerContract.${c2_id}.status == ACTIVE"
            - "PayerContract.${c1_id}.status == ACTIVE"
            - "PayerContract.${c1_id}.term_end_date == 2026-06-30T00:00:00Z"
            - "GET /chargemaster/payer-contracts?facility_id=${fac_id}&payer_code=BCBS_STATE&product_line=COMMERCIAL returns exactly 2 rows"

      - name: resource_temporal_overlap__batch_window_aggregate_capacity_third_cover_on_single_day
        grounds:
          - validations[priority=37]
          - entities.ChargeCaptureBatch.fields.window_start_date
          - entities.ChargeCaptureBatch.fields.window_end_date
          - entities.ChargeCaptureBatch.fields.status
        distinguishing_aspect: |
          ChargeCaptureBatch occupation on the Department resource uses AGGREGATE-CAPACITY interval
          semantics with a per-calendar-day multiplicity limit of 2 rather than pairwise mutual
          exclusion, so a third non-CLOSED batch covering 2026-08-07 is rejected with
          ERR_BATCH_WINDOW_CAPACITY_EXCEEDED while a batch overlapping only a day at multiplicity 1
          (2026-08-08) is accepted — pairwise-overlap arithmetic would have rejected both.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One OPEN facility with one department (capture_hold false) managed by dept_mgr_1."
            - "Two INGESTED ChargeCaptureBatch rows for that department: B1 covering closed [2026-08-03, 2026-08-07] and B2 covering closed [2026-08-05, 2026-08-10]; days 08-05..08-07 therefore sit at multiplicity 2 and 08-08..08-10 at multiplicity 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
            - call: "POST /chargemaster/facilities"
              payload: { name: "St Vitus Medical Center", cms_certification_number: "CCN-2193-CAPACITY", rounding_mode: "NEAREST_DOLLAR" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Cardiac Cath Lab", cost_center_code: "CC-4100", manager_user_id: "dept_mgr_1", allowed_revenue_code_values: [] }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-07T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "dept_mgr_1"
              captures: { b1_id: $.data.id }
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", window_start_date: "2026-08-05T00:00:00Z", window_end_date: "2026-08-10T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "dept_mgr_1"
              captures: { b2_id: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", window_start_date: "2026-08-07T00:00:00Z", window_end_date: "2026-08-08T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "dept_mgr_1"
            - call: "POST /chargemaster/charge-capture-batches"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", window_start_date: "2026-08-08T00:00:00Z", window_end_date: "2026-08-12T00:00:00Z" }
              as: DepartmentManager
              as_user_id: "dept_mgr_1"
              captures: { b4_id: $.data.id }
          assert:
            - "trigger step 1 response.http_status == 409"
            - "trigger step 1 response.error.error_id == ERR_BATCH_WINDOW_CAPACITY_EXCEEDED"
            - "trigger step 2 response.http_status == 201 (2026-08-08 is covered only by B2, so the new batch takes that day to multiplicity 2, which is still within capacity)"
            - "ChargeCaptureBatch.${b4_id}.status == INGESTED"
            - "ChargeCaptureBatch.${b4_id}.window_start_date == 2026-08-08T00:00:00Z"
            - "ChargeCaptureBatch.${b1_id}.status == INGESTED"
            - "ChargeCaptureBatch.${b2_id}.status == INGESTED"
            - "GET /chargemaster/charge-capture-batches?department_id=${dept_id} returns exactly 3 rows"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_pair_validation_conflict__state_facility_frozen_beats_constraint_price_frozen_and_fiscal_no_rule
        grounds:
          - validations[priority=14]
          - validations[priority=50]
          - validations[priority=53]
          - state_machines.TransparencyFile.BUILDING_to_VALIDATED
          - state_machines.TransparencyFile.VALIDATED_to_FAILED
          - state_machines.ChargeItem.PRICED_CURRENT_to_PRICE_FROZEN
          - calculations.transparency_file_build
          - calculations.price_rule_selector
          - concurrency_rules[transparency-build-stale-facility]
        distinguishing_aspect: |
          A single POST /chargemaster/charge-items/{id}/reprice simultaneously violates the
          `state` row at priority 14 (Facility.chargemaster_posture == FROZEN), the
          `business_constraint` row at priority 50 (ChargeItem.price_status == PRICE_FROZEN) and
          the `business_fiscal` row at priority 53 (empty price_rule_selector candidate set), and
          the response MUST carry ERR_FACILITY_FROZEN — the `state` category at priority 14 —
          never ERR_ITEM_PRICE_FROZEN (business_constraint) and never
          ERR_NO_APPLICABLE_PRICE_RULE (business_fiscal).
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT and aggregate_markup_limit_bp 40000, one department, one ACTIVE revenue code 0300."
            - "One ACTIVE PriceRule PR1 on (facility, 0300) over the half-open interval [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)."
            - "One ACTIVE PayerContract over closed [2026-08-01T00:00:00Z, 2027-08-01T00:00:00Z] so transparency_file_build finds payer_column_count == 1."
            - "One ChargeItem repriced to gross_charge_cents 240000 and driven DRAFT -> PENDING_REVIEW -> APPROVED -> ACTIVE."
            - "One TransparencyFile driven BUILDING -> VALIDATED, which freezes the item (price_status PRICE_FROZEN) and forces Facility.chargemaster_posture = FROZEN."
            - "Clock then advanced to 2026-09-15T00:00:00Z, past PR1.effective_to, so the price-rule candidate set is also empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
            - call: "POST /chargemaster/facilities"
              payload: { name: "St Vitus Medical Center", cms_certification_number: "CCN-2193-FROZEN", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 40000 }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory - general", requires_hcpcs: false, allowed_code_types: ["CPT", "HCPCS", "REV_ONLY", "CDM_INTERNAL"], pricing_class: "PROCEDURE", status: "ACTIVE" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { rc_id: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac_id}", name: "Clinical Laboratory", cost_center_code: "CC-0300", manager_user_id: "dept_mgr_1", allowed_revenue_code_values: [] }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { dept_id: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac_id}", revenue_code_id: "${rc_id}", pricing_method: "COST_PLUS_MARKUP", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 10000, market_cap_multiple_bp: 50000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
              captures: { pr1_id: $.data.id }
            - call: "POST /chargemaster/payer-contracts"
              payload: { facility_id: "${fac_id}", payer_code: "BCBS_STATE", product_line: "COMMERCIAL", reimbursement_method: "PERCENT_OF_CHARGE", percent_of_charge_bp: 4500, term_start_date: "2026-08-01T00:00:00Z", term_end_date: "2027-08-01T00:00:00Z", trailing_units: 10, renegotiation_notice_days: 30 }
              as: ContractManager
              as_user_id: "contract_mgr_1"
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac_id}", department_id: "${dept_id}", revenue_code_id: "${rc_id}", cdm_number: "CDM-5001", description: "Comprehensive metabolic panel", code_type: "CDM_INTERNAL", cost_basis_cents: 100000, medicare_rate_cents: 10000, market_p75_cents: 5000000, effective_from: "2026-08-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
              captures: { item_id: $.data.id }
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "SUBMIT_FOR_REVIEW", note: "ready for committee" }
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "APPROVE", note: "priced within limit" }
              as: PricingCommitteeApprover
              as_user_id: "approver_1"
            - call: "POST /chargemaster/charge-items/${item_id}/lifecycle"
              payload: { action: "ACTIVATE", note: "go live" }
              as: PricingCommitteeApprover
              as_user_id: "approver_1"
            - call: "GET /chargemaster/facilities/${fac_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance_1"
              captures: { fac_v: $.data.version }
            - call: "POST /chargemaster/transparency-files"
              payload: { facility_id: "${fac_id}", file_format: "JSON", expected_facility_version: "${fac_v}" }
              as: ComplianceOfficer
              as_user_id: "compliance_1"
              captures: { file_id: $.data.id }
            - call: "POST /chargemaster/transparency-files/${file_id}/lifecycle"
              payload: { action: "VALIDATE" }
              as: ComplianceOfficer
              as_user_id: "compliance_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
          trigger:
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
            - call: "POST /chargemaster/transparency-files/${file_id}/lifecycle"
              payload: { action: "FAIL", note: "withdraw the pending publication" }
              as: ComplianceOfficer
              as_user_id: "compliance_1"
            - call: "POST /chargemaster/charge-items/${item_id}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst_1"
          assert:
            - "trigger step 1 response.http_status == 409"
            - "trigger step 1 response.error.error_id == ERR_FACILITY_FROZEN"
            - "trigger step 1 response.error.error_id != ERR_ITEM_PRICE_FROZEN"
            - "trigger step 1 response.error.error_id != ERR_NO_APPLICABLE_PRICE_RULE"
            - "after trigger step 1: ChargeItem.${item_id}.price_status == PRICE_FROZEN"
            - "after trigger step 1: ChargeItem.${item_id}.gross_charge_cents == 240000"
            - "after trigger step 1: ChargeItem.${item_id}.applied_price_rule_id == ${pr1_id}"
            - "after trigger step 2: TransparencyFile.${file_id}.status == FAILED"
            - "after trigger step 2: ChargeItem.${item_id}.price_status == PRICED_CURRENT (VALIDATED -> FAILED thaws the frozen item, so priority 50 no longer applies)"
            - "after trigger step 2: Facility.${fac_id}.chargemaster_posture == OPEN"
            - "trigger step 3 response.http_status == 422"
            - "trigger step 3 response.error.error_id == ERR_NO_APPLICABLE_PRICE_RULE (proving the priority-53 business_fiscal row was already violated at step 1 and was masked by priority 14)"
            - "after trigger step 3: ChargeItem.${item_id}.gross_charge_cents == 240000"

      - name: priority_pair_validation_conflict__constraint_price_not_current_beats_fiscal_markup_limit_on_item_approve
        grounds:
          - validations[priority=49]
          - validations[priority=54]
          - state_machines.ChargeItem.PENDING_REVIEW_to_APPROVED
          - state_machines.ChargeItem.PRICED_CURRENT_to_PRICE_STALE
          - calculations.markup_compliance_ratio
          - calculations.gross_charge_from_price_rule
        distinguishing_aspect: |
          A single POST /chargemaster/charge-items/{id}/lifecycle action=APPROVE simultaneously
          violates the `business_constraint` row at priority 49 (price_status == PRICE_STALE after
          its PriceRule was superseded) and the `business_fiscal` row at priority 54
          (markup_compliance_ratio yields 24000 bp against Facility.aggregate_markup_limit_bp of
          20000), and the response MUST carry ERR_ITEM_PRICE_NOT_CURRENT — the
          `business_constraint` category — while ERR_AGGREGATE_MARKUP_LIMIT surfaces only after a
          reprice clears priority 49.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z, later advanced to 2026-08-05T00:00:00Z."
            - "Facility with rounding_mode NEAREST_CENT and a deliberately tight aggregate_markup_limit_bp of 20000; one department; one ACTIVE revenue code 0300."
            - "PriceRule PR1 open-ended from 2026-08-01T00:00:00Z with markup tiers 0/32000, 50000/24000, 250000/18000, min_medicare_multiple_bp 10000, market_cap_multiple_bp 50000."
            - "ChargeItem with cost_basis_cents 100000 repriced under PR1 to gross_charge_cents 240000 (tier 50000 -> 24000 bp), so its ratio is 24000 bp > the 20000 bp limit."
            - "PR2 created with supersede_rule_id = PR1, which cascades the item's price_status PRICED_CURRENT -> PRICE_STALE while leaving gross_charge_cents at 240000."
            - "Item then driven DRAFT -> PENDING_REVIEW so APPROVE is a legal §1.2 transition and priority 13 cannot mask the pair."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
            - call: "POST /chargemaster/facilities"
              payload: { name: "St Vitus Medical Center", cms_certification_number: "CCN-2193-MARKUP", rounding_mode: "NEAREST_CENT", aggregate_markup_limit_bp: 20000 }
              as: SystemAdmin
              as_user_id: "sysadmin_1"
              captures: { fac_id: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
