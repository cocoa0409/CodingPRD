      - name: releasing_a_panel_seat_drops_that_faculty_members_scheduled_load_to_zero
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /interview-assignments/{id}/release
          - calculations.interviewer_load_index
          - entities.FacultyMember.scheduled_load
        distinguishing_aspect: >
          The release endpoint's declared side effect is a recomputation, not a subtraction: the LEAD seat
          on a three-hour slot contributes 3.00 * 1.5 == 4.50, and once the assignment is RELEASED it drops
          out of the input set entirely, so the lead's scheduled_load becomes 0.00 while the MEMBER seat on
          the same slot keeps its 3.00 * 1.0 == 3.00 untouched.
        test_recipe:
          setup:
            - "one three-hour slot staffed by a LEAD and a MEMBER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
