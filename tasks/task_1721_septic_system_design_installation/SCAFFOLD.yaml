# =============================================================================
# PRD Benchmark Scaffold — task_1721_septic_system_design_installation
# Septic System Design & Installation Contracting (Expert+ difficulty)
# =============================================================================

scenario: |
  Septic System Design & Installation Contracting (septic installer): site/soil evaluation & percolation testing, system sizing by bedroom count & design submittal, permit approval & inspection hold points, tank/field installation & material verification, final inspection & as-built record, homeowner education & maintenance contract, repair/replacement of failed systems & variance request, seasonal/high-water-table constraints

domain_name: septic-system-contracting
api_prefix: /septic-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - version_pinning_on_approval
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: InstallerCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name of the septic contracting company" }
      - { name: license_number, type: string, source: input, description: "State contractor license number; unique per company" }
      - { name: county_codes, type: array, source: input, description: "List of county codes the company is licensed to operate in" }

  - name: Customer
    parent: InstallerCompany
    common_fields: true
    fields:
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; owning contractor" }
      - { name: full_name, type: string, source: input, description: "Customer (property owner or agent) full legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique within the installer company" }
      - { name: phone, type: string, source: input, description: "Contact phone number" }
      - { name: education_completed_at, type: datetime, source: system, description: "Set when the homeowner education record is delivered; null until then" }

  - name: Site
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer" }
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; denormalized for scoping" }
      - { name: parcel_id, type: string, source: input, description: "County tax parcel identifier; unique within installer company" }
      - { name: address_line, type: string, source: input, description: "Street address of the parcel" }
      - { name: county_code, type: string, source: input, description: "County the parcel sits in; must be in the installer company's county_codes" }
      - { name: current_period_index, type: integer, source: system, default: 0, description: "Per-site deterministic logical clock; advanced only by POST .../clock/advance" }
      - { name: seasonal_freeze_until, type: integer, source: system, default: -1, description: "Period index until which the site is frozen for design/permit work; -1 = no freeze" }
      - { name: status, type: enum, source: system, description: "OPEN | FROZEN | CLOSED" }
      - { name: high_water_table, type: boolean, source: input, description: "True when the parcel has a documented seasonal high water table; forces elevated design constraints" }

  - name: SoilEvaluation
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; evaluated parcel" }
      - { name: evaluator_id, type: string, source: input, description: "FK -> SoilScientist.id; scientist who performed the evaluation" }
      - { name: soil_class, type: enum, source: input, description: "SAND | LOAM | CLAY_LOAM | CLAY — texture class from the pit evaluation" }
      - { name: limiting_layer_inches, type: integer, source: input, description: "Depth in inches to the limiting layer (rock, water table, hardpan); 1..240" }
      - { name: evaluation_date_period, type: integer, source: system, description: "Site period index at which the evaluation was recorded" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> SoilEvaluation.id; set when a later evaluation supersedes this one (self-referential)" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED | VOIDED" }

  - name: PercolationTest
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; tested parcel" }
      - { name: evaluator_id, type: string, source: input, description: "FK -> SoilScientist.id; scientist who ran the perc test" }
      - { name: minutes_per_inch, type: number, source: input, description: "Measured percolation rate in minutes per inch; 0.5..240.0, precision 0.1" }
      - { name: test_pit_count, type: integer, source: input, description: "Number of test pits run; 2..12" }
      - { name: test_date_period, type: integer, source: system, description: "Site period index at which the test was recorded" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> PercolationTest.id; set when a later test supersedes this one (self-referential)" }
      - { name: status, type: enum, source: system, description: "RECORDED | SUPERSEDED | VOIDED" }

  - name: SoilScientist
    parent: InstallerCompany
    common_fields: true
    fields:
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; employing company" }
      - { name: full_name, type: string, source: input, description: "Licensed soil scientist / evaluator name" }
      - { name: license_number, type: string, source: input, description: "State soil scientist license number; unique within company" }

  - name: SystemDesign
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; design target parcel" }
      - { name: designer_id, type: string, source: input, description: "FK -> SystemDesigner.id; authoring designer" }
      - { name: soil_evaluation_id, type: string, source: input, description: "FK -> SoilEvaluation.id; pinned evaluation the sizing derives from" }
      - { name: percolation_test_id, type: string, source: input, description: "FK -> PercolationTest.id; pinned perc test the sizing derives from" }
      - { name: bedroom_count, type: integer, source: input, description: "Design bedroom count; 1..12; drives the daily flow" }
      - { name: system_type, type: enum, source: input, description: "GRAVITY | PRESSURE_DISTRIBUTION | MOUND | AEROBIC — selected by designer within the envelope the site data allows" }
      - { name: design_daily_flow_gpd, type: number, source: computed, description: "Design daily flow in gallons per day; = bedroom_count * GPD_PER_BEDROOM, with HIGH_WATER_SURCHARGE multiplier when site.high_water_table is true" }
      - { name: required_absorption_area_sqft, type: number, source: computed, description: "Absorption area in square feet; derived from design_daily_flow_gpd and the soil application rate" }
      - { name: tank_capacity_gal, type: number, source: computed, description: "Required septic tank working capacity in gallons" }
      - { name: reserve_area_sqft, type: number, source: computed, description: "Mandated reserve (replacement) area in square feet" }
      - { name: provisional_estimate_cents, type: integer, source: system, description: "Replacement cost estimate in cents; recorded on the design when it is first referenced as a RepairCase replacement design; null until then" }
      - { name: design_version, type: integer, source: system, default: 1, description: "Monotonic revision counter; each amendment creates a new SystemDesign row with design_version+1 and supersedes the prior" }
      - { name: supersedes_design_id, type: string, source: system, description: "FK -> SystemDesign.id; the design this revision replaces (self-referential); null on the first design" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | SUPERSEDED | WITHDRAWN" }

  - name: SystemDesigner
    parent: InstallerCompany
    common_fields: true
    fields:
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; employing company" }
      - { name: full_name, type: string, source: input, description: "Licensed designer name" }
      - { name: license_number, type: string, source: input, description: "State designer license number; unique within company" }

  - name: Permit
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; permitted parcel" }
      - { name: design_id, type: string, source: system, description: "FK -> SystemDesign.id; the APPROVED design this permit pins (version-pinning)" }
      - { name: permit_number, type: string, source: system, description: "Authority-issued permit number; unique" }
      - { name: issued_period, type: integer, source: system, description: "Site period index at issuance" }
      - { name: expires_period, type: integer, source: computed, description: "= issued_period + PERMIT_VALIDITY_PERIODS - 1 (inclusive window)" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUSPENDED | EXPIRED | FINALIZED | REVOKED" }

  - name: Installation
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; parcel under construction" }
      - { name: permit_id, type: string, source: input, description: "FK -> Permit.id; authorizing permit (must be ISSUED at start)" }
      - { name: crew_lead, type: string, source: input, description: "Name of the on-site crew lead" }
      - { name: started_period, type: integer, source: system, description: "Site period index when installation started" }
      - { name: completed_period, type: integer, source: system, description: "Site period index when the installation reached COMPLETED; null until then" }
      - { name: final_absorption_area_sqft, type: number, source: system, description: "As-built absorption area; copied from the pinned design at final approval" }
      - { name: status, type: enum, source: system, description: "NOT_STARTED | ROUGH_IN_PROGRESS | TANK_SET | FIELD_INSTALLED | READY_FOR_FINAL | COMPLETED | FAILED_HOLD | ABANDONED" }

  - name: Inspection
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: system, description: "FK -> Installation.id; inspected installation" }
      - { name: hold_point, type: enum, source: input, description: "TANK_SET | FIELD_LAYOUT | FINAL — the hold point this inspection covers" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; inspector of record" }
      - { name: result, type: enum, source: system, description: "PENDING | PASSED | FAILED" }
      - { name: scheduled_period, type: integer, source: input, description: "Site period index the inspection is scheduled for; >= 0" }
      - { name: decided_period, type: integer, source: system, description: "Site period index at which PASSED/FAILED was recorded; null while PENDING" }
      - { name: decision_note, type: string, source: system, description: "Recorded at decision time; required (>= 20 chars) on FAIL" }

  - name: MaterialVerification
    parent: Installation
    common_fields: true
    fields:
      - { name: installation_id, type: string, source: system, description: "FK -> Installation.id; installation receiving material" }
      - { name: material_kind, type: enum, source: input, description: "TANK | PIPE | AGGREGATE | CHAMBER | PUMP — material class delivered" }
      - { name: quantity, type: number, source: input, description: "Delivered quantity in the material's base unit (gallons for TANK, linear feet for PIPE, cubic yards for AGGREGATE, count for CHAMBER/PUMP); > 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Delivered unit cost in cents; >= 0" }
      - { name: verified, type: boolean, source: system, default: false, description: "True once a ProjectManager verifies the delivery against the design bill of materials" }
      - { name: verified_by, type: string, source: system, description: "FK -> ProjectManager.id who verified; null until verified" }
      - { name: verified_period, type: integer, source: system, description: "Site period index at verification; null until verified" }

  - name: VarianceRequest
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; parcel requesting relief" }
      - { name: design_id, type: string, source: input, description: "FK -> SystemDesign.id; the design needing a variance (usually a REJECTED or non-conforming one)" }
      - { name: relief_kind, type: enum, source: input, description: "SETBACK_REDUCTION | AREA_REDUCTION | HIGH_WATER_TABLE | REPAIR_IN_KIND — the regulatory relief sought" }
      - { name: justification, type: string, source: input, description: "Written justification; >= 20 characters" }
      - { name: decided_by, type: string, source: system, description: "FK -> HealthOfficer.id who decided; null while PENDING" }
      - { name: decision_note, type: string, source: system, description: "Decision rationale recorded at APPROVED/DENIED; required (>= 20 chars) on DENIED; null while PENDING" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | WITHDRAWN" }

  - name: MaintenanceContract
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; serviced parcel" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; contract holder (must equal site.customer_id)" }
      - { name: installation_id, type: string, source: input, description: "FK -> Installation.id; the COMPLETED installation under contract" }
      - { name: start_period, type: integer, source: input, description: "Site period index the contract coverage starts (inclusive)" }
      - { name: end_period, type: integer, source: input, description: "Site period index the contract coverage ends (inclusive); must be > start_period" }
      - { name: annual_fee_cents, type: integer, source: input, description: "Annual fee in cents; > 0" }
      - { name: prorated_fee_cents, type: integer, source: computed, description: "Fee charged for the actual coverage window; prorated per the maintenance_proration calculation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED | CANCELLED | EXPIRED" }

  - name: MaintenanceVisit
    parent: MaintenanceContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> MaintenanceContract.id; governing contract" }
      - { name: visit_period, type: integer, source: input, description: "Site period index of the visit; must lie inside the contract coverage window" }
      - { name: findings, type: string, source: input, description: "Technician findings narrative" }
      - { name: alarm_condition, type: boolean, source: input, description: "True when the visit found an alarm/failure condition (triggers repair workflow eligibility)" }
      - { name: technician_name, type: string, source: input, description: "Visiting technician name" }

  - name: RepairCase
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; failed parcel" }
      - { name: failed_installation_id, type: string, source: input, description: "FK -> Installation.id; the COMPLETED installation that failed" }
      - { name: failure_kind, type: enum, source: input, description: "HYDRAULIC_OVERLOAD | STRUCTURAL_COLLAPSE | ROOT_INTRUSION | HIGH_WATER_INTRUSION — failure taxonomy" }
      - { name: diagnosis_note, type: string, source: input, description: "Diagnosis narrative; >= 20 characters" }
      - { name: remedy, type: enum, source: system, description: "UNDECIDED | REPAIR_IN_KIND | REPLACEMENT — repair path; set at triage" }
      - { name: replacement_design_id, type: string, source: system, description: "FK -> SystemDesign.id; the replacement design once triaged to REPLACEMENT; null otherwise" }
      - { name: status, type: enum, source: system, description: "OPEN | TRIAGED | IN_REMEDIATION | RESOLVED | CLOSED" }

  - name: Inspector
    parent: InstallerCompany
    common_fields: true
    fields:
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; company the inspector is attached to (segregated from installers)" }
      - { name: full_name, type: string, source: input, description: "Licensed inspector name" }
      - { name: license_number, type: string, source: input, description: "Inspector license number; unique within company" }

  - name: HealthOfficer
    parent: InstallerCompany
    common_fields: true
    fields:
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; company the officer adjudicates for" }
      - { name: full_name, type: string, source: input, description: "Health authority officer name" }
      - { name: badge_number, type: string, source: input, description: "Authority badge identifier; unique within company" }

  - name: ProjectManager
    parent: InstallerCompany
    common_fields: true
    fields:
      - { name: installer_company_id, type: string, source: system, description: "FK -> InstallerCompany.id; employing company" }
      - { name: full_name, type: string, source: input, description: "Project manager name" }
      - { name: employee_number, type: string, source: input, description: "Internal employee identifier; unique within company" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/freeze"
        actor: ProjectManager
        preconditions:
          - "Site must be OPEN (ERR_INVALID_STATE)"
          - "freeze_until_period must be >= site.current_period_index (ERR_FREEZE_IN_PAST)"
        side_effects:
          - "site.status = FROZEN"
          - "site.seasonal_freeze_until = freeze_until_period"

      - from: FROZEN
        to: OPEN
        trigger: "system (automatic when site.current_period_index advances past site.seasonal_freeze_until via POST .../sites/{sid}/clock/advance)"
        actor: system
        preconditions:
          - "site.current_period_index > site.seasonal_freeze_until"
        side_effects:
          - "site.status = OPEN"
          - "site.seasonal_freeze_until = -1"

      - from: OPEN
        to: CLOSED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/close"
        actor: ProjectManager
        preconditions:
          - "Site must be OPEN (ERR_INVALID_STATE)"
          - "No SystemDesign in DRAFT or SUBMITTED for the site (ERR_OPEN_WORK_REMAINS)"
          - "No Installation in a non-terminal state (NOT_STARTED..READY_FOR_FINAL, FAILED_HOLD) (ERR_OPEN_WORK_REMAINS)"
          - "No RepairCase in OPEN, TRIAGED, or IN_REMEDIATION (ERR_OPEN_WORK_REMAINS)"
        side_effects:
          - "site.status = CLOSED"

  - entity: SoilEvaluation
    initial_state: RECORDED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "system (automatic when POST .../sites/{sid}/soil-evaluations creates a newer evaluation for the same site)"
        actor: system
        preconditions:
          - "A new SoilEvaluation is being recorded for the same site while this one is RECORDED"
        side_effects:
          - "this.status = SUPERSEDED"
          - "this.superseded_by_id = <new evaluation id>"
          - "Every DRAFT SystemDesign pinning this evaluation is auto-transitioned to WITHDRAWN (cascade hop 1); a later submit attempt on any design still pinning this evaluation observes its SUPERSEDED status and is refused (hop 2, surfaces as ERR_STALE_SCIENCE)"

      - from: RECORDED
        to: VOIDED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/soil-evaluations/{eid}/void"
        actor: SoilScientist
        preconditions:
          - "Evaluation must be RECORDED (ERR_INVALID_STATE)"
          - "Acting SoilScientist.id must equal evaluation.evaluator_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No SystemDesign in SUBMITTED or APPROVED state pins this evaluation (ERR_PINNED_BY_LIVE_DESIGN)"
        side_effects:
          - "this.status = VOIDED"

  - entity: PercolationTest
    initial_state: RECORDED
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: RECORDED
        to: SUPERSEDED
        trigger: "system (automatic when POST .../sites/{sid}/percolation-tests creates a newer test for the same site)"
        actor: system
        preconditions:
          - "A new PercolationTest is being recorded for the same site while this one is RECORDED"
        side_effects:
          - "this.status = SUPERSEDED"
          - "this.superseded_by_id = <new test id>"
          - "Every DRAFT SystemDesign pinning this test is auto-transitioned to WITHDRAWN (cascade hop 1); a later submit attempt on any design still pinning this test observes its SUPERSEDED status and is refused (hop 2, surfaces as ERR_STALE_SCIENCE)"

      - from: RECORDED
        to: VOIDED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/percolation-tests/{ptid}/void"
        actor: SoilScientist
        preconditions:
          - "Test must be RECORDED (ERR_INVALID_STATE)"
          - "Acting SoilScientist.id must equal test.evaluator_id (ERR_SEGREGATION_OF_DUTIES)"
          - "No SystemDesign in SUBMITTED or APPROVED state pins this test (ERR_PINNED_BY_LIVE_DESIGN)"
        side_effects:
          - "this.status = VOIDED"

  - entity: SystemDesign
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/designs/{did}/submit"
        actor: SystemDesigner
        preconditions:
          - "Design must be DRAFT (ERR_INVALID_STATE)"
          - "Acting SystemDesigner.id must equal design.designer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Site must be OPEN (ERR_SITE_FROZEN)"
          - "Pinned soil_evaluation.status must be RECORDED (ERR_STALE_SCIENCE)"
          - "Pinned percolation_test.status must be RECORDED (ERR_STALE_SCIENCE)"
          - "site.current_period_index - soil_evaluation.evaluation_date_period <= SCIENCE_MAX_AGE_PERIODS (ERR_SCIENCE_EXPIRED)"
          - "site.current_period_index - percolation_test.test_date_period <= SCIENCE_MAX_AGE_PERIODS (ERR_SCIENCE_EXPIRED)"
        side_effects:
          - "design.status = SUBMITTED"
          - "Derived sizing fields re-derived at submit per §1.3 (variance context may have changed since creation)"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/designs/{did}/decide"
        actor: HealthOfficer
        preconditions:
          - "Design must be SUBMITTED (ERR_INVALID_STATE)"
          - "Payload decision must be APPROVE (ERR_INVALID_DECISION)"
          - "officer_id must reference a HealthOfficer whose license identity differs from the design's designer (ERR_SEGREGATION_OF_DUTIES — a HealthOfficer row whose badge_number equals the authoring designer's license_number is the same person)"
          - "If site.high_water_table is true and design.system_type == GRAVITY, an APPROVED VarianceRequest of relief_kind HIGH_WATER_TABLE must exist for this design (ERR_VARIANCE_REQUIRED)"
        side_effects:
          - "design.status = APPROVED"
          - "If the site already has another APPROVED design, that design is auto-transitioned to SUPERSEDED (approval supersession — hop 1); that SUPERSEDED transition auto-suspends any Permit pinning the older design (hop 2: permit.status = SUSPENDED), and the SUSPENDED permit's Installation, if in a non-terminal state (NOT_STARTED..READY_FOR_FINAL), is forced to FAILED_HOLD (hop 3)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/designs/{did}/decide"
        actor: HealthOfficer
        preconditions:
          - "Design must be SUBMITTED (ERR_INVALID_STATE)"
          - "Payload decision must be REJECT (ERR_INVALID_DECISION)"
          - "decision_note required, >= 20 characters (ERR_INSUFFICIENT_NOTE)"
        side_effects:
          - "design.status = REJECTED"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/designs/{did}/revise"
        actor: SystemDesigner
        preconditions:
          - "Design must be REJECTED (ERR_INVALID_STATE)"
          - "Acting SystemDesigner.id must equal design.designer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "expected_design_version in payload must equal design.version (OCC — ERR_STALE_VERSION)"
        side_effects:
          - "design.status = DRAFT (cycle back for rework)"
          - "design.version incremented by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (automatic on pinned-science supersession) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/designs/{did}/withdraw"
        actor: "system | SystemDesigner"
        preconditions:
          - "Design must be DRAFT (ERR_INVALID_STATE for the manual path)"
          - "Manual path: acting SystemDesigner.id must equal design.designer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "design.status = WITHDRAWN"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when another design for the same site is APPROVED)"
        actor: system
        preconditions:
          - "A different design for the same site transitions SUBMITTED -> APPROVED"
        side_effects:
          - "this.status = SUPERSEDED"
          - "Any Permit pinning this design is auto-transitioned to SUSPENDED (hop 2); that permit's Installation, if in a non-terminal state (NOT_STARTED..READY_FOR_FINAL), is forced to FAILED_HOLD (hop 3)"

  - entity: Permit
    initial_state: ISSUED
    terminal_states: [EXPIRED, FINALIZED, REVOKED]
    transitions:
      - from: ISSUED
        to: SUSPENDED
        trigger: "system (automatic when the pinned design is SUPERSEDED) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/permits/{pid}/suspend"
        actor: "system | HealthOfficer"
        preconditions:
          - "Permit must be ISSUED (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "permit.status = SUSPENDED"
          - "Any Installation authorized by this permit in a non-terminal state (NOT_STARTED..READY_FOR_FINAL) is forced to FAILED_HOLD"

      - from: SUSPENDED
        to: ISSUED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/permits/{pid}/reinstate"
        actor: HealthOfficer
        preconditions:
          - "Permit must be SUSPENDED (ERR_INVALID_STATE)"
          - "The pinned design must currently be APPROVED (ERR_PINNED_BY_LIVE_DESIGN)"
          - "site.current_period_index <= permit.expires_period (ERR_PERMIT_EXPIRED)"
          - "expected_permit_version in payload must equal permit.version (OCC — ERR_STALE_VERSION)"
        side_effects:
          - "permit.status = ISSUED"
          - "permit.version incremented by 1"
          - "Installations previously forced to FAILED_HOLD under this permit are NOT auto-restored; they require the explicit remediate transition"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (automatic when site.current_period_index advances beyond permit.expires_period)"
        actor: system
        preconditions:
          - "site.current_period_index > permit.expires_period"
        side_effects:
          - "permit.status = EXPIRED"
          - "Any Installation authorized by this permit in a non-terminal state is forced to FAILED_HOLD (expiry cascade)"

      - from: ISSUED
        to: FINALIZED
        trigger: "system (automatic when the authorized Installation reaches COMPLETED)"
        actor: system
        preconditions:
          - "Installation.status transitions to COMPLETED"
        side_effects:
          - "permit.status = FINALIZED"

      - from: ISSUED
        to: REVOKED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/permits/{pid}/revoke"
        actor: HealthOfficer
        preconditions:
          - "Permit must be ISSUED or SUSPENDED (ERR_INVALID_STATE)"
          - "revoke_note required, >= 20 characters (ERR_INSUFFICIENT_NOTE)"
        side_effects:
          - "permit.status = REVOKED"
          - "Any Installation authorized by this permit in a non-terminal state is forced to ABANDONED"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/permits/{pid}/revoke"
        actor: HealthOfficer
        preconditions:
          - "Permit must be ISSUED or SUSPENDED (ERR_INVALID_STATE)"
          - "revoke_note required, >= 20 characters (ERR_INSUFFICIENT_NOTE)"
        side_effects:
          - "permit.status = REVOKED"
          - "Any Installation authorized by this permit in a non-terminal state is forced to ABANDONED"

  - entity: Installation
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: NOT_STARTED
        to: ROUGH_IN_PROGRESS
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/advance"
        actor: ProjectManager
        preconditions:
          - "Installation must be NOT_STARTED (ERR_INVALID_STATE)"
          - "permit.status must be ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "site.current_period_index <= permit.expires_period (ERR_PERMIT_EXPIRED)"
          - "Site must be OPEN (ERR_SITE_FROZEN)"
        side_effects:
          - "installation.started_period = site.current_period_index"
          - "installation.status = ROUGH_IN_PROGRESS"

      - from: ROUGH_IN_PROGRESS
        to: TANK_SET
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/advance"
        actor: ProjectManager
        preconditions:
          - "Installation must be ROUGH_IN_PROGRESS (ERR_INVALID_STATE)"
          - "A PASSED Inspection with hold_point TANK_SET exists for this installation (ERR_HOLD_POINT_NOT_PASSED)"
          - "Every MaterialVerification with material_kind TANK for this installation must have verified = true (ERR_MATERIALS_UNVERIFIED)"
        side_effects:
          - "installation.status = TANK_SET"

      - from: TANK_SET
        to: FIELD_INSTALLED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/advance"
        actor: ProjectManager
        preconditions:
          - "Installation must be TANK_SET (ERR_INVALID_STATE)"
          - "A PASSED Inspection with hold_point FIELD_LAYOUT exists for this installation (ERR_HOLD_POINT_NOT_PASSED)"
          - "Every MaterialVerification with material_kind in {PIPE, AGGREGATE, CHAMBER} for this installation must have verified = true (ERR_MATERIALS_UNVERIFIED)"
        side_effects:
          - "installation.status = FIELD_INSTALLED"

      - from: FIELD_INSTALLED
        to: READY_FOR_FINAL
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/advance"
        actor: ProjectManager
        preconditions:
          - "Installation must be FIELD_INSTALLED (ERR_INVALID_STATE)"
          - "If the pinned design's system_type is PRESSURE_DISTRIBUTION or AEROBIC, every MaterialVerification with material_kind PUMP must have verified = true; for GRAVITY or MOUND designs PUMP verifications are not required (ERR_MATERIALS_UNVERIFIED)"
        side_effects:
          - "installation.status = READY_FOR_FINAL"

      - from: READY_FOR_FINAL
        to: COMPLETED
        trigger: "system (automatic when a FINAL Inspection is decided PASSED)"
        actor: system
        preconditions:
          - "A PASSED Inspection with hold_point FINAL exists for this installation"
        side_effects:
          - "installation.status = COMPLETED"
          - "installation.completed_period = site.current_period_index"
          - "installation.final_absorption_area_sqft = pinned design's required_absorption_area_sqft (as-built recorded from the version-pinned design)"
          - "Authorizing permit transitions to FINALIZED (hop 2)"
          - "Homeowner education is armed: customer.education_completed_at remains null until the education record is delivered (hop 3 — gate on POST .../education-records)"

      - from: READY_FOR_FINAL
        to: FAILED_HOLD
        trigger: "system (automatic when a FINAL Inspection is decided FAILED)"
        actor: system
        preconditions:
          - "A FAILED Inspection with hold_point FINAL exists for this installation"
        side_effects:
          - "installation.status = FAILED_HOLD"

      - from: FAILED_HOLD
        to: READY_FOR_FINAL
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/remediate"
        actor: ProjectManager
        preconditions:
          - "Installation must be FAILED_HOLD (ERR_INVALID_STATE)"
          - "permit.status must be ISSUED (ERR_PERMIT_NOT_ISSUED)"
          - "Site must be OPEN (ERR_SITE_FROZEN)"
        side_effects:
          - "installation.status = READY_FOR_FINAL (cycle back to re-inspection)"

      - from: NOT_STARTED
        to: ABANDONED
        trigger: "system (permit revoked) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/abandon"
        actor: "system | ProjectManager"
        preconditions:
          - "Installation must be in a non-terminal state (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "installation.status = ABANDONED"

      - from: ROUGH_IN_PROGRESS
        to: ABANDONED
        trigger: "system (permit revoked) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/abandon"
        actor: "system | ProjectManager"
        preconditions:
          - "Installation must be in a non-terminal state (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "installation.status = ABANDONED"

      - from: TANK_SET
        to: ABANDONED
        trigger: "system (permit revoked) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/abandon"
        actor: "system | ProjectManager"
        preconditions:
          - "Installation must be in a non-terminal state (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "installation.status = ABANDONED"

      - from: FIELD_INSTALLED
        to: ABANDONED
        trigger: "system (permit revoked) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/abandon"
        actor: "system | ProjectManager"
        preconditions:
          - "Installation must be in a non-terminal state (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "installation.status = ABANDONED"

      - from: READY_FOR_FINAL
        to: ABANDONED
        trigger: "system (permit revoked) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/abandon"
        actor: "system | ProjectManager"
        preconditions:
          - "Installation must be in a non-terminal state (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "installation.status = ABANDONED"

      - from: FAILED_HOLD
        to: ABANDONED
        trigger: "system (permit revoked) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/abandon"
        actor: "system | ProjectManager"
        preconditions:
          - "Installation must be in a non-terminal state (ERR_INVALID_STATE for the manual path)"
        side_effects:
          - "installation.status = ABANDONED"

  - entity: Inspection
    initial_state: PENDING
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: PENDING
        to: PASSED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/inspections/{inspid}/decide"
        actor: Inspector
        preconditions:
          - "Inspection must be PENDING (ERR_INVALID_STATE)"
          - "Payload decision must be PASS (ERR_INVALID_DECISION)"
          - "Acting Inspector.id must equal inspection.inspector_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Acting Inspector's full_name must differ from the installation's crew_lead (ERR_SEGREGATION_OF_DUTIES)"
          - "site.current_period_index must be >= inspection.scheduled_period (ERR_INSPECTION_TOO_EARLY)"
          - "For hold_point FINAL with decision PASS: installation.status must be READY_FOR_FINAL (ERR_INSTALLATION_NOT_READY)"
        side_effects:
          - "inspection.result = PASSED; inspection.decided_period = site.current_period_index"
          - "If hold_point == FINAL: installation transitions READY_FOR_FINAL -> COMPLETED (hop 1), which finalizes the authorizing permit (hop 2) and arms homeowner education (hop 3)"

      - from: PENDING
        to: FAILED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/installations/{iid}/inspections/{inspid}/decide"
        actor: Inspector
        preconditions:
          - "Inspection must be PENDING (ERR_INVALID_STATE)"
          - "Payload decision must be FAIL (ERR_INVALID_DECISION)"
          - "decision_note required, >= 20 characters (ERR_INSUFFICIENT_NOTE)"
          - "Acting Inspector.id must equal inspection.inspector_id (ERR_SEGREGATION_OF_DUTIES)"
          - "site.current_period_index must be >= inspection.scheduled_period (ERR_INSPECTION_TOO_EARLY)"
        side_effects:
          - "inspection.result = FAILED; inspection.decided_period = site.current_period_index"
          - "If hold_point == FINAL and installation.status == READY_FOR_FINAL: installation -> FAILED_HOLD"

  - entity: VarianceRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/variance-requests/{vid}/decide"
        actor: HealthOfficer
        preconditions:
          - "VarianceRequest must be PENDING (ERR_INVALID_STATE)"
          - "Payload decision must be APPROVE (ERR_INVALID_DECISION)"
          - "officer_id's badge_number must differ from the referenced design's designer license_number (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "request.status = APPROVED; decided_by = officer_id; decision_note recorded when supplied"

      - from: PENDING
        to: DENIED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/variance-requests/{vid}/decide"
        actor: HealthOfficer
        preconditions:
          - "VarianceRequest must be PENDING (ERR_INVALID_STATE)"
          - "Payload decision must be DENY (ERR_INVALID_DECISION)"
          - "decision_note required, >= 20 characters (ERR_INSUFFICIENT_NOTE)"
        side_effects:
          - "request.status = DENIED; decided_by = officer_id; decision_note recorded"

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/variance-requests/{vid}/withdraw"
        actor: SystemDesigner
        preconditions:
          - "VarianceRequest must be PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "request.status = WITHDRAWN"

  - entity: MaintenanceContract
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: "system (automatic when site.current_period_index advances past contract.end_period)"
        actor: system
        preconditions:
          - "site.current_period_index > contract.end_period"
        side_effects:
          - "contract.status = LAPSED"

      - from: LAPSED
        to: ACTIVE
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/maintenance-contracts/{mcid}/renew"
        actor: ProjectManager
        preconditions:
          - "Contract must be LAPSED (ERR_INVALID_STATE)"
          - "new_end_period in payload must be > contract.end_period (ERR_INVALID_RENEWAL)"
          - "expected_contract_version in payload must equal contract.version (OCC — ERR_STALE_VERSION)"
        side_effects:
          - "contract.end_period = new_end_period"
          - "contract.prorated_fee_cents recomputed per maintenance_proration"
          - "contract.status = ACTIVE; version incremented by 1"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/maintenance-contracts/{mcid}/cancel"
        actor: ProjectManager
        preconditions:
          - "Contract must be ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "contract.status = CANCELLED"
          - "Future MaintenanceVisits (visit_period > site.current_period_index) are deleted; past visits retained"

      - from: LAPSED
        to: EXPIRED
        trigger: "system (automatic when site.current_period_index advances past contract.end_period + LAPSE_GRACE_PERIODS while LAPSED)"
        actor: system
        preconditions:
          - "site.current_period_index > contract.end_period + LAPSE_GRACE_PERIODS"
        side_effects:
          - "contract.status = EXPIRED"

  - entity: RepairCase
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED]
    transitions:
      - from: OPEN
        to: TRIAGED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/repair-cases/{rid}/triage"
        actor: ProjectManager
        preconditions:
          - "RepairCase must be OPEN (ERR_INVALID_STATE)"
          - "Payload remedy must be REPAIR_IN_KIND or REPLACEMENT (ERR_INVALID_DECISION)"
          - "If remedy == REPLACEMENT: replacement_design_id must reference an APPROVED SystemDesign for the same site (ERR_REPLACEMENT_DESIGN_NOT_APPROVED)"
          - "If remedy == REPAIR_IN_KIND and failure_kind == STRUCTURAL_COLLAPSE: an APPROVED VarianceRequest of relief_kind REPAIR_IN_KIND must exist for the site (ERR_VARIANCE_REQUIRED)"
        side_effects:
          - "case.remedy = payload remedy; case.replacement_design_id set when REPLACEMENT"
          - "case.status = TRIAGED"
          - "When REPLACEMENT: the replacement design's provisional_estimate_cents is recorded on the design per repair_replacement_flow (provisional variant)"

      - from: TRIAGED
        to: IN_REMEDIATION
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/repair-cases/{rid}/begin-remediation"
        actor: ProjectManager
        preconditions:
          - "RepairCase must be TRIAGED (ERR_INVALID_STATE)"
          - "If remedy == REPLACEMENT: an Installation must exist whose permit pins case.replacement_design_id (ERR_REMEDIATION_NOT_STARTED)"
          - "Site must be OPEN (ERR_SITE_FROZEN)"
        side_effects:
          - "case.status = IN_REMEDIATION"

      - from: IN_REMEDIATION
        to: RESOLVED
        trigger: "system (automatic when the remediation installation reaches COMPLETED) OR POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/repair-cases/{rid}/resolve for REPAIR_IN_KIND"
        actor: "system | ProjectManager"
        preconditions:
          - "Case must be IN_REMEDIATION (ERR_INVALID_STATE)"
          - "Manual path (REPAIR_IN_KIND only): resolution_note required, >= 20 characters (ERR_INSUFFICIENT_NOTE)"
          - "System path (REPLACEMENT): the installation under the permit pinning case.replacement_design_id must be COMPLETED"
        side_effects:
          - "case.status = RESOLVED"

      - from: OPEN
        to: CLOSED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/repair-cases/{rid}/close"
        actor: ProjectManager
        preconditions:
          - "Case must be OPEN or RESOLVED (ERR_INVALID_STATE)"
        side_effects:
          - "case.status = CLOSED"

      - from: RESOLVED
        to: CLOSED
        trigger: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/repair-cases/{rid}/close"
        actor: ProjectManager
        preconditions:
          - "Case must be OPEN or RESOLVED (ERR_INVALID_STATE)"
        side_effects:
          - "case.status = CLOSED"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: design-revise-stale-version
    parent_entity: SystemDesign
    write_endpoint: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/designs/{did}/revise"
    occ_field: expected_design_version
    description: |
      Revising a REJECTED design whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has already revised the design (which legitimately moved it back to DRAFT
      and bumped the version) and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: permit-reinstate-stale-version
    parent_entity: Permit
    write_endpoint: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/permits/{pid}/reinstate"
    occ_field: expected_permit_version
    description: |
      Reinstating a SUSPENDED permit whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      officer has already reinstated the permit (which legitimately advanced
      the version) and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-renew-stale-version
    parent_entity: MaintenanceContract
    write_endpoint: "POST /septic-ops/installer-companies/{cid}/customers/{cuid}/sites/{sid}/maintenance-contracts/{mcid}/renew"
    occ_field: expected_contract_version
    description: |
      Renewing a LAPSED maintenance contract whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another manager has already renewed the contract (which legitimately
      advanced the version) and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: design_daily_flow_gpd
    trigger: "SystemDesign creation; re-derived at submit time"
    algorithm: tiered_pricing
    formula: |
      base = bedroom_count * GPD_PER_BEDROOM
      if site.high_water_table == true:
          flow = base * HIGH_WATER_SURCHARGE
      else:
          flow = base
      design_daily_flow_gpd = round(flow, 1)   # 1 decimal, round_half_up
      Variant A (book flow): GPD_PER_BEDROOM = 150 (standard codebook value).
      Variant B (reduced flow): when an APPROVED VarianceRequest of relief_kind
      AREA_REDUCTION exists for this design, the absorption-area leg uses
      GPD_PER_BEDROOM_REDUCED = 120 while the tank-sizing leg continues to use
      150. The two variants produce different required_absorption_area_sqft for
      identical bedroom_count and soil — pinned here so both are testable.
    input_set: "The design's bedroom_count, site.high_water_table, and any APPROVED AREA_REDUCTION VarianceRequest pinned to this design"
    constants:
      GPD_PER_BEDROOM: 150
      GPD_PER_BEDROOM_REDUCED: 120
      HIGH_WATER_SURCHARGE: 1.5
    precision: "1 decimal place, round_half_up"
    variants:
      - name: book_flow
        when: "No AREA_REDUCTION variance approved for this design"
        difference: "Absorption area uses GPD_PER_BEDROOM = 150"
      - name: reduced_flow
        when: "An APPROVED VarianceRequest with relief_kind AREA_REDUCTION exists for this design"
        difference: "Absorption-area leg uses GPD_PER_BEDROOM_REDUCED = 120; tank leg still uses 150 — the two legs diverge inside one design"

  - name: required_absorption_area_sqft
    trigger: "SystemDesign creation; re-derived at submit time"
    algorithm: constraint_propagation
    formula: |
      rate = SOIL_APPLICATION_RATE[soil_class]   # gal/day/sqft from pinned evaluation
      area = design_daily_flow_gpd / rate
      if pinned_evaluation.limiting_layer_inches < MIN_LIMITING_LAYER_INCHES:
          area = area * SHALLOW_LAYER_MULTIPLIER
      required_absorption_area_sqft = ceil(area)   # integer sqft, round UP
      # Rounding order is pinned: surcharge first, divide by rate second,
      # shallow-layer multiplier third, then ceil EXACTLY ONCE at the end.
      # Rounding the pre-multiplier quotient first produces a different integer
      # (e.g. flow 225 on LOAM with a shallow layer: single-final-ceil
      #  ceil(281.25 * 1.25) = 352, per-step-ceil  ceil(281.25) * 1.25 -> 353).
    input_set: "design_daily_flow_gpd (per design_daily_flow_gpd rule), pinned soil evaluation's soil_class and limiting_layer_inches"
    constants:
      SOIL_APPLICATION_RATE_SAND: 1.20
      SOIL_APPLICATION_RATE_LOAM: 0.80
      SOIL_APPLICATION_RATE_CLAY_LOAM: 0.50
      SOIL_APPLICATION_RATE_CLAY: 0.30
      MIN_LIMITING_LAYER_INCHES: 24
      SHALLOW_LAYER_MULTIPLIER: 1.25
    precision: "integer sqft, ceil applied exactly once at the end"

  - name: tank_capacity_gal
    trigger: "SystemDesign creation; re-derived at submit time"
    algorithm: threshold
    formula: |
      # Tank capacity ALWAYS uses the book flow variant (150 gpd/bedroom),
      # never the reduced variant — this asymmetry vs the absorption-area leg
      # is deliberate and testable.
      book_flow = bedroom_count * GPD_PER_BEDROOM
      raw = book_flow * TANK_RETENTION_DAYS
      # Step up to the next catalog size (boundary: exact multiples stay).
      tank_capacity_gal = smallest TANK_CATALOG_SIZES entry >= raw
    input_set: "bedroom_count only"
    constants:
      GPD_PER_BEDROOM: 150
      TANK_RETENTION_DAYS: 2.0
      TANK_CATALOG_SIZES: [750, 1000, 1250, 1500, 2000, 2500, 3000, 4000, 5000]
    precision: "integer gallons, catalog step-up (ceil-to-catalog, not arithmetic ceil)"

  - name: reserve_area_sqft
    trigger: "SystemDesign creation; re-derived at submit time"
    algorithm: aggregation
    formula: |
      reserve_area_sqft = round_half_up(required_absorption_area_sqft * RESERVE_FRACTION)
      # Reserve is computed from the FINAL absorption area (post-ceil) so the
      # two fields are consistent; computing from the pre-ceil area is the
      # classic off-by-one trap this rule pins shut.
    input_set: "required_absorption_area_sqft (post-ceil integer)"
    constants:
      RESERVE_FRACTION: 1.0
    precision: "integer sqft, round_half_up"

  - name: permit_expiry_period
    trigger: "Permit issuance"
    algorithm: chronological
    formula: |
      expires_period = issued_period + PERMIT_VALIDITY_PERIODS - 1
      # The window is INCLUSIVE on both ends: a permit issued at period 0 with
      # validity 6 covers periods 0..5. At site period 6 the permit is expired.
      # Off-by-one on the -1 is a pinned boundary.
    input_set: "issued_period (site.current_period_index at issuance)"
    constants:
      PERMIT_VALIDITY_PERIODS: 6
    precision: "integer period index"

  - name: maintenance_proration
    trigger: "MaintenanceContract creation and renewal"
    algorithm: waterfall_allocation
    formula: |
      # Fee for the actual coverage window, prorated by period.
      # Rounding order is pinned: round ONCE at contract level — a single
      # multiplication then one round_half_up — NOT round-per-month-then-sum.
      # The two orders differ on partial-year windows (e.g. annual 100000 over
      # 7 periods: contract-level = 58333; per-month-first = 58331).
      coverage_periods = end_period - start_period + 1   # inclusive window
      prorated_fee_cents = round_half_up(annual_fee_cents * coverage_periods / PERIODS_PER_YEAR)
    input_set: "start_period, end_period, annual_fee_cents"
    constants:
      PERIODS_PER_YEAR: 12
    precision: "integer cents, round_half_up applied once on the contract-level product"

  - name: science_expiry_check
    trigger: "SystemDesign submit"
    algorithm: threshold
    formula: |
      eval_age = site.current_period_index - soil_evaluation.evaluation_date_period
      test_age = site.current_period_index - percolation_test.test_date_period
      stale if eval_age > SCIENCE_MAX_AGE_PERIODS OR test_age > SCIENCE_MAX_AGE_PERIODS
      # Boundary: age EXACTLY equal to SCIENCE_MAX_AGE_PERIODS is still valid
      # (strictly-greater triggers staleness). >= vs > is pinned here.
    input_set: "site.current_period_index, pinned evaluation/test date periods"
    constants:
      SCIENCE_MAX_AGE_PERIODS: 24
    precision: "integer period comparison, strict >"

  - name: material_budget_ceiling
    trigger: "MaterialVerification verify"
    algorithm: aggregation
    formula: |
      ceiling_cents = pinned_design.required_absorption_area_sqft * MATERIAL_BUDGET_PER_SQFT_CENTS
      # Verification is rejected when the running total of VERIFIED material
      # cost for the installation, plus this delivery's quantity*unit_cost_cents,
      # would exceed the ceiling. Boundary: a total EXACTLY equal to the
      # ceiling is accepted (strict > triggers the rejection).
      would_be_total = sum(quantity*unit_cost_cents over verified=true verifications) + this.quantity*this.unit_cost_cents
      reject if would_be_total > ceiling_cents
    input_set: "Installation's MaterialVerifications with verified=true, the candidate verification, the pinned design's required_absorption_area_sqft"
    constants:
      MATERIAL_BUDGET_PER_SQFT_CENTS: 900
    precision: "integer cents"

  - name: repair_replacement_flow
    trigger: "RepairCase triage with remedy REPLACEMENT (provisional); RepairCase resolution (final)"
    algorithm: forward_looking
    formula: |
      # Provisional vs final replacement cost estimate for the repair case.
      # Provisional (recorded on the replacement design at triage):
      #   the replacement design's CURRENT design_daily_flow_gpd at triage time
      #   times REPLACEMENT_COST_PER_GPD_CENTS.
      # Final (at resolution): the same formula evaluated against the design
      #   row pinned at permit issuance — which may be a different design row
      #   when the replacement plan was amended between triage and issuance.
      provisional_estimate_cents = replacement_design_at_triage.design_daily_flow_gpd * REPLACEMENT_COST_PER_GPD_CENTS
      final_estimate_cents       = design_pinned_at_permit_issuance.design_daily_flow_gpd * REPLACEMENT_COST_PER_GPD_CENTS
      # The two variants produce different numbers whenever the replacement
      # plan was amended between triage and permit issuance — a dual-variant
      # pair on the RepairCase/design-estimate domain (distinct from design
      # sizing).
    input_set: "replacement design (provisional: the row referenced at triage; final: the row pinned by the remediating permit)"
    constants:
      REPLACEMENT_COST_PER_GPD_CENTS: 4200
    precision: "integer cents"
    variants:
      - name: provisional_estimate
        when: "At RepairCase triage"
        difference: "Uses the triage-time design row's design_daily_flow_gpd"
      - name: final_estimate
        when: "At RepairCase resolution"
        difference: "Uses the flow of the design row pinned at permit issuance; differs when the replacement plan was amended in between"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role named in X-User-Role must be permitted for this endpoint"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path must exist and belong to its declared parent chain (installer-company -> customer -> site -> child)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Body FK references (evaluator_id, designer_id, soil_evaluation_id, percolation_test_id, permit_id, design_id, installation_id, inspector_id, officer_id, failed_installation_id, replacement_design_id) must exist and belong to the same installer-company/site scope"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "all POST endpoints taking body FKs"

  - priority: 5
    category: state
    check: "Target entity must be in a state that admits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_temporal
    check: "Site must not be FROZEN (seasonal freeze window) for design submit, installation advance, remediate, or begin-remediation"
    error_id: ERR_SITE_FROZEN
    http_status: 409
    applies_to: "POST .../designs/{did}/submit; POST .../installations/{iid}/advance; POST .../installations/{iid}/remediate; POST .../repair-cases/{rid}/begin-remediation"

  - priority: 7
    category: business_temporal
    check: "site.current_period_index must be <= permit.expires_period for installation start and permit reinstate"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 409
    applies_to: "POST .../installations/{iid}/advance (from NOT_STARTED); POST .../permits/{pid}/reinstate"

  - priority: 8
    category: business_safety
    check: "Pinned soil evaluation and percolation test must be RECORDED (not SUPERSEDED/VOIDED) at design submit"
    error_id: ERR_STALE_SCIENCE
    http_status: 409
    applies_to: "POST .../designs/{did}/submit"

  - priority: 9
    category: business_safety
    check: "Science age must be <= SCIENCE_MAX_AGE_PERIODS at design submit (strict > boundary)"
    error_id: ERR_SCIENCE_EXPIRED
    http_status: 409
    applies_to: "POST .../designs/{did}/submit"

  - priority: 10
    category: business_safety
    check: "High-water-table GRAVITY designs require an APPROVED HIGH_WATER_TABLE variance before approval; REPAIR_IN_KIND triage on STRUCTURAL_COLLAPSE requires an APPROVED REPAIR_IN_KIND variance"
    error_id: ERR_VARIANCE_REQUIRED
    http_status: 409
    applies_to: "POST .../designs/{did}/decide (decision=APPROVE); POST .../repair-cases/{rid}/triage"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: the acting licensed professional must be the record owner where ownership is required, and must not be the same person as the designer/crew_lead where independence is required"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST .../soil-evaluations/{eid}/void; POST .../percolation-tests/{ptid}/void; POST .../designs/{did}/submit; POST .../designs/{did}/revise; POST .../designs/{did}/withdraw; POST .../designs/{did}/decide; POST .../inspections/{inspid}/decide; POST .../variance-requests/{vid}/decide"

  - priority: 12
    category: business_constraint
    check: "Hold-point gating: TANK_SET leg requires a PASSED TANK_SET inspection; FIELD_INSTALLED leg requires a PASSED FIELD_LAYOUT inspection"
    error_id: ERR_HOLD_POINT_NOT_PASSED
    http_status: 409
    applies_to: "POST .../installations/{iid}/advance"

  - priority: 13
    category: business_constraint
    check: "All MaterialVerifications in the required material classes for the current leg must be verified before advance (TANK for the TANK_SET leg; PIPE/AGGREGATE/CHAMBER for FIELD_INSTALLED; PUMP for READY_FOR_FINAL when the design is PRESSURE_DISTRIBUTION or AEROBIC)"
    error_id: ERR_MATERIALS_UNVERIFIED
    http_status: 409
    applies_to: "POST .../installations/{iid}/advance"

  - priority: 14
    category: business_constraint
    check: "Permit must be ISSUED for installation start, advance, and remediation"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "POST .../installations/{iid}/advance; POST .../installations/{iid}/remediate"

  - priority: 15
    category: business_constraint
    check: "Replacement remedy requires the referenced replacement design to be APPROVED for the same site"
    error_id: ERR_REPLACEMENT_DESIGN_NOT_APPROVED
    http_status: 409
    applies_to: "POST .../repair-cases/{rid}/triage"

  - priority: 16
    category: business_temporal
    check: "site.current_period_index must be >= inspection.scheduled_period before a decision may be recorded"
    error_id: ERR_INSPECTION_TOO_EARLY
    http_status: 409
    applies_to: "POST .../inspections/{inspid}/decide"

  - priority: 17
    category: business_constraint
    check: "MaintenanceVisit.visit_period must lie inside the contract coverage window [start_period, end_period] inclusive, and the contract must be ACTIVE"
    error_id: ERR_VISIT_OUTSIDE_CONTRACT
    http_status: 409
    applies_to: "POST .../maintenance-contracts/{mcid}/visits"

  - priority: 17.5
    category: business_temporal
    check: "Inspector capacity: no PENDING inspection may exist for the same inspector at the same scheduled_period (aggregate capacity 1 per inspector per period; decided inspections free the slot)"
    error_id: ERR_SCHEDULING_CONFLICT
    http_status: 409
    applies_to: "POST .../installations/{iid}/inspections"

  - priority: 18
    category: business_constraint
    check: "Narrative fields must meet minimum length (20 chars) where required: variance justification, REJECT/DENY/FAIL decision_note, revoke_note, diagnosis_note, resolution_note"
    error_id: ERR_INSUFFICIENT_NOTE
    http_status: 400
    applies_to: "POST .../variance-requests; POST .../designs/{did}/decide; POST .../permits/{pid}/revoke; POST .../variance-requests/{vid}/decide; POST .../inspections/{inspid}/decide; POST .../repair-cases; POST .../repair-cases/{rid}/resolve"

  - priority: 19
    category: business_constraint
    check: "Field ranges and uniqueness: bedroom_count 1..12; limiting_layer_inches 1..240; minutes_per_inch 0.5..240.0; test_pit_count 2..12; quantity > 0; unit_cost_cents >= 0; annual_fee_cents > 0; end_period > start_period; scheduled_period >= 0; parcel_id unique within company; email unique within company; license_number/badge_number/employee_number unique within company per staff table; county_code must be in the installer company's county_codes"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all creation endpoints"

  - priority: 20
    category: business_fiscal
    check: "Cumulative verified material cost for an installation must not exceed the pinned design's material budget ceiling (MATERIAL_BUDGET_PER_SQFT_CENTS * required_absorption_area_sqft); a verification that would cross the ceiling is rejected (strict >; exact equality passes)"
    error_id: ERR_MATERIAL_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST .../installations/{iid}/material-verifications/{mvid}/verify"

  - priority: 21
    category: business_temporal
    check: "freeze_until_period must be >= site.current_period_index when setting a seasonal freeze"
    error_id: ERR_FREEZE_IN_PAST
    http_status: 409
    applies_to: "POST .../sites/{sid}/freeze"

  - priority: 22
    category: business_constraint
    check: "Renewal: new_end_period must be > contract.end_period"
    error_id: ERR_INVALID_RENEWAL
    http_status: 400
    applies_to: "POST .../maintenance-contracts/{mcid}/renew"

  - priority: 23
    category: business_constraint
    check: "Close: site must have no open designs (DRAFT/SUBMITTED), no non-terminal installations, and no open repair cases (OPEN/TRIAGED/IN_REMEDIATION)"
    error_id: ERR_OPEN_WORK_REMAINS
    http_status: 409
    applies_to: "POST .../sites/{sid}/close"

  - priority: 24
    category: state
    check: "Installation must be READY_FOR_FINAL before a FINAL inspection may be decided PASSED"
    error_id: ERR_INSTALLATION_NOT_READY
    http_status: 409
    applies_to: "POST .../inspections/{inspid}/decide"

  - priority: 25
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version on revise / reinstate / renew"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../designs/{did}/revise; POST .../permits/{pid}/reinstate; POST .../maintenance-contracts/{mcid}/renew"

  - priority: 26
    category: business_constraint
    check: "A void of pinned science is refused while a SUBMITTED or APPROVED design pins it; a permit reinstate is refused when the pinned design is no longer APPROVED"
    error_id: ERR_PINNED_BY_LIVE_DESIGN
    http_status: 409
    applies_to: "POST .../soil-evaluations/{eid}/void; POST .../percolation-tests/{ptid}/void; POST .../permits/{pid}/reinstate"

  - priority: 27
    category: business_constraint
    check: "REPLACEMENT remediation requires an existing installation whose permit pins the replacement design"
    error_id: ERR_REMEDIATION_NOT_STARTED
    http_status: 409
    applies_to: "POST .../repair-cases/{rid}/begin-remediation"

  - priority: 28
    category: business_constraint
    check: "decision/remedy payloads must be one of the enumerated values (APPROVE/REJECT, PASS/FAIL, APPROVE/DENY, REPAIR_IN_KIND/REPLACEMENT)"
    error_id: ERR_INVALID_DECISION
    http_status: 400
    applies_to: "POST .../designs/{did}/decide; POST .../inspections/{inspid}/decide; POST .../variance-requests/{vid}/decide; POST .../repair-cases/{rid}/triage"

  - priority: 29
    category: state
    check: "MaintenanceContract creation requires the referenced installation to be COMPLETED; homeowner education delivery requires at least one COMPLETED installation on the referenced site; repair case creation requires the referenced failed installation to be COMPLETED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST .../maintenance-contracts; POST .../education-records; POST .../repair-cases"

