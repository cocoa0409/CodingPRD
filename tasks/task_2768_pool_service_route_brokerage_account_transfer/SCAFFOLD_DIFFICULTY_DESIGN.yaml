          trigger:
            - call: "POST /clawback-settlements/${cs_inv_id}/propose"
              payload: {"adjustment_cents": 16324}
              as: Broker
              as_user_id: "broker-ops-2"
            - call: "POST /clawback-settlements/${cs_inv_id}/settle"
              payload: {"adjustment_cents": 16324}
              as: EscrowAgent
              as_user_id: "escrow-agent-beta"
          assert:
            - "before the settle EscrowAccount.${escrow_id}.holdback_balance_cents == 51000 and the invariant reads 171000 == 50000 + 70000 + 0 + 51000 + 0"
            - "ClawbackSettlement.${cs_inv_id}.adjustment_cents == 16324 (round_half_up(1484 * 11.0) with 1484 = 3000 - the 1516 allowance)"
            - "ClawbackSettlement.${cs_inv_id}.from_holdback_cents == 16324"
            - "ClawbackSettlement.${cs_inv_id}.from_note_principal_cents == 0 and seller_direct_due_cents == 0"
            - "ClawbackSettlement.${cs_inv_id}.holdback_release_to_seller_cents == 34676, and 16324 + 34676 == 51000 exactly"
            - "after the settle ClawbackSettlement.${cs_inv_id}.status == SETTLED and settled_at_utc == 2026-10-01T00:00:00Z"
            - "after the settle EscrowAccount.${escrow_id}.disbursed_to_buyer_cents == 16324"
            - "after the settle EscrowAccount.${escrow_id}.disbursed_to_seller_cents == 104676 (70000 + 34676)"
            - "after the settle EscrowAccount.${escrow_id}.holdback_balance_cents == 0 and undisbursed_balance_cents == 0"
            - "after the settle EscrowAccount.${escrow_id}.status == RELEASED and funded_amount_cents == 171000 - the invariant still totals: 171000 == 50000 + 104676 + 16324 + 0 + 0"
            - "after the settle Deal.${deal_id}.status == GUARANTEE_CLOSED and Deal.${deal_id}.clawback_status == SETTLED"
            - "a second POST /clawback-settlements/${cs_inv_id}/settle returns HTTP 409 with error_id ERR_SETTLEMENT_NOT_PROPOSED, so the holdback cannot be paid out twice"

