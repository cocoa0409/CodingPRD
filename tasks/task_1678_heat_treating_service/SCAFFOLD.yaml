    code: 200
    input: []
    output: LiabilityClaim
    side_effects: ["status ACCEPTED -> PAID", "CustomerAccount.outstanding_liability_exposure_cents -= payout_cents"]

  - method: POST
    path: "/load-batches"
    description: "Create a furnace load batch (BUILDING)"
    roles: [ShopScheduler]
    code: 201
    input: [furnace_id, recipe_id, scheduled_start_at, scheduled_end_at]
    output: LoadBatch
    side_effects: ["status = BUILDING", "recipe APPROVED + furnace class + quench media support validated", "schedule overlap / purge-gap checked against loads in {RELEASED, RUNNING, COMPLETED}"]

  - method: GET
    path: "/load-batches"
