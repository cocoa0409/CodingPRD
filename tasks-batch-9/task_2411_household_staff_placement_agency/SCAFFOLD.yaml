      - "creates the Placement in placement_status PENDING_ACCEPTANCE, billing_status UNBILLED, fee_variant PROVISIONAL, with fee_cents from calculations.placement_fee_computation variant PROVISIONAL and the requisition's fee snapshot copied in"
      - "creates three FeeMilestone rows in sequence_no order via calculations.milestone_billing_schedule"
      - "Candidate.availability_status ON_TRIAL -> OFFER_HELD, or OFFER_HELD -> OFFER_HELD on the supersede path"
      - "RoleRequisition TRIALING -> OFFER_PENDING and increments its version"
    errors: [ERR_MISSING_AUTH_HEADER, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_INVALID_RANGE, ERR_INVALID_DATE_FORMAT, ERR_REQUISITION_NOT_FOUND, ERR_CANDIDATE_NOT_FOUND, ERR_ENTITY_RELATIONSHIP_MISMATCH, ERR_STALE_REQUISITION_VERSION, ERR_INVALID_STATE_TRANSITION, ERR_CLIENT_SUSPENDED, ERR_CANDIDATE_NOT_VETTED, ERR_CANDIDATE_UNAVAILABLE, ERR_CANDIDATE_SCORE_BELOW_THRESHOLD, ERR_REFERENCE_CHAIN_TOO_SHORT, ERR_NO_PASSED_TRIAL, ERR_CLIENT_CREDIT_HOLD]

