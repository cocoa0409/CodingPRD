            - call: "POST /appointments"
              payload: { patient_id: "${p_id}", provider_id: "${prov_id}", operatory_id: "${op_id}", appointment_type: "PREVENTIVE", start_at: "2026-08-01T09:00:00Z", end_at: "2026-08-01T09:45:00Z", treatment_plan_item_id: "${item_id}" }
              as: FrontDesk
