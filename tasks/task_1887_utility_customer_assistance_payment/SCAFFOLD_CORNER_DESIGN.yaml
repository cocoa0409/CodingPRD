              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 25000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "State 2026", funder_type: "STATE_GRANT", fiscal_year: 2026, appropriated_cents: 100000, priority_rank: 1, eligible_tiers: ["TIER_1", "TIER_2", "TIER_3"] }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 30000 }
              as: ProgramAdmin
              captures: { alloc1: "$.data[0].id" }
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 20000 }
              as: ProgramAdmin
              captures: { alloc2: "$.data[0].id" }
          trigger:
            - call: "POST /assistance/fund-allocations/${alloc1}/disburse"
              payload: {}
              as: ProgramAdmin
              captures: { a1_status: "$.data.status" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { arr: "$.data.arrearage_balance_cents", cred: "$.data.credit_balance_cents" }
            - call: "GET /assistance/funding-sources/${fund_id}/report"
              payload: {}
              as: ProgramAdmin
              captures: { pledged: "$.data.pledged_cents", disbursed: "$.data.disbursed_cents", released: "$.data.released_cents", avail: "$.data.available_cents", count: "$.data.allocation_count" }
          assert:
            - "disburse succeeds: allocation 1 DISBURSED; account arrearage 25000 -> 0 and credit_balance_cents == 5000 (remainder routing)"
            - "report: pledged_cents == 20000, disbursed_cents == 30000, released_cents == 0, available_cents == 50000, allocation_count == 2"

      - name: heat_index_boundary_95
        claim_type: constants_applied
        grounds: [calculations.protection_gate]
        distinguishing_aspect: "Heat branch of the weather gate: observed_heat_index_f == 95 triggers WEATHER_MORATORIUM (inclusive >=); 94 does not."
        test_recipe:
          setup: ["account arrearage 120000 charged 2026-08-01; clock 2026-09-15 (DELINQUENT, shutoff-eligible); no certificates"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "25 Heat Hwy" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: { observed_heat_index_f: 95 }
              as: ProgramAdmin
              captures: { made95: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot95: "$.data.protection_status" }
            - call: "POST /assistance/ops/daily-sweep"
              payload: { observed_heat_index_f: 94 }
              as: ProgramAdmin
              captures: { made94: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot94: "$.data.protection_status" }
          assert:
            - "heat index 95: protection_status == WEATHER_MORATORIUM, orders_created == 0"
            - "heat index 94: protection_status == UNPROTECTED, orders_created == 1"

      - name: winter_season_half_open_window
        claim_type: constants_applied
        grounds: [calculations.protection_gate]
        distinguishing_aspect: "Winter season is the half-open window [Nov 1, Apr 1): a sweep on 2026-11-01 protects; a sweep on 2027-04-01 does not and auto-creates the order."
        test_recipe:
          setup: ["account arrearage 120000 charged 2026-08-01; no certificates"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "26 Winter Way" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { made_nov: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot_nov: "$.data.protection_status" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { made_apr: "$.data.orders_created" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prot_apr: "$.data.protection_status", svc_apr: "$.data.service_status" }
            - call: "GET /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}" }
              as: ProgramAdmin
              captures: { sched_apr: "$.data[0].scheduled_date" }
          assert:
            - "2026-11-01 sweep: protection_status == WEATHER_MORATORIUM (winter start inclusive), orders_created == 0"
            - "2027-04-01 sweep: protection_status == UNPROTECTED (Apr 1 exclusive), orders_created == 1, service_status == DISCONNECT_PENDING, scheduled_date == 2027-04-16"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: invalid_request_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "A DPA create missing required installment_count against a nonexistent account_id returns ERR_INVALID_REQUEST (priority 4), not ERR_NOT_FOUND (priority 5)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assistance/dpas"
              payload: { account_id: "00000000-0000-0000-0000-000000000000" }
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (shape validation precedes existence)"

      - name: sod_verifier_equals_submitter
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same X-User-ID that submitted an application cannot begin its review, even holding the EligibilitySpecialist role."
        test_recipe:
          setup: ["account; application submitted by user dup_1"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "30 Sod St" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: dup_1
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: dup_1
              captures: { err: "$.data.error_id" }
            - call: "GET /assistance/applications/${app_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { st: "$.data.status" }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES, HTTP 403; application stays SUBMITTED"

      - name: notice_period_boundary_15_days
        claim_type: violation_to_error
        grounds: ["validations[priority=21]", "errors[ERR_NOTICE_PERIOD_TOO_SHORT]"]
        distinguishing_aspect: "scheduled_date exactly clock + 15 days is accepted; one day earlier is rejected."
        test_recipe:
          setup: ["account arrearage 120000 charged 2026-08-01; clock 2026-09-15 (DELINQUENT, shutoff-eligible)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "31 Notice Ln" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-29" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { order_id: "$.data.id", st: "$.data.status" }
          assert:
            - "2026-09-29 (14 days out): error_id == ERR_NOTICE_PERIOD_TOO_SHORT, HTTP 422"
            - "2026-09-30 (exactly 15 days): created, status == SCHEDULED (inclusive boundary)"

      - name: reinstate_cure_window_expired
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_CURE_WINDOW_EXPIRED]"]
        distinguishing_aspect: "Reinstate at defaulted_on + 16 days fails with ERR_CURE_WINDOW_EXPIRED even though all due installments are settled."
        test_recipe:
          setup: ["account arrearage 120000; DPA n=4 activated 2026-08-01 (down 12000 paid); sweep at 2026-09-06 defaults the DPA (installment 1 due 2026-08-31 + grace 5); missed installment settled by a 27000 payment on 2026-09-06; clock advanced to 2026-09-22 with NO further sweep"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "32 Cure Ct" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12000, tender_type: "CASH" }
              as: CustomerServiceRep
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 27000, tender_type: "CASH" }
              as: CustomerServiceRep
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/dpas/${dpa_id}/reinstate"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CURE_WINDOW_EXPIRED, HTTP 422 (2026-09-22 > defaulted_on 2026-09-06 + 15 days = 2026-09-21); DPA remains DEFAULTED"

      - name: documents_outstanding_blocks_verify
        claim_type: violation_to_error
        grounds: ["validations[priority=23]", "errors[ERR_DOCUMENTS_OUTSTANDING]"]
        distinguishing_aspect: "Verify from DOCS_PENDING with docs_requested and documents_received == false fails with ERR_DOCUMENTS_OUTSTANDING (not a state error — DOCS_PENDING is an allowed verify from-state)."
        test_recipe:
          setup: ["application UNDER_REVIEW; request-documents moved it to DOCS_PENDING and reset documents_received"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "33 Docs Dr" }
              as: ProgramAdmin
