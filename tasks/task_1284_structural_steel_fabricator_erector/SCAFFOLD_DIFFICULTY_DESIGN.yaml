# =============================================================================
# §1.8 Scaffold Difficulty Design — Structural Steel Fabricator & Erector
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Every setup chain replays against SCAFFOLD.yaml §1.5; all numeric asserts are
# pre-computed literals from the §1.3 formulas and their constants.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: percent_complete_weight_vs_count_basis
        grounds:
          - calculations.piece_percent_complete
          - entities.Job.fields.pct_complete
          - entities.Job.fields.billing_basis
        distinguishing_aspect: |
          Entity domain: progress measurement on Piece/Job. Two jobs with
          physically identical progress (the single 700-lb piece out of
          100/200/700 lbs erected) yield pct_complete 0.7000 under the WEIGHT
          variant but 0.3333 under the COUNT variant — same inputs, different
          results driven solely by job.billing_basis.
        test_recipe:
          setup:
            - "Job W (billing_basis=WEIGHT) and Job C (billing_basis=COUNT), each with pieces of 100/200/700 lbs where only the 700-lb piece is ERECTED"
            - "Each job: AWARDED -> FABRICATING with one APPROVED drawing, one RELEASED sequence, one RECEIVED mill order"
          setup_api_calls:
            # ---- Job W (WEIGHT) ----
            - { call: "POST /jobs", payload: { name: "Job W", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jw: $.data.id } }
            - { call: "POST /jobs/${jw}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jw}", drawing_number: "D-100" }, as: DETAILER, captures: { dw: $.data.id } }
            - { call: "POST /shop-drawings/${dw}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dw}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jw}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jw}", seq_number: 1 }, as: FOREMAN, captures: { sw: $.data.id } }
            - { call: "POST /erection-sequences/${sw}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jw}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mw: $.data.id } }
            - { call: "POST /mill-orders/${mw}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jw}", piece_mark: "W-P1", weight_lbs: 100, drawing_id: "${dw}", sequence_id: "${sw}" }, as: FOREMAN }
            - { call: "POST /pieces", payload: { job_id: "${jw}", piece_mark: "W-P2", weight_lbs: 200, drawing_id: "${dw}", sequence_id: "${sw}" }, as: FOREMAN }
            - { call: "POST /pieces", payload: { job_id: "${jw}", piece_mark: "W-P3", weight_lbs: 700, drawing_id: "${dw}", sequence_id: "${sw}" }, as: FOREMAN, captures: { pw3: $.data.id } }
            - { call: "POST /pieces/${pw3}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jw}", kind: "FINAL_PIECE", piece_id: "${pw3}" }, as: QC_INSPECTOR, captures: { fiw: $.data.id } }
            - { call: "POST /inspections/${fiw}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jw}", load_number: "L-W1", laydown_slot: "Y-W", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lw: $.data.id } }
            - { call: "POST /shipping-loads/${lw}/lines", payload: { piece_id: "${pw3}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lw}/ship", as: FOREMAN }
            - { call: "POST /pieces/${pw3}/erect", as: FOREMAN }
            # ---- Job C (COUNT) ----
            - { call: "POST /jobs", payload: { name: "Job C", contract_value_cents: 10000000, billing_basis: "COUNT" }, as: FABRICATOR_ADMIN, captures: { jc: $.data.id } }
            - { call: "POST /jobs/${jc}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jc}", drawing_number: "D-100" }, as: DETAILER, captures: { dc: $.data.id } }
            - { call: "POST /shop-drawings/${dc}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dc}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jc}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jc}", seq_number: 1 }, as: FOREMAN, captures: { sc: $.data.id } }
            - { call: "POST /erection-sequences/${sc}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jc}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mc: $.data.id } }
            - { call: "POST /mill-orders/${mc}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jc}", piece_mark: "C-P1", weight_lbs: 100, drawing_id: "${dc}", sequence_id: "${sc}" }, as: FOREMAN }
            - { call: "POST /pieces", payload: { job_id: "${jc}", piece_mark: "C-P2", weight_lbs: 200, drawing_id: "${dc}", sequence_id: "${sc}" }, as: FOREMAN }
            - { call: "POST /pieces", payload: { job_id: "${jc}", piece_mark: "C-P3", weight_lbs: 700, drawing_id: "${dc}", sequence_id: "${sc}" }, as: FOREMAN, captures: { pc3: $.data.id } }
            - { call: "POST /pieces/${pc3}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jc}", kind: "FINAL_PIECE", piece_id: "${pc3}" }, as: QC_INSPECTOR, captures: { fic: $.data.id } }
            - { call: "POST /inspections/${fic}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jc}", load_number: "L-C1", laydown_slot: "Y-C", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lc: $.data.id } }
            - { call: "POST /shipping-loads/${lc}/lines", payload: { piece_id: "${pc3}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lc}/ship", as: FOREMAN }
            - { call: "POST /pieces/${pc3}/erect", as: FOREMAN }
          trigger:
            - { call: "GET /jobs/${jw}", as: FABRICATOR_ADMIN, captures: { pct_w: $.data.pct_complete } }
            - { call: "GET /jobs/${jc}", as: FABRICATOR_ADMIN, captures: { pct_c: $.data.pct_complete } }
          assert:
            - "Job.${jw}.pct_complete == 0.7000 (700/1000 lbs)"
            - "Job.${jc}.pct_complete == 0.3333 (1/3 pieces, round_half_up 4dp)"
            - "pct_w != pct_c for physically identical progress"

      - name: mill_invoice_nominal_vs_actual
        grounds:
          - calculations.mill_order_invoice
          - entities.MillOrder.fields.invoice_amount_cents
          - entities.MillOrder.fields.billing_mode
        distinguishing_aspect: |
          Entity domain: procurement (MillOrder) — disjoint from the Piece/Job
          progress domain of the other instance. Two mill orders with identical
          ordered weight (100000 lbs), price (4500 cents/cwt) and scale weight
          (105000 lbs) invoice 4500000 cents under NOMINAL but 4725000 cents
          under ACTUAL.
        test_recipe:
          setup:
            - "One AWARDED job; two mill orders differing only in billing_mode; both received at 105000 lbs (within the +/-10% tolerance)"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job M", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jm: $.data.id } }
            - { call: "POST /jobs/${jm}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /mill-orders", payload: { job_id: "${jm}", material_grade: "A36", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mon: $.data.id } }
            - { call: "POST /mill-orders", payload: { job_id: "${jm}", material_grade: "A36", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "ACTUAL" }, as: FABRICATOR_ADMIN, captures: { moa: $.data.id } }
          trigger:
            - { call: "POST /mill-orders/${mon}/receive", payload: { received_weight_lbs: 105000 }, as: FABRICATOR_ADMIN, captures: { inv_n: $.data.invoice_amount_cents } }
            - { call: "POST /mill-orders/${moa}/receive", payload: { received_weight_lbs: 105000 }, as: FABRICATOR_ADMIN, captures: { inv_a: $.data.invoice_amount_cents } }
          assert:
            - "MillOrder.${mon}.invoice_amount_cents == 4500000 (1000 cwt x 4500)"
            - "MillOrder.${moa}.invoice_amount_cents == 4725000 (1050 cwt x 4500)"
            - "MillOrder.${mon}.status == RECEIVED and MillOrder.${moa}.status == RECEIVED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) tiered branch, (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: retainage_tiered_rate_whole_amount
        grounds:
          - calculations.net_progress_billing
          - calculations.piece_percent_complete
          - entities.ProgressBilling.fields.retainage_cum_cents
        distinguishing_aspect: |
          Mode (a): a 5-input formula (contract_value, pct, tier threshold,
          settled backcharges, previously billed) with a conditional tiered-rate
          branch applied to the WHOLE earned amount. pct 0.5000 selects the 5%
          rate (net 4750000) while pct 0.4990 selects 10% (net 4491000).
        test_recipe:
          setup:
            - "Job A: two 500-lb pieces, one ERECTED -> pct 0.5000. Job B: pieces of 499 and 501 lbs, the 499-lb one ERECTED -> pct 0.4990"
            - "Both jobs FABRICATING, contract_value_cents 10000000, no backcharges, no prior billings"
          setup_api_calls:
            # ---- Job A: pct exactly 0.5000 ----
            - { call: "POST /jobs", payload: { name: "Job A", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { ja: $.data.id } }
            - { call: "POST /jobs/${ja}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${ja}", drawing_number: "D-1" }, as: DETAILER, captures: { da: $.data.id } }
            - { call: "POST /shop-drawings/${da}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${da}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${ja}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${ja}", seq_number: 1 }, as: FOREMAN, captures: { sa: $.data.id } }
            - { call: "POST /erection-sequences/${sa}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${ja}", material_grade: "A572", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { ma: $.data.id } }
            - { call: "POST /mill-orders/${ma}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${ja}", piece_mark: "A-P1", weight_lbs: 500, drawing_id: "${da}", sequence_id: "${sa}" }, as: FOREMAN, captures: { pa1: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${ja}", piece_mark: "A-P2", weight_lbs: 500, drawing_id: "${da}", sequence_id: "${sa}" }, as: FOREMAN }
            - { call: "POST /pieces/${pa1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${ja}", kind: "FINAL_PIECE", piece_id: "${pa1}" }, as: QC_INSPECTOR, captures: { fia: $.data.id } }
            - { call: "POST /inspections/${fia}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${ja}", load_number: "L-A1", laydown_slot: "Y-A", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { la: $.data.id } }
            - { call: "POST /shipping-loads/${la}/lines", payload: { piece_id: "${pa1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${la}/ship", as: FOREMAN }
            - { call: "POST /pieces/${pa1}/erect", as: FOREMAN }
            - { call: "GET /jobs/${ja}", as: FABRICATOR_ADMIN, captures: { jva: $.data.version } }
            # ---- Job B: pct 0.4990 ----
            - { call: "POST /jobs", payload: { name: "Job B", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jb: $.data.id } }
            - { call: "POST /jobs/${jb}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jb}", drawing_number: "D-1" }, as: DETAILER, captures: { db: $.data.id } }
            - { call: "POST /shop-drawings/${db}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${db}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jb}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jb}", seq_number: 1 }, as: FOREMAN, captures: { sb: $.data.id } }
            - { call: "POST /erection-sequences/${sb}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jb}", material_grade: "A572", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mb: $.data.id } }
            - { call: "POST /mill-orders/${mb}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jb}", piece_mark: "B-P1", weight_lbs: 499, drawing_id: "${db}", sequence_id: "${sb}" }, as: FOREMAN, captures: { pb1: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${jb}", piece_mark: "B-P2", weight_lbs: 501, drawing_id: "${db}", sequence_id: "${sb}" }, as: FOREMAN }
            - { call: "POST /pieces/${pb1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jb}", kind: "FINAL_PIECE", piece_id: "${pb1}" }, as: QC_INSPECTOR, captures: { fib: $.data.id } }
            - { call: "POST /inspections/${fib}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jb}", load_number: "L-B1", laydown_slot: "Y-B", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lb: $.data.id } }
            - { call: "POST /shipping-loads/${lb}/lines", payload: { piece_id: "${pb1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lb}/ship", as: FOREMAN }
            - { call: "POST /pieces/${pb1}/erect", as: FOREMAN }
            - { call: "GET /jobs/${jb}", as: FABRICATOR_ADMIN, captures: { jvb: $.data.version } }
          trigger:
            - { call: "POST /progress-billings", payload: { job_id: "${ja}", period_label: "2026-08", expected_job_version: "${jva}" }, as: FABRICATOR_ADMIN, captures: { ba_pct: $.data.pct_complete_snapshot, ba_earn: $.data.earned_cum_cents, ba_ret: $.data.retainage_cum_cents, ba_net: $.data.net_due_cents } }
            - { call: "POST /progress-billings", payload: { job_id: "${jb}", period_label: "2026-08", expected_job_version: "${jvb}" }, as: FABRICATOR_ADMIN, captures: { bb_pct: $.data.pct_complete_snapshot, bb_net: $.data.net_due_cents } }
          assert:
            - "Billing A pct_complete_snapshot == 0.5000"
            - "Billing A earned_cum_cents == 5000000"
            - "Billing A retainage_cum_cents == 250000 (5% whole-amount rate at pct >= 0.5000)"
            - "Billing A net_due_cents == 4750000"
            - "Billing B pct_complete_snapshot == 0.4990"
            - "Billing B net_due_cents == 4491000 (earned 4990000 minus 10% retainage 499000)"

      - name: backcharge_per_line_rounding_order
        grounds:
          - calculations.backcharge_amount
          - entities.FieldFix.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round_half_up each
          line's labor (2.5 h x 3333 cents = 8332.5 -> 8333) BEFORE summing
          yields subtotal 16666 and total 19166; summing raw labor first would
          yield 16665 and total 19165. The scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Job with one SHIPPED 1000-lb piece; a field fix with two repair lines of 2.5 hours at 3333 cents/hour and zero material"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job R", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jr: $.data.id } }
            - { call: "POST /jobs/${jr}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jr}", drawing_number: "D-1" }, as: DETAILER, captures: { dr: $.data.id } }
            - { call: "POST /shop-drawings/${dr}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dr}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jr}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jr}", seq_number: 1 }, as: FOREMAN, captures: { sr: $.data.id } }
            - { call: "POST /erection-sequences/${sr}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jr}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mr: $.data.id } }
            - { call: "POST /mill-orders/${mr}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jr}", piece_mark: "R-P1", weight_lbs: 1000, drawing_id: "${dr}", sequence_id: "${sr}" }, as: FOREMAN, captures: { pr1: $.data.id } }
            - { call: "POST /pieces/${pr1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jr}", kind: "FINAL_PIECE", piece_id: "${pr1}" }, as: QC_INSPECTOR, captures: { fir: $.data.id } }
            - { call: "POST /inspections/${fir}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jr}", load_number: "L-R1", laydown_slot: "Y-R", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lr: $.data.id } }
            - { call: "POST /shipping-loads/${lr}/lines", payload: { piece_id: "${pr1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lr}/ship", as: FOREMAN }
            - { call: "POST /field-fixes", payload: { job_id: "${jr}", piece_id: "${pr1}", description: "Misaligned shear tab", repair_lines: [ { labor_hours: 2.5, labor_rate_cents: 3333, material_cents: 0 }, { labor_hours: 2.5, labor_rate_cents: 3333, material_cents: 0 } ] }, as: FOREMAN, captures: { ffr: $.data.id } }
          trigger:
            - { call: "POST /field-fixes/${ffr}/approve", as: GC_PM, captures: { amt: $.data.amount_cents } }
            - { call: "GET /backcharges", payload: { field_fix_id: "${ffr}" }, as: GC_PM, captures: { bc_amt: "$.data[0].amount_cents", bc_status: "$.data[0].status" } }
          assert:
            - "FieldFix.${ffr}.amount_cents == 19166 (8333 + 8333 = 16666; markup round(16666*0.15)=2500)"
            - "Backcharge created with amount_cents == 19166 and status == PENDING"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities: Piece cycle, Weld cycle)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: piece_rework_loop
        grounds:
          - state_machines.Piece.AWAITING_INSPECTION_to_REWORK
          - state_machines.Piece.REWORK_to_IN_SHOP
          - state_machines.Piece.IN_SHOP_to_AWAITING_INSPECTION
        distinguishing_aspect: |
          Cyclic machine on Piece: IN_SHOP -> AWAITING_INSPECTION -> REWORK ->
          IN_SHOP -> AWAITING_INSPECTION -> READY_TO_SHIP — the entity loops
          back to a prior state and can complete afterward.
        test_recipe:
          setup:
            - "Fabrication-ready job; piece N-P1 progressed to IN_SHOP; first FINAL_PIECE inspection will FAIL, the piece re-enters the shop, and the second FINAL_PIECE passes"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job N", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jn: $.data.id } }
            - { call: "POST /jobs/${jn}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jn}", drawing_number: "D-1" }, as: DETAILER, captures: { dn: $.data.id } }
            - { call: "POST /shop-drawings/${dn}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dn}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jn}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jn}", seq_number: 1 }, as: FOREMAN, captures: { sn: $.data.id } }
            - { call: "POST /erection-sequences/${sn}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jn}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mn: $.data.id } }
            - { call: "POST /mill-orders/${mn}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jn}", piece_mark: "N-P1", weight_lbs: 800, drawing_id: "${dn}", sequence_id: "${sn}" }, as: FOREMAN, captures: { pn1: $.data.id } }
            - { call: "POST /pieces/${pn1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jn}", kind: "FINAL_PIECE", piece_id: "${pn1}" }, as: QC_INSPECTOR, captures: { fin1: $.data.id } }
          trigger:
            - { call: "POST /inspections/${fin1}/submit", payload: { outcome: "FAILED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "GET /pieces/${pn1}", as: FOREMAN, captures: { st1: $.data.status } }
            - { call: "POST /pieces/${pn1}/start", as: FOREMAN, captures: { st2: $.data.status } }
            - { call: "POST /inspections", payload: { job_id: "${jn}", kind: "FINAL_PIECE", piece_id: "${pn1}" }, as: QC_INSPECTOR, captures: { fin2: $.data.id } }
            - { call: "POST /inspections/${fin2}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "GET /pieces/${pn1}", as: FOREMAN, captures: { st3: $.data.status } }
          assert:
            - "st1 == REWORK (cycle back from AWAITING_INSPECTION)"
            - "st2 == IN_SHOP (REWORK -> IN_SHOP loop edge)"
            - "st3 == READY_TO_SHIP (piece completes normally after the loop)"

      - name: weld_repair_loop
        grounds:
          - state_machines.Weld.WELDED_to_VISUAL_REJECTED
          - state_machines.Weld.VISUAL_REJECTED_to_WELDED
          - entities.Weld.fields.repair_count
        distinguishing_aspect: |
          Cyclic machine on Weld (different entity than Piece): WELDED ->
          VISUAL_REJECTED -> (repair) WELDED -> VISUAL_PASSED, with repair_count
          incrementing on each loop traversal.
        test_recipe:
          setup:
            - "Piece K-P1 IN_SHOP; qualified FCAW welder; one weld logged at the default clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job K", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jk: $.data.id } }
            - { call: "POST /jobs/${jk}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jk}", drawing_number: "D-1" }, as: DETAILER, captures: { dk: $.data.id } }
            - { call: "POST /shop-drawings/${dk}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dk}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jk}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jk}", seq_number: 1 }, as: FOREMAN, captures: { sk: $.data.id } }
            - { call: "POST /erection-sequences/${sk}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jk}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mk: $.data.id } }
            - { call: "POST /mill-orders/${mk}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jk}", piece_mark: "K-P1", weight_lbs: 800, drawing_id: "${dk}", sequence_id: "${sk}" }, as: FOREMAN, captures: { pk1: $.data.id } }
            - { call: "POST /pieces/${pk1}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld One", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { wk: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${pk1}", welder_id: "${wk}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T10:00:00Z" }, as: WELDER, as_user_id: "${wk}", captures: { wld: $.data.id } }
            - { call: "POST /inspections", payload: { job_id: "${jk}", kind: "WELD_VISUAL", weld_id: "${wld}" }, as: QC_INSPECTOR, captures: { iv1: $.data.id } }
          trigger:
            - { call: "POST /inspections/${iv1}/submit", payload: { outcome: "FAILED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /welds/${wld}/repair", as: WELDER, as_user_id: "${wk}", captures: { rc: $.data.repair_count, st: $.data.status } }
            - { call: "POST /inspections", payload: { job_id: "${jk}", kind: "WELD_VISUAL", weld_id: "${wld}" }, as: QC_INSPECTOR, captures: { iv2: $.data.id } }
            - { call: "POST /inspections/${iv2}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1", captures: { st2: $.data.status } }
          assert:
            - "After FAILED submit: Weld.${wld}.status == VISUAL_REJECTED"
            - "repair returns status == WELDED with repair_count == 1"
            - "Second WELD_VISUAL PASSED leaves Weld.${wld}.status == VISUAL_PASSED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depth 3 and depth 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: drawing_supersede_load_cascade
        grounds:
          - state_machines.ShopDrawing.SUBMITTED_to_APPROVED
          - state_machines.ShopDrawing.APPROVED_to_SUPERSEDED
          - entities.Piece.fields.stale_revision
          - state_machines.ShippingLoad.LOADING_to_STAGING
        distinguishing_aspect: |
          Depth-3 chain from the decide(APPROVE) trigger: old revision ->
          SUPERSEDED (hop 1) mutates Pieces to stale_revision=true and strips
          their load membership (hop 2), whose removal recomputes
          ShippingLoad.total_weight_lbs and flips the emptied load LOADING ->
          STAGING (hop 3).
        test_recipe:
          setup:
            - "Piece S-P1 (5000 lbs) READY_TO_SHIP and loaded on L-S1 (capacity 20000, LOADING); drawing rev 1 APPROVED; revision 2 created, submitted, then approved"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job S", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { js: $.data.id } }
            - { call: "POST /jobs/${js}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${js}", drawing_number: "D-1" }, as: DETAILER, captures: { ds: $.data.id } }
            - { call: "POST /shop-drawings/${ds}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${ds}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${js}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${js}", seq_number: 1 }, as: FOREMAN, captures: { ss: $.data.id } }
            - { call: "POST /erection-sequences/${ss}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${js}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { ms: $.data.id } }
            - { call: "POST /mill-orders/${ms}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${js}", piece_mark: "S-P1", weight_lbs: 5000, drawing_id: "${ds}", sequence_id: "${ss}" }, as: FOREMAN, captures: { ps1: $.data.id } }
            - { call: "POST /pieces/${ps1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${js}", kind: "FINAL_PIECE", piece_id: "${ps1}" }, as: QC_INSPECTOR, captures: { fis: $.data.id } }
            - { call: "POST /inspections/${fis}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${js}", load_number: "L-S1", laydown_slot: "Y-S", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { ls: $.data.id } }
            - { call: "POST /shipping-loads/${ls}/lines", payload: { piece_id: "${ps1}" }, as: FOREMAN }
            - { call: "GET /shop-drawings/${ds}", as: DETAILER, captures: { dsv: $.data.version } }
            - { call: "POST /shop-drawings/${ds}/revise", payload: { expected_drawing_version: "${dsv}" }, as: DETAILER, captures: { ds2: $.data.id } }
            - { call: "POST /shop-drawings/${ds2}/submit", as: DETAILER, as_user_id: "det-1" }
          trigger:
            - { call: "POST /shop-drawings/${ds2}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "GET /shop-drawings/${ds}", as: DETAILER, captures: { rev1_status: $.data.status } }
            - { call: "GET /pieces/${ps1}", as: FOREMAN, captures: { p_stale: $.data.stale_revision, p_load: $.data.load_id } }
            - { call: "GET /shipping-loads", payload: { job_id: "${js}" }, as: FOREMAN, captures: { l_status: "$.data[0].status", l_weight: "$.data[0].total_weight_lbs" } }
            - { call: "GET /shipping-loads/${ls}/lines", as: FOREMAN }
          assert:
            - "ShopDrawing.${ds}.status == SUPERSEDED (hop 1)"
            - "Piece.${ps1}.stale_revision == true and Piece.${ps1}.load_id == null (hop 2)"
            - "ShippingLoad.${ls}.total_weight_lbs == 0 and status == STAGING (hop 3)"
            - "GET /shipping-loads/${ls}/lines returns an empty array"

      - name: field_fix_approve_backcharge_cascade
        grounds:
          - state_machines.FieldFix.PRICED_to_APPROVED
          - entities.Backcharge.fields.amount_cents
          - entities.Job.fields.pending_backcharge_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (field-fix approve, not drawing
          decide): approve creates a PENDING Backcharge with the computed amount
          (hop 1), whose creation recomputes Job.pending_backcharge_cents
          (hop 2).
        test_recipe:
          setup:
            - "Job with one SHIPPED 1000-lb piece; field fix F with repair_lines [{10h, 10000 cents/h, 5000 material}] PRICED"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job F", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jf: $.data.id } }
            - { call: "POST /jobs/${jf}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jf}", drawing_number: "D-1" }, as: DETAILER, captures: { df: $.data.id } }
            - { call: "POST /shop-drawings/${df}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${df}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jf}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jf}", seq_number: 1 }, as: FOREMAN, captures: { sf: $.data.id } }
            - { call: "POST /erection-sequences/${sf}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jf}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mf: $.data.id } }
            - { call: "POST /mill-orders/${mf}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jf}", piece_mark: "F-P1", weight_lbs: 1000, drawing_id: "${df}", sequence_id: "${sf}" }, as: FOREMAN, captures: { pf1: $.data.id } }
            - { call: "POST /pieces/${pf1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jf}", kind: "FINAL_PIECE", piece_id: "${pf1}" }, as: QC_INSPECTOR, captures: { fif: $.data.id } }
            - { call: "POST /inspections/${fif}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jf}", load_number: "L-F1", laydown_slot: "Y-F", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lf: $.data.id } }
            - { call: "POST /shipping-loads/${lf}/lines", payload: { piece_id: "${pf1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lf}/ship", as: FOREMAN }
            - { call: "POST /field-fixes", payload: { job_id: "${jf}", piece_id: "${pf1}", description: "Clip angle rework", repair_lines: [ { labor_hours: 10, labor_rate_cents: 10000, material_cents: 5000 } ] }, as: FOREMAN, captures: { ff: $.data.id } }
          trigger:
            - { call: "POST /field-fixes/${ff}/approve", as: GC_PM }
            - { call: "GET /backcharges", payload: { field_fix_id: "${ff}" }, as: GC_PM, captures: { bc_id: "$.data[0].id", bc_amt: "$.data[0].amount_cents", bc_status: "$.data[0].status" } }
            - { call: "GET /jobs/${jf}", as: FABRICATOR_ADMIN, captures: { pend: $.data.pending_backcharge_cents } }
          assert:
            - "Backcharge.${bc_id}.status == PENDING and amount_cents == 120750 (105000 subtotal + 15750 markup)"
            - "Job.${jf}.pending_backcharge_cents == 120750 (hop 2 recompute)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: settle_state_over_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BACKCHARGE_EXCEEDS_EARNED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: settling an already-SETTLED
          backcharge with an amount that would also exceed billed_to_date_cents
          returns ERR_INVALID_STATE (priority 6), never
          ERR_BACKCHARGE_EXCEEDS_EARNED (priority 10).
        test_recipe:
          setup:
            - "Backcharge SETTLED once with settled_amount_cents 0 (job billed_to_date_cents == 0); a second settle of 5 cents violates both the state machine and the fiscal cap"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job T", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jt: $.data.id } }
            - { call: "POST /jobs/${jt}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jt}", drawing_number: "D-1" }, as: DETAILER, captures: { dt: $.data.id } }
            - { call: "POST /shop-drawings/${dt}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dt}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jt}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jt}", seq_number: 1 }, as: FOREMAN, captures: { st: $.data.id } }
            - { call: "POST /erection-sequences/${st}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jt}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mt: $.data.id } }
            - { call: "POST /mill-orders/${mt}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jt}", piece_mark: "T-P1", weight_lbs: 1000, drawing_id: "${dt}", sequence_id: "${st}" }, as: FOREMAN, captures: { pt1: $.data.id } }
            - { call: "POST /pieces/${pt1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jt}", kind: "FINAL_PIECE", piece_id: "${pt1}" }, as: QC_INSPECTOR, captures: { fit: $.data.id } }
            - { call: "POST /inspections/${fit}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jt}", load_number: "L-T1", laydown_slot: "Y-T", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lt: $.data.id } }
            - { call: "POST /shipping-loads/${lt}/lines", payload: { piece_id: "${pt1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lt}/ship", as: FOREMAN }
            - { call: "POST /field-fixes", payload: { job_id: "${jt}", piece_id: "${pt1}", description: "Hole ream", repair_lines: [ { labor_hours: 1, labor_rate_cents: 100, material_cents: 0 } ] }, as: FOREMAN, captures: { fft: $.data.id } }
            - { call: "POST /field-fixes/${fft}/approve", as: GC_PM }
            - { call: "GET /backcharges", payload: { field_fix_id: "${fft}" }, as: GC_PM, captures: { bct: "$.data[0].id" } }
            - { call: "POST /backcharges/${bct}/respond", payload: { response: "ACCEPT" }, as: GC_PM }
            - { call: "POST /backcharges/${bct}/settle", payload: { settled_amount_cents: 0 }, as: FABRICATOR_ADMIN }
          trigger:
            - { call: "POST /backcharges/${bct}/settle", payload: { settled_amount_cents: 5 }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_INVALID_STATE (state priority 6 beats fiscal priority 10; the 5-cent settle also violates ERR_BACKCHARGE_EXCEEDS_EARNED because billed_to_date_cents == 0)"
            - "Backcharge.${bct}.status remains SETTLED"

      - name: weld_safety_over_double_booking
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_WELDER_NOT_QUALIFIED]
          - errors[ERR_WELDER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint (different pair
          than state/fiscal): a weld whose welder qualification has lapsed AND
          whose window overlaps an existing weld returns
          ERR_WELDER_NOT_QUALIFIED (priority 7), never ERR_WELDER_DOUBLE_BOOKED
          (priority 9).
        test_recipe:
          setup:
            - "Piece U-P1 IN_SHOP; welder qualified FCAW through 2026-08-10 with weld #1 occupying 09:00-11:00 on 2026-08-01; logical clock then advanced to 2026-08-20, past the expiry"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job U", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { ju: $.data.id } }
            - { call: "POST /jobs/${ju}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${ju}", drawing_number: "D-1" }, as: DETAILER, captures: { du: $.data.id } }
            - { call: "POST /shop-drawings/${du}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${du}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${ju}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${ju}", seq_number: 1 }, as: FOREMAN, captures: { su: $.data.id } }
            - { call: "POST /erection-sequences/${su}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${ju}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mu: $.data.id } }
            - { call: "POST /mill-orders/${mu}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${ju}", piece_mark: "U-P1", weight_lbs: 800, drawing_id: "${du}", sequence_id: "${su}" }, as: FOREMAN, captures: { pu1: $.data.id } }
            - { call: "POST /pieces/${pu1}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld Two", qual_process: "FCAW", qual_expires_on: "2026-08-10" }, as: FABRICATOR_ADMIN, captures: { wu: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${pu1}", welder_id: "${wu}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }, as: WELDER, as_user_id: "${wu}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: FABRICATOR_ADMIN }
          trigger:
            - { call: "POST /welds", payload: { piece_id: "${pu1}", welder_id: "${wu}", process: "FCAW", weld_date: "2026-08-20", window_start: "2026-08-20T10:00:00Z", window_end: "2026-08-20T12:00:00Z" }, as: WELDER, as_user_id: "${wu}", captures: { err: $.data.error_id } }
          assert:
            - "error == ERR_WELDER_NOT_QUALIFIED (safety beats constraint even though 10:00-12:00 overlaps the existing 09:00-11:00 booking)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: mill_receive_exactly_tolerance
        grounds:
          - calculations.mill_order_invoice
          - state_machines.MillOrder.PLACED_to_RECEIVED
          - errors[ERR_WEIGHT_OUT_OF_TOLERANCE]
        distinguishing_aspect: |
          Metric: weight ratio. received_weight exactly == ordered + 10%
          (110000 vs 100000) is ACCEPTED (inclusive boundary), while 110001 is
          rejected with ERR_WEIGHT_OUT_OF_TOLERANCE — via POST
          /mill-orders/{id}/receive.
        test_recipe:
          setup:
            - "AWARDED job; two NOMINAL mill orders, each ordered 100000 lbs at 4500 cents/cwt"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job V", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jv: $.data.id } }
            - { call: "POST /jobs/${jv}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /mill-orders", payload: { job_id: "${jv}", material_grade: "A36", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mv1: $.data.id } }
            - { call: "POST /mill-orders", payload: { job_id: "${jv}", material_grade: "A36", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mv2: $.data.id } }
          trigger:
            - { call: "POST /mill-orders/${mv1}/receive", payload: { received_weight_lbs: 110000 }, as: FABRICATOR_ADMIN, captures: { st1: $.data.status, inv1: $.data.invoice_amount_cents } }
            - { call: "POST /mill-orders/${mv2}/receive", payload: { received_weight_lbs: 110001 }, as: FABRICATOR_ADMIN, captures: { err: $.data.error_id } }
          assert:
            - "st1 == RECEIVED and inv1 == 4500000 (exactly +10% accepted)"
            - "err == ERR_WEIGHT_OUT_OF_TOLERANCE (+10% + 1 lb rejected)"
            - "MillOrder.${mv2}.status remains PLACED"

      - name: load_weight_exactly_capacity
        grounds:
          - calculations.load_weight
          - errors[ERR_LOAD_OVERWEIGHT]
        distinguishing_aspect: |
          Metric: absolute trailer pounds (different from the weight-ratio
          boundary), via POST /shipping-loads/{id}/lines (different endpoint).
          A line bringing total_weight_lbs to exactly trailer_capacity_lbs
          (10000) is accepted; one more pound is rejected.
        test_recipe:
          setup:
            - "Job with pieces X-P1 (5000), X-P2 (5000), X-P3 (1) all READY_TO_SHIP; load capacity 10000"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job X", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jx: $.data.id } }
            - { call: "POST /jobs/${jx}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jx}", drawing_number: "D-1" }, as: DETAILER, captures: { dx: $.data.id } }
            - { call: "POST /shop-drawings/${dx}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dx}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jx}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jx}", seq_number: 1 }, as: FOREMAN, captures: { sx: $.data.id } }
            - { call: "POST /erection-sequences/${sx}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jx}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mx: $.data.id } }
            - { call: "POST /mill-orders/${mx}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jx}", piece_mark: "X-P1", weight_lbs: 5000, drawing_id: "${dx}", sequence_id: "${sx}" }, as: FOREMAN, captures: { px1: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${jx}", piece_mark: "X-P2", weight_lbs: 5000, drawing_id: "${dx}", sequence_id: "${sx}" }, as: FOREMAN, captures: { px2: $.data.id } }
            - { call: "POST /pieces", payload: { job_id: "${jx}", piece_mark: "X-P3", weight_lbs: 1, drawing_id: "${dx}", sequence_id: "${sx}" }, as: FOREMAN, captures: { px3: $.data.id } }
            - { call: "POST /pieces/${px1}/start", as: FOREMAN }
            - { call: "POST /pieces/${px2}/start", as: FOREMAN }
            - { call: "POST /pieces/${px3}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jx}", kind: "FINAL_PIECE", piece_id: "${px1}" }, as: QC_INSPECTOR, captures: { ix1: $.data.id } }
            - { call: "POST /inspections/${ix1}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /inspections", payload: { job_id: "${jx}", kind: "FINAL_PIECE", piece_id: "${px2}" }, as: QC_INSPECTOR, captures: { ix2: $.data.id } }
            - { call: "POST /inspections/${ix2}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /inspections", payload: { job_id: "${jx}", kind: "FINAL_PIECE", piece_id: "${px3}" }, as: QC_INSPECTOR, captures: { ix3: $.data.id } }
            - { call: "POST /inspections/${ix3}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jx}", load_number: "L-X1", laydown_slot: "Y-X", delivery_date: "2026-09-01", trailer_capacity_lbs: 10000 }, as: FOREMAN, captures: { lx: $.data.id } }
            - { call: "POST /shipping-loads/${lx}/lines", payload: { piece_id: "${px1}" }, as: FOREMAN }
          trigger:
            - { call: "POST /shipping-loads/${lx}/lines", payload: { piece_id: "${px2}" }, as: FOREMAN, captures: { tot: $.data.total_weight_lbs } }
            - { call: "POST /shipping-loads/${lx}/lines", payload: { piece_id: "${px3}" }, as: FOREMAN, captures: { err: $.data.error_id } }
          assert:
            - "Adding X-P2 succeeds: total_weight_lbs == 10000 == trailer_capacity_lbs (inclusive)"
            - "Adding X-P3 fails with ERR_LOAD_OVERWEIGHT (10001 > 10000)"
            - "Piece.${px3}.load_id remains null"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: piece_start_requires_drawing_approved
        grounds:
          - state_machines.Piece.DETAILED_to_IN_SHOP
          - errors[ERR_DRAWING_NOT_APPROVED]
        distinguishing_aspect: |
          Pair Piece x ShopDrawing: piece start is rejected while its pinned
          drawing is merely SUBMITTED, and succeeds once the EOR approves that
          same drawing — nothing about the piece itself changes.
        test_recipe:
          setup:
            - "Job FABRICATING (drawing D-1 APPROVED unblocked it), sequence RELEASED, mill order RECEIVED; piece Y-P1 pinned to drawing D-2 which is SUBMITTED but not yet decided"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job Y", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jy: $.data.id } }
            - { call: "POST /jobs/${jy}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jy}", drawing_number: "D-1" }, as: DETAILER, captures: { dy1: $.data.id } }
            - { call: "POST /shop-drawings/${dy1}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dy1}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jy}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jy}", seq_number: 1 }, as: FOREMAN, captures: { sy: $.data.id } }
            - { call: "POST /erection-sequences/${sy}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jy}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { my: $.data.id } }
            - { call: "POST /mill-orders/${my}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jy}", drawing_number: "D-2" }, as: DETAILER, captures: { dy2: $.data.id } }
            - { call: "POST /shop-drawings/${dy2}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /pieces", payload: { job_id: "${jy}", piece_mark: "Y-P1", weight_lbs: 800, drawing_id: "${dy2}", sequence_id: "${sy}" }, as: FOREMAN, captures: { py1: $.data.id } }
          trigger:
            - { call: "POST /pieces/${py1}/start", as: FOREMAN, captures: { err: $.data.error_id } }
            - { call: "POST /shop-drawings/${dy2}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /pieces/${py1}/start", as: FOREMAN, captures: { st: $.data.status } }
          assert:
            - "First start fails with ERR_DRAWING_NOT_APPROVED (D-2 still SUBMITTED)"
            - "After EOR approves D-2, the identical start call returns status == IN_SHOP"

      - name: sequence_release_requires_job_fabricating
        grounds:
          - state_machines.ErectionSequence.PLANNED_to_RELEASED
          - errors[ERR_JOB_NOT_FABRICATING]
        distinguishing_aspect: |
          Pair ErectionSequence x Job (different pair than Piece x
          ShopDrawing): releasing a sequence is rejected while the job is only
          AWARDED and succeeds once the job reaches FABRICATING.
        test_recipe:
          setup:
            - "Job AWARDED (no drawing approved yet); sequence Z-1 PLANNED"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job Z", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jz: $.data.id } }
            - { call: "POST /jobs/${jz}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jz}", seq_number: 1 }, as: FOREMAN, captures: { sz: $.data.id } }
          trigger:
            - { call: "POST /erection-sequences/${sz}/release", as: FOREMAN, captures: { err: $.data.error_id } }
            - { call: "POST /shop-drawings", payload: { job_id: "${jz}", drawing_number: "D-1" }, as: DETAILER, captures: { dz: $.data.id } }
            - { call: "POST /shop-drawings/${dz}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dz}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jz}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences/${sz}/release", as: FOREMAN, captures: { st: $.data.status } }
          assert:
            - "First release fails with ERR_JOB_NOT_FABRICATING (job AWARDED)"
            - "After job reaches FABRICATING, the identical release returns status == RELEASED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics, different resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: welder_window_half_open_overlap
        grounds:
          - calculations.welder_window_overlap
          - errors[ERR_WELDER_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource: Welder; semantics: half-open datetime windows. A weld
          10:30-12:00 overlapping an existing 09:00-11:00 booking is rejected,
          while an adjacent weld starting exactly at 11:00 is allowed
          (window_end <= window_start means NO overlap).
        test_recipe:
          setup:
            - "Piece W-P1 IN_SHOP; qualified welder with an existing weld 2026-08-01 09:00-11:00"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job W2", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jw2: $.data.id } }
            - { call: "POST /jobs/${jw2}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jw2}", drawing_number: "D-1" }, as: DETAILER, captures: { dw2: $.data.id } }
            - { call: "POST /shop-drawings/${dw2}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dw2}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jw2}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jw2}", seq_number: 1 }, as: FOREMAN, captures: { sw2: $.data.id } }
            - { call: "POST /erection-sequences/${sw2}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jw2}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mw2: $.data.id } }
            - { call: "POST /mill-orders/${mw2}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jw2}", piece_mark: "W2-P1", weight_lbs: 800, drawing_id: "${dw2}", sequence_id: "${sw2}" }, as: FOREMAN, captures: { pw2: $.data.id } }
            - { call: "POST /pieces/${pw2}/start", as: FOREMAN }
            - { call: "POST /welders", payload: { full_name: "Weld Three", qual_process: "FCAW", qual_expires_on: "2027-01-01" }, as: FABRICATOR_ADMIN, captures: { ww2: $.data.id } }
            - { call: "POST /welds", payload: { piece_id: "${pw2}", welder_id: "${ww2}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }, as: WELDER, as_user_id: "${ww2}" }
          trigger:
            - { call: "POST /welds", payload: { piece_id: "${pw2}", welder_id: "${ww2}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T10:30:00Z", window_end: "2026-08-01T12:00:00Z" }, as: WELDER, as_user_id: "${ww2}", captures: { err: $.data.error_id } }
            - { call: "POST /welds", payload: { piece_id: "${pw2}", welder_id: "${ww2}", process: "FCAW", weld_date: "2026-08-01", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T12:00:00Z" }, as: WELDER, as_user_id: "${ww2}", captures: { st: $.data.status } }
          assert:
            - "Overlapping 10:30-12:00 weld fails with ERR_WELDER_DOUBLE_BOOKED"
            - "Adjacent 11:00-12:00 weld succeeds with status == WELDED (half-open arithmetic)"

      - name: laydown_slot_buffered_date_conflict
        grounds:
          - calculations.laydown_slot_conflict
          - errors[ERR_LAYDOWN_SLOT_CONFLICT]
        distinguishing_aspect: |
          Resource: ShippingLoad laydown slot (different resource than Welder);
          semantics: buffered CLOSED date difference — a delivery 2 days after
          an existing booking (diff <= LAYDOWN_BUFFER_DAYS) is rejected, while
          3 days after is allowed. Adjacency rule differs from the half-open
          welder-window rule.
        test_recipe:
          setup:
            - "Job exists; load #1 booked on laydown slot Y-7 delivering 2026-09-10"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job L", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jl: $.data.id } }
            - { call: "POST /shipping-loads", payload: { job_id: "${jl}", load_number: "L-1", laydown_slot: "Y-7", delivery_date: "2026-09-10", trailer_capacity_lbs: 40000 }, as: FOREMAN, captures: { ll1: $.data.id } }
          trigger:
            - { call: "POST /shipping-loads", payload: { job_id: "${jl}", load_number: "L-2", laydown_slot: "Y-7", delivery_date: "2026-09-12", trailer_capacity_lbs: 40000 }, as: FOREMAN, captures: { err: $.data.error_id } }
            - { call: "POST /shipping-loads", payload: { job_id: "${jl}", load_number: "L-3", laydown_slot: "Y-7", delivery_date: "2026-09-13", trailer_capacity_lbs: 40000 }, as: FOREMAN, captures: { st: $.data.status } }
          assert:
            - "Delivery 2026-09-12 (2-day diff) fails with ERR_LAYDOWN_SLOT_CONFLICT (buffered closed semantics)"
            - "Delivery 2026-09-13 (3-day diff) succeeds with status == STAGING"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: load_line_add_remove_weight_invariant
        grounds:
          - calculations.load_weight
          - state_machines.ShippingLoad.STAGING_to_LOADING
          - state_machines.ShippingLoad.LOADING_to_STAGING
        distinguishing_aspect: |
          Conserved quantity: weight (lbs). Adding a 5000-lb piece to a load
          then removing it restores total_weight_lbs == 0 and flips the load
          LOADING -> STAGING; the piece's load_id returns to null. No drift in
          the load_weight invariant total == sum(member weights).
        test_recipe:
          setup:
            - "Piece I-P1 (5000 lbs) READY_TO_SHIP; empty load L-I1 (STAGING, capacity 20000)"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job I", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { ji: $.data.id } }
            - { call: "POST /jobs/${ji}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${ji}", drawing_number: "D-1" }, as: DETAILER, captures: { di: $.data.id } }
            - { call: "POST /shop-drawings/${di}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${di}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${ji}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${ji}", seq_number: 1 }, as: FOREMAN, captures: { si: $.data.id } }
            - { call: "POST /erection-sequences/${si}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${ji}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mi: $.data.id } }
            - { call: "POST /mill-orders/${mi}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${ji}", piece_mark: "I-P1", weight_lbs: 5000, drawing_id: "${di}", sequence_id: "${si}" }, as: FOREMAN, captures: { pi1: $.data.id } }
            - { call: "POST /pieces/${pi1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${ji}", kind: "FINAL_PIECE", piece_id: "${pi1}" }, as: QC_INSPECTOR, captures: { ii: $.data.id } }
            - { call: "POST /inspections/${ii}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${ji}", load_number: "L-I1", laydown_slot: "Y-I", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { li: $.data.id } }
          trigger:
            - { call: "POST /shipping-loads/${li}/lines", payload: { piece_id: "${pi1}" }, as: FOREMAN, captures: { w_after_add: $.data.total_weight_lbs, st_after_add: $.data.status } }
            - { call: "DELETE /shipping-loads/${li}/lines/${pi1}", as: FOREMAN, captures: { w_after_del: $.data.total_weight_lbs, st_after_del: $.data.status } }
            - { call: "GET /pieces/${pi1}", as: FOREMAN, captures: { p_load: $.data.load_id } }
          assert:
            - "After add: total_weight_lbs == 5000 and status == LOADING"
            - "After remove: total_weight_lbs == 0 and status == STAGING (exact compensation)"
            - "Piece.${pi1}.load_id == null (membership invariant restored)"

      - name: billing_approve_void_currency_invariant
        grounds:
          - calculations.net_progress_billing
          - state_machines.ProgressBilling.SUBMITTED_to_APPROVED
          - state_machines.ProgressBilling.APPROVED_to_VOIDED
          - entities.Job.fields.billed_to_date_cents
        distinguishing_aspect: |
          Conserved quantity: currency (cents) — different from the load-weight
          invariant. Approving a billing books net_due 9500000 + retainage
          500000 onto the job; voiding that same billing returns
          billed_to_date_cents and retainage_held_cents to exactly 0.
        test_recipe:
          setup:
            - "Job J (contract 10000000, WEIGHT basis) with its single 1000-lb piece ERECTED -> pct 1.0000; one billing created, submitted"
          setup_api_calls:
            - { call: "POST /jobs", payload: { name: "Job J", contract_value_cents: 10000000, billing_basis: "WEIGHT" }, as: FABRICATOR_ADMIN, captures: { jj: $.data.id } }
            - { call: "POST /jobs/${jj}/award", as: FABRICATOR_ADMIN }
            - { call: "POST /shop-drawings", payload: { job_id: "${jj}", drawing_number: "D-1" }, as: DETAILER, captures: { dj: $.data.id } }
            - { call: "POST /shop-drawings/${dj}/submit", as: DETAILER, as_user_id: "det-1" }
            - { call: "POST /shop-drawings/${dj}/decide", payload: { decision: "APPROVE" }, as: EOR, as_user_id: "eor-1" }
            - { call: "POST /jobs/${jj}/start-fabrication", as: FABRICATOR_ADMIN }
            - { call: "POST /erection-sequences", payload: { job_id: "${jj}", seq_number: 1 }, as: FOREMAN, captures: { sj: $.data.id } }
            - { call: "POST /erection-sequences/${sj}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jj}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mj: $.data.id } }
            - { call: "POST /mill-orders/${mj}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jj}", piece_mark: "J-P1", weight_lbs: 1000, drawing_id: "${dj}", sequence_id: "${sj}" }, as: FOREMAN, captures: { pj1: $.data.id } }
            - { call: "POST /pieces/${pj1}/start", as: FOREMAN }
            - { call: "POST /inspections", payload: { job_id: "${jj}", kind: "FINAL_PIECE", piece_id: "${pj1}" }, as: QC_INSPECTOR, captures: { ij: $.data.id } }
            - { call: "POST /inspections/${ij}/submit", payload: { outcome: "PASSED" }, as: QC_INSPECTOR, as_user_id: "qc-1" }
            - { call: "POST /shipping-loads", payload: { job_id: "${jj}", load_number: "L-J1", laydown_slot: "Y-J", delivery_date: "2026-09-01", trailer_capacity_lbs: 20000 }, as: FOREMAN, captures: { lj: $.data.id } }
            - { call: "POST /shipping-loads/${lj}/lines", payload: { piece_id: "${pj1}" }, as: FOREMAN }
            - { call: "POST /shipping-loads/${lj}/ship", as: FOREMAN }
            - { call: "POST /pieces/${pj1}/erect", as: FOREMAN }
            - { call: "GET /jobs/${jj}", as: FABRICATOR_ADMIN, captures: { jjv: $.data.version } }
            - { call: "POST /progress-billings", payload: { job_id: "${jj}", period_label: "2026-08", expected_job_version: "${jjv}" }, as: FABRICATOR_ADMIN, captures: { bj: $.data.id, bj_net: $.data.net_due_cents } }
            - { call: "POST /progress-billings/${bj}/submit", as: FABRICATOR_ADMIN }
          trigger:
            - { call: "POST /progress-billings/${bj}/approve", as: GC_PM }
            - { call: "GET /jobs/${jj}", as: FABRICATOR_ADMIN, captures: { billed_1: $.data.billed_to_date_cents, held_1: $.data.retainage_held_cents } }
            - { call: "POST /progress-billings/${bj}/void", as: GC_PM }
            - { call: "GET /jobs/${jj}", as: FABRICATOR_ADMIN, captures: { billed_2: $.data.billed_to_date_cents, held_2: $.data.retainage_held_cents } }
          assert:
            - "After approve: billed_to_date_cents == 9500000 and retainage_held_cents == 500000 (earned 10000000 at pct 1.0000, 5% retainage)"
            - "After void: billed_to_date_cents == 0 and retainage_held_cents == 0 (exact reversal, no drift)"
            - "ProgressBilling.${bj}.status == VOIDED"
