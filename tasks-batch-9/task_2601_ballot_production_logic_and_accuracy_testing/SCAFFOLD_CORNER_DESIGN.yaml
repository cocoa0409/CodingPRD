          - state_machines.BallotStyle.initial_state
          - state_machines.TabulatorUnit.program_status.initial_state
          - state_machines.TabulatorUnit.custody_status.initial_state
        distinguishing_aspect: "Every row created during the SETUP phase lands on the §1.2 initial state and nowhere else - Election SETUP, Contest DRAFT, Candidate FILED, BallotStyle DRAFT, and TabulatorUnit on BOTH axes at once (program_status UNPROGRAMMED and custody_status IN_VAULT), which is the only entity with two independent initial states."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z; empty store."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
          trigger:
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id, el_status: $.data.status }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id, ct_status: $.data.status }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id, cand_status: $.data.status }
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id, st_status: $.data.status }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
