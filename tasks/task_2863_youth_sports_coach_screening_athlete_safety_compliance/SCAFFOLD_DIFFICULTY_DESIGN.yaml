      - name: case_administrative_closure_and_routed_closure_have_disjoint_side_effect_sets
        grounds:
          - state_machines.Case.INTAKE_REVIEW_to_CLOSED_ADMINISTRATIVE
          - state_machines.Case.INTAKE_REVIEW_to_ROUTED
          - state_machines.Case.ROUTED_to_CLOSED_UNSUBSTANTIATED
          - state_machines.InterimMeasure.ACTIVE_to_LIFTED
          - entities.InvestigatingBody.fields.open_case_count
          - validations[priority=25]
        distinguishing_aspect: |
          INTAKE_REVIEW forks three ways and the two closure branches carry disjoint side-effect
          sets: closing from INTAKE_REVIEW with closure_reason DUPLICATE_REPORT and no outcome
          leaves InvestigatingBody.open_case_count at 1, leaves the ACTIVE measure ACTIVE and
          leaves the member SUSPENDED, whereas closing the ROUTED case with outcome
          UNSUBSTANTIATED decrements open_case_count to 0, lifts the measure and restores the
          member to membership_status ACTIVE with contact_eligibility ELIGIBLE.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000 and course SS101 published"
            - "member m_br is fully compliant: screening CLEARED, training CURRENT, membership ACTIVE, contact_eligibility ELIGIBLE"
            - "m_br holds one CoachAssignment at the club in status ACTIVE"
            - "investigating body body_br has scope_categories [PHYSICAL_ABUSE, POLICY_VIOLATION], max_open_cases 5, intake_status ACCEPTING"
            - "case_routed (allegation PHYSICAL_ABUSE) is in status ROUTED to body_br, so body_br.open_case_count == 1"
            - "one ACTIVE TEMPORARY_SUSPENSION InterimMeasure on m_br hangs off case_routed, so m_br is membership_status SUSPENDED, contact_eligibility RESTRICTED and the CoachAssignment is SUSPENDED"
            - "case_admin (allegation POLICY_VIOLATION) is a second report on m_br still in status INTAKE_REVIEW"
