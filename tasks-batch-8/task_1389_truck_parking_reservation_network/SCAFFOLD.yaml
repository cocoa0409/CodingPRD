# =============================================================================
# Task 1389: Truck Parking Reservation Network — seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  Truck Parking Reservation Network (truck parking reservation provider): parking inventory & real-time availability, reservation vs first-come pricing, no-show & overstay enforcement, amenity bundling (shower/fuel) & loyalty, driver hours-of-service driven demand peaks, security & lighting incident reporting, fleet account billing & driver authorization, dynamic pricing & capacity forecasting

domain_name: truck-parking-reservation-network
api_prefix: "/"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  target_level: expert_plus
  entity_count: 12
  endpoint_count: 56
  error_code_count: 31

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: base_nightly_rate_cents, type: integer, source: input, description: "Base price per night in cents before dynamic multipliers" }
      - { name: no_show_grace_minutes, type: integer, source: input, default: 60, description: "Minutes after checkin_open_at a BOOKED booking may still check in before no-show" }
      - { name: overstay_grace_minutes, type: integer, source: input, default: 30, description: "Minutes after checkout_due_at before a CHECKED_IN booking is marked OVERSTAY" }
      - { name: cancellation_free_window_hours, type: integer, source: input, default: 24, description: "Cancel at or before checkin_open_at minus this many hours is free" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | DEGRADED | ESCALATED; derived from open IncidentReports (see site_posture calc)" }
      - { name: ops_run_index, type: integer, source: system, description: "Monotonic counter, starts at 0, +1 per ops-run" }

  - name: Stall
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: stall_number, type: string, source: input, description: "Stall label, unique per site (ERR_DUPLICATE_STALL_NUMBER)" }
      - { name: stall_class, type: enum, source: input, description: "STANDARD | OVERSIZED" }
      - { name: is_reservable, type: boolean, source: input, description: "true = reserved pool (bookable ahead); false = first-come pool (walk-in only)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OUT_OF_SERVICE" }

  - name: RatePlan
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: tier2_pct, type: integer, source: input, default: 60, description: "Occupancy percent at which mult_mid starts (>=)" }
      - { name: tier3_pct, type: integer, source: input, default: 80, description: "Occupancy percent at which mult_high starts (>=)" }
      - { name: tier4_pct, type: integer, source: input, default: 95, description: "Occupancy percent at which mult_max starts (>=)" }
      - { name: mult_low, type: number, source: input, default: 0.9, description: "Multiplier when occupancy < tier2_pct" }
      - { name: mult_mid, type: number, source: input, default: 1.0, description: "Multiplier when tier2_pct <= occupancy < tier3_pct" }
      - { name: mult_high, type: number, source: input, default: 1.25, description: "Multiplier when tier3_pct <= occupancy < tier4_pct" }
      - { name: mult_max, type: number, source: input, default: 1.5, description: "Multiplier when occupancy >= tier4_pct" }
      - { name: peak_multiplier, type: number, source: input, default: 1.2, description: "Extra multiplier for nights whose arrival date weekday (UTC) is in peak_days (HOS restart demand)" }
      - { name: peak_days, type: array, source: input, default: ["FRI", "SAT"], description: "UTC weekday codes driving HOS demand peaks" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED | RETIRED; exactly one ACTIVE per site" }

  - name: AmenityProduct
    parent: Site
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; owning site" }
      - { name: code, type: enum, source: input, description: "SHOWER | FUEL | WIFI | POWER; unique per site" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: price_cents, type: integer, source: input, description: "List price per unit per night span" }
      - { name: nightly_capacity, type: integer, source: input, description: "Max units consumable per night at this site; null = uncapacitated", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: cdl_number, type: string, source: input, description: "Commercial driver license number, globally unique (ERR_VALIDATION on duplicate)" }
      - { name: full_name, type: string, source: input, description: "Driver name" }
      - { name: strike_events, type: array, source: system, description: "Append-only [{at, kind, booking_id}]; kind NO_SHOW (+1) or EVICTION (+2); used for trailing-window strike count" }
      - { name: strikes_90d, type: integer, source: computed, description: "Sum of strike weights with at >= clock - 90 days" }
      - { name: standing, type: enum, source: computed, description: "GOOD | PROBATION | SUSPENDED; >=3 strikes SUSPENDED, ==2 PROBATION, else GOOD" }
      - { name: settled_nights_90d, type: integer, source: computed, description: "Nights of bookings with billing_status PAID whose checked_out_at >= clock - 90 days" }
      - { name: loyalty_tier, type: enum, source: computed, description: "STANDARD | SILVER | GOLD | PLATINUM from settled_nights_90d (>=12 / >=30 / >=60)" }
      - { name: loyalty_points_balance, type: integer, source: computed, description: "10 pts per billed night earned on PAID, clawed back on WAIVED-after-PAID; may go negative" }

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Fleet company name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Max allowed projected exposure (balance + unbilled + new quote)" }
      - { name: payment_terms_days, type: integer, source: input, default: 30, description: "Days from period end to invoice due_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: auto_suspended, type: boolean, source: system, description: "true when current SUSPENDED was caused by the overdue-invoice cascade (restorable)", default: false }
      - { name: current_balance_cents, type: integer, source: computed, description: "Sum over invoices with status != WRITTEN_OFF of (net_cents - paid_cents)" }
      - { name: credit_cents, type: integer, source: computed, description: "Refunded credit from written-off paid invoices; informational, never negative" }

  - name: DriverAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; requesting driver" }
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; fleet that may be billed" }
      - { name: spend_cap_per_night_cents, type: integer, source: input, description: "Max parking+amenity net per night billable to fleet; null = uncapped", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | REVOKED | REJECTED" }
      - { name: auto_suspended, type: boolean, source: system, description: "true when SUSPENDED by fleet cascade; only such auths auto-restore to ACTIVE", default: false }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; must equal X-User-ID for Driver role" }
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: stall_id, type: string, source: system, description: "FK -> Stall.id; auto-assigned by selector unless valid stall_id supplied in input" }
      - { name: waitlist_entry_id, type: string, source: system, description: "FK -> WaitlistEntry.id; set only when created by promotion, else null", default: null }
      - { name: booking_kind, type: enum, source: input, description: "RESERVED | WALK_IN" }
      - { name: payment_mode, type: enum, source: input, description: "DRIVER_DIRECT | FLEET_BILL" }
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; required when payment_mode=FLEET_BILL, forbidden otherwise", default: null }
      - { name: arrival_date, type: string, source: input, description: "First night date, YYYY-MM-DD (UTC); WALK_IN must equal clock date" }
      - { name: night_count, type: integer, source: input, description: "Nights booked, 1..14 (ERR_WINDOW_TOO_LONG above 14)" }
      - { name: checkin_open_at, type: datetime, source: computed, description: "arrival_date 15:00:00Z" }
      - { name: checkout_due_at, type: datetime, source: computed, description: "(arrival_date + night_count) 11:00:00Z; extended by extend" }
      - { name: checked_in_at, type: datetime, source: system, description: "Actual check-in instant; null until check-in", default: null }
      - { name: checked_out_at, type: datetime, source: system, description: "Actual check-out instant; null until check-out", default: null }
      - { name: overstayed_at, type: datetime, source: system, description: "Instant the ops sweep marked OVERSTAY; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | OVERSTAY | CHECKED_OUT | NO_SHOW | CANCELLED | EVICTED" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | PARTIALLY_PAID | PAID | INVOICED | WAIVED; parallel dimension independent of status" }
      - { name: per_night_rates, type: array, source: system, description: "Pinned [{date, rate_cents}] per night at creation; extension nights appended at then-current rate" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional total at creation: parking net with loyalty tier at creation time, no amenities/fees" }
      - { name: parking_subtotal_cents, type: integer, source: computed, description: "Sum of per_night_rates at settlement" }
      - { name: amenity_net_cents, type: integer, source: computed, description: "Amenity lines after bundle discount at settlement" }
      - { name: discount_cents, type: integer, source: computed, description: "Loyalty discount on parking subtotal at settlement tier" }
      - { name: fee_cents, type: integer, source: computed, description: "Cancellation / no-show / overstay fees at settlement; never discounted" }
      - { name: final_total_cents, type: integer, source: computed, description: "Final settlement total; null until checkout or terminal-with-fee transition", default: null }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of posted payments (DRIVER_DIRECT) toward final_total_cents" }
      - { name: incident_escalated, type: boolean, source: system, description: "true once the overstay auto-incident has been created", default: false }

  - name: BookingAmenity
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; owning booking" }
      - { name: amenity_product_id, type: string, source: input, description: "FK -> AmenityProduct.id; must belong to booking's site" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units per night of the booking span; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: system, description: "Pinned AmenityProduct.price_cents at add time" }
      - { name: status, type: enum, source: system, description: "RESERVED | FULFILLED | CANCELLED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; must equal X-User-ID for Driver role" }
      - { name: arrival_date, type: string, source: input, description: "Desired first night YYYY-MM-DD" }
      - { name: night_count, type: integer, source: input, description: "Desired nights, 1..14" }
      - { name: stall_class, type: enum, source: input, description: "STANDARD | OVERSIZED" }
      - { name: payment_mode, type: enum, source: input, description: "DRIVER_DIRECT | FLEET_BILL; fleet re-authorized at accept" }
      - { name: fleet_account_id, type: string, source: input, description: "FK -> FleetAccount.id; required when payment_mode=FLEET_BILL", default: null }
      - { name: status, type: enum, source: system, description: "QUEUED | OFFERED | PROMOTED | EXPIRED | WITHDRAWN" }
      - { name: offered_stall_id, type: string, source: system, description: "FK -> Stall.id; stall pinned by current offer, null unless OFFERED", default: null }
      - { name: offer_expires_at, type: datetime, source: system, description: "offer instant + 30 minutes; null unless OFFERED", default: null }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id" }
      - { name: reporter_driver_id, type: string, source: input, description: "FK -> Driver.id; null when reported by SiteOperator", default: null }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; set on overstay auto-incidents, else null", default: null }
      - { name: category, type: enum, source: input, description: "SECURITY | LIGHTING | FACILITY" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text report" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | INVESTIGATING | RESOLVED | DISMISSED | REOPENED" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "X-User-ID of acknowledging operator; null until ACKNOWLEDGED", default: null }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of resolving operator; must differ from acknowledged_by_user_id", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Instant of latest RESOLVED transition; null until resolved", default: null }
      - { name: reopened_count, type: integer, source: system, description: "Number of RESOLVED -> REOPENED loops", default: 0 }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: fleet_account_id, type: string, source: system, description: "FK -> FleetAccount.id; billed fleet" }
      - { name: period, type: string, source: input, description: "Billing period YYYY-MM (calendar month)" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | OVERDUE | DISPUTED | WRITTEN_OFF" }
      - { name: gross_cents, type: integer, source: computed, description: "Sum of member bookings' final_total_cents (or fee_cents)" }
      - { name: discount_pct, type: integer, source: computed, description: "Volume tier on GROSS: >=500000 -> 2, >=2000000 -> 5, >=5000000 -> 8, else 0" }
      - { name: discount_cents, type: integer, source: computed, description: "round_half_up(gross_cents * discount_pct / 100)" }
      - { name: net_cents, type: integer, source: computed, description: "gross_cents - discount_cents" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of posted invoice payments" }
      - { name: due_date, type: string, source: computed, description: "Last day of period + payment_terms_days" }
      - { name: booking_ids, type: array, source: system, description: "Booking ids swept into this invoice" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Booking
    field: status
    initial_state: BOOKED
    terminal_states: [CHECKED_OUT, NO_SHOW, CANCELLED, EVICTED]
    note: "Parallel dimensions: status (lifecycle) x billing_status (UNBILLED | PARTIALLY_PAID | PAID | INVOICED | WAIVED) evolve independently. WALK_IN bookings enter directly at CHECKED_IN. Lifecycle-terminal bookings still move along billing_status (fees, invoicing, payment)."
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /bookings/{booking_id}/check-in"
        actor: Driver
        preconditions:
          - "booking.status == BOOKED"
          - "clock >= checkin_open_at (else ERR_CHECKIN_WINDOW_NOT_OPEN)"
          - "clock <= checkin_open_at + site.no_show_grace_minutes, inclusive boundary (else ERR_CHECKIN_GRACE_ELAPSED)"
          - "Stall referenced by booking.stall_id has status == ACTIVE (else ERR_STALL_OUT_OF_SERVICE)"
        side_effects:
          - "checked_in_at = clock"
          - "increments Booking.version by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (site ops-run: clock > checkin_open_at + no_show_grace_minutes)"
        actor: system
        preconditions: []
        side_effects:
          - "fee_cents = per_night_rates[0].rate_cents; final_total_cents = fee_cents; billing stays UNBILLED"
          - "stall released for [checkin_open_at, checkout_due_at); waitlist offer scan runs at the site"
          - "Driver strike_events += {at: clock, kind: NO_SHOW, booking_id} (weight 1); standing recomputed"
          - "if strikes_90d >= 3: Driver.standing -> SUSPENDED, then every other BOOKED booking of that driver with checkin_open_at > clock -> CANCELLED with fee_cents = 0 and billing_status = WAIVED, each releasing its stall and triggering a waitlist offer scan"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: Driver
        preconditions:
          - "booking.status == BOOKED"
        side_effects:
          - "if clock <= checkin_open_at - site.cancellation_free_window_hours (inclusive): fee_cents = 0, billing_status = WAIVED"
          - "else: fee_cents = round_half_up(0.5 * per_night_rates[0].rate_cents); final_total_cents = fee_cents; billing stays UNBILLED"
          - "stall released for the booking window; waitlist offer scan runs at the site"
      - from: BOOKED
        to: CANCELLED
        trigger: "system (fleet-overdue cascade, fleet close, driver-suspension cascade, stall OUT_OF_SERVICE with no reassignment)"
        actor: system
        preconditions: []
        side_effects:
          - "fee_cents = 0; final_total_cents = 0; billing_status = WAIVED (system cancellations never charge)"
          - "stall released for the booking window; waitlist offer scan runs at the site"
      - from: [CHECKED_IN, OVERSTAY]
        to: CHECKED_OUT
        trigger: "POST /bookings/{booking_id}/check-out"
        actor: Driver
        preconditions:
          - "booking.status in {CHECKED_IN, OVERSTAY}"
        side_effects:
          - "checked_out_at = clock"
          - "settlement: parking_subtotal from per_night_rates; loyalty discount re-evaluated at CURRENT loyalty_tier; amenity_net from non-CANCELLED lines with bundle discount; fee_cents = overstay penalty if OVERSTAY; final_total_cents computed (rounding per booking_settlement calc)"
          - "billing_status stays UNBILLED; stall released at clock; waitlist offer scan runs"
      - from: OVERSTAY
        to: EVICTED
        trigger: "POST /bookings/{booking_id}/check-out with force=true"
        actor: SiteOperator
        preconditions:
          - "booking.status == OVERSTAY"
        side_effects:
          - "checked_out_at = clock; settlement identical to CHECKED_OUT including full overstay penalty"
          - "Driver strike_events += {at: clock, kind: EVICTION, booking_id} (weight 2); standing recomputed; driver-suspension cascade applies if strikes_90d >= 3"
          - "stall released; waitlist offer scan runs"
      - from: CHECKED_IN
        to: OVERSTAY
        trigger: "system (site ops-run: clock > checkout_due_at + overstay_grace_minutes, strict >)"
        actor: system
        preconditions: []
        side_effects:
          - "overstayed_at = clock"
          - "if clock > checkout_due_at + overstay_grace_minutes + 4 hours and incident_escalated == false: auto-create IncidentReport(category=SECURITY, severity=HIGH, booking_id=this, reporter_driver_id=null, status=OPEN); incident_escalated = true; site posture recomputed (HIGH alone does not escalate)"
      - from: BOOKED
        to: BOOKED
        trigger: "POST /bookings/{booking_id}/extend (self-transition mutating the window)"
        actor: Driver
        preconditions:
          - "booking.status == BOOKED"
          - "stall free for the extension window (else ERR_EXTENSION_CONFLICT)"
          - "expected_booking_version == Booking.version (else ERR_STALE_VERSION)"
        side_effects:
          - "night_count += added_nights; checkout_due_at += added_nights days"
          - "extension nights priced at CURRENT dynamic rate and appended to per_night_rates; quoted_total_cents recomputed"
          - "increments Booking.version by 1"

  - entity: Booking
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [PAID, WAIVED]
    note: "Parallel to status. FLEET_BILL: UNBILLED -> INVOICED -> PAID (or WAIVED). DRIVER_DIRECT: UNBILLED -> PARTIALLY_PAID -> PAID (or WAIVED on free cancellation)."
    transitions:
      - from: UNBILLED
        to: PARTIALLY_PAID
        trigger: "POST /bookings/{booking_id}/payments with amount_cents < remaining"
        actor: Driver
        preconditions: ["payment_mode == DRIVER_DIRECT", "final_total_cents != null", "amount_cents < final_total_cents - paid_cents"]
        side_effects: ["paid_cents += amount_cents"]
      - from: [UNBILLED, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /bookings/{booking_id}/payments with amount_cents == remaining"
        actor: Driver
        preconditions: ["payment_mode == DRIVER_DIRECT", "final_total_cents != null", "amount_cents == final_total_cents - paid_cents (exact; > is ERR_OVERPAYMENT)"]
        side_effects:
          - "paid_cents = final_total_cents"
          - "Driver loyalty_points_balance += 10 * night_count; settled_nights_90d recomputed; loyalty_tier recomputed"
      - from: UNBILLED
        to: INVOICED
        trigger: "system (close-billing-period sweep of FLEET_BILL bookings)"
        actor: system
        preconditions: ["payment_mode == FLEET_BILL", "booking terminal with final_total_cents != null in the closed period"]
        side_effects: ["booking id appended to the new Invoice.booking_ids"]
      - from: INVOICED
        to: PAID
        trigger: "system (invoice fully paid)"
        actor: system
        preconditions: []
        side_effects: ["Driver loyalty_points_balance += 10 * night_count; settled_nights_90d and loyalty_tier recomputed"]
      - from: [UNBILLED, INVOICED, PAID]
        to: WAIVED
        trigger: "system (free cancellation, system cancellation, invoice written off)"
        actor: system
        preconditions: []
        side_effects:
          - "if previously PAID: Driver loyalty_points_balance -= 10 * night_count (clawback; balance may go negative)"

  - entity: DriverAuthorization
    field: status
    initial_state: PENDING
    terminal_states: [REVOKED, REJECTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /driver-authorizations/{id}/transition {to: ACTIVE}"
        actor: FleetManager
        preconditions: ["FleetAccount.status == ACTIVE (else ERR_FLEET_SUSPENDED)"]
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /driver-authorizations/{id}/transition {to: REJECTED}"
        actor: FleetManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /driver-authorizations/{id}/transition {to: SUSPENDED} (manual, auto_suspended=false) or system (fleet cascade, auto_suspended=true)"
        actor: "FleetManager or system"
        preconditions: []
        side_effects: ["cascade variant: every BOOKED booking of this driver with payment_mode=FLEET_BILL, fleet_account_id=this fleet, and checkin_open_at > clock -> CANCELLED (fee waived, billing WAIVED)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (fleet reactivation; only when auto_suspended == true) "
        actor: system
        preconditions: ["auto_suspended == true (manual suspensions never auto-restore)"]
        side_effects: ["auto_suspended = false"]
      - from: [ACTIVE, SUSPENDED, PENDING]
        to: REVOKED
        trigger: "POST /driver-authorizations/{id}/transition {to: REVOKED} or system (fleet closed)"
        actor: "FleetManager or system"
        preconditions: []
        side_effects: []

  - entity: WaitlistEntry
    field: status
    initial_state: QUEUED
    terminal_states: [PROMOTED, EXPIRED, WITHDRAWN]
    transitions:
      - from: QUEUED
        to: OFFERED
        trigger: "system (stall release at site: cancellation, no-show, checkout, eviction, reassignment failure)"
        actor: system
        preconditions:
          - "entry is the selector winner (waitlist_offer_selector calc): QUEUED, driver standing != SUSPENDED, freed stall covers [arrival 15:00, departure 11:00), stall_class matches"
        side_effects:
          - "offered_stall_id = freed stall; offer_expires_at = clock + 30 minutes"
      - from: OFFERED
        to: PROMOTED
        trigger: "POST /waitlist-entries/{entry_id}/accept"
        actor: Driver
        preconditions:
          - "entry.status == OFFERED and entry.driver_id == X-User-ID"
          - "clock <= offer_expires_at, inclusive boundary (else ERR_OFFER_EXPIRED)"
          - "Site.posture != ESCALATED (else ERR_SITE_ESCALATED)"
          - "Driver.standing != SUSPENDED (else ERR_DRIVER_SUSPENDED)"
          - "if payment_mode == FLEET_BILL: DriverAuthorization ACTIVE for (driver, fleet) and spend-cap / credit checks pass"
        side_effects:
          - "creates Booking(booking_kind=RESERVED, stall_id=offered_stall_id, waitlist_entry_id=this, window from entry, quoted at CURRENT dynamic rate) in BOOKED"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (site ops-run: clock > offer_expires_at, strict >)"
        actor: system
        preconditions: []
        side_effects: ["offered stall re-offered to next selector winner, if any"]
      - from: QUEUED
        to: WITHDRAWN
        trigger: "POST /waitlist-entries/{entry_id}/withdraw"
        actor: Driver
        preconditions: ["entry.status == QUEUED", "entry.driver_id == X-User-ID"]
        side_effects: []

  - entity: IncidentReport
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    note: "Cyclic: RESOLVED -> REOPENED -> INVESTIGATING -> RESOLVED may loop while the 72h reopen window holds."
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /incidents/{incident_id}/transition {to: ACKNOWLEDGED}"
        actor: SiteOperator
        preconditions: []
        side_effects: ["acknowledged_by_user_id = X-User-ID", "site posture recomputed"]
      - from: [ACKNOWLEDGED, REOPENED]
        to: INVESTIGATING
        trigger: "POST /incidents/{incident_id}/transition {to: INVESTIGATING}"
        actor: SiteOperator
        preconditions: []
        side_effects: ["site posture recomputed"]
      - from: INVESTIGATING
        to: RESOLVED
        trigger: "POST /incidents/{incident_id}/transition {to: RESOLVED}"
        actor: SiteOperator
        preconditions:
          - "X-User-ID != acknowledged_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["resolved_by_user_id = X-User-ID", "resolved_at = clock", "site posture recomputed"]
      - from: [OPEN, ACKNOWLEDGED, INVESTIGATING]
        to: DISMISSED
        trigger: "POST /incidents/{incident_id}/transition {to: DISMISSED}"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["site posture recomputed"]
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /incidents/{incident_id}/transition {to: REOPENED}"
        actor: SiteOperator
        preconditions: ["clock <= resolved_at + 72 hours, inclusive (else ERR_REOPEN_WINDOW_EXPIRED)"]
        side_effects: ["reopened_count += 1", "site posture recomputed"]

  - entity: RatePlan
    field: status
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /sites/{id}/rate-plans/{rate_plan_id}/transition {to: ACTIVE, expected_site_version}"
        actor: NetworkAdmin
        preconditions: ["expected_site_version == Site.version (else ERR_STALE_VERSION)"]
        side_effects:
          - "previously ACTIVE RatePlan on the same site -> SUPERSEDED"
          - "increments Site.version by 1"
      - from: [DRAFT, ACTIVE]
        to: RETIRED
        trigger: "POST /sites/{id}/rate-plans/{rate_plan_id}/transition {to: RETIRED}"
        actor: NetworkAdmin
        preconditions: ["if ACTIVE: another ACTIVE plan must remain impossible, so RETIRE of the ACTIVE plan is forbidden (ERR_INVALID_STATE) unless a replacement was activated first; only DRAFT/SUPERSEDED plans may retire"]
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another plan activated on the same site)"
        actor: system
        preconditions: []
        side_effects: ["existing bookings keep their pinned per_night_rates; only future quotes use the new plan"]

  - entity: FleetAccount
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (fleet ops-run finds any OVERDUE invoice) "
        actor: system
        preconditions: []
        side_effects:
          - "auto_suspended = true"
          - "every DriverAuthorization with fleet_account_id=this and status=ACTIVE -> SUSPENDED (auto_suspended=true); each such suspension cascades: the driver's future FLEET_BILL bookings on this fleet -> CANCELLED (fee waived, billing WAIVED), stalls released, waitlist scans run"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (fleet ops-run finds no invoice in {ISSUED, PARTIALLY_PAID, OVERDUE, DISPUTED} with a past-due or outstanding balance) and auto_suspended == true"
        actor: system
        preconditions: ["no OVERDUE invoices", "auto_suspended == true"]
        side_effects: ["auto_suspended = false", "DriverAuthorizations with auto_suspended=true -> ACTIVE"]
      - from: [ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /fleet-accounts/{fleet_account_id}/close"
        actor: NetworkAdmin
        preconditions: ["current_balance_cents == 0", "no invoice in {ISSUED, PARTIALLY_PAID, OVERDUE, DISPUTED}"]
        side_effects: ["all non-terminal DriverAuthorizations -> REVOKED"]

  - entity: Invoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /invoices/{invoice_id}/payments with amount_cents < net_cents - paid_cents"
        actor: FleetManager
        preconditions: ["invoice in {ISSUED, PARTIALLY_PAID, OVERDUE} (else ERR_INVOICE_NOT_PAYABLE)"]
        side_effects: ["paid_cents += amount_cents", "FleetAccount.current_balance_cents recomputed"]
      - from: [ISSUED, PARTIALLY_PAID, OVERDUE]
        to: PAID
        trigger: "POST /invoices/{invoice_id}/payments with amount_cents == net_cents - paid_cents"
        actor: FleetManager
        preconditions: ["amount_cents == net_cents - paid_cents (exact; > is ERR_OVERPAYMENT)"]
        side_effects:
          - "paid_cents = net_cents; FleetAccount.current_balance_cents recomputed"
          - "every booking in booking_ids: billing_status INVOICED -> PAID; each such flip credits Driver loyalty_points_balance += 10 * night_count and recomputes tier"
      - from: [ISSUED, PARTIALLY_PAID]
        to: OVERDUE
        trigger: "system (fleet ops-run: clock > due_date end-of-day UTC)"
        actor: system
        preconditions: []
        side_effects: ["triggers fleet-overdue cascade on FleetAccount (see FleetAccount ACTIVE -> SUSPENDED)"]
      - from: [ISSUED, PARTIALLY_PAID, OVERDUE, PAID]
        to: DISPUTED
        trigger: "POST /invoices/{invoice_id}/dispute"
        actor: FleetManager
        preconditions: ["fleet owns the invoice"]
        side_effects: []
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /invoices/{invoice_id}/resolve-dispute {outcome: UPHELD}"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["due_date unchanged (a past due_date becomes OVERDUE at the next fleet ops-run)"]
      - from: DISPUTED
        to: WRITTEN_OFF
        trigger: "POST /invoices/{invoice_id}/resolve-dispute {outcome: WAIVED} or POST /invoices/{invoice_id}/write-off (OVERDUE only)"
        actor: NetworkAdmin
        preconditions: ["write-off endpoint requires status == OVERDUE"]
        side_effects:
          - "every booking in booking_ids: billing_status -> WAIVED; bookings that were PAID claw back Driver loyalty_points_balance -= 10 * night_count"
          - "if paid_cents > 0: FleetAccount.credit_cents += paid_cents"
          - "FleetAccount.current_balance_cents recomputed (invoice excluded)"

  - entity: Stall
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "PATCH /sites/{site_id}/stalls/{stall_id} {status: OUT_OF_SERVICE}"
        actor: SiteOperator
        preconditions: []
        side_effects:
          - "every BOOKED booking on this stall whose check-in window has NOT opened yet (checkin_open_at > clock) is reassigned: eligible stalls = ACTIVE, same is_reservable and stall_class, free for the booking's whole window; winner = lowest stall_number (lexicographic ASC); booking.stall_id updated. BOOKED bookings whose window already opened keep the stall (check-in then fails ERR_STALL_OUT_OF_SERVICE)"
          - "if no eligible stall exists: booking -> CANCELLED (fee waived, billing WAIVED) and waitlist offer scan runs"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "PATCH /sites/{site_id}/stalls/{stall_id} {status: ACTIVE}"
        actor: SiteOperator
        preconditions: []
        side_effects: []

  - entity: AmenityProduct
    field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "PATCH /sites/{site_id}/amenity-products/{amenity_product_id} {status: DISCONTINUED}"
        actor: NetworkAdmin
        preconditions: []
        side_effects: ["existing BookingAmenity lines unaffected; new adds rejected with ERR_INVALID_STATE"]

  - entity: BookingAmenity
    field: status
    initial_state: RESERVED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: RESERVED
        to: FULFILLED
        trigger: "PATCH /booking-amenities/{amenity_line_id} {status: FULFILLED}"
        actor: SiteOperator
        preconditions: ["owning Booking.status == CHECKED_IN or OVERSTAY"]
        side_effects: []
      - from: RESERVED
        to: CANCELLED
        trigger: "DELETE /booking-amenities/{amenity_line_id}"
        actor: Driver
        preconditions: ["owning Booking.status in {BOOKED, CHECKED_IN}"]
        side_effects: ["releases nightly capacity consumption for every night of the booking span"]

  - entity: Site
    field: posture
    initial_state: NORMAL
    terminal_states: []
    note: "Derived, never set directly; recomputed on incident create/transition and on ops-run."
    transitions:
      - from: NORMAL
        to: ESCALATED
        trigger: "system (any IncidentReport at site with severity=CRITICAL in {OPEN, ACKNOWLEDGED, INVESTIGATING, REOPENED})"
        actor: system
        preconditions: []
        side_effects: ["blocks POST /bookings and waitlist accept (ERR_SITE_ESCALATED); existing bookings and check-ins unaffected"]
      - from: NORMAL
        to: DEGRADED
        trigger: "system (>= 3 LIGHTING incidents in {OPEN, ACKNOWLEDGED, INVESTIGATING, REOPENED} and no CRITICAL open)"
        actor: system
        preconditions: []
        side_effects: ["occupancy multiplier for new quotes capped at 1.00 (surge suppression)"]
      - from: [ESCALATED, DEGRADED]
        to: NORMAL
        trigger: "system (incident resolved/dismissed such that neither condition holds; re-evaluated on every incident mutation and ops-run)"
        actor: system
        preconditions: ["no CRITICAL in non-terminal set", "< 3 LIGHTING in non-terminal set"]
        side_effects: []
      - from: ESCALATED
        to: DEGRADED
        trigger: "system (CRITICAL cleared but >= 3 LIGHTING remain)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: rate-plan-activation-stale-site
    parent_entity: Site
    write_endpoint: "POST /sites/{id}/rate-plans/{rate_plan_id}/transition"
    occ_field: expected_site_version
    description: |
      Activating a rate plan supersedes the site's currently ACTIVE plan; a second
      activation request that still carries the Site.version observed before the
      first activation committed is stale and is rejected, because under the
      product semantics both activations would otherwise legitimately succeed
      (each simply supersedes the other).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: booking-extend-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{booking_id}/extend"
    occ_field: expected_booking_version
    description: |
      Extending a booking is valid whenever the stall is free for the extension
      window, so two sequential extensions based on the same observed
      Booking.version would both legitimately succeed; the one carrying the
      stale version is rejected to prevent blind window divergence.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: nightly_dynamic_rate
    trigger: "booking creation (per requested night), booking extension (per added night), waitlist promotion (per entry night)"
    algorithm: tiered_pricing
    formula: |
      plan = site's unique ACTIVE RatePlan
      For a night with arrival date d:
        occ_pct(d) = 100 * count(distinct stalls s: s.is_reservable == true, s.status == ACTIVE,
                                  exists booking b with b.stall_id == s, b.status in {BOOKED, CHECKED_IN, OVERSTAY},
                                  [b.checkin_open_at, b.checkout_due_at) overlaps [d 15:00Z, d+1 11:00Z))
                     / count(stalls s: s.is_reservable == true, s.status == ACTIVE)
        (the requesting booking itself is NOT yet counted; integer floor division is FORBIDDEN — keep exact rational until pct compare)
        occ_mult = plan.mult_low  if occ_pct(d) <  plan.tier2_pct
                   plan.mult_mid  if plan.tier2_pct <= occ_pct(d) < plan.tier3_pct
                   plan.mult_high if plan.tier3_pct <= occ_pct(d) < plan.tier4_pct
                   plan.mult_max  if occ_pct(d) >= plan.tier4_pct
        (tier boundaries are INCLUSIVE on the left: >= fires at exactly the tier pct)
        if site.posture == DEGRADED: occ_mult = min(occ_mult, 1.00)
        peak_mult = plan.peak_multiplier if weekday_utc(d) in plan.peak_days else 1.0
        night_rate_cents(d) = round_half_up(site.base_nightly_rate_cents * occ_mult * peak_mult)   # integer cents
    input_set: "bookings in {BOOKED, CHECKED_IN, OVERSTAY} overlapping the night's occupancy interval; terminal bookings excluded"
    constants:
      TIER2_PCT: 60
      TIER3_PCT: 80
      TIER4_PCT: 95
      MULT_LOW: 0.9
      MULT_MID: 1.0
      MULT_HIGH: 1.25
      MULT_MAX: 1.5
      PEAK_MULTIPLIER: 1.2
      PEAK_DAYS: [FRI, SAT]
    precision: "integer cents per night, round_half_up applied per night BEFORE any summation"

  - name: booking_settlement
    trigger: "check-out (normal or forced), no-show sweep, cancellation"
    algorithm: tiered_pricing
    formula: |
      EVALUATION AND ROUNDING ORDER IS PINNED (nested rounding, per-line-then-sum):
      1. parking_subtotal_cents = sum of per_night_rates[].rate_cents (each element already rounded at creation/extension)
      2. loyalty_pct = 15 if driver.loyalty_tier == PLATINUM else 10 if GOLD else 5 if SILVER else 0
         (tier evaluated at SETTLEMENT time, which may differ from the tier used in quoted_total_cents)
         WALK_IN bookings: loyalty_pct = 0 always (flat rate, no discounts)
      3. discount_cents = round_half_up(parking_subtotal_cents * loyalty_pct / 100)
         parking_net_cents = parking_subtotal_cents - discount_cents
      4. amenity_subtotal_cents = sum over BookingAmenity lines with status in {RESERVED, FULFILLED} of unit_price_cents * quantity * night_count
         (CANCELLED lines excluded)
      5. bundle discount: if count(distinct AmenityProduct.code among lines in step 4) >= 2:
           amenity_discount_cents = round_half_up(amenity_subtotal_cents * 10 / 100)
         else 0. WALK_IN: amenity_discount_cents = 0 always.
         amenity_net_cents = amenity_subtotal_cents - amenity_discount_cents
      6. fee_cents = overstay_penalty (see overstay_penalty) if status was OVERSTAY, else the cancellation/no-show fee, else 0; fees are NEVER discounted
      7. final_total_cents = parking_net_cents + amenity_net_cents + fee_cents
    input_set: "the booking's pinned per_night_rates, its non-CANCELLED amenity lines, driver loyalty state at settlement"
    precision: "integer cents; round_half_up exactly at steps 3 and 5; per-night rates never re-rounded"
    variants:
      - name: provisional_quote
        when: "booking creation / extension"
        difference: "quoted_total_cents = parking subtotal minus loyalty discount at CREATION-time tier, with NO amenity and NO fee components; diverges from final whenever tier, amenities, or fees change between creation and settlement"
      - name: final_settlement
        when: "check-out / no-show / cancellation"
        difference: "re-evaluates loyalty tier at settlement, adds amenity_net and fees; the two variants therefore produce different totals for identical parking input whenever the driver's tier moved or lines/fees exist"

  - name: overstay_penalty
    trigger: "settlement of an OVERSTAY booking (check-out or force check-out)"
    algorithm: threshold
    formula: |
      minutes_past = (checked_out_at - (checkout_due_at + site.overstay_grace_minutes)) in whole minutes, floor 0
      billable_hours = ceil(minutes_past / 60)        # each STARTED hour bills; 0 minutes -> 0 hours
      hourly_cents = round_half_up(1.5 * per_night_rates[LAST].rate_cents / HOURLY_DIVISOR)
      overstay_penalty_cents = billable_hours * hourly_cents
    constants:
      HOURLY_DIVISOR: 20
      OVERSTAY_RATE_MULT: 1.5
      ESCALATION_HOURS: 4
    precision: "integer cents; hourly_cents rounded once, then multiplied"

  - name: cancellation_fee
    trigger: "POST /bookings/{id}/cancel on a BOOKED booking"
    algorithm: threshold
    formula: |
      free if clock <= checkin_open_at - site.cancellation_free_window_hours * 3600s   # INCLUSIVE boundary
      else fee_cents = round_half_up(0.5 * per_night_rates[0].rate_cents)
    precision: "integer cents, round_half_up"

  - name: no_show_fee
    trigger: "site ops-run no-show sweep"
    algorithm: threshold
    formula: |
      no-show when clock > checkin_open_at + site.no_show_grace_minutes (STRICT >; at exactly the boundary the booking remains check-in-able)
      fee_cents = per_night_rates[0].rate_cents   # 100% of first night, never discounted
    precision: "integer cents"

  - name: demand_forecast
    trigger: "GET /sites/{site_id}/forecast?date=d"
    algorithm: forward_looking
    formula: |
      total_stalls = count(stalls with status == ACTIVE)   # both pools
      confirmed_occupied = count(distinct stalls with booking in {BOOKED, CHECKED_IN, OVERSTAY} whose occupancy interval covers night d)
      confirmed_occupancy_pct = round_half_up(100 * confirmed_occupied / total_stalls, 2 decimals)
      queued = count(WaitlistEntry status==QUEUED, site, arrival window covers night d)
      offered = count(WaitlistEntry status==OFFERED, site, arrival window covers night d)
      committed_weighted_demand = confirmed_occupied + 0.5 * queued + 0.25 * offered
      committed_occupancy_pct = round_half_up(100 * committed_weighted_demand / total_stalls, 2 decimals)
    input_set: "bookings in {BOOKED, CHECKED_IN, OVERSTAY}; waitlist entries in {QUEUED, OFFERED}; WITHDRAWN/EXPIRED/PROMOTED excluded (PROMOTED already materialized as a booking)"
    precision: "percent with 2 decimals, round_half_up"
    variants:
      - name: confirmed_only
        when: "conservative capacity planning"
        difference: "uses only materialized bookings; ignores waitlist demand entirely"
      - name: committed_weighted
        when: "revenue forecasting"
        difference: "adds 0.5 per QUEUED and 0.25 per OFFERED waitlist entry; strictly greater whenever any waitlist demand exists for the night"

  - name: loyalty_tier_eval
    trigger: "booking creation (quote), settlement (final), driver read"
    algorithm: threshold
    formula: |
      settled_nights_90d = sum of night_count over bookings with billing_status == PAID
                           and checked_out_at >= clock - 90 days (inclusive)
      tier = PLATINUM if settled_nights_90d >= 60
             GOLD     if settled_nights_90d >= 30
             SILVER   if settled_nights_90d >= 12
             STANDARD otherwise      # tier boundaries INCLUSIVE (>=)
    constants: { SILVER_AT: 12, GOLD_AT: 30, PLATINUM_AT: 60, SILVER_PCT: 5, GOLD_PCT: 10, PLATINUM_PCT: 15 }
    precision: "integer night counts"

  - name: driver_standing_eval
    trigger: "strike events, booking creation, waitlist accept, ops-run"
    algorithm: threshold
    formula: |
      strikes_90d = sum of weights of strike_events with at >= clock - 90 days (NO_SHOW=1, EVICTION=2)
      standing = SUSPENDED if strikes_90d >= 3 else PROBATION if strikes_90d == 2 else GOOD
    precision: "integer strikes"

  - name: shower_capacity_check
    trigger: "POST /bookings/{booking_id}/amenities for a capacitated product"
    algorithm: aggregation
    formula: |
      For each night d in the booking's [arrival_date, arrival_date + night_count) span:
        consumed(d) = sum of quantity over BookingAmenity lines with status in {RESERVED, FULFILLED}
                      whose product == this product AND whose booking's night span covers d
                      AND whose booking status NOT in {CANCELLED, NO_SHOW}
      require consumed(d) + new_quantity <= product.nightly_capacity for EVERY night d   # boundary: exactly == capacity is allowed
    precision: "integer units per night bucket (night-granular; NOT interval arithmetic)"

  - name: stall_assignment_selector
    trigger: "RESERVED booking creation, WALK_IN creation, stall OUT_OF_SERVICE reassignment, waitlist promotion"
    algorithm: constraint_propagation
    formula: |
      eligible = stalls of the site with status == ACTIVE,
                 is_reservable == (booking_kind == RESERVED),
                 stall_class == requested class (default STANDARD),
                 and NO booking b with b.stall_id == stall, b.status in {BOOKED, CHECKED_IN, OVERSTAY}
                 whose [b.checkin_open_at, b.checkout_due_at) overlaps the requested [open, due)   # half-open intervals; the 11:00 -> 15:00 turnover gap makes same-day back-to-back legal
      winner = eligible stall with smallest stall_number (lexicographic ASC)
      empty eligible set -> RESERVED creation fails ERR_SITE_CAPACITY_FULL; WALK_IN fails ERR_SITE_CAPACITY_FULL; reassignment cancels the booking (fee waived)
    precision: "deterministic; stall_number is unique per site so no further tie-break exists; created_at is the fallback never needed"

  - name: waitlist_offer_selector
    trigger: "any stall release at a site (cancellation, no-show, checkout, eviction, reassignment failure)"
    algorithm: constraint_propagation
    formula: |
      candidates = WaitlistEntry with status == QUEUED, site == this site,
                   driver standing != SUSPENDED,
                   stall_class == freed stall's class,
                   and the freed stall is free for the entry's whole [arrival 15:00Z, departure 11:00Z) window
      ranking: loyalty_tier rank DESC (PLATINUM > GOLD > SILVER > STANDARD), then WaitlistEntry.created_at ASC
      winner -> OFFERED (offered_stall_id = freed stall, offer_expires_at = clock + 30 minutes)
      empty candidates -> stall returns to general reservable inventory (no error)
    precision: "deterministic; created_at ASC is the only tie-break; id MUST NOT be used"

  - name: fleet_credit_check
    trigger: "booking creation or waitlist accept with payment_mode == FLEET_BILL"
    algorithm: aggregation
    formula: |
      projected_exposure = fleet.current_balance_cents
                         + sum over the fleet's FLEET_BILL bookings with billing_status == UNBILLED of (final_total_cents if set else quoted_total_cents)
                         + this booking's quoted_total_cents
      require projected_exposure <= fleet.credit_limit_cents    # boundary: exactly == limit is ALLOWED
      spend cap (DriverAuthorization.spend_cap_per_night_cents, when not null):
        require round_half_up(quoted_total_cents / night_count) <= spend_cap_per_night_cents   # ERR_SPEND_CAP_EXCEEDED
    precision: "integer cents"

  - name: fleet_invoice_totals
    trigger: "POST /fleet-accounts/{fleet_account_id}/close-billing-period"
    algorithm: waterfall_allocation
    formula: |
      EVALUATION ORDER PINNED (gross -> tier -> discount -> net; the tier is keyed on GROSS, never on net):
      members = FLEET_BILL bookings of this fleet with billing_status == UNBILLED, final_total_cents != null,
                and terminal/settlement instant inside the period (calendar month)
      gross_cents = sum of members' final_total_cents
      discount_pct = 8 if gross_cents >= 5000000 else 5 if gross_cents >= 2000000 else 2 if gross_cents >= 500000 else 0
      discount_cents = round_half_up(gross_cents * discount_pct / 100)
      net_cents = gross_cents - discount_cents
      due_date = last_day_of(period) + fleet.payment_terms_days
      members -> billing_status = INVOICED; FleetAccount.current_balance_cents recomputed
      empty member set -> no invoice created (200 with data null is FORBIDDEN; respond ERR_VALIDATION)
    constants: { TIER1_GROSS: 500000, TIER1_PCT: 2, TIER2_GROSS: 2000000, TIER2_PCT: 5, TIER3_GROSS: 5000000, TIER3_PCT: 8 }
    precision: "integer cents, round_half_up"

  - name: site_posture
    trigger: "incident creation, incident transition, site ops-run"
    algorithm: aggregation
    formula: |
      non_terminal = incidents at site with status in {OPEN, ACKNOWLEDGED, INVESTIGATING, REOPENED}
      posture = ESCALATED if any non_terminal has severity == CRITICAL
                DEGRADED  if count(non_terminal with category == LIGHTING) >= 3
                NORMAL    otherwise
    precision: "integer counts; boundary >= 3 INCLUSIVE"

  - name: loyalty_points_ledger
    trigger: "booking billing_status -> PAID (earn), booking billing_status PAID -> WAIVED (clawback)"
    algorithm: aggregation
    formula: |
      earn: loyalty_points_balance += 10 * booking.night_count
      clawback: loyalty_points_balance -= 10 * booking.night_count   # balance may go negative; no floor
      INVARIANT: balance == sum over bookings billing-PAID(10*night_count) - sum over bookings WAIVED-after-PAID(10*night_count)
    precision: "integer points"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first match wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header present and a declared role; X-User-ID present for entity_backed roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for endpoint AND ownership: Driver may act only where driver_id == X-User-ID; FleetManager only on own fleet_account_id == X-User-ID (authored auths, fleet invoices, fleet read)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist, validated left-to-right; nested resources must belong to the parent in the path (stall to site, rate plan to site, amenity product to site)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "Request body well-formed: required fields present, enum members valid, value types correct (temporal VALUES like unparseable dates or night_count < 1 are priority 8, not shape errors)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all mutations" }
  - { priority: 5, category: state, check: "Target resource's own state machine permits the transition (e.g., check-in only from BOOKED, cancel only from BOOKED, accept only from OFFERED, dispute only from payable/PAID set)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action/transition endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_site_version == Site.version on rate-plan activation; expected_booking_version == Booking.version on extend", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /sites/{id}/rate-plans/{rate_plan_id}/transition", "POST /bookings/{booking_id}/extend"] }
  - { priority: 7, category: business_safety, check: "Site.posture != ESCALATED for new inventory commitments", error_id: ERR_SITE_ESCALATED, http_status: 409, applies_to: ["POST /bookings", "POST /waitlist-entries/{entry_id}/accept"] }
  - { priority: 8, category: business_temporal, check: "RESERVED arrival_date >= clock date (else ERR_WINDOW_IN_PAST); WALK_IN arrival_date == clock date (else ERR_WALKIN_NOT_TODAY); night_count <= 14 (else ERR_WINDOW_TOO_LONG); arrival_date parseable and night_count >= 1 (else ERR_WINDOW_INVALID)", error_id: ERR_WINDOW_IN_PAST, http_status: 422, applies_to: ["POST /bookings", "POST /waitlist-entries"] }
  - { priority: 9, category: business_temporal, check: "Check-in moment inside [checkin_open_at, checkin_open_at + no_show_grace_minutes] inclusive: before -> ERR_CHECKIN_WINDOW_NOT_OPEN; after -> ERR_CHECKIN_GRACE_ELAPSED", error_id: ERR_CHECKIN_WINDOW_NOT_OPEN, http_status: 409, applies_to: ["POST /bookings/{booking_id}/check-in"] }
  - { priority: 10, category: business_temporal, check: "Interval conflicts: requested window overlaps another non-terminal booking on the same stall (ERR_STALL_WINDOW_CONFLICT); extension window occupied (ERR_EXTENSION_CONFLICT); same driver holds an overlapping non-terminal booking (ERR_DRIVER_WINDOW_CONFLICT)", error_id: ERR_STALL_WINDOW_CONFLICT, http_status: 409, applies_to: ["POST /bookings", "POST /bookings/{booking_id}/extend", "POST /waitlist-entries/{entry_id}/accept"] }
  - { priority: 11, category: business_temporal, check: "Incident reopen only when clock <= resolved_at + 72h inclusive", error_id: ERR_REOPEN_WINDOW_EXPIRED, http_status: 409, applies_to: ["POST /incidents/{incident_id}/transition"] }
  - { priority: 12, category: business_referential, check: "Driver.standing != SUSPENDED for new commitments", error_id: ERR_DRIVER_SUSPENDED, http_status: 409, applies_to: ["POST /bookings", "POST /waitlist-entries", "POST /waitlist-entries/{entry_id}/accept"] }
  - { priority: 13, category: business_referential, check: "payment_mode == FLEET_BILL requires a DriverAuthorization in status ACTIVE for (driver_id, fleet_account_id)", error_id: ERR_DRIVER_NOT_AUTHORIZED, http_status: 403, applies_to: ["POST /bookings", "POST /waitlist-entries", "POST /waitlist-entries/{entry_id}/accept"] }
  - { priority: 14, category: business_referential, check: "FleetAccount.status == ACTIVE when billing to it", error_id: ERR_FLEET_SUSPENDED, http_status: 409, applies_to: ["POST /bookings", "POST /waitlist-entries", "POST /waitlist-entries/{entry_id}/accept", "POST /driver-authorizations/{auth_id}/transition"] }
  - { priority: 15, category: business_referential, check: "Referenced stall_id belongs to site, matches pool (is_reservable == (kind==RESERVED); else ERR_STALL_NOT_RESERVABLE) and stall_class; AmenityProduct belongs to booking's site and is ACTIVE", error_id: ERR_STALL_NOT_RESERVABLE, http_status: 409, applies_to: ["POST /bookings", "POST /bookings/{booking_id}/amenities"] }
  - { priority: 16, category: business_constraint, check: "Pool capacity: eligible stall exists (selector non-empty); waitlist duplicate: no QUEUED/OFFERED entry for same (driver, site); stall_number unique per site", error_id: ERR_SITE_CAPACITY_FULL, http_status: 409, applies_to: ["POST /bookings", "POST /waitlist-entries", "POST /sites/{site_id}/stalls"] }
  - { priority: 17, category: business_constraint, check: "Capacitated amenity: consumed(d) + quantity <= nightly_capacity for every night of the booking span (== allowed)", error_id: ERR_AMENITY_CAPACITY_EXCEEDED, http_status: 409, applies_to: ["POST /bookings/{booking_id}/amenities"] }
  - { priority: 18, category: business_constraint, check: "Segregation of duties: incident resolver X-User-ID != acknowledged_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: ["POST /incidents/{incident_id}/transition"] }
  - { priority: 19, category: business_fiscal, check: "Fleet projected exposure <= credit_limit_cents (== allowed)", error_id: ERR_FLEET_CREDIT_EXCEEDED, http_status: 422, applies_to: ["POST /bookings", "POST /waitlist-entries/{entry_id}/accept"] }
  - { priority: 20, category: business_fiscal, check: "round_half_up(quoted_total_cents / night_count) <= DriverAuthorization.spend_cap_per_night_cents when cap set", error_id: ERR_SPEND_CAP_EXCEEDED, http_status: 422, applies_to: ["POST /bookings", "POST /waitlist-entries/{entry_id}/accept"] }
  - { priority: 21, category: business_fiscal, check: "Payment discipline: payment only when an amount is due (else ERR_PAYMENT_NOT_DUE); amount_cents <= remaining (else ERR_OVERPAYMENT); invoice payable only in {ISSUED, PARTIALLY_PAID, OVERDUE} (else ERR_INVOICE_NOT_PAYABLE)", error_id: ERR_OVERPAYMENT, http_status: 422, applies_to: ["POST /bookings/{booking_id}/payments", "POST /invoices/{invoice_id}/payments"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Sites ---
  - { method: POST, path: "/sites", description: "Create site; auto-creates a default ACTIVE RatePlan with catalog constants (site.version stays 1)", roles: [NetworkAdmin], code: 201, input: [name, base_nightly_rate_cents, "no_show_grace_minutes?", "overstay_grace_minutes?", "cancellation_free_window_hours?"], output: Site, side_effects: ["posture=NORMAL, ops_run_index=0, default ACTIVE RatePlan"] }
  - { method: GET, path: "/sites", description: "List sites", roles: [Driver, FleetManager, SiteOperator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "Site[]", side_effects: [] }
  - { method: GET, path: "/sites/{id}", description: "Get site", roles: [Driver, FleetManager, SiteOperator, NetworkAdmin], code: 200, input: [], output: Site, side_effects: [] }
  - { method: PATCH, path: "/sites/{id}", description: "Update site config; affects future quotes only (pinned per-night rates unchanged)", roles: [NetworkAdmin], code: 200, input: ["name?", "base_nightly_rate_cents?", "no_show_grace_minutes?", "overstay_grace_minutes?", "cancellation_free_window_hours?"], output: Site, side_effects: ["increments Site.version by 1"] }
  - { method: GET, path: "/sites/{id}/availability", description: "Real-time free-stall counts per pool for a window (default window: now to next 11:00Z)", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["window_start?", "window_end?"], output: { reservable_total: integer, reservable_free: integer, first_come_total: integer, first_come_free: integer }, side_effects: [] }
  - { method: GET, path: "/sites/{id}/forecast", description: "Capacity forecast for a night date, both variants", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: [date], output: { date: string, confirmed_occupied_stalls: integer, confirmed_occupancy_pct: number, committed_weighted_demand: number, committed_occupancy_pct: number }, side_effects: [] }
  - { method: POST, path: "/sites/{id}/ops-run", description: "Ops sweep in pinned order: no-show, overstay marking, overstay escalation (auto-incident), waitlist offer expiry + re-offer, posture recompute; increments ops_run_index", roles: [SiteOperator, NetworkAdmin], code: 200, input: [], output: Site, side_effects: ["ops_run_index += 1; see state machines"] }
  # --- Stalls ---
  - { method: POST, path: "/sites/{id}/stalls", description: "Create stall", roles: [NetworkAdmin], code: 201, input: [stall_number, stall_class, is_reservable], output: Stall, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/sites/{id}/stalls", description: "List stalls of a site", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["status?", "is_reservable?", "limit?", "offset?"], output: "Stall[]", side_effects: [] }
  - { method: PATCH, path: "/sites/{id}/stalls/{stall_id}", description: "Set stall status (OUT_OF_SERVICE triggers reassignment cascade)", roles: [SiteOperator, NetworkAdmin], code: 200, input: ["status?"], output: Stall, side_effects: ["reassignment cascade per Stall state machine"] }
  # --- Rate plans ---
  - { method: POST, path: "/sites/{id}/rate-plans", description: "Create DRAFT rate plan (fields default to catalog constants)", roles: [NetworkAdmin], code: 201, input: ["tier2_pct?", "tier3_pct?", "tier4_pct?", "mult_low?", "mult_mid?", "mult_high?", "mult_max?", "peak_multiplier?", "peak_days?"], output: RatePlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/sites/{id}/rate-plans", description: "List rate plans of a site", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["status?", "limit?", "offset?"], output: "RatePlan[]", side_effects: [] }
  - { method: POST, path: "/sites/{id}/rate-plans/{rate_plan_id}/transition", description: "Activate (OCC on Site.version, supersedes current ACTIVE) or retire (DRAFT/SUPERSEDED only)", roles: [NetworkAdmin], code: 200, input: [to, expected_site_version], output: RatePlan, side_effects: ["on ACTIVE: prior ACTIVE -> SUPERSEDED, increments Site.version by 1"] }
  # --- Amenity products ---
  - { method: POST, path: "/sites/{id}/amenity-products", description: "Create amenity product", roles: [NetworkAdmin], code: 201, input: [code, name, price_cents, "nightly_capacity?"], output: AmenityProduct, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/sites/{id}/amenity-products", description: "List amenity products of a site", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["limit?", "offset?"], output: "AmenityProduct[]", side_effects: [] }
  - { method: PATCH, path: "/sites/{id}/amenity-products/{amenity_product_id}", description: "Update price/capacity (existing lines keep pinned unit_price_cents) or discontinue", roles: [NetworkAdmin], code: 200, input: ["price_cents?", "nightly_capacity?", "status?"], output: AmenityProduct, side_effects: [] }
  # --- Drivers ---
  - { method: POST, path: "/drivers", description: "Register driver (cdl_number globally unique)", roles: [Anonymous], code: 201, input: [cdl_number, full_name], output: Driver, side_effects: ["standing=GOOD, loyalty_tier=STANDARD, counters 0"] }
  - { method: GET, path: "/drivers/{driver_id}", description: "Get driver with computed loyalty/standing fields", roles: [Driver, FleetManager, SiteOperator, NetworkAdmin], code: 200, input: [], output: Driver, side_effects: [] }
  # --- Fleet accounts ---
  - { method: POST, path: "/fleet-accounts", description: "Create fleet account", roles: [NetworkAdmin], code: 201, input: [company_name, credit_limit_cents, "payment_terms_days?"], output: FleetAccount, side_effects: ["status=ACTIVE, balance 0"] }
  - { method: GET, path: "/fleet-accounts/{fleet_account_id}", description: "Get fleet account (FleetManager: own id only)", roles: [FleetManager, NetworkAdmin], code: 200, input: [], output: FleetAccount, side_effects: [] }
  - { method: POST, path: "/fleet-accounts/{fleet_account_id}/close", description: "Close fleet (zero balance, no open invoices); revokes authorizations", roles: [NetworkAdmin], code: 200, input: [], output: FleetAccount, side_effects: ["non-terminal DriverAuthorizations -> REVOKED"] }
  - { method: POST, path: "/fleet-accounts/{fleet_account_id}/ops-run", description: "Fleet sweep: overdue invoices -> OVERDUE -> suspension cascade; reactivation when clear", roles: [NetworkAdmin], code: 200, input: [], output: FleetAccount, side_effects: ["see FleetAccount state machine"] }
  - { method: POST, path: "/fleet-accounts/{fleet_account_id}/close-billing-period", description: "Generate invoice for period YYYY-MM from UNBILLED settled FLEET_BILL bookings", roles: [NetworkAdmin], code: 201, input: [period], output: Invoice, side_effects: ["members -> INVOICED; balance recomputed; empty member set -> ERR_VALIDATION"] }
  # --- Driver authorizations ---
  - { method: POST, path: "/driver-authorizations", description: "Driver requests fleet billing authorization (PENDING)", roles: [Driver], code: 201, input: [driver_id, fleet_account_id, "spend_cap_per_night_cents?"], output: DriverAuthorization, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/driver-authorizations", description: "List authorizations, filterable", roles: [Driver, FleetManager, NetworkAdmin], code: 200, input: ["driver_id?", "fleet_account_id?", "status?", "limit?", "offset?"], output: "DriverAuthorization[]", side_effects: [] }
  - { method: GET, path: "/driver-authorizations/{auth_id}", description: "Get authorization", roles: [Driver, FleetManager, NetworkAdmin], code: 200, input: [], output: DriverAuthorization, side_effects: [] }
  - { method: POST, path: "/driver-authorizations/{auth_id}/transition", description: "FleetManager (own fleet): to ACTIVE | REJECTED | SUSPENDED | REVOKED per state machine", roles: [FleetManager], code: 200, input: [to], output: DriverAuthorization, side_effects: ["approve requires fleet ACTIVE"] }
  # --- Bookings ---
  - { method: POST, path: "/bookings", description: "Create booking. RESERVED -> BOOKED with selector-assigned stall and quoted_total_cents; WALK_IN -> CHECKED_IN at flat base rate (no discounts); requires ACTIVE rate plan", roles: [Driver], code: 201, input: [driver_id, site_id, booking_kind, arrival_date, night_count, payment_mode, "fleet_account_id?", "stall_id?", "stall_class?"], output: Booking, side_effects: ["stall assigned per stall_assignment_selector; per_night_rates pinned; quote computed"] }
  - { method: GET, path: "/bookings", description: "List bookings with filters", roles: [Driver, FleetManager, SiteOperator, NetworkAdmin], code: 200, input: ["driver_id?", "site_id?", "stall_id?", "waitlist_entry_id?", "fleet_account_id?", "status?", "billing_status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/bookings/{booking_id}", description: "Get booking (Driver: own; FleetManager: own-fleet billed)", roles: [Driver, FleetManager, SiteOperator, NetworkAdmin], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/bookings/{booking_id}/cancel", description: "Driver cancels BOOKED booking; fee per cancellation_fee calc", roles: [Driver], code: 200, input: [], output: Booking, side_effects: ["stall released; waitlist offer scan"] }
  - { method: POST, path: "/bookings/{booking_id}/check-in", description: "Check in within [checkin_open_at, +no_show_grace] inclusive; stall must be ACTIVE", roles: [Driver], code: 200, input: [], output: Booking, side_effects: ["status -> CHECKED_IN; increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{booking_id}/check-out", description: "Check out (Driver) or force eviction (SiteOperator force=true, OVERSTAY only)", roles: [Driver, SiteOperator], code: 200, input: ["force?"], output: Booking, side_effects: ["final settlement computed; stall released; waitlist scan; eviction adds strike weight 2"] }
  - { method: POST, path: "/bookings/{booking_id}/extend", description: "Extend BOOKED booking by nights at CURRENT dynamic rate; OCC on Booking.version", roles: [Driver], code: 200, input: [added_nights, expected_booking_version], output: Booking, side_effects: ["checkout_due_at += nights; per_night_rates appended; quote recomputed; increments Booking.version by 1"] }
  - { method: POST, path: "/bookings/{booking_id}/payments", description: "DRIVER_DIRECT payment; exact remaining -> PAID + loyalty earn", roles: [Driver], code: 201, input: [amount_cents], output: Booking, side_effects: ["billing_status transitions per machine"] }
  # --- Booking amenities ---
  - { method: POST, path: "/bookings/{booking_id}/amenities", description: "Add amenity line (booking BOOKED or CHECKED_IN); capacity check per night; price pinned", roles: [Driver], code: 201, input: [amenity_product_id, "quantity?"], output: BookingAmenity, side_effects: ["status=RESERVED"] }
  - { method: GET, path: "/booking-amenities", description: "List amenity lines, filterable", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["booking_id?", "amenity_product_id?", "status?", "limit?", "offset?"], output: "BookingAmenity[]", side_effects: [] }
  - { method: GET, path: "/booking-amenities/{amenity_line_id}", description: "Get amenity line", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: [], output: BookingAmenity, side_effects: [] }
  - { method: PATCH, path: "/booking-amenities/{amenity_line_id}", description: "Fulfill a RESERVED line (booking must be CHECKED_IN/OVERSTAY)", roles: [SiteOperator], code: 200, input: [status], output: BookingAmenity, side_effects: ["status -> FULFILLED"] }
  - { method: DELETE, path: "/booking-amenities/{amenity_line_id}", description: "Cancel a RESERVED line (booking BOOKED/CHECKED_IN)", roles: [Driver], code: 200, input: [], output: BookingAmenity, side_effects: ["status -> CANCELLED; capacity released"] }
  # --- Waitlist ---
  - { method: POST, path: "/waitlist-entries", description: "Join waitlist for a site window", roles: [Driver], code: 201, input: [driver_id, site_id, arrival_date, night_count, stall_class, payment_mode, "fleet_account_id?"], output: WaitlistEntry, side_effects: ["status=QUEUED"] }
  - { method: GET, path: "/waitlist-entries", description: "List waitlist entries, filterable", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["driver_id?", "site_id?", "fleet_account_id?", "offered_stall_id?", "status?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }
  - { method: GET, path: "/waitlist-entries/{entry_id}", description: "Get waitlist entry", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: POST, path: "/waitlist-entries/{entry_id}/accept", description: "Accept an OFFERED slot; creates the BOOKED booking at current dynamic rate", roles: [Driver], code: 200, input: [], output: WaitlistEntry, side_effects: ["creates Booking with waitlist_entry_id set"] }
  - { method: POST, path: "/waitlist-entries/{entry_id}/withdraw", description: "Withdraw a QUEUED entry", roles: [Driver], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  # --- Incidents ---
  - { method: POST, path: "/sites/{id}/incidents", description: "Report security/lighting/facility incident; posture recomputed", roles: [Driver, SiteOperator], code: 201, input: [category, severity, description, "reporter_driver_id?"], output: IncidentReport, side_effects: ["status=OPEN; posture recompute"] }
  - { method: GET, path: "/incidents", description: "List incidents, filterable", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: ["site_id?", "reporter_driver_id?", "booking_id?", "category?", "status?", "limit?", "offset?"], output: "IncidentReport[]", side_effects: [] }
  - { method: GET, path: "/incidents/{incident_id}", description: "Get incident", roles: [Driver, SiteOperator, NetworkAdmin], code: 200, input: [], output: IncidentReport, side_effects: [] }
  - { method: POST, path: "/incidents/{incident_id}/transition", description: "to ACKNOWLEDGED | INVESTIGATING | RESOLVED (segregation) | REOPENED (SiteOperator); DISMISSED (NetworkAdmin)", roles: [SiteOperator, NetworkAdmin], code: 200, input: [to], output: IncidentReport, side_effects: ["posture recompute; actor ids recorded"] }
  # --- Invoices ---
  - { method: GET, path: "/invoices", description: "List invoices, filterable (FleetManager: own fleet only)", roles: [FleetManager, NetworkAdmin], code: 200, input: ["fleet_account_id?", "status?", "period?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/invoices/{invoice_id}", description: "Get invoice", roles: [FleetManager, NetworkAdmin], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/invoices/{invoice_id}/payments", description: "Fleet payment; exact remaining -> PAID cascade to bookings + loyalty earn", roles: [FleetManager], code: 201, input: [amount_cents], output: Invoice, side_effects: ["see Invoice state machine"] }
  - { method: POST, path: "/invoices/{invoice_id}/dispute", description: "Fleet disputes an invoice in {ISSUED, PARTIALLY_PAID, OVERDUE, PAID}", roles: [FleetManager], code: 200, input: [reason], output: Invoice, side_effects: ["status -> DISPUTED"] }
  - { method: POST, path: "/invoices/{invoice_id}/resolve-dispute", description: "NetworkAdmin resolves: UPHELD -> ISSUED; WAIVED -> WRITTEN_OFF cascade", roles: [NetworkAdmin], code: 200, input: [outcome], output: Invoice, side_effects: ["WAIVED: bookings -> WAIVED, points clawback, paid_cents -> fleet credit"] }
  - { method: POST, path: "/invoices/{invoice_id}/write-off", description: "NetworkAdmin writes off an OVERDUE invoice", roles: [NetworkAdmin], code: 200, input: [], output: Invoice, side_effects: ["same WAIVED cascade as resolve-dispute"] }
  # --- Test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set logical clock. Startup default (clock never set): exactly 2026-08-01T00:00:00Z; the logical clock MUST NOT fall back to wall-clock time", roles: [NetworkAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advances; no sweeps run implicitly"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or missing X-User-ID for an entity_backed role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership mismatch (driver vs booking/entry/auth, fleet manager vs fleet)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist, or nested resource not under the path parent" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum member, quantity < 1, bad date format, duplicate cdl_number, close-billing-period with no billable members" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity's state machine rejects the transition (e.g., check-in from CANCELLED, fulfill on CANCELLED line, retire of ACTIVE plan, withdraw of OFFERED entry, payment on DISPUTED invoice is ERR_INVOICE_NOT_PAYABLE instead)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_site_version / expected_booking_version does not match the parent's current version" }
  - { id: ERR_SITE_ESCALATED, http: 409, condition: "Site posture ESCALATED (open CRITICAL incident); new bookings and waitlist accepts blocked" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "RESERVED arrival_date is before the clock date" }
  - { id: ERR_WALKIN_NOT_TODAY, http: 422, condition: "WALK_IN arrival_date differs from the clock date" }
  - { id: ERR_WINDOW_TOO_LONG, http: 422, condition: "night_count > 14 (booking, extension result, or waitlist entry)" }
  - { id: ERR_WINDOW_INVALID, http: 422, condition: "arrival_date unparseable, night_count < 1, or availability window_start >= window_end" }
  - { id: ERR_CHECKIN_WINDOW_NOT_OPEN, http: 409, condition: "Check-in attempted before checkin_open_at" }
  - { id: ERR_CHECKIN_GRACE_ELAPSED, http: 409, condition: "Check-in attempted after checkin_open_at + no_show_grace_minutes (exclusive side) before the sweep ran" }
  - { id: ERR_REOPEN_WINDOW_EXPIRED, http: 409, condition: "Incident reopen attempted after resolved_at + 72h (exclusive side)" }
  - { id: ERR_STALL_WINDOW_CONFLICT, http: 409, condition: "Requested stall has an overlapping non-terminal booking for the window" }
  - { id: ERR_DRIVER_WINDOW_CONFLICT, http: 409, condition: "Driver already holds a non-terminal booking overlapping the requested window" }
  - { id: ERR_EXTENSION_CONFLICT, http: 409, condition: "Extension window not free on the booking's stall (or would exceed 14 nights)" }
  - { id: ERR_DRIVER_SUSPENDED, http: 409, condition: "Driver standing SUSPENDED (strikes_90d >= 3); new bookings/waitlist/accepts blocked" }
  - { id: ERR_DRIVER_NOT_AUTHORIZED, http: 403, condition: "FLEET_BILL without an ACTIVE DriverAuthorization for (driver, fleet)" }
  - { id: ERR_FLEET_SUSPENDED, http: 409, condition: "FleetAccount not ACTIVE when billing to it or approving an authorization" }
  - { id: ERR_SITE_CAPACITY_FULL, http: 409, condition: "Selector found no eligible stall for the requested pool/class/window" }
  - { id: ERR_AMENITY_CAPACITY_EXCEEDED, http: 409, condition: "Capacitated amenity would exceed nightly_capacity on some night of the span" }
  - { id: ERR_DUPLICATE_WAITLIST_ENTRY, http: 409, condition: "Driver already has a QUEUED or OFFERED entry at this site" }
  - { id: ERR_DUPLICATE_STALL_NUMBER, http: 409, condition: "stall_number already exists at this site" }
  - { id: ERR_STALL_NOT_RESERVABLE, http: 409, condition: "Explicit stall_id mismatches the pool for booking_kind, wrong class, foreign site, or amenity product is DISCONTINUED/foreign" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Waitlist accept after offer_expires_at (exclusive side) before the sweep expired the entry" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Incident resolver is the same X-User-ID as the acknowledger" }
  - { id: ERR_FLEET_CREDIT_EXCEEDED, http: 422, condition: "FLEET_BILL projected exposure would exceed fleet credit_limit_cents (strict >)" }
  - { id: ERR_SPEND_CAP_EXCEEDED, http: 422, condition: "Per-night average of quote exceeds DriverAuthorization.spend_cap_per_night_cents" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds remaining balance due on booking/invoice" }
  - { id: ERR_PAYMENT_NOT_DUE, http: 409, condition: "Payment attempted with nothing due (billing already PAID/WAIVED, FLEET_BILL booking, or no final total yet)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register a driver"
    identity: opaque
    exclusive_operations:
      - "POST /drivers"
    shared_operations: []

  - name: Driver
    description: "Truck driver; owns bookings, waitlist entries, amenity lines, authorization requests; reports incidents. X-User-ID == Driver.id"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /bookings, POST /bookings/{id}/cancel|check-in|payments|amenities, DELETE /booking-amenities/{id} (own bookings only)"
      - "POST /waitlist-entries, POST /waitlist-entries/{id}/accept|withdraw (own entries only)"
      - "POST /driver-authorizations (driver_id == X-User-ID)"
    shared_operations:
      - "GET reads of sites/stalls/rate-plans/amenity-products/availability/forecast"
      - "GET /bookings* , GET /booking-amenities*, GET /waitlist-entries* (own only), GET /drivers/{id} (self)"
      - "POST /sites/{id}/incidents, GET /incidents*"
      - "POST /bookings/{id}/check-out (own, non-force)"

  - name: FleetManager
    description: "Fleet account manager; authorizes drivers, views and pays own fleet invoices, disputes. X-User-ID == FleetAccount.id"
    identity: "entity_backed:FleetAccount"
    exclusive_operations:
      - "POST /driver-authorizations/{id}/transition (own fleet only)"
      - "POST /invoices/{id}/payments, POST /invoices/{id}/dispute (own fleet only)"
    shared_operations:
      - "GET /fleet-accounts/{id} (own), GET /invoices* (own fleet), GET /driver-authorizations* (own fleet)"
      - "GET /bookings* (FLEET_BILL bookings of own fleet), GET /drivers/{id}, GET sites/stalls/rate-plans/amenity-products"

  - name: SiteOperator
    description: "Parking site staff; runs site ops, manages stall service status, fulfills amenities, handles incidents (segregation of duties on resolve). Opaque id recorded on incidents"
    identity: opaque
    exclusive_operations:
      - "PATCH /sites/{id}/stalls/{stall_id} (shared with NetworkAdmin)"
      - "PATCH /booking-amenities/{id} fulfill"
      - "POST /bookings/{id}/check-out with force=true (eviction)"
      - "POST /incidents/{id}/transition to ACKNOWLEDGED | INVESTIGATING | RESOLVED | REOPENED"
    shared_operations:
      - "POST /sites/{id}/ops-run (with NetworkAdmin)"
      - "GET reads of sites/stalls/bookings/amenities/waitlist/incidents/availability/forecast"
      - "POST /sites/{id}/incidents"

  - name: NetworkAdmin
    description: "Network operator; superset of configuration and fiscal powers; the only writer of sites, rate plans, amenity products, fleets, invoices resolution, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /sites*, POST /sites/{id}/stalls, POST /sites/{id}/rate-plans*, POST /sites/{id}/amenity-products*"
      - "POST /fleet-accounts*, POST /fleet-accounts/{id}/close|ops-run|close-billing-period"
      - "POST /invoices/{id}/resolve-dispute|write-off"
      - "POST /incidents/{id}/transition to DISMISSED"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /sites/{id}/ops-run (with SiteOperator)"
