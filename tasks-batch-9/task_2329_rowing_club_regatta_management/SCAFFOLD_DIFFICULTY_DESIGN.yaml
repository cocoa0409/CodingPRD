              payload: { reading_id: "${reading_open_id}" }
              as: SafetyOfficer
              as_user_id: "${officer_id}"
          assert:
            - "the first trigger call returns HTTP 409 with data.error_id == ERR_SHELL_NOT_AVAILABLE because Shell.${shell_id}.status == ASSIGNED"
            - "after that rejection WaterSession.${session_b_id}.status == PLANNED and reading_id == null"
            - "after the return call Shell.${shell_id}.status == AVAILABLE, WaterSession.${session_a_id}.status == RETURNED with actual_return_at == 2026-08-01T00:00:00Z, and Member.${rita_id}.logged_session_count == 1"
            - "the fourth trigger call succeeds: WaterSession.${session_b_id}.status == CLEARED with required_launch_count == 0 and reading_id == ${reading_open_id}"
            - "Shell.${shell_id}.status == ASSIGNED again after session B is cleared"

