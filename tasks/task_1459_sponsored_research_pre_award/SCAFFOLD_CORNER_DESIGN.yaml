        claim_type: violation_to_error
        grounds: ["errors[ERR_COMPLIANCE_APPROVAL_EXPIRED]", "validations[priority=8]", state_machines.AwardHandoff.DRAFT_to_READY]
        distinguishing_aspect: "mark-ready with an EXPIRED review (and nothing DISAPPROVED) surfaces ERR_COMPLIANCE_APPROVAL_EXPIRED — the temporal gate in isolation."
        test_recipe:
          setup: ["proposal AWARDED (FINAL 54% rate, no subs, no cost-share); IRB APPROVED with validity_days 10 at clock 2026-08-01; clock advanced to 2026-08-12 so the review is EXPIRED"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
