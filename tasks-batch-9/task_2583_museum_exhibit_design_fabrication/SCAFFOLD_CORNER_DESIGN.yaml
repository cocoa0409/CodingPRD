  - section: endpoints
    instances:
      - name: the_crud_surface_is_create_read_list_only_with_one_delete_in_the_whole_api
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/exhibit-projects/{id}/gallery-zones
          - endpoints.GET_/gallery-zones/{id}
          - endpoints.GET_/exhibit-projects/{id}/gallery-zones
          - endpoints.GET_/exhibit-projects/{id}/artifacts
        distinguishing_aspect: |
          Every child entity in this API is created through a parent-scoped POST,
          read through a flat GET by id, and listed through BOTH a parent-scoped
          collection and (where a second parent exists) a foreign-key channel - and
          nothing is ever updated in place. There is no PUT and no PATCH anywhere in
          §1.5, and exactly one DELETE, the placement withdrawal; every other
          mutation is a named action endpoint with its own state transition. The
          probe also pins the two shapes that a hand-rolled router usually gets
          wrong: the flat read takes no query input at all, and the collection filter
          is an exact enum match that returns an empty list rather than a 404 when
          nothing matches.
        test_recipe:
          setup:
            - "a project in INTERPRETIVE, where gallery zones and artifacts may both be created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-A", visitor_route_order: 1, max_noise_dba: 85.0, case_slot_capacity: 2, closure_allowed: true, dust_settling_buffer_minutes: 120 }
              as: MuseumOperations
              as_user_id: ops-01
              captures: { z1: $.data.id, z1code: $.data.zone_code, z1occ: $.data.occupancy_state, z1res: $.data.reserved_case_slots, z1av: $.data.available_case_slots, z1v: $.data.version }
            - call: "GET /gallery-zones/${z1}"
              payload: {}
              as: FabricationLead
              as_user_id: fab-01
              captures: { r1id: $.data.id, r1code: $.data.zone_code, r1noise: $.data.max_noise_dba, r1cap: $.data.case_slot_capacity, r1clo: $.data.closure_allowed, r1dust: $.data.dust_settling_buffer_minutes, r1v: $.data.version }
            - call: "POST /exhibit-projects/${proj}/gallery-zones"
              payload: { zone_code: "Z-B", visitor_route_order: 2, max_noise_dba: 70.0, case_slot_capacity: 20 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { z2: $.data.id, z2pub: $.data.is_public_operating, z2clo: $.data.closure_allowed, z2dust: $.data.dust_settling_buffer_minutes, z2av: $.data.available_case_slots }
            - call: "GET /exhibit-projects/${proj}/gallery-zones"
              payload: { occupancy_state: "OPERATING" }
              as: Curator
              as_user_id: cur-01
              captures: { l0: "$.data[0].zone_code", l1: "$.data[1].zone_code" }
            - call: "GET /exhibit-projects/${proj}/gallery-zones"
              payload: { occupancy_state: "CLOSED" }
              as: Curator
              as_user_id: cur-01
              captures: { e0: $.data }
            - call: "POST /exhibit-projects/${proj}/artifacts"
              payload: { accession_number: "2019.14.3", material_class: "PAPER", required_rh_min_pct: 45.0, required_rh_max_pct: 55.0, max_lux: 50.0, security_class: "ENHANCED", condition_status: "STABLE" }
              as: Curator
              as_user_id: cur-01
              captures: { a1: $.data.id, a1st: $.data.placement_status, a1case: $.data.assigned_case_id }
            - call: "GET /artifacts/${a1}"
              payload: {}
              as: Conservator
              as_user_id: con-01
              captures: { ra1: $.data.id, ra1acc: $.data.accession_number, ra1st: $.data.placement_status }
            - call: "GET /exhibit-projects/${proj}/artifacts"
              payload: { placement_status: "UNPLACED" }
              as: Conservator
              as_user_id: con-01
              captures: { al0: "$.data[0].id" }
            - call: "GET /exhibit-projects/${proj}/artifacts"
              payload: { placement_status: "PLACED" }
              as: Conservator
              as_user_id: con-01
              captures: { ae0: $.data }
          assert:
            - "the zone create returns HTTP 201 with ${z1code} == Z-A, ${z1occ} == OPERATING, ${z1res} == 0, ${z1av} == 2 and ${z1v} == 1"
            - "${r1id} == ${z1}, ${r1code} == Z-A, ${r1noise} == 85.0, ${r1cap} == 2, ${r1clo} == true, ${r1dust} == 120 and ${r1v} == ${z1v} - the flat read returns the same row unchanged and does not bump the version"
            - "${z2pub} == true, ${z2clo} == false, ${z2dust} == 120 and ${z2av} == 20 - the three optional inputs took their declared defaults and available_case_slots is seeded from the capacity"
            - "${l0} == Z-A and ${l1} == Z-B - the collection lists both zones oldest first"
            - "${e0} is an empty list with HTTP 200, not a 404 - a filter that matches nothing is not an error"
            - "${a1st} == UNPLACED with ${a1case} == null on create, and ${ra1st} == UNPLACED on the flat read; ${ra1acc} == 2019.14.3"
            - "${al0} == ${a1} and ${ae0} is empty - the placement_status filter is an exact enum match"
            - "no PUT and no PATCH route exists anywhere in the API, and DELETE /artifact-cases/{id}/placements/{artifact_id} is the only DELETE; every other mutation is a named POST action"

      - name: every_foreign_key_has_a_reverse_listing_channel_that_filters_by_that_key
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/material-specs/{id}/shop-drawings
          - endpoints.GET_/gallery-zones/{id}/artifact-cases
          - endpoints.GET_/shop-drawings
          - endpoints.GET_/exhibit-projects/{id}/shop-drawings
