# =============================================================================
# PRD Benchmark Seed Tables — task_3328_same_day_catalog_fulfillment_deep_inventory_breadth
# Same-Day Catalog Fulfillment & Deep Inventory Breadth (McMaster-Carr style)
# =============================================================================

scenario: |
  Same-Day Catalog Fulfillment & Deep Inventory Breadth (McMaster-Carr): catalog breadth across hundreds of thousands of items with standardized technical attributes and cross-references, inventory positioning across regional distribution centers to enable same-day shipment for a wide assortment, product data curation with dimensional drawings, material specifications and compatibility information, order entry through catalog search with immediate availability and price display, pick and pack operations optimized for small-line orders with high item counts, supplier management for long-tail items with minimum stock commitments, returns without restocking friction and its effect on inventory quality, freight and delivery commitments with regional cutoff times

domain_name: "same-day-catalog-fulfillment"
api_prefix: ""

complexity_profile:
  primary_archetype: "Quota / allocation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual_variant_calculation"
    - "selector_policy"
  entity_topology: "flat"
  state_machine_shape: "parallel"
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: "peer_roles"
  consistency_model: "immediate"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ClockTick
    parent: null
    common_fields: false
    fields:
      - { name: current_utc, type: datetime, source: system, description: "The logical current instant held by the server after the most recent clock set; equals 2026-09-01T00:00:00Z until POST /_clock/set_current_utc is first called" }
      - { name: dc_local_times, type: object, source: computed, description: "Map of DistributionCenter.code to that DC's local wall-clock time after the most recent clock set" }

  - name: DistributionCenter
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Short DC code, unique", constraints: "unique; 2-8 uppercase chars" }
      - { name: region, type: string, source: input, description: "Region served by this DC", constraints: "one of NORTHEAST | SOUTHEAST | MIDWEST | SOUTHWEST | WEST" }
      - { name: local_zone, type: string, source: input, description: "IANA local zone of the DC", constraints: "unique across DistributionCenter" }
      - { name: local_cutoff_time, type: string, source: input, description: "Local wall-clock same-day ship cutoff, HH:MM:SS", constraints: "24h clock; compared against DistributionCenter.local_current_time" }
      - { name: local_current_time, type: string, source: system, default: "00:00:00", description: "Local wall-clock time of this DC, set only by POST /_clock/set_current_utc as current_utc + utc_offset_minutes" }
      - { name: utc_offset_minutes, type: integer, source: input, description: "Minutes this DC's local clock leads UTC", constraints: "range -480..840" }
      - { name: inbound_capacity_units, type: integer, source: input, description: "Units of inbound work this DC will reserve before it goes RESTRICTED", constraints: ">= 0" }
      - { name: transit_seconds, type: integer, source: input, description: "Delivery transit time in seconds from this DC to the region it serves", constraints: ">= 0" }
      - { name: cutoff_passed, type: boolean, source: system, default: false, description: "True once this DC's local weekday is a business day and local_current_time is at or after local_cutoff_time; recomputed only by POST /_clock/set_current_utc" }
      - { name: cutoff_sequence_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by each POST /distribution-centers/{id}/roll_cutoff" }
      - { name: inbound_reserved_units, type: integer, source: computed, default: 0, description: "Units promised to orders allocated to this DC but not yet picked" }
      - { name: operations_posture, type: enum, source: computed, default: "OPEN", description: "OPEN | RESTRICTED | LOCKDOWN — OPEN when no open quality/damage hold and inbound_reserved_units < ceil(inbound_capacity_units * RESTRICTED_RESERVE_RATIO); RESTRICTED when no hold and inbound_reserved_units >= that threshold; LOCKDOWN whenever an open quality/damage hold exists, and LOCKDOWN outranks RESTRICTED" }

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_name, type: string, source: input, description: "Legal supplier name" }
      - { name: home_dc_id, type: string, source: input, description: "FK -> DistributionCenter.id; DC this supplier's long-tail commitment is stocking" }
      - { name: primary_attribute_name, type: string, source: input, description: "Name of the standardized attribute this supplier is contracted to hold on commitment" }
      - { name: primary_attribute_value, type: string, source: input, description: "Value of the standardized attribute this supplier is contracted to hold on commitment" }
      - { name: long_tail_authorized, type: boolean, source: input, description: "Whether this supplier may hold min-stock commitments for long-tail items" }
      - { name: min_stock_commitment_units, type: integer, source: input, description: "Units the supplier commits to hold at each stocking DC", constraints: ">= 0" }
      - { name: commitment_breach_count, type: integer, source: computed, default: 0, description: "Number of times the supplier's own long-tail availability fell below min_stock_commitment_units" }
      - { name: performance_rating_units, type: integer, source: computed, default: 100, description: "100 - 10 * commitment_breach_count; used as the supplier selector rank key (higher wins)" }

  - name: SupplierAvailabilityReport
    parent: Supplier
    common_fields: false
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; supplier that filed this availability report" }
      - { name: item_id, type: string, source: input, description: "FK -> CatalogItem.id; long-tail item the report covers" }
      - { name: reported_available_units, type: integer, source: input, description: "Units the supplier reports as available for the long-tail item", constraints: ">= 0" }

  - name: CurationReview
    parent: null
    common_fields: true
    fields:
      - { name: curator_id, type: string, source: system, description: "Opaque curator user id that opened this review batch" }
      - { name: review_status, type: enum, source: system, default: "OPEN", description: "OPEN | REVOKED" }
      - { name: bundle_level_revision, type: integer, source: computed, default: 0, description: "Number of revision rounds recorded against this review batch" }
      - { name: approved_count, type: integer, source: computed, default: 0, description: "Items approved the most recent time this batch was submitted" }
      - { name: revision_round_baseline, type: integer, source: computed, description: "approved_count captured at the first revision round; 0 until the batch has been revised once" }

  - name: CurationReviewItem
    parent: CurationReview
    common_fields: false
    fields:
      - { name: review_id, type: string, source: system, description: "FK -> CurationReview.id; review batch this membership row belongs to" }
      - { name: item_id, type: string, source: input, description: "FK -> CatalogItem.id; item bundled into this review batch" }
      - { name: item_level_revision, type: integer, source: computed, default: 0, description: "Revision rounds recorded for this item" }
      - { name: item_attribute_counter, type: integer, source: computed, default: 0, description: "Counter of standardized attributes carried by this item at the last review" }

  - name: CatalogItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Catalog SKU, unique", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Short catalog description" }
      - { name: material_spec, type: string, source: input, description: "Material specification text (e.g. 18-8 stainless steel)" }
      - { name: long_tail, type: boolean, source: input, description: "True when the item is sourced from a long-tail supplier on min-stock commitment" }
      - { name: catalog_status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }
      - { name: unit_price_cents, type: integer, source: input, description: "List price per unit in cents", constraints: ">= 1" }
      - { name: unit_weight_kg, type: number, source: input, description: "Shipping weight of one unit in kilograms", constraints: "> 0" }
      - { name: curated_dimension_json, type: object, source: input, description: "Dimensional drawing payload (nominal_length_mm, nominal_width_mm, nominal_height_mm, drawing_revision)" }
      - { name: curation_bundle_size, type: integer, source: input, description: "Dimensional attributes bundled into one curation review batch" }
      - { name: curation_review_state, type: enum, source: system, default: "UNREVIEWED", description: "UNREVIEWED | APPROVED — item data is order-selectable only when APPROVED" }
      - { name: curation_last_reviewed_by, type: string, source: system, description: "Opaque curator user id that last approved this item's data (null when never approved)" }

  - name: ItemAttribute
    parent: CatalogItem
    common_fields: false
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> CatalogItem.id; owner of this attribute row; immutable after creation" }
      - { name: attribute_name, type: string, source: input, description: "Standardized technical attribute key, unique within its item", constraints: "unique within its item_id; immutable after creation" }
      - { name: attribute_value, type: string, source: input, description: "Attribute value, unique within its item", constraints: "unique within its item_id; immutable after creation" }
      - { name: unit_of_measure, type: string, source: input, description: "Unit the value is expressed in" }

  - name: ItemCrossReference
    parent: CatalogItem
    common_fields: false
    fields:
      - { name: item_id, type: string, source: system, description: "FK -> CatalogItem.id; owner of this cross-reference row; immutable after creation" }
      - { name: referenced_manufacturer, type: string, source: input, description: "Manufacturer the alternate part number belongs to" }
      - { name: referenced_part_number, type: string, source: input, description: "Alternate manufacturer part number" }
      - { name: compatibility_note, type: string, source: input, description: "Compatibility note shown with the cross-reference" }

  - name: InventoriedStock
    parent: CatalogItem
    common_fields: true
    fields:
      - { name: item_id, type: string, source: input, description: "FK -> CatalogItem.id; item held at this DC" }
      - { name: dc_id, type: string, source: input, description: "FK -> DistributionCenter.id; DC that holds these units" }
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; account whose order consumes this stock row" }
      - { name: on_hand_units, type: integer, source: computed, default: 0, description: "Units on the shelf at this DC" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Units allocated to un-picked order lines at this DC" }
      - { name: available_units, type: integer, source: computed, description: "= on_hand_units - reserved_units; display availability for the item at this DC" }
      - { name: daily_demand_units, type: integer, source: input, description: "Units the pick-engine consumed at this DC during the most recently completed cutoff period", constraints: ">= 0" }
      - { name: inbound_daily_units, type: integer, source: input, description: "Units replenished into this DC during the most recently completed cutoff period", constraints: ">= 0" }
      - { name: positioning_flag, type: enum, source: computed, description: "OK | UNDERSTOCKED | LONG_TAIL_DEFICIT — derived at POST /distribution-centers/{id}/roll_cutoff" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Account display name" }
      - { name: delivery_zone, type: string, source: input, description: "IANA delivery zone of the account's shipping address", constraints: "compared against DistributionCenter.local_zone to decide the zone surcharge" }
      - { name: home_region, type: string, source: input, description: "Region the account's delivery address sits in", constraints: "one of NORTHEAST | SOUTHEAST | MIDWEST | SOUTHWEST | WEST" }
      - { name: open_claim_count, type: integer, source: computed, default: 0, description: "Number of OpenClaim rows currently in an open (non-terminal) state" }

  - name: CatalogOrder
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CustomerAccount.id; account that placed this order" }
      - { name: order_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | RELEASED | CANCELLED" }
      - { name: fulfillment_status, type: enum, source: system, default: "AWAITING_RELEASE", description: "AWAITING_RELEASE | ALLOCATED | PICKED | SHIPPED | RETURNED" }
      - { name: line_count, type: integer, source: computed, default: 0, description: "Number of CatalogOrderLine rows on this order" }
      - { name: total_small_line_fee_cents, type: integer, source: computed, default: 0, description: "Sum of per-line small-line handling fees; null-free integer (0 when no line qualifies)" }
      - { name: order_total_cents, type: integer, source: computed, default: 0, description: "Sum of line_subtotal_cents + allocated_small_line_fee_cents over all lines" }
      - { name: allocated_dc_id, type: string, source: computed, description: "FK -> DistributionCenter.id; DC selected by the allocation selector for this order (null until allocation)" }
      - { name: same_day_committed, type: boolean, source: computed, default: false, description: "True when allocation succeeded while at least one eligible candidate DC still had cutoff_passed == false, i.e. the order made today's same-day dispatch window (false means the order was committed too late for it)" }
      - { name: commit_minutes_before_cutoff, type: integer, source: computed, default: 0, description: "Minutes between the allocated DC's local_current_time at allocation and that DC's local_cutoff_time, saturated at 0 — an order committed at or after the cutoff records 0; the urgency input to freight_charge_two_variant" }
      - { name: damage_claim_count, type: integer, source: computed, default: 0, description: "DamageClaim rows attached to this order in a non-terminal state" }
      - { name: freight_charge_cents, type: integer, source: computed, default: 0, description: "Freight charge assigned to this order and to its Shipment" }

  - name: CatalogOrderLine
    parent: CatalogOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CatalogOrder.id; order this line belongs to" }
      - { name: item_id, type: string, source: input, description: "FK -> CatalogItem.id; item requested on this line" }
      - { name: quantity, type: integer, source: input, description: "Units requested", constraints: ">= 1" }
      - { name: allocated_dc_id, type: string, source: computed, description: "FK -> DistributionCenter.id; DC that allocated this line" }
      - { name: allocated_units, type: integer, source: computed, default: 0, description: "Units reserved for this line at its allocated DC" }
      - { name: is_small_line, type: boolean, source: computed, default: false, description: "True when quantity <= SMALL_LINE_MAX_UNITS for this item's curation bundle" }
      - { name: line_subtotal_cents, type: integer, source: computed, default: 0, description: "= allocated_units * item.unit_price_cents" }
      - { name: allocated_small_line_fee_cents, type: integer, source: computed, default: 0, description: "Share of the order's total small-line fee attributed to this line" }
      - { name: line_total_cents, type: integer, source: computed, default: 0, description: "= line_subtotal_cents + allocated_small_line_fee_cents" }
      - { name: line_status, type: enum, source: system, default: "PENDING", description: "PENDING | ALLOCATED | PICKED | SHORT | RESTOCKED | RETURNED" }
      - { name: returned_units, type: integer, source: computed, default: 0, description: "Units of this line returned by the account and accepted" }
      - { name: restocked_units, type: integer, source: computed, default: 0, description: "Units of this line returned to sellable on_hand at the DC without a condition downgrade" }
      - { name: damaged_units, type: integer, source: computed, default: 0, description: "Units of this line returned and routed to the damage path (item suspended when this exceeds the value-ratio trigger)" }
      - { name: return_friction_units, type: integer, source: computed, default: 0, description: "Units of this line returned but NOT restocked (damaged_units + non-restockable units) — the conserve-order-quantity term" }

  - name: PickTask
    parent: CatalogOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CatalogOrder.id; order being picked" }
      - { name: line_id, type: string, source: input, description: "FK -> CatalogOrderLine.id; line being picked" }
      - { name: dc_id, type: string, source: input, description: "FK -> DistributionCenter.id; DC the picker works in" }
      - { name: requested_units, type: integer, source: input, description: "Units the picker was asked to pull", constraints: ">= 1" }
      - { name: picked_units, type: integer, source: computed, default: 0, description: "Units actually pulled off the shelf" }
      - { name: shortage_units, type: integer, source: computed, description: "= requested_units - picked_units when picked_units < requested_units; else 0" }
      - { name: shortage_disposition, type: enum, source: system, description: "NONE | MADE_TO_ORDER — MADE_TO_ORDER only when every shortage on the order belongs to a long_tail item" }
      - { name: pick_status, type: enum, source: system, default: "QUEUED", description: "QUEUED | PICKING | PICKED | SHORT_CLOSED" }

  - name: Shipment
    parent: CatalogOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CatalogOrder.id; order being shipped" }
      - { name: dc_id, type: string, source: system, description: "FK -> DistributionCenter.id; DC that cut the shipment off" }
      - { name: shipment_status, type: enum, source: system, default: "STAGED", description: "STAGED | CUTOFF_CONFIRMED | DISPATCHED | HELD" }
      - { name: cutoff_sequence_index, type: integer, source: computed, description: "Copy of DistributionCenter.cutoff_sequence_index at the moment of POST /orders/{id}/confirm_cutoff" }
      - { name: service_level, type: enum, source: input, default: "GROUND", description: "GROUND | TWO_DAY | OVERNIGHT — selected by the freight selector rank key" }
      - { name: billable_weight_kg, type: number, source: computed, description: "Sum of line weights for the order, rounded to 2dp" }
      - { name: freight_rate_cents, type: integer, source: computed, description: "Base freight before urgency multiplier" }
      - { name: freight_surcharge_cents, type: integer, source: computed, description: "Urgency surcharge: 30% of the base for TWO_DAY, 60% for OVERNIGHT, 0 for GROUND; rounded per shipment" }
      - { name: freight_charge_cents, type: integer, source: computed, description: "= freight_rate_cents + freight_surcharge_cents — the single authoritative freight figure mirrored onto CatalogOrder.freight_charge_cents" }
      - { name: promised_delivery_by, type: datetime, source: computed, description: "Date this shipment was promised to arrive, when the account asked for a delivery deadline" }

  - name: ReturnAuthorization
    parent: CatalogOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CatalogOrder.id; order the returned material came from" }
      - { name: dc_id, type: string, source: system, description: "FK -> DistributionCenter.id; DC receiving the returned units" }
      - { name: return_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | APPROVED | RECEIVED | CANCELLED" }
      - { name: restock_units, type: integer, source: computed, default: 0, description: "Units approved for immediate restock to sellable on_hand at the DC" }
      - { name: damaged_units, type: integer, source: computed, default: 0, description: "Units approved onto the damage path; these never re-enter available_units" }

  - name: DamageClaim
    parent: CatalogOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> CatalogOrder.id; order the damaged units came from" }
      - { name: line_id, type: string, source: input, description: "FK -> CatalogOrderLine.id; line the damaged units belonged to" }
      - { name: claim_units, type: integer, source: input, description: "Units claimed as damaged", constraints: ">= 0" }
      - { name: damage_value_cents, type: integer, source: computed, description: "= round_half_up(claim_units * item.unit_price_cents * DAMAGE_VALUE_FACTOR) — a reported damage exposure, never added into CatalogOrder.order_total_cents" }
      - { name: claim_status, type: enum, source: system, default: "OPEN", description: "OPEN | RESUMED | RESOLVED | REJECTED | VOIDED" }
      - { name: disposition, type: enum, source: system, description: "PENDING | REPLACE_FROM_STOCK | ZERO_CHARGE_RESHIP" }

  - name: SquareFootageRequest
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CustomerAccount.id; account that quoted this consignment" }
      - { name: request_status, type: enum, source: system, default: "QUOTED", description: "QUOTED | CUTTING | FULFILLED | RETURNED" }
      - { name: committed_length_feet, type: integer, source: computed, description: "Value of the currently selected pipe-length commitment variant at the moment it was last recomputed" }
      - { name: committed_variant, type: enum, source: computed, default: "FORWARD_LOOKING", description: "FORWARD_LOOKING while request_status is QUOTED; ON_HAND_ONLY once any line has line_status CUT" }
      - { name: prior_committed_length_feet, type: integer, source: computed, description: "The committed_length_feet recorded for the previous committed_variant; seeded equal to committed_length_feet while request_status is QUOTED, then captured at the first cut" }

  - name: SquareFootageLine
    parent: SquareFootageRequest
    common_fields: true
    fields:
      - { name: request_id, type: string, source: system, description: "FK -> SquareFootageRequest.id; quote this line belongs to" }
      - { name: cut_list_ordinal, type: integer, source: input, description: "Position of this cut length in the customer's cut list", constraints: ">= 1; unique across the whole request (no two lines may share an ordinal)" }
      - { name: requested_feet, type: integer, source: input, description: "Feet of pipe requested at this cut length", constraints: ">= 1" }
      - { name: line_status, type: enum, source: system, default: "PLANNED", description: "PLANNED | CUT" }
      - { name: line_committed_feet, type: integer, source: computed, default: 0, description: "Feet this line was allocated in the walk; a line the walk stopped on records 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- CatalogOrder: parallel dimensions (order_status × fulfillment_status) ----
  - entity: CatalogOrder
    initial_state: DRAFT / AWAITING_RELEASE
    terminal_states: [CANCELLED, RETURNED]
    shape: "parallel — order_status and fulfillment_status evolve independently on the same row"
    transitions:
      - from: DRAFT / AWAITING_RELEASE
        to: RELEASED / AWAITING_RELEASE
        trigger: "POST /orders/{id}/release"
        actor: CustomerAccount
        preconditions:
          - "order_status == DRAFT"
          - "every line's item has curation_review_state == APPROVED (ERR_CURATION_NOT_APPROVED)"
        side_effects: ["CatalogOrder.order_status := RELEASED", "increments CatalogOrder.version by 1"]

      - from: RELEASED / AWAITING_RELEASE
        to: RELEASED / ALLOCATED
        trigger: "POST /orders/{id}/allocate"
        actor: CustomerAccount
        preconditions:
          - "order_status == RELEASED"
          - "at least one eligible candidate DC survives the selector's eligibility filter (ERR_NO_ELIGIBLE_DC)"
        side_effects:
          - "CatalogOrder.allocated_dc_id := selected DistributionCenter.id"
          - "CatalogOrder.same_day_committed := true when at least one eligible candidate DC had cutoff_passed == false at the moment of selection, else false"
          - "each line: allocated_dc_id := the same selected DC, allocated_units := requested quantity, line_status := ALLOCATED"
          - "InventoriedStock.reserved_units += allocated_units on (item_id, allocated_dc_id); available_units recomputed"
          - "DistributionCenter.inbound_reserved_units += sum(allocated_units)"
          - "recompute small_line_fee_total_and_allocate — writes CatalogOrder.total_small_line_fee_cents, each line's allocated_small_line_fee_cents and line_total_cents, and CatalogOrder.order_total_cents"
          - "recompute order_line_count_guard — writes CatalogOrder.line_count"
          - "increments CatalogOrder.version by 1"

      - from: RELEASED / ALLOCATED
        to: RELEASED / PICKED
        trigger: "POST /orders/{id}/lines/{line_id}/pick"
        actor: WarehousePicker
        preconditions:
          - "fulfillment_status == ALLOCATED"
          - "the line's PickTask.pick_status == QUEUED"
          - "DistributionCenter.operations_posture != LOCKDOWN for the allocated DC (ERR_DC_LOCKDOWN)"
        side_effects:
          - "ItemAttribute rows of the line's item are immutable and untouched"
          - "PickTask.pick_status := PICKING"

      - from: PICKING (PickTask axis)
        to: PICKED
        trigger: "POST /orders/{id}/lines/{line_id}/pick_complete"
        actor: WarehousePicker
        preconditions:
          - "PickTask.pick_status == PICKING"
          - "shortage may be non-zero; the pick completes either way"
        side_effects:
          - "PickTask.picked_units := supplied actual_units; shortage_units := max(0, requested_units - actual_units)"
          - "InventoriedStock.on_hand_units -= picked_units on (item_id, dc_id); available_units recomputed"
          - "CatalogOrderLine.line_status := PICKED when shortage_units == 0, else SHORT"
          - "CatalogOrderLine.allocated_small_line_fee_cents := 0 when line_status becomes SHORT"
          - "recompute small_line_fee_total_and_allocate and order_total_cents_factor_first — both CatalogOrder totals recomputed"
          - "when shortage_units > 0 on this line and the line's item.long_tail == true and no other line of the order has a shortage on a non-long-tail item: PickTask.shortage_disposition := MADE_TO_ORDER"
          - "when shortage_units > 0 on this line and the line's item.long_tail == false: opens DamageClaim (permitted — claim may carry claim_units >= 0), which increments CustomerAccount.open_claim_count"
          - "when every line of the order has line_status in {PICKED, SHORT}: CatalogOrder.fulfillment_status := PICKED"
          - "increments CatalogOrder.version by 1"

      - from: PICKED / PICKED
        to: PICKED / SHIPPED
        trigger: "POST /orders/{id}/confirm_cutoff"
        actor: DCManager
        preconditions:
          - "fulfillment_status == PICKED"
          - "shipment.source == STAGED"
          - "required body field expected_order_version must equal CatalogOrder.version (ERR_STALE_VERSION, HTTP 412)"
          - "the order's allocated DC is a member of CandidateDCSelection (ERR_DC_NOT_CANDIDATE)"
        side_effects:
          - "Shipment.shipment_status := CUTOFF_CONFIRMED"
          - "Shipment.cutoff_sequence_index := DistributionCenter.cutoff_sequence_index of the allocated DC"
          - "recompute freight_charge_two_variant — writes Shipment.freight_rate_cents, freight_surcharge_cents and freight_charge_cents"
          - "Shipment.freight_charge_cents mirrored onto CatalogOrder.freight_charge_cents"
          - "CatalogOrder.fulfillment_status := SHIPPED"
          - "increments CatalogOrder.version by 1"

      - from: SHIPPED / SHIPPED
        to: SHIPPED / RETURNED
        trigger: "POST /returns/{id}/receive"
        actor: DCManager
        preconditions:
          - "ReturnAuthorization.return_status == APPROVED"
          - "every claimed unit has a removed_manufacturer_part_number recorded on the request"
        side_effects:
          - "stage A: each line's returned_units += authorized units; line_status := RETURNED"
          - "stage B (restock assessment): line.restocked_units := min(authorized units, RESTOCK_CAP_UNITS); line.damaged_units := authorized units - restocked_units"
          - "stage C (stock restore): InventoriedStock.on_hand_units += restocked_units; available_units recomputed; DistributionCenter.operations_posture := OPEN when the DC had been LOCKDOWN"
          - "stage D (damage path): DamageClaim opened for the damaged share of the line's item; CustomerAccount.open_claim_count += 1"
          - "stage E (supplier breach): when the line's item.long_tail == true, Supplier.commitment_breach_count += 1 and Supplier.performance_rating_units := 100 - 10 * commitment_breach_count"
          - "stage F (catalog suspension): when CatalogItem.damaged_unit_ratio_breach returns true, CatalogItem.catalog_status := SUSPENDED"
          - "stage G (fresh authorization): every ReturnAuthorization row of this order with return_status == APPROVED becomes CANCELLED (stale restock authorizations)"
          - "ReturnAuthorization.return_status := RECEIVED"
          - "CatalogOrder.fulfillment_status := RETURNED"
          - "increments CatalogOrder.version by 1 and DCManager.identity entity version chain"

      - from: DRAFT / AWAITING_RELEASE
        to: CANCELLED / AWAITING_RELEASE
        trigger: "POST /orders/{id}/cancel"
        actor: CustomerAccount
        preconditions: ["order_status == DRAFT"]
        side_effects: ["CatalogOrder.order_status := CANCELLED", "increments CatalogOrder.version by 1"]

      - from: RELEASED / AWAITING_RELEASE
        to: CANCELLED / AWAITING_RELEASE
        trigger: "POST /orders/{id}/cancel"
        actor: CustomerAccount
        preconditions: ["order_status == RELEASED", "fulfillment_status == AWAITING_RELEASE"]
        side_effects: ["CatalogOrder.order_status := CANCELLED", "increments CatalogOrder.version by 1"]

      - from: RELEASED / ALLOCATED
        to: CANCELLED / AWAITING_RELEASE
        trigger: "POST /orders/{id}/cancel"
        actor: CustomerAccount
        preconditions: ["order_status == RELEASED", "fulfillment_status == ALLOCATED"]
        side_effects:
          - "each line with line_status == ALLOCATED: InventoriedStock.reserved_units -= allocated_units on (item_id, allocated_dc_id); available_units recomputed"
          - "DistributionCenter.inbound_reserved_units -= sum(released allocated_units)"
          - "every line's line_status := PENDING; allocated_units := 0"
          - "CatalogOrder.fulfillment_status := AWAITING_RELEASE"
          - "CatalogOrder.order_status := CANCELLED"
          - "increments CatalogOrder.version by 1"

      - from: RELEASED / AWAITING_RELEASE
        to: RELEASED / AWAITING_RELEASE
        trigger: "system (revision loop) — argument or partial-cancellation rounds on a released order before allocation"
        actor: system
        preconditions: ["order_status == RELEASED"]
        side_effects: ["order_status := DRAFT; every line line_status := PENDING", "increments CatalogOrder.version by 1"]
        note: "Cycle: RELEASED may return to DRAFT and be re-released any number of times"

  # ---- PickTask ----
  - entity: PickTask
    initial_state: QUEUED
    terminal_states: [PICKED, SHORT_CLOSED]
    transitions:
      - from: QUEUED
        to: PICKING
        trigger: "system (opened by POST /orders/{id}/lines/{line_id}/pick)"
        actor: system
        preconditions: ["CatalogOrderLine.line_status == ALLOCATED"]
        side_effects: []
      - from: PICKING
        to: PICKED
        trigger: "POST /orders/{id}/lines/{line_id}/pick_complete"
        actor: WarehousePicker
        preconditions: ["picked units == requested_units"]
        side_effects: ["PickTask.pick_status := PICKED"]
      - from: PICKING
        to: SHORT_CLOSED
        trigger: "POST /orders/{id}/lines/{line_id}/pick_complete"
        actor: WarehousePicker
        preconditions: ["picked units < requested_units"]
        side_effects: ["PickTask.pick_status := SHORT_CLOSED"]
      - from: SHORT_CLOSED
        to: PICKING
        trigger: "POST /orders/{id}/lines/{line_id}/pick (re-pick after a damaged pick is written off)"
        actor: WarehousePicker
        preconditions: ["the order's fulfillment_status is still ALLOCATED", "the line's DamageClaim is OPEN"]
        side_effects: ["line_status := ALLOCATED", "increments CatalogOrder.version by 1"]
        note: "Cycle: a short-closed pick may be reopened while the order has not moved past ALLOCATED"

  # ---- Shipment ----
  - entity: Shipment
    initial_state: STAGED
    terminal_states: [DISPATCHED]
    transitions:
      - from: STAGED
        to: CUTOFF_CONFIRMED
        trigger: "POST /orders/{id}/confirm_cutoff"
        actor: DCManager
        preconditions: ["CatalogOrder.fulfillment_status == PICKED", "the allocated DC is a member of CandidateDCSelection"]
        side_effects: ["recompute freight_charge_two_variant — writes freight_rate_cents, freight_surcharge_cents, freight_charge_cents"]
      - from: CUTOFF_CONFIRMED
        to: DISPATCHED
        trigger: "POST /shipments/{id}/dispatch"
        actor: DCManager
        preconditions: ["Shipment.shipment_status == CUTOFF_CONFIRMED"]
        side_effects: ["Shipment.shipment_status := DISPATCHED"]
      - from: CUTOFF_CONFIRMED
        to: HELD
        trigger: "system (automatic when DistributionCenter.operations_posture becomes LOCKDOWN)"
        actor: system
        preconditions: []
        side_effects: ["Shipment.shipment_status := HELD"]
      - from: HELD
        to: CUTOFF_CONFIRMED
        trigger: "system (automatic when the DC's last open quality/damage hold is cleared)"
        actor: system
        preconditions: []
        side_effects: ["Shipment.shipment_status := CUTOFF_CONFIRMED"]
        note: "Cycle: HELD <-> CUTOFF_CONFIRMED follows the DC's operations_posture"
      - from: STAGED
        to: CUTOFF_CONFIRMED
        trigger: "system (auto for BACKORDER-class items once a dispatchable DC has free capacity at roll_cutoff)"
        actor: system
        preconditions: ["CatalogItem.long_tail == false"]
        side_effects: []
        note: "same transition pair as the manual confirm; system variant exists so two transitions are cyclic"

  # ---- ReturnAuthorization ----
  - entity: ReturnAuthorization
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /returns/{id}/approve"
        actor: DCManager
        preconditions:
          - "ReturnAuthorization.return_status == DRAFT"
          - "each claimed unit quantity <= the line's delivered quantity"
        side_effects:
          - "ReturnAuthorization.restock_units := sum over lines of min(authorized units, RESTOCK_CAP_UNITS)"
          - "ReturnAuthorization.damaged_units := authorized units - restock_units"
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /returns/{id}/receive"
        actor: DCManager
        preconditions: ["every claimed unit carries removed_manufacturer_part_number"]
        side_effects:
          - "stage A: each line's returned_units += authorized units; line_status := RETURNED"
          - "stage B: line.restocked_units := min(authorized units, RESTOCK_CAP_UNITS); line.damaged_units := authorized units - restocked_units"
          - "stage C: InventoriedStock.on_hand_units += restocked_units; available_units recomputed; DistributionCenter.operations_posture := OPEN"
          - "stage D: DamageClaim opened for the damaged share; CustomerAccount.open_claim_count += 1"
          - "stage E: when the line's item.long_tail == true, Supplier.commitment_breach_count += 1 and Supplier.performance_rating_units := 100 - 10 * commitment_breach_count"
          - "stage F: when CatalogItem.damaged_unit_ratio_breach returns true, CatalogItem.catalog_status := SUSPENDED"
          - "stage G: every ReturnAuthorization row of the order with return_status == APPROVED becomes CANCELLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /returns/{id}/cancel"
        actor: DCManager
        preconditions: ["return_status == DRAFT"]
        side_effects: []
      - from: APPROVED
        to: APPROVED
        trigger: "system (authorization revision round before receiving)"
        actor: system
        preconditions: ["return_status == APPROVED"]
        side_effects: ["restock_units and damaged_units recomputed against the current lines"]
        note: "Cycle: an authorization may be re-approved (restock mix recomputed) before receive"

  # ---- DamageClaim ----
  - entity: DamageClaim
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED, VOIDED]
    transitions:
      - from: OPEN
        to: RESUMED
        trigger: "POST /damage-claims/{id}/resume_fulfillment"
        actor: WarehousePicker
        preconditions: ["CatalogItem.catalog_status == ACTIVE (ERR_ITEM_SUSPENDED)"]
        side_effects: ["CatalogOrder.fulfillment_status reverts to ALLOCATED", "line_status := ALLOCATED"]
      - from: RESUMED
        to: RESOLVED
        trigger: "POST /damage-claims/{id}/resolve"
        actor: DCManager
        preconditions: ["claim_status == RESUMED"]
        side_effects: ["claim_status := RESOLVED", "CustomerAccount.open_claim_count -= 1"]
      - from: OPEN
        to: REJECTED
        trigger: "POST /damage-claims/{id}/reject"
        actor: DCManager
        preconditions: ["claim_status == OPEN"]
        side_effects: ["claim_status := REJECTED", "CustomerAccount.open_claim_count -= 1"]
      - from: RESUMED
        to: VOIDED
        trigger: "POST /damage-claims/{id}/void"
        actor: DCManager
        preconditions: ["claim_status == RESUMED"]
        side_effects: ["claim_status := VOIDED", "CustomerAccount.open_claim_count -= 1"]

  # ---- DistributionCenter (posture) ----
  - entity: DistributionCenter
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (automatic when inbound_reserved_units first reaches the RESTRICTED reserve threshold)"
        actor: system
        preconditions: ["no open quality/damage hold", "inbound_reserved_units >= ceil(inbound_capacity_units * RESTRICTED_RESERVE_RATIO)"]
        side_effects: ["operations_posture := RESTRICTED"]
      - from: RESTRICTED
        to: OPEN
        trigger: "system (automatic when inbound_reserved_units falls back below the RESTRICTED reserve threshold)"
        actor: system
        preconditions: ["no open quality/damage hold", "inbound_reserved_units < ceil(inbound_capacity_units * RESTRICTED_RESERVE_RATIO)"]
        side_effects: ["operations_posture := OPEN"]
        note: "the threshold is INCLUSIVE at the boundary: exactly ceil(capacity * ratio) reserved units is already RESTRICTED, one unit fewer is still OPEN"

      - from: OPEN
        to: LOCKDOWN
        trigger: "system (automatic when an open quality/damage hold is opened on the DC)"
        actor: system
        preconditions: ["the DC has at least one open quality/damage hold"]
        side_effects:
          - "operations_posture := LOCKDOWN"
          - "cascade hop 1: every Shipment at this DC with shipment_status == CUTOFF_CONFIRMED becomes HELD"
          - "cascade hop 2: each of those Shipment rows' CatalogOrder.fulfillment_status reverts PICKED -> ALLOCATED"
          - "cascade hop 3: each of those orders' line_status reverts PICKED -> ALLOCATED"
          - "cascade hop 4: each of those lines reopens its PickTask by writing shortage_disposition := NONE and returning pick_status to PICKING"
      - from: LOCKDOWN
        to: OPEN
        trigger: "system (automatic when the last open quality/damage hold on the DC is cleared)"
        actor: system
        preconditions: ["no open quality/damage holds remain"]
        side_effects:
          - "operations_posture := OPEN"
          - "cascade hop 1: every Shipment at this DC with shipment_status == HELD becomes CUTOFF_CONFIRMED"
          - "cascade hop 2: each of those Shipment rows' CatalogOrder.fulfillment_status reverts to PICKED"

  # ---- SquareFootageRequest (cut-list consignment) ----
  - entity: SquareFootageRequest
    initial_state: QUOTED
    terminal_states: [FULFILLED, RETURNED]
    transitions:
      - from: QUOTED
        to: CUTTING
        trigger: "POST /square-footage-requests/{id}/cut"
        actor: WarehousePicker
        preconditions: ["request_status == QUOTED", "the named cut_list_ordinal belongs to this request"]
        side_effects: ["request_status := CUTTING", "the named line's line_status := CUT"]
      - from: CUTTING
        to: CUTTING
        trigger: "POST /square-footage-requests/{id}/cut (further cuts on the same consignment)"
        actor: WarehousePicker
        preconditions: ["request_status == CUTTING"]
        side_effects: ["the named line's line_status := CUT", "recompute pipe_length_commitment_two_variant"]
        note: "Cycle: a consignment may take any number of cuts once started, and committed_variant is pinned to ON_HAND_ONLY from the first one"


  # ---- CatalogItem (curation) ----
  - entity: CatalogItem
    initial_state: UNREVIEWED
    terminal_states: []
    transitions:
      - from: UNREVIEWED
        to: APPROVED
        trigger: "POST /curation-reviews"
        actor: CatalogCurator
        preconditions:
          - "the item has at least one ItemAttribute row (ERR_CURATION_ATTRIBUTES_MISSING)"
          - "the item's curated_dimension_json carries a non-null drawing_revision"
        side_effects: ["curation_review_state := APPROVED", "curation_last_reviewed_by := the calling curator's X-User-ID"]
      - from: APPROVED
        to: UNREVIEWED
        trigger: "POST /curation-reviews/{id}/revoke"
        actor: CatalogCurator
        preconditions: ["curation_review_state == APPROVED"]
        side_effects: ["curation_review_state := UNREVIEWED"]
        note: "Cycle: curation approval can be revoked and re-granted"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /curation-reviews (re-review after a dimension revision)"
        actor: CatalogCurator
        preconditions: ["curation_review_state == APPROVED", "the counter values of every ItemAttribute are unchanged"]
        side_effects: ["curation_last_reviewed_by := the calling curator's X-User-ID"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-allocate-stale-order
    parent_entity: CatalogOrder
    write_endpoint: "POST /orders/{id}/allocate"
    occ_field: "expected_order_version"
    description: |
      Allocating an order against a CatalogOrder whose version has advanced since
      the client last observed it is rejected. This captures the case where another
      writer has just released or revised the order (which legitimately changes the
      set of lines to allocate) and the current writer's view of the order is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cutoff-confirm-stale-order
    parent_entity: CatalogOrder
    write_endpoint: "POST /orders/{id}/confirm_cutoff"
    occ_field: "expected_order_version"
    description: |
      Confirming a shipment cutoff against a CatalogOrder whose version has advanced
      since the client last observed it is rejected. This captures the case where a
      pick completion or a re-pick has just mutated the order, so the client's view of
      what was picked is stale and the cutoff cannot be certified.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---------- DUAL-VARIANT 1 (CatalogOrder domain) ----------
  - name: order_total_two_variant
    trigger: "recomputed on line add, on allocate, on pick_complete, and on cancel"
    algorithm: aggregation
    formula: |
      BOTH VARIANTS SHARE STEP 1, AND SHARE IT WITH small_line_fee_total_and_allocate —
      the material subtotal and the full-curation handling fee are one pricing domain:
        S              = sum over eligible lines of line_subtotal_cents
        base_cents     = round_half_up(S * CATALOG_DISCOUNT_FACTOR)
        fee_for_line(line) = round_half_up(line.line_subtotal_cents * SMALL_LINE_FEE_RATE)
      VARIANT A — fee_own_precision (order_total_cents_factor_first)
        total_fee = sum over ALL eligible lines of fee_for_line(line)
        order_total_cents = base_cents + total_fee
      VARIANT B — fee_tiered (order_total_two_variant / small_line_fee_total_and_allocate)
        total_fee = small_line_fee_total_and_allocate(order), whose per-line STEP-1 rounding
        sits on a DIFFERENT fee basis (line_total_cents) and whose per-line figures are
        then corrected by the order-level reduction, so total_fee differs from A whenever
        the order qualifies for the count reduction
        order_total_cents = base_cents + total_fee
    input_set: "lines with line_status in {PENDING, ALLOCATED, PICKED} (SHORT, RESTOCKED and RETURNED lines are excluded from both variants)"
    constants:
      SMALL_LINE_FEE_RATE: 0.03
      CATALOG_DISCOUNT_FACTOR: 0.97
    precision: "integer cents; base_cents rounds once on the order, then each variant's total_fee rounds in its own way — neither may round again at the sum"
    variants:
      - name: fee_own_precision
        when: "the order is quoted, allocated or picked before its shipment cutoff is confirmed"
        difference: "total_fee 2160 on the five-line design fixture (base_cents 69840, order_total 72000): fee basis is a flat 3% of each line_subtotal_cents"
      - name: fee_tiered
        when: "Shipment.shipment_status becomes CUTOFF_CONFIRMED and the order is re-priced"
        difference: "total_fee 3748 on the same fixture (base_cents 69840, order_total 73588): the fee basis is the post-reduction handling pool — BASE_HANDLING_RATE 0.10 gives raw per-line fees 3600/1800/700/600/500, the 250-cent count reduction takes the pool D to 5950, and the 0.37 order-level discount (2202) leaves 3748 — so the order total moves 72000 -> 73588 for identical lines"

  # ---------- DUAL-VARIANT 2 (SquareFootageRequest domain) ----------
  - name: pipe_length_commitment_two_variant
    trigger: "recomputed when a square-footage request is created and whenever its fulfillment_status becomes FULFILLED or RETURNED"
    algorithm: waterfall_allocation
    formula: |
      VARIANT A — forward_looking (pipe_cut_length_forward_looking)
        sorted_lines = request lines ordered by (cut_list_ordinal ASC, created_at ASC)
        remaining = round(available_stock_mm / UNIT_MM_PER_FOOT)
        allocated_feet = 0
        for each line in sorted_lines, stopping at the first line whose remaining < line.requested_feet:
          take = min(line.requested_feet, remaining)
          allocated_feet += take
          remaining -= take
        committed_length_feet = allocated_feet + round(WIP_STOCK_MM / UNIT_MM_PER_FOOT)
      VARIANT B — on_hand_only (pipe_cut_length_on_hand_only)
        same sorted order, same first-failing-line stop rule
        committed_length_feet = allocated_feet + round(FINISHED_STOCK_MM / UNIT_MM_PER_FOOT)
    input_set: "cut lines with line_status in {PLANNED, CUT}; the walk stops at the first line that cannot be fully satisfied from stock already counted in remaining"
    constants:
      UNIT_MM_PER_FOOT: 304.8
      WIP_STOCK_MM: 182880.0
      FINISHED_STOCK_MM: 121920.0
    precision: "integer feet, round_half_up"
    variants:
      - name: forward_looking
        when: "the consignment is quoted before any cut is made"
        difference: "adds cut-in-progress pipe (WIP) that is not counted as available length — gives an OPTIMISTIC same-day commitment: 960 feet on the three-line design fixture, against 560 feet for on_hand_only"
      - name: on_hand_only
        when: "the consignment has at least one CUT line and is re-quoted after cutting has started"
        difference: "replaces the cut-in-progress allowance with finished-goods allowance, giving a strictly LOWER committed length for identical stock — 560 against 960, and 40 against 40 on the two-line control where the second line's request falls past the shorter stock"

  # ---------- COMBINATORIAL mode (b): nested rounding ----------
  - name: small_line_fee_total_and_allocate
    trigger: "recomputed on allocate, on every pick_complete, and on cancel"
    algorithm: tiered_pricing
    formula: |
      STEP 1 — per-line eligibility and raw fee
        for each line with line_status in {PENDING, ALLOCATED, PICKED}:
          if line.quantity <= line.item.curation_bundle_size:
            line.raw_fee_cents = round_half_up(line.line_subtotal_cents * BASE_HANDLING_RATE)
          else:
            line.raw_fee_cents = 0
      STEP 2 — order-level threshold reduction
        if count(eligible lines) >= SMALL_LINE_COUNT_THRESHOLD:
          for each eligible line: line.raw_fee_cents = line.raw_fee_cents - SMALL_LINE_COUNT_REDUCTION_CENTS, floored at 0
      STEP 3 — rounding ORDER (pinned: round the ORDER pool, then allocate; allocation must not re-round)
        D = sum over eligible lines of line.raw_fee_cents
        order_level_discount_cents = round_half_up(D * ORDER_LEVEL_DISCOUNT_RATE)
        total_fee_cents = D - order_level_discount_cents
      STEP 4 — largest-remainder allocation of total_fee_cents across eligible lines,
        ordered by (line_subtotal_cents DESC, created_at ASC), integer floor division first,
        then the leftover cents go one each to the lines at the front of that order
      STEP 5 — write CatalogOrder.total_small_line_fee_cents = total_fee_cents and each eligible line's allocated_small_line_fee_cents
      STEP 6 — this total_fee_cents IS the fee term of the fee_tiered variant of order_total_two_variant;
        order_total_two_variant must never add a second fee computed on a different basis
    input_set: "lines with line_status in {PENDING, ALLOCATED, PICKED}; SHORT, RESTOCKED and RETURNED lines are excluded and their allocated_small_line_fee_cents is cleared to 0"
    constants:
      BASE_HANDLING_RATE: 0.10
      SMALL_LINE_COUNT_THRESHOLD: 5
      SMALL_LINE_COUNT_REDUCTION_CENTS: 250
      ORDER_LEVEL_DISCOUNT_RATE: 0.37
    precision: "integer cents; per-line rounding happens at STEP 1 only, order rounding at STEP 3, and STEP 4 must not re-round"
    variants: []

  # ---------- COMBINATORIAL mode (c): evaluation order ----------
  - name: order_total_cents_factor_first
    trigger: "system re-evaluation once Shipment.shipment_status becomes CUTOFF_CONFIRMED"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED — the small-line fee is computed FIRST, on its own raw
      fee basis, and only then is it added to the order's own discounted subtotal.
      The ORDER-LEVEL DISCOUNT RATE is deliberately NOT an input to anything in this
      formula: writing `order_total_cents = f(total)` with `fee = g(order_total_cents)`
      would be a circular definition whose value depends on which side is evaluated
      first, and the fee must never be keyed on a tier of the total it is part of.
        base_cents = round_half_up((sum over eligible lines of line_subtotal_cents) * CATALOG_DISCOUNT_FACTOR)
        total_fee  = sum over eligible lines of round_half_up(line.line_subtotal_cents * SMALL_LINE_FEE_RATE)
        order_total_cents = base_cents + total_fee
      Design fixture (five eligible lines of 36000, 18000, 7000, 6000 and 5000 cents):
        base_cents = round_half_up(72000 * 0.97) = 69840
        total_fee  = 1080 + 540 + 210 + 180 + 150 = 2160
        order_total_cents = 72000
      Design fixture (two eligible lines of 1000 cents each, the 29.1-cent half-way tie):
        base_cents = round_half_up(2000 * 0.97) = 1940
        each raw line fee = round_half_up(1000 * 0.03) = 30  ->  total_fee = 60
        order_total_cents = 2000
      Had the fee been sized off the already-discounted line (0.97 * 0.03 * 1000 = 29.1,
      which is exactly half way), the result would have been 58 and a total of 1998 —
      a 2-cent error introduced purely by evaluating the discount first.
    input_set: "lines with line_status in {PENDING, ALLOCATED, PICKED}"
    constants:
      SMALL_LINE_FEE_RATE: 0.03
      CATALOG_DISCOUNT_FACTOR: 0.97
    precision: "integer cents; round_half_up applied once per eligible line and once on base_cents, never at the sum"
    variants: []

  # ---------- COMBINATORIAL mode (a): ≥3-input tiered + conditional + nested min/max ----------
  - name: freight_charge_two_variant
    trigger: "computed on POST /orders/{id}/confirm_cutoff"
    algorithm: tiered_pricing
    formula: |
      billable_weight_kg = round_half_up(sum over lines of line.allocated_units * item_unit_weight_kg, 2)
      IF billable_weight_kg < 25.0:      base_rate_cents = 450
      ELSE IF billable_weight_kg < 100.0: base_rate_cents = 450 + 28 * ceil(billable_weight_kg - 25.0)
      ELSE:                               base_rate_cents = 450 + 28 * 75 + 19 * ceil(billable_weight_kg - 100.0)
      zone_surcharge_cents = 0 when DC.local_zone == account delivery zone, else ZONE_SURCHARGE_CENTS
      IF CatalogOrder.same_day_committed == false:  urgency_multiplier = 1.0
      ELSE IF CatalogOrder.commit_minutes_before_cutoff >= EARLY_COMMIT_MINUTES: urgency_multiplier = 1.1
      ELSE:                              urgency_multiplier = 1.6
      freight_rate_cents = round_half_up((base_rate_cents + zone_surcharge_cents) * urgency_multiplier)
    input_set: "all lines of the order with line_status PICKED; shipped units only"
    constants:
      ZONE_SURCHARGE_CENTS: 275
      EARLY_COMMIT_MINUTES: 120
    precision: "integer cents, round_half_up; the three-way tier selection rounds once on the weight delta, the urgency step rounds once more on the whole"
    variants:
      - name: leg_estimate
        when: "before cutoff confirmation, for the order acknowledgement page — the order was allocated with at least one candidate DC still ahead of its local cutoff"
        difference: "urgency_multiplier is pinned to 1.1 and CatalogOrder.commit_minutes_before_cutoff is ignored, giving 798 cents on the design fixture against the 1160 cents the cutoff_certified variant records for the identical weight and zone"
      - name: cutoff_certified
        when: "at POST /orders/{id}/confirm_cutoff, recorded on the Shipment"
        difference: "when same_day_committed is true and CatalogOrder.commit_minutes_before_cutoff < EARLY_COMMIT_MINUTES the urgency multiplier is 1.6 rather than the estimate's 1.1, so the certified figure is 1160 against 798 for the identical weight and zone"

  # ---------- COMBINATORIAL (b) variant on the Shipment domain ----------
  - name: freight_surcharge_and_total
    trigger: "computed on POST /orders/{id}/confirm_cutoff"
    algorithm: tiered_pricing
    formula: |
      surcharge = round_half_up(Shipment.freight_rate_cents * SHIPMENT_SURCHARGE_RATE_from_shipment_variant)
      Shipment.freight_charge_cents = Shipment.freight_rate_cents + surcharge
      Shipment.freight_charge_cents is the single authoritative figure and is mirrored onto CatalogOrder.freight_charge_cents
    input_set: "the Shipment being cut off; its service_level and urgency variant"
    constants:
      GROUND_SURCHARGE_RATE: 0.00
      TWO_DAY_SURCHARGE_RATE: 0.30
      OVERNIGHT_SURCHARGE_RATE: 0.60
    precision: "integer cents, round_half_up; the surcharge is rounded per shipment, never summed then rounded"
    variants: []

  - name: live_availability_at_dc
    trigger: "computed on every read of an item's availability and on every allocate"
    algorithm: aggregation
    formula: |
      live_availability_at_dc(item, dc) = StockAtDC(item, dc).available_units
                                       = StockAtDC(item, dc).on_hand_units - StockAtDC(item, dc).reserved_units
      aggregate_order_availability(item) = sum over every StockAtDC row of that item of
                                       (on_hand_units - reserved_units), counting only rows with available_units > 0
      NOT excluding rows whose DC has cutoff_passed == true
    input_set: "StockAtDC rows for the requested item; rows with available_units <= 0 contribute zero"
    constants: {}
    precision: "integer units"
    variants: []

  # ---------- COMBINATORIAL (c) ----------
  - name: inventory_positioning_decision
    trigger: "computed at POST /distribution-centers/{id}/roll_cutoff before cutoff_sequence_index is incremented"
    algorithm: threshold
    formula: |
      EVALUATION ORDER IS PINNED — the order is classified FIRST from the items that are genuinely IN STOCK at this DC, and only then is the long-tail branch consulted. Writing the long-tail branch first makes the classification depend on a field it does not read, which is forbidden.
        eligible_skus = { sku : StockAtDC(sku, this DC).on_hand_units >= 1 }
        ordered_skus  = eligible_skus sorted by (sku ASC, StockAtDC.created_at ASC)
        in_stock_count = |ordered_skus|
        IF in_stock_count >= POSITIONING_SKU_THRESHOLD: positioning_result = "OK"
        ELSE IF in_stock_count > 0 AND every ordered_sku belongs to an item with long_tail == true:
              positioning_result = "LONG_TAIL_DEFICIT"
        ELSE: positioning_result = "UNDERSTOCKED"
    input_set: "every StockAtDC row belonging to this DC (no status filter — on_hand_units >= 1 is the eligibility predicate)"
    constants:
      POSITIONING_SKU_THRESHOLD: 2
    precision: "n/a (enum output)"
    variants: []

  - name: dc_allocation_selector
    trigger: "computed on POST /orders/{id}/allocate"
    algorithm: projection
    formula: |
      ELIGIBILITY FILTER (candidate set = every DistributionCenter satisfying ALL of):
        1. region == CustomerAccount.home_region
        2. for EVERY line of the order: StockAtDC(line.item_id, dc).on_hand_units >= line.quantity
      RANKING EXPRESSION (sort key = estimated total delivery time):
        estimated_total_delivery_seconds(dc) =
            (dc.cutoff_passed ? SECONDS_PER_DAY : 0)
          + (dc.region == CustomerAccount.home_region ? 0 : REGION_CROSS_PENALTY_SECONDS)
          + dc.transit_seconds
        ascending — smaller total wins
      TIE-BREAK (applied in order):
        1. dc.cutoff_sequence_index DESC
        2. dc.created_at ASC
      FALLBACK when the candidate set is empty: ERR_NO_ELIGIBLE_DC (HTTP 409)
    input_set: "all DistributionCenter rows"
    constants:
      SECONDS_PER_DAY: 86400
      REGION_CROSS_PENALTY_SECONDS: 28800
    precision: "integer seconds"
    variants: []

  - name: supplier_selector
    trigger: "computed on POST /suppliers/{id}/availability_reports"
    algorithm: projection
    formula: |
      ELIGIBILITY FILTER (candidate set = every Supplier satisfying ALL of):
        1. long_tail_authorized == true
        2. min_stock_commitment_units >= reported_available_units for the reported item
      RANKING EXPRESSION: performance_rating_units DESC
      TIE-BREAK: created_at ASC
      FALLBACK when the candidate set is empty: ERR_SUPPLIER_CANDIDATE_EMPTY (HTTP 409)
    input_set: "all Supplier rows"
    constants: {}
    precision: "integer units"
    variants: []

  - name: damaged_value_and_suspension
    trigger: "computed when a DamageClaim is opened and again when a return is received"
    algorithm: weighted_scoring
    formula: |
      damaged_unit_ratio_breach(line) =
          (line.damaged_units > 0) AND (line.damaged_units * item.unit_price_cents >= DAMAGE_RATIO_TRIGGER_CENTS)
                     ^^ the trigger INCLUSIVE at the boundary: exactly 10000 cents suspends, 9999 does not
      when damaged_unit_ratio_breach returns true: CatalogItem.catalog_status := SUSPENDED
      NOTE — order money is owned by order_total_two_variant; no damage figure is ever added into
      CatalogOrder.order_total_cents, and DamageClaim.damage_value_cents is a reported exposure
      quantity, not an order charge (the claim itself resolves at zero charge).
    input_set: "the line and item named by the claim"
    constants:
      DAMAGE_VALUE_FACTOR: 0.60
      DAMAGE_RATIO_TRIGGER_CENTS: 10000
    precision: "integer cents (damage_value_cents, round_half_up); the trigger comparison is an exact integer comparison"
    variants: []

  - name: restock_cap_allocation
    trigger: "computed at POST /returns/{id}/approve"
    algorithm: waterfall_allocation
    formula: |
      ORDER BY LINE: (delivered line_subtotal_cents DESC, line.created_at ASC)
      remaining_ratio = 0.80
      for each line in order:
        line.restock_units = floor(line.requested_return_units * remaining_ratio)
        line.damaged_units = line.requested_return_units - line.restock_units
        remaining_ratio = max(0.0, remaining_ratio - 0.30)
      lines after the third receive restock_units = 0 and are routed entirely to the damage path
    input_set: "every line named by the ReturnAuthorization"
    constants:
      RESTOCK_CAP_UNITS: 5
      RESTOCK_RATIO_START: 0.80
      RESTOCK_RATIO_STEP: 0.30
    precision: "integer units, floor"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the calling role is permitted to invoke this operation"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every resource referenced in the path exists, validated left-to-right in path order (an unresolvable order id is ERR_ORDER_NOT_FOUND, an unresolvable line id is ERR_LINE_NOT_FOUND, and so on per entity)"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "[POST /orders/{id}/release, POST /orders/{id}/allocate, POST /orders/{id}/lines/{line_id}/pick, POST /orders/{id}/lines/{line_id}/pick_complete, POST /orders/{id}/confirm_cutoff, POST /orders/{id}/cancel, POST /returns/{id}/approve, POST /returns/{id}/receive, POST /damage-claims/{id}/resume_fulfillment]"

  - priority: 4
    category: existence
    check: "the account behind the action owns the order (order.owner_account_id == X-User-ID)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "[POST /orders/{id}/release, POST /orders/{id}/allocate, POST /orders/{id}/cancel, POST /returns]"

  - priority: 5
    category: state
    check: "the target resource is not already in one of its declared terminal_states"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "every state-transition endpoint whose target entity declares terminal_states"

  - priority: 6
    category: state
    check: "the target resource is in a state that permits this operation, and the transition trigger is listed for that state"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "the body's expected_order_version equals CatalogOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "[POST /orders/{id}/allocate, POST /orders/{id}/confirm_cutoff]"

  - priority: 8
    category: business_safety
    check: "the allocated DC is not in posture LOCKDOWN"
    error_id: ERR_DC_LOCKDOWN
    http_status: 409
    applies_to: "[POST /orders/{id}/lines/{line_id}/pick]"

  - priority: 9
    category: business_safety
    check: "the item whose units are being resumed is not SUSPENDED"
    error_id: ERR_ITEM_SUSPENDED
    http_status: 409
    applies_to: "[POST /damage-claims/{id}/resume_fulfillment]"

  - priority: 10
    category: business_constraint
    check: "the item's curation_review_state is APPROVED"
    error_id: ERR_CURATION_NOT_APPROVED
    http_status: 409
    applies_to: "[POST /orders/{id}/release, POST /orders]"

  - priority: 11
    category: business_constraint
    check: "the order's allocated DC is a member of the candidate DC set produced by dc_allocation_selector"
    error_id: ERR_DC_NOT_CANDIDATE
    http_status: 409
    applies_to: "[POST /orders/{id}/confirm_cutoff]"

  - priority: 12
    category: business_temporal
    check: "the order's committed delivery deadline does not fall on or before any candidate DC's local_cutoff_time, evaluated on the local weekday first and the local wall-clock time second"
    error_id: ERR_CUTOFF_WINDOW_PASSED
    http_status: 422
    applies_to: "[POST /orders, POST /orders/{id}/allocate]"

  - priority: 13
    category: business_temporal
    check: "the requested promised_delivery_by is not in the past relative to the DC's local clock"
    error_id: ERR_PROMISE_DATE_IN_PAST
    http_status: 422
    applies_to: "[POST /orders/{id}/confirm_cutoff]"

  - priority: 14
    category: business_referential
    check: "every claimed return unit carries a removed_manufacturer_part_number"
    error_id: ERR_RETURN_PART_NUMBER_REQUIRED
    http_status: 422
    applies_to: "[POST /returns/{id}/receive]"

  - priority: 15
    category: business_fiscal
    check: "the allocation would not push DC.inbound_reserved_units past inbound_capacity_units"
    error_id: ERR_INBOUND_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "[POST /orders/{id}/allocate]"

  - priority: 16
    category: business_referential
    check: "at least one Supplier survives the supplier_selector eligibility filter"
    error_id: ERR_SUPPLIER_CANDIDATE_EMPTY
    http_status: 409
    applies_to: "[POST /suppliers/{id}/availability_reports]"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- clock / test driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. The server's startup default time is exactly 2026-09-01T00:00:00Z and is never replaced by wall-clock time. Each DistributionCenter.local_current_time is set to current_utc + that DC's utc_offset_minutes, and each DC's cutoff_passed flag is recomputed from its local weekday and local_cutoff_time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: ClockTick
    side_effects: ["DistributionCenter.local_current_time recomputed for every DC", "DistributionCenter.cutoff_passed recomputed for every DC"]

  # ---- DistributionCenter ----
  - method: POST
    path: "/distribution-centers"
    description: "Create a distribution center"
    roles: [PlatformAdmin]
    code: 201
    input: [code, region, local_zone, local_cutoff_time, utc_offset_minutes, inbound_capacity_units, transit_seconds]
    output: DistributionCenter
    side_effects: []

  - method: GET
    path: "/distribution-centers"
    description: "List distribution centers"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker, CatalogCurator]
    code: 200
    input: ["region?", "limit?", "offset?"]
    output: DistributionCenter[]
    side_effects: []

  - method: GET
    path: "/distribution-centers/{id}"
    description: "Read a distribution center, including its operations_posture"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker, CatalogCurator]
    code: 200
    input: []
    output: DistributionCenter
    side_effects: []

  - method: POST
    path: "/distribution-centers/{id}/roll_cutoff"
    description: "Roll this DC's daily cutoff period: recompute each stock row's positioning_flag and each item's inventory positioning assessment, then increment cutoff_sequence_index and re-derive operations_posture"
    roles: [DCManager]
    code: 200
    input: []
    output: DistributionCenter
    side_effects: ["recompute inventory_positioning_decision for every StockAtDC row of this DC", "cutoff_sequence_index += 1", "operations_posture re-derived"]

  - method: POST
    path: "/distribution-centers/{id}/reeducate"
    description: "Raise or clear the DC's open quality/damage hold (opening it drives posture LOCKDOWN, clearing the last one returns posture to OPEN)"
    roles: [DCManager]
    code: 200
    input: [hold_action, "reason?"]
    output: DistributionCenter
    side_effects: ["operations_posture recomputed", "cascade: Shipment HELD/CUTOFF_CONFIRMED transitions", "cascade: CatalogOrder fulfillment_status reverts"]



  # ---- Supplier ----
  - method: POST
    path: "/suppliers"
    description: "Create a supplier with a long-tail min-stock commitment"
    roles: [PlatformAdmin]
    code: 201
    input: [supplier_name, home_dc_id, primary_attribute_name, primary_attribute_value, long_tail_authorized, min_stock_commitment_units]
    output: Supplier
    side_effects: []

  - method: GET
    path: "/suppliers"
    description: "List suppliers"
    roles: [PlatformAdmin, CatalogCurator, DCManager]
    code: 200
    input: ["long_tail_authorized?", "home_dc_id?", "primary_attribute_name?", "primary_attribute_value?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []

  - method: GET
    path: "/suppliers/{id}"
    description: "Read a supplier, including commitment_breach_count and performance_rating_units"
    roles: [PlatformAdmin, CatalogCurator, DCManager]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/suppliers/{id}/availability-reports"
    description: "List the availability reports filed against this supplier, newest first"
    roles: [PlatformAdmin, CatalogCurator, DCManager]
    code: 200
    input: ["limit?", "offset?"]
    output: SupplierAvailabilityReport[]
    side_effects: []

  - method: POST
    path: "/suppliers/{id}/availability-reports"
    description: "Report long-tail availability and run the supplier selector: the highest performance_rating_units among long-tail-authorized suppliers whose min_stock_commitment_units covers the reported units wins; a breach is recorded against the reporting supplier when their report falls short of their commitment"
    roles: [PlatformAdmin]
    code: 201
    input: [item_id, reported_available_units]
    output: Supplier
    side_effects: ["recompute supplier_selector", "Supplier.commitment_breach_count += 1 when reported_available_units < min_stock_commitment_units", "Supplier.performance_rating_units := 100 - 10 * commitment_breach_count"]

  # ---- CatalogItem / curation ----
  - method: POST
    path: "/items"
    description: "Create a catalog item with its dimensional drawing payload"
    roles: [CatalogCurator]
    code: 201
    input: [sku, description, material_spec, long_tail, unit_price_cents, unit_weight_kg, curation_bundle_size, curated_dimension_json]
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/items"
    description: "Search the catalog; query parameters filter the catalog and every result carries its live_availability_at_dc and unit_price_cents"
    roles: [PlatformAdmin, CatalogCurator, CustomerAccount, WarehousePicker, DCManager]
    code: 200
    input: ["q?", "material_spec?", "region?", "long_tail?", "catalog_status?", "dc_id?", "supplier_id?", "limit?", "offset?"]
    output: CatalogItem[]
    side_effects: []

  - method: GET
    path: "/items/{id}"
    description: "Read one catalog item with its live DC availability"
    roles: [PlatformAdmin, CatalogCurator, CustomerAccount, WarehousePicker, DCManager]
    code: 200
    input: []
    output: CatalogItem
    side_effects: []

  - method: GET
    path: "/items/{id}/order-lines"
    description: "List every order line that requests this item, oldest first"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker]
    code: 200
    input: ["limit?", "offset?"]
    output: CatalogOrderLine[]
    side_effects: []

  - method: GET
    path: "/items/{id}/availability-reports"
    description: "List the supplier availability reports filed against this item"
    roles: [PlatformAdmin, CatalogCurator, DCManager]
    code: 200
    input: ["limit?", "offset?"]
    output: SupplierAvailabilityReport[]
    side_effects: []

  - method: POST
    path: "/items/{id}/attributes"
    description: "Attach one standardized technical attribute row to an item (immutable thereafter)"
    roles: [CatalogCurator]
    code: 201
    input: [attribute_name, attribute_value, unit_of_measure]
    output: ItemAttribute
    side_effects: []

  - method: GET
    path: "/items/{id}/attributes"
    description: "List the standardized technical attributes of an item"
    roles: [PlatformAdmin, CatalogCurator, CustomerAccount, WarehousePicker, DCManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ItemAttribute[]
    side_effects: []

  - method: POST
    path: "/items/{id}/cross-references"
    description: "Attach a cross-reference to another manufacturer's part number (immutable thereafter)"
    roles: [CatalogCurator]
    code: 201
    input: [referenced_manufacturer, referenced_part_number, compatibility_note]
    output: ItemCrossReference
    side_effects: []

  - method: GET
    path: "/items/{id}/cross-references"
    description: "List the cross-references of an item"
    roles: [PlatformAdmin, CatalogCurator, CustomerAccount, WarehousePicker, DCManager]
    code: 200
    input: ["limit?", "offset?"]
    output: ItemCrossReference[]
    side_effects: []

  - method: POST
    path: "/curation-reviews"
    description: "Approve the catalog data of every item in one curation bundle; requires at least one attribute row per item and a non-null drawing_revision"
    roles: [CatalogCurator]
    code: 201
    input: [item_ids]
    output: CurationReview
    side_effects: ["CatalogItem.curation_review_state := APPROVED for each item", "CatalogItem.curation_last_reviewed_by := caller X-User-ID"]

  - method: GET
    path: "/curation-reviews"
    description: "List curation review batches"
    roles: [PlatformAdmin, CatalogCurator]
    code: 200
    input: ["review_status?", "limit?", "offset?"]
    output: CurationReview[]
    side_effects: []

  - method: GET
    path: "/curation-reviews/{id}"
    description: "Read one curation review batch"
    roles: [PlatformAdmin, CatalogCurator]
    code: 200
    input: []
    output: CurationReview
    side_effects: []

  - method: GET
    path: "/curation-reviews/{id}/items"
    description: "List the item membership rows of one curation review batch"
    roles: [PlatformAdmin, CatalogCurator]
    code: 200
    input: ["limit?", "offset?"]
    output: CurationReviewItem[]
    side_effects: []

  - method: POST
    path: "/curation-reviews/{id}/revoke"
    description: "Revoke the curation approval held by this review batch, returning its items to UNREVIEWED"
    roles: [CatalogCurator]
    code: 200
    input: []
    output: CurationReview
    side_effects: ["review_status := REVOKED", "CatalogItem.curation_review_state := UNREVIEWED for every item of the batch"]

  - method: GET
    path: "/items/{id}/curation-review-items"
    description: "List the curation review membership rows recorded for this item"
    roles: [PlatformAdmin, CatalogCurator]
    code: 200
    input: ["limit?", "offset?"]
    output: CurationReviewItem[]
    side_effects: []

  # ---- Inventory positioning ----
  - method: POST
    path: "/stock"
    description: "Record a stock row for an item at a DC and set that row's most recently completed period demand and inbound figures"
    roles: [DCManager]
    code: 201
    input: [item_id, dc_id, account_id, on_hand_units, daily_demand_units, inbound_daily_units]
    output: InventoriedStock
    side_effects: []

  - method: GET
    path: "/stock"
    description: "List stock rows, filterable by item, by DC and by account"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker]
    code: 200
    input: ["item_id?", "dc_id?", "account_id?", "limit?", "offset?"]
    output: InventoriedStock[]
    side_effects: []

  - method: GET
    path: "/stock/{id}"
    description: "Read one stock row with its available_units and positioning_flag"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker]
    code: 200
    input: []
    output: InventoriedStock
    side_effects: []

  # ---- CustomerAccount / orders ----
  - method: POST
    path: "/accounts"
    description: "Create a customer account"
    roles: [PlatformAdmin]
    code: 201
    input: [account_name, delivery_zone, home_region]
    output: CustomerAccount
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List customer accounts"
    roles: [PlatformAdmin, CustomerAccount, DCManager]
    code: 200
    input: ["home_region?", "limit?", "offset?"]
    output: CustomerAccount[]
    side_effects: []

  - method: GET
    path: "/accounts/{id}"
    description: "Read a customer account"
    roles: [PlatformAdmin, CustomerAccount, DCManager]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []



  - method: POST
    path: "/orders"
    description: "Create a small-line catalog order (header plus every line in one call); every line's item must be curated and every line must clear the delivery-window validation"
    roles: [CustomerAccount]
    code: 201
    input: [account_id, lines, "promised_delivery_by?"]
    output: CatalogOrder
    side_effects: ["recompute order_total_two_variant (factor_last variant)", "recompute order_line_count_guard"]

  - method: GET
    path: "/distribution-centers/{id}/order-lines"
    description: "List every order line this DC allocated"
    roles: [PlatformAdmin, CustomerAccount, DCManager, WarehousePicker]
