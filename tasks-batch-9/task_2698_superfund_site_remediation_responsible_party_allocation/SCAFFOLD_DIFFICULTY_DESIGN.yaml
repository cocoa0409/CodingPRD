      - name: collect_then_void_restores_the_money_ledger_identity_around_an_orphan_write_off
        grounds:
          - calculations.cost_recovery_ledger
          - state_machines.PotentiallyResponsibleParty.PARTICIPATING_to_ORPHAN
          - state_machines.AllocationShare.ALLOCATED_to_ORPHANED
          - state_machines.CostRecoveryAction.ACCEPTED_to_COLLECTED
          - state_machines.CostRecoveryAction.COLLECTED_to_VOIDED
          - entities.Site.fields.orphan_write_off_cents
          - entities.Site.fields.unrecovered_cost_cents
          - endpoints[POST /cost-recovery-actions/{id}/collection]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: the MONEY identity
          recovered_cost_cents + orphan_write_off_cents + unrecovered_cost_cents == total_response_cost_cents,
          in whole cents rather than percentages, and with an orphan write-off (847770) standing in the
          middle of it so the reversal cannot simply mirror the receipt. Two partial receipts accumulate
          to a full collection and the voiding must return the ledger to its pre-collection numbers
          exactly, without disturbing the orphan bucket.
        test_recipe:
          setup:
            - "Site listed with three PARTICIPATING parties: A 3000 t class I, B 1000 t class III, C 40 t class IV, all VERIFIED (no ownership periods, so the ownership weight renormalises away)."
            - "Round adopted A ACCEPT / B ACCEPT / C REJECT (accept_share_pct 99.32): final_pct A 80.97, B 18.35, C 0.68."
            - "One oversight posting of 4000000 cents: total_response_cost_cents == 4620000."
            - "B is then declared defunct, so orphan_share_pct == 18.35 and orphan_write_off_cents == 847770."
