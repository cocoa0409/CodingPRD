      - name: correction_hint_mapping_per_rejection_code
        claim_type: correct_result
        grounds: [calculations.correction_hint_mapping, entities.FilingAttempt.fields.correction_hint]
        distinguishing_aspect: "Each rejection code maps to its exact guided-correction string; R2000_DEPENDENT_CLAIMED yields the dependent-review hint and leaves outcome=REJECTED."
