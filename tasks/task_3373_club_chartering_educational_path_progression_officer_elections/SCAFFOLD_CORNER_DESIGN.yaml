# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: club_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.Club.fields.charter_status
          - entities.Club.fields.good_standing
          - entities.Club.fields.dues_cycle_index
          - entities.Club.fields.cycle_opened_at
        distinguishing_aspect: "A club created with only the required fields comes back 201 with charter_status ORGANIZING, good_standing GOOD, dues_cycle_index 0, coaching_status NONE and a server-minted id."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id", status: "$.data.charter_status", standing: "$.data.good_standing", cycle: "$.data.dues_cycle_index", coaching: "$.data.coaching_status", version: "$.data.version" }
          assert:
            - "the response is HTTP 201 with response_type object"
            - "Club.${club_id}.charter_status == ORGANIZING and Club.${club_id}.good_standing == GOOD"
            - "Club.${club_id}.dues_cycle_index == 0 and Club.${club_id}.version == 1"
            - "Club.${club_id}.cycle_opened_at == 2026-09-01T00:00:00Z and Club.${club_id}.charter_date == null"
            - "Club.${club_id}.coaching_status == NONE"

      - name: club_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A GET on a well-formed UUID that was never created returns the error envelope with ERR_NOT_FOUND and HTTP 404 rather than an empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /toastmasters/clubs/00000000-0000-4000-8000-000000000000"
              as: WorldHeadquarters
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is HTTP 404 with response_type error"
            - "the error envelope carries error_id ERR_NOT_FOUND"

      - name: membership_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Membership.fields.join_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A membership create that omits the required join_date is rejected with ERR_INVALID_REQUEST and HTTP 400 instead of defaulting the field."
        test_recipe:
          setup: ["one ORGANIZING club exists"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
          trigger:
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", first_time_member: true }
              as: WorldHeadquarters
              captures: { err: "$.data.error_id" }
          assert:
            - "the response is HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "no Membership row exists for the club afterwards"

      - name: membership_list_reports_pagination_metadata
        claim_type: listing
        grounds:
          - entities.Membership.fields.club_id
          - entities.Membership.fields.status
        distinguishing_aspect: "The membership list honours limit and offset and reports total_count and has_more from the pagination envelope while filtering by club_id."
        test_recipe:
          setup: ["one ORGANIZING club with three paid memberships"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [ { full_name: "M1", email: "m1@example.org" }, { full_name: "M2", email: "m2@example.org" }, { full_name: "M3", email: "m3@example.org" } ] }
              as: WorldHeadquarters
          trigger:
            - call: "GET /toastmasters/memberships?club_id=${club_id}&limit=2&offset=0"
              as: WorldHeadquarters
              captures: { page_total: "$.meta.total_count", page_has_more: "$.meta.has_more", page_len: "$.data" }
          assert:
            - "the response is HTTP 200 with response_type array"
            - "the page carries exactly 2 memberships and total_count == 3"
            - "has_more == true for the first page"
            - "every returned membership has club_id equal to the club's id"

      - name: club_derived_counters_after_bulk_enrollment
        claim_type: computed_fields
        grounds:
          - entities.Club.fields.paid_member_count
          - entities.Club.fields.total_member_count
          - entities.Club.fields.new_member_count_this_cycle
          - entities.Membership.fields.dues_paid_through_cycle
        distinguishing_aspect: "Bulk enrollment recomputes the club's derived counters in the same request: 20 enrolled members with dues paid leave paid_member_count 20, total_member_count 20 and new_member_count_this_cycle 20."
        test_recipe:
          setup: ["one ORGANIZING club"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
          trigger:
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [
                  { full_name: "M1", email: "m1@example.org" }, { full_name: "M2", email: "m2@example.org" },
                  { full_name: "M3", email: "m3@example.org" }, { full_name: "M4", email: "m4@example.org" },
                  { full_name: "M5", email: "m5@example.org" }, { full_name: "M6", email: "m6@example.org" },
                  { full_name: "M7", email: "m7@example.org" }, { full_name: "M8", email: "m8@example.org" },
                  { full_name: "M9", email: "m9@example.org" }, { full_name: "M10", email: "m10@example.org" },
                  { full_name: "M11", email: "m11@example.org" }, { full_name: "M12", email: "m12@example.org" },
                  { full_name: "M13", email: "m13@example.org" }, { full_name: "M14", email: "m14@example.org" },
                  { full_name: "M15", email: "m15@example.org" }, { full_name: "M16", email: "m16@example.org" },
                  { full_name: "M17", email: "m17@example.org" }, { full_name: "M18", email: "m18@example.org" },
                  { full_name: "M19", email: "m19@example.org" }, { full_name: "M20", email: "m20@example.org" }] }
              as: WorldHeadquarters
              captures: { created: "$.data.created_count", failed: "$.data.failed_count" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { paid: "$.data.paid_member_count", total: "$.data.total_member_count", new_members: "$.data.new_member_count_this_cycle", score: "$.data.good_standing_score" }
          assert:
            - "created_count == 20 and failed_count == 0"
            - "Club.${club_id}.paid_member_count == 20 and Club.${club_id}.total_member_count == 20"
            - "Club.${club_id}.new_member_count_this_cycle == 20 because every membership's first paid cycle equals the club's cycle index 0"
            - "Club.${club_id}.good_standing_score == 36 and Club.${club_id}.good_standing stays GOOD because posture only moves at close-cycle"

  - section: state_machines
    instances:
      - name: evaluation_on_approved_completion_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ProjectCompletion.APPROVED_to_RETURNED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A completion already in APPROVED cannot take the evaluation transition again: the second evaluation returns ERR_INVALID_STATE with HTTP 409 and no derived counter moves."
        test_recipe:
          setup: ["one ORGANIZING club with one paid member whose LEVEL_1 completion is APPROVED"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "POST /toastmasters/memberships/${ms_ada_id}/renew"
              payload: {}
              as: Member
              as_user_id: "${m_ada_id}"
            - call: "GET /toastmasters/memberships/${ms_ada_id}"
              as: WorldHeadquarters
              captures: { ms_ada_v: "$.data.version" }
            - call: "POST /toastmasters/education-paths"
              payload: { membership_id: "${ms_ada_id}", path_code: "DYNAMIC_LEADERSHIP", expected_membership_version: "${ms_ada_v}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { path_id: "$.data.id", path_v: "$.data.version" }
            - call: "POST /toastmasters/project-completions"
              payload: { path_id: "${path_id}", project_code: "L1-ICE-BREAKER", project_kind: "SPEECH", level: 1, speech_minutes: 6, delivered_at: "2026-09-08T18:30:00Z", expected_education_path_version: "${path_v}" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { pc_id: "$.data.id" }
            - call: "POST /toastmasters/project-completions/${pc_id}/evaluation"
              payload: { evaluation_summary: "Confident first speech" }
              as: Member
              as_user_id: "${m_ada_id}"
            - call: "POST /toastmasters/project-completions/${pc_id}/review"
              payload: { decision: "APPROVE" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { approved_status: "$.data.status" }
            - call: "GET /toastmasters/education-paths/${path_id}"
              as: WorldHeadquarters
              captures: { approved_before: "$.data.approved_projects_at_level" }
          trigger:
            - call: "POST /toastmasters/project-completions/${pc_id}/evaluation"
              payload: { evaluation_summary: "Second opinion" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /toastmasters/education-paths/${path_id}"
              as: WorldHeadquarters
              captures: { approved_after: "$.data.approved_projects_at_level" }
          assert:
            - "the second evaluation returns ERR_INVALID_STATE with HTTP 409"
            - "ProjectCompletion.${pc_id}.status stays APPROVED"
            - "EducationPath.${path_id}.approved_projects_at_level is unchanged at 1"

      - name: new_meeting_starts_scheduled_with_seven_required_slots
        claim_type: initial_state
        grounds:
          - entities.MeetingEvent.fields.status
          - entities.MeetingEvent.fields.required_role_slots
          - entities.MeetingEvent.fields.quorum_met
        distinguishing_aspect: "A freshly scheduled meeting starts SCHEDULED with required_role_slots 7, filled_role_slots 0, quorum_met false and held_at null."
        test_recipe:
          setup: ["one ORGANIZING club with one paid member"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id", club_v: "$.data.version" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v2: "$.data.version" }
          trigger:
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v2}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_id: "$.data.id", status: "$.data.status", required: "$.data.required_role_slots", filled: "$.data.filled_role_slots", quorum: "$.data.quorum_met" }
          assert:
            - "the meeting is created with HTTP 201 and status SCHEDULED"
            - "MeetingEvent.${mtg_id}.required_role_slots == 7 and filled_role_slots == 0"
            - "MeetingEvent.${mtg_id}.quorum_met == false and held_at == null"

      - name: release_of_released_assignment_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RoleAssignment.ASSIGNED_to_RELEASED
          - entities.RoleAssignment.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RELEASED is terminal for a role assignment: releasing the same assignment a second time returns ERR_INVALID_STATE and leaves filled_role_slots at 0."
        test_recipe:
          setup: ["one ORGANIZING club with one paid member and a scheduled meeting holding one ASSIGNED role"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships"
              payload: { club_id: "${club_id}", full_name: "Ada Lovelace", email: "ada@example.org", join_date: "2026-09-02T00:00:00Z", first_time_member: true }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.id", m_ada_id: "$.data.member_id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_id: "$.data.id", mtg_v: "$.data.version" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_id}", member_id: "${m_ada_id}", role_code: "TIMER", expected_meeting_version: "${mtg_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { assign_id: "$.data.id" }
            - call: "POST /toastmasters/role-assignments/${assign_id}/release"
              payload: { released_reason: "Member unavailable" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { first_status: "$.data.status" }
          trigger:
            - call: "POST /toastmasters/role-assignments/${assign_id}/release"
              payload: { released_reason: "Second release attempt" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { err: "$.data.error_id" }
            - call: "GET /toastmasters/meetings/${mtg_id}"
              as: WorldHeadquarters
              captures: { slots: "$.data.filled_role_slots" }
          assert:
            - "the first release succeeds and sets RoleAssignment.${assign_id}.status == RELEASED"
            - "the second release returns ERR_INVALID_STATE with HTTP 409"
            - "MeetingEvent.${mtg_id}.filled_role_slots == 0"

      - name: meeting_hold_marks_absent_assignments_no_show
        claim_type: side_effect_execution
        grounds:
          - state_machines.MeetingEvent.SCHEDULED_to_HELD
          - state_machines.RoleAssignment.ASSIGNED_to_NO_SHOW
          - entities.RoleAssignment.fields.credit_awarded
        distinguishing_aspect: "Closing a meeting as HELD fans out over its assignments: members listed in attendee_member_ids become COMPLETED while the absent member's assignment becomes NO_SHOW with credit_awarded false."
        test_recipe:
          setup: ["one ORGANIZING club with two paid members and a scheduled meeting holding a TIMER role for Ada and a GRAMMARIAN role for Grace"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [ { full_name: "Ada Lovelace", email: "ada@example.org" }, { full_name: "Grace Hopper", email: "grace@example.org" } ] }
              as: WorldHeadquarters
              captures: { ms_ada_id: "$.data.memberships[0].id", m_ada_id: "$.data.memberships[0].member_id", m_grace_id: "$.data.memberships[1].member_id" }
            - call: "GET /toastmasters/clubs/${club_id}"
              as: WorldHeadquarters
              captures: { club_v: "$.data.version" }
            - call: "POST /toastmasters/meetings"
              payload: { club_id: "${club_id}", scheduled_at: "2026-09-10T18:30:00Z", duration_minutes: 90, venue_name: "Riverside Library", expected_club_version: "${club_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_id: "$.data.id", mtg_v: "$.data.version" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_id}", member_id: "${m_ada_id}", role_code: "TIMER", expected_meeting_version: "${mtg_v}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { ada_assign_id: "$.data.id" }
            - call: "GET /toastmasters/meetings/${mtg_id}"
              as: WorldHeadquarters
              captures: { mtg_v2: "$.data.version" }
            - call: "POST /toastmasters/role-assignments"
              payload: { meeting_id: "${mtg_id}", member_id: "${m_grace_id}", role_code: "GRAMMARIAN", expected_meeting_version: "${mtg_v2}" }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { grace_assign_id: "$.data.id" }
          trigger:
            - call: "POST /toastmasters/meetings/${mtg_id}/close"
              payload: { outcome: "HELD", attendance_count: 6, attendee_member_ids: ["${m_ada_id}"] }
              as: ClubOfficer
              as_user_id: "${ms_ada_id}"
              captures: { mtg_status: "$.data.status", quorum: "$.data.quorum_met" }
            - call: "GET /toastmasters/role-assignments/${ada_assign_id}"
              as: WorldHeadquarters
              captures: { ada_status: "$.data.status" }
            - call: "GET /toastmasters/role-assignments/${grace_assign_id}"
              as: WorldHeadquarters
              captures: { grace_status: "$.data.status", grace_credit: "$.data.credit_awarded" }
          assert:
            - "MeetingEvent.${mtg_id}.status == HELD and quorum_met == true"
            - "RoleAssignment.${ada_assign_id}.status == COMPLETED because Ada is listed in attendee_member_ids"
            - "RoleAssignment.${grace_assign_id}.status == NO_SHOW and credit_awarded == false"
            - "Club.${club_id}.meetings_held_this_cycle == 1"

  - section: calculations
    instances:
      - name: judge_ballot_total_weighted_rounding
        claim_type: correct_result
        grounds:
          - calculations.judge_ballot_total
          - entities.ContestEntry.fields.judge_score_total
          - entities.ContestEntry.fields.ballot_count
        distinguishing_aspect: "One ballot of content 90, delivery 80 and language 70 evaluates to exactly 83 points under the 0.5/0.3/0.2 weights with round_half_up."
        test_recipe:
          setup: ["one ORGANIZING club with one paid member, a SCHEDULED club contest and one ENTERED entry"]
          setup_api_calls:
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Riverside Voices", club_type: "COMMUNITY", district_number: "42", division_code: "C", area_code: "C-3", venue_name: "Riverside Library", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_id: "$.data.id" }
            - call: "POST /toastmasters/clubs"
              payload: { club_name: "Harbor Masters", club_type: "COMMUNITY", district_number: "42", division_code: "H", area_code: "H-9", venue_name: "Harbor Hall", club_dues_cents: 3000, cycle_opened_at: "2026-09-01T00:00:00Z" }
              as: WorldHeadquarters
              captures: { club_j_id: "$.data.id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_j_id}", pay_dues_immediately: true, members: [ { full_name: "Judge One", email: "judge1@example.org" } ] }
              as: WorldHeadquarters
              captures: { m_judge_id: "$.data.memberships[0].member_id" }
            - call: "POST /toastmasters/memberships/bulk"
              payload: { club_id: "${club_id}", pay_dues_immediately: true, members: [ { full_name: "Ada Lovelace", email: "ada@example.org" }, { full_name: "Grace Hopper", email: "grace@example.org" } ] }
              as: WorldHeadquarters
              captures: { m_ada_id: "$.data.memberships[0].member_id", m_grace_id: "$.data.memberships[1].member_id" }
            - call: "POST /toastmasters/contests"
              payload: { club_id: "${club_id}", contest_level: "CLUB", contest_type: "INTERNATIONAL_SPEECH", district_number: "42", division_code: "C", area_code: "C-3", scheduled_at: "2026-10-15T18:30:00Z" }
              as: DistrictDirector
              as_user_id: "${m_judge_id}"
              captures: { contest_id: "$.data.id" }
            - call: "POST /toastmasters/contest-entries"
              payload: { contest_id: "${contest_id}", member_id: "${m_ada_id}", club_id: "${club_id}", speech_title: "The Long Road" }
              as: Member
              as_user_id: "${m_ada_id}"
              captures: { entry_id: "$.data.id" }
          trigger:
            - call: "POST /toastmasters/contest-entries/${entry_id}/ballots"
              payload: { judge_member_id: "${m_judge_id}", content_score: 90, delivery_score: 80, language_score: 70 }
              as: DistrictDirector
              as_user_id: "${m_judge_id}"
