            - "Fixture F1 up to and including the spend observations, with data window W1 [2026-08-03, 2026-08-31) WEEKLY deliberately left OPEN: market US_CORE, channel A_SEARCH (decay 0.50, lag 2, half_point 200000, ceiling 1200) and channel B_SOCIAL (decay 0.25, lag 1, half_point 150000, ceiling 800)."
            - "Four sales periods 2026-08-03 / 08-10 / 08-17 / 08-24 with (units_sold, revenue_cents) = (5000, 25000000), (6000, 30600000), (5500, 27500000), (6500, 32500000), giving lag_completeness_pct 100.00 and sales_period_count 4."
            - "Spend per period A_SEARCH [400000, 600000, 300000, 500000] and B_SOCIAL [200000, 200000, 400000, 100000], every spend write chained through the window's OCC version via expected_data_window_version."
            - "One EFFECT_PERIOD ModelRun over both channels with holdout_periods 1, created but NOT fitted, so fit_status == PENDING."
            - "The clock is still at the default 2026-08-01, so the first fit attempt sees a window that is neither elapsed nor sealed; the trigger sequence advances the clock and seals it between attempts."
