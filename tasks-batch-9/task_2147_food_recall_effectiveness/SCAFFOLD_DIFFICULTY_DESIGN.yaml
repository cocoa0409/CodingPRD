              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_CONSIGNEE_NOT_ON_DISTRIBUTION_LIST"
            - "${err} != ERR_QUANTITY_EXCEEDS_SHIPPED"
            - "GET /consignees/${c2_id}/retrieval-receipts returns an empty array with total_count == 0"
            - "Recall.${r_id}.total_shipped_units == 600"

  - rule_id: boundary_precision_check
    instances:
      - name: hazard_score_exactly_seventy_is_class_one_while_sixtynine_is_class_two
        grounds:
          - calculations.hazard_score_and_class
          - state_machines.HazardEvaluation.SUBMITTED_to_RATIFIED
          - entities.HazardEvaluation.fields.recommended_class
        distinguishing_aspect: |
          Boundary metric #1: the CLASS_I_THRESHOLD comparison is `>=`, exercised on
          POST /hazard-evaluations/{id}/decide. Exposure 300000 lands the score on exactly 70.00
          and MUST yield CLASS_I; exposure 275000 lands on 69.00 and MUST yield CLASS_II.
        test_recipe:
          setup:
            - "One Firm and one FDA Recall in DRAFT."
            - "Evaluation A (MEDIUM, tier 4, exposure 300000, not vulnerable, CONFIRMED) and Evaluation B (identical but exposure 275000), both in status SUBMITTED."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "MEDIUM", severity_tier: 4, exposure_population: 300000, vulnerable_population: false, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { heA_id: $.data.id }
            - call: "GET /recalls/${r_id}"
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_v2: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "MEDIUM", severity_tier: 4, exposure_population: 275000, vulnerable_population: false, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v2}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { heB_id: $.data.id }
            - call: "POST /hazard-evaluations/${heA_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${heB_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /hazard-evaluations/${heA_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
              captures: { a_score: $.data.hazard_score, a_class: $.data.recommended_class }
            - call: "POST /hazard-evaluations/${heB_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
              captures: { b_score: $.data.hazard_score, b_class: $.data.recommended_class }
          assert:
            - "${a_score} == 70.00"
            - "${a_class} == CLASS_I"
            - "${b_score} == 69.00"
            - "${b_class} == CLASS_II"
            - "HazardEvaluation.${heA_id}.status == SUPERSEDED"
            - "HazardEvaluation.${heB_id}.status == RATIFIED"

      - name: empty_sample_and_zero_shipped_units_resolve_to_opposite_percentages
        grounds:
          - calculations.effectiveness_percentage
          - calculations.effectiveness_sample_scope
          - entities.Recall.fields.required_sample_size
        distinguishing_aspect: |
          Boundary metric #2 on a different endpoint (GET /recalls/{id}/effectiveness): the two
          empty-collection edges deliberately disagree — an empty effectiveness sample
          (required_sample_size == 0) yields contact_effectiveness_pct 100.00 while zero
          reconciled shipped units yields quantity_effectiveness_pct 0.00, and USDA selects the
          0.00 as official.
        test_recipe:
          setup:
            - "USDA Recall classified CLASS_III (effectiveness_check_level D, sample_tier_scope 1)."
            - "Zero Consignee rows and zero DistributionRecord rows on the recall."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Ground beef 5lb", agency: "USDA", initiation_type: "AGENCY_REQUESTED", lot_codes: ["L-42B"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "LOW", severity_tier: 1, exposure_population: 0, vulnerable_population: false, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { prelim: $.data.hazard_score }
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_III" }
              as: RecallCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "GET /recalls/${r_id}/effectiveness"
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { req_sample: $.data.required_sample_size, contact_pct: $.data.contact_effectiveness_pct, shipped: $.data.shipped_units, quantity_pct: $.data.quantity_effectiveness_pct, official_pct: $.data.official_effectiveness_pct, basis: $.data.official_basis }
          assert:
            - "${prelim} == 8.40"
            - "${req_sample} == 0"
            - "${contact_pct} == 100.00"
            - "${shipped} == 0"
            - "${quantity_pct} == 0.00"
            - "${basis} == QUANTITY"
            - "${official_pct} == 0.00"
            - "GET /recalls/${r_id}/effectiveness -> eligible_consignee_count == 0 and effectiveness_check_level == D and sample_tier_scope == 1"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: classify_blocked_until_a_hazard_evaluation_is_ratified
        grounds:
          - state_machines.Recall.DRAFT_to_CLASSIFIED
          - validations[priority=20]
          - errors[ERR_NO_RATIFIED_EVALUATION]
          - entities.HazardEvaluation.fields.status
        distinguishing_aspect: |
          Entity pair Recall -> HazardEvaluation: the Recall's DRAFT -> CLASSIFIED transition is
          legal only while a sibling HazardEvaluation sits in status RATIFIED. With the sole
          evaluation still SUBMITTED the classify call is rejected with
          ERR_NO_RATIFIED_EVALUATION and the recall stays DRAFT with hazard_class null.
        test_recipe:
          setup:
            - "One Firm and one FDA Recall in DRAFT."
            - "Exactly one HazardEvaluation on that recall, in status SUBMITTED and never decided."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
          trigger:
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err} == ERR_NO_RATIFIED_EVALUATION"
            - "Recall.${r_id}.status == DRAFT"
            - "Recall.${r_id}.hazard_class == null and Recall.${r_id}.effectiveness_check_level == null"
            - "GET /recalls/${r_id}/status-reports returns an empty array with total_count == 0"

      - name: disposition_authorization_bounded_by_verified_retrieval_units
        grounds:
          - state_machines.DispositionOrder.PROPOSED_to_AUTHORIZED
          - state_machines.RetrievalReceipt.REPORTED_to_VERIFIED
          - validations[priority=31]
          - errors[ERR_DISPOSITION_EXCEEDS_ACCOUNTED_UNITS]
          - entities.Recall.fields.units_awaiting_disposition
        distinguishing_aspect: |
          A different entity pair — DispositionOrder -> RetrievalReceipt: the order's
          PROPOSED -> AUTHORIZED transition depends on how many units the sibling receipts have
          moved into custody. With exactly one VERIFIED receipt contributing 500 units, an order
          for 600 is rejected with ERR_DISPOSITION_EXCEEDS_ACCOUNTED_UNITS and
          units_awaiting_disposition stays at 500.
        test_recipe:
          setup:
            - "USDA Recall classified CLASS_I in RETRIEVAL_ACCOUNTING (one consignee, 1000 CONFIRMED units, notification DELIVERED and ACKNOWLEDGED)."
            - "One VERIFIED RetrievalReceipt with quantity_returned 500, so Recall.units_awaiting_disposition is 500 and quantity_effectiveness_pct is 50.00."
            - "One DispositionOrder in status PROPOSED for 600 units."
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Ground beef 5lb", agency: "USDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-42B"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /recalls/${r_id}/consignees"
              payload: { name: "Metro Distributors", consignee_type: "DISTRIBUTOR" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /recalls/${r_id}/distribution-records"
              payload: { consignee_id: "${c1_id}", lot_code: "L-42B", quantity_shipped: 1000, ship_date: "2026-08-20T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /distribution-records/${d1_id}/reconcile"
              payload: { outcome: "CONFIRM" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/notifications"
              payload: { consignee_id: "${c1_id}", method: "EMAIL", expected_consignee_version: "${c1_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /notifications/${n1_id}/delivery"
              payload: { outcome: "DELIVERED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /notifications/${n1_id}/response"
              payload: { outcome: "ACKNOWLEDGED" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /recalls/${r_id}/retrieval-receipts"
              payload: { consignee_id: "${c1_id}", quantity_returned: 500, quantity_destroyed_onsite: 0, quantity_held_segregated: 0, quantity_unrecoverable: 0 }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /retrieval-receipts/${rr1_id}/verify"
              payload: { decision: "VERIFY" }
              as: FieldInvestigator
              as_user_id: "inv-1"
            - call: "POST /recalls/${r_id}/disposition-orders"
              payload: { method: "DESTROY", quantity: 600, facility_name: "Ridgeline Incineration" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { do1_id: $.data.id }
          trigger:
            - call: "POST /disposition-orders/${do1_id}/authorize"
              payload: {}
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err} == ERR_DISPOSITION_EXCEEDS_ACCOUNTED_UNITS"
            - "DispositionOrder.${do1_id}.status == PROPOSED and DispositionOrder.${do1_id}.authorized_by_user_id == null"
            - "Recall.${r_id}.units_awaiting_disposition == 500"
            - "Recall.${r_id}.quantity_effectiveness_pct == 50.00 and Recall.${r_id}.status == RETRIEVAL_ACCOUNTING"

  - rule_id: resource_temporal_overlap
    instances:
      - name: interim_report_window_rejects_overlap_but_accepts_exact_adjacency
        grounds:
          - validations[priority=26]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - entities.StatusReport.fields.period_start
          - entities.StatusReport.fields.period_end
          - calculations.report_cadence_schedule
        distinguishing_aspect: |
          Interval semantics #1 on the Recall reporting timeline: windows are HALF-OPEN
          [period_start, period_end) with no buffer, so [09-05, 09-10) collides with the existing
          [09-01, 09-08) while [09-08, 09-12) — which touches the existing end exactly — is
          accepted.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z."
            - "FDA Recall classified CLASS_I, so StatusReport period_index 1 is PERIODIC and PENDING with period_start 2026-09-01T00:00:00Z and period_end 2026-09-08T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RecallCoordinator
              as_user_id: "coord-1"
            - call: "POST /firms"
              payload: { name: "Northvale Foods", registration_number: "FFR-10021" }
              as: RecallCoordinator
              as_user_id: "coord-1"
              captures: { firm_id: $.data.id }
            - call: "POST /recalls"
              payload: { firm_id: "${firm_id}", product_description: "Frozen spinach 1kg", agency: "FDA", initiation_type: "FIRM_INITIATED", lot_codes: ["L-88A"] }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { r_id: $.data.id, r_v1: $.data.version }
            - call: "POST /recalls/${r_id}/hazard-evaluations"
              payload: { probability_of_adverse_health: "HIGH", severity_tier: 4, exposure_population: 60000, vulnerable_population: true, evidence_strength: "CONFIRMED", expected_recall_version: "${r_v1}" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { he_id: $.data.id }
            - call: "POST /hazard-evaluations/${he_id}/submit"
              payload: {}
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
            - call: "POST /hazard-evaluations/${he_id}/decide"
              payload: { decision: "RATIFY" }
              as: HealthHazardPanel
              as_user_id: "panel-1"
            - call: "POST /recalls/${r_id}/classify"
              payload: { hazard_class: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /recalls/${r_id}/status-reports"
              payload: { report_kind: "INTERIM", period_start: "2026-09-05T00:00:00Z", period_end: "2026-09-10T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /recalls/${r_id}/status-reports"
              payload: { report_kind: "INTERIM", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-12T00:00:00Z" }
              as: FirmRecallOfficer
              as_user_id: "${firm_id}"
              captures: { sr2_id: $.data.id, sr2_index: $.data.period_index, sr2_due: $.data.due_at }
          assert:
            - "The first trigger call returns HTTP 409 with ${err_overlap} == ERR_REPORT_PERIOD_OVERLAP"
            - "The second trigger call returns HTTP 201"
            - "${sr2_index} == 2"
            - "${sr2_due} == 2026-09-12T00:00:00.000Z"
            - "StatusReport.${sr2_id}.status == PENDING and StatusReport.${sr2_id}.report_kind == INTERIM"
            - "GET /recalls/${r_id}/status-reports -> total_count == 2"

      - name: notification_cooling_off_uses_max_method_buffer_and_admits_the_exact_edge
        grounds:
          - validations[priority=25]
          - calculations.notification_aging_and_cooling_off
          - errors[ERR_NOTIFICATION_COOLING_OFF]
          - entities.ConsigneeNotification.fields.sent_at
