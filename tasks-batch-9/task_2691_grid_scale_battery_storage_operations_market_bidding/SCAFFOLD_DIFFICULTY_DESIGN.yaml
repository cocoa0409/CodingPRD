          A third entity pair, WarrantyClaim <= CapacityTest, where the dependency is on a
          calculated flag rather than a bare status: the cited test must be COMPLETED AND have
          warranty_claim_triggered true. Three probes in one world — a COMPLETED-but-untriggered
