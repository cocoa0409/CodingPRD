            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${k1}", amount_cents: 1000, merchant_id: "M-V14", merchant_category_code: "5411", channel: "CHIP", origin_country: "US" }, as: NetworkGateway }
