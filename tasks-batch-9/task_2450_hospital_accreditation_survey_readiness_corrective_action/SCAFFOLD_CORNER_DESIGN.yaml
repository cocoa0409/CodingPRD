        distinguishing_aspect: "With the command center already ACTIVATED, OPEN_SURVEY on a PROJECTED window returns ERR_SURVEY_WINDOW_NOT_ELIGIBLE (priority 17) and never reaches the command-center rule at priority 18."
        test_recipe:
