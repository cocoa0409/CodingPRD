      - name: transit_sweep_ends_only_the_certificates_whose_storage_window_has_closed
        claim_type: bulk_action
        grounds:
          - endpoints.POST /open-policies/{id}/run-transit-sweep
          - state_machines.Certificate.status.ISSUED_to_TRANSIT_ENDED
          - state_machines.OpenPolicy.status.ACTIVE_to_EXPIRED
          - calculations.transit_termination_instant
        distinguishing_aspect: |
          The sweep is a selective bulk action driven entirely by the logical
          clock: with the clock at 2026-09-20 it must end CERT-EARLY (termination
          2026-09-19) and leave CERT-LATE (termination 2026-10-05) ISSUED, and it
          must NOT expire a policy whose expiry_at is still in the future even
          though it advanced a certificate. A second sweep past expiry_at then
          ends the remaining certificate AND expires the policy in one call.
          An implementation that sweeps all ISSUED rows, or that expires the
          policy whenever anything moves, fails the first assertion pair.
        test_recipe:
          setup:
            - "policy expiry 2027-01-01T00:00:00Z; discharge port storage_free_days 30"
            - "CERT-EARLY sailing 2026-08-10 discharge 2026-08-20 -> transit_termination_at 2026-09-19T00:00:00Z"
            - "CERT-LATE sailing 2026-08-10 discharge 2026-09-05 -> transit_termination_at 2026-10-05T00:00:00Z"
            - "both insured 1155000.00, so vessel exposure is 2310000.00 while both are ISSUED"
