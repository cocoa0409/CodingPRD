    input: ["status?", "limit?", "offset?"]
    output: WitnessAssignment[]
    side_effects: []
  - id: list_witness_assignments
    method: GET
    path: "/witness-assignments"
    description: "Filtered list resolving both the test and party FKs"
    roles: [WitnessCoordinator, TestEngineer, PlantAdmin, QualityEngineer, CustomerWitness]
    code: 200
    input: ["factory_acceptance_test_id?", "witness_party_id?", "status?", "travel_region?", "limit?", "offset?"]
    output: WitnessAssignment[]
    side_effects: []
  - id: get_witness_assignment
    method: GET
    path: "/witness-assignments/{id}"
