              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Desert Willow GC", turf_profile: "BERMUDA", cut_quality_standard: "MAINTENANCE", credit_limit_cents: 30000000, assigned_distributor_id: "${d2}" }
              as: CorporateAdmin
              captures: { c2: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "GM-1200", category: "MOWER", tier: "STANDARD", list_price_cents: 4200000, eligible_turf_types: ["BERMUDA", "MIXED"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 8000, parts_support_years: 8 }
              as: CorporateAdmin
              captures: { m3: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c2}", cycle_months: 24, start_date: "2027-01-04", lines: [{ model_id: "${m3}", qty: 2 }] }
              as: DistributorManager
              as_user_id: "${d2}"
              captures: { l2: $.data.id, l2_v: $.data.version }
            - call: "POST /turf/appraisals"
              payload: { lease_id: "${l2}", model_id: "${m3}", external_serial: "OLD-777", hours: 900, condition_grade: "A", policy: "BOOK" }
              as: DistributorManager
              as_user_id: "${d2}"
              captures: { ap2: $.data.id }
            - call: "POST /turf/leases/${l2}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l2_v}" }
              as: DistributorManager
              as_user_id: "${d2}"
          trigger:
            - call: "POST /turf/distributors/${d2}/compliance_review"
              as: CorporateAdmin
              captures: { d2_status: $.data.status }
          assert:
            - "d2_status == PROBATION (stock_value 0 < 500000)"
            - "FleetLease.${l2}.status == DRAFT (reverted by the standing mutation, not by a lease call)"
            - "FleetLease.${l2}.version == 3"
            - "TradeInAppraisal.${ap2}.status == VOIDED (third link, caused by the lease revert)"

