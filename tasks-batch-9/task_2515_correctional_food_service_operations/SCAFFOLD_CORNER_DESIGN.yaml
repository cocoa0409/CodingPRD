          - errors.ERR_REFEED_TARGET_INVALID
          - errors.ERR_REINSTATEMENT_TARGET_INVALID
        distinguishing_aspect: "Three admissibility faults on one grievance that is otherwise ready and inside its SLA: NO_ACTION is barred because the diet review found the kitchen at fault, MEAL_REFEED because the named record is still OPEN, DIET_REINSTATEMENT because the named order is ACTIVE rather than SUSPENDED - and MENU_CORRECTION then succeeds."
