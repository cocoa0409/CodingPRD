scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: drive_time_urban_rural_divergence_same_coordinates
        grounds:
          - calculations.drive_time_minutes
          - entities.EligibilityAssessment.fields.geo_classification
          - entities.EligibilityAssessment.fields.drive_standard_failed
        distinguishing_aspect: |
          Same home coordinates, same station, same service: the URBAN variant
          (circuity 1.4, 40 mph) yields 37.9 minutes and fails the 30-minute
          primary standard, while the RURAL variant (circuity 1.2, 55 mph)
          yields 23.6 minutes and passes — one input flag flips both the number
          and the eligibility outcome. Entity domain: EligibilityAssessment.
        test_recipe:
          setup:
            - "Station at (40.0, -75.0), waits 10/10, offers PT_EVAL"
            - "Two PG-5 veterans, both living at (40.2609, -75.0) — 18.0266 crow-fly miles from the station"
            - "Each gets a PRIMARY_CARE/PT_EVAL assessment with no choice request; one URBAN, one RURAL"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Urban", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { vu_id: $.data.id, vu_v: $.data.version }
            - call: "POST /community-care/veterans/${vu_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${vu_v}" }
              as: EligibilityClerk
              captures: { au_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Rural", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { vr_id: $.data.id, vr_v: $.data.version }
            - call: "POST /community-care/veterans/${vr_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "RURAL", choice_requested: false, expected_veteran_version: "${vr_v}" }
              as: EligibilityClerk
              captures: { ar_id: $.data.id }
          trigger:
            - call: "GET /community-care/veterans/${vu_id}/eligibility-assessments"
              as: CareCoordinator
              captures: { au_drive: "$.data[0].drive_time_minutes", au_elig: "$.data[0].eligible" }
            - call: "GET /community-care/veterans/${vr_id}/eligibility-assessments"
              as: CareCoordinator
              captures: { ar_drive: "$.data[0].drive_time_minutes", ar_elig: "$.data[0].eligible" }
          assert:
            - "Assessment.${au_id}.drive_time_minutes == 37.9 (18.0266 mi * 1.4 / 40 * 60, round_half_up 1dp)"
            - "Assessment.${ar_id}.drive_time_minutes == 23.6 (18.0266 mi * 1.2 / 55 * 60, round_half_up 1dp)"
            - "Assessment.${au_id}.drive_standard_failed == true (37.9 > 30)"
            - "Assessment.${ar_id}.drive_standard_failed == false (23.6 <= 30; standard is strict-greater)"
            - "Assessment.${au_id}.eligible == true and Assessment.${ar_id}.eligible == false — identical geography, opposite outcomes"

      - name: claim_payment_contract_vs_medicare_fallback
        grounds:
          - calculations.claim_payment
          - entities.CommunityProvider.fields.contract_rates
          - entities.Claim.fields.paid_amount_cents
        distinguishing_aspect: |
          Identical service lines (PT_EVAL x2 @ 9000c billed): a provider whose
          contract_rates pin 8000c/unit pays 15600c (allowed 16000 - fee 400),
          while a provider on the Medicare fallback (18000c/unit SPECIALTY) pays
          17550c (allowed 18000 - fee 450). Entity domain: Claim — distinct from
          the EligibilityAssessment domain of the sibling instance.
        test_recipe:
          setup:
            - "One TPA; providers PC (contract_rates {PT_EVAL: 8000}) and PM (no contract rates), both CREDENTIALED, TPA-scheduled"
            - "Two drive-time-eligible veterans (URBAN, PRIMARY standard failed); each has an AUTHORIZED->ACTIVE episode with one COMPLETED appointment on 2026-09-06"
            - "Each provider submits an identical claim: one line {PT_EVAL, SPECIALTY_CARE, units 2, unit_billed_cents 9000}"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov Contract", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1, contract_rates: { PT_EVAL: 8000 } }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /community-care/providers/${pc_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov Medicare", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.2, longitude: -75.2 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { pm_id: $.data.id }
            - call: "POST /community-care/providers/${pm_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V C", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { vc_id: $.data.id, vc_v: $.data.version }
            - call: "POST /community-care/veterans/${vc_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${vc_v}" }
              as: EligibilityClerk
              captures: { ac_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${vc_id}", assessment_id: "${ac_id}", provider_id: "${pc_id}", service_code: "PT_EVAL", authorized_visits: 1, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_c: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_c}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_c}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_c: $.data.id }
            - call: "POST /community-care/appointments/${ap_c}/complete"
              as: ProviderRep
              as_user_id: "${pc_id}"
            - call: "POST /community-care/veterans"
              payload: { full_name: "V M", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { vm_id: $.data.id, vm_v: $.data.version }
            - call: "POST /community-care/veterans/${vm_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${vm_v}" }
              as: EligibilityClerk
              captures: { am_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${vm_id}", assessment_id: "${am_id}", provider_id: "${pm_id}", service_code: "PT_EVAL", authorized_visits: 1, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_m: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_m}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_m}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_m: $.data.id }
            - call: "POST /community-care/appointments/${ap_m}/complete"
              as: ProviderRep
              as_user_id: "${pm_id}"
            - call: "POST /community-care/claims"
              payload: { referral_authorization_id: "${ra_c}", service_date: "2026-09-06", service_lines: [{ service_code: "PT_EVAL", service_category: "SPECIALTY_CARE", units: 2, unit_billed_cents: 9000 }] }
              as: ProviderRep
              as_user_id: "${pc_id}"
              captures: { cl_c: $.data.id }
            - call: "POST /community-care/claims"
              payload: { referral_authorization_id: "${ra_m}", service_date: "2026-09-06", service_lines: [{ service_code: "PT_EVAL", service_category: "SPECIALTY_CARE", units: 2, unit_billed_cents: 9000 }] }
              as: ProviderRep
              as_user_id: "${pm_id}"
              captures: { cl_m: $.data.id }
          trigger:
            - call: "POST /community-care/claims/${cl_c}/adjudicate"
              payload: { decision: "PAID" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { paid_c: $.data.paid_amount_cents }
            - call: "POST /community-care/claims/${cl_m}/adjudicate"
              payload: { decision: "PAID" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { paid_m: $.data.paid_amount_cents }
          assert:
            - "Claim.${cl_c}.paid_amount_cents == 15600 (contract: allowed min(18000, 8000*2)=16000, fee round_half_up(400.00)=400)"
            - "Claim.${cl_m}.paid_amount_cents == 17550 (medicare fallback: allowed min(18000, 18000*2)=18000, fee 450)"
            - "${paid_c} != ${paid_m} for byte-identical service lines"

  - rule_id: combinatorial_formula
    instances:
      - name: eligibility_branch_composition_choice_only_path
        grounds:
          - calculations.eligibility_determination
          - entities.EligibilityAssessment.fields.choice_granted
          - entities.EligibilityAssessment.fields.eligible
        distinguishing_aspect: |
          Mode (a) — 4+ inputs with conditional branching: with service
          available, drive 23.6 <= 30, wait 10 <= 20 (every standard met), the
          ONLY path to eligible is the choice branch, and it opens solely on
          priority_group <= CHOICE_PRIORITY_MAX(4): a PG-3 veteran requesting
          choice is eligible, a PG-5 veteran with byte-identical geography and
          waits is not.
        test_recipe:
          setup:
            - "Station offers PT_EVAL with waits 10/10 — all access standards met for a RURAL veteran at (40.2609, -75.0)"
            - "Veteran ChoiceYes PG-3 and veteran ChoiceNo PG-5, both request choice (choice_requested=true)"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V ChoiceYes", home_station_id: "${st_id}", priority_group: 3, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { vy_id: $.data.id, vy_v: $.data.version }
            - call: "POST /community-care/veterans/${vy_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "RURAL", choice_requested: true, expected_veteran_version: "${vy_v}" }
              as: EligibilityClerk
              captures: { ay_id: $.data.id, ay_elig: $.data.eligible, ay_choice: $.data.choice_granted }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V ChoiceNo", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { vn_id: $.data.id, vn_v: $.data.version }
            - call: "POST /community-care/veterans/${vn_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "RURAL", choice_requested: true, expected_veteran_version: "${vn_v}" }
              as: EligibilityClerk
              captures: { an_id: $.data.id, an_elig: $.data.eligible, an_choice: $.data.choice_granted }
          trigger: []
          assert:
            - "Assessment.${ay_id}: service_available == true, drive_standard_failed == false, wait_standard_failed == false, choice_granted == true, eligible == true"
            - "Assessment.${an_id}: service_available == true, drive_standard_failed == false, wait_standard_failed == false, choice_granted == false, eligible == false"
            - "The only differing input is priority_group (3 vs 5) against CHOICE_PRIORITY_MAX == 4"

      - name: claim_fee_per_line_then_sum_rounding_order
        grounds:
          - calculations.claim_payment
        distinguishing_aspect: |
          Mode (b) — nested rounding order: allowed amounts 101c and 103c each
          carry a 2.5% fee; the contract rounds per line (round_half_up(2.525)=3
          and round_half_up(2.575)=3, fees total 6) then sums, yielding
          paid_amount_cents == 198. The alternative sum-then-round order would
          yield round_half_up(204*0.025)=5 and pay 199 — the pinned order
          decides the cent.
        test_recipe:
          setup:
            - "Credentialed provider with NO contract_rates (Medicare fallback: PRIMARY 10000c/unit, so billed 101c/103c are the allowed amounts)"
            - "One eligible veteran, ACTIVE episode, one COMPLETED appointment on 2026-09-06"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov NoContract", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V R", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 1, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /community-care/appointments/${ap_id}/complete"
              as: ProviderRep
              as_user_id: "${p_id}"
            - call: "POST /community-care/claims"
              payload: { referral_authorization_id: "${ra_id}", service_date: "2026-09-06", service_lines: [{ service_code: "GEN1", service_category: "PRIMARY_CARE", units: 1, unit_billed_cents: 101 }, { service_code: "GEN2", service_category: "PRIMARY_CARE", units: 1, unit_billed_cents: 103 }] }
              as: ProviderRep
              as_user_id: "${p_id}"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /community-care/claims/${cl_id}/adjudicate"
              payload: { decision: "PAID" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { paid: $.data.paid_amount_cents }
          assert:
            - "Claim.${cl_id}.paid_amount_cents == 198 (per-line fees 3 + 3 = 6; allowed total 204 - 6)"
            - "Claim.${cl_id}.paid_amount_cents != 199 (the sum-then-round order is explicitly NOT the contract)"
            - "Claim.${cl_id}.billed_total_cents == 204"

      - name: urgent_care_copay_epoch_counting_order
        grounds:
          - calculations.urgent_care_copay
          - entities.UrgentCareVisit.fields.visit_index_in_fy
          - entities.UrgentCareVisit.fields.copay_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency pinned by evaluation order: the
          copay of visit N depends on the count of PRIOR visits in the fiscal
          year, and the new visit must be excluded from its own count. A PG-5
          (MID) veteran's 4th visit of FY2026 computes visit_index_in_fy == 4
          (3 priors + 1) and copay_cents == 3000, while visits 1..3 computed
          1500 each.
        test_recipe:
          setup:
            - "PG-5 veteran; four urgent care visits recorded on 2026-09-01..04 (distinct calendar days to avoid the same-day rule); all in FY2026"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Urgent", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id }
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "QuickCare" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { u1: $.data.id, u1_copay: $.data.copay_cents, u1_idx: $.data.visit_index_in_fy }
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "QuickCare" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { u2: $.data.id, u2_copay: $.data.copay_cents }
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "QuickCare" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { u3: $.data.id, u3_copay: $.data.copay_cents }
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /community-care/urgent-care-visits"
              payload: { veteran_id: "${v_id}", facility_name: "QuickCare" }
              as: Veteran
              as_user_id: "${v_id}"
              captures: { u4: $.data.id, u4_copay: $.data.copay_cents, u4_idx: $.data.visit_index_in_fy, u4_fy: $.data.fiscal_year }
          assert:
            - "UrgentCareVisit.${u1}.copay_cents == 1500 and visit_index_in_fy == 1 (no priors counted)"
            - "UrgentCareVisit.${u2}.copay_cents == 1500 and UrgentCareVisit.${u3}.copay_cents == 1500 (visit_index 2 and 3 stay on the lower tier, <= URGENT_VISIT_LOWER_TIER_MAX 3)"
            - "UrgentCareVisit.${u4}.visit_index_in_fy == 4 and copay_cents == 3000 (4th visit crosses the tier boundary)"
            - "UrgentCareVisit.${u4}.fiscal_year == 2026 (September is before the October FY rollover)"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_denied_resubmit_paid_cycle
        grounds:
          - state_machines.Claim.RECEIVED_to_DENIED
          - state_machines.Claim.DENIED_to_RECEIVED
          - state_machines.Claim.RECEIVED_to_PAID
          - entities.Claim.fields.resubmit_count
        distinguishing_aspect: |
          Claim is cyclic (RECEIVED -> DENIED -> RECEIVED -> PAID): the same
          claim row traverses RECEIVED twice with resubmit_count distinguishing
          the loops. Non-linearity on the Claim entity (the sibling instance's
          cycle lives on MedicalDocumentation).
        test_recipe:
          setup:
            - "Credentialed provider, eligible veteran, ACTIVE episode (1 visit), COMPLETED appointment on 2026-09-06, claim submitted with line GEN1 1x4000c"
          setup_api_calls:
            - call: "POST /community-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /community-care/care-stations"
              payload: { name: "Station Alpha", latitude: 40.0, longitude: -75.0, primary_wait_days: 10, specialty_wait_days: 10, service_codes: ["PT_EVAL"] }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /community-care/tpas"
              payload: { name: "TPA One", region_code: "R1" }
              as: PlatformAdmin
              captures: { tpa_id: $.data.id }
            - call: "POST /community-care/tpas/${tpa_id}/providers"
              payload: { name: "Prov One", service_codes: ["PT_EVAL"], contract_scheduling: "TPA", latitude: 40.1, longitude: -75.1 }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
