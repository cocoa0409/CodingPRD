          assert:
            - "${prot_a_status} == ${prot_b_status} == OPEN and ${prot_a_round} == 1"
            - "${err_scope} == ERR_PROTEST_NOT_FOUND (404): ${prot_b} exists, but not under ${obj_a}, and the composite path must be validated as a pair"
            - "${res1_status} == DENIED with ${res1_by} == u-fsm-1 and ${res1_units} == null — a denial records no recomputed units, and objective A keeps its original objective_units ${obj_a_units}"
            - "${err_again} == ERR_PROTEST_ALREADY_RESOLVED (409) — DENIED is terminal for the protest even though the second attempt asks for the opposite resolution and carries a correct fresh objective version"
            - "the second attempt violates TWO priority-10 guards at once (the protest is terminal AND the objective has fallen back to PROPOSED, which admits no resolve): the ADDRESSED resource wins, so ERR_PROTEST_ALREADY_RESOLVED is returned and not ERR_OBJECTIVE_INVALID_STATE"
            - "${b_first_id} == ${prot_b} and ${b_first_status} == OPEN — dealer B's protest was NOT collaterally resolved by the mis-scoped call"
            - "${obj_b_units_after} == ${obj_b_units} and ${obj_b_status_after} == PROTESTED (where its own setup protest left it, NOT resolved back to PROPOSED) — objective B is entirely untouched"

      - name: code_uniqueness_is_global_and_survives_rejected_and_cancelled_rows
        claim_type: triggerable
        grounds:
          - errors[ERR_DUPLICATE_DEALER_CODE]
          - errors[ERR_DUPLICATE_VIN]
          - errors[ERR_DUPLICATE_BATCH_CODE]
          - validations[priority=8]
        distinguishing_aspect: "The three uniqueness keys are re-used AFTER their owning row has reached a dead state — a REJECTED delivery's VIN and a CANCELLED batch's code — and both are still refused, while the CANCELLED batch's pay PERIOD is immediately re-usable under a new code. So uniqueness ignores lifecycle state, whereas the period-overlap rule at priority 13 does not."
