              captures: { e4: $.data.error_id }
          assert:
            - "all four calls return status_code == 403 with ${e1} == ${e2} == ${e3} == ${e4} == \"ERR_AGENCY_IDENTITY_MISMATCH\""
            - "${e2} is ERR_AGENCY_IDENTITY_MISMATCH even though b1.assigned_cell_count == 0 would also have blocked the propose — priority 3 precedes the transition preconditions"
            - "EmergencyServiceBoundary.${b1_id}.status == \"DRAFT\" and version == 1 and assigned_cell_count == 0"
            - "EmergencyServiceBoundary.${b1_id}.agency_id == \"${a1_id}\" and service_type == \"LAW\"   # copied from the agency, never from the payload"
            - "GET /gis/emergency-service-boundaries returns meta.total_count == 1 — a2 never created one"
            - "GET /gis/emergency-service-boundaries/${b1_id} as the a2 liaison returns status_code 200 — reads are not agency-scoped, writes are"

      - name: qc_report_generator_cannot_certify_its_own_report_rejected
