              payload: {}
              as: MetrologyTechnician
              as_user_id: "mt-001"
            - call: "GET /optics/export-classifications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ExportComplianceOfficer
              as_user_id: "eco-001"
            - call: "GET /optics/documentation-packages/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
          assert:
            - "the design read returns HTTP 404 with error_id ERR_DESIGN_NOT_FOUND"
            - "the tolerance-allocation read returns ERR_TOLERANCE_ALLOCATION_NOT_FOUND"
            - "the glass-lot read returns ERR_GLASS_LOT_NOT_FOUND"
            - "the work-order read returns ERR_WORK_ORDER_NOT_FOUND"
            - "the instrument read returns ERR_INSTRUMENT_NOT_FOUND"
            - "the process-run read returns ERR_PROCESS_RUN_NOT_FOUND"
            - "the metrology-report read returns ERR_METROLOGY_REPORT_NOT_FOUND"
            - "the coating-chamber read returns ERR_CHAMBER_NOT_FOUND"
            - "the coating-run read returns ERR_COATING_RUN_NOT_FOUND"
            - "the assembly read returns ERR_ASSEMBLY_NOT_FOUND"
            - "the assembly-component read returns ERR_ASSEMBLY_COMPONENT_NOT_FOUND"
            - "the inspection-record read returns ERR_INSPECTION_RECORD_NOT_FOUND"
            - "the export-classification read returns ERR_EXPORT_CLASSIFICATION_NOT_FOUND"
            - "the documentation-package read returns ERR_DOCUMENTATION_PACKAGE_NOT_FOUND"
            - "all fourteen responses are HTTP 404 with response_type error and a data.message string, and the fourteen error_id values are pairwise distinct"

