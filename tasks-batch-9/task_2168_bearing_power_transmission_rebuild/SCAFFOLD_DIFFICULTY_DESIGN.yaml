              as: Planner
              captures: { order_2: $.data.id }
            - call: "POST /shop/rebuild-orders"
              payload: { customer_id: "${cust_id}", core_unit_id: "${core_3}", customer_asset_id: "${asset_id}", labor_hours: 4.0 }
              as: Planner
              captures: { order_3: $.data.id }
