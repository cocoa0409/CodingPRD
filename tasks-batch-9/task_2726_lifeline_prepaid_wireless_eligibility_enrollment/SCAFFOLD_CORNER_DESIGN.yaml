              as_user_id: "${prov_id}"
              captures: { addr1_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1400 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr2_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr1_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Beto Ruiz", date_of_birth: "1958-12-19", last4_ssn: "2290", address_id: "${addr2_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub2_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub1_id}/eligibility-checks"
