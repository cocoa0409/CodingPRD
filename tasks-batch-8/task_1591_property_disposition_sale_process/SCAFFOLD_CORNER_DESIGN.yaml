# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Property Disposition & Sale Process Management
# Sections per references/claim-extraction-guide.md; instances excluded_because
# point at the §1.8 instance that already exercises the claim.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_asset_returns_201_with_system_defaults
        claim_type: creation
        grounds:
          - "entities.Asset"
        distinguishing_aspect: "POST /disposition/assets with all required fields returns 201 and the server-initialized fields are exactly: marketing_status EVALUATION, deal_status IDLE, version 1, forfeited_deposits_cents 0, offers_deadline null, final_sale_price_cents null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 3000000000, loan_rate_bps: 650, loan_maturity_date: "2030-06-30T00:00:00Z", monthly_debt_service_cents: 19000000, remaining_term_months: 46, prepayment_type: YIELD_MAINTENANCE, prepayment_lockout_until: "2026-01-01T00:00:00Z", defeasance_allowed: true, defeasance_fee_cents: 50000000 }, as: DispositionManager, captures: { a_id: $.data.id, a_mkt: $.data.marketing_status, a_deal: $.data.deal_status, a_ver: $.data.version, a_forf: $.data.forfeited_deposits_cents } }
          assert:
            - "201; data.marketing_status == EVALUATION, data.deal_status == IDLE, data.version == 1, data.forfeited_deposits_cents == 0"
            - "data.id is a UUID, data.created_at/updated_at are ISO-8601 with three fractional digits"

      - name: get_asset_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /disposition/assets/00000000-0000-0000-0000-000000000000", as: DispositionManager, captures: { err: $.data.error_id, msg: $.data.message } }
          assert:
            - "404; data.error_id == ERR_NOT_FOUND; data.message non-empty; response_type == error"

      - name: list_assets_filter_and_pagination
        claim_type: listing
        grounds:
          - endpoints."GET /disposition/assets"
          - "response_envelope"
        distinguishing_aspect: "GET /disposition/assets?marketing_status=EVALUATION&limit=1 returns exactly 1 row with pagination metadata total_count == 2 and has_more == true; offset=1 returns the second."
        test_recipe:
          setup: ["two assets created, both in EVALUATION"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "A1", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a1: $.data.id } }
            - { call: "POST /disposition/assets", payload: { name: "A2", market: "Phoenix", asset_type: INDUSTRIAL, noi_cents: 120000000, noi_growth_bps: 200, book_value_cents: 1500000000, guidance_price_cents: 1800000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a2: $.data.id } }
          trigger:
            - { call: "GET /disposition/assets", payload: { marketing_status: EVALUATION, limit: 1, offset: 0 }, as: DispositionManager }
          assert:
            - "response_type == array; exactly 1 row returned (limit honored)"
            - "pagination metadata: total_count == 2, has_more == true, limit == 1, offset == 0"
            - "a second call with offset 1 returns the other asset and has_more == false"

      - name: create_asset_invalid_enum_returns_invalid_request
        claim_type: type_constraint
        grounds:
          - "entities.Asset.fields.asset_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "asset_type WAREHOUSE is not a declared enum member -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /disposition/assets", payload: { name: "Bad", market: "Dallas", asset_type: WAREHOUSE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { err: $.data.error_id } }
          assert:
            - "400; data.error_id == ERR_INVALID_REQUEST"

      - name: create_asset_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Asset.fields.name"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "omitting the required input field name -> 400 ERR_INVALID_REQUEST before any state or business rule runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /disposition/assets", payload: { market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { err: $.data.error_id } }
          assert:
            - "400; data.error_id == ERR_INVALID_REQUEST"

      - name: create_asset_status_input_ignored
        claim_type: system_fields
        grounds:
          - "entities.Asset.fields.marketing_status"
        distinguishing_aspect: "a client-supplied marketing_status in the create payload is ignored (system-owned field): the asset is created EVALUATION regardless."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false, marketing_status: "LISTED" }, as: DispositionManager, captures: { a_mkt: $.data.marketing_status } }
          assert:
            - "201; data.marketing_status == EVALUATION — client input for the system field ignored"

      - name: package_completeness_partial_then_publish_blocked
        claim_type: computed_fields
        grounds:
          - "entities.OfferingPackage.fields.completeness_pct"
          - "errors[ERR_PACKAGE_INCOMPLETE]"
        distinguishing_aspect: "with 2 of 8 categories VERIFIED, completeness_pct == 25 (floor(2*100/8)); publish is rejected ERR_PACKAGE_INCOMPLETE — the computed field drives the gate."
        test_recipe:
          setup: ["Alpha asset with an ACTIVE engagement and a package holding 8 uploaded docs of which only 2 categories are VERIFIED"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id } }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { eng: $.data.id } }
            - { call: "POST /disposition/engagements/${eng}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages", payload: { asset_id: "${a_id}" }, as: AssetAnalyst, as_user_id: analyst-1, captures: { pkg: $.data.id } }
            - { call: "POST /disposition/packages/${pkg}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr.pdf" }, { category: OPERATING_STATEMENTS, file_name: "os.pdf" }, { category: TITLE_COMMITMENT, file_name: "tc.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/packages/${pkg}/verify_document", payload: { categories: [RENT_ROLL, OPERATING_STATEMENTS] }, as: DispositionManager, as_user_id: dm-1, captures: { pct: $.data.completeness_pct, vc: $.data.verified_categories_count } }
          trigger:
            - { call: "POST /disposition/packages/${pkg}/publish", as: DispositionManager, as_user_id: dm-1, captures: { err: $.data.error_id } }
          assert:
            - "after verifying 2 of 8: verified_categories_count == 2 and completeness_pct == 25"
            - "publish fails err == ERR_PACKAGE_INCOMPLETE (422)"

  - section: state_machines
    instances:
      - name: asset_withdraw_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Asset"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "from marketing WITHDRAWN every further transition endpoint is rejected ERR_INVALID_STATE_TRANSITION; verified with /list."
        test_recipe:
          setup: ["Alpha asset with APPROVED SELL analysis and ACTIVE engagement, then withdrawn while deal IDLE"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id } }
            - { call: "POST /disposition/analyses/${an}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/analyses/${an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1 }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { eng: $.data.id } }
            - { call: "POST /disposition/engagements/${eng}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/withdraw", as: DispositionManager, as_user_id: dm-1, captures: { mkt: $.data.marketing_status } }
          trigger:
            - { call: "POST /disposition/assets/${a_id}/list", as: DispositionManager, as_user_id: dm-1, captures: { err: $.data.error_id } }
          assert:
            - "withdraw succeeded with marketing_status == WITHDRAWN"
            - "subsequent /list fails err == ERR_INVALID_STATE_TRANSITION (terminal lockdown)"

      - name: analysis_decide_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.HoldSellAnalysis"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "decide on a DRAFT analysis (submit skipped) -> ERR_INVALID_STATE_TRANSITION; the state machine requires DRAFT -> SUBMITTED first."
        test_recipe:
          setup: ["Alpha asset; analysis created (DRAFT)"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id } }
          trigger:
            - { call: "POST /disposition/analyses/${an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION; analysis remains DRAFT"

      - name: analysis_creator_cannot_decide_sod
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.HoldSellAnalysis.SUBMITTED_to_APPROVED"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "the deciding InvestmentCommittee call carrying the SAME X-User-ID as the analysis creator is rejected ERR_SEGREGATION_OF_DUTIES even though the role is correct."
        test_recipe:
          setup: ["Alpha asset; analysis SUBMITTED by analyst-1"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id } }
            - { call: "POST /disposition/analyses/${an}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
          trigger:
            - { call: "POST /disposition/analyses/${an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: analyst-1, captures: { err: $.data.error_id } }
          assert:
            - "403 err == ERR_SEGREGATION_OF_DUTIES — role valid, identity collides with creator"

      - name: engagement_auto_expires_via_clock
        claim_type: side_effect_execution
        grounds:
          - "state_machines.BrokerEngagement.ACTIVE_to_EXPIRED"
          - endpoints."POST /disposition/_clock/set_current_utc"
        distinguishing_aspect: "setting the clock past window_end flips an ACTIVE engagement to EXPIRED with no direct engagement call (system sweep side effect)."
        test_recipe:
          setup: ["Alpha asset; engagement [2026-08-10, 2026-09-01] ACTIVE; clock then set to 2026-09-02"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id } }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { eng: $.data.id } }
            - { call: "POST /disposition/engagements/${eng}/activate", as: DispositionManager, as_user_id: dm-1 }
          trigger:
            - { call: "POST /disposition/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "GET /disposition/assets/${a_id}/engagements", as: DispositionManager, captures: { eng_st: "$.data[0].status" } }
          assert:
            - "engagement status == EXPIRED after the clock sweep (window_end 2026-09-01 < clock 2026-09-02)"

      - name: document_upload_locked_while_offers_open
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.OfferingPackage"
          - "errors[ERR_DATA_ROOM_LOCKED]"
        distinguishing_aspect: "upload_document is rejected ERR_DATA_ROOM_LOCKED exactly while asset.marketing_status == OFFERS_OPEN — a cross-entity guarded transition on the package."
        test_recipe:
          setup: ["Alpha asset marketed to OFFERS_OPEN (package PUBLISHED)"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id } }
            - { call: "POST /disposition/analyses/${an}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/analyses/${an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1 }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { eng: $.data.id } }
            - { call: "POST /disposition/engagements/${eng}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages", payload: { asset_id: "${a_id}" }, as: AssetAnalyst, as_user_id: analyst-1, captures: { pkg: $.data.id } }
            - { call: "POST /disposition/packages/${pkg}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr.pdf" }, { category: OPERATING_STATEMENTS, file_name: "os.pdf" }, { category: TITLE_COMMITMENT, file_name: "tc.pdf" }, { category: SURVEY, file_name: "sv.pdf" }, { category: ENVIRONMENTAL_REPORT, file_name: "er.pdf" }, { category: LEASES, file_name: "ls.pdf" }, { category: TAX_BILLS, file_name: "tb.pdf" }, { category: SERVICE_CONTRACTS, file_name: "sc.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/packages/${pkg}/verify_document", payload: { categories: [RENT_ROLL, OPERATING_STATEMENTS, TITLE_COMMITMENT, SURVEY, ENVIRONMENTAL_REPORT, LEASES, TAX_BILLS, SERVICE_CONTRACTS] }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages/${pkg}/publish", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/list", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/open_offers", payload: { offers_deadline: "2026-09-15T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1 }
          trigger:
            - { call: "POST /disposition/packages/${pkg}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr2.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DATA_ROOM_LOCKED (409); package remains PUBLISHED and RENT_ROLL doc unchanged"

      - name: document_supersede_reverts_published_package
        claim_type: conditional_cascade
        grounds:
          - "state_machines.OfferingPackage.PUBLISHED_to_IN_REVIEW"
          - "entities.OfferingPackage.fields.completeness_pct"
        distinguishing_aspect: "superseding a VERIFIED document while the asset is merely LISTED (not OFFERS_OPEN) is allowed but cascades: old doc SUPERSEDED, package PUBLISHED -> IN_REVIEW, completeness drops to 87; re-verify + re-publish restores PUBLISHED (cycle)."
        test_recipe:
          setup: ["Alpha asset LISTED with PUBLISHED package (8 verified categories)"]
          setup_api_calls:
            - { call: "POST /disposition/assets", payload: { name: "Alpha", market: "Dallas", asset_type: OFFICE, noi_cents: 250000000, noi_growth_bps: 300, book_value_cents: 4000000000, guidance_price_cents: 5000000000, loan_balance_cents: 0, loan_rate_bps: 0, loan_maturity_date: null, monthly_debt_service_cents: 0, remaining_term_months: 0, prepayment_type: NONE, defeasance_allowed: false }, as: DispositionManager, captures: { a_id: $.data.id, a_v: $.data.version } }
            - { call: "POST /disposition/analyses", payload: { asset_id: "${a_id}", expected_asset_version: "${a_v}", cap_rate_bps: 500, discount_rate_bps: 800, exit_cap_rate_bps: 600, hold_years: 5, selected_method: DIRECT_CAP, est_sale_price_cents: 5200000000, est_selling_costs_cents: 200000000 }, as: AssetAnalyst, as_user_id: analyst-1, captures: { an: $.data.id } }
            - { call: "POST /disposition/analyses/${an}/submit", as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/analyses/${an}/decide", payload: { decision: APPROVE }, as: InvestmentCommittee, as_user_id: ic-1 }
            - { call: "POST /disposition/engagements", payload: { asset_id: "${a_id}", broker_firm_name: "BrokerCo", broker_user_id: "broker-1", window_start: "2026-08-10T00:00:00Z", window_end: "2027-02-10T00:00:00Z" }, as: DispositionManager, as_user_id: dm-1, captures: { eng: $.data.id } }
            - { call: "POST /disposition/engagements/${eng}/activate", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages", payload: { asset_id: "${a_id}" }, as: AssetAnalyst, as_user_id: analyst-1, captures: { pkg: $.data.id } }
            - { call: "POST /disposition/packages/${pkg}/upload_document", payload: { documents: [ { category: RENT_ROLL, file_name: "rr.pdf" }, { category: OPERATING_STATEMENTS, file_name: "os.pdf" }, { category: TITLE_COMMITMENT, file_name: "tc.pdf" }, { category: SURVEY, file_name: "sv.pdf" }, { category: ENVIRONMENTAL_REPORT, file_name: "er.pdf" }, { category: LEASES, file_name: "ls.pdf" }, { category: TAX_BILLS, file_name: "tb.pdf" }, { category: SERVICE_CONTRACTS, file_name: "sc.pdf" } ] }, as: AssetAnalyst, as_user_id: analyst-1 }
            - { call: "POST /disposition/packages/${pkg}/verify_document", payload: { categories: [RENT_ROLL, OPERATING_STATEMENTS, TITLE_COMMITMENT, SURVEY, ENVIRONMENTAL_REPORT, LEASES, TAX_BILLS, SERVICE_CONTRACTS] }, as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/packages/${pkg}/publish", as: DispositionManager, as_user_id: dm-1 }
            - { call: "POST /disposition/assets/${a_id}/list", as: DispositionManager, as_user_id: dm-1 }
          trigger:
