            - "${e_rescreen} == ERR_INVALID_COMPLAINT_STATE with HTTP 409"
            - "${e_assign} == ERR_INVALID_COMPLAINT_STATE with HTTP 409"
            - "${e_close} == ERR_INVALID_COMPLAINT_STATE with HTTP 409"
            - "Complaint.${cmp}.status is still SCREENED_OUT and assigned_investigator_id is still null"

      - name: sm_idempotency_second_submit_application_rejected
