          Entity pair CreditCertificate -> AuditPackage: issue-credit is gated
          by the audit package being ACCEPTED — ATTESTED (CPA signed but
          office has not accepted) still blocks with ERR_AUDIT_NOT_ACCEPTED;
          the ACCEPT transition alone unblocks issuance with no change to the
          application. Distinct pair from SpendEntry -> Vendor.
