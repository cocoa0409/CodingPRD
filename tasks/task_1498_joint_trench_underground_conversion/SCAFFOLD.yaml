  - { method: POST, path: "/api/true-up-runs", description: "Create true-up run (computes lines; supersedes prior PUBLISHED run; OCC on project version). Prerequisites: project RECONCILIATION, all segments CLOSED, every non-withdrawn participation INSTALLED|BILLED|SETTLED (ERR_TRUEUP_PREREQUISITES)", roles: [FinanceAnalyst], code: 201, input: [project_id, expected_project_version], output: TrueUpRun, side_effects: ["prior PUBLISHED run -> SUPERSEDED, its ISSUED|DISPUTED invoices -> VOID", "project version incremented by 1", "latest_true_up_run_id updated"] }
  - { method: GET, path: "/api/true-up-runs", description: "List true-up runs", roles: [ProgramManager, FinanceAnalyst], code: 200, input: ["project_id?", "status?"], output: "TrueUpRun[]", side_effects: [] }
  - { method: GET, path: "/api/true-up-runs/{id}", description: "Get true-up run incl. computed lines", roles: [ProgramManager, FinanceAnalyst], code: 200, input: [], output: TrueUpRun, side_effects: [] }
  - { method: POST, path: "/api/true-up-runs/{id}/transition", description: "to PUBLISHED (segregation of duties; issues invoices) | SETTLED", roles: [ProgramManager], code: 200, input: [to], output: TrueUpRun, side_effects: ["publish creates invoices, participations INSTALLED -> BILLED"] }
  - { method: GET, path: "/api/invoices", description: "List invoices", roles: [ProgramManager, UtilityCoordinator, FinanceAnalyst], code: 200, input: ["true_up_run_id?", "participation_id?", "status?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/api/invoices/{id}", description: "Get invoice (late fee evaluated at read)", roles: [ProgramManager, UtilityCoordinator, FinanceAnalyst], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/api/invoices/{id}/transition", description: "to PAID|DISPUTED|ISSUED(resolve)|VOID", roles: [UtilityCoordinator, ProgramManager], code: 200, input: [to, "paid_amount_cents?", "reason?", "adjusted_principal_cents?"], output: Invoice, side_effects: ["payment cascades participation BILLED -> SETTLED when all its invoices final"] }

  # --- RestorationTask ---
  - { method: POST, path: "/api/restoration-tasks", description: "Create restoration task (OPEN)", roles: [ConversionContractor, ProgramManager], code: 201, input: [trench_segment_id, parcel_id, task_type], output: RestorationTask, side_effects: [] }
  - { method: GET, path: "/api/restoration-tasks", description: "List restoration tasks", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: ["trench_segment_id?", "parcel_id?", "status?"], output: "RestorationTask[]", side_effects: [] }
  - { method: GET, path: "/api/restoration-tasks/{id}", description: "Get restoration task (warranty_expires_on)", roles: [ProgramManager, RightOfWayAgent, UtilityCoordinator, ConversionContractor, FinanceAnalyst], code: 200, input: [], output: RestorationTask, side_effects: [] }
  - { method: POST, path: "/api/restoration-tasks/{id}/transition", description: "to IN_WORK|COMPLETE|ACCEPTED|WARRANTY_CLAIM", roles: [ConversionContractor, ProgramManager], code: 200, input: [to], output: RestorationTask, side_effects: ["COMPLETE sets warranty window"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the server never falls back to wall-clock time; lazy permit expiry and late fees evaluate against this clock.", roles: [ProgramManager], code: 200, input: [to_iso8601], output: null, side_effects: ["lazy permit expiry sweep"] }

# =============================================================================
# §1.6 Error Code Catalog (33)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "UtilityCoordinator acting on a participation (or its slot/invoice) that is not their own" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid field, bad enum, malformed window, or referential format error" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition (incl. terminal lockdown)" }
  - { id: ERR_POSTURE_FROZEN, http: 409, condition: "Project posture FROZEN blocks lifecycle advance" }
  - { id: ERR_CHANGE_ORDER_FREEZE, http: 409, condition: "Segment frozen by an APPROVED change order" }
  - { id: ERR_MIN_PARTICIPANTS, http: 409, condition: "MOBILIZE requires >= 2 COMMITTED participations" }
  - { id: ERR_SHARE_SUM_INVALID, http: 422, condition: "cost_share_bp sum over active participations != 10000 at mobilize" }
  - { id: ERR_DUPLICATE_SEQUENCE, http: 409, condition: "sequence_order duplicated among non-withdrawn participations of the project" }
  - { id: ERR_MIN_COVER_VIOLATION, http: 422, condition: "depth_top_inches < 12" }
  - { id: ERR_DEPTH_CAPACITY_EXCEEDED, http: 422, condition: "depth_bottom_inches > segment max_depth_inches" }
  - { id: ERR_MIN_SEPARATION_VIOLATION, http: 422, condition: "Vertical gap to an adjacent band below required separation (12in standard / 6in waiver pair)" }
  - { id: ERR_ELECTRIC_NOT_DEEPEST, http: 422, condition: "A non-electric band would sit at or below an electric band on the same segment" }
  - { id: ERR_SLOT_WINDOW_OUT_OF_RANGE, http: 422, condition: "Install window outside the segment excavation window" }
  - { id: ERR_SLOT_WINDOW_CONFLICT, http: 409, condition: "Overlapping install windows with vertical gap < 24in, or shallower-before-deeper ordering" }
  - { id: ERR_SLOT_ORDER_VIOLATION, http: 409, condition: "INSTALLING while a deeper slot on the segment is not yet INSTALLED|VERIFIED" }
  - { id: ERR_EASEMENT_NOT_RECORDED, http: 409, condition: "A parcel on the segment lacks a RECORDED TRENCH easement" }
  - { id: ERR_EASEMENT_REFUSED_BLOCKING, http: 409, condition: "A TRENCH easement on a segment parcel is REFUSED" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "No ISSUED ENCROACHMENT permit for the project" }
  - { id: ERR_PERMIT_WINDOW_VIOLATION, http: 409, condition: "Permit validity window does not fully cover the excavation window" }
  - { id: ERR_PANEL_CAPACITY_INADEQUATE, http: 422, condition: "panel_capacity_amps < ceil(load_calc_amps * 1.25)" }
  - { id: ERR_SEGMENT_NOT_BACKFILLED, http: 409, condition: "Energize requires the parcel's segment BACKFILLED|CLOSED" }
  - { id: ERR_TEMP_SERVICE_REQUIRED, http: 409, condition: "Outage execution with an affected conversion neither energized nor on active temp service" }
  - { id: ERR_OUTAGE_DURATION_EXCEEDED, http: 422, condition: "Outage window longer than 8h" }
  - { id: ERR_CREW_CAPACITY_EXCEEDED, http: 409, condition: "More than 2 overlapping active outage windows on the same feeder (half-open intervals)" }
  - { id: ERR_NOTIFICATION_LEAD_TIME, http: 409, condition: "NOTIFIED requires start_at - clock >= 72h" }
  - { id: ERR_OUTAGE_WINDOW_MISSED, http: 409, condition: "Execution attempted after end_at" }
  - { id: ERR_TRUEUP_PREREQUISITES, http: 409, condition: "True-up requires RECONCILIATION, all segments CLOSED, all non-withdrawn participations INSTALLED|BILLED|SETTLED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "True-up publisher is the run creator or a submitter of an included cost entry" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "paid_amount_cents != amount_due_cents (incl. accrued late fee)" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "Warranty claim after warranty_expires_on" }
  - { id: ERR_RESTORATION_OPEN_BLOCKING, http: 409, condition: "Segment close blocked by restoration tasks not ACCEPTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramManager
    description: "Utility program manager: owns the project lifecycle, segments, change orders, true-up publication, dispute resolution, restoration acceptance"
    identity: opaque
    exclusive_operations:
      - "POST /api/projects, /api/projects/{id}/lifecycle, /api/projects/{id}/replan"
      - "POST /api/participations"
      - "POST /api/trench-segments*, POST /api/change-orders*, POST /api/true-up-runs/{id}/transition"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints; outage approve/cancel/reschedule; slot VERIFIED; invoice VOID/resolve; restoration ACCEPTED/WARRANTY_CLAIM; parcel create"
  - name: RightOfWayAgent
    description: "Land/right-of-way specialist: easements and permits"
    identity: opaque
    exclusive_operations:
      - "POST /api/easements*, POST /api/permits*"
    shared_operations: ["GET endpoints; parcel create"]
  - name: UtilityCoordinator
    description: "Participating utility's trench coordinator: commits participation, reserves/installs slots, requests and runs outages, pays own invoices"
    identity: "entity_backed:UtilityParticipation"
    exclusive_operations:
      - "POST /api/participations/{id}/transition (own)"
      - "POST /api/occupancy-slots and slot transitions (own participation)"
      - "invoice PAID/DISPUTED (own)"
    shared_operations: ["GET endpoints; outage create/NOTIFIED/EXECUTED/CLOSED"]
  - name: ConversionContractor
    description: "Service conversion and restoration contractor"
    identity: opaque
    exclusive_operations:
      - "POST /api/service-conversions and both transition endpoints"
      - "POST /api/restoration-tasks/{id}/transition for IN_WORK/COMPLETE"
    shared_operations: ["GET endpoints; restoration task create"]
  - name: FinanceAnalyst
    description: "Cost accountant: submits actual costs and drafts true-up runs; may never publish (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /api/actual-cost-entries"
      - "POST /api/true-up-runs"
    shared_operations: ["GET endpoints"]
