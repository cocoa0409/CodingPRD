      - name: reduction_waterfall_empty_pool_then_inclusive_stop_at_exact_target
        grounds:
          - calculations.reduction_scenario_waterfall
          - validations[priority=44]
          - entities.ReductionScenario.fields.overshoot_cents
          - entities.ReductionScenario.fields.feasibility
        distinguishing_aspect: |
          Two boundaries on the waterfall's candidate pool and stop condition rather than on
          a monetary threshold: an all-DEFERRED pool of size 0 returns
          ERR_NO_REDUCTION_CANDIDATES, and a single PROPOSED candidate of exactly
          100000000 cents against a target of exactly 100000000 stops inclusively with
          achieved_reduction_cents 100000000, overshoot_cents 0 and feasibility FEASIBLE.
        test_recipe:
          setup:
            - "Agency DOC; BudgetCycle 2027 in phase DEVELOPMENT"
            - "ACCEPTED AgencyRequest with base_budget_cents 1000000000, so a 0.10 target is exactly 100000000 cents"
            - "One REDUCTION DecisionPackage of 100000000 cents at priority_rank 1 that has been DEFERRED, leaving the candidate pool empty"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOC", name: "Department of Corrections", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "REDUCTION", priority_rank: 1, amount_cents: 100000000, fte_delta: -8 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_def_id: $.data.id }
            - call: "POST /fiscal/agency-requests/${req_id}/submit"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agency-requests/${req_id}/begin-review"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/agency-requests/${req_id}/accept"
              payload: {}
              as: BudgetAnalyst
            - call: "POST /fiscal/decision-packages/${pkg_def_id}/defer"
              payload: {}
              as: BudgetAnalyst
          trigger:
            - call: "POST /fiscal/reduction-scenarios"
              payload: { budget_cycle_id: "${cyc_id}", target_reduction_pct: 0.10 }
              as: BudgetAnalyst
            - call: "POST /fiscal/decision-packages"
              payload: { agency_request_id: "${req_id}", package_type: "REDUCTION", priority_rank: 2, amount_cents: 100000000, fte_delta: -8 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { pkg_live_id: $.data.id }
            - call: "POST /fiscal/reduction-scenarios"
              payload: { budget_cycle_id: "${cyc_id}", target_reduction_pct: 0.10 }
              as: BudgetAnalyst
              captures: { scen_id: $.data.id }
          assert:
            - "the first POST /fiscal/reduction-scenarios returns HTTP 422 with error_id == ERR_NO_REDUCTION_CANDIDATES"
            - "the second POST /fiscal/reduction-scenarios returns HTTP 201"
            - "ReductionScenario.${scen_id}.target_reduction_cents == 100000000"
            - "ReductionScenario.${scen_id}.selected_package_ids == [\"${pkg_live_id}\"]"
            - "ReductionScenario.${scen_id}.achieved_reduction_cents == 100000000"
            - "ReductionScenario.${scen_id}.overshoot_cents == 0"
            - "ReductionScenario.${scen_id}.feasibility == FEASIBLE"
            - "DecisionPackage.${pkg_def_id}.status == DEFERRED and its id is absent from ReductionScenario.${scen_id}.selected_package_ids"

      - name: allotment_ceiling_tie_at_quarter_cap_then_one_cent_over
        grounds:
