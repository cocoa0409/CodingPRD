            - "RepetitiveLossArea.${area_id}.delivered_count == 2"
            - "RepetitiveLossArea.${area_id}.target_property_count == 4"
            - "RepetitiveLossArea.${area_id}.outreach_cycle_year == 2026"
            - "RepetitiveLossArea.${area_id}.outreach_crs_cycle_id == ${cycle_id}"
            - "RepetitiveLossArea.${area_id}.status == DESIGNATED"
            - "RepetitiveLossArea.${area_id}.analysis_status == ANALYZED"

      - name: permit_revision_loop_bound_is_enforced
        claim_type: cyclic_loop_termination
        grounds:
          - complexity_profile.state_machine_shape
          - validations.priority_71
          - calculations.derived_deadlines_and_loop_limits
        excluded_because:
          difficulty_instance: permit_revision_loop_blocks_fourth_revision_round
          rationale: |
            The UNDER_REVIEW <-> REVISION_REQUIRED cycle and its MAX_REVISION_ROUNDS = 3
            termination condition are the subject of that §1.8 non_linear_state_machine
            instance, which walks three full loops and asserts the 422
            ERR_REVISION_LIMIT_EXCEEDED on the fourth with revision_round frozen at 3.

      - name: certificate_amendment_loop_returns_to_submitted
        claim_type: cyclic_loop_back
        grounds:
          - state_machines.ElevationCertificate.DEFICIENT_to_SUBMITTED
          - calculations.certificate_datum_normalization
        excluded_because:
          difficulty_instance: certificate_deficiency_amend_loop_then_accepted_at_zero_margin
          rationale: |
            That §1.8 instance drives the same SUBMITTED -> DEFICIENT -> SUBMITTED loop and
            additionally proves the amendment re-runs datum normalization (NGVD29 13.60
            giving margin -0.7, then NAVD88 13.50 giving margin exactly 0.0 and ACCEPTED).

      - name: inspection_finalize_cascade_reaches_the_permit
        claim_type: cascade_chain
        grounds:
          - state_machines.PostDisasterInspection.ASSESSED_to_FINALIZED
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: inspection_finalize_cascades_five_hops_to_permit_revision
          rationale: |
            The full five-hop Cascade A (DAMAGE record -> aggregates -> auto DETERMINED case
            -> SUBSTANTIAL_DAMAGE -> permit REVISION_REQUIRED, plus the hop-5 repetitive-loss
            STALE branch) is that §1.8 transitive_cascade instance's entire subject.

      - name: reversal_compensates_every_ledger_side_effect
        claim_type: compensation_side_effect_reversal
        grounds:
          - endpoints."POST /floodplain/improvement-records"
          - state_machines.DeterminationCase.DETERMINED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: reversal_record_restores_ledger_aggregates_without_mutating_history
          rationale: |
            Undoing the anchor record and asserting that aggregates return to 60000.00 /
            30.00, the case moves to WITHDRAWN, substantial_status reverts to NONE and the
            three history rows are preserved is that §1.8 compensating_invariant instance.

      - name: escalated_violation_reverts_on_remediation
        claim_type: cyclic_revert
        grounds:
          - state_machines.Violation.ESCALATED_to_REMEDIATED
          - calculations.sanction_risk_and_posture
        excluded_because:
          difficulty_instance: violation_remediation_restores_community_sanction_points_to_zero
          rationale: |
            The ESCALATED -> REMEDIATED revert and the conserved-quantity claim (17 sanction
            points back to 0 while the DEFAULTED order stays DEFAULTED) is that §1.8
            compensating_invariant instance.

      - name: permit_issue_is_guarded_by_community_posture
        claim_type: guarded_transition
        grounds:
          - validations.priority_57
          - state_machines.DevelopmentPermit.APPROVED_to_ISSUED
        excluded_because:
          difficulty_instance: permit_issue_blocked_by_probation_only_for_substantial_structure
          rationale: |
            The cross-entity guard on APPROVED -> ISSUED (ON_PROBATION community blocks only
            substantially improved or damaged structures) is that §1.8
            cross_entity_state_dependency instance, which contrasts the blocked and the
            allowed structure at the same 12 sanction points.

  # ===========================================================================
  - section: calculations
    instances:

      - name: zero_cumulative_period_collapses_the_window_to_the_anchor_day
        claim_type: input_set_filtering
        grounds:
          - calculations.structure_improvement_aggregates
          - entities.Community.fields.cumulative_period_years
          - endpoints."POST /floodplain/improvement-records"
        distinguishing_aspect: |
          With cumulative_period_years 0 the closed window is [anchor.event_date,
          anchor.event_date], so only the 60000.00 record dated 2026-06-01 is summed and both
          ratios read 30.00; the 40000.00 record of 2026-03-01 is counted
          (counted_in_cumulative true) yet excluded from the window, which is exactly the
          case a naive "sum every counted record" implementation reports as 50.00.
        test_recipe:
          setup:
            - "Community with cumulative_period_years 0; EFFECTIVE AE panel; parcel; RESIDENTIAL structure worth 200000.00."
            - "Two counted IMPROVEMENT records: 40000.00 on 2026-03-01 and 60000.00 on 2026-06-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Zero Window City", state_code: "TX", cid_number: "480007", freeboard_ft: 1.5, cumulative_period_years: 0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 40000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_old_id: $.data.id }
          trigger:
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-06-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_new_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ImprovementRecord.${rec_new_id}.counted_in_cumulative == true"
            - "ImprovementRecord.${rec_old_id}.counted_in_cumulative == true"
            - "Structure.${struct_id}.anchor_record_id == ${rec_new_id}"
            - "Structure.${struct_id}.cumulative_counted_cost_usd == 60000.00"
            - "Structure.${struct_id}.cumulative_improvement_pct == 30.00"
            - "Structure.${struct_id}.single_event_improvement_pct == 30.00"
            - "Structure.${struct_id}.substantial_status == NONE"

      - name: code_compliance_only_record_is_excluded_from_the_ledger
        claim_type: input_set_filtering
        grounds:
          - calculations.structure_improvement_aggregates
          - entities.ImprovementRecord.fields.is_code_compliance_only
          - entities.ImprovementRecord.fields.counted_in_cumulative
        distinguishing_aspect: |
          The code-compliance record is both the newest and by far the largest
          (150000.00 on 2026-06-01) yet is stamped counted_in_cumulative false, so the anchor
          stays on the 60000.00 record of 2026-03-01 and the ratio stays 30.00 — counting it
          would have moved the anchor and produced 105.00 with a substantial-improvement case.
        test_recipe:
          setup:
            - "Canonical base fixture (community cumulative_period_years 10) through the structure."
            - "One counted IMPROVEMENT record of 60000.00 on 2026-03-01."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
            - call: "POST /floodplain/firm-panels"
              payload: { community_id: "${comm_id}", panel_number: "48001C0100", suffix: "H", flood_zone: "AE", effective_date: "2020-01-01T00:00:00Z", base_flood_elevation_ft: 12.0 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { panel_id: $.data.id }
            - call: "POST /floodplain/firm-panels/${panel_id}/activate"
              as: StateNfipCoordinator
              as_user_id: "snc-01"
            - call: "POST /floodplain/properties"
              payload: { community_id: "${comm_id}", firm_panel_id: "${panel_id}", parcel_id: "P-0001", mapped_area_code: "RLA-1", owner_name: "A Owner", owner_email: "a@example.com" }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { prop_id: $.data.id }
            - call: "POST /floodplain/structures"
              payload: { property_id: "${prop_id}", structure_use: "RESIDENTIAL", pre_firm: false, construction_year: 1998, market_value_usd: 200000.00, highest_adjacent_grade_ft: 10.0 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { struct_id: $.data.id }
            - call: "POST /floodplain/improvement-records"
              payload: { structure_id: "${struct_id}", record_type: "IMPROVEMENT", event_date: "2026-03-01T00:00:00Z", cost_usd: 60000.00 }
              as: FloodplainAdministrator
              as_user_id: "fpa-01"
              captures: { rec_counted_id: $.data.id }
          trigger:
            - call: "POST /floodplain/improvement-records"
