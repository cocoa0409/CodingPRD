# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: custom_order_quote_vs_invoice_diverge
        grounds:
          - calculations.custom_order_amount
          - state_machines.CustomOrder.DRAFT_to_QUOTED
          - state_machines.CustomOrder.IN_PRODUCTION_to_FULFILLED
        distinguishing_aspect: "On CustomOrder, provisional quote uses units_estimated (100) while final invoice uses units_produced (95), so quoted_amount_cents=205000 != invoiced_amount_cents=196000."
        test_recipe:
          setup:
            - "One CORPORATE customer, one SINGLE product base_price_cents=1500, one ACTIVE mold cap 500."
            - "Custom order units_estimated=100 quoted, accepted, produced with units_produced=95."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Corp A", email: "corp@x.com", account_type: "CORPORATE" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "TRUFFLE-1", name: "Truffle", product_type: "SINGLE", base_price_cents: 1500, shelf_life_days: 30, unit_weight_g: 12 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /molds", payload: { name: "Heart", cavity_count: 12, daily_capacity_units: 500 }, as: ProductionManager, captures: { mold_id: "$.data.id" } }
            - { call: "POST /custom-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", mold_id: "${mold_id}", units_estimated: 100 }, as: Customer, as_user_id: "${cust_id}", captures: { co_id: "$.data.id" } }
            - { call: "POST /custom-orders/${co_id}/quote", payload: {}, as: SalesManager, captures: { quoted: "$.data.quoted_amount_cents" } }
            - { call: "POST /custom-orders/${co_id}/accept", payload: { usage_date: "2026-07-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /custom-orders/${co_id}/start-production", payload: {}, as: ProductionManager }
          trigger:
            - { call: "POST /custom-orders/${co_id}/fulfill", payload: { units_produced: 95 }, as: ProductionManager, captures: { invoiced: "$.data.invoiced_amount_cents" } }
          assert:
            - "CustomOrder.${co_id}.quoted_amount_cents == 205000"
            - "CustomOrder.${co_id}.invoiced_amount_cents == 196000"
            - "CustomOrder.${co_id}.quoted_amount_cents != CustomOrder.${co_id}.invoiced_amount_cents"

      - name: subscription_estimate_vs_settled_diverge
        grounds:
          - calculations.subscription_period_charge
          - state_machines.Subscription.ACTIVE_to_ACTIVE
          - state_machines.SubscriptionShipment.SCHEDULED_to_SHIPPED
        distinguishing_aspect: "On Subscription, estimated_charge_cents freezes the box price at scheduling (5000) while settled_charge_cents re-reads it at ship after a price bump (5500), so they diverge."
        test_recipe:
          setup:
            - "One RETAIL customer; box product base_price_cents=5000; subscription due 2026-07-05."
            - "A shipment is advanced (estimate at 5000), then box price is raised to 5500 before ship."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Sub A", email: "sub@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "BOX-1", name: "Monthly Box", product_type: "SINGLE", base_price_cents: 5000, shelf_life_days: 60, unit_weight_g: 250 }, as: Admin, captures: { box_id: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", box_product_id: "${box_id}", cadence_days: 30, next_ship_date: "2026-07-05T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-05T00:00:00Z" }, as: Admin }
            - { call: "POST /subscriptions/${sub_id}/advance", payload: {}, as: Admin, captures: { ship_id: "$.data.id", est: "$.data.estimated_charge_cents" } }
            - { call: "PATCH /products/${box_id}", payload: { base_price_cents: 5500 }, as: Admin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-06T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /subscription-shipments/${ship_id}/ship", payload: {}, as: Admin, captures: { settled: "$.data.settled_charge_cents" } }
          assert:
            - "SubscriptionShipment.${ship_id}.estimated_charge_cents == 5000"
            - "SubscriptionShipment.${ship_id}.settled_charge_cents == 5500"

  - rule_id: combinatorial_formula
    instances:
      - name: wholesale_tier_selection_three_inputs
        grounds:
          - calculations.wholesale_tier_discount
          - calculations.line_unit_price
        distinguishing_aspect: "Mode (a): unit price is a non-linear function of base_price (1000), account_type (WHOLESALE) and total order units (120 -> 10% tier), giving unit 900 and total 115830."
        test_recipe:
          setup:
            - "WHOLESALE customer credit_limit 20000000; product base 1000; wholesale order, single line qty 120 (tier 10%)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "WS A", email: "ws@x.com", account_type: "WHOLESALE", credit_limit_cents: 20000000 }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "BAR-1", name: "Bar", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 90, unit_weight_g: 100 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "WHOLESALE" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 120 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total: "$.data.total_cents" } }
          assert:
            - "Order.${ord_id}.subtotal_cents == 108000"
            - "Order.${ord_id}.tax_cents == 7830"
            - "Order.${ord_id}.total_cents == 115830"

      - name: order_total_round_per_line_then_sum
        grounds:
          - calculations.order_total
          - calculations.line_unit_price
        distinguishing_aspect: "Mode (b): two retail lines at unit_exact 959.5 round to 960 each (round-per-line-then-sum -> subtotal 1920); sum-then-round would give 1919, so the pinned order is decisive."
        test_recipe:
          setup:
            - "RETAIL customer loyalty_discount_pct=0.05; two products base 1010; retail order with two lines qty 1 each."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret A", email: "ret@x.com", account_type: "RETAIL", loyalty_discount_pct: 0.05 }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "PX", name: "PX", product_type: "SINGLE", base_price_cents: 1010, shelf_life_days: 30, unit_weight_g: 20 }, as: Admin, captures: { px_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "PY", name: "PY", product_type: "SINGLE", base_price_cents: 1010, shelf_life_days: 30, unit_weight_g: 20 }, as: Admin, captures: { py_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${px_id}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${py_id}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { sub: "$.data.subtotal_cents" } }
          assert:
            - "Order.${ord_id}.subtotal_cents == 1920"
            - "Order.${ord_id}.tax_cents == 139"
            - "Order.${ord_id}.total_cents == 2059"

  - rule_id: non_linear_state_machine
    instances:
      - name: batch_tempering_reseed_cycle
        grounds:
          - state_machines.Batch.RAW_to_TEMPERING
          - state_machines.Batch.TEMPERING_to_RAW
          - entities.Batch.fields.reseed_count
        distinguishing_aspect: "Batch cycles TEMPERING->RAW (reseed) returning to its start state with reseed_count incremented to 1 — a true back-edge, not a linear step."
        test_recipe:
          setup:
            - "Tempering product (tempering_minutes 60); one batch; one tempering line; batch put into TEMPERING then reseeded."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "T-1", name: "Temper SKU", product_type: "SINGLE", base_price_cents: 800, shelf_life_days: 30, unit_weight_g: 50, requires_tempering: true, tempering_minutes: 60 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /tempering-lines", payload: { name: "Line 1" }, as: ProductionManager, captures: { line_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 100 }, as: ProductionManager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batches/${batch_id}/start-tempering", payload: { tempering_line_id: "${line_id}", temper_start: "2026-07-01T10:00:00Z" }, as: ProductionManager }
          trigger:
            - { call: "POST /batches/${batch_id}/reseed", payload: {}, as: ProductionManager }
          assert:
            - "Batch.${batch_id}.status == RAW"
            - "Batch.${batch_id}.reseed_count == 1"
            - "Batch.${batch_id}.tempering_line_id == null"

      - name: custom_order_revision_requote_cycle
        grounds:
          - state_machines.CustomOrder.QUOTED_to_REVISION_REQUESTED
          - state_machines.CustomOrder.REVISION_REQUESTED_to_QUOTED
          - entities.CustomOrder.fields.quote_round
        distinguishing_aspect: "CustomOrder loops QUOTED->REVISION_REQUESTED->QUOTED, re-entering QUOTED with quote_round advanced to 2 — a negotiation cycle, not a linear approval."
        test_recipe:
          setup:
            - "One CORPORATE customer, one product, one mold; custom order quoted, revised, re-quoted."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Corp B", email: "corpb@x.com", account_type: "CORPORATE" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "C-2", name: "Custom SKU", product_type: "SINGLE", base_price_cents: 1500, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /molds", payload: { name: "Star", cavity_count: 8, daily_capacity_units: 300 }, as: ProductionManager, captures: { mold_id: "$.data.id" } }
            - { call: "POST /custom-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", mold_id: "${mold_id}", units_estimated: 50 }, as: Customer, as_user_id: "${cust_id}", captures: { co_id: "$.data.id" } }
            - { call: "POST /custom-orders/${co_id}/quote", payload: {}, as: SalesManager }
            - { call: "POST /custom-orders/${co_id}/request-revision", payload: { note: "smaller size" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /custom-orders/${co_id}/quote", payload: {}, as: SalesManager, captures: { round2: "$.data.quote_round" } }
          assert:
            - "CustomOrder.${co_id}.status == QUOTED"
            - "CustomOrder.${co_id}.quote_round == 2"

  - rule_id: transitive_cascade
    instances:
      - name: quarantine_voids_reservation_backorders_order
        grounds:
          - state_machines.Batch.RELEASED_to_QUARANTINED
          - state_machines.Order.ALLOCATED_to_BACKORDERED
          - calculations.batch_available_units
        distinguishing_aspect: "Depth-3 chain: quarantining the Batch VOIDs its Reservation (link1); the void drops OrderLine.allocated_units below quantity (link2); that shortfall moves the Order ALLOCATED->BACKORDERED (link3) — each link caused by the prior."
        test_recipe:
          setup:
            - "Non-tempering product; batch of 100 RELEASED; retail order line qty 30 confirmed and allocated (reservation 30, batch available 70)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret Q", email: "retq@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "Q-1", name: "Q SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 60, unit_weight_g: 30 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 100 }, as: ProductionManager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batches/${batch_id}/release", payload: {}, as: ProductionManager }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 30 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/allocate", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /batches/${batch_id}/quarantine", payload: { reason: "milk cross-contact" }, as: ProductionManager }
          assert:
            - "Order.${ord_id}.status == BACKORDERED"
            - "OrderLine.${line_id}.allocated_units == 0"
            - "Reservation with order_line_id==${line_id} has status == VOIDED"

      - name: cancel_order_releases_reservation_restores_batch
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - calculations.batch_available_units
        distinguishing_aspect: "Depth-2+ chain from a different trigger (order cancel): cancelling the Order RELEASEs its Reservation (link1); the release restores Batch.available_units from 70 back to 100 (link2)."
        test_recipe:
          setup:
            - "Non-tempering product; batch of 100 RELEASED; retail order line qty 30 confirmed and allocated (batch available 70)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret C", email: "retc@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "C-1", name: "C SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 60, unit_weight_g: 30 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 100 }, as: ProductionManager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batches/${batch_id}/release", payload: {}, as: ProductionManager }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 30 }, as: Customer, as_user_id: "${cust_id}", captures: { line_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/allocate", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "Order.${ord_id}.status == CANCELLED"
            - "Batch.${batch_id}.available_units == 100"
            - "Reservation with order_line_id==${line_id} has status == RELEASED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_reconfirm
        grounds:
          - validations[priority=7]
          - validations[priority=18]
        distinguishing_aspect: "Category pair state(7) vs business_fiscal(18): a re-confirm of an already-CONFIRMED wholesale order whose credit_limit was lowered below total fails BOTH; the state check wins, returning ERR_INVALID_STATE not ERR_CREDIT_LIMIT_EXCEEDED."
        test_recipe:
          setup:
            - "WHOLESALE customer credit 20000000; wholesale order qty 120 (total 115830) confirmed; then credit_limit lowered to 50000."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "WS P", email: "wsp@x.com", account_type: "WHOLESALE", credit_limit_cents: 20000000 }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "WP-1", name: "WP", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 90, unit_weight_g: 100 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "WHOLESALE" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 120 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "PATCH /customers/${cust_id}", payload: { credit_limit_cents: 50000 }, as: Admin }
          trigger:
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: safety_beats_constraint_on_allocate
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: "Category pair business_safety(8) vs business_constraint(14): allocating an order whose product became allergen-restricted AND has zero inventory fails BOTH; safety wins, returning ERR_ALLERGEN_RESTRICTED not ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup:
            - "RETAIL customer with no restrictions; product with allergen MILK; retail order qty 1 confirmed; then MILK added to customer restrictions; no batches exist."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret S", email: "rets@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "S-1", name: "Milk Bar", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 30, unit_weight_g: 40, allergens: ["MILK"] }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "PATCH /customers/${cust_id}", payload: { allergen_restrictions: ["MILK"] }, as: Admin }
          trigger:
            - { call: "POST /orders/${ord_id}/allocate", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_ALLERGEN_RESTRICTED"
            - "HTTP status == 422"

  - rule_id: boundary_precision_check
    instances:
      - name: wholesale_tier_boundary_exactly_50
        grounds:
          - calculations.wholesale_tier_discount
        distinguishing_aspect: "Numeric >= boundary on total order units: exactly 50 units triggers the 10% tier (>=, not >), so unit price is 900 and subtotal 45000 — 49 units would be 0%."
        test_recipe:
          setup:
            - "WHOLESALE customer high credit; product base 1000; wholesale order single line qty exactly 50."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "WS B", email: "wsb@x.com", account_type: "WHOLESALE", credit_limit_cents: 20000000 }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "WB-1", name: "WB", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 90, unit_weight_g: 100 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "WHOLESALE" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 50 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { sub: "$.data.subtotal_cents" } }
          assert:
            - "Order.${ord_id}.subtotal_cents == 45000"
            - "Order.${ord_id}.tax_cents == 3263"
            - "Order.${ord_id}.total_cents == 48263"

      - name: allocate_empty_inventory_pool
        grounds:
          - validations[priority=14]
          - calculations.fefo_allocation
        distinguishing_aspect: "Empty-set/zero boundary on a different endpoint (allocate): with zero RELEASED batches of the line product, the candidate pool is empty and the whole allocate is rejected with ERR_INSUFFICIENT_INVENTORY."
        test_recipe:
          setup:
            - "RETAIL customer; product with NO batches created; retail order qty 1 confirmed."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret E", email: "rete@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "E-1", name: "E SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/allocate", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INSUFFICIENT_INVENTORY"
            - "HTTP status == 409"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_allocate_requires_batch_released
        grounds:
          - state_machines.Order.CONFIRMED_to_ALLOCATED
          - entities.Batch.fields.status
        distinguishing_aspect: "Order->Batch pair: a confirmed order cannot allocate while the only batch of its product is TEMPERED (not RELEASED); allocate fails with ERR_INSUFFICIENT_INVENTORY because RELEASED is required."
        test_recipe:
          setup:
            - "Tempering product; batch tempered to TEMPERED (not released); retail order qty 1 confirmed."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Ret X", email: "retx@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "X-1", name: "X SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 30, unit_weight_g: 40, requires_tempering: true, tempering_minutes: 60 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /tempering-lines", payload: { name: "LX" }, as: ProductionManager, captures: { line_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 100 }, as: ProductionManager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batches/${batch_id}/start-tempering", payload: { tempering_line_id: "${line_id}", temper_start: "2026-07-01T10:00:00Z" }, as: ProductionManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T11:00:00Z" }, as: Admin }
            - { call: "POST /batches/${batch_id}/complete-tempering", payload: {}, as: ProductionManager }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/allocate", payload: {}, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INSUFFICIENT_INVENTORY"
            - "Batch.${batch_id}.status == TEMPERED"

      - name: custom_start_production_requires_mold_active
        grounds:
          - state_machines.CustomOrder.ACCEPTED_to_IN_PRODUCTION
          - validations[priority=12]
        distinguishing_aspect: "CustomOrder->Mold pair (different from Order->Batch): an ACCEPTED custom order cannot start production once its Mold is set MAINTENANCE; start-production fails with ERR_MOLD_INACTIVE."
        test_recipe:
          setup:
            - "CORPORATE customer, product, ACTIVE mold; custom order quoted and accepted; then mold set MAINTENANCE."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Corp M", email: "corpm@x.com", account_type: "CORPORATE" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "M-2", name: "M SKU", product_type: "SINGLE", base_price_cents: 1500, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /molds", payload: { name: "Bell", cavity_count: 6, daily_capacity_units: 300 }, as: ProductionManager, captures: { mold_id: "$.data.id" } }
            - { call: "POST /custom-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", mold_id: "${mold_id}", units_estimated: 40 }, as: Customer, as_user_id: "${cust_id}", captures: { co_id: "$.data.id" } }
            - { call: "POST /custom-orders/${co_id}/quote", payload: {}, as: SalesManager }
            - { call: "POST /custom-orders/${co_id}/accept", payload: { usage_date: "2026-07-12T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /molds/${mold_id}/set-status", payload: { status: "MAINTENANCE" }, as: ProductionManager }
          trigger:
            - { call: "POST /custom-orders/${co_id}/start-production", payload: {}, as: ProductionManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_MOLD_INACTIVE"
            - "CustomOrder.${co_id}.status == ACCEPTED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: mold_daily_capacity_aggregate
        grounds:
          - validations[priority=10]
          - state_machines.CustomOrder.QUOTED_to_ACCEPTED
        distinguishing_aspect: "Aggregate day-bucket capacity on Mold: two accepts for the same mold and usage_date (60+60) exceed daily_capacity_units=100; the second accept is rejected ERR_MOLD_CAPACITY_EXCEEDED. Interval semantics = summed units per discrete day."
        test_recipe:
          setup:
            - "CORPORATE customer; product; mold daily_capacity_units=100; two custom orders (60 units each) both quoted, same usage_date."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Corp Cap", email: "cap@x.com", account_type: "CORPORATE" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "CAP-1", name: "Cap SKU", product_type: "SINGLE", base_price_cents: 1500, shelf_life_days: 30, unit_weight_g: 40 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /molds", payload: { name: "Egg", cavity_count: 10, daily_capacity_units: 100 }, as: ProductionManager, captures: { mold_id: "$.data.id" } }
            - { call: "POST /custom-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", mold_id: "${mold_id}", units_estimated: 60 }, as: Customer, as_user_id: "${cust_id}", captures: { co1_id: "$.data.id" } }
            - { call: "POST /custom-orders/${co1_id}/quote", payload: {}, as: SalesManager }
            - { call: "POST /custom-orders/${co1_id}/accept", payload: { usage_date: "2026-07-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /custom-orders", payload: { customer_id: "${cust_id}", product_id: "${prod_id}", mold_id: "${mold_id}", units_estimated: 60 }, as: Customer, as_user_id: "${cust_id}", captures: { co2_id: "$.data.id" } }
            - { call: "POST /custom-orders/${co2_id}/quote", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /custom-orders/${co2_id}/accept", payload: { usage_date: "2026-07-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_MOLD_CAPACITY_EXCEEDED"
            - "CustomOrder.${co2_id}.status == QUOTED"

      - name: tempering_line_half_open_interval_overlap
        grounds:
          - validations[priority=9]
          - state_machines.Batch.RAW_to_TEMPERING
        distinguishing_aspect: "Half-open interval geometry on TemperingLine (different resource + semantics from mold day-buckets): batch2 [10:30,11:30) overlaps batch1 [10:00,11:00) on the same line and is rejected ERR_TEMPERING_LINE_CONFLICT, whereas an end==start adjacency would be allowed."
        test_recipe:
          setup:
            - "Tempering product (tempering_minutes 60); one tempering line; two RAW batches; batch1 occupies [10:00,11:00)."
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "TL-1", name: "TL SKU", product_type: "SINGLE", base_price_cents: 800, shelf_life_days: 30, unit_weight_g: 50, requires_tempering: true, tempering_minutes: 60 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /tempering-lines", payload: { name: "Shared" }, as: ProductionManager, captures: { line_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 50 }, as: ProductionManager, captures: { b1_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 50 }, as: ProductionManager, captures: { b2_id: "$.data.id" } }
            - { call: "POST /batches/${b1_id}/start-tempering", payload: { tempering_line_id: "${line_id}", temper_start: "2026-07-01T10:00:00Z" }, as: ProductionManager }
          trigger:
            - { call: "POST /batches/${b2_id}/start-tempering", payload: { tempering_line_id: "${line_id}", temper_start: "2026-07-01T10:30:00Z" }, as: ProductionManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_TEMPERING_LINE_CONFLICT"
            - "Batch.${b2_id}.status == RAW"

  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_reserve_then_release
        grounds:
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - calculations.batch_available_units
        distinguishing_aspect: "Conserved quantity = batch physical units: after allocate (reserve 30) then order cancel (release 30), Batch.available_units returns to initial_units=100 with zero drift."
        test_recipe:
          setup:
            - "Non-tempering product; batch of 100 RELEASED; retail order qty 30 confirmed and allocated."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Inv A", email: "inva@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /products", payload: { sku: "I-1", name: "I SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 60, unit_weight_g: 30 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /batches", payload: { product_id: "${prod_id}", initial_units: 100 }, as: ProductionManager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /batches/${batch_id}/release", payload: {}, as: ProductionManager }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 30 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/allocate", payload: {}, as: SalesManager }
          trigger:
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "Batch.${batch_id}.available_units == 100"
            - "Batch.${batch_id}.available_units == Batch.${batch_id}.initial_units"

      - name: wallet_credit_conserved_confirm_then_cancel
        grounds:
          - state_machines.Order.CONFIRMED_to_CANCELLED
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "Conserved quantity = wallet cents (different from batch units): confirming with wallet_apply 500 debits to 9500, cancel refunds exactly 500, so wallet_credit_cents returns to 10000 with zero drift."
        test_recipe:
          setup:
            - "RETAIL customer granted wallet 10000; product base 1000; retail order qty 1 confirmed with wallet_apply 500 (wallet -> 9500)."
          setup_api_calls:
            - { call: "POST /customers", payload: { name: "Wal A", email: "wala@x.com", account_type: "RETAIL" }, as: Admin, captures: { cust_id: "$.data.id" } }
            - { call: "POST /customers/${cust_id}/wallet/adjust", payload: { amount_cents: 10000 }, as: Admin }
            - { call: "POST /products", payload: { sku: "W-1", name: "W SKU", product_type: "SINGLE", base_price_cents: 1000, shelf_life_days: 60, unit_weight_g: 30 }, as: Admin, captures: { prod_id: "$.data.id" } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_type: "RETAIL" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/lines", payload: { product_id: "${prod_id}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${ord_id}/confirm", payload: { wallet_apply_cents: 500 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${ord_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "Order.${ord_id}.status == CANCELLED"
            - "Customer.${cust_id}.wallet_credit_cents == 10000"
