# =============================================================================
# PRD Benchmark Scaffold — Guitar Factory Operations
# Generated per skills/prd-bench-scaffold-generator/SKILL.md §1.0–§1.7
# Difficulty band: beyond Expert (§0.4) — 15 entities, 84 endpoints, 60 errors,
# 9 calculations (4 dual/combinatorial), 9 state machines (4 non-linear).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2612. Guitar Factory Operations (stringed instrument manufacturer): tonewood procurement with
  species sourcing, protected species documentation and moisture-controlled storage, body and neck
  machining with computer-controlled routing and hand shaping stations, bracing, binding and
  assembly with humidity-controlled build rooms, finish application across nitrocellulose and
  polyurethane with cure times and buffing, fretwork, setup and playability inspection with
  intonation and action specifications, custom shop orders with option configuration, artist
  relations and long lead times, serial number assignment, warranty registration and repair
  network authorization, protected wood documentation for international shipment

domain_name: guitar-factory-operations
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # Tonewood flows through a directed graph: TonewoodLot -> Billet (self-referential resaw)
  # -> Component -> BuildOrder, while StationReservation, FinishRun and ExportShipment cut
  # across that chain from StorageRoom / Station / OptionCatalog aggregates. There is no
  # single ownership tree: BuildOrder and TonewoodLot are both roots of the same wood graph
  # and every compliance question is answered by traversing it backwards.

  state_machine_shape: cyclic
  # Four non-linear machines: Component (QC_HELD -> REWORK -> CNC_ROUTED cycle),
  # ExportShipment (DOCS_ATTACHED -> DOCS_REJECTED -> DOCS_ATTACHED cycle),
  # BuildOrder.build_stage (INSPECTION -> SETUP rework loop, IN_FINISH -> IN_ASSEMBLY
  # refinish loop) advancing independently of BuildOrder.commercial_status on the same row,
  # StorageRoom (IN_SPEC <-> OUT_OF_SPEC -> QUARANTINED -> IN_SPEC), RepairShop
  # (AUTHORIZED <-> SUSPENDED).

  relationship_patterns:
    - one_to_many          # TonewoodLot -> Billet, BuildOrder -> Component / FinishRun
    - many_to_many         # BuildOrder <-> OptionCatalog via OptionSelection
    - self_referential     # Billet.parent_billet_id (resaw of a thicker billet)
    - cross_aggregate      # ExportShipment -> BuildOrder -> Component -> Billet -> TonewoodLot
    - polymorphic: false

  role_model: segregation_of_duties
  # The QualityInspector who signs a SetupInspection MUST NOT be the Luthier user who
  # performed that same inspection's setup, and the ComplianceOfficer who releases an
  # ExportShipment MUST NOT be the officer who attested any contributing lot's CITES permit.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: StorageRoom
    parent: null
    common_fields: true
    fields:
      - name: room_code
        type: string
        source: input
        description: human-readable room identifier
        constraints: "unique across all StorageRoom rows; 1..32 chars"
      - name: room_type
        type: enum
        source: input
        description: what the room is used for
        constraints: "one of DRY_STORE, KILN, BUILD_ROOM, FINISH_BOOTH"
      - name: target_rh_pct
        type: number
        source: input
        description: target relative humidity for the room
        constraints: "20.0 <= target_rh_pct <= 80.0"
      - name: rh_tolerance_pct
        type: number
        source: input
        default: 3.0
        description: allowed absolute deviation from target_rh_pct before the room leaves IN_SPEC
        constraints: "0.5 <= rh_tolerance_pct <= 15.0"
      - name: target_temp_c
        type: number
        source: input
        description: target dry-bulb temperature; recorded for cure math but never gates posture
        constraints: "10.0 <= target_temp_c <= 35.0"
      - name: capacity_slots
        type: integer
        source: input
        description: how many FinishRun occupancies of the SAME finish system the room holds at once
        constraints: ">= 1; only meaningful when room_type == FINISH_BOOTH"
      - name: latest_rh_pct
        type: number
        source: computed
        description: relative humidity from the most recent climate reading; equals target_rh_pct until the first reading
      - name: latest_temp_c
        type: number
        source: computed
        description: dry-bulb temperature from the most recent climate reading; equals target_temp_c until the first reading
      - name: climate_status
        type: enum
        source: system
        default: IN_SPEC
        description: climate posture that gates every operation physically located in this room
        constraints: "one of IN_SPEC, OUT_OF_SPEC, QUARANTINED"
      - name: out_of_spec_since
        type: datetime
        source: computed
        description: logical-clock instant at which climate_status last became OUT_OF_SPEC; null while IN_SPEC or after certification
      - name: occupied_slots
        type: integer
        source: computed
        description: "count of FinishRun rows with booth_id == this room, status IN {SPRAYING, CURING, CURE_SUSPENDED, BUFFING}, AND whose closed [booth_hold_from, booth_hold_until] interval contains current_utc — occupancy is judged against the projected hold window, so a non-terminal run whose hold has already elapsed no longer occupies a slot"

  # ---------------------------------------------------------------------------
  - name: TonewoodLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: procurement lot identifier
        constraints: "unique across all TonewoodLot rows"
      - name: species_code
        type: enum
        source: input
        description: botanical species of the lot
        constraints: "one of SITKA_SPRUCE, HONDURAN_MAHOGANY, HARD_MAPLE, EAST_INDIAN_ROSEWOOD, BRAZILIAN_ROSEWOOD, EBONY"
      - name: cites_appendix
        type: enum
        source: input
        description: CITES listing of the species as declared at receipt
        constraints: "one of NONE, APPENDIX_II, APPENDIX_I"
      - name: permit_number
        type: string
        source: input
        description: CITES import permit number; optional at creation, required by attest-permit
        constraints: "null allowed; 1..40 chars when present"
      - name: permit_status
        type: enum
        source: system
        description: "NOT_REQUIRED when cites_appendix == NONE at creation; PENDING when APPENDIX_I/II at creation; VERIFIED after attest-permit; INVALID after reject"
        constraints: "one of NOT_REQUIRED, PENDING, VERIFIED, INVALID"
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who attested the permit; null until attest-permit; drives the export-release segregation-of-duties check
      - name: board_feet_received
        type: number
        source: input
        description: board feet booked into inventory at receipt
        constraints: "> 0; 2 decimal places"
      - name: board_feet_cut
        type: number
        source: computed
        description: "sum of Billet.board_feet over ALL Billet rows with lot_id == this lot (any status)"
      - name: board_feet_kerf_loss
        type: number
        source: computed
        description: "sum of Billet.kerf_loss_board_feet over ALL Billet rows with lot_id == this lot (any status)"
      - name: board_feet_available
        type: number
        source: computed
        description: "uncut stock still in the lot: round_half_up(board_feet_received - board_feet_cut - board_feet_kerf_loss, 2)"
      - name: board_feet_unassigned
        type: number
        source: computed
        description: "sum of Billet.board_feet where lot_id == this lot AND Billet.status == AVAILABLE"
      - name: board_feet_reserved
        type: number
        source: computed
        description: "sum of Billet.board_feet where lot_id == this lot AND Billet.status == RESERVED"
      - name: board_feet_consumed
        type: number
        source: computed
        description: "sum of Billet.board_feet where lot_id == this lot AND Billet.status == CONSUMED"
      - name: board_feet_scrapped
        type: number
        source: computed
        description: "sum of Billet.board_feet where lot_id == this lot AND Billet.status IN {SCRAPPED, QUARANTINED}"
      - name: moisture_at_receipt_pct
        type: number
        source: system
        description: copy of the moisture_content_pct supplied at creation; never mutated afterwards; input to the NOMINAL yield variant
      - name: moisture_content_pct
        type: number
        source: input
        description: most recent moisture reading; mutated by POST /tonewood-lots/{lot_id}/moisture-readings
        constraints: "2.0 <= moisture_content_pct <= 30.0"
      - name: storage_room_id
        type: string
        source: input
        description: "FK -> StorageRoom.id; room the lot is physically stored in; must have room_type IN {DRY_STORE, KILN}"
      - name: nominal_yield_board_feet
        type: number
        source: computed
        description: forward-looking usable yield per calculations.tonewood_lot_yield variant NOMINAL_YIELD
      - name: actual_yield_board_feet
        type: number
        source: computed
        description: chronological realized yield per calculations.tonewood_lot_yield variant ACTUAL_YIELD
      - name: status
        type: enum
        source: system
        description: lot lifecycle state
        constraints: "one of RECEIVED, PERMIT_HOLD, KILN_DRYING, CONDITIONED, RELEASED, DEPLETED, REJECTED"

  # ---------------------------------------------------------------------------
  - name: Billet
    parent: TonewoodLot
    common_fields: true
    fields:
      - name: billet_code
        type: string
        source: input
        description: shop-floor billet identifier
        constraints: "unique across all Billet rows"
      - name: lot_id
        type: string
        source: input
        description: "FK -> TonewoodLot.id; lot the billet was cut from; lot.status MUST be RELEASED at cut time"
      - name: parent_billet_id
        type: string
        source: input
        description: "FK -> Billet.id; set when this billet is a resaw of a thicker billet, null for a primary cut off the lot"
      - name: board_feet
        type: number
        source: input
        description: net board feet of the billet
        constraints: "> 0; 2 decimal places"
      - name: kerf_loss_board_feet
        type: number
        source: computed
        description: "saw loss booked against the lot: round_half_up(board_feet * ACTUAL_KERF_BP / 10000, 2)"
      - name: moisture_content_pct
        type: number
        source: computed
        description: snapshot of the parent lot's moisture_content_pct at the instant of the cut; never re-synced afterwards
      - name: grade
        type: enum
        source: input
        description: appearance/stiffness grade
        constraints: "one of AAA, AA, A, UTILITY; grade order for comparisons is UTILITY < A < AA < AAA"
      - name: status
        type: enum
        source: system
        default: AVAILABLE
        description: billet lifecycle state
        constraints: "one of AVAILABLE, RESERVED, CONSUMED, QUARANTINED, SCRAPPED"

  # ---------------------------------------------------------------------------
  - name: ComponentSpec
    parent: null
    common_fields: false
    fields:
      - name: spec_code
        type: string
        source: input
        description: engineering spec identifier
        constraints: "unique across all ComponentSpec rows"
      - name: component_type
        type: enum
        source: input
        description: which part of the instrument this spec describes
        constraints: "one of BODY_TOP, BODY_BACK, NECK, FINGERBOARD, BRACE, BINDING"
      - name: required_species_codes
        type: array
        source: input
        description: species the spec permits; a Billet whose lot species is absent is rejected
        constraints: "non-empty array of TonewoodLot.species_code enum members"
      - name: min_grade
        type: enum
        source: input
        description: lowest acceptable Billet.grade
        constraints: "one of AAA, AA, A, UTILITY"
      - name: nominal_board_feet
        type: number
        source: input
        description: board feet the spec nominally consumes; input to the NOMINAL yield variant
        constraints: "> 0"
      - name: target_thickness_mm
        type: number
        source: input
        description: finished thickness the hand-shaping station must hit
        constraints: "> 0; 2 decimal places"
      - name: thickness_tolerance_mm
        type: number
        source: input
        default: 0.15
        description: allowed absolute deviation from target_thickness_mm at QC
        constraints: "> 0"
      - name: cnc_minutes
        type: integer
        source: input
        description: nominal CNC_ROUTER minutes for this spec
        constraints: ">= 1"
      - name: hand_shape_minutes
        type: integer
        source: input
        description: nominal HAND_SHAPING minutes for this spec
        constraints: ">= 1"
      - name: required_room_type
        type: enum
        source: input
        default: BUILD_ROOM
        description: room_type the machining stations for this spec must sit in
        constraints: "one of BUILD_ROOM, DRY_STORE"

  # ---------------------------------------------------------------------------
  - name: Component
    parent: null
    common_fields: true
    fields:
      - name: spec_id
        type: string
        source: input
        description: "FK -> ComponentSpec.id; engineering spec this part is built to"
      - name: billet_id
        type: string
        source: input
        description: "FK -> Billet.id; wood the part is machined from; billet.status MUST be AVAILABLE at creation"
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; instrument the part is destined for; null for shelf stock"
      - name: measured_thickness_mm
        type: number
        source: input
        description: last thickness measured at a machining station; null until the first route call
      - name: qc_hold_reason
        type: enum
        source: system
        default: NONE
        description: why the part is on QC hold
        constraints: "one of NONE, DIMENSION, GRAIN_RUNOUT, PROTECTED_SPECIES, CLIMATE_EXCURSION"
      - name: rework_count
        type: integer
        source: computed
        default: 0
        description: how many times this part has been dispositioned to REWORK; capped by MAX_COMPONENT_REWORKS (2), which is a DIFFERENT constant from the order-level MAX_REWORK_ROUNDS (3) that caps SetupInspection rounds
      - name: status
        type: enum
        source: system
        default: ROUGH_SAWN
        description: part lifecycle state
        constraints: "one of ROUGH_SAWN, CNC_ROUTED, HAND_SHAPED, QC_HELD, REWORK, ACCEPTED, INSTALLED, SCRAPPED"

  # ---------------------------------------------------------------------------
  - name: Station
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: shop-floor station identifier
        constraints: "unique across all Station rows"
      - name: station_type
        type: enum
        source: input
        description: what work the station performs
        constraints: "one of CNC_ROUTER, HAND_SHAPING, BRACING, BINDING, ASSEMBLY, FRETWORK, SETUP_BENCH"
      - name: room_id
        type: string
        source: input
        description: "FK -> StorageRoom.id; room the station physically sits in; its climate_status gates every operation consuming this station"
      - name: changeover_minutes
        type: integer
        source: input
        default: 30
        description: symmetric buffer that must separate two reservations on this station
        constraints: ">= 0"
      - name: total_scheduled_minutes
        type: integer
        source: computed
        default: 0
        description: cumulative minutes ever booked on this station; monotonically non-decreasing
      - name: held_minutes
        type: integer
        source: computed
        default: 0
        description: "sum of StationReservation.duration_minutes where station_id == this station AND status == HELD"
      - name: consumed_minutes
        type: integer
        source: computed
        default: 0
        description: "sum of StationReservation.duration_minutes where station_id == this station AND status == CONSUMED"
      - name: released_minutes
        type: integer
        source: computed
        default: 0
        description: "sum of StationReservation.duration_minutes where station_id == this station AND status == RELEASED"

  # ---------------------------------------------------------------------------
  - name: StationReservation
    parent: Station
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> Station.id; station whose capacity-1 timeline this reservation occupies"
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; instrument the booked work belongs to"
      - name: component_id
        type: string
        source: input
        description: "FK -> Component.id; part the booked work is for; null for whole-instrument bench work"
      - name: starts_at
        type: datetime
        source: input
        description: half-open interval start, inclusive
        constraints: "RFC3339 timestamp with a trailing Z, e.g. 2026-08-01T00:00:00Z; fractional seconds optional and ignored"
      - name: ends_at
        type: datetime
        source: input
        description: half-open interval end, exclusive
        constraints: "ends_at > starts_at"
      - name: duration_minutes
        type: integer
        source: computed
        description: "floor((ends_at - starts_at) / 60 seconds)"
      - name: priority_score
        type: number
        source: computed
        description: snapshot of the owning BuildOrder.priority_score at booking time; not re-synced
      - name: status
        type: enum
        source: system
        default: HELD
        description: reservation lifecycle state
        constraints: "one of HELD, CONSUMED, RELEASED"

  # ---------------------------------------------------------------------------
  - name: OptionCatalog
    parent: null
    common_fields: false
    fields:
      - name: option_code
        type: string
        source: input
        description: custom-shop option code
        constraints: "unique across all OptionCatalog rows"
      - name: option_group
        type: enum
        source: input
        description: configuration group the option belongs to
        constraints: "one of TOP_WOOD, INLAY, HARDWARE, ELECTRONICS, NECK_PROFILE"
      - name: upcharge_cents
        type: integer
        source: input
        description: list upcharge in cents before complexity multiplier
        constraints: ">= 0"
      - name: complexity_class
        type: enum
        source: input
        description: labour complexity band driving the price multiplier
        constraints: "one of STANDARD, ARTISAN, MASTER"
      - name: lead_time_days
        type: integer
        source: input
        description: additional calendar days this option adds to the build lead time
        constraints: ">= 0"
      - name: incompatible_option_codes
        type: array
        source: input
        default: []
        description: option_code values that may not coexist on the same BuildOrder
      - name: requires_finish_system
        type: enum
        source: input
        default: ANY
        description: finish system the option demands
        constraints: "one of ANY, NITRO, POLY"

  # ---------------------------------------------------------------------------
  - name: BuildOrder
    parent: null
    common_fields: true
    fields:
      - name: order_code
        type: string
        source: input
        description: sales order identifier
        constraints: "unique across all BuildOrder rows"
      - name: model_code
        type: string
        source: input
        description: instrument model; first segment of the minted serial number
        constraints: "1..16 chars, uppercase alphanumerics and dashes"
      - name: base_price_cents
        type: integer
        source: input
        description: model list price before options
        constraints: "> 0"
      - name: is_custom_shop
        type: boolean
        source: input
        default: false
        description: whether the order runs through the custom shop (adds surcharge and demands at least one approved option to confirm)
      - name: artist_tier
        type: enum
        source: input
        default: NONE
        description: artist-relations tier driving discount and scheduling priority
        constraints: "one of NONE, ENDORSER, SIGNATURE"
      - name: finish_system
        type: enum
        source: input
        default: NITRO
        description: finish chemistry the instrument will be sprayed with
        constraints: "one of NITRO, POLY"
      - name: promised_date
        type: datetime
        source: input
        description: customer-promised completion instant; recomputed upward at lock-options and pushed out by rework escalation
        constraints: "RFC3339 timestamp with a trailing Z, e.g. 2026-08-01T00:00:00Z; fractional seconds optional and ignored"
      - name: provisional_quote_total_cents
        type: integer
        source: computed
        description: PROVISIONAL variant of calculations.custom_shop_quote_total; refreshed on every option-selection mutation
      - name: binding_quote_total_cents
        type: integer
        source: computed
        description: BINDING variant of calculations.custom_shop_quote_total; null until lock-options, immutable afterwards
      - name: deposit_paid_cents
        type: integer
        source: computed
        default: 0
        description: total cash ever received on this order
      - name: deposit_held_cents
        type: integer
        source: computed
        default: 0
        description: cash still held undisposed
      - name: deposit_applied_cents
        type: integer
        source: computed
        default: 0
        description: cash applied against the invoice at serialization
      - name: deposit_refunded_cents
        type: integer
        source: computed
        default: 0
        description: cash returned to the customer on cancellation
      - name: deposit_forfeited_cents
        type: integer
        source: computed
        default: 0
        description: cash retained as a cancellation charge
      - name: serial_number
        type: string
        source: system
        description: "minted at assign-serial as {model_code}-{YYYY}-{NNNNN}; null before that; never re-minted"
      - name: rework_round_count
        type: integer
        source: computed
        default: 0
        description: how many SetupInspection rounds have failed on this order
      - name: refinish_count
        type: integer
        source: computed
        default: 0
        description: how many FinishRun rows on this order have been rejected
      - name: cites_permit_required
        type: boolean
        source: computed
        default: false
        description: whether any contributing lot is CITES-listed per calculations.protected_species_requirement
      - name: strictest_cites_appendix
        type: enum
        source: computed
        default: NONE
        description: strictest CITES listing among contributing lots
        constraints: "one of NONE, APPENDIX_II, APPENDIX_I"
      - name: priority_score
        type: number
        source: computed
        description: scheduling weight per calculations.build_priority_score
      - name: stage_before_compliance_hold
        type: enum
        source: system
        description: build_stage captured when a protected-species cascade forced COMPLIANCE_HOLD; restored by clear-compliance-hold; null otherwise
        constraints: "one of COMPONENTS_RELEASED, IN_ASSEMBLY, IN_FINISH, FINISH_HELD, FINISH_CURED, FRETWORK, SETUP, INSPECTION"
      - name: build_stage
        type: enum
        source: system
        default: DRAFT
        description: shop-floor dimension of the order state; evolves independently of commercial_status on the same row
        constraints: "one of DRAFT, COMPONENTS_RELEASED, IN_ASSEMBLY, IN_FINISH, FINISH_HELD, FINISH_CURED, FRETWORK, SETUP, INSPECTION, COMPLIANCE_HOLD, SERIALIZED, SCRAPPED"
      - name: commercial_status
        type: enum
        source: system
        default: QUOTED
        description: sales dimension of the order state; evolves independently of build_stage on the same row
        constraints: "one of QUOTED, CONFIRMED, OPTIONS_LOCKED, AT_RISK, INVOICED, CLOSED, CANCELLED"

  # ---------------------------------------------------------------------------
  - name: OptionSelection
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; order the option is configured on"
      - name: option_id
        type: string
        source: input
        description: "FK -> OptionCatalog.id; catalog row being selected"
      - name: quantity
        type: integer
        source: input
        default: 1
        description: how many of the option
        constraints: ">= 1 and <= 4"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the coordinator who created the row; the segregation-of-duties counterpart that approve is checked against"
      - name: locked_upcharge_cents
        type: integer
        source: system
        description: OptionCatalog.upcharge_cents pinned at lock-options; null until then; the BINDING variant reads only this field
      - name: line_total_cents
        type: integer
        source: computed
        description: "per-line rounded charge: round_half_up(unit_cents * quantity * COMPLEXITY_MULTIPLIER_BP / 10000)"
      - name: status
        type: enum
        source: system
        default: PENDING_APPROVAL
        description: option selection lifecycle state
        constraints: "one of PENDING_APPROVAL, SELECTED, REJECTED, LOCKED"

  # ---------------------------------------------------------------------------
  - name: FinishRun
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; instrument being sprayed"
      - name: booth_id
        type: string
        source: input
        description: "FK -> StorageRoom.id; booth the run occupies; MUST have room_type == FINISH_BOOTH"
      - name: finish_system
        type: enum
        source: input
        description: finish chemistry for this run
        constraints: "one of NITRO, POLY; MUST equal BuildOrder.finish_system"
      - name: coat_count
        type: integer
        source: input
        description: number of coats sprayed
        constraints: ">= 1 and <= 24"
      - name: spray_started_at
        type: datetime
        source: system
        description: logical-clock instant at creation; also the booth occupancy window start
      - name: spray_completed_at
        type: datetime
        source: system
        description: logical-clock instant of complete-spray; null while SPRAYING
      - name: cure_hours
        type: number
        source: computed
        description: cure duration per calculations.finish_cure_ready_at; null while SPRAYING
      - name: cure_suspended_minutes
        type: integer
        source: computed
        default: 0
        description: cumulative minutes the run spent in CURE_SUSPENDED; added to cure_ready_at on resume
      - name: cure_suspend_started_at
        type: datetime
        source: system
        description: logical-clock instant the run entered CURE_SUSPENDED; null otherwise
      - name: cure_ready_at
        type: datetime
        source: computed
        description: "spray_completed_at + cure_hours hours + cure_suspended_minutes minutes; null while SPRAYING"
      - name: booth_hold_from
        type: datetime
        source: computed
        description: booth occupancy window start, inclusive; equals spray_started_at
      - name: booth_hold_until
        type: datetime
        source: computed
        description: "booth occupancy window end, INCLUSIVE: spray_started_at + (BASE_CURE_HOURS[finish_system] + extra_coat_hours + SPRAY_HOURS) hours"
      - name: status
        type: enum
        source: system
        default: SPRAYING
        description: finish run lifecycle state
        constraints: "one of SPRAYING, CURING, CURE_SUSPENDED, BUFFING, COMPLETED, REJECTED"

  # ---------------------------------------------------------------------------
  - name: SetupInspection
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; instrument being set up and inspected"
      - name: round_number
        type: integer
        source: computed
        description: "count of pre-existing SetupInspection rows for this build order + 1; the row with the maximum round_number is the authoritative one"
      - name: performed_by_user_id
        type: string
        source: system
        description: X-User-ID of the Luthier who opened this round; the only user allowed to submit its measurements
      - name: inspector_user_id
        type: string
        source: system
        description: X-User-ID of the QualityInspector who signed; null until sign; MUST differ from performed_by_user_id
      - name: action_mm_treble
        type: number
        source: input
        description: string action at the treble E, measured at the 12th fret
        constraints: "0.50 <= action_mm_treble <= 5.00; 2 decimal places"
      - name: action_mm_bass
        type: number
        source: input
        description: string action at the bass E, measured at the 12th fret
        constraints: "0.50 <= action_mm_bass <= 6.00; 2 decimal places"
      - name: relief_mm
        type: number
        source: input
        description: neck relief measured at the 7th fret
        constraints: "0.00 <= relief_mm <= 1.00; 2 decimal places"
      - name: intonation_cents_max
        type: number
        source: input
        description: worst-case intonation error across all strings at the 12th fret
        constraints: "0.0 <= intonation_cents_max <= 50.0; 1 decimal place"
      - name: deviation_score
        type: number
        source: computed
        description: weighted playability deviation per calculations.playability_deviation_score; null until measure
      - name: verdict
        type: enum
        source: system
        default: PENDING
        description: inspection outcome
        constraints: "one of PENDING, PASS, FAIL"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: inspection lifecycle state
        constraints: "one of OPEN, MEASURED, SIGNED, FAILED"

  # ---------------------------------------------------------------------------
  - name: RepairShop
    parent: null
    common_fields: true
    fields:
      - name: shop_code
        type: string
        source: input
        description: service network shop identifier
        constraints: "unique across all RepairShop rows"
      - name: shop_name
        type: string
        source: input
        description: trading name of the shop
        constraints: "1..80 chars"
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the shop
        constraints: "exactly 2 uppercase letters"
      - name: authorization_level
        type: enum
        source: system
        default: NONE
        description: what work the shop may perform under warranty
        constraints: "one of NONE, WARRANTY_ONLY, FULL_SERVICE, CUSTOM_SHOP_CERTIFIED"
      - name: warranty_claim_count
        type: integer
        source: computed
        default: 0
        description: "count of WarrantyRegistration rows with registering_shop_id == this shop AND status == ACTIVE"
      - name: status
        type: enum
        source: system
        default: APPLIED
        description: authorization lifecycle state
        constraints: "one of APPLIED, AUTHORIZED, SUSPENDED"

  # ---------------------------------------------------------------------------
  - name: WarrantyRegistration
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; instrument being registered"
      - name: registering_shop_id
        type: string
        source: input
        description: "FK -> RepairShop.id; shop submitting the registration; MUST equal X-User-ID when the caller role is AuthorizedShop"
      - name: serial_number
        type: string
        source: input
        description: serial as read off the instrument; MUST equal BuildOrder.serial_number
        constraints: "1..32 chars"
      - name: owner_email
        type: string
        source: input
        description: end-owner contact
        constraints: "contains exactly one '@'"
      - name: purchase_date
        type: datetime
        source: input
        description: retail purchase instant; start of the coverage window
        constraints: "RFC3339 timestamp with a trailing Z, e.g. 2026-08-01T00:00:00Z; fractional seconds optional and ignored"
      - name: coverage_months
        type: integer
        source: computed
        description: "60 when BuildOrder.is_custom_shop is true, else 24"
      - name: coverage_ends_at
        type: datetime
        source: computed
        description: "purchase_date advanced by coverage_months calendar months"
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: registration lifecycle state
        constraints: "one of ACTIVE, VOID"

  # ---------------------------------------------------------------------------
  - name: ExportShipment
    parent: BuildOrder
    common_fields: true
    fields:
      - name: build_order_id
        type: string
        source: input
        description: "FK -> BuildOrder.id; instrument being exported"
      - name: destination_country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 destination
        constraints: "exactly 2 uppercase letters"
      - name: cites_permit_required
        type: boolean
        source: computed
        description: snapshot of BuildOrder.cites_permit_required at shipment creation
      - name: required_cites_appendix
        type: enum
        source: computed
        default: NONE
        description: snapshot of BuildOrder.strictest_cites_appendix at shipment creation
        constraints: "one of NONE, APPENDIX_II, APPENDIX_I"
      - name: cites_permit_number
        type: string
        source: input
        description: re-export permit number presented at attach-docs; required only when cites_permit_required is true
        constraints: "null allowed; 1..40 chars when present"
      - name: goods_value_cents
        type: integer
        source: computed
        description: "step 1 of calculations.export_declared_value: BuildOrder.binding_quote_total_cents"
      - name: doc_fee_cents
        type: integer
        source: computed
        description: step 3 of calculations.export_declared_value
      - name: insurance_cents
        type: integer
        source: computed
        description: step 4 of calculations.export_declared_value
      - name: declared_value_cents
        type: integer
        source: computed
        description: step 5 of calculations.export_declared_value
      - name: released_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer who released the shipment; null until release
      - name: status
        type: enum
        source: system
        default: DOCS_PENDING
        description: shipment lifecycle state
        constraints: "one of DOCS_PENDING, DOCS_ATTACHED, DOCS_REJECTED, RELEASED, EXPORTED"

# =============================================================================
# §1.2 State Machine Table
# Nine machines. BuildOrder carries TWO independent state dimensions on the same
# row (build_stage x commercial_status). Component, ExportShipment, StorageRoom,
# RepairShop and BuildOrder.build_stage are cyclic; TonewoodLot branches at
# creation on cites_appendix.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: StorageRoom
    state_field: climate_status
    initial_state: IN_SPEC
    terminal_states: []
    transitions:
      - from: IN_SPEC
        to: OUT_OF_SPEC
        trigger: "POST /storage-rooms/{room_id}/climate-readings with abs(rh_pct - target_rh_pct) > rh_tolerance_pct"
        actor: FinishTech
        preconditions:
          - "climate_status == IN_SPEC"
        side_effects:
          - "latest_rh_pct = rh_pct; latest_temp_c = temp_c"
          - "out_of_spec_since = current_utc"
          - "CASCADE LINK 1->2: because climate_status became OUT_OF_SPEC, every FinishRun with booth_id == this room AND status == CURING transitions CURING -> CURE_SUSPENDED and sets cure_suspend_started_at = current_utc"
          - "CASCADE LINK 2->3: because those FinishRun rows became CURE_SUSPENDED, each of their BuildOrder rows with build_stage == IN_FINISH transitions IN_FINISH -> FINISH_HELD"
          - "CASCADE LINK 3->4: because those BuildOrder rows became FINISH_HELD, every StationReservation with build_order_id == that order AND status == HELD AND starts_at > current_utc transitions HELD -> RELEASED, and its Station has held_minutes -= duration_minutes and released_minutes += duration_minutes"
        note: "Root of the depth-4 transitive cascade (rule_id transitive_cascade). Temperature is recorded but never gates posture."
      - from: OUT_OF_SPEC
        to: IN_SPEC
        trigger: "POST /storage-rooms/{room_id}/climate-readings with abs(rh_pct - target_rh_pct) <= rh_tolerance_pct"
        actor: FinishTech
        preconditions:
          - "climate_status == OUT_OF_SPEC"
        side_effects:
          - "latest_rh_pct = rh_pct; latest_temp_c = temp_c"
          - "out_of_spec_since = null"
        note: "Boundary is inclusive: a reading exactly rh_tolerance_pct away from target returns the room to IN_SPEC. Suspended FinishRun rows do NOT auto-resume; POST /finish-runs/{finish_run_id}/resume-cure is required."
      - from: OUT_OF_SPEC
        to: QUARANTINED
        trigger: "POST /storage-rooms/{room_id}/climate-readings with abs(rh_pct - target_rh_pct) > rh_tolerance_pct while (current_utc - out_of_spec_since) >= QUARANTINE_AFTER_HOURS hours"
        actor: FinishTech
        preconditions:
          - "climate_status == OUT_OF_SPEC"
          - "current_utc - out_of_spec_since >= QUARANTINE_AFTER_HOURS (24) hours"
        side_effects:
          - "latest_rh_pct = rh_pct; latest_temp_c = temp_c"
          - "every TonewoodLot with storage_room_id == this room AND status == CONDITIONED transitions CONDITIONED -> RECEIVED (conditioning is void; the lot must be re-measured and re-conditioned)"
      - from: QUARANTINED
        to: IN_SPEC
        trigger: "POST /storage-rooms/{room_id}/certify"
        actor: PlantAdmin
        preconditions:
          - "climate_status == QUARANTINED"
          - "abs(latest_rh_pct - target_rh_pct) <= rh_tolerance_pct"
        side_effects:
          - "out_of_spec_since = null"
        note: "Closes the cycle IN_SPEC -> OUT_OF_SPEC -> QUARANTINED -> IN_SPEC. Readings taken while QUARANTINED update latest_rh_pct/latest_temp_c but never change climate_status."

  # ---------------------------------------------------------------------------
  - entity: TonewoodLot
    state_field: status
    initial_state: RECEIVED
    terminal_states: [DEPLETED, REJECTED]
    transitions:
      - from: "(creation)"
        to: RECEIVED
        trigger: "POST /tonewood-lots with cites_appendix == NONE"
        actor: WoodBuyer
        preconditions:
          - "storage_room_id resolves to a StorageRoom with room_type IN {DRY_STORE, KILN}"
          - "referenced StorageRoom.climate_status != QUARANTINED"
        side_effects:
          - "permit_status = NOT_REQUIRED"
          - "moisture_at_receipt_pct = moisture_content_pct"
          - "board_feet ledger initialised: board_feet_cut = 0, board_feet_kerf_loss = 0, board_feet_available = board_feet_received, all bucket fields 0"
          - "nominal_yield_board_feet and actual_yield_board_feet computed per calculations.tonewood_lot_yield"
        note: "Branch A of the creation fork."
      - from: "(creation)"
        to: PERMIT_HOLD
        trigger: "POST /tonewood-lots with cites_appendix IN {APPENDIX_II, APPENDIX_I}"
        actor: WoodBuyer
        preconditions:
          - "storage_room_id resolves to a StorageRoom with room_type IN {DRY_STORE, KILN}"
          - "referenced StorageRoom.climate_status != QUARANTINED"
        side_effects:
          - "permit_status = PENDING"
          - "moisture_at_receipt_pct = moisture_content_pct"
          - "board_feet ledger initialised identically to branch A"
        note: "Branch B of the creation fork: protected species are frozen before any measurement or cutting can occur. Divergent side-effect set from branch A (permit_status PENDING vs NOT_REQUIRED)."
      - from: PERMIT_HOLD
        to: RECEIVED
        trigger: "POST /tonewood-lots/{lot_id}/attest-permit"
        actor: ComplianceOfficer
        preconditions:
          - "status == PERMIT_HOLD"
          - "permit_number in the request body is a non-empty string"
        side_effects:
          - "permit_number = request permit_number"
          - "permit_status = VERIFIED"
          - "attested_by_user_id = X-User-ID of the caller (consumed by the ExportShipment release segregation-of-duties check)"
      - from: RELEASED
        to: REJECTED
        trigger: "POST /tonewood-lots/{lot_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "status NOT IN {DEPLETED, REJECTED}"
        side_effects:
          - "permit_status = INVALID"
          - "CASCADE LINK 1->2: because the lot became REJECTED, every Billet with lot_id == this lot AND status IN {AVAILABLE, RESERVED} transitions to QUARANTINED, and the lot's board_feet_scrapped / board_feet_unassigned / board_feet_reserved buckets are recomputed"
          - "CASCADE LINK 2->3: because those Billet rows became QUARANTINED, every Component with billet_id IN those billets AND status NOT IN {INSTALLED, SCRAPPED} transitions to QC_HELD with qc_hold_reason = PROTECTED_SPECIES"
          - "CASCADE LINK 3->4: because those Component rows became QC_HELD, every BuildOrder with at least one such component AND build_stage NOT IN {SERIALIZED, SCRAPPED} records stage_before_compliance_hold = build_stage and transitions build_stage -> COMPLIANCE_HOLD"
        note: "Second independent depth-4 cascade, rooted in a different trigger from the climate cascade. Reject is legal from EVERY non-terminal state (RECEIVED, PERMIT_HOLD, KILN_DRYING, CONDITIONED, RELEASED); RELEASED is shown as the representative from-state because that is the only state in which the lot has downstream Billet / Component / BuildOrder rows for the cascade to reach. From PERMIT_HOLD the same call is legal but the cascade is a no-op beyond the lot itself."
      - from: PERMIT_HOLD
        to: REJECTED
        trigger: "POST /tonewood-lots/{lot_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "status NOT IN {DEPLETED, REJECTED}"
        side_effects:
          - "permit_status = INVALID"
          - "no Billet, Component or BuildOrder rows exist yet, so cascade links 2, 3 and 4 all resolve over empty sets — the empty-cascade boundary"
        note: "Same trigger, same target state, but a completely empty side-effect closure. The cascade must not error when its downstream sets are empty."
      - from: RECEIVED
        to: KILN_DRYING
        trigger: "POST /tonewood-lots/{lot_id}/moisture-readings"
        actor: WoodBuyer
        preconditions:
          - "status == RECEIVED"
        side_effects:
          - "moisture_content_pct = request moisture_content_pct"
          - "actual_yield_board_feet recomputed per calculations.tonewood_lot_yield (ACTUAL_YIELD reads the CURRENT moisture reading)"
      - from: KILN_DRYING
        to: KILN_DRYING
        trigger: "POST /tonewood-lots/{lot_id}/moisture-readings"
        actor: WoodBuyer
        preconditions:
          - "status == KILN_DRYING"
        side_effects:
          - "moisture_content_pct = request moisture_content_pct"
          - "actual_yield_board_feet recomputed"
        note: "Self-loop: readings may be logged repeatedly while drying."
      - from: RECEIVED
        to: CONDITIONED
        trigger: "POST /tonewood-lots/{lot_id}/condition"
        actor: WoodBuyer
        preconditions:
          - "status IN {RECEIVED, KILN_DRYING}"
          - "MOISTURE_MIN_PCT (6.0) <= moisture_content_pct <= MOISTURE_MAX_PCT (8.0), both bounds INCLUSIVE"
          - "StorageRoom(storage_room_id).climate_status == IN_SPEC"
        side_effects:
          - "nominal_yield_board_feet recomputed"
      - from: KILN_DRYING
        to: CONDITIONED
        trigger: "POST /tonewood-lots/{lot_id}/condition"
        actor: WoodBuyer
        preconditions:
          - "status IN {RECEIVED, KILN_DRYING}"
          - "MOISTURE_MIN_PCT (6.0) <= moisture_content_pct <= MOISTURE_MAX_PCT (8.0), both bounds INCLUSIVE"
          - "StorageRoom(storage_room_id).climate_status == IN_SPEC"
        side_effects:
          - "nominal_yield_board_feet recomputed"
        note: "Cross-entity guard on a different entity pair than any BuildOrder rule: TonewoodLot -> StorageRoom."
      - from: CONDITIONED
        to: RECEIVED
        trigger: "system: StorageRoom(storage_room_id) transitioned OUT_OF_SPEC -> QUARANTINED"
        actor: system
        preconditions:
          - "status == CONDITIONED"
        side_effects:
          - "conditioning void; the lot must be re-measured before it can be conditioned again"
      - from: CONDITIONED
        to: RELEASED
        trigger: "POST /tonewood-lots/{lot_id}/release"
        actor: WoodBuyer
        preconditions:
          - "status == CONDITIONED"
          - "permit_status IN {NOT_REQUIRED, VERIFIED}"
        side_effects:
          - "the lot becomes cuttable: POST /billets accepts lot_id only from this state"
      - from: RELEASED
        to: DEPLETED
        trigger: "system: POST /billets left board_feet_available < MIN_USABLE_BOARD_FEET"
        actor: system
        preconditions:
          - "status == RELEASED"
          - "board_feet_available < MIN_USABLE_BOARD_FEET (2.0) after the cut is booked"
        side_effects:
          - "no further billets may be cut from this lot"

  # ---------------------------------------------------------------------------
  - entity: Billet
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [SCRAPPED, QUARANTINED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /components"
        actor: Machinist
        preconditions:
          - "status == AVAILABLE"
        side_effects:
          - "owning TonewoodLot board_feet_unassigned -= board_feet and board_feet_reserved += board_feet"
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /build-orders/{build_order_id}/start-assembly"
        actor: Luthier
        preconditions:
          - "status == RESERVED"
          - "the Component built from this billet has status == ACCEPTED"
        side_effects:
          - "owning TonewoodLot board_feet_reserved -= board_feet and board_feet_consumed += board_feet"
      - from: RESERVED
        to: AVAILABLE
        trigger: "system: POST /build-orders/{build_order_id}/cancel"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "owning TonewoodLot board_feet_reserved -= board_feet and board_feet_unassigned += board_feet (compensating half of the board-feet conservation invariant)"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "system: POST /tonewood-lots/{lot_id}/reject"
        actor: system
        preconditions:
          - "status IN {AVAILABLE, RESERVED}"
        side_effects:
          - "owning TonewoodLot board_feet_unassigned -= board_feet and board_feet_scrapped += board_feet"
      - from: RESERVED
        to: QUARANTINED
        trigger: "system: POST /tonewood-lots/{lot_id}/reject"
        actor: system
        preconditions:
          - "status IN {AVAILABLE, RESERVED}"
        side_effects:
          - "owning TonewoodLot board_feet_reserved -= board_feet and board_feet_scrapped += board_feet"
      - from: RESERVED
        to: SCRAPPED
        trigger: "POST /components/{component_id}/disposition with disposition == SCRAP"
        actor: QualityInspector
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "owning TonewoodLot board_feet_reserved -= board_feet and board_feet_scrapped += board_feet"

  # ---------------------------------------------------------------------------
  - entity: Component
    state_field: status
    initial_state: ROUGH_SAWN
    terminal_states: [INSTALLED, SCRAPPED]
    transitions:
      - from: ROUGH_SAWN
        to: CNC_ROUTED
        trigger: "POST /components/{component_id}/route"
        actor: Machinist
        preconditions:
          - "status IN {ROUGH_SAWN, REWORK}"
          - "StationReservation(station_reservation_id).status == HELD"
          - "StationReservation(station_reservation_id).component_id == component.id"
          - "Station(reservation.station_id).station_type == CNC_ROUTER"
          - "StorageRoom(Station(reservation.station_id).room_id).climate_status == IN_SPEC"
          - "BuildOrder(build_order_id).build_stage == COMPONENTS_RELEASED (skipped when build_order_id is null)"
        side_effects:
          - "measured_thickness_mm = request measured_thickness_mm"
          - "StationReservation transitions HELD -> CONSUMED"
          - "Station.held_minutes -= reservation.duration_minutes; Station.consumed_minutes += reservation.duration_minutes"
        note: "Cross-entity guard Component -> StorageRoom (rule_id cross_entity_state_dependency instance 1)."
      - from: REWORK
        to: CNC_ROUTED
        trigger: "POST /components/{component_id}/route"
        actor: Machinist
        preconditions:
          - "status IN {ROUGH_SAWN, REWORK}"
          - "StationReservation(station_reservation_id).status == HELD"
          - "StationReservation(station_reservation_id).component_id == component.id"
          - "Station(reservation.station_id).station_type == CNC_ROUTER"
          - "StorageRoom(Station(reservation.station_id).room_id).climate_status == IN_SPEC"
        side_effects:
          - "measured_thickness_mm = request measured_thickness_mm"
          - "StationReservation transitions HELD -> CONSUMED"
          - "Station.held_minutes -= reservation.duration_minutes; Station.consumed_minutes += reservation.duration_minutes"
        note: "Closes the rework cycle ROUGH_SAWN -> ... -> QC_HELD -> REWORK -> CNC_ROUTED."
      - from: CNC_ROUTED
        to: HAND_SHAPED
        trigger: "POST /components/{component_id}/hand-shape"
        actor: Luthier
        preconditions:
          - "status == CNC_ROUTED"
          - "StationReservation(station_reservation_id).status == HELD"
          - "StationReservation(station_reservation_id).component_id == component.id"
          - "Station(reservation.station_id).station_type == HAND_SHAPING"
          - "StorageRoom(Station(reservation.station_id).room_id).climate_status == IN_SPEC"
        side_effects:
          - "measured_thickness_mm = request measured_thickness_mm"
          - "StationReservation transitions HELD -> CONSUMED"
          - "Station.held_minutes -= reservation.duration_minutes; Station.consumed_minutes += reservation.duration_minutes"
      - from: HAND_SHAPED
        to: ACCEPTED
        trigger: "POST /components/{component_id}/qc with verdict == ACCEPT"
        actor: QualityInspector
        preconditions:
          - "status == HAND_SHAPED"
          - "abs(measured_thickness_mm - ComponentSpec(spec_id).target_thickness_mm) <= ComponentSpec(spec_id).thickness_tolerance_mm, bound INCLUSIVE"
        side_effects:
          - "qc_hold_reason = NONE"
      - from: HAND_SHAPED
        to: QC_HELD
        trigger: "POST /components/{component_id}/qc with verdict == HOLD"
        actor: QualityInspector
        preconditions:
          - "status == HAND_SHAPED"
        side_effects:
          - "qc_hold_reason = request hold_reason (defaults to DIMENSION when omitted)"
      - from: QC_HELD
        to: REWORK
        trigger: "POST /components/{component_id}/disposition with disposition == REWORK"
        actor: Luthier
        preconditions:
          - "status == QC_HELD"
          - "qc_hold_reason != PROTECTED_SPECIES"
          - "rework_count < MAX_COMPONENT_REWORKS (2)"
        side_effects:
          - "rework_count += 1"
          - "qc_hold_reason = NONE"
      - from: QC_HELD
        to: SCRAPPED
        trigger: "POST /components/{component_id}/disposition with disposition == SCRAP"
        actor: QualityInspector
        preconditions:
          - "status == QC_HELD"
        side_effects:
          - "qc_hold_reason = NONE (the offending part is gone, which is what lets a COMPLIANCE_HOLD order be cleared afterwards)"
          - "Billet(billet_id) transitions RESERVED -> SCRAPPED (the wood is destroyed) ONLY when the billet is still RESERVED; a billet already QUARANTINED by a lot rejection stays QUARANTINED and its board feet are NOT scrapped a second time"
          - "owning TonewoodLot board_feet_reserved -= billet.board_feet and board_feet_scrapped += billet.board_feet, skipped when the billet was already QUARANTINED (its board feet are already in board_feet_scrapped)"
        note: "Contrast with build-order cancellation, which returns the billet to AVAILABLE instead of destroying it."
      - from: ACCEPTED
        to: INSTALLED
        trigger: "system: POST /build-orders/{build_order_id}/start-assembly"
        actor: system
        preconditions:
          - "status == ACCEPTED"
          - "build_order_id == the order being assembled"
        side_effects:
          - "Billet(billet_id) transitions RESERVED -> CONSUMED"
      - from: HAND_SHAPED
        to: QC_HELD
        trigger: "system: POST /tonewood-lots/{lot_id}/reject cascade link 3"
        actor: system
        preconditions:
          - "status NOT IN {INSTALLED, SCRAPPED}"
          - "Billet(billet_id) transitioned to QUARANTINED in this same request"
        side_effects:
          - "qc_hold_reason = PROTECTED_SPECIES"
        note: "Applies from every non-terminal status (ROUGH_SAWN, CNC_ROUTED, HAND_SHAPED, QC_HELD, REWORK, ACCEPTED); listed once here with HAND_SHAPED as the representative from-state."
      - from: ACCEPTED
        to: SCRAPPED
        trigger: "system: POST /build-orders/{build_order_id}/cancel"
        actor: system
        preconditions:
          - "status NOT IN {INSTALLED, SCRAPPED}"
        side_effects:
          - "build_order_id is left unchanged for audit"
          - "Billet(billet_id) transitions RESERVED -> AVAILABLE (the wood is recovered, unlike a QC scrap)"
        note: "Applies from every non-terminal status; ACCEPTED shown as the representative from-state."

  # ---------------------------------------------------------------------------
  - entity: StationReservation
    state_field: status
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /components/{component_id}/route or POST /components/{component_id}/hand-shape citing this reservation"
        actor: Machinist
        preconditions:
          - "status == HELD"
          - "component_id == the component being advanced"
        side_effects:
          - "Station.held_minutes -= duration_minutes; Station.consumed_minutes += duration_minutes"
      - from: HELD
        to: RELEASED
        trigger: "POST /station-reservations/{reservation_id}/release"
        actor: Machinist
        preconditions:
          - "status == HELD"
        side_effects:
          - "Station.held_minutes -= duration_minutes; Station.released_minutes += duration_minutes"
      - from: HELD
        to: RELEASED
        trigger: "system: BuildOrder(build_order_id) entered FINISH_HELD (climate cascade link 4) or SCRAPPED (cancellation)"
        actor: system
        preconditions:
          - "status == HELD"
          - "starts_at > current_utc"
        side_effects:
          - "Station.held_minutes -= duration_minutes; Station.released_minutes += duration_minutes"

  # ---------------------------------------------------------------------------
  - entity: BuildOrder
    state_field: build_stage
    initial_state: DRAFT
    terminal_states: [SERIALIZED, SCRAPPED]
    transitions:
      - from: DRAFT
        to: COMPONENTS_RELEASED
        trigger: "POST /build-orders/{build_order_id}/release-components"
        actor: Machinist
        preconditions:
          - "build_stage == DRAFT"
          - "commercial_status == OPTIONS_LOCKED"
        side_effects:
          - "Component rows may now cite this build_order_id"
      - from: COMPONENTS_RELEASED
        to: IN_ASSEMBLY
        trigger: "POST /build-orders/{build_order_id}/start-assembly"
        actor: Luthier
        preconditions:
          - "build_stage == COMPONENTS_RELEASED"
          - "count(Component where build_order_id == this order AND status == ACCEPTED) >= MIN_ACCEPTED_COMPONENTS (1)"
          - "count(Component where build_order_id == this order AND status IN {ROUGH_SAWN, CNC_ROUTED, HAND_SHAPED, QC_HELD, REWORK}) == 0"
        side_effects:
          - "every Component with build_order_id == this order AND status == ACCEPTED transitions ACCEPTED -> INSTALLED"
          - "each such Component's Billet transitions RESERVED -> CONSUMED and its lot's board_feet_reserved / board_feet_consumed buckets move"
          - "cites_permit_required and strictest_cites_appendix recomputed per calculations.protected_species_requirement"
      - from: IN_ASSEMBLY
        to: IN_FINISH
        trigger: "system: POST /finish-runs"
        actor: system
        preconditions:
          - "build_stage == IN_ASSEMBLY"
        side_effects:
          - "StorageRoom(booth_id).occupied_slots += 1"
      - from: IN_FINISH
        to: FINISH_HELD
        trigger: "system: climate cascade link 3 (an owning FinishRun went CURING -> CURE_SUSPENDED)"
        actor: system
        preconditions:
          - "build_stage == IN_FINISH"
        side_effects:
          - "CASCADE LINK 3->4: every StationReservation with build_order_id == this order AND status == HELD AND starts_at > current_utc transitions HELD -> RELEASED with the matching Station minute-bucket moves"
      - from: FINISH_HELD
        to: IN_FINISH
        trigger: "system: POST /finish-runs/{finish_run_id}/resume-cure"
        actor: system
        preconditions:
          - "build_stage == FINISH_HELD"
        side_effects:
          - "released StationReservation rows are NOT restored; the shop must re-book them"
      - from: IN_FINISH
        to: FINISH_CURED
        trigger: "system: POST /finish-runs/{finish_run_id}/complete"
        actor: system
        preconditions:
          - "build_stage == IN_FINISH"
          - "the FinishRun status == BUFFING"
        side_effects:
          - "StorageRoom(booth_id).occupied_slots -= 1"
      - from: IN_FINISH
        to: IN_ASSEMBLY
        trigger: "system: POST /finish-runs/{finish_run_id}/reject"
        actor: system
        preconditions:
          - "build_stage IN {IN_FINISH, FINISH_HELD}"
        side_effects:
          - "refinish_count += 1"
          - "StorageRoom(booth_id).occupied_slots -= 1"
        note: "Refinish cycle: IN_ASSEMBLY -> IN_FINISH -> IN_ASSEMBLY. A replacement FinishRun legitimately supersedes the rejected one, which is why POST /finish-runs is OCC-guarded (see §1.2.1)."
      - from: FINISH_CURED
        to: FRETWORK
        trigger: "POST /build-orders/{build_order_id}/fretwork"
        actor: Luthier
        preconditions:
          - "build_stage == FINISH_CURED"
        side_effects:
          - "fret levelling, crowning and polishing are recorded as complete"
      - from: FRETWORK
        to: SETUP
        trigger: "POST /build-orders/{build_order_id}/setup"
        actor: Luthier
        preconditions:
          - "build_stage == FRETWORK"
        side_effects:
          - "the order becomes eligible for POST /build-orders/{build_order_id}/setup-inspections"
      - from: SETUP
        to: INSPECTION
        trigger: "POST /build-orders/{build_order_id}/setup-inspections"
        actor: Luthier
        preconditions:
          - "build_stage IN {SETUP, INSPECTION}"
          - "no SetupInspection for this order has status IN {OPEN, MEASURED}"
          - "rework_round_count < MAX_REWORK_ROUNDS (3)"
        side_effects:
          - "a SetupInspection row is created with status OPEN, verdict PENDING, round_number = count of pre-existing rows for this order + 1, performed_by_user_id = X-User-ID"
      - from: INSPECTION
        to: INSPECTION
        trigger: "POST /build-orders/{build_order_id}/setup-inspections"
        actor: Luthier
        preconditions:
          - "build_stage IN {SETUP, INSPECTION}"
          - "no SetupInspection for this order has status IN {OPEN, MEASURED}"
          - "rework_round_count < MAX_REWORK_ROUNDS (3)"
        side_effects:
          - "a SetupInspection row is created with status OPEN, verdict PENDING, round_number = count of pre-existing rows for this order + 1, performed_by_user_id = X-User-ID"
        note: "A self-loop, so an order already at INSPECTION passes the priority-50 state check and the SECOND call surfaces the round-open business rule (ERR_INSPECTION_ROUND_OPEN) instead of ERR_BUILD_STAGE_INVALID. Re-inspecting after a SIGNED/PASS round is legitimate; re-opening while a round is still OPEN or MEASURED is not."
      - from: INSPECTION
        to: SETUP
        trigger: "system: POST /setup-inspections/{inspection_id}/sign produced verdict FAIL"
        actor: system
        preconditions:
          - "build_stage == INSPECTION"
        side_effects:
          - "CASCADE LINK 1->2: rework_round_count += 1"
          - "CASCADE LINK 2->3: because rework_round_count reached REWORK_ESCALATION_THRESHOLD (2) or more, commercial_status transitions CONFIRMED|OPTIONS_LOCKED -> AT_RISK and promised_date is advanced by REWORK_SLIP_DAYS (14) days, then priority_score is recomputed"
        note: "Rework loop INSPECTION -> SETUP -> INSPECTION; root of the depth-3 transitive cascade."
      - from: INSPECTION
        to: SERIALIZED
        trigger: "POST /build-orders/{build_order_id}/assign-serial"
        actor: CustomShopCoordinator
        preconditions:
          - "build_stage == INSPECTION"
          - "serial_number is null"
          - "the SetupInspection for this order with the maximum round_number has status == SIGNED AND verdict == PASS"
        side_effects:
          - "serial_number minted per calculations.serial_number_assignment"
          - "commercial_status transitions OPTIONS_LOCKED|AT_RISK -> INVOICED"
          - "deposit_applied_cents = min(deposit_held_cents, binding_quote_total_cents); deposit_held_cents -= that amount"
      - from: IN_ASSEMBLY
        to: COMPLIANCE_HOLD
        trigger: "system: POST /tonewood-lots/{lot_id}/reject cascade link 4"
        actor: system
        preconditions:
          - "build_stage NOT IN {SERIALIZED, SCRAPPED}"
          - "at least one Component with build_order_id == this order was forced to QC_HELD with qc_hold_reason == PROTECTED_SPECIES in this same request"
        side_effects:
          - "stage_before_compliance_hold = the build_stage held immediately before this transition"
        note: "Applies from every non-terminal build_stage; IN_ASSEMBLY shown as the representative from-state."
      - from: COMPLIANCE_HOLD
        to: IN_ASSEMBLY
        trigger: "POST /build-orders/{build_order_id}/clear-compliance-hold"
        actor: ComplianceOfficer
        preconditions:
          - "build_stage == COMPLIANCE_HOLD"
          - "count(Component where build_order_id == this order AND qc_hold_reason == PROTECTED_SPECIES) == 0"
        side_effects:
          - "build_stage = stage_before_compliance_hold; stage_before_compliance_hold = null"
        note: "Restores whatever stage was recorded, so the target of this transition is data-dependent; IN_ASSEMBLY shown as the representative to-state."
      - from: IN_ASSEMBLY
        to: SCRAPPED
        trigger: "POST /build-orders/{build_order_id}/cancel"
        actor: CustomShopCoordinator
        preconditions:
          - "build_stage != SERIALIZED"
          - "commercial_status NOT IN {INVOICED, CLOSED, CANCELLED}"
        side_effects:
          - "commercial_status -> CANCELLED"
          - "every Component with build_order_id == this order AND status NOT IN {INSTALLED, SCRAPPED} transitions to SCRAPPED, and each such Component's Billet transitions RESERVED -> AVAILABLE"
          - "every StationReservation with build_order_id == this order AND status == HELD transitions HELD -> RELEASED with the matching Station minute-bucket moves"
          - "deposit disposition per calculations.cancellation_deposit_disposition (compensating half of the deposit conservation invariant)"
        note: "Applies from every build_stage except SERIALIZED; IN_ASSEMBLY shown as the representative from-state."

  # ---------------------------------------------------------------------------
  - entity: BuildOrder
    state_field: commercial_status
    initial_state: QUOTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /build-orders/{build_order_id}/confirm"
        actor: CustomShopCoordinator
        preconditions:
          - "commercial_status == QUOTED"
          - "when is_custom_shop is true: count(OptionSelection where build_order_id == this order AND status == SELECTED) >= 1"
          - "deposit_cents >= round_half_up(provisional_quote_total_cents * MIN_DEPOSIT_BP / 10000)"
        side_effects:
          - "deposit_paid_cents += deposit_cents; deposit_held_cents += deposit_cents"
        note: "This dimension advances with build_stage still DRAFT — the two dimensions are independent."
      - from: CONFIRMED
        to: OPTIONS_LOCKED
        trigger: "POST /build-orders/{build_order_id}/lock-options"
        actor: CustomShopCoordinator
        preconditions:
          - "commercial_status == CONFIRMED"
        side_effects:
          - "every OptionSelection with status == SELECTED transitions SELECTED -> LOCKED and has locked_upcharge_cents = OptionCatalog.upcharge_cents read at this instant"
          - "every OptionSelection with status == PENDING_APPROVAL transitions PENDING_APPROVAL -> REJECTED"
          - "binding_quote_total_cents = calculations.custom_shop_quote_total variant BINDING"
          - "promised_date = max(promised_date, current_utc + (BASE_LEAD_DAYS (60) + max(OptionCatalog.lead_time_days over LOCKED selections, 0)) days), where the sum is added as whole days to the DATE part of current_utc"
          - "priority_score recomputed"
      - from: OPTIONS_LOCKED
        to: AT_RISK
        trigger: "system: rework escalation (build_stage INSPECTION -> SETUP pushed rework_round_count to REWORK_ESCALATION_THRESHOLD or above)"
        actor: system
        preconditions:
          - "commercial_status IN {CONFIRMED, OPTIONS_LOCKED}"
          - "rework_round_count >= REWORK_ESCALATION_THRESHOLD (2)"
        side_effects:
          - "promised_date += REWORK_SLIP_DAYS (14) days"
          - "priority_score recomputed (AT_RISK adds AT_RISK_POINTS to the scheduling weight)"
      - from: CONFIRMED
        to: AT_RISK
        trigger: "system: rework escalation"
        actor: system
        preconditions:
          - "commercial_status IN {CONFIRMED, OPTIONS_LOCKED}"
          - "rework_round_count >= REWORK_ESCALATION_THRESHOLD (2)"
        side_effects:
          - "promised_date += REWORK_SLIP_DAYS (14) days"
          - "priority_score recomputed"
      - from: OPTIONS_LOCKED
        to: INVOICED
        trigger: "system: POST /build-orders/{build_order_id}/assign-serial"
        actor: system
        preconditions:
          - "commercial_status IN {OPTIONS_LOCKED, AT_RISK}"
        side_effects:
          - "deposit_applied_cents = min(deposit_held_cents, binding_quote_total_cents); deposit_held_cents -= that amount"
      - from: AT_RISK
        to: INVOICED
        trigger: "system: POST /build-orders/{build_order_id}/assign-serial"
        actor: system
        preconditions:
          - "commercial_status IN {OPTIONS_LOCKED, AT_RISK}"
        side_effects:
          - "deposit_applied_cents = min(deposit_held_cents, binding_quote_total_cents); deposit_held_cents -= that amount"
      - from: INVOICED
        to: CLOSED
        trigger: "system: POST /export-shipments/{shipment_id}/release"
        actor: system
        preconditions:
          - "commercial_status == INVOICED"
        side_effects:
          - "the order is commercially closed; no further deposit movement is possible"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /build-orders/{build_order_id}/cancel"
        actor: CustomShopCoordinator
        preconditions:
          - "commercial_status NOT IN {INVOICED, CLOSED, CANCELLED}"
        side_effects:
          - "build_stage -> SCRAPPED with the component / billet / reservation cascade documented on that dimension"
          - "deposit disposition per calculations.cancellation_deposit_disposition"
        note: "Applies from QUOTED, CONFIRMED, OPTIONS_LOCKED and AT_RISK; CONFIRMED shown as the representative from-state."

  # ---------------------------------------------------------------------------
  - entity: OptionSelection
    state_field: status
    initial_state: PENDING_APPROVAL
    terminal_states: [LOCKED, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: SELECTED
        trigger: "POST /option-selections/{selection_id}/approve"
        actor: CustomShopCoordinator
        preconditions:
          - "status == PENDING_APPROVAL"
          - "BuildOrder(build_order_id).commercial_status IN {QUOTED, CONFIRMED}"
          - "X-User-ID != created_by_user_id (segregation of duties: the coordinator who configured the option may not approve it)"
        side_effects:
          - "BuildOrder(build_order_id).provisional_quote_total_cents recomputed per calculations.custom_shop_quote_total variant PROVISIONAL"
        note: "The provisional total does NOT move on approval: PENDING_APPROVAL and SELECTED are both inside the PROVISIONAL input set, so approval only makes the row eligible for locking (and for the confirm precondition on a custom-shop order)."
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /option-selections/{selection_id}/reject"
        actor: CustomShopCoordinator
        preconditions:
          - "status IN {PENDING_APPROVAL, SELECTED}"
          - "BuildOrder(build_order_id).commercial_status IN {QUOTED, CONFIRMED}"
        side_effects:
          - "line_total_cents is left on the row for audit"
          - "BuildOrder(build_order_id).provisional_quote_total_cents recomputed — the rejected row leaves the PROVISIONAL input set, so the total DROPS"
      - from: SELECTED
        to: REJECTED
        trigger: "POST /option-selections/{selection_id}/reject"
        actor: CustomShopCoordinator
        preconditions:
          - "status IN {PENDING_APPROVAL, SELECTED}"
          - "BuildOrder(build_order_id).commercial_status IN {QUOTED, CONFIRMED}"
        side_effects:
          - "line_total_cents is left on the row for audit"
          - "BuildOrder(build_order_id).provisional_quote_total_cents recomputed"
      - from: SELECTED
        to: LOCKED
        trigger: "system: POST /build-orders/{build_order_id}/lock-options"
        actor: system
        preconditions:
          - "status == SELECTED"
          - "BuildOrder(build_order_id).commercial_status == CONFIRMED"
        side_effects:
          - "locked_upcharge_cents = OptionCatalog(option_id).upcharge_cents read at this instant"
          - "BuildOrder(build_order_id).binding_quote_total_cents recomputed per calculations.custom_shop_quote_total variant BINDING"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "system: POST /build-orders/{build_order_id}/lock-options force-rejects every still-unapproved row"
        actor: system
        preconditions:
          - "status == PENDING_APPROVAL"
          - "BuildOrder(build_order_id).commercial_status == CONFIRMED"
        side_effects:
          - "locked_upcharge_cents stays null — the row never enters the BINDING input set"
        note: "This is why PROVISIONAL and BINDING can diverge without any catalog price ever changing."

  # ---------------------------------------------------------------------------
  - entity: FinishRun
    state_field: status
    initial_state: SPRAYING
    terminal_states: [COMPLETED, REJECTED]
    transitions:
      - from: SPRAYING
        to: CURING
        trigger: "POST /finish-runs/{finish_run_id}/complete-spray"
        actor: FinishTech
        preconditions:
          - "status == SPRAYING"
          - "StorageRoom(booth_id).climate_status == IN_SPEC"
        side_effects:
          - "spray_completed_at = current_utc"
          - "cure_hours and cure_ready_at computed per calculations.finish_cure_ready_at, sampling StorageRoom(booth_id).latest_rh_pct and latest_temp_c AT THIS INSTANT"
      - from: CURING
        to: CURE_SUSPENDED
        trigger: "system: StorageRoom(booth_id) transitioned IN_SPEC -> OUT_OF_SPEC (climate cascade link 2)"
        actor: system
        preconditions:
          - "status == CURING"
        side_effects:
          - "cure_suspend_started_at = current_utc"
          - "CASCADE LINK 2->3: BuildOrder(build_order_id) with build_stage == IN_FINISH transitions IN_FINISH -> FINISH_HELD"
      - from: CURE_SUSPENDED
        to: CURING
        trigger: "POST /finish-runs/{finish_run_id}/resume-cure"
        actor: FinishTech
        preconditions:
          - "status == CURE_SUSPENDED"
          - "StorageRoom(booth_id).climate_status == IN_SPEC"
        side_effects:
          - "cure_suspended_minutes += floor((current_utc - cure_suspend_started_at) / 60 seconds)"
          - "cure_suspend_started_at = null"
          - "cure_ready_at = spray_completed_at + cure_hours hours + cure_suspended_minutes minutes (cure_hours itself is NOT recomputed — the booth sample stays pinned to complete-spray)"
          - "BuildOrder(build_order_id) transitions FINISH_HELD -> IN_FINISH"
      - from: CURING
        to: BUFFING
        trigger: "POST /finish-runs/{finish_run_id}/buff"
        actor: FinishTech
        preconditions:
          - "status == CURING"
          - "current_utc >= cure_ready_at (bound INCLUSIVE)"
          - "StorageRoom(booth_id).climate_status == IN_SPEC"
        side_effects:
          - "the run is on the buffing wheel; the booth slot is still occupied"
      - from: BUFFING
        to: COMPLETED
        trigger: "POST /finish-runs/{finish_run_id}/complete"
        actor: FinishTech
        preconditions:
          - "status == BUFFING"
        side_effects:
          - "StorageRoom(booth_id).occupied_slots -= 1"
          - "BuildOrder(build_order_id) transitions IN_FINISH -> FINISH_CURED"
      - from: CURING
        to: REJECTED
        trigger: "POST /finish-runs/{finish_run_id}/reject"
        actor: QualityInspector
        preconditions:
          - "status IN {CURING, CURE_SUSPENDED, BUFFING}"
        side_effects:
          - "StorageRoom(booth_id).occupied_slots -= 1"
          - "BuildOrder(build_order_id) transitions IN_FINISH|FINISH_HELD -> IN_ASSEMBLY and refinish_count += 1"
      - from: BUFFING
        to: REJECTED
        trigger: "POST /finish-runs/{finish_run_id}/reject"
        actor: QualityInspector
        preconditions:
          - "status IN {CURING, CURE_SUSPENDED, BUFFING}"
        side_effects:
          - "StorageRoom(booth_id).occupied_slots -= 1"
          - "BuildOrder(build_order_id) transitions IN_FINISH|FINISH_HELD -> IN_ASSEMBLY and refinish_count += 1"
      - from: CURE_SUSPENDED
        to: REJECTED
        trigger: "POST /finish-runs/{finish_run_id}/reject"
        actor: QualityInspector
        preconditions:
          - "status IN {CURING, CURE_SUSPENDED, BUFFING}"
        side_effects:
          - "StorageRoom(booth_id).occupied_slots -= 1"
          - "BuildOrder(build_order_id) transitions FINISH_HELD -> IN_ASSEMBLY and refinish_count += 1"

  # ---------------------------------------------------------------------------
  - entity: SetupInspection
    state_field: status
    initial_state: OPEN
    terminal_states: [SIGNED, FAILED]
    transitions:
      - from: OPEN
        to: MEASURED
        trigger: "POST /setup-inspections/{inspection_id}/measure"
        actor: Luthier
        preconditions:
          - "status == OPEN"
          - "X-User-ID == performed_by_user_id (only the luthier who opened the round may submit its numbers)"
        side_effects:
          - "action_mm_treble, action_mm_bass, relief_mm, intonation_cents_max stored"
          - "deviation_score computed per calculations.playability_deviation_score"
      - from: MEASURED
        to: SIGNED
        trigger: "POST /setup-inspections/{inspection_id}/sign with deviation_score <= PASS_SCORE_MAX"
        actor: QualityInspector
        preconditions:
          - "status == MEASURED"
          - "X-User-ID != performed_by_user_id (segregation of duties)"
          - "deviation_score <= PASS_SCORE_MAX (10.00), bound INCLUSIVE"
        side_effects:
          - "verdict = PASS; inspector_user_id = X-User-ID"
          - "BuildOrder(build_order_id) build_stage stays INSPECTION and becomes eligible for assign-serial"
      - from: MEASURED
        to: FAILED
        trigger: "POST /setup-inspections/{inspection_id}/sign with deviation_score > PASS_SCORE_MAX"
        actor: QualityInspector
        preconditions:
          - "status == MEASURED"
          - "X-User-ID != performed_by_user_id (segregation of duties)"
        side_effects:
          - "verdict = FAIL; inspector_user_id = X-User-ID"
          - "CASCADE LINK 1->2: BuildOrder(build_order_id) transitions build_stage INSPECTION -> SETUP and rework_round_count += 1"
          - "CASCADE LINK 2->3: because rework_round_count reached REWORK_ESCALATION_THRESHOLD (2), BuildOrder commercial_status transitions CONFIRMED|OPTIONS_LOCKED -> AT_RISK, promised_date += REWORK_SLIP_DAYS (14) days and priority_score is recomputed"

  # ---------------------------------------------------------------------------
  - entity: RepairShop
    state_field: status
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: AUTHORIZED
        trigger: "POST /repair-shops/{shop_id}/authorize"
        actor: ServiceNetworkManager
        preconditions:
          - "status IN {APPLIED, SUSPENDED}"
          - "authorization_level in the request body != NONE"
        side_effects:
          - "authorization_level = request authorization_level"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "POST /repair-shops/{shop_id}/suspend"
        actor: ServiceNetworkManager
        preconditions:
          - "status == AUTHORIZED"
        side_effects:
          - "authorization_level = NONE"
          - "existing WarrantyRegistration rows are left ACTIVE, but new registrations from this shop are refused"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "POST /repair-shops/{shop_id}/authorize"
        actor: ServiceNetworkManager
        preconditions:
          - "status IN {APPLIED, SUSPENDED}"
          - "authorization_level in the request body != NONE"
        side_effects:
          - "authorization_level = request authorization_level"
        note: "Closes the AUTHORIZED <-> SUSPENDED cycle."

  # ---------------------------------------------------------------------------
  - entity: WarrantyRegistration
    state_field: status
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /warranty-registrations/{registration_id}/void"
        actor: ServiceNetworkManager
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "RepairShop(registering_shop_id).warranty_claim_count -= 1"

  # ---------------------------------------------------------------------------
  - entity: ExportShipment
    state_field: status
    initial_state: DOCS_PENDING
    terminal_states: [EXPORTED]
    transitions:
      - from: DOCS_PENDING
        to: DOCS_ATTACHED
        trigger: "POST /export-shipments/{shipment_id}/attach-docs"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {DOCS_PENDING, DOCS_REJECTED}"
          - "when cites_permit_required is true: cites_permit_number in the request body is a non-empty string"
        side_effects:
          - "cites_permit_number stored (overwriting any previous value)"
        note: "When the contributing-lot set contains zero CITES-listed lots, cites_permit_required is false and the permit number may be omitted entirely — the empty-collection boundary."
      - from: DOCS_REJECTED
        to: DOCS_ATTACHED
        trigger: "POST /export-shipments/{shipment_id}/attach-docs"
        actor: ComplianceOfficer
        preconditions:
          - "status IN {DOCS_PENDING, DOCS_REJECTED}"
          - "when cites_permit_required is true: cites_permit_number in the request body is a non-empty string"
        side_effects:
          - "cites_permit_number stored (overwriting any previous value)"
        note: "Closes the DOCS_ATTACHED -> DOCS_REJECTED -> DOCS_ATTACHED negotiation cycle with the issuing authority."
      - from: DOCS_ATTACHED
        to: DOCS_REJECTED
        trigger: "POST /export-shipments/{shipment_id}/reject-docs"
        actor: ComplianceOfficer
        preconditions:
          - "status == DOCS_ATTACHED"
        side_effects:
          - "cites_permit_number is retained for audit but no longer accepted as valid"
      - from: DOCS_ATTACHED
        to: RELEASED
        trigger: "POST /export-shipments/{shipment_id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "status == DOCS_ATTACHED"
          - "BuildOrder(build_order_id).build_stage == SERIALIZED"
          - "every contributing TonewoodLot with cites_appendix != NONE has permit_status == VERIFIED AND status == RELEASED"
          - "X-User-ID differs from attested_by_user_id of every contributing TonewoodLot (segregation of duties)"
          - "BuildOrder(build_order_id).deposit_applied_cents >= round_half_up(binding_quote_total_cents * MIN_SETTLE_BP / 10000)"
        side_effects:
          - "released_by_user_id = X-User-ID"
          - "BuildOrder(build_order_id) commercial_status transitions INVOICED -> CLOSED"
        note: "Cross-entity guard ExportShipment -> TonewoodLot, a different entity pair from Component -> StorageRoom."
      - from: RELEASED
        to: EXPORTED
        trigger: "POST /export-shipments/{shipment_id}/depart"
        actor: ComplianceOfficer
        preconditions:
          - "status == RELEASED"
        side_effects:
          - "the instrument has physically left the country; no further mutation is possible"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: finish-run-create-stale-build-order
    parent_entity: BuildOrder
    write_endpoint: "POST /finish-runs"
    occ_field: "expected_build_order_version"
    description: |
      Creating a FinishRun against a BuildOrder whose version has advanced since the client
      last read it is rejected. A replacement finish run legitimately supersedes a rejected
      one under the refinish loop (build_stage IN_FINISH -> IN_ASSEMBLY -> IN_FINISH), so a
      second create against the same order is a valid product operation rather than a state
      violation; the stale-version check is what stops a client from booking a booth window
      on the strength of an obsolete view of the order's finish system, stage and priority.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: option-selection-create-stale-build-order
    parent_entity: BuildOrder
    write_endpoint: "POST /build-orders/{build_order_id}/option-selections"
    occ_field: "expected_build_order_version"
    description: |
      Adding an OptionSelection to a BuildOrder whose version has advanced since the client
      last read it is rejected. Multiple selections on one order are entirely legitimate, so
      the operation is not gated by any state precondition; the stale-version check is what
      stops a coordinator from stacking an option on top of a provisional quote it never saw,
      which would silently change the deposit threshold that confirm later enforces.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: billet-cut-stale-tonewood-lot
    parent_entity: TonewoodLot
    write_endpoint: "POST /billets"
    occ_field: "expected_tonewood_lot_version"
    description: |
      Cutting a Billet from a TonewoodLot whose version has advanced since the client last
      read it is rejected. Cutting several billets from one RELEASED lot is normal practice,
      so nothing in the lot's state machine refuses the second cut; the stale-version check is
      what stops a machinist from sawing against an obsolete board_feet_available figure and
      overdrawing the lot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# All money is integer cents; all multipliers are integer basis points (bp,
# 1/10000). All board feet are decimal(2). No binary floating point is required
# anywhere: every intermediate is an integer numerator over an integer
# denominator, rounded half-up at the single point named by `precision`.
# `round_half_up(x)` means: round to the nearest integer, ties away from zero.
# `round_half_up(x, 2)` means the same at two decimal places.
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: custom_shop_quote_total
    output_field: "BuildOrder.provisional_quote_total_cents / BuildOrder.binding_quote_total_cents"
    algorithm_type: weighted_scoring
    difficulty_rules: [dual_variant_calc, combinatorial_formula]
    constants:
      COMPLEXITY_MULTIPLIER_BP:
        STANDARD: 10000
        ARTISAN: 13500
        MASTER: 17500
      CUSTOM_SHOP_SURCHARGE_BP: 1200
      ARTIST_DISCOUNT_BP:
        NONE: 0
        ENDORSER: 1000
        SIGNATURE: 2500
    variants:
      - variant: PROVISIONAL
        output_field: BuildOrder.provisional_quote_total_cents
        input_set: "OptionSelection rows with build_order_id == this order AND status IN {PENDING_APPROVAL, SELECTED}"
        unit_upcharge_source: "OptionCatalog(option_id).upcharge_cents read live at evaluation time"
        recomputed_on:
          - "POST /build-orders (creation, with zero selections)"
          - "POST /build-orders/{build_order_id}/option-selections"
          - "POST /option-selections/{selection_id}/approve"
          - "POST /option-selections/{selection_id}/reject"
        note: "Forward-looking: an option still awaiting approval is already priced in, because the deposit threshold at confirm must cover the worst case the customer has asked for."
      - variant: BINDING
        output_field: BuildOrder.binding_quote_total_cents
        input_set: "OptionSelection rows with build_order_id == this order AND status == LOCKED"
        unit_upcharge_source: "OptionSelection.locked_upcharge_cents, frozen at lock-options time"
        recomputed_on:
          - "POST /build-orders/{build_order_id}/lock-options"
        note: "Backward-looking and immune to later OptionCatalog price edits. A PENDING_APPROVAL row is force-rejected by lock-options and therefore drops out of the binding set entirely."
    formula: |
      Step 1 — per-line pricing, iterating the included OptionSelection rows in
              OptionCatalog.option_code ASC order, tie-break OptionSelection.created_at ASC:
        line_total_cents(i) = round_half_up(
            unit_upcharge(i) * quantity(i) * COMPLEXITY_MULTIPLIER_BP[OptionCatalog(i).complexity_class] / 10000 )
      Step 2 — options_subtotal_cents = sum of line_total_cents(i) over the included rows
      Step 3 — pre_discount_cents = base_price_cents + options_subtotal_cents
      Step 4 — surcharge_cents = is_custom_shop
                 ? round_half_up(pre_discount_cents * CUSTOM_SHOP_SURCHARGE_BP / 10000)
                 : 0
      Step 5 — artist_discount_cents = round_half_up(
                   options_subtotal_cents * ARTIST_DISCOUNT_BP[artist_tier] / 10000 )
               (the endorsement discount is granted against the CUSTOM OPTION CONTENT only —
                never against the base instrument price and never against the custom shop surcharge)
      Step 6 — total_cents = pre_discount_cents + surcharge_cents - artist_discount_cents
      OptionSelection.line_total_cents is persisted from Step 1 on the row itself.
    combinatorial_mode: "(b) nested rounding — Step 1 rounds EACH line, then Step 2 sums. Rounding per line and rounding the summed raw upcharges are NOT interchangeable; the pinned reading is round-then-sum."
    precision:
      money: "integer cents at every step; round_half_up applied independently at Step 1 (per line), Step 4 and Step 5"
      forbidden: "summing raw unit_upcharge * quantity across lines and applying the complexity multiplier once to the sum"
    worked_example_provisional: |
      BuildOrder: base_price_cents 480000, is_custom_shop true, artist_tier ENDORSER.
      Selections: INL-VINE (ARTISAN, upcharge 130000, qty 1, status SELECTED)
                  TOP-BRZ  (MASTER,  upcharge  95000, qty 1, status PENDING_APPROVAL)
      Step 1: INL-VINE -> round_half_up(130000 * 1 * 13500 / 10000) = 175500
              TOP-BRZ  -> round_half_up( 95000 * 1 * 17500 / 10000) = 166250
      Step 2: options_subtotal_cents = 341750
      Step 3: pre_discount_cents = 480000 + 341750 = 821750
      Step 4: surcharge_cents = round_half_up(821750 * 1200 / 10000) = 98610
      Step 5: artist_discount_cents = round_half_up(341750 * 1000 / 10000) = 34175
      Step 6: provisional_quote_total_cents = 821750 + 98610 - 34175 = 886185
    worked_example_binding: |
      Same order after POST /build-orders/{id}/lock-options: INL-VINE was SELECTED and becomes
      LOCKED with locked_upcharge_cents 130000; TOP-BRZ was PENDING_APPROVAL and is force-REJECTED.
      Step 1: 175500.  Step 2: 175500.  Step 3: 480000 + 175500 = 655500
      Step 4: round_half_up(655500 * 1200 / 10000) = 78660
      Step 5: round_half_up(175500 * 1000 / 10000) = 17550
      Step 6: binding_quote_total_cents = 655500 + 78660 - 17550 = 716610
      Divergence PROVISIONAL - BINDING = 886185 - 716610 = 169575.
    worked_example_nested_rounding: |
      BuildOrder: base_price_cents 300000, is_custom_shop false, artist_tier NONE.
      Three ARTISAN selections, all qty 1: INL-DOT 12004, HW-GOLD 22004, EL-PICKUP 32004.
      Pinned (round each line, then sum):
        12004 * 13500 / 10000 = 16205.4  -> 16205
        22004 * 13500 / 10000 = 29705.4  -> 29705
        32004 * 13500 / 10000 = 43205.4  -> 43205
        options_subtotal_cents = 89115 ; total_cents = 300000 + 89115 = 389115
      Rejected (sum then round):
        (12004 + 22004 + 32004) = 66012 ; 66012 * 13500 / 10000 = 89116.2 -> 89116
        total would be 389116 — one cent higher. 389115 is the only correct answer.

  # ---------------------------------------------------------------------------
  - name: tonewood_lot_yield
    output_field: "TonewoodLot.nominal_yield_board_feet / TonewoodLot.actual_yield_board_feet"
    algorithm_type: chronological
    difficulty_rules: [dual_variant_calc, boundary_precision_check]
    constants:
      TARGET_MOISTURE_PCT: 8.0
      SHRINK_BP_PER_PCT: 45
      NOMINAL_KERF_BP: 30
      ACTUAL_KERF_BP: 300
    shared_helper: |
      shrink_bp(m) = max(0, m - TARGET_MOISTURE_PCT) * SHRINK_BP_PER_PCT
      The max(0, ...) clamp is load-bearing: wood dried BELOW the 8.0% target has already
      given up its shrinkage and is never credited with negative loss. m == 8.0 exactly
      yields shrink_bp == 0 (the inclusive boundary).
    variants:
      - variant: NOMINAL_YIELD
        output_field: TonewoodLot.nominal_yield_board_feet
        algorithm_type: forward_looking
        moisture_source: TonewoodLot.moisture_at_receipt_pct
        kerf_model: "a single whole-lot allowance of NOMINAL_KERF_BP against board_feet_received"
        formula: |
          nominal_yield_board_feet = round_half_up(
              board_feet_received * (10000 - shrink_bp(moisture_at_receipt_pct) - NOMINAL_KERF_BP) / 10000, 2)
        recomputed_on: ["POST /tonewood-lots (creation only — it is a receipt-time projection and never moves again)"]
      - variant: ACTUAL_YIELD
        output_field: TonewoodLot.actual_yield_board_feet
        algorithm_type: chronological
        moisture_source: TonewoodLot.moisture_content_pct (the latest reading)
        kerf_model: "a per-cut allowance of ACTUAL_KERF_BP charged against each Billet's own board_feet"
        formula: |
          Replay every Billet with lot_id == this lot AND status != QUARANTINED in
          created_at ASC order, tie-break billet_code ASC:
            cut_total = sum(Billet.board_feet)
          actual_yield_board_feet = round_half_up(
              cut_total * (10000 - shrink_bp(moisture_content_pct)) / 10000, 2)
        recomputed_on:
          - "POST /billets"
          - "POST /tonewood-lots/{lot_id}/moisture-readings"
          - "POST /tonewood-lots/{lot_id}/reject (quarantined billets leave the replay set)"
    distinguishing_note: |
      The two variants disagree on THREE axes at once — which moisture figure is authoritative
      (receipt vs current), how kerf is charged (one whole-lot allowance vs one allowance per
      cut), and what the input set is (a projection over nothing vs a replay over actual Billet
      rows). They are not the same formula with a different filter.
    precision:
      board_feet: "decimal(2), round_half_up, applied once at the end of each variant"
    worked_example: |
      Lot: board_feet_received 100.00, moisture_at_receipt_pct 12.0, moisture_content_pct 7.0
      (after a conditioning reading). Two billets cut, in order: 30.00 bf then 25.00 bf.
      NOMINAL: shrink_bp(12.0) = (12.0 - 8.0) * 45 = 180
               round_half_up(100.00 * (10000 - 180 - 30) / 10000, 2)
             = round_half_up(100.00 * 9790 / 10000, 2) = 97.90
      ACTUAL:  shrink_bp(7.0) = max(0, 7.0 - 8.0) * 45 = 0     <- the clamp fires
               cut_total = 30.00 + 25.00 = 55.00
               round_half_up(55.00 * 10000 / 10000, 2) = 55.00
      Per-billet kerf: 30.00 * 300 / 10000 = 0.90 ; 25.00 * 300 / 10000 = 0.75
      board_feet_kerf_loss = 1.65 ; board_feet_available = 100.00 - 55.00 - 1.65 = 43.35

  # ---------------------------------------------------------------------------
  - name: finish_cure_ready_at
    output_field: "FinishRun.cure_hours and FinishRun.cure_ready_at"
    algorithm_type: threshold
    difficulty_rules: [combinatorial_formula, boundary_precision_check, cross_entity_state_dependency]
    constants:
      BASE_CURE_HOURS: { NITRO: 336, POLY: 72 }
      BASE_COATS: { NITRO: 8, POLY: 3 }
      PER_EXTRA_COAT_HOURS: { NITRO: 18, POLY: 6 }
      MIN_CURE_HOURS: { NITRO: 240, POLY: 48 }
      RH_NOMINAL_PCT: 45.0
      RH_STEP_PCT: 5.0
      RH_PENALTY_HOURS_PER_STEP: 12
      TEMP_NOMINAL_C: 21.0
      TEMP_STEP_C: 2.0
      TEMP_RELIEF_HOURS_PER_STEP: 8
      TEMP_RELIEF_CAP_HOURS: 48
      SPRAY_HOURS: 4
    formula: |
      Evaluated at POST /finish-runs/{finish_run_id}/complete-spray, sampling
      StorageRoom(booth_id).latest_rh_pct and latest_temp_c AT THAT INSTANT:
        extra_coats   = max(0, coat_count - BASE_COATS[finish_system])
        coat_hours    = BASE_CURE_HOURS[finish_system] + extra_coats * PER_EXTRA_COAT_HOURS[finish_system]
        rh_steps      = ceil( max(0.0, latest_rh_pct - RH_NOMINAL_PCT) / RH_STEP_PCT )        # ceil
        rh_penalty    = rh_steps * RH_PENALTY_HOURS_PER_STEP
        temp_steps    = floor( max(0.0, latest_temp_c - TEMP_NOMINAL_C) / TEMP_STEP_C )       # floor
        temp_relief   = min( TEMP_RELIEF_CAP_HOURS, temp_steps * TEMP_RELIEF_HOURS_PER_STEP )
        cure_hours    = max( MIN_CURE_HOURS[finish_system],
                             coat_hours + rh_penalty - temp_relief )
        cure_ready_at = spray_completed_at + cure_hours hours + cure_suspended_minutes minutes
    combinatorial_mode: "(a) four independent dimensions — finish system, coat count, booth humidity and booth temperature — each contributing a term, with an asymmetric rounding pair (humidity ceils UP into penalty, temperature floors DOWN into relief), a capped relief term and a per-system floor. Getting three of the four right still produces the wrong hour count."
    precision:
      hours: "integer hours throughout; rh_steps uses ceil, temp_steps uses floor, and the two are NOT the same rounding rule"
      floor_semantics: "MIN_CURE_HOURS is a hard floor applied AFTER relief, so a hot dry booth cannot drive a nitrocellulose cure below 240 hours no matter how much relief it earns"
    booth_hold_projection: |
      FinishRun.booth_hold_from / booth_hold_until are set at CREATION, before any climate
      sample exists, and are therefore projected from the coat schedule alone:
        booth_hold_from  = current_utc
        booth_hold_until = booth_hold_from + (SPRAY_HOURS + BASE_CURE_HOURS[finish_system]
                                              + extra_coats * PER_EXTRA_COAT_HOURS[finish_system]) hours
      The projection deliberately omits the climate terms, so a humid booth can push the real
      cure_ready_at PAST booth_hold_until. That divergence is informational — it is never an
      error, and it never shortens or extends the reservation window that capacity is checked against.
    worked_example_nitro: |
      NITRO, coat_count 12, booth latest_rh_pct 52.0, latest_temp_c 27.0,
      spray_completed_at 2026-08-05T09:00:00Z, cure_suspended_minutes 0.
        extra_coats = 12 - 8 = 4 ; coat_hours = 336 + 4 * 18 = 408
        rh_steps    = ceil((52.0 - 45.0) / 5.0) = ceil(1.4) = 2 ; rh_penalty  = 24
        temp_steps  = floor((27.0 - 21.0) / 2.0) = 3 ; temp_relief = min(48, 24) = 24
        cure_hours  = max(240, 408 + 24 - 24) = 408
        cure_ready_at = 2026-08-05T09:00:00Z + 408h = 2026-08-22T09:00:00Z
    worked_example_poly_floor: |
      POLY, coat_count 3, booth latest_rh_pct 40.0, latest_temp_c 29.0,
      spray_completed_at 2026-08-10T12:00:00Z.
        extra_coats = 0 ; coat_hours = 72
        rh_steps    = ceil(max(0.0, 40.0 - 45.0) / 5.0) = 0 ; rh_penalty = 0
        temp_steps  = floor((29.0 - 21.0) / 2.0) = 4 ; temp_relief = min(48, 32) = 32
        cure_hours  = max(48, 72 + 0 - 32) = max(48, 40) = 48   <- the floor fires
        cure_ready_at = 2026-08-10T12:00:00Z + 48h = 2026-08-12T12:00:00Z
    worked_example_booth_hold: |
      NITRO, coat_count 8, created at 2026-08-01T00:00:00Z.
        hold hours = 4 + 336 + 0 = 340 ; booth_hold_from = 2026-08-01T00:00:00Z
        booth_hold_until = 2026-08-15T04:00:00Z

  # ---------------------------------------------------------------------------
  - name: export_declared_value
    output_field: "ExportShipment.doc_fee_cents, insurance_cents, declared_value_cents"
    algorithm_type: tiered_pricing
    difficulty_rules: [combinatorial_formula, boundary_precision_check]
    constants:
      DOC_FEE_BP_BY_TIER: { TIER_1: 150, TIER_2: 110, TIER_3: 80 }
      TIER_1_MAX_CENTS: 500000
      TIER_2_MAX_CENTS: 2000000
      DOC_FEE_MIN_CENTS: 3000
      INSURANCE_BP: 90
      CITES_ENDORSEMENT_FEE_CENTS: 12500
    formula: |
      Evaluated at POST /export-shipments (creation) and re-evaluated at
      POST /export-shipments/{shipment_id}/attach-docs, in EXACTLY this order:
        Step 1 — goods_value_cents = BuildOrder(build_order_id).binding_quote_total_cents
        Step 2 — tier is keyed on goods_value_cents ALONE:
                   goods_value_cents <= TIER_1_MAX_CENTS   -> TIER_1   (bound INCLUSIVE)
                   goods_value_cents <= TIER_2_MAX_CENTS   -> TIER_2   (bound INCLUSIVE)
                   otherwise                               -> TIER_3
        Step 3 — doc_fee_cents = max( round_half_up(goods_value_cents * DOC_FEE_BP_BY_TIER[tier] / 10000),
                                      DOC_FEE_MIN_CENTS )
                                + (cites_permit_required ? CITES_ENDORSEMENT_FEE_CENTS : 0)
        Step 4 — insurance_cents = round_half_up( (goods_value_cents + doc_fee_cents) * INSURANCE_BP / 10000 )
                 (the insurance base includes the documentation fee and EXCLUDES insurance itself)
        Step 5 — declared_value_cents = goods_value_cents + doc_fee_cents + insurance_cents
    combinatorial_mode: "(c) an order-of-operations pin. The tier is selected from the GOODS value, not from the declared value that the fee and insurance later inflate; and insurance is charged on goods + doc_fee, not on goods alone and not on the final declared value. Re-deriving the tier from declared_value_cents is a plausible circular reading that this specification forbids."
    precision:
      money: "integer cents; round_half_up applied at Step 3 and again at Step 4, never once at the end"
      tier_bounds: "both tier ceilings are INCLUSIVE — goods_value_cents == 500000 is TIER_1, 500001 is TIER_2"
    worked_example_with_cites: |
      goods_value_cents 716610, cites_permit_required true.
        Step 2: 716610 > 500000 and <= 2000000 -> TIER_2, bp 110
        Step 3: round_half_up(716610 * 110 / 10000) = round_half_up(7882.71) = 7883
                max(7883, 3000) = 7883 ; + 12500 = doc_fee_cents 20383
        Step 4: round_half_up((716610 + 20383) * 90 / 10000)
              = round_half_up(736993 * 90 / 10000) = round_half_up(6632.937) = 6633
        Step 5: declared_value_cents = 716610 + 20383 + 6633 = 743626
    worked_example_tier_pin: |
      goods_value_cents 498000, cites_permit_required false.
        PINNED reading (tier from goods): TIER_1, bp 150
          doc_fee_cents  = max(round_half_up(498000 * 150 / 10000), 3000) = max(7470, 3000) = 7470
          insurance_cents = round_half_up(505470 * 90 / 10000) = round_half_up(4549.23) = 4549
          declared_value_cents = 498000 + 7470 + 4549 = 510019
        REJECTED circular reading (tier from the declared value, which exceeds 500000 -> TIER_2):
          doc_fee 5478, insurance 4531, declared 508009.
        510019 is the only correct answer; 508009 is the trap.

  # ---------------------------------------------------------------------------
  - name: playability_deviation_score
    output_field: "SetupInspection.deviation_score and SetupInspection.verdict"
    algorithm_type: weighted_scoring
    difficulty_rules: [boundary_precision_check, combinatorial_formula]
    constants:
      SPEC_ACTION_MM_TREBLE_MAX: 1.60
      SPEC_ACTION_MM_BASS_MAX: 2.20
      SPEC_RELIEF_MM_MAX: 0.25
      SPEC_INTONATION_CENTS_MAX: 4.0
      WEIGHT_PER_HUNDREDTH_MM_ACTION_TREBLE: 600
      WEIGHT_PER_HUNDREDTH_MM_ACTION_BASS: 500
      WEIGHT_PER_HUNDREDTH_MM_RELIEF: 400
      WEIGHT_PER_TENTH_CENT_INTONATION: 500
      DEVIATION_SCORE_DIVISOR: 1000
      PASS_SCORE_MAX: 10.00
    formula: |
      All four measurements are first converted to integer sub-units so that no binary
      floating point enters the sum:
        t_h = round_half_up(action_mm_treble    * 100)   # hundredths of a millimetre
        b_h = round_half_up(action_mm_bass      * 100)
        r_h = round_half_up(relief_mm           * 100)
        i_t = round_half_up(intonation_cents_max * 10)   # tenths of a cent
        spec_t_h = 160 ; spec_b_h = 220 ; spec_r_h = 25 ; spec_i_t = 40
        score_milli = max(0, t_h - spec_t_h) * WEIGHT_PER_HUNDREDTH_MM_ACTION_TREBLE
                    + max(0, b_h - spec_b_h) * WEIGHT_PER_HUNDREDTH_MM_ACTION_BASS
                    + max(0, r_h - spec_r_h) * WEIGHT_PER_HUNDREDTH_MM_RELIEF
                    + max(0, i_t - spec_i_t) * WEIGHT_PER_TENTH_CENT_INTONATION
        deviation_score = round_half_up(score_milli / DEVIATION_SCORE_DIVISOR, 2)
        verdict = (deviation_score <= PASS_SCORE_MAX) ? PASS : FAIL      # bound INCLUSIVE
      A measurement AT its specification limit contributes exactly zero — the max(0, ...)
      clamps are one-sided, so a guitar set up tighter than spec earns no credit against a
      dimension that is out of spec.
    precision:
      score: "decimal(2), round_half_up, computed once from the integer milli-point total"
      boundary: "deviation_score == 10.00 is a PASS; 10.01 is a FAIL"
    worked_example_pass_at_boundary: |
      action_mm_treble 1.70, action_mm_bass 2.10, relief_mm 0.20, intonation_cents_max 4.8
        t_h 170 - 160 =  10 -> 10 * 600 = 6000
        b_h 210 - 220 =  -10 -> clamped to 0
        r_h  20 -  25 =   -5 -> clamped to 0
        i_t  48 -  40 =    8 ->  8 * 500 = 4000
        score_milli = 10000 ; deviation_score = 10.00 ; verdict = PASS (exactly at the limit)
    worked_example_fail: |
      Same inspection with action_mm_treble 1.75 instead of 1.70
        t_h 175 - 160 = 15 -> 15 * 600 = 9000 ; + 4000 = 13000
        deviation_score = 13.00 ; verdict = FAIL
        -> cascade: SetupInspection MEASURED -> FAILED, BuildOrder build_stage INSPECTION -> SETUP,
           rework_round_count += 1, and on reaching REWORK_ESCALATION_THRESHOLD the order goes AT_RISK.

  # ---------------------------------------------------------------------------
  - name: build_priority_score
    output_field: "BuildOrder.priority_score, and the selection made by GET /stations/{station_id}/next-build-order"
    algorithm_type: weighted_scoring
    difficulty_rules: [combinatorial_formula]
    constants:
      ARTIST_TIER_POINTS: { NONE: 0, ENDORSER: 20, SIGNATURE: 40 }
      CUSTOM_SHOP_POINTS: 15
      AT_RISK_POINTS: 25
      LEAD_HORIZON_DAYS: 90
      SLIP_POINTS_PER_DAY: 0.5
    formula: |
      priority_score = ARTIST_TIER_POINTS[artist_tier]
                     + (is_custom_shop ? CUSTOM_SHOP_POINTS : 0)
                     + (commercial_status == AT_RISK ? AT_RISK_POINTS : 0)
                     + max(0, LEAD_HORIZON_DAYS - days_out) * SLIP_POINTS_PER_DAY
      where days_out = the whole number of days from date(current_utc) to promised_date
      (negative when the promised date is already past, in which case the urgency term
      saturates at LEAD_HORIZON_DAYS * SLIP_POINTS_PER_DAY plus the overdue days).
      Recomputed on: POST /build-orders, .../confirm, .../lock-options, the AT_RISK
      escalation, and POST /_clock/set_current_utc is NOT a trigger (scores are refreshed
      lazily whenever the order is written or whenever the selector reads it).
    selector_policy:
      endpoint: "GET /stations/{station_id}/next-build-order"
      eligibility_filter: |
        A BuildOrder is eligible for this station iff ALL of:
          - it has at least one StationReservation with station_id == this station AND status == HELD
          - build_stage NOT IN {SERIALIZED, SCRAPPED, COMPLIANCE_HOLD}
          - commercial_status NOT IN {QUOTED, INVOICED, CLOSED, CANCELLED}
      ranking: "priority_score DESC"
      tie_breaks:
        - "earliest StationReservation.starts_at ASC among that order's HELD reservations on this station"
        - "BuildOrder.created_at ASC"
      forbidden_tie_break: "BuildOrder.id — ids are opaque and must never decide a business outcome. created_at is the only sanctioned final fallback."
      empty_pool: "no eligible order -> ERR_NO_ELIGIBLE_BUILD_ORDER (409). The endpoint never returns a null data payload."
    precision:
      score: "decimal(2), round_half_up; SLIP_POINTS_PER_DAY is exactly one half so every score lands on a .00 or .50 boundary"
    worked_example: |
      current_utc 2026-08-01T00:00:00Z.
      BO-1: artist_tier SIGNATURE, is_custom_shop true, commercial_status OPTIONS_LOCKED,
            promised_date 2026-10-01 -> days_out 61
            40 + 15 + 0 + max(0, 90 - 61) * 0.5 = 40 + 15 + 14.50 = 69.50
      BO-2: artist_tier NONE, is_custom_shop false, commercial_status OPTIONS_LOCKED,
            promised_date 2026-08-20 -> days_out 19
            0 + 0 + 0 + max(0, 90 - 19) * 0.5 = 35.50
      Both hold reservations on CNC-1 -> the selector returns BO-1 (69.50 > 35.50).

  # ---------------------------------------------------------------------------
  - name: protected_species_requirement
    output_field: "BuildOrder.cites_permit_required, BuildOrder.strictest_cites_appendix, ExportShipment.cites_permit_required, ExportShipment.required_cites_appendix"
    algorithm_type: aggregation
    difficulty_rules: [transitive_cascade, boundary_precision_check]
    constants:
      APPENDIX_STRICTNESS: { NONE: 0, APPENDIX_III: 1, APPENDIX_II: 2, APPENDIX_I: 3 }
    formula: |
      Traverse three hops: BuildOrder -> Component -> Billet -> TonewoodLot.
        contributing_lots = { TonewoodLot(Billet(Component.billet_id).lot_id)
                              for every Component with build_order_id == this order
                              AND Component.status IN {ACCEPTED, INSTALLED} }
        strictest_cites_appendix = the appendix in contributing_lots with the highest
              APPENDIX_STRICTNESS, or NONE when contributing_lots is empty or every lot is NONE
        cites_permit_required = (strictest_cites_appendix != NONE)
      Recomputed on: POST /components/{component_id}/qc (a component entering ACCEPTED),
      POST /components/{component_id}/disposition (a component leaving for REWORK or SCRAPPED),
      POST /build-orders/{build_order_id}/start-assembly (ACCEPTED -> INSTALLED).
      ExportShipment copies both values from its BuildOrder at creation and re-reads them at
      attach-docs, so a component scrapped between the two calls can legitimately drop the
      permit requirement.
    empty_set_boundary: |
      A BuildOrder with zero ACCEPTED-or-INSTALLED components — or one whose only accepted
      components come from NONE-appendix lots — has cites_permit_required false and
      strictest_cites_appendix NONE. Its ExportShipment then accepts attach-docs with NO
      cites_permit_number at all. This is the empty-collection boundary: the aggregate over an
      empty set is the identity value NONE, not an error and not null.
    precision:
      ordering: "strictness is a total order, so APPENDIX_I on a single fingerboard blank outranks APPENDIX_III on every other component in the instrument"

  # ---------------------------------------------------------------------------
  - name: lot_board_feet_ledger
    output_field: "TonewoodLot.board_feet_available, board_feet_unassigned, board_feet_reserved, board_feet_consumed, board_feet_scrapped, board_feet_kerf_loss, board_feet_cut"
    algorithm_type: aggregation
    difficulty_rules: [compensating_invariant]
    invariant_id: I1
    conserved_quantity: |
      board_feet_received == board_feet_available
                          + board_feet_unassigned
                          + board_feet_reserved
                          + board_feet_consumed
                          + board_feet_scrapped
                          + board_feet_kerf_loss
      This identity holds after EVERY write in the system, with no tolerance.
    bucket_definitions:
      board_feet_available: "still standing as uncut lumber in the lot"
      board_feet_unassigned: "cut into Billets in state AVAILABLE — sawn but not yet promised to any Component"
      board_feet_reserved: "Billets in state RESERVED — promised to a Component that is not yet installed"
      board_feet_consumed: "Billets in state CONSUMED — the Component was installed in an instrument"
      board_feet_scrapped: "Billets in state SCRAPPED or QUARANTINED — wood destroyed or impounded"
      board_feet_kerf_loss: "sawdust: the sum of Billet.kerf_loss_board_feet over every cut ever made"
      board_feet_cut: "a convenience mirror of unassigned + reserved + consumed + scrapped (it is NOT an independent bucket and must not be added a second time)"
    movements:
      - trigger: "POST /billets"
        move: "available -> unassigned for Billet.board_feet, and available -> kerf_loss for round_half_up(board_feet * ACTUAL_KERF_BP / 10000, 2)"
        guard: "board_feet + kerf_loss_board_feet must be <= board_feet_available, else ERR_INSUFFICIENT_BOARD_FEET"
      - trigger: "POST /components"
        move: "unassigned -> reserved (Billet AVAILABLE -> RESERVED)"
        direction: forward
      - trigger: "POST /build-orders/{build_order_id}/cancel"
        move: "reserved -> unassigned (Billet RESERVED -> AVAILABLE)"
        direction: compensating
        note: "Cancelling an order RECOVERS the wood — the billet goes back on the rack unharmed."
      - trigger: "POST /components/{component_id}/disposition with disposition SCRAP"
        move: "reserved -> scrapped (Billet RESERVED -> SCRAPPED)"
        direction: forward
        note: "Deliberate contrast with cancel: a QC scrap DESTROYS the wood, so the same reserved board feet leave the recoverable pool permanently. Confusing the two is the single most likely way to break I1."
      - trigger: "POST /build-orders/{build_order_id}/start-assembly"
        move: "reserved -> consumed (Billet RESERVED -> CONSUMED)"
        direction: forward
      - trigger: "POST /tonewood-lots/{lot_id}/reject"
        move: "unassigned and reserved -> scrapped (every Billet -> QUARANTINED), and all remaining available -> scrapped"
        direction: forward
    precision:
      board_feet: "decimal(2) per bucket; every movement moves an already-rounded decimal(2) amount so the buckets can never fail to reconcile through accumulated rounding"
    worked_example: |
      received 100.00; two billets cut (30.00 and 25.00, kerf 0.90 and 0.75); neither assigned yet.
        available 43.35 + unassigned 55.00 + reserved 0.00 + consumed 0.00
        + scrapped 0.00 + kerf_loss 1.65 = 100.00

  # ---------------------------------------------------------------------------
  - name: station_minute_ledger
    output_field: "Station.total_scheduled_minutes, held_minutes, consumed_minutes, released_minutes"
    algorithm_type: aggregation
    difficulty_rules: [compensating_invariant]
    invariant_id: I3
    conserved_quantity: |
      total_scheduled_minutes == held_minutes + consumed_minutes + released_minutes
    movements:
      - trigger: "POST /station-reservations"
        move: "total_scheduled_minutes += duration_minutes; held_minutes += duration_minutes"
        direction: forward
      - trigger: "POST /components/{component_id}/route or POST /components/{component_id}/hand-shape"
        move: "held_minutes -> consumed_minutes for that reservation's duration_minutes (HELD -> CONSUMED)"
        direction: forward
      - trigger: "POST /station-reservations/{reservation_id}/release"
        move: "held_minutes -> released_minutes (HELD -> RELEASED)"
        direction: compensating
      - trigger: "the climate cascade (StorageRoom IN_SPEC -> OUT_OF_SPEC, link 4)"
        move: "held_minutes -> released_minutes for every HELD reservation on a station in that room"
        direction: compensating
    precision:
      minutes: "integer minutes; changeover buffer minutes are NEVER added to duration_minutes — the buffer widens the conflict window only and is not billable machine time"

  # ---------------------------------------------------------------------------
  - name: cancellation_deposit_disposition
    output_field: "BuildOrder.deposit_forfeited_cents, deposit_refunded_cents, deposit_held_cents, deposit_applied_cents"
    algorithm_type: waterfall_allocation
    difficulty_rules: [compensating_invariant, boundary_precision_check]
    invariant_id: I2
    constants:
      MIN_DEPOSIT_BP: 1000
      MIN_SETTLE_BP: 2000
      CANCEL_FORFEIT_BP: 2500
    conserved_quantity: |
      deposit_paid_cents == deposit_applied_cents
                          + deposit_refunded_cents
                          + deposit_forfeited_cents
                          + deposit_held_cents
      This identity holds after EVERY write, with no tolerance.
    formula: |
      At POST /build-orders/{build_order_id}/confirm (forward):
        require deposit_cents >= round_half_up(provisional_quote_total_cents * MIN_DEPOSIT_BP / 10000)
                else ERR_DEPOSIT_INSUFFICIENT (402)
        deposit_paid_cents += deposit_cents ; deposit_held_cents += deposit_cents
      At POST /build-orders/{build_order_id}/assign-serial (forward):
        applied = min(deposit_held_cents, binding_quote_total_cents)
        deposit_applied_cents += applied ; deposit_held_cents -= applied
      At POST /export-shipments/{shipment_id}/release (guard only, no movement):
        require deposit_applied_cents >= round_half_up(binding_quote_total_cents * MIN_SETTLE_BP / 10000)
                else ERR_DEPOSIT_INSUFFICIENT (402)
      At POST /build-orders/{build_order_id}/cancel (compensating):
        basis    = binding_quote_total_cents when commercial_status is OPTIONS_LOCKED or AT_RISK,
                   otherwise provisional_quote_total_cents
        forfeit  = min( deposit_held_cents, round_half_up(basis * CANCEL_FORFEIT_BP / 10000) )
        refund   = deposit_held_cents - forfeit
        deposit_forfeited_cents += forfeit ; deposit_refunded_cents += refund ; deposit_held_cents = 0
      The min(...) cap is load-bearing: the mill can never forfeit more than the customer
      actually left on deposit, so a thin deposit on an expensive order refunds nothing and
      forfeits exactly what was held.
    precision:
      money: "integer cents; round_half_up applied once per threshold and once per forfeit computation"
    worked_example_two_thresholds: |
      provisional_quote_total_cents 886185, binding_quote_total_cents 716610, deposit 100000.
        confirm  requires round_half_up(886185 * 1000 / 10000) = round_half_up(88618.5) = 88619
                 -> 100000 >= 88619, confirm SUCCEEDS
        release  requires round_half_up(716610 * 2000 / 10000) = 143322
                 -> deposit_applied_cents 100000 < 143322, release FAILS with ERR_DEPOSIT_INSUFFICIENT
      A deposit can therefore be large enough to open a build and still too small to
      clear it for export; the two thresholds are independent.
    worked_example_cancel: |
      deposit_paid_cents 200000 (all held), commercial_status OPTIONS_LOCKED,
      binding_quote_total_cents 716610, build_stage IN_ASSEMBLY.
        forfeit = min(200000, round_half_up(716610 * 2500 / 10000))
                = min(200000, round_half_up(179152.5)) = min(200000, 179153) = 179153
        refund  = 200000 - 179153 = 20847
        after: applied 0 + refunded 20847 + forfeited 179153 + held 0 = 200000 = paid

  # ---------------------------------------------------------------------------
  - name: serial_number_assignment
    output_field: BuildOrder.serial_number
    algorithm_type: aggregation
    difficulty_rules: [cross_entity_state_dependency]
    constants:
      SERIAL_SEQUENCE_WIDTH: 5
    formula: |
      At POST /build-orders/{build_order_id}/assign-serial:
        year = the 4-digit UTC year of current_utc
        n    = 1 + count( BuildOrder where serial_number IS NOT NULL
                          AND model_code == this order's model_code
                          AND the serial_number's year segment == year )
        serial_number = "{model_code}-{year}-{n zero-padded to SERIAL_SEQUENCE_WIDTH}"
      The sequence is per model_code and per year, so two different models both start at 00001
      in the same year. Serial numbers are never reused, never reassigned, and a second
      assign-serial on the same order is refused with ERR_SERIAL_ALREADY_ASSIGNED (409).
    preconditions_summary: |
      Guarded by a cross-entity state dependency: the SetupInspection with the HIGHEST
      round_number for this order must be status SIGNED with verdict PASS, else
      ERR_INSPECTION_NOT_SIGNED (409). An earlier round that passed does not qualify — only
      the latest round counts, so a PASS followed by a re-opened round blocks serialization.
    precision:
      format: "exact string format, uppercase, hyphen-separated, five-digit zero-padded sequence"
    worked_example: |
      model_code OM45, current_utc 2026-08-22T09:00:00Z, no OM45 serials issued in 2026 yet
        -> serial_number "OM45-2026-00001"
      The next OM45 serialized in 2026 -> "OM45-2026-00002"; the first D28 -> "D28-2026-00001".

  # ---------------------------------------------------------------------------
  - name: warranty_coverage_window
    output_field: "WarrantyRegistration.coverage_months and coverage_ends_at"
    algorithm_type: threshold
    difficulty_rules: [cross_entity_state_dependency]
    constants:
      COVERAGE_MONTHS_CUSTOM: 60
      COVERAGE_MONTHS_STANDARD: 24
    formula: |
      At POST /warranty-registrations:
        coverage_months  = BuildOrder(build_order_id).is_custom_shop
                             ? COVERAGE_MONTHS_CUSTOM : COVERAGE_MONTHS_STANDARD
        coverage_ends_at = purchase_date + coverage_months calendar months, at 00:00:00Z
        (calendar-month arithmetic, clamped to the last valid day of the target month:
         a 2026-08-31 purchase with 60 months ends 2031-08-31; a 2026-01-31 purchase with
         24 months ends 2028-01-31)
    preconditions_summary: |
      Guarded by a cross-entity state dependency on a DIFFERENT entity pair than
      serial_number_assignment: RepairShop(registering_shop_id).status must be AUTHORIZED
      (ERR_SHOP_NOT_AUTHORIZED 409 when APPLIED or SUSPENDED), and the submitted
      serial_number must equal BuildOrder(build_order_id).serial_number
      (ERR_SERIAL_MISMATCH 422 when it does not, ERR_COMPONENTS_NOT_ACCEPTED never applies here).
    precision:
      dates: "whole calendar months, never 30-day approximations"
    worked_example: |
      is_custom_shop true, purchase_date 2026-08-22
        -> coverage_months 60, coverage_ends_at 2031-08-22T00:00:00Z
      is_custom_shop false, purchase_date 2026-08-22
        -> coverage_months 24, coverage_ends_at 2028-08-22T00:00:00Z

# =============================================================================
# §1.4 Validations — evaluated in ascending `priority` order. The FIRST rule
# whose condition is violated short-circuits the request and returns its
# `error_id`; no later rule is evaluated and no state is mutated. Two requests
# that each violate several rules are therefore fully deterministic.
# =============================================================================
validations:

  - priority: 10
    rule: "X-User-Role header present and a member of the roles enumerated in §1.7; X-User-ID header present and non-empty"
    category: auth
    applies_to: "every endpoint except POST /_clock/set_current_utc"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401

  - priority: 20
    rule: "the caller's X-User-Role is listed in the endpoint's `allowed_roles`"
    category: authz
    applies_to: "every endpoint"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403

  - priority: 25
    rule: "for the entity_backed role AuthorizedShop, X-User-ID must equal the RepairShop.id named by the request (registering_shop_id on create, the path {shop_id} otherwise)"
    category: authz
    applies_to: "POST /warranty-registrations, GET /repair-shops/{shop_id}, GET /warranty-registrations"
    error_id: ERR_SHOP_IDENTITY_MISMATCH
    http_status: 403

  - priority: 30
    rule: "request body and query string satisfy the endpoint's declared schema: required fields present, types correct, enum values members of the declared set, integers within declared bounds, limit in 1..100, offset >= 0, timestamps RFC3339 with a Z offset, decimal fields within their declared scale"
    category: schema
    applies_to: "every endpoint"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    note: "Also covers the intra-body ordering checks that need no database read: starts_at < ends_at (ERR_INVALID_WINDOW), duration_minutes > 0, coat_count >= 1, quantity >= 1, board_feet > 0.00."

  - priority: 32
    rule: "starts_at must be strictly before ends_at on POST /station-reservations, and booth_hold_from must be strictly before booth_hold_until on any explicit window"
    category: schema
    applies_to: "POST /station-reservations"
    error_id: ERR_INVALID_WINDOW
    http_status: 422

  - priority: 40
    rule: "every entity id appearing in the URL PATH resolves to an existing row"
    category: referential
    applies_to: "every endpoint with a path parameter"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    note: "Path existence is checked before body existence, so a request with both a bad path id and a bad body FK returns the PATH entity's 404."

  - priority: 42
    rule: "every foreign key in the request BODY resolves to an existing row"
    category: referential
    applies_to: "POST /billets (lot_id, parent_billet_id), POST /components (spec_id, billet_id, build_order_id), POST /stations (room_id), POST /station-reservations (station_id, build_order_id, component_id), POST /build-orders/{build_order_id}/option-selections (option_id), POST /finish-runs (build_order_id, booth_id), POST /warranty-registrations (build_order_id, registering_shop_id), POST /export-shipments (build_order_id), POST /tonewood-lots (storage_room_id)"
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404

  - priority: 45
    rule: "natural-key uniqueness: StorageRoom.room_code, TonewoodLot.lot_code, Billet.billet_code, ComponentSpec.spec_code, Station.station_code, OptionCatalog.option_code, BuildOrder.order_code, RepairShop.shop_code are each globally unique; at most one ACTIVE WarrantyRegistration may exist per build_order_id; at most one non-terminal ExportShipment may exist per build_order_id"
    category: constraint
    applies_to: "every create endpoint listed above"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    note: "The warranty case has its own code ERR_WARRANTY_ALREADY_REGISTERED (409) because the conflict is on a relationship rather than on a code."

  - priority: 50
    rule: "the target entity's state_field is in the set of from-states permitted for this trigger by its §1.2 state machine"
    category: state
    applies_to: "every action endpoint"
    error_id: "the matching ERR_<ENTITY>_STATE_INVALID / ERR_BUILD_STAGE_INVALID"
    http_status: 409
    note: "PRIORITY PAIR P1 — this rule OUTRANKS the climate posture check at priority 60. A POST /finish-runs whose BuildOrder is in the wrong build_stage AND whose booth is OUT_OF_SPEC returns ERR_BUILD_STAGE_INVALID, never ERR_ROOM_CLIMATE_OUT_OF_SPEC."

  - priority: 55
    rule: "for every §1.2.1 concurrency rule, the supplied expected_<parent>_version equals the parent's current version"
    category: concurrency
    applies_to: "POST /finish-runs, POST /build-orders/{build_order_id}/option-selections, POST /billets"
    error_id: ERR_STALE_VERSION
    http_status: 412
    note: "OCC is checked AFTER state (50) and BEFORE any business rule, so a stale version on a correctly-staged parent always surfaces as 412 rather than as a downstream business error."

  - priority: 60
    rule: "climate posture: the StorageRoom that governs the operation must have climate_status == IN_SPEC"
    category: business_safety
    applies_to: "POST /components/{component_id}/route, POST /components/{component_id}/hand-shape, POST /finish-runs, POST /finish-runs/{finish_run_id}/complete-spray, POST /finish-runs/{finish_run_id}/resume-cure, POST /finish-runs/{finish_run_id}/buff, POST /tonewood-lots/{lot_id}/condition"
    error_id: ERR_ROOM_CLIMATE_OUT_OF_SPEC
    http_status: 409
    note: "When the room is QUARANTINED rather than merely OUT_OF_SPEC the code is ERR_ROOM_QUARANTINED (409) — a stricter posture that also blocks POST /stations and POST /station-reservations."

  - priority: 61
    rule: "protected-species compliance: no operation that moves an instrument or its wood toward export may proceed while any contributing TonewoodLot with cites_appendix != NONE has permit_status != VERIFIED, and no BuildOrder in build_stage COMPLIANCE_HOLD may advance"
    category: business_safety
    applies_to: "POST /export-shipments/{shipment_id}/release, POST /build-orders/{build_order_id}/assign-serial, POST /build-orders/{build_order_id}/start-assembly, POST /components (ERR_PROTECTED_SPECIES_QUARANTINED when the billet's lot has been rejected)"
    error_id: ERR_CITES_PERMIT_UNVERIFIED
    http_status: 409
    note: |
      PRIORITY PAIR P2 — this rule OUTRANKS the deposit settlement check at priority 85.
      A POST /export-shipments/{id}/release whose contributing lot is still PERMIT_PENDING AND
      whose deposit_applied_cents falls short of MIN_SETTLE_BP returns
      ERR_CITES_PERMIT_UNVERIFIED, never ERR_DEPOSIT_INSUFFICIENT. Wildlife law outranks money.
      Related codes at the same priority: ERR_CITES_PERMIT_MISSING (409, attach-docs with no
      permit number when one is required), ERR_PROTECTED_SPECIES_QUARANTINED (409, a component
      whose lot has been rejected), ERR_COMPLIANCE_HOLD_ACTIVE (409).

  - priority: 62
    rule: "segregation of duties: the X-User-ID performing a review step must differ from the X-User-ID that performed the reviewed step"
    category: authz
    applies_to: "POST /setup-inspections/{inspection_id}/sign (must differ from SetupInspection.performed_by_user_id), POST /export-shipments/{shipment_id}/release (must differ from every contributing TonewoodLot.attested_by_user_id), POST /option-selections/{selection_id}/approve (must differ from the OptionSelection creator)"
    category_note: "checked after compliance so that an out-of-compliance shipment fails for the compliance reason even when the same officer attested it"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403

  - priority: 65
    rule: "referential compatibility between the two entities being joined: Billet.grade must meet ComponentSpec.min_grade; TonewoodLot.species_code must be a member of ComponentSpec.required_species_codes; Station.station_type must match the operation (CNC_ROUTER for route, HAND_SHAPING for hand-shape); StationReservation.component_id must belong to StationReservation.build_order_id; OptionCatalog.requires_finish_system must match BuildOrder.finish_system; an OptionSelection's option must not be listed in another selected option's incompatible_option_codes; StorageRoom.room_type must be FINISH_BOOTH for a FinishRun booth and BUILD_ROOM for an assembly station"
    category: referential
    applies_to: "POST /components, POST /station-reservations, POST /components/{component_id}/route, POST /components/{component_id}/hand-shape, POST /build-orders/{build_order_id}/option-selections, POST /finish-runs"
    error_id: "ERR_GRADE_BELOW_MINIMUM (422) / ERR_SPECIES_NOT_PERMITTED (422) / ERR_STATION_TYPE_MISMATCH (422) / ERR_RESERVATION_COMPONENT_MISMATCH (422) / ERR_OPTION_FINISH_MISMATCH (422) / ERR_OPTION_INCOMPATIBLE (409) / ERR_BOOTH_ROOM_TYPE_INVALID (422)"
    http_status: "422 or 409 as listed"
    note: "PRIORITY PAIR P4 — the safety rule at priority 61 OUTRANKS this compatibility family. A POST /components whose billet comes from a rejected (QUARANTINED) protected-species lot AND whose grade is below the spec minimum returns ERR_PROTECTED_SPECIES_QUARANTINED, not ERR_GRADE_BELOW_MINIMUM."

  - priority: 68
    rule: "cross-entity state dependency: the OTHER entity the operation leans on must itself be in an acceptable state — POST /build-orders/{build_order_id}/assign-serial requires the highest-round_number SetupInspection to be SIGNED/PASS; POST /components requires TonewoodLot.status == RELEASED; POST /build-orders/{build_order_id}/start-assembly requires at least MIN_ACCEPTED_COMPONENTS (1) ACCEPTED components and zero components still in flight; POST /warranty-registrations requires RepairShop.status == AUTHORIZED; POST /export-shipments/{shipment_id}/release requires BuildOrder.build_stage == SERIALIZED; POST /build-orders/{build_order_id}/confirm on an order with is_custom_shop true requires at least one OptionSelection in status SELECTED, which is why ERR_OPTIONS_NOT_SELECTED outranks the priority-85 deposit threshold on that same call"
    category: cross_entity
    applies_to: "the endpoints named in the rule"
    error_id: "ERR_INSPECTION_NOT_SIGNED (409) / ERR_LOT_NOT_RELEASED (409) / ERR_COMPONENTS_NOT_ACCEPTED (409) / ERR_SHOP_NOT_AUTHORIZED (409) / ERR_BUILD_STAGE_INVALID (409) / ERR_OPTIONS_NOT_SELECTED (409)"
    http_status: 409

  - priority: 70
    rule: |
      interval conflict. TWO DIFFERENT INTERVAL SEMANTICS live at this priority:
        (O1) Station windows are HALF-OPEN [starts_at, ends_at) and are widened on BOTH sides
             by Station.changeover_minutes. A new reservation conflicts with an existing HELD
             or CONSUMED reservation r on the same station iff
               new.starts_at < r.ends_at + changeover_minutes
               AND new.ends_at + changeover_minutes > r.starts_at
             A new window beginning EXACTLY at r.ends_at + changeover_minutes is ACCEPTED.
        (O2) Finish-booth holds are CLOSED AT BOTH ENDS [booth_hold_from, booth_hold_until]
             and carry no buffer. A new run conflicts with an existing non-terminal run r in
             the same booth iff
               new.booth_hold_from <= r.booth_hold_until
               AND new.booth_hold_until >= r.booth_hold_from
             A new hold beginning EXACTLY at r.booth_hold_until COLLIDES.
      The two semantics are deliberately different and must not be unified.
    category: temporal
    applies_to: "POST /station-reservations (O1), POST /finish-runs (O2)"
    error_id: "ERR_STATION_WINDOW_CONFLICT (409) / — booth overlap does not itself error, it feeds the capacity count at priority 75"
    http_status: 409
    note: "PRIORITY PAIR P3 — this rule OUTRANKS the capacity check at priority 75. A POST /station-reservations that both overlaps an existing HELD window on the same station and would exceed that station's capacity returns ERR_STATION_WINDOW_CONFLICT, never ERR_BOOTH_CAPACITY_EXCEEDED or a capacity error."

  - priority: 72
    rule: "finish-system compatibility inside a shared booth: every non-terminal FinishRun whose [booth_hold_from, booth_hold_until] interval touches the new run's interval must have the SAME finish_system — nitrocellulose overspray poisons a polyurethane cure"
    category: business_safety
    applies_to: "POST /finish-runs"
    error_id: ERR_BOOTH_FINISH_INCOMPATIBLE
    http_status: 409
    note: "This check runs BEFORE the aggregate capacity count at 75, so a booth that is both chemically incompatible and full returns ERR_BOOTH_FINISH_INCOMPATIBLE."

  - priority: 75
    rule: "aggregate capacity: the number of non-terminal FinishRun holds whose closed interval overlaps the new hold, plus one, must not exceed StorageRoom(booth_id).capacity_slots. occupied_slots is the same count evaluated at current_utc rather than against the new hold, so it is a read-only mirror of this rule and never an independent constraint: a non-terminal run whose projected hold has already elapsed occupies nothing and cannot block a new booking whose window is disjoint from it"
    category: constraint
    applies_to: "POST /finish-runs"
    error_id: ERR_BOOTH_CAPACITY_EXCEEDED
    http_status: 409

  - priority: 78
    rule: "moisture band: TonewoodLot.moisture_content_pct must be within [MOISTURE_MIN_PCT, MOISTURE_MAX_PCT] = [6.0, 8.0], BOTH BOUNDS INCLUSIVE, before the lot may be conditioned or released"
    category: business_safety
    applies_to: "POST /tonewood-lots/{lot_id}/condition, POST /tonewood-lots/{lot_id}/release"
    error_id: ERR_MOISTURE_OUT_OF_BAND
    http_status: 409
    note: "6.0 passes, 8.0 passes, 5.9 and 8.1 fail. Also enforced on Component thickness with ERR_THICKNESS_OUT_OF_TOLERANCE (409): abs(measured_thickness_mm - ComponentSpec.target_thickness_mm) <= thickness_tolerance_mm, bound INCLUSIVE."

  - priority: 80
    rule: "board-feet availability: Billet.board_feet + its computed kerf_loss_board_feet must be <= TonewoodLot.board_feet_available"
    category: constraint
    applies_to: "POST /billets"
    error_id: ERR_INSUFFICIENT_BOARD_FEET
    http_status: 409

  - priority: 82
    rule: "rework ceiling: BuildOrder.rework_round_count must be < MAX_REWORK_ROUNDS (3) before a new SetupInspection round may be opened"
    category: constraint
    applies_to: "POST /build-orders/{build_order_id}/setup-inspections"
    error_id: ERR_MAX_REWORK_EXCEEDED
    http_status: 409

  - priority: 85
    rule: "deposit fiscal thresholds: at confirm, deposit_cents >= round_half_up(provisional_quote_total_cents * MIN_DEPOSIT_BP / 10000); at export release, deposit_applied_cents >= round_half_up(binding_quote_total_cents * MIN_SETTLE_BP / 10000)"
    category: business_fiscal
    applies_to: "POST /build-orders/{build_order_id}/confirm, POST /export-shipments/{shipment_id}/release"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    note: "The lowest-priority rule in the ladder — money is the last thing checked, which is what makes PRIORITY PAIR P2 observable."

  - priority: 88
    rule: "single-assignment guards: a BuildOrder that already has a serial_number cannot be serialized again; a selector with an empty eligible pool returns its own error rather than an empty payload"
    category: constraint
    applies_to: "POST /build-orders/{build_order_id}/assign-serial, GET /stations/{station_id}/next-build-order"
    error_id: "ERR_SERIAL_ALREADY_ASSIGNED (409) / ERR_NO_ELIGIBLE_BUILD_ORDER (409)"
    http_status: 409

# =============================================================================
# §1.5 Endpoints — 84 entries. `roles` is the allowed-role set enforced by the
# §1.4 priority-20 check. `input` lists body fields for POST and query-string
# fields for GET; a trailing `?` marks the field optional. Path parameters are
# never repeated in `input`. Every response is wrapped in the §1.0 envelope.
# api_prefix is "/", so every path below is already the full path.
# =============================================================================
endpoints:

  # --- logical clock ---------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    roles: &all_roles [PlantAdmin, WoodBuyer, ComplianceOfficer, Machinist, Luthier, QualityInspector, FinishTech, CustomShopCoordinator, ServiceNetworkManager, AuthorizedShop]
    input: [current_utc]
    output: { current_utc: string }
    status: 200
    description: "Test-driving endpoint. Sets the server's logical clock, which every cure window, reservation window, coverage window and priority score reads. Defaults to 2026-08-01T00:00:00Z before the first call. Purely mechanical: it triggers no state machine."

  # --- StorageRoom -----------------------------------------------------------
  - method: POST
    path: "/storage-rooms"
    roles: [PlantAdmin]
    input: [room_code, room_type, target_rh_pct, target_temp_c, capacity_slots, "rh_tolerance_pct?"]
    output: StorageRoom
    status: 201
    description: "Register a climate-controlled space. climate_status starts IN_SPEC, occupied_slots 0, latest_rh_pct/latest_temp_c null."
  - method: GET
    path: "/storage-rooms/{room_id}"
    roles: &staff_roles [PlantAdmin, WoodBuyer, ComplianceOfficer, Machinist, Luthier, QualityInspector, FinishTech, CustomShopCoordinator, ServiceNetworkManager]
    input: []
    output: StorageRoom
    status: 200
    description: "Read one room, including its live climate posture."
  - method: GET
    path: "/storage-rooms"
    roles: *staff_roles
    input: ["room_type?", "climate_status?", "limit?", "offset?"]
    output: StorageRoom[]
    status: 200
    description: "List rooms, ordered room_code ASC."
  - method: POST
    path: "/storage-rooms/{room_id}/climate-readings"
    roles: [PlantAdmin, FinishTech]
    input: [rh_pct, temp_c]
    output: StorageRoom
    status: 200
    description: "Log a hygrometer sample. Updates latest_rh_pct/latest_temp_c and drives the room's climate_status state machine — the root of the depth-4 climate cascade."
  - method: POST
    path: "/storage-rooms/{room_id}/certify"
    roles: [PlantAdmin, QualityInspector]
    input: []
    output: StorageRoom
    status: 200
    description: "Certify a QUARANTINED room back to IN_SPEC after recalibration, closing the climate cycle."

  # --- TonewoodLot -----------------------------------------------------------
  - method: POST
    path: "/tonewood-lots"
    roles: [WoodBuyer]
    input: [lot_code, species_code, cites_appendix, board_feet_received, moisture_content_pct, storage_room_id, "permit_number?"]
    output: TonewoodLot
    status: 201
    description: "Receive a lot of tonewood. Forks on cites_appendix: NONE -> RECEIVED with permit_status NOT_REQUIRED, otherwise PERMIT_HOLD with permit_status PENDING. moisture_at_receipt_pct is stamped from moisture_content_pct and never moves again."
  - method: GET
    path: "/tonewood-lots/{lot_id}"
    roles: *staff_roles
    input: []
    output: TonewoodLot
    status: 200
    description: "Read one lot, including all six board-feet buckets and both yield figures."
  - method: GET
    path: "/tonewood-lots"
    roles: *staff_roles
    input: ["storage_room_id?", "species_code?", "cites_appendix?", "permit_status?", "status?", "limit?", "offset?"]
    output: TonewoodLot[]
    status: 200
    description: "List lots, ordered lot_code ASC. storage_room_id is the reverse-reachability filter for TonewoodLot.storage_room_id."
  - method: POST
    path: "/tonewood-lots/{lot_id}/attest-permit"
    roles: [ComplianceOfficer]
    input: [permit_number]
    output: TonewoodLot
    status: 200
    description: "Attest a CITES permit, moving PERMIT_HOLD -> RECEIVED and stamping attested_by_user_id, which the export release segregation-of-duties check later reads."
  - method: POST
    path: "/tonewood-lots/{lot_id}/reject"
    roles: [ComplianceOfficer]
    input: [reason]
    output: TonewoodLot
    status: 200
    description: "Reject a lot on documentation grounds. Root of the second depth-4 cascade: Billets -> QUARANTINED, Components -> QC_HELD/PROTECTED_SPECIES, BuildOrders -> COMPLIANCE_HOLD."
  - method: POST
    path: "/tonewood-lots/{lot_id}/moisture-readings"
    roles: [WoodBuyer, PlantAdmin]
    input: [moisture_content_pct]
    output: TonewoodLot
    status: 200
    description: "Log a moisture meter reading. Moves RECEIVED -> KILN_DRYING or self-loops on KILN_DRYING, and recomputes the ACTUAL_YIELD variant."
  - method: POST
    path: "/tonewood-lots/{lot_id}/condition"
    roles: [WoodBuyer]
    input: []
    output: TonewoodLot
    status: 200
    description: "Declare the lot acclimatised. Enforces the inclusive 6.0-8.0 moisture band and the TonewoodLot -> StorageRoom climate guard."
  - method: POST
    path: "/tonewood-lots/{lot_id}/release"
    roles: [WoodBuyer]
    input: []
    output: TonewoodLot
    status: 200
    description: "Release the lot for cutting. Requires permit_status IN {NOT_REQUIRED, VERIFIED}. POST /billets accepts a lot_id only from RELEASED."

  # --- Billet ----------------------------------------------------------------
  - method: POST
    path: "/billets"
    roles: [Machinist]
    input: [billet_code, lot_id, board_feet, grade, expected_tonewood_lot_version, "parent_billet_id?"]
    output: Billet
    status: 201
    description: "Saw a billet from a RELEASED lot. OCC-guarded on the lot's version (§1.2.1 billet-cut-stale-tonewood-lot). Draws board_feet + computed kerf from board_feet_available and can drive the lot to DEPLETED."
  - method: GET
    path: "/billets/{billet_id}"
    roles: *staff_roles
    input: []
    output: Billet
    status: 200
    description: "Read one billet."
  - method: GET
    path: "/billets"
    roles: *staff_roles
    input: ["lot_id?", "parent_billet_id?", "grade?", "status?", "limit?", "offset?"]
    output: Billet[]
    status: 200
    description: "List billets, ordered billet_code ASC. lot_id and parent_billet_id are the reverse-reachability filters for Billet.lot_id and the self-referential Billet.parent_billet_id."

  # --- ComponentSpec (immutable reference data) -------------------------------
  - method: POST
    path: "/component-specs"
    roles: [PlantAdmin]
    input: [spec_code, component_type, required_species_codes, min_grade, nominal_board_feet, target_thickness_mm, cnc_minutes, hand_shape_minutes, "thickness_tolerance_mm?", "required_room_type?"]
    output: ComponentSpec
    status: 201
    description: "Publish an engineering spec. Immutable (common_fields false): no version, no update endpoint, no state machine."
  - method: GET
    path: "/component-specs/{spec_id}"
    roles: *staff_roles
    input: []
    output: ComponentSpec
    status: 200
    description: "Read one spec."
  - method: GET
    path: "/component-specs"
    roles: *staff_roles
    input: ["component_type?", "min_grade?", "limit?", "offset?"]
    output: ComponentSpec[]
    status: 200
    description: "List specs, ordered spec_code ASC."

  # --- Component -------------------------------------------------------------
  - method: POST
    path: "/components"
    roles: [Machinist]
    input: [spec_id, billet_id, "build_order_id?"]
    output: Component
    status: 201
    description: "Open a part against a spec and a billet. Moves the Billet AVAILABLE -> RESERVED (forward half of the board-feet invariant) and enforces species / grade compatibility."
  - method: GET
    path: "/components/{component_id}"
    roles: *staff_roles
    input: []
    output: Component
    status: 200
    description: "Read one component."
  - method: GET
    path: "/components"
    roles: *staff_roles
    input: ["spec_id?", "billet_id?", "build_order_id?", "status?", "qc_hold_reason?", "limit?", "offset?"]
    output: Component[]
    status: 200
    description: "List components, ordered created_at ASC. spec_id, billet_id and build_order_id are the reverse-reachability filters for the three Component FKs."
  - method: POST
    path: "/components/{component_id}/route"
    roles: [Machinist]
    input: [station_reservation_id, measured_thickness_mm]
    output: Component
    status: 200
    description: "Run the part on a CNC router against a HELD reservation. Consumes the reservation, moves the Station minute buckets, and is gated on the room's climate posture."
  - method: POST
    path: "/components/{component_id}/hand-shape"
    roles: [Luthier]
    input: [station_reservation_id, measured_thickness_mm]
    output: Component
    status: 200
    description: "Hand-shape the part at a HAND_SHAPING station against a HELD reservation."
  - method: POST
    path: "/components/{component_id}/qc"
    roles: [QualityInspector]
    input: [verdict, "hold_reason?"]
    output: Component
    status: 200
    description: "Dimensional QC. verdict ACCEPT enforces the inclusive thickness tolerance; verdict HOLD parks the part with a hold reason."
  - method: POST
    path: "/components/{component_id}/disposition"
    roles: [Luthier, QualityInspector]
    input: [disposition]
    output: Component
    status: 200
    description: "Dispose of a held part: REWORK returns it to the machining loop (Luthier, capped by MAX_COMPONENT_REWORKS (2), refused for a PROTECTED_SPECIES hold), SCRAP destroys it and its billet (QualityInspector)."

  # --- Station ---------------------------------------------------------------
  - method: POST
    path: "/stations"
    roles: [PlantAdmin]
    input: [station_code, station_type, room_id, "changeover_minutes?"]
    output: Station
    status: 201
    description: "Commission a station in a room. All three minute buckets start at 0."
  - method: GET
    path: "/stations/{station_id}"
    roles: *staff_roles
    input: []
    output: Station
    status: 200
    description: "Read one station, including its minute ledger."
  - method: GET
    path: "/stations"
    roles: *staff_roles
    input: ["room_id?", "station_type?", "limit?", "offset?"]
    output: Station[]
    status: 200
    description: "List stations, ordered station_code ASC. room_id is the reverse-reachability filter for Station.room_id."
  - method: GET
    path: "/stations/{station_id}/next-build-order"
    roles: [Machinist, Luthier, PlantAdmin]
    input: []
    output: { build_order_id: string, order_code: string, priority_score: number, starts_at: string, eligible_count: integer }
    status: 200
    description: "Selector policy read: rank the eligible BuildOrders holding reservations on this station by priority_score DESC, tie-break earliest reservation starts_at ASC then BuildOrder created_at ASC. An empty eligible pool returns ERR_NO_ELIGIBLE_BUILD_ORDER (409), never an empty payload."

  # --- StationReservation ----------------------------------------------------
  - method: POST
    path: "/station-reservations"
    roles: [Machinist, Luthier]
    input: [station_id, starts_at, ends_at, "build_order_id?", "component_id?"]
    output: StationReservation
    status: 201
    description: "Book a half-open [starts_at, ends_at) window on a capacity-1 station, widened on both sides by Station.changeover_minutes. duration_minutes is computed from the window; the changeover buffer is never billed into it."
  - method: GET
    path: "/station-reservations/{reservation_id}"
    roles: *staff_roles
    input: []
    output: StationReservation
    status: 200
    description: "Read one reservation."
  - method: GET
    path: "/station-reservations"
    roles: *staff_roles
    input: ["station_id?", "build_order_id?", "component_id?", "status?", "limit?", "offset?"]
    output: StationReservation[]
    status: 200
    description: "List reservations, ordered starts_at ASC then created_at ASC. station_id, build_order_id and component_id are the reverse-reachability filters for the three StationReservation FKs."
  - method: POST
    path: "/station-reservations/{reservation_id}/release"
    roles: [Machinist, Luthier, PlantAdmin]
    input: []
    output: StationReservation
    status: 200
    description: "Give the window back. Compensating movement in the station minute ledger: held_minutes -> released_minutes."

  # --- OptionCatalog (immutable reference data) -------------------------------
  - method: POST
    path: "/option-catalog"
    roles: [PlantAdmin, CustomShopCoordinator]
    input: [option_code, option_group, upcharge_cents, complexity_class, lead_time_days, "incompatible_option_codes?", "requires_finish_system?"]
    output: OptionCatalog
    status: 201
    description: "Publish a custom-shop option. Immutable (common_fields false). upcharge_cents read live by the PROVISIONAL quote variant and frozen onto the selection by lock-options."
  - method: GET
    path: "/option-catalog/{option_id}"
    roles: *staff_roles
    input: []
    output: OptionCatalog
    status: 200
    description: "Read one catalog row."
  - method: GET
    path: "/option-catalog"
    roles: *staff_roles
    input: ["option_group?", "complexity_class?", "limit?", "offset?"]
    output: OptionCatalog[]
    status: 200
    description: "List catalog rows, ordered option_code ASC."

  # --- BuildOrder ------------------------------------------------------------
  - method: POST
    path: "/build-orders"
    roles: [CustomShopCoordinator]
    input: [order_code, model_code, base_price_cents, promised_date, "is_custom_shop?", "artist_tier?", "finish_system?"]
    output: BuildOrder
    status: 201
    description: "Open an instrument order. build_stage starts DRAFT and commercial_status starts QUOTED — two independent state dimensions. provisional_quote_total_cents and priority_score are computed immediately over an empty option set."
  - method: GET
    path: "/build-orders/{build_order_id}"
    roles: *staff_roles
    input: []
    output: BuildOrder
    status: 200
    description: "Read one order, including both state dimensions, both quote totals, all five deposit buckets and the current version (the value an OCC-guarded child create must echo back)."
  - method: GET
    path: "/build-orders"
    roles: *staff_roles
    input: ["build_stage?", "commercial_status?", "model_code?", "artist_tier?", "is_custom_shop?", "limit?", "offset?"]
    output: BuildOrder[]
    status: 200
    description: "List orders, ordered priority_score DESC then created_at ASC."
  - method: POST
    path: "/build-orders/{build_order_id}/option-selections"
    roles: [CustomShopCoordinator]
    input: [option_id, expected_build_order_version, "quantity?", "build_order_id?"]
    output: OptionSelection
    status: 201
    description: "Configure an option. OCC-guarded on the order's version (§1.2.1 option-selection-create-stale-build-order). Enforces the incompatibility set and requires_finish_system, and recomputes the PROVISIONAL quote."
  - method: POST
    path: "/build-orders/{build_order_id}/confirm"
    roles: [CustomShopCoordinator]
    input: [deposit_cents]
    output: BuildOrder
    status: 200
    description: "Take the customer's deposit. Enforces MIN_DEPOSIT_BP against the PROVISIONAL total and moves commercial_status QUOTED -> CONFIRMED while build_stage stays DRAFT."
  - method: POST
    path: "/build-orders/{build_order_id}/lock-options"
    roles: [CustomShopCoordinator]
    input: []
    output: BuildOrder
    status: 200
    description: "Freeze the configuration: SELECTED -> LOCKED with locked_upcharge_cents stamped, PENDING_APPROVAL -> REJECTED, binding_quote_total_cents computed by the BINDING variant, promised_date extended by the longest locked lead time."
  - method: POST
    path: "/build-orders/{build_order_id}/release-components"
    roles: [Machinist]
    input: []
    output: BuildOrder
    status: 200
    description: "Open the order to the machine shop (build_stage DRAFT -> COMPONENTS_RELEASED). Requires commercial_status OPTIONS_LOCKED, which is what makes the two dimensions interlock."
  - method: POST
    path: "/build-orders/{build_order_id}/start-assembly"
    roles: [Luthier]
    input: []
    output: BuildOrder
    status: 200
    description: "Glue up the instrument. Requires at least MIN_ACCEPTED_COMPONENTS accepted parts and zero parts still in flight; installs every accepted part, consumes their billets, and recomputes the protected-species requirement."
  - method: POST
    path: "/build-orders/{build_order_id}/fretwork"
    roles: [Luthier]
    input: []
    output: BuildOrder
    status: 200
    description: "Record fret levelling, crowning and polishing (FINISH_CURED -> FRETWORK)."
  - method: POST
    path: "/build-orders/{build_order_id}/setup"
    roles: [Luthier]
    input: []
    output: BuildOrder
    status: 200
    description: "Move the instrument to the setup bench (FRETWORK -> SETUP)."
  - method: POST
    path: "/build-orders/{build_order_id}/setup-inspections"
    roles: [Luthier]
    input: []
    output: SetupInspection
    status: 201
    description: "Open a playability inspection round. round_number auto-increments, performed_by_user_id is stamped from X-User-ID, and the order moves SETUP -> INSPECTION. Refused once rework_round_count reaches MAX_REWORK_ROUNDS."
  - method: POST
    path: "/build-orders/{build_order_id}/assign-serial"
    roles: [CustomShopCoordinator]
    input: []
    output: BuildOrder
    status: 200
    description: "Mint the serial number. Requires the highest-round_number SetupInspection to be SIGNED with verdict PASS, applies the deposit against the binding total, and moves commercial_status to INVOICED."
  - method: POST
    path: "/build-orders/{build_order_id}/clear-compliance-hold"
    roles: [ComplianceOfficer]
    input: []
    output: BuildOrder
    status: 200
    description: "Lift a protected-species hold once no component is still flagged PROTECTED_SPECIES, restoring stage_before_compliance_hold."
  - method: POST
    path: "/build-orders/{build_order_id}/cancel"
    roles: [CustomShopCoordinator]
    input: ["reason?"]
    output: BuildOrder
    status: 200
    description: "Cancel the order. Scraps in-flight components while RECOVERING their billets to AVAILABLE, releases held reservations, and settles the deposit into forfeited/refunded — the compensating half of both conservation invariants."

  # --- OptionSelection -------------------------------------------------------
  - method: GET
    path: "/option-selections/{selection_id}"
    roles: *staff_roles
    input: []
    output: OptionSelection
    status: 200
    description: "Read one selection, including line_total_cents and (once locked) locked_upcharge_cents."
  - method: GET
    path: "/option-selections"
    roles: *staff_roles
    input: ["build_order_id?", "option_id?", "status?", "limit?", "offset?"]
    output: OptionSelection[]
    status: 200
    description: "List selections, ordered by the referenced option_code ASC then created_at ASC — the exact iteration order the quote calculation uses. build_order_id and option_id are the reverse-reachability filters for the two OptionSelection FKs."
  - method: POST
    path: "/option-selections/{selection_id}/approve"
    roles: [CustomShopCoordinator]
    input: []
    output: OptionSelection
    status: 200
    description: "Approve a pending option (PENDING_APPROVAL -> SELECTED). Segregation of duties: the approver's X-User-ID must differ from the creator's."
  - method: POST
    path: "/option-selections/{selection_id}/reject"
    roles: [CustomShopCoordinator]
    input: ["reason?"]
    output: OptionSelection
    status: 200
    description: "Reject an option, dropping it from both quote variants."

  # --- FinishRun -------------------------------------------------------------
  - method: POST
    path: "/finish-runs"
    roles: [FinishTech]
    input: [build_order_id, booth_id, finish_system, coat_count, expected_build_order_version]
    output: FinishRun
    status: 201
    description: "Book a booth and start spraying. OCC-guarded on the order's version (§1.2.1 finish-run-create-stale-build-order). Projects the closed [booth_hold_from, booth_hold_until] hold from the coat schedule alone, enforces booth chemical compatibility then aggregate capacity, and moves build_stage IN_ASSEMBLY -> IN_FINISH."
  - method: GET
    path: "/finish-runs/{finish_run_id}"
    roles: *staff_roles
    input: []
    output: FinishRun
    status: 200
    description: "Read one finish run, including cure_hours, cure_ready_at and the booth hold window."
  - method: GET
    path: "/finish-runs"
    roles: *staff_roles
    input: ["build_order_id?", "booth_id?", "finish_system?", "status?", "limit?", "offset?"]
    output: FinishRun[]
    status: 200
    description: "List finish runs, ordered booth_hold_from ASC then created_at ASC. build_order_id and booth_id are the reverse-reachability filters for the two FinishRun FKs."
  - method: POST
    path: "/finish-runs/{finish_run_id}/complete-spray"
    roles: [FinishTech]
    input: []
    output: FinishRun
    status: 200
    description: "Close the spray booth door. Samples the booth's latest_rh_pct and latest_temp_c AT THIS INSTANT and pins cure_hours and cure_ready_at from them; a later climate change never re-derives cure_hours."
  - method: POST
    path: "/finish-runs/{finish_run_id}/resume-cure"
    roles: [FinishTech]
    input: []
    output: FinishRun
    status: 200
    description: "Restart a suspended cure once the booth is back IN_SPEC. Banks the lost minutes into cure_suspended_minutes and pushes cure_ready_at out by exactly that much, leaving cure_hours untouched."
  - method: POST
    path: "/finish-runs/{finish_run_id}/buff"
    roles: [FinishTech]
    input: []
    output: FinishRun
    status: 200
    description: "Move the body to the buffing wheel. Requires current_utc >= cure_ready_at, bound INCLUSIVE."
  - method: POST
    path: "/finish-runs/{finish_run_id}/complete"
    roles: [FinishTech]
    input: []
    output: FinishRun
    status: 200
    description: "Finish the run, free the booth slot, and move build_stage IN_FINISH -> FINISH_CURED."
  - method: POST
    path: "/finish-runs/{finish_run_id}/reject"
    roles: [QualityInspector]
    input: ["reason?"]
    output: FinishRun
    status: 200
    description: "Condemn the finish. Frees the booth slot, increments refinish_count and sends the order back to IN_ASSEMBLY so a replacement run can be booked."

  # --- SetupInspection -------------------------------------------------------
  - method: GET
    path: "/setup-inspections/{inspection_id}"
    roles: *staff_roles
    input: []
    output: SetupInspection
    status: 200
    description: "Read one inspection round, including deviation_score and verdict."
  - method: GET
    path: "/setup-inspections"
    roles: *staff_roles
    input: ["build_order_id?", "status?", "verdict?", "limit?", "offset?"]
    output: SetupInspection[]
    status: 200
    description: "List inspection rounds, ordered round_number ASC. build_order_id is the reverse-reachability filter for SetupInspection.build_order_id."
  - method: POST
    path: "/setup-inspections/{inspection_id}/measure"
    roles: [Luthier]
    input: [action_mm_treble, action_mm_bass, relief_mm, intonation_cents_max]
    output: SetupInspection
    status: 200
    description: "Record the four playability measurements and compute deviation_score. Only the luthier who opened the round may submit its numbers."
  - method: POST
    path: "/setup-inspections/{inspection_id}/sign"
    roles: [QualityInspector]
    input: []
    output: SetupInspection
    status: 200
    description: "Sign the round off. Segregation of duties against performed_by_user_id. deviation_score <= PASS_SCORE_MAX signs PASS; anything higher fails and roots the depth-3 rework cascade."

  # --- RepairShop ------------------------------------------------------------
  - method: POST
    path: "/repair-shops"
    roles: [ServiceNetworkManager]
    input: [shop_code, shop_name, country_code]
    output: RepairShop
    status: 201
    description: "Take a repair shop's application. status starts APPLIED with authorization_level NONE."
  - method: GET
    path: "/repair-shops/{shop_id}"
    roles: *all_roles
    input: []
    output: RepairShop
    status: 200
    description: "Read one shop. An AuthorizedShop caller may only read its own row (X-User-ID must equal {shop_id})."
  - method: GET
    path: "/repair-shops"
    roles: *staff_roles
    input: ["country_code?", "status?", "authorization_level?", "limit?", "offset?"]
    output: RepairShop[]
    status: 200
    description: "List shops, ordered shop_code ASC."
  - method: POST
    path: "/repair-shops/{shop_id}/authorize"
    roles: [ServiceNetworkManager]
    input: [authorization_level]
    output: RepairShop
    status: 200
    description: "Authorize or reinstate a shop, closing the AUTHORIZED <-> SUSPENDED cycle."
  - method: POST
    path: "/repair-shops/{shop_id}/suspend"
    roles: [ServiceNetworkManager]
    input: ["reason?"]
    output: RepairShop
    status: 200
    description: "Suspend a shop. Existing registrations stay ACTIVE; new ones are refused."

  # --- WarrantyRegistration --------------------------------------------------
  - method: POST
    path: "/warranty-registrations"
    roles: [ServiceNetworkManager, AuthorizedShop]
    input: [build_order_id, registering_shop_id, serial_number, owner_email, purchase_date]
    output: WarrantyRegistration
    status: 201
    description: "Register an instrument's warranty. Requires the shop to be AUTHORIZED and the submitted serial_number to match the order's minted serial. An AuthorizedShop caller must supply its own id as registering_shop_id."
  - method: GET
    path: "/warranty-registrations/{registration_id}"
    roles: *all_roles
    input: []
    output: WarrantyRegistration
    status: 200
    description: "Read one registration, including coverage_months and coverage_ends_at."
  - method: GET
    path: "/warranty-registrations"
    roles: *all_roles
    input: ["build_order_id?", "registering_shop_id?", "status?", "limit?", "offset?"]
    output: WarrantyRegistration[]
    status: 200
    description: "List registrations, ordered created_at ASC. build_order_id and registering_shop_id are the reverse-reachability filters for the two WarrantyRegistration FKs. An AuthorizedShop caller must pass its own id as registering_shop_id."
  - method: POST
    path: "/warranty-registrations/{registration_id}/void"
    roles: [ServiceNetworkManager]
    input: ["reason?"]
    output: WarrantyRegistration
    status: 200
    description: "Void a registration, decrementing the shop's warranty_claim_count."

  # --- ExportShipment --------------------------------------------------------
  - method: POST
    path: "/export-shipments"
    roles: [ComplianceOfficer]
    input: [build_order_id, destination_country_code]
    output: ExportShipment
    status: 201
    description: "Open an export file. Copies cites_permit_required and required_cites_appendix from the order and computes doc_fee_cents, insurance_cents and declared_value_cents from the BINDING total in the pinned five-step order."
  - method: GET
    path: "/export-shipments/{shipment_id}"
    roles: *staff_roles
    input: []
    output: ExportShipment
    status: 200
    description: "Read one shipment, including the three money figures."
  - method: GET
    path: "/export-shipments"
    roles: *staff_roles
    input: ["build_order_id?", "destination_country_code?", "status?", "cites_permit_required?", "limit?", "offset?"]
    output: ExportShipment[]
    status: 200
    description: "List shipments, ordered created_at ASC. build_order_id is the reverse-reachability filter for ExportShipment.build_order_id."
  - method: POST
    path: "/export-shipments/{shipment_id}/attach-docs"
    roles: [ComplianceOfficer]
    input: ["cites_permit_number?"]
    output: ExportShipment
    status: 200
    description: "Attach the paperwork. A permit number is required only when cites_permit_required is true; the empty-CITES-set case accepts an empty body. Re-derives the declared value from the order's current requirement."
  - method: POST
    path: "/export-shipments/{shipment_id}/reject-docs"
    roles: [ComplianceOfficer]
    input: [reason]
    output: ExportShipment
    status: 200
    description: "Send the paperwork back, opening the DOCS_ATTACHED -> DOCS_REJECTED -> DOCS_ATTACHED negotiation cycle."
  - method: POST
    path: "/export-shipments/{shipment_id}/release"
    roles: [ComplianceOfficer]
    input: []
    output: ExportShipment
    status: 200
    description: "Clear the instrument for export. Enforces, in ladder order, the SERIALIZED build stage, every contributing lot VERIFIED and RELEASED, segregation of duties against every attesting officer, and only then the MIN_SETTLE_BP deposit threshold. Closes the order commercially."
  - method: POST
    path: "/export-shipments/{shipment_id}/depart"
    roles: [ComplianceOfficer]
    input: []
    output: ExportShipment
    status: 200
    description: "Record physical departure. Terminal."

# =============================================================================
# §1.6 Error Catalog — every code below is reachable from at least one §1.5
# endpoint. `error_id` is the stable machine-readable token returned in the
# §1.0 envelope; `message` is human prose and is never asserted on.
# =============================================================================
errors:

  # --- authentication and authorization --------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    when: "X-User-Role missing or not one of the ten declared roles, or X-User-ID missing/empty"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    category: authz
    when: "the caller's role is not in the endpoint's `roles` set"
  - error_id: ERR_SHOP_IDENTITY_MISMATCH
    http_status: 403
    category: authz
    when: "an AuthorizedShop caller names a RepairShop other than the one its X-User-ID identifies"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: authz
    when: "the reviewer's X-User-ID equals the X-User-ID that performed the reviewed step (sign vs measure, export release vs permit attestation, option approve vs option create)"
  - error_id: ERR_MEASUREMENT_OWNER_MISMATCH
    http_status: 403
    category: authz
    when: "POST /setup-inspections/{inspection_id}/measure by a luthier other than the one who opened the round"

  # --- schema --------------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: schema
    when: "missing required field, wrong type, enum value outside the declared set, limit outside 1..100, negative offset, malformed timestamp, non-positive board_feet / duration / quantity / coat_count"
  - error_id: ERR_INVALID_WINDOW
    http_status: 422
    category: schema
    when: "starts_at is not strictly before ends_at"

  # --- not found (one per entity) --------------------------------------------
  - error_id: ERR_STORAGE_ROOM_NOT_FOUND
    http_status: 404
    category: referential
    when: "{room_id} path parameter, or a storage_room_id / room_id / booth_id body field, names no StorageRoom"
  - error_id: ERR_TONEWOOD_LOT_NOT_FOUND
    http_status: 404
    category: referential
    when: "{lot_id} path parameter or a lot_id body field names no TonewoodLot"
  - error_id: ERR_BILLET_NOT_FOUND
    http_status: 404
    category: referential
    when: "{billet_id} path parameter or a billet_id / parent_billet_id body field names no Billet"
  - error_id: ERR_COMPONENT_SPEC_NOT_FOUND
    http_status: 404
    category: referential
    when: "{spec_id} path parameter or a spec_id body field names no ComponentSpec"
  - error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    category: referential
    when: "{component_id} path parameter or a component_id body field names no Component"
  - error_id: ERR_STATION_NOT_FOUND
    http_status: 404
    category: referential
    when: "{station_id} path parameter or a station_id body field names no Station"
  - error_id: ERR_STATION_RESERVATION_NOT_FOUND
    http_status: 404
    category: referential
    when: "{reservation_id} path parameter or a station_reservation_id body field names no StationReservation"
  - error_id: ERR_OPTION_CATALOG_NOT_FOUND
    http_status: 404
    category: referential
    when: "{option_id} path parameter or an option_id body field names no OptionCatalog row"
  - error_id: ERR_BUILD_ORDER_NOT_FOUND
    http_status: 404
    category: referential
    when: "{build_order_id} path parameter or a build_order_id body field names no BuildOrder"
  - error_id: ERR_OPTION_SELECTION_NOT_FOUND
    http_status: 404
    category: referential
    when: "{selection_id} path parameter names no OptionSelection"
  - error_id: ERR_FINISH_RUN_NOT_FOUND
    http_status: 404
    category: referential
    when: "{finish_run_id} path parameter names no FinishRun"
  - error_id: ERR_SETUP_INSPECTION_NOT_FOUND
    http_status: 404
    category: referential
    when: "{inspection_id} path parameter names no SetupInspection"
  - error_id: ERR_REPAIR_SHOP_NOT_FOUND
    http_status: 404
    category: referential
    when: "{shop_id} path parameter or a registering_shop_id body field names no RepairShop"
  - error_id: ERR_WARRANTY_REGISTRATION_NOT_FOUND
    http_status: 404
    category: referential
    when: "{registration_id} path parameter names no WarrantyRegistration"
  - error_id: ERR_EXPORT_SHIPMENT_NOT_FOUND
    http_status: 404
    category: referential
    when: "{shipment_id} path parameter names no ExportShipment"

  # --- uniqueness -----------------------------------------------------------
  - error_id: ERR_DUPLICATE_CODE
    http_status: 409
    category: constraint
    when: "room_code, lot_code, billet_code, spec_code, station_code, option_code, order_code or shop_code already exists"
  - error_id: ERR_WARRANTY_ALREADY_REGISTERED
    http_status: 409
    category: constraint
    when: "an ACTIVE WarrantyRegistration already exists for that build_order_id"

  # --- state (one per state dimension) ---------------------------------------
  - error_id: ERR_ROOM_STATE_INVALID
    http_status: 409
    category: state
    when: "POST /storage-rooms/{room_id}/certify on a room that is not QUARANTINED"
  - error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    category: state
    when: "a TonewoodLot action is called from a state that has no such transition (attest-permit outside PERMIT_HOLD, condition outside {RECEIVED, KILN_DRYING}, release outside CONDITIONED, moisture-readings on a CONDITIONED/RELEASED/terminal lot, reject on a DEPLETED or REJECTED lot)"
  - error_id: ERR_BILLET_STATE_INVALID
    http_status: 409
    category: state
    when: "POST /components cites a Billet that is not AVAILABLE"
  - error_id: ERR_COMPONENT_STATE_INVALID
    http_status: 409
    category: state
    when: "route outside {ROUGH_SAWN, REWORK}, hand-shape outside CNC_ROUTED, qc outside HAND_SHAPED, disposition outside QC_HELD"
  - error_id: ERR_RESERVATION_STATE_INVALID
    http_status: 409
    category: state
    when: "route / hand-shape / release cites a StationReservation that is not HELD"
  - error_id: ERR_BUILD_STAGE_INVALID
    http_status: 409
    category: state
    when: "a build_stage action is called from a stage that has no such transition, including POST /finish-runs outside IN_ASSEMBLY and POST /export-shipments/{shipment_id}/release when the order is not SERIALIZED"
  - error_id: ERR_COMMERCIAL_STATUS_INVALID
    http_status: 409
    category: state
    when: "confirm outside QUOTED, lock-options outside CONFIRMED, release-components while commercial_status is not OPTIONS_LOCKED, cancel on an INVOICED / CLOSED / CANCELLED order"
  - error_id: ERR_OPTION_SELECTION_STATE_INVALID
    http_status: 409
    category: state
    when: "approve or reject on a selection that is already LOCKED, SELECTED or REJECTED"
  - error_id: ERR_FINISH_RUN_STATE_INVALID
    http_status: 409
    category: state
    when: "complete-spray outside SPRAYING, resume-cure outside CURE_SUSPENDED, buff outside CURING, complete outside BUFFING, reject on a COMPLETED or REJECTED run"
  - error_id: ERR_INSPECTION_STATE_INVALID
    http_status: 409
    category: state
    when: "measure outside OPEN or sign outside MEASURED"
  - error_id: ERR_SHOP_STATE_INVALID
    http_status: 409
    category: state
    when: "suspend on a shop that is not AUTHORIZED, or authorize on a shop that is already AUTHORIZED"
  - error_id: ERR_WARRANTY_STATE_INVALID
    http_status: 409
    category: state
    when: "void on a registration that is already VOID"
  - error_id: ERR_SHIPMENT_STATE_INVALID
    http_status: 409
    category: state
    when: "attach-docs outside {DOCS_PENDING, DOCS_REJECTED}, reject-docs outside DOCS_ATTACHED, release outside DOCS_ATTACHED, depart outside RELEASED"

  # --- concurrency ------------------------------------------------------------
  - error_id: ERR_STALE_VERSION
    http_status: 412
    category: concurrency
    when: "the supplied expected_build_order_version or expected_tonewood_lot_version does not equal the parent's current version"

  # --- climate safety ---------------------------------------------------------
  - error_id: ERR_ROOM_CLIMATE_OUT_OF_SPEC
    http_status: 409
    category: business_safety
    when: "the governing StorageRoom.climate_status is OUT_OF_SPEC"
  - error_id: ERR_ROOM_QUARANTINED
    http_status: 409
    category: business_safety
    when: "the governing StorageRoom.climate_status is QUARANTINED — a stricter posture that also blocks POST /stations and POST /station-reservations"

  # --- protected species compliance -------------------------------------------
  - error_id: ERR_CITES_PERMIT_MISSING
    http_status: 409
    category: business_safety
    when: "attach-docs omits cites_permit_number while ExportShipment.cites_permit_required is true"
  - error_id: ERR_CITES_PERMIT_UNVERIFIED
    http_status: 409
    category: business_safety
    when: "a contributing TonewoodLot with cites_appendix != NONE has permit_status != VERIFIED or status != RELEASED"
  - error_id: ERR_PROTECTED_SPECIES_QUARANTINED
    http_status: 409
    category: business_safety
    when: "an operation cites a Billet or Component impounded by a lot rejection (Billet QUARANTINED, or Component QC_HELD with qc_hold_reason PROTECTED_SPECIES)"
  - error_id: ERR_COMPLIANCE_HOLD_ACTIVE
    http_status: 409
    category: business_safety
    when: "a BuildOrder in build_stage COMPLIANCE_HOLD is asked to advance by anything other than clear-compliance-hold or cancel"
  - error_id: ERR_REWORK_NOT_PERMITTED
    http_status: 409
    category: business_safety
    when: "disposition REWORK on a component whose qc_hold_reason is PROTECTED_SPECIES — impounded wood may only be scrapped"

  # --- referential compatibility ----------------------------------------------
  - error_id: ERR_SPECIES_NOT_PERMITTED
    http_status: 422
    category: referential
    when: "the billet's lot species_code is not in ComponentSpec.required_species_codes"
  - error_id: ERR_GRADE_BELOW_MINIMUM
    http_status: 422
    category: referential
    when: "Billet.grade ranks below ComponentSpec.min_grade"
  - error_id: ERR_STATION_TYPE_MISMATCH
    http_status: 422
    category: referential
    when: "route cites a station whose station_type is not CNC_ROUTER, or hand-shape cites one that is not HAND_SHAPING"
  - error_id: ERR_RESERVATION_COMPONENT_MISMATCH
    http_status: 422
    category: referential
    when: "the cited StationReservation.component_id is not the component being advanced"
  - error_id: ERR_OPTION_INCOMPATIBLE
    http_status: 409
    category: referential
    when: "the requested option_code appears in the incompatible_option_codes of an option already PENDING_APPROVAL, SELECTED or LOCKED on the order, or vice versa"
  - error_id: ERR_OPTION_FINISH_MISMATCH
    http_status: 422
    category: referential
    when: "OptionCatalog.requires_finish_system is set and differs from BuildOrder.finish_system"
  - error_id: ERR_BOOTH_ROOM_TYPE_INVALID
    http_status: 422
    category: referential
    when: "POST /finish-runs cites a booth_id whose room_type is not FINISH_BOOTH"

  # --- temporal, capacity and quantitative limits ------------------------------
  - error_id: ERR_STATION_WINDOW_CONFLICT
    http_status: 409
    category: temporal
    when: "the requested half-open window, widened both sides by changeover_minutes, overlaps a HELD or CONSUMED reservation on the same station"
  - error_id: ERR_BOOTH_FINISH_INCOMPATIBLE
    http_status: 409
    category: business_safety
    when: "a non-terminal FinishRun with a different finish_system already holds an overlapping closed interval in the same booth"
  - error_id: ERR_BOOTH_CAPACITY_EXCEEDED
    http_status: 409
    category: constraint
    when: "the count of overlapping non-terminal booth holds would exceed StorageRoom.capacity_slots"
  - error_id: ERR_MOISTURE_OUT_OF_BAND
    http_status: 409
    category: business_safety
    when: "moisture_content_pct falls outside the inclusive 6.0-8.0 band at condition or release"
  - error_id: ERR_THICKNESS_OUT_OF_TOLERANCE
    http_status: 409
    category: business_safety
    when: "qc ACCEPT with abs(measured_thickness_mm - target_thickness_mm) > thickness_tolerance_mm"
  - error_id: ERR_INSUFFICIENT_BOARD_FEET
    http_status: 409
    category: constraint
    when: "board_feet plus the computed kerf exceeds TonewoodLot.board_feet_available"
  - error_id: ERR_CURE_NOT_COMPLETE
    http_status: 409
    category: constraint
    when: "buff is called while current_utc < cure_ready_at"
  - error_id: ERR_MAX_REWORK_EXCEEDED
    http_status: 409
    category: constraint
    when: "a new SetupInspection round is opened once rework_round_count has reached MAX_REWORK_ROUNDS (3), or disposition REWORK once Component.rework_count has reached MAX_COMPONENT_REWORKS (2)"
  - error_id: ERR_NO_ELIGIBLE_BUILD_ORDER
    http_status: 409
    category: constraint
    when: "GET /stations/{station_id}/next-build-order finds an empty eligible pool"

  # --- cross-entity dependencies -----------------------------------------------
  - error_id: ERR_LOT_NOT_RELEASED
    http_status: 409
    category: cross_entity
    when: "POST /billets or POST /components draws on a TonewoodLot that is not RELEASED"
  - error_id: ERR_COMPONENTS_NOT_ACCEPTED
    http_status: 409
    category: cross_entity
    when: "start-assembly finds fewer than MIN_ACCEPTED_COMPONENTS accepted parts"
  - error_id: ERR_COMPONENT_IN_FLIGHT
    http_status: 409
    category: cross_entity
    when: "start-assembly finds at least one part still in ROUGH_SAWN, CNC_ROUTED, HAND_SHAPED, QC_HELD or REWORK"
  - error_id: ERR_INSPECTION_NOT_SIGNED
    http_status: 409
    category: cross_entity
    when: "assign-serial finds the highest-round_number SetupInspection is not SIGNED with verdict PASS"
  - error_id: ERR_INSPECTION_ROUND_OPEN
    http_status: 409
    category: cross_entity
    when: "a new inspection round is opened while an OPEN or MEASURED round already exists on the order"
  - error_id: ERR_SHOP_NOT_AUTHORIZED
    http_status: 409
    category: cross_entity
    when: "POST /warranty-registrations names a RepairShop that is APPLIED or SUSPENDED"
  - error_id: ERR_SERIAL_MISMATCH
    http_status: 422
    category: cross_entity
    when: "the submitted serial_number does not equal BuildOrder.serial_number"
  - error_id: ERR_SERIAL_ALREADY_ASSIGNED
    http_status: 409
    category: constraint
    when: "assign-serial on an order that already has a serial_number"
  - error_id: ERR_OPTIONS_NOT_SELECTED
    http_status: 409
    category: cross_entity
    when: "confirm on a custom-shop order with no SELECTED option"

  # --- fiscal ------------------------------------------------------------------
  - error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    category: business_fiscal
    when: "deposit_cents falls below MIN_DEPOSIT_BP of the provisional total at confirm, or deposit_applied_cents falls below MIN_SETTLE_BP of the binding total at export release"

# =============================================================================
# §1.7 RBAC — ten roles. Nine are `opaque` (the X-User-ID is an arbitrary staff
# identifier with no row behind it, used only for segregation-of-duties
# comparisons). One is `entity_backed`: an AuthorizedShop caller's X-User-ID IS
# a RepairShop.id and is checked against the request at priority 25.
# role_model: segregation_of_duties.
# =============================================================================
roles:

  - name: PlantAdmin
    identity: opaque
    description: "Owns the physical plant: rooms, stations and engineering reference data. Cannot buy wood, cannot touch an order's commercial dimension and cannot sign off playability."
    exclusive_operations:
      - "POST /storage-rooms"
      - "POST /stations"
      - "POST /component-specs"
    shared_operations:
      - "POST /storage-rooms/{room_id}/climate-readings (with FinishTech)"
      - "POST /storage-rooms/{room_id}/certify (with QualityInspector)"
      - "POST /tonewood-lots/{lot_id}/moisture-readings (with WoodBuyer)"
      - "POST /station-reservations/{reservation_id}/release (with Machinist, Luthier)"
      - "POST /option-catalog (with CustomShopCoordinator)"
      - "GET /stations/{station_id}/next-build-order (with Machinist, Luthier)"
      - "every staff GET"

  - name: WoodBuyer
    identity: opaque
    description: "Procures and conditions tonewood. Owns the lot lifecycle up to RELEASED but has no authority over CITES paperwork — attesting a permit and rejecting a lot both belong to ComplianceOfficer."
    exclusive_operations:
      - "POST /tonewood-lots"
      - "POST /tonewood-lots/{lot_id}/condition"
      - "POST /tonewood-lots/{lot_id}/release"
    shared_operations:
      - "POST /tonewood-lots/{lot_id}/moisture-readings (with PlantAdmin)"
      - "every staff GET"

  - name: ComplianceOfficer
    identity: opaque
    description: "Owns protected-species documentation end to end: permit attestation, lot rejection, compliance-hold clearance and the entire export file. Deliberately cannot buy or release wood, so the officer who attests a permit is structurally separate from the buyer who ships against it."
    exclusive_operations:
      - "POST /tonewood-lots/{lot_id}/attest-permit"
      - "POST /tonewood-lots/{lot_id}/reject"
      - "POST /build-orders/{build_order_id}/clear-compliance-hold"
      - "POST /export-shipments"
      - "POST /export-shipments/{shipment_id}/attach-docs"
      - "POST /export-shipments/{shipment_id}/reject-docs"
      - "POST /export-shipments/{shipment_id}/release"
      - "POST /export-shipments/{shipment_id}/depart"
    shared_operations:
      - "every staff GET"

  - name: Machinist
    identity: opaque
    description: "Cuts billets and runs the CNC routers. Can open the order to the shop floor but cannot glue up, cannot inspect and cannot price."
    exclusive_operations:
      - "POST /billets"
      - "POST /components"
      - "POST /components/{component_id}/route"
      - "POST /build-orders/{build_order_id}/release-components"
    shared_operations:
      - "POST /station-reservations (with Luthier)"
      - "POST /station-reservations/{reservation_id}/release (with Luthier, PlantAdmin)"
      - "GET /stations/{station_id}/next-build-order (with Luthier, PlantAdmin)"
      - "every staff GET"

  - name: Luthier
    identity: opaque
    description: "Hand work: shaping, assembly, fretwork and setup, plus opening and measuring inspection rounds. Crucially cannot SIGN an inspection — that is the segregation-of-duties boundary with QualityInspector."
    exclusive_operations:
      - "POST /components/{component_id}/hand-shape"
      - "POST /build-orders/{build_order_id}/start-assembly"
      - "POST /build-orders/{build_order_id}/fretwork"
      - "POST /build-orders/{build_order_id}/setup"
      - "POST /build-orders/{build_order_id}/setup-inspections"
      - "POST /setup-inspections/{inspection_id}/measure"
    shared_operations:
      - "POST /components/{component_id}/disposition (with QualityInspector — Luthier may only choose REWORK)"
      - "POST /station-reservations (with Machinist)"
      - "POST /station-reservations/{reservation_id}/release (with Machinist, PlantAdmin)"
      - "GET /stations/{station_id}/next-build-order (with Machinist, PlantAdmin)"
      - "every staff GET"

  - name: QualityInspector
    identity: opaque
    description: "The independent gate. Signs inspection rounds, accepts or holds components, condemns finishes and certifies recalibrated rooms. Never performs the work it judges."
    exclusive_operations:
      - "POST /components/{component_id}/qc"
      - "POST /setup-inspections/{inspection_id}/sign"
      - "POST /finish-runs/{finish_run_id}/reject"
    shared_operations:
      - "POST /components/{component_id}/disposition (with Luthier — QualityInspector may only choose SCRAP)"
      - "POST /storage-rooms/{room_id}/certify (with PlantAdmin)"
      - "every staff GET"

  - name: FinishTech
    identity: opaque
    description: "Owns the spray booths and the cure clock. Cannot reject its own finish — condemning a finish belongs to QualityInspector."
    exclusive_operations:
      - "POST /finish-runs"
      - "POST /finish-runs/{finish_run_id}/complete-spray"
      - "POST /finish-runs/{finish_run_id}/resume-cure"
      - "POST /finish-runs/{finish_run_id}/buff"
      - "POST /finish-runs/{finish_run_id}/complete"
    shared_operations:
      - "POST /storage-rooms/{room_id}/climate-readings (with PlantAdmin)"
      - "every staff GET"

  - name: CustomShopCoordinator
    identity: opaque
    description: "The customer-facing owner of the commercial dimension: quoting, option configuration, deposits, serialization and cancellation. Cannot perform a single unit of physical work."
    exclusive_operations:
      - "POST /build-orders"
      - "POST /build-orders/{build_order_id}/option-selections"
      - "POST /build-orders/{build_order_id}/confirm"
      - "POST /build-orders/{build_order_id}/lock-options"
      - "POST /build-orders/{build_order_id}/assign-serial"
      - "POST /build-orders/{build_order_id}/cancel"
      - "POST /option-selections/{selection_id}/approve"
      - "POST /option-selections/{selection_id}/reject"
    shared_operations:
      - "POST /option-catalog (with PlantAdmin)"
      - "every staff GET"

  - name: ServiceNetworkManager
    identity: opaque
    description: "Runs the authorized repair network. Grants, suspends and reinstates authorization and can void registrations."
    exclusive_operations:
      - "POST /repair-shops"
      - "POST /repair-shops/{shop_id}/authorize"
      - "POST /repair-shops/{shop_id}/suspend"
      - "POST /warranty-registrations/{registration_id}/void"
    shared_operations:
      - "POST /warranty-registrations (with AuthorizedShop)"
      - "every staff GET"

  - name: AuthorizedShop
    identity: "entity_backed:RepairShop"
    description: "An external repair shop acting on its own behalf. Its X-User-ID IS a RepairShop.id. It may register warranties naming ITSELF and read its own row and its own registrations — nothing else. It cannot see the factory floor, the wood inventory, any build order or any other shop."
    exclusive_operations: []
    shared_operations:
      - "POST /warranty-registrations (with ServiceNetworkManager; registering_shop_id MUST equal X-User-ID, else ERR_SHOP_IDENTITY_MISMATCH)"
      - "GET /repair-shops/{shop_id} (only when {shop_id} == X-User-ID)"
      - "GET /warranty-registrations (only with registering_shop_id == X-User-ID)"
      - "GET /warranty-registrations/{registration_id} (only for its own registrations)"
    denied_operations:
      - "every /storage-rooms, /tonewood-lots, /billets, /component-specs, /components, /stations, /station-reservations, /option-catalog, /build-orders, /option-selections, /finish-runs, /setup-inspections and /export-shipments endpoint -> ERR_ROLE_NOT_PERMITTED"
      - "GET /repair-shops (the unfiltered network list)"
      - "POST /repair-shops/{shop_id}/authorize (a shop cannot authorize itself)"
