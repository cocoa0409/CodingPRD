# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Seed Dealer & Trait Licensing Program
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: program_created_in_draft_with_default_optional_tiers
        claim_type: creation_defaults
        grounds: [entities.SeedProgram, state_machines.SeedProgram]
        distinguishing_aspect: "POST /dealer/programs omitting optional prepay_tiers/volume_rebate_tiers/commission_volume_tiers yields status DRAFT, version 1, and empty arrays for the omitted tiers."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id, st: $.data.status, ver: $.data.version, vrt: $.data.volume_rebate_tiers, ppt: $.data.prepay_tiers }
          trigger: []
          assert:
            - "status == DRAFT on creation (initial state)"
            - "version == 1"
            - "volume_rebate_tiers == [] and prepay_tiers == [] (defaults applied)"

      - name: grower_computed_balance_field_input_rejected
        claim_type: computed_fields
        grounds: [entities.GrowerAccount.fields.outstanding_balance_cents, "validations[priority=5]"]
        distinguishing_aspect: "Client-supplied outstanding_balance_cents on POST /dealer/growers is an unknown input field and is rejected with ERR_INVALID_REQUEST; a clean create shows the computed default 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000, outstanding_balance_cents: 999 }
              as: SalesRep
              captures: { err: $.data.error_id }
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { bal: $.data.outstanding_balance_cents, pb: $.data.prepay_balance_cents }
          assert:
            - "first call: error_id == ERR_INVALID_REQUEST (computed field is not an accepted input)"
            - "second call: outstanding_balance_cents == 0 and prepay_balance_cents == 0 (system defaults)"

      - name: get_order_with_unknown_id_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dealer/orders/{uuid} for a non-existent id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /dealer/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: orders_list_pagination_envelope_fields
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /dealer/orders]"]
        distinguishing_aspect: "GET /dealer/orders with limit=2 over 3 orders returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns the 3rd row with has_more false."
        test_recipe:
          setup:
            - "Program OPEN; grower G with three DRAFT orders"
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o1: $.data.id }
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
          trigger:
            - call: "GET /dealer/orders"
              payload: { grower_id: "${g}", limit: 2, offset: 0 }
              as: SalesRep
            - call: "GET /dealer/orders"
              payload: { grower_id: "${g}", limit: 2, offset: 2 }
              as: SalesRep
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2: 1 row, total_count == 3, has_more == false"
            - "both pages carry meta.api_request_id and response_type == array"

      - name: field_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Field.fields.soil_type, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "soil_type GRAVEL is outside the CLAY|LOAM|SAND|SILT enum and is rejected."
        test_recipe:
          setup: ["grower G exists"]
          setup_api_calls:
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
          trigger:
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "GRAVEL", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST, http 400"

      - name: recommendation_computed_score_input_rejected
        claim_type: computed_fields
        grounds: [entities.PlacementRecommendation.fields.placement_score, "validations[priority=5]"]
        distinguishing_aspect: "placement_score is server-computed; sending it in the create body is an unknown-field rejection."
        test_recipe:
          setup: ["program OPEN; grower G; field F (version captured); variety SOY-V2"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "LOAM", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { f: $.data.id, fver: $.data.version }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /dealer/recommendations"
              payload: { field_id: "${f}", variety_id: "${v2}", program_id: "${prog}", seeding_rate_seeds_per_acre: 34000, expected_yield_index: 105, expected_field_version: "${fver}", placement_score: 99 }
              as: Agronomist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (placement_score is computed, not accepted)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_order_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SeedOrder.DRAFT_to_CONFIRMED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Second confirm on a CONFIRMED order is a no-op failure: ERR_INVALID_STATE_TRANSITION, and the locked pricing does not change."
        test_recipe:
          setup: ["program OPEN; grower; SOY-V2 @18000; lot 500; order with 10-unit line CONFIRMED at clock 2027-01-10 (600bps tier)"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { net1: $.data.net_amount_cents }
          trigger:
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION"
            - "order net_amount_cents unchanged at 169200 (10 x 16920)"

      - name: cancel_closed_order_after_settle_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.SeedOrder, state_machines.SeedProgram.SALES_CLOSED_to_SETTLED]
        distinguishing_aspect: "CLOSED is terminal for the lifecycle dimension: cancel after program settle fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["program ran to SETTLED with one CONFIRMED (never prepaid) order which the settle sweep moved to CLOSED"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/programs/${prog}/close_sales"
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-15T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/programs/${prog}/settle"
              as: DealerAdmin
          trigger:
            - call: "POST /dealer/orders/${o}/cancel"
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (CLOSED is terminal)"

      - name: new_order_starts_draft_unpaid_none
        claim_type: initial_state
        grounds: [state_machines.SeedOrder, entities.SeedOrder.fields.status]
        distinguishing_aspect: "A fresh order reports status DRAFT, payment_status UNPAID, fulfillment_status NONE, version 1."
        test_recipe:
          setup: ["program OPEN; grower G"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
          trigger:
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { st: $.data.status, pay: $.data.payment_status, ful: $.data.fulfillment_status, ver: $.data.version }
          assert:
            - "status == DRAFT, payment_status == UNPAID, fulfillment_status == NONE, version == 1"

      - name: claim_withdraw_then_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ReplantClaim.FILED_to_WITHDRAWN, state_machines.ReplantClaim.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "WITHDRAWN is terminal: approving a withdrawn claim fails with ERR_INVALID_STATE_TRANSITION even for a valid adjuster."
        test_recipe:
          setup: ["program OPEN; grower; field; order 10 units CONFIRMED and fully delivered; claim FILED by rep-1 then WITHDRAWN"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/fields"
              payload: { grower_id: "${g}", name: "North 40", acres: 100, soil_type: "LOAM", drainage: "WELL", irrigated: true, prev_crop: "SOYBEAN", maturity_zone: 11 }
              as: SalesRep
              captures: { f: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
              captures: { o: $.data.id }
            - call: "POST /dealer/orders/${o}/lines"
              payload: { variety_id: "${v2}", units: 10 }
              as: SalesRep
              captures: { ln: $.data.id }
            - call: "POST /dealer/orders/${o}/confirm"
              as: SalesRep
            - call: "POST /dealer/delivery-tickets"
              payload: { order_id: "${o}", order_line_id: "${ln}", type: "DELIVERY", scheduled_date: "2027-04-10T00:00:00Z", units: 10 }
              as: SalesRep
              captures: { t: $.data.id }
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-10T12:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/delivery-tickets/${t}/complete"
              as: SalesRep
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-02T09:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/replant-claims"
              payload: { order_id: "${o}", order_line_id: "${ln}", field_id: "${f}", event_date: "2027-05-01T00:00:00Z", event_type: "FROST", acres_affected: 10 }
              as: SalesRep
              as_user_id: "rep-1"
              captures: { c: $.data.id }
            - call: "POST /dealer/replant-claims/${c}/withdraw"
              as: SalesRep
              captures: { st_w: $.data.status }
          trigger:
            - call: "POST /dealer/replant-claims/${c}/approve"
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { err: $.data.error_id }
          assert:
            - "withdraw moved the claim to WITHDRAWN"
            - "approve on WITHDRAWN: error_id == ERR_INVALID_STATE_TRANSITION"

      - name: return_reject_then_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SeedReturn.REQUESTED_to_REJECTED, state_machines.SeedReturn.REQUESTED_to_APPROVED]
        distinguishing_aspect: "REJECTED is terminal: approving a rejected return fails; rejection before approval records the note."
        test_recipe:
          setup: ["program OPEN; grower; order 10 units CONFIRMED + delivered; return of 2 units REQUESTED then REJECTED with note"]
          setup_api_calls:
            - call: "POST /dealer/programs"
              payload: { name: "P", crop_year: 2027, early_order_tiers: [{cutoff_at: "2027-01-15T23:59:59Z", discount_bps: 600}], return_window_end: "2027-06-30T23:59:59Z", return_restocking_bps: 1000, returns_untreated_only: true, replant_claim_window_days: 21, replant_replacement_discount_bps: 10000, daily_delivery_capacity_units: 100000, delivery_window_start: "2027-03-01T00:00:00Z", delivery_window_end: "2027-05-31T23:59:59Z", sales_close_at: "2027-03-15T23:59:59Z", commission_base_bps: 500, min_plot_replications: 2 }
              as: DealerAdmin
              captures: { prog: $.data.id }
            - call: "POST /dealer/programs/${prog}/open"
              as: DealerAdmin
            - call: "POST /dealer/growers"
              payload: { account_name: "Smith Farms", external_ref: "EXT-001", credit_limit_cents: 100000000 }
              as: SalesRep
              captures: { g: $.data.id }
            - call: "POST /dealer/varieties"
              payload: { sku: "SOY-V2", crop: "SOYBEAN", relative_maturity_days: 118, base_price_cents_per_unit: 18000, seeds_per_unit: 140000, preferred_soils: ["CLAY", "LOAM"], min_drainage: "POOR" }
              as: DealerAdmin
              captures: { v2: $.data.id }
            - call: "POST /dealer/inventory-lots"
              payload: { variety_id: "${v2}", warehouse_code: "WH1", received_units: 500, expiry_date: "2027-12-31T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: DealerAdmin
            - call: "POST /dealer/orders"
              payload: { grower_id: "${g}", program_id: "${prog}" }
              as: SalesRep
