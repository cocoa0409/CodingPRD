  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: merits_hearing_gated_on_case_merits_state
        grounds:
          - state_machines.Case.CALENDAR_to_MERITS
          - state_machines.Hearing.SCHEDULED_to_COMPLETED
          - errors.ERR_HEARING_TYPE_STAGE_MISMATCH
        distinguishing_aspect: |
          Entity pair Hearing -> Case: the set of legal hearing types for a NEW
          hearing depends on the parent case's state — INDIVIDUAL_MERITS is
          rejected while the case is CALENDAR and accepted only after a completed
          master hearing flips the case to MERITS.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One PRO_SE English non-detained case docketed (CALENDAR) with no hearings yet."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-XS1", name: "Cross State Court", city: "Omaha", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Gate", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "X-1", respondent_full_name: "R Cross", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-08T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_m: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
