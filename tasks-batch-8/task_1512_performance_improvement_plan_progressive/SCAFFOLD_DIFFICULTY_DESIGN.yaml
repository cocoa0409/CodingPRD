              as: HRSystemAdmin
          trigger:
            - call: "POST /hr-org-units/${ou_id}/employees/${emp_id}/pips/${pip_id}/legal-reviews/${review_id}/submit"
              payload:
                risk_factors: ["PROTECTED_CLASS", "RECENT_LEAVE", "PRIOR_COMPLAINT"]
                recommendation: "PROCEED"
                rationale: "Multiple compounding factors but none rise to documentation-gap or whistleblower level."
              as: LegalCounsel
              as_user_id: "${counsel_id}"
          assert:
            - "LegalReview.${review_id}.risk_score == 45"
            - "Sum of three weights 20+15+10 = 45; no DOCUMENTATION_GAP so no doubling; base < 50 so no compound bonus; result not clamped"

      - name: pip_attainment_nested_rounding_mode_b
        grounds:
          - calculations.pip_attainment_ratio
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          'round_half_up to 4 dp AFTER the weighted sum', NOT 'round each
          per-goal attainment to 4 dp then weight and sum'. For targets
          3 and 7 with observed 1 and 2, per-goal attainment values are
          1/3 = 0.333333... and 2/7 = 0.285714...; the two rounding orders
          produce different 4th-decimal results.
        test_recipe:
          setup:
            - "PIP with two goals: g1 weight=50 target=3, g2 weight=50 target=7"
            - "Evidence admitted setting current_value g1=1, g2=2"
            - "Clock advanced so check-in is HELD"
