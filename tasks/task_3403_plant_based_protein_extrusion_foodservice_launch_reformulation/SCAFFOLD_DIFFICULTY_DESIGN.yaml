      - name: rto_line_run_windows_half_open
        grounds:
          - validations[priority=7]
          - errors[ERR_RUN_WINDOW_CONFLICT]
        distinguishing_aspect: "Interval semantics = half-open adjacency on the ProductionLine resource: a run starting exactly when another ends (10:00 after 08:00-10:00) is ACCEPTED, while 09:59-11:00 overlaps and is rejected with ERR_RUN_WINDOW_CONFLICT."
