  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shape
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type, and data; error responses carry response_type == error and data.error_id + data.message."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDSO }
          trigger:
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "GET /sevis/students/00000000-0000-0000-0000-000000000000", payload: {}, as: DSO, captures: { err: $.data.error_id } }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data.id present"
            - "error: response_type == error, data.error_id == ERR_STUDENT_NOT_FOUND, data.message present"

      - name: financial_documents_pagination_limit_offset
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "limit/offset paginate: 3 documents -> limit=2 returns 2 items with total_count 3 and has_more true; offset=2 returns the final item with has_more false."
        test_recipe:
          setup: ["Student with three financial documents"]
          setup_api_calls:
            - { call: "POST /sevis/students", payload: { sevis_id: "N0012345678", full_name: "Asha Rao", email: "asha@example.edu", date_of_birth: "2002-04-15", country_of_citizenship: "IN", degree_level: "UNDERGRADUATE" }, as: DSO, captures: { stu_id: $.data.id } }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "BANK_STATEMENT", amount_usd_cents: 100000, issue_date: "2026-07-01" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "SPONSOR_AFFIDAVIT", amount_usd_cents: 200000, issue_date: "2026-07-02" }, as: DSO }
            - { call: "POST /sevis/students/${stu_id}/financial-documents", payload: { document_type: "SCHOLARSHIP_LETTER", amount_usd_cents: 300000, issue_date: "2026-07-03" }, as: DSO }
          trigger:
