            - call: "POST /registry/members/${m_a}/signers"
              payload: { full_name: "Alice Signer", email: "alice@alpha.example", effective_from: "2026-01-01T00:00:00Z", role_scope: "ALL" }
              as: RegistryAdmin
            - call: "POST /registry/members/${m_a}/activate"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/loans"
              payload: { loan_amount_cents: 50000000, property_state: "TX", closing_date: "2026-01-05T00:00:00Z" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { loan: $.data.id, loan_v: $.data.version }
          trigger:
            - call: "POST /registry/transfers"
              payload: { loan_id: "${loan}", to_member_id: "${m_a}", transfer_type: "SERVICING", effective_date: "2026-01-05T00:00:00Z", idempotency_key: "k-self-1", expected_loan_version: "${loan_v}" }
              as: MemberRep
              as_user_id: "${m_a}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_SELF_TRANSFER"
            - "no transfer is created: GET /registry/transfers?loan_id=${loan} returns 0 rows"

      - name: not_rights_holder_rejected_on_transfer
        claim_type: violation_to_error
        grounds:
          - validations[priority=12]
          - errors.ERR_NOT_RIGHTS_HOLDER
        distinguishing_aspect: "A member holding neither right on the loan cannot transfer it: B (a stranger to the loan) filing a transfer gets 409 ERR_NOT_RIGHTS_HOLDER."
