              payload: { household_id: "${hh2_id}", route_id: "${r2_id}", scheduled_start_utc: "2026-08-03T14:45:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /crr/visits"
              payload: { household_id: "${hh2_id}", route_id: "${r1_id}", scheduled_start_utc: "2026-08-03T14:45:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v2_id: $.data.id }
