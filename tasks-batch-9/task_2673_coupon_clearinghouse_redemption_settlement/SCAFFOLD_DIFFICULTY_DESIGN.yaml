              payload: { items: [ { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/r3.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-VOID1", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/r4.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-VOID2", claimed_units: 1 } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { item_y1_id: "$.data[0].id", item_y2_id: "$.data[1].id" }
            - call: "POST /submission-lots/${lot_x_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /submission-lots/${lot_y_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "POST /disputes"
              payload: { lot_id: "${lot_y_id}", reason_code: "OFFER_TERMS_MISREAD", narrative: "The POS extract omitted two baskets." }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { disp_id: $.data.id }
          trigger:
            - call: "POST /disputes/${disp_id}/resolve"
              payload: { outcome: "OVERTURNED", resolution_note: "Register journal produced; both baskets confirmed." }
              as: FraudAnalyst
              as_user_id: "fa-2"
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-2"
              captures: { ret_ver: $.data.version }
            - call: "POST /retailers/${ret_id}/fraud-rescore"
              payload: { expected_retailer_version: "${ret_ver}" }
              as: FraudAnalyst
              as_user_id: "fa-2"
          assert:
            - "checkpoint 1 (after both finalizes): Submission.${sub_id}.adjudicated_face_value_cents == 200, accepted_item_face_value_cents == 100, rejected_item_face_value_cents == 100, settled_gross_face_value_cents == 100, settled_handling_fee_cents == 14"
            - "checkpoint 1: Retailer.${ret_id}.misredemption_rate == 50.00 and fraud_score == 50.00; Offer.${offer_id}.accepted_redemption_count == 2"
            - "checkpoint 2 (after the dispute is filed): Submission.${sub_id}.adjudicated_face_value_cents is still 200 and SubmissionLot.${lot_y_id}.status == DISPUTED"
            - "checkpoint 3 (after the overturn): CouponItem.${item_y1_id}.status == REINSTATED and CouponItem.${item_y2_id}.status == REINSTATED, both with reject_code == null and duplicate_of_item_id == null"
            - "checkpoint 3: SubmissionLot.${lot_y_id}.status == REINSTATED with reject_reason == null, accepted_qty == 2, rejected_qty == 0, gross_face_value_cents == 100 and handling_fee_cents == 14 — exactly what a clean finalization would have produced"
            - "checkpoint 3: Submission.${sub_id}.accepted_item_face_value_cents == 200 and rejected_item_face_value_cents == 0"
            - "the invariant: Submission.${sub_id}.adjudicated_face_value_cents == 200 at all three checkpoints, and accepted + rejected == adjudicated at each one (100 + 100 and 200 + 0)"
            - "checkpoint 3: Submission.${sub_id}.settled_gross_face_value_cents == 200 and settled_handling_fee_cents == 28 (14 + 14, each lot rounded independently)"
            - "no double counting: Offer.${offer_id}.accepted_redemption_count == 4, not 6 and not 2"
            - "after the rescore: Retailer.${ret_id}.misredemption_rate == 0.00, duplicate_rate == 0.00, counterfeit_rate == 0.00, fraud_score == 0.00, status == ACTIVE, handling_fee_tier == STANDARD — the two REINSTATED items remain in the denominator but in no numerator"
            - "Dispute.${disp_id}.status == OVERTURNED with resolved_by_user_id == fa-2 (fa-1 finalized the lot and is barred by the SoD wall)"

      - name: funding_reversal_restores_manufacturer_ledger_exactly
        grounds:
          - state_machines.ManufacturerInvoice.FUNDED_to_REVERSED
          - entities.Manufacturer.fields.funded_total_cents
          - entities.Manufacturer.fields.funding_balance_cents
          - endpoints.POST./manufacturer-invoices/{id}/reverse-funding
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          reverse-funding is the declared compensating action for fund, and the
          invariant is that the Manufacturer's ledger returns to its exact
          pre-funding numbers — funded_total_cents 0, funding_balance_cents 0 —
          while every downstream row that the funding had released is re-held:
          the statement returns to HELD with hold_reason FUNDING_SHORTFALL, its
          Submission's settlement_status returns to HELD, and the Retailer's
          unpaid_balance_cents returns to 0. The invoice does NOT return to
          ISSUED: REVERSED is terminal, so a second reversal and a re-funding are
          both refused with ERR_INVALID_STATE_TRANSITION, proving the compensation
          is one-shot and leaves no residue for a replay to double-apply.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default"
            - "submission verified 2, one lot of 2 accepted items -> statement net_payable 114, SCHEDULED with scheduled_pay_date 2026-08-31"
            - "invoice over that statement funded in full: billed_total 116, funded_amount 116, status FUNDED"
            - "the statement is deliberately NOT released, so no SettlementStatement of the invoice is PAID and the reversal guard passes"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "CONTRACT_RATE", dispute_window_days: 45 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "BOTH", payment_terms: "NET_30", base_fee_tier: "STANDARD", fraud_scoring_mode: "ROLLING_WINDOW" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 100000, purchase_requirement_units: 2, redemption_grace_days: 30, digital_enabled: false, clip_validity_days: 14 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers/${offer_id}/activate"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-S1", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /purchase-data-records"
              payload: { retailer_id: "${ret_id}", offer_id: "${offer_id}", pos_transaction_ref: "POS-S2", transaction_date: "2026-07-05", qualifying_units: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 2, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/verify-count"
              payload: { verified_count: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions/${sub_id}/lots"
              payload: { offer_id: "${offer_id}", manufacturer_id: "${mfr_id}", counted_qty: 2 }
              as: IntakeClerk
              as_user_id: "clerk-1"
              captures: { lot_id: $.data.id }
            - call: "POST /submission-lots/${lot_id}/items"
              payload: { items: [ { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/s1.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-S1", claimed_units: 1 }, { scanned_barcode: "8110380000005002261231030", image_uri: "s3://img/s2.jpg", redeemed_at: "2026-07-05", pos_transaction_ref: "POS-S2", claimed_units: 1 } ] }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submission-lots/${lot_id}/finalize"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
            - call: "GET /submissions/${sub_id}"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
              captures: { sub_ver: $.data.version }
            - call: "POST /settlement-statements"
              payload: { submission_id: "${sub_id}", expected_submission_version: "${sub_ver}", prior_chargeback_offset_cents: 0 }
              as: SettlementOfficer
              as_user_id: "so-1"
              captures: { stmt_id: $.data.id }
            - call: "POST /settlement-statements/${stmt_id}/schedule"
              payload: {}
              as: SettlementOfficer
              as_user_id: "so-1"
            - call: "POST /manufacturer-invoices"
              payload: { manufacturer_id: "${mfr_id}", billing_period_start: "2026-07-01", billing_period_end: "2026-07-31", statement_ids: ["${stmt_id}"] }
              as: SettlementOfficer
              as_user_id: "so-1"
              captures: { inv_id: $.data.id }
            - call: "POST /manufacturer-invoices/${inv_id}/fund"
              payload: { amount_cents: 116 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
          trigger:
            - call: "POST /manufacturer-invoices/${inv_id}/reverse-funding"
              payload: { reason: "Wire recalled by the issuing bank" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /manufacturer-invoices/${inv_id}/reverse-funding"
              payload: { reason: "Duplicate recall notice" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /manufacturer-invoices/${inv_id}/fund"
              payload: { amount_cents: 116 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "before the trigger: ManufacturerInvoice.${inv_id}.status == FUNDED with funded_amount_cents == 116 and funding_shortfall_cents == 0; Manufacturer.${mfr_id}.funded_total_cents == 116 and funding_balance_cents == 116; Retailer.${ret_id}.unpaid_balance_cents == 114"
            - "ledger restored exactly: after trigger call 1 Manufacturer.${mfr_id}.funded_total_cents == 0, disbursed_total_cents == 0 and funding_balance_cents == 0 — the pre-funding values"
            - "invoice compensated: ManufacturerInvoice.${inv_id}.status == REVERSED, funded_amount_cents == 0, funding_shortfall_cents == 116 (the full billed_total again), billed_total_cents still 116"
            - "downstream re-held: SettlementStatement.${stmt_id}.status == HELD with hold_reason == FUNDING_SHORTFALL, and its scheduled_pay_date is still 2026-08-31 (never recomputed)"
            - "downstream re-held: Submission.${sub_id}.settlement_status == HELD with hold_reason == FUNDING_SHORTFALL while intake_status stays CLOSED"
            - "downstream re-held: Retailer.${ret_id}.unpaid_balance_cents == 0"
            - "one-shot: trigger call 2 returns 409 ERR_INVALID_STATE_TRANSITION because REVERSED is terminal"
            - "one-shot: trigger call 3 returns 409 ERR_INVALID_STATE_TRANSITION — a REVERSED invoice cannot be re-funded, so the compensation cannot be replayed into a double credit"
            - "no drift after the two refusals: Manufacturer.${mfr_id}.funded_total_cents == 0 and ManufacturerInvoice.${inv_id}.funded_amount_cents == 0"
