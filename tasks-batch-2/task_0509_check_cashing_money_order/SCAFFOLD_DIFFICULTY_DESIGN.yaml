              as: StoreManager
              captures: { sched_id: $.data.id }
            - call: "POST /cash-drawers"
              payload: { store_code: "S14", business_date: "2026-05-01", opening_float_cents: 500000 }
              as: StoreManager
              captures: { drawer_id: $.data.id }
            - call: "POST /cash-drawers/${drawer_id}/begin-reconcile"
              payload: {}
              as: StoreManager
              as_user_id: "manager-9"
            - call: "GET /cash-drawers/${drawer_id}"
              payload: {}
              as: StoreManager
              captures: { dv: $.data.version }
            - call: "POST /cash-drawers/${drawer_id}/close"
              payload: { counted_cash_cents: 500000, expected_drawer_version: "${dv}" }
              as: StoreManager
              as_user_id: "manager-9"
          trigger:
            - call: "POST /transactions"
              payload: { customer_id: "${cust_id}", drawer_id: "${drawer_id}", txn_type: "CHECK_CASH", face_amount_cents: 100000, fee_schedule_id: "${sched_id}", maker_account_risk: "LOW" }
              as: Teller
              as_user_id: "teller-1"
          assert:
            - "response error_id == ERR_DRAWER_NOT_OPEN"
            - "response http_status == 409"

  # =========================================================================
  # RULE 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: drawer_single_occupancy_same_store_date_conflict
        grounds:
          - validations[priority=16]
          - entities.CashDrawer.fields.store_code
          - entities.CashDrawer.fields.business_date
          - errors[ERR_DRAWER_CONFLICT]
        distinguishing_aspect: |
          Interval semantics = single-occupancy point/key conflict on CashDrawer: opening a second drawer
          for (store_code S15, business_date 2026-05-01) while one is already OPEN is rejected
          (ERR_DRAWER_CONFLICT). No buffer, no aggregate capacity — exact-key equality. A DIFFERENT store
          OR a different business_date would NOT conflict.
        test_recipe:
          setup:
            - "One OPEN drawer for (store_code S15, business_date 2026-05-01)."
          setup_api_calls:
            - call: "POST /cash-drawers"
              payload: { store_code: "S15", business_date: "2026-05-01", opening_float_cents: 1000000 }
              as: StoreManager
              captures: { drawer1_id: $.data.id }
          trigger:
            - call: "POST /cash-drawers"
              payload: { store_code: "S15", business_date: "2026-05-01", opening_float_cents: 800000 }
              as: StoreManager
              as_user_id: "manager-9"
          assert:
            - "response error_id == ERR_DRAWER_CONFLICT"
            - "response http_status == 409"

      - name: velocity_rolling_window_half_open_aggregate
        grounds:
          - validations[priority=17]
          - calculations.velocity_window
          - entities.Customer.fields.limit_window_opened_at
          - entities.Customer.fields.daily_transaction_count
        distinguishing_aspect: |
          Interval semantics = half-open rolling 24h window with AGGREGATE capacity on Customer (DIFFERENT
          from the drawer's point conflict): twelve postings inside [opened_at, opened_at+24h) saturate
          DAILY_TXN_LIMIT=12; a 13th posting at the same clock (still inside the window) is rejected, but
          advancing the clock to exactly opened_at+24h rolls the window (half-open upper bound) and the
          next posting succeeds with daily_transaction_count reset to 1.
