      - name: cancel_auto_order_returns_site_toner_units_and_contract_commitment_to_zero
        grounds:
          - state_machines.ConsumableOrder.ORDERED_to_CANCELLED
          - state_machines.Device.SUPPLY_ORDERED_to_SUPPLY_LOW
          - entities.Site.fields.open_toner_units
          - entities.ServiceContract.fields.consumables_committed_cents
        distinguishing_aspect: |
          A different conserved quantity: the replenishment commitment ledger (Site.open_toner_units and
          ServiceContract.consumables_committed_cents). Cancelling the auto-raised order must return BOTH
          to their exact pre-create values (0 and 0) and must put the supply dimension back to SUPPLY_LOW -
          not SUPPLY_OK - because toner_level_pct is still 10, i.e. the device is still below
          TONER_REORDER_PCT and remains a replenishment candidate. The cartridge-page watermark is NOT part
          of the compensation: pages_since_last_cartridge must stay at 1000, since only a DELIVERED order
          resets it.
