          - endpoints["POST /manufacturer-deals/{deal_id}/close-period"]
          - entities.Member.fields.ytd_net_snapshot_cents
          - calculations.rebate_gross
        distinguishing_aspect: |
          On a PER_CASE card the BLENDED_PERIOD variant is arithmetically equal
          to MARGINAL_BATCH, so this instance isolates the OTHER three things
          close-period does: it stamps basis == BLENDED_PERIOD with a zero
          final_adjustment, it pays only the VALIDATED accrual (the merely
          ACCRUED one is left behind), and it rewrites ytd_net_snapshot_cents to
