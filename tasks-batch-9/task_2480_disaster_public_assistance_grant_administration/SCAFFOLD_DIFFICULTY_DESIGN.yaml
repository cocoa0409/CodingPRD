          setup:
            - "Logical clock at 2026-07-01T00:00:00Z."
            - "Declaration DR-4906 (TX / FLOOD) in status DECLARED, applicant ELIGIBLE, facility ELIGIBLE."
            - "Project submitted, then two full RFI rounds completed: rfi → rfi-response → rfi → rfi-response."
