scaffold_corner_design:

  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: create_festival_computes_total_days
        claim_type: Creation
        grounds:
          - entities.Festival.fields.total_days
          - endpoints
        distinguishing_aspect: "POST /festivals with start 2026-08-01 end 2026-08-03 -> 201, total_days computed == 3, posture PLANNING, current_festival_day 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /festivals"
              payload: { name: "Days F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id, td: $.data.total_days, posture: $.data.operational_posture, cd: $.data.current_festival_day }
          assert:
            - "Festival.${f_id}.total_days == 3"
            - "Festival.${f_id}.operational_posture == PLANNING"
            - "Festival.${f_id}.current_festival_day == 0"

      - name: create_ticket_computes_face_value
        claim_type: Computed Fields
        grounds:
          - entities.Ticket.fields.face_value
          - entities.Ticket.fields.status
        distinguishing_aspect: "POST /festivals/{id}/tickets VIP 2-day -> face_value 400.00 (200*2), status SOLD; client-supplied face_value would be ignored."
        test_recipe:
          setup: ["Festival F ON_SALE, total_days 3"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Face F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "VIP", day_count: 2, purchaser_email: "v@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id, fv: $.data.face_value, st: $.data.status }
          assert:
            - "Ticket.${t_id}.face_value == 400.00"
            - "Ticket.${t_id}.status == SOLD"

      - name: get_festival_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - endpoints
        distinguishing_aspect: "GET /festivals/{nonexistent-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /festivals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_ticket_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - entities.Ticket.fields.ticket_type
        distinguishing_aspect: "POST /festivals/{id}/tickets omitting ticket_type -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["Festival F ON_SALE"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Req F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/tickets"
              payload: { day_count: 2, purchaser_email: "x@x.com" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: ticket_day_count_out_of_range_returns_daycount_range
        claim_type: Type Constraints
        grounds:
          - "validations[priority=20]"
          - "errors[ERR_DAYCOUNT_RANGE]"
          - entities.Ticket.fields.day_count
        distinguishing_aspect: "POST /festivals/{id}/tickets with day_count 4 on a 3-day festival -> ERR_DAYCOUNT_RANGE 422."
        test_recipe:
          setup: ["Festival F ON_SALE, total_days 3"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Range F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 4, purchaser_email: "z@x.com" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DAYCOUNT_RANGE"
            - "response.http_status == 422"

      - name: addon_fk_not_found_for_bad_parking_lot
        claim_type: Parent Relationships
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_FK_NOT_FOUND]"
          - entities.AddOn.fields.parking_lot_id
        distinguishing_aspect: "POST /tickets/{id}/add-ons kind=PARKING with a non-existent parking_lot_id -> ERR_FK_NOT_FOUND 422."
        test_recipe:
          setup: ["Festival F ON_SALE with one ticket T; no parking lot with the supplied id"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "FK F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "fk@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t_id}/add-ons"
              payload: { kind: "PARKING", parking_lot_id: "11111111-1111-4111-8111-111111111111", expected_lot_version: "${t_id}" }
              as: BoxOffice
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FK_NOT_FOUND"
            - "response.http_status == 422"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: open_sales_from_planning_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.Festival.PLANNING_to_ON_SALE
        distinguishing_aspect: "POST /festivals/{id}/open-sales on a PLANNING festival with a zone and stage -> posture ON_SALE."
        test_recipe:
          setup: ["Festival F PLANNING with zone and stage"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "OpenS F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
              captures: { posture: $.data.operational_posture }
          assert:
            - "Festival.${f_id}.operational_posture == ON_SALE"

      - name: go_live_from_planning_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Festival.ON_SALE_to_LIVE
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /festivals/{id}/go-live while still PLANNING (not ON_SALE) -> ERR_INVALID_STATE 409; no posture change."
        test_recipe:
          setup: ["Festival F PLANNING (never opened sales)"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "BadLive F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: resolve_from_resolved_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Incident.OPEN_to_RESOLVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /incidents/{id}/resolve on an already RESOLVED incident -> ERR_INVALID_STATE 409 (RESOLVED is terminal)."
        test_recipe:
          setup: ["Festival F; incident I OPEN then RESOLVED"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Inc F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/incidents"
              payload: { incident_type: "LOST_CHILD", severity: "LOW" }
              as: GateAttendant
              captures: { i_id: $.data.id }
            - call: "POST /incidents/${i_id}/resolve"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /incidents/${i_id}/resolve"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: escalate_low_severity_incident_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Incident.OPEN_to_ESCALATED
          - entities.Incident.fields.severity
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "POST /incidents/{id}/escalate on a LOW-severity OPEN incident violates the severity IN {HIGH, CRITICAL} precondition -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["Festival F; incident I OPEN severity LOW"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Esc F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/incidents"
              payload: { incident_type: "MEDICAL", severity: "LOW" }
              as: GateAttendant
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /incidents/${i_id}/escalate"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: incident_revert_escalated_to_open
        claim_type: cyclic
        grounds:
          - state_machines.Incident.ESCALATED_to_OPEN
        distinguishing_aspect: "POST /incidents/{id}/deescalate on an ESCALATED incident returns it to OPEN (revert edge)."
        test_recipe:
          setup: ["Festival F; incident I HIGH severity, OPEN then ESCALATED"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "Deesc F", start_date: "2026-08-01", end_date: "2026-08-02" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/incidents"
              payload: { incident_type: "MEDICAL", severity: "HIGH" }
              as: GateAttendant
              captures: { i_id: $.data.id }
            - call: "POST /incidents/${i_id}/escalate"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /incidents/${i_id}/deescalate"
              payload: {}
              as: FestivalDirector
              captures: { st: $.data.status }
          assert:
            - "Incident.${i_id}.status == OPEN"

      - name: gate_exit_allowed_while_suspended
        claim_type: guarded transitions
        grounds:
          - state_machines.Wristband.INSIDE_to_OUTSIDE
          - "validations[priority=8]"
        distinguishing_aspect: "EXIT scan succeeds even while festival posture == SUSPENDED — the suspended guard blocks ENTER only; presence_status goes INSIDE -> OUTSIDE, GateEvent outcome EXITED."
        test_recipe:
          setup: ["Festival F LIVE; wristband W ACTIVE and INSIDE; festival then weather-held to SUSPENDED"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "ExitSusp F", start_date: "2026-08-01", end_date: "2026-08-02", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "ex@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-EX-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "ENTER" }
              as: GateAttendant
            - call: "POST /festivals/${f_id}/weather-hold"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/gate-scan"
              payload: { wristband_id: "${w_id}", direction: "EXIT" }
              as: GateAttendant
              captures: { outcome: $.data.outcome }
          assert:
            - "GateEvent.outcome == EXITED"
            - "Wristband.${w_id}.presence_status == OUTSIDE"

      - name: preevent_cancel_full_refund_cascade
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Festival.ON_SALE_to_CANCELLED
          - calculations.weather_prorata_refund
          - entities.AddOn.fields.status
        distinguishing_aspect: "POST /festivals/{id}/cancel from ON_SALE refunds a SOLD GA 3-day ticket at full face 240.00 (elapsed 0), marks the AddOn REFUNDED and Performance CANCELLED."
        test_recipe:
          setup: ["Festival F ON_SALE (never went live, current_festival_day 0); one SOLD GA 3-day ticket; one SOLD parking add-on; one SCHEDULED performance"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "PreCancel F", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
              captures: { s_id: $.data.id }
            - call: "POST /festivals/${f_id}/parking-lots"
              payload: { name: "Lot A", capacity: 10, price_per_pass: 25.00 }
              as: FestivalDirector
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /stages/${s_id}/performances"
              payload: { artist_name: "Echo", starts_at: "2026-08-01T18:00:00Z", ends_at: "2026-08-01T19:00:00Z" }
              as: FestivalDirector
              captures: { p_id: $.data.id }
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 3, purchaser_email: "pc@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /tickets/${t_id}/add-ons"
              payload: { kind: "PARKING", parking_lot_id: "${l_id}", expected_lot_version: "${l_v0}" }
              as: BoxOffice
              captures: { ao_id: $.data.id }
          trigger:
            - call: "POST /festivals/${f_id}/cancel"
              payload: {}
              as: FestivalDirector
              captures: { posture: $.data.operational_posture, rl: $.data.total_refund_liability }
          assert:
            - "Festival.${f_id}.operational_posture == CANCELLED"
            - "Ticket.${t_id}.status == REFUNDED"
            - "AddOn.${ao_id}.status == REFUNDED"
            - "Performance.${p_id}.status == CANCELLED"
            - "Festival.${f_id}.total_refund_liability == 240.00"

      - name: cancel_cascade_depth3_freeze_and_liability
        claim_type: Cross-entity
        grounds:
          - state_machines.Festival.SUSPENDED_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_cascade_ticket_to_wristband_to_liability_depth3
          rationale: "The SUSPENDED->CANCELLED ticket->wristband->liability cascade is asserted end-to-end by the named §1.8 instance."

      - name: festival_cycle_live_suspended
        claim_type: cyclic
        grounds:
          - state_machines.Festival.SUSPENDED_to_LIVE
        excluded_because:
          difficulty_instance: non_linear_state_machine / festival_cycle_live_suspended_resume
          rationale: "The LIVE<->SUSPENDED back-edge is verified by the named §1.8 instance."

  # =================================================================
  # Calculations
  # =================================================================
  - section: calculations
    instances:
      - name: weather_refund_partial_remaining_elapsed_two
        claim_type: Correct Result
        grounds:
          - calculations.weather_prorata_refund
          - entities.Refund.fields.amount
        distinguishing_aspect: "Festival SUSPENDED after day 2 (current_festival_day 2, total_days 3) cancelled: a GA 2-day ticket (face 160.00) refunds 160*(1/3)=53.33."
        test_recipe:
          setup: ["Festival F total_days 3, SUSPENDED after day 2 open; one ACTIVATED GA 2-day ticket (face 160.00)"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "WxPartial F", start_date: "2026-08-01", end_date: "2026-08-03", max_reentries: 1 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "wp@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
            - call: "POST /festivals/${f_id}/wristbands"
              payload: { rfid_uid: "RF-WP-1" }
              as: BoxOffice
              captures: { w_id: $.data.id }
            - call: "POST /wristbands/${w_id}/activate"
              payload: { ticket_id: "${t_id}" }
              as: BoxOffice
            - call: "POST /festivals/${f_id}/go-live"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-day"
              payload: { day: 2 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/weather-hold"
              payload: {}
              as: FestivalDirector
          trigger:
            - call: "POST /festivals/${f_id}/cancel"
              payload: {}
              as: FestivalDirector
            - call: "GET /refunds?ticket_id=${t_id}"
              payload: {}
              as: FestivalDirector
              captures: { amt: $.data.0.amount }
          assert:
            - "Refund.amount == 53.33"

      - name: voluntary_refund_no_fee_tier_14_days
        claim_type: Constants Applied
        grounds:
          - calculations.voluntary_tiered_refund
          - entities.Refund.fields.fee_withheld
        distinguishing_aspect: "Voluntary refund at exactly 14 days before start -> fee_pct 0.00, full refund. GA 2-day (face 160.00) -> amount 160.00, fee_withheld 0.00 (the >=14 boundary)."
        test_recipe:
          setup: ["Festival F start 2026-08-15; clock pinned 2026-08-01 (14 days before); one SOLD GA 2-day ticket"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FestivalDirector
            - call: "POST /festivals"
              payload: { name: "Vol14 F", start_date: "2026-08-15", end_date: "2026-08-17" }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
              payload: { ticket_type: "GA", day_count: 2, purchaser_email: "v14@x.com" }
              as: BoxOffice
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /tickets/${t_id}/refund"
              payload: {}
              as: BoxOffice
              captures: { amt: $.data.amount, fee: $.data.fee_withheld }
          assert:
            - "Refund.amount == 160.00"
            - "Refund.fee_withheld == 0.00"

      - name: cashout_fee_three_percent
        claim_type: Precision
        grounds:
          - calculations.wristband_cashout
          - entities.WalletTxn.fields.kind
        distinguishing_aspect: "Cash-out of a 70.00 balance at 3% -> fee 2.10, refund 67.90; CASHOUT and CASHOUT_FEE wallet txns written."
        test_recipe:
          setup: ["Festival F LIVE; wristband W ACTIVE, balance 70.00, OUTSIDE"]
          setup_api_calls:
            - call: "POST /festivals"
              payload: { name: "CashF", start_date: "2026-08-01", end_date: "2026-08-02", wristband_cashout_pct: 0.03 }
              as: FestivalDirector
              captures: { f_id: $.data.id }
            - call: "POST /festivals/${f_id}/zones"
              payload: { code: "A", slot_capacity: 1 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/stages"
              payload: { name: "Main", changeover_minutes: 30 }
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/open-sales"
              payload: {}
              as: FestivalDirector
            - call: "POST /festivals/${f_id}/tickets"
