            - "after the trigger: Show.${show_id}.reserved_stall_count == 0 and Show.${show_id}.available_stall_count == 10, so 0 + 10 == stall_capacity 10 — the invariant holds with zero drift and available_stall_count returns to its exact pre-accept value"
