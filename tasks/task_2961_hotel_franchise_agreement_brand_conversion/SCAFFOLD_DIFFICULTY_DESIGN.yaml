      - name: pip_item_rejection_restores_the_plan_counter_partition
        grounds:
          - endpoints.POST_/pip-items/{id}/complete.side_effects
          - endpoints.POST_/pip-items/{id}/verify.side_effects
          - entities.PropertyImprovementPlan.fields.items_pending_count
          - entities.PropertyImprovementPlan.fields.items_submitted_count
          - entities.PipItem.fields.rejection_count
        distinguishing_aspect: |
          A different conserved quantity: a COUNTER PARTITION rather than money. The four status
          buckets of the plan must partition its three scope lines at every observable instant —
          pending + submitted + verified + overdue == items_total_count == 3 — and a REJECT is the
          exact compensating inverse of a completion: it moves the line back to PENDING, unwinds
          both counters and leaves only rejection_count as evidence, so the partition after the
          reject is byte-for-byte the pre-completion partition (3/0/0/0).
