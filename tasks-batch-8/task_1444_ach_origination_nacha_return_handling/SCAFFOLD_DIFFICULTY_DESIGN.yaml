  - rule_id: boundary_precision_check
    instances:
      - name: same_day_cap_exactly_one_million
        grounds:
          - errors[ERR_SAME_DAY_INELIGIBLE]
          - validations[priority=8]
          - entities.AchEntry.fields.amount_cents
        distinguishing_aspect: |
          Metric: money (entry amount). Exactly 100000000 cents ($1,000,000.00)
