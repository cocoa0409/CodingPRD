              payload: { controller_id: "${ctrl_id}", email: "c14@x.example", full_name: "C14 Subj", jurisdiction_residency: "EU" }
              as: IntakeAgent
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T09:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /dsar-requests"
              payload: { controller_id: "${ctrl_id}", data_subject_id: "${sub_id}", request_type: "ACCESS", received_at: "2026-01-05T09:00:00Z" }
              as: IntakeAgent
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-04T09:00:01Z" }
              as: PrivacyOfficer
          assert:
            - "DsarRequest.${req_id}.status == CLOSED_EXPIRED"

      - name: processor_notification_ack_window_buffered_by_sla_hours
        grounds:
          - calculations.processor_ack_deadline
          - state_machines.ProcessorNotification.SENT_to_OVERDUE
          - entities.Processor.fields.sla_ack_hours
