        grounds:
          - calculations.test_measured_efficiency
          - entities.PerformanceTest.fields.stator_loss_corrected_w
          - entities.PerformanceTest.fields.total_loss_w
          - state_machines.PerformanceTest.SCHEDULED_to_COMPLETED
