  - section: state_machines
    instances:
      - name: carrier_pickup_walks_scheduled_to_closed_to_departed
        claim_type: valid_transition
        grounds:
          - state_machines.CarrierPickup
          - endpoints.POST /fulfillment-network/carrier-pickups/{pickup_id}/close
          - endpoints.POST /fulfillment-network/carrier-pickups/{pickup_id}/depart
        distinguishing_aspect: "The happy path of the pickup machine is a two-hop walk SCHEDULED -> CLOSED -> DEPARTED where each hop returns 200 and bumps CarrierPickup.version by exactly one, ending at version 3."
        test_recipe:
          setup:
            - "Clock 2026-08-03T09:00:00Z; node S1 registered; one pickup window 09:30-11:00 with parcel_capacity 2 and no parcels tendered."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "ACME", window_start_utc: "2026-08-03T09:30:00Z", window_end_utc: "2026-08-03T11:00:00Z", parcel_capacity: 2 }
              as: CarrierCoordinator
              captures: { pk1: "$.data.id", pk1_v: "$.data.version" }
          trigger:
            - call: "POST /fulfillment-network/carrier-pickups/${pk1}/close"
              payload: {}
              as: CarrierCoordinator
            - call: "POST /fulfillment-network/carrier-pickups/${pk1}/depart"
              payload: {}
              as: CarrierCoordinator
            - call: "GET /fulfillment-network/carrier-pickups/${pk1}"
              payload: {}
              as: CarrierCoordinator
          assert:
            - "on creation CarrierPickup.${pk1}.status == SCHEDULED, reserved_parcels == 0 and ${pk1_v} == 1"
            - "close returns HTTP 200 with status CLOSED and version 2"
            - "depart returns HTTP 200 with status DEPARTED and version 3"
            - "the final read still shows carrier_code ACME, parcel_capacity 2 and reserved_parcels 0"

      - name: depart_is_refused_before_close_and_accepted_after_it
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_15
          - errors.ERR_PICKUP_STATE_INVALID
        distinguishing_aspect: "depart carries the precondition status == CLOSED: called on a SCHEDULED pickup it returns 409 ERR_PICKUP_STATE_INVALID and leaves version at 1, and the very same call succeeds once close has run."
        test_recipe:
          setup:
            - "Clock 09:00; node S1 with a SCHEDULED pickup 09:30-11:00, capacity 2."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/stores"
              payload: { store_code: "S1-DOWNTOWN", region_code: "WEST", origin_zone: 4, daily_unit_capacity: 120, staffed_labor_minutes: 480, labor_standard_minutes_per_order: 12, pick_labor_minutes_per_unit: 3, labor_rate_cents_per_minute: 42, cutoff_utc_minutes: 1020, hazmat_certified: false }
              as: NetworkPlanner
              captures: { s1: "$.data.id" }
            - call: "POST /fulfillment-network/stores/${s1}/carrier-pickups"
              payload: { carrier_code: "ACME", window_start_utc: "2026-08-03T09:30:00Z", window_end_utc: "2026-08-03T11:00:00Z", parcel_capacity: 2 }
              as: CarrierCoordinator
              captures: { pk1: "$.data.id" }
          trigger:
            - call: "POST /fulfillment-network/carrier-pickups/${pk1}/depart"
              payload: {}
              as: CarrierCoordinator
              captures: { err_state: "$.data.error_id" }
            - call: "POST /fulfillment-network/carrier-pickups/${pk1}/close"
              payload: {}
              as: CarrierCoordinator
            - call: "POST /fulfillment-network/carrier-pickups/${pk1}/depart"
              payload: {}
              as: CarrierCoordinator
          assert:
            - "the first depart returns HTTP 409 with ${err_state} == ERR_PICKUP_STATE_INVALID"
            - "after the refusal CarrierPickup.${pk1}.status is still SCHEDULED and version is still 1, so the failed call had no side effect"
            - "close then depart both return HTTP 200 and the pickup ends DEPARTED at version 3"

      - name: pack_consumes_one_package_and_stamps_actual_labor_minutes
        claim_type: side_effect_execution
        grounds:
          - endpoints.POST /fulfillment-network/assignments/{assignment_id}/pack
          - entities.PackagingSupply
        distinguishing_aspect: "pack is not a pure status write: it stamps labor_minutes_actual = floor((packed_at - accepted_at)/60s) = 25 for an accept at 09:05 and a pack at 09:30, and it decrements exactly one MEDIUM_BOX while raising lifetime_consumed_units and re-deriving reorder_flag."
        test_recipe:
          setup:
            - "Clock 09:00; node S1; SKU-A; inventory 20 on hand / 2 safety; PackagingSupply MEDIUM_BOX with on_hand 2 and reorder_point 1; order O1 with one line SKU-A x2 committed to S1; the assignment has been accepted at 09:05."
          setup_api_calls:
