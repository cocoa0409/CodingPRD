      - name: appraisal_return_resubmit_cycle_increments_revision_count_twice
        grounds:
          - state_machines.Appraisal.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.Appraisal.RETURNED_FOR_REVISION_to_SUBMITTED
          - entities.Appraisal.fields.revision_count
          - global_constants.MAX_APPRAISAL_REVISIONS
          - validations.priority_63
        distinguishing_aspect: |
          Cyclic machine where re-entry is counted, not idempotent: SUBMITTED is visited three
          separate times on one row and RETURNED_FOR_REVISION twice, so revision_count ends at 2
          and the third submit is still legal because the guard is revision_count > 2, not >= 2.
          An implementation modelling the cycle as a plain edge without the counter cannot
          distinguish the first submit from the third.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with one parcel."
            - "One INITIAL Appraisal on that parcel in SUBMITTED with revision_count 0, authored by sa-1."
