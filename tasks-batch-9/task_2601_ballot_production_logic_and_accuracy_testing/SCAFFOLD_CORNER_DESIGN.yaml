              as: PrintVendorRep
              as_user_id: "${vend}"
              captures: { job_status: $.data.status, basis: $.data.invoice_basis, delivered: $.data.delivered_quantity, sub: $.data.invoice_subtotal_cents, credit: $.data.defect_credit_cents, freight: $.data.freight_cents, total: $.data.invoice_total_cents }
