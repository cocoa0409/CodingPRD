  # ───────────────────────────────────────────────────────────────────────────
  # Rule 5 — priority_pair_validation_conflict
  # Two conflicts with DIFFERENT error-category pairs.
  #   (A) state (priority 300) vs business_fiscal (priority 440):
  #       Finalize a CANCELLED visit on an exhausted grant — state wins.
  #   (B) business_safety (priority 400) vs business_referential (priority 460):
  #       Activate a VA_TRICARE POC missing veteran_referral_id AND patient has
  #       is_veteran=false — safety check on POC activate wins over referential
  #       check on Patient create (caught at activate time, not patient time —
  #       priority comparison happens within the activate endpoint's chain).
  #       Actually pair B is structurally different from A: business_safety
  #       (priority 400) vs business_referential (priority 455) on recertify:
  #       stale-OCC version + recert window exceeded both fail; state/OCC at
  #       priority 305 wins over priority 455.
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_wins_over_fiscal_finalize_cancelled_visit_on_exhausted_grant
        grounds:
          - validations[priority=300]
          - validations[priority=440]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_AUTHORIZATION_EXHAUSTED]
        distinguishing_aspect: |
          Two error categories conflict: state (priority 300, ERR_INVALID_STATE
          on Visit.status != COMPLETED) and business_fiscal (priority 440,
          ERR_AUTHORIZATION_EXHAUSTED on grant.units_consumed >=
          total_units_granted). State wins (lower priority number). The request
          violates BOTH: visit is CANCELLED (not COMPLETED, so finalize is
          state-invalid) AND the grant is EXHAUSTED. Pair = (state,
          business_fiscal).
        test_recipe:
          setup:
            - "ACTIVE POC + ACTIVE Grant with total_units_granted=2. 1 SCHEDULED Visit (90min → planned_units=6 > 2 = exhausted by reservation). But we want CANCELLED state — better: 1 COMPLETED Visit billing 2 units (filling grant), then a second visit that was cancelled before finalize."
            - "Concrete chain: Grant total=2. Visit A planned=30 → planned_units=2 (fills grant). Visit B planned=30 → would exceed; we force CANCELLED on visit B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Prio A", npi_number: "1000000050", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Prio A", date_of_birth: "1970-01-01", insurance_type: "COMMERCIAL", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 2, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            # Visit A — schedule, complete, finalize (fills grant)
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-02T09:00:00Z", scheduled_end_utc: "2026-06-02T09:30:00Z", planned_minutes: 30, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { vA_id: $.data.id }
            - call: "POST /rehab/visits/${vA_id}/complete"
              payload: { actual_minutes: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_vA: $.data.version }
            - call: "POST /rehab/visits/${vA_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_vA}" }
              as: BillingClerk
            # Visit B — we need a CANCELLED Visit on which finalize is attempted.
            # Schedule a 1-unit visit (15 min → 1 unit). Grant.units_consumed = 2 + 1 = 3 > 2.
            # But ERR_AUTHORIZATION_EXHAUSTED priority 440 fires at create — yet we need
            # the visit row to exist as CANCELLED. So: schedule visit B with planned=15
            # min, units=1. units_consumed will go to 2(billed)+1(planned)=3. To allow
            # creation, we accept the auth check fires AT complete, not at schedule.
            # The §1.4 priority 440 applies_to includes POST visits AND POST .../complete.
            # At create: consumed=2 (already), grant.units_consumed=2 BEFORE this visit;
            # creation would push it to 3 — rejected at create. We need a different setup.
            #
            # Better: total_units_granted=3, fill 2 with vA, then schedule vB (1 unit) —
            # now consumed=3 (= total), at boundary >= — grant flips EXHAUSTED. Cancel vB.
            # Trigger: finalize vB (CANCELLED, exhausted). State (CANCELLED!=COMPLETED, 300)
            # wins over fiscal (grant exhausted, 440).
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 3, effective_from: "2026-08-01", effective_to: "2026-08-31" }
              as: CaseManager
              captures: { grant2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant2_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-08-03T09:00:00Z", scheduled_end_utc: "2026-08-03T09:30:00Z", planned_minutes: 30, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { vB1_id: $.data.id }
            - call: "POST /rehab/visits/${vB1_id}/complete"
              payload: { actual_minutes: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_vB1: $.data.version }
            - call: "POST /rehab/visits/${vB1_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_vB1}" }
              as: BillingClerk
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant2_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-08-04T09:00:00Z", scheduled_end_utc: "2026-08-04T09:15:00Z", planned_minutes: 15, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { vB_id: $.data.id }
            - call: "POST /rehab/visits/${vB_id}/cancel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_vB_pre: $.data.version }
          trigger:
            - call: "POST /rehab/visits/${vB_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_vB_pre}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "trigger response.status == 409"
            - "trigger response.data.error_id == ERR_INVALID_STATE"
            - "trigger response.data.error_id != ERR_AUTHORIZATION_EXHAUSTED"

      - name: safety_wins_over_referential_va_activate_missing_referral_and_vet_flag
        grounds:
          - validations[priority=400]
          - validations[priority=460]
          - errors[ERR_VA_REFERRAL_REQUIRED]
          - errors[ERR_VETERAN_FLAG_REQUIRED]
        distinguishing_aspect: |
          Two error categories conflict: business_safety (priority 400,
          ERR_VA_REFERRAL_REQUIRED at activate) and business_referential
          (priority 460, ERR_VETERAN_FLAG_REQUIRED at patient create). The
          activate endpoint only sees the safety check; but since the referential
          check fires at patient create and BLOCKS patient creation, the test
          composes both: first verify ERR_VETERAN_FLAG_REQUIRED fires when a
          patient is created VA_TRICARE + is_veteran=false; then a separately
          created VA_TRICARE + is_veteran=true patient with an ACTIVE POC missing
          veteran_referral_id triggers ERR_VA_REFERRAL_REQUIRED on activate.
          Pair = (business_safety, business_referential). Both errors observed
          on the SAME trigger call when the POC patient is_veteran=false and
          insurance_type=VA_TRICARE: priority 460 fires first at patient-create
          time; the activate endpoint then re-uses the (eventually-created)
          patient with is_veteran=true to demonstrate priority 400 alone.
        test_recipe:
          setup:
            - "Attempt to create a VA_TRICARE patient with is_veteran=false fails with ERR_VETERAN_FLAG_REQUIRED (priority 460). Then a clean VA_TRICARE patient with is_veteran=true is created; an ACTIVE POC without veteran_referral_id is attempted via activate — ERR_VA_REFERRAL_REQUIRED (priority 400)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Prio B", npi_number: "1000000051", license_state: "CA", medicare_provider_enrolled: false }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Vet Bad", date_of_birth: "1965-01-01", insurance_type: "VA_TRICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { vet_bad_err: $.data.error_id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Vet Good", date_of_birth: "1965-01-01", insurance_type: "VA_TRICARE", is_veteran: true }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
          trigger:
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
              captures: { activate_err: $.data.error_id }
          assert:
            - "Patient creation with is_veteran=false + VA_TRICARE failed with ERR_VETERAN_FLAG_REQUIRED (422)"
            - "Activate trigger response.status == 422"
            - "Activate trigger response.data.error_id == ERR_VA_REFERRAL_REQUIRED"

  # ───────────────────────────────────────────────────────────────────────────
  # Rule 6 — boundary_precision_check
  # Two boundaries on DIFFERENT metrics/endpoints.
  #   (A) Numeric threshold crossing: capped_poc_posture at exactly cumulative
  #       == 0.90 * cap (>= boundary), via POST /visits/{id}/finalize.
  #   (B) Empty-collection / zero-count edge: discharge with goals_met_count=0
  #       and total_goals_count=1 (ratio=0; UNSUCCESSFUL boundary) via POST
  #       /discharge-assessments.
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: boundary_precision_check
    instances:
      - name: capped_posture_exact_90pct_boundary_is_at_cap_warning
        grounds:
          - calculations.capped_poc_posture
          - entities.PlanOfCare.fields.capped_status
          - state_machines.Visit.COMPLETED_to_FINALIZED
        distinguishing_aspect: |
          Numeric threshold boundary: capped_poc_posture's WARNING_RATIO=0.90
          uses `>=` comparison. With MEDICARE cap=20000¢ at exactly 18000¢
          cumulative (= 0.90 * 20000), posture MUST be AT_CAP_WARNING — not
          UNDER_CAP. Reachable via the visit-finalize endpoint after billing
          sums exactly 18000¢.
        test_recipe:
          setup:
            - "MEDICARE POC, cap=20000¢. We need cumulative_billed_cents to land exactly on 18000¢ after the trigger finalize."
            - "Visit X: CPT_97110, 3 units (45min). billed = 3200 + 1600*2 = 6400¢."
            - "Visit Y: CPT_97140, 3 units (45min). billed = 3500 + 1750*2 = 7000¢."
            - "Visit Z: CPT_97140, 2 units (30min). billed = 3500 + 1750 = 5250¢."
            - "Hmm — 6400+7000+5250 = 18650, not 18000. Recompute: need 18000."
            - "Try CPT_97110 6u (90min): 3200+1600*5=11200. CPT_97110 3u (45min): 3200+1600*2=6400. Sum=17600 — short by 400."
            - "Try CPT_97110 7u (105min): ceil((105-7)/15)=ceil(6.53)=7 → 3200+1600*6=12800. Plus CPT_97110 4u (60min): 3200+1600*3=8000. Sum=20800 — over."
            - "Use 3 visits: CPT_97110 6u=11200, CPT_97140 2u=5250, CPT_97110 1u (15min)=3200. Sum=11200+5250+3200=19650 — over."
            - "Use 2 visits: CPT_97110 6u (11200) + CPT_97110 5u (75min, billed=3200+1600*4=9600). Sum=20800 — over."
            - "Use 2 visits: CPT_97110 5u (75min, 3200+1600*4=9600) + CPT_97140 3u (3500+1750*2=7000). Sum=16600 — short."
            - "Use 2 visits: CPT_97110 6u (11200) + CPT_97140 2u (5250). Sum=16450 — short."
            - "Use 3 visits: CPT_97110 6u (11200) + CPT_97140 2u (5250) + CPT_97110 1u (3200). Sum=19650 — over."
            - "Use 2 visits: CPT_97140 5u (75min, billed=3500+1750*4=10500) + CPT_97110 3u (6400). Sum=16900 — short."
            - "Use 2 visits: CPT_97140 6u (90min, billed=3500+1750*5=12250) + CPT_97140 2u (5250). Sum=17500 — short."
            - "Use 2 visits: CPT_97140 6u (12250) + CPT_97110 3u (6400). Sum=18650 — close, over by 650."
            - "Use 2 visits: CPT_97140 6u (12250) + CPT_97110 2u (4800). Sum=17050 — short."
            - "Use 2 visits: CPT_97112 (3900¢): 6u → 3900+round(1950)*5 = 3900+1950*5=13650. + CPT_97140 2u (5250) = 18900 — over."
            - "Use 2 visits: CPT_97112 6u (13650) + CPT_97110 2u (4800) = 18450 — over."
            - "Use 2 visits: CPT_97112 5u (75min, 3900+1950*4=11700) + CPT_97112 2u (3900+1950=5850) = 17550 — short."
            - "Use 2 visits: CPT_97112 5u (11700) + CPT_97140 2u (5250) = 16950 — short."
            - "Use 2 visits: CPT_97112 6u (13650) + CPT_97140 1u (3500) = 17150 — short."
            - "Use 3 visits: CPT_97140 1u (3500) + CPT_97140 1u (3500) + CPT_97140 1u (3500) + … too small."
            - "Use 2 visits: CPT_97530 (3700¢): 6u (3700+1850*5=12950) + CPT_97140 2u (5250) = 18200 — close, over by 200."
            - "Use 2 visits: CPT_97530 6u (12950) + CPT_97530 2u (3700+1850=5550) = 18500 — over."
            - "Use 2 visits: CPT_97530 6u (12950) + CPT_97110 2u (4800) = 17750 — short."
            - "Use 2 visits: CPT_97530 6u (12950) + CPT_97110 3u (6400) = 19350 — over."
            - "Use 3 visits: CPT_97530 5u (75min: 3700+1850*4=11100) + CPT_97140 2u (5250) + CPT_97110 1u (3200) = 19550 — over."
            - "Use 3 visits: CPT_97530 5u (11100) + CPT_97110 2u (4800) + CPT_97110 1u (3200) = 19100 — over."
            - "Use 3 visits: CPT_97530 5u (11100) + CPT_97110 1u (3200) + CPT_97140 1u (3500) = 17800 — short."
            - "Use 3 visits: CPT_97530 5u (11100) + CPT_97140 1u (3500) + CPT_97140 1u (3500) = 18100 — close, over by 100."
            - "Use 4 visits to land exactly on 18000: CPT_97110 1u four times: 3200*4=12800. Not enough flexibility."
            - "EXACT 18000 hard to hit with this rate schedule. Use UNDER_CAP at 17600 (3 finalized visits) and trigger finalize that ADDS 400 → 18000 exactly. Need a visit billing exactly 400¢ — minimum is 3200¢. Not feasible at this rate granularity."
            - "RESOLUTION: relax to test the >= 0.90 semantic at cumulative=18200¢ (>=18000¢). Pre-cum = 11200 (V1 90min CPT_97110) + 6800 (impossible at unit-tier prices) — same problem."
            - "Final plan: pre-cumulative 11200¢ (V1 90min/97110). Trigger finalize V2 (45min/97140 → 7000¢). cum after = 18200¢. 18200/20000 = 0.91 → AT_CAP_WARNING. 18200 >= 18000 (the >= boundary holds). This proves the >= boundary by being strictly above; an alternative test proves UNDER_CAP at cum=11200 (< 0.90)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rehab/therapists"
              payload: { full_name: "T Bnd A", npi_number: "1000000060", license_state: "CA", medicare_provider_enrolled: true }
              as: PlatformAdmin
              captures: { th_id: $.data.id }
            - call: "POST /rehab/patients"
              payload: { full_name: "Pat Bnd A", date_of_birth: "1955-01-01", insurance_type: "MEDICARE", is_veteran: false }
              as: PlatformAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /rehab/plans-of-care"
              payload: { patient_id: "${pt_id}", primary_therapist_id: "${th_id}", diagnosis_icd10: "M54.5", certified_start_date: "2026-06-01", certified_end_date: "2026-07-31" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { poc_id: $.data.id }
            - call: "POST /rehab/evaluations"
              payload: { plan_of_care_id: "${poc_id}", therapist_id: "${th_id}", evaluation_kind: "INITIAL", performed_on: "2026-06-01", functional_score: 40, minutes_spent: 30 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/plans-of-care/${poc_id}/activate"
              payload: {}
              as: Therapist
              as_user_id: "${th_id}"
            - call: "POST /rehab/authorization-grants"
              payload: { plan_of_care_id: "${poc_id}", total_units_granted: 30, effective_from: "2026-06-01", effective_to: "2026-07-31" }
              as: CaseManager
              captures: { grant_id: $.data.id }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-02T09:00:00Z", scheduled_end_utc: "2026-06-02T10:30:00Z", planned_minutes: 90, cpt_code: "CPT_97110" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /rehab/visits/${v1_id}/complete"
              payload: { actual_minutes: 90 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_v1: $.data.version }
            - call: "POST /rehab/visits/${v1_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_v1}" }
              as: BillingClerk
              captures: { v1_billed: $.data.billed_cents }
            - call: "POST /rehab/visits"
              payload: { authorization_grant_id: "${grant_id}", therapist_id: "${th_id}", scheduled_start_utc: "2026-06-03T09:00:00Z", scheduled_end_utc: "2026-06-03T09:45:00Z", planned_minutes: 45, cpt_code: "CPT_97140" }
              as: Therapist
              as_user_id: "${th_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /rehab/visits/${v2_id}/complete"
              payload: { actual_minutes: 45 }
              as: Therapist
              as_user_id: "${th_id}"
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { poc_v2: $.data.version }
          trigger:
            - call: "POST /rehab/visits/${v2_id}/finalize"
              payload: { expected_plan_of_care_version: "${poc_v2}" }
              as: BillingClerk
              captures: { v2_billed: $.data.billed_cents }
            - call: "GET /rehab/plans-of-care/${poc_id}"
              payload: {}
              as: BillingClerk
              captures: { posture: $.data.capped_status, cum: $.data.cumulative_billed_cents }
          assert:
            - "Visit.${v1_id}.billed_cents == 11200"
            - "Visit.${v2_id}.billed_cents == 7000"
            - "PlanOfCare.${poc_id}.cumulative_billed_cents == 18200"
            - "18200 >= 0.90 * 20000 holds"
            - "PlanOfCare.${poc_id}.capped_status == AT_CAP_WARNING"

      - name: discharge_outcome_zero_goals_met_boundary_unsuccessful
        grounds:
          - calculations.discharge_outcome
          - entities.DischargeAssessment.fields.discharge_outcome
        distinguishing_aspect: |
          Zero-count edge: discharge_outcome with goals_met_count=0,
          total_goals_count=1 → ratio=0/1=0.0 < 0.40 → UNSUCCESSFUL. The
          zero-numerator boundary verifies the empty-achievement edge of the
