          trigger:
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${facA_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${profB_id}", declared_quantity_kg: 1000.0, declared_container_count: 4, is_bulk: false }] }
              as: ReceivingClerk
          assert:
            - "response status == 409 and data.error_id == ERR_FACILITY_SCOPE_MISMATCH"
            - "data.error_id != ERR_PROFILE_NOT_APPROVED"
            - "WasteProfile.${profB_id}.status == APPROVED"
            - "GET /tsdf/manifests?facility_id=${facA_id} returns total_count == 0"

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: treatment_batch_creation_freezes_input_figures_at_planned
        claim_type: initial_state
        grounds:
          - state_machines.treatment_batch_lifecycle.initial_state
          - calculations.treatment_batch_input_mass
          - calculations.treatment_liability_estimate
          - endpoints[POST /tsdf/treatment-batches]
        distinguishing_aspect: |
          PLANNED is the initial state and the batch freezes its arithmetic there: input_mass_kg
          200.0 summed from the sealed containers, dominant_compatibility_class ORGANIC_SOLVENT and
          estimated_treatment_liability_cents = round_half_up(200.0 * 220) = 44,000. The staged
          containers move to STAGED and the unit's reserved_kg absorbs the same 200.0.
        test_recipe:
          setup:
            - "Standard chain to one SEALED 200.0 kg container in CONTAINER_AREA unit CA-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/storage-units"
              payload: { facility_id: "${fac_id}", unit_code: "CA-01", unit_type: "CONTAINER_AREA", permitted_capacity_kg: 20000.0, aisle_width_cm: 120.0, aisle_free_container_capacity: 4, inspection_frequency_days: 7, allowed_compatibility_classes: ["ORGANIC_SOLVENT", "ACID"], air_emission_control_level: "LEVEL_2", containment_volume_l: 5000.0 }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "SOLID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 1000.0, declared_container_count: 4, is_bulk: false }] }
              as: ReceivingClerk
              captures: { man_id: $.data.id }
            - call: "POST /tsdf/manifests/${man_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 1000.0, received_container_count: 4 }] }
              as: ReceivingClerk
            - call: "GET /tsdf/manifests/${man_id}/lines"
              payload: {}
              as: ReceivingClerk
              captures: { line1_id: "$.data[0].id" }
            - call: "POST /tsdf/containers"
              payload: { manifest_line_id: "${line1_id}", storage_unit_id: "${unit_id}", container_type: "DRUM_55G", capacity_kg: 250.0, net_weight_kg: 200.0, accumulation_start_date: "2026-08-01T00:00:00Z", label_waste_codes: ["D001"], label_hazard_class: "3", label_accumulation_start_marked: true }
              as: ReceivingClerk
              captures: { cont_id: $.data.id }
            - call: "POST /tsdf/containers/${cont_id}/custody-state"
              payload: { to_custody_state: "SEALED" }
              as: ReceivingClerk
          trigger:
            - call: "POST /tsdf/treatment-batches"
              payload: { facility_id: "${fac_id}", storage_unit_id: "${unit_id}", treatment_method: "INCINERATION", container_ids: ["${cont_id}"], window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: TreatmentOperator
              as_user_id: "op-01"
              captures: { batch_id: $.data.id }
          assert:
            - "response status == 201"
            - "TreatmentBatch.${batch_id}.status == PLANNED"
            - "TreatmentBatch.${batch_id}.input_mass_kg == 200.0"
            - "TreatmentBatch.${batch_id}.dominant_compatibility_class == ORGANIC_SOLVENT"
            - "TreatmentBatch.${batch_id}.estimated_treatment_liability_cents == 44000"
            - "TreatmentBatch.${batch_id}.ldr_result == PENDING"
            - "TreatmentBatch.${batch_id}.ldr_standard_ppm == null"
            - "TreatmentBatch.${batch_id}.retreat_count == 0"
            - "TreatmentBatch.${batch_id}.held_reason_code == NONE"
            - "TreatmentBatch.${batch_id}.residue_mass_kg == null"
            - "TreatmentBatch.${batch_id}.completed_by_user_id == null"
            - "Container.${cont_id}.custody_state == STAGED"
            - "Container.${cont_id}.treatment_batch_id == ${batch_id}"
            - "StorageUnit.${unit_id}.reserved_kg == 200.0"

      - name: waste_profile_submit_from_approved_rejected
