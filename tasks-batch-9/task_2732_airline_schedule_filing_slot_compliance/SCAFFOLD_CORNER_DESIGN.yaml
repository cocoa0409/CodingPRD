      - name: writing_into_another_carriers_schedule_version_is_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations.priority_20_ERR_OWNERSHIP_MISMATCH"
          - roles.NetworkPlanner
        distinguishing_aspect: |
          For the entity-backed NetworkPlanner role the acting X-User-ID must equal the owning
          Carrier id, so XP's planner posting a leg into HX's ScheduleVersion is 403
          ERR_OWNERSHIP_MISMATCH — not 404 and not 403 ERR_ROLE_NOT_PERMITTED, since the role itself is
          allowed on that endpoint — while the identical payload from HX's planner is created.
        test_recipe:
          setup:
            - "Two carriers: HX (DE, home) and XP (PT); FRA LEVEL_3_COORDINATED; MUC LEVEL_2_FACILITATED; Season W26 OPEN."
