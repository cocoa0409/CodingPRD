  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_per_night_half_open_interval_capacity
        grounds:
          - calculations.lottery_allocation
          - entities.RoomClass.fields.total_rooms
        distinguishing_aspect: |
          Resource RoomClass with per-night HALF-OPEN interval semantics
          [check_in, check_out): a guest checking out on day X and another
          checking in on day X do NOT collide (adjacency allowed), while any
          shared night counts against total_rooms.
