              as: BuyoutLead
              captures: { sub_z: $.data.id }
            # round 1: DRAFT -> PENDING_AWARD -> DRAFT
            - call: "POST /subcontracts/${sub_z}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_z}/renegotiate"
              payload: { reason: "owner pushed back on exclusions" }
              as: BuyoutLead
            # round 2
            - call: "POST /subcontracts/${sub_z}/recommend-award"
              payload: { contract_value_cents: 9100000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_z}/renegotiate"
              payload: { reason: "second round" }
              as: BuyoutLead
            - call: "GET /subcontracts/${sub_z}"
              as: BuyoutLead
              captures: { sub_round: $.data.negotiation_round, sub_status: $.data.status, sub_val: $.data.contract_value_cents }
          trigger:
            - call: "POST /subcontracts/${sub_z}/recommend-award"
              payload: { contract_value_cents: 9200000 }
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "sub_round == 2 after two full PENDING_AWARD->DRAFT loops"
            - "sub_status == DRAFT and sub_val == 0 (renegotiate resets the pinned value)"
            - "err == ERR_NEGOTIATION_ROUND_EXCEEDED (third recommend blocked at MAX_NEGOTIATION_ROUNDS=2, HTTP 409)"
            - "Subcontract.${sub_z}.status == DRAFT after the rejected recommend (no state drift)"

      - name: sov_revision_cycle_balanced_rejected_revised_balanced_reapprove
        grounds:
          - state_machines.ScheduleOfValues.BALANCED_to_REJECTED
          - state_machines.ScheduleOfValues.REJECTED_to_REVISED
          - state_machines.ScheduleOfValues.REVISED_to_BALANCED
          - entities.ScheduleOfValues.fields.revision_number
        distinguishing_aspect: |
          Cycle shape on ScheduleOfValues (different entity than Subcontract):
          BALANCED -> REJECTED -> REVISED -> BALANCED -> APPROVED, with
          revision_number incrementing on the revise hop; the revert edge
          exists only from BALANCED (a DRAFT SOV cannot be rejected), and the
          loop may repeat until approve locks it terminal.
        test_recipe:
          setup:
            - "EXECUTED subcontract with an SOV driven BALANCED -> REJECTED -> REVISED -> BALANCED (revision_number == 1)"
          setup_api_calls:
            - call: "POST /projects"
