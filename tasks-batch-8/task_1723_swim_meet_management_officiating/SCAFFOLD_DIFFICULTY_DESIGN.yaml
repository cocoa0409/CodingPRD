      - name: backup_mean_rounding_order_determines_auto_confirm
        grounds:
          - calculations.backup_mean_rounded
          - calculations.timing_reconciliation
          - entities.Meet.fields.timing_delta_threshold_cs
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: pad 2543 with backups 2510/2515 has raw mean
          2512.5 (delta 30.5 > 30, would force MANUAL_REVIEW) but the pinned round-the-mean-first
          order yields 2513 (delta 30 <= 30) and therefore AUTO_CONFIRMED — the rounding order itself
