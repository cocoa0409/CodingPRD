  - section: cross_cutting_layers
    instances:
      - name: occ_stale_farm_version_on_contract_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[contract-create-stale-farm-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Farm.version: a second contract create carrying the pre-first-create version is rejected 412 ERR_STALE_VERSION; the version observed after the first create succeeds and bumps the farm to version 2."
        test_recipe:
          setup: ["farm F created (version 1); one contract already created against version 1 (farm now version 2)"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "OCC Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id, f_v1: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v1}" }
              as: NetworkManager
              captures: { ct1_id: $.data.id }
          trigger:
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 160, premium_cents_per_dozen: 95, start_date: "2026-09-01", end_date: "2028-08-31", expected_farm_version: "${f_v1}" }
              as: NetworkManager
              captures: { err: $.data.error_id }
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v_after: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 160, premium_cents_per_dozen: 95, start_date: "2026-09-01", end_date: "2028-08-31", expected_farm_version: "${f_v_after}" }
              as: NetworkManager
              captures: { ct2_id: $.data.id }
          assert:
            - "stale create (expected_farm_version == 1 while farm.version == 2): error_id == ERR_STALE_VERSION, http 412"
            - "the stale attempt created nothing: farm.version still == 2 when re-read"
            - "retry with the fresh version succeeds (201) and supersedes contract ${ct1_id}"

      - name: derived_certification_recomputed_on_pass_and_removal
        claim_type: derived_field_reconciliation
        grounds: ["calculations.certification_status_derivation", "state_machines.Farm"]
        distinguishing_aspect: "certification_status is fully derived: CERTIFICATION_PENDING at creation, CERTIFIED with last_passed_audit_at set the moment the audit passes, DECERTIFIED after removal — three recomputation triggers verified on one farm."
        test_recipe:
          setup: ["farm F observed at creation, after a PASSED audit at 2026-09-03T09:00:00Z, and after removal"]
          setup_api_calls:
            - call: "POST /farm-network/farms"
              payload: { name: "Derived Cert Farm", region: "IA", pasture_sqft: 21600, barn_sqft: 180, nest_box_count: 30, declared_bird_count: 140 }
              as: NetworkManager
              captures: { f_id: $.data.id, cert0: $.data.certification_status }
            - call: "POST /farm-network/farms/${f_id}/audits"
              payload: { audit_type: "INITIAL", scheduled_for: "2026-09-03T00:00:00Z" }
              as: NetworkManager
              captures: { a_id: $.data.id }
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
          trigger:
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { cert1: $.data.certification_status, lp1: $.data.last_passed_audit_at }
            - call: "POST /farm-network/farms/${f_id}/remove"
              payload: { reason: "program withdrawal" }
              as: NetworkManager
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
          assert:
            - "at creation: certification_status == CERTIFICATION_PENDING (cert0)"
            - "after PASSED audit: certification_status == CERTIFIED and last_passed_audit_at == 2026-09-03T09:00:00Z"
            - "after removal: certification_status == DECERTIFIED"

