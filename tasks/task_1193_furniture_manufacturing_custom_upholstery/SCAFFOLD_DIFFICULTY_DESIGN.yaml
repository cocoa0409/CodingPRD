            - "SupplyRequisition.${req_id}.status == CANCELLED"
            - "CutPlan.${cp_id}.status == VOID"
            - "CellBooking.${booking_id}.status == RELEASED"
            - "ComplianceCertificate.${cert_id}.status == VOID"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_allocation
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_LOT_NOT_AVAILABLE]
          - errors[ERR_INSUFFICIENT_YARDAGE]
        distinguishing_aspect: |
          Error-category pair = state (priority 5) vs business_fiscal (priority 9). The
          request violates both — lot is RECEIVED (not AVAILABLE) AND 50.0 yards exceeds
          available_yards 0.0 — and the state error ERR_LOT_NOT_AVAILABLE must win.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-NP (no match, rule (A, ESPRESSO, allowed, 0)); PLANT spec FAB-A"
            - "Order ORD-SF with line qty 4 confirmed with no stock → line MATERIAL_SHORTFALL, order MATERIAL_HOLD"
            - "Lot created and received 10.0 yards but NOT inspected (status RECEIVED, available_yards 0.0)"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-NP", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: false, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "A", finish_code: "ESPRESSO", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-A", origin: "PLANT", grade: "A", nominal_width_inches: 54.0, price_per_yard_cents: 3000 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-SF", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order_id: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order_id}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "PLANT_STOCK", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line_id: $.data.id }
            - call: "POST /mill/customer-orders/${order_id}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", expected_yards: 10.0 }
              as: MaterialReceiver
              captures: { lot_id: $.data.id }
            - call: "POST /mill/material-lots/${lot_id}/receive"
              payload: { received_yards: 10.0 }
              as: MaterialReceiver
          trigger:
            - call: "POST /mill/material-allocations"
              payload: { lot_id: "${lot_id}", order_line_id: "${line_id}", yards: 50.0 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Response is 409 with data.error_id == ERR_LOT_NOT_AVAILABLE (state, priority 5), NOT ERR_INSUFFICIENT_YARDAGE (fiscal, priority 9)"

      - name: safety_beats_constraint_on_booking
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CELL_CERTIFICATION_MISSING]
          - errors[ERR_CELL_OVERLAP]
        distinguishing_aspect: |
          Error-category pair = business_safety (priority 6) vs business_constraint
          (priority 7) — a different pair from the state-vs-fiscal instance. The booking
          violates both the COM_HANDLING certification rule and the exclusive-cell overlap
          rule; the safety error ERR_CELL_CERTIFICATION_MISSING must win.
        test_recipe:
