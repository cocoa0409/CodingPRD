            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/complaints/${cmp}/assign-investigator"
              payload: { investigator_id: "${insp_b}" }
              as: LicensingSupervisor
          trigger:
            - call: "POST /licensing/complaints/${cmp}/determination"
              payload: { determination: "SUBSTANTIATED" }
              as: ComplaintInvestigator
              as_user_id: "${insp_b}"
            - call: "GET /licensing/providers/${prov}/risk-assessment"
              payload: { variant: "ENFORCEMENT_REVIEW" }
              as: LicensingSupervisor
              captures: { risk: $.data.risk_score, tier: $.data.risk_tier }
            - call: "GET /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", status: "PROPOSED" }
              as: LicensingSupervisor
              captures: { auto_action: "$.data[0].id", auto_fine: "$.data[0].fine_amount_cents" }
          assert:
            - "before the trigger: Provider.${prov}.open_violation_points == 23, critical_open_count == 1, Inspection.${insp_id}.preliminary_compliance_score == 75.80 (raw 24.20 = 15.00 + 9.20) and violation_count == 2"
            - "LINK 1 — Complaint.${cmp}.status == \"DETERMINED\", determination == \"SUBSTANTIATED\", determined_at == \"2026-08-01T00:00:00Z\", investigation_due_at == \"2026-09-15T00:00:00Z\" and timeliness_flag == \"ON_TIME\""
            - "LINK 2 — exactly one new Violation exists with auto_generated == true, inspection_id == ${insp_id}, checklist_item code \"SU-101\" (COMPLAINT_CATEGORY_CHECKLIST_CODE[SUPERVISION]), primary_age_group == \"PRESCHOOL\", severity == \"CRITICAL\", assessed_points == 15, infant_exposure == false (INFANT is not in age_groups_observed), status == \"CORRECTION_PENDING\" and correction_due_date == \"2026-08-04T00:00:00Z\""
            - "LINK 3 — Provider.${prov}.open_violation_points == 38, lifetime_violation_points == 38, critical_open_count == 2, critical_violation_count_24mo == 2, substantiated_complaint_count_24mo == 1; Inspection.${insp_id}.violation_count == 3, raw_deduction_points == 39.20 and final_compliance_score == 60.80, while preliminary_compliance_score is still frozen at 75.80"
            - "LINK 3 — ${risk} == 56.00 and ${tier} == \"HIGH\" (38 + 8 + 0 + 10 + 0); Provider.${prov}.risk_score == 56.00 and risk_tier == \"HIGH\" are persisted"
            - "LINK 4 — exactly one EnforcementAction exists for ${prov}: status \"PROPOSED\", action_type \"PROBATION\", ladder_step 2, basis_points 38, source_inspection_id == ${insp_id}"
            - "LINK 4 — ${auto_fine} == 151525 (gross 50000 + 2500*38 = 145000 -> tier T2 -> surcharge 14500 -> net 159500 -> credit 7975)"
            - "the cascade is transitive: with the two seeded violations absent, the same determination would leave open_violation_points at 15, below PROBATION_THRESHOLD, and NO EnforcementAction would be created"
            - "Provider.${prov}.current_ladder_step is still 0 — a PROPOSED action does not move the ladder"

      - name: cascade_disqualification_to_barred_staff_to_rosters_to_application_revert
        grounds:
          - state_machines.BackgroundCheck.SUBMITTED_to_DISQUALIFIED
          - state_machines.Provider.application_status.CHECKS_CLEARED_to_SUBMITTED
          - calculations.provider_clearance_completeness
          - calculations.ratio_group_size_supervision_verification
          - entities.StaffMember.fields.barred_offense_tier
          - entities.AgeGroupRoster.fields.supervision_compliant
          - errors.ERR_PERMANENT_BAR_NOT_WAIVABLE
        distinguishing_aspect: |
          A different depth-4 chain from a different trigger: one DISQUALIFIED
          result on a THIRD, non-required check bars the person, the bar alone
          strips the lead from all four rosters, the missing lead alone flips
          clearance_complete, and that flip alone reverts application_status
          CHECKS_CLEARED -> SUBMITTED and VOIDs the scheduled INITIAL inspection.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One CENTER provider with a single DIRECTOR whose FBI_FINGERPRINT and CHILD_ABUSE_REGISTRY checks are both CLEARED, so clearance_complete is true."
            - "Four rosters (INFANT 8, TODDLER 12, PRESCHOOL 20, SCHOOL_AGE 20) all led by that DIRECTOR; enrolled_count 0 everywhere; staff_assigned_count 2 on the first three and 0 on SCHOOL_AGE."
            - "submit-application then clear-checks, so application_status == CHECKS_CLEARED."
            - "One INITIAL inspection in status SCHEDULED."
            - "A third, non-required STATE_CRIMINAL check on the same DIRECTOR, still SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Harborview Center", county_code: "CTY-01", site_address: "8 Harborview Rd", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Director", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], role_title: "Center Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { sm_dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "INFANT", requested_group_size: 8, enrolled_count: 0, staff_assigned_count: 2, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_inf: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "TODDLER", requested_group_size: 12, enrolled_count: 0, staff_assigned_count: 2, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_tod: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "PRESCHOOL", requested_group_size: 20, enrolled_count: 0, staff_assigned_count: 2, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_pre: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "SCHOOL_AGE", requested_group_size: 20, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_sch: $.data.id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              payload: {}
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/clear-checks"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "INITIAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "STATE_CRIMINAL" }
              as: BackgroundCheckUnit
              captures: { bc_sc: $.data.id }
          trigger:
            - call: "POST /licensing/background-checks/${bc_sc}/result"
              payload: { result: "DISQUALIFIED", disqualifying_offense_tier: "TIER_1_PERMANENT" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks/${bc_sc}/waiver"
              payload: { waiver_rationale: "The offense is thirty years old and unrelated to child care." }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/clear-checks"
              payload: {}
              as: LicensingSupervisor
          assert:
            - "before the trigger: Provider.${prov}.clearance_complete == true, application_status == \"CHECKS_CLEARED\", Inspection.${insp_id}.status == \"SCHEDULED\", every roster has supervision_compliant == true"
            - "LINK 1 — BackgroundCheck.${bc_sc}.status == \"DISQUALIFIED\", decided_at == \"2026-08-01T00:00:00Z\", expires_at == null; the FBI_FINGERPRINT and CHILD_ABUSE_REGISTRY checks are untouched and still CLEARED with expires_at \"2031-08-01T00:00:00Z\""
            - "LINK 2 — StaffMember.${sm_dir}.clearance_status == \"BARRED\", supervision_eligible == false, barred_offense_tier == \"TIER_1_PERMANENT\""
            - "LINK 3 — all four rosters have lead_staff_member_id == null and supervision_compliant == false; staff_assigned_count is 1 on ${r_inf}, ${r_tod} and ${r_pre} (2 - 1) and 0 on ${r_sch} (the floor holds, it does not go to -1); ratio_compliant stays true everywhere because enrolled_count is 0 so required_staff_count is 0"
            - "LINK 4 — Provider.${prov}.clearance_complete == false and application_status reverted to \"SUBMITTED\" (the cyclic edge), and Inspection.${insp_id}.status == \"VOIDED\""
            - "the waiver request returns ERR_PERMANENT_BAR_NOT_WAIVABLE (409); BackgroundCheck.${bc_sc}.status stays \"DISQUALIFIED\" and no link of the chain is undone"
            - "the follow-up clear-checks returns ERR_CLEARANCE_INCOMPLETE (409) because clearance_complete is false — the provider cannot re-enter CHECKS_CLEARED"
            - "the chain is transitive: had the DIRECTOR not been the lead on any roster, links 3 and 4 would still fire via clearance_complete, but roster staff_assigned_count would be unchanged — link 4 depends on link 2, not on link 3"
            - "Provider.${prov}.version incremented exactly once for the cascade write"

  # =======================================================================
  # Rule 5 — priority-pair validation conflicts, three distinct
  #          error-category pairs
  #   instance 1 = state (42)             vs business_safety (55)
  #   instance 2 = business_temporal (66) vs business_constraint (74)
  #   instance 3 = business_temporal (71) vs business_referential (86)
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_pair_inspection_state_beats_clearance_incomplete
        grounds:
          - validations.priority_42_ERR_INVALID_INSPECTION_STATE
          - validations.priority_55_ERR_CLEARANCE_INCOMPLETE
          - endpoints.POST_licensing_inspections_finalize
          - calculations.provider_clearance_completeness
        distinguishing_aspect: |
          One finalize request violates a state rule at priority 42 and a
          business_safety rule at priority 55 at the same time, and the
          response must be ERR_INVALID_INSPECTION_STATE; only after the
          inspection reaches PENDING_REVIEW does the same unchanged clearance
          gap surface as ERR_CLEARANCE_INCOMPLETE.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One Inspector certified for PRESCHOOL."
            - "One CENTER provider whose only StaffMember is a DIRECTOR with NO background checks, so clearance_complete is false."
            - "One INITIAL inspection left in status SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Fernwood Center", county_code: "CTY-01", site_address: "10 Fernwood Dr", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Director", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Center Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { sm_dir: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "INITIAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
          trigger:
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
          assert:
            - "Provider.${prov}.clearance_complete == false throughout the first two finalize attempts"
            - "the first finalize (inspection SCHEDULED, clearance false — BOTH rules violated) returns ERR_INVALID_INSPECTION_STATE (409), the priority-42 state error, NOT ERR_CLEARANCE_INCOMPLETE"
            - "Inspection.${insp_id}.status is still \"SCHEDULED\" after that refusal"
            - "the second finalize (inspection PENDING_REVIEW, clearance still false — only priority 55 violated) returns ERR_CLEARANCE_INCOMPLETE (409)"
            - "Inspection.${insp_id}.status is still \"PENDING_REVIEW\" and finalized_at is null after that refusal"
            - "after both checks are CLEARED, Provider.${prov}.clearance_complete == true and the third finalize returns 200 with Inspection.${insp_id}.status == \"FINALIZED\", outcome \"PASS\", violation_count 0, raw_deduction_points 0.00 and final_compliance_score 100.00"
            - "Provider.${prov}.application_status stays \"DRAFT\" — the CHECKS_CLEARED -> INITIAL_INSPECTION_PASSED edge only fires from CHECKS_CLEARED"

      - name: priority_pair_double_booking_beats_uncertified_age_group
        grounds:
          - validations.priority_66_ERR_INSPECTOR_DOUBLE_BOOKED
          - validations.priority_74_ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP
          - calculations.inspector_schedule_conflict_window
          - endpoints.POST_licensing_inspections
        distinguishing_aspect: |
          A different category pair on a different endpoint: one scheduling
          request is both time-conflicting (priority 66, business_temporal) and
          asks for an age group the inspector is not certified for (priority 74,
          business_constraint), and the temporal error must win; shifting the
          start by one hour to 11:00:00Z leaves only the certification error.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One Inspector certified for PRESCHOOL only, max_daily_visits 3."
            - "Two CENTER providers, A and B (different providers, so the provider-visit buffer rule at priority 67 can never fire)."
            - "One SCHEDULED inspection for that inspector at provider A, 2026-08-05T09:00:00Z for 120 minutes, i.e. window [09:00, 11:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Provider A Center", county_code: "CTY-01", site_address: "21 A Street", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Provider B Center", county_code: "CTY-01", site_address: "22 B Street", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov_b: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_a}", inspection_type: "FOLLOW_UP", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_first: $.data.id }
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp_a}", inspection_type: "FOLLOW_UP", scheduled_for: "2026-08-05T10:00:00Z", target_age_groups: ["PRESCHOOL", "INFANT"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp_a}", inspection_type: "FOLLOW_UP", scheduled_for: "2026-08-05T11:00:00Z", target_age_groups: ["PRESCHOOL", "INFANT"], duration_minutes: 120 }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_b}", inspector_id: "${insp_a}", inspection_type: "FOLLOW_UP", scheduled_for: "2026-08-05T11:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_second: $.data.id }
          assert:
            - "Inspection.${insp_first}.visit_window_end == \"2026-08-05T11:00:00Z\""
            - "the 10:00:00Z request (overlapping AND naming uncertified INFANT — BOTH rules violated) returns ERR_INSPECTOR_DOUBLE_BOOKED (409), the priority-66 business_temporal error, NOT ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP"
            - "the 11:00:00Z request with the same uncertified age group returns ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP (409) — the half-open window means 11:00:00Z does not overlap [09:00, 11:00)"
            - "the 11:00:00Z request restricted to [\"PRESCHOOL\"] returns 201 with Inspection.${insp_second}.status == \"SCHEDULED\" and visit_window_end == \"2026-08-05T13:00:00Z\""
            - "neither refusal created a row: exactly two Inspections exist for ${insp_a} on 2026-08-05, so the priority-76 daily limit of 3 is not reached"
            - "ERR_PROVIDER_VISIT_BUFFER_CONFLICT (priority 67) never appears — the two inspections belong to different providers"

      - name: priority_pair_cap_window_closed_beats_violation_inspection_mismatch
        grounds:
          - validations.priority_71_ERR_CAP_WINDOW_CLOSED
          - validations.priority_86_ERR_VIOLATION_INSPECTION_MISMATCH
          - calculations.corrective_action_due_date
          - endpoints.POST_licensing_corrective_action_plans
        distinguishing_aspect: |
          A third category pair: one CAP submission is both outside the
          10-day window (priority 71, business_temporal) and lists a violation
          belonging to a sibling inspection of the same provider (priority 86,
          business_referential), and the temporal error must win; rewinding the
          clock by exactly one second to the inclusive window edge leaves only
          the referential error.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One RA-201 SERIOUS ChecklistItem, one Inspector certified for PRESCHOOL, one CENTER provider, two Complaints."
            - "Two COMPLAINT inspections of the SAME provider on different days (2026-08-05 and 2026-08-06, so the provider-visit buffer never applies), each carrying one RA-201/PRESCHOOL violation, each submitted CONDITIONAL_PASS and FINALIZED at 2026-08-01T00:00:00Z."
            - "The CAP submission window for both therefore ends at 2026-08-11T00:00:00Z inclusive."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Glenpark Center", county_code: "CTY-01", site_address: "31 Glenpark Ave", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RATIO", affected_age_group: "PRESCHOOL", narrative: "First ratio report.", anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp1: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RATIO", affected_age_group: "PRESCHOOL", narrative: "Second ratio report.", anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp2: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp1}" }
              as: LicensingSupervisor
              captures: { i1: $.data.id }
            - call: "POST /licensing/inspections/${i1}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${i1}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "Preschool room over ratio on the first visit." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v1: $.data.id }
            - call: "POST /licensing/inspections/${i1}/submit-for-review"
              payload: { outcome: "CONDITIONAL_PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${i1}/finalize"
              payload: {}
              as: LicensingSupervisor
              captures: { i1_ver: $.data.version }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-06T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp2}" }
              as: LicensingSupervisor
              captures: { i2: $.data.id }
            - call: "POST /licensing/inspections/${i2}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${i2}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "Preschool room over ratio on the second visit." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v2: $.data.id }
            - call: "POST /licensing/inspections/${i2}/submit-for-review"
              payload: { outcome: "CONDITIONAL_PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${i2}/finalize"
              payload: {}
              as: LicensingSupervisor
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:01Z" }
              as: AgencyAdmin
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${i1}", violation_ids: ["${v2}"], narrative: "Remediation plan naming the wrong visit's finding.", proposed_completion_date: "2026-08-20", expected_inspection_version: "${i1_ver}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${i1}", violation_ids: ["${v2}"], narrative: "Remediation plan naming the wrong visit's finding.", proposed_completion_date: "2026-08-20", expected_inspection_version: "${i1_ver}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/corrective-action-plans"
              payload: { inspection_id: "${i1}", violation_ids: ["${v1}"], narrative: "Remediation plan naming the correct finding.", proposed_completion_date: "2026-08-20", expected_inspection_version: "${i1_ver}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { cap: $.data.id }
          assert:
            - "Inspection.${i1}.finalized_at == \"2026-08-01T00:00:00Z\" and Inspection.${i2}.finalized_at == \"2026-08-01T00:00:00Z\"; Violation.${v1}.inspection_id == ${i1} and Violation.${v2}.inspection_id == ${i2}"
            - "at clock 2026-08-11T00:00:01Z the submission (window closed AND foreign violation — BOTH rules violated) returns ERR_CAP_WINDOW_CLOSED (409), the priority-71 business_temporal error, NOT ERR_VIOLATION_INSPECTION_MISMATCH"
            - "at clock 2026-08-11T00:00:00Z the identical payload returns ERR_VIOLATION_INSPECTION_MISMATCH (422) — the window edge is inclusive, so only the priority-86 referential rule is still violated"
            - "the third submission at the same instant, listing ${v1}, returns 201 with CorrectiveActionPlan.${cap}.status == \"SUBMITTED\", review_cycle_count == 1 and due_at == \"2026-08-21T00:00:00Z\" (2026-08-11 + CORRECTION_DAYS[SERIOUS] 10 days)"
            - "no CorrectiveActionPlan row exists for either refused submission, and Inspection.${i1}.version is unchanged at ${i1_ver} across all three attempts"
            - "ERR_STALE_INSPECTION_VERSION (priority 21) never appears — every attempt carries the current ${i1_ver}"

  # =======================================================================
  # Rule 6 — boundary / precision checks on four different metrics at four
  #          distinct endpoints
  #   1 = staff-ratio and group-size counts   @ PATCH  /age-group-rosters/{id}
  #   2 = enforcement point thresholds        @ POST   /enforcement-actions
  #   3 = incident reporting deadline instant @ POST   /serious-incident-reports
  #   4 = 2-decimal round_half_up direction   @ GET    /inspections/{id}/compliance-score
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_ratio_and_group_size_counts_on_roster_patch
        grounds:
          - calculations.ratio_group_size_supervision_verification
          - validations.priority_59_ERR_RATIO_NONCOMPLIANT
          - validations.priority_60_ERR_GROUP_SIZE_EXCEEDED
          - entities.AgeGroupRoster.fields.required_staff_count
          - entities.AgeGroupRoster.fields.approved_group_size
          - endpoints.PATCH_licensing_age_group_rosters
        distinguishing_aspect: |
          Metric: integer child/staff counts. On a licensed INFANT roster with
          approved_group_size 8 and AGE_GROUP_RATIO 4, enrolled_count 4 with one
          staff member is accepted and 5 is refused (ceil crosses at 4/5), and
          enrolled_count 8 is accepted while 9 is refused even with enough
          staff — the two boundaries sit one child apart on the same request.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One Inspector certified for all four age groups."
            - "One CENTER provider taken to LICENSED / PROVISIONAL through a clean INITIAL inspection (outcome PASS, zero violations), with four rosters INFANT 8 / TODDLER 12 / PRESCHOOL 20 / SCHOOL_AGE 20 summing to requested_capacity 60, all led by the cleared DIRECTOR."
            - "license-decision ISSUE therefore sets approved_group_size = requested_group_size on every roster, so the INFANT roster has approved_group_size 8."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Rosewood Center", county_code: "CTY-01", site_address: "41 Rosewood Ct", program_type: "CENTER", requested_capacity: 60 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Director", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], role_title: "Center Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { sm_dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "INFANT", requested_group_size: 8, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_inf: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "TODDLER", requested_group_size: 12, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "PRESCHOOL", requested_group_size: 20, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "SCHOOL_AGE", requested_group_size: 20, enrolled_count: 0, staff_assigned_count: 0, lead_staff_member_id: "${sm_dir}" }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/submit-application"
              payload: {}
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/providers/${prov}/clear-checks"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "INITIAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/providers/${prov}/license-decision"
              payload: { decision: "ISSUE" }
              as: LicensingSupervisor
          trigger:
            - call: "POST /licensing/age-group-rosters/${r_inf}/verify-ratio"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "PATCH /licensing/age-group-rosters/${r_inf}"
              payload: { enrolled_count: 4, staff_assigned_count: 1 }
              as: Applicant
              as_user_id: "${prov}"
            - call: "PATCH /licensing/age-group-rosters/${r_inf}"
              payload: { enrolled_count: 5 }
              as: Applicant
              as_user_id: "${prov}"
            - call: "PATCH /licensing/age-group-rosters/${r_inf}"
              payload: { enrolled_count: 5, staff_assigned_count: 2 }
              as: Applicant
              as_user_id: "${prov}"
            - call: "PATCH /licensing/age-group-rosters/${r_inf}"
              payload: { enrolled_count: 8, staff_assigned_count: 2 }
              as: Applicant
              as_user_id: "${prov}"
            - call: "PATCH /licensing/age-group-rosters/${r_inf}"
              payload: { enrolled_count: 9, staff_assigned_count: 3 }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/age-group-rosters/${r_inf}/verify-ratio"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
          assert:
            - "AgeGroupRoster.${r_inf}.approved_group_size == 8 after license-decision ISSUE and Provider.${prov}.licensed_capacity == 60"
            - "the empty-room edge: with enrolled_count 0 and staff_assigned_count 0, required_staff_count == 0, ratio_compliant == true, group_size_compliant == true, supervision_compliant == true, and verify-ratio returns 200 with last_verified_at == \"2026-08-01T00:00:00Z\""
            - "PATCH to enrolled_count 4 / staff 1 returns 200: required_staff_count == ceil(4/4) == 1 and ratio_compliant == true (>= not >)"
            - "PATCH to enrolled_count 5 while staff_assigned_count stays 1 returns ERR_RATIO_NONCOMPLIANT (409) because ceil(5/4) == 2 > 1; the row is unchanged with enrolled_count still 4"
            - "PATCH to enrolled_count 5 / staff 2 returns 200 with required_staff_count == 2 — the boundary is between 4 and 5 children, not between 4 and 8"
            - "PATCH to enrolled_count 8 / staff 2 returns 200: enrolled_count == effective_group_cap == min(8, AGE_GROUP_MAX_SIZE[INFANT] 8), so group_size_compliant == true at the exact cap"
            - "PATCH to enrolled_count 9 / staff 3 returns ERR_GROUP_SIZE_EXCEEDED (409) even though ceil(9/4) == 3 satisfies the ratio rule — the group-size boundary is one child higher than the last accepted value"
            - "the final verify-ratio returns 200 and the row still reads enrolled_count 8, staff_assigned_count 2, required_staff_count 2"
            - "no refused PATCH advanced AgeGroupRoster.${r_inf}.version"

      - name: boundary_enforcement_point_thresholds_on_proposal
        grounds:
          - calculations.enforcement_ladder_step
          - calculations.enforcement_fine_amount
          - validations.priority_81_ERR_LADDER_STEP_SKIP
          - validations.priority_82_ERR_NO_ENFORCEMENT_BASIS
          - entities.Provider.fields.open_violation_points
          - endpoints.POST_licensing_enforcement_actions
        distinguishing_aspect: |
          Metric: the integer open_violation_points ladder thresholds, each
          compared with >=. The four pinned points are 14 (no basis), 15
          (WARNING accepted, PROBATION refused), 30 (PROBATION accepted) and
          29 reached by vacating one MINOR (PROBATION refused again), which
          proves the threshold is re-read live rather than latched.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "ChecklistItems SU-102 CRITICAL, RA-201 SERIOUS, FA-401 MODERATE, NU-501 MINOR — all applicable to PRESCHOOL and none infant_sensitive."
            - "One Inspector certified for PRESCHOOL, one CENTER provider (license_status NONE, current_ladder_step 0), one Complaint."
            - "One IN_PROGRESS COMPLAINT inspection carrying RA-201 (8), FA-401 (4), NU-501 (1) and NU-501 (1) — 14 open points, since CITED violations already count."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-102", title: "Written supervision plan on file", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_su102: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "RA-201", title: "Staff-to-child ratio met", category: "RATIO", default_severity: "SERIOUS", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_ra: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "FA-401", title: "Indoor play area free of hazards", category: "FACILITY", default_severity: "MODERATE", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_fa: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "NU-501", title: "Menu posted and followed", category: "NUTRITION", default_severity: "MINOR", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_nu: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Thornhill Center", county_code: "CTY-01", site_address: "51 Thornhill Rd", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "WALK_IN", allegation_category: "FACILITY", affected_age_group: "PRESCHOOL", narrative: "Walk-in report of hazards and thin staffing.", anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_ra}", primary_age_group: "PRESCHOOL", narrative: "Preschool room over ratio." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_fa}", primary_age_group: "PRESCHOOL", narrative: "Loose decking board." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_nu}", primary_age_group: "PRESCHOOL", narrative: "Menu not posted in the hallway." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_minor1: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_nu}", primary_age_group: "PRESCHOOL", narrative: "Menu not posted in the classroom." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_minor2: $.data.id }
          trigger:
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "WARNING", rationale: "Fourteen open points." }
              as: LicensingSupervisor
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_nu}", primary_age_group: "PRESCHOOL", narrative: "Menu not posted in the kitchen." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_minor3: $.data.id }
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "PROBATION", rationale: "Fifteen open points; probation requested." }
              as: LicensingSupervisor
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "WARNING", rationale: "Fifteen open points; warning issued." }
              as: LicensingSupervisor
              captures: { act15: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su102}", primary_age_group: "PRESCHOOL", narrative: "No written supervision plan on file." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "PROBATION", rationale: "Thirty open points." }
              as: LicensingSupervisor
              captures: { act30: $.data.id }
            - call: "POST /licensing/violations/${v_minor3}/disposition"
              payload: { disposition: "VACATED", vacated_reason: "The kitchen menu was posted on the inside of the pantry door." }
              as: LicensingSupervisor
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "PROBATION", rationale: "Twenty-nine open points; probation requested again." }
              as: LicensingSupervisor
            - call: "POST /licensing/enforcement-actions"
              payload: { provider_id: "${prov}", requested_action_type: "WARNING", rationale: "Twenty-nine open points; warning issued." }
              as: LicensingSupervisor
              captures: { act29: $.data.id }
          assert:
            - "before the trigger Provider.${prov}.open_violation_points == 14 (8 + 4 + 1 + 1) and current_ladder_step == 0"
            - "at 14 points (WARNING_THRESHOLD - 1) the WARNING proposal returns ERR_NO_ENFORCEMENT_BASIS (409)"
            - "after the third MINOR citation open_violation_points == 15, exactly at WARNING_THRESHOLD"
            - "at 15 points the PROBATION proposal returns ERR_LADDER_STEP_SKIP (409) because LADDER_STEP[PROBATION] 2 > LADDER_STEP[WARNING] 1"
            - "at 15 points the WARNING proposal returns 201: EnforcementAction.${act15}.ladder_step == 1, basis_points == 15, fine_amount_cents == 37500 (gross 37500 -> tier T1 -> no surcharge, no credit)"
            - "after the CRITICAL citation open_violation_points == 30, exactly at PROBATION_THRESHOLD"
            - "at 30 points the PROBATION proposal returns 201: EnforcementAction.${act30}.ladder_step == 2, basis_points == 30, fine_amount_cents == 130625 (gross 50000 + 75000 = 125000 -> tier T2 -> surcharge 12500 -> net 137500 -> credit 6875)"
            - "vacating ${v_minor3} drops open_violation_points to 29 and lifetime_violation_points to 29 (a VACATED citation is removed from BOTH counters)"
            - "at 29 points (PROBATION_THRESHOLD - 1) the PROBATION proposal returns ERR_LADDER_STEP_SKIP (409) — the threshold is re-read from the provider's live counter, not from ${act30}.basis_points"
            - "at 29 points the WARNING proposal returns 201: EnforcementAction.${act29}.basis_points == 29 and fine_amount_cents == 72500 (gross 72500 -> tier T1)"
            - "EnforcementAction.${act15}.basis_points stays 15 and ${act30}.basis_points stays 30 — basis_points is frozen at proposal and never re-derived"
            - "Provider.${prov}.current_ladder_step is still 0 — three PROPOSED actions move nothing"

      - name: boundary_incident_reporting_deadline_inclusive_instant
        grounds:
          - calculations.incident_reporting_deadline
          - entities.SeriousIncidentReport.fields.reporting_deadline_at
          - entities.SeriousIncidentReport.fields.reporting_timeliness
          - entities.SeriousIncidentReport.fields.late_report_violation_created
          - validations.priority_69_ERR_INCIDENT_OCCURRED_IN_FUTURE
          - endpoints.POST_licensing_serious_incident_reports
        distinguishing_aspect: |
          Metric: an instant compared at one-second resolution against a
          type-specific window. Reporting at exactly reporting_deadline_at is
          TIMELY and one second later is LATE_REPORT, and this holds for the
          2-hour FATALITY window, the 24-hour SERIOUS_INJURY window and the
          72-hour COMMUNICABLE_DISEASE window alike.
        test_recipe:
          setup:
            - "One CENTER provider with NO finalized inspection, so the LATE_REPORT conditional cascade has an empty candidate set and can never fire."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Lakeshore Center", county_code: "CTY-01", site_address: "61 Lakeshore Blvd", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "FATALITY", occurred_at: "2026-08-05T10:00:00Z", affected_child_age_group: "INFANT", narrative: "An infant was found unresponsive during nap time and did not survive." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep_fat_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T12:00:01Z" }
              as: AgencyAdmin
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "FATALITY", occurred_at: "2026-08-05T10:00:00Z", affected_child_age_group: "INFANT", narrative: "Duplicate filing of the same fatality one second past the window." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep_fat_late: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "SERIOUS_INJURY", occurred_at: "2026-08-05T00:00:00Z", affected_child_age_group: "TODDLER", narrative: "A toddler required stitches after a fall from the climber." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep_inj_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:01Z" }
              as: AgencyAdmin
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "SERIOUS_INJURY", occurred_at: "2026-08-05T00:00:00Z", affected_child_age_group: "TODDLER", narrative: "Second serious injury filing one second past the window." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep_inj_late: $.data.id }
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "MEDICATION_ERROR", occurred_at: "2026-08-06T00:00:02Z", affected_child_age_group: "PRESCHOOL", narrative: "A dose was recorded with a timestamp one second in the future." }
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/serious-incident-reports"
              payload: { provider_id: "${prov}", incident_type: "COMMUNICABLE_DISEASE", occurred_at: "2026-08-05T00:00:00Z", affected_child_age_group: "SCHOOL_AGE", narrative: "A confirmed pertussis case in the school-age group." }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rep_dis_ok: $.data.id }
          assert:
            - "SeriousIncidentReport.${rep_fat_ok}.reporting_deadline_at == \"2026-08-05T12:00:00Z\" (occurred_at + 2h) and reporting_timeliness == \"TIMELY\" — reporting AT the deadline instant is timely"
            - "SeriousIncidentReport.${rep_fat_late}.reporting_deadline_at == \"2026-08-05T12:00:00Z\" and reporting_timeliness == \"LATE_REPORT\" — one second later flips it"
            - "SeriousIncidentReport.${rep_inj_ok}.reporting_deadline_at == \"2026-08-06T00:00:00Z\" (occurred_at + 24h) and reporting_timeliness == \"TIMELY\""
            - "SeriousIncidentReport.${rep_inj_late}.reporting_timeliness == \"LATE_REPORT\" at clock 2026-08-06T00:00:01Z"
            - "SeriousIncidentReport.${rep_dis_ok}.reporting_deadline_at == \"2026-08-08T00:00:00Z\" (occurred_at + 72h) and reporting_timeliness == \"TIMELY\" at exactly that instant"
            - "the MEDICATION_ERROR filing with occurred_at one second after the clock returns ERR_INCIDENT_OCCURRED_IN_FUTURE (422) and creates no row"
            - "every created report has status \"REPORTED\", reported_at equal to the clock at submission, and late_report_violation_created == false — including both LATE_REPORT rows, because the provider has no FINALIZED inspection to cite against"
            - "Provider.${prov}.open_violation_points is still 0 after all five accepted filings"

      - name: boundary_round_half_up_at_two_decimals_in_compliance_score
        grounds:
          - calculations.inspection_compliance_score
          - calculations.violation_point_assessment
          - entities.Inspection.fields.raw_deduction_points
          - endpoints.GET_licensing_inspections_compliance_score
        distinguishing_aspect: |
          Metric: the rounding DIRECTION at exactly two decimal places, not the
          order of operations. All three line products land on a trailing 5 in
          the third decimal — 30.705, 13.125 and 0.875 — so round_half_up gives
          44.72 and a score of 55.28, while truncation gives 55.31 and a
          single end-of-sum rounding gives 55.29.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "ChecklistItems SU-101 CRITICAL infant_sensitive true, SU-102 CRITICAL infant_sensitive false, NU-501 MINOR infant_sensitive false, all applicable to INFANT and SCHOOL_AGE."
            - "One Inspector certified for INFANT and SCHOOL_AGE, one CENTER provider, one Complaint."
            - "A COMPLAINT inspection with age_groups_observed [INFANT, SCHOOL_AGE] carrying SU-101/INFANT (23 points), SU-102/SCHOOL_AGE (15 points) and NU-501/SCHOOL_AGE (1 point), submitted FAIL and FINALIZED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su101: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-102", title: "Written supervision plan on file", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_su102: $.data.id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "NU-501", title: "Menu posted and followed", category: "NUTRITION", default_severity: "MINOR", age_groups_applicable: ["INFANT", "SCHOOL_AGE"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_nu: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["INFANT", "SCHOOL_AGE"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Stonebridge Center", county_code: "CTY-01", site_address: "71 Stonebridge Ln", program_type: "CENTER", requested_capacity: 28 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "WEB", allegation_category: "SUPERVISION", affected_age_group: "INFANT", narrative: "Web report of unsupervised infants and missing paperwork.", alleged_serious_harm: true, anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["INFANT", "SCHOOL_AGE"], duration_minutes: 120, complaint_id: "${cmp}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su101}", primary_age_group: "INFANT", narrative: "Infant room unattended." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_a: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_su102}", primary_age_group: "SCHOOL_AGE", narrative: "No written supervision plan for the school-age group." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_b: $.data.id }
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_nu}", primary_age_group: "SCHOOL_AGE", narrative: "Menu not posted for the school-age group." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
              captures: { v_c: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "FAIL", age_groups_observed: ["INFANT", "SCHOOL_AGE"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
          trigger:
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "FINAL" }
              as: LicensingSupervisor
              captures: { score_final: $.data.compliance_score, raw_final: $.data.raw_deduction }
            - call: "GET /licensing/inspections/${insp_id}/compliance-score"
              payload: { variant: "PRELIMINARY" }
              as: LicensingSupervisor
              captures: { score_prelim: $.data.compliance_score }
          assert:
            - "Violation.${v_a}.assessed_points == 23 and infant_exposure == true; Violation.${v_b}.assessed_points == 15 and infant_exposure == false; Violation.${v_c}.assessed_points == 1 and infant_exposure == false"
            - "line 1 = 23 * 1.335 = 30.705 -> round_half_up -> 30.71 (NOT 30.70)"
            - "line 2 = 15 * 0.875 = 13.125 -> round_half_up -> 13.13 (NOT 13.12)"
            - "line 3 = 1 * 0.875 = 0.875 -> round_half_up -> 0.88 (NOT 0.87)"
            - "${raw_final} == 44.72 and Inspection.${insp_id}.raw_deduction_points == 44.72"
            - "${score_final} == 55.28 and Inspection.${insp_id}.final_compliance_score == 55.28"
            - "${score_prelim} == 55.28 as well, and Inspection.${insp_id}.preliminary_compliance_score == 55.28 — every violation is CORRECTION_PENDING so the two variants agree here; the claim under test is the rounding direction, not the variant"
            - "a truncating implementation returns raw 44.69 and score 55.31; a single end-of-sum rounding returns raw 44.71 and score 55.29; neither value may appear"
            - "Inspection.${insp_id}.violation_count == 3"

  # =======================================================================
  # Rule 7 — cross-entity state dependency, four distinct entity pairs
  #   1 = Inspection      <-> Provider/BackgroundCheck clearance
  #   2 = PublicReportPosting <-> Complaint
  #   3 = CorrectiveActionPlan <-> Inspection
  #   4 = SeriousIncidentReport <-> Complaint
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_inspection_finalize_requires_provider_clearance
        grounds:
          - state_machines.Inspection.transitions.PENDING_REVIEW_to_FINALIZED
          - calculations.provider_clearance_completeness
          - validations.priority_55_ERR_CLEARANCE_INCOMPLETE
          - entities.Provider.fields.clearance_complete
          - entities.BackgroundCheck.fields.status
          - endpoints.POST_licensing_inspections_finalize
        distinguishing_aspect: |
          Pair: Inspection x (Provider, BackgroundCheck). Finalizing an INITIAL
          inspection is refused while the provider's director is missing one of
          the two REQUIRED_CHECK_TYPES, and the very same finalize call succeeds
          once that second check is CLEARED — nothing about the Inspection row
          itself changed between the two attempts.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "One Inspector certified for PRESCHOOL, one CENTER provider with a single DIRECTOR whose FBI_FINGERPRINT check is CLEARED but whose CHILD_ABUSE_REGISTRY check is still SUBMITTED."
            - "An INITIAL inspection scheduled, started and submitted PASS (zero violations), sitting in PENDING_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Fernbank Center", county_code: "CTY-01", site_address: "81 Fernbank Way", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Director", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Center Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { sm_dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc_fbi: $.data.id }
            - call: "POST /licensing/background-checks/${bc_fbi}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${sm_dir}", check_type: "CHILD_ABUSE_REGISTRY" }
              as: BackgroundCheckUnit
              captures: { bc_car: $.data.id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              payload: {}
              as: Applicant
              as_user_id: "${prov}"
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "INITIAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120 }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
          trigger:
            - call: "POST /licensing/providers/${prov}/clear-checks"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/background-checks/${bc_car}/result"
              payload: { result: "CLEARED" }
              as: BackgroundCheckUnit
            - call: "POST /licensing/providers/${prov}/clear-checks"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
          assert:
            - "before the trigger Provider.${prov}.clearance_complete == false (the director covers only 1 of the 2 REQUIRED_CHECK_TYPES) and application_status == \"SUBMITTED\""
            - "the first clear-checks returns ERR_CLEARANCE_INCOMPLETE (409) and application_status stays \"SUBMITTED\""
            - "the first finalize returns ERR_CLEARANCE_INCOMPLETE (409); Inspection.${insp_id}.status is still \"PENDING_REVIEW\", finalized_at is null, and Inspection.${insp_id}.version is unchanged by the refusal"
            - "clearing ${bc_car} sets StaffMember.${sm_dir}.clearance_status == \"CLEARED\" and flips Provider.${prov}.clearance_complete to true with no change to the Inspection"
            - "the second clear-checks returns 200 and application_status == \"CHECKS_CLEARED\""
            - "the second finalize returns 200: status == \"FINALIZED\", preliminary_compliance_score == 100.00, final_compliance_score == 100.00, violation_count == 0, cap_required == false"
            - "the finalize side effect for an INITIAL inspection with outcome PASS moves Provider.${prov}.application_status to \"INITIAL_INSPECTION_PASSED\""
            - "the identical request body succeeded the second time — the gate is the state of a different entity, not of the Inspection"

      - name: cross_entity_posting_publish_blocked_by_open_investigation
        grounds:
          - state_machines.PublicReportPosting.transitions.PENDING_REDACTION_to_POSTED
          - state_machines.Complaint.transitions.SCREENED_IN_to_UNDER_INVESTIGATION
          - validations.priority_63_ERR_POSTING_BLOCKED_OPEN_INVESTIGATION
          - validations.priority_64_ERR_REDACTION_INCOMPLETE
          - calculations.public_display_score
          - endpoints.POST_licensing_public_report_postings_post
        distinguishing_aspect: |
          Pair: PublicReportPosting x Complaint. Publication is refused while
          ANY complaint against the provider sits in UNDER_INVESTIGATION —
          including the very complaint the posted inspection came from — and the
          same publish call succeeds the moment that complaint reaches DETERMINED,
          with the display score read from the provider's ladder state at publish
          time.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z; advanced to 2026-08-05T13:00:00Z before the trigger."
            - "ChecklistItem FA-401 MODERATE, PRESCHOOL, not infant_sensitive."
            - "One Inspector certified for PRESCHOOL, one CENTER provider at current_ladder_step 0."
            - "Complaint A (FACILITY / PRESCHOOL) screened in and assigned to the inspector, so it is UNDER_INVESTIGATION."
            - "A COMPLAINT inspection for complaint A carrying one FA-401 violation, submitted CONDITIONAL_PASS and FINALIZED."
            - "Two postings are prepared for two different inspections: one with redaction_complete false and one with redaction_complete true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "FA-401", title: "Indoor play area free of hazards", category: "FACILITY", default_severity: "MODERATE", age_groups_applicable: ["PRESCHOOL"], infant_sensitive: false }
              as: AgencyAdmin
              captures: { ci_fa: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ada Inspector", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"], max_daily_visits: 3 }
              as: AgencyAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Glenmoor Center", county_code: "CTY-01", site_address: "91 Glenmoor Ave", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "FACILITY", affected_age_group: "PRESCHOOL", narrative: "Caller reports a broken gate on the playground.", complainant_name: "R. Calloway", anonymous: false }
              as: ComplaintIntakeSpecialist
              captures: { cmp_a: $.data.id }
            - call: "POST /licensing/complaints/${cmp_a}/screen"
              payload: { decision: "SCREEN_IN" }
              as: ComplaintIntakeSpecialist
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp_a}", inspection_type: "COMPLAINT", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"], duration_minutes: 120, complaint_id: "${cmp_a}" }
              as: LicensingSupervisor
              captures: { insp_id: $.data.id }
            - call: "POST /licensing/complaints/${cmp_a}/assign-investigator"
              payload: { investigator_id: "${insp_a}" }
              as: LicensingSupervisor
            - call: "POST /licensing/inspections/${insp_id}/start"
              payload: {}
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${insp_id}", checklist_item_id: "${ci_fa}", primary_age_group: "PRESCHOOL", narrative: "Playground gate latch broken." }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/submit-for-review"
              payload: { outcome: "CONDITIONAL_PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp_a}"
            - call: "POST /licensing/inspections/${insp_id}/finalize"
              payload: {}
              as: LicensingSupervisor
            - call: "POST /licensing/public-report-postings"
              payload: { inspection_id: "${insp_id}", consumer_summary: "One moderate facility finding was corrected during the visit.", redaction_complete: false }
              as: AgencyAdmin
              captures: { post_a: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T13:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/public-report-postings/${post_a}/post"
              payload: {}
              as: AgencyAdmin
            - call: "POST /licensing/complaints/${cmp_a}/determination"
              payload: { determination: "INCONCLUSIVE" }
              as: ComplaintInvestigator
              as_user_id: "${insp_a}"
            - call: "POST /licensing/public-report-postings/${post_a}/post"
              payload: {}
              as: AgencyAdmin
          assert:
            - "Inspection.${insp_id}.final_compliance_score == 96.00 (one MODERATE PRESCHOOL violation: 4 * 1.000 * 1.000 = 4.00) and violation_count == 1"
            - "PublicReportPosting.${post_a} starts in \"PENDING_REDACTION\" with correction_count == 0, display_score null and redaction_complete false"
            - "the first post returns ERR_POSTING_BLOCKED_OPEN_INVESTIGATION (409) even though redaction_complete is ALSO false: priority 63 (the cross-entity gate) outranks priority 64 (the local redaction gate), and Complaint.${cmp_a}.status == \"UNDER_INVESTIGATION\" at that instant"
            - "after the INCONCLUSIVE determination Complaint.${cmp_a}.status == \"DETERMINED\", timeliness_flag == \"ON_TIME\", and NO violation was auto-cited (the substantiation cascade fires only for SUBSTANTIATED)"
            - "the second post now returns ERR_REDACTION_INCOMPLETE (409) — resolving the sibling Complaint changed WHICH error is reported, which is only possible if the cross-entity gate was the one that fired first; clearing the complaint cannot repair the posting's own flag"
            - "Provider.${prov}.open_violation_points is still 4 and current_ladder_step is still 0 after all four calls"
            - "PublicReportPosting.${post_a}.posting_status is still \"PENDING_REDACTION\" and posted_at is null"
          followup_recipe: |
            The postable half of the pair needs a second inspection whose posting
            carries redaction_complete true, because redaction_complete is set at
            creation and no endpoint updates it:
              - POST /licensing/complaints (provider ${prov}, RATIO / PRESCHOOL)      -> cmp_b, RECEIVED
              - POST /licensing/complaints/${cmp_b}/screen {decision: SCREEN_IN}      -> SCREENED_IN
              - POST /licensing/inspections (COMPLAINT, complaint_id ${cmp_b},
                  inspector ${insp_a}, scheduled_for 2026-08-12T09:00:00Z)            -> insp_b
              - POST .../assign-investigator {investigator_id: ${insp_a}}             -> cmp_b UNDER_INVESTIGATION
              - start / submit-for-review {outcome: PASS} / finalize on insp_b        -> FINALIZED, score 100.00
              - POST /licensing/public-report-postings
                  {inspection_id: ${insp_b}, redaction_complete: true}                -> post_b, PENDING_REDACTION
              - POST /licensing/public-report-postings/${post_b}/post
                  -> ERR_POSTING_BLOCKED_OPEN_INVESTIGATION (409): redaction passes,
                     but cmp_b is UNDER_INVESTIGATION
              - POST /licensing/complaints/${cmp_b}/determination {INCONCLUSIVE}      -> DETERMINED
              - POST /licensing/public-report-postings/${post_b}/post
                  -> 200: posting_status POSTED, posted_at == the clock,
                     expires_at == posted_at + 36 months, enforcement_banner NONE
                     (current_ladder_step 0), display_score == 100.00
            The assign-investigator call for cmp_b must precede insp_b's finalize:
            once insp_b is FINALIZED by ${insp_a}, the segregation-of-duties rule
            blocks assigning that same person as investigator.

      - name: cross_entity_cap_submission_requires_finalized_inspection
        grounds:
          - state_machines.CorrectiveActionPlan.transitions.SUBMITTED_to_APPROVED
          - validations.priority_42_ERR_INVALID_INSPECTION_STATE
