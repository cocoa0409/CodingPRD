            - "GET /api/volunteers/${v1_id}: standing == SUSPENDED"
            - "GET /api/shift-signups/${s1_id}: status == CANCELLED (link 1)"
            - "GET /api/shift-signups/${s3_id}: status == CONFIRMED and waitlist_position == null (link 2 promotion)"
            - "GET /api/shift-signups/${s2_id}: status == CONFIRMED (unaffected)"
            - "GET /api/shift-slots/${slot_id}: confirmed_count == 2 and status == FULL"

  - rule_id: priority_pair_validation_conflict
