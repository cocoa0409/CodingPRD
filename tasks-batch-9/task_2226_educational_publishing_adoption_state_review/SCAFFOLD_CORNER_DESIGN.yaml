              as: StateAdoptionOfficer
              as_user_id: "${st_nv_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000012001", subject: "MATH", grade_low: 1, grade_high: 1, copyright_year: 2026, content_tags: ["NUMBER_SENSE"], page_count: 240, signature_page_capacity: 384, list_price_cents: 8100 }
              as: PublisherEditor
              captures: { ttl_a_id: $.data.id }
            - call: "POST /titles/${ttl_a_id}/release"
