# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Electrical Supply Distributor — 9 Difficulty Rules x 2 instances
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: release_billing_firm_vs_escalation
        grounds:
          - calculations.billed_release_line_amount
          - calculations.escalation_index_ratio
          - entities.JobAccount.fields.pricing_mode
        distinguishing_aspect: |
          Same 200-ft THHN-12CU line, same quote price, same index move: a
          FIRM_PRICE job bills 10550 cents while an ESCALATION job bills 11455
          cents — two valid pricing variants on the ReleaseLine/Quote domain
          produce different billed totals (the rebate domain variant is the
          sibling instance).
        test_recipe:
          setup:
            - "Contractor C (limit 10000000); catalog item THHN-12CU (Southwire, FOOT, 45.25 c/ft, reel 500, min_cut 50, cut charge 1500) with 1000 ft on hand"
            - "Index reading 2026-08 = 100.0 posted before award; clock at default 2026-08-01"
            - "JF = FIRM_PRICE job, JE = ESCALATION job (uncapped); each has an awarded quote with one line: THHN-12CU qty 200 @ 45.25"
            - "Each job has a release [{THHN-12CU, 200}] that is credit-approved, allocated, scheduled (distinct trucks), and delivered"
            - "Clock advanced to 2026-09-05 and index 2026-09 = 110.0 posted before invoicing"
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Acme Electric", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "THHN-12CU", manufacturer_name: "Southwire", sell_uom: "FOOT", list_price_cents: 45.25, reel_length_ft: 500, min_cut_ft: 50, cut_charge_cents: 1500 }
              as: WarehouseManager
              captures: { thhn_id: $.data.id }
            - call: "POST /distributor/catalog-items/${thhn_id}/stock-receipts"
              payload: { qty: 1000 }
              as: WarehouseManager
            - call: "POST /distributor/_index-readings/set"
              payload: { month: "2026-08", index_value: 100.0 }
              as: BranchManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Firm Job", jobsite_address: "1 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { jf_id: $.data.id, jf_v: $.data.version }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Esc Job", jobsite_address: "2 Site Rd", pricing_mode: "ESCALATION" }
              as: SalesRep
              captures: { je_id: $.data.id, je_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${jf_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { qf_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${qf_id}", catalog_item_id: "${thhn_id}", qty: 200, unit_price_cents: 45.25 }
              as: SalesRep
            - call: "POST /distributor/quotes/${qf_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${qf_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${je_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { qe_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${qe_id}", catalog_item_id: "${thhn_id}", qty: 200, unit_price_cents: 45.25 }
              as: SalesRep
            - call: "POST /distributor/quotes/${qe_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${qe_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${jf_id}", quote_id: "${qf_id}", expected_job_account_version: "${jf_v}", lines: [{ catalog_item_id: "${thhn_id}", qty: 200 }] }
              as: SalesRep
              captures: { rf_id: $.data.id }
            - call: "POST /distributor/releases/${rf_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${rf_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${rf_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-10", window_start_hour: 8, window_end_hour: 12 }
              as: Dispatcher
            - call: "POST /distributor/releases/${rf_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${je_id}", quote_id: "${qe_id}", expected_job_account_version: "${je_v}", lines: [{ catalog_item_id: "${thhn_id}", qty: 200 }] }
              as: SalesRep
              captures: { re_id: $.data.id }
            - call: "POST /distributor/releases/${re_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${re_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${re_id}/schedule"
              payload: { truck_id: "T2", delivery_date: "2026-08-10", window_start_hour: 8, window_end_hour: 12 }
              as: Dispatcher
            - call: "POST /distributor/releases/${re_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "POST /distributor/_index-readings/set"
              payload: { month: "2026-09", index_value: 110.0 }
              as: BranchManager
            - call: "POST /distributor/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /distributor/releases/${rf_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${re_id}/invoice"
              payload: {}
              as: CreditManager
          assert:
            - "Release.${rf_id}.billed_total_cents == 10550  (FIRM: round(200 x 45.25) + 1500 cut charge)"
            - "Release.${re_id}.billed_total_cents == 11455  (ESCALATION: ratio 1.10, eff 49.7750 c/ft, round(200 x 49.775) + 1500)"
            - "Release.${re_id}.billed_total_cents - Release.${rf_id}.billed_total_cents == 905"

      - name: rebate_provisional_vs_final_rounding
        grounds:
          - calculations.rebate_claim_amounts
          - entities.RebateClaim.fields.provisional_amount_cents
          - entities.RebateClaim.fields.final_amount_cents
        distinguishing_aspect: |
          Same qualifying base (two 1010-cent Southwire lines): the provisional
          variant rounds the sum once (101) while the final variant rounds per
          line then sums (102) — a dual-variant calculation on the
          RebateClaim/RebateProgram domain, distinct from release billing.
        test_recipe:
          setup:
            - "Contractor C (limit 10000000); item SWD-SENSOR (Southwire, EA, 1010 c) with 10 on hand"
            - "FIRM job J; awarded quote with line SWD-SENSOR qty 1 @ 1010 (each release re-quotes the same line)"
            - "Two releases R1, R2 each [{SWD-SENSOR, 1}] fully invoiced on 2026-08-01 (in period 2026-08-01..2026-08-31)"
            - "RebateProgram Southwire period 2026-08-01..2026-08-31, tiers [{threshold_cents: 0, rebate_pct: 0.05}]"
            - "Claim created while clock is 2026-08-01 (provisional), clock advanced to 2026-09-01 before submit"
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Beta Electric", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "SWD-SENSOR", manufacturer_name: "Southwire", sell_uom: "EA", list_price_cents: 1010 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/catalog-items/${item_id}/stock-receipts"
              payload: { qty: 10 }
              as: WarehouseManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Rebate Job", jobsite_address: "3 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 2, unit_price_cents: 1010 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r1_id: $.data.id }
            - call: "POST /distributor/releases/${r1_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r1_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${r1_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-02", window_start_hour: 8, window_end_hour: 10 }
              as: Dispatcher
            - call: "POST /distributor/releases/${r1_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "POST /distributor/releases/${r1_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "GET /distributor/job-accounts/${j_id}"
              as: SalesRep
              captures: { j_v2: $.data.version }
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v2}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r2_id: $.data.id }
            - call: "POST /distributor/releases/${r2_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r2_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${r2_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-03", window_start_hour: 8, window_end_hour: 10 }
              as: Dispatcher
            - call: "POST /distributor/releases/${r2_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "POST /distributor/releases/${r2_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/rebate-programs"
              payload: { manufacturer_name: "Southwire", period_start: "2026-08-01", period_end: "2026-08-31", tiers: [{ threshold_cents: 0, rebate_pct: 0.05 }] }
              as: RebateClerk
              captures: { prog_id: $.data.id }
            - call: "POST /distributor/rebate-claims"
              payload: { rebate_program_id: "${prog_id}" }
              as: RebateClerk
              captures: { claim_id: $.data.id, prov_amt: $.data.provisional_amount_cents }
            - call: "POST /distributor/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /distributor/rebate-claims/${claim_id}/submit"
              payload: {}
              as: RebateClerk
          assert:
            - "RebateClaim.${claim_id}.provisional_amount_cents == 101  (round_half_up(2020 x 0.05))"
            - "RebateClaim.${claim_id}.qualifying_base_cents == 2020"
            - "RebateClaim.${claim_id}.tier_pct_applied == 0.05"
            - "RebateClaim.${claim_id}.final_amount_cents == 102  (2 x round_half_up(1010 x 0.05) = 2 x 51)"
            - "RebateClaim.${claim_id}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cut_charge_reel_boundary_extension
        grounds:
          - calculations.billed_release_line_amount
          - entities.CatalogItem.fields.reel_length_ft
          - entities.CatalogItem.fields.cut_charge_cents
        distinguishing_aspect: |
          Mode (a): the FOOT extension formula combines qty, unit price, reel
          length, and cut charge with a conditional branch — 499 ft (< 500-ft
          reel) bills 24080 cents including the 1500-cent cut charge while
          500 ft (== reel) bills 22625 cents with no cut charge.
        test_recipe:
          setup:
            - "Contractor C (limit 10000000); THHN-12CU FOOT item (45.25 c/ft, reel 500, min_cut 50, cut charge 1500) with 1200 ft on hand"
            - "FIRM job J; awarded quote with two lines: THHN qty 499 @ 45.25 and THHN qty 500 @ 45.25"
            - "Two releases fully delivered: RA [{THHN, 499}] and RB [{THHN, 500}]"
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Gamma Electric", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "THHN-12CU", manufacturer_name: "Southwire", sell_uom: "FOOT", list_price_cents: 45.25, reel_length_ft: 500, min_cut_ft: 50, cut_charge_cents: 1500 }
              as: WarehouseManager
              captures: { thhn_id: $.data.id }
            - call: "POST /distributor/catalog-items/${thhn_id}/stock-receipts"
              payload: { qty: 1200 }
              as: WarehouseManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Cut Job", jobsite_address: "4 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${thhn_id}", qty: 499, unit_price_cents: 45.25 }
              as: SalesRep
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${thhn_id}", qty: 500, unit_price_cents: 45.25 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${thhn_id}", qty: 499 }] }
              as: SalesRep
              captures: { ra_id: $.data.id }
            - call: "POST /distributor/releases/${ra_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${ra_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${ra_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-05", window_start_hour: 8, window_end_hour: 10 }
              as: Dispatcher
            - call: "POST /distributor/releases/${ra_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "GET /distributor/job-accounts/${j_id}"
              as: SalesRep
              captures: { j_v2: $.data.version }
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v2}", lines: [{ catalog_item_id: "${thhn_id}", qty: 500 }] }
              as: SalesRep
              captures: { rb_id: $.data.id }
            - call: "POST /distributor/releases/${rb_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${rb_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${rb_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-06", window_start_hour: 8, window_end_hour: 10 }
              as: Dispatcher
            - call: "POST /distributor/releases/${rb_id}/deliver"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /distributor/releases/${ra_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${rb_id}/invoice"
              payload: {}
              as: CreditManager
          assert:
            - "Release.${ra_id}.billed_total_cents == 24080  (round_half_up(499 x 45.25) = 22580, plus 1500 cut charge because 499 < 500)"
            - "Release.${rb_id}.billed_total_cents == 22625  (round_half_up(500 x 45.25) = 22625, no cut charge because 500 >= reel_length 500)"

      - name: rebate_round_per_line_then_sum_pinned
        grounds:
          - calculations.rebate_claim_amounts
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — the final claim rounds each
          qualifying line then sums (2 x round(1015 x 0.10) = 2 x 102 = 204),
          which differs from rounding the total once (round(2030 x 0.10) =
          203, the provisional figure on the same data).
        test_recipe:
          setup:
            - "Contractor C; item SWD-RELAY (Southwire, EA, 1015 c) with 10 on hand; FIRM job with awarded quote line qty 2 @ 1015"
            - "Two releases each [{SWD-RELAY, 1}] invoiced inside program period 2026-08-01..2026-08-31"
            - "Program Southwire tiers [{threshold_cents: 0, rebate_pct: 0.10}]; claim created (provisional) then clock moved past period end"
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Delta Electric", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "SWD-RELAY", manufacturer_name: "Southwire", sell_uom: "EA", list_price_cents: 1015 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/catalog-items/${item_id}/stock-receipts"
              payload: { qty: 10 }
              as: WarehouseManager
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Rounding Job", jobsite_address: "5 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id, j_v: $.data.version }
            - call: "POST /distributor/quotes"
              payload: { job_account_id: "${j_id}", valid_until: "2027-01-01" }
              as: SalesRep
              captures: { q_id: $.data.id }
            - call: "POST /distributor/quote-lines"
              payload: { quote_id: "${q_id}", catalog_item_id: "${item_id}", qty: 2, unit_price_cents: 1015 }
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
            - call: "POST /distributor/quotes/${q_id}/award"
              payload: {}
              as: BranchManager
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r1_id: $.data.id }
            - call: "POST /distributor/releases/${r1_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r1_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${r1_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-02", window_start_hour: 8, window_end_hour: 10 }
              as: Dispatcher
            - call: "POST /distributor/releases/${r1_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "POST /distributor/releases/${r1_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "GET /distributor/job-accounts/${j_id}"
              as: SalesRep
              captures: { j_v2: $.data.version }
            - call: "POST /distributor/releases"
              payload: { job_account_id: "${j_id}", quote_id: "${q_id}", expected_job_account_version: "${j_v2}", lines: [{ catalog_item_id: "${item_id}", qty: 1 }] }
              as: SalesRep
              captures: { r2_id: $.data.id }
            - call: "POST /distributor/releases/${r2_id}/credit-approve"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/releases/${r2_id}/allocate"
              payload: {}
              as: WarehouseManager
            - call: "POST /distributor/releases/${r2_id}/schedule"
              payload: { truck_id: "T1", delivery_date: "2026-08-03", window_start_hour: 8, window_end_hour: 10 }
              as: Dispatcher
            - call: "POST /distributor/releases/${r2_id}/deliver"
              payload: {}
              as: Dispatcher
            - call: "POST /distributor/releases/${r2_id}/invoice"
              payload: {}
              as: CreditManager
            - call: "POST /distributor/rebate-programs"
              payload: { manufacturer_name: "Southwire", period_start: "2026-08-01", period_end: "2026-08-31", tiers: [{ threshold_cents: 0, rebate_pct: 0.10 }] }
              as: RebateClerk
              captures: { prog_id: $.data.id }
            - call: "POST /distributor/rebate-claims"
              payload: { rebate_program_id: "${prog_id}" }
              as: RebateClerk
              captures: { claim_id: $.data.id }
            - call: "POST /distributor/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BranchManager
          trigger:
            - call: "POST /distributor/rebate-claims/${claim_id}/submit"
              payload: {}
              as: RebateClerk
          assert:
            - "RebateClaim.${claim_id}.provisional_amount_cents == 203  (sum-then-round: round_half_up(2030 x 0.10))"
            - "RebateClaim.${claim_id}.final_amount_cents == 204  (per-line-then-sum: 2 x round_half_up(1015 x 0.10) = 2 x 102)"
            - "RebateClaim.${claim_id}.final_amount_cents != RebateClaim.${claim_id}.provisional_amount_cents"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revise_cycle
        grounds:
          - state_machines.Quote.SUBMITTED_to_DRAFT
          - state_machines.Quote.DRAFT_to_SUBMITTED
          - concurrency_rules[quote-revise-stale-quote]
        distinguishing_aspect: |
          Cyclic machine on Quote: SUBMITTED -> DRAFT (revise) -> SUBMITTED ->
          AWARDED; revision_no increments (1 -> 2) across the loop and the
          re-submitted quote remains awardable.
        test_recipe:
          setup:
            - "Contractor, FIRM job, quote valid_until 2027-01-01 with one EA line; quote submitted (version 2 after submit)"
          setup_api_calls:
            - call: "POST /distributor/contractors"
              payload: { name: "Echo Electric", credit_limit_cents: 10000000 }
              as: CreditManager
              captures: { c_id: $.data.id }
            - call: "POST /distributor/catalog-items"
              payload: { sku: "BRK-20A", manufacturer_name: "SquareD", sell_uom: "EA", list_price_cents: 2500 }
              as: WarehouseManager
              captures: { item_id: $.data.id }
            - call: "POST /distributor/job-accounts"
              payload: { contractor_id: "${c_id}", job_name: "Cycle Job", jobsite_address: "6 Site Rd", pricing_mode: "FIRM_PRICE" }
              as: SalesRep
              captures: { j_id: $.data.id }
            - call: "POST /distributor/quotes"
