  - rule_id: resource_temporal_overlap
    instances:

      - name: quote_expiry_interval_half_open_at_expires_at
        grounds:
          - calculations.appeal_window_check
          - entities.Quote.fields.expires_at
          - validations[priority=9]
        distinguishing_aspect: |
          Interval semantics — validity window half-openness on the Quote
          resource: a quote created at 2026-09-01T00:00:00Z expires at
          2026-10-01T00:00:00Z; an application submitted at exactly
          2026-10-01T00:00:00Z is REJECTED with ERR_QUOTE_EXPIRED (the window is
          [created, expires_at) — end-exclusive), while one second earlier is
          accepted.
        test_recipe:
          setup:
            - "Clock starts 2026-09-01T00:00:00Z. Cause; cohort 2026 OPEN. State MT: APPROVED PCT filing cap 0.30; ACTIVE FeeConfig pct 0.20."
            - "Two MT policyholders P and Q, each with a quote created at 2026-09-01T00:00:00Z (expires_at 2026-10-01T00:00:00Z)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /causes"
              payload: { name: "C" }
              as: PlatformAdmin
              captures: { cause_id: $.data.id }
            - call: "POST /cohorts"
              payload: { cohort_year: 2026, cause_id: "${cause_id}" }
              as: PlatformAdmin
            - call: "POST /rate-filings"
              payload: { state_code: "MT", max_flat_fee_pct: 0.30, max_flat_fee_cap_cents: 90000, filing_mode: "PCT_OF_PREMIUM" }
              as: UnderwritingAdmin
              captures: { filing_mt: $.data.id }
