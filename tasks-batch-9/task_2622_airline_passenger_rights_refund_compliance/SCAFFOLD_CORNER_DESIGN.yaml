  - section: errors
    instances:
      - name: missing_identity_headers_rejected_before_any_body_parsing
        claim_type: error_triggerable
        grounds: ["validations[priority 1]", "errors.ERR_UNAUTHENTICATED"]
        distinguishing_aspect: "Priority 1 runs before request-shape validation, so a create with NO X-User-Role and NO X-User-ID returns ERR_UNAUTHENTICATED (401) even though the body would also have failed the priority-20 shape check — and an empty-string header is treated as absent."
        test_recipe:
          setup: ["No fixture data is required; the server may be empty."]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "" }
              as: Anonymous
              as_user_id: ""
              captures: { err1: "$.data.error_id" }
            - call: "GET /compliance/bookings"
              payload: {}
              as: Anonymous
              as_user_id: ""
              captures: { err2: "$.data.error_id" }
          assert:
            - "Both calls return HTTP 401 with error_id == ERR_UNAUTHENTICATED (${err1}, ${err2})"
            - "Neither ERR_INVALID_REQUEST (the empty carrier_code) nor ERR_FORBIDDEN_ROLE is returned — priority 1 pre-empts priorities 3 and 20"
            - "GET /compliance/bookings with valid ComplianceAdmin headers afterwards returns total_count == 0 — the rejected create persisted nothing"

      - name: unknown_role_value_rejected_as_unauthenticated_not_forbidden
        claim_type: error_triggerable
        grounds: ["validations[priority 2]", "validations[priority 3]", "errors.ERR_UNAUTHENTICATED", "errors.ERR_FORBIDDEN_ROLE"]
        distinguishing_aspect: "An X-User-Role that is not one of the five declared roles is an AUTHENTICATION failure (401 ERR_UNAUTHENTICATED at priority 2), whereas a real but unlisted role on the same endpoint is an AUTHORIZATION failure (403 ERR_FORBIDDEN_ROLE at priority 3) — the two are never collapsed."
        test_recipe:
          setup: ["One PolicyProfile exists so the endpoint under test has a valid target."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: SuperUser
              as_user_id: "hacker_1"
              captures: { err1: "$.data.error_id" }
            - call: "POST /compliance/compliance-sweeps"
              payload: { policy_profile_id: "${pol_id}" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { err2: "$.data.error_id" }
          assert:
            - "The SuperUser call returns HTTP 401 with error_id == ERR_UNAUTHENTICATED (${err1})"
            - "The OpsController call returns HTTP 403 with error_id == ERR_FORBIDDEN_ROLE (${err2})"
            - "PolicyProfile.${pol_id}.version == 1 and open_violation_count == 0 — neither rejected sweep ran a phase"

      - name: every_remaining_entity_resolves_its_own_not_found_code
        claim_type: error_triggerable
        grounds: ["validations[priority 10]", "validations[priority 15]", "errors.ERR_POLICY_PROFILE_NOT_FOUND", "errors.ERR_ANCILLARY_PURCHASE_NOT_FOUND", "errors.ERR_CHECKED_BAG_NOT_FOUND", "errors.ERR_DENIED_BOARDING_RECORD_NOT_FOUND", "errors.ERR_TARMAC_DELAY_EVENT_NOT_FOUND", "errors.ERR_REFUND_OBLIGATION_NOT_FOUND", "errors.ERR_REGULATOR_REPORT_NOT_FOUND", "errors.ERR_CONSUMER_COMPLAINT_NOT_FOUND"]
        distinguishing_aspect: "The identical sentinel id 00000000-0000-0000-0000-0000000000ff produces EIGHT DIFFERENT 404 codes depending only on which entity the path position denotes, including on action endpoints (resolve, deplane, submit) whose bodies are perfectly valid."
        test_recipe:
          setup: ["No fixture data is required; every call below uses a sentinel id that no row carries."]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/policy-profiles/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err1: "$.data.error_id" }
            - call: "GET /compliance/ancillary-purchases/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err2: "$.data.error_id" }
            - call: "POST /compliance/checked-bags/00000000-0000-0000-0000-0000000000ff/resolve"
              payload: { resolution: "DELIVERED", delivered_at_utc: "2026-08-10T21:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err3: "$.data.error_id" }
            - call: "GET /compliance/denied-boarding-records/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err4: "$.data.error_id" }
            - call: "POST /compliance/tarmac-delay-events/00000000-0000-0000-0000-0000000000ff/deplane"
              payload: { deplane_completed_utc: "2026-08-10T13:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { err5: "$.data.error_id" }
            - call: "GET /compliance/refund-obligations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err6: "$.data.error_id" }
            - call: "POST /compliance/regulator-reports/00000000-0000-0000-0000-0000000000ff/submit"
              payload: { submitted_at_utc: "2026-09-01T09:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err7: "$.data.error_id" }
            - call: "GET /compliance/consumer-complaints/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err8: "$.data.error_id" }
          assert:
            - "All eight calls return HTTP 404"
            - "error_id values are, in order: ERR_POLICY_PROFILE_NOT_FOUND (${err1}), ERR_ANCILLARY_PURCHASE_NOT_FOUND (${err2}), ERR_CHECKED_BAG_NOT_FOUND (${err3}), ERR_DENIED_BOARDING_RECORD_NOT_FOUND (${err4}), ERR_TARMAC_DELAY_EVENT_NOT_FOUND (${err5}), ERR_REFUND_OBLIGATION_NOT_FOUND (${err6}), ERR_REGULATOR_REPORT_NOT_FOUND (${err7}), ERR_CONSUMER_COMPLAINT_NOT_FOUND (${err8})"
            - "No response returns a shared or generic not-found code, and none returns 422 for the body"

      - name: finalize_on_already_finalized_denied_boarding_record_rejected
        claim_type: error_triggerable
        grounds: ["validations[priority 40]", "errors.ERR_DENIED_BOARDING_STATE_INVALID", "state_machines.DeniedBoardingRecord[RECORDED -> FINALIZED]", "endpoints[POST /compliance/denied-boarding-records/{id}/finalize]", "calculations.denied_boarding_compensation"]
        distinguishing_aspect: "Finalize is NOT idempotent and NOT re-runnable: the second call on a FINALIZED record returns 409 ERR_DENIED_BOARDING_STATE_INVALID at priority 40 rather than re-running the ladder, so finalized_at_utc stays at the first instant, compensation_cents stays 77500, and exactly ONE DENIED_BOARDING obligation exists (a naive re-run would mint a second and push the booking ledger to 155000)."
        test_recipe:
          setup:
            - "Booking with total_fare_cents = 50000, payment_method CREDIT_CARD, one DOMESTIC segment scheduled 2026-08-10T12:00:00Z -> 14:00:00Z."
            - "An INVOLUNTARY DeniedBoardingRecord in status RECORDED with oversale_confirmed = true, written_disclosure_provided = true, one_way_fare_cents = 45000 and substitute_arrival_utc = 2026-08-10T15:30:00Z (substitute_delay_minutes = 90)."
            - "Statutory ladder: 90 min > INVOLUNTARY_NO_COMP_MAX_MINUTES 60 and <= TIER1_MAX_MINUTES_DOMESTIC 120, so statutory = min(round_half_up(45000 * 2.0) = 90000, INVOLUNTARY_TIER1_CAP_CENTS 77500) = 77500; effective_category = INVOLUNTARY so compensation_cents = 77500."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "DBR001", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/{id}/flight-segments"
              payload: { id: "${bk_id}", sequence_index: 1, flight_number: "ZQ100", origin_iata: "SEA", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg_id: "$.data.id" }
            - call: "POST /compliance/denied-boarding-records"
              payload: { booking_id: "${bk_id}", flight_segment_id: "${seg_id}", category: "INVOLUNTARY", oversale_confirmed: true, written_disclosure_provided: true, one_way_fare_cents: 45000, substitute_arrival_utc: "2026-08-10T15:30:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { dbr_id: "$.data.id", dbr_status: "$.data.status" }
          trigger:
            - call: "POST /compliance/denied-boarding-records/{id}/finalize"
              payload: { id: "${dbr_id}", finalized_at_utc: "2026-08-10T16:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { st1: "$.data.status", comp1: "$.data.compensation_cents", fin1: "$.data.finalized_at_utc" }
            - call: "POST /compliance/denied-boarding-records/{id}/finalize"
              payload: { id: "${dbr_id}", finalized_at_utc: "2026-08-10T17:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err: "$.data.error_id" }
            - call: "GET /compliance/denied-boarding-records/{id}"
              payload: { id: "${dbr_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { st2: "$.data.status", comp2: "$.data.compensation_cents", fin2: "$.data.finalized_at_utc" }
            - call: "GET /compliance/bookings/{id}"
              payload: { id: "${bk_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { obligated: "$.data.total_refund_obligated_cents", bkv: "$.data.version" }
          assert:
            - "The record is created in status RECORDED (${dbr_status} == RECORDED) with compensation_cents == 0"
            - "First finalize returns HTTP 200 with status == FINALIZED (${st1}), statutory_compensation_cents == 77500, compensation_cents == 77500 (${comp1}), effective_category == INVOLUNTARY, finalized_at_utc == 2026-08-10T16:00:00Z (${fin1})"
            - "Second finalize returns HTTP 409 with error_id == ERR_DENIED_BOARDING_STATE_INVALID"
            - "Re-read shows the record UNCHANGED: status == FINALIZED (${st2}), compensation_cents == 77500 (${comp2}), finalized_at_utc == 2026-08-10T16:00:00Z (${fin2}) — the 17:00 instant was never written"
            - "GET /compliance/refund-obligations?booking_id=${bk_id}&basis=DENIED_BOARDING returns total_count == 1 with gross_entitlement_cents == 77500"
            - "Booking.${bk_id}.total_refund_obligated_cents == 77500 (${obligated}), not 155000, and Booking.version == 3 (${bkv}) — the rejected call incremented nothing"

      - name: file_report_on_still_active_tarmac_event_then_on_terminal_event_rejected
        claim_type: error_triggerable
        grounds: ["validations[priority 40]", "errors.ERR_TARMAC_EVENT_STATE_INVALID", "state_machines.TarmacDelayEvent[DELAY_ACTIVE -> DEPLANED]", "state_machines.TarmacDelayEvent[DEPLANED -> REPORT_FILED]", "endpoints[POST /compliance/tarmac-delay-events/{id}/file-report]", "endpoints[POST /compliance/tarmac-delay-events/{id}/claim-exemption]"]
        distinguishing_aspect: "ERR_TARMAC_EVENT_STATE_INVALID guards the fork-join from BOTH ends of the same event: file-report is refused while the event is still DELAY_ACTIVE (the interval has not closed), and after the join the terminal REPORT_FILED state refuses claim-exemption — even though the parent segment is DEPARTED so the priority-47 segment guard is satisfied and both bodies are otherwise valid."
        test_recipe:
          setup:
            - "Booking with total_fare_cents = 50000, one DOMESTIC segment scheduled 2026-08-10T12:00:00Z -> 14:00:00Z."
            - "One TarmacDelayEvent on that segment, phase DEPARTURE, tarmac_start_utc = 2026-08-10T12:00:00Z, status DELAY_ACTIVE, deadline_minutes = 180 (domestic)."
            - "The segment is recorded DEPARTED at 2026-08-10T13:30:00Z FIRST, so the priority-47 precondition (segment status IN {DEPARTED, ARRIVED, CANCELLED}) can never be the reason a file-report is refused."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "TRM001", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/{id}/flight-segments"
              payload: { id: "${bk_id}", sequence_index: 1, flight_number: "ZQ200", origin_iata: "SEA", destination_iata: "DEN", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg_id: "$.data.id" }
            - call: "POST /compliance/tarmac-delay-events"
              payload: { flight_segment_id: "${seg_id}", tarmac_start_utc: "2026-08-10T12:00:00Z", phase: "DEPARTURE" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { ev_id: "$.data.id", ev_status: "$.data.status", ev_deadline: "$.data.deadline_minutes" }
            - call: "POST /compliance/flight-segments/{id}/record-operation"
              payload: { id: "${seg_id}", operation: "DEPARTED", occurred_at_utc: "2026-08-10T13:30:00Z" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg_status: "$.data.status" }
          trigger:
            - call: "POST /compliance/tarmac-delay-events/{id}/file-report"
              payload: { id: "${ev_id}", report_reference: "TR-0001", filed_at_utc: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { err1: "$.data.error_id" }
            - call: "POST /compliance/tarmac-delay-events/{id}/deplane"
              payload: { id: "${ev_id}", deplane_completed_utc: "2026-08-10T13:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { st_dep: "$.data.status", mins: "$.data.tarmac_minutes" }
            - call: "POST /compliance/tarmac-delay-events/{id}/file-report"
              payload: { id: "${ev_id}", report_reference: "TR-0001", filed_at_utc: "2026-08-10T18:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { st_filed: "$.data.status", ref: "$.data.report_reference" }
            - call: "POST /compliance/tarmac-delay-events/{id}/claim-exemption"
              payload: { id: "${ev_id}", exemption_reason: "ATC_DIRECTIVE", exemption_declared_at_utc: "2026-08-10T13:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { err2: "$.data.error_id" }
            - call: "GET /compliance/flight-segments/{id}/tarmac-delay-events"
              payload: { id: "${seg_id}" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { st_final: "$.data.data[0].status", exr: "$.data.data[0].exemption_reason" }
          assert:
            - "The event is created DELAY_ACTIVE (${ev_status}) with deadline_minutes == 180 (${ev_deadline}) and the segment reaches DEPARTED (${seg_status}) before any report attempt"
            - "First file-report returns HTTP 409 with error_id == ERR_TARMAC_EVENT_STATE_INVALID — not ERR_SEGMENT_STATE_INVALID and not ERR_CORRECTIVE_ACTION_REQUIRED"
            - "Deplane returns HTTP 200 with status == DEPLANED (${st_dep}), tarmac_minutes == 60 (${mins}) and is_violation == false (60 <= 180)"
            - "The retried file-report now returns HTTP 200 with status == REPORT_FILED (${st_filed}) and report_reference == TR-0001 (${ref}) — the identical body that was refused a moment earlier"
            - "claim-exemption on the REPORT_FILED event returns HTTP 409 with error_id == ERR_TARMAC_EVENT_STATE_INVALID (${err2} equals ${err1}) — the terminal state accepts no transition"
            - "The segment's event list returns total_count == 1 whose single row confirms status == REPORT_FILED (${st_final}) and exemption_reason == null (${exr}); FlightSegment.${seg_id}.exempted_tarmac_event_count == 0 — the refused exemption left no trace"

  - section: rbac
    instances:
      - name: regulator_auditor_cannot_create_a_booking
        claim_type: role_denied
        grounds: ["roles.RegulatorAuditor", "validations[priority 3]", "errors.ERR_FORBIDDEN_ROLE", "endpoints[POST /compliance/bookings]"]
        distinguishing_aspect: "RegulatorAuditor holds no write capability of any kind: a fully valid booking create returns ERR_FORBIDDEN_ROLE (403) at priority 3, before the priority-20 shape check and before any row is written, while the same body succeeds as ComplianceOfficer."
        test_recipe:
          setup: ["One PolicyProfile and one Passenger exist."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: RegulatorAuditor
              as_user_id: "auditor_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "Passenger.${pax_id}.version == 1 — no denormalised counter moved"
            - "GET /compliance/bookings as ComplianceAdmin returns total_count == 0"
            - "The identical body posted as ComplianceOfficer with X-User-ID officer_1 returns 201 with record_locator ABC123"

      - name: ops_controller_cannot_mint_a_refund_obligation
        claim_type: role_denied
        grounds: ["roles.OpsController", "validations[priority 3]", "errors.ERR_FORBIDDEN_ROLE", "endpoints[POST /compliance/refund-obligations]"]
        distinguishing_aspect: "OpsController owns operational truth but has no authority over money: the obligation create is refused with ERR_FORBIDDEN_ROLE (403) at priority 3, ahead of the priority-35 OCC check, so a deliberately stale expected_booking_version still yields 403 and not ERR_STALE_BOOKING_VERSION."
        test_recipe:
          setup: ["Booking total_fare_cents = 50000 with one cancelled segment; the ops controller already performed the disruption, proving the denial is endpoint-scoped, not actor-scoped."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id", bk_ver_stale: "$.data.version" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/refund-obligations"
              payload: { booking_id: "${bk_id}", basis: "FARE", issuance_mode: "REQUEST_BASED", expected_booking_version: "${bk_ver_stale}", flight_segment_id: "${seg1_id}" }
              as: OpsController
              as_user_id: "ops_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN_ROLE (not ERR_STALE_BOOKING_VERSION, which priority 35 would have raised for version ${bk_ver_stale})"
            - "GET /compliance/refund-obligations with booking_id = ${bk_id} returns total_count == 0"
            - "Booking.${bk_id}.total_refund_obligated_cents == 0 and Booking.${bk_id}.disruption_posture == NORMAL"

      - name: compliance_officer_cannot_void_an_obligation
        claim_type: role_denied
        grounds: ["roles.ComplianceAdmin.exclusive_operations", "roles.ComplianceOfficer", "validations[priority 3]", "errors.ERR_FORBIDDEN_ROLE", "endpoints[POST /compliance/refund-obligations/{id}/void]"]
        distinguishing_aspect: "Void is ComplianceAdmin-exclusive: the officer who works the case cannot erase the obligation, and the SAME void_reason accepted from ComplianceAdmin returns ERR_FORBIDDEN_ROLE (403) for ComplianceOfficer."
        test_recipe:
          setup: ["Booking total_fare_cents = 50000 with one cancelled segment and its cascade-created PROACTIVE FARE obligation of 50000."]
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T10:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bk_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { ob_id: "$.data.data[0].id" }
          trigger:
            - call: "POST /compliance/refund-obligations/${ob_id}/void"
              payload: { void_reason: "CREATED_IN_ERROR" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "RefundObligation.${ob_id}.settlement_status == UNSETTLED and void_reason == null"
            - "Booking.${bk_id}.total_refund_obligated_cents == 50000"
            - "The identical void_reason CREATED_IN_ERROR sent as ComplianceAdmin with X-User-ID admin_1 returns 200 with settlement_status == VOIDED and drives Booking.${bk_id}.total_refund_obligated_cents back to 0"

      - name: compliance_admin_cannot_initiate_a_settlement
        claim_type: role_denied
        grounds: ["roles.ComplianceOfficer.exclusive_operations", "roles.ComplianceAdmin.description", "validations[priority 3]", "errors.ERR_FORBIDDEN_ROLE", "endpoints[POST /compliance/refund-obligations/{id}/initiate-settlement]"]
        distinguishing_aspect: "This is the one place the ComplianceAdmin override is deliberately withheld: initiate-settlement is ComplianceOfficer-exclusive so one person cannot both start and finish the money movement, and the admin attempt returns ERR_FORBIDDEN_ROLE (403) rather than succeeding as an override."
        test_recipe:
          setup:
            - "Booking total_fare_cents = 50000 (CREDIT_CARD) with one cancelled segment, its cascade obligation elected CASH by the passenger and still UNSETTLED."
          setup_api_calls:
            - call: "POST /compliance/policy-profiles"
              payload: { carrier_code: "ZQ" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
              captures: { pol_id: "$.data.id" }
            - call: "POST /compliance/passengers"
              payload: { email: "pat@example.com", full_name: "Pat Rivera" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { pax_id: "$.data.id" }
            - call: "POST /compliance/bookings"
              payload: { passenger_id: "${pax_id}", policy_profile_id: "${pol_id}", record_locator: "ABC123", total_fare_cents: 50000, payment_method: "CREDIT_CARD" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { bk_id: "$.data.id" }
            - call: "POST /compliance/bookings/${bk_id}/flight-segments"
              payload: { sequence_index: 1, flight_number: "ZQ410", origin_iata: "ORD", destination_iata: "DFW", is_international: false, scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", segment_fare_cents: 50000 }
              as: OpsController
              as_user_id: "ops_1"
              captures: { seg1_id: "$.data.id" }
            - call: "POST /compliance/flight-segments/${seg1_id}/declare-disruption"
              payload: { disruption_type: "CANCELLATION", declared_at_utc: "2026-08-10T10:00:00Z" }
              as: OpsController
              as_user_id: "ops_1"
            - call: "GET /compliance/refund-obligations"
              payload: { booking_id: "${bk_id}" }
              as: ComplianceOfficer
              as_user_id: "officer_1"
              captures: { ob_id: "$.data.data[0].id" }
            - call: "POST /compliance/refund-obligations/${ob_id}/elect"
              payload: { election: "CASH" }
              as: Passenger
              as_user_id: "${pax_id}"
          trigger:
            - call: "POST /compliance/refund-obligations/${ob_id}/initiate-settlement"
              payload: { processor_reference: "PROC-0001" }
              as: ComplianceAdmin
              as_user_id: "admin_1"
