              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_51"
              captures: { a51_idp_id: "$.data.id" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${p51_plan_id}", mentor_id: "${m51_id}", funding_source_id: "${f51_plan_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_51"
              captures: { a51_plan_id: "$.data.id" }
            - call: "POST /appointments/${a51_idp_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_51"
            - call: "POST /appointments/${a51_plan_id}/issue-offer"
              payload: {}
