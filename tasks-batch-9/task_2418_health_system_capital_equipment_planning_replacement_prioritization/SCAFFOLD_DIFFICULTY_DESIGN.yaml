  # =========================================================================
  # 4. transitive_cascade — two instances, different triggering transitions and
  #    different depths (4 hops from a funding, 3-4 hops from a service event).
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fund_request_cascades_allocation_cycle_and_sibling_deferral
        grounds:
          - state_machines.ReplacementRequest.APPROVED_to_FUNDED
          - state_machines.CapitalCycle.ALLOCATED_to_COMMITTED
          - state_machines.ReplacementRequest.SCORED_to_DEFERRED
          - entities.FacilityAllocation.fields.posture
          - entities.CapitalCycle.fields.exhausted_allocation_count
          - calculations.request_funded_amount
        distinguishing_aspect: >-
          Depth 4 from ONE funding call, each hop caused by the previous one: committing
          100000000 drives available_cents to 0 (hop 1) -> that zero flips the allocation
          posture to EXHAUSTED (hop 2) -> that flip makes exhausted_allocation_count equal
          allocation_count so the cycle auto-COMMITS (hop 3) -> the commit defers the
          sibling SCORED request R4 (hop 4), which no fan-out of a single side-effect list
          could produce.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1, assets A5 and A6 (install 2020-08-02, life 8, OEM support 2029-06-01, no service events -> adjusted RULS 25.00 each)."
