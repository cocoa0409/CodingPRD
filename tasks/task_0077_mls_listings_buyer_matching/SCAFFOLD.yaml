# =============================================================================
# Task 0077 — MLS Listings & Buyer Matching (seed tables, v1)
# =============================================================================

scenario: |
  77. MLS Listings & Buyer Matching: dual agents (Listing/Buyer), showing
  appointments, Lockbox, Offer/Counter/Multiple Offer, Contingency
  (Inspection/Appraisal/Financing), Co-op commission

domain_name: mls-listings-buyer-matching
api_prefix: /

complexity_profile:
  primary_archetype: multi-party-negotiation
  secondary_archetype: temporal-windowing
  complexity_layers:
    - optimistic_concurrency        # OCC on Listing.version for Offer accept (multiple-offer race)
    - cascading_side_effects        # accept-offer freezes siblings, opens contingencies, lockbox
    - dual_variant_calculation      # net-to-seller (provisional vs final) + commission split
    - rate_threshold_triggers       # appraisal-gap / financing DTI boundary gates

  entity_topology: hybrid
  # Listing is the aggregate root with nested Lockbox/Offer; Offer carries
  # cross-aggregate FKs to Buyer and Agent (peers), Contingency hangs off Offer.

  state_machine_shape: cyclic
  # Offer ↔ Counter is a genuine negotiation loop (SELLER_COUNTERED ↔ BUYER_COUNTERED);
  # Listing offer_posture is compound (derived from child offers); Contingency branches.

  relationship_patterns:
    - one_to_many        # Listing → Offer, Offer → Contingency, Lockbox → ShowingAppointment
    - many_to_many       # Agent ↔ Listing via offers (an agent may have many, listing many)
    - cross_aggregate    # Offer.buyer_id, Offer.buyer_agent_id, ShowingAppointment.buyer_agent_id

  role_model: peer_roles
  # ListingAgent owns the sell side (listing, lockbox, counters as seller);
  # BuyerAgent owns the buy side (offers, showings, counters as buyer);
  # the SAME Agent entity can be listing agent on one listing and buyer agent on another,
  # but never both sides of the SAME listing (segregation enforced as a validation).

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brokerage legal name" }
      - { name: default_total_commission_pct, type: number, source: input, description: "Default total commission rate, e.g. 0.06 for 6%", constraints: "0 < x <= 0.10" }
      - { name: default_coop_split_pct, type: number, source: input, description: "Share of total commission paid to the buyer-side (co-op), e.g. 0.50 for an even split", constraints: "0 <= x <= 1" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: brokerage_id, type: string, source: input, description: "FK -> Brokerage.id; the brokerage the agent belongs to" }
      - { name: full_name, type: string, source: input, description: "Agent full name" }
      - { name: license_no, type: string, source: input, description: "State real-estate license number; unique across all agents", constraints: "unique" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED agents cannot create listings/offers/counters", default: "ACTIVE", constraints: "ACTIVE, SUSPENDED" }

  - name: Buyer
    parent: null
    common_fields: false
    fields:
      - { name: buyer_agent_id, type: string, source: input, description: "FK -> Agent.id; the buyer's representing (buy-side) agent" }
      - { name: full_name, type: string, source: input, description: "Buyer full name" }
      - { name: max_budget_cents, type: integer, source: input, description: "Buyer's stated max purchase budget in integer cents", constraints: ">= 0" }
      - { name: prequalified_amount_cents, type: integer, source: input, description: "Lender pre-qualification ceiling in integer cents; 0 means not prequalified", default: 0, constraints: ">= 0" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Buyer gross monthly income in cents; used by financing-contingency DTI gate", constraints: ">= 0" }
      - { name: monthly_debt_cents, type: integer, source: input, description: "Buyer existing monthly debt obligations in cents; used by DTI gate", default: 0, constraints: ">= 0" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: listing_agent_id, type: string, source: input, description: "FK -> Agent.id; the listing (sell-side) agent" }
      - { name: address, type: string, source: input, description: "Property street address; unique across non-terminal listings", constraints: "unique among status NOT IN {WITHDRAWN, CLOSED}" }
      - { name: list_price_cents, type: integer, source: input, description: "Seller's asking price in integer cents", constraints: "> 0" }
      - { name: total_commission_pct, type: number, source: input, description: "Total commission rate for this listing; defaults to Brokerage.default_total_commission_pct when omitted", constraints: "0 < x <= 0.10" }
      - { name: coop_split_pct, type: number, source: input, description: "Co-op share of total commission paid to buyer side; defaults to Brokerage.default_coop_split_pct when omitted", constraints: "0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | UNDER_CONTRACT | PENDING | CLOSED | WITHDRAWN", default: "DRAFT", constraints: "DRAFT, ACTIVE, UNDER_CONTRACT, PENDING, CLOSED, WITHDRAWN" }
      - { name: offer_posture, type: enum, source: computed, description: "SINGLE | MULTIPLE | NONE — derived: NONE when no live offers, MULTIPLE when >=2 offers in OPEN/COUNTERED states, else SINGLE" }
      - { name: accepted_offer_id, type: string, source: computed, description: "Id of the Offer currently in ACCEPTED state for this listing, or null" }
      - { name: final_sale_price_cents, type: integer, source: computed, description: "Sale price recorded at CLOSE; equals the accepted offer's effective price; null until CLOSED" }

  - name: Lockbox
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; the listing this lockbox guards" }
      - { name: serial_no, type: string, source: input, description: "Physical lockbox serial; unique across active lockboxes", constraints: "unique" }
      - { name: access_mode, type: enum, source: input, description: "APPOINTMENT_ONLY | OPEN_ACCESS — APPOINTMENT_ONLY requires a CONFIRMED ShowingAppointment overlapping the access time", default: "APPOINTMENT_ONLY", constraints: "APPOINTMENT_ONLY, OPEN_ACCESS" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Mandatory buffer in minutes that must separate the end of one showing from the start of the next on this lockbox", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "INSTALLED | DISABLED — a showing may still be REQUESTED on a DISABLED lockbox but cannot be CONFIRMED (confirm rejects with ERR_LOCKBOX_DISABLED)", default: "INSTALLED", constraints: "INSTALLED, DISABLED" }

  - name: ShowingAppointment
    parent: Lockbox
    common_fields: true
    fields:
      - { name: lockbox_id, type: string, source: system, description: "FK -> Lockbox.id; the lockbox/property being shown" }
      - { name: buyer_agent_id, type: string, source: input, description: "FK -> Agent.id; the buyer-side agent requesting the showing" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the buyer being shown the property" }
      - { name: start_at, type: datetime, source: input, description: "Showing window start (ISO 8601 UTC), half-open interval [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Showing window end (ISO 8601 UTC); must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", default: "REQUESTED", constraints: "REQUESTED, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW" }

  - name: Offer
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; the listing this offer targets" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the offering buyer" }
      - { name: buyer_agent_id, type: string, source: input, description: "FK -> Agent.id; the buy-side agent submitting the offer" }
      - { name: initial_price_cents, type: integer, source: input, description: "Buyer's opening offer price in integer cents", constraints: "> 0" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in integer cents", constraints: ">= 0" }
      - { name: current_price_cents, type: integer, source: computed, description: "Price on the latest CounterRound, or initial_price_cents if no counters yet" }
      - { name: current_party, type: enum, source: computed, description: "SELLER | BUYER — which side must respond next; derived from the latest CounterRound (or BUYER-submitted, so SELLER first)" }
      - { name: round_count, type: integer, source: computed, description: "Number of CounterRounds recorded against this offer", default: 0 }
      - { name: requested_contingencies, type: array, source: input, description: "Subset of {INSPECTION, APPRAISAL, FINANCING} the buyer requests; each materializes as a Contingency on acceptance" }
      - { name: status, type: enum, source: system, description: "OPEN | SELLER_COUNTERED | BUYER_COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | EXPIRED", default: "OPEN", constraints: "OPEN, SELLER_COUNTERED, BUYER_COUNTERED, ACCEPTED, REJECTED, WITHDRAWN, EXPIRED" }
      - { name: effective_price_cents, type: integer, source: computed, description: "Agreed price at ACCEPTED = current_price_cents frozen at acceptance; null until ACCEPTED" }

  - name: CounterRound
    parent: Offer
    common_fields: false
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; the offer being negotiated" }
      - { name: round_index, type: integer, source: system, description: "1-based monotonically increasing sequence within the offer", constraints: ">= 1" }
      - { name: by_party, type: enum, source: system, description: "SELLER | BUYER — the side that issued this counter", constraints: "SELLER, BUYER" }
      - { name: counter_price_cents, type: integer, source: input, description: "Countered price in integer cents", constraints: "> 0" }
      - { name: actor_agent_id, type: string, source: input, description: "FK -> Agent.id; the agent who issued the counter" }

  - name: Contingency
    parent: Offer
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; the accepted offer this contingency protects" }
      - { name: kind, type: enum, source: system, description: "INSPECTION | APPRAISAL | FINANCING", constraints: "INSPECTION, APPRAISAL, FINANCING" }
      - { name: appraised_value_cents, type: integer, source: input, description: "APPRAISAL only: appraiser's value in cents, supplied on resolution", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "PENDING | WAIVED | SATISFIED | FAILED", default: "PENDING", constraints: "PENDING, WAIVED, SATISFIED, FAILED" }

  - name: CommissionLedger
    parent: Listing
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: system, description: "FK -> Listing.id; the closed listing this ledger settles" }
      - { name: sale_price_cents, type: integer, source: computed, description: "Final sale price the commission is computed on" }
      - { name: total_commission_cents, type: integer, source: computed, description: "Total commission = round_half_up(sale_price_cents * listing.total_commission_pct)" }
      - { name: coop_commission_cents, type: integer, source: computed, description: "Buyer-side (co-op) share = round_half_up(total_commission_cents * listing.coop_split_pct)" }
      - { name: listing_side_commission_cents, type: integer, source: computed, description: "Listing-side share = total_commission_cents - coop_commission_cents (remainder absorbs the rounding penny)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Listing
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /listings/{listingId}/activate"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Listing has at least one Lockbox in status INSTALLED (ERR_NO_LOCKBOX)"
        side_effects:
          - "offer_posture set to NONE"
          - "increments Listing.version by 1"

      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "System side effect of POST /offers/{offerId}/accept"
        actor: system
        preconditions:
          - "An Offer on this listing transitions to ACCEPTED"
        side_effects:
          - "accepted_offer_id set to the accepted offer's id"
          - "All sibling Offers on this listing in {OPEN, SELLER_COUNTERED, BUYER_COUNTERED} -> REJECTED (cascade)"
          - "offer_posture recomputed to NONE (no live competing offers remain)"
          - "increments Listing.version by 1"

      - from: UNDER_CONTRACT
        to: PENDING
        trigger: "System side effect of the accepted Offer's last Contingency leaving PENDING"
        actor: system
        preconditions:
          - "Every Contingency on the accepted offer is in {WAIVED, SATISFIED} (none PENDING, none FAILED)"
        side_effects:
          - "increments Listing.version by 1"

      - from: PENDING
        to: CLOSED
        trigger: "POST /listings/{listingId}/close"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Listing.status == PENDING (ERR_INVALID_STATE)"
          - "expected_listing_version matches Listing.version (ERR_STALE_VERSION)"
        side_effects:
          - "final_sale_price_cents set to accepted offer effective_price_cents"
          - "A CommissionLedger is created for this listing (run_commission_split)"
          - "All ShowingAppointments on this listing's lockbox in {REQUESTED, CONFIRMED} -> CANCELLED (cascade)"
          - "increments Listing.version by 1"

      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "System side effect of a Contingency on the accepted offer transitioning to FAILED"
        actor: system
        preconditions:
          - "A Contingency on the accepted offer transitions to FAILED"
        side_effects:
          - "accepted_offer_id cleared to null"
          - "The accepted Offer -> WITHDRAWN; its remaining PENDING Contingencies -> WAIVED (cascade)"
          - "offer_posture recomputed from remaining live offers"
          - "increments Listing.version by 1"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/withdraw"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing_agent_id (ERR_NOT_LISTING_AGENT)"
        side_effects:
          - "All Offers in {OPEN, SELLER_COUNTERED, BUYER_COUNTERED} -> REJECTED (cascade)"
          - "All ShowingAppointments in {REQUESTED, CONFIRMED} -> CANCELLED (cascade)"
          - "increments Listing.version by 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/withdraw"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing_agent_id (ERR_NOT_LISTING_AGENT)"
        side_effects:
          - "increments Listing.version by 1"

  - entity: Lockbox
    initial_state: INSTALLED
    terminal_states: [DISABLED]
    transitions:
      - from: INSTALLED
        to: DISABLED
        trigger: "POST /lockboxes/{lockboxId}/disable"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the parent listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "No ShowingAppointment on this lockbox is in status CONFIRMED (ERR_LOCKBOX_HAS_SHOWINGS)"
        side_effects:
          - "All ShowingAppointments in status REQUESTED -> CANCELLED (cascade)"

  - entity: ShowingAppointment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /showings/{showingId}/confirm"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the parent listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Lockbox.status == INSTALLED (ERR_LOCKBOX_DISABLED)"
          - "No other CONFIRMED showing on the same lockbox overlaps [start_at, end_at) extended by turnaround_minutes (ERR_SHOWING_CONFLICT)"
        side_effects: []

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /showings/{showingId}/cancel"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the buyer_agent_id (ERR_NOT_BUYER_AGENT)"
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /showings/{showingId}/cancel"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the buyer_agent_id (ERR_NOT_BUYER_AGENT)"
        side_effects: []

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /showings/{showingId}/complete"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the parent listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Current clock is at or after end_at (ERR_SHOWING_NOT_OVER)"
        side_effects: []

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /showings/{showingId}/no-show"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the parent listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Current clock is at or after end_at (ERR_SHOWING_NOT_OVER)"
        side_effects: []

  - entity: Offer
    initial_state: OPEN
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: SELLER_COUNTERED
        trigger: "POST /offers/{offerId}/counter"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Listing.status == ACTIVE (ERR_INVALID_STATE)"
          - "current_party == SELLER (ERR_NOT_YOUR_TURN)"
        side_effects:
          - "A CounterRound by_party=SELLER appended; round_index = round_count+1"
          - "current_price_cents set to the counter_price_cents; current_party flips to BUYER; round_count incremented"

      - from: SELLER_COUNTERED
        to: BUYER_COUNTERED
        trigger: "POST /offers/{offerId}/counter"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
          - "Listing.status == ACTIVE (ERR_INVALID_STATE)"
          - "current_party == BUYER (ERR_NOT_YOUR_TURN)"
        side_effects:
          - "A CounterRound by_party=BUYER appended; round_index = round_count+1"
          - "current_price_cents set to the counter_price_cents; current_party flips to SELLER; round_count incremented"

      - from: BUYER_COUNTERED
        to: SELLER_COUNTERED
        trigger: "POST /offers/{offerId}/counter"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Listing.status == ACTIVE (ERR_INVALID_STATE)"
          - "current_party == SELLER (ERR_NOT_YOUR_TURN)"
        side_effects:
          - "A CounterRound by_party=SELLER appended; round_index = round_count+1"
          - "current_price_cents set to the counter_price_cents; current_party flips to BUYER; round_count incremented"

      - from: OPEN
        to: ACCEPTED
        trigger: "POST /offers/{offerId}/accept"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Listing.status == ACTIVE (ERR_INVALID_STATE)"
          - "expected_listing_version matches Listing.version (ERR_STALE_VERSION)"
        side_effects:
          - "effective_price_cents frozen at current_price_cents"
          - "Listing -> UNDER_CONTRACT (cascade: rejects sibling offers, sets accepted_offer_id)"
          - "A Contingency is materialized for each kind in requested_contingencies (status PENDING)"
          - "If requested_contingencies is empty, Listing immediately bubbles UNDER_CONTRACT -> PENDING"

      - from: BUYER_COUNTERED
        to: ACCEPTED
        trigger: "POST /offers/{offerId}/accept"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
          - "Listing.status == ACTIVE (ERR_INVALID_STATE)"
          - "current_party == SELLER (ERR_NOT_YOUR_TURN)"
          - "expected_listing_version matches Listing.version (ERR_STALE_VERSION)"
        side_effects:
          - "effective_price_cents frozen at current_price_cents (the buyer's latest counter)"
          - "Listing -> UNDER_CONTRACT (cascade: rejects sibling offers, sets accepted_offer_id)"
          - "A Contingency is materialized for each kind in requested_contingencies (status PENDING)"
          - "If requested_contingencies is empty, Listing immediately bubbles UNDER_CONTRACT -> PENDING"

      - from: SELLER_COUNTERED
        to: ACCEPTED
        trigger: "POST /offers/{offerId}/accept"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
          - "Listing.status == ACTIVE (ERR_INVALID_STATE)"
          - "current_party == BUYER (ERR_NOT_YOUR_TURN)"
          - "expected_listing_version matches Listing.version (ERR_STALE_VERSION)"
        side_effects:
          - "effective_price_cents frozen at current_price_cents (the seller's latest counter)"
          - "Listing -> UNDER_CONTRACT (cascade: rejects sibling offers, sets accepted_offer_id)"
          - "A Contingency is materialized for each kind in requested_contingencies (status PENDING)"
          - "If requested_contingencies is empty, Listing immediately bubbles UNDER_CONTRACT -> PENDING"

      - from: OPEN
        to: REJECTED
        trigger: "POST /offers/{offerId}/reject"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
        side_effects:
          - "offer_posture recomputed on the listing"

      - from: SELLER_COUNTERED
        to: REJECTED
        trigger: "POST /offers/{offerId}/reject"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
        side_effects:
          - "offer_posture recomputed on the listing"

      - from: BUYER_COUNTERED
        to: REJECTED
        trigger: "POST /offers/{offerId}/reject"
        actor: ListingAgent
        preconditions:
          - "Acting agent is the listing's listing_agent_id (ERR_NOT_LISTING_AGENT)"
        side_effects:
          - "offer_posture recomputed on the listing"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /offers/{offerId}/withdraw"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
        side_effects:
          - "offer_posture recomputed on the listing"

      - from: BUYER_COUNTERED
        to: WITHDRAWN
        trigger: "POST /offers/{offerId}/withdraw"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
        side_effects:
          - "offer_posture recomputed on the listing"

      - from: SELLER_COUNTERED
        to: WITHDRAWN
        trigger: "POST /offers/{offerId}/withdraw"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
        side_effects:
          - "offer_posture recomputed on the listing"

  - entity: Contingency
    initial_state: PENDING
    terminal_states: [WAIVED, SATISFIED, FAILED]
    transitions:
      - from: PENDING
        to: SATISFIED
        trigger: "POST /contingencies/{contingencyId}/resolve"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the parent offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
          - "Parent listing.status == UNDER_CONTRACT (ERR_INVALID_STATE)"
          - "If kind==APPRAISAL: appraised_value_cents >= offer.effective_price_cents (else this transition is FAILED, not SATISFIED) (appraisal_gap_gate)"
          - "If kind==FINANCING: buyer back-end DTI ratio <= MAX_DTI AND offer.effective_price_cents <= buyer.prequalified_amount_cents (else FAILED) (financing_dti_gate)"
        side_effects:
          - "If this was the last PENDING Contingency on the offer, Listing bubbles UNDER_CONTRACT -> PENDING"

      - from: PENDING
        to: WAIVED
        trigger: "POST /contingencies/{contingencyId}/waive"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the parent offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
          - "Parent listing.status == UNDER_CONTRACT (ERR_INVALID_STATE)"
        side_effects:
          - "If this was the last PENDING Contingency on the offer, Listing bubbles UNDER_CONTRACT -> PENDING"

      - from: PENDING
        to: FAILED
        trigger: "POST /contingencies/{contingencyId}/resolve (when the kind's gate fails) or POST /contingencies/{contingencyId}/fail"
        actor: BuyerAgent
        preconditions:
          - "Acting agent is the parent offer's buyer_agent_id (ERR_NOT_BUYER_AGENT)"
          - "Parent listing.status == UNDER_CONTRACT (ERR_INVALID_STATE)"
        side_effects:
          - "Parent Offer -> WITHDRAWN; Listing UNDER_CONTRACT -> ACTIVE (compensation: clears accepted_offer_id, waives sibling PENDING contingencies, recomputes offer_posture)"

concurrency_rules:
  - rule_id: offer-accept-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /offers/{offerId}/accept"
    occ_field: "expected_listing_version"
    description: |
      Accepting an Offer against a Listing whose version has advanced since the
      buyer/listing agent last observed it is rejected on a stale version. In a
      multiple-offer situation two distinct offers may each be eligible for
      acceptance from the listing's ACTIVE state; once the first acceptance
      drives the Listing to UNDER_CONTRACT it bumps Listing.version, so a second
      acceptance still carrying the previously observed version is rejected as
      stale rather than silently double-committing the property.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: listing-close-stale-listing
    parent_entity: Listing
    write_endpoint: "POST /listings/{listingId}/close"
    occ_field: "expected_listing_version"
    description: |
      Closing a Listing whose version has advanced since the listing agent last
      observed it is rejected on a stale version. A contingency resolution that
      bubbles the listing PENDING (or a contingency failure that reverts it to
      ACTIVE) advances Listing.version between the agent's read and the close, so
      a close carrying the previously observed version is rejected as stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: offer_negotiation_state
    trigger: "Offer creation and every POST /offers/{offerId}/counter"
    algorithm: projection
    formula: |
      # Derive current_price_cents, current_party, round_count by replaying CounterRounds
      # in ascending round_index order (the append-only negotiation event log).
      rounds = CounterRounds for offer, ORDER BY round_index ASC
      round_count = len(rounds)
      if round_count == 0:
        current_price_cents = offer.initial_price_cents
        current_party = SELLER          # a fresh buyer offer awaits the seller
      else:
        last = rounds[-1]
        current_price_cents = last.counter_price_cents
        current_party = (BUYER if last.by_party == SELLER else SELLER)
    input_set: "All CounterRound rows whose offer_id == this offer; no status filter (rounds are immutable)."
    precision: "integer cents, no rounding"

  - name: listing_offer_posture
    trigger: "Any Offer state change on the listing (create, counter, accept, reject, withdraw, expire) and listing activate"
    algorithm: aggregation
    formula: |
      live = count(Offer for listing WHERE status IN {OPEN, SELLER_COUNTERED, BUYER_COUNTERED})
      if listing has an Offer in status ACCEPTED: offer_posture = NONE
      elif live == 0: offer_posture = NONE
      elif live == 1: offer_posture = SINGLE
      else:           offer_posture = MULTIPLE
    input_set: "Offers whose listing_id == this listing; only the three live statuses count toward MULTIPLE."
    precision: "integer count"

  - name: net_to_seller
    trigger: "Read GET /listings/{listingId}/net-sheet (provisional) and CLOSE (final)"
    algorithm: forward_looking
    formula: |
      # price basis differs by variant (see variants); commission and concessions deducted.
      gross = price_basis
      total_commission = round_half_up(gross * listing.total_commission_pct)
      net = gross - total_commission - SELLER_CONCESSION_CENTS
    input_set: "The single accepted/leading offer's price basis for this listing."
    constants:
      SELLER_CONCESSION_CENTS: 0
    precision: "integer cents, round_half_up on the commission product only"
    variants:
      - name: provisional_net
        when: "GET /listings/{listingId}/net-sheet while the listing is ACTIVE or UNDER_CONTRACT"
        difference: "price_basis = the LEADING live offer's current_price_cents (highest current_price_cents among live offers; tie-break earliest created_at). If no live or accepted offer exists, returns null net."
      - name: final_net
        when: "Computed at CLOSE and recorded; basis is the ACCEPTED offer's effective_price_cents"
        difference: "price_basis = accepted_offer.effective_price_cents — the frozen agreed price, which can differ from any provisional leading-offer basis because counters moved the number after the net-sheet was read."

  - name: run_commission_split
    trigger: "System side effect of PENDING -> CLOSED on Listing"
    algorithm: waterfall_allocation
    formula: |
      sale = listing.final_sale_price_cents                     # = accepted offer effective_price_cents
      total_commission_cents = round_half_up(sale * listing.total_commission_pct)
      coop_commission_cents  = round_half_up(total_commission_cents * listing.coop_split_pct)
      listing_side_commission_cents = total_commission_cents - coop_commission_cents
      # Listing side absorbs the rounding remainder so the two shares always sum to total.
    input_set: "Exactly one CommissionLedger per Listing, created at CLOSE."
    constants: {}
    precision: "integer cents, round_half_up; nested rounding order pinned: round the total first, THEN round the co-op share off the already-rounded total (NOT off the raw sale*pct*split product)."

  - name: financing_dti
    trigger: "POST /contingencies/{contingencyId}/resolve when kind==FINANCING"
    algorithm: threshold
    formula: |
      # Back-end DTI = (existing debt + estimated new housing payment) / income.
      monthly_pi = round_half_up(offer.effective_price_cents * MONTHLY_PAYMENT_FACTOR)
      back_end_dti = (buyer.monthly_debt_cents + monthly_pi) / buyer.monthly_income_cents
      passes = (back_end_dti <= MAX_DTI) AND (offer.effective_price_cents <= buyer.prequalified_amount_cents)
    input_set: "The buyer behind the accepted offer; the offer's effective_price_cents."
    constants:
      MAX_DTI: 0.43
      MONTHLY_PAYMENT_FACTOR: 0.005      # crude monthly principal+interest estimate per cent of price
    precision: "DTI compared with strict <= at MAX_DTI (0.43 passes, 0.4300001 fails); monthly_pi round_half_up to integer cents."

  - name: showing_overlap
    trigger: "POST /showings/{showingId}/confirm"
    algorithm: interval_merge
    formula: |
      buffer = lockbox.turnaround_minutes (minutes)
      # Half-open intervals; the candidate's window is widened by the buffer on BOTH ends for the conflict test.
      candidate = [start_at, end_at + buffer)
      for each other CONFIRMED showing s on the same lockbox:
        existing = [s.start_at, s.end_at + buffer)
        if candidate.start < existing.end AND existing.start < candidate.end: CONFLICT
    input_set: "ShowingAppointments on the same lockbox with status == CONFIRMED (the candidate itself is REQUESTED, excluded)."
    constants: {}
    precision: "datetime to the second; adjacency exactly at the buffer boundary does NOT conflict (half-open)."

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-ID resolves to an Agent for agent roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /brokerages, POST /agents, POST /buyers and GET endpoints"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per RBAC matrix (ListingAgent vs BuyerAgent peer split)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Ownership: acting agent matches the side they claim — ListingAgent op requires agent == listing.listing_agent_id; BuyerAgent op requires agent == the resource's buyer_agent_id"
    error_id: ERR_NOT_LISTING_AGENT
    http_status: 403
    applies_to: "listing/lockbox/showing-confirm/counter-as-seller/accept-as-seller/reject endpoints"

  - priority: 4
    category: business_referential
    check: "Ownership on the buy side: acting agent == the offer/showing buyer_agent_id"
    error_id: ERR_NOT_BUYER_AGENT
    http_status: 403
    applies_to: "offer create/withdraw/counter-as-buyer/contingency endpoints/showing-cancel"

  - priority: 5
    category: business_safety
    check: "Segregation of sides: on POST /offers the buyer_agent_id MUST NOT equal the target listing's listing_agent_id (an agent cannot represent both sides of the same property)"
    error_id: ERR_DUAL_AGENCY_FORBIDDEN
    http_status: 422
    applies_to: "POST /offers"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Negotiation turn: counter/accept-by-side only when current_party matches the acting side"
    error_id: ERR_NOT_YOUR_TURN
    http_status: 409
    applies_to: "POST /offers/{id}/counter, POST /offers/{id}/accept"

  - priority: 8
    category: business_constraint
    check: "Agent.status must be ACTIVE to create listings, offers, or counters"
    error_id: ERR_AGENT_SUSPENDED
    http_status: 403
    applies_to: "POST /listings, POST /offers, POST /offers/{id}/counter"

  - priority: 9
    category: business_constraint
    check: "Offer budget guard: initial_price_cents must not exceed buyer.max_budget_cents"
    error_id: ERR_OVER_BUDGET
    http_status: 422
    applies_to: "POST /offers"

  - priority: 10
    category: business_temporal
    check: "ShowingAppointment end_at strictly after start_at"
    error_id: ERR_BAD_TIME_WINDOW
    http_status: 422
    applies_to: "POST /lockboxes/{lockboxId}/showings"

  - priority: 11
    category: business_temporal
    check: "Confirming a showing must not collide (within turnaround buffer) with another CONFIRMED showing on the same lockbox"
    error_id: ERR_SHOWING_CONFLICT
    http_status: 409
    applies_to: "POST /showings/{showingId}/confirm"

  - priority: 12
    category: business_constraint
    check: "Lockbox serial_no unique among INSTALLED lockboxes; Listing address unique among non-terminal listings; Agent license_no globally unique"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /listings, POST /agents, POST /listings/{id}/lockboxes"

  - priority: 13
    category: business_fiscal
    check: "Counter price must be positive integer cents; offer earnest_money_cents <= initial_price_cents"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /offers, POST /offers/{id}/counter"

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Brokerage / Agent / Buyer (setup surface) ---
  - method: POST
    path: "/brokerages"
    description: "Create a brokerage (commission defaults)"
    roles: [Anonymous]
    code: 201
    input: [name, default_total_commission_pct, default_coop_split_pct]
    output: Brokerage
    side_effects: []

  - method: GET
    path: "/brokerages/{id}"
    description: "Get a brokerage"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Brokerage
    side_effects: []

  - method: POST
    path: "/agents"
    description: "Register an agent under a brokerage"
    roles: [Anonymous]
    code: 201
    input: [brokerage_id, full_name, license_no]
    output: Agent
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/agents/{id}"
    description: "Get an agent"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Agent
    side_effects: []

  - method: GET
    path: "/brokerages/{id}/agents"
    description: "List agents of a brokerage (reverse-reachability for Agent.brokerage_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: Agent[]
    side_effects: []

  - method: POST
    path: "/agents/{id}/suspend"
    description: "Suspend an agent (operator action)"
    roles: [Anonymous]
    code: 200
    input: []
    output: Agent
    side_effects: ["Agent.status=SUSPENDED"]

  - method: POST
    path: "/buyers"
    description: "Register a buyer represented by a buyer agent"
    roles: [Anonymous, BuyerAgent]
    code: 201
    input: [buyer_agent_id, full_name, max_budget_cents, "prequalified_amount_cents?", monthly_income_cents, "monthly_debt_cents?"]
    output: Buyer
    side_effects: []

  - method: GET
    path: "/buyers/{id}"
    description: "Get a buyer"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: GET
    path: "/agents/{id}/buyers"
    description: "List buyers represented by an agent (reverse-reachability for Buyer.buyer_agent_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: Buyer[]
    side_effects: []

  # --- Listing ---
  - method: POST
    path: "/listings"
    description: "Create a listing (DRAFT)"
    roles: [ListingAgent]
    code: 201
    input: [listing_agent_id, address, list_price_cents, "total_commission_pct?", "coop_split_pct?"]
    output: Listing
    side_effects: ["status=DRAFT", "offer_posture=NONE", "commission pcts default from brokerage when omitted"]

  - method: GET
    path: "/listings/{id}"
    description: "Get a listing"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "List listings; filter by listing_agent_id (reverse-reachability for Listing.listing_agent_id) and/or status"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["listing_agent_id?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/listings/{id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [ListingAgent]
    code: 200
    input: []
    output: Listing
    side_effects: ["Listing state transition", "increments Listing.version"]

  - method: POST
    path: "/listings/{id}/withdraw"
    description: "DRAFT/ACTIVE -> WITHDRAWN"
    roles: [ListingAgent]
    code: 200
    input: []
    output: Listing
    side_effects: ["Cascade reject live offers, cancel showings", "increments Listing.version"]

  - method: POST
    path: "/listings/{id}/close"
    description: "PENDING -> CLOSED (OCC-guarded)"
    roles: [ListingAgent]
    code: 200
    input: [expected_listing_version]
    output: Listing
    side_effects: ["final_sale_price_cents set", "CommissionLedger created (run_commission_split)", "cancel residual showings", "increments Listing.version"]

  - method: GET
    path: "/listings/{id}/net-sheet"
    description: "Provisional net-to-seller for the leading live offer (net_to_seller provisional variant). net_to_seller_cents is null when no live/accepted offer exists."
    roles: [ListingAgent]
    code: 200
    input: []
    output: { listing_id: string, basis_price_cents: integer, total_commission_cents: integer, net_to_seller_cents: integer }
    side_effects: []

  - method: GET
    path: "/listings/{id}/commission-ledger"
    description: "Get the commission ledger for a closed listing (reverse-reachability for CommissionLedger.listing_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: CommissionLedger[]
    side_effects: []

  # --- Lockbox ---
  - method: POST
    path: "/listings/{id}/lockboxes"
    description: "Install a lockbox on a listing"
    roles: [ListingAgent]
    code: 201
    input: [serial_no, "access_mode?", "turnaround_minutes?"]
    output: Lockbox
    side_effects: ["status=INSTALLED"]

  - method: GET
    path: "/lockboxes/{id}"
    description: "Get a lockbox"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Lockbox
    side_effects: []

  - method: GET
    path: "/listings/{id}/lockboxes"
    description: "List lockboxes on a listing (reverse-reachability for Lockbox.listing_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: Lockbox[]
    side_effects: []

  - method: POST
    path: "/lockboxes/{id}/disable"
    description: "INSTALLED -> DISABLED"
    roles: [ListingAgent]
    code: 200
    input: []
    output: Lockbox
    side_effects: ["Cancel REQUESTED showings"]

  # --- ShowingAppointment ---
  - method: POST
    path: "/lockboxes/{id}/showings"
    description: "Request a showing on a lockbox (REQUESTED)"
    roles: [BuyerAgent]
    code: 201
    input: [buyer_agent_id, buyer_id, start_at, end_at]
    output: ShowingAppointment
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/showings/{id}"
    description: "Get a showing appointment"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: []

  - method: GET
    path: "/lockboxes/{id}/showings"
    description: "List showings on a lockbox (reverse-reachability for ShowingAppointment.lockbox_id); filter by buyer_agent_id and buyer_id"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["buyer_agent_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: ShowingAppointment[]
    side_effects: []

  - method: GET
    path: "/showings"
    description: "List showings across lockboxes; filter by buyer_agent_id (reverse-reachability for ShowingAppointment.buyer_agent_id) and buyer_id (reverse-reachability for ShowingAppointment.buyer_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["buyer_agent_id?", "buyer_id?", "lockbox_id?", "status?", "limit?", "offset?"]
    output: ShowingAppointment[]
    side_effects: []

  - method: POST
    path: "/showings/{id}/confirm"
    description: "REQUESTED -> CONFIRMED (overlap-checked)"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: ["showing_overlap check"]

  - method: POST
    path: "/showings/{id}/cancel"
    description: "REQUESTED/CONFIRMED -> CANCELLED"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: []

  - method: POST
    path: "/showings/{id}/complete"
    description: "CONFIRMED -> COMPLETED (after end_at)"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: []

  - method: POST
    path: "/showings/{id}/no-show"
    description: "CONFIRMED -> NO_SHOW (after end_at)"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ShowingAppointment
    side_effects: []

  # --- Offer / Counter ---
  - method: POST
    path: "/listings/{id}/offers"
    description: "Buyer agent submits an offer on a listing (OPEN)"
    roles: [BuyerAgent]
    code: 201
    input: [buyer_id, buyer_agent_id, initial_price_cents, earnest_money_cents, "requested_contingencies?"]
    output: Offer
    side_effects: ["status=OPEN, current_party=SELLER", "offer_posture recomputed (SINGLE/MULTIPLE)"]

  - method: GET
    path: "/offers/{id}"
    description: "Get an offer"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/listings/{id}/offers"
    description: "List offers on a listing (reverse-reachability for Offer.listing_id); filter by buyer_agent_id, buyer_id, status"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["buyer_agent_id?", "buyer_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List offers across listings; filter by buyer_agent_id (reverse-reachability for Offer.buyer_agent_id), buyer_id (reverse-reachability for Offer.buyer_id), listing_id, status"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["buyer_agent_id?", "buyer_id?", "listing_id?", "status?", "limit?", "offset?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/offers/{id}/counter"
    description: "Append a counter round (cyclic negotiation); flips current_party"
    roles: [ListingAgent, BuyerAgent]
    code: 201
    input: [counter_price_cents, actor_agent_id]
    output: CounterRound
    side_effects: ["CounterRound appended", "Offer status/current_party/current_price_cents/round_count updated"]

  - method: GET
    path: "/offers/{id}/counters"
    description: "List counter rounds of an offer in round_index order (reverse-reachability for CounterRound.offer_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: CounterRound[]
    side_effects: []

  - method: GET
    path: "/counters/{id}"
    description: "Get a single counter round"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: CounterRound
    side_effects: []

  - method: GET
    path: "/counters"
    description: "List counter rounds; filter by offer_id (reverse-reachability for CounterRound.offer_id) and actor_agent_id (reverse-reachability for CounterRound.actor_agent_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["offer_id?", "actor_agent_id?", "by_party?", "limit?", "offset?"]
    output: CounterRound[]
    side_effects: []

  - method: POST
    path: "/offers/{id}/accept"
    description: "Accept an offer (OCC-guarded on Listing.version); cascades sibling rejection + contingency creation"
    roles: [ListingAgent, BuyerAgent]
    code: 200
    input: [expected_listing_version]
    output: Offer
    side_effects: ["effective_price_cents frozen", "Listing -> UNDER_CONTRACT cascade", "Contingencies materialized", "increments Listing.version"]

  - method: POST
    path: "/offers/{id}/reject"
    description: "Reject an offer"
    roles: [ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer_posture recomputed"]

  - method: POST
    path: "/offers/{id}/withdraw"
    description: "Buyer agent withdraws their offer"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Offer
    side_effects: ["offer_posture recomputed"]

  # --- Contingency ---
  - method: GET
    path: "/contingencies/{id}"
    description: "Get a contingency"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: []

  - method: GET
    path: "/offers/{id}/contingencies"
    description: "List contingencies on an offer (reverse-reachability for Contingency.offer_id)"
    roles: [Anonymous, ListingAgent, BuyerAgent]
    code: 200
    input: ["kind?", "status?", "limit?", "offset?"]
    output: Contingency[]
    side_effects: []

  - method: POST
    path: "/contingencies/{id}/resolve"
    description: "Resolve a contingency; APPRAISAL/FINANCING run their gate (SATISFIED or FAILED)"
    roles: [BuyerAgent]
    code: 200
    input: ["appraised_value_cents?"]
    output: Contingency
    side_effects: ["appraisal_gap_gate / financing_dti_gate", "last PENDING -> Listing bubbles to PENDING", "FAILED -> compensation revert to ACTIVE"]

  - method: POST
    path: "/contingencies/{id}/waive"
    description: "Waive a contingency (PENDING -> WAIVED)"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: ["last PENDING -> Listing bubbles to PENDING"]

  - method: POST
    path: "/contingencies/{id}/fail"
    description: "Explicitly fail a contingency (PENDING -> FAILED) e.g. inspection defects"
    roles: [BuyerAgent]
    code: 200
    input: []
    output: Contingency
    side_effects: ["compensation: Offer -> WITHDRAWN, Listing UNDER_CONTRACT -> ACTIVE"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set"
    description: "Set the server's current UTC clock (test-driving) for showing completion/no-show gating"
    roles: [Anonymous]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["server clock advanced to the given instant"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unresolvable auth headers on a protected endpoint" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation per RBAC" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_NOT_LISTING_AGENT, http: 403, condition: "Acting agent is not the listing's listing_agent_id for a sell-side op" }
  - { id: ERR_NOT_BUYER_AGENT, http: 403, condition: "Acting agent is not the resource's buyer_agent_id for a buy-side op" }
  - { id: ERR_DUAL_AGENCY_FORBIDDEN, http: 422, condition: "An offer's buyer_agent_id equals the listing's listing_agent_id (same agent on both sides)" }
  - { id: ERR_AGENT_SUSPENDED, http: 403, condition: "Agent.status is SUSPENDED on a create-listing/offer/counter op" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_NOT_YOUR_TURN, http: 409, condition: "current_party does not match the acting side on a counter/accept" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_listing_version does not match Listing.version (OCC)" }
  - { id: ERR_OVER_BUDGET, http: 422, condition: "Offer initial_price_cents exceeds the buyer's max_budget_cents" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Non-positive counter/offer price or earnest_money > initial price" }
  - { id: ERR_NO_LOCKBOX, http: 409, condition: "Activating a listing that has no INSTALLED lockbox" }
  - { id: ERR_LOCKBOX_DISABLED, http: 409, condition: "Confirming a showing whose lockbox is DISABLED" }
  - { id: ERR_LOCKBOX_HAS_SHOWINGS, http: 409, condition: "Disabling a lockbox that still has CONFIRMED showings" }
  - { id: ERR_SHOWING_CONFLICT, http: 409, condition: "Confirming a showing that overlaps (within turnaround buffer) another CONFIRMED showing" }
  - { id: ERR_BAD_TIME_WINDOW, http: 422, condition: "Showing end_at not strictly after start_at" }
  - { id: ERR_SHOWING_NOT_OVER, http: 409, condition: "Completing/no-showing a showing before its end_at relative to the server clock" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Duplicate listing address (non-terminal), lockbox serial (installed), or agent license_no" }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic request-body schema/type validation failure" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ListingAgent
    description: "An Agent acting on the sell side: owns listings, lockboxes, showing confirmation/completion, seller counters, and rejection/acceptance of offers as the seller."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /listings — create listing"
      - "POST /listings/{id}/activate|withdraw|close — listing lifecycle"
      - "GET /listings/{id}/net-sheet — provisional net-to-seller"
      - "POST /listings/{id}/lockboxes — install lockbox"
      - "POST /lockboxes/{id}/disable — disable lockbox"
      - "POST /showings/{id}/confirm|complete|no-show — showing approval/closeout"
    shared_operations:
      - "POST /offers/{id}/counter — seller counter (turn-gated)"
      - "POST /offers/{id}/accept — accept as seller (turn-gated, OCC)"
      - "POST /offers/{id}/reject — reject as seller"
      - "GET endpoints (listings, offers, showings, lockboxes, contingencies, ledgers)"

  - name: BuyerAgent
    description: "An Agent acting on the buy side: owns buyer registration, showing requests/cancellation, offers, buyer counters, and contingency resolution."
    identity: "entity_backed:Agent"
    exclusive_operations:
      - "POST /buyers — register buyer"
      - "POST /listings/{id}/offers — submit offer"
      - "POST /offers/{id}/withdraw — withdraw own offer"
      - "POST /lockboxes/{id}/showings — request showing"
      - "POST /showings/{id}/cancel — cancel own showing"
      - "POST /contingencies/{id}/resolve|waive|fail — work the contingencies"
    shared_operations:
      - "POST /offers/{id}/counter — buyer counter (turn-gated)"
      - "POST /offers/{id}/accept — accept as buyer (turn-gated, OCC)"
      - "POST /offers/{id}/reject — reject seller counter"
      - "GET endpoints (listings, offers, showings, lockboxes, contingencies, ledgers)"

  - name: Anonymous
    description: "Unauthenticated operator surface for system setup (brokerages, agents, agent suspension, clock) and all public GET reads. Not tied to any Agent entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerages — create brokerage"
      - "POST /agents — register agent"
      - "POST /agents/{id}/suspend — suspend agent"
      - "POST /_clock/set — set server clock (test-driving)"
    shared_operations:
      - "GET endpoints (public reads)"
