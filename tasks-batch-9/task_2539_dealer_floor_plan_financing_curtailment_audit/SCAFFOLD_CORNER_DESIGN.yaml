              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c38_cl: "$.data.id", c38_clstat: "$.data.status" }
            - call: "POST /floorplan/credit-lines/${c38_cl}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
          trigger:
            - call: "POST /floorplan/units"
              payload: { dealer_id: "${c38_d}", credit_line_id: "${c38_cl}", vin: "1CRNCASCADEUNIT01", inventory_class: "NEW", invoice_amount_cents: 3000000, invoice_date: "2026-08-01", title_document_type: "TITLE" }
              as: DealerPrincipal
              as_user_id: "${c38_d}"
              captures: { c38_err: "$.data.error_id" }
          assert:
            - "${c38_clstat} == \"PENDING\", so the line-state check at priority 61 and the MSO check at priority 80 are violated by the very same request"
            - "HTTP status is 409 and ${c38_err} == \"ERR_CREDIT_LINE_NOT_ACTIVE\", not 422 ERR_MSO_REQUIRED_FOR_NEW_UNIT"
            - "no InventoryUnit row exists: GET /floorplan/units?dealer_id=${c38_d} returns total_count 0"
            - "after POST /floorplan/credit-lines/${c38_cl}/activate the identical registration returns 422 with error_id \"ERR_MSO_REQUIRED_FOR_NEW_UNIT\", proving the document check was never reached before"
            - "the same registration with title_document_type \"MSO\" on the ACTIVE line returns 201 with funding_status \"REGISTERED\""

  # ===========================================================================
  - section: endpoints
    instances:
      - name: credit_line_create_and_read_round_trip_on_the_standard_crud_pair
        claim_type: standard_crud
        grounds:
          - endpoints["POST /floorplan/credit-lines"]
          - endpoints["GET /floorplan/credit-lines/{id}"]
          - endpoints["GET /floorplan/credit-lines"]
          - entities.CreditLine
        distinguishing_aspect: "The create half echoes every declared input and seeds the money fields (available_credit_cents equal to the whole limit, everything else zero), and the read halves - by id and by dealer filter - return exactly that row with version still 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PROSPECT Dealer and no credit line yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner CRUD Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "CO" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c39_d: "$.data.id" }
          trigger:
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c39_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c39_cl: "$.data.id", c39_stat: "$.data.status", c39_avail: "$.data.available_credit_cents", c39_grace: "$.data.curtailment_grace_days", c39_ver: "$.data.version" }
            - call: "GET /floorplan/credit-lines/${c39_cl}"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c39_rid: "$.data.id", c39_rstat: "$.data.status", c39_ravail: "$.data.available_credit_cents", c39_rver: "$.data.version" }
            - call: "GET /floorplan/credit-lines"
              payload: { dealer_id: "${c39_d}" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c39_total: "$.meta.total_count", c39_row: "$.data[0].id" }
          assert:
            - "the create returns 201 with ${c39_stat} == \"PENDING\", ${c39_avail} == 500000000, ${c39_grace} == 10 (the declared default, since the input was omitted) and ${c39_ver} == 1"
            - "CreditLine.${c39_cl} echoes credit_limit_cents 500000000, advance_rate_bps_new 10000, advance_rate_bps_used 9000, advance_rate_bps_demonstrator 8500, max_unit_advance_cents_new 20000000, class_sublimit_cents_used 100000000 and class_sublimit_cents_demonstrator 50000000"
            - "CreditLine.${c39_cl}.outstanding_principal_cents == 0, charged_off_principal_cents == 0, class_outstanding_cents_used == 0, class_outstanding_cents_demonstrator == 0, eligible_collateral_cents == 0, borrowing_base_deficiency_cents == 0, activated_at == null and suspension_reason_code == null"
            - "the read returns 200 with ${c39_rid} == ${c39_cl}, ${c39_rstat} == \"PENDING\", ${c39_ravail} == 500000000 and ${c39_rver} == 1 - reading never mutates the row"
            - "the filtered list returns ${c39_total} == 1 with ${c39_row} == ${c39_cl} and has_more false"

      - name: the_activate_action_endpoint_drives_its_transition_and_side_effects
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /floorplan/credit-lines/{id}/activate"]
          - state_machines.CreditLine.PENDING_to_ACTIVE
          - state_machines.Dealer.PROSPECT_to_ACTIVE
          - calculations.dealer_risk_rating
        distinguishing_aspect: "One bodyless action call moves the line PENDING -> ACTIVE, drags the dealer PROSPECT -> ACTIVE, and anchors the first audit due date at activated_at plus the dealer's 180-day cadence, bumping both versions."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One PROSPECT Dealer at risk_score 100 / rating A / audit_frequency_days 180 with next_audit_due_at null, owning one PENDING CreditLine."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "u-sys-1"
            - call: "POST /floorplan/dealers"
              payload: { legal_name: "Corner Activate Motors LLC", franchise_type: "FRANCHISE_NEW_CAR", state_code: "AZ" }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c40_d: "$.data.id", c40_dstat: "$.data.status", c40_dnext: "$.data.next_audit_due_at" }
            - call: "POST /floorplan/credit-lines"
              payload: { dealer_id: "${c40_d}", credit_limit_cents: 500000000, advance_rate_bps_new: 10000, advance_rate_bps_used: 9000, advance_rate_bps_demonstrator: 8500, max_unit_advance_cents_new: 20000000, max_unit_advance_cents_used: 10000000, max_unit_advance_cents_demonstrator: 10000000, class_sublimit_cents_used: 100000000, class_sublimit_cents_demonstrator: 50000000, curtailment_grace_days: 5 }
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c40_cl: "$.data.id" }
            - call: "POST /floorplan/credit-lines/${c40_cl}/curtailment-tiers"
              payload: { inventory_class: "NEW", age_days_from: 90, age_days_to: null, cumulative_paydown_bps: 1000 }
              as: CreditOfficer
              as_user_id: "u-co-1"
          trigger:
            - call: "POST /floorplan/credit-lines/${c40_cl}/activate"
              payload: {}
              as: CreditOfficer
              as_user_id: "u-co-1"
              captures: { c40_stat: "$.data.status", c40_at: "$.data.activated_at", c40_ver: "$.data.version" }
          assert:
            - "${c40_dstat} == \"PROSPECT\" and ${c40_dnext} == null before the action"
            - "HTTP status is 200 with ${c40_stat} == \"ACTIVE\", ${c40_at} == \"2026-08-01T00:00:00Z\" and ${c40_ver} == 2"
            - "Dealer.${c40_d}.status == \"ACTIVE\", next_audit_due_at == \"2027-01-28T00:00:00Z\" (activated_at + 180 days) and version == 2"
            - "CreditLine.${c40_cl}.available_credit_cents is still 500000000 and suspension_reason_code is still null - activation moves no money"
            - "a NEW unit registration against ${c40_cl} now returns 201 instead of 409, so the priority-61 gate has opened"

      - name: a_curtailment_run_without_dealer_id_processes_every_eligible_dealer
        claim_type: bulk_action
        grounds:
          - endpoints["POST /floorplan/curtailment-runs"]
          - calculations.curtailment_run_dealer_total
        distinguishing_aspect: "Omitting dealer_id widens the run to all ACTIVE and SUSPENDED dealers in Dealer.created_at ASC order: two dealers each with one day-90 obligation on a 3000000 advance yield dealer_ids_processed of length two, obligations_marked_due_count 2 and total_required_paydown_cents 600000 from two independently rounded 300000 figures."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, later moved to 2026-10-30T00:00:00Z."
            - "Dealer one and dealer two, created in that order, each ACTIVE with an ACTIVE CreditLine (limit 500000000, NEW rate 10000 bps, grace 5, NEW tier [90, unbounded) at 1000 bps)."
            - "Each dealer has exactly one NEW unit with invoice 3000000 funded on 2026-08-01, so each has a single SCHEDULED obligation with due_date 2026-10-30."
