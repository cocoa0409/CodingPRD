# =============================================================================
# PRD Benchmark Seed Tables — Pool Construction & Remodel (Expert tier)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  552. Pool Construction & Remodel: design/3D & permit, excavation→steel→plumbing→gunite→plaster
  phase gates, equipment & feature selection, progress-draw schedule, subcontractor coordination,
  inspection milestones, startup & owner orientation, warranty/punch.

domain_name: pool-construction
api_prefix: /pool-build

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities under a shared /pool-build prefix, linked by foreign keys in
  # request bodies. No nested URL ownership; every child is discovered via a
  # filtered-list GET (reverse-reachability).

  state_machine_shape: posture_driven
  # PoolProject.posture (OPEN | HOLD | STOP_WORK) is a derived aggregate that
  # gates child field operations. Individual entities add cyclic (DesignPlan
  # revision loop), parallel (DesignPlan status × permit_status) and branching
  # (Inspection SCHEDULED→{PASSED,FAILED,CANCELLED}) shapes.

  relationship_patterns:
    - one_to_many          # PoolProject → its children
    - cross_aggregate      # DrawRequest/CrewAssignment/Inspection reference PhaseGate across aggregates
    - polymorphic: false

  role_model: peer_roles
  # BuilderPM, Designer, Owner, Inspector each own different resource types;
  # Subcontractor acts only on its own CrewAssignments (entity_backed).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PoolProject
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: owner_name, type: string, source: input, description: "Homeowner display name" }
      - { name: owner_user_id, type: string, source: input, description: "Opaque X-User-ID the Owner role authenticates as for this project; not an entity id" }
      - { name: site_address, type: string, source: input, description: "Build site street address" }
      - { name: pool_type, type: enum, source: input, default: GUNITE, description: "GUNITE | REMODEL", constraints: "one of {GUNITE, REMODEL}" }
      - { name: contract_price_cents, type: integer, source: input, description: "Base signed contract price in cents (>0)" }
      - { name: pool_gallons, type: integer, source: input, description: "Design water volume in gallons; used at startup dosing" }
      - { name: construction_status, type: enum, source: system, description: "NOT_STARTED | IN_CONSTRUCTION | STARTUP_READY | ORIENTED | CLOSED", constraints: "one of {NOT_STARTED, IN_CONSTRUCTION, STARTUP_READY, ORIENTED, CLOSED}" }
      - { name: current_phase, type: enum, source: computed, description: "Lowest-sequence PhaseGate whose status != PASSED; STARTUP once all 5 PASSED; NONE when no gates exist. One of {NONE, EXCAVATION, STEEL, PLUMBING, GUNITE, PLASTER, STARTUP}" }
      - { name: design_status, type: enum, source: computed, description: "NO_DESIGN | IN_DESIGN | DESIGN_APPROVED | PERMITTED — derived from the single DesignPlan (see calc design_status_rollup)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | HOLD | STOP_WORK — derived gate (see calc posture_derivation)" }
      - { name: contract_amount_cents, type: integer, source: computed, description: "contract_price_cents + sum of applied_delta_cents over APPLIED ChangeOrders (see calc change_order_discount)" }
      - { name: amount_disbursed_cents, type: integer, source: computed, description: "Running total net cash disbursed to the builder (net of retainage), plus released retainage (see calc draw_ledger)" }
      - { name: retainage_held_cents, type: integer, source: computed, description: "Retainage withheld across FUNDED DrawRequests and not yet released (see calc draw_ledger)" }
      - { name: amount_remaining_cents, type: integer, source: computed, description: "contract_amount_cents - amount_disbursed_cents - retainage_held_cents" }

  - name: DesignPlan
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id; the project this design belongs to. At most one DesignPlan per project." }
      - { name: length_ft, type: number, source: input, description: "Pool length in feet (>0)" }
      - { name: width_ft, type: number, source: input, description: "Pool width in feet (>0)" }
      - { name: avg_depth_ft, type: number, source: input, description: "Average depth in feet (>0)" }
      - { name: status, type: enum, source: system, description: "Design track: DRAFT | RENDERED_3D | OWNER_APPROVED", constraints: "one of {DRAFT, RENDERED_3D, OWNER_APPROVED}" }
      - { name: permit_status, type: enum, source: system, description: "Permit track (independent dimension): NONE | SUBMITTED | ISSUED | REJECTED", constraints: "one of {NONE, SUBMITTED, ISSUED, REJECTED}" }
      - { name: jurisdiction, type: string, source: input, required: false, description: "Permitting authority name; set at SUBMIT_PERMIT" }
      - { name: permit_number, type: string, source: input, required: false, description: "Permit number stamped by jurisdiction at ISSUE_PERMIT" }
      - { name: revision_count, type: integer, source: computed, description: "Number of times a REQUEST_REVISION has sent this plan back to DRAFT; starts at 0" }

  - name: PhaseGate
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id; the project this construction phase belongs to" }
      - { name: phase, type: enum, source: input, description: "EXCAVATION | STEEL | PLUMBING | GUNITE | PLASTER; unique per project", constraints: "one of {EXCAVATION, STEEL, PLUMBING, GUNITE, PLASTER}" }
      - { name: sequence_index, type: integer, source: computed, description: "EXCAVATION=1, STEEL=2, PLUMBING=3, GUNITE=4, PLASTER=5" }
      - { name: budget_cents, type: integer, source: input, description: "Contract dollars allocated to this phase (the draw ceiling for it), in cents" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | INSPECTION_PENDING | PASSED | FAILED", constraints: "one of {PENDING, IN_PROGRESS, INSPECTION_PENDING, PASSED, FAILED}" }
      - { name: inspection_attempts, type: integer, source: computed, description: "Count of Inspections for this gate recorded with a PASS or FAIL outcome; starts at 0" }

  - name: Inspection
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id" }
      - { name: phase_gate_id, type: string, source: input, description: "FK -> PhaseGate.id; the phase being inspected" }
      - { name: inspector_name, type: string, source: input, description: "Municipal/QA inspector display name" }
      - { name: scheduled_at, type: datetime, source: input, description: "ISO 8601 UTC time the inspection milestone is scheduled for" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | CANCELLED", constraints: "one of {SCHEDULED, PASSED, FAILED, CANCELLED}" }
      - { name: result_notes, type: string, source: input, required: false, description: "Free-text notes captured when the inspection is recorded" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Subcontracting company name" }
      - { name: trade, type: enum, source: input, description: "EXCAVATOR | STEEL | PLUMBER | GUNITE | PLASTER | GENERAL", constraints: "one of {EXCAVATOR, STEEL, PLUMBER, GUNITE, PLASTER, GENERAL}" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "one of {ACTIVE, SUSPENDED}" }
      - { name: committed_crew_hours, type: number, source: computed, description: "Sum of duration_hours over this sub's CrewAssignments with status IN {SCHEDULED, COMPLETED} (see calc committed_crew_hours)" }
      - { name: reliability_projected, type: number, source: computed, description: "Forward-looking reliability score 0-100 (see calc subcontractor_reliability variant projected)" }
      - { name: reliability_realized, type: number, source: computed, description: "Realized reliability score 0-100 (see calc subcontractor_reliability variant realized)" }

  - name: CrewAssignment
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id; the site this crew works" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; the sub crew booked" }
      - { name: phase_gate_id, type: string, source: input, description: "FK -> PhaseGate.id; the phase this booking is for" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC interval start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC interval end (exclusive); must be strictly after start_at" }
      - { name: duration_hours, type: number, source: computed, description: "(end_at - start_at) in whole/fractional hours" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "one of {SCHEDULED, COMPLETED, CANCELLED}" }

  - name: ChangeOrder
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id" }
      - { name: category, type: enum, source: input, description: "Equipment/feature or scope category: PUMP | HEATER | LIGHTING | WATER_FEATURE | CLEANER | SCOPE", constraints: "one of {PUMP, HEATER, LIGHTING, WATER_FEATURE, CLEANER, SCOPE}" }
      - { name: description, type: string, source: input, description: "What the change adds or removes" }
      - { name: price_delta_cents, type: integer, source: input, description: "Signed pre-discount contract price change in cents (may be negative)" }
      - { name: phase, type: enum, source: input, required: false, description: "Optional phase whose budget_cents this change adjusts; one of {EXCAVATION, STEEL, PLUMBING, GUNITE, PLASTER}" }
      - { name: applied_delta_cents, type: integer, source: computed, description: "Net signed delta actually posted to contract_amount_cents at APPLY, after volume discount (see calc change_order_discount); 0 until APPLIED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | APPLIED | REVERSED", constraints: "one of {PROPOSED, APPROVED, REJECTED, APPLIED, REVERSED}" }

  - name: DrawRequest
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id" }
      - { name: phase_gate_id, type: string, source: input, description: "FK -> PhaseGate.id; the phase this draw bills against" }
      - { name: requested_cents, type: integer, source: input, description: "Amount the builder requests for this phase, in cents (>0)" }
      - { name: provisional_eligible_cents, type: integer, source: computed, description: "Forward-looking eligible amount snapshotted at CREATE (see calc draw_eligibility variant provisional)" }
      - { name: eligible_cents, type: integer, source: computed, description: "Final eligible amount computed at FUND (see calc draw_eligibility variant final); 0 until FUNDED" }
      - { name: retainage_cents, type: integer, source: computed, description: "Retainage withheld from this draw at FUND (see calc retainage_computation); 0 until FUNDED" }
      - { name: net_disbursed_cents, type: integer, source: computed, description: "eligible_cents - retainage_cents; the cash paid at FUND; 0 until FUNDED" }
      - { name: retainage_released, type: boolean, source: system, default: false, description: "True once this draw's retainage is released to the builder at project STARTUP_READY" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | FUNDED", constraints: "one of {REQUESTED, APPROVED, REJECTED, FUNDED}" }

  - name: PunchItem
    parent: PoolProject
    common_fields: true
    fields:
      - { name: pool_project_id, type: string, source: input, description: "FK -> PoolProject.id" }
      - { name: description, type: string, source: input, description: "Defect / punch-list item description" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | SAFETY", constraints: "one of {MINOR, MAJOR, SAFETY}" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | WAIVED", constraints: "one of {OPEN, RESOLVED, WAIVED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- PoolProject.construction_status (compound/posture-driven) -------------
  - entity: PoolProject
    field: construction_status
    initial_state: NOT_STARTED
    terminal_states: [CLOSED]
    transitions:
      - from: NOT_STARTED
        to: IN_CONSTRUCTION
        trigger: "system — first PhaseGate.start on the project"
        actor: system
        preconditions: ["at least one PhaseGate transitions PENDING→IN_PROGRESS"]
        side_effects: ["construction_status = IN_CONSTRUCTION"]

      - from: IN_CONSTRUCTION
        to: STARTUP_READY
        trigger: "system — PLASTER PhaseGate becomes PASSED (all 5 phases PASSED)"
        actor: system
        preconditions: ["every PhaseGate for the project has status=PASSED", "PLASTER gate just transitioned to PASSED"]
        side_effects:
          - "construction_status = STARTUP_READY"
          - "current_phase recomputed to STARTUP"
          - "RETAINAGE RELEASE cascade: every FUNDED DrawRequest with retainage_released=false is set retainage_released=true; PoolProject.retainage_held_cents moved into amount_disbursed_cents so retainage_held_cents becomes 0 (see calc draw_ledger)"

      - from: STARTUP_READY
        to: ORIENTED
        trigger: "POST /pool-build/pool-projects/{id}/transition action=ORIENT"
        actor: BuilderPM
        preconditions: ["construction_status=STARTUP_READY (ERR_NOT_STARTUP_READY otherwise)"]
        side_effects: ["construction_status = ORIENTED (owner orientation/handoff recorded)"]

      - from: ORIENTED
        to: CLOSED
        trigger: "POST /pool-build/pool-projects/{id}/transition action=CLOSE"
        actor: Owner
        preconditions:
          - "construction_status=ORIENTED (ERR_INVALID_STATE otherwise)"
          - "count of PunchItems for this project with status=OPEN == 0 (ERR_OPEN_PUNCH_ITEMS otherwise)"
        side_effects: ["construction_status = CLOSED (warranty punch cleared, project accepted)"]

  # --- PoolProject.posture (derived gate) -----------------------------------
  - entity: PoolProject
    field: posture
    derivation: |
      Recomputed after: PhaseGate status changes, Inspection record, PunchItem create/resolve,
      DrawRequest fund, ChangeOrder apply/reverse. Priority-ordered (first match wins):
        1) STOP_WORK if any PhaseGate.status = FAILED
        2) STOP_WORK if any PunchItem.status = OPEN and severity = SAFETY
        3) STOP_WORK if amount_remaining_cents < 0
        4) HOLD if any PunchItem.status = OPEN and severity = MAJOR (a major defect holds new field
           work but is not a full stop; MINOR punch items never change posture)
        5) otherwise OPEN
    note: "STOP_WORK blocks phase start, inspection scheduling, crew-assignment create, and draw create. HOLD blocks phase start and crew-assignment create only."

  # --- DesignPlan.status (cyclic revision loop) -----------------------------
  - entity: DesignPlan
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: RENDERED_3D
        trigger: "POST /pool-build/design-plans/{id}/transition action=RENDER"
        actor: Designer
        preconditions: ["status=DRAFT"]
        side_effects: []
      - from: RENDERED_3D
        to: OWNER_APPROVED
        trigger: "POST /pool-build/design-plans/{id}/transition action=APPROVE"
        actor: Owner
        preconditions: ["status=RENDERED_3D"]
        side_effects: ["PoolProject.design_status rolls up to DESIGN_APPROVED (or PERMITTED if permit already ISSUED)"]
      - from: RENDERED_3D
        to: DRAFT
        trigger: "POST /pool-build/design-plans/{id}/transition action=REQUEST_REVISION"
        actor: Owner
        preconditions: ["status=RENDERED_3D"]
        side_effects: ["revision_count += 1"]
      - from: OWNER_APPROVED
        to: DRAFT
        trigger: "POST /pool-build/design-plans/{id}/transition action=REQUEST_REVISION"
        actor: Owner
        preconditions: ["status=OWNER_APPROVED", "permit_status IN {NONE, REJECTED} (cannot revise a design whose permit is SUBMITTED or ISSUED — ERR_INVALID_STATE)"]
        side_effects: ["revision_count += 1", "PoolProject.design_status rolls back toward IN_DESIGN"]

  # --- DesignPlan.permit_status (parallel dimension on the same row) ---------
  - entity: DesignPlan
    field: permit_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /pool-build/design-plans/{id}/transition action=SUBMIT_PERMIT"
        actor: Designer
        preconditions: ["DesignPlan.status = OWNER_APPROVED (ERR_DESIGN_NOT_APPROVED otherwise)"]
        side_effects: ["jurisdiction stored"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /pool-build/design-plans/{id}/transition action=SUBMIT_PERMIT (resubmit)"
        actor: Designer
        preconditions: ["DesignPlan.status = OWNER_APPROVED"]
        side_effects: ["permit_status back to SUBMITTED; awaiting Inspector re-decision"]
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /pool-build/design-plans/{id}/transition action=ISSUE_PERMIT"
        actor: Inspector
        preconditions: ["permit_status = SUBMITTED"]
        side_effects: ["permit_number stored", "PoolProject.design_status rolls up to PERMITTED (unblocks PhaseGate creation/start)"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /pool-build/design-plans/{id}/transition action=REJECT_PERMIT"
        actor: Inspector
        preconditions: ["permit_status = SUBMITTED"]
        side_effects: ["PoolProject.design_status stays below PERMITTED (blocks PhaseGate create/start with ERR_PERMIT_NOT_ISSUED); Designer may resubmit"]

  # --- PhaseGate.status (linear pipeline with FAILED→IN_PROGRESS rework loop) -
  - entity: PhaseGate
    field: status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /pool-build/phase-gates/{id}/start"
        actor: BuilderPM
        preconditions:
          - "PoolProject.posture = OPEN (ERR_POSTURE_STOP_WORK if STOP_WORK, ERR_POSTURE_HOLD if HOLD)"
          - "PoolProject.design_status = PERMITTED (ERR_PERMIT_NOT_ISSUED otherwise) — cross-entity dep PhaseGate→DesignPlan"
          - "every PhaseGate for this project with sequence_index < this.sequence_index has status=PASSED (ERR_PHASE_SEQUENCE otherwise)"
        side_effects:
          - "status = IN_PROGRESS"
          - "if PoolProject.construction_status=NOT_STARTED it becomes IN_CONSTRUCTION"
          - "PoolProject.current_phase recomputed"
      - from: FAILED
        to: IN_PROGRESS
        trigger: "POST /pool-build/phase-gates/{id}/start (rework)"
        actor: BuilderPM
        preconditions:
          - "PoolProject.posture must not be STOP_WORK due to a DIFFERENT failed gate; the gate being reworked is exempt (ERR_POSTURE_STOP_WORK otherwise)"
          - "every lower-sequence PhaseGate has status=PASSED"
        side_effects: ["status = IN_PROGRESS", "PoolProject.posture recomputed (STOP_WORK from this gate lifts)"]
      - from: IN_PROGRESS
        to: INSPECTION_PENDING
        trigger: "system — an Inspection is scheduled for this gate (POST /pool-build/inspections)"
        actor: system
        preconditions: ["status=IN_PROGRESS"]
        side_effects: ["status = INSPECTION_PENDING"]
      - from: INSPECTION_PENDING
        to: PASSED
        trigger: "system — the gate's SCHEDULED Inspection is recorded PASS"
        actor: system
        preconditions: ["status=INSPECTION_PENDING"]
        side_effects:
          - "status = PASSED"
          - "inspection_attempts += 1"
          - "PoolProject.current_phase recomputed (bubble up)"
          - "if this gate is PLASTER and all gates PASSED → PoolProject.construction_status=STARTUP_READY (triggers retainage release cascade)"
      - from: INSPECTION_PENDING
        to: FAILED
        trigger: "system — the gate's SCHEDULED Inspection is recorded FAIL"
        actor: system
        preconditions: ["status=INSPECTION_PENDING"]
        side_effects:
          - "status = FAILED"
          - "inspection_attempts += 1"
          - "PoolProject.posture recomputed → STOP_WORK (rule 1 of posture_derivation)"
      - from: INSPECTION_PENDING
        to: IN_PROGRESS
        trigger: "system — the gate's SCHEDULED Inspection is CANCELLED"
        actor: system
        preconditions: ["status=INSPECTION_PENDING"]
        side_effects: ["status = IN_PROGRESS (back to work, no attempt counted)"]

  # --- Inspection.status (branching fork with divergent side-effects) --------
  - entity: Inspection
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /pool-build/inspections/{id}/record outcome=PASS"
        actor: Inspector
        preconditions: ["status=SCHEDULED"]
        side_effects: ["PhaseGate INSPECTION_PENDING→PASSED (see PhaseGate cascade); inspection_attempts += 1"]
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /pool-build/inspections/{id}/record outcome=FAIL"
        actor: Inspector
        preconditions: ["status=SCHEDULED"]
        side_effects: ["PhaseGate INSPECTION_PENDING→FAILED; posture→STOP_WORK; inspection_attempts += 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pool-build/inspections/{id}/record outcome=CANCEL"
        actor: Inspector
        preconditions: ["status=SCHEDULED"]
        side_effects: ["PhaseGate INSPECTION_PENDING→IN_PROGRESS; no attempt counted"]

  # --- CrewAssignment.status ------------------------------------------------
  - entity: CrewAssignment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /pool-build/crew-assignments/{id}/transition action=COMPLETE"
        actor: Subcontractor
        preconditions:
          - "X-User-ID == subcontractor_id (ownership)"
          - "the referenced PhaseGate.status IN {IN_PROGRESS, INSPECTION_PENDING} (ERR_PHASE_NOT_ACTIVE otherwise) — cross-entity dep CrewAssignment→PhaseGate"
        side_effects: ["status = COMPLETED", "Subcontractor.reliability_realized / reliability_projected recomputed"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /pool-build/crew-assignments/{id}/transition action=CANCEL"
        actor: "Subcontractor | BuilderPM"
        preconditions: ["status=SCHEDULED"]
        side_effects:
          - "status = CANCELLED"
          - "Subcontractor.committed_crew_hours -= this.duration_hours (compensating; see calc committed_crew_hours)"

  # --- Subcontractor.status -------------------------------------------------
  - entity: Subcontractor
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /pool-build/subcontractors/{id}/transition action=SUSPEND"
        actor: BuilderPM
        preconditions: ["status=ACTIVE"]
        side_effects: ["status=SUSPENDED (new CrewAssignments to this sub are rejected with ERR_SUBCONTRACTOR_INACTIVE)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /pool-build/subcontractors/{id}/transition action=REACTIVATE"
        actor: BuilderPM
        preconditions: ["status=SUSPENDED"]
        side_effects: ["status=ACTIVE"]

  # --- ChangeOrder.status (branching + apply/reverse compensation) ----------
  - entity: ChangeOrder
    field: status
    initial_state: PROPOSED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /pool-build/change-orders/{id}/transition action=APPROVE"
        actor: Owner
        preconditions: ["status=PROPOSED"]
        side_effects: []
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /pool-build/change-orders/{id}/transition action=REJECT"
        actor: Owner
        preconditions: ["status=PROPOSED"]
        side_effects: []
      - from: APPROVED
        to: APPLIED
        trigger: "POST /pool-build/change-orders/{id}/transition action=APPLY"
        actor: BuilderPM
        preconditions: ["status=APPROVED (ERR_CHANGE_ORDER_NOT_APPROVED otherwise)"]
        side_effects:
          - "applied_delta_cents computed with volume discount (see calc change_order_discount)"
          - "PoolProject.contract_amount_cents += applied_delta_cents; amount_remaining_cents recomputed"
          - "if phase set: that PhaseGate.budget_cents += applied_delta_cents"
          - "PoolProject.posture recomputed (STOP_WORK from remaining<0 may lift when delta>0)"
          - "increments PoolProject.version by 1"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /pool-build/change-orders/{id}/transition action=REVERSE"
        actor: BuilderPM
        preconditions: ["status=APPLIED"]
        side_effects:
          - "PoolProject.contract_amount_cents -= applied_delta_cents (the exact value posted at APPLY); amount_remaining_cents recomputed"
          - "if phase set: that PhaseGate.budget_cents -= applied_delta_cents"
          - "PoolProject.posture recomputed"
          - "increments PoolProject.version by 1"

  # --- DrawRequest.status ---------------------------------------------------
  - entity: DrawRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, FUNDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /pool-build/draw-requests/{id}/transition action=APPROVE"
        actor: Owner
        preconditions: ["status=REQUESTED"]
        side_effects: []
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /pool-build/draw-requests/{id}/transition action=REJECT"
        actor: Owner
        preconditions: ["status=REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: FUNDED
        trigger: "POST /pool-build/draw-requests/{id}/transition action=FUND"
        actor: BuilderPM
        preconditions:
          - "status=APPROVED (ERR_INVALID_STATE otherwise) — priority above the fiscal check"
          - "the referenced PhaseGate.status = PASSED (ERR_PHASE_NOT_PASSED otherwise) — cross-entity referential"
          - "final eligible_cents (see calc draw_eligibility) must satisfy net_disbursed_cents <= amount_remaining_cents (ERR_DRAW_EXCEEDS_CONTRACT otherwise) — fiscal, lowest priority"
        side_effects:
          - "eligible_cents, retainage_cents, net_disbursed_cents computed (final variant)"
          - "PoolProject.amount_disbursed_cents += net_disbursed_cents; retainage_held_cents += retainage_cents; amount_remaining_cents recomputed"
          - "PoolProject.posture recomputed"
          - "increments PoolProject.version by 1"

  # --- PunchItem.status -----------------------------------------------------
  - entity: PunchItem
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /pool-build/punch-items/{id}/resolve action=RESOLVE"
        actor: "BuilderPM | Owner"
        preconditions: ["status=OPEN"]
        side_effects: ["if severity IN {SAFETY, MAJOR}: PoolProject.posture recomputed (STOP_WORK/HOLD may lift)"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /pool-build/punch-items/{id}/resolve action=WAIVE"
        actor: Owner
        preconditions: ["status=OPEN"]
        side_effects: ["if severity IN {SAFETY, MAJOR}: PoolProject.posture recomputed (STOP_WORK/HOLD may lift)"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on PoolProject.version)
# =============================================================================
concurrency_rules:
  - rule_id: draw-create-stale-project
    parent_entity: PoolProject
    write_endpoint: "POST /pool-build/draw-requests"
    occ_field: "expected_pool_project_version"
    description: |
      Creating a DrawRequest against a PoolProject whose version has advanced
      since the client last observed it is rejected. A prior write (an earlier
      draw create, a change-order apply/reverse, or a ledger-mutating fund) has
      moved the project's contract_amount_cents / amount_remaining_cents, so the
      requesting client's view of the fundable ceiling is stale; the create must
      re-read the project first.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: draw_eligibility
    trigger: "DrawRequest CREATE (provisional variant → provisional_eligible_cents) and DrawRequest FUND (final variant → eligible_cents)"
    algorithm: forward_looking / chronological (dual-variant)
    input_set: "the single PhaseGate referenced by phase_gate_id, plus the project ledger snapshot"
    formula: |
      phase_earned = round_half_up(PhaseGate.budget_cents * completion_factor(PhaseGate.status))
      eligible = max(0, min(phase_earned, requested_cents))
      # NOTE: eligible is NOT capped at contract remaining — the contract ceiling is
      # enforced separately as a fiscal VALIDATION at FUND (net_disbursed_cents <=
      # amount_remaining_cents, else ERR_DRAW_EXCEEDS_CONTRACT), so that check is reachable.
      # completion_factor(status):
      #   PENDING = 0.0, IN_PROGRESS = 0.5, INSPECTION_PENDING = 0.8, PASSED = 1.0, FAILED = 0.0
    constants:
      FACTOR_IN_PROGRESS: 0.5
      FACTOR_INSPECTION_PENDING: 0.8
      FACTOR_PASSED: 1.0
    precision: "integer cents, round_half_up on phase_earned"
    variants:
      - name: provisional
        when: "at DrawRequest CREATE — forward-looking; counts partial progress via completion_factor for IN_PROGRESS/INSPECTION_PENDING gates"
        difference: "snapshots provisional_eligible_cents; a gate not yet PASSED still yields a positive earned amount (0.5 or 0.8 of budget)"
      - name: final
        when: "at DrawRequest FUND — chronological; the gate MUST be PASSED, so completion_factor is 1.0; any non-PASSED gate is blocked by ERR_PHASE_NOT_PASSED before this runs"
        difference: "phase_earned = budget_cents (factor 1.0); differs from provisional whenever the draw was created before the gate PASSED"

  - name: retainage_computation
    trigger: "DrawRequest FUND"
    algorithm: aggregation (per-line rounding — order pinned)
    input_set: "the funding DrawRequest's own eligible_cents; the project retainage rollup sums per-line results"
    formula: |
      retainage_cents = round_half_up(eligible_cents * RETAINAGE_PCT)   # rounded PER DRAW LINE
      net_disbursed_cents = eligible_cents - retainage_cents
      # Project rollup: retainage_held_cents = SUM over FUNDED, not-yet-released draws of
      # their individually-rounded retainage_cents.  Pinned order: round each draw's
      # retainage FIRST, then sum.  (Sum-then-round is explicitly NOT used and yields
      # different cents when multiple draws round in the same direction.)
    constants:
      RETAINAGE_PCT: 0.10
    precision: "integer cents, round_half_up per draw line, then integer sum"

  - name: change_order_discount
    trigger: "ChangeOrder APPLY (APPROVED→APPLIED)"
    algorithm: tiered_pricing (circular-looking dependency — evaluation order pinned)
    input_set: "this ChangeOrder plus the set of already-APPLIED ChangeOrders for the project"
    formula: |
      # Circular-looking: contract_amount depends on applied_delta, which depends on the
      # discount tier, which is keyed on cumulative applied change value — part of the
      # contract. Resolve by PINNED evaluation order:
      #   step 1: cumulative_pre = SUM of price_delta_cents over the project's already-APPLIED
      #           ChangeOrders with price_delta_cents > 0  (PRE-discount base amounts, this CO excluded)
      #   step 2: discount_pct = tier(cumulative_pre)   # tier read BEFORE adding this CO
      #   step 3: if price_delta_cents > 0:
      #               applied_delta_cents = round_half_up(price_delta_cents * (1 - discount_pct))
      #           else:
      #               applied_delta_cents = price_delta_cents            # no discount on credits
      #   step 4: contract_amount_cents += applied_delta_cents
      # tier(cumulative_pre):
      #   cumulative_pre < 500000            -> 0.00
      #   500000 <= cumulative_pre < 1500000 -> 0.03
      #   cumulative_pre >= 1500000          -> 0.05
    constants:
      TIER1_CEILING_CENTS: 500000
      TIER2_CEILING_CENTS: 1500000
      TIER1_PCT: 0.00
      TIER2_PCT: 0.03
      TIER3_PCT: 0.05
    precision: "integer cents, round_half_up"

  - name: subcontractor_reliability
    trigger: "GET Subcontractor; recomputed on CrewAssignment complete/cancel and Inspection record"
    algorithm: weighted_scoring (dual-variant)
    input_set: "the subcontractor's CrewAssignments and their referenced PhaseGates"
    formula: |
      # projected (forward-looking): over CrewAssignments with status IN {SCHEDULED, COMPLETED}
      #   good_proj  = count whose referenced PhaseGate.status != FAILED
      #   total_proj = count of {SCHEDULED, COMPLETED} assignments
      #   reliability_projected = 100 if total_proj == 0 else round_half_up(100 * good_proj / total_proj)
      # realized (backward-looking): over CrewAssignments with status = COMPLETED only
      #   good_real  = count whose referenced PhaseGate.status = PASSED AND inspection_attempts == 1
      #   total_real = count of COMPLETED assignments
      #   reliability_realized = 100 if total_real == 0 else round_half_up(100 * good_real / total_real)
    constants:
      DEFAULT_SCORE: 100
    precision: "integer 0-100, round_half_up"
    variants:
      - name: projected
        when: "planning view — includes still-SCHEDULED bookings; a gate merely not-FAILED counts as good"
        difference: "denominator includes SCHEDULED assignments; numerator credits non-FAILED gates"
      - name: realized
        when: "performance view — only COMPLETED bookings whose gate PASSED on the first inspection attempt count as good"
        difference: "denominator excludes SCHEDULED; numerator requires PASSED AND inspection_attempts==1; diverges from projected whenever a gate passed only after rework or is still open"

  - name: draw_ledger
    trigger: "DrawRequest fund, ChangeOrder apply/reverse, retainage release at STARTUP_READY"
    algorithm: aggregation (conserved quantity)
    input_set: "all FUNDED DrawRequests and APPLIED ChangeOrders of the project"
    formula: |
      contract_amount_cents  = contract_price_cents + SUM(applied_delta_cents over APPLIED ChangeOrders)
      retainage_held_cents   = SUM(retainage_cents over FUNDED DrawRequests with retainage_released=false)
      amount_disbursed_cents = SUM(net_disbursed_cents over FUNDED DrawRequests)
                               + SUM(retainage_cents over FUNDED DrawRequests with retainage_released=true)
      amount_remaining_cents = contract_amount_cents - amount_disbursed_cents - retainage_held_cents
      # INVARIANT (conserved): contract_amount_cents == amount_disbursed_cents
      #                        + retainage_held_cents + amount_remaining_cents  (always, by construction)
    precision: "integer cents"

  - name: committed_crew_hours
    trigger: "CrewAssignment create (forward) and cancel (compensating)"
    algorithm: aggregation (conserved quantity)
    input_set: "the subcontractor's CrewAssignments with status IN {SCHEDULED, COMPLETED}"
    formula: |
      duration_hours = (end_at - start_at) total seconds / 3600
      Subcontractor.committed_crew_hours = SUM(duration_hours over that sub's CrewAssignments
                                               with status IN {SCHEDULED, COMPLETED})
      # INVARIANT: create adds exactly duration_hours; cancel subtracts exactly the same
      # duration_hours; a create+cancel pair leaves committed_crew_hours unchanged.
    precision: "hours to 2 decimal places, round_half_up"

  - name: design_status_rollup
    trigger: "DesignPlan create and every DesignPlan transition"
    algorithm: projection
    input_set: "the single DesignPlan of the project"
    formula: |
      no DesignPlan                                             -> NO_DESIGN
      DesignPlan.status IN {DRAFT, RENDERED_3D}                 -> IN_DESIGN  (or NO_DESIGN while DRAFT & never rendered)
      DesignPlan.status = OWNER_APPROVED, permit_status != ISSUED -> DESIGN_APPROVED
      DesignPlan.status = OWNER_APPROVED, permit_status = ISSUED  -> PERMITTED
    precision: "n/a"

  - name: phase_progression
    trigger: "PhaseGate start and Inspection record (pass)"
    algorithm: projection
    input_set: "all PhaseGates of the project ordered by sequence_index"
    formula: |
      if no PhaseGates -> current_phase = NONE
      elif every PhaseGate.status = PASSED -> current_phase = STARTUP
      else current_phase = phase of the PhaseGate with the LOWEST sequence_index whose status != PASSED
    precision: "n/a"

  - name: posture_derivation
    trigger: "PhaseGate status change, Inspection record, PunchItem create/resolve, DrawRequest fund, ChangeOrder apply/reverse"
    algorithm: priority_rules
    input_set: "the project's PhaseGates, PunchItems, and ledger snapshot"
    formula: |
      # first matching rule wins:
      1) STOP_WORK if any PhaseGate.status = FAILED
      2) STOP_WORK if any PunchItem.status = OPEN and severity = SAFETY
      3) STOP_WORK if amount_remaining_cents < 0
      4) HOLD     if any PunchItem.status = OPEN and severity = MAJOR
      5) OPEN     otherwise
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number = checked first)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation (per §1.7); Owner ownership: X-User-ID == PoolProject.owner_user_id; Subcontractor ownership: X-User-ID == CrewAssignment.subcontractor_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-body ids resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present; enum values legal; numeric fields >0 where required; start_at < end_at for CrewAssignment (ERR_INVALID_INTERVAL)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all writes

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_pool_project_version equals current PoolProject.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /pool-build/draw-requests"

  - priority: 7
    category: business_safety
    check: "PoolProject.posture gate: STOP_WORK blocks phase start / inspection create / crew-assignment create / draw create; HOLD blocks phase start and crew-assignment create"
    error_id: ERR_POSTURE_STOP_WORK
    http_status: 409
    applies_to: "phase start, inspection create, crew-assignment create, draw create"

  - priority: 8
    category: business_safety
    check: "PoolProject.posture = HOLD blocks phase start and crew-assignment create"
    error_id: ERR_POSTURE_HOLD
    http_status: 409
    applies_to: "phase start, crew-assignment create"

  - priority: 9
    category: business_temporal
    check: "CrewAssignment interval must not overlap another non-CANCELLED CrewAssignment of the SAME subcontractor (half-open [start,end); adjacency end==start allowed)"
    error_id: ERR_SUBCONTRACTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /pool-build/crew-assignments"

  - priority: 10
    category: business_temporal
    check: "Site capacity: CrewAssignment interval must not overlap another non-CANCELLED CrewAssignment on the SAME pool_project_id (aggregate capacity 1)"
    error_id: ERR_SITE_OCCUPIED
    http_status: 409
    applies_to: "POST /pool-build/crew-assignments"

  - priority: 11
    category: business_temporal
    check: "Cure buffer: a PLASTER-phase CrewAssignment must start at least CURE_BUFFER_HOURS (24h) after the end_at of any non-CANCELLED GUNITE-phase CrewAssignment on the same site"
    error_id: ERR_CURE_BUFFER
    http_status: 409
    applies_to: "POST /pool-build/crew-assignments"

  - priority: 12
    category: business_referential
    check: "PhaseGate start requires PoolProject.design_status=PERMITTED (permit ISSUED)"
    error_id: ERR_PERMIT_NOT_ISSUED
    http_status: 409
    applies_to: "phase-gates create, phase start"

  - priority: 13
    category: business_referential
    check: "Phase ordering: lower-sequence gates must all be PASSED before start; crew COMPLETE requires PhaseGate active; draw FUND requires PhaseGate PASSED"
    error_id: "ERR_PHASE_SEQUENCE | ERR_PHASE_NOT_ACTIVE | ERR_PHASE_NOT_PASSED"
    http_status: 409
    applies_to: "phase start, crew-assignment transition, draw fund"

  - priority: 14
    category: business_constraint
    check: "Uniqueness / duplicate guards: one DesignPlan per project (ERR_DESIGN_ALREADY_EXISTS); one PhaseGate per phase (ERR_PHASE_ALREADY_EXISTS); Subcontractor must be ACTIVE (ERR_SUBCONTRACTOR_INACTIVE). Scheduling an inspection requires the gate IN_PROGRESS (ERR_PHASE_NOT_IN_PROGRESS), which itself prevents a duplicate in-flight inspection since the first schedule moves the gate to INSPECTION_PENDING."
    error_id: "ERR_DESIGN_ALREADY_EXISTS | ERR_PHASE_ALREADY_EXISTS | ERR_SUBCONTRACTOR_INACTIVE | ERR_PHASE_NOT_IN_PROGRESS | ERR_DESIGN_NOT_APPROVED | ERR_CHANGE_ORDER_NOT_APPROVED"
    http_status: 409
    applies_to: "various creates and transitions"

  - priority: 15
    category: business_fiscal
    check: "Draw FUND net_disbursed_cents must not exceed PoolProject.amount_remaining_cents; project CLOSE requires zero OPEN PunchItems"
    error_id: "ERR_DRAW_EXCEEDS_CONTRACT | ERR_OPEN_PUNCH_ITEMS"
    http_status: 409
    applies_to: "draw fund, project close"

# =============================================================================
# §1.5 API Endpoint Table (35 endpoints)
# =============================================================================
endpoints:
  # --- PoolProject ---
  - method: POST
    path: "/pool-build/pool-projects"
    description: "Create a PoolProject. construction_status=NOT_STARTED, all ledger fields initialized, version=1."
    roles: [BuilderPM]
    code: 201
    input: [owner_name, owner_user_id, site_address, "pool_type?", contract_price_cents, pool_gallons]
    output: PoolProject
    side_effects: ["construction_status=NOT_STARTED", "contract_amount_cents=contract_price_cents", "amount_remaining_cents=contract_price_cents", "posture=OPEN", "design_status=NO_DESIGN"]

  - method: GET
    path: "/pool-build/pool-projects/{id}"
    description: "Read a PoolProject including all computed ledger, posture, phase, and version fields."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: PoolProject
    side_effects: []

  - method: POST
    path: "/pool-build/pool-projects/{id}/transition"
    description: "Advance project lifecycle. action=ORIENT (STARTUP_READY→ORIENTED, BuilderPM); action=CLOSE (ORIENTED→CLOSED, Owner, requires 0 OPEN punch items)."
    roles: [BuilderPM, Owner]
    code: 200
    input: [action]
    output: PoolProject
    side_effects: ["construction_status transition per action"]

  # --- DesignPlan ---
  - method: POST
    path: "/pool-build/design-plans"
    description: "Create the project's DesignPlan. status=DRAFT, permit_status=NONE, revision_count=0. At most one per project."
    roles: [Designer]
    code: 201
    input: [pool_project_id, length_ft, width_ft, avg_depth_ft]
    output: DesignPlan
    side_effects: ["status=DRAFT", "PoolProject.design_status rollup"]

  - method: GET
    path: "/pool-build/design-plans/{id}"
    description: "Read a DesignPlan."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: DesignPlan
    side_effects: []

  - method: GET
    path: "/pool-build/design-plans"
    description: "List DesignPlans, optionally filtered by pool_project_id (reverse-reachability for DesignPlan.pool_project_id)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "limit?", "offset?"]
    output: DesignPlan[]
    side_effects: []

  - method: POST
    path: "/pool-build/design-plans/{id}/transition"
    description: "Design & permit workflow. action=RENDER (Designer), APPROVE|REQUEST_REVISION (Owner), SUBMIT_PERMIT (Designer), ISSUE_PERMIT|REJECT_PERMIT (Inspector). jurisdiction supplied at SUBMIT_PERMIT; permit_number at ISSUE_PERMIT."
    roles: [Designer, Owner, Inspector]
    code: 200
    input: [action, "jurisdiction?", "permit_number?"]
    output: DesignPlan
    side_effects: ["status and/or permit_status transition per action", "revision_count/PoolProject.design_status/posture recomputed"]

  # --- PhaseGate ---
  - method: POST
    path: "/pool-build/phase-gates"
    description: "Create a construction PhaseGate for a phase. Requires PoolProject.design_status=PERMITTED. status=PENDING; sequence_index derived from phase; one gate per phase."
    roles: [BuilderPM]
    code: 201
    input: [pool_project_id, phase, budget_cents]
    output: PhaseGate
    side_effects: ["status=PENDING", "sequence_index set"]

  - method: GET
    path: "/pool-build/phase-gates/{id}"
    description: "Read a PhaseGate."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: PhaseGate
    side_effects: []

  - method: GET
    path: "/pool-build/phase-gates"
    description: "List PhaseGates, optionally filtered by pool_project_id (reverse-reachability for PhaseGate.pool_project_id)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "limit?", "offset?"]
    output: PhaseGate[]
    side_effects: []

  - method: POST
    path: "/pool-build/phase-gates/{id}/start"
    description: "Start a phase (PENDING→IN_PROGRESS, or FAILED→IN_PROGRESS rework). Enforces posture, permit, and phase-sequence preconditions."
    roles: [BuilderPM]
    code: 200
    input: []
    output: PhaseGate
    side_effects: ["status=IN_PROGRESS", "PoolProject.construction_status→IN_CONSTRUCTION if NOT_STARTED", "current_phase recomputed"]

  # --- Inspection ---
  - method: POST
    path: "/pool-build/inspections"
    description: "Schedule an inspection milestone for a PhaseGate. Requires PhaseGate.status=IN_PROGRESS. Side effect: gate → INSPECTION_PENDING."
    roles: [Inspector]
    code: 201
    input: [pool_project_id, phase_gate_id, inspector_name, scheduled_at]
    output: Inspection
    side_effects: ["status=SCHEDULED", "PhaseGate IN_PROGRESS→INSPECTION_PENDING"]

  - method: GET
    path: "/pool-build/inspections/{id}"
    description: "Read an Inspection."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/pool-build/inspections"
    description: "List Inspections, optionally filtered by pool_project_id and/or phase_gate_id (reverse-reachability for both FKs)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "phase_gate_id?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/pool-build/inspections/{id}/record"
    description: "Record an inspection result. outcome=PASS (gate→PASSED, cascades), FAIL (gate→FAILED, posture→STOP_WORK), or CANCEL (gate→IN_PROGRESS)."
    roles: [Inspector]
    code: 200
    input: [outcome, "result_notes?"]
    output: Inspection
    side_effects: ["Inspection→PASSED/FAILED/CANCELLED", "PhaseGate cascade", "posture / construction_status / retainage cascades"]

  # --- Subcontractor ---
  - method: POST
    path: "/pool-build/subcontractors"
    description: "Register a Subcontractor. status=ACTIVE, committed_crew_hours=0."
    roles: [BuilderPM]
    code: 201
    input: [company_name, trade]
    output: Subcontractor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/pool-build/subcontractors/{id}"
    description: "Read a Subcontractor including committed_crew_hours and both reliability variants."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: Subcontractor
    side_effects: []

  - method: POST
    path: "/pool-build/subcontractors/{id}/transition"
    description: "action=SUSPEND (ACTIVE→SUSPENDED) or REACTIVATE (SUSPENDED→ACTIVE). A SUSPENDED sub cannot receive new CrewAssignments."
    roles: [BuilderPM]
    code: 200
    input: [action]
    output: Subcontractor
    side_effects: ["status transition"]

  # --- CrewAssignment ---
  - method: POST
    path: "/pool-build/crew-assignments"
    description: "Book a subcontractor crew to a phase for an interval. Enforces posture, subcontractor double-booking, site occupancy, and gunite→plaster cure buffer."
    roles: [BuilderPM]
    code: 201
    input: [pool_project_id, subcontractor_id, phase_gate_id, start_at, end_at]
    output: CrewAssignment
    side_effects: ["status=SCHEDULED", "duration_hours computed", "Subcontractor.committed_crew_hours += duration_hours"]

  - method: GET
    path: "/pool-build/crew-assignments/{id}"
    description: "Read a CrewAssignment."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: CrewAssignment
    side_effects: []

  - method: GET
    path: "/pool-build/crew-assignments"
    description: "List CrewAssignments, optionally filtered by pool_project_id, subcontractor_id, and/or phase_gate_id (reverse-reachability for all three FKs)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "subcontractor_id?", "phase_gate_id?", "limit?", "offset?"]
    output: CrewAssignment[]
    side_effects: []

  - method: POST
    path: "/pool-build/crew-assignments/{id}/transition"
    description: "action=COMPLETE (Subcontractor owner only; requires gate active) or CANCEL (Subcontractor owner or BuilderPM; releases committed_crew_hours)."
    roles: [Subcontractor, BuilderPM]
    code: 200
    input: [action]
    output: CrewAssignment
    side_effects: ["status transition", "committed_crew_hours / reliability recomputed"]

  # --- ChangeOrder ---
  - method: POST
    path: "/pool-build/change-orders"
    description: "Propose a change order (equipment/feature selection or scope). status=PROPOSED, applied_delta_cents=0."
    roles: [BuilderPM]
    code: 201
    input: [pool_project_id, category, description, price_delta_cents, "phase?"]
    output: ChangeOrder
    side_effects: ["status=PROPOSED"]

  - method: GET
    path: "/pool-build/change-orders/{id}"
    description: "Read a ChangeOrder."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/pool-build/change-orders"
    description: "List ChangeOrders, optionally filtered by pool_project_id (reverse-reachability for ChangeOrder.pool_project_id)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/pool-build/change-orders/{id}/transition"
    description: "action=APPROVE|REJECT (Owner), APPLY (BuilderPM; posts discounted applied_delta to contract, bumps project version), REVERSE (BuilderPM; compensates the exact applied_delta, bumps project version)."
    roles: [Owner, BuilderPM]
    code: 200
    input: [action]
    output: ChangeOrder
    side_effects: ["status transition", "contract_amount_cents / phase budget / posture updated", "increments PoolProject.version by 1 on APPLY and REVERSE"]

  # --- DrawRequest ---
  - method: POST
    path: "/pool-build/draw-requests"
    description: "Create a progress draw against a phase. Requires expected_pool_project_version (OCC). Computes provisional_eligible_cents. Bumps project version."
    roles: [BuilderPM]
    code: 201
    input: [pool_project_id, phase_gate_id, requested_cents, expected_pool_project_version]
    output: DrawRequest
    side_effects: ["status=REQUESTED", "provisional_eligible_cents computed", "increments PoolProject.version by 1"]

  - method: GET
    path: "/pool-build/draw-requests/{id}"
    description: "Read a DrawRequest."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []

  - method: GET
    path: "/pool-build/draw-requests"
    description: "List DrawRequests, optionally filtered by pool_project_id and/or phase_gate_id (reverse-reachability for both FKs)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "phase_gate_id?", "limit?", "offset?"]
    output: DrawRequest[]
    side_effects: []

  - method: POST
    path: "/pool-build/draw-requests/{id}/transition"
    description: "action=APPROVE|REJECT (Owner), FUND (BuilderPM; requires gate PASSED, computes final eligible/retainage/net, updates ledger, bumps project version)."
    roles: [Owner, BuilderPM]
    code: 200
    input: [action]
    output: DrawRequest
    side_effects: ["status transition", "on FUND: ledger + posture recomputed, increments PoolProject.version by 1"]

  # --- PunchItem ---
  - method: POST
    path: "/pool-build/punch-items"
    description: "File a warranty/punch item. status=OPEN. A SAFETY punch drives posture→STOP_WORK; a MAJOR punch drives posture→HOLD; MINOR does not change posture."
    roles: [Inspector, Owner]
    code: 201
    input: [pool_project_id, description, severity]
    output: PunchItem
    side_effects: ["status=OPEN", "if severity=SAFETY: posture recomputed (→STOP_WORK)", "if severity=MAJOR: posture recomputed (→HOLD unless a STOP_WORK condition dominates)"]

  - method: GET
    path: "/pool-build/punch-items/{id}"
    description: "Read a PunchItem."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: []
    output: PunchItem
    side_effects: []

  - method: GET
    path: "/pool-build/punch-items"
    description: "List PunchItems, optionally filtered by pool_project_id (reverse-reachability for PunchItem.pool_project_id)."
    roles: [BuilderPM, Designer, Owner, Inspector, Subcontractor]
    code: 200
    input: ["pool_project_id?", "limit?", "offset?"]
    output: PunchItem[]
    side_effects: []

  - method: POST
    path: "/pool-build/punch-items/{id}/resolve"
    description: "action=RESOLVE (BuilderPM or Owner) or WAIVE (Owner). Resolving/waiving a SAFETY punch recomputes posture (STOP_WORK may lift)."
    roles: [BuilderPM, Owner]
    code: 200
    input: [action]
    output: PunchItem
    side_effects: ["status→RESOLVED/WAIVED", "if severity=SAFETY: posture recomputed"]

  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock used for interval/overlap/buffer evaluation. Default (before any call) is exactly 2026-05-01T00:00:00Z; the clock never falls back to real wall-clock time."
    roles: [BuilderPM]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not authorized for the operation, or ownership check failed (Owner/Subcontractor acting on a resource not theirs)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or referenced FK id does not resolve to an existing resource" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, illegal enum value, or non-positive numeric where a positive is required" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "CrewAssignment end_at is not strictly after start_at" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not legal from the resource's current state" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_pool_project_version does not match the PoolProject's current version (OCC)" }
  - { id: ERR_POSTURE_STOP_WORK, http: 409, condition: "PoolProject.posture=STOP_WORK blocks this field operation" }
  - { id: ERR_POSTURE_HOLD, http: 409, condition: "PoolProject.posture=HOLD blocks phase start / crew-assignment create" }
  - { id: ERR_DESIGN_ALREADY_EXISTS, http: 409, condition: "A DesignPlan already exists for the project" }
  - { id: ERR_DESIGN_NOT_APPROVED, http: 409, condition: "SUBMIT_PERMIT attempted while DesignPlan.status != OWNER_APPROVED" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 409, condition: "PhaseGate create/start attempted while PoolProject.design_status != PERMITTED" }
  - { id: ERR_PHASE_ALREADY_EXISTS, http: 409, condition: "A PhaseGate already exists for that phase on the project" }
  - { id: ERR_PHASE_SEQUENCE, http: 409, condition: "Attempt to start a phase before all lower-sequence phases are PASSED" }
  - { id: ERR_PHASE_NOT_IN_PROGRESS, http: 409, condition: "Inspection scheduled for a PhaseGate whose status != IN_PROGRESS" }
  - { id: ERR_PHASE_NOT_ACTIVE, http: 409, condition: "CrewAssignment COMPLETE attempted while its PhaseGate.status not in {IN_PROGRESS, INSPECTION_PENDING}" }
  - { id: ERR_PHASE_NOT_PASSED, http: 409, condition: "DrawRequest FUND attempted while its PhaseGate.status != PASSED" }
  - { id: ERR_SUBCONTRACTOR_DOUBLE_BOOKED, http: 409, condition: "CrewAssignment interval overlaps another non-CANCELLED assignment of the same subcontractor" }
  - { id: ERR_SITE_OCCUPIED, http: 409, condition: "CrewAssignment interval overlaps another non-CANCELLED assignment on the same site (capacity 1)" }
  - { id: ERR_CURE_BUFFER, http: 409, condition: "PLASTER crew starts less than 24h after a GUNITE crew's end on the same site" }
  - { id: ERR_SUBCONTRACTOR_INACTIVE, http: 409, condition: "CrewAssignment references a SUSPENDED subcontractor" }
  - { id: ERR_CHANGE_ORDER_NOT_APPROVED, http: 409, condition: "APPLY attempted on a ChangeOrder whose status != APPROVED" }
  - { id: ERR_DRAW_EXCEEDS_CONTRACT, http: 409, condition: "DrawRequest FUND net_disbursed_cents would exceed PoolProject.amount_remaining_cents" }
  - { id: ERR_OPEN_PUNCH_ITEMS, http: 409, condition: "Project CLOSE attempted while OPEN PunchItems remain" }
  - { id: ERR_NOT_STARTUP_READY, http: 409, condition: "ORIENT attempted while construction_status != STARTUP_READY" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BuilderPM
    description: "Pool builder's project manager — owns the project record, phase gates, subcontractor roster, crew bookings, change-order application, draw funding, punch resolution."
    identity: opaque
    exclusive_operations:
      - "POST /pool-build/pool-projects — create project"
      - "POST /pool-build/pool-projects/{id}/transition action=ORIENT"
      - "POST /pool-build/phase-gates — create phase gate"
      - "POST /pool-build/phase-gates/{id}/start"
      - "POST /pool-build/subcontractors — register subcontractor"
      - "POST /pool-build/subcontractors/{id}/transition action IN {SUSPEND, REACTIVATE}"
      - "POST /pool-build/crew-assignments — book crew"
      - "POST /pool-build/change-orders — propose change order"
      - "POST /pool-build/change-orders/{id}/transition action IN {APPLY, REVERSE}"
      - "POST /pool-build/draw-requests — create draw"
      - "POST /pool-build/draw-requests/{id}/transition action=FUND"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /pool-build/crew-assignments/{id}/transition action=CANCEL (with Subcontractor owner)"
      - "POST /pool-build/punch-items/{id}/resolve action=RESOLVE (with Owner)"
      - "all GET reads"

  - name: Designer
    description: "Designs the pool (3D render) and drives the permit submission."
    identity: opaque
    exclusive_operations:
      - "POST /pool-build/design-plans — create design"
      - "POST /pool-build/design-plans/{id}/transition action IN {RENDER, SUBMIT_PERMIT}"
    shared_operations:
      - "all GET reads"

  - name: Owner
    description: "Homeowner — approves design, requests revisions, decides change orders and draws, orients/closes the project, files punch items. Ownership: X-User-ID == PoolProject.owner_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /pool-build/design-plans/{id}/transition action IN {APPROVE, REQUEST_REVISION}"
      - "POST /pool-build/pool-projects/{id}/transition action=CLOSE"
      - "POST /pool-build/change-orders/{id}/transition action IN {APPROVE, REJECT}"
      - "POST /pool-build/draw-requests/{id}/transition action IN {APPROVE, REJECT}"
      - "POST /pool-build/punch-items/{id}/resolve action=WAIVE"
    shared_operations:
      - "POST /pool-build/punch-items — file punch (with Inspector)"
      - "POST /pool-build/punch-items/{id}/resolve action=RESOLVE (with BuilderPM)"
      - "all GET reads"

  - name: Inspector
    description: "Municipal/QA inspector — issues/rejects the permit, schedules and records inspection milestones, files punch items."
    identity: opaque
    exclusive_operations:
      - "POST /pool-build/design-plans/{id}/transition action IN {ISSUE_PERMIT, REJECT_PERMIT}"
      - "POST /pool-build/inspections — schedule inspection"
      - "POST /pool-build/inspections/{id}/record"
    shared_operations:
      - "POST /pool-build/punch-items — file punch (with Owner)"
      - "all GET reads"

  - name: Subcontractor
    description: "A booked crew company — completes or cancels only its OWN crew assignments. Ownership: X-User-ID == CrewAssignment.subcontractor_id."
    identity: "entity_backed:Subcontractor"
    exclusive_operations:
      - "POST /pool-build/crew-assignments/{id}/transition action=COMPLETE (own assignment only)"
    shared_operations:
      - "POST /pool-build/crew-assignments/{id}/transition action=CANCEL (own assignment; also BuilderPM)"
      - "all GET reads"
