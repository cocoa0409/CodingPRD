scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_201_with_common_fields
        claim_type: creation
        grounds:
          - "entities.SettlementProgram"
          - "endpoints.POST /settlement-programs"
        distinguishing_aspect: "POST with required fields returns 201; system fields id/created_at/updated_at/version populated; current_utc initialized to default."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-CRE", tort_name: "Test", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id, ver: $.data.version, cur_utc: $.data.current_utc, matrix_pub: $.data.matrix_published }
          assert:
            - "captured ver == 1"
            - "captured cur_utc == '2026-08-01T00:00:00Z'"
            - "captured matrix_pub == false"

      - name: create_claim_missing_claimant_id_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Claim.fields.claimant_id"
          - "endpoints.POST /settlement-programs/{pid}/claims"
        distinguishing_aspect: "claimant_id is required input on claim creation; omitting it triggers ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-REQ", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims"
              payload: {}
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: claim_default_enums_applied
        claim_type: defaults
        grounds:
          - "entities.Claim.fields.eligibility_status"
          - "entities.Claim.fields.lien_posture"
        distinguishing_aspect: "New claim defaults eligibility_status=PENDING, injury_verification_status=PENDING, lien_posture=NOT_STARTED without client input."
        test_recipe:
          setup: ["Program + Claimant exist"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-DEF", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Sam", date_of_birth: "1960-01-01", ssn_last4: "1010", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { elig: $.data.eligibility_status, inj: $.data.injury_verification_status, lien_p: $.data.lien_posture, gross: $.data.gross_award_cents }
          assert:
            - "captured elig == PENDING"
            - "captured inj == PENDING"
            - "captured lien_p == NOT_STARTED"
            - "captured gross == 0"

      - name: claimant_invalid_injury_category_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Claimant.fields.injury_category"
        distinguishing_aspect: "injury_category is an enum; value outside {QUALIFYING_CAT_A, QUALIFYING_CAT_B, NON_QUALIFYING} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-EN", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Tina", date_of_birth: "1960-01-01", ssn_last4: "1111", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "BOGUS", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_REQUEST"

      - name: closing_statement_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.ClosingStatement"
        distinguishing_aspect: "ClosingStatement has common_fields=false; response has no version or updated_at field; no PUT/PATCH endpoint exists for it."
        test_recipe:
          setup: ["Claim fully DISBURSED then CLOSED"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-IMM", tort_name: "T", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Uma", date_of_birth: "1960-01-01", ssn_last4: "1212", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_pre: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${v_pre}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "MEDICARE", holder_name: "CMS", asserted_amount_cents: 100000 }
              as: LienAnalyst
              captures: { lid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid}/waive"
              payload: { resolution_notes: "Waived" }
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/finalize-liens"
              payload: {}
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/prepare-disbursement"
              payload: {}
              as: DisbursementApprover
              as_user_id: "user_approver_1"
            - call: "GET /settlement-programs/${pid}/claims/${cid}/disbursements"
              as: DisbursementApprover
              captures: { did: "$.data.0.id" }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/disbursements/${did}/approve"
              payload: {}
              as: DisbursementApprover
              as_user_id: "user_approver_2"
            - call: "POST /settlement-programs/${pid}/claims/${cid}/disbursements/${did}/release"
              payload: {}
              as: DisbursementApprover
              as_user_id: "user_approver_2"
            - call: "POST /settlement-programs/${pid}/claims/${cid}/close"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "GET /settlement-programs/${pid}/claims/${cid}/closing-statements"
              as: ProgramAdministrator
              captures: { cs_gross: "$.data.0.gross_award_cents", cs_net: "$.data.0.net_award_cents" }
          assert:
            - "captured cs_gross == 5000000"
            - "captured cs_net == 5000000"
            - "ClosingStatement response carries no version field (common_fields=false)"

      - name: get_nonexistent_claim_returns_not_found
        claim_type: not_found
        grounds:
          - "endpoints.GET /settlement-programs/{pid}/claims/{cid}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a random UUID for cid returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-NF", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /settlement-programs/${pid}/claims/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_NOT_FOUND"

      - name: list_claims_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET /settlement-programs/{pid}/claims"
          - "response_envelope"
        distinguishing_aspect: "GET claims honors limit/offset and returns total_count + has_more in the envelope."
        test_recipe:
          setup: ["Program with 1 claimant and 1 claim"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-PG", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Vic", date_of_birth: "1960-01-01", ssn_last4: "1313", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
          trigger:
            - call: "GET /settlement-programs/${pid}/claims?limit=10&offset=0"
              as: ProgramAdministrator
          assert:
            - "response.meta.api_request_id is present"
            - "response.response_type == 'array'"
            - "response.data is a list of length 1"
            - "response contains pagination fields limit/offset/total_count/has_more"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: claim_initial_state_submitted
        claim_type: initial_state
        grounds:
          - "state_machines.Claim"
        distinguishing_aspect: "New claim starts in SUBMITTED."
        test_recipe:
          setup: ["Program + Claimant"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-INIT", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Walt", date_of_birth: "1960-01-01", ssn_last4: "1414", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { st: $.data.status }
          assert:
            - "captured st == SUBMITTED"

      - name: deny_from_eligibility_passed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Claim.transitions"
          - "errors[ERR_CLAIM_INVALID_STATE]"
        distinguishing_aspect: "deny is only valid from SUBMITTED; calling it from ELIGIBILITY_PASSED returns ERR_CLAIM_INVALID_STATE."
        test_recipe:
          setup: ["Claim in ELIGIBILITY_PASSED"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-IVT", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Xena", date_of_birth: "1960-01-01", ssn_last4: "1515", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/deny"
              payload: { denied_reason: "Too late" }
              as: IntakeSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CLAIM_INVALID_STATE"

      - name: withdraw_from_tier_assigned_returns_not_withdrawable
        claim_type: invalid_transition
        grounds:
          - "state_machines.Claim.transitions"
          - "errors[ERR_CLAIM_NOT_WITHDRAWABLE]"
        distinguishing_aspect: "withdraw is only valid from {SUBMITTED, ELIGIBILITY_PASSED, RECORDS_PENDING, INJURY_VERIFIED}; from TIER_ASSIGNED it returns ERR_CLAIM_NOT_WITHDRAWABLE."
        test_recipe:
          setup: ["Claim in TIER_ASSIGNED"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-WD", tort_name: "T", qsf_principal_cents: 5000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Yara", date_of_birth: "1960-01-01", ssn_last4: "1616", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_pre: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${v_pre}" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/withdraw"
              payload: {}
              as: ClaimantRole
              as_user_id: "${clid}"
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_CLAIM_NOT_WITHDRAWABLE"

      - name: lien_notify_computes_provisional_and_due_date
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Lien.IDENTIFIED_to_NOTIFIED"
        distinguishing_aspect: "notify side effects: provisional_demand_cents computed per lien_type formula and holder_response_due_at = program.current_utc + 30 days."
        test_recipe:
          setup: ["Claim LIENS_PENDING with one MEDICAID lien asserted=200000, program clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-SE", tort_name: "T", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Zed", date_of_birth: "1960-01-01", ssn_last4: "1717", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_pre: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${v_pre}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "MEDICAID", holder_name: "State DHHS", asserted_amount_cents: 200000 }
              as: LienAnalyst
              captures: { lid: $.data.id }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid}/notify"
              payload: {}
              as: LienAnalyst
              captures: { prov: $.data.provisional_demand_cents, due: $.data.holder_response_due_at, st: $.data.state }
          assert:
            - "captured prov == 100000 (Medicaid 0.50 rate)"
            - "captured due == '2026-08-31T00:00:00Z' (default clock 2026-08-01 + 30 days)"
            - "captured st == NOTIFIED"

      - name: disbursement_terminal_state_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Disbursement"
        distinguishing_aspect: "From RELEASED (terminal), no further approve/release/void transitions succeed."
        test_recipe:
          setup: ["Disbursement already RELEASED"]
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-TL", tort_name: "T", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Al", date_of_birth: "1960-01-01", ssn_last4: "1818", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${r2}/accept"
