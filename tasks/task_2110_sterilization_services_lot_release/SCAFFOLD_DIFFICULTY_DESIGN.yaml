              as: RegulatoryAdmin
              captures: { qc_id: $.data.id }
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: RegulatoryAdmin
          trigger:
            - call: "POST /sterilization/qualifications/${qa_id}/dose-audits"
              payload: { performed_at: "2026-08-20T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
