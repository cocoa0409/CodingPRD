            - "LotLease.${lease_a}.status == TRANSFERRED"
            - "Lot.${lot_id}.current_lease_id == ${lease_b}"

      - name: rent_rides_with_lot_on_home_sale_supersede
        claim_type: derived_field_reconciliation
        grounds:
          - state_machines.Lot.OCCUPIED_to_OCCUPIED
          - entities.LotLease.fields.rent_cents_at_signing
          - entities.Lot.fields.current_rent_cents
        distinguishing_aspect: "On a home-sale supersede, the successor lease's rent_cents_at_signing equals Lot.current_rent_cents (rent rides with the lot), not the prior lease's value when they differ."
        test_recipe:
          setup:
            - "CA lot OCCUPIED by A at 60000, an EFFECTIVE increase to 63000, then supersede to buyer B"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Rd Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "RD", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RDa", household_size: 2 }
              as: ParkManager
              captures: { res_a: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RDb", household_size: 2 }
              as: ParkManager
              captures: { res_b: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_a}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_a: $.data.id }
            - call: "POST /lot-leases/${lease_a}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 63000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_id: $.data.id }
            - call: "POST /rent-schedules/${sched_id}/accept"
              payload: {}
              as: Resident
              as_user_id: "${res_a}"
            - call: "POST /rent-schedules/${sched_id}/apply"
              payload: {}
              as: ParkManager
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
              captures: { lot_v: $.data.version }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_b}", start_date: "2027-02-01", supersedes_lease_id: "${lease_a}", expected_lot_version: "${lot_v}" }
              as: ParkManager
              captures: { lease_b: $.data.id }
          trigger:
            - call: "POST /lot-leases/${lease_b}/activate"
              payload: { expected_lot_version: "${lot_v}" }
              as: ParkManager
            - call: "GET /lot-leases/${lease_b}"
              payload: {}
              as: ParkManager
          assert:
            - "LotLease.${lease_b}.rent_cents_at_signing == 63000"

      - name: rate_threshold_arrears_recompute_on_payment
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.resident_arrears
          - entities.Resident.fields.arrears_cents
        distinguishing_aspect: "Posting a PAYMENT recomputes arrears_cents: rent charge 55000 then payment 10000 leaves arrears 45000 (below the 50000 threshold)."
        test_recipe:
          setup:
            - "CA lease with rent_cents_at_signing 55000 charged; a 10000 payment posted"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Rt Park", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "RT", base_rent_cents: 55000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RRt", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
          trigger:
            - call: "POST /lot-leases/${lease_id}/payments"
              payload: { amount_cents: 10000 }
              as: ParkManager
            - call: "GET /residents/${res_id}"
              payload: {}
              as: ParkManager
          assert:
            - "Resident.${res_id}.arrears_cents == 45000"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: apportion_charges_visible_same_request
        claim_type: immediate
        grounds:
          - state_machines.UtilityBill.DRAFT_to_APPORTIONED
          - entities.UtilityBill.fields.apportioned_total_cents
        distinguishing_aspect: "POST /utility-bills/{id}/apportion returns the bill with status APPORTIONED and apportioned_total_cents set in the same response (immediate consistency)."
        test_recipe:
          setup:
            - "CA PER_CAPITA community, one occupied lot, a 5000c WATER bill"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Im2 Park", state_code: "CA", utility_apportionment_method: "PER_CAPITA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "IM2", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RIm2", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 5000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
              captures: { ret_status: $.data.status, ret_total: $.data.apportioned_total_cents }
          assert:
            - "UtilityBill.${bill_id}.status == APPORTIONED in the apportion response"
            - "UtilityBill.${bill_id}.apportioned_total_cents == 5000 in the apportion response"
