              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "CG-1", service_type: "HEATING", current_balance_cents: 40000, arrearage_cents: 0 }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "PAYSTUB", reported_income_cents: 1700000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 1700000 }
              as: Caseworker
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
            - call: "POST /liheap/pledges"
              payload: { application_id: "${app_id}", vendor_id: "${vendor_id}", funding_pool_id: "${pool_id}", utility_account_id: "${ua_id}", pledge_type: "HEATING", pledged_amount_cents: 20000, benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-03-15T00:00:00Z", expected_pool_version: "${pool_v}" }
              as: Caseworker
              captures: { pledge_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/pledges/${pledge_id}/cancel"
              payload: {}
              as: Caseworker
          assert:
            - "FundingPool.${pool_id}.reserved_cents == 0 after cancel"
            - "FundingPool.${pool_id}.disbursed_cents == 0"
            - "FundingPool.${pool_id}.available_cents == 100000 after cancel"
            - "invariant holds: 100000 == available_cents + reserved_cents + disbursed_cents (100000 == 100000 + 0 + 0)"
            - "Pledge.${pledge_id}.status == CANCELLED"

      - name: account_ledger_conservation_payment_return
        grounds:
          - calculations.bill_credit_allocation
          - state_machines.Payment.REMITTED_to_RETURNED
          - entities.UtilityAccount.fields.lifetime_credited_cents
          - entities.UtilityAccount.fields.original_obligation_cents
        distinguishing_aspect: "Conserved quantity = utility-account dollars: arrearage_cents + current_balance_cents + lifetime_credited_cents == original_obligation_cents (50000) holds after the forward remit (credit applied) and after the compensating return (credit reversed); different conserved quantity than the pool invariant."
        test_recipe:
          setup:
            - "HEATING pool; ENROLLED vendor; approved application; disconnected utility account current 30000 + arrearage 20000 (original_obligation 50000); a 20000 ARREARAGE pledge remitted (BillCredit applied: arrearage->0, lifetime_credited->20000)."
