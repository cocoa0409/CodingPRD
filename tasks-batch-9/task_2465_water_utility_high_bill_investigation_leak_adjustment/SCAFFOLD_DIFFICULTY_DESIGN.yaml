              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1004", customer_name: "Xola Petrov", service_address: "18 Elm Way", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_x_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1005", customer_name: "Yaw Lindqvist", service_address: "20 Elm Way", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_y_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_x_id}", meter_serial: "MTR-X-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 600000 }
              as: MeterTechnician
              captures: { meter_x_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_x_id}", meter_serial: "MTR-X-SUB", meter_type: "IRRIGATION_SUBMETER", size_inches: 0.75, initial_register_value: 0, parent_meter_id: "${meter_x_id}" }
              as: MeterTechnician
              captures: { meter_xsub_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_y_id}", meter_serial: "MTR-Y-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 700000 }
              as: MeterTechnician
              captures: { meter_y_id: $.data.id }
            - call: "POST /meter-readings"
