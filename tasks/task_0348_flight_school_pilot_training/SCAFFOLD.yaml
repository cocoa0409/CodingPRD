    description: "Create a student account"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, email]
    output: Student
    side_effects: ["status=ACTIVE; deposit_balance_cents=0; deposit_held_cents=0; deposit_consumed_cents=0; no_show_strikes=0"]

  - method: GET
    path: "/flight-school/students"
    description: "List students"
    roles: [SchoolAdmin, Dispatcher]
    code: 200
    input: ["email?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/flight-school/students/{studentId}"
    description: "Get a student"
    roles: [SchoolAdmin, Dispatcher, Student]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/flight-school/students/{studentId}/deposits"
    description: "Add a block-time deposit to a student's account"
    roles: [SchoolAdmin]
    code: 201
    input: [amount_cents, "memo?"]
    output: DepositTransaction
    side_effects: ["DepositTransaction DEPOSIT created; Student.deposit_balance_cents += amount_cents"]

  - method: GET
    path: "/flight-school/deposit-transactions"
    description: "List deposit ledger entries, filterable by student, booking, or flight log"
    roles: [SchoolAdmin, Dispatcher, Student]
    code: 200
    input: ["student_id?", "booking_id?", "flight_log_id?"]
    output: "DepositTransaction[]"
    side_effects: []

  - method: GET
    path: "/flight-school/deposit-transactions/{depositTransactionId}"
    description: "Get a single deposit ledger entry"
    roles: [SchoolAdmin, Dispatcher, Student]
    code: 200
    input: []
    output: DepositTransaction
    side_effects: []

  # ---- Instructors ----
  - method: POST
    path: "/flight-school/instructors"
    description: "Create an instructor (CFI)"
    roles: [SchoolAdmin]
    code: 201
    input: [full_name, email, cfi_rate_cents_per_hour, authorized_endorsement_codes]
    output: Instructor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/flight-school/instructors"
    description: "List instructors"
    roles: [SchoolAdmin, Dispatcher, Student]
    code: 200
    input: []
    output: "Instructor[]"
    side_effects: []

  - method: GET
    path: "/flight-school/instructors/{instructorId}"
    description: "Get an instructor"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # ---- Aircraft ----
  - method: POST
    path: "/flight-school/aircraft"
    description: "Onboard an aircraft"
    roles: [SchoolAdmin]
    code: 201
    input: [tail_number, model, rental_rate_cents_per_hour, billing_basis, initial_hobbs, initial_tach, "is_complex?"]
    output: Aircraft
    side_effects: ["status=AVAILABLE; current_hobbs=initial_hobbs; current_tach=initial_tach; open_squawk_count=0; version=1"]

  - method: GET
    path: "/flight-school/aircraft"
    description: "List aircraft"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor, Mechanic]
    code: 200
    input: ["status?"]
    output: "Aircraft[]"
    side_effects: []

  - method: GET
    path: "/flight-school/aircraft/{aircraftId}"
    description: "Get an aircraft (carries version for OCC)"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor, Mechanic]
    code: 200
    input: []
    output: Aircraft
    side_effects: []

  - method: POST
    path: "/flight-school/aircraft/{aircraftId}/retire"
    description: "Retire an aircraft"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["status -> RETIRED; increments Aircraft.version by 1"]

  # ---- Squawks ----
  - method: POST
    path: "/flight-school/squawks"
    description: "Report a maintenance squawk; a grounding squawk opens OPEN and grounds the aircraft"
    roles: [Mechanic, Instructor]
    code: 201
    input: [aircraft_id, description, is_grounding, "reported_by_instructor_id?"]
    output: Squawk
    side_effects:
      - "status=OPEN"
      - "if is_grounding: Aircraft.open_squawk_count += 1"
      - "CASCADE: if is_grounding and aircraft AVAILABLE -> Aircraft AVAILABLE -> GROUNDED (cancels REQUESTED/CONFIRMED bookings on the aircraft)"

  - method: GET
    path: "/flight-school/squawks"
    description: "List squawks, filterable by aircraft, reporting instructor, or status"
    roles: [SchoolAdmin, Dispatcher, Mechanic, Instructor]
    code: 200
    input: ["aircraft_id?", "reported_by_instructor_id?", "status?"]
    output: "Squawk[]"
    side_effects: []

  - method: GET
    path: "/flight-school/squawks/{squawkId}"
    description: "Get a squawk"
    roles: [SchoolAdmin, Dispatcher, Mechanic, Instructor]
    code: 200
    input: []
    output: Squawk
    side_effects: []

  - method: POST
    path: "/flight-school/squawks/{squawkId}/resolve"
    description: "Resolve a squawk"
    roles: [Mechanic]
    code: 200
    input: []
    output: Squawk
    side_effects: ["status -> RESOLVED; CASCADE: if last OPEN grounding squawk, Aircraft GROUNDED -> AVAILABLE"]

  - method: POST
    path: "/flight-school/squawks/{squawkId}/defer"
    description: "Defer a non-grounding squawk"
    roles: [Mechanic]
    code: 200
    input: []
    output: Squawk
    side_effects: ["status -> DEFERRED"]

  - method: POST
    path: "/flight-school/squawks/{squawkId}/reopen"
    description: "Reopen a resolved or deferred squawk"
    roles: [Mechanic]
    code: 200
    input: []
    output: Squawk
    side_effects: ["status -> OPEN; CASCADE: if grounding and aircraft AVAILABLE -> Aircraft AVAILABLE -> GROUNDED"]

  # ---- Syllabi ----
  - method: POST
    path: "/flight-school/syllabi"
    description: "Create a syllabus / program (immutable)"
    roles: [SchoolAdmin]
    code: 201
    input: [name, required_dual_hours, required_solo_hours, stage_count, min_deposit_cents]
    output: Syllabus
    side_effects: []

  - method: GET
    path: "/flight-school/syllabi"
    description: "List syllabi"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: "Syllabus[]"
    side_effects: []

  - method: GET
    path: "/flight-school/syllabi/{syllabusId}"
    description: "Get a syllabus"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: Syllabus
    side_effects: []

  # ---- Enrollments ----
  - method: POST
    path: "/flight-school/enrollments"
    description: "Enroll a student into a syllabus"
    roles: [SchoolAdmin]
    code: 201
    input: [student_id, syllabus_id]
    output: Enrollment
    side_effects: ["status=PENDING_CLEARANCE; medical_status=PENDING; tsa_status=PENDING; current_stage_index=1; logged_dual_hours=0; logged_solo_hours=0"]

  - method: GET
    path: "/flight-school/enrollments"
    description: "List enrollments, filterable by student or syllabus"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: ["student_id?", "syllabus_id?"]
    output: "Enrollment[]"
    side_effects: []

  - method: GET
    path: "/flight-school/enrollments/{enrollmentId}"
    description: "Get an enrollment"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/flight-school/enrollments/{enrollmentId}/clearance"
    description: "Record a clearance decision on one of the two parallel axes (medical or TSA)"
    roles: [SchoolAdmin]
    code: 200
    input: [clearance_type, decision, "medical_expiry_date?"]
    output: Enrollment
    side_effects:
      - "if clearance_type=MEDICAL: medical_status = decision (CLEARED|EXPIRED); medical_expiry_date set when CLEARED"
      - "if clearance_type=TSA: tsa_status = decision (CLEARED|DENIED)"
      - "CASCADE: if MEDICAL set to EXPIRED and enrollment ACTIVE -> Enrollment ACTIVE -> SUSPENDED"

  - method: POST
    path: "/flight-school/enrollments/{enrollmentId}/activate"
    description: "Activate an enrollment (requires both clearances + minimum deposit)"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/flight-school/enrollments/{enrollmentId}/suspend"
    description: "Suspend an active enrollment"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> SUSPENDED; CASCADE: cancel REQUESTED/CONFIRMED bookings on the enrollment"]

  - method: POST
    path: "/flight-school/enrollments/{enrollmentId}/complete"
    description: "Complete an enrollment after hours + stages are met"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> COMPLETED"]

  - method: POST
    path: "/flight-school/enrollments/{enrollmentId}/withdraw"
    description: "Withdraw an enrollment"
    roles: [SchoolAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["status -> WITHDRAWN; CASCADE: cancel REQUESTED/CONFIRMED bookings on the enrollment"]

  # ---- Bookings ----
  - method: POST
    path: "/flight-school/bookings"
    description: "Request a booking (aircraft + optional instructor + time window). OCC-guarded on aircraft version; a successful create claims the aircraft and advances its version."
    roles: [Student, Dispatcher]
    code: 201
    input: [enrollment_id, aircraft_id, lesson_type, start_at, end_at, estimated_hours, expected_aircraft_version, "instructor_id?"]
    output: Booking
    side_effects:
      - "OCC: if expected_aircraft_version != Aircraft.version -> ERR_STALE_AIRCRAFT_VERSION (412)"
      - "status=REQUESTED"
      - "compute estimated_cost_cents (booking_cost_estimate)"
      - "increments Aircraft.version by 1 (the create claims a slice of the aircraft schedule)"

  - method: GET
    path: "/flight-school/bookings"
    description: "List bookings, filterable by enrollment, aircraft, or instructor"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: ["enrollment_id?", "aircraft_id?", "instructor_id?", "status?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/flight-school/bookings/{bookingId}"
    description: "Get a booking"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/flight-school/bookings/{bookingId}/confirm"
    description: "Confirm a requested booking (overlap + deposit checks; places provisional hold)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CONFIRMED; HOLD estimated_cost_cents on student deposit (deposit_settlement provisional)"]

  - method: POST
    path: "/flight-school/bookings/{bookingId}/dispatch"
    description: "Dispatch a confirmed booking for flight (enrollment + endorsement checks)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> DISPATCHED"]

  - method: POST
    path: "/flight-school/bookings/{bookingId}/cancel"
    description: "Cancel a requested or confirmed booking (releases hold if confirmed)"
    roles: [Student, Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CANCELLED; if was CONFIRMED: RELEASE estimated_cost_cents hold"]

  - method: POST
    path: "/flight-school/bookings/{bookingId}/no-show"
    description: "Mark a confirmed booking as a no-show"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> NO_SHOW; RELEASE estimated_cost_cents hold; Student.no_show_strikes += 1"
      - "CASCADE: if strikes >= NO_SHOW_SUSPEND_THRESHOLD and enrollment ACTIVE -> Enrollment ACTIVE -> SUSPENDED"

  # ---- Flight Logs ----
  - method: POST
    path: "/flight-school/flight-logs"
    description: "Create a DRAFT flight log against a dispatched booking"
    roles: [Instructor, Dispatcher]
    code: 201
    input: [booking_id, hobbs_start, hobbs_end, tach_start, tach_end, landings]
    output: FlightLog
    side_effects: ["status=DRAFT; enrollment_id/aircraft_id/instructor_id copied from booking"]

  - method: GET
    path: "/flight-school/flight-logs"
    description: "List flight logs, filterable by booking, enrollment, aircraft, or instructor"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: ["booking_id?", "enrollment_id?", "aircraft_id?", "instructor_id?", "status?"]
    output: "FlightLog[]"
    side_effects: []

  - method: GET
    path: "/flight-school/flight-logs/{flightLogId}"
    description: "Get a flight log"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: FlightLog
    side_effects: []

  - method: POST
    path: "/flight-school/flight-logs/{flightLogId}/post"
    description: "Post a flight log: compute charges, settle deposit, advance meters, roll up hours"
    roles: [Instructor, Dispatcher]
    code: 200
    input: []
    output: FlightLog
    side_effects:
      - "compute billed_hours, aircraft_charge_cents, instructor_charge_cents, total_charge_cents (flight_charge)"
      - "deposit_settlement final: RELEASE estimate, CONSUME total_charge_cents"
      - "advance aircraft.current_hobbs/current_tach (increments Aircraft.version by 1)"
      - "enrollment_hours_rollup; Booking DISPATCHED -> COMPLETED"

  - method: POST
    path: "/flight-school/flight-logs/{flightLogId}/void"
    description: "Void a draft flight log"
    roles: [Dispatcher]
    code: 200
    input: []
    output: FlightLog
    side_effects: ["status -> VOID"]

  # ---- Stage Checks ----
  - method: POST
    path: "/flight-school/stage-checks"
    description: "Schedule a stage check (or a retry of a FAILED one)"
    roles: [SchoolAdmin, Instructor]
    code: 201
    input: [enrollment_id, examiner_instructor_id, stage_index, "retry_of_stage_check_id?"]
    output: StageCheck
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/flight-school/stage-checks"
    description: "List stage checks, filterable by enrollment, examiner, retried check, or status"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: ["enrollment_id?", "examiner_instructor_id?", "retry_of_stage_check_id?", "status?"]
    output: "StageCheck[]"
    side_effects: []

  - method: GET
    path: "/flight-school/stage-checks/{stageCheckId}"
    description: "Get a stage check"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: StageCheck
    side_effects: []

  - method: POST
    path: "/flight-school/stage-checks/{stageCheckId}/begin"
    description: "Begin a scheduled stage check"
    roles: [Instructor]
    code: 200
    input: []
    output: StageCheck
    side_effects: ["status -> IN_PROGRESS"]

  - method: POST
    path: "/flight-school/stage-checks/{stageCheckId}/pass"
    description: "Pass a stage check"
    roles: [Instructor]
    code: 200
    input: ["result_note?"]
    output: StageCheck
    side_effects: ["status -> PASSED; Enrollment.current_stage_index += 1"]

  - method: POST
    path: "/flight-school/stage-checks/{stageCheckId}/fail"
    description: "Fail a stage check (a retry may be scheduled later)"
    roles: [Instructor]
    code: 200
    input: ["result_note?"]
    output: StageCheck
    side_effects: ["status -> FAILED"]

  # ---- Endorsements ----
  - method: POST
    path: "/flight-school/endorsements"
    description: "Issue an endorsement to an enrollment (CFI must be authorized for the code)"
    roles: [Instructor]
    code: 201
    input: [enrollment_id, instructor_id, endorsement_code]
    output: Endorsement
    side_effects: ["status=VALID"]

  - method: GET
    path: "/flight-school/endorsements"
    description: "List endorsements, filterable by enrollment or instructor"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: ["enrollment_id?", "instructor_id?", "status?"]
    output: "Endorsement[]"
    side_effects: []

  - method: GET
    path: "/flight-school/endorsements/{endorsementId}"
    description: "Get an endorsement"
    roles: [SchoolAdmin, Dispatcher, Student, Instructor]
    code: 200
    input: []
    output: Endorsement
    side_effects: []

  - method: POST
    path: "/flight-school/endorsements/{endorsementId}/revoke"
    description: "Revoke a valid endorsement"
    roles: [Instructor]
    code: 200
    input: []
    output: Endorsement
    side_effects: ["status -> REVOKED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth / generic ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, out-of-range number (landings < 1, hours <= 0, amount_cents <= 0)" }

  # --- Concurrency ---
  - { id: ERR_STALE_AIRCRAFT_VERSION, http: 412, condition: "expected_aircraft_version on booking create does not match Aircraft.version" }

  # --- Booking state ---
  - { id: ERR_BOOKING_NOT_REQUESTED, http: 409, condition: "Booking is not in REQUESTED for confirm" }
  - { id: ERR_BOOKING_NOT_CONFIRMED, http: 409, condition: "Booking is not in CONFIRMED for dispatch or no-show" }
  - { id: ERR_BOOKING_NOT_DISPATCHED, http: 409, condition: "Booking is not in DISPATCHED for flight-log post / completion" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "Booking is terminal (COMPLETED/CANCELLED/NO_SHOW) and cannot be cancelled" }

  # --- Booking business: safety / temporal / fiscal ---
  - { id: ERR_AIRCRAFT_GROUNDED, http: 409, condition: "Aircraft is GROUNDED (or RETIRED) and cannot be confirmed or dispatched" }
  - { id: ERR_AIRCRAFT_TIME_CONFLICT, http: 409, condition: "Half-open [start_at,end_at) overlaps another live booking on the same aircraft" }
  - { id: ERR_INSTRUCTOR_TIME_CONFLICT, http: 409, condition: "Instructor has a booking within INSTRUCTOR_BUFFER_MINUTES of the requested window" }
  - { id: ERR_INSUFFICIENT_DEPOSIT, http: 402, condition: "Deposit balance insufficient for estimated_cost_cents (confirm) or total_charge_cents (flight-log post)" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Enrollment is not ACTIVE for dispatch or stage-check begin" }
  - { id: ERR_MEDICAL_NOT_CLEARED, http: 409, condition: "Enrollment medical_status is not CLEARED" }
  - { id: ERR_TSA_NOT_CLEARED, http: 409, condition: "Enrollment tsa_status is not CLEARED" }
  - { id: ERR_SOLO_ENDORSEMENT_MISSING, http: 409, condition: "SOLO booking dispatch without a VALID SOLO endorsement for the enrollment" }

  # --- Aircraft / squawk state ---
  - { id: ERR_AIRCRAFT_HAS_ACTIVE_BOOKINGS, http: 409, condition: "Aircraft has REQUESTED/CONFIRMED/DISPATCHED bookings and cannot be retired" }
  - { id: ERR_AIRCRAFT_NOT_AVAILABLE, http: 409, condition: "Aircraft is not AVAILABLE for retire" }
  - { id: ERR_SQUAWK_NOT_OPEN, http: 409, condition: "Squawk is not OPEN for defer" }
  - { id: ERR_SQUAWK_NOT_RESOLVABLE, http: 409, condition: "Squawk is not OPEN or DEFERRED for resolve" }
  - { id: ERR_SQUAWK_NOT_REOPENABLE, http: 409, condition: "Squawk is not RESOLVED or DEFERRED for reopen" }
  - { id: ERR_GROUNDING_SQUAWK_NOT_DEFERRABLE, http: 409, condition: "A grounding squawk cannot be deferred" }

  # --- Flight log state / meters ---
  - { id: ERR_FLIGHT_LOG_NOT_DRAFT, http: 409, condition: "Flight log is not DRAFT for post or void" }
  - { id: ERR_INVALID_METER_READING, http: 400, condition: "hobbs_end <= hobbs_start or tach_end <= tach_start" }
  - { id: ERR_METER_DISCONTINUITY, http: 409, condition: "hobbs_start != aircraft.current_hobbs or tach_start != aircraft.current_tach at post" }

  # --- Enrollment lifecycle ---
  - { id: ERR_ENROLLMENT_NOT_PENDING_OR_SUSPENDED, http: 409, condition: "Enrollment is not PENDING_CLEARANCE or SUSPENDED for activate" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE_FOR_SUSPEND, http: 409, condition: "Enrollment is not ACTIVE for suspend" }
  - { id: ERR_DEPOSIT_BELOW_MINIMUM, http: 402, condition: "Deposit balance below syllabus.min_deposit_cents at activate" }
  - { id: ERR_STUDENT_SUSPENDED, http: 409, condition: "Student no_show_strikes at/over threshold blocks re-activation" }
  - { id: ERR_HOURS_NOT_MET, http: 409, condition: "logged_dual_hours or logged_solo_hours below syllabus requirement at complete" }
  - { id: ERR_STAGES_NOT_PASSED, http: 409, condition: "Not all stage checks PASSED at complete" }
  - { id: ERR_ENROLLMENT_HAS_ACTIVE_BOOKINGS, http: 409, condition: "Enrollment has live bookings and cannot be completed" }
  - { id: ERR_INVALID_CLEARANCE_DECISION, http: 400, condition: "clearance_type/decision combination invalid (e.g. MEDICAL with DENIED, TSA with EXPIRED)" }

  # --- Stage check ---
  - { id: ERR_STAGE_CHECK_NOT_SCHEDULED, http: 409, condition: "Stage check is not SCHEDULED for begin" }
  - { id: ERR_STAGE_CHECK_NOT_IN_PROGRESS, http: 409, condition: "Stage check is not IN_PROGRESS for pass or fail" }
  - { id: ERR_STAGE_OUT_OF_ORDER, http: 409, condition: "stage_index does not equal enrollment.current_stage_index at begin" }

  # --- Endorsement ---
  - { id: ERR_ENDORSEMENT_NOT_AUTHORIZED, http: 403, condition: "Instructor not authorized for the requested endorsement_code" }
  - { id: ERR_ENDORSEMENT_NOT_VALID, http: 409, condition: "Endorsement is not VALID for revoke" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: SchoolAdmin
    description: "Front-office administration: students, deposits, instructors, aircraft onboarding/retire, syllabi, enrollments + clearances, scheduling stage checks."
    identity: opaque
    exclusive_operations:
      - "POST /flight-school/students — Create student"
      - "POST /flight-school/students/{id}/deposits — Add deposit"
      - "POST /flight-school/instructors — Create instructor"
      - "POST /flight-school/aircraft — Onboard aircraft"
      - "POST /flight-school/aircraft/{id}/retire — Retire aircraft"
      - "POST /flight-school/syllabi — Create syllabus"
      - "POST /flight-school/enrollments — Create enrollment"
      - "POST /flight-school/enrollments/{id}/clearance — Record clearance"
      - "POST /flight-school/enrollments/{id}/activate — Activate enrollment"
      - "POST /flight-school/enrollments/{id}/suspend — Suspend enrollment"
      - "POST /flight-school/enrollments/{id}/complete — Complete enrollment"
      - "POST /flight-school/enrollments/{id}/withdraw — Withdraw enrollment"
    shared_operations:
      - "POST /flight-school/stage-checks — Schedule stage check (shared with Instructor)"
      - "GET endpoints across resources"

  - name: Dispatcher
    description: "Scheduling desk: confirms/dispatches/cancels bookings, marks no-shows, posts/voids flight logs."
    identity: opaque
    exclusive_operations:
      - "POST /flight-school/bookings/{id}/confirm — Confirm booking"
      - "POST /flight-school/bookings/{id}/dispatch — Dispatch booking"
      - "POST /flight-school/bookings/{id}/no-show — Mark no-show"
      - "POST /flight-school/flight-logs/{id}/void — Void flight log"
    shared_operations:
      - "POST /flight-school/bookings — Request booking (shared with Student)"
      - "POST /flight-school/bookings/{id}/cancel — Cancel booking (shared with Student)"
      - "POST /flight-school/flight-logs — Create flight log (shared with Instructor)"
      - "POST /flight-school/flight-logs/{id}/post — Post flight log (shared with Instructor)"
      - "GET endpoints across resources"

  - name: Student
    description: "Self-service: requests and cancels own bookings, reads own enrollments/bookings/logs/deposits."
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /flight-school/bookings — Request booking (shared with Dispatcher)"
      - "POST /flight-school/bookings/{id}/cancel — Cancel booking (shared with Dispatcher)"
      - "GET /flight-school/students/{id}, GET /flight-school/enrollments, GET /flight-school/bookings, GET /flight-school/flight-logs, GET /flight-school/deposit-transactions"

  - name: Instructor
    description: "Certified Flight Instructor: reports squawks, creates/posts flight logs, conducts stage checks, issues/revokes endorsements."
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /flight-school/stage-checks/{id}/begin — Begin stage check"
      - "POST /flight-school/stage-checks/{id}/pass — Pass stage check"
      - "POST /flight-school/stage-checks/{id}/fail — Fail stage check"
      - "POST /flight-school/endorsements — Issue endorsement"
      - "POST /flight-school/endorsements/{id}/revoke — Revoke endorsement"
    shared_operations:
      - "POST /flight-school/squawks — Report squawk (shared with Mechanic)"
      - "POST /flight-school/stage-checks — Schedule stage check (shared with SchoolAdmin)"
      - "POST /flight-school/flight-logs — Create flight log (shared with Dispatcher)"
      - "POST /flight-school/flight-logs/{id}/post — Post flight log (shared with Dispatcher)"
      - "GET endpoints across resources"

  - name: Mechanic
    description: "Maintenance: reports/resolves/defers/reopens squawks; squawk lifecycle drives aircraft grounding."
    identity: opaque
    exclusive_operations:
      - "POST /flight-school/squawks/{id}/resolve — Resolve squawk"
      - "POST /flight-school/squawks/{id}/defer — Defer squawk"
      - "POST /flight-school/squawks/{id}/reopen — Reopen squawk"
    shared_operations:
      - "POST /flight-school/squawks — Report squawk (shared with Instructor)"
      - "GET /flight-school/aircraft, GET /flight-school/squawks"
