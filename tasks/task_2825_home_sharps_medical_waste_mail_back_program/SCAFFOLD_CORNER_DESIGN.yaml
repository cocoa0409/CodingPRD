              captures: { kit: $.data.id }
            - call: "POST /sharps/kits/${kit}/acknowledge-receipt"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit}/seal"
              payload: { fill_units: 60, sealed_gross_weight_grams: 1200 }
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit}/return-labels"
              payload: { packaging_spec_id: "${spec}" }
              as: LogisticsCoordinator
              captures: { lbl: $.data.id }
            - call: "POST /sharps/return-labels/${lbl}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200 }
              as: LogisticsCoordinator
              captures: { shp: $.data.id }
            - call: "POST /sharps/shipments/${shp}/transport-events"
              payload: { event_type: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp}/transport-events"
              payload: { event_type: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp}/conformance-screening"
              payload: { outcome: "NON_CONFORMING", reason_code: "OVERFILLED_CONTAINER", observed_gross_weight_grams: 1200 }
              as: IntakeTechnician
              as_user_id: "tech-77"
            - call: "GET /sharps/shipments/${shp}/non-conformance-events"
              payload: {}
              as: IntakeTechnician
              as_user_id: "tech-77"
              captures: { ev: "$.data[0].id" }
            - call: "POST /sharps/non-conformance-events/${ev}/notify-customer"
              payload: { notification_channel: "EMAIL" }
              as: IntakeTechnician
              as_user_id: "tech-77"
          trigger:
            - call: "POST /sharps/non-conformance-events/${ev}/remediate"
              payload: { remediation_action: "RETURN_TO_PATIENT" }
              as: IntakeTechnician
              as_user_id: "tech-77"
              captures: { err1: $.data.error_id }
          assert:
            - "HTTP status == 422 and error_id == \"ERR_REMEDIATION_NOT_ALLOWED_FOR_STATE\" — NY classifies household sharps as REGULATED_MEDICAL_WASTE so the waste may not go back to the patient"
            - "then POST /sharps/non-conformance-events/${ev}/remediate {remediation_action: DISPOSE_AS_RMW} as IntakeTechnician tech-77 -> 422 with the SAME error_id \"ERR_REMEDIATION_NOT_ALLOWED_FOR_STATE\", this time because ${fac}.accepted_hazard_classes omits UN3291_REGULATED_MEDICAL_WASTE"
            - "after both rejections NonConformanceEvent.${ev}.status == \"CUSTOMER_NOTIFIED\" with remediation_action == null, Shipment.${shp}.conformance_status == \"NON_CONFORMING\", Kit.${kit}.status == \"RECEIVED\" and TreatmentFacility.${fac}.pending_intake_units == 60"
            - "then POST /sharps/non-conformance-events/${ev}/remediate {remediation_action: ON_SITE_REPACK} as IntakeTechnician tech-77 -> 200: status == \"RESOLVED\", remediation_action == \"ON_SITE_REPACK\", Shipment.${shp}.conformance_status == \"REMEDIATED\", Kit.${kit}.status still \"RECEIVED\" and pending_intake_units still 60 (only RETURN_TO_PATIENT gives units back)"
            - "then POST /sharps/shipments/${shp}/destruction-certificates {destroyed_units: 60} as DestructionOfficer officer-12 -> 201 with certificate_number == \"CERT-NY-TF-0007-00001\", destruction_date == \"2026-08-01\", retention_until_date == \"2029-08-01\", rebate_pct_applied == 0.00 and final_kit_cost_cents == 2176 (1450 base + 46 transport + 180 destruction + 500 ON_SITE_REPACK surcharge, under the 5000 allowance, tier basis 2176 -> 0% rebate)"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns exactly 3 entries in sequence_no ASC: (RESERVATION, +1465), (RESERVATION_RELEASE, -1465), (COMMITMENT, +2176)"
            - "SponsorshipProgram.${prog}.reserved_cents == 0, committed_cents == 2176 and available_cents == 497824"
            - "TreatmentFacility.${fac}.pending_intake_units == 0, destroyed_units_total == 60 and certificates_issued_count == 1"
            - "${err1} is the error envelope's error_id, confirming the rejected action returned the catalogued code and not a generic state error"

      - name: kit_seal_action_endpoint_enforces_its_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /sharps/kits/{id}/seal
          - state_machines.Kit.ACTIVE_FILLING_to_SEALED
        distinguishing_aspect: "The seal action is the one transition guarded by a precondition on a DIFFERENT aggregate (the parent enrollment's status) as well as its own state and overfill checks."
        excluded_because:
          difficulty_instance: kit_seal_blocked_when_enrollment_paused
          rationale: "That §1.8 cross-aggregate-precondition instance drives the seal endpoint from both the permitted and the blocked configuration and asserts the exact error_id, which is the whole action-endpoint claim for this route."

      - name: label_activation_links_the_shipment_to_the_receiving_facility
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /sharps/return-labels/{id}/activate
          - entities.Shipment.fields.treatment_facility_id
          - calculations.facility_intake_occupancy
        distinguishing_aspect: "Activation is the only place a label, a kit and a facility are bound into one Shipment row, and the binding is refused unless the facility can still absorb the day's units."
        excluded_because:
          difficulty_instance: facility_daily_intake_capacity_exceeded_by_aggregate_units_on_same_intake_date
          rationale: "The §1.8 aggregate-constraint instance activates several labels against the same facility and intake date, so it already proves both directions of the link (association written, then read back through the facility's aggregate) plus the refusal case."

  # ===========================================================================
  # §1.6 ERRORS — triggerability sweep. Every catalogued error_id is reached by
  # at least one instance here, in §1.8, or in another section of this file.
  # ===========================================================================
  - section: errors
    instances:
      - name: the_four_uniqueness_errors_each_fire_on_their_own_endpoint
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_STATE_RULE]
          - errors[ERR_DUPLICATE_SPEC_CODE]
          - errors[ERR_DUPLICATE_PERMIT_NUMBER]
          - errors[ERR_DUPLICATE_ACTIVE_ENROLLMENT]
          - validations.priority 31 (business_constraint uniqueness)
        distinguishing_aspect: "Four distinct 409s share priority 31 but key on four different scopes — state_code globally, spec_code globally, permit_number globally, and (patient_id, sponsorship_program_id) restricted to the four non-terminal enrollment statuses. The last one is NOT a plain unique index: once the first enrollment is REJECTED the same pair is legal again, which a naive unique constraint would keep rejecting."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One of each configuration row exists: state rule CA, packaging spec \"MB-USPS\", facility permit \"CA-TF-0001\"."
            - "Dana is ELIGIBLE and has one DRAFT enrollment against program NW-2026."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "MB-USPS", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 8000, allowed_container_sizes: [ONE_QUART, TWO_GALLON] }
              as: ProgramAdmin
              captures: { spec: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Bay Area Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: [UN3291_SHARPS_ONLY], daily_intake_capacity_units: 200 }
              as: ProgramAdmin
              captures: { fac: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr1: $.data.id }
          trigger:
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "CONDITIONALLY_EXEMPT", mail_back_permitted: false, max_container_volume_liters: 7.6, certificate_retention_years: 7 }
              as: ProgramAdmin
          assert:
            - "HTTP status == 409 and error_id == \"ERR_DUPLICATE_STATE_RULE\""
            - "GET /sharps/state-rules?state_code=CA returns total_count == 1 and that row's max_container_volume_liters is still 30.3 — the rejected write changed nothing"
            - "POST /sharps/packaging-specs {spec_code: \"MB-USPS\", un_specification_code: \"UN 4G/Y10/S/26\", postal_service: \"UPS_GROUND_MEDICAL\", hazard_class: \"UN3291_REGULATED_MEDICAL_WASTE\", max_gross_weight_grams: 12000, allowed_container_sizes: [THREE_GALLON]} as ProgramAdmin -> 409 with error_id == \"ERR_DUPLICATE_SPEC_CODE\", and GET /sharps/packaging-specs?status=ACTIVE returns total_count == 1"
            - "POST /sharps/treatment-facilities {name: \"Second Site\", state_rule_id: ${sr_ca}, permit_number: \"CA-TF-0001\", accepted_hazard_classes: [UN3291_SHARPS_ONLY], daily_intake_capacity_units: 50} as ProgramAdmin -> 409 with error_id == \"ERR_DUPLICATE_PERMIT_NUMBER\", and GET /sharps/treatment-facilities?state_rule_id=${sr_ca} returns total_count == 1"
            - "POST /sharps/enrollments {patient_id: ${pat_d}, sponsorship_program_id: ${prog}, cadence_days: 60, kits_authorized: 1} as ProgramAdmin -> 409 with error_id == \"ERR_DUPLICATE_ACTIVE_ENROLLMENT\" (the first enrollment is only DRAFT, and DRAFT is one of the four blocking statuses)"
            - "then POST /sharps/enrollments/${enr1}/submit as ProgramAdmin -> 200 and POST /sharps/enrollments/${enr1}/sponsor-decision {decision: REJECT} as SponsorRepresentative ${sp_nw} -> 200 with Enrollment.${enr1}.status == \"REJECTED\""
            - "re-POST the identical enrollment payload {patient_id: ${pat_d}, sponsorship_program_id: ${prog}, cadence_days: 60, kits_authorized: 1} as ProgramAdmin -> 201 with status == \"DRAFT\" — REJECTED is terminal and outside the blocking set, so the same (patient, program) pair is legal again"
            - "GET /sharps/enrollments?patient_id=${pat_d} returns total_count == 2"

      - name: issuance_and_seal_refusals_cover_sizing_allowance_and_overfill
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONTAINER_SIZE_NOT_PERMITTED]
          - errors[ERR_PER_KIT_ALLOWANCE_EXCEEDED]
          - errors[ERR_NO_ELIGIBLE_CONTAINER_SIZE]
          - errors[ERR_CONTAINER_OVERFILLED]
          - calculations.container_size_selection
          - calculations.kit_cost_provisional
        distinguishing_aspect: "Four refusals on the two write endpoints that mint and fill a container, each keyed on a different input: a requested size outside the candidate set (THREE_GALLON at 11.4 L under a 7.6 L state cap), an affordable-but-disallowed size (TWO_GALLON provisional 2722 > 2000 allowance), an empty candidate set (a 0.5 L state cap excludes every catalogue row), and a fill count one unit past capacity. None of the four may leave a Kit row, a ledger entry, or an enrollment version bump behind."
