            - "PSPSEvent.${evg_id}.ignition_risk_avoided_score == 3.48"
            - "PSPSEvent.${evg_id}.customer_impact_score == 115.20"
            - "PSPSEvent.${evg_id}.net_benefit_ratio == 0.0302"
            - "Circuit.${golf_id}.energization_state == ENERGIZED"

      - name: temporal_window_beats_referential_scope_on_batch_create
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_NOTIFICATION_WINDOW_INVALID]
          - errors[ERR_NO_CIRCUITS_IN_SCOPE]
          - calculations.psps_scope_determination
        distinguishing_aspect: |
          Creating an ADVANCE_48H batch whose scheduled_send_at equals the event onset, on an event whose
          only scoped circuit was born EXCLUDED by the fast-trip R4 exemption (confirmed_scope_count == 0),
          violates the business_temporal rule at priority 13 and the business_referential rule at
          priority 14 together; the answer must be ERR_NOTIFICATION_WINDOW_INVALID, not
          ERR_NO_CIRCUITS_IN_SCOPE.
        test_recipe:
          setup:
            - "Circuit FOXTROT is TIER_2 with overhead_miles 6.0, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle, and fast_trip_enabled TRUE."
            - "A single observation (gust 51.9, humidity 10.0, fuel moisture 6.0) on its lone weight-1.00 station gives FOXTROT a FORECAST index of 74.91 / tier R4 for 2026-09-05 — exactly the tier the fast-trip exemption covers."
            - "One customer sits on FOXTROT."
            - "Event EV-F spans 2026-09-05T18:00:00Z to 2026-09-06T18:00:00Z; scoping produced a single EXCLUDED row with exclusion_justification FAST_TRIP_MITIGATED_R4, so confirmed_scope_count is 0."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "FOXTROT", district_code: "D-EAST", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: true }
              as: GridPlanner
              captures: { foxtrot_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-F1", circuit_id: "${foxtrot_id}", elevation_ft: 2400, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_f1_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_f1_id}", observed_at: "2026-09-04T12:00:00Z", wind_gust_mph: 51.9, relative_humidity_pct: 10.0, temperature_f: 103.0, dead_fuel_moisture_pct: 6.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${foxtrot_id}", forecast_date: "2026-09-05", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_f_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-F1", circuit_id: "${foxtrot_id}", customer_class: "RESIDENTIAL", medical_baseline: false, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "ZF" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-F", trigger_fire_potential_index_id: "${fpi_f_id}", forecast_onset_at: "2026-09-05T18:00:00Z", forecast_all_clear_at: "2026-09-06T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { evf_id: $.data.id, evf_v0: $.data.version }
            - call: "POST /psps-events/${evf_id}/scope"
              payload: { expected_psps_event_version: "${evf_v0}" }
              as: PSPSDutyOfficer
          trigger:
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${evf_id}", stage: "ADVANCE_48H", scheduled_send_at: "2026-09-05T18:00:00Z" }
              as: CommunityLiaison
          assert:
            - "HTTP 422 with data.error_id == ERR_NOTIFICATION_WINDOW_INVALID"
            - "data.error_id != ERR_NO_CIRCUITS_IN_SCOPE"
            - "FirePotentialIndex.${fpi_f_id}.fpi_score == 74.91 and fpi_tier == R4"
            - "PSPSEvent.${evf_id}.scope_status == SCOPED"
            - "PSPSEvent.${evf_id}.confirmed_scope_count == 0 and excluded_scope_count == 1"
            - "The single EventScope row has scope_status EXCLUDED, exclusion_justification 'FAST_TRIP_MITIGATED_R4' and ignition_risk_term 0.00"
            - "PSPSEvent.${evf_id}.ignition_risk_avoided_score == 0.00"
            - "GET /psps-events/${evf_id}/notification-batches returns total_count 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: fpi_tier_r5_boundary_at_exactly_seventy_five
        grounds:
          - calculations.fire_potential_index
          - entities.FirePotentialIndex.fields.fpi_tier
          - calculations.psps_scope_determination
        distinguishing_aspect: |
          The R4/R5 break is inclusive at 75: a circuit whose components blend to exactly 75.00 must read
          fpi_tier R5, while an otherwise identical circuit whose wind gust is 0.1 mph lower scores 74.91
          and must read R4 — the two rows are 0.09 apart and land on opposite sides of the
          de-energization tier set.
        test_recipe:
          setup:
            - "Circuits ECHO and FOXTROT are both TIER_2 with equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle (so equipment_component is 20 with no overdue penalty) and hardened_fraction 0.0000."
            - "Each has a single ONLINE station of representativeness_weight 1.00 carrying one observation with humidity 10.0 and dead fuel moisture 6.0 (dryness clamps at 100)."
            - "ECHO's observation reports wind_gust_mph 52.0; FOXTROT's reports 51.9."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ECHO", district_code: "D-EAST", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { echo_id: $.data.id }
            - call: "POST /circuits"
              payload: { circuit_code: "FOXTROT", district_code: "D-EAST", hftd_tier: "TIER_2", overhead_miles: 6.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { foxtrot_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-E1", circuit_id: "${echo_id}", elevation_ft: 2400, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_e1_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-F1", circuit_id: "${foxtrot_id}", elevation_ft: 2400, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_f1_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_e1_id}", observed_at: "2026-08-31T12:00:00Z", wind_gust_mph: 52.0, relative_humidity_pct: 10.0, temperature_f: 103.0, dead_fuel_moisture_pct: 6.0 }
              as: MeteorologyAnalyst
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_f1_id}", observed_at: "2026-08-31T12:00:00Z", wind_gust_mph: 51.9, relative_humidity_pct: 10.0, temperature_f: 103.0, dead_fuel_moisture_pct: 6.0 }
              as: MeteorologyAnalyst
          trigger:
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${echo_id}", forecast_date: "2026-09-01", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_e_id: $.data.id }
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${foxtrot_id}", forecast_date: "2026-09-01", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_f_id: $.data.id }
          assert:
            - "FirePotentialIndex.${fpi_e_id}.wind_component == 80.00"
            - "FirePotentialIndex.${fpi_e_id}.dryness_component == 100 (clamped from the uncapped 114)"
            - "FirePotentialIndex.${fpi_e_id}.terrain_component == 70"
            - "FirePotentialIndex.${fpi_e_id}.equipment_component == 20"
            - "FirePotentialIndex.${fpi_e_id}.fpi_score == 75.00"
            - "FirePotentialIndex.${fpi_e_id}.fpi_tier == R5"
            - "FirePotentialIndex.${fpi_f_id}.fpi_score == 74.91"
            - "FirePotentialIndex.${fpi_f_id}.fpi_tier == R4"
            - "Circuit.${echo_id}.risk_posture == EXTREME and Circuit.${foxtrot_id}.risk_posture == EXTREME"

      - name: net_benefit_ratio_exactly_at_threshold_arms
        grounds:
          - calculations.psps_net_benefit_ratio
          - validations[priority=17]
          - errors[ERR_NET_BENEFIT_BELOW_THRESHOLD]
          - state_machines.PSPSEvent.SCOPED_to_ARMED
        distinguishing_aspect: |
          MIN_NET_BENEFIT_RATIO is inclusive: an event whose ignition_risk_avoided_score is 4.80 against an
          adjusted_customer_impact_score of 19.20 has net_benefit_ratio exactly 0.2500 and MUST arm, where
          a strict `>` comparison would raise ERR_NET_BENEFIT_BELOW_THRESHOLD. The same fixture also pins
          the credit-rate lower band: customer_impact_score 19.20 is below 20, so credit_rate is 0.00.
        test_recipe:
          setup:
            - "Circuit HOTEL is TIER_2 with overhead_miles 8.0, equipment_condition_index 80, inspected 2026-05-01 on a 36-month cycle, fast_trip_enabled false, and one ONLINE weight-1.00 station."
            - "Its single observation (gust 52.0, humidity 62.0, fuel moisture 9.0) gives a FORECAST index of 60.00 / tier R4 for 2026-08-20."
            - "Two customers sit on HOTEL: one CRITICAL_FACILITY and one medical-baseline residential."
            - "Event EV-H spans 2026-08-20T06:00:00Z to 2026-08-20T18:00:00Z (12 hours) and its ADVANCE_48H batch has been dispatched at 2026-08-18T06:00:00Z."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "HOTEL", district_code: "D-SOUTH", hftd_tier: "TIER_2", overhead_miles: 8.0, equipment_condition_index: 80, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
              captures: { hotel_id: $.data.id }
            - call: "POST /weather-stations"
              payload: { station_code: "WS-H1", circuit_id: "${hotel_id}", elevation_ft: 2000, representativeness_weight: 1.00, telemetry_status: "ONLINE" }
              as: MeteorologyAnalyst
              captures: { ws_h1_id: $.data.id }
            - call: "POST /weather-observations"
              payload: { weather_station_id: "${ws_h1_id}", observed_at: "2026-08-19T12:00:00Z", wind_gust_mph: 52.0, relative_humidity_pct: 62.0, temperature_f: 94.0, dead_fuel_moisture_pct: 9.0 }
              as: MeteorologyAnalyst
            - call: "POST /fire-potential-indices"
              payload: { circuit_id: "${hotel_id}", forecast_date: "2026-08-20", computation_variant: "FORECAST" }
              as: MeteorologyAnalyst
              captures: { fpi_h_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-H1", circuit_id: "${hotel_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: false, preferred_language: "EN", notification_channels: ["VOICE"], accessibility_needs: [], address_zone_code: "ZH" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-H2", circuit_id: "${hotel_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "ZH" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-H", trigger_fire_potential_index_id: "${fpi_h_id}", forecast_onset_at: "2026-08-20T06:00:00Z", forecast_all_clear_at: "2026-08-20T18:00:00Z" }
              as: PSPSDutyOfficer
              captures: { evh_id: $.data.id, evh_v0: $.data.version }
            - call: "POST /psps-events/${evh_id}/scope"
              payload: { expected_psps_event_version: "${evh_v0}" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches"
              payload: { psps_event_id: "${evh_id}", stage: "ADVANCE_48H", scheduled_send_at: "2026-08-18T06:00:00Z" }
              as: CommunityLiaison
              captures: { h_adv_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T06:00:00Z" }
              as: PSPSDutyOfficer
            - call: "POST /notification-batches/${h_adv_id}/dispatch"
              payload: {}
              as: CommunityLiaison
          trigger:
            - call: "POST /psps-events/${evh_id}/arm"
              payload: {}
              as: PSPSDutyOfficer
          assert:
            - "HTTP 200 — the arm succeeds"
            - "PSPSEvent.${evh_id}.duration_hours == 12"
            - "PSPSEvent.${evh_id}.ignition_risk_avoided_score == 4.80"
            - "PSPSEvent.${evh_id}.customer_impact_score == 19.20"
            - "PSPSEvent.${evh_id}.crc_mitigation_credit == 0.00 (credit_rate is 0.00 below a score of 20)"
            - "PSPSEvent.${evh_id}.adjusted_customer_impact_score == 19.20"
            - "PSPSEvent.${evh_id}.net_benefit_ratio == 0.2500"
            - "PSPSEvent.${evh_id}.scope_status == ARMED"
            - "Circuit.${hotel_id}.energization_state == DE_ENERGIZATION_PENDING and risk_posture == LOCKED"

      - name: advance_notification_lead_time_exact_minimum_accepted
        grounds:
          - calculations.notification_lead_time
          - validations[priority=13]
          - errors[ERR_NOTIFICATION_LEAD_TIME_SHORT]
          - entities.NotificationBatch.fields.lead_time_minutes
        distinguishing_aspect: |
          STAGE_MIN_LEAD_MINUTES[ADVANCE_48H] is 2880 and the comparison is inclusive: dispatching at
          exactly 2026-08-13T18:00:00Z against an onset of 2026-08-15T18:00:00Z yields lead_time_minutes
          2880 and succeeds, whereas dispatching one minute later yields 2879 and must be refused with
          ERR_NOTIFICATION_LEAD_TIME_SHORT while the batch stays PENDING.
        test_recipe:
          setup:
            - "The ALPHA -> BRAVO -> CHARLIE chain with the five customers, the R5 FORECAST index for 2026-08-15, and event EV-1 scoped over three circuits with onset 2026-08-15T18:00:00Z."
            - "Two ADVANCE_48H batches have been planned for EV-1: BATCH-EARLY and BATCH-LATE."
          setup_api_calls:
            - call: "POST /circuits"
              payload: { circuit_code: "ALPHA", district_code: "D-NORTH", hftd_tier: "TIER_3", overhead_miles: 7.0, equipment_condition_index: 55, inspection_cycle_months: 36, last_inspection_completed_at: "2026-05-01T00:00:00Z", fast_trip_enabled: false }
              as: GridPlanner
