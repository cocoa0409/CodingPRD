# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task 2731 — Privatized Military Family Housing Management
#
# Nine §0.5 rule_id blocks, 25 instances total. Every `grounds:` entry resolves
# into SCAFFOLD.yaml §1.1–§1.7; every `setup_api_calls` / `trigger` entry is a
# structured call against a §1.5 endpoint; every numeric literal in `assert:`
# was produced by executing the matching §1.3 `formula:` with its `constants:`
# under round_half_up.
#
# Fixture note — the logical clock starts at 2026-08-01T00:00:00Z and every
# recipe repositions it explicitly with POST /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two instances in different entity domains: lease rent-setting (Lease /
  # BahRate money) and installation occupancy metrics (ReinvestmentAccount
  # performance percentages).
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: lease_gross_rent_provisional_vs_final_divergence
        grounds:
          - calculations.gross_rent_determination
          - calculations.daily_rent_rate
          - entities.Lease.fields.rent_basis
          - entities.Lease.fields.rent_effective_year
          - entities.BahRate.fields.effective_year
          - state_machines.Lease.PENDING_MOVE_IN_to_OCCUPIED
        distinguishing_aspect: |
          The OFFER_PROVISIONAL and MOVE_IN_FINAL variants of
          gross_rent_determination read DIFFERENT BahRate rows for one
          unchanged lease — the provisional variant keys on the calendar year
          of WaitlistApplication.effective_control_date (2025) while the final
          variant keys on the calendar year of Lease.start_date (2026) — so the
          same lease's gross_rent_cents moves 224070 -> 237650 at move-in; this
          instance lives in the Lease/BahRate money domain, unlike the
          ReinvestmentAccount occupancy instance below.
        test_recipe:
          setup:
            - "One installation with bill_of_rights_version 2026.1 and two BahRate rows for pay_grade E5 with_dependents true: effective_year 2025 (231000 / 18000) and effective_year 2026 (245000 / 19500)."
            - "One 2-bedroom TOWNHOME unit designated JUNIOR_ENLISTED, status AVAILABLE."
            - "One E5 sponsor with three full-time-custody dependents (spouse plus two boys born 2018-04-10 and 2022-03-15), so bedroom_eligibility resolves to 2."
            - "The logical clock stands at 2025-11-01T00:00:00Z; the application's pcs_orders_date is 2025-11-15, so effective_control_date falls in calendar 2025."
            - "The application has been offered the unit and has ACCEPTED it; no lease exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2025-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2025, monthly_rate_cents: 231000, utility_allowance_cents: 18000 }
              as: PlatformAdmin
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: $.data.id }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2025-11-15", expected_arrival_date: "2026-01-05", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
          trigger:
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-01-05", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: $.data.id, prov_gross: $.data.gross_rent_cents, prov_net: $.data.net_rent_cents }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-01-04" }
              as: PropertyManager
              captures: { insp1_id: $.data.id }
            - call: "POST /move-in-inspections/${insp1_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ana Reyes", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l1_id}/move-in"
              payload: {}
              as: PropertyManager
              captures: { final_gross: $.data.gross_rent_cents, final_net: $.data.net_rent_cents }
          assert:
            - "POST /leases response: data.rent_basis == OFFER_PROVISIONAL"
            - "POST /leases response: data.rent_effective_year == 2025"
            - "POST /leases response: data.gross_rent_cents == 224070"
            - "POST /leases response: data.utility_allowance_cents == 18000"
            - "POST /leases response: data.net_rent_cents == 206070"
            - "POST /leases response: data.daily_rent_cents == 6775"
            - "POST /leases/${l1_id}/move-in response: data.rent_basis == MOVE_IN_FINAL"
            - "POST /leases/${l1_id}/move-in response: data.rent_effective_year == 2026"
            - "POST /leases/${l1_id}/move-in response: data.gross_rent_cents == 237650"
            - "POST /leases/${l1_id}/move-in response: data.utility_allowance_cents == 19500"
            - "POST /leases/${l1_id}/move-in response: data.net_rent_cents == 218150"
            - "POST /leases/${l1_id}/move-in response: data.daily_rent_cents == 7172"
            - "${final_gross} - ${prov_gross} == 13580"
            - "${final_net} - ${prov_net} == 12080"
            - "Lease.${l1_id}.occupancy_status == OCCUPIED and Lease.${l1_id}.allotment_status == ACTIVE"

      - name: occupancy_rate_unit_day_vs_month_end_divergence
        grounds:
          - calculations.occupancy_rate_determination
          - calculations.performance_incentive_fee
          - entities.ReinvestmentAccount.fields.occupancy_basis
          - entities.ReinvestmentAccount.fields.occupancy_rate_pct
          - entities.ReinvestmentAccount.fields.performance_incentive_fee_cents
        distinguishing_aspect: |
          Two ReinvestmentAccount rows on the SAME installation and the SAME
          period 2026-09, differing only in occupancy_basis, produce
          occupancy_rate_pct 90.00 (UNIT_DAY_WEIGHTED: 54 occupied unit-days
          over 60) versus 100.00 (MONTH_END_SNAPSHOT: 2 of 2 units occupied on
          2026-09-30), which lands them in different incentive multiplier bands
          (0.50 vs 1.25) and yields performance_incentive_fee_cents 6993 vs
          17481; this instance lives in the installation-performance domain,
          not the Lease/BahRate money domain of the instance above.
        test_recipe:
          setup:
            - "One installation with default incentive_base_pct 0.03 and two BahRate rows for effective_year 2026: E5 with_dependents true (245000 / 19500) and E7 with_dependents true (268000 / 20000)."
            - "Two units: a 2-bedroom TOWNHOME designated JUNIOR_ENLISTED and a 3-bedroom SFH designated SENIOR_ENLISTED."
            - "Two sponsors: an E5 with spouse plus two boys (2018-04-10, 2022-03-15) resolving to bedroom_eligibility 2, and an E7 with spouse plus two girls (2015-11-15, 2020-07-22) resolving to bedroom_eligibility 3."
            - "Lease 1 is OCCUPIED from 2026-09-01 (30 of September's 30 days) with net_rent_cents 218150; lease 2 is OCCUPIED from 2026-09-07 (24 days) with net_rent_cents 248000."
            - "The 2026-09 allotment run has posted both CHARGE rows, so net_collected_cents for the period is 466150."
            - "Two ReinvestmentAccount rows for fiscal_year 2026, both with opening_balance_cents 5000000, one UNIT_DAY_WEIGHTED and one MONTH_END_SNAPSHOT; the clock stands at 2026-10-01T00:00:00Z so the 2026-09 period is not in the future."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E7", with_dependents: true, effective_year: 2026, monthly_rate_cents: 268000, utility_allowance_cents: 20000 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "B-200", bedroom_count: 3, unit_type: "SFH", designated_rank_category: "SENIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: $.data.id }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /service-members"
              payload: { dodid: "1000000002", last_name: "Okafor", first_name: "Ben", branch: "ARMY", pay_grade: "E7" }
              as: PlatformAdmin
              captures: { sm2_id: $.data.id }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "SPOUSE", date_of_birth: "1988-05-09", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2015-11-15", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm2_id}", relationship: "CHILD", date_of_birth: "2020-07-22", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm2_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-07", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm2_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /waitlist-applications/${app2_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm2_id}"
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: $.data.id }
            - call: "POST /leases"
              payload: { application_id: "${app2_id}", housing_unit_id: "${u2_id}", start_date: "2026-09-07", term_months: 12 }
              as: PropertyManager
              captures: { l2_id: $.data.id }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-08-31" }
              as: PropertyManager
              captures: { insp1_id: $.data.id }
            - call: "POST /move-in-inspections/${insp1_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ana Reyes", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l2_id}", scheduled_date: "2026-09-06" }
              as: PropertyManager
              captures: { insp2_id: $.data.id }
            - call: "POST /move-in-inspections/${insp2_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ben Okafor", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l1_id}/move-in"
              payload: {}
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l2_id}/move-in"
              payload: {}
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations/${inst_id}/allotment-run"
              payload: { period_month: "2026-09" }
              as: PropertyManager
            - call: "POST /reinvestment-accounts"
              payload: { installation_id: "${inst_id}", fiscal_year: 2026, opening_balance_cents: 5000000, occupancy_basis: "UNIT_DAY_WEIGHTED" }
              as: PlatformAdmin
              captures: { acct_ud_id: $.data.id }
            - call: "POST /reinvestment-accounts"
              payload: { installation_id: "${inst_id}", fiscal_year: 2026, opening_balance_cents: 5000000, occupancy_basis: "MONTH_END_SNAPSHOT" }
              as: PlatformAdmin
              captures: { acct_me_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /reinvestment-accounts/${acct_ud_id}/metrics-run"
              payload: { period_month: "2026-09" }
              as: PropertyManager
              captures: { ud_rate: $.data.occupancy_rate_pct, ud_fee: $.data.performance_incentive_fee_cents }
            - call: "POST /reinvestment-accounts/${acct_me_id}/metrics-run"
              payload: { period_month: "2026-09" }
              as: PropertyManager
              captures: { me_rate: $.data.occupancy_rate_pct, me_fee: $.data.performance_incentive_fee_cents }
          assert:
            - "ReinvestmentAccount.${acct_ud_id}.occupancy_rate_pct == 90.00"
            - "ReinvestmentAccount.${acct_me_id}.occupancy_rate_pct == 100.00"
            - "${me_rate} - ${ud_rate} == 10.00"
            - "ReinvestmentAccount.${acct_ud_id}.net_collected_cents == 466150"
            - "ReinvestmentAccount.${acct_me_id}.net_collected_cents == 466150"
            - "ReinvestmentAccount.${acct_ud_id}.performance_incentive_fee_cents == 6993"
            - "ReinvestmentAccount.${acct_me_id}.performance_incentive_fee_cents == 17481"
            - "ReinvestmentAccount.${acct_ud_id}.habitability_penalty_pct == 0"
            - "ReinvestmentAccount.${acct_ud_id}.contributions_cents == 46615"
            - "ReinvestmentAccount.${acct_ud_id}.closing_balance_cents == 5046615"
            - "ReinvestmentAccount.${acct_ud_id}.metrics_run_epoch == 1"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # Three instances, one per §0.5 mode:
  #   (a) >= 3-input non-linear composition — work_order_priority_classification
  #   (b) pinned rounding order            — displacement_rent_abatement
  #   (c) pinned evaluation order of a circular-looking dependency
  #                                         — early_termination_settlement
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: work_order_priority_nonlinear_max_bumps
        grounds:
          - calculations.work_order_priority_classification
          - entities.WorkOrder.fields.priority_class
          - entities.WorkOrder.fields.response_due_at
          - entities.WorkOrder.fields.completion_due_at
          - entities.Dependent.fields.date_of_birth
        distinguishing_aspect: |
          Mode (a): priority_class is a non-linear composition of THREE
          independent inputs — the reported category tier, the
          habitability_impact flag, and the age of the sponsor's youngest
          full-time-custody child on the unit's OCCUPIED lease — combined with
          two max() floors and then a min() cap on completion_due_at, so an
          APPLIANCE order (base tier 1) with habitability_impact true against a
          household with a 4-year-old lands on EMERGENCY while a
          MOLD_SUSPECTED order (base tier 2) with habitability_impact false on
          the SAME unit and the SAME household stays URGENT; no single input
          determines the outcome.
        test_recipe:
          setup:
            - "One installation, one 2-bedroom TOWNHOME unit, one E5 sponsor with spouse plus two boys born 2018-04-10 and 2022-03-15."
            - "Lease 1 is OCCUPIED on that unit from 2026-09-01 with net_rent_cents 218150; the younger child is 4 years old on 2026-09-10, i.e. under the VULNERABLE_CHILD_AGE_CEILING of 6."
            - "The logical clock stands at 2026-09-10T09:00:00Z, so every work order created below has reported_at 2026-09-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /bah-rates"
              payload: { installation_id: "${inst_id}", pay_grade: "E5", with_dependents: true, effective_year: 2026, monthly_rate_cents: 245000, utility_allowance_cents: 19500 }
              as: PlatformAdmin
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "A-101", bedroom_count: 2, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED", historic_flag: false }
              as: PlatformAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /service-members"
              payload: { dodid: "1000000001", last_name: "Reyes", first_name: "Ana", branch: "ARMY", pay_grade: "E5" }
              as: PlatformAdmin
              captures: { sm1_id: $.data.id }
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "SPOUSE", date_of_birth: "1992-03-04", gender: "FEMALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2018-04-10", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /dependents"
              payload: { service_member_id: "${sm1_id}", relationship: "CHILD", date_of_birth: "2022-03-15", gender: "MALE", is_full_time_custody: true }
              as: PlatformAdmin
            - call: "POST /waitlist-applications"
              payload: { installation_id: "${inst_id}", service_member_id: "${sm1_id}", pcs_orders_date: "2026-08-25", expected_arrival_date: "2026-09-01", accessibility_required: false }
              as: ServiceMember
              as_user_id: "${sm1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /installations/${inst_id}/waitlist-offer-run"
              payload: {}
              as: PropertyManager
            - call: "POST /waitlist-applications/${app1_id}/accept-offer"
              payload: {}
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /leases"
              payload: { application_id: "${app1_id}", housing_unit_id: "${u1_id}", start_date: "2026-09-01", term_months: 12 }
              as: PropertyManager
              captures: { l1_id: $.data.id }
            - call: "POST /move-in-inspections"
              payload: { lease_id: "${l1_id}", scheduled_date: "2026-08-31" }
              as: PropertyManager
              captures: { insp1_id: $.data.id }
            - call: "POST /move-in-inspections/${insp1_id}/tenant-acknowledge"
              payload: { tenant_signature_name: "Ana Reyes", bill_of_rights_version_ack: "2026.1" }
              as: ServiceMember
              as_user_id: "${sm1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /leases/${l1_id}/move-in"
              payload: {}
              as: PropertyManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /work-orders"
              payload: { housing_unit_id: "${u1_id}", lease_id: "${l1_id}", category: "COSMETIC", description: "Scuffed baseboard in hallway", habitability_impact: false }
              as: PropertyManager
              captures: { wo_routine_id: $.data.id }
            - call: "POST /work-orders"
              payload: { housing_unit_id: "${u1_id}", lease_id: "${l1_id}", category: "MOLD_SUSPECTED", description: "Discoloured grout in guest bath", habitability_impact: false }
