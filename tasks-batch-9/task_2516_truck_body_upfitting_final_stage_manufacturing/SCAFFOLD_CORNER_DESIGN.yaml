            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-POOL-B", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "TIER_B", standard_equipment_spec_ids: [] }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
