scenario: |
  Corporate Real Estate Outsourcing, Transaction Management & Facilities Integration (CBRE):
  account-based outsourcing contracts bundling transaction, project and facilities management
  with governance structures, transaction management for a client portfolio with lease
  expiration pipelines, approval workflows and market-by-market broker deployment, commission
  and fee arrangements where third-party commissions may be credited against account fees, key
  performance indicators with gainshare and penalty mechanisms tied to savings and service
  levels, facilities service delivery through self-perform and subcontracted vendors with
  sourcing programs, occupancy planning with utilization measurement and portfolio consolidation
  projects, data and technology platform delivery with client-owned data rights, transition and
  offboarding at contract end.

domain_name: "corporate-real-estate-outsourcing"
api_prefix: "/api"

complexity_profile:
  primary_archetype: "Multi-party negotiation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Derived field reconciliation"
    - "Ops-run checkpoint"
  entity_topology: "flat"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - "one_to_many"
    - "cross_aggregate"
  role_model: "approval_chain"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PortfolioAccount
    parent: null
    common_fields: true
    fields:
      - name: account_name
        type: string
        source: input
        description: "Client account name; unique across accounts."
        constraints: "unique; 1..120 chars; trimmed"
      - name: client_name
        type: string
        source: input
        description: "Name of the outsourcing client."
      - name: portfolio_sqft
        type: integer
        source: input
        description: "Total leased portfolio square footage owned by the client at contract start."
        constraints: ">= 1"
      - name: platform_tier
        type: enum
        source: input
        description: "Data and technology platform tier bundled with the account."
        constraints: "enum: BASIC | COMPLETE | ENTERPRISE"
      - name: client_data_rights
        type: enum
        source: computed
        description: "Derived from platform_tier. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: BROKER_OWNED | CLIENT_OWNED_EXCLUSIVE | CLIENT_OWNED_SHARED"
      - name: governance_posture
        type: enum
        source: computed
        description: "Derived from child audit states and open escalations. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: NORMAL | ON_WATCH | RESTRICTED"
      - name: open_escalation_count
        type: integer
        source: computed
        description: "Count of ServiceLevelKpi rows on this account whose escalation_status == OPEN."
      - name: lifecycle_state
        type: enum
        source: computed
        description: "Single source of truth for child-operation gating. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: DRAFT | ACTIVE | OFFBOARDING | CLOSED_CONVERTED | CLOSED_TERMINATED"
      - name: completion_pct_bps
        type: integer
        source: computed
        description: "Derived; recomputed whenever a TransitionTask reaches DONE or FAILED. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
      - name: annual_net_fee_cents
        type: number
        source: computed
        description: "Derived; recomputed on account update and after every CommissionRecord posting. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
      - name: fee_ledger_credit_cents
        type: number
        source: computed
        description: "Conserved commission-credit ledger total: the sum of credit_amount_cents over every CommissionRecord on the account. Posting a record raises it; applying the credit to a fee accrual transfers within it but never changes it."
      - name: broker_pool_allocated_cents
        type: number
        source: computed
        description: "Conserved broker pool: sum of broker_share_cents + account_share_cents over this account's engagements with engagement_state EXECUTED. Executing an engagement raises it by the deal commission; terminating that engagement must return it to its prior value."
      - name: portfolio_leased_sqft
        type: integer
        source: computed
        description: "Conserved occupancy area: sum of FacilitySite.sqft over sites with vacancy_state IN {OCCUPIED, CONSOLIDATING}."
      - name: version
        type: integer
        source: system
        description: "Common field; integer starting at 1, incremented by one on every mutation including cascaded side effects."

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account whose lease pipeline this lease belongs to."
      - name: property_address
        type: string
        source: input
        description: "Street address of the leased premises."
      - name: market_code
        type: string
        source: input
        description: "Market where the premises sit (e.g. NYC, CHI, SFO)."
        constraints: "unique together with account_id + property_address"
      - name: leased_sqft
        type: integer
        source: input
        description: "Leased square footage of the premises."
        constraints: ">= 1"
      - name: base_rent_cents_per_year
        type: integer
        source: input
        description: "Current annual base rent in cents."
        constraints: ">= 1"
      - name: lease_start_date
        type: datetime
        source: input
        description: "Lease commencement instant (ISO 8601 UTC)."
      - name: lease_end_date
        type: datetime
        source: input
        description: "Lease expiration instant (ISO 8601 UTC); the input to the expiration pipeline."
        constraints: "> lease_start_date"
      - name: expiration_bucket
        type: enum
        source: computed
        description: "Derived lease-expiration bucket, recomputed on every account clock advance. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: UNASSIGNED | NEAR_TERM | MID_TERM | LONG_TERM"
      - name: pipeline_state
        type: enum
        source: computed
        description: "Lease transaction-management state. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: PIPELINE | APPROVAL_PENDING | BROKER_ASSIGNED | IN_MARKET | NEGOTIATING | EXECUTED | REJECTED"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of REJECTED -> APPROVAL_PENDING revision loops this lease has entered."

  - name: TransactionRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account this transaction request is billed to."
      - name: lease_id
        type: string
        source: input
        description: "FK -> Lease.id; the lease this transaction request acts on."
      - name: request_type
        type: enum
        source: input
        description: "Kind of transaction-management work being requested."
        constraints: "enum: RENEWAL | NEW_LEASE | RESTRUCTURE | DISPOSITION"
      - name: request_state
        type: enum
        source: computed
        description: "TransactionRequest approval state. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | WITHDRAWN | EXECUTED | CANCELLED"
      - name: required_approval_level
        type: enum
        source: computed
        description: "Derived from the request value band at submission. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: MANAGER | DIRECTOR | ACCOUNT_EXECUTIVE"
      - name: prior_rent_cents_per_year
        type: integer
        source: input
        description: "Annual rent before the requested change."
        constraints: ">= 1"
      - name: proposed_rent_cents_per_year
        type: integer
        source: input
        description: "Annual rent the request targets."
        constraints: ">= 1"
      - name: requested_term_months
        type: integer
        source: input
        description: "Term length in months requested."
      - name: third_party_commission_cents
        type: integer
        source: input
        description: "Commission that a third-party broker will be paid on execution of this request."
        constraints: ">= 0"
      - name: has_commission_credit
        type: boolean
        source: input
        description: "Whether the third-party commission is credited against account fees."
        default: false
      - name: savings_provisional_cents
        type: integer
        source: computed
        description: "Provisional savings estimate derived from the market benchmark rate at approval time."
      - name: savings_final_cents
        type: integer
        source: computed
        description: "Final realized savings derived from the executed rent, computed on execution."

  - name: CommissionRecord
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account whose fee this commission is credited against."
      - name: commission_source
        type: enum
        source: input
        description: "Who earned the third-party commission."
        constraints: "enum: THIRD_PARTY | SELF_PERFORM"
      - name: base_rent_cents
        type: integer
        source: input
        description: "Annual rent base the commission percentage is applied to."
        constraints: ">= 0"
      - name: commission_pct
        type: number
        source: input
        description: "Commission rate as a decimal fraction (e.g. 0.185)."
        constraints: "0 <= commission_pct <= 0.35"
      - name: accrual_date
        type: datetime
        source: input
        description: "Instant the commission accrues; orders CommissionRecord rows for credit application."
      - name: credit_amount_cents
        type: number
        source: computed
        description: "Rounded commission credit applied against the account fee, floored at a per-record minimum."
      - name: credited
        type: boolean
        source: computed
        description: "Whether this record has been applied against account fee accrual."

  - name: BrokerEngagement
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account this engagement serves."
      - name: transaction_request_id
        type: string
        source: input
        description: "FK -> TransactionRequest.id; the transaction request being executed."
      - name: market_code
        type: string
        source: input
        description: "Market the broker is deployed into; must match the lease's market_code."
      - name: broker_name
        type: string
        source: input
        description: "Name of the deployed broker."
      - name: licensed_in_market
        type: boolean
        source: input
        description: "Whether the broker holds the licence required by the target market."
      - name: broker_class
        type: enum
        source: input
        description: "Broker agent class, which changes the commission split."
        constraints: "enum: SENIOR | STANDARD"
      - name: engagement_state
        type: enum
        source: computed
        description: "Broker engagement state."
        constraints: "enum: PENDING | ASSIGNED | EXECUTED | TERMINATED"
      - name: deal_commission_cents
        type: integer
        source: computed
        description: "Commission pool attributable to the executed deal."
      - name: broker_share_cents
        type: integer
        source: computed
        description: "Portion of deal_commission_cents retained by the deployed broker after the account share."
      - name: account_share_cents
        type: integer
        source: computed
        description: "Portion of deal_commission_cents retained by the account; the conserved pool share."

  - name: ServiceLevelKpi
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account under management."
      - name: kpi_code
        type: string
        source: input
        description: "KPI identifier, e.g. SLA_SCORE or SAVINGS_ACHIEVED_CENTS."
        constraints: "unique together with account_id"
      - name: kpi_family
        type: enum
        source: input
        description: "Which KPI family the row belongs to; selects the measurement mechanism."
        constraints: "enum: SERVICE_LEVEL | SAVINGS"
      - name: measurement_unit
        type: enum
        source: input
        description: "Unit of measure for the KPI target and actual."
        constraints: "enum: BPS | CENTS"
      - name: measurement_window
        type: enum
        source: input
        description: "Window over which the KPI is measured."
        constraints: "enum: QUARTERLY | ANNUAL"
      - name: target_value
        type: integer
        source: input
        description: "Target value in measurement_unit (bps for BPS, cents for CENTS)."
      - name: actual_value
        type: integer
        source: computed
        description: "Latest measured value; recomputed when the account clock advances."
      - name: evaluation_state
        type: enum
        source: computed
        description: "KPI evaluation lifecycle."
        constraints: "enum: AWAITING_BASELINE | EVALUATED | ESCALATED"
      - name: escalation_status
        type: enum
        source: computed
        description: "Escalation flag; OPEN rows count toward PortfolioAccount.open_escalation_count."
        constraints: "enum: NONE | OPEN | RESOLVED"
      - name: gainshare_cents
        type: integer
        source: computed
        description: "Gainshare amount earned against realized savings."
      - name: penalty_cents
        type: integer
        source: computed
        description: "Penalty amount assessed for service-level shortfall."
      - name: net_adjustment_cents
        type: integer
        source: computed
        description: "gainshare_cents - penalty_cents for this row."

  - name: FacilitiesVendor
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account this vendor serves."
      - name: vendor_name
        type: string
        source: input
        description: "Vendor legal name."
        constraints: "unique together with account_id and service_line"
      - name: service_line
        type: enum
        source: input
        description: "Facilities service line delivered."
        constraints: "enum: JANITORIAL | SECURITY | HVAC | LANDSCAPING"
      - name: delivery_model
        type: enum
        source: input
        description: "Whether the account self-performs or subcontracts this service line."
        constraints: "enum: SELF_PERFORM | SUBCONTRACTED"
      - name: sourcing_program
        type: enum
        source: input
        description: "Sourcing programme the vendor contract was awarded under."
        constraints: "enum: DIVERSITY | LOCAL | NATIONAL"
      - name: kpi_track
        type: enum
        source: computed
        description: "Derived; recomputed from delivery_model + sourcing_program + site lifecycle. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: LEVEL_A | LEVEL_B | LEVEL_C"
      - name: service_rate_cents_per_sqft
        type: number
        source: input
        description: "Contracted service rate in cents per square foot per year."
        constraints: "> 0"
      - name: sqft_reduction
        type: integer
        source: input
        description: "Square footage this site contributes to its consolidation project."
        default: 0
        constraints: ">= 0"
      - name: consolidation_window_start
        type: datetime
        source: input
        description: "Start of this site's committed consolidation interval (inclusive)."
        default: null
      - name: consolidation_window_end
        type: datetime
        source: input
        description: "End of this site's committed consolidation interval (exclusive)."
        default: null
      - name: vendor_state
        type: enum
        source: computed
        description: "Vendor lifecycle state."
        constraints: "enum: SOURCING | ACTIVE | SUSPENDED | TERMINATED"

  - name: FacilitySite
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account whose portfolio this site sits in."
      - name: vendor_id
        type: string
        source: input
        description: "FK -> FacilitiesVendor.id; the vendor delivering services at this site."
      - name: site_name
        type: string
        source: input
        description: "Site display name."
      - name: sqft
        type: integer
        source: input
        description: "Site square footage."
        constraints: ">= 1"
      - name: vacancy_state
        type: enum
        source: computed
        description: "Occupancy state; transitions are gated by the account governance posture. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: OCCUPIED | VACATED | CONSOLIDATING | DISPOSED"
      - name: consolidation_project_id
        type: string
        source: input
        description: "FK -> ConsolidationProject.id; the consolidation project this site is assigned to, if any."
        default: null

  - name: ConsolidationProject
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account this consolidation project serves."
      - name: project_name
        type: string
        source: input
        description: "Project display name."
      - name: project_state
        type: enum
        source: computed
        description: "Consolidation project state machine state. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: PLANNED | IN_REVIEW | APPROVED | IN_EXECUTION | COMPLETED | CANCELLED"
      - name: planned_sqft_reduction
        type: integer
        source: input
        description: "Square footage the project promises to remove; must equal the sum of assigned sites' sqft_reduction."
        constraints: "> 0"
      - name: approved_sqft_reduction
        type: integer
        source: input
        description: "Square footage approved at the governance gate."
      - name: realized_sqft_reduction
        type: integer
        source: computed
        description: "Cumulative square footage actually released by DISPOSED sites and executed projects."
      - name: savings_estimate_cents
        type: integer
        source: computed
        description: "Provisional savings estimate for the project; recomputed on plan change."
      - name: savings_finalized_cents
        type: integer
        source: computed
        description: "Finalized project savings; computed when the project reaches IN_EXECUTION."
      - name: cost_inflation_factor
        type: number
        source: input
        description: "Applied cost inflation factor, capped by the scaffold's constants."
        constraints: ">= 1.0"
      - name: per_site_rates
        type: array
        source: input
        description: "Ordered array of per-site consoldation rates in cents per square foot; element i applies to the i-th site when sites are ordered by created_at ASC."
      - name: per_site_sqft_reductions
        type: array
        source: input
        description: "Ordered array of per-site square-footage reductions; element i applies to the i-th site when sites are ordered by created_at ASC."

  - name: Scorecard
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account this scorecard scores."
      - name: service_line
        type: enum
        source: input
        description: "Facilities service line the scorecard grades."
        constraints: "enum: JANITORIAL | SECURITY | HVAC | LANDSCAPING"
      - name: quality_bps
        type: integer
        source: input
        description: "Composite quality score in basis points."
        constraints: "0 <= quality_bps <= 10000"
      - name: response_bps
        type: integer
        source: input
        description: "Composite responsiveness score in basis points."
        constraints: "0 <= response_bps <= 10000"
      - name: composite_bps
        type: integer
        source: computed
        description: "Weighted composite score. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
      - name: adjustments_applied
        type: integer
        source: computed
        description: "Count of commission credit adjustments applied to AccountFeeAccrual rows because of this scorecard."
      - name: scorecard_state
        type: enum
        source: computed
        description: "Scorecard state."
        constraints: "enum: DRAFT | PUBLISHED | OVERRIDDEN"

  - name: DisciplineAudit
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account this audit examines."
      - name: discipline
        type: enum
        source: input
        description: "Outsourcing discipline audited."
        constraints: "enum: TRANSACTION | FACILITIES | PROJECT"
      - name: finding
        type: string
        source: input
        description: "Finding text recorded by the auditor."
      - name: audit_state
        type: enum
        source: computed
        description: "Audit lifecycle state; summed into PortfolioAccount.governance_posture. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: SCHEDULED | IN_REVIEW | PASSED | FAILED"
      - name: remediation_required
        type: boolean
        source: computed
        description: "Whether a FAILED audit demands remediation before offboarding can complete."
      - name: cooling_off_until
        type: datetime
        source: computed
        description: "Instant until which the account cannot be transitioned or closed after a FAILED audit."

  - name: DataLicense
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account whose data is licensed."
      - name: licensee_name
        type: string
        source: input
        description: "Name of the licensee requesting account data."
      - name: platform_tier_at_issue
        type: enum
        source: input
        description: "Platform tier in force when the licence was requested."
        constraints: "enum: BASIC | COMPLETE | ENTERPRISE"
      - name: data_scope
        type: enum
        source: input
        description: "Scope of account data being licensed."
        constraints: "enum: AGGREGATE | LINE_ITEM"
      - name: requires_written_client_consent
        type: boolean
        source: computed
        description: "Derived consent requirement; recomputed from the account's current platform_tier and this licence's data_scope."
      - name: license_state
        type: enum
        source: computed
        description: "Licence lifecycle state; revoked automatically when the account closes at contract end. Read the enum value from JSON data.<enum_name> (serialized as a JSON object rendered string)."
        constraints: "enum: REQUESTED | GRANTED | REJECTED | REVOKED"

  - name: TransitionTask
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account being transitioned or offboarded."
      - name: task_name
        type: string
        source: input
        description: "Task display name."
      - name: task_type
        type: enum
        source: input
        description: "Transition task category."
        constraints: "enum: DATA_HANDOVER | RECORDS_TRANSFER | VENDOR_TERMINATION | FINAL_RECONCILIATION"
      - name: sequence_no
        type: integer
        source: input
        description: "Ordering index within the account's transition plan."
      - name: blocking
        type: boolean
        source: input
        description: "Whether this task blocks account closure while it is not DONE."
      - name: due_at
        type: datetime
        source: input
        description: "Instant by which this task must be DONE; once the account clock passes it the task is overdue."
      - name: task_state
        type: enum
        source: computed
        description: "Transition task state."
        constraints: "enum: PENDING | IN_PROGRESS | DONE | FAILED"

  - name: AccountFeeAccrual
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account whose fee accrues."
      - name: period
        type: string
        source: input
        description: "Accrual period label such as 2026-Q1."
        constraints: "unique together with account_id"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Base management fee for the period, before commission credits."
        constraints: ">= 0"
      - name: applied_credit_cents
        type: number
        source: computed
        description: "Commission credit applied to this accrual; computed by commission_credit_nets_fee."
      - name: credit_application_state
        type: enum
        source: computed
        description: "Fee accrual settling state."
        constraints: "enum: OPEN | CREDITED | SETTLED"
      - name: settled_at
        type: datetime
        source: system
        description: "Instant the accrual settled; null while unsettled."

  - name: AccountAssignment
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> PortfolioAccount.id; the account the user is assigned to."
      - name: assignee_name
        type: string
        source: input
        description: "Display name of the assigned user."
      - name: assignment_role
        type: enum
        source: input
        description: "Operational role the user holds on the account."
        constraints: "enum: ACCOUNT_EXECUTIVE | TRANSACTION_MANAGER | FACILITIES_MANAGER | OCCUPANCY_PLANNER | GOVERNANCE_MANAGER | DATA_STEWARD | TRANSITION_MANAGER | APPROVAL_AUTHORITY"
      - name: approval_level
        type: enum
        source: input
        description: "Approval level granted to this assignment; only meaningful when assignment_role is APPROVAL_AUTHORITY."
        default: MANAGER
        constraints: "enum: MANAGER | DIRECTOR | ACCOUNT_EXECUTIVE"

  - name: AuditReview
    parent: null
    common_fields: true
    fields:
      - name: discipline_audit_id
        type: string
        source: input
        description: "FK -> DisciplineAudit.id; the audit this review round examines."
      - name: reviewer_name
        type: string
        source: input
        description: "Name of the reviewer recording the round."
      - name: round_notes
        type: string
        source: input
        description: "Notes captured for this review round."
      - name: review_round_no
        type: integer
        source: computed
        description: "1-based review round index within the audit's existing reviews ordered by created_at ASC."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PortfolioAccount
    initial_state: DRAFT
    terminal_states: [CLOSED_CONVERTED, CLOSED_TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/accounts/{id}/activate"
        actor: AccountExecutive
        preconditions:
          - "account.lifecycle_state == DRAFT"
          - "account.platform_tier is declared"
        side_effects:
          - "account.lifecycle_state := ACTIVE"
          - "creates one DisciplineAudit per discipline in {TRANSACTION, FACILITIES, PROJECT} with audit_state: SCHEDULED"
          - "recomputes account.governance_posture (NORMAL while no failed audit and zero open escalations)"
          - "increments account.version by 1"
      - from: ACTIVE
        to: OFFBOARDING
        trigger: "POST /api/accounts/{id}/transitions"
        actor: AccountExecutive
        preconditions:
          - "account.lifecycle_state == ACTIVE"
          - "account.governance_posture == NORMAL"
        side_effects:
          - "account.lifecycle_state := OFFBOARDING"
          - "creates AccountTransition rows carrying completion_pct_bps := 0"
          - "increments account.version by 1"
      - from: OFFBOARDING
        to: CLOSED_TERMINATED
        trigger: "POST /api/accounts/{id}/close"
        actor: AccountExecutive
        preconditions:
          - "account.lifecycle_state == OFFBOARDING"
          - "account.completion_pct_bps == 10000"
          - "no DisciplineAudit on this account is in audit_state FAILED with remediation_required == true"
          - "every TransitionTask on this account with task_type FINAL_RECONCILIATION has task_state DONE"
        side_effects:
          - "account.lifecycle_state := CLOSED_TERMINATED"
          - "every FacilitiesVendor on this account with vendor_state ACTIVE transitions to TERMINATED"
          - "every FacilitiesVendor.terminate transition sets each of the account's FacilitySite.vacancy_state := DISPOSED"
          - "closes the account's open AccountTransition rows"
          - "every DataLicense on this account transitions to REVOKED (closes the cascade)"
          - "increments account.version by 1"
      - from: OFFBOARDING
        to: CLOSED_CONVERTED
        trigger: "POST /api/accounts/{id}/close"
        actor: AccountExecutive
        preconditions:
          - "account.lifecycle_state == OFFBOARDING"
          - "account.completion_pct_bps == 10000"
          - "account.governance_posture != RESTRICTED"
        side_effects:
          - "account.lifecycle_state := CLOSED_CONVERTED"
          - "every DataLicense on this account transitions to REVOKED"
          - "increments account.version by 1"
        note: "Conversion is the compensating path against termination; both conserve fee_ledger_credit_cents and portfolio_leased_sqft."
      - from: OFFBOARDING
        to: ACTIVE
        trigger: "POST /api/accounts/{id}/abort-transition"
        actor: AccountExecutive
        preconditions:
          - "account.lifecycle_state == OFFBOARDING"
        side_effects:
          - "account.lifecycle_state := ACTIVE"
          - "cancels every non-terminal TransitionTask on this account (task_state := FAILED)"
          - "recomputes account.completion_pct_bps from remaining TransitionTask states"
          - "clears open AccountTransition rows"
          - "increments account.version by 1"
        note: "Reopens a live account after a transition abort; reachable from OFFBOARDING only."

  - entity: Lease
    initial_state: PIPELINE
    terminal_states: [EXECUTED, REJECTED]
    transitions:
      - from: PIPELINE
        to: APPROVAL_PENDING
        trigger: "POST /api/leases/{id}/submit-for-approval"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == PIPELINE"
        side_effects:
          - "lease.pipeline_state := APPROVAL_PENDING"
      - from: APPROVAL_PENDING
        to: BROKER_ASSIGNED
        trigger: "POST /api/leases/{id}/approve"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == APPROVAL_PENDING"
          - "the linked TransactionRequest.request_state == PENDING_APPROVAL"
        side_effects:
          - "lease.pipeline_state := BROKER_ASSIGNED"
          - "the linked TransactionRequest.request_state := APPROVED"
      - from: APPROVAL_PENDING
        to: REJECTED
        trigger: "POST /api/leases/{id}/reject"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == APPROVAL_PENDING"
        side_effects:
          - "lease.pipeline_state := REJECTED"
          - "the linked TransactionRequest.request_state := REJECTED"
      - from: REJECTED
        to: APPROVAL_PENDING
        trigger: "POST /api/leases/{id}/revise"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == REJECTED"
          - "lease.revision_count < 3"
        side_effects:
          - "lease.pipeline_state := APPROVAL_PENDING"
          - "lease.revision_count := lease.revision_count + 1"
        note: "Cyclic revision loop: REJECTED -> APPROVAL_PENDING is permitted at most 3 times before the lease becomes terminal."
      - from: BROKER_ASSIGNED
        to: IN_MARKET
        trigger: "POST /api/leases/{id}/launch-marketing"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == BROKER_ASSIGNED"
          - "a BrokerEngagement on this lease has engagement_state ASSIGNED"
        side_effects:
          - "lease.pipeline_state := IN_MARKET"
      - from: IN_MARKET
        to: NEGOTIATING
        trigger: "POST /api/leases/{id}/open-negotiation"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == IN_MARKET"
          - "the linked TransactionRequest has exactly one BrokerEngagement with licensed_in_market == true"
        side_effects:
          - "lease.pipeline_state := NEGOTIATING"
      - from: NEGOTIATING
        to: EXECUTED
        trigger: "POST /api/leases/{id}/execute"
        actor: TransactionManager
        preconditions:
          - "lease.pipeline_state == NEGOTIATING"
        side_effects:
          - "lease.pipeline_state := EXECUTED"
          - "the linked TransactionRequest.request_state := EXECUTED"
          - "computes the linked TransactionRequest.savings_final_cents by savings_realization_score (final variant)"
          - "creates a CommissionRecord with commission_source THIRD_PARTY, base_rent_cents := request.prior_rent_cents_per_year, commission_pct := request.third_party_commission_cents / request.prior_rent_cents_per_year, accrual_date := now"
          - "the new CommissionRecord posting recomputes PortfolioAccount.annual_net_fee_cents by commission_credit_nets_fee"
          - "increments PortfolioAccount.version by 1"

  - entity: TransactionRequest
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /api/transaction-requests/{id}/submit"
        actor: TransactionManager
        preconditions:
          - "request.request_state == DRAFT"
          - "the referenced PortfolioAccount.lifecycle_state == ACTIVE"
        side_effects:
          - "request.request_state := PENDING_APPROVAL"
          - "computes request.required_approval_level by approval_level_band"
          - "computes request.savings_provisional_cents by savings_realization_score (provisional variant)"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /api/transaction-requests/{id}/decide"
        actor: ApprovalAuthority
        preconditions:
          - "request.request_state == PENDING_APPROVAL"
          - "an AccountAssignment exists with account_id == request.account_id, assignment_role == APPROVAL_AUTHORITY and id == the X-User-ID supplied by the acting ApprovalAuthority"
          - "that AccountAssignment.approval_level is at least request.required_approval_level"
        side_effects:
          - "request.request_state := APPROVED"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /api/transaction-requests/{id}/decide"
        actor: ApprovalAuthority
        preconditions:
          - "request.request_state == PENDING_APPROVAL"
        side_effects:
          - "request.request_state := REJECTED"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /api/leases/{id}/execute"
        actor: TransactionManager
        preconditions:
          - "request.request_state == APPROVED"
          - "the lease referenced by request.lease_id has pipeline_state NEGOTIATING"
        side_effects:
          - "request.request_state := EXECUTED"
          - "computes request.savings_final_cents by savings_realization_score (final variant)"
          - "creates a CommissionRecord with commission_source THIRD_PARTY, base_rent_cents := request.prior_rent_cents_per_year, commission_pct := request.third_party_commission_cents / request.prior_rent_cents_per_year"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/transaction-requests/{id}/withdraw"
        actor: TransactionManager
        preconditions:
          - "request.request_state == DRAFT"
        side_effects:
          - "request.request_state := WITHDRAWN"
      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /api/transaction-requests/{id}/cancel"
        actor: TransactionManager
        preconditions:
          - "request.request_state == PENDING_APPROVAL"
          - "the referenced PortfolioAccount.lifecycle_state == OFFBOARDING"
        side_effects:
          - "request.request_state := CANCELLED"

  - entity: FacilitiesVendor
    initial_state: SOURCING
    terminal_states: [TERMINATED]
    transitions:
      - from: SOURCING
        to: ACTIVE
        trigger: "POST /api/facilities-vendors/{id}/activate"
        actor: FacilitiesManager
        preconditions:
          - "vendor.vendor_state == SOURCING"
          - "the referenced PortfolioAccount.lifecycle_state IN {ACTIVE, OFFBOARDING}"
        side_effects:
          - "vendor.vendor_state := ACTIVE"
          - "vendor.kpi_track := level_for_vendor (derived field reconciliation)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/facilities-vendors/{id}/suspend"
        actor: FacilitiesManager
        preconditions:
          - "vendor.vendor_state == ACTIVE"
          - "the referenced PortfolioAccount.governance_posture IN {ON_WATCH, RESTRICTED}"
        side_effects:
          - "vendor.vendor_state := SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/facilities-vendors/{id}/reinstate"
        actor: FacilitiesManager
        preconditions:
          - "vendor.vendor_state == SUSPENDED"
          - "the referenced PortfolioAccount.governance_posture == NORMAL"
        side_effects:
          - "vendor.vendor_state := ACTIVE"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/accounts/{id}/close"
        actor: system
        preconditions:
          - "vendor.vendor_state == ACTIVE"
          - "the referenced PortfolioAccount.lifecycle_state == CLOSED_TERMINATED"
        side_effects:
          - "vendor.vendor_state := TERMINATED"
          - "sets each FacilitySite on this account whose vendor_id == vendor.id to vacancy_state := DISPOSED"
        note: "Cascade hop 1 and hop 2 of the account-termination chain: close -> vendor.terminate -> site.DISPOSED."

  - entity: FacilitySite
    initial_state: OCCUPIED
    terminal_states: [DISPOSED]
    transitions:
      - from: OCCUPIED
        to: VACATED
        trigger: "POST /api/facilities-sites/{id}/vacate"
        actor: FacilitiesManager
        preconditions:
          - "site.vacancy_state == OCCUPIED"
        side_effects:
          - "site.vacancy_state := VACATED"
      - from: VACATED
        to: CONSOLIDATING
        trigger: "POST /api/facilities-sites/{id}/consolidate"
        actor: FacilitiesManager
        preconditions:
          - "site.vacancy_state == VACATED"
          - "the referenced PortfolioAccount.governance_posture IN {NORMAL, ON_WATCH}"
          - "site.consolidation_project_id references a ConsolidationProject with project_state == APPROVED"
        side_effects:
          - "site.vacancy_state := CONSOLIDATING"
          - "increments the referenced AccountFeeAccrual.applied_credit_cents by the site's consolidation credit"
          - "recomputes the referenced PortfolioAccount.annual_net_fee_cents by commission_credit_nets_fee"
      - from: CONSOLIDATING
        to: DISPOSED
        trigger: "POST /api/facilities-sites/{id}/dispose"
        actor: FacilitiesManager
        preconditions:
          - "site.vacancy_state == CONSOLIDATING"
          - "the referenced PortfolioAccount.lifecycle_state IN {ACTIVE, OFFBOARDING}"
        side_effects:
          - "site.vacancy_state := DISPOSED"
          - "recomputes PortfolioAccount.portfolio_leased_sqft"
          - "every DataLicense on the account whose data_scope is LINE_ITEM transitions to REVOKED (this is the hop that closes the account-termination cascade)"

  - entity: ConsolidationProject
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_REVIEW
        trigger: "POST /api/consolidation-projects/{id}/submit"
        actor: OccupancyPlanner
        preconditions:
          - "project.project_state == PLANNED"
          - "the referenced PortfolioAccount.lifecycle_state == ACTIVE"
        side_effects:
          - "project.project_state := IN_REVIEW"
          - "computes project.savings_estimate_cents by consolidation_savings_estimate (provisional)"
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /api/consolidation-projects/{id}/approve"
        actor: ApprovalAuthority
        preconditions:
          - "project.project_state == IN_REVIEW"
          - "an AccountAssignment exists with account_id == project.account_id, assignment_role == APPROVAL_AUTHORITY and id == the X-User-ID supplied by the acting ApprovalAuthority"
        side_effects:
          - "project.project_state := APPROVED"
          - "sets project.approved_sqft_reduction := project.planned_sqft_reduction"
          - "recomputes project.savings_estimate_cents by consolidation_savings_estimate (provisional)"
      - from: IN_REVIEW
        to: PLANNED
        trigger: "POST /api/consolidation-projects/{id}/return-to-planning"
        actor: OccupancyPlanner
        preconditions:
          - "project.project_state == IN_REVIEW"
        side_effects:
          - "project.project_state := PLANNED"
          - "project.savings_estimate_cents := 0"
        note: "Cyclic replan loop: IN_REVIEW returns to PLANNED, a different state from the one it left, at most the transitions allow; the fork at IN_REVIEW is {APPROVED, PLANNED}."
      - from: APPROVED
        to: IN_EXECUTION
        trigger: "POST /api/consolidation-projects/{id}/start-execution"
        actor: OccupancyPlanner
        preconditions:
          - "project.project_state == APPROVED"
          - "every FacilitySite assigned to this project has vacancy_state IN {CONSOLIDATING, DISPOSED}"
          - "sum of assigned sites' sqft_reduction == project.approved_sqft_reduction"
        side_effects:
          - "project.project_state := IN_EXECUTION"
          - "computes project.savings_finalized_cents by consolidation_savings_estimate (final)"
          - "sets each assigned FacilitySite.vacancy_state := DISPOSED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/consolidation-projects/{id}/cancel"
        actor: OccupancyPlanner
        preconditions:
          - "project.project_state IN {PLANNED, IN_REVIEW}"
        side_effects:
          - "project.project_state := CANCELLED"
          - "recomputes project.savings_estimate_cents := 0"

  - entity: Scorecard
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/scorecards/{id}/publish"
        actor: GovernanceManager
        preconditions:
          - "scorecard.scorecard_state == DRAFT"
          - "the referenced PortfolioAccount.lifecycle_state IN {ACTIVE, OFFBOARDING}"
        side_effects:
          - "scorecard.scorecard_state := PUBLISHED"
          - "computes scorecard.composite_bps by weighted_scorecard_composite"
          - "recomputes the account's SLA_BPS-tagged ServiceLevelKpi.actual_value := scorecard.composite_bps"
          - "the KPI recompute sets ServiceLevelKpi.evaluation_state := EVALUATED"
          - "the KPI recompute computes ServiceLevelKpi.penalty_cents by kpi_net_adjustment (penalty leg)"
          - "the KPI recompute recomputes PortfolioAccount.annual_net_fee_cents by commission_credit_nets_fee"
          - "increments PortfolioAccount.version by 1"

  - entity: DisciplineAudit
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_REVIEW
        trigger: "POST /api/discipline-audits/{id}/start"
        actor: GovernanceManager
        preconditions:
          - "audit.audit_state == SCHEDULED"
          - "the referenced PortfolioAccount.lifecycle_state == ACTIVE"
        side_effects:
          - "audit.audit_state := IN_REVIEW"
      - from: IN_REVIEW
        to: PASSED
        trigger: "POST /api/discipline-audits/{id}/decide"
        actor: GovernanceManager
        preconditions:
          - "audit.audit_state == IN_REVIEW"
        side_effects:
          - "audit.audit_state := PASSED"
          - "audit.remediation_required := false"
          - "recomputes PortfolioAccount.governance_posture by governance_posture_rollup"
          - "increments PortfolioAccount.version by 1"
      - from: IN_REVIEW
        to: FAILED
        trigger: "POST /api/discipline-audits/{id}/decide"
        actor: GovernanceManager
        preconditions:
          - "audit.audit_state == IN_REVIEW"
        side_effects:
          - "audit.audit_state := FAILED"
          - "audit.remediation_required := true"
          - "audit.cooling_off_until := now + 72 hours"
          - "recomputes PortfolioAccount.governance_posture by governance_posture_rollup (RESTRICTED when the count of FAILED, remediation_required audits >= 2)"
          - "increments PortfolioAccount.version by 1"

  - entity: DataLicense
    initial_state: REQUESTED
    terminal_states: [GRANTED, REJECTED, REVOKED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /api/data-licenses/{id}/grant"
        actor: DataSteward
        preconditions:
          - "license.license_state == REQUESTED"
          - "the referenced PortfolioAccount.client_data_rights != BROKER_OWNED"
        side_effects:
          - "license.license_state := GRANTED"
          - "license.requires_written_client_consent := data_license_consent_required (recomputed against the account's current platform_tier)"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/data-licenses/{id}/reject"
        actor: DataSteward
        preconditions:
          - "license.license_state == REQUESTED"
        side_effects:
          - "license.license_state := REJECTED"
      - from: GRANTED
        to: REVOKED
        trigger: "system event from FacilitySite DISPOSED, or POST /api/accounts/{id}/close-converted"
        actor: system
        preconditions:
          - "license.license_state == GRANTED"
          - "a FacilitySite on the referenced account has reached vacancy_state DISPOSED, or the account lifecycle_state is CLOSED_CONVERTED"
        side_effects:
          - "license.license_state := REVOKED"
        note: "Cascade hop 3 — reachable only after the account-close hop, which is itself preceded by the vendor-terminate and site-DISPOSE hops."

  - entity: TransitionTask
    initial_state: PENDING
    terminal_states: [DONE, FAILED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /api/transition-tasks/{id}/start"
        actor: TransitionManager
        preconditions:
          - "task.task_state == PENDING"
          - "the referenced PortfolioAccount.lifecycle_state == OFFBOARDING"
          - "task.due_at is strictly after the account clock's current instant (a task whose due_at <= clock is overdue and cannot be started)"
        side_effects:
          - "task.task_state := IN_PROGRESS"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /api/transition-tasks/{id}/complete"
        actor: TransitionManager
        preconditions:
          - "task.task_state == IN_PROGRESS"
          - "the referenced PortfolioAccount.lifecycle_state == OFFBOARDING"
        side_effects:
          - "task.task_state := DONE"
          - "recomputes PortfolioAccount.completion_pct_bps"
          - "increments PortfolioAccount.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /api/transition-tasks/{id}/fail"
        actor: TransitionManager
        preconditions:
          - "task.task_state == IN_PROGRESS"
          - "the referenced PortfolioAccount.lifecycle_state == OFFBOARDING"
        side_effects:
          - "task.task_state := FAILED"
          - "recomputes PortfolioAccount.completion_pct_bps"
          - "increments PortfolioAccount.version by 1"

  - entity: BrokerEngagement
    initial_state: PENDING
    terminal_states: [EXECUTED, TERMINATED]
    transitions:
      - from: PENDING
        to: ASSIGNED
        trigger: "POST /api/broker-engagements/{id}/assign"
        actor: TransactionManager
        preconditions:
          - "engagement.engagement_state == PENDING"
          - "engagement.licensed_in_market == true"
        side_effects:
          - "engagement_state := ASSIGNED"
      - from: ASSIGNED
        to: EXECUTED
        trigger: "POST /api/broker-engagements/{id}/execute"
        actor: TransactionManager
        preconditions:
          - "engagement.engagement_state == ASSIGNED"
          - "the linked TransactionRequest.request_state == APPROVED"
        side_effects:
          - "engagement_state := EXECUTED"
          - "computes deal_commission_cents, broker_share_cents and account_share_cents by broker_commission_split"
          - "the linked TransactionRequest.request_state := EXECUTED"
      - from: PENDING
        to: TERMINATED
        trigger: "POST /api/broker-engagements/{id}/terminate"
        actor: TransactionManager
        preconditions:
          - "engagement.engagement_state == PENDING"
        side_effects:
          - "engagement_state := TERMINATED"
      - from: ASSIGNED
        to: TERMINATED
        trigger: "POST /api/broker-engagements/{id}/terminate"
        actor: TransactionManager
        preconditions:
          - "engagement.engagement_state == ASSIGNED"
        side_effects:
          - "engagement_state := TERMINATED"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /api/broker-engagements/{id}/terminate"
        actor: TransactionManager
        preconditions:
          - "engagement.engagement_state == EXECUTED"
        side_effects:
          - "engagement_state := TERMINATED"
          - "sets engagement.broker_share_cents := 0 and engagement.account_share_cents := 0, restoring PortfolioAccount.broker_pool_allocated_cents to its pre-execution value"

  - entity: AccountFeeAccrual
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CREDITED
        trigger: "POST /api/lease-executions/{id}/apply"
        actor: TransactionManager
        preconditions:
          - "accrual.credit_application_state == OPEN"
          - "at least one CommissionRecord on this account exists with credited == false"
        side_effects:
          - "accrual.credit_application_state := CREDITED"
          - "accrual.applied_credit_cents := sum of uncredited CommissionRecord.credit_amount_cents applied per commission_credit_nets_fee"
          - "the consumed CommissionRecord.credited := true"
          - "recomputes PortfolioAccount.annual_net_fee_cents by commission_credit_nets_fee"
      - from: CREDITED
        to: SETTLED
        trigger: "POST /api/fee-accruals/{id}/settle"
        actor: AccountExecutive
        preconditions:
          - "accrual.credit_application_state == CREDITED"
        side_effects:
          - "accrual.credit_application_state := SETTLED"
          - "accrual.settled_at := now"

# =============================================================================
# §1.2.1 Concurrency Rules (true races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: lease-revision-stale-account
    parent_entity: PortfolioAccount
    write_endpoint: "POST /api/leases/{id}/revise"
    occ_field: "expected_account_version"
    description: |
      Revising a REJECTED Lease against a PortfolioAccount whose version has
      advanced since the client last observed it is rejected, because the
      revision re-opens the transaction approval context on the account and
      must be priced against the account state the client actually saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: kpi-recompute-stale-account
    parent_entity: PortfolioAccount
    write_endpoint: "POST /api/audit-reviews"
    occ_field: "expected_account_version"
    description: |
      Publishing a Scorecard against a PortfolioAccount whose version has
      advanced since the client last observed it is rejected, because the
      publication recomputes the account's penalty and fee accrual fields and
      must be anchored to the account state the client actually saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: commission_credit_nets_fee
    trigger: "Account update, CommissionRecord posting, AccountFeeAccrual credit application, KPI recompute"
    algorithm: constraint_propagation
    formula: |
      For the named PortfolioAccount:
        TIER_RATE_CENTS_PER_SQFT = 145 if portfolio_sqft <= 250000
                                  118 if portfolio_sqft <= 750000
                                  96  otherwise
        gross_fee = TIER_RATE_CENTS_PER_SQFT * portfolio_sqft
        For each CommissionRecord R on the account, ordered by accrual_date ASC, then created_at ASC:
          raw_R = base_rent_cents * commission_pct
          round_work_R = round_half_up(raw_R, 2)
          due_R = max(round_work_R, COMMISSION_CREDIT_FLOOR_CENTS)
        total_credit = sum of due_R over all ordered records
        self_perform_credit = sum of due_R over records with commission_source == SELF_PERFORM
        third_party_credit = sum of due_R over records with commission_source == THIRD_PARTY
        applied_credit = min(total_credit, gross_fee + self_perform_credit)
        annual_net_fee_cents = gross_fee - third_party_credit
      Evaluation order is pinned: TIER_RATE_CENTS_PER_SQFT is selected from portfolio_sqft BEFORE any
      credit is applied; credits are rounded per record and summed AFTER the tier selection; the
      SELF_PERFORM floor-lift is added to the cap but never subtracted from the fee.
    input_set: "All CommissionRecord rows on the account; records are ordered by accrual_date ASC then created_at ASC for the running sum."
    constants:
      TIER_RATE_LOW_CENTS: 145
      TIER_RATE_MID_CENTS: 118
      TIER_RATE_HIGH_CENTS: 96
      TIER_LOW_MAX_SQFT: 250000
      TIER_MID_MAX_SQFT: 750000
      COMMISSION_CREDIT_FLOOR_CENTS: 10000
      ADJUSTMENT_CAP_MULTIPLIER: 2
    precision: "2 decimal places, round_half_up applied per record before summation"
    variants:
      - name: per_record_then_sum
        when: "Default and only sanctioned order; each record's commission is rounded to 2dp before summation."
        difference: "Produces a different cent total than rounding the summed raw commission; the scaffold pins this order."
      - name: fee_floor_lift
        when: "When at least one SELF_PERFORM record exists, its credit raises the applied-credit cap by its own amount."
        difference: "Third-party credits are additionally bounded by (gross_fee + self_perform_credit), not by gross_fee alone."

  - name: savings_realization_score
    trigger: "TransactionRequest submit (provisional) and lease execute (final)"
    algorithm: forward_looking
    formula: |
      MARKET_BENCHMARK_CENTS_PER_SQFT = 1750
      Term window: [lease_start_date, lease_start_date + requested_term_months months], start inclusive, end exclusive.
      Existing leases considered = every Lease L on the same account_id with the same market_code and
        L.lease_end_date strictly greater than the window start.
      benchmark_annual = MARKET_BENCHMARK_CENTS_PER_SQFT * leased_sqft
      provisional_variant:
        savings = max(0, prior_rent_cents_per_year - benchmark_annual) * requested_term_months / 12
      final_variant:
        savings = (prior_rent_cents_per_year - proposed_rent_cents_per_year) * requested_term_months / 12
      Ordering for chained requests: when more than one TransactionRequest exists on the same lease,
      only the request with the greatest created_at ASC-first eligibility (earliest created_at; ties broken
      by lease_id ASC) contributes to the benchmark window.
    input_set: "Existing Lease rows with the same account_id and market_code and lease_end_date > window start; CommissionRecord excluded."
    constants:
      MARKET_BENCHMARK_CENTS_PER_SQFT: 1750
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional
        when: "Computed at TransactionRequest submit; uses the market benchmark rate, not the proposed rent."
        difference: "Ignores proposed_rent_cents_per_year entirely."
      - name: final
        when: "Computed at lease execute; uses the executed proposed rent."
        difference: "Ignores the market benchmark rate; diverges from the provisional value by (benchmark_annual - proposed_rent) * term/12."

  - name: kpi_net_adjustment
    trigger: "Scorecard publish, KPI recompute on clock advance"
    algorithm: threshold
    formula: |
      Composite rule, evaluated in this pinned order:
        1. branch on kpi_family:
           SERVICE_LEVEL: SHORTFALL_BASE_CENTS = 3000000, threshold T = target_value (BPS)
           SAVINGS:        SHORTFALL_BASE_CENTS = 2000000, threshold T = target_value (CENTS)
        2. if actual_value >= T:
             shortfall_component = 0
           else:
             shortfall_component = round_half_up(SHORTFALL_BASE_CENTS * (T - actual_value) / 10000, 2)
        3. if actual_value >= T:
             gainshare_cents = round_half_up((actual_value - T) * GAINSHARE_RATE_BPS / 10000, 2)
           else:
             gainshare_cents = 0
        4. penalty_cents = shortfall_component
        5. net_adjustment_cents = gainshare_cents - penalty_cents
      The threshold comparison is >= on both legs; equality yields zero shortfall and zero gainshare.
    input_set: "One ServiceLevelKpi row; only rows with evaluation_state IN {EVALUATED, ESCALATED} participate."
    constants:
      SERVICE_LEVEL_SHORTFALL_BASE_CENTS: 3000000
      SAVINGS_SHORTFALL_BASE_CENTS: 2000000
      GAINSHARE_RATE_BPS: 2500
    precision: "2 decimal places, round_half_up"
    variants:
      - name: gainshare_leg
        when: "actual_value >= target_value."
        difference: "gainshare is non-zero and penalty is zero."
      - name: penalty_leg
        when: "actual_value < target_value."
        difference: "penalty is non-zero and gainshare is zero; the divergence is the sign of (actual - target)."

  - name: weighted_scorecard_composite
    trigger: "Scorecard publish"
    algorithm: weighted_scoring
    formula: |
      if account.platform_tier IN {COMPLETE, ENTERPRISE}:
        W_Q = 6000, W_R = 4000
      else:
        W_Q = 5000, W_R = 5000
      weighted_numerator = quality_bps * W_Q + response_bps * W_R
      raw = weighted_numerator / 10000
      composite_raw = round_half_up(raw, 2)
      composite_bps = min(10000, max(0, composite_raw))
      scorecard.composite_bps is an integer field: the stored value is floor(composite_bps).
    input_set: "One Scorecard row; weight selection reads the parent PortfolioAccount.platform_tier."
    constants:
      W_QUALITY_COMPLETE: 6000
      W_RESPONSE_COMPLETE: 4000
      W_QUALITY_BASIC: 5000
      W_RESPONSE_BASIC: 5000
      COMPOSITE_CEILING_BPS: 10000
    precision: "2 decimal places, round_half_up, then floor to integer basis points"
    variants:
      - name: weight_shifted_for_tier
        when: "portfolio.platform_tier IN {COMPLETE, ENTERPRISE}."
        difference: "Quality weight rises to 6000 and response weight falls to 4000; the same quality/response pair scores differently than under the BASIC weighting."
      - name: capped_composite
        when: "weighted_numerator / 10000 exceeds 10000 after rounding."
        difference: "composite_bps is clamped to 10000, so quality/response pairs that both exceed 10000 no longer separate."

  - name: consolidation_savings_estimate
    trigger: "ConsolidationProject submit, approve, and start-execution"
    algorithm: interval_merge
    formula: |
      COST_INFLATION_CAP = 1.10
      Sites considered = FacilitySite rows with consolidation_project_id == project.id,
        ordered by created_at ASC (ascending), ties broken by site_name ASC.
      For the i-th site in that order (0-indexed):
        site_area_i = per_site_sqft_reductions[i]
        raw_i = site_area_i * per_site_rates[i]
        round_work_i = round_half_up(raw_i, 2)
      round_then_sum = sum of round_work_i
      sum_then_round = round_half_up( sum of raw_i , 2)
      effective_factor = min(cost_inflation_factor, COST_INFLATION_CAP)
      provisional_variant:
        savings_estimate_cents = round_half_up(round_then_sum * effective_factor, 2)
      final_variant:
        savings_finalized_cents = round_half_up(sum_then_round * effective_factor, 2)
      The two variants diverge by exactly one cent for site sets whose per-site products land on
      a half-cent, which is why the rounding order is pinned: provisional rounds per site, final sums raw first.
    input_set: "FacilitySite rows with consolidation_project_id == project.id and vacancy_state IN {OCCUPIED, VACATED, CONSOLIDATING, DISPOSED}; excluded sites carry sqft_reduction 0."
    constants:
      COST_INFLATION_CAP: 1.10
    precision: "2 decimal places, round_half_up; order pinned per variant"
    variants:
      - name: provisional
        when: "Computed on submit and approve; rounds each site's product to 2dp before summation."
        difference: "round_then_sum is one cent larger than sum_then_round when per-site products land on half-cents."
      - name: final
        when: "Computed on start-execution; sums raw per-site products first, then rounds once."
        difference: "Diverges from provisional by the accumulated per-site rounding remainder."

  - name: broker_commission_split
    trigger: "BrokerEngagement execute"
    algorithm: watermark_allocation
    formula: |
      Conversion: the transaction request's third_party_commission_cents is consumed exactly once.
        deal_commission_cents = min(transaction_request.third_party_commission_cents, PRIOR_BASE_LIMIT_BPS * transaction_request.prior_rent_cents_per_year / 10000)
        remaining = broker_share_cents + account_share_cents
        if broker_class == SENIOR:
          broker_amount_raw = 6000 * deal_commission_cents / 10000
        else:
          broker_amount_raw = 4500 * deal_commission_cents / 10000
        account_amount_raw = deal_commission_cents - broker_amount_raw
        broker_share_cents = floor_to_cent(broker_amount_raw)
        account_share_cents = deal_commission_cents - broker_share_cents
      Conservation invariant: broker_share_cents + account_share_cents == deal_commission_cents exactly;
      the account absorbs the rounding remainder so no cent is created or destroyed.
    input_set: "One BrokerEngagement plus its linked TransactionRequest."
    constants:
      SENIOR_BROKER_SHARE_BPS: 6000
      STANDARD_BROKER_SHARE_BPS: 4500
      PRIOR_BASE_LIMIT_BPS: 300
    precision: "2 decimal places; broker share rounded down (floor), account absorbs the remainder"

  - name: approval_level_band
    trigger: "TransactionRequest submit"
    algorithm: threshold
    formula: |
      if prior_rent_cents_per_year < 25000000: level = MANAGER
      elif prior_rent_cents_per_year < 75000000: level = DIRECTOR
      else: level = ACCOUNT_EXECUTIVE
      The comparisons are strict at 25000000 and 75000000 cents-per-year.
    input_set: "One TransactionRequest row; reads prior_rent_cents_per_year only."
    constants:
      LEVEL_MANAGER_MAX_CENTS: 25000000
      LEVEL_DIRECTOR_MAX_CENTS: 75000000
    precision: "enum; no rounding"

  - name: governance_posture_rollup
    trigger: "DisciplineAudit decide, ServiceLevelKpi evaluation_state change, TransitionTask completion"
    algorithm: aggregation
    formula: |
      failed_remediation = count of DisciplineAudit rows on the account with audit_state == FAILED and remediation_required == true
      open_escalations = count of ServiceLevelKpi rows on the account with escalation_status == OPEN
      if failed_remediation >= 2: posture = RESTRICTED
      elif failed_remediation == 1 or open_escalations >= 1: posture = ON_WATCH
      else: posture = NORMAL
      account.open_escalation_count := open_escalations
    input_set: "DisciplineAudit rows (FAILED + remediation_required) and ServiceLevelKpi rows (escalation_status OPEN) on the account; ties impossible because the result is a count."
    constants:
      RESTRICTED_FAILED_THRESHOLD: 2
      WATCH_ESCALATION_THRESHOLD: 1
    precision: "integer counts; no rounding"

  - name: account_lifecycle_gate
    trigger: "Every PortfolioAccount state transition and every gated child operation"
    algorithm: threshold
    formula: |
      Read account.lifecycle_state, which holds exactly one of {DRAFT, ACTIVE, OFFBOARDING, CLOSED_CONVERTED, CLOSED_TERMINATED}.
      gate_matrix:
        DRAFT:              children may be created; only POST /api/accounts/{id}/activate may mutate lifecycle_state
        ACTIVE:             all child mutations permitted
        OFFBOARDING:        Lease/TransactionRequest creation blocked; transition tasks permitted
        CLOSED_CONVERTED:   all child mutations blocked except reads
        CLOSED_TERMINATED:  all child mutations blocked except reads
      lifecycle_state is the single stored trigger field; governance_posture is NOT consulted by this gate.
      The comparison for closure is account.completion_pct_bps == 10000 exactly (not >=).
    input_set: "One PortfolioAccount row; its lifecycle_state and completion_pct_bps fields."
    constants:
      COMPLETION_COMPLETE_BPS: 10000
    precision: "integer basis points"

  - name: transition_completion_score
    trigger: "TransitionTask complete or fail"
    algorithm: aggregation
    formula: |
      eligible = count of TransitionTask rows on the account with task_state IN {PENDING, IN_PROGRESS, DONE, FAILED}
      progressed = count of TransitionTask rows on the account with task_state IN {DONE, FAILED}
      if eligible == 0:
        completion_pct_bps = 0
      else:
        completion_pct_bps = floor( progressed * 10000 / eligible )
      Note the floor: 1 of 3 tasks done yields 3333 bps, never 3334, and completion reaches exactly 10000 only when every task is terminal.
    input_set: "TransitionTask rows on the account; a task enters the eligible set the moment it is created and never leaves."
    constants:
      COMPLETION_COMPLETE_BPS: 10000
    precision: "integer basis points; floor (round down)"

  - name: data_license_consent_required
    trigger: "DataLicense grant, and PortfolioAccount platform_tier change"
    algorithm: threshold
    formula: |
      requires_written_client_consent =
        (account.client_data_rights == CLIENT_OWNED_EXCLUSIVE) AND (data_scope == LINE_ITEM)
      where account.client_data_rights is itself derived:
        BASIC      -> BROKER_OWNED
        COMPLETE   -> CLIENT_OWNED_SHARED
        ENTERPRISE -> CLIENT_OWNED_EXCLUSIVE
      The licence freezes only a snapshot field, platform_tier_at_issue; consent is evaluated against the
      account's CURRENT client_data_rights, so a tier change after request flips the requirement.
    input_set: "One DataLicense row and its referenced PortfolioAccount row."
    constants:
      LINE_ITEM_REQUIRES_CONSENT: true
    precision: "boolean"

  - name: level_for_vendor
    trigger: "FacilitiesVendor activate, FacilitySite vacancy change, and vendor delivery_model change"
    algorithm: conditional_gating
    formula: |
      base = LEVEL_A if delivery_model == SELF_PERFORM else LEVEL_B
      if sourcing_program == DIVERSITY and count of FacilitySite rows on the account with
         vacancy_state == OCCUPIED and vendor_id == vendor.id >= 1:
        base = LEVEL_C
      kpi_track := base
      The derived field is overridden by the site-count branch only when both conditions hold;
      sourcing_program == NATIONAL never raises the track above base.
    input_set: "One FacilitiesVendor row plus the count of OCCUPIED FacilitySite rows assigned to it."
    constants:
      LEVEL_C_MIN_OCCUPIED_SITES: 1
    precision: "enum; no rounding"

  - name: escalation_threshold_check
    trigger: "KPI recompute on clock advance; reset when the originating ServiceLevelKpi reaches DONE-equivalent evaluation"
    algorithm: threshold
    formula: |
      if measurement_unit == BPS and actual_value < target_value - 500:
        kpi.escalation_status := OPEN
      elif measurement_unit == CENTS and actual_value < target_value - 500000:
        kpi.escalation_status := OPEN
      else:
        kpi.escalation_status := NONE
      The boundary is strict: a BPS shortfall of exactly 500 bps does NOT open an escalation, and a
      CENTS shortfall of exactly 500000 cents does NOT open an escalation. The count of OPEN rows is
      an input to governance_posture_rollup, so a boundary flip changes the account posture.
    input_set: "One ServiceLevelKpi row with evaluation_state IN {EVALUATED, ESCALATED}."
    constants:
      BPS_ESCALATION_MARGIN: 500
      CENTS_ESCALATION_MARGIN: 500000
    precision: "integer comparisons"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and equal to one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is authorised for the endpoint being called"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for every operation that mutates a resource carrying account_id, the acting entity is operationally assigned to that account through the AccountAssignment resource"
    error_id: ERR_NOT_ASSIGNED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every path id and every FK id in the body resolves to a persisted resource; validated left-to-right along the path"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "the parent PortfolioAccount.lifecycle_state permits child creation and mutation per account_lifecycle_gate"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /api/leases", "POST /api/transaction-requests", "POST /api/scorecards", "POST /api/broker-engagements", "POST /api/facility-sites", "POST /api/facilities-vendors", "POST /api/service-level-kpis", "POST /api/consolidation-projects", "POST /api/discipline-audits", "POST /api/audit-reviews"]
  - priority: 7
    category: state
    check: "closing an account whose lifecycle_state is CLOSED_CONVERTED or CLOSED_TERMINATED, or using a child operation on a terminal account, is rejected before any other business check"
    error_id: ERR_ACCOUNT_CLOSED
    http_status: 409
    applies_to: ["POST /api/accounts/{id}/close", "POST /api/leases", "POST /api/transaction-requests", "POST /api/data-licenses"]
  - priority: 8
    category: state
    check: "a transition whose declared precondition depends on a sibling or child entity (broker engagement not ASSIGNED; no licensed broker on the request; assigned sites not yet CONSOLIDATING) fails before any business check"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /api/leases/{id}/launch-marketing", "POST /api/leases/{id}/open-negotiation", "POST /api/consolidation-projects/{id}/start-execution"]
  - priority: 9
    category: business_safety
    check: "a broker engagement is rejected when the broker supplied is not licensed_in_market for the market it will trade in, and a broker engagement whose market_code differs from its transaction request's lease market is rejected as a market mismatch"
    error_id: ERR_BROKER_NOT_LICENSED
    http_status: 422
    applies_to: ["POST /api/broker-engagements/{id}/assign"]
  - priority: 10
    category: business_safety
    check: "an account-closure or transition request is rejected while a DisciplineAudit with audit_state FAILED and remediation_required == true is unresolved"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: ["POST /api/accounts/{id}/close", "POST /api/accounts/{id}/transitions", "POST /api/facilities-vendors/{id}/activate", "POST /api/data-licenses/{id}/grant"]
  - priority: 11
    category: business_constraint
    check: "creating a DataLicense that would be GRANTED but requires_written_client_consent == true is rejected until explicit consent is recorded"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: ["POST /api/data-licenses/{id}/grant"]
  - priority: 12
    category: business_temporal
    check: "a lease whose lease_end_date is already in the past relative to the account clock cannot be submitted for approval; lease_end_date must be strictly after the clock's current instant"
    error_id: ERR_LEASE_EXPIRED
    http_status: 422
    applies_to: ["POST /api/leases/{id}/submit-for-approval"]
  - priority: 13
    category: business_referential
    check: "a CommissionRecord whose base_rent_cents exceeds the account's gross fee base is rejected as uncreditable"
    error_id: ERR_COMMISSION_EXCEEDS_FEE
    http_status: 422
    applies_to: ["POST /api/commission-records"]
  - priority: 14
    category: business_referential
    check: "a FacilitySite whose sqft exceeds the remaining leasable area of its account (portfolio_sqft minus the sum of existing sites' sqft) is rejected"
    error_id: ERR_SITE_EXCEEDS_PORTFOLIO
    http_status: 422
    applies_to: ["POST /api/facility-sites"]
  - priority: 15
    category: business_fiscal
    check: "a consolidation project's planned_sqft_reduction must equal the sum of the sqft_reduction of its assigned sites"
    error_id: ERR_SQFT_MISMATCH
    http_status: 422
    applies_to: ["POST /api/consolidation-projects/{id}/start-execution"]
  - priority: 16
    category: business_fiscal
    check: "an approval decision whose actor level is below the request's required_approval_level is rejected"
    error_id: ERR_APPROVAL_LEVEL_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /api/transaction-requests/{id}/decide"]
  - priority: 17
    category: business_temporal
    check: "a transition is rejected while a FAILED DisciplineAudit's cooling_off_until is still after the account clock's current instant"
    error_id: ERR_COOLING_OFF_ACTIVE
    http_status: 422
    applies_to: ["POST /api/accounts/{id}/close", "POST /api/accounts/{id}/close-converted", "POST /api/accounts/{id}/transitions", "POST /api/transaction-requests/{id}/decide", "POST /api/consolidation-projects/{id}/start-execution"]
  - priority: 18
    category: business_temporal
    check: "a transition is rejected when the target Lease is overdue and still non-terminal while an expired Lease already exists on the same account and market_code"
    error_id: ERR_LEASE_OVERDUE
    http_status: 422
    applies_to: ["POST /api/transaction-requests/{id}/submit", "POST /api/leases/{id}/submit-for-approval"]
  - priority: 19
    category: state
    check: "a request is missing a required body field or carries a field of the wrong type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 20
    category: state
    check: "offboarding, lease creation or transaction-request creation is attempted while the account is already OFFBOARDING"
    error_id: ERR_OFFBOARDING_PENDING
    http_status: 409
    applies_to: ["POST /api/accounts/{id}/transitions", "POST /api/leases", "POST /api/transaction-requests"]
  - priority: 21
    category: state
    check: "abort-transition is requested while the account is not OFFBOARDING, or a gated child transition is requested before its declared cross-entity precondition holds"
    error_id: ERR_NOT_TRANSITIONING
    http_status: 409
    applies_to: ["POST /api/accounts/{id}/abort-transition", "POST /api/leases/{id}/launch-marketing"]
  - priority: 22
    category: state
    check: "a lease revision is requested once revision_count has reached 3"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /api/leases/{id}/revise"]
  - priority: 23
    category: state
    check: "a credit application is requested against a fee accrual whose credit_application_state is not OPEN"
    error_id: ERR_FEE_ACCRUAL_LOCKED
    http_status: 409
    applies_to: ["POST /api/lease-executions/{id}/apply"]
  - priority: 24
    category: business_temporal
    check: "the logical clock is set to an instant that is not strictly after its current value"
    error_id: ERR_CLOCK_ALREADY_ADVANCED
    http_status: 409
    applies_to: ["POST /api/_clock/set_current_utc"]
  - priority: 25
    category: business_referential
    check: "a broker engagement's market_code differs from the market_code of the lease on its transaction request"
    error_id: ERR_MARKET_MISMATCH
    http_status: 422
    applies_to: ["POST /api/broker-engagements"]
  - priority: 26
    category: business_referential
    check: "a new lease on the same account and property address starts before the prior lease on that address ends, or within the 30-day premises cooldown after it ends, or a site consolidation interval overlaps a committed consolidation interval on the same account"
    error_id: ERR_LEASE_OVERLAP
    http_status: 422
    applies_to: ["POST /api/leases", "POST /api/facility-sites/{id}/consolidate"]
  - priority: 28
    category: business_fiscal
    check: "account closure is requested before completion_pct_bps has reached 10000"
    error_id: ERR_TRANSITION_INCOMPLETE
    http_status: 422
    applies_to: ["POST /api/accounts/{id}/close", "POST /api/accounts/{id}/close-converted"]
  - priority: 29
    category: business_fiscal
    check: "offboarding is requested while a blocking TransitionTask is not DONE"
    error_id: ERR_BLOCKING_TASK_OPEN
    http_status: 422
    applies_to: ["POST /api/accounts/{id}/close", "POST /api/accounts/{id}/close-converted"]
  - priority: 30
    category: business_temporal
    check: "a site consolidation interval [window_start, window_end) overlaps a consolidation interval already committed on the same account under half-open interval semantics"
    error_id: ERR_SITE_OVERLAP
    http_status: 422
    applies_to: ["POST /api/facility-sites/{id}/consolidate"]
  - priority: 31
    category: business_temporal
    check: "an OCC write whose expected_account_version differs from the parent PortfolioAccount.version at write time"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /api/leases/{id}/revise", "POST /api/audit-reviews"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/api/accounts"
    description: "Create a PortfolioAccount in DRAFT."
    roles: [AccountExecutive]
    code: 201
    input: [account_name, client_name, portfolio_sqft, platform_tier]
    output: PortfolioAccount
    side_effects: ["sets lifecycle_state := DRAFT", "sets client_data_rights from platform_tier via data_license_consent_required", "sets governance_posture := NORMAL"]
  - method: GET
    path: "/api/accounts"
    description: "List accounts with pagination."
    roles: [AccountExecutive, TransactionManager, ApprovalAuthority, FacilitiesManager, OccupancyPlanner, GovernanceManager, DataSteward, TransitionManager]
    code: 200
