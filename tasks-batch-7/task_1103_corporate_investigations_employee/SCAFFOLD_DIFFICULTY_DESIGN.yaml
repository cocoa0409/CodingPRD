            - { call: "POST /api/interviews/${int_id}/transition", payload: { to_status: COMPLETED, completion_note: "memo" }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: FINDINGS }, as: Investigator, as_user_id: "inv-1" }
