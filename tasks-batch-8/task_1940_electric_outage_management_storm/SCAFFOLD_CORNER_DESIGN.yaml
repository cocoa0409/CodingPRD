        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[etr-revision-stale-outage]
          - errors[ERR_STALE_OUTAGE_VERSION]
        distinguishing_aspect: "Two strictly sequential revisions carrying the same expected_outage_version: the first succeeds (version 2 -> 3), the second is rejected 412 ERR_STALE_OUTAGE_VERSION."
        test_recipe:
          setup: ["Clock 2026-08-10T01:00:00Z; outage confirmed at 00:00Z {100, TREE} (ETR 07:00Z, version 2)"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
