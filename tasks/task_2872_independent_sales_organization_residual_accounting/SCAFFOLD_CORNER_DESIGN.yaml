      - name: clawback_decay_boundary_at_exactly_the_window_edge
        claim_type: decay_function
        grounds:
          - calculations.bonus_clawback (CLAWBACK_WINDOW_DAYS)
          - state_machines.Merchant.ACTIVE_to_ATTRITED (CASCADE LINK 1 clawback branch)
          - endpoints.POST /_clock/set_current_utc
        distinguishing_aspect: "Two merchants boarded the same day with the same 27000-cent bonus attrite one day apart across the 270-day edge: at exactly 270 days active the clawback is 0 and NO adjustment row is created at all, at 269 days it is exactly 100 cents. An off-by-one on the `>=` comparison creates a 100-cent adjustment for the merchant that owes nothing."
        test_recipe:
          setup: ["Agent A1 with merchants M1 and M2, both boarded 2026-04-10 with upfront_bonus_cents 27000 and both ACTIVE; the logical clock is moved to 2027-01-05 so both attrition dates are in the past. 2026-04-10 + 270 days == 2027-01-05."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10", upfront_bonus_cents: 27000 }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9002", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10", upfront_bonus_cents: 27000 }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m1}/activate"
