              as: StateOffice
              captures: { refreshed_class: $.data.lowest_eligible_class_lbs }
            - call: "GET /eligibility-checks?wrestler_id=${wrestler_a}"
              payload: {}
              as: StateOffice
              captures: { first_log_outcome: "$.data[0].outcome" }
          assert:
            - "All three checks returned HTTP 201 — a blocked verdict is data, not an error; nothing about this endpoint returns 4xx on a business rule"
            - "${u_outcome} == 'BLOCKED_NOT_CERTIFIED', ${u_err} == 'ERR_WRESTLER_NOT_CERTIFIED', ${u_class} == null and ${u_sched} == null, while ${u_g} == 1.0 and ${u_asof} == '2026-12-12' (step 1 and the as-of date are computed even on a blocked check)"
            - "${b_outcome} == 'BLOCKED_CLASS_BELOW_MINIMUM' with ${b_err} == 'ERR_CLASS_BELOW_CERTIFIED_MINIMUM' — 144 is below the eligible class even with the 1.0 lb allowance (144 + 1.0 == 145.0 < 147.9)"
            - "${b_sched} == 147.9 (the 2026-12-07 milestone, the last one on or before 2026-12-12) and ${b_class} == 150; ${b_g} == 1.0"
