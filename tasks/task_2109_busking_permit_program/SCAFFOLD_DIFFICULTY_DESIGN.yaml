              as: Performer
              as_user_id: "${perf_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /busking/permit-applications/${app_a}/submit"
              payload: {}
              as: Performer
              as_user_id: "${perf_a}"
            - call: "POST /busking/permit-applications/${app_a}/review"
              payload: {}
              as: PermitOfficer
