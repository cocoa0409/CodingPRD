  - name: estoppel_acceptance_gated_on_pinned_lease_version_of_another_entity
    grounds:
    - state_machines.EstoppelCertificate.status.TENANT_SIGNED_to_LENDER_ACCEPTED
    - state_machines.EstoppelCertificate.status.TENANT_SIGNED_to_STALE
    - entities.EstoppelCertificate.fields.pinned_lease_version
    - entities.EstoppelCertificate.fields.lender_conditions_met
    - calculations.estoppel_fee_assessment
    - errors[ERR_CERTIFICATE_STALE]
    distinguishing_aspect: 'Acceptability of an EstoppelCertificate depends on the Lease entitys version rather than on any field of the certificate: the certificate requested AFTER the go-dark cascade
      discloses the breach and accepts to LENDER_ACCEPTED, while the certificate requested BEFORE it - identical in every own-field except pinned_lease_version - is refused with ERR_CERTIFICATE_STALE and
      stays STALE.'
