              payload: { intake_channel: "ANONYMOUS", narrative: "Rude tone at a traffic stop.", incident_datetime: "2026-07-20T18:00:00Z", alleged_injury: false, reported_allegation_types: ["DISCOURTESY"], subject_unit_id: "${patrol_unit_id}" }
              as: Complainant
              captures: { anon_id: $.data.id }
          trigger:
