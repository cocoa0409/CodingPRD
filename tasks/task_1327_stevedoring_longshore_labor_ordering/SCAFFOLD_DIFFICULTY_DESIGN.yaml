              payload: { gang_order_id: "${g}", equipment_unit_id: "${e1}", window_start_utc: "2026-08-10T08:00:00Z", window_end_utc: "2026-08-10T16:00:00Z" }
              as: StevedoreSuperintendent
            - call: "POST /api/gang-orders/${g}/start-work"
              as: GangForeman
              as_user_id: "${w1}"
              captures: { g_after: $.data.status }
          assert:
            - "After the incident: GangOrder.${g}.status == SUSPENDED and suspension_count == 1"
            - "After the incident: EquipmentAssignment.${ea1}.status == RELEASED and EquipmentUnit.${e1}.status == AVAILABLE"
            - "First resume attempt rejected: error_id == ERR_NO_EQUIPMENT_ASSIGNED (posture NORMAL again but equipment was released by the suspension)"
            - "After re-booking the unit and re-starting: GangOrder.${g}.status == WORKING — the WORKING->SUSPENDED->WORKING cycle completed"

