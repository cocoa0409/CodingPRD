              captures: { m1: $.data.id }
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S3202", full_name: "B", email: "b@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
