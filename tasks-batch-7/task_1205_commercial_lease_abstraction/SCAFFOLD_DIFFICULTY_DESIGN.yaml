              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2027-07-01", base_rent_cents: 600000 }
              as: PortfolioManager
          trigger:
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-07-01", period_end: "2028-01-01", base_rent_cents: 600000 }
              as: PortfolioManager
              captures: { adjacent_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-06-30", period_end: "2027-08-01", base_rent_cents: 100 }
              as: PortfolioManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2026-12-31", period_end: "2027-01-01", base_rent_cents: 100 }
              as: PortfolioManager
              captures: { before_id: $.data.id }
          assert:
            - "adjacent_id != null              # exact adjacency allowed (half-open)"
            - "err_overlap == ERR_SCHEDULE_OVERLAP  # one day of overlap"
            - "before_id != null                # adjacency on the left also allowed"

  # ==========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
