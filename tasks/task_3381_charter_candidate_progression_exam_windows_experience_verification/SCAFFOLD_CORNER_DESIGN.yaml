          - errors.ERR_ELIGIBILITY_NOT_MET
        distinguishing_aspect: "The WORK_EXPERIENCE pathway is a conjunction: 40 months with only 3999 hours is ineligible (422 ERR_ELIGIBILITY_NOT_MET) even though the months threshold alone is met."
        test_recipe:
