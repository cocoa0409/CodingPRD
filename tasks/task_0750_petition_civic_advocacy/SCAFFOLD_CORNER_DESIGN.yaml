# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Petition & Civic Advocacy — breadth probe over §1.1–§1.7 not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_petition_returns_201_defaults
        claim_type: Creation
        grounds: [entities.Petition.fields.status, endpoints]
        distinguishing_aspect: "POST /petitions with all required fields returns 201 with status=DRAFT, moderation_status=PENDING, version=1, and zeroed computed counters."
        test_recipe:
          setup: ["A registered Member exists."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ce_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions", payload: { title: "New", summary: "s", body: "b", category: "OTHER", goal: 50 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
          assert:
            - "Petition.${pet_id}.status == DRAFT"
            - "Petition.${pet_id}.moderation_status == PENDING"
            - "Petition.${pet_id}.version == 1"
            - "Petition.${pet_id}.verified_signature_count == 0"

      - name: create_petition_missing_goal_returns_validation
        claim_type: Required Fields
        grounds: [entities.Petition.fields.goal, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required goal field on POST /petitions returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A registered Member exists."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ce_b@x.com", full_name: "B", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions", payload: { title: "No goal", summary: "s", body: "b", category: "OTHER" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: create_petition_bad_category_enum_returns_validation
        claim_type: Type Constraints
        grounds: [entities.Petition.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A category value outside {ENVIRONMENT,POLITICS,HEALTH,EDUCATION,OTHER} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A registered Member exists."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "ce_c@x.com", full_name: "C", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions", payload: { title: "Bad", summary: "s", body: "b", category: "SPORTS", goal: 5 }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: get_petition_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PETITION_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /petitions/{unknown-uuid} returns ERR_PETITION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /petitions/00000000-0000-4000-8000-000000000000", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PETITION_NOT_FOUND"
            - "HTTP status == 404"

      - name: get_signature_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_SIGNATURE_NOT_FOUND]"]
        distinguishing_aspect: "GET /signatures/{unknown-uuid} returns ERR_SIGNATURE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /signatures/00000000-0000-4000-8000-000000000001", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_SIGNATURE_NOT_FOUND"

      - name: get_donation_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_DONATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /donations/{unknown-uuid} returns ERR_DONATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /donations/00000000-0000-4000-8000-000000000002", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DONATION_NOT_FOUND"

      - name: get_target_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_TARGET_NOT_FOUND]"]
        distinguishing_aspect: "GET /targets/{unknown-uuid} returns ERR_TARGET_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /targets/00000000-0000-4000-8000-000000000003", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_TARGET_NOT_FOUND"

      - name: get_representative_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_REPRESENTATIVE_NOT_FOUND]"]
        distinguishing_aspect: "GET /representatives/{unknown-uuid} returns ERR_REPRESENTATIVE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /representatives/00000000-0000-4000-8000-000000000004", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_REPRESENTATIVE_NOT_FOUND"

      - name: get_campaign_and_comment_and_promotion_and_meeting_and_user_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CAMPAIGN_NOT_FOUND]", "errors[ERR_COMMENT_NOT_FOUND]", "errors[ERR_PROMOTION_NOT_FOUND]", "errors[ERR_MEETING_NOT_FOUND]", "errors[ERR_USER_NOT_FOUND]"]
        distinguishing_aspect: "Each remaining single-resource GET on an unknown uuid returns its entity-specific *_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /campaigns/00000000-0000-4000-8000-000000000005", payload: {}, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CAMPAIGN_NOT_FOUND (and analogously ERR_COMMENT_NOT_FOUND, ERR_PROMOTION_NOT_FOUND, ERR_MEETING_NOT_FOUND, ERR_USER_NOT_FOUND for /comments, /promotions, /delivery-meetings, /users)"

      - name: signature_system_status_ignored_on_create
        claim_type: System Fields
        grounds: [entities.Signature.fields.status, entities.Signature.fields.verification_token]
        distinguishing_aspect: "On POST /petitions/{id}/signatures the server sets status=PENDING_VERIFICATION and mints verification_token regardless of any client-supplied values."
        test_recipe:
          setup: ["PUBLISHED petition and a signer Member."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "sf_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Sf", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "sf_s@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/signatures", payload: { public_comment: "hi" }, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id" } }
          assert:
            - "Signature.${sig_id}.status == PENDING_VERIFICATION"
            - "Signature.${sig_id}.signer_user_id == ${signer_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: moderate_draft_petition_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Petition.UNDER_REVIEW_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Moderating (APPROVE) a petition still in DRAFT (never submitted) is not a legal from-state and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT petition (not submitted)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "sm_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "D", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: submit_without_target_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Petition.DRAFT_to_UNDER_REVIEW]
        distinguishing_aspect: "Submitting a DRAFT petition that has no ACTIVE Target fails the submit precondition (a decision-maker must be set) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT petition with no target set."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "sm_b@x.com", full_name: "B", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "NoT", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: verify_already_verified_signature_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Signature.PENDING_VERIFICATION_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already-VERIFIED signature a second time returns ERR_INVALID_STATE (409) — VERIFIED is not a legal from-state for verify."
        test_recipe:
          setup: ["A VERIFIED signature on a PUBLISHED petition."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "sm_c@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "V2", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "sm_cs@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id", tok: "$.data.verification_token" } }
            - { call: "POST /signatures/${sig_id}/verify", payload: { verification_token: "${tok}" }, as: Member, as_user_id: "${signer_id}" }
          trigger:
            - { call: "POST /signatures/${sig_id}/verify", payload: { verification_token: "${tok}" }, as: Member, as_user_id: "${signer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: cancel_promotion_after_window_start_not_cancellable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Promotion.SCHEDULED_to_CANCELLED, "errors[ERR_PROMO_NOT_CANCELLABLE]"]
        distinguishing_aspect: "After the logical clock advances to/past window_start, cancelling a SCHEDULED promotion fails the 'current clock < window_start' precondition with ERR_PROMO_NOT_CANCELLABLE."
        test_recipe:
          setup: ["A SCHEDULED promotion on a PUBLISHED petition; clock advanced to 2026-04-02 (inside its 2026-04-01..04-05 window)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "pc_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Pc", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /promotions", payload: { petition_id: "${pet_id}", placement_tier: "STANDARD", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-05T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { promo_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-02T00:00:00Z" }, as: Admin }
          trigger:
            - { call: "POST /promotions/${promo_id}/cancel", payload: {}, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_PROMO_NOT_CANCELLABLE"

      - name: moderate_update_type_comment_not_moderatable
        claim_type: Precondition Enforcement
        grounds: [state_machines.Comment.PENDING_to_APPROVED, "errors[ERR_CONTENT_NOT_MODERATABLE]", entities.Comment.fields.comment_type]
        distinguishing_aspect: "An UPDATE-type comment is auto-APPROVED and not subject to moderation; moderating it returns ERR_CONTENT_NOT_MODERATABLE (409)."
        test_recipe:
          setup: ["PUBLISHED petition with an author-posted UPDATE (auto APPROVED)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "up_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Up", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /petitions/${pet_id}/comments", payload: { body: "progress", comment_type: "UPDATE" }, as: Member, as_user_id: "${author_id}", captures: { upd_id: "$.data.id" } }
          trigger:
            - { call: "POST /comments/${upd_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CONTENT_NOT_MODERATABLE"

  # ===========================================================================
  - section: validations
    instances:
      - name: authz_moderator_cannot_create_petition
        claim_type: Violation to Error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED]", roles]
        distinguishing_aspect: "POST /petitions is Member-exclusive; calling it as Moderator returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["No prerequisites."]
          setup_api_calls: []
          trigger:
            - { call: "POST /petitions", payload: { title: "X", summary: "s", body: "b", category: "OTHER", goal: 5 }, as: Moderator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: unauthenticated_missing_role_header
        claim_type: Violation to Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A mutating request with no/invalid X-User-Role header (modeled here as an unauthenticated caller) returns ERR_UNAUTHENTICATED (401) before authorization is evaluated."
        test_recipe:
          setup: ["No prerequisites; the test omits the X-User-Role/X-User-ID headers."]
          setup_api_calls: []
          trigger:
            - { call: "POST /petitions", payload: { title: "X", summary: "s", body: "b", category: "OTHER", goal: 5 }, as: Guest, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: member_cannot_edit_others_petition_ownership
        claim_type: Violation to Error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Member who is not the author cannot PATCH the petition; ownership check returns ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Author A owns a DRAFT petition; Member B is a different user."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "own_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /users", payload: { email: "own_b@x.com", full_name: "B", jurisdiction: "US-CA-12" }, as: Guest, captures: { other_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Own", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /petitions/${pet_id}", payload: { title: "Hacked", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${other_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER"

      - name: patch_stale_petition_version_occ_conflict
        claim_type: OCC Conflict
        grounds: ["validations[priority=6]", "errors[ERR_STALE_PETITION_VERSION]"]
        distinguishing_aspect: "After one successful PATCH advances Petition.version to 2, a second PATCH carrying the original expected_petition_version (1) is rejected with ERR_STALE_PETITION_VERSION (412)."
        test_recipe:
          setup: ["A DRAFT petition at version 1 owned by the author."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "occ_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Occ", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "PATCH /petitions/${pet_id}", payload: { title: "Edit1", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { pet_v2: "$.data.version" } }
          trigger:
            - { call: "PATCH /petitions/${pet_id}", payload: { title: "Edit2", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_STALE_PETITION_VERSION"
            - "HTTP status == 412"

      - name: jurisdiction_mismatch_on_sign
        claim_type: Cross-entity validation
        grounds: ["validations[priority=11]", "errors[ERR_JURISDICTION_MISMATCH]", entities.Petition.fields.eligible_jurisdiction]
        distinguishing_aspect: "When petition.eligible_jurisdiction is US-CA-12, a signer whose User.jurisdiction is US-NY-01 is rejected with ERR_JURISDICTION_MISMATCH (422)."
        test_recipe:
          setup: ["PUBLISHED petition with eligible_jurisdiction=US-CA-12; a signer registered with jurisdiction US-NY-01."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "jm_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Jm", summary: "s", body: "b", category: "OTHER", goal: 10, eligible_jurisdiction: "US-CA-12" }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "jm_s@x.com", full_name: "S", jurisdiction: "US-NY-01" }, as: Guest, captures: { signer_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_JURISDICTION_MISMATCH"

      - name: invalid_verification_token_on_verify
        claim_type: Violation to Error
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_VERIFICATION_TOKEN]"]
        distinguishing_aspect: "Submitting a token that does not equal the signature's issued token returns ERR_INVALID_VERIFICATION_TOKEN (422)."
        test_recipe:
          setup: ["PUBLISHED petition with a PENDING signature."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "iv_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Iv", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "iv_s@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id" } }
          trigger:
            - { call: "POST /signatures/${sig_id}/verify", payload: { verification_token: "WRONG" }, as: Member, as_user_id: "${signer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_VERIFICATION_TOKEN"

      - name: duplicate_signature_same_user
        claim_type: Aggregate validation
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_SIGNATURE]"]
        distinguishing_aspect: "A Member who already holds a PENDING signature on a PUBLISHED petition and signs again is rejected with ERR_DUPLICATE_SIGNATURE (409)."
        test_recipe:
          setup: ["PUBLISHED petition; signer already signed once (PENDING)."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "du_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Du", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
            - { call: "POST /users", payload: { email: "du_s@x.com", full_name: "S", jurisdiction: "US-CA-12" }, as: Guest, captures: { signer_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { sig_id: "$.data.id" } }
          trigger:
            - { call: "POST /petitions/${pet_id}/signatures", payload: {}, as: Member, as_user_id: "${signer_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_SIGNATURE"

      - name: donate_to_suspended_campaign
        claim_type: Cross-entity validation
        grounds: ["validations[priority=18]", "errors[ERR_CAMPAIGN_SUSPENDED]", state_machines.Campaign.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "A donation attempt while Campaign.status==SUSPENDED is rejected with ERR_CAMPAIGN_SUSPENDED (409)."
        test_recipe:
          setup: ["A SUSPENDED campaign."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "su_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Su", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/campaign", payload: { goal_cents: 10000 }, as: Member, as_user_id: "${author_id}", captures: { camp_id: "$.data.id" } }
            - { call: "POST /campaigns/${camp_id}/moderate", payload: { action: "SUSPEND" }, as: Moderator }
            - { call: "POST /users", payload: { email: "su_d@x.com", full_name: "D", jurisdiction: "US-CA-12" }, as: Guest, captures: { donor_id: "$.data.id" } }
          trigger:
            - { call: "POST /campaigns/${camp_id}/donations", payload: { amount_cents: 2000 }, as: Member, as_user_id: "${donor_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CAMPAIGN_SUSPENDED"

      - name: victory_zero_verified_signatures
        claim_type: Violation to Error
        grounds: ["validations[priority=17]", "errors[ERR_NO_VERIFIED_SIGNATURES]"]
        distinguishing_aspect: "VICTORY closure with verified_signature_count==0 is rejected by the first business check with ERR_NO_VERIFIED_SIGNATURES (422), before the delivery check."
        test_recipe:
          setup: ["PUBLISHED petition with zero verified signatures and zero delivered meetings."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "nv_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Nv", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
          trigger:
            - { call: "POST /petitions/${pet_id}/close", payload: { outcome: "VICTORY" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NO_VERIFIED_SIGNATURES"

      - name: promotion_window_end_before_start_validation
        claim_type: Type Constraints
        grounds: [entities.Promotion.fields.window_end, "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A promotion whose window_end <= window_start is rejected with ERR_VALIDATION (422) before any capacity check."
        test_recipe:
          setup: ["A PUBLISHED petition."]
          setup_api_calls:
            - { call: "POST /users", payload: { email: "wi_a@x.com", full_name: "A", jurisdiction: "US-CA-12" }, as: Guest, captures: { author_id: "$.data.id" } }
            - { call: "POST /petitions", payload: { title: "Wi", summary: "s", body: "b", category: "OTHER", goal: 10 }, as: Member, as_user_id: "${author_id}", captures: { pet_id: "$.data.id", pet_v: "$.data.version" } }
            - { call: "POST /petitions/${pet_id}/target", payload: { name: "T", title: "T", office: "O", expected_petition_version: "${pet_v}" }, as: Member, as_user_id: "${author_id}", captures: { target_id: "$.data.id" } }
            - { call: "POST /petitions/${pet_id}/submit", payload: {}, as: Member, as_user_id: "${author_id}" }
            - { call: "POST /petitions/${pet_id}/moderate", payload: { decision: "APPROVE" }, as: Moderator }
          trigger:
            - { call: "POST /promotions", payload: { petition_id: "${pet_id}", placement_tier: "STANDARD", window_start: "2026-04-05T00:00:00Z", window_end: "2026-04-05T00:00:00Z" }, as: Member, as_user_id: "${author_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION"

