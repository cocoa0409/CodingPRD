          trigger:
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DRAWER_ALREADY_OPEN"

      - name: withdrawal_exceeding_drawer_cash_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_DRAWER_CASH]"]
        distinguishing_aspect: "A withdrawal larger than the drawer's physical cash fails with ERR_INSUFFICIENT_DRAWER_CASH even when the account has funds."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer (cash 0); account A balance 100000000"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 1000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 5000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSUFFICIENT_DRAWER_CASH"

      - name: teller_direct_withdrawal_over_limit_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_TRANSACTION_OVER_LIMIT]"]
        distinguishing_aspect: "A teller-direct CASH_WITHDRAWAL of 500001 cents (one cent over the 500000 limit) is rejected with ERR_TRANSACTION_OVER_LIMIT; exactly 500000 succeeds."
        test_recipe:
          setup: ["Branch B; teller T with OPEN drawer funded 1500000 from the vault; account A balance 100000000"]
          setup_api_calls:
            - call: "POST /api/branches"
              payload: { name: "B", drawer_limit_cents: 100000000, vault_cash_cents: 50000000, over_short_investigation_threshold_cents: 1000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { b_id: $.data.id }
            - call: "POST /api/branches/${b_id}/tellers"
              payload: { display_name: "T" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { t_id: $.data.id }
            - call: "POST /api/branches/${b_id}/accounts"
              payload: { owner_name: "A", balance_cents: 100000000 }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { a_id: $.data.id }
            - call: "POST /api/tellers/${t_id}/drawers"
              payload: {}
              as: HeadTeller
              as_user_id: "ht-1"
              captures: { d_id: $.data.id }
            - call: "POST /api/drawers/${d_id}/buy-from-vault"
              payload: { amount_cents: 1500000 }
              as: Teller
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 500001 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
            - call: "POST /api/drawers/${d_id}/transactions"
              payload: { account_id: "${a_id}", type: "CASH_WITHDRAWAL", amount_cents: 500000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "${err} == ERR_TRANSACTION_OVER_LIMIT (500001 exceeds the limit)"
            - "${ok_status} == POSTED (exactly 500000 is allowed — limit is inclusive)"

      - name: buy_exceeding_vault_rejected
