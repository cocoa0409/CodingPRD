            - "A LOW-tier household, an ENROLLED_ACTIVE contractor and an APPROVED assessment (assessed_panel_amps 200)."
            - "A RESERVED project whose provisional line is 800000 (estimated cost 1000000), so 800000 is encumbered and lifetime_cap_remaining_cents is 600000."
            - "Installation reported with actual_cost_cents 700001 and verified_quantity 1, so the pre-reduction final line is min(800000, 800000, floor(700001 * 1.00)) = 700001."
