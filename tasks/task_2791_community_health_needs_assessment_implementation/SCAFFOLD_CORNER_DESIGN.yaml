      - name: severity_constants_parity_score_and_ceiling_applied
        claim_type: Constants Applied
        grounds:
          - calculations.indicator_severity_score.constants
          - calculations.indicator_severity_score.precision
        distinguishing_aspect: "The two declared constants are both observable: an indicator exactly at its benchmark scores BENCHMARK_PARITY_SCORE 50.00, and one at 2.5x its benchmark is clipped to SEVERITY_SCORE_CEILING 100.00 rather than 125.00."
        test_recipe:
          setup:
