            - call: "POST /venues"
              payload: { market_id: "${cc_mk_id}", name: "Cond Hall", gross_capacity: 800, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { cc_vn_id: $.data.id }
            # ---- show X ------------------------------------------------
            - call: "POST /shows"
              payload: { artist_id: "${cc_arx_id}", venue_id: "${cc_vn_id}", event_at: "2026-10-20T02:00:00.000Z", load_in_at: "2026-10-19T14:00:00.000Z", load_out_at: "2026-10-20T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { cc_shx_id: $.data.id, cc_shx_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${cc_shx_id}", expected_show_version: "${cc_shx_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 500000, deposit_cents: 0, expense_cap_cents: 500000 }
              as: TalentBuyer
              captures: { cc_ofx_id: $.data.id }
            - call: "POST /offers/${cc_ofx_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${cc_ofx_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${cc_arx_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${cc_shx_id}", category: "PRODUCTION", description: "Stage package", budgeted_cents: 200000, is_artist_deductible: false }
              as: TourAccountant
              captures: { cc_blx_id: $.data.id }
            - call: "POST /vendor-invoices"
              payload: { show_id: "${cc_shx_id}", budget_line_id: "${cc_blx_id}", vendor_name: "Stage Supply", amount_cents: 200000, invoice_date: "2026-08-01T00:00:00.000Z", documentation_ref: "PKT-X-01" }
              as: TourAccountant
              captures: { cc_vix_id: $.data.id }
            - call: "POST /vendor-invoices/${cc_vix_id}/verify"
