            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T16:00:00Z", scheduled_end: "2026-08-10T17:00:00Z", committee_size: 1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /inspection-trips"
              payload: { unit_order_id: "${unit_id}", plant_bay_id: "${bay_id}", trip_type: "PRE_CONSTRUCTION", scheduled_start: "2026-08-10T16:00:01Z", scheduled_end: "2026-08-10T18:00:00Z", committee_size: 1 }
