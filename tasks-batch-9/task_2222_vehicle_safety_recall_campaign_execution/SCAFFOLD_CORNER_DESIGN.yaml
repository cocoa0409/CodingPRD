          - errors.ERR_WAVE_MAILING_TOO_CLOSE
          - entities.NotificationWave.fields.scheduled_mail_date
        distinguishing_aspect: |
          Thirteen whole days between two NE waves of the same campaign is one day short of
          MIN_WAVE_SEPARATION_DAYS and must be refused, while exactly fourteen days (2026-09-03 against
          2026-08-20) is explicitly allowed -- the same pair of dates differing by a single day
          straddles the boundary in both directions.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-314 with one matched NE build record."
            - "One PLANNED INTERIM wave already targets NE with scheduled_mail_date 2026-08-20."
          setup_api_calls:
