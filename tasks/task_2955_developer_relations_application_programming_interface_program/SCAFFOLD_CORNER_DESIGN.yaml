          The constraint is on the acting USER, not the role: claim-review records whichever
          X-User-ID performed it, and the decision is then refused for that identity even though
          it now presents the PlatformAdmin role, while a different X-User-ID on the same role
          succeeds. That is only observable because both operator roles have opaque identities
          drawn from the same id space.
        test_recipe:
