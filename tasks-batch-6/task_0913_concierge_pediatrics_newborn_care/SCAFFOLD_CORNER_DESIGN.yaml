              captures: { f2_id: "$.data.id" }
            - call: "POST /peds/children"
              payload: { family_id: "${f2_id}", first_name: "Kojo", date_of_birth: "2026-04-01" }
              as: PracticeAdmin
              captures: { child_b: "$.data.id" }
          trigger:
            - call: "GET /peds/children/${child_a}"
              payload: {}
              as: Parent
              as_user_id: "${f2_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /peds/children/${child_b}"
              payload: {}
              as: Parent
              as_user_id: "${f2_id}"
              captures: { own_child: "$.data.id" }
          assert:
            - "the cross-household read returns error_id ERR_NOT_RESOURCE_OWNER with HTTP status 403"
            - "the own-household read returns HTTP 200 with id ${child_b}"
            - "the same cross-household read as PracticeAdmin returns HTTP 200, so the denial is identity-scoped and not a missing route"

      - name: corner_physician_completing_another_panels_well_visit_returns_not_resource_owner
        claim_type: role denial
