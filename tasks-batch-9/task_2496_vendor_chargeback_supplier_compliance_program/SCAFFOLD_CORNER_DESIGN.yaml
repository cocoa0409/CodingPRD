            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "LBL-01", domain: "PACKAGING", severity_tier: "TIER_3", min_evidence_count: 0, fixed_fee_cents: 100, per_unit_recovery_cents: 1, handling_pct: 0.50, min_fee_cents: 0, cap_cents: 1000 }
              as: ComplianceOfficer
