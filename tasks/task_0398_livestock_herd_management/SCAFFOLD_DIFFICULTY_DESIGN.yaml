          - validations[priority=12]
          - errors[ERR_PASTURE_OVER_CAPACITY]
          - state_machines.MovementRecord.PLANNED_to_APPLIED
        distinguishing_aspect: "Numeric threshold boundary on Pasture capacity: a single 454 kg animal (AU exactly 1.0) applied into a PEN of capacity_au 1.0 passes because the gate rejects only when projected aggregate is strictly greater than capacity (1.0 == 1.0 passes)."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Herd, PEN capacity_au 1.0, one animal weighed 454 kg (AU 1.0). Plan a movement into the pen."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: HerdManager
            - call: "POST /herds"
              payload: { name: "H11", species: "CATTLE", premises_id: "PR-0398-11" }
              as: HerdManager
              captures: { herd11: $.data.id }
            - call: "POST /pastures"
              payload: { name: "Pen11", kind: "PEN", capacity_au: 1.0 }
