              as: GivingAdmin
              captures: { don_id: "$.data.id" }
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /campaigns/${camp_id}/pause"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /donations/${don_id}/settle"
              payload: {}
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409"
            - "data.error_id == ERR_CAMPAIGN_NOT_LIVE"
            - "Donation.${don_id}.status == AUTHORIZED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: schedule_half_open_overlap_per_employee_campaign
        grounds:
          - validations[priority=11]
          - entities.PayrollDeductionSchedule.fields.window_start
          - entities.PayrollDeductionSchedule.fields.window_end
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on PayrollDeductionSchedule: a new [2026-03-01,2026-08-01) overlaps an
          existing ACTIVE [2026-01-01,2026-04-01) (shared sub-interval) -> ERR_SCHEDULE_OVERLAP, but an
          adjacent [2026-04-01,2026-07-01) touching only at 2026-04-01 is ALLOWED (half-open, endpoints do
          not collide). Salaries kept high so the deduction ceiling never fires.
        test_recipe:
          setup:
            - "ACTIVE program; APPROVED charity; LIVE campaign; ACTIVE employee salary 120,000,000 (ceiling huge)"
            - "Existing ACTIVE schedule per_period 1000 over [2026-01-01,2026-04-01)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Ov1", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Ov1 Charity", ein: "17-1717171" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "ov1@co.com", full_name: "Ola", annual_salary_cents: 120000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "OV1C", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /payroll-schedules"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", per_period_amount_cents: 1000, window_start: "2026-01-01T00:00:00Z", window_end: "2026-04-01T00:00:00Z" }
              as: GivingAdmin
              captures: { sched_id: "$.data.id" }
          trigger:
            - call: "POST /payroll-schedules"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", per_period_amount_cents: 1000, window_start: "2026-03-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409"
            - "data.error_id == ERR_SCHEDULE_OVERLAP"
            - "A separately-attempted adjacent schedule [2026-04-01,2026-07-01) would instead succeed (201), proving half-open adjacency is allowed"

      - name: batch_closed_interval_touching_endpoints_conflict
        grounds:
          - validations[priority=12]
          - entities.DisbursementBatch.fields.period_start
          - entities.DisbursementBatch.fields.period_end
          - errors[ERR_BATCH_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Closed interval semantics on DisbursementBatch (different entity, different geometry than the
          half-open schedule rule): a new [2026-01-31,2026-02-28] touching an existing [2026-01-01,2026-01-31]
          only at the shared endpoint 2026-01-31 STILL conflicts (closed endpoints collide) ->
          ERR_BATCH_PERIOD_OVERLAP, whereas the schedule rule would allow an adjacent touch.
        test_recipe:
          setup:
            - "ACTIVE program; APPROVED charity; existing OPEN batch covering closed [2026-01-01,2026-01-31]"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Ov2", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Ov2 Charity", ein: "18-1818181" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /disbursement-batches"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: GivingAdmin
              captures: { batch1_id: "$.data.id" }
          trigger:
            - call: "POST /disbursement-batches"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", period_start: "2026-01-31T00:00:00Z", period_end: "2026-02-28T00:00:00Z" }
              as: GivingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Response status is 409"
            - "data.error_id == ERR_BATCH_PERIOD_OVERLAP (touching endpoint 2026-01-31 collides under closed semantics)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: match_cap_conserved_on_settle_then_refund
        grounds:
          - state_machines.Donation.SETTLED_to_REFUNDED
          - state_machines.MatchingGift.FINALIZED_to_REVERSED
          - entities.Employee.fields.match_consumed_ytd_cents
        distinguishing_aspect: |
          Conserved quantity #1 = Employee.match_consumed_ytd_cents. Invariant: after settle (+20000) then
          refund (-20000), match_consumed_ytd_cents returns to its pre-donation value (0), pinned as
          match_consumed_ytd_cents == sum(matched_amount_cents over FINALIZED/SETTLED matches). The refund's
          MatchingGift FINALIZED->REVERSED leaves zero drift.
        test_recipe:
          setup:
            - "ACTIVE program (cap 100000); APPROVED charity; LIVE campaign; ACTIVE employee"
            - "SETTLED donation base 40000 with a FINALIZED match 20000 (match_consumed_ytd_cents == 20000); not disbursed"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Inv1", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Inv1 Charity", ein: "19-1919191" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "i1@co.com", full_name: "Ivy", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /campaigns"
              payload: { program_id: "${prog_id}", charity_id: "${charity_id}", name: "I1C", goal_cents: 1000000, window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { camp_id: "$.data.id" }
            - call: "POST /campaigns/${camp_id}/launch"
              payload: {}
              as: ProgramManager
            - call: "POST /donations"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", campaign_id: "${camp_id}", donation_type: "ONE_TIME", funding_method: "CREDIT", base_amount_cents: 40000, request_match: true }
              as: GivingAdmin
              captures: { don_id: "$.data.id" }
            - call: "POST /donations/${don_id}/authorize"
              payload: {}
              as: GivingAdmin
            - call: "POST /donations/${don_id}/settle"
              payload: {}
              as: GivingAdmin
            - call: "GET /matching-gifts?donation_id=${don_id}"
              payload: {}
              as: GivingAdmin
              captures: { mg_id: "$.data[0].id" }
          trigger:
            - call: "POST /donations/${don_id}/refund"
              payload: {}
              as: GivingAdmin
          assert:
            - "Donation.${don_id}.status == REFUNDED"
            - "MatchingGift.${mg_id}.status == REVERSED"
            - "Employee.${emp_id}.match_consumed_ytd_cents == 0 (returned to pre-donation value; no drift)"
            - "Campaign.${camp_id}.raised_cents == 0"

      - name: dfd_cap_conserved_on_approve_then_reverse
        grounds:
          - state_machines.VolunteerLog.LOGGED_to_APPROVED
          - state_machines.VolunteerLog.APPROVED_to_REVERSED
          - entities.Employee.fields.dfd_consumed_ytd_cents
        distinguishing_aspect: |
          Conserved quantity #2 = Employee.dfd_consumed_ytd_cents (a different conserved quantity than the
          match cap). Invariant: approve (+15750) then reverse (-15750) returns dfd_consumed_ytd_cents to 0,
          pinned as dfd_consumed_ytd_cents == sum(grant_amount_cents over APPROVED/SETTLED logs). No drift.
        test_recipe:
          setup:
            - "ACTIVE program (dfd_rate 1500/hr, dfd cap 25000); APPROVED charity; ACTIVE employee"
            - "APPROVED volunteer log 630 minutes -> grant 15750 (dfd_consumed_ytd_cents == 15750); not disbursed"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Inv2", tax_year: 2026 }
              as: ProgramManager
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /charities"
              payload: { program_id: "${prog_id}", legal_name: "Inv2 Charity", ein: "20-2020202" }
              as: GivingAdmin
              captures: { charity_id: "$.data.id" }
            - call: "POST /charities/${charity_id}/start-review"
              payload: {}
              as: GivingAdmin
            - call: "POST /charities/${charity_id}/approve"
              payload: {}
              as: GivingAdmin
            - call: "POST /employees"
              payload: { program_id: "${prog_id}", email: "i2@co.com", full_name: "Ira", annual_salary_cents: 12000000 }
              as: GivingAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /volunteer-logs"
              payload: { program_id: "${prog_id}", employee_id: "${emp_id}", charity_id: "${charity_id}", minutes: 630, activity_date: "2026-03-15T00:00:00Z" }
              as: GivingAdmin
              captures: { log_id: "$.data.id" }
            - call: "POST /volunteer-logs/${log_id}/approve"
              payload: {}
              as: GivingAdmin
          trigger:
            - call: "POST /volunteer-logs/${log_id}/reverse"
              payload: {}
              as: GivingAdmin
          assert:
            - "VolunteerLog.${log_id}.status == REVERSED"
            - "VolunteerLog.${log_id}.grant_amount_cents == 15750 (recorded amount preserved on the row)"
            - "Employee.${emp_id}.dfd_consumed_ytd_cents == 0 (returned to pre-approval value; no drift)"
