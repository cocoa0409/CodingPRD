              as_user_id: "regulator-01"
              captures: { pd_state: $.data.participant_status }
            - call: "GET /prt/settlement-entries"
              payload: { plan_id: "${plan_id}", entry_type: "PLAN_TERMINATION" }
              as: Regulator
              as_user_id: "regulator-01"
              captures: { pt_entry_id: "$.data[0].id", pt_amount: "$.data[0].amount_cents" }
          assert:
            - "the settlement left PensionPlan.${plan_id} in RESIDUAL with total_liability_cents == 97708000 (100000000 minus the 2292000 released) and plan_assets_cents == 117600000 (120000000 minus the 2400000 paid)"
            - "the first filing returns 200 with plan_status == TERMINATION_FILED and filing_reference == PBGC-500-2026-0001"
            - "RETURN_DEFICIENT returns 200 with plan_status == FILING_DEFICIENT and filing_deficiency_reason recorded"
            - "the refiling WITHOUT deficiency_response returns 422 ERR_INVALID_REQUEST and the plan stays FILING_DEFICIENT — the field is conditionally required only on this leg"
            - "the refiling WITH deficiency_response returns 200 with plan_status == TERMINATION_FILED"
            - "APPROVE returns 200 with plan_status == TERMINATED: accounting_funded_status_bp was 12036 (117600000 * 10000 / 97708000), at or above the 10000 floor"
            - "ParticipantRecord.${pd_id}.participant_status == RESIDUAL_ANNUITY_PURCHASED — the participant who never received a notice is annuitized by the termination cascade"
            - "ParticipantRecord.${pa_id}.participant_status is still SETTLED_LUMP_SUM — a terminal participant is not re-annuitized"
            - "SettlementEntry.${pt_entry_id}.entry_type == PLAN_TERMINATION with amount_cents == 0 and deferred_amount_cents == 0"
            - "the filing attempt after TERMINATED returns 409 ERR_PLAN_STATE_INVALID — the terminal state admits no transition"

      - name: plan_bubbles_to_residual_when_every_window_and_tranche_is_final
        claim_type: bubble_up
        excluded_because:
          difficulty_instance: window_settlement_cascades_elections_participants_plan_then_residual
          rationale: |
            That §1.8 instance already drives the four-hop cascade from a window
            settlement through the elections and participants to the plan and asserts
            the SETTLEMENT_AUTHORIZED -> RESIDUAL bubble-up together with the
            APPROVED -> EXECUTED strategy sweep, so a separate bubble-up corner would
            re-run the same transition with weaker assertions.

      - name: abandonment_reverses_every_lock_side_effect
        claim_type: compensation
        excluded_because:
          difficulty_instance: abandonment_conserves_insurer_capacity_and_never_touches_plan_liability
          rationale: |
            §1.8 already proves the compensating path: abandoning a PRICING_LOCKED
            tranche expires the locked quote, restores the insurer's committed and
            available capacity to their pre-lock values, returns the assigned
            participants to IN_PLAN and leaves plan.total_liability_cents untouched.

      - name: complaint_triage_cascade_is_conditional_on_the_determination
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: complaint_triage_reopens_audit_then_remediation_moves_funded_status
          rationale: |
            The conditional side effect — only a SPONSOR_RESPONSIBLE triage reopens
            the participant's latest audit and only then does the remediation ledger
            move — is the whole subject of that §1.8 instance, which also asserts the
            NO_ERROR determination leaves the audit alone.

      - name: participant_dimensions_advance_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: participant_three_dimensions_advance_independently
          rationale: |
            The declared state_machine_shape is parallel because ParticipantRecord
            carries three orthogonal dimensions, and that §1.8 instance already walks
            participant_status, mortality_status and address_status in interleaved
            order and asserts the combined state after each step.

  - section: calculations
    instances:
      - name: cohort_factors_diverge_and_half_up_rounding_is_observable
        claim_type: constants_applied
        grounds:
          - calculations.participant_accounting_liability
          - calculations.participant_settlement_liability
          - constants.ACCOUNTING_FACTOR_BP
          - constants.SETTLEMENT_FACTOR_BP
        distinguishing_aspect: |
          Both liability bases are keyed on cohort and both round half up on the same
          annualized figure. A retiree at 250001 cents a month produces a true .5
          quotient on the settlement basis (37875151.5 -> 37875152) and a .6 quotient
          on the accounting basis (35400141.6 -> 35400142), so truncation and
          round-half-even are both caught; a deferred vested member at 100000 lands
          exactly on 11460000 / 12540000. A confirmed death then zeroes both bases
          for the retiree while leaving the deferred member untouched.
        test_recipe:
          setup:
            - "one PensionPlan with a RETIREE_IN_PAY at stated 250001 and a DEFERRED_VESTED at stated 100000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-RET", cohort: "RETIREE_IN_PAY", stated_monthly_benefit_cents: 250001, final_average_monthly_earnings_cents: 500000, credited_service_months: 400, date_of_birth: "1956-06-06" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { pr_id: $.data.id, pr_acct: $.data.accounting_liability_cents, pr_settle: $.data.settlement_liability_cents }
            - call: "POST /prt/plans/${plan_id}/participants"
