  # ===========================================================================
  - section: state_machines
    instances:
      - name: every_entity_lands_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Hotel.initial_state
          - state_machines.Stay.initial_state
          - state_machines.Redemption.fulfillment_status.initial_state
          - state_machines.Redemption.reimbursement_status.initial_state
          - state_machines.ReimbursementBatch.initial_state
          - state_machines.MemberComplaint.initial_state
          - state_machines.PointPurchase.initial_state
          - state_machines.ProgramFund.initial_state
        distinguishing_aspect: |
          Seven freshly created rows sit in exactly the state §1.2 declares, and the Redemption
          lands in both of its declared initial states at once - HELD on fulfillment_status and
          NOT_DUE on reimbursement_status - while the untouched program fund reports HEALTHY with
          solvency_ratio 999.0 rather than a division by zero.
        test_recipe:
          setup:
            - "One ACTIVE property with a TRANSIENT rate plan and one STANDARD pricing row covering the whole of 2026 at 20000 points per night, allotment 2, min tier BASE, copay 0."
            - "One member funded with exactly 40000 points by a settled 40000-point DIRECT_PURCHASE, plus one further 20000-point purchase left PENDING."
