  - section: cross_cutting_complexity_layers
    instances:
      - name: authority_verification_expires_lazily_on_read_after_clock_passes_covered_until
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.insurance_coverage"
          - "state_machines.AuthorityVerification"
        distinguishing_aspect: "Derived state: a VERIFIED verification reads VERIFIED at 2026-12-31 and EXPIRED at 2027-01-01 (== covered_until) with no write in between; a fresh verify after expiry flips it back."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z. Broker B has a VERIFIED authority verification whose insurance covers [2026-01-01, 2027-01-01)."]
          setup_api_calls:
            - *cc_clock
            - *cc_broker
            - *cc_av
            - *cc_av_verify
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T23:59:59Z" }
              as: PlatformAdmin
            - call: "GET /authority-verifications/${cc_av_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /authority-verifications/${cc_av_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "At 2026-12-31T23:59:59Z: status == VERIFIED and insurance_ok == true"
            - "At 2027-01-01T00:00:00Z (== covered_until, half-open end): status == EXPIRED and insurance_ok == false"
            - "AuthorityVerification.${cc_av_id}.version is unchanged by these reads"
