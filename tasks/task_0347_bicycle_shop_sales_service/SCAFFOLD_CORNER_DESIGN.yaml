      - name: mandatory_recall_blocks_reserve
        claim_type: Cross-entity validation
        grounds: ["validations[priority=12]", "errors[ERR_RECALL_BLOCK]"]
        distinguishing_aspect: "Reserving a Sku that has a MANDATORY RecallNotice returns ERR_RECALL_BLOCK (409); an ADVISORY recall would not block."
        test_recipe:
          setup: ["A Sku with a MANDATORY recall; a PENDING order with one line for it."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Recall Block", email: "rb@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Dangerous Fork", category: "PART", list_price_cents: 9000, on_hand: 5 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/recall-notices"
              payload: { sku_id: "${sku_id}", severity: "MANDATORY", remedy: "Do not sell" }
              as: ShopManager
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECALL_BLOCK"

      - name: payment_against_delivered_order_not_payable
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", "errors[ERR_TARGET_NOT_PAYABLE]"]
        distinguishing_aspect: "A payment against a SALES_ORDER already DELIVERED returns ERR_TARGET_NOT_PAYABLE (409)."
        test_recipe:
          setup: ["A delivered, fully-paid order."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Pay Closed", email: "pc@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Finished Good", category: "ACCESSORY", list_price_cents: 5000, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 5000 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 100 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TARGET_NOT_PAYABLE"

      - name: duplicate_recall_ack_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=19]", "errors[ERR_ALREADY_ACKNOWLEDGED]"]
        distinguishing_aspect: "A customer acknowledging the same RecallNotice twice gets ERR_ALREADY_ACKNOWLEDGED (409) on the second ack."
        test_recipe:
          setup: ["A recall notice and a first ack by the customer."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Ack Twice", email: "at@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Ack Sku", category: "BIKE", list_price_cents: 30000, on_hand: 2 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /shop/recall-notices"
              payload: { sku_id: "${sku_id}", severity: "ADVISORY", remedy: "Check it" }
              as: ShopManager
              captures: { rn_id: $.data.id }
            - call: "POST /shop/recall-acks"
              payload: { recall_id: "${rn_id}", customer_id: "${cust_id}" }
