  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_occupancy_half_open_interval_adjacency
        grounds:
          - validations[priority=20]
          - errors[ERR_VEHICLE_INTERVAL_OVERLAP]
          - entities.RentalAgreement.fields.period_start
          - entities.RentalAgreement.fields.period_end
        distinguishing_aspect: |
          Two agreements on one ProgramVehicle are compatible when the second begins
          exactly at the first's period_end, because periods are half-open; a second
          beginning one second earlier is refused with ERR_VEHICLE_INTERVAL_OVERLAP, so
          adjacency is not collision.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00Z; one enrollment and one program vehicle with a first agreement occupying 2026-09-01T00:00:00Z through 2026-09-08T00:00:00Z"
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
