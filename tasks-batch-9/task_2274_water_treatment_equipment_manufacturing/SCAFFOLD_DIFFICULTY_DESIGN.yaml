              as: FabricationManager
              as_user_id: "fab-1"
              captures: { run_f_id: "$.data.id" }
            - call: "POST /water-treatment/fat-runs/${run_f_id}/witness-result"
              payload: { result: "PASS", punchlist_item_count: 0 }
              as: QualityEngineer
              as_user_id: "qa-1"
            - call: "POST /water-treatment/projects/${proj_id}/deliverable-acceptance"
              payload: { deliverable_type: "OM_MANUAL", decision: "ACCEPT" }
              as: OwnerRepresentative
