# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Enumerates testable claims across §1.1–§1.7 not already covered by §1.8.
# Every active instance has an executable setup_api_calls/trigger chain; corners
# already covered by a §1.8 instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------- entities --
  - section: entities
    instances:
      - name: product_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Product.fields.status, entities.Product.fields.is_rentable, entities.Product.fields.on_hand_qty]
        distinguishing_aspect: "A minimal product create defaults status=ACTIVE, is_rentable=false, on_hand_qty=0, reserved_qty=0, available_qty=0, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "ACC-1", name: "Sticker Pack", category: "ACCESSORY", unit_price_cents: 500 }
              as: ShopManager
              captures: { p_id: $.data.id, st: $.data.status }
          assert:
            - "Product.${p_id}.status == ACTIVE"
            - "Product.${p_id}.is_rentable == false"
            - "Product.${p_id}.on_hand_qty == 0 and Product.${p_id}.available_qty == 0"
            - "Product.${p_id}.version == 1"

      - name: product_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{unknown uuid} returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_PRODUCT_NOT_FOUND"

      - name: customer_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Customer.fields.full_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /customers omitting the required full_name returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "x@x.com" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_VALIDATION"

      - name: product_create_invalid_enum_category_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Product.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products with category outside the 9-value enum returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "BAD-1", name: "Mystery", category: "SPACESHIP", unit_price_cents: 100 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_VALIDATION"

      - name: product_computed_available_qty_reconciles_on_adjust
        claim_type: computed_fields
        grounds: [calculations.product_availability, entities.Product.fields.available_qty]
        distinguishing_aspect: "After an inventory-adjustment of +7 with no reservations, available_qty == on_hand_qty == 7 (derived, input ignored)."
        test_recipe:
          setup: ["A product with on_hand 0."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "WHL-C", name: "Wheels C", category: "WHEELS", unit_price_cents: 3200 }
              as: ShopManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /products/${p_id}/inventory-adjustments"
              payload: { delta_on_hand: 7 }
              as: ShopManager
              captures: { oh: $.data.on_hand_qty, av: $.data.available_qty }
          assert:
            - "Product.${p_id}.on_hand_qty == 7"
            - "Product.${p_id}.available_qty == 7"
            - "Product.${p_id}.reserved_qty == 0"

      - name: rental_asset_fk_product_not_found
        claim_type: foreign_key
        grounds: [entities.RentalAsset.fields.product_id, "errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "Creating a RentalAsset whose product_id references no Product returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental-assets"
              payload: { product_id: "00000000-0000-0000-0000-000000000000", asset_tag: "GHOST-1" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_PRODUCT_NOT_FOUND"

  # ----------------------------------------------------------- state_machines --
  - section: state_machines
    instances:
      - name: board_build_complete_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BoardBuild.RESERVED_to_COMPLETED, "errors[ERR_BUILD_INVALID_STATE]"]
        distinguishing_aspect: "Completing a build still in DRAFT (never reserved) returns ERR_BUILD_INVALID_STATE (409)."
        test_recipe:
          setup: ["A Customer, a Product on_hand 5, and a DRAFT BoardBuild (not reserved)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm1@x.com", full_name: "SM One" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "DECK-SM", name: "Deck SM", category: "DECK", unit_price_cents: 8000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/inventory-adjustments"
              payload: { delta_on_hand: 5 }
              as: ShopManager
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${prod_id}", qty: 1 } ] }
              as: BenchTech
              captures: { bb_id: $.data.id }
          trigger:
            - call: "POST /board-builds/${bb_id}/complete"
              payload: {}
              as: BenchTech
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_BUILD_INVALID_STATE"
            - "BoardBuild.${bb_id}.status == DRAFT"

      - name: lesson_cancel_after_completed_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Lesson.SCHEDULED_to_COMPLETED, "errors[ERR_LESSON_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a lesson already in terminal COMPLETED returns ERR_LESSON_INVALID_STATE (409); no cascade fires."
        test_recipe:
          setup: ["A Coach, a Customer, and a COMPLETED Lesson."]
          setup_api_calls:
            - call: "POST /coaches"
              payload: { name: "Coach D", discipline: "SURF" }
              as: ShopManager
              captures: { coach_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm2@x.com", full_name: "SM Two" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SURF", start_at: "2026-07-09T10:00:00Z", end_at: "2026-07-09T11:00:00Z" }
              as: SalesAssociate
              captures: { les_id: $.data.id }
            - call: "POST /lessons/${les_id}/complete"
              payload: { outcome: "COMPLETED" }
              as: SalesAssociate
          trigger:
            - call: "POST /lessons/${les_id}/cancel"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_LESSON_INVALID_STATE"
            - "Lesson.${les_id}.status == COMPLETED"

      - name: event_entry_double_cancel_idempotency_rejected
        claim_type: idempotency
        grounds: [state_machines.EventEntry.REGISTERED_to_CANCELLED, "errors[ERR_ENTRY_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED entry returns ERR_ENTRY_INVALID_STATE (409); loyalty is not reversed twice."
        test_recipe:
          setup: ["A Customer, a PUBLISHED Event, and a REGISTERED then CANCELLED entry."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm3@x.com", full_name: "SM Three" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /events"
              payload: { name: "Idem Jam", sponsor: "BrandA", venue: "Pier", start_at: "2026-07-11T00:00:00Z", capacity: 10, entry_fee_cents: 4000 }
              as: ShopManager
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/publish"
              payload: {}
              as: ShopManager
            - call: "POST /event-entries"
              payload: { event_id: "${ev_id}", customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ee_id: $.data.id }
            - call: "POST /event-entries/${ee_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /event-entries/${ee_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second cancel response data.error_id == ERR_ENTRY_INVALID_STATE"
            - "Customer.${cust_id}.loyalty_points == 0"

  # ------------------------------------------------------------- calculations --
  - section: calculations
    instances:
      - name: rental_fee_ceils_partial_day
        claim_type: correct_result
        grounds: [calculations.rental_fee, entities.Rental.fields.rental_fee_cents]
        distinguishing_aspect: "A 1.25-day window (07-02T00→07-03T06) at rate 2000 ceils to 2 days → rental_fee_cents == 4000."
        test_recipe:
          setup: ["A rentable product @rate 2000, an asset, a Customer."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SB-3", name: "Foamie", category: "SURFBOARD", unit_price_cents: 40000, rental_day_rate_cents: 2000, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "SB-3A" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rf@x.com", full_name: "Ren Fee" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", start_at: "2026-07-02T00:00:00Z", end_at: "2026-07-03T06:00:00Z", deposit_cents: 4000 }
              as: SalesAssociate
              captures: { fee: $.data.rental_fee_cents }
          assert:
            - "Rental.*.rental_fee_cents == 4000"

      - name: rental_late_fee_and_deposit_capture
        claim_type: correct_result
        grounds: [calculations.rental_late_fee, entities.Rental.fields.late_fee_cents, entities.Rental.fields.payment_status]
        distinguishing_aspect: "Returning 2 days after end_at (clock advanced to 07-05, end 07-03) yields late_fee_cents == 2000 and payment_status == DEPOSIT_CAPTURED."
        test_recipe:
          setup: ["A rentable product+asset, a Customer, a Rental 07-02→07-03 checked out; clock later set to 07-05."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SB-4", name: "Fish", category: "SURFBOARD", unit_price_cents: 45000, rental_day_rate_cents: 1500, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "SB-4A" }
              as: ShopManager
              captures: { asset_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "lf@x.com", full_name: "Late Fee" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /rentals"
              payload: { customer_id: "${cust_id}", rental_asset_id: "${asset_id}", start_at: "2026-07-02T00:00:00Z", end_at: "2026-07-03T00:00:00Z", deposit_cents: 5000 }
              as: SalesAssociate
              captures: { rent_id: $.data.id }
            - call: "POST /rentals/${rent_id}/checkout"
              payload: {}
              as: SalesAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /rentals/${rent_id}/return"
              payload: {}
              as: SalesAssociate
              captures: { late: $.data.late_fee_cents, pay: $.data.payment_status }
          assert:
            - "Rental.${rent_id}.late_fee_cents == 2000"
            - "Rental.${rent_id}.payment_status == DEPOSIT_CAPTURED"

      - name: consignor_credit_on_consignment_sale
        claim_type: correct_result
        grounds: [calculations.consignor_credit, entities.TradeIn.fields.consignor_credit_cents, entities.Customer.fields.store_credit_cents]
        distinguishing_aspect: "A CONSIGNMENT sold at 10000 grants consignor_credit_cents == round_half_up(10000*0.60) == 6000, added to Customer.store_credit_cents."
        test_recipe:
          setup: ["A Customer and a CONSIGNMENT TradeIn appraised and accepted (LISTED)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cn@x.com", full_name: "Con Signor" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", item_description: "Used longboard", mode: "CONSIGNMENT", list_price_cents: 15000 }
              as: SalesAssociate
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/appraise"
              payload: { appraised_value_cents: 12000 }
              as: ShopManager
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /trade-ins/${ti_id}/sell"
              payload: { sold_price_cents: 10000 }
              as: ShopManager
              captures: { cc: $.data.consignor_credit_cents }
          assert:
            - "TradeIn.${ti_id}.consignor_credit_cents == 6000"
            - "TradeIn.${ti_id}.status == SOLD"
            - "Customer.${cust_id}.store_credit_cents == 6000"

      - name: tradein_accept_store_credit_payout
        claim_type: variant_selection
        grounds: [calculations.tradein_offers, state_machines.TradeIn.APPRAISED_to_ACCEPTED, entities.Customer.fields.store_credit_cents]
        distinguishing_aspect: "TRADE_IN accepted with payout_choice STORE_CREDIT credits the customer the store_credit variant (70% of 20000 = 14000), not the cash variant."
        test_recipe:
          setup: ["A Customer and a TRADE_IN TradeIn appraised at 20000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sc@x.com", full_name: "Store Credit" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", item_description: "Used trucks", mode: "TRADE_IN" }
              as: SalesAssociate
              captures: { ti_id: $.data.id }
            - call: "POST /trade-ins/${ti_id}/appraise"
              payload: { appraised_value_cents: 20000 }
              as: ShopManager
          trigger:
            - call: "POST /trade-ins/${ti_id}/accept"
              payload: { payout_choice: "STORE_CREDIT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.status }
          assert:
            - "TradeIn.${ti_id}.status == ACCEPTED"
            - "TradeIn.${ti_id}.store_credit_offer_cents == 14000"
            - "Customer.${cust_id}.store_credit_cents == 14000"

  # -------------------------------------------------------------- validations --
  - section: validations
    instances:
      - name: duplicate_sku_returns_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "Creating a second Product with an existing sku returns ERR_DUPLICATE_SKU (409)."
        test_recipe:
          setup: ["A Product with sku DUP-1 exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "DUP-1", name: "First", category: "WAX", unit_price_cents: 700 }
              as: ShopManager
          trigger:
            - call: "POST /products"
              payload: { sku: "DUP-1", name: "Second", category: "WAX", unit_price_cents: 800 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_DUPLICATE_SKU"

      - name: duplicate_asset_tag_returns_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_ASSET_TAG]"]
        distinguishing_aspect: "Creating a second RentalAsset with an existing asset_tag returns ERR_DUPLICATE_ASSET_TAG (409)."
        test_recipe:
          setup: ["A rentable Product and one RentalAsset tagged TAG-1."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SB-5", name: "Gun", category: "SURFBOARD", unit_price_cents: 70000, rental_day_rate_cents: 3000, is_rentable: true }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "TAG-1" }
              as: ShopManager
          trigger:
            - call: "POST /rental-assets"
              payload: { product_id: "${prod_id}", asset_tag: "TAG-1" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_DUPLICATE_ASSET_TAG"

      - name: event_full_rejects_over_capacity_entry
        claim_type: aggregate_validation
        grounds: ["validations[priority=12]", "errors[ERR_EVENT_FULL]"]
        distinguishing_aspect: "With capacity 1 and one REGISTERED entry, a second entry returns ERR_EVENT_FULL (409)."
        test_recipe:
          setup: ["Two Customers, a PUBLISHED Event capacity 1 with one entry already registered."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ef1@x.com", full_name: "Full One" }
              as: SalesAssociate
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { email: "ef2@x.com", full_name: "Full Two" }
              as: SalesAssociate
              captures: { c2: $.data.id }
            - call: "POST /events"
              payload: { name: "Tiny Comp", sponsor: "BrandB", venue: "Ramp", start_at: "2026-07-13T00:00:00Z", capacity: 1, entry_fee_cents: 2000 }
              as: ShopManager
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/publish"
              payload: {}
              as: ShopManager
            - call: "POST /event-entries"
              payload: { event_id: "${ev_id}", customer_id: "${c1}" }
              as: Customer
              as_user_id: "${c1}"
          trigger:
            - call: "POST /event-entries"
              payload: { event_id: "${ev_id}", customer_id: "${c2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_EVENT_FULL"
            - "Event.${ev_id}.entry_count == 1"

      - name: loyalty_redeem_insufficient_points_returns_402
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "Redeeming 50 points from a customer with 0 points returns ERR_INSUFFICIENT_POINTS (402)."
        test_recipe:
          setup: ["A fresh Customer with 0 loyalty points."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ip@x.com", full_name: "In Sufficient" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { kind: "REDEEM", points: 50 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INSUFFICIENT_POINTS"
            - "Customer.${cust_id}.loyalty_points == 0"

      - name: lesson_end_before_start_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /lessons with end_at <= start_at returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A Coach and a Customer."]
          setup_api_calls:
            - call: "POST /coaches"
              payload: { name: "Coach E", discipline: "SKATE" }
              as: ShopManager
              captures: { coach_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "tr@x.com", full_name: "Time Range" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /lessons"
              payload: { coach_id: "${coach_id}", customer_id: "${cust_id}", discipline: "SKATE", start_at: "2026-07-08T11:00:00Z", end_at: "2026-07-08T10:00:00Z" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_VALIDATION"

  # --------------------------------------------------------------------- rbac --
  - section: rbac
    instances:
      - name: benchtech_cannot_create_event_forbidden
        claim_type: rbac_denial
        grounds: [roles.BenchTech, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "BenchTech is not authorized for POST /events (ShopManager-exclusive) → ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { name: "Nope", sponsor: "BrandC", venue: "X", start_at: "2026-07-20T00:00:00Z", capacity: 5, entry_fee_cents: 1000 }
              as: BenchTech
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_FORBIDDEN_ROLE"

      - name: customer_cannot_appraise_tradein_forbidden
        claim_type: rbac_denial
        grounds: [roles.Customer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Customer is not authorized for POST /trade-ins/{id}/appraise (ShopManager-exclusive) → ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A Customer and a RECEIVED TradeIn."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rd@x.com", full_name: "Role Denied" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust_id}", item_description: "Old wetsuit", mode: "TRADE_IN" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /trade-ins/${ti_id}/appraise"
              payload: { appraised_value_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_FORBIDDEN_ROLE"
            - "TradeIn.${ti_id}.status == RECEIVED"

  # ---------------------------------------------------------------- endpoints --
  - section: endpoints
    instances:
      - name: customer_get_reflects_earn_computed_read
        claim_type: computed_read
        grounds: [entities.Customer.fields.loyalty_points, entities.Customer.fields.tier]
        distinguishing_aspect: "GET /customers/{id} after an EARN of 50000 reflects loyalty_points 500 and tier SILVER (>= 50000 boundary)."
        test_recipe:
          setup: ["A Customer credited by EARN 50000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cr@x.com", full_name: "Comp Read" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/loyalty-adjustments"
              payload: { kind: "EARN", spend_cents: 50000 }
              as: SalesAssociate
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pts: $.data.loyalty_points, tier: $.data.tier }
          assert:
            - "Customer.${cust_id}.loyalty_points == 500"
            - "Customer.${cust_id}.tier == SILVER"

      - name: products_list_returns_paginated_envelope
        claim_type: response_envelope
        grounds: [response_envelope.pagination_fields]
        distinguishing_aspect: "GET /products returns response_type=array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["Two products exist."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "L-1", name: "One", category: "ACCESSORY", unit_price_cents: 100 }
              as: ShopManager
            - call: "POST /products"
              payload: { sku: "L-2", name: "Two", category: "ACCESSORY", unit_price_cents: 200 }
              as: ShopManager
          trigger:
            - call: "GET /products"
              payload: { limit: 1, offset: 0 }
              as: SalesAssociate
          assert:
            - "response_type == array; total_count == 2 and has_more == true with limit 1"

  # ------------------------------------------ cross-cutting complexity layers --
  - section: cross_cutting
    instances:
      - name: occ_revise_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[revise-supersede-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A revise carrying a stale expected_special_order_version (captured before an intervening revise+quote advanced the version) is rejected ERR_STALE_VERSION (412) even though the order is back in QUOTED."
        test_recipe:
          setup: ["A QUOTED SpecialOrder whose version has advanced past the client's first-observed value via one revise + re-quote round."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "occ@x.com", full_name: "Occ User" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "COMP-OCC", name: "OCC Complete", category: "COMPLETE", unit_price_cents: 20000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 20000 }
              as: ShopManager
              captures: { v_stale: $.data.version }
            - call: "POST /special-orders/${so_id}/revise"
              payload: { expected_special_order_version: "${v_stale}" }
              as: SalesAssociate
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 19000 }
              as: ShopManager
          trigger:
            - call: "POST /special-orders/${so_id}/revise"
              payload: { expected_special_order_version: "${v_stale}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "second revise response data.error_id == ERR_STALE_VERSION"
            - "SpecialOrder.${so_id}.status == QUOTED"

  # -------------------------------------------------------- consistency model --
  - section: consistency
    instances:
      - name: reserve_immediately_visible_on_product_read
        claim_type: immediate_consistency
        grounds: [state_machines.BoardBuild.DRAFT_to_RESERVED, entities.Product.fields.reserved_qty]
        distinguishing_aspect: "Immediately after a build reserve, GET /products/{id} shows reserved_qty and available_qty already reconciled in the same request cycle."
        test_recipe:
          setup: ["A Customer, a Product on_hand 4, a DRAFT BoardBuild qty 2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "imm@x.com", full_name: "Imm Ediate" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "GRIP-IM", name: "Grip IM", category: "GRIP", unit_price_cents: 1000 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/inventory-adjustments"
              payload: { delta_on_hand: 4 }
              as: ShopManager
            - call: "POST /board-builds"
              payload: { customer_id: "${cust_id}", components: [ { product_id: "${prod_id}", qty: 2 } ] }
              as: BenchTech
              captures: { bb_id: $.data.id }
            - call: "POST /board-builds/${bb_id}/reserve"
              payload: {}
              as: BenchTech
          trigger:
            - call: "GET /products/${prod_id}"
              payload: {}
              as: BenchTech
              captures: { rq: $.data.reserved_qty, av: $.data.available_qty }
          assert:
            - "Product.${prod_id}.reserved_qty == 2"
            - "Product.${prod_id}.available_qty == 2"

