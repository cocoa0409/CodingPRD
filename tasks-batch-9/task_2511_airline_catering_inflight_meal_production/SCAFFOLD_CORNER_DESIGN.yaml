            - "UpliftRecord.${upl_id}.spec_deviation_pct == 22.22 == round_half_up(abs(140 - 180) / 180 * 100, 2)"
            - "gross_cost_cents == 227360 == round_half_up(140 * 1450 * 1.12) and net_cost_cents == 227360"
            - "handling_fee_cents == 15915 == round_half_up(227360 * 0.07) — 227360 sits in the 200000..499999 band"
            - "billing_total_cents == 243275 and cost_per_pax_cents == 1263 == round_half_up(227360 / 180)"
            - "GET /audit-findings with flight_id ${f_id} returns one row: finding_type \"SPEC_DEVIATION\", severity \"CRITICAL\", source \"SYSTEM\", penalty_cents == 600000 == 120000 * 5.0, status \"OPEN\""
            - "Airline.${an_id}.open_finding_count == 1, penalty_accrued_cents == 0 (nothing ACCEPTED yet) and status \"ACTIVE\" — below OPEN_FINDING_SUSPEND_THRESHOLD 3"

      - name: voided_cart_items_leave_the_cost_report_input_set_entirely
        claim_type: input_set_filtering
        grounds:
          - calculations.cost_per_passenger_report
          - calculations.spec_compliance_deviation
          - endpoints.GET_/flights/{id}/cost-report
        distinguishing_aspect: |
          The report's input set is ACTIVE CartItems only. Two items totalling the full 180 units report
          1624 cents per passenger and 0.00 deviation; voiding the 20-unit item drops both the money and
          the delivered count, moving the report to 1444 and 11.11 % without touching the plan.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with 180 released AN-Y-STD units split 160 into cart CHL-01 and 20 into cart CHL-02."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_cart2
            - &k_item160 { call: "POST /carts/${cart_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 160 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item160_id: $.data.id } }
            - &k_item20  { call: "POST /carts/${cart2_id}/items", payload: { production_batch_id: "${b_y_id}", qty_units: 20 }, as: LoadMaster, as_user_id: "lm_alice", captures: { item20_id: $.data.id } }
          trigger:
            - { call: "GET /flights/${f_id}/cost-report", payload: {}, as: ComplianceOfficer }
            - { call: "DELETE /carts/${cart2_id}/items/${item20_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /flights/${f_id}/cost-report", payload: {}, as: ComplianceOfficer }
          assert:
            - "report 1: total_pax == 180, gross_cost_cents == 292320 == 259840 + 32480 (rounded per item, then summed), cost_per_pax_cents == 1624, spec_deviation_pct == 0.00, cap_breached == false"
            - "report 1: cabin_breakdown has one ECONOMY entry with cost 292320 and cabin_cpp 1624; FIRST and BUSINESS are excluded because their pax counts are 0"
            - "report 2: gross_cost_cents == 259840, cost_per_pax_cents == 1444 == round_half_up(259840 / 180)"
            - "report 2: spec_deviation_pct == 11.11 == round_half_up(abs(160 - 180) / 180 * 100, 2) — the MAJOR band, though no finding is raised by a read"
            - "cost_cap_per_pax_cents == 6000 and cap_breached == false in both reports"
            - "Flight.${f_id}.units_planned is still 180 — voiding an item never rewrites the plan"

      - name: the_load_factor_ceiling_is_applied_per_cabin_before_the_cabins_are_summed
        claim_type: precision
        grounds:
          - calculations.flight_meal_requirement
          - entities.Flight.fields.units_planned_provisional
          - endpoints.PATCH_/flights/{id}/pax-counts
        distinguishing_aspect: |
          Each cabin's load factor is ceilinged on its own before the cabins are added: 7 + ceil(24.15)
          + ceil(185.525) == 218, whereas ceilinging the 216.675 grand total once gives 217. Editing the
          economy count down to 180 recomputes the same way and reaches 217 by the per-cabin route.
        test_recipe:
          setup:
            - "Airline AN with AN-F-STD (load 0.00), AN-C-STD (load 5.00) and AN-Y-STD (load 2.50)."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_spec_f
            - *k_spec_c
          trigger:
            - &k_flt_prec { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN423", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-FFF", station_code: "OSL", pax_first: 7, pax_business: 23, pax_economy: 181 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
            - { call: "PATCH /flights/${f_id}/pax-counts", payload: { pax_economy: 180 }, as: ScheduleFeedOperator }
          assert:
            - "after the create: total_pax == 211 and units_planned_provisional == 218 == 7 + 25 + 186"
            - "218 is NOT ceil(7 * 1.00 + 23 * 1.05 + 181 * 1.025) == ceil(216.675) == 217 — the ceiling is per cabin"
            - "after the PATCH: total_pax == 210, pax_economy == 180 and units_planned_provisional == 217 == 7 + 25 + 185"
            - "Flight.${f_id}.status == \"SCHEDULED\" and version == 2"

      - name: finding_penalties_are_the_product_of_the_pinned_base_and_severity_constants
        claim_type: constants_applied
        grounds:
          - calculations.audit_penalty
          - entities.Airline.fields.open_finding_count
          - entities.AuditFinding.fields.source
        distinguishing_aspect: |
          penalty_cents is frozen from two constant tables at creation: HACCP_BREACH * CRITICAL is
          500000 * 5.0 == 2500000 while SEAL_MISMATCH * MAJOR is 200000 * 2.5 == 500000. Both findings
          are OPEN so open_finding_count reaches 2 while penalty_accrued_cents — which only sums
          ACCEPTED findings — stays 0, and two open findings still leave the airline ACTIVE.
        test_recipe:
          setup:
            - "Flight AN411 exists and airline AN has no findings yet."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
          trigger:
            - { call: "POST /audit-findings", payload: { airline_id: "${an_id}", flight_id: "${f_id}", finding_type: "HACCP_BREACH", severity: "CRITICAL", evidence_ref: "QA-LOG-77" }, as: ComplianceOfficer, captures: { find_h_id: $.data.id } }
            - { call: "POST /audit-findings", payload: { airline_id: "${an_id}", flight_id: "${f_id}", finding_type: "SEAL_MISMATCH", severity: "MAJOR" }, as: ComplianceOfficer, captures: { find_s_id: $.data.id } }
          assert:
            - "AuditFinding.${find_h_id}.penalty_cents == 2500000 == round_half_up(500000 * 5.0), status \"OPEN\", source \"SYSTEM\""
            - "AuditFinding.${find_s_id}.penalty_cents == 500000 == round_half_up(200000 * 2.5), status \"OPEN\", source \"SYSTEM\""
            - "Airline.${an_id}.open_finding_count == 2, penalty_accrued_cents == 0, status == \"ACTIVE\""
            - "Flight.${f_id}.production_hold == false — two open findings are still below OPEN_FINDING_SUSPEND_THRESHOLD 3"

      - name: the_provisional_and_final_requirement_variants_disagree_on_the_same_flight
        claim_type: variant_selection
        grounds:
          - calculations.flight_meal_requirement
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_and_final_meal_requirement_diverge_on_load_factor_and_special_meals
          rationale: "That §1.8 instance pins both variants on one flight and shows PROVISIONAL applying the load factor while ignoring special orders and FINAL doing the opposite."

      - name: recording_dispositions_switches_the_uplift_to_the_net_consumed_variant
        claim_type: reconciliation
        grounds:
          - calculations.uplift_cost_reconciliation
        excluded_because:
          difficulty_instance: dual_variant_calc / domestic_uplift_net_cost_credits_reuse_and_donate_at_the_weighted_rate
          rationale: "That §1.8 instance walks the whole NET_CONSUMED path — weighted_rate rounded once, credit_basis excluding destroyed units, the recovery percentage — and re-tiers the handling fee on the new net."

      - name: lateness_is_priced_band_by_band_across_the_billable_minutes
        claim_type: tiered_pricing
        grounds:
          - calculations.delivery_lateness_penalty
        excluded_because:
          difficulty_instance: combinatorial_formula / delivery_lateness_prices_each_band_marginally_not_at_a_single_rate
          rationale: "That §1.8 instance spans all three lateness bands on one delivery and contrasts the marginal total with the single-rate figure."

      - name: rounding_the_cabin_blend_in_the_wrong_order_shifts_the_result
        claim_type: weighted_scoring
        grounds:
          - calculations.cost_per_passenger_report
        excluded_because:
          difficulty_instance: combinatorial_formula / cost_per_passenger_rounds_per_cabin_before_blending_not_after
          rationale: "That §1.8 instance uses the three-cabin Tier-L fixture where per-cabin rounding gives 2029 and dividing the grand total gives 2028."

      - name: the_haccp_risk_score_saturates_at_its_ceiling
        claim_type: constants_applied
        grounds:
          - calculations.haccp_risk_score
        excluded_because:
          difficulty_instance: non_linear_state_machine / batch_cycles_twice_through_haccp_hold_and_is_then_barred_from_release
          rationale: "That §1.8 instance walks the 40.00 / 55.00 / 95.00 / 100.00 ladder and shows the min() clamp holding the score at 100.00."

  # =========================================================================
  # Guide section 4 — From Table 4 (Validations)
  # =========================================================================
  - section: validations
    instances:

      - name: releasing_a_batch_whose_latest_hold_temp_check_failed_returns_haccp_hold_active
        claim_type: violation_error
        grounds:
          - validations[priority=80]
          - errors[ERR_HACCP_HOLD_ACTIVE]
          - calculations.haccp_check_verdict
        distinguishing_aspect: |
          Gate (ii) looks at the HIGHEST-sequence_no check per required step, not at the batch status: a
          COMPLETED batch that passed both steps and then failed a re-check of HOLD_TEMP is refused
          release even though no state edge fires from COMPLETED and haccp_rework_rounds is still 0.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch is COMPLETED with CHILL_DOWN 6.0 PASS and HOLD_TEMP 4.0 PASS recorded."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - { call: "POST /production-batches/${b_y_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 5.1 }, as: QaOfficer, captures: { hc_bad_id: $.data.id } }
          trigger:
            - { call: "POST /production-batches/${b_y_id}/release", payload: {}, as: ProductionSupervisor }
          assert:
            - "the re-check has verdict \"FAIL\" (5.1 > HOLD_TEMP_MAX_C 5.0) and sequence_no == 2"
            - "the release returns HTTP 422 with data.error_id == \"ERR_HACCP_HOLD_ACTIVE\""
            - "ProductionBatch.${b_y_id}.production_status == \"COMPLETED\", released_at null, haccp_rework_rounds == 0, haccp_risk_score == 40.00"
            - "gate (i) ERR_HACCP_STEP_MISSING did not fire — both required steps have at least one check"

      - name: completing_a_batch_above_its_planned_quantity_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=100]
          - errors[ERR_PRODUCED_QTY_EXCEEDS_PLAN]
          - entities.ProductionBatch.fields.produced_qty
        distinguishing_aspect: |
          produced_qty is bounded above by planned_qty, so 181 against a plan of 180 is refused and the
          batch stays IN_PRODUCTION with no scrapped_qty written; the boundary value 180 is accepted.
        test_recipe:
          setup:
            - "Flight AN411's CHILL batch of 180 units is IN_PRODUCTION with both required checks PASSing."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
          trigger:
            - { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 181 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${b_y_id}/complete", payload: { produced_qty: 180 }, as: ProductionSupervisor }
          assert:
            - "call 1 -> HTTP 422 ERR_PRODUCED_QTY_EXCEEDS_PLAN; the batch is still \"IN_PRODUCTION\" with produced_qty 0 and scrapped_qty 0"
            - "call 2 -> the batch is \"COMPLETED\" with produced_qty 180 and scrapped_qty 0 — the bound is inclusive"
            - "Flight.${f_id}.units_produced == 180 and units_scrapped == 0"

      - name: first_class_demand_above_the_hot_zone_capacity_with_nowhere_to_overflow_is_rejected
        claim_type: aggregate_validation
        grounds:
          - validations[priority=100]
          - errors[ERR_STORE_CAPACITY_EXCEEDED]
          - calculations.production_plan_zone_allocation
        distinguishing_aspect: |
          The capacity check is an aggregate over the whole plan and is evaluated only AFTER the
          overflow chain has been tried: 130 HOT units exceed ZONE_CAPACITY[HOT] 120, and the 4-hour
          shelf life of AN-F-STD is below OVERFLOW_MIN_SHELF_LIFE_HOURS[HOT] 24, so the 10 surplus units
          cannot spill into CHILL and the whole plan is refused atomically.
        test_recipe:
          setup:
            - "Airline AN with AN-F-STD (HOT, 4h shelf) and a flight AN424 carrying 130 FIRST passengers."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_spec_f
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN424", service_date: "2026-09-15", std_utc: "2026-09-15T10:00:00Z", tail_number: "LN-GGG", station_code: "OSL", pax_first: 130 }, as: ScheduleFeedOperator, captures: { f_id: $.data.id } }
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
          trigger:
            - { call: "POST /flights/${f_id}/production-plan", payload: {}, as: ProductionSupervisor }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_STORE_CAPACITY_EXCEEDED\""
            - "GET /production-batches with flight_id ${f_id} returns total_count == 0 — no partial plan survives"
            - "Flight.${f_id}.status == \"COUNTS_LOCKED\", units_planned == 0, version unchanged from after the lock"

      - name: signing_off_or_sealing_an_empty_cart_returns_invalid_cart_state
        claim_type: violation_error
        grounds:
          - validations[priority=70]
          - errors[ERR_INVALID_CART_STATE]
          - state_machines.Cart.EMPTY_to_BUILDING
        distinguishing_aspect: |
          A cart with no items has never left EMPTY, so build-completion has no edge to take, and a seal
          may only be applied to a BUILT cart — both refusals are priority-70 state checks that fire
          before the seal's own OCC and uniqueness checks.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED and cart CHL-01 exists with no items."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_cart
            - *k_cart
            - *k_getcart
          trigger:
            - { call: "POST /carts/${cart_id}/build-completion", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "POST /carts/${cart_id}/seals", payload: { expected_cart_version: "${cart_v1}", seal_number: "SEAL-AN411-01" }, as: LoadMaster, as_user_id: "lm_alice" }
          assert:
            - "both calls return HTTP 409 with data.error_id == \"ERR_INVALID_CART_STATE\""
            - "Cart.${cart_id}.build_status == \"EMPTY\", seal_status == \"UNSEALED\", seal_number null, seal_count == 0, loaded_units == 0"
            - "the second call was refused on state even though its expected_cart_version was current"

      - name: reusing_a_live_seal_number_on_a_second_cart_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=100]
          - errors[ERR_SEAL_NUMBER_DUPLICATE]
          - entities.Cart.fields.seal_number
        distinguishing_aspect: |
          seal_number uniqueness spans Cart AND WasteManifest, so a second cart of the same flight
          cannot claim a number already held by a sealed cart; a distinct number is accepted immediately
          afterwards, proving the first attempt left no reservation behind.
        test_recipe:
          setup:
            - "Flight AN411 is PLANNED with two built carts: CHL-01 holds 100 units and is SEALED as SEAL-AN411-01, CHL-02 holds 80 units and is BUILT."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - *k_clk_lock
            - *k_lock
            - *k_clk_plan
            - *k_plan
            - *k_clk_prod
            - *k_start
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - *k_clk_cart
            - *k_cart
            - *k_cart2
            - *k_item100a
            - *k_item80
            - *k_build
            - *k_getcart
            - *k_seal
            - { call: "POST /carts/${cart2_id}/build-completion", payload: {}, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "GET /carts/${cart2_id}", payload: {}, as: LoadMaster, as_user_id: "lm_alice", captures: { cart2_v: $.data.version } }
          trigger:
            - { call: "POST /carts/${cart2_id}/seals", payload: { expected_cart_version: "${cart2_v}", seal_number: "SEAL-AN411-01" }, as: LoadMaster, as_user_id: "lm_alice" }
            - { call: "POST /carts/${cart2_id}/seals", payload: { expected_cart_version: "${cart2_v}", seal_number: "SEAL-AN411-02" }, as: LoadMaster, as_user_id: "lm_alice" }
          assert:
            - "call 1 -> HTTP 422 ERR_SEAL_NUMBER_DUPLICATE; Cart.${cart2_id}.seal_status == \"UNSEALED\" and version is unchanged"
            - "call 2 -> Cart.${cart2_id}.seal_status == \"SEALED\", seal_number \"SEAL-AN411-02\", seal_count == 1, sealed_by_user_id \"lm_alice\""
            - "Cart.${cart_id}.seal_number is still \"SEAL-AN411-01\""

      - name: loading_another_flights_batch_into_this_flights_cart_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=90]
          - errors[ERR_CART_FLIGHT_MISMATCH]
          - entities.CartItem.fields.production_batch_id
        distinguishing_aspect: |
          The check compares two rows neither of which is the request target: the referenced batch's
          flight_id against the path cart's flight_id. Both flights are real and both batches are
          RELEASED with matching CHILL storage, so nothing at priority 70 or the storage-class arm of 90
          can mask it.
        test_recipe:
          setup:
            - "Flights AN411 (180 pax) and AN412 (100 pax) each have a RELEASED CHILL batch of AN-Y-STD units."
            - "Cart CHL-01 belongs to AN411."
          setup_api_calls:
            - *k_clk0
            - *k_air_an
            - *k_spec_y
            - *k_flt
            - { call: "POST /flights", payload: { airline_id: "${an_id}", flight_number: "AN412", service_date: "2026-09-15", std_utc: "2026-09-15T12:00:00Z", tail_number: "LN-BBB", station_code: "OSL", pax_economy: 100 }, as: ScheduleFeedOperator, captures: { f2_id: $.data.id } }
            - *k_clk_lock
            - *k_lock
            - { call: "POST /flights/${f2_id}/lock-counts", payload: {}, as: ScheduleFeedOperator }
            - *k_clk_plan
            - *k_plan
            - { call: "POST /flights/${f2_id}/production-plan", payload: {}, as: ProductionSupervisor, captures: { b2_id: "$.data[0].id" } }
            - *k_clk_prod
            - *k_start
            - { call: "POST /production-batches/${b2_id}/start", payload: {}, as: ProductionSupervisor }
            - *k_clk_qa
            - *k_hc_ch
            - *k_hc_hd
            - { call: "POST /production-batches/${b2_id}/haccp-checks", payload: { step_code: "CHILL_DOWN", measured_temp_c: 6.0 }, as: QaOfficer }
            - { call: "POST /production-batches/${b2_id}/haccp-checks", payload: { step_code: "HOLD_TEMP", measured_temp_c: 4.0 }, as: QaOfficer }
            - *k_clk_cmpl
            - *k_cmpl
            - *k_rel
            - { call: "POST /production-batches/${b2_id}/complete", payload: { produced_qty: 100 }, as: ProductionSupervisor }
            - { call: "POST /production-batches/${b2_id}/release", payload: {}, as: ProductionSupervisor }
            - *k_clk_cart
            - *k_cart
          trigger:
            - { call: "POST /carts/${cart_id}/items", payload: { production_batch_id: "${b2_id}", qty_units: 10 }, as: LoadMaster, as_user_id: "lm_alice" }
          assert:
            - "HTTP 422 with data.error_id == \"ERR_CART_FLIGHT_MISMATCH\""
            - "Cart.${cart_id}.loaded_units == 0 and build_status == \"EMPTY\""
            - "GET /cart-items with cart_id ${cart_id} returns total_count == 0"
            - "Flight.${f2_id}.units_loaded == 0 — the foreign batch was untouched"

      - name: ordering_a_meal_against_a_retired_specification_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=90]
          - errors[ERR_SPEC_RETIRED]
          - endpoints.PATCH_/meal-specifications/{id}
        distinguishing_aspect: |
          The specification exists, so priority 60 passes; it is its STATUS that fails at 90. Retiring
          AN-Y-VGML mid-season blocks new orders for it while leaving the row readable.
        test_recipe:
          setup:
