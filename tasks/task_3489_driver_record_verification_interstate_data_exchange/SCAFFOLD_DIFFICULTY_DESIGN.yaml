              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Driver Ten", date_of_birth: "1980-10-10", ssn_last4_hash: "h1010", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
          trigger:
