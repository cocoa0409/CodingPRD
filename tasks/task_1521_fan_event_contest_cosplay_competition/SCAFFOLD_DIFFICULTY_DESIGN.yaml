  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stage_queue_blocked_until_entry_safety_approved
        grounds: ["validations[priority=7]", state_machines.Entry.SUBMITTED_to_SAFETY_APPROVED, "errors[ERR_SAFETY_NOT_APPROVED]"]
        distinguishing_aspect: |
          Entity pair (PerformanceSlot -> Entry): POST /performance-slots is legal
          only when the referenced Entry's safety_status == APPROVED; while the entry
          is SUBMITTED (safety PENDING) the same request is rejected, and it succeeds
          after the SafetyOfficer approves — with no change to the slot payload.
        test_recipe:
          setup: ["Contest JUDGING; entry e (requires_prejudging=false) SUBMITTED with safety_status PENDING; contestant has LIVESTREAM consent"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
          trigger:
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { err: $.data.error_id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps_st: $.data.status } }
          assert:
            - "Before approval: 409 ERR_SAFETY_NOT_APPROVED"
            - "After approval: 201, slot status == QUEUED and Entry.${e}.status == STAGE_QUEUED"

      - name: prize_create_requires_category_tabulated
        grounds: [state_machines.Category.SCORING_to_TABULATED, "errors[ERR_CATEGORY_NOT_TABULATED]", entities.PrizeAward.fields.entry_id]
        distinguishing_aspect: |
          Entity pair (PrizeAward -> Category) — different pair than
          PerformanceSlot -> Entry: award creation is rejected while the category is
          SCORING and succeeds for the same rank once the category is TABULATED, with
          entry_id auto-selected from the tabulated placement.
        test_recipe:
          setup: ["Contest JUDGING; category SCORING with one PERFORMED entry (final-ready sheet LOCKED); no tabulate yet"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 100000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps: $.data.id } }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e}", phase: "STAGE", craftsmanship: 9, accuracy: 9, presentation: 9 }, as: Judge, as_user_id: "${j1}", captures: { s: $.data.id } }
            - { call: "POST /scoresheets/${s}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead }
          trigger:
            - { call: "POST /prize-awards", payload: { category_id: "${cat}", rank: 1 }, as: Treasurer, as_user_id: "tr_1", captures: { err: $.data.error_id } }
            - { call: "POST /categories/${cat}/tabulate", payload: {}, as: ContestLead }
            - { call: "POST /prize-awards", payload: { category_id: "${cat}", rank: 1 }, as: Treasurer, as_user_id: "tr_1", captures: { aw: $.data.id, aw_entry: $.data.entry_id, aw_val: $.data.value_cents } }
          assert:
            - "While SCORING: 409 ERR_CATEGORY_NOT_TABULATED"
            - "After tabulate: 201; PrizeAward.entry_id == ${e} (selector: PLACED entry with placement_rank == 1)"
            - "PrizeAward.value_cents == 50000 (purse 100000 rank-1 split)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: prejudge_slot_panel_half_open_adjacency
        grounds: ["validations[priority=11]", "errors[ERR_SLOT_OVERLAP]", entities.PreJudgingSlot.fields.panel_name]
        distinguishing_aspect: |
          Interval semantics: mutual exclusion with HALF-OPEN adjacency on the
          (category_id, panel_name) resource — 11:00-12:00 is legal right after
          10:00-11:00, 10:30-11:30 is not, and the same time on panel P2 is not a conflict.
        test_recipe:
          setup: ["Contest (SETUP) with one category; slot P1 10:00-11:00 already created"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T10:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead, captures: { sl1: $.data.id } }
          trigger:
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T10:30:00Z", end_at: "2026-08-15T11:30:00Z" }, as: ContestLead, captures: { err: $.data.error_id } }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T11:00:00Z", end_at: "2026-08-15T12:00:00Z" }, as: ContestLead, captures: { sl2: $.data.id, sl2_st: $.data.status } }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P2", start_at: "2026-08-15T10:30:00Z", end_at: "2026-08-15T11:30:00Z" }, as: ContestLead, captures: { sl3: $.data.id } }
          assert:
            - "Overlapping P1 10:30-11:30 rejected: 409 ERR_SLOT_OVERLAP"
            - "Back-to-back P1 11:00-12:00 accepted (half-open: end == start is not overlap), status OPEN"
            - "Same wall-clock overlap on a different panel P2 accepted"

      - name: green_room_aggregate_capacity_boundary
        grounds: [calculations.green_room_overlap_count, "errors[ERR_GREEN_ROOM_FULL]", entities.GreenRoomBooking.fields.room_name]
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY (not mutual exclusion) on a
          different resource (GreenRoomBooking.room_name) — up to 4 mutually
          overlapping bookings are legal, the 5th overlapping one is rejected, and a
          half-open-adjacent 5th booking (13:00 after 12:00-13:00) is legal.
        test_recipe:
          setup: ["Contest exists; contestants c1..c4 each hold a BOOKED NORTH booking 2026-08-15T12:00-13:00 (logical clock still at default 2026-08-01, so none are in the past)"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Three", email: "c3@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c3: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Four", email: "c4@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c4: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Five", email: "c5@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c5: $.data.id } }
            - { call: "POST /green-room-bookings", payload: { contestant_id: "${c1}", contest_id: "${cont}", room_name: "NORTH", start_at: "2026-08-15T12:00:00Z", end_at: "2026-08-15T13:00:00Z" }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /green-room-bookings", payload: { contestant_id: "${c2}", contest_id: "${cont}", room_name: "NORTH", start_at: "2026-08-15T12:00:00Z", end_at: "2026-08-15T13:00:00Z" }, as: Contestant, as_user_id: "${c2}" }
            - { call: "POST /green-room-bookings", payload: { contestant_id: "${c3}", contest_id: "${cont}", room_name: "NORTH", start_at: "2026-08-15T12:00:00Z", end_at: "2026-08-15T13:00:00Z" }, as: Contestant, as_user_id: "${c3}" }
            - { call: "POST /green-room-bookings", payload: { contestant_id: "${c4}", contest_id: "${cont}", room_name: "NORTH", start_at: "2026-08-15T12:00:00Z", end_at: "2026-08-15T13:00:00Z" }, as: Contestant, as_user_id: "${c4}" }
          trigger:
            - { call: "POST /green-room-bookings", payload: { contestant_id: "${c5}", contest_id: "${cont}", room_name: "NORTH", start_at: "2026-08-15T12:00:00Z", end_at: "2026-08-15T13:00:00Z" }, as: Contestant, as_user_id: "${c5}", captures: { err: $.data.error_id } }
            - { call: "POST /green-room-bookings", payload: { contestant_id: "${c5}", contest_id: "${cont}", room_name: "NORTH", start_at: "2026-08-15T13:00:00Z", end_at: "2026-08-15T14:00:00Z" }, as: Contestant, as_user_id: "${c5}", captures: { b5_st: $.data.status } }
          assert:
            - "5th fully-overlapping booking rejected: 409 ERR_GREEN_ROOM_FULL (overlap count 4 == GREEN_ROOM_CAPACITY)"
            - "Adjacent booking starting exactly at 13:00 (prior end) accepted: status BOOKED"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: prize_budget_award_revoke_conservation
        grounds: [state_machines.PrizeAward.APPROVED_to_REVOKED, entities.ContestEvent.fields.budget_reserved_cents, entities.ContestEvent.fields.budget_available_cents]
        distinguishing_aspect: |
          Conserved quantity: prize money. Invariant
          prize_budget_cents == budget_reserved_cents + budget_available_cents
          holds before and after create(50000)+approve+revoke; revocation fully
          restores available budget to 100000.
        test_recipe:
          setup: ["Category TABULATED with one PLACED entry; contest prize_budget_cents 100000; purse 100000 (rank1 value 50000)"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 100000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 100000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [], requires_prejudging: false }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_CLOSED" }, as: ContestLead }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "JUDGING" }, as: ContestLead }
            - { call: "POST /judges", payload: { contest_id: "${cont}", display_name: "J1", category_ids: ["${cat}"] }, as: ContestLead, captures: { j1: $.data.id } }
            - { call: "POST /performance-slots", payload: { entry_id: "${e}", sequence_number: 1, duration_seconds: 120 }, as: StageManager, captures: { ps: $.data.id } }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "ON_STAGE" }, as: StageManager }
            - { call: "POST /performance-slots/${ps}/advance", payload: { to: "COMPLETED" }, as: StageManager }
            - { call: "POST /scoresheets", payload: { entry_id: "${e}", phase: "STAGE", craftsmanship: 9, accuracy: 9, presentation: 9 }, as: Judge, as_user_id: "${j1}", captures: { s: $.data.id } }
            - { call: "POST /scoresheets/${s}/submit", payload: {}, as: Judge, as_user_id: "${j1}" }
            - { call: "POST /categories/${cat}/lock-scoresheets", payload: {}, as: ContestLead }
            - { call: "POST /categories/${cat}/tabulate", payload: {}, as: ContestLead }
          trigger:
            - { call: "POST /prize-awards", payload: { category_id: "${cat}", rank: 1 }, as: Treasurer, as_user_id: "tr_1", captures: { aw: $.data.id, aw_val: $.data.value_cents } }
            - { call: "GET /contest-events/${cont}", payload: {}, as: Treasurer, captures: { res1: $.data.budget_reserved_cents, avail1: $.data.budget_available_cents } }
            - { call: "POST /prize-awards/${aw}/approve", payload: {}, as: Treasurer, as_user_id: "tr_2" }
            - { call: "POST /prize-awards/${aw}/revoke", payload: {}, as: ContestLead, captures: { aw_st: $.data.status } }
            - { call: "GET /contest-events/${cont}", payload: {}, as: Treasurer, captures: { res2: $.data.budget_reserved_cents, avail2: $.data.budget_available_cents } }
          assert:
            - "PrizeAward.value_cents == 50000"
            - "After create: budget_reserved_cents == 50000 and budget_available_cents == 50000 (50000 + 50000 == 100000)"
            - "After revoke: award status == REVOKED"
            - "After revoke: budget_reserved_cents == 0 and budget_available_cents == 100000 — forward award + compensating revoke leave the budget exactly unchanged"

      - name: slot_book_release_count_conservation
        grounds: [state_machines.PreJudgingSlot.OPEN_to_BOOKED, state_machines.PreJudgingSlot.BOOKED_to_OPEN, entities.PreJudgingSlot.fields.booked_entry_id]
        distinguishing_aspect: |
          Conserved quantity: pre-judging slot count (not money). Invariant
          count(BOOKED) + count(OPEN) == total slots (2) holds through
          book-then-release; release also restores booked_entry_id to null.
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; category with two OPEN slots P1 10:00-11:00 and 11:00-12:00; entry e SAFETY_APPROVED"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e: $.data.id } }
            - { call: "POST /entries/${e}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T10:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead, captures: { sl1: $.data.id } }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P1", start_at: "2026-08-15T11:00:00Z", end_at: "2026-08-15T12:00:00Z" }, as: ContestLead, captures: { sl2: $.data.id } }
          trigger:
            - { call: "POST /prejudging-slots/${sl1}/book", payload: { entry_id: "${e}" }, as: Contestant, as_user_id: "${c1}", captures: { sl1_st: $.data.status, sl1_entry: $.data.booked_entry_id } }
            - { call: "GET /prejudging-slots/${sl2}", payload: {}, as: ContestLead, captures: { sl2_st: $.data.status } }
            - { call: "POST /prejudging-slots/${sl1}/release", payload: {}, as: Contestant, as_user_id: "${c1}", captures: { sl1_st2: $.data.status, sl1_entry2: $.data.booked_entry_id } }
          assert:
            - "After book: sl1 BOOKED with booked_entry_id == ${e}; sl2 still OPEN (BOOKED 1 + OPEN 1 == 2)"
            - "After release: sl1 OPEN with booked_entry_id == null (BOOKED 0 + OPEN 2 == 2 — slot count conserved)"
            - "Entry.${e}.status remains SAFETY_APPROVED (release does not regress the entry)"
