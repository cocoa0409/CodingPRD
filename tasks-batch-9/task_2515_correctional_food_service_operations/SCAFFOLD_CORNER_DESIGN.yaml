            - call: "POST /cfs/grievances/${grievance_id}/respond"
              payload: { remedy: "DIET_REINSTATEMENT" }
              as: GrievanceCoordinator
              as_user_id: "gc-001"
              captures: { reinstate_error: $.data.error_id }
            - call: "POST /cfs/grievances/${grievance_id}/respond"
              payload: { remedy: "MENU_CORRECTION", response_note: "Tray line re-briefed on religious tickets." }
              as: GrievanceCoordinator
              as_user_id: "gc-001"
              captures: { final_status: $.data.status, breached: $.data.sla_breached, final_remedy: $.data.remedy }
          assert:
            - "${record_status} == OPEN, ${order_status} == ACTIVE, ${ready_status} == READY_FOR_RESPONSE with ${remedy_required} == true and ${due_at} == 2026-08-06T00:00:00Z"
            - "${no_action_error} == ERR_REMEDY_NOT_PERMITTED with HTTP 409 - diet_remedy_required forbids a null remedy"
            - "${refeed_error} == ERR_REFEED_TARGET_INVALID with HTTP 409 - the named record is OPEN, not CLOSED, so it cannot be disputed"
            - "${reinstate_error} == ERR_REINSTATEMENT_TARGET_INVALID with HTTP 409 - the named order is ACTIVE, not SUSPENDED"
            - "The three rejections leave status at READY_FOR_RESPONSE, remedy null and MealServiceRecord.${record_id}.missed_meal_count untouched"
            - "${final_status} == RESPONDED with ${breached} == false and ${final_remedy} == MENU_CORRECTION, inside the 2026-08-06T00:00:00Z deadline"

  # ===========================================================================
  # From Table 7 (RBAC) - role_model: segregation_of_duties over peer roles
  # ===========================================================================
  - section: rbac
    instances:
      - name: corner_exclusive_operations_are_not_interchangeable
        claim_type: exclusive_operations
        grounds:
          - rbac.ContractAdministrator.exclusive_operations
          - rbac.FoodServiceSupervisor.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Seniority is not a superset: the ContractAdministrator owns facility creation and cycle activation but cannot author a menu cycle, and the FoodServiceSupervisor who owns the cycle cannot create the facility it hangs from - neither role can stand in for the other."
        test_recipe:
          setup:
            - "One DRAFT ServiceContract CFS-2515-R01 and no facilities."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-R01", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-R01", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { fss_denied: $.data.error_id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-R01", name: "North Unit Kitchen", sharps_authorized_count: 12 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${facility_id}", cycle_code: "CYC-R01", cycle_length_days: 1 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { ca_denied: $.data.error_id }
            - call: "POST /cfs/menu-cycles"
              payload: { facility_id: "${facility_id}", cycle_code: "CYC-R01", cycle_length_days: 1 }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
              captures: { cycle_status: $.data.status }
          assert:
            - "${fss_denied} == ERR_UNAUTHORIZED with HTTP 403 - POST /cfs/facilities is ContractAdministrator-exclusive"
            - "${ca_denied} == ERR_UNAUTHORIZED with HTTP 403 - POST /cfs/menu-cycles is FoodServiceSupervisor-exclusive"
            - "Both retries by the owning role succeed: the facility is created and ${cycle_status} == DRAFT"
            - "The 403s are decided before any payload validation, so the identical bodies that were rejected succeed unchanged"

      - name: corner_grievance_coordinator_cannot_author_clinical_records
        claim_type: unauthorized_denial
        grounds:
          - rbac.GrievanceCoordinator
          - rbac.RegisteredDietitian.exclusive_operations
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The role that receives a diet complaint cannot resolve it by writing the diet order or the service record itself; it is confined to the grievance entity it owns while retaining read access to the records it must cite."
