            - "Tank.${tank_id}.construction_phase == 'COMMISSIONED' (terminal) and quality_posture == 'OPEN'"

      - name: threshold_boundary_values_for_examination_escalation
        claim_type: threshold
        excluded_because:
          difficulty_instance: weld_reject_rate_exactly_at_escalation_tier_boundary
          rationale: |
            §1.8 walks the EXAMINATION_TIER threshold at rate 0.2499 / exactly 0.2500 /
            0.2501 and asserts required_examination_pct at each, which is the full
            threshold-boundary claim for weld_reject_rate_escalation.

      - name: tiered_pricing_boundaries_and_straddling
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: permit_surcharge_tier_keyed_on_subtotal_not_total
          rationale: |
            §1.8 exercises DISPOSAL_TIER and SURCHARGE_TIER together, including the
            subtotal-vs-total key confusion and the 1000.00 / 2000.00 boundaries, so the
            tiered-pricing rows for hydrotest_water_and_disposal_cost and
            hydrotest_permit_surcharge are already covered.

      - name: rounding_order_inside_the_cost_aggregate
        claim_type: precision
        excluded_because:
          difficulty_instance: water_cost_round_per_withdrawal_then_sum
          rationale: |
            The load-bearing rounding order (round each withdrawal to cents, then sum)
            is asserted in §1.8 against the alternative of summing volumes first, with
            the cent-level delta spelled out.

      - name: aggregate_running_total_survives_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: water_volume_conserved_across_plan_rejection_cascade
          rationale: |
            §1.8 reconciles the water_volume_ledger before, during and after a cascade
            that cancels reservations, which is the add-then-reverse aggregation claim
            including the MIN_AVAILABLE_VOLUME_GAL floor.

      - name: interval_merge_boundary_semantics
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: rt_window_buffered_closed_interval_exclusion_per_tank
          rationale: |
            Both interval-merge calculations are covered in §1.8: the RT window instance
            asserts the 60-minute buffer on closed intervals, and
            water_withdrawal_half_open_additive_rate_envelope_per_source asserts the
            half-open [start, end) contrast on the same day.

      - name: constraint_propagation_reaches_a_fixed_point
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: nde_rejection_five_hop_posture_suspension_water_release
          rationale: |
            tank_quality_posture is the constraint_propagation rule, and §1.8 drives it
            from 0 to 1 to 3 open nonconformances and back, asserting that the propagation
            settles with no further changes on re-read.

      - name: variant_divergence_on_the_same_inputs
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: settlement_method_cosine_vs_adjacent_pair_divergence
          rationale: |
            Both §1.3 variant rules are covered by the §1.8 dual_variant_calc pair:
            settlement_method_cosine_vs_adjacent_pair_divergence for
            differential_settlement_evaluation and
            coating_dft_spot_average_vs_individual_gauge_divergence for
            coating_dft_acceptance, each feeding one dataset to both variants.

      - name: variant_selection_follows_the_owning_entity_config
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: coating_dft_spot_average_vs_individual_gauge_divergence
          rationale: |
            The §1.8 instance selects the variant from
            CoatingApplication.dft_acceptance_method on two applications that receive
            identical readings, which is exactly the variant-selection claim; there is no
            provisional-to-final switch in this scaffold, so the Reconciliation row does
            not apply.

  # ===========================================================================
  - section: validations
    instances:
      - name: survey_point_grid_mismatch_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_40_ERR_INSUFFICIENT_SURVEY_POINTS
          - errors.ERR_INSUFFICIENT_SURVEY_POINTS
        distinguishing_aspect: |
          The grid rule is stricter than a length check: seven readings on an eight-point
          package and eight readings that repeat point_index 1 both raise
          ERR_INSUFFICIENT_SURVEY_POINTS (409), not ERR_INVALID_REQUEST, because the array
          itself is well formed and non-empty.
        test_recipe:
          setup:
            - "Tank TK-101 with an eight-point foundation package and no surveys yet."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 1, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
          assert:
            - "both calls return HTTP 409 with data.error_id == 'ERR_INSUFFICIENT_SURVEY_POINTS'"
            - "GET /settlement-surveys?foundation_package_id=${fp_id} returns total_count == 0"
            - "FoundationPackage.${fp_id}.status is still 'PLANNED' with baseline_survey_id == null"

      - name: surface_prep_at_the_exact_limits_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_27_ERR_SURFACE_PREP_DEFICIENT
          - validations.priority_28_ERR_DEW_POINT_SPREAD_INSUFFICIENT
          - state_machines.CoatingApplication.transitions.SPEC_ISSUED_to_PREP_ACCEPTED
        distinguishing_aspect: |
          Both prep validations are inclusive at their limit and this instance sits exactly
          on both: achieved_prep_standard equals specified_prep_standard (equality is
          "at least as clean") and dew_point_spread_f is exactly 5.0, so the transition
          succeeds instead of raising either error.
        test_recipe:
          setup:
            - "Tank TK-101 with one SPEC_ISSUED external coating application specified to SSPC_SP6."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 9000, specified_prep_standard: "SSPC_SP6", specified_min_dft_mils: 8.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "acrylic 3 coat" }
              as: ProjectEngineer
              captures: { ca_id: $.data.id }
          trigger:
            - call: "POST /coating-applications/${ca_id}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP6", profile_mils: 2.5, dew_point_spread_f: 5.0 }
              as: QcInspector
          assert:
            - "HTTP 200 with CoatingApplication.${ca_id}.status == 'PREP_ACCEPTED'"
            - "achieved_prep_standard == 'SSPC_SP6', profile_mils == 2.5, dew_point_spread_f == 5.0 are stored"
            - "dft_verdict is still 'NOT_EVALUATED' and rework_cycle_count == 0"

      - name: withdrawal_window_outliving_the_permit_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_48_ERR_WATER_PERMIT_EXPIRED
          - errors.ERR_WATER_PERMIT_EXPIRED
        distinguishing_aspect: |
          The permit test at reservation time looks forward, not at the clock: with the
          logical clock at 2026-08-10 and the permit valid to 2026-09-01, a window whose
          end falls four hours past expiry is refused, while a window ending exactly at the
          expiry instant is accepted - the comparison is permit_expiry_utc >= window_end_utc,
          inclusive.
        test_recipe:
          setup:
            - "Tank TK-101, a water source whose permit expires 2026-09-01T00:00:00Z, and one DRAFT hydrotest plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Hydrant 12", source_type: "MUNICIPAL", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2026-09-01T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 200000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-31T20:00:00Z", window_end_utc: "2026-09-01T04:00:00Z", rate_gpm: 100, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-31T20:00:00Z", window_end_utc: "2026-09-01T00:00:00Z", rate_gpm: 100, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd_ok: $.data.id }
          assert:
            - "the first call returns HTTP 409 with data.error_id == 'ERR_WATER_PERMIT_EXPIRED'"
            - "the rejected create left no trace: WaterSource.${ws_id}.version is still ${ws_v1}, reserved_volume_gal == 0.00 and available_volume_gal == 2000000.00, so the same expected_water_source_version is still current for the second call"
            - "the second call returns HTTP 201 with WaterWithdrawal.${wd_ok}.status == 'RESERVED' and window_end_utc == '2026-09-01T00:00:00Z'"
            - "after the accepted reservation: WaterSource.${ws_id}.reserved_volume_gal == 100000.00 and available_volume_gal == 1900000.00"

      - name: individually_valid_reservations_collectively_exceed_the_permit
        claim_type: aggregate_validation
        grounds:
          - validations.priority_51_ERR_PERMITTED_VOLUME_EXCEEDED
          - calculations.water_volume_ledger
          - errors.ERR_PERMITTED_VOLUME_EXCEEDED
        distinguishing_aspect: |
          Each reservation is individually far below the 2,000,000 gal permit, so the rule
          only bites on the running ledger: 1,200,000 is accepted, a second 1,200,000 is
          refused against the 800,000 that remains, and a reservation of exactly 800,000 -
          the boundary the rule declares acceptable - is then accepted and drives
          available_volume_gal to 0.00.
        test_recipe:
          setup:
            - "Tank TK-101, a 2,000,000 gal water source, one DRAFT hydrotest plan, and no reservations yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectEngineer
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws_id: $.data.id }
            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 2000000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T20:00:00Z", rate_gpm: 400, reserved_volume_gal: 1200000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd1: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
          trigger:
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T00:00:00Z", window_end_utc: "2026-08-12T20:00:00Z", rate_gpm: 400, reserved_volume_gal: 1200000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-12T00:00:00Z", window_end_utc: "2026-08-12T20:00:00Z", rate_gpm: 400, reserved_volume_gal: 800000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
              captures: { wd3: $.data.id }
          assert:
            - "after the setup reservation: WaterWithdrawal.${wd1}.status == 'RESERVED', WaterSource.${ws_id}.reserved_volume_gal == 1200000.00, consumed_volume_gal == 0.00, available_volume_gal == 800000.00"
            - "the first trigger returns HTTP 409 with data.error_id == 'ERR_PERMITTED_VOLUME_EXCEEDED' even though 1200000 is well under the 2000000 permit on its own"
            - "the rejected create leaves the ledger and the version untouched: available_volume_gal == 800000.00 and version is still ${ws_v2}"
            - "the second trigger returns HTTP 201 (800000 exactly equals available_volume_gal, which the rule accepts) with WaterWithdrawal.${wd3}.status == 'RESERVED'"
            - "after the accepted reservation: reserved_volume_gal == 2000000.00 and available_volume_gal == 0.00 - the MIN_AVAILABLE_VOLUME_GAL floor is reached exactly, never crossed"
            - "GET /water-withdrawals?water_source_id=${ws_id} returns total_count == 2"

      - name: holiday_voltage_floor_applies_only_to_internal_linings
        claim_type: conditional_validation
        grounds:
          - validations.priority_29_ERR_HOLIDAY_TEST_VOLTAGE_LOW
          - calculations.coating_dft_acceptance
          - errors.ERR_HOLIDAY_TEST_VOLTAGE_LOW
        distinguishing_aspect: |
          Two applications on the same tank are carried to DFT_RECORDED with identical
          10.0 mil specifications and identical readings; only the INTERNAL_LINING one is
          held to 67.5 V per mil. At 600 V the internal lining is refused (the floor is
          675.0 V) while the external coating is accepted at the very same voltage, so the
          rule's applicability - not its arithmetic - is what is under test.
        test_recipe:
          setup:
            - "Tank TK-101 with an INTERNAL_LINING and an EXTERNAL_COATING application, both specified at 10.0 mils with SPOT_AVERAGE_80_120 and both carried to DFT_RECORDED with a PASS verdict."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "INTERNAL_LINING", surface_area_sqft: 12000, specified_prep_standard: "SSPC_SP10", specified_min_dft_mils: 10.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "epoxy-phenolic 2 coat" }
              as: ProjectEngineer
              captures: { ca_int: $.data.id }
            - call: "POST /coating-applications"
              payload: { tank_id: "${tank_id}", scope: "EXTERNAL_COATING", surface_area_sqft: 9000, specified_prep_standard: "SSPC_SP10", specified_min_dft_mils: 10.0, dft_acceptance_method: "SPOT_AVERAGE_80_120", coating_system: "epoxy / urethane 2 coat" }
              as: ProjectEngineer
              captures: { ca_ext: $.data.id }
            - call: "POST /coating-applications/${ca_int}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 3.0, dew_point_spread_f: 12.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_int}/dft-readings"
              payload: { spot_readings: [ [ 10.0, 11.0, 12.0 ] ] }
              as: QcInspector
            - call: "POST /coating-applications/${ca_ext}/surface-prep"
              payload: { achieved_prep_standard: "SSPC_SP10", profile_mils: 3.0, dew_point_spread_f: 12.0 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_ext}/dft-readings"
              payload: { spot_readings: [ [ 10.0, 11.0, 12.0 ] ] }
              as: QcInspector
          trigger:
            - call: "POST /coating-applications/${ca_int}/holiday-test"
              payload: { holidays_found: 0, test_voltage_v: 600 }
              as: QcInspector
            - call: "POST /coating-applications/${ca_ext}/holiday-test"
              payload: { holidays_found: 0, test_voltage_v: 600 }
              as: QcInspector
          assert:
            - "both applications show dft_verdict == 'PASS' with computed_spot_average_min_mils == 11.00, computed_spot_average_max_mils == 11.00, computed_overall_average_mils == 11.00 and computed_min_gauge_reading_mils == 10.00 before the triggers"
            - "the INTERNAL_LINING call returns HTTP 409 with data.error_id == 'ERR_HOLIDAY_TEST_VOLTAGE_LOW' (600 < 67.5 * 10.0 == 675.0) and CoatingApplication.${ca_int}.status is still 'DFT_RECORDED' with holidays_found == null"
            - "the EXTERNAL_COATING call returns HTTP 200 with CoatingApplication.${ca_ext}.status == 'ACCEPTED', holidays_found == 0 and holiday_test_voltage_v == 600"
            - "Tank.${tank_id}.construction_phase is still 'DESIGN_REGISTERED' - the tank never reached HYDROTEST_PASSED, so accepting a coating does not move the phase"

      - name: weld_log_resolves_the_welder_fk_before_judging_qualification
        claim_type: cascading_validation
        grounds:
          - validations.priority_6_ERR_WELDER_NOT_FOUND
          - validations.priority_25_ERR_WELDER_NOT_QUALIFIED
          - validations.priority_26_ERR_THICKNESS_OUT_OF_QUALIFIED_RANGE
        distinguishing_aspect: |
          The qualification and thickness checks both read fields off the Welder row, so the
          body-FK resolution at priority 6 has to run first: a weld logged under a welder_id
          that resolves to nothing returns ERR_WELDER_NOT_FOUND (404) rather than
          ERR_WELDER_NOT_QUALIFIED, and the identity check at priority 3 is satisfied by
          acting under that same unknown id, which proves the ordering rather than masking it.
        test_recipe:
          setup:
            - "Tank TK-101 with an ACCEPTED foundation, one FITTED course and one FIT_READY seam; one real QUALIFIED welder exists but is not the one referenced."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /foundation-packages"
              payload: { tank_id: "${tank_id}", foundation_type: "RINGWALL_CONCRETE", settlement_evaluation_method: "COSINE_BEST_FIT", permitted_uniform_settlement_in: 6.0, permitted_differential_ratio: 0.005, monitoring_point_count: 8 }
              as: CivilContractor
              captures: { fp_id: $.data.id }
            - call: "POST /settlement-surveys"
              payload: { foundation_package_id: "${fp_id}", fill_percent: 0, point_readings: [ { point_index: 1, elevation_in: 100.000 }, { point_index: 2, elevation_in: 100.000 }, { point_index: 3, elevation_in: 100.000 }, { point_index: 4, elevation_in: 100.000 }, { point_index: 5, elevation_in: 100.000 }, { point_index: 6, elevation_in: 100.000 }, { point_index: 7, elevation_in: 100.000 }, { point_index: 8, elevation_in: 100.000 } ] }
              as: CivilContractor
            - call: "POST /foundation-packages/${fp_id}/acceptance"
              payload: { decision: "ACCEPT" }
              as: ProjectEngineer
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /shell-courses/${course_id}/fitup"
              as: ErectionSuperintendent
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /weld-seams"
              payload: { shell_course_id: "${course_id}", seam_type: "VERTICAL", seam_label: "V1", length_in: 96, sequence_index: 1 }
              as: ErectionSuperintendent
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /weld-seams/${s1}/weld-log"
              payload: { welder_id: "00000000-0000-4000-8000-000000000000" }
              as: Welder
              as_user_id: "00000000-0000-4000-8000-000000000000"
          assert:
            - "HTTP 404 with data.error_id == 'ERR_WELDER_NOT_FOUND' - not ERR_WELDER_IDENTITY_MISMATCH (the acting id matches the body) and not ERR_WELDER_NOT_QUALIFIED (there is no row to judge)"
            - "WeldSeam.${s1}.status is still 'FIT_READY' with welder_id == null and welded_at_utc == null"
            - "Welder.${w1_id} is untouched: qualification_status == 'QUALIFIED' and last_weld_date_utc == null"
            - "ShellCourse.${course_id}.status is still 'FITTED'"

      - name: priority_ordering_between_simultaneously_violated_rules
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: seam_state_outranks_welder_qualification_safety
          rationale: |
            §1.8 dedicates three instances to this row -
            seam_state_outranks_welder_qualification_safety,
            withdrawal_rate_temporal_outranks_permit_volume_fiscal and
            host_course_referential_outranks_clearance_constraint - each violating two
            rules at once and asserting the lower-priority error is the one returned.

      - name: validity_that_depends_on_another_entity_state
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: hydrotest_approval_gate_reads_tank_quality_posture
          rationale: |
            §1.8 covers this row three times over - the approval gate reading
            Tank.quality_posture, the weld-log gate reading Welder.qualification_status and
            the installation gate reading the host ShellCourse.status - each asserted in
            both the passing and the failing configuration.

  # ===========================================================================
  - section: endpoints
    instances:
      - name: water_source_create_then_read_then_list
        claim_type: standard_crud
        grounds:
          - endpoints.POST_water_sources
          - endpoints.GET_water_sources
          - endpoints.GET_water_sources_water_source_id
        distinguishing_aspect: |
          The scaffold declares no update and no delete endpoint for any entity, so the CRUD
          row reduces to create / read-one / read-many, and this instance shows the three
          agreeing on the same row while the collection filter narrows by source_type.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /water-sources"
              payload: { source_name: "Riverside Intake", source_type: "RIVER", permitted_volume_gal: 2000000, max_concurrent_rate_gpm: 900, water_cost_usd_per_kgal: 3.33, disposal_cost_usd_per_kgal: 2.10, permit_expiry_utc: "2027-06-30T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws1: $.data.id }
            - call: "POST /water-sources"
              payload: { source_name: "Municipal Hydrant 12", source_type: "MUNICIPAL", permitted_volume_gal: 500000, max_concurrent_rate_gpm: 250, water_cost_usd_per_kgal: 4.10, disposal_cost_usd_per_kgal: 2.55, permit_expiry_utc: "2027-01-31T00:00:00Z" }
              as: ProjectEngineer
              captures: { ws2: $.data.id }
            - call: "GET /water-sources/${ws2}"
              as: AuthorizedInspector
            - call: "GET /water-sources"
              payload: { source_type: "RIVER" }
              as: AuthorizedInspector
          assert:
            - "both creates return HTTP 201 with version == 1 and available_volume_gal equal to permitted_volume_gal"
            - "GET /water-sources/${ws2} returns HTTP 200 with source_name == 'Municipal Hydrant 12', max_concurrent_rate_gpm == 250 and available_volume_gal == 500000.00"
            - "the filtered list returns response_type == 'array' with total_count == 1, has_more == false and data[0].id == ${ws1}"
            - "an unfiltered GET /water-sources returns total_count == 2"

      - name: welder_renew_action_restarts_the_continuity_window
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_welders_welder_id_qualification_actions
          - state_machines.Welder.transitions.LAPSED_to_QUALIFIED
          - entities.Welder.fields.continuity_expires_at_utc
        distinguishing_aspect: |
          The action endpoint carries the only path back from LAPSED, and its side effects are
          asymmetric: last_weld_date_utc and continuity_expires_at_utc are rewritten from the
          supplied effective_date_utc while qualification_date_utc - the original performance
          test - is deliberately preserved.
        test_recipe:
          setup:
            - "Welder W-07 qualified 2026-06-01 with the default 180-day continuity limit, so continuity expires 2026-11-28; the clock is then moved past expiry to 2026-12-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
            - call: "POST /welders"
              payload: { welder_stamp: "W-07", full_name: "R. Alvarez", process: "SMAW", qualified_positions: [ "3G" ], welder_qualified_thickness_max_in: 0.75, wps_number: "WPS-SMAW-01", wps_qualified_thickness_max_in: 0.75, qualification_date_utc: "2026-06-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
              captures: { w1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
            - call: "GET /welders/${w1_id}"
              as: AuthorizedInspector
              as_user_id: "ai-1"
          trigger:
            - call: "POST /welders/${w1_id}/qualification-actions"
              payload: { action: "RENEW", effective_date_utc: "2026-12-01T00:00:00Z", remarks: "renewal test coupon passed" }
              as: AuthorizedInspector
              as_user_id: "ai-1"
          assert:
            - "the setup GET already reports qualification_status == 'LAPSED': the status is re-evaluated against the logical clock on read, because 2026-12-01 is strictly after continuity_expires_at_utc == '2026-11-28T00:00:00Z'"
            - "the RENEW returns HTTP 200 with qualification_status == 'QUALIFIED'"
            - "last_weld_date_utc == '2026-12-01T00:00:00Z' and continuity_expires_at_utc == '2027-05-30T00:00:00Z' (effective date + 180 days)"
            - "qualification_date_utc is still '2026-06-01T00:00:00Z' and revoked_at_utc == null"
            - "GET /welders?qualification_status=QUALIFIED returns total_count == 1"

      - name: plate_lot_allocation_links_lot_and_course
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_plate_lots_plate_lot_id_allocations
          - calculations.plate_steel_ledger
          - entities.ShellCourse.fields.allocated_plate_lot_id
        distinguishing_aspect: |
          One call touches three rows: the lot's weight ledger, the course's allocation
          pointer and the tank's steel aggregate. The endpoint returns the ShellCourse (not
          the lot), and the association is visible from both sides afterwards.
        test_recipe:
          setup:
            - "Tank TK-101 with one SPECIFIED course and one RECEIVED plate lot of 10 x 1250.5 lb == 12505.00 lb."
          setup_api_calls:
            - call: "POST /tanks"
              payload: { tank_tag: "TK-101", diameter_ft: 100, shell_height_ft: 40, design_liquid_level_ft: 40, product_specific_gravity: 0.85, joint_efficiency: 1.00, corrosion_allowance_in: 0.0625, bottom_thickness_in: 0.25, bottom_minimum_thickness_in: 0.10, assumed_corrosion_rate_ipy: 0.01 }
              as: ProjectEngineer
              captures: { tank_id: $.data.id }
            - call: "POST /shell-courses"
              payload: { tank_id: "${tank_id}", course_number: 1, course_width_ft: 8, plate_thickness_in: 0.4375, material_spec: "A516-70", allowable_stress_design_psi: 23200, allowable_stress_test_psi: 24900 }
              as: ProjectEngineer
              captures: { course_id: $.data.id }
            - call: "POST /plate-lots"
              payload: { tank_id: "${tank_id}", mill_name: "Gary Works", heat_number: "H-4471", thickness_in: 0.4375, plate_count: 10, plate_weight_lb: 1250.5, unit_cost_usd_per_lb: 0.62 }
              as: ErectionSuperintendent
              captures: { lot_id: $.data.id }
            - call: "POST /plate-lots/${lot_id}/status-transitions"
