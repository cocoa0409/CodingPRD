scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: line_rental_full_term_vs_weather_prorated
        grounds:
          - calculations.line_rental_charge
          - calculations.weather_refund_amount
          - state_machines.RentalOrder.field=booking_status.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          line_rental_charge (variant full_term) prices an OrderLine over the full
          rental_days span; weather_refund_amount (variant prorated_weather_refund)
          reverses charges on a RentalOrder/Customer-credit domain — same per-unit
          price, different subject entity (OrderLine pricing vs Order refund + Customer credit).
        test_recipe:
          setup:
            - "CatalogItem CHAIR: daily_rate_cents=200, multi_day_discount_pct=0.20, deposit_per_unit_cents=50, requires_cleaning=false, requires_coi=false, total_units=100."
            - "Customer C1; WILL_CALL order O1 for 3 inclusive days (2026-06-01..2026-06-03), one line of 100 chairs."
            - "Order confirmed: line_rental_cents=52000 (per_unit 520 * 100), deposit_total=5000, grand_total=52000 (WILL_CALL delivery=0)."
            - "A WARNING WeatherEvent exists for the order — but order fulfillment=WILL_CALL has no zone; this instance asserts the rental pricing only, weather variant asserted in instance 2."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-STD", name: "Folding Chair", category: "CHAIR", total_units: 100, daily_rate_cents: 200, multi_day_discount_pct: 0.20, deposit_per_unit_cents: 50, requires_cleaning: false, requires_coi: false }
              as: RentalAgent
              captures: { chair_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", phone: "555-0001" }
              as: RentalAgent
              captures: { c1_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c1_id}", fulfillment: "WILL_CALL", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-03T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /orders/${o1_id}/lines"
              payload: { item_id: "${chair_id}", quantity: 100 }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { o1_v2: $.data.version }
          trigger:
            - call: "POST /orders/${o1_id}/confirm"
              payload: { expected_order_version: "${o1_v2}" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { line0_rental: $.data.rental_subtotal_cents }
          assert:
            - "RentalOrder.${o1_id}.rental_subtotal_cents == 52000"
            - "RentalOrder.${o1_id}.deposit_total_cents == 5000"
            - "RentalOrder.${o1_id}.grand_total_cents == 52000"

      - name: weather_refund_confirmed_full_vs_fulfilled_deposit_only
        grounds:
          - calculations.weather_refund_amount
          - calculations.customer_account_credit
          - state_machines.RentalOrder.field=booking_status.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          weather_refund_amount variant pre_fulfillment_full (CONFIRMED) refunds
          rental+cleaning+delivery and releases deposit; variant
          post_fulfillment_deposit_only (FULFILLED) refunds nothing and only
          releases deposit — divergent outputs from identical pricing inputs,
          on the Customer.account_credit_cents domain.
        test_recipe:
          setup:
            - "CatalogItem TENT: daily_rate_cents=30000, multi_day_discount_pct=0.25, deposit_per_unit_cents=20000, requires_coi=true, total_units=5."
            - "Customer C2; Venue V2 (zone LOCAL) with an APPROVED COI covering 2026-08-10..2026-08-12."
            - "DELIVERY order O2 (2026-08-10..2026-08-11, 2 inclusive days), one line of 1 tent. Confirmed: rental_subtotal=52500 (per_unit 52500*1), delivery_fee=5000 (LOCAL base, 1 unit, subtotal<200000), grand_total=57500, deposit_total=20000."
            - "WARNING WeatherEvent for zone LOCAL on 2026-08-10."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "TENT-20X20", name: "20x20 Tent", category: "TENT", total_units: 5, daily_rate_cents: 30000, multi_day_discount_pct: 0.25, deposit_per_unit_cents: 20000, requires_coi: true }
              as: RentalAgent
              captures: { tent_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", phone: "555-0002" }
              as: RentalAgent
              captures: { c2_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c2_id}", name: "Garden Hall", address: "1 Park Rd", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { v2_id: $.data.id }
            - call: "POST /venues/${v2_id}/certificates"
              payload: { carrier_name: "Acme Ins", coverage_start: "2026-08-10T00:00:00.000Z", coverage_end: "2026-08-12T00:00:00.000Z", coverage_amount_cents: 100000000 }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { coi2_id: $.data.id }
            - call: "POST /venues/${v2_id}/certificates/${coi2_id}/approve"
              payload: {}
              as: RentalAgent
            - call: "POST /weather-events"
              payload: { delivery_zone: "LOCAL", severity: "WARNING", effective_date: "2026-08-10T00:00:00.000Z" }
              as: RentalAgent
            - call: "POST /orders"
              payload: { customer_id: "${c2_id}", venue_id: "${v2_id}", fulfillment: "DELIVERY", event_start: "2026-08-10T00:00:00.000Z", event_end: "2026-08-11T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { o2_id: $.data.id }
            - call: "POST /orders/${o2_id}/lines"
              payload: { item_id: "${tent_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c2_id}"
              captures: { o2_v: $.data.version }
            - call: "POST /orders/${o2_id}/confirm"
              payload: { expected_order_version: "${o2_v}" }
              as: Customer
              as_user_id: "${c2_id}"
          trigger:
            - call: "POST /orders/${o2_id}/weather-cancel"
              payload: {}
              as: Customer
              as_user_id: "${c2_id}"
          assert:
            - "RentalOrder.${o2_id}.booking_status == CANCELLED"
            - "RentalOrder.${o2_id}.settlement_status == DEPOSIT_RELEASED"
            - "Customer.${c2_id}.account_credit_cents == 77500"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: delivery_fee_multi_input_nonlinear_mode_a
        grounds:
          - calculations.delivery_fee
          - entities.Venue.fields.delivery_zone
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a): delivery_fee combines >=3 inputs (fulfillment, delivery_zone,
          total reserved units, rental_subtotal) with nested conditional branches —
          base by zone, +surcharge if units>=100, base waived if subtotal>=200000 —
          a non-linear interaction, not a tiered rate on one metric.
        test_recipe:
          setup:
            - "CatalogItem CHAIR2: daily_rate_cents=200, multi_day_discount_pct=0.20, deposit_per_unit_cents=0, total_units=200, requires_coi=false."
            - "Customer C3; Venue V3 (zone EXTENDED)."
            - "DELIVERY order O3 (2026-06-01..2026-06-03, 3 days), one line of 100 chairs => rental_subtotal=52000 (<200000 no waiver), 100 units (>=100 surcharge)."
            - "Expected delivery_fee = EXTENDED base 9000 + surcharge 4000 = 13000."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-2", name: "Chair 2", category: "CHAIR", total_units: 200, daily_rate_cents: 200, multi_day_discount_pct: 0.20, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { ch2_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", phone: "555-0003" }
              as: RentalAgent
              captures: { c3_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c3_id}", name: "Far Field", address: "9 Rural Rd", delivery_zone: "EXTENDED" }
              as: Customer
              as_user_id: "${c3_id}"
              captures: { v3_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c3_id}", venue_id: "${v3_id}", fulfillment: "DELIVERY", event_start: "2026-06-01T00:00:00.000Z", event_end: "2026-06-03T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c3_id}"
              captures: { o3_id: $.data.id }
            - call: "POST /orders/${o3_id}/lines"
              payload: { item_id: "${ch2_id}", quantity: 100 }
              as: Customer
              as_user_id: "${c3_id}"
              captures: { o3_v: $.data.version }
          trigger:
            - call: "POST /orders/${o3_id}/confirm"
              payload: { expected_order_version: "${o3_v}" }
              as: Customer
              as_user_id: "${c3_id}"
          assert:
            - "RentalOrder.${o3_id}.rental_subtotal_cents == 52000"
            - "RentalOrder.${o3_id}.delivery_fee_cents == 13000"
            - "RentalOrder.${o3_id}.grand_total_cents == 65000"

      - name: line_rental_round_then_multiply_order_mode_b
        grounds:
          - calculations.line_rental_charge
          - entities.CatalogItem.fields.multi_day_discount_pct
          - entities.OrderLine.fields.line_rental_cents
        distinguishing_aspect: |
          Mode (b): the multi-day discounted per-unit price is rounded to whole
          cents BEFORE multiplying by quantity (round-then-multiply). With
          daily=10, disc=0.15, 2 days, qty=4: pinned order yields 76 cents;
          multiply-then-round would yield 74 — the scaffold pins round-then-multiply.
        test_recipe:
          setup:
            - "CatalogItem MICRO: daily_rate_cents=10, multi_day_discount_pct=0.15, deposit_per_unit_cents=0, total_units=50, requires_coi=false, requires_cleaning=false."
            - "Customer C4; WILL_CALL order O4 for 2 inclusive days, one line of 4 units."
            - "disc_day = round_half_up(10 * 0.85) = round_half_up(8.5) = 9; per_unit = 10 + 9 = 19; line_rental = 19 * 4 = 76."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "MICRO-1", name: "Micro Item", category: "TABLE", total_units: 50, daily_rate_cents: 10, multi_day_discount_pct: 0.15, deposit_per_unit_cents: 0, requires_cleaning: false, requires_coi: false }
              as: RentalAgent
              captures: { micro_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", phone: "555-0004" }
              as: RentalAgent
              captures: { c4_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c4_id}", fulfillment: "WILL_CALL", event_start: "2026-09-01T00:00:00.000Z", event_end: "2026-09-02T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c4_id}"
              captures: { o4_id: $.data.id }
            - call: "POST /orders/${o4_id}/lines"
              payload: { item_id: "${micro_id}", quantity: 4 }
              as: Customer
              as_user_id: "${c4_id}"
              captures: { o4_v: $.data.version }
          trigger:
            - call: "POST /orders/${o4_id}/confirm"
              payload: { expected_order_version: "${o4_v}" }
              as: Customer
              as_user_id: "${c4_id}"
          assert:
            - "RentalOrder.${o4_id}.rental_subtotal_cents == 76"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_order_parallel_booking_and_settlement_dimensions
        grounds:
          - state_machines.RentalOrder.field=booking_status.FULFILLED_to_RETURNED
          - state_machines.RentalOrder.field=settlement_status.DEPOSIT_HELD_to_DEPOSIT_RELEASED
          - entities.RentalOrder.fields.settlement_status
        distinguishing_aspect: |
          RentalOrder carries TWO independent state axes on one row: booking_status
          advances DRAFT->CONFIRMED->FULFILLED->RETURNED while settlement_status sits
          at DEPOSIT_HELD until a separate settle action moves it to DEPOSIT_RELEASED —
          parallel dimensions, not a single linear pipeline.
        test_recipe:
          setup:
            - "CatalogItem CHAIR3 (total_units=20, daily=200, disc=0, deposit_per_unit=100, requires_coi=false). Customer C5 (DepositAdjuster D1 opaque)."
            - "WILL_CALL order O5, 1 day, 10 chairs; confirmed (booking_status=CONFIRMED, settlement_status=DEPOSIT_HELD, deposit_total=1000)."
            - "Fulfilled then returned (booking_status=RETURNED) while settlement_status stays DEPOSIT_HELD."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-3", name: "Chair 3", category: "CHAIR", total_units: 20, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 100, requires_coi: false }
              as: RentalAgent
              captures: { ch3_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", phone: "555-0005" }
              as: RentalAgent
              captures: { c5_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c5_id}", fulfillment: "WILL_CALL", event_start: "2026-06-10T00:00:00.000Z", event_end: "2026-06-10T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c5_id}"
              captures: { o5_id: $.data.id }
            - call: "POST /orders/${o5_id}/lines"
              payload: { item_id: "${ch3_id}", quantity: 10 }
              as: Customer
              as_user_id: "${c5_id}"
              captures: { o5_v: $.data.version }
            - call: "POST /orders/${o5_id}/confirm"
              payload: { expected_order_version: "${o5_v}" }
              as: Customer
              as_user_id: "${c5_id}"
            - call: "POST /orders/${o5_id}/fulfill"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /orders/${o5_id}/return"
              payload: {}
              as: RentalAgent
          assert:
            - "RentalOrder.${o5_id}.booking_status == RETURNED"
            - "RentalOrder.${o5_id}.settlement_status == DEPOSIT_HELD"

      - name: delivery_run_cyclic_scheduled_attempted_loop
        grounds:
          - state_machines.DeliveryRun.field=status.SCHEDULED_to_ATTEMPTED
          - state_machines.DeliveryRun.field=status.ATTEMPTED_to_SCHEDULED
          - entities.DeliveryRun.fields.attempt_count
        distinguishing_aspect: |
          DeliveryRun loops SCHEDULED -> ATTEMPTED -> SCHEDULED (failed attempt then
          reschedule), incrementing attempt_count on each failure — a genuine cycle
          on the DeliveryRun entity, distinct from RentalOrder's parallel dimensions.
        test_recipe:
          setup:
            - "Crew CR1 (turnaround_minutes=0). Customer C6 with DELIVERY order O6 (event 2026-07-01..2026-07-01) confirmed (1 chair, total_units sufficient)."
            - "DROP_OFF DeliveryRun R6 scheduled 09:00-10:00, marked FAILED -> ATTEMPTED (attempt_count=1)."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-6", name: "Chair 6", category: "CHAIR", total_units: 20, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: false }
              as: RentalAgent
              captures: { ch6_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six", phone: "555-0006" }
              as: RentalAgent
              captures: { c6_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c6_id}", name: "Hall 6", address: "6 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c6_id}"
              captures: { v6_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c6_id}", venue_id: "${v6_id}", fulfillment: "DELIVERY", event_start: "2026-07-01T00:00:00.000Z", event_end: "2026-07-01T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c6_id}"
              captures: { o6_id: $.data.id }
            - call: "POST /orders/${o6_id}/lines"
              payload: { item_id: "${ch6_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c6_id}"
              captures: { o6_v: $.data.version }
            - call: "POST /orders/${o6_id}/confirm"
              payload: { expected_order_version: "${o6_v}" }
              as: Customer
              as_user_id: "${c6_id}"
            - call: "POST /crews"
              payload: { name: "Truck 1", turnaround_minutes: 0 }
              as: RentalAgent
              captures: { cr1_id: $.data.id }
            - call: "POST /delivery-runs"
              payload: { order_id: "${o6_id}", leg: "DROP_OFF", crew_id: "${cr1_id}", window_start: "2026-06-30T09:00:00.000Z", window_end: "2026-06-30T10:00:00.000Z" }
              as: RentalAgent
              captures: { r6_id: $.data.id }
            - call: "POST /delivery-runs/${r6_id}/attempt"
              payload: { outcome: "FAILED" }
              as: RentalAgent
          trigger:
            - call: "POST /delivery-runs/${r6_id}/reschedule"
              payload: { window_start: "2026-06-30T13:00:00.000Z", window_end: "2026-06-30T14:00:00.000Z" }
              as: RentalAgent
          assert:
            - "DeliveryRun.${r6_id}.status == SCHEDULED"
            - "DeliveryRun.${r6_id}.attempt_count == 1"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_releases_deposit_credits_customer_depth3
        grounds:
          - state_machines.RentalOrder.field=booking_status.CONFIRMED_to_CANCELLED
          - state_machines.RentalOrder.field=settlement_status.DEPOSIT_HELD_to_DEPOSIT_RELEASED
          - calculations.customer_account_credit
        distinguishing_aspect: |
          Depth-3 chain from the cancel trigger: cancel mutates booking_status->CANCELLED
          (hop1), which drives settlement_status DEPOSIT_HELD->DEPOSIT_RELEASED and a
          RELEASE DepositLedgerEntry (hop2), which itself recomputes
          Customer.account_credit_cents (hop3). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "CatalogItem CHAIR7 (total_units=50, daily=200, disc=0, deposit_per_unit=300). Customer C7."
            - "WILL_CALL order O7 (1 day, 5 chairs) confirmed: deposit_total=1500, settlement_status=DEPOSIT_HELD, account_credit=0."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-7", name: "Chair 7", category: "CHAIR", total_units: 50, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 300, requires_coi: false }
              as: RentalAgent
              captures: { ch7_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven", phone: "555-0007" }
              as: RentalAgent
              captures: { c7_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c7_id}", fulfillment: "WILL_CALL", event_start: "2026-06-15T00:00:00.000Z", event_end: "2026-06-15T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c7_id}"
              captures: { o7_id: $.data.id }
            - call: "POST /orders/${o7_id}/lines"
              payload: { item_id: "${ch7_id}", quantity: 5 }
              as: Customer
              as_user_id: "${c7_id}"
              captures: { o7_v: $.data.version }
            - call: "POST /orders/${o7_id}/confirm"
              payload: { expected_order_version: "${o7_v}" }
              as: Customer
              as_user_id: "${c7_id}"
              captures: { o7_v_conf: $.data.version }
          trigger:
            - call: "POST /orders/${o7_id}/cancel"
              payload: { expected_order_version: "${o7_v_conf}" }
              as: Customer
              as_user_id: "${c7_id}"
          assert:
            - "RentalOrder.${o7_id}.booking_status == CANCELLED"
            - "RentalOrder.${o7_id}.settlement_status == DEPOSIT_RELEASED"
            - "Customer.${c7_id}.account_credit_cents == 1500"

      - name: order_confirm_holds_deposit_appends_ledger_depth2
        grounds:
          - state_machines.RentalOrder.field=booking_status.DRAFT_to_CONFIRMED
          - state_machines.RentalOrder.field=settlement_status.UNSETTLED_to_DEPOSIT_HELD
          - entities.DepositLedgerEntry.fields.kind
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (confirm): confirm moves booking_status
          DRAFT->CONFIRMED (hop1), which drives settlement_status UNSETTLED->DEPOSIT_HELD
          and appends a HOLD DepositLedgerEntry (hop2). Distinct propagation pattern and
          trigger from the cancel cascade.
        test_recipe:
          setup:
            - "CatalogItem CHAIR8 (total_units=50, daily=200, disc=0, deposit_per_unit=300). Customer C8; WILL_CALL draft order O8 with one line of 5 chairs."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-8", name: "Chair 8", category: "CHAIR", total_units: 50, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 300, requires_coi: false }
              as: RentalAgent
              captures: { ch8_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "C Eight", phone: "555-0008" }
              as: RentalAgent
              captures: { c8_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c8_id}", fulfillment: "WILL_CALL", event_start: "2026-06-16T00:00:00.000Z", event_end: "2026-06-16T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c8_id}"
              captures: { o8_id: $.data.id }
            - call: "POST /orders/${o8_id}/lines"
              payload: { item_id: "${ch8_id}", quantity: 5 }
              as: Customer
              as_user_id: "${c8_id}"
              captures: { o8_v: $.data.version }
          trigger:
            - call: "POST /orders/${o8_id}/confirm"
              payload: { expected_order_version: "${o8_v}" }
              as: Customer
              as_user_id: "${c8_id}"
          assert:
            - "RentalOrder.${o8_id}.settlement_status == DEPOSIT_HELD"
            - "RentalOrder.${o8_id}.deposit_total_cents == 1500"
            - "GET /orders/${o8_id}/deposit-ledger returns exactly one entry with kind == HOLD and amount_cents == 1500"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_coi_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.RentalOrder.field=booking_status.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Pair (state P5: ERR_INVALID_STATE) vs (business_safety P7: ERR_COI_REQUIRED).
          An already-CONFIRMED order with a requires_coi line and no VALID COI fails
          BOTH; the state check (P5) is higher priority, so ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "CatalogItem TENT2 (requires_coi=true, total_units=5, daily=30000, disc=0, deposit_per_unit=0). Customer C9; Venue V9 (LOCAL) with NO approved COI."
            - "DELIVERY order O9 (2026-08-10..2026-08-10). Confirm cannot succeed normally (COI). To reach a CONFIRMED order we first approve a COI, confirm, THEN revoke the COI so the order is CONFIRMED but COI now invalid; a second confirm fails state(409) ahead of COI(422)."
            - "Order O9 is CONFIRMED; COI revoked (Venue.coi_status no longer VALID for window)."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "TENT-2", name: "Tent 2", category: "TENT", total_units: 5, daily_rate_cents: 30000, multi_day_discount_pct: 0, deposit_per_unit_cents: 0, requires_coi: true }
              as: RentalAgent
              captures: { tent2_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c9@x.com", full_name: "C Nine", phone: "555-0009" }
              as: RentalAgent
              captures: { c9_id: $.data.id }
            - call: "POST /venues"
              payload: { customer_id: "${c9_id}", name: "Hall 9", address: "9 St", delivery_zone: "LOCAL" }
              as: Customer
              as_user_id: "${c9_id}"
              captures: { v9_id: $.data.id }
            - call: "POST /venues/${v9_id}/certificates"
              payload: { carrier_name: "Acme", coverage_start: "2026-08-09T00:00:00.000Z", coverage_end: "2026-08-12T00:00:00.000Z", coverage_amount_cents: 100000000 }
              as: Customer
              as_user_id: "${c9_id}"
              captures: { coi9_id: $.data.id }
            - call: "POST /venues/${v9_id}/certificates/${coi9_id}/approve"
              payload: {}
              as: RentalAgent
            - call: "POST /orders"
              payload: { customer_id: "${c9_id}", venue_id: "${v9_id}", fulfillment: "DELIVERY", event_start: "2026-08-10T00:00:00.000Z", event_end: "2026-08-10T00:00:00.000Z" }
              as: Customer
              as_user_id: "${c9_id}"
              captures: { o9_id: $.data.id }
            - call: "POST /orders/${o9_id}/lines"
              payload: { item_id: "${tent2_id}", quantity: 1 }
              as: Customer
              as_user_id: "${c9_id}"
              captures: { o9_v: $.data.version }
            - call: "POST /orders/${o9_id}/confirm"
              payload: { expected_order_version: "${o9_v}" }
              as: Customer
              as_user_id: "${c9_id}"
              captures: { o9_v_conf: $.data.version }
            - call: "POST /venues/${v9_id}/certificates/${coi9_id}/revoke"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /orders/${o9_id}/confirm"
              payload: { expected_order_version: "${o9_v_conf}" }
              as: Customer
              as_user_id: "${c9_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: deposit_settle_state_beats_forfeit_fiscal
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - state_machines.RentalOrder.field=settlement_status.DEPOSIT_HELD_to_DEPOSIT_FORFEITED
        distinguishing_aspect: |
          Pair (business_constraint P12: ERR_NOT_RETURNED) vs (business_fiscal P13:
          ERR_FORFEIT_EXCEEDS_HELD). A CONFIRMED-but-not-RETURNED order with a forfeit
          amount exceeding the held balance fails both; P12 (not returned) is higher
          priority, so ERR_NOT_RETURNED wins — a different error-category pair than instance 1.
        test_recipe:
          setup:
            - "CatalogItem CHAIR10 (total_units=20, daily=200, deposit_per_unit=100). Customer C10; DepositAdjuster D1."
            - "WILL_CALL order O10 (1 day, 5 chairs) CONFIRMED (deposit_total=500, DEPOSIT_HELD) but NOT fulfilled/returned (booking_status=CONFIRMED)."
          setup_api_calls:
            - call: "POST /catalog-items"
              payload: { sku: "CHAIR-10", name: "Chair 10", category: "CHAIR", total_units: 20, daily_rate_cents: 200, multi_day_discount_pct: 0, deposit_per_unit_cents: 100, requires_coi: false }
              as: RentalAgent
