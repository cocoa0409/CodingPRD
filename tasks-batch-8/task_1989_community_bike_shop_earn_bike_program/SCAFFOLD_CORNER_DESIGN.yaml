            - { call: "POST /hour-logs/${h1}/approve", payload: { expected_participant_version: "${v1}" }, as: ShopCoordinator, as_user_id: "sc-2", captures: { st: $.data.status } }
          assert:
            - "approve by creator sc-1 -> error_id ERR_REVIEWER_IS_LOGGER (403)"
            - "approve by sc-2 succeeds with the same (unbumped) participant version: HourLog.status == APPROVED"

