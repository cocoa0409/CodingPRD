      - name: entity_backed_callers_are_confined_to_their_own_staff_row
        claim_type: ownership_enforcement
        grounds:
          - validations[priority=6]
          - errors.ERR_NOT_RESOURCE_OWNER
          - errors.ERR_STAFF_NOT_FOUND
        distinguishing_aspect: "Sitter and RemoteObserver are entity_backed:Staff, so X-User-ID is a Staff.id and the ownership comparison differs per resource — the assignment's staff_id for a watch, the station's observer_staff_id for a feed. A wrong-but-real Staff.id is a 403, while an X-User-ID naming no Staff at all is a 404, and the rightful owner's identical call succeeds."
        test_recipe:
          setup:
            - "Unit UNIT-C47 with video_monitoring_enabled true, budget 250000; two admitted patients age 60."
            - "Patient one carries an ACTIVE FALL-only ONE_TO_ONE_SITTER order with a scheduled 08:00-16:00 watch for sitter A; sitter B exists but holds nothing."
            - "Patient two carries an ACTIVE FALL-only VIDEO_MONITORING order; observer O1 owns console CONSOLE-C47 (declared_max_span 2) and observer O2 owns nothing."
