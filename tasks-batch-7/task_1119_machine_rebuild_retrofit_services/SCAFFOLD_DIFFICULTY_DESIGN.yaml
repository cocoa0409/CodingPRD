            - "stage shipping 06-16 (1-day gap after 06-15) rejected with ERR_STAGE_GAP_TOO_SMALL"
            - "stage shipping 06-17 (exactly MIN_GAP_DAYS = 2 days) created PLANNED — buffer boundary inclusive"
            - "stage shipping 2026-05-30 (before window start) rejected with ERR_STAGE_OUTSIDE_WINDOW"
            - "stage returning 2026-07-01 == window ends_at accepted (CLOSED containment bounds) — distinct from the half-open window rule"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: part_stock_conservation_across_reserve_and_cancel
        grounds:
          - calculations.part_stock_conservation
          - state_machines.ProjectPartLine.RESERVED_to_CANCELLED
          - entities.Part.fields.available_quantity
        distinguishing_aspect: |
          Conserved quantity = physical stock units: begin-sourcing reserves 2
          units (available 10 -> 8, reserved 0 -> 2) and the compensating
          line-cancel releases them (available 8 -> 10, reserved 2 -> 0);
          available_quantity + reserved_quantity == stock_quantity == 10 holds
          after both the forward and the compensating action.
        test_recipe:
          setup:
            - "APPROVED MECHANICAL_REBUILD project with one PENDING line (qty 2) on ACTIVE part P-A-119 (stock_quantity 10)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-119", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-119", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 2 }, as: ProjectManager, captures: { line_a: $.data.id } }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/send", payload: {}, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/quote/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /api/projects/${proj}/begin-sourcing", payload: {}, as: ProjectManager }
            - { call: "GET /api/parts/${pa}", payload: {}, as: ProjectManager, captures: { res1: $.data.reserved_quantity, av1: $.data.available_quantity, st1: $.data.stock_quantity } }
            - { call: "POST /api/part-lines/${line_a}/cancel", payload: {}, as: ProjectManager, captures: { line_status: $.data.status } }
            - { call: "GET /api/parts/${pa}", payload: {}, as: ProjectManager, captures: { res2: $.data.reserved_quantity, av2: $.data.available_quantity, st2: $.data.stock_quantity } }
          assert:
            - "after begin-sourcing (forward reserve): reserved_quantity == 2, available_quantity == 8, stock_quantity == 10 — 8 + 2 == 10"
            - "line ${line_a} status == CANCELLED after the compensating cancel"
            - "after cancel (compensation): reserved_quantity == 0, available_quantity == 10, stock_quantity == 10 — 10 + 0 == 10, no drift"

      - name: trade_in_credit_conservation_across_apply_and_revoke
        grounds:
          - calculations.trade_in_credit_conservation
          - "endpoints.POST /api/projects/{id}/trade-in/apply"
          - "endpoints.POST /api/projects/{id}/trade-in/revoke"
        distinguishing_aspect: |
          Conserved quantity = quote money in cents (a different conserved
          quantity from physical stock units): applying the 12000000-cent credit
          drops quote_price_cents from 67998770 to 55998770 and the compensating
          revoke restores exactly 67998770;
          quote_price_cents + applied_trade_in_credit_cents == 67998770 holds
          after both actions.
        test_recipe:
          setup:
            - "MECHANICAL_REBUILD project quoted at 67998770 (commercial QUOTE_DRAFT); second machine M2 of the same customer with an ACCEPTED COST_APPROACH offer (residual 12000000; no assessment -> market variant would be 5570020)"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Acme Corp", credit_limit_cents: 1000000000 }, as: PlatformAdmin, captures: { cust: $.data.id } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-120", machine_type: "LATHE", year_of_manufacture: 2018, control_generation: "LEGACY", spindle_hours: 40000 }, as: PlatformAdmin, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /api/machines/${m}/assessments", payload: { positioning_deviation_microns: 10, spindle_runout_microns: 8, backlash_microns: 6, scope_notes: "s", expected_machine_version: "${m_v}" }, as: Assessor, as_user_id: "assessor-1", captures: { asmt: $.data.id } }
            - { call: "POST /api/assessments/${asmt}/submit", payload: {}, as: Assessor, as_user_id: "assessor-1" }
            - { call: "POST /api/assessments/${asmt}/accept", payload: {}, as: ProjectManager }
            - { call: "GET /api/projects?assessment_id=${asmt}", payload: {}, as: ProjectManager, captures: { proj: "$.data[0].id" } }
            - { call: "POST /api/projects/${proj}/decision", payload: { decision: "MECHANICAL_REBUILD", assigned_engineer_id: "eng-1" }, as: ProjectManager }
            - { call: "POST /api/parts", payload: { part_number: "P-A-120", description: "Ball screw", oem_status: "ACTIVE", unit_cost_cents: 1250000, stock_quantity: 10, lead_time_days: 14 }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /api/parts", payload: { part_number: "P-B-120", description: "NC board", oem_status: "OBSOLETE", unit_cost_cents: 800000, stock_quantity: 0, lead_time_days: 60 }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pa}", quantity: 2 }, as: ProjectManager }
            - { call: "POST /api/projects/${proj}/part-lines", payload: { part_id: "${pb}", quantity: 3 }, as: ProjectManager }
            - { call: "GET /api/projects/${proj}", payload: {}, as: ProjectManager, captures: { p_v: $.data.version } }
            - { call: "POST /api/projects/${proj}/quote", payload: { expected_project_version: "${p_v}" }, as: ProjectManager, captures: { q_pre: $.data.quote_price_cents } }
            - { call: "POST /api/machines", payload: { customer_id: "${cust}", serial_number: "SN-121", machine_type: "LATHE", year_of_manufacture: 2016, control_generation: "MODERN", spindle_hours: 30000 }, as: PlatformAdmin, captures: { m2: $.data.id, m2_v: $.data.version } }
            - { call: "POST /api/machines/${m2}/trade-in-offers", payload: { valuation_variant: "COST_APPROACH", expected_machine_version: "${m2_v}" }, as: ProjectManager, captures: { offer: $.data.id, offer_rv: $.data.residual_value_cents, offer_mv: $.data.market_value_cents } }
            - { call: "POST /api/trade-in-offers/${offer}/accept", payload: {}, as: Customer, as_user_id: "${cust}", captures: { offer_status: $.data.status } }
          trigger:
            - { call: "POST /api/projects/${proj}/trade-in/apply", payload: { offer_id: "${offer}" }, as: ProjectManager, captures: { q_applied: $.data.quote_price_cents, credit_applied: $.data.applied_trade_in_credit_cents } }
            - { call: "GET /api/trade-in-offers/${offer}", payload: {}, as: ProjectManager, captures: { ap_set: $.data.applied_project_id } }
            - { call: "POST /api/projects/${proj}/trade-in/revoke", payload: {}, as: ProjectManager, captures: { q_revoked: $.data.quote_price_cents, credit_revoked: $.data.applied_trade_in_credit_cents } }
            - { call: "GET /api/trade-in-offers/${offer}", payload: {}, as: ProjectManager, captures: { ap_cleared: $.data.applied_project_id } }
          assert:
            - "offer ${offer}: residual_value_cents == 12000000 (COST_APPROACH pinned), market_value_cents == 5570020 stored alongside"
            - "pre-apply quote_price_cents == 67998770"
            - "after apply: quote_price_cents == 55998770 AND applied_trade_in_credit_cents == 12000000 — 55998770 + 12000000 == 67998770"
            - "offer.applied_project_id == ${proj} after apply"
            - "after revoke: quote_price_cents == 67998770 AND applied_trade_in_credit_cents == 0 — gross quote restored exactly, no cent of drift"
            - "offer.applied_project_id == null after revoke"
