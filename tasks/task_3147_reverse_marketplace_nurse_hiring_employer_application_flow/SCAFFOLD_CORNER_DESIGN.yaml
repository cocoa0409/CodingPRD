          - errors.ERR_CREDENTIALS_INCOMPLETE
        distinguishing_aspect: "An INACTIVE nurse whose license has since EXPIRED cannot reactivate: ERR_CREDENTIALS_INCOMPLETE at reactivation; the license gate is re-evaluated at reactivation time, not cached from activation."
        test_recipe:
          setup:
            - "Nurse ACTIVE with license expiring 2026-09-03; deactivated on 2026-09-01; clock advanced to 2026-09-04 (license EXPIRED, license_verified false)."
          setup_api_calls:
            - *k_clock
            - *k_nurse
            - call: "POST /marketplace/license-verifications"
              payload: { nurse_id: "${nurse_id}", license_number: "RN-CA-900", license_state: "CA", expiry_date: "2026-09-03" }
              as: Candidate
              as_user_id: "${nurse_id}"
              captures: { lic_exp: $.data.id }
            - *k_submit
