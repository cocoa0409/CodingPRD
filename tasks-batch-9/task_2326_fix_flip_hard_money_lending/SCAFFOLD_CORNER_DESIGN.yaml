        excluded_because:
          difficulty_instance: dual_variant_calc / draw_release_photo_cap_vs_inspection_retainage_on_same_scope_line
          rationale: "The difficulty instance runs the same scope line through both verification legs and asserts the 0.50 photo cap, the 10% versus 20% retainage and the exact release delta, which is the whole dual-variant claim for this calculation."
  - section: consistency_model
    instances:
      - name: every_derived_field_is_correct_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /lending/draw-requests/{id}/fund]
          - entities.Loan
          - entities.RehabLineItem
          - entities.Contractor
          - entities.LedgerEntry
        distinguishing_aspect: "The funding response itself already carries the final numbers, and four follow-up reads of four different entities return values identical to what that one response implied - there is no lag, no recompute-on-read drift and no background reconciliation step between the write and the derived fields on parents, siblings and the ledger."
        test_recipe:
          setup:
            - "loan1 with three approved lines and waiver coverage 3,400,000 (c1) / 700,000 (c2)"
            - "draw d1 INSPECTED at 0.50 / 0.45 / 0.30 and APPROVED at 3,892,500 by svc-01"
            - "clock 2026-09-01T12:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
