scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual_variant_calc (two different entity domains: Policy vs Portfolio)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: policy_value_prospective_vs_investment
        grounds:
          - calculations.calc_policy_value
          - entities.Portfolio.fields.valuation_method
          - entities.ValuationSnapshot.fields.policy_valuations
        distinguishing_aspect: |
          Dual-variant divergence on the POLICY domain: two identical acquired cases
          (same face, premium, LE, price, dates) valued on the same valuation date
          produce 1633437 under PROSPECTIVE and 6164284 under INVESTMENT.
        test_recipe:
          setup:
            - "TX license ACTIVE [2026-01-01, 2027-12-31]; broker owns insured (DOB 1960-01-01, TX)"
            - "Two identical WHOLE_LIFE policies P-1/P-2: face 10000000, AP 600000, issue 2023-01-01, cash_value 0"
            - "Both cases MARKETED with single tier-A LE report base 120 debits [0.1, 0.2] (blended 86), disclosures delivered, offer 6000000 accepted at 455 bps"
            - "Case 1 assigned to PRO portfolio (PROSPECTIVE, 1200 bps), case 2 to INV portfolio (INVESTMENT, 1200 bps)"
            - "Both escrows funded 6090000 at clock 2026-08-15; released at clock 2026-09-05 (cases ACQUIRED, acquired_at 2026-09-05)"
            - "No premium schedules on either case (monthly premium falls back to 50000)"
            - "Clock at 2026-12-01 for valuation: months_elapsed = floor(134/30) = 4, remaining_le = 82"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "Broker One", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "Pat Doe", date_of_birth: "1960-01-01", state_code: "TX", gender: "M", smoker_status: "NON_TOBACCO", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "CarrierCo", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id" } }
            - { call: "POST /api/offers/${o1}/accept", payload: { broker_commission_bps: 455 }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "CarrierCo", policy_number: "P-2", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p2: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p2}" }, as: Broker, as_user_id: "${b_id}", captures: { c2: "$.data.id" } }
            - { call: "POST /api/cases/${c2}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c2}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c2}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le2: "$.data.id" } }
            - { call: "POST /api/le-reports/${le2}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c2}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c2}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c2}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o2: "$.data.id" } }
            - { call: "POST /api/offers/${o2}/accept", payload: { broker_commission_bps: 455 }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/portfolios", payload: { name: "PRO", discount_rate_bps: 1200, valuation_method: "PROSPECTIVE", allocations: [] }, as: PortfolioManager, captures: { pf_pro: "$.data.id" } }
            - { call: "POST /api/portfolios", payload: { name: "INV", discount_rate_bps: 1200, valuation_method: "INVESTMENT", allocations: [] }, as: PortfolioManager, captures: { pf_inv: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/assign-portfolio", payload: { portfolio_id: "${pf_pro}" }, as: PortfolioManager }
            - { call: "POST /api/cases/${c2}/assign-portfolio", payload: { portfolio_id: "${pf_inv}" }, as: PortfolioManager }
            - { call: "GET /api/cases/${c1}/closing-package", as: CaseManager, captures: { pkg1: "$.data[0].id" } }
            - { call: "POST /api/closing-packages/${pkg1}/send-for-signature", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "CHANGE_OF_OWNERSHIP" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "CHANGE_OF_BENEFICIARY" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "COMPENSATION_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "ALTERNATIVES_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "TAX_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "PRIVACY_NOTICE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/record-signature", payload: { doc_type: "RESCISSION_NOTICE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/submit-review", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "GET /api/cases/${c2}/closing-package", as: CaseManager, captures: { pkg2: "$.data[0].id" } }
            - { call: "POST /api/closing-packages/${pkg2}/send-for-signature", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "CHANGE_OF_OWNERSHIP" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "CHANGE_OF_BENEFICIARY" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "COMPENSATION_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "ALTERNATIVES_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "TAX_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "PRIVACY_NOTICE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/record-signature", payload: { doc_type: "RESCISSION_NOTICE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/submit-review", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/cases/${c1}/escrow-account", as: FinanceOfficer, captures: { esc1: "$.data[0].id" } }
            - { call: "POST /api/escrow-accounts/${esc1}/fund", payload: { amount_cents: 6090000 }, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "POST /api/closing-packages/${pkg1}/submit-carrier", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg1}/confirm-ownership", payload: {}, as: CaseManager }
            - { call: "GET /api/cases/${c2}/escrow-account", as: FinanceOfficer, captures: { esc2: "$.data[0].id" } }
            - { call: "POST /api/escrow-accounts/${esc2}/fund", payload: { amount_cents: 6090000 }, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "POST /api/closing-packages/${pkg2}/submit-carrier", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg2}/confirm-ownership", payload: {}, as: CaseManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/escrow-accounts/${esc1}/release", payload: {}, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "POST /api/escrow-accounts/${esc2}/release", payload: {}, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/portfolios/${pf_pro}", as: PortfolioManager, captures: { pfv_pro: "$.data.version" } }
            - { call: "GET /api/portfolios/${pf_inv}", as: PortfolioManager, captures: { pfv_inv: "$.data.version" } }
          trigger:
            - { call: "POST /api/portfolios/${pf_pro}/valuation-snapshots", payload: { period_start: "2026-09-01", period_end: "2026-12-01", expected_portfolio_version: "${pfv_pro}" }, as: PortfolioManager, captures: { snap_pro: "$.data.id" } }
            - { call: "POST /api/portfolios/${pf_inv}/valuation-snapshots", payload: { period_start: "2026-09-01", period_end: "2026-12-01", expected_portfolio_version: "${pfv_inv}" }, as: PortfolioManager, captures: { snap_inv: "$.data.id" } }
          assert:
            - "GET /api/valuation-snapshots/${snap_pro}: nav_cents == 1633437 and method_used == PROSPECTIVE"
            - "GET /api/valuation-snapshots/${snap_pro}: policy_valuations[0].value_cents == 1633437 and policy_valuations[0].remaining_le_months == 82"
            - "GET /api/valuation-snapshots/${snap_inv}: nav_cents == 6164284 and method_used == INVESTMENT"
            - "PROSPECTIVE and INVESTMENT values differ (1633437 != 6164284) for identical policy inputs"

      - name: portfolio_return_mwr_vs_twr_diverge
        grounds:
          - calculations.calc_portfolio_performance
          - entities.ValuationSnapshot.fields.money_weighted_return_bps
          - entities.ValuationSnapshot.fields.time_weighted_return_bps
        distinguishing_aspect: |
          Dual-variant divergence on the PORTFOLIO domain: the same cash-flow set
          (fund 6000000 before the period, one premium 50000 at day 61, terminal NAV
          1633437 at day 91) yields money_weighted_return_bps == -9950 (XIRR
          bisection) and time_weighted_return_bps == -7214 (Modified Dietz).
        test_recipe:
          setup:
            - "Standard acquired case: TX license, broker-owned insured (DOB 1960-01-01), WHOLE_LIFE face 10000000 AP 600000 issue 2023-01-01 cash_value 0"
            - "LE tier A base 120 debits [0.1, 0.2] delivered at clock 2026-07-20 (blended 86); MARKETED; disclosures delivered; offer 6000000 accepted at 455 bps"
            - "Portfolio PRO (PROSPECTIVE, 1200 bps) assigned; escrow funded 6090000 at 2026-08-15; released at 2026-09-05 (ACQUIRED)"
            - "Premium schedule created at 2026-09-05 (remaining_le 85, strategy PAY_AS_DUE, monthly 50000); first payment due 2026-10-05"
            - "Clock 2026-11-01: payment #1 paid (50000) - within grace (2026-11-05)"
            - "Clock 2026-12-01: snapshot period [2026-09-01, 2026-12-01); D = 91; premium flow at d = 61; V0 = 6000000 (funded before period); V1 = NAV 1633437"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-07-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/licenses", payload: { state_code: "TX", license_number: "LIC-TX-1", effective_date: "2026-01-01", expiry_date: "2027-12-31" }, as: PlatformAdmin }
            - { call: "POST /api/brokers", payload: { name: "Broker One", license_number: "BR-1", state_code: "TX" }, as: PlatformAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/insureds", payload: { full_name: "Pat Doe", date_of_birth: "1960-01-01", state_code: "TX", gender: "F", smoker_status: "NON_TOBACCO", ssn_last4: "1234" }, as: Broker, as_user_id: "${b_id}", captures: { i_id: "$.data.id" } }
            - { call: "POST /api/policies", payload: { insured_id: "${i_id}", carrier_name: "CarrierCo", policy_number: "P-1", face_amount_cents: 10000000, policy_type: "WHOLE_LIFE", issue_date: "2023-01-01", annual_premium_cents: 600000 }, as: Broker, as_user_id: "${b_id}", captures: { p1: "$.data.id" } }
            - { call: "POST /api/cases", payload: { policy_id: "${p1}" }, as: Broker, as_user_id: "${b_id}", captures: { c1: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/submit", payload: {}, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/cases/${c1}/screenings", payload: {}, as: CaseManager }
            - { call: "POST /api/cases/${c1}/le-reports", payload: { underwriter_tier: "A" }, as: Underwriter, captures: { le1: "$.data.id" } }
            - { call: "POST /api/le-reports/${le1}/deliver", payload: { base_le_months: 120, impairment_debits: [0.1, 0.2] }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/uw-decision", payload: { decision: "APPROVE" }, as: Underwriter }
            - { call: "POST /api/cases/${c1}/deliver-disclosures", payload: { packet_types: ["COMPENSATION", "ALTERNATIVES", "TAX", "PRIVACY", "RESCISSION_RIGHTS"] }, as: CaseManager }
            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id" } }
            - { call: "POST /api/offers/${o1}/accept", payload: { broker_commission_bps: 455 }, as: Broker, as_user_id: "${b_id}" }
            - { call: "POST /api/portfolios", payload: { name: "PRO", discount_rate_bps: 1200, valuation_method: "PROSPECTIVE", allocations: [] }, as: PortfolioManager, captures: { pf: "$.data.id" } }
            - { call: "POST /api/cases/${c1}/assign-portfolio", payload: { portfolio_id: "${pf}" }, as: PortfolioManager }
            - { call: "GET /api/cases/${c1}/closing-package", as: CaseManager, captures: { pkg: "$.data[0].id" } }
            - { call: "POST /api/closing-packages/${pkg}/send-for-signature", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "CHANGE_OF_OWNERSHIP" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "CHANGE_OF_BENEFICIARY" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "COMPENSATION_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "ALTERNATIVES_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "TAX_DISCLOSURE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "PRIVACY_NOTICE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/record-signature", payload: { doc_type: "RESCISSION_NOTICE" }, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/submit-review", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/cases/${c1}/escrow-account", as: FinanceOfficer, captures: { esc: "$.data[0].id" } }
            - { call: "POST /api/escrow-accounts/${esc}/fund", payload: { amount_cents: 6090000 }, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "POST /api/closing-packages/${pkg}/submit-carrier", payload: {}, as: CaseManager }
            - { call: "POST /api/closing-packages/${pkg}/confirm-ownership", payload: {}, as: CaseManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/escrow-accounts/${esc}/release", payload: {}, as: FinanceOfficer, as_user_id: "fo_1" }
            - { call: "GET /api/cases/${c1}", as: PortfolioManager, captures: { c_v: "$.data.version" } }
            - { call: "POST /api/cases/${c1}/premium-schedules", payload: { expected_case_version: "${c_v}" }, as: PortfolioManager, captures: { sched: "$.data.id" } }
            - { call: "GET /api/premium-schedules/${sched}/payments", as: PortfolioManager, captures: { pay1: "$.data[0].id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlatformAdmin }
