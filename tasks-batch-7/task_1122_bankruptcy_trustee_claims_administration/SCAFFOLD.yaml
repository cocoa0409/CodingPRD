    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "ClaimObjection[]"
    side_effects: []

  - method: GET
    path: "/trustee/claims/{id}/encumbered_assets"
    description: "List assets encumbered by a (secured) claim"
    roles: [Trustee, Clerk, Court, Creditor]
    code: 200
    input: []
    output: "Asset[]"
    side_effects: []

  - method: POST
    path: "/trustee/claims/{id}/review"
    description: "FILED -> UNDER_REVIEW"
    roles: [Trustee]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/trustee/claims/{id}/allow"
    description: "UNDER_REVIEW -> ALLOWED at filed amount"
    roles: [Trustee]
    code: 200
    input: []
    output: Claim
    side_effects: ["allowed_amount_cents = filed_amount_cents", "case.allowed_claims_total_cents += allowed_amount_cents", "case.version += 1"]

  - method: POST
    path: "/trustee/claims/{id}/reopen"
