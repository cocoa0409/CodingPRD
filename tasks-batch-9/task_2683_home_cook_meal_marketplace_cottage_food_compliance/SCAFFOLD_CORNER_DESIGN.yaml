      - name: refund_waterfall_drains_buckets_in_the_fault_specific_order
        claim_type: correct_result
        grounds:
          - calculations.refund_chargeback_split
          - calculations.refund_chargeback_split.constants.SHARED_FAULT_COOK_PCT
          - state_machines.Order.payment_status.CAPTURED_to_PARTIALLY_REFUNDED
          - entities.Order.platform_absorbed_cents
        distinguishing_aspect: >
          Three refunds on one captured order, one per fault_party, chained so that each one starts
          from the buckets the previous one drained. PLATFORM fault skips bucket 1 entirely and empties
          the whole 412 of commission; COOK fault then draws 300 from bucket 1; SHARED fault computes
          51 from round_half_up(101 * 0.50) and, finding bucket 2 already empty, drops the exact
          complement 50 into platform_absorbed so the three parts still sum to 101.
        test_recipe:
          setup:
            - "The world of order_charge_breakdown_correct_result_and_rounding_direction (MenuItem at 610 cents), with the order of quantity 3 advanced all the way to DELIVERED exactly as in window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections: subtotal 1830, diner_service_fee 165, commission 412, cook_earnings 1418, total_charge 1995, payment_status CAPTURED, effective_year 2026, clock 2026-08-08T16:00:00Z."
