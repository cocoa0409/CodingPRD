      - name: closure_window_strict_intersection_returns_overlap
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CLOSURE_WINDOW_OVERLAP
        distinguishing_aspect: "A new window whose interior intersects an existing SCHEDULED window (start before the existing end) is ERR_CLOSURE_WINDOW_OVERLAP — distinct from the buffer violation which fires on adjacency."
