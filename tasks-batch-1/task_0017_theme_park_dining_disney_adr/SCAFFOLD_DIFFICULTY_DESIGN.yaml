  # =========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: window_open_at_boundary_inclusive_on_post_reservations
        grounds:
          - calculations.reservation_window_open_at
          - validations[priority=9]
          - endpoints.POST_/v1/reservations
          - errors[ERR_OUTSIDE_BOOKING_WINDOW]
        distinguishing_aspect: |
          Window opens at EXACTLY (visit_local_midnight at 06:00 resort-TZ) - 60 calendar days
          → 2026-02-15 06:00 EST = 2026-02-15T11:00:00Z → window_open_utc = 2025-12-17T11:00:00Z.
          At clock=2025-12-17T11:00:00Z the booking is ACCEPTED (>= comparison).
          At clock=2025-12-17T10:59:59Z the booking is REJECTED with ERR_OUTSIDE_BOOKING_WINDOW.
          Metric: temporal threshold on POST /reservations.
        test_recipe:
          setup:
            - "Clock at exactly 2025-12-17T11:00:00Z — the inclusive boundary for window_open_utc."
