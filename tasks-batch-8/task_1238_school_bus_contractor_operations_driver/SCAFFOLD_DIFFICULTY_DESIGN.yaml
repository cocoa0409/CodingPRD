            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id", a2: "$.data[1].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { req_pre: $.data.required_routes, cov_pre: $.data.covered_routes, unc_pre: $.data.uncovered_routes, sd_v: $.data.version } }
            - { call: "POST /busops/service-days/${sd1}/lock", payload: { expected_service_day_version: "${sd_v}" }, as: ContractorOps }
          trigger:
            - { call: "POST /busops/service-days/${sd1}/doubling-decisions", payload: { uncovered_assignment_id: "${a2}", absorbing_assignment_id: "${a1}" }, as: ContractorOps, captures: { a2_doubled: $.data.is_doubled, a2_start: $.data.planned_start_minute, a2_end: $.data.planned_end_minute, a2_st: $.data.status } }
            - { call: "GET /busops/service-days/${sd1}", as: ContractorOps, captures: { req_post: $.data.required_routes, cov_post: $.data.covered_routes, unc_post: $.data.uncovered_routes } }
          assert:
            - "${req_pre} == 2 and ${cov_pre} == 1 and ${unc_pre} == 1 (pre-trigger: 2 == 1 + 1)"
            - "${a2_st} == CONFIRMED and ${a2_doubled} == true"
            - "Assignment.${a2}.doubled_after_assignment_id == ${a1}"
            - "${a2_start} == 480 and ${a2_end} == 540 (shifted to absorbing end, 60-minute route duration)"
            - "${req_post} == 2 and ${cov_post} == 2 and ${unc_post} == 0 (post-trigger: 2 == 2 + 0 — coverage conserved)"
            - "Driver.${dr_id}.weekly_assigned_minutes == 120"
      - name: charter_cancel_conserves_deposit_split
        grounds:
          - calculations.charter_cancel_fee
          - state_machines.CharterTrip.APPROVED_to_CANCELLED
          - entities.CharterTrip.fields.deposit_cents
        distinguishing_aspect: |
          Conserved quantity: deposit money. Cancel 36h before pickup lands in
          the 25% tier: cancel_fee_cents 21250 + refund_cents 28750 exactly
          reconstitute the 50000-cent deposit — the forward action (approve
          with deposit) plus the compensating action (cancel) splits but never
          creates or destroys cents. Different conserved quantity from the
          route-coverage count invariant.
        test_recipe:
          setup:
            - "Contract ACTIVE (hourly 12000, per-mile 250); charter trip 2026-06-10 pickup 600 return 900, estimated_hours_x10=50, estimated_miles=100 -> quote 85000"
            - "Charter APPROVED with deposit 50000; logical clock moved to 36h before pickup (2026-06-08T22:00:00Z)"
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-INV2", region_fuel_index_code: "WEST", credit_limit_cents: 100000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-I2", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/charter-trips", payload: { contract_id: "${c_id}", purpose: "Science fair", trip_date: "2026-06-10", pickup_minute: 600, return_minute: 900, estimated_hours_x10: 50, estimated_miles: 100, passenger_count: 20 }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { ch: $.data.id } }
            - { call: "POST /busops/charter-trips/${ch}/quote", payload: {}, as: ContractorOps, captures: { ch_v: $.data.version, q: $.data.quote_price_cents } }
            - { call: "POST /busops/charter-trips/${ch}/approve", payload: { expected_charter_trip_version: "${ch_v}", deposit_cents: 50000 }, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/_clock/set_current_utc", payload: { to_iso8601: "2026-06-08T22:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /busops/charter-trips/${ch}/cancel", payload: { reason: "District request" }, as: DistrictAdmin, as_user_id: "${d_id}", captures: { fee: $.data.cancel_fee_cents, refund: $.data.refund_cents } }
          assert:
            - "${q} == 85000 (provisional: 5.0h x 12000 + 100 mi x 250)"
            - "${fee} == 21250 (36h before pickup: 24 <= 36 < 72 -> 25% of 85000)"
            - "${refund} == 28750"
            - "${fee} + ${refund} == 50000 == CharterTrip.${ch}.deposit_cents (deposit conserved)"
            - "CharterTrip.${ch}.status == CANCELLED"
