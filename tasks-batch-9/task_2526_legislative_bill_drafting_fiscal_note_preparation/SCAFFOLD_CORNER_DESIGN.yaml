          setup:
            - "CONVENED session (introduction deadline 2026-10-15T00:00:00Z); one CONFIDENTIAL PRIORITY request with requested_sections_count 6 and appropriation_requested_cents 12000000, assigned to d1 over [2026-09-02, 2026-09-20]."
