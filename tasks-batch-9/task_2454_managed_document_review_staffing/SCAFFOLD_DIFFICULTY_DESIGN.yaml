      - name: matter_suspension_revert_does_not_restore_sessions
        grounds:
          - state_machines.Matter.IN_REVIEW_to_SUSPENDED
          - state_machines.Matter.SUSPENDED_to_STAFFING
          - state_machines.SecureEnvironmentSession.ACTIVE_to_REVOKED
          - entities.Matter.fields.suspension_reason
        distinguishing_aspect: "This is the ASYMMETRIC REVERT shape, not a cycle: the matter returns to IN_REVIEW by way of SUSPENDED -> STAFFING, but the forward edge's session revocation is NOT undone on the way back, so the pre- and post-loop states differ on SecureEnvironmentSession."
        test_recipe:
          setup:
            - "the staffed IN_REVIEW matter with Reviewer A holding an ACTIVE ONSITE_SECURE session over [2026-08-01, 2026-08-31)"
            - "Batch 1 (400 documents) is ASSIGNED to Reviewer A with Assignment a1 in ASSIGNED"
          setup_api_calls:
            - *k_clock
            - *k_client
            - *k_matter
            - *k_proto
            - *k_proto_submit
            - *k_proto_approve
            - *k_rev_a
            - *k_rev_a_verify
            - *k_screen_a
            - *k_screen_a_clear
            - *k_ca_a
            - *k_ca_a_exec
            - *k_sess_a
            - *k_sess_a_active
            - *k_batch1
            - *k_assign_a1
          trigger:
            - call: "POST /matters/${m_id}/suspension"
              payload: { suspended: true, suspension_reason: "client instruction to pause review" }
