            - "Enrollment.${enr_id}.benefit_status == DE_ENROLLED throughout the trailing calls"

      - name: adjudication_is_single_shot_per_sample
        claim_type: error_triggerability
        grounds:
          - validations[priority=52]
          - errors[ERR_SAMPLE_ALREADY_ADJUDICATED]
          - state_machines.AuditSample.status.DRAWN_to_ADJUDICATED_PASS
        distinguishing_aspect: |
          A settled sample is closed to re-adjudication even by the same auditor and even
          with the same finding: the second adjudicate is refused with
          ERR_SAMPLE_ALREADY_ADJUDICATED, and - the part an implementation is most likely to
          get wrong - the refusal must not re-run the bubble-up, so the claim stays
          AUDIT_PASSED once with net_payable_cents still 925 and no double counting in the
          carrier ledger.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50 and one VOICE enrollment starting 2026-06-01."
            - "Clock moved to 2026-07-02T00:00:00Z; the June claim is drafted and filed at 925."
            - "Auditor AUD-1 draws one sample; auditor AUD-2 adjudicates it COMPLIANT, which bubbles the claim to AUDIT_PASSED."
