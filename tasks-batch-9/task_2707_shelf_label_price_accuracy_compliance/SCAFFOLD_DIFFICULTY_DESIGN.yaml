              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_below}/scan-lines"
              payload: { item_upc: "00000000000705", shelf_price_cents: 259, register_price_cents: 259 }
