          trigger:
            - call: "POST /eoir/hearings/${h_a}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "POST /eoir/continuance-requests/${cont_b}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "COMPLETED branch: Hearing.${h_a}.status == COMPLETED and Case.${case_a}.status == MERITS"
            - "COMPLETED branch: GET /eoir/hearings?case_id=${case_a} returns exactly 1 row (no replacement created)"
            - "CONTINUED branch: Hearing.${h_b}.status == CONTINUED and Case.${case_b}.status == CALENDAR (case does NOT advance)"
            - "CONTINUED branch: a new hearing exists for case B with scheduled_start == \"2026-10-01T11:00:00Z\" (old start + 28 days), supersedes_hearing_id == ${h_b}, auto_created == true, status == SCHEDULED"
            - "ContinuanceRequest.${cont_b}.status == GRANTED and decided_by_judge_id == ${judge_id}"

  # ===========================================================================
  # Rule 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: reopen_grant_cascade_motion_decision_case_hearing
        grounds:
          - state_machines.MotionToReopen.FILED_to_GRANTED
          - state_machines.Decision.ISSUED_to_RESCINDED
          - state_machines.Case.IN_ABSENTIA_to_CALENDAR
        distinguishing_aspect: |
          Depth-3 cascade from the motion-grant trigger: granting the
          MotionToReopen (A) rescinds the Decision (B); the rescission itself
          reactivates the Case IN_ABSENTIA -> CALENDAR (C); the case's return to
          CALENDAR itself auto-creates a fresh MASTER_CALENDAR hearing at
          clock + 21 days (D). Each link is caused by the previous link, not by
          the original API call.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One PRO_SE English non-detained case docketed to a judge, with a master hearing 2026-09-05T10:00 whose notice was served 2026-08-20. Clock advanced to 2026-09-05T10:30; no-show recorded (case IN_ABSENTIA, in-absentia decision auto-created); the notice is then marked defective; a NOTICE_DEFECTIVE motion to reopen is FILED."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-CAS", name: "Cascade Court", city: "Mesa", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Cascade", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "K-1", respondent_full_name: "R Casc", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-05T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_id: $.data.id }
            - call: "POST /eoir/notices"
              payload: { hearing_id: "${h_id}", service_method: "MAIL", served_at: "2026-08-20T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { notice_id: $.data.id }
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T10:30:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/hearings/${h_id}/record-no-show"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/decisions"
              payload: { case_id: "${case_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { ia_decision: "$.data[0].id" }
            - call: "POST /eoir/notices/${notice_id}/mark-defective"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/motions-to-reopen"
              payload: { case_id: "${case_id}", decision_id: "${ia_decision}", basis: "NOTICE_DEFECTIVE" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { motion_id: $.data.id }
          trigger:
            - call: "POST /eoir/motions-to-reopen/${motion_id}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "MotionToReopen.${motion_id}.status == GRANTED with decided_by_judge_id == ${judge_id}"
            - "link 1: Decision.${ia_decision}.status == RESCINDED"
            - "link 2: Case.${case_id}.status == CALENDAR"
            - "link 3: GET /eoir/hearings?case_id=${case_id}&status=SCHEDULED returns exactly 1 row, a MASTER_CALENDAR hearing with scheduled_start == \"2026-09-26T10:30:00Z\" (clock 2026-09-05T10:30 + 21 days), auto_created == true, supersedes_hearing_id null"
            - "the old hearing ${h_id} remains NO_SHOW (cascade does not rewrite history)"

      - name: no_show_cascade_hearing_case_decision
        grounds:
          - state_machines.Hearing.SCHEDULED_to_NO_SHOW
          - state_machines.Case.CALENDAR_to_IN_ABSENTIA
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (record-no-show, not a motion
          grant): the no-show ruling mutates the Hearing to NO_SHOW (A->B); that
          hearing mutation itself flips the Case to IN_ABSENTIA (B->C); the case
          entering IN_ABSENTIA itself synthesizes an IN_ABSENTIA_REMOVAL Decision
          with deadlines derived from the ruling clock (C->D).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One PRO_SE English non-detained case docketed, master hearing 2026-09-05T10:00 with a SERVED notice (served 2026-08-20). Clock advanced to 2026-09-05T11:00:00Z (after the 30-minute hearing began)."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-NSH", name: "NoShow Court", city: "Provo", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge NoShow", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge_id: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "N-1", respondent_full_name: "R Noshow", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id }
            - call: "POST /eoir/cases/${case_id}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v2: $.data.version }
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-05T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_id: $.data.id }
            - call: "POST /eoir/notices"
              payload: { hearing_id: "${h_id}", service_method: "PERSONAL_SERVICE", served_at: "2026-08-20T00:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T11:00:00Z" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /eoir/hearings/${h_id}/record-no-show"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
          assert:
            - "link 1: Hearing.${h_id}.status == NO_SHOW"
            - "link 2: Case.${case_id}.status == IN_ABSENTIA and assigned_judge_id is retained (== ${judge_id})"
            - "link 3: GET /eoir/decisions?case_id=${case_id} returns exactly 1 row with outcome == IN_ABSENTIA_REMOVAL and status == ISSUED"
            - "that decision's source_hearing_id == ${h_id} and judge_id == ${judge_id}"
            - "that decision's issued_at == \"2026-09-05T11:00:00Z\", appeal_deadline == \"2026-10-05T11:00:00Z\" (+30 days), reopen_deadline == \"2027-03-04T11:00:00Z\" (+180 days)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appeal_state_error_beats_temporal_error
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors.ERR_DECISION_NOT_APPEALABLE
          - errors.ERR_APPEAL_WINDOW_EXPIRED
        distinguishing_aspect: |
          Error-category pair state(5) vs business_temporal(8): the decision is
          already APPEAL_PENDING (state violation) AND the clock is one second
          past the appeal deadline (temporal violation); the state error
          ERR_DECISION_NOT_APPEALABLE must win because priority 5 runs before
          priority 8.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. One case driven to DECIDED (decision issued 2026-09-04T12:00:00Z, appeal deadline 2026-10-04T12:00:00Z) and an appeal already filed, so the decision is APPEAL_PENDING. Clock then set to 2026-10-04T12:00:01Z — strictly past the deadline."
          setup_api_calls:
            - *d_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-PR1", name: "Priority One Court", city: "Akron", annual_completion_goal: 100, detained_daily_hearing_capacity: 2 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_id: $.data.id }
