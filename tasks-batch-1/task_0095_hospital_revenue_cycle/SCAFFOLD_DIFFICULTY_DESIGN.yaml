  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: oop_met_never_exceeds_oop_max_across_two_claims
        grounds:
          - calculations.final_patient_responsibility
          - entities.BenefitAccumulator.fields.oop_met_cents
          - state_machines.Claim.SUBMITTED_to_PARTIALLY_PAID
        distinguishing_aspect: |
          Conserved quantity #1 (patient out-of-pocket): across two adjudicated claims on the
          same policy, BenefitAccumulator.oop_met_cents == sum of each claim's
          patient_responsibility_cents AND is capped at oop_max_cents (120000), never drifting
          above the cap even when the second claim's raw responsibility would overshoot.
        test_recipe:
          setup:
            - "Policy deductible 100000, coinsurance 0.20, oop_max 120000; two coded encounters E1 and E2 each with billed 300000 and a SUBMITTED claim. E1 adjudicated allowed 100000 (deductible only), E2 adjudicated allowed 200000."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-016", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 120000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            # E1
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { e1: $.data.id }
            - call: "POST /encounters/${e1}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${e1}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${e1}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${e1}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { c1: $.data.id }
            - call: "POST /coding-assignments/${c1}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${c1}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${e1}"
              payload: {}
              as: BillingSpecialist
              captures: { e1v: $.data.version }
            - call: "POST /encounters/${e1}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${e1v}" }
              as: BillingSpecialist
              captures: { claim1: $.data.id }
            - call: "POST /claims/${claim1}/adjudicate"
              payload: { allowed_amount_cents: 100000, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 100000 } ] }
              as: BillingSpecialist
              captures: { pr1: $.data.patient_responsibility_cents }
            # E2
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-05T09:00:00Z" }
              as: Registrar
              captures: { e2: $.data.id }
            - call: "POST /encounters/${e2}/charges"
              payload: { cpt_code: "99284", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${e2}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${e2}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${e2}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { c2: $.data.id }
            - call: "POST /coding-assignments/${c2}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${c2}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${e2}"
              payload: {}
              as: BillingSpecialist
              captures: { e2v: $.data.version }
            - call: "POST /encounters/${e2}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${e2v}" }
              as: BillingSpecialist
              captures: { claim2: $.data.id }
          trigger:
            - call: "POST /claims/${claim2}/adjudicate"
              payload: { allowed_amount_cents: 200000, claim_lines: [ { cpt_code: "99284", line_allowed_cents: 200000 } ] }
              as: BillingSpecialist
              captures: { pr2: $.data.patient_responsibility_cents }
          assert:
            - "Claim.${claim1}.patient_responsibility_cents == 100000"
            - "Claim.${claim2}.patient_responsibility_cents == 20000"
            - "BenefitAccumulator for ${policy_id} has oop_met_cents == 120000"
            - "BenefitAccumulator for ${policy_id} has oop_met_cents == policy.oop_max_cents (capped, no drift above)"

      - name: statement_money_conservation_due_equals_paid_plus_written_plus_balance
        grounds:
          - calculations.account_balance
          - state_machines.PatientStatement.PARTIALLY_PAID_to_PAID
          - state_machines.PatientStatement.IN_COLLECTIONS_to_WRITTEN_OFF
          - entities.PatientStatement.fields.written_off_cents
        distinguishing_aspect: |
          Conserved quantity #2 (statement dollars): a partial payment followed by a bad-debt
          write-off of the remainder preserves amount_due_cents == amount_paid_cents +
          written_off_cents and drives encounter.account_balance_cents to exactly 0 — money in
          equals money accounted for, no drift, on a different conserved quantity than OOP.
        test_recipe:
          setup:
            - "PatientStatement amount_due 120000 from a PARTIALLY_PAID adjudication; one partial payment of 50000 posted (status PARTIALLY_PAID); aged and sent to IN_COLLECTIONS; remainder 70000 to be written off."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
