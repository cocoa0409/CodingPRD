    roles: [UtilityPlanner]
    code: 200
    input: [retirement_year, plan_id]
    output: Resource
    side_effects:
      - "For every portfolio of plan_id: increments ResourcePortfolio.version by 1, and every snapshot with forecast_year >= retirement_year is retire-flagged (excluded from review precondition; its uniqueness slot is freed for recompute)"
      - "Increments Resource.version by 1"

