  - name: FintechPartner
    identity: entity_backed:Partner
    description: >
      The fintech itself, acting through the program portal. X-User-ID carries the Partner.id,
      so every request is scoped: reads and writes touching a resource whose partner_id differs from X-User-ID are
      rejected with ERR_PARTNER_SCOPE_VIOLATION at priority 12, which runs before any state or fiscal check. It files
      its own end-user account census, files marketing materials and is the only role that may resubmit a rejected
      filing, opens its own settlement batches and books its own ledger entries, and lodges end-user complaints
      routed through its own channels. It reads its own program record, diligence files, program agreements, custody
      accounts, settlement batches, ledger entries, monitoring alerts, oversight cycles and wind-down plans. It
      cannot read the bank-internal oversight summary for any partner, cannot decide or approve anything, cannot move
      program funds, and can never see another partner's data.
    exclusive_operations:
