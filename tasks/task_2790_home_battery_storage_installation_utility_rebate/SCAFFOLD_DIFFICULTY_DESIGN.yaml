        distinguishing_aspect: |
          A different resource and different interval semantics than the crew-time rule: here the constraint is
          an aggregate over every time-overlapping SCHEDULED event in one territory (sum(target_kw) <= 1500) with
          NO buffer, so 900 + 600 = 1500 is admitted, one further kilowatt in the same window is refused, and a
          1500 kW event starting exactly when the others end is admitted because the windows are half-open.
