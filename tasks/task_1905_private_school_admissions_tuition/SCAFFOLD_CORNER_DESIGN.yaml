          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_FORBIDDEN_ROLE (HTTP 403); cycle remains OPEN"

  # ================================================================ complexity_layers
  - section: complexity_layers
    instances:
      - name: occ_reenrollment_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reenrollment-offer-stale-student]", "errors[ERR_STALE_VERSION]", state_machines.ReenrollmentOffer.ISSUED_to_SUPERSEDED]
        distinguishing_aspect: "OCC on Student.version: creating an offer bumps the student version; a second create carrying the pre-create version is rejected 412 ERR_STALE_VERSION, while the same create with the fresh version succeeds and SUPERSEDES the first offer (create-with-supersede is legal only on a fresh view)."
        test_recipe:
          setup: ["Current cycle with G9 section; target cycle with G10 section; fam-r student st1 at version 1"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2026-2027", early_deadline_at: "2025-11-01T00:00:00Z", regular_deadline_at: "2026-01-15T00:00:00Z", reenroll_response_deadline_at: "2026-03-01T00:00:00Z", melt_deadline_at: "2026-08-01T00:00:00Z", aid_budget_total_cents: 0 }, as: AdmissionDirector, captures: { cycC: $.data.id } }
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cycN: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycC}", grade_level: "G9", capacity: 20, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secC9: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cycN}", grade_level: "G10", capacity: 20, tuition_cents: 3200000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { secN10: $.data.id } }
            - { call: "POST /admissions/students", payload: { family_id: "fam-r", first_name: "Sam", last_name: "Rey", current_grade_section_id: "${secC9}" }, as: AdmissionDirector, captures: { st1: $.data.id, st1_v: $.data.version } }
          trigger:
            - { call: "POST /admissions/reenrollment-offers", payload: { student_id: "${st1}", cycle_id: "${cycN}", expected_student_version: "${st1_v}" }, as: AdmissionDirector, captures: { of1: $.data.id } }
            - { call: "POST /admissions/reenrollment-offers", payload: { student_id: "${st1}", cycle_id: "${cycN}", expected_student_version: "${st1_v}" }, as: AdmissionDirector, captures: { err: $.data.error_id } }
            - { call: "GET /admissions/students/${st1}", payload: {}, as: AdmissionDirector, captures: { st1_v2: $.data.version } }
            - { call: "POST /admissions/reenrollment-offers", payload: { student_id: "${st1}", cycle_id: "${cycN}", expected_student_version: "${st1_v2}" }, as: AdmissionDirector, captures: { of2: $.data.id } }
          assert:
            - "First create succeeds (201) and increments Student.${st1}.version by 1"
            - "Second create with the same (now stale) expected_student_version: captured error_id == ERR_STALE_VERSION (HTTP 412)"
            - "Third create with the fresh version succeeds (201); ReenrollmentOffer.${of1}.status == SUPERSEDED and ReenrollmentOffer.${of2}.status == ISSUED"

      - name: occ_evaluation_reschedule_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[evaluation-reschedule-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on EntranceEvaluation.version: a reschedule leaves the evaluation SCHEDULED, so only the version distinguishes a stale update — replaying the pre-patch version is rejected 412 while a fresh version patches cleanly."
        test_recipe:
          setup: ["OPEN cycle, section; fam-a application SUBMITTED; INTERVIEW evaluation int-7 10:00-11:00 created (version captured)"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-7" }, as: AdmissionOfficer, captures: { ev: $.data.id, ev_v: $.data.version } }
          trigger:
            - { call: "PATCH /admissions/evaluations/${ev}", payload: { expected_evaluation_version: "${ev_v}", scheduled_start: "2026-10-12T14:00:00Z", scheduled_end: "2026-10-12T15:00:00Z" }, as: AdmissionOfficer, captures: { ev_v2: $.data.version } }
            - { call: "PATCH /admissions/evaluations/${ev}", payload: { expected_evaluation_version: "${ev_v}", scheduled_start: "2026-10-12T16:00:00Z", scheduled_end: "2026-10-12T17:00:00Z" }, as: AdmissionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "First PATCH succeeds: version increments (captured version == prior + 1), window now 14:00-15:00, status still SCHEDULED"
            - "Second PATCH with the stale version: captured error_id == ERR_STALE_VERSION (HTTP 412); the 14:00-15:00 window is unchanged"

      - name: reschedule_into_interviewer_conflict_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[evaluation-reschedule-stale-version]", "errors[ERR_INTERVIEWER_SCHEDULE_CONFLICT]"]
        distinguishing_aspect: "Rescheduling re-applies the half-open overlap rule excluding self: moving interview B (12:00-13:00, int-9) into 10:30-11:30 collides with interview A (10:00-11:00, int-9) even with a fresh OCC version."
        test_recipe:
          setup: ["OPEN cycle, section; fam-a and fam-b applications SUBMITTED; interviews A int-9 10:00-11:00 and B int-9 12:00-13:00 both SCHEDULED"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { aplA: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplA}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { appA: $.data.id } }
            - { call: "POST /admissions/applications/${appA}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-b", first_name: "Ben", last_name: "Bell", date_of_birth: "2013-06-01" }, as: Parent, as_user_id: "fam-b", captures: { aplB: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplB}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-b", captures: { appB: $.data.id } }
            - { call: "POST /admissions/applications/${appB}/submit", payload: {}, as: Parent, as_user_id: "fam-b" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appA}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-9" }, as: AdmissionOfficer, captures: { evA: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appB}", kind: "INTERVIEW", scheduled_start: "2026-10-12T12:00:00Z", scheduled_end: "2026-10-12T13:00:00Z", interviewer_id: "int-9" }, as: AdmissionOfficer, captures: { evB: $.data.id, evB_v: $.data.version } }
          trigger:
            - { call: "PATCH /admissions/evaluations/${evB}", payload: { expected_evaluation_version: "${evB_v}", scheduled_start: "2026-10-12T10:30:00Z", scheduled_end: "2026-10-12T11:30:00Z" }, as: AdmissionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "captured error_id == ERR_INTERVIEWER_SCHEDULE_CONFLICT (HTTP 409); EntranceEvaluation.${evB} remains 12:00-13:00"

      - name: sweep_second_run_all_zero
        claim_type: ops_run_checkpoint
        grounds: ["endpoints.POST /admissions/cycles/{cycleId}/run-sweep", state_machines.EnrollmentContract.ISSUED_to_LAPSED]
        distinguishing_aspect: "Ops runs are checkpoints, not streams: after a sweep lapses the one due contract, an immediate second sweep at the same clock reports all-zero counters — every due item was consumed by the first run."
        test_recipe:
          setup: ["fam-a application OFFERED at close 2026-11-02, contract ISSUED (due 2026-11-16, no aid); clock 2026-11-17; first sweep executed (lapsed_contract_count == 1)"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionDirector }
            - { call: "POST /admissions/applications/${app}/issue-contract", payload: {}, as: AdmissionOfficer, captures: { con: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-17T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/run-sweep", payload: {}, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/cycles/${cyc}/run-sweep", payload: {}, as: AdmissionDirector }
          assert:
            - "First sweep: lapsed_contract_count == 1; second sweep (same clock): expired_offer_count == 0, lapsed_contract_count == 0, expired_waitlist_count == 0, lapsed_reenrollment_count == 0, promoted_application_ids == []"
            - "EnrollmentContract.${con}.status remains LAPSED (terminal; sweeps do not re-process it)"

      - name: melt_enrolled_cascade_releases_everything
        claim_type: cascading_side_effects
        grounds: [state_machines.Application.ENROLLED_to_MELTED, state_machines.EnrollmentContract.ENROLLED_to_MELTED, "state_machines.AidApplication.award_status.ACCEPTED_to_RELEASED", "entities.Student.fields.status"]
        distinguishing_aspect: "Summer melt is the deepest unwind: withdrawing an ENROLLED application melts the contract (deposit forfeited), releases the ACCEPTED award (committed budget credited back), deactivates the cascade-created student, and frees the seat — five mutations from one family action."
        test_recipe:
          setup: ["fam-a fully enrolled: OFFERED at close -> award 1,820,000 ACCEPTED -> contract issued (deposit 118,000) -> signed -> deposit paid -> ENROLLED, Student created"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 12000000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 12000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionDirector }
            - { call: "POST /admissions/aid-applications/${aid}/accept-award", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applications/${app}/issue-contract", payload: {}, as: AdmissionOfficer, captures: { con: $.data.id } }
            - { call: "POST /admissions/contracts/${con}/sign", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/contracts/${con}/deposit-payments", payload: { amount_cents: 118000 }, as: Parent, as_user_id: "fam-a", captures: { st_new: $.data.created_student_id } }
          trigger:
            - { call: "POST /admissions/applications/${app}/withdraw", payload: {}, as: Parent, as_user_id: "fam-a" }
          assert:
            - "Application.${app}.status == MELTED and EnrollmentContract.${con}.status == MELTED (deposit forfeited: paid_cents stays 118000 with no refund)"
            - "AidApplication.${aid}.award_status == RELEASED and GET cycle shows aid_committed_cents == 0 (1,820,000 credited back)"
            - "Student.${st_new}.status == INACTIVE (soft-deactivated, still queryable)"
            - "GradeSection.${sec}.seats_held == 0 and aid_seats_held == 0"

      - name: waitlist_promotion_after_lapse
        claim_type: cascading_side_effects
        grounds: [state_machines.Application.WAITLISTED_to_OFFERED]
        excluded_because:
          difficulty_instance: sweep_contract_lapse_full_cascade
          rationale: "Promotion with the 7-day expiry and budget/seat re-ledgering is asserted hop-by-hop in the named §1.8 cascade instance."

      - name: dual_variant_award_and_deposit
        claim_type: dual_variant_calculation
        grounds: [calculations.aid_award_amount, calculations.deposit_amount]
        excluded_because:
          difficulty_instance: aid_award_provisional_vs_final_diverge
          rationale: "Both dual-variant calculations (aid award domain and deposit domain) carry exact literal assertions in §1.8 instances aid_award_provisional_vs_final_diverge and deposit_estimate_vs_contract_final_diverge."

  # ================================================================ consistency_model
  - section: consistency_model
    instances:
      - name: immediate_read_after_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Application.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Immediate consistency: the GET issued right after submit reflects SUBMITTED with submitted_at == the logical clock at submit (2026-08-01T00:00:00Z default), and version advanced by exactly 1 from the create response."
        test_recipe:
          setup: ["OPEN cycle, section; fam-a application created (version captured)"]
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 5, tuition_cents: 3000000, max_aid_seat_pct: 0.5 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id, app_v1: $.data.version } }
          trigger:
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "GET /admissions/applications/${app}", payload: {}, as: Parent, as_user_id: "fam-a", captures: { app_v2: $.data.version } }
          assert:
            - "GET immediately after submit: status == SUBMITTED, submitted_at == 2026-08-01T00:00:00Z (logical clock), captured version == ${app_v1} + 1"

  # ================================================================ state_machines (excluded stubs)
  - section: state_machines
    instances:
      - name: promoted_offer_uses_shorter_expiry
        claim_type: side_effect_execution
        grounds: [state_machines.Application.WAITLISTED_to_OFFERED, calculations.waitlist_promotion_selector]
