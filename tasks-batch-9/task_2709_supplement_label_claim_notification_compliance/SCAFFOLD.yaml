scenario: |
  Generate task harder than expert level!

  2709. Supplement Label Claim & Notification Compliance (dietary supplement regulatory team):
  ingredient eligibility determination with new dietary ingredient notification requirements,
  structure-function claim development with substantiation dossiers and required disclaimers,
  label panel construction including supplement facts formatting and serving size rules,
  allergen and warning statement requirements with contraindication language, claim notification
  submission within the required window after marketing, advertising substantiation review for
  competent and reliable scientific evidence, adverse event reporting with serious event
  timelines and recordkeeping, certificate of analysis review, identity testing and supplier
  qualification

domain_name: supplement-label-claim-compliance
api_prefix: /supplement-compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no nesting in URL paths. Every
  # collection is addressed at `<api_prefix>/<collection>` and children are found
  # through filtered lists, never through nested creation paths.

  state_machine_shape: cyclic
  # StructureFunctionClaim runs a revision loop (UNDER_SUBSTANTIATION_REVIEW ->
  # REVISION_REQUESTED -> UNDER_SUBSTANTIATION_REVIEW) capped at 3 rounds AND carries a
  # second independent dimension (notification_status). Supplier runs QUALIFIED <->
  # PROBATION. Product runs LABEL_LOCKED -> DRAFT on label supersession.

  relationship_patterns:
    - one_to_many          # Product -> LabelPanel, Product -> AdverseEventReport, Supplier -> IngredientLot
    - many_to_many         # Product <-> Ingredient through ProductIngredient
    - self_referential     # Ingredient.predecessor_ingredient_id, LabelPanel.supersedes_panel_id
    - cross_aggregate      # Product posture depends on Supplier state reached through IngredientLot + ProductIngredient

  role_model: segregation_of_duties
  # The user who authored a SubstantiationDossier may not review it, and the user who
  # reviewed the dossier may not approve the claim it substantiates.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: brand_name
        type: string
        source: input
        description: marketing brand under which the finished supplement is sold
      - name: product_name
        type: string
        source: input
        description: statement of identity printed on the principal display panel
      - name: net_quantity_g
        type: number
        source: input
        description: net contents of the container in grams; drives the panel line allowance tier
        constraints: "> 0"
      - name: servings_per_container
        type: integer
        source: input
        description: servings the container is declared to hold; a LabelPanel must agree with this value
        constraints: "> 0"
      - name: lifecycle_status
        type: enum
        source: system
        description: label/marketing lifecycle dimension of the Product state machine
        default: DRAFT
        constraints: "DRAFT | LABEL_LOCKED | MARKETED"
      - name: label_posture
        type: enum
        source: computed
        description: derived gating dimension; recomputed by product_label_posture whenever compliance_risk_index, supplier qualification, or ingredient eligibility changes
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: marketing_start_date
        type: string
        source: system
        description: "UTC calendar date (YYYY-MM-DD) the product first entered MARKETED; null while lifecycle_status IN {DRAFT, LABEL_LOCKED}"
        default: null
      - name: serious_ae_count
        type: integer
        source: computed
        description: "count of AdverseEventReport rows for this product whose aer_status IN {TRIAGED_SERIOUS, SUBMITTED_TO_FDA}"
        default: 0
      - name: nonserious_ae_count
        type: integer
        source: computed
        description: "count of AdverseEventReport rows for this product whose aer_status == TRIAGED_NONSERIOUS"
        default: 0
      - name: late_notification_count
        type: integer
        source: computed
        description: "count of StructureFunctionClaim rows for this product with notification_status == SUBMITTED_LATE plus AdverseEventReport rows for this product with submission_timeliness == LATE"
        default: 0
      - name: rejected_coa_count
        type: integer
        source: computed
        description: "count of CertificateOfAnalysis rows with coa_status == REJECTED whose lot.ingredient_id appears on a ProductIngredient row of this product with line_status == ACTIVE"
        default: 0
      - name: compliance_risk_index
        type: integer
        source: computed
        description: output of calculations.product_compliance_risk_index; 10 when all four counters are 0
        default: 10
      - name: active_claim_count
        type: integer
        source: computed
        description: "conserved ledger: count of StructureFunctionClaim rows for this product with substantiation_status == APPROVED"
        default: 0
      - name: withdrawn_claim_count
        type: integer
        source: computed
        description: "count of StructureFunctionClaim rows for this product with substantiation_status == WITHDRAWN"
        default: 0
      - name: requires_label_revision
        type: boolean
        source: computed
        description: "set true when label_posture leaves OPEN; cleared to false only when label_posture returns to OPEN"
        default: false

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - name: ingredient_name
        type: string
        source: input
        description: common or usual name of the dietary ingredient
      - name: ingredient_class
        type: enum
        source: input
        description: taxonomy class; selects the approved identity-test method set for certificates of analysis
        constraints: "VITAMIN | MINERAL | BOTANICAL | AMINO_ACID | PROBIOTIC | EXCLUDED_SUBSTANCE"
      - name: pre_dshea_marketed
        type: boolean
        source: input
        description: submitter's assertion that the ingredient was marketed in the food supply before the statutory grandfather date
      - name: chemical_alteration
        type: boolean
        source: input
        description: submitter's assertion that the article has been chemically altered relative to its pre-statute form
      - name: daily_intake_mg
        type: number
        source: input
        description: highest recommended daily intake in milligrams under the intended conditions of use
        constraints: ">= 0"
      - name: rdi_mg
        type: number
        source: input
        description: "reference daily intake in milligrams; null means no Daily Value has been established for this ingredient"
        default: null
      - name: allergen_code
        type: enum
        source: input
        description: "major food allergen carried by the ingredient; null when the ingredient carries none"
        default: null
        constraints: "MILK | EGG | FISH | CRUSTACEAN_SHELLFISH | TREE_NUT | PEANUT | WHEAT | SOYBEAN | SESAME | null"
      - name: contraindication_code
        type: enum
        source: input
        description: "population or interaction requiring contraindication language; null when none applies"
        default: null
        constraints: "ANTICOAGULANT | PREGNANCY | PEDIATRIC | IMMUNOSUPPRESSANT | null"
      - name: predecessor_ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; nullable self-reference naming the reformulated ingredient this record supersedes"
        default: null
      - name: eligibility_status
        type: enum
        source: system
        description: eligibility dimension driven by the Ingredient state machine
        default: DRAFT_ASSESSMENT
        constraints: "DRAFT_ASSESSMENT | GRANDFATHERED | NDI_REQUIRED | NDI_PENDING | NDI_ACKNOWLEDGED | NDI_OBJECTED | INELIGIBLE"
      - name: ndi_notification_required
        type: boolean
        source: computed
        description: "true exactly when eligibility_status IN {NDI_REQUIRED, NDI_PENDING, NDI_ACKNOWLEDGED, NDI_OBJECTED}"
        default: false
      - name: determined_at
        type: datetime
        source: system
        description: "logical-clock instant the eligibility determination ran; null while eligibility_status == DRAFT_ASSESSMENT"
        default: null

  - name: ProductIngredient
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the finished product carrying this panel line"
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the dietary ingredient declared on this line"
      - name: amount_per_serving_mg
        type: number
        source: input
        description: quantitative amount per serving in milligrams as declared on the supplement facts panel
        constraints: "> 0"
      - name: panel_position
        type: integer
        source: input
        description: 1-based print order of the line inside the supplement facts panel
        constraints: ">= 1"
      - name: line_status
        type: enum
        source: system
        description: soft-delete dimension; REMOVED lines stay queryable but leave every panel computation
        default: ACTIVE
        constraints: "ACTIVE | REMOVED"
      - name: percent_dv_declared
        type: integer
        source: computed
        description: "whole-percent Daily Value printed for this line, per calculations.percent_dv_declared; null when ingredient.rdi_mg is null"
        default: null
      - name: dv_established
        type: boolean
        source: computed
        description: "true exactly when the referenced Ingredient.rdi_mg is not null"
        default: false

  - name: NDINotification
    parent: null
    common_fields: true
    fields:
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the new dietary ingredient this notification covers"
      - name: submitter_reference
        type: string
        source: input
        description: submitter's internal docket reference for the notification package
      - name: safety_narrative
        type: string
        source: input
        description: history-of-use and safety basis narrative filed with the notification
      - name: notification_status
        type: enum
        source: system
        description: notification lifecycle driven by the NDINotification state machine
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACKNOWLEDGED | OBJECTED"
      - name: submitted_at
        type: datetime
        source: system
        description: "logical-clock instant the notification was filed; null while notification_status == DRAFT"
        default: null
      - name: waiting_period_end
        type: datetime
        source: computed
        description: "output of calculations.ndi_waiting_period_end; exclusive upper bound of the occupied review interval; null while notification_status == DRAFT"
        default: null
      - name: agency_response_at
        type: datetime
        source: system
        description: "logical-clock instant the agency response was recorded; null while notification_status IN {DRAFT, SUBMITTED}"
        default: null
      - name: agency_objection_reason
        type: string
        source: input
        description: "reason text recorded with an OBJECT response; null unless notification_status == OBJECTED"
        default: null

  - name: StructureFunctionClaim
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product whose labeling and advertising carry the claim"
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the dietary ingredient the claim attributes the effect to"
      - name: claim_text
        type: string
        source: input
        description: verbatim claim sentence as it will appear in labeling and advertising
      - name: claim_type
        type: enum
        source: input
        description: regulatory category of the claim; STRUCTURE_FUNCTION and GENERAL_WELLBEING both require the FDA disclaimer on the panel
        constraints: "STRUCTURE_FUNCTION | NUTRIENT_CONTENT | GENERAL_WELLBEING"
      - name: substantiation_status
        type: enum
        source: system
        description: first (substantiation) dimension of the parallel StructureFunctionClaim state machine
        default: DRAFT
        constraints: "DRAFT | UNDER_SUBSTANTIATION_REVIEW | REVISION_REQUESTED | APPROVED | WITHDRAWN"
      - name: notification_status
        type: enum
        source: system
        description: second (agency-notification) dimension of the parallel StructureFunctionClaim state machine; evolves independently of substantiation_status
        default: NOT_DUE
        constraints: "NOT_DUE | DUE | SUBMITTED_TIMELY | SUBMITTED_LATE"
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RegulatorySpecialist that created the claim; segregation-of-duties comparand"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RegulatoryAffairsManager that approved the claim; null while substantiation_status != APPROVED"
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "logical-clock instant of approval; null until the claim first reaches APPROVED, retained thereafter"
        default: null
      - name: notification_due_date
        type: string
        source: computed
        description: "UTC calendar date (YYYY-MM-DD) from calculations.claim_notification_due_date; null while notification_status == NOT_DUE"
        default: null
      - name: notification_due_basis
        type: enum
        source: computed
        description: "which variant of calculations.claim_notification_due_date produced notification_due_date; null while notification_status == NOT_DUE"
        default: null
        constraints: "PRODUCT_LAUNCH_BASIS | CLAIM_ACTIVATION_BASIS | null"
      - name: notified_at
        type: datetime
        source: system
        description: "logical-clock instant the notification was filed with the agency; null while notification_status IN {NOT_DUE, DUE}"
        default: null
      - name: submission_reference
        type: string
        source: input
        description: "agency submission reference recorded at notify-fda time; null while notification_status IN {NOT_DUE, DUE}"
        default: null
      - name: revision_round
        type: integer
        source: computed
        description: "number of completed revision loops; incremented on each REVISION_REQUESTED -> UNDER_SUBSTANTIATION_REVIEW transition; hard cap 3"
        default: 0
      - name: requires_recheck
        type: boolean
        source: computed
        description: "set true when a posture cascade pulls an APPROVED claim back into REVISION_REQUESTED; cleared on the next APPROVED transition"
        default: false
      - name: withdrawal_reason
        type: string
        source: input
        description: "reason recorded at withdrawal; null while substantiation_status != WITHDRAWN"
        default: null

  - name: SubstantiationDossier
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> StructureFunctionClaim.id; the claim this dossier substantiates"
      - name: dossier_summary
        type: string
        source: input
        description: narrative summary of the totality of evidence relied on
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RegulatorySpecialist that created the dossier; may not equal reviewed_by_user_id"
      - name: dossier_status
        type: enum
        source: system
        description: dossier lifecycle driven by the SubstantiationDossier state machine
        default: DRAFT
        constraints: "DRAFT | UNDER_REVIEW | ACCEPTED | REJECTED | SUPERSEDED"
      - name: evidence_studies
        type: array
        source: system
        description: "append-only array of study objects {study_type, subject_count, dose_match, peer_reviewed, citation} added through the evidence endpoint"
        default: []
      - name: study_count
        type: integer
        source: computed
        description: length of evidence_studies
        default: 0
      - name: screening_score
        type: number
        source: computed
        description: "screening_provisional variant of calculations.substantiation_strength_score; recomputed on every evidence append"
        default: 0.00
      - name: final_score
        type: number
        source: computed
        description: "competent_reliable_final variant of calculations.substantiation_strength_score; frozen when the claim enters UNDER_SUBSTANTIATION_REVIEW; null before that"
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RegulatoryAffairsManager that reviewed the dossier; null while dossier_status IN {DRAFT, UNDER_REVIEW, SUPERSEDED}"
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: "logical-clock instant of the review decision; null until a decision is recorded"
        default: null
      - name: review_decision
        type: enum
        source: input
        description: "reviewer's recorded decision; null until a decision is recorded"
        default: null
        constraints: "ACCEPT | REJECT | null"
      - name: rejection_reason
        type: string
        source: input
        description: "reason text recorded with a REJECT decision; null otherwise"
        default: null

  - name: LabelPanel
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product this supplement facts panel belongs to"
      - name: supersedes_panel_id
        type: string
        source: input
        description: "FK -> LabelPanel.id; nullable self-reference naming the panel this one replaces, excluding it from the effective-window collision check"
        default: null
      - name: panel_format
        type: enum
        source: input
        description: printed panel layout; selects the panel line allowance tier
        constraints: "STANDARD | SIMPLIFIED | LINEAR"
      - name: serving_size_text
        type: string
        source: input
        description: "printed serving size statement; must match ^[0-9]+(\\.[0-9]+)? (capsule|capsules|tablet|tablets|scoop|scoops|mL|g)$"
      - name: serving_weight_g
        type: number
        source: input
        description: mass of one serving in grams; reconciled against Product.net_quantity_g and servings_per_container_declared
        constraints: "> 0"
      - name: servings_per_container_declared
        type: integer
        source: input
        description: servings-per-container figure printed on this panel
        constraints: ">= 1"
      - name: effective_from
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) the panel becomes the printed label; inclusive lower bound of the occupied window"
      - name: effective_until
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) the panel stops being the printed label; inclusive upper bound of the occupied window"
      - name: declared_warning_codes
        type: array
        source: input
        description: array of warning statement codes the submitter has printed on this panel
      - name: disclaimer_text
        type: string
        source: input
        description: "verbatim FDA disclaimer sentence pair printed on the panel; null when the submitter prints none"
        default: null
      - name: panel_status
        type: enum
        source: system
        description: panel lifecycle driven by the LabelPanel state machine
        default: DRAFT
        constraints: "DRAFT | VALIDATED | LOCKED | SUPERSEDED"
      - name: required_warning_codes
        type: array
        source: computed
        description: "output of calculations.required_warning_codes; lexicographic ASC array of codes the panel must carry"
        default: []
      - name: panel_lines_required
        type: integer
        source: computed
        description: "output of calculations.panel_line_budget (required side); null until the panel is validated"
        default: null
      - name: panel_lines_allowed
        type: integer
        source: computed
        description: "output of calculations.panel_line_budget (allowed side); null until the panel is validated"
        default: null
      - name: panel_total_dv_coverage_pct
        type: integer
        source: computed
        description: "output of calculations.panel_total_dv_coverage_pct; null until the panel is validated"
        default: null
      - name: validated_at
        type: datetime
        source: system
        description: "logical-clock instant the panel passed validation; null while panel_status == DRAFT"
        default: null
      - name: locked_at
        type: datetime
        source: system
        description: "logical-clock instant the panel was locked; null while panel_status IN {DRAFT, VALIDATED}"
        default: null

  - name: AdverseEventReport
    parent: null
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the product named in the report"
      - name: reporter_type
        type: enum
        source: input
        description: source category of the report
        constraints: "CONSUMER | HEALTHCARE_PROVIDER | DISTRIBUTOR"
      - name: received_date
        type: string
        source: input
        description: "UTC calendar date (YYYY-MM-DD) the firm received the report; day 0 of the business-day submission clock"
      - name: narrative
        type: string
        source: input
        description: verbatim event narrative as received
      - name: outcome_codes
        type: array
        source: input
        description: "array of outcome codes from {DEATH, LIFE_THREATENING, HOSPITALIZATION, DISABILITY, CONGENITAL_ANOMALY, INTERVENTION_REQUIRED, OTHER}"
      - name: is_serious
        type: boolean
        source: computed
        description: "true exactly when outcome_codes intersects {DEATH, LIFE_THREATENING, HOSPITALIZATION, DISABILITY, CONGENITAL_ANOMALY} or the triage call passed serious_override == true"
        default: false
      - name: aer_status
        type: enum
        source: system
        description: report lifecycle driven by the AdverseEventReport state machine
        default: RECEIVED
        constraints: "RECEIVED | TRIAGED_SERIOUS | TRIAGED_NONSERIOUS | SUBMITTED_TO_FDA"
      - name: submission_due_date
        type: string
        source: computed
        description: "UTC calendar date from calculations.serious_ae_submission_due_date; null unless aer_status IN {TRIAGED_SERIOUS, SUBMITTED_TO_FDA}"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "logical-clock instant the serious report was filed; null while aer_status != SUBMITTED_TO_FDA"
        default: null
      - name: submission_timeliness
        type: enum
        source: computed
        description: "TIMELY when the submission date <= submission_due_date, LATE otherwise; null while aer_status != SUBMITTED_TO_FDA"
        default: null
        constraints: "TIMELY | LATE | null"
      - name: submission_reference
        type: string
        source: input
        description: "agency submission reference recorded at submit time; null while aer_status != SUBMITTED_TO_FDA"
        default: null
      - name: retention_until
        type: string
        source: computed
        description: "recordkeeping horizon: received_date with year + 6 (Feb 29 maps to Feb 28); set at intake"
        default: null
      - name: triaged_at
        type: datetime
        source: system
        description: "logical-clock instant of triage; null while aer_status == RECEIVED"
        default: null

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: supplier_name
        type: string
        source: input
        description: legal name of the ingredient supplier
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the manufacturing site
      - name: qualification_status
        type: enum
        source: system
        description: qualification lifecycle driven by the Supplier state machine
        default: UNQUALIFIED
        constraints: "UNQUALIFIED | QUALIFIED | PROBATION | DISQUALIFIED"
      - name: audit_score
        type: integer
        source: input
        description: "most recent qualification audit score 0-100; null until a QUALIFY decision is recorded"
        default: null
      - name: coa_rejection_count
        type: integer
        source: computed
        description: "running count of CertificateOfAnalysis rejections charged to this supplier; reset to 0 by a REINSTATE decision"
        default: 0
      - name: total_released_kg
        type: number
        source: computed
        description: "conserved ledger: sum of IngredientLot.released_quantity_kg over this supplier's lots with lot_status == RELEASED"
        default: 0.00
      - name: remediation_reference
        type: string
        source: input
        description: "CAPA reference recorded with a REINSTATE decision; null otherwise"
        default: null
      - name: last_decision_at
        type: datetime
        source: system
        description: "logical-clock instant of the most recent qualification decision; null while qualification_status == UNQUALIFIED"
        default: null

  - name: IngredientLot
    parent: null
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; the supplier that shipped the lot"
      - name: ingredient_id
        type: string
        source: input
        description: "FK -> Ingredient.id; the dietary ingredient the lot contains"
      - name: lot_code
        type: string
        source: input
        description: supplier's lot identifier as printed on the container
      - name: quantity_kg
        type: number
        source: input
        description: total mass of the lot in kilograms; immutable conserved total
        constraints: "> 0"
      - name: quarantined_quantity_kg
        type: number
        source: computed
        description: "mass still under quarantine; initialized to quantity_kg at intake"
        default: 0.00
      - name: released_quantity_kg
        type: number
        source: computed
        description: mass released to manufacturing
        default: 0.00
      - name: rejected_quantity_kg
        type: number
        source: computed
        description: mass rejected or recalled
        default: 0.00
      - name: lot_status
        type: enum
        source: system
        description: lot disposition driven by the IngredientLot state machine
        default: QUARANTINED
        constraints: "QUARANTINED | RELEASED | RECALLED | REJECTED"
      - name: identity_verified
        type: boolean
        source: computed
        description: "true exactly when at least one CertificateOfAnalysis on this lot has coa_status == ACCEPTED and identity_match == true"
        default: false
      - name: released_at
        type: datetime
        source: system
        description: "logical-clock instant of release; null while lot_status IN {QUARANTINED, REJECTED}"
        default: null
      - name: recalled_at
        type: datetime
        source: system
        description: "logical-clock instant of recall; null while lot_status != RECALLED"
        default: null
      - name: recall_reason
        type: string
        source: input
        description: "reason recorded with a recall; null while lot_status != RECALLED"
        default: null

  - name: CertificateOfAnalysis
    parent: null
    common_fields: true
    fields:
      - name: lot_id
        type: string
        source: input
        description: "FK -> IngredientLot.id; the lot this certificate characterizes"
      - name: lab_name
        type: string
        source: input
        description: name of the testing laboratory that issued the certificate
      - name: identity_test_method
        type: enum
        source: input
        description: analytical method used for identity confirmation; must be approved for the lot ingredient's ingredient_class
        constraints: "HPTLC | HPLC | MASS_SPEC | DNA_BARCODE | MICROSCOPY | ORGANOLEPTIC"
      - name: identity_match
        type: boolean
        source: input
        description: whether the identity test confirmed the labeled article
      - name: assay_percent_of_label
        type: number
        source: input
        description: assay result as a percentage of the label amount
        constraints: ">= 0"
      - name: heavy_metals_pass
        type: boolean
        source: input
        description: whether heavy-metal limits were met
      - name: microbial_pass
        type: boolean
        source: input
        description: whether microbial limits were met
      - name: coa_acceptable
        type: boolean
        source: computed
        description: "true exactly when identity_match == true AND 95.0 <= assay_percent_of_label <= 120.0 AND heavy_metals_pass == true AND microbial_pass == true"
        default: false
      - name: coa_status
        type: enum
        source: system
        description: certificate review lifecycle driven by the CertificateOfAnalysis state machine
        default: RECEIVED
        constraints: "RECEIVED | ACCEPTED | REJECTED"
      - name: review_decision
        type: enum
        source: input
        description: "reviewer's recorded decision; null while coa_status == RECEIVED"
        default: null
        constraints: "ACCEPT | REJECT | null"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the QualityAssuranceReviewer that reviewed the certificate; null while coa_status == RECEIVED"
        default: null
      - name: reviewed_at
        type: datetime
        source: system
        description: "logical-clock instant of the review; null while coa_status == RECEIVED"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: "reason text recorded with a REJECT decision; null otherwise"
        default: null

state_machines:
  # ---------------------------------------------------------------------------
  # Product carries TWO independent state dimensions on the same row:
  #   (1) lifecycle_status : DRAFT -> LABEL_LOCKED -> MARKETED, with the cyclic
  #       edge LABEL_LOCKED -> DRAFT when the locked panel is superseded.
  #   (2) label_posture    : OPEN <-> RESTRICTED <-> FROZEN, recomputed by
  #       calculations.product_label_posture. Posture moves on its own and gates
  #       lifecycle transitions; lifecycle moves never change posture.
  # ---------------------------------------------------------------------------
  - entity: Product
    initial_state: DRAFT
    terminal_states: [MARKETED]
    transitions:
      - from: DRAFT
        to: LABEL_LOCKED
        trigger: "POST /supplement-compliance/label-panels/{id}/lock (cascaded side effect on the panel's Product)"
        actor: ClaimApprovalOfficer
        preconditions:
          - "product.lifecycle_status == DRAFT"
          - "product.label_posture != FROZEN"
          - "the locking panel's panel_status == VALIDATED"
        side_effects:
          - "sets product.lifecycle_status = LABEL_LOCKED"
          - "increments Product.version by 1 and refreshes updated_at"
        note: "The lock endpoint targets the LabelPanel; the Product transition is the cascaded consequence."
      - from: LABEL_LOCKED
        to: DRAFT
        trigger: "POST /supplement-compliance/label-panels (creating a replacement panel whose supersedes_panel_id names the LOCKED panel)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "product.lifecycle_status == LABEL_LOCKED"
          - "product.label_posture != FROZEN"
          - "the panel named by supersedes_panel_id has panel_status == LOCKED and product_id == this product"
        side_effects:
          - "sets product.lifecycle_status = DRAFT"
          - "sets the superseded panel's panel_status = SUPERSEDED"
          - "increments Product.version by 1"
        note: "Cyclic edge: a marketed-label revision returns the product to DRAFT until the new panel is locked."
      - from: LABEL_LOCKED
        to: MARKETED
        trigger: "POST /supplement-compliance/products/{id}/start-marketing"
        actor: ClaimApprovalOfficer
        preconditions:
          - "product.lifecycle_status == LABEL_LOCKED"
          - "product.label_posture != FROZEN"
          - "every Supplier in the derived supplier set (see validations priority 17) has qualification_status == QUALIFIED; an empty derived set satisfies the check"
        side_effects:
          - "sets product.lifecycle_status = MARKETED and marketing_start_date = date(logical clock)"
          - "for every StructureFunctionClaim of this product with substantiation_status == APPROVED and notification_status == NOT_DUE: sets notification_status = DUE, notification_due_basis = PRODUCT_LAUNCH_BASIS and notification_due_date = marketing_start_date + 30 days"
          - "increments Product.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "system: calculations.product_label_posture recomputation (compliance_risk_index >= 70, or a Supplier of an ACTIVE line reaches PROBATION)"
        actor: system
        preconditions:
          - "product.label_posture == OPEN"
          - "compliance_risk_index >= 70 OR at least one Supplier in the derived supplier set has qualification_status == PROBATION"
          - "no FROZEN condition holds (see OPEN -> FROZEN)"
        side_effects:
          - "sets product.label_posture = RESTRICTED and requires_label_revision = true"
          - "for every StructureFunctionClaim of this product with substantiation_status == APPROVED: sets substantiation_status = REVISION_REQUESTED, requires_recheck = true and decrements Product.active_claim_count by 1"
          - "for every SubstantiationDossier whose claim_id is one of those claims and whose dossier_status == ACCEPTED: sets dossier_status = UNDER_REVIEW"
          - "increments Product.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: calculations.product_label_posture recomputation after a compensating action (lot recall, claim withdrawal, supplier REINSTATE)"
        actor: system
        preconditions:
          - "product.label_posture == RESTRICTED"
          - "compliance_risk_index < 70"
          - "no Supplier in the derived supplier set has qualification_status IN {PROBATION, DISQUALIFIED}"
          - "no Ingredient on an ACTIVE line has eligibility_status == NDI_OBJECTED"
        side_effects:
          - "sets product.label_posture = OPEN and requires_label_revision = false"
          - "increments Product.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system: calculations.product_label_posture recomputation (compliance_risk_index >= 90, a Supplier reaches DISQUALIFIED, or an Ingredient reaches NDI_OBJECTED)"
        actor: system
        preconditions:
          - "product.label_posture == RESTRICTED"
          - "compliance_risk_index >= 90 OR a Supplier in the derived supplier set has qualification_status == DISQUALIFIED OR an Ingredient on an ACTIVE line has eligibility_status == NDI_OBJECTED"
        side_effects:
          - "sets product.label_posture = FROZEN and requires_label_revision = true"
          - "for every LabelPanel of this product with panel_status IN {DRAFT, VALIDATED, LOCKED}: sets panel_status = SUPERSEDED"
          - "if product.lifecycle_status == LABEL_LOCKED: sets lifecycle_status = DRAFT"
          - "increments Product.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system: calculations.product_label_posture recomputation (same FROZEN conditions reached directly from OPEN)"
        actor: system
        preconditions:
          - "product.label_posture == OPEN"
          - "compliance_risk_index >= 90 OR a Supplier in the derived supplier set has qualification_status == DISQUALIFIED OR an Ingredient on an ACTIVE line has eligibility_status == NDI_OBJECTED"
        side_effects:
          - "sets product.label_posture = FROZEN and requires_label_revision = true"
          - "for every LabelPanel of this product with panel_status IN {DRAFT, VALIDATED, LOCKED}: sets panel_status = SUPERSEDED"
          - "if product.lifecycle_status == LABEL_LOCKED: sets lifecycle_status = DRAFT"
          - "increments Product.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "POST /supplement-compliance/suppliers/{id}/qualification-decision with decision == REINSTATE (cascaded posture recomputation)"
        actor: system
        preconditions:
          - "product.label_posture == FROZEN"
          - "no Supplier in the derived supplier set has qualification_status == DISQUALIFIED"
          - "no Ingredient on an ACTIVE line has eligibility_status == NDI_OBJECTED"
          - "compliance_risk_index >= 70 AND compliance_risk_index < 90"
        side_effects:
          - "sets product.label_posture = RESTRICTED"
          - "increments Product.version by 1"
        note: "Superseded panels are NOT resurrected; a new panel must be created and locked."
      - from: FROZEN
        to: OPEN
        trigger: "POST /supplement-compliance/suppliers/{id}/qualification-decision with decision == REINSTATE (cascaded posture recomputation)"
        actor: system
        preconditions:
          - "product.label_posture == FROZEN"
          - "no Supplier in the derived supplier set has qualification_status IN {PROBATION, DISQUALIFIED}"
          - "no Ingredient on an ACTIVE line has eligibility_status == NDI_OBJECTED"
          - "compliance_risk_index < 70"
        side_effects:
          - "sets product.label_posture = OPEN and requires_label_revision = false"
          - "increments Product.version by 1"

  - entity: Ingredient
    initial_state: DRAFT_ASSESSMENT
    terminal_states: [GRANDFATHERED, NDI_ACKNOWLEDGED, NDI_OBJECTED, INELIGIBLE]
    transitions:
      - from: DRAFT_ASSESSMENT
        to: GRANDFATHERED
        trigger: "POST /supplement-compliance/ingredients/{id}/eligibility-determination"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "ingredient.eligibility_status == DRAFT_ASSESSMENT"
          - "ingredient_class != EXCLUDED_SUBSTANCE"
          - "pre_dshea_marketed == true AND chemical_alteration == false AND daily_intake_mg <= 5000"
        side_effects:
          - "sets eligibility_status = GRANDFATHERED, ndi_notification_required = false, determined_at = logical clock"
      - from: DRAFT_ASSESSMENT
        to: NDI_REQUIRED
        trigger: "POST /supplement-compliance/ingredients/{id}/eligibility-determination"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "ingredient.eligibility_status == DRAFT_ASSESSMENT"
          - "ingredient_class != EXCLUDED_SUBSTANCE"
          - "pre_dshea_marketed == false OR chemical_alteration == true OR daily_intake_mg > 5000"
        side_effects:
          - "sets eligibility_status = NDI_REQUIRED, ndi_notification_required = true, determined_at = logical clock"
      - from: DRAFT_ASSESSMENT
        to: INELIGIBLE
        trigger: "POST /supplement-compliance/ingredients/{id}/eligibility-determination"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "ingredient.eligibility_status == DRAFT_ASSESSMENT"
          - "ingredient_class == EXCLUDED_SUBSTANCE"
        side_effects:
          - "sets eligibility_status = INELIGIBLE, ndi_notification_required = false, determined_at = logical clock"
      - from: NDI_REQUIRED
        to: NDI_PENDING
        trigger: "POST /supplement-compliance/ndi-notifications/{id}/submit (cascaded side effect on the notification's Ingredient)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "ingredient.eligibility_status == NDI_REQUIRED"
        side_effects:
          - "sets eligibility_status = NDI_PENDING"
      - from: NDI_PENDING
        to: NDI_ACKNOWLEDGED
        trigger: "POST /supplement-compliance/ndi-notifications/{id}/agency-response with response == ACKNOWLEDGE"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "ingredient.eligibility_status == NDI_PENDING"
          - "logical clock >= notification.waiting_period_end"
        side_effects:
          - "sets eligibility_status = NDI_ACKNOWLEDGED"
      - from: NDI_PENDING
        to: NDI_OBJECTED
        trigger: "POST /supplement-compliance/ndi-notifications/{id}/agency-response with response == OBJECT"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "ingredient.eligibility_status == NDI_PENDING"
        side_effects:
          - "sets eligibility_status = NDI_OBJECTED"
          - "for every Product with a ProductIngredient row referencing this ingredient with line_status == ACTIVE: recomputes label_posture, which yields FROZEN (see Product OPEN -> FROZEN / RESTRICTED -> FROZEN)"
        note: "An objection is terminal for the ingredient; the objected article cannot re-enter the eligibility flow."

  - entity: NDINotification
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, OBJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /supplement-compliance/ndi-notifications/{id}/submit"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "notification.notification_status == DRAFT"
          - "ingredient.eligibility_status IN {NDI_REQUIRED, NDI_PENDING}"
          - "the half-open interval [logical clock, logical clock + 75 days) does not overlap the interval [submitted_at, waiting_period_end) of any other NDINotification on the same ingredient_id with notification_status == SUBMITTED"
        side_effects:
          - "sets submitted_at = logical clock and waiting_period_end = submitted_at + 75 days (calculations.ndi_waiting_period_end)"
          - "sets notification_status = SUBMITTED"
          - "if ingredient.eligibility_status == NDI_REQUIRED: sets it to NDI_PENDING"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /supplement-compliance/ndi-notifications/{id}/agency-response with response == ACKNOWLEDGE"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "notification.notification_status == SUBMITTED"
          - "logical clock >= notification.waiting_period_end"
        side_effects:
          - "sets notification_status = ACKNOWLEDGED and agency_response_at = logical clock"
          - "sets ingredient.eligibility_status = NDI_ACKNOWLEDGED"
      - from: SUBMITTED
        to: OBJECTED
        trigger: "POST /supplement-compliance/ndi-notifications/{id}/agency-response with response == OBJECT"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "notification.notification_status == SUBMITTED"
        side_effects:
          - "sets notification_status = OBJECTED, agency_response_at = logical clock, agency_objection_reason = the supplied objection_reason"
          - "sets ingredient.eligibility_status = NDI_OBJECTED, which cascades label_posture = FROZEN onto every Product with an ACTIVE line on that ingredient"

  # ---------------------------------------------------------------------------
  # StructureFunctionClaim carries TWO independent state dimensions:
  #   (1) substantiation_status with the revision cycle
  #       UNDER_SUBSTANTIATION_REVIEW -> REVISION_REQUESTED -> UNDER_SUBSTANTIATION_REVIEW
  #   (2) notification_status : NOT_DUE -> DUE -> SUBMITTED_TIMELY | SUBMITTED_LATE
  # A claim can sit in (APPROVED, DUE) and move only on dimension (2), or be pulled
  # back to (REVISION_REQUESTED, DUE) leaving dimension (2) untouched.
  # ---------------------------------------------------------------------------
  - entity: StructureFunctionClaim
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUBMITTED_TIMELY, SUBMITTED_LATE]
    transitions:
      - from: DRAFT
        to: UNDER_SUBSTANTIATION_REVIEW
        trigger: "POST /supplement-compliance/claims/{id}/submit-for-review"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "claim.substantiation_status == DRAFT"
          - "product.label_posture != FROZEN"
          - "ingredient.eligibility_status IN {GRANDFATHERED, NDI_ACKNOWLEDGED}"
          - "exactly one SubstantiationDossier for this claim has dossier_status == DRAFT"
          - "that dossier's study_count >= 1"
        side_effects:
          - "sets claim.substantiation_status = UNDER_SUBSTANTIATION_REVIEW"
          - "sets that dossier's dossier_status = UNDER_REVIEW"
          - "freezes dossier.final_score = competent_reliable_final variant of calculations.substantiation_strength_score"
          - "increments StructureFunctionClaim.version by 1"
      - from: REVISION_REQUESTED
        to: UNDER_SUBSTANTIATION_REVIEW
        trigger: "POST /supplement-compliance/claims/{id}/submit-for-review"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "claim.substantiation_status == REVISION_REQUESTED"
          - "claim.revision_round < 3"
          - "product.label_posture != FROZEN"
          - "ingredient.eligibility_status IN {GRANDFATHERED, NDI_ACKNOWLEDGED}"
          - "exactly one SubstantiationDossier for this claim has dossier_status == DRAFT"
          - "that dossier's study_count >= 1"
        side_effects:
          - "increments claim.revision_round by 1"
          - "sets claim.substantiation_status = UNDER_SUBSTANTIATION_REVIEW"
          - "sets that dossier's dossier_status = UNDER_REVIEW and freezes its final_score"
          - "increments StructureFunctionClaim.version by 1"
        note: "Cyclic edge; the third completed loop leaves revision_round == 3 and any further submit is rejected."
      - from: UNDER_SUBSTANTIATION_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /supplement-compliance/substantiation-dossiers/{id}/review with decision == REJECT (cascaded side effect on the dossier's claim)"
        actor: SubstantiationReviewer
        preconditions:
          - "claim.substantiation_status == UNDER_SUBSTANTIATION_REVIEW"
          - "the reviewed dossier's dossier_status == UNDER_REVIEW and its claim_id == this claim"
        side_effects:
          - "sets claim.substantiation_status = REVISION_REQUESTED"
          - "increments StructureFunctionClaim.version by 1"
      - from: APPROVED
        to: REVISION_REQUESTED
        trigger: "system: Product label_posture recomputation leaving OPEN (see Product OPEN -> RESTRICTED)"
        actor: system
        preconditions:
          - "claim.substantiation_status == APPROVED"
          - "the claim's Product just moved label_posture from OPEN to RESTRICTED"
        side_effects:
          - "sets claim.substantiation_status = REVISION_REQUESTED and requires_recheck = true"
          - "decrements Product.active_claim_count by 1"
          - "sets the claim's ACCEPTED SubstantiationDossier to dossier_status = UNDER_REVIEW"
          - "leaves notification_status and notification_due_date untouched"
      - from: UNDER_SUBSTANTIATION_REVIEW
        to: APPROVED
        trigger: "POST /supplement-compliance/claims/{id}/approve"
        actor: ClaimApprovalOfficer
        preconditions:
          - "claim.substantiation_status == UNDER_SUBSTANTIATION_REVIEW"
          - "product.label_posture != FROZEN"
          - "the claim has exactly one SubstantiationDossier with dossier_status == ACCEPTED"
          - "X-User-ID != that dossier's reviewed_by_user_id"
        side_effects:
          - "sets claim.substantiation_status = APPROVED, approved_by_user_id = X-User-ID, approved_at = logical clock, requires_recheck = false"
          - "increments Product.active_claim_count by 1"
          - "if product.lifecycle_status == MARKETED: sets notification_status = DUE, notification_due_basis = CLAIM_ACTIVATION_BASIS, notification_due_date = date(approved_at) + 30 days"
          - "if product.lifecycle_status IN {DRAFT, LABEL_LOCKED}: leaves notification_status = NOT_DUE"
          - "increments StructureFunctionClaim.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /supplement-compliance/claims/{id}/withdraw"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "claim.substantiation_status == APPROVED"
        side_effects:
          - "sets claim.substantiation_status = WITHDRAWN and withdrawal_reason = the supplied reason"
          - "decrements Product.active_claim_count by 1 and increments Product.withdrawn_claim_count by 1"
          - "increments StructureFunctionClaim.version by 1"
        note: "Compensating action for approval; conserves Product.active_claim_count (see calculations.claim_ledger_invariant)."
      - from: NOT_DUE
        to: DUE
        trigger: "POST /supplement-compliance/products/{id}/start-marketing, or POST /supplement-compliance/claims/{id}/approve on an already MARKETED product"
        actor: ClaimApprovalOfficer
        preconditions:
          - "claim.notification_status == NOT_DUE"
          - "claim.substantiation_status == APPROVED"
          - "product.lifecycle_status == MARKETED (either just set by start-marketing, or already set at approval time)"
        side_effects:
          - "sets notification_status = DUE and computes notification_due_date + notification_due_basis per calculations.claim_notification_due_date"
      - from: DUE
        to: SUBMITTED_TIMELY
        trigger: "POST /supplement-compliance/claims/{id}/notify-fda"
        actor: ClaimApprovalOfficer
        preconditions:
          - "claim.notification_status == DUE"
          - "claim.substantiation_status == APPROVED"
          - "date(logical clock) <= claim.notification_due_date"
        side_effects:
          - "sets notification_status = SUBMITTED_TIMELY, notified_at = logical clock, submission_reference = the supplied reference"
          - "increments StructureFunctionClaim.version by 1"
      - from: DUE
        to: SUBMITTED_LATE
        trigger: "POST /supplement-compliance/claims/{id}/notify-fda"
        actor: ClaimApprovalOfficer
        preconditions:
          - "claim.notification_status == DUE"
          - "claim.substantiation_status == APPROVED"
          - "date(logical clock) > claim.notification_due_date"
        side_effects:
          - "sets notification_status = SUBMITTED_LATE, notified_at = logical clock, submission_reference = the supplied reference"
          - "increments Product.late_notification_count by 1, which recomputes compliance_risk_index and then label_posture"
          - "increments StructureFunctionClaim.version by 1"

  - entity: SubstantiationDossier
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /supplement-compliance/claims/{id}/submit-for-review (cascaded side effect on the claim's DRAFT dossier)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "dossier.dossier_status == DRAFT"
          - "dossier.study_count >= 1"
        side_effects:
          - "sets dossier_status = UNDER_REVIEW"
          - "freezes final_score = competent_reliable_final variant of calculations.substantiation_strength_score"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /supplement-compliance/substantiation-dossiers (a replacement dossier for the same claim)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "dossier.dossier_status == DRAFT"
          - "the new dossier carries the same claim_id"
        side_effects:
          - "sets dossier_status = SUPERSEDED"
        note: "Create-with-supersede: the OCC guard on StructureFunctionClaim.version resolves stale writers (see concurrency_rules.dossier-create-stale-claim)."
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /supplement-compliance/substantiation-dossiers/{id}/review with decision == ACCEPT"
        actor: SubstantiationReviewer
        preconditions:
          - "dossier.dossier_status == UNDER_REVIEW"
          - "X-User-ID != dossier.authored_by_user_id"
          - "dossier.final_score >= 65.00"
        side_effects:
          - "sets dossier_status = ACCEPTED, review_decision = ACCEPT, reviewed_by_user_id = X-User-ID, reviewed_at = logical clock"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /supplement-compliance/substantiation-dossiers/{id}/review with decision == REJECT"
        actor: SubstantiationReviewer
        preconditions:
          - "dossier.dossier_status == UNDER_REVIEW"
          - "X-User-ID != dossier.authored_by_user_id"
        side_effects:
          - "sets dossier_status = REJECTED, review_decision = REJECT, rejection_reason = the supplied reason, reviewed_by_user_id = X-User-ID, reviewed_at = logical clock"
          - "sets the claim's substantiation_status = REVISION_REQUESTED (claim UNDER_SUBSTANTIATION_REVIEW -> REVISION_REQUESTED)"
      - from: ACCEPTED
        to: UNDER_REVIEW
        trigger: "system: Product label_posture recomputation leaving OPEN pulls the APPROVED claim back for recheck"
        actor: system
        preconditions:
          - "dossier.dossier_status == ACCEPTED"
          - "the dossier's claim just moved APPROVED -> REVISION_REQUESTED because its Product left label_posture OPEN"
        side_effects:
          - "sets dossier_status = UNDER_REVIEW, clears reviewed_by_user_id, reviewed_at and review_decision to null"
        note: "Cyclic edge: a re-reviewed dossier may be ACCEPTED or REJECTED again by a manager other than its author."

  - entity: LabelPanel
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /supplement-compliance/label-panels/{id}/validate"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "panel.panel_status == DRAFT"
          - "product.label_posture != FROZEN"
          - "serving_size_text matches the printed-serving pattern"
          - "servings_per_container_declared == round_half_up(product.net_quantity_g / serving_weight_g) AND == product.servings_per_container"
          - "required_warning_codes is a subset of declared_warning_codes"
          - "when the product has at least one StructureFunctionClaim with substantiation_status == APPROVED and claim_type IN {STRUCTURE_FUNCTION, GENERAL_WELLBEING}: disclaimer_text equals the verbatim FDA disclaimer constant"
          - "panel_lines_required <= panel_lines_allowed"
        side_effects:
          - "computes and persists required_warning_codes, panel_lines_required, panel_lines_allowed, panel_total_dv_coverage_pct"
          - "sets panel_status = VALIDATED and validated_at = logical clock"
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /supplement-compliance/label-panels/{id}/lock"
        actor: ClaimApprovalOfficer
        preconditions:
          - "panel.panel_status == VALIDATED"
          - "product.label_posture != FROZEN"
          - "every Ingredient referenced by a ProductIngredient row of this product with line_status == ACTIVE has eligibility_status IN {GRANDFATHERED, NDI_ACKNOWLEDGED}"
        side_effects:
          - "sets panel_status = LOCKED and locked_at = logical clock"
          - "sets product.lifecycle_status = LABEL_LOCKED (Product DRAFT -> LABEL_LOCKED)"
      - from: LOCKED
        to: SUPERSEDED
        trigger: "POST /supplement-compliance/label-panels with supersedes_panel_id naming this panel, or a Product posture recomputation reaching FROZEN"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "panel.panel_status == LOCKED"
        side_effects:
          - "sets panel_status = SUPERSEDED"
          - "if triggered by a replacement panel: sets product.lifecycle_status = DRAFT (Product LABEL_LOCKED -> DRAFT)"
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "POST /supplement-compliance/label-panels with supersedes_panel_id naming this panel, or a Product posture recomputation reaching FROZEN"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "panel.panel_status == VALIDATED"
        side_effects:
          - "sets panel_status = SUPERSEDED"

  - entity: Supplier
    initial_state: UNQUALIFIED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: UNQUALIFIED
        to: QUALIFIED
        trigger: "POST /supplement-compliance/suppliers/{id}/qualification-decision with decision == QUALIFY"
        actor: QualityAssuranceManager
        preconditions:
          - "supplier.qualification_status == UNQUALIFIED"
          - "audit_score is supplied and audit_score >= 70"
        side_effects:
          - "sets qualification_status = QUALIFIED, audit_score = the supplied score, last_decision_at = logical clock"
      - from: QUALIFIED
        to: PROBATION
        trigger: "POST /supplement-compliance/coas/{id}/review with decision == REJECT raising coa_rejection_count to 1 (cascade), or POST /supplement-compliance/suppliers/{id}/qualification-decision with decision == PROBATION"
        actor: QualityAssuranceManager
        preconditions:
          - "supplier.qualification_status == QUALIFIED"
          - "for the cascaded form: coa_rejection_count >= 1 after the increment"
        side_effects:
          - "sets qualification_status = PROBATION and last_decision_at = logical clock"
          - "for every Product with a ProductIngredient row (line_status == ACTIVE) on an ingredient this supplier has a lot for with lot_status IN {RELEASED, RECALLED, REJECTED}: recomputes label_posture, yielding RESTRICTED (Product OPEN -> RESTRICTED)"
      - from: PROBATION
        to: QUALIFIED
        trigger: "POST /supplement-compliance/suppliers/{id}/qualification-decision with decision == REINSTATE"
        actor: QualityAssuranceManager
        preconditions:
          - "supplier.qualification_status == PROBATION"
          - "remediation_reference is supplied and non-empty"
        side_effects:
          - "sets qualification_status = QUALIFIED, coa_rejection_count = 0, remediation_reference = the supplied reference, last_decision_at = logical clock"
          - "recomputes label_posture on every affected Product (Product RESTRICTED -> OPEN when no other condition holds)"
        note: "Cyclic edge closing QUALIFIED -> PROBATION -> QUALIFIED."
      - from: PROBATION
        to: DISQUALIFIED
        trigger: "POST /supplement-compliance/coas/{id}/review with decision == REJECT raising coa_rejection_count to 2 (cascade), or POST /supplement-compliance/suppliers/{id}/qualification-decision with decision == DISQUALIFY"
        actor: QualityAssuranceManager
        preconditions:
          - "supplier.qualification_status == PROBATION"
          - "for the cascaded form: coa_rejection_count >= 2 after the increment"
        side_effects:
          - "sets qualification_status = DISQUALIFIED and last_decision_at = logical clock"
          - "for every Product with a ProductIngredient row (line_status == ACTIVE) on an ingredient this supplier has a lot for with lot_status IN {RELEASED, RECALLED, REJECTED}: recomputes label_posture, yielding FROZEN, which supersedes that product's panels and returns a LABEL_LOCKED product to DRAFT"

  - entity: AdverseEventReport
    initial_state: RECEIVED
    terminal_states: [TRIAGED_NONSERIOUS, SUBMITTED_TO_FDA]
    transitions:
      - from: RECEIVED
        to: TRIAGED_SERIOUS
        trigger: "POST /supplement-compliance/adverse-event-reports/{id}/triage"
        actor: QualityAssuranceManager
        preconditions:
          - "aer.aer_status == RECEIVED"
          - "outcome_codes intersects {DEATH, LIFE_THREATENING, HOSPITALIZATION, DISABILITY, CONGENITAL_ANOMALY} OR serious_override == true"
        side_effects:
          - "sets is_serious = true, aer_status = TRIAGED_SERIOUS, triaged_at = logical clock"
          - "sets submission_due_date = calculations.serious_ae_submission_due_date"
          - "increments Product.serious_ae_count by 1, which recomputes compliance_risk_index and then label_posture"
      - from: RECEIVED
        to: TRIAGED_NONSERIOUS
        trigger: "POST /supplement-compliance/adverse-event-reports/{id}/triage"
        actor: QualityAssuranceManager
        preconditions:
          - "aer.aer_status == RECEIVED"
          - "outcome_codes does not intersect {DEATH, LIFE_THREATENING, HOSPITALIZATION, DISABILITY, CONGENITAL_ANOMALY} AND serious_override is absent or false"
        side_effects:
          - "sets is_serious = false, aer_status = TRIAGED_NONSERIOUS, triaged_at = logical clock, submission_due_date stays null"
          - "increments Product.nonserious_ae_count by 1, which recomputes compliance_risk_index and then label_posture"
        note: "Branching fork with divergent side-effect sets: only the serious branch mints a submission deadline and only it can be filed with the agency."
      - from: TRIAGED_SERIOUS
        to: SUBMITTED_TO_FDA
        trigger: "POST /supplement-compliance/adverse-event-reports/{id}/submit-to-fda"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "aer.aer_status == TRIAGED_SERIOUS"
        side_effects:
          - "sets aer_status = SUBMITTED_TO_FDA, submitted_at = logical clock, submission_reference = the supplied reference"
          - "sets submission_timeliness = TIMELY when date(logical clock) <= submission_due_date, else LATE"
          - "when LATE: increments Product.late_notification_count by 1, which recomputes compliance_risk_index and then label_posture"

  - entity: IngredientLot
    initial_state: QUARANTINED
    terminal_states: [RECALLED, REJECTED]
    transitions:
      - from: QUARANTINED
        to: RELEASED
        trigger: "POST /supplement-compliance/ingredient-lots/{id}/release"
        actor: QualityAssuranceManager
        preconditions:
          - "lot.lot_status == QUARANTINED"
          - "supplier.qualification_status == QUALIFIED"
          - "lot.identity_verified == true"
        side_effects:
          - "sets lot_status = RELEASED, released_at = logical clock"
          - "moves mass: released_quantity_kg = quantity_kg and quarantined_quantity_kg = 0.00"
          - "increments Supplier.total_released_kg by quantity_kg"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /supplement-compliance/ingredient-lots/{id}/recall, or POST /supplement-compliance/coas/{id}/review with decision == REJECT on a certificate of this RELEASED lot"
        actor: QualityAssuranceManager
        preconditions:
          - "lot.lot_status == RELEASED"
        side_effects:
          - "sets lot_status = RECALLED, recalled_at = logical clock, recall_reason = the supplied reason (or 'COA_REJECTED' for the cascaded form)"
          - "moves mass: rejected_quantity_kg = quantity_kg and released_quantity_kg = 0.00"
          - "decrements Supplier.total_released_kg by quantity_kg"
        note: "Compensating action for release; conserves Supplier.total_released_kg and the per-lot mass identity (see calculations.lot_mass_invariant)."
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /supplement-compliance/coas/{id}/review with decision == REJECT on a certificate of this QUARANTINED lot"
        actor: QualityAssuranceManager
        preconditions:
          - "lot.lot_status == QUARANTINED"
        side_effects:
          - "sets lot_status = REJECTED"
          - "moves mass: rejected_quantity_kg = quantity_kg and quarantined_quantity_kg = 0.00"

  - entity: CertificateOfAnalysis
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /supplement-compliance/coas/{id}/review with decision == ACCEPT"
        actor: QualityAssuranceManager
        preconditions:
          - "coa.coa_status == RECEIVED"
          - "coa.coa_acceptable == true"
        side_effects:
          - "sets coa_status = ACCEPTED, review_decision = ACCEPT, reviewed_by_user_id = X-User-ID, reviewed_at = logical clock"
          - "sets lot.identity_verified = true when identity_match == true"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /supplement-compliance/coas/{id}/review with decision == REJECT"
        actor: QualityAssuranceManager
        preconditions:
          - "coa.coa_status == RECEIVED"
        side_effects:
          - "sets coa_status = REJECTED, review_decision = REJECT, rejection_reason = the supplied reason, reviewed_by_user_id = X-User-ID, reviewed_at = logical clock"
          - "hop 1: the lot transitions QUARANTINED -> REJECTED or RELEASED -> RECALLED (mass moved to rejected_quantity_kg; Supplier.total_released_kg decremented on the RELEASED path)"
          - "hop 2: that lot disposition increments Supplier.coa_rejection_count by 1, moving QUALIFIED -> PROBATION at count 1 and PROBATION -> DISQUALIFIED at count 2"
          - "hop 3: that supplier transition recomputes label_posture on every Product with an ACTIVE line on the supplier's ingredient (RESTRICTED on PROBATION, FROZEN on DISQUALIFIED)"
          - "hop 4: the FROZEN posture supersedes that product's DRAFT/VALIDATED/LOCKED panels and returns a LABEL_LOCKED product to DRAFT; the RESTRICTED posture instead pulls APPROVED claims back to REVISION_REQUESTED and their ACCEPTED dossiers back to UNDER_REVIEW"
          - "increments Product.rejected_coa_count by 1 for every product with an ACTIVE line on the lot's ingredient, feeding calculations.product_compliance_risk_index"

concurrency_rules:
  - rule_id: panel-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /supplement-compliance/label-panels"
    occ_field: "expected_product_version"
    description: |
      Creating a LabelPanel against a Product whose version has advanced since the
      client last read it is rejected. Panel creation legitimately supersedes the
      product's current panel and can return a LABEL_LOCKED product to DRAFT, so a
      writer holding a stale view of the product would silently replace a panel it
      never saw. The guard is a stale-version comparison, not a timing rule.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: dossier-create-stale-claim
    parent_entity: StructureFunctionClaim
    write_endpoint: "POST /supplement-compliance/substantiation-dossiers"
    occ_field: "expected_claim_version"
    description: |
      Creating a SubstantiationDossier against a StructureFunctionClaim whose version
      has advanced since the client last read it is rejected. A new dossier legitimately
      supersedes the claim's existing DRAFT dossier, so a writer whose view of the claim
      predates a submit-for-review, a rejection cascade, or another dossier creation
      would discard evidence it never observed. The guard is a stale-version comparison.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412

calculations:
  - name: substantiation_strength_score
    trigger: "screening_provisional recomputed on every POST /supplement-compliance/substantiation-dossiers/{id}/evidence; competent_reliable_final computed once and frozen into dossier.final_score by POST /supplement-compliance/claims/{id}/submit-for-review"
    algorithm: weighted_scoring
    formula: |
      # per study s in dossier.evidence_studies (append order):
      base_weight(s) = STUDY_BASE_WEIGHT[s.study_type]
      subject_factor(s) =
          1.0                                        if s.study_type IN {ANIMAL, IN_VITRO}
          min(1.0, s.subject_count / SUBJECT_DENOM)  otherwise      # SUBJECT_DENOM is variant-specific
      dose_factor(s)  = 1.0 if s.dose_match     == true else 0.60
      peer_factor(s)  = 1.0 if PEER_ENFORCED == false else (1.0 if s.peer_reviewed == true else 0.50)
      study_points(s) = round_half_up(base_weight(s) * subject_factor(s) * dose_factor(s) * peer_factor(s), 2)

      # ROUNDING ORDER IS PINNED: round each study to 2 decimals FIRST, then sum.
      score = min(100.00, round_half_up(sum(study_points(s) for s in INCLUDED_SET), 2))
    input_set: "INCLUDED_SET is variant-specific; both variants read dossier.evidence_studies in append order and ignore Ingredient, Product and Supplier state entirely"
    constants:
      STUDY_BASE_WEIGHT: { RCT_HUMAN: 30, OBSERVATIONAL_HUMAN: 18, ANIMAL: 8, IN_VITRO: 4 }
      ACCEPTANCE_THRESHOLD: 65.00
      SCORE_CEILING: 100.00
    precision: "2 decimal places, round_half_up, applied per study then to the sum"
    variants:
      - name: screening_provisional
        when: "dossier.dossier_status == DRAFT; recomputed into dossier.screening_score on every evidence append"
        difference: "INCLUDED_SET = every study in evidence_studies; SUBJECT_DENOM = 50; PEER_ENFORCED = false (peer-review status is not yet verified, so peer_factor is 1.0 for every study)"
      - name: competent_reliable_final
        when: "the claim leaves DRAFT or REVISION_REQUESTED for UNDER_SUBSTANTIATION_REVIEW; frozen into dossier.final_score and compared against ACCEPTANCE_THRESHOLD at review time"
        difference: "INCLUDED_SET = only studies with peer_reviewed == true (non-peer-reviewed studies are excluded entirely, not down-weighted); SUBJECT_DENOM = 100; PEER_ENFORCED = true"

  - name: claim_notification_due_date
    trigger: "runs at the moment claim.notification_status becomes DUE — either POST /supplement-compliance/products/{id}/start-marketing or POST /supplement-compliance/claims/{id}/approve on an already MARKETED product"
    algorithm: threshold
    formula: |
      # variant selection is made once, at the DUE transition, and never re-evaluated
      if product.lifecycle_status == MARKETED at the instant of claim approval:
          basis = CLAIM_ACTIVATION_BASIS
          due   = date(claim.approved_at) + NOTIFICATION_WINDOW_DAYS days
      else:                                  # claim approved before the product was marketed
          basis = PRODUCT_LAUNCH_BASIS
          due   = product.marketing_start_date + NOTIFICATION_WINDOW_DAYS days
      claim.notification_due_date  = due      # UTC calendar date, YYYY-MM-DD
      claim.notification_due_basis = basis
      # timeliness at filing time (calendar-date comparison, inclusive):
      timeliness = SUBMITTED_TIMELY if date(logical clock) <= due else SUBMITTED_LATE
    input_set: "exactly one StructureFunctionClaim and its Product; no other claim of the product participates"
    constants:
      NOTIFICATION_WINDOW_DAYS: 30
    precision: "whole UTC calendar days; both bounds inclusive (filing exactly on notification_due_date is TIMELY)"
    variants:
      - name: product_launch_basis
        when: "the claim reached APPROVED while product.lifecycle_status IN {DRAFT, LABEL_LOCKED}"
        difference: "the 30-day window is anchored on product.marketing_start_date, so the clock does not start until the product is marketed; approval date is irrelevant"
      - name: claim_activation_basis
        when: "the claim reached APPROVED while product.lifecycle_status == MARKETED"
        difference: "the 30-day window is anchored on date(claim.approved_at), so the same claim on the same product yields a later due date than the launch basis whenever approval follows marketing"

  - name: percent_dv_declared
    trigger: "POST /supplement-compliance/product-ingredients (on create) and POST /supplement-compliance/label-panels/{id}/validate (recomputed for every ACTIVE line)"
    algorithm: threshold
    formula: |
      if ingredient.rdi_mg is null:
          dv_established = false
          percent_dv_declared = null
      else:
          dv_established = true
          raw_pct = line.amount_per_serving_mg / ingredient.rdi_mg * 100
          percent_dv_declared = 1 if (raw_pct > 0 and raw_pct < 0.5) else round_half_up(raw_pct, 0)
    input_set: "one ProductIngredient row with line_status == ACTIVE and its Ingredient"
    constants:
      SUB_HALF_PERCENT_FLOOR: 1
    precision: "whole percent, round_half_up (12.5 -> 13); values in (0, 0.5) are floored up to 1"

  - name: panel_total_dv_coverage_pct
    trigger: "POST /supplement-compliance/label-panels/{id}/validate"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each line's %DV to a whole percent FIRST
      # (calculations.percent_dv_declared), THEN sum the rounded integers.
      # Summing the unrounded ratios and rounding the total is explicitly NOT the rule
      # and yields a different integer whenever the per-line fractions are .5-heavy.
      lines = ProductIngredient rows where product_id == panel.product_id
              AND line_status == ACTIVE AND dv_established == true,
              iterated in panel_position ASC order (ties impossible: panel_position is unique per product)
      panel_total_dv_coverage_pct = sum(line.percent_dv_declared for line in lines)   # integer sum
      # empty `lines` yields 0
    input_set: "ProductIngredient rows of this panel's product with line_status == ACTIVE and dv_established == true; REMOVED lines and no-Daily-Value lines are excluded"
    constants: {}
    precision: "integer; no further rounding after the per-line round_half_up"

  - name: panel_line_budget
    trigger: "POST /supplement-compliance/label-panels/{id}/validate"
    algorithm: tiered_pricing
    formula: |
      active_lines   = count(ProductIngredient where product_id == panel.product_id AND line_status == ACTIVE)
      dagger_footnote = 1 if at least one such line has dv_established == false else 0
      warning_lines  = len(panel.required_warning_codes)          # one printed line per required code
      disclaimer_line = 1 if EXISTS StructureFunctionClaim where product_id == panel.product_id
                             AND substantiation_status == APPROVED
                             AND claim_type IN {STRUCTURE_FUNCTION, GENERAL_WELLBEING}
                        else 0
      panel_lines_required = HEADER_BLOCK_LINES + active_lines + dagger_footnote
                             + warning_lines + disclaimer_line

      if panel.panel_format == STANDARD:
          panel_lines_allowed = max(20, min(40, floor(product.net_quantity_g / 10) + 12))
      elif panel.panel_format == SIMPLIFIED:
          panel_lines_allowed = max(12, min(24, floor(product.net_quantity_g / 20) + 8))
      else:   # LINEAR
          panel_lines_allowed = 8
      # validation fails with ERR_PANEL_LINE_BUDGET_EXCEEDED when required > allowed
    input_set: "ACTIVE ProductIngredient rows of the panel's product, the panel's computed required_warning_codes, and APPROVED claims of the product; DRAFT/REVISION_REQUESTED/WITHDRAWN claims never add the disclaimer line"
    constants:
      HEADER_BLOCK_LINES: 4
      LINEAR_FIXED_ALLOWANCE: 8
    precision: "integers only; floor() on the net-quantity division, then min(), then max() in exactly that order"

  - name: required_warning_codes
    trigger: "POST /supplement-compliance/label-panels/{id}/validate"
    algorithm: aggregation
    formula: |
      codes = { ALWAYS_REQUIRED_CODE }
      for line in ProductIngredient where product_id == panel.product_id AND line_status == ACTIVE:
          ing = Ingredient[line.ingredient_id]
          if ing.allergen_code is not null:        codes.add("ALLERGEN_" + ing.allergen_code)
          if ing.contraindication_code is not null: codes.add("CONTRAINDICATION_" + ing.contraindication_code)
      required_warning_codes = sort_ascending_lexicographic(codes)      # set semantics: duplicates collapse
      # panel passes when set(required_warning_codes) is a subset of set(panel.declared_warning_codes);
      # extra declared codes are permitted and do not consume line budget beyond required_warning_codes
    input_set: "ACTIVE ProductIngredient rows of the panel's product and their Ingredients; REMOVED lines contribute nothing"
    constants:
      ALWAYS_REQUIRED_CODE: PEDIATRIC_KEEP_OUT_OF_REACH
    precision: "exact string set; ordering is lexicographic ASC so the array is byte-stable"

  - name: product_compliance_risk_index
    trigger: "recomputed after any of: AER triage (either branch), AER submit-to-fda with LATE timeliness, claim notify-fda with SUBMITTED_LATE, CoA review with decision == REJECT, claim withdrawal"
    algorithm: threshold
    formula: |
      base = BASE_FLOOR
             + SERIOUS_AE_WEIGHT   * product.serious_ae_count
             + NONSERIOUS_AE_WEIGHT * product.nonserious_ae_count
             + LATE_NOTICE_WEIGHT  * product.late_notification_count
             + REJECTED_COA_WEIGHT * product.rejected_coa_count

      # EVALUATION ORDER IS PINNED: the escalation tier is selected from `base`,
      # i.e. from the PRE-surcharge value. Selecting the tier from the post-surcharge
      # total (which looks equally plausible because the surcharge is part of the index)
      # produces a strictly larger index whenever base sits within one tier width of a
      # boundary, e.g. base 56 -> 61 under the pinned order but 68 under the other order.
      if base < 30:                    escalation_surcharge = 0
      elif base >= 30 and base < 60:   escalation_surcharge = 5
      else:                            escalation_surcharge = 12

      compliance_risk_index = min(INDEX_CEILING, base + escalation_surcharge)
    input_set: "the four denormalized counters on the Product row itself; the counters are maintained by the transitions listed in trigger and are never recomputed from scratch during this calculation"
    constants:
      BASE_FLOOR: 10
      SERIOUS_AE_WEIGHT: 20
      NONSERIOUS_AE_WEIGHT: 6
      LATE_NOTICE_WEIGHT: 15
      REJECTED_COA_WEIGHT: 8
      INDEX_CEILING: 100
    precision: "integer arithmetic throughout; no rounding required"

  - name: product_label_posture
    trigger: "runs immediately after every product_compliance_risk_index recomputation, after every Supplier qualification transition, and after every Ingredient NDI_PENDING -> NDI_OBJECTED transition"
    algorithm: threshold
    formula: |
      derived_supplier_set(P) =
        { lot.supplier_id
          for lot in IngredientLot
          where lot.lot_status IN {RELEASED, RECALLED, REJECTED}
            and lot.ingredient_id IN { pi.ingredient_id for pi in ProductIngredient
                                       where pi.product_id == P.id and pi.line_status == ACTIVE } }

      if P.compliance_risk_index >= FROZEN_THRESHOLD
         or any s in derived_supplier_set(P) has qualification_status == DISQUALIFIED
         or any ingredient on an ACTIVE line has eligibility_status == NDI_OBJECTED:
             posture = FROZEN
      elif P.compliance_risk_index >= RESTRICTED_THRESHOLD
         or any s in derived_supplier_set(P) has qualification_status == PROBATION:
             posture = RESTRICTED
      else:
             posture = OPEN
      # An empty derived_supplier_set satisfies both supplier clauses vacuously.
      # requires_label_revision = (posture != OPEN)
    input_set: "the Product row, its ACTIVE ProductIngredient lines, those lines' Ingredients, and the Suppliers reachable through IngredientLot rows with lot_status IN {RELEASED, RECALLED, REJECTED}; QUARANTINED lots never contribute a supplier"
    constants:
      RESTRICTED_THRESHOLD: 70
      FROZEN_THRESHOLD: 90
    precision: "exact integer comparisons; >= at both thresholds"

  - name: ndi_waiting_period_end
    trigger: "POST /supplement-compliance/ndi-notifications/{id}/submit"
    algorithm: interval_merge
    formula: |
      submitted_at       = logical clock at submit time
      waiting_period_end = submitted_at + WAITING_PERIOD_DAYS days
      # The notification OCCUPIES the HALF-OPEN interval [submitted_at, waiting_period_end)
      # on its Ingredient. A new submission at instant T collides iff
      #   T < existing.waiting_period_end AND existing.submitted_at < T + 75 days
      # over notifications on the same ingredient_id with notification_status == SUBMITTED.
      # Consequence of half-openness: T == existing.waiting_period_end is ADJACENT, not
      # overlapping, and is accepted.
    input_set: "NDINotification rows on the same ingredient_id whose notification_status == SUBMITTED; DRAFT, ACKNOWLEDGED and OBJECTED notifications release their interval"
    constants:
      WAITING_PERIOD_DAYS: 75
    precision: "millisecond-resolution UTC instants; lower bound inclusive, upper bound exclusive"

  - name: panel_effective_window_occupancy
    trigger: "POST /supplement-compliance/label-panels"
    algorithm: interval_merge
    formula: |
      # A panel OCCUPIES the CLOSED calendar-date interval [effective_from, effective_until]
      # on its Product, and the incoming panel is widened by a changeover buffer on BOTH
      # sides before the intersection test:
      candidate = [new.effective_from - CHANGEOVER_BUFFER_DAYS days,
                   new.effective_until + CHANGEOVER_BUFFER_DAYS days]
      occupied  = [p.effective_from, p.effective_until]
                  for p in LabelPanel where p.product_id == new.product_id
                    and p.panel_status IN {DRAFT, VALIDATED, LOCKED}
                    and p.id != new.supersedes_panel_id
      collision iff candidate.start <= p.effective_until AND p.effective_from <= candidate.end
      # Both bounds are INCLUSIVE, so touching dates collide; a panel named by
      # supersedes_panel_id vacates its window and is excluded from `occupied`.
    input_set: "LabelPanel rows of the same product with panel_status IN {DRAFT, VALIDATED, LOCKED}; SUPERSEDED panels and the explicitly superseded panel are excluded"
    constants:
      CHANGEOVER_BUFFER_DAYS: 7
    precision: "whole UTC calendar dates; closed-closed intervals on both the occupied and the buffered candidate side"

  - name: serious_ae_submission_due_date
    trigger: "POST /supplement-compliance/adverse-event-reports/{id}/triage on the TRIAGED_SERIOUS branch"
    algorithm: chronological
    formula: |
      d = aer.received_date          # day 0, never itself counted
      counted = 0
      while counted < SERIOUS_SUBMISSION_BUSINESS_DAYS:
          d = d + 1 day
          if weekday(d) IN {MON, TUE, WED, THU, FRI}: counted = counted + 1
      submission_due_date = d        # always a weekday
      # holidays are NOT modelled; only Saturday and Sunday are skipped
      retention_until = date(year(aer.received_date) + RETENTION_YEARS,
                            month(aer.received_date),
                            day(aer.received_date))    # Feb 29 maps to Feb 28
    input_set: "one AdverseEventReport row; no other report participates"
    constants:
      SERIOUS_SUBMISSION_BUSINESS_DAYS: 15
      RETENTION_YEARS: 6
    precision: "whole UTC calendar dates; submission on exactly submission_due_date is TIMELY, one day later is LATE"

  - name: coa_identity_method_eligibility
    trigger: "POST /supplement-compliance/coas"
    algorithm: constraint_propagation
    formula: |
      ing = Ingredient[ IngredientLot[coa.lot_id].ingredient_id ]
      allowed = APPROVED_METHODS[ing.ingredient_class]
      accept the certificate for intake iff coa.identity_test_method IN allowed
      coa_acceptable = (coa.identity_match == true
                        and coa.assay_percent_of_label >= ASSAY_MIN_PCT
                        and coa.assay_percent_of_label <= ASSAY_MAX_PCT
                        and coa.heavy_metals_pass == true
                        and coa.microbial_pass == true)
    input_set: "the certificate under intake, its IngredientLot, and that lot's Ingredient"
    constants:
      APPROVED_METHODS:
        VITAMIN: [HPLC, MASS_SPEC]
        MINERAL: [MASS_SPEC]
        BOTANICAL: [HPTLC, DNA_BARCODE, MASS_SPEC]
        AMINO_ACID: [HPLC, MASS_SPEC]
        PROBIOTIC: [DNA_BARCODE]
        EXCLUDED_SUBSTANCE: []
      ASSAY_MIN_PCT: 95.0
      ASSAY_MAX_PCT: 120.0
    precision: "assay bounds are inclusive on both ends (exactly 95.0 and exactly 120.0 pass)"

  - name: lot_mass_invariant
    trigger: "asserted after every IngredientLot transition and after every Supplier.total_released_kg mutation"
    algorithm: aggregation
    formula: |
      # per-lot conservation (mass is never created or destroyed):
      for every lot: lot.quarantined_quantity_kg + lot.released_quantity_kg
                     + lot.rejected_quantity_kg == lot.quantity_kg
      # supplier ledger reconciliation:
      Supplier[S].total_released_kg
        == sum(lot.released_quantity_kg for lot in IngredientLot
               where lot.supplier_id == S and lot.lot_status == RELEASED)
      # Compensating pair: release (QUARANTINED -> RELEASED) then recall
      # (RELEASED -> RECALLED) MUST leave total_released_kg at its pre-release value
      # to the cent-equivalent (2 decimal places on kilograms) with zero drift.
    input_set: "all IngredientLot rows of the supplier regardless of lot_status; only lot_status == RELEASED rows enter the ledger sum"
    constants: {}
    precision: "2 decimal places on kilograms, round_half_up; equality is exact at that precision"

  - name: claim_ledger_invariant
    trigger: "asserted after every StructureFunctionClaim substantiation_status transition"
    algorithm: aggregation
    formula: |
      Product[P].active_claim_count
        == count(StructureFunctionClaim where product_id == P
                 and substantiation_status == APPROVED)
      Product[P].withdrawn_claim_count
        == count(StructureFunctionClaim where product_id == P
                 and substantiation_status == WITHDRAWN)
      # Compensating pair: approve (UNDER_SUBSTANTIATION_REVIEW -> APPROVED) then withdraw
      # (APPROVED -> WITHDRAWN) MUST leave active_claim_count at its pre-approval value,
      # with the unit moved into withdrawn_claim_count. The posture recheck cascade
      # (APPROVED -> REVISION_REQUESTED) also decrements active_claim_count, so the
      # identity holds after cascades too.
    input_set: "all StructureFunctionClaim rows of the product regardless of notification_status; notification_status never affects either counter"
    constants: {}
    precision: "exact integer counts"

validations:
  # ---- 1-4: envelope-level checks -------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty, and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "the resource named by the {id} path parameter exists; each endpoint has exactly one path id, so exactly one of the eleven NOT_FOUND errors can fire here (ERR_PRODUCT_NOT_FOUND, ERR_INGREDIENT_NOT_FOUND, ERR_PRODUCT_INGREDIENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_DOSSIER_NOT_FOUND, ERR_PANEL_NOT_FOUND, ERR_NDI_NOTIFICATION_NOT_FOUND, ERR_AER_NOT_FOUND, ERR_SUPPLIER_NOT_FOUND, ERR_LOT_NOT_FOUND, ERR_COA_NOT_FOUND)"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a {id} path parameter"
  - priority: 4
    category: business_constraint
    check: "request body shape: every required input field present; enums within their declared value sets; numbers of the declared type and sign (net_quantity_g > 0, serving_weight_g > 0, amount_per_serving_mg > 0, quantity_kg > 0, panel_position >= 1, assay_percent_of_label >= 0, audit_score between 0 and 100); dates as YYYY-MM-DD; arrays of strings for outcome_codes / declared_warning_codes"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"
  # ---- 5-10: body foreign-key existence, left-to-right in input order -------------
  - priority: 5
    category: existence
    check: "body field product_id names an existing Product"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplement-compliance/product-ingredients, POST /supplement-compliance/claims, POST /supplement-compliance/label-panels, POST /supplement-compliance/adverse-event-reports"
  - priority: 6
    category: existence
    check: "body fields ingredient_id then predecessor_ingredient_id (in that order) each name an existing Ingredient when supplied"
    error_id: ERR_INGREDIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplement-compliance/ingredients, PATCH /supplement-compliance/ingredients/{id}, POST /supplement-compliance/product-ingredients, POST /supplement-compliance/claims, POST /supplement-compliance/ndi-notifications, POST /supplement-compliance/ingredient-lots"
  - priority: 7
    category: existence
    check: "body field claim_id names an existing StructureFunctionClaim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplement-compliance/substantiation-dossiers"
  - priority: 8
    category: existence
    check: "body field lot_id names an existing IngredientLot"
    error_id: ERR_LOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplement-compliance/coas"
  - priority: 9
    category: existence
    check: "body field supplier_id names an existing Supplier"
    error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplement-compliance/ingredient-lots"
  - priority: 10
    category: existence
    check: "body field supersedes_panel_id, when supplied, names an existing LabelPanel whose product_id equals the incoming product_id"
    error_id: ERR_PANEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /supplement-compliance/label-panels"
  # ---- 11-13: ownership scope, field-pair sanity, optimistic concurrency ----------
  - priority: 11
    category: auth
    check: "when X-User-Role == SupplierRepresentative, the body supplier_id (POST /ingredient-lots) or the lot's supplier_id (POST /coas) equals X-User-ID; other roles are unrestricted"
    error_id: ERR_SUPPLIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /supplement-compliance/ingredient-lots, POST /supplement-compliance/coas"
  - priority: 12
    category: business_temporal
    check: "effective_from <= effective_until on the incoming panel (equal dates are a legal one-day window)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /supplement-compliance/label-panels, PATCH /supplement-compliance/label-panels/{id}"
  - priority: 13
    category: state
    check: "expected_product_version equals the current Product.version (concurrency_rules.panel-create-stale-product)"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /supplement-compliance/label-panels"
  - priority: 13
    category: state
    check: "expected_claim_version equals the current StructureFunctionClaim.version (concurrency_rules.dossier-create-stale-claim)"
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
    applies_to: "POST /supplement-compliance/substantiation-dossiers"
  # ---- 14-15: state preconditions on the target resource -------------------------
  - priority: 14
    category: state
    check: "Product.lifecycle_status permits the operation: start-marketing requires LABEL_LOCKED; PATCH /products/{id} requires DRAFT; POST /product-ingredients and DELETE /product-ingredients/{id} require the parent Product to be DRAFT"
    error_id: ERR_PRODUCT_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/products/{id}/start-marketing, PATCH /supplement-compliance/products/{id}, POST /supplement-compliance/product-ingredients, DELETE /supplement-compliance/product-ingredients/{id}"
  - priority: 14
    category: state
    check: "Ingredient.eligibility_status == DRAFT_ASSESSMENT for eligibility-determination; PATCH /ingredients/{id} requires eligibility_status IN {DRAFT_ASSESSMENT, NDI_REQUIRED}"
    error_id: ERR_INGREDIENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/ingredients/{id}/eligibility-determination, PATCH /supplement-compliance/ingredients/{id}"
  - priority: 14
    category: state
    check: "NDINotification.notification_status == DRAFT for submit and == SUBMITTED for agency-response"
    error_id: ERR_NDI_NOTIFICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/ndi-notifications/{id}/submit, POST /supplement-compliance/ndi-notifications/{id}/agency-response"
  - priority: 14
    category: state
    check: "StructureFunctionClaim.substantiation_status permits the operation: submit-for-review requires DRAFT or REVISION_REQUESTED; approve requires UNDER_SUBSTANTIATION_REVIEW; withdraw requires APPROVED; notify-fda requires APPROVED; PATCH /claims/{id} requires DRAFT or REVISION_REQUESTED"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/claims/{id}/submit-for-review, POST /supplement-compliance/claims/{id}/approve, POST /supplement-compliance/claims/{id}/withdraw, POST /supplement-compliance/claims/{id}/notify-fda, PATCH /supplement-compliance/claims/{id}"
  - priority: 14
    category: state
    check: "SubstantiationDossier.dossier_status == DRAFT for evidence append and == UNDER_REVIEW for review"
    error_id: ERR_DOSSIER_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/substantiation-dossiers/{id}/evidence, POST /supplement-compliance/substantiation-dossiers/{id}/review"
  - priority: 14
    category: state
    check: "LabelPanel.panel_status == DRAFT for validate and PATCH, == VALIDATED for lock"
    error_id: ERR_PANEL_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate, POST /supplement-compliance/label-panels/{id}/lock, PATCH /supplement-compliance/label-panels/{id}"
  - priority: 14
    category: state
    check: "AdverseEventReport.aer_status == RECEIVED for triage and == TRIAGED_SERIOUS for submit-to-fda"
    error_id: ERR_AER_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/adverse-event-reports/{id}/triage, POST /supplement-compliance/adverse-event-reports/{id}/submit-to-fda"
  - priority: 14
    category: state
    check: "the requested qualification decision is legal from the Supplier's current qualification_status: QUALIFY only from UNQUALIFIED; PROBATION only from QUALIFIED; REINSTATE only from PROBATION; DISQUALIFY only from PROBATION"
    error_id: ERR_SUPPLIER_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/suppliers/{id}/qualification-decision"
  - priority: 14
    category: state
    check: "IngredientLot.lot_status == QUARANTINED for release and == RELEASED for recall"
    error_id: ERR_LOT_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/ingredient-lots/{id}/release, POST /supplement-compliance/ingredient-lots/{id}/recall"
  - priority: 14
    category: state
    check: "CertificateOfAnalysis.coa_status == RECEIVED for review"
    error_id: ERR_COA_STATE_INVALID
    http_status: 409
    applies_to: "POST /supplement-compliance/coas/{id}/review"
  - priority: 14
    category: state
    check: "ProductIngredient.line_status == ACTIVE for PATCH and DELETE"
    error_id: ERR_PRODUCT_INGREDIENT_STATE_INVALID
    http_status: 409
    applies_to: "PATCH /supplement-compliance/product-ingredients/{id}, DELETE /supplement-compliance/product-ingredients/{id}"
  - priority: 15
    category: state
    check: "the claim's parallel notification dimension is in DUE (notify-fda cannot fire while notification_status is NOT_DUE, SUBMITTED_TIMELY or SUBMITTED_LATE)"
    error_id: ERR_CLAIM_NOTIFICATION_NOT_DUE
    http_status: 409
    applies_to: "POST /supplement-compliance/claims/{id}/notify-fda"
  # ---- 16-18: regulatory gates ---------------------------------------------------
  - priority: 16
    category: business_safety
    check: "the governing Product has label_posture != FROZEN; a FROZEN posture blocks every forward labeling and claim action on that product"
    error_id: ERR_PRODUCT_LABEL_FROZEN
    http_status: 409
    applies_to: "POST /supplement-compliance/products/{id}/start-marketing, POST /supplement-compliance/label-panels, POST /supplement-compliance/label-panels/{id}/validate, POST /supplement-compliance/label-panels/{id}/lock, POST /supplement-compliance/claims/{id}/submit-for-review, POST /supplement-compliance/claims/{id}/approve"
  - priority: 17
    category: business_safety
    check: "every Supplier in the derived supplier set has qualification_status == QUALIFIED. The derived supplier set of a product = { lot.supplier_id : lot.lot_status IN {RELEASED, RECALLED, REJECTED} AND lot.ingredient_id is on an ACTIVE ProductIngredient line of the product }; an empty set passes. For POST /ingredient-lots/{id}/release the check is on that lot's own supplier"
    error_id: ERR_SUPPLIER_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /supplement-compliance/products/{id}/start-marketing, POST /supplement-compliance/ingredient-lots/{id}/release"
  - priority: 18
    category: business_safety
    check: "ingredient eligibility gate: for claims/{id}/submit-for-review the claim's Ingredient has eligibility_status IN {GRANDFATHERED, NDI_ACKNOWLEDGED}; for label-panels/{id}/lock EVERY Ingredient on an ACTIVE line of the product has eligibility_status IN {GRANDFATHERED, NDI_ACKNOWLEDGED}"
    error_id: ERR_INGREDIENT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /supplement-compliance/claims/{id}/submit-for-review, POST /supplement-compliance/label-panels/{id}/lock"
  # ---- 19-23: mandatory label content, then panel capacity -----------------------
  - priority: 19
    category: business_constraint
    check: "serving_size_text matches ^[0-9]+(\\.[0-9]+)? (capsule|capsules|tablet|tablets|scoop|scoops|mL|g)$"
    error_id: ERR_SERVING_SIZE_FORMAT_INVALID
    http_status: 422
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate"
  - priority: 20
    category: business_constraint
    check: "servings_per_container_declared == round_half_up(product.net_quantity_g / panel.serving_weight_g, 0) AND servings_per_container_declared == product.servings_per_container"
    error_id: ERR_SERVING_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate"
  - priority: 21
    category: business_safety
    check: "set(calculations.required_warning_codes) is a subset of set(panel.declared_warning_codes) — every allergen, contraindication and the always-required pediatric warning is printed"
    error_id: ERR_MANDATORY_WARNING_MISSING
    http_status: 422
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate"
  - priority: 22
    category: business_safety
    check: "when the product has at least one StructureFunctionClaim with substantiation_status == APPROVED and claim_type IN {STRUCTURE_FUNCTION, GENERAL_WELLBEING}, disclaimer_text equals the verbatim constant 'This statement has not been evaluated by the Food and Drug Administration. This product is not intended to diagnose, treat, cure, or prevent any disease.'"
    error_id: ERR_DISCLAIMER_MISSING
    http_status: 422
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate"
  - priority: 23
    category: business_constraint
    check: "calculations.panel_line_budget: panel_lines_required <= panel_lines_allowed"
    error_id: ERR_PANEL_LINE_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate"
  # ---- 24-26: incoming-material quality ------------------------------------------
  - priority: 24
    category: business_safety
    check: "calculations.coa_identity_method_eligibility: identity_test_method is in APPROVED_METHODS[ingredient.ingredient_class] for the ingredient of the certificate's lot (EXCLUDED_SUBSTANCE has no approved method, so every certificate for it is refused)"
    error_id: ERR_IDENTITY_METHOD_NOT_APPROVED
    http_status: 422
    applies_to: "POST /supplement-compliance/coas"
  - priority: 25
    category: business_safety
    check: "lot.identity_verified == true, i.e. at least one CertificateOfAnalysis of the lot has reached coa_status == ACCEPTED"
    error_id: ERR_LOT_IDENTITY_UNVERIFIED
    http_status: 409
    applies_to: "POST /supplement-compliance/ingredient-lots/{id}/release"
  - priority: 26
    category: business_safety
    check: "for decision == ACCEPT, coa.coa_acceptable == true (identity match, assay within [95.0, 120.0], heavy metals pass, microbial pass)"
    error_id: ERR_COA_NOT_ACCEPTABLE
    http_status: 409
    applies_to: "POST /supplement-compliance/coas/{id}/review"
  # ---- 27-29: temporal windows ---------------------------------------------------
  - priority: 27
    category: business_temporal
    check: "for response == ACKNOWLEDGE, the logical clock is at or after notification.waiting_period_end (the 75-day premarket waiting period has elapsed); response == OBJECT is exempt"
    error_id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /supplement-compliance/ndi-notifications/{id}/agency-response"
  - priority: 28
    category: business_temporal
    check: "calculations.ndi_waiting_period_end: the half-open interval [now, now + 75 days) does not overlap the [submitted_at, waiting_period_end) interval of any other SUBMITTED notification on the same ingredient; touching at the exclusive upper bound is allowed"
    error_id: ERR_NDI_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /supplement-compliance/ndi-notifications/{id}/submit"
  - priority: 29
    category: business_temporal
    check: "calculations.panel_effective_window_occupancy: the incoming panel's window widened by the 7-day changeover buffer on both sides does not intersect the closed [effective_from, effective_until] window of any other DRAFT/VALIDATED/LOCKED panel of the same product, excluding the panel named by supersedes_panel_id"
    error_id: ERR_PANEL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /supplement-compliance/label-panels"
  # ---- 30-32: uniqueness ---------------------------------------------------------
  - priority: 30
    category: business_constraint
    check: "panel_position is unique among ProductIngredient rows of the same product with line_status == ACTIVE"
    error_id: ERR_PANEL_POSITION_TAKEN
    http_status: 409
    applies_to: "POST /supplement-compliance/product-ingredients, PATCH /supplement-compliance/product-ingredients/{id}"
  - priority: 31
    category: business_constraint
    check: "lot_code is unique per supplier_id across all IngredientLot rows regardless of lot_status"
    error_id: ERR_LOT_CODE_DUPLICATE
    http_status: 409
    applies_to: "POST /supplement-compliance/ingredient-lots"
  - priority: 32
    category: business_constraint
    check: "claim_text is unique among StructureFunctionClaim rows of the same product whose substantiation_status != WITHDRAWN"
    error_id: ERR_DUPLICATE_CLAIM_TEXT
    http_status: 409
    applies_to: "POST /supplement-compliance/claims, PATCH /supplement-compliance/claims/{id}"
  # ---- 33-37: substantiation sufficiency and segregation of duties ---------------
  - priority: 33
    category: business_referential
    check: "the claim has exactly one SubstantiationDossier with dossier_status == DRAFT and that dossier's study_count >= 1"
    error_id: ERR_DOSSIER_NOT_READY
    http_status: 409
    applies_to: "POST /supplement-compliance/claims/{id}/submit-for-review"
  - priority: 34
    category: business_referential
    check: "the claim has exactly one SubstantiationDossier with dossier_status == ACCEPTED"
    error_id: ERR_DOSSIER_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /supplement-compliance/claims/{id}/approve"
  - priority: 35
    category: business_safety
    check: "segregation of duties on X-User-ID: for dossier review, X-User-ID != dossier.authored_by_user_id; for claim approval, X-User-ID != the ACCEPTED dossier's reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /supplement-compliance/substantiation-dossiers/{id}/review, POST /supplement-compliance/claims/{id}/approve"
  - priority: 36
    category: business_fiscal
    check: "for decision == ACCEPT, dossier.final_score >= 65.00 (competent and reliable scientific evidence threshold); decision == REJECT is exempt"
    error_id: ERR_SUBSTANTIATION_INSUFFICIENT
    http_status: 409
    applies_to: "POST /supplement-compliance/substantiation-dossiers/{id}/review"
  - priority: 37
    category: business_constraint
    check: "claim.revision_round < 3 when resubmitting from REVISION_REQUESTED; the fourth submission attempt is refused"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /supplement-compliance/claims/{id}/submit-for-review"
  # ---- 38-41: supplier decisions and label composition floors --------------------
  - priority: 38
    category: business_constraint
    check: "for decision == QUALIFY, audit_score is supplied in the body or already stored and audit_score >= 70"
    error_id: ERR_AUDIT_SCORE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /supplement-compliance/suppliers/{id}/qualification-decision"
  - priority: 39
    category: business_constraint
    check: "for decision == REINSTATE, remediation_reference is supplied and non-empty"
    error_id: ERR_REMEDIATION_REFERENCE_REQUIRED
    http_status: 422
    applies_to: "POST /supplement-compliance/suppliers/{id}/qualification-decision"
  - priority: 40
    category: business_safety
    check: "the ingredient being added to a label panel line has eligibility_status NOT IN {INELIGIBLE, NDI_OBJECTED}"
    error_id: ERR_INGREDIENT_INELIGIBLE_FOR_LABEL
    http_status: 409
    applies_to: "POST /supplement-compliance/product-ingredients"
  - priority: 41
    category: business_referential
    check: "the panel's product has at least one ProductIngredient row with line_status == ACTIVE"
    error_id: ERR_PRODUCT_HAS_NO_ACTIVE_LINES
    http_status: 409
    applies_to: "POST /supplement-compliance/label-panels/{id}/validate"

endpoints:
  # ---------- Ingredient ----------
  - method: POST
    path: "/supplement-compliance/ingredients"
    description: "Register a dietary ingredient for eligibility assessment. Starts in eligibility_status DRAFT_ASSESSMENT."
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [ingredient_name, ingredient_class, pre_dshea_marketed, chemical_alteration, daily_intake_mg, "rdi_mg?", "allergen_code?", "contraindication_code?", "predecessor_ingredient_id?"]
    output: Ingredient
    side_effects: ["sets eligibility_status = DRAFT_ASSESSMENT", "sets ndi_notification_required = false", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/ingredients/{id}"
    description: "Fetch one ingredient with its eligibility state."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, SupplierRepresentative, ComplianceAuditor]
    code: 200
    input: []
    output: Ingredient
    side_effects: []
  - method: GET
    path: "/supplement-compliance/ingredients"
    description: "List ingredients, filterable by eligibility_status, ingredient_class and predecessor_ingredient_id (FK reverse-reachability for Ingredient.predecessor_ingredient_id)."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, SupplierRepresentative, ComplianceAuditor]
    code: 200
    input: ["eligibility_status?", "ingredient_class?", "predecessor_ingredient_id?", "page?", "page_size?"]
    output: Ingredient[]
    side_effects: []
  - method: PATCH
    path: "/supplement-compliance/ingredients/{id}"
    description: "Amend an ingredient's monograph data before its eligibility is settled."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["rdi_mg?", "allergen_code?", "contraindication_code?", "daily_intake_mg?", "predecessor_ingredient_id?"]
    output: Ingredient
    side_effects: ["increments Ingredient.version by 1", "recomputes percent_dv_declared and dv_established on every ACTIVE ProductIngredient row referencing this ingredient"]
  - method: POST
    path: "/supplement-compliance/ingredients/{id}/eligibility-determination"
    description: "Run the new-dietary-ingredient eligibility determination: GRANDFATHERED, NDI_REQUIRED or INELIGIBLE per the ingredient's own pre-DSHEA, alteration, intake and class data."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: []
    output: Ingredient
    side_effects: ["sets eligibility_status to GRANDFATHERED | NDI_REQUIRED | INELIGIBLE", "sets ndi_notification_required = true only on the NDI_REQUIRED branch", "sets determined_at to the logical clock", "increments Ingredient.version by 1"]
