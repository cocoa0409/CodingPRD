  - section: rbac
    instances:

      - name: each_role_performs_its_own_exclusive_operations
        claim_type: permitted_operations
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.AccountManager.exclusive_operations
          - roles.CustomerContact.exclusive_operations
          - roles.DispatchCoordinator.exclusive_operations
          - roles.MunicipalLiaison.exclusive_operations
          - roles.YardAuditor.exclusive_operations
        distinguishing_aspect: |
          A single end-to-end rental is driven by six different role headers and
          every hand-off is accepted: PlatformAdmin registers reference data,
          AccountManager quotes, issues, converts, takes a payment and voids,
          CustomerContact accepts, DispatchCoordinator plans, dispatches and
          completes, MunicipalLiaison drafts, submits and decides a closure
          permit, and YardAuditor finalizes the removal. The positive half of the
          matrix must succeed before the denial sweep below is meaningful.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z."
            - "Reference data created by PlatformAdmin pa-001: municipality HRB-01, product PANEL-CL-10 (owned 400), crew CRW-A (12.0 h/day)."
            - "Account A (credit_limit_cents 100000000) plus jobsite J1 (SOIL, no closure) and jobsite J2 (ASPHALT, requires_sidewalk_closure true)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
