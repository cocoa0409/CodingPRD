        test_recipe:
          setup: ["asset created"]
          setup_api_calls:
            - call: "POST /api/assets"
              payload: { title: "Consistency probe", description: "x", classification: "INTERNAL", owner_department: "ENG", exposure_estimate_cents: 10 }
              as: IPCounsel
              captures: { a_id: $.data.id, a_v: $.data.version }
          trigger:
            - call: "PATCH /api/assets/${a_id}"
              payload: { expected_asset_version: "${a_v}", title: "Consistency probe renamed" }
              as: IPCounsel
              captures: { p_title: $.data.title, p_ver: $.data.version }
            - call: "GET /api/assets/${a_id}"
              as: IPCounsel
              captures: { g_title: $.data.title, g_ver: $.data.version }
          assert:
            - "p_title == Consistency probe renamed and p_ver == a_v + 1"
            - "g_title == p_title and g_ver == p_ver (read-after-write identical within the same logical instant)"

