    - voting_seat_count
    output: DisciplineCommittee
    side_effects:
    - status = FORMING; quorum_required = 0 until members are added
  - method: POST
    path: /discipline-committees/{committee_id}/members
    description: Add a seat to a committee
    roles:
    - CouncilAdmin
    code: 201
    input:
    - full_name
    - sector
    - voting_seat?
    - is_chair?
    output: CommitteeMember
    side_effects:
    - recomputes active_voting_member_count, quorum_required, sector_coverage_complete, chair_member_count
    - may bubble the committee FORMING -> SEATED
  - method: POST
    path: /committee-members/{member_id}/recusal
    description: Recuse or reinstate a committee member
    roles:
    - CouncilAdmin
    code: 200
    input:
    - action
    - recusal_reason?
    output: CommitteeMember
    side_effects:
    - recomputes the committee's derived counts
    - may bubble SEATED -> FORMING and cancel that committee's SCHEDULED hearings
    - shrinks the quorum denominator for later votes
  - method: POST
    path: /amendment-proposals
    description: Submit a proposed state amendment
    roles:
    - CouncilAdmin
    - TechnicalStaff
    - JurisdictionOfficial
    - Petitioner
    code: 201
    input:
    - code_cycle_id
    - code_section
    - discipline
    - title
    - proposed_text
    - stringency_direction
    - proposer_sector
    output: AmendmentProposal
    side_effects:
    - review_status = SUBMITTED, analysis_status = NOT_STARTED
    - committee_id assigned by calculations.committee_assignment_by_discipline
    - CodeCycle.proposal_count += 1
  - method: POST
    path: /amendment-proposals/{proposal_id}/screening
    description: Staff screening decision on a submitted or returned proposal
    roles:
    - TechnicalStaff
    code: 200
    input:
    - decision
    output: AmendmentProposal
    side_effects:
    - moves dimension 1 and dimension 2 together
    - sets energy_analysis_required
  - method: POST
    path: /amendment-proposals/{proposal_id}/impact-analyses
    description: File a cost-benefit or energy impact analysis (OCC-guarded on the proposal)
    roles:
    - TechnicalStaff
    code: 201
    input:
    - expected_proposal_version
    - analysis_type
    - incremental_cost_by_occupancy?
    - affected_permit_count?
    - annual_cost_savings_cents?
    - measure_life_years?
    - annual_energy_savings_kwh?
    - energy_delta_pct?
    output: ImpactAnalysis
    side_effects:
    - status = SUBMITTED
    - prepared_by_user_id = X-User-ID (segregation-of-duties subject)
    - statewide_incremental_cost_cents computed on the analysis row for COST_BENEFIT
    - increments AmendmentProposal.version by 1
  - method: POST
    path: /impact-analyses/{analysis_id}/review
    description: Accept or return a filed analysis
    roles:
    - CouncilAdmin
    code: 200
    input:
    - decision
    output: ImpactAnalysis
    side_effects:
    - ACCEPT supersedes the prior ACCEPTED analysis of the same analysis_type
    - ACCEPT of a COST_BENEFIT certifies statewide_incremental_cost_cents, affected_permit_count and preliminary_benefit_cost_ratio on the proposal
    - advances AmendmentProposal.analysis_status
  - method: POST
    path: /amendment-proposals/{proposal_id}/comment-window
    description: Open, extend or close the public comment period
    roles:
    - CouncilAdmin
    code: 200
    input:
    - action
    - opens_at?
    - closes_at?
    output: AmendmentProposal
    side_effects:
    - OPEN sets a half-open window and increments comment_round
    - EXTEND pushes comment_closes_at by COMMENT_EXTENSION_DAYS and increments comment_extension_count
    - CLOSE recomputes the comment tallies and freezes base_docket_score
  - method: POST
    path: /amendment-proposals/{proposal_id}/comments
    description: Submit a public comment inside the open window
    roles:
    - CouncilAdmin
    - TechnicalStaff
    - JurisdictionOfficial
    - Petitioner
    code: 201
    input:
    - commenter_sector
    - position
    - body
    output: PublicComment
    side_effects:
    - comment_round snapshotted from the proposal
    - support/oppose/total comment counts recomputed
  - method: POST
    path: /amendment-proposals/{proposal_id}/reopen
    description: Return an approved or comment-closed proposal for revision (triggers the deepest cascade in the system)
    roles:
    - CouncilAdmin
    code: 200
    input:
    - reason
    output: AmendmentProposal
    side_effects:
    - L1 proposal -> RETURNED_FOR_REVISION and analysis_status -> STALE
    - L2 ACCEPTED analyses -> SUPERSEDED
    - L3 certified cost / permit count / both ratios cleared
    - L4 CodeCycle ledger compensated
    - L5 DRAFT AdoptionRule schedules recomputed
    - L6 CodeCycle RULEMAKING -> DELIBERATION
  - method: POST
    path: /hearings
    description: Schedule a committee hearing
    roles:
    - CouncilAdmin
    code: 201
    input:
    - committee_id
    - scheduled_start
    - scheduled_end
    output: Hearing
    side_effects:
    - status = SCHEDULED; agenda_proposal_ids = []
    - buffered overlap check against the committee's other live hearings
  - method: POST
    path: /hearings/{hearing_id}/agenda
    description: Fill the hearing agenda from the eligible docket
    roles:
    - CouncilAdmin
    code: 200
    input:
    - mode
    output: Hearing
    side_effects:
    - runs calculations.agenda_selection then docket_priority_score stage 2 on the selected proposals
  - method: POST
    path: /hearings/{hearing_id}/convene
    description: Convene the hearing and record attendance
    roles:
    - CouncilChair
    code: 200
    input:
    - present_member_ids
    output: Hearing
    side_effects:
    - snapshots present_voting_count and quorum_required_at_convene
    - sets convened_at
  - method: POST
    path: /hearings/{hearing_id}/adjourn
    description: Adjourn the hearing
    roles:
    - CouncilChair
    code: 200
    input: []
    output: Hearing
    side_effects:
    - sets adjourned_at
    - releases un-voted agenda items back to the eligible pool
  - method: POST
    path: /hearings/{hearing_id}/votes
    description: Record a committee ballot on an agenda item (immutable)
    roles:
    - CouncilChair
    code: 201
    input:
    - proposal_id
    - ballots
    output: VoteRecord
    side_effects:
    - recomputes final_benefit_cost_ratio before the outcome branches
    - runs calculations.vote_tally_and_outcome
    - APPROVED moves the proposal and syncs calculations.cycle_cost_ledger
  - method: POST
    path: /adoption-rules
    description: Draft the adoption rulemaking order and its transition schedule
    roles:
    - CouncilAdmin
    code: 201
    input:
    - code_cycle_id
    - title
    output: AdoptionRule
    side_effects:
    - status = DRAFT
    - runs calculations.adoption_schedule from the cycle's current approved backlog
  - method: POST
    path: /adoption-rules/{adoption_rule_id}/status
    description: File, publish, make effective or withdraw the adoption rule
    roles:
    - CouncilAdmin
    code: 200
    input:
    - to_status
    - withdrawal_reason?
    output: AdoptionRule
    side_effects:
    - FILED pins pinned_amendment_versions and freezes the cost
    - PUBLISHED anchors the local-filing and appeal windows
    - EFFECTIVE checks calculations.statewide_training_readiness and adopts the cycle
    - WITHDRAWN drives the 5-level training/compliance cascade plus the local-amendment and interpretation fan-outs
  - method: POST
    path: /jurisdictions
    description: Register a local jurisdiction
    roles:
    - CouncilAdmin
    code: 201
    input:
    - name
    - population
    - local_authority_level
    - host_seat_capacity
    - official_headcount
    output: Jurisdiction
    side_effects:
    - both compliance bases start at 0 and enforcement_readiness at NOT_READY, which immediately drags statewide_training_readiness down
  - method: POST
    path: /local-amendments
    description: File a local amendment to the state rule (OCC-guarded on the jurisdiction)
    roles:
    - JurisdictionOfficial
    code: 201
    input:
    - expected_jurisdiction_version
    - jurisdiction_id
    - adoption_rule_id
    - code_section
    - local_text
    - stringency_direction
    - justification
    output: LocalAmendment
    side_effects:
    - status = SUBMITTED
    - filed_within_window evaluated against adoption_rule.published_at + LOCAL_FILING_WINDOW_DAYS
    - increments Jurisdiction.version by 1
  - method: POST
    path: /local-amendments/{local_amendment_id}/review
    description: Council review of a local filing against the stringency limit
    roles:
    - CouncilAdmin
    code: 200
    input:
    - decision
    output: LocalAmendment
    side_effects:
    - ACCEPT increments Jurisdiction.effective_local_amendment_count
  - method: POST
    path: /local-amendments/{local_amendment_id}/resubmit
    description: Resubmit a returned local filing
    roles:
    - JurisdictionOfficial
    code: 200
    input:
    - local_text
    - stringency_direction
    - justification
    output: LocalAmendment
    side_effects:
    - revision_round += 1
    - filed_within_window re-evaluated against the current clock
  - method: POST
    path: /interpretation-requests
    description: Request a formal code interpretation
    roles:
    - CouncilAdmin
    - JurisdictionOfficial
    - Petitioner
    code: 201
    input:
    - adoption_rule_id
    - code_section
    - question
    - jurisdiction_id?
    - supersedes_request_id?
    output: InterpretationRequest
    side_effects:
    - status = SUBMITTED
  - method: POST
    path: /interpretation-requests/{request_id}/actions
    description: Assign, draft, publish, appeal or decline a formal opinion
    roles:
    - CouncilAdmin
    - TechnicalStaff
    - JurisdictionOfficial
    code: 200
    input:
    - action
    - assigned_committee_id?
    - opinion_text?
    - binding_scope?
    - appeal_reason?
    - decline_reason?
    output: InterpretationRequest
    side_effects:
    - PUBLISH assigns opinion_number per adoption rule and supersedes the referenced prior opinion
    - APPEAL clears the opinion fields and returns the request to ASSIGNED
    note: 'Action-level role gate enforced at validation priority 2: ASSIGN | PUBLISH | DECLINE require CouncilAdmin, ISSUE_OPINION requires TechnicalStaff, APPEAL requires JurisdictionOfficial.'
  - method: POST
    path: /training-sessions
    description: Schedule a training session for building officials and design professionals
    roles:
    - CouncilAdmin
    code: 201
    input:
    - adoption_rule_id
    - host_jurisdiction_id
    - discipline
    - audience
    - seat_capacity
    - starts_at
    - ends_at
    output: TrainingSession
    side_effects:
    - status = SCHEDULED; seats_available = seat_capacity
    - aggregate host-capacity check over overlapping half-open intervals
  - method: POST
    path: /training-sessions/{training_session_id}/status
    description: Open, close or cancel enrollment on a session
    roles:
    - CouncilAdmin
    code: 200
    input:
    - to_status
    - cancellation_reason?
    output: TrainingSession
    side_effects:
    - CANCELLED cancels child ENROLLED enrollments, restores the seat ledger and recomputes jurisdiction compliance
  - method: POST
    path: /training-sessions/{training_session_id}/enrollments
    description: Enroll an official or design professional in a session
    roles:
    - CouncilAdmin
    - JurisdictionOfficial
    code: 201
    input:
    - jurisdiction_id
    - attendee_name
    - attendee_role
    output: TrainingEnrollment
    side_effects:
    - consumes one seat (seats_available -= 1)
    - recomputes both compliance bases for the attendee's jurisdiction
  - method: POST
    path: /training-enrollments/{enrollment_id}/cancel
    description: Cancel an enrollment and return the seat
    roles:
    - CouncilAdmin
    - JurisdictionOfficial
    code: 200
    input:
    - reason?
    output: TrainingEnrollment
    side_effects:
    - full compensation of the seat ledger
    - recomputes both compliance bases and enforcement_readiness
  - method: POST
    path: /training-sessions/{training_session_id}/attendance
    description: Record attendance and deliver the session
    roles:
    - CouncilAdmin
    code: 200
    input:
    - records
    output: TrainingSession
    side_effects:
    - session -> DELIVERED
    - listed enrollments -> ATTENDED | NO_SHOW; unlisted ENROLLED rows -> NO_SHOW
    - recomputes both compliance bases, enforcement_readiness and (through them) statewide_training_readiness
  
# =============================================================================
# §1.6 Error Code Catalog (every entry is triggerable by at least one
# §1.8 / §1.9 instance)
# =============================================================================
errors:

  # ---- authentication / authorization --------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID or X-Role header missing or empty", applies_to: [all] }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "X-Role not in the endpoint's authorized_roles, or the action-level role gate on POST /interpretation-requests/{request_id}/actions fails", applies_to: [all] }
  - { id: ERR_IDENTITY_NOT_FOUND, http: 403, condition: "an entity_backed role's X-User-ID does not resolve to a live CommitteeMember or Jurisdiction row", applies_to: ["POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/adjourn", "POST /hearings/{hearing_id}/votes", "POST /local-amendments", "POST /local-amendments/{local_amendment_id}/resubmit", "POST /training-sessions/{training_session_id}/enrollments", "POST /training-enrollments/{enrollment_id}/cancel", "POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_JURISDICTION_MISMATCH, http: 403, condition: "a JurisdictionOfficial acts on a resource belonging to a different jurisdiction", applies_to: ["POST /local-amendments", "POST /local-amendments/{local_amendment_id}/resubmit", "POST /training-sessions/{training_session_id}/enrollments", "POST /training-enrollments/{enrollment_id}/cancel", "POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_NOT_COMMITTEE_CHAIR, http: 403, condition: "the acting CouncilChair is not the ACTIVE chair of the hearing's committee", applies_to: ["POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/adjourn", "POST /hearings/{hearing_id}/votes"] }

  # ---- request shape -------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, wrong type, unknown enum member, out-of-range number, malformed datetime, end <= start, unknown occupancy key, or an action-conditional field omitted", applies_to: [all] }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit outside 1..100 or offset < 0", applies_to: ["all list endpoints"] }

  # ---- existence -----------------------------------------------------------
  - { id: ERR_CODE_CYCLE_NOT_FOUND, http: 404, condition: "code_cycle_id (path or body) does not resolve", applies_to: ["GET /code-cycles/{code_cycle_id}", "POST /code-cycles/{code_cycle_id}/status", "POST /code-cycles/{code_cycle_id}/discipline-committees", "POST /amendment-proposals", "POST /adoption-rules", "GET /code-cycles/{code_cycle_id}/discipline-committees", "GET /code-cycles/{code_cycle_id}/amendment-proposals", "GET /code-cycles/{code_cycle_id}/adoption-rules"] }
  - { id: ERR_COMMITTEE_NOT_FOUND, http: 404, condition: "committee_id (path or body) does not resolve", applies_to: ["GET /discipline-committees/{committee_id}", "POST /discipline-committees/{committee_id}/members", "POST /hearings", "POST /interpretation-requests/{request_id}/actions", "GET /discipline-committees/{committee_id}/members", "GET /discipline-committees/{committee_id}/amendment-proposals", "GET /discipline-committees/{committee_id}/hearings", "GET /discipline-committees/{committee_id}/interpretation-requests"] }
  - { id: ERR_COMMITTEE_MEMBER_NOT_FOUND, http: 404, condition: "member_id in the path does not resolve", applies_to: ["GET /committee-members/{member_id}", "POST /committee-members/{member_id}/recusal"] }
  - { id: ERR_PROPOSAL_NOT_FOUND, http: 404, condition: "proposal_id (path or body) does not resolve", applies_to: ["GET /amendment-proposals/{proposal_id}", "POST /amendment-proposals/{proposal_id}/screening", "POST /amendment-proposals/{proposal_id}/impact-analyses", "POST /amendment-proposals/{proposal_id}/comment-window", "POST /amendment-proposals/{proposal_id}/comments", "POST /amendment-proposals/{proposal_id}/reopen", "POST /hearings/{hearing_id}/votes", "GET /amendment-proposals/{proposal_id}/impact-analyses", "GET /amendment-proposals/{proposal_id}/comments", "GET /amendment-proposals/{proposal_id}/vote-records"] }
  - { id: ERR_ANALYSIS_NOT_FOUND, http: 404, condition: "analysis_id in the path does not resolve", applies_to: ["GET /impact-analyses/{analysis_id}", "POST /impact-analyses/{analysis_id}/review"] }
  - { id: ERR_COMMENT_NOT_FOUND, http: 404, condition: "comment_id in the path does not resolve", applies_to: ["GET /public-comments/{comment_id}"] }
  - { id: ERR_HEARING_NOT_FOUND, http: 404, condition: "hearing_id in the path does not resolve", applies_to: ["GET /hearings/{hearing_id}", "POST /hearings/{hearing_id}/agenda", "POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/adjourn", "POST /hearings/{hearing_id}/votes", "GET /hearings/{hearing_id}/votes"] }
  - { id: ERR_VOTE_RECORD_NOT_FOUND, http: 404, condition: "vote_record_id in the path does not resolve", applies_to: ["GET /vote-records/{vote_record_id}"] }
  - { id: ERR_ADOPTION_RULE_NOT_FOUND, http: 404, condition: "adoption_rule_id (path or body) does not resolve", applies_to: ["GET /adoption-rules/{adoption_rule_id}", "POST /adoption-rules/{adoption_rule_id}/status", "POST /local-amendments", "POST /interpretation-requests", "POST /training-sessions", "GET /adoption-rules/{adoption_rule_id}/local-amendments", "GET /adoption-rules/{adoption_rule_id}/interpretation-requests", "GET /adoption-rules/{adoption_rule_id}/training-sessions"] }
  - { id: ERR_JURISDICTION_NOT_FOUND, http: 404, condition: "jurisdiction_id (path or body) does not resolve", applies_to: ["GET /jurisdictions/{jurisdiction_id}", "POST /local-amendments", "POST /interpretation-requests", "POST /training-sessions", "POST /training-sessions/{training_session_id}/enrollments", "GET /jurisdictions/{jurisdiction_id}/local-amendments", "GET /jurisdictions/{jurisdiction_id}/interpretation-requests", "GET /jurisdictions/{jurisdiction_id}/hosted-training-sessions", "GET /jurisdictions/{jurisdiction_id}/training-enrollments"] }
  - { id: ERR_LOCAL_AMENDMENT_NOT_FOUND, http: 404, condition: "local_amendment_id in the path does not resolve", applies_to: ["GET /local-amendments/{local_amendment_id}", "POST /local-amendments/{local_amendment_id}/review", "POST /local-amendments/{local_amendment_id}/resubmit"] }
  - { id: ERR_INTERPRETATION_REQUEST_NOT_FOUND, http: 404, condition: "request_id in the path, or supersedes_request_id in the body, does not resolve", applies_to: ["GET /interpretation-requests/{request_id}", "POST /interpretation-requests", "POST /interpretation-requests/{request_id}/actions", "GET /interpretation-requests/{request_id}/superseding-requests"] }
  - { id: ERR_TRAINING_SESSION_NOT_FOUND, http: 404, condition: "training_session_id in the path does not resolve", applies_to: ["GET /training-sessions/{training_session_id}", "POST /training-sessions/{training_session_id}/status", "POST /training-sessions/{training_session_id}/enrollments", "POST /training-sessions/{training_session_id}/attendance", "GET /training-sessions/{training_session_id}/enrollments"] }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollment_id in the path, or an enrollment_id inside an attendance record, does not resolve", applies_to: ["GET /training-enrollments/{enrollment_id}", "POST /training-enrollments/{enrollment_id}/cancel", "POST /training-sessions/{training_session_id}/attendance"] }

  # ---- optimistic concurrency ---------------------------------------------
  - { id: ERR_STALE_PROPOSAL_VERSION, http: 412, condition: "expected_proposal_version != AmendmentProposal.version", applies_to: ["POST /amendment-proposals/{proposal_id}/impact-analyses"] }
  - { id: ERR_STALE_JURISDICTION_VERSION, http: 412, condition: "expected_jurisdiction_version != Jurisdiction.version", applies_to: ["POST /local-amendments"] }

  # ---- own-entity state ----------------------------------------------------
  - { id: ERR_CYCLE_STATE_INVALID, http: 409, condition: "the CodeCycle's status forbids the requested transition, or a dependent operation needs a different cycle status", applies_to: ["POST /code-cycles/{code_cycle_id}/status", "POST /amendment-proposals", "POST /amendment-proposals/{proposal_id}/screening", "POST /amendment-proposals/{proposal_id}/comment-window", "POST /amendment-proposals/{proposal_id}/reopen", "POST /adoption-rules/{adoption_rule_id}/status"] }
  - { id: ERR_PROPOSAL_STATE_INVALID, http: 409, condition: "the proposal's review_status forbids the requested action (including terminal REJECTED / WITHDRAWN and repeat attempts)", applies_to: ["POST /amendment-proposals/{proposal_id}/screening", "POST /amendment-proposals/{proposal_id}/comment-window", "POST /amendment-proposals/{proposal_id}/comments", "POST /amendment-proposals/{proposal_id}/reopen", "POST /amendment-proposals/{proposal_id}/impact-analyses"] }
  - { id: ERR_ANALYSIS_STATE_INVALID, http: 409, condition: "the analysis is not SUBMITTED (already ACCEPTED, RETURNED or SUPERSEDED)", applies_to: ["POST /impact-analyses/{analysis_id}/review"] }
  - { id: ERR_HEARING_STATE_INVALID, http: 409, condition: "the hearing's status forbids the action (agenda after convene, convene twice, votes when not CONVENED, adjourn when not CONVENED, anything on a CANCELLED hearing)", applies_to: ["POST /hearings/{hearing_id}/agenda", "POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/adjourn", "POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_ADOPTION_RULE_STATE_INVALID, http: 409, condition: "the rule's status forbids the requested transition, or a reopen is attempted while a rule of the cycle is FILED, PUBLISHED or EFFECTIVE", applies_to: ["POST /adoption-rules/{adoption_rule_id}/status", "POST /amendment-proposals/{proposal_id}/reopen"] }
  - { id: ERR_LOCAL_AMENDMENT_STATE_INVALID, http: 409, condition: "the local filing's status forbids the requested review decision or resubmission", applies_to: ["POST /local-amendments/{local_amendment_id}/review", "POST /local-amendments/{local_amendment_id}/resubmit"] }
  - { id: ERR_INTERPRETATION_STATE_INVALID, http: 409, condition: "the request's status forbids the requested action (publishing an unassigned request, appealing an unpublished one, acting on DECLINED or SUPERSEDED)", applies_to: ["POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_SESSION_STATE_INVALID, http: 409, condition: "the session's status forbids the action (enrolling when not ENROLLMENT_OPEN, attendance when not ENROLLMENT_CLOSED, re-cancelling, acting on DELIVERED)", applies_to: ["POST /training-sessions/{training_session_id}/status", "POST /training-sessions/{training_session_id}/enrollments", "POST /training-sessions/{training_session_id}/attendance", "POST /training-enrollments/{enrollment_id}/cancel"] }
  - { id: ERR_ENROLLMENT_STATE_INVALID, http: 409, condition: "the enrollment is not ENROLLED (already ATTENDED, NO_SHOW or CANCELLED)", applies_to: ["POST /training-enrollments/{enrollment_id}/cancel", "POST /training-sessions/{training_session_id}/attendance"] }

  # ---- cross-entity state --------------------------------------------------
  - { id: ERR_COMMITTEE_NOT_SEATED, http: 409, condition: "the discipline committee is FORMING or DISSOLVED where SEATED is required", applies_to: ["POST /code-cycles/{code_cycle_id}/status", "POST /hearings", "POST /hearings/{hearing_id}/convene"] }
  - { id: ERR_ADOPTION_RULE_NOT_IN_FORCE, http: 409, condition: "the adoption rule is not PUBLISHED or EFFECTIVE where an in-force rule is required", applies_to: ["POST /local-amendments/{local_amendment_id}/review", "POST /training-sessions/{training_session_id}/status", "POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_PROPOSAL_STAGE_INVALID, http: 409, condition: "an analysis review is attempted while the parent proposal's review_status is outside {SCREENED, COMMENT_OPEN, COMMENT_CLOSED}", applies_to: ["POST /impact-analyses/{analysis_id}/review"] }
  - { id: ERR_ANALYSIS_INCOMPLETE, http: 409, condition: "analysis_status is not COMPLETE where completeness is required (opening a comment window, recording an approving vote)", applies_to: ["POST /amendment-proposals/{proposal_id}/comment-window", "POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_LOCAL_AUTHORITY_ABSENT, http: 409, condition: "the jurisdiction's local_authority_level is NONE", applies_to: ["POST /local-amendments", "POST /local-amendments/{local_amendment_id}/review"] }

  # ---- segregation of duties ----------------------------------------------
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the acting X-User-ID equals prepared_by_user_id (analysis review), filed_by_user_id (rule publication) or drafted_by_user_id (opinion publication)", applies_to: ["POST /impact-analyses/{analysis_id}/review", "POST /adoption-rules/{adoption_rule_id}/status", "POST /interpretation-requests/{request_id}/actions"] }

  # ---- business safety -----------------------------------------------------
  - { id: ERR_STRINGENCY_FLOOR_VIOLATION, http: 422, condition: "an approving vote would relax a life-safety section (stringency_direction LESS_STRINGENT and code_section beginning with '9' or '10')", applies_to: ["POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_LOCAL_LESS_STRINGENT_FORBIDDEN, http: 422, condition: "a local amendment with stringency_direction == LESS_STRINGENT is accepted", applies_to: ["POST /local-amendments/{local_amendment_id}/review"] }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "ballots cast (or members present at convene) fall short of committee.quorum_required", applies_to: ["POST /hearings/{hearing_id}/convene", "POST /hearings/{hearing_id}/votes"] }

  # ---- business referential ----------------------------------------------
  - { id: ERR_PROPOSAL_NOT_ON_AGENDA, http: 409, condition: "the proposal_id being voted on is not in hearing.agenda_proposal_ids", applies_to: ["POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_COMMITTEE_CYCLE_MISMATCH, http: 409, condition: "the committee assigned to an interpretation request belongs to a different code cycle than the rule under interpretation", applies_to: ["POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_BALLOT_MEMBER_NOT_ON_COMMITTEE, http: 409, condition: "a ballot member_id is not an ACTIVE voting member of the hearing's committee", applies_to: ["POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_NO_COMMITTEE_FOR_DISCIPLINE, http: 409, condition: "the cycle has no live DisciplineCommittee for the proposal's discipline", applies_to: ["POST /amendment-proposals"] }
  - { id: ERR_ENROLLMENT_SESSION_MISMATCH, http: 409, condition: "an attendance record references an enrollment belonging to a different session", applies_to: ["POST /training-sessions/{training_session_id}/attendance"] }

  # ---- business temporal ---------------------------------------------------
  - { id: ERR_COMMENT_PERIOD_TOO_SHORT, http: 409, condition: "closes_at - opens_at < COMMENT_MIN_DAYS (30 days; exactly 30 is accepted)", applies_to: ["POST /amendment-proposals/{proposal_id}/comment-window"] }
  - { id: ERR_COMMENT_WINDOW_CLOSED, http: 409, condition: "a comment arrives outside [comment_opens_at, comment_closes_at) — including exactly at comment_closes_at — or while comment_window_status is not OPEN", applies_to: ["POST /amendment-proposals/{proposal_id}/comments"] }
  - { id: ERR_COMMENT_WINDOW_STILL_OPEN, http: 409, condition: "CLOSE is requested before current_utc reaches comment_closes_at", applies_to: ["POST /amendment-proposals/{proposal_id}/comment-window"] }
  - { id: ERR_HEARING_NOTICE_TOO_SHORT, http: 409, condition: "scheduled_start < current_utc + HEARING_NOTICE_DAYS (14 days; exactly 14 is accepted)", applies_to: ["POST /hearings"] }
  - { id: ERR_HEARING_TIME_CONFLICT, http: 409, condition: "the requested hearing interval, padded by HEARING_BUFFER_MINUTES (60) on both sides, overlaps another SCHEDULED or CONVENED hearing of the same committee", applies_to: ["POST /hearings"] }
  - { id: ERR_HEARING_NOT_STARTED, http: 409, condition: "convene is attempted before scheduled_start", applies_to: ["POST /hearings/{hearing_id}/convene"] }
  - { id: ERR_EFFECTIVE_DATE_NOT_REACHED, http: 409, condition: "EFFECTIVE is requested before current_utc reaches effective_date", applies_to: ["POST /adoption-rules/{adoption_rule_id}/status"] }
  - { id: ERR_SESSION_NOT_FINISHED, http: 409, condition: "attendance is recorded before current_utc reaches session.ends_at", applies_to: ["POST /training-sessions/{training_session_id}/attendance"] }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 409, condition: "an appeal arrives after published_at + APPEAL_WINDOW_DAYS (30 days; exactly 30 is accepted)", applies_to: ["POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_LOCAL_FILING_DEADLINE_PASSED, http: 409, condition: "an accepted local filing has filed_within_window == false (created_at beyond published_at + LOCAL_FILING_WINDOW_DAYS, 90 days inclusive)", applies_to: ["POST /local-amendments/{local_amendment_id}/review"] }

  # ---- business constraint -------------------------------------------------
  - { id: ERR_DUPLICATE_CODE_CYCLE, http: 409, condition: "(cycle_year, model_code_edition) already exists", applies_to: ["POST /code-cycles"] }
  - { id: ERR_DUPLICATE_COMMITTEE_DISCIPLINE, http: 409, condition: "the cycle already has a live committee for that discipline", applies_to: ["POST /code-cycles/{code_cycle_id}/discipline-committees"] }
  - { id: ERR_DUPLICATE_JURISDICTION, http: 409, condition: "Jurisdiction.name already exists", applies_to: ["POST /jurisdictions"] }
  - { id: ERR_DUPLICATE_LOCAL_AMENDMENT, http: 409, condition: "(jurisdiction_id, adoption_rule_id, code_section) already exists on a row not in {REJECTED, VOIDED}", applies_to: ["POST /local-amendments"] }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "(training_session_id, attendee_name) already exists on a non-CANCELLED row", applies_to: ["POST /training-sessions/{training_session_id}/enrollments"] }
  - { id: ERR_DUPLICATE_BALLOT, http: 409, condition: "the same member_id appears twice in one ballots array", applies_to: ["POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_DUPLICATE_VOTE_RECORD, http: 409, condition: "a VoteRecord already exists for this (hearing_id, proposal_id)", applies_to: ["POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_SESSION_FULL, http: 409, condition: "seats_available == 0", applies_to: ["POST /training-sessions/{training_session_id}/enrollments"] }
  - { id: ERR_CHAIR_ALREADY_SEATED, http: 409, condition: "a second member with is_chair == true is added while an ACTIVE chair already holds the seat", applies_to: ["POST /discipline-committees/{committee_id}/members"] }
  - { id: ERR_SEAT_LIMIT_EXCEEDED, http: 409, condition: "adding this member would push active_voting_member_count above voting_seat_count", applies_to: ["POST /discipline-committees/{committee_id}/members"] }
  - { id: ERR_COMMENT_EXTENSIONS_EXHAUSTED, http: 409, condition: "comment_extension_count has already reached COMMENT_EXTENSIONS_MAX (2)", applies_to: ["POST /amendment-proposals/{proposal_id}/comment-window"] }
  - { id: ERR_APPEAL_ROUNDS_EXHAUSTED, http: 409, condition: "appeal_round has already reached APPEAL_ROUNDS_MAX (2)", applies_to: ["POST /interpretation-requests/{request_id}/actions"] }
  - { id: ERR_LOCAL_REVISION_ROUNDS_EXHAUSTED, http: 409, condition: "revision_round has already reached LOCAL_REVISION_ROUNDS_MAX (2)", applies_to: ["POST /local-amendments/{local_amendment_id}/resubmit"] }
  - { id: ERR_AGENDA_EMPTY, http: 409, condition: "convene is attempted while agenda_proposal_ids is empty", applies_to: ["POST /hearings/{hearing_id}/convene"] }
  - { id: ERR_NO_ELIGIBLE_PROPOSALS, http: 409, condition: "AUTO_FILL finds no proposal that is COMMENT_CLOSED, analysis-COMPLETE, routed to this committee and not already on a live agenda", applies_to: ["POST /hearings/{hearing_id}/agenda"] }
  - { id: ERR_HOST_CAPACITY_EXCEEDED, http: 409, condition: "aggregate seat_capacity of non-CANCELLED sessions overlapping [starts_at, ends_at) would exceed jurisdiction.host_seat_capacity", applies_to: ["POST /training-sessions"] }

  # ---- business fiscal -----------------------------------------------------
  - { id: ERR_BENEFIT_COST_BELOW_FLOOR, http: 422, condition: "final_benefit_cost_ratio rounded to 2 dp is below BCR_FLOOR (1.00)", applies_to: ["POST /hearings/{hearing_id}/votes"] }
  - { id: ERR_TRAINING_READINESS_NOT_MET, http: 422, condition: "population-weighted statewide_training_readiness is below READINESS_THRESHOLD_PCT (80.00)", applies_to: ["POST /adoption-rules/{adoption_rule_id}/status"] }
  - { id: ERR_NO_APPROVED_AMENDMENTS, http: 422, condition: "FILED is requested while the cycle has approved_proposal_count == 0", applies_to: ["POST /adoption-rules/{adoption_rule_id}/status"] }
  - { id: ERR_PROPOSALS_UNRESOLVED, http: 422, condition: "RULEMAKING is requested while some proposal of the cycle is still open, or ABANDONED is requested while the cycle has any proposal", applies_to: ["POST /code-cycles/{code_cycle_id}/status"] }

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:

  - name: CouncilAdmin
    description: "State building code council administrative staff. Runs the cycle, the comment periods, rulemaking, jurisdictions and the training rollout."
    identity: opaque
    exclusive_operations:
      - "POST /code-cycles"
      - "POST /code-cycles/{code_cycle_id}/status"
      - "POST /code-cycles/{code_cycle_id}/discipline-committees"
      - "POST /discipline-committees/{committee_id}/members"
      - "POST /committee-members/{member_id}/recusal"
      - "POST /impact-analyses/{analysis_id}/review"
      - "POST /amendment-proposals/{proposal_id}/comment-window"
      - "POST /amendment-proposals/{proposal_id}/reopen"
      - "POST /hearings"
      - "POST /hearings/{hearing_id}/agenda"
      - "POST /adoption-rules"
      - "POST /adoption-rules/{adoption_rule_id}/status"
      - "POST /jurisdictions"
      - "POST /local-amendments/{local_amendment_id}/review"
      - "POST /training-sessions"
      - "POST /training-sessions/{training_session_id}/status"
      - "POST /training-sessions/{training_session_id}/attendance"
      - "POST /interpretation-requests/{request_id}/actions with action in {ASSIGN, PUBLISH, DECLINE}"
    shared_operations:
      - "POST /amendment-proposals"
      - "POST /amendment-proposals/{proposal_id}/comments"
      - "POST /interpretation-requests"
      - "POST /training-sessions/{training_session_id}/enrollments"
      - "POST /training-enrollments/{enrollment_id}/cancel"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
    note: "Segregation of duties still binds an individual CouncilAdmin X-User-ID: the user that FILEs a rule cannot PUBLISH it, and the user that prepared an analysis cannot accept it even after switching to this role."

  - name: TechnicalStaff
    description: "Council technical staff. Screens intake, prepares cost-benefit and energy analyses, drafts formal opinions."
    identity: opaque
    exclusive_operations:
      - "POST /amendment-proposals/{proposal_id}/screening"
      - "POST /amendment-proposals/{proposal_id}/impact-analyses"
      - "POST /interpretation-requests/{request_id}/actions with action == ISSUE_OPINION"
    shared_operations:
      - "POST /amendment-proposals"
      - "POST /amendment-proposals/{proposal_id}/comments"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: CommitteeMember
    description: "A seated committee member. Reads the docket and the analyses but records nothing; only the chair may act at a hearing."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations: []
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"

  - name: CouncilChair
    description: "The presiding chair of a discipline committee. Convenes hearings, records ballots, adjourns."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /hearings/{hearing_id}/convene"
      - "POST /hearings/{hearing_id}/adjourn"
      - "POST /hearings/{hearing_id}/votes"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
    note: "X-User-ID must resolve to a CommitteeMember with is_chair == true, status == ACTIVE and committee_id equal to the hearing's committee (validation priority 9)."

  - name: JurisdictionOfficial
    description: "A local building department. Files local amendments, enrolls staff in training, appeals formal opinions."
    identity: "entity_backed:Jurisdiction"
    exclusive_operations:
      - "POST /local-amendments"
      - "POST /local-amendments/{local_amendment_id}/resubmit"
      - "POST /interpretation-requests/{request_id}/actions with action == APPEAL"
    shared_operations:
      - "POST /amendment-proposals"
      - "POST /amendment-proposals/{proposal_id}/comments"
      - "POST /interpretation-requests"
      - "POST /training-sessions/{training_session_id}/enrollments"
      - "POST /training-enrollments/{enrollment_id}/cancel"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
    note: "X-User-ID is the Jurisdiction.id; validation priority 8 forbids acting for another jurisdiction."

  - name: Petitioner
    description: "Industry or fire-service petitioner outside government. Proposes amendments, comments, asks for interpretations."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /amendment-proposals"
      - "POST /amendment-proposals/{proposal_id}/comments"
      - "POST /interpretation-requests"
      - "POST /_clock/set_current_utc"
      - "all GET endpoints"
