# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — LIHEAP Energy Assistance
# 9 rule_ids x 2 instances = 18 instances. Grounds resolve into SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: application_provisional_vs_final_benefit
        grounds:
          - calculations.benefit_tier_award
          - entities.Application.fields.benefit_variant
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_APPROVED
        distinguishing_aspect: "On the Application domain, PROVISIONAL benefit uses Household self-reported income (1,800,000 -> TIER_1 -> 112900) while FINAL uses verified income (2,600,000 -> TIER_2 -> 88200); identical household, different result."
        test_recipe:
          setup:
            - "OPEN 2026 HEATING pool; household size 3, self-reported income 1,800,000, NATURAL_GAS, elderly/disabled; a DRAFT application submitted (provisional benefit captured) with one VERIFIED income document reporting 2,600,000."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ada Vale", household_size: 3, annual_income_cents: 1800000, state_code: "CA", county: "Alameda", has_elderly_or_disabled: true, has_child_under_6: false, heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { prov_benefit: "$.data.benefit_amount_cents", prov_tier: "$.data.benefit_tier" }
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "PAYSTUB", reported_income_cents: 2600000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 2600000 }
              as: Caseworker
          trigger:
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
              captures: { final_benefit: "$.data.benefit_amount_cents" }
          assert:
            - "captured prov_benefit == 112900"
            - "captured prov_tier == TIER_1"
            - "Application.${app_id}.benefit_amount_cents == 88200 after approve"
            - "Application.${app_id}.benefit_tier == TIER_2 after approve"
            - "Application.${app_id}.benefit_variant == FINAL after approve"

      - name: crisis_benefit_estimate_vs_resolved
        grounds:
          - calculations.crisis_benefit_amount
          - entities.CrisisBenefit.fields.estimated_benefit_cents
          - entities.CrisisBenefit.fields.resolved_benefit_cents
          - state_machines.CrisisBenefit.OPEN_to_RESOLVED
        distinguishing_aspect: "On the CrisisBenefit domain, ESTIMATE is the flat crisis rate (OUT_OF_FUEL -> 60000) while RESOLVED is min(estimate, pool available, account balance) = min(60000, big, 45000) = 45000; strictly smaller."
        test_recipe:
          setup:
            - "OPEN 2026 CRISIS pool with ample funds; ENROLLED gas vendor; household with a utility account at current 30000 + arrearage 15000; an OPEN OUT_OF_FUEL crisis (estimate captured)."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "CRISIS", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { cpool_id: "$.data.id" }
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ben Cole", household_size: 2, annual_income_cents: 1500000, state_code: "CA", county: "Kern", heating_source: "PROPANE" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/vendors"
              payload: { name: "WestGas", vendor_type: "GAS", remittance_account: "rga-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "AC-1", service_type: "HEATING", current_balance_cents: 30000, arrearage_cents: 15000, is_disconnected: false }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/crisis-benefits"
              payload: { household_id: "${hh_id}", utility_account_id: "${ua_id}", funding_pool_id: "${cpool_id}", crisis_type: "OUT_OF_FUEL" }
              as: Caseworker
              captures: { crisis_id: "$.data.id", est: "$.data.estimated_benefit_cents" }
          trigger:
            - call: "POST /liheap/crisis-benefits/${crisis_id}/resolve"
              payload: {}
              as: Caseworker
              captures: { resolved: "$.data.resolved_benefit_cents" }
          assert:
            - "captured est == 60000"
            - "CrisisBenefit.${crisis_id}.estimated_benefit_cents == 60000"
            - "CrisisBenefit.${crisis_id}.resolved_benefit_cents == 45000"
            - "CrisisBenefit.${crisis_id}.status == RESOLVED"

  - rule_id: combinatorial_formula
    instances:
      - name: benefit_tier_matrix_nonlinear_cap
        grounds:
          - calculations.benefit_tier_award
          - entities.Application.fields.benefit_amount_cents
          - entities.Household.fields.household_size
        distinguishing_aspect: "Mode (a): >=3 inputs (fpl band, household_size 8, NATURAL_GAS factor, vulnerability) select TIER_1 base and multiply to raw 153600, then the nested min(MAX_BENEFIT_CENTS, max(MIN,...)) clamps the award to exactly 150000."
        test_recipe:
          setup:
            - "OPEN 2026 HEATING pool; large household size 8, income 2,000,000 (TIER_1), NATURAL_GAS, elderly/disabled; application submitted."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Cara Diaz", household_size: 8, annual_income_cents: 2000000, state_code: "CA", county: "Fresno", has_elderly_or_disabled: true, heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { ben: "$.data.benefit_amount_cents" }
          assert:
            - "Application.${app_id}.benefit_tier == TIER_1"
            - "Application.${app_id}.benefit_amount_cents == 150000"
            - "captured ben == 150000"

      - name: benefit_component_rounding_order
        grounds:
          - calculations.benefit_component_rounding
          - calculations.benefit_tier_award
          - entities.Application.fields.benefit_amount_cents
        distinguishing_aspect: "Mode (b): components size 89650 and heating 8150 round-to-dollar to 89700 and 8200 then sum with 15000 = 112900 (pinned round-then-sum); sum-then-round would give 112800, so the pinned order is observable as exactly 112900."
        test_recipe:
          setup:
            - "OPEN 2026 HEATING pool; household size 3, income 1,800,000 (TIER_1), NATURAL_GAS, elderly/disabled; application submitted."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Dan Ely", household_size: 3, annual_income_cents: 1800000, state_code: "CA", county: "Marin", has_elderly_or_disabled: true, heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { ben: "$.data.benefit_amount_cents" }
          assert:
            - "Application.${app_id}.benefit_amount_cents == 112900"
            - "captured ben == 112900 (round-then-sum; sum-then-round 112800 is wrong)"

  - rule_id: non_linear_state_machine
    instances:
      - name: application_info_requested_revision_cycle
        grounds:
          - state_machines.Application.SUBMITTED_to_INFO_REQUESTED
          - state_machines.Application.INFO_REQUESTED_to_SUBMITTED
          - entities.Application.fields.status
        distinguishing_aspect: "Application is non-linear via the SUBMITTED->INFO_REQUESTED->SUBMITTED revision cycle: after request-info status is INFO_REQUESTED, after resubmit it returns to SUBMITTED (a genuine back-edge, not a forward-only pipeline)."
        test_recipe:
          setup:
            - "OPEN 2026 HEATING pool; eligible household; application submitted once."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Eve Fenn", household_size: 4, annual_income_cents: 2000000, state_code: "CA", county: "Napa", heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /liheap/applications/${app_id}/request-info"
              payload: {}
              as: Caseworker
              captures: { mid_status: "$.data.status" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { final_status: "$.data.status" }
          assert:
            - "captured mid_status == INFO_REQUESTED"
            - "captured final_status == SUBMITTED"
            - "Application.${app_id}.status == SUBMITTED after the resubmit"

      - name: crisis_open_branches_resolved_vs_breached
        grounds:
          - state_machines.CrisisBenefit.OPEN_to_RESOLVED
          - state_machines.CrisisBenefit.OPEN_to_BREACHED
          - entities.CrisisBenefit.fields.status
        distinguishing_aspect: "CrisisBenefit forks OPEN->{RESOLVED (pledge created), BREACHED (no pledge, deadline auto-transition)} on a different entity than Application; the two branches carry divergent side-effect sets."
        test_recipe:
          setup:
            - "OPEN 2026 CRISIS pool; ENROLLED vendor; two households each with a utility account; crisis A resolved before deadline; crisis B left OPEN for household B."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "CRISIS", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { cpool_id: "$.data.id" }
            - call: "POST /liheap/vendors"
              payload: { name: "NorthOil", vendor_type: "OIL", remittance_account: "roil-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Fay Gould", household_size: 2, annual_income_cents: 1400000, state_code: "CA", county: "Yolo", heating_source: "FUEL_OIL" }
              as: Caseworker
              captures: { hhA_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hhA_id}", vendor_id: "${vendor_id}", account_number: "OA-1", service_type: "HEATING", current_balance_cents: 40000, arrearage_cents: 0 }
              as: Caseworker
              captures: { uaA_id: "$.data.id" }
            - call: "POST /liheap/crisis-benefits"
              payload: { household_id: "${hhA_id}", utility_account_id: "${uaA_id}", funding_pool_id: "${cpool_id}", crisis_type: "NO_HEAT" }
              as: Caseworker
              captures: { crisisA_id: "$.data.id" }
            - call: "POST /liheap/crisis-benefits/${crisisA_id}/resolve"
              payload: {}
              as: Caseworker
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Gus Hale", household_size: 3, annual_income_cents: 1600000, state_code: "CA", county: "Butte", heating_source: "FUEL_OIL" }
              as: Caseworker
              captures: { hhB_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hhB_id}", vendor_id: "${vendor_id}", account_number: "OA-2", service_type: "HEATING", current_balance_cents: 50000, arrearage_cents: 0 }
              as: Caseworker
              captures: { uaB_id: "$.data.id" }
            - call: "POST /liheap/crisis-benefits"
              payload: { household_id: "${hhB_id}", utility_account_id: "${uaB_id}", funding_pool_id: "${cpool_id}", crisis_type: "DISCONNECTION_NOTICE" }
              as: Caseworker
              captures: { crisisB_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /liheap/crisis-benefits/${crisisB_id}/breach"
              payload: {}
              as: Caseworker
              captures: { b_status: "$.data.status" }
          assert:
            - "CrisisBenefit.${crisisA_id}.status == RESOLVED (branch A: resolved before deadline, pledge created)"
            - "captured b_status == BREACHED"
            - "CrisisBenefit.${crisisB_id}.status == BREACHED (branch B: deadline passed, no pledge created)"
            - "exactly one crisis Pledge exists on funding_pool_id=${cpool_id} (from crisis A); none from crisis B"

  - rule_id: transitive_cascade
    instances:
      - name: payment_remit_billcredit_reconnection_chain
        grounds:
          - state_machines.Payment.INITIATED_to_REMITTED
          - calculations.bill_credit_allocation
          - entities.BillCredit.fields.applied_to_arrearage_cents
          - entities.UtilityAccount.fields.reconnection_eligible
        distinguishing_aspect: "Depth-3 chain from payment remit: Payment REMITTED -> BillCredit created (link1) -> BillCredit reduces UtilityAccount arrearage 20000->0 (link2) -> arrearage==0 while disconnected flips reconnection_eligible true (link3); each hop caused by the previous."
        test_recipe:
          setup:
            - "OPEN 2026 HEATING pool; ENROLLED vendor; disconnected utility account current 30000 + arrearage 20000; approved application; a 20000 ARREARAGE pledge with an INITIATED 20000 payment."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000000, depletion_threshold_cents: 1000000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "CityElectric", vendor_type: "ELECTRIC", remittance_account: "rce-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Hana Ito", household_size: 3, annual_income_cents: 1700000, state_code: "CA", county: "Solano", heating_source: "ELECTRICITY" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "EL-1", service_type: "ELECTRIC", current_balance_cents: 30000, arrearage_cents: 20000, is_disconnected: true }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "PAYSTUB", reported_income_cents: 1700000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 1700000 }
              as: Caseworker
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
            - call: "POST /liheap/pledges"
              payload: { application_id: "${app_id}", vendor_id: "${vendor_id}", funding_pool_id: "${pool_id}", utility_account_id: "${ua_id}", pledge_type: "ARREARAGE", pledged_amount_cents: 20000, benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-03-15T00:00:00Z", expected_pool_version: "${pool_v}" }
              as: Caseworker
              captures: { pledge_id: "$.data.id" }
            - call: "POST /liheap/payments"
              payload: { pledge_id: "${pledge_id}", amount_cents: 20000 }
              as: Caseworker
              captures: { pay_id: "$.data.id" }
          trigger:
            - call: "POST /liheap/payments/${pay_id}/remit"
              payload: {}
              as: VendorAgent
              as_user_id: "${vendor_id}"
          assert:
            - "BillCredit with payment_id=${pay_id} exists with status APPLIED, applied_to_arrearage_cents == 20000, applied_to_current_cents == 0"
            - "UtilityAccount.${ua_id}.arrearage_cents == 0"
            - "UtilityAccount.${ua_id}.current_balance_cents == 30000"
            - "UtilityAccount.${ua_id}.lifetime_credited_cents == 20000"
            - "UtilityAccount.${ua_id}.reconnection_eligible == true"
            - "Pledge.${pledge_id}.status == PAID"

      - name: pledge_create_reserves_pool_status_chain
        grounds:
          - state_machines.Pledge.(none)_to_PLEDGED
          - calculations.pool_accounting
          - entities.FundingPool.fields.reserved_cents
          - entities.FundingPool.fields.status
        distinguishing_aspect: "Depth-2 chain from a different trigger (pledge create): reserved_cents += 20000 (link1) drives available_cents to 80000 which crosses depletion_threshold 90000 so status re-derives to LOW (link2)."
        test_recipe:
          setup:
            - "OPEN 2026 HEATING pool total 100000 with depletion_threshold 90000; ENROLLED vendor; approved application; utility account."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 100000, depletion_threshold_cents: 90000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "GasCo", vendor_type: "GAS", remittance_account: "rgc-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
              payload: { primary_applicant_name: "Ivy Jung", household_size: 2, annual_income_cents: 1500000, state_code: "CA", county: "Placer", heating_source: "NATURAL_GAS" }
              as: Caseworker
              captures: { hh_id: "$.data.id" }
            - call: "POST /liheap/utility-accounts"
              payload: { household_id: "${hh_id}", vendor_id: "${vendor_id}", account_number: "GA-1", service_type: "HEATING", current_balance_cents: 25000, arrearage_cents: 0 }
              as: Caseworker
              captures: { ua_id: "$.data.id" }
            - call: "POST /liheap/applications"
              payload: { household_id: "${hh_id}", season_year: 2026, program_component: "HEATING" }
              as: Caseworker
              captures: { app_id: "$.data.id" }
            - call: "POST /liheap/applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
            - call: "POST /liheap/income-documents"
              payload: { application_id: "${app_id}", doc_type: "TAX_RETURN", reported_income_cents: 1500000 }
              as: Caseworker
              captures: { doc_id: "$.data.id" }
            - call: "POST /liheap/income-documents/${doc_id}/verify"
              payload: { outcome: "VERIFIED", verified_income_cents: 1500000 }
              as: Caseworker
            - call: "POST /liheap/applications/${app_id}/approve"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /liheap/pledges"
              payload: { application_id: "${app_id}", vendor_id: "${vendor_id}", funding_pool_id: "${pool_id}", utility_account_id: "${ua_id}", pledge_type: "HEATING", pledged_amount_cents: 20000, benefit_period_start: "2026-03-01T00:00:00Z", benefit_period_end: "2026-03-20T00:00:00Z", expected_pool_version: "${pool_v}" }
              as: Caseworker
              captures: { pledge_id: "$.data.id" }
          assert:
            - "FundingPool.${pool_id}.reserved_cents == 20000"
            - "FundingPool.${pool_id}.available_cents == 80000"
            - "FundingPool.${pool_id}.status == LOW"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pledge_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - errors[ERR_APPLICATION_NOT_APPROVED]
          - errors[ERR_POOL_DEPLETED]
        distinguishing_aspect: "Category pair state (ERR_APPLICATION_NOT_APPROVED, priority 5) vs business_fiscal (ERR_POOL_DEPLETED, priority 17): a pledge against a SUBMITTED application on a DEPLETED pool returns ERR_APPLICATION_NOT_APPROVED because state outranks fiscal."
        test_recipe:
          setup:
            - "HEATING pool total 20000 fully reserved (DEPLETED) by an approved application's 20000 pledge; a second household with a SUBMITTED (not approved) application and its own utility account."
          setup_api_calls:
            - call: "POST /liheap/funding-pools"
              payload: { season_year: 2026, program_component: "HEATING", total_allocation_cents: 20000, depletion_threshold_cents: 5000 }
              as: ProgramAdmin
              captures: { pool_id: "$.data.id", pool_v: "$.data.version" }
            - call: "POST /liheap/vendors"
              payload: { name: "PropanePlus", vendor_type: "PROPANE", remittance_account: "rpp-1" }
              as: ProgramAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /liheap/vendors/${vendor_id}/enroll"
              payload: {}
              as: ProgramAdmin
            - call: "POST /liheap/households"
