          - state_machines.TrainingCenter.PROVISIONAL_to_ACTIVE
        distinguishing_aspect: "Immediate consistency: the activation's mutation (status, version bump) is fully visible in the very next GET issued in the same test — no lag, no recompute delay."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. PROVISIONAL center with an ALIGNED site; version captured before activation."
          setup_api_calls:
            - *c_clock
            - *c_center
            - *c_faculty
            - *c_grant
            - *c_falign
            - *c_cv
            - *c_site
            - *c_align
          trigger:
            - call: "POST /aha/training-centers/${center_id}/activate"
              payload: {}
              as: NationalAdmin
              captures: { act_status: $.data.status, act_v: $.data.version }
            - call: "GET /aha/training-centers/${center_id}"
              payload: {}
              as: TCAdmin
              captures: { get_status: $.data.status, get_v: $.data.version }
          assert:
            - "act_status == ACTIVE and act_v == ${center_v} + 1 (activation bumps the version)"
            - "get_status == ACTIVE and get_v == act_v on the immediate follow-up read"
            - "TrainingCenter.${center_id}.updated_at advanced past its creation value"
