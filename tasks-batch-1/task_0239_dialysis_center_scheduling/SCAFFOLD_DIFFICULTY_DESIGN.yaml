              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/cancel"
              payload: {}
              as: Scheduler
            - call: "GET /patients/${pid}"
              payload: {}
              as: Scheduler
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv1}" }
              as: Scheduler
              captures: { s2: $.data.id, s2state: $.data.clinical_status }
          assert:
