          amend is the cycle-closing action on the attendance machine: it must overwrite the day
          counters from the request, return the row to SUBMITTED and increment amendment_round to
          1 - not reset it, and not leave the row DISPUTED. The period-shape validations re-run on
          the amended figures, so an amendment whose days_enrolled + days_absent_unexcused exceeds
          the 28-day cycle is refused; the 20 + 2 supplied here passes.
