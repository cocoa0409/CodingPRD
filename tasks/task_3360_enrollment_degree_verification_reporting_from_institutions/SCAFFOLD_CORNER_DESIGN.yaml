          - entities.VerificationRequest.fields.result_status
        distinguishing_aspect: "A Learner TRANSCRIPT self-order has fee_cents 0 (pay always passes) and on RELEASED sets artifact_expires_at == released_at + ARTIFACT_TTL_HOURS(72): released at 2026-09-01T00:00:00Z yields artifact_expires_at 2026-09-04T00:00:00Z."
