            - "GroupSession.${gs_id}.reserved_count == 0"

      - name: empty_result_set_and_empty_norm_band_set_are_distinguished_on_finalize
        grounds:
          - validations[priority=14]
          - errors.ERR_NO_TEST_RESULTS
          - errors.ERR_NORM_BAND_UNAVAILABLE
          - calculations.performance_composite_percentile
          - entities.TestSession.fields.result_count
        distinguishing_aspect: |
          A third metric on a third endpoint: set cardinality at zero on
          POST /test-sessions/{test_session_id}/finalize. Two different empty sets must be
          told apart — zero result rows yields ERR_NO_TEST_RESULTS, while three result rows
          whose (sport, position, age) matches zero NORM_TABLE bands yields
          ERR_NORM_BAND_UNAVAILABLE. Neither may fall through to a composite of 0.0.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification)."
            - "One BASEBALL/PITCHER athlete born 2010-01-15 (age 16), CLEARED by an all-threes screen; NORM_TABLE holds no BASEBALL/PITCHER band at any age."
            - "TestSession E: PERFORMANCE_BATTERY, DRAFT, with no /results call ever made, so result_count is 0."
            - "TestSession F: PERFORMANCE_BATTERY, DRAFT, holding all three metric rows."
