      - name: an_offsite_spend_posting_of_one_hundred_cents_exhausts_the_plan_and_cascades_three_levels
        claim_type: cascading_side_effects
        grounds:
          - state_machines.BudgetPlan[ACTIVE->EXHAUSTED]
          - calculations.budget_plan_available
          - endpoints[POST /rmn/campaigns/{id}/offsite-reconciliation]
        distinguishing_aspect: "The plan is deliberately funded at 1000100 cents against a 1000000-cent reservation, so posting exactly 100 cents of partner-reported off-site spend drives available_cents to precisely 0 — the <= 0 boundary — and fires all three cascade levels in one request: plan ACTIVE -> EXHAUSTED, the DELIVERING campaign -> PAUSED, and its SERVING line item -> MANUAL_PAUSED with pause_reason BUDGET_EXHAUSTED. Slot occupancy must stay at 1 because MANUAL_PAUSED is still an occupying status, and reserved_cents must stay at 1000000 because PAUSED is still a reserving status."
        test_recipe:
          setup:
            - "SELF_SERVE advertiser ACTIVE with an APPROVED 2026-Q3 plan committed at 1000100 cents."
            - "An OFFSITE_ONLY campaign allocated 1000000 cents is DELIVERING on an OFFSITE display slot with one SERVING line item whose daily_budget_cents is 100."
