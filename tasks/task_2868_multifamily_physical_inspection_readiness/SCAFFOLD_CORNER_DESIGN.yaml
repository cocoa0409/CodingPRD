              captures: { d1_id: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "data.points_deducted == 16.00 and data.source == INSPECTION and data.status == OPEN"
            - "data.correction_due_at == 2026-10-10T10:00:00.000Z"
            - "data.inspection_version_after_record == ${v1} + 1"
            - "Inspection.${insp_id}.unit_area_points == 16.00 and Inspection.${insp_id}.total_points_deducted == 16.00"
            - "Inspection.${insp_id}.version == ${v1} + 1"
            - "Property.${prop_id}.open_severe_count == 1 and Property.${prop_id}.readiness_posture == READY"

