      - name: tiered_pricing_four_week_block_exact
        claim_type: rate_threshold_triggers
        grounds: [calculations.rental_charge, entities.RateCard.fields.four_week_rate_cents]
        distinguishing_aspect: "Exactly 28 billed days bills one four_week_rate_cents = 60000 (one whole 4-week block, zero weeks/days)."
        test_recipe:
          setup: ["Unit eu; rate card four_week 60000."]
          setup_api_calls:
            - call: "POST /rental-yard/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: YardManager
            - call: "POST /rental-yard/rate-cards"
              payload: { name: "Std", daily_rate_cents: 4000, weekly_rate_cents: 20000, four_week_rate_cents: 60000, deposit_cents: 50000, damage_waiver_daily_cents: 1500, fuel_refill_cents_per_liter: 200, cleaning_fee_cents: 8000, late_fee_multiplier: 1.5 }
