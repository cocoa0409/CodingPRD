            - "§1.5 declares no PUT, PATCH or DELETE route under /ipa/enrollment-files/{id}/rows"

      - name: create_physician_under_unknown_agreement_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PhysicianMember.parent
