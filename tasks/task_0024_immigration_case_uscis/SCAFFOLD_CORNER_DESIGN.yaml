            - call: "POST /uscis/cases/${case_id}/advance-review"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
            - call: "POST /uscis/cases/${case_id}/rfes"
              payload: { evidence_items_requested: ["doc_v"] }
              as: Officer
              as_user_id: "${officer_id}"
              captures: { rfe_id: $.data.id }
            - call: "GET /uscis/cases/${case_id}"
              payload: {}
              as: Officer
              as_user_id: "${officer_id}"
              captures: { case_v_current: $.data.version }
          trigger:
            - call: "POST /uscis/rfes/${rfe_id}/respond"
              payload: { expected_case_version: "${case_v_current} - 1", response_summary: "Deliberately stale version" }
