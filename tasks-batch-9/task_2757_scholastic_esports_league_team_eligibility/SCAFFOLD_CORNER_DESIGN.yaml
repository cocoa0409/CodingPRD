      - name: recruiting_window_is_half_open_so_a_contact_at_window_start_has_aged_out
        claim_type: threshold
        grounds:
          - calculations.recruiting_contact_quota
          - validations[priority=61]
          - entities.District.recruiting_window_days
          - entities.Student.recruiting_contact_log
        distinguishing_aspect: |
          With a cap of 2 and a 30-day window, two contacts logged at
          2026-08-01T00:00:00.000Z still count at 2026-08-30T23:59:59.999Z (window_start
          2026-07-31T23:59:59.999Z) and the third attempt is refused with 409
          ERR_RECRUITING_CONTACT_CAP_EXCEEDED. One millisecond later, at
          2026-08-31T00:00:00.000Z, window_start equals the contacts' contacted_at
          exactly and the half-open comparison (contacted_at > window_start) drops both,
          so the third contact is accepted. An implementation using >= counts them
          forever and never reopens the window.
          The refused attempt must not be appended to the log.
