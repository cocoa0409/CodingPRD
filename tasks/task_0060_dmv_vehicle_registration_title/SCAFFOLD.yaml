roles:
  - name: ClerkAgent
    description: "Counter agent driving VIN verification, title lifecycle, lien, registration activation, plate assignment, and REAL ID review."
    identity: opaque
    exclusive_operations:
      - "POST /vin-verifications"
      - "POST /title-applications/{id}/submit"
      - "POST /title-applications/{id}/approve"
      - "POST /title-applications/{id}/reject"
      - "POST /title-applications/{id}/issue"
      - "POST /liens/{id}/perfect"
      - "POST /registrations/{id}/activate"
      - "POST /license-plates"
      - "POST /license-plates/{id}/activate"
      - "POST /license-plates/{id}/deactivate"
      - "POST /real-id-applications/{id}/begin-review"
      - "POST /real-id-applications/{id}/approve"
      - "POST /real-id-applications/{id}/deny"
      - "POST /real-id-applications/{id}/return-for-documents"
    shared_operations:
      - "POST /owners, POST /vehicles, POST /title-applications, POST /liens, POST /registrations, POST /fee-assessments"
      - "POST /liens/{id}/release, POST /fee-assessments/{id}/pay, POST /real-id-applications"
      - "All GET endpoints"

  - name: InspectionStation
    description: "Inspection station that records emissions and salvage rebuild inspections."
    identity: opaque
    exclusive_operations:
      - "POST /emissions-inspections"
      - "POST /salvage-inspections"
    shared_operations:
      - "GET /emissions-inspections, GET /salvage-inspections"

  - name: Owner
    description: "Vehicle owner performing self-service reads, registration/title/REAL ID intake, and fee payment."
