            - call: "GET /consent-requests/${consent_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { final_status: $.data.status }
          assert:
            - "${denied_status} == DENIED and ${granted_at} == null and ${reason} == null (denial_reason is recorded in the audit fields, not as a revocation_reason)"
            - "${active_after_denial} == 0 (a denied consent never counted as active)"
            - "${err_grant} == ERR_INVALID_STATE with HTTP 409 and ${err_revoke} == ERR_INVALID_STATE with HTTP 409"
            - "${final_status} == DENIED (two refused transitions left the terminal state intact)"

