            - "${lf_v_stale} == 1 and ${cert0} == 0 before the cell is certified"
            - "${e_stale} == 'ERR_STALE_LANDFILL_VERSION' with HTTP 412, and GET /closure-cost-estimates reports total_count 0 — nothing was filed"
            - "${lf_v_fresh} == 2 and ${cert1} == 1000000 — the QA approval both moved the basis and bumped the version"
            - "${est_required} == 4742266.36 (closure 222601.86 for the single QA_CERTIFIED 120001 sf cell plus post-closure 4519664.50) and the estimate is 'DRAFT'"
            - "${lf_v_after} == 3 — the successful create itself increments Landfill.version"
            - "${e_stale2} == 'ERR_STALE_LANDFILL_VERSION' with HTTP 412: version 2 is already stale for the 2027 filing, so the OCC rung answers before the priority-20 duplicate-year rung is ever consulted"

      - name: host_agreement_execute_with_a_stale_landfill_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hca-execute-stale-landfill]
          - validations[priority=8]
          - errors[ERR_STALE_LANDFILL_VERSION]
          - endpoints[POST /host-community-agreements/{host_community_agreement_id}/execute]
        distinguishing_aspect: "The second OCC rule guards a different write on the same parent field: drafting the agreement does NOT touch Landfill.version, so the stale read is created by an unrelated cell certification, and the refused execute leaves the agreement in DRAFT with amendment_round still 0."
        test_recipe:
          setup:
            - "Landfill LF (version 1) with HostCommunityAgreement HCA-1 in DRAFT; drafting leaves the landfill version untouched."
            - "Cell C-1 is then driven to QA_CERTIFIED, moving Landfill.version to 2 behind the finance officer's back."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /host-community-agreements"
              payload: { landfill_id: "${lf_id}", community_name: "Ridgeview Township", posted_tipping_fee_per_ton: 42.50, host_fee_per_ton: 3.75, tier1_monthly_tons: 100, royalty_tier1_pct: 0.04, royalty_tier2_pct: 0.07, minimum_annual_payment: 250000, effective_from: "2026-01-01T00:00:00Z", expires_on: "2030-12-31T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca_id: $.data.id, hca_round: $.data.amendment_round }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v_stale: $.data.version }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa_id}/approve"
              payload: { certification_reference: "CQA-2026-01" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
          trigger:
            - call: "POST /host-community-agreements/${hca_id}/execute"
              payload: { expected_landfill_version: "${lf_v_stale}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { e_stale: $.data.error_id }
            - call: "GET /host-community-agreements/${hca_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca_state0: $.data.status, hca_round0: $.data.amendment_round }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v_fresh: $.data.version }
            - call: "POST /host-community-agreements/${hca_id}/execute"
              payload: { expected_landfill_version: "${lf_v_fresh}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca_state1: $.data.status }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { lf_v_after: $.data.version }
          assert:
            - "${lf_v_stale} == 1 and ${hca_round} == 0 — POST /host-community-agreements does not increment Landfill.version"
            - "${e_stale} == 'ERR_STALE_LANDFILL_VERSION' with HTTP 412"
            - "${hca_state0} == 'DRAFT' and ${hca_round0} == 0 — the refused execute applied none of its side effects"
            - "${lf_v_fresh} == 2 and the retry gives ${hca_state1} == 'EXECUTED'"
            - "${lf_v_after} == 3 — executing increments Landfill.version, so ${lf_v_fresh} is now stale in turn"

      - name: the_four_link_day_close_cascade_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.OperatingDay.OPEN_to_CLOSED
          - endpoints[POST /operating-days/{operating_day_id}/close]
        excluded_because:
          difficulty_instance: day_close_cascades_four_links_to_special_waste_suspension
          rationale: "That §1.8 instance already walks the whole four-link chain in order (day tonnage and density, Cell fill and ACTIVE -> FULL, Landfill ledger and SUSPENDED_NO_AIRSPACE, then APPROVED -> SUSPENDED special-waste approvals) and pins every intermediate field, which is exactly what the cascading_side_effects layer demands."

      - name: both_remaining_life_variants_are_produced_from_the_same_field_data
        claim_type: dual_variant_calculation
        grounds:
          - calculations.remaining_life_projection
          - endpoints[GET /landfills/{landfill_id}/remaining-life-projection]
        excluded_because:
          difficulty_instance: remaining_life_survey_based_vs_ledger_based_divergence
          rationale: "That §1.8 instance reads the projection under both variants on the same landfill and pins the delta plus the operating_status consequence at the 2.0-year restriction threshold; a separate corner test would repeat it verbatim."

      - name: the_cell_fill_threshold_fires_exactly_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Cell.ACTIVE_to_FULL
          - entities.Cell.fields.fill_pct
          - calculations.daily_airspace_consumption
        excluded_because:
          difficulty_instance: cell_full_at_exactly_98_00_percent_and_not_at_97_94
          rationale: "That §1.8 instance tests the cumulative fill trigger at 97.94 percent (no transition) and at exactly 98.00 percent (transition plus the landfill suspension), which is the boundary pair this layer asks for."

  - section: consistency_model
    instances:

      - name: qa_approval_side_effects_are_visible_in_the_very_next_read
        claim_type: immediate
        grounds:
          - endpoints[POST /liner-qa-packages/{liner_qa_package_id}/approve]
          - state_machines.LinerQaPackage.UNDER_REVIEW_to_APPROVED
          - calculations.remaining_life_projection
          - entities.Landfill.fields.certified_airspace_cy
        distinguishing_aspect: "The declared consistency model is immediate, so the derived Landfill ledger is recomputed inside the approving request itself: the approve response and the immediately following GET agree, with no second write and no settling delay. A deferred or job-based recomputation would leave certified_airspace_cy at 0 on the next read."
        test_recipe:
          setup:
            - "Landfill LF with Cell C-1 (design_airspace_cy 1000000, design_area_sf 120001) in CONSTRUCTION and LinerQaPackage QA-1 UNDER_REVIEW with a conformance score of 100.00."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa_id: $.data.id, qa_score: $.data.qa_conformance_score }
            - call: "POST /liner-qa-packages/${qa_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cert_before: $.data.certified_airspace_cy, life_before: $.data.remaining_life_years }
          trigger:
            - call: "POST /liner-qa-packages/${qa_id}/approve"
              payload: { certification_reference: "CQA-2026-01" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
              captures: { qa_state: $.data.status }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cert_after: $.data.certified_airspace_cy, rem_after: $.data.remaining_airspace_cy, life_after: $.data.remaining_life_years, assur_after: $.data.financial_assurance_status }
            - call: "GET /cells/${c1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c1_state: $.data.status }
            - call: "GET /landfills/${lf_id}/remaining-life-projection"
              payload: {}
              as: PlatformAdmin
              captures: { proj_variant: $.data.variant, proj_life: $.data.remaining_life_years }
          assert:
            - "${qa_score} == 100.00 and ${cert_before} == 0 with ${life_before} == 0.00 before the approval"
            - "${qa_state} == 'APPROVED' and ${c1_state} == 'QA_CERTIFIED' — cascade link 1 is applied inside the same request"
            - "${cert_after} == 1000000, ${rem_after} == 1000000.00 and ${life_after} == 3.00 (1000000 * 0.90 / 300000) on the very next read, with no intervening write"
            - "${assur_after} == 'UNFUNDED': cascade link 3 found no CERTIFIED estimate to stale, so link 4 did not fire"
            - "${proj_variant} == 'ledger_based' with ${proj_life} == 3.00 — the computed read and the stored derived field agree immediately"
