    instances:
      - name: halogen_screen_cascade_depth_3
        grounds:
          - state_machines.RouteStop.transitions.SCREENING_to_CANCELLED_HALOGEN
          - state_machines.Tank.transitions.CLEAR_to_QUARANTINED
          - entities.Customer.fields.halogen_violation_count
        distinguishing_aspect: |
          Depth-3 cascade triggered by SampleScreening FAIL_HALOGEN:
          screening -> RouteStop CANCELLED_HALOGEN -> Tank QUARANTINED ->
          Customer.halogen_violation_count += 1. Each link caused by previous.
        test_recipe:
