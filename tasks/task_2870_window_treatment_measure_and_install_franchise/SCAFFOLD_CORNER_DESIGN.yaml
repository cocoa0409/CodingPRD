            - "the captured ${o4_outcome} == COMPLETED and Opening.${o4}.install_outcome == INSTALLED; the true-up posted NO ledger row because Q2's installed basis 4960 equals its recognized 4960"
            - "the captured ${err_no_remake} == ERR_REMAKE_NOT_OFFERED (422): VA's NO_REMAKE policy refuses before any window or resolution question is asked"
            - "the captured ${err_resolved} == ERR_OPENINGS_ALREADY_RESOLVED (409): a FULL_CREDIT remake cannot un-install O4, and this is 47 days inside VC's window, so the window is not what refused it"
            - "the captured ${b_status} == PLACED with ${b_cost} == 2083, ${b_vendor} == 1041 (the FLOORED half) and ${b_terr} == 1042 (the remainder that carries the odd cent)"
            - "the captured ${b_promised} == 2026-08-26: the clock is at 2026-08-20T13:00Z, hour 13 is below VB's cutoff 15 so the effective date is 2026-08-20, and the expedited lead is 10 - 4 = 6 days"
            - "that remake posted LedgerEntry(REMAKE_CHARGEBACK, amount_cents 1042, basis_cents 2083) and Territory.${t1}.remake_chargeback_cents == 1042"
            - "after the clock moves to 2026-11-06 the captured ${err_window} == ERR_REMAKE_WINDOW_CLOSED (409): 97 days have passed since VC received order C, which is more than VENDOR_REMAKE_WINDOW_DAYS 90, and order C is still RECEIVED so no earlier state gate could have fired"
            - "at that same instant the captured ${d_status} == PLACED with ${d_terr} == 1042 and ${d_promised} == 2026-11-12 (hour 10 < cutoff 15, so effective 2026-11-06 plus the expedited 6 days) - SHARED_50_50 has no window, which is the whole point of the pair"
            - "Territory.${t1}.remake_chargeback_cents == 2084 and GET /blinds/territories/${t1}/ledger-entries returns total_count 4: NET_SALES_ROYALTY 818, NET_SALES_ROYALTY 273 and two REMAKE_CHARGEBACK 1042 rows"
            - "royalty is untouched by remakes that replace rather than credit: Territory.${t1}.royalty_accrued_cents == 1091 and net_sales_cents == 19840"
            - "the refusals wrote nothing: VendorOrder.${ord_a}.remake_count == 0 and status RECEIVED, VendorOrder.${ord_c}.remake_count == 0 and status RECEIVED"
            - "and the accepted pair did: VendorOrder.${ord_b}.remake_count == 1, VendorOrder.${ord_d}.remake_count == 1, Territory.${t1}.open_order_exposure_cents == 4166 and Vendor.${vb}.open_order_count == 2"

      - name: every_gate_satisfied_at_its_exact_boundary_still_passes
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_8_ERR_VALUE_OUT_OF_RANGE
          - validations.priority_35_ERR_INSUFFICIENT_MOUNT_DEPTH
          - validations.priority_34_ERR_CORD_HAZARD_NOT_PERMITTED
          - validations.priority_49_ERR_CREDIT_LIMIT_EXCEEDED
          - calculations.opening_list_price
        distinguishing_aspect: "A single happy path in which SIX independent gates are each satisfied at the exact value where one more unit would fail: royalty rate 0.1500 (the maximum), lead capacity 1 with 0 leads open, inside depth exactly 2.500, a cordless lift in a child-occupied dwelling, an opening whose ordered width falls below the 12.000 billable floor, a vendor at exactly its capacity of 1, and an order cost that exactly equals the territory's credit limit. Satisfaction must produce 201s and correct derived figures, not near-miss refusals."
        test_recipe:
          setup:
            - "Territory created with royalty_rate_pct 0.1500 (the maximum), lead_capacity_per_week 1 and credit_limit_cents 1016."
            - "One designer, and one vendor supporting CORDLESS with concurrent_capacity 1."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"], royalty_rate_pct: 0.1500, lead_capacity_per_week: 1, credit_limit_cents: 1016 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id, rate: $.data.royalty_rate_pct }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/vendors"
              payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 1, supported_lift_systems: ["CORDLESS"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { v1: $.data.id }
          trigger:
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z", child_occupied_dwelling: true }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id, l1_status: $.data.status, l1_terr: $.data.territory_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Transom", room_type: "BATH", mount_type: "INSIDE", width_top_in: 12.375, width_middle_in: 12.375, width_bottom_in: 12.375, height_left_in: 12.250, height_center_in: 12.250, height_right_in: 12.250, depth_in: 2.500 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id, ow: $.data.ordered_width_in, oh: $.data.ordered_height_in }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDLESS" }
              as: Designer
              as_user_id: "${d1}"
              captures: { sqft: $.data.billable_sqft, price: $.data.list_price_cents }
            - call: "GET /blinds/consultations/${c1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { cv1: $.data.version }
            - call: "POST /blinds/quotes"
              payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
              as: Designer
              as_user_id: "${d1}"
              captures: { q1: $.data.id, sub: $.data.subtotal_cents, fee: $.data.install_fee_cents, total: $.data.total_cents }
            - call: "POST /blinds/quotes/${q1}/present"
              as: Designer
              as_user_id: "${d1}"
              captures: { presented: $.data.status }
            - call: "POST /blinds/quotes/${q1}/accept"
              as: Designer
              as_user_id: "${d1}"
              captures: { qv1: $.data.version, accepted: $.data.status }
            - call: "POST /blinds/vendor-orders"
              payload: { quote_id: "${q1}", opening_ids: ["${o1}"], expected_quote_version: "${qv1}", preferred_vendor_id: "${v1}" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { ord1: $.data.id, cost: $.data.order_cost_cents, promised: $.data.promised_ship_date }
          assert:
            - "the captured ${rate} == 0.1500 - the maximum rate is accepted, where 0.1501 would be ERR_VALUE_OUT_OF_RANGE"
            - "the captured ${l1_status} == ROUTED with ${l1_terr} == ${t1}: open_leads_count 0 is strictly below lead_capacity_per_week 1, so the lead routes rather than queueing"
            - "the opening is created with depth_in exactly MIN_INSIDE_DEPTH_IN, and the captured ${ow} == 11.875 (12.375 - 0.500, floored to the eighth) and ${oh} == 12.000 (12.250 - 0.250)"
            - "the captured ${sqft} == 1.000: the 11.875 ordered width is raised to the 12.000 billable floor, 12.000 x 12.000 / 144 is exactly 1, and the quarter-sqft ceiling is a no-op"
            - "the captured ${price} == 2420 (1.000 sqft x 620 + CORDLESS 1800 + motor 0, no oversize surcharge)"
            - "the captured ${sub} == 2420, ${fee} == 10000 (7500 + 2500 x 1 + 0) and ${total} == 12420 - a pre-discount total of 12420 is below the first tier, so discount_cents is 0"
            - "the captured ${presented} == PRESENTED and ${accepted} == ACCEPTED: a CORDLESS lift satisfies the child-safety rule for a dwelling with child_occupied_dwelling true, where CORDED would be ERR_CORD_HAZARD_NOT_PERMITTED on both transitions"
            - "acceptance posted LedgerEntry(NET_SALES_ROYALTY, amount_cents 363, basis_cents 2420) - round_half_up(2420 x 0.1500) == 363 exactly"
            - "the captured ${cost} == 1016 (round_half_up(2420 x 0.42) = 1016.4 -> 1016), which is EXACTLY credit_limit_cents, so the placement passes: the rule refuses only exposure PAST the limit"
            - "the captured ${promised} == 2026-08-11 (clock 2026-08-01T00:00Z, hour 0 < cutoff 15, base lead 10 days) and the vendor sits at exactly its concurrent_capacity of 1"
            - "Territory.${t1}.open_order_exposure_cents == 1016 == credit_limit_cents, and Vendor.${v1}.open_order_count == 1"

      - name: corner_credit_limit_is_an_aggregate_over_open_exposure
        claim_type: Aggregate validation
        grounds:
          - validations.priority_49_ERR_CREDIT_LIMIT_EXCEEDED
          - entities.Territory.fields.credit_limit_cents
          - entities.Territory.fields.open_order_exposure_cents
        excluded_because:
          difficulty_instance: vendor_capacity_conflict_outranks_credit_limit_on_the_same_placement
          rationale: "The aggregate credit-limit check - open exposure summed across every PLACED and SHIPPED order of the territory versus credit_limit_cents, with the strictly-greater boundary - is exercised there as the loser of a priority pair against ERR_VENDOR_CAPACITY_EXCEEDED, and its exact satisfaction boundary is covered by every_gate_satisfied_at_its_exact_boundary_still_passes above. A third aggregate instance would restate both."

      - name: corner_quote_expiry_is_a_temporal_gate_on_a_presented_quote
        claim_type: Temporal validation
        grounds:
          - validations.priority_15_ERR_QUOTE_EXPIRED
          - calculations.quote_expiry_window
        excluded_because:
          difficulty_instance: quote_expiry_instant_is_closed_on_the_expired_side_and_restarts_on_revision
          rationale: "ERR_QUOTE_EXPIRED's closed boundary at expires_at, its lazy evaluation by the next business request and the restart of the window on revision are all pinned there to the millisecond. There is no residual corner: the rule reads one stored instant against the logical clock and nothing else."

      - name: corner_quote_creation_requires_a_configured_opening
        claim_type: Violation → Error
        grounds:
          - validations.priority_25_ERR_QUOTE_HAS_NO_OPENINGS
          - endpoints.POST_blinds_quotes
        excluded_because:
          difficulty_instance: quote_creation_needs_exactly_one_configured_opening_not_zero
          rationale: "ERR_QUOTE_HAS_NO_OPENINGS is exercised there at its exact boundary - zero CONFIGURED openings refuses even when MEASURED openings exist, and exactly one succeeds - which is the whole content of the rule."

      - name: corner_cord_hazard_versus_quote_state_on_two_endpoints
        claim_type: Priority conflict
        grounds:
          - validations.priority_34_ERR_CORD_HAZARD_NOT_PERMITTED
          - validations.priority_17_ERR_QUOTE_NOT_PRESENTED
        excluded_because:
          difficulty_instance: accept_reports_quote_state_before_cord_hazard_while_present_reports_the_hazard
          rationale: "The interesting part of ERR_CORD_HAZARD_NOT_PERMITTED is that the same hazard surfaces on POST /present but is masked by ERR_QUOTE_NOT_PRESENTED on POST /accept, which is exactly the hazard pair built there. Its satisfaction side is covered above by the CORDLESS happy path."

      - name: corner_designer_calendar_buffer_is_a_pairwise_interval_test
        claim_type: Temporal validation
        grounds:
          - validations.priority_42_ERR_DESIGNER_CALENDAR_CONFLICT
          - calculations.designer_calendar_conflict_set
        excluded_because:
          difficulty_instance: designer_calendar_is_half_open_with_a_conditional_travel_buffer
          rationale: "ERR_DESIGNER_CALENDAR_CONFLICT's half-open geometry, the conditional 45-minute buffer between different postal codes and the mixing of consultations with install jobs on one calendar are pinned there at the 44:59.999 / 45:00.000 boundary. Re-deriving them here would add no distinct failure mode."

  # -------------------------------------------------------------------
  # Guide section 5 - Endpoints (Table 5)
  # -------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: the_envelope_carries_both_response_types_and_the_pagination_block
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - response_envelope.pagination_defaults
        distinguishing_aspect: "One entity's whole read surface in a single instance: a 201 create, a 200 single read, a 200 list and a 404, checked for the ENVELOPE rather than the business content - response_type object versus array, the meta block on every one of them including the error, the four pagination fields with their declared defaults, and has_more flipping on the offset walk."
        test_recipe:
          setup:
            - "One ACTIVE territory with three sample kits, so a list of three rows can be paged with limit 2."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "SHEERS-A", replacement_value_cents: 50000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k1: $.data.id, k1_type: $.response_type, k1_req: $.meta.api_request_id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "LINENS-B", replacement_value_cents: 42000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k2: $.data.id }
            - call: "POST /blinds/sample-kits"
              payload: { territory_id: "${t1}", kit_code: "WOODS-C", replacement_value_cents: 61000 }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { k3: $.data.id }
            - call: "GET /blinds/sample-kits/${k1}"
              as: Designer
              as_user_id: "${t1}"
              captures: { read_id: $.data.id, read_type: $.response_type }
            - call: "GET /blinds/sample-kits?territory_id=${t1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { list_type: $.response_type, first_kit: "$.data[0].id" }
            - call: "GET /blinds/sample-kits?territory_id=${t1}&limit=2&offset=0"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /blinds/sample-kits?territory_id=${t1}&limit=2&offset=2"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /blinds/sample-kits/11111111-1111-4111-8111-111111111111"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_id: $.data.error_id, err_type: $.response_type }
          assert:
            - "the create answers 201 with the captured ${k1_type} == object and a non-empty ${k1_req} - meta.api_request_id and meta.api_request_timestamp are present on a write as well as a read"
            - "the captured ${read_id} == ${k1} and ${read_type} == object: a single-resource GET puts the row itself under data, not a one-element array"
            - "the captured ${list_type} == array, the captured ${first_kit} is one of the three kit ids, and the four pagination fields carry their declared defaults: limit 10, offset 0, total_count 3, has_more false"
            - "the first page answers has_more true with total_count 3 - total_count is the size of the FILTERED collection, not of the returned page - and the captured ${p1_first} is its first row"
            - "the second page answers has_more false with total_count 3 and carries exactly one row, whose id ${p2_first} differs from ${p1_first} - the walk visits ${k1}, ${k2} and ${k3} once each with no repeats"
            - "the captured ${err_id} == ERR_SAMPLE_KIT_NOT_FOUND with ${err_type} == error and a message string alongside it, and the error body still carries its meta block"
            - "no read mutated anything: GET /blinds/sample-kits?territory_id=${t1}&status=AVAILABLE still returns total_count 3"

      - name: the_territory_read_is_a_pure_projection_of_nine_derived_counters
        claim_type: Computed read
        grounds:
          - entities.Territory.fields.net_sales_cents
          - entities.Territory.fields.royalty_accrued_cents
          - entities.Territory.fields.open_order_exposure_cents
          - entities.Territory.fields.open_leads_count
          - entities.Territory.fields.available_kit_count
          - calculations.sample_loan_conservation
        distinguishing_aspect: "A single GET is asked to reconcile nine independently-maintained aggregates after one mixed sequence: money (net sales, accrued royalty, chargebacks), work in flight (open exposure, open leads) and inventory (available / on loan / lost kits). The read must be a projection with no side effects - repeating it returns byte-identical figures - and every counter must be consistent with the rows the sequence actually created."
        test_recipe:
            setup:
              - "One ACTIVE territory (defaults: royalty 0.055, capacity 5, credit limit 2000000) with two sample kits, one of which is on loan."
              - "One ROUTED lead, one SCHEDULED consultation, two LT-SHEER / CORDED openings at 4960 each on an ACCEPTED quote (subtotal 9920, fee 12500, total 22420, net 9920, royalty 546)."
              - "One vendor order over BOTH openings, still PLACED, cost round_half_up(9920 x 0.42) = 4166."
            setup_api_calls:
              - call: "POST /blinds/territories"
                payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
                as: Franchisor
                as_user_id: "hq-ops"
                captures: { t1: $.data.id }
              - call: "POST /blinds/designers"
                payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
                as: Franchisee
                as_user_id: "${t1}"
                captures: { d1: $.data.id }
              - call: "POST /blinds/sample-kits"
                payload: { territory_id: "${t1}", kit_code: "SHEERS-A", replacement_value_cents: 50000 }
                as: Franchisee
                as_user_id: "${t1}"
                captures: { k1: $.data.id }
              - call: "POST /blinds/sample-kits"
                payload: { territory_id: "${t1}", kit_code: "LINENS-B", replacement_value_cents: 42000 }
                as: Franchisee
                as_user_id: "${t1}"
                captures: { k2: $.data.id }
              - call: "POST /blinds/vendors"
                payload: { name: "Ridgeline Shade Works", base_lead_time_days: 10, motorization_extra_days: 3, cutoff_hour_utc: 15, remake_policy: "SHARED_50_50", concurrent_capacity: 5, supported_lift_systems: ["CORDED"] }
                as: Franchisor
                as_user_id: "hq-ops"
                captures: { v1: $.data.id }
              - call: "POST /blinds/leads"
                payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
                as: Franchisee
                as_user_id: "${t1}"
                captures: { l1: $.data.id }
              - call: "POST /blinds/consultations"
                payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
                as: Designer
                as_user_id: "${d1}"
                captures: { c1: $.data.id }
              - call: "POST /blinds/sample-checkouts"
                payload: { sample_kit_id: "${k1}", consultation_id: "${c1}", hold_start_at: "2026-08-02T09:00:00.000Z", hold_end_at: "2026-08-05T17:00:00.000Z" }
                as: Designer
                as_user_id: "${d1}"
                captures: { co1: $.data.id }
              - call: "POST /blinds/openings"
                payload: { consultation_id: "${c1}", label: "Left", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
                as: Designer
                as_user_id: "${d1}"
                captures: { o1: $.data.id }
              - call: "POST /blinds/openings"
                payload: { consultation_id: "${c1}", label: "Right", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
                as: Designer
                as_user_id: "${d1}"
                captures: { o2: $.data.id }
              - call: "PATCH /blinds/openings/${o1}/configuration"
                payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
                as: Designer
                as_user_id: "${d1}"
              - call: "PATCH /blinds/openings/${o2}/configuration"
                payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
                as: Designer
                as_user_id: "${d1}"
              - call: "GET /blinds/consultations/${c1}"
                as: Designer
                as_user_id: "${d1}"
                captures: { cv1: $.data.version }
              - call: "POST /blinds/quotes"
                payload: { consultation_id: "${c1}", expected_consultation_version: "${cv1}" }
                as: Designer
                as_user_id: "${d1}"
                captures: { q1: $.data.id }
              - call: "POST /blinds/quotes/${q1}/present"
                as: Designer
                as_user_id: "${d1}"
              - call: "POST /blinds/quotes/${q1}/accept"
                as: Designer
                as_user_id: "${d1}"
