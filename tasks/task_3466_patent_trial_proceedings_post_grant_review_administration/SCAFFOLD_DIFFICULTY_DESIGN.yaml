              as: PlatformAdmin
              captures: { o11_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000011", title: "Bearing", issue_date: "2021-01-01T00:00:00Z", owner_id: "${o11_id}", total_claims: 4 }
              as: PlatformAdmin
              captures: { pat11_v: $.data.version }
          trigger:
            - call: "POST /ptab/petitions"
              payload: { patent_id: "00000000-0000-0000-0000-000000000000", petitioner_id: "${p11_id}", review_type: "IPR", challenged_claims: [1], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US1515151" }], real_party_in_interest: "P11 Corp", fee_paid_cents: 0, expected_patent_version: "${pat11_v}" }
              as: Petitioner
              as_user_id: "${p11_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PATENT_NOT_FOUND (existence, priority 3)"
            - "error_id != ERR_FEE_INSUFFICIENT even though fee_paid_cents 0 is below the required 1900000 (business_fiscal, priority 10)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: petition_time_bar_exactly_365_days_allowed_366_barred
        grounds:
          - calculations.petition_time_bar
          - errors[ERR_PETITION_TIME_BARRED]
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: whole days between complaint service and petition filing, at
          POST /ptab/petitions. The bar is strictly-greater-than 365: a petition
          filed exactly 365 days after service (2025-09-01 -> 2026-09-01) is
          accepted, while 366 days (2025-08-31 -> 2026-09-01) is barred.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Petitioners PA (defendant in matter served 2025-09-01T00:00:00Z) and PB (defendant in matter served 2025-08-31T00:00:00Z); owner O12; patent (4 claims) with both litigation matters docketed."
