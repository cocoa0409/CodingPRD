# =============================================================================
# Scaffold: Scuba Dive Shop & Certification (PADI style)
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  464. Scuba Dive Shop & Certification (PADI style): course (Open Water/Advanced)
  & e-learning, pool/open-water session scheduling, instructor ratio &
  certification-card issuance, equipment rental & air/nitrox fill, dive
  trip/charter booking, medical & liability waiver, gear service (VIP/hydro),
  rental deposit

domain_name: scuba-dive-certification
api_prefix: /

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # flat: Diver/Instructor/Course/DiveTrip/Boat are peer top-level resources;
  # Enrollment, Session, SessionBooking, TripBooking, RentalAgreement,
  # FillService, GearServiceOrder, CertificationCard, Waiver reference parents
  # by foreign key in the body rather than via nested URL ownership.
  state_machine_shape: branching
  # branching: Enrollment forks ACTIVE->{ELIGIBLE,WITHDRAWN}; RentalAgreement
  # forks ACTIVE->{RETURNED,VOIDED}; Session forks SCHEDULED->{COMPLETED,CANCELLED}
  # with divergent side-effect sets per branch. Reverts present (ELIGIBLE->ACTIVE).
  relationship_patterns:
    - one_to_many        # Course -> Session, Course -> Enrollment, Diver -> Enrollment
    - many_to_many       # SessionBooking (Enrollment x Session), TripBooking (Diver x DiveTrip)
    - cross_aggregate    # SessionBooking reads Enrollment+Session+Instructor; TripBooking reads Diver+DiveTrip+Boat
  role_model: peer_roles
  # ShopAdmin operates shop inventory/courses/trips; Instructor records session
  # attendance and grades; Diver enrolls and books. Non-overlapping ownership.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Diver
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Diver legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique per diver" }
      - { name: cert_level, type: enum, source: computed, description: "Highest certification held: NONE | OPEN_WATER | ADVANCED. Starts NONE; upgraded only by CertificationCard issuance.", default: "NONE", constraints: "NONE | OPEN_WATER | ADVANCED" }
      - { name: nitrox_certified, type: boolean, source: computed, description: "True once a CertificationCard with specialty=ENRICHED_AIR has been issued to this diver.", default: false }
      - { name: medical_status, type: enum, source: computed, description: "Derived from the diver's latest Waiver: CLEAR if latest active waiver has medical_flagged=false, RESTRICTED if medical_flagged=true, UNKNOWN if no active waiver.", default: "UNKNOWN", constraints: "UNKNOWN | CLEAR | RESTRICTED" }
      - { name: deposit_on_hold_cents, type: integer, source: computed, description: "Conserved-quantity ledger: sum of deposit_cents over this diver's RentalAgreements whose status==ACTIVE. Recomputed on every rental checkout/checkin/void.", default: 0 }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: rating, type: enum, source: input, description: "Professional rating: DIVEMASTER | INSTRUCTOR. INSTRUCTOR may lead Sessions and grade; DIVEMASTER may only be assigned as an assistant.", constraints: "DIVEMASTER | INSTRUCTOR" }
      - { name: active_session_count, type: integer, source: computed, description: "Count of Sessions where this instructor is primary_instructor_id and status==SCHEDULED.", default: 0 }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: course_type, type: enum, source: input, description: "OPEN_WATER (entry) | ADVANCED. Determines required session counts and certification level granted.", constraints: "OPEN_WATER | ADVANCED" }
      - { name: required_pool_sessions, type: integer, source: input, description: "Number of distinct POOL sessions a diver must attend to be cert-eligible.", constraints: ">= 0" }
      - { name: required_open_water_sessions, type: integer, source: input, description: "Number of distinct OPEN_WATER sessions a diver must attend to be cert-eligible.", constraints: ">= 1" }
      - { name: price_cents, type: integer, source: input, description: "Course tuition in cents", constraints: "> 0" }
      - { name: grants_specialty, type: enum, source: input, description: "Optional specialty the issued card carries: NONE | ENRICHED_AIR.", default: "NONE", constraints: "NONE | ENRICHED_AIR" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: diver_id, type: string, source: input, description: "FK -> Diver.id; the enrolled diver" }
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course enrolled in" }
      - { name: status, type: enum, source: system, description: "Lifecycle state.", default: "ACTIVE", constraints: "ACTIVE | ELIGIBLE | COMPLETED | WITHDRAWN" }
      - { name: elearning_pct, type: integer, source: input, description: "E-learning completion percentage 0..100, set via the e-learning progress endpoint.", default: 0, constraints: "0 <= elearning_pct <= 100" }
      - { name: pool_sessions_attended, type: integer, source: computed, description: "Count of distinct POOL Sessions this enrollment has an ATTENDED SessionBooking for.", default: 0 }
      - { name: open_water_sessions_attended, type: integer, source: computed, description: "Count of distinct OPEN_WATER Sessions this enrollment has an ATTENDED SessionBooking for.", default: 0 }
      - { name: completion_pct, type: integer, source: computed, description: "Weighted completion score (see calculations.enrollment_completion_pct).", default: 0 }
      - { name: certification_card_id, type: string, source: computed, description: "Back-reference to the issued CertificationCard.id (the canonical FK is CertificationCard.enrollment_id; discover the card via GET /certification-cards?enrollment_id=). Null until COMPLETED.", default: null }

  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id; the course this session belongs to" }
      - { name: session_type, type: enum, source: input, description: "POOL (confined water) | OPEN_WATER (training dive). Drives the instructor-ratio formula and which attendance counter increments.", constraints: "POOL | OPEN_WATER" }
      - { name: primary_instructor_id, type: string, source: input, description: "FK -> Instructor.id; must have rating==INSTRUCTOR" }
      - { name: assistant_count, type: integer, source: input, description: "Number of DIVEMASTER assistants attached to this session; widens the ratio cap.", default: 0, constraints: ">= 0" }
      - { name: starts_at, type: datetime, source: input, description: "Session window start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Session window end (ISO 8601 UTC); must be > starts_at" }
      - { name: max_students, type: integer, source: computed, description: "Instructor-ratio capacity (see calculations.instructor_ratio_capacity).", default: 0 }
      - { name: confirmed_seats, type: integer, source: computed, description: "Conserved-quantity counter: count of SessionBookings on this session with status==BOOKED.", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle.", default: "SCHEDULED", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: SessionBooking
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; the booked session" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment claiming the seat" }
      - { name: status, type: enum, source: system, description: "BOOKED on hold; ATTENDED when instructor records attendance; CANCELLED on release; NO_SHOW if session completes without attendance.", default: "BOOKED", constraints: "BOOKED | ATTENDED | CANCELLED | NO_SHOW" }

  - name: CertificationCard
    parent: null
    common_fields: false
    fields:
      - { name: diver_id, type: string, source: system, description: "FK -> Diver.id; the certified diver" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the enrollment that produced this card" }
      - { name: level, type: enum, source: system, description: "Certification level granted: OPEN_WATER | ADVANCED (mirrors the course_type).", constraints: "OPEN_WATER | ADVANCED" }
      - { name: specialty, type: enum, source: system, description: "NONE | ENRICHED_AIR (from Course.grants_specialty).", constraints: "NONE | ENRICHED_AIR" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }

  - name: Waiver
    parent: null
    common_fields: false
    fields:
      - { name: diver_id, type: string, source: input, description: "FK -> Diver.id; signer" }
      - { name: medical_flagged, type: boolean, source: input, description: "True if the medical questionnaire flagged a condition requiring physician sign-off.", constraints: "true | false" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock instant the waiver was signed" }
      - { name: expires_at, type: datetime, source: system, description: "signed_at + WAIVER_VALID_DAYS (see calculations.waiver_expiry). A waiver is active when current clock < expires_at and it is the diver's latest waiver." }

  - name: Boat
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Charter vessel name" }
      - { name: capacity, type: integer, source: input, description: "Maximum divers per charter trip on this boat", constraints: "> 0" }
      - { name: turnaround_minutes, type: integer, source: input, description: "Mandatory buffer (minutes) required between two trips on this boat.", default: 60, constraints: ">= 0" }

  - name: DiveTrip
    parent: null
    common_fields: true
    fields:
      - { name: boat_id, type: string, source: input, description: "FK -> Boat.id; the vessel running this charter" }
      - { name: starts_at, type: datetime, source: input, description: "Trip departure (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Trip return (ISO 8601 UTC); must be > starts_at" }
      - { name: min_cert_level, type: enum, source: input, description: "Minimum diver cert_level required to book: OPEN_WATER | ADVANCED.", constraints: "OPEN_WATER | ADVANCED" }
      - { name: base_fare_cents, type: integer, source: input, description: "Per-diver fare in cents before add-ons/discount", constraints: "> 0" }
      - { name: fill_addon_cents, type: integer, source: input, description: "Per-tank fill add-on price applied when a booking requests tank rental", constraints: ">= 0" }
      - { name: confirmed_divers, type: integer, source: computed, description: "Count of TripBookings on this trip with status==CONFIRMED.", default: 0 }
      - { name: status, type: enum, source: system, description: "Lifecycle.", default: "OPEN", constraints: "OPEN | DEPARTED | CANCELLED" }

  - name: TripBooking
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> DiveTrip.id; the booked charter" }
      - { name: diver_id, type: string, source: input, description: "FK -> Diver.id; the diver booking the trip" }
      - { name: tanks, type: integer, source: input, description: "Number of fill add-ons requested with this booking.", default: 0, constraints: ">= 0" }
      - { name: party_size, type: integer, source: input, description: "Number of divers in the booking party (drives the group discount).", default: 1, constraints: ">= 1" }
      - { name: total_cents, type: integer, source: computed, description: "Computed fare for this booking (see calculations.trip_booking_total)." }
      - { name: deposit_cents, type: integer, source: computed, description: "Deposit collected at booking (see calculations.trip_booking_total)." }
      - { name: balance_due_cents, type: integer, source: computed, description: "total_cents - deposit_cents; cleared on DEPARTED." }
      - { name: status, type: enum, source: system, description: "Lifecycle.", default: "CONFIRMED", constraints: "CONFIRMED | CANCELLED | DEPARTED" }

  - name: RentalAgreement
    parent: null
    common_fields: true
    fields:
      - { name: diver_id, type: string, source: input, description: "FK -> Diver.id; renter" }
      - { name: item_description, type: string, source: input, description: "Rented gear description (e.g. 'BCD + regulator set')" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Per-day rental rate in cents", constraints: "> 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Security deposit held during rental", constraints: ">= 0" }
      - { name: checkout_at, type: datetime, source: system, description: "Logical-clock instant the gear left the shop (set at checkout)" }
      - { name: scheduled_return_at, type: datetime, source: input, description: "Planned return time (ISO 8601 UTC); drives the estimated charge" }
      - { name: actual_return_at, type: datetime, source: system, description: "Logical-clock instant of check-in; null while ACTIVE" }
      - { name: damage_fee_cents, type: integer, source: input, description: "Damage assessment charged at check-in.", default: 0, constraints: ">= 0" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Charge projected at checkout (see calculations.rental_charge variant=estimated)." }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Charge finalized at check-in (see calculations.rental_charge variant=actual); null while ACTIVE." }
      - { name: deposit_refund_cents, type: integer, source: computed, description: "Deposit returned at check-in (see calculations.rental_settlement); null while ACTIVE." }
      - { name: status, type: enum, source: system, description: "Lifecycle.", default: "ACTIVE", constraints: "ACTIVE | RETURNED | VOIDED" }

  - name: FillService
    parent: null
    common_fields: true
    fields:
      - { name: diver_id, type: string, source: input, description: "FK -> Diver.id; tank owner being served" }
      - { name: gas, type: enum, source: input, description: "AIR | NITROX. NITROX requires the diver to be nitrox_certified.", constraints: "AIR | NITROX" }
      - { name: o2_pct, type: integer, source: input, description: "Oxygen percentage; required and 22..40 for NITROX, must be 21 for AIR.", constraints: "AIR: == 21; NITROX: 22 <= o2_pct <= 40" }
      - { name: tank_capacity_liters, type: integer, source: input, description: "Tank water capacity in liters; >12 applies the large-tank price factor.", constraints: "> 0" }
      - { name: price_cents, type: integer, source: computed, description: "Fill price (see calculations.fill_price)." }

  - name: GearServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: diver_id, type: string, source: input, description: "FK -> Diver.id; equipment owner" }
      - { name: service_type, type: enum, source: input, description: "VIP (visual inspection, annual) | HYDRO (hydrostatic test, 5-yearly).", constraints: "VIP | HYDRO" }
      - { name: serviced_at, type: datetime, source: system, description: "Logical-clock instant the service was completed (set when status->COMPLETED)" }
      - { name: next_due_at, type: datetime, source: computed, description: "serviced_at + interval (VIP: VIP_INTERVAL_DAYS; HYDRO: HYDRO_INTERVAL_DAYS); null while OPEN." }
      - { name: status, type: enum, source: system, description: "Lifecycle.", default: "OPEN", constraints: "OPEN | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Enrollment
    field: status
    initial_state: ACTIVE
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: ELIGIBLE
        trigger: "POST /enrollments/{id}/recompute-eligibility, or auto-evaluated as a side effect when attendance is recorded or e-learning progress is set"
        actor: system
        preconditions:
          - "elearning_pct == 100"
          - "pool_sessions_attended >= course.required_pool_sessions"
          - "open_water_sessions_attended >= course.required_open_water_sessions"
          - "Diver has an active Waiver (current clock < waiver.expires_at and it is the diver's latest)"
          - "Diver.medical_status == CLEAR"
        side_effects:
          - "completion_pct recomputed (calculations.enrollment_completion_pct) == 100"
      - from: ELIGIBLE
        to: ACTIVE
        trigger: "system (a previously satisfied prerequisite is invalidated: an ATTENDED SessionBooking is cancelled by Session cancellation, or the diver's waiver expires)"
        actor: system
        preconditions:
          - "Enrollment.status == ELIGIBLE and at least one eligibility precondition no longer holds"
        side_effects:
          - "completion_pct recomputed (calculations.enrollment_completion_pct) < 100"
        note: "Revert edge — keeps cert issuance honest after a session is cancelled."
      - from: ELIGIBLE
        to: COMPLETED
        trigger: "POST /enrollments/{id}/issue-certification"
        actor: ShopAdmin
        preconditions:
          - "Enrollment.status == ELIGIBLE"
          - "expected_enrollment_version matches Enrollment.version"
        side_effects:
          - "Creates a CertificationCard (level = course.course_type, specialty = course.grants_specialty, issued_at = clock)"
          - "Enrollment.certification_card_id set to the new card id"
          - "CASCADE: Diver.cert_level upgraded to course.course_type if higher than current; this Diver mutation in turn recomputes Diver.nitrox_certified (true if card.specialty==ENRICHED_AIR)"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: "Diver or ShopAdmin"
        preconditions:
          - "Enrollment.status == ACTIVE"
        side_effects:
          - "All this enrollment's SessionBookings with status==BOOKED -> CANCELLED (releasing seats: each owning Session.confirmed_seats decremented)"
      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /enrollments/{id}/withdraw"
        actor: "Diver or ShopAdmin"
        preconditions:
          - "Enrollment.status == ELIGIBLE"
        side_effects:
          - "All this enrollment's SessionBookings with status==BOOKED -> CANCELLED (releasing seats)"

  - entity: Session
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: Instructor
        preconditions:
          - "Session.status == SCHEDULED"
          - "Acting instructor is the session's primary_instructor_id"
          - "current clock >= Session.starts_at"
        side_effects:
          - "Every SessionBooking with status==BOOKED that was NOT recorded ATTENDED -> NO_SHOW"
          - "Instructor.active_session_count decremented"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: ShopAdmin
        preconditions:
          - "Session.status == SCHEDULED"
        side_effects:
          - "CASCADE depth 3: Session cancelled -> every SessionBooking on it with status IN {BOOKED, ATTENDED} -> CANCELLED (Session.confirmed_seats -> 0); each cancelled booking that was ATTENDED in turn decrements its Enrollment's attendance counter and recomputes completion_pct; an Enrollment that was ELIGIBLE and now fails a prerequisite reverts ELIGIBLE -> ACTIVE"
          - "Instructor.active_session_count decremented"

  - entity: SessionBooking
    field: status
    initial_state: BOOKED
    terminal_states: [CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: ATTENDED
        trigger: "POST /session-bookings/{id}/attend"
        actor: Instructor
        preconditions:
          - "SessionBooking.status == BOOKED"
          - "Owning Session.status == SCHEDULED"
          - "Acting instructor is the owning Session's primary_instructor_id"
        side_effects:
          - "Owning Enrollment's pool_sessions_attended or open_water_sessions_attended incremented per Session.session_type"
          - "CASCADE: owning Enrollment.completion_pct recomputed; if all eligibility preconditions now hold, Enrollment ACTIVE -> ELIGIBLE"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /session-bookings/{id}/cancel, or system (Enrollment withdrawn, Session cancelled)"
        actor: "Diver or ShopAdmin or system"
        preconditions:
          - "SessionBooking.status == BOOKED"
        side_effects:
          - "Owning Session.confirmed_seats decremented (seat conservation invariant)"
      - from: ATTENDED
        to: CANCELLED
        trigger: "system (owning Session cancelled)"
        actor: system
        preconditions:
          - "Owning Session.status transitioning to CANCELLED"
        side_effects:
          - "Owning Enrollment attendance counter decremented; completion_pct recomputed; ELIGIBLE->ACTIVE revert if a prerequisite now fails"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system (owning Session completed without this booking being ATTENDED)"
        actor: system
        preconditions:
          - "Owning Session transitioning to COMPLETED"
        side_effects:
          - "Owning Session.confirmed_seats decremented"

  - entity: DiveTrip
    field: status
    initial_state: OPEN
    terminal_states: [DEPARTED, CANCELLED]
    transitions:
      - from: OPEN
        to: DEPARTED
        trigger: "POST /dive-trips/{id}/depart"
        actor: ShopAdmin
        preconditions:
          - "DiveTrip.status == OPEN"
          - "current clock >= DiveTrip.starts_at"
        side_effects:
          - "Every CONFIRMED TripBooking on this trip has balance_due_cents set to 0 (balance considered settled at departure)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /dive-trips/{id}/cancel"
        actor: ShopAdmin
        preconditions:
          - "DiveTrip.status == OPEN"
        side_effects:
          - "Every CONFIRMED TripBooking on this trip -> CANCELLED (DiveTrip.confirmed_divers -> 0)"

  - entity: TripBooking
    field: status
    initial_state: CONFIRMED
    terminal_states: [CANCELLED, DEPARTED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /trip-bookings/{id}/cancel, or system (DiveTrip cancelled)"
        actor: "Diver or ShopAdmin or system"
        preconditions:
          - "TripBooking.status == CONFIRMED"
        side_effects:
          - "Owning DiveTrip.confirmed_divers decremented (seat conservation)"
      - from: CONFIRMED
        to: DEPARTED
        trigger: "system (owning DiveTrip departed)"
        actor: system
        preconditions:
          - "Owning DiveTrip transitioning to DEPARTED"
        side_effects:
          - "balance_due_cents set to 0"

  - entity: RentalAgreement
    field: status
    initial_state: ACTIVE
    terminal_states: [RETURNED, VOIDED]
    transitions:
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /rental-agreements/{id}/checkin"
        actor: ShopAdmin
        preconditions:
          - "RentalAgreement.status == ACTIVE"
        side_effects:
          - "actual_return_at = current clock"
          - "actual_cost_cents computed (calculations.rental_charge variant=actual)"
          - "deposit_refund_cents computed (calculations.rental_settlement)"
          - "CASCADE depth 2: rental leaves ACTIVE -> owning Diver.deposit_on_hold_cents recomputed (= sum of deposit_cents over ACTIVE rentals), restoring the money-conservation invariant"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /rental-agreements/{id}/void"
        actor: ShopAdmin
        preconditions:
          - "RentalAgreement.status == ACTIVE"
          - "current clock == RentalAgreement.checkout_at (void only permitted before any time has elapsed since checkout — compensating action)"
        side_effects:
          - "actual_cost_cents = 0; deposit_refund_cents = deposit_cents (full refund)"
          - "CASCADE depth 2: owning Diver.deposit_on_hold_cents recomputed, fully reversing the checkout debit (money-conservation invariant)"

  - entity: GearServiceOrder
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /gear-service-orders/{id}/complete"
        actor: ShopAdmin
        preconditions:
          - "GearServiceOrder.status == OPEN"
        side_effects:
          - "serviced_at = current clock"
          - "next_due_at computed (calculations.gear_service_due)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /gear-service-orders/{id}/cancel"
        actor: ShopAdmin
        preconditions:
          - "GearServiceOrder.status == OPEN"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: session-book-stale-session
    parent_entity: Session
    write_endpoint: "POST /session-bookings"
    occ_field: "expected_session_version"
    description: |
      Creating a SessionBooking against a Session whose version has advanced
      since the client last observed it is rejected. Each accepted booking
      increments Session.version (confirmed_seats changes), so a client that
      read the session with one seat remaining and books against a now-stale
      version is rejected rather than silently over-filling the ratio cap.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: trip-book-stale-trip
    parent_entity: DiveTrip
    write_endpoint: "POST /trip-bookings"
    occ_field: "expected_trip_version"
    description: |
      Creating a TripBooking against a DiveTrip whose version has advanced
      since the client last observed it is rejected. Each accepted booking
      increments DiveTrip.version (confirmed_divers changes), so a booking
      carrying a stale trip version — taken when the boat appeared to have a
      free seat that another booking has since claimed — is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: instructor_ratio_capacity
    trigger: "Session create; recomputed on Session create only (assistant_count/session_type are immutable after create)"
    algorithm: threshold
    formula: |
      # Non-linear: branches on session_type, linear widening per assistant.
      if session_type == POOL:
        max_students = POOL_BASE_RATIO + POOL_ASSISTANT_BONUS * assistant_count
      else:  # OPEN_WATER
        max_students = OW_BASE_RATIO + OW_ASSISTANT_BONUS * assistant_count
    input_set: "The session's own session_type and assistant_count."
    constants:
      POOL_BASE_RATIO: 8
      POOL_ASSISTANT_BONUS: 4
      OW_BASE_RATIO: 4
      OW_ASSISTANT_BONUS: 2
    precision: "integer"

  - name: enrollment_completion_pct
    trigger: "SessionBooking attend; Session cancel cascade; e-learning progress set; recompute-eligibility"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned: derive the two attendance fractions first,
      # THEN combine — the fractions feed the weighted sum, never the reverse.
      pool_frac = 1.0 if course.required_pool_sessions == 0
                  else min(1.0, pool_sessions_attended / course.required_pool_sessions)
      ow_frac   = 1.0 if course.required_open_water_sessions == 0
                  else min(1.0, open_water_sessions_attended / course.required_open_water_sessions)
      raw = EL_WEIGHT * elearning_pct
          + POOL_WEIGHT * (pool_frac * 100)
          + OW_WEIGHT   * (ow_frac * 100)
      completion_pct = round_half_up(raw)   # to whole integer
    input_set: "This enrollment's elearning_pct and ATTENDED-session counters; the parent course's required counts."
    constants:
      EL_WEIGHT: 0.2
      POOL_WEIGHT: 0.3
      OW_WEIGHT: 0.5
    precision: "integer, round_half_up"

  - name: fill_price
    trigger: "FillService create"
    algorithm: tiered_pricing
    formula: |
      base = AIR_BASE_CENTS
      if gas == AIR:
        subtotal = base
      else:  # NITROX — tier surcharge by o2_pct band
        if o2_pct <= 32:        surcharge = NITROX_SURCHARGE_LOW
        elif o2_pct <= 36:      surcharge = NITROX_SURCHARGE_MID
        else:                   surcharge = NITROX_SURCHARGE_HIGH   # 37..40
        subtotal = base + surcharge
      factor = LARGE_TANK_FACTOR if tank_capacity_liters > LARGE_TANK_THRESHOLD_L else 1.0
      price_cents = round_half_up(subtotal * factor)
    input_set: "The fill request's gas, o2_pct, tank_capacity_liters."
    constants:
      AIR_BASE_CENTS: 1200
      NITROX_SURCHARGE_LOW: 800
      NITROX_SURCHARGE_MID: 1400
      NITROX_SURCHARGE_HIGH: 2200
      LARGE_TANK_THRESHOLD_L: 12
      LARGE_TANK_FACTOR: 1.25
    precision: "integer cents, round_half_up on the final product"

  - name: trip_booking_total
    trigger: "TripBooking create"
    algorithm: tiered_pricing
    formula: |
      # Rounding ORDER is pinned: SUM the integer line items first, apply the
      # group discount to that sum, THEN round once to whole cents. Do NOT
      # round each line item before summing.
      subtotal_cents = trip.base_fare_cents + tanks * trip.fill_addon_cents
      discount_pct = GROUP_DISCOUNT_PCT if party_size >= GROUP_DISCOUNT_MIN_PARTY else 0.0
      total_cents   = round_half_up(subtotal_cents * (1 - discount_pct))
      deposit_cents = round_half_up(total_cents * DEPOSIT_PCT)
      balance_due_cents = total_cents - deposit_cents
    input_set: "This booking's tanks and party_size; the parent trip's base_fare_cents and fill_addon_cents."
    constants:
      GROUP_DISCOUNT_MIN_PARTY: 4
      GROUP_DISCOUNT_PCT: 0.15
      DEPOSIT_PCT: 0.30
    precision: "integer cents, round_half_up; discount applied to the summed subtotal before rounding"
    variants:
      - name: solo_no_discount
        when: "party_size < GROUP_DISCOUNT_MIN_PARTY"
        difference: "discount_pct = 0; total_cents == subtotal_cents (still rounded, but a no-op on integers)"
      - name: group_discounted
        when: "party_size >= GROUP_DISCOUNT_MIN_PARTY"
        difference: "discount_pct = 0.15 applied to the SUM before the single rounding step"

  - name: rental_charge
    trigger: "RentalAgreement checkout (estimated), RentalAgreement checkin (actual)"
    algorithm: forward_looking
    formula: |
      def billed_days(from_ts, to_ts):
        # whole days, minimum 1, rounded UP for any partial day
        return max(1, ceil((to_ts - from_ts) / 86400_seconds))
      # variant = estimated (at checkout, forward-looking on scheduled return):
      estimated_cost_cents = billed_days(checkout_at, scheduled_return_at) * daily_rate_cents
      # variant = actual (at checkin, chronological on real return):
      est_days  = billed_days(checkout_at, scheduled_return_at)
      act_days  = billed_days(checkout_at, actual_return_at)
      on_time_days = min(act_days, est_days)
      late_days    = max(0, act_days - est_days)
      late_rate    = round_half_up(daily_rate_cents * LATE_MULTIPLIER)
      actual_cost_cents = on_time_days * daily_rate_cents + late_days * late_rate + damage_fee_cents
    input_set: "checkout_at, scheduled_return_at, actual_return_at, daily_rate_cents, damage_fee_cents."
    constants:
      LATE_MULTIPLIER: 1.5
    precision: "integer cents; round_half_up on late_rate; day counts ceil with min 1"
    variants:
      - name: estimated
        when: "computed at checkout"
        difference: "forward-looking on scheduled_return_at; excludes late surcharge and damage_fee (not yet known)"
      - name: actual
        when: "computed at checkin"
        difference: "chronological on actual_return_at; adds 1.5x late surcharge for days beyond the estimate plus damage_fee_cents"

  - name: rental_settlement
    trigger: "RentalAgreement checkin"
    algorithm: waterfall_allocation
    formula: |
      # The deposit absorbs any overage (late surcharge + damage) above the prepaid estimate.
      balance_over_estimate = max(0, actual_cost_cents - estimated_cost_cents)
      deposit_refund_cents  = max(0, deposit_cents - balance_over_estimate)
    input_set: "actual_cost_cents, estimated_cost_cents, deposit_cents from this rental."
    precision: "integer cents; refund floored at 0"

  - name: waiver_expiry
    trigger: "Waiver create"
    algorithm: threshold
    formula: |
      expires_at = signed_at + WAIVER_VALID_DAYS days
    input_set: "signed_at (logical clock at create)."
    constants:
      WAIVER_VALID_DAYS: 365
    precision: "datetime"

  - name: gear_service_due
    trigger: "GearServiceOrder complete"
    algorithm: threshold
    formula: |
      if service_type == VIP:    next_due_at = serviced_at + VIP_INTERVAL_DAYS days
      else:                      next_due_at = serviced_at + HYDRO_INTERVAL_DAYS days
    input_set: "service_type, serviced_at (logical clock at completion)."
    constants:
      VIP_INTERVAL_DAYS: 365
      HYDRO_INTERVAL_DAYS: 1825
    precision: "datetime"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body foreign-key references resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Request body well-formed: required fields present, enums in range, numbers within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"

  - priority: 5
    category: business_referential
    check: "Ownership: an entity_backed actor may only act on resources they own (Diver on own enrollments/bookings/rentals; Instructor on sessions they are primary_instructor_id of)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "Diver- and Instructor-scoped mutations"

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_temporal
    check: "OCC: when an expected_<parent>_version is supplied, it equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /session-bookings, POST /trip-bookings"

  - priority: 8
    category: business_safety
    check: "Medical/waiver gate: booking a session seat or trip, or becoming cert-ELIGIBLE, requires the diver to have an active Waiver and medical_status != RESTRICTED"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /session-bookings, POST /trip-bookings, eligibility evaluation"

  - priority: 9
    category: business_safety
    check: "Certification prerequisite: a TripBooking requires Diver.cert_level >= DiveTrip.min_cert_level; a NITROX FillService requires Diver.nitrox_certified == true"
    error_id: ERR_CERT_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /trip-bookings, POST /fill-services"

  - priority: 10
    category: business_constraint
    check: "Session scheduling: the primary_instructor_id has rating==INSTRUCTOR and no other SCHEDULED Session whose [starts_at,ends_at) window overlaps (half-open: adjacency at the boundary is allowed)"
    error_id: ERR_INSTRUCTOR_CONFLICT
    http_status: 409
    applies_to: "POST /sessions"

  - priority: 11
    category: business_constraint
    check: "Trip scheduling: the boat has no other non-CANCELLED DiveTrip whose [starts_at,ends_at] window, expanded by turnaround_minutes on each side, overlaps (closed-with-buffer)"
    error_id: ERR_BOAT_CONFLICT
    http_status: 409
    applies_to: "POST /dive-trips"

  - priority: 12
    category: business_constraint
    check: "Seat capacity: a SessionBooking must not push confirmed_seats above Session.max_students; a TripBooking must not push confirmed_divers above Boat.capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /session-bookings, POST /trip-bookings"

  - priority: 13
    category: business_constraint
    check: "Duplicate booking: at most one non-terminal SessionBooking per (enrollment, session); at most one non-CANCELLED TripBooking per (diver, trip)"
    error_id: ERR_DUPLICATE_BOOKING
    http_status: 409
    applies_to: "POST /session-bookings, POST /trip-bookings"

