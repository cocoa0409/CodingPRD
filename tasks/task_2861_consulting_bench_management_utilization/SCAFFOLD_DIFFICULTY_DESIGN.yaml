            - call: "POST /external-placements"
              payload: { subcontractor_firm_id: "${f1_id}", demand_opportunity_id: "${d1_id}", fte: 1.00, start_date: "2026-08-17", end_date: "2026-08-28" }
              as: ResourceManager
