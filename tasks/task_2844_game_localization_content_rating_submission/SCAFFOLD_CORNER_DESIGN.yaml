              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /booths"
              payload: { booth_code: "TOK-D", studio_city: "Tokyo", turnaround_buffer_minutes: 30 }
              as: LocalizationProducer
              captures: { booth_id: "$.data.id" }
            - call: "POST /voice-talents"
              payload: { talent_name: "Miki Sato", language_code: "JA", union_flag: false }
              as: LocalizationProducer
              captures: { talent_id: "$.data.id", talent_v: "$.data.version" }
            - call: "POST /talent-contracts"
