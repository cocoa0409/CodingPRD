  - method: POST
    path: "/api/v1/customer-comms/{cid}/deliver"
    description: "Mark a sent comm delivered"
    roles: [CommunicationsOfficer]
    code: 200
    input: []
    output: CustomerComm
    side_effects: ["status -> DELIVERED"]
  - method: POST
    path: "/api/v1/customer-comms/{cid}/fail"
    description: "Mark a sent comm failed"
    roles: [CommunicationsOfficer]
    code: 200
    input: []
    output: CustomerComm
    side_effects: ["status -> FAILED"]
