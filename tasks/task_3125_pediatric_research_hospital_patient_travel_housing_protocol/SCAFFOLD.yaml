# =============================================================================
# PRD Benchmark Seed Tables — task_3125
# Pediatric Research Hospital Patient Travel, Housing & Protocol Enrollment
# =============================================================================

scenario: |
  Pediatric Research Hospital Patient Travel, Housing & Protocol Enrollment (St. Jude
  Children's Research Hospital): referral acceptance based on protocol eligibility for a
  catastrophic pediatric disease, family cost coverage for travel, housing and meals with no
  billing for treatment, on-campus and partner housing assignment by expected treatment
  duration and immunosuppression status, clinical protocol enrollment with consent and assent
  processes appropriate to the child's age, affiliate clinic coordination for care delivered
  closer to home between protocol milestones, long-term survivorship study participation and
  follow-up scheduling into adulthood, donor-funded operating model with fundraising
  allocation to patient support versus research, sibling and family support services

domain_name: pediatric-research-hospital
api_prefix: /programs

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - selector_policy
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- ResearchFund: the donor-funded pool everything draws on -----------------
  - name: ResearchFund
    parent: null
    common_fields: true
    fields:
      - { name: fund_code, type: string, source: input, description: "Short fund identifier, e.g. SJ-FY26" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the fundraising campaign belongs to (>= 1900)" }
      - { name: fundraising_raised_cents, type: integer, source: input, default: 0, description: "Total donations raised in this campaign, in integer cents (>= 0)" }
      - { name: research_allocation_pct, type: number, source: input, description: "Share of the fund assigned to research at commitment time (0 < pct < 1)" }
      - { name: federal_grant_cents, type: integer, source: input, default: 0, description: "Federal grant dollars credited to this fund, in cents (>= 0)" }
      - { name: patient_support_balance_cents, type: integer, source: system, default: 0, description: "Residual patient-support pool after every pledge and accrual" }
      - { name: research_balance_cents, type: integer, source: system, default: 0, description: "Residual research pool after every pledge, rider accrual and reimbursement" }

  # --- ClinicalProtocol: the eligibility + consent contract -------------------
  - name: ClinicalProtocol
    parent: ResearchFund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> ResearchFund.id; funding pool this protocol draws on" }
      - { name: protocol_code, type: string, source: input, constraints: "unique across the program", description: "Protocol identifier, unique across the whole program" }
      - { name: disease_group, type: string, source: input, description: "Catastrophic pediatric disease group, e.g. ALL, NEUROBLASTOMA" }
      - { name: age_min_years, type: integer, source: input, description: "Inclusive lower bound of enrolable age in whole years" }
      - { name: age_max_years, type: integer, source: input, description: "Inclusive upper bound of enrolable age in whole years" }
      - { name: required_stage, type: enum, source: input, constraints: "enum {NEWLY_DIAGNOSED, RELAPSED, REFRACTORY, REMISSION}", description: "Disease stage a referral must carry to be screen-eligible" }
      - { name: protocol_budget_cents, type: integer, source: input, description: "Total research budget earmarked for this protocol, in cents (> 0)" }
      - { name: reserved_cents, type: integer, source: system, default: 0, description: "Active family pledges drawn against this protocol's research budget" }
      - { name: committed_cents, type: integer, source: system, default: 0, description: "Active family accruals booked against research_budget_cents" }
      - { name: available_cents, type: computed, constraints: "=> protocol_budget_cents - reserved_cents - committed_cents", description: "Unencumbered research budget; decremented by 1 cent per family-research day at settle time" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of ENROLLED patients (> 0)" }
      - { name: enrolled_count, type: system, default: 0, description: "Patients currently in ENROLLED status on this protocol" }
      - { name: age_tier, type: computed, description: "PAEDIATRIC when age_max_years < 12, ADOLESCENT when age_min_years >= 12, MIXED when the age band spans that boundary" }
      - { name: mental_capacity_floor, type: computed, description: "Integer = max(age_min_years, 7); the age at which a child's own assent is the deciding factor" }
      - { name: is_protocol_held, type: boolean, source: system, default: false, description: "True while the protocol is frozen by a non-operational review lock" }
      - { name: is_budget_saturated, type: boolean, source: system, default: false, description: "True once 0 < available_cents <= ceil(0.0375 * protocol_budget_cents)" }
      - { name: status, type: enum, source: system, constraints: "enum {DRAFT, OPEN, HELD, CLOSED}", description: "Protocol lifecycle; only OPEN protocols accept referrals and enrollments" }

  # --- Referral: the admission funnel ----------------------------------------
  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: input, description: "FK -> ClinicalProtocol.id; protocol the referral is screened against" }
      - { name: child_name, type: string, source: input, description: "Patient name; also seeds the eligibility alias" }
      - { name: child_date_of_birth, type: datetime, source: input, description: "Date of birth, ISO 8601 UTC; age is computed against the logical clock" }
      - { name: disease_group, type: string, source: input, description: "Disease group reported by the referring institution" }
      - { name: disease_stage, type: enum, source: input, constraints: "enum {NEWLY_DIAGNOSED, RELAPSED, REFRACTORY, REMISSION}", description: "Stage reported by the referring institution" }
      - { name: household_state_code, type: string, source: input, description: "Two-letter home state of the family, used for travel estimates" }
      - { name: traveling_family_member_count, type: integer, source: input, constraints: "1..6", description: "Number of family members who must travel and be housed" }
      - { name: expected_treatment_days, type: integer, source: input, constraints: "1..3650", description: "Clinician estimate of the treatment course length in days" }
      - { name: is_immunosuppressed, type: boolean, source: input, default: false, description: "Whether the child is immunosuppressed at referral time" }
      - { name: has_febrile_neutropenia_risk, type: boolean, source: input, default: false, description: "Neutropenic fever risk flag set by the referring clinician; forces ON_CAMPUS housing while true" }
      - { name: is_self_pay, type: boolean, source: computed, default: false, description: "True when the referral carries no FAMILY_PLEDGE coverage; recomputed at screening from the placed coverage set" }
      - { name: insurance_coverage_cents, type: integer, source: input, default: 0, description: "Third-party insurance coverage committed to this family, in cents (>= 0)" }
      - { name: one_to_one_care_capability_codes, type: array, source: input, default: [], description: "Codes of travelers cleared for one-to-one care; each entry is a coverage_type of a GUARDIAN-type coverage placed by this referral" }
      - { name: traveling_one_to_one_codes, type: array, source: computed, default: [], description: "the GUARDIAN-type coverage_type codes actually placed by this referral" }
      - { name: eligibility_alias, type: computed, description: "Lowercased child_name with whitespace runs collapsed to a single hyphen; the stable screening alias" }
      - { name: computed_age_years, type: computed, constraints: "=> age_in_whole_years(child_date_of_birth, logical_clock)", description: "Age in whole completed years at the current logical clock" }
      - { name: screening_fee_cents, type: integer, source: computed, default: 0, description: "= ceil(0.025 * insurance_coverage_cents); charged at every screen attempt" }
      - { name: selector_window_days, type: integer, source: computed, default: 0, description: "= min(expected_treatment_days, 540); the clamped duration the housing tier selector bands against" }
      - { name: reservation_basis_cents, type: integer, source: system, default: 0, description: "The exact reservation amount this referral booked on its protocol; released verbatim on enrollment, hold revert or withdrawal" }
      - { name: applied_tier, type: enum, source: system, default: PENDING, constraints: "enum {PENDING, ON_CAMPUS, PARTNER_CLASS_A, PARTNER_CLASS_B, PARTNER_CLASS_C, DECLINED}", description: "Housing tier recorded by the accepted screen; PENDING until acceptance" }
      - { name: status, type: enum, source: system, constraints: "enum {SUBMITTED, ACCEPTED, DECLINED, WITHDRAWN, ARRIVED}", description: "Referral lifecycle; ARRIVED opens clinical protocol enrollment" }
      - { name: enrollment_id, type: string, source: system, default: null, description: "FK -> Enrollment.id; set when the referral arrives and the enrollment row is created" }
      - { name: decline_reason, type: enum, source: system, default: null, constraints: "enum or null {ELIGIBILITY_AGE, ELIGIBILITY_DISEASE, ELIGIBILITY_STAGE, CAPACITY_FULL, BUDGET_INSUFFICIENT}", description: "Populated only when the referral is DECLINED" }
      - { name: decline_occurred_at, type: datetime, source: system, default: null, description: "Logical-clock instant the referral was declined" }
      - { name: reopened_referral_id, type: string, source: system, default: null, description: "FK -> Referral.id; set on the successor row when a declined referral is re-screened" }

  # --- Enrollment: consent + assent ------------------------------------------
  - name: Enrollment
    parent: Referral
    common_fields: true
    fields:
      - { name: referral_id, type: string, source: system, description: "FK -> Referral.id; the arrived referral this enrollment belongs to" }
      - { name: protocol_id, type: string, source: system, description: "FK -> ClinicalProtocol.id" }
      - { name: consent_signer, type: enum, source: input, constraints: "enum {GUARDIAN, GUARDIAN_AND_CHILD}", description: "Who must sign the consent packet" }
      - { name: assent_state, type: enum, source: system, default: NOT_REQUIRED, constraints: "enum {NOT_REQUIRED, PENDING, OBTAINED}", description: "Child assent state; PENDING blocks enrollment" }
      - { name: is_assent_required, type: boolean, source: computed, description: "True when child_age_years >= protocol.mental_capacity_floor and child_age_years < 18" }
      - { name: guardian_consent_signed_at, type: datetime, source: system, default: null, description: "Instant guardian consent was recorded" }
      - { name: child_assent_signed_at, type: datetime, source: system, default: null, description: "Instant the child's own assent was recorded" }
      - { name: status, type: enum, source: system, constraints: "enum {PENDING_CONSENT, ENROLLED, ACTIVE_TREATMENT, ON_HIATUS, SURVIVORSHIP, WITHDRAWN, COMPLETED}", description: "Clinical stage of the enrolled patient" }
      - { name: protocol_enrolled_count, type: integer, source: computed, default: 0, description: "Mirror of ClinicalProtocol.enrolled_count refreshed whenever this enrollment is written" }
      - { name: active_family_count, type: system, default: 0, description: "Families from this enrollment currently holding an ACTIVE housing assignment or ACTIVE family pledge" }

  # --- FamilySupportPledge: patient-support coverage -------------------------
  - name: FamilySupportPledge
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the enrolled family being supported" }
      - { name: patient_support_budget_cents, type: integer, source: input, description: "Family-support allowance at pledge approval, in cents (>= 0)" }
      - { name: covered_days, type: integer, source: system, default: 0, description: "Days of family support accrued so far" }
      - { name: provisional_settled_cents, type: integer, source: computed, default: 0, description: "First-pass settlement: covered_days * STARTER_PER_FAMILY_DAY_CENTS" }
      - { name: final_settled_cents, type: integer, source: computed, default: 0, description: "Final settlement: per-traveler-day tier rate resolved on the family's household_state_code" }
      - { name: billing_permitted_cents, type: computed, default: 0, description: "= max(0, final_settled_cents - patient_support_budget_cents - insurance_coverage_cents); the only amount that may ever be billed" }
      - { name: status, type: enum, source: system, constraints: "enum {ACTIVE, SETTLED_FINAL, VOIDED}" , description: "Pledge lifecycle; only ACTIVE pledges hold reserved_cents on the protocol" }

  # --- HousingAssignment: the constrained inventory -----------------------------
  - name: HousingAssignment
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the family being housed" }
      - { name: housing_facility_id, type: string, source: input, description: "FK -> HousingFacility.id; the residence chosen by the assignment selector" }
      - { name: start_at, type: datetime, source: input, description: "Inclusive occupancy start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Exclusive occupancy end (ISO 8601 UTC); must be strictly after start_at" }
      - { name: assigned_tier, type: enum, source: system, constraints: "enum {ON_CAMPUS, PARTNER_CLASS_A, PARTNER_CLASS_B, PARTNER_CLASS_C}", description: "Tier recorded on the assignment; must equal Referral.applied_tier" }
      - { name: nightly_rate_cents, type: integer, source: computed, description: "Tier rate looked up from the tier rate card at assignment time" }
      - { name: billed_nights, type: computed, description: "Inclusive night count between start_at and end_at" }
      - { name: housing_cost_cents, type: computed, description: "= billed_nights * nightly_rate_cents, rounded half-up to the cent" }
      - { name: is_active_occupancy, type: computed, description: "True when start_at <= logical_clock < end_at" }
      - { name: vacated_reason, type: enum, source: system, default: null, constraints: "enum or null {TREATMENT_COMPLETE, TRANSFERRED_AFFILIATE, WITHDRAWN, RELOCATED}" , description: "Why the family left; TREATMENT_COMPLETE/TRANSFERRED_AFFILIATE/RELOCATED book accruals" }
      - { name: status, type: enum, source: system, constraints: "enum {SCHEDULED, ACTIVE, VACATED, CANCELLED}", description: "Occupancy lifecycle" }

  # --- HousingFacility: capacity-pooled housing resources ---------------------
  - name: HousingFacility
    parent: null
    common_fields: true
    fields:
      - { name: facility_code, type: string, source: input, constraints: "unique within program", description: "Short facility code, unique across the program" }
      - { name: name, type: string, source: input, description: "Display name of the residence" }
      - { name: tier, type: enum, source: input, constraints: "enum {ON_CAMPUS, PARTNER_CLASS_A, PARTNER_CLASS_B, PARTNER_CLASS_C}", description: "Service tier of the residence" }
      - { name: is_on_campus, type: boolean, source: system, description: "True exactly when tier == ON_CAMPUS" }
      - { name: is_partner_site, type: boolean, source: computed, description: "True exactly when tier != ON_CAMPUS" }
      - { name: immunosuppression_capable, type: boolean, source: computed, description: "True exactly when tier IN {ON_CAMPUS, PARTNER_CLASS_A}; immune-competent parties may also be housed here" }
      - { name: is_step_down_capable, type: boolean, source: computed, description: "True exactly when tier IN {PARTNER_CLASS_A, PARTNER_CLASS_B}" }
      - { name: total_beds, type: integer, source: input, description: "Physical beds at the residence (> 0)" }
      - { name: buffer_beds, type: integer, source: input, default: 0, description: "Beds withheld from booking on top of the tier buffer rule (>= 0)" }
      - { name: active_beds_committed, type: computed, default: 0, description: "Highest count of concurrent occupancy instants across assignments in SCHEDULED or ACTIVE status" }
      - { name: status, type: enum, source: system, constraints: "enum {OPEN, SUSPENDED, CLOSED}", description: "Facility availability; only OPEN facilities serve an assignment" }

  # --- TravelArrangement: the no-billing expense ledger -----------------------
  - name: TravelArrangement
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the family travelling" }
      - { name: mode, type: enum, source: input, constraints: "enum {AIR_ECONOMY, AIR_MEDICAL, GROUND, RAIL}", description: "Travel mode for this leg; a leg whose family is already housed by an ACTIVE HousingAssignment must use GROUND so the stay is never double-charged" }
      - { name: traveler_count, type: integer, source: input, constraints: "2..6", description: "Travelers on this leg; a leg carries the patient plus at least one caregiver" }
      - { name: departure_at, type: datetime, source: input, description: "Requested departure instant (exclusive window boundary)" }
      - { name: return_at, type: datetime, source: input, description: "Requested return instant (exclusive window boundary); may be omitted for one-way legs" }
      - { name: is_required_travel, type: boolean, source: input, default: false, description: "True when the trip is a PROTOCOL_REVIEW, THERAPY_ADMINISTRATION or SURVIVORSHIP_VISIT trip" }
      - { name: trip_reason, type: enum, source: input, constraints: "enum {PROTOCOL_REVIEW, THERAPY_ADMINISTRATION, SURVIVORSHIP_VISIT, FAMILY_REQUEST}", description: "Why the trip is being arranged" }
      - { name: placed_coverages, type: array, source: input, default: [], description: "Insurance coverages placed against this leg; each element carries plan_code, coverage_id (may be null), travel_window_start_at, travel_window_end_at, coverage_cents (integer), covers_required_travel (boolean)" }
      - { name: family_day_units, type: computed, default: 0, description: "traveler_count * max(1, billed days between departure_at and return_at, both boundaries exclusive); when the referral declares one_to_one_care_capability_codes the multiplier counts only travelers cleared for one-to-one care" }
      - { name: transport_cost_cents, type: computed, default: 0, description: "= family_day_units * resolved_per_traveler_day_cents; the family's receivable on this leg" }
      - { name: fund_patient_support_balance_cents, type: integer, source: computed, default: 0, description: "ResearchFund.patient_support_balance_cents after this leg was last disbursed or reversed" }
      - { name: fund_research_balance_cents, type: integer, source: computed, default: 0, description: "ResearchFund.research_balance_cents after this leg was last disbursed or reversed" }
      - { name: eligibility_confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the target enrollment's protocol was confirmed OPEN" }
      - { name: status, type: enum, source: system, constraints: "enum {REQUESTED, CONFIRMED, DISBURSED, CANCELLED}", description: "Travel lifecycle; DISBURSED triggers the family-day and research-day side effects" }

  # --- AffiliateClinic: care delivered closer to home --------------------------
  - name: AffiliateClinic
    parent: null
    common_fields: true
    fields:
      - { name: clinic_code, type: string, source: input, constraints: "unique within program", description: "Short affiliate code, unique across the program" }
      - { name: name, type: string, source: input, description: "Display name of the affiliate site" }
      - { name: state_code, type: string, source: input, description: "Two-letter state of the affiliate site" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Whether the affiliate may receive new referrals" }

  # --- AffiliationAgreement: which protocols an affiliate may execute ---------
  - name: AffiliationAgreement
    parent: AffiliateClinic
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: system, description: "FK -> AffiliateClinic.id; the affiliate site" }
      - { name: protocol_id, type: string, source: system, description: "FK -> ClinicalProtocol.id; the protocol the site may execute outside the main campus" }
      - { name: protocol_version, type: string, source: input, description: "Explicit version/revision of the protocol this agreement pins" }
      - { name: effective_start_at, type: datetime, source: input, description: "Inclusive agreement start (ISO 8601 UTC)" }
      - { name: is_cross_state, type: boolean, source: computed, description: "True when the affiliate's state_code differs from the referring family's household_state_code" }
      - { name: status, type: enum, source: system, constraints: "enum {PENDING, ACTIVE, SUSPENDED, TERMINATED}", description: "Agreement lifecycle" }

  # --- ProtocolMilestone: affiliate-executable checkpoints --------------------
  - name: ProtocolMilestone
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the patient's protocol course" }
      - { name: milestone_sequence, type: integer, source: input, constraints: ">= 1; unique within enrollment_id", description: "Ordinal position of the milestone in the protocol course" }
      - { name: description, type: string, source: input, description: "What the milestone represents" }
      - { name: requires_main_campus, type: boolean, source: input, description: "Whether the milestone must be executed at the main campus rather than an affiliate" }
      - { name: target_at, type: datetime, source: input, description: "Scheduled milestone instant (ISO 8601 UTC)" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Instant the milestone was marked executed" }
      - { name: deferred_from_milestone_id, type: string, source: system, default: null, description: "FK -> ProtocolMilestone.id; the immediately preceding unexecuted milestone this deferred visit latched onto" }
      - { name: affiliate_clinic_id, type: string, source: system, default: null, description: "FK -> AffiliateClinic.id; the site that executed this milestone, null at main campus" }
      - { name: status, type: enum, source: system, constraints: "enum {PENDING, DUE, EXECUTED, MISSED}", description: "Milestone execution state" }

  # --- SurvivorshipStudy + SurvivorshipFollowUp --------------------------------
  - name: SurvivorshipStudy
    parent: ClinicalProtocol
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> ClinicalProtocol.id; the treatment protocol whose graduates are followed" }
      - { name: study_code, type: string, source: input, constraints: "unique within protocol_id", description: "Follow-up study code, unique within the protocol" }
      - { name: follow_up_interval_months, type: integer, source: input, description: "Months between successive follow-up visits (> 0)" }
      - { name: min_years_after_completion, type: integer, source: input, description: "Years after treatment completion before follow-up stops (> 0)" }
      - { name: status, type: enum, source: system, constraints: "enum {ACTIVE, CLOSED}", description: "Study lifecycle; only ACTIVE studies accept enrollments" }

  - name: SurvivorshipEnrollment
    parent: SurvivorshipStudy
    common_fields: true
    fields:
      - { name: study_id, type: string, source: system, description: "FK -> SurvivorshipStudy.id; the follow-up study" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the survivor being followed" }
      - { name: completed_treatment_at, type: datetime, source: input, description: "Instant treatment completed; follow-up windows are counted from here" }
      - { name: adult_transition_age_years, type: integer, source: system, default: 18, description: "Age at which follow-up transfers to the adult clinic" }
      - { name: next_due_at, type: datetime, source: computed, description: "completed_treatment_at + VISITS_DONE * follow_up_interval_months" }
      - { name: is_adult_follow_up, type: computed, description: "True when completed_treatment_at + 18 years <= logical_clock" }
      - { name: status, type: enum, source: system, constraints: "enum {ON_STUDY, GRADUATED, WITHDRAWN}", description: "Follow-up lifecycle" }

  - name: SurvivorshipFollowUp
    parent: SurvivorshipEnrollment
    common_fields: true
    fields:
      - { name: survivorship_enrollment_id, type: string, source: system, description: "FK -> SurvivorshipEnrollment.id; the follow-up course this visit belongs to" }
      - { name: completed_at, type: datetime, source: input, description: "Instant the follow-up visit was completed" }
      - { name: status, type: enum, source: system, default: LOGGED, constraints: "enum {LOGGED}", description: "Visit log state; every appended visit is LOGGED" }

  # --- FamilySupportService: meals, sibling care, comfort ---------------------
  - name: FamilySupportService
    parent: ResearchFund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> ResearchFund.id; pool that funds this service line" }
      - { name: service_code, type: string, source: input, constraints: "unique within fund_id; one of TRAVEL, HOUSING, MEALS, SIBLING_CARE, COMFORT_ITEM", description: "Service catalogue code, unique within the fund" }
      - { name: display_name, type: string, source: input, description: "Human-readable service name" }
      - { name: base_allowance_cents, type: integer, source: input, description: "Per-family allowance baseline before stimulation, in cents (>= 0)" }
      - { name: is_stimulation_eligible, type: boolean, source: input, default: false, description: "Whether the service qualifies for the charitable-service stimulation markup" }
      - { name: stimulation_rate, type: number, source: input, default: 0, constraints: "0 <= rate <= 1", description: "Markup applied to base_allowance_cents when eligible and the ledger is ACTIVE" }
      - { name: stimulation_cap_cents, type: integer, source: input, default: 0, description: "Cap on the markup dollars contributed to the service ledger (> 0)" }

  - name: FamilyServiceLedger
    parent: FamilySupportService
    common_fields: true
    fields:
      - { name: family_support_service_id, type: string, source: system, description: "FK -> FamilySupportService.id; the service line this ledger tracks" }
      - { name: ledger_epoch, type: integer, source: system, default: 0, description: "Service-ledger epoch, advanced by the ops-run checkpoint" }
      - { name: accumulated_cents, type: integer, source: system, default: 0, description: "Allowances accrued into this ledger since the last checkpoint" }
      - { name: status, type: enum, source: system, constraints: "enum {ACTIVE, FROZEN}", description: "Ledger posture; a FROZEN ledger pauses markup accrual" }

  - name: SiblingSupportService
    parent: Enrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the patient whose household holds the sibling" }
      - { name: sibling_alias, type: string, source: input, description: "Non-identifying alias for the sibling, unique within enrollment_id" }
      - { name: service_type, type: enum, source: input, constraints: "enum {TUITION_STIPEND, COUNSELING_SESSION, RECREATION_PROGRAM, SIBLING_CAMP}", description: "Category of sibling support delivered" }
      - { name: delivery_window_start_at, type: datetime, source: input, description: "Inclusive start of the delivery window" }
      - { name: delivery_window_end_at, type: datetime, source: input, description: "Exclusive end of the delivery window" }
      - { name: sessions_delivered, type: integer, source: system, default: 0, description: "Sessions consumed inside the current delivery window" }
      - { name: has_reached_monthly_limit, type: boolean, source: computed, description: "True once sessions_delivered >= sessions_per_window for the window" }
      - { name: status, type: enum, source: system, constraints: "enum {ACTIVE, COMPLETED, CANCELLED}", description: "Sibling service lifecycle" }

  # --- ProtocolHold: the freeze that gates every child workflow ---------------
  - name: ProtocolHold
    parent: ClinicalProtocol
    common_fields: true
    fields:
      - { name: protocol_id, type: string, source: system, description: "FK -> ClinicalProtocol.id; protocol being frozen" }
      - { name: protocol_version, type: integer, source: system, default: 0, description: "version of the host ClinicalProtocol, refreshed on every write to this hold including its release and escalation" }
      - { name: hold_reason, type: enum, source: input, constraints: "enum {IRB_REVIEW, SAFETY_SIGNAL, FUNDING_REVIEW, SPONSOR_AUDIT}", description: "Why the protocol was frozen" }
      - { name: initiated_at, type: datetime, source: input, description: "Instant the hold was raised" }
      - { name: released_at, type: datetime, source: system, default: null, description: "Instant the hold was released" }
      - { name: status, type: enum, source: system, constraints: "enum {ACTIVE, RELEASED, ESCALATED}", description: "Hold lifecycle; ESCALATED places an IRB review lock on the protocol" }
      - { name: is_review_lock, type: boolean, source: computed, description: "True exactly when hold_reason == IRB_REVIEW and status == ESCALATED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ClinicalProtocol
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /clinical-protocols/{protocolId}/open"
        actor: ProtocolCoordinator
        preconditions:
          - "Protocol must be in DRAFT (ERR_PROTOCOL_NOT_IN_DRAFT)"
          - "capacity must be > 0 (ERR_INVALID_REQUEST)"
          - "protocol_budget_cents must be > 0 (ERR_INVALID_REQUEST)"
        side_effects: []
      - from: OPEN
        to: HELD
        trigger: "system (automatic when a ProtocolHold is created)"
        actor: system
        preconditions:
          - "Protocol must be in OPEN (ERR_PROTOCOL_NOT_OPEN)"
        side_effects:
          - "is_protocol_held set true"
          - "Every Referral on this protocol in ACCEPTED status reverts to SUBMITTED with applied_tier reset to PENDING"
          - "Those reverts cost no screening fee and advance no budget"
      - from: HELD
        to: OPEN
        trigger: "POST /clinical-protocols/{protocolId}/release-hold"
        actor: ProtocolCoordinator
        preconditions:
          - "Protocol must be in HELD (ERR_PROTOCOL_NOT_HELD)"
          - "No ProtocolHold on this protocol is in ACTIVE status (ERR_PROTOCOL_HOLD_ACTIVE)"
        side_effects:
          - "is_protocol_held set false"
      - from: OPEN
        to: CLOSED
        trigger: "POST /clinical-protocols/{protocolId}/close"
        actor: ProtocolCoordinator
        preconditions:
          - "Protocol must be in OPEN (ERR_PROTOCOL_NOT_OPEN)"
          - "enrolled_count == 0 (ERR_PROTOCOL_HAS_ENROLLED_PATIENTS)"
        side_effects:
          - "Every SurvivorshipStudy on this protocol transitions to CLOSED"
          - "Every FamilySupportPledge on a withdrawn enrollment of this protocol is voided"

  - entity: ProtocolHold
    initial_state: ACTIVE
    terminal_states: [RELEASED, ESCALATED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /protocol-holds/{holdId}/release"
        actor: ProtocolCoordinator
        preconditions:
          - "Hold must be in ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "Host protocol must be in HELD (ERR_PROTOCOL_NOT_HELD)"
        side_effects:
          - "released_at stamped from the logical clock"
          - "protocol_version refreshed to the host protocol's current version"
          - "Host protocol returns to OPEN only if no other ACTIVE hold remains"
      - from: ACTIVE
        to: ESCALATED
        trigger: "POST /protocol-holds/{holdId}/escalate"
        actor: IRBReviewer
        preconditions:
          - "Hold must be in ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "hold_reason must be IRB_REVIEW (ERR_HOLD_NOT_IRB_REVIEW)"
        side_effects:
          - "Host ClinicalProtocol.is_protocol_held stays true"
          - "Host protocol blocks arm-assent confirmation and enrollment completion until the hold is released"
          - "is_review_lock computed true for this hold"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /referrals/{referralId}/screen"
        actor: IntakeCoordinator
        preconditions:
          - "Referral must be in SUBMITTED (ERR_REFERRAL_NOT_SUBMITTED)"
          - "Target ClinicalProtocol must be in OPEN and is_protocol_held false (ERR_PROTOCOL_NOT_OPEN)"
          - "No other Referral sharing the protected eligibility_alias is in ACCEPTED or ARRIVED status (ERR_DUPLICATE_PATIENT_ELIGIBILITY)"
          - "computed_age_years within [age_min_years, age_max_years] (ERR_AGE_OUTSIDE_PROTOCOL_RANGE)"
          - "disease_group == protocol.disease_group (ERR_DISEASE_GROUP_MISMATCH)"
          - "disease_stage == protocol.required_stage (ERR_DISEASE_STAGE_MISMATCH)"
          - "protocol.enrolled_count < protocol.capacity (ERR_PROTOCOL_CAPACITY_EXCEEDED)"
          - "protocol.available_cents > 0 (ERR_PROTOCOL_BUDGET_EXHAUSTED)"
        side_effects:
          - "status -> ACCEPTED"
          - "screening_fee_cents recalculated as ceil(0.025 * insurance_coverage_cents)"
          - "is_self_pay recomputed as true when no FAMILY_PLEDGE coverage is placed"
          - "applied_tier set by the housing selector (may be DECLINED, ERR_NO_HOUSING_AVAILABLE)"
          - "reservation_basis_cents set to ceil(0.125 * protocol_budget_cents) on tier ON_CAMPUS, else ceil(0.0625 * protocol_budget_cents) on tier PARTNER_*"
          - "ClinicalProtocol.reserved_cents += reservation_basis_cents"
          - "Protocol is_budget_saturated recomputed"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /referrals/{referralId}/screen"
        actor: IntakeCoordinator
        preconditions:
          - "Referral must be in SUBMITTED (ERR_REFERRAL_NOT_SUBMITTED)"
          - "At least one of the eligibility, capacity or budget checks failed"
        side_effects:
          - "status -> DECLINED with decline_reason set to the first failed check in screen priority order"
          - "decline_occurred_at stamped from the logical clock"
          - "For a budget failure the protocol records no accrual at all"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /referrals/{referralId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Referral must be in SUBMITTED (ERR_REFERRAL_NOT_SUBMITTED)"
        side_effects: []
      - from: ACCEPTED
        to: SUBMITTED
        trigger: "system (automatic when the host protocol enters HELD)"
        actor: system
        preconditions:
          - "Referral must be in ACCEPTED (no error: the revert is unconditional on acceptance)"
        side_effects:
          - "applied_tier reset to PENDING"
          - "ClinicalProtocol.reserved_cents -= reservation_basis_cents, then reservation_basis_cents reset to 0"
          - "Protocol is_budget_saturated recomputed"
      - from: ACCEPTED
        to: ARRIVED
        trigger: "POST /referrals/{referralId}/arrive"
        actor: IntakeCoordinator
        preconditions:
          - "Referral must be in ACCEPTED (ERR_REFERRAL_NOT_ACCEPTED)"
          - "Target ClinicalProtocol must be in OPEN and is_protocol_held false (ERR_PROTOCOL_NOT_OPEN)"
        side_effects:
          - "status -> ARRIVED"
          - "An Enrollment row is created for this referral with status PENDING_CONSENT"
          - "assent_state set to PENDING when is_assent_required is true, else NOT_REQUIRED"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /referrals/{referralId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Referral must be in ACCEPTED or SUBMITTED (ERR_REFERRAL_NOT_SUBMITTED)"
        side_effects:
          - "ClinicalProtocol.reserved_cents -= reservation_basis_cents, then reservation_basis_cents reset to 0"
          - "decline_occurred_at left null because the family withdrew"
      - from: ARRIVED
        to: WITHDRAWN
        trigger: "POST /referrals/{referralId}/withdraw"
        actor: IntakeCoordinator
        preconditions:
          - "Referral must be in SUBMITTED or ACCEPTED or ARRIVED (ERR_REFERRAL_NOT_SUBMITTED)"
          - "No Enrollment on this referral is in ACTIVE_TREATMENT or SURVIVORSHIP (ERR_ENROLLMENT_ACTIVE)"
        side_effects:
          - "Enrollment on this referral -> WITHDRAWN"
          - "HousingAssignment on this referral's enrollment -> CANCELLED"
          - "FamilySupportPledge on this referral's enrollment -> VOIDED"
          - "ClinicalProtocol.enrolled_count decremented when the enrollment had reached ENROLLED"
      - from: DECLINED
        to: ACCEPTED
        trigger: "POST /referrals"
        actor: IntakeCoordinator
        preconditions:
          - "Source referral must be in DECLINED (ERR_REFERRAL_NOT_DECLINED)"
          - "reopen_source_referral_id must reference a referral in DECLINED status (ERR_REFERRAL_NOT_DECLINED)"
          - "Every screen precondition of the SUBMITTED -> ACCEPTED transition must hold on the successor"
        side_effects:
          - "A successor Referral row is created carrying reopened_referral_id = source referral id"
          - "The successor is created directly in ACCEPTED with its own applied_tier"
          - "Source status remains DECLINED; the successor holds the new screen outcome"

  - entity: Enrollment
    initial_state: PENDING_CONSENT
    terminal_states: [WITHDRAWN, COMPLETED]
    transitions:
      - from: PENDING_CONSENT
        to: ENROLLED
        trigger: "POST /enrollments/{enrollmentId}/sign-consent"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in PENDING_CONSENT (ERR_ENROLLMENT_NOT_PENDING_CONSENT)"
          - "consent_signer must match the required signer for the child's age (ERR_INVALID_CONSENT_SIGNER)"
          - "All assents for this enrollment must be non-PENDING (ERR_ASSENT_NOT_OBTAINED)"
          - "Host protocol must be in OPEN and is_protocol_held false (ERR_ARM_ASSENT_BLOCKED_BY_HOLD)"
          - "Every traveler holding a GUARDIAN-type coverage placed by this referral must appear in the referral's one_to_one_care_capability_codes (ERR_ONE_TO_ONE_CARE_NOT_ELIGIBLE)"
          - "ClinicalProtocol.enrolled_count < ClinicalProtocol.capacity (ERR_PROTOCOL_CAPACITY_EXCEEDED)"
        side_effects:
          - "status -> ENROLLED"
          - "ClinicalProtocol.enrolled_count += 1"
          - "ClinicalProtocol.reserved_cents -= the referral's reservation_basis_cents, then reservation_basis_cents reset to 0"
          - "ClinicalProtocol.is_budget_saturated recomputed"
      - from: ENROLLED
        to: ACTIVE_TREATMENT
        trigger: "POST /enrollments/{enrollmentId}/start-treatment"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "At least one HousingAssignment for this enrollment is in ACTIVE status (ERR_NO_ACTIVE_HOUSING)"
        side_effects:
          - "status -> ACTIVE_TREATMENT"
          - "The enrollment's earliest SCHEDULED ProtocolMilestone becomes DUE"
      - from: ACTIVE_TREATMENT
        to: ON_HIATUS
        trigger: "POST /enrollments/{enrollmentId}/hiatus"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in ACTIVE_TREATMENT (ERR_ENROLLMENT_NOT_ACTIVE_TREATMENT)"
          - "The enrollment must have no ProtocolMilestone in PENDING or DUE status (ERR_MILESTONES_OUTSTANDING)"
        side_effects:
          - "HousingAssignment for this enrollment -> VACATED with vacated_reason TRANSFERRED_AFFILIATE"
          - "The current FamilySupportPledge settles (final_settled_cents computed)"
      - from: ON_HIATUS
        to: ACTIVE_TREATMENT
        trigger: "POST /enrollments/{enrollmentId}/resume"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in ON_HIATUS (ERR_ENROLLMENT_NOT_ON_HIATUS)"
          - "Host protocol must be in OPEN and is_protocol_held false (ERR_ARM_ASSENT_BLOCKED_BY_HOLD)"
        side_effects:
          - "status -> ACTIVE_TREATMENT"
      - from: ACTIVE_TREATMENT
        to: SURVIVORSHIP
        trigger: "POST /enrollments/{enrollmentId}/complete-treatment"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in ACTIVE_TREATMENT (ERR_ENROLLMENT_NOT_ACTIVE_TREATMENT)"
          - "No ProtocolMilestone on this enrollment is in DUE or MISSED status (ERR_MILESTONES_OUTSTANDING)"
          - "An ACTIVE SurvivorshipStudy exists on this enrollment's protocol (ERR_NO_ACTIVE_SURVIVORSHIP_STUDY)"
        side_effects:
          - "status -> SURVIVORSHIP"
          - "ClinicalProtocol.enrolled_count -= 1"
          - "A SurvivorshipEnrollment is created with status ON_STUDY and completed_treatment_at stamped from the logical clock"
          - "SiblingSupportService on this enrollment -> COMPLETED"
          - "The current FamilySupportPledge settles (final_settled_cents computed)"
      - from: SURVIVORSHIP
        to: COMPLETED
        trigger: "POST /enrollments/{enrollmentId}/complete-follow-up"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in SURVIVORSHIP (ERR_ENROLLMENT_NOT_IN_SURVIVORSHIP)"
          - "Every SurvivorshipEnrollment on this enrollment must be GRADUATED (ERR_SURVIVORSHIP_NOT_GRADUATED)"
        side_effects:
          - "status -> COMPLETED"
      - from: PENDING_CONSENT
        to: ON_HIATUS
        trigger: "POST /enrollments/{enrollmentId}/hiatus"
        actor: IntakeCoordinator
        preconditions:
          - "Enrollment must be in PENDING_CONSENT or ACTIVE_TREATMENT (ERR_ENROLLMENT_NOT_ACTIVE_TREATMENT)"
        side_effects:
          - "Hospital housing is retained; the pledge settles on transfer"
      - from: PENDING_CONSENT
        to: ENROLLED
        trigger: "POST /enrollments/{enrollmentId}/record-arm-assent"
        actor: IRBReviewer
        preconditions:
          - "Enrollment must be in PENDING_CONSENT (ERR_ENROLLMENT_NOT_PENDING_CONSENT)"
          - "Host protocol must be in OPEN and is_protocol_held false (ERR_ARM_ASSENT_BLOCKED_BY_HOLD)"
        side_effects:
          - "assent_state -> OBTAINED; child_assent_signed_at stamped"

  - entity: HousingAssignment
    initial_state: SCHEDULED
    terminal_states: [VACATED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /housing-assignments/{assignmentId}/activate"
        actor: HousingCoordinator
        preconditions:
          - "Assignment must be in SCHEDULED (ERR_HOUSING_ASSIGNMENT_NOT_SCHEDULED)"
          - "start_at <= logical_clock (ERR_OCCUPANCY_NOT_STARTED)"
          - "Assigned HousingFacility must be in OPEN status (ERR_HOUSING_FACILITY_UNAVAILABLE)"
          - "At both endpoints of the window the count of assignments covering that instant plus buffer_beds must not exceed total_beds (ERR_HOUSING_CAPACITY_EXCEEDED)"
        side_effects:
          - "status -> ACTIVE with is_active_occupancy true"
          - "HousingFacility.active_beds_committed recomputed as the highest concurrent occupancy count across this window"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /housing-assignments/{assignmentId}/cancel"
        actor: HousingCoordinator
        preconditions:
          - "Assignment must be in SCHEDULED (ERR_HOUSING_ASSIGNMENT_NOT_SCHEDULED)"
        side_effects: []
      - from: ACTIVE
        to: VACATED
        trigger: "POST /housing-assignments/{assignmentId}/vacate"
        actor: HousingCoordinator
        preconditions:
          - "Assignment must be in ACTIVE (ERR_HOUSING_ASSIGNMENT_NOT_ACTIVE)"
          - "vacated_reason must IN {TREATMENT_COMPLETE, TRANSFERRED_AFFILIATE, RELOCATED} to book an accrual (ERR_INVALID_VACATE_REASON)"
        side_effects:
          - "status -> VACATED with is_active_occupancy false"
          - "HousingFacility.active_beds_committed recomputed from the remaining SCHEDULED and ACTIVE assignments"
          - "For TREATMENT_COMPLETE: the enrollment's pledge final_settled_cents is recomputed"
          - "For TRANSFERRED_AFFILIATE: the enrollment's stigma-safe care transfer flag is bookmarked for the affiliate coordination workflow"

  - entity: FamilySupportPledge
    initial_state: ACTIVE
    terminal_states: [SETTLED_FINAL, VOIDED]
    transitions:
      - from: ACTIVE
        to: SETTLED_FINAL
        trigger: "POST /family-support-pledges/{pledgeId}/settle"
        actor: PatientSupportOfficer
        preconditions:
          - "Pledge must be in ACTIVE (ERR_PLEDGE_SETTLE_NOT_ACTIVE)"
          - "The pledge's enrollment must be in WITHDRAWN / COMPLETED / ON_HIATUS / SURVIVORSHIP (ERR_PLEDGE_SETTLE_ENROLLMENT_ACTIVE)"
        side_effects:
          - "final_settled_cents = covered_days * resolved_per_family_day_cents"
          - "billing_permitted_cents = max(0, final_settled_cents - patient_support_budget_cents - insurance_coverage_cents)"
          - "ResearchFund.patient_support_balance_cents -= final_settled_cents"
          - "status -> SETTLED_FINAL"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /family-support-pledges/{pledgeId}/accrue"
        actor: PatientSupportOfficer
        preconditions:
          - "Pledge must be in ACTIVE (ERR_PLEDGE_SETTLE_NOT_ACTIVE)"
          - "days must be >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "covered_days += days"
          - "provisional_settled_cents = covered_days * STARTER_PER_FAMILY_DAY_CENTS"
          - "ClinicalProtocol.committed_cents recomputed from the pledge's enrollment window"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /family-support-pledges/{pledgeId}/void"
        actor: PatientSupportOfficer
        preconditions:
          - "Pledge must be in ACTIVE (ERR_PLEDGE_SETTLE_NOT_ACTIVE)"
          - "No HousingAssignment for this pledge's enrollment is in ACTIVE status (ERR_HOUSING_OCCUPANCY_ACTIVE)"
        side_effects:
          - "status -> VOIDED"
          - "ClinicalProtocol.reserved_cents adjusted by reversing this pledge's reservation"

  - entity: TravelArrangement
    initial_state: REQUESTED
    terminal_states: [DISBURSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /travel-arrangements/{travelId}/confirm"
        actor: PatientSupportOfficer
        preconditions:
          - "Travel must be in REQUESTED (ERR_TRAVEL_NOT_REQUESTED)"
          - "traveler_count must be between 2 and 6 (ERR_TRAVELER_COUNT_RANGE)"
          - "Target Enrollment's ClinicalProtocol must be OPEN and is_protocol_held false; eligibility_confirmed_at is stamped at this transition (ERR_TRAVEL_ELIGIBILITY_NOT_CONFIRMED)"
          - "No confirmed leg for the same enrollment and mode has a travel window that collides on the arrival boundary (ERR_TRAVEL_LEG_OVERLAP)"
        side_effects:
          - "status -> CONFIRMED"
          - "eligibility_confirmed_at stamped from the logical clock"
      - from: CONFIRMED
        to: DISBURSED
        trigger: "POST /travel-arrangements/{travelId}/disburse"
        actor: PatientSupportOfficer
        preconditions:
          - "Travel must be in CONFIRMED (ERR_TRAVEL_NOT_CONFIRMED)"
          - "eligibility_confirmed_at + 30 days must be strictly after the logical clock (ERR_TRAVEL_COVERAGE_EXPIRED)"
          - "family_day_units must be >= 1 (ERR_INVALID_REQUEST)"
          - "No confirmed or disbursed leg for the same enrollment and mode overlaps this leg's window (ERR_TRAVEL_LEG_OVERLAP)"
        side_effects:
          - "status -> DISBURSED"
          - "transport_cost_cents = family_day_units * resolved_per_traveler_day_cents"
          - "ResearchFund.patient_support_balance_cents -= transport_cost_cents"
          - "The enrollment's pledge covered_days += billed days over the leg window"
          - "For a TRAVEL-mode disbursement on a protocol with a non-operational review lock: ResearchFund.research_balance_cents += ceil(0.075 * transport_cost_cents)"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /travel-arrangements/{travelId}/cancel"
        actor: PatientSupportOfficer
        preconditions:
          - "Travel must be in REQUESTED or CONFIRMED (ERR_TRAVEL_NOT_CANCELLABLE)"
        side_effects: []
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /travel-arrangements/{travelId}/cancel"
        actor: PatientSupportOfficer
        preconditions:
          - "Travel must be in REQUESTED or CONFIRMED (ERR_TRAVEL_NOT_CANCELLABLE)"
        side_effects:
          - "For a leg that had already stamped eligibility_confirmed_at, no fee is reversed"

  - entity: AffiliationAgreement
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /programs/affiliations/{agreementId}/activate"
        actor: AffiliateClinicCoordinator
        preconditions:
          - "Agreement must be in PENDING (ERR_INVALID_STATE)"
          - "The referenced AffiliateClinic must have is_active true (ERR_INVALID_REQUEST)"
          - "The referenced ClinicalProtocol must exist (ERR_PROTOCOL_NOT_FOUND)"
        side_effects:
          - "status -> ACTIVE; the site may now receive deferred milestones for this protocol"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/affiliations/{agreementId}/suspend"
        actor: AffiliateClinicCoordinator
        preconditions:
          - "Agreement must be in ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "status -> SUSPENDED; the site stops receiving new deferred milestones"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /programs/affiliations/{agreementId}/terminate"
        actor: AffiliateClinicCoordinator
        preconditions:
          - "Agreement must be in ACTIVE or SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> TERMINATED"

  - entity: ProtocolMilestone
    initial_state: PENDING
    terminal_states: [EXECUTED, MISSED]
    transitions:
      - from: PENDING
        to: DUE
        trigger: "system (automatic promotion of the enrollment's earliest pending milestone when a prior milestone is executed or when treatment starts)"
        actor: system
        preconditions:
          - "Milestone is PENDING and is the lowest milestone_sequence among this enrollment's non-EXECUTED milestones"
          - "The immediately preceding milestone of the same enrollment, when one exists, is EXECUTED (ERR_PRIOR_MILESTONE_NOT_EXECUTED)"
        side_effects:
          - "status -> DUE"
          - "deferred_from_milestone_id left null; an automatic promotion is not a deferral"
      - from: DUE
        to: DUE
        trigger: "POST /protocol-milestones/{milestoneId}/defer-visit"
        actor: AffiliateClinicCoordinator
        preconditions:
          - "Milestone must be in DUE (ERR_MILESTONE_NOT_DUE)"
          - "An ACTIVE AffiliationAgreement must cover this protocol at the requested affiliate (ERR_NO_ACTIVE_AFFILIATION_AGREEMENT)"
          - "The requested AffiliateClinic must have is_active true and its state_code within one state of the family's household_state_code (ERR_AFFILIATE_NOT_ADJACENT)"
          - "requires_main_campus must be false (ERR_MILESTONE_REQUIRES_MAIN_CAMPUS)"
          - "Target_at minus logical_clock must be <= 14 days (ERR_VISIT_WINDOW_TOO_DISTANT)"
        side_effects:
          - "status stays DUE with deferred_from_milestone_id set to the immediately preceding milestone of this enrollment"
          - "affiliate_clinic_id set to the coordinating affiliate"
          - "A Referral intent is raised for the affiliate site on the family's behalf"
      - from: DUE
        to: EXECUTED
        trigger: "POST /protocol-milestones/{milestoneId}/execute"
        actor: AffiliateClinicCoordinator
        preconditions:
          - "Milestone must be in DUE (ERR_MILESTONE_NOT_DUE)"
          - "Host protocol must be in OPEN and is_protocol_held false (ERR_PROTOCOL_NOT_OPEN)"
        side_effects:
          - "status -> EXECUTED with executed_at stamped"
          - "The enrollment's next PENDING milestone is promoted to DUE"
          - "For a TRAVEL-mode leg covering this visit: the ResearchFund research accrual for the visit still holds"
      - from: PENDING
        to: MISSED
        trigger: "system (automatic when target_at passes with the milestone still PENDING)"
        actor: system
        preconditions:
          - "Milestone is PENDING and target_at < logical_clock"
        side_effects:
          - "status -> MISSED"
      - from: DUE
        to: MISSED
        trigger: "system (automatic when target_at passes with the milestone still DUE)"
        actor: system
        preconditions:
          - "Milestone is DUE and target_at < logical_clock"
        side_effects:
          - "status -> MISSED"
          - "The enrollment blocks complete-treatment until a replacement milestone is registered"

  - entity: SurvivorshipEnrollment
    initial_state: ON_STUDY
    terminal_states: [GRADUATED, WITHDRAWN]
    transitions:
      - from: ON_STUDY
        to: GRADUATED
        trigger: "system (automatic when min_years_after_completion has elapsed)"
        actor: system
        preconditions:
          - "Study must be ACTIVE (ERR_STUDY_NOT_ACTIVE)"
          - "completed_treatment_at + VISITS_DONE * follow_up_interval_months must be <= logical_clock for the terminal visit"
        side_effects:
          - "status -> GRADUATED with final follow-up visit logged"
      - from: ON_STUDY
        to: WITHDRAWN
        trigger: "POST /survivorship-enrollments/{survivorshipEnrollmentId}/withdraw"
        actor: SurvivorshipCoordinator
        preconditions:
          - "Enrollment must be in ON_STUDY (ERR_SURVIVORSHIP_NOT_ON_STUDY)"
        side_effects:
          - "status -> WITHDRAWN"

  - entity: SiblingSupportService
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (automatic when the host enrollment reaches SURVIVORSHIP)"
        actor: system
        preconditions:
          - "Service must be in ACTIVE (ERR_SIBLING_SERVICE_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /sibling-support-services/{serviceId}/cancel"
        actor: PatientSupportOfficer
        preconditions:
          - "Service must be in ACTIVE (ERR_SIBLING_SERVICE_NOT_ACTIVE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: referral-screen-stale-protocol
    parent_entity: ClinicalProtocol
    write_endpoint: "POST /referrals/{referralId}/screen"
    occ_field: "expected_protocol_version"
    description: |
      Screening a Referral against a ClinicalProtocol whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just moved the protocol's capacity, reservation or hold
      posture and the current writer's view of the protocol is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: referral-arrive-stale-referral
    parent_entity: Referral
    write_endpoint: "POST /referrals/{referralId}/arrive"
    occ_field: "expected_referral_version"
    description: |
      Arriving a Referral is written against the Referral version the client last
      observed. A stale value is rejected, capturing the case where another writer
      has just screened, withdrawn or re-screened that same Referral since the
      client's last read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: screening_fee
    trigger: "every POST /referrals/{referralId}/screen attempt, accepted or declined"
    algorithm: aggregation
    formula: |
      screening_fee_cents = ceil(0.025 * insurance_coverage_cents)
      The fee is charged on every screen attempt, in ACCEPT and DECLINE alike.
      It never moves the protocol's available_cents and is never refunded.
    constants:
      SCREENING_FEE_RATE: 0.025
    precision: "integer cents, ceil"
    input_set: "the Referral row being screened; insurance_coverage_cents as supplied at creation"

  - name: provisional_family_day_charge
    trigger: "FamilySupportPledge creation and every POST /family-support-pledges/{pledgeId}/accrue"
    algorithm: aggregation
    formula: |
      provisional_settled_cents = covered_days * 450
    constants:
      STARTER_PER_FAMILY_DAY_CENTS: 450
    precision: "integer cents, exact"
    input_set: "covered_days on the pledge; updated in whole days only"

  - name: final_family_day_charge
    trigger: "FamilySupportPledge settlement and every TravelArrangement disbursement"
    algorithm: tiered_pricing
    formula: |
      resolved_per_traveler_day_cents =
        15000 when household_state_code IN {TX, OK, AR, MS, AL, LA, TN, MO, KY}
        else 22000 when household_state_code IN {CA, NY, IL, WA, MA, NJ, CT, OR, MD}
        else 18000
      transport_cost_cents  = family_day_units * resolved_per_traveler_day_cents
      final_settled_cents   = covered_days * resolved_per_traveler_day_cents
      rounding: each product rounded half-up to the cent; never sum-then-round.
    constants:
      NEAR_STATE_PER_TRAVELER_DAY_CENTS: 15000
      FAR_STATE_PER_TRAVELER_DAY_CENTS: 22000
      STANDARD_PER_TRAVELER_DAY_CENTS: 18000
      NEAR_STATES: [TX, OK, AR, MS, AL, LA, TN, MO, KY]
      FAR_STATES: [CA, NY, IL, WA, MA, NJ, CT, OR, MD]
    precision: "integer cents, round_half_up per product"

  - name: family_support_allocation
    trigger: "FamilySupportPledge settlement"
    algorithm: waterfall_allocation
    formula: |
      final_settled_cents    = covered_days * resolved_per_traveler_day_cents
      covered_from_budget    = min(final_settled_cents, patient_support_budget_cents)
      remaining_after_budget = final_settled_cents - covered_from_budget
      covered_from_insurance = min(remaining_after_budget, insurance_coverage_cents)
      resulting_balance      = remaining_after_budget - covered_from_insurance
      billing_permitted_cents = max(0, resulting_balance)
    precision: "integer cents, exact"
    input_set: "one pledge, one settlement run; covered_days frozen at settlement"
    note: "The bucket order budget-then-insurance is pinned; swapping it changes nothing mathematically, but the pinned order is the contract."

  - name: protocol_referral_reservation
    trigger: "accepted Referral screen; released on enrollment, withdrawal or protocol hold"
    algorithm: threshold
    formula: |
      On a tier ON_CAMPUS screen:  reserve = ceil(0.125 * protocol_budget_cents)
      On a tier PARTNER_* screen:   reserve = ceil(0.0625 * protocol_budget_cents)
      reserved_cents += reserve
      available_cents = protocol_budget_cents - reserved_cents - committed_cents
      is_budget_saturated = (0 < available_cents <= ceil(0.0375 * protocol_budget_cents))
    constants:
      ON_CAMPUS_RESERVE_RATE: 0.125
      PARTNER_RESERVE_RATE: 0.0625
      SATURATION_RATE: 0.0375
    precision: "integer cents, ceil"
    input_set: "the protocol row; reservations from ACCEPTED referrals and ARRIVED referrals whose enrollment is not yet ENROLLED"

  - name: protocol_research_day_accrual
    trigger: "every POST /travel-arrangements/{travelId}/disburse"
    algorithm: aggregation
    formula: |
      protocol.committed_cents += bills the family-research-day charge for the leg
        = the same resolved_per_traveler_day_cents used by final_family_day_charge
      available_cents = protocol_budget_cents - reserved_cents - committed_cents
    precision: "integer cents, exact"
    input_set: "the enrollment's protocol; the disbursed leg's family_day_units and the family's household_state_code"

  - name: family_stimulation_markup
    trigger: "any allowance accrual into a FamilyServiceLedger"
    algorithm: threshold
    formula: |
      markup = min(base_allowance_cents * stimulation_rate, stimulation_cap_cents)
      applied only when the service is_stimulation_eligible AND the ledger status == ACTIVE
      ResearchFund.research_balance_cents += markup
      ResearchFund.patient_support_balance_cents -= base_allowance_cents
    constants:
      NONE: 0
    precision: "integer cents, round_half_up on the product"
    input_set: "the service line, its ledger posture, and the fund"

  - name: fundraising_split_at_commitment
    trigger: "Referral acceptance, and every later ResearchFund read"
    algorithm: forward_looking
    formula: |
      ClinicalProtocol.protocol_budget_cents is supplied at creation and may not exceed
        ceil(0.75 * (fund.fundraising_raised_cents - fund.federal_grant_cents) / max(1, protocol_count_for_fund))
      fund.research_balance_cents           += ceil(research_allocation_pct * fund.fundraising_raised_cents)
      fund.patient_support_balance_cents    += (fundraising_raised_cents - federal_grant_cents)
                                              - ceil(research_allocation_pct * fundraising_raised_cents)
      Each fund value is re-derived on every read of the fund; protocol_budget_cents stays fixed at creation.
    constants:
      COMMITMENT_SHARE: 0.75
    precision: "integer cents; commitment rounded down with floor, fund split rounded up with ceil"
    variants:
      - name: at_commitment
        when: "the fund is read immediately after creation, before any additional donation"
        difference: "research_balance_cents and patient_support_balance_cents derive from the creation-time fundraising_raised_cents"
      - name: after_additional_donation
        when: "the fund is read after POST /research-funds/{id}/donations records more money"
        difference: "the same two pools re-derive from the larger fundraising_raised_cents, so reading the fund back gives different totals than the creation response while protocol_budget_cents is unchanged"

  - name: housing_tier_selector
    trigger: "Referral screening, and every POST /housing-assignments or PUT /housing-assignments/{id} that needs a facility"
    algorithm: constraint_propagation
    formula: |
      selector_window_days = min(expected_treatment_days, 540)
      duration_steps       = ceil(selector_window_days / 180)
      required_tier =
        ON_CAMPUS        when is_immunosuppressed is true OR has_febrile_neutropenia_risk is true
        PARTNER_CLASS_C  when duration_steps == 1
        PARTNER_CLASS_A  when duration_steps == 2
        PARTNER_CLASS_B  when duration_steps >= 3
      The clamp is applied before the band count, so 900 declared days and 540 declared days
      both resolve to selector_window_days 540 and duration_steps 3.
      Candidate filter: HousingFacility.status == OPEN.
      Ranking: lowest index of the facility tier in [ON_CAMPUS, PARTNER_CLASS_A, PARTNER_CLASS_B, PARTNER_CLASS_C]
        among facilities whose tier is at least as capable as required_tier, then highest
        immunosuppression_capable, then highest (total_beds - buffer_beds).
      Tie-break on an exact ranking tie: lowest HousingFacility.created_at, then lowest facility_code (lexicographic).
      Empty candidate set: ERR_NO_HOUSING_AVAILABLE and applied_tier DECLINED.
    constants:
      DURATION_CLAMP_DAYS: 540
      STEP_BAND_DAYS: 180
    precision: "integer steps, ceil"

  - name: housing_occupancy_charge
    trigger: "every HousingAssignment create, re-booking, activation and facility read"
    algorithm: threshold
    formula: |
      billed_nights = whole days between start_at and end_at
      chargeable_nights = min(billed_nights, 180)
      nightly_rate_cents =
        19000 when tier == ON_CAMPUS
        15000 when tier == PARTNER_CLASS_A
        13000 when tier == PARTNER_CLASS_B
        11000 when tier == PARTNER_CLASS_C
      housing_cost_cents = chargeable_nights * nightly_rate_cents
      The 180-night clamp is per booking, so a 900-night window and a 180-night window at
      the same tier price identically.
    constants:
      ON_CAMPUS_NIGHTLY_CENTS: 19000
      PARTNER_CLASS_A_NIGHTLY_CENTS: 15000
      PARTNER_CLASS_B_NIGHTLY_CENTS: 13000
      PARTNER_CLASS_C_NIGHTLY_CENTS: 11000
      NIGHT_CLAMP: 180
    precision: "integer cents, exact"

  - name: sibling_monthly_limit
    trigger: "every sibling service session delivery; reset on every housing occupancy boundary"
    algorithm: aggregation
    formula: |
      sessions_per_window =
        4 when upper(household_state_code IN NEAR_STATES)
        6 otherwise
      has_reached_monthly_limit = sessions_delivered >= sessions_per_window
      The counter is cumulative and resets to 0 when the enrollment's housing occupancy ends.
    constants:
      NEAR_WINDOW_LIMIT: 4
      DEFAULT_WINDOW_LIMIT: 6
    precision: "integer; boundary is inclusive at the limit"

  - name: travel_accumulation_charge
    trigger: "historic travel legs, recomputed whenever a leg is re-costed or the coverage set is trimmed"
    algorithm: chronological
    formula: |
      Select every TravelArrangement leg for this enrollment with status IN {CONFIRMED, DISBURSED}.
      Order chronologically by departure_at, ties broken by created_at ascending.
      Attach the most recent placed coverage whose travel window contains departure_at; when
      several qualify, the highest coverage_cents wins, ties broken by created_at ascending.
      chargeable_mode = true when that coverage's covers_required_travel is true, else
      true only when the leg's trip_reason is required travel.
      The accumulated family-day charge is the sum over chargeable legs of
      family_day_units * resolved_per_traveler_day_cents.
      Re-sorting or re-costing the same legs from different directions yields a different total.
    precision: "integer cents, exact; no rounding after the per-leg product"
    input_set: "legs in CONFIRMED or DISBURSED; legs in REQUESTED or CANCELLED are excluded entirely"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and resolvable"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints
  - priority: 2
    category: auth
    check: "Role must be permitted for the operation per the RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints
  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left to right; the entity-specific code is returned where one is declared (ERR_REFERRAL_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_HOUSING_ASSIGNMENT_NOT_FOUND, ERR_HOUSING_FACILITY_NOT_FOUND, ERR_PLEDGE_NOT_FOUND, ERR_TRAVEL_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_STUDY_NOT_FOUND, ERR_SURVIVORSHIP_ENROLLMENT_NOT_FOUND, ERR_CLINIC_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_SERVICE_NOT_FOUND, ERR_LEDGER_NOT_FOUND, ERR_FUND_NOT_FOUND, ERR_SIBLING_SERVICE_NOT_FOUND, ERR_HOLD_NOT_FOUND)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints with a path id
  - priority: 3.5
    category: business_referential
    check: "Body foreign keys must exist, in the order the endpoint's input list declares them"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints carrying a foreign key in the body"
  - priority: 4
    category: business_constraint
    check: "Uniform request hygiene: all required body fields present, integer ranges honoured, start_at strictly before end_at, and a declined referral is re-opened only through POST /referrals naming it in reopen_source_referral_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint with a body"
  - priority: 5
    category: business_constraint
    check: "Declared uniqueness: protocol_code unique across the program; facility_code and clinic_code unique across the program; service_code unique within fund_id; sibling_alias unique within enrollment_id"
    error_id: ERR_DUPLICATE_ENTITY
    http_status: 409
    applies_to: "POST /clinical-protocols, POST /housing-facilities, POST /affiliate-clinics, POST /family-support-services, POST /enrollments/{id}/sibling-services"
  - priority: 3.6
    category: business_constraint
    check: "OCC guard: when an expected_*_version field is supplied it must equal the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /referrals/{id}/screen, POST /referrals/{id}/arrive"
  - priority: 6
    category: state
    check: "Sibling delivery: a service whose has_reached_monthly_limit is already true may not accept further sessions until the counter resets"
    error_id: ERR_SIBLING_SESSION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /sibling-support-services/{id}/sessions"
  - priority: 6.1
    category: business_constraint
    check: "Ledger epoch guard: when ledger_epoch is supplied it must equal the ledger's current ledger_epoch"
    error_id: ERR_STALE_LEDGER_EPOCH
    http_status: 409
    applies_to: "POST /family-support-services/{id}/allowances"
  - priority: 6.2
    category: state
    check: "Target resource must be in the state required by the operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every endpoint that drives a transition"
  - priority: 7
    category: state
    check: "Host ClinicalProtocol must be OPEN and is_protocol_held false for every screen, arrival, enrollment and milestone operation"
    error_id: ERR_PROTOCOL_HELD
    http_status: 409
    applies_to: "screen, arrive, sign-consent, record-arm-assent, defer-visit, execute"
  - priority: 8
    category: business_safety
    check: "Immunosuppression gate: a HousingAssignment whose referral is_immunosuppressed true may only target a facility with immunosuppression_capable true, and tier ON_CAMPUS is mandatory for a febrile-neutropenia risk flag"
    error_id: ERR_HOUSING_IMMUNOSUPPRESSION_INCOMPATIBLE
    http_status: 422
    applies_to: "POST /referrals, PUT /housing-assignments/{assignmentId}"
  - priority: 9
    category: business_safety
    check: "Housing step-down gate: tier ON_CAMPUS cannot be released until the family's immunosuppression status has been cleared"
    error_id: ERR_STEP_DOWN_NOT_PERMITTED
    http_status: 422
    applies_to: "PUT /housing-assignments/{assignmentId}"
  - priority: 9.5
    category: business_constraint
    check: "One-to-one care eligibility: every GUARDIAN-type coverage placed by the referral must name a traveler in one_to_one_care_capability_codes"
    error_id: ERR_ONE_TO_ONE_CARE_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /enrollments/{id}/sign-consent"
  - priority: 10
    category: business_temporal
    check: "Housing capacity: at both endpoints of the proposed window, the count of assignments at the candidate facility in SCHEDULED or ACTIVE status whose half-open window covers that instant, plus buffer_beds, must not exceed total_beds"
    error_id: ERR_HOUSING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /referrals, POST /housing-assignments, PUT /housing-assignments/{assignmentId}"
  - priority: 11
    category: business_temporal
    check: "Travel leg overlap: a confirmed or disbursed leg for the same enrollment and mode may not overlap the proposed leg's window by one day or more"
    error_id: ERR_TRAVEL_LEG_OVERLAP
    http_status: 409
    applies_to: "POST /travel-arrangements/{travelId}/confirm, POST /travel-arrangements/{travelId}/disburse"
  - priority: 12
    category: business_constraint
    check: "Duplicate patient eligibility: no other Referral sharing the protected eligibility_alias may be in ACCEPTED or ARRIVED status"
    error_id: ERR_DUPLICATE_PATIENT_ELIGIBILITY
    http_status: 409
    applies_to: "POST /referrals/{referralId}/screen"
  - priority: 13
    category: business_constraint
    check: "Protocol capacity: enrolled_count must be strictly below capacity"
    error_id: ERR_PROTOCOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /referrals/{referralId}/screen, POST /enrollments/{enrollmentId}/sign-consent"
  - priority: 14
    category: business_constraint
    check: "Age band: computed_age_years must lie within [age_min_years, age_max_years] inclusive"
    error_id: ERR_AGE_OUTSIDE_PROTOCOL_RANGE
    http_status: 422
    applies_to: "POST /referrals/{referralId}/screen"
  - priority: 15
    category: business_constraint
    check: "Disease group and stage must both equal the protocol's declared values"
    error_id: ERR_DISEASE_GROUP_MISMATCH
    http_status: 422
    applies_to: "POST /referrals/{referralId}/screen"
  - priority: 16
    category: business_fiscal
    check: "Protocol research budget: protocol_budget_cents must fit the fund's commitment share at creation (ERR_PROTOCOL_BUDGET_EXCEEDS_COMMITMENT_SHARE), and available_cents must remain strictly positive after every reservation (ERR_PROTOCOL_BUDGET_EXHAUSTED)"
    error_id: ERR_PROTOCOL_BUDGET_EXHAUSTED
    http_status: 402
    applies_to: "POST /referrals/{referralId}/screen, POST /enrollments/{enrollmentId}/sign-consent"
  - priority: 10.5
    category: business_constraint
    check: "Covered-service invariant: treatment, housing, meals and required travel are never billable, so billing_permitted_cents on any pledge may only ever hold the excess of the final family charge over budget plus insurance"
    error_id: ERR_BILLING_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /family-support-pledges/{id}/settle, POST /family-support-pledges/{id}/accrue, POST /housing-assignments/{id}/activate"
  - priority: 17
    category: business_fiscal
    check: "Family-support budget: the final charge must not exceed budget plus insurance coverage"
    error_id: ERR_SUPPORT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /family-support-pledges/{pledgeId}/settle, POST /family-support-pledges/{pledgeId}/accrue"
  - priority: 18
    category: business_temporal
    check: "Survivorship follow-up windows must advance by exactly one interval per logged visit, and no visit may be logged before the previous one"
    error_id: ERR_FOLLOW_UP_WINDOW_VIOLATION
    http_status: 409
    applies_to: "POST /survivorship-enrollments/{id}/follow-ups"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock -----------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. The server's startup default is 2026-09-01T00:00:00Z and it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["logical clock set to current_utc"]

  # --- Research funds ----------------------------------------------------------
  - method: POST
    path: "/programs/research-funds"
    description: "Create a donor-funded campaign"
    roles: [PlatformAdmin]
    code: 201
    input: [fund_code, fiscal_year, "fundraising_raised_cents?", research_allocation_pct, "federal_grant_cents?"]
    output: ResearchFund
    side_effects: ["research_balance_cents and patient_support_balance_cents initialized by fundraising_split_at_commitment"]
  - method: GET
    path: "/programs/research-funds"
    description: "List research funds"
    roles: [Any]
    code: 200
    input: []
    output: "ResearchFund[]"
    side_effects: []
  - method: GET
    path: "/programs/research-funds/{id}"
    description: "Get a research fund"
    roles: [Any]
    code: 200
    input: []
    output: ResearchFund
    side_effects: ["re-derives the fund split per fundraising_split_at_commitment"]
  - method: POST
    path: "/programs/research-funds/{id}/donations"
    description: "Record an additional donation and re-derive the fund split"
    roles: [PlatformAdmin]
    code: 201
    input: [amount_cents, "is_federal_grant?"]
    output: ResearchFund
    side_effects:
      - "fundraising_raised_cents or federal_grant_cents increased"
      - "research_balance_cents and patient_support_balance_cents re-derived"
      - "increments ResearchFund.version by 1"

  # --- Clinical protocols ------------------------------------------------------
  - method: POST
    path: "/programs/clinical-protocols"
    description: "Create a clinical protocol"
    roles: [ProtocolCoordinator]
    code: 201
    input: [fund_id, protocol_code, disease_group, age_min_years, age_max_years, required_stage, protocol_budget_cents, capacity]
    output: ClinicalProtocol
    side_effects: ["status = DRAFT", "age_tier and mental_capacity_floor computed"]
  - method: GET
    path: "/programs/clinical-protocols"
    description: "List clinical protocols"
    roles: [Any]
    code: 200
    input: ["fund_id?"]
    output: "ClinicalProtocol[]"
    side_effects: []
  - method: GET
    path: "/programs/clinical-protocols/{id}"
    description: "Get a clinical protocol"
    roles: [Any]
    code: 200
    input: []
    output: ClinicalProtocol
    side_effects: []
  - method: POST
    path: "/programs/clinical-protocols/{id}/open"
    description: "Open a draft protocol for referrals"
    roles: [ProtocolCoordinator]
    code: 200
    input: []
    output: ClinicalProtocol
    side_effects: ["status -> OPEN", "increments ClinicalProtocol.version by 1"]
  - method: POST
    path: "/programs/clinical-protocols/{id}/close"
    description: "Close an open protocol"
    roles: [ProtocolCoordinator]
    code: 200
    input: [close_reason]
    output: ClinicalProtocol
    side_effects:
      - "status -> CLOSED"
      - "studies on this protocol -> CLOSED"
      - "pledges on withdrawn enrollments voided"
  - method: POST
    path: "/programs/clinical-protocols/{id}/release-hold"
    description: "Release the freeze on a held protocol"
    roles: [ProtocolCoordinator]
    code: 200
    input: []
    output: ClinicalProtocol
    side_effects: ["status -> OPEN", "is_protocol_held -> false"]
  - method: GET
    path: "/programs/clinical-protocols/{id}/funding-posture"
    description: "Read a protocol's live funding posture: its OCC version alongside the reservation, saturation and enrollment counters derived from the referral funnel"
    roles: [Any]
    code: 200
    input: []
    output: { protocol_id: string, protocol_version: integer, protocol_status: string, capacity: integer, enrolled_count: integer, protocol_budget_cents: integer, reserved_cents: integer, committed_cents: integer, available_cents: integer, is_budget_saturated: boolean, is_protocol_held: boolean }
    side_effects: []
  - method: GET
    path: "/programs/clinical-protocols/{id}/referrals"
    description: "List referrals screened against this protocol"
    roles: [Any]
    code: 200
    input: ["status?"]
