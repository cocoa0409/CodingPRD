            - "after second resubmit: status == UNDER_REVIEW and applicant_hold_days == 5 (3 + days in (2026-05-04, 2026-05-06])"
            - "Application.version == 7 after second resubmit (create 1, submit 2, start-review 3, req-rev 4, resubmit 5, req-rev 6, resubmit 7)"

      - name: inspection_fail_remediate_reschedule_cycle
        grounds:
