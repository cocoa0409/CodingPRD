# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3272_registry_operations_renewal_grace_periods_registrar_accreditation
#
# Breadth probe: every claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: registrar_create_returns_all_fields_and_pending_tests
        claim_type: Creation
        grounds:
          - entities.Registrar
          - endpoints.POST_/registrars
        distinguishing_aspect: "A registrar created with the seven required inputs returns 201 with status PENDING_TESTS, version 1, system id/created_at/updated_at, accredited_on null, and annual_fee_mode absent until accreditation."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z (no set call). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /registry/registrars"
              payload: { iana_number: 9001, legal_name: "Fresh Registrar Co", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 85, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
          assert:
            - "response status 201, response_type object"
            - "Registrar.${reg_id}.status == PENDING_TESTS and version == 1"
            - "Registrar.${reg_id}.accredited_on is null and credit_hold == false (default applied)"
            - "response carries non-null id, created_at, updated_at and the meta block"

      - name: domain_create_missing_years_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Domain.fields.years
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "years is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST — distinct from a 422/409 business rejection of an out-of-range value."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9002, legal_name: "ReqField Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/domains"
              payload: { name: "missing-years", registrar_id: "${reg_id}" }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /domains?registrar_id=${reg_id} returns 0 rows"

      - name: domain_create_omitting_premium_defaults_false_and_no_surcharge
        claim_type: Defaults
        grounds:
          - entities.Domain.fields.premium
          - calculations.lifecycle_invoice
        distinguishing_aspect: "premium defaults to false, so a 1-year create at 700 base mints an invoice with premium_surcharge_cents == 0 and total_cents == 700 exactly."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9003, legal_name: "Default Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/domains"
              payload: { name: "default-premium", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registry/invoices"
              payload: { domain_id: "${dom_id}", kind: "CREATE" }
              as: RegistryFinance
              captures: { inv_total: "$.data[0].total_cents", inv_surcharge: "$.data[0].premium_surcharge_cents" }
          assert:
            - "Domain.${dom_id}.premium == false"
            - "the CREATE invoice has base_cents == 700, premium_surcharge_cents == 0, total_cents == 700"

      - name: registrar_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/registrars/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated registrar id returns 404 ERR_NOT_FOUND with the error envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /registry/registrars/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and error_id == ERR_NOT_FOUND"
            - "response_type == error and data carries error_id and message"

      - name: registrars_list_paginates_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/registrars
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three registrars, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Three registrars created."
          setup_api_calls:
            - call: "POST /registry/registrars"
              payload: { iana_number: 9011, legal_name: "Page One", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 80, financial_statement_verified: true }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9012, legal_name: "Page Two", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 81, financial_statement_verified: true }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9013, legal_name: "Page Three", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 82, financial_statement_verified: true }
              as: RegistryAdmin
          trigger:
            - call: "GET /registry/registrars"
              payload: { limit: 2, offset: 0 }
              as: RegistryAdmin
          assert:
            - "response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /registrars?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /registrars with no params returns 3 rows under default limit 10 offset 0"

      - name: domain_name_uniqueness_excludes_deleted_rows
        claim_type: Type Constraints
        grounds:
          - entities.Domain.fields.name
          - errors.ERR_DOMAIN_NAME_TAKEN
        distinguishing_aspect: "A second create of a live name fails with ERR_DOMAIN_NAME_TAKEN, but once the first row reaches DELETED the same name is registrable again — the uniqueness constraint's scope is non-DELETED rows only."
        test_recipe:
          setup:
            - "Clock 2026-01-15, schedule effective, ACTIVE registrar, domain 'recyclable' created 1y, deleted 2026-01-15, redemption 30d + pending 5d purged by clock at 2026-02-20."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9014, legal_name: "Recycle Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "recyclable", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom1: $.data.id }
          trigger:
            - call: "POST /registry/domains"
              payload: { name: "recyclable", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /registry/domains/${dom1}/delete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "recyclable", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom2: $.data.id }
          assert:
            - "the second create while the first is live fails 409 ERR_DOMAIN_NAME_TAKEN"
            - "after purge (PENDING_DELETE -> DELETED by 2026-02-19), the re-create succeeds with a new Domain id ${dom2} != ${dom1}"
            - "Domain.${dom1}.status == DELETED"

      - name: domain_nameserver_link_is_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.DomainNameserverLink
        distinguishing_aspect: "DomainNameserverLink has common_fields: false — it carries id and created_at only, no version field and no updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar, domain, nameserver."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9015, legal_name: "Link Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "link-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/nameservers"
              payload: { hostname: "ns1.link-domain.example", ip_addresses: ["192.0.2.1"], capacity_qps: 3000 }
              as: RegistryAdmin
              captures: { ns_id: $.data.id }
          trigger:
            - call: "POST /registry/domains/${dom_id}/nameservers"
              payload: { nameserver_id: "${ns_id}" }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { link_id: $.data.id }
          assert:
            - "the link response carries id and created_at and carries NO version and NO updated_at field"
            - "GET /domains/${dom_id}/nameservers returns exactly 1 row linking ${dom_id} to ${ns_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: renew_from_pending_delete_is_invalid_state_terminal_lockdown
        claim_type: invalid_transition
        grounds:
          - state_machines.Domain
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "PENDING_DELETE is one-way: renew, restore, delete, and transfer-request from PENDING_DELETE all fail with ERR_INVALID_STATE, and DELETED accepts no transitions at all."
        test_recipe:
          setup:
            - "Clock 2026-01-15, schedule effective, ACTIVE registrar, domain created and deleted; clock advanced into PENDING_DELETE (2026-02-16)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9021, legal_name: "Terminal Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "terminal-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/domains/${dom_id}/delete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-16T00:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/domains/${dom_id}/renew"
              payload: { years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err_renew: $.data.error_id }
            - call: "POST /registry/domains/${dom_id}/restore"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { err_restore: $.data.error_id }
          assert:
            - "both renew and restore from PENDING_DELETE return 409 ERR_INVALID_STATE"
            - "Domain.${dom_id}.status remains PENDING_DELETE with no side effects (no new invoices)"

      - name: abuse_report_requeue_cycle_returns_to_filed
        claim_type: Valid Transition
        grounds:
          - state_machines.AbuseReport.UNDER_REVIEW_to_FILED
        distinguishing_aspect: "The FILED -> UNDER_REVIEW -> FILED cycle is legal: requeue returns the report to FILED with no domain side effect, and a subsequent review moves it forward again."
        test_recipe:
          setup:
            - "Clock 2026-02-01, schedule effective, ACTIVE registrar with an ACTIVE domain; abuse report filed and moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9022, legal_name: "Abuse Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "abused-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/abuse-reports"
              payload: { domain_id: "${dom_id}", reporter_contact: "user@example.com", category: "SPAM", detail: "spam farm" }
              as: AbuseAnalyst
              captures: { rep_id: $.data.id }
            - call: "POST /registry/abuse-reports/${rep_id}/review"
              payload: {}
              as: AbuseAnalyst
          trigger:
            - call: "POST /registry/abuse-reports/${rep_id}/requeue"
              payload: {}
              as: AbuseAnalyst
              captures: { st: $.data.status }
          assert:
            - "AbuseReport.${rep_id}.status == FILED after requeue"
            - "Domain.${dom_id}.suspension_status remains NONE (no side effect from the cycle)"
            - "a subsequent POST /abuse-reports/${rep_id}/review succeeds again"

      - name: court_order_deferred_enforcement_at_48_hours
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CourtOrder.LODGED_to_ENFORCED
        distinguishing_aspect: "A court order with effective_immediately=false stays LODGED at +47h and enforces at +48h: SUSPEND flips Domain.suspension_status to HOLD exactly at the deferred instant, not at lodge time."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00Z, schedule effective, ACTIVE registrar with ACTIVE domain. Court order lodged with effective_immediately=false."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9023, legal_name: "Court Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "court-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
            - call: "POST /registry/court-orders"
              payload: { case_reference: "CASE-2026-001", domain_id: "${dom_id}", action: "SUSPEND", effective_immediately: false }
              as: RegistryAdmin
              captures: { co_id: $.data.id }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T23:00:00Z" }
              as: RegistryAdmin
          trigger:
            - call: "GET /registry/court-orders/${co_id}"
              payload: {}
              as: RegistryAdmin
              captures: { st_47: $.data.status }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:01Z" }
              as: RegistryAdmin
            - call: "GET /registry/court-orders/${co_id}"
              payload: {}
              as: RegistryAdmin
              captures: { st_48: $.data.status }
            - call: "GET /registry/domains/${dom_id}"
              payload: {}
              as: RegistryAdmin
              captures: { susp: $.data.suspension_status }
          assert:
            - "at +47h the order is still LODGED and the domain suspension_status is NONE"
            - "at +48h1s the order is ENFORCED and Domain.${dom_id}.suspension_status == HOLD"
            - "a subsequent renew attempt on the domain fails 409 ERR_DOMAIN_SUSPENDED"

      - name: registrar_terminate_blocked_by_live_domain
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Registrar.ACTIVE_to_TERMINATED
          - errors.ERR_REGISTRAR_HAS_LIVE_DOMAINS
        distinguishing_aspect: "Termination is refused while any sponsored domain is in a non-terminal lifecycle state; after the domain reaches DELETED, termination succeeds and posts the escrow WRITE_OFF."
        test_recipe:
          setup:
            - "Clock 2026-01-15, schedule effective, ACTIVE registrar with one ACTIVE domain (escrow 1000000)."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9024, legal_name: "Terminable Registrar", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_id: $.data.id }
            - call: "POST /registry/registrars/${reg_id}/accredit"
              payload: {}
              as: RegistryAdmin
            - call: "POST /registry/domains"
              payload: { name: "blocking-domain", registrar_id: "${reg_id}", years: 1 }
              as: RegistrarOperator
              as_user_id: "${reg_id}"
              captures: { dom_id: $.data.id }
          trigger:
            - call: "POST /registry/registrars/${reg_id}/terminate"
              payload: {}
              as: RegistryAdmin
              captures: { err: $.data.error_id }
            - call: "POST /registry/domains/${dom_id}/delete"
              payload: {}
              as: RegistrarOperator
              as_user_id: "${reg_id}"
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-20T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars/${reg_id}/terminate"
              payload: {}
              as: RegistryAdmin
              captures: { st: $.data.status }
            - call: "GET /registry/registrars/${reg_id}/ledger"
              payload: {}
              as: RegistryFinance
          assert:
            - "the first terminate fails 409 ERR_REGISTRAR_HAS_LIVE_DOMAINS"
            - "after the domain purges to DELETED, terminate succeeds: Registrar.${reg_id}.status == TERMINATED"
            - "the ledger contains a WRITE_OFF entry of +1000000 (escrow returned)"

      - name: transfer_auto_ack_after_five_days_of_silence
        claim_type: Valid Transition
        grounds:
          - state_machines.Transfer.REQUESTED_to_AUTO_ACKED
        distinguishing_aspect: "A REQUESTED transfer auto-acks when the clock passes requested_at + 5 days with no ack/nack: at +4d23h it is still REQUESTED; at +5d1s it is AUTO_ACKED and the gaining registrar can complete."
        test_recipe:
          setup:
            - "Clock 2026-01-01, schedule effective, registrars A and B ACTIVE, domain by A at 2026-01-02. Clock 2026-03-10T00:00:00Z; transfer requested."
          setup_api_calls:
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/price-schedules"
              payload: { create_fee_cents: 700, renew_fee_cents: 850, restore_fee_cents: 12000, transfer_fee_cents: 700, effective_on: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /registry/registrars"
              payload: { iana_number: 9025, legal_name: "AutoAck A", application_fee_cents: 250000, annual_fee_cents: 400000, escrow_deposit_cents: 1000000, technical_test_score: 90, financial_statement_verified: true }
              as: RegistryAdmin
              captures: { reg_a: $.data.id }
