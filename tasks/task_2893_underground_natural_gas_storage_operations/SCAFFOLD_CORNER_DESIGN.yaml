      - name: ticket_reversal_locked_by_a_submitted_report_until_the_agency_rejects_it
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GasMovementTicket.transitions.CONFIRMED_to_REVERSED
          - validations.priority_31_ERR_REPORTING_PERIOD_LOCKED
          - endpoints[POST /regulatory-reports/{id}/record-agency-response]
          - errors.ERR_REPORTING_PERIOD_LOCKED
        distinguishing_aspect: |
          The lock is period-scoped and status-scoped, not permanent: a SUBMITTED
          INVENTORY_VERIFICATION report covering 2026-08-01..2026-08-31 freezes the 2026-08-20
          ticket (409), and recording an agency outcome of REJECTED — a state change on a completely
          different aggregate — unlocks the very same call, which then restores every quantity the
          confirm had moved.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1; shipper NORTHLINE with ACTIVE FIRM contract CN-1."
            - "A nomination of 80000 Dth INJECTION for gas day 2026-08-20 is CONFIRMED and its 76000 Dth ticket is CONFIRMED, so working gas is 326000 and book_inventory_dth snapshots as 326000.000."
            - "officer-a prepares an INVENTORY_VERIFICATION report for 2026-08-01..2026-08-31 with measured_inventory_dth 326000 and officer-b submits it."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: SchedulingCoordinator
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-20", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${w1}", actual_volume_dth: 76000 }
              as: FieldOperator
              captures: { t1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
            - call: "POST /gas-movement-tickets/${t1}/confirm"
              payload: { expected_storage_field_version: "${fv1}" }
              as: FieldOperator
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 326000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { rp1: $.data.id }
            - call: "POST /regulatory-reports/${rp1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
          trigger:
            - call: "POST /gas-movement-tickets/${t1}/reverse"
              payload: { reversal_reason: "chart integration error" }
              as: FieldOperator
