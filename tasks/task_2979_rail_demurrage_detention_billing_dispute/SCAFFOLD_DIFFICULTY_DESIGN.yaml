            - "the first release does NOT return 402 and does NOT return ERR_CUSTOMER_CREDIT_HOLD, although billing_posture is already CREDIT_HOLD"
            - "the second release, after only the access_mode changed, returns 402 with error_id ERR_CUSTOMER_CREDIT_HOLD"
            - "the two attempts are byte-identical requests: only the shadowing violation was removed between them"
            - "after both attempts PlacementCycle.${cyc_id}.movement_status is still ACTUALLY_PLACED with released_at null and chargeable_days 0"
            - "after both attempts the charge is still PROVISIONAL and no AverageAgreement day count moved"
            - "Facility.${fac_id}.access_mode is OPEN and Customer.${cust_id}.billing_posture is CREDIT_HOLD at the end"

      - name: role_forbidden_403_outranks_missing_invoice_404
        grounds:
          - validations.priority_20_role_forbidden
          - validations.priority_30_invoice_existence
          - errors.ERR_ROLE_FORBIDDEN
          - errors.ERR_INVOICE_NOT_FOUND
        distinguishing_aspect: |
          The cheapest possible priority pair, and the one most often inverted by
          frameworks that resolve the path parameter before consulting the RBAC
          table: a RailroadAgent addressing an invoice id that exists nowhere in
          the database must be told 403 ERR_ROLE_FORBIDDEN, never 404. Ordering
          role above existence is a privacy property — a 404 would confirm to an
          unauthorised caller that the id is unknown, and a 200-shaped absence
          would confirm the opposite. Requires zero setup, so it also proves the
          ladder short-circuits before any database read.
        test_recipe:
          setup:
            - "no fixtures at all: the database may be empty"
            - "the id 00000000-0000-0000-0000-00000000dead is guaranteed absent"
          setup_api_calls: []
          trigger:
            - call: "POST /demurrage/invoices/00000000-0000-0000-0000-00000000dead/issue"
              payload: {}
              as: RailroadAgent
              as_user_id: "agent-r5i3"
              captures: { err_role: $.data.error_id }
            - call: "POST /demurrage/invoices/00000000-0000-0000-0000-00000000dead/issue"
              payload: {}
              as: BillingAdmin
              as_user_id: "admin-r5i3"
              captures: { err_missing: $.data.error_id }
          assert:
            - "the RailroadAgent attempt returns 403 with error_id ERR_ROLE_FORBIDDEN"
            - "the RailroadAgent attempt does NOT return 404 and does NOT return ERR_INVOICE_NOT_FOUND"
            - "the BillingAdmin attempt against the SAME absent id returns 404 with error_id ERR_INVOICE_NOT_FOUND"
            - "the 404 proves the id really is absent, so the 403 was genuinely shadowing a live existence violation"
            - "neither attempt creates, mutates or version-bumps anything"
            - "the same inversion holds for every other role-gated single-resource action, e.g. a Customer calling POST /demurrage/tariff-rule-sets/{absent}/publish"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: release_at_gate_close_hour_to_the_millisecond_adds_a_tier_two_day
        grounds:
          - calculations.demurrage_chargeable_days
          - calculations.tiered_charge_amount
          - entities.Facility.fields.gate_close_hour
          - entities.DemurrageCharge.fields.chargeable_days
        distinguishing_aspect: |
          The release-day rule is a closed lower bound at the gate-close hour and
          the comparison is millisecond-exact: two cars with byte-identical
          histories, released one millisecond apart across 2026-08-11T16:00:00Z,
          are billed 3 days / 47550 and 4 days / 70000. The extra day is a tier-2
          day at 22450, not a tier-1 day at 12550, so an off-by-one-millisecond
          implementation is wrong by 22450 cents rather than by the base rate.
        test_recipe:
          setup:
            - "logical clock at 2026-08-11T16:00:00Z"
            - "one INDUSTRY_TRACK Facility with gate_close_hour 16, car_spot_capacity 3, switch_buffer_minutes 0"
            - "two RAILROAD_OWNED cars on identical timelines: CP 2026-08-03T08:00:00Z, EDI notice 09:00:00Z, AP 2026-08-05T10:00:00Z, clock_basis ACTUAL, free_time_expires_at 2026-08-07T23:59:59.999Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R6I1-CUST", name: "Millisecond Minerals", serving_station_code: "STN14", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R6I1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R6I1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R6I1-BNSF11", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_e_id: $.data.id, car_e_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R6I1-BNSF12", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_l_id: $.data.id, car_l_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_e_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R6I1-EARLY", expected_rail_car_version: "${car_e_v}" }
              as: RailroadAgent
              captures: { cyc_e_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_l_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R6I1-LATE", expected_rail_car_version: "${car_l_v}" }
              as: RailroadAgent
              captures: { cyc_l_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_e_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_e_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_e_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_l_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_l_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_l_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T16:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_e_id}/release"
              payload: { released_at: "2026-08-11T15:59:59.999Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/placement-cycles/${cyc_l_id}/release"
              payload: { released_at: "2026-08-11T16:00:00.000Z" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "both cycles had free_time_expires_at 2026-08-07T23:59:59.999Z before release"
            - "the 15:59:59.999Z release gives PlacementCycle.${cyc_e_id}.chargeable_days == 3 and a FINAL charge of 47550 == 12550 + 12550 + 22450"
            - "the 16:00:00.000Z release gives PlacementCycle.${cyc_l_id}.chargeable_days == 4 and a FINAL charge of 70000 == 12550 + 12550 + 22450 + 22450"
            - "the boundary is CLOSED at the gate-close hour: >= 16:00:00.000 charges the release day, < 16:00:00.000 does not"
            - "the one-millisecond difference is worth 22450 cents, the tier-2 rate, not 12550"
            - "both cycles show early_release_days == 0"
            - "a truncate-to-second implementation that reads 15:59:59.999 as 16:00:00 bills 70000 twice and is wrong on the early car"

      - name: hourly_storage_free_time_expires_on_a_closed_48_hour_bound
        grounds:
          - calculations.storage_dwell_charge
          - entities.Facility.fields.storage_free_hours
          - entities.Facility.fields.storage_clock_mode
          - entities.DemurrageCharge.fields.chargeable_days
        distinguishing_aspect: |
          The HOURLY_FROM_ARRIVAL clock subtracts free hours from an
          integer-millisecond dwell and then applies CEIL, so the free-time bound
          is CLOSED: a dwell of exactly 48 hours yields 0 storage days and 0
          cents, and 48 hours plus one millisecond yields a whole day at 9000.
          Unlike the gate-close boundary this one straddles zero, which is where
          a MAX(0, ...) guard and a naive CEIL disagree most loudly — CEIL of
          exactly 0.0 must stay 0, not become 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T09:00:00Z"
            - "one INTERMODAL_TERMINAL Facility with storage_clock_mode HOURLY_FROM_ARRIVAL, storage_free_hours 48, storage_daily_rate_cents 9000, operates_weekends true"
            - "two CONSTRUCTIVELY_PLACED cycles, both with constructive_placement_at 2026-08-03T08:00:00Z and no notification (storage does not require one)"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "R6I2-CUST", name: "Ceiling Container Line", serving_station_code: "STN15", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "R6I2-IMDL", kind: "INTERMODAL_TERMINAL", storage_clock_mode: "HOURLY_FROM_ARRIVAL", storage_free_hours: 48, storage_daily_rate_cents: 9000, operates_weekends: true, car_spot_capacity: 4, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "R6I2-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R6I2-TTPX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_x_id: $.data.id, car_x_v: $.data.version }
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "R6I2-TTPX02", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_y_id: $.data.id, car_y_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_x_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R6I2-EXACT", expected_rail_car_version: "${car_x_v}" }
              as: RailroadAgent
              captures: { cyc_x_id: $.data.id }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_y_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-R6I2-PLUS1MS", expected_rail_car_version: "${car_y_v}" }
              as: RailroadAgent
              captures: { cyc_y_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_x_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "YARD_ARRIVAL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_y_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "YARD_ARRIVAL" }
              as: RailroadAgent
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_x_id}/release"
              payload: { released_at: "2026-08-05T08:00:00.000Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/placement-cycles/${cyc_y_id}/release"
              payload: { released_at: "2026-08-05T08:00:00.001Z" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "the exactly-48-hour dwell gives chargeable_days == 0 and gross_amount_cents == 0 on the STORAGE charge of ${cyc_x_id}"
            - "the 48-hour-plus-one-millisecond dwell gives chargeable_days == 1 and gross_amount_cents == 9000 on the STORAGE charge of ${cyc_y_id}"
            - "both charges have charge_kind STORAGE and computation_basis STORAGE_HOURLY"
            - "CEIL is applied to the BILLABLE hours after the free deduction, and CEIL(0) must be 0: a bare CEIL over total dwell would bill both cars 1 day"
            - "the 0-cent charge is still FINAL and still attachable to an invoice: a zero charge is not a missing charge"
            - "neither charge uses the TariffRuleSet per-diem ladder, so 12550 must not appear"
            - "the two releases were made from CONSTRUCTIVELY_PLACED, never ACTUALLY_PLACED, which is legal at an intermodal terminal"

      - name: evidence_weight_discount_saturates_at_five_business_days

        grounds:
          - calculations.adjudication_timeline
          - entities.DemurrageDispute.fields.evidence_weight
          - entities.DemurrageDispute.fields.adjudication_due_at
          - entities.DisputeEvidence.fields.weight_points
        distinguishing_aspect: |
          The evidence discount is MIN(5, FLOOR(evidence_weight / 2)), so the
          function is flat above weight 10: a dispute with weight 10 and one with
          weight 12 both land on 2026-09-18T23:59:59.999Z. The boundary is on the
          DISCOUNT rather than on a date, and it is approached from inside — the
          fourth evidence document adds 2 real weight points that buy exactly
          nothing. An implementation without the MIN would move the second
