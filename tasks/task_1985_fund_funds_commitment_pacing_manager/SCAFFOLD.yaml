    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "CapitalCall[]"
    side_effects: []

  - method: GET
    path: "/fof/programs/{id}/distributions"
    description: "List all distributions across the program's commitments"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "Distribution[]"
    side_effects: []

  - method: GET
    path: "/fof/commitments/{commitmentId}"
    description: "Get one commitment by id (flat form)"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: []
    output: Commitment
    side_effects: []

  - method: GET
    path: "/fof/commitments/{id}/calls"
    description: "List calls for a commitment (flat form)"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "CapitalCall[]"
    side_effects: []

  - method: GET
    path: "/fof/commitments/{id}/distributions"
    description: "List distributions for a commitment (flat form)"
    roles: [CIO, Analyst, InvestmentCommittee, OperationsAnalyst, ComplianceOfficer]
    code: 200
    input: ["limit?, offset?, status?"]
    output: "Distribution[]"
    side_effects: []

  - method: GET
