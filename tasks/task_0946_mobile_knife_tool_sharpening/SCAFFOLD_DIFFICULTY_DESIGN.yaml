  - rule_id: transitive_cascade
    instances:
      - name: warranty_approval_rework_and_credit_depth_six_cascade
        grounds:
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.RequestItem.DELIVERED_to_REWORK_QUEUED
          - state_machines.RequestItem.DELIVERED_to_CUSTODY_CUSTOMER
          - state_machines.ServiceRequest.INVOICED_to_CREDITED
          - calculations.warranty_credit
          - calculations.invoice_totals
        distinguishing_aspect: |
          Approving the claim starts a six-link chain in which each hop is caused by the hop before
          it: claim APPROVED causes the item to become REWORK_QUEUED, which causes a REWORK
          ServiceRequest with a pre-assessed clone to be opened, which causes the workmanship credit
          to be emitted onto a DRAFT Invoice, which causes that invoice to be re-totalled, which
          causes the original request's billing axis to reach CREDITED. Its trigger is a warranty
          approval, distinct from the delivery trigger of the sibling cascade.
        test_recipe:
          setup:
            - "A CHEF_KNIFE item declared and assessed CHIP_REPAIR, delivered on 2026-05-01 by technician A, priced at 1440."
            - "A PER_VISIT Invoice for that visit, issued with total_cents 1544 (taxable 1440 plus tax 104)."
            - "A SUBMITTED WarrantyClaim on the item with credit_basis_cents 1440."
            - "The account has no DRAFT Invoice, so the credit must mint one."
