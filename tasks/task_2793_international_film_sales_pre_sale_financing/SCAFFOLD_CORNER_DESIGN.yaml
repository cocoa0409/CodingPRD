          - "endpoints[POST /film-sales/banking-facilities/{id}/completion-bond]"
          - entities.BankingFacility.fields.completion_bond_posted
        distinguishing_aspect: |
          UNBONDED_HAIRCUT 0.50 is applied AFTER the facility_cap min, not before: on eligible
