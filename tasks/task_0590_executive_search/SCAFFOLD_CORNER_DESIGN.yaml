            - call: "POST /search-assignments/${asg_id}/submit-slate"
              payload: { expected_assignment_version: "${asg_v_fresh}" }
              as: Consultant
              as_user_id: "${c_id}"
          assert:
            - "Stale attempt: HTTP status == 412 and ${err} == ERR_STALE_ASSIGNMENT_VERSION"
            - "Stale attempt leaves SearchAssignment.${asg_id}.sourcing_status == OPEN"
            - "Fresh attempt: HTTP status == 200 and SearchAssignment.${asg_id}.sourcing_status == SLATE_SUBMITTED"
            - "SearchAssignment.${asg_id}.version == ${asg_v_fresh} + 1 after the successful submit"

      - name: stale_expected_pipeline_entry_version_on_superseding_offer_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-create-stale-pipeline-entry]
          - errors[ERR_STALE_PIPELINE_VERSION]
          - state_machines.Offer.EXTENDED_to_DECLINED
          - entities.PipelineEntry.fields.version
        distinguishing_aspect: "The client captures the entry's version, an Offer is created + extended + declined against it (each bumping the entry's version), and a SUPERSEDING offer carrying the original expected_pipeline_entry_version is rejected 412 ERR_STALE_PIPELINE_VERSION — the create is otherwise perfectly legal, which is exactly why OCC is needed."
        test_recipe:
          setup:
            - "ACTIVE RETAINED engagement; assignment SLATE_SUBMITTED; entry at CLIENT_INTERVIEW with panel_final_fit_score 8.67."
            - "The client captured pe_v0 = the entry's version at CLIENT_INTERVIEW, before any offer existed."
          setup_api_calls:
            - call: "POST /consultants"
              payload: { full_name: "Pat Partner", seniority: "PARTNER" }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Cara Consultant", seniority: "PRINCIPAL" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Acme Corp", industry: "Industrials" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /companies"
              payload: { legal_name: "Zenith Ltd", industry: "Industrials" }
              as: PlatformAdmin
              captures: { target_id: $.data.id }
            - call: "POST /fee-schedules"
              payload: { name: "Retained Std", engagement_type: "RETAINED", base_fee_pct: 0.30, premium_fee_pct: 0.35, tier_threshold_cents: 25000000, contingent_fee_pct: 0.25, retainer_pct: 0.35, progress_pct: 0.35, admin_fee_pct: 0.02, guarantee_days: 180, off_limits_days: 365, client_protection_days: 730 }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_company_id: "${client_id}", fee_schedule_id: "${fs_id}", fee_cap_cents: 20000000 }
              as: Partner
              as_user_id: "${p_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
            - call: "POST /search-assignments"
              payload: { engagement_id: "${eng_id}", role_title: "CFO", positions_total: 1, target_first_year_comp_cents: 24000000 }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /target-companies"
              payload: { assignment_id: "${asg_id}", company_id: "${target_id}", rationale: "Peer set" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /candidates"
              payload: { full_name: "Kim Cand", current_employer_company_id: "${target_id}", current_title: "VP Finance", source_channel: "RESEARCH" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { cand_id: $.data.id }
            - call: "POST /pipeline-entries"
              payload: { assignment_id: "${asg_id}", candidate_id: "${cand_id}" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { pe_id: $.data.id }
            - call: "POST /pipeline-entries/${pe_id}/advance"
              payload: { to_stage: "SCREENED" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /interviews"
              payload: { pipeline_entry_id: "${pe_id}", interviewer_consultant_id: "${c_id}", start_at: "2026-05-04T09:00:00Z", end_at: "2026-05-04T10:00:00Z", mode: "VIDEO" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { iv1_id: $.data.id }
            - call: "POST /interviews/${iv1_id}/assessments"
              payload: { assessment_kind: "SCREEN", leadership_score: 8, functional_score: 8, culture_score: 8 }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /pipeline-entries/${pe_id}/advance"
              payload: { to_stage: "SHORTLISTED" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "GET /search-assignments/${asg_id}"
              payload: {}
              as: Consultant
              as_user_id: "${c_id}"
              captures: { asg_v: $.data.version }
            - call: "POST /search-assignments/${asg_id}/submit-slate"
              payload: { expected_assignment_version: "${asg_v}" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /pipeline-entries/${pe_id}/advance"
              payload: { to_stage: "CLIENT_INTERVIEW" }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "POST /interviews"
              payload: { pipeline_entry_id: "${pe_id}", interviewer_consultant_id: "${c_id}", start_at: "2026-05-06T09:00:00Z", end_at: "2026-05-06T10:00:00Z", mode: "ONSITE" }
              as: Consultant
              as_user_id: "${c_id}"
              captures: { iv2_id: $.data.id }
            - call: "POST /interviews/${iv2_id}/assessments"
              payload: { assessment_kind: "PANEL", leadership_score: 9, functional_score: 9, culture_score: 9 }
              as: Consultant
              as_user_id: "${c_id}"
            - call: "GET /pipeline-entries/${pe_id}"
              payload: {}
              as: Consultant
              as_user_id: "${c_id}"
              captures: { pe_v0: $.data.version }
            - call: "POST /offers"
              payload: { pipeline_entry_id: "${pe_id}", base_salary_cents: 22000000, bonus_cents: 4000000, start_date_at: "2026-06-01T00:00:00Z", expected_pipeline_entry_version: "${pe_v0}" }
              as: Partner
              as_user_id: "${p_id}"
              captures: { offer1_id: $.data.id }
            - call: "POST /offers/${offer1_id}/extend"
              payload: {}
              as: ClientContact
              as_user_id: "${client_id}"
            - call: "POST /offers/${offer1_id}/decline"
              payload: { decline_reason: "Wants more equity" }
              as: Consultant
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /offers"
              payload: { pipeline_entry_id: "${pe_id}", base_salary_cents: 24000000, bonus_cents: 4000000, start_date_at: "2026-06-01T00:00:00Z", expected_pipeline_entry_version: "${pe_v0}" }
              as: Partner
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
            - call: "GET /pipeline-entries/${pe_id}"
              payload: {}
              as: Partner
              as_user_id: "${p_id}"
              captures: { pe_v1: $.data.version }
            - call: "POST /offers"
              payload: { pipeline_entry_id: "${pe_id}", base_salary_cents: 24000000, bonus_cents: 4000000, start_date_at: "2026-06-01T00:00:00Z", expected_pipeline_entry_version: "${pe_v1}" }
              as: Partner
              as_user_id: "${p_id}"
              captures: { offer2_id: $.data.id, offer2_total: $.data.total_first_year_comp_cents }
          assert:
            - "Stale supersede: HTTP status == 412 and ${err} == ERR_STALE_PIPELINE_VERSION"
            - "Stale supersede leaves PipelineEntry.${pe_id}.stage == CLIENT_INTERVIEW"
            - "${pe_v1} == ${pe_v0} + 2 (the create bumped it once, the decline once more)"
            - "Fresh supersede: HTTP status == 201, ${offer2_total} == 28000000, Offer.${offer2_id}.status == DRAFT"
            - "PipelineEntry.${pe_id}.stage == OFFER_STAGE after the fresh supersede"
            - "GET /offers?pipeline_entry_id=${pe_id} returns total_count == 2 (the DECLINED one and the new DRAFT)"

  # =========================================================================
  # Section 9 — Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: acceptance_cascade_is_visible_immediately_in_the_same_request
        claim_type: immediate
        grounds:
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - calculations.assignment_position_ledger
        excluded_because:
          difficulty_instance: offer_accept_four_hop_placement_cascade
          rationale: "That §1.8 instance reads every cascade product (placement, seat ledger, sibling rejection, off-limits record) straight after the accept call with no intervening delay, which IS the immediate-consistency claim."

      - name: fall_off_compensation_leaves_no_ledger_drift
        claim_type: immediate
        grounds:
          - calculations.engagement_billed_ledger
        excluded_because:
          difficulty_instance: fee_ledger_conserved_across_completion_invoice_and_credit_note
          rationale: "Zero-drift reconciliation of the money ledger after the compensating cascade is asserted literally there."
