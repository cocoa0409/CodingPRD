            - call: "POST /staff-members"
              payload: { run_id: "${run_id}", full_name: "Ben Osei", staff_role: "AMBASSADOR", certifications: ["SCRIPTED_INTERACTION", "ADA_ASSIST", "EVACUATION_MARSHAL"], incident_count: 0 }
              as: ExperienceProducer
              as_user_id: "producer-1"
