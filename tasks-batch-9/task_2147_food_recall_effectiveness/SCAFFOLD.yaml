# =============================================================================
# PRD Benchmark Scaffold — Food Recall Execution & Effectiveness Check
# Difficulty target: ABOVE Expert (§0.4 Expert band, deliberately densified)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2147. Food Recall Execution & Effectiveness Check (FDA/USDA recall team): hazard evaluation & recall classification, distribution list reconstruction & consignee notification, press release & public warning decision, product retrieval accounting & effectiveness percentage, disposition (destroy/rework) verification, regulator status reporting cadence, insurance claim & cost accumulation, root cause & recall termination

domain_name: food-recall-effectiveness
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Recall is a hub; Consignee is self-referential (parent_consignee_id builds a
  # 3-deep distribution tree); DistributionRecord / ConsigneeNotification /
  # RetrievalReceipt are junction rows carrying BOTH recall_id and consignee_id.
  # No nesting deeper than one level appears in any URL path.

  state_machine_shape: parallel
  # ConsigneeNotification carries two independent dimensions (delivery_state ×
  # response_state). Recall, HazardEvaluation, PublicWarning, DispositionOrder,
  # StatusReport, InsuranceClaim and DistributionRecord each add cycles or
  # fork-join branches on top.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Firm
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Legal name of the recalling firm" }
      - { name: registration_number, type: string, source: input, description: "Food-facility registration number; unique across firms", constraints: "non-empty, unique" }
      - { name: policy_deductible_cents, type: integer, source: input, default: 2500000, description: "Product-recall insurance deductible in cents, applied BEFORE coinsurance", constraints: ">= 0" }
      - { name: policy_aggregate_cents, type: integer, source: input, default: 100000000, description: "Policy aggregate limit in cents across all claims of this firm", constraints: "> 0" }
      - { name: policy_paid_to_date_cents, type: integer, source: computed, default: 0, description: "Sum of paid_cents over all this firm's InsuranceClaim rows in status PARTIALLY_PAID or PAID" }
      - { name: open_recall_count, type: integer, source: computed, default: 0, description: "Count of this firm's Recall rows whose status is not TERMINATED" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: input, description: "FK -> Firm.id; the recalling firm that owns this recall case" }
      - { name: product_description, type: string, source: input, description: "Recalled product description" }
      - { name: agency, type: enum, source: input, description: "FDA | USDA — selects the official effectiveness basis (FDA=CONTACT, USDA=QUANTITY)", constraints: "FDA | USDA" }
      - { name: initiation_type, type: enum, source: input, description: "FIRM_INITIATED | AGENCY_REQUESTED | MANDATED", constraints: "FIRM_INITIATED | AGENCY_REQUESTED | MANDATED" }
      - { name: lot_codes, type: array, source: input, description: "Array of affected lot code strings", constraints: "at least one element" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CLASSIFIED | NOTIFICATION_IN_PROGRESS | RETRIEVAL_ACCOUNTING | EFFECTIVENESS_REVIEW | TERMINATION_REQUESTED | TERMINATED" }
      - { name: hazard_class, type: enum, source: system, default: null, description: "CLASS_I | CLASS_II | CLASS_III — set by POST /recalls/{id}/classify; null while DRAFT" }
      - { name: classified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RecallCoordinator who most recently classified this recall" }
      - { name: effectiveness_check_level, type: enum, source: computed, default: null, description: "A | B | C | D — recomputed on every classify; drives required_sample_size" }
      - { name: sample_tier_scope, type: integer, source: computed, default: 0, description: "Maximum Consignee.tier included in the effectiveness sample (A=3, B=2, C=2, D=1)" }
      - { name: eligible_consignee_count, type: integer, source: computed, default: 0, description: "Count of this recall's Consignee rows with tier <= sample_tier_scope" }
      - { name: required_sample_size, type: integer, source: computed, default: 0, description: "ceil(eligible_consignee_count * LEVEL_PCT[effectiveness_check_level]), floored at 1 when eligible_consignee_count > 0" }
      - { name: responded_count, type: integer, source: computed, default: 0, description: "Count of eligible consignees with at least one ConsigneeNotification whose delivery_state == DELIVERED and response_state IN {ACKNOWLEDGED, REFUSED}" }
      - { name: report_cadence_days, type: integer, source: computed, default: 0, description: "Days between periodic StatusReport periods; from hazard_class, overridden to 3 when compliance_flag == ESCALATED or DELINQUENT" }
      - { name: compliance_flag, type: enum, source: computed, default: "COMPLIANT", description: "COMPLIANT | WATCH | ESCALATED | DELINQUENT — derived posture gating termination and cadence" }
      - { name: overdue_report_count, type: integer, source: computed, default: 0, description: "Number of StatusReport rows of this recall that have ever flipped PENDING -> OVERDUE" }
      - { name: total_shipped_units, type: integer, source: computed, default: 0, description: "Sum of DistributionRecord.effective_quantity over all this recall's records" }
      - { name: accounted_units, type: integer, source: computed, default: 0, description: "Sum of RetrievalReceipt.accounted_units over this recall's receipts in status VERIFIED" }
      - { name: units_awaiting_disposition, type: integer, source: computed, default: 0, description: "Physical units in firm custody not yet handed to an executed DispositionOrder" }
      - { name: units_pending_verification, type: integer, source: computed, default: 0, description: "Units on DispositionOrder rows in status EXECUTED (executed but not yet field-verified)" }
      - { name: units_disposed_verified, type: integer, source: computed, default: 0, description: "Units on DispositionOrder rows in status VERIFIED" }
      - { name: contact_effectiveness_pct, type: number, source: computed, default: 0, description: "CONTACT_BASIS variant of effectiveness_percentage, 2 decimals" }
      - { name: quantity_effectiveness_pct, type: number, source: computed, default: 0, description: "QUANTITY_BASIS variant of effectiveness_percentage, 2 decimals" }
      - { name: official_effectiveness_pct, type: number, source: computed, default: 0, description: "contact_effectiveness_pct when agency == FDA, quantity_effectiveness_pct when agency == USDA" }
      - { name: total_loaded_cost_cents, type: integer, source: computed, default: 0, description: "Sum of CostEntry.line_loaded_cost_cents over this recall's entries in status ACCEPTED" }
      - { name: insurable_loaded_cost_cents, type: integer, source: computed, default: 0, description: "Sum of CostEntry.line_loaded_cost_cents over ACCEPTED entries whose insurable == true" }
      - { name: root_cause_code, type: enum, source: input, default: null, description: "SUPPLIER_INGREDIENT | SANITATION | PROCESS_DEVIATION | LABELING | PACKAGING | CROSS_CONTACT | UNKNOWN — supplied on request-termination" }
      - { name: capa_summary, type: string, source: input, default: null, description: "Corrective-and-preventive-action narrative supplied on request-termination" }
      - { name: termination_denied_count, type: integer, source: computed, default: 0, description: "Number of times decide-termination returned DENY on this recall" }
      - { name: terminated_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which the recall reached TERMINATED" }

  - name: HazardEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/hazard-evaluations" }
      - { name: probability_of_adverse_health, type: enum, source: input, description: "HIGH | MEDIUM | LOW | REMOTE", constraints: "HIGH | MEDIUM | LOW | REMOTE" }
      - { name: severity_tier, type: integer, source: input, description: "Clinical severity tier of the health consequence", constraints: "integer in 1..4" }
      - { name: exposure_population, type: integer, source: input, description: "Estimated number of consumers exposed", constraints: ">= 0" }
      - { name: vulnerable_population, type: boolean, source: input, default: false, description: "True when infants, elderly, pregnant or immunocompromised consumers are in the exposed set" }
      - { name: evidence_strength, type: enum, source: input, description: "CONFIRMED | PROBABLE | SUSPECTED — only applied by the RATIFIED variant", constraints: "CONFIRMED | PROBABLE | SUSPECTED" }
      - { name: variant, type: enum, source: computed, default: "PRELIMINARY", description: "PRELIMINARY | RATIFIED — which hazard_score variant produced the current score" }
      - { name: hazard_score, type: number, source: computed, default: 0, description: "Output of calculations.hazard_score_and_class under the current variant, 2 decimals" }
      - { name: recommended_class, type: enum, source: computed, default: null, description: "CLASS_I | CLASS_II | CLASS_III derived from hazard_score thresholds" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | RATIFIED | RETURNED | SUPERSEDED" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID that most recently submitted this evaluation" }
      - { name: ratified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the HealthHazardPanel member that ratified this evaluation" }
      - { name: panel_note, type: string, source: input, default: null, description: "Panel narrative recorded on decide" }
      - { name: return_count, type: integer, source: computed, default: 0, description: "Number of times this evaluation has been RETURNED to DRAFT" }

  - name: Consignee
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/consignees" }
      - { name: parent_consignee_id, type: string, source: input, default: null, description: "FK -> Consignee.id; null for a direct (tier 1) consignee, otherwise the upstream consignee that re-shipped to this one" }
      - { name: name, type: string, source: input, description: "Consignee business name" }
      - { name: consignee_type, type: enum, source: input, description: "DISTRIBUTOR | RETAILER | RESTAURANT | INSTITUTION", constraints: "DISTRIBUTOR | RETAILER | RESTAURANT | INSTITUTION" }
      - { name: tier, type: integer, source: computed, description: "1 when parent_consignee_id is null, otherwise parent.tier + 1; hard-capped at 3" }
      - { name: in_effectiveness_sample, type: boolean, source: computed, default: false, description: "True when tier <= Recall.sample_tier_scope" }
      - { name: escalation_level, type: integer, source: computed, default: 0, description: "Incremented by one each time a checkpoint ages one of this consignee's DELIVERED notifications out of its response window" }
      - { name: last_contact_at, type: datetime, source: system, default: null, description: "sent_at of the most recent ConsigneeNotification created for this consignee" }
      - { name: response_state, type: enum, source: computed, default: "AWAITING", description: "AWAITING | ACKNOWLEDGED | REFUSED | NO_RESPONSE — the strongest response_state across this consignee's notifications, precedence ACKNOWLEDGED > REFUSED > NO_RESPONSE > AWAITING" }
      - { name: closed_without_response, type: boolean, source: computed, default: false, description: "Set true when the recall enters EFFECTIVENESS_REVIEW while this consignee's response_state is AWAITING or NO_RESPONSE" }

  - name: DistributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/distribution-records" }
      - { name: consignee_id, type: string, source: input, description: "FK -> Consignee.id; the consignee this shipment line went to" }
      - { name: lot_code, type: string, source: input, description: "Lot code shipped on this line" }
      - { name: quantity_shipped, type: integer, source: input, description: "Units the firm's records say were shipped", constraints: "> 0" }
      - { name: ship_date, type: datetime, source: input, description: "ISO 8601 UTC instant of shipment" }
      - { name: quantity_confirmed, type: integer, source: computed, default: null, description: "Corrected unit count supplied on a CORRECT reconciliation outcome" }
      - { name: effective_quantity, type: integer, source: computed, default: 0, description: "quantity_shipped when status == CONFIRMED, quantity_confirmed when status == CORRECTED, otherwise 0" }
      - { name: status, type: enum, source: system, default: "DECLARED", description: "DECLARED | CONFIRMED | DISPUTED | CORRECTED | VOIDED" }
      - { name: reconcile_round, type: integer, source: computed, default: 0, description: "Number of reconcile calls applied to this record" }

  - name: ConsigneeNotification
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/notifications" }
      - { name: consignee_id, type: string, source: input, description: "FK -> Consignee.id; the consignee being notified" }
      - { name: method, type: enum, source: input, description: "EMAIL | PHONE | CERTIFIED_MAIL — also selects the cooling-off buffer", constraints: "EMAIL | PHONE | CERTIFIED_MAIL" }
      - { name: attempt_no, type: integer, source: computed, description: "1 + count of pre-existing notifications for the same consignee_id" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock instant at which this notification was dispatched" }
      - { name: delivery_state, type: enum, source: system, default: "SENT", description: "SENT | DELIVERED | UNDELIVERABLE — delivery dimension" }
      - { name: response_state, type: enum, source: system, default: "AWAITING", description: "AWAITING | ACKNOWLEDGED | REFUSED | NO_RESPONSE — response dimension, evolves independently of delivery_state" }
      - { name: delivery_recorded_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which delivery_state left SENT" }
      - { name: response_recorded_at, type: datetime, source: system, default: null, description: "Logical-clock instant at which response_state left AWAITING" }
      - { name: counts_toward_effectiveness, type: boolean, source: computed, default: false, description: "True only when delivery_state == DELIVERED and response_state IN {ACKNOWLEDGED, REFUSED}" }
      - { name: response_note, type: string, source: input, default: null, description: "Free-text note recorded with the consignee response" }

  - name: RetrievalReceipt
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/retrieval-receipts" }
      - { name: consignee_id, type: string, source: input, description: "FK -> Consignee.id; the consignee accounting for its stock" }
      - { name: quantity_returned, type: integer, source: input, description: "Units physically returned to the firm", constraints: ">= 0" }
      - { name: quantity_destroyed_onsite, type: integer, source: input, description: "Units destroyed at the consignee under its own certificate", constraints: ">= 0" }
      - { name: quantity_held_segregated, type: integer, source: input, description: "Units still at the consignee but segregated and blocked from sale", constraints: ">= 0" }
      - { name: quantity_unrecoverable, type: integer, source: input, description: "Units already consumed or sold through and unrecoverable", constraints: ">= 0" }
      - { name: accounted_units, type: integer, source: computed, default: 0, description: "quantity_returned + quantity_destroyed_onsite + quantity_held_segregated (quantity_unrecoverable is deliberately excluded)" }
      - { name: status, type: enum, source: system, default: "REPORTED", description: "REPORTED | VERIFIED | DISPUTED" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FieldInvestigator that adjudicated this receipt" }
      - { name: verification_note, type: string, source: input, default: null, description: "Investigator note recorded on verify" }

  - name: PublicWarning
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/public-warnings" }
      - { name: warning_type, type: enum, source: input, description: "PRESS_RELEASE | PUBLIC_WARNING | SOCIAL_MEDIA_ONLY", constraints: "PRESS_RELEASE | PUBLIC_WARNING | SOCIAL_MEDIA_ONLY" }
      - { name: headline, type: string, source: input, description: "Headline of the public communication" }
      - { name: body, type: string, source: input, description: "Body copy of the public communication" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the RecallCoordinator that created this draft" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RecallCoordinator that reviewed this draft; must differ from drafted_by_user_id" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | IN_REVIEW | APPROVED | PUBLISHED" }
      - { name: reject_count, type: integer, source: computed, default: 0, description: "Number of times review returned REJECT and pushed this warning back to DRAFT" }
      - { name: review_note, type: string, source: input, default: null, description: "Reviewer narrative recorded on review" }
      - { name: published_at, type: datetime, source: system, default: null, description: "Logical-clock instant of publication" }

  - name: DispositionOrder
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/disposition-orders" }
      - { name: method, type: enum, source: input, description: "DESTROY | REWORK | RELABEL | RETURN_TO_FIRM", constraints: "DESTROY | REWORK | RELABEL | RETURN_TO_FIRM" }
      - { name: quantity, type: integer, source: input, description: "Units this order will dispose of", constraints: "> 0" }
      - { name: facility_name, type: string, source: input, description: "Facility performing the disposition" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the FirmRecallOfficer that proposed the order" }
      - { name: authorized_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RecallCoordinator that authorized the order" }
      - { name: certificate_reference, type: string, source: input, default: null, description: "Certificate of destruction / rework reference supplied on execute" }
      - { name: executed_at, type: datetime, source: system, default: null, description: "Logical-clock instant of execution" }
      - { name: witness_user_id, type: string, source: system, default: null, description: "X-User-ID of the FieldInvestigator that witnessed and verified execution" }
      - { name: status, type: enum, source: system, default: "PROPOSED", description: "PROPOSED | AUTHORIZED | EXECUTED | VERIFIED" }
      - { name: reject_count, type: integer, source: computed, default: 0, description: "Number of times verification returned REJECT and pushed the order back to AUTHORIZED" }
      - { name: verification_note, type: string, source: input, default: null, description: "Investigator note recorded on verify" }

  - name: StatusReport
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/status-reports or minted by the checkpoint" }
      - { name: period_index, type: integer, source: system, description: "1-based monotone index within the recall, assigned in creation order" }
      - { name: report_kind, type: enum, source: input, default: "INTERIM", description: "PERIODIC | INTERIM | FINAL_EFFECTIVENESS", constraints: "PERIODIC | INTERIM | FINAL_EFFECTIVENESS" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the reporting window" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the reporting window; windows are half-open [period_start, period_end)" }
      - { name: due_at, type: datetime, source: computed, description: "Equal to period_end for every report kind" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | SUBMITTED | ACCEPTED | OVERDUE" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of submission" }
      - { name: narrative, type: string, source: input, default: null, description: "Firm narrative supplied on submit" }
      - { name: reported_effectiveness_pct, type: number, source: computed, default: 0, description: "Snapshot of Recall.official_effectiveness_pct taken at submit time" }
      - { name: reject_count, type: integer, source: computed, default: 0, description: "Number of times adjudicate returned REJECT and pushed this report back to PENDING" }
      - { name: adjudication_note, type: string, source: input, default: null, description: "Coordinator note recorded on adjudicate" }

  - name: CostEntry
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/cost-entries" }
      - { name: category, type: enum, source: input, description: "NOTIFICATION | LOGISTICS | DESTRUCTION | LEGAL | PRODUCT_VALUE | LAB_TESTING", constraints: "NOTIFICATION | LOGISTICS | DESTRUCTION | LEGAL | PRODUCT_VALUE | LAB_TESTING" }
      - { name: amount_cents, type: integer, source: input, description: "Raw incurred amount in cents before overhead loading", constraints: "> 0" }
      - { name: description, type: string, source: input, description: "What the cost was for" }
      - { name: insurable, type: boolean, source: computed, description: "True when category IN {NOTIFICATION, LOGISTICS, DESTRUCTION, PRODUCT_VALUE}" }
      - { name: overhead_rate, type: number, source: computed, description: "OVERHEAD_RATE[category] from calculations.recall_cost_accumulation" }
      - { name: line_loaded_cost_cents, type: integer, source: computed, description: "round_half_up(amount_cents * (1 + overhead_rate)) to whole cents, computed PER LINE before any summation" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | ACCEPTED | REJECTED" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the RecallCoordinator that adjudicated this entry" }
      - { name: adjudication_note, type: string, source: input, default: null, description: "Coordinator note recorded on adjudicate" }

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - { name: recall_id, type: string, source: system, description: "FK -> Recall.id; set from the path segment of POST /recalls/{id}/insurance-claims" }
      - { name: claim_reference, type: string, source: input, description: "Carrier-side claim reference string" }
      - { name: claimed_cents, type: integer, source: computed, default: 0, description: "Snapshot of Recall.insurable_loaded_cost_cents taken at submit time (uncapped)" }
      - { name: capped_total_cents, type: integer, source: computed, default: 0, description: "Sum over insurable categories of min(category_subtotal, SUBLIMIT_CENTS[category])" }
      - { name: coinsurance_rate, type: number, source: computed, default: 0, description: "Tier rate keyed on capped_total_cents, never on total_claim_value_cents" }
      - { name: settlement_payable_cents, type: integer, source: computed, default: 0, description: "round_half_up(max(0, capped_total_cents - Firm.policy_deductible_cents) * coinsurance_rate), then clamped by the remaining policy aggregate" }
      - { name: handling_fee_cents, type: integer, source: computed, default: 0, description: "round_half_up(settlement_payable_cents * HANDLING_FEE_RATE)" }
      - { name: total_claim_value_cents, type: integer, source: computed, default: 0, description: "settlement_payable_cents + handling_fee_cents" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Amount the adjuster actually paid on this claim" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | PARTIALLY_PAID | PAID | DENIED" }
      - { name: supplement_round, type: integer, source: computed, default: 0, description: "Number of times a PARTIALLY_PAID claim has been resubmitted as a supplement" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Adjuster reason recorded on a DENY decision" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the InsuranceAdjuster that adjudicated this claim" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Recall
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /recalls/{id}/classify"
        actor: RecallCoordinator
        preconditions:
          - "At least one HazardEvaluation with recall_id == this recall and status == RATIFIED exists, else ERR_NO_RATIFIED_EVALUATION"
          - "Body hazard_class IN {CLASS_I, CLASS_II, CLASS_III}"
        side_effects:
          - "Recall.hazard_class := body hazard_class; Recall.classified_by_user_id := X-User-ID"
          - "Recall.effectiveness_check_level and Recall.sample_tier_scope recomputed by calculations.effectiveness_sample_scope"
          - "Recall.eligible_consignee_count and Recall.required_sample_size recomputed"
          - "Every Consignee of this recall has in_effectiveness_sample recomputed as (tier <= Recall.sample_tier_scope)"
          - "Recall.report_cadence_days recomputed by calculations.report_cadence_schedule"
          - "A StatusReport is created with report_kind=PERIODIC, period_index=1, period_start=clock_now, period_end=due_at=clock_now + report_cadence_days days, status=PENDING"

      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /recalls/{id}/classify (re-classification after a superseding evaluation is ratified)"
        actor: RecallCoordinator
        preconditions:
          - "At least one HazardEvaluation with status == RATIFIED exists whose created_at is strictly later than the created_at of the evaluation that backed the previous classification, else ERR_NO_RATIFIED_EVALUATION"
        side_effects:
          - "CASCADE A hop 1 — Recall.hazard_class := body hazard_class; Recall.classified_by_user_id := X-User-ID; Recall.report_cadence_days recomputed from the new hazard_class"
          - "CASCADE A hop 2 — because Recall.report_cadence_days changed, every StatusReport of this recall in status PENDING has due_at := period_start + Recall.report_cadence_days days (value in effect at the start of this cascade) and period_end := due_at"
          - "CASCADE A hop 3 — because that recomputed due_at is now <= clock_now, each such StatusReport flips PENDING -> OVERDUE"
          - "CASCADE A hop 4 — because a StatusReport flipped to OVERDUE, Recall.overdue_report_count += 1 per flipped report, and Recall.compliance_flag is recomputed by calculations.compliance_posture (>=1 overdue -> ESCALATED, >=3 -> DELINQUENT)"
          - "Recall.effectiveness_check_level, sample_tier_scope, eligible_consignee_count, required_sample_size recomputed; Consignee.in_effectiveness_sample refreshed"
        note: "The escalation-driven cadence override (3 days) applies only to StatusReport rows created AFTER the escalation; the hop-2 recompute deliberately uses the cadence pinned at hop 1. No fixed-point iteration."

      - from: NOTIFICATION_IN_PROGRESS
        to: NOTIFICATION_IN_PROGRESS
        trigger: "POST /recalls/{id}/classify (re-classification during notification)"
        actor: RecallCoordinator
        preconditions:
          - "At least one HazardEvaluation with status == RATIFIED exists whose created_at is strictly later than the created_at of the evaluation that backed the previous classification"
        side_effects:
          - "Identical to the CLASSIFIED -> CLASSIFIED cascade (hops 1-4)"

      - from: CLASSIFIED
        to: NOTIFICATION_IN_PROGRESS
        trigger: "system (automatic on the first successful POST /recalls/{id}/notifications for this recall)"
        actor: system
        preconditions:
          - "Recall.status == CLASSIFIED"
        side_effects: ["Recall.status := NOTIFICATION_IN_PROGRESS"]

      - from: NOTIFICATION_IN_PROGRESS
        to: RETRIEVAL_ACCOUNTING
        trigger: "system (evaluated at the end of POST /notifications/{id}/delivery, POST /notifications/{id}/response, and POST /recalls/{id}/checkpoint)"
        actor: system
        preconditions:
          - "Recall.required_sample_size > 0 and Recall.responded_count >= Recall.required_sample_size"
        side_effects: ["Recall.status := RETRIEVAL_ACCOUNTING"]

      - from: RETRIEVAL_ACCOUNTING
        to: EFFECTIVENESS_REVIEW
        trigger: "system (evaluated at the end of POST /retrieval-receipts/{id}/verify and POST /recalls/{id}/checkpoint)"
        actor: system
        preconditions:
          - "Recall.official_effectiveness_pct >= 95.00 (EFFECTIVENESS_TARGET_PCT, inclusive)"
        side_effects:
          - "CASCADE B hop 2 — Recall.status := EFFECTIVENESS_REVIEW"
          - "CASCADE B hop 3 — because the recall entered EFFECTIVENESS_REVIEW, every Consignee of this recall whose response_state IN {AWAITING, NO_RESPONSE} gets closed_without_response := true, and a StatusReport is created with report_kind=FINAL_EFFECTIVENESS, period_index=max(existing period_index)+1, period_start=clock_now, period_end=due_at=clock_now + 3 days (FINAL_REVIEW_REPORT_DAYS), status=PENDING"
        note: "This transition is NOT re-evaluated on POST /recalls/{id}/decide-termination, so a DENY leaves the recall parked in RETRIEVAL_ACCOUNTING until the next verify or checkpoint."

      - from: EFFECTIVENESS_REVIEW
        to: TERMINATION_REQUESTED
        trigger: "POST /recalls/{id}/request-termination"
        actor: FirmRecallOfficer
        preconditions:
          - "No DispositionOrder of this recall is in status PROPOSED, AUTHORIZED or EXECUTED, else ERR_OPEN_DISPOSITION_ORDERS"
          - "Recall.official_effectiveness_pct >= 90.00 (TERMINATION_MIN_EFFECTIVENESS_PCT, inclusive), else ERR_EFFECTIVENESS_BELOW_TERMINATION_THRESHOLD"
        side_effects: ["Recall.root_cause_code and Recall.capa_summary set from the body"]

      - from: TERMINATION_REQUESTED
        to: TERMINATED
        trigger: "POST /recalls/{id}/decide-termination with decision=TERMINATE"
        actor: RecallCoordinator
        preconditions:
          - "X-User-ID != Recall.classified_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "Recall.compliance_flag != DELINQUENT, else ERR_INVALID_RECALL_STATE"
        side_effects:
          - "Recall.terminated_at := clock_now"
          - "Every StatusReport of this recall in status PENDING or OVERDUE moves to ACCEPTED"
          - "Firm.open_recall_count -= 1"

      - from: TERMINATION_REQUESTED
        to: RETRIEVAL_ACCOUNTING
        trigger: "POST /recalls/{id}/decide-termination with decision=DENY"
        actor: RecallCoordinator
        preconditions:
          - "X-User-ID != Recall.classified_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Recall.termination_denied_count += 1"
          - "Recall.compliance_flag := WATCH when it was COMPLIANT, otherwise unchanged"
          - "A StatusReport is created with report_kind=PERIODIC, period_index=max(existing period_index)+1, period_start=clock_now, period_end=due_at=clock_now + Recall.report_cadence_days days, status=PENDING"

  - entity: HazardEvaluation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hazard-evaluations/{id}/submit"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions:
          - "Recall.status != TERMINATED, else ERR_INVALID_RECALL_STATE"
        side_effects:
          - "HazardEvaluation.variant := PRELIMINARY; hazard_score and recommended_class recomputed by calculations.hazard_score_and_class under the PRELIMINARY variant"
          - "HazardEvaluation.submitted_by_user_id := X-User-ID"

      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /hazard-evaluations/{id}/submit (resubmission after a panel return)"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions:
          - "Recall.status != TERMINATED"
        side_effects:
          - "HazardEvaluation.variant := PRELIMINARY; hazard_score and recommended_class recomputed under the PRELIMINARY variant"
          - "HazardEvaluation.submitted_by_user_id := X-User-ID"
        note: "SUBMITTED -> RETURNED -> SUBMITTED is the review cycle; there is no edge back to DRAFT."

      - from: SUBMITTED
        to: RATIFIED
        trigger: "POST /hazard-evaluations/{id}/decide with decision=RATIFY"
        actor: HealthHazardPanel
        preconditions:
          - "HazardEvaluation.status == SUBMITTED, else ERR_INVALID_EVALUATION_STATE"
        side_effects:
          - "HazardEvaluation.variant := RATIFIED; hazard_score and recommended_class recomputed under the RATIFIED variant (evidence_strength now applied)"
          - "HazardEvaluation.ratified_by_user_id := X-User-ID"
          - "Every OTHER HazardEvaluation of the same recall whose status == RATIFIED moves to SUPERSEDED"

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /hazard-evaluations/{id}/decide with decision=RETURN"
        actor: HealthHazardPanel
        preconditions:
          - "HazardEvaluation.status == SUBMITTED"
        side_effects: ["HazardEvaluation.return_count += 1"]

      - from: RATIFIED
        to: SUPERSEDED
        trigger: "system (automatic when another HazardEvaluation of the same recall is ratified)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DistributionRecord
    initial_state: DECLARED
    terminal_states: [VOIDED]
    transitions:
      - from: DECLARED
        to: CONFIRMED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=CONFIRM"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions: ["Recall.status != TERMINATED"]
        side_effects:
          - "DistributionRecord.effective_quantity := quantity_shipped; reconcile_round += 1"
          - "Recall.total_shipped_units := sum of effective_quantity over all DistributionRecord rows of this recall"
          - "Recall.quantity_effectiveness_pct and official_effectiveness_pct recomputed"

      - from: DECLARED
        to: DISPUTED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=DISPUTE"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions: ["Recall.status != TERMINATED"]
        side_effects:
          - "DistributionRecord.effective_quantity := 0; reconcile_round += 1"
          - "Recall.total_shipped_units recomputed; quantity_effectiveness_pct and official_effectiveness_pct recomputed"

      - from: CONFIRMED
        to: DISPUTED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=DISPUTE"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions: ["Recall.status != TERMINATED"]
        side_effects:
          - "DistributionRecord.effective_quantity := 0; reconcile_round += 1"
          - "Recall.total_shipped_units recomputed; quantity_effectiveness_pct and official_effectiveness_pct recomputed"

      - from: DISPUTED
        to: CONFIRMED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=CONFIRM"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions: ["Recall.status != TERMINATED"]
        side_effects:
          - "DistributionRecord.effective_quantity := quantity_shipped; quantity_confirmed := null; reconcile_round += 1"
          - "Recall.total_shipped_units recomputed; quantity_effectiveness_pct and official_effectiveness_pct recomputed"
        note: "COMPENSATING INVARIANT I1 — a CONFIRM -> DISPUTE -> CONFIRM round trip restores Recall.total_shipped_units to exactly its pre-cycle value."

      - from: DISPUTED
        to: CORRECTED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=CORRECT"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions:
          - "Body quantity_confirmed is present and > 0, else ERR_INVALID_REQUEST"
        side_effects:
          - "DistributionRecord.quantity_confirmed := body quantity_confirmed; effective_quantity := quantity_confirmed; reconcile_round += 1"
          - "Recall.total_shipped_units recomputed; quantity_effectiveness_pct and official_effectiveness_pct recomputed"

      - from: CORRECTED
        to: DISPUTED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=DISPUTE"
        actor: FirmRecallOfficer | RecallCoordinator
        preconditions: ["Recall.status != TERMINATED"]
        side_effects:
          - "DistributionRecord.effective_quantity := 0; reconcile_round += 1"
          - "Recall.total_shipped_units recomputed"

      - from: DISPUTED
        to: VOIDED
        trigger: "POST /distribution-records/{id}/reconcile with outcome=VOID"
        actor: RecallCoordinator
        preconditions: ["Recall.status != TERMINATED"]
        side_effects:
          - "DistributionRecord.effective_quantity := 0; reconcile_round += 1"
          - "Recall.total_shipped_units recomputed"

  - entity: ConsigneeNotification
    initial_state: "SENT x AWAITING"
    terminal_states: ["UNDELIVERABLE x AWAITING", "DELIVERED x ACKNOWLEDGED", "DELIVERED x REFUSED", "DELIVERED x NO_RESPONSE"]
    transitions:
      - from: SENT
        to: DELIVERED
        trigger: "POST /notifications/{id}/delivery with outcome=DELIVERED"
        actor: FirmRecallOfficer
        preconditions:
          - "delivery_state == SENT, else ERR_INVALID_NOTIFICATION_STATE"
        side_effects:
          - "delivery_recorded_at := clock_now"
          - "counts_toward_effectiveness recomputed as (delivery_state == DELIVERED and response_state IN {ACKNOWLEDGED, REFUSED})"
          - "Consignee.response_state recomputed; Recall.responded_count, contact_effectiveness_pct and official_effectiveness_pct recomputed"
          - "Recall may auto-transition NOTIFICATION_IN_PROGRESS -> RETRIEVAL_ACCOUNTING"
        note: "DELIVERY DIMENSION — evolves independently of the response dimension on the same row."

      - from: SENT
        to: UNDELIVERABLE
        trigger: "POST /notifications/{id}/delivery with outcome=UNDELIVERABLE"
        actor: FirmRecallOfficer
        preconditions:
          - "delivery_state == SENT"
        side_effects:
          - "delivery_recorded_at := clock_now; Consignee.escalation_level += 1"
        note: "DELIVERY DIMENSION terminal — the response dimension of this row is frozen at AWAITING because POST /notifications/{id}/response requires delivery_state IN {SENT, DELIVERED}."

      - from: AWAITING
        to: ACKNOWLEDGED
        trigger: "POST /notifications/{id}/response with outcome=ACKNOWLEDGED"
        actor: FirmRecallOfficer
        preconditions:
          - "response_state == AWAITING, else ERR_INVALID_NOTIFICATION_STATE"
          - "delivery_state IN {SENT, DELIVERED}, else ERR_INVALID_NOTIFICATION_STATE"
        side_effects:
          - "response_recorded_at := clock_now; counts_toward_effectiveness recomputed"
          - "Consignee.response_state recomputed; Recall.responded_count, contact_effectiveness_pct and official_effectiveness_pct recomputed"
          - "Recall may auto-transition NOTIFICATION_IN_PROGRESS -> RETRIEVAL_ACCOUNTING"
        note: "RESPONSE DIMENSION — may fire before or after the delivery dimension advances; only the conjunction of DELIVERED and ACKNOWLEDGED/REFUSED sets counts_toward_effectiveness."

      - from: AWAITING
        to: REFUSED
        trigger: "POST /notifications/{id}/response with outcome=REFUSED"
        actor: FirmRecallOfficer
        preconditions:
          - "response_state == AWAITING"
          - "delivery_state IN {SENT, DELIVERED}"
        side_effects:
          - "response_recorded_at := clock_now; counts_toward_effectiveness recomputed"
          - "Consignee.response_state recomputed; Recall.responded_count, contact_effectiveness_pct and official_effectiveness_pct recomputed"

      - from: AWAITING
        to: NO_RESPONSE
        trigger: "system (POST /recalls/{id}/checkpoint aging rule)"
        actor: system
        preconditions:
          - "delivery_state == DELIVERED and (clock_now - delivery_recorded_at) >= RESPONSE_WINDOW_HOURS[Recall.hazard_class] hours"
        side_effects:
          - "response_recorded_at := clock_now; Consignee.escalation_level += 1; Consignee.response_state recomputed"

  - entity: RetrievalReceipt
    initial_state: REPORTED
    terminal_states: []
    transitions:
      - from: REPORTED
        to: VERIFIED
        trigger: "POST /retrieval-receipts/{id}/verify with decision=VERIFY"
        actor: FieldInvestigator
        preconditions:
          - "RetrievalReceipt.status == REPORTED, else ERR_INVALID_ACCOUNTING_STATE"
          - "Recall.status IN {NOTIFICATION_IN_PROGRESS, RETRIEVAL_ACCOUNTING, EFFECTIVENESS_REVIEW}, else ERR_INVALID_RECALL_STATE"
        side_effects:
          - "CASCADE B hop 1 — verified_by_user_id := X-User-ID; Recall.accounted_units := sum of accounted_units over VERIFIED receipts; Recall.units_awaiting_disposition += (quantity_returned + quantity_held_segregated)"
          - "Recall.quantity_effectiveness_pct and official_effectiveness_pct recomputed"
          - "CASCADE B hops 2-3 — Recall may auto-transition RETRIEVAL_ACCOUNTING -> EFFECTIVENESS_REVIEW, which itself creates the FINAL_EFFECTIVENESS StatusReport"

      - from: REPORTED
        to: DISPUTED
        trigger: "POST /retrieval-receipts/{id}/verify with decision=DISPUTE"
        actor: FieldInvestigator
        preconditions:
          - "RetrievalReceipt.status == REPORTED"
        side_effects:
          - "verified_by_user_id := X-User-ID; the receipt contributes 0 to Recall.accounted_units"

      - from: DISPUTED
        to: REPORTED
        trigger: "POST /retrieval-receipts/{id}/verify with decision=REOPEN"
        actor: FieldInvestigator
        preconditions:
          - "RetrievalReceipt.status == DISPUTED"
        side_effects: ["verified_by_user_id := null"]

  - entity: PublicWarning
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /public-warnings/{id}/submit"
        actor: RecallCoordinator
        preconditions:
          - "Recall.status != DRAFT (the recall must be classified), else ERR_INVALID_RECALL_STATE"
        side_effects: []

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /public-warnings/{id}/review with decision=APPROVE"
        actor: RecallCoordinator
        preconditions:
          - "PublicWarning.status == IN_REVIEW, else ERR_INVALID_WARNING_STATE"
          - "X-User-ID != PublicWarning.drafted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: ["reviewed_by_user_id := X-User-ID"]

      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /public-warnings/{id}/review with decision=REJECT"
        actor: RecallCoordinator
        preconditions:
          - "PublicWarning.status == IN_REVIEW"
          - "X-User-ID != PublicWarning.drafted_by_user_id"
        side_effects: ["reject_count += 1; reviewed_by_user_id := X-User-ID"]

      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /public-warnings/{id}/publish"
        actor: RecallCoordinator
        preconditions:
          - "PublicWarning.status == APPROVED, else ERR_INVALID_WARNING_STATE"
          - "When warning_type IN {PRESS_RELEASE, PUBLIC_WARNING}: Recall.hazard_class IN {CLASS_I, CLASS_II}, else ERR_PUBLIC_WARNING_NOT_WARRANTED"
        side_effects: ["published_at := clock_now"]

  - entity: DispositionOrder
    initial_state: PROPOSED
    terminal_states: [VERIFIED]
    transitions:
      - from: PROPOSED
        to: AUTHORIZED
        trigger: "POST /disposition-orders/{id}/authorize"
        actor: RecallCoordinator
        preconditions:
          - "DispositionOrder.status == PROPOSED, else ERR_INVALID_DISPOSITION_STATE"
          - "Recall.status IN {RETRIEVAL_ACCOUNTING, EFFECTIVENESS_REVIEW}, else ERR_INVALID_RECALL_STATE"
          - "DispositionOrder.quantity <= Recall.units_awaiting_disposition, else ERR_DISPOSITION_EXCEEDS_ACCOUNTED_UNITS"
        side_effects: ["authorized_by_user_id := X-User-ID"]

      - from: AUTHORIZED
        to: EXECUTED
        trigger: "POST /disposition-orders/{id}/execute"
        actor: FirmRecallOfficer
        preconditions:
          - "DispositionOrder.status == AUTHORIZED, else ERR_INVALID_DISPOSITION_STATE"
          - "Body certificate_reference is a non-empty string, else ERR_INVALID_REQUEST"
        side_effects:
          - "certificate_reference and executed_at := clock_now"
          - "Recall.units_awaiting_disposition -= quantity; Recall.units_pending_verification += quantity"

      - from: EXECUTED
        to: VERIFIED
        trigger: "POST /disposition-orders/{id}/verify with decision=VERIFY"
        actor: FieldInvestigator
        preconditions:
          - "DispositionOrder.status == EXECUTED, else ERR_INVALID_DISPOSITION_STATE"
        side_effects:
          - "witness_user_id := X-User-ID"
          - "Recall.units_pending_verification -= quantity; Recall.units_disposed_verified += quantity"

      - from: EXECUTED
        to: AUTHORIZED
        trigger: "POST /disposition-orders/{id}/verify with decision=REJECT"
        actor: FieldInvestigator
        preconditions:
          - "DispositionOrder.status == EXECUTED"
        side_effects:
          - "reject_count += 1; certificate_reference := null; executed_at := null"
          - "Recall.units_pending_verification -= quantity; Recall.units_awaiting_disposition += quantity"
        note: "Custody compensation — an EXECUTE followed by a REJECT restores units_awaiting_disposition exactly."

  - entity: StatusReport
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /status-reports/{id}/submit"
        actor: FirmRecallOfficer
        preconditions:
          - "StatusReport.status IN {PENDING, OVERDUE}, else ERR_INVALID_REPORT_STATE"
        side_effects:
          - "submitted_at := clock_now; narrative set; reported_effectiveness_pct := Recall.official_effectiveness_pct at this instant"

      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /status-reports/{id}/submit (late submission)"
        actor: FirmRecallOfficer
        preconditions:
          - "StatusReport.status IN {PENDING, OVERDUE}"
        side_effects:
          - "submitted_at := clock_now; narrative set; reported_effectiveness_pct := Recall.official_effectiveness_pct at this instant"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /status-reports/{id}/adjudicate with decision=ACCEPT"
        actor: RecallCoordinator
        preconditions:
          - "StatusReport.status == SUBMITTED, else ERR_INVALID_REPORT_STATE"
        side_effects: []

      - from: SUBMITTED
        to: PENDING
        trigger: "POST /status-reports/{id}/adjudicate with decision=REJECT"
        actor: RecallCoordinator
        preconditions:
          - "StatusReport.status == SUBMITTED"
        side_effects:
          - "reject_count += 1; submitted_at := null; narrative := null"
          - "due_at := due_at + 2 days (REPORT_REJECT_EXTENSION_DAYS); period_end := due_at"

      - from: PENDING
        to: OVERDUE
        trigger: "system (POST /recalls/{id}/checkpoint)"
        actor: system
        preconditions:
          - "StatusReport.due_at <= clock_now"
        side_effects:
          - "Recall.overdue_report_count += 1; Recall.compliance_flag recomputed by calculations.compliance_posture"

      - from: PENDING
        to: ACCEPTED
        trigger: "system (automatic when the recall reaches TERMINATED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OVERDUE
        to: ACCEPTED
        trigger: "system (automatic when the recall reaches TERMINATED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CostEntry
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /cost-entries/{id}/adjudicate with decision=ACCEPT"
        actor: RecallCoordinator
        preconditions:
          - "CostEntry.status IN {PENDING, REJECTED}, else ERR_INVALID_COST_ENTRY_STATE"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID"
          - "Recall.total_loaded_cost_cents := sum of line_loaded_cost_cents over ACCEPTED entries; Recall.insurable_loaded_cost_cents := same sum restricted to insurable == true"

      - from: PENDING
        to: REJECTED
        trigger: "POST /cost-entries/{id}/adjudicate with decision=REJECT"
        actor: RecallCoordinator
        preconditions:
          - "CostEntry.status IN {PENDING, ACCEPTED}"
        side_effects:
          - "adjudicated_by_user_id := X-User-ID; Recall.total_loaded_cost_cents and insurable_loaded_cost_cents recomputed"

      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /cost-entries/{id}/adjudicate with decision=REJECT"
        actor: RecallCoordinator
        preconditions:
          - "CostEntry.status IN {PENDING, ACCEPTED}"
        side_effects:
          - "Recall.total_loaded_cost_cents and insurable_loaded_cost_cents recomputed"
        note: "COMPENSATING INVARIANT I2 — an ACCEPT -> REJECT round trip restores Recall.total_loaded_cost_cents and Recall.insurable_loaded_cost_cents to exactly their pre-cycle values."

      - from: REJECTED
        to: ACCEPTED
        trigger: "POST /cost-entries/{id}/adjudicate with decision=ACCEPT"
        actor: RecallCoordinator
        preconditions:
          - "CostEntry.status IN {PENDING, REJECTED}"
        side_effects:
          - "Recall.total_loaded_cost_cents and insurable_loaded_cost_cents recomputed"

  - entity: InsuranceClaim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /insurance-claims/{id}/submit"
        actor: FirmRecallOfficer
        preconditions:
          - "InsuranceClaim.status IN {DRAFT, PARTIALLY_PAID}, else ERR_INVALID_CLAIM_STATE"
          - "Recall.status IN {EFFECTIVENESS_REVIEW, TERMINATION_REQUESTED, TERMINATED}, else ERR_INVALID_RECALL_STATE"
          - "Recall.insurable_loaded_cost_cents > 0, else ERR_INVALID_CLAIM_STATE"
          - "The remaining policy aggregate (Firm.policy_aggregate_cents - Firm.policy_paid_to_date_cents) must be strictly greater than 0, else ERR_CLAIM_EXCEEDS_POLICY_AGGREGATE. When it is positive, STEP 5 clamps the settlement to it rather than rejecting."
        side_effects:
          - "claimed_cents, capped_total_cents, coinsurance_rate, settlement_payable_cents, handling_fee_cents, total_claim_value_cents computed by calculations.insurance_settlement"

      - from: PARTIALLY_PAID
        to: SUBMITTED
        trigger: "POST /insurance-claims/{id}/submit (supplemental submission)"
        actor: FirmRecallOfficer
        preconditions:
          - "InsuranceClaim.status IN {DRAFT, PARTIALLY_PAID}"
          - "Recall.status IN {EFFECTIVENESS_REVIEW, TERMINATION_REQUESTED, TERMINATED}"
        side_effects:
          - "supplement_round += 1; all settlement fields recomputed against the CURRENT Recall.insurable_loaded_cost_cents and the remaining policy aggregate"

      - from: SUBMITTED
        to: PAID
        trigger: "POST /insurance-claims/{id}/adjudicate with decision=PAY_FULL"
        actor: InsuranceAdjuster
        preconditions:
          - "InsuranceClaim.status == SUBMITTED, else ERR_INVALID_CLAIM_STATE"
        side_effects:
          - "paid_cents := settlement_payable_cents; adjudicated_by_user_id := X-User-ID; Firm.policy_paid_to_date_cents += paid_cents"

      - from: SUBMITTED
        to: PARTIALLY_PAID
        trigger: "POST /insurance-claims/{id}/adjudicate with decision=PAY_PARTIAL"
        actor: InsuranceAdjuster
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
          - "Body paid_cents present with 0 < paid_cents < settlement_payable_cents, else ERR_INVALID_REQUEST"
        side_effects:
          - "paid_cents := body paid_cents; adjudicated_by_user_id := X-User-ID; Firm.policy_paid_to_date_cents += paid_cents"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /insurance-claims/{id}/adjudicate with decision=DENY"
        actor: InsuranceAdjuster
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
          - "Body denial_reason is a non-empty string, else ERR_INVALID_REQUEST"
        side_effects: ["denial_reason set; adjudicated_by_user_id := X-User-ID"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: hazard-eval-create-stale-recall
    parent_entity: Recall
    write_endpoint: "POST /recalls/{id}/hazard-evaluations"
    occ_field: "expected_recall_version"
    description: |
      Filing a HazardEvaluation against a Recall whose version has advanced
      since the client last observed it is rejected. A newly filed evaluation
      legitimately supersedes the recall's current evaluation posture once it
      is ratified, so a client working from a stale view of the recall would
      otherwise displace an evaluation it never saw.
    error_id: ERR_STALE_RECALL_VERSION
    http_status: 412

  - rule_id: notification-create-stale-consignee
    parent_entity: Consignee
    write_endpoint: "POST /recalls/{id}/notifications"
    occ_field: "expected_consignee_version"
    description: |
      Dispatching a ConsigneeNotification against a Consignee whose version has
      advanced since the client last observed it is rejected. A new dispatch
      legitimately supersedes the consignee's prior contact attempt (it moves
      last_contact_at and resets the cooling-off clock), so a client acting on
      a stale consignee view would silently override contact history.
    error_id: ERR_STALE_CONSIGNEE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: hazard_score_and_class
    trigger: "On POST /recalls/{id}/hazard-evaluations (creation), on POST /hazard-evaluations/{id}/submit, and on POST /hazard-evaluations/{id}/decide with decision=RATIFY"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is fixed; no step may be reordered.
      base            = SEVERITY_POINTS[severity_tier] * PROBABILITY_MULTIPLIER[probability_of_adverse_health]
      exposure_factor = min(EXPOSURE_CAP, ceil(exposure_population / EXPOSURE_DIVISOR))
      vuln_bonus      = VULNERABLE_BONUS if vulnerable_population else 0
      scale           = 1.00                                   if variant == PRELIMINARY
                        else EVIDENCE_SCALE[evidence_strength]  # variant == RATIFIED
      hazard_score    = round_half_up((base + exposure_factor + vuln_bonus) * scale, 2)
      recommended_class = CLASS_I   if hazard_score >= CLASS_I_THRESHOLD
                          else CLASS_II  if hazard_score >= CLASS_II_THRESHOLD
                          else CLASS_III
    input_set: "The five input fields of the single HazardEvaluation row being scored. No other evaluation, and no Recall or Consignee data, participates."
    constants:
      SEVERITY_POINTS: { 1: 12, 2: 24, 3: 40, 4: 58 }
      PROBABILITY_MULTIPLIER: { HIGH: 1.30, MEDIUM: 1.00, LOW: 0.70, REMOTE: 0.40 }
      EXPOSURE_DIVISOR: 25000
      EXPOSURE_CAP: 12
      VULNERABLE_BONUS: 9
      EVIDENCE_SCALE: { CONFIRMED: 1.00, PROBABLE: 0.80, SUSPECTED: 0.55 }
      CLASS_I_THRESHOLD: 70.00
      CLASS_II_THRESHOLD: 35.00
    precision: "hazard_score: 2 decimal places, round_half_up. exposure_factor uses mathematical ceiling on the exact quotient. Thresholds are inclusive (>=)."
    variants:
      - name: PRELIMINARY
        when: "At creation and at every submit / resubmit, before the health hazard panel has ratified"
        difference: "evidence_strength is ignored and scale is forced to 1.00 — the worst-case reading in which every reported link is treated as confirmed"
      - name: RATIFIED
        when: "At POST /hazard-evaluations/{id}/decide with decision=RATIFY"
        difference: "scale := EVIDENCE_SCALE[evidence_strength], which discounts PROBABLE to 0.80 and SUSPECTED to 0.55 and can move recommended_class down one or two classes for identical inputs"

  - name: effectiveness_sample_scope
    trigger: "On POST /recalls/{id}/classify, on POST /recalls/{id}/consignees, and at the start of every effectiveness_percentage evaluation"
    algorithm: threshold
    formula: |
      effectiveness_check_level =
          A  if Recall.hazard_class == CLASS_I
          B  if Recall.hazard_class == CLASS_II and at least one Consignee of this recall has tier >= 2
          C  if Recall.hazard_class == CLASS_II and every Consignee of this recall has tier == 1
          D  if Recall.hazard_class == CLASS_III
      sample_tier_scope        = SAMPLE_TIER_SCOPE[effectiveness_check_level]
      eligible_consignee_count = count of Consignee rows with recall_id == R and tier <= sample_tier_scope
      required_sample_size     = 0 if eligible_consignee_count == 0
                                 else max(1, ceil(eligible_consignee_count * LEVEL_PCT[effectiveness_check_level]))
      Consignee.tier           = 1 if parent_consignee_id is null else parent.tier + 1   (rejected above CONSIGNEE_MAX_TIER)
    input_set: "All Consignee rows whose recall_id equals the recall, regardless of response_state. Consignees are never excluded by response or notification state."
    constants:
      LEVEL_PCT: { A: 1.00, B: 0.50, C: 0.10, D: 0.02 }
      SAMPLE_TIER_SCOPE: { A: 3, B: 2, C: 2, D: 1 }
      CONSIGNEE_MAX_TIER: 3
    precision: "ceil on the exact product; required_sample_size is an integer floored at 1 whenever eligible_consignee_count > 0."

  - name: effectiveness_percentage
    trigger: "On POST /notifications/{id}/delivery, POST /notifications/{id}/response, POST /distribution-records/{id}/reconcile, POST /retrieval-receipts/{id}/verify, POST /recalls/{id}/checkpoint, and on read of GET /recalls/{id}/effectiveness"
    algorithm: aggregation
    formula: |
      # --- CONTACT_BASIS ---
      responded_count = count of Consignee rows C with C.recall_id == R and C.tier <= Recall.sample_tier_scope
                        having at least one ConsigneeNotification N with N.consignee_id == C.id
                        and N.delivery_state == DELIVERED
                        and N.response_state IN {ACKNOWLEDGED, REFUSED}
      contact_effectiveness_pct =
          100.00                                                                  if required_sample_size == 0
          else round_half_up(min(responded_count, required_sample_size)
                             / required_sample_size * 100, 2)

      # --- QUANTITY_BASIS ---
      shipped_units   = sum of DistributionRecord.effective_quantity over rows with recall_id == R
                        and status IN {CONFIRMED, CORRECTED}
      accounted_units = sum of RetrievalReceipt.accounted_units over rows with recall_id == R
                        and status == VERIFIED
      quantity_effectiveness_pct =
          0.00                                                                    if shipped_units == 0
          else round_half_up(min(accounted_units, shipped_units) / shipped_units * 100, 2)

      # --- OFFICIAL SELECTION ---
      official_basis            = CONTACT  if Recall.agency == FDA else QUANTITY
      official_effectiveness_pct = contact_effectiveness_pct  if official_basis == CONTACT
                                   else quantity_effectiveness_pct
    input_set: "CONTACT_BASIS counts consignees, not notifications: a consignee with three DELIVERED+ACKNOWLEDGED notifications contributes 1. QUANTITY_BASIS reads only CONFIRMED/CORRECTED distribution rows and only VERIFIED receipts; DECLARED, DISPUTED and VOIDED distribution rows and REPORTED/DISPUTED receipts contribute 0."
    constants:
      EFFECTIVENESS_TARGET_PCT: 95.00
      TERMINATION_MIN_EFFECTIVENESS_PCT: 90.00
      EFFECTIVENESS_WATCH_PCT: 60.00
    precision: "Both percentages: 2 decimal places, round_half_up. Both numerators are clamped by min() so neither percentage can exceed 100.00. The two empty-set boundaries deliberately disagree: an empty required sample yields 100.00 while zero shipped units yields 0.00."
    variants:
      - name: CONTACT_BASIS
        when: "Recall.agency == FDA — the agency scores the recall on consignee contact coverage"
        difference: "Numerator and denominator are consignee counts drawn from the effectiveness sample; retrieval quantities are ignored entirely"
      - name: QUANTITY_BASIS
        when: "Recall.agency == USDA — the agency scores the recall on product actually accounted for"
        difference: "Numerator and denominator are unit quantities drawn from verified receipts and reconciled distribution rows; consignee response state is ignored entirely. For identical fixture data the two variants routinely differ by tens of percentage points."

  - name: recall_cost_accumulation
    trigger: "On POST /recalls/{id}/cost-entries (line loading) and on POST /cost-entries/{id}/adjudicate (roll-up)"
    algorithm: aggregation
    formula: |
      # STEP 1 — per line, at creation time
      insurable              = category IN INSURABLE_CATEGORIES
      overhead_rate          = OVERHEAD_RATE[category]
      line_loaded_cost_cents = round_half_up(amount_cents * (1 + overhead_rate))    # whole cents, PER LINE

      # STEP 2 — roll-up, at adjudication time
      Recall.total_loaded_cost_cents     = sum(line_loaded_cost_cents
                                               for CostEntry with recall_id == R and status == ACCEPTED)
      Recall.insurable_loaded_cost_cents = sum(line_loaded_cost_cents
                                               for CostEntry with recall_id == R and status == ACCEPTED
                                               and insurable == true)
    input_set: "Only CostEntry rows in status ACCEPTED are summed. PENDING and REJECTED rows contribute 0, which is what makes the ACCEPT -> REJECT round trip exactly compensating."
    constants:
      OVERHEAD_RATE: { NOTIFICATION: 0.115, LOGISTICS: 0.085, DESTRUCTION: 0.145, LEGAL: 0.000, PRODUCT_VALUE: 0.055, LAB_TESTING: 0.225 }
      INSURABLE_CATEGORIES: [NOTIFICATION, LOGISTICS, DESTRUCTION, PRODUCT_VALUE]
    precision: |
      ROUNDING ORDER IS PINNED AND LOAD-BEARING: each line is rounded to whole cents with round_half_up
      BEFORE any summation. Summing the unrounded products and rounding the total afterwards is WRONG and
      produces a different figure — three NOTIFICATION lines of 3333 cents each give 3 * 3716 = 11148 under
      the pinned order, versus round(9999 * 1.115) = 11149 under sum-then-round.

  - name: insurance_settlement
    trigger: "On POST /insurance-claims/{id}/submit (both the initial submission and every supplemental resubmission)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned. There is no fixed-point iteration and no back-substitution.
      # STEP 1
      claimed_cents = Recall.insurable_loaded_cost_cents            # uncapped snapshot
      # STEP 2 — per-category sublimit, applied to the ACCEPTED loaded lines of that category
      for each c in INSURABLE_CATEGORIES:
          cat_subtotal[c] = sum(line_loaded_cost_cents for ACCEPTED CostEntry of R with category == c)
          capped[c]       = min(cat_subtotal[c], SUBLIMIT_CENTS[c])
      capped_total_cents  = sum over c of capped[c]
      # STEP 3 — coinsurance tier is keyed on capped_total_cents ONLY, never on total_claim_value_cents
      coinsurance_rate = 0.90 if capped_total_cents >= COINS_TIER_HIGH_CENTS
                         else 0.85 if capped_total_cents >= COINS_TIER_MID_CENTS
                         else 0.80
      # STEP 4 — deductible is subtracted BEFORE coinsurance is applied
      settlement_payable_cents = round_half_up(max(0, capped_total_cents - Firm.policy_deductible_cents)
                                               * coinsurance_rate)
      # STEP 5 — clamp by the remaining policy aggregate
      remaining_aggregate      = Firm.policy_aggregate_cents - Firm.policy_paid_to_date_cents
      settlement_payable_cents = min(settlement_payable_cents, remaining_aggregate)
      # STEP 6/7 — the fee that makes the dependency LOOK circular
      handling_fee_cents       = round_half_up(settlement_payable_cents * HANDLING_FEE_RATE)
      total_claim_value_cents  = settlement_payable_cents + handling_fee_cents
    input_set: "ACCEPTED CostEntry rows of this recall whose category is in INSURABLE_CATEGORIES, grouped by category. LEGAL and LAB_TESTING lines never enter any step, although they do enter Recall.total_loaded_cost_cents."
    constants:
      SUBLIMIT_CENTS: { NOTIFICATION: 2000000, LOGISTICS: 5000000, DESTRUCTION: 3000000, PRODUCT_VALUE: 25000000 }
      COINS_TIER_HIGH_CENTS: 50000000
      COINS_TIER_MID_CENTS: 10000000
      HANDLING_FEE_RATE: 0.030
    precision: |
      All money is integer cents; every multiplication is closed with round_half_up to whole cents.
      The apparent circularity (total_claim_value_cents depends on the fee, the fee depends on the payable,
      the payable depends on a tier that a naive reader would key on the total) is resolved by pinning the
      tier to STEP 2's capped_total_cents. Deductible before coinsurance; aggregate clamp after coinsurance
      and before the handling fee.

  - name: report_cadence_schedule
    trigger: "On POST /recalls/{id}/classify, on POST /recalls/{id}/checkpoint, and on the DENY branch of POST /recalls/{id}/decide-termination"
    algorithm: threshold
    formula: |
      Recall.report_cadence_days =
          ESCALATED_CADENCE_DAYS                      if Recall.compliance_flag IN {ESCALATED, DELINQUENT}
          else CADENCE_DAYS[Recall.hazard_class]
      # New PERIODIC report minting, evaluated last in a checkpoint:
      if Recall.status NOT IN {DRAFT, TERMINATED}
         and no StatusReport of R is in status PENDING
         and at least one StatusReport of R exists:
             create StatusReport(report_kind=PERIODIC,
                                 period_index = max(existing period_index) + 1,
                                 period_start = clock_now,
                                 period_end   = due_at = clock_now + Recall.report_cadence_days days,
                                 status       = PENDING)
    input_set: "Only StatusReport rows of this recall. period_index is assigned from the current maximum, so indices never repeat even after rejections."
    constants:
      CADENCE_DAYS: { CLASS_I: 7, CLASS_II: 14, CLASS_III: 30 }
      ESCALATED_CADENCE_DAYS: 3
      FINAL_REVIEW_REPORT_DAYS: 3
      REPORT_REJECT_EXTENSION_DAYS: 2
    precision: "Day arithmetic is exact 24-hour multiples applied to the logical clock. due_at and period_end are always equal; windows are half-open [period_start, period_end)."

  - name: compliance_posture
    trigger: "On POST /recalls/{id}/checkpoint, on every StatusReport PENDING -> OVERDUE flip, and on the DENY branch of POST /recalls/{id}/decide-termination"
    algorithm: threshold
    formula: |
      # Evaluated top-down; the FIRST matching clause wins.
      Recall.compliance_flag =
          DELINQUENT  if Recall.overdue_report_count >= DELINQUENT_OVERDUE_COUNT
          else ESCALATED if Recall.overdue_report_count >= ESCALATED_OVERDUE_COUNT
          else WATCH     if Recall.official_effectiveness_pct < EFFECTIVENESS_WATCH_PCT
                            and Recall.status IN {RETRIEVAL_ACCOUNTING, EFFECTIVENESS_REVIEW,
                                                  TERMINATION_REQUESTED}
          else COMPLIANT
    input_set: "Recall.overdue_report_count is cumulative and never decreases, so compliance_flag never returns to COMPLIANT once a report has gone overdue."
    constants:
      DELINQUENT_OVERDUE_COUNT: 3
      ESCALATED_OVERDUE_COUNT: 1
      EFFECTIVENESS_WATCH_PCT: 60.00
    precision: "Integer comparisons; the effectiveness comparison is strict (<), so exactly 60.00 does NOT set WATCH."

  - name: notification_aging_and_cooling_off
    trigger: "Aging runs on POST /recalls/{id}/checkpoint; the cooling-off gate runs on POST /recalls/{id}/notifications"
    algorithm: interval_merge
    formula: |
      # AGING (checkpoint), processed over this recall's notifications in ascending sent_at,
      # tie-broken by ascending created_at:
      for N in notifications of R with delivery_state == DELIVERED and response_state == AWAITING:
          if (clock_now - N.delivery_recorded_at) >= RESPONSE_WINDOW_HOURS[Recall.hazard_class] hours:
              N.response_state := NO_RESPONSE
              Consignee(N.consignee_id).escalation_level += 1

      # COOLING-OFF GATE (create), evaluated against the same consignee only:
      prior = the ConsigneeNotification of this consignee with the greatest sent_at,
              tie-broken by the greatest created_at
      if prior exists:
          buffer_hours = max(METHOD_BUFFER_HOURS[new_method], METHOD_BUFFER_HOURS[prior.method])
          if (clock_now - prior.sent_at) < buffer_hours hours:  reject ERR_NOTIFICATION_COOLING_OFF
      # Exactly buffer_hours of separation PASSES (the comparison is strict <).
    input_set: "The cooling-off gate looks only at notifications of the same consignee_id, in any delivery_state, including UNDELIVERABLE ones."
    constants:
      RESPONSE_WINDOW_HOURS: { CLASS_I: 24, CLASS_II: 72, CLASS_III: 168 }
      METHOD_BUFFER_HOURS: { EMAIL: 24, PHONE: 12, CERTIFIED_MAIL: 72 }
    precision: "Hour arithmetic on the logical clock. Both comparisons are pinned: aging uses >= (a notification exactly at the window edge ages out), cooling-off uses < (a dispatch exactly at the buffer edge is allowed)."

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority; the
# FIRST violated row wins and short-circuits every later row)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The value of X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Firm referenced by a path segment or by the firm_id body field exists"
    error_id: ERR_FIRM_NOT_FOUND
    http_status: 404
    applies_to: "GET /firms/{id}, POST /recalls"

  - priority: 4
    category: existence
    check: "Recall referenced by the leading /recalls/{id} path segment, or reached through the sub-resource's recall_id, exists"
    error_id: ERR_RECALL_NOT_FOUND
    http_status: 404
    applies_to: "all /recalls/{id}... endpoints"

  - priority: 5
    category: existence
    check: "Consignee referenced by the /consignees/{id} path segment or by the consignee_id body field exists AND belongs to the recall in the path"
    error_id: ERR_CONSIGNEE_NOT_FOUND
    http_status: 404
    applies_to: "GET /consignees/{id}..., POST /recalls/{id}/distribution-records, POST /recalls/{id}/notifications, POST /recalls/{id}/retrieval-receipts, POST /recalls/{id}/consignees (parent_consignee_id)"

  - priority: 6
    category: existence
    check: "The sub-resource addressed by /hazard-evaluations/{id}, /distribution-records/{id}, /notifications/{id}, /retrieval-receipts/{id}, /public-warnings/{id}, /disposition-orders/{id}, /status-reports/{id}, /cost-entries/{id} or /insurance-claims/{id} exists"
    error_id: ERR_SUBRESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all flat sub-resource action endpoints"

  - priority: 7
    category: auth
    check: "When X-User-Role == FirmRecallOfficer, X-User-ID equals the firm_id of the Recall the request touches (tenant scoping); reads are scoped the same way"
    error_id: ERR_FIRM_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint reachable by FirmRecallOfficer that resolves to a Recall"

  - priority: 8
    category: business_constraint
    check: "Request body conforms to the endpoint's input schema: required fields present, enums in range, integers non-negative where §1.1 says so, quantity fields > 0 where §1.1 says so, lot_codes non-empty, ISO 8601 datetimes parseable, period_start < period_end"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 9
    category: business_constraint
    check: "expected_recall_version equals the current Recall.version"
    error_id: ERR_STALE_RECALL_VERSION
    http_status: 412
    applies_to: "POST /recalls/{id}/hazard-evaluations"

  - priority: 10
    category: business_constraint
    check: "expected_consignee_version equals the current Consignee.version of the consignee named in the body"
    error_id: ERR_STALE_CONSIGNEE_VERSION
    http_status: 412
    applies_to: "POST /recalls/{id}/notifications"

  - priority: 11
    category: state
    check: |
      Recall.status permits this operation per §1.2, including the terminal lockdown of TERMINATED
      and the compliance_flag == DELINQUENT block on TERMINATE. Creation endpoints, which have no
      §1.2 transition of their own, are gated exactly as follows:
        POST /recalls/{id}/hazard-evaluations   status != TERMINATED
        POST /recalls/{id}/consignees           status IN {DRAFT, CLASSIFIED, NOTIFICATION_IN_PROGRESS}
        POST /recalls/{id}/distribution-records status IN {DRAFT, CLASSIFIED, NOTIFICATION_IN_PROGRESS, RETRIEVAL_ACCOUNTING}
        POST /recalls/{id}/notifications        status IN {CLASSIFIED, NOTIFICATION_IN_PROGRESS}
        POST /recalls/{id}/retrieval-receipts   status IN {NOTIFICATION_IN_PROGRESS, RETRIEVAL_ACCOUNTING, EFFECTIVENESS_REVIEW}
        POST /recalls/{id}/disposition-orders   status IN {RETRIEVAL_ACCOUNTING, EFFECTIVENESS_REVIEW}
        POST /recalls/{id}/public-warnings      status != TERMINATED
        POST /recalls/{id}/status-reports       status != TERMINATED
        POST /recalls/{id}/cost-entries         status != TERMINATED
        POST /recalls/{id}/insurance-claims     status != TERMINATED
        POST /recalls/{id}/checkpoint           status NOT IN {DRAFT, TERMINATED}
    error_id: ERR_INVALID_RECALL_STATE
    http_status: 409
    applies_to: "all write endpoints that resolve to a Recall"

  - priority: 12
    category: state
    check: "HazardEvaluation.status permits submit / decide per §1.2"
    error_id: ERR_INVALID_EVALUATION_STATE
    http_status: 409
    applies_to: "POST /hazard-evaluations/{id}/submit, POST /hazard-evaluations/{id}/decide"

  - priority: 13
    category: state
    check: "PublicWarning.status permits submit / review / publish per §1.2"
    error_id: ERR_INVALID_WARNING_STATE
    http_status: 409
    applies_to: "POST /public-warnings/{id}/submit, /review, /publish"

  - priority: 14
    category: state
    check: "DispositionOrder.status permits authorize / execute / verify per §1.2"
    error_id: ERR_INVALID_DISPOSITION_STATE
    http_status: 409
    applies_to: "POST /disposition-orders/{id}/authorize, /execute, /verify"

  - priority: 15
    category: state
    check: "ConsigneeNotification delivery_state permits the delivery call, and response_state plus delivery_state together permit the response call"
    error_id: ERR_INVALID_NOTIFICATION_STATE
    http_status: 409
    applies_to: "POST /notifications/{id}/delivery, POST /notifications/{id}/response"

  - priority: 16
    category: state
    check: "DistributionRecord.status permits the requested reconcile outcome, and RetrievalReceipt.status permits the requested verify decision"
    error_id: ERR_INVALID_ACCOUNTING_STATE
    http_status: 409
    applies_to: "POST /distribution-records/{id}/reconcile, POST /retrieval-receipts/{id}/verify"

  - priority: 17
    category: state
    check: "StatusReport.status permits submit / adjudicate per §1.2"
    error_id: ERR_INVALID_REPORT_STATE
    http_status: 409
    applies_to: "POST /status-reports/{id}/submit, POST /status-reports/{id}/adjudicate"

  - priority: 18
    category: state
    check: "InsuranceClaim.status permits submit / adjudicate per §1.2, and the recall's insurable_loaded_cost_cents is greater than zero at submit"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /insurance-claims/{id}/submit, POST /insurance-claims/{id}/adjudicate"

  - priority: 19
    category: state
    check: "CostEntry.status permits the requested adjudicate decision (ACCEPT from PENDING or REJECTED; REJECT from PENDING or ACCEPTED)"
    error_id: ERR_INVALID_COST_ENTRY_STATE
    http_status: 409
    applies_to: "POST /cost-entries/{id}/adjudicate"

  - priority: 20
    category: business_safety
    check: "Classification requires at least one RATIFIED HazardEvaluation on the recall; re-classification additionally requires one ratified strictly later than the evaluation backing the previous classification"
    error_id: ERR_NO_RATIFIED_EVALUATION
    http_status: 409
    applies_to: "POST /recalls/{id}/classify"

  - priority: 21
    category: business_safety
    check: "A PRESS_RELEASE or PUBLIC_WARNING may only be published when Recall.hazard_class IN {CLASS_I, CLASS_II}; SOCIAL_MEDIA_ONLY is exempt"
    error_id: ERR_PUBLIC_WARNING_NOT_WARRANTED
    http_status: 422
    applies_to: "POST /public-warnings/{id}/publish"

  - priority: 22
    category: business_safety
    check: "Segregation of duties: the reviewer of a PublicWarning must differ from its drafted_by_user_id, and the coordinator deciding termination must differ from Recall.classified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /public-warnings/{id}/review, POST /recalls/{id}/decide-termination"

  - priority: 23
    category: business_referential
    check: "The consignee named on a RetrievalReceipt must have at least one DistributionRecord on this recall in status CONFIRMED or CORRECTED"
    error_id: ERR_CONSIGNEE_NOT_ON_DISTRIBUTION_LIST
    http_status: 422
    applies_to: "POST /recalls/{id}/retrieval-receipts"

  - priority: 24
    category: business_referential
    check: "No ConsigneeNotification may be dispatched while any DistributionRecord of the recall is still in status DECLARED"
    error_id: ERR_DISTRIBUTION_LIST_INCOMPLETE
    http_status: 409
    applies_to: "POST /recalls/{id}/notifications"

  - priority: 25
    category: business_temporal
    check: "Cooling-off: the elapsed time since the same consignee's most recent notification must be >= max(METHOD_BUFFER_HOURS[new method], METHOD_BUFFER_HOURS[prior method]) hours"
    error_id: ERR_NOTIFICATION_COOLING_OFF
    http_status: 409
    applies_to: "POST /recalls/{id}/notifications"

  - priority: 26
    category: business_temporal
    check: "Reporting windows are half-open [period_start, period_end); a new report window must not satisfy (new_start < existing_end AND existing_start < new_end) against any existing StatusReport of the recall. Exact adjacency (new_start == existing_end) is allowed."
    error_id: ERR_REPORT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /recalls/{id}/status-reports"

  - priority: 27
    category: business_constraint
    check: "The same consignee may not hold two notifications whose delivery_state is still SENT"
    error_id: ERR_DUPLICATE_ACTIVE_NOTIFICATION
    http_status: 409
    applies_to: "POST /recalls/{id}/notifications"

  - priority: 28
    category: business_constraint
    check: "Termination may not be requested while any DispositionOrder of the recall is in status PROPOSED, AUTHORIZED or EXECUTED"
    error_id: ERR_OPEN_DISPOSITION_ORDERS
    http_status: 409
    applies_to: "POST /recalls/{id}/request-termination"

  - priority: 29
    category: business_constraint
    check: "A consignee's computed tier must not exceed CONSIGNEE_MAX_TIER (3)"
    error_id: ERR_CONSIGNEE_TIER_LIMIT
    http_status: 422
    applies_to: "POST /recalls/{id}/consignees"

  - priority: 30
    category: business_fiscal
    check: "The cumulative sum of quantity_returned + quantity_destroyed_onsite + quantity_held_segregated + quantity_unrecoverable across that consignee's existing RetrievalReceipt rows in status REPORTED or VERIFIED, PLUS the same sum for the incoming receipt, must not exceed the sum of effective_quantity over that consignee's CONFIRMED and CORRECTED distribution records on this recall. DISPUTED receipts are excluded from the running total."
    error_id: ERR_QUANTITY_EXCEEDS_SHIPPED
    http_status: 422
    applies_to: "POST /recalls/{id}/retrieval-receipts"

  - priority: 31
    category: business_fiscal
    check: "DispositionOrder.quantity must not exceed Recall.units_awaiting_disposition at authorization time"
    error_id: ERR_DISPOSITION_EXCEEDS_ACCOUNTED_UNITS
    http_status: 422
    applies_to: "POST /disposition-orders/{id}/authorize"

  - priority: 32
    category: business_fiscal
    check: "Recall.official_effectiveness_pct must be >= 90.00 for a termination request to be accepted"
    error_id: ERR_EFFECTIVENESS_BELOW_TERMINATION_THRESHOLD
    http_status: 422
    applies_to: "POST /recalls/{id}/request-termination"

  - priority: 33
    category: business_fiscal
    check: "At submit, the remaining policy aggregate (Firm.policy_aggregate_cents - Firm.policy_paid_to_date_cents) must be strictly greater than 0. A positive remainder never rejects: STEP 5 of calculations.insurance_settlement clamps settlement_payable_cents down to it."
    error_id: ERR_CLAIM_EXCEEDS_POLICY_AGGREGATE
    http_status: 422
    applies_to: "POST /insurance-claims/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "/" — every collection is top-level;
# the only nesting is one level of sub-resource under /recalls/{id} and
# /consignees/{id}. Path placeholders are literally `{id}`.)
# =============================================================================
endpoints:
  # --- Firm ---
  - method: POST
    path: "/firms"
    description: "Register a recalling firm and its product-recall policy terms"
    roles: [RecallCoordinator]
    code: 201
    input: ["name", "registration_number", "policy_deductible_cents?", "policy_aggregate_cents?"]
    output: Firm
    side_effects: ["policy_paid_to_date_cents := 0", "open_recall_count := 0"]

  - method: GET
    path: "/firms/{id}"
    description: "Read a firm including its running policy_paid_to_date_cents"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: []
    output: Firm
    side_effects: []

  # --- Recall ---
  - method: POST
    path: "/recalls"
    description: "Open a recall case in DRAFT"
    roles: [FirmRecallOfficer, RecallCoordinator]
    code: 201
    input: ["firm_id", "product_description", "agency", "initiation_type", "lot_codes"]
    output: Recall
    side_effects: ["Recall.status := DRAFT", "Firm.open_recall_count += 1", "increments Firm.version by 1"]

  - method: GET
    path: "/recalls"
    description: "List recalls; the firm_id filter is the reverse-reachability channel for Recall.firm_id -> Firm.id"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["firm_id?", "status?", "hazard_class?", "limit?", "offset?"]
    output: Recall[]
    side_effects: []

  - method: GET
    path: "/recalls/{id}"
    description: "Read one recall with all derived accounting and posture fields"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: POST
    path: "/recalls/{id}/classify"
    description: "Classify or re-classify the recall against a ratified hazard evaluation"
    roles: [RecallCoordinator]
    code: 200
    input: ["hazard_class"]
    output: Recall
    side_effects:
      - "Sets hazard_class and classified_by_user_id"
      - "Recomputes effectiveness_check_level, sample_tier_scope, eligible_consignee_count, required_sample_size, report_cadence_days"
      - "Refreshes Consignee.in_effectiveness_sample for every consignee of the recall"
      - "First classification mints StatusReport period_index=1; re-classification runs CASCADE A (re-date PENDING reports -> OVERDUE flip -> overdue_report_count -> compliance_flag)"

  - method: POST
    path: "/recalls/{id}/checkpoint"
    description: "Advance the recall's reporting and notification epoch: flip due PENDING reports to OVERDUE, age DELIVERED-but-AWAITING notifications to NO_RESPONSE, recompute posture and effectiveness, mint the next PERIODIC report"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: Recall
    side_effects:
      - "StatusReport PENDING -> OVERDUE for every report with due_at <= clock_now"
      - "ConsigneeNotification AWAITING -> NO_RESPONSE per calculations.notification_aging_and_cooling_off"
      - "Recomputes compliance_flag, report_cadence_days, contact/quantity/official effectiveness"
      - "May auto-transition NOTIFICATION_IN_PROGRESS -> RETRIEVAL_ACCOUNTING and RETRIEVAL_ACCOUNTING -> EFFECTIVENESS_REVIEW"
      - "Mints the next PERIODIC StatusReport when no PENDING report remains"

  - method: GET
    path: "/recalls/{id}/effectiveness"
    description: "Computed read returning BOTH effectiveness variants side by side plus the official selection"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: []
    output: { recall_id: string, agency: string, effectiveness_check_level: string, sample_tier_scope: integer, eligible_consignee_count: integer, required_sample_size: integer, responded_count: integer, contact_effectiveness_pct: number, shipped_units: integer, accounted_units: integer, quantity_effectiveness_pct: number, official_basis: string, official_effectiveness_pct: number }
    side_effects: []

  - method: POST
    path: "/recalls/{id}/request-termination"
    description: "Firm files root cause, CAPA and a request to terminate the recall"
    roles: [FirmRecallOfficer]
    code: 200
    input: ["root_cause_code", "capa_summary"]
    output: Recall
    side_effects: ["Recall.status := TERMINATION_REQUESTED", "root_cause_code and capa_summary persisted"]

  - method: POST
    path: "/recalls/{id}/decide-termination"
    description: "Coordinator terminates the recall or denies the request and sends it back to retrieval accounting"
    roles: [RecallCoordinator]
    code: 200
    input: ["decision"]
    output: Recall
    side_effects:
      - "TERMINATE: status := TERMINATED, terminated_at stamped, all PENDING/OVERDUE reports moved to ACCEPTED, Firm.open_recall_count -= 1"
      - "DENY: status := RETRIEVAL_ACCOUNTING, termination_denied_count += 1, compliance_flag COMPLIANT -> WATCH, next PERIODIC StatusReport minted"

  # --- HazardEvaluation ---
  - method: POST
    path: "/recalls/{id}/hazard-evaluations"
    description: "File a health hazard evaluation; OCC-guarded on the recall version"
    roles: [FirmRecallOfficer, RecallCoordinator]
    code: 201
    input: ["probability_of_adverse_health", "severity_tier", "exposure_population", "vulnerable_population?", "evidence_strength", "expected_recall_version"]
    output: HazardEvaluation
    side_effects:
      - "HazardEvaluation.status := DRAFT, variant := PRELIMINARY, hazard_score and recommended_class computed"
      - "increments Recall.version by 1"

  - method: GET
    path: "/recalls/{id}/hazard-evaluations"
    description: "List the recall's hazard evaluations (reverse reachability for HazardEvaluation.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HazardEvaluation[]
    side_effects: []

  - method: POST
    path: "/hazard-evaluations/{id}/submit"
    description: "Submit or resubmit an evaluation to the health hazard panel"
    roles: [FirmRecallOfficer, RecallCoordinator]
    code: 200
    input: []
    output: HazardEvaluation
    side_effects: ["status := SUBMITTED", "variant := PRELIMINARY and hazard_score recomputed", "submitted_by_user_id stamped"]

  - method: POST
    path: "/hazard-evaluations/{id}/decide"
    description: "Health hazard panel ratifies or returns the evaluation"
    roles: [HealthHazardPanel]
    code: 200
    input: ["decision", "panel_note?"]
    output: HazardEvaluation
    side_effects:
      - "RATIFY: variant := RATIFIED, hazard_score and recommended_class recomputed with evidence scaling, ratified_by_user_id stamped, every other RATIFIED evaluation of the recall moves to SUPERSEDED"
      - "RETURN: status := RETURNED, return_count += 1"

  # --- Consignee ---
  - method: POST
    path: "/recalls/{id}/consignees"
    description: "Add a consignee to the distribution tree; omit parent_consignee_id for a direct (tier 1) consignee"
    roles: [FirmRecallOfficer, RecallCoordinator]
    code: 201
    input: ["name", "consignee_type", "parent_consignee_id?"]
    output: Consignee
    side_effects:
      - "tier computed from the parent chain and capped at 3"
      - "Recall.eligible_consignee_count and required_sample_size recomputed; in_effectiveness_sample set"

  - method: GET
    path: "/recalls/{id}/consignees"
    description: "List the recall's consignees (reverse reachability for Consignee.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: Consignee[]
    side_effects: []

  - method: GET
    path: "/consignees/{id}"
    description: "Read one consignee including its derived response_state and escalation_level"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: []
    output: Consignee
    side_effects: []

  - method: GET
    path: "/consignees/{id}/sub-consignees"
    description: "List the consignees this consignee re-shipped to (reverse reachability for Consignee.parent_consignee_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: Consignee[]
    side_effects: []

  # --- DistributionRecord ---
  - method: POST
    path: "/recalls/{id}/distribution-records"
    description: "Declare a shipment line on the reconstructed distribution list"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["consignee_id", "lot_code", "quantity_shipped", "ship_date"]
    output: DistributionRecord
    side_effects: ["status := DECLARED", "effective_quantity := 0 (a DECLARED line contributes nothing to total_shipped_units)"]

  - method: GET
    path: "/recalls/{id}/distribution-records"
    description: "List the recall's distribution lines (reverse reachability for DistributionRecord.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DistributionRecord[]
    side_effects: []

  - method: GET
    path: "/consignees/{id}/distribution-records"
    description: "List the shipment lines to one consignee (reverse reachability for DistributionRecord.consignee_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: DistributionRecord[]
    side_effects: []

  - method: POST
    path: "/distribution-records/{id}/reconcile"
    description: "Reconcile a shipment line: CONFIRM, DISPUTE, CORRECT (requires quantity_confirmed) or VOID"
    roles: [FirmRecallOfficer, RecallCoordinator]
    code: 200
    input: ["outcome", "quantity_confirmed?"]
    output: DistributionRecord
    side_effects: ["effective_quantity recomputed", "reconcile_round += 1", "Recall.total_shipped_units, quantity_effectiveness_pct and official_effectiveness_pct recomputed"]

  # --- ConsigneeNotification ---
  - method: POST
    path: "/recalls/{id}/notifications"
    description: "Dispatch a recall notification to a consignee; OCC-guarded on the consignee version"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["consignee_id", "method", "expected_consignee_version"]
    output: ConsigneeNotification
    side_effects:
      - "delivery_state := SENT, response_state := AWAITING, sent_at := clock_now, attempt_no computed"
      - "Consignee.last_contact_at := sent_at; increments Consignee.version by 1"
      - "Recall CLASSIFIED -> NOTIFICATION_IN_PROGRESS on the first notification"

  - method: GET
    path: "/recalls/{id}/notifications"
    description: "List the recall's notifications (reverse reachability for ConsigneeNotification.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["delivery_state?", "response_state?", "limit?", "offset?"]
    output: ConsigneeNotification[]
    side_effects: []

  - method: GET
    path: "/consignees/{id}/notifications"
    description: "List one consignee's notification attempts (reverse reachability for ConsigneeNotification.consignee_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: ConsigneeNotification[]
    side_effects: []

  - method: POST
    path: "/notifications/{id}/delivery"
    description: "Record the DELIVERY dimension outcome (DELIVERED or UNDELIVERABLE)"
    roles: [FirmRecallOfficer]
    code: 200
    input: ["outcome"]
    output: ConsigneeNotification
    side_effects: ["delivery_state and delivery_recorded_at set", "counts_toward_effectiveness, Consignee.response_state, Recall.responded_count and effectiveness percentages recomputed", "UNDELIVERABLE increments Consignee.escalation_level"]

  - method: POST
    path: "/notifications/{id}/response"
    description: "Record the RESPONSE dimension outcome (ACKNOWLEDGED or REFUSED), independent of the delivery dimension"
    roles: [FirmRecallOfficer]
    code: 200
    input: ["outcome", "response_note?"]
    output: ConsigneeNotification
    side_effects: ["response_state and response_recorded_at set", "counts_toward_effectiveness, Consignee.response_state, Recall.responded_count and effectiveness percentages recomputed", "may auto-transition the recall to RETRIEVAL_ACCOUNTING"]

  # --- RetrievalReceipt ---
  - method: POST
    path: "/recalls/{id}/retrieval-receipts"
    description: "Report one consignee's product accounting (returned / destroyed onsite / held segregated / unrecoverable)"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["consignee_id", "quantity_returned", "quantity_destroyed_onsite", "quantity_held_segregated", "quantity_unrecoverable"]
    output: RetrievalReceipt
    side_effects: ["status := REPORTED", "accounted_units computed as returned + destroyed_onsite + held_segregated"]

  - method: GET
    path: "/recalls/{id}/retrieval-receipts"
    description: "List the recall's retrieval receipts (reverse reachability for RetrievalReceipt.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RetrievalReceipt[]
    side_effects: []

  - method: GET
    path: "/consignees/{id}/retrieval-receipts"
    description: "List one consignee's retrieval receipts (reverse reachability for RetrievalReceipt.consignee_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["limit?", "offset?"]
    output: RetrievalReceipt[]
    side_effects: []

  - method: POST
    path: "/retrieval-receipts/{id}/verify"
    description: "Field investigator adjudicates a receipt: VERIFY, DISPUTE or REOPEN"
    roles: [FieldInvestigator]
    code: 200
    input: ["decision", "verification_note?"]
    output: RetrievalReceipt
    side_effects: ["VERIFY runs CASCADE B: Recall.accounted_units and units_awaiting_disposition increase, effectiveness recomputed, recall may enter EFFECTIVENESS_REVIEW which mints the FINAL_EFFECTIVENESS report"]

  # --- PublicWarning ---
  - method: POST
    path: "/recalls/{id}/public-warnings"
    description: "Draft a press release or public warning"
    roles: [RecallCoordinator]
    code: 201
    input: ["warning_type", "headline", "body"]
    output: PublicWarning
    side_effects: ["status := DRAFT", "drafted_by_user_id := X-User-ID"]

  - method: GET
    path: "/recalls/{id}/public-warnings"
    description: "List the recall's public warnings (reverse reachability for PublicWarning.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PublicWarning[]
    side_effects: []

  - method: POST
    path: "/public-warnings/{id}/submit"
    description: "Send a drafted warning into review"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: PublicWarning
    side_effects: ["status := IN_REVIEW"]

  - method: POST
    path: "/public-warnings/{id}/review"
    description: "Second coordinator approves or rejects the draft; the reviewer must not be the drafter"
    roles: [RecallCoordinator]
    code: 200
    input: ["decision", "review_note?"]
    output: PublicWarning
    side_effects: ["APPROVE: status := APPROVED", "REJECT: status := DRAFT, reject_count += 1", "reviewed_by_user_id stamped"]

  - method: POST
    path: "/public-warnings/{id}/publish"
    description: "Publish an approved warning"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: PublicWarning
    side_effects: ["status := PUBLISHED", "published_at := clock_now"]

  # --- DispositionOrder ---
  - method: POST
    path: "/recalls/{id}/disposition-orders"
    description: "Propose a disposition (destroy / rework / relabel / return-to-firm) for accounted product"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["method", "quantity", "facility_name"]
    output: DispositionOrder
    side_effects: ["status := PROPOSED", "proposed_by_user_id := X-User-ID"]

  - method: GET
    path: "/recalls/{id}/disposition-orders"
    description: "List the recall's disposition orders (reverse reachability for DispositionOrder.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DispositionOrder[]
    side_effects: []

  - method: POST
    path: "/disposition-orders/{id}/authorize"
    description: "Coordinator authorizes the proposed disposition against available custody units"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: DispositionOrder
    side_effects: ["status := AUTHORIZED", "authorized_by_user_id stamped"]

  - method: POST
    path: "/disposition-orders/{id}/execute"
    description: "Firm records execution and the destruction / rework certificate"
    roles: [FirmRecallOfficer]
    code: 200
    input: ["certificate_reference"]
    output: DispositionOrder
    side_effects: ["status := EXECUTED", "executed_at stamped", "Recall.units_awaiting_disposition -= quantity; Recall.units_pending_verification += quantity"]

  - method: POST
    path: "/disposition-orders/{id}/verify"
    description: "Field investigator verifies or rejects the executed disposition"
    roles: [FieldInvestigator]
    code: 200
    input: ["decision", "verification_note?"]
    output: DispositionOrder
    side_effects: ["VERIFY: status := VERIFIED, units move to units_disposed_verified", "REJECT: status := AUTHORIZED, reject_count += 1, units return to units_awaiting_disposition, certificate_reference and executed_at cleared"]

  # --- StatusReport ---
  - method: POST
    path: "/recalls/{id}/status-reports"
    description: "File an interim status report covering an explicit half-open window; overlap-checked against every existing report of the recall"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["report_kind", "period_start", "period_end"]
    output: StatusReport
    side_effects: ["status := PENDING", "period_index := max(existing) + 1", "due_at := period_end"]

  - method: GET
    path: "/recalls/{id}/status-reports"
    description: "List the recall's status reports (reverse reachability for StatusReport.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "report_kind?", "limit?", "offset?"]
    output: StatusReport[]
    side_effects: []

  - method: POST
    path: "/status-reports/{id}/submit"
    description: "Firm submits the report narrative; the current official effectiveness is snapshotted"
    roles: [FirmRecallOfficer]
    code: 200
    input: ["narrative"]
    output: StatusReport
    side_effects: ["status := SUBMITTED", "submitted_at := clock_now", "reported_effectiveness_pct := Recall.official_effectiveness_pct"]

  - method: POST
    path: "/status-reports/{id}/adjudicate"
    description: "Coordinator accepts the report or rejects it back to PENDING with a two-day extension"
    roles: [RecallCoordinator]
    code: 200
    input: ["decision", "adjudication_note?"]
    output: StatusReport
    side_effects: ["ACCEPT: status := ACCEPTED", "REJECT: status := PENDING, reject_count += 1, due_at and period_end += 2 days, narrative and submitted_at cleared"]

  # --- CostEntry ---
  - method: POST
    path: "/recalls/{id}/cost-entries"
    description: "File one incurred recall cost line; overhead loading is applied and rounded on this single line"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["category", "amount_cents", "description"]
    output: CostEntry
    side_effects: ["status := PENDING", "insurable, overhead_rate and line_loaded_cost_cents computed per calculations.recall_cost_accumulation"]

  - method: GET
    path: "/recalls/{id}/cost-entries"
    description: "List the recall's cost entries (reverse reachability for CostEntry.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: CostEntry[]
    side_effects: []

  - method: POST
    path: "/cost-entries/{id}/adjudicate"
    description: "Coordinator accepts or rejects a cost line; the recall cost ledger is re-summed from ACCEPTED lines only"
    roles: [RecallCoordinator]
    code: 200
    input: ["decision", "adjudication_note?"]
    output: CostEntry
    side_effects: ["status := ACCEPTED or REJECTED", "Recall.total_loaded_cost_cents and Recall.insurable_loaded_cost_cents re-summed over ACCEPTED lines"]

  # --- InsuranceClaim ---
  - method: POST
    path: "/recalls/{id}/insurance-claims"
    description: "Open an insurance claim shell in DRAFT"
    roles: [FirmRecallOfficer]
    code: 201
    input: ["claim_reference"]
    output: InsuranceClaim
    side_effects: ["status := DRAFT", "all settlement fields := 0"]

  - method: GET
    path: "/recalls/{id}/insurance-claims"
    description: "List the recall's insurance claims (reverse reachability for InsuranceClaim.recall_id)"
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []

  - method: POST
    path: "/insurance-claims/{id}/submit"
    description: "Submit the claim (or a supplement) and run the sublimit / coinsurance / deductible waterfall"
    roles: [FirmRecallOfficer]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["status := SUBMITTED", "claimed_cents, capped_total_cents, coinsurance_rate, settlement_payable_cents, handling_fee_cents, total_claim_value_cents computed", "supplement_round += 1 when resubmitting from PARTIALLY_PAID"]

  - method: POST
    path: "/insurance-claims/{id}/adjudicate"
    description: "Adjuster pays in full, pays partially, or denies the claim"
    roles: [InsuranceAdjuster]
    code: 200
    input: ["decision", "paid_cents?", "denial_reason?"]
    output: InsuranceClaim
    side_effects: ["paid_cents set", "Firm.policy_paid_to_date_cents += paid_cents on PAY_FULL and PAY_PARTIAL", "status := PAID | PARTIALLY_PAID | DENIED"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the server MUST read that default and MUST NOT fall back to real wall-clock time. Every sent_at, due_at, executed_at, published_at and terminated_at is stamped from this clock."
    roles: [FirmRecallOfficer, RecallCoordinator, HealthHazardPanel, FieldInvestigator, InsuranceAdjuster]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["The logical clock jumps to the supplied instant; no entity is mutated and no aging or cadence rule fires until the next checkpoint or write"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 401, condition: "X-User-Role or X-User-ID header absent, or X-User-Role is not one of the five declared roles" }
  - { id: ERR_ROLE_NOT_PERMITTED, http: 403, condition: "The acting role is not listed in the called endpoint's roles" }
  - { id: ERR_FIRM_NOT_FOUND, http: 404, condition: "Firm addressed by path or by the firm_id body field does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall addressed by the /recalls/{id} path segment does not exist" }
  - { id: ERR_CONSIGNEE_NOT_FOUND, http: 404, condition: "Consignee addressed by path or body does not exist, or belongs to a different recall" }
  - { id: ERR_SUBRESOURCE_NOT_FOUND, http: 404, condition: "Hazard evaluation, distribution record, notification, retrieval receipt, public warning, disposition order, status report, cost entry or insurance claim addressed by a flat action path does not exist" }
  - { id: ERR_FIRM_SCOPE_VIOLATION, http: 403, condition: "A FirmRecallOfficer whose X-User-ID differs from the recall's firm_id touches that recall" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, out-of-range enum, negative or zero quantity where positive is required, unparseable datetime, empty lot_codes, period_start not strictly before period_end, CORRECT outcome without quantity_confirmed, PAY_PARTIAL without a paid_cents strictly between 0 and settlement_payable_cents, DENY without denial_reason" }
  - { id: ERR_STALE_RECALL_VERSION, http: 412, condition: "expected_recall_version does not equal the current Recall.version on POST /recalls/{id}/hazard-evaluations" }
  - { id: ERR_STALE_CONSIGNEE_VERSION, http: 412, condition: "expected_consignee_version does not equal the current Consignee.version on POST /recalls/{id}/notifications" }
  - { id: ERR_INVALID_RECALL_STATE, http: 409, condition: "The recall's status does not permit the operation, including any write on a TERMINATED recall and a TERMINATE decision while compliance_flag == DELINQUENT" }
  - { id: ERR_INVALID_EVALUATION_STATE, http: 409, condition: "Hazard evaluation is not in a state that permits submit or decide" }
  - { id: ERR_INVALID_WARNING_STATE, http: 409, condition: "Public warning is not in a state that permits submit, review or publish" }
  - { id: ERR_INVALID_DISPOSITION_STATE, http: 409, condition: "Disposition order is not in a state that permits authorize, execute or verify" }
  - { id: ERR_INVALID_NOTIFICATION_STATE, http: 409, condition: "delivery_state is not SENT on a delivery call, or response_state is not AWAITING or delivery_state is UNDELIVERABLE on a response call" }
  - { id: ERR_INVALID_ACCOUNTING_STATE, http: 409, condition: "Distribution record status does not permit the requested reconcile outcome, or retrieval receipt status does not permit the requested verify decision" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "Status report is not in a state that permits submit or adjudicate" }
  - { id: ERR_INVALID_CLAIM_STATE, http: 409, condition: "Insurance claim is not in a state that permits submit or adjudicate, or the recall has no accepted insurable cost at submit time" }
  - { id: ERR_INVALID_COST_ENTRY_STATE, http: 409, condition: "Cost entry is already in the state the requested decision would set" }
  - { id: ERR_NO_RATIFIED_EVALUATION, http: 409, condition: "Classification attempted with no RATIFIED hazard evaluation, or re-classification with no evaluation ratified after the previous classification" }
  - { id: ERR_PUBLIC_WARNING_NOT_WARRANTED, http: 422, condition: "Publishing a PRESS_RELEASE or PUBLIC_WARNING on a recall whose hazard_class is CLASS_III" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer equals the warning's drafted_by_user_id, or the termination decider equals Recall.classified_by_user_id" }
  - { id: ERR_CONSIGNEE_NOT_ON_DISTRIBUTION_LIST, http: 422, condition: "A retrieval receipt names a consignee with no CONFIRMED or CORRECTED distribution record on this recall" }
  - { id: ERR_DISTRIBUTION_LIST_INCOMPLETE, http: 409, condition: "A notification is dispatched while at least one distribution record of the recall is still DECLARED" }
  - { id: ERR_NOTIFICATION_COOLING_OFF, http: 409, condition: "A new notification is dispatched before the method-derived cooling-off buffer since the consignee's most recent notification has fully elapsed" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "A filed reporting window half-open-overlaps an existing status report window of the same recall" }
  - { id: ERR_DUPLICATE_ACTIVE_NOTIFICATION, http: 409, condition: "The consignee already has a notification whose delivery_state is SENT" }
  - { id: ERR_OPEN_DISPOSITION_ORDERS, http: 409, condition: "Termination requested while a disposition order is PROPOSED, AUTHORIZED or EXECUTED" }
  - { id: ERR_CONSIGNEE_TIER_LIMIT, http: 422, condition: "The consignee's computed tier would exceed 3" }
  - { id: ERR_QUANTITY_EXCEEDS_SHIPPED, http: 422, condition: "A retrieval receipt would push the consignee's cumulative reported units (over REPORTED and VERIFIED receipts) past its reconciled shipped total" }
  - { id: ERR_DISPOSITION_EXCEEDS_ACCOUNTED_UNITS, http: 422, condition: "Authorizing a disposition whose quantity exceeds Recall.units_awaiting_disposition" }
  - { id: ERR_EFFECTIVENESS_BELOW_TERMINATION_THRESHOLD, http: 422, condition: "Termination requested while Recall.official_effectiveness_pct is below 90.00" }
  - { id: ERR_CLAIM_EXCEEDS_POLICY_AGGREGATE, http: 422, condition: "A claim is submitted while the firm's remaining policy aggregate (policy_aggregate_cents - policy_paid_to_date_cents) is 0 or less" }

# =============================================================================
# §1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: FirmRecallOfficer
    description: "Recall officer employed by the recalling firm. Owns everything the firm must physically do: distribution list reconstruction, consignee notification, retrieval accounting, disposition execution, cost filing, status reporting and the termination request. Every write is tenant-scoped: X-User-ID must equal the recall's firm_id."
    identity: "entity_backed:Firm"
    exclusive_operations:
      - "POST /recalls/{id}/distribution-records"
      - "POST /recalls/{id}/notifications"
      - "POST /notifications/{id}/delivery"
      - "POST /notifications/{id}/response"
      - "POST /recalls/{id}/retrieval-receipts"
      - "POST /recalls/{id}/disposition-orders"
      - "POST /disposition-orders/{id}/execute"
      - "POST /recalls/{id}/status-reports"
      - "POST /status-reports/{id}/submit"
      - "POST /recalls/{id}/cost-entries"
      - "POST /recalls/{id}/insurance-claims"
      - "POST /insurance-claims/{id}/submit"
      - "POST /recalls/{id}/request-termination"
    shared_operations:
      - "POST /recalls"
      - "POST /recalls/{id}/hazard-evaluations"
      - "POST /hazard-evaluations/{id}/submit"
      - "POST /recalls/{id}/consignees"
      - "POST /distribution-records/{id}/reconcile"
      - "POST /_clock/set_current_utc"
      - "All GET endpoints (tenant-scoped to the officer's own firm)"

  - name: RecallCoordinator
    description: "Agency (FDA/USDA) case officer. Owns classification, the public warning workflow, disposition authorization, cost and status-report adjudication, the recall checkpoint and the termination decision. Cannot ratify hazard evaluations, cannot verify field work, cannot adjudicate insurance."
    identity: "opaque"
    exclusive_operations:
      - "POST /firms"
      - "POST /recalls/{id}/classify"
      - "POST /recalls/{id}/checkpoint"
      - "POST /recalls/{id}/decide-termination"
      - "POST /recalls/{id}/public-warnings"
      - "POST /public-warnings/{id}/submit"
      - "POST /public-warnings/{id}/review"
      - "POST /public-warnings/{id}/publish"
      - "POST /disposition-orders/{id}/authorize"
      - "POST /status-reports/{id}/adjudicate"
      - "POST /cost-entries/{id}/adjudicate"
    shared_operations:
      - "POST /recalls"
      - "POST /recalls/{id}/hazard-evaluations"
      - "POST /hazard-evaluations/{id}/submit"
      - "POST /recalls/{id}/consignees"
      - "POST /distribution-records/{id}/reconcile"
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"

  - name: HealthHazardPanel
    description: "Independent health hazard evaluation panel. Its sole write power is ratifying or returning a submitted evaluation; it may never classify the recall itself, which is what forces the two-step evaluation-then-classification separation."
    identity: "opaque"
    exclusive_operations:
      - "POST /hazard-evaluations/{id}/decide"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"

  - name: FieldInvestigator
    description: "Agency field investigator. Verifies the firm's physical claims: retrieval receipts and witnessed disposition execution. Cannot create the artifacts it verifies."
    identity: "opaque"
    exclusive_operations:
      - "POST /retrieval-receipts/{id}/verify"
      - "POST /disposition-orders/{id}/verify"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"

  - name: InsuranceAdjuster
    description: "Carrier-side adjuster. Adjudicates submitted claims only; may never file a claim, file a cost entry, or adjudicate a cost entry."
    identity: "opaque"
    exclusive_operations:
      - "POST /insurance-claims/{id}/adjudicate"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"
