          - entities.PackageComponent.fields.allocated_cents
        distinguishing_aspect: "A 24240 hotel plus a 143106 air component give components_subtotal_cents 167346, which selects the 100000 tier at 0.06: discount_cents floor(10040.76) == 10040, per-component floors 1454 and 8586 need no remainder cent, allocated 22786 and 134520, package_total_cents 157306."
