          - errors[ERR_RESALE_HOLD_ACTIVE]
          - endpoints["POST /transfer-requests"]
        distinguishing_aspect: "A CLASSIC membership resold on day 0 violates both RESALE rules at once (tier.resale_allowed false and 0 of 730 hold days elapsed) and must return the priority-37 error; the same request on a resale-enabled tier returns the priority-38 error instead, and a GIFT on the CLASSIC membership is untouched by either rule."
        test_recipe:
          setup:
            - "Two tiers sold on the same day: CLASSIC with resale_allowed false and transfer_fee_cents 60000, PRESIDENT with resale_allowed true"
            - "The clock stays at 2026-08-01T00:00:00Z, so purchased_at + RESALE_HOLD_DAYS (2028-07-31) is far in the future for both memberships"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
