  - rule_id: resource_temporal_overlap
    instances:
      - name: coordination_task_half_open_adjacency
        grounds:
          - validations[priority=23]
          - errors[ERR_OVERLAPPING_TASK]
          - entities.CoordinationTask.fields.due_date
        distinguishing_aspect: |
          Half-open interval semantics on CoordinationTask: a new task whose window begins exactly
          at the prior task's due_date is ADJACENT and accepted, while one beginning one day earlier
          overlaps and is rejected with ERR_OVERLAPPING_TASK.
        test_recipe:
          setup:
            - "Referral R for program P has one non-terminal CoordinationTask T1 (PHOTOGRAPHY) with due_date 2026-09-05, so its half-open window is [2026-08-06, 2026-09-05)."
