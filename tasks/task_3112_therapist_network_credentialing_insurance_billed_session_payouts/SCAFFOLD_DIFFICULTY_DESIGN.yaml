  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: claim_submission_requires_the_session_transcription_axis_to_be_completed
        grounds:
          - state_machines.Session.transitions.SCHEDULED_to_COMPLETED
          - state_machines.Session.billing_state
          - state_machines.Claim.transitions.DRAFT_to_SUBMITTED
          - validations[priority=4]
          - errors.ERR_INVALID_STATE
          - endpoints.POST_/network/claims
        distinguishing_aspect: "The Claim entity's eligible transitions depend on the Session entity's status, not on any field of the Claim: a session that is SCHEDULED blocks claim creation with 409 ERR_INVALID_STATE, and only the separate completion transition on the Session admits the claim."
