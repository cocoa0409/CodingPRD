              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T11:00:00Z", expected_inspector_version: "${insp_1_v}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/begin"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/complete"
              payload: {}
              as: FieldInspector
              as_user_id: "${insp_1}"
              captures: { o1_fee: "$.data.assessed_fee_cents" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/_ops/delinquency-sweep"
              payload: {}
              as: FeeAdministrator
              as_user_id: "fee-01"
              captures: { suspended_owners: "$.data.suspended_owner_count" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_h}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-09-05T08:00:00Z", requested_window_end_at: "2026-09-05T17:00:00Z" }
              as: LivestockOwner
