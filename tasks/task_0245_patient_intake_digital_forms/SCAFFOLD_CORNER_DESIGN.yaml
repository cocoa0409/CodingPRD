          - "errors[ERR_STALE_ROOM_VERSION]"
        distinguishing_aspect: "Creating a RoomBooking with expected_exam_room_version one less than the room's current version (already bumped by a prior booking) -> ERR_STALE_ROOM_VERSION (412)."
        test_recipe:
          setup: ["Room with one prior booking 08:00-08:30 (version bumped); session READY so a queue entry exists to attach the booking."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CE20", facility_fee_cents: 0 }
              as: ClinicAdmin
              captures: { ce20: $.data.id }
            - call: "POST /exam-rooms"
