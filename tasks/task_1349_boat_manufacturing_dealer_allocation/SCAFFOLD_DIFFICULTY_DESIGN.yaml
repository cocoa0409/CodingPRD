              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { err: $.data.error_id }
          assert:
            - "Second confirm returns error_id == ERR_INVALID_ORDER_STATE (state priority 7 beats any business_fiscal re-check)"
            - "http_status == 409 (state), not 422 (business_fiscal)"

      - name: business_temporal_beats_business_fiscal_on_amend_after_cutoff
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - state_machines.DealerOrder.ALLOCATED_to_ALLOCATED
        distinguishing_aspect: |
          Category pair business_temporal (priority 9) vs business_fiscal (priority 11):
          amending an ALLOCATED order AFTER the option_change_cutoff while also
          proposing a deposit that is below the new required_deposit must return
          ERR_OPTION_CUTOFF_PASSED (422 temporal), not ERR_DEPOSIT_INSUFFICIENT (422
          fiscal). Different pair than instance 1 (state vs fiscal).
        test_recipe:
          setup:
            - "SP190 model; dealer D1 STANDARD; option TOWER (price 350000) plus option BALLAST (price 180000)"
            - "Run cutoff 2026-08-05T12:00:00Z; slot cap 200; order O1 with [TOWER] -> invoice 2917475, required_deposit 291748 (RETAIL STANDARD 0.10)"
            - "Clock advanced past cutoff to 2026-08-06T00:00:00Z"
            - "Amendment proposes options [TOWER, BALLAST] with deposit 1 cent — would fail both temporal (cutoff) AND fiscal (deposit insufficient for 309361 required)"
          setup_api_calls:
            - call: "POST /boat-models"
              payload: { model_code: "SP190", model_name: "Sport 190", model_year: 2027, base_price_cents: 2500000, length_feet: 19.5, production_hours: 40 }
              as: SystemAdmin
