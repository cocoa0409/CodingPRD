            - "${open_status} == OPEN and Loan.${l1}.purchase_status is still PURCHASED — a post-purchase finding does not disturb the completed purchase"
            - "${e_none} == ERR_DEFECT_EVIDENCE_REQUIRED with HTTP 422 (no source_defect_id)"
            - "${e_cured} == ERR_DEFECT_EVIDENCE_REQUIRED with HTTP 422 (CURED is not repurchase evidence)"
            - "${e_low} == ERR_DEFECT_EVIDENCE_REQUIRED with HTTP 422 (WAIVED but severity LOW)"
            - "${e_open} == ERR_DEFECT_EVIDENCE_REQUIRED with HTTP 422 (HIGH but still OPEN)"
            - "the MISREPRESENTATION demand returns HTTP 201: RepurchaseDemand.${d_ok}.source_defect_id == ${d_waived}, ${rec} == 40237389 and ${price} == 40287389"
            - "Loan.${l1}.purchase_status == REPURCHASE_DEMANDED after the accepted demand"

      - name: paired_off_line_state_check_precedes_the_capacity_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: paired_off_commitment_state_beats_capacity_exceeded_on_delivery
          rationale: |
            The §1.8 ordering instance already delivers into a PAIRED_OFF line
            with a note amount that also exceeds the (now zero) residual and
            pins the answer to ERR_COMMITMENT_NOT_OPEN at priority 23 rather
            than ERR_COMMITMENT_CAPACITY_EXCEEDED at priority 66, so a second
            probe of the same pair would add no discrimination.

      - name: suspended_delivery_standing_check_precedes_the_window_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: suspended_seller_beats_expired_commitment_on_delivery
          rationale: |
            ERR_SELLER_DELIVERY_SUSPENDED (priority 34) is already shown beating
            ERR_COMMITMENT_EXPIRED (priority 46) on a delivery that violates
            both, including the reinstatement replay that lets the same call
            through afterwards.

      - name: net_worth_minimum_boundary_on_approval
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: tangible_net_worth_exactly_at_minimum_approves_and_one_cent_below_fails
          rationale: |
            The inclusive 250000000 boundary for ERR_NET_WORTH_BELOW_MINIMUM
            (priority 37) is already pinned from both sides by the §1.8
            boundary instance, together with the tier and exposure-limit
            consequences of approving exactly at the floor.

      - name: escrow_completion_blocked_while_the_loan_is_under_repurchase
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: escrow_completion_gated_by_loan_repurchase_state_then_allowed_after_rescind
          rationale: |
            ERR_LOAN_UNDER_REPURCHASE (priority 42) is already exercised as a
            cross-entity gate in §1.8: completion is refused while the loan sits
            in REPURCHASE_DEMANDED and the identical call succeeds once the
            demand is RESCINDED and the loan returns to PURCHASED.

      - name: mandatory_delivery_window_overlap_on_a_second_lock
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: mandatory_delivery_windows_overlap_touching_allowed_best_efforts_exempt
          rationale: |
            ERR_DELIVERY_WINDOW_OVERLAP (priority 47) is already probed at its
            hardest edge in §1.8 — touching windows accepted, one-day overlap
            refused, BEST_EFFORTS exempt, and a paired-off line no longer
            blocking — so no additional violation probe is warranted here.

      - name: scorecard_period_overlap_on_a_second_period
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: scorecard_periods_sharing_an_endpoint_date_overlap
          rationale: |
            ERR_SCORECARD_PERIOD_OVERLAP (priority 48) is already pinned by the
            §1.8 closed-interval instance, which shows that periods sharing a
            single endpoint date DO overlap (unlike delivery windows) and that
            a period starting the day after is accepted.

