scenario: |
  Volunteer management platform: volunteer registration and skill tagging with identity verification, skill self-declaration, qualification certificate upload, background check for sensitive activities, and skill-tag administrator review; activity publishing with activity description, time and location, required skill tags, position quota, recruitment period, and review-and-shelving workflow; position matching with skill-tag matching, geographic-distance filtering, historical-participation reference, application and approval, and multi-activity time-conflict check; check-in and check-out with on-site code/GPS-based check-in, late and early-departure marking, leave application, manual correction by organizer, and exception handling; service hour statistics with rule-based hour calculation (actual duration/fixed value/role-coefficient), multi-activity aggregation, hour adjustment and approval, and historical hour archiving; points redemption with point-earning rules (hours/activity-difficulty/role), point-mall item management, redemption order workflow, inventory deduction, and point-expiration handling; certificate issuance with certificate-template configuration, eligibility rules (minimum hours/activity count), batch issuance, electronic certificate verification, and re-issuance workflow; event-driven synchronization with IM, identity verification, and partner-organization systems; audit logging for hour adjustments and certificate issuance.

domain_name: volunteer-management
api_prefix: /volunteers

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - compliance_audit
    - scheduled_deferred_actions
    - selector_policy
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name from identity verification
        constraints: 1..100 chars
      - name: id_number_hash
        type: string
        source: input
        description: hash of national ID number for dedup
        constraints: unique across all volunteers
      - name: identity_verification_status
        type: enum
        source: computed
        description: state of identity verification
        constraints: "values: PENDING, VERIFIED, REJECTED"
        default: PENDING
      - name: background_check_status
        type: enum
        source: computed
        description: required for sensitive activities
        constraints: "values: NONE, PENDING, CLEARED, FAILED"
        default: NONE
      - name: home_lat
        type: number
        source: input
        description: home latitude for geographic filtering
        constraints: -90..90
      - name: home_lng
        type: number
        source: input
        description: home longitude for geographic filtering
        constraints: -180..180
      - name: total_service_hours
        type: number
        source: computed
        description: cumulative service hours after adjustments and archiving
        default: 0
        constraints: 2 decimals, recomputed on every hour change
      - name: total_completed_activities
        type: integer
        source: computed
        description: count of activities where this volunteer has at least one COMPLETED participation
        default: 0
      - name: points_balance
        type: integer
        source: computed
        description: live, non-expired point balance available for redemption
        default: 0
      - name: archived_hours
        type: number
        source: computed
        description: hours moved to archive (no longer counted toward eligibility windows but counted in lifetime total)
        default: 0

  - name: Skill
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: unique skill code (e.g., FIRST_AID)
        constraints: unique, 2..40 chars, uppercase snake_case
      - name: name
        type: string
        source: input
        description: human-readable skill name
      - name: requires_certificate
        type: boolean
        source: input
        description: if true, volunteer must upload approved cert to claim this skill
        default: false
      - name: sensitivity_level
        type: enum
        source: input
        description: drives background-check requirement
        constraints: "values: STANDARD, SENSITIVE"
        default: STANDARD

  - name: VolunteerSkill
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC
      - name: volunteer_id
        type: string
        source: input
        description: FK Volunteer.id
      - name: skill_id
        type: string
        source: input
        description: FK Skill.id
      - name: certificate_url
        type: string
        source: input
        description: optional URL to qualification certificate (required if Skill.requires_certificate)
        default: null
      - name: review_status
        type: enum
        source: computed
        description: skill-tag administrator review state
        constraints: "values: SELF_DECLARED, UNDER_REVIEW, APPROVED, REJECTED"
        default: SELF_DECLARED
      - name: reviewed_at
        type: datetime
        source: system
        description: timestamp of latest review action
        default: null
      - name: reviewer_id
        type: string
        source: system
        description: SkillAdmin user id who approved/rejected
        default: null

  - name: Activity
    parent: null
    common_fields: true
    fields:
      - name: organizer_id
        type: string
        source: system
        description: id of Organizer who created this activity
      - name: title
        type: string
        source: input
        description: activity title, 1..120 chars
      - name: description
        type: string
        source: input
        description: activity description, 1..2000 chars
      - name: location_lat
        type: number
        source: input
        description: latitude of activity site
        constraints: -90..90
      - name: location_lng
        type: number
        source: input
        description: longitude of activity site
        constraints: -180..180
      - name: start_at
        type: datetime
        source: input
        description: activity start (UTC)
      - name: end_at
        type: datetime
        source: input
        description: activity end (UTC); must be > start_at
      - name: recruit_open_at
        type: datetime
        source: input
        description: recruitment window opens
      - name: recruit_close_at
        type: datetime
        source: input
        description: recruitment window closes; must be < start_at
      - name: required_skill_codes
        type: array
        source: input
        description: list of Skill.code; volunteers must hold APPROVED VolunteerSkill for ALL of these
        default: []
      - name: position_quota
        type: integer
        source: input
        description: total approved positions allowed
        constraints: 1..1000
      - name: filled_positions
        type: integer
        source: computed
        description: count of Application in APPROVED or COMPLETED for this activity
        default: 0
      - name: difficulty
        type: enum
        source: input
        description: activity difficulty level for point earning
        constraints: "values: EASY, MEDIUM, HARD"
        default: MEDIUM
      - name: hour_rule_type
        type: enum
        source: input
        description: which hour-calculation mode applies to this activity
        constraints: "values: ACTUAL_DURATION, FIXED_VALUE, ROLE_COEFFICIENT"
        default: ACTUAL_DURATION
      - name: fixed_hour_value
        type: number
        source: input
        description: per-volunteer credited hours if hour_rule_type == FIXED_VALUE
        default: null
        constraints: required when hour_rule_type == FIXED_VALUE; 0.25..24
      - name: requires_sensitive_clearance
        type: boolean
        source: computed
        description: true if any required_skill_codes references a Skill with sensitivity_level == SENSITIVE
        default: false
      - name: status
        type: enum
        source: computed
        description: activity lifecycle state
        constraints: "values: DRAFT, UNDER_REVIEW, PUBLISHED, RECRUITING, RUNNING, COMPLETED, SHELVED, REJECTED"
        default: DRAFT
      - name: site_code
        type: string
        source: system
        description: 6-digit numeric on-site check-in code minted at PUBLISHED transition
        default: null

  - name: ActivityRole
    parent: Activity
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC
      - name: activity_id
        type: string
        source: input
        description: FK Activity.id
      - name: role_label
        type: string
        source: input
        description: e.g., LEAD, SUPPORT, REGULAR
        constraints: unique within activity, 1..40 chars
      - name: coefficient
        type: number
        source: input
        description: multiplier when hour_rule_type == ROLE_COEFFICIENT, applied to actual duration
        constraints: 0.5..3.0, 2 decimals
        default: 1.0

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: activity_id
        type: string
        source: input
        description: FK Activity.id
      - name: volunteer_id
        type: string
        source: input
        description: FK Volunteer.id
      - name: activity_role_id
        type: string
        source: input
        description: FK ActivityRole.id; must belong to activity_id
        default: null
      - name: distance_km
        type: number
        source: computed
        description: haversine distance from Volunteer.home to Activity.location at apply time, 2 decimals
      - name: status
        type: enum
        source: computed
        description: application lifecycle state
        constraints: "values: APPLIED, APPROVED, REJECTED, WITHDRAWN, CHECKED_IN, ON_LEAVE, COMPLETED, NO_SHOW"
        default: APPLIED
      - name: check_in_at
        type: datetime
        source: system
        description: timestamp of check-in
        default: null
      - name: check_in_lat
        type: number
        source: input
        description: GPS latitude at check-in
        default: null
      - name: check_in_lng
        type: number
        source: input
        description: GPS longitude at check-in
        default: null
      - name: check_out_at
        type: datetime
        source: system
        description: timestamp of check-out
        default: null
      - name: late_marker
        type: boolean
        source: computed
        description: true if check_in_at > Activity.start_at + 15 minutes
        default: false
      - name: early_departure_marker
        type: boolean
        source: computed
        description: true if check_out_at < Activity.end_at - 15 minutes
        default: false
      - name: credited_hours
        type: number
        source: computed
        description: hours awarded by hour-calculation rule, before adjustments
        default: 0
      - name: adjusted_hours
        type: number
        source: computed
        description: net hours after approved HourAdjustment delta; mirrors Application.credited_hours when no adjustment exists
        default: 0
      - name: points_awarded
        type: integer
        source: computed
        description: points granted at COMPLETION transition, immutable after
        default: 0
      - name: leave_reason
        type: string
        source: input
        description: required for ON_LEAVE transition, 1..500 chars
        default: null

  - name: HourAdjustment
    parent: Application
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK Application.id
      - name: requested_by_id
        type: string
        source: system
        description: id of Organizer who filed adjustment
      - name: delta_hours
        type: number
        source: input
        description: signed hour delta (positive or negative); -8..8, 2 decimals, non-zero
        constraints: must produce final adjusted_hours >= 0
      - name: reason
        type: string
        source: input
        description: 10..500 chars
      - name: status
        type: enum
        source: computed
        description: adjustment workflow
        constraints: "values: PENDING, APPROVED, REJECTED"
        default: PENDING
      - name: approver_id
        type: string
        source: system
        description: SkillAdmin user id who approved/rejected
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: timestamp of approval/rejection
        default: null

  - name: PointMallItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: unique SKU
        constraints: unique, 2..40 chars
      - name: name
        type: string
        source: input
        description: item display name
      - name: point_cost
        type: integer
        source: input
        description: integer point cost per unit
        constraints: 1..100000
      - name: stock
        type: integer
        source: computed
        description: live inventory count
        default: 0
      - name: status
        type: enum
        source: computed
        description: shelf state
        constraints: "values: ACTIVE, OUT_OF_STOCK, ARCHIVED"
        default: ACTIVE

  - name: RedemptionOrder
    parent: null
    common_fields: true
    fields:
      - name: volunteer_id
        type: string
        source: input
        description: FK Volunteer.id
      - name: item_id
        type: string
        source: input
        description: FK PointMallItem.id
      - name: quantity
        type: integer
        source: input
        description: units requested
        constraints: 1..10
      - name: total_points
        type: integer
        source: computed
        description: PointMallItem.point_cost * quantity, snapshot at creation
      - name: status
        type: enum
        source: computed
        description: redemption workflow
        constraints: "values: PENDING, FULFILLED, CANCELLED"
        default: PENDING

  - name: CertificateTemplate
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: unique template code
        constraints: unique, 2..40 chars
      - name: title
        type: string
        source: input
        description: certificate display title
      - name: min_hours
        type: number
        source: input
        description: minimum total_service_hours required to be eligible
        constraints: "> 0, 2 decimals"
      - name: min_completed_activities
        type: integer
        source: input
        description: minimum total_completed_activities required to be eligible
        constraints: ">= 1"
      - name: status
        type: enum
        source: computed
        description: template lifecycle
        constraints: "values: ACTIVE, ARCHIVED"
        default: ACTIVE

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - name: template_id
        type: string
        source: input
        description: FK CertificateTemplate.id (snapshot at issuance)
      - name: volunteer_id
        type: string
        source: input
        description: FK Volunteer.id
      - name: serial_number
        type: string
        source: system
        description: unique 12-char alphanumeric verification code
        constraints: unique
      - name: hours_at_issuance
        type: number
        source: system
        description: snapshot of Volunteer.total_service_hours at issuance
      - name: activities_at_issuance
        type: integer
        source: system
        description: snapshot of Volunteer.total_completed_activities at issuance
      - name: status
        type: enum
        source: computed
        description: certificate status
        constraints: "values: ISSUED, REVOKED, REISSUED"
        default: ISSUED
      - name: replacement_serial_number
        type: string
        source: system
        description: when REISSUED, points at the new certificate's serial_number
        default: null

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC
      - name: actor_role
        type: string
        source: system
        description: role that performed the action
      - name: actor_id
        type: string
        source: system
        description: id of acting user
      - name: action_type
        type: enum
        source: system
        description: what kind of audited action this was
        constraints: "values: HOUR_ADJUST_REQUEST, HOUR_ADJUST_APPROVE, HOUR_ADJUST_REJECT, CERTIFICATE_ISSUE, CERTIFICATE_REISSUE, CERTIFICATE_REVOKE"
      - name: target_entity
        type: string
        source: system
        description: target entity name (e.g., HourAdjustment, Certificate)
      - name: target_id
        type: string
        source: system
        description: target entity id
      - name: payload
        type: object
        source: system
        description: action-specific JSON snapshot

  - name: PartnerSyncEvent
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: server-minted UUID
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC
      - name: channel
        type: enum
        source: system
        description: which downstream channel
        constraints: "values: IM, IDENTITY_PROVIDER, PARTNER_ORG"
      - name: event_type
        type: string
        source: system
        description: e.g., VOLUNTEER_VERIFIED, ACTIVITY_PUBLISHED, CERTIFICATE_ISSUED
      - name: payload
        type: object
        source: system
        description: serialized event body

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:
  - entity: Volunteer
    initial_state: PENDING
    terminal_states: []
    note: |
      Two parallel dimensions on Volunteer:
        identity_verification_status: PENDING -> VERIFIED -> (REJECTED)
        background_check_status: NONE -> PENDING -> CLEARED -> (FAILED)
      Background check is independent of identity verification but cannot be
      requested until identity is VERIFIED.
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /volunteers/{id}/identity:verify (system event from IdentityProvider sync)"
        actor: SkillAdmin
        preconditions:
          - "Volunteer.identity_verification_status == PENDING"
        side_effects:
          - "set Volunteer.identity_verification_status = VERIFIED"
          - "emit PartnerSyncEvent(channel=IM, event_type=VOLUNTEER_VERIFIED)"
          - "emit PartnerSyncEvent(channel=IDENTITY_PROVIDER, event_type=VOLUNTEER_VERIFIED)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /volunteers/{id}/identity:reject"
        actor: SkillAdmin
        preconditions:
          - "Volunteer.identity_verification_status == PENDING"
        side_effects:
          - "set Volunteer.identity_verification_status = REJECTED"
      - from: NONE
        to: PENDING
        trigger: "POST /volunteers/{id}/background-check:request"
        actor: Volunteer
        preconditions:
          - "Volunteer.identity_verification_status == VERIFIED"
          - "Volunteer.background_check_status == NONE"
        side_effects:
          - "set Volunteer.background_check_status = PENDING"
      - from: PENDING
        to: CLEARED
        trigger: "POST /volunteers/{id}/background-check:clear"
        actor: SkillAdmin
        preconditions:
          - "Volunteer.background_check_status == PENDING"
        side_effects:
          - "set Volunteer.background_check_status = CLEARED"
      - from: PENDING
        to: FAILED
        trigger: "POST /volunteers/{id}/background-check:fail"
        actor: SkillAdmin
        preconditions:
          - "Volunteer.background_check_status == PENDING"
        side_effects:
          - "set Volunteer.background_check_status = FAILED"

  - entity: VolunteerSkill
    initial_state: SELF_DECLARED
    terminal_states: [REJECTED]
    transitions:
      - from: SELF_DECLARED
        to: UNDER_REVIEW
        trigger: "POST /volunteer-skills/{id}/submit"
        actor: Volunteer
        preconditions:
          - "Skill.requires_certificate == false OR VolunteerSkill.certificate_url IS NOT NULL"
        side_effects:
          - "set VolunteerSkill.review_status = UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /volunteer-skills/{id}/approve"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set VolunteerSkill.review_status = APPROVED, reviewer_id, reviewed_at = now"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /volunteer-skills/{id}/reject"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set VolunteerSkill.review_status = REJECTED, reviewer_id, reviewed_at = now"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /volunteer-skills/{id}/resubmit (revision after expired cert URL)"
        actor: Volunteer
        preconditions:
          - "VolunteerSkill.certificate_url updated"
        side_effects:
          - "set VolunteerSkill.review_status = UNDER_REVIEW"

  - entity: Activity
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, SHELVED]
    note: |
      Branching workflow with revert: DRAFT -> UNDER_REVIEW -> {PUBLISHED | REJECTED};
      PUBLISHED auto-transitions to RECRUITING when clock reaches recruit_open_at,
      to RUNNING when clock reaches start_at, and to COMPLETED when clock reaches end_at.
      RECRUITING can be SHELVED by Organizer (also a revert from PUBLISHED).
      REJECTED -> DRAFT loop allowed (revision cycle).
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /activities/{id}/submit"
        actor: Organizer
        preconditions:
          - "Activity.organizer_id == acting Organizer.id"
          - "Activity.recruit_close_at < Activity.start_at < Activity.end_at"
          - "Activity.recruit_open_at < Activity.recruit_close_at"
          - "all Activity.required_skill_codes resolve to existing Skill rows"
          - "Activity.position_quota >= 1"
        side_effects:
          - "set Activity.status = UNDER_REVIEW"
          - "compute and set Activity.requires_sensitive_clearance from Skill.sensitivity_level"
      - from: UNDER_REVIEW
        to: PUBLISHED
        trigger: "POST /activities/{id}/approve"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set Activity.status = PUBLISHED"
          - "mint Activity.site_code as 6-digit numeric"
          - "emit PartnerSyncEvent(channel=PARTNER_ORG, event_type=ACTIVITY_PUBLISHED)"
          - "emit PartnerSyncEvent(channel=IM, event_type=ACTIVITY_PUBLISHED)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /activities/{id}/reject"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set Activity.status = REJECTED"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /activities/{id}/revise"
        actor: Organizer
        preconditions:
          - "Activity.organizer_id == acting Organizer.id"
        side_effects:
          - "set Activity.status = DRAFT"
      - from: PUBLISHED
        to: RECRUITING
        trigger: "system clock advance to >= Activity.recruit_open_at via POST /_clock/advance"
        actor: system
        preconditions:
          - "Activity.status == PUBLISHED"
          - "now() >= Activity.recruit_open_at"
        side_effects:
          - "set Activity.status = RECRUITING"
      - from: RECRUITING
        to: RUNNING
        trigger: "system clock advance to >= Activity.start_at via POST /_clock/advance"
        actor: system
        preconditions:
          - "Activity.status == RECRUITING"
          - "now() >= Activity.start_at"
        side_effects:
          - "set Activity.status = RUNNING"
          - "auto-reject all Application rows still in APPLIED for this activity (status -> REJECTED)"
      - from: RUNNING
        to: COMPLETED
        trigger: "system clock advance to >= Activity.end_at via POST /_clock/advance"
        actor: system
        preconditions:
          - "Activity.status == RUNNING"
          - "now() >= Activity.end_at"
        side_effects:
          - "set Activity.status = COMPLETED"
          - "for each Application in CHECKED_IN with no check_out_at: stamp check_out_at = Activity.end_at, transition Application -> COMPLETED, run hour_calc, run point_calc, increment Volunteer.total_completed_activities, update Volunteer.total_service_hours, update Volunteer.points_balance"
          - "for each Application in APPROVED with no check_in_at: transition Application -> NO_SHOW"
      - from: PUBLISHED
        to: SHELVED
        trigger: "POST /activities/{id}/shelve"
        actor: Organizer
        preconditions:
          - "Activity.organizer_id == acting Organizer.id"
          - "Activity.filled_positions == 0"
        side_effects:
          - "set Activity.status = SHELVED"
      - from: RECRUITING
        to: SHELVED
        trigger: "POST /activities/{id}/shelve"
        actor: Organizer
        preconditions:
          - "Activity.organizer_id == acting Organizer.id"
          - "Activity.filled_positions == 0"
        side_effects:
          - "set Activity.status = SHELVED"

  - entity: Application
    initial_state: APPLIED
    terminal_states: [REJECTED, WITHDRAWN, COMPLETED, NO_SHOW]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /applications/{id}/approve"
        actor: Organizer
        preconditions:
          - "Application.activity.organizer_id == acting Organizer.id"
          - "Application.activity.status == RECRUITING"
          - "Activity.filled_positions < Activity.position_quota (strict <)"
          - "no other Application of same volunteer in {APPROVED, CHECKED_IN, ON_LEAVE} whose Activity time-window [start_at, end_at] overlaps this Activity's time-window (closed-closed intervals; touching endpoints count as overlap)"
        side_effects:
          - "set Application.status = APPROVED"
          - "increment Activity.filled_positions by 1"
      - from: APPLIED
        to: REJECTED
        trigger: "POST /applications/{id}/reject"
        actor: Organizer
        preconditions:
          - "Application.activity.organizer_id == acting Organizer.id"
        side_effects:
          - "set Application.status = REJECTED"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Volunteer
        preconditions:
          - "Application.volunteer_id == acting Volunteer.id"
        side_effects:
          - "set Application.status = WITHDRAWN"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /applications/{id}/withdraw"
        actor: Volunteer
        preconditions:
          - "Application.volunteer_id == acting Volunteer.id"
          - "Application.activity.status IN {RECRUITING}"
        side_effects:
          - "set Application.status = WITHDRAWN"
          - "decrement Activity.filled_positions by 1"
      - from: APPROVED
        to: CHECKED_IN
        trigger: "POST /applications/{id}/check-in"
        actor: Volunteer
        preconditions:
          - "Application.volunteer_id == acting Volunteer.id"
          - "Activity.status == RUNNING"
          - "Either: site_code in body matches Activity.site_code; OR haversine distance between (check_in_lat, check_in_lng) and (Activity.location_lat, Activity.location_lng) <= 0.50 km (500 m)"
        side_effects:
          - "set Application.status = CHECKED_IN, check_in_at = now"
          - "if check_in_at > Activity.start_at + 15 minutes: set Application.late_marker = true"
      - from: CHECKED_IN
        to: ON_LEAVE
        trigger: "POST /applications/{id}/leave"
        actor: Volunteer
        preconditions:
          - "Application.volunteer_id == acting Volunteer.id"
          - "Application.leave_reason length 1..500"
          - "Activity.status == RUNNING"
        side_effects:
          - "set Application.status = ON_LEAVE"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /applications/{id}/check-out"
        actor: Volunteer
        preconditions:
          - "Application.volunteer_id == acting Volunteer.id"
          - "Activity.status == RUNNING"
        side_effects:
          - "set Application.status = COMPLETED, check_out_at = now"
          - "if check_out_at < Activity.end_at - 15 minutes: set Application.early_departure_marker = true"
          - "run service_hour_calc; set Application.credited_hours and Application.adjusted_hours"
          - "run point_earn_calc; set Application.points_awarded"
          - "increment Volunteer.total_completed_activities by 1"
          - "increase Volunteer.total_service_hours by Application.adjusted_hours"
          - "increase Volunteer.points_balance by Application.points_awarded"
      - from: APPROVED
        to: NO_SHOW
        trigger: "automatic — Activity transitions RUNNING -> COMPLETED while this Application has no check_in_at"
        actor: system
        preconditions:
          - "Application.status == APPROVED"
          - "Application.check_in_at IS NULL"
          - "Activity.status transitioning to COMPLETED"
        side_effects:
          - "set Application.status = NO_SHOW"

  - entity: HourAdjustment
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /hour-adjustments/{id}/approve"
        actor: SkillAdmin
        preconditions:
          - "Application.status == COMPLETED"
          - "Application.adjusted_hours + HourAdjustment.delta_hours >= 0"
        side_effects:
          - "set HourAdjustment.status = APPROVED, approver_id, decided_at = now"
          - "old_adjusted = Application.adjusted_hours"
          - "set Application.adjusted_hours = old_adjusted + HourAdjustment.delta_hours"
          - "old_points = Application.points_awarded"
          - "recompute Application.points_awarded via point_earn_calc using new adjusted_hours"
          - "Volunteer.total_service_hours += (Application.adjusted_hours - old_adjusted)"
          - "Volunteer.points_balance += (Application.points_awarded - old_points)"
          - "append AuditLog(action_type=HOUR_ADJUST_APPROVE, target=HourAdjustment, payload includes old_adjusted, new_adjusted, old_points, new_points)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /hour-adjustments/{id}/reject"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set HourAdjustment.status = REJECTED, approver_id, decided_at = now"
          - "append AuditLog(action_type=HOUR_ADJUST_REJECT, target=HourAdjustment)"

  - entity: PointMallItem
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: OUT_OF_STOCK
        trigger: "automatic — RedemptionOrder fulfillment drives stock to 0"
        actor: system
        preconditions:
          - "PointMallItem.stock == 0 after deduction"
        side_effects:
          - "set PointMallItem.status = OUT_OF_STOCK"
      - from: OUT_OF_STOCK
        to: ACTIVE
        trigger: "POST /point-mall-items/{id}/restock"
        actor: SkillAdmin
        preconditions:
          - "delta > 0"
        side_effects:
          - "increase PointMallItem.stock by delta"
          - "set PointMallItem.status = ACTIVE"
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /point-mall-items/{id}/archive"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set PointMallItem.status = ARCHIVED"
      - from: OUT_OF_STOCK
        to: ARCHIVED
        trigger: "POST /point-mall-items/{id}/archive"
        actor: SkillAdmin
        preconditions: []
        side_effects:
          - "set PointMallItem.status = ARCHIVED"

  - entity: RedemptionOrder
    initial_state: PENDING
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: "POST /redemption-orders/{id}/fulfill"
        actor: SkillAdmin
        preconditions:
          - "PointMallItem.status IN {ACTIVE}"
          - "PointMallItem.stock >= RedemptionOrder.quantity"
          - "Volunteer.points_balance >= RedemptionOrder.total_points (re-check, since balance may have shifted)"
        side_effects:
          - "set RedemptionOrder.status = FULFILLED"
          - "decrement PointMallItem.stock by RedemptionOrder.quantity"
          - "decrement Volunteer.points_balance by RedemptionOrder.total_points"
          - "if PointMallItem.stock reaches 0: cascade PointMallItem ACTIVE -> OUT_OF_STOCK"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /redemption-orders/{id}/cancel"
        actor: Volunteer
        preconditions:
          - "RedemptionOrder.volunteer_id == acting Volunteer.id"
        side_effects:
          - "set RedemptionOrder.status = CANCELLED"

  - entity: Certificate
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REISSUED
        trigger: "POST /certificates/{id}/reissue"
        actor: SkillAdmin
        preconditions:
          - "Certificate.status == ISSUED"
        side_effects:
          - "create new Certificate row (template_id, volunteer_id same; new serial_number; hours_at_issuance and activities_at_issuance refreshed from current Volunteer fields)"
          - "set old Certificate.status = REISSUED, replacement_serial_number = new.serial_number"
          - "append AuditLog(action_type=CERTIFICATE_REISSUE, target=Certificate old.id, payload includes new.serial_number)"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /certificates/{id}/revoke"
        actor: SkillAdmin
        preconditions:
          - "Certificate.status == ISSUED"
        side_effects:
          - "set Certificate.status = REVOKED"
          - "append AuditLog(action_type=CERTIFICATE_REVOKE, target=Certificate.id)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two organizers simultaneously approve the last available position on the same activity"
    guarantee: "At most position_quota Applications transition to APPROVED; one wins, the other receives ERR_QUOTA_EXCEEDED"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 409
    serialization: "Atomic compare-and-increment of Activity.filled_positions; check filled_positions < position_quota holds at commit time"

  - scenario: "Organizer approves while volunteer simultaneously withdraws an APPLIED Application"
    guarantee: "Exactly one operation succeeds; loser is rejected with ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Application.status"

  - scenario: "Two SkillAdmins simultaneously fulfill two RedemptionOrders for the same item with combined quantity exceeding stock"
    guarantee: "Stock is decremented atomically; the order whose remaining-stock check fails after the first commit receives ERR_INSUFFICIENT_STOCK"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    serialization: "Atomic compare-and-decrement on PointMallItem.stock"

  - scenario: "Two RedemptionOrders for the same volunteer fulfilled simultaneously and combined total exceeds points balance"
    guarantee: "Points balance is decremented atomically; the order whose post-decrement check would drive balance negative receives ERR_INSUFFICIENT_POINTS"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    serialization: "Atomic compare-and-decrement on Volunteer.points_balance"

  - scenario: "Two SkillAdmins simultaneously approve and reject the same HourAdjustment"
    guarantee: "Exactly one transition wins; the loser receives ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on HourAdjustment.status"

  - scenario: "Volunteer attempts to apply to two Activities whose time windows overlap, in two simultaneous requests"
    guarantee: "At most one APPROVED Application exists per overlapping window; the second approval receives ERR_TIME_CONFLICT"
    error_id: ERR_TIME_CONFLICT
    http_status: 409
    serialization: "Conflict check evaluated at commit; loser uses Application.id ordering as tie-break"

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: haversine_distance_km
    trigger: "POST /applications (apply); POST /activities/{id}/check-in (validation)"
    algorithm: aggregation
    formula: |
      R = 6371.0088   # Earth radius in km, IUGG mean
      phi1 = radians(lat1); phi2 = radians(lat2)
      dphi = radians(lat2 - lat1)
      dlambda = radians(lng2 - lng1)
      a = sin(dphi/2)**2 + cos(phi1)*cos(phi2)*sin(dlambda/2)**2
      c = 2 * atan2(sqrt(a), sqrt(1-a))
      d = R * c
      return round(d, 2)   # 2 decimals, ROUND_HALF_UP
    input_set: "lat/lng pair from one Volunteer.home_* and one Activity.location_*"
    constants:
      EARTH_RADIUS_KM: 6371.0088
    precision: "2 decimal places, round_half_up"

  - name: service_hour_calc
    trigger: "Application transition CHECKED_IN -> COMPLETED; recomputed on automatic completion at Activity end"
    algorithm: weighted_scoring
    formula: |
      # Three branches by Activity.hour_rule_type. Pinned evaluation order:
      #   1. Compute raw hours per branch.
      #   2. Apply leave penalty if Application.status == ON_LEAVE was reached at any point
      #      (i.e., Application.leave_reason IS NOT NULL): multiply raw by 0.50.
      #   3. Apply early-departure penalty: if Application.early_departure_marker is true
      #      AND not already penalized for ON_LEAVE, multiply by 0.75.
      #   4. Round to 2 decimals, ROUND_HALF_UP.
      #
      # Late marker does NOT reduce hours (it is informational only).
      #
      # Branch ACTUAL_DURATION:
      #   raw = (Application.check_out_at - Application.check_in_at).total_seconds() / 3600
      #
      # Branch FIXED_VALUE:
      #   raw = Activity.fixed_hour_value   # ignores actual duration
      #
      # Branch ROLE_COEFFICIENT:
      #   actual_hours = (Application.check_out_at - Application.check_in_at).total_seconds() / 3600
      #   raw = actual_hours * ActivityRole.coefficient
      #
      # Final:
      #   if Application.leave_reason IS NOT NULL: hours = raw * 0.50
      #   elif Application.early_departure_marker: hours = raw * 0.75
      #   else: hours = raw
      #   return round(hours, 2)
    input_set: "single Application; its parent Activity; its assigned ActivityRole if hour_rule_type==ROLE_COEFFICIENT"
    constants:
      LEAVE_PENALTY_MULTIPLIER: 0.50
      EARLY_DEPARTURE_PENALTY_MULTIPLIER: 0.75
      LATE_MARKER_THRESHOLD_MINUTES: 15
      EARLY_DEPARTURE_THRESHOLD_MINUTES: 15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: actual_duration_branch
        when: "Activity.hour_rule_type == ACTUAL_DURATION"
        difference: "raw hours = elapsed (check_out - check_in) in hours; ignores ActivityRole.coefficient"
      - name: fixed_value_branch
        when: "Activity.hour_rule_type == FIXED_VALUE"
        difference: "raw hours = Activity.fixed_hour_value verbatim; ignores actual duration entirely. A 30-minute attendance still credits the full fixed value."
      - name: role_coefficient_branch
        when: "Activity.hour_rule_type == ROLE_COEFFICIENT"
        difference: "raw hours = elapsed hours * ActivityRole.coefficient; same elapsed time produces different hours for LEAD vs SUPPORT roles"

  - name: point_earn_calc
    trigger: "Application -> COMPLETED transition; recomputed on HourAdjustment APPROVED side-effect"
    algorithm: weighted_scoring
    formula: |
      # Pinned evaluation order — DO NOT reorder:
      #   1. base = round(Application.adjusted_hours * HOURS_TO_POINTS, 2)
      #   2. difficulty_multiplier from Activity.difficulty:
      #        EASY -> 1.00, MEDIUM -> 1.50, HARD -> 2.00
      #   3. role_multiplier from ActivityRole.role_label (NOT coefficient):
      #        LEAD -> 1.20, SUPPORT -> 1.00, REGULAR -> 0.90
      #        if no ActivityRole assigned: role_multiplier = 1.00
      #   4. raw_points = base * difficulty_multiplier * role_multiplier
      #   5. points = floor(raw_points)   # always round down to integer
      #   6. return points
      #
      # IMPORTANT: rounding order — base is rounded to 2 decimals BEFORE multiplication;
      # final points are floored, NOT rounded half-up. This is the canonical order.
      HOURS_TO_POINTS = 10
    input_set: "Application.adjusted_hours; parent Activity.difficulty; Application.activity_role_id (and ActivityRole.role_label if set)"
    constants:
      HOURS_TO_POINTS: 10
      DIFFICULTY_MULTIPLIERS:
        EASY: 1.00
        MEDIUM: 1.50
        HARD: 2.00
      ROLE_MULTIPLIERS:
        LEAD: 1.20
        SUPPORT: 1.00
        REGULAR: 0.90
        DEFAULT: 1.00
    precision: "Final result is integer (floor); intermediate base uses 2 decimals round_half_up"
    variants:
      - name: completion_award
        when: "Application transitions to COMPLETED for the first time"
        difference: "computes points from current adjusted_hours and writes Application.points_awarded; volunteer balance increases by full amount"
      - name: adjustment_recompute
        when: "HourAdjustment APPROVED for an already-COMPLETED Application"
        difference: "recomputes points using updated adjusted_hours; the DELTA between new and old points_awarded is what is added to (or subtracted from) Volunteer.points_balance — never the full new amount"

  - name: certificate_eligibility_check
    trigger: "POST /certificates (issuance) and POST /certificates/batch (batch issuance)"
    algorithm: threshold
    formula: |
      eligible = (Volunteer.total_service_hours >= CertificateTemplate.min_hours)
                 AND (Volunteer.total_completed_activities >= CertificateTemplate.min_completed_activities)
      # Both predicates use >=. Boundary: a volunteer with exactly min_hours and exactly
      # min_completed_activities IS eligible. A volunteer 0.01 hours below is NOT.
      # No previously-ISSUED, non-REVOKED, non-REISSUED certificate of the same template
      # may exist for this volunteer (unique-per-template-per-volunteer constraint).
    input_set: "Volunteer.total_service_hours, Volunteer.total_completed_activities, CertificateTemplate.min_hours, CertificateTemplate.min_completed_activities, existing Certificate rows for (volunteer_id, template_id) NOT in {REVOKED, REISSUED}"
    constants: {}
    precision: "exact decimal compare"

  - name: hours_archival
    trigger: "POST /_clock/advance to a time strictly greater than 365 days after Application.check_out_at"
    algorithm: aggregation
    formula: |
      # When clock advances such that an Application has check_out_at strictly older than
      # ARCHIVE_AGE_DAYS (now() - check_out_at > 365 days, EXCLUSIVE comparison),
      # move that Application's adjusted_hours from Volunteer.total_service_hours
      # into Volunteer.archived_hours. Lifetime total = total_service_hours + archived_hours.
      #
      # IMPORTANT — archival affects FUTURE certificate eligibility checks: only
      # Volunteer.total_service_hours (NOT archived_hours) counts toward CertificateTemplate.min_hours.
      # Already-issued Certificates are NOT modified; their hours_at_issuance snapshot stands.
      #
      # Application.adjusted_hours field itself is NOT changed.
    input_set: "All Application rows with status == COMPLETED whose Volunteer is the subject"
    constants:
      ARCHIVE_AGE_DAYS: 365
    precision: "2 decimal places, round_half_up"

  - name: points_expiration_sweep
    trigger: "POST /_clock/advance triggers expiry of points awarded earlier than 730 days ago"
    algorithm: chronological
    formula: |
      # Each Application.points_awarded earned at Application.check_out_at expires when
      # now() - check_out_at > POINT_EXPIRY_DAYS (EXCLUSIVE; an exactly-equal age does not expire).
      # Expiration uses FIFO (chronological by check_out_at, ascending).
      # On expiry: Volunteer.points_balance -= Application.points_awarded for this Application,
      # but only by the portion not previously redeemed and not previously expired.
      # Implementation: maintain a running ledger of unspent points per Application;
      # FIFO-deduct redemptions from the oldest Application first, expire whatever remains
      # past the cutoff. Tie-break when two Applications have equal check_out_at: smaller
      # Application.id first.
      #
      # Once expired, those points are gone — a subsequent HourAdjustment that recomputes
      # Application.points_awarded for an already-expired Application does NOT resurrect them;
      # the delta still applies to current balance but cannot go below 0 (clamped to 0 with
      # an audit entry recorded). Newly minted delta points reset the 730-day clock for the
      # delta only; the original portion stays expired.
    input_set: "Volunteer's COMPLETED Applications with points_awarded > 0; RedemptionOrder rows in FULFILLED for the volunteer (FIFO consumption)"
    constants:
      POINT_EXPIRY_DAYS: 730
    precision: "integer points"

# =============================================================================
# §1.4 Validations (priority-ordered)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of {Volunteer, Organizer, SkillAdmin}; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role appears in endpoint's roles[] list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-segment resource ids resolve to existing rows, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "All foreign keys in the request body resolve to existing rows (Skill.id, Activity.id, ActivityRole.id, PointMallItem.id, CertificateTemplate.id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Cross-aggregate ownership: Volunteer/Organizer acting on a resource must own it (Application.volunteer_id == X-User-ID for volunteer-side actions; Activity.organizer_id == X-User-ID for organizer-side actions)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /applications/{id}/withdraw, POST /applications/{id}/check-in, POST /applications/{id}/check-out, POST /applications/{id}/leave, POST /activities/{id}/submit, POST /activities/{id}/shelve, POST /applications/{id}/approve, POST /applications/{id}/reject, POST /redemption-orders/{id}/cancel"

  - priority: 6
    category: business_referential
    check: "Referenced ActivityRole.activity_id == surrounding Activity.id (no cross-activity role binding)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "POST /applications, POST /activities/{id}/roles"

  - priority: 7
    category: state
    check: "Target entity is in a state that permits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all

  - priority: 8
    category: business_safety
    check: "Identity verification requirement: any Volunteer-initiated action against an Activity (apply, check-in, check-out, leave, withdraw) requires Volunteer.identity_verification_status == VERIFIED"
    error_id: ERR_IDENTITY_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /applications, POST /applications/{id}/check-in, POST /applications/{id}/check-out, POST /applications/{id}/leave, POST /applications/{id}/withdraw"

  - priority: 9
    category: business_safety
    check: "If Activity.requires_sensitive_clearance == true, Volunteer.background_check_status must == CLEARED to apply"
    error_id: ERR_BACKGROUND_CHECK_REQUIRED
    http_status: 403
    applies_to: "POST /applications"

  - priority: 10
    category: business_safety
    check: "Skill-tag match: every Skill.code in Activity.required_skill_codes must be held by Volunteer in an APPROVED VolunteerSkill row"
    error_id: ERR_SKILL_MISMATCH
    http_status: 422
    applies_to: "POST /applications"

  - priority: 11
    category: business_temporal
    check: "Recruitment window open: Activity.recruit_open_at <= now() < Activity.recruit_close_at AND Activity.status == RECRUITING"
    error_id: ERR_RECRUITMENT_CLOSED
    http_status: 409
    applies_to: "POST /applications"

  - priority: 12
    category: business_temporal
    check: "Multi-activity time conflict: no other Application of this volunteer in {APPROVED, CHECKED_IN, ON_LEAVE, COMPLETED} whose Activity time-window overlaps. Closed-closed intervals: an Application starting exactly when another ends DOES count as a conflict."
    error_id: ERR_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /applications, POST /applications/{id}/approve"

  - priority: 13
    category: business_constraint
    check: "Geographic distance: distance_km between Volunteer.home and Activity.location must be <= 50 km at apply time"
    error_id: ERR_DISTANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /applications"

  - priority: 14
    category: business_constraint
    check: "VolunteerSkill uniqueness: at most one (volunteer_id, skill_id) row in a non-REJECTED state at any time"
    error_id: ERR_DUPLICATE_SKILL_DECLARATION
    http_status: 409
    applies_to: "POST /volunteer-skills"

  - priority: 15
    category: business_constraint
    check: "Certificate uniqueness per template+volunteer in non-{REISSUED, REVOKED} state"
    error_id: ERR_CERTIFICATE_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /certificates, POST /certificates/batch"

  - priority: 16
    category: business_constraint
    check: "Application uniqueness per (activity_id, volunteer_id) in a non-terminal state"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /applications"

  - priority: 17
    category: business_fiscal
    check: "Position quota: Activity.filled_positions < Activity.position_quota strictly before approving an Application"
    error_id: ERR_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /applications/{id}/approve"

  - priority: 18
    category: business_fiscal
    check: "Item stock: PointMallItem.stock >= RedemptionOrder.quantity before fulfillment"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /redemption-orders, POST /redemption-orders/{id}/fulfill"

  - priority: 19
    category: business_fiscal
    check: "Points balance: Volunteer.points_balance >= RedemptionOrder.total_points before fulfillment AND at order creation"
    error_id: ERR_INSUFFICIENT_POINTS
    http_status: 409
    applies_to: "POST /redemption-orders, POST /redemption-orders/{id}/fulfill"

  - priority: 20
    category: business_constraint
    check: "Eligibility: Volunteer.total_service_hours >= CertificateTemplate.min_hours AND Volunteer.total_completed_activities >= CertificateTemplate.min_completed_activities (live, non-archived hours only)"
    error_id: ERR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /certificates, POST /certificates/batch"

  - priority: 21
    category: business_constraint
    check: "Hour adjustment net non-negative: Application.adjusted_hours + HourAdjustment.delta_hours must be >= 0"
    error_id: ERR_NEGATIVE_HOURS
    http_status: 422
    applies_to: "POST /hour-adjustments, POST /hour-adjustments/{id}/approve"

  - priority: 22
    category: business_constraint
    check: "Check-in proof: site_code matches Activity.site_code OR GPS within 0.50 km. Lacking both rejects."
    error_id: ERR_CHECK_IN_PROOF_FAILED
    http_status: 422
    applies_to: "POST /applications/{id}/check-in"

  - priority: 23
    category: business_constraint
    check: "Field-level constraints: numeric ranges, string lengths, enum values, lat/lng bounds, datetime ordering (end_at > start_at, recruit_close_at < start_at)"
    error_id: ERR_INVALID_INPUT
    http_status: 422
    applies_to: all

  - priority: 24
    category: business_constraint
    check: "OCC version mismatch on PATCH/PUT (when version provided): supplied version must equal current row version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH and PUT endpoints"

# =============================================================================
# §1.5 API Endpoints
# =============================================================================
endpoints:
  # ----- Volunteer & identity -----
  - method: POST
    path: /volunteers
    description: register a new volunteer (creates row in PENDING)
    roles: [SkillAdmin]
    code: 201
    input: [full_name, id_number_hash, home_lat, home_lng]
    output: Volunteer
    side_effects: [ "Volunteer.identity_verification_status = PENDING" ]

  - method: GET
    path: /volunteers/{id}
    description: read a volunteer including computed totals
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: POST
    path: /volunteers/{id}/identity:verify
    description: SkillAdmin marks identity verified
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: [ "Volunteer.identity_verification_status PENDING -> VERIFIED", "emit IM and IDENTITY_PROVIDER PartnerSyncEvents" ]

  - method: POST
    path: /volunteers/{id}/identity:reject
    description: SkillAdmin rejects identity
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: [ "Volunteer.identity_verification_status PENDING -> REJECTED" ]

  - method: POST
    path: /volunteers/{id}/background-check:request
    description: volunteer requests background check
    roles: [Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: [ "Volunteer.background_check_status NONE -> PENDING" ]

  - method: POST
    path: /volunteers/{id}/background-check:clear
    description: SkillAdmin clears background check
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: [ "Volunteer.background_check_status PENDING -> CLEARED" ]

  - method: POST
    path: /volunteers/{id}/background-check:fail
    description: SkillAdmin fails background check
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Volunteer
    side_effects: [ "Volunteer.background_check_status PENDING -> FAILED" ]

  - method: GET
    path: /volunteers/{id}/hours
    description: list COMPLETED Applications with hour breakdown (live + archived totals)
    roles: [Volunteer, SkillAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: object
    side_effects: []

  # ----- Skill catalog -----
  - method: POST
    path: /skills
    description: register a skill in the catalog
    roles: [SkillAdmin]
    code: 201
    input: [code, name, "requires_certificate?", "sensitivity_level?"]
    output: Skill
    side_effects: []

  - method: GET
    path: /skills
    description: list skills
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Skill[]
    side_effects: []

  # ----- Volunteer skills (declaration & review) -----
  - method: POST
    path: /volunteer-skills
    description: volunteer declares a skill (SELF_DECLARED) with optional certificate URL
    roles: [Volunteer]
    code: 201
    input: [skill_id, "certificate_url?"]
    output: VolunteerSkill
    side_effects: [ "VolunteerSkill.review_status = SELF_DECLARED" ]

  - method: POST
    path: /volunteer-skills/{id}/submit
    description: volunteer submits declaration to admin review
    roles: [Volunteer]
    code: 200
    input: []
    output: VolunteerSkill
    side_effects: [ "review_status SELF_DECLARED -> UNDER_REVIEW" ]

  - method: POST
    path: /volunteer-skills/{id}/approve
    description: SkillAdmin approves
    roles: [SkillAdmin]
    code: 200
    input: []
    output: VolunteerSkill
    side_effects: [ "review_status UNDER_REVIEW -> APPROVED" ]

  - method: POST
    path: /volunteer-skills/{id}/reject
    description: SkillAdmin rejects
    roles: [SkillAdmin]
    code: 200
    input: []
    output: VolunteerSkill
    side_effects: [ "review_status UNDER_REVIEW -> REJECTED" ]

  - method: POST
    path: /volunteer-skills/{id}/resubmit
    description: re-submit (after cert URL update) APPROVED -> UNDER_REVIEW
    roles: [Volunteer]
    code: 200
    input: [certificate_url]
    output: VolunteerSkill
    side_effects: [ "review_status APPROVED -> UNDER_REVIEW; certificate_url updated" ]

  # ----- Activities -----
  - method: POST
    path: /activities
    description: organizer creates a draft activity
    roles: [Organizer]
    code: 201
    input: [title, description, location_lat, location_lng, start_at, end_at, recruit_open_at, recruit_close_at, required_skill_codes, position_quota, "difficulty?", "hour_rule_type?", "fixed_hour_value?"]
    output: Activity
    side_effects: [ "Activity.status = DRAFT, organizer_id stamped" ]

  - method: POST
    path: /activities/{id}/submit
    description: organizer submits draft for review
    roles: [Organizer]
    code: 200
    input: []
    output: Activity
    side_effects: [ "status DRAFT -> UNDER_REVIEW; computes requires_sensitive_clearance" ]

  - method: POST
    path: /activities/{id}/approve
    description: SkillAdmin approves and publishes
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Activity
    side_effects: [ "status UNDER_REVIEW -> PUBLISHED; mints site_code; emits 2 PartnerSyncEvents" ]

  - method: POST
    path: /activities/{id}/reject
    description: SkillAdmin rejects (revisable via /revise)
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Activity
    side_effects: [ "status UNDER_REVIEW -> REJECTED" ]

  - method: POST
    path: /activities/{id}/revise
    description: organizer pulls a REJECTED activity back to DRAFT for revision
    roles: [Organizer]
    code: 200
    input: []
    output: Activity
    side_effects: [ "status REJECTED -> DRAFT" ]

  - method: POST
    path: /activities/{id}/shelve
    description: organizer shelves a PUBLISHED or RECRUITING activity (only when filled_positions == 0)
    roles: [Organizer]
    code: 200
    input: []
    output: Activity
    side_effects: [ "status PUBLISHED|RECRUITING -> SHELVED" ]

  - method: GET
    path: /activities/{id}
    description: read activity (including computed filled_positions, requires_sensitive_clearance, site_code if RUNNING)
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: []
    output: Activity
    side_effects: []

  - method: GET
    path: /activities
    description: list activities, filterable by status and required skill
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: ["status?", "skill_code?", "limit?", "offset?"]
    output: Activity[]
    side_effects: []

  - method: POST
    path: /activities/{id}/roles
    description: organizer defines an ActivityRole
    roles: [Organizer]
    code: 201
    input: [role_label, "coefficient?"]
    output: ActivityRole
    side_effects: []

  - method: GET
    path: /activities/{id}/recommended-volunteers
    description: rank approved volunteers for this Activity by historical_participation score (returns up to 20)
    roles: [Organizer, SkillAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

  # ----- Applications -----
  - method: POST
    path: /applications
    description: volunteer applies; computes distance_km
    roles: [Volunteer]
    code: 201
    input: [activity_id, "activity_role_id?"]
    output: Application
    side_effects: [ "Application.status = APPLIED; distance_km set via haversine_distance_km" ]

  - method: POST
    path: /applications/{id}/approve
    description: organizer approves; increments Activity.filled_positions
    roles: [Organizer]
    code: 200
    input: []
    output: Application
    side_effects: [ "status APPLIED -> APPROVED; Activity.filled_positions += 1" ]

  - method: POST
    path: /applications/{id}/reject
    description: organizer rejects
    roles: [Organizer]
    code: 200
    input: []
    output: Application
    side_effects: [ "status APPLIED -> REJECTED" ]

  - method: POST
    path: /applications/{id}/withdraw
    description: volunteer withdraws (APPLIED -> WITHDRAWN, or APPROVED -> WITHDRAWN if Activity still RECRUITING)
    roles: [Volunteer]
    code: 200
    input: []
    output: Application
    side_effects: [ "if was APPROVED: Activity.filled_positions -= 1" ]

  - method: POST
    path: /applications/{id}/check-in
    description: volunteer checks in via site_code or GPS; sets check_in_at, late_marker
    roles: [Volunteer]
    code: 200
    input: ["site_code?", "check_in_lat?", "check_in_lng?"]
    output: Application
    side_effects: [ "status APPROVED -> CHECKED_IN; sets late_marker if check_in_at > start_at + 15min" ]

  - method: POST
    path: /applications/{id}/leave
    description: volunteer requests on-leave during a running activity
    roles: [Volunteer]
    code: 200
    input: [leave_reason]
    output: Application
    side_effects: [ "status CHECKED_IN -> ON_LEAVE; leave_reason stored" ]

  - method: POST
    path: /applications/{id}/check-out
    description: volunteer checks out; runs service_hour_calc, point_earn_calc, increments Volunteer totals
    roles: [Volunteer]
    code: 200
    input: []
    output: Application
    side_effects: [ "status CHECKED_IN -> COMPLETED; sets early_departure_marker; cascades to credited_hours, adjusted_hours, points_awarded; updates Volunteer.total_service_hours, total_completed_activities, points_balance" ]

  - method: POST
    path: /applications/{id}/manual-correction
    description: organizer manually fixes check_in_at, check_out_at, or markers (records AuditLog HOUR_ADJUST_REQUEST entry)
    roles: [Organizer]
    code: 200
    input: ["check_in_at?", "check_out_at?", "late_marker?", "early_departure_marker?"]
    output: Application
    side_effects: [ "fields updated; if Application.status == COMPLETED, recompute service_hour_calc and propagate hour delta to Volunteer.total_service_hours" ]

  - method: GET
    path: /applications/{id}
    description: read application
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: []
    output: Application
    side_effects: []

  # ----- Hour adjustments -----
  - method: POST
    path: /hour-adjustments
    description: organizer files a delta on an existing COMPLETED Application
    roles: [Organizer]
    code: 201
    input: [application_id, delta_hours, reason]
    output: HourAdjustment
    side_effects: [ "HourAdjustment.status = PENDING; appends AuditLog(HOUR_ADJUST_REQUEST)" ]

  - method: POST
    path: /hour-adjustments/{id}/approve
    description: SkillAdmin approves; mutates Application.adjusted_hours and recomputes points; appends AuditLog
    roles: [SkillAdmin]
    code: 200
    input: []
    output: HourAdjustment
    side_effects: [ "status PENDING -> APPROVED; Application.adjusted_hours += delta; recompute points; Volunteer balances updated; AuditLog(HOUR_ADJUST_APPROVE)" ]

  - method: POST
    path: /hour-adjustments/{id}/reject
    description: SkillAdmin rejects
    roles: [SkillAdmin]
    code: 200
    input: []
    output: HourAdjustment
    side_effects: [ "status PENDING -> REJECTED; AuditLog(HOUR_ADJUST_REJECT)" ]

  # ----- Point mall + redemptions -----
  - method: POST
    path: /point-mall-items
    description: SkillAdmin creates item
    roles: [SkillAdmin]
    code: 201
    input: [sku, name, point_cost, stock]
    output: PointMallItem
    side_effects: []

  - method: POST
    path: /point-mall-items/{id}/restock
    description: SkillAdmin restocks
    roles: [SkillAdmin]
    code: 200
    input: [delta]
    output: PointMallItem
    side_effects: [ "stock += delta; status OUT_OF_STOCK -> ACTIVE if applicable" ]

  - method: POST
    path: /point-mall-items/{id}/archive
    description: SkillAdmin archives
    roles: [SkillAdmin]
    code: 200
    input: []
    output: PointMallItem
    side_effects: [ "status -> ARCHIVED" ]

  - method: GET
    path: /point-mall-items
    description: list items
    roles: [Volunteer, SkillAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PointMallItem[]
    side_effects: []

  - method: POST
    path: /redemption-orders
    description: volunteer creates a redemption order (snapshots total_points)
    roles: [Volunteer]
    code: 201
    input: [item_id, quantity]
    output: RedemptionOrder
    side_effects: [ "status = PENDING; total_points = item.point_cost * quantity" ]

  - method: POST
    path: /redemption-orders/{id}/fulfill
    description: SkillAdmin fulfills; deducts stock and points
    roles: [SkillAdmin]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: [ "status -> FULFILLED; PointMallItem.stock -= quantity; Volunteer.points_balance -= total_points; cascade to PointMallItem OUT_OF_STOCK if applicable" ]

  - method: POST
    path: /redemption-orders/{id}/cancel
    description: volunteer cancels a PENDING order
    roles: [Volunteer]
    code: 200
    input: []
    output: RedemptionOrder
    side_effects: [ "status -> CANCELLED" ]

  # ----- Certificates -----
  - method: POST
    path: /certificate-templates
    description: SkillAdmin creates template
    roles: [SkillAdmin]
    code: 201
    input: [code, title, min_hours, min_completed_activities]
    output: CertificateTemplate
    side_effects: []

  - method: POST
    path: /certificates
    description: SkillAdmin issues a single certificate to one volunteer for one template
    roles: [SkillAdmin]
    code: 201
    input: [template_id, volunteer_id]
    output: Certificate
    side_effects: [ "snapshots Volunteer hours/activities; mints serial_number; AuditLog(CERTIFICATE_ISSUE); emits PartnerSyncEvent(channel=PARTNER_ORG, event_type=CERTIFICATE_ISSUED)" ]

  - method: POST
    path: /certificates/batch
    description: SkillAdmin issues a template to many volunteers in one request
    roles: [SkillAdmin]
    code: 200
    input: [template_id, volunteer_ids]
    output: object
    side_effects: [ "per-volunteer eligibility re-checked; partial-success result lists issued + skipped (with reason); AuditLog per success; PartnerSyncEvent per success" ]

  - method: POST
    path: /certificates/{id}/reissue
    description: SkillAdmin reissues (creates new Certificate, marks old REISSUED)
    roles: [SkillAdmin]
    code: 201
    input: []
    output: Certificate
    side_effects: [ "old.status = REISSUED; new Certificate created with refreshed snapshots; AuditLog(CERTIFICATE_REISSUE)" ]

  - method: POST
    path: /certificates/{id}/revoke
    description: SkillAdmin revokes
    roles: [SkillAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: [ "status -> REVOKED; AuditLog(CERTIFICATE_REVOKE)" ]

  - method: GET
    path: /certificates/verify/{serial_number}
    description: public-verification endpoint by serial_number
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  # ----- Audit + sync -----
  - method: GET
    path: /audit-logs
    description: list AuditLog entries (filter by action_type, target_entity, target_id)
    roles: [SkillAdmin]
    code: 200
    input: ["action_type?", "target_entity?", "target_id?", "limit?", "offset?"]
    output: AuditLog[]
    side_effects: []

  - method: GET
    path: /partner-sync-events
    description: list PartnerSyncEvent entries
    roles: [SkillAdmin]
    code: 200
    input: ["channel?", "event_type?", "limit?", "offset?"]
    output: PartnerSyncEvent[]
    side_effects: []

  # ----- Test-driving endpoints (required by §1.5 testability principle) -----
  - method: POST
    path: /_clock/advance
    description: test harness — advance server clock to a target ISO 8601 UTC instant; drives all time-gated transitions (Activity PUBLISHED -> RECRUITING -> RUNNING -> COMPLETED, hours_archival sweep, points_expiration_sweep)
    roles: [SkillAdmin]
    code: 200
    input: [target_time]
    output: object
    side_effects: [ "advances server clock; runs all due Activity auto-transitions; runs hours_archival; runs points_expiration_sweep" ]

  - method: GET
    path: /_clock
    description: read current server clock
    roles: [Volunteer, Organizer, SkillAdmin]
    code: 200
    input: []
    output: object
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or invalid X-User-Role/X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "role not permitted for endpoint OR cross-aggregate ownership violation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-segment id or referenced FK does not resolve"
  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "FK refers to a row that exists but does not belong to the surrounding parent (e.g., ActivityRole.activity_id mismatch)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target entity not in a state that permits requested transition"
  - id: ERR_IDENTITY_NOT_VERIFIED
    http: 403
    condition: "Volunteer.identity_verification_status != VERIFIED on a volunteer-action endpoint"
  - id: ERR_BACKGROUND_CHECK_REQUIRED
    http: 403
    condition: "Activity.requires_sensitive_clearance AND Volunteer.background_check_status != CLEARED"
  - id: ERR_SKILL_MISMATCH
    http: 422
    condition: "volunteer lacks at least one APPROVED VolunteerSkill from Activity.required_skill_codes"
  - id: ERR_RECRUITMENT_CLOSED
    http: 409
    condition: "Activity not RECRUITING OR now() outside [recruit_open_at, recruit_close_at)"
  - id: ERR_TIME_CONFLICT
    http: 409
    condition: "volunteer has another non-terminal Application overlapping this Activity's time window"
  - id: ERR_DISTANCE_EXCEEDED
    http: 422
    condition: "haversine distance between Volunteer.home and Activity.location > 50 km at apply time"
  - id: ERR_DUPLICATE_SKILL_DECLARATION
    http: 409
    condition: "VolunteerSkill (volunteer_id, skill_id) already exists in non-REJECTED state"
  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "Application (activity_id, volunteer_id) already exists in non-terminal state"
  - id: ERR_QUOTA_EXCEEDED
    http: 409
    condition: "Activity.filled_positions would meet or exceed position_quota on approval"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "PointMallItem.stock < quantity at fulfillment OR creation"
  - id: ERR_INSUFFICIENT_POINTS
    http: 409
    condition: "Volunteer.points_balance < total_points at fulfillment OR creation"
  - id: ERR_NEGATIVE_HOURS
    http: 422
    condition: "Application.adjusted_hours + delta_hours < 0"
  - id: ERR_NOT_ELIGIBLE
    http: 422
    condition: "Volunteer fails CertificateTemplate eligibility threshold (hours OR activity count)"
  - id: ERR_CERTIFICATE_ALREADY_ISSUED
    http: 409
    condition: "an ISSUED Certificate of (volunteer_id, template_id) already exists in non-{REISSUED, REVOKED} state"
  - id: ERR_CHECK_IN_PROOF_FAILED
    http: 422
    condition: "neither site_code matches nor GPS within 0.50 km at check-in"
  - id: ERR_INVALID_INPUT
    http: 422
    condition: "field-level constraint violation (range, length, enum, datetime ordering)"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "supplied version != current row.version on PATCH/PUT"

# =============================================================================
# §1.7 RBAC
# =============================================================================
roles:
  - name: Volunteer
    description: end-user who declares skills, applies to activities, performs check-in/out, redeems points
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /volunteer-skills"
      - "POST /volunteer-skills/{id}/submit"
      - "POST /volunteer-skills/{id}/resubmit"
      - "POST /volunteers/{id}/background-check:request"
      - "POST /applications"
      - "POST /applications/{id}/withdraw"
      - "POST /applications/{id}/check-in"
      - "POST /applications/{id}/check-out"
      - "POST /applications/{id}/leave"
      - "POST /redemption-orders"
      - "POST /redemption-orders/{id}/cancel"
    shared_operations:
      - "GET /volunteers/{id}"
      - "GET /skills"
      - "GET /activities"
      - "GET /activities/{id}"
      - "GET /applications/{id}"
      - "GET /point-mall-items"
      - "GET /certificates/verify/{serial_number}"
      - "GET /_clock"

  - name: Organizer
    description: hosts and manages activities; approves applications; files hour adjustments; performs manual corrections
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /activities"
      - "POST /activities/{id}/submit"
      - "POST /activities/{id}/revise"
      - "POST /activities/{id}/shelve"
      - "POST /activities/{id}/roles"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/reject"
      - "POST /applications/{id}/manual-correction"
      - "POST /hour-adjustments"
    shared_operations:
      - "GET /activities/{id}/recommended-volunteers"
      - "GET /volunteers/{id}"
      - "GET /skills"
      - "GET /activities"
      - "GET /activities/{id}"
      - "GET /applications/{id}"
      - "GET /certificates/verify/{serial_number}"
      - "GET /_clock"
    note: |
      An Organizer is itself a verified Volunteer entry (entity_backed:Volunteer). The same X-User-ID
      may act as Volunteer (their own apply/check-in) on activities they did NOT create, and as
      Organizer on activities where Activity.organizer_id == X-User-ID. Cross-role identity is the
      same row; ownership is enforced by Activity.organizer_id, NOT by separate user records.

  - name: SkillAdmin
    description: platform administrator; reviews skill declarations; approves activities; clears background checks; approves hour adjustments; manages point mall and certificates
    identity: opaque
    exclusive_operations:
      - "POST /volunteers"
      - "POST /volunteers/{id}/identity:verify"
      - "POST /volunteers/{id}/identity:reject"
      - "POST /volunteers/{id}/background-check:clear"
      - "POST /volunteers/{id}/background-check:fail"
      - "POST /skills"
      - "POST /volunteer-skills/{id}/approve"
      - "POST /volunteer-skills/{id}/reject"
      - "POST /activities/{id}/approve"
      - "POST /activities/{id}/reject"
      - "POST /hour-adjustments/{id}/approve"
      - "POST /hour-adjustments/{id}/reject"
      - "POST /point-mall-items"
      - "POST /point-mall-items/{id}/restock"
      - "POST /point-mall-items/{id}/archive"
      - "POST /redemption-orders/{id}/fulfill"
      - "POST /certificate-templates"
      - "POST /certificates"
      - "POST /certificates/batch"
      - "POST /certificates/{id}/reissue"
      - "POST /certificates/{id}/revoke"
      - "GET /audit-logs"
      - "GET /partner-sync-events"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /volunteers/{id}"
      - "GET /volunteers/{id}/hours"
      - "GET /skills"
      - "GET /activities"
      - "GET /activities/{id}"
      - "GET /activities/{id}/recommended-volunteers"
      - "GET /applications/{id}"
      - "GET /point-mall-items"
      - "GET /certificates/verify/{serial_number}"
      - "GET /_clock"
