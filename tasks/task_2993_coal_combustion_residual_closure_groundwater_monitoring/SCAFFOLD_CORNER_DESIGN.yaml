            - "trigger call 1 returns HTTP 200 and SamplingEvent.${event_id}.status == REJECTED"
            - "SamplingEvent.${event_id}.rejection_reason == NO_RESULTS"
            - "MonitoringProgram.${prog_id}.last_validated_event_id == null and next_sampling_due_date == null after the rejection"
            - "trigger call 2 returns HTTP 200 and SamplingEvent.${event_id}.status == DRAFT"
            - "SamplingEvent.${event_id}.rejection_reason == null and validated_on == null after the reopen"
            - "MonitoringProgram.${prog_id}.last_validated_event_id is still null"

      - name: engineering_certification_before_any_stability_assessment_is_refused
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_30_ERR_STABILITY_NOT_ADEQUATE
          - state_machines.ClosurePlan.DRAFT_to_ENGINEERING_CERTIFIED
          - calculations.governing_stability_verdict
        distinguishing_aspect: |
          The DRAFT to ENGINEERING_CERTIFIED transition carries a precondition on a value that starts at
          UNASSESSED rather than at a failing number, so the first attempt must be refused with 422
          ERR_STABILITY_NOT_ADEQUATE even though nothing about the plan is wrong. Filing an ADEQUATE
          assessment and repeating the identical call then succeeds, which pins the refusal on the
          precondition and not on the payload.
        test_recipe:
          setup:
            - "One clean unit with no stability assessment, so governing_stability_verdict is UNASSESSED"
            - "One DRAFT closure plan whose cheap in-place option makes recommended_method CLOSURE_IN_PLACE, matching selected_method so no justification is required"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0114", unit_name: "Ash Pond 114", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0114", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /ccr/closure-plans/${plan_id}/engineering-certification"
              payload: { certified_on: "2026-08-01", design_narrative: "Composite cap with 24-inch protective layer and perimeter toe drain regrade" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/engineering-certification"
              payload: { certified_on: "2026-08-01", design_narrative: "Composite cap with 24-inch protective layer and perimeter toe drain regrade" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_STABILITY_NOT_ADEQUATE"
            - "ClosurePlan.${plan_id}.status is still DRAFT and engineering_certified_by == null after trigger call 1"
            - "DisposalUnit.${unit_id}.governing_stability_verdict == ADEQUATE after trigger call 2"
            - "trigger call 3 returns HTTP 200 and ClosurePlan.${plan_id}.status == ENGINEERING_CERTIFIED"
            - "ClosurePlan.${plan_id}.engineering_certified_by == ${pe_geo_id} and engineering_certified_on == 2026-08-01"
            - "ClosurePlan.${plan_id}.recommended_method == CLOSURE_IN_PLACE"

      - name: plan_approval_moves_the_unit_and_opens_the_closure_plan_posting_obligation
        claim_type: side_effect_execution
        grounds:
          - state_machines.ClosurePlan.FULLY_CERTIFIED_to_APPROVED
          - state_machines.DisposalUnit.ACTIVE_to_CLOSURE_PLANNED
          - calculations.posting_obligation_status
          - calculations.compliance_posture
        distinguishing_aspect: |
          One approval must fire three declared side effects in the same request: the plan reaches
          APPROVED with its permit reference, the unit's closure_state advances to CLOSURE_PLANNED, and
          the unit acquires a closure_plan_posting_due_date sixty days out. An implementation that
          returns the approved plan without the unit-side effects, or that opens the posting obligation
          lazily on the next read, fails the last two assertions.
        test_recipe:
          setup:
            - "One clean unit with an ADEQUATE stability assessment dated 2026-07-15"
            - "One FULLY_CERTIFIED cheap in-place plan signed by two different engineers"
          setup_api_calls:
