              as: WblCoordinator
              captures: { ws_id: $.data.id }
          trigger:
            - call: "GET /wbl/worksites/${ws_id}"
              payload: {}
              as: SafetyReviewer
          assert:
            - "response status == 200"
            - "response data.id == ${ws_id}"
            - "response data.employer_partner_id == ${emp_id}"
            - "response data.site_name == Harborview Boat Shed"
            - "response data.hazard_class == LIMITED_HAZARD"
            - "response data.has_power_machinery == true"
            - "response data.max_concurrent_students == 3"
