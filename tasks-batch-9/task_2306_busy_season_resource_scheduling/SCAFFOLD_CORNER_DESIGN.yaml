      - name: daily_hours_rounding_leaves_two_hundredths_of_weekly_slack
        claim_type: precision
        grounds:
          - calculations.assignment_daily_hours
          - calculations.weekly_committed_hours
          - calculations.burnout_risk_score
          - endpoints[GET /scheduling/staff-members/{staff_member_id}/workload]
        distinguishing_aspect: |
          daily_hours is rounded to 2 decimals once (50.00 / 7 = 7.142857 -> 7.14) and the
          weekly load is rebuilt from that rounded per-day figure, so committed_hours is
          7.14 x 7 = 49.98 and not the 50.00 that was allocated: remaining_week_hours is
          exactly 0.02 and the committed burnout score is (49.98 - 40.00) / 2.50 = 3.99.
        test_recipe:
          setup:
