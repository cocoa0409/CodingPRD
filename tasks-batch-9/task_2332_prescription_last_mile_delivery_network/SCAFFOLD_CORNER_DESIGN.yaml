  - section: errors
    instances:
      - name: every_collection_returns_its_own_not_found_id
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_COURIER_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_EXCEPTION_CASE_NOT_FOUND]
          - errors[ERR_PLAN_GRANT_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_ATTEMPT_NOT_FOUND]
        distinguishing_aspect: "Nine collections, nine distinct 404 ids: an unknown id is never reported as a generic not-found and never as ERR_INVALID_REQUEST, because the uuid is well formed — the error id names the collection that was searched, which is what lets a client tell a bad delivery id from a bad window id in the same request body."
        test_recipe:
          setup:
            - "Reference data exists (health plan, grant, pharmacy, zone, patient) so the caller identities resolve, but no order, delivery, window, courier, assignment, case or attempt has been created."
