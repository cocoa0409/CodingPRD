            - "after all five refusals Sailing.${sail_t}.version is still ${v_sailed}, status SAILED, suspension_count 0; Booking.${bk_t}.booking_status == SAILED with cancelled_at == null; ItineraryChange.${itin_t}.status == DRAFT with published_at == null"
            - "Booking.${bk_t}.itinerary_compensation_obc_cents == 0 (the refused publish granted nothing)"

      - name: publishing_or_activating_or_signing_twice_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ItineraryChange[DRAFT -> PUBLISHED]
          - state_machines.Promotion[SCHEDULED -> ACTIVE]
          - state_machines.GroupBlock[TENTATIVE -> DEFINITE]
          - validations[priority=10]
        distinguishing_aspect: |
          These three one-shot transitions are NOT idempotent: replaying them is a 409 rather
          than a silent success, and - critically - the replay grants nothing. The published
          itinerary change must not compensate the same booking twice, which is the failure mode
          a naive re-run would produce. The repeated confirm-definite also proves the priority
          order: it is sent by a THIRD operator id, so the segregation-of-duties check at
          priority 8 passes and the 409 comes from the state check at priority 10.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing IDM-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment 60/4 and the 365..120 fare window at base 189995."
            - "Promotion SUMMERSALE (window 2026-08-01..2026-08-20) has been activated once, so it is ACTIVE."
            - "Group block MERIDIAN was created by gsa-001 and signed definite by gsa-002, so it is DEFINITE."
            - "One 2-adult booking (net_ticket_cents 379990, guest_count 2) exists, and a PORT_CANCELLED / OBC_ONLY itinerary change has been published once, granting 2500 * 2 == 5000 in onboard credit and no refund."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "IDM-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_d: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_d}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { v_d_open: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_d}", code: "SUMMERSALE", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-08-01T00:00:00Z", ends_on: "2026-08-20T00:00:00Z", max_redemptions: 5, expected_sailing_version: "${v_d_open}" }
              as: RevenueManager
              captures: { promo_d: $.data.id }
            - call: "POST /promotions/${promo_d}/activate"
              payload: {}
              as: RevenueManager
              captures: { pv_active: $.data.version }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 3, review_date: "2026-09-01T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_d: $.data.id }
            - call: "POST /group-blocks/${blk_d}/confirm-definite"
              payload: { contract_reference: "MER-9001" }
              as: GroupSalesAgent
              as_user_id: "gsa-002"
              captures: { bv_definite: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_d}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_d: $.data.id }
            - call: "POST /itinerary-changes"
              payload: { sailing_id: "${sail_d}", kind: "PORT_CANCELLED", affected_port_code: "GRC", compensation_policy: "OBC_ONLY" }
              as: PortOpsCoordinator
              captures: { itin_d: $.data.id }
            - call: "POST /itinerary-changes/${itin_d}/publish"
              payload: {}
              as: PortOpsCoordinator
              captures: { iv_published: $.data.version }
          trigger:
            - call: "POST /itinerary-changes/${itin_d}/publish"
              payload: {}
              as: PortOpsCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /promotions/${promo_d}/activate"
              payload: {}
              as: RevenueManager
              captures: { e2: $.data.error_id }
            - call: "POST /group-blocks/${blk_d}/confirm-definite"
              payload: { contract_reference: "MER-9002" }
              as: GroupSalesAgent
              as_user_id: "gsa-003"
              captures: { e3: $.data.error_id }
          assert:
            - "the second publish returns HTTP 409 with data.error_id == ERR_ITINERARY_CHANGE_NOT_DRAFT"
            - "the second activate returns HTTP 409 with data.error_id == ERR_PROMOTION_NOT_SCHEDULED"
            - "the second confirm-definite returns HTTP 409 with data.error_id == ERR_GROUP_BLOCK_NOT_TENTATIVE, NOT 403 ERR_SEGREGATION_OF_DUTIES (gsa-003 differs from the creator gsa-001, so priority 8 is satisfied and priority 10 decides)"
            - "Booking.${bk_d}.itinerary_compensation_obc_cents == 5000 and itinerary_refund_cents == 0 - unchanged by the replay, not doubled to 10000"
            - "Booking.${bk_d}.projected_onboard_gross_cents == 126000 and projected_onboard_net_cents == 121000"
            - "ItineraryChange.${itin_d}.affected_bookings_count == 1, total_obc_granted_cents == 5000, total_refund_granted_cents == 0, version still ${iv_published}"
            - "Promotion.${promo_d}.status == ACTIVE with version still ${pv_active}"
            - "GroupBlock.${blk_d}.status == DEFINITE, contract_reference == MER-9001 (not MER-9002), confirmed_by_user_id == gsa-002, version still ${bv_definite}"

      - name: booking_status_and_payment_status_are_independent_dimensions
        claim_type: parallel
        grounds:
          - state_machines.Booking[dimension=booking_status]
          - state_machines.Booking[dimension=payment_status]
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: booking_parallel_status_dimensions_evolve_independently
          rationale: |
            That §1.8 instance already drives the two Booking dimensions through independent
            paths on one row - a payment advancing AWAITING_DEPOSIT -> DEPOSIT_PAID -> PAID_IN_FULL
            while booking_status stays OPTION, then a confirm moving only booking_status - and
            asserts the full combined-state matrix including the pair that no single fused status
            enum could express. A separate breadth test would re-issue the same calls.

      - name: suspend_and_resume_can_loop_but_only_twice
        claim_type: cyclic
        grounds:
          - state_machines.Sailing[OPEN_FOR_SALE -> SALES_SUSPENDED]
          - state_machines.Sailing[SALES_SUSPENDED -> OPEN_FOR_SALE]
          - validations[priority=19].ERR_SUSPENSION_LIMIT_REACHED
        excluded_because:
          difficulty_instance: sailing_sales_suspension_resume_cycle_bounded_at_two
          rationale: |
            That §1.8 instance walks the whole cycle twice, asserts suspension_count and
            suspension_reason on each leg, shows the counter is NOT reset by resume-sales, and
            lands the third suspend on ERR_SUSPENSION_LIMIT_REACHED with the sailing left in
            OPEN_FOR_SALE. The cyclic-shape claim is fully covered there.

      - name: guarantee_assignment_moves_a_cabin_between_two_allotments
        claim_type: cross_entity
        grounds:
          - endpoints[POST /bookings/{id}/assign-guarantee]
          - calculations.oversell_availability
          - calculations.booking_onboard_projection
          - calculations.sailing_ralbd
        distinguishing_aspect: |
          Assigning a guarantee booking its real cabin touches four entities in one call: the
          Booking (assigned_cabin_category_id, both onboard projections), the source allotment
          (booked_cabins down), the target allotment (booked_cabins up) and the Sailing
          (projected onboard revenue and both RALBD figures). The guarantee fare is honoured, so
          net_ticket_cents must NOT be repriced upward to the richer category's fare even though
          the onboard projection IS re-derived from the richer category's spend indices.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing ASG-2701 (nights 7, total_lower_berths 200, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE."
            - "Category OV is named (tier_rank 2, onboard 11000 lower / 7000 upper) and IA is the guarantee category (tier_rank 1, onboard 9000 / 6000)."
            - "Allotments: IA 60 physical + allowance 4 (capacity 64), OV 20 physical + allowance 0 (capacity 20)."
            - "One 2-adult IA booking exists at net_ticket_cents 379990 with projected_onboard_gross_cents 7 * 2 * 9000 == 126000; before the trigger IA has booked_cabins 1 / available 63 and OV has booked_cabins 0 / available 20."
