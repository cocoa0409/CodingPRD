            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/training-modules", payload: { code: "SAFETY", title: "Content Safety", level: 2, prerequisite_module_id: "${mod_ori}" }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_saf: "$.data.id" } }
