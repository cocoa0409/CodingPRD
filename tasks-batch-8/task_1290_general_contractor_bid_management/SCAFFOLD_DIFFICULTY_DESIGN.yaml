# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — GC Bid Management & Prequalification (§1.8)
# Test Targeting Index: 2 instances per Difficulty Rule (18 total).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: prequal_self_reported_vs_verified_score
        grounds:
          - calculations.prequal_score
          - entities.PrequalApplication.fields.self_reported_score
          - entities.PrequalApplication.fields.verified_score
        distinguishing_aspect: |
          Dual-variant scoring on the Subcontractor/PrequalApplication domain:
          the SAME application row yields self_reported_score 53.50 from
          declared inputs but verified_score 85.00 from reviewer-verified
          inputs — two valid algorithm inputs, two different persisted results.
        test_recipe:
          setup:
            - "Subcontractor Alpha registered"
            - "Alpha's PrequalApplication SUBMITTED with declared revenue 2500000000, EMR 0.90, bonding 1000000000"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Alpha Steel LLC", contact_email: "alpha@x.com", license_number: "LIC-X-001" }
              as: Anonymous
              captures: { sub_a: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_a}", declared_annual_revenue_cents: 2500000000, declared_emr: 0.90, declared_bonding_capacity_cents: 1000000000 }
              as: Subcontractor
              as_user_id: "${sub_a}"
              captures: { app_a: $.data.id }
          trigger:
            - call: "POST /prequal-applications/${app_a}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000, review_notes: "audited financials received" }
              as: PrequalReviewer
          assert:
            - "PrequalApplication.${app_a}.self_reported_score == 53.50"
            - "PrequalApplication.${app_a}.verified_score == 85.00"
            - "PrequalApplication.${app_a}.status == APPROVED"
            - "self_reported_score (53.50) != verified_score (85.00) for the identical application"

      - name: apparent_vs_leveled_low_bid_divergence
        grounds:
          - calculations.bid_tabulation_ranking
          - calculations.leveled_bid_amount
          - entities.BidPackage.fields.apparent_low_bid_id
          - entities.BidPackage.fields.leveled_low_bid_id
        distinguishing_aspect: |
          Dual-variant ranking on the Bid/BidPackage domain (different entity
          domain than prequal scoring): the identical two-bid set crowns bid X
          as apparent_low (raw base 1000000 < 1100000) but bid Y as
          leveled_low (1100000 < 1000000+250000 allowance = 1250000).
        test_recipe:
          setup:
            - "Subs X and Y registered, prequal APPROVED, invited, responded BIDDING"
            - "Package DRAFT->PUBLISHED, due 2026-08-10T14:00:00Z, default bond pct 0.05"
            - "X bid base 1000000 bond 50000; Y bid base 1100000 bond 55000"
            - "Clock at 2026-08-10T15:00:00Z; bidding closed; X carries a 250000 GC_ALLOWANCE leveling adjustment"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "X Steel LLC", contact_email: "x@x.com", license_number: "LIC-X-101" }
              as: Anonymous
              captures: { sub_x: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Y Steel LLC", contact_email: "y@x.com", license_number: "LIC-Y-101" }
              as: Anonymous
              captures: { sub_y: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_x}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { app_x: $.data.id }
            - call: "POST /prequal-applications/${app_x}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_y}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { app_y: $.data.id }
            - call: "POST /prequal-applications/${app_y}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Tower A — Structural Steel", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_x}" }
              as: LeadEstimator
              captures: { inv_x: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_y}" }
              as: LeadEstimator
              captures: { inv_y: $.data.id }
            - call: "POST /invitations/${inv_x}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_x}"
            - call: "POST /invitations/${inv_y}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_y}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { bid_x: $.data.id }
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1100000, bond_amount_cents: 55000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { bid_y: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_x}", description: "X excludes temporary bracing — GC allowance", treatment: "GC_ALLOWANCE", amount_cents: 250000 }
              as: LeadEstimator
          trigger:
            - call: "POST /bid-packages/${pkg}/tabulate"
              as: LeadEstimator
          assert:
            - "BidPackage.${pkg}.apparent_low_bid_id == ${bid_x} (raw base 1000000 < 1100000)"
            - "BidPackage.${pkg}.leveled_low_bid_id == ${bid_y} (leveled 1100000 < 1250000)"
            - "BidPackage.${pkg}.compliant_bid_count == 2"
            - "BidPackage.${pkg}.status == TABULATED"
            - "apparent_low_bid_id != leveled_low_bid_id for the identical bid set"

  - rule_id: combinatorial_formula
    instances:
      - name: prequal_score_weighted_three_input_nonlinearity
        grounds:
          - calculations.prequal_score
        distinguishing_aspect: |
          Mode (a): a 3-input formula with non-linear interaction — min(100,.)
          caps on financial/bonding components, a piecewise EMR slope, and
          fixed weights. Sub A's inputs hit both caps (score 100.00); sub B's
          mid-slope EMR 0.95 yields safety 50.00 and total 50.00.
        test_recipe:
          setup:
            - "Sub A and Sub B registered; no applications yet"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "A Cap LLC", contact_email: "a@x.com", license_number: "LIC-A-201" }
              as: Anonymous
              captures: { sub_a: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "B Mid LLC", contact_email: "b@x.com", license_number: "LIC-B-201" }
              as: Anonymous
              captures: { sub_b: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_a}", declared_annual_revenue_cents: 6000000000, declared_emr: 0.65, declared_bonding_capacity_cents: 3000000000 }
              as: Subcontractor
              as_user_id: "${sub_a}"
              captures: { app_a: $.data.id }
          trigger:
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_b}", declared_annual_revenue_cents: 2500000000, declared_emr: 0.95, declared_bonding_capacity_cents: 1000000000 }
              as: Subcontractor
              as_user_id: "${sub_b}"
              captures: { app_b: $.data.id }
          assert:
            - "PrequalApplication.${app_a}.self_reported_score == 100.00 (financial capped at 100.00, EMR 0.65 <= 0.70 floor gives safety 100.00, bonding capped at 100.00)"
            - "PrequalApplication.${app_b}.self_reported_score == 50.00 (50.00 financial, 100-(0.95-0.70)*200 = 50.00 safety, 50.00 bonding; 0.40*50+0.35*50+0.25*50)"

      - name: leveled_amount_per_adjustment_rounding_order
        grounds:
          - calculations.leveled_bid_amount
          - entities.LevelingAdjustment.fields.resolved_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned: each pct_of_base
          adjustment is rounded to integer cents individually THEN summed.
          Base 101 with two 2.5% adjustments: per-adjustment round_half_up
          (2.525 -> 3) twice then sum = 107; sum-then-round would give 106.
        test_recipe:
          setup:
            - "Sub S registered, prequal APPROVED, invited, BIDDING"
            - "Package PUBLISHED then BIDDING_CLOSED, due 2026-08-10T14:00:00Z"
            - "Bid base 101 cents, bond 5 cents (required = round_half_up(101*0.05) = 5)"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "S Rounding LLC", contact_email: "s@x.com", license_number: "LIC-S-301" }
              as: Anonymous
              captures: { sub_s: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_s}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_s}"
              captures: { app_s: $.data.id }
            - call: "POST /prequal-applications/${app_s}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Rounding Package", trade_code: "033000", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_s}" }
              as: LeadEstimator
              captures: { inv_s: $.data.id }
            - call: "POST /invitations/${inv_s}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_s}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 101, bond_amount_cents: 5 }
              as: Subcontractor
              as_user_id: "${sub_s}"
              captures: { bid_s: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_s}", description: "allowance A1", treatment: "GC_ALLOWANCE", pct_of_base: 0.025 }
              as: LeadEstimator
              captures: { adj_1: $.data.id }
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_s}", description: "sub quote A2", treatment: "SUB_QUOTE", pct_of_base: 0.025 }
              as: LeadEstimator
              captures: { adj_2: $.data.id }
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_s}", description: "excluded scope line", treatment: "EXCLUDED_SCOPE", amount_cents: 999999 }
              as: LeadEstimator
          trigger:
            - call: "GET /bids/${bid_s}/leveling-sheet"
              as: LeadEstimator
          assert:
            - "LevelingAdjustment.${adj_1}.resolved_amount_cents == 3 (round_half_up(101 * 0.025) = round_half_up(2.525) = 3)"
            - "LevelingAdjustment.${adj_2}.resolved_amount_cents == 3"
            - "leveling-sheet.leveled_amount_cents == 107 (101 + 3 + 3; EXCLUDED_SCOPE contributes 0)"
            - "leveling-sheet.has_exclusions == true"
            - "leveled_amount_cents != 106 (sum-then-round ordering is rejected)"

  - rule_id: non_linear_state_machine
    instances:
      - name: bid_package_recommendation_return_cycle
        grounds:
          - state_machines.BidPackage.TABULATED_to_RECOMMENDATION_PENDING
          - state_machines.BidPackage.RECOMMENDATION_PENDING_to_TABULATED
          - state_machines.AwardRecommendation.SUBMITTED_to_RETURNED
        distinguishing_aspect: |
          Cyclic machine on BidPackage: RETURNED drives the package
          RECOMMENDATION_PENDING -> TABULATED (a revert), unlocking leveling
          and permitting a NEW recommendation draft — not a linear pipeline.
        test_recipe:
          setup:
            - "Package TABULATED with one compliant SUBMITTED bid (base 1000000, bond 50000)"
            - "AwardRecommendation drafted by LeadEstimator le-100 and submitted; package RECOMMENDATION_PENDING"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Cyc Steel LLC", contact_email: "cyc@x.com", license_number: "LIC-C-401" }
              as: Anonymous
              captures: { sub_c: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_c}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_c}"
              captures: { app_c: $.data.id }
            - call: "POST /prequal-applications/${app_c}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Cycle Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_c}" }
              as: LeadEstimator
              captures: { inv_c: $.data.id }
            - call: "POST /invitations/${inv_c}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_c}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_c}"
              captures: { bid_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/tabulate"
              as: LeadEstimator
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
              captures: { pkg_v: $.data.version }
            - call: "POST /award-recommendations"
              payload: { bid_package_id: "${pkg}", recommended_bid_id: "${bid_c}", rationale: "only compliant bidder", expected_bid_package_version: "${pkg_v}" }
              as: LeadEstimator
              as_user_id: "le-100"
              captures: { rec: $.data.id }
            - call: "POST /award-recommendations/${rec}/submit"
              as: LeadEstimator
              as_user_id: "le-100"
          trigger:
            - call: "POST /award-recommendations/${rec}/decide"
              payload: { decision: "RETURNED", decision_notes: "leveling incomplete — revisit exclusions" }
              as: ChiefEstimator
              as_user_id: "ce-900"
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_c}", description: "post-return leveling edit", treatment: "GC_ALLOWANCE", amount_cents: 10000 }
              as: LeadEstimator
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
              captures: { pkg_v2: $.data.version }
            - call: "POST /award-recommendations"
              payload: { bid_package_id: "${pkg}", recommended_bid_id: "${bid_c}", rationale: "re-drafted after return", expected_bid_package_version: "${pkg_v2}" }
              as: LeadEstimator
              as_user_id: "le-100"
              captures: { rec2: $.data.id }
          assert:
            - "AwardRecommendation.${rec}.status == RETURNED"
            - "BidPackage.${pkg}.status == TABULATED after the return (cycle back, not stuck in RECOMMENDATION_PENDING)"
            - "POST /leveling-adjustments after return returns 201 (leveling unlocked)"
            - "POST /award-recommendations after return returns 201 (no active recommendation blocks it): ${rec2} exists in DRAFT"

      - name: prequal_reject_resubmit_cycle
        grounds:
          - state_machines.PrequalApplication.SUBMITTED_to_REJECTED
          - state_machines.PrequalApplication.REJECTED_to_SUBMITTED
          - state_machines.PrequalApplication.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Cyclic machine on PrequalApplication (different entity than
          BidPackage): REJECTED -> SUBMITTED resubmission loop; the same row
          re-enters SUBMITTED with recomputed self_reported_score 70.75 and
          cleared verified_score, then reaches APPROVED.
        test_recipe:
          setup:
            - "Sub R registered; application SUBMITTED with declared revenue 2500000000, EMR 0.90, bonding 1000000000 (self_reported 53.50)"
            - "Reviewer REJECTED the application"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "R Resubmit LLC", contact_email: "r@x.com", license_number: "LIC-R-402" }
              as: Anonymous
              captures: { sub_r: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_r}", declared_annual_revenue_cents: 2500000000, declared_emr: 0.90, declared_bonding_capacity_cents: 1000000000 }
              as: Subcontractor
              as_user_id: "${sub_r}"
              captures: { app_r: $.data.id }
            - call: "POST /prequal-applications/${app_r}/decision"
              payload: { decision: "REJECTED", review_notes: "financials too thin" }
              as: PrequalReviewer
          trigger:
            - call: "POST /prequal-applications/${app_r}/resubmit"
              payload: { declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_r}"
            - call: "POST /prequal-applications/${app_r}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 3000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 1500000000 }
              as: PrequalReviewer
          assert:
            - "After resubmit: status == SUBMITTED and self_reported_score == 70.75 (0.40*60.00 + 0.35*80.00 + 0.25*75.00)"
            - "After resubmit: verified_score == null (cleared)"
            - "After approval: status == APPROVED and verified_score == 70.75"
            - "approved_at == 2026-08-01T00:00:00Z (default clock) and expires_at == 2027-08-01T00:00:00Z"

  - rule_id: transitive_cascade
    instances:
      - name: award_approval_three_level_cascade
        grounds:
          - state_machines.AwardRecommendation.SUBMITTED_to_APPROVED
          - state_machines.BidPackage.RECOMMENDATION_PENDING_to_AWARDED
          - state_machines.Bid.SUBMITTED_to_NOT_AWARDED
          - state_machines.Bid.SUBMITTED_to_AWARDED
        distinguishing_aspect: |
          Depth-3 chain from the decide trigger: recommendation APPROVED
          (link 0) -> BidPackage AWARDED (link 1) -> non-recommended SUBMITTED
          Bid X NOT_AWARDED (link 2, caused by the package award) ->
          BidderFeedback DRAFT auto-created for X (link 3, caused by X's own
          transition), each hop caused by the previous one.
        test_recipe:
          setup:
            - "Package TABULATED; bid X (base 1000000 + 250000 allowance => leveled 1250000) and bid Y (base 1100000 => leveled 1100000) both SUBMITTED"
            - "Recommendation for Y drafted by le-100 and submitted (package RECOMMENDATION_PENDING)"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "X Cascade LLC", contact_email: "xc@x.com", license_number: "LIC-X-501" }
              as: Anonymous
              captures: { sub_x: $.data.id }
            - call: "POST /subcontractors"
              payload: { legal_name: "Y Cascade LLC", contact_email: "yc@x.com", license_number: "LIC-Y-501" }
              as: Anonymous
              captures: { sub_y: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_x}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { app_x: $.data.id }
            - call: "POST /prequal-applications/${app_x}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_y}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { app_y: $.data.id }
            - call: "POST /prequal-applications/${app_y}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Cascade Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_x}" }
              as: LeadEstimator
              captures: { inv_x: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_y}" }
              as: LeadEstimator
              captures: { inv_y: $.data.id }
            - call: "POST /invitations/${inv_x}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_x}"
            - call: "POST /invitations/${inv_y}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_y}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_x}"
              captures: { bid_x: $.data.id }
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1100000, bond_amount_cents: 55000 }
              as: Subcontractor
              as_user_id: "${sub_y}"
              captures: { bid_y: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_x}", description: "temp bracing allowance", treatment: "GC_ALLOWANCE", amount_cents: 250000 }
              as: LeadEstimator
