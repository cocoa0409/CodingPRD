  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_capacity_conserved_across_book_and_early_cancel
        grounds:
          - conservation_invariants[slot_capacity_conservation]
          - calculations.slot_capacity_counts
          - calculations.visit_fee_cents
          - state_machines.VisitSlot.capacity.OPEN_to_BOOKED
          - state_machines.VisitSlot.capacity.BOOKED_to_OPEN
        distinguishing_aspect: |
          Conserved quantity: technician SLOT ROWS. Booking then cancelling more than
          24 hours ahead must restore open_slot_count + booked_slot_count +
          blocked_slot_count == total_slot_count == 2 with open back at 2 and zero fee
          booked — no slot may leak into BLOCKED on the early-cancel path.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "A PRO plan; a household in NWA with an OWNER and an ACTIVE subscription."
            - "A technician in NWA with two slots, 2026-05-10T09:00:00Z -> 11:00:00Z and 2026-05-10T13:00:00Z -> 15:00:00Z; before booking the counters are total 2 / open 2 / booked 0 / blocked 0."
            - "One account-level P1 ticket escalated by a HARDWARE_FAULT verdict, then booked into the 09:00 slot, so the counters are total 2 / open 1 / booked 1 / blocked 0."
            - "The clock is then moved to 2026-05-08T00:00:00Z, which is before the 2026-05-09T09:00:00Z late-cancel cutoff."
