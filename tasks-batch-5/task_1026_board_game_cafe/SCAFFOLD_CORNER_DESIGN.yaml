              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED and http_status == 403"

      - name: rbac_member_redeem_other_member_returns_unauthorized
        claim_type: Ownership Enforcement
        grounds: [roles, "validations[priority=3]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Member calling POST /memberships/{B}/redemptions with X-User-ID = A (not the owner) returns ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Members A and B both exist; B has points."]
          setup_api_calls:
            - call: "POST /memberships"
              payload: { email: "a2@x.com", full_name: "A2" }
              as: Staff
              captures: { mA: $.data.id }
            - call: "POST /memberships"
              payload: { email: "b2@x.com", full_name: "B2" }
              as: Staff
              captures: { mB: $.data.id }
            - call: "POST /memberships/${mB}/loyalty-adjustments"
              payload: { points_delta: 500, reason: "grant" }
              as: Manager
          trigger:
            - call: "POST /memberships/${mB}/redemptions"
              payload: { points_cost: 100, reward_description: "Steal" }
              as: Member
              as_user_id: "${mA}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED and http_status == 403  # ownership: X-User-ID A != membership B"

      - name: unauthenticated_missing_headers_returns_401
        claim_type: Authentication
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/invalid auth headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["No auth headers are sent (represented by the sentinel role Anonymous)."]
          setup_api_calls: []
          trigger:
            - call: "GET /tables"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED and http_status == 401"

  # =========================================================================
  # Cross-cutting: optimistic concurrency
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: private_booking_create_increments_room_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[private-booking-hold-supersede-stale-room]", entities.Room.fields.version]
        distinguishing_aspect: "Creating a hold with the correct expected_room_version succeeds and increments Room.version from 1 to 2."
        test_recipe:
          setup: ["A fresh room (version 1)."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Ver Room", capacity: 10, hourly_rate_cents: 4000 }
              as: Manager
              captures: { room: $.data.id, rv0: $.data.version }
          trigger:
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T18:00:00Z", end_at: "2026-07-09T19:00:00Z", headcount: 4, expected_room_version: "${rv0}" }
              as: Staff
              captures: { pb: $.data.id }
            - call: "GET /rooms/${room}"
              payload: {}
              as: Staff
              captures: { rv1: $.data.version }
          assert:
            - "PrivateBooking.${pb}.status == HELD and Room.${room}.version == 2 (incremented from 1)"

      - name: private_booking_stale_room_version_returns_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[private-booking-hold-supersede-stale-room]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second create still carrying the original expected_room_version (now stale after the first hold bumped it) is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Room v1; a first hold pb1 created with expected_room_version=1 bumped Room.version to 2."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Stale Room", capacity: 10, hourly_rate_cents: 4000 }
              as: Manager
              captures: { room: $.data.id, rv0: $.data.version }
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T18:00:00Z", end_at: "2026-07-09T19:00:00Z", headcount: 4, expected_room_version: "${rv0}" }
              as: Staff
              captures: { pb1: $.data.id }
          trigger:
            - call: "POST /private-bookings"
              payload: { room_id: "${room}", start_at: "2026-07-09T20:00:00Z", end_at: "2026-07-09T21:00:00Z", headcount: 4, expected_room_version: "${rv0}" }
              as: Staff
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION and http_status == 412  # ${rv0}=1 is stale; Room.version is now 2"

