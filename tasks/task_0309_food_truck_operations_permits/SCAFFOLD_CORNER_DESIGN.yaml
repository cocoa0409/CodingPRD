# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Food Truck Operations & Permits — Expert
# Breadth probe across the 9 claim-extraction-guide sections. §1.8 covers depth.
# Every active instance's setup_api_calls drives empty-DB -> precondition using
# only §1.5 endpoints; excluded_because stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_commissary_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Commissary, endpoints]
        distinguishing_aspect: "POST /commissaries with name+state_code returns 201; status defaults ACTIVE and docked_truck_count=0 in the response."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /commissaries"
              payload: { name: "West Kitchen", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id, st: $.data.status, dtc: $.data.docked_truck_count }
          assert:
            - "Commissary.${comm_id}.status == ACTIVE"
            - "Commissary.${comm_id}.docked_truck_count == 0"

      - name: get_truck_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.OperatorTruck
          - errors[ERR_TRUCK_NOT_FOUND]
        distinguishing_aspect: "GET /trucks/{nonexistent-uuid} returns ERR_TRUCK_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /trucks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TRUCK_NOT_FOUND"

      - name: create_menu_item_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.MenuItem
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /menu-items missing unit_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A truck exists."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { truck_id: "${truck_id}", sku: "S1", name: "Item", par_units: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: order_discount_code_defaults_none
        claim_type: Defaults
        grounds: [entities.Order.fields.discount_code]
        distinguishing_aspect: "An order created without discount_code carries discount_code default NONE and tip_cents default 0."
        test_recipe:
          setup: ["An OPERABLE truck with an ARRIVED booking."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T18:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "PP", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-07-01T16:00:00.000Z", shift_end: "2026-07-01T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-07-01T16:00:00.000Z", shift_end: "2026-07-01T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /spots"
              payload: { name: "Plaza", state_code: "CA", concurrent_capacity: 2, reservation_fee_cents: 0 }
              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "M", starts_at: "2026-07-01T17:00:00.000Z", ends_at: "2026-07-01T22:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-07-01T17:30:00.000Z", window_end: "2026-07-01T21:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/arrive"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
          trigger:
            - call: "POST /orders"
              payload: { booking_id: "${booking_id}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { order_id: $.data.id, dc: $.data.discount_code, tip: $.data.tip_cents }
          assert:
            - "Order.${order_id}.discount_code == NONE"
            - "Order.${order_id}.tip_cents == 0"

      - name: truck_operability_system_field_input_ignored
        claim_type: System Fields
        grounds: [entities.OperatorTruck.fields.operability]
        distinguishing_aspect: "operability is server-computed: a freshly created truck (no permit/staffing) is GROUNDED regardless of any client input; create does not accept operability."
        test_recipe:
          setup: ["A commissary exists."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id, op: $.data.operability }
          assert:
            - "OperatorTruck.${truck_id}.operability == GROUNDED"

      - name: create_order_line_bad_quantity_zero_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.OrderLine.fields.quantity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "OrderLine quantity has constraint >= 1; quantity 0 on POST /order-lines returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["An OPERABLE truck with an ARRIVED booking, an OPEN order, and an AVAILABLE item."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T18:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "PP", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-07-02T16:00:00.000Z", shift_end: "2026-07-02T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-07-02T16:00:00.000Z", shift_end: "2026-07-02T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /menu-items"
              payload: { truck_id: "${truck_id}", sku: "S1", name: "Item", unit_price_cents: 300, par_units: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { item_id: $.data.id }
            - call: "POST /prep-batches"
              payload: { truck_id: "${truck_id}", menu_item_id: "${item_id}", units_made: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /spots"
              payload: { name: "Plaza", state_code: "CA", concurrent_capacity: 2, reservation_fee_cents: 0 }
              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "M", starts_at: "2026-07-02T17:00:00.000Z", ends_at: "2026-07-02T22:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-07-02T17:30:00.000Z", window_end: "2026-07-02T21:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/arrive"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders"
              payload: { booking_id: "${booking_id}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", menu_item_id: "${item_id}", quantity: 0 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: utility_log_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.UtilityLog]
        distinguishing_aspect: "UtilityLog is common_fields:false (append-only event): it has id + created_at but no version field; there is no update/delete endpoint for it."
        test_recipe:
          setup: ["A truck exists."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
          trigger:
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "GENERATOR", generator_delta_hours: 2 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { log_id: $.data.id }
            - call: "GET /utility-logs/${log_id}"
              payload: {}
              as: Dispatcher
              captures: { again: $.data.id }
          assert:
            - "again == ${log_id}"

      - name: create_truck_bad_commissary_fk_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.OperatorTruck.fields.commissary_id
          - errors[ERR_COMMISSARY_NOT_FOUND]
        distinguishing_aspect: "POST /trucks with a commissary_id that does not exist returns ERR_COMMISSARY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "00000000-0000-4000-8000-000000000000", home_state_code: "CA" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COMMISSARY_NOT_FOUND"

      - name: list_commissaries_pagination_envelope
        claim_type: Listing
        grounds: [entities.Commissary, endpoints]
        distinguishing_aspect: "GET /commissaries returns a paginated array with total_count and has_more in the meta/pagination fields."
        test_recipe:
          setup: ["Two commissaries exist."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K1", state_code: "CA" }
              as: Dispatcher
            - call: "POST /commissaries"
              payload: { name: "K2", state_code: "CA" }
              as: Dispatcher
          trigger:
            - call: "GET /commissaries"
              payload: { limit: 1, offset: 0 }
              as: Dispatcher
              captures: { tc: $.meta.total_count }
          assert:
            - "GET /commissaries response has_more == true with limit 1 and 2 commissaries"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: revoke_already_revoked_permit_returns_not_active
        claim_type: Invalid Transitions
        grounds:
          - state_machines.HealthPermit.ACTIVE_to_REVOKED
          - errors[ERR_PERMIT_NOT_ACTIVE]
        distinguishing_aspect: "Revoking a permit that is already REVOKED fails with ERR_PERMIT_NOT_ACTIVE (terminal-state lockdown); no further side effects."
        test_recipe:
          setup: ["A truck with an ACTIVE permit, then revoked once."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "PP", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
              captures: { permit_id: $.data.id }
            - call: "POST /health-permits/${permit_id}/revoke"
              payload: {}
              as: HealthInspector
          trigger:
            - call: "POST /health-permits/${permit_id}/revoke"
              payload: {}
              as: HealthInspector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERMIT_NOT_ACTIVE"

      - name: depart_with_open_order_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Booking.ARRIVED_to_DEPARTED
          - errors[ERR_OPEN_ORDERS_EXIST]
        distinguishing_aspect: "Departing an ARRIVED booking that still has an OPEN order is rejected with ERR_OPEN_ORDERS_EXIST; booking stays ARRIVED."
        test_recipe:
          setup: ["An OPERABLE truck with an ARRIVED booking and an OPEN order (one line) under it."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T18:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "PP", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-07-03T16:00:00.000Z", shift_end: "2026-07-03T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-07-03T16:00:00.000Z", shift_end: "2026-07-03T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /menu-items"
              payload: { truck_id: "${truck_id}", sku: "S1", name: "Item", unit_price_cents: 300, par_units: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { item_id: $.data.id }
            - call: "POST /prep-batches"
              payload: { truck_id: "${truck_id}", menu_item_id: "${item_id}", units_made: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /spots"
              payload: { name: "Plaza", state_code: "CA", concurrent_capacity: 2, reservation_fee_cents: 0 }
              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "M", starts_at: "2026-07-03T17:00:00.000Z", ends_at: "2026-07-03T22:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-07-03T17:30:00.000Z", window_end: "2026-07-03T21:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/arrive"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders"
              payload: { booking_id: "${booking_id}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { order_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${order_id}", menu_item_id: "${item_id}", quantity: 1 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/depart"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OPEN_ORDERS_EXIST"
            - "Booking.${booking_id}.status == ARRIVED"

      - name: capture_before_authorize_returns_not_authorized
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - errors[ERR_PAYMENT_NOT_AUTHORIZED]
        distinguishing_aspect: "Capturing a payment while payment_status is still UNPAID (never authorized) is rejected with ERR_PAYMENT_NOT_AUTHORIZED."
        test_recipe:
          setup: ["An OPEN order with one line, payment UNPAID, under an ARRIVED booking on an OPERABLE truck."]
          setup_api_calls:
            - call: "POST /commissaries"
              payload: { name: "K", state_code: "CA" }
              as: Dispatcher
              captures: { comm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T18:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /trucks"
              payload: { name: "T", commissary_id: "${comm_id}", home_state_code: "CA" }
              as: Dispatcher
              captures: { truck_id: $.data.id }
            - call: "POST /health-permits"
              payload: { truck_id: "${truck_id}", permit_number: "PP", state_code: "CA", issued_at: "2026-05-01T00:00:00.000Z", expires_at: "2026-12-01T00:00:00.000Z" }
              as: HealthInspector
            - call: "POST /utility-logs"
              payload: { truck_id: "${truck_id}", utility: "PROPANE", propane_psi_after: 50 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Dee", role: "DRIVER", shift_start: "2026-07-04T16:00:00.000Z", shift_end: "2026-07-04T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /staff-shifts"
              payload: { truck_id: "${truck_id}", staff_name: "Coe", role: "COOK", shift_start: "2026-07-04T16:00:00.000Z", shift_end: "2026-07-04T23:00:00.000Z" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /menu-items"
              payload: { truck_id: "${truck_id}", sku: "S1", name: "Item", unit_price_cents: 300, par_units: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { item_id: $.data.id }
            - call: "POST /prep-batches"
              payload: { truck_id: "${truck_id}", menu_item_id: "${item_id}", units_made: 5 }
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /spots"
              payload: { name: "Plaza", state_code: "CA", concurrent_capacity: 2, reservation_fee_cents: 0 }
              as: Dispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /events"
              payload: { name: "M", starts_at: "2026-07-04T17:00:00.000Z", ends_at: "2026-07-04T22:00:00.000Z" }
              as: Dispatcher
              captures: { event_id: $.data.id }
            - call: "GET /trucks/${truck_id}"
              payload: {}
              as: Dispatcher
              captures: { truck_v: $.data.version }
            - call: "POST /bookings"
              payload: { truck_id: "${truck_id}", spot_id: "${spot_id}", event_id: "${event_id}", window_start: "2026-07-04T17:30:00.000Z", window_end: "2026-07-04T21:00:00.000Z", expected_truck_version: "${truck_v}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /bookings/${booking_id}/arrive"
              payload: {}
              as: OperatorTruck
              as_user_id: "${truck_id}"
            - call: "POST /orders"
              payload: { booking_id: "${booking_id}" }
              as: OperatorTruck
              as_user_id: "${truck_id}"
