          trigger:
            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "ACCESSIBILITY_AUDIT", audit_result: "PASS" }
              as: ComplianceOfficer
            - call: "POST /kiosk-ops/content-bundles/${bundle_id}/actions"
              payload: { action: "VALIDATE" }
              as: ContentManager
              captures: { validated_state: $.data.state }
            - call: "POST /kiosk-ops/devices/${dev_id}/cache-sync"
              payload: { bundle_id: "${bundle_id}" }
              as: DeviceAgent
              as_user_id: "${dev_id}"
