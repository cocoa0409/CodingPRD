      - name: location_capacity_exceeded_on_par_level
        claim_type: aggregate_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_LOCATION_CAPACITY_EXCEEDED]
        distinguishing_aspect: "sum(ParLevel.par_units) at Location must not exceed Location.capacity_units. Adding par=6 to a capacity=5 Location returns ERR_LOCATION_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Client + PANTRY Location with capacity_units=5 (no existing ParLevels)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
