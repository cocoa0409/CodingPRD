      - name: late_checkout_grace_window_exclusive_at_thirty_minutes
        grounds: "§1.3 calculation late_checkout_charge ('if overdue <= grace: charge = 0.00', precision note 'overdue minutes are floored, so 30 minutes and 59 seconds is 30 overdue minutes'); §1.1 HotelProperty.late_checkout_grace_minutes 30."
        distinguishing_aspect: >-
          A temporal boundary read off the logical clock rather than a money threshold, and the
          inequality runs the other way: the grace comparison is <=, so exactly 30 overdue minutes
          is free while 31 costs 47.50. The floor on the minute division means the boundary must be
          probed in whole minutes, not seconds.
        test_recipe:
          setup: "Standard property (late_checkout_grace_minutes 30); business date 2026-08-01; the clock moved to 2026-08-01T17:01:00.000Z; two in-house CASH folios at rate 189.99 whose scheduled_checkout_at values are 2026-08-01T16:31:00.000Z (exactly 30 overdue minutes) and 2026-08-01T16:30:00.000Z (31 overdue minutes)."
