              payload: { treatment_plan_id: "${rt2_plan}", standing_order_id: "${rt2_so}", injector_provider_id: "${rt2_inj}", injectable_lot_id: "${rt2_lot}", planned_units: 20, expected_treatment_plan_version: "${rt2_plan_v2}" }
              as: Provider
