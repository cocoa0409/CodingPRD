        claim_type: immediate
        grounds:
          - endpoints.POST_/inspection/noncompliance-records
          - "endpoints.GET_/inspection/noncompliance-records/{id}"
        distinguishing_aspect: "Immediate consistency: the POST /noncompliance-records response already carries the final stored state (status OPEN, issued_at stamped), and a same-instant GET returns identical field values with no lag."
        test_recipe:
          setup: ["Clock default. Establishment; inspector."]
          setup_api_calls:
            - call: "POST /inspection/establishments"
              payload: { name: "CM1 Plant", species_classes: ["CATTLE"], slaughter_capable: true }
              as: ProgramAdministrator
              captures: { est_id: $.data.id }
