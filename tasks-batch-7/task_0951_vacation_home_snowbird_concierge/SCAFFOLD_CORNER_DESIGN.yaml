              as: PlatformAdmin
              captures: { secure_tmpl_id: $.data.id }
            - call: "POST /property-care/storm-events"
              payload: { name: "Hurricane Kilo", region_state_code: "FL", landfall_eta_at: "2026-06-05T00:00:00Z" }
              as: StormCoordinator
              captures: { storm_id: $.data.id }
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "WATCH" }
              as: StormCoordinator
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "WARNING" }
              as: StormCoordinator
            - call: "POST /property-care/storm-events/${storm_id}/advisory"
              payload: { to_status: "IMMINENT" }
              as: StormCoordinator
            - call: "POST /property-care/storm-events/${storm_id}/responses"
              payload: { property_id: "${prop_id}" }
              as: StormCoordinator
              captures: { resp_id: $.data.id }
            - call: "POST /property-care/storm-responses/${resp_id}/schedule-sweep"
              payload: { checklist_template_id: "${secure_tmpl_id}", scheduled_start_at: "2026-06-04T18:30:00Z" }
              as: StormCoordinator
              captures: { sweep_visit_id: $.data.secure_sweep_visit_id }
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/visits/${sweep_visit_id}/depart"
              payload: {}
              as: FieldTech
              as_user_id: "tech-alpha"
            - call: "POST /property-care/visits/${sweep_visit_id}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "tech-alpha"
            - call: "POST /property-care/visits/${sweep_visit_id}/complete"
              payload: { completed_item_codes: ["SHUTTERS"], failed_item_codes: [] }
              as: FieldTech
              as_user_id: "tech-alpha"
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/storm-events/${storm_id}/landfall"
              payload: {}
              as: StormCoordinator
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T06:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/storm-events/${storm_id}/all-clear"
              payload: {}
              as: StormCoordinator
            - call: "GET /property-care/storm-responses/${resp_id}"
              payload: {}
              as: StormCoordinator
              captures: { resp_v: $.data.version, swept_by: $.data.swept_by_user_id }
          trigger:
            - call: "POST /property-care/storm-responses/${resp_id}/assessments"
              payload: { damage_level: "MINOR", expected_storm_response_version: "${resp_v}" }
              as: FieldTech
              as_user_id: "tech-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "StormResponse.${resp_id}.swept_by_user_id == tech-alpha"
            - "HTTP status == 403 and data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "StormResponse.${resp_id}.status == ASSESSMENT_DUE and assessed_by_user_id == null"

  - section: errors
    instances:
      - name: err_unauthenticated_when_headers_absent_returns_401
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "A POST /property-care/owners sent with neither X-User-Role nor X-User-ID returns 401 ERR_UNAUTHENTICATED and creates no row; G1 fires before every other gate."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-care/owners"
              payload: { full_name: "No Auth", email: "no.auth@example.com", phone: "+15550700", primary_residence_state: "MN" }
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "the request carries neither X-User-Role nor X-User-ID"
            - "HTTP status == 401 and data.error_id == ERR_UNAUTHENTICATED"

      - name: err_unknown_role_for_undeclared_role_header_returns_401
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNKNOWN_ROLE]", "validations[priority=2]", "roles.PlatformAdmin"]
        distinguishing_aspect: "X-User-Role Concierge is not one of the eight declared roles, so G1 rung 2 returns 401 ERR_UNKNOWN_ROLE rather than the 403 ERR_ROLE_NOT_PERMITTED that a declared-but-unauthorised role would get."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /property-care/owners"
              payload: { full_name: "Bad Role", email: "bad.role@example.com", phone: "+15550701", primary_residence_state: "MN" }
              as: Concierge
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401 and data.error_id == ERR_UNKNOWN_ROLE"

      - name: err_clock_regression_on_backwards_set_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLOCK_REGRESSION]", "endpoints.POST /property-care/_clock/set_current_utc"]
        distinguishing_aspect: "Setting the logical clock to an instant strictly before its current value returns 400 ERR_CLOCK_REGRESSION and leaves the clock at 2026-06-10T00:00:00Z."
        test_recipe:
          setup: ["The logical clock advanced to 2026-06-10T00:00:00Z."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T23:59:59Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_CLOCK_REGRESSION"
            - "GET /property-care/_clock still reports 2026-06-10T00:00:00.000Z"

      - name: err_pagination_invalid_for_zero_limit_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAGINATION_INVALID]", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit is bounded to [1, 100]; limit 0 on GET /property-care/owners returns 400 ERR_PAGINATION_INVALID rather than an empty page."
        test_recipe:
          setup: ["One Owner."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Pag Owner", email: "pag.owner@example.com", phone: "+15550702", primary_residence_state: "MN" }
              as: PlatformAdmin
          trigger:
            - call: "GET /property-care/owners"
              payload: { limit: 0 }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_PAGINATION_INVALID"

      - name: err_landfall_eta_in_past_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_LANDFALL_ETA_IN_PAST]", "entities.StormEvent.fields.landfall_eta_at"]
        distinguishing_aspect: "A storm declared with landfall_eta_at at or before the logical clock returns 400 ERR_LANDFALL_ETA_IN_PAST and no StormEvent row is created, because every pre-storm deadline would otherwise be in the past."
        test_recipe:
          setup: ["The logical clock at 2026-06-10T00:00:00Z."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /property-care/storm-events"
              payload: { name: "Hurricane Late", region_state_code: "FL", landfall_eta_at: "2026-06-10T00:00:00Z" }
              as: StormCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_LANDFALL_ETA_IN_PAST"
            - "GET /property-care/storm-events returns total_count == 0"

      - name: err_interval_malformed_on_reversed_away_period_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_INTERVAL_MALFORMED]", "validations[priority=64]"]
        distinguishing_aspect: "end_at at or before start_at on POST /property-care/away-periods returns 400 ERR_INTERVAL_MALFORMED; the interval rung fires before the 240-day span rung."
        test_recipe:
          setup: ["One Owner and one Property."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Rev Interval", email: "rev.interval@example.com", phone: "+15550703", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Rev House", address_line: "64 Back St", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /property-care/away-periods"
              payload: { property_id: "${prop_id}", owner_id: "${owner_id}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-07-01T00:00:00Z", cadence_days: 14 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_INTERVAL_MALFORMED"
            - "GET /property-care/away-periods with property_id ${prop_id} returns total_count == 0"

      - name: err_away_period_invalid_when_span_exceeds_240_days_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_AWAY_PERIOD_INVALID]", "validations[priority=67]", "global_constants.AWAY_PERIOD_MAX_DAYS"]
        distinguishing_aspect: "A 300-day away period exceeds AWAY_PERIOD_MAX_DAYS (240) and returns 400 ERR_AWAY_PERIOD_INVALID, a different code from the malformed-interval error on the same endpoint."
        test_recipe:
          setup: ["One Owner and one Property."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Long Away", email: "long.away@example.com", phone: "+15550704", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Long House", address_line: "240 Span St", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /property-care/away-periods"
              payload: { property_id: "${prop_id}", owner_id: "${owner_id}", start_at: "2026-07-01T00:00:00Z", end_at: "2027-04-27T00:00:00Z", cadence_days: 14 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_AWAY_PERIOD_INVALID"

      - name: err_value_out_of_range_for_cadence_below_minimum_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_VALUE_OUT_OF_RANGE]", "validations[priority=62]", "global_constants.CADENCE_MIN_DAYS"]
        distinguishing_aspect: "cadence_days is bounded to [3, 30]; a value of 2 returns 400 ERR_VALUE_OUT_OF_RANGE and the away period is not created."
        test_recipe:
          setup: ["One Owner and one Property."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Fast Cad", email: "fast.cad@example.com", phone: "+15550705", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Fast House", address_line: "3 Min St", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /property-care/away-periods"
              payload: { property_id: "${prop_id}", owner_id: "${owner_id}", start_at: "2026-07-01T00:00:00Z", end_at: "2026-08-01T00:00:00Z", cadence_days: 2 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_VALUE_OUT_OF_RANGE"

      - name: err_hold_too_long_on_create_beyond_thirty_days_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOLD_TOO_LONG]", "validations[priority=66]", "global_constants.MAIL_HOLD_MAX_DAYS"]
        distinguishing_aspect: "A mail hold whose span is 40 days exceeds MAIL_HOLD_MAX_DAYS (30) at create time and returns 400 ERR_HOLD_TOO_LONG; the absolute 60-day cap only governs extensions."
        test_recipe:
          setup: ["One Owner and one Property."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Big Hold", email: "big.hold@example.com", phone: "+15550706", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Hold House", address_line: "30 Cap Ct", state_code: "FL", travel_distance_miles: 5.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /property-care/properties/${prop_id}/mail-holds"
              payload: { start_on: "2026-06-01T00:00:00Z", end_on: "2026-07-11T00:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_HOLD_TOO_LONG"
            - "GET /property-care/mail-holds with property_id ${prop_id} returns total_count == 0"

      - name: err_template_type_mismatch_when_template_visit_type_differs_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_TEMPLATE_TYPE_MISMATCH]", "validations[priority=67]", "entities.ChecklistTemplate.fields.visit_type"]
        distinguishing_aspect: "Binding a STORM_SECURE template to a ROUTINE_WATCH visit returns 400 ERR_TEMPLATE_TYPE_MISMATCH; the template resolves fine, so this is a payload-consistency failure, not a 404."
        test_recipe:
          setup: ["An ACTIVE STANDARD subscription and a STORM_SECURE template."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /property-care/owners"
              payload: { full_name: "Mix Tmpl", email: "mix.tmpl@example.com", phone: "+15550707", primary_residence_state: "MN" }
              as: PlatformAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /property-care/properties"
              payload: { owner_id: "${owner_id}", label: "Mix House", address_line: "67 Type Tce", state_code: "FL", travel_distance_miles: 18.0 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "STORM_SECURE", version_label: "2026.1", item_codes: ["SHUTTERS"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
          trigger:
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-02T13:00:00Z", scheduled_end_at: "2026-06-02T15:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and data.error_id == ERR_TEMPLATE_TYPE_MISMATCH"
            - "GET /property-care/visits with property_id ${prop_id} returns total_count == 0"

      - name: err_line_sign_invalid_for_positive_guarantee_credit_returns_400
        claim_type: violation_to_error
        grounds: ["errors[ERR_LINE_SIGN_INVALID]", "validations[priority=68]", "entities.InvoiceLine.fields.amount_cents"]
        distinguishing_aspect: "A GUARANTEE_CREDIT line with a positive amount_cents violates the sign rule and returns 400 ERR_LINE_SIGN_INVALID; the invoice keeps exactly one ACTIVE line."
        test_recipe:
          setup: ["A DRAFT invoice seeded with its 19986 subscription-fee line."]
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
