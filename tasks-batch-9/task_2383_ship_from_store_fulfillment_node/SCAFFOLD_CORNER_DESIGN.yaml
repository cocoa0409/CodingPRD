          - roles.StoreAssociate.identity
          - errors.ERR_STORE_SCOPE_VIOLATION
          - validations.priority 6
        distinguishing_aspect: "The two associates are peers, not a hierarchy: S1's associate is refused on all three of S2's write routes - an assignment it does not own, an inventory row it does not own and a packaging row it does not own - yet the very same identity reads all three rows successfully, and S2's own associate then performs the write that S1 was refused."
