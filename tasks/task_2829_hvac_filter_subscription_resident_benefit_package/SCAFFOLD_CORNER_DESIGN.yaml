      - name: claim_revision_loop_terminates_at_the_declared_round_cap
        claim_type: cyclic
        grounds: [state_machines.Claim.UNDER_REVIEW_to_INFO_REQUESTED, validations.priority_24]
        distinguishing_aspect: "The bounded UNDER_REVIEW <-> INFO_REQUESTED loop and its MAX_INFO_REQUEST_ROUNDS 2 cap."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / claim_info_request_revision_loop_bounded_at_two_rounds"
          rationale: "That §1.8 instance already drives the loop through both permitted rounds, asserts info_request_round after each, shows the provisional freeze surviving every iteration, and asserts ERR_INFO_REQUEST_LIMIT on the third request. A second corner test would only restate it."

      - name: subscription_status_and_posture_move_independently
        claim_type: parallel
        grounds: [complexity_profile.state_machine_shape, state_machines.Subscription.status, state_machines.Subscription.installation_posture]
        distinguishing_aspect: "The two state dimensions on one Subscription row advance without constraining each other, and the combined cell is correct after each step."
        excluded_because:
          difficulty_instance: "non_linear_state_machine / subscription_two_dimensions_advance_independently_through_both_cycles"
          rationale: "That §1.8 instance walks both cycles interleaved and asserts the combined (status, installation_posture) cell after every transition, including the (SUSPENDED, NON_INSTALL_CONFIRMED) combination no single-dimension test can reach."

      - name: property_suspend_cascade_skips_children_in_the_wrong_state
        claim_type: conditional_cascade
        grounds: [state_machines.Property.ACTIVE_to_SUSPENDED, state_machines.BenefitEntitlement.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "The suspend cascade suspends only the two rider benefit_codes and only SCHEDULED shipments, leaving other children untouched."
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_b_property_suspend_reaches_shipments_and_entitlements_conditionally"
          rationale: "That §1.8 instance already asserts the per-child selectivity end-to-end: CREDIT_REPORTING stays ACTIVE, a DELIVERED shipment is untouched while the SCHEDULED one is cancelled, and suspended_by_property_event is set only on the rows the reactivate leg must restore."

