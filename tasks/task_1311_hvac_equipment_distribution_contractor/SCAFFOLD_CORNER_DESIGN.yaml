      - name: training_credit_lazy_expiry_and_fifo_consumption
        claim_type: boundary_edge
        grounds: [calculations.training_credit_expiry]
        distinguishing_aspect: "Credits expire lazily at expires_at (earned_at + 24 months): credits earned 2026-08-02 expire 2028-08-02; at clock 2028-08-02T00:00:00Z both credits are EXPIRED (expires_at <= clock boundary, inclusive) and the balance drops to 0."
        test_recipe:
