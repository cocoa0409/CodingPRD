  - name: calling_window_policy_periods_reject_overlap_but_allow_adjacency
    grounds:
    - validations[priority=101]
    - errors[ERR_POLICY_PERIOD_OVERLAP]
    - calculations.policy_selector
    - state_machines.CallingWindowPolicy.ACTIVE_to_SUPERSEDED
    - entities.CallingWindowPolicy.fields.supersedes_policy_id
    distinguishing_aspect: Resource = CallingWindowPolicy per state, interval semantics = half-open effective periods where a zero-gap adjacent period is legal (unlike the Contact cooldown buffer) while any interior overlap is rejected unless the new policy supersedes the old one.
    test_recipe:
      setup:
      - clock 2026-08-03T00:00:00Z
      - one ACTIVE CA policy effective 2026-07-01T00:00:00Z -> 2027-01-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
          holiday_dates: []
        as: PlatformAdmin
        captures:
          pol1_id: $.data.id
      trigger:
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 09:00
          window_end_local: '20:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-06-01T00:00:00Z'
          holiday_dates: []
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 09:00
          window_end_local: '20:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2027-01-01T00:00:00Z'
          effective_to: '2027-07-01T00:00:00Z'
          holiday_dates: []
        as: PlatformAdmin
        captures:
          pol2_id: $.data.id
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 09:00
          window_end_local: '20:00'
          recording_consent_regime: ALL_PARTY
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
          holiday_dates: []
          supersedes_policy_id: ${pol1_id}
        as: PlatformAdmin
        captures:
          pol3_id: $.data.id
      assert:
      - the first trigger call returns 409 with data.error_id == "ERR_POLICY_PERIOD_OVERLAP" (2026-09-01 sits inside 2026-07-01 -> 2027-01-01)
      - CallingWindowPolicy.${pol2_id}.status == ACTIVE (effective_from 2027-01-01 equals the incumbent's effective_to, a legal zero-gap adjacency under half-open periods)
      - CallingWindowPolicy.${pol3_id}.status == ACTIVE with window_start_minutes == 540 and window_end_minutes == 1200
      - CallingWindowPolicy.${pol1_id}.status == SUPERSEDED with effective_to == "2026-09-01T00:00:00.000Z"
      - GET /compliance/calling-window-policies?state_code=CA&status=ACTIVE returns total_count == 2 (${pol2_id} and ${pol3_id})
