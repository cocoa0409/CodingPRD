scenario: |
  Wood Treating & Pressure-Treatment Plant (treated lumber plant): charge build by retention/use category, preservative solution assay & re-dose, cylinder cycle & penetration assay, incising & post-treatment drip pad, quality agency inspection & re-treat, tagging/end-plate & warranty registration, hazardous drippage containment, custom-treat customer material

domain_name: wood-treating-plant
api_prefix: /treatment-plants

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: TreatmentPlant
    parent: null
    common_fields: true
    fields:
      - { name: plant_name, type: string, source: input, description: "Registered plant name" }
      - { name: alsc_license_number, type: string, source: input, description: "ALSC agency license number" }
      - { name: compliance_score, type: integer, source: computed, default: 1000, description: "Compliance score; starts at 1000, floors at 0" }
      - { name: hazardous_waste_liability_cents, type: integer, source: computed, default: 0, description: "Cumulative liability ledger from containment events" }
      - { name: status, type: enum, source: system, description: "LICENSED → SUSPENDED → REVOKED" }

  - name: TreatmentCylinder
    parent: TreatmentPlant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> TreatmentPlant.id; owning plant" }
      - { name: cylinder_code, type: string, source: input, description: "Physical cylinder label (CYL-1, CYL-2, ...)" }
      - { name: max_volume_mbf, type: number, source: input, description: "Cylinder capacity in thousand board-feet" }
      - { name: supported_process_types, type: array, source: input, description: "FULL_CELL | LOWRY | RUEPING | SAP_DISPLACEMENT" }
      - { name: status, type: enum, source: system, description: "IDLE → LOADED → CYCLE_RUNNING → DRAINING → NEEDS_CLEANING → DECOMMISSIONED" }

  - name: PreservativeConcentrate
    parent: TreatmentPlant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> TreatmentPlant.id; owning plant" }
      - { name: chemical_family, type: enum, source: input, description: "CCA | ACQ | CA | CREOSOTE | PENTA" }
      - { name: concentrate_assay_pct, type: number, source: input, description: "Active ingredient concentration percent (0..100)" }
      - { name: inventory_gallons, type: number, source: computed, default: 0, description: "Current bulk tank gallons" }
      - { name: min_working_assay_pct, type: number, source: input, description: "Minimum assay required to run a cycle" }
      - { name: status, type: enum, source: system, description: "IN_STOCK → LOW_STOCK → QUARANTINED → DEPLETED" }

  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: customer_name, type: string, source: input, description: "Customer legal name" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit cap for custom-treat work" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Running receivable; debited at warranty registration" }
      - { name: status, type: enum, source: system, description: "ACTIVE → CREDIT_HOLD → CLOSED" }

  - name: Charge
    parent: TreatmentCylinder
    common_fields: true
    fields:
      - { name: cylinder_id, type: string, source: system, description: "FK -> TreatmentCylinder.id; cylinder the charge occupies" }
      - { name: customer_id, type: string, source: input, description: "FK -> CustomerAccount.id; null for plant-owned stock" }
      - { name: ownership_type, type: enum, source: input, description: "PLANT_STOCK | CUSTOM_TREAT" }
      - { name: species_group, type: enum, source: input, description: "SPF | SYP | DOUGLAS_FIR | HEM_FIR | PONDEROSA_PINE" }
      - { name: use_category, type: enum, source: input, description: "UC3B | UC4A | UC4B | UC4C — drives retention target" }
      - { name: volume_mbf, type: number, source: input, description: "Thousand board-feet in charge" }
      - { name: target_retention_pcf, type: number, source: computed, description: "Required retention (pcf) from use_category lookup" }
      - { name: provisional_retention_pcf, type: number, source: computed, default: 0, description: "Estimated retention computed at cycle end (forward_looking)" }
      - { name: final_retention_pcf, type: number, source: computed, default: 0, description: "Assay-verified retention (chronological)" }
      - { name: requires_incising, type: boolean, source: computed, description: "True when species_group in {DOUGLAS_FIR, HEM_FIR} AND use_category in {UC4B, UC4C}" }
      - { name: status, type: enum, source: system, description: "STAGED → IN_CYLINDER → CYCLE_COMPLETE → ASSAYED_PASS | ASSAYED_FAIL → RE_TREAT_PENDING → TAGGED → RELEASED / REJECTED / SCRAPPED" }
      - { name: is_custom_treat, type: boolean, source: computed, description: "ownership_type == CUSTOM_TREAT" }
      - { name: hazard_containment_flag, type: boolean, source: computed, default: false, description: "Set true if any containment event linked" }

  - name: ChargePiece
    parent: Charge
    common_fields: true
    fields:
      - { name: charge_id, type: string, source: system, description: "FK -> Charge.id; parent charge" }
      - { name: piece_tag, type: string, source: input, description: "Yard tally tag" }
      - { name: length_ft, type: number, source: input, description: "Nominal length" }
      - { name: width_in, type: number, source: input, description: "Nominal width" }
      - { name: thickness_in, type: number, source: input, description: "Nominal thickness" }
      - { name: penetration_pct, type: number, source: computed, default: 0, description: "Assay penetration percentage" }
      - { name: incised, type: boolean, source: computed, default: false, description: "Set true after incising op" }
      - { name: status, type: enum, source: system, description: "RAW → INCISED → TREATED → ASSAYED_PASS → ASSAYED_FAIL → TAGGED → RELEASED / SCRAPPED" }

  - name: TreatmentCycle
    parent: Charge
    common_fields: true
    fields:
      - { name: charge_id, type: string, source: system, description: "FK -> Charge.id; parent charge" }
      - { name: cycle_number, type: integer, source: computed, description: "Ordinal of cycle for this charge (1 for initial, 2+ for re-treats)" }
      - { name: process_type, type: enum, source: input, description: "FULL_CELL | LOWRY | RUEPING | SAP_DISPLACEMENT" }
      - { name: preservative_id, type: string, source: input, description: "FK -> PreservativeConcentrate.id; chemical used" }
      - { name: vacuum_inhg, type: number, source: input, description: "Initial vacuum level in inHg" }
      - { name: pressure_psi, type: number, source: input, description: "Peak pressure in PSI" }
      - { name: pressure_minutes, type: integer, source: input, description: "Hold time at pressure" }
      - { name: solution_assay_at_start_pct, type: number, source: computed, description: "Working-solution assay recorded when cycle starts" }
      - { name: gross_absorption_pcf, type: number, source: computed, default: 0, description: "Solution uptake per cubic foot of wood" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → RUNNING → DRAINING → COMPLETE / ABORTED" }

  - name: RetentionAssay
    parent: Charge
    common_fields: false
    fields:
      - { name: charge_id, type: string, source: system, description: "FK -> Charge.id; parent charge" }
      - { name: cycle_id, type: string, source: input, description: "FK -> TreatmentCycle.id; cycle being assayed" }
      - { name: assay_method, type: enum, source: input, description: "XYLENE_EXTRACTION | ASHING | TITRATION" }
      - { name: sample_count, type: integer, source: input, description: "Number of core samples taken" }
      - { name: mean_retention_pcf, type: number, source: input, description: "Measured mean retention across samples" }
      - { name: min_sample_retention_pcf, type: number, source: input, description: "Lowest individual sample retention" }
      - { name: recorded_by_agency, type: enum, source: input, description: "PLANT_LAB | THIRD_PARTY_AGENCY" }
      - { name: pass_threshold_pcf, type: number, source: computed, description: "target_retention_pcf * 0.90" }
      - { name: outcome, type: enum, source: computed, description: "PASS | FAIL_MARGINAL | FAIL_GROSS — derived by assay_outcome_rule" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp when assay was recorded" }

  - name: QualityInspection
    parent: TreatmentPlant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> TreatmentPlant.id; plant being inspected" }
      - { name: agency_code, type: enum, source: input, description: "ALSC | SPIB | TPI | WCLIB" }
      - { name: inspection_window_start, type: datetime, source: input, description: "Inspection window start" }
      - { name: inspection_window_end, type: datetime, source: input, description: "Inspection window end (must be > start)" }
      - { name: charges_in_scope, type: array, source: input, description: "List of charge ids the agency sampled" }
      - { name: findings_count, type: integer, source: input, default: 0, description: "Number of nonconformances cited" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → IN_PROGRESS → FINDINGS_ISSUED → CLOSED_PASS | CLOSED_FAIL" }

  - name: DripPadLog
    parent: Charge
    common_fields: false
    fields:
      - { name: charge_id, type: string, source: system, description: "FK -> Charge.id; charge being dried" }
      - { name: pad_code, type: string, source: input, description: "Drip pad identifier" }
      - { name: entered_pad_at, type: datetime, source: input, description: "When charge entered pad" }
      - { name: exited_pad_at, type: datetime, source: input, description: "When charge left pad (must be > entered)" }
      - { name: drip_volume_liters, type: number, source: input, description: "Recovered drippage volume" }
      - { name: containment_breach, type: boolean, source: input, default: false, description: "True if drippage escaped pad containment" }
      - { name: liability_cents, type: integer, source: computed, default: 0, description: "Computed remediation charge posted to plant ledger" }

  - name: WarrantyRegistration
    parent: Charge
    common_fields: true
    fields:
      - { name: charge_id, type: string, source: system, description: "FK -> Charge.id; tagged charge being registered" }
      - { name: registered_by_user_id, type: string, source: input, description: "PlantOperator user id who registered" }
      - { name: warranty_term_years, type: integer, source: input, description: "Warranty length (5, 25, or 50)" }
      - { name: registration_fee_cents, type: integer, source: computed, description: "Fee = base by use_category + custom-treat uplift; computed at registration" }
      - { name: status, type: enum, source: system, description: "ACTIVE → VOIDED_BY_RETREAT | LAPSED" }

  - name: CylinderScheduleSlot
    parent: TreatmentCylinder
    common_fields: false
    fields:
      - { name: cylinder_id, type: string, source: system, description: "FK -> TreatmentCylinder.id; cylinder the slot reserves" }
      - { name: charge_id, type: string, source: input, description: "FK -> Charge.id; charge occupying the slot" }
      - { name: slot_start, type: datetime, source: input, description: "Slot window start (UTC)" }
      - { name: slot_end, type: datetime, source: input, description: "Slot window end (UTC, must be > slot_start)" }
      - { name: slot_kind, type: enum, source: input, description: "TREATMENT | CLEANING | MAINTENANCE" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Required turnover buffer appended after slot_end" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TreatmentPlant
    initial_state: LICENSED
    terminal_states: [REVOKED]
    transitions:
      - from: LICENSED
        to: SUSPENDED
        trigger: POST /treatment-plants/{plantId}/suspend
        actor: ComplianceOfficer
        preconditions:
          - "compliance_score <= SUSPEND_THRESHOLD (300) OR a CRITICAL-severity QualityInspection is in FINDINGS_ISSUED"
        side_effects:
          - "All IDLE cylinders unaffected; all LOADED / CYCLE_RUNNING cylinders frozen (no new cycles may start)"
          - "All SCHEDULED QualityInspections remain but cannot transition IN_PROGRESS until re-licensed"
      - from: SUSPENDED
        to: LICENSED
        trigger: POST /treatment-plants/{plantId}/reinstate
        actor: ComplianceOfficer
        preconditions:
          - "All open QualityInspections are in CLOSED_PASS"
          - "hazardous_waste_liability_cents has been settled to zero via POST /treatment-plants/{plantId}/settle-liability"
        side_effects:
          - "Cylinder freeze lifted"
      - from: SUSPENDED
        to: REVOKED
        trigger: POST /treatment-plants/{plantId}/revoke
        actor: ComplianceOfficer
        preconditions:
          - "compliance_score == 0"
        side_effects:
          - "All cylinders → DECOMMISSIONED (terminal)"
          - "All non-terminal Charges → SCRAPPED"

  - entity: TreatmentCylinder
    initial_state: IDLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IDLE
        to: LOADED
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/charges
        actor: PlantOperator
        preconditions:
          - "Cylinder.status == IDLE"
          - "Plant.status == LICENSED"
          - "CylinderScheduleSlot for [now, now + estimated cycle] exists, slot_kind == TREATMENT, charge_id matches new charge"
        side_effects:
          - "Cylinder.volume consumed; new Charge.status = IN_CYLINDER"
      - from: LOADED
        to: CYCLE_RUNNING
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles
        actor: PlantOperator
        preconditions:
          - "Cylinder.status == LOADED"
          - "PreservativeConcentrate.status == IN_STOCK"
          - "PreservativeConcentrate.concentrate_assay_pct >= min_working_assay_pct (else ERR_ASSAY_BELOW_WORKING_MINIMUM)"
        side_effects:
          - "TreatmentCycle.status = RUNNING"
          - "solution_assay_at_start_pct snapshot from concentrate"
      - from: CYCLE_RUNNING
        to: DRAINING
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles/{cycleId}/begin-drain
        actor: PlantOperator
        preconditions:
          - "TreatmentCycle.status == RUNNING"
        side_effects:
          - "TreatmentCycle.status = DRAINING"
      - from: DRAINING
        to: NEEDS_CLEANING
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles/{cycleId}/complete
        actor: PlantOperator
        preconditions:
          - "TreatmentCycle.status == DRAINING"
        side_effects:
          - "TreatmentCycle.status = COMPLETE; gross_absorption_pcf computed"
          - "Charge.status = CYCLE_COMPLETE; provisional_retention_pcf computed (forward_looking variant)"
          - "Cylinder NEEDS_CLEANING — must transition back to IDLE via cleaning before next load"
      - from: NEEDS_CLEANING
        to: IDLE
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/mark-cleaned
        actor: PlantOperator
        preconditions:
          - "Cylinder.status == NEEDS_CLEANING"
        side_effects:
          - "CylinderScheduleSlot (CLEANING) closed"
      - from: IDLE
        to: DECOMMISSIONED
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/decommission
        actor: PlantOperator
        preconditions:
          - "Cylinder.status == IDLE"
          - "No future CylinderScheduleSlot with slot_end > now"
        side_effects: []

  - entity: PreservativeConcentrate
    initial_state: IN_STOCK
    terminal_states: [DEPLETED]
    transitions:
      - from: IN_STOCK
        to: LOW_STOCK
        trigger: "system (automatic when inventory_gallons < LOW_STOCK_GALLONS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOW_STOCK
        to: IN_STOCK
        trigger: "system (automatic when replenished above threshold)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_STOCK
        to: QUARANTINED
        trigger: POST /treatment-plants/{plantId}/preservatives/{preservativeId}/quarantine
        actor: LabTechnician
        preconditions:
          - "assay drift detected (concentrate_assay_pct < min_working_assay_pct after re-assay) OR contamination"
        side_effects:
          - "Any SCHEDULED TreatmentCycle referencing this preservative is blocked with ERR_PRESERVATIVE_QUARANTINED at start"
      - from: QUARANTINED
        to: IN_STOCK
        trigger: POST /treatment-plants/{plantId}/preservatives/{preservativeId}/release-quarantine
        actor: LabTechnician
        preconditions:
          - "Re-assay confirms concentrate_assay_pct >= min_working_assay_pct"
        side_effects: []
      - from: LOW_STOCK
        to: DEPLETED
        trigger: "system (automatic when inventory_gallons == 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CustomerAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CREDIT_HOLD
        trigger: "system (automatic when outstanding_balance_cents > credit_limit_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "New custom-treat Charge creation rejected with ERR_CUSTOMER_CREDIT_HOLD"
      - from: CREDIT_HOLD
        to: ACTIVE
        trigger: POST /customers/{customerId}/record-payment
        actor: AccountsReceivable
        preconditions:
          - "outstanding_balance_cents after payment <= credit_limit_cents"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: POST /customers/{customerId}/close
        actor: AccountsReceivable
        preconditions:
          - "outstanding_balance_cents == 0"
          - "No non-terminal Charge references this customer"
        side_effects: []

  - entity: Charge
    initial_state: STAGED
    terminal_states: [RELEASED, REJECTED, SCRAPPED]
    transitions:
      - from: STAGED
        to: IN_CYLINDER
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/charges
        actor: PlantOperator
        preconditions:
          - "volume_mbf <= cylinder.max_volume_mbf - current loaded mbf"
          - "If ownership_type == CUSTOM_TREAT: CustomerAccount.status == ACTIVE"
          - "Cylinder.status == IDLE"
        side_effects:
          - "Cylinder → LOADED"
          - "ChargePiece rows auto-created from input manifest"
      - from: IN_CYLINDER
        to: CYCLE_COMPLETE
        trigger: "system (when TreatmentCycle completes)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_retention_pcf computed (forward_looking formula using gross_absorption_pcf * solution_assay_at_start_pct / 100)"
      - from: CYCLE_COMPLETE
        to: ASSAYED_PASS
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/retention-assays
        actor: LabTechnician
        preconditions:
          - "assay outcome == PASS (mean_retention_pcf >= target_retention_pcf AND min_sample_retention_pcf >= pass_threshold_pcf)"
        side_effects:
          - "final_retention_pcf = mean_retention_pcf"
      - from: CYCLE_COMPLETE
        to: ASSAYED_FAIL
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/retention-assays
        actor: LabTechnician
        preconditions:
          - "assay outcome == FAIL_MARGINAL or FAIL_GROSS"
        side_effects:
          - "final_retention_pcf = mean_retention_pcf"
      - from: ASSAYED_FAIL
        to: RE_TREAT_PENDING
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/order-retreat
        actor: QualityManager
        preconditions:
          - "outcome of last RetentionAssay was FAIL_MARGINAL (FAIL_GROSS may not be re-treated and must be SCRAPPED)"
          - "Plant.status == LICENSED"
        side_effects:
          - "All ACTIVE WarrantyRegistrations for charge → VOIDED_BY_RETREAT"
          - "Charge.version incremented"
      - from: RE_TREAT_PENDING
        to: IN_CYLINDER
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles (new cycle_number = previous + 1)
        actor: PlantOperator
        preconditions:
          - "CylinderScheduleSlot for re-treat exists"
        side_effects:
          - "New TreatmentCycle with cycle_number = prior + 1"
      - from: ASSAYED_PASS
        to: TAGGED
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/tag
        actor: PlantOperator
        preconditions:
          - "If requires_incising == true, all pieces must have incised == true (else ERR_INCISING_REQUIRED)"
          - "DripPadLog entry exists with containment_breach == false (else ERR_DRIP_PAD_CONTAINMENT_BREACH)"
        side_effects:
          - "Each ChargePiece.status → TAGGED"
      - from: TAGGED
        to: RELEASED
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/warranty-registrations
        actor: PlantOperator
        preconditions:
          - "If is_custom_treat: CustomerAccount.status == ACTIVE AND registration fee posts"
        side_effects:
          - "Charge → RELEASED"
          - "Each ChargePiece.status → RELEASED"
          - "For CUSTOM_TREAT: CustomerAccount.outstanding_balance_cents += registration_fee_cents"
      - from: CYCLE_COMPLETE
        to: REJECTED
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/reject
        actor: QualityManager
        preconditions:
          - "A CRITICAL finding from QualityInspection cites this charge"
        side_effects:
          - "Cylinder (if still loaded) → NEEDS_CLEANING"
      - from: RE_TREAT_PENDING
        to: SCRAPPED
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/scrap
        actor: QualityManager
        preconditions:
          - "outcome of last RetentionAssay was FAIL_GROSS OR re-treat cycle count exhausted (cycle_number >= 3)"
        side_effects:
          - "hazardous_waste_liability_cents += scrap_cost"

  - entity: ChargePiece
    initial_state: RAW
    terminal_states: [RELEASED, SCRAPPED]
    transitions:
      - from: RAW
        to: INCISED
        trigger: POST /treatment-plants/{plantId}/charges/{chargeId}/pieces/{pieceId}/incise
        actor: PlantOperator
        preconditions:
          - "Parent Charge.status == STAGED or IN_CYLINDER"
          - "Parent Charge.requires_incising == true"
        side_effects:
          - "incised = true"
      - from: RAW
        to: TREATED
        trigger: "system (when parent Charge transitions to CYCLE_COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INCISED
        to: TREATED
        trigger: "system (when parent Charge transitions to CYCLE_COMPLETE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TREATED
        to: ASSAYED_PASS
        trigger: "system (when parent Charge → ASSAYED_PASS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TREATED
        to: ASSAYED_FAIL
        trigger: "system (when parent Charge → ASSAYED_FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSAYED_PASS
        to: TAGGED
        trigger: "system (when parent Charge → TAGGED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TAGGED
        to: RELEASED
        trigger: "system (when parent Charge → RELEASED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ASSAYED_FAIL
        to: SCRAPPED
        trigger: "system (when parent Charge → SCRAPPED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TreatmentCycle
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, ABORTED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles/{cycleId}/start
        actor: PlantOperator
        preconditions:
          - "Cylinder.status == LOADED"
          - "PreservativeConcentrate.status == IN_STOCK"
          - "PreservativeConcentrate.concentrate_assay_pct >= min_working_assay_pct"
        side_effects:
          - "PreservativeConcentrate.inventory_gallons -= estimated_consumption"
          - "Cylinder → CYCLE_RUNNING"
      - from: RUNNING
        to: DRAINING
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles/{cycleId}/begin-drain
        actor: PlantOperator
        preconditions: []
        side_effects: []
      - from: DRAINING
        to: COMPLETE
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles/{cycleId}/complete
        actor: PlantOperator
        preconditions: []
        side_effects:
          - "Cylinder → NEEDS_CLEANING"
          - "Parent Charge → CYCLE_COMPLETE"
      - from: RUNNING
        to: ABORTED
        trigger: POST /treatment-plants/{plantId}/cylinders/{cylinderId}/cycles/{cycleId}/abort
        actor: PlantOperator
        preconditions:
          - "Recorded abort_reason"
        side_effects:
          - "Cylinder → NEEDS_CLEANING"
          - "Parent Charge remains IN_CYLINDER"
          - "consumed preservative is NOT refunded"

  - entity: QualityInspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASS, CLOSED_FAIL]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /treatment-plants/{plantId}/inspections/{inspectionId}/begin
        actor: QualityAgencyInspector
        preconditions:
          - "Plant.status == LICENSED"
          - "now within [inspection_window_start, inspection_window_end]"
        side_effects: []
      - from: IN_PROGRESS
        to: FINDINGS_ISSUED
        trigger: POST /treatment-plants/{plantId}/inspections/{inspectionId}/issue-findings
        actor: QualityAgencyInspector
        preconditions:
          - "findings_count >= 0 recorded"
        side_effects:
          - "If severity == CRITICAL: Plant.compliance_score -= 200; if severity == MAJOR: -= 100; if MINOR: -= 25"
          - "If severity == CRITICAL: each charge_id in charges_in_scope may transition to REJECTED"
      - from: FINDINGS_ISSUED
        to: CLOSED_PASS
        trigger: POST /treatment-plants/{plantId}/inspections/{inspectionId}/close
        actor: QualityAgencyInspector
        preconditions:
          - "Plant remediation accepted"
        side_effects: []
      - from: FINDINGS_ISSUED
        to: CLOSED_FAIL
        trigger: POST /treatment-plants/{plantId}/inspections/{inspectionId}/close
        actor: QualityAgencyInspector
        preconditions:
          - "Plant remediation rejected"
        side_effects:
          - "If Plant.compliance_score <= 300: Plant → SUSPENDED"

  - entity: WarrantyRegistration
    initial_state: ACTIVE
    terminal_states: [VOIDED_BY_RETREAT, LAPSED]
    transitions:
      - from: ACTIVE
        to: VOIDED_BY_RETREAT
        trigger: "system (when Charge transitions ASSAYED_FAIL → RE_TREAT_PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "system (when warranty_term_years elapse from registration date)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Table 2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: charge-retreat-stale-version
    parent_entity: Charge
    write_endpoint: "POST /treatment-plants/{plantId}/charges/{chargeId}/order-retreat"
    occ_field: "expected_charge_version"
    description: |
      Ordering a re-treat against a Charge whose version has advanced since the
      QualityManager last observed it is rejected with ERR_STALE_VERSION. This
      captures the case where a concurrent tag operation (which legitimately
      finalizes retention and bumps version) has made the re-treat stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: warranty-register-stale-charge
    parent_entity: Charge
    write_endpoint: "POST /treatment-plants/{plantId}/charges/{chargeId}/warranty-registrations"
    occ_field: "expected_charge_version"
    description: |
      Registering a warranty against a Charge whose version has advanced is
      rejected with ERR_STALE_VERSION. The version advances whenever a
      retention assay is recorded, a re-treat is ordered, or a tag is applied,
      any of which invalidates prior warranty calculations.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_retention_calc
    trigger: "TreatmentCycle transitions DRAINING → COMPLETE"
    algorithm: forward_looking
    formula: |
      provisional_retention_pcf =
        gross_absorption_pcf * (solution_assay_at_start_pct / 100) * species_penetration_factor
      where species_penetration_factor:
        SPF = 0.85, SYP = 0.92, DOUGLAS_FIR = 0.65 (0.95 if incised),
        HEM_FIR = 0.72 (0.93 if incised), PONDEROSA_PINE = 0.78
      Rounding: round to 3 decimal places, half_up, AFTER multiplying all factors.
    input_set: "Single TreatmentCycle row that just completed; uses parent Charge's species_group and requires_incising; uses piece-level incised flag"
    constants:
      SPF_FACTOR: 0.85
      SYP_FACTOR: 0.92
      DOUGLAS_FIR_FACTOR: 0.65
      DOUGLAS_FIR_INCISED_FACTOR: 0.95
      HEM_FIR_FACTOR: 0.72
      HEM_FIR_INCISED_FACTOR: 0.93
      PONDEROSA_PINE_FACTOR: 0.78
    precision: "3 decimal places, round_half_up after all multiplications"
    variants:
      - name: incised_adjustment
        when: "parent Charge.requires_incising == true AND piece.incised == true"
        difference: "uses the higher incised factor for that piece's contribution to charge-level average"

  - name: final_retention_calc
    trigger: "RetentionAssay recorded (charge transitions CYCLE_COMPLETE → ASSAYED_*)"
    algorithm: chronological
    formula: |
      final_retention_pcf = mean_retention_pcf (input), BUT re-computed per
      piece as a weighted mean by piece volume:
        sum(piece_retention_pcf_i * piece_volume_cuft_i) / sum(piece_volume_cuft_i)
      where piece_volume_cuft_i = (length_ft * width_in * thickness_in) / 12
      and piece_retention_pcf_i = mean_retention_pcf * (incised ? incised_factor : base_factor) / species_factor_avg
      Rounding: round each piece contribution to 4 decimals first, then sum,
      then round the final ratio to 3 decimals half_up. (Order matters —
      rounding per-piece first differs from summing then rounding.)
    input_set: "All ChargePiece rows of the parent Charge in order of piece.created_at ASC (oldest first); exclude pieces with status == SCRAPPED"
    constants: {}
    precision: "per-piece 4 decimals, then final ratio 3 decimals, round_half_up"
    variants:
      - name: marginal_fail_divergence
        when: "assay outcome is FAIL_MARGINAL"
        difference: "provisional vs final diverge by >= 0.05 pcf due to per-piece rounding order and incised adjustments"

  - name: registration_fee_calc
    trigger: "WarrantyRegistration creation (Charge TAGGED → RELEASED)"
    algorithm: tiered_pricing
    formula: |
      base_fee_cents by use_category:
        UC3B: 1500, UC4A: 3200, UC4B: 5800, UC4C: 9100
      volume_discount_tiers on volume_mbf:
        tier 1 (0..10 mbf): no discount
        tier 2 (10..50 mbf]: 5% off base
        tier 3 (> 50 mbf): 12% off base
      custom_treat_uplift: +18% on top of discounted base if is_custom_treat
      warranty_term_multiplier: 5yr = 1.00, 25yr = 1.45, 50yr = 1.95
      registration_fee_cents =
        round_half_up(base_fee * (1 - volume_discount) * (1 + custom_uplift) * term_multiplier, 0)
      Apply discounts in this pinned order: base → volume_discount → custom_uplift → term_multiplier.
      (Multiplying in a different order produces different cents due to sequential rounding.)
    input_set: "Single Charge row being released"
    constants:
      UC3B_BASE: 1500
      UC4A_BASE: 3200
      UC4B_BASE: 5800
      UC4C_BASE: 9100
      TIER2_DISCOUNT: 0.05
      TIER3_DISCOUNT: 0.12
      CUSTOM_TREAT_UPLIFT: 0.18
      TERM_5YR: 1.00
      TERM_25YR: 1.45
      TERM_50YR: 1.95
    precision: "integer cents, round_half_up at each multiplication step"

  - name: hazard_liability_calc
    trigger: "DripPadLog creation with containment_breach == true, or Charge → SCRAPPED"
    algorithm: threshold
    formula: |
      If containment_breach:
        liability_cents = round_half_up(drip_volume_liters * 250, 0)  # $2.50/L
        If drip_volume_liters > BREACH_THRESHOLD_LITERS (50):
          liability_cents += CRITICAL_BREACH_SURCHARGE_CENTS (250000)
          Plant.compliance_score -= 50
      If Charge → SCRAPPED:
        liability_cents += volume_mbf * 75000  # $750 per mbf disposal
        Plant.compliance_score -= 100
      Floor: Plant.compliance_score >= 0 (clamped).
    input_set: "DripPadLog row being created OR Charge being scrapped"
    constants:
      PER_LITER_RATE_CENTS: 250
      BREACH_THRESHOLD_LITERS: 50
      CRITICAL_BREACH_SURCHARGE_CENTS: 250000
      SCRAP_DISPOSAL_PER_MBF_CENTS: 75000
      COMPLIANCE_BREACH_PENALTY: 50
      COMPLIANCE_SCRAP_PENALTY: 100
    precision: "integer cents, round_half_up"

  - name: cylinder_capacity_check
    trigger: "Charge STAGED → IN_CYLINDER"
    algorithm: aggregation
    formula: |
      current_loaded_mbf = sum(charge.volume_mbf) for charges in this cylinder
        with status in {IN_CYLINDER, CYCLE_COMPLETE} (i.e., physically present)
      Reject if current_loaded_mbf + new_charge.volume_mbf > cylinder.max_volume_mbf
      Boundary: == max is ALLOWED (<= comparison); only strictly greater is rejected.
    input_set: "All Charge rows for this cylinder with status in {IN_CYLINDER, CYCLE_COMPLETE}; ordered by created_at ASC for determinism"
    constants: {}
    precision: "exact float comparison; no rounding"

  - name: slot_overlap_check
    trigger: "CylinderScheduleSlot creation"
    algorithm: interval_merge
    formula: |
      For new slot [s_new, e_new) with buffer b_new:
        effective_new = [s_new, e_new + b_new minutes)
      For each existing slot on same cylinder:
        effective_existing = [s_i, e_i + b_i minutes)
      Conflict if effective_new overlaps effective_existing (half-open semantics:
        intersection non-empty means s_new < e_i_eff AND s_i < e_new_eff).
      Adjacency (s_new == e_i_eff) is ALLOWED (not a conflict) — half-open intervals.
      Slot_kind == CLEANING and MAINTENANCE block TREATMENT slots with the same rule;
      TREATMENT slots never overlap each other on the same cylinder.
    input_set: "All CylinderScheduleSlot rows for the cylinder with slot_end > now (exclude past)"
    constants: {}
    precision: "UTC millisecond precision"

  - name: assay_outcome_rule
    trigger: "RetentionAssay creation"
    algorithm: threshold
    formula: |
      pass_threshold_pcf = target_retention_pcf * 0.90
      outcome =
        PASS         if mean_retention_pcf >= target_retention_pcf
                     AND min_sample_retention_pcf >= pass_threshold_pcf
        FAIL_MARGINAL if mean_retention_pcf >= pass_threshold_pcf
                     AND min_sample_retention_pcf < pass_threshold_pcf
                     AND mean_retention_pcf < target_retention_pcf
        FAIL_GROSS    if mean_retention_pcf < pass_threshold_pcf
      Boundary precision: >= is INCLUSIVE at the target and at the threshold;
      a value exactly equal to target_retention_pcf is a PASS (if min_sample
      also meets threshold).
    input_set: "Single RetentionAssay row + parent Charge target_retention_pcf"
    constants:
      MARGINAL_THRESHOLD_PCT: 0.90
    precision: "3 decimal places on all retention values"

# =============================================================================
# Table 4: Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and syntactically valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted to call this endpoint"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-templated resource ids must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested resource endpoints"

  - priority: 4
    category: state
    check: "TreatmentPlant must be LICENSED for charge creation, cycle start, retreat order, warranty registration"
    error_id: ERR_PLANT_NOT_LICENSED
    http_status: 409
    applies_to: "POST /charges, POST /cycles, POST /order-retreat, POST /warranty-registrations"

  - priority: 5
    category: state
    check: "Target resource must be in the expected state for this transition"
    error_id: "varies (ERR_INVALID_STATE, ERR_CHARGE_NOT_CANCELLABLE, ERR_CYLINDER_NOT_IDLE, etc.)"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Cylinder capacity: current_loaded_mbf + new_charge.volume_mbf <= max_volume_mbf (equality allowed)"
    error_id: ERR_CYLINDER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /treatment-plants/{plantId}/cylinders/{cylinderId}/charges"

  - priority: 7
    category: business_safety
    check: "CylinderScheduleSlot temporal overlap: no two effective slots (slot + buffer) may intersect on the same cylinder"
    error_id: ERR_CYLINDER_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /treatment-plants/{plantId}/cylinders/{cylinderId}/slots"

  - priority: 8
    category: business_safety
    check: "PreservativeConcentrate must be IN_STOCK with assay >= min_working_assay_pct before cycle start"
    error_id: ERR_ASSAY_BELOW_WORKING_MINIMUM
    http_status: 422
    applies_to: "POST /cycles/{cycleId}/start"

  - priority: 9
    category: business_safety
    check: "PreservativeConcentrate.status must not be QUARANTINED at cycle start"
    error_id: ERR_PRESERVATIVE_QUARANTINED
    http_status: 422
    applies_to: "POST /cycles/{cycleId}/start"

  - priority: 10
    category: business_safety
    check: "If Charge.requires_incising then every piece must be incised before tagging"
    error_id: ERR_INCISING_REQUIRED
    http_status: 422
    applies_to: "POST /treatment-plants/{plantId}/charges/{chargeId}/tag"

  - priority: 11
    category: business_safety
    check: "DripPadLog must show containment_breach == false before tagging"
    error_id: ERR_DRIP_PAD_CONTAINMENT_BREACH
    http_status: 422
    applies_to: "POST /treatment-plants/{plantId}/charges/{chargeId}/tag"

  - priority: 12
    category: business_temporal
    check: "DripPadLog dwell time (exited_pad_at - entered_pad_at) must be >= DRIP_MIN_HOURS (24h) before tagging"
    error_id: ERR_DRIP_DWELL_TOO_SHORT
    http_status: 422
    applies_to: "POST /treatment-plants/{plantId}/charges/{chargeId}/tag"

  - priority: 13
    category: business_temporal
    check: "QualityInspection transition SCHEDULED → IN_PROGRESS only inside [inspection_window_start, inspection_window_end]"
    error_id: ERR_INSPECTION_WINDOW_MISSED
    http_status: 409
    applies_to: "POST /inspections/{inspectionId}/begin"

  - priority: 14
    category: business_referential
    check: "RetentionAssay.cycle_id must reference a TreatmentCycle belonging to the same charge"
    error_id: ERR_ASSAY_CYCLE_MISMATCH
    http_status: 422
    applies_to: "POST /treatment-plants/{plantId}/charges/{chargeId}/retention-assays"

  - priority: 15
    category: business_referential
    check: "CylinderScheduleSlot.charge_id must reference a Charge in STAGED or RE_TREAT_PENDING"
    error_id: ERR_SLOT_CHARGE_INVALID
    http_status: 422
    applies_to: "POST /treatment-plants/{plantId}/cylinders/{cylinderId}/slots"

  - priority: 16
    category: business_referential
    check: "CylinderScheduleSlot must exist and cover the requested treatment start time before a Charge may enter the cylinder"
    error_id: ERR_NO_SLOT_FOR_CHARGE
    http_status: 409
    applies_to: "POST /treatment-plants/{plantId}/cylinders/{cylinderId}/charges"

  - priority: 17
    category: business_fiscal
    check: "CustomerAccount must be ACTIVE and registration fee must not push outstanding_balance over credit_limit (custom-treat only)"
    error_id: ERR_CUSTOMER_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /treatment-plants/{plantId}/cylinders/{cylinderId}/charges, POST /warranty-registrations"

  - priority: 18
    category: business_constraint
    check: "Re-treat permitted only when last assay outcome is FAIL_MARGINAL and cycle_number < 3"
    error_id: ERR_RETREAT_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /treatment-plants/{plantId}/charges/{chargeId}/order-retreat"

  - priority: 19
    category: business_constraint
    check: "expected_charge_version must match Charge.version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /order-retreat, POST /warranty-registrations"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- TreatmentPlant ---
  - method: POST
    path: "/treatment-plants"
    description: "Register a new treatment plant"
    roles: [ComplianceOfficer]
    code: 201
    input: [plant_name, alsc_license_number]
    output: TreatmentPlant
    side_effects:
      - "compliance_score initialized to 1000"
      - "hazardous_waste_liability_cents initialized to 0"
      - "status = LICENSED"

  - method: GET
    path: "/treatment-plants"
    description: "List treatment plants"
    roles: [PlantOperator, LabTechnician, QualityManager, QualityAgencyInspector, ComplianceOfficer, AccountsReceivable]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TreatmentPlant[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/{plantId}"
    description: "Get a specific treatment plant"
    roles: [PlantOperator, LabTechnician, QualityManager, QualityAgencyInspector, ComplianceOfficer, AccountsReceivable]
    code: 200
    input: []
    output: TreatmentPlant
    side_effects: []

  - method: POST
    path: "/treatment-plants/{plantId}/suspend"
    description: "Suspend a plant's license"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TreatmentPlant
    side_effects:
      - "status → SUSPENDED"
      - "Cylinder freeze"

  - method: POST
    path: "/treatment-plants/{plantId}/reinstate"
    description: "Reinstate a suspended plant"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TreatmentPlant
    side_effects:
      - "status → LICENSED"
      - "Cylinder freeze lifted"

  - method: POST
    path: "/treatment-plants/{plantId}/revoke"
    description: "Revoke a plant's license (terminal)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TreatmentPlant
    side_effects:
      - "status → REVOKED"
      - "All cylinders → DECOMMISSIONED"
      - "All non-terminal Charges → SCRAPPED"

  - method: POST
    path: "/treatment-plants/{plantId}/settle-liability"
    description: "Zero-out hazardous waste liability ledger"
    roles: [AccountsReceivable]
    code: 200
    input: []
    output: TreatmentPlant
    side_effects:
      - "hazardous_waste_liability_cents = 0"

  # --- FK reverse-reachability sub-resources under TreatmentPlant ---
  - method: GET
    path: "/treatment-plants/{plantId}/cylinders"
    description: "List cylinders for a plant (sub-resource; FK reverse-reachability for TreatmentCylinder.plant_id)"
    roles: [PlantOperator, LabTechnician, QualityManager, QualityAgencyInspector, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TreatmentCylinder[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/{plantId}/preservatives"
    description: "List preservatives for a plant (sub-resource; FK reverse-reachability for PreservativeConcentrate.plant_id)"
    roles: [LabTechnician, PlantOperator, QualityManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PreservativeConcentrate[]"
    side_effects: []

  - method: GET
    path: "/treatment-plants/{plantId}/inspections"
    description: "List inspections for a plant (sub-resource; FK reverse-reachability for QualityInspection.plant_id)"
    roles: [QualityAgencyInspector, ComplianceOfficer, QualityManager, PlantOperator, LabTechnician]
    code: 200
    input: ["limit?", "offset?", "status?", "severity?"]
    output: "QualityInspection[]"
    side_effects: []

  # --- TreatmentCylinder ---
  - method: POST
    path: "/treatment-plants/{plantId}/cylinders"
    description: "Register a cylinder under a plant"
    roles: [PlantOperator]
    code: 201
    input: [cylinder_code, max_volume_mbf, supported_process_types]
    output: TreatmentCylinder
    side_effects:
      - "status = IDLE"

  - method: GET
    path: "/treatment-plants/{plantId}/cylinders/{cylinderId}"
    description: "Get a specific cylinder"
    roles: [PlantOperator, LabTechnician, QualityManager, QualityAgencyInspector, ComplianceOfficer]
    code: 200
    input: []
    output: TreatmentCylinder
    side_effects: []

  - method: POST
    path: "/treatment-plants/{plantId}/cylinders/{cylinderId}/mark-cleaned"
    description: "Mark a NEEDS_CLEANING cylinder as cleaned (returns to IDLE)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: TreatmentCylinder
    side_effects:
      - "status → IDLE"

  - method: POST
    path: "/treatment-plants/{plantId}/cylinders/{cylinderId}/decommission"
    description: "Decommission a cylinder (terminal)"
    roles: [PlantOperator]
    code: 200
    input: []
    output: TreatmentCylinder
    side_effects:
      - "status → DECOMMISSIONED"

  # --- PreservativeConcentrate ---
  - method: POST
    path: "/treatment-plants/{plantId}/preservatives"
    description: "Register a preservative concentrate"
    roles: [LabTechnician]
    code: 201
    input: [chemical_family, concentrate_assay_pct, inventory_gallons, min_working_assay_pct]
    output: PreservativeConcentrate
    side_effects:
      - "status = IN_STOCK (or LOW_STOCK if inventory_gallons below threshold)"

  - method: GET
    path: "/treatment-plants/{plantId}/preservatives/{preservativeId}"
    description: "Get a specific preservative"
    roles: [LabTechnician, PlantOperator, QualityManager, ComplianceOfficer]
    code: 200
    input: []
    output: PreservativeConcentrate
    side_effects: []

  - method: POST
    path: "/treatment-plants/{plantId}/preservatives/{preservativeId}/assay"
    description: "Re-assay the concentrate (updates concentrate_assay_pct)"
    roles: [LabTechnician]
    code: 200
    input: [new_assay_pct]
    output: PreservativeConcentrate
    side_effects:
      - "concentrate_assay_pct = new_assay_pct"
      - "increments version by 1"

  - method: POST
    path: "/treatment-plants/{plantId}/preservatives/{preservativeId}/replenish"
    description: "Replenish inventory"
    roles: [LabTechnician]
    code: 200
    input: [additional_gallons]
    output: PreservativeConcentrate
    side_effects:
      - "inventory_gallons += additional_gallons"
      - "status may auto-transition LOW_STOCK → IN_STOCK"

  - method: POST
    path: "/treatment-plants/{plantId}/preservatives/{preservativeId}/quarantine"
    description: "Quarantine a preservative"
    roles: [LabTechnician]
    code: 200
    input: [reason]
    output: PreservativeConcentrate
    side_effects:
      - "status → QUARANTINED"

  - method: POST
    path: "/treatment-plants/{plantId}/preservatives/{preservativeId}/release-quarantine"
    description: "Release a preservative from quarantine"
    roles: [LabTechnician]
    code: 200
    input: []
    output: PreservativeConcentrate
    side_effects:
      - "status → IN_STOCK (requires re-assay >= min_working_assay_pct)"

  # --- CustomerAccount ---
  - method: POST
    path: "/customers"
    description: "Open a customer account"
    roles: [AccountsReceivable]
    code: 201
    input: [customer_name, credit_limit_cents]
    output: CustomerAccount
    side_effects:
      - "status = ACTIVE; outstanding_balance_cents = 0"

  - method: GET
    path: "/customers"
    description: "List customers"
    roles: [AccountsReceivable, PlantOperator, QualityManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "CustomerAccount[]"
    side_effects: []

  - method: GET
    path: "/customers/{customerId}"
    description: "Get a customer"
    roles: [AccountsReceivable, PlantOperator, QualityManager, ComplianceOfficer]
    code: 200
    input: []
    output: CustomerAccount
    side_effects: []

