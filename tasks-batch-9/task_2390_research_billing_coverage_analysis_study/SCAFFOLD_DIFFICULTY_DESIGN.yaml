              payload: { study_subject_id: "${subject_id}", calendar_visit_id: "${visit_gen1_id}", actual_service_date: "2026-09-02" }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { subject_visit_id: "$.data.id", scheduled_generation: "$.data.calendar_generation_at_schedule" }
            - call: "POST /research-billing/study-calendars"
              payload: { study_id: "${study_id}", source_analysis_id: "${analysis_id}" }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { calendar_gen2_id: "$.data.id", gen2_generation: "$.data.build_generation" }
            - call: "POST /research-billing/calendar-visits"
              payload: { study_calendar_id: "${calendar_gen2_id}", visit_name: "Cycle 1 Day 1 (revised)", sequence_index: 1, target_day_offset: 0, window_before_days: 0, window_after_days: 5 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
              captures: { visit_gen2_id: "$.data.id" }
            - call: "POST /research-billing/visit-charge-routes"
              payload: { calendar_visit_id: "${visit_gen2_id}", coverage_item_id: "${item_infusion_id}", occurrences: 1 }
              as: CoverageAnalyst
              as_user_id: "analyst_1"
            - call: "POST /research-billing/study-calendars/${calendar_gen2_id}/publish"
