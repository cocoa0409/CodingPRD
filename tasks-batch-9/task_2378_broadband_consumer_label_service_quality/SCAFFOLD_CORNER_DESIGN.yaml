              as: RetailAgent
              captures: { acct_a_id: $.data.id }
            - call: "POST /subscriber-accounts"
              payload: { account_code: "ACC-B", plan_id: "${plan_id}", preferred_locale: "en-US", service_start_date: "2026-03-05T00:00:00Z" }
              as: RetailAgent
              captures: { acct_b_id: $.data.id }
            - call: "POST /subscriber-accounts"
              payload: { account_code: "ACC-C", plan_id: "${plan_id}", preferred_locale: "en-US", service_start_date: "2026-03-06T00:00:00Z" }
              as: RetailAgent
              captures: { acct_c_id: $.data.id }
          trigger:
