          - state_machines.Contractor.ENROLLED_ACTIVE_to_SUSPENDED
          - calculations.contractor_quality_score
          - entities.Contractor.fields.quality_score_rolling
          - entities.Contractor.fields.suspension_reason
          - endpoints.GET_/contractors/{id}/quality-review
        distinguishing_aspect: |
          One FAILED post-install inspection reaches a THIRD entity by cascade:
          the contractor's rolling score drops from 100 to 0 (a single window
          entry worth POINTS[FAILED] == 0), 0 < quality_suspension_threshold
          70, so Contractor.status becomes SUSPENDED with suspension_reason
          QUALITY_SCORE — recorded by an inspector who never addresses the
          contractor at all.
