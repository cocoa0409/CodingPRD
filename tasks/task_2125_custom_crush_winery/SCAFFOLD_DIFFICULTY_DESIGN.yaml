  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: blend_unwind_conserves_contract_gallons_plus_losses
        grounds:
          - state_machines.BlendTrial.APPROVED_to_EXECUTED
          - state_machines.BlendTrial.EXECUTED_to_UNWOUND
          - state_machines.Lot.CONSUMED_to_AGING
          - entities.Lot.fields.volume_gallons
          - entities.Lot.fields.loss_gallons
        distinguishing_aspect: |
          The conserved quantity is CONTINUOUS WINE VOLUME:
          INVARIANT_GALLONS(contract) = sum over that contract's Lots of
          (volume_gallons + loss_gallons) reads exactly 2431.25 before the
          execute, 2431.25 after the execute, and 2431.25 again after the unwind —
          zero drift across the forward action and its compensation.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One ACTIVE Contract holding exactly two INTAKE Lots: lot1 1565.00 gallons and lot2 866.25 gallons, both AGING with loss_gallons 0.00, so INVARIANT_GALLONS == 2431.25."
            - "One EXECUTED BlendTrial that drew 750.00 from lot1 and the whole 866.25 from lot2 at 2.00 percent declared loss, minting blend lot ${blot} of 1583.92 gallons with loss_gallons 32.33 and driving lot2 to CONSUMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /clients"
              payload: { name: "Coombsville Cellars", ttb_permit_number: "BW-CA-15001", contact_email: "ops@coombsville.example" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { cl1: $.data.id }
            - call: "POST /contracts"
              payload: { client_id: "${cl1}", harvest_year: 2026, committed_tons: 200, tank_gallons_entitled: 20000, barrel_slots_entitled: 40, crush_rate_cents_per_ton: 50000, storage_rate_cents_per_gallon_month: 25, labor_rate_cents_per_hour: 10000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-07-31T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { ct1: $.data.id }
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "SUBMIT" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /contracts/${ct1}/transitions"
              payload: { action: "ACTIVATE" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
            - call: "POST /vessels"
              payload: { vessel_code: "T-101", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v1: $.data.id, v1_ver: $.data.version }
            - call: "POST /vessels"
              payload: { vessel_code: "T-102", vessel_type: "TANK", capacity_gallons: 4000, facility_zone: "ZONE_A" }
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { v2: $.data.id, v2_ver: $.data.version }
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-9301", varietal: "CABERNET_SAUVIGNON", appellation: "OAKVILLE", block_code: "B12", gross_weight_lbs: 24000, tare_weight_lbs: 4000 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { in1: $.data.id }
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "SAMPLE", brix: 26.40, ph: 3.62 }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /harvest-intakes/${in1}/transitions"
              payload: { action: "ACCEPT" }
              as: CellarSupervisor
              as_user_id: "cs-bob"
            - call: "POST /lots"
              payload: { contract_id: "${ct1}", lot_code: "CS-OAK-26-01", vintage_year: 2026, intake_ids: ["${in1}"] }
              as: CellarSupervisor
              as_user_id: "cs-bob"
              captures: { lot1: $.data.id }
            - call: "POST /harvest-intakes"
              payload: { contract_id: "${ct1}", delivery_ticket: "DT-9302", varietal: "MERLOT", appellation: "OAKVILLE", block_code: "B07", gross_weight_lbs: 14500, tare_weight_lbs: 4000 }
              as: CellarSupervisor
