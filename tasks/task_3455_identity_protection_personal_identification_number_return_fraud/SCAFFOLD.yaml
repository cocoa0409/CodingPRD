  - { method: POST, path: "/identity-protection/verification-cases", description: "Open an identity-verification case for a held return (or enrollment case with return_id omitted)", roles: [FraudAnalyst, VerificationAgent], code: 201, input: [taxpayer_id, channel, "return_id?"], output: IdentityVerificationCase, side_effects: ["deadline_at = now + 30 days", "required_document_types derived from channel"] }
  - { method: GET, path: "/identity-protection/verification-cases", description: "List verification cases with filters", roles: [FraudAnalyst, VerificationAgent, TaxpayerAdvocate, SystemAdmin], code: 200, input: ["return_id?", "taxpayer_id?", "status?", "limit?", "offset?"], output: "IdentityVerificationCase[]", side_effects: [] }
