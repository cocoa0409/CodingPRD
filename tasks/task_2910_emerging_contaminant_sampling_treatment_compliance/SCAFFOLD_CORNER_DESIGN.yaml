          assert:
            - "HTTP status is 200"
            - "PilotTest.${gac_id}.status == COMPLETED"
            - "PilotTest.${gac_id}.removal_pct == 96.30"
            - "PilotTest.${gac_id}.technology_score == 80.14"
            - "PilotTest.${gac_id}.technology_score is NOT 80.13"
            - "PilotTest.${gac_id}.spent_media_kg == 800.00"
            - "PilotTest.${gac_id}.unmanifested_media_kg == 800.00"
            - "PilotTest.${gac_id}.selected == false"
            - "TreatmentEvaluation.${eval_id}.status == PILOTING"

      - name: reaching_bidding_is_a_conditional_action_gated_on_funding_and_the_permit
        claim_type: conditional_action
        grounds:
          - endpoints[POST /capital-projects/{id}/construction-status]
          - validations[priority=63]
          - validations[priority=33]
          - errors[ERR_CONCENTRATE_PERMIT_REQUIRED]
          - errors[ERR_PROJECT_IN_SERVICE]
          - state_machines.CapitalProject.construction_status
        distinguishing_aspect: "An RO selection is the only branch that sets concentrate_permit_required, so the identical BIDDING request that succeeds on a GAC project is refused here until concentrate_permit_ref is supplied; walking on to IN_SERVICE then flips the cost fields to immutable, which the same PATCH that worked earlier now proves."
        test_recipe:
          setup:
            - "EntryPoint EPTDS-03 at population 45000 (18000 accounts, 1,080,000 kgal, revenue 1,026,000,000)."
            - "The evaluation holds an RO pilot (removal 99.00, lifecycle score 70.00, terms 34.65 + 17.50 + 6.00 + 6.00 + 9.00 = 73.15) and a GAC pilot (removal 95.00, lifecycle score 50.00, terms 33.25 + 12.50 + 4.00 + 3.00 + 2.00 = 54.75); both clear the 90.00 removal floor and RO wins on score."
            - "The RO selection seeds the project at capital 900,000,000 and O&M 45,000,000 with required_disposal_method DEEP_WELL and concentrate_permit_required true; the unfunded ladder is debt 55,041,046 / base 100,041,046 / provisional 9.75 / 150 bp / final 101,541,662 / 9.90."
            - "An EC_GRANT application for 900,000,000 is awarded in full, so forgiveness is 100.00 pct, borrowed drops to 0 and the ladder falls to base 45,000,000 / provisional 4.39 / 0 bp / 4.39 with a uniform bill increase of 208 cents."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-03", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "RO", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 15.00, lifecycle_cost_cents: 3000000000, capital_cost_estimate_cents: 900000000, annual_om_estimate_cents: 45000000, residuals_burden_score: 30.00, footprint_score: 60.00, om_complexity_score: 90.00 }
              as: TreatmentEngineer
              captures: { ro_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 5000000000, capital_cost_estimate_cents: 600000000, annual_om_estimate_cents: 25000000, residuals_burden_score: 20.00, footprint_score: 30.00, om_complexity_score: 20.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests/${ro_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ro_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 0.50, bed_volumes_treated: 30000.00, spent_media_kg: 200.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 2.50, bed_volumes_treated: 20000.00, spent_media_kg: 500.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "RO wins on score with both pilots above the removal floor" }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id", proj_v: "$.data[0].version" }
            - call: "POST /capital-projects/${proj_id}/funding-applications"
              payload: { program: "EC_GRANT", amount_requested_cents: 900000000, disadvantaged_community: false, expected_capital_project_version: "${proj_v}" }
              as: FinanceOfficer
              captures: { app_id: "$.data.id" }
            - call: "POST /funding-applications/${app_id}/decision"
              payload: { action: "AWARD", awarded_cents: 900000000, decision_note: "Full emerging contaminant grant" }
              as: StateRegulator
              as_user_id: "regulator-1"
          trigger:
            - call: "POST /capital-projects/${proj_id}/construction-status"
              payload: { target_status: "BIDDING" }
              as: FinanceOfficer
              captures: { err: "$.data.error_id" }
            - call: "POST /capital-projects/${proj_id}/construction-status"
              payload: { target_status: "BIDDING", concentrate_permit_ref: "NPDES-2026-114" }
              as: FinanceOfficer
            - call: "POST /capital-projects/${proj_id}/construction-status"
              payload: { target_status: "CONSTRUCTION" }
              as: FinanceOfficer
            - call: "POST /capital-projects/${proj_id}/construction-status"
              payload: { target_status: "IN_SERVICE" }
              as: FinanceOfficer
            - call: "PATCH /capital-projects/${proj_id}"
              payload: { capital_cost_cents: 950000000 }
              as: FinanceOfficer
              captures: { patch_err: "$.data.error_id" }
          assert:
            - "TreatmentEvaluation.${eval_id}.selected_technology == RO"
            - "PilotTest.${ro_id}.removal_pct == 99.00 and PilotTest.${ro_id}.technology_score == 73.15"
            - "PilotTest.${gac_id}.removal_pct == 95.00 and PilotTest.${gac_id}.technology_score == 54.75"
            - "PilotTest.${ro_id}.selected == true and PilotTest.${gac_id}.selected == false"
            - "CapitalProject.${proj_id}.capital_cost_cents == 900000000"
            - "CapitalProject.${proj_id}.annual_om_cost_cents == 45000000"
            - "CapitalProject.${proj_id}.required_disposal_method == DEEP_WELL"
            - "CapitalProject.${proj_id}.concentrate_permit_required == true"
            - "FundingApplication.${app_id}.forgiveness_pct == 100.00 and FundingApplication.${app_id}.forgiven_cents == 900000000"
            - "CapitalProject.${proj_id}.funding_status == AWARDED"
            - "CapitalProject.${proj_id}.local_share_cents == 0 and CapitalProject.${proj_id}.borrowed_cents == 0"
            - "CapitalProject.${proj_id}.annual_debt_service_cents == 0"
            - "CapitalProject.${proj_id}.base_annual_requirement_cents == 45000000"
            - "CapitalProject.${proj_id}.provisional_rate_impact_pct == 4.39 and CapitalProject.${proj_id}.surcharge_bp == 0"
            - "CapitalProject.${proj_id}.rate_impact_pct == 4.39"
            - "CapitalProject.${proj_id}.uniform_monthly_increase_cents == 208"
            - "The first BIDDING attempt returns HTTP 422 with error_id ERR_CONCENTRATE_PERMIT_REQUIRED and construction_status stays PLANNED"
            - "The second BIDDING attempt returns HTTP 200 with construction_status BIDDING and concentrate_permit_ref \"NPDES-2026-114\""
            - "The CONSTRUCTION step returns HTTP 200 with construction_status CONSTRUCTION"
            - "The IN_SERVICE step returns HTTP 200 with construction_status IN_SERVICE"
            - "EntryPoint.${ep_id}.treatment_status == INSTALLED"
            - "The PATCH returns HTTP 422 with error_id ERR_PROJECT_IN_SERVICE and capital_cost_cents is still 900000000"

  # ===========================================================================
  # Guide section 6 — Errors
  #
  # Every one of the 79 error identifiers in §1.6 must be reachable. The
  # instances below are grouped by the endpoint family that raises them; the
  # remaining codes are triggered by instances elsewhere in this file or in
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml, and the coverage_note on the last
  # instance of this section records where each of those lives.
  # ===========================================================================
  - section: errors
    instances:

      - name: the_authentication_and_ownership_gates_each_return_their_own_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_LABORATORY_NOT_OWNED]
          - errors[ERR_LABORATORY_ASSIGNMENT_MISMATCH]
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=9]
        distinguishing_aspect: "Four distinct 401/403 conditions are separated on the same request: an absent role header and an unrecognised role both collapse to ERR_UNAUTHENTICATED, a recognised but wrong role gives ERR_FORBIDDEN_ROLE, an X-User-ID that resolves to no Laboratory gives ERR_LABORATORY_NOT_OWNED at priority 4, and an X-User-ID that resolves to the wrong Laboratory gives ERR_LABORATORY_ASSIGNMENT_MISMATCH at priority 9 — the ownership check must fire before the assignment check, not after."
        test_recipe:
          setup:
            - "Two laboratories are registered: Northgate Analytical and Southbank Labs."
            - "Sample SMP-01 on EPTDS-01 is collected and shipped to Northgate, so it sits in IN_TRANSIT with laboratory_id pointing at Northgate."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Southbank Labs", certification_id: "CERT-002", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab2_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s_id: "$.data.id" }
            - call: "POST /samples/${s_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
          trigger:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-09", source_type: "GROUNDWATER", population_served: 45000 }
              as: ""
              captures: { err_blank: "$.data.error_id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-09", source_type: "GROUNDWATER", population_served: 45000 }
              as: "PLANT_MANAGER"
              captures: { err_unknown_role: "$.data.error_id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-09", source_type: "GROUNDWATER", population_served: 45000 }
              as: SamplingTechnician
              captures: { err_role: "$.data.error_id" }
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "not-a-registered-laboratory"
              captures: { err_not_owned: "$.data.error_id" }
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab2_id}"
              captures: { err_mismatch: "$.data.error_id" }
            - call: "POST /samples/${s_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
          assert:
            - "The blank-role attempt returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "The unrecognised-role attempt returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "The SamplingTechnician attempt returns HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "No EntryPoint labelled EPTDS-09 exists after the three refused attempts"
            - "The unresolvable-laboratory receive returns HTTP 403 with error_id ERR_LABORATORY_NOT_OWNED"
            - "The wrong-laboratory receive returns HTTP 403 with error_id ERR_LABORATORY_ASSIGNMENT_MISMATCH"
            - "Sample.${s_id}.status is still IN_TRANSIT after both refused receives"
            - "The assigned-laboratory receive returns HTTP 200 and Sample.${s_id}.status == RECEIVED"

      - name: every_path_id_family_reports_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONTAMINANT_NOT_FOUND]
          - errors[ERR_LABORATORY_NOT_FOUND]
          - errors[ERR_ENTRY_POINT_NOT_FOUND]
          - errors[ERR_SAMPLE_NOT_FOUND]
          - errors[ERR_LAB_RESULT_NOT_FOUND]
          - errors[ERR_DETERMINATION_NOT_FOUND]
          - errors[ERR_NOTIFICATION_NOT_FOUND]
          - errors[ERR_EVALUATION_NOT_FOUND]
          - errors[ERR_PILOT_NOT_FOUND]
          - errors[ERR_MANIFEST_NOT_FOUND]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "The priority-5 ladder row declares thirteen sibling codes and an implementation that returns one generic 404 for all of them passes nothing here: each entity read must name its own code, and every code must be a 404 rather than a 422."
        test_recipe:
          setup:
            - "The store is empty of the thirteen ids used below; every path id is a syntactically valid UUID that resolves to no row."
          setup_api_calls: []
          trigger:
