            - "the ALPHA patrol with the same window returns 201 with status SCHEDULED"
            - "Circuit.${delta_id}.energization_state is still ENERGIZED with risk_posture NORMAL"

      - name: naming_an_already_activated_resource_center_is_rejected
        claim_type: Error triggerability
        grounds:
          - errors[ERR_RESOURCE_CENTER_ALREADY_ACTIVE]
          - calculations.resource_center_activation_selector
          - state_machines.CommunityResourceCenter
        distinguishing_aspect: "Explicit mode refuses a site that is already serving this very event, so activation is not idempotent: the second request names the centre the selector already took and gets ERR_RESOURCE_CENTER_ALREADY_ACTIVE with activation_order untouched at 1."
        test_recipe:
          setup:
            - "EV-MIKE armed over D-WEST with a single certified 3-seat centre CRC-W2, already activated by a selector-mode call."
          setup_api_calls:
            - *k_clock_default
            - *k_mike
            - *k_ws_m1
            - *k_obs_m1
            - *k_fpi_m
            - *k_cust_m1
            - *k_cust_m2
