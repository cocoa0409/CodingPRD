              captures: { w_cur: "$.data.applied_current_cents", w_med: "$.data.applied_medical_cents", w_arr: "$.data.applied_arrears_cents", w_int: "$.data.applied_interest_cents", w_gen: "$.data.applied_genetic_cost_cents", w_unap: "$.data.unapplied_credit_cents", w_disb: "$.data.disbursed_to_cp_cents", w_ret: "$.data.retained_by_state_cents" }
            - call: "GET /child-support/cases/${casew}"
              as: FinanceOfficer
              captures: { w_ic: "$.data.interest_collected_cents", w_uc: "$.data.unapplied_credit_cents", w_prin: "$.data.arrears_principal_cents" }
          assert:
            - "${gcost} == 48000 and ${liable} == NCP  # GENETIC_TEST_COST_CENTS is stamped by the test order and billed to the NCP on an INCLUSION"
            - "${monw} == 75000  # guideline for 200000/300000 with two children"
            - "${w_cur} == 75000  # bucket 1: the only CURRENT_SUPPORT charge whose period contains 2026-09-20"
            - "${w_med} == 20000  # bucket 2: same period window, MEDICAL_SUPPORT"
            - "${w_arr} == 30000  # bucket 3: the leftover OPEN charge, oldest due_date 2026-08-15"
            - "${w_int} == 150  # bucket 4: min(remaining 75000, receivable snapshot 150); 08-31 is the only month end strictly before 2026-09-20 and the only charge due by then is the 30000 arrears charge, 30000 * 0.005 == 150"
            - "${w_gen} == 48000  # bucket 5 fires only because genetic_cost_liable_party == NCP"
            - "${w_unap} == 26850  # 200000 - 75000 - 20000 - 30000 - 150 - 48000"
            - "${w_disb} == 125000  # non-TANF: current + medical + arrears reach the family"
            - "${w_ret} == 48150  # non-TANF: interest 150 + genetic cost 48000 stay with the state"
            - "${w_disb} + ${w_ret} + ${w_unap} == 200000  # the declared invariant holds exactly, with no rounding step anywhere"
            - "${w_ic} == 150 and ${w_uc} == 26850 and ${w_prin} == 0  # every charge is now SATISFIED"

      - name: out_of_order_charge_creation_still_accrues_by_due_date
        claim_type: chronological
        grounds:
          - "calculations.arrears_interest_accrual.algorithm"
          - "calculations.arrears_interest_accrual.constants.MONTHLY_INTEREST_RATE"
          - "entities.ObligationCharge.fields.interest_accrued_cents"
          - "endpoints[POST /child-support/cases/{case_id}/accrual-runs]"
        distinguishing_aspect: >
          The three charges are POSTed newest-due-date first, so created_at order is
          the exact reverse of due_date order, and the accrual still produces 750 /
          375 / 0 per charge and 2250 in aggregate - an implementation that walks
          rows in insertion order gets the aggregate month-end pools wrong. The same
          chain pins the whole-month rule: the 2026-08-15 charge read at 2026-11-01
          has THREE calendar-month differences but only TWO whole months, because
          the as-of day 1 is earlier than the due day 15.
        test_recipe:
          setup:
            - "Empty database. Clock starts at 2026-08-01T00:00:00Z."
            - "CP income 200000, NCP income 300000, both VERIFIED_WAGE_RECORD, two children, non-TANF."
            - "monthly_obligation_cents is 75000, so each CURRENT_SUPPORT charge defaults to 75000."
            - "Charges are created in the order due 2026-10-15, then 2026-09-15, then 2026-08-15."
            - "Clock advanced to 2026-11-01T00:00:00Z, then an accrual run is posted."
          setup_api_calls:
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /child-support/participants"
              payload: { role_type: "CUSTODIAL_PARTY", full_name: "Zelda Trombley", ssn_last4: "6161", residence_state_code: "MN", monthly_gross_income_cents: 200000, income_verification_source: "VERIFIED_WAGE_RECORD" }
              as: CaseWorker
              captures: { cpn: "$.data.id" }
            - call: "POST /child-support/participants"
              payload: { role_type: "NONCUSTODIAL_PARTY", full_name: "Hakim Trombley", ssn_last4: "6162", residence_state_code: "MN", monthly_gross_income_cents: 300000, income_verification_source: "VERIFIED_WAGE_RECORD", supports_second_family: false, has_valid_drivers_license: true }
              as: CaseWorker
              captures: { ncpn: "$.data.id" }
            - call: "POST /child-support/participants/${ncpn}/locate-results"
              payload: { locate_outcome: "LOCATED" }
              as: CaseWorker
            - call: "POST /child-support/cases"
              payload: { case_type: "DIRECT_APPLICATION", custodial_party_id: "${cpn}", noncustodial_party_id: "${ncpn}", child_count: 2, tanf_assistance: false, good_cause_claim: false }
              as: CaseWorker
              captures: { casen: "$.data.id" }
            - call: "POST /child-support/cases/${casen}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
            - call: "POST /child-support/cases/${casen}/orders"
              payload: { order_type: "CURRENT_SUPPORT", origin_state_code: "MN", effective_date: "2026-08-01" }
              as: CaseWorker
              captures: { ordern: "$.data.id" }
            - call: "POST /child-support/orders/${ordern}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${ordern}/entry"
              payload: {}
              as: SupervisingAttorney
            - call: "POST /child-support/orders/${ordern}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-10-01", period_end_date: "2026-11-01", due_date: "2026-10-15" }
              as: FinanceOfficer
              captures: { n3: "$.data.id" }
            - call: "POST /child-support/orders/${ordern}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-09-01", period_end_date: "2026-10-01", due_date: "2026-09-15" }
              as: FinanceOfficer
              captures: { n2: "$.data.id" }
            - call: "POST /child-support/orders/${ordern}/charges"
              payload: { charge_type: "CURRENT_SUPPORT", period_start_date: "2026-08-01", period_end_date: "2026-09-01", due_date: "2026-08-15" }
              as: FinanceOfficer
              captures: { n1: "$.data.id" }
            - call: "POST /child-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /child-support/cases/${casen}/accrual-runs"
              payload: {}
              as: FinanceOfficer
              captures: { n_int: "$.data.interest_receivable_cents", n_prin: "$.data.arrears_principal_cents" }
            - call: "GET /child-support/charges/${n1}"
              as: FinanceOfficer
              captures: { n1_i: "$.data.interest_accrued_cents" }
            - call: "GET /child-support/charges/${n2}"
              as: FinanceOfficer
              captures: { n2_i: "$.data.interest_accrued_cents" }
            - call: "GET /child-support/charges/${n3}"
              as: FinanceOfficer
              captures: { n3_i: "$.data.interest_accrued_cents" }
