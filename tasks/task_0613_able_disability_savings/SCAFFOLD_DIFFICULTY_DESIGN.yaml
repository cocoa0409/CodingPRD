  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ssi_threshold_strict_gt_at_100k_boundary
        grounds:
          - calculations.ssi_asset_disregard
          - entities.Program.fields.ssi_suspension_threshold_cents
          - endpoints["GET /able/accounts/{id}/means-test"]
        distinguishing_aspect: |
          Numeric-threshold metric on the means-test endpoint: with other_countable=200000 (= the $2,000 limit),
          a balance of exactly 10000000 ($100,000.00) yields total_countable 200000 -> SSI_OK (strict >), while
          10000001 ($100,000.01) yields 200001 -> SSI_SUSPENDED.
        test_recipe:
          setup:
            - "Beneficiary other_countable_resources_cents=200000; OPEN account; balance set to exactly 10000000 via REGULAR 1900000 + credit_earnings 8100000."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, ssi_suspension_threshold_cents: 10000000, ssi_resource_limit_cents: 200000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Ned N", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA", other_countable_resources_cents: 200000 }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 8100000 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /able/accounts/${acct_id}/means-test?variant=SSI"
              payload: { variant: "SSI" }
              as: ProgramAdministrator
              captures: { at_exact: $.data.ssi_posture }
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 1 }
              as: ProgramAdministrator
            - call: "GET /able/accounts/${acct_id}/means-test?variant=SSI"
              payload: { variant: "SSI" }
              as: ProgramAdministrator
              captures: { at_over: $.data.ssi_posture }
          assert:
            - "at balance 10000000: ssi_posture == SSI_OK (total_countable 200000 is NOT > limit 200000)"
            - "at balance 10000001: ssi_posture == SSI_SUSPENDED (total_countable 200001 > 200000)"

      - name: annual_cap_boundary_exact_vs_plus_one_cent
        grounds:
          - calculations.contribution_headroom
          - validations[priority=13]
          - endpoints["POST /able/accounts/{id}/contributions"]
        distinguishing_aspect: |
          Annual-cap metric reached through the contributions endpoint (a different endpoint and different metric than
          the SSI threshold): a contribution that brings regular_contrib_ytd to exactly 1900000 succeeds, but the next
          contribution of 1 cent is rejected ERR_ANNUAL_CAP_EXCEEDED (room 0, amount 1 > 0).
        test_recipe:
          setup:
            - "OPEN account; one prior REGULAR contribution of 1800000 (regular_contrib_ytd=1800000, room=100000)."
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Ola O", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1800000, expected_account_version: "${acct_v}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { acct_v2: $.data.version }
          trigger:
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 100000, expected_account_version: "${acct_v2}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { ok_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1, expected_account_version: "${ok_v}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first trigger (100000) succeeds: regular_contrib_ytd_cents == 1900000 (exactly at cap)"
            - "second trigger (1 cent) -> error_id == ERR_ANNUAL_CAP_EXCEEDED, HTTP 409"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: distribution_approve_requires_account_open
        grounds:
          - state_machines.Distribution.REQUESTED_to_APPROVED
          - entities.Account.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          Distribution->Account pair: a Distribution's REQUESTED->APPROVED transition is blocked when its owning
          Account is SUSPENDED (ERR_ACCOUNT_NOT_OPEN), so Distribution validity depends on Account state.
