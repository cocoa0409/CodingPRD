      - name: confirm_on_cancelled_activation_and_approve_on_draft_settlement_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_ACTIVATION_STATE
          - errors.ERR_INVALID_SETTLEMENT_STATE
          - validations.priority_22
          - validations.priority_23
        distinguishing_aspect: |
          Two state codes that no other instance reaches are triggered on one chain:
          confirming an activation already CANCELLED returns 409
          ERR_INVALID_ACTIVATION_STATE, and approving a settlement still in DRAFT
          returns 409 ERR_INVALID_SETTLEMENT_STATE -- the approve arc requires
          PENDING_APPROVAL, so skipping submit is a state error and not a
          segregation-of-duties error.
        test_recipe:
          setup:
            - "Canonical chain to ON_SALE: VERSUS 12500000 / 0.85 / breakeven 6000000, advance completed, one RESERVED GOLD scale (6295 / 2000 / facility 400 / unbundled), announced with doors 2026-08-22T18:00:00.000Z, 100 units sold."
            - "One sponsor and one SIGNAGE activation created while the booking is ANNOUNCED, then cancelled, which is a terminal activation status."
            - "The clock is advanced to 2026-08-22T23:00:00.000Z (exactly load_out_end_utc) and the show is marked performed, which closes the scales to SALES_CLOSED so a settlement may be created and left in DRAFT."
