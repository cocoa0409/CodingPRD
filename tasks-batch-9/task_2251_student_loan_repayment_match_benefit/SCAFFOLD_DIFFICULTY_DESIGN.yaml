              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version, space_before: $.data.remaining_qslp_space_cents }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SELF_CERTIFICATION", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id, certified_before: $.data.certified_total_cents }
          trigger:
            - call: "POST /loan-certifications/${cert_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "space_before == 2280000"
            - "certified_before == 0"
            - "err == ERR_NO_CERTIFIED_LINES"
            - "HTTP status == 422"
            - "LoanCertification.${cert_id}.status == DRAFT"
            - "Employee.${emp_id}.remaining_qslp_space_cents == 2280000  # unchanged by the rejected submit"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_requires_amendment_effective
        grounds:
          - state_machines.LoanCertification.SUBMITTED_to_ACCEPTED
          - state_machines.PlanAmendment.NOTICE_SENT_to_EFFECTIVE
          - validations[priority=30]
          - errors.ERR_AMENDMENT_NOT_EFFECTIVE
        distinguishing_aspect: |
          Entity pair LoanCertification -> PlanAmendment: the SUBMITTED -> ACCEPTED transition is
          rejected while the plan year's amendment is only NOTICE_SENT and succeeds unchanged once the
          same amendment reaches EFFECTIVE, with no other input altered between the two attempts.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN."
            - "One PlanAmendment walked DRAFTED -> ADOPTED -> NOTICE_SENT but not yet EFFECTIVE, with effective_date 2026-01-01 already in the past relative to the default logical clock."
            - "One Employee with one payroll period of 1000000 cents compensation and 20000 cents deferral."
            - "One VERIFIED LoanAccount and one SUBMITTED LoanCertification carrying a single 30000-cent line."
            - "One PENDING FundingBatch on the payroll period."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z" }
