# =============================================================================
# Task 1925 — Farm Stand & U-Pick Operation — §1.9 Scaffold Corner Design
# Breadth index: every testable claim of §1.1–§1.7 not already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. excluded_because stubs cite the covering
# §1.8 instance. All chains replay from empty-DB against §1.5.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: season_create_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Season, entities.Season.fields.status, entities.Season.fields.current_waiver_version]
        distinguishing_aspect: "A freshly created season is DRAFT with current_waiver_version 1, version 1, and a server-minted UUID id; end_date < start_date is rejected."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_status: $.data.status, s_wv: $.data.current_waiver_version, s_v: $.data.version } }
            - { call: "POST /farm/seasons", payload: { name: "Bad", start_date: "2026-08-31", end_date: "2026-08-01", waiver_text: "X" }, as: FarmManager, captures: { err: $.data.error_id } }
          trigger: []
          assert:
            - "Season.${s_id}.status == DRAFT, current_waiver_version == 1, version == 1"
            - "Season.${s_id}.id is a server-minted UUID (no client-supplied id)"
            - "Inverted date range rejected with ERR_INVALID_REQUEST (400)"

      - name: field_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Field, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent field id yields ERR_NOT_FOUND (404), not a server error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /farm/fields/12345678-1234-1234-1234-123456789abc", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: crop_create_unknown_field_input_ignored_rejected
        claim_type: computed_fields
        grounds: [entities.Crop.fields.season_picked_oz, "validations[priority=30]"]
        distinguishing_aspect: "Computed field season_picked_oz is server-owned: supplying it (or any undeclared field) in the create body is rejected with ERR_INVALID_REQUEST, and the stored value starts at 0."
        test_recipe:
          setup: ["one season exists"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480, season_picked_oz: 5 }, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480 }, as: FarmManager, captures: { crop_id: $.data.id, crop_picked: $.data.season_picked_oz } }
          assert:
            - "Body containing computed field season_picked_oz -> error_id == ERR_INVALID_REQUEST (400)"
            - "Clean create -> Crop.${crop_id}.season_picked_oz == 0"

      - name: crop_missing_required_price_rejected
        claim_type: required_fields
        grounds: [entities.Crop.fields.price_per_lb_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input price_per_lb_cents fails with ERR_INVALID_REQUEST before any state or business check."
        test_recipe:
          setup: ["one season exists"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry" }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: sales_day_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.SalesDay.fields.day_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "day_type outside {WEEKDAY, WEEKEND} is a 400 request-shape error."
        test_recipe:
          setup: ["one season exists"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "FUNDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400"

      - name: fields_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, entities.Field]
        distinguishing_aspect: "Pagination defaults and envelope: limit=1 returns exactly 1 item with total_count 2 and has_more true; offset=1 returns the second item with has_more false; every response carries meta.api_request_id and response_type."
        test_recipe:
          setup: ["one season with two fields (North order 1, South order 2)"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f1: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "South", rotation_group: "RG1", rotation_order: 2, estimated_harvest_oz: 500 }, as: FarmManager, captures: { f2: $.data.id } }
          trigger:
            - { call: "GET /farm/fields", payload: { season_id: "${s_id}", limit: 1, offset: 0 }, as: FarmManager, captures: { page1_total: $.meta.total_count, page1_more: $.meta.has_more, page1_first: $.data.0.id } }
            - { call: "GET /farm/fields", payload: { season_id: "${s_id}", limit: 1, offset: 1 }, as: FarmManager, captures: { page2_more: $.meta.has_more, page2_first: $.data.0.id } }
          assert:
            - "page 1: total_count == 2, has_more == true, exactly 1 item"
            - "page 2: has_more == false, item id == ${f2} (created_at ASC ordering)"
            - "page1_first == ${f1} != page2_first"

      - name: session_create_computed_admission_field
        claim_type: computed_fields
        grounds: [entities.VisitSession.fields.admission_charge_cents]
        excluded_because:
          difficulty_instance: admission_surge_component_rounding
          rationale: "admission_charge_cents correctness (including surge interaction) is asserted with literals 2350/2838 in the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: field_open_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Field.DORMANT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "OPEN -> open is not a declared transition; the second open fails with ERR_INVALID_STATE and no version bump."
        test_recipe:
          setup: ["ACTIVE season; field created and opened once"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager, captures: { f_v_open: $.data.version } }
          trigger:
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "GET /farm/fields/${f_id}", payload: {}, as: FarmManager, captures: { f_v_after: $.data.version, f_status: $.data.status } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "Field.${f_id}.version == ${f_v_open} (rejected transition mutated nothing) and status stays OPEN"

      - name: checkout_cancelled_session_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.VisitSession, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: checkout afterwards is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["full weekday base (ACTIVE season, policy A, OPEN field+window on 2026-08-04); session party 1 containers 0 then CANCELLED"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
            - { call: "POST /farm/visit-sessions/${vs_id}/cancel", payload: {}, as: GateStaff }
          trigger:
            - { call: "POST /farm/visit-sessions/${vs_id}/checkout", payload: {}, as: FieldStaff, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409 (CANCELLED is terminal for the visit axis)"

      - name: window_cancel_with_bookings_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.FieldDayWindow.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Manual cancel requires a SCHEDULED window with booked_slots == 0; an OPEN window holding a session is rejected, while an empty SCHEDULED window cancels cleanly to CANCELLED/MANUAL."
        test_recipe:
          setup: ["full weekday base; window w1 OPEN with one session booked; window w2 on 2026-08-05 SCHEDULED and empty (SalesDay 2026-08-05 PLANNED, staff 3)"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day1: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-05", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day2: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day1}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w1_id: $.data.id } }
            - { call: "POST /farm/field-day-windows/${w1_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-05", open_time: "09:00", close_time: "12:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w2_id: $.data.id } }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id } }
            - { call: "POST /farm/visit-sessions", payload: { window_id: "${w1_id}", waiver_id: "${wv_id}", party_size: 1, container_count: 0, parking_spaces: 0, origin: "ONLINE" }, as: GateStaff, captures: { vs_id: $.data.id } }
          trigger:
            - { call: "POST /farm/field-day-windows/${w1_id}/cancel", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
            - { call: "POST /farm/field-day-windows/${w2_id}/cancel", payload: {}, as: FarmManager, captures: { w2_status: $.data.status, w2_reason: $.data.cancel_reason } }
          assert:
            - "w1 cancel: error_id == ERR_INVALID_STATE (booked_slots 1 > 0 and status OPEN != SCHEDULED), HTTP 409"
            - "w2 cancel: status == CANCELLED and cancel_reason == MANUAL"

      - name: waiver_initial_state_and_double_void_returns_invalid_state
        claim_type: initial_state
        grounds: [state_machines.Waiver.SIGNED_to_VOIDED, entities.Waiver.fields.waiver_version_signed]
        distinguishing_aspect: "A new waiver starts SIGNED with waiver_version_signed equal to the season's current version; voiding twice fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["one ACTIVE season at current_waiver_version 1"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager }
            - { call: "POST /farm/waivers", payload: { season_id: "${s_id}", signer_name: "Ann", signer_email: "ann@x.com", party_member_names: ["Ann"] }, as: Anonymous, captures: { wv_id: $.data.id, wv_status: $.data.status, wv_ver: $.data.waiver_version_signed } }
          trigger:
            - { call: "POST /farm/waivers/${wv_id}/void", payload: {}, as: FarmManager, captures: { wv_status2: $.data.status } }
            - { call: "POST /farm/waivers/${wv_id}/void", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "At creation: status == SIGNED and waiver_version_signed == 1"
            - "After void: status == VOIDED"
            - "Second void: error_id == ERR_INVALID_STATE, HTTP 409"

      - name: window_open_outside_hours_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.FieldDayWindow.SCHEDULED_to_OPEN, "errors[ERR_OUTSIDE_WINDOW_HOURS]", "validations[priority=84]"]
        distinguishing_aspect: "The logical clock must sit inside [open_time, close_time) on the window's date; opening at 08:00 for a 09:00 window fails even with field and day both OPEN."
        test_recipe:
          setup: ["ACTIVE season; field OPEN; SalesDay 2026-08-04 OPEN; window 09:00-17:00 SCHEDULED; clock at 2026-08-04T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T08:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day_id}/open-day", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_OUTSIDE_WINDOW_HOURS, HTTP 422"
            - "FieldDayWindow.${w_id}.status stays SCHEDULED"

      - name: window_open_requires_open_sales_day
        claim_type: precondition_enforcement
        grounds: [state_machines.FieldDayWindow.SCHEDULED_to_OPEN, "errors[ERR_DAY_NOT_OPEN]", "validations[priority=97]"]
        distinguishing_aspect: "A PLANNED (never opened) SalesDay blocks window opening with ERR_DAY_NOT_OPEN even when the clock sits inside the window hours."
        test_recipe:
          setup: ["ACTIVE season; field OPEN; SalesDay 2026-08-04 left PLANNED; window 09:00-17:00 SCHEDULED; clock 2026-08-04T09:30:00Z"]
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 1000 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day_id: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/fields/${f_id}/open", payload: {}, as: FarmManager }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "09:00", close_time: "17:00", picking_capacity_slots: 30 }, as: FarmManager, captures: { w_id: $.data.id } }
          trigger:
            - { call: "POST /farm/field-day-windows/${w_id}/open", payload: {}, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DAY_NOT_OPEN, HTTP 409"

      - name: field_open_blocked_while_rotation_resting
        claim_type: precondition_enforcement
        grounds: [state_machines.Field, "errors[ERR_FIELD_RESTING]", "validations[priority=83]"]
        distinguishing_aspect: "A field in ROTATION_REST (rest_until 2026-08-11) rejected on /open with ERR_FIELD_RESTING on 2026-08-05 — the temporal error, not generic ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Weekday base on 2026-08-04; field estimated 20 oz; session FIELD_ACTIVE with one FINALIZED line net 20 oz -> PICKED_OUT; close-day -> ROTATION_REST rest_until 2026-08-11"
            - "SalesDay 2026-08-05 created and opened (sweep leaves the field ROTATION_REST because 2026-08-05 < 2026-08-11)"
          setup_api_calls:
            - { call: "POST /farm/seasons", payload: { name: "2026 Harvest", start_date: "2026-08-01", end_date: "2026-08-31", waiver_text: "WAIVER-V1" }, as: FarmManager, captures: { s_id: $.data.id, s_v: $.data.version } }
            - { call: "POST /farm/seasons/${s_id}/activate", payload: {}, as: FarmManager, captures: { s_v2: $.data.version } }
            - { call: "POST /farm/pricing-policies", payload: { season_id: "${s_id}", expected_season_version: "${s_v2}", admission_per_person_cents: 650, container_fee_cents: 200, weekend_surge_bps: 12500, bundle_discount_bps: 1000, bundle_cap_cents: 1500 }, as: FarmManager }
            - { call: "POST /farm/crops", payload: { season_id: "${s_id}", name: "Strawberry", price_per_lb_cents: 480 }, as: FarmManager, captures: { crop_id: $.data.id } }
            - { call: "POST /farm/fields", payload: { season_id: "${s_id}", name: "North", rotation_group: "RG1", rotation_order: 1, estimated_harvest_oz: 20 }, as: FarmManager, captures: { f_id: $.data.id } }
            - { call: "POST /farm/sales-days", payload: { season_id: "${s_id}", date: "2026-08-04", day_type: "WEEKDAY", parking_capacity: 50, staff_on_duty: 3 }, as: FarmManager, captures: { day1: $.data.id } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sales-days/${day1}/open-day", payload: {}, as: FarmManager }
