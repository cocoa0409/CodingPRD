            - "POST approve returns 200 and PayBand.${band3}.status == COMP_APPROVED (clamped overlap 0 <= 0.2000 policy)"

      - name: exception_cap_uses_pre_exception_ratio
        grounds:
          - calculations.exception_cap_evaluation
          - calculations.compa_ratio_and_range_position
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          the cap tier derives from the PRE-exception compa-ratio (1.0769 ->
          1.05 multiplier -> cap 15697500), so requesting exactly 15697500
          passes even though the post-exception ratio 1.2075 would select
          the 1.00 tier (cap 14950000) if the order were reversed.
