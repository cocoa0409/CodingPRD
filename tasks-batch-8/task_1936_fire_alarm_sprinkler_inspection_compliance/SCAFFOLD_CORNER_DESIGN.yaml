              as: ContractorAdmin
              as_user_id: "${con_id}"
              captures: { plan2: $.data.id }
          assert:
            - "captured err == ERR_STALE_VERSION (HTTP 412)"
            - "second attempt with fresh version succeeds: captured plan2 is a persisted InspectionPlan id"
