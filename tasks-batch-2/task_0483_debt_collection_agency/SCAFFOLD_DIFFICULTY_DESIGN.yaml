              payload: { account_id: "${acct}", channel: "PHONE", attempted_at: "2026-01-02T15:00:00Z", outcome: "LOGGED" }
              as: Collector
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CEASE_COMMUNICATION"
            - "response status == 409"

      - name: furnish_blocked_by_open_dispute_on_account
        grounds:
          - validations[priority=13]
          - entities.Dispute.fields.status
          - errors[ERR_FURNISH_BLOCKED]
        distinguishing_aspect: |
          Whether a BureauFurnishing may be created depends on the linked Account having no unresolved
          Dispute — a BureauFurnishing<-Account/Dispute cross-entity dependency on a different entity pair
          than CommunicationAttempt<-Account.
        test_recipe:
          setup:
            - "Clock at 2026-01-01T00:00:00Z."
            - "WORKING account with an OPEN ACCURACY dispute (unresolved)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
