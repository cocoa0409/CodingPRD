            - "Hop 3: EquipmentAssignment.${ea1}.status == RELEASED"
            - "Hop 4: EquipmentUnit.${e1}.status == AVAILABLE (freed by the release its own assignment underwent)"

      - name: worker_suspension_bump_redispatch_depth3_cascade
        grounds:
          - state_machines.DispatchAssignment.OFFERED_to_BUMPED
          - calculations.dispatch_selection
          - concurrency_rules[worker-status-stale]
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (worker PATCH to SUSPENDED):
          Worker.status ACTIVE->SUSPENDED -> the worker's OFFERED DispatchAssignment
          flips to BUMPED -> dispatch_selection auto-offer creates a NEW OFFERED
          assignment for the next eligible worker W2 (suspended worker excluded) ->
          GangOrder manning fields recompute. Distinct trigger and propagation pattern
          from the safety cascade.
        test_recipe:
          setup:
            - "Vessel/shift OPEN_FOR_ORDERS; gang G headcount 1 (HOLDMAN, no equipment)"
            - "W1 (rank 1) holds the only OFFERED slot; W2 (rank 2) is next eligible"
