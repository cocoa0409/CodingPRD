  - rule_id: compensating_invariant
    instances:
      - name: payout_balance_conservation
        grounds:
          - state_machines.Payout.PROCESSING_to_PAID
          - entities.Talent.fields.pending_balance_cents
          - entities.Talent.fields.paid_out_balance_cents
        distinguishing_aspect: |
          Conserved quantity: talent earnings balances. Invariant across the
          payout lifecycle: pending_balance_cents + paid_out_balance_cents is
          UNCHANGED by initiate+complete; completing a payout of total T moves
          exactly T from pending to paid (pending' = pending - T,
          paid' = paid + T).
