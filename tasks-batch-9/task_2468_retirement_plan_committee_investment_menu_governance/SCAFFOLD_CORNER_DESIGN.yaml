      - name: manager_change_widens_the_breach_band_by_exactly_the_cure_margin
        claim_type: Constants Applied
        grounds:
          - calculations.watch_recommendation
          - calculations.fund_composite_score
          - entities.InvestmentPolicyStatement.cure_margin_points
        distinguishing_aspect: "manager_change_flag does two independent things and both must be visible: it switches manager_component from min(100.00, 40.00 + tenure*3.0) to min(40.00, tenure*2.0), and it widens the breach test from composite <= 40.00 to composite <= 50.00. Two funds with byte-identical return, peer, expense and style inputs and the same 20-quarter tenure therefore land at 45.00 -> WATCH and 51.00 -> NONE. A model that only lowered the component, or only widened the band, gets one of the two rows wrong."
        test_recipe:
          setup:
            - "chain_l3; IPS-2026-A with watch_trigger_score_max 40.00 and cure_margin_points 10.00."
            - "Shared inputs: excess = round_half_up(0.6*275 + 0.4*275, 0) = 275 -> performance 77.50; peer_rank_pct 100 -> 0.00; net 90 vs median 40 -> 0.00; style 0.9200 -> 100.00; tenure 20 quarters."
            - "With manager_change_flag true: manager min(40.00, 40.00) = 40.00 -> 31.00 + 10.00 + 4.00 = 45.00, which is above the 40.00 trigger but at or below 40.00 + 10.00, so the third breach clause fires."
            - "With manager_change_flag false: manager min(100.00, 100.00) = 100.00 -> 31.00 + 10.00 + 10.00 = 51.00, above every clause."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/quarterly-reviews"
              payload: { plan_id: "${plan_id}", quarter_index: 0 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_m_id: $.data.id, review_m_v0: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_m_id}", fund_id: "${fund_lc_a_id}", expected_review_version: "${review_m_v0}", trailing_return_3y_bps: 1075, trailing_return_5y_bps: 1075, benchmark_return_3y_bps: 800, benchmark_return_5y_bps: 800, peer_rank_pct: 100, style_drift_r2: 0.9200, net_expense_ratio_bps: 90, peer_median_expense_bps: 40, manager_tenure_quarters: 20, manager_change_flag: true }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { sc_mc_true_id: $.data.id }
            - call: "GET /governance/quarterly-reviews/${review_m_id}"
              payload: {}
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { review_m_v1: $.data.version }
            - call: "POST /governance/fund-scorecards"
              payload: { review_id: "${review_m_id}", fund_id: "${fund_bond_a_id}", expected_review_version: "${review_m_v1}", trailing_return_3y_bps: 1075, trailing_return_5y_bps: 1075, benchmark_return_3y_bps: 800, benchmark_return_5y_bps: 800, peer_rank_pct: 100, style_drift_r2: 0.9200, net_expense_ratio_bps: 90, peer_median_expense_bps: 40, manager_tenure_quarters: 20, manager_change_flag: false }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { sc_mc_false_id: $.data.id }
          assert:
            - "FundScorecard.${sc_mc_true_id}: performance_component == 77.50, manager_component == 40.00, composite_score == 45.00 and watch_recommendation == WATCH"
            - "FundScorecard.${sc_mc_false_id}: performance_component == 77.50, manager_component == 100.00, composite_score == 51.00 and watch_recommendation == NONE"
            - "the two rows differ in exactly one input field, manager_change_flag, and in exactly two computed fields, manager_component and composite_score"
            - "both funds are still CLEAR before finalize"

      - name: a_second_consecutive_breach_escalates_to_remediation_and_a_deep_one_terminates
        claim_type: Correct Result
        grounds:
          - calculations.watch_recommendation
          - entities.Fund.consecutive_breach_quarters
          - endpoints.POST_/governance/plans/{planId}/advance-quarter
        distinguishing_aspect: "Rungs (a) and (c) can only be reached by a fund that already carries breach history, so this walks quarter 0's finalize first: SMLVX (WATCH, consecutive_breach_quarters 1) breaching again at 40.00 escalates to REMEDIATION through rung (c) even though 40.00 is far above the remediation trigger, while INTDX (REMEDIATION, consecutive 1) scoring 25.00 satisfies rung (a) and recommends TERMINATE because consecutive_breach_quarters + 1 == 2 reaches watch_grace_quarters. The grace comparison must include the quarter being scored, not the quarters already banked."
        test_recipe:
          setup:
            - "chain_breach replayed, then the trigger head finalizes quarter 0 (SMLVX -> WATCH, INTDX -> REMEDIATION, both with consecutive_breach_quarters 1) and advances the plan to fiscal quarter 1."
