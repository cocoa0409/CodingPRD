  - { id: ERR_INVALID_WIRE_LOT_STATE, http: 409, condition: "The wire lot is not in status DRAWN when release is requested" }
  - { id: ERR_INVALID_SECONDARY_OP_STATE, http: 409, condition: "The secondary operation is no longer PENDING" }
