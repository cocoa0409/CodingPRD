      - name: duty_span_limit_840_boundary
        claim_type: constants_applied
        grounds:
          - calculations.pilot_duty_minutes
          - validations[priority=10]
          - errors[ERR_PILOT_DUTY_LIMIT_EXCEEDED]
          - entities.DutyDay.fields.duty_minutes_projected
        distinguishing_aspect: |
          The DUTY_LIMIT_MIN 840 gate (span == last arrival + 15 minus first
          departure - 45) accepts a day spanning exactly 840 minutes and rejects
          one minute more with ERR_PILOT_DUTY_LIMIT_EXCEEDED — while the 480
          flight-minutes gate passes in both cases.
        test_recipe:
          setup:
            - "Route RD STANDARD 240 min; pilot P; F1 dep 08:00 arr 12:00 on 2026-08-03 (span so far (12:15)-(07:15) == 300)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "RD", tier: "STANDARD", duration_minutes: 240, base_seat_price_cents: 10000, fuel_required_lb: 400, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T08:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T17:01:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T17:00:00Z" }
              as: Dispatcher
              captures: { f2: $.data.id }
            - call: "GET /duty-days?pilot_id=${pilot_id}&duty_date=2026-08-03"
              as: Dispatcher
              captures: { proj: "$.data[0].duty_minutes_projected", sched: "$.data[0].flight_minutes_scheduled" }
          assert:
            - "trigger capture err == ERR_PILOT_DUTY_LIMIT_EXCEEDED (17:01 arrival 21:01 -> span 841 > 840; flight minutes would be 480, allowed)"
            - "F2 at exactly 17:00 succeeded — captured f2 is a UUID (span == 840 exactly, == allowed)"
            - "trigger capture proj == 840 ((21:00 + 15) - (08:00 - 45)) and sched == 480"

