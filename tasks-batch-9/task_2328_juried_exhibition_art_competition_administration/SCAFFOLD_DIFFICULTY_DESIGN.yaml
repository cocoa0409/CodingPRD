  # =========================================================================
  # RULE 6 — boundary_precision_check
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: certified_mean_exactly_at_advance_threshold_shortlists
        grounds:
          - calculations.artwork_round_mean
          - calculations.composite_score
          - state_machines.Artwork[axis=status].SUBMITTED_to_SHORTLISTED
          - state_machines.Artwork[axis=status].SUBMITTED_to_DECLINED
          - entities.Exhibition.fields.advance_score_threshold
        distinguishing_aspect: |
          Three-point boundary on the inclusive advance threshold plus a half-up tie: 7.00 exactly
          equals 7.00 and SHORTLISTS, 6.875 must round to 6.88 (not truncate to 6.87) and DECLINES,
          and 6.975 must round to 6.98 — so the same round proves both the inclusive comparison and
          the round_half_up direction at the 2-dp midpoint.
