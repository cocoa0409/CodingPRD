              as_user_id: "${cust_id}"
              captures: { item_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/tick"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", covered_item_id: "${item_id}", issue_summary: "Belated" }
              as: Customer
