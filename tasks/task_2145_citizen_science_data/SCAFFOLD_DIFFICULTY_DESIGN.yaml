              captures: { v1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Tess Trainer", specialty_taxon: "AVES", verification_weight: 1.00 }
              as: ProgramAdmin
              captures: { et: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Ada Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Bo Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e2: $.data.id }
            - call: "POST /citizen-science/certifications"
              payload: { volunteer_id: "${v1}", protocol_id: "${p1}", trainer_expert_id: "${et}", level: "ADVANCED" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /citizen-science/certifications/${c1}/complete-training"
              payload: { exam_score: 88 }
              as: Expert
              as_user_id: "${et}"
            - call: "POST /citizen-science/certifications/${c1}/grant"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/campaigns"
              payload: { name: "Autumn Count", protocol_id: "${p1}", season_start_date: "2026-08-01", season_end_date: "2026-10-31", target_observations_per_site: 1 }
              as: ProgramAdmin
              captures: { cam1: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/sites"
              payload: { site_code: "S-ONE", latitude: 44.0, longitude: -70.0, habitat_type: "WETLAND", priority_weight: 1.2 }
              as: ProgramAdmin
              captures: { s_one: $.data.id }
            - call: "POST /citizen-science/campaigns/${cam1}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/observations"
              payload: { campaign_id: "${cam1}", site_id: "${s_one}", volunteer_id: "${v1}", observed_at: "2026-08-05T06:00:00Z", latitude: 44.0, longitude: -70.0, species_code: "BAEA", count_value: 3 }
              as: Volunteer
              as_user_id: "${v1}"
              captures: { o1: $.data.id }
            - call: "POST /citizen-science/observations/${o1}/photos"
              payload: { file_hash: "ph-o1-a", captured_at: "2026-08-05T06:05:00Z", exif_latitude: 44.0, exif_longitude: -70.0 }
              as: Volunteer
              as_user_id: "${v1}"
            - call: "POST /citizen-science/observations/${o1}/start-review"
              payload: {}
              as: Expert
              as_user_id: "${e1}"
              captures: { o1_v1: $.data.version }
            - call: "POST /citizen-science/observations/${o1}/votes"
              payload: { decision: "CONFIRM", confidence: 5, expected_observation_version: "${o1_v1}" }
              as: Expert
              as_user_id: "${e1}"
            - call: "GET /citizen-science/observations/${o1}"
              payload: {}
              as: ProgramAdmin
              captures: { o1_v2: $.data.version }
            - call: "POST /citizen-science/observations/${o1}/votes"
              payload: { decision: "CONFIRM", confidence: 5, expected_observation_version: "${o1_v2}" }
              as: Expert
              as_user_id: "${e2}"
            - call: "GET /citizen-science/awards"
              payload: { volunteer_id: "${v1}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /citizen-science/observations/${o1}/retract"
              payload: { reason: "duplicate submission found in the archive" }
              as: ProgramAdmin
            - call: "GET /citizen-science/awards"
              payload: { volunteer_id: "${v1}" }
              as: ProgramAdmin
          assert:
            - "before the retraction Volunteer.${v1}.lifetime_points == 77 and GET /citizen-science/awards?volunteer_id=${v1} returns 2 rows summing to 77"
            - "Observation.${o1}.final_quality_points == 52.80"
            - "after the retraction GET /citizen-science/awards?volunteer_id=${v1} returns 3 rows"
            - "the OBSERVATION_ACCEPTED row has points_awarded == 52 and observation_id == ${o1}"
            - "the MILESTONE row has points_awarded == 25 and observation_id == null"
            - "the REVERSAL row has points_awarded == -52 and observation_id == ${o1}"
            - "sum of points_awarded over all 3 rows == 25"
            - "Volunteer.${v1}.lifetime_points == 25"
            - "Volunteer.${v1}.status == ACTIVE"
            - "Volunteer.${v1}.recognition_tier == BRONZE"

      - name: equipment_custody_ledger_balanced_after_issue_and_return
        grounds:
          - state_machines.EquipmentLoan.REQUESTED_to_ISSUED
          - state_machines.EquipmentLoan.ISSUED_to_RETURNED
          - calculations.equipment_calibration_drift
          - entities.Equipment.fields.total_loan_hours
          - entities.Equipment.fields.calibration_drift_ppm
        distinguishing_aspect: |
          Conserved quantity #2 is physical custody, a different type from reputation points: the
          invariant `count(Equipment WHERE status == ON_LOAN) == count(EquipmentLoan WHERE status
          IN {ISSUED, OVERDUE})` reads 1 == 1 after issue and 0 == 0 after the compensating return,
          and the hour ledger `Equipment.total_loan_hours == SUM(EquipmentLoan.loan_hours WHERE
          status IN {RETURNED, LOST})` lands on 48 with no drift left unattributed.
        test_recipe:
          setup:
            - "Volunteer Vera is ACTIVE and CERTIFIED"
            - "Equipment EQ-004 (ACOUSTIC_RECORDER) is AVAILABLE with calibration_drift_ppm 0.0 and total_loan_hours 0, calibrated until 2027-01-01T00:00:00Z"
            - "Loan L1 for [2026-08-05T12:00:00Z, 2026-08-20T00:00:00Z) exists in status REQUESTED"
            - "Logical clock reads 2026-08-05T09:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/protocols"
              payload: { code: "BBS-2026", title: "Breeding Bird Survey 2026", required_certification_level: "BASIC", min_photo_count: 1, max_submission_lag_hours: 96, required_equipment_type: "NONE", certification_valid_days: 365 }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /citizen-science/protocols/${p1}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/volunteers"
              payload: { full_name: "Vera Finch", email: "vera@example.org", home_region_code: "NE-01" }
              as: ProgramAdmin
              captures: { v1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Tess Trainer", specialty_taxon: "AVES", verification_weight: 1.00 }
              as: ProgramAdmin
              captures: { et: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Ada Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e1: $.data.id }
            - call: "POST /citizen-science/experts"
              payload: { full_name: "Bo Verifier", specialty_taxon: "AVES", verification_weight: 2.00 }
              as: ProgramAdmin
              captures: { e2: $.data.id }
            - call: "POST /citizen-science/certifications"
              payload: { volunteer_id: "${v1}", protocol_id: "${p1}", trainer_expert_id: "${et}", level: "ADVANCED" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /citizen-science/certifications/${c1}/complete-training"
              payload: { exam_score: 88 }
              as: Expert
              as_user_id: "${et}"
            - call: "POST /citizen-science/certifications/${c1}/grant"
              payload: {}
              as: ProgramAdmin
            - call: "POST /citizen-science/equipment"
              payload: { asset_tag: "EQ-004", equipment_type: "ACOUSTIC_RECORDER", calibration_valid_until: "2027-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { eq4: $.data.id, eq4_v: $.data.version }
            - call: "POST /citizen-science/equipment-loans"
              payload: { equipment_id: "${eq4}", volunteer_id: "${v1}", start_at: "2026-08-05T12:00:00Z", due_at: "2026-08-20T00:00:00Z", expected_equipment_version: "${eq4_v}" }
              as: ProgramAdmin
              captures: { l1: $.data.id }
          trigger:
            - call: "POST /citizen-science/equipment-loans/${l1}/issue"
              payload: {}
              as: ProgramAdmin
            - call: "GET /citizen-science/equipment-loans"
              payload: { equipment_id: "${eq4}", status: "ISSUED" }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /citizen-science/equipment-loans/${l1}/return"
              payload: { condition_on_return: "GOOD" }
              as: ProgramAdmin
            - call: "GET /citizen-science/equipment-loans"
              payload: { equipment_id: "${eq4}", status: "ISSUED" }
              as: ProgramAdmin
          assert:
            - "after the issue call Equipment.${eq4}.status == ON_LOAN and GET /citizen-science/equipment-loans?equipment_id=${eq4}&status=ISSUED returns total_count 1"
            - "after the return call Equipment.${eq4}.status == QUARANTINE and GET /citizen-science/equipment-loans?equipment_id=${eq4}&status=ISSUED returns total_count 0"
            - "EquipmentLoan.${l1}.status == RETURNED"
            - "EquipmentLoan.${l1}.condition_on_return == GOOD"
            - "EquipmentLoan.${l1}.loan_hours == 48"
            - "EquipmentLoan.${l1}.drift_added_ppm == 36.00"
            - "Equipment.${eq4}.total_loan_hours == 48"
            - "Equipment.${eq4}.calibration_drift_ppm == 36.00"
            - "Equipment.${eq4}.quarantine_until == 2026-08-09T09:00:00.000Z"
