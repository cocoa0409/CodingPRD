  - section: state_machines
    instances:

      - name: initial_states_are_pinned_for_every_entity_with_a_state_machine
        claim_type: initial_state
        grounds:
          - state_machines.TitleApproval.initial_state
          - state_machines.Season.initial_state
          - state_machines.Team.initial_state
          - state_machines.RosterSlot.initial_state
          - state_machines.Match.initial_state
          - state_machines.FairPlayCase.initial_state
        distinguishing_aspect: |
          Six machines, six initial states, and the Match machine carries FOUR
          independent initial dimensions (play SCHEDULED, result AWAITING_REPORTS,
          dispute NONE, broadcast NONE) that must all be set at creation rather than
          left null until the first transition.
        test_recipe:
          setup:
            - "One district, school and coach; one title; one season; one PENDING title approval; one student; two DRAFT teams; one roster slot; one match; one fair-play case"
            - "No transition endpoint is ever called, so every entity is observed exactly as created"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
