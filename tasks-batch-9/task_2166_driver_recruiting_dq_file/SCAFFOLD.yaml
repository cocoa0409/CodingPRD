      - "on VERIFIED_NEGATIVE, sets the DRUG_TEST_RESULT DqDocument to PRESENT, recomputes DqFile completeness/status, increments DqFile.version by 1 and re-evaluates SCREENING -> SCREEN_CLEARED"
      - "on VERIFIED_POSITIVE, cascades the application to SCREEN_FAILED / DISQUALIFIED / DqFile ARCHIVED"

  # ---- RoadTest ------------------------------------------------------------
  - method: POST
    path: "/road-tests"
    description: "Schedules a road test in an examiner's 180-minute closed slot."
    roles: [Recruiter]
    code: 201
    input: [application_id, examiner_user_id, scheduled_at, vehicle_class]
    output: RoadTest
    side_effects: ["sets attempt_number to 1"]

  - method: GET
    path: "/road-tests/{road_test_id}"
    description: "Reads one road test."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: RoadTest
    side_effects: []

  - method: GET
    path: "/road-tests"
    description: "Lists road tests; application_id is the reverse-reachability filter, examiner_user_id exposes an examiner's slot book."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["application_id?", "examiner_user_id?", "status?", "limit?", "offset?"]
    output: RoadTest[]
    side_effects: []

  - method: POST
    path: "/road-tests/{road_test_id}/record-result"
    description: "SCHEDULED -> PASSED / FAILED / NO_SHOW. outcome is one of {PASSED, FAILED, NO_SHOW}; the three sub-scores are required for PASSED and FAILED and omitted for NO_SHOW."
    roles: [SafetyDirector]
    code: 200
    input: [outcome, "score_pretrip?", "score_skills?", "score_road?"]
    output: RoadTest
    side_effects:
      - "computes composite_score (calculations.road_test_composite_score)"
      - "on PASSED, advances DriverApplication.qualification_status to ROAD_TEST_PASSED, sets the ROAD_TEST_CERT DqDocument to PRESENT, recomputes DqFile completeness/status and increments DqFile.version by 1"

  - method: POST
    path: "/road-tests/{road_test_id}/reschedule"
    description: "FAILED/NO_SHOW -> SCHEDULED; the retest cycle, capped at three attempts."
    roles: [Recruiter]
    code: 200
    input: [scheduled_at, examiner_user_id]
    output: RoadTest
    side_effects: ["increments attempt_number by 1", "clears the three sub-scores and composite_score to null"]

  # ---- OrientationSession / OrientationEnrollment --------------------------
  - method: POST
    path: "/orientation-sessions"
    description: "Creates a PLANNED orientation class over a half-open [starts_at, ends_at) interval."
    roles: [Recruiter]
    code: 201
    input: [carrier_id, starts_at, ends_at, capacity, location_code]
    output: OrientationSession
    side_effects: ["sets enrolled_count to 0"]

  - method: GET
    path: "/orientation-sessions/{session_id}"
    description: "Reads one orientation session."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: OrientationSession
    side_effects: []

  - method: GET
    path: "/orientation-sessions"
    description: "Lists orientation sessions; carrier_id is the reverse-reachability filter."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: OrientationSession[]
    side_effects: []

  - method: POST
    path: "/orientation-sessions/{session_id}/open"
    description: "PLANNED -> OPEN; enrollment is only accepted while the session is OPEN."
    roles: [Recruiter]
    code: 200
    input: []
    output: OrientationSession
    side_effects: ["increments version by 1"]

  - method: POST
    path: "/orientation-sessions/{session_id}/complete"
    description: "OPEN -> COMPLETED; marks listed enrollments ATTENDED and the rest ABSENT."
    roles: [Recruiter]
    code: 200
    input: [attended_enrollment_ids]
    output: OrientationSession
    side_effects:
      - "sets each listed enrollment to ATTENDED and every other RESERVED enrollment to ABSENT"
      - "advances each attended application ROAD_TEST_PASSED -> ORIENTATION_COMPLETE and re-evaluates the QUALIFIED join"
      - "increments version by 1"

  - method: POST
    path: "/orientation-enrollments"
    description: "Reserves a seat under OCC on the session version; enforces buffered overlap and aggregate capacity."
    roles: [Recruiter]
    code: 201
    input: [session_id, application_id, expected_session_version]
    output: OrientationEnrollment
    side_effects: ["increments OrientationSession.enrolled_count by 1", "increments OrientationSession.version by 1"]

  - method: GET
    path: "/orientation-enrollments/{enrollment_id}"
    description: "Reads one enrollment."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: OrientationEnrollment
    side_effects: []

  - method: GET
    path: "/orientation-enrollments"
    description: "Lists enrollments; session_id and application_id are the reverse-reachability filters."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["session_id?", "application_id?", "status?", "limit?", "offset?"]
    output: OrientationEnrollment[]
    side_effects: []

  - method: POST
    path: "/orientation-enrollments/{enrollment_id}/cancel"
    description: "RESERVED -> CANCELLED; releases the seat."
    roles: [Recruiter]
    code: 200
    input: [reason]
    output: OrientationEnrollment
    side_effects: ["decrements OrientationSession.enrolled_count by 1", "increments OrientationSession.version by 1"]

  # ---- DqFile / DqDocument -------------------------------------------------
  - method: GET
    path: "/dq-files/{dq_file_id}"
    description: "Reads one DQ file with both state axes, completeness_pct and the review schedule."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: DqFile
    side_effects: ["recomputes review_state (calculations.dq_review_schedule) without incrementing version"]

  - method: GET
    path: "/dq-files"
    description: "Lists DQ files; application_id is the reverse-reachability filter."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["application_id?", "status?", "review_state?", "limit?", "offset?"]
    output: DqFile[]
    side_effects: []

  - method: GET
    path: "/dq-files/{dq_file_id}/completeness"
    description: "Computed read of calculations.dq_completeness_score; variant is one of {pre_hire_provisional, annual_review_final} and defaults to pre_hire_provisional."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, completeness_pct: number, deficiency_count: integer, satisfied_weight: integer, denominator_weight: integer, missing_doc_types: string[] }"
    side_effects: []

  - method: POST
    path: "/dq-files/{dq_file_id}/annual-review"
    description: "Certifies the annual review; requires review_state DUE or OVERDUE, a current MVR, and an auditor who is not the recruiter."
    roles: [ComplianceAuditor]
    code: 200
    input: [certification_note]
    output: DqFile
    side_effects:
      - "sets last_annual_review_at and certified_by_user_id"
      - "sets the MVR_ANNUAL and ANNUAL_REVIEW_CERT DqDocuments to PRESENT"
      - "recomputes next_review_due_on, review_state, completeness_pct and deficiency_count"
      - "increments DqFile.version by 1"

  - method: POST
    path: "/dq-files/{dq_file_id}/revoke-certification"
    description: "Compensating inverse of annual-review; restores every field and document the certification wrote."
    roles: [ComplianceAuditor]
    code: 200
    input: [reason]
    output: DqFile
    side_effects:
      - "clears last_annual_review_at and certified_by_user_id"
      - "sets the MVR_ANNUAL and ANNUAL_REVIEW_CERT DqDocuments back to MISSING with effective_on null"
      - "recomputes next_review_due_on from opened_on, review_state, completeness_pct and deficiency_count"
      - "increments DqFile.version by 1"

  - method: GET
    path: "/dq-documents/{document_id}"
    description: "Reads one DQ document row."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: []
    output: DqDocument
    side_effects: []

  - method: GET
    path: "/dq-documents"
    description: "Lists DQ documents; dq_file_id is the reverse-reachability filter and doc_type selects a single artifact."
    roles: [Recruiter, DER, SafetyDirector, ComplianceAuditor, SchoolCoordinator, Applicant]
    code: 200
    input: ["dq_file_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: DqDocument[]
    side_effects: []

  - method: PUT
    path: "/dq-documents/{document_id}"
    description: "Files or waives one DQ artifact under OCC on the parent DqFile's version."
    roles: [Recruiter]
    code: 200
    input: [status, expected_dq_file_version, "effective_on?", "expires_on?", "source_ref?"]
    output: DqDocument
    side_effects:
      - "recomputes DqFile.completeness_pct, deficiency_count and status (calculations.dq_completeness_score)"
      - "increments DqFile.version by 1"
      - "recomputes DriverApplicant.cdl_downgrade_risk when doc_type == MEDICAL_CERT"
      - "re-evaluates DriverApplication ORIENTATION_COMPLETE -> QUALIFIED and Carrier.posture"

