          - endpoints.POST__clock_set_current_utc
        distinguishing_aspect: "POST /_clock/set_current_utc is listed as a shared operation for exactly MillPlanner, EnvironmentalOfficer and EnergyManager. All three must succeed and the fourth actor tried here — MachineOperator, who is otherwise a heavy writer — must be refused, so the endpoint's roles list is enumerated positively and negatively in one recipe."
        test_recipe:
          setup: ["An empty system; only the logical clock is exercised."]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
