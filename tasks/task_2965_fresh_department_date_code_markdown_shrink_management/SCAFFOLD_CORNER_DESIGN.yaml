          The link endpoint needs both endpoints of the association to exist and it freezes the
          price at link time: an unknown lot_id is ERR_LOT_NOT_FOUND (404) with the pickup still
          at assignment_count 0, and the successful link snapshots unit_price_cents_snapshot 599
          into the line so a later markdown of the same lot cannot move line_value_cents.
        test_recipe:
