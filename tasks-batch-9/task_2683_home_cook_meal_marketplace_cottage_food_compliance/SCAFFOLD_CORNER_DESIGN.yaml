            - call: POST /refund-events
              payload: { order_id: "${o_id}", reason: "SAFETY", fault_party: "PLATFORM", refund_amount_cents: 100, settle_immediately: true, safety_incident_id: "${inc_id}" }
              as: FinanceOperator
              as_user_id: fin-1
              captures: { re_status: "$.data.status", re_commission: "$.data.commission_reversed_cents", re_cook: "$.data.cook_chargeback_cents", re_absorbed: "$.data.platform_absorbed_cents" }
            - call: GET /orders/${o_id}
              payload: {}
              as: FinanceOperator
              as_user_id: fin-1
              captures: { o_refunded: "$.data.refunded_cents", o_payment: "$.data.payment_status", o_commission_rev: "$.data.commission_reversed_cents" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: FinanceOperator
              as_user_id: fin-1
              captures: { ytd_now: "$.data.ytd_cottage_revenue_cents", pending_now: "$.data.pending_payout_cents" }
            - call: GET /cooks/${cook_id}/compliance-summary
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { sum_ytd: "$.data.ytd_cottage_revenue_cents", sum_remaining: "$.data.cap_remaining_cents", sum_score: "$.data.safety_score", sum_prov: "$.data.provisional_safety_score", sum_open: "$.data.open_incident_count" }
          assert:
            - "${inc_status} == SUBSTANTIATED with ${inc_at} non-null on the adjudication response itself"
            - "${score_now} == 88 and ${stand_now} == CLEAR on the very first read of the cook - the re-score is not deferred"
            - "refund response: ${re_status} == SETTLED, ${re_commission} == 100, ${re_cook} == 0, ${re_absorbed} == 0 - a PLATFORM-fault waterfall skips the cook bucket entirely"
            - "${o_refunded} == 100, ${o_commission_rev} == 100 and ${o_payment} == PARTIALLY_REFUNDED on the first read of the order"
            - "${ytd_now} == 700 == 800 - 0 - 100 on the first read of the cook: recognized revenue nets the reversed commission immediately"
