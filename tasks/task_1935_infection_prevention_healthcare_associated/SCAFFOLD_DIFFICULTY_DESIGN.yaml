        as: InfectionPreventionist
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-06T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/infection-cases
        payload:
          patient_id: ${pat_2}
          case_type: CLABSI
          suspected_organism: Klebsiella pneumoniae
