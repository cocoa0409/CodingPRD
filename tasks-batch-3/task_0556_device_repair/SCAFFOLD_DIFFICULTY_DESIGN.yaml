          - entities.Customer.fields.store_credit_balance_cents
          - state_machines.TradeIn.OFFER_MADE_to_ACCEPTED
        distinguishing_aspect: "Conserved quantity = store credit (money, distinct from inventory units): Customer.store_credit_balance_cents returns to 0 after an accept (+45000) is compensated by a trade-in cancel (-45000)."
        test_recipe:
          setup:
            - "Customer credit 0; trade-in offered grade A (final 45000 on a 50000 device), accepted (+45000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ra", email: "ra@x.com", phone: "555" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /devices"
              payload: { customer_id: "${cust}", category: "PHONE", brand: "Acme", model: "Z19", serial_number: "SN20", market_value_cents: 50000 }
              as: ServiceAdvisor
              captures: { dev: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tr", certification_level: "STANDARD" }
              as: StoreManager
              captures: { tech: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${cust}", device_id: "${dev}", declared_grade: "A" }
              as: ServiceAdvisor
              captures: { ti: $.data.id }
            - call: "POST /trade-ins/${ti}/offer"
              payload: { assessed_grade: "A", has_accessories: false, assessed_cosmetic_defect_count: 0 }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /trade-ins/${ti}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /trade-ins/${ti}/cancel"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "Customer.${cust}.store_credit_balance_cents == 0"
            - "TradeIn.${ti}.status == CANCELLED"
