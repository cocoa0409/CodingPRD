            - "${m2_upgrade_total} == 2800 — the second fill draws 100.00 EXACT from ${b3_id} (delta 0) then 100.00 WEAR_LAYER_UPGRADE from ${b1_id} (100.00 * 28 == 2800)"
            - "GET /allocations/${al_m2_id}/lines returns total_count == 2 and the line on ${b1_id} has substitution_kind == WEAR_LAYER_UPGRADE and upgrade_cost_delta_cents == 2800"
            - "Batch.${b1_id}.available_quantity_sqm == 200.00 after the second fill"
            - "Allocation.${al_m2_id}.allocated_quantity_sqm == 200.00 and Allocation.${al_m2_id}.status == FILLED"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: formulation_rejected_to_draft_revision_loop_preserves_rejection_count
        grounds:
          - state_machines.Formulation.UNDER_REVIEW_to_REJECTED
          - state_machines.Formulation.REJECTED_to_DRAFT
          - state_machines.Formulation.DRAFT_to_UNDER_REVIEW
          - state_machines.Formulation.UNDER_REVIEW_to_APPROVED
          - entities.Formulation.fields.rejection_count
          - calculations.formulation_blend_metrics
        distinguishing_aspect: |
          CYCLE on Formulation: REJECTED returns to DRAFT through a component edit
          rather than through a dedicated transition, and the loop is traversed
          twice. rejection_count is a monotone loop counter that neither return to
          DRAFT resets, so after two rejections and a final approval it reads
          exactly 2 while status is APPROVED and revision is still 1.
        test_recipe:
          setup:
            - "RM-RESIN and RM-STAB ACTIVE"
            - "Formulation F-CYC in DRAFT holding a single resin component at 100 phr (performance_score 89.50)"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - call: "POST /formulations"
              payload: { formulation_code: "F-CYC" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_cyc_id: $.data.id }
            - call: "POST /formulations/${f_cyc_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
              captures: { cyc_resin_c_id: $.data.id }
          trigger:
            - call: "POST /formulations/${f_cyc_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_cyc_id}/review-decision"
              payload: { decision: "REJECT", review_note: "no stabiliser package" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { rej1_status: $.data.status, rej1_count: $.data.rejection_count }
            - call: "POST /formulations/${f_cyc_id}/components"
              payload: { raw_material_id: "${rm_stab_id}", phr: 3 }
              as: Formulator
              as_user_id: "form-001"
              captures: { cyc_stab_c_id: $.data.id }
            - call: "GET /formulations/${f_cyc_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { back_to_draft_status: $.data.status }
            - call: "POST /formulations/${f_cyc_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_cyc_id}/review-decision"
              payload: { decision: "REJECT", review_note: "stabiliser dosage above target cost" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { rej2_count: $.data.rejection_count }
            - call: "DELETE /formulations/${f_cyc_id}/components/${cyc_stab_c_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { second_draft_status: $.data.status }
            - call: "POST /formulations/${f_cyc_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_cyc_id}/review-decision"
              payload: { decision: "APPROVE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { final_status: $.data.status, final_count: $.data.rejection_count, final_score: $.data.performance_score }
          assert:
            - "${rej1_status} == REJECTED and ${rej1_count} == 1"
            - "${back_to_draft_status} == DRAFT — adding a component to a REJECTED recipe returns it to DRAFT with no dedicated endpoint"
            - "after the first return to DRAFT, Formulation.${f_cyc_id}.rejection_count == 1 (not reset)"
            - "${rej2_count} == 2"
            - "${second_draft_status} == DRAFT — deleting a component also closes the loop"
            - "${final_status} == APPROVED and ${final_count} == 2"
            - "${final_score} == 89.50 (resin-only blend: 0.40*90 + 0.35*85 + 0.25*95, no penalties)"
            - "Formulation.${f_cyc_id}.blended_cost_per_kg_cents == 180"
            - "Formulation.${f_cyc_id}.total_phr == 100.00 and resin_phr == 100.00"
            - "Formulation.${f_cyc_id}.indentation_resistance_class == CLASS_34_43"
            - "Formulation.${f_cyc_id}.revision == 1 — the loop is not a revision; open_revision_count == 0"
            - "Formulation.${f_cyc_id}.cost_basis == PINNED and FormulationComponent.${cyc_resin_c_id}.material_cost_snapshot_cents == 180"

      - name: test_panel_marginal_retest_loop_terminates_at_max_retests
        grounds:
          - state_machines.TestPanel.IN_TEST_to_RETEST_REQUIRED
          - state_machines.TestPanel.RETEST_REQUIRED_to_IN_TEST
          - errors.ERR_RETEST_LIMIT_EXCEEDED
          - entities.TestPanel.fields.attempt_no
          - entities.TestPanel.fields.retest_count
          - calculations.test_spec_limit_and_outcome
          - validations[V-CON-8]
        distinguishing_aspect: |
          CYCLE on TestPanel with a bounded loop counter: an identical MARGINAL
          measurement of exactly 0.1050 mm (the marginal_edge of the 0.10 limit)
          drives IN_TEST -> RETEST_REQUIRED -> IN_TEST twice, walking attempt_no to
          exactly 3 and retest_count to exactly 3, and the FOURTH start of the same
          panel is refused with ERR_RETEST_LIMIT_EXCEEDED. The identical request
          (POST /test-panels/{id}/start with an empty body) succeeds three times and
          then fails purely because of the loop counter, and the panel is parked in
          RETEST_REQUIRED rather than driven to a terminal state.
        test_recipe:
          setup:
            - "SKU-A in certification_status TESTING under APPROVED F-MIN (CLASS_34_43), so required_test_types == ['RESIDUAL_INDENTATION','DIMENSIONAL_STABILITY_HEAT']"
            - "spec limits: RESIDUAL_INDENTATION 0.10 mm with marginal_edge 0.1050; DIMENSIONAL_STABILITY_HEAT 0.25 PCT for GLUE_DOWN"
            - "TestPanel TP-RT SCHEDULED for SKU-A"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - call: "POST /test-panels"
              payload: { panel_code: "TP-RT", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_rt_id: $.data.id, rt_required: $.data.required_test_types }
          trigger:
            - call: "POST /test-panels/${tp_rt_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_attempt_1: $.data.attempt_no }
            - call: "POST /test-panels/${tp_rt_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.1050 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_r1_outcome: $.data.outcome, rt_r1_limit: $.data.spec_limit }
            - call: "POST /test-panels/${tp_rt_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.12 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "GET /test-panels/${tp_rt_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_status_1: $.data.status, rt_count_1: $.data.retest_count }
            - call: "POST /test-panels/${tp_rt_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_attempt_2: $.data.attempt_no }
            - call: "POST /test-panels/${tp_rt_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.1050 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_rt_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.12 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "GET /test-panels/${tp_rt_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_status_2: $.data.status, rt_count_2: $.data.retest_count }
            - call: "POST /test-panels/${tp_rt_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_attempt_3: $.data.attempt_no }
            - call: "POST /test-panels/${tp_rt_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.1050 }
              as: QaTechnician
              as_user_id: "qa-001"
            - call: "POST /test-panels/${tp_rt_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.12 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_last_outcome: $.data.outcome }
            - call: "GET /test-panels/${tp_rt_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_status_3: $.data.status, rt_count_3: $.data.retest_count }
            - call: "POST /test-panels/${tp_rt_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rt_limit_error: $.data.error_id }
            - call: "GET /test-panels/${tp_rt_id}/results"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
          assert:
            - "${rt_required} == ['RESIDUAL_INDENTATION', 'DIMENSIONAL_STABILITY_HEAT']"
            - "${rt_attempt_1} == 1, ${rt_attempt_2} == 2, ${rt_attempt_3} == 3"
            - "${rt_r1_limit} == 0.10 and ${rt_r1_outcome} == MARGINAL (0.1050 is above the limit but at the marginal_edge)"
            - "${rt_status_1} == RETEST_REQUIRED and ${rt_count_1} == 1"
            - "${rt_status_2} == RETEST_REQUIRED and ${rt_count_2} == 2"
            - "${rt_status_3} == RETEST_REQUIRED and ${rt_count_3} == 3 — a MARGINAL never fails a panel, so the third round loops like the first two"
            - "${rt_last_outcome} == PASS — the DIMENSIONAL_STABILITY_HEAT result itself passes; it is the accumulated MARGINAL that drives the loop"
            - "the fourth POST /test-panels/${tp_rt_id}/start returns HTTP 422 with ${rt_limit_error} == ERR_RETEST_LIMIT_EXCEEDED (retest_count 3 > MAX_RETESTS 2)"
            - "TestPanel.${tp_rt_id}.status == RETEST_REQUIRED and attempt_no == 3 after the refusal — the rejected start neither incremented attempt_no nor moved the panel"
            - "TestPanel.${tp_rt_id}.retest_count == 3"
            - "GET /test-panels/${tp_rt_id}/results returns total_count == 6 (two results at each of attempt_no 1, 2 and 3)"
            - "ProductSku.${sku_a_id}.certification_status == TESTING — no FAIL outcome was ever recorded, so the SKU never lost certification"

