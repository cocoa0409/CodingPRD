              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_a_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Bell Appliance Service", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_b_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_b_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-4007" }
              as: Servicer
              as_user_id: "${acct_b_id}"
