            - "first complete: err == ERR_ADVANCE_OUTSTANDING (Contract gated by AdvancePayment state)"
            - "after return of 144000: adv_st2 == CLOSED; second complete: con_st == COMPLETED"
            - "pool: oblig == 0, paid == 36000 (180000 advance - 144000 returned), avail == 464000; invariant 500000 == 464000 + 0 + 36000"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: program_window_touching_conflict_inclusive
        grounds:
          - validations[priority=10]
          - errors[ERR_WINDOW_OVERLAP]
          - entities.ConservationProgram.fields.window_start
        distinguishing_aspect: |
          Resource = (state_code) application windows; semantics = CLOSED
          intervals: touching endpoints count as overlap. P2 [2026-09-01, ...]
          conflicts with P1 [..., 2026-09-01]; P3 starting 2026-09-02 succeeds;
          P4 in another state with identical window succeeds.
        test_recipe:
          setup: ["Program P1 exists with window 2026-08-01..2026-09-01 in state IA"]
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P1", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /eqip/programs", payload: { program_name: "P2", fiscal_year: 2026, state_code: "IA", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }, as: ProgramAdmin, captures: { err2: $.data.error_id } }
            - { call: "POST /eqip/programs", payload: { program_name: "P3", fiscal_year: 2026, state_code: "IA", window_start: "2026-09-02T00:00:00Z", window_end: "2026-10-01T00:00:00Z" }, as: ProgramAdmin, captures: { p3: $.data.id } }
            - { call: "POST /eqip/programs", payload: { program_name: "P4", fiscal_year: 2026, state_code: "NE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { p4: $.data.id } }
          assert:
            - "err2 == ERR_WINDOW_OVERLAP (touching at 2026-09-01T00:00:00Z conflicts — inclusive endpoints)"
            - "P3 created (201) — 2026-09-02 start is disjoint"
            - "P4 created (201) — different state_code resource, identical window irrelevant"

      - name: obligation_overlap_half_open_adjacency
        grounds:
          - calculations.maintenance_window
          - errors[ERR_OBLIGATION_OVERLAP]
          - state_machines.MaintenanceObligation.ACTIVE_to_SATISFIED
        distinguishing_aspect: |
          Resource = (parcel_id, practice_code) maintenance obligation interval;
          semantics = HALF-OPEN [start, end) — opposite of the sibling's closed
          program windows. Certification at 2026-11-01 collides (existing end
          2031-09-30 > 2026-11-01) -> rejected; certification at exactly
          end_date 2031-09-30 is adjacent and ALLOWED (end > new_start fails at
          equality).
        test_recipe:
          setup:
            - "One program; applicant with parcels P-300, P-301; TWO SELECTED applications each planning COVER_CROP (lifespan 5y); C1 item certified at 2026-10-01 creating obligation [2026-10-01, 2031-09-30); C2 item INSTALLED awaiting certification"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-300", "P-301"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-300", planned_practices: [ { practice_code: "COVER_CROP", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 30 } }, as: Applicant, as_user_id: "${a1}", captures: { appa: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-301", planned_practices: [ { practice_code: "COVER_CROP", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 20 } }, as: Applicant, as_user_id: "${a1}", captures: { appb: $.data.id } }
            - { call: "POST /eqip/applications/${appa}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${appb}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${appa}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 30 } }, as: ConservationPlanner }
            - { call: "POST /eqip/applications/${appb}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 20 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appa}" }, as: ConservationPlanner, captures: { cona: $.data.id } }
            - { call: "POST /eqip/contracts/${cona}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 10, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { ita: $.data.id } }
            - { call: "POST /eqip/contracts/${cona}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${appb}" }, as: ConservationPlanner, captures: { conb: $.data.id } }
            - { call: "POST /eqip/contracts/${conb}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 10, implementation_deadline: "2032-06-01T00:00:00Z" }, as: ConservationPlanner, captures: { itb: $.data.id } }
            - { call: "POST /eqip/contracts/${conb}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /eqip/practice-items/${ita}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/practice-items/${ita}/certify", payload: { certified_quantity: 10 }, as: ConservationPlanner, as_user_id: "planner-1" }
            - { call: "POST /eqip/practice-items/${itb}/report-installed", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /eqip/practice-items/${itb}/certify", payload: { certified_quantity: 10 }, as: ConservationPlanner, as_user_id: "planner-1", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2031-09-30T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /eqip/maintenance-obligations", payload: { practice_item_id: "${ita}" }, as: ProgramAdmin, captures: { obl1_st: "$.data[0].status", obl1_end: "$.data[0].end_date" } }
            - { call: "POST /eqip/practice-items/${itb}/certify", payload: { certified_quantity: 10 }, as: ConservationPlanner, as_user_id: "planner-1", captures: { itb_cs: $.data.certification_status } }
            - { call: "GET /eqip/maintenance-obligations", payload: { practice_item_id: "${itb}" }, as: ProgramAdmin, captures: { obl2_end: "$.data[0].end_date", obl2_st: "$.data[0].status" } }
          assert:
            - "overlap rejected: err == ERR_OBLIGATION_OVERLAP (existing obligation end 2031-09-30 > certification instant 2026-11-01)"
            - "obl1_end == 2031-09-30T00:00:00Z (2026-10-01 + 5*365d) and obl1_st == SATISFIED after sweep at 2031-09-30 (clock >= end_date)"
            - "adjacent certification succeeds: itb_cs == CERTIFIED at exactly 2031-09-30 (half-open: end_date == new start does not block)"
            - "obl2_st == ACTIVE and obl2_end == 2036-09-28T00:00:00Z (2031-09-30 + 1825 days)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: pool_trichotomy_conservation_obligate_then_terminate
        grounds:
          - calculations.pool_available
          - state_machines.Contract.OBLIGATED_to_TERMINATED
          - entities.FundingPool.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity = pool money trichotomy: allocated == available +
          obligated + paid. Forward action (obligate 450000) paired with its
          compensating action (terminate releasing 450000) returns every bucket
          to its exact pre-pair value; the invariant holds at every step.
        test_recipe:
          setup:
            - "Pool 1000000; contract with FENCE 1000 (300000) + COVER_CROP 10 (150000); OBLIGATED"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "GENERAL", allocated_cents: 1000000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "COVER_CROP", unit: "ACRE", standard_rate_cents: 15000, hu_rate_cents: 18000, lifespan_years: 5 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "A One", hu_category: "NONE", parcel_ids: ["P-100"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-100", planned_practices: [ { practice_code: "FENCE", quantity: 1000 }, { practice_code: "COVER_CROP", quantity: 10 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { itf: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "COVER_CROP", planned_quantity: 10, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { itc: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { oblig1: $.data.obligated_cents, paid1: $.data.paid_cents, avail1: $.data.available_cents } }
          trigger:
            - { call: "POST /eqip/contracts/${con}/terminate", payload: {}, as: ProgramAdmin, captures: { con_st: $.data.status } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { oblig2: $.data.obligated_cents, paid2: $.data.paid_cents, avail2: $.data.available_cents } }
            - { call: "GET /eqip/practice-items/${itf}", payload: {}, as: ProgramAdmin, captures: { itf_st: $.data.certification_status } }
          assert:
            - "after obligate: oblig1 == 450000, paid1 == 0, avail1 == 550000; invariant 1000000 == 550000 + 450000 + 0"
            - "con_st == TERMINATED; itf_st == CANCELLED"
            - "after terminate (compensating action): oblig2 == 0, paid2 == 0, avail2 == 1000000 — exact restoration, zero drift"
            - "invariant holds post-compensation: 1000000 == 1000000 + 0 + 0"

      - name: advance_issue_return_neutralizes_pool_paid
        grounds:
          - calculations.advance_outstanding
          - state_machines.AdvancePayment.ISSUED_to_CLOSED
          - entities.AdvancePayment.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity = net cash outflow (pool.paid_cents) — a different
          quantity than the sibling's bucket trichotomy identity. Issue 180000
          (paid: 0 -> 180000) paired with full return (paid: 180000 -> 0) leaves
          paid_cents exactly as before the pair; advance fields satisfy
          issued == applied + returned + outstanding at every step.
        test_recipe:
          setup:
            - "HU contract OBLIGATED (FENCE 1000 = 360000); pool HU 500000; advance 180000 ISSUED at default clock"
          setup_api_calls:
            - { call: "POST /eqip/programs", payload: { program_name: "P", fiscal_year: 2026, state_code: "IA", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/pools", payload: { pool_type: "HU_LIMITED_RESOURCE", allocated_cents: 500000 }, as: ProgramAdmin, captures: { pool: $.data.id } }
            - { call: "POST /eqip/programs/${prog}/rates", payload: { practice_code: "FENCE", unit: "FOOT", standard_rate_cents: 300, hu_rate_cents: 360, lifespan_years: 10 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/ranking-criteria", payload: { criterion_code: "SOIL_HEALTH", weight: 1.0, max_points: 40 }, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/open", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/applicants", payload: { legal_name: "H U", hu_category: "LIMITED_RESOURCE", parcel_ids: ["P-200"] }, as: ProgramAdmin, captures: { a1: $.data.id } }
            - { call: "POST /eqip/applications", payload: { program_id: "${prog}", applicant_id: "${a1}", parcel_id: "P-200", planned_practices: [ { practice_code: "FENCE", quantity: 1000 } ], self_reported_answers: { SOIL_HEALTH: 10 } }, as: Applicant, as_user_id: "${a1}", captures: { app: $.data.id } }
            - { call: "POST /eqip/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${a1}" }
            - { call: "POST /eqip/applications/${app}/screen", payload: { decision: "SCREENED_IN", verified_answers: { SOIL_HEALTH: 10 } }, as: ConservationPlanner }
            - { call: "POST /eqip/programs/${prog}/close", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/programs/${prog}/run-ranking", payload: {}, as: ProgramAdmin }
            - { call: "POST /eqip/contracts", payload: { application_id: "${app}" }, as: ConservationPlanner, captures: { con: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/practice-items", payload: { practice_code: "FENCE", planned_quantity: 1000, implementation_deadline: "2027-03-01T00:00:00Z" }, as: ConservationPlanner, captures: { item: $.data.id } }
            - { call: "POST /eqip/contracts/${con}/obligate", payload: {}, as: ProgramAdmin }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { paid0: $.data.paid_cents, oblig0: $.data.obligated_cents, avail0: $.data.available_cents } }
            - { call: "POST /eqip/contracts/${con}/advance-payments", payload: { practice_item_id: "${item}", issued_cents: 180000 }, as: PaymentOfficer, captures: { adv: $.data.id, adv_out0: $.data.outstanding_cents } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { paid1: $.data.paid_cents, oblig1: $.data.obligated_cents, avail1: $.data.available_cents } }
          trigger:
            - { call: "POST /eqip/advance-payments/${adv}/return", payload: { amount_cents: 180000 }, as: Applicant, as_user_id: "${a1}", captures: { adv_st: $.data.status, adv_ret: $.data.returned_cents, adv_out: $.data.outstanding_cents } }
            - { call: "GET /eqip/pools/${pool}", payload: {}, as: ProgramAdmin, captures: { paid2: $.data.paid_cents, oblig2: $.data.obligated_cents, avail2: $.data.available_cents } }
          assert:
            - "baseline: paid0 == 0, oblig0 == 360000, avail0 == 140000"
            - "after issue: paid1 == 180000, oblig1 == 180000, avail1 == 140000; adv_out0 == 180000 (180000 == 0 + 0 + 180000)"
            - "after full return (compensating action): adv_st == CLOSED, adv_ret == 180000, adv_out == 0 (180000 == 0 + 180000 + 0)"
            - "pool net cash outflow restored: paid2 == 0 == paid0; oblig2 == 360000; avail2 == 140000 — pair is exactly neutral"
