  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: menu_publish_cascade_depth3
        grounds:
          - state_machines.MenuRevision.APPROVED_to_PUBLISHED
          - state_machines.PrepItem.ACTIVE_to_RETIRED
          - entities.StationPar.fields.status
          - state_machines.PrepBatch.PLANNED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain from the publish trigger: publish V2 retires prep item P
          (link 1), the retirement suspends P's ACTIVE StationPar (link 2), the
          suspension cancels the PLANNED PrepBatch and releases its rack load
          (link 3). Each link is caused by the previous one, not by the publish.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Restaurant; V1 PUBLISHED with recipe R1 referencing prep item P; Q is a second prep item."
            - "SAUTE station (capacity 1000) with an ACTIVE par on P (par 20)."
            - "FINALIZED forecast for R1 x 10; prep list GENERATED and LOCKED; one PLANNED batch of P, quantity 20, occupying 20 rack load."
            - "V2 exists in APPROVED with recipe R2 referencing only Q (P is unreferenced by V2's menu)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/restaurants"
              payload: { name: "Ridgeview", code: "RIDGE", weekly_bakery_budget_cents: 100000 }
              as: SystemAdmin
              captures: { rest_id: $.data.id }
