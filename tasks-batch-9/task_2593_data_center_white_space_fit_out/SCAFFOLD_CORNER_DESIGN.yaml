        distinguishing_aspect: "The fiscal checks depend on the busway being live, so the state check at priority 18 runs first: a 20.00 kW request on a 32 A breaker (ceiling 17.48 kW) against an INSTALLED busway returns ERR_BUSWAY_NOT_ENERGIZED 409, not ERR_BREAKER_DERATE_EXCEEDED 422."
