  # =========================================================================
  # Section 6 — Errors (§1.6): every catalog entry must be triggerable
  # =========================================================================
  - section: errors
    instances:

      - name: corner_every_path_id_probe_returns_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - errors[ERR_JURISDICTION_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - errors[ERR_ORDER_LINE_NOT_FOUND]
          - errors[ERR_PARTNER_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_ATTEMPT_NOT_FOUND]
          - errors[ERR_SHOPPER_TEST_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
        distinguishing_aspect: |
          Ten reads against the same syntactically valid but absent id return ten distinct
          entity-specific 404 codes rather than one shared generic code, so each not-found error
          in the catalog is independently reachable on an empty database.
        test_recipe:
          setup:
            - "empty database; no rows are created, so every id below is absent"
          setup_api_calls: []
          trigger:
            - call: "GET /jurisdictions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /restriction-policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /order-lines/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /delivery-partners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /courier-certifications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /delivery-attempts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /secret-shopper-tests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /violation-cases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /corrective-action-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { e10: $.data.error_id }
          assert:
            - 'all ten responses: HTTP status 404 and response_type == "error"'
            - 'error_ids in order: ERR_JURISDICTION_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_CUSTOMER_NOT_FOUND, ERR_ORDER_LINE_NOT_FOUND, ERR_PARTNER_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_ATTEMPT_NOT_FOUND, ERR_SHOPPER_TEST_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_PLAN_NOT_FOUND'
            - "the ten error_id values are pairwise distinct"

      - name: corner_clock_may_stand_still_but_never_rewind
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CLOCK_REWIND]
          - endpoints.POST /_clock/set_current_utc
          - domain_constants.DEFAULT_LOGICAL_CLOCK_UTC
        distinguishing_aspect: |
          Re-setting the clock to the identical instant 2026-08-20T12:00:00Z succeeds, while a
          one-day rewind to 2026-08-19T12:00:00Z is rejected 409 ERR_CLOCK_REWIND, so the guard
          is monotonic non-decreasing rather than strictly increasing.
        test_recipe:
          setup:
            - "clock advanced once to 2026-08-20T12:00:00Z from the default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-19T12:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T12:00:00Z" }
              as: PlatformAdmin
              captures: { now: $.data.current_utc }
          assert:
            - "first response: HTTP status 409 and data.error_id == \"ERR_CLOCK_REWIND\""
            - "second response: HTTP status 200"
            - 'second response: data.current_utc == "2026-08-20T12:00:00Z"'
            - "second response: expired_identity_check_count == 0, expired_certification_count == 0, repostured_partner_count == 0"

