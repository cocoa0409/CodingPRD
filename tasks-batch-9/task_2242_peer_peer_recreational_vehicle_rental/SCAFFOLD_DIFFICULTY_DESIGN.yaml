            - "data.hold_amount_cents == 173788"

      - name: premium_mode_daily_floor_term_wins_the_max_and_flips_loyalty_tier
        grounds: >-
          §1.3 protection_premium's outer max(): the per-night floor
          daily_premium_cents * nights competes with the percentage-of-base term
          round_half_up(base_subtotal * premium_pct_of_base_bp / 10000).
        distinguishing_aspect: >-
          Under the STANDARD plan the percentage term wins (19961 > 19600); under
          a PREMIUM plan priced at 9000 per night the floor term wins
          (9000*4 = 36000 > 19961). The towing surcharge is then 25 percent of
          36000 = 9000, not of 19961, so premium_cents = 45000. That in turn
          lifts pre_discount_cents to 155896 and flips the loyalty tier to
          LOYALTY_TIER_2 — the max() branch selection propagates all the way into
          STEP 2. An implementation that applies the surcharge before the max(),
          or that takes the min of the two terms, cannot reach 45000 / 162381.
        test_recipe:
          setup: >-
            Canonical marketplace and LISTED listing, but a second
            ProtectionPlan (tier PREMIUM, 9000 per night, same 1800 bp, same
            3,000,000-cent ceiling) is defined and the booking is written against
