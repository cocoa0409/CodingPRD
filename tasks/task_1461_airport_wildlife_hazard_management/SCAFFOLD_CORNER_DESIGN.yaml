scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: airport_creation_required_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Airport
        distinguishing_aspect: "POST /wildlife/airports with required fields returns 201 and system stamps id, created_at, updated_at, version=1; computed fields default to LOW/0/0."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KAAA", name: "Alpha Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
          trigger:
            - call: "GET /wildlife/airports/${ap_id}"
              as: AirportAdmin
              captures: { ap: "$.data" }
          assert:
            - "HTTP 200"
            - "Airport.${ap_id}.current_hazard_level == LOW"
            - "Airport.${ap_id}.strikes_trailing_12m == 0"
            - "Airport.${ap_id}.strikes_trailing_12m_high_risk == 0"
            - "Airport.${ap_id}.version == 1"

      - name: airport_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - entities.Airport
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Missing required input field (name) yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KBBB", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: species_enum_guild_rejected_when_invalid
        claim_type: type_constraints
        grounds:
          - entities.Species
          - "errors[ERR_INVALID_ENUM]"
        distinguishing_aspect: "Species.guild enum rejects value not in declared constraint set."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /wildlife/species"
              payload: { common_name: "X", scientific_name: "X x", guild: "INSECT", risk_tier: "LOW", body_mass_g: 10, is_protected_federally: false }
              as: AirportAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_ENUM"

      - name: strike_report_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.WildlifeStrikeReport
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent UUID yields ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /wildlife/strike-reports/00000000-0000-0000-0000-000000000000"
              as: AirportAdmin
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: carcass_record_fk_reverse_reachable_via_parent
        claim_type: parent_relationships
        grounds:
          - entities.CarcassRecord
          - "endpoints.GET /wildlife/strike-reports/{id}/carcass-records"
        distinguishing_aspect: "CarcassRecord children are discoverable from parent WildlifeStrikeReport via sub-resource GET."
        test_recipe:
          setup:
            - "Airport A; senior B1; non-senior B2; Species S1 MEDIUM"
            - "Strike SR confirmed with carcass_present=true -> auto-created CarcassRecord"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KCCC", name: "Charlie Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/species"
              payload: { common_name: "Ring-billed Gull", scientific_name: "Larus delawarensis", guild: "GULL", risk_tier: "MEDIUM", body_mass_g: 550, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-C01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-C02", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: "$.data.id" }
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N-C1", species_id: "${sp_id}", damage_class: "MINOR", phase_of_flight: "LANDING", altitude_ft_agl: 30, strike_count_animals: 1, carcass_present: true }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /wildlife/strike-reports/${sr_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/confirm"
              payload: { confirmation_notes: "carcass present" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "GET /wildlife/strike-reports/${sr_id}/carcass-records"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { rows: "$.data" }
          assert:
            - "HTTP 200"
            - "Response is array of length 1"
            - "rows[0].strike_report_id == ${sr_id}"
            - "rows[0].identification_status == COLLECTED"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: strike_report_invalid_transition_from_terminal
        claim_type: invalid_transition
        grounds:
          - state_machines.WildlifeStrikeReport
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Once REJECTED, no further transitions allowed; confirm attempt on REJECTED returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Airport A; senior B1; non-senior B2"
            - "Species S1 MEDIUM"
            - "Strike SR in REJECTED"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KDDD", name: "Delta Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/species"
              payload: { common_name: "Ring-billed Gull", scientific_name: "Larus delawarensis", guild: "GULL", risk_tier: "MEDIUM", body_mass_g: 550, is_protected_federally: true }
              as: AirportAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-D01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-D02", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: "$.data.id" }
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N-D1", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /wildlife/strike-reports/${sr_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/begin-review"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/strike-reports/${sr_id}/reject"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /wildlife/strike-reports/${sr_id}/confirm"
              payload: { confirmation_notes: "should fail" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: annual_plan_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AnnualPlan
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "PUBLISHED plan accepts no further transitions; submit attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Airport A; senior B1; RegulatorAgent R"
            - "AnnualPlan AP in PUBLISHED"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KEEE", name: "Echo Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-E01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/regulators"
              payload: { full_name: "R One", agency: "USFWS", badge_number: "USFWS-9601" }
              as: AirportAdmin
              captures: { r_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans"
              payload: { airport_id: "${ap_id}", plan_year: 2027, version_note: "v1" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans/${plan_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
            - call: "POST /wildlife/annual-plans/${plan_id}/approve"
              payload: {}
              as: RegulatorAgent
              as_user_id: "${r_id}"
            - call: "GET /wildlife/airports/${ap_id}"
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ap_v: "$.data.version" }
            - call: "POST /wildlife/annual-plans/${plan_id}/publish"
              payload: { expected_airport_version: "${ap_v}" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /wildlife/annual-plans/${plan_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: dispersal_activity_initial_state_logged
        claim_type: initial_state
        grounds:
          - state_machines.DispersalActivity
        distinguishing_aspect: "New DispersalActivity starts in LOGGED."
        test_recipe:
          setup:
            - "Airport A; non-senior B2; Species S1 LOW"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KFFF", name: "Foxtrot Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/species"
              payload: { common_name: "House Sparrow", scientific_name: "Passer domesticus", guild: "SONGBIRD", risk_tier: "LOW", body_mass_g: 30, is_protected_federally: false }
              as: AirportAdmin
              captures: { sp_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B Two", certification_id: "CERT-F01", airport_id: "${ap_id}", is_senior: false }
              as: AirportAdmin
              captures: { b2_id: "$.data.id" }
          trigger:
            - call: "POST /wildlife/dispersal-activities"
              payload: { airport_id: "${ap_id}", performed_by_biologist_id: "${b2_id}", performed_at: "2026-07-15T10:00:00Z", method: "PYROTECHNICS", species_id: "${sp_id}", animals_dispersed: 5, animals_taken_lethal: 0 }
              as: WildlifeBiologist
              as_user_id: "${b2_id}"
              captures: { d_id: "$.data.id", d_status: "$.data.status" }
          assert:
            - "HTTP 201"
            - "DispersalActivity.status == LOGGED"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: composite_habitat_score_multiplication
        claim_type: correct_result
        grounds:
          - calculations.composite_habitat_score
        distinguishing_aspect: "composite_score = attractiveness_score * severity_score; 7*8=56."
        test_recipe:
          setup:
            - "Airport A; biologist B1"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KGGG", name: "Golf Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-G01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
          trigger:
            - call: "POST /wildlife/habitat-assessments"
              payload: { airport_id: "${ap_id}", assessed_by_biologist_id: "${b1_id}", assessed_at: "2026-07-15T10:00:00Z", habitat_feature: "STANDING_WATER", attractiveness_score: 7, severity_score: 8 }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { ha_id: "$.data.id", ha_score: "$.data.composite_score" }
          assert:
            - "HTTP 201"
            - "composite_score == 56"

      - name: training_currency_score_weighted
        claim_type: correct_result
        grounds:
          - calculations.training_currency_score
        distinguishing_aspect: "One biologist with 1 VALID + 1 EXPIRING_SOON record -> biologist_score 0.75 -> airport_compliance_pct 75.00."
        test_recipe:
          setup:
            - "Airport A; biologist B1 active"
            - "TrainingRecord T1 VALID (expires 2027-01-01); T2 EXPIRING_SOON (expires 2026-08-15 — within 30 days of clock 2026-08-01)"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KHHH", name: "Hotel Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-H01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/training-records"
              payload: { biologist_id: "${b1_id}", course_code: "WHA-101", completed_at: "2026-01-01", expires_at: "2027-01-01" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { t1_id: "$.data.id" }
            - call: "POST /wildlife/training-records"
              payload: { biologist_id: "${b1_id}", course_code: "WHA-102", completed_at: "2025-08-01", expires_at: "2026-08-15" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { t2_id: "$.data.id" }
          trigger:
            - call: "GET /wildlife/airports/${ap_id}/training-compliance"
              as: AirportAdmin
              captures: { pct: "$.data.airport_compliance_pct" }
          assert:
            - "airport_compliance_pct == 75.00"
            - "T1 contributes 1.0; T2 contributes 0.5; average = 0.75; *100 = 75.00"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: unauthenticated_request_missing_headers
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Missing X-User-Role header yields 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /wildlife/airports"
              as: Anonymous
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: unauthorized_role_cannot_create_airport
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles[AirportAdmin]"
        distinguishing_aspect: "WildlifeBiologist cannot call POST /wildlife/airports (AirportAdmin exclusive)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KIII", name: "India Airport", annual_plan_cycle_year: 2026 }
              as: WildlifeBiologist
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: fk_not_found_on_strike_report_species
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_FK_NOT_FOUND]"
        distinguishing_aspect: "Strike report with non-existent species_id yields ERR_FK_NOT_FOUND."
        test_recipe:
          setup:
            - "Airport A; biologist B1"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KJJJ", name: "Juliett Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-J01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
          trigger:
            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b1_id}", strike_at: "2026-07-15T10:00:00Z", runway_designator: "09L", aircraft_registration: "N-J1", species_id: "00000000-0000-0000-0000-000000000000", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == ERR_FK_NOT_FOUND"

      - name: invalid_window_advisory_end_before_start
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_INVALID_WINDOW]"
        distinguishing_aspect: "OperationalAdvisory with effective_to <= effective_from yields ERR_INVALID_WINDOW."
        test_recipe:
          setup:
            - "Airport A; senior biologist B1"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KKKK", name: "Kilo Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-K01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
          trigger:
            - call: "POST /wildlife/operational-advisories"
              payload: { airport_id: "${ap_id}", issued_by_biologist_id: "${b1_id}", issued_at: "2026-07-15T10:00:00Z", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", hazard_level: "ELEVATED", reason_code: "OTHER" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "error_id == ERR_INVALID_WINDOW"

      - name: plan_duplicate_year_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_PLAN_DUPLICATE_YEAR]"
        distinguishing_aspect: "Second AnnualPlan for same airport+year in SUBMITTED_FOR_REVIEW yields ERR_PLAN_DUPLICATE_YEAR."
        test_recipe:
          setup:
            - "Airport A; senior B1; RegulatorAgent R"
            - "AnnualPlan AP1 for A+2027 already SUBMITTED_FOR_REVIEW"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KLLL", name: "Lima Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /wildlife/biologists"
              payload: { full_name: "B One", certification_id: "CERT-L01", airport_id: "${ap_id}", is_senior: true }
              as: AirportAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans"
              payload: { airport_id: "${ap_id}", plan_year: 2027, version_note: "v1" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { plan1_id: "$.data.id" }
            - call: "POST /wildlife/annual-plans/${plan1_id}/submit"
              payload: {}
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
          trigger:
            - call: "POST /wildlife/annual-plans"
              payload: { airport_id: "${ap_id}", plan_year: 2027, version_note: "v2 duplicate" }
              as: WildlifeBiologist
              as_user_id: "${b1_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "error_id == ERR_PLAN_DUPLICATE_YEAR"

  # =====================================================================
  # Section: endpoints
  # =====================================================================
  - section: endpoints
    instances:
      - name: list_airports_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET /wildlife/airports"
          - response_envelope
        distinguishing_aspect: "List endpoint returns pagination_fields limit/offset/total_count/has_more."
        test_recipe:
          setup: ["Three airports exist"]
          setup_api_calls:
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KMMM", name: "Mike Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KNNN", name: "November Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KOOO", name: "Oscar Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
          trigger:
            - call: "GET /wildlife/airports"
              as: AirportAdmin
          assert:
            - "HTTP 200"
            - "data array length == 3 (within default limit 10)"
            - "Response envelope contains meta.api_request_id and meta.api_request_timestamp"
            - "Pagination fields limit, offset, total_count, has_more are present per response_envelope contract"

      - name: hazard_preview_computed_read
        claim_type: computed_read
        grounds:
          - "endpoints.GET /wildlife/airports/{id}/hazard-preview"
          - calculations.airport_hazard_level
        distinguishing_aspect: "Hazard preview returns projected level without mutating Airport."
        test_recipe:
          setup:
            - "Airport A with 0 strikes"
          setup_api_calls:
            - call: "POST /wildlife/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
            - call: "POST /wildlife/airports"
              payload: { icao_code: "KPPP", name: "Papa Airport", annual_plan_cycle_year: 2026 }
              as: AirportAdmin
              captures: { ap_id: "$.data.id" }
          trigger:
            - call: "GET /wildlife/airports/${ap_id}/hazard-preview"
              payload: { as_of: "2026-08-01T00:00:00Z" }
              as: AirportAdmin
              captures: { level: "$.data.projected_hazard_level" }
            - call: "GET /wildlife/airports/${ap_id}"
              as: AirportAdmin
              captures: { ap_level: "$.data.current_hazard_level" }
          assert:
            - "projected_hazard_level == LOW"
            - "Airport.current_hazard_level remains LOW (no mutation)"

