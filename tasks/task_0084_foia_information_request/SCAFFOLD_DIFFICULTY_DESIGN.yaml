scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_assessment_commercial_vs_other_tier
        grounds:
          - calculations.fee_assessment
          - entities.FeeEstimate.fields.assessed_fee_cents
          - entities.FoiaRequest.fields.fee_category
        distinguishing_aspect: |
          Identical FeeEstimate inputs (search_hours=5, review_hours=0, billable_pages=300) assessed
          on a COMMERCIAL request yield 70000 cents (full search + dup, no free allotment) but on an
          OTHER request yield 14000 cents (first 2 search hrs + first 100 pages free) — the divergence
          lives on FeeEstimate.assessed_fee_cents and is keyed by the parent FoiaRequest.fee_category.
        test_recipe:
          setup:
            - "Two perfected, PROCESSING requests by the same requester: one fee_category COMMERCIAL, one OTHER."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer One", badge_id: "B-001" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Acme Co", email: "acme@x.com", declared_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "All contracts 2025", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_comm_id: $.data.id }
            - call: "POST /requests/${r_comm_id}/perfect"
              payload: { fee_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_comm_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Same contracts, public copy", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_other_id: $.data.id }
            - call: "POST /requests/${r_other_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_other_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_comm_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_comm: $.data.version }
            - call: "GET /requests/${r_other_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_other: $.data.version }
          trigger:
            - call: "POST /requests/${r_comm_id}/fee-estimate"
              payload: { search_hours: 5, review_hours: 0, billable_pages: 300, expected_request_version: "${v_comm}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { fee_comm: $.data.assessed_fee_cents }
            - call: "POST /requests/${r_other_id}/fee-estimate"
              payload: { search_hours: 5, review_hours: 0, billable_pages: 300, expected_request_version: "${v_other}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { fee_other: $.data.assessed_fee_cents }
          assert:
            - "FeeEstimate(r_comm).assessed_fee_cents == 70000"
            - "FeeEstimate(r_other).assessed_fee_cents == 14000"
            - "FeeEstimate(r_comm).assessed_fee_cents != FeeEstimate(r_other).assessed_fee_cents"

      - name: waiver_score_vs_commercial_auto_fail
        grounds:
          - calculations.fee_waiver_eligibility_score
          - entities.FoiaRequest.fields.fee_waiver_granted
          - validations[priority=17]
        distinguishing_aspect: |
          The waiver calculation operates on FoiaRequest.fee_waiver_granted (a different entity domain than
          the fee-on-FeeEstimate calc): a weighted score of 70 on an OTHER request grants the waiver, but the
          identical four findings on a COMMERCIAL request force granted=false via the commercial_auto_fail variant.
        test_recipe:
          setup:
            - "One PROCESSING OTHER request and one PROCESSING COMMERCIAL request, each with fee_waiver_requested=true."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer Two", badge_id: "B-002" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "News Org", email: "news@x.com", declared_category: "NEWS_MEDIA" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Public interest set", received_at: "2026-01-05T00:00:00.000Z", fee_waiver_requested: true }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_other_id: $.data.id }
            - call: "POST /requests/${r_other_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_other_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Commercial resale set", received_at: "2026-01-05T00:00:00.000Z", fee_waiver_requested: true }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_comm_id: $.data.id }
            - call: "POST /requests/${r_comm_id}/perfect"
              payload: { fee_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_comm_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_other_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_other: $.data.version }
          trigger:
            - call: "POST /requests/${r_other_id}/fee-waiver"
              payload: { f_public_understanding: 1, f_not_commercial_interest: 1, f_meaningful_contribution: 0, f_ability_to_disseminate: 0, expected_request_version: "${v_other}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { other_waiver: $.data.fee_waiver_granted }
          assert:
            - "FoiaRequest(r_other).fee_waiver_granted == true   # score 70 >= 70 threshold"
            - "POST /requests/${r_comm_id}/fee-waiver with the same four findings returns 409 ERR_WAIVER_INELIGIBLE_COMMERCIAL (commercial_auto_fail variant)"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_other_tier_nested_max_branch_mode_a
        grounds:
          - calculations.fee_assessment
          - entities.FeeEstimate.fields.search_hours
          - entities.FeeEstimate.fields.billable_pages
        distinguishing_aspect: |
          MODE (a): the OTHER-tier fee is a >=3-input formula (search_hours, billable_pages, fee_category)
          with non-linear interaction — two independent max(0, x - free_allotment) clauses plus a
          quarter-hour ceil — so neither input contributes linearly. Inputs search_hours=5, billable_pages=300
          give 12000 (search beyond 2 free hrs) + 2000 (200 pages beyond 100 free) = 14000.
        test_recipe:
          setup:
            - "One PROCESSING request, fee_category OTHER."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer A", badge_id: "B-A1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen", email: "c@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Mixed records", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/fee-estimate"
              payload: { search_hours: 5, review_hours: 0, billable_pages: 300, expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { fee: $.data.assessed_fee_cents }
          assert:
            - "FeeEstimate(r_id).assessed_fee_cents == 14000"
            - "FeeEstimate(r_id).requires_advance_payment == false  # 14000 <= 25000 threshold"

      - name: fee_rounding_order_per_component_then_sum_mode_b
        grounds:
          - calculations.fee_assessment
          - entities.FeeEstimate.fields.assessed_fee_cents
          - entities.FeeEstimate.fields.review_hours
        distinguishing_aspect: |
          MODE (b): the fee pins ROUND-PER-COMPONENT-THEN-SUM. For a COMMERCIAL request with
          search_hours=0.3 (ceil to 2 quarter-hours -> 2000 cents) the per-component ceil of the
          fractional quarter-hour is taken BEFORE summing; review_hours=0.1 (ceil to 1 qh -> 1000)
          and billable_pages=5 (50 cents) sum to 3050. Summing raw products first would mis-round.
        test_recipe:
          setup:
            - "One PROCESSING COMMERCIAL request."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer B", badge_id: "B-B1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Vendor", email: "v@x.com", declared_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Small set", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/fee-estimate"
              payload: { search_hours: 0.3, review_hours: 0.1, billable_pages: 5, expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { fee: $.data.assessed_fee_cents }
          assert:
            - "FeeEstimate(r_id).assessed_fee_cents == 3050  # ceil(0.3*4)=2 -> 2000; ceil(0.1*4)=1 -> 1000; 5 pages -> 50"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appeal_remand_cycles_request_back_to_processing
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.FoiaRequest.DENIED_to_PROCESSING
          - state_machines.ResponsiveRecord.WITHHELD_to_PENDING
        distinguishing_aspect: |
          CYCLE on the Appeal/FoiaRequest pair: a DENIED request (a determination state) is driven back
          to PROCESSING by an Appeal REMAND, reopening a terminal-looking determination — A->B->A loop
          across entities, not a one-way pipeline.
        test_recipe:
          setup:
            - "A request DENIED with one WITHHELD record citing a B5 exemption; a filed appeal against it, now UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer C", badge_id: "B-C1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /appeal-authorities"
              payload: { full_name: "Authority One", badge_id: "A-001" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen D", email: "d@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Memo", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Internal memo", page_count: 3 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "RECORD", exemption_code: "B5", justification: "deliberative process", record_id: "${rec_id}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec_id}/review"
              payload: { disposition: "WITHHELD" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_det: $.data.version }
            - call: "POST /requests/${r_id}/determination"
              payload: { expected_request_version: "${v_det}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/appeals"
              payload: { appellant_id: "${req_user_id}", grounds: "exemption misapplied", filed_at: "2026-02-10T00:00:00.000Z" }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /appeals/${ap_id}/assign"
              payload: {}
              as: AppealAuthority
              as_user_id: "${auth_id}"
          trigger:
            - call: "POST /appeals/${ap_id}/decide"
              payload: { decision: "REMAND" }
              as: AppealAuthority
              as_user_id: "${auth_id}"
          assert:
            - "Appeal(ap_id).status == REMANDED"
            - "FoiaRequest(r_id).status == PROCESSING   # cycled back from DENIED"
            - "ResponsiveRecord(rec_id).disposition == PENDING   # reset on remand"
            - "FoiaRequest(r_id).deadline_status == RUNNING"

      - name: request_determination_branches_three_ways
        grounds:
          - state_machines.FoiaRequest.PROCESSING_to_GRANTED
          - state_machines.FoiaRequest.PROCESSING_to_PARTIALLY_GRANTED
          - state_machines.FoiaRequest.PROCESSING_to_DENIED
        distinguishing_aspect: |
          BRANCHING fork on the FoiaRequest entity (distinct from the Appeal cycle): the single
          determination trigger forks to GRANTED / PARTIALLY_GRANTED / DENIED with divergent side-effects
          per branch, selected purely by the set of record dispositions — a fork-join shape, not linear.
        test_recipe:
          setup:
            - "A PROCESSING request with two reviewed records: one RELEASABLE, one WITHHELD (B6-cited) -> the partial branch."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer E", badge_id: "B-E1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen F", email: "f@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Two-record set", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Releasable doc", page_count: 2 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_rel: $.data.id }
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Personnel file", page_count: 4 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_wh: $.data.id }
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "RECORD", exemption_code: "B6", justification: "personal privacy", record_id: "${rec_wh}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec_rel}/review"
              payload: { disposition: "RELEASABLE" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec_wh}/review"
              payload: { disposition: "WITHHELD" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_det: $.data.version }
          trigger:
            - call: "POST /requests/${r_id}/determination"
              payload: { expected_request_version: "${v_det}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
          assert:
            - "FoiaRequest(r_id).status == PARTIALLY_GRANTED   # mixed RELEASABLE + WITHHELD branch"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: remand_cascade_appeal_request_records_depth3
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.FoiaRequest.PARTIALLY_GRANTED_to_PROCESSING
          - state_machines.ResponsiveRecord.REDACTED_to_PENDING
        distinguishing_aspect: |
          DEPTH-3 cascade triggered by Appeal.decide(REMAND): the appeal flips to REMANDED (A), which
          itself drives the FoiaRequest PARTIALLY_GRANTED->PROCESSING (B caused by A), which itself resets
          each ResponsiveRecord disposition to PENDING (C caused by B). Each link is caused by the prior link.
        test_recipe:
          setup:
            - "A PARTIALLY_GRANTED request with one REDACTED record (B7-cited), an appeal UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer G", badge_id: "B-G1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /appeal-authorities"
              payload: { full_name: "Authority Two", badge_id: "A-002" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen H", email: "h@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Investigation file", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Open doc", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_rel: $.data.id }
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Investigatory record", page_count: 6 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_red: $.data.id }
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "RECORD", exemption_code: "B7", justification: "law enforcement", record_id: "${rec_red}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec_rel}/review"
              payload: { disposition: "RELEASABLE" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec_red}/review"
              payload: { disposition: "REDACTED" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_det: $.data.version }
            - call: "POST /requests/${r_id}/determination"
              payload: { expected_request_version: "${v_det}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/appeals"
              payload: { appellant_id: "${req_user_id}", grounds: "over-redaction", filed_at: "2026-02-10T00:00:00.000Z" }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /appeals/${ap_id}/assign"
              payload: {}
              as: AppealAuthority
              as_user_id: "${auth_id}"
          trigger:
            - call: "POST /appeals/${ap_id}/decide"
              payload: { decision: "REMAND" }
              as: AppealAuthority
              as_user_id: "${auth_id}"
          assert:
            - "Appeal(ap_id).status == REMANDED"
            - "FoiaRequest(r_id).status == PROCESSING"
            - "ResponsiveRecord(rec_red).disposition == PENDING"
            - "ResponsiveRecord(rec_rel).disposition == PENDING"

      - name: sustain_cascade_objection_record_exemption_depth2
        grounds:
          - state_machines.ThirdPartyObjection.OBJECTED_to_SUSTAINED
          - state_machines.ResponsiveRecord.PENDING_to_WITHHELD
          - entities.Exemption.fields.exemption_code
        distinguishing_aspect: |
          DEPTH-2 cascade triggered by Objection.resolve(SUSTAIN) — a DIFFERENT trigger than the remand:
          the objection flips OBJECTED->SUSTAINED (A), which itself sets the linked ResponsiveRecord to
          WITHHELD and creates a B4 Exemption (B caused by A). Distinct propagation pattern from the remand chain.
        test_recipe:
          setup:
            - "A PROCESSING request with a submitter-info record under an OBJECTED Reverse-FOIA objection."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer I", badge_id: "B-I1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /submitters"
              payload: { company_name: "Confidential LLC", contact_email: "sub@x.com" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen J", email: "j@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Bid records", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Vendor pricing sheet", page_count: 2, contains_submitter_info: true, submitter_id: "${sub_id}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /records/${rec_id}/objection"
              payload: { submitter_id: "${sub_id}", objection_text: "confidential pricing" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
