            - "After adjudicate: EditCheck.${ec1}.status == ACCEPTED and SurveyComponent.${comp}.edit_status == CLEARED and fatal_open_count == 0"
            - "Second certify: HTTP status == 200, prep_status == CERTIFIED, certified_by_user_id == \"director-1\""

