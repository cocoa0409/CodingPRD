            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
