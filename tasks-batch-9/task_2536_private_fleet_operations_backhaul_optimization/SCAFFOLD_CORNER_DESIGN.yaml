              as: TransportManager
              captures: { v: $.data.variant, days: $.data.window_days, trips: $.data.trip_count, miles: $.data.total_miles, cases: $.data.total_cases, pay: $.data.driver_pay_cents, fuel: $.data.fuel_cents, maint: $.data.maintenance_cents, credit: $.data.backhaul_credit_cents, varc: $.data.variable_cost_cents, fixed: $.data.fixed_cost_cents, total: $.data.total_cost_cents, cpc: $.data.cost_per_case_cents, cpm: $.data.cost_per_mile_cents, ded: $.data.dedicated_equivalent_cents_per_case, adv: $.data.advantage_cents_per_case }
            - call: "GET /fleet/domiciles/${dom_id}/cost-benchmark"
              payload: { variant: "INCREMENTAL_VARIABLE", window_start: "2026-08-20T06:00:00Z", window_end: "2026-08-21T00:00:00Z" }
              as: PayrollAnalyst
              captures: { days2: $.data.window_days, trips2: $.data.trip_count, total2: $.data.total_cost_cents, fixed2: $.data.fixed_cost_cents }
            - call: "GET /fleet/domiciles/${dom_id}/cost-benchmark"
              payload: { variant: "INCREMENTAL_VARIABLE", window_start: "2026-08-19T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: TransportManager
              captures: { no_vol_err: $.data.error_id }
          assert:
            - "${settlement} == ACCRUED, so the trip qualifies for the benchmark inclusion set"
            - "${v} == INCREMENTAL_VARIABLE, ${days} == 1, ${trips} == 1, ${miles} == 100, ${cases} == 600"
            - "${pay} == 10000, ${fuel} == 6200, ${maint} == 1900, ${credit} == 0 and ${varc} == 18100"
            - "${fixed} == 13000 is reported even though ${total} == 18100 excludes it under this variant"
            - "${cpc} == 30 (18100/600 == 30.1667 rounded half-up at zero decimals), ${cpm} == 181, ${ded} == 205 and ${adv} == 175"
            - "${days2} == 1 and ${trips2} == 1 - an 18-hour window still counts as one day because window_days is clamped to a minimum of 1, and window_start == planned_start_at is inclusive; ${total2} == 18100 and ${fixed2} == 13000"
            - "${no_vol_err} == ERR_BENCHMARK_NO_VOLUME with HTTP 422 - window_end is exclusive, so the 06:00 trip falls outside [08-19, 08-20) and the guard fires before any division"

      - name: awarding_a_posting_with_no_eligible_bidder_is_a_business_outcome
        claim_type: Conditional action
        grounds:
          - endpoints[POST /fleet/route-postings/{posting_id}/award]
        distinguishing_aspect: "The award endpoint's conditional fork - AWARDED when the eligible pool is non-empty, VACANT at HTTP 200 when it is empty - is exercised end to end by the §1.8 instance below."
        excluded_because:
          difficulty_instance: route_posting_award_trigger_forks_to_awarded_or_vacant_then_locks_down
          rationale: "That instance awards one posting to the senior eligible bidder, drives a second posting to VACANT with an empty eligible pool at HTTP 200, and then proves both outcomes are terminal against a second award attempt."

      - name: patching_a_tractor_re_derives_its_pm_counter_without_running_the_projection
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /fleet/tractors/{tractor_id}]
          - calculations.pm_due_projection
        distinguishing_aspect: "PATCH is partial and recomputes miles_since_pm from whatever the new field values are, but it is NOT a projection trigger: a tractor patched to 28000 miles past a 25000-mile interval keeps pm_hold false and generates no work order, because the auto-PM cascade is bound to trip completion only. That asymmetry is invisible unless the patch pushes the tractor over its interval."
        test_recipe:
          setup:
            - "Tractor TR-E5 is created at odometer 50000 with a 25000-mile interval and last service at 40000, so miles_since_pm is 10000 and pm_hold is false."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MaintenanceCoordinator
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-E5", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-E5", domicile_id: "${dom_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tractor_id: $.data.id, msp0: $.data.miles_since_pm, hold0: $.data.pm_hold, st0: $.data.status, v0: $.data.version }
          trigger:
            - call: "GET /fleet/tractors/${tractor_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { get_msp: $.data.miles_since_pm, get_unit: $.data.unit_code }
            - call: "PATCH /fleet/tractors/${tractor_id}"
              payload: { odometer_miles: 68000 }
              as: MaintenanceCoordinator
              captures: { msp1: $.data.miles_since_pm, hold1: $.data.pm_hold, interval1: $.data.pm_interval_miles, last1: $.data.pm_last_service_odometer, v1: $.data.version }
            - call: "GET /fleet/maintenance-work-orders"
              payload: { tractor_id: "${tractor_id}", limit: 10, offset: 0 }
              as: MaintenanceCoordinator
              captures: { wo_probe: "$.data[0].id" }
            - call: "PATCH /fleet/tractors/${tractor_id}"
              payload: { pm_last_service_odometer: 68000 }
              as: MaintenanceCoordinator
              captures: { msp2: $.data.miles_since_pm, hold2: $.data.pm_hold, odo2: $.data.odometer_miles, v2: $.data.version }
            - call: "GET /fleet/tractors"
              payload: { domicile_id: "${dom_id}", pm_hold: false, limit: 10, offset: 0 }
              as: TransportManager
              captures: { listed: "$.data[0].id" }
          assert:
            - "${msp0} == 10000, ${hold0} == false and ${st0} == AVAILABLE at creation"
            - "${get_msp} == 10000 and ${get_unit} == TR-E5 - the read returns what was stored"
            - "${msp1} == 28000 with ${interval1} == 25000 and ${last1} == 40000 unchanged - the patch is partial and the derived counter is recomputed, not incremented"
            - "${hold1} == false and the work-order listing reports total_count 0 - crossing the interval by PATCH creates no PM order, because pm_due_projection only runs inside trip completion"
            - "${msp2} == 0 with ${odo2} == 68000 - patching only the last-service reading is enough to clear the counter"
            - "${v2} > ${v1} > ${v0} - every accepted PATCH bumps the version"
            - "${listed} == ${tractor_id} and the filtered listing reports total_count 1"

