  - section: consistency_model
    instances:

      - name: select_cascade_is_visible_immediately_after_the_same_request
        claim_type: immediate
        grounds: [state_machines.Selection.PROPOSED_to_SELECTED, calculations.site_headcount_identity]
        distinguishing_aspect: "The consistency model is immediate, not eventual: the decide response already reports status SELECTED, and reads issued straight afterwards with no intervening write show Employee PENDING_SEPARATION, Site pending_separation_count 1 and ReductionPlan selected_count 1."
        test_recipe:
          setup:
            - "TX site with two employees and a plan with LOCKED criteria holding one PROPOSED selection for Alice."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Ben Okafor", job_title: "Analyst", birth_date: "1990-02-20", hire_date: "2020-01-15", annual_base_cents: 6240000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: "$.data.employee_ids[0]", ben_id: "$.data.employee_ids[1]" }
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /selections"
              payload: { plan_id: "${plan_id}", employee_id: "${alice_id}", proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { s_alice: $.data.id }
          trigger:
            - call: "POST /selections/${s_alice}/decide"
              payload: { decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { immediate_status: $.data.status }
            - call: "GET /employees/${alice_id}"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { emp_state: $.data.employment_status, sep_date: $.data.separation_date }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { pend: $.data.pending_separation_count, act: $.data.active_headcount }
          assert:
            - "${immediate_status} == SELECTED"
            - "${emp_state} == PENDING_SEPARATION"
            - "${sep_date} == 2026-12-01"
            - "${pend} == 1"
            - "${act} == 1"
            - "ReductionPlan.${plan_id}.selected_count == 1"
            - "ReductionPlan.${plan_id}.earliest_separation_date == 2026-12-01"
            - "Employee.${alice_id}.age_at_separation == 48"
            - "Employee.${alice_id}.years_of_service == 11"

  - section: errors
    instances:

      - name: error_duplicate_warn_rule_for_one_jurisdiction_and_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_WARN_RULE_ALREADY_EXISTS]", "validations[priority=27]"]
        distinguishing_aspect: "A second STATE rule for NY answers 409 ERR_WARN_RULE_ALREADY_EXISTS even under a different rule_code, because uniqueness is on the (jurisdiction, state_code) pair."
        test_recipe:
          setup:
            - "One NY STATE WarnRule already configured."
          setup_api_calls:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "STATE", state_code: "NY", rule_code: "NY-MINI-WARN", min_loss_count: 2, min_percent: 25.0, absolute_count: 10, notice_days: 90, window_days: 30, counts_part_time: true, min_service_days: 0, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS", "SEPARATION_DATE", "UNION_NOTICE", "JOB_TITLES_AFFECTED"] }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { rule_id: $.data.id }
          trigger:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "STATE", state_code: "NY", rule_code: "NY-MINI-WARN-2027", min_loss_count: 5, min_percent: 10.0, absolute_count: 0, notice_days: 60, window_days: 45, counts_part_time: false, min_service_days: 90, required_content_codes: ["EMPLOYER_NAME"] }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_WARN_RULE_ALREADY_EXISTS"
            - "HTTP status == 409"
            - "WarnRule.${rule_id}.rule_code == NY-MINI-WARN"

      - name: error_warn_workforce_empty_when_the_federal_denominator_is_zero
        claim_type: violation_to_error
        grounds: ["errors[ERR_WARN_WORKFORCE_EMPTY]", "validations[priority=32]", calculations.warn_employment_loss_count]
        distinguishing_aspect: "A site whose only employee is part-time has a FEDERAL workforce_count of 0 once counts_part_time false removes her from the denominator, so POST /warn-notices with jurisdiction FEDERAL answers 422 ERR_WARN_WORKFORCE_EMPTY instead of dividing by zero."
        test_recipe:
          setup:
            - "A FEDERAL WarnRule with counts_part_time false and min_service_days 180."
