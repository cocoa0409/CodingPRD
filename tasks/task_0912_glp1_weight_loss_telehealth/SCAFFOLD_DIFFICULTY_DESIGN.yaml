          causes Prescription.active_route_mode to flip to CASH, that flip causes the BRANDED
          RESERVED PharmacyOrder to be cancelled with cancel_reason PA_DENIED, and that
          cancellation causes the lot's reserved units to return to available.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; INSURANCE patient in CA with an ELIGIBLE screening and an ACTIVE dose_level 1 prescription for 2 units, so active_route_mode is INSURANCE."
            - "A BRANDED pharmacy serving CA holds lot L-0003 of 24 units at 0.25 mg, window capacity 6, expiring 2026-12-31."
            - "A pharmacy order for 2 units routed to the branded lot is RESERVED, so the lot shows 22 available and 2 reserved."
            - "A prior authorisation for the prescription sits in SUBMITTED."
          setup_api_calls:
            - call: "POST /glp1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /glp1/patients"
              payload: { email: "lex@example.com", full_name: "Lex Amara", state_code: "CA", height_cm: 170, weight_kg: 95.0, payment_mode: "INSURANCE", comorbidity_codes: [] }
              as: PlatformAdmin
              captures: { pat_id: "$.data.id" }
            - call: "POST /glp1/providers"
              payload: { full_name: "Dr Nia Cole", provider_type: "CLINICIAN", licensed_state_codes: ["CA"], npi: "1710004003" }
              as: PlatformAdmin
              captures: { doc_id: "$.data.id" }
            - call: "POST /glp1/pharmacies"
              payload: { name: "Brandline Rx", dispense_type: "BRANDED", served_state_codes: ["CA"], status: "ACTIVE" }
              as: PlatformAdmin
              captures: { ph_id: "$.data.id" }
            - call: "POST /glp1/supply-lots"
              payload: { pharmacy_id: "${ph_id}", lot_code: "L-0003", strength_mg: 0.25, total_units: 24, window_capacity_units: 6, expires_at: "2026-12-31T00:00:00Z", status: "RELEASED" }
              as: PlatformAdmin
              captures: { lot_id: "$.data.id" }
            - call: "POST /glp1/screenings"
              payload: { patient_id: "${pat_id}", recorded_weight_kg: 95.0, egfr: 88.0, lab_collected_at: "2026-05-20T00:00:00Z" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { scr_id: "$.data.id" }
            - call: "POST /glp1/screenings/${scr_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
            - call: "POST /glp1/consults"
              payload: { patient_id: "${pat_id}", provider_id: "${doc_id}", scheduled_start_at: "2026-06-02T15:00:00Z", scheduled_end_at: "2026-06-02T15:30:00Z" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { con_id: "$.data.id" }
            - call: "POST /glp1/consults/${con_id}/complete"
              payload: { outcome: "PRESCRIBE" }
              as: Provider
              as_user_id: "${doc_id}"
            - call: "GET /glp1/patients/${pat_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pat_v: "$.data.version" }
            - call: "POST /glp1/prescriptions"
              payload: { patient_id: "${pat_id}", consult_id: "${con_id}", prescriber_provider_id: "${doc_id}", screening_id: "${scr_id}", drug_family: "SEMAGLUTIDE", units_per_cycle: 2, expected_patient_version: "${pat_v}" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rx_id: "$.data.id" }
            - call: "GET /glp1/titration-steps"
              payload: { prescription_id: "${rx_id}", status: "DUE" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { ts1_id: "$.data[0].id" }
            - call: "GET /glp1/prescriptions/${rx_id}"
              payload: {}
              as: Provider
              as_user_id: "${doc_id}"
              captures: { rx_v: "$.data.version" }
            - call: "POST /glp1/pharmacy-orders"
              payload: { prescription_id: "${rx_id}", titration_step_id: "${ts1_id}", units_requested: 2, window_start_at: "2026-06-02T00:00:00Z", window_end_at: "2026-06-09T00:00:00Z", expected_prescription_version: "${rx_v}" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { po_id: "$.data.id" }
            - call: "POST /glp1/pharmacy-orders/${po_id}/reserve"
              payload: {}
              as: PharmacyOperator
              as_user_id: "${ph_id}"
            - call: "POST /glp1/prior-authorizations"
              payload: { prescription_id: "${rx_id}", payer_reference: "PA-99001" }
              as: Provider
              as_user_id: "${doc_id}"
              captures: { pa_id: "$.data.id" }
          trigger:
            - call: "POST /glp1/prior-authorizations/${pa_id}/decide"
              payload: { decision: "DENIED", denial_reason: "NOT_MEDICALLY_NECESSARY" }
              as: BillingAdmin
          assert:
            - "PriorAuthorization.${pa_id}.status == DENIED and denial_reason == NOT_MEDICALLY_NECESSARY"
            - "Prescription.${rx_id}.active_route_mode == CASH"
            - "PharmacyOrder.${po_id}.status == CANCELLED and cancel_reason == PA_DENIED"
            - "PharmacyOrder.${po_id}.dispense_type_at_route == BRANDED"
            - "SupplyLot.${lot_id}.available_units == 24 and reserved_units == 0 and dispensed_units == 0"
            - "Prescription.${rx_id}.fulfillment_status == UNROUTED"

  # =========================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_business_constraint_on_order_creation
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_PRESCRIPTION_NOT_ACTIVE]
          - errors[ERR_UNITS_EXCEED_LIMIT]
        distinguishing_aspect: |
          Category pair state versus business_constraint: one POST /glp1/pharmacy-orders violates
          both the priority-8 state rule (the prescription is HELD) and the priority-12 unit cap
          (4 requested against units_per_cycle 2), and the response must be
          ERR_PRESCRIPTION_NOT_ACTIVE with HTTP 409, never ERR_UNITS_EXCEED_LIMIT with 422.
