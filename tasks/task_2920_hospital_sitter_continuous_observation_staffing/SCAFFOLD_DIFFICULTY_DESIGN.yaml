              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o16: $.data.id }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o15}", staff_id: "${s_n}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o15_v1}" }
              as: StaffingCoordinator
              captures: { a15: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${s_n}", station_label: "CONSOLE-N1", declared_max_span: 2 }
              as: StaffingCoordinator
              captures: { st_n: $.data.id }
            - call: "POST /observation/video-feeds"
