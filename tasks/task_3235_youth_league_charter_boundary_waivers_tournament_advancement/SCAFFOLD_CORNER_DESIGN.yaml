  - section: consistency_model
    instances:

      - name: mutation_visible_immediately_in_same_response_and_read
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the selections POST response itself carries roster_size 1, and a subsequent rosters list read shows the same value with no lag."
        test_recipe:
          setup: ["League CHARTERED; clock 2027-02-01; P1 ELIGIBLE in MAJOR; roster R OPEN."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: DistrictAdministrator
            - call: "POST /leagues"
              payload: { league_name: "Immediate LL", region_code: "WEST", season_year: 2027 }
              as: DistrictAdministrator
              captures: { lg: $.data.id }
            - call: "POST /leagues/${lg}/insurance-certificates"
              payload: { carrier_name: "LL-INS", coverage_start: "2027-01-01", coverage_end: "2027-12-31" }
              as: DistrictAdministrator
            - call: "POST /leagues/${lg}/charter-renewals"
              payload: { season_year: 2027 }
              as: LeagueAdministrator
              captures: { ren: $.data.id }
            - call: "POST /leagues/${lg}/charter-renewals/${ren}/decide"
              payload: { action: "APPROVE", late_fee_paid: false }
              as: DistrictAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}/divisions"
              payload: {}
              as: LeagueAdministrator
              captures: { maj: "$.data[2].id" }
            - call: "POST /leagues/${lg}/players"
              payload: { first_name: "Im", last_name: "Mediate", birth_date: "2015-03-10", residence_within_boundary: true, school_within_boundary: false, games_played: 3, games_scheduled: 5 }
              as: LeagueAdministrator
              captures: { p1: $.data.id }
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "BIRTH_CERTIFICATE", issued_date: "2015-03-12" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/eligibility-documents"
              payload: { doc_type: "RESIDENCE_PROOF", issued_date: "2027-01-15" }
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/players/${p1}/verify-eligibility"
              payload: {}
              as: LeagueAdministrator
            - call: "POST /leagues/${lg}/all-star-rosters"
