# =============================================================================
# Scaffold: Inpatient Psychiatric Unit Admission & Involuntary Hold Processing
# Difficulty target: above Expert (§0.4) — 13 entities, 53 endpoints, 49 errors,
# 9 calculations, 8 state machines (cyclic + parallel-dimension + posture).
# =============================================================================

scenario: |
  2367. Inpatient Psychiatric Unit Admission & Involuntary Hold Processing (hospital behavioral health unit): emergency evaluation and legal hold initiation with statutory time limits, hold extension petitions and court hearing scheduling with patient representation, voluntary conversion and patient request for discharge with a hold clock, bed availability, gender/acuity mixing and unit placement rules, restraint and seclusion authorization, monitoring and debriefing documentation, contraband and safety search protocol at admission, medication consent, capacity determination and substitute decision maker, discharge planning with outpatient follow-up appointment guarantees

domain_name: inpatient-psychiatric-admission
api_prefix: /behavioral-health

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions

  entity_topology: flat
  # flat: 13 peer collections under a single api namespace prefix; every link is an
  # explicit FK field in the request body, never a nesting level in the URL path.
  # The single exception is the Bed reverse-reachability sub-resource GET.

  state_machine_shape: parallel
  # Admission carries two independent state axes (legal_status × placement_status).
  # HoldPetition is cyclic (HEARING_SCHEDULED → CONTINUED → HEARING_SCHEDULED).
  # RestraintEpisode branches (RELEASED vs EXPIRED_UNAUTHORIZED) with divergent
  # side-effect sets. Unit.posture is a compound/derived gate over Bed children.

  relationship_patterns:
    - one_to_many          # Unit → Bed, Admission → RestraintEpisode
    - self_referential     # HoldOrder.predecessor_hold_id -> HoldOrder.id
    - cross_aggregate      # HoldOrder ↔ Admission ↔ Unit ↔ Bed ↔ Clinician docket

  role_model: segregation_of_duties
  # Hold initiation vs certification, safety-search performer vs witness, and
  # restraint order vs face-to-face review must be different Clinician ids.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member legal name" }
      - { name: staff_role, type: enum, source: input, description: "Credential class of this staff member", constraints: "one of INTAKE_CLINICIAN | PSYCHIATRIST | CHARGE_NURSE | RIGHTS_ADVOCATE" }
      - { name: license_number, type: string, source: input, description: "State license identifier; unique across Clinician rows" }
      - { name: booked_docket_minutes, type: integer, source: computed, default: 0, description: "= SUM(CourtHearing.duration_minutes) over CourtHearing rows WHERE advocate_clinician_id == this Clinician.id AND status == 'SCHEDULED'. Conserved quantity for the docket-minutes invariant." }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Behavioral health unit name" }
      - { name: gender_mixing_policy, type: enum, source: input, description: "Room cohort policy applied by the bed selector", constraints: "one of SEPARATE_BY_ROOM | SEPARATE_BY_WING | MIXED_ALLOWED" }
      - { name: seclusion_room_count, type: integer, source: input, description: "Number of seclusion rooms licensed on this unit; aggregate capacity ceiling for concurrent SECLUSION episodes", constraints: ">= 0" }
      - { name: licensed_placement_bed_count, type: integer, source: computed, description: "= COUNT(Bed WHERE unit_id == this Unit.id AND bed_type IN {STANDARD, LIGATURE_RESISTANT_OBSERVATION} AND status != 'OUT_OF_SERVICE')" }
      - { name: raw_available_bed_count, type: integer, source: computed, description: "= COUNT(Bed WHERE unit_id == this Unit.id AND bed_type IN {STANDARD, LIGATURE_RESISTANT_OBSERVATION} AND status == 'AVAILABLE'). Step 1 of unit_posture_and_effective_availability." }
      - { name: posture, type: enum, source: computed, description: "Derived gate over child Bed rows; computed from raw_available_bed_count ONLY (step 2)", constraints: "one of OPEN | RESTRICTED | CLOSED" }
      - { name: effective_available_bed_count, type: integer, source: computed, description: "= max(0, raw_available_bed_count - safety_reserve_beds) where safety_reserve_beds derives from posture (step 4). Never feeds back into posture." }
      - { name: occupied_bed_count, type: integer, source: computed, default: 0, description: "= COUNT(Bed WHERE unit_id == this Unit.id AND status == 'OCCUPIED'). Conserved quantity for the bed-occupancy invariant." }
      - { name: active_seclusion_count, type: integer, source: computed, default: 0, description: "= COUNT(RestraintEpisode WHERE intervention_type == 'SECLUSION' AND status IN {ORDERED, ACTIVE} AND authorized_until_at > current_utc AND admission's unit_id == this Unit.id)" }
      - { name: open_rights_violation_count, type: integer, source: computed, default: 0, description: "= COUNT(Admission WHERE unit_id == this Unit.id AND rights_violation_flag == true AND placement_status != 'DISCHARGED')" }

  - name: Bed
    parent: Unit
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; owning behavioral health unit" }
      - { name: room_number, type: string, source: input, description: "Room label; beds sharing a room_number within a unit are roommates" }
      - { name: wing_code, type: string, source: input, description: "Wing label used by the SEPARATE_BY_WING cohort policy" }
      - { name: bed_label, type: string, source: input, description: "Bed label within the room; unique per (unit_id, room_number)" }
      - { name: bed_type, type: enum, source: input, description: "Physical bed class", constraints: "one of STANDARD | LIGATURE_RESISTANT_OBSERVATION | SECLUSION" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "Occupancy state", constraints: "one of AVAILABLE | OCCUPIED | BLOCKED_CLEANING | OUT_OF_SERVICE" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number; unique across Patient rows; final deterministic tie-break key for the queued-admission promotion selector" }
      - { name: legal_name, type: string, source: input, description: "Patient legal name" }
      - { name: age_years, type: integer, source: input, description: "Age in whole years at registration", constraints: ">= 0 and <= 120" }
      - { name: is_minor, type: boolean, source: computed, description: "= (age_years < 18); drives minor cohort separation and reduced restraint duration ceilings" }
      - { name: gender_care_category, type: enum, source: input, description: "Cohort category used by room mixing rules", constraints: "one of MALE | FEMALE | NONBINARY" }
      - { name: active_hold_count, type: integer, source: computed, default: 0, description: "= COUNT(HoldOrder WHERE patient_id == this Patient.id AND status == 'ACTIVE')" }

  - name: EmergencyEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; subject of the evaluation" }
      - { name: evaluating_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the creating request" }
      - { name: evaluation_started_at, type: datetime, source: system, description: "Logical clock value when the evaluation row was created" }
      - { name: danger_to_self, type: boolean, source: input, description: "Statutory criterion 1" }
      - { name: danger_to_others, type: boolean, source: input, description: "Statutory criterion 2" }
      - { name: grave_disability, type: boolean, source: input, description: "Statutory criterion 3" }
      - { name: capacity_present, type: boolean, source: input, description: "Intake screen: does the patient presently have decisional capacity to consent to admission?" }
      - { name: clinical_summary, type: string, source: input, description: "Narrative justification" }
      - { name: prior_admission_count_30d, type: integer, source: computed, description: "Cross-entity count: COUNT(Admission WHERE patient_id == this patient AND placement_status IN {PLACED, DISCHARGE_READY, DISCHARGED} AND admitted_at >= evaluation_started_at - 30 days AND admitted_at < evaluation_started_at); lower bound inclusive, upper bound exclusive" }
      - { name: acuity_score, type: integer, source: computed, description: "Output of acuity_score_and_tier" }
      - { name: acuity_tier, type: enum, source: computed, description: "Threshold tier over acuity_score", constraints: "one of LOW | MODERATE | HIGH" }
      - { name: recommended_status, type: enum, source: computed, description: "Output of acuity_score_and_tier", constraints: "one of NO_ADMISSION | VOLUNTARY | INVOLUNTARY_HOLD" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Lifecycle state", constraints: "one of DRAFT | SIGNED" }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock value at signature; statutory hold clock anchor" }

  - name: HoldOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; person detained under this hold" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> EmergencyEvaluation.id; the SIGNED evaluation supplying the statutory clock anchor" }
      - { name: predecessor_hold_id, type: string, source: system, description: "FK -> HoldOrder.id; self-referential link set only on a system-created EXTENSION_14D successor hold; null on an EMERGENCY_72H hold" }
      - { name: initiated_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the initiating request" }
      - { name: certifying_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the certifying request; null before certification" }
      - { name: hold_type, type: enum, source: input, description: "Statutory hold class", constraints: "one of EMERGENCY_72H | EXTENSION_14D; EXTENSION_14D is only ever system-created by a GRANTED hearing outcome" }
      - { name: statutory_hours, type: integer, source: computed, description: "72 for EMERGENCY_72H, 336 for EXTENSION_14D" }
      - { name: clock_started_at, type: datetime, source: computed, description: "Statutory clock anchor: EmergencyEvaluation.signed_at for EMERGENCY_72H; predecessor HoldOrder.release_deadline_at for EXTENSION_14D. NEVER the hold row's created_at." }
      - { name: certification_deadline_at, type: datetime, source: computed, description: "= clock_started_at + 4 hours; physician certification must land at or before this instant" }
      - { name: release_deadline_at, type: datetime, source: computed, description: "Variant calendar_clock of hold_deadline_pair: clock_started_at + statutory_hours, exact wall-clock, no calendar rolling" }
      - { name: petition_filing_deadline_at, type: datetime, source: computed, description: "Variant judicial_day_clock of hold_deadline_pair: same anchor and offset, then rolled forward to a judicial-day court window" }
      - { name: certified_at, type: datetime, source: system, description: "Logical clock value at certification; null before" }
      - { name: status, type: enum, source: system, default: PENDING_CERTIFICATION, description: "Legal lifecycle", constraints: "one of PENDING_CERTIFICATION | ACTIVE | EXPIRED | RESCINDED | SUPERSEDED | CONVERTED_VOLUNTARY | DISCHARGED_BY_COURT" }
      - { name: closure_reason, type: string, source: system, description: "Free-text reason recorded on rescission or court disposition; null while PENDING_CERTIFICATION or ACTIVE" }

  - name: HoldPetition
    parent: null
    common_fields: true
    fields:
      - { name: hold_id, type: string, source: input, description: "FK -> HoldOrder.id; the ACTIVE hold this petition seeks to extend" }
      - { name: petitioning_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the filing request" }
      - { name: requested_hold_type, type: enum, source: input, description: "Hold class requested from the court", constraints: "must equal EXTENSION_14D" }
      - { name: petition_grounds, type: string, source: input, description: "Statutory grounds narrative" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock value at filing" }
      - { name: continuance_count, type: integer, source: computed, default: 0, description: "= COUNT(CourtHearing WHERE petition_id == this HoldPetition.id AND status == 'CONTINUED'); ceiling of 2" }
      - { name: status, type: enum, source: system, default: FILED, description: "Cyclic petition lifecycle", constraints: "one of FILED | HEARING_SCHEDULED | CONTINUED | GRANTED | DENIED | WITHDRAWN" }

  - name: CourtHearing
    parent: null
    common_fields: true
    fields:
      - { name: petition_id, type: string, source: input, description: "FK -> HoldPetition.id; petition being heard" }
      - { name: advocate_clinician_id, type: string, source: input, description: "FK -> Clinician.id; patient representation assigned to this hearing; must have staff_role == 'RIGHTS_ADVOCATE'" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "Docket slot start" }
      - { name: duration_minutes, type: integer, source: input, description: "Docket slot length", constraints: "must be exactly 30 or 60" }
      - { name: scheduled_end_at, type: datetime, source: computed, description: "= scheduled_start_at + duration_minutes" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Hearing lifecycle", constraints: "one of SCHEDULED | HELD | CONTINUED | VACATED" }
      - { name: outcome, type: enum, source: system, default: PENDING, description: "Court disposition", constraints: "one of PENDING | GRANTED | DENIED" }
      - { name: findings_note, type: string, source: system, description: "Findings text recorded with the outcome; null while SCHEDULED" }

  - name: Admission
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; admitted person" }
      - { name: evaluation_id, type: string, source: input, description: "FK -> EmergencyEvaluation.id; SIGNED evaluation authorizing this admission" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit the admission is queued for and placed on" }
      - { name: bed_id, type: string, source: system, description: "FK -> Bed.id; bed held by this admission while placement_status == 'PLACED'; null otherwise" }
      - { name: admitting_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the creating request" }
      - { name: search_performed_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; performer of the admission contraband search; null before search" }
      - { name: search_witness_clinician_id, type: string, source: input, description: "FK -> Clinician.id; independent witness of the contraband search; must differ from search_performed_by_clinician_id" }
      - { name: legal_status, type: enum, source: system, description: "State axis 1 — legal basis of the stay; evolves independently of placement_status", constraints: "one of VOLUNTARY | INVOLUNTARY" }
      - { name: placement_status, type: enum, source: system, default: PENDING_PLACEMENT, description: "State axis 2 — physical placement lifecycle", constraints: "one of PENDING_PLACEMENT | PLACED | DISCHARGE_READY | DISCHARGED | CANCELLED" }
      - { name: acuity_tier, type: enum, source: computed, description: "Copied from EmergencyEvaluation.acuity_tier at creation; drives bed-type fit and promotion ranking", constraints: "one of LOW | MODERATE | HIGH" }
      - { name: admitted_at, type: datetime, source: system, description: "Logical clock value at admission creation" }
      - { name: placed_at, type: datetime, source: system, description: "Logical clock value when placement_status became PLACED; null before" }
      - { name: discharged_at, type: datetime, source: system, description: "Logical clock value when placement_status became DISCHARGED; null before" }
      - { name: safety_search_status, type: enum, source: system, default: PENDING, description: "Contraband/safety search protocol state", constraints: "one of PENDING | COMPLETED | REFUSED" }
      - { name: search_type, type: enum, source: input, description: "Search modality recorded on the search call; null before search", constraints: "one of VISUAL | WANDED | FULL_BODY_WITH_CONSENT" }
      - { name: search_items_secured_count, type: integer, source: input, default: 0, description: "Count of belongings secured at search" }
      - { name: contraband_found, type: boolean, source: input, default: false, description: "Whether contraband was recovered at search" }
      - { name: capacity_present, type: boolean, source: computed, description: "Mirror of the ACTIVE CapacityDetermination.capacity_present for this admission; null until the first determination is recorded" }
      - { name: discharge_plan_status, type: enum, source: system, default: NOT_STARTED, description: "Outpatient follow-up guarantee state", constraints: "one of NOT_STARTED | APPOINTMENT_SECURED" }
      - { name: follow_up_provider_name, type: string, source: input, description: "Outpatient provider named in the discharge plan; null before plan" }
      - { name: follow_up_appointment_at, type: datetime, source: input, description: "Guaranteed outpatient appointment instant; null before plan" }
      - { name: follow_up_guarantee_days, type: integer, source: computed, description: "Output of follow_up_guarantee_window" }
      - { name: follow_up_guarantee_deadline_at, type: datetime, source: computed, description: "= plan submission clock value + follow_up_guarantee_days * 24 hours" }
      - { name: observation_staff_quarter_hours, type: integer, source: computed, default: 0, description: "Output of observation_staffing_quarter_hours; per-episode ceiling summed, never sum-then-ceiling" }
      - { name: rights_violation_flag, type: boolean, source: system, default: false, description: "Set true by any sweep-detected statutory lapse (expired hold while placed, unauthorized restraint, unanswered discharge request)" }
      - { name: discharge_summary, type: string, source: input, description: "Narrative recorded at discharge; null before" }

  - name: RestraintEpisode
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission under restraint or seclusion" }
      - { name: ordered_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the ordering request" }
      - { name: face_to_face_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the face-to-face request; null before" }
      - { name: intervention_type, type: enum, source: input, description: "Intervention class", constraints: "one of PHYSICAL_HOLD | MECHANICAL_RESTRAINT | SECLUSION" }
      - { name: ordered_duration_minutes, type: integer, source: input, description: "Authorized duration in whole minutes", constraints: "> 0; ceiling enforced by restraint_duration_ceiling" }
      - { name: clinical_justification, type: string, source: input, description: "Least-restrictive-alternative narrative" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock value when the order was written" }
      - { name: authorized_until_at, type: datetime, source: computed, description: "= started_at + ordered_duration_minutes; right-open end of the seclusion occupancy interval" }
      - { name: face_to_face_deadline_at, type: datetime, source: computed, description: "= started_at + 60 minutes" }
      - { name: face_to_face_at, type: datetime, source: system, description: "Logical clock value of the in-person review; null before" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock value at release; on sweep expiry it is set to the lapsed deadline, not to the sweep instant" }
      - { name: actual_duration_minutes, type: integer, source: computed, description: "= floor((released_at - started_at) in minutes); null before release or expiry" }
      - { name: monitoring_interval_minutes, type: integer, source: computed, description: "5 for PHYSICAL_HOLD, 15 for MECHANICAL_RESTRAINT and SECLUSION" }
      - { name: required_check_count, type: integer, source: computed, description: "= ceil(actual_duration_minutes / monitoring_interval_minutes); null before release or expiry" }
      - { name: monitoring_check_log, type: array, source: system, default: [], description: "Append-only log; each element is { recorded_at: datetime, check_type: enum(CIRCULATION|HYDRATION_OFFERED|TOILETING|VITALS), recorded_by_clinician_id: string, note: string }" }
      - { name: grid_satisfied_slot_count, type: integer, source: computed, description: "Variant interval_grid of monitoring_compliance_pair: count of interval slots holding at least one log entry" }
      - { name: grid_compliance_pct, type: number, source: computed, description: "Variant interval_grid percentage; gates debriefing" }
      - { name: raw_compliance_pct, type: number, source: computed, description: "Variant raw_count percentage; quality-dashboard figure only, never gates a transition" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "Episode lifecycle with divergent branch side effects", constraints: "one of ORDERED | ACTIVE | RELEASED | DEBRIEFED | EXPIRED_UNAUTHORIZED" }
      - { name: debrief_completed_at, type: datetime, source: system, description: "Logical clock value of debriefing; null before" }
      - { name: patient_participated_in_debrief, type: boolean, source: input, description: "Debriefing participation flag; null before debrief" }
      - { name: staff_participants_count, type: integer, source: input, description: "Staff participants at debriefing; null before debrief", constraints: ">= 1 when supplied" }

  - name: CapacityDetermination
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission the determination governs" }
      - { name: determined_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the determining request" }
      - { name: capacity_present, type: boolean, source: input, description: "Whether the patient retains capacity to consent to psychotropic medication" }
      - { name: surrogate_name, type: string, source: input, description: "Substitute decision maker name; required when capacity_present == false" }
      - { name: surrogate_relationship, type: enum, source: input, description: "Substitute decision maker relationship", constraints: "one of SPOUSE | PARENT | ADULT_CHILD | GUARDIAN" }
      - { name: surrogate_authority_scope, type: enum, source: input, description: "Scope of substitute authority", constraints: "one of NONE | MEDICATION_ONLY | FULL" }
      - { name: determined_at, type: datetime, source: system, description: "Logical clock value of the determination" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "At most one ACTIVE determination per admission", constraints: "one of ACTIVE | SUPERSEDED" }

  - name: MedicationConsent
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission the consent belongs to" }
      - { name: capacity_determination_id, type: string, source: input, description: "FK -> CapacityDetermination.id; required for consent_basis == 'SURROGATE_CONSENT', null otherwise" }
      - { name: prescribing_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the creating request" }
      - { name: medication_name, type: string, source: input, description: "Psychotropic medication name" }
      - { name: consent_basis, type: enum, source: input, description: "Legal basis authorizing administration", constraints: "one of PATIENT_CONSENT | SURROGATE_CONSENT | EMERGENCY_OVERRIDE" }
      - { name: emergency_justification, type: string, source: input, description: "Required when consent_basis == 'EMERGENCY_OVERRIDE'; null otherwise" }
      - { name: expires_at, type: datetime, source: computed, description: "= creation clock value + 72 hours for consent_basis == 'EMERGENCY_OVERRIDE'; null for the other two bases" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Consent lifecycle", constraints: "one of ACTIVE | EXPIRED" }

  - name: DischargeRequest
    parent: null
    common_fields: true
    fields:
      - { name: admission_id, type: string, source: input, description: "FK -> Admission.id; admission the request targets" }
      - { name: recorded_by_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the recording request" }
      - { name: responding_clinician_id, type: string, source: system, description: "FK -> Clinician.id; copied from the X-User-ID header of the responding request; null before response" }
      - { name: requested_by, type: enum, source: input, description: "Who asked for discharge", constraints: "one of PATIENT | GUARDIAN" }
      - { name: requested_at, type: datetime, source: system, description: "Logical clock value when the request was recorded" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "Output of discharge_request_response_deadline: requested_at + 24 business hours" }
      - { name: decision, type: enum, source: system, default: PENDING, description: "Recorded decision", constraints: "one of PENDING | GRANT | DENY" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Request lifecycle", constraints: "one of PENDING | GRANTED_DISCHARGE | DENIED_HOLD_INITIATED | EXPIRED_UNANSWERED" }
      - { name: response_note, type: string, source: input, description: "Narrative recorded with the response; null before" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EmergencyEvaluation
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /behavioral-health/evaluations/{id}/sign"
        actor: IntakeClinician | AttendingPsychiatrist
        preconditions:
          - "evaluation.status == 'DRAFT'"
        side_effects:
          - "signed_at = current_utc"
          - "acuity_score, acuity_tier, prior_admission_count_30d and recommended_status are frozen at their creation-time values (no recompute)"
        note: "signed_at is the statutory anchor consumed by hold_deadline_pair; SIGNED is terminal for this entity."

  - entity: HoldOrder
    initial_state: PENDING_CERTIFICATION
    terminal_states: [EXPIRED, RESCINDED, SUPERSEDED, CONVERTED_VOLUNTARY, DISCHARGED_BY_COURT]
    transitions:
      - from: PENDING_CERTIFICATION
        to: ACTIVE
        trigger: "POST /behavioral-health/holds/{id}/certify"
        actor: AttendingPsychiatrist
        preconditions:
          - "hold.status == 'PENDING_CERTIFICATION'"
          - "X-User-ID != hold.initiated_by_clinician_id (segregation of duties)"
          - "current_utc <= hold.certification_deadline_at"
        side_effects:
          - "certified_at = current_utc; certifying_clinician_id = X-User-ID"
          - "Patient.active_hold_count recomputed (increments by 1); Patient.version increments by 1"
          - "every Admission WHERE patient_id == hold.patient_id AND placement_status IN {PENDING_PLACEMENT, PLACED} gets legal_status = 'INVOLUNTARY' and version incremented by 1"
      - from: PENDING_CERTIFICATION
        to: RESCINDED
        trigger: "POST /behavioral-health/holds/{id}/rescind"
        actor: AttendingPsychiatrist
        preconditions:
          - "hold.status IN {PENDING_CERTIFICATION, ACTIVE}"
        side_effects:
          - "closure_reason = request rescind_reason"
      - from: ACTIVE
        to: RESCINDED
        trigger: "POST /behavioral-health/holds/{id}/rescind"
        actor: AttendingPsychiatrist
        preconditions:
          - "hold.status IN {PENDING_CERTIFICATION, ACTIVE}"
        side_effects:
          - "CASCADE LINK 1 — closure_reason set; Patient.active_hold_count recomputed to 0 when no other ACTIVE hold remains"
          - "CASCADE LINK 2 (caused by link 1) — because the patient no longer has any ACTIVE hold, every Admission WHERE patient_id == hold.patient_id AND placement_status IN {PENDING_PLACEMENT, PLACED} flips legal_status INVOLUNTARY -> VOLUNTARY"
          - "CASCADE LINK 3 (caused by link 2) — because that Admission is now VOLUNTARY, each DischargeRequest WHERE admission_id == that Admission.id AND status == 'PENDING' flips to GRANTED_DISCHARGE with decision = 'GRANT' and responding_clinician_id = X-User-ID"
          - "CASCADE LINK 4 (caused by link 3) — because a discharge request was granted, that Admission's placement_status PLACED -> DISCHARGE_READY"
      - from: ACTIVE
        to: CONVERTED_VOLUNTARY
        trigger: "POST /behavioral-health/admissions/{id}/convert-to-voluntary"
        actor: AttendingPsychiatrist
        preconditions:
          - "hold.status == 'ACTIVE'"
          - "the admission's ACTIVE CapacityDetermination has capacity_present == true"
          - "no HoldPetition WHERE hold_id == hold.id AND status IN {FILED, HEARING_SCHEDULED, CONTINUED}"
        side_effects:
          - "closure_reason = request conversion_note"
          - "Patient.active_hold_count recomputed; Patient.version increments by 1"
          - "Admission.legal_status INVOLUNTARY -> VOLUNTARY; Admission.version increments by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system — POST /behavioral-health/hearings/{id}/record-outcome with outcome == 'GRANTED'"
        actor: system
        preconditions:
          - "hold.status == 'ACTIVE'"
          - "hearing.status == 'SCHEDULED' AND hearing.petition_id resolves to a petition whose hold_id == hold.id"
        side_effects:
          - "a successor HoldOrder row is created with hold_type = 'EXTENSION_14D', predecessor_hold_id = hold.id, patient_id and evaluation_id copied from the predecessor, status = 'ACTIVE', certifying_clinician_id = the petitioning_clinician_id of the granted petition, clock_started_at = predecessor.release_deadline_at, statutory_hours = 336, and both deadline variants recomputed from that anchor"
          - "Patient.active_hold_count recomputed (predecessor leaves ACTIVE, successor enters ACTIVE, net 0 change); Patient.version increments by 1"
      - from: ACTIVE
        to: DISCHARGED_BY_COURT
        trigger: "system — POST /behavioral-health/hearings/{id}/record-outcome with outcome == 'DENIED'"
        actor: system
        preconditions:
          - "hold.status == 'ACTIVE'"
        side_effects:
          - "CASCADE — closure_reason = 'COURT_DENIED_EXTENSION'; Patient.active_hold_count recomputed to 0; every Admission of that patient with placement_status IN {PENDING_PLACEMENT, PLACED} flips legal_status to VOLUNTARY; each PENDING DischargeRequest on those admissions flips to GRANTED_DISCHARGE and the admission's placement_status PLACED -> DISCHARGE_READY"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /behavioral-health/_compliance/sweep"
        actor: system
        preconditions:
          - "hold.status == 'ACTIVE'"
          - "current_utc >= hold.release_deadline_at"
          - "no HoldPetition WHERE hold_id == hold.id AND status IN {FILED, HEARING_SCHEDULED, CONTINUED} (an open petition holds the clock)"
        side_effects:
          - "closure_reason = 'STATUTORY_EXPIRY'"
          - "Patient.active_hold_count recomputed; Patient.version increments by 1"
          - "every Admission of that patient with placement_status IN {PENDING_PLACEMENT, PLACED} flips legal_status INVOLUNTARY -> VOLUNTARY; when placement_status == 'PLACED' the admission also gets rights_violation_flag = true, which recomputes Unit.open_rights_violation_count"

  - entity: HoldPetition
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /behavioral-health/hearings"
        actor: PatientRightsAdvocate | ComplianceOfficer
        preconditions:
          - "petition.status IN {FILED, CONTINUED}"
          - "advocate Clinician.staff_role == 'RIGHTS_ADVOCATE'"
        side_effects:
          - "a CourtHearing row is created with status = 'SCHEDULED'"
          - "advocate Clinician.booked_docket_minutes recomputed (increases by duration_minutes); Clinician.version increments by 1"
      - from: HEARING_SCHEDULED
        to: CONTINUED
        trigger: "POST /behavioral-health/hearings/{id}/record-outcome with outcome == 'CONTINUED'"
        actor: ComplianceOfficer
        preconditions:
          - "petition.status == 'HEARING_SCHEDULED'"
          - "petition.continuance_count < 2"
        side_effects:
          - "hearing.status SCHEDULED -> CONTINUED; petition.continuance_count recomputed"
          - "advocate Clinician.booked_docket_minutes recomputed (decreases by duration_minutes because the hearing left SCHEDULED); Clinician.version increments by 1"
      - from: CONTINUED
        to: HEARING_SCHEDULED
        trigger: "POST /behavioral-health/hearings"
        actor: PatientRightsAdvocate | ComplianceOfficer
        preconditions:
          - "petition.status IN {FILED, CONTINUED}"
          - "advocate Clinician.staff_role == 'RIGHTS_ADVOCATE'"
        side_effects:
          - "a second CourtHearing row is created with status = 'SCHEDULED'"
          - "advocate Clinician.booked_docket_minutes recomputed; Clinician.version increments by 1"
        note: "CYCLE — HEARING_SCHEDULED -> CONTINUED -> HEARING_SCHEDULED, bounded by continuance_count < 2."
      - from: HEARING_SCHEDULED
        to: GRANTED
        trigger: "POST /behavioral-health/hearings/{id}/record-outcome with outcome == 'GRANTED'"
        actor: ComplianceOfficer
        preconditions:
          - "petition.status == 'HEARING_SCHEDULED'"
          - "the petition's HoldOrder.status == 'ACTIVE'"
        side_effects:
          - "hearing.status -> HELD, hearing.outcome -> GRANTED"
          - "predecessor HoldOrder ACTIVE -> SUPERSEDED and a successor EXTENSION_14D HoldOrder is created (see HoldOrder machine)"
          - "advocate Clinician.booked_docket_minutes recomputed; Clinician.version increments by 1"
      - from: HEARING_SCHEDULED
        to: DENIED
        trigger: "POST /behavioral-health/hearings/{id}/record-outcome with outcome == 'DENIED'"
        actor: ComplianceOfficer
        preconditions:
          - "petition.status == 'HEARING_SCHEDULED'"
          - "the petition's HoldOrder.status == 'ACTIVE'"
        side_effects:
          - "hearing.status -> HELD, hearing.outcome -> DENIED"
          - "the petition's HoldOrder ACTIVE -> DISCHARGED_BY_COURT with its own cascade"
          - "advocate Clinician.booked_docket_minutes recomputed; Clinician.version increments by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /behavioral-health/petitions/{id}/withdraw"
        actor: AttendingPsychiatrist | PatientRightsAdvocate
        preconditions:
          - "petition.status IN {FILED, HEARING_SCHEDULED, CONTINUED}"
        side_effects:
          - "no hearing exists yet, so no docket minutes change"
      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: "POST /behavioral-health/petitions/{id}/withdraw"
        actor: AttendingPsychiatrist | PatientRightsAdvocate
        preconditions:
          - "petition.status IN {FILED, HEARING_SCHEDULED, CONTINUED}"
        side_effects:
          - "CASCADE LINK 1 — petition.status -> WITHDRAWN"
          - "CASCADE LINK 2 (caused by link 1) — because the petition is withdrawn, every CourtHearing WHERE petition_id == petition.id AND status == 'SCHEDULED' flips to VACATED"
          - "CASCADE LINK 3 (caused by link 2) — because those hearings left SCHEDULED, the advocate Clinician.booked_docket_minutes is recomputed downward by the vacated duration_minutes and Clinician.version increments by 1"
      - from: CONTINUED
        to: WITHDRAWN
        trigger: "POST /behavioral-health/petitions/{id}/withdraw"
        actor: AttendingPsychiatrist | PatientRightsAdvocate
        preconditions:
          - "petition.status IN {FILED, HEARING_SCHEDULED, CONTINUED}"
        side_effects:
          - "no SCHEDULED hearing exists in CONTINUED state, so docket minutes are unchanged"

  - entity: CourtHearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CONTINUED, VACATED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /behavioral-health/hearings/{id}/record-outcome with outcome IN {GRANTED, DENIED}"
        actor: ComplianceOfficer
        preconditions:
          - "hearing.status == 'SCHEDULED'"
          - "the hearing's HoldPetition.status == 'HEARING_SCHEDULED'"
          - "the petition's HoldOrder.status == 'ACTIVE'"
        side_effects:
          - "outcome and findings_note recorded; petition and hold transitions fire per the HoldPetition machine"
          - "advocate Clinician.booked_docket_minutes recomputed; Clinician.version increments by 1"
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /behavioral-health/hearings/{id}/record-outcome with outcome == 'CONTINUED'"
        actor: ComplianceOfficer
        preconditions:
          - "hearing.status == 'SCHEDULED'"
          - "the hearing's HoldPetition.continuance_count < 2"
        side_effects:
          - "petition.status HEARING_SCHEDULED -> CONTINUED; petition.continuance_count recomputed"
          - "advocate Clinician.booked_docket_minutes recomputed; Clinician.version increments by 1"
      - from: SCHEDULED
        to: VACATED
        trigger: "system — POST /behavioral-health/petitions/{id}/withdraw"
        actor: system
        preconditions:
          - "hearing.status == 'SCHEDULED'"
        side_effects:
          - "advocate Clinician.booked_docket_minutes recomputed; Clinician.version increments by 1"

  - entity: Admission
    initial_state: "PENDING_PLACEMENT (placement axis) paired with the requested_legal_status value (legal axis)"
    terminal_states: [DISCHARGED, CANCELLED]
    transitions:
      - from: "legal_status VOLUNTARY"
        to: "legal_status INVOLUNTARY"
        trigger: "POST /behavioral-health/holds/{id}/certify — axis 1 only"
        actor: AttendingPsychiatrist
        preconditions:
          - "admission.placement_status IN {PENDING_PLACEMENT, PLACED}"
          - "the certified hold's patient_id == admission.patient_id"
        side_effects:
          - "legal_status = 'INVOLUNTARY'; placement_status is untouched (axes are independent)"
      - from: "legal_status INVOLUNTARY"
        to: "legal_status VOLUNTARY"
        trigger: "POST /behavioral-health/admissions/{id}/convert-to-voluntary, or system hold rescission / statutory expiry / court denial"
        actor: AttendingPsychiatrist | system
        preconditions:
          - "admission.legal_status == 'INVOLUNTARY'"
          - "the patient has no other HoldOrder with status == 'ACTIVE'"
        side_effects:
          - "legal_status = 'VOLUNTARY'; placement_status is untouched"
      - from: "placement_status PENDING_PLACEMENT"
        to: "placement_status PLACED"
        trigger: "POST /behavioral-health/admissions/{id}/place — axis 2 only"
        actor: ChargeNurse | AttendingPsychiatrist
        preconditions:
          - "admission.placement_status == 'PENDING_PLACEMENT'"
          - "admission.safety_search_status == 'COMPLETED'"
          - "request expected_unit_version == Unit.version"
          - "Unit.posture != 'CLOSED'; when Unit.posture == 'RESTRICTED' the request must carry posture_override_reason from an AttendingPsychiatrist and admission.acuity_tier == 'HIGH'; when Unit.posture == 'OPEN' effective_available_bed_count must be >= 1"
          - "the selected Bed passes bed_placement_selector eligibility (status, bed_type fit, room cohort)"
        side_effects:
          - "bed_id = selected Bed.id; placed_at = current_utc; placement_status = 'PLACED'"
          - "Bed.status AVAILABLE -> OCCUPIED; Bed.version increments by 1"
          - "Unit.occupied_bed_count, raw_available_bed_count, posture and effective_available_bed_count recomputed; Unit.version increments by 1"
      - from: "placement_status PENDING_PLACEMENT"
        to: "placement_status PLACED"
        trigger: "system — queued-admission promotion fired by a Unit.posture transition out of CLOSED"
        actor: system
        preconditions:
          - "admission.placement_status == 'PENDING_PLACEMENT' AND admission.safety_search_status == 'COMPLETED' AND admission.unit_id == the reopening Unit.id"
          - "admission is the single winner of queued_admission_promotion ranking"
          - "bed_placement_selector yields at least one eligible Bed"
        side_effects:
          - "placement is exempt from the effective_available_bed_count gate and from the RESTRICTED safety reserve (the patient is already in facility custody), but NOT from bed eligibility or room cohort rules"
          - "bed_id set, placed_at = current_utc, placement_status = 'PLACED', Bed.status -> OCCUPIED, Unit counters and posture recomputed again"
      - from: "placement_status PENDING_PLACEMENT"
        to: "placement_status CANCELLED"
        trigger: "POST /behavioral-health/discharge-requests/{id}/respond with decision == 'GRANT' while admission.placement_status == 'PENDING_PLACEMENT'"
        actor: AttendingPsychiatrist
        preconditions:
          - "admission.placement_status == 'PENDING_PLACEMENT'"
          - "admission.legal_status == 'VOLUNTARY'"
        side_effects:
          - "placement_status = 'CANCELLED'; no bed was held so no Unit counter changes"
      - from: "placement_status PLACED"
        to: "placement_status DISCHARGE_READY"
        trigger: "POST /behavioral-health/discharge-requests/{id}/respond with decision == 'GRANT', or system cascade from hold rescission / court denial / unanswered-request expiry"
        actor: AttendingPsychiatrist | system
        preconditions:
          - "admission.placement_status == 'PLACED'"
          - "admission.legal_status == 'VOLUNTARY'"
        side_effects:
          - "placement_status = 'DISCHARGE_READY'; the bed remains OCCUPIED until physical discharge"
      - from: "placement_status PLACED or DISCHARGE_READY"
        to: "placement_status DISCHARGED"
        trigger: "POST /behavioral-health/admissions/{id}/discharge"
        actor: AttendingPsychiatrist
        preconditions:
          - "admission.placement_status IN {PLACED, DISCHARGE_READY}"
          - "admission.legal_status == 'VOLUNTARY'"
          - "admission.discharge_plan_status == 'APPOINTMENT_SECURED' AND admission.follow_up_appointment_at > current_utc"
          - "no RestraintEpisode WHERE admission_id == admission.id AND status IN {ORDERED, ACTIVE, RELEASED}"
        side_effects:
          - "CASCADE LINK 1 — placement_status = 'DISCHARGED'; discharged_at = current_utc; bed_id retained for audit"
          - "CASCADE LINK 2 (caused by link 1) — because the admission released its bed, that Bed.status OCCUPIED -> AVAILABLE and Bed.version increments by 1"
          - "CASCADE LINK 3 (caused by link 2) — because a Bed became AVAILABLE, Unit.occupied_bed_count, raw_available_bed_count, posture and effective_available_bed_count are recomputed and Unit.version increments by 1"
          - "CASCADE LINK 4 (caused by link 3, only when link 3 moved posture out of CLOSED) — the queued_admission_promotion winner for that Unit flips PENDING_PLACEMENT -> PLACED, its Bed flips AVAILABLE -> OCCUPIED, and Unit counters plus posture are recomputed a second time"

  - entity: RestraintEpisode
    initial_state: ORDERED
    terminal_states: [DEBRIEFED, EXPIRED_UNAUTHORIZED]
    transitions:
      - from: ORDERED
        to: ACTIVE
        trigger: "POST /behavioral-health/restraints/{id}/face-to-face"
        actor: AttendingPsychiatrist
        preconditions:
          - "episode.status == 'ORDERED'"
          - "current_utc <= episode.face_to_face_deadline_at"
          - "when intervention_type IN {MECHANICAL_RESTRAINT, SECLUSION}: X-User-ID != episode.ordered_by_clinician_id (segregation of duties); for PHYSICAL_HOLD the same clinician is permitted"
        side_effects:
          - "face_to_face_at = current_utc; face_to_face_clinician_id = X-User-ID"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /behavioral-health/restraints/{id}/release"
        actor: ChargeNurse | AttendingPsychiatrist
        preconditions:
          - "episode.status == 'ACTIVE'"
        side_effects:
          - "released_at = current_utc; actual_duration_minutes, required_check_count, grid_satisfied_slot_count, grid_compliance_pct and raw_compliance_pct computed per monitoring_compliance_pair"
          - "Admission.observation_staff_quarter_hours recomputed per observation_staffing_quarter_hours; Admission.version increments by 1"
          - "Unit.active_seclusion_count recomputed when intervention_type == 'SECLUSION'; Unit.version increments by 1"
      - from: RELEASED
        to: DEBRIEFED
        trigger: "POST /behavioral-health/restraints/{id}/debrief"
        actor: AttendingPsychiatrist | ChargeNurse
        preconditions:
          - "episode.status == 'RELEASED'"
          - "episode.grid_compliance_pct == 100.0 (interval_grid variant, not raw_count)"
        side_effects:
          - "debrief_completed_at = current_utc; patient_participated_in_debrief and staff_participants_count stored"
      - from: ORDERED
        to: EXPIRED_UNAUTHORIZED
        trigger: "system — POST /behavioral-health/_compliance/sweep"
        actor: system
        preconditions:
          - "episode.status == 'ORDERED'"
          - "current_utc > episode.face_to_face_deadline_at"
        side_effects:
          - "BRANCH B (divergent from the RELEASED branch) — released_at = face_to_face_deadline_at; actual_duration_minutes = 60; compliance percentages computed; Admission.rights_violation_flag = true; Unit.open_rights_violation_count recomputed; Admission.observation_staff_quarter_hours recomputed; debriefing is never reachable from this state"
      - from: ACTIVE
        to: EXPIRED_UNAUTHORIZED
        trigger: "system — POST /behavioral-health/_compliance/sweep"
        actor: system
        preconditions:
          - "episode.status == 'ACTIVE'"
          - "current_utc >= episode.authorized_until_at"
        side_effects:
          - "BRANCH B — released_at = authorized_until_at; actual_duration_minutes = ordered_duration_minutes; compliance percentages computed; Admission.rights_violation_flag = true; Unit.open_rights_violation_count recomputed; Admission.observation_staff_quarter_hours recomputed; Unit.active_seclusion_count recomputed"

  - entity: DischargeRequest
    initial_state: PENDING
    terminal_states: [GRANTED_DISCHARGE, DENIED_HOLD_INITIATED, EXPIRED_UNANSWERED]
    transitions:
      - from: PENDING
        to: GRANTED_DISCHARGE
        trigger: "POST /behavioral-health/discharge-requests/{id}/respond with decision == 'GRANT'"
        actor: AttendingPsychiatrist
        preconditions:
          - "request.status == 'PENDING'"
          - "the request's Admission.legal_status == 'VOLUNTARY'"
        side_effects:
          - "decision = 'GRANT'; responding_clinician_id = X-User-ID"
          - "Admission.placement_status PLACED -> DISCHARGE_READY, or PENDING_PLACEMENT -> CANCELLED"
      - from: PENDING
        to: DENIED_HOLD_INITIATED
        trigger: "POST /behavioral-health/discharge-requests/{id}/respond with decision == 'DENY'"
        actor: AttendingPsychiatrist
        preconditions:
          - "request.status == 'PENDING'"
          - "the patient has at least one HoldOrder with status == 'ACTIVE'"
        side_effects:
          - "decision = 'DENY'; responding_clinician_id = X-User-ID; the admission is untouched"
      - from: PENDING
        to: EXPIRED_UNANSWERED
        trigger: "system — POST /behavioral-health/_compliance/sweep"
        actor: system
        preconditions:
          - "request.status == 'PENDING'"
          - "current_utc > request.response_deadline_at"
        side_effects:
          - "Admission.rights_violation_flag = true; Unit.open_rights_violation_count recomputed"
          - "when the Admission.legal_status == 'VOLUNTARY': placement_status PLACED -> DISCHARGE_READY (or PENDING_PLACEMENT -> CANCELLED)"

  - entity: Unit
    initial_state: CLOSED
    terminal_states: []
    transitions:
      - from: "posture CLOSED"
        to: "posture RESTRICTED or OPEN"
        trigger: "system — any Bed status change (POST /behavioral-health/beds, PATCH /behavioral-health/beds/{id}) or any placement/discharge cascade"
        actor: system
        preconditions:
          - "raw_available_bed_count > 0 after the triggering mutation"
        side_effects:
          - "posture recomputed per unit_posture_and_effective_availability step 2; effective_available_bed_count recomputed at step 4"
          - "queued_admission_promotion runs exactly once for this Unit and promotes at most one PENDING_PLACEMENT admission"
      - from: "posture OPEN or RESTRICTED"
        to: "posture CLOSED"
        trigger: "system — any Bed status change or placement cascade"
        actor: system
        preconditions:
          - "raw_available_bed_count == 0 after the triggering mutation"
        side_effects:
          - "posture = 'CLOSED'; effective_available_bed_count = 0; no promotion runs"
      - from: "posture OPEN"
        to: "posture RESTRICTED"
        trigger: "system — any Bed status change or placement cascade"
        actor: system
        preconditions:
          - "raw_available_bed_count > 0 AND raw_available_bed_count <= max(1, floor(licensed_placement_bed_count * 0.20))"
        side_effects:
          - "posture = 'RESTRICTED'; safety_reserve_beds = 1; effective_available_bed_count = max(0, raw_available_bed_count - 1); no promotion runs (posture did not leave CLOSED)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on a parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: placement-stale-unit-version
    parent_entity: Unit
    write_endpoint: "POST /behavioral-health/admissions/{id}/place"
    occ_field: "expected_unit_version"
    description: |
      Placing an admission onto a Unit whose version has advanced since the
      client last read it is rejected. Bed inventory edits and other placements
      each bump Unit.version, so a placement request carrying a stale version
      number is refused rather than allowed to consume bed capacity the client
      never observed.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

  - rule_id: capacity-determination-stale-admission-version
    parent_entity: Admission
    write_endpoint: "POST /behavioral-health/capacity-determinations"
    occ_field: "expected_admission_version"
    description: |
      Recording a CapacityDetermination against an Admission whose version has
      advanced since the client last read it is rejected. A new determination
      legitimately supersedes the prior ACTIVE one, so without the version check
      a writer working from a stale view of the admission would silently
      supersede a determination it never saw.
    error_id: ERR_STALE_ADMISSION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: acuity_score_and_tier
    trigger: "POST /behavioral-health/evaluations (computed at creation and frozen by the DRAFT -> SIGNED transition)"
    algorithm: threshold
    formula: |
      prior_admission_count_30d = COUNT(Admission
          WHERE patient_id == evaluation.patient_id
            AND placement_status IN {PLACED, DISCHARGE_READY, DISCHARGED}
            AND admitted_at >= evaluation_started_at - 30 days   # inclusive
            AND admitted_at <  evaluation_started_at)            # exclusive

      acuity_score = 4 * (danger_to_self ? 1 : 0)
                   + 5 * (danger_to_others ? 1 : 0)
                   + 3 * (grave_disability ? 1 : 0)
                   + 2 * min(3, prior_admission_count_30d)
                   + 3 * (capacity_present ? 0 : 1)

      acuity_tier = HIGH      if acuity_score >= 12
                    MODERATE  if acuity_score >= 7 and acuity_score < 12
                    LOW       otherwise

      any_criterion = danger_to_self or danger_to_others or grave_disability
      recommended_status = NO_ADMISSION      if not any_criterion
                           VOLUNTARY         if any_criterion and capacity_present
                           INVOLUNTARY_HOLD  if any_criterion and not capacity_present
    input_set: "One Patient's prior Admission rows in the three non-cancelled placement states; PENDING_PLACEMENT and CANCELLED admissions are excluded from the recency count."
    constants:
      WEIGHT_DANGER_SELF: 4
      WEIGHT_DANGER_OTHERS: 5
      WEIGHT_GRAVE_DISABILITY: 3
      WEIGHT_PER_PRIOR_ADMISSION: 2
      PRIOR_ADMISSION_CAP: 3
      WEIGHT_CAPACITY_ABSENT: 3
      TIER_HIGH_MIN: 12
      TIER_MODERATE_MIN: 7
      RECENCY_WINDOW_DAYS: 30
    precision: "integer score; tier boundaries are inclusive lower bounds (>=), so a score of exactly 12 is HIGH and exactly 7 is MODERATE"

  - name: hold_deadline_pair
    trigger: "POST /behavioral-health/holds (both variants computed at creation) and re-computed for the system-created EXTENSION_14D successor hold"
    algorithm: interval_merge
    formula: |
      statutory_hours   = 72  if hold_type == EMERGENCY_72H
                          336 if hold_type == EXTENSION_14D
      clock_started_at  = EmergencyEvaluation.signed_at        if hold_type == EMERGENCY_72H
                          predecessor HoldOrder.release_deadline_at if hold_type == EXTENSION_14D
      certification_deadline_at = clock_started_at + 4 hours

      # variant calendar_clock
      release_deadline_at = clock_started_at + statutory_hours hours   # exact, no rolling

      # variant judicial_day_clock
      c = clock_started_at + statutory_hours hours
      loop:
        if date(c) is Saturday, Sunday, or in HOLIDAY_DATES:
            c = (date(c) + 1 day) at 09:00:00.000Z ; continue loop
        if time(c) < 09:00:00: c = date(c) at 09:00:00.000Z ; continue loop
        if time(c) > 16:00:00: c = (date(c) + 1 day) at 09:00:00.000Z ; continue loop
        petition_filing_deadline_at = c ; exit loop
    input_set: "One HoldOrder plus its anchoring EmergencyEvaluation (or predecessor HoldOrder). No other rows participate."
    constants:
      EMERGENCY_HOURS: 72
      EXTENSION_HOURS: 336
      CERTIFICATION_WINDOW_HOURS: 4
      COURT_DAY_OPEN_UTC: "09:00:00"
      COURT_DAY_CLOSE_UTC: "16:00:00"
      HOLIDAY_DATES: ["2026-01-01", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25"]
    precision: "millisecond-truncated ISO 8601 UTC with three fractional digits; rolled instants always land exactly on 09:00:00.000Z"
    variants:
      - name: calendar_clock
        when: "release_deadline_at — the instant at which detention authority lapses and the sweep may expire the hold"
        difference: "Pure wall-clock addition. Weekends and holidays are counted, so the deadline may fall at 02:00 on a Sunday."
      - name: judicial_day_clock
        when: "petition_filing_deadline_at — the last instant at which an extension petition may be filed"
        difference: "Same anchor and same offset, then rolled forward to the next judicial-day 09:00:00.000Z whenever the raw instant lands on a weekend, a HOLIDAY_DATES date, or outside the 09:00–16:00 court window. For identical inputs the two variants differ (e.g. anchor 2026-09-03T14:30:00Z gives 2026-09-06T14:30:00.000Z vs 2026-09-08T09:00:00.000Z)."

  - name: monitoring_compliance_pair
    trigger: "POST /behavioral-health/restraints/{id}/release and the ORDERED/ACTIVE -> EXPIRED_UNAUTHORIZED sweep transitions"
    algorithm: aggregation
    formula: |
      monitoring_interval_minutes = 5  if intervention_type == PHYSICAL_HOLD
                                    15 if intervention_type IN {MECHANICAL_RESTRAINT, SECLUSION}
      actual_duration_minutes = floor((released_at - started_at) in minutes)
      required_check_count    = ceil(actual_duration_minutes / monitoring_interval_minutes)

      # variant interval_grid  (gates debriefing)
      slot(k) = [started_at + (k-1)*interval, started_at + k*interval)   for k = 1..required_check_count
      grid_satisfied_slot_count = COUNT of k in 1..required_check_count such that
          at least one monitoring_check_log entry has recorded_at inside slot(k)
      grid_compliance_pct = round_half_up(100 * grid_satisfied_slot_count / required_check_count, 1)

      # variant raw_count  (dashboard only)
      raw_compliance_pct = round_half_up(
          100 * min(required_check_count, LENGTH(monitoring_check_log)) / required_check_count, 1)
    input_set: "The episode's own monitoring_check_log entries with recorded_at in [started_at, released_at); entries recorded after released_at cannot exist because the log endpoint rejects non-ORDERED/ACTIVE episodes."
    constants:
      INTERVAL_PHYSICAL_HOLD_MIN: 5
      INTERVAL_MECHANICAL_MIN: 15
      INTERVAL_SECLUSION_MIN: 15
    precision: "one decimal place, round_half_up; when required_check_count == 0 both percentages are 100.0"
    variants:
      - name: interval_grid
        when: "grid_compliance_pct — the only figure the RELEASED -> DEBRIEFED precondition consults"
        difference: "Credits at most one entry per interval slot, so clustered checks leave later slots unsatisfied."
      - name: raw_count
        when: "raw_compliance_pct — reported for quality dashboards; never gates a transition"
        difference: "Counts entries without regard to which slot they fall in. For a 30-minute mechanical restraint with checks at +3 and +7 minutes the two variants diverge: grid 50.0 vs raw 100.0."

  - name: observation_staffing_quarter_hours
    trigger: "RestraintEpisode ACTIVE -> RELEASED and the two -> EXPIRED_UNAUTHORIZED sweep transitions"
    algorithm: aggregation
    formula: |
      observation_staff_quarter_hours = SUM over e in Episodes of ceil(e.actual_duration_minutes / 15)
      where Episodes = RestraintEpisode rows
          WHERE admission_id == admission.id
            AND status IN {RELEASED, DEBRIEFED, EXPIRED_UNAUTHORIZED}
          ordered by started_at ASC, then created_at ASC   # order does not change the sum but is pinned for auditability
    input_set: "Only episodes of this admission that have a non-null actual_duration_minutes, i.e. status IN {RELEASED, DEBRIEFED, EXPIRED_UNAUTHORIZED}; ORDERED and ACTIVE episodes contribute nothing."
    constants:
      QUARTER_HOUR_MINUTES: 15
    precision: |
      Integer quarter-hours. ROUNDING ORDER IS PINNED: ceiling is applied PER EPISODE and the
      ceilings are then summed. Summing raw minutes first and taking a single ceiling is wrong —
      two 20-minute episodes yield 2 + 2 = 4 quarter-hours, not ceil(40/15) = 3.

  - name: unit_posture_and_effective_availability
    trigger: "POST /behavioral-health/beds, PATCH /behavioral-health/beds/{id}, admission placement, queued promotion, and discharge cascade link 3"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 — raw inventory, from Bed.status only
      licensed_placement_bed_count = COUNT(Bed WHERE unit_id == unit.id
              AND bed_type IN {STANDARD, LIGATURE_RESISTANT_OBSERVATION}
              AND status != 'OUT_OF_SERVICE')
      raw_available_bed_count      = COUNT(Bed WHERE unit_id == unit.id
              AND bed_type IN {STANDARD, LIGATURE_RESISTANT_OBSERVATION}
              AND status == 'AVAILABLE')

      # STEP 2 — posture, derived from raw_available_bed_count ONLY
      restricted_threshold = max(1, floor(licensed_placement_bed_count * 0.20))
      posture = CLOSED      if raw_available_bed_count == 0
                RESTRICTED  if raw_available_bed_count <= restricted_threshold
                OPEN        otherwise

      # STEP 3 — reserve, derived from posture
      safety_reserve_beds = 1 if posture == RESTRICTED else 0

      # STEP 4 — effective availability, derived from steps 1 and 3
      effective_available_bed_count = max(0, raw_available_bed_count - safety_reserve_beds)
    input_set: "All Bed rows of the unit; SECLUSION beds are excluded from both counts and therefore never affect posture."
    constants:
      RESTRICTED_FRACTION: 0.20
      RESTRICTED_FLOOR: 1
      RESERVE_WHEN_RESTRICTED: 1
    precision: |
      Integer counts. EVALUATION ORDER IS PINNED AND NON-CIRCULAR: posture is computed at step 2
      from raw_available_bed_count and is NEVER recomputed from effective_available_bed_count, even
      though step 4 subtracts a reserve that step 3 derived from posture. No fixed-point iteration.
      Consequence to preserve: a unit with licensed_placement_bed_count == 3 and
      raw_available_bed_count == 1 is RESTRICTED with effective_available_bed_count == 0, so an
      ordinary placement is refused while a physically free bed exists.

  - name: bed_placement_selector
    trigger: "POST /behavioral-health/admissions/{id}/place when bed_id is omitted, and the system queued-admission promotion"
    algorithm: weighted_scoring
    formula: |
      # (a) ELIGIBILITY FILTER — candidate set
      candidates = Bed rows WHERE unit_id == request unit_id
          AND status == 'AVAILABLE'
          AND bed_type IN {STANDARD, LIGATURE_RESISTANT_OBSERVATION}
          AND (admission.acuity_tier != 'HIGH' OR bed_type == 'LIGATURE_RESISTANT_OBSERVATION')
          AND room_cohort_ok(bed)
          AND minor_cohort_ok(bed)

      roommates(bed) = Admission rows WHERE placement_status == 'PLACED'
          AND bed_id resolves to a Bed with the same unit_id AND the same room_number as bed
      wingmates(bed) = same but matching wing_code instead of room_number

      room_cohort_ok(bed) =
          unit.gender_mixing_policy == 'MIXED_ALLOWED'      -> true
          unit.gender_mixing_policy == 'SEPARATE_BY_ROOM'   -> every roommate's Patient.gender_care_category
                                                              == this Patient.gender_care_category
          unit.gender_mixing_policy == 'SEPARATE_BY_WING'   -> every wingmate's Patient.gender_care_category
                                                              == this Patient.gender_care_category
      minor_cohort_ok(bed) = every roommate's Patient.is_minor == this Patient.is_minor
          # applies under all three policies, including MIXED_ALLOWED

      # (b) RANKING EXPRESSION — ascending lexicographic tuple
      exact_fit_type = 'LIGATURE_RESISTANT_OBSERVATION' if admission.acuity_tier IN {HIGH, MODERATE}
                       else 'STANDARD'
      rank(bed) = ( COUNT(roommates(bed)),                       # 1. emptier room first
                    0 if bed.bed_type == exact_fit_type else 1,  # 2. exact bed-type fit first
                    bed.room_number,                             # 3. lexicographic ascending
                    bed.bed_label,                               # 4. lexicographic ascending
                    bed.created_at )                             # 5. earliest created first
      selected = the single candidate with the smallest rank tuple

      # (c) TIE-BREAK: keys 3-5 are unique per unit, so rank is a total order.
      # (d) EMPTY-POOL FALLBACK: candidates == {} -> ERR_NO_ELIGIBLE_BED (409) for an explicit
      #     placement call; for the system promotion the admission simply stays PENDING_PLACEMENT.
    input_set: "Bed rows of the requested unit only; occupancy context comes from Admission rows with placement_status == 'PLACED' on that unit."
    constants:
      SELECTABLE_BED_TYPES: ["STANDARD", "LIGATURE_RESISTANT_OBSERVATION"]
    precision: "Deterministic total order. Bed.id / Admission.id (random UUIDs) are never consulted; created_at is the only common-field fallback."

  - name: queued_admission_promotion
    trigger: "system — Unit.posture transition out of CLOSED (discharge cascade link 4, bed un-blocking, bed creation)"
    algorithm: chronological
    formula: |
      # (a) ELIGIBILITY FILTER
      queue = Admission rows WHERE unit_id == unit.id
          AND placement_status == 'PENDING_PLACEMENT'
          AND safety_search_status == 'COMPLETED'
      # (b) RANKING EXPRESSION — descending acuity, then oldest first
      acuity_rank = 3 if acuity_tier == 'HIGH' else 2 if acuity_tier == 'MODERATE' else 1
      order by acuity_rank DESC, created_at ASC
      # (c) TIE-BREAK when acuity_rank and created_at are identical: Patient.mrn ASC
      # (d) EMPTY-QUEUE FALLBACK: queue == {} -> no promotion, no error, posture stands
      winner = first row of the ordered queue
      then apply bed_placement_selector for winner; if it yields no candidate, no promotion happens
    input_set: "Admission rows of the reopening unit in PENDING_PLACEMENT with a COMPLETED safety search; PENDING and REFUSED searches are excluded."
    constants:
      PROMOTIONS_PER_POSTURE_REOPEN: 1
    precision: "Exactly one promotion per posture transition out of CLOSED. Random ids are never consulted; created_at then Patient.mrn are the deterministic fallbacks."

  - name: discharge_request_response_deadline
    trigger: "POST /behavioral-health/discharge-requests"
    algorithm: interval_merge
    formula: |
      remaining = 24 business hours ; c = requested_at
      loop:
        open  = date(c) at 08:00:00.000Z ; close = date(c) at 17:00:00.000Z
        if date(c) is Saturday, Sunday, or in HOLIDAY_DATES, or c >= close:
            c = (date(c) + 1 day) at 08:00:00.000Z ; continue loop
        if c < open: c = open
        available = close - c
        if available >= remaining: response_deadline_at = c + remaining ; exit loop
        remaining = remaining - available
        c = (date(c) + 1 day) at 08:00:00.000Z ; continue loop
    input_set: "One DischargeRequest and the shared business calendar. No other rows participate."
    constants:
      BUSINESS_HOURS_BUDGET: 24
      BUSINESS_DAY_OPEN_UTC: "08:00:00"
      BUSINESS_DAY_CLOSE_UTC: "17:00:00"
      BUSINESS_HOURS_PER_DAY: 9
      HOLIDAY_DATES: ["2026-01-01", "2026-07-03", "2026-09-07", "2026-11-26", "2026-12-25"]
    precision: "millisecond-truncated ISO 8601 UTC; e.g. requested_at 2026-09-03T15:00:00Z yields 2026-09-09T12:00:00.000Z (2h Thu + 9h Fri + Sat/Sun skipped + 2026-09-07 holiday skipped + 9h Tue + 4h Wed)"

  - name: follow_up_guarantee_window
    trigger: "POST /behavioral-health/admissions/{id}/discharge-plan"
    algorithm: threshold
    formula: |
      base_days = 7  if admission.legal_status == 'INVOLUNTARY' and admission.acuity_tier == 'HIGH'
                  10 if admission.legal_status == 'INVOLUNTARY' and admission.acuity_tier != 'HIGH'
                  14 if admission.legal_status == 'VOLUNTARY'
      follow_up_guarantee_days = min(base_days, 5) if Patient.is_minor else base_days
      follow_up_guarantee_deadline_at = current_utc + follow_up_guarantee_days * 24 hours
      ACCEPT the plan only when current_utc < follow_up_appointment_at <= follow_up_guarantee_deadline_at
    input_set: "The admission being planned, its Patient, and the logical clock at plan submission. The window is anchored to plan submission time, never to the later discharge instant."
    constants:
      DAYS_INVOLUNTARY_HIGH: 7
      DAYS_INVOLUNTARY_OTHER: 10
      DAYS_VOLUNTARY: 14
      MINOR_CEILING_DAYS: 5
    precision: "integer days; the upper bound is inclusive (an appointment exactly at follow_up_guarantee_deadline_at is accepted) and the lower bound is exclusive (an appointment at exactly current_utc is rejected)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,        check: "X-User-Role and X-User-ID headers present and X-User-Role is one of the five declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: all }
  - { priority: 2,  category: auth,        check: "the acting role appears in the endpoint's roles list; posture_override_reason on place is accepted only from AttendingPsychiatrist", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: all }
  - { priority: 3,  category: business_constraint, check: "request body schema: required fields present, enum members valid, integers within declared constraints, duration_minutes IN {30, 60}, hold_type == 'EMERGENCY_72H' on POST /holds, requested_hold_type == 'EXTENSION_14D' on POST /petitions", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: all }
  - { priority: 4,  category: existence,   check: "path-segment Patient id resolves", error_id: ERR_PATIENT_NOT_FOUND, http_status: 404, applies_to: "GET /patients/{id}, POST /evaluations (body patient_id), POST /holds (body patient_id), POST /admissions (body patient_id)" }
  - { priority: 5,  category: existence,   check: "path-segment or body Unit id resolves", error_id: ERR_UNIT_NOT_FOUND, http_status: 404, applies_to: "GET /units/{id}, GET /units/{id}/beds, POST /beds, POST /admissions, POST /admissions/{id}/place" }
  - { priority: 6,  category: existence,   check: "path-segment or body EmergencyEvaluation id resolves", error_id: ERR_EVALUATION_NOT_FOUND, http_status: 404, applies_to: "GET /evaluations/{id}, POST /evaluations/{id}/sign, POST /holds, POST /admissions" }
  - { priority: 7,  category: existence,   check: "path-segment or body Admission id resolves", error_id: ERR_ADMISSION_NOT_FOUND, http_status: 404, applies_to: "GET /admissions/{id}, all POST /admissions/{id}/* actions, POST /restraints, POST /capacity-determinations, POST /medication-consents, POST /discharge-requests" }
  - { priority: 8,  category: existence,   check: "path-segment or body HoldOrder id resolves", error_id: ERR_HOLD_NOT_FOUND, http_status: 404, applies_to: "GET /holds/{id}, POST /holds/{id}/certify, POST /holds/{id}/rescind, POST /petitions" }
  - { priority: 9,  category: existence,   check: "every other referenced id resolves — Clinician (witness, advocate), Bed, HoldPetition, CourtHearing, RestraintEpisode, CapacityDetermination, DischargeRequest — validated left-to-right, path segments before body fields", error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http_status: 404, applies_to: all }
  - { priority: 10, category: state,       check: "expected_unit_version equals Unit.version", error_id: ERR_STALE_UNIT_VERSION, http_status: 412, applies_to: "POST /admissions/{id}/place" }
  - { priority: 11, category: state,       check: "expected_admission_version equals Admission.version", error_id: ERR_STALE_ADMISSION_VERSION, http_status: 412, applies_to: "POST /capacity-determinations" }
  - { priority: 12, category: state,       check: "evaluation.status == 'DRAFT'", error_id: ERR_EVALUATION_ALREADY_SIGNED, http_status: 409, applies_to: "POST /evaluations/{id}/sign" }
  - { priority: 13, category: state,       check: "evaluation.status == 'SIGNED'", error_id: ERR_EVALUATION_NOT_SIGNED, http_status: 409, applies_to: "POST /holds, POST /admissions" }
  - { priority: 14, category: state,       check: "hold.status == 'PENDING_CERTIFICATION'", error_id: ERR_HOLD_NOT_PENDING_CERTIFICATION, http_status: 409, applies_to: "POST /holds/{id}/certify" }
  - { priority: 15, category: state,       check: "hold.status == 'ACTIVE' (rescind accepts PENDING_CERTIFICATION or ACTIVE)", error_id: ERR_HOLD_NOT_ACTIVE, http_status: 409, applies_to: "POST /petitions, POST /holds/{id}/rescind, POST /admissions/{id}/convert-to-voluntary" }
  - { priority: 16, category: state,       check: "admission.placement_status == 'PENDING_PLACEMENT'", error_id: ERR_ADMISSION_NOT_PLACEABLE, http_status: 409, applies_to: "POST /admissions/{id}/place" }
  - { priority: 17, category: state,       check: "admission.placement_status IN {PLACED, DISCHARGE_READY} for discharge; IN {PENDING_PLACEMENT, PLACED} for safety-search, discharge-plan, convert-to-voluntary and discharge-request creation", error_id: ERR_ADMISSION_NOT_DISCHARGEABLE, http_status: 409, applies_to: "POST /admissions/{id}/discharge, POST /admissions/{id}/safety-search, POST /admissions/{id}/discharge-plan, POST /admissions/{id}/convert-to-voluntary, POST /discharge-requests" }
  - { priority: 18, category: state,       check: "petition.status IN {FILED, CONTINUED} for hearing scheduling; IN {FILED, HEARING_SCHEDULED, CONTINUED} for withdrawal; == 'HEARING_SCHEDULED' for outcome recording", error_id: ERR_PETITION_NOT_OPEN, http_status: 409, applies_to: "POST /hearings, POST /petitions/{id}/withdraw, POST /hearings/{id}/record-outcome" }
  - { priority: 19, category: state,       check: "hearing.status == 'SCHEDULED'", error_id: ERR_HEARING_NOT_SCHEDULED, http_status: 409, applies_to: "POST /hearings/{id}/record-outcome" }
  - { priority: 20, category: state,       check: "episode.status == 'ORDERED' for face-to-face; == 'ACTIVE' for release; IN {ORDERED, ACTIVE} for monitoring checks; == 'RELEASED' for debrief", error_id: ERR_RESTRAINT_INVALID_STATE, http_status: 409, applies_to: "POST /restraints/{id}/face-to-face, POST /restraints/{id}/release, POST /restraints/{id}/monitoring-checks, POST /restraints/{id}/debrief" }
  - { priority: 21, category: state,       check: "request.status == 'PENDING'", error_id: ERR_DISCHARGE_REQUEST_NOT_PENDING, http_status: 409, applies_to: "POST /discharge-requests/{id}/respond" }
  - { priority: 22, category: business_safety, check: "acting X-User-ID differs from the counterpart clinician: hold certifier != initiator; safety-search witness != performer; restraint face-to-face reviewer != orderer when intervention_type IN {MECHANICAL_RESTRAINT, SECLUSION}", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /holds/{id}/certify, POST /admissions/{id}/safety-search, POST /restraints/{id}/face-to-face" }
  - { priority: 23, category: business_safety, check: "evaluation.recommended_status == 'INVOLUNTARY_HOLD' for hold initiation; evaluation.recommended_status IN {VOLUNTARY, INVOLUNTARY_HOLD} for admission creation", error_id: ERR_CLINICAL_CRITERIA_NOT_MET, http_status: 422, applies_to: "POST /holds, POST /admissions" }
  - { priority: 24, category: business_safety, check: "admission.safety_search_status == 'COMPLETED'", error_id: ERR_SAFETY_SEARCH_INCOMPLETE, http_status: 409, applies_to: "POST /admissions/{id}/place" }
  - { priority: 25, category: business_safety, check: "ordered_duration_minutes within the ceiling: adult 60 for PHYSICAL_HOLD else 240; minor 30 for PHYSICAL_HOLD else 120", error_id: ERR_RESTRAINT_DURATION_EXCEEDS_LIMIT, http_status: 422, applies_to: "POST /restraints" }
  - { priority: 26, category: business_safety, check: "COUNT(RestraintEpisode WHERE intervention_type == 'SECLUSION' AND status IN {ORDERED, ACTIVE} AND authorized_until_at > current_utc AND the episode's admission unit_id == this unit) < Unit.seclusion_room_count", error_id: ERR_SECLUSION_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /restraints (intervention_type == 'SECLUSION')" }
  - { priority: 27, category: business_temporal, check: "current_utc <= episode.face_to_face_deadline_at", error_id: ERR_FACE_TO_FACE_WINDOW_CLOSED, http_status: 409, applies_to: "POST /restraints/{id}/face-to-face" }
  - { priority: 28, category: business_safety, check: "episode.grid_compliance_pct == 100.0", error_id: ERR_MONITORING_INCOMPLETE, http_status: 409, applies_to: "POST /restraints/{id}/debrief" }
  - { priority: 29, category: business_safety, check: "no RestraintEpisode of this admission has status IN {ORDERED, ACTIVE, RELEASED}", error_id: ERR_OPEN_RESTRAINT_EPISODE, http_status: 409, applies_to: "POST /admissions/{id}/discharge" }
  - { priority: 30, category: business_temporal, check: "current_utc <= hold.certification_deadline_at", error_id: ERR_CERTIFICATION_WINDOW_CLOSED, http_status: 409, applies_to: "POST /holds/{id}/certify" }
  - { priority: 31, category: business_temporal, check: "current_utc <= hold.petition_filing_deadline_at", error_id: ERR_PETITION_WINDOW_CLOSED, http_status: 422, applies_to: "POST /petitions" }
  - { priority: 32, category: business_temporal, check: "scheduled_start_at falls on a judicial day (not Saturday, Sunday, or a HOLIDAY_DATES date), scheduled_start_at time >= 09:00:00 and scheduled_end_at time <= 16:00:00, and scheduled_start_at > current_utc", error_id: ERR_HEARING_SLOT_INVALID, http_status: 422, applies_to: "POST /hearings" }
  - { priority: 33, category: business_temporal, check: "scheduled_end_at <= the petition's HoldOrder.release_deadline_at", error_id: ERR_HEARING_BEYOND_HOLD_EXPIRY, http_status: 422, applies_to: "POST /hearings" }
  - { priority: 34, category: business_temporal, check: "for every CourtHearing with the same advocate_clinician_id and status == 'SCHEDULED': NOT ((new_start - 30 min) < existing_end AND existing_start < (new_end + 30 min)) — closed intervals expanded by a 30-minute travel buffer, so a gap of exactly 30 minutes is permitted and 29 minutes is not", error_id: ERR_ADVOCATE_DOCKET_CONFLICT, http_status: 409, applies_to: "POST /hearings" }
  - { priority: 35, category: business_referential, check: "advocate Clinician.staff_role == 'RIGHTS_ADVOCATE'", error_id: ERR_ADVOCATE_NOT_QUALIFIED, http_status: 422, applies_to: "POST /hearings" }
  - { priority: 36, category: business_referential, check: "the admission has an ACTIVE CapacityDetermination with capacity_present == true (required for convert-to-voluntary and for consent_basis == 'PATIENT_CONSENT')", error_id: ERR_CAPACITY_LACKING, http_status: 409, applies_to: "POST /admissions/{id}/convert-to-voluntary, POST /medication-consents" }
  - { priority: 37, category: business_referential, check: "when capacity_present == false the body carries surrogate_name, surrogate_relationship and surrogate_authority_scope; when capacity_present == true all three are absent", error_id: ERR_SURROGATE_REQUIRED, http_status: 422, applies_to: "POST /capacity-determinations" }
  - { priority: 38, category: business_referential, check: "for consent_basis == 'SURROGATE_CONSENT': the referenced CapacityDetermination has status == 'ACTIVE', capacity_present == false and surrogate_authority_scope IN {MEDICATION_ONLY, FULL}", error_id: ERR_SURROGATE_SCOPE_INSUFFICIENT, http_status: 409, applies_to: "POST /medication-consents" }
  - { priority: 39, category: business_referential, check: "the patient has at least one HoldOrder with status == 'ACTIVE' (required for requested_legal_status == 'INVOLUNTARY', for decision == 'DENY', and for consent_basis == 'EMERGENCY_OVERRIDE' which additionally requires admission.legal_status == 'INVOLUNTARY' and a non-empty emergency_justification)", error_id: ERR_NO_ACTIVE_HOLD, http_status: 409, applies_to: "POST /admissions, POST /discharge-requests/{id}/respond, POST /medication-consents" }
  - { priority: 40, category: business_constraint, check: "no HoldPetition for this hold has status IN {FILED, HEARING_SCHEDULED, CONTINUED}", error_id: ERR_PETITION_PENDING, http_status: 409, applies_to: "POST /petitions, POST /admissions/{id}/convert-to-voluntary" }
  - { priority: 41, category: business_constraint, check: "admission.legal_status == 'VOLUNTARY'", error_id: ERR_ACTIVE_HOLD_BLOCKS_DISCHARGE, http_status: 409, applies_to: "POST /admissions/{id}/discharge, POST /discharge-requests/{id}/respond (decision == 'GRANT')" }
  - { priority: 42, category: business_constraint, check: "no other DischargeRequest for this admission has status == 'PENDING'", error_id: ERR_DUPLICATE_DISCHARGE_REQUEST, http_status: 409, applies_to: "POST /discharge-requests" }
  - { priority: 43, category: business_constraint, check: "petition.continuance_count < 2", error_id: ERR_CONTINUANCE_LIMIT_REACHED, http_status: 409, applies_to: "POST /hearings/{id}/record-outcome (outcome == 'CONTINUED')" }
  - { priority: 44, category: business_constraint, check: "the target bed passes room_cohort_ok and minor_cohort_ok of bed_placement_selector", error_id: ERR_ROOM_COHORT_VIOLATION, http_status: 409, applies_to: "POST /admissions/{id}/place" }
  - { priority: 45, category: business_constraint, check: "an explicitly supplied bed_id belongs to the requested unit, has status == 'AVAILABLE', bed_type IN {STANDARD, LIGATURE_RESISTANT_OBSERVATION}, and bed_type == 'LIGATURE_RESISTANT_OBSERVATION' when admission.acuity_tier == 'HIGH'", error_id: ERR_BED_NOT_ELIGIBLE, http_status: 409, applies_to: "POST /admissions/{id}/place" }
  - { priority: 46, category: business_constraint, check: "admission.discharge_plan_status == 'APPOINTMENT_SECURED' and admission.follow_up_appointment_at > current_utc", error_id: ERR_DISCHARGE_PLAN_INCOMPLETE, http_status: 409, applies_to: "POST /admissions/{id}/discharge" }
  - { priority: 47, category: business_temporal, check: "current_utc < follow_up_appointment_at <= follow_up_guarantee_deadline_at per follow_up_guarantee_window", error_id: ERR_FOLLOW_UP_WINDOW_EXCEEDED, http_status: 422, applies_to: "POST /admissions/{id}/discharge-plan" }
  - { priority: 48, category: business_fiscal, check: "Unit.posture != 'CLOSED'; when posture == 'RESTRICTED' an AttendingPsychiatrist posture_override_reason plus admission.acuity_tier == 'HIGH' is required; when posture == 'OPEN' effective_available_bed_count must be >= 1", error_id: ERR_UNIT_POSTURE_BLOCKED, http_status: 409, applies_to: "POST /admissions/{id}/place" }
  - { priority: 49, category: business_fiscal, check: "bed_placement_selector yields a non-empty candidate set when bed_id is omitted", error_id: ERR_NO_ELIGIBLE_BED, http_status: 409, applies_to: "POST /admissions/{id}/place" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- roster / inventory -----------------------------------------------------
  - method: POST
    path: "/behavioral-health/clinicians"
    description: "Register a staff member"
    roles: [ComplianceOfficer]
    code: 201
    input: [full_name, staff_role, license_number]
    output: Clinician
    side_effects: ["booked_docket_minutes initialised to 0"]

  - method: GET
    path: "/behavioral-health/clinicians/{id}"
    description: "Read one clinician including booked_docket_minutes"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: POST
    path: "/behavioral-health/units"
    description: "Create a behavioral health unit"
    roles: [ComplianceOfficer]
    code: 201
    input: [name, gender_mixing_policy, seclusion_room_count]
    output: Unit
    side_effects: ["posture computed with zero beds, so the unit starts CLOSED"]

  - method: GET
    path: "/behavioral-health/units/{id}"
    description: "Read one unit including posture, counters and version (source of expected_unit_version)"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/behavioral-health/beds"
    description: "Add a bed to a unit"
    roles: [ComplianceOfficer]
    code: 201
    input: [unit_id, room_number, wing_code, bed_label, bed_type]
    output: Bed
    side_effects: ["recomputes unit_posture_and_effective_availability", "increments Unit.version by 1", "may fire queued_admission_promotion when posture leaves CLOSED"]

  - method: GET
    path: "/behavioral-health/units/{id}/beds"
    description: "List the beds of a unit (reverse reachability for Bed.unit_id)"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["status?", "bed_type?", "limit?", "offset?"]
    output: Bed[]
    side_effects: []

  - method: PATCH
    path: "/behavioral-health/beds/{id}"
    description: "Change a bed's status (cleaning block, out of service, or return to service)"
    roles: [ComplianceOfficer, ChargeNurse]
    code: 200
    input: [status]
    output: Bed
    side_effects: ["recomputes unit_posture_and_effective_availability", "increments Unit.version by 1", "may fire queued_admission_promotion when posture leaves CLOSED"]

  - method: POST
    path: "/behavioral-health/patients"
    description: "Register a patient"
    roles: [ComplianceOfficer, IntakeClinician]
    code: 201
    input: [mrn, legal_name, age_years, gender_care_category]
    output: Patient
    side_effects: ["computes is_minor", "active_hold_count initialised to 0"]

  - method: GET
    path: "/behavioral-health/patients/{id}"
    description: "Read one patient including is_minor and active_hold_count"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- logical clock and compliance sweep (test-driving surface) --------------
  - method: POST
    path: "/behavioral-health/_clock/set_current_utc"
    description: "Set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every deadline computation reads that default and never the real wall clock."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity state changes; expiries are applied only by the compliance sweep"]

  - method: POST
    path: "/behavioral-health/_compliance/sweep"
    description: "Advance statutory expiries at the current logical clock: hold statutory expiry, unauthorized restraint expiry, unanswered discharge request expiry, emergency medication consent expiry"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: "{ expired_hold_count: integer, expired_restraint_count: integer, expired_discharge_request_count: integer, expired_consent_count: integer }"
    side_effects: ["HoldOrder ACTIVE -> EXPIRED with its cascade", "RestraintEpisode ORDERED/ACTIVE -> EXPIRED_UNAUTHORIZED with rights-violation flags and observation_staffing_quarter_hours recompute", "DischargeRequest PENDING -> EXPIRED_UNANSWERED with rights-violation flag", "MedicationConsent ACTIVE -> EXPIRED for EMERGENCY_OVERRIDE past expires_at"]

  # --- emergency evaluation ---------------------------------------------------
  - method: POST
    path: "/behavioral-health/evaluations"
    description: "Record an emergency psychiatric evaluation"
    roles: [IntakeClinician, AttendingPsychiatrist]
    code: 201
    input: [patient_id, danger_to_self, danger_to_others, grave_disability, capacity_present, clinical_summary]
    output: EmergencyEvaluation
    side_effects: ["computes prior_admission_count_30d, acuity_score, acuity_tier and recommended_status per acuity_score_and_tier", "status = DRAFT"]

  - method: POST
    path: "/behavioral-health/evaluations/{id}/sign"
    description: "Sign the evaluation, freezing the statutory clock anchor"
    roles: [IntakeClinician, AttendingPsychiatrist]
    code: 200
    input: []
    output: EmergencyEvaluation
    side_effects: ["status DRAFT -> SIGNED", "signed_at = current logical clock"]

  - method: GET
    path: "/behavioral-health/evaluations/{id}"
    description: "Read one evaluation"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: EmergencyEvaluation
    side_effects: []

  - method: GET
    path: "/behavioral-health/evaluations"
    description: "List evaluations filtered by patient, evaluator or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["patient_id?", "evaluating_clinician_id?", "status?", "limit?", "offset?"]
    output: EmergencyEvaluation[]
    side_effects: []

  # --- legal holds ------------------------------------------------------------
  - method: POST
    path: "/behavioral-health/holds"
    description: "Initiate an emergency involuntary hold from a signed evaluation"
    roles: [IntakeClinician, AttendingPsychiatrist]
    code: 201
    input: [patient_id, evaluation_id, hold_type]
    output: HoldOrder
    side_effects: ["computes statutory_hours, clock_started_at, certification_deadline_at and both hold_deadline_pair variants", "status = PENDING_CERTIFICATION"]

  - method: POST
    path: "/behavioral-health/holds/{id}/certify"
    description: "Physician certification of an initiated hold"
    roles: [AttendingPsychiatrist]
    code: 200
    input: [certification_note]
    output: HoldOrder
    side_effects: ["status PENDING_CERTIFICATION -> ACTIVE", "recomputes Patient.active_hold_count and increments Patient.version by 1", "flips the patient's non-terminal Admission rows to legal_status INVOLUNTARY and increments each Admission.version by 1"]

  - method: POST
    path: "/behavioral-health/holds/{id}/rescind"
    description: "Rescind a hold before its statutory expiry"
    roles: [AttendingPsychiatrist]
    code: 200
    input: [rescind_reason]
    output: HoldOrder
    side_effects: ["status -> RESCINDED", "cascade: Patient.active_hold_count -> Admission.legal_status -> PENDING DischargeRequest GRANTED_DISCHARGE -> Admission.placement_status DISCHARGE_READY"]

  - method: GET
    path: "/behavioral-health/holds/{id}"
    description: "Read one hold including both deadline variants"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: HoldOrder
    side_effects: []

  - method: GET
    path: "/behavioral-health/holds"
    description: "List holds filtered by patient, evaluation, predecessor, initiator, certifier or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["patient_id?", "evaluation_id?", "predecessor_hold_id?", "initiated_by_clinician_id?", "certifying_clinician_id?", "status?", "limit?", "offset?"]
    output: HoldOrder[]
    side_effects: []

  # --- petitions and hearings -------------------------------------------------
  - method: POST
    path: "/behavioral-health/petitions"
    description: "File an extension petition against an ACTIVE hold"
    roles: [AttendingPsychiatrist]
    code: 201
    input: [hold_id, requested_hold_type, petition_grounds]
    output: HoldPetition
    side_effects: ["status = FILED; filed_at = current logical clock", "an open petition suspends the sweep's statutory expiry of the hold"]

  - method: POST
    path: "/behavioral-health/petitions/{id}/withdraw"
    description: "Withdraw a petition, vacating any scheduled hearing"
    roles: [AttendingPsychiatrist, PatientRightsAdvocate]
    code: 200
    input: [withdraw_reason]
    output: HoldPetition
    side_effects: ["status -> WITHDRAWN", "cascade: SCHEDULED CourtHearing rows -> VACATED -> advocate Clinician.booked_docket_minutes recomputed downward and Clinician.version incremented by 1"]

  - method: GET
    path: "/behavioral-health/petitions/{id}"
    description: "Read one petition"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: HoldPetition
    side_effects: []

  - method: GET
    path: "/behavioral-health/petitions"
    description: "List petitions filtered by hold, filer or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["hold_id?", "petitioning_clinician_id?", "status?", "limit?", "offset?"]
    output: HoldPetition[]
    side_effects: []

  - method: POST
    path: "/behavioral-health/hearings"
    description: "Schedule a court hearing with assigned patient representation"
    roles: [PatientRightsAdvocate, ComplianceOfficer]
    code: 201
    input: [petition_id, advocate_clinician_id, scheduled_start_at, duration_minutes]
    output: CourtHearing
    side_effects: ["computes scheduled_end_at", "petition.status FILED or CONTINUED -> HEARING_SCHEDULED", "recomputes advocate Clinician.booked_docket_minutes and increments Clinician.version by 1"]

  - method: POST
    path: "/behavioral-health/hearings/{id}/record-outcome"
    description: "Record the court disposition: grant the extension, deny it, or continue the matter"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, findings_note]
    output: CourtHearing
    side_effects: ["GRANTED: hearing HELD, petition GRANTED, predecessor hold SUPERSEDED, successor EXTENSION_14D hold created with clock_started_at = predecessor.release_deadline_at", "DENIED: hearing HELD, petition DENIED, hold DISCHARGED_BY_COURT with its cascade", "CONTINUED: hearing CONTINUED, petition CONTINUED, continuance_count recomputed", "all three branches recompute advocate Clinician.booked_docket_minutes and increment Clinician.version by 1"]

  - method: GET
    path: "/behavioral-health/hearings/{id}"
    description: "Read one hearing"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: CourtHearing
    side_effects: []

  - method: GET
    path: "/behavioral-health/hearings"
    description: "List hearings filtered by petition, advocate or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["petition_id?", "advocate_clinician_id?", "status?", "limit?", "offset?"]
    output: CourtHearing[]
    side_effects: []

  # --- admissions -------------------------------------------------------------
  - method: POST
    path: "/behavioral-health/admissions"
    description: "Open an admission on a unit; starts PENDING_PLACEMENT on the placement axis"
    roles: [IntakeClinician]
    code: 201
    input: [patient_id, evaluation_id, unit_id, requested_legal_status]
    output: Admission
    side_effects: ["acuity_tier copied from the evaluation", "legal_status = requested_legal_status", "placement_status = PENDING_PLACEMENT, safety_search_status = PENDING, discharge_plan_status = NOT_STARTED"]

  - method: GET
    path: "/behavioral-health/admissions/{id}"
    description: "Read one admission including both state axes, counters and version (source of expected_admission_version)"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: Admission
    side_effects: []

  - method: GET
    path: "/behavioral-health/admissions"
    description: "List admissions filtered by patient, unit, bed, evaluation, admitting clinician, search staff or either state axis"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["patient_id?", "unit_id?", "bed_id?", "evaluation_id?", "admitting_clinician_id?", "search_performed_by_clinician_id?", "search_witness_clinician_id?", "legal_status?", "placement_status?", "limit?", "offset?"]
    output: Admission[]
    side_effects: []

  - method: POST
    path: "/behavioral-health/admissions/{id}/safety-search"
    description: "Record the admission contraband and safety search with an independent witness"
    roles: [ChargeNurse, IntakeClinician]
    code: 200
    input: [search_type, search_witness_clinician_id, search_items_secured_count, contraband_found, outcome]
    output: Admission
    side_effects: ["safety_search_status = COMPLETED when outcome == 'COMPLETED', REFUSED when outcome == 'REFUSED'", "search_performed_by_clinician_id = X-User-ID", "increments Admission.version by 1"]

  - method: POST
    path: "/behavioral-health/admissions/{id}/place"
    description: "Place a searched admission into a bed; bed_id may be omitted to let bed_placement_selector choose"
    roles: [ChargeNurse, AttendingPsychiatrist]
    code: 200
    input: [unit_id, expected_unit_version, "bed_id?", "posture_override_reason?"]
    output: Admission
    side_effects: ["selects a bed per bed_placement_selector when bed_id is omitted", "placement_status PENDING_PLACEMENT -> PLACED, placed_at set", "Bed.status AVAILABLE -> OCCUPIED", "recomputes Unit.occupied_bed_count, raw_available_bed_count, posture and effective_available_bed_count", "increments Unit.version by 1"]

  - method: POST
    path: "/behavioral-health/admissions/{id}/convert-to-voluntary"
    description: "Convert an involuntary admission to voluntary status, closing the hold"
    roles: [AttendingPsychiatrist]
    code: 200
    input: [conversion_note]
    output: Admission
    side_effects: ["the patient's ACTIVE HoldOrder -> CONVERTED_VOLUNTARY", "legal_status INVOLUNTARY -> VOLUNTARY on the legal axis only", "recomputes Patient.active_hold_count and increments Patient.version by 1"]

  - method: POST
    path: "/behavioral-health/admissions/{id}/discharge-plan"
    description: "Secure the guaranteed outpatient follow-up appointment"
    roles: [AttendingPsychiatrist, ChargeNurse]
    code: 200
    input: [follow_up_provider_name, follow_up_appointment_at]
    output: Admission
    side_effects: ["computes follow_up_guarantee_days and follow_up_guarantee_deadline_at per follow_up_guarantee_window", "discharge_plan_status NOT_STARTED -> APPOINTMENT_SECURED", "increments Admission.version by 1"]

  - method: POST
    path: "/behavioral-health/admissions/{id}/discharge"
    description: "Physically discharge the patient, releasing the bed"
    roles: [AttendingPsychiatrist]
    code: 200
    input: [discharge_summary]
    output: Admission
    side_effects: ["placement_status -> DISCHARGED, discharged_at set", "Bed.status OCCUPIED -> AVAILABLE", "recomputes Unit counters and posture, increments Unit.version by 1", "fires queued_admission_promotion when the recompute moves posture out of CLOSED"]

  - method: POST
    path: "/behavioral-health/discharge-requests"
    description: "Record a patient or guardian request for discharge, starting the response clock"
    roles: [ChargeNurse, PatientRightsAdvocate]
    code: 201
    input: [admission_id, requested_by]
    output: DischargeRequest
    side_effects: ["requested_at = current logical clock", "computes response_deadline_at per discharge_request_response_deadline", "status = PENDING"]

  - method: POST
    path: "/behavioral-health/discharge-requests/{id}/respond"
    description: "Answer a discharge request: grant it, or deny it on the basis of an active hold"
    roles: [AttendingPsychiatrist]
    code: 200
    input: [decision, response_note]
    output: DischargeRequest
    side_effects: ["GRANT: status -> GRANTED_DISCHARGE and the admission's placement_status PLACED -> DISCHARGE_READY or PENDING_PLACEMENT -> CANCELLED", "DENY: status -> DENIED_HOLD_INITIATED and the admission is untouched", "responding_clinician_id = X-User-ID"]

  - method: GET
    path: "/behavioral-health/discharge-requests/{id}"
    description: "Read one discharge request including its response deadline"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: DischargeRequest
    side_effects: []

  - method: GET
    path: "/behavioral-health/discharge-requests"
    description: "List discharge requests filtered by admission, recorder, responder or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["admission_id?", "recorded_by_clinician_id?", "responding_clinician_id?", "status?", "limit?", "offset?"]
    output: DischargeRequest[]
    side_effects: []

  # --- restraint and seclusion ------------------------------------------------
  - method: POST
    path: "/behavioral-health/restraints"
    description: "Order a restraint or seclusion episode"
    roles: [AttendingPsychiatrist]
    code: 201
    input: [admission_id, intervention_type, ordered_duration_minutes, clinical_justification]
    output: RestraintEpisode
    side_effects: ["started_at = current logical clock; computes authorized_until_at, face_to_face_deadline_at and monitoring_interval_minutes", "status = ORDERED", "recomputes Unit.active_seclusion_count and increments Unit.version by 1 when intervention_type == 'SECLUSION'"]

  - method: POST
    path: "/behavioral-health/restraints/{id}/face-to-face"
    description: "Record the in-person review that authorizes continuation"
    roles: [AttendingPsychiatrist]
    code: 200
    input: [assessment_note]
    output: RestraintEpisode
    side_effects: ["status ORDERED -> ACTIVE", "face_to_face_at and face_to_face_clinician_id set"]

  - method: POST
    path: "/behavioral-health/restraints/{id}/monitoring-checks"
    description: "Append a monitoring check to the episode log"
    roles: [ChargeNurse]
    code: 200
    input: [check_type, "note?"]
    output: RestraintEpisode
    side_effects: ["appends { recorded_at = current logical clock, check_type, recorded_by_clinician_id = X-User-ID, note } to monitoring_check_log"]

  - method: POST
    path: "/behavioral-health/restraints/{id}/release"
    description: "Release the patient from restraint or seclusion"
    roles: [ChargeNurse, AttendingPsychiatrist]
    code: 200
    input: [release_note]
    output: RestraintEpisode
    side_effects: ["status ACTIVE -> RELEASED; released_at set", "computes actual_duration_minutes, required_check_count and both monitoring_compliance_pair variants", "recomputes Admission.observation_staff_quarter_hours and increments Admission.version by 1", "recomputes Unit.active_seclusion_count and increments Unit.version by 1 for SECLUSION"]

  - method: POST
    path: "/behavioral-health/restraints/{id}/debrief"
    description: "Complete the post-episode debriefing"
    roles: [AttendingPsychiatrist, ChargeNurse]
    code: 200
    input: [patient_participated_in_debrief, staff_participants_count, debrief_note]
    output: RestraintEpisode
    side_effects: ["status RELEASED -> DEBRIEFED; debrief_completed_at set", "gated on grid_compliance_pct == 100.0"]

  - method: GET
    path: "/behavioral-health/restraints/{id}"
    description: "Read one episode including the monitoring log and both compliance variants"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: RestraintEpisode
    side_effects: []

  - method: GET
    path: "/behavioral-health/restraints"
    description: "List episodes filtered by admission, ordering clinician, reviewing clinician or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["admission_id?", "ordered_by_clinician_id?", "face_to_face_clinician_id?", "status?", "limit?", "offset?"]
    output: RestraintEpisode[]
    side_effects: []

  # --- capacity and medication consent ---------------------------------------
  - method: POST
    path: "/behavioral-health/capacity-determinations"
    description: "Record a medication-capacity determination and, when capacity is absent, the substitute decision maker"
    roles: [AttendingPsychiatrist]
    code: 201
    input: [admission_id, expected_admission_version, capacity_present, "surrogate_name?", "surrogate_relationship?", "surrogate_authority_scope?"]
    output: CapacityDetermination
    side_effects: ["any prior ACTIVE determination for the admission -> SUPERSEDED", "mirrors capacity_present onto Admission.capacity_present and increments Admission.version by 1"]

  - method: GET
    path: "/behavioral-health/capacity-determinations/{id}"
    description: "Read one capacity determination"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: CapacityDetermination
    side_effects: []

  - method: GET
    path: "/behavioral-health/capacity-determinations"
    description: "List capacity determinations filtered by admission, determiner or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["admission_id?", "determined_by_clinician_id?", "status?", "limit?", "offset?"]
    output: CapacityDetermination[]
    side_effects: []

  - method: POST
    path: "/behavioral-health/medication-consents"
    description: "Record the legal basis authorizing a psychotropic medication"
    roles: [AttendingPsychiatrist]
    code: 201
    input: [admission_id, medication_name, consent_basis, "capacity_determination_id?", "emergency_justification?"]
    output: MedicationConsent
    side_effects: ["status = ACTIVE", "expires_at = current logical clock + 72 hours for consent_basis == 'EMERGENCY_OVERRIDE', null otherwise"]

  - method: GET
    path: "/behavioral-health/medication-consents/{id}"
    description: "Read one medication consent"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: []
    output: MedicationConsent
    side_effects: []

  - method: GET
    path: "/behavioral-health/medication-consents"
    description: "List medication consents filtered by admission, capacity determination, prescriber or status"
    roles: [ComplianceOfficer, IntakeClinician, AttendingPsychiatrist, ChargeNurse, PatientRightsAdvocate]
    code: 200
    input: ["admission_id?", "capacity_determination_id?", "prescribing_clinician_id?", "status?", "limit?", "offset?"]
    output: MedicationConsent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "acting role is not listed for the endpoint, or a non-AttendingPsychiatrist supplies posture_override_reason on placement" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required body field, invalid enum member, out-of-range integer, duration_minutes outside {30, 60}, hold_type != EMERGENCY_72H on hold initiation, or requested_hold_type != EXTENSION_14D on petition filing" }
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "referenced Patient id does not resolve" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "referenced Unit id does not resolve" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "referenced EmergencyEvaluation id does not resolve" }
  - { id: ERR_ADMISSION_NOT_FOUND, http: 404, condition: "referenced Admission id does not resolve" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "referenced HoldOrder id does not resolve" }
  - { id: ERR_REFERENCED_RESOURCE_NOT_FOUND, http: 404, condition: "any other referenced id does not resolve — Clinician, Bed, HoldPetition, CourtHearing, RestraintEpisode, CapacityDetermination or DischargeRequest" }
  - { id: ERR_STALE_UNIT_VERSION, http: 412, condition: "expected_unit_version does not equal the current Unit.version on placement" }
  - { id: ERR_STALE_ADMISSION_VERSION, http: 412, condition: "expected_admission_version does not equal the current Admission.version on capacity determination" }
  - { id: ERR_EVALUATION_ALREADY_SIGNED, http: 409, condition: "signing an evaluation whose status is already SIGNED" }
  - { id: ERR_EVALUATION_NOT_SIGNED, http: 409, condition: "initiating a hold or opening an admission from an evaluation whose status is DRAFT" }
  - { id: ERR_HOLD_NOT_PENDING_CERTIFICATION, http: 409, condition: "certifying a hold whose status is not PENDING_CERTIFICATION" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "filing a petition, converting to voluntary, or rescinding against a hold that is not in the required status" }
  - { id: ERR_ADMISSION_NOT_PLACEABLE, http: 409, condition: "placing an admission whose placement_status is not PENDING_PLACEMENT" }
  - { id: ERR_ADMISSION_NOT_DISCHARGEABLE, http: 409, condition: "admission placement_status outside the set the action requires (discharge needs PLACED or DISCHARGE_READY; search, plan, conversion and discharge-request creation need PENDING_PLACEMENT or PLACED)" }
  - { id: ERR_PETITION_NOT_OPEN, http: 409, condition: "scheduling, withdrawing or recording an outcome against a petition in the wrong status" }
  - { id: ERR_HEARING_NOT_SCHEDULED, http: 409, condition: "recording an outcome on a hearing whose status is not SCHEDULED" }
  - { id: ERR_RESTRAINT_INVALID_STATE, http: 409, condition: "restraint action attempted from a state that does not permit it (face-to-face outside ORDERED, release outside ACTIVE, monitoring check outside {ORDERED, ACTIVE}, debrief outside RELEASED)" }
  - { id: ERR_DISCHARGE_REQUEST_NOT_PENDING, http: 409, condition: "responding to a discharge request whose status is not PENDING" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the acting clinician is the same person as the counterpart the rule requires to differ (hold initiator, search performer, restraint orderer for mechanical restraint or seclusion)" }
  - { id: ERR_CLINICAL_CRITERIA_NOT_MET, http: 422, condition: "hold initiation from an evaluation whose recommended_status != INVOLUNTARY_HOLD, or admission creation from an evaluation whose recommended_status == NO_ADMISSION" }
  - { id: ERR_SAFETY_SEARCH_INCOMPLETE, http: 409, condition: "placing an admission whose safety_search_status is not COMPLETED" }
  - { id: ERR_RESTRAINT_DURATION_EXCEEDS_LIMIT, http: 422, condition: "ordered_duration_minutes above the age- and type-specific ceiling" }
  - { id: ERR_SECLUSION_CAPACITY_EXCEEDED, http: 409, condition: "concurrent seclusion episodes with authorized_until_at strictly after the current clock already fill Unit.seclusion_room_count" }
  - { id: ERR_FACE_TO_FACE_WINDOW_CLOSED, http: 409, condition: "the in-person review is attempted after face_to_face_deadline_at" }
  - { id: ERR_MONITORING_INCOMPLETE, http: 409, condition: "debriefing an episode whose grid_compliance_pct is below 100.0, including the zero-entry case" }
  - { id: ERR_OPEN_RESTRAINT_EPISODE, http: 409, condition: "discharging an admission that still has an episode in ORDERED, ACTIVE or RELEASED" }
  - { id: ERR_CERTIFICATION_WINDOW_CLOSED, http: 409, condition: "certification attempted after certification_deadline_at" }
  - { id: ERR_PETITION_WINDOW_CLOSED, http: 422, condition: "petition filed after the hold's petition_filing_deadline_at" }
  - { id: ERR_HEARING_SLOT_INVALID, http: 422, condition: "hearing slot falls on a weekend or holiday, starts before 09:00:00, ends after 16:00:00, or starts at or before the current clock" }
  - { id: ERR_HEARING_BEYOND_HOLD_EXPIRY, http: 422, condition: "scheduled_end_at is after the hold's release_deadline_at" }
  - { id: ERR_ADVOCATE_DOCKET_CONFLICT, http: 409, condition: "the advocate's buffered docket interval collides with another SCHEDULED hearing of the same advocate" }
  - { id: ERR_ADVOCATE_NOT_QUALIFIED, http: 422, condition: "the assigned advocate's staff_role is not RIGHTS_ADVOCATE" }
  - { id: ERR_CAPACITY_LACKING, http: 409, condition: "no ACTIVE CapacityDetermination with capacity_present == true exists where the action requires one" }
  - { id: ERR_SURROGATE_REQUIRED, http: 422, condition: "capacity_present == false without complete surrogate fields, or capacity_present == true with surrogate fields supplied" }
  - { id: ERR_SURROGATE_SCOPE_INSUFFICIENT, http: 409, condition: "surrogate consent cites a determination that is SUPERSEDED, has capacity_present == true, or has surrogate_authority_scope == NONE" }
  - { id: ERR_NO_ACTIVE_HOLD, http: 409, condition: "an involuntary admission, a discharge denial, or an emergency medication override is attempted without an ACTIVE hold on the patient" }
  - { id: ERR_PETITION_PENDING, http: 409, condition: "a second petition or a voluntary conversion is attempted while a petition is FILED, HEARING_SCHEDULED or CONTINUED" }
  - { id: ERR_ACTIVE_HOLD_BLOCKS_DISCHARGE, http: 409, condition: "discharge or discharge-grant attempted while admission.legal_status == INVOLUNTARY" }
  - { id: ERR_DUPLICATE_DISCHARGE_REQUEST, http: 409, condition: "a second discharge request is recorded while one is still PENDING" }
  - { id: ERR_CONTINUANCE_LIMIT_REACHED, http: 409, condition: "a third continuance is requested on the same petition" }
  - { id: ERR_ROOM_COHORT_VIOLATION, http: 409, condition: "the target bed's room or wing already holds a patient of a different gender_care_category under the unit's policy, or mixes minor and adult roommates" }
  - { id: ERR_BED_NOT_ELIGIBLE, http: 409, condition: "the explicitly supplied bed belongs to another unit, is not AVAILABLE, is a SECLUSION bed, or is not LIGATURE_RESISTANT_OBSERVATION for a HIGH-acuity admission" }
  - { id: ERR_DISCHARGE_PLAN_INCOMPLETE, http: 409, condition: "discharge attempted with discharge_plan_status == NOT_STARTED or with follow_up_appointment_at at or before the current clock" }
  - { id: ERR_FOLLOW_UP_WINDOW_EXCEEDED, http: 422, condition: "follow_up_appointment_at is at or before the current clock, or after follow_up_guarantee_deadline_at" }
  - { id: ERR_UNIT_POSTURE_BLOCKED, http: 409, condition: "unit posture is CLOSED, or RESTRICTED without a HIGH-acuity psychiatrist override, or OPEN with effective_available_bed_count == 0" }
  - { id: ERR_NO_ELIGIBLE_BED, http: 409, condition: "bed_id was omitted and bed_placement_selector produced an empty candidate set" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceOfficer
    description: "Facility operations and court-liaison operator: maintains the roster, unit and bed inventory, drives the logical clock and the statutory compliance sweep, and records court dispositions"
    identity: opaque
    exclusive_operations:
      - "POST /behavioral-health/clinicians"
      - "POST /behavioral-health/units"
      - "POST /behavioral-health/beds"
      - "POST /behavioral-health/_clock/set_current_utc"
      - "POST /behavioral-health/_compliance/sweep"
      - "POST /behavioral-health/hearings/{id}/record-outcome"
    shared_operations:
      - "PATCH /behavioral-health/beds/{id} (with ChargeNurse)"
      - "POST /behavioral-health/patients (with IntakeClinician)"
      - "POST /behavioral-health/hearings (with PatientRightsAdvocate)"
      - "every GET endpoint"

  - name: IntakeClinician
    description: "Emergency department intake clinician: evaluates, initiates holds, opens admissions and may perform the contraband search"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /behavioral-health/admissions"
    shared_operations:
      - "POST /behavioral-health/patients (with ComplianceOfficer)"
      - "POST /behavioral-health/evaluations (with AttendingPsychiatrist)"
      - "POST /behavioral-health/evaluations/{id}/sign (with AttendingPsychiatrist)"
      - "POST /behavioral-health/holds (with AttendingPsychiatrist)"
      - "POST /behavioral-health/admissions/{id}/safety-search (with ChargeNurse)"
      - "every GET endpoint"

  - name: AttendingPsychiatrist
    description: "Unit psychiatrist: certifies holds, orders restraint and seclusion, determines capacity, authorizes medication, files petitions, and discharges"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /behavioral-health/holds/{id}/certify"
      - "POST /behavioral-health/holds/{id}/rescind"
      - "POST /behavioral-health/petitions"
      - "POST /behavioral-health/admissions/{id}/convert-to-voluntary"
      - "POST /behavioral-health/admissions/{id}/discharge"
      - "POST /behavioral-health/discharge-requests/{id}/respond"
      - "POST /behavioral-health/restraints"
      - "POST /behavioral-health/restraints/{id}/face-to-face"
      - "POST /behavioral-health/capacity-determinations"
      - "POST /behavioral-health/medication-consents"
    shared_operations:
      - "POST /behavioral-health/evaluations and /sign (with IntakeClinician)"
      - "POST /behavioral-health/holds (with IntakeClinician)"
      - "POST /behavioral-health/admissions/{id}/place (with ChargeNurse; only this role may supply posture_override_reason)"
      - "POST /behavioral-health/admissions/{id}/discharge-plan (with ChargeNurse)"
      - "POST /behavioral-health/restraints/{id}/release and /debrief (with ChargeNurse)"
      - "POST /behavioral-health/petitions/{id}/withdraw (with PatientRightsAdvocate)"
      - "every GET endpoint"
    note: "Segregation of duties — a psychiatrist may not certify a hold they initiated, nor perform the face-to-face review of a mechanical restraint or seclusion they ordered."

  - name: ChargeNurse
    description: "Unit charge nurse: bed status, placement, contraband search, restraint monitoring, release and debriefing"
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /behavioral-health/restraints/{id}/monitoring-checks"
    shared_operations:
      - "PATCH /behavioral-health/beds/{id} (with ComplianceOfficer)"
      - "POST /behavioral-health/admissions/{id}/safety-search (with IntakeClinician)"
      - "POST /behavioral-health/admissions/{id}/place (with AttendingPsychiatrist, without override authority)"
      - "POST /behavioral-health/admissions/{id}/discharge-plan (with AttendingPsychiatrist)"
      - "POST /behavioral-health/restraints/{id}/release and /debrief (with AttendingPsychiatrist)"
      - "POST /behavioral-health/discharge-requests (with PatientRightsAdvocate)"
      - "every GET endpoint"

  - name: PatientRightsAdvocate
    description: "Patient rights advocate: schedules hearings with representation, records patient discharge requests, and may withdraw petitions on the patient's behalf"
    identity: "entity_backed:Clinician"
    exclusive_operations: []
    shared_operations:
      - "POST /behavioral-health/hearings (with ComplianceOfficer)"
      - "POST /behavioral-health/petitions/{id}/withdraw (with AttendingPsychiatrist)"
      - "POST /behavioral-health/discharge-requests (with ChargeNurse)"
      - "every GET endpoint"
    note: "A Clinician assigned as advocate_clinician_id on a hearing must have staff_role == 'RIGHTS_ADVOCATE'; booked_docket_minutes accumulates on that Clinician row."
