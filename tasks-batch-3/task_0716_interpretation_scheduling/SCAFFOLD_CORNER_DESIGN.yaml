              payload: { full_name: "Med I" }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "MEDICAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
