      - name: text_overflow_gate_needs_both_the_unit_waiver_and_a_closed_overflow_bug
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TEXT_OVERFLOW_UNRESOLVED]
          - errors[ERR_QA_PASS_NOT_OPEN]
          - validations[priority 58]
        distinguishing_aspect: "Priority 58 is a conjunction of two independent clauses - no unit with overflow_chars > 0 and qa_status != PASSED, AND no open TEXT_OVERFLOW/TRUNCATION bug - so clearing only one of them still fails. An S1 overflow bug against 200 inspected units gives density 0.0400, which is under the ceiling, so the pass closes with the bug still open: the release gate, not the QA gate, is what catches it."
