            - call: "POST /rollouts/capital-projects/${cp1}/submit"
              payload: { rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
            - call: "POST /rollouts/capital-projects/${cp2}/submit"
              payload: { rollout_program_id: "${rid}" }
              as: FINANCE_ANALYST
            - call: "GET /rollouts/${rid}"
              as: PROGRAM_ADMIN
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /rollouts/capital-projects/${cp2}/decide"
              payload: { rollout_program_id: "${rid}", decision: "APPROVE", expected_program_version: "${p_v}" }
              as: PROGRAM_ADMIN
            - call: "GET /rollouts/${rid}"
              as: PROGRAM_ADMIN
              captures: { p_v2: $.data.version }
            - call: "POST /rollouts/capital-projects/${cp1}/decide"
              payload: { rollout_program_id: "${rid}", decision: "APPROVE", expected_program_version: "${p_v2}" }
              as: PROGRAM_ADMIN
          assert:
            - "CapitalProject.${cp1}.capital_score == 137.5 and rank == 1 (decided later but higher score outranks)"
            - "CapitalProject.${cp2}.capital_score == 45.0 and rank == 2"
            - "Rollout.committed_capital_cents == 140000000 (80000000 + 60000000)"

      - name: route_plan_supersede_on_replan
        claim_type: input_set_filtering
        grounds:
          - calculations.route_planning
        distinguishing_aspect: "Replanning after a volume_index change supersedes the prior ACTIVE plan: exactly one ACTIVE RoutePlan per store at any time; the superseded plan keeps its stale numbers."
        test_recipe:
          setup: ["ACTIVE program; store S (TRADITIONAL) with ACTIVE DCAssignment (stem 90); initial RoutePlan at volume_index 1.0"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "C", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "S" }
              as: PROGRAM_ADMIN
              captures: { sid: $.data.id, s_v0: $.data.version }
            - call: "POST /rollouts/stores/${sid}/select-format"
              payload: { rollout_program_id: "${rid}", expected_store_version: "${s_v0}" }
              as: REAL_ESTATE_MANAGER
            - call: "POST /rollouts/distribution-centers"
              payload: { rollout_program_id: "${rid}", name: "D", store_capacity: 2 }
              as: NETWORK_PLANNER
              captures: { dcid: $.data.id }
            - call: "POST /rollouts/dc-assignments"
              payload: { store_id: "${sid}", rollout_program_id: "${rid}", distribution_center_id: "${dcid}", stem_miles: 90, deliveries_per_week: 1 }
              as: NETWORK_PLANNER
            - call: "POST /rollouts/route-plans"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}" }
              as: NETWORK_PLANNER
              captures: { rp1: $.data.id }
          trigger:
            - call: "POST /rollouts/route-plans"
              payload: { rollout_program_id: "${rid}", store_id: "${sid}" }
              as: NETWORK_PLANNER
              captures: { rp2: $.data.id }
            - call: "GET /rollouts/route-plans"
              payload: { store_id: "${sid}" }
              as: NETWORK_PLANNER
          assert:
            - "RoutePlan.${rp1}.status == SUPERSEDED (kept with its original numbers: deliveries_per_week 1, cases_per_truck 900, truck_fill_pct 50.0, weekly_cost_cents 86300)"
            - "RoutePlan.${rp2}.status == ACTIVE with identical values 1/900/50.0/86300 (same inputs) — exactly one ACTIVE plan exists"

      - name: trade_area_score_standard_arithmetic
        claim_type: precision
        grounds:
          - calculations.trade_area_score
        distinguishing_aspect: "stub — score arithmetic and adjusted-variant divergence asserted with literals by §1.8 dual-variant and rescreen instances."
        excluded_because:
          difficulty_instance: dual_variant_calc / trade_area_score_adjusted_by_nearby_overlap
          rationale: "Standard 47.50 vs adjusted 44.65 asserted there; rescreen cycle asserts 34.68 and 47.5."

  # ===========================================================================
  - section: validations
    instances:
      - name: role_gate_beats_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "A FINANCE_ANALYST attempting select-format on a NON-EXISTENT store gets ERR_FORBIDDEN (priority 2), not ERR_NOT_FOUND (priority 3) — authorization precedes existence."
        test_recipe:
          setup: ["ACTIVE program with one QUALIFIED trade area and one real store (version captured for a well-formed OCC payload)"]
          setup_api_calls:
            - call: "POST /rollouts"
              payload: { name: "P", fiscal_year: 2027, new_build_capital_budget_cents: 2000000000 }
              as: PROGRAM_ADMIN
              captures: { rid: $.data.id }
            - call: "POST /rollouts/${rid}/activate"
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/trade-areas"
              payload: { rollout_program_id: "${rid}", name: "A", drive_time_minutes: 20, household_count: 1000, median_household_income_cents: 4500000, grocery_gap_pct: 20 }
              as: PROGRAM_ADMIN
              captures: { taid: $.data.id, ta_v0: $.data.version }
            - call: "POST /rollouts/trade-areas/${taid}/screen"
              payload: { rollout_program_id: "${rid}", expected_trade_area_version: "${ta_v0}" }
              as: PROGRAM_ADMIN
            - call: "POST /rollouts/stores"
              payload: { rollout_program_id: "${rid}", trade_area_id: "${taid}", name: "Real" }
              as: PROGRAM_ADMIN
              captures: { real_sid: $.data.id, real_sv: $.data.version }
          trigger:
            - call: "POST /rollouts/stores/00000000-0000-0000-0000-000000000000/select-format"
              payload: { expected_store_version: "${real_sv}" }
              as: FINANCE_ANALYST
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (403) even though the store id does not exist"

      - name: duplicate_active_agreement_rejected
