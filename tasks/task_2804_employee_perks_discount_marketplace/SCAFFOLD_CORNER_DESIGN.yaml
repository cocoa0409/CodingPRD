          rationale: "That §1.8 instance drives the fulfilment dimension AWAITING -> DISPUTED -> FULFILLED while asserting verification_status stays VERIFIED throughout, which is exactly the parallel-shape independence claim."

      - name: offer_work_is_guarded_by_the_agreement_being_active
        claim_type: guarded_transitions
        grounds:
          - validations[priority=60]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
          - state_machines.Offer.status.DRAFT_to_PENDING_REVIEW
          - state_machines.PartnerAgreement.status.ACCEPTED_to_ACTIVE
        distinguishing_aspect: |
          Offer creation is a guarded transition on a different aggregate: with the agreement
          merely ACCEPTED, POST /perks/offers returns 409 ERR_AGREEMENT_NOT_ACTIVE and no Offer
          row is created, while the identical call after activation succeeds and the offer then
          walks DRAFT -> PENDING_REVIEW -> ACTIVE.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; merchant Bistro Uno holds a DINING/CA agreement that has been proposed and accepted but not yet activated, so its status is ACCEPTED and the merchant is IN_NEGOTIATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /perks/merchants"
              payload: { legal_name: "Bistro Uno", contact_email: "ops@bistrouno.example", primary_category: "DINING", region_codes: ["CA"] }
              as: PartnerManager
              as_user_id: "pm-001"
              captures: { merchant_id: $.data.id }
            - call: "POST /perks/agreements"
