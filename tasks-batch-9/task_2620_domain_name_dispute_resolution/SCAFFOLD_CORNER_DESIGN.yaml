        grounds:
          - state_machines.Case.initial_state
          - state_machines.DomainName.initial_state
          - state_machines.DeficiencyNotice.initial_state
        distinguishing_aspect: "A fresh Case is FILED, a fresh DomainName is UNLOCKED and a fresh DeficiencyNotice is OPEN - none of the three initial states is supplied by the caller, and the notice's arrival is what moves the case off its own initial state."
