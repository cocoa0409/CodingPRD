  # =========================================================================
  # Rule 7 - cross_entity_state_dependency: Booking->Excursion and
  # CarAssignment->RollingStock (different entity pairs).
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_create_requires_published_excursion
        grounds:
          - state_machines.Excursion
          - validations[priority=5]
          - errors[ERR_EXCURSION_NOT_BOOKABLE]
        distinguishing_aspect: |
          Pair Booking -> Excursion: booking creation is gated on the referenced
          excursion's state; a DRAFT excursion rejects with
          ERR_EXCURSION_NOT_BOOKABLE while the same call succeeds once PUBLISHED.
        test_recipe:
          setup:
            - "Excursion on 2026-10-15 left in DRAFT (consist present, never published)"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Draft Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "e1@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_EXCURSION_NOT_BOOKABLE (Booking create depends on Excursion.status == PUBLISHED)"
            - "Excursion.${ex}.status remains DRAFT"
      - name: car_assign_requires_available_stock
        grounds:
          - state_machines.RollingStock
          - validations[priority=5]
          - errors[ERR_STOCK_UNAVAILABLE]
        distinguishing_aspect: |
          Pair CarAssignment -> RollingStock (different pair from Booking ->
          Excursion): adding a car is gated on the stock's state; an IN_MAINTENANCE
          unit rejects with ERR_STOCK_UNAVAILABLE.
        test_recipe:
          setup:
            - "DRAFT excursion on 2026-10-15"
            - "COACH_CAR stock moved to IN_MAINTENANCE by starting a work order whose window (2026-10-20) does NOT intersect the service date, isolating the state dependency from the temporal one"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${coach}", window_start: "2026-10-20T09:00:00Z", window_end: "2026-10-20T11:00:00Z", scope: "REPAIR" }, as: Mechanic, captures: { wo: "$.data.id" } }
            - { call: "POST /railroad/work-orders/${wo}/events", payload: { event_type: "START" }, as: Mechanic }
            - { call: "POST /railroad/excursions", payload: { title: "Draft Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 1 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_STOCK_UNAVAILABLE (CarAssignment create depends on RollingStock.status == AVAILABLE)"
            - "RollingStock.${coach}.status remains IN_MAINTENANCE"

  # =========================================================================
  # Rule 8 - resource_temporal_overlap: slot half-open adjacency vs maintenance
  # turnaround buffer (different interval semantics, different resources).
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: slot_adjacency_half_open_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [start_minute, end_minute) on the
          agreement+date slot pool, so back-to-back adjacency (780 == 780) is legal
          while a 700-800 interleave collides with the 600-780 slot.
        test_recipe:
          setup:
            - "ACTIVE agreement (max 3 trains/day, min slot 60 minutes) with slot 600-780 on 2026-10-15 already created"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot_a: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 780, end_minute: 900 }, as: Scheduler, captures: { slot_b: "$.data.id", slot_b_status: "$.data.status" } }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 700, end_minute: 800 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent slot accepted under half-open semantics: ${slot_b_status} == OPEN"
            - "overlapping slot rejected: ${err} == ERR_SLOT_OVERLAP"
      - name: maintenance_turnaround_buffer_required
        grounds:
          - validations[priority=9]
          - errors[ERR_MAINTENANCE_WINDOW_CONFLICT]
          - calculations.dining_table_selector
        distinguishing_aspect: |
          Different interval semantics from slots AND a different resource
          (RollingStock, not the agreement-date pool): maintenance windows demand a
          60-minute turnaround buffer, so an adjacent-but-inside-buffer window
          (11:30 start, 30-minute gap) is rejected while exactly 60 minutes of gap
          is accepted.
        test_recipe:
          setup:
            - "One coach car with a SCHEDULED work order 2026-10-20T09:00-11:00Z"
          setup_api_calls:
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { car: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${car}", window_start: "2026-10-20T09:00:00Z", window_end: "2026-10-20T11:00:00Z", scope: "INSPECTION" }, as: Mechanic, captures: { wo1: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${car}", window_start: "2026-10-20T11:30:00Z", window_end: "2026-10-20T13:00:00Z", scope: "REPAIR" }, as: Mechanic, captures: { err: "$.data.error_id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${car}", window_start: "2026-10-20T12:00:00Z", window_end: "2026-10-20T14:00:00Z", scope: "REPAIR" }, as: Mechanic, captures: { wo2: "$.data.id", wo2_status: "$.data.status" } }
          assert:
            - "30-minute gap violates the 60-minute turnaround buffer: ${err} == ERR_MAINTENANCE_WINDOW_CONFLICT"
            - "exactly 60-minute gap accepted: ${wo2_status} == SCHEDULED"

  # =========================================================================
  # Rule 9 - compensating_invariant: seat-count conservation (confirm+cancel)
  # vs money conservation (rain-check issue+redeem) - different quantities.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: seat_count_confirm_cancel_conservation
        grounds:
          - calculations.class_seat_availability
          - state_machines.Booking.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity is the SEAT COUNT: the forward CONFIRM of a party-2
          booking paired with its compensating CANCEL leaves consumed seats (and the
          committed availability field) exactly at the pre-confirm value - zero drift.
        test_recipe:
          setup:
            - "Published REGULAR excursion with one COACH car, effective_capacity 5; no bookings"
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-5", stock_type: "COACH_CAR", seat_capacity: 5, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Invariant Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version", avail0: "$.data.coach_seats_available" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "inv@x.com", class_code: "COACH", party_size: 2 }, as: StationAgent, captures: { b1: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "GET /railroad/excursions/${ex}", as: StationAgent, captures: { avail1: "$.data.coach_seats_available" } }
            - { call: "POST /railroad/bookings/${b1}/events", payload: { event_type: "CANCEL" }, as: StationAgent }
            - { call: "GET /railroad/excursions/${ex}", as: StationAgent, captures: { avail2: "$.data.coach_seats_available" } }
          assert:
            - "before: ${avail0} == 5"
            - "after CONFIRM (forward action): ${avail1} == 3"
            - "after CANCEL (compensating action): ${avail2} == 5 == ${avail0} - the seat count is conserved with zero drift"
      - name: raincheck_money_conservation
        grounds:
          - calculations.fare_quote
          - state_machines.RainCheck
          - state_machines.Booking.CONFIRMED_to_RAIN_CHECKED
        distinguishing_aspect: |
          Conserved quantity is CENTS (different from seats): the source booking's
          paid_cents is carried losslessly into the rain-check's value_cents at
          issuance, and redemption applies exactly min(value, total) to the target
          booking with the rain-check fully consumed - no money created or destroyed.
        test_recipe:
          setup:
            - "Excursion A (2026-10-15) published; booking B0 COACH party 2 confirmed (unit 6000, total 12000, paid 12000); excursion A weather-cancelled minting RC1"
            - "Excursion B (2026-10-16) published"
          setup_api_calls:
