            - "The first ACTIVATE returns 409 with error_id ERR_PORT_BLOCK_NOT_ROUTED and PortRequest.${port_id}.status is still CONCURRED"
            - "The sweep response reports routing_activated == 1 and orders_issued == 0"
            - "After the sweep: NumberBlock.${blk_id}.routing_status == LERG_PUBLISHED with current_lrn == 6145580000 and npac_db_version still 2 (a promotion is not a database write)"
            - "The second ACTIVATE returns 200: PortRequest.${port_id}.status == ACTIVATED with activated_at == 2026-09-01T00:00:00Z and npac_db_version_at_activation == 3"
            - "NumberBlock.${blk_id}.routing_status == PORT_LOCKED with current_lrn == 6145570000, npac_db_version == 3 and allocation_status still ASSIGNED"
            - "RoutingRecord.${rec1_id}.record_status == SUPERSEDED and RoutingRecord.${rec2_id}.record_status == SUPERSEDED, with exactly one PUBLISHED record left on the block"
  - rule_id: resource_temporal_overlap
    instances:
      - name: routing_record_equal_start_allowed_earlier_start_rejected
        grounds:
          - validations[priority=19]
          - errors.ERR_ROUTING_INTERVAL_OVERLAP
          - state_machines.RoutingRecord.PUBLISHED_to_SUPERSEDED
          - entities.RoutingRecord.fields.end_at
          - entities.NumberBlock.fields.npac_db_version
        distinguishing_aspect: |
          Routing intervals are half-open, so a record whose effective_at is
          2026-08-10T00:00:00Z - five days BEFORE the open record's
          2026-08-15T00:00:00Z - is refused with ERR_ROUTING_INTERVAL_OVERLAP
          while a record starting at exactly 2026-08-15T00:00:00Z is accepted
          and supersedes it, and the refused attempt must leave
          npac_db_version and the open record untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier A (OCN 1234) ELIGIBLE in OH with a submitted 2026H1 filing computing to 93.33."
            - "Block 614-558-3 in NPA 614 / rate center COLUMBUS is held by carrier A as ASSIGNED."
            - "One effective-dated routing record with lrn 6145560000 and effective_at 2026-08-15T00:00:00Z is PUBLISHED and open, so the block is ROUTING_PENDING with npac_db_version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "558", thousands_digit: 3, contaminated_count: 0, holder_carrier_id: "${carrier_a_id}", mark_activated: true }
              as: NumberingAdministrator
              captures: { blk_id: $.data.id }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2800, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [1200, 800, 600, 400] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "GET /numbering/blocks/${blk_id}"
              payload: {}
              as: NumberingAdministrator
              captures: { blk_v1: $.data.version }
            - call: "POST /numbering/blocks/${blk_id}/routing-records"
              payload: { lrn: "6145560000", switch_clli: "CLMBOH01DS0", effective_at: "2026-08-15T00:00:00Z", expected_block_version: "${blk_v1}" }
              as: NumberingAdministrator
              captures: { rec1_id: $.data.id }
          trigger:
            - call: "GET /numbering/blocks/${blk_id}"
              payload: {}
              as: NumberingAdministrator
              captures: { blk_v2: $.data.version }
            - call: "POST /numbering/blocks/${blk_id}/routing-records"
              payload: { lrn: "6145570000", switch_clli: "CLMBOH01DS0", effective_at: "2026-08-10T00:00:00Z", expected_block_version: "${blk_v2}" }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks/${blk_id}/routing-records"
              payload: { lrn: "6145580000", switch_clli: "CLMBOH01DS0", effective_at: "2026-08-15T00:00:00Z", expected_block_version: "${blk_v2}" }
              as: NumberingAdministrator
              captures: { rec3_id: $.data.id }
          assert:
            - "The 2026-08-10T00:00:00Z record returns 409 with error_id ERR_ROUTING_INTERVAL_OVERLAP"
            - "After the refusal: NumberBlock.${blk_id}.npac_db_version is still 1 and RoutingRecord.${rec1_id}.record_status is still PUBLISHED with end_at == null"
            - "After the refusal NumberBlock.${blk_id}.version is unchanged, which is why the same ${blk_v2} is still the current version for the next publish"
            - "The 2026-08-15T00:00:00Z record returns 201 because the boundary is inclusive: an interval may start exactly where the open one started"
            - "RoutingRecord.${rec1_id}.record_status == SUPERSEDED with end_at == 2026-08-01T00:00:00Z"
            - "RoutingRecord.${rec3_id}.record_status == PUBLISHED with effective_at == 2026-08-15T00:00:00Z, end_at == null and npac_db_version == 2"
            - "NumberBlock.${blk_id}.routing_status is still ROUTING_PENDING and npac_db_version == 2"

      - name: relief_plan_effective_date_must_clear_previous_window_by_ninety_days
        grounds:
          - validations[priority=20]
          - errors.ERR_RELIEF_WINDOW_OVERLAP
          - state_machines.ReliefPlan.OVERLAY_RECOMMENDED_to_ORDERED
          - entities.ReliefPlan.fields.window_end_at
          - entities.ReliefPlan.fields.permissive_dialing_end_at
        distinguishing_aspect: |
          The first plan's occupied interval runs to its permissive dialing end
          2027-05-28T00:00:00Z, so a second plan on the same NPA with
          effective_at 2027-08-25T00:00:00Z (89 days later) is refused with
          ERR_RELIEF_WINDOW_OVERLAP while 2027-08-26T00:00:00Z (exactly
          RELIEF_WINDOW_BUFFER_DAYS later) is accepted - the buffer is measured
          from window_end_at, not from the plan's effective_at or its comment
          window.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "NPA 614 declared into JEOPARDY, then a relief plan with comment_window_days 30 was opened for comment at 2026-08-01T00:00:00Z (window closes 2026-08-31T00:00:00Z)."
            - "The clock is moved to 2026-08-31T00:00:00Z and the administrator closed the window with a zero-comment ALL_SERVICES_OVERLAY recommendation."
            - "A different user then ORDERED the plan with new_npa_code 380 and effective_at 2026-11-29T00:00:00Z, which is exactly 90 days after the window closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/npas/${npa_id}/jeopardy-declarations"
              payload: { reason: "projected exhaust inside six quarters" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan1_id: $.data.id }
            - call: "POST /numbering/relief-plans/${plan1_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/relief-plans/${plan1_id}/transitions"
              payload: { action: "CLOSE_AND_RECOMMEND" }
              as: NumberingAdministrator
              as_user_id: "admin-1"
            - call: "POST /numbering/relief-plans/${plan1_id}/transitions"
              payload: { action: "ORDER", new_npa_code: "380", effective_at: "2026-11-29T00:00:00Z" }
              as: RegulatoryApprover
              as_user_id: "approver-1"
          trigger:
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "GEOGRAPHIC_SPLIT", comment_window_days: 30, new_npa_code: "220", effective_at: "2027-08-25T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "GEOGRAPHIC_SPLIT", comment_window_days: 30, new_npa_code: "220", effective_at: "2027-08-26T00:00:00Z" }
              as: NumberingAdministrator
              captures: { plan2_id: $.data.id }
          assert:
            - "ReliefPlan.${plan1_id}.status == ORDERED with recommended_relief_type == ALL_SERVICES_OVERLAY and effective_at == 2026-11-29T00:00:00Z"
            - "ReliefPlan.${plan1_id}.permissive_dialing_end_at == 2027-05-28T00:00:00Z and window_end_at == 2027-05-28T00:00:00Z"
            - "The plan whose effective_at is 2027-08-25T00:00:00Z returns 409 with error_id ERR_RELIEF_WINDOW_OVERLAP"
            - "The plan whose effective_at is 2027-08-26T00:00:00Z returns 201 with status PLANNING, so the 90-day buffer boundary is inclusive"
            - "ReliefPlan.${plan2_id}.npa_id == ${npa_id} and successor_npa_id == null until it is ordered"
            - "Only two ReliefPlan rows exist for NPA ${npa_id}: the refused attempt created nothing"

  - rule_id: compensating_invariant
    instances:
      - name: block_inventory_conserved_across_approve_reclaim_and_aging_release
        grounds:
          - state_machines.NumberBlock.POOL_AVAILABLE_to_RESERVED
          - state_machines.NumberBlock.RECLAMATION_PENDING_to_AGING
          - state_machines.NumberBlock.AGING_to_POOL_AVAILABLE
          - state_machines.NPA.JEOPARDY_to_ACTIVE
          - calculations.activation_and_aging_schedule
          - entities.Carrier.fields.reclamation_strike_count
        distinguishing_aspect: |
          After grant, deadline miss, reclamation and aging release the
          inventory invariant is restored exactly - available_block_count is 5
          again, the NPA is ACTIVE again, blocks_held_count is 0 - while the
          carrier's reclamation_strike_count stays at 1, so the compensation
          restores inventory without erasing the enforcement history.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier A (OCN 1234) ELIGIBLE in OH with a submitted 2026H1 filing computing to 93.33 and forecast [3000, 2000, 1000, 500]."
            - "NPA 614 / rate center COLUMBUS with five POOL_AVAILABLE blocks 614-556-0 through 614-556-4, so the NPA is ACTIVE with available_block_count 5."
            - "A GROWTH request for 1 block is approved, reserving 614-556-0 with activation_due_at 2027-01-28T00:00:00Z and dropping the NPA to JEOPARDY at available_block_count 4."
            - "Carrier A never activates the block."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { carrier_a_id: $.data.id }
            - call: "POST /numbering/carriers/${carrier_a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "POST /numbering/carriers/${carrier_a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: $.data.id }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 0, contaminated_count: 0 }
              as: NumberingAdministrator
              captures: { blk0_id: $.data.id }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 1, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 2, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 3, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "556", thousands_digit: 4, contaminated_count: 0 }
              as: NumberingAdministrator
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${carrier_a_id}", rate_center_id: "${rc_id}", reporting_period: "2026H1", numbers_assigned: 2800, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [3000, 2000, 1000, 500] }
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { filing_a_id: $.data.id }
            - call: "POST /numbering/utilization-filings/${filing_a_id}/submissions"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${carrier_a_id}"
              captures: { rc_v: $.data.version }
            - call: "POST /numbering/allocation-requests"
