              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { cb_paid: $.data.cumulative_paid_out_cents, cb_fees: $.data.cumulative_bank_fee_cents, cb_short: $.data.reserve_shortfall_cents }
            - call: "POST /oversight/settlement-batches/${bv_id}/fund"
              payload: { funding_reference: "WIRE-NET-BASIS" }
              as: ProgramOfficer
              as_user_id: "po-alice"
              captures: { n_base: $.data.settlement_base_cents, n_fee: $.data.bank_fee_cents, n_res: $.data.reserve_funding_cents, n_net: $.data.net_to_partner_cents }
          assert:
            - "dv_b1_recon == MATCHED with dv_b1_var == 0; dv_bv_recon == VARIANCE_OPEN with dv_bv_var == 100000, then dv_bv_cleared == VARIANCE_CLEARED with dv_bv_adj == 100000 (priority 75 is satisfied because 100000 + 8000000 == 8100000)"
            - "g_base == n_base == 8100000 and g_fee == n_fee == 61000 — base and fee are identical across the two variants"
            - "g_res == 400000 == floor(8000000*500/10000) — the gross basis ignores interchange, returns and the adjustment"
