          difficulty_instance: cross_entity_state_dependency / application_decide_blocked_by_applicant_affiliate_state
          rationale: "That instance already screens an application, suspends the applicant, and shows the decide call answering ERR_AFFILIATE_NOT_ELIGIBLE while the same call succeeds once the partner is eligible again — the full cross-entity claim for priority 27."
