  # ===========================================================================
  - section: errors
    instances:
      - name: research_closed_interval_conflict
        claim_type: violation_to_error
        grounds:
          - calculations.research_visit_overlap
          - errors[ERR_RESEARCH_VISIT_CONFLICT]
        distinguishing_aspect: "Research visits use CLOSED intervals: a second visit whose start equals the first visit's end date (shared boundary day) conflicts; only a start date one full day after the prior end is clean."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One IN_COLLECTION object; research visit A [2026-10-05, 2026-10-07] APPROVED."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0040", title: "Research Object A", declared_value_cents: 1000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/research-access-requests"
              payload: { object_id: "${obj_id}", scholar_name: "Scholar A", research_topic: "Textile dyes", visit_start_date: "2026-10-05", visit_end_date: "2026-10-07" }
              as: Scholar
              as_user_id: "scholar-a"
              captures: { req_a: $.data.id }
            - call: "POST /campus/research-access-requests/${req_a}/decide"
              payload: { outcome: "APPROVED" }
              as: Registrar
            - call: "POST /campus/research-access-requests"
              payload: { object_id: "${obj_id}", scholar_name: "Scholar B", research_topic: "Weave patterns", visit_start_date: "2026-10-07", visit_end_date: "2026-10-09" }
              as: Scholar
              as_user_id: "scholar-b"
              captures: { req_b: $.data.id }
            - call: "POST /campus/research-access-requests"
              payload: { object_id: "${obj_id}", scholar_name: "Scholar C", research_topic: "Dye chromatography", visit_start_date: "2026-10-08", visit_end_date: "2026-10-10" }
              as: Scholar
              as_user_id: "scholar-c"
              captures: { req_c: $.data.id }
          trigger:
            - call: "POST /campus/research-access-requests/${req_b}/decide"
              payload: { outcome: "APPROVED" }
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "POST /campus/research-access-requests/${req_c}/decide"
              payload: { outcome: "APPROVED" }
              as: Registrar
          assert:
            - "visit B approve fails err == ERR_RESEARCH_VISIT_CONFLICT: [2026-10-07, 2026-10-09] shares boundary day 2026-10-07 with A's closed interval"
            - "visit C approve succeeds: ResearchAccessRequest.${req_c}.status == APPROVED (start 2026-10-08 is one day past A's end)"
            - "ResearchAccessRequest.${req_b}.status remains REQUESTED"

      - name: research_visit_vs_loan_window_conflict
        claim_type: violation_to_error
        grounds:
          - calculations.research_visit_overlap
          - errors[ERR_OBJECT_RESERVED_FOR_LOAN]
        distinguishing_aspect: "The visit-vs-loan cross-check compares a closed visit interval against a half-open loan window: a visit inside the AGREED loan window is rejected ERR_OBJECT_RESERVED_FOR_LOAN, while a visit starting exactly on the loan's end date is clean."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Object with AGREED loan window [2026-10-01, 2026-12-01) (declared 40000000, INSURANCE, no courier)."
            - "Two research requests: R1 [2026-11-15, 2026-11-20], R2 [2026-12-01, 2026-12-05]."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/collection-objects"
              payload: { accession_number: "2026.0041", title: "Research Object B", declared_value_cents: 40000000, is_cultural_property: false }
              as: Registrar
              captures: { obj_id: $.data.id }
            - call: "POST /campus/collection-objects/${obj_id}/loan-agreements"
              payload: { borrower_institution: "Research Blocking Museum", loan_start_date: "2026-10-01", loan_end_date: "2026-12-01", declared_value_cents: 40000000, coverage_type: "INSURANCE", courier_required: false }
              as: LoansOfficer
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /campus/loan-agreements/${loan_id}/accept"
              payload: { expected_loan_version: "${loan_v}" }
              as: BorrowerRep
            - call: "POST /campus/research-access-requests"
              payload: { object_id: "${obj_id}", scholar_name: "Scholar D", research_topic: "Mid-loan visit", visit_start_date: "2026-11-15", visit_end_date: "2026-11-20" }
              as: Scholar
              as_user_id: "scholar-d"
              captures: { req_1: $.data.id }
            - call: "POST /campus/research-access-requests"
              payload: { object_id: "${obj_id}", scholar_name: "Scholar E", research_topic: "Post-loan visit", visit_start_date: "2026-12-01", visit_end_date: "2026-12-05" }
              as: Scholar
              as_user_id: "scholar-e"
              captures: { req_2: $.data.id }
          trigger:
            - call: "POST /campus/research-access-requests/${req_1}/decide"
              payload: { outcome: "APPROVED" }
              as: Registrar
              captures: { err: $.data.error_id }
            - call: "POST /campus/research-access-requests/${req_2}/decide"
              payload: { outcome: "APPROVED" }
              as: Registrar
          assert:
            - "R1 approve fails err == ERR_OBJECT_RESERVED_FOR_LOAN (visit overlaps the AGREED window)"
            - "R2 approve succeeds: visit_start 2026-12-01 == loan_end (exclusive) -> no overlap"
            - "ResearchAccessRequest.${req_2}.status == APPROVED and object remains IN_COLLECTION throughout (loan never activated)"

      - name: federal_fund_activity_separation
        claim_type: violation_to_error
        grounds:
          - calculations.fund_activity_permission
          - errors[ERR_FUND_ACTIVITY_NOT_PERMITTED]
        distinguishing_aspect: "The federal-appropriation/trust separation is enforced on both surfaces: an ACQUISITION expenditure on a FEDERAL fund fails 422, an OPERATIONS expenditure on the same fund succeeds, and an acquisition review naming the FEDERAL fund fails at decide."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. FEDERAL fund appropriation 1000000000 ACTIVE."
            - "ACQUISITION review (est 5000000) on the FEDERAL fund, submitted by 'cur-f'."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/funds"
              payload: { fund_code: "FED-FY26", fund_type: "FEDERAL", appropriation_cents: 1000000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/collection-reviews"
              payload: { review_kind: "ACQUISITION", fund_id: "${fund_id}", proposed_object_title: "Federal Purchase Attempt", estimated_cost_cents: 5000000 }
              as: Curator
              as_user_id: "cur-f"
              captures: { rev_id: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/submit"
              payload: {}
              as: Curator
              as_user_id: "cur-f"
              captures: { rev_v: $.data.version }
          trigger:
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 100, activity_type: "ACQUISITION", memo: "Direct federal acquisition attempt" }
              as: FinanceOfficer
              captures: { err_exp: $.data.error_id }
            - call: "POST /campus/funds/${fund_id}/expenditures"
              payload: { amount_cents: 100, activity_type: "OPERATIONS", memo: "Guard salaries" }
              as: FinanceOfficer
              captures: { exp_ok: $.data.id }
            - call: "POST /campus/collection-reviews/${rev_id}/decide"
              payload: { outcome: "APPROVED", expected_review_version: "${rev_v}" }
              as: CommitteeChair
              as_user_id: "chair-f"
              captures: { err_rev: $.data.error_id }
          assert:
            - "ACQUISITION expenditure on FEDERAL fails err_exp == ERR_FUND_ACTIVITY_NOT_PERMITTED (422)"
            - "OPERATIONS expenditure on FEDERAL succeeds: Expenditure.${exp_ok}.status == POSTED"
            - "acquisition review decide on the FEDERAL fund fails err_rev == ERR_FUND_ACTIVITY_NOT_PERMITTED"
            - "CollectionReview.${rev_id}.status remains SUBMITTED"

      - name: group_too_large_and_day_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.reservation_status_resolution
          - errors[ERR_GROUP_TOO_LARGE]
          - errors[ERR_PROGRAM_DAY_MISMATCH]
        distinguishing_aspect: "The two hard reservation gates are distinct from waitlisting: headcount 41 against max_group_size 40 is a 422 rejection (not WAITLISTED), and a Tuesday visit date against a Monday program is a 422 ERR_PROGRAM_DAY_MISMATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Museum; program MON 600-660 gallery G5 capacity 100, ratio 10, max 40, BASIC, SCHEDULED."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NMAH", display_name: "American History", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Big Tour", gallery_code: "G5", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 100, docent_ratio: 10, max_group_size: 40, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "Oversize School", headcount: 41, visit_date: "2026-10-05" }
              as: Public
              as_user_id: "teacher-os"
              captures: { err_size: $.data.error_id }
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "Wrong Day School", headcount: 20, visit_date: "2026-10-06" }
              as: Public
              as_user_id: "teacher-wd"
              captures: { err_day: $.data.error_id }
            - call: "GET /campus/school-reservations"
              payload: { program_id: "${prog_id}" }
