    roles: [Seller]
    success_code: 200
    input: []
    output: PurchaseContract
    side_effects:
      - "set signed_at and inspection_deadline_at"
      - "create the EarnestMoneyDeposit in status HELD"
      - "contract_status becomes SIGNED and version increments"

  - method: POST
    path: /purchase-contracts/{purchase_contract_id}/elect-structure
    description: Elect or re-elect the exit structure, which sizes the double-close funding schedule.
    roles: [Wholesaler]
    success_code: 200
    input: [structure_election]
    output: PurchaseContract
    side_effects:
      - "run calculation double_close_funding_schedule when electing DOUBLE_CLOSE_ELECTED"
      - "clear the funding schedule when reverting to ASSIGNMENT_ELECTED"
      - "increment version"

  - method: POST
    path: /purchase-contracts/{purchase_contract_id}/cancel
    description: Cancel the contract, releasing the property and cascading through offers, agreements, escrow, title and buyer capital.
    roles: [Wholesaler, Seller, ComplianceOfficer]
    success_code: 200
    input: [reason]
    output: PurchaseContract
    side_effects:
