      - name: institution_suspend_reinstate_guards
        claim_type: invalid_transition
        grounds:
          - state_machines.Institution.ACTIVE_to_SUSPENDED
          - state_machines.Institution.SUSPENDED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Suspend requires ACTIVE and reinstate requires SUSPENDED: double-suspend and reinstate-while-ACTIVE both fail with ERR_INVALID_STATE, while the happy path suspend -> reinstate restores ACTIVE with suspension_reason NONE."
        test_recipe:
          setup:
            - "Institution with ACTIVE agreement, currently ACTIVE"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id" } }
