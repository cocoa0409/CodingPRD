            - { call: "POST /registrations", payload: { workshop_id: "${ws}", participant_id: "${p1}" }, as: ProgramAdmin, captures: { rid: "$.data.id" } }
          trigger:
            - { call: "POST /registrations/${rid}/cancel", payload: {}, as: Participant, as_user_id: "${p2}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_FORBIDDEN"

      - name: participant_self_registration_allowed
        claim_type: rbac_allow
        grounds: [roles, endpoints]
        distinguishing_aspect: "Participant role MAY create a registration when participant_id == X-User-ID (shared operation with ownership satisfied)."
        test_recipe:
          setup: ["module; certified coach; workshop 2026-08-10; participant"]
          setup_api_calls:
            - { call: "POST /curriculum-modules", payload: { module_code: "SR-100", title: "SR", session_count: 1, incentive_cents_per_hour: 500, completion_bonus_cents: 0, completion_threshold: 1 }, as: ProgramAdmin, captures: { mod: "$.data.id" } }
            - { call: "POST /coaches", payload: { full_name: "CSR", email: "csr@x.org", max_caseload: 5 }, as: ProgramAdmin, captures: { co: "$.data.id" } }
