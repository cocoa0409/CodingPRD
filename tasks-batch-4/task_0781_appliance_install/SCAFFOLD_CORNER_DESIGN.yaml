# §1.9 Scaffold Corner Design (breadth coverage of §1.1-§1.7 claims not covered by §1.8).
# claim_type values come from references/claim-extraction-guide.md. Clock default 2026-03-01T00:00:00Z.
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_retailer_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Retailer, endpoints]
        distinguishing_aspect: "POST /retailers with name+commission_rate_bps returns 201 with status ACTIVE and settlement_balance_cents 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { name: "Costco", commission_rate_bps: 1500 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Retailer.${ret_id}.status == ACTIVE"
            - "Retailer.${ret_id}.settlement_balance_cents == 0"
            - "Retailer.${ret_id}.commission_rate_bps == 1500"

      - name: get_service_zone_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ServiceZone, "errors[ERR_SERVICE_ZONE_NOT_FOUND]"]
        distinguishing_aspect: "GET /service-zones/{unknown-uuid} returns ERR_SERVICE_ZONE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /service-zones/00000000-0000-0000-0000-0000000000zz"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "data.error_id == ERR_SERVICE_ZONE_NOT_FOUND"

      - name: create_work_order_missing_customer_id_returns_400
        claim_type: Required Fields
        grounds: [entities.WorkOrder.fields.customer_id, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /work-orders omitting the required customer_id returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A retailer, zone, install task exist."]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: create_install_task_invalid_category_returns_400
        claim_type: Type Constraints
        grounds: [entities.InstallTask.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /install-tasks with category outside {TV_MOUNT,APPLIANCE,SMART_DEVICE} returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "FRIDGE", required_skill: "APPLIANCE", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: system_fields_minted_on_pro_create
        claim_type: System Fields
        grounds: [entities.Pro]
        distinguishing_aspect: "POST /pros mints id, created_at, updated_at, and version==1 server-side; counters (pending_payout_cents, reserved_slot_count, rating_count) start at 0."
        test_recipe:
          setup: ["A zone exists."]
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
          trigger:
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id, v: $.data.version }
          assert:
            - "Pro.${pro_id}.version == 1"
            - "Pro.${pro_id}.reserved_slot_count == 0"
            - "Pro.${pro_id}.pending_payout_cents == 0"
            - "Pro.${pro_id}.rating_count == 0"

      - name: rating_entity_has_no_version_field
        claim_type: Immutability
        grounds: [entities.Rating]
        distinguishing_aspect: "Rating has common_fields:false, so its response carries id and created_at but no version and no update endpoint exists."
        test_recipe:
          setup: ["A completed work order rated once (reuse full completion chain)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v}" }
              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/ratings"
              payload: { stars: 5, comment: "great" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rating_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Rating.${rating_id} response includes id and created_at but no version field"
            - "Rating.${rating_id}.pro_id == ${pro_id}"

      - name: create_work_order_unknown_retailer_returns_404
        claim_type: Parent Relationships
        grounds: [entities.WorkOrder.fields.retailer_id, "errors[ERR_RETAILER_NOT_FOUND]"]
        distinguishing_aspect: "Creating a work order whose retailer_id does not resolve returns ERR_RETAILER_NOT_FOUND (404)."
        test_recipe:
          setup: ["A zone, customer, task exist but the retailer id is bogus."]
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { retailer_id: "00000000-0000-0000-0000-0000000000zz", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "00000000-0000-0000-0000-0000000000zz"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "data.error_id == ERR_RETAILER_NOT_FOUND"

  - section: state_machines
    instances:
      - name: workorder_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.WorkOrder, entities.WorkOrder.fields.status]
        distinguishing_aspect: "A newly created work order has status DRAFT and version 1."
        test_recipe:
          setup: ["Retailer, zone, customer, task exist."]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
          assert:
            - "WorkOrder.${wo_id}.status == DRAFT"
            - "WorkOrder.${wo_id}.version == 1"

      - name: start_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.DISPATCHED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /work-orders/{id}/start on a SCHEDULED (not DISPATCHED) order returns ERR_INVALID_STATE; but ownership (no appointment_pro_id yet) means only PlatformAdmin can observe it — a Pro would be blocked by ERR_UNAUTHORIZED first, so this uses a dispatched-then-reverted order kept SCHEDULED with the pro known."
        excluded_because:
          difficulty_instance: non_linear_state_machine / workorder_warranty_redo_cycle_reenters_dispatched
          rationale: "Invalid-from rejection on the WorkOrder start/dispatch lifecycle is exercised indirectly; the clean invalid-state corner is covered by close_before_warranty_elapsed_returns_invalid_state below."

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkOrder.terminal_states, "errors[ERR_ALREADY_TERMINAL]"]
        distinguishing_aspect: "Cancelling a WorkOrder already in CANCELLED (terminal) returns ERR_ALREADY_TERMINAL (409); no side effects fire."
        test_recipe:
          setup: ["A DRAFT work order cancelled once."]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { reason: "first" }
              as: Retailer
              as_user_id: "${ret_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { reason: "second" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "data.error_id == ERR_ALREADY_TERMINAL"

      - name: approve_already_approved_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.ProApplication.PENDING_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving an application already APPROVED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A pro with an APPROVED application."]
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: close_before_warranty_elapsed_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.COMPLETED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a COMPLETED order while clock <= warranty_expires_at (warranty not elapsed) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Simple WO completed at 2026-03-05T10:00Z, warranty_expires 2026-04-04T10:00Z; clock still 2026-03-05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v}" }
              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

  - section: calculations
    instances:
      - name: quoted_price_computed_on_schedule_with_addons
        claim_type: Computed Fields
        grounds: [calculations.work_order_quoted_price, entities.WorkOrder.fields.quoted_price_cents]
        distinguishing_aspect: "Scheduling with 2 add-ons (3000+2500) on a base-12000 task sets quoted_price_cents == 17500 (no discount/parts/surcharge)."
        test_recipe:
          setup: ["Retailer, zone, customer, TV_MOUNT task base 12000, 2 TV_MOUNT add-ons."]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /add-ons"
              payload: { addon_code: "A1", name: "A1", category: "TV_MOUNT", price_cents: 3000 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /add-ons"
              payload: { addon_code: "A2", name: "A2", category: "TV_MOUNT", price_cents: 2500 }
              as: PlatformAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z", selected_addon_ids: ["${a1_id}", "${a2_id}"] }
              as: Retailer
              as_user_id: "${ret_id}"
          assert:
            - "WorkOrder.${wo_id}.status == SCHEDULED"
            - "WorkOrder.${wo_id}.quoted_price_cents == 17500"

      - name: settlement_run_settles_pending_charge_and_returns_summary
        claim_type: Correct Result
        grounds: [calculations.retailer_settlement_run, state_machines.RetailerSettlementEntry.PENDING_to_SETTLED, entities.Retailer.fields.settlement_balance_cents]
        distinguishing_aspect: "After a completion produces a PENDING CHARGE of 10800, POST /retailers/{id}/settlements with period_end 2026-04-01 settles 1 entry (gross_settled_cents 10800) and drives settlement_balance_cents to 0."
        test_recipe:
          setup: ["Simple WO completed -> one PENDING CHARGE 10800; balance 10800."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "Z1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG" }
