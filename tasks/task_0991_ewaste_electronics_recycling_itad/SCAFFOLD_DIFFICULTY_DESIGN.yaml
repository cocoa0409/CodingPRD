# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index (task 0991 ITAD)
# 9 Difficulty Rules x 2 instances = 18 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_quote_vs_final_value_divergence
        grounds:
          - calculations.settlement_valuation
          - state_machines.Settlement.QUOTE_OPEN_to_FINALIZED
        distinguishing_aspect: |
          Same manifest and same items: the QUOTE variant values two grade-A laptops
          at catalog estimate (80000 cents gross) while the FINAL variant values them
          at realized net sale proceeds (102000 cents gross) — dual-variant logic on
          the Settlement/money domain, distinct from the Recycler scoring domain.
        test_recipe:
          setup:
            - "Account exists; clock at 2026-05-01T00:00:00Z"
            - "DROPOFF manifest (declared 2) is RECEIVED with two non-data-bearing LAPTOP grade A items triaged to RESALE"
            - "A QUOTE settlement was created before any sale (gross 80000)"
            - "Both items then sold at 60000 cents each and the manifest RECONCILED"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Acme Corp", contact_email: "it@acme.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 2 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-L1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-L2", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i2: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i2}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s: $.data.id, q_gross: $.data.gross_buyback_cents } }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 60000, floor_price_cents: 50000, channel: "RETAIL" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings", payload: { item_id: "${i2}", asking_price_cents: 60000, floor_price_cents: 50000, channel: "RETAIL" }, as: IntakeOperator, captures: { l2: $.data.id } }
            - { call: "POST /itad/listings/${l1}/sell", payload: { sale_price_cents: 60000 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l2}/sell", payload: { sale_price_cents: 60000 }, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/reconcile", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/settlements/${s}/finalize", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "GET /itad/settlements/${s}", payload: {}, as: PlatformAdmin, captures: { f_kind: $.data.kind, f_gross: $.data.gross_buyback_cents, f_fees: $.data.total_fees_cents, f_rebate: $.data.volume_rebate_cents, f_net: $.data.net_amount_cents } }
          assert:
            - "captured q_gross == 80000 (QUOTE: 2 x round(40000 x 1.0))"
            - "Settlement.${s}.kind == FINAL and gross_buyback_cents == 102000 (FINAL: 2 x (60000 - round_half_up(60000 x 0.15)))"
            - "Settlement.${s}.volume_rebate_cents == 2040 and net_amount_cents == 104040"
            - "f_gross != q_gross — identical items, different variants, different money"

      - name: recycler_score_weights_flip_selector_winner
        grounds:
          - calculations.recycler_selection_score
          - entities.CompliancePolicy.fields.weight_cert_freshness
        distinguishing_aspect: |
          Identical recycler statistics scored under the R2 weight set (0.5/0.2/0.3)
          rank recycler A first, while the E_STEWARDS weight set (0.3/0.2/0.5) ranks
          recycler B first — dual-variant logic on the Recycler/compliance domain,
          distinct from the Settlement money domain, and the selector winner observably flips.
        test_recipe:
          setup:
            - "Clock at 2026-05-01T00:00:00Z; R2 policy ACTIVE with weights 0.5/0.2/0.3"
            - "Recycler A: cert expires 2027-05-01 (365 days), violation_count 4, never processed -> R2 score 68.0"
            - "Recycler B: cert expires 2026-11-01 (184 days), violation_count 0, never processed -> R2 score 55.21"
          setup_api_calls:
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["CRYPTO_ERASE", "NIST_CLEAR", "NIST_PURGE", "PHYSICAL_DESTROY"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/recyclers", payload: { name: "RecA", certification_standard: "R2", certification_expires_at: "2027-05-01T00:00:00Z", accepted_categories: ["LAPTOP", "SERVER"], daily_intake_capacity_kg: 100000, violation_count: 4 }, as: ComplianceOfficer, captures: { rec_a: $.data.id } }
            - { call: "POST /itad/recyclers", payload: { name: "RecB", certification_standard: "R2", certification_expires_at: "2026-11-01T00:00:00Z", accepted_categories: ["LAPTOP"], daily_intake_capacity_kg: 100000, violation_count: 0 }, as: ComplianceOfficer, captures: { rec_b: $.data.id } }
            - { call: "GET /itad/recyclers/${rec_a}", payload: {}, as: ComplianceOfficer, captures: { a_r2: $.data.risk_score } }
            - { call: "POST /itad/recycle-batches", payload: { scheduled_delivery_date: "2026-06-10T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b1_rec: $.data.recycler_id } }
            - { call: "POST /itad/compliance-policies", payload: { standard: "E_STEWARDS", sanitization_methods_allowed: ["NIST_PURGE", "PHYSICAL_DESTROY"], export_allowed: false, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.3, weight_volume: 0.2, weight_violations: 0.5 }, as: PlatformAdmin }
            - { call: "GET /itad/recyclers/${rec_a}", payload: {}, as: ComplianceOfficer, captures: { a_es: $.data.risk_score } }
            - { call: "GET /itad/recyclers/${rec_b}", payload: {}, as: ComplianceOfficer, captures: { b_es: $.data.risk_score } }
          trigger:
            - { call: "POST /itad/recycle-batches", payload: { scheduled_delivery_date: "2026-06-10T00:00:00Z", is_export: false }, as: LogisticsCoordinator, captures: { b2_rec: $.data.recycler_id } }
          assert:
            - "a_r2 == 68.0 (100 x (0.5 x 1.0 + 0.2 x 0 + 0.3 x 0.6)) and selector batch 1 picked ${rec_a}"
            - "a_es == 60.0 and b_es == 65.12 under E_STEWARDS weights"
            - "selector batch 2 picked ${rec_b} (b2_rec == rec_b) — the ranking flipped with identical recycler stats"

  - rule_id: combinatorial_formula
    instances:
      - name: recycling_fee_weight_tier_and_hazmat_branches
        grounds:
          - calculations.item_recycling_fee
        distinguishing_aspect: |
          Mode (a) combinatorial: the fee combines four inputs (category base,
          weight-tiered per-kg rate, hazmat branch, data-bearing branch) with tier
          selection — a 5.0 kg hazmat MONITOR lands exactly on the lower MID-tier
          boundary (5.0 <= w <= 20.0 at 90 cents/kg) yielding 1200 + 450 + 2000 = 3650.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; DROPOFF manifest (declared 1) RECEIVED"
            - "One MONITOR item, weight exactly 5.0 kg, hazmat_flag true, non-data-bearing, triaged RECYCLE"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Fee Co", contact_email: "f@fee.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-M1", category: "MONITOR", weight_kg: 5.0, data_bearing: false, hazmat_flag: true, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RECYCLE" }, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
          trigger:
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s_fees: $.data.total_fees_cents, s_gross: $.data.gross_buyback_cents, s_rebate: $.data.volume_rebate_cents, s_net: $.data.net_amount_cents } }
          assert:
            - "total_fees_cents == 3650 (MONITOR base 1200 + round_half_up(5.0 x 90) 450 MID tier + hazmat 2000; weight 5.0 is MID, not LIGHT)"
            - "gross_buyback_cents == 0 (RECYCLE disposition) and volume_rebate_cents == 0 (non-positive pre-rebate net)"
            - "net_amount_cents == -3650 (customer owes fees)"

      - name: volume_rebate_pinned_evaluation_order
        grounds:
          - calculations.settlement_net_rebate
        distinguishing_aspect: |
          Mode (c) combinatorial: the rebate tier is keyed on the PRE-rebate net
          (495000 -> SILVER 2% -> rebate 9900 -> net 504900); keying on the
          post-rebate net would select GOLD (504900 >= 500000 -> rebate 24750) —
          the pinned evaluation order (gross, fees, pre_rebate_net, tier, rebate, net)
          is what makes 9900 the only correct answer.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; PICKUP manifest route R-1 (declared 6) RECEIVED"
            - "Six non-data-bearing LAPTOP grade A items, all sold at 100000 cents each (STANDARD commission 15%)"
            - "Manifest RECONCILED; QUOTE created; settlement finalized"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Rebate Co", contact_email: "r@rebate.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "PICKUP", pickup_route: "R-1", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z", declared_item_count: 6 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-R1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-R2", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i2: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-R3", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i3: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-R4", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i4: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-R5", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i5: $.data.id } }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-R6", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i6: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i2}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i3}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i4}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i5}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i6}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 100000, floor_price_cents: 90000, channel: "B2B_AUCTION" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings", payload: { item_id: "${i2}", asking_price_cents: 100000, floor_price_cents: 90000, channel: "B2B_AUCTION" }, as: IntakeOperator, captures: { l2: $.data.id } }
            - { call: "POST /itad/listings", payload: { item_id: "${i3}", asking_price_cents: 100000, floor_price_cents: 90000, channel: "B2B_AUCTION" }, as: IntakeOperator, captures: { l3: $.data.id } }
            - { call: "POST /itad/listings", payload: { item_id: "${i4}", asking_price_cents: 100000, floor_price_cents: 90000, channel: "B2B_AUCTION" }, as: IntakeOperator, captures: { l4: $.data.id } }
            - { call: "POST /itad/listings", payload: { item_id: "${i5}", asking_price_cents: 100000, floor_price_cents: 90000, channel: "B2B_AUCTION" }, as: IntakeOperator, captures: { l5: $.data.id } }
            - { call: "POST /itad/listings", payload: { item_id: "${i6}", asking_price_cents: 100000, floor_price_cents: 90000, channel: "B2B_AUCTION" }, as: IntakeOperator, captures: { l6: $.data.id } }
            - { call: "POST /itad/listings/${l1}/sell", payload: { sale_price_cents: 100000 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l2}/sell", payload: { sale_price_cents: 100000 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l3}/sell", payload: { sale_price_cents: 100000 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l4}/sell", payload: { sale_price_cents: 100000 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l5}/sell", payload: { sale_price_cents: 100000 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l6}/sell", payload: { sale_price_cents: 100000 }, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/reconcile", payload: {}, as: IntakeOperator }
            - { call: "GET /itad/manifests/${m}", payload: {}, as: IntakeOperator, captures: { m_v: $.data.version } }
            - { call: "POST /itad/manifests/${m}/settlements", payload: { expected_manifest_version: "${m_v}" }, as: IntakeOperator, captures: { s: $.data.id } }
            - { call: "POST /itad/settlements/${s}/finalize", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "GET /itad/settlements/${s}", payload: {}, as: PlatformAdmin, captures: { f_gross: $.data.gross_buyback_cents, f_fees: $.data.total_fees_cents, f_rebate: $.data.volume_rebate_cents, f_net: $.data.net_amount_cents } }
          assert:
            - "gross_buyback_cents == 510000 (6 x 85000 net proceeds)"
            - "total_fees_cents == 15000 (flat PICKUP fee only)"
            - "volume_rebate_cents == 9900 — tier read from pre_rebate_net 495000 (SILVER 2%), NOT from post-rebate 504900 (which would be GOLD 24750)"
            - "net_amount_cents == 504900"

  - rule_id: non_linear_state_machine
    instances:
      - name: item_parallel_data_dim_and_refurb_reroute_loop
        grounds:
          - state_machines.Item
          - state_machines.DataSanitization.LOGGED_to_REJECTED
        distinguishing_aspect: |
          Item carries two independent state dimensions: processing_status loops
          INTAKE -> FOR_REFURB -> FOR_RESALE -> LISTED -> FOR_RESALE while
          data_status independently cycles PENDING -> SANITIZED -> PENDING (rejected
          verification) -> SANITIZED -> VERIFIED; the processing loop neither resets
          nor is blocked by the already-VERIFIED data dimension.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; R2 policy ACTIVE allowing all four methods"
            - "Manifest (declared 1) RECEIVED with one data-bearing LAPTOP grade B"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Loop Co", contact_email: "l@loop.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/compliance-policies", payload: { standard: "R2", sanitization_methods_allowed: ["CRYPTO_ERASE", "NIST_CLEAR", "NIST_PURGE", "PHYSICAL_DESTROY"], export_allowed: true, resale_requires_verified_sanitization: true, is_active: true, weight_cert_freshness: 0.5, weight_volume: 0.2, weight_violations: 0.3 }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-X1", category: "LAPTOP", weight_kg: 2.5, data_bearing: true, hazmat_flag: false, declared_grade: "B" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "REFURB" }, as: IntakeOperator }
            - { call: "POST /itad/items/${i1}/sanitizations", payload: { method: "NIST_CLEAR", outcome: "PASS" }, as: DestructionTechnician, as_user_id: "tech-1", captures: { s1: $.data.id } }
            - { call: "POST /itad/sanitizations/${s1}/verify", payload: { verdict: "REJECT" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /itad/items/${i1}/sanitizations", payload: { method: "NIST_PURGE", outcome: "PASS" }, as: DestructionTechnician, as_user_id: "tech-1", captures: { s2: $.data.id } }
            - { call: "POST /itad/sanitizations/${s2}/verify", payload: { verdict: "APPROVE" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 30000, floor_price_cents: 20000, channel: "RETAIL" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings/${l1}/withdraw", payload: {}, as: IntakeOperator }
          trigger:
            - { call: "GET /itad/items/${i1}", payload: {}, as: IntakeOperator, captures: { i_proc: $.data.processing_status, i_data: $.data.data_status, i_disp: $.data.disposition } }
          assert:
            - "Item.${i1}.processing_status == FOR_RESALE (completed INTAKE -> FOR_REFURB -> FOR_RESALE -> LISTED -> FOR_RESALE loop)"
            - "Item.${i1}.data_status == VERIFIED (survived the reject/retry loop and the processing reroutes untouched)"
            - "Item.${i1}.disposition == RESALE"

      - name: listing_sold_returned_relist_cycle
        grounds:
          - state_machines.ResaleListing.SOLD_to_RETURNED
          - state_machines.ResaleListing.RETURNED_to_ACTIVE
        distinguishing_aspect: |
          ResaleListing is cyclic: ACTIVE -> SOLD -> RETURNED -> ACTIVE; the same
          listing row returns to ACTIVE (not a new listing) and the linked Item rides
          along LISTED -> SOLD -> FOR_RESALE -> LISTED. This cycle is on ResaleListing,
          a different entity than the Item parallel-dimension machine.
        test_recipe:
          setup:
            - "Account; clock 2026-05-01; DROPOFF manifest (declared 1) RECEIVED; one non-data-bearing LAPTOP grade A triaged RESALE and listed"
          setup_api_calls:
            - { call: "POST /itad/accounts", payload: { company_name: "Cycle Co", contact_email: "c@cycle.example" }, as: PlatformAdmin, captures: { acct: $.data.id } }
            - { call: "POST /itad/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /itad/manifests", payload: { account_id: "${acct}", mode: "DROPOFF", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", declared_item_count: 1 }, as: AccountManager, as_user_id: "${acct}", captures: { m: $.data.id } }
            - { call: "POST /itad/manifests/${m}/schedule", payload: {}, as: LogisticsCoordinator }
            - { call: "POST /itad/manifests/${m}/receive", payload: {}, as: IntakeOperator }
            - { call: "POST /itad/manifests/${m}/items", payload: { serial_number: "SN-C1", category: "LAPTOP", weight_kg: 2.0, data_bearing: false, hazmat_flag: false, declared_grade: "A" }, as: IntakeOperator, captures: { i1: $.data.id } }
            - { call: "POST /itad/items/${i1}/triage", payload: { disposition: "RESALE" }, as: IntakeOperator }
            - { call: "POST /itad/listings", payload: { item_id: "${i1}", asking_price_cents: 2000, floor_price_cents: 1000, channel: "RETAIL" }, as: IntakeOperator, captures: { l1: $.data.id } }
            - { call: "POST /itad/listings/${l1}/sell", payload: { sale_price_cents: 1500 }, as: IntakeOperator }
            - { call: "POST /itad/listings/${l1}/return", payload: {}, as: IntakeOperator }
          trigger:
            - { call: "POST /itad/listings/${l1}/relist", payload: {}, as: IntakeOperator, captures: { l_status: $.data.status } }
