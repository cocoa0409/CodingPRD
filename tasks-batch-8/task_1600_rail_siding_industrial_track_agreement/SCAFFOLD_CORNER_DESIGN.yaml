scaffold_corner_design:
- section: entities
  instances:
  - name: agreement_create_success_defaults
    claim_type: creation
    grounds:
    - entities.TrackAgreement
    - endpoints[POST /agreements]
    distinguishing_aspect: 'Valid creation returns 201 with system fields server-set: status DRAFT, version 1, removal_penalty_cents
      0, id/created_at/updated_at present.'
    test_recipe:
      setup:
      - Empty database; logical clock at startup default 2026-08-01T00:00:00Z
      setup_api_calls: []
      trigger:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
          agr_status: $.data.status
          agr_v: $.data.version
          agr_pen: $.data.removal_penalty_cents
      assert:
      - HTTP 201 and TrackAgreement.${agr_id} persisted
      - agr_status == DRAFT (initial state)
      - agr_v == 1 and agr_pen == 0
      - Response data carries server-minted id, created_at, updated_at (client did not supply them)
  - name: agreement_create_missing_shipper_name_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.TrackAgreement.fields.shipper_name
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Omitting required input shipper_name fails field validation with ERR_INVALID_REQUEST (400); nothing
      is persisted.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /agreements
        payload:
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST and HTTP status == 400
  - name: agreement_create_equal_term_dates_rejected
    claim_type: type_constraints
    grounds:
    - entities.TrackAgreement.fields.term_end_date
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: term_end_date == term_start_date violates the strict > constraint -> ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2026-08-01'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST and HTTP status == 400
  - name: segment_create_computed_field_input_ignored
    claim_type: computed_fields
    grounds:
    - entities.TrackSegment.fields.stored_car_count
    - entities.TrackSegment.fields.safety_suspended
    distinguishing_aspect: Client-supplied stored_car_count 99 and safety_suspended true are ignored; server computes 0 /
      false.
    test_recipe:
      setup:
      - ACTIVE agreement A
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      trigger:
      - call: POST /segments
        payload:
          agreement_id: ${agr_id}
          segment_name: Siding A
          length_feet: 1200
          storage_capacity_cars: 3
          stored_car_count: 99
          safety_suspended: true
        as: RailroadEngineer
        captures:
          seg_count: $.data.stored_car_count
          seg_susp: $.data.safety_suspended
      assert:
      - seg_count == 0 (client input 99 ignored; computed from placements)
      - seg_susp == false (client input true ignored)
  - name: car_dwell_invalid_ownership_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.CarDwell.fields.car_ownership
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: car_ownership outside {RAILROAD, PRIVATE} -> ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - ACTIVE agreement A
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      trigger:
      - call: POST /car-dwells
        payload:
          agreement_id: ${agr_id}
          car_mark: RBOX9001
          car_ownership: ELECTRIC
          placed_at: '2026-08-01T00:00:00Z'
        as: RailroadServiceManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST and HTTP status == 400
  - name: get_unknown_agreement_returns_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_AGREEMENT_NOT_FOUND]
    distinguishing_aspect: GET with a well-formed but unknown UUID -> 404 ERR_AGREEMENT_NOT_FOUND.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /agreements/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: RailroadContractsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_AGREEMENT_NOT_FOUND and HTTP status == 404
  - name: car_dwell_list_pagination_interaction
    claim_type: listing
    grounds:
    - response_envelope
    - endpoints[GET /car-dwells]
    distinguishing_aspect: 'limit=1 pages a 2-row result: page 1 has_more true, page 2 (offset=1) has_more false; total_count
      stays 2 on both.'
    test_recipe:
      setup:
      - ACTIVE agreement A with two SPOTTED dwells RBOX9101, RBOX9102
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      - call: POST /car-dwells
        payload:
          agreement_id: ${agr_id}
          car_mark: RBOX9101
          car_ownership: RAILROAD
          placed_at: '2026-08-01T00:00:00Z'
        as: RailroadServiceManager
      - call: POST /car-dwells
        payload:
          agreement_id: ${agr_id}
          car_mark: RBOX9102
          car_ownership: RAILROAD
          placed_at: '2026-08-01T00:00:00Z'
        as: RailroadServiceManager
      trigger:
      - call: GET /car-dwells?agreement_id=${agr_id}&limit=1&offset=0
        as: RailroadServiceManager
      - call: GET /car-dwells?agreement_id=${agr_id}&limit=1&offset=1
        as: RailroadServiceManager
      assert:
      - 'Page 1: response_type == array, exactly 1 row, total_count == 2, has_more == true'
      - 'Page 2: exactly 1 row, total_count == 2, has_more == false'
      - The two pages return disjoint car_mark sets {RBOX9101} and {RBOX9102}
  - name: project_create_applies_default_share_pct
    claim_type: defaults
    grounds:
    - entities.ConstructionProject.fields.shipper_share_pct
    distinguishing_aspect: Omitting shipper_share_pct copies the agreement's shipper_cost_share_pct (40) at creation.
    test_recipe:
      setup:
      - ACTIVE agreement A (shipper_cost_share_pct 40)
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      trigger:
      - call: POST /construction-projects
        payload:
          agreement_id: ${agr_id}
          project_name: North Siding Extension
          estimated_cost_cents: 500000
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          pct: $.data.shipper_share_pct
          rev: $.data.spec_revision_no
      assert:
      - pct == 40 (defaulted from the agreement, client did not supply it)
      - rev == 0
- section: state_machines
  instances:
  - name: countersign_from_draft_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.TrackAgreement.DRAFT_to_PENDING_COUNTERSIGN
    - errors[ERR_AGREEMENT_INVALID_STATE]
    distinguishing_aspect: Countersign requires PENDING_COUNTERSIGN; from DRAFT the trigger is not in the transition list
      -> ERR_AGREEMENT_INVALID_STATE, no version bump.
    test_recipe:
      setup:
      - Agreement A in DRAFT (created, never submitted)
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      trigger:
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_AGREEMENT_INVALID_STATE and HTTP status == 409
      - GET /agreements/${agr_id} still shows status DRAFT and version 1
  - name: release_already_released_dwell_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.CarDwell.SPOTTED_to_RELEASED
    - errors[ERR_DWELL_INVALID_STATE]
    distinguishing_aspect: RELEASED is terminal; a second release is rejected with ERR_DWELL_INVALID_STATE and final_demurrage_cents
      does not change.
    test_recipe:
      setup:
      - ACTIVE agreement A; dwell RBOX9201 already RELEASED (final 7500)
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      - call: POST /car-dwells
        payload:
          agreement_id: ${agr_id}
          car_mark: RBOX9201
          car_ownership: RAILROAD
          placed_at: '2026-08-01T00:00:00Z'
        as: RailroadServiceManager
        captures:
          dwell_id: $.data.id
      - call: POST /car-dwells/${dwell_id}/release
        payload:
          released_at: '2026-08-03T00:01:00Z'
        as: RailroadServiceManager
        captures:
          final_before: $.data.final_demurrage_cents
      trigger:
      - call: POST /car-dwells/${dwell_id}/release
        payload:
          released_at: '2026-08-09T00:00:00Z'
        as: RailroadServiceManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DWELL_INVALID_STATE and HTTP status == 409
      - final_before == 7500 and a follow-up GET still shows final_demurrage_cents == 7500 (no drift from the rejected call)
  - name: record_result_twice_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.SafetyInspection
    - errors[ERR_INSPECTION_INVALID_STATE]
    distinguishing_aspect: COMPLETED_PASS is terminal for record-result; a second record-result on the same inspection ->
      ERR_INSPECTION_INVALID_STATE.
    test_recipe:
      setup:
      - ACTIVE agreement A; segment; inspection completed PASS on 2026-08-01
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      - call: POST /segments
        payload:
          agreement_id: ${agr_id}
          segment_name: Siding A
          length_feet: 1200
          storage_capacity_cars: 3
        as: RailroadEngineer
        captures:
          seg_id: $.data.id
      - call: POST /inspections
        payload:
          agreement_id: ${agr_id}
          segment_id: ${seg_id}
          scheduled_date: '2026-08-01'
        as: SafetyInspector
        captures:
          insp_id: $.data.id
      - call: POST /inspections/${insp_id}/record-result
        payload:
          result: PASS
          completed_date: '2026-08-01'
        as: SafetyInspector
      trigger:
      - call: POST /inspections/${insp_id}/record-result
        payload:
          result: FAIL
          completed_date: '2026-08-02'
        as: SafetyInspector
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INSPECTION_INVALID_STATE and HTTP status == 409
      - SafetyInspection.${insp_id}.status remains COMPLETED_PASS
  - name: claim_dispute_and_reapportion_cycle
    claim_type: valid_transition
    grounds:
    - state_machines.LiabilityClaim.DISPUTED_to_APPORTIONED
    - calculations.liability_allocation
    distinguishing_aspect: 'The FILED->APPORTIONED->DISPUTED->APPORTIONED->ACCEPTED loop is walkable, and re-apportionment
      recomputes the allocation: 60000 at 50% -> 30000, then at 40% -> 24000 (cap aggregate still 0 because nothing is ACCEPTED
      yet).'
    test_recipe:
      setup:
      - ACTIVE agreement A; claim of 60000 cents FILED
      setup_api_calls:
      - call: POST /agreements
        payload:
          shipper_name: Acme Chemical Co
          shipper_user_id: shipper-user-1
          facility_name: Acme Baton Rouge Plant
          term_start_date: '2026-08-01'
          term_end_date: '2027-07-31'
          renewal_notice_days: 90
          renewal_term_months: 12
          shipper_cost_share_pct: 40
          liability_cap_cents: 100000
          shipper_indemnity_default_pct: 50
          free_time_hours: 48
          demurrage_base_rate_cents: 7500
          demurrage_escalated_rate_cents: 15000
          storage_rate_per_car_month_cents: 10012
          inspection_cadence_days: 90
          removal_period_days: 90
          removal_penalty_per_day_cents: 5000
          service_days_of_week:
          - MON
          - WED
          - FRI
          max_switches_per_day: 1
        as: RailroadContractsManager
        captures:
          agr_id: $.data.id
      - call: POST /agreements/${agr_id}/submit
        as: RailroadContractsManager
      - call: POST /agreements/${agr_id}/countersign
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
      - call: POST /liability-claims
        payload:
          agreement_id: ${agr_id}
          claimant_name: J. Doe
          incident_date: '2026-08-02'
          claim_amount_cents: 60000
        as: RailroadContractsManager
        captures:
          claim_id: $.data.id
          st0: $.data.status
      trigger:
      - call: POST /liability-claims/${claim_id}/apportion
        payload:
          shipper_fault_pct: 50
        as: RailroadContractsManager
        captures:
          liab1: $.data.shipper_liability_cents
      - call: POST /liability-claims/${claim_id}/dispute
        payload:
          dispute_reason: Fault percentage contested
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          st_disp: $.data.status
      - call: POST /liability-claims/${claim_id}/apportion
        payload:
          shipper_fault_pct: 40
        as: RailroadContractsManager
        captures:
          liab2: $.data.shipper_liability_cents
          rail2: $.data.railroad_liability_cents
      - call: POST /liability-claims/${claim_id}/accept
        as: ShipperFacilityManager
        as_user_id: shipper-user-1
        captures:
          st_final: $.data.status
      assert:
      - st0 == FILED; liab1 == 30000 (50% of 60000)
      - st_disp == DISPUTED (cycle branch)
      - liab2 == 24000 and rail2 == 36000 (recomputed on re-apportion; ACCEPTED-set sum is still 0)
      - st_final == ACCEPTED
  - name: terminate_cascades_to_orders_and_amendments
    claim_type: side_effect_execution
    grounds:
    - state_machines.TrackAgreement.ACTIVE_to_TERMINATED
