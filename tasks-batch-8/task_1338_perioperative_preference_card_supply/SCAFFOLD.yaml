# =============================================================================
# PRD Benchmark Seed Tables — Perioperative Preference Card & Supply Picking
# =============================================================================

scenario: |
  Perioperative Preference Card & Supply Picking (OR supply chain team): surgeon preference card maintenance & version control, pick-list generation & case-cart assembly, open vs hold item designation & waste tracking, substitution when item unavailable, cost-per-case reporting & standardization initiative, card accuracy audit after cases, new product request & value-analysis approval, consignment count & billing capture

domain_name: perioperative-preference-card-supply
api_prefix: /perioperative

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - version_pinning_on_approval   # SurgicalCase pins PreferenceCard.version_number at scheduling; card publish supersedes
    - dual_variant_calculation      # standard vs actual case cost; line-match vs spend-weighted audit accuracy
    - cascading_side_effects        # complete-case chain: usage -> case costs -> audit flag -> card counters
    - optimistic_concurrency        # OCC on PreferenceCard.version (publish) and SurgicalCase.version (repin)
  entity_topology: flat             # peer collections with FK references, no URL nesting beyond /perioperative
  state_machine_shape: cyclic       # PickList IN_PICKING<->PICKING_EXCEPTION loop; CardAccuracyAudit UNDER_REVIEW<->DISPUTED loop
  relationship_patterns:
    - one_to_many                   # card -> lines, pick list -> lines, case -> usage records
    - cross_aggregate               # case pins card version; audit references case + card
  role_model: segregation_of_duties # product request: requester cannot review; reviewer cannot approve (distinct officers)
  consistency_model: immediate      # all side effects atomic within the triggering request

conventions:
  money: "all monetary fields are integer cents (e.g., unit_cost_cents)"
  percentages: "all *_pct fields are numbers with 2 decimal places, round_half_up (e.g., 66.67)"
  list_ordering: "list endpoints sort by created_at ASC unless the endpoint states otherwise; pick-list-lines sort by pick_sequence ASC (ties: created_at ASC)"
  atomicity: "all §1.4 validations for an endpoint run before any mutation; a failed request applies zero side effects"
  time: "no logical clock endpoint exists; all temporal inputs (scheduled_start, expected_duration_min) are explicit request fields and all comparisons are between request-supplied values"
  identity_headers: "X-User-Role carries the role name from §1.7; X-User-ID carries the entity id for entity_backed roles (Surgeon) and an opaque operator id otherwise"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Surgeon
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Surgeon full name" }
      - { name: specialty, type: string, source: input, description: "Surgical specialty label (free-form, e.g. ORTHO, CARD)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; constrained to those two values", constraints: "ACTIVE | INACTIVE" }

  - name: SupplyItem
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit code", constraints: "unique across all supply items" }
      - { name: name, type: string, source: input, description: "Item display name" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Standard unit cost in cents", constraints: ">= 1" }
      - { name: substitute_group, type: string, source: input, description: "Substitution group label; two items are interchangeable iff both have equal non-null substitute_group", default: null, constraints: "null means the item has no valid substitutes" }
      - { name: consignment_flag, type: boolean, source: input, default: false, description: "True when the item is vendor-owned until opened (consignment)" }
      - { name: on_hand_quantity, type: integer, source: system, default: 0, description: "Sterile-core stock on hand; initialized from initial_on_hand at creation, then mutated only by stock adjustments, picks, substitutions, returns, cancel-restock, and verified consignment counts" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED", constraints: "ACTIVE | DISCONTINUED" }

  - name: PreferenceCard
    parent: null
    common_fields: true
    fields:
      - { name: surgeon_id, type: string, source: input, description: "FK -> Surgeon.id; owning surgeon" }
      - { name: procedure_name, type: string, source: input, description: "Procedure label grouping cards for standardization comparison (e.g. TOTAL_KNEE_ARTHROPLASTY)" }
      - { name: version_number, type: integer, source: system, description: "Business version: 1 for the first card of a (surgeon_id, procedure_name) pair, max(existing)+1 thereafter" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED | RETIRED", constraints: "DRAFT | ACTIVE | SUPERSEDED | RETIRED" }
      - { name: estimated_cost_cents, type: integer, source: computed, default: 0, description: "Sum over current card lines of quantity x supply_item.unit_cost_cents; recomputed on every line add/delete" }
      - { name: flagged_audit_count, type: integer, source: system, default: 0, description: "Count of CardAccuracyAudit rows for this card with waste_flag = true" }
      - { name: rolling_line_match_pct, type: number, source: computed, default: null, description: "Mean of line_match_pct over all CardAccuracyAudit rows for this card, 2dp round_half_up; null until the first audit exists" }

  - name: PreferenceCardLine
    parent: null
    common_fields: true
    fields:
      - { name: card_id, type: string, source: input, description: "FK -> PreferenceCard.id; owning card (card must be DRAFT)" }
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id; item to pick (item must be ACTIVE)" }
      - { name: quantity, type: integer, source: input, description: "Planned pick quantity", constraints: ">= 1" }
      - { name: designation, type: enum, source: input, description: "OPEN = opened onto the field at case start; HOLD = held back and opened only on request", constraints: "OPEN | HOLD" }
      - { name: pick_sequence, type: integer, source: input, default: null, description: "Pick ordering; defaults to creation order index (1-based) when omitted" }
      - { name: notes, type: string, source: input, default: null, description: "Free-form picker note" }

  - name: SurgicalCase
    parent: null
    common_fields: true
    fields:
      - { name: surgeon_id, type: string, source: input, description: "FK -> Surgeon.id; performing surgeon (must equal the pinned card's surgeon)" }
      - { name: card_id, type: string, source: input, description: "FK -> PreferenceCard.id; pinned preference card" }
      - { name: pinned_card_version_number, type: integer, source: system, description: "Card's version_number captured at scheduling (and re-captured by repin-card); never auto-advances when a newer card version publishes" }
      - { name: procedure_name, type: string, source: system, description: "Copied from the pinned card at scheduling/repin" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned case start, ISO 8601 UTC" }
      - { name: expected_duration_min, type: integer, source: input, description: "Planned duration in minutes", constraints: ">= 1" }
      - { name: room, type: string, source: input, description: "Operating room identifier (e.g. OR-1)" }
      - { name: consignment_budget_cents, type: integer, source: input, default: null, description: "Optional per-case cap on total consignment charges; null = uncapped", constraints: ">= 1 when present" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | PICKING_RELEASED | IN_PROGRESS | COMPLETED | CANCELLED", constraints: "SCHEDULED | PICKING_RELEASED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: standard_cost_cents, type: integer, source: computed, default: null, description: "As-planned cost from the pinned card version, computed at pick-list release" }
      - { name: actual_cost_cents, type: integer, source: computed, default: null, description: "As-used cost incl. waste charges, computed at case completion" }
      - { name: waste_cost_cents, type: integer, source: computed, default: null, description: "Total waste charge at case completion" }
      - { name: pick_exception_count, type: integer, source: system, default: 0, description: "Counts exception episodes: increments by 1 each time the case's pick list enters PICKING_EXCEPTION (a repeated short while already in PICKING_EXCEPTION does not increment)" }

  - name: PickList
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SurgicalCase.id; exactly one pick list per case" }
      - { name: card_id, type: string, source: system, description: "FK -> PreferenceCard.id; copied from the case's pinned card at release" }
      - { name: card_version_number, type: integer, source: system, description: "Copied from the case's pinned_card_version_number at release" }
      - { name: status, type: enum, source: system, default: GENERATED, description: "GENERATED | IN_PICKING | PICKING_EXCEPTION | STAGED | DISPATCHED | RETURNED | CLOSED | CANCELLED", constraints: "GENERATED | IN_PICKING | PICKING_EXCEPTION | STAGED | DISPATCHED | RETURNED | CLOSED | CANCELLED" }

  - name: PickListLine
    parent: null
    common_fields: true
    fields:
      - { name: pick_list_id, type: string, source: system, description: "FK -> PickList.id; owning pick list" }
      - { name: supply_item_id, type: string, source: system, description: "FK -> SupplyItem.id; originally planned item (snapshot from the card line)" }
      - { name: designation, type: enum, source: system, description: "OPEN | HOLD snapshot from the card line", constraints: "OPEN | HOLD" }
      - { name: qty_requested, type: integer, source: system, description: "Quantity snapshot from the pinned card line at release" }
      - { name: qty_picked, type: integer, source: system, default: 0, description: "Quantity actually pulled (from the planned item on pick, from the substitute on substitution)" }
      - { name: qty_returned_unopened, type: integer, source: system, default: 0, description: "Unopened quantity restocked at cart return" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Unit cost snapshot from the planned item at release; re-snapshotted from the substitute item on substitution" }
      - { name: pick_sequence, type: integer, source: system, description: "Copied from the card line for stable ordering" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | PICKED | SHORT | SUBSTITUTED", constraints: "PENDING | PICKED | SHORT | SUBSTITUTED" }
      - { name: substituted_item_id, type: string, source: system, default: null, description: "FK -> SupplyItem.id; set when status = SUBSTITUTED, null otherwise" }
      - { name: short_reason_code, type: string, source: input, default: null, description: "Free-form reason recorded at mark-short" }

  - name: UsageRecord
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SurgicalCase.id; owning case" }
      - { name: pick_list_line_id, type: string, source: system, description: "FK -> PickListLine.id; source pick line" }
      - { name: supply_item_id, type: string, source: system, description: "FK -> SupplyItem.id; the item actually consumed (substitute item when the line was substituted)" }
      - { name: qty_opened, type: integer, source: computed, description: "= qty_picked - qty_returned_unopened on the pick line at completion" }
      - { name: qty_used, type: integer, source: input, description: "Quantity clinically consumed, from the completion usage entry (0 when the line has no entry)" }
      - { name: qty_wasted, type: integer, source: computed, description: "= qty_opened - qty_used" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot from the pick list line at completion" }
      - { name: waste_charge_cents, type: integer, source: computed, description: "Per-line waste charge per calculations.waste_charge" }

  - name: CardAccuracyAudit
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SurgicalCase.id; the completed case under audit" }
      - { name: card_id, type: string, source: system, description: "FK -> PreferenceCard.id; the pinned card version being graded" }
      - { name: card_version_number, type: integer, source: system, description: "Pinned card version under audit" }
      - { name: matched_line_count, type: integer, source: computed, description: "Pinned card lines whose pick line was not substituted and whose qty_used equals qty_requested" }
      - { name: total_line_count, type: integer, source: computed, description: "Number of lines on the pinned card version at release" }
      - { name: line_match_pct, type: number, source: computed, description: "= matched_line_count / total_line_count x 100, 2dp round_half_up (nursing-compliance variant)" }
      - { name: spend_match_pct, type: number, source: computed, description: "= max(0, 1 - |actual_cost_cents - standard_cost_cents| / standard_cost_cents) x 100, 2dp round_half_up; 100 when standard and actual are both 0, 0 when standard is 0 and actual > 0 (standardization variant)" }
      - { name: waste_pct, type: number, source: computed, description: "= waste_cost_cents / standard_cost_cents x 100, 2dp round_half_up; 0 when standard_cost_cents is 0" }
      - { name: waste_flag, type: boolean, source: computed, description: "True iff waste_pct >= 20.0" }
      - { name: status, type: enum, source: system, default: GENERATED, description: "GENERATED | UNDER_REVIEW | DISPUTED | ACCEPTED", constraints: "GENERATED | UNDER_REVIEW | DISPUTED | ACCEPTED" }
      - { name: dispute_comment, type: string, source: input, default: null, description: "Latest surgeon dispute comment" }

  - name: ProductRequest
    parent: null
    common_fields: true
    fields:
      - { name: surgeon_id, type: string, source: system, description: "FK -> Surgeon.id; requester, taken from X-User-ID (entity-backed Surgeon role)" }
      - { name: proposed_item_name, type: string, source: input, description: "Name of the requested new supply item" }
      - { name: proposed_sku, type: string, source: input, description: "SKU the new item should receive on approval", constraints: "must not collide with an existing SupplyItem.sku" }
      - { name: estimated_unit_cost_cents, type: integer, source: input, description: "Requester's estimated unit cost", constraints: ">= 1" }
      - { name: rationale, type: string, source: input, description: "Clinical rationale, at least 10 characters", constraints: "length >= 10" }
      - { name: substitute_group, type: string, source: input, default: null, description: "Substitution group the approved item joins" }
      - { name: consignment_flag, type: boolean, source: input, default: false, description: "Whether the approved item is consignment" }
      - { name: replaces_item_id, type: string, source: input, default: null, description: "FK -> SupplyItem.id; optional existing item this request would standardize away" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED" }
      - { name: reviewing_officer_id, type: string, source: system, default: null, description: "Opaque X-User-ID of the ValueAnalysisOfficer who opened review" }
      - { name: endorser_ids, type: array, source: system, default: [], description: "Distinct opaque officer ids who endorsed" }
      - { name: endorsements_count, type: integer, source: system, default: 0, description: "= len(endorser_ids)" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Recorded on rejection" }
      - { name: created_item_id, type: string, source: system, default: null, description: "FK -> SupplyItem.id; item created on approval" }

  - name: ConsignmentCount
    parent: null
    common_fields: true
    fields:
      - { name: supply_item_id, type: string, source: input, description: "FK -> SupplyItem.id; item being counted (must have consignment_flag = true)" }
      - { name: counted_qty, type: integer, source: input, description: "Physical count observed", constraints: ">= 0" }
      - { name: system_qty_at_count, type: integer, source: system, description: "SupplyItem.on_hand_quantity snapshot at count creation" }
      - { name: variance_qty, type: integer, source: computed, description: "= counted_qty - system_qty_at_count" }
      - { name: variance_value_cents, type: integer, source: computed, description: "= variance_qty x supply_item.unit_cost_cents" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VERIFIED", constraints: "RECORDED | VERIFIED" }

  - name: ConsignmentCharge
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SurgicalCase.id; case that triggered billing capture" }
      - { name: usage_record_id, type: string, source: system, description: "FK -> UsageRecord.id; usage line that triggered this charge" }
      - { name: supply_item_id, type: string, source: system, description: "FK -> SupplyItem.id; consignment item billed" }
      - { name: qty_billed, type: integer, source: system, description: "= qty_opened of the usage record (consignment bills on open, not on use)" }
      - { name: unit_cost_cents, type: integer, source: system, description: "Snapshot from the usage record" }
      - { name: amount_cents, type: integer, source: computed, description: "= qty_billed x unit_cost_cents" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | CAPTURED | VOIDED", constraints: "PENDING | CAPTURED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Surgeon
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: POST /perioperative/surgeons/{id}/deactivate
        actor: SupplyChainAnalyst
        preconditions:
          - "Surgeon must be ACTIVE (ERR_INVALID_STATE via state precondition; deactivating twice is rejected)"
        side_effects:
          - "No cascade: existing cases/cards/requests are unaffected, but downstream guards (ERR_SURGEON_INACTIVE, ERR_REQUESTER_INACTIVE) begin rejecting new work"

  - entity: SupplyItem
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "system (cascade of ProductRequest approval when replaces_item_id is set)"
        actor: system
        preconditions:
          - "Item is ACTIVE"
        side_effects:
          - "New card lines naming this item are rejected (ERR_ITEM_NOT_ACTIVE)"
          - "Publish of a DRAFT card containing this item is rejected (ERR_ITEM_NOT_ACTIVE)"

  - entity: PreferenceCard
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /perioperative/preference-cards/{id}/publish
        actor: SupplyChainAnalyst
        preconditions:
          - "Card is DRAFT (ERR_CARD_NOT_DRAFT)"
          - "Card has at least one line (ERR_CARD_EMPTY)"
          - "Every line's supply item is ACTIVE (ERR_ITEM_NOT_ACTIVE)"
          - "Card's surgeon is ACTIVE (ERR_SURGEON_INACTIVE)"
          - "expected_card_version equals card.version (ERR_STALE_VERSION, OCC)"
        side_effects:
          - "Any other ACTIVE card with the same (surgeon_id, procedure_name) transitions ACTIVE -> SUPERSEDED (its version increments by 1)"
          - "Card.version increments by 1"
          - "SCHEDULED cases pinned to the superseded card keep their pin; their release-pick-list will now fail ERR_PINNED_CARD_NOT_ACTIVE until repinned"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer DRAFT version for the same surgeon+procedure publishes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: POST /perioperative/preference-cards/{id}/retire
        actor: SupplyChainAnalyst
        preconditions:
          - "No case pinned to this card is in SCHEDULED, PICKING_RELEASED, or IN_PROGRESS (ERR_CARD_IN_USE)"
        side_effects:
          - "Card.version increments by 1"
      - from: DRAFT
        to: RETIRED
        trigger: POST /perioperative/preference-cards/{id}/retire
        actor: SupplyChainAnalyst
        preconditions: []
        side_effects:
          - "Card.version increments by 1"

  - entity: SurgicalCase
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PICKING_RELEASED
        trigger: POST /perioperative/cases/{id}/release-pick-list
        actor: SupplyChainAnalyst
        preconditions:
          - "Case is SCHEDULED (ERR_CASE_NOT_SCHEDULED)"
          - "No pick list exists yet for the case (ERR_PICK_LIST_EXISTS)"
          - "Pinned card is still ACTIVE (ERR_PINNED_CARD_NOT_ACTIVE)"
        side_effects:
          - "Create PickList (GENERATED) + one PickListLine per pinned card line, snapshotting designation, qty_requested, unit_cost_cents, pick_sequence"
          - "case.standard_cost_cents = calculations.case_standard_cost over the snapshot lines"
      - from: PICKING_RELEASED
        to: IN_PROGRESS
        trigger: "system (the case's pick list transitions STAGED -> DISPATCHED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /perioperative/cases/{id}/complete
        actor: CirculatingNurse
        preconditions:
          - "Case is IN_PROGRESS and its pick list is RETURNED (ERR_CASE_NOT_COMPLETABLE)"
          - "Every usage_entries[].pick_list_line_id exists (ERR_NOT_FOUND)"
          - "Every usage_entries[].qty_used is >= 0 (ERR_INVALID_QUANTITY) and <= the line's qty_picked - qty_returned_unopened (ERR_USAGE_EXCEEDS_OPENED)"
          - "Every usage_entries[].pick_list_line_id belongs to this case's pick list (ERR_LINE_CASE_MISMATCH)"
          - "If consignment_budget_cents set: sum of resulting ConsignmentCharge.amount_cents <= consignment_budget_cents (ERR_CONSIGNMENT_BUDGET_EXCEEDED)"
        side_effects:
          - "Create one UsageRecord per PICKED/SUBSTITUTED pick line (qty_used from entries, 0 when absent)"
          - "Recompute case.actual_cost_cents and case.waste_cost_cents per calculations.case_actual_cost"
          - "Create one ConsignmentCharge (PENDING) per usage record whose item has consignment_flag = true and qty_opened > 0"
          - "Create CardAccuracyAudit (GENERATED) per calculations.audit_accuracy_scores; waste_flag from calculations.waste_flag_threshold"
          - "That audit's creation increments card.flagged_audit_count when waste_flag is true and recomputes card.rolling_line_match_pct"
          - "Pick list transitions RETURNED -> CLOSED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /perioperative/cases/{id}/cancel
        actor: SupplyChainAnalyst
        preconditions:
          - "Case is SCHEDULED or PICKING_RELEASED (ERR_CASE_NOT_CANCELLABLE)"
          - "If a pick list exists it must be in GENERATED, IN_PICKING, or PICKING_EXCEPTION (ERR_CASE_NOT_CANCELLABLE)"
        side_effects:
          - "If a pick list exists: restock every line's qty_picked back to its item's on_hand_quantity, then list -> CANCELLED"
      - from: PICKING_RELEASED
        to: CANCELLED
        trigger: POST /perioperative/cases/{id}/cancel
        actor: SupplyChainAnalyst
        preconditions:
          - "Pick list must be in GENERATED, IN_PICKING, or PICKING_EXCEPTION (ERR_CASE_NOT_CANCELLABLE)"
        side_effects:
          - "Restock every line's qty_picked to its item's on_hand_quantity; list -> CANCELLED"

  - entity: PickList
    initial_state: GENERATED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: GENERATED
        to: IN_PICKING
        trigger: POST /perioperative/pick-lists/{id}/begin-picking
        actor: CartTechnician
        preconditions:
          - "List is GENERATED (ERR_PICK_LIST_INVALID_STATE)"
        side_effects: []
      - from: IN_PICKING
        to: PICKING_EXCEPTION
        trigger: "system (a line of this list transitions PENDING -> SHORT)"
        actor: system
        preconditions: []
        side_effects:
          - "Case.pick_exception_count increments by 1 (caused by the line mutation)"
      - from: PICKING_EXCEPTION
        to: IN_PICKING
        trigger: "system (the list's last SHORT line transitions SHORT -> SUBSTITUTED)"
        actor: system
        preconditions:
          - "Fires only when zero SHORT lines remain after the substitution"
        side_effects: []
      - from: IN_PICKING
        to: STAGED
        trigger: "system (every line reaches PICKED or SUBSTITUTED)"
        actor: system
        preconditions:
          - "Fires when zero lines remain in PENDING or SHORT"
        side_effects: []
      - from: STAGED
        to: DISPATCHED
        trigger: POST /perioperative/pick-lists/{id}/dispatch
        actor: CartTechnician
        preconditions:
          - "List is STAGED (ERR_PICK_LIST_INVALID_STATE)"
        side_effects:
          - "Case transitions PICKING_RELEASED -> IN_PROGRESS"
      - from: DISPATCHED
        to: RETURNED
        trigger: POST /perioperative/pick-lists/{id}/return
        actor: CartTechnician
        preconditions:
          - "List is DISPATCHED (ERR_PICK_LIST_INVALID_STATE)"
          - "Every return_entries[].pick_list_line_id belongs to this list (ERR_LINE_CASE_MISMATCH)"
          - "0 <= qty_returned_unopened <= line.qty_picked (ERR_INVALID_QUANTITY)"
        side_effects:
          - "For each entry: line.qty_returned_unopened = qty_returned_unopened; the line's item on_hand_quantity += qty_returned_unopened (substitute item when SUBSTITUTED)"
      - from: RETURNED
        to: CLOSED
        trigger: "system (the case completes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: GENERATED
        to: CANCELLED
        trigger: "system (case cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Restock picked quantities"]
      - from: IN_PICKING
        to: CANCELLED
        trigger: "system (case cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Restock picked quantities"]
      - from: PICKING_EXCEPTION
        to: CANCELLED
        trigger: "system (case cancel cascade)"
        actor: system
        preconditions: []
        side_effects: ["Restock picked quantities"]

  - entity: PickListLine
    initial_state: PENDING
    terminal_states: [PICKED, SUBSTITUTED]
    transitions:
      - from: PENDING
        to: PICKED
        trigger: POST /perioperative/pick-list-lines/{id}/pick
        actor: CartTechnician
        preconditions:
          - "Line is PENDING (ERR_LINE_NOT_PENDING)"
          - "Parent list is IN_PICKING or PICKING_EXCEPTION (ERR_PICK_LIST_INVALID_STATE)"
          - "item.on_hand_quantity >= line.qty_requested (ERR_INSUFFICIENT_STOCK; equality is sufficient)"
        side_effects:
          - "qty_picked = qty_requested"
          - "item.on_hand_quantity -= qty_requested"
          - "If this was the last non-terminal line, list auto-transitions to STAGED"
      - from: PENDING
        to: SHORT
        trigger: POST /perioperative/pick-list-lines/{id}/mark-short
        actor: CartTechnician
        preconditions:
          - "Line is PENDING (ERR_LINE_NOT_PENDING)"
          - "Parent list is IN_PICKING or PICKING_EXCEPTION (ERR_PICK_LIST_INVALID_STATE)"
        side_effects:
          - "List transitions IN_PICKING -> PICKING_EXCEPTION (no-op if already PICKING_EXCEPTION); the case counter bump is owned by that list transition"
      - from: SHORT
        to: SUBSTITUTED
        trigger: POST /perioperative/pick-list-lines/{id}/substitute
        actor: CartTechnician
        preconditions:
          - "Line is SHORT (ERR_LINE_NOT_SHORT)"
          - "Parent list is IN_PICKING or PICKING_EXCEPTION (ERR_PICK_LIST_INVALID_STATE)"
          - "substitute_supply_item_id exists (ERR_NOT_FOUND), differs from the planned item (ERR_INVALID_REQUEST), is ACTIVE (ERR_ITEM_NOT_ACTIVE)"
          - "substitute.substitute_group is non-null and equals the planned item's substitute_group (ERR_SUBSTITUTE_GROUP_MISMATCH)"
          - "substitute.on_hand_quantity >= line.qty_requested (ERR_INSUFFICIENT_STOCK; equality is sufficient)"
          - "substitute.unit_cost_cents <= 1.25 x planned line's current unit_cost_cents unless override_price_threshold = true (ERR_SUBSTITUTE_PRICE_THRESHOLD; 1.25x exactly is allowed)"
        side_effects:
          - "qty_picked = qty_requested; unit_cost_cents re-snapshotted from substitute; substituted_item_id set"
          - "substitute.on_hand_quantity -= qty_requested"
          - "If no SHORT lines remain: list PICKING_EXCEPTION -> IN_PICKING; if additionally no PENDING lines remain: list -> STAGED"

  - entity: CardAccuracyAudit
    initial_state: GENERATED
    terminal_states: [ACCEPTED]
    transitions:
      - from: GENERATED
        to: ACCEPTED
        trigger: POST /perioperative/card-audits/{id}/accept
        actor: SupplyChainAnalyst
        preconditions:
          - "Audit is GENERATED or UNDER_REVIEW (ERR_AUDIT_NOT_ACTIONABLE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: POST /perioperative/card-audits/{id}/accept
        actor: SupplyChainAnalyst
        preconditions:
          - "Audit is GENERATED or UNDER_REVIEW (ERR_AUDIT_NOT_ACTIONABLE)"
        side_effects: []
      - from: GENERATED
        to: DISPUTED
        trigger: POST /perioperative/card-audits/{id}/dispute
        actor: Surgeon
        preconditions:
          - "Audit is GENERATED or UNDER_REVIEW (ERR_AUDIT_NOT_ACTIONABLE)"
          - "Acting surgeon (X-User-ID) owns the audited card (audit.card.surgeon_id == X-User-ID) (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "dispute_comment stored"
      - from: UNDER_REVIEW
        to: DISPUTED
        trigger: POST /perioperative/card-audits/{id}/dispute
        actor: Surgeon
        preconditions:
          - "Audit is GENERATED or UNDER_REVIEW (ERR_AUDIT_NOT_ACTIONABLE)"
          - "Acting surgeon owns the audited card (ERR_FORBIDDEN_FOR_ROLE)"
        side_effects:
          - "dispute_comment stored"
      - from: DISPUTED
        to: UNDER_REVIEW
        trigger: POST /perioperative/card-audits/{id}/reopen-review
        actor: SupplyChainAnalyst
        preconditions:
          - "Audit is DISPUTED (ERR_AUDIT_NOT_DISPUTED)"
        side_effects: []

  - entity: ProductRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /perioperative/product-requests/{id}/open-review
        actor: ValueAnalysisOfficer
        preconditions:
          - "Request is SUBMITTED (ERR_REQUEST_NOT_UNDER_REVIEW)"
        side_effects:
          - "reviewing_officer_id = acting officer's X-User-ID"
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: POST /perioperative/product-requests/{id}/endorse
        actor: ValueAnalysisOfficer
        preconditions:
          - "Request is UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
          - "Acting officer's X-User-ID not already in endorser_ids (ERR_DUPLICATE_ENDORSEMENT)"
        side_effects:
          - "endorser_ids += acting officer id; endorsements_count += 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /perioperative/product-requests/{id}/approve
        actor: ValueAnalysisOfficer
        preconditions:
          - "Request is UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
          - "endorsements_count >= 2 (ERR_QUORUM_NOT_MET)"
          - "Acting officer's X-User-ID != reviewing_officer_id (ERR_SOD_REVIEWER_CANNOT_APPROVE)"
          - "Requesting surgeon is still ACTIVE (ERR_REQUESTER_INACTIVE)"
        side_effects:
          - "Create SupplyItem (ACTIVE, on_hand 0) from proposed fields; created_item_id set"
          - "If replaces_item_id set: that SupplyItem transitions ACTIVE -> DISCONTINUED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /perioperative/product-requests/{id}/reject
        actor: ValueAnalysisOfficer
        preconditions:
          - "Request is UNDER_REVIEW (ERR_REQUEST_NOT_UNDER_REVIEW)"
        side_effects:
          - "rejection_reason stored"

  - entity: ConsignmentCount
    initial_state: RECORDED
    terminal_states: [VERIFIED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: POST /perioperative/consignment-counts/{id}/verify
        actor: MaterialsManager
        preconditions:
          - "Count is RECORDED (ERR_COUNT_NOT_RECORDED)"
        side_effects:
          - "variance_qty and variance_value_cents finalized"
          - "If variance_qty != 0: SupplyItem.on_hand_quantity += variance_qty (ledger sync)"

  - entity: ConsignmentCharge
    initial_state: PENDING
    terminal_states: [CAPTURED, VOIDED]
    transitions:
      - from: PENDING
        to: CAPTURED
        trigger: POST /perioperative/consignment-charges/{id}/capture
        actor: MaterialsManager
        preconditions:
          - "Charge is PENDING (ERR_CHARGE_INVALID_STATE)"
        side_effects: []
      - from: PENDING
        to: VOIDED
        trigger: POST /perioperative/consignment-charges/{id}/void
        actor: MaterialsManager
        preconditions:
          - "Charge is PENDING or CAPTURED (ERR_CHARGE_INVALID_STATE)"
        side_effects: []
      - from: CAPTURED
        to: VOIDED
        trigger: POST /perioperative/consignment-charges/{id}/void
        actor: MaterialsManager
        preconditions:
          - "Charge is PENDING or CAPTURED (ERR_CHARGE_INVALID_STATE)"
        side_effects:
          - "Compensates the capture: the sum of amount_cents over CAPTURED charges decreases by this charge's amount"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: card-publish-stale-version
    parent_entity: PreferenceCard
    write_endpoint: POST /perioperative/preference-cards/{id}/publish
    occ_field: expected_card_version
    description: |
      Publishing a DRAFT card whose version has advanced since the client last
      observed it (e.g., another writer added or deleted a line, each of which
      increments card.version) is rejected. The client must re-read the card and
      publish against the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: case-repin-stale-version
    parent_entity: SurgicalCase
    write_endpoint: POST /perioperative/cases/{id}/repin-card
    occ_field: expected_case_version
    description: |
      Re-pinning a case to a different card version is rejected when the case's
      version has advanced since the client last observed it (e.g., another
      writer already re-pinned the case). The client must re-read the case and
      retry against the current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: card_estimated_cost
    trigger: "preference-card line create or delete"
    algorithm: aggregation
    formula: |
      card.estimated_cost_cents = SUM over the card's current lines of
        (line.quantity x supply_item.unit_cost_cents)
      Integer arithmetic; recomputed in full after every line mutation.
    input_set: "all PreferenceCardLine rows of the card, any designation"
    precision: "integer cents, no rounding"

  - name: case_standard_cost
    trigger: "pick-list release (snapshot from pinned card version)"
    algorithm: aggregation
    formula: |
      case.standard_cost_cents = SUM over snapshot pick lines of
        (qty_requested x unit_cost_cents_at_release)
      This is the AS-PLANNED variant of case costing: it prices the pinned card
      exactly as written and never changes after release.
    input_set: "PickListLine rows created at release from the pinned card version"
    precision: "integer cents, no rounding"
    variants:
      - name: as_planned
        when: "computed once at release-pick-list"
        difference: "prices planned items at release-time costs; ignores substitutions, returns, and usage"

  - name: case_actual_cost
    trigger: "case completion (POST /perioperative/cases/{id}/complete)"
    algorithm: aggregation
    formula: |
      used_cost_cents   = SUM over usage records of (qty_used x unit_cost_cents)
      waste_cost_cents  = SUM over usage records of waste_charge_cents
                          (see calculations.waste_charge; ROUND PER LINE, THEN SUM)
      case.actual_cost_cents = used_cost_cents + waste_cost_cents
      case.waste_cost_cents  = waste_cost_cents
      ROUNDING ORDER (pinned): each line's waste_charge_cents is rounded
      individually (round_half_up to whole cents); the rounded line values are
      then summed. Summing unrounded line values and rounding once is FORBIDDEN.
    input_set: "UsageRecord rows of the case created at completion (one per PICKED/SUBSTITUTED pick line)"
    precision: "per-line round_half_up to integer cents, then integer sum"
    variants:
      - name: as_used
        when: "computed once at completion"
        difference: "prices the substitute item (not the planned item), excludes returned-unopened quantities, and adds waste charges; for identical case data it diverges from case_standard_cost whenever usage deviates from plan"

  - name: waste_charge
    trigger: "inside case_actual_cost, per usage record"
    algorithm: weighted_scoring
    formula: |
      qty_wasted = qty_opened - qty_used
      if qty_wasted == 0: waste_charge_cents = 0
      else:
        if supply_item.consignment_flag == true:  mult = 1.0   # consignment waste billed at cost
        elif designation == HOLD:                 mult = 1.5   # hold items opened unnecessarily carry a penalty
        else:                                     mult = 1.0   # OPEN designation
        waste_charge_cents = round_half_up(qty_wasted x unit_cost_cents x mult)  # per-line rounding
    input_set: "one UsageRecord (uses its qty_opened, qty_used, unit_cost_cents, the line's designation snapshot, the item's consignment_flag)"
    constants:
      HOLD_WASTE_MULTIPLIER: 1.5
      CONSIGNMENT_WASTE_MULTIPLIER: 1.0
      OPEN_WASTE_MULTIPLIER: 1.0
    precision: "round_half_up to integer cents, applied per line before any summation"

  - name: audit_accuracy_scores
    trigger: "case completion (CardAccuracyAudit creation)"
    algorithm: aggregation
    formula: |
      matched_line_count = count of pinned card lines whose resulting pick line
        has status PICKED (not SUBSTITUTED) and whose usage record qty_used == qty_requested
      total_line_count   = number of lines on the pinned card version at release
      line_match_pct     = round_half_up(matched_line_count / total_line_count x 100, 2)
      spend_match_pct    = round_half_up(max(0, 1 - ABS(actual_cost_cents - standard_cost_cents) / standard_cost_cents) x 100, 2)
                           (standard_cost_cents == 0: 100.0 when actual_cost_cents == 0 else 0.0)
      Two variants of card accuracy: line_match_pct is the nursing-compliance
      variant (count-based); spend_match_pct is the standardization variant
      (spend-based). For identical audit data they produce different scores
      whenever usage deviates from plan asymmetrically.
    input_set: "the pinned card's lines, the case's pick lines, and the case's usage records"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: line_match
        when: "nursing compliance reporting"
        difference: "count-based; insensitive to cost"
      - name: spend_weighted
        when: "standardization initiative reporting"
        difference: "cost-based; insensitive to which specific lines matched"

  - name: waste_flag_threshold
    trigger: "CardAccuracyAudit creation"
    algorithm: threshold
    formula: |
      waste_pct  = round_half_up(waste_cost_cents / standard_cost_cents x 100, 2)
                   (0.0 when standard_cost_cents == 0)
      waste_flag = (waste_pct >= 20.0)    # exactly 20.0 flags; 19.98 does not
    input_set: "case.waste_cost_cents and case.standard_cost_cents at completion"
    constants:
      WASTE_FLAG_THRESHOLD_PCT: 20.0
    precision: "2 decimal places, round_half_up; comparison applied to the rounded value"

  - name: consignment_count_variance
    trigger: "consignment count creation (snapshot) and verification (finalization)"
    algorithm: aggregation
    formula: |
      system_qty_at_count   = supply_item.on_hand_quantity at count creation
      variance_qty          = counted_qty - system_qty_at_count
      variance_value_cents  = variance_qty x supply_item.unit_cost_cents
      On verify: if variance_qty != 0, supply_item.on_hand_quantity += variance_qty
    input_set: "the counted SupplyItem (must have consignment_flag = true)"
    precision: "integer units and cents, no rounding"

  - name: consignment_charge_amount
    trigger: "usage record creation for a consignment item with qty_opened > 0"
    algorithm: aggregation
    formula: |
      qty_billed   = usage_record.qty_opened      # consignment bills on open, not on use
      amount_cents = qty_billed x usage_record.unit_cost_cents
    input_set: "UsageRecord rows whose item has consignment_flag = true and qty_opened > 0"
    precision: "integer cents, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role name valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is allowed for this endpoint; for entity-backed ownership rules (audit dispute), X-User-ID must match the owning Surgeon id"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enum values valid, integer ranges respected (quantity >= 1, qty_used >= 0, expected_duration_min >= 1), rationale length >= 10"
    error_id: ERR_INVALID_REQUEST / ERR_INVALID_QUANTITY
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path ids exist (left-to-right), then body-referenced ids exist (surgeon_id, card_id, supply_item_id, substitute_supply_item_id, usage/return entry line ids, replaces_item_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 5
    category: state
    check: "Target resource state permits the operation (card DRAFT, case SCHEDULED/IN_PROGRESS, list GENERATED/STAGED/DISPATCHED, line PENDING/SHORT, audit actionable, request under review, charge pending, count recorded, per-machine preconditions)"
    error_id: "ERR_CARD_NOT_DRAFT | ERR_CASE_NOT_SCHEDULED | ERR_CASE_NOT_CANCELLABLE | ERR_CASE_NOT_COMPLETABLE | ERR_PICK_LIST_INVALID_STATE | ERR_LINE_NOT_PENDING | ERR_LINE_NOT_SHORT | ERR_AUDIT_NOT_ACTIONABLE | ERR_AUDIT_NOT_DISPUTED | ERR_REQUEST_NOT_UNDER_REVIEW | ERR_CHARGE_INVALID_STATE | ERR_COUNT_NOT_RECORDED | ERR_PICK_LIST_EXISTS"
    http_status: 409
    applies_to: all action endpoints
  - priority: 6
    category: existence
    check: "OCC: expected_<parent>_version equals the parent's current version (checked after state, before business rules)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /perioperative/preference-cards/{id}/publish, POST /perioperative/cases/{id}/repin-card"
  - priority: 7
    category: business_safety
    check: "Clinical safety: substitute from equal non-null substitute_group and not the same item; qty_used <= qty_opened per usage entry; substitute item ACTIVE"
    error_id: "ERR_SUBSTITUTE_GROUP_MISMATCH | ERR_INVALID_REQUEST (same-item substitute) | ERR_USAGE_EXCEEDS_OPENED | ERR_ITEM_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /perioperative/pick-list-lines/{id}/substitute, POST /perioperative/cases/{id}/complete"
    note: "ERR_USAGE_EXCEEDS_OPENED uses http 422; ERR_INVALID_REQUEST uses 400"
  - priority: 8
    category: business_referential
    check: "Cross-entity coherence: card ACTIVE at case create/release; case surgeon == card surgeon; surgeon/requester ACTIVE; line belongs to this case's pick list; counted item is consignment; card line item ACTIVE; card not in use for retire"
    error_id: "ERR_PINNED_CARD_NOT_ACTIVE | ERR_CARD_SURGEON_MISMATCH | ERR_SURGEON_INACTIVE | ERR_REQUESTER_INACTIVE | ERR_LINE_CASE_MISMATCH | ERR_NOT_CONSIGNMENT_ITEM | ERR_ITEM_NOT_ACTIVE | ERR_CARD_IN_USE"
    http_status: 409
    applies_to: "case create/release, card publish/retire, line create, substitute, complete, count create, request approve"
    note: "within priority 8 on case create, evaluation order is: card ACTIVE, then surgeon match, then surgeon ACTIVE"
  - priority: 9
    category: business_temporal
    check: "Scheduling conflicts: room half-open overlap first, then surgeon turnover-buffer gap"
    error_id: "ERR_ROOM_DOUBLE_BOOKED | ERR_SURGEON_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "POST /perioperative/cases"
  - priority: 10
    category: business_constraint
    check: "Structural constraints: unique sku; no duplicate (card_id, supply_item_id) line; publish requires >= 1 line; endorsement uniqueness; quorum >= 2; approver != reviewing_officer_id; proposed_sku unique"
    error_id: "ERR_DUPLICATE_CARD_LINE | ERR_CARD_EMPTY | ERR_DUPLICATE_ENDORSEMENT | ERR_QUORUM_NOT_MET | ERR_SOD_REVIEWER_CANNOT_APPROVE | ERR_INVALID_REQUEST (duplicate sku)"
    http_status: 409
    applies_to: "line create, card publish, endorse/approve, item create, request create/approve"
    note: "ERR_SOD_REVIEWER_CANNOT_APPROVE uses http 403; ERR_INVALID_REQUEST (sku) uses 400"
  - priority: 11
    category: business_fiscal
    check: "Fiscal guards: substitution price <= 1.25x unless overridden; consignment charges sum within case budget"
    error_id: "ERR_SUBSTITUTE_PRICE_THRESHOLD | ERR_CONSIGNMENT_BUDGET_EXCEEDED"
    http_status: 402
    applies_to: "POST /perioperative/pick-list-lines/{id}/substitute, POST /perioperative/cases/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Surgeons ---
  - method: POST
    path: /perioperative/surgeons
    description: "Register a surgeon"
    roles: [SupplyChainAnalyst]
    code: 201
    input: [full_name, specialty]
    output: Surgeon
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: /perioperative/surgeons/{id}
    description: "Get a surgeon"
    roles: [Any]
    code: 200
    input: []
    output: Surgeon
    side_effects: []
  - method: POST
    path: /perioperative/surgeons/{id}/deactivate
    description: "Deactivate a surgeon (blocks new cards/cases/requests and pending approvals)"
    roles: [SupplyChainAnalyst]
    code: 200
    input: []
    output: Surgeon
    side_effects: ["status ACTIVE -> INACTIVE"]

  # --- Supply items ---
  - method: POST
    path: /perioperative/supply-items
    description: "Create a supply item"
    roles: [SupplyChainAnalyst]
    code: 201
    input: [sku, name, unit_cost_cents, "substitute_group?", "consignment_flag?", "initial_on_hand?"]
    output: SupplyItem
    side_effects: ["status = ACTIVE", "on_hand_quantity = initial_on_hand or 0", "ERR_INVALID_REQUEST if sku already exists"]
  - method: GET
    path: /perioperative/supply-items
    description: "List supply items, optional filters"
    roles: [Any]
    code: 200
    input: ["substitute_group?", "consignment_flag?", "status?", "limit?", "offset?"]
    output: "SupplyItem[]"
    side_effects: []
  - method: GET
    path: /perioperative/supply-items/{id}
    description: "Get a supply item"
    roles: [Any]
    code: 200
    input: []
    output: SupplyItem
    side_effects: []
  - method: POST
    path: /perioperative/supply-items/{id}/stock-adjustments
    description: "Adjust on-hand stock by a signed delta"
    roles: [MaterialsManager]
    code: 200
    input: [delta_qty, reason]
    output: SupplyItem
    side_effects: ["on_hand_quantity += delta_qty", "ERR_INVALID_QUANTITY if result would be < 0"]

  # --- Preference cards ---
  - method: POST
    path: /perioperative/preference-cards
    description: "Create a DRAFT preference card (next version_number for the surgeon+procedure pair)"
    roles: [SupplyChainAnalyst]
    code: 201
    input: [surgeon_id, procedure_name]
    output: PreferenceCard
    side_effects: ["status = DRAFT", "version_number = max(existing for pair) + 1 (1 when none)", "ERR_SURGEON_INACTIVE if surgeon INACTIVE"]
  - method: GET
    path: /perioperative/preference-cards
    description: "List preference cards, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["surgeon_id?", "procedure_name?", "status?", "limit?", "offset?"]
    output: "PreferenceCard[]"
    side_effects: []
  - method: GET
    path: /perioperative/preference-cards/{id}
    description: "Get a preference card"
    roles: [Any]
    code: 200
    input: []
    output: PreferenceCard
    side_effects: []
  - method: POST
    path: /perioperative/preference-cards/{id}/publish
    description: "Publish a DRAFT card (supersedes the currently ACTIVE version for the pair)"
    roles: [SupplyChainAnalyst]
    code: 200
    input: [expected_card_version]
    output: PreferenceCard
    side_effects: ["DRAFT -> ACTIVE", "prior ACTIVE sibling -> SUPERSEDED (its version +1)", "increments PreferenceCard.version by 1", "OCC per concurrency_rules[card-publish-stale-version]"]
  - method: POST
    path: /perioperative/preference-cards/{id}/retire
    description: "Retire a card (blocked while in-flight cases are pinned to it)"
    roles: [SupplyChainAnalyst]
    code: 200
    input: []
    output: PreferenceCard
    side_effects: ["-> RETIRED", "increments PreferenceCard.version by 1"]

  # --- Preference card lines ---
  - method: POST
    path: /perioperative/preference-card-lines
    description: "Add a line to a DRAFT card"
    roles: [SupplyChainAnalyst]
    code: 201
    input: [card_id, supply_item_id, quantity, designation, "pick_sequence?", "notes?"]
    output: PreferenceCardLine
    side_effects: ["card.estimated_cost_cents recomputed", "increments card.version by 1", "ERR_CARD_NOT_DRAFT unless card DRAFT", "ERR_DUPLICATE_CARD_LINE on duplicate item"]
  - method: GET
    path: /perioperative/preference-card-lines
    description: "List card lines, optional filters; sorted by pick_sequence ASC"
    roles: [Any]
    code: 200
    input: ["card_id?", "supply_item_id?", "limit?", "offset?"]
    output: "PreferenceCardLine[]"
    side_effects: []
  - method: GET
    path: /perioperative/preference-card-lines/{id}
    description: "Get a card line"
    roles: [Any]
    code: 200
    input: []
    output: PreferenceCardLine
    side_effects: []
  - method: DELETE
    path: /perioperative/preference-card-lines/{id}
    description: "Remove a line from a DRAFT card"
    roles: [SupplyChainAnalyst]
    code: 204
    input: []
    output: null
    side_effects: ["card.estimated_cost_cents recomputed", "increments card.version by 1", "ERR_CARD_NOT_DRAFT unless card DRAFT"]

  # --- Surgical cases ---
  - method: POST
    path: /perioperative/cases
    description: "Schedule a case pinned to an ACTIVE card version"
    roles: [SupplyChainAnalyst]
    code: 201
    input: [surgeon_id, card_id, scheduled_start, expected_duration_min, room, "consignment_budget_cents?"]
    output: SurgicalCase
    side_effects:
      - "status = SCHEDULED; pinned_card_version_number = card.version_number; procedure_name copied"
      - "ERR_PINNED_CARD_NOT_ACTIVE unless card ACTIVE; ERR_CARD_SURGEON_MISMATCH; ERR_SURGEON_INACTIVE"
      - "ERR_ROOM_DOUBLE_BOOKED on room overlap (half-open); ERR_SURGEON_SCHEDULE_CONFLICT on < 30 min surgeon gap"
  - method: GET
    path: /perioperative/cases
    description: "List cases, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["surgeon_id?", "card_id?", "status?", "room?", "limit?", "offset?"]
    output: "SurgicalCase[]"
    side_effects: []
  - method: GET
    path: /perioperative/cases/{id}
    description: "Get a case"
    roles: [Any]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: []
  - method: POST
    path: /perioperative/cases/{id}/release-pick-list
    description: "Generate the pick list from the pinned card version"
    roles: [SupplyChainAnalyst]
    code: 201
    input: []
    output: PickList
    side_effects: ["create PickList + snapshot lines", "case SCHEDULED -> PICKING_RELEASED", "case.standard_cost_cents computed"]
  - method: POST
    path: /perioperative/cases/{id}/repin-card
    description: "Re-pin a SCHEDULED case to a different ACTIVE card version (OCC-guarded)"
    roles: [SupplyChainAnalyst]
    code: 200
    input: [card_id, expected_case_version]
    output: SurgicalCase
    side_effects: ["pinned card/version/procedure updated", "increments SurgicalCase.version by 1", "OCC per concurrency_rules[case-repin-stale-version]", "new card must be ACTIVE, same surgeon, and same procedure_name as the case's surgeon (ERR_PINNED_CARD_NOT_ACTIVE / ERR_CARD_SURGEON_MISMATCH)"]
  - method: POST
    path: /perioperative/cases/{id}/cancel
    description: "Cancel a case before dispatch; restocks any picked quantities"
    roles: [SupplyChainAnalyst]
    code: 200
    input: []
    output: SurgicalCase
    side_effects: ["case -> CANCELLED", "pick list -> CANCELLED with restock of qty_picked"]
  - method: POST
    path: /perioperative/cases/{id}/complete
    description: "Record usage and complete the case; generates usage records, consignment charges, and the card accuracy audit atomically"
    roles: [CirculatingNurse]
    code: 200
    input: [usage_entries]
    output: SurgicalCase
    side_effects:
      - "create UsageRecords (one per PICKED/SUBSTITUTED line)"
      - "compute actual_cost_cents / waste_cost_cents"
      - "create ConsignmentCharges (PENDING) for consignment items"
      - "create CardAccuracyAudit (GENERATED); update card.flagged_audit_count and rolling_line_match_pct"
      - "case IN_PROGRESS -> COMPLETED; pick list RETURNED -> CLOSED"

  # --- Pick lists ---
  - method: GET
    path: /perioperative/pick-lists
    description: "List pick lists, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["case_id?", "card_id?", "status?", "limit?", "offset?"]
    output: "PickList[]"
    side_effects: []
  - method: GET
    path: /perioperative/pick-lists/{id}
    description: "Get a pick list"
    roles: [Any]
    code: 200
    input: []
    output: PickList
    side_effects: []
  - method: POST
    path: /perioperative/pick-lists/{id}/begin-picking
    description: "Start picking"
    roles: [CartTechnician]
    code: 200
    input: []
    output: PickList
    side_effects: ["GENERATED -> IN_PICKING"]
  - method: POST
    path: /perioperative/pick-lists/{id}/dispatch
    description: "Dispatch a fully-staged case cart"
    roles: [CartTechnician]
    code: 200
    input: []
    output: PickList
    side_effects: ["STAGED -> DISPATCHED", "case PICKING_RELEASED -> IN_PROGRESS"]
  - method: POST
    path: /perioperative/pick-lists/{id}/return
    description: "Return the cart; records unopened quantities and restocks them"
    roles: [CartTechnician]
    code: 200
    input: [return_entries]
    output: PickList
    side_effects: ["DISPATCHED -> RETURNED", "per entry: line.qty_returned_unopened set; item.on_hand_quantity += qty_returned_unopened"]
  - method: GET
    path: /perioperative/pick-list-lines
    description: "List pick list lines, optional filters; sorted by pick_sequence ASC"
    roles: [Any]
    code: 200
    input: ["pick_list_id?", "supply_item_id?", "substituted_item_id?", "status?", "limit?", "offset?"]
    output: "PickListLine[]"
    side_effects: []
  - method: GET
    path: /perioperative/pick-list-lines/{id}
    description: "Get a pick list line"
    roles: [Any]
    code: 200
    input: []
    output: PickListLine
    side_effects: []
  - method: POST
    path: /perioperative/pick-list-lines/{id}/pick
    description: "Pick the full requested quantity of the planned item"
    roles: [CartTechnician]
    code: 200
    input: []
    output: PickListLine
    side_effects: ["PENDING -> PICKED", "qty_picked = qty_requested", "item.on_hand_quantity -= qty_requested", "auto-stage list when last line resolves"]
  - method: POST
    path: /perioperative/pick-list-lines/{id}/mark-short
    description: "Flag a line as unavailable at the shelf"
    roles: [CartTechnician]
    code: 200
    input: [reason_code]
    output: PickListLine
    side_effects: ["PENDING -> SHORT", "list IN_PICKING -> PICKING_EXCEPTION, whose transition increments case.pick_exception_count by 1"]
  - method: POST
    path: /perioperative/pick-list-lines/{id}/substitute
    description: "Resolve a SHORT line with an in-group substitute item"
    roles: [CartTechnician]
    code: 200
    input: [substitute_supply_item_id, "override_price_threshold?"]
    output: PickListLine
    side_effects: ["SHORT -> SUBSTITUTED", "qty_picked = qty_requested from substitute stock", "unit_cost_cents re-snapshotted", "list PICKING_EXCEPTION -> IN_PICKING when no SHORT remain, then auto-STAGE when no PENDING remain"]

  # --- Usage records (created via case completion) ---
  - method: GET
    path: /perioperative/usage-records
    description: "List usage records, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["case_id?", "pick_list_line_id?", "supply_item_id?", "limit?", "offset?"]
    output: "UsageRecord[]"
    side_effects: []
  - method: GET
    path: /perioperative/usage-records/{id}
    description: "Get a usage record"
    roles: [Any]
    code: 200
    input: []
    output: UsageRecord
    side_effects: []

  # --- Card accuracy audits ---
  - method: GET
    path: /perioperative/card-audits
    description: "List card accuracy audits, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["case_id?", "card_id?", "status?", "limit?", "offset?"]
    output: "CardAccuracyAudit[]"
    side_effects: []
  - method: GET
    path: /perioperative/card-audits/{id}
    description: "Get a card accuracy audit"
    roles: [Any]
    code: 200
    input: []
    output: CardAccuracyAudit
    side_effects: []
  - method: POST
    path: /perioperative/card-audits/{id}/accept
    description: "Accept an audit (from GENERATED or UNDER_REVIEW)"
    roles: [SupplyChainAnalyst]
    code: 200
    input: []
    output: CardAccuracyAudit
    side_effects: ["-> ACCEPTED"]
  - method: POST
    path: /perioperative/card-audits/{id}/dispute
    description: "Dispute an audit; only the surgeon who owns the audited card may dispute"
    roles: [Surgeon]
    code: 200
    input: ["comment?"]
    output: CardAccuracyAudit
    side_effects: ["GENERATED|UNDER_REVIEW -> DISPUTED", "dispute_comment stored"]
  - method: POST
    path: /perioperative/card-audits/{id}/reopen-review
    description: "Re-open a disputed audit for review"
    roles: [SupplyChainAnalyst]
    code: 200
    input: []
    output: CardAccuracyAudit
    side_effects: ["DISPUTED -> UNDER_REVIEW"]

  # --- Product requests (value analysis) ---
  - method: POST
    path: /perioperative/product-requests
    description: "Surgeon requests a new supply item"
    roles: [Surgeon]
    code: 201
    input: [proposed_item_name, proposed_sku, estimated_unit_cost_cents, rationale, "substitute_group?", "consignment_flag?", "replaces_item_id?"]
    output: ProductRequest
    side_effects: ["status = SUBMITTED", "surgeon_id = X-User-ID", "ERR_SURGEON_INACTIVE if the acting surgeon is INACTIVE", "ERR_INVALID_REQUEST on duplicate proposed_sku"]
  - method: GET
    path: /perioperative/product-requests
    description: "List product requests, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["surgeon_id?", "status?", "replaces_item_id?", "created_item_id?", "limit?", "offset?"]
    output: "ProductRequest[]"
    side_effects: []
  - method: GET
    path: /perioperative/product-requests/{id}
    description: "Get a product request"
    roles: [Any]
    code: 200
    input: []
    output: ProductRequest
    side_effects: []
  - method: POST
    path: /perioperative/product-requests/{id}/open-review
    description: "Open value-analysis review"
    roles: [ValueAnalysisOfficer]
    code: 200
    input: []
    output: ProductRequest
    side_effects: ["SUBMITTED -> UNDER_REVIEW", "reviewing_officer_id = X-User-ID"]
  - method: POST
    path: /perioperative/product-requests/{id}/endorse
    description: "Endorse a request under review (one endorsement per officer)"
    roles: [ValueAnalysisOfficer]
    code: 200
    input: []
    output: ProductRequest
    side_effects: ["endorser_ids += X-User-ID", "endorsements_count += 1"]
  - method: POST
    path: /perioperative/product-requests/{id}/approve
    description: "Approve when quorum (>= 2 endorsements) is met; approver must differ from the reviewing officer"
    roles: [ValueAnalysisOfficer]
    code: 200
    input: []
    output: ProductRequest
    side_effects: ["-> APPROVED", "create SupplyItem from proposed fields", "replaces_item (if set) -> DISCONTINUED"]
  - method: POST
    path: /perioperative/product-requests/{id}/reject
    description: "Reject a request under review"
    roles: [ValueAnalysisOfficer]
    code: 200
    input: [rejection_reason]
    output: ProductRequest
    side_effects: ["-> REJECTED"]

  # --- Consignment counts ---
  - method: POST
    path: /perioperative/consignment-counts
    description: "Record a physical consignment count"
    roles: [MaterialsManager]
    code: 201
    input: [supply_item_id, counted_qty]
    output: ConsignmentCount
    side_effects: ["status = RECORDED", "system_qty_at_count snapshot", "variance_qty / variance_value_cents computed", "ERR_NOT_CONSIGNMENT_ITEM unless item consignment"]
  - method: GET
    path: /perioperative/consignment-counts
    description: "List consignment counts, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["supply_item_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentCount[]"
    side_effects: []
  - method: GET
    path: /perioperative/consignment-counts/{id}
    description: "Get a consignment count"
    roles: [Any]
    code: 200
    input: []
    output: ConsignmentCount
    side_effects: []
  - method: POST
    path: /perioperative/consignment-counts/{id}/verify
    description: "Verify a count; applies the stock adjustment when variance is non-zero"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: ConsignmentCount
    side_effects: ["RECORDED -> VERIFIED", "SupplyItem.on_hand_quantity += variance_qty when non-zero"]

  # --- Consignment charges (created via case completion) ---
  - method: GET
    path: /perioperative/consignment-charges
    description: "List consignment charges, optional filters; sorted by created_at ASC"
    roles: [Any]
    code: 200
    input: ["case_id?", "supply_item_id?", "usage_record_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentCharge[]"
    side_effects: []
  - method: GET
    path: /perioperative/consignment-charges/{id}
    description: "Get a consignment charge"
    roles: [Any]
    code: 200
    input: []
    output: ConsignmentCharge
    side_effects: []
  - method: POST
    path: /perioperative/consignment-charges/{id}/capture
    description: "Capture (bill) a pending consignment charge"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: ConsignmentCharge
    side_effects: ["PENDING -> CAPTURED"]
  - method: POST
    path: /perioperative/consignment-charges/{id}/void
    description: "Void a pending or captured charge (compensation)"
    roles: [MaterialsManager]
    code: 200
    input: []
    output: ConsignmentCharge
    side_effects: ["PENDING|CAPTURED -> VOIDED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not allowed for endpoint, or entity-backed ownership check failed (audit dispute by non-owning surgeon)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum, duplicate sku, same-item substitution, rationale too short" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "quantity < 1, qty_used < 0, counted_qty < 0, delta_qty result < 0, qty_returned_unopened outside [0, qty_picked]" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal the parent's current version (OCC)" }
  - { id: ERR_CARD_NOT_DRAFT, http: 409, condition: "Line add/delete or publish attempted on a non-DRAFT card" }
  - { id: ERR_CARD_EMPTY, http: 409, condition: "Publish attempted on a card with zero lines" }
  - { id: ERR_ITEM_NOT_ACTIVE, http: 409, condition: "Referenced item is DISCONTINUED (line create, publish check, substitute)" }
  - { id: ERR_CARD_IN_USE, http: 409, condition: "Retire attempted while a SCHEDULED/PICKING_RELEASED/IN_PROGRESS case is pinned to the card" }
  - { id: ERR_SURGEON_INACTIVE, http: 409, condition: "Surgeon is INACTIVE (card create/publish, case create, product-request create)" }
  - { id: ERR_CARD_SURGEON_MISMATCH, http: 409, condition: "Case surgeon differs from the pinned card's surgeon (case create, repin)" }
  - { id: ERR_PINNED_CARD_NOT_ACTIVE, http: 409, condition: "Pinned/target card is not ACTIVE (case create, release, repin)" }
  - { id: ERR_PICK_LIST_EXISTS, http: 409, condition: "Case already has a pick list" }
  - { id: ERR_CASE_NOT_SCHEDULED, http: 409, condition: "release-pick-list or repin-card attempted on a non-SCHEDULED case" }
  - { id: ERR_CASE_NOT_CANCELLABLE, http: 409, condition: "Cancel attempted in an non-cancellable state (dispatched/returned/completed/already cancelled)" }
  - { id: ERR_CASE_NOT_COMPLETABLE, http: 409, condition: "Complete attempted when case is not IN_PROGRESS or pick list is not RETURNED" }
  - { id: ERR_PICK_LIST_INVALID_STATE, http: 409, condition: "begin-picking/dispatch/return/pick/mark-short/substitute attempted in an incompatible list state" }
  - { id: ERR_LINE_NOT_PENDING, http: 409, condition: "pick or mark-short attempted on a non-PENDING line" }
  - { id: ERR_LINE_NOT_SHORT, http: 409, condition: "substitute attempted on a non-SHORT line" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "on_hand_quantity < qty_requested for the item being picked (planned or substitute); equality is sufficient" }
  - { id: ERR_SUBSTITUTE_GROUP_MISMATCH, http: 409, condition: "Substitute's substitute_group is null or differs from the planned item's group" }
  - { id: ERR_SUBSTITUTE_PRICE_THRESHOLD, http: 402, condition: "Substitute unit cost > 1.25x the planned line's unit cost without override_price_threshold = true" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Same room has a non-CANCELLED case whose [start, start+duration) interval intersects the new case's (half-open; touching endpoints allowed)" }
  - { id: ERR_SURGEON_SCHEDULE_CONFLICT, http: 409, condition: "Same surgeon has a non-CANCELLED case whose interval ends less than 30 minutes before the new start or starts less than 30 minutes after the new end (mandatory gap; exactly 30 minutes is allowed)" }
  - { id: ERR_DUPLICATE_CARD_LINE, http: 409, condition: "A line for the same (card_id, supply_item_id) already exists" }
  - { id: ERR_USAGE_EXCEEDS_OPENED, http: 422, condition: "usage entry qty_used > line's qty_picked - qty_returned_unopened" }
  - { id: ERR_LINE_CASE_MISMATCH, http: 409, condition: "usage/return entry references a pick line that does not belong to this case/list" }
  - { id: ERR_CONSIGNMENT_BUDGET_EXCEEDED, http: 402, condition: "Sum of resulting consignment charges exceeds the case's consignment_budget_cents" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "Approve attempted with endorsements_count < 2" }
  - { id: ERR_SOD_REVIEWER_CANNOT_APPROVE, http: 403, condition: "Approving officer is the same X-User-ID as reviewing_officer_id" }
  - { id: ERR_DUPLICATE_ENDORSEMENT, http: 409, condition: "Officer already in endorser_ids" }
  - { id: ERR_REQUEST_NOT_UNDER_REVIEW, http: 409, condition: "open-review/endorse/approve/reject attempted in an incompatible request state" }
  - { id: ERR_REQUESTER_INACTIVE, http: 409, condition: "Requesting surgeon is INACTIVE at approval time" }
  - { id: ERR_AUDIT_NOT_ACTIONABLE, http: 409, condition: "accept/dispute attempted on an audit not in GENERATED or UNDER_REVIEW" }
  - { id: ERR_AUDIT_NOT_DISPUTED, http: 409, condition: "reopen-review attempted on an audit not in DISPUTED" }
  - { id: ERR_NOT_CONSIGNMENT_ITEM, http: 409, condition: "Consignment count attempted on an item with consignment_flag = false" }
  - { id: ERR_COUNT_NOT_RECORDED, http: 409, condition: "Verify attempted on a count not in RECORDED" }
  - { id: ERR_CHARGE_INVALID_STATE, http: 409, condition: "capture attempted on non-PENDING charge, or void attempted on a VOIDED charge" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Surgeon
    description: "Operating surgeon; requests new products, disputes audits of own cards"
    identity: "entity_backed:Surgeon"
    exclusive_operations:
      - "POST /perioperative/product-requests — request new item (surgeon_id := X-User-ID)"
      - "POST /perioperative/card-audits/{id}/dispute — dispute audits of own cards only"
    shared_operations: ["all GET endpoints via Any"]
  - name: SupplyChainAnalyst
    description: "OR supply chain analyst; owns items, cards, cases, audit disposition"
    identity: "opaque"
    exclusive_operations:
      - "POST /perioperative/surgeons; POST /perioperative/surgeons/{id}/deactivate"
      - "POST /perioperative/supply-items"
      - "POST /perioperative/preference-cards; publish; retire"
      - "POST /perioperative/preference-card-lines; DELETE /perioperative/preference-card-lines/{id}"
      - "POST /perioperative/cases; release-pick-list; repin-card; cancel"
      - "POST /perioperative/card-audits/{id}/accept; reopen-review"
    shared_operations: ["all GET endpoints via Any"]
  - name: CartTechnician
    description: "Case-cart technician; picks, shorts, substitutes, dispatches, returns"
    identity: "opaque"
    exclusive_operations:
      - "POST /perioperative/pick-lists/{id}/begin-picking; dispatch; return"
      - "POST /perioperative/pick-list-lines/{id}/pick; mark-short; substitute"
    shared_operations: ["all GET endpoints via Any"]
  - name: CirculatingNurse
    description: "Intra-op nurse; records usage and completes cases"
    identity: "opaque"
    exclusive_operations:
      - "POST /perioperative/cases/{id}/complete"
    shared_operations: ["all GET endpoints via Any"]
  - name: ValueAnalysisOfficer
    description: "Value-analysis committee officer; reviews, endorses, approves/rejects product requests (segregation of duties: reviewer cannot approve)"
    identity: "opaque"
    exclusive_operations:
      - "POST /perioperative/product-requests/{id}/open-review; endorse; approve; reject"
    shared_operations: ["all GET endpoints via Any"]
  - name: MaterialsManager
    description: "Materials manager; stock adjustments, consignment counts, billing capture"
    identity: "opaque"
    exclusive_operations:
      - "POST /perioperative/supply-items/{id}/stock-adjustments"
      - "POST /perioperative/consignment-counts; verify"
      - "POST /perioperative/consignment-charges/{id}/capture; void"
    shared_operations: ["all GET endpoints via Any"]
  - name: Any
    description: "Shared read role — every authenticated role may call GET endpoints"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
