          - state_machines.TagLot.ACTIVE_to_RECALLED
          - state_machines.DeviceSupplier.APPROVED_to_SUSPENDED
          - calculations.supplier_conformance_score
          - entities.DeviceSupplier.fields.retired_returned_count
        distinguishing_aspect: |
          Trigger POST /tags/{id}/retire drives a different five-node chain from a different entity:
          the device retires, which moves the lot counters, which re-derives the supplier's retention
          rate to 0.0000 and its score to 68.00, which crosses the 70.00 threshold into SUSPENDED,
          which recalls the supplier's remaining lots - none of which the receive cascade touches.
