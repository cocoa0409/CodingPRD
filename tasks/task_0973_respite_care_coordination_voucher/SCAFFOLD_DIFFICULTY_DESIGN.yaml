          assert:
            - "Voucher.${vch}.status == EXPIRED"
            - "error_id == ERR_VOUCHER_NOT_ISSUABLE"
            - "Booking list filtered by voucher_id ${vch} is empty"

      - name: checkin_rejected_when_booking_unconfirmed
        grounds:
          - state_machines.Booking.CONFIRMED_to_IN_SERVICE
          - "validations[priority=28]"
        distinguishing_aspect: |
          Entity pair VisitRecord -> Booking (different pair than Booking ->
          Voucher): EVV check-in against a booking still PENDING_CONFIRMATION is
          rejected with ERR_BOOKING_NOT_CONFIRMED even though the clock sits
          inside the allowed check-in window.
        test_recipe:
          setup:
            - "Caregiver ACTIVE; provider ACTIVE with window; voucher 10.00h; booking 2026-05-06 10:00-12:00 created but NOT confirmed; clock at 2026-05-06T10:00:00Z (inside [start-15m, end])"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T20:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 10 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T10:00:00Z" }, as: FunderAdmin }
          trigger:
            - { call: "POST /respite/bookings/${bk}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_BOOKING_NOT_CONFIRMED"
            - "Booking.${bk}.status == PENDING_CONFIRMATION"
            - "GET /respite/bookings/${bk}/visit-records returns an empty array"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_window_half_open_adjacency
        grounds:
          - "validations[priority=13]"
          - entities.AvailabilityWindow.fields.end_at
        distinguishing_aspect: |
          Interval semantics = half-open adjacency on the AvailabilityWindow
          resource: a window starting exactly at the previous window's end
          ([12:00,16:00) after [08:00,12:00)) is legal, while a straddling
          window ([11:00,13:00)) is rejected with ERR_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Provider ACTIVE; one window 2026-05-04 08:00-12:00 already published"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T08:00:00Z", end_at: "2026-05-04T12:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win1: $.data.id } }
          trigger:
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T12:00:00Z", end_at: "2026-05-04T16:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { win2: $.data.id } }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T11:00:00Z", end_at: "2026-05-04T13:00:00Z", capacity: 1 }, as: Provider, as_user_id: "${prov}", captures: { err: $.data.error_id } }
          assert:
            - "AvailabilityWindow.${win2}.status == OPEN"
            - "error_id == ERR_WINDOW_OVERLAP"

      - name: caregiver_booking_buffer_thirty_minutes
        grounds:
          - "validations[priority=15]"
          - entities.Booking.fields.start_at
        distinguishing_aspect: |
          Interval semantics = buffer-augmented exclusion on a different
          resource (the Caregiver's schedule, not the provider's window): a
          booking starting exactly 30 minutes after the previous booking ends is
          legal (buffer inclusive), while one leaving only a 15-minute gap is
          rejected with ERR_CAREGIVER_DOUBLE_BOOKED despite ample window capacity.
        test_recipe:
          setup:
            - "Caregiver ACTIVE; provider ACTIVE with window 2026-05-06 08:00-20:00 capacity 3; voucher 20.00h; booking1 10:00-12:00 created"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T20:00:00Z", capacity: 3 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T10:00:00Z", end_at: "2026-05-06T12:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk1: $.data.id } }
          trigger:
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T12:30:00Z", end_at: "2026-05-06T14:30:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk2: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-06T12:15:00Z", end_at: "2026-05-06T14:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { err: $.data.error_id } }
          assert:
            - "Booking.${bk2}.status == PENDING_CONFIRMATION"
            - "error_id == ERR_CAREGIVER_DOUBLE_BOOKED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: allocation_hours_identity_issue_then_revoke
        grounds:
          - entities.Allocation.fields.granted_hours
          - state_machines.Voucher.ISSUED_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity = allocation hours: the forward action (voucher
          issue 20.00h: available 80->60, reserved 0->20) paired with its
          compensating action (coordinator revoke: reserved 20->0, revoked
          0->20) leaves granted_hours == available + reserved + consumed +
          expired + revoked == 80.00 at every step with zero drift.
        test_recipe:
          setup:
            - "Caregiver ACTIVE with Q2 allocation granted 80.00; voucher of 20.00h ISSUED"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "GET /respite/allocations/${alloc}", as: Coordinator, captures: { avail_mid: $.data.available_hours, res_mid: $.data.reserved_hours } }
          trigger:
            - { call: "POST /respite/vouchers/${vch}/revoke", payload: { reason: "plan change" }, as: Coordinator }
            - { call: "GET /respite/allocations/${alloc}", as: Coordinator, captures: { granted: $.data.granted_hours, avail: $.data.available_hours, res: $.data.reserved_hours, cons: $.data.consumed_hours, exp: $.data.expired_hours, rev: $.data.revoked_hours } }
            - { call: "GET /respite/vouchers/${vch}", as: Coordinator, captures: { v_status: $.data.status, v_forfeit: $.data.forfeited_hours } }
          assert:
            - "mid-state after issue: available_hours == 60.00 and reserved_hours == 20.00"
            - "Allocation.${alloc}.granted_hours == 80.00"
            - "Allocation.${alloc}.available_hours == 60.00"
            - "Allocation.${alloc}.reserved_hours == 0.00"
            - "Allocation.${alloc}.consumed_hours == 0.00"
            - "Allocation.${alloc}.expired_hours == 0.00"
            - "Allocation.${alloc}.revoked_hours == 20.00"
            - "granted_hours == available_hours + reserved_hours + consumed_hours + expired_hours + revoked_hours == 80.00"
            - "Voucher.${vch}.status == REVOKED and Voucher.${vch}.forfeited_hours == 20.00"

      - name: budget_cents_identity_verify_swap_then_deny
        grounds:
          - entities.Program.fields.unencumbered_cents
          - state_machines.VisitRecord.SUBMITTED_to_VERIFIED
          - state_machines.Claim.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          Conserved quantity = budget cents (different quantity than allocation
          hours): the verify-time swap (RELEASE provisional 60000 + ENCUMBER
          actual 7500) paired with its compensating denial (RELEASE 7500)
          restores unencumbered_cents to exactly total_budget_cents; the
          identity total == unencumbered + encumbered + settled holds with zero
          drift.
        test_recipe:
          setup:
            - "Monday-evening 2h service verified: voucher provisional 60000 released, claim DRAFT 7500 encumbered; claim submitted"
          setup_api_calls:
            - { call: "POST /respite/programs", payload: { name: "Respite FY26", fiscal_year_start: "2026-01-01", total_budget_cents: 50000000, quarterly_cap_hours: 80, annual_cap_hours: 320, standard_rate_cents_per_hour: 3000, emergency_reserve_hours: 200 }, as: FunderAdmin, captures: { prog: $.data.id } }
            - { call: "POST /respite/caregivers", payload: { full_name: "Ann Care", email: "ann@x.com", care_recipient_name: "Bob Care", care_recipient_condition: "dementia" }, as: Anonymous, captures: { cg: $.data.id } }
            - { call: "POST /respite/caregivers/${cg}/eligibility-applications", payload: { need_score: 8 }, as: Caregiver, as_user_id: "${cg}", captures: { app: $.data.id } }
            - { call: "POST /respite/eligibility-applications/${app}/review-decisions", payload: { action: "APPROVE" }, as: Coordinator }
            - { call: "GET /respite/caregivers/${cg}/allocations", as: Coordinator, captures: { alloc: "$.data[0].id" } }
            - { call: "POST /respite/providers", payload: { name: "Prov A", credential_level: "STANDARD", service_zip: "94110" }, as: Anonymous, captures: { prov: $.data.id } }
            - { call: "POST /respite/providers/${prov}/status-transitions", payload: { target_status: "ACTIVE" }, as: Coordinator }
            - { call: "POST /respite/providers/${prov}/availability-windows", payload: { start_at: "2026-05-04T00:00:00Z", end_at: "2026-05-15T00:00:00Z", capacity: 2 }, as: Provider, as_user_id: "${prov}", captures: { win: $.data.id } }
            - { call: "POST /respite/vouchers", payload: { allocation_id: "${alloc}", caregiver_id: "${cg}", authorized_hours: 20 }, as: Caregiver, as_user_id: "${cg}", captures: { vch: $.data.id } }
            - { call: "POST /respite/bookings", payload: { voucher_id: "${vch}", caregiver_id: "${cg}", match_mode: "EXPLICIT", provider_id: "${prov}", window_id: "${win}", start_at: "2026-05-04T19:00:00Z", end_at: "2026-05-04T21:00:00Z" }, as: Caregiver, as_user_id: "${cg}", captures: { bk: $.data.id } }
            - { call: "POST /respite/bookings/${bk}/confirm", as: Provider, as_user_id: "${prov}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T19:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/bookings/${bk}/check-in", payload: { check_in_location: "37.77,-122.41" }, as: Provider, as_user_id: "${prov}", captures: { vis: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T21:00:00Z" }, as: FunderAdmin }
            - { call: "POST /respite/visit-records/${vis}/check-out", payload: {}, as: Provider, as_user_id: "${prov}" }
            - { call: "POST /respite/visit-records/${vis}/verification-decisions", payload: { decision: "VERIFY" }, as: Coordinator }
            - { call: "GET /respite/claims?voucher_id=${vch}", as: Coordinator, captures: { clm: "$.data[0].id" } }
            - { call: "POST /respite/claims/${clm}/submit", as: Provider, as_user_id: "${prov}" }
          trigger:
            - { call: "POST /respite/claims/${clm}/adjudicate", payload: { decision: "DENY", reason: "insufficient documentation" }, as: FunderAdmin }
            - { call: "GET /respite/programs/${prog}", as: FunderAdmin, captures: { p_total: $.data.total_budget_cents, p_unenc: $.data.unencumbered_cents, p_enc: $.data.encumbered_cents, p_set: $.data.settled_cents } }
          assert:
            - "Program.${prog}.total_budget_cents == 50000000"
            - "Program.${prog}.unencumbered_cents == 50000000"
            - "Program.${prog}.encumbered_cents == 0"
            - "Program.${prog}.settled_cents == 0"
            - "total_budget_cents == unencumbered_cents + encumbered_cents + settled_cents == 50000000"
