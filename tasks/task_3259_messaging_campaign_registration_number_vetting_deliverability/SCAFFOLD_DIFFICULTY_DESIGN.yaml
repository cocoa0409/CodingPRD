  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: one_active_number_per_type_per_campaign
        grounds:
          - validations[priority=10]
          - errors[ERR_NUMBER_TYPE_OCCUPIED]
          - entities.SenderNumber.fields.number_type
        distinguishing_aspect: |
          Point-occupancy semantics on Campaign: the campaign is the resource and
          'interval' is each number's ACTIVE attachment lifetime — a second
          ACTIVE TEN_DLC attach collides with the first (ERR_NUMBER_TYPE_OCCUPIED),
          but an ACTIVE TOLL_FREE attach coexists because the occupancy key is
          (campaign, number_type).
