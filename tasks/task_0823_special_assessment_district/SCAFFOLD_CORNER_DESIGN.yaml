              as: CountyTreasurer
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_QUOTE_DATE_INVALID"

      - name: payment_amount_mismatch_on_due_installment
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_PAYMENT_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "Paying a DUE installment (amount_due 525000) with 500000 returns 422 ERR_PAYMENT_AMOUNT_MISMATCH; installment stays DUE."
        test_recipe:
