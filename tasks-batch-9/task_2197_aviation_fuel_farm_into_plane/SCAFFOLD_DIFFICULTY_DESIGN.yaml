              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 1000000.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { qa_sample_id: $.data.id }
            - call: "POST /quality-samples/${qa_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /storage-tanks/${tank_id}/quality-release"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /fuel-receipts"
              payload: { storage_tank_id: "${tank_id}", delivery_mode: "TRUCK", supplier_name: "Refinery One", meter_ticket_number: "MT-8001", meter_ticket_gross_liters: 30120.0, tank_opening_gauge_liters: 100.0, tank_closing_gauge_liters: 30100.0, temperature_c: 25.0, certificate_density_kg_per_m3: 795.0, measured_water_liters: 200.0 }
              as: FarmOperator
              captures: { receipt_id: $.data.id }
            - call: "POST /fuel-receipts/${receipt_id}/samples"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { rc_sample_id: $.data.id }
            - call: "POST /quality-samples/${rc_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.4, conductivity_ps_per_m: 150.0, observed_density_kg_per_m3: 795.0, flash_point_c: 41.0 }
              as: QualityInspector
              as_user_id: "qi-alice"
            - call: "POST /fuel-receipts/${receipt_id}/verdict"
              payload: { decision: "RELEASE" }
              as: QualityInspector
              as_user_id: "qi-bob"
            - call: "POST /fuel-farms/${farm_id}/fueling-assets"
              payload: { asset_code: "TRK1", asset_type: "TRUCK", tank_capacity_liters: 40000.0, turnaround_buffer_minutes: 15, differential_pressure_kpa: 10.0 }
              as: ConsortiumAdmin
              captures: { truck_id: $.data.id }
            - call: "POST /airline-accounts"
              payload: { airline_iata_code: "AA", legal_name: "Alpha Air", contract_type: "CONTRACT_FUEL", base_price_cents_per_liter: 62.00, credit_limit_cents: 100000000, tax_exempt: false }
              as: ConsortiumAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /flights"
              payload: { airline_account_id: "${acct_id}", flight_number: "AA100", tail_number: "N100AA", scheduled_departure_utc: "2026-08-10T08:00:00Z", stand_code: "A12" }
              as: AirlineRep
              as_user_id: "${acct_id}"
              captures: { flight_id: $.data.id }
            - call: "POST /fuel-authorizations"
              payload: { airline_account_id: "${acct_id}", flight_id: "${flight_id}", max_authorized_liters: 20000.0 }
              as: AirlineRep
              as_user_id: "${acct_id}"
              captures: { auth_id: $.data.id, auth_code: $.data.authorization_code }
            - call: "POST /fueling-orders"
              payload: { flight_id: "${flight_id}", fuel_authorization_id: "${auth_id}", storage_tank_id: "${tank_id}", delivery_mode: "TRUCK", requested_uplift_liters: 20000.0, window_start_utc: "2026-08-10T06:00:00Z", window_end_utc: "2026-08-10T07:30:00Z", quoted_authorization_code: "${auth_code}" }
              as: IntoPlaneAgent
              captures: { order_id: $.data.id }
            - call: "POST /fueling-orders/${order_id}/authorize"
              payload: {}
              as: IntoPlaneAgent
            - call: "POST /fueling-orders/${order_id}/assign"
              payload: { fueling_asset_id: "${truck_id}" }
              as: IntoPlaneAgent
            - call: "POST /fueling-orders/${order_id}/start"
              payload: {}
              as: IntoPlaneAgent
              captures: { order_v: $.data.version }
            - call: "POST /fueling-orders/${order_id}/uplift-records"
              payload: { ticket_number: "TK-0001", meter_start_liters: 0.0, meter_end_liters: 20000.0, temperature_c: 15.0, expected_fueling_order_version: "${order_v}" }
              as: IntoPlaneAgent
              captures: { uplift_id: $.data.id }
            - call: "POST /fueling-orders/${order_id}/complete"
              payload: {}
              as: IntoPlaneAgent
            - call: "POST /fuel-farms/${farm_id}/reconciliation-runs"
              payload: { period_start_utc: "2026-08-10T00:00:00Z", period_end_utc: "2026-08-11T00:00:00Z" }
              as: FarmOperator
              captures: { run_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T01:00:00Z" }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /reconciliation-runs/${run_id}/measure"
              payload: { tank_measurements: [ { storage_tank_id: "${tank_id}", measured_volume_liters: 1009400.0, temperature_c: 15.0 } ] }
              as: FarmOperator
          assert:
            - "StorageTank.${tank_id}.book_volume_liters == 1009698.32 immediately before the measure call"
            - "ReconciliationRun.${run_id}.receipts_net_liters == 29698.32"
            - "ReconciliationRun.${run_id}.uplifts_net_liters == 20000.00"
            - "ReconciliationRun.${run_id}.throughput_liters == 49698.32"
            - "ReconciliationRun.${run_id}.variance_liters == -298.32"
            - "ReconciliationRun.${run_id}.variance_pct_throughput_basis == 0.6003"
            - "ReconciliationRun.${run_id}.variance_pct_opening_stock_basis == 0.0298"
            - "ReconciliationRun.${run_id}.status == VARIANCE_HOLD"

  - rule_id: combinatorial_formula
    instances:
      - name: receipt_density_band_vcf_and_water_cap_interaction
        mode: a
        grounds:
          - calculations.receipt_net_volume_at_15c
          - entities.FuelReceipt.fields.net_volume_liters
          - entities.FuelReceipt.fields.advisory_net_volume_liters
        distinguishing_aspect: |
          Three inputs interact non-separably: certificate_density_kg_per_m3 of exactly 800.0 lands on the
          heavy band boundary selecting alpha 0.000850 (not the 0.000900 of the light band), temperature_c
          35.0 turns that alpha into vcf 0.98300, and measured_water_liters 500.0 is then clamped to the
          0.5%-of-governing-gross ceiling of 150.00 — so net is 29340.00 and NOT 28990.00 (uncapped water)
          nor 29310.00 (light-band alpha), and no single input read alone predicts the result.
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T06:00:00Z"
            - "farm SFO with ACTIVE permit (max_daily_throughput_liters 400000.0) and one empty tank T1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 400000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 800.0, opening_volume_liters: 0.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
          trigger:
            - call: "POST /fuel-receipts"
              payload: { storage_tank_id: "${tank_id}", delivery_mode: "PIPELINE", supplier_name: "Refinery Two", meter_ticket_number: "MT-9001", meter_ticket_gross_liters: 30500.0, tank_opening_gauge_liters: 0.0, tank_closing_gauge_liters: 30000.0, temperature_c: 35.0, certificate_density_kg_per_m3: 800.0, measured_water_liters: 500.0 }
              as: FarmOperator
              captures: { receipt_id: $.data.id }
          assert:
            - "FuelReceipt.${receipt_id}.governing_gross_liters == 30000.00"
            - "FuelReceipt.${receipt_id}.advisory_gross_liters == 30500.00"
            - "FuelReceipt.${receipt_id}.net_volume_liters == 29340.00"
            - "FuelReceipt.${receipt_id}.advisory_net_volume_liters == 29829.00"
            - "FuelReceipt.${receipt_id}.status == RECORDED"
            - "the light-band answer 29310.00 and the uncapped-water answer 28990.00 must NOT appear"
            - "StorageTank.${tank_id}.book_volume_liters == 0.00 (receipt not RELEASED)"

      - name: uplift_line_per_component_rounding_beats_sum_then_round
        mode: b
        grounds:
          - calculations.uplift_invoice_line_amount
          - entities.UpliftRecord.fields.billed_line_cents
          - entities.UpliftRecord.fields.fuel_component_cents
        distinguishing_aspect: |
          Net 19002.55 liters is chosen so the five money components each carry a fractional cent tail whose
          rounding order matters: rounding every component to cents first and then summing gives
          billed_line_cents 1361905, while summing the exact rationals and rounding once gives 1361906.
          A one-cent divergence proves the mandated per-component-then-sum order.
        setup_note: "Same calculation family as the receipt instance above is deliberately avoided; this instance exercises the money pipeline on UpliftRecord, not the volume pipeline on FuelReceipt."
        test_recipe:
          setup:
            - "base chain of the airline_exposure instance up to and including POST /fueling-orders/${order_id}/start"
            - "tank T1 RELEASED with book 1000000.00 liters, truck TRK1 IN_SERVICE, account AA base 62.00 cents/L, not tax exempt"
            - "order requested_uplift_liters 20000.0, window 2026-08-10T06:00:00Z..2026-08-10T07:30:00Z, clock inside the window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /fuel-farms"
              payload: { iata_code: "SFO", name: "SFO Fuel Consortium", hydrant_system_available: true, unpumpable_bottom_liters: 500.0 }
              as: ConsortiumAdmin
              captures: { farm_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/environmental-permits"
              payload: { permit_number: "P-2026-001", valid_from_utc: "2026-01-01T00:00:00Z", valid_until_utc: "2027-01-01T00:00:00Z", max_daily_throughput_liters: 400000.0, max_reportable_spill_liters: 20.0 }
              as: ConsortiumAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /fuel-farms/${farm_id}/storage-tanks"
              payload: { tank_code: "T1", capacity_liters: 5000000.0, safe_fill_liters: 4000000.0, density_kg_per_m3: 795.0, opening_volume_liters: 1000000.0 }
              as: ConsortiumAdmin
              captures: { tank_id: $.data.id }
            - call: "POST /storage-tanks/${tank_id}/samples"
              payload: { sample_purpose: "PERIODIC_TANK_QA" }
              as: QualityInspector
              as_user_id: "qi-alice"
              captures: { qa_sample_id: $.data.id }
            - call: "POST /quality-samples/${qa_sample_id}/test-results"
              payload: { water_reaction_rating: 1, particulate_mg_per_l: 0.5, conductivity_ps_per_m: 120.0, observed_density_kg_per_m3: 795.0, flash_point_c: 42.0 }
