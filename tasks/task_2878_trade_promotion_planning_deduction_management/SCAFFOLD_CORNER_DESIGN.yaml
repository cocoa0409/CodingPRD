        distinguishing_aspect: |
          Each of the three TPR lines is individually legal and no single promotion holds more
          than two; the cap fails only on the aggregate day-count across sibling promotions
          under the same customer and brand. Dropping the second promotion's line from the
          count would leave 2 on 2026-08-03 and let the third line through.
