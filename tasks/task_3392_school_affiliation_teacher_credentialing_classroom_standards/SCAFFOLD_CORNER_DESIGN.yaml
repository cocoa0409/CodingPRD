# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3392_school_affiliation_teacher_credentialing_classroom_standards
# Breadth probe over SCAFFOLD §1.1-§1.7; §1.8-covered corners appear as
# excluded_because stubs. Anchors &c_* are local to this file.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: school_create_returns_defaults_and_floored_dues_quote
        claim_type: Creation
        grounds:
          - entities.School
          - endpoints.POST_/society/schools
          - calculations.annual_membership_dues
        distinguishing_aspect: "A school created with only required fields comes back 201 as APPLICANT / GOOD_STANDING with version 1, dues_current false, brand_compliant true (no method name), directory_visible false, total_enrollment 0, and annual_dues_cents 60000 (APPLICANT quotes the AFFILIATE schedule: raw 40000 + 0 students + 0 rooms lifted by the MIN_DUES floor)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clk
              call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SocietyAdmin
          trigger:
            - call: "POST /society/schools"
              payload: { name: "Naked School", display_name: "Naked Schoolhouse", uses_method_name: false, contact_email: "n@x.org" }
              as: SocietyAdmin
              captures: { ns_id: $.data.id }
          assert:
            - "response status 201, response_type object, meta.api_request_id present"
            - "School.${ns_id}.membership_level == APPLICANT and standing == GOOD_STANDING and version == 1"
            - "dues_current == false (never paid), brand_compliant == true, directory_visible == false"
            - "total_enrollment == 0 and compliant_classroom_count == 0"
            - "annual_dues_cents == 60000 (raw 40000, MIN_DUES_CENTS floor binds)"
            - "affiliated_since, member_since, accredited_since, dues_paid_through, pinned_catalog_id are all null"

      - name: classroom_create_roundtrip_and_unknown_school_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.Classroom.fields.school_id
          - errors.ERR_SCHOOL_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "Classroom creation under a syntactically valid but nonexistent school_id is rejected 404 ERR_SCHOOL_NOT_FOUND (body-FK existence check), while the same payload under a real school round-trips every field through GET."
        test_recipe:
          setup:
            - "One school exists."
          setup_api_calls:
            - *c_clk
            - call: "POST /society/schools"
              payload: { name: "Parent School", display_name: "Parent Schoolhouse", uses_method_name: false, contact_email: "p@x.org" }
              as: SocietyAdmin
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /society/classrooms"
              payload: { school_id: "00000000-0000-4000-8000-000000000000", name: "Ghost", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 10, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${ps_id}", name: "Willow", age_level: "ELEMENTARY_I", declared_age_span_years: 3, enrolled_student_count: 26, assistant_count: 2 }
              as: SchoolAdmin
              as_user_id: "${ps_id}"
              captures: { wc_id: $.data.id }
            - call: "GET /society/classrooms/${wc_id}"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${ps_id}"
          assert:
            - "err == ERR_SCHOOL_NOT_FOUND (http 404) for the unknown school_id"
            - "GET returns Classroom.${wc_id} with age_level == ELEMENTARY_I, declared_age_span_years == 3, enrolled_student_count == 26, assistant_count == 2"
            - "Classroom.${wc_id}.compliance_override == NONE and latest_audit_verdict is null"

      - name: audit_entity_is_immutable_without_version_field
        claim_type: Immutability
        grounds:
          - entities.ClassroomAudit
        distinguishing_aspect: "ClassroomAudit declares common_fields false: its create response carries id and created_at but no version and no updated_at, and the endpoint table exposes no audit mutation endpoint."
        test_recipe:
          setup:
            - "Catalog ACTIVE; one school with one classroom."
          setup_api_calls:
            - *c_clk
            - &c_cat
              call: "POST /society/standards-catalogs"
              payload:
                version_label: "Standards 2026"
                effective_from: "2026-01-01"
                min_uninterrupted_work_minutes_by_level: { INFANT_TODDLER: 90, EARLY_CHILDHOOD: 180, ELEMENTARY_I: 180, ELEMENTARY_II: 180, SECONDARY: 120 }
                max_students_per_adult_by_level: { INFANT_TODDLER: 5, EARLY_CHILDHOOD: 15, ELEMENTARY_I: 15, ELEMENTARY_II: 16, SECONDARY: 20 }
                materials_pass_threshold: 0.9
                min_multi_age_span_years_by_level: { INFANT_TODDLER: 2, EARLY_CHILDHOOD: 3, ELEMENTARY_I: 3, ELEMENTARY_II: 3, SECONDARY: 2 }
                practicum_min_hours_by_level: { INFANT_TODDLER: 300, EARLY_CHILDHOOD: 540, ELEMENTARY_I: 540, ELEMENTARY_II: 540, SECONDARY: 400 }
                ce_hours_required: 30
                credential_validity_months: 36
                renewal_window_months: 3
                renewal_grace_months: 6
                min_membership_months_before_accreditation: 12
                consultant_travel_buffer_days: 1
                plan_response_days: 30
              as: SocietyAdmin
              captures: { cat_id: $.data.id }
            - &c_act
              call: "POST /society/standards-catalogs/${cat_id}/activate"
              payload: {}
              as: SocietyAdmin
            - call: "POST /society/schools"
              payload: { name: "Imm School", display_name: "Imm Schoolhouse", uses_method_name: false, contact_email: "i@x.org" }
              as: SocietyAdmin
              captures: { im_id: $.data.id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${im_id}", name: "C1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 20, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${im_id}"
              captures: { ic_id: $.data.id }
          trigger:
            - call: "POST /society/classroom-audits"
              payload: { classroom_id: "${ic_id}", students_present: 20, adults_present: 2, observed_uninterrupted_minutes: 180, materials_groups: [ { domain: "PRACTICAL_LIFE", required_count: 10, present_count: 10 } ] }
              as: Consultant
              as_user_id: "con-ada"
              captures: { ia_id: $.data.id }
          assert:
            - "response status 201 with data.id and data.created_at present"
            - "the response data has NO version field and NO updated_at field (common_fields false)"
            - "ClassroomAudit.${ia_id}.catalog_id == ${cat_id} (school has no pin; ACTIVE catalog used)"
            - "verdict == COMPLIANT with failed_checks == []"

      - name: learner_enrollment_rejected_for_unoffered_age_level
        claim_type: Type Constraints
        grounds:
          - entities.AdultLearner.fields.age_level
          - errors.ERR_AGE_LEVEL_MISMATCH
          - validations[priority=8]
        distinguishing_aspect: "Enrolling a SECONDARY learner into a program whose age_levels_offered is [EARLY_CHILDHOOD] is rejected 422 ERR_AGE_LEVEL_MISMATCH; an enum garbage value is rejected 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "One PROVISIONAL program offering only EARLY_CHILDHOOD."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/teacher-education-programs"
              payload: { name: "Levels TEP", age_levels_offered: ["EARLY_CHILDHOOD"], course_contact_hours_by_level: { EARLY_CHILDHOOD: 300 }, practicum_hours_by_level: { EARLY_CHILDHOOD: 540 } }
              as: SocietyAdmin
              captures: { lp_id: $.data.id }
          trigger:
            - call: "POST /society/adult-learners"
              payload: { program_id: "${lp_id}", full_name: "Wrong Level", age_level: "SECONDARY" }
              as: ProgramDirector
              as_user_id: "${lp_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /society/adult-learners"
              payload: { program_id: "${lp_id}", full_name: "Garbage Level", age_level: "KINDERGARTEN" }
              as: ProgramDirector
              as_user_id: "${lp_id}"
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_AGE_LEVEL_MISMATCH (http 422): valid enum, but not offered by the program"
            - "err2 == ERR_VALIDATION (http 400): KINDERGARTEN is not a member of the age_level enum"

      - name: classrooms_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/society/classrooms
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three classrooms on one school, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the school_id filter scopes the count."
        test_recipe:
          setup:
            - "One school with three classrooms."
          setup_api_calls:
            - *c_clk
            - call: "POST /society/schools"
              payload: { name: "Page School", display_name: "Page Schoolhouse", uses_method_name: false, contact_email: "pg@x.org" }
              as: SocietyAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${pg_id}", name: "P1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 10, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${pg_id}"
            - call: "POST /society/classrooms"
              payload: { school_id: "${pg_id}", name: "P2", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 12, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${pg_id}"
            - call: "POST /society/classrooms"
              payload: { school_id: "${pg_id}", name: "P3", age_level: "ELEMENTARY_I", declared_age_span_years: 3, enrolled_student_count: 14, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${pg_id}"
          trigger:
            - call: "GET /society/classrooms"
              payload: { school_id: "${pg_id}", limit: 2, offset: 0 }
              as: AccreditationReviewer
              captures: { page1_count: $.data }
            - call: "GET /society/classrooms"
              payload: { school_id: "${pg_id}", limit: 2, offset: 2, age_level: "ELEMENTARY_I" }
              as: AccreditationReviewer
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 with age_level ELEMENTARY_I filter: 1 row, total_count == 1, has_more == false (filter applies before counting)"
            - "GET /society/classrooms without parameters returns all 3 rows with default limit 10"

      - name: credential_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/society/credentials/{id}
          - errors.ERR_CREDENTIAL_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated credential id yields the entity-specific ERR_CREDENTIAL_NOT_FOUND 404, not a generic error."
        test_recipe:
          setup:
            - "Empty database; clock at default."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "GET /society/credentials/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDENTIAL_NOT_FOUND with http 404"

      - name: placement_create_pins_target_hours_from_active_catalog
        claim_type: Computed Fields
        grounds:
          - entities.PracticumPlacement.fields.target_hours
          - calculations.practicum_completion
        distinguishing_aspect: "target_hours is system-copied from the ACTIVE catalog's practicum_min_hours_by_level at creation (540 for EARLY_CHILDHOOD) — a client-supplied target_hours field does not exist and cannot be injected."
        test_recipe:
          setup:
            - "Catalog ACTIVE; program PROVISIONAL; learner ENROLLED; host school AFFILIATE."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/teacher-education-programs"
              payload: { name: "Pin TEP", age_levels_offered: ["EARLY_CHILDHOOD"], course_contact_hours_by_level: { EARLY_CHILDHOOD: 300 }, practicum_hours_by_level: { EARLY_CHILDHOOD: 540 } }
              as: SocietyAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /society/adult-learners"
              payload: { program_id: "${pp_id}", full_name: "Pin Learner", age_level: "EARLY_CHILDHOOD" }
              as: ProgramDirector
              as_user_id: "${pp_id}"
              captures: { pl_id: $.data.id }
            - call: "POST /society/schools"
              payload: { name: "Pin Host", display_name: "Pin Host School", uses_method_name: false, contact_email: "pn@x.org" }
              as: SocietyAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /society/schools/${ph_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2027-09-01", amount_cents: 60000 }
              as: SocietyAdmin
              captures: { ph_v: $.data.version }
            - call: "POST /society/classrooms"
              payload: { school_id: "${ph_id}", name: "R1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 20, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${ph_id}"
            - call: "POST /society/school-applications"
              payload: { school_id: "${ph_id}", type: "AFFILIATION", expected_school_version: "${ph_v}" }
              as: SchoolAdmin
              as_user_id: "${ph_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /society/school-applications/${pa_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${ph_id}"
            - call: "POST /society/school-applications/${pa_id}/review"
              payload: { outcome: "APPROVED" }
              as: AccreditationReviewer
          trigger:
            - call: "POST /society/practicum-placements"
              payload: { learner_id: "${pl_id}", host_school_id: "${ph_id}", start_date: "2026-09-15", end_date: "2027-03-15" }
              as: ProgramDirector
              as_user_id: "${pp_id}"
              captures: { plc_id: $.data.id }
          assert:
            - "PracticumPlacement.${plc_id}.target_hours == 540 (system-computed from the catalog; not client-controllable)"
            - "PracticumPlacement.${plc_id}.hours_logged == 0 and status == ACTIVE"
            - "AdultLearner.${pl_id}.status == IN_PRACTICUM (creation side effect)"

  - section: state_machines
    instances:

      - name: plan_respond_from_verified_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ImprovementPlan
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "VERIFIED is terminal: a respond call on a VERIFIED plan fails 409 ERR_INVALID_STATE and the plan's version does not change."
        test_recipe:
          setup:
            - "School with ACCEPTED self-study and a visit reported IMPROVEMENT_REQUIRED at 2026-10-01; the auto-created plan has been responded to and VERIFIED."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "Lock School", display_name: "Lock Schoolhouse", uses_method_name: false, contact_email: "lk@x.org" }
              as: SocietyAdmin
              captures: { ls_id: $.data.id, ls_v: $.data.version }
            - call: "POST /society/self-studies"
              payload: { school_id: "${ls_id}", narrative: "Lock self-study", expected_school_version: "${ls_v}" }
              as: SchoolAdmin
              as_user_id: "${ls_id}"
              captures: { lss_id: $.data.id }
            - call: "POST /society/self-studies/${lss_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${ls_id}"
            - call: "POST /society/self-studies/${lss_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: AccreditationReviewer
            - call: "POST /society/verification-visits"
              payload: { school_id: "${ls_id}", self_study_id: "${lss_id}", consultant_id: "con-ada", window_start: "2026-10-01", window_end: "2026-10-03" }
              as: AccreditationReviewer
              captures: { lv_id: $.data.id }
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/verification-visits/${lv_id}/reports"
              payload: { findings: ["Fix ratio"], verdict: "IMPROVEMENT_REQUIRED" }
              as: Consultant
              as_user_id: "con-ada"
            - call: "GET /society/improvement-plans"
              payload: { school_id: "${ls_id}" }
              as: AccreditationReviewer
              captures: { lp_id: "$.data[0].id", lp_v: "$.data[0].version" }
            - call: "POST /society/improvement-plans/${lp_id}/respond"
              payload: { response_notes: "Done", expected_improvement_plan_version: "${lp_v}" }
              as: SchoolAdmin
              as_user_id: "${ls_id}"
            - call: "POST /society/improvement-plans/${lp_id}/review"
              payload: { outcome: "VERIFIED" }
              as: AccreditationReviewer
          trigger:
            - call: "GET /society/improvement-plans/${lp_id}"
              payload: {}
              as: AccreditationReviewer
              captures: { lp_v2: $.data.version }
            - call: "POST /society/improvement-plans/${lp_id}/respond"
              payload: { response_notes: "Again", expected_improvement_plan_version: "${lp_v2}" }
              as: SchoolAdmin
              as_user_id: "${ls_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (http 409): VERIFIED is terminal for respond"
            - "ImprovementPlan.${lp_id}.status remains VERIFIED with verified_at non-null"

      - name: visit_report_filed_twice_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.VerificationVisit.SCHEDULED_to_REPORT_FILED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A second reports call on a REPORT_FILED visit is rejected 409 ERR_INVALID_STATE; the first verdict and report_filed_at are unchanged, and no second plan is created."
        test_recipe:
          setup:
            - "School with ACCEPTED self-study; visit window 2026-10-01..2026-10-03 already reported COMPLIANT at 2026-10-02."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/schools"
              payload: { name: "Twice School", display_name: "Twice Schoolhouse", uses_method_name: false, contact_email: "tw@x.org" }
              as: SocietyAdmin
              captures: { ts_id: $.data.id, ts_v: $.data.version }
            - call: "POST /society/self-studies"
              payload: { school_id: "${ts_id}", narrative: "Twice self-study", expected_school_version: "${ts_v}" }
              as: SchoolAdmin
              as_user_id: "${ts_id}"
              captures: { tss_id: $.data.id }
            - call: "POST /society/self-studies/${tss_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${ts_id}"
            - call: "POST /society/self-studies/${tss_id}/review"
              payload: { outcome: "ACCEPTED" }
              as: AccreditationReviewer
            - call: "POST /society/verification-visits"
              payload: { school_id: "${ts_id}", self_study_id: "${tss_id}", consultant_id: "con-ada", window_start: "2026-10-01", window_end: "2026-10-03" }
              as: AccreditationReviewer
              captures: { tv_id: $.data.id }
            - call: "POST /society/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: SocietyAdmin
            - call: "POST /society/verification-visits/${tv_id}/reports"
              payload: { findings: ["Fine"], verdict: "COMPLIANT" }
              as: Consultant
              as_user_id: "con-ada"
          trigger:
            - call: "POST /society/verification-visits/${tv_id}/reports"
              payload: { findings: ["Changed my mind"], verdict: "NONCOMPLIANT" }
              as: Consultant
              as_user_id: "con-ada"
              captures: { err: $.data.error_id }
            - call: "GET /society/improvement-plans"
              payload: { school_id: "${ts_id}" }
              as: AccreditationReviewer
          assert:
            - "err == ERR_INVALID_STATE (http 409)"
            - "VerificationVisit.${tv_id}.verdict remains COMPLIANT (second filing did not overwrite)"
            - "GET /society/improvement-plans?school_id returns 0 rows (no plan from the rejected second report)"

      - name: placement_log_hours_after_hours_complete_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PracticumPlacement.ACTIVE_to_HOURS_COMPLETE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Once log-hours pushes the placement to HOURS_COMPLETE, a further log-hours call is rejected 409 ERR_INVALID_STATE — hours freeze at exactly target_hours."
        test_recipe:
          setup:
            - "Learner with placement at 540/540 (HOURS_COMPLETE) at host AFFILIATE school."
          setup_api_calls:
            - *c_clk
            - *c_cat
            - *c_act
            - call: "POST /society/teacher-education-programs"
              payload: { name: "Freeze TEP", age_levels_offered: ["EARLY_CHILDHOOD"], course_contact_hours_by_level: { EARLY_CHILDHOOD: 300 }, practicum_hours_by_level: { EARLY_CHILDHOOD: 540 } }
              as: SocietyAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /society/adult-learners"
              payload: { program_id: "${fp_id}", full_name: "Freeze Learner", age_level: "EARLY_CHILDHOOD" }
              as: ProgramDirector
              as_user_id: "${fp_id}"
              captures: { fl_id: $.data.id }
            - call: "POST /society/schools"
              payload: { name: "Freeze Host", display_name: "Freeze Host School", uses_method_name: false, contact_email: "fh@x.org" }
              as: SocietyAdmin
              captures: { fh_id: $.data.id }
            - call: "POST /society/schools/${fh_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2027-09-01", amount_cents: 60000 }
              as: SocietyAdmin
              captures: { fh_v: $.data.version }
            - call: "POST /society/classrooms"
              payload: { school_id: "${fh_id}", name: "R1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 20, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${fh_id}"
            - call: "POST /society/school-applications"
              payload: { school_id: "${fh_id}", type: "AFFILIATION", expected_school_version: "${fh_v}" }
              as: SchoolAdmin
              as_user_id: "${fh_id}"
              captures: { fa_id: $.data.id }
            - call: "POST /society/school-applications/${fa_id}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${fh_id}"
            - call: "POST /society/school-applications/${fa_id}/review"
              payload: { outcome: "APPROVED" }
              as: AccreditationReviewer
            - call: "POST /society/practicum-placements"
              payload: { learner_id: "${fl_id}", host_school_id: "${fh_id}", start_date: "2026-09-15", end_date: "2027-03-15" }
              as: ProgramDirector
              as_user_id: "${fp_id}"
              captures: { fpl_id: $.data.id }
            - call: "POST /society/practicum-placements/${fpl_id}/log-hours"
              payload: { hours: 540, work_date: "2026-12-01" }
              as: AdultLearner
              as_user_id: "${fl_id}"
          trigger:
