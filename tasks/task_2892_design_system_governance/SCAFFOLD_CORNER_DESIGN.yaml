          difficulty_instance: priority_pair_validation_conflict / promotion_conformance_gate_outranks_deprecation_in_progress_gate
          rationale: "The named §1.8 instance triggers this id on its own leg after satisfying the conformance gate, so the id is already proven reachable."

      - name: ship_refused_because_the_component_lifecycle_moved_on
        claim_type: triggerable
        grounds:
          - errors[ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ship_refused_because_owning_component_lifecycle_reached_sunset
          rationale: "The named §1.8 instance drives the owning component to SUNSET and asserts exactly this id on the ship attempt."

      - name: notice_window_below_the_required_days_is_refused
        claim_type: triggerable
        grounds:
          - errors[ERR_DEPRECATION_NOTICE_TOO_SHORT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / deprecation_notice_gate_outranks_window_overlap_gate
          rationale: "The named §1.8 instance asserts this id while a second gate is simultaneously violated, which subsumes a plain trigger."

      - name: overlapping_deprecation_windows_are_refused
        claim_type: triggerable
        grounds:
          - errors[ERR_DEPRECATION_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / deprecation_windows_touching_at_removal_instant_are_admitted
          rationale: "The named §1.8 instance pairs the admitted adjacency with a one-millisecond overlap that triggers this id."

      - name: deciding_a_non_requested_grant_is_refused
        claim_type: triggerable
        grounds:
          - errors[ERR_INVALID_EXCEPTION_GRANT_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / exception_state_gate_outranks_debt_budget_gate
          rationale: "The named §1.8 instance asserts this id on a second decision of an already-approved grant."

      - name: acceptance_refused_because_the_pinned_token_set_moved
        claim_type: triggerable
        grounds:
          - errors[ERR_PINNED_TOKEN_SET_STALE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / acceptance_refused_because_pinned_token_set_version_advanced_after_review
          rationale: "The named §1.8 instance advances the pinned token set after review and asserts this id, distinguishing it from the 412 OCC failure."

      - name: overlapping_adoption_scan_windows_are_refused
        claim_type: triggerable
        grounds:
          - errors[ERR_SCAN_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / adoption_scans_sharing_one_endpoint_instant_collide_for_the_same_kind
          rationale: "The named §1.8 instance triggers this id at the shared-endpoint boundary of a closed window, the hardest form of the trigger."

      - name: frozen_team_cannot_open_a_proposal
        claim_type: triggerable
        grounds:
          - errors[ERR_TEAM_DEBT_FROZEN]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / proposal_creation_refused_because_author_team_debt_state_is_frozen
          rationale: "The named §1.8 instance drives the team into FROZEN through approved grants and asserts this id on both the create and the submit route."

      - name: empty_string_identity_headers_are_treated_as_absent
        claim_type: triggerable
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope.error
        distinguishing_aspect: |
          Both identity headers are sent as the empty string "" (never as spaces, which some HTTP
          clients drop entirely) and must be treated as absent: a read and a write both answer
          ERR_UNAUTHENTICATED at 401, ahead of the role check at priority 2 and ahead of any
          existence check, so even a well-formed request against a real component fails with 401
          rather than 403 or 404. Only POST /_clock/set_current_utc is exempt.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild` owns Component `badge`"
            - "the two triggering calls send X-User-Role and X-User-ID as literal empty strings"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
          trigger:
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: ""
              as_user_id: ""
              captures: { e_read: $.data.error_id }
            - call: "POST /design-system/components/${comp_id}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: ""
              as_user_id: ""
              captures: { e_write: $.data.error_id }
          assert:
            - "${e_read} == ERR_UNAUTHENTICATED with HTTP status 401"
            - "${e_write} == ERR_UNAUTHENTICATED with HTTP status 401"
            - "both responses carry response_type error with data.error_id and data.message and no data payload fields"
            - "the same GET repeated with X-User-Role DesignSystemLead and any X-User-ID returns 200, proving only the headers differed"
            - "POST /_clock/set_current_utc still succeeds with no identity headers (the declared exemption)"

  - section: rbac
    instances:
      - name: each_roles_exclusive_operations_are_closed_to_the_other_roles
        claim_type: exclusive_operations
        grounds:
          - roles.SystemAdmin.exclusive_operations
          - roles.DesignSystemLead.exclusive_operations
          - roles.ContributingTeam.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The three writing roles have genuinely disjoint authority and none of them is a superset
          of another, so the denial must run in every direction: ContributingTeam cannot promote
          maturity, SystemAdmin cannot mint tokens, and DesignSystemLead cannot publish a release.
          All three must answer ERR_UNAUTHORIZED at 403 - not 404, not 422 - and must leave the
          target rows untouched, which rules out a "highest role wins" or hierarchical-override
          implementation.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `badge`; TokenSet `core`; a DRAFT Release"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Badge", slug: "badge", owning_team_id: "${team_id}" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id, level_before: $.data.maturity_level }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "BASE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id, ts_v0: $.data.version }
            - call: "POST /design-system/releases"
              payload: { semver_base: "1.4.0" }
              as: SystemAdmin
              captures: { rel_id: $.data.id, rel_state_before: $.data.state }
          trigger:
            - call: "POST /design-system/components/${comp_id}/promote-maturity"
              payload: { target_maturity_level: "BETA" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { e_promote: $.data.error_id }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.surface", category: "COLOR", expected_token_set_version: "${ts_v0}", raw_value: "#FFFFFF" }
              as: SystemAdmin
              captures: { e_token: $.data.error_id }
            - call: "POST /design-system/releases/${rel_id}/publish"
              payload: {}
              as: DesignSystemLead
              captures: { e_publish: $.data.error_id }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { level_after: $.data.maturity_level }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { ts_v_after: $.data.version, ts_count_after: $.data.token_count }
          assert:
            - "${e_promote} == ERR_UNAUTHORIZED with HTTP status 403"
            - "${e_token} == ERR_UNAUTHORIZED with HTTP status 403"
            - "${e_publish} == ERR_UNAUTHORIZED with HTTP status 403"
            - "${level_after} == ${level_before} == EXPERIMENTAL"
            - "${ts_v_after} == ${ts_v0} == 1 and ${ts_count_after} == 0"
            - "${rel_state_before} == DRAFT and the release is still DRAFT (GET /design-system/contribution-proposals with released_in_release_id ${rel_id} returns total_count == 0)"

      - name: reviewer_roles_are_peers_with_disjoint_stage_authority
        claim_type: peer_roles
        grounds:
          - roles.DesignCritiqueReviewer
          - roles.EngineeringReviewer
          - validations[priority=10]
          - errors[ERR_REVIEW_STAGE_MISMATCH]
        distinguishing_aspect: |
          The two reviewer roles share one endpoint but own disjoint stages, and neither outranks
          the other: a DesignCritiqueReviewer filing stage ENGINEERING_REVIEW must be refused with
          ERR_REVIEW_STAGE_MISMATCH at 409 even at the moment the proposal actually sits at the
          engineering gate, and an EngineeringReviewer filing stage DESIGN_CRITIQUE must be
          refused the same way - while both roles can read the proposal and its review list.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; TokenSet `core`; Component `badge`"
            - "an ENHANCEMENT proposal submitted and approved at the design-critique gate by critic-1, so it now sits at the ENGINEERING_REVIEW gate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
