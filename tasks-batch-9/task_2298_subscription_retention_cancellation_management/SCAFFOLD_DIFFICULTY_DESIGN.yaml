  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_accept_gated_by_subscription_billing_state
        grounds:
          - validations[priority=45]
          - errors[ERR_SUBSCRIPTION_PAST_DUE]
          - state_machines.SaveOfferGrant.PRESENTED_to_ACCEPTED
          - state_machines.Subscription.PAST_DUE_to_CURRENT
          - calculations.save_offer_selection
        distinguishing_aspect: |
          The identical accept call on the identical SaveOfferGrant flips from 409
          ERR_SUBSCRIPTION_PAST_DUE to 200 ACCEPTED solely because the OTHER entity —
          Subscription.billing_state — moved from PAST_DUE back to CURRENT when its invoice was
          settled; nothing about the grant changed in between.
        test_recipe:
          setup:
            - "CORE exists; templates OTHERA (20% off) and OTHERB (10% off) both sit at priority_rank 50 and are eligible for reason OTHER."
            - "Subscriber I subscribed to CORE on 2026-01-10 at 4-week cadence with no addons."
            - "Attempt 1 on the 4999-cent signup invoice was settled SOFT_DECLINE / INSUFFICIENT_FUNDS, so billing_state is PAST_DUE, first_failed_at is 2026-01-10 and grace_end_at is 2026-01-13."
            - "A session captured reason OTHER and the selector broke the rank-50 tie on blended margin, presenting OTHERB (0.5624 beats OTHERA's 0.5434)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
