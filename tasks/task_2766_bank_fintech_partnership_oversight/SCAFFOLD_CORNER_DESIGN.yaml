      - name: the_wind_down_gates_check_partner_status_then_notice_elapse_then_outstanding_batches
        claim_type: Priority Ordering
        grounds:
          - validations.priority_42
          - validations.priority_44
          - validations.priority_69
          - validations.priority_59
          - errors.ERR_PARTNER_NOT_IN_WIND_DOWN
          - errors.ERR_WIND_DOWN_NOTICE_NOT_ELAPSED
          - errors.ERR_UNSETTLED_BATCHES_OUTSTANDING
          - errors.ERR_TERMINATION_TRIGGER_NOT_CONTRACTED
        distinguishing_aspect: "Priority 69 is a two-part rule with the SAME error id on both halves: a create with notice_days 29 is refused for the static minimum, and an execute before created_at + notice_days is refused for the elapse test. Between them priority 42 refuses a plan for a LIVE partner and priority 44 refuses execution while a batch is still UNFUNDED — and the ordering matters because the execute probe here violates both 69 and 44 at once and must report the notice error."
        test_recipe:
          setup:
            - "Partner A LIVE with an EXECUTED agreement whose termination_triggers include VOLUNTARY but not REGULATORY_DIRECTIVE. Reserve 312500. One MATCHED but still UNFUNDED batch. Clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
            - *q_batch_1
