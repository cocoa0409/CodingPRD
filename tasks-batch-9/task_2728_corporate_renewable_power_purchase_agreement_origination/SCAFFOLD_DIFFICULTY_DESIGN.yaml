  # ===========================================================================
  # RULE 8 - compensating_invariant
  # Instance 1: conserved quantity = credit-support USD across the posted /
  #             released / drawn buckets.
  # Instance 2: conserved quantity = environmental attribute MWh across the
  #             minted / transferred / retired buckets - a different unit, a
  #             different ledger, a different compensating endpoint pair.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: credit_support_usd_conserved_across_post_and_release
        grounds:
          - state_machines.CreditSupportInstrument.PROPOSED_to_POSTED
          - state_machines.CreditSupportInstrument.POSTED_to_RELEASED
          - calculations.eligible_credit_support
          - calculations.credit_support_requirement
          - validations.priority_33_ERR_RELEASE_BREACHES_COVERAGE
          - endpoints.POST_/ppa/credit-support/{id}/release
        distinguishing_aspect: |
          The conserved quantity is MONEY: posted_credit_support_usd +
          released_credit_support_usd + drawn_credit_support_usd must always equal
          the sum of eligible_credit_usd over the instruments that have left
          PROPOSED, and each instrument's own eligible_credit_usd is immutable once
          computed. Release is the exact compensating action for post - it moves
          value between buckets and never destroys or creates it - and a release that
          would drop coverage below the requirement is refused outright, so the
          invariant holds on both the successful and the refused path. A PROPOSED
          instrument contributes to none of the three buckets.
        test_recipe:
          setup:
            - "Buyer NW (A, 2.5, CDP_AND_TCFD, EBITDA 60000000.00, registry account WREGIS-ACC-00417) is QUALIFIED with unsecured_credit_limit_usd 3000000.00."
            - "Project KJ1 (SOLAR, 100.000 MW) exists; Deal D is 50.000 MW, VIRTUAL_CFD, base 42.50, escalation 2.0, first_delivery_year 2027, AS_GENERATED, SHARED, so contract_price_usd_per_mwh is 44.10 and expected_annual_mwh is 122640.00."
            - "exposure_usd is 5408424.00 against a 3000000.00 threshold, so the residual 2408424.00 rounds UP to ten 250000.00 increments: credit_support_required_usd is 2500000.00."
            - "Four instruments are registered against the deal: CASH-1 (CASH_COLLATERAL, 1500000.00, haircut 0.00, eligible 1500000.00), LC-1 (LETTER_OF_CREDIT, 2000000.00, issuer_rating BBB, haircut 10.00, eligible 1800000.00), CASH-2 (CASH_COLLATERAL, 1000000.00, eligible 1000000.00) and CASH-3 (CASH_COLLATERAL, 750000.00) which is deliberately LEFT PROPOSED."
            - "The first three are posted, so posted_credit_support_usd is 4300000.00 and credit_status is APPROVED; CASH-3 never leaves PROPOSED."
