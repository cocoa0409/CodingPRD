  # ===========================================================================
  - section: endpoints
    instances:
      - name: index_resolve_selector_determinism
        claim_type: computed_read
        grounds: ["endpoints: GET /price-index-publications/resolve", calculations.delivered_price]
        distinguishing_aspect: "Selector pinning: resolve returns the publication with the GREATEST effective_date <= on_date — on 2026-08-05 it returns the 95000 publication, on 2026-08-10 the 98000 one."
        test_recipe:
          setup: ["two MT_BELVIEU publications: 95000 eff 2026-08-01, 98000 eff 2026-08-10"]
          setup_api_calls:
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-01", price_mc_per_gal: 95000 }, as: PricingDesk }
            - { call: "POST /price-index-publications", payload: { index_name: "MT_BELVIEU", effective_date: "2026-08-10", price_mc_per_gal: 98000 }, as: PricingDesk }
          trigger:
            - { call: "GET /price-index-publications/resolve", payload: { index_name: "MT_BELVIEU", on_date: "2026-08-05" }, as: PricingDesk, captures: { p1: $.data.price_mc_per_gal } }
            - { call: "GET /price-index-publications/resolve", payload: { index_name: "MT_BELVIEU", on_date: "2026-08-10" }, as: PricingDesk, captures: { p2: $.data.price_mc_per_gal } }
          assert:
            - "resolve on 2026-08-05 returns price_mc_per_gal == 95000 (boundary: effective_date <= on_date, greatest wins)"
            - "resolve on 2026-08-10 returns price_mc_per_gal == 98000 (effective date itself inclusive)"
      - name: ops_epoch_advances_all_sweeps
        claim_type: action_endpoint
        grounds: ["endpoints: POST /ops/run_epoch", state_machines.ColdSnapEvent, state_machines.DealerContract, state_machines.SupplyContract]
        distinguishing_aspect: "One epoch call fires every dated sweep at once and reports exact counts: cold snap auto-activates at start_date, expired dealer contract flips EXPIRED, short-supplied contract flips DEFAULTED and its TENDERED shipment is CANCELLED."
        test_recipe:
          setup:
            - "clock 2026-08-01; terminal; cold snap DECLARED start 2026-08-01; dealer contract ACTIVE with window_end 2026-07-31; supply contract ACTIVE receipt window ended 2026-07-31 with delivered 0 and one TENDERED shipment"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /terminals"
              payload: { name: "T-N2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /supply-contracts"
              payload: { terminal_id: "${term}", supplier_name: "SUP", contracted_volume_gal: 600000, receipt_window_start: "2026-06-01", receipt_window_end: "2026-07-31" }
              as: SupplyAdmin
              captures: { sc: $.data.id }
            - { call: "POST /supply-contracts/${sc}/activate", payload: {}, as: SupplyAdmin }
            - call: "POST /rail-shipments"
              payload: { supply_contract_id: "${sc}", volume_gal: 100000, railcar_count: 5, scheduled_arrival_date: "2026-07-15" }
              as: SupplyAdmin
              captures: { ship: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer N2", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-06-01", window_end: "2026-07-31" }
              as: CreditManager
              captures: { dc: $.data.id }
            - { call: "POST /dealer-contracts/${dc}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
            - call: "POST /cold-snap-events"
              payload: { terminal_id: "${term}", severity: "WATCH", start_date: "2026-08-01", end_date: "2026-08-20" }
              as: SupplyPlanner
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /ops/run_epoch"
              payload: {}
              as: SystemAdmin
              captures: { csa: $.data.cold_snaps_activated, dce: $.data.dealer_contracts_expired, scd: $.data.supply_contracts_defaulted, shc: $.data.shipments_cancelled }
            - { call: "GET /cold-snap-events/${cs}", as: SupplyPlanner, captures: { csst: $.data.status } }
            - { call: "GET /dealer-contracts/${dc}", as: CreditManager, captures: { dcst: $.data.status } }
            - { call: "GET /supply-contracts/${sc}", as: SupplyAdmin, captures: { scst: $.data.status } }
            - { call: "GET /rail-shipments/${ship}", as: SupplyAdmin, captures: { shst: $.data.status } }
            - { call: "GET /terminals/${term}", as: SupplyPlanner, captures: { post: $.data.allocation_posture, ep: $.data.ops_epoch } }
          assert:
            - "response counts: cold_snaps_activated == 1, dealer_contracts_expired == 1, supply_contracts_defaulted == 1, shipments_cancelled == 1, cold_snaps_lifted == 0"
            - "ColdSnapEvent.${cs}.status == ACTIVE and terminal allocation_posture == CURTAILED (activation cascade fired inside the epoch)"
            - "DealerContract.${dc}.status == EXPIRED; SupplyContract.${sc}.status == DEFAULTED; RailShipment.${ship}.status == CANCELLED"
