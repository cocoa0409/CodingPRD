          trigger:
            - call: "GET /ood-placements/students/${stu_id}"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "PATCH /ood-placements/students/${stu_id}/medicaid-consent"
              payload: { medicaid_eligible: true, medicaid_consent_on_file: false }
              as: ParentGuardian
              as_user_id: "${stu_id}"
            - call: "GET /ood-placements/students/${stu_id}"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "PATCH /ood-placements/students/${stu_id}/medicaid-consent"
              payload: { medicaid_eligible: true, medicaid_consent_on_file: false }
              as: ParentGuardian
              as_user_id: "${stu_id}"
            - call: "GET /ood-placements/students/${stu_id}"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "Trigger 1 returns version == 1 - creation starts the counter at 1, not 0"
            - "Trigger 2 returns version == 2 with medicaid_eligible == true"
            - "Trigger 3 returns version == 2 - the GET did not advance it"
            - "Trigger 4 returns version == 3 even though the payload is byte-identical to trigger 2"
            - "Trigger 5 returns version == 3"
            - "created_at is identical across all five responses while updated_at advances at triggers 2 and 4"
      - name: three_level_cascade_from_payment_to_the_student_rollup
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
          - "endpoints.POST_tuition_invoices_approve_payment"
          - "entities.Student.fields.projected_state_recovery_cents"
        excluded_because:
          difficulty_instance: payment_rollup_crosses_high_cost_trigger_and_creates_claim_then_student_rollup
          rationale: "CASCADE-B LINK 0..LINK 4 - invoice, fiscal account, placement.paid_total_ytd_cents, the auto-created HIGH_COST_FUND claim and finally Student.high_cost_flag plus projected_state_recovery_cents - is exactly what that §1.8 instance walks, asserting every link after a single approve-payment call."
      - name: cascade_ordering_is_sensitive_on_termination
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers"
          - "endpoints.POST_placements_terminate"
          - "entities.TransportationAssignment.status"
        excluded_because:
          difficulty_instance: terminate_frees_seat_then_promotes_waitlist_onto_a_second_placement
          rationale: "Ordering sensitivity is the whole point of that §1.8 instance: the seat must be released BEFORE the waitlist scan runs, otherwise the promotion finds a full route and the second placement never gets its seat. It asserts the post-cascade state of both assignments, the route and the fiscal account."
      - name: both_invoice_bases_and_the_delta_on_the_switch
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers"
          - "calculations.invoice_verified_amount.variants"
        excluded_because:
          difficulty_instance: invoice_enrollment_basis_versus_attendance_basis
          rationale: "That §1.8 instance verifies two invoices over identical attendance data on the two declared bases, pins both amounts as literals and asserts the 32229 delta, which is precisely the layer claim."
      - name: cumulative_high_cost_threshold_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers"
          - "calculations.funding_claim_reimbursable.constants"
          - "errors[ERR_HIGH_COST_THRESHOLD_NOT_MET]"
        excluded_because:
          difficulty_instance: payment_rollup_crosses_high_cost_trigger_and_creates_claim_then_student_rollup
          rationale: "The cumulative threshold is HIGH_COST_TRIGGER_CENTS against paid_total_ytd_cents, and that §1.8 instance drives the rollup to just below the trigger, asserts no claim exists, then crosses it with one more payment and asserts the auto-created claim."
      - name: instantaneous_variance_threshold_at_verification
        claim_type: rate_threshold_triggers
        grounds:
          - "complexity_profile.complexity_layers"
          - "calculations.invoice_verified_amount.constants"
          - "entities.TuitionInvoice.fields.verification_status"
        excluded_because:
          difficulty_instance: variance_tolerance_exclusive_at_0_0200_and_disputes_at_0_0201
          rationale: "The instantaneous threshold is VARIANCE_TOLERANCE_PCT evaluated on a single verify call, and that §1.8 instance tests the last passing amount, the first failing amount and the round-versus-raw trap in between."

  # ===========================================================================
  # Consistency Model - complexity_profile.consistency_model is `immediate`.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_from_payment_approval_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "endpoints.POST_tuition_invoices_approve_payment"
          - "entities.Placement.fields.paid_total_ytd_cents"
          - "entities.DistrictFiscalAccount.fields.disbursed_cents"
        distinguishing_aspect: |
          Under an immediate model there is no settling period and no re-read allowance: the single
          approve-payment response must already carry the settled figures, and the very next reads -
          issued with no clock advance and no retry - must show every downstream rollup already applied.
          The three reads target three different aggregates written by the same request (invoice,
          placement, fiscal account), so any deferred or queued recomputation shows up as a stale value
          in at least one of them.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01T08:00:00Z then 2026-11-02T09:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000, one ACTIVE DAY Placement with contract_encumbrance_cents 5760000, encumbered 5760000 and available 94240000."
