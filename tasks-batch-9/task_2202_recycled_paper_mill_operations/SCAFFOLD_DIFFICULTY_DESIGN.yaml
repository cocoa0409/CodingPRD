            - "PaperMachine.${pm3_id}.changeover_buffer_minutes == 0"

      - name: steam_header_half_open_waterfall_with_touching_reuse_after_release
        grounds:
          - calculations.steam_waterfall_dispatch
          - calculations.cogen_credit
          - validations.priority_69
          - errors.ERR_STEAM_HEADER_SATURATED
          - entities.SteamAllocation.fields.window_end
          - endpoints.POST_steam_allocations_release
        distinguishing_aspect: |
          Interval semantics: the steam header is HALF-OPEN and the overlap test is strict
          (window_start < requested.window_end AND window_end > requested.window_start), so a
          request beginning exactly at another allocation's window_end consumes nothing from it.
          The four-request sequence forces a full grant, a curtailed partial grant, a hard
          saturation rejection and a touching-endpoint full grant on the SAME header, and each
          outcome carries a different cogeneration credit because export_tph subtracts both
          `consumed` and the new grant. A closed-interval implementation curtails the touching
          request instead of granting it, which changes both granted_tph and cogen_credit_usd.
        test_recipe:
          setup:
            - "No fixture rows are needed: EVAPORATOR and DEINK_PLANT allocations carry a null consumer_ref_id, so the header can be probed on its own."
            - "The logical clock still reads 2026-08-01T00:00:00Z, so every window_start below satisfies the not-in-the-past rule (priority 65)."
            - "HEADER_CAPACITY_TPH is 180.000 and MIN_VIABLE_TPH is 5.000."
          setup_api_calls:
            - { call: "POST /steam-allocations", payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z", demand_tph: 120.000, priority_rank: 1 }, as: EnergyManager, as_user_id: "em_1", captures: { a1: "$.data.id" } }
            - { call: "POST /steam-allocations", payload: { consumer_kind: "DEINK_PLANT", window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z", demand_tph: 70.000, priority_rank: 2 }, as: EnergyManager, as_user_id: "em_1", captures: { a2: "$.data.id" } }
          trigger:
            - { call: "POST /steam-allocations", payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T09:30:00Z", window_end: "2026-08-01T10:30:00Z", demand_tph: 20.000, priority_rank: 3 }, as: EnergyManager, as_user_id: "em_1" }
            - { call: "POST /steam-allocations", payload: { consumer_kind: "DEINK_PLANT", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T13:00:00Z", demand_tph: 20.000, priority_rank: 1 }, as: EnergyManager, as_user_id: "em_1", captures: { a4: "$.data.id" } }
            - { call: "POST /steam-allocations/${a1}/release", payload: {}, as: EnergyManager, as_user_id: "em_1" }
            - { call: "POST /steam-allocations", payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T09:00:00Z", demand_tph: 150.000, priority_rank: 1 }, as: EnergyManager, as_user_id: "em_1", captures: { a5: "$.data.id" } }
          assert:
            - "SteamAllocation.${a1} after the setup: status == GRANTED, granted_tph == 120.000, curtailed_tph == 0.000, cogen_credit_usd == 1302.00 (export 60.000 over 4.0000 h: 492.0000 + 810.0000 + 0.0000)"
            - "SteamAllocation.${a2}: status == CURTAILED, granted_tph == 60.000, curtailed_tph == 10.000, cogen_credit_usd == 0.00 (export_tph is exactly 0.000, so every tier is zero)"
            - "the first trigger call returns HTTP 409 with data.error_id == \"ERR_STEAM_HEADER_SATURATED\" (consumed 180.000, remaining 0.000, so the remaining <= 0.000 branch fires before the sub-viable branch)"
            - "GET /steam-allocations?status=REQUESTED returns total_count == 0, so the rejected request left no row"
            - "the second trigger call returns HTTP 201 and SteamAllocation.${a4}: status == GRANTED, granted_tph == 20.000, curtailed_tph == 0.000, cogen_credit_usd == 1245.50 (touching 12:00 does not overlap, so consumed is 0.000 and export is 160.000: 123.0000 + 202.5000 + 920.0000)"
            - "the release call returns HTTP 200 and SteamAllocation.${a1}: status == RELEASED, granted_tph == 0.000, curtailed_tph == 120.000"
