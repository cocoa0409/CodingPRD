          rationale: "The named §1.8 instance runs the comparative decision on an empty candidate set and asserts this error id plus the untouched cycle state."

  # ===========================================================================
  # §1.7 RBAC — role_model segregation_of_duties.
  # The same-user-id prohibitions (a scorer running the decision, a deficiency
  # issuer scoring the same application) surface ERR_SEGREGATION_OF_DUTIES and
  # are already exercised in the validations section above; the instances here
  # cover the plain role-membership check at priority 2, which returns
  # ERR_UNAUTHORIZED (403) before any existence or state check runs.
  # ===========================================================================
  - section: rbac
    instances:

      - name: applicant_cannot_run_the_comparative_decision_returns_unauthorized
        claim_type: role_denied_operation
        grounds:
          - roles.Applicant
          - roles.DecisionOfficer.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /batching-cycles/{id}/comparative-decision lists only DecisionOfficer, so an Applicant caller is refused with ERR_UNAUTHORIZED (403) at priority 2 — ahead of the priority-26 score-sheet sufficiency rule that would otherwise reject this un-scored cycle."
        test_recipe:
          setup:
            - "One HSA, one formula, one applicant and one batching cycle exist; the cycle is in ANNOUNCED with no applications."
            - "The clock is the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /health-service-areas"
              payload: { code: "HSA-NORTH", name: "North Planning Area", population_projection: 54750, existing_licensed_beds: 70 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hsa_id: $.data.id }
            - call: "POST /state-plan-formulas"
              payload: { service_type: "ACUTE_CARE_BEDS", effective_from_date: "2026-01-01", use_rate_per_1000: 100.0, average_length_of_stay_days: 5.0, base_target_occupancy_rate: 0.75, high_volume_target_occupancy_rate: 0.85, high_volume_bed_threshold: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { formula_id: $.data.id }
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /batching-cycles"
              payload: { hsa_id: "${hsa_id}", formula_id: "${formula_id}", service_type: "ACUTE_CARE_BEDS", loi_deadline_at: "2026-08-10T00:00:00Z", application_deadline_at: "2026-08-20T00:00:00Z", comment_period_closes_at: "2026-08-25T00:00:00Z", intervention_deadline_at: "2026-08-28T00:00:00Z", completeness_deadline_at: "2026-09-05T00:00:00Z", decision_deadline_at: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { cycle_id: $.data.id, cycle_status: $.data.status }
          trigger:
            - call: "POST /batching-cycles/${cycle_id}/comparative-decision"
              payload: { decision_note: "Applicant attempts to decide its own batch" }
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { role_error: $.data.error_id }
          assert:
            - "${cycle_status} == ANNOUNCED"
            - "${role_error} == ERR_UNAUTHORIZED"
            - "HTTP status == 403"
            - "BatchingCycle.${cycle_id}.status == ANNOUNCED and decided_at == null"
            - "the response is ERR_UNAUTHORIZED and NOT ERR_INSUFFICIENT_SCORE_SHEETS or ERR_NO_ELIGIBLE_APPLICATIONS, proving priority 2 runs first"

      - name: review_analyst_cannot_issue_a_certificate_returns_unauthorized
        claim_type: role_denied_operation
        grounds:
          - roles.ReviewAnalyst
          - roles.DecisionOfficer.exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /certificates is exclusive to DecisionOfficer: a ReviewAnalyst is refused with ERR_UNAUTHORIZED (403) even when the referenced application_id does not exist at all, proving priority 2 precedes the priority-4 existence check."
        test_recipe:
          setup:
            - "One applicant exists; no application with id 55555555-5555-4555-8555-555555555555 has ever been created."
            - "The clock is the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
          trigger:
            - call: "POST /certificates"
              payload: { application_id: "55555555-5555-4555-8555-555555555555", approved_expenditure_limit_cents: 1000000000, implementation_milestone_date: "2027-06-30" }
              as: ReviewAnalyst
              as_user_id: "rev-1"
              captures: { role_error: $.data.error_id }
          assert:
            - "${role_error} == ERR_UNAUTHORIZED"
            - "HTTP status == 403"
            - "the response is NOT ERR_APPLICATION_NOT_FOUND, proving the role check at priority 2 precedes the existence check at priority 4"
            - "GET /certificates returns total_count 0"
            - "Applicant.${appl_a_id}.compliance_strike_count == 0"

      - name: public_participant_cannot_read_an_applicant_row_returns_unauthorized
        claim_type: role_denied_operation
        grounds:
          - roles.PublicParticipant
          - roles.Applicant.shared_operations
          - endpoints[GET /applicants/{id}]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "GET /applicants/{id} lists six roles but not PublicParticipant, so a commenter is refused with ERR_UNAUTHORIZED (403) on a row that the same-id Applicant reads successfully — the read side of the matrix is enforced per endpoint, not globally relaxed for GETs."
        test_recipe:
          setup:
            - "One applicant exists with standing GOOD and compliance_strike_count 0."
            - "The clock is the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { legal_name: "Northside Hospital", organization_type: "HOSPITAL", contact_email: "filings@northside.example" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { appl_a_id: $.data.id }
            - call: "GET /applicants/${appl_a_id}"
              as: Applicant
              as_user_id: "${appl_a_id}"
              captures: { own_standing: $.data.standing }
          trigger:
            - call: "GET /applicants/${appl_a_id}"
              as: PublicParticipant
              as_user_id: "public-1"
              captures: { role_error: $.data.error_id }
          assert:
            - "${own_standing} == GOOD (the shared operation succeeds with 200 for the Applicant role)"
            - "${role_error} == ERR_UNAUTHORIZED"
            - "HTTP status == 403"
            - "the same PublicParticipant caller reads GET /batching-cycles with 200, so the denial is endpoint-scoped rather than a blanket read ban"

