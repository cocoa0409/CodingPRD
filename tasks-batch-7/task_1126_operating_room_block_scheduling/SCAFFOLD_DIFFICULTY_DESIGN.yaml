# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — task_1126_operating_room_block_scheduling
# §1.8 Test Targeting Index: 9 Difficulty Rules x 2 instances each.
# All dates are UTC. Default logical clock before any set_current_utc call:
# 2026-05-01T00:00:00Z (a Friday). 2026-05-04 is a Monday (weekday => prime).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: case_duration_benchmark_vs_surgeon_adjusted
        grounds:
          - calculations.predicted_duration
          - calculations.benchmark_duration
          - calculations.surgeon_duration_bias
          - entities.CasePosting.fields.predicted_duration_minutes
          - entities.CasePosting.fields.benchmark_duration_minutes
        distinguishing_aspect: |
          Entity domain CasePosting/Surgeon: the same posted case carries two
          duration values from two valid algorithms — benchmark (procedure-class
          lookup, 90) and surgeon-adjusted (90 x bias 1.200 = 108) — which
          diverge once the surgeon has >= 5 completed cases.
        test_recipe:
          setup:
            - "Service line ORTHO (target 75), surgeon Dr. A, room OR1 (non-hybrid), coverage OR1 2026-05-04 [420,1200), ACTIVE block 2026-05-04 [420,1080)"
            - "Five STANDARD cases by Dr. A scheduled and completed with actual duration 108 min each (ratio 108/90 = 1.2) => surgeon.duration_bias_factor == 1.200"
            - "Packed starts: 420, 535, 650, 765, 880 (turnover 25 between STANDARD cases)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "ORTHO", target_utilization_pct: 75, release_deadline_hours: 72 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. A" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1", is_hybrid: false }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1080 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", patient_ref: "P1" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c1}/start", payload: { actual_start_minute: 420 }, as: CirculatorNurse }
            - { call: "POST /cases/${c1}/complete", payload: { actual_end_minute: 528 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", patient_ref: "P2" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c2}/start", payload: { actual_start_minute: 535 }, as: CirculatorNurse }
            - { call: "POST /cases/${c2}/complete", payload: { actual_end_minute: 643 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", patient_ref: "P3" }, as: Surgeon, as_user_id: "${sg}", captures: { c3: $.data.id } }
            - { call: "POST /cases/${c3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c3}/start", payload: { actual_start_minute: 650 }, as: CirculatorNurse }
            - { call: "POST /cases/${c3}/complete", payload: { actual_end_minute: 758 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", patient_ref: "P4" }, as: Surgeon, as_user_id: "${sg}", captures: { c4: $.data.id } }
            - { call: "POST /cases/${c4}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c4}/start", payload: { actual_start_minute: 765 }, as: CirculatorNurse }
            - { call: "POST /cases/${c4}/complete", payload: { actual_end_minute: 873 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", patient_ref: "P5" }, as: Surgeon, as_user_id: "${sg}", captures: { c5: $.data.id } }
            - { call: "POST /cases/${c5}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c5}/start", payload: { actual_start_minute: 880 }, as: CirculatorNurse }
            - { call: "POST /cases/${c5}/complete", payload: { actual_end_minute: 988 }, as: CirculatorNurse }
          trigger:
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE", patient_ref: "P6" }, as: Surgeon, as_user_id: "${sg}", captures: { c6: $.data.id, c6_pred: $.data.predicted_duration_minutes, c6_bench: $.data.benchmark_duration_minutes } }
          assert:
            - "CasePosting.${c6}.benchmark_duration_minutes == 90"
            - "CasePosting.${c6}.predicted_duration_minutes == 108"
            - "CasePosting.${c6}.predicted_duration_minutes != CasePosting.${c6}.benchmark_duration_minutes"
            - "GET /surgeons/${sg}.duration_bias_factor == 1.2"
            - "GET /surgeons/${sg}.completed_cases_count == 5"

      - name: utilization_prime_vs_raw_divergence
        grounds:
          - calculations.utilization_scoring
          - calculations.prime_window_overlap
          - entities.UtilizationReport.fields.prime_time_utilization_pct
          - entities.UtilizationReport.fields.raw_utilization_pct
        distinguishing_aspect: |
          Entity domain ServiceLine/UtilizationReport (distinct from Rule-1
          instance 1's CasePosting domain): one scoring run over identical data
          yields prime_time_utilization_pct == 45.00 (prime window, own blocks
          only) and raw_utilization_pct == 58.33 (all hours, all of the line's
          surgeons' cases) — two valid algorithms, two different numbers.
        test_recipe:
          setup:
            - "Service line CARD (target 75), surgeon Dr. P, rooms OR1/OR2 with coverage [420,1200) on 2026-05-01 (OR1) and 2026-05-02 (OR2)"
            - "Block A: OR1 Friday 2026-05-01 [420,1020) ACTIVE with 3 STANDARD cases at [420,510), [535,625), [650,740) => occupied_prime 270, allocated_prime 600"
            - "Block B: OR2 Saturday 2026-05-02 [480,960) ACTIVE with 4 STANDARD cases at [480,570), [595,685), [710,800), [825,915) => prime overlap 0 (weekend), raw occupied +360"
            - "allocated_raw = 1080, occupied_raw = 630; clock advanced to 2026-05-08 so period [2026-05-01, 2026-05-08) contains both blocks"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "CARD", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. P" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-01", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or2}", date: "2026-05-02", start_minute: 420, end_minute: 1200, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-01", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { bA: $.data.id } }
            - { call: "POST /blocks/${bA}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-02", start_minute: 480, end_minute: 960 }, as: SchedulingAdmin, captures: { bB: $.data.id } }
            - { call: "POST /blocks/${bB}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { a1: $.data.id } }
            - { call: "POST /cases/${a1}/schedule", payload: { block_id: "${bA}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { a2: $.data.id } }
            - { call: "POST /cases/${a2}/schedule", payload: { block_id: "${bA}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { a3: $.data.id } }
            - { call: "POST /cases/${a3}/schedule", payload: { block_id: "${bA}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sg}", captures: { w1: $.data.id } }
            - { call: "POST /cases/${w1}/schedule", payload: { block_id: "${bB}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sg}", captures: { w2: $.data.id } }
            - { call: "POST /cases/${w2}/schedule", payload: { block_id: "${bB}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sg}", captures: { w3: $.data.id } }
            - { call: "POST /cases/${w3}/schedule", payload: { block_id: "${bB}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sg}", captures: { w4: $.data.id } }
            - { call: "POST /cases/${w4}/schedule", payload: { block_id: "${bB}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
          trigger:
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin, captures: { reports_created: $.data.reports_created, reviews_created: $.data.reviews_created } }
          assert:
            - "trigger response .reports_created == 1"
            - "trigger response .reviews_created == 1  (45.00 < 75)"
            - "GET /service-lines/${sl}/utilization-reports [0].allocated_prime_minutes == 600"
            - "GET /service-lines/${sl}/utilization-reports [0].occupied_prime_minutes == 270"
            - "GET /service-lines/${sl}/utilization-reports [0].prime_time_utilization_pct == 45.00"
            - "GET /service-lines/${sl}/utilization-reports [0].raw_utilization_pct == 58.33"
            - "prime_time_utilization_pct (45.00) != raw_utilization_pct (58.33) for identical inputs"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: prime_time_occupancy_partial_window_overlap
        grounds:
          - calculations.prime_window_overlap
          - calculations.utilization_scoring
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (case interval, block interval, prime window
          bounds, weekday flag) with non-linear nested min/max interaction —
          a block [960,1200) straddling the 1020 prime boundary contributes
          exactly 60 allocated prime minutes and a case [960,1050) contributes
          exactly 60 occupied prime minutes, driving prime 100.00 vs raw 37.50.
        test_recipe:
          setup:
            - "Service line NEUR (target 75), surgeon, OR1 coverage 2026-05-04 [900,1260)"
            - "Block 2026-05-04 (Monday) [960,1200) ACTIVE: 240 total minutes, prime portion min(1200,1020)-max(960,420) = 60"
            - "One STANDARD case packed at [960,1050): prime overlap min(1050,1020)-960 = 60"
            - "Clock at 2026-05-08; period [2026-05-01, 2026-05-08)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "NEUR", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. N" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 900, end_minute: 1260, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 960, end_minute: 1200 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
          trigger:
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin, captures: { reviews_created: $.data.reviews_created } }
          assert:
            - "GET /service-lines/${sl}/utilization-reports [0].allocated_prime_minutes == 60"
            - "GET /service-lines/${sl}/utilization-reports [0].occupied_prime_minutes == 60"
            - "GET /service-lines/${sl}/utilization-reports [0].prime_time_utilization_pct == 100.00"
            - "GET /service-lines/${sl}/utilization-reports [0].raw_utilization_pct == 37.50  (90 / 240)"
            - "trigger response .reviews_created == 0  (100.00 is not below 75)"

      - name: per_case_rounding_governs_block_fit_boundary
        grounds:
          - calculations.surgeon_duration_bias
          - calculations.predicted_duration
          - calculations.block_packing_fit
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order (distinct from instance
          2a's mode (a)): ratios averaged unrounded then rounded to 3 decimals
          (933/900 = 1.03666... -> 1.037), then each case rounded individually
          (45 x 1.037 = 46.665 -> 47). Fit sums per-case rounded values:
          2 x 47 + 15 = 109 > 108-minute block. The alternative order
          (sum 45 x 1.037 x 2 = 93.33 -> 93, then + 15 = 108 <= 108) would
          wrongly fit — the two orders diverge by exactly one minute of fit.
        test_recipe:
          setup:
            - "Service line PLAS (target 75), surgeon Dr. R, OR1 with coverage 2026-05-04 [300,1440) and 2026-05-05 [420,1440)"
            - "Block B1 2026-05-04 [300,1440) ACTIVE; five COMPLEX cases completed with actual durations 186, 186, 187, 187, 187 (benchmark 180) => mean ratio 933/900 = 1.03666... -> bias 1.037"
            - "Case packing on B1: starts 300, 520, 740, 960, 1180 (turnover 40 for COMPLEX)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "PLAS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. R" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 300, end_minute: 1440, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-05", start_minute: 420, end_minute: 1440, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 300, end_minute: 1440 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "COMPLEX", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c1}/start", payload: { actual_start_minute: 300 }, as: CirculatorNurse }
            - { call: "POST /cases/${c1}/complete", payload: { actual_end_minute: 486 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "COMPLEX", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c2}/start", payload: { actual_start_minute: 520 }, as: CirculatorNurse }
            - { call: "POST /cases/${c2}/complete", payload: { actual_end_minute: 706 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "COMPLEX", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c3: $.data.id } }
            - { call: "POST /cases/${c3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c3}/start", payload: { actual_start_minute: 740 }, as: CirculatorNurse }
            - { call: "POST /cases/${c3}/complete", payload: { actual_end_minute: 927 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "COMPLEX", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c4: $.data.id } }
            - { call: "POST /cases/${c4}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c4}/start", payload: { actual_start_minute: 960 }, as: CirculatorNurse }
            - { call: "POST /cases/${c4}/complete", payload: { actual_end_minute: 1147 }, as: CirculatorNurse }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "COMPLEX", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c5: $.data.id } }
            - { call: "POST /cases/${c5}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c5}/start", payload: { actual_start_minute: 1180 }, as: CirculatorNurse }
            - { call: "POST /cases/${c5}/complete", payload: { actual_end_minute: 1367 }, as: CirculatorNurse }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-05", start_minute: 420, end_minute: 528 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { m1: $.data.id, m1_pred: $.data.predicted_duration_minutes } }
            - { call: "POST /cases/${m1}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { m2: $.data.id } }
          trigger:
            - { call: "POST /cases/${m2}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
          assert:
            - "CasePosting.${m1}.predicted_duration_minutes == 47  (round_half_up(45 * 1.037))"
            - "GET /surgeons/${sg}.duration_bias_factor == 1.037"
            - "trigger fails with ERR_CASE_DOES_NOT_FIT (packed end 482 + 47 = 529 > block end 528)"
            - "CasePosting.${m2}.status == POSTED (unchanged)"
            - "CasePosting.${m1}.scheduled_start_minute == 420"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: case_bumped_then_rescheduled_cycle
        grounds:
          - state_machines.CasePosting.SCHEDULED_to_BUMPED
          - state_machines.CasePosting.BUMPED_to_SCHEDULED
          - calculations.surgeon_padded_overlap_check
        distinguishing_aspect: |
          CasePosting has a cycle (SCHEDULED -> BUMPED -> SCHEDULED), unlike a
          linear pipeline: an emergent MINOR case needing [430,490) bumps the
          ELECTIVE case occupying padded [420,535), the victim returns to
          SCHEDULED via reschedule into a second block at 720 — and crucially
          the surviving successor case is NOT repacked (stays at 535), which
          distinguishes bump from cancel semantics.
        test_recipe:
          setup:
            - "Line GS (target 75), surgeons Dr. E (elective) and Dr. X (emergent), OR1 coverage 2026-05-04 [420,1200)"
            - "Block B1 OR1 2026-05-04 [420,720) ACTIVE with Dr. E's STANDARD cases e1 [420,510) and e2 [535,625)"
            - "Block B2 OR1 2026-05-04 [720,1020) ACTIVE (touching B1 at 720 — allowed)"
            - "Dr. X's EMERGENT MINOR case em posted (predicted 45, turnover 15)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "GS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. E" }, as: SchedulingAdmin, captures: { sge: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. X" }, as: SchedulingAdmin, captures: { sgx: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 720, end_minute: 1020 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sge}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sge}", captures: { e1: $.data.id } }
            - { call: "POST /cases/${e1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sge}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sge}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sge}", captures: { e2: $.data.id } }
            - { call: "POST /cases/${e2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sge}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sgx}", procedure_class: "MINOR", priority: "EMERGENT" }, as: Surgeon, as_user_id: "${sgx}", captures: { em: $.data.id } }
          trigger:
            - { call: "POST /cases/${em}/schedule", payload: { or_id: "${or1}", date: "2026-05-04", desired_start_minute: 430 }, as: Surgeon, as_user_id: "${sgx}" }
            - { call: "POST /cases/${e1}/reschedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sge}" }
          assert:
            - "after emergent schedule: CasePosting.${em}.status == SCHEDULED and .scheduled_start_minute == 430 and .scheduled_end_minute == 475"
            - "after emergent schedule: CasePosting.${e1}.status == BUMPED and .scheduled_start_minute == null"
            - "after emergent schedule: CasePosting.${e2}.status == SCHEDULED and .scheduled_start_minute == 535 (no repack on bump)"
            - "after reschedule: CasePosting.${e1}.status == SCHEDULED and .scheduled_start_minute == 720 and .block_id == ${b2}"
            - "cycle completed: POSTED -> SCHEDULED -> BUMPED -> SCHEDULED on ${e1}"

      - name: committee_review_reopen_cycle
        grounds:
          - state_machines.CommitteeReview.OPEN_to_DECIDED
          - state_machines.CommitteeReview.DECIDED_to_OPEN
          - calculations.vote_quorum_tally
        distinguishing_aspect: |
          CommitteeReview has a cycle (OPEN -> DECIDED -> OPEN -> DECIDED) on a
          different entity than instance 3a's CasePosting: a MAINTAIN decision
          can be reopened by the chair (clearing all votes and tallies), after
          which a fresh voting round produces a REDUCE decision.
        test_recipe:
          setup:
            - "Line ENT (target 75), surgeon, OR1 coverage 2026-05-04 [420,1200), ACTIVE block 2026-05-04 [420,1020) with one STANDARD case [420,510) => prime utilization 15.00 < 75"
            - "Scoring-run at clock 2026-05-08 creates CommitteeReview OPEN (version 1)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "ENT", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. T" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin, captures: { reviews_created: $.data.reviews_created } }
            - { call: "GET /committee-reviews?service_line_id=${sl}&status=OPEN", as: Any, captures: { rev: "$.data[0].id", rev_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${rev_v}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { v2: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${v2}" }, as: CommitteeMember, as_user_id: "cm_2", captures: { v3: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${v3}" }, as: CommitteeMember, as_user_id: "cm_3", captures: { v4: $.data.version, d1: $.data.decision, s1: $.data.status } }
            - { call: "POST /committee-reviews/${rev}/reopen", as: BlockCommitteeChair, captures: { v5: $.data.version } }
            - { call: "GET /committee-reviews/${rev}/votes", as: Any }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${v5}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { v6: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${v6}" }, as: CommitteeMember, as_user_id: "cm_2", captures: { v7: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${v7}" }, as: CommitteeMember, as_user_id: "cm_3", captures: { d2: $.data.decision } }
          assert:
            - "first round: status == DECIDED and decision == MAINTAIN (tally_maintain 2 >= tally_reduce 1)"
            - "after reopen: status == OPEN, decision == NONE, tally_reduce == 0, tally_maintain == 0, tally_abstain == 0"
            - "after reopen: GET /committee-reviews/${rev}/votes returns total_count == 0 (rows deleted)"
            - "second round: status == DECIDED and decision == REDUCE (tally_reduce 3 > tally_maintain 0)"
            - "cycle completed: OPEN -> DECIDED -> OPEN -> DECIDED on ${rev}"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: vote_quorum_reduce_cascades_blocks_to_slots
        grounds:
          - state_machines.CommitteeReview.OPEN_to_DECIDED
          - state_machines.BlockAllocation.ACTIVE_to_REDUCED
          - calculations.block_reduction_trim
          - calculations.vote_quorum_tally
        distinguishing_aspect: |
          Depth-3 chain from the vote trigger: third REDUCE vote mutates the
          review (OPEN -> DECIDED/REDUCE); the decision mutates every future
          ACTIVE block of the line (end_minute shrunk to floor(0.9 * original));
          each block mutation creates an OpenTimeSlot from the trimmed tail.
          Vote -> review -> blocks -> slots: each hop caused by the previous.
        test_recipe:
          setup:
            - "Line VASC (target 75); period block OR1 2026-05-04 [420,1020) with one STANDARD case => prime 15.00 < 75; review OPEN at clock 2026-05-08 (period_end 2026-05-08)"
            - "Future blocks dated after period_end: B1 OR1 2026-05-11 [480,1080) ACTIVE (600 min), B2 OR2 2026-05-11 [420,720) ACTIVE (300 min)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "VASC", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. V" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b0: $.data.id } }
            - { call: "POST /blocks/${b0}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c0: $.data.id } }
            - { call: "POST /cases/${c0}/schedule", payload: { block_id: "${b0}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-11", start_minute: 480, end_minute: 1080 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-11", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin }
            - { call: "GET /committee-reviews?service_line_id=${sl}&status=OPEN", as: Any, captures: { rev2: "$.data[0].id", rev_v: "$.data[0].version" } }
          trigger:
            - { call: "POST /committee-reviews/${rev2}/votes", payload: { vote: "REDUCE", expected_review_version: "${rev_v}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { w1: $.data.version } }
            - { call: "POST /committee-reviews/${rev2}/votes", payload: { vote: "REDUCE", expected_review_version: "${w1}" }, as: CommitteeMember, as_user_id: "cm_2", captures: { w2: $.data.version } }
            - { call: "POST /committee-reviews/${rev2}/votes", payload: { vote: "REDUCE", expected_review_version: "${w2}" }, as: CommitteeMember, as_user_id: "cm_3", captures: { w3: $.data.version, dec: $.data.decision, st: $.data.status } }
          assert:
            - "third vote response: status == DECIDED and decision == REDUCE"
            - "BlockAllocation.${b1}.status == REDUCED and .end_minute == 1020  (480 + floor(0.9 * 600))"
            - "BlockAllocation.${b2}.status == REDUCED and .end_minute == 690  (420 + floor(0.9 * 300))"
            - "GET /open-time-slots?block_id=${b1} [0].start_minute == 1020 and .original_minutes == 60 and .status == OPEN"
            - "GET /open-time-slots?block_id=${b2} [0].original_minutes == 30  (tail 720-690 == 30 >= MIN_SLOT_MINUTES)"
            - "period block ${b0} unchanged: status == ACTIVE (date 2026-05-04 is not after period_end)"

      - name: case_cancel_repack_firstcase_cascade
        grounds:
          - state_machines.CasePosting.SCHEDULED_to_CANCELLED
          - calculations.block_packing_fit
          - entities.CasePosting.fields.is_first_case_of_day
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (cancellation, not a vote):
          cancelling the first case mutates sibling cases (repack shifts their
          starts), and the repack itself re-derives which case is first of the
          room-day — the surviving successor's is_first_case_of_day flips to
          true purely as a consequence of the repack.
        test_recipe:
          setup:
            - "Line URO (target 75), surgeon Dr. U, OR1 coverage 2026-05-04 [420,1200), ACTIVE block [420,720)"
            - "c1 MINOR at [420,465), c2 STANDARD at [490,580), c3 STANDARD at [605,695); c1 is first case of the room-day"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "URO", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. U" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "MINOR", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c3: $.data.id } }
            - { call: "POST /cases/${c3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
          trigger:
            - { call: "POST /cases/${c1}/cancel", as: Surgeon, as_user_id: "${sg}" }
          assert:
            - "CasePosting.${c1}.status == CANCELLED"
            - "CasePosting.${c2}.scheduled_start_minute == 420 (repacked to block start)"
            - "CasePosting.${c2}.is_first_case_of_day == true (rederived by the repack)"
            - "CasePosting.${c3}.scheduled_start_minute == 535 (420 + 90 + turnover 25)"
            - "BlockAllocation.${b1}.occupied_minutes == 205 (90 + 90 + 25)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_fit_error_on_schedule
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_CASE_NOT_SCHEDULABLE]
          - errors[ERR_CASE_DOES_NOT_FIT]
        distinguishing_aspect: |
          Category pair state vs business_constraint: the case is IN_PROGRESS
          (state violation, priority 7) AND the 80-minute target block cannot
          fit a 90-minute case (business_constraint violation, priority 9) —
          the state error ERR_CASE_NOT_SCHEDULABLE must win.
        test_recipe:
          setup:
            - "Line OMFS (target 75), surgeon Dr. O, OR1 and OR2 each with coverage 2026-05-04 [420,1200)"
            - "Block B1 OR1 [420,720) ACTIVE with Dr. O's STANDARD case c started (IN_PROGRESS, actual start 420)"
            - "Block B2 OR2 [420,500) ACTIVE (80 minutes — too small for a 90-minute case)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "OMFS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. O" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 500 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases/${c1}/start", payload: { actual_start_minute: 420 }, as: CirculatorNurse }
          trigger:
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_CASE_NOT_SCHEDULABLE (not ERR_CASE_DOES_NOT_FIT, not ERR_SURGEON_DOUBLE_BOOKED)"
            - "CasePosting.${c1}.status == IN_PROGRESS (unchanged)"

      - name: anesthesia_error_beats_block_ownership_mismatch
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_NO_ANESTHESIA_COVERAGE]
          - errors[ERR_BLOCK_SERVICE_MISMATCH]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential (distinct from
          instance 5a's state vs business_constraint): scheduling into another
          surgeon's block with NO anesthesia coverage violates both priority 8
          (safety) and priority 10 (referential) — the safety error
          ERR_NO_ANESTHESIA_COVERAGE must win.
        test_recipe:
          setup:
            - "Lines CT (target 75) and GS2 (target 75); Dr. A in CT; Dr. B in GS2; OR1 with NO anesthesia coverage on 2026-05-04"
            - "Block B belongs to Dr. B specifically (surgeon_id = Dr. B), OR1 2026-05-04 [420,720) ACTIVE"
            - "Case x posted by Dr. A (STANDARD)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "CT", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl1: $.data.id } }
            - { call: "POST /service-lines", payload: { name: "GS2", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl2: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl1}", full_name: "Dr. A" }, as: SchedulingAdmin, captures: { sga: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl2}", full_name: "Dr. B" }, as: SchedulingAdmin, captures: { sgb: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl2}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720, surgeon_id: "${sgb}" }, as: SchedulingAdmin, captures: { bb: $.data.id } }
            - { call: "POST /blocks/${bb}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sga}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sga}", captures: { x: $.data.id } }
          trigger:
            - { call: "POST /cases/${x}/schedule", payload: { block_id: "${bb}" }, as: Surgeon, as_user_id: "${sga}", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_NO_ANESTHESIA_COVERAGE (not ERR_BLOCK_SERVICE_MISMATCH)"
            - "CasePosting.${x}.status == POSTED (unchanged)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: utilization_exactly_at_target_opens_no_review
        grounds:
          - calculations.utilization_scoring
        distinguishing_aspect: |
          Metric: utilization percentage; endpoint: POST /ops/scoring-run.
          Strict less-than boundary: prime_time_utilization_pct == 75.00 with
          target 75 does NOT open a review (450 / 600 == exactly 75.00).
        test_recipe:
          setup:
            - "Line IR (target 75), surgeon Dr. I, OR1 coverage 2026-05-01 [420,1200)"
            - "Block Friday 2026-05-01 [420,1020) ACTIVE (600 prime minutes) with 5 STANDARD cases: 450 occupied prime minutes"
            - "Case starts 420, 535, 650, 765, 880; clock at 2026-05-08"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "IR", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. I" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-01", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-01", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { k1: $.data.id } }
            - { call: "POST /cases/${k1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { k2: $.data.id } }
            - { call: "POST /cases/${k2}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { k3: $.data.id } }
            - { call: "POST /cases/${k3}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { k4: $.data.id } }
            - { call: "POST /cases/${k4}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { k5: $.data.id } }
            - { call: "POST /cases/${k5}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
          trigger:
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin, captures: { rc: $.data.reports_created, vc: $.data.reviews_created } }
          assert:
            - "trigger response .reports_created == 1"
            - "trigger response .reviews_created == 0  (75.00 is not strictly below 75)"
            - "GET /service-lines/${sl}/utilization-reports [0].prime_time_utilization_pct == 75.00"
            - "GET /committee-reviews?service_line_id=${sl} returns total_count == 0"

      - name: slot_fragment_below_30_absorbed_at_approval
        grounds:
          - calculations.reallocation_selector
          - state_machines.OpenTimeSlot.OPEN_to_CLAIMED
        distinguishing_aspect: |
          Metric: slot minutes (integer count), endpoint: POST /ops/release-sweep
          — distinct metric and endpoint from instance 6a. Approval leaving
          remainder 25 (< 30 MIN_SLOT_MINUTES) forfeits the fragment and
          CLAIMs the slot; remainder exactly 30 (>= 30) keeps the slot OPEN.
        test_recipe:
          setup:
            - "Line TX (target 75), owner surgeon Dr. S and requesting surgeon Dr. Q (same line, no reports => tier1)"
            - "OR1 coverage 2026-05-04 [420,1200); OR2 coverage 2026-05-04 [420,1200)"
            - "Block B1 OR1 [420,595) ACTIVE with one STANDARD case ending 510 => manual release creates slot S1 [510,595) of 85 minutes"
            - "Block B2 OR2 [600,780) ACTIVE with one STANDARD case at [600,690) => manual release creates slot S2 [690,780) of 90 minutes (B2 starts later so Dr. S's padded intervals across rooms never intersect)"
            - "Dr. Q posts MINOR cases x1, x2 (predicted 45, turnover 15, needed 60) and files requests r1 -> S1, r2 -> S2"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "TX", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. S" }, as: SchedulingAdmin, captures: { sgs: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. Q" }, as: SchedulingAdmin, captures: { sgq: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 595 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-04", start_minute: 600, end_minute: 780 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sgs}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgs}", captures: { d1: $.data.id } }
            - { call: "POST /cases/${d1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sgs}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sgs}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgs}", captures: { d2: $.data.id } }
            - { call: "POST /cases/${d2}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sgs}" }
            - { call: "POST /blocks/${b1}/release", as: SchedulingAdmin }
            - { call: "POST /blocks/${b2}/release", as: SchedulingAdmin }
            - { call: "GET /open-time-slots?block_id=${b1}", as: Any, captures: { s1: "$.data[0].id" } }
            - { call: "GET /open-time-slots?block_id=${b2}", as: Any, captures: { s2: "$.data[0].id" } }
            - { call: "POST /cases", payload: { surgeon_id: "${sgq}", procedure_class: "MINOR", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sgq}", captures: { x1: $.data.id } }
            - { call: "POST /cases", payload: { surgeon_id: "${sgq}", procedure_class: "MINOR", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sgq}", captures: { x2: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { slot_id: "${s1}", case_id: "${x1}" }, as: Surgeon, as_user_id: "${sgq}", captures: { r1: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { slot_id: "${s2}", case_id: "${x2}" }, as: Surgeon, as_user_id: "${sgq}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /ops/release-sweep", as: SchedulingAdmin, captures: { approved: $.data.requests_approved } }
          assert:
            - "trigger response .requests_approved == 2"
            - "OpenTimeSlot.${s1}.status == CLAIMED and .remaining_minutes == 0 and .forfeited_minutes == 25  (85 - 60 = 25 < 30)"
            - "OpenTimeSlot.${s2}.status == OPEN and .remaining_minutes == 30 and .forfeited_minutes == 0  (90 - 60 = 30, not < 30)"
            - "CasePosting.${x1}.status == SCHEDULED and .scheduled_start_minute == 510"
            - "CasePosting.${x2}.status == SCHEDULED and .scheduled_start_minute == 690"
            - "ReallocationRequest.${r1}.status == APPROVED and ReallocationRequest.${r2}.status == APPROVED"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_requires_active_full_span_anesthesia_coverage
        grounds:
          - state_machines.CasePosting.POSTED_to_SCHEDULED
          - state_machines.AnesthesiaCoverage.ACTIVE_to_WITHDRAWN
          - errors[ERR_NO_ANESTHESIA_COVERAGE]
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair CasePosting -> AnesthesiaCoverage: scheduling is gated by
          a DIFFERENT entity's state — no coverage fails, a partial-span ACTIVE
          coverage [450,700) fails (must contain [420,510+25)), and only the
          full-span ACTIVE coverage allows the transition.
        test_recipe:
          setup:
            - "Line CTS (target 75), surgeon Dr. C, OR1, ACTIVE block 2026-05-04 [420,720)"
            - "Case p STANDARD posted (would pack to [420,510), occupation incl. turnover [420,535))"
            - "No coverage exists initially"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "CTS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. C" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { p: $.data.id } }
          trigger:
            - { call: "POST /cases/${p}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}", captures: { err1: $.data.error_id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 450, end_minute: 700, provider_ref: "AN-PARTIAL" }, as: AnesthesiaCoordinator, captures: { cov1: $.data.id } }
            - { call: "POST /cases/${p}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}", captures: { err2: $.data.error_id } }
            - { call: "POST /anesthesia-coverages/${cov1}/withdraw", as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN-FULL" }, as: AnesthesiaCoordinator }
            - { call: "POST /cases/${p}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
          assert:
            - "first schedule fails with error_id == ERR_NO_ANESTHESIA_COVERAGE (no coverage rows)"
            - "second schedule fails with error_id == ERR_NO_ANESTHESIA_COVERAGE (partial span [450,700) does not contain [420,535))"
            - "third schedule succeeds: CasePosting.${p}.status == SCHEDULED and .scheduled_start_minute == 420"
            - "AnesthesiaCoverage.${cov1}.status == WITHDRAWN (withdrawn coverages never satisfy the guard)"

      - name: vote_requires_review_open_state
        grounds:
          - state_machines.CommitteeReview.OPEN_to_DECIDED
          - errors[ERR_REVIEW_NOT_OPEN]
          - validations[priority=7]
        distinguishing_aspect: |
          Entity pair CommitteeVote -> CommitteeReview (distinct from instance
          7a's CasePosting -> AnesthesiaCoverage): a vote cast after the review
          auto-DECIDED at quorum is rejected with ERR_REVIEW_NOT_OPEN — the
          child write is gated by the parent's state, and the state check fires
          before the OCC version check even with a correct version.
        test_recipe:
          setup:
            - "Line MIS (target 75); block OR1 2026-05-04 [420,1020) with one STANDARD case => prime 15.00 < 75; review OPEN after scoring-run at clock 2026-05-08"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "MIS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. M" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin }
            - { call: "GET /committee-reviews?service_line_id=${sl}&status=OPEN", as: Any, captures: { rev: "$.data[0].id", rv0: "$.data[0].version" } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${rv0}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { rv1: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${rv1}" }, as: CommitteeMember, as_user_id: "cm_2", captures: { rv2: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${rv2}" }, as: CommitteeMember, as_user_id: "cm_3", captures: { rv3: $.data.version } }
          trigger:
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${rv3}" }, as: CommitteeMember, as_user_id: "cm_4", captures: { err: $.data.error_id } }
          assert:
            - "trigger fails with error_id == ERR_REVIEW_NOT_OPEN (state check precedes the version check)"
            - "CommitteeReview.${rev}.status == DECIDED and .decision == MAINTAIN"
            - "CommitteeReview.${rev}.tally_reduce == 0 (fourth vote not recorded)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: block_adjacency_allowed_overlap_rejected
        grounds:
          - calculations.block_overlap_check
          - errors[ERR_BLOCK_TIME_OVERLAP]
          - entities.OperatingRoom
        distinguishing_aspect: |
          Resource OperatingRoom, semantics half-open [start,end) with no
          buffer: a block starting exactly at another's end (720 == 720) is
          accepted, while a one-minute overlap (719 < 720) is rejected.
        test_recipe:
          setup:
            - "Line HPB (target 75); OR1; block B1 2026-05-04 [480,720) in DRAFT (overlap check includes DRAFT)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "HPB", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 480, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 720, end_minute: 960 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 719, end_minute: 900 }, as: SchedulingAdmin, captures: { err: $.data.error_id } }
          assert:
            - "adjacent block created: BlockAllocation.${b2}.status == DRAFT (touching intervals allowed)"
            - "overlapping block fails with error_id == ERR_BLOCK_TIME_OVERLAP (719 < 720)"

      - name: surgeon_padded_overlap_across_rooms
        grounds:
          - calculations.surgeon_padded_overlap_check
          - errors[ERR_SURGEON_DOUBLE_BOOKED]
          - entities.Surgeon
        distinguishing_aspect: |
          Resource Surgeon (distinct from instance 8a's OperatingRoom),
          semantics turnover-PADDED intervals (distinct from 8a's unpadded
          half-open): a second case at 520 collides with the first case's
          padded [420,535) across different rooms, while 535 exactly touches
          the padded boundary and is allowed.
        test_recipe:
          setup:
            - "Line SCTS (target 75), surgeon Dr. S, OR1 + OR2 with coverage 2026-05-04 [420,1200) each"
            - "B1 OR1 [420,720) ACTIVE with Dr. S's STANDARD case c1 at [420,510), padded to [420,535)"
            - "B2 OR2 [520,700) ACTIVE (would pack c2 at 520)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "SCTS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. S" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR2" }, as: SchedulingAdmin, captures: { or2: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or2}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN2" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 720 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-04", start_minute: 520, end_minute: 700 }, as: SchedulingAdmin, captures: { b2: $.data.id } }
            - { call: "POST /blocks/${b2}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b2}" }, as: Surgeon, as_user_id: "${sg}", captures: { err: $.data.error_id } }
            - { call: "POST /blocks/${b2}/cancel", as: SchedulingAdmin }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or2}", date: "2026-05-04", start_minute: 535, end_minute: 960 }, as: SchedulingAdmin, captures: { b3: $.data.id } }
            - { call: "POST /blocks/${b3}/activate", as: SchedulingAdmin }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b3}" }, as: Surgeon, as_user_id: "${sg}" }
          assert:
            - "first schedule fails with error_id == ERR_SURGEON_DOUBLE_BOOKED (padded [520,635) intersects padded [420,535))"
            - "CasePosting.${c2}.status == POSTED after rejection"
            - "second schedule succeeds: CasePosting.${c2}.scheduled_start_minute == 535 (touching the padded boundary is allowed)"
            - "BlockAllocation.${b2}.status == CANCELLED (cancelled blocks free the room for re-creation)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: room_minute_ledger_conserved_through_release_and_claim
        grounds:
          - state_machines.BlockAllocation.ACTIVE_to_RELEASED
          - entities.BlockAllocation.fields.original_minutes
          - entities.BlockAllocation.fields.reserved_minutes
          - entities.OpenTimeSlot.fields.original_minutes
        distinguishing_aspect: |
          Conserved quantity: room-minute ledger. For every block,
          original_minutes == reserved_minutes + sum(derived slots'
          original_minutes) + forfeited_minutes holds before and after release
          AND after a reallocation claim (claim moves minutes inside the slot:
          original unchanged, remaining shrinks) — 600 == 205 + 395 + 0
          throughout.
        test_recipe:
          setup:
            - "Line TTS (target 75), owner Dr. S, requester Dr. Q; OR1 coverage 2026-05-04 [420,1200)"
            - "Block B [420,1020) ACTIVE (original 600) with STANDARD cases c1 [420,510), c2 [535,625)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "TTS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. S" }, as: SchedulingAdmin, captures: { sgs: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. Q" }, as: SchedulingAdmin, captures: { sgq: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b: $.data.id } }
            - { call: "POST /blocks/${b}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sgs}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgs}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b}" }, as: Surgeon, as_user_id: "${sgs}" }
            - { call: "POST /cases", payload: { surgeon_id: "${sgs}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sgs}", captures: { c2: $.data.id } }
            - { call: "POST /cases/${c2}/schedule", payload: { block_id: "${b}" }, as: Surgeon, as_user_id: "${sgs}" }
          trigger:
            - { call: "POST /blocks/${b}/release", as: SchedulingAdmin, captures: { rel_status: $.data.status, rel_reserved: $.data.reserved_minutes } }
            - { call: "GET /open-time-slots?block_id=${b}", as: Any, captures: { s: "$.data[0].id" } }
            - { call: "POST /cases", payload: { surgeon_id: "${sgq}", procedure_class: "MINOR", priority: "ADD_ON" }, as: Surgeon, as_user_id: "${sgq}", captures: { x: $.data.id } }
            - { call: "POST /reallocation-requests", payload: { slot_id: "${s}", case_id: "${x}" }, as: Surgeon, as_user_id: "${sgq}", captures: { rq: $.data.id } }
            - { call: "POST /ops/release-sweep", as: SchedulingAdmin }
          assert:
            - "release response: status == RELEASED and reserved_minutes == 205 (625 - 420)"
            - "OpenTimeSlot.${s}.original_minutes == 395 (free tail [625,1020))"
            - "invariant after release: 600 == 205 + 395 + 0 (original == reserved + slot.original + forfeited)"
            - "after sweep claim: OpenTimeSlot.${s}.remaining_minutes == 335 (395 - 60) and .original_minutes == 395 (unchanged) and .status == OPEN"
            - "invariant after claim: 600 == 205 + 395 + 0 still holds"
            - "CasePosting.${x}.scheduled_start_minute == 625"

      - name: vote_tally_conserved_through_recast_and_reopen
        grounds:
          - calculations.vote_quorum_tally
          - state_machines.CommitteeReview.DECIDED_to_OPEN
          - entities.CommitteeVote
        distinguishing_aspect: |
          Conserved quantity: vote tally integrity (a count, distinct from
          instance 9a's minute ledger). At every step tally_reduce +
          tally_maintain + tally_abstain == number of CommitteeVote rows; a
          re-cast replaces the member's row (sum stays 2), and the
          compensating reopen action deletes all rows, returning the conserved
          sum to 0 == 0.
        test_recipe:
          setup:
            - "Line CRS (target 75); block OR1 2026-05-04 [420,1020) with one STANDARD case => prime 15.00 < 75; review OPEN after scoring-run at clock 2026-05-08 (version 1)"
          setup_api_calls:
            - { call: "POST /service-lines", payload: { name: "CRS", target_utilization_pct: 75 }, as: SchedulingAdmin, captures: { sl: $.data.id } }
            - { call: "POST /surgeons", payload: { service_line_id: "${sl}", full_name: "Dr. R" }, as: SchedulingAdmin, captures: { sg: $.data.id } }
            - { call: "POST /operating-rooms", payload: { room_name: "OR1" }, as: SchedulingAdmin, captures: { or1: $.data.id } }
            - { call: "POST /anesthesia-coverages", payload: { or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1200, provider_ref: "AN1" }, as: AnesthesiaCoordinator }
            - { call: "POST /blocks", payload: { service_line_id: "${sl}", or_id: "${or1}", date: "2026-05-04", start_minute: 420, end_minute: 1020 }, as: SchedulingAdmin, captures: { b1: $.data.id } }
            - { call: "POST /blocks/${b1}/activate", as: SchedulingAdmin }
            - { call: "POST /cases", payload: { surgeon_id: "${sg}", procedure_class: "STANDARD", priority: "ELECTIVE" }, as: Surgeon, as_user_id: "${sg}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/schedule", payload: { block_id: "${b1}" }, as: Surgeon, as_user_id: "${sg}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T00:00:00Z" }, as: SchedulingAdmin }
            - { call: "POST /ops/scoring-run", as: SchedulingAdmin }
            - { call: "GET /committee-reviews?service_line_id=${sl}&status=OPEN", as: Any, captures: { rev: "$.data[0].id", rv0: "$.data[0].version" } }
          trigger:
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "REDUCE", expected_review_version: "${rv0}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { u1: $.data.version } }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${u1}" }, as: CommitteeMember, as_user_id: "cm_2", captures: { u2: $.data.version } }
            - { call: "GET /committee-reviews/${rev}/votes", as: Any }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "MAINTAIN", expected_review_version: "${u2}" }, as: CommitteeMember, as_user_id: "cm_1", captures: { u3: $.data.version } }
            - { call: "GET /committee-reviews/${rev}/votes", as: Any }
            - { call: "POST /committee-reviews/${rev}/votes", payload: { vote: "ABSTAIN", expected_review_version: "${u3}" }, as: CommitteeMember, as_user_id: "cm_3", captures: { u4: $.data.version, dec: $.data.decision } }
            - { call: "POST /committee-reviews/${rev}/reopen", as: BlockCommitteeChair }
            - { call: "GET /committee-reviews/${rev}/votes", as: Any }
          assert:
            - "after two votes: tally_reduce 1 + tally_maintain 1 == 2 vote rows"
            - "after cm_1 re-cast: tally_reduce == 0, tally_maintain == 2, and still exactly 2 vote rows (row replaced, not added)"
            - "after ABSTAIN: total 3 >= quorum => status DECIDED, decision == MAINTAIN (maintain 2 > reduce 0)"
            - "after reopen (compensating action): tally_reduce == 0, tally_maintain == 0, tally_abstain == 0, and votes list total_count == 0"
            - "invariant restored: tally sum 0 == vote row count 0"
