  - section: endpoints
    instances:
      - name: workload_read_without_a_week_defaults_to_the_clock_iso_week
        claim_type: computed_read
        grounds:
          - endpoints[POST /scheduling/_clock/set_current_utc]
          - endpoints[GET /scheduling/staff-members/{staff_member_id}/workload]
          - calculations.effective_weekly_cap
        distinguishing_aspect: |
          Every temporal derivation reads the injected clock, and the ISO week of
          2026-08-01 (a Saturday) starts on the PREVIOUS Monday 2026-07-27, so the default
          workload window is 2026-07-27 — not the request date and not the following Monday.
        test_recipe:
          setup:
            - "The clock is pinned to the suite's baseline instant 2026-08-01T00:00:00Z."
            - "One DOMESTIC senior S1 with base_weekly_cap_hours 40.00 and no bookings."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
              captures: { wk: $.data.iso_week_start_date }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /scheduling/staff-members/${s1_id}/workload"
              payload: {}
              as: SchedulingManager
          assert:
            - "setup: ${wk} == '2026-07-27' and current_date == '2026-08-01'"
            - "trigger: HTTP 200 with response.data.week_start_date == '2026-07-27'"
            - "trigger: committed_hours == 0.00, logged_hours == 0.00, approved_waiver_hours == 0.00"
            - "trigger: effective_weekly_cap_hours == 50.00, daily_capacity_hours == 10.00, remaining_week_hours == 50.00"
            - "trigger: workload_status == 'GREEN', burnout_risk_score_actual == 0.00, burnout_risk_score_committed == 0.00, turnover_risk_band == 'LOW'"

