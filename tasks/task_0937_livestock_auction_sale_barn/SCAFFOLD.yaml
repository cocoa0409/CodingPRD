      - name: head
        type: integer
        source: computed
        description: "Copied from Lot.head_count."
      - name: weight_lb
        type: number
        source: computed
        description: "Copied from Lot.settle_weight_lb."
      - name: prorated_haul_amount
        type: number
        source: computed
        description: "Produced by calculation haul_proration (dual-variant)."
        default: 0

# ---------------------------------------------------------------------------
# §1.2 State Machine Table  — 16 axes, 15 of them non-linear.
# Lot carries TWO parallel axes (sale_status x custody_status) on one row.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Party
    axis: status
    shape: "bidirectional toggle"
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /sale-barn/parties/{id}/status with to_status=SUSPENDED"
        actor: BarnAdmin
        preconditions: ["Party.status == ACTIVE"]
        side_effects:
          - "Gate G4 now refuses every write owned by this party."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /sale-barn/parties/{id}/status with to_status=ACTIVE"
        actor: BarnAdmin
        preconditions: ["Party.status == SUSPENDED"]
        side_effects:
          - "Gate G4 stops firing for this party."

  - entity: SaleDay
    axis: status
    shape: "linear with one backward re-entry edge (BIDDING_CLOSED -> RINGING)"
    initial_state: SCHEDULED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECK_IN_OPEN
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=CHECK_IN_OPEN"
        actor: BarnAdmin
        preconditions: ["SaleDay.status == SCHEDULED"]
        side_effects: ["Consignments may now be created and checked in."]
      - from: CHECK_IN_OPEN
        to: RINGING
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=RINGING"
        actor: BarnAdmin
        preconditions: ["SaleDay.status == CHECK_IN_OPEN"]
        side_effects: ["Lots in READY may now enter the ring."]
      - from: RINGING
        to: BIDDING_CLOSED
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=BIDDING_CLOSED"
        actor: BarnAdmin
        preconditions: ["SaleDay.status == RINGING"]
        side_effects:
          - "Gate G3 activates: bids, hammer-downs, weigh captures, pen assignments, pen moves and lot creation are refused."
          - "Every Lot still in IN_RING keeps its state; closing does NOT finalize it (that is the close cascade's job)."
      - from: BIDDING_CLOSED
        to: RINGING
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=RINGING"
        actor: BarnAdmin
        preconditions: ["SaleDay.status == BIDDING_CLOSED"]
        side_effects:
          - "SaleDay.reopen_count increments by 1."
          - "Gate G3 deactivates."
        note: "This is the re-entry edge that makes the axis non-linear; it is how a lot gets re-rung after the ring was closed."
      - from: BIDDING_CLOSED
        to: SETTLED
        trigger: "POST /sale-barn/sale-days/{id}/close"
        actor: SettlementClerk
        preconditions: ["SaleDay.status == BIDDING_CLOSED"]
        side_effects:
          - "CASCADE hop 1 of 5. Freezes the sale day permanently (gate G3 stays on)."
          - "CASCADE hop 2 (caused by hop 1): every Lot of this sale day whose sale_status IN {DRAFT, PENNED, READY, IN_RING} transitions to NO_SALE; each such lot's WINNING Bid rows transition to VOIDED; rering_count is not touched."
          - "CASCADE hop 3 (caused by hop 2's lot finalization): every Consignment of this sale day whose status IN {CHECKED_IN, SORTED} recomputes head_sold / head_no_saled / head_in_lots and transitions to RECONCILED."
          - "BEFORE hop 4 runs, and in the order pinned by calculation settlement_offset, every BuyerInvoice of this sale day in DRAFT transitions to ISSUED: a BUYER_FEE ChargeLine is appended and buyer_fee / total_due / balance_due are computed, and every CONFIRMED Purchase on it transitions to INVOICED. The settlement offset in hop 5 reads those issued balances."
          - "CASCADE hop 4 (caused by hop 3's RECONCILED): one Settlement row is created per RECONCILED Consignment, status HELD with hold_reason AWAITING_FUNDS when Consignment.hold_until_funds is true, otherwise status DRAFT with hold_reason NONE."
          - "CASCADE hop 5 (caused by hop 4's Settlement creation): ChargeLine rows COMMISSION, YARDAGE, FEED, CHECKOFF_STATE, CHECKOFF_NATIONAL, BRAND_FEE and INDEMNITY_FEE are appended for that Settlement, and Settlement.commission_amount / yardage_amount / feed_amount / statutory_amount / brand_fee_amount / indemnity_fee_amount / offset_applied / net_amount are computed from them."
          - "SaleDay.total_gross_sale_value, total_buyer_invoiced, total_seller_net, total_barn_revenue, total_statutory_collected, gross_match_ok, money_reconciliation_ok, head_reconciliation_ok are recomputed."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=CANCELLED"
        actor: BarnAdmin
        preconditions: ["SaleDay.status IN {SCHEDULED, CHECK_IN_OPEN, RINGING, BIDDING_CLOSED}"]
        side_effects: ["Gate G1 activates and pre-empts every other gate for this sale day and all its children."]
      - from: CHECK_IN_OPEN
        to: CANCELLED
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=CANCELLED"
        actor: BarnAdmin
        preconditions: ["SaleDay.status IN {SCHEDULED, CHECK_IN_OPEN, RINGING, BIDDING_CLOSED}"]
        side_effects: ["Gate G1 activates."]
      - from: RINGING
        to: CANCELLED
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=CANCELLED"
        actor: BarnAdmin
        preconditions: ["SaleDay.status IN {SCHEDULED, CHECK_IN_OPEN, RINGING, BIDDING_CLOSED}"]
        side_effects: ["Gate G1 activates."]
      - from: BIDDING_CLOSED
        to: CANCELLED
        trigger: "POST /sale-barn/sale-days/{id}/advance with to_status=CANCELLED"
        actor: BarnAdmin
        preconditions: ["SaleDay.status IN {SCHEDULED, CHECK_IN_OPEN, RINGING, BIDDING_CLOSED}"]
        side_effects: ["Gate G1 activates."]

  - entity: Pen
    axis: status
    shape: "cyclic"
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system: first lot assigned to the pen (POST /sale-barn/lots/{id}/assign-pen, or POST /sale-barn/pen-moves/{id}/status with to_status=COMPLETED naming this pen as to_pen_id)"
        actor: system
        preconditions: ["Pen.current_head was 0 and becomes > 0"]
        side_effects: ["Pen.current_head recomputed per INV_PEN_OCCUPANCY."]
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system: last lot leaves the pen (completed pen move away, lot withdrawn, or POST /sale-barn/lots/{id}/release)"
        actor: system
        preconditions: ["Pen.current_head becomes 0"]
        side_effects: ["Pen.current_head recomputed per INV_PEN_OCCUPANCY."]
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /sale-barn/pens/{id}/status with to_status=OUT_OF_SERVICE"
        actor: BarnAdmin
        preconditions: ["Pen.status == AVAILABLE", "Pen.current_head == 0"]
        side_effects: ["The pen can no longer be an assign-pen or pen-move destination."]
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /sale-barn/pens/{id}/status with to_status=AVAILABLE"
        actor: BarnAdmin
        preconditions: ["Pen.status == OUT_OF_SERVICE"]
        side_effects: ["The pen becomes a legal destination again."]

  - entity: DroverCrew
    axis: duty_status
    shape: "cyclic bidirectional toggle"
    initial_state: OFF_DUTY
    terminal_states: []
    transitions:
      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "POST /sale-barn/drover-crews/{id}/duty with to_status=ON_DUTY"
        actor: YardOperator
        preconditions: ["DroverCrew.duty_status IN {OFF_DUTY, ON_BREAK}"]
        side_effects: ["The crew becomes dispatchable."]
      - from: ON_DUTY
        to: ON_BREAK
        trigger: "POST /sale-barn/drover-crews/{id}/duty with to_status=ON_BREAK"
        actor: YardOperator
        preconditions: ["DroverCrew.duty_status == ON_DUTY", "the crew has no PenMove with status == IN_PROGRESS"]
        side_effects: ["The crew stops being dispatchable but keeps its REQUESTED bookings."]
      - from: ON_BREAK
        to: ON_DUTY
        trigger: "POST /sale-barn/drover-crews/{id}/duty with to_status=ON_DUTY"
        actor: YardOperator
        preconditions: ["DroverCrew.duty_status IN {OFF_DUTY, ON_BREAK}"]
        side_effects: ["The crew becomes dispatchable again."]
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "POST /sale-barn/drover-crews/{id}/duty with to_status=OFF_DUTY"
        actor: YardOperator
        preconditions: ["DroverCrew.duty_status IN {ON_DUTY, ON_BREAK}", "the crew has no PenMove with status == IN_PROGRESS"]
        side_effects: ["The crew stops being dispatchable."]
      - from: ON_BREAK
        to: OFF_DUTY
        trigger: "POST /sale-barn/drover-crews/{id}/duty with to_status=OFF_DUTY"
        actor: YardOperator
        preconditions: ["DroverCrew.duty_status IN {ON_DUTY, ON_BREAK}", "the crew has no PenMove with status == IN_PROGRESS"]
        side_effects: ["The crew stops being dispatchable."]

  - entity: Consignment
    axis: status
    shape: "linear with a backward re-entry edge (SORTED -> CHECKED_IN)"
    initial_state: INTAKE
    terminal_states: [SETTLED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: CHECKED_IN
        trigger: "POST /sale-barn/consignments/{id}/check-in"
        actor: YardOperator
        preconditions:
          - "Consignment.status == INTAKE"
          - "SaleDay.status == CHECK_IN_OPEN"
        side_effects:
          - "Consignment.checked_in_at is set to the current logical clock; the yardage day count starts here."
      - from: CHECKED_IN
        to: SORTED
        trigger: "system: the consignment's head_unassigned reaches 0 through POST /sale-barn/lots and POST /sale-barn/consignments/{id}/losses"
        actor: system
        preconditions: ["Consignment.status == CHECKED_IN", "Consignment.head_unassigned == 0"]
        side_effects: ["The consignment is fully sorted into lots."]
      - from: SORTED
        to: CHECKED_IN
        trigger: "system: head_unassigned rises above 0 again because a lot was withdrawn (POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and a lot_id), returning that lot's head to the unassigned pool"
        actor: system
        preconditions: ["Consignment.status == SORTED", "Consignment.head_unassigned becomes > 0"]
        side_effects: ["The consignment re-opens for sorting."]
        note: "Re-entry edge; this is what makes the axis non-linear."
      - from: CHECKED_IN
        to: RECONCILED
        trigger: "system: CASCADE hop 3 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Consignment.status IN {CHECKED_IN, SORTED}", "SaleDay.status transitioned to SETTLED"]
        side_effects:
          - "head_sold, head_no_saled, head_in_lots and head_balance_ok are recomputed."
          - "CASCADE hop 4: a Settlement row is created for this consignment."
      - from: SORTED
        to: RECONCILED
        trigger: "system: CASCADE hop 3 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Consignment.status IN {CHECKED_IN, SORTED}", "SaleDay.status transitioned to SETTLED"]
        side_effects:
          - "head_sold, head_no_saled, head_in_lots and head_balance_ok are recomputed."
          - "CASCADE hop 4: a Settlement row is created for this consignment."
      - from: RECONCILED
        to: SETTLED
        trigger: "system: the consignment's Settlement transitions to RELEASED (POST /sale-barn/settlements/{id}/release)"
        actor: system
        preconditions: ["Consignment.status == RECONCILED"]
        side_effects: ["The consignment is closed out."]
      - from: INTAKE
        to: WITHDRAWN
        trigger: "POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and head equal to Consignment.head_unassigned and no lot_id"
        actor: Consignor
        preconditions: ["Consignment.status IN {INTAKE, CHECKED_IN}", "Consignment.head_unassigned == head requested", "Consignment.head_in_lots == 0"]
        side_effects: ["head_withdrawn increases by head; head_unassigned drops to 0."]
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and head equal to Consignment.head_unassigned and no lot_id"
        actor: Consignor
        preconditions: ["Consignment.status IN {INTAKE, CHECKED_IN}", "Consignment.head_unassigned == head requested", "Consignment.head_in_lots == 0"]
        side_effects: ["head_withdrawn increases by head; head_unassigned drops to 0."]
  - entity: Lot
    axis: sale_status
    shape: "cyclic with a capped retry loop (NO_SALE -> READY) plus a backward edge from SOLD"
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENNED
        trigger: "POST /sale-barn/lots/{id}/assign-pen"
        actor: YardOperator
        preconditions:
          - "Lot.sale_status == DRAFT"
          - "Pen.status != OUT_OF_SERVICE"
          - "Pen.species_class == Consignment.species_class"
          - "Pen.current_head + Lot.head_count <= Pen.head_capacity"
        side_effects:
          - "Lot.pen_id is set; Lot.penned_at is set to the current logical clock."
          - "Pen.current_head recomputed; Pen.status AVAILABLE -> OCCUPIED when it becomes > 0."
      - from: PENNED
        to: READY
        trigger: "POST /sale-barn/lots/{id}/mark-ready"
        actor: YardOperator
        preconditions:
          - "Lot.sale_status == PENNED"
          - "Lot.settle_weight_lb is not null"
          - "when Lot.livestock_class == BREEDING_BULL, an InspectionRecord of type TRICH_TEST on this lot has status CLEARED, inspected_head >= Lot.head_count and valid_through >= the clock date"
          - "when Lot.livestock_class == BREEDING_FEMALE, an InspectionRecord of type BRUCELLOSIS_TEST on this lot has status CLEARED, inspected_head >= Lot.head_count and valid_through >= the clock date"
        side_effects:
          - "Lot.ring_order is set to SaleDay.next_ring_order; SaleDay.next_ring_order increases by RING_ORDER_STEP."
      - from: READY
        to: IN_RING
        trigger: "POST /sale-barn/lots/{id}/enter-ring"
        actor: Auctioneer
        preconditions: ["Lot.sale_status == READY", "SaleDay.status == RINGING"]
        side_effects: ["Bids may now be recorded against the lot."]
      - from: IN_RING
        to: SOLD
        trigger: "POST /sale-barn/lots/{id}/hammer-down"
        actor: Auctioneer
        preconditions:
          - "Lot.sale_status == IN_RING"
          - "SaleDay.status == RINGING"
          - "the named Bid has status == WINNING and Bid.lot_id == Lot.id"
          - "Bid.unit_price >= Lot.reserve_price, unless buy_back is elected in the request"
          - "the request's expected_lot_version equals Lot.version"
        side_effects:
          - "Lot.hammer_price is set from Bid.unit_price; Lot.extended_amount computed; Lot.buy_back set."
          - "Lot.destination_state_code is set from the buying Party.origin_state_code."
          - "Lot.custody_status moves BARN -> BUYER_PEN on the parallel axis."
          - "The named Bid transitions WINNING -> HAMMERED."
          - "A Purchase row is created with status CONFIRMED."
          - "A BuyerInvoice row for (buyer_registration_id, sale_day_id) is created in DRAFT if absent; Purchase.buyer_invoice_id points at it; BuyerInvoice.subtotal recomputed."
          - "BuyerRegistration.open_purchase_amount / winning_bid_amount / exposure / available_credit recomputed."
          - "Lot.version increments by 1."
      - from: IN_RING
        to: NO_SALE
        trigger: "POST /sale-barn/lots/{id}/no-sale"
        actor: Auctioneer
        preconditions: ["Lot.sale_status == IN_RING"]
        side_effects:
          - "Every Bid on this lot with status == WINNING transitions to VOIDED."
          - "BuyerRegistration.winning_bid_amount / exposure recomputed for each affected buyer."
      - from: NO_SALE
        to: READY
        trigger: "POST /sale-barn/lots/{id}/re-ring"
        actor: Auctioneer
        preconditions:
          - "Lot.sale_status == NO_SALE"
          - "Lot.rering_count < MAX_RERING_COUNT (2)"
          - "SaleDay.status == RINGING"
        side_effects:
          - "Lot.rering_count increases by 1."
          - "Lot.ring_order is re-issued from SaleDay.next_ring_order; SaleDay.next_ring_order increases by RING_ORDER_STEP."
        note: "Capped retry loop; the third re-ring attempt is refused with ERR_RERING_LIMIT_EXCEEDED."
      - from: SOLD
        to: NO_SALE
        trigger: "system: POST /sale-barn/purchases/{id}/void"
        actor: system
        preconditions: ["Lot.sale_status == SOLD", "the voided Purchase.lot_id == Lot.id"]
        side_effects:
          - "Lot.hammer_price and Lot.extended_amount are cleared to null and 0."
          - "The HAMMERED Bid transitions to VOIDED."
          - "Lot.custody_status moves back to BARN on the parallel axis."
        note: "Backward edge out of an otherwise-final sale state; this is the compensating action for hammer-down."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and a lot_id"
        actor: Consignor
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, NO_SALE}"]
        side_effects:
          - "Consignment.head_unassigned increases by Lot.head_count; head_withdrawn is NOT touched."
          - "Lot leaves head_in_lots; Pen.current_head recomputed; the consignment may re-enter CHECKED_IN from SORTED."
      - from: PENNED
        to: WITHDRAWN
        trigger: "POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and a lot_id"
        actor: Consignor
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, NO_SALE}"]
        side_effects:
          - "Consignment.head_unassigned increases by Lot.head_count; head_withdrawn is NOT touched."
          - "Pen.current_head recomputed; Pen.status OCCUPIED -> AVAILABLE when it reaches 0; the consignment may re-enter CHECKED_IN from SORTED."
      - from: READY
        to: WITHDRAWN
        trigger: "POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and a lot_id"
        actor: Consignor
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, NO_SALE}"]
        side_effects: ["Consignment.head_unassigned increases by Lot.head_count; head_withdrawn is NOT touched; Pen.current_head recomputed; the consignment may re-enter CHECKED_IN from SORTED."]
      - from: NO_SALE
        to: WITHDRAWN
        trigger: "POST /sale-barn/consignments/{id}/losses with loss_type=WITHDRAWN and a lot_id"
        actor: Consignor
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, NO_SALE}"]
        side_effects: ["Consignment.head_unassigned increases by Lot.head_count; head_withdrawn is NOT touched; Pen.current_head recomputed; the consignment may re-enter CHECKED_IN from SORTED."]
      - from: DRAFT
        to: NO_SALE
        trigger: "system: CASCADE hop 2 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, IN_RING}", "SaleDay.status transitioned to SETTLED"]
        side_effects: ["Every WINNING Bid on the lot transitions to VOIDED; CASCADE hop 3 fires on the parent Consignment."]
      - from: PENNED
        to: NO_SALE
        trigger: "system: CASCADE hop 2 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, IN_RING}", "SaleDay.status transitioned to SETTLED"]
        side_effects: ["Every WINNING Bid on the lot transitions to VOIDED; CASCADE hop 3 fires on the parent Consignment."]
      - from: READY
        to: NO_SALE
        trigger: "system: CASCADE hop 2 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, IN_RING}", "SaleDay.status transitioned to SETTLED"]
        side_effects: ["Every WINNING Bid on the lot transitions to VOIDED; CASCADE hop 3 fires on the parent Consignment."]
      - from: IN_RING
        to: NO_SALE
        trigger: "system: CASCADE hop 2 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Lot.sale_status IN {DRAFT, PENNED, READY, IN_RING}", "SaleDay.status transitioned to SETTLED"]
        side_effects: ["Every WINNING Bid on the lot transitions to VOIDED; CASCADE hop 3 fires on the parent Consignment."]

  - entity: Lot
    axis: custody_status
    shape: "parallel axis on the same row as sale_status, with a revert edge (LOADED -> BUYER_PEN)"
    initial_state: BARN
    terminal_states: [RELEASED]
    transitions:
      - from: BARN
        to: BUYER_PEN
        trigger: "system: POST /sale-barn/lots/{id}/hammer-down"
        actor: system
        preconditions: ["Lot.custody_status == BARN", "Lot.sale_status transitioned to SOLD"]
        side_effects: ["The lot is now standing in the buyer's account; it still occupies its physical pen."]
      - from: BUYER_PEN
        to: BARN
        trigger: "system: POST /sale-barn/purchases/{id}/void"
        actor: system
        preconditions: ["Lot.custody_status == BUYER_PEN"]
        side_effects: ["Custody reverts to the barn together with the sale_status revert SOLD -> NO_SALE."]
      - from: BUYER_PEN
        to: LOADED
        trigger: "system: POST /sale-barn/load-manifests/{id}/dispatch"
        actor: system
        preconditions: ["Lot.custody_status == BUYER_PEN", "a LoadLine on the dispatched manifest names this lot"]
        side_effects: ["Pen.current_head recomputed for the lot's pen; the lot no longer counts against pen occupancy."]
      - from: LOADED
        to: BUYER_PEN
        trigger: "DELETE /sale-barn/load-manifests/{id}/lines/{line_id}"
        actor: Carrier
        preconditions: ["Lot.custody_status == LOADED", "LoadManifest.status IN {LOADING, DISPATCHED}"]
        side_effects:
          - "The LoadLine row is deleted; LoadManifest.loaded_head / loaded_weight_lb / haul_charge recomputed."
          - "Remaining LoadLine.prorated_haul_amount values are recomputed."
          - "LoadManifest.status LOADING -> PLANNED when the last line is removed."
          - "Pen.current_head recomputed for the lot's pen."
        note: "Revert edge; this is what makes the custody axis non-linear."
      - from: LOADED
        to: RELEASED
        trigger: "POST /sale-barn/lots/{id}/release"
        actor: YardOperator
        preconditions:
          - "Lot.custody_status == LOADED"
          - "Lot.quarantine_hold == false"
          - "a CLEARED, unexpired InspectionRecord of type BRAND covering Lot.head_count exists"
          - "when Lot.destination_state_code != SaleDay.barn_state_code, a CLEARED InspectionRecord of type CVI exists and its valid_through >= the clock date"
          - "the lot appears on a LoadLine of a manifest with status IN {DISPATCHED, DELIVERED}"
          - "the buying BuyerRegistration.bond_type == BONDED, or the lot's BuyerInvoice.status == PAID"
        side_effects:
          - "Lot.released_at is set to the current logical clock; the yardage day count stops here."
          - "Pen.current_head recomputed; Pen.status OCCUPIED -> AVAILABLE when it reaches 0."

  - entity: WeighTicket
    axis: status
    shape: "branching with two exits from OPEN and a system-driven SUPERSEDED edge"
    initial_state: OPEN
    terminal_states: [VOIDED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CAPTURED
        trigger: "POST /sale-barn/weigh-tickets/{id}/capture"
        actor: YardOperator
        preconditions:
          - "WeighTicket.status == OPEN"
          - "Scale.status == CERTIFIED at the current clock date"
          - "when Consignment.weigh_basis == STAND_ACTUAL and ticket_seq > 1, at least STAND_TIME_MINUTES (240) have elapsed since the governing prior CAPTURED ticket's captured_at"
        side_effects:
          - "WeighTicket.captured_at set; net_weight_lb computed."
          - "Any earlier CAPTURED ticket on the same lot transitions to SUPERSEDED."
          - "Lot.gross_weight_lb / tare_weight_lb / net_weight_lb / settle_weight_lb / avg_weight_lb / weight_class recomputed from the governing ticket."
      - from: OPEN
        to: VOIDED
        trigger: "POST /sale-barn/weigh-tickets/{id}/void"
        actor: YardOperator
        preconditions: ["WeighTicket.status IN {OPEN, CAPTURED}"]
        side_effects: ["The ticket stops counting; Lot weight fields recomputed from the newest remaining CAPTURED ticket, or cleared to null when none remains."]
      - from: CAPTURED
        to: VOIDED
        trigger: "POST /sale-barn/weigh-tickets/{id}/void"
        actor: YardOperator
        preconditions: ["WeighTicket.status IN {OPEN, CAPTURED}"]
        side_effects:
          - "Lot weight fields recomputed from the newest remaining CAPTURED ticket, or cleared to null when none remains."
          - "A SUPERSEDED ticket is NOT resurrected by voiding its successor; only CAPTURED tickets govern."
      - from: OPEN
        to: VOIDED
        trigger: "system: POST /sale-barn/pen-moves/{id}/status with to_status=COMPLETED for a move on this lot"
        actor: system
        preconditions: ["WeighTicket.status == OPEN", "the completed PenMove.lot_id == WeighTicket.lot_id"]
        side_effects: ["A pen move mid-weigh-in invalidates the open draft."]
      - from: CAPTURED
        to: SUPERSEDED
        trigger: "system: a later ticket on the same lot is captured"
        actor: system
        preconditions: ["WeighTicket.status == CAPTURED", "a ticket with a higher ticket_seq on the same lot transitions to CAPTURED"]
        side_effects: ["The later ticket governs Lot.settle_weight_lb."]

  - entity: PenMove
    axis: status
    shape: "branching with two abort exits"
    initial_state: REQUESTED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /sale-barn/pen-moves/{id}/status with to_status=IN_PROGRESS"
        actor: YardOperator
        preconditions: ["PenMove.status == REQUESTED", "DroverCrew.duty_status == ON_DUTY"]
        side_effects: ["The crew is committed to the move."]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /sale-barn/pen-moves/{id}/status with to_status=COMPLETED"
        actor: YardOperator
        preconditions: ["PenMove.status == IN_PROGRESS"]
        side_effects:
          - "CASCADE hop 1: PenMove.completed_at set; DroverCrew.last_move_completed_at set to the same instant."
          - "CASCADE hop 2 (caused by hop 1): Lot.pen_id changes from from_pen_id to to_pen_id and Lot.penned_at is reset to the current logical clock."
          - "CASCADE hop 3 (caused by hop 2): from_pen and to_pen recompute current_head and flip AVAILABLE <-> OCCUPIED accordingly; and every OPEN WeighTicket on the lot transitions to VOIDED."
      - from: REQUESTED
        to: ABORTED
        trigger: "POST /sale-barn/pen-moves/{id}/status with to_status=ABORTED"
        actor: YardOperator
        preconditions: ["PenMove.status IN {REQUESTED, IN_PROGRESS}"]
        side_effects: ["The crew's booked window is released; no pen or lot field changes."]
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /sale-barn/pen-moves/{id}/status with to_status=ABORTED"
        actor: YardOperator
        preconditions: ["PenMove.status IN {REQUESTED, IN_PROGRESS}"]
        side_effects: ["The crew's booked window is released; Lot.pen_id is unchanged."]
  - entity: BuyerRegistration
    axis: status
    shape: "bidirectional toggle (APPROVED <-> CREDIT_HOLD) with two exits"
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /sale-barn/buyer-registrations/{id}/approve"
        actor: BarnAdmin
        preconditions: ["BuyerRegistration.status == PENDING", "Party.status == ACTIVE"]
        side_effects: ["effective_limit computed; the buyer may now bid."]
      - from: APPROVED
        to: CREDIT_HOLD
        trigger: "POST /sale-barn/buyer-registrations/{id}/credit-hold with hold=true"
        actor: BarnAdmin
        preconditions: ["BuyerRegistration.status == APPROVED"]
        side_effects:
          - "Bidding is frozen for this buyer."
          - "Prior Purchase rows are NOT cancelled and stay in the buyer's exposure."
      - from: CREDIT_HOLD
        to: APPROVED
        trigger: "POST /sale-barn/buyer-registrations/{id}/credit-hold with hold=false"
        actor: BarnAdmin
        preconditions: ["BuyerRegistration.status == CREDIT_HOLD"]
        side_effects: ["Bidding resumes."]
        note: "Bidirectional toggle; this is what makes the axis non-linear."
      - from: APPROVED
        to: REVOKED
        trigger: "POST /sale-barn/buyer-registrations/{id}/revoke"
        actor: BarnAdmin
        preconditions: ["BuyerRegistration.status IN {PENDING, APPROVED, CREDIT_HOLD}"]
        side_effects: ["Every Bid of this registration with status == WINNING transitions to VOIDED; exposure recomputed."]
      - from: CREDIT_HOLD
        to: REVOKED
        trigger: "POST /sale-barn/buyer-registrations/{id}/revoke"
        actor: BarnAdmin
        preconditions: ["BuyerRegistration.status IN {PENDING, APPROVED, CREDIT_HOLD}"]
        side_effects: ["Every Bid of this registration with status == WINNING transitions to VOIDED; exposure recomputed."]
      - from: PENDING
        to: REVOKED
        trigger: "POST /sale-barn/buyer-registrations/{id}/revoke"
        actor: BarnAdmin
        preconditions: ["BuyerRegistration.status IN {PENDING, APPROVED, CREDIT_HOLD}"]
        side_effects: ["The registration is closed before it ever bid."]

  - entity: Bid
    axis: status
    shape: "re-entrant: OUTBID -> WINNING when the bid that outbid it is voided"
    initial_state: WINNING
    terminal_states: [HAMMERED, VOIDED]
    transitions:
      - from: WINNING
        to: OUTBID
        trigger: "system: POST /sale-barn/bids records a higher bid on the same lot"
        actor: system
        preconditions: ["Bid.status == WINNING", "a new Bid on the same lot is accepted"]
        side_effects: ["The outbid buyer's winning_bid_amount and exposure are recomputed."]
      - from: OUTBID
        to: WINNING
        trigger: "system: the Bid that outbid it transitions to VOIDED (buyer revoked, or POST /sale-barn/purchases/{id}/void)"
        actor: system
        preconditions: ["Bid.status == OUTBID", "no other Bid on the lot has status == WINNING", "this bid has the highest unit_price among the lot's non-VOIDED, non-HAMMERED bids; ties break on the earlier created_at"]
        side_effects: ["The restored buyer's winning_bid_amount and exposure are recomputed."]
        note: "Re-entry edge; this is what makes the axis non-linear."
      - from: WINNING
        to: HAMMERED
        trigger: "POST /sale-barn/lots/{id}/hammer-down naming this bid"
        actor: Auctioneer
        preconditions: ["Bid.status == WINNING"]
        side_effects: ["A Purchase row is created from this bid."]
      - from: WINNING
        to: VOIDED
        trigger: "POST /sale-barn/lots/{id}/no-sale, POST /sale-barn/buyer-registrations/{id}/revoke, or CASCADE hop 2 of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["Bid.status == WINNING"]
        side_effects: ["The buyer's winning_bid_amount and exposure are recomputed."]
      - from: OUTBID
        to: VOIDED
        trigger: "POST /sale-barn/buyer-registrations/{id}/revoke for this bid's registration"
        actor: system
        preconditions: ["Bid.status == OUTBID"]
        side_effects: ["The bid can no longer be restored to WINNING."]
      - from: HAMMERED
        to: VOIDED
        trigger: "system: POST /sale-barn/purchases/{id}/void"
        actor: system
        preconditions: ["Bid.status == HAMMERED", "the voided Purchase.winning_bid_id == Bid.id"]
        side_effects: ["The next-highest OUTBID bid on the lot, if any, is restored to WINNING."]

  - entity: Purchase
    axis: status
    shape: "cyclic: INVOICED -> ADJUSTED -> INVOICED driven by DOA credits"
    initial_state: CONFIRMED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: CONFIRMED
        to: INVOICED
        trigger: "system: CASCADE fan-out of POST /sale-barn/sale-days/{id}/close (the buyer's invoice transitions DRAFT -> ISSUED)"
        actor: system
        preconditions: ["Purchase.status == CONFIRMED", "the parent BuyerInvoice transitions to ISSUED"]
        side_effects: ["The purchase is now billed."]
      - from: INVOICED
        to: ADJUSTED
        trigger: "POST /sale-barn/buyer-invoices/{id}/credit-memo with a purchase_id and doa_head > 0"
        actor: SettlementClerk
        preconditions: ["Purchase.status == INVOICED", "doa_head <= Purchase.head_count"]
        side_effects:
          - "Purchase.doa_head increases; doa_credit_amount computed."
          - "A negative DOA_CREDIT ChargeLine is appended on the BUYER side."
          - "BuyerInvoice.credit_memo_total increases; total_due and balance_due recomputed."
      - from: ADJUSTED
        to: INVOICED
        trigger: "system: POST /sale-barn/buyer-registrations/{id}/payments applies a payment to this purchase's invoice that leaves BuyerInvoice.balance_due > 0"
        actor: system
        preconditions: ["Purchase.status == ADJUSTED", "a payment was applied", "BuyerInvoice.balance_due > 0"]
        side_effects: ["The purchase returns to plain billed state and can be credited again."]
        note: "Loop edge; ADJUSTED is a DURABLE state that persists until a payment is applied, so it is observable between the two hops. A purchase can be credited more than once, each pass re-entering INVOICED."
      - from: INVOICED
        to: PAID
        trigger: "system: POST /sale-barn/buyer-registrations/{id}/payments drives BuyerInvoice.balance_due to 0"
        actor: system
        preconditions: ["Purchase.status IN {INVOICED, ADJUSTED}", "BuyerInvoice.balance_due == 0"]
        side_effects: ["The purchase drops out of the buyer's exposure."]
      - from: ADJUSTED
        to: PAID
        trigger: "system: POST /sale-barn/buyer-registrations/{id}/payments drives BuyerInvoice.balance_due to 0"
        actor: system
        preconditions: ["Purchase.status IN {INVOICED, ADJUSTED}", "BuyerInvoice.balance_due == 0"]
        side_effects: ["The purchase drops out of the buyer's exposure."]
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /sale-barn/purchases/{id}/void"
        actor: SettlementClerk
        preconditions: ["Purchase.status IN {CONFIRMED, INVOICED, ADJUSTED}"]
        side_effects:
          - "CASCADE hop 1 of 4."
          - "CASCADE hop 2 (caused by hop 1): Lot.sale_status SOLD -> NO_SALE, Lot.custody_status BUYER_PEN -> BARN, the HAMMERED Bid -> VOIDED, and the next-highest OUTBID bid is restored to WINNING."
          - "CASCADE hop 3 (caused by hop 2): the parent Consignment recomputes head_sold / head_no_saled and, when a Settlement exists, that Settlement recomputes gross_amount and transitions to ADJUSTED."
          - "CASCADE hop 4 (caused by hop 3): the Settlement's ChargeLine rows are regenerated from the new gross_amount, and the BuyerInvoice recomputes subtotal, buyer_fee, total_due and balance_due."
      - from: INVOICED
        to: VOIDED
        trigger: "POST /sale-barn/purchases/{id}/void"
        actor: SettlementClerk
        preconditions: ["Purchase.status IN {CONFIRMED, INVOICED, ADJUSTED}"]
        side_effects: ["Same four-hop cascade as from CONFIRMED."]
      - from: ADJUSTED
        to: VOIDED
        trigger: "POST /sale-barn/purchases/{id}/void"
        actor: SettlementClerk
        preconditions: ["Purchase.status IN {CONFIRMED, INVOICED, ADJUSTED}"]
        side_effects: ["Same four-hop cascade as from CONFIRMED."]

  - entity: BuyerInvoice
    axis: status
    shape: "linear with a VOIDED branch"
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system: CASCADE fan-out of POST /sale-barn/sale-days/{id}/close"
        actor: system
        preconditions: ["BuyerInvoice.status == DRAFT", "SaleDay.status transitioned to SETTLED"]
        side_effects:
          - "buyer_fee computed by calculation buyer_side_fee; a BUYER_FEE ChargeLine is appended."
          - "total_due and balance_due computed; every CONFIRMED Purchase on the invoice transitions to INVOICED."
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /sale-barn/buyer-registrations/{id}/payments with an amount less than balance_due"
        actor: SettlementClerk
        preconditions: ["BuyerInvoice.status == ISSUED", "0 < amount < BuyerInvoice.balance_due"]
        side_effects: ["amount_paid increases; balance_due recomputed; BuyerRegistration.payments_applied increases."]
      - from: ISSUED
        to: PAID
        trigger: "POST /sale-barn/buyer-registrations/{id}/payments with an amount equal to balance_due"
        actor: SettlementClerk
        preconditions: ["BuyerInvoice.status IN {ISSUED, PARTIALLY_PAID}", "amount == BuyerInvoice.balance_due"]
        side_effects:
          - "amount_paid increases; balance_due becomes 0."
          - "Every Purchase on the invoice transitions to PAID; the buyer's exposure drops."
          - "Any Settlement HELD with hold_reason AWAITING_FUNDS whose consignment's sold lots are all covered by PAID invoices becomes eligible for release."
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /sale-barn/buyer-registrations/{id}/payments with an amount equal to balance_due"
        actor: SettlementClerk
        preconditions: ["BuyerInvoice.status IN {ISSUED, PARTIALLY_PAID}", "amount == BuyerInvoice.balance_due"]
        side_effects: ["Same as the ISSUED -> PAID edge."]
      - from: DRAFT
        to: VOIDED
        trigger: "system: every Purchase on the invoice transitions to VOIDED (POST /sale-barn/purchases/{id}/void)"
        actor: system
        preconditions: ["BuyerInvoice.status IN {DRAFT, ISSUED, PARTIALLY_PAID}", "the invoice has no Purchase with status != VOIDED"]
        side_effects: ["subtotal, buyer_fee, total_due and balance_due all become 0."]
      - from: ISSUED
        to: VOIDED
        trigger: "system: every Purchase on the invoice transitions to VOIDED"
        actor: system
        preconditions: ["BuyerInvoice.status IN {DRAFT, ISSUED, PARTIALLY_PAID}", "the invoice has no Purchase with status != VOIDED"]
        side_effects: ["subtotal, buyer_fee, total_due and balance_due all become 0."]
      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: "system: every Purchase on the invoice transitions to VOIDED"
        actor: system
        preconditions: ["BuyerInvoice.status IN {DRAFT, ISSUED, PARTIALLY_PAID}", "the invoice has no Purchase with status != VOIDED"]
        side_effects: ["subtotal, buyer_fee, total_due and balance_due all become 0; amount_paid stays as recorded overpayment."]

  - entity: Settlement
    axis: status
    shape: "cyclic: RELEASED -> ADJUSTED -> RELEASED"
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: HELD
        trigger: "system: CASCADE hop 4 of POST /sale-barn/sale-days/{id}/close when Consignment.hold_until_funds is true"
        actor: system
        preconditions: ["Consignment.hold_until_funds == true"]
        side_effects: ["hold_reason set to AWAITING_FUNDS."]
      - from: DRAFT
        to: RELEASED
        trigger: "POST /sale-barn/settlements/{id}/release"
        actor: SettlementClerk
        preconditions: ["Settlement.status == DRAFT", "Settlement.balance_ok == true"]
        side_effects:
          - "The parent Consignment transitions RECONCILED -> SETTLED."
          - "Gate G5 activates: the settlement accepts no further mutation except adjust."
      - from: HELD
        to: RELEASED
        trigger: "POST /sale-barn/settlements/{id}/release"
        actor: SettlementClerk
        preconditions:
          - "Settlement.status == HELD"
          - "every BuyerInvoice covering a SOLD lot of this settlement's consignment has status == PAID"
          - "Settlement.balance_ok == true"
        side_effects: ["hold_reason reset to NONE; the parent Consignment transitions RECONCILED -> SETTLED; gate G5 activates."]
      - from: RELEASED
        to: ADJUSTED
        trigger: "POST /sale-barn/settlements/{id}/adjust"
        actor: SettlementClerk
        preconditions: ["Settlement.status == RELEASED", "abs(adjustment_amount) <= Settlement.net_amount"]
        side_effects:
          - "adjustment_total increases by adjustment_amount; net_amount recomputed."
          - "A released settlement is never reversed; the credit memo is the only instrument."
      - from: ADJUSTED
        to: RELEASED
        trigger: "POST /sale-barn/settlements/{id}/release"
        actor: SettlementClerk
        preconditions: ["Settlement.status == ADJUSTED", "Settlement.balance_ok == true"]
        side_effects: ["The adjusted settlement is re-released; further adjustments remain possible."]
        note: "Loop edge; this is what makes the axis non-linear."

  - entity: InspectionRecord
    axis: status
    shape: "capped retry loop (FAILED -> PENDING, at most MAX_RETEST_COUNT times)"
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /sale-barn/inspection-records/{id}/result with result=CLEARED"
        actor: Inspector
        preconditions: ["InspectionRecord.status == PENDING"]
        side_effects: ["The record now satisfies the gates that name its inspection_type, provided valid_through >= the clock date and inspected_head >= Lot.head_count."]
      - from: PENDING
        to: FAILED
        trigger: "POST /sale-barn/inspection-records/{id}/result with result=FAILED"
        actor: Inspector
        preconditions: ["InspectionRecord.status == PENDING"]
        side_effects: ["The record satisfies nothing; the lot stays blocked."]
      - from: FAILED
        to: PENDING
        trigger: "POST /sale-barn/inspection-records/{id}/result with result=RETEST"
        actor: Inspector
        preconditions: ["InspectionRecord.status == FAILED", "InspectionRecord.retest_count < MAX_RETEST_COUNT (1)"]
        side_effects: ["retest_count increases by 1; the record is open for a new outcome."]
        note: "Capped loop; the second retest attempt is refused with ERR_RETEST_LIMIT_EXCEEDED."

  - entity: LoadManifest
    axis: status
    shape: "linear forward with a revert edge (LOADING -> PLANNED)"
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "system: POST /sale-barn/load-manifests/{id}/lines adds the first line"
        actor: system
        preconditions: ["LoadManifest.status == PLANNED"]
        side_effects: ["loaded_head, loaded_weight_lb, haul_charge and every line's prorated_haul_amount recomputed."]
      - from: LOADING
        to: PLANNED
        trigger: "system: DELETE /sale-barn/load-manifests/{id}/lines/{line_id} removes the last line"
        actor: system
        preconditions: ["LoadManifest.status == LOADING", "the manifest has no remaining LoadLine"]
        side_effects: ["loaded_head and loaded_weight_lb return to 0; haul_charge returns to 0."]
        note: "Revert edge; this is what makes the axis non-linear."
      - from: LOADING
        to: DISPATCHED
        trigger: "POST /sale-barn/load-manifests/{id}/dispatch"
        actor: Carrier
        preconditions: ["LoadManifest.status == LOADING", "the manifest has at least one LoadLine"]
        side_effects:
          - "dispatched_at set; a HAUL ChargeLine is appended on the BUYER side for the manifest."
          - "Every lot on the manifest moves BUYER_PEN -> LOADED on its custody axis; the pens they vacate recompute current_head."
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /sale-barn/load-manifests/{id}/deliver"
        actor: Carrier
        preconditions: ["LoadManifest.status == DISPATCHED"]
        side_effects: ["The load is at the destination; lots may now be released."]
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /sale-barn/load-manifests/{id}/close"
        actor: Carrier
        preconditions: ["LoadManifest.status == DELIVERED", "every lot on the manifest has custody_status == RELEASED"]
        side_effects: ["The manifest is final; lines can no longer be added or removed."]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — three OCC rules, each on a different parent whose
# `version` the write observes. Every one is a CREATE-with-supersede shape:
# a strictly sequential second request would otherwise legitimately succeed.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hammer-down-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /sale-barn/lots/{id}/hammer-down"
    occ_field: "expected_lot_version"
    description: |
      Dropping the hammer on a Lot whose version has advanced since the client
      last observed it is rejected. This captures the case where another bid
      was accepted (legitimately superseding the client's view of the high
      bid) after the client read the lot, so the price the client is about to
      knock down is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: credit-override-stale-buyer
    parent_entity: BuyerRegistration
    write_endpoint: "POST /sale-barn/buyer-registrations/{id}/credit-override"
    occ_field: "expected_buyer_registration_version"
    description: |
      Issuing a credit override against a BuyerRegistration whose version has
      advanced since the client last observed it is rejected. A new override
      legitimately REPLACES the prior override_limit rather than adding to it,
      so a writer working from a stale view would silently erase headroom
      another supervisor just granted.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: load-line-add-stale-manifest
    parent_entity: LoadManifest
    write_endpoint: "POST /sale-barn/load-manifests/{id}/lines"
    occ_field: "expected_load_manifest_version"
    description: |
      Adding a lot to a LoadManifest whose version has advanced since the
      client last observed it is rejected. Each added line changes loaded_head
      and loaded_weight_lb, so a writer holding a stale view is reasoning
      about trailer headroom that no longer exists.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table — 24 calculations, 7 of them dual-variant.
# ---------------------------------------------------------------------------
calculations:
  - name: ticket_net_weight
    trigger: "POST /sale-barn/weigh-tickets/{id}/capture"
    algorithm: aggregation
    formula: |
      WeighTicket.net_weight_lb = round_half_up(gross_weight_lb - tare_weight_lb, 0)
    input_set: "The single WeighTicket being captured."
    constants:
      WEIGHT_PRECISION: 0
    precision: "0 decimal places, round_half_up"

  - name: settle_weight
    trigger: "POST /sale-barn/weigh-tickets/{id}/capture, and recomputed on POST /sale-barn/weigh-tickets/{id}/void"
    algorithm: chronological
    formula: |
      governing = the WeighTicket on this lot with status == CAPTURED and the
                  highest ticket_seq; when two share a ticket_seq (impossible by
                  construction) the earlier created_at governs.
      if governing is null:
          Lot.settle_weight_lb = null
      elif Consignment.weigh_basis == "PENCIL_SHRINK":
          Lot.settle_weight_lb = round_half_up(governing.net_weight_lb
                                               * (1 - Consignment.pencil_shrink_pct), 0)
      else:  # STAND_ACTUAL
          Lot.settle_weight_lb = governing.net_weight_lb
    input_set: "WeighTicket rows of this lot with status == CAPTURED only; OPEN, VOIDED and SUPERSEDED tickets are excluded."
    constants:
      PENCIL_SHRINK_DEFAULT_PCT: 0.03
      PENCIL_SHRINK_MAX_PCT: 0.06
      STAND_TIME_MINUTES: 240
    precision: "0 decimal places, round_half_up"
    variants:
      - name: pencil_shrink
        when: "Consignment.weigh_basis == PENCIL_SHRINK"
        difference: "A contractual percentage is deducted from the first captured net weight; no re-weigh is needed and no stand time is enforced."
      - name: stand_actual
        when: "Consignment.weigh_basis == STAND_ACTUAL"
        difference: "No percentage is deducted; the animals stand STAND_TIME_MINUTES and are re-weighed, and the LAST captured ticket's raw net weight governs. Identical scale readings therefore settle on a different weight than the pencil variant."

  - name: lot_avg_weight
    trigger: "whenever Lot.settle_weight_lb changes"
    algorithm: aggregation
    formula: |
      Lot.avg_weight_lb = round_half_up(Lot.settle_weight_lb / Lot.head_count, 1)
    input_set: "One lot."
    constants: {}
    precision: "1 decimal place, round_half_up"

  - name: lot_weight_class
    trigger: "whenever Lot.avg_weight_lb changes"
    algorithm: threshold
    formula: |
      if Lot.settle_weight_lb is null:            Lot.weight_class = "NONE"
      elif Lot.avg_weight_lb < 500.0:             Lot.weight_class = "LIGHT"
      elif Lot.avg_weight_lb < 800.0:             Lot.weight_class = "MEDIUM"
      else:                                        Lot.weight_class = "HEAVY"
    input_set: "One lot."
    constants:
      WEIGHT_CLASS_MEDIUM_MIN_LB: 500.0
      WEIGHT_CLASS_HEAVY_MIN_LB: 800.0
    precision: "exact enum, boundaries are >= on the lower bound of each band"

  - name: lot_extension
    trigger: "POST /sale-barn/bids (as Bid.projected_extension) and POST /sale-barn/lots/{id}/hammer-down (as Lot.extended_amount and Purchase.extended_amount)"
    algorithm: tiered_pricing
    formula: |
      if bid_basis == "PER_CWT":
          extension = round_half_up(unit_price * settle_weight_lb / 100, 2)
      else:  # PER_HEAD
          extension = round_half_up(unit_price * head_count, 2)
    input_set: "One lot plus the unit price under consideration. settle_weight_lb must be non-null for PER_CWT lots."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: per_cwt
        when: "Lot.bid_basis == PER_CWT"
        difference: "Price is per hundredweight and is multiplied by settle_weight_lb / 100, so the weigh-in result drives the money."
      - name: per_head
        when: "Lot.bid_basis == PER_HEAD"
        difference: "Price is per animal and is multiplied by head_count, so the weigh-in result does not affect the money at all."

  - name: min_next_bid
    trigger: "POST /sale-barn/bids"
    algorithm: threshold
    formula: |
      current_high = unit_price of the Bid on this lot with status == WINNING, else null
      if current_high is null:
          minimum_acceptable = Lot.opening_bid
      else:
          if current_high < 100.00:        increment = 0.25
          elif current_high < 500.00:      increment = 1.00
          else:                            increment = 5.00
          minimum_acceptable = round_half_up(current_high + increment, 2)
      accepted when unit_price >= minimum_acceptable      # >= , not >
    input_set: "Bids on this lot with status == WINNING (at most one)."
    constants:
      BID_INCREMENT_TIER1_MAX: 100.00
      BID_INCREMENT_TIER1: 0.25
      BID_INCREMENT_TIER2_MAX: 500.00
      BID_INCREMENT_TIER2: 1.00
      BID_INCREMENT_TIER3: 5.00
    precision: "2 decimal places, round_half_up; the comparison is inclusive (>=)"

  - name: buyer_effective_limit
    trigger: "POST /sale-barn/buyer-registrations/{id}/approve, POST /sale-barn/buyer-registrations/{id}/credit-override"
    algorithm: threshold
    formula: |
      multiplier = 1.5 if bond_type == "BONDED"
                   else 1.0 if bond_type == "UNSECURED"
                   else 0.0                                  # CASH_ONLY
      effective_limit = round_half_up(credit_limit * multiplier
                                      + cash_deposit_amount
                                      + override_limit, 2)
    input_set: "One BuyerRegistration."
    constants:
      BONDED_LIMIT_MULTIPLIER: 1.5
      UNSECURED_LIMIT_MULTIPLIER: 1.0
      CASH_ONLY_LIMIT_MULTIPLIER: 0.0
    precision: "2 decimal places, round_half_up"

  - name: buyer_exposure
    trigger: "POST /sale-barn/bids, POST /sale-barn/lots/{id}/hammer-down, POST /sale-barn/lots/{id}/no-sale, POST /sale-barn/buyer-registrations/{id}/payments, POST /sale-barn/purchases/{id}/void"
    algorithm: aggregation
    formula: |
      open_purchase_amount = SUM(Purchase.extended_amount)
                             for Purchase.buyer_registration_id == B.id
                             AND Purchase.status IN {CONFIRMED, INVOICED, ADJUSTED}
      winning_bid_amount   = SUM(Bid.projected_extension)
                             for Bid.buyer_registration_id == B.id
                             AND Bid.status == WINNING
      exposure = round_half_up(open_purchase_amount + winning_bid_amount
                               - B.payments_applied, 2)
      available_credit = round_half_up(B.effective_limit - exposure, 2)
    input_set: "Purchases with status IN {CONFIRMED, INVOICED, ADJUSTED} (PAID and VOIDED are excluded) and Bids with status == WINNING (OUTBID, HAMMERED and VOIDED are excluded)."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: credit_admission_check
    trigger: "POST /sale-barn/bids"
    algorithm: threshold
    formula: |
      displaced = projected_extension of this buyer's own Bid on this SAME lot
                  with status == WINNING, else 0
      projected_exposure = round_half_up(B.exposure - displaced
                                         + this_bid.projected_extension, 2)
      accepted when projected_exposure <= B.effective_limit      # <= , not <
    input_set: "The buyer's current exposure, minus their own displaced winning bid on the same lot, plus the new bid."
    constants: {}
    precision: "2 decimal places, round_half_up; the comparison is inclusive (<=)"

  - name: seller_commission
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close, and recomputed on CASCADE hop 4 of POST /sale-barn/purchases/{id}/void"
    algorithm: tiered_pricing
    formula: |
      gross = SUM(Lot.extended_amount) for this consignment's lots with sale_status == SOLD
      sold_head = SUM(Lot.head_count) for the same lots
      if Consignment.commission_basis == "FLAT_PER_HEAD":
          commission = round_half_up(18.00 * sold_head, 2)
      else:  # TIERED_VALUE — AVERAGE rate on the whole gross, not marginal
          if   gross <= 1000.00:  rate = 0.05
          elif gross <= 5000.00:  rate = 0.04
          else:                   rate = 0.03
          tiered = round_half_up(gross * rate, 2)
          commission = min(max(tiered, round_half_up(4.00 * sold_head, 2)), 450.00)
    input_set: "Lots of this consignment with sale_status == SOLD only; NO_SALE, WITHDRAWN and in-process lots contribute nothing."
    constants:
      COMMISSION_TIER1_MAX: 1000.00
      COMMISSION_TIER1_PCT: 0.05
      COMMISSION_TIER2_MAX: 5000.00
      COMMISSION_TIER2_PCT: 0.04
      COMMISSION_TIER3_PCT: 0.03
      MIN_COMMISSION_PER_HEAD: 4.00
      MAX_COMMISSION_PER_LOT: 450.00
      COMMISSION_FLAT_PER_HEAD: 18.00
    precision: "2 decimal places, round_half_up. Tier boundaries are INCLUSIVE upper bounds: gross == 1000.00 uses 5%, gross == 5000.00 uses 4%."
    variants:
      - name: tiered_value
        when: "Consignment.commission_basis == TIERED_VALUE"
        difference: "Rate is selected from the gross, applied to the whole gross, then floored at a per-head minimum and capped at MAX_COMMISSION_PER_LOT. All three of tiered / floor / cap are reachable."
      - name: flat_per_head
        when: "Consignment.commission_basis == FLAT_PER_HEAD"
        difference: "A flat COMMISSION_FLAT_PER_HEAD per sold head; the gross plays no part, and neither the per-head floor nor the cap applies."

  - name: days_on_yard
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: interval_merge
    formula: |
      start = Consignment.checked_in_at
      end   = Lot.released_at if Lot.custody_status == "RELEASED"
              else the logical-clock instant of the sale-day close
      raw_days = (end - start) in seconds / 86400
      days = max(ceil(raw_days), 1)                # partial days round UP, never fewer than 1
    input_set: "One lot's occupancy window, half-open [checked_in_at, end)."
    constants:
      YARDAGE_MIN_DAYS: 1
    precision: "whole days, ceiling"

  - name: yardage_charge
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: tiered_pricing
    formula: |
      billable_head = Consignment.head_in_lots + Consignment.head_withdrawn
                      + Consignment.head_dead + Consignment.head_condemned
      if Consignment.yardage_basis == "PER_HEAD_DAY":
          yardage = round_half_up(1.75 * billable_head * days_on_yard, 2)
      else:  # FLAT_PER_HEAD
          yardage = round_half_up(5.00 * billable_head, 2)
    input_set: "Every head that stood on the yard, whether it sold or not; head_unassigned that never came off the truck is excluded."
    constants:
      YARDAGE_RATE_PER_HEAD_DAY: 1.75
      YARDAGE_FLAT_PER_HEAD: 5.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: per_head_day
        when: "Consignment.yardage_basis == PER_HEAD_DAY"
        difference: "Scales with days_on_yard, so a lot that sat two days costs twice a lot that sat one."
      - name: flat_per_head
        when: "Consignment.yardage_basis == FLAT_PER_HEAD"
        difference: "One-time charge per head at a higher unit rate; the day count is ignored entirely, so the same stay produces a different number than the per-day variant."

  - name: feed_charge
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: aggregation
    formula: |
      rate = 0.000 if ration_type == "NONE"
             else 0.955 if ration_type == "STARTER"
             else 1.405 if ration_type == "GROWER"
             else 0.605                                    # HAY
      # ROUNDING ORDER IS PINNED: round EACH per-lot line to 2 dp, THEN sum.
      # Summing first and rounding once is WRONG and produces a different cent.
      feed = SUM over this consignment's lots with sale_status != WITHDRAWN, in
             ascending Lot.created_at order, of
               round_half_up(rate * Consignment.days_on_feed * Lot.head_count, 2)
    input_set: "Lots of this consignment whose sale_status != WITHDRAWN, processed in ascending created_at order."
    constants:
      FEED_RATE_STARTER: 0.955
      FEED_RATE_GROWER: 1.405
      FEED_RATE_HAY: 0.605
    precision: "2 decimal places, round_half_up, applied PER LINE before summation"

  - name: statutory_checkoff
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: aggregation
    formula: |
      sold_head = SUM(Lot.head_count) for this consignment's lots with sale_status == SOLD
      state_share    = round_half_up(0.50 * sold_head, 2)
      national_share = round_half_up(0.50 * sold_head, 2)
      Settlement.statutory_amount = state_share + national_share
    input_set: "SOLD head only. NO_SALE head, withdrawn head, death loss and condemned head are all excluded."
    constants:
      CHECKOFF_PER_HEAD: 1.00
      CHECKOFF_STATE_SHARE: 0.50
      CHECKOFF_NATIONAL_SHARE: 0.50
    precision: "2 decimal places, round_half_up, per share"

  - name: brand_inspection_fee
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: aggregation
    formula: |
      Settlement.brand_fee_amount = round_half_up(
          1.20 * SUM(Lot.head_count for this consignment's lots with sale_status == SOLD), 2)
    input_set: "SOLD head only."
    constants:
      BRAND_FEE_PER_HEAD: 1.20
    precision: "2 decimal places, round_half_up"

  - name: indemnity_fee
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: threshold
    formula: |
      raw = round_half_up(Settlement.gross_amount * 0.0015, 2)
      Settlement.indemnity_fee_amount = min(max(raw, 0.50), 25.00) if gross_amount > 0 else 0.00
    input_set: "The settlement's gross_amount."
    constants:
      INDEMNITY_PCT: 0.0015
      INDEMNITY_MIN: 0.50
      INDEMNITY_MAX: 25.00
    precision: "2 decimal places, round_half_up. Floor binds below gross 333.34; cap binds above gross 16666.67."

  - name: settlement_offset
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED — the definition looks circular because the
      # offset depends on invoice balances that depend on buyer fees that
      # depend on invoice subtotals. Evaluate strictly in this order:
      #   step 1: every BuyerInvoice of the sale day computes subtotal
      #   step 2: every BuyerInvoice computes buyer_fee, total_due, balance_due
      #   step 3: this settlement computes gross / commission / yardage / feed /
      #           statutory / brand / indemnity
      #   step 4: net_before_offset = gross - commission - yardage - feed
      #                               - statutory - brand - indemnity - advances
      #   step 5: candidate invoices = BuyerInvoice rows of this sale day whose
      #           BuyerRegistration.party_id == Settlement.consignor_party_id
      #           AND status IN {ISSUED, PARTIALLY_PAID}, taken in ascending
      #           BuyerInvoice.created_at order
      #   step 6: pour net_before_offset down that list, taking
      #           min(remaining, invoice.balance_due) from each
      #   offset_applied = the total poured
      # The offset does NOT itself change any invoice balance in this pass;
      # it only diverts seller proceeds.
      offset_applied = round_half_up(the total poured, 2)
    input_set: "BuyerInvoice rows of the same sale day belonging to the SAME party as the consignor, with status IN {ISSUED, PARTIALLY_PAID}, ordered by created_at ascending. Ties are impossible because created_at is strictly ordered by insertion."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: settlement_net
    trigger: "CASCADE hop 5 of POST /sale-barn/sale-days/{id}/close, POST /sale-barn/settlements/{id}/adjust, CASCADE hop 4 of POST /sale-barn/purchases/{id}/void"
    algorithm: waterfall_allocation
    formula: |
      Settlement.net_amount = round_half_up(
            gross_amount
          - commission_amount
          - yardage_amount
          - feed_amount
          - statutory_amount
          - brand_fee_amount
          - indemnity_fee_amount
          - advances_amount
          - offset_applied
          + adjustment_total, 2)
    input_set: "The settlement's own computed deduction fields, in the pinned order above."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: buyer_side_fee
    trigger: "BuyerInvoice DRAFT -> ISSUED during POST /sale-barn/sale-days/{id}/close"
    algorithm: tiered_pricing
    formula: |
      invoiced_head = SUM(Purchase.head_count) for this invoice's purchases
                      with status IN {CONFIRMED, INVOICED, ADJUSTED, PAID}
      if BuyerRegistration.bond_type == "CASH_ONLY":
          buyer_fee = max(round_half_up(0.75 * invoiced_head, 2), 5.00)
      else:  # BONDED or UNSECURED
          buyer_fee = min(round_half_up(BuyerInvoice.subtotal * 0.0025, 2), 150.00)
    input_set: "Purchases on this invoice with status != VOIDED."
    constants:
      BOND_PROCESSING_PCT: 0.0025
      BOND_FEE_CAP: 150.00
      CASH_HANDLING_PER_HEAD: 0.75
      CASH_HANDLING_MIN: 5.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: bond_processing
        when: "BuyerRegistration.bond_type IN {BONDED, UNSECURED}"
        difference: "A percentage of the invoice subtotal capped at BOND_FEE_CAP; it scales with money bought."
        note: "Selected by the same bond_type field that selects the credit multiplier, so a buyer with a bigger line also pays a value-based fee."
      - name: cash_handling
        when: "BuyerRegistration.bond_type == CASH_ONLY"
        difference: "A per-head charge with a floor; it scales with head bought and ignores the money entirely, so identical purchases produce a different fee than the bonded variant."

  - name: buyer_invoice_total
    trigger: "BuyerInvoice DRAFT -> ISSUED, POST /sale-barn/buyer-invoices/{id}/credit-memo, POST /sale-barn/buyer-registrations/{id}/payments, CASCADE hop 4 of POST /sale-barn/purchases/{id}/void"
    algorithm: aggregation
    formula: |
      subtotal    = SUM(Purchase.extended_amount) for this invoice's purchases
                    with status IN {CONFIRMED, INVOICED, ADJUSTED, PAID}
      total_due   = round_half_up(subtotal + buyer_fee - credit_memo_total, 2)
      balance_due = round_half_up(total_due - amount_paid, 2)
    input_set: "Purchases with status != VOIDED on this invoice."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: doa_credit
    trigger: "POST /sale-barn/buyer-invoices/{id}/credit-memo with a purchase_id and doa_head"
    algorithm: aggregation
    formula: |
      if Purchase.bid_basis == "PER_CWT":
          per_head_value = round_half_up(Purchase.extended_amount / Purchase.head_count, 2)
      else:
          per_head_value = Purchase.unit_price
      doa_credit_amount = round_half_up(per_head_value * Purchase.doa_head, 2)
    input_set: "One purchase and its cumulative doa_head."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: haul_charge
    trigger: "POST /sale-barn/load-manifests/{id}/lines, DELETE /sale-barn/load-manifests/{id}/lines/{line_id}"
    algorithm: threshold
    formula: |
      if LoadManifest.loaded_head == 0:
          haul_charge = 0.00
      elif LoadManifest.haul_basis == "PER_MILE":
          haul_charge = max(round_half_up(4.85 * loaded_miles, 2), 250.00)
      else:  # PER_HEAD_FLAT
          haul_charge = round_half_up(12.00 * loaded_head, 2)
    input_set: "The manifest's own LoadLine rows."
    constants:
      HAUL_RATE_PER_LOADED_MILE: 4.85
      MIN_HAUL_CHARGE: 250.00
      HAUL_RATE_PER_HEAD: 12.00
    precision: "2 decimal places, round_half_up. The minimum binds whenever loaded_miles < 51.5464."
    variants:
      - name: per_mile
        when: "LoadManifest.haul_basis == PER_MILE"
        difference: "Distance-driven with a hard floor at MIN_HAUL_CHARGE; head count is irrelevant."
      - name: per_head_flat
        when: "LoadManifest.haul_basis == PER_HEAD_FLAT"
        difference: "Head-driven with no floor; distance is irrelevant, so the same trip produces a different charge than the per-mile variant."

  - name: haul_proration
    trigger: "POST /sale-barn/load-manifests/{id}/lines, DELETE /sale-barn/load-manifests/{id}/lines/{line_id}"
    algorithm: waterfall_allocation
    formula: |
      lines = LoadLine rows of this manifest in ascending created_at order
      if LoadManifest.proration_basis == "BY_WEIGHT":
          basis(line) = line.weight_lb;  total = LoadManifest.loaded_weight_lb
      else:  # BY_HEAD
          basis(line) = line.head;       total = LoadManifest.loaded_head
      for each line: line.prorated_haul_amount = round_half_up(
              LoadManifest.haul_charge * basis(line) / total, 2)
      residual = round_half_up(LoadManifest.haul_charge
                               - SUM(line.prorated_haul_amount), 2)
      the residual (which may be negative) is added to the line with the
      EARLIEST created_at
    input_set: "Every LoadLine of the manifest, ordered by created_at ascending. Tie-break is unnecessary: created_at is strictly ordered by insertion. Row ids are never consulted."
    constants: {}
    precision: "2 decimal places, round_half_up, per line, with the rounding residual absorbed by the earliest line"
    variants:
      - name: by_weight
        when: "LoadManifest.proration_basis == BY_WEIGHT"
        difference: "Shares are proportional to settle weight, so a heavy lot of few head carries most of the haul."
      - name: by_head
        when: "LoadManifest.proration_basis == BY_HEAD"
        difference: "Shares are proportional to head count, so light animals carry the same share as heavy ones and the split differs from the weight variant on the very same manifest."

  - name: pen_occupancy
    trigger: "POST /sale-barn/lots/{id}/assign-pen, POST /sale-barn/pen-moves/{id}/status with to_status=COMPLETED, POST /sale-barn/lots/{id}/release, POST /sale-barn/load-manifests/{id}/dispatch, POST /sale-barn/consignments/{id}/losses"
    algorithm: aggregation
    formula: |
      Pen.current_head = SUM(Lot.head_count)
                         for Lot.pen_id == P.id
                         AND Lot.sale_status IN {PENNED, READY, IN_RING, SOLD, NO_SALE}
                         AND Lot.custody_status IN {BARN, BUYER_PEN}
      # Occupancy interval is HALF-OPEN [Lot.penned_at, Lot.released_at):
      # a lot released at instant T frees capacity for a lot penned at T.
      admission rule: Pen.current_head + incoming Lot.head_count <= Pen.head_capacity
    input_set: "Lots whose pen_id is this pen, excluding DRAFT and WITHDRAWN lots and excluding lots already LOADED or RELEASED."
    constants: {}
    precision: "whole head; the admission comparison is inclusive (<=)"

  - name: crew_booking_conflict
    trigger: "POST /sale-barn/pen-moves"
    algorithm: interval_merge
    formula: |
      new_start = requested scheduled_start_at
      new_end   = new_start + 30 minutes
      for each existing PenMove M on the same crew_id with status IN {REQUESTED, IN_PROGRESS}:
          blocked_until = M.scheduled_end_at + 15 minutes      # trailing cool-down
          conflict when (new_start < blocked_until) AND (new_end > M.scheduled_start_at)
      # CLOSED-with-trailing-buffer semantics: a move starting EXACTLY at
      # blocked_until is accepted; one starting one minute earlier is refused.
    input_set: "PenMove rows on the same crew with status IN {REQUESTED, IN_PROGRESS}; COMPLETED and ABORTED moves never block."
    constants:
      MOVE_DURATION_MINUTES: 30
      MOVE_BUFFER_MINUTES: 15
    precision: "whole minutes; the buffer boundary is exclusive on the new move's start (new_start < blocked_until blocks)"

  - name: inspection_validity
    trigger: "POST /sale-barn/inspection-records"
    algorithm: threshold
    formula: |
      days = 30  if inspection_type == "CVI"
             else 10  if inspection_type == "BRAND"
             else 60  if inspection_type == "TRICH_TEST"
             else 365                                   # BRUCELLOSIS_TEST
      valid_through = issue_date + days            # INCLUSIVE last valid date
      a record satisfies a gate when status == CLEARED
                                 AND valid_through >= the clock's date
                                 AND inspected_head >= Lot.head_count
    input_set: "One inspection record."
    constants:
      CVI_VALIDITY_DAYS: 30
      BRAND_INSPECTION_VALIDITY_DAYS: 10
      TRICH_TEST_VALIDITY_DAYS: 60
      BRUCELLOSIS_TEST_VALIDITY_DAYS: 365
    precision: "whole days; the expiry comparison is inclusive (valid_through == clock date still passes)"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table — ONE total order, 42 rungs, every rung distinct
# and reachable. Rungs 11-15 mirror gate_precedence.total_order exactly.
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role is present and names a role declared in §1.7; X-User-ID is present whenever the role's identity is entity_backed."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id embedded in the path resolves to an existing row, validated left to right."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 4
    category: business_constraint
    check: "Every required body field is present and of the declared JSON type."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 5
    category: business_constraint
    check: >-
      Every field whose §1.1 constraints declare a closed value set carries a member of that set.
      The fields that route here are exactly and only: Party.party_type, Pen.species_class, Pen.pen_type,
      Consignment.species_class, Consignment.weigh_basis, Consignment.yardage_basis,
      Consignment.commission_basis, Consignment.ration_type, Lot.livestock_class, Lot.bid_basis,
      BuyerRegistration.bond_type, InspectionRecord.inspection_type, LoadManifest.haul_basis,
      LoadManifest.proration_basis, the to_status body field of every /status, /advance and /duty
      endpoint, the result body field of POST /inspection-records/{id}/result, and the loss_type
      body field of POST /consignments/{id}/losses. No other field routes here.
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all endpoints with an enum body field"
  - priority: 6
    category: business_constraint
    check: "Numeric body fields satisfy their declared sign and range constraints (head counts >= 1, money >= 0, pencil_shrink_pct <= 0.06, payment/adjustment amounts > 0)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a numeric body field"
  - priority: 7
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /sale-barn/consignments, POST /sale-barn/lots, POST /sale-barn/weigh-tickets, POST /sale-barn/pen-moves, POST /sale-barn/buyer-registrations, POST /sale-barn/bids, POST /sale-barn/inspection-records, POST /sale-barn/load-manifests, POST /sale-barn/load-manifests/{id}/lines, POST /sale-barn/lots/{id}/assign-pen, POST /sale-barn/lots/{id}/hammer-down, POST /sale-barn/consignments/{id}/losses, POST /sale-barn/buyer-invoices/{id}/credit-memo"
  - priority: 8
    category: business_referential
    check: "Cross-referenced rows belong to the same SaleDay: Bid.buyer_registration_id and Bid.lot_id share a sale_day_id; a LoadLine's lot and its manifest share a sale_day_id; a Lot's consignment and its pen serve the same sale day."
    error_id: ERR_SALE_DAY_MISMATCH
    http_status: 409
    applies_to: "POST /sale-barn/bids, POST /sale-barn/load-manifests/{id}/lines, POST /sale-barn/lots/{id}/hammer-down"
  - priority: 9
    category: auth
    check: "An entity_backed actor (Consignor, Buyer, Carrier) is acting on a resource whose owning party_id equals the X-User-ID header."
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /sale-barn/consignments, POST /sale-barn/consignments/{id}/losses, POST /sale-barn/load-manifests, POST /sale-barn/load-manifests/{id}/dispatch, POST /sale-barn/load-manifests/{id}/deliver, POST /sale-barn/load-manifests/{id}/close, DELETE /sale-barn/load-manifests/{id}/lines/{line_id}"
  - priority: 10
    category: state
    check: "The request's expected_<parent>_version equals the parent's current version (§1.2.1 OCC)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sale-barn/lots/{id}/hammer-down, POST /sale-barn/buyer-registrations/{id}/credit-override, POST /sale-barn/load-manifests/{id}/lines"
  - priority: 11
    category: state
    check: "GATE G1 — the SaleDay this write resolves to does not have status == CANCELLED."
    error_id: ERR_SALE_DAY_CANCELLED
    http_status: 409
    applies_to: "every write whose target resolves to a SaleDay"
  - priority: 12
    category: business_safety
    check: "GATE G2 — the Lot this write touches does not have quarantine_hold == true. Exempt: POST /lots/{id}/quarantine, POST /inspection-records, POST /inspection-records/{id}/result, POST /sale-days/{id}/advance."
    error_id: ERR_LOT_QUARANTINED
    http_status: 409
    applies_to: "every write touching a Lot except the four exempt endpoints"
  - priority: 13
    category: state
    check: "GATE G3 — the SaleDay does not have status IN {BIDDING_CLOSED, SETTLED}, for the endpoints the gate covers."
    error_id: ERR_SALE_DAY_FROZEN
    http_status: 409
    applies_to: "POST /sale-barn/lots, POST /sale-barn/lots/{id}/assign-pen, POST /sale-barn/lots/{id}/mark-ready, POST /sale-barn/lots/{id}/enter-ring, POST /sale-barn/lots/{id}/hammer-down, POST /sale-barn/lots/{id}/no-sale, POST /sale-barn/lots/{id}/re-ring, POST /sale-barn/bids, POST /sale-barn/weigh-tickets, POST /sale-barn/weigh-tickets/{id}/capture, POST /sale-barn/pen-moves, POST /sale-barn/consignments, POST /sale-barn/consignments/{id}/check-in"
  - priority: 14
    category: auth
    check: "GATE G4 — the Party owning this write (consignor, buyer or carrier) does not have status == SUSPENDED."
    error_id: ERR_PARTY_SUSPENDED
    http_status: 403
    applies_to: "every write whose owning Party can be resolved, except POST /sale-barn/parties/{id}/status"
  - priority: 15
    category: state
    check: "GATE G5 — the Settlement being mutated does not have status == RELEASED, except on POST /settlements/{id}/adjust."
    error_id: ERR_SETTLEMENT_RELEASED
    http_status: 409
    applies_to: "POST /sale-barn/settlements/{id}/release"
  - priority: 16
    category: state
    check: "The target row's current state appears in the from-set of the requested transition (§1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-transition endpoint"
  - priority: 17
    category: business_constraint
    check: "buyer_number is not already used by another BuyerRegistration on the same sale_day_id."
    error_id: ERR_DUPLICATE_BUYER_NUMBER
    http_status: 409
    applies_to: "POST /sale-barn/buyer-registrations"
  - priority: 18
    category: business_safety
    check: "The Scale named by the ticket has status == CERTIFIED at the current clock date (certified_from <= date <= certification_expires_on, both inclusive)."
    error_id: ERR_SCALE_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /sale-barn/weigh-tickets, POST /sale-barn/weigh-tickets/{id}/capture"
  - priority: 19
    category: business_constraint
    check: "The lot has no other WeighTicket with status == OPEN. Deliberately NOT applied to POST /sale-barn/pen-moves: a move ordered while a draft is open is legal, and completing it is what voids the open ticket."
    error_id: ERR_WEIGH_TICKET_OPEN
    http_status: 409
    applies_to: "POST /sale-barn/weigh-tickets"
  - priority: 20
    category: business_constraint
    check: "The lot's ticket count minus one (its reweigh count) is below MAX_REWEIGH_COUNT (2); the third re-weigh is refused."
    error_id: ERR_REWEIGH_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sale-barn/weigh-tickets"
  - priority: 21
    category: business_temporal
    check: "For a STAND_ACTUAL consignment, a re-weigh ticket (ticket_seq > 1) may be captured only once STAND_TIME_MINUTES (240) have elapsed since the governing prior CAPTURED ticket's captured_at; elapsed == 240 minutes exactly passes."
    error_id: ERR_STAND_TIME_NOT_MET
    http_status: 409
    applies_to: "POST /sale-barn/weigh-tickets/{id}/capture"
  - priority: 22
    category: business_constraint
    check: "The destination Pen's species_class equals the Lot's consignment species_class."
    error_id: ERR_PEN_SPECIES_MISMATCH
    http_status: 422
    applies_to: "POST /sale-barn/lots/{id}/assign-pen, POST /sale-barn/pen-moves"
  - priority: 23
    category: state
    check: "The destination Pen does not have status == OUT_OF_SERVICE."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/assign-pen, POST /sale-barn/pen-moves"
  - priority: 24
    category: business_constraint
    check: "Pen.current_head + incoming Lot.head_count <= Pen.head_capacity (inclusive), over the half-open occupancy interval [penned_at, released_at)."
    error_id: ERR_PEN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/assign-pen, POST /sale-barn/pen-moves"
  - priority: 25
    category: business_constraint
    check: "The named DroverCrew has duty_status == ON_DUTY."
    error_id: ERR_CREW_OFF_DUTY
    http_status: 409
    applies_to: "POST /sale-barn/pen-moves, POST /sale-barn/pen-moves/{id}/status with to_status=IN_PROGRESS"
  - priority: 26
    category: business_temporal
    check: "The requested [scheduled_start_at, scheduled_start_at + 30min) window does not collide with any REQUESTED or IN_PROGRESS move on the same crew, where each existing move blocks until scheduled_end_at + MOVE_BUFFER_MINUTES (15)."
    error_id: ERR_CREW_MOVE_OVERLAP
    http_status: 409
    applies_to: "POST /sale-barn/pen-moves"
  - priority: 27
    category: business_constraint
    check: "The requested head does not exceed what the consignment still has: Lot.head_count <= Consignment.head_unassigned on lot creation, and losses head <= Consignment.head_unassigned on a lot-less loss."
    error_id: ERR_HEAD_COUNT_EXCEEDED
    http_status: 422
    applies_to: "POST /sale-barn/lots, POST /sale-barn/consignments/{id}/losses"
  - priority: 28
    category: business_constraint
    check: "The lot has a non-null settle_weight_lb before it may be marked ready."
    error_id: ERR_SETTLE_WEIGHT_MISSING
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/mark-ready"
  - priority: 29
    category: business_constraint
    check: "Lot.rering_count < MAX_RERING_COUNT (2)."
    error_id: ERR_RERING_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/re-ring"
  - priority: 30
    category: business_safety
    check: >-
      The inspection documents the operation requires exist with status == CLEARED and
      inspected_head >= Lot.head_count: a TRICH_TEST for a BREEDING_BULL and a BRUCELLOSIS_TEST
      for a BREEDING_FEMALE on mark-ready; a BRAND record on release, plus a CVI record when
      Lot.destination_state_code != SaleDay.barn_state_code.
    error_id: ERR_INSPECTION_NOT_CLEARED
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/mark-ready, POST /sale-barn/lots/{id}/release"
  - priority: 31
    category: business_safety
    check: "Each required inspection document is still inside its validity window: valid_through >= the current clock date, INCLUSIVE."
    error_id: ERR_CVI_EXPIRED
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/mark-ready, POST /sale-barn/lots/{id}/release"
  - priority: 32
    category: business_constraint
    check: "An InspectionRecord's retest_count is below MAX_RETEST_COUNT (1) before a FAILED -> PENDING retest."
    error_id: ERR_RETEST_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sale-barn/inspection-records/{id}/result with result=RETEST"
  - priority: 33
    category: state
    check: "The bidding BuyerRegistration has status == APPROVED (a PENDING or REVOKED registration cannot bid)."
    error_id: ERR_BUYER_NOT_APPROVED
    http_status: 403
    applies_to: "POST /sale-barn/bids"
  - priority: 34
    category: state
    check: "The bidding BuyerRegistration does not have status == CREDIT_HOLD."
    error_id: ERR_BUYER_CREDIT_HOLD
    http_status: 409
    applies_to: "POST /sale-barn/bids"
  - priority: 35
    category: business_constraint
    check: "When the lot has no WINNING bid yet, unit_price >= Lot.opening_bid (inclusive)."
    error_id: ERR_BID_BELOW_OPENING
    http_status: 422
    applies_to: "POST /sale-barn/bids"
  - priority: 36
    category: business_constraint
    check: "When the lot has a WINNING bid, unit_price >= current_high + the tiered increment (inclusive)."
    error_id: ERR_BID_BELOW_INCREMENT
    http_status: 422
    applies_to: "POST /sale-barn/bids"
  - priority: 37
    category: business_fiscal
    check: "The buyer's projected exposure after this bid is <= their effective_limit (inclusive)."
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /sale-barn/bids"
  - priority: 38
    category: business_fiscal
    check: "The winning bid's unit_price >= Lot.reserve_price, unless the request elects buy_back and the winning registration's party_id equals the consignment's consignor_party_id."
    error_id: ERR_RESERVE_NOT_MET
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/hammer-down"
  - priority: 39
    category: business_constraint
    check: "LoadManifest.loaded_head + Lot.head_count <= LoadManifest.trailer_head_capacity (inclusive)."
    error_id: ERR_TRAILER_HEAD_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sale-barn/load-manifests/{id}/lines"
  - priority: 40
    category: business_constraint
    check: "LoadManifest.loaded_weight_lb + Lot.settle_weight_lb <= LoadManifest.trailer_weight_capacity_lb (inclusive). Independent of the head check: a lot can pass rung 39 and fail here."
    error_id: ERR_TRAILER_WEIGHT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /sale-barn/load-manifests/{id}/lines"
  - priority: 41
    category: business_constraint
    check: "The lot appears on a LoadLine of a manifest whose status IN {DISPATCHED, DELIVERED} before it may be released."
    error_id: ERR_LOAD_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/release"
  - priority: 42
    category: business_fiscal
    check: "The buying registration is BONDED, or the lot's BuyerInvoice has status == PAID, before release; and a Settlement HELD with hold_reason AWAITING_FUNDS may only be released once every covering invoice is PAID."
    error_id: ERR_FUNDS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /sale-barn/lots/{id}/release, POST /sale-barn/settlements/{id}/release"
  - priority: 43
    category: business_fiscal
    check: "A payment amount is <= BuyerInvoice.balance_due, a credit memo amount is <= BuyerInvoice.total_due minus prior memos, and a settlement adjustment's absolute value is <= Settlement.net_amount."
    error_id: ERR_AMOUNT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /sale-barn/buyer-registrations/{id}/payments, POST /sale-barn/buyer-invoices/{id}/credit-memo, POST /sale-barn/settlements/{id}/adjust"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — 40 codes, every one reachable from §1.4 or §1.2.1.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or unknown, or X-User-ID missing for an entity_backed role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed for the endpoint."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path id does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, wrongly typed, or outside its declared numeric range."
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "An enum body field carries a value outside the closed set listed in validation rung 5."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "A foreign key supplied in the request body does not resolve."
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "An entity_backed actor acts on a resource owned by a different party."
  - id: ERR_SALE_DAY_MISMATCH
    http: 409
    condition: "Two cross-referenced rows belong to different sale days."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "An expected_<parent>_version does not match the parent's current version."
  - id: ERR_DUPLICATE_BUYER_NUMBER
    http: 409
    condition: "buyer_number is already taken on that sale day."
  - id: ERR_SALE_DAY_CANCELLED
    http: 409
    condition: "Gate G1: the sale day is CANCELLED."
  - id: ERR_LOT_QUARANTINED
    http: 409
    condition: "Gate G2: the lot is under a quarantine hold."
  - id: ERR_SALE_DAY_FROZEN
    http: 409
    condition: "Gate G3: the sale day is BIDDING_CLOSED or SETTLED and the endpoint is not exempt."
  - id: ERR_PARTY_SUSPENDED
    http: 403
    condition: "Gate G4: the owning party is SUSPENDED."
  - id: ERR_SETTLEMENT_RELEASED
    http: 409
    condition: "Gate G5: the settlement is RELEASED and the endpoint is not adjust."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target's current state is not in the transition's from-set, or a destination pen is OUT_OF_SERVICE."
  - id: ERR_SCALE_NOT_CERTIFIED
    http: 409
    condition: "The scale's certification window does not contain the current clock date."
  - id: ERR_WEIGH_TICKET_OPEN
    http: 409
    condition: "The lot already has an OPEN weigh ticket."
  - id: ERR_REWEIGH_LIMIT_EXCEEDED
    http: 409
    condition: "The lot has already been re-weighed MAX_REWEIGH_COUNT times."
  - id: ERR_STAND_TIME_NOT_MET
    http: 409
    condition: "A STAND_ACTUAL re-weigh was captured before STAND_TIME_MINUTES elapsed."
  - id: ERR_PEN_SPECIES_MISMATCH
    http: 422
    condition: "The destination pen is rigged for a different species class."
  - id: ERR_PEN_CAPACITY_EXCEEDED
    http: 409
    condition: "The pen would hold more head than its head_capacity."
  - id: ERR_CREW_OFF_DUTY
    http: 409
    condition: "The named drover crew is OFF_DUTY or ON_BREAK."
  - id: ERR_CREW_MOVE_OVERLAP
    http: 409
    condition: "The requested move window collides with the crew's existing booking plus its cool-down buffer."
  - id: ERR_HEAD_COUNT_EXCEEDED
    http: 422
    condition: "More head were requested than the consignment still has unassigned."
  - id: ERR_SETTLE_WEIGHT_MISSING
    http: 409
    condition: "The lot has no settle weight yet."
  - id: ERR_RERING_LIMIT_EXCEEDED
    http: 409
    condition: "The lot has already been re-rung MAX_RERING_COUNT times."
  - id: ERR_INSPECTION_NOT_CLEARED
    http: 409
    condition: "A required inspection or test document is missing, not CLEARED, or covers too few head."
  - id: ERR_CVI_EXPIRED
    http: 409
    condition: "A required inspection document's valid_through is earlier than the current clock date."
  - id: ERR_RETEST_LIMIT_EXCEEDED
    http: 409
    condition: "An inspection record has already been retested MAX_RETEST_COUNT times."
  - id: ERR_BUYER_NOT_APPROVED
    http: 403
    condition: "The buyer registration is not APPROVED."
  - id: ERR_BUYER_CREDIT_HOLD
    http: 409
    condition: "The buyer registration is on CREDIT_HOLD."
  - id: ERR_BID_BELOW_OPENING
    http: 422
    condition: "The first bid on a lot is below its opening_bid."
  - id: ERR_BID_BELOW_INCREMENT
    http: 422
    condition: "A bid is below the current high plus the tiered minimum increment."
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "The bid would push the buyer's exposure past their effective limit."
  - id: ERR_RESERVE_NOT_MET
    http: 409
    condition: "The hammer price is below the consignor's reserve and buy_back was not elected."
  - id: ERR_TRAILER_HEAD_CAPACITY_EXCEEDED
    http: 422
    condition: "The load line would put more head on the trailer than trailer_head_capacity."
  - id: ERR_TRAILER_WEIGHT_CAPACITY_EXCEEDED
    http: 422
    condition: "The load line would put more pounds on the trailer than trailer_weight_capacity_lb."
  - id: ERR_LOAD_NOT_ASSIGNED
    http: 409
    condition: "The lot is not on a dispatched or delivered manifest."
  - id: ERR_FUNDS_NOT_CLEARED
    http: 409
    condition: "Release was attempted for an unbonded buyer whose invoice is unpaid, or a HELD settlement whose covering invoices are unpaid."
  - id: ERR_AMOUNT_EXCEEDS_BALANCE
    http: 422
    condition: "A payment, credit memo, or settlement adjustment exceeds the balance it is applied against."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — peer roles with one hierarchical superset (BarnAdmin).
# ---------------------------------------------------------------------------
roles:
  - name: BarnAdmin
    description: "Runs the barn: sale days, pens, scales, parties, buyer registrations and credit overrides."
    identity: "opaque"
    exclusive_operations:
      - "create/advance/cancel a sale day"
      - "create pens and scales, take a pen out of service"
      - "create parties and suspend or reinstate them"
      - "create, approve, credit-hold, revoke a buyer registration"
      - "issue a credit override"
    shared_operations:
      - "read every resource"
  - name: YardOperator
    description: "Works the alley: check-in, lot sorting, penning, weigh tickets, drover crews and pen moves."
    identity: "opaque"
    exclusive_operations:
      - "check a consignment in"
      - "create lots and assign them to pens"
      - "open, capture and void weigh tickets"
      - "create drover crews and set their duty status"
      - "create and progress pen moves"
      - "quarantine and un-quarantine a lot"
      - "release a lot from the yard"
    shared_operations:
      - "read every resource"
  - name: Auctioneer
    description: "Runs the ring: puts lots in, drops the hammer, passes lots out and re-rings them."
    identity: "opaque"
    exclusive_operations:
      - "enter a lot into the ring"
      - "hammer a lot down"
      - "declare a no-sale"
      - "re-ring a passed lot"
    shared_operations:
      - "read every resource"
  - name: RingClerk
    description: "Records bids called in the ring."
    identity: "opaque"
    exclusive_operations:
      - "record a bid"
    shared_operations:
      - "read every resource"
  - name: SettlementClerk
    description: "Closes the sale day and works the money: settlements, invoices, payments, credit memos and purchase voids."
    identity: "opaque"
    exclusive_operations:
      - "close a sale day"
      - "release and adjust settlements"
      - "issue credit memos and void purchases"
      - "apply buyer payments"
    shared_operations:
      - "read every resource"
  - name: Inspector
    description: "State brand inspector and accredited veterinarian; records and clears inspection documents."
    identity: "opaque"
    exclusive_operations:
      - "create inspection records"
      - "record an inspection result"
    shared_operations:
      - "read every resource"
  - name: Consignor
    description: "The seller. Delivers consignments, reports losses and withdrawals, reads their own settlements."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "create a consignment"
      - "report a death loss, condemnation or withdrawal"
    shared_operations:
      - "read every resource"
  - name: Buyer
    description: "The bidder. Registers to bid and reads their own invoices."
    identity: "entity_backed:Party"
    exclusive_operations: []
    shared_operations:
      - "record a bid (shared with RingClerk)"
      - "read every resource"
  - name: Carrier
    description: "The hauler. Builds load manifests, dispatches, delivers and closes them."
    identity: "entity_backed:Party"
    exclusive_operations:
      - "create a load manifest and its lines"
      - "dispatch, deliver and close a manifest"
      - "remove a load line"
    shared_operations:
      - "read every resource"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table — 78 endpoints.
# Every entity has a single-resource GET; every FK child has a filtered list
# GET carrying its FK fields, so every FK in §1.1 is reverse-reachable.
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/sale-barn/_clock/set_current_utc"
    description: "Test-driving endpoint: move the server's logical clock. The clock starts at 2026-05-01T00:00:00Z on every boot and NEVER falls back to wall-clock time; every window, expiry and day count in this scaffold reads it."
    roles: [BarnAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "Scale.status re-derives for every scale: CERTIFIED while certified_from <= the new clock date <= certification_expires_on (both inclusive), otherwise EXPIRED."
      - "Inspection validity comparisons re-derive."

  - method: POST
    path: "/sale-barn/parties"
    description: "Register a counterparty (consignor, buyer, dealer, packer or carrier)."
    roles: [BarnAdmin]
    code: 201
    input: [legal_name, party_type, origin_state_code, origin_county, tax_id]
    output: Party
    side_effects: ["Party.status initialised to ACTIVE."]
  - method: GET
    path: "/sale-barn/parties/{id}"
    description: "Read one party."
    roles: [BarnAdmin, YardOperator, Auctioneer, RingClerk, SettlementClerk, Inspector, Consignor, Buyer, Carrier]
    code: 200
    input: []
    output: Party
    side_effects: []
  - method: POST
    path: "/sale-barn/parties/{id}/status"
    description: "Suspend or reinstate a party. Gate G4 keys on the result."
    roles: [BarnAdmin]
    code: 200
    input: [to_status]
    output: Party
    side_effects: ["Party.status set; every write owned by the party is gated or ungated."]

  - method: POST
    path: "/sale-barn/sale-days"
    description: "Schedule a sale day."
    roles: [BarnAdmin]
    code: 201
    input: [sale_date, barn_code, barn_state_code]
    output: SaleDay
    side_effects: ["status SCHEDULED; next_ring_order 10; reopen_count 0."]
  - method: GET
    path: "/sale-barn/sale-days/{id}"
    description: "Read one sale day including its head and money reconciliation fields."
    roles: [BarnAdmin, YardOperator, Auctioneer, RingClerk, SettlementClerk, Inspector, Consignor, Buyer, Carrier]
    code: 200
    input: []
    output: SaleDay
    side_effects: []
  - method: POST
    path: "/sale-barn/sale-days/{id}/advance"
    description: "Move the sale day along its axis: CHECK_IN_OPEN, RINGING, BIDDING_CLOSED, back to RINGING to reopen, or CANCELLED."
    roles: [BarnAdmin]
    code: 200
    input: [to_status]
    output: SaleDay
    side_effects:
      - "Gate G3 activates on BIDDING_CLOSED and deactivates on a reopen; reopen_count increments on BIDDING_CLOSED -> RINGING."
      - "Gate G1 activates on CANCELLED."
  - method: POST
    path: "/sale-barn/sale-days/{id}/close"
    description: "Close the sale day and run the five-hop settlement cascade."
    roles: [SettlementClerk]
    code: 200
    input: []
    output: SaleDay
    side_effects:
      - "SaleDay BIDDING_CLOSED -> SETTLED (hop 1)."
      - "Unfinished lots -> NO_SALE and their WINNING bids -> VOIDED (hop 2)."
      - "Consignments -> RECONCILED with head fields recomputed (hop 3)."
      - "One Settlement per consignment, DRAFT or HELD (hop 4)."
      - "ChargeLine rows appended and every Settlement money field computed (hop 5)."
      - "Before hop 4: BuyerInvoice DRAFT -> ISSUED with a BUYER_FEE ChargeLine; Purchases CONFIRMED -> INVOICED. Settlement offsets in hop 5 read those balances."
      - "SaleDay totals and the three reconciliation booleans recomputed."

  - method: POST
    path: "/sale-barn/pens"
    description: "Add a pen to the yard."
    roles: [BarnAdmin]
    code: 201
    input: [pen_code, species_class, head_capacity, pen_type]
    output: Pen
    side_effects: ["status AVAILABLE; current_head 0."]
  - method: GET
    path: "/sale-barn/pens/{id}"
    description: "Read one pen including its live occupancy."
    roles: [BarnAdmin, YardOperator, Auctioneer, RingClerk, SettlementClerk, Inspector, Consignor, Buyer, Carrier]
    code: 200
    input: []
    output: Pen
    side_effects: []
  - method: POST
    path: "/sale-barn/pens/{id}/status"
    description: "Take a pen out of service or return it to service."
    roles: [BarnAdmin]
    code: 200
    input: [to_status]
    output: Pen
    side_effects: ["The pen becomes or stops being a legal assign-pen / pen-move destination."]

  - method: POST
    path: "/sale-barn/scales"
    description: "Register a certified scale and its certification window."
    roles: [BarnAdmin]
    code: 201
    input: [scale_code, certified_from, certification_expires_on, max_draft_lb]
    output: Scale
    side_effects: ["status derived from the logical clock against the certification window."]
  - method: GET
    path: "/sale-barn/scales/{id}"
    description: "Read one scale and its derived certification status."
    roles: [BarnAdmin, YardOperator, Auctioneer, RingClerk, SettlementClerk, Inspector, Consignor, Buyer, Carrier]
    code: 200
    input: []
    output: Scale
    side_effects: []

  - method: POST
    path: "/sale-barn/drover-crews"
    description: "Register a drover crew."
    roles: [YardOperator]
    code: 201
    input: [crew_code, member_count]
    output: DroverCrew
    side_effects: ["duty_status OFF_DUTY."]
  - method: GET
    path: "/sale-barn/drover-crews/{id}"
    description: "Read one drover crew."
    roles: [BarnAdmin, YardOperator, Auctioneer, RingClerk, SettlementClerk, Inspector, Consignor, Buyer, Carrier]
    code: 200
    input: []
    output: DroverCrew
    side_effects: []
  - method: POST
    path: "/sale-barn/drover-crews/{id}/duty"
    description: "Clock a crew on, off, or onto a break."
    roles: [YardOperator]
    code: 200
    input: [to_status]
    output: DroverCrew
    side_effects: ["duty_status set; dispatchability changes."]

  - method: POST
    path: "/sale-barn/consignments"
    description: "Book a consignment onto a sale day, declaring the weigh, yardage, commission and feed bases that select every downstream calculation variant."
    roles: [Consignor]
    code: 201
