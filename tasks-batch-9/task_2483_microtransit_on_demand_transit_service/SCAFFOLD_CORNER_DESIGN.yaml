            - "VehicleBlock.${b1_id}.state == OPEN and VehicleBlock.${b2_id}.state == OPEN"
            - "DemandForecast.${f1_id}.required_base_blocks == 1 (the forecast exists but does not cover [06:00,10:00))"
            - "GET /vehicle-blocks?zone_id=${z_id}&state=OPEN returns total_count == 2"

      - name: certifier_must_not_be_the_submitter
        claim_type: violation_to_error
        grounds:
          - validations.priority_22
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: "Segregation of duties compares X-User-ID against submitted_by_user_id, not against the role: an auditor acting as fa-1 is refused with 403 while the very same request as aud-1 certifies — and the zone has no blocks or trips so neither priority 30 nor 58 can mask the result."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with no VehicleBlock and no TripRequest rows, so equivalence_verdict is COMPLIANT and the blocks-finalized check passes trivially."
            - "PROVISIONAL report RP1 for 2026-08-03..2026-08-03 was submitted by FinanceAnalyst fa-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /subsidy-reports"
              payload: { zone_id: "${z_id}", period_start_date: "2026-08-03", period_end_date: "2026-08-03", variant: "PROVISIONAL" }
              as: FinanceAnalyst
              as_user_id: "fa-1"
              captures: { rp1_id: $.data.id }
            - call: "POST /subsidy-reports/${rp1_id}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "fa-1"
          trigger:
            - call: "POST /subsidy-reports/${rp1_id}/certify"
              payload: { note: "self-certifying my own filing" }
              as: FundingAgencyAuditor
              as_user_id: "fa-1"
            - call: "POST /subsidy-reports/${rp1_id}/certify"
              payload: { note: "reviewed against the operator's ledger" }
              as: FundingAgencyAuditor
              as_user_id: "aud-1"
          assert:
            - "the self-certify returns HTTP 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "SubsidyReport.${rp1_id}.state == SUBMITTED after the refusal with certified_by_user_id == null"
            - "the aud-1 certify returns HTTP 200 and SubsidyReport.${rp1_id}.state == CERTIFIED"
            - "SubsidyReport.${rp1_id}.certified_by_user_id == aud-1 and submitted_by_user_id == fa-1"
            - "SubsidyReport.${rp1_id}.total_trips == 0 and subsidy_per_trip_cents == 0"

      - name: block_state_over_seat_capacity_ordering_is_covered_by_the_difficulty_probe
        claim_type: priority_ordering
        grounds: [validations.priority_12, validations.priority_52]
        excluded_because:
          difficulty_instance: block_state_priority_12_outranks_seat_capacity_priority_52
          rationale: "That instance holds the capacity violation fixed and flips only the block state, asserting ERR_INVALID_BLOCK_STATE first and ERR_SEAT_CAPACITY_EXCEEDED in the control call — so it covers both the ordering claim and the bare priority-52 violation."

      - name: zone_mismatch_over_wav_unavailable_ordering_is_covered_by_the_difficulty_probe
        claim_type: priority_ordering
        grounds: [validations.priority_20, validations.priority_28]
        excluded_because:
          difficulty_instance: zone_mismatch_priority_20_outranks_wav_unavailable_priority_28
          rationale: "Both violations are present on the same offer there; the cross-zone call returns ERR_ZONE_MISMATCH and the same-zone control call returns ERR_WAV_UNAVAILABLE, covering priority 28's own violation claim too."

      - name: equivalence_over_blocks_not_finalized_ordering_is_covered_by_the_difficulty_probe
        claim_type: priority_ordering
        grounds: [validations.priority_30, validations.priority_58]
        excluded_because:
          difficulty_instance: equivalence_deficient_priority_30_outranks_blocks_not_finalized_priority_58
          rationale: "That instance certifies a report while both the equivalence deficiency and an OPEN in-period block exist, asserting ERR_EQUIVALENCE_DEFICIENT first and then ERR_BLOCKS_NOT_FINALIZED once the ratio is fixed — covering priorities 30 and 58 individually as well."

      - name: zone_suspension_gate_on_intake_is_covered_by_the_difficulty_probe
        claim_type: cross_entity_validation
        grounds: [validations.priority_14, state_machines.ServiceZone.status]
        excluded_because:
          difficulty_instance: trip_intake_gated_on_zone_status_and_suspension_is_not_undone
          rationale: "ERR_ZONE_NOT_ACTIVE at priorities 14 and 15 depends entirely on another entity's state; that instance tests intake before suspension, during suspension and after re-activation, including that the NO_SERVICE cascade is not reversed."

      - name: vehicle_and_driver_temporal_conflicts_are_covered_by_the_difficulty_probes
        claim_type: temporal_validation
        grounds: [validations.priority_32, validations.priority_34]
        excluded_because:
          difficulty_instance: vehicle_half_open_adjacency_allowed_one_minute_overlap_rejected
          rationale: "The temporal-validation claim (an operation that is legal now but creates a future conflict) is exercised there for ERR_VEHICLE_BLOCK_OVERLAP at the half-open boundary, and its sibling instance driver_rest_buffer_rejects_adjacency_and_allows_exactly_thirty_minutes does the same for ERR_DRIVER_REST_BUFFER."

      - name: curb_bucket_aggregate_limit_is_covered_by_the_difficulty_probe
        claim_type: aggregate_validation
        grounds: [validations.priority_40]
        excluded_because:
          difficulty_instance: curb_bucket_capacity_aggregates_across_blocks_and_frees_on_release
          rationale: "The aggregate claim (each offer individually fine, the collective exceeds the limit) is exactly ERR_CURB_CAPACITY_EXCEEDED; that instance builds the bucket from three different blocks and then frees a slot by cancelling."

      - name: detour_tolerance_violation_is_covered_by_the_difficulty_probe
        claim_type: violation_to_error
        grounds: [validations.priority_44, calculations.corridor_travel_geometry]
        excluded_because:
          difficulty_instance: detour_allowance_inclusive_equality_accepted_next_step_rejected
          rationale: "ERR_DETOUR_TOLERANCE_EXCEEDED only appears once the pooled span exceeds the allowance; that instance drives the offer that sits exactly on the allowance and the next one that breaches it."

      - name: cascading_check_dependency_is_covered_by_the_difficulty_probe
        claim_type: cascading_validation
        grounds: [validations.priority_20, validations.priority_28, validations.priority_54]
        excluded_because:
          difficulty_instance: zone_mismatch_priority_20_outranks_wav_unavailable_priority_28
          rationale: "The cascading-check claim (check A needs check B's result first) applies because the WAV securement check cannot run until the block's zone and the rider-derived wav_required are resolved; that instance shows the resolution order by returning ERR_ZONE_MISMATCH before the securement check is reached."

  - section: endpoints
    instances:
      - name: transit_connection_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints.POST_transit-connections
          - endpoints.GET_transit-connections
          - endpoints.GET_transit-connections_id
        distinguishing_aspect: "§1.5 exposes only creates, reads and action endpoints — there is no PATCH, PUT or DELETE anywhere in the surface — so 'CRUD' for TransitConnection means create, read-one, read-many and filter, and the mode filter must separate the RAIL row from the BUS row."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with approved stop S0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
          trigger:
            - call: "POST /transit-connections"
              payload: { zone_id: "${z_id}", stop_id: "${s0_id}", mode: "RAIL", route_code: "ORANGE-IB", scheduled_departure_utc: "2026-08-03T07:00:00Z", guaranteed_transfer_buffer_minutes: 10, transfer_credit_cents: 80 }
              as: ZoneAdmin
              captures: { c_rail_id: $.data.id }
            - call: "POST /transit-connections"
              payload: { zone_id: "${z_id}", stop_id: "${s0_id}", mode: "BUS", route_code: "R12", scheduled_departure_utc: "2026-08-03T07:30:00Z", guaranteed_transfer_buffer_minutes: 5, transfer_credit_cents: 40 }
              as: ZoneAdmin
              captures: { c_bus_id: $.data.id }
            - call: "GET /transit-connections/${c_rail_id}"
              payload: {}
              as: Dispatcher
            - call: "GET /transit-connections?zone_id=${z_id}&mode=BUS"
              payload: {}
              as: Dispatcher
          trigger_note: "The stop FK is shared by both connections, which also proves one stop can anchor several timetabled departures."
          assert:
            - "both creates return HTTP 201"
            - "TransitConnection.${c_rail_id}.mode == RAIL and route_code == ORANGE-IB and guaranteed_transfer_buffer_minutes == 10"
            - "TransitConnection.${c_bus_id}.transfer_credit_cents == 40"
            - "the read-one returns HTTP 200 with data.id == ${c_rail_id}"
            - "the filtered list returns exactly 1 row whose id == ${c_bus_id} with total_count == 1 and has_more == false"
            - "GET /transit-connections?zone_id=${z_id} returns total_count == 2"

      - name: vehicle_status_action_walks_the_maintenance_cycle_then_locks_on_retired
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_vehicles_id_status
          - state_machines.Vehicle
          - errors.ERR_INVALID_VEHICLE_STATE
        distinguishing_aspect: "One endpoint drives four declared transitions selected by the status field: AVAILABLE -> IN_MAINTENANCE -> AVAILABLE -> RETIRED all succeed, and because RETIRED is terminal the follow-up request back to AVAILABLE is 409 — the action endpoint is a state machine, not a setter."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with vehicle V1 in AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /vehicles/${v1_id}/status"
              payload: { status: "IN_MAINTENANCE" }
              as: Dispatcher
            - call: "POST /vehicles/${v1_id}/status"
              payload: { status: "AVAILABLE" }
              as: ZoneAdmin
            - call: "POST /vehicles/${v1_id}/status"
              payload: { status: "RETIRED" }
              as: ZoneAdmin
              captures: { v1_v_retired: $.data.version }
            - call: "POST /vehicles/${v1_id}/status"
              payload: { status: "AVAILABLE" }
              as: ZoneAdmin
            - call: "GET /vehicles/${v1_id}"
              payload: {}
              as: Dispatcher
              captures: { v1_v_final: $.data.version }
          assert:
            - "the first three status calls return HTTP 200"
            - "the fourth returns HTTP 409 with data.error_id == ERR_INVALID_VEHICLE_STATE"
            - "Vehicle.${v1_id}.status == RETIRED"
            - "${v1_v_final} == ${v1_v_retired} (the rejected transition wrote nothing)"
            - "both ZoneAdmin and Dispatcher were accepted on this shared operation"

      - name: pool_assignment_link_requires_both_sides_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_pool-assignments
          - validations.priority_5
          - errors.ERR_TRIP_REQUEST_NOT_FOUND
          - errors.ERR_VEHICLE_BLOCK_NOT_FOUND
        distinguishing_aspect: "The link endpoint carries two FKs plus an OCC token: an unknown trip_request_id is 404 ERR_TRIP_REQUEST_NOT_FOUND and an unknown block_id is 404 ERR_VEHICLE_BLOCK_NOT_FOUND (input order decides which fires when both are bad), and the successful link writes both directions — the assignment's FKs and the trip's assigned_block_id."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; stops S0 and S4 approved; block B1 OPEN [06:00,10:00) on V1/D1; rider R1 FULL/NONE; trip T1 in RECEIVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S0", corridor_index: 0, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s0_id: $.data.id }
            - call: "POST /virtual-stops/${s0_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /virtual-stops"
              payload: { zone_id: "${z_id}", stop_code: "S4", corridor_index: 4, walk_shed_meters: 400, accessibility: "ACCESSIBLE_PATH" }
              as: ZoneAdmin
              captures: { s4_id: $.data.id }
            - call: "POST /virtual-stops/${s4_id}/approve"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /riders"
              payload: { zone_id: "${z_id}", rider_code: "R1", fare_category: "FULL", mobility_device: "NONE" }
              as: ZoneAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /vehicle-blocks"
              payload: { zone_id: "${z_id}", vehicle_id: "${v1_id}", driver_id: "${d1_id}", block_type: "BASE", start_utc: "2026-08-03T06:00:00Z", end_utc: "2026-08-03T10:00:00Z" }
              as: Dispatcher
              captures: { b1_id: $.data.id }
            - call: "POST /vehicle-blocks/${b1_id}/open"
              payload: {}
              as: Dispatcher
              captures: { b1_v: $.data.version }
            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${r1_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s4_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
              as: Rider
              as_user_id: "${r1_id}"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "00000000-0000-4000-8000-00000000000a", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "00000000-0000-4000-8000-00000000000b", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
            - call: "POST /pool-assignments"
              payload: { trip_request_id: "${t1_id}", block_id: "${b1_id}", expected_vehicle_block_version: "${b1_v}" }
              as: Dispatcher
              captures: { pa1_id: $.data.id }
          assert:
            - "the unknown-trip call returns HTTP 404 with data.error_id == ERR_TRIP_REQUEST_NOT_FOUND"
            - "the unknown-block call returns HTTP 404 with data.error_id == ERR_VEHICLE_BLOCK_NOT_FOUND"
            - "the valid call returns HTTP 201 with PoolAssignment.${pa1_id}.trip_request_id == ${t1_id} and block_id == ${b1_id}"
            - "TripRequest.${t1_id}.assigned_block_id == ${b1_id} and status == OFFERED"
            - "PoolAssignment.${pa1_id}.offer_origin == MANUAL_DISPATCH and match_score == null"
            - "PoolAssignment.${pa1_id}.seq_pickup == 1 and seats_held == 1"

      - name: logical_clock_endpoint_drives_every_server_timestamp
        claim_type: action_endpoint
        grounds:
          - endpoints.POST__clock_set_current_utc
          - entities.TripRequest.fields.actual_pickup_utc
        distinguishing_aspect: "The test-support clock is the single source of 'now': moving it backwards between two creates makes the second row's created_at earlier than the first's, which proves nothing reads wall-clock time."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE; the clock starts at 2026-08-03T09:00:00Z and is later moved back to 2026-08-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: Dispatcher
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V2", seat_capacity: 4, wav_positions: 0 }
              as: ZoneAdmin
              captures: { v2_id: $.data.id }
          assert:
            - "the clock call returns HTTP 200"
            - "Vehicle.${v1_id}.created_at == 2026-08-03T09:00:00Z"
            - "Vehicle.${v2_id}.created_at == 2026-08-03T08:00:00Z (earlier than the row created before it)"
            - "both ZoneAdmin and Dispatcher may set the clock (shared operation)"

      - name: computed_read_of_the_subsidy_report_is_covered_by_the_difficulty_probe
        claim_type: computed_read
        grounds: [endpoints.GET_subsidy-reports_id, calculations.subsidy_per_trip]
        excluded_because:
          difficulty_instance: zero_trip_denominator_and_half_up_revenue_hours_boundary
          rationale: "The computed-read claim (derived data on GET matches the calculation) is asserted there against the report's total_trips, total_operating_cost_cents 18572 and subsidy_per_trip_cents 0, which is the strongest form of the same claim."

      - name: conditional_action_on_block_open_is_covered_by_the_difficulty_probe
        claim_type: conditional_action
        grounds: [endpoints.POST_vehicle-blocks_id_open, validations.priority_12]
        excluded_because:
          difficulty_instance: block_open_gated_on_vehicle_status_then_released_by_maintenance_return
          rationale: "open is the scaffold's conditional action (permitted only while the vehicle is AVAILABLE and the zone ACTIVE); that instance tests the denied and the permitted state of the same call."

  - section: errors
    instances:
      - name: calls_without_identity_headers_are_rejected
        claim_type: triggerability
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication is checked before anything else, so a read with the headers stripped is 401 even for an endpoint every role may call and even when the path id does not exist — 401 beats the 404."
        test_recipe:
          setup:
            - "Zone RBM exists in DRAFT."
            - "Both trigger calls are issued with the X-User-Role and X-User-ID headers omitted entirely; the `as:` value below records the role that would otherwise have been used."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
          trigger:
            - call: "GET /service-zones/${z_id}"
              payload: {}
              as: ZoneAdmin
            - call: "GET /service-zones/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ZoneAdmin
          assert:
            - "both header-less calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "the second call is 401 rather than 404, so priority 1 precedes priority 4"
            - "the same GET with headers present returns HTTP 200"

      - name: wrong_role_on_an_exclusive_endpoint_is_rejected
        claim_type: triggerability
        grounds:
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Role screening precedes body validation and FK resolution: a Dispatcher creating a zone gets 403 ERR_ROLE_NOT_PERMITTED even though the body is well formed, and a Rider opening a block gets 403 even though the block id is real."
        test_recipe:
          setup:
            - "Zone RBM ACTIVE with block B1 SCHEDULED [06:00,10:00) on V1/D1; rider R1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T05:00:00Z" }
              as: ZoneAdmin
            - call: "POST /service-zones"
              payload: { name: "Riverbend Microtransit", zone_code: "RBM", max_walk_meters: 600, detour_tolerance_pct: 0.25, detour_tolerance_floor_minutes: 6, base_fare_cents: 250, fare_cap_cents_daily: 600, fare_cap_cents_weekly: 2500, on_time_window_minutes: 10, curb_capacity_per_bucket: 2 }
              as: ZoneAdmin
              captures: { z_id: $.data.id }
            - call: "POST /service-zones/${z_id}/activate"
              payload: {}
              as: ZoneAdmin
            - call: "POST /vehicles"
              payload: { zone_id: "${z_id}", vehicle_code: "V1", seat_capacity: 6, wav_positions: 2 }
              as: ZoneAdmin
              captures: { v1_id: $.data.id }
            - call: "POST /drivers"
              payload: { zone_id: "${z_id}", driver_code: "D1", wav_certified: true }
              as: ZoneAdmin
