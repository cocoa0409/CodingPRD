            - "GET /v1/orders/${ord_id} reports order_total_due_cents unchanged at 4824000"
            - "GET /v1/configuration-options?configuration_id=${cfg_id} shows the TOW_HITCH option in status ACTIVE, so the option itself was not consumed"

      - name: manual_ledger_posting_moves_the_buyer_balance
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/v1/orders/{id}/fee-ledger-entries
          - entities.Buyer.fields.order_credit_balance_cents
          - entities.OrderFeeLedgerEntry.fields.entry_type
        distinguishing_aspect: "A manual ledger posting writes one row and immediately propagates the signed amount into the buyer's conserved order_credit_balance_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a placed order whose fee is settled, so the buyer starts at 25000."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
