            - "the first draft returns HTTP 412 with data.error_id == \"ERR_STALE_APPLICATION_VERSION\" (the priority-30 state check passes, so 412 is the decisive answer)"
            - "the refreshed draft returns HTTP 201 with ${det_status} == \"DRAFT\""
            - "${stale_again_err} == \"ERR_STALE_APPLICATION_VERSION\" — the old value never becomes valid again"
            - "GET /determinations?application_id=${appn_id} returns total_count == 1 — neither 412 created a determination row"

      - name: a_conduct_write_invalidates_the_applicant_version_and_supersedes_the_open_proposal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.proceeding-propose-stale-applicant
          - validations.priority_35.ERR_STALE_APPLICANT_VERSION
          - state_machines.SuspensionProceeding.PROPOSED_to_VOID
        distinguishing_aspect: "Every conduct write bumps Applicant.version, so a proposal built on a pre-event view is 412 ERR_STALE_APPLICANT_VERSION; a successful proposal ALSO bumps the version, which makes the just-used value stale for the next proposal and voids the earlier PROPOSED row — the OCC guard and the supersede edge are two halves of the same rule."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; rider with two unexcused NO_SHOWs (4 points — deliberately below the auto-proposal threshold)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
