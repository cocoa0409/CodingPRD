              payload: {}
              as: UnderwritingAdmin
            - call: "POST /fee-configs"
              payload: { state_code: "MT", filing_id: "${filing_mt}", flat_fee_pct: 0.20, flat_fee_cents: 90000 }
              as: UnderwritingAdmin
              captures: { fc_mt: $.data.id }
            - call: "POST /fee-configs/${fc_mt}/activate"
              payload: {}
              as: UnderwritingAdmin
            - call: "POST /policyholders"
              payload: { email: "p@x.com", full_name: "P", state_code: "MT" }
              as: Anonymous
              captures: { ph_p: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 100000, premium_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph_p}"
              captures: { quote_p: $.data.id }
            - call: "POST /policyholders"
              payload: { email: "q@x.com", full_name: "Q", state_code: "MT" }
              as: Anonymous
              captures: { ph_q: $.data.id }
            - call: "POST /quotes"
              payload: { coverage_amount_cents: 100000, premium_cents: 50000 }
              as: Policyholder
              as_user_id: "${ph_q}"
              captures: { quote_q: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T23:59:59Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { quote_id: "${quote_p}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_p}"
              captures: { app_p: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /applications"
              payload: { quote_id: "${quote_q}", checkout_velocity_seconds: 60, device_reuse_count: 0, answers_ipa_acknowledged: true }
              as: Policyholder
              as_user_id: "${ph_q}"
              captures: { err_q: $.data.error_id }
          assert:
            - "PolicyApplication.${app_p} created with status UNDER_REVIEW — one second before expires_at is inside the window"
            - "err_q == ERR_QUOTE_EXPIRED (HTTP 422) — exactly at expires_at the window has closed (end-exclusive)"
            - "Quote.${quote_q}.status == EXPIRED on next read"

      - name: active_fee_config_intervals_must_not_overlap_per_state
        grounds:
          - validations[priority=8]
          - state_machines.FeeConfig.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          DIFFERENT interval semantics on a different resource — coexistence
          exclusion on FeeConfig: a state's fee coverage is a pointwise occupancy
          (at most one ACTIVE config per state at any moment), so activating a
          second DRAFT config while the first is ACTIVE fails with
          ERR_FEE_CONFIG_ALREADY_ACTIVE; only after retiring the first does the
          second activation succeed — adjacency requires an explicit gap-closing
          retirement, unlike the quote's pure time arithmetic.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. State ND filing F1 APPROVED (PCT cap 0.25)."
            - "FeeConfig A (pct 0.20) created and ACTIVATED."
            - "FeeConfig B (pct 0.22) created, DRAFT."
