  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_storm_update_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[storm-event-update-stale-version]", errors.ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on StormEvent.version: a PUT carrying the pre-update version after another update already advanced it is 412 ERR_STALE_VERSION, and the stale writer's readings are not applied."
        test_recipe:
          setup: ["Office, one SEVERE storm created at version 1; one forecaster."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KOCC", name: "Occ Office", region: "PLAINS", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { oc_off: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${oc_off}", full_name: "Oscar Occ", employee_code: "EMP-OC", level: "SENIOR" }
              as: PlatformAdmin
              captures: { oc_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${oc_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 50 }
              as: Forecaster
              as_user_id: "${oc_fc}"
              captures: { oc_storm: $.data.id, oc_v1: $.data.version }
          trigger:
            - call: "PUT /alerts/storm-events/${oc_storm}"
              payload: { expected_storm_event_version: "${oc_v1}", max_wind_mph: 55 }
              as: Forecaster
              as_user_id: "${oc_fc}"
              captures: { oc_v2: $.data.version }
            - call: "PUT /alerts/storm-events/${oc_storm}"
              payload: { expected_storm_event_version: "${oc_v1}", max_hail_inches: 2.0 }
              as: Forecaster
              as_user_id: "${oc_fc}"
              captures: { oc_err: $.data.error_id }
          assert:
            - "the first PUT succeeds and returns version 2 (and the storm is now TRACKING)"
            - "the second PUT with the stale version is 412 with error_id == ERR_STALE_VERSION"
            - "GET /alerts/storm-events/${oc_storm} shows max_wind_mph == 55 and max_hail_inches == 0 (the stale write was rejected wholesale)"

      - name: occ_issue_with_pre_revert_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[product-issue-stale-version]", errors.ERR_STALE_VERSION]
