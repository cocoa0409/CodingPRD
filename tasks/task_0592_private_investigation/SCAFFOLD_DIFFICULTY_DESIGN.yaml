      - name: expense_approval_suspends_case_and_denies_searches
        grounds:
          - state_machines.ExpenseEntry.SUBMITTED_to_APPROVED
          - state_machines.Case.ACTIVE_to_SUSPENDED
          - state_machines.SkipTraceSearch.REQUESTED_to_DENIED
