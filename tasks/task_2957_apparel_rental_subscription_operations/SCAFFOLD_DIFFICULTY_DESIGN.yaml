  - rule_id: compensating_invariant
    instances:
      - name: unit_position_count_conserved_across_allocate_then_release
        grounds:
          - "1.3 calculation unit_position_conservation_invariant"
          - "1.2 Reservation MATCHED to RELEASED and RentalUnit RESERVED to IN_STOCK"
          - "1.5 POST /reservations and POST /reservations/{reservation_id}/release"
          - "1.1 Style.floor_ready_unit_count and active_unit_count"
          - "1.1 Member.units_out_count and RentalUnit.occupied_until_date"
        distinguishing_aspect: >-
          The conserved quantity is the number of physical unit positions for a (style, size) pair: IN_STOCK plus
          RESERVED plus OUT plus INBOUND plus PROCESSING plus RETIRED plus SOLD must stay at 2 through the allocation
          and the release, and because no shipment ever moved, IN_STOCK plus RESERVED must also stay at 2. The release
          is the compensating transition, so every side effect of the allocation must be undone with no drift:
          floor_ready_unit_count goes 2 then 1 then back to 2, units_out_count goes 0 then 1 then back to 0,
          occupied_until_date is set then cleared, and turns_completed is never touched because the garment never
          shipped.
        test_recipe:
          setup:
            - "logical clock parked at 2026-08-03T09:00:00Z"
            - "plan SIG4 with item_slots 3"
            - "style AUR-GOWN-01 with exactly two grade-A size-M units, both IN_STOCK and FLOOR_READY with turns_completed 0"
            - "member on SIG4 with units_out_count 0, so the pre-state is fully known"
            - "no shipment is ever created, which is what makes the IN_STOCK plus RESERVED sub-total conserved as well as the total"
