      - name: nozzle_capacity_is_an_aggregate_over_active_sessions_only
        claim_type: aggregate
        grounds:
          - validations.priority_220
          - errors.ERR_NO_NOZZLE_AVAILABLE
          - state_machines.DispenseSession.FUELING_to_COMPLETED
        distinguishing_aspect: |
          The count is over fill_status IN {PRECOOLING, FUELING} only: with nozzle_count 1 a second
          session is refused while the first is PRECOOLING, and the SAME request succeeds once the
          first session reaches COMPLETED - the row still exists, so a naive count of all sessions
          for the station would keep rejecting.
        test_recipe:
          setup:
            - "Station STN-V6: nozzle_count 1, HIGH 600 L at 950.00 bar (posture OPEN), max_pressure_class H35, two current certifications."
            - "Session s1 planned 5.000 kg at ambient 20.0 C (required_precool_c -26.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-V6", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
