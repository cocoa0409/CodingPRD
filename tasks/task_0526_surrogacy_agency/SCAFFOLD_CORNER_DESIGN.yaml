            - call: "POST /journeys"
              payload: { match_id: "${match_id}" }
              as: CaseManager
              captures: { jr_id: $.data.id }
            - call: "POST /journeys/${jr_id}/milestones"
              payload: { milestone_type: "HEARTBEAT", scheduled_utc: "2026-05-20T00:00:00Z" }
              as: CaseManager
              captures: { ms_hb_id: $.data.id }
          trigger:
            - call: "POST /journeys/${jr_id}/milestones/${ms_hb_id}/achieve"
              payload: {}
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_MILESTONE_ORDER_VIOLATION"
            - "Milestone.${ms_hb_id}.status == SCHEDULED"

      - name: match_accept_before_all_parties_cleared_psych_missing
        claim_type: guarded transitions
        grounds: ["state_machines.Match.PROPOSED_to_ACCEPTED", "validations[priority=5]", "errors[ERR_PSYCH_CLEARANCE_MISSING]"]
        distinguishing_aspect: "Match accept when the carrier is not yet CLEARED returns ERR_PSYCH_CLEARANCE_MISSING (422); match stays PROPOSED."
