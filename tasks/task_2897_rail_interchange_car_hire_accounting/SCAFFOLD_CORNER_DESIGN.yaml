            - "deadline == 2026-10-01T00:00:00.000Z (exchanged_at + DISPUTE_WINDOW_DAYS = 30 days)"
            - "SettlementCycle.${cycle_id}.version is strictly greater than its value before the exchange"
            - "no money field changed across the exchange: net_settlement_cents is still 11407"

      - name: settle_mints_settlement_payment_and_reduces_payer_exposure
        claim_type: Side Effect Execution
        grounds:
