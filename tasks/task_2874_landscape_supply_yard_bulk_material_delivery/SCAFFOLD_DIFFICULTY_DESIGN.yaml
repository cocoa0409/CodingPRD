    instances:
      - name: account_credit_hold_state_outranks_credit_limit_check_at_confirm
        grounds:
          - validations[priority=18]
          - validations[priority=34]
          - calculations.account_credit_position
        distinguishing_aspect: |
          Both rules fire on the SAME call (POST /material-orders/{id}/confirm) for the SAME
          underlying cause — an over-extended account — but they are 16 priority steps apart and
          return different HTTP statuses: priority 18 ERR_ACCOUNT_CREDIT_HOLD (409) must win over
          priority 34 ERR_CREDIT_LIMIT_EXCEEDED (402). An implementation that evaluates the
          fiscal gate first returns 402 and fails only this pair.
        test_recipe:
          setup:
            - "Account with a 30000-cent line; will-call order 1 confirmed at 2000 cents for 5.00 cubic yards (quoted 10000, no min-load fee and no delivery fee because WILL_CALL is exempt from both)."
            - "Price row at 8000 cents/cubic-yard effective 2026-08-05; clock advanced to 2026-08-06; the ticket is staged in a 2026-08-06 window, briefed, loaded with 5.00 cubic yards and released, so final_total_cents becomes 40000 and the account enters CREDIT_HOLD."
            - "Order 2 is a DRAFT will-call order with one BULK line of 1.00 cubic yard (quoted total would be 8000)."
          setup_api_calls:
            - call: "POST /materials"
              payload: { sku: "MULCH-BLACK", name: "Black Dyed Mulch", offered_forms: [BULK], seasonal_category: "MULCH", density_lb_per_cubic_yard: 1000, shrinkage_factor: 0.10, moisture_pct: 15.0, unit_bag_cubic_yards: 0.037, prebuy_eligible: false }
