              as_user_id: "yt-1"
              captures: { err: $.data.error_id }
            - call: "POST /inspection-records/${rec_id}/certify"
              as: BranchManager
              as_user_id: "bm-9"
              captures: { rstat: $.data.status }
          assert:
            - "certify with X-User-ID == inspector_id (yt-1): error_id == ERR_SEGREGATION_OF_DUTIES (422)"
            - "certify with a different BranchManager id (bm-9): succeeds, status CERTIFIED"

