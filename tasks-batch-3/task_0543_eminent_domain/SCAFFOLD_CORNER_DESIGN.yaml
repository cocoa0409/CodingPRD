        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appraisal-create-stale-parcel]", entities.Parcel.fields.version]
        distinguishing_aspect: "An appraisal create with the current expected_parcel_version succeeds (201) and increments Parcel.version by 1."
        test_recipe:
          setup: ["A parcel with version observed just before the create."]
          setup_api_calls:
