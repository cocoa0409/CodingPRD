        distinguishing_aspect: "Only lots with status AVAILABLE and expiration_date strictly after the clock enter the sum: with a 10-unit lot (33.33) and a 5-unit lot (16.67) the school reads 50.00, quarantining the 5-unit lot drops it to 33.33, and restoring it returns exactly 50.00."
