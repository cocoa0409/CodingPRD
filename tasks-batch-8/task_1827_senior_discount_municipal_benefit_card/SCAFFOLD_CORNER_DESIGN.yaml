            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_AGE, document_reference: "WI2-AGE" }, as: Applicant, captures: { doc1: $.data.id } }
            - { call: "POST /senior-benefits/applications/${app_id}/documents/${doc1}/review", payload: { decision: VERIFIED }, as: EligibilitySpecialist, as_user_id: "spec-1" }
            - { call: "POST /senior-benefits/applications/${app_id}/documents", payload: { document_type: PROOF_OF_INCOME, document_reference: "WI2-INC" }, as: Applicant, captures: { doc2: $.data.id } }
