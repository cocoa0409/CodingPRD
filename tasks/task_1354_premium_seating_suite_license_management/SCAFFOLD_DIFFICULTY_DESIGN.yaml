          assert:
            - "error_id == ERR_AGREEMENT_NOT_ACTIVE (agreement SUSPENDED blocks confirm)"
            - "CateringOrder.${co}.status remains PLACED (no partial transition)"

      - name: credential_issue_blocked_when_event_cancelled
        grounds:
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair AccessCredential x Event (different pair from
          CateringOrder x LicenseAgreement): a credential cannot be issued once the
          event is CANCELLED, even though the agreement is ACTIVE and capacity is free.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1 PUBLISHED, E9 REGULAR 2026-10-05T17:00Z created then CANCELLED (clock 2026-08-20 < start), account ACTIVE with ACTIVE agreement"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Rivalry Week", event_type: RIVALRY, starts_at: "2026-10-05T17:00:00Z", duration_hours: 4, rental_base_price_cents: 650000 }, as: StadiumAdmin, captures: { e9: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/events/${e9}/set_status", payload: { target_status: "CANCELLED" }, as: StadiumAdmin }
          trigger:
            - { call: "POST /api/credentials", payload: { event_id: "${e9}", suite_id: "${su}", agreement_id: "${ag}", guest_name: "Guest One", guest_email: "g1@x.example", credential_type: GUEST }, as: EventServicesManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_EVENT_NOT_SCHEDULED (event CANCELLED blocks credential issuance)"

  # ---------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rental_blocked_by_license_coverage_only_for_covered_event_types
        grounds:
          - validations[priority=14]
          - entities.Event.fields.event_type
        distinguishing_aspect: |
          Interval semantics = season-coverage set membership on resource Suite:
          a REGULAR event is inside the license's coverage set (blocked), while a
          PLAYOFF event at the same venue/season is outside it (rentable). Same
          suite, same season — only set membership differs.
        test_recipe:
          setup:
            - "Venue, GOLD suite with ACTIVE agreement covering S1; E1 REGULAR 2026-09-10 and E5 PLAYOFF 2027-01-10 in S1; second account ACTIVE as renter"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Semifinal", event_type: PLAYOFF, starts_at: "2027-01-10T20:00:00Z", duration_hours: 5, rental_base_price_cents: 1200000 }, as: StadiumAdmin, captures: { e5: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/accounts", payload: { legal_name: "Renter Inc", account_type: CORPORATE, tax_id: "T-300", billing_email: "ap@renter.example" }, as: PremiumSalesRep, captures: { ac2: $.data.id } }
            - { call: "POST /api/accounts/${ac2}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
          trigger:
            - { call: "POST /api/rentals", payload: { event_id: "${e1}", suite_id: "${su}", account_id: "${ac2}", guest_count: 10 }, as: PremiumSalesRep, captures: { r1: $.data.id } }
            - { call: "POST /api/rentals/${r1}/set_status", payload: { target_status: "HELD" }, as: PremiumSalesRep, captures: { err: $.data.error_id } }
            - { call: "POST /api/rentals", payload: { event_id: "${e5}", suite_id: "${su}", account_id: "${ac2}", guest_count: 10 }, as: PremiumSalesRep, captures: { r2: $.data.id } }
            - { call: "POST /api/rentals/${r2}/set_status", payload: { target_status: "HELD" }, as: PremiumSalesRep, captures: { st2: $.data.status } }
          assert:
            - "Rental on E1 (REGULAR, license-covered): HELD rejected with error_id == ERR_SUITE_NOT_AVAILABLE"
            - "Rental on E5 (PLAYOFF, excluded from coverage): HELD succeeds, status == HELD, hold_expires_at == clock + 48h"
            - "SingleEventRental.${r1}.status remains QUOTED"

      - name: event_overlap_half_open_adjacency_allowed_touching_rejected
        grounds:
          - validations[priority=16]
          - entities.Event.fields.duration_hours
        distinguishing_aspect: |
          Interval semantics = half-open geometric overlap [starts_at,
          starts_at+duration) on resource Venue (different semantics and different
          resource from the license-coverage rule): an event starting exactly when
          another ends (gap = 0) is ALLOWED; one second of intersection is rejected.
        test_recipe:
          setup:
            - "Venue, S1 PUBLISHED, E1 SCHEDULED [2026-09-10T17:00Z, 2026-09-10T21:00Z)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Late Concert", event_type: CONCERT, starts_at: "2026-09-10T21:00:00Z", duration_hours: 3, rental_base_price_cents: 900000 }, as: StadiumAdmin, captures: { e2: $.data.id } }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Overlap Attempt", event_type: CONCERT, starts_at: "2026-09-10T20:59:59Z", duration_hours: 3, rental_base_price_cents: 900000 }, as: StadiumAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent event starting at exactly E1's end (21:00:00) succeeds (201) — half-open intervals permit zero-gap adjacency"
            - "Event starting one second before E1's end (20:59:59) fails: error_id == ERR_EVENT_OVERLAP"

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_clear_then_refund_restores_balance_exactly
        grounds:
          - state_machines.Payment.INITIATED_to_CLEARED
          - state_machines.Payment.CLEARED_to_REFUNDED
          - state_machines.Invoice.PAID_to_ISSUED
        distinguishing_aspect: |
          Conserved quantity = Account.balance_due_cents (money ledger). Forward
          action CLEARED paired with compensation REFUNDED must return the balance to
          its exact pre-payment value; lifetime_spend_cents deliberately does NOT
          decrement (asymmetry is part of the invariant).
        test_recipe:
          setup:
            - "Venue, account ACTIVE, manual invoice subtotal 500000 due 2026-08-20 ISSUED at clock 2026-08-01 (no late fee in play)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/invoices", payload: { account_id: "${ac}", lines: [ { description: "Club seat deposit", quantity: 1, unit_price_cents: 500000 } ], due_on: "2026-08-20T00:00:00Z" }, as: FinanceController, captures: { inv: $.data.id } }
            - { call: "POST /api/invoices/${inv}/issue", payload: {}, as: FinanceController }
            - { call: "GET /api/accounts/${ac}", payload: {}, as: FinanceController, captures: { bal0: $.data.balance_due_cents } }
          trigger:
            - { call: "POST /api/payments", payload: { account_id: "${ac}", amount_cents: 500000, method: ACH, allocations: [ { invoice_id: "${inv}", amount_cents: 500000 } ] }, as: FinanceController, captures: { p: $.data.id } }
            - { call: "POST /api/payments/${p}/set_status", payload: { target_status: "CLEARED" }, as: FinanceController }
            - { call: "GET /api/accounts/${ac}", payload: {}, as: FinanceController, captures: { bal1: $.data.balance_due_cents, spend1: $.data.lifetime_spend_cents } }
            - { call: "POST /api/payments/${p}/set_status", payload: { target_status: "REFUNDED" }, as: FinanceController }
            - { call: "GET /api/accounts/${ac}", payload: {}, as: FinanceController, captures: { bal2: $.data.balance_due_cents, spend2: $.data.lifetime_spend_cents } }
            - { call: "GET /api/invoices/${inv}", payload: {}, as: FinanceController, captures: { invst: $.data.status, invpaid: $.data.amount_paid_cents } }
          assert:
            - "bal0 == 500000; after CLEARED bal1 == 0; after REFUNDED bal2 == 500000 (exact conservation: clear+refund nets to zero drift)"
            - "Invoice.${inv}.status == ISSUED and amount_paid_cents == 0 after the refund (PAID -> ISSUED compensation)"
            - "lifetime_spend_cents: spend1 == 500000 and spend2 == 500000 (refund does NOT decrement lifetime spend)"

      - name: catering_confirm_then_free_cancel_restores_accrual_exactly
        grounds:
          - state_machines.CateringOrder.PLACED_to_CONFIRMED
          - state_machines.CateringOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = LicenseAgreement.f_b_accrued_cents_current_season
          (F&B accrual ledger — a different conserved quantity from the money
          ledger). CONFIRMED adds the net subtotal; a free CANCELLED (before cutoff)
          removes exactly the same amount, returning the accrual to its prior value
          with cancel_fee_cents == 0.
        test_recipe:
          setup:
            - "Venue, GOLD suite, S1 PUBLISHED, E1 REGULAR, account ACTIVE with ACTIVE agreement (fb min 4000000), clock 2026-08-20 (before cutoff)"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: StadiumAdmin }
            - { call: "POST /api/venues", payload: { name: "Metro Stadium", address: "1 Arena Way", default_catering_cutoff_hours: 72 }, as: StadiumAdmin, captures: { v: $.data.id } }
            - { call: "POST /api/suites", payload: { venue_id: "${v}", suite_code: "G-101", tier: GOLD, capacity_seats: 20, base_annual_fee_cents: 12000000, f_b_minimum_cents: 4000000 }, as: StadiumAdmin, captures: { su: $.data.id } }
            - { call: "POST /api/seasons", payload: { venue_id: "${v}", label: "2026-27", starts_on: "2026-09-01T00:00:00Z", ends_on: "2027-02-15T00:00:00Z", renewal_window_opens_on: "2026-12-01T00:00:00Z", renewal_window_closes_on: "2027-01-15T00:00:00Z" }, as: StadiumAdmin, captures: { s1: $.data.id } }
            - { call: "POST /api/seasons/${s1}/publish", payload: {}, as: StadiumAdmin }
            - { call: "POST /api/events", payload: { season_id: "${s1}", name: "Opener", event_type: REGULAR, starts_at: "2026-09-10T17:00:00Z", duration_hours: 4, rental_base_price_cents: 500000 }, as: StadiumAdmin, captures: { e1: $.data.id } }
            - { call: "POST /api/accounts", payload: { legal_name: "Acme Corp", account_type: CORPORATE, tax_id: "T-100", billing_email: "ap@acme.example" }, as: PremiumSalesRep, captures: { ac: $.data.id } }
            - { call: "POST /api/accounts/${ac}/set_status", payload: { target_status: "ACTIVE" }, as: FinanceController }
            - { call: "POST /api/agreements", payload: { suite_id: "${su}", account_id: "${ac}", start_season_id: "${s1}", term_seasons: 1, base_annual_fee_cents: 12000000, escalator_bp: 300, f_b_minimum_cents: 4000000 }, as: PremiumSalesRep, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/submit", payload: {}, as: PremiumSalesRep }
            - { call: "POST /api/agreements/${ag}/execute", payload: {}, as: AccountHolder, as_user_id: "${ac}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: StadiumAdmin }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { a0: $.data.f_b_accrued_cents_current_season } }
          trigger:
            - { call: "POST /api/catering-orders", payload: { event_id: "${e1}", suite_id: "${su}", agreement_id: "${ag}", package_tier: PREMIUM, guest_count: 12, lines: [ { item_code: "APP", description: "Sliders", quantity: 2, unit_price_cents: 1250, discount_pct: 0.10 }, { item_code: "PLT", description: "Carving station", quantity: 1, unit_price_cents: 4750 }, { item_code: "DES", description: "Dessert bites", quantity: 5, unit_price_cents: 640, discount_pct: 0.25 } ] }, as: AccountHolder, as_user_id: "${ac}", captures: { co: $.data.id } }
            - { call: "POST /api/catering-orders/${co}/set_status", payload: { target_status: "CONFIRMED" }, as: EventServicesManager }
            - { call: "GET /api/agreements/${ag}", payload: {}, as: PremiumSalesRep, captures: { a1: $.data.f_b_accrued_cents_current_season } }
