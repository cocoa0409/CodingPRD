# =============================================================================
# Birthday Party & Kids' Venue Booking — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty band: EXPERT.
# =============================================================================

scenario: |
  249. Birthday Party & Kids' Venue Booking: package/theme selection, time-slot &
  room capacity, add-ons (cake/characters/extra time), deposit & balance, guest
  count & waivers, reschedule/weather policy, host/staff assignment, overlap buffer

domain_name: kids-venue-booking
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity Profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency          # OCC on Booking.version for reschedule-vs-extend race
    - cascading_side_effects          # cancel/weather-trigger cascades across 3+ entities
    - dual_variant_calculation        # estimate (quote) vs final (settlement) balance
    - derived_field_reconciliation    # Booking.balance_due_cents / headcount_committed kept consistent
    - scheduled_actions               # weather-hold window + reschedule deadline keyed to event clock

  entity_topology: hybrid
  # Booking is the central resource (hierarchy: Booking -> AddOn / GuestParty / Waiver /
  # StaffAssignment / Payment). Venue/Room/PartyPackage are flat configuration peers
  # referenced by FK from Booking. So: tree under Booking + cross-cutting config refs.

  state_machine_shape: branching
  # Booking: QUOTE_DRAFT -> HELD -> {CONFIRMED | reverts} -> COMPLETED, plus a
  # weather/reschedule branch (CONFIRMED -> WEATHER_HOLD -> RESCHEDULED -> CONFIRMED)
  # forming a cycle, with divergent side-effect sets per branch. Payment runs a
  # parallel dimension (UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL -> REFUNDED) on Booking.

  relationship_patterns:
    - one_to_many        # Booking has many AddOns, Waivers, StaffAssignments, Payments
    - cross_aggregate    # Booking references Room, PartyPackage, Venue across aggregate lines
    - many_to_many       # StaffAssignment junctions Booking <-> StaffMember

  role_model: peer_roles
  # VenueManager (config + lifecycle), Coordinator (booking ops + staffing),
  # Guardian (entity_backed customer acting on own booking), FinanceClerk (payments/refunds).

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # --- Configuration peers (flat) ---
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: timezone, type: string, source: input, default: "UTC", description: "IANA tz used to interpret event-local times; default UTC" }
      - { name: weather_dependent, type: boolean, source: input, default: false, description: "If true, bookings in OUTDOOR rooms here are eligible for weather-hold" }
      - { name: reschedule_lead_hours, type: integer, source: input, default: 48, description: "Guardian self-reschedule allowed only if event_start - now >= this many hours; default 48" }
      - { name: status, type: enum, source: system, description: "ACTIVE (the only state; venues are not suspendable in this version). Starts ACTIVE", constraints: "enum: ACTIVE" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue owning this room" }
      - { name: name, type: string, source: input, description: "Room display name" }
      - { name: room_kind, type: enum, source: input, default: "INDOOR", description: "INDOOR | OUTDOOR. OUTDOOR rooms are weather-eligible. Default INDOOR", constraints: "enum: INDOOR, OUTDOOR" }
      - { name: max_capacity, type: integer, source: input, description: "Hard cap on committed headcount (children + adults). Must be >= 1" }
      - { name: buffer_minutes, type: integer, source: input, default: 30, description: "Cleanup/turnover buffer applied AFTER each booking's event window on this room; default 30" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED. CLOSED rooms reject new holds. Starts OPEN", constraints: "enum: OPEN, CLOSED" }

  - name: PartyPackage
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue offering this package" }
      - { name: theme, type: string, source: input, description: "Theme label (e.g., Dinosaur, Princess)" }
      - { name: base_price_cents, type: integer, source: input, description: "Flat base price in cents for the package. Must be >= 0" }
      - { name: included_children, type: integer, source: input, description: "Headcount of children included in base_price_cents. Must be >= 1" }
      - { name: per_extra_child_cents, type: integer, source: input, description: "Marginal cents per child beyond included_children. Must be >= 0" }
      - { name: base_duration_minutes, type: integer, source: input, default: 120, description: "Event-window length in minutes the base price buys; default 120" }
      - { name: deposit_pct, type: number, source: input, default: 0.25, description: "Fraction of quote_total required as deposit to move HELD->CONFIRMED; default 0.25", constraints: "0 < deposit_pct <= 1" }
      - { name: status, type: enum, source: system, description: "LISTED | RETIRED. RETIRED packages reject new quotes. Starts LISTED", constraints: "enum: LISTED, RETIRED" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the venue this staff belongs to" }
      - { name: full_name, type: string, source: input, description: "Staff member name" }
      - { name: skills, type: array, source: input, default: [], description: "Array of capability tags from {HOST, ENTERTAINER, COOK}; empty default" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | INACTIVE. INACTIVE staff cannot be assigned. Starts AVAILABLE", constraints: "enum: AVAILABLE, INACTIVE" }

  # --- Central resource (Booking) and its children (tree) ---
  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; resolved from the chosen Room/Package and must agree across both" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the room reserved for the event window + buffer" }
      - { name: package_id, type: string, source: input, description: "FK -> PartyPackage.id; the package priced into the quote" }
      - { name: guardian_user_id, type: string, source: input, description: "FK -> Guardian acting identity (opaque-to-entity is NOT used; this equals the X-User-ID of the Guardian who created the booking)" }
      - { name: event_start_utc, type: datetime, source: input, description: "ISO 8601 UTC start of the event window" }
      - { name: event_end_utc, type: datetime, source: computed, description: "event_start_utc + effective_duration_minutes; recomputed when extra-time add-ons change" }
      - { name: effective_duration_minutes, type: integer, source: computed, description: "package.base_duration_minutes + sum of extra_minutes from active EXTRA_TIME add-ons" }
      - { name: children_count, type: integer, source: input, description: "Number of children attending; drives package overage pricing and capacity. Must be >= 1" }
      - { name: adults_count, type: integer, source: input, default: 0, description: "Number of adults attending; counts toward room capacity only; default 0" }
      - { name: headcount_committed, type: integer, source: computed, description: "children_count + adults_count; reconciled on every headcount mutation" }
      - { name: waivers_required, type: integer, source: computed, description: "Equals children_count: one signed waiver per child required before CONFIRMED" }
      - { name: waivers_signed, type: integer, source: computed, description: "Count of Waiver children with status SIGNED on this booking" }
      - { name: quote_total_cents, type: integer, source: computed, description: "Estimate variant: package + add-ons priced forward at QUOTE/HELD time. See calc booking_quote_total" }
      - { name: final_total_cents, type: integer, source: computed, description: "Settlement variant: re-priced at COMPLETED from realized add-on/headcount state. See calc booking_final_total" }
      - { name: deposit_due_cents, type: integer, source: computed, description: "ceil(quote_total_cents * package.deposit_pct) at HELD time; pinned on HELD->CONFIRMED" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for SETTLED CHARGE minus SETTLED REFUND on this booking" }
      - { name: balance_due_cents, type: integer, source: computed, description: "Derived: (final_total_cents if COMPLETED else quote_total_cents) - amount_paid_cents; reconciled on payment/add-on/headcount change" }
      - { name: payment_status, type: enum, source: computed, description: "Parallel dimension: UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED", constraints: "enum: UNPAID, DEPOSIT_PAID, PAID_IN_FULL, REFUNDED" }
      - { name: weather_eligible, type: boolean, source: computed, description: "True iff room.room_kind == OUTDOOR AND venue.weather_dependent == true" }
      - { name: reschedule_count, type: integer, source: computed, description: "Number of times this booking has completed a WEATHER_HOLD/RESCHEDULE cycle; starts 0" }
      - { name: status, type: enum, source: system, description: "QUOTE_DRAFT | HELD | CONFIRMED | WEATHER_HOLD | RESCHEDULED | COMPLETED | CANCELLED", constraints: "enum: QUOTE_DRAFT, HELD, CONFIRMED, WEATHER_HOLD, RESCHEDULED, COMPLETED, CANCELLED" }

  - name: AddOn
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this add-on belongs to" }
      - { name: kind, type: enum, source: input, description: "CAKE | CHARACTER | EXTRA_TIME", constraints: "enum: CAKE, CHARACTER, EXTRA_TIME" }
      - { name: unit_price_cents, type: integer, source: input, description: "Price in cents per unit of this add-on. Must be >= 0" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units of this add-on; default 1. Must be >= 1" }
      - { name: extra_minutes, type: integer, source: input, default: 0, description: "Only meaningful for EXTRA_TIME: minutes added to the event window per unit; default 0" }
      - { name: requires_skill, type: enum, source: computed, description: "CHARACTER->ENTERTAINER, CAKE->COOK, EXTRA_TIME->null. Staffing precondition derives from this", constraints: "enum: ENTERTAINER, COOK, NONE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED. REMOVED add-ons drop out of pricing/duration. Starts ACTIVE", constraints: "enum: ACTIVE, REMOVED" }

  - name: GuestParty
    parent: Booking
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this guest-count delta belongs to" }
      - { name: children_delta, type: integer, source: input, default: 0, description: "Signed change to children_count this roster event records; default 0" }
      - { name: adults_delta, type: integer, source: input, default: 0, description: "Signed change to adults_count this roster event records; default 0" }
      - { name: reason, type: string, source: input, default: "ADJUSTMENT", description: "Free-text reason for the headcount change; default ADJUSTMENT" }

  - name: Waiver
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this waiver covers" }
      - { name: child_name, type: string, source: input, description: "Name of the child the waiver is for" }
      - { name: guardian_signature, type: string, source: input, description: "Signature string captured at signing; required to move DRAFT->SIGNED" }
      - { name: status, type: enum, source: system, description: "DRAFT | SIGNED | VOIDED. Starts DRAFT", constraints: "enum: DRAFT, SIGNED, VOIDED" }

  - name: StaffAssignment
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking being staffed" }
      - { name: staff_member_id, type: string, source: input, description: "FK -> StaffMember.id; the assigned staff member" }
      - { name: role_on_event, type: enum, source: input, description: "HOST | ENTERTAINER | COOK. Must be present in StaffMember.skills", constraints: "enum: HOST, ENTERTAINER, COOK" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED. RELEASED frees the staff window. Starts ASSIGNED", constraints: "enum: ASSIGNED, RELEASED" }

  - name: Payment
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, no prefix; identity only" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking this payment applies to" }
      - { name: direction, type: enum, source: input, description: "CHARGE (guardian pays in) | REFUND (venue pays out)", constraints: "enum: CHARGE, REFUND" }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude in cents. Must be >= 1" }
      - { name: purpose, type: enum, source: input, default: "BALANCE", description: "DEPOSIT | BALANCE | CANCELLATION_REFUND; default BALANCE", constraints: "enum: DEPOSIT, BALANCE, CANCELLATION_REFUND" }
      - { name: status, type: enum, source: system, description: "SETTLED | VOIDED. Only SETTLED counts toward amount_paid_cents. Starts SETTLED", constraints: "enum: SETTLED, VOIDED" }

  # --- Test-driving config (clock) ---
  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Singleton id; identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: current_utc, type: datetime, source: system, description: "The server's notion of 'now' for reschedule-lead and event-window checks" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Booking lifecycle (branching + cyclic weather branch) ----
  - entity: Booking
    field: status
    initial_state: QUOTE_DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUOTE_DRAFT
        to: HELD
        trigger: "POST /bookings/{id}/hold"
        actor: Coordinator
        preconditions:
          - "Room.status == OPEN (ERR_ROOM_CLOSED)"
          - "PartyPackage.status == LISTED (ERR_PACKAGE_RETIRED)"
          - "children_count + adults_count <= Room.max_capacity (ERR_ROOM_CAPACITY_EXCEEDED)"
          - "Requested window [event_start_utc, event_end_utc + Room.buffer_minutes) does not overlap any HELD/CONFIRMED/WEATHER_HOLD/RESCHEDULED booking's [start, end + buffer) on the same Room (ERR_ROOM_WINDOW_CONFLICT)"
        side_effects:
          - "Recompute quote_total_cents (calc booking_quote_total) and deposit_due_cents = ceil(quote_total_cents * package.deposit_pct)"
          - "Recompute balance_due_cents = quote_total_cents - amount_paid_cents"
          - "Reserve the Room window so subsequent overlap checks see it"
          - "increments Booking.version by 1"

      - from: HELD
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Coordinator
        preconditions:
          - "waivers_signed >= waivers_required (ERR_WAIVERS_INCOMPLETE)"
          - "amount_paid_cents >= deposit_due_cents (ERR_DEPOSIT_NOT_MET)"
          - "Exactly one ASSIGNED StaffAssignment with role_on_event == HOST exists (ERR_HOST_NOT_ASSIGNED)"
          - "For every ACTIVE AddOn whose requires_skill != NONE, an ASSIGNED StaffAssignment with matching role_on_event exists (ERR_ADDON_STAFF_MISSING)"
        side_effects:
          - "Pin deposit_due_cents (no longer recomputed)"
          - "payment_status recompute (calc payment_status_derive)"
          - "increments Booking.version by 1"

      - from: HELD
        to: QUOTE_DRAFT
        trigger: "POST /bookings/{id}/release-hold"
        actor: Coordinator
        preconditions:
          - "payment_status == UNPAID (ERR_HOLD_HAS_PAYMENTS)"
        side_effects:
          - "Release the reserved Room window (overlap checks no longer see it)"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: WEATHER_HOLD
        trigger: "POST /bookings/{id}/weather-hold"
        actor: Coordinator
        preconditions:
          - "weather_eligible == true (ERR_NOT_WEATHER_ELIGIBLE)"
          - "clock.current_utc < event_start_utc (ERR_EVENT_ALREADY_STARTED)"
        side_effects:
          - "Room window remains reserved (event not yet released) so the slot is protected during the hold"
          - "increments Booking.version by 1"

      - from: WEATHER_HOLD
        to: RESCHEDULED
        trigger: "PATCH /bookings/{id}/reschedule"
        actor: Coordinator
        preconditions:
          - "new event_start_utc supplied"
          - "New window [new_start, new_start + effective_duration_minutes + Room.buffer_minutes) does not overlap any other HELD/CONFIRMED/WEATHER_HOLD/RESCHEDULED booking on the Room (ERR_ROOM_WINDOW_CONFLICT)"
          - "expected_booking_version matches Booking.version (ERR_STALE_VERSION)"
        side_effects:
          - "Release the OLD reserved Room window and reserve the NEW window"
          - "event_start_utc := new_start; recompute event_end_utc"
          - "reschedule_count += 1"
          - "increments Booking.version by 1"

      - from: RESCHEDULED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/confirm"
        actor: Coordinator
        preconditions:
          - "waivers_signed >= waivers_required (ERR_WAIVERS_INCOMPLETE)"
          - "amount_paid_cents >= deposit_due_cents (ERR_DEPOSIT_NOT_MET)"
          - "Exactly one ASSIGNED StaffAssignment with role_on_event == HOST exists (ERR_HOST_NOT_ASSIGNED)"
        side_effects:
          - "payment_status recompute (calc payment_status_derive)"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /bookings/{id}/complete"
        actor: Coordinator
        preconditions:
          - "clock.current_utc >= event_end_utc (ERR_EVENT_NOT_ENDED)"
          - "balance_due_cents (recomputed against final_total_cents) <= 0 (ERR_BALANCE_OUTSTANDING)"
        side_effects:
          - "Recompute final_total_cents (calc booking_final_total) — settlement variant"
          - "Recompute balance_due_cents = final_total_cents - amount_paid_cents"
          - "payment_status recompute (calc payment_status_derive)"
          - "Release the Room window; RELEASE all ASSIGNED StaffAssignments (-> RELEASED)"
          - "increments Booking.version by 1"

      - from: [QUOTE_DRAFT, HELD, CONFIRMED, WEATHER_HOLD, RESCHEDULED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "clock.current_utc < event_start_utc OR status IN {QUOTE_DRAFT, HELD} (ERR_EVENT_ALREADY_STARTED)"
        side_effects:
          - "Release the reserved Room window if any"
          - "Cascade: all ACTIVE AddOns -> REMOVED; all ASSIGNED StaffAssignments -> RELEASED; all DRAFT/SIGNED Waivers -> VOIDED"
          - "If amount_paid_cents > 0: synthesize one Payment {direction: REFUND, purpose: CANCELLATION_REFUND, amount_cents = refund per calc cancellation_refund, status: SETTLED}; that refund recomputes amount_paid_cents -> balance_due_cents -> payment_status (-> REFUNDED when net paid returns to 0)"
          - "increments Booking.version by 1"

  # ---- Waiver lifecycle (branching: sign or void) ----
  - entity: Waiver
    field: status
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /bookings/{bookingId}/waivers/{waiverId}/sign"
        actor: Guardian
        preconditions:
          - "Parent Booking.status IN {HELD, CONFIRMED, WEATHER_HOLD, RESCHEDULED} (ERR_BOOKING_NOT_SIGNABLE)"
          - "guardian_signature non-empty (ERR_INVALID_REQUEST)"
        side_effects:
          - "Parent Booking.waivers_signed recomputed (+1)"
      - from: SIGNED
        to: DRAFT
        trigger: "POST /bookings/{bookingId}/waivers/{waiverId}/revoke"
        actor: Guardian
        preconditions:
          - "Parent Booking.status != CONFIRMED (ERR_WAIVER_LOCKED) — a CONFIRMED booking's signed waivers are locked"
        side_effects:
          - "Parent Booking.waivers_signed recomputed (-1)"
      - from: [DRAFT, SIGNED]
        to: VOIDED
        trigger: "system (parent Booking cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent Booking.waivers_signed recomputed"

  # ---- StaffAssignment lifecycle (linear with cross-entity guard) ----
  - entity: StaffAssignment
    field: status
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /bookings/{bookingId}/staff-assignments/{assignmentId}/release"
        actor: Coordinator
        preconditions:
          - "Parent Booking.status != CONFIRMED OR this is not the sole HOST (a CONFIRMED booking must keep exactly one HOST) (ERR_HOST_REQUIRED)"
        side_effects:
          - "Frees this StaffMember's window for the booking's [start, end+buffer)"
      - from: ASSIGNED
        to: RELEASED
        trigger: "system (parent Booking completed or cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- AddOn lifecycle (linear, drives duration/price reconciliation) ----
  - entity: AddOn
    field: status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /bookings/{bookingId}/add-ons/{addOnId}"
        actor: Coordinator
        preconditions:
          - "Parent Booking.status IN {QUOTE_DRAFT, HELD} (ERR_ADDON_LOCKED) — add-ons are immutable once CONFIRMED"
        side_effects:
          - "If kind == EXTRA_TIME: recompute Booking.effective_duration_minutes and event_end_utc, then RE-CHECK Room window overlap; if the shrunken window still fits it is accepted"
          - "Recompute Booking.quote_total_cents -> deposit_due_cents -> balance_due_cents"
      - from: ACTIVE
        to: REMOVED
        trigger: "system (parent Booking cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  # ---- Payment lifecycle (linear, append-only ledger; void only when UNSETTLED contra absent) ----
  - entity: Payment
    field: status
    initial_state: SETTLED
    terminal_states: [VOIDED]
    transitions:
      - from: SETTLED
        to: VOIDED
        trigger: "POST /bookings/{bookingId}/payments/{paymentId}/void"
        actor: FinanceClerk
        preconditions:
          - "Parent Booking.status != COMPLETED (ERR_BOOKING_SETTLED)"
          - "Payment.direction == CHARGE (only inbound charges may be voided; refunds are immutable) (ERR_REFUND_IMMUTABLE)"
        side_effects:
          - "Recompute Booking.amount_paid_cents -> balance_due_cents -> payment_status"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: reschedule-stale-booking
    parent_entity: Booking
    write_endpoint: "PATCH /bookings/{id}/reschedule"
    occ_field: "expected_booking_version"
    description: |
      Rescheduling a WEATHER_HOLD booking to a new window against a Booking whose
      version has advanced since the client last observed it is rejected. A second
      writer may have already moved the event (legitimately superseding the prior
      window and bumping version); the current writer's view of the booking is then
      stale and the reschedule must fail rather than silently overwrite the slot.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Dual-variant pair #1: quote (estimate) vs final (settlement) on Booking ---
  - name: booking_quote_total
    trigger: "Booking QUOTE_DRAFT->HELD; any AddOn add/remove or headcount change while status IN {QUOTE_DRAFT, HELD}"
    algorithm: forward_looking
    formula: |
      # ESTIMATE variant: prices the booking forward from currently-active line items.
      overage_children = max(0, children_count - package.included_children)
      package_charge   = package.base_price_cents + overage_children * package.per_extra_child_cents
      # Per-line-item rounding is N/A (all integer cents); add-ons summed over ACTIVE only.
      addons_charge    = sum(a.unit_price_cents * a.quantity for a in AddOns if a.status == ACTIVE)
      quote_total_cents = package_charge + addons_charge
    input_set: "Package fields + ACTIVE AddOns + current children_count (estimate uses CURRENT, possibly-future-adjusted headcount)"
    constants: {}
    precision: "integer cents, no rounding (all inputs integer)"
    variants:
      - name: estimate
        when: "status IN {QUOTE_DRAFT, HELD, CONFIRMED, WEATHER_HOLD, RESCHEDULED}"
        difference: "Uses currently-ACTIVE add-ons and the live children_count; recomputed on every line-item or headcount mutation"

  - name: booking_final_total
    trigger: "Booking CONFIRMED/RESCHEDULED -> COMPLETED"
    algorithm: chronological
    formula: |
      # SETTLEMENT variant: replays the GuestParty roster events in created_at ASC order
      # to derive the REALIZED peak children_count, then prices overage on that peak.
      # This diverges from the estimate when headcount was raised then lowered: the
      # estimate sees only the net-current count, the settlement charges the peak.
      # creation count is reconstructed (the field is mutated by roster events):
      children_at_creation = children_count - sum(ev.children_delta for all GuestParty events)
      running = children_at_creation
      peak_children = running
      for ev in GuestParty events on this booking, ordered by created_at ASC (created_at is unique per event):
        running += ev.children_delta
        peak_children = max(peak_children, running)
      overage_children = max(0, peak_children - package.included_children)
      package_charge   = package.base_price_cents + overage_children * package.per_extra_child_cents
      addons_charge    = sum(a.unit_price_cents * a.quantity for a in AddOns if a.status == ACTIVE)
      final_total_cents = package_charge + addons_charge
    input_set: "GuestParty roster events (chronological), ACTIVE AddOns, package fields"
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: settlement
        when: "status == COMPLETED"
        difference: "Charges overage on the PEAK realized children count from the roster replay, not the net-current count the estimate uses"

  # --- Dual-variant pair #2: cancellation refund — tiered (forfeit deposit) vs full ---
  - name: cancellation_refund
    trigger: "Booking *->CANCELLED when amount_paid_cents > 0"
    algorithm: threshold
    formula: |
      hours_to_event = (event_start_utc - clock.current_utc) / 3600   # may be negative
      if status IN {QUOTE_DRAFT, HELD}:
        # Pre-confirmation: deposit not yet binding, full refund of whatever was paid.
        refund_cents = amount_paid_cents
      elif hours_to_event >= FREE_CANCEL_HOURS:
        # Outside the forfeiture window: full refund.
        refund_cents = amount_paid_cents
      elif hours_to_event >= 0:
        # Inside the window but before the event: forfeit the deposit, refund the rest.
        refund_cents = max(0, amount_paid_cents - deposit_due_cents)
      else:
        # Event already started/passed: no refund.
        refund_cents = 0
    input_set: "amount_paid_cents (SETTLED CHARGE - SETTLED REFUND), deposit_due_cents, event_start_utc vs clock"
    constants:
      FREE_CANCEL_HOURS: 72
    precision: "integer cents"
    variants:
      - name: full_refund
        when: "pre-confirmation OR hours_to_event >= 72"
        difference: "Returns the entire paid amount"
      - name: deposit_forfeit
        when: "0 <= hours_to_event < 72 and status was CONFIRMED/WEATHER_HOLD/RESCHEDULED"
        difference: "Withholds deposit_due_cents from the refund"

  # --- Combinatorial mode (c): circular-looking dependency, evaluation order pinned ---
  - name: deposit_due_amount
    trigger: "Booking QUOTE_DRAFT->HELD; recomputed on quote_total change while HELD"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED to break the apparent cycle between balance and deposit:
      #   (1) quote_total_cents  := booking_quote_total          # depends on line items only
      #   (2) deposit_due_cents  := ceil(quote_total_cents * package.deposit_pct)
      #   (3) balance_due_cents  := quote_total_cents - amount_paid_cents
      # deposit_due gates CONFIRM via amount_paid >= deposit_due; balance_due is independent
      # of deposit_due (NOT quote - deposit), so there is no real cycle once order is fixed.
      deposit_due_cents = ceil(quote_total_cents * package.deposit_pct)
    input_set: "quote_total_cents, package.deposit_pct"
    constants: {}
    precision: "ceil to whole cents (round half is N/A; ceiling is explicit)"

  # --- Combinatorial mode (a): >=3 inputs, non-linear (room window geometry) ---
  - name: room_window_occupancy
    trigger: "Booking hold/reschedule overlap precondition; AddOn EXTRA_TIME change re-check"
    algorithm: interval_merge
    formula: |
      # Each booking occupies a HALF-OPEN interval on its Room:
      #   occ = [event_start_utc, event_end_utc + Room.buffer_minutes * 60)
      # where event_end_utc = event_start_utc + effective_duration_minutes * 60.
      # effective_duration_minutes = package.base_duration_minutes
      #                              + sum(a.extra_minutes * a.quantity for ACTIVE EXTRA_TIME add-ons)
      # Two occupancies CONFLICT iff their half-open intervals intersect:
      #   conflict := (a.start < b.end_with_buffer) AND (b.start < a.end_with_buffer)
      # Adjacency (a.end_with_buffer == b.start) is NOT a conflict (half-open).
      # Candidate set = other bookings on SAME room with status IN
      #   {HELD, CONFIRMED, WEATHER_HOLD, RESCHEDULED}; QUOTE_DRAFT/COMPLETED/CANCELLED excluded.
    input_set: "All same-room bookings in {HELD,CONFIRMED,WEATHER_HOLD,RESCHEDULED}, the candidate window, Room.buffer_minutes"
    constants: {}
    precision: "second-resolution UTC; half-open intervals"

  # --- Combinatorial mode (b): nested rounding order pinned — proration on early completion N/A,
  #     but staff-capacity utilization aggregates with explicit sum-then-round ---
  - name: staff_window_occupancy
    trigger: "StaffAssignment create overlap check"
    algorithm: interval_merge
    formula: |
      # A StaffMember cannot be ASSIGNED to two bookings whose CLOSED intervals touch.
      # Unlike rooms (half-open), staff windows use CLOSED intervals INCLUSIVE of buffer,
      # so back-to-back events (a.end+buffer == b.start) DO conflict for staff (no teleport):
      #   staff_occ = [event_start_utc, event_end_utc + Room.buffer_minutes*60]   # closed
      #   conflict  := (a.start <= b.end_incl_buffer) AND (b.start <= a.end_incl_buffer)
      # Candidate set = other ASSIGNED StaffAssignments for THIS staff_member across any room,
      # whose parent Booking.status IN {HELD,CONFIRMED,WEATHER_HOLD,RESCHEDULED}.
    input_set: "All ASSIGNED StaffAssignments for the staff member, the candidate booking window, buffer"
    constants: {}
    precision: "second-resolution UTC; CLOSED intervals (adjacency conflicts)"

  - name: payment_status_derive
    trigger: "Any Payment settle/void; Booking confirm/complete/cancel"
    algorithm: threshold
    formula: |
      target = (final_total_cents if status == COMPLETED else quote_total_cents)
      if amount_paid_cents <= 0 and exists SETTLED REFUND with purpose CANCELLATION_REFUND:
        payment_status = REFUNDED
      elif amount_paid_cents <= 0:
        payment_status = UNPAID
      elif amount_paid_cents >= target:
        payment_status = PAID_IN_FULL
      elif amount_paid_cents >= deposit_due_cents:
        payment_status = DEPOSIT_PAID
      else:
        payment_status = UNPAID    # partial below deposit still reads UNPAID for gating
    input_set: "amount_paid_cents, deposit_due_cents, quote/final target, existence of cancellation refund"
    constants: {}
    precision: "integer cents; boundary at exactly == is PAID/DEPOSIT (>=)"

  - name: amount_paid_reconcile
    trigger: "Payment create/void; Booking cancel refund synthesis"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(p.amount_cents for p in Payments if p.status==SETTLED and p.direction==CHARGE)
                        - sum(p.amount_cents for p in Payments if p.status==SETTLED and p.direction==REFUND)
      balance_due_cents = (final_total_cents if status==COMPLETED else quote_total_cents) - amount_paid_cents
    input_set: "All SETTLED Payments on the booking"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (bookingId, then waiverId/addOnId/assignmentId/paymentId)"
    error_id: "ERR_BOOKING_NOT_FOUND / ERR_WAIVER_NOT_FOUND / ERR_ADDON_NOT_FOUND / ERR_ASSIGNMENT_NOT_FOUND / ERR_PAYMENT_NOT_FOUND / ERR_VENUE_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_STAFF_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 4
    category: business_referential
    check: "Body FKs resolve: room_id, package_id, staff_member_id exist; on Booking create room.venue_id == package.venue_id (ERR_VENUE_MISMATCH)"
    error_id: "ERR_ROOM_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_STAFF_NOT_FOUND / ERR_VENUE_MISMATCH"
    http_status: 404
    applies_to: "POST /bookings, POST /bookings/{id}/staff-assignments"

  - priority: 5
    category: business_constraint
    check: "Field-level shape: children_count >= 1, adults_count >= 0, amount_cents >= 1, quantity >= 1, max_capacity >= 1, deposit_pct in (0,1], enum members valid, datetimes ISO 8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 6
    category: state
    check: "Target entity is in a state that admits this transition (Booking/Waiver/AddOn/StaffAssignment/Payment)"
    error_id: "ERR_INVALID_STATE / ERR_BOOKING_NOT_SIGNABLE / ERR_ADDON_LOCKED / ERR_WAIVER_LOCKED / ERR_BOOKING_SETTLED / ERR_REFUND_IMMUTABLE / ERR_HOLD_HAS_PAYMENTS"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_referential
    check: "Cross-entity config preconditions: Room.status==OPEN, PartyPackage.status==LISTED, StaffMember.status==AVAILABLE & role_on_event in StaffMember.skills"
    error_id: "ERR_ROOM_CLOSED / ERR_PACKAGE_RETIRED / ERR_STAFF_INACTIVE / ERR_SKILL_MISMATCH"
    http_status: 409
    applies_to: "POST /bookings/{id}/hold, POST /bookings/{id}/staff-assignments"

  - priority: 8
    category: business_safety
    check: "Waiver completeness for CONFIRM: waivers_signed >= waivers_required"
    error_id: ERR_WAIVERS_INCOMPLETE
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 9
    category: business_safety
    check: "Staffing completeness for CONFIRM: exactly one ASSIGNED HOST; ENTERTAINER present if any ACTIVE CHARACTER add-on; COOK present if any ACTIVE CAKE add-on"
    error_id: "ERR_HOST_NOT_ASSIGNED / ERR_ADDON_STAFF_MISSING"
    http_status: 409
    applies_to: "POST /bookings/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "Room window overlap with buffer (half-open) on hold/reschedule; staff window overlap (closed) on staff assignment"
    error_id: "ERR_ROOM_WINDOW_CONFLICT / ERR_STAFF_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /bookings/{id}/hold, PATCH /bookings/{id}/reschedule, POST /bookings/{id}/staff-assignments"

  - priority: 11
    category: business_constraint
    check: "Room capacity: children_count + adults_count <= Room.max_capacity"
    error_id: ERR_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bookings/{id}/hold, POST /bookings/{id}/guest-parties, PATCH /bookings/{id} (headcount)"

  - priority: 12
    category: business_temporal
    check: "Reschedule timing: Guardian self-reschedule requires event_start - now >= venue.reschedule_lead_hours; weather-hold requires event not started"
    error_id: "ERR_RESCHEDULE_TOO_LATE / ERR_EVENT_ALREADY_STARTED / ERR_NOT_WEATHER_ELIGIBLE / ERR_EVENT_NOT_ENDED"
    http_status: 409
    applies_to: "PATCH /bookings/{id}/reschedule, POST /bookings/{id}/weather-hold, POST /bookings/{id}/complete"

  - priority: 13
    category: business_fiscal
    check: "Deposit gate for CONFIRM (amount_paid >= deposit_due); balance gate for COMPLETE (balance_due <= 0); refund cannot exceed amount_paid"
    error_id: "ERR_DEPOSIT_NOT_MET / ERR_BALANCE_OUTSTANDING / ERR_REFUND_EXCEEDS_PAID"
    http_status: 402
    applies_to: "POST /bookings/{id}/confirm, POST /bookings/{id}/complete, POST /bookings/{id}/payments"

  - priority: 14
    category: state
    check: "OCC: expected_booking_version matches Booking.version on reschedule"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /bookings/{id}/reschedule"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Config: Venue ----------
  - method: POST
    path: "/venues"
    description: "Create a venue"
    roles: [VenueManager]
    code: 201
    input: [name, "timezone?", "weather_dependent?", "reschedule_lead_hours?"]
    output: Venue
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/venues"
    description: "List venues (paginated)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  - method: GET
    path: "/venues/{id}"
    description: "Get a venue"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # ---------- Config: Room (filtered by venue_id for FK reverse-reachability) ----------
  - method: POST
    path: "/rooms"
    description: "Create a room under a venue"
    roles: [VenueManager]
    code: 201
    input: [venue_id, name, "room_kind?", max_capacity, "buffer_minutes?"]
    output: Room
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/rooms"
    description: "List rooms, optionally filtered by venue_id"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: GET
    path: "/rooms/{id}"
    description: "Get a room"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: POST
    path: "/rooms/{id}/close"
    description: "Close a room (rejects new holds)"
    roles: [VenueManager]
    code: 200
    input: []
    output: Room
    side_effects: ["status=CLOSED"]

  # ---------- Config: PartyPackage (filtered by venue_id) ----------
  - method: POST
    path: "/packages"
    description: "Create a party package under a venue"
    roles: [VenueManager]
    code: 201
    input: [venue_id, theme, base_price_cents, included_children, per_extra_child_cents, "base_duration_minutes?", "deposit_pct?"]
    output: PartyPackage
    side_effects: ["status=LISTED"]

  - method: GET
    path: "/packages"
    description: "List packages, optionally filtered by venue_id"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: PartyPackage[]
    side_effects: []

  - method: GET
    path: "/packages/{id}"
    description: "Get a package"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: []
    output: PartyPackage
    side_effects: []

  - method: POST
    path: "/packages/{id}/retire"
    description: "Retire a package (rejects new quotes)"
    roles: [VenueManager]
    code: 200
    input: []
    output: PartyPackage
    side_effects: ["status=RETIRED"]

  # ---------- Config: StaffMember (filtered by venue_id) ----------
  - method: POST
    path: "/staff-members"
    description: "Create a staff member under a venue"
    roles: [VenueManager]
    code: 201
    input: [venue_id, full_name, "skills?"]
    output: StaffMember
    side_effects: ["status=AVAILABLE"]

  - method: GET
    path: "/staff-members"
    description: "List staff members, optionally filtered by venue_id"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  - method: GET
    path: "/staff-members/{id}"
    description: "Get a staff member"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: []
    output: StaffMember
    side_effects: []

  - method: POST
    path: "/staff-members/{id}/deactivate"
    description: "Deactivate a staff member"
    roles: [VenueManager]
    code: 200
    input: []
    output: StaffMember
    side_effects: ["status=INACTIVE"]

  # ---------- Booking core ----------
  - method: POST
    path: "/bookings"
    description: "Create a booking in QUOTE_DRAFT (computes quote_total immediately)"
    roles: [Coordinator, Guardian]
    code: 201
    input: [room_id, package_id, event_start_utc, children_count, "adults_count?"]
    output: Booking
    side_effects:
      - "status=QUOTE_DRAFT; venue_id resolved from room/package; effective_duration_minutes=package.base_duration_minutes; event_end_utc computed; quote_total_cents computed; balance_due_cents computed; waivers_required=children_count; payment_status=UNPAID; weather_eligible derived; reschedule_count=0"

  - method: GET
    path: "/bookings"
    description: "List bookings with filters (paginated)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["room_id?", "package_id?", "venue_id?", "guardian_user_id?", "status?", "payment_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking (all derived fields)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: PATCH
    path: "/bookings/{id}"
    description: "Update headcount on a QUOTE_DRAFT/HELD booking (children_count/adults_count); re-prices quote"
    roles: [Coordinator, Guardian]
    code: 200
    input: ["children_count?", "adults_count?"]
    output: Booking
    side_effects: ["Recompute headcount_committed, waivers_required, quote_total_cents, deposit_due_cents, balance_due_cents; capacity re-checked", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/hold"
    description: "Move QUOTE_DRAFT->HELD; reserves the room window"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["Overlap+capacity checks; reserve room window; recompute quote/deposit/balance", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/release-hold"
    description: "Move HELD->QUOTE_DRAFT; releases the room window"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["Release room window", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/confirm"
    description: "Move HELD/RESCHEDULED->CONFIRMED"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["Pin deposit_due_cents; recompute payment_status", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/weather-hold"
    description: "Move CONFIRMED->WEATHER_HOLD (weather-eligible bookings only)"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["Room window remains reserved", "increments Booking.version by 1"]

  - method: PATCH
    path: "/bookings/{id}/reschedule"
    description: "Move WEATHER_HOLD->RESCHEDULED with a new start (OCC-guarded)"
    roles: [Coordinator]
    code: 200
    input: [event_start_utc, expected_booking_version]
    output: Booking
    side_effects: ["Release old window, reserve new window; recompute event_end_utc; reschedule_count+=1", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/complete"
    description: "Move CONFIRMED->COMPLETED; computes final_total settlement"
    roles: [Coordinator]
    code: 200
    input: []
    output: Booking
    side_effects: ["Recompute final_total_cents (settlement); recompute balance_due_cents; release room window; release all ASSIGNED staff; recompute payment_status", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a non-terminal booking; cascades and synthesizes refund"
    roles: [Coordinator, Guardian]
    code: 200
    input: []
    output: Booking
    side_effects: ["Release window; AddOns->REMOVED; staff->RELEASED; waivers->VOIDED; synthesize CANCELLATION_REFUND payment if paid; recompute amount_paid/balance/payment_status", "increments Booking.version by 1"]

  # ---------- Booking children: AddOn ----------
  - method: POST
    path: "/bookings/{id}/add-ons"
    description: "Add an add-on (cake/character/extra-time) to a QUOTE_DRAFT/HELD booking"
    roles: [Coordinator, Guardian]
    code: 201
    input: [kind, unit_price_cents, "quantity?", "extra_minutes?"]
    output: AddOn
    side_effects: ["requires_skill derived; recompute quote/deposit/balance; if EXTRA_TIME recompute effective_duration_minutes + event_end_utc + re-check overlap"]

  - method: GET
    path: "/bookings/{id}/add-ons"
    description: "List add-ons for a booking (reverse-reachability for AddOn.booking_id)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: DELETE
    path: "/bookings/{id}/add-ons/{addOnId}"
    description: "Remove an add-on (QUOTE_DRAFT/HELD only); re-prices and recomputes duration"
    roles: [Coordinator, Guardian]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status=REMOVED; recompute quote/deposit/balance; if EXTRA_TIME recompute duration + window"]

  # ---------- Booking children: GuestParty (roster events) ----------
  - method: POST
    path: "/bookings/{id}/guest-parties"
    description: "Record a headcount-change roster event; applies signed deltas to the booking"
    roles: [Coordinator, Guardian]
    code: 201
    input: ["children_delta?", "adults_delta?", "reason?"]
    output: GuestParty
    side_effects: ["Apply deltas to children_count/adults_count; recompute headcount_committed, waivers_required, quote_total/deposit/balance; capacity re-checked"]

  - method: GET
    path: "/bookings/{id}/guest-parties"
    description: "List roster events for a booking (reverse-reachability for GuestParty.booking_id)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["limit?", "offset?"]
    output: GuestParty[]
    side_effects: []

  # ---------- Booking children: Waiver ----------
  - method: POST
    path: "/bookings/{id}/waivers"
    description: "Create a DRAFT waiver for a child"
    roles: [Coordinator, Guardian]
    code: 201
    input: [child_name, "guardian_signature?"]
    output: Waiver
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/bookings/{id}/waivers"
    description: "List waivers for a booking (reverse-reachability for Waiver.booking_id)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/waivers/{waiverId}/sign"
    description: "Sign a DRAFT waiver"
    roles: [Guardian, Coordinator]
    code: 200
    input: [guardian_signature]
    output: Waiver
    side_effects: ["status=SIGNED; Booking.waivers_signed+1"]

  - method: POST
    path: "/bookings/{id}/waivers/{waiverId}/revoke"
    description: "Revoke a SIGNED waiver (back to DRAFT) when booking not CONFIRMED"
    roles: [Guardian, Coordinator]
    code: 200
    input: []
    output: Waiver
    side_effects: ["status=DRAFT; Booking.waivers_signed-1"]

  # ---------- Booking children: StaffAssignment ----------
  - method: POST
    path: "/bookings/{id}/staff-assignments"
    description: "Assign a staff member to a booking with a role"
    roles: [Coordinator]
    code: 201
    input: [staff_member_id, role_on_event]
    output: StaffAssignment
    side_effects: ["status=ASSIGNED; staff window overlap checked (closed interval)"]

  - method: GET
    path: "/bookings/{id}/staff-assignments"
    description: "List staff assignments for a booking (reverse-reachability for StaffAssignment.booking_id)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/staff-assignments/{assignmentId}/release"
    description: "Release a staff assignment (frees the staff window)"
    roles: [Coordinator]
    code: 200
    input: []
    output: StaffAssignment
    side_effects: ["status=RELEASED"]

  - method: GET
    path: "/staff-members/{id}/staff-assignments"
    description: "List assignments for a staff member (reverse-reachability for StaffAssignment.staff_member_id)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: StaffAssignment[]
    side_effects: []

  # ---------- Booking children: Payment ----------
  - method: POST
    path: "/bookings/{id}/payments"
    description: "Record a payment (CHARGE deposit/balance, or manual REFUND)"
    roles: [FinanceClerk, Coordinator]
    code: 201
    input: [direction, amount_cents, "purpose?"]
    output: Payment
    side_effects: ["status=SETTLED; recompute amount_paid_cents, balance_due_cents, payment_status"]

  - method: GET
    path: "/bookings/{id}/payments"
    description: "List payments for a booking (reverse-reachability for Payment.booking_id)"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: ["direction?", "status?", "limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/bookings/{id}/payments/{paymentId}/void"
    description: "Void a SETTLED CHARGE payment (not on COMPLETED bookings)"
    roles: [FinanceClerk]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=VOIDED; recompute amount_paid_cents, balance_due_cents, payment_status"]

  # ---------- Test-driving: clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server clock used for reschedule-lead, weather-hold, and completion checks"
    roles: [VenueManager, Coordinator]
    code: 200
    input: [to_iso8601]
    output: SystemClock
    side_effects: ["SystemClock.current_utc := to_iso8601"]

  - method: GET
    path: "/_clock"
    description: "Read the current server clock"
    roles: [VenueManager, Coordinator, FinanceClerk, Guardian]
    code: 200
    input: []
    output: SystemClock
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 401, condition: "X-User-Role or X-User-ID header missing/invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- existence ---
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Booking id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Venue id does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "Room id does not exist (path or body FK)" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "PartyPackage id does not exist (path or body FK)" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "StaffMember id does not exist (path or body FK)" }
  - { id: ERR_ADDON_NOT_FOUND, http: 404, condition: "AddOn id does not exist on this booking" }
  - { id: ERR_WAIVER_NOT_FOUND, http: 404, condition: "Waiver id does not exist on this booking" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "StaffAssignment id does not exist on this booking" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist on this booking" }
  # --- request shape / referential ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type, enum out of range, or numeric/range bound violated (e.g., children_count < 1, deposit_pct outside (0,1])" }
  - { id: ERR_VENUE_MISMATCH, http: 422, condition: "On booking create, room.venue_id != package.venue_id" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from the entity's current state (generic)" }
  - { id: ERR_BOOKING_NOT_SIGNABLE, http: 409, condition: "Waiver sign attempted while booking not in {HELD,CONFIRMED,WEATHER_HOLD,RESCHEDULED}" }
  - { id: ERR_WAIVER_LOCKED, http: 409, condition: "Revoke attempted on a waiver of a CONFIRMED booking" }
  - { id: ERR_ADDON_LOCKED, http: 409, condition: "Add-on add/remove attempted while booking not in {QUOTE_DRAFT,HELD}" }
  - { id: ERR_BOOKING_SETTLED, http: 409, condition: "Payment void attempted on a COMPLETED booking" }
  - { id: ERR_REFUND_IMMUTABLE, http: 409, condition: "Void attempted on a REFUND-direction payment" }
  - { id: ERR_HOLD_HAS_PAYMENTS, http: 409, condition: "release-hold attempted while payment_status != UNPAID" }
  - { id: ERR_HOST_REQUIRED, http: 409, condition: "release would leave a CONFIRMED booking without its sole HOST" }
  # --- config preconditions ---
  - { id: ERR_ROOM_CLOSED, http: 409, condition: "hold on a CLOSED room" }
  - { id: ERR_PACKAGE_RETIRED, http: 409, condition: "hold (or create) referencing a RETIRED package" }
  - { id: ERR_STAFF_INACTIVE, http: 409, condition: "assignment of an INACTIVE staff member" }
  - { id: ERR_SKILL_MISMATCH, http: 409, condition: "role_on_event not present in StaffMember.skills" }
  # --- safety (waivers/staffing) ---
  - { id: ERR_WAIVERS_INCOMPLETE, http: 409, condition: "confirm with waivers_signed < waivers_required" }
  - { id: ERR_HOST_NOT_ASSIGNED, http: 409, condition: "confirm without exactly one ASSIGNED HOST" }
  - { id: ERR_ADDON_STAFF_MISSING, http: 409, condition: "confirm with an ACTIVE skill-requiring add-on lacking its matching ASSIGNED staff role" }
  # --- temporal ---
  - { id: ERR_ROOM_WINDOW_CONFLICT, http: 409, condition: "requested room window (half-open, incl buffer) overlaps an active booking on the room" }
  - { id: ERR_STAFF_WINDOW_CONFLICT, http: 409, condition: "staff window (closed, incl buffer) overlaps another ASSIGNED assignment for the staff member" }
  - { id: ERR_EVENT_ALREADY_STARTED, http: 409, condition: "weather-hold/cancel attempted at/after event_start_utc for a CONFIRMED-class booking" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "complete attempted before event_end_utc" }
  - { id: ERR_NOT_WEATHER_ELIGIBLE, http: 409, condition: "weather-hold on a booking that is not weather_eligible" }
  - { id: ERR_RESCHEDULE_TOO_LATE, http: 409, condition: "Guardian self-reschedule inside the venue.reschedule_lead_hours window" }
  # --- capacity / fiscal ---
  - { id: ERR_ROOM_CAPACITY_EXCEEDED, http: 409, condition: "children_count + adults_count > Room.max_capacity" }
  - { id: ERR_DEPOSIT_NOT_MET, http: 402, condition: "confirm with amount_paid_cents < deposit_due_cents" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 402, condition: "complete with balance_due_cents > 0 against final_total" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 402, condition: "manual REFUND amount_cents > current amount_paid_cents" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_booking_version != Booking.version on reschedule" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: VenueManager
    description: "Owns venue/room/package/staff configuration and config-lifecycle actions"
    identity: opaque
    exclusive_operations:
      - "POST /venues, POST /rooms, POST /packages, POST /staff-members — create config"
      - "POST /rooms/{id}/close, POST /packages/{id}/retire, POST /staff-members/{id}/deactivate — config lifecycle"
    shared_operations:
      - "All GET endpoints"

  - name: Coordinator
    description: "Drives booking lifecycle, staffing, add-ons, roster, and may take payments on a guardian's behalf"
    identity: opaque
    exclusive_operations:
      - "POST /bookings/{id}/hold, /release-hold, /confirm, /weather-hold, /complete — booking lifecycle"
      - "PATCH /bookings/{id}/reschedule — reschedule (OCC)"
      - "POST /bookings/{id}/staff-assignments, .../release — staffing"
    shared_operations:
      - "POST /bookings, PATCH /bookings/{id}, POST /bookings/{id}/cancel — booking create/edit/cancel (shared with Guardian)"
      - "POST /bookings/{id}/add-ons, DELETE .../add-ons/{addOnId} — add-ons (shared with Guardian)"
      - "POST /bookings/{id}/guest-parties — roster (shared with Guardian)"
      - "POST /bookings/{id}/waivers, .../sign, .../revoke — waivers (shared with Guardian)"
      - "POST /bookings/{id}/payments — take payment (shared with FinanceClerk)"
      - "POST /_clock/set_current_utc — clock (shared with VenueManager)"
      - "All GET endpoints"

  - name: Guardian
    description: "Customer acting on their own booking; X-User-ID equals Booking.guardian_user_id"
    identity: "entity_backed:Booking"
    exclusive_operations: []
    shared_operations:
      - "POST /bookings, PATCH /bookings/{id}, POST /bookings/{id}/cancel — own booking (shared with Coordinator)"
      - "POST /bookings/{id}/add-ons, DELETE .../add-ons/{addOnId} — own booking add-ons (shared with Coordinator)"
      - "POST /bookings/{id}/guest-parties — own roster (shared with Coordinator)"
      - "POST /bookings/{id}/waivers, .../sign, .../revoke — own waivers (shared with Coordinator)"
      - "All GET endpoints"
    note: "Guardian self-reschedule is NOT a separate endpoint; Guardians cannot call /weather-hold or /reschedule. Guardian ownership: X-User-ID must equal Booking.guardian_user_id for booking-scoped writes."

  - name: FinanceClerk
    description: "Handles payments and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /bookings/{id}/payments/{paymentId}/void — void a charge"
    shared_operations:
      - "POST /bookings/{id}/payments — take payment (shared with Coordinator)"
      - "All GET endpoints"
