    instances:

      - name: plan_phase_state_error_wins_over_pool_funds_exceeded
        grounds:
          - validations.priority_62
          - validations.priority_65
          - validations.priority_121
          - errors.ERR_PLAN_NOT_IN_ALLOCATION
          - errors.ERR_POOL_FUNDS_EXCEEDED
          - endpoints."POST /participant-awards/{awardId}/propose-allocation"
        distinguishing_aspect: |
          Category pair {state, business_fiscal}. The request violates
          priority 62 (plan is in CALIBRATION_REVIEW, not ALLOCATION_OPEN) and
          priority 121 (5,000,000 proposed against a 4,000,000 pool). The
          state error at 62 must be returned with 409; an implementation that
