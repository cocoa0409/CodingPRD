  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: milk_volume_conservation_across_pool_scrap_and_reallocation
        grounds:
          - endpoints[POST /milk-bank/pools/{id}/scrap]
          - state_machines.Pool.COMMITTED_to_SCRAPPED
          - state_machines.Donation.ALLOCATED_to_ELIGIBLE
          - state_machines.PasteurizationRun.SCHEDULED_to_VOIDED
          - calculations.pool_projected_kcal_per_oz
          - entities.PoolComponent.fields.status
          - entities.Donation.fields.remaining_ml
        distinguishing_aspect: |
          Conserved quantity: MILLILITRES OF MILK. Across the scrap the identity
          sum(Donation.remaining_ml) + sum(allocated_volume_ml of non-VOIDED components)
          must stay exactly 2100 with no drift, and the returned volume must be re-allocable
          in full: donation C1 is put into a brand-new pool at its original 800 ml, which is
          refused with ERR_ALLOCATION_EXCEEDS_DONATION_REMAINING if the credit-back lost even
          one millilitre. The scrap must also void the pool's SCHEDULED run rather than leave
          an orphan holding a pasteurizer interval.
