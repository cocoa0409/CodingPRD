scaffold_corner_design:
  # ===================================================================
  - section: entities
    instances:
      - name: create_homeowner_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Homeowner, endpoints]
        distinguishing_aspect: "POST /solar/homeowners with all required fields returns 201 and echoes email, full_name, state_code, annual_kwh_usage plus system id/created_at."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /solar/homeowners"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "CA", annual_kwh_usage: 9000 }
              as: Anonymous
              captures: { h: $.data.id }
          assert:
            - "response.status == 201"
            - "Homeowner.${h}.state_code == CA"
            - "Homeowner.${h}.annual_kwh_usage == 9000"
            - "Homeowner.${h}.version == 1"

      - name: get_project_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Project, endpoints]
        distinguishing_aspect: "GET /solar/projects/{non-existent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /solar/projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_project_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Project, "validations[priority=18]"]
        distinguishing_aspect: "POST /solar/projects missing roof_area_sqft -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A registered homeowner."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "rf@x.com", full_name: "Rf One", state_code: "CA", annual_kwh_usage: 9000 }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}" }
              as: Homeowner
              as_user_id: "${h}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: utility_export_credit_ratio_default_applied
        claim_type: Defaults
        grounds: [entities.Utility.fields.export_credit_ratio]
        distinguishing_aspect: "Omitting export_credit_ratio on POST /solar/utilities applies default 1.0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /solar/utilities"
              payload: { name: "Def U", state_code: "CA", feeder_headroom_kw: 500, net_metering_rate_cents_per_kwh: 15.0 }
              as: PlatformAdmin
              captures: { u: $.data.id }
          assert:
            - "response.status == 201"
            - "Utility.${u}.export_credit_ratio == 1.0"

      - name: project_computed_system_size_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Project.fields.system_size_kw, calculations.size_system]
        distinguishing_aspect: "system_size_kw is server-computed at design (7.3 for roof 700/usage 12000/psh 5.0/shade 0.10); not settable by client."
        test_recipe:
          setup: ["An ASSESSED project (roof 700, shade 0.10, psh 5.0)."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "cf@x.com", full_name: "Cf One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
          assert:
            - "Project.${p}.system_size_kw == 7.3"
            - "Project.${p}.estimated_annual_production_kwh == 9592"

      - name: enum_invalid_state_code_rejected
        claim_type: Type Constraints
        grounds: [entities.Homeowner.fields.state_code, "validations[priority=18]"]
        distinguishing_aspect: "POST /solar/homeowners with state_code 'ZZ' (not in {CA,NJ,MA,TX,AZ}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /solar/homeowners"
              payload: { email: "tc@x.com", full_name: "Tc One", state_code: "ZZ", annual_kwh_usage: 9000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: warranty_policy_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.WarrantyPolicy]
        distinguishing_aspect: "WarrantyPolicy is common_fields:false — it exposes id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["An OPERATIONAL project (its grant-pto minted exactly one WarrantyPolicy)."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "im@x.com", full_name: "Im One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/utilities"
              payload: { name: "U CA", state_code: "CA", feeder_headroom_kw: 1000, net_metering_rate_cents_per_kwh: 15.0 }
              as: PlatformAdmin
              captures: { u: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/projects/${p}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p}", utility_id: "${u}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/interconnection-applications/${ia}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u}"
          trigger:
            - call: "GET /solar/warranty-policies"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
          assert:
            - "the response array contains exactly one WarrantyPolicy with project_id == ${p}"
            - "that WarrantyPolicy has coverage_years == 25 and no version field"

  # ===================================================================
  - section: state_machines
    instances:
      - name: assess_from_designed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Project.REQUESTED_to_ASSESSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling assess on a DESIGNED project (not REQUESTED) -> ERR_INVALID_STATE (409); no fields change."
        test_recipe:
          setup: ["A DESIGNED project."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "sm1@x.com", full_name: "Sm One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.20, peak_sun_hours: 4.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: project_initial_state_is_requested
        claim_type: initial_state
        grounds: [state_machines.Project, entities.Project.fields.status]
        distinguishing_aspect: "A freshly created project has status == REQUESTED."
        test_recipe:
          setup: ["A registered homeowner."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "is@x.com", full_name: "Is One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
          trigger:
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
          assert:
            - "Project.${p}.status == REQUESTED"

      - name: cancel_operational_project_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Project, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "An OPERATIONAL (terminal) project cannot be cancelled by its owner -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["An OPERATIONAL project owned by the acting homeowner."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "tl@x.com", full_name: "Tl One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/utilities"
              payload: { name: "U CA", state_code: "CA", feeder_headroom_kw: 1000, net_metering_rate_cents_per_kwh: 15.0 }
              as: PlatformAdmin
              captures: { u: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/projects/${p}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p}", utility_id: "${u}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/interconnection-applications/${ia}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u}"
          trigger:
            - call: "POST /solar/projects/${p}/cancel"
              payload: {}
              as: Homeowner
              as_user_id: "${h}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: design_install_not_licensed_in_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.ASSESSED_to_DESIGNED, "validations[priority=6]", "errors[ERR_INSTALLER_NOT_LICENSED]"]
        distinguishing_aspect: "Design by an installer not licensed in the homeowner's state (homeowner CA, installer licensed only TX) -> ERR_INSTALLER_NOT_LICENSED (422)."
        test_recipe:
          setup: ["An ASSESSED CA project; an installer licensed only in TX."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "lic@x.com", full_name: "Lic One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "TxOnly", licensed_states: ["TX"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INSTALLER_NOT_LICENSED"

      - name: design_infeasible_zero_sun_hours
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.ASSESSED_to_DESIGNED, "validations[priority=7]", "errors[ERR_DESIGN_INFEASIBLE]"]
        distinguishing_aspect: "Design when peak_sun_hours == 0 (system size undefined) -> ERR_DESIGN_INFEASIBLE (422)."
        test_recipe:
          setup: ["An ASSESSED project whose assessment recorded peak_sun_hours == 0.0."]
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "inf@x.com", full_name: "Inf One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 0.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
          trigger:
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_DESIGN_INFEASIBLE"

      - name: warranty_claim_approve_zero_shortfall_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_APPROVED, "validations[priority=16]", calculations.production_shortfall_eval, "errors[ERR_NO_SHORTFALL]"]
        distinguishing_aspect: "Approving a PRODUCTION_SHORTFALL claim whose measured production (8000) meets the guarantee (guaranteed 8153 > measured? no — measured exceeds) yields shortfall_kwh == 0 -> ERR_NO_SHORTFALL (422). Window covers one SETTLED period producing 8200 kWh."
        test_recipe:
          setup:
            - "OPERATIONAL project (est_production 9592, guarantee 0.85 -> guaranteed 8153)."
            - "One SETTLED period in [2026-01-01,2026-02-01) producing 8200 kWh; a SUBMITTED PRODUCTION_SHORTFALL claim over that window."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "ns@x.com", full_name: "Ns One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
              captures: { inst: $.data.id }
            - call: "POST /solar/utilities"
              payload: { name: "U CA", state_code: "CA", feeder_headroom_kw: 1000, net_metering_rate_cents_per_kwh: 15.0 }
              as: PlatformAdmin
              captures: { u: $.data.id }
            - call: "POST /solar/projects"
              payload: { homeowner_id: "${h}", roof_area_sqft: 700 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { p: $.data.id }
            - call: "POST /solar/projects/${p}/assess"
              payload: { shading_factor: 0.10, peak_sun_hours: 5.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/design"
              payload: { installer_id: "${inst}", gross_system_cost_cents: 3000000 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { p_v: $.data.version }
            - call: "POST /solar/financing-plans"
              payload: { project_id: "${p}", model: "LEASE", term_years: 20, lease_monthly_cents: 8500 }
              as: Homeowner
              as_user_id: "${h}"
              captures: { fp: $.data.id }
            - call: "POST /solar/financing-plans/${fp}/activate"
              payload: { expected_project_version: "${p_v}" }
              as: Homeowner
              as_user_id: "${h}"
            - call: "POST /solar/projects/${p}/submit-permit"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/projects/${p}/approve-permit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /solar/projects/${p}/complete-install"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
            - call: "POST /solar/interconnection-applications"
              payload: { project_id: "${p}", utility_id: "${u}", requested_export_kw: 7.0 }
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { ia: $.data.id }
            - call: "POST /solar/interconnection-applications/${ia}/begin-review"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/interconnection-applications/${ia}/approve"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/projects/${p}/inspect"
              payload: { result: "PASS" }
              as: PlatformAdmin
            - call: "POST /solar/interconnection-applications/${ia}/grant-pto"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/net-meter-periods"
              payload: { project_id: "${p}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-02-01T00:00:00.000Z", kwh_produced: 8200, kwh_consumed: 100 }
              as: Utility
              as_user_id: "${u}"
              captures: { nm: $.data.id }
            - call: "POST /solar/net-meter-periods/${nm}/settle"
              payload: {}
              as: Utility
              as_user_id: "${u}"
            - call: "POST /solar/warranty-claims"
              payload: { project_id: "${p}", claim_type: "PRODUCTION_SHORTFALL", claimed_window_start: "2026-01-01T00:00:00.000Z", claimed_window_end: "2026-02-01T00:00:00.000Z" }
              as: Homeowner
              as_user_id: "${h}"
              captures: { wc: $.data.id }
          trigger:
            - call: "POST /solar/warranty-claims/${wc}/approve"
              payload: {}
              as: SolarInstaller
              as_user_id: "${inst}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NO_SHORTFALL"

      - name: warranty_claim_approve_production_shortfall_payout
        claim_type: side_effect_execution
        grounds: [state_machines.WarrantyClaim.SUBMITTED_to_APPROVED, calculations.production_shortfall_eval, entities.WarrantyClaim.fields.payout_cents]
        distinguishing_aspect: "Approving a PRODUCTION_SHORTFALL claim with measured 6000 vs guaranteed 8153 yields shortfall_kwh 2153 and payout_cents 32295 (2153*15 c/kWh)."
        test_recipe:
          setup:
            - "OPERATIONAL project (est 9592, guarantee 0.85 -> guaranteed 8153, rate 15)."
            - "One SETTLED period [2026-01-01,2026-02-01) producing 6000 kWh; a SUBMITTED PRODUCTION_SHORTFALL claim over that window."
          setup_api_calls:
            - call: "POST /solar/homeowners"
              payload: { email: "po@x.com", full_name: "Po One", state_code: "CA", annual_kwh_usage: 12000 }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /solar/installers"
              payload: { company_name: "SunCo", licensed_states: ["CA"] }
              as: Anonymous
