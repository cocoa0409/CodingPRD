  # ===========================================================================
  # Stubs — corners already covered by §1.8 difficulty instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: revision_supersede_on_resubmit_covered
        claim_type: valid_transition
        grounds: [state_machines.SubmittalRevision.status.RETURNED_to_SUPERSEDED]
        excluded_because:
          difficulty_instance: submittal_resubmittal_cycle_with_parallel_dimension
          rationale: "The C-return -> resubmit -> supersede path and its side effects are asserted there."

      - name: rfi_overdue_flag_set_by_scan_covered
        claim_type: side_effect_execution
        grounds: [calculations.rfi_due_date, entities.RFI.fields.is_overdue]
        excluded_because:
          difficulty_instance: rfi_due_date_inclusive_boundary
          rationale: "Due-date computation and the on-time/late boundary are asserted there; the scan-side latch is exercised by distribution_overdue_standing_cascade."

  - section: calculations
    instances:
