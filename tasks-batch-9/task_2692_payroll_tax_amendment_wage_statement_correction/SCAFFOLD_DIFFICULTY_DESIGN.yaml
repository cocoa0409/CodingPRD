  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_check_precedes_temporal_window_on_unsigned_late_submit
        grounds:
          - validations.priority_40.ERR_AMENDED_RETURN_NOT_SIGNED
          - validations.priority_60.ERR_AMENDMENT_WINDOW_CLOSED
        distinguishing_aspect: |
          Pairs the `state` category (priority 40) against the `business_temporal` category
          (priority 60) on POST /amended-returns/{amended_return_id}/submit. Both conditions hold
          on the same call — the return has never been signed AND the statutory amendment window
          has already lapsed — and the 409 signature error must win over the 422 window error, so
          an implementation that evaluates the calendar before the workflow state is caught.
        test_recipe:
          setup:
            - "Logical clock at 2027-05-01T00:00:00Z."
            - "Federal agency FED-941 configured with amendment_window_days 730, so a return filed 2025-04-30 can no longer be amended after 2027-04-30."
            - "A 2025 Q1 case with one categorised WITHHOLDING variance of 50000 cents and an amended return that has been prepared but deliberately never signed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme Manufacturing", fein: "12-3456789", deposit_schedule: "MONTHLY", authorization_limit_cents: 5000000 }
              as: PlatformAdmin
