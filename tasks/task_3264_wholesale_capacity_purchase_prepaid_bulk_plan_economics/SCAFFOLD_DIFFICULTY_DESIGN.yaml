# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3264_wholesale_capacity_purchase_prepaid_bulk_plan_economics
#
# 22 instances across the nine §0.5 Difficulty Rules. Every `grounds:` reference
# resolves inside SCAFFOLD.yaml §1.1–§1.6. Every `${var}` is bound by an earlier
# `captures:` in the same instance. Composite money values follow the SCAFFOLD's
# pinned definition: committed_volume_cost_microcents is the marginal tiered data
# cost plus the voice and SMS costs.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: wholesale_overage_forward_looking_vs_as_incurred
        grounds:
          - calculations.wholesale_forward_overage_cost
          - calculations.wholesale_allocated_data_mb
          - entities.CapacityAgreement.fields.committed_data_mb
          - endpoints.POST_/carriers/capacity-agreements/{id}/resolve-purchase
          - endpoints.GET_/carriers/capacity-agreements/{id}/usage-summary
        distinguishing_aspect: "For one agreement whose two offered plans sell 18000 megabytes against a 16000 megabyte commitment and whose subscribers have rolled no cycle at all, resolve-purchase reports resolved_purchase_cost_microcents 35838000 while usage-summary reports as_incurred_cost_microcents 32992000 — the 2846000 gap is exactly the projected overage on the unsold and unrolled allotment that the forward variant charges and the as-incurred variant does not."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z, empty database."
            - "Agreement AG_LOCAL: state CA, committed_data_mb 16000, data rate 1237 microcents, voice rate 60, SMS rate 3, committed_voice_minutes 200000, committed_sms_messages 400000."
            - "Plan H3 (allotment 3000) offered and sold to one subscriber; Plan M3 (allotment 15000) offered and sold to one subscriber; both subscriptions only PROVISIONED so no cycle has rolled."
            - "No CycleRecord row anywhere is ROLLED, so the chronological variant has zero rolled overage to charge."
          setup_api_calls:
            - &s_clock
              call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &s_ag_local
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Pacific Host Network", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 16000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_local_id: $.data.id, ag_local_v0: $.data.version }
            - &s_plan_h
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_local_id}", plan_code: "H3", term_months: 3, intro_price_cents: 1999, renewal_price_cents: 3042, data_allotment_mb: 3000, voice_allotment_min: 500, sms_allotment_msg: 1000 }
              as: CapacityPlanner
              captures: { plan_h_id: $.data.id }
            - &s_plan_h_offer
              call: "POST /carriers/plans/${plan_h_id}/offer"
              payload: { expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: CapacityPlanner
            - &s_plan_m
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_local_id}", plan_code: "M3", term_months: 3, intro_price_cents: 2999, renewal_price_cents: 3850, data_allotment_mb: 15000, voice_allotment_min: 1000, sms_allotment_msg: 2000 }
              as: CapacityPlanner
              captures: { plan_m_id: $.data.id }
            - &s_plan_m_offer
              call: "POST /carriers/plans/${plan_m_id}/offer"
              payload: { expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: CapacityPlanner
            - &s_ag_local_activate
              call: "POST /carriers/capacity-agreements/${ag_local_id}/activate"
              payload: { expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: CapacityPlanner
            - &s_inv_ca_esim
              call: "POST /carriers/sim-inventories"
              payload: { state_code: "CA", sim_media_type: "ESIM_PROFILE", unit_count: 40 }
              as: CapacityPlanner
              captures: { inv_ca_id: $.data.id }
            - &s_sub_h
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550001", full_name: "Mia Herrera", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_h_id: $.data.id }
            - &s_term_h
              call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_h_id}", plan_id: "${plan_h_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { term_h_id: $.data.id }
            - &s_purch_h
              call: "POST /carriers/prepaid-terms/${term_h_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_act_h
              call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_h_id}", prepaid_term_id: "${term_h_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { act_h_id: $.data.id }
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &s_sub_m
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550002", full_name: "Owen Blake", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_m_id: $.data.id }
            - &s_term_m
              call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_m_id}", plan_id: "${plan_m_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_m_id}"
              captures: { term_m_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_m_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_m_id}"
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_local_id}/resolve-purchase"
              payload: {}
              as: CapacityPlanner
              captures: { resolved_total: $.data.resolved_purchase_cost_microcents, fwd_overage_mb: $.data.projected_overage_data_mb, committed_block: $.data.committed_volume_cost_microcents, tier_rate: $.data.marginal_tier_rate_microcents }
          assert:
            - "resolved_total == 35838000"
            - "fwd_overage_mb == 2000"
            - "committed_block == 32992000 (marginal tiered data 19792000 plus voice 12000000 plus SMS 1200000)"
            - "tier_rate == 1139, which is ceil(1237 * 92 / 100)"
            - "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary returns as_incurred_cost_microcents == 32992000"
            - "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary returns as_incurred_overage_cost_microcents == 0 and allocated_data_mb == 18000"
            - "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary returns remaining_data_mb == -2000, which is the billable projected overage"
            - "resolved_total - as_incurred_cost_microcents == 2846000 and that difference equals 2000 * 1423, the projected overage megabytes times the pinned overage rate"

      - name: tier_marginal_breakpoint_vs_retroactive
        grounds:
          - calculations.wholesale_volume_tier_cost
          - entities.CapacityAgreement.fields.data_rate_microcents_per_mb
          - entities.CapacityAgreement.fields.committed_data_mb
          - endpoints.POST_/carriers/capacity-agreements/{id}/resolve-purchase
          - endpoints.GET_/carriers/capacity-agreements/{id}/usage-summary
        distinguishing_aspect: "At committed_data_mb 250000 both readings of the volume discount agree because the volume sits exactly on TIER1_DATA_MB, but at 320000 the marginal reading charges 388980000 microcents while the retroactive reading charges 364480000 — a 24500000 microcent divergence produced purely by whether the ceilinged tier rate reprices the whole committed volume or only the volume above the breakpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Two agreements from the identical data rate 1237 microcents, differing only in committed_data_mb: one at 250000 sitting exactly on the breakpoint, one at 320000 above it."
            - "Both agreements have no plans, so allocation does not perturb the derived fields."
          setup_api_calls:
            - *s_clock
            - &s_ag_on
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "On Breakpoint Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 250000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_on_id: $.data.id, ag_on_v0: $.data.version }
            - &s_ag_over
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Over Breakpoint Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 320000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_over_id: $.data.id, ag_over_v0: $.data.version }
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_over_id}/resolve-purchase"
              payload: {}
              as: CapacityPlanner
              captures: { marginal_over: $.data.data_volume_cost_microcents, tier_rate: $.data.marginal_tier_rate_microcents }
          assert:
            - "GET /carriers/capacity-agreements/${ag_on_id}/usage-summary returns retroactive_volume_cost_microcents == 309250000, equal to the marginal reading on the breakpoint"
            - "GET /carriers/capacity-agreements/${ag_on_id}/usage-summary returns committed_volume_cost_microcents == 329920000"
            - "marginal_over == 388980000"
            - "GET /carriers/capacity-agreements/${ag_over_id}/usage-summary returns retroactive_volume_cost_microcents == 364480000"
            - "marginal_over - 364480000 == 24500000, so above the breakpoint the marginal reading is strictly the more expensive one"
            - "tier_rate == 1139 and 320000 * 1139 == 364480000 while 250000 * 1237 + 70000 * 1139 == 388980000"
            - "on the breakpoint the two readings coincide exactly, so the divergence is entirely produced by the tier boundary"

      - name: deferred_revenue_provisional_schedule_vs_final_blended
        grounds:
          - calculations.schedule_formula_provisional_vs_final
          - calculations.deferred_revenue_aging
          - entities.PrepaidTerm.fields.deferred_revenue_cents
          - entities.CycleRecord.fields.earned_cents
          - endpoints.POST_/carriers/prepaid-terms/{id}/purchase
          - endpoints.POST_/carriers/subscribers/{id}/run_cycle
        distinguishing_aspect: "A 3-month term at intro_price_cents 1999 carries deferred_revenue_cents 1333 immediately after purchase, but after one cycle in which the subscriber stayed deprioritized on all 30 days the same term's deferred_revenue_cents is 1032 — the 301-cent difference is the deprioritization quality term that the provisional schedule omits entirely."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "CA agreement committed_data_mb 16000 with offered H3 plan (intro 1999, renewal 3042, term 3, allotment 3000), CA eSIM inventory."
            - "Subscriber 13055550001 activated on H3 with one open cycle; the agreement reaches congestion because the subscriber then consumes twice their allotment."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &s_complete_h
              call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_consume_6000
              call: "POST /carriers/subscribers/${sub_h_id}/consume_data"
              payload: { data_mb: 6000 }
              as: CapacityPlanner
            - call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers/subscribers/${sub_h_id}/consume_data"
              payload: { data_mb: 1 }
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/subscribers/${sub_h_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
              captures: { rolled: $.data.cycles_rolled }
          assert:
            - "immediately after purchase PrepaidTerm.deferred_revenue_cents was 1333 and earned_revenue_cents was 667"
            - "after the roll PrepaidTerm.deferred_revenue_cents == 1032"
            - "PrepaidTerm.earned_revenue_cents == 967"
            - "the closed CycleRecord's earned_cents == 967, which is the formula floor ceil(1999/3) == 667 plus the quality term ceil(1999*3/20*30/30) == 300"
            - "rolled == 1 and 1032 != 1333 : the final blended reading differs from the provisional schedule reading"
            - "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary reports congestion_index == 113 and congestion_active == true because both subscribers' 18000 megabytes over committed_data_mb 16000 rounds to 113, past the 85 trigger"
            - "GET /carriers/cycles?prepaid_term_id=${term_h_id}&cycle_status=ROLLED returns exactly 1 row"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: wholesale_cost_nested_rounding_order_marginal_vs_retroactive
        grounds:
          - calculations.wholesale_volume_tier_cost
          - entities.CapacityAgreement.fields.data_rate_microcents_per_mb
          - validations[priority=10]
        distinguishing_aspect: "Mode (b): the marginal reading ceilings the tier rate once (ceil(1237*92/100) == 1139) and multiplies only above the breakpoint, while the retroactive reading applies that same ceilinged rate to the whole 320000 megabytes — rounding the rate before vs after the multiply changes the answer by 24500000 microcents on identical inputs."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement at committed_data_mb 320000 with data rate 1237 microcents, above TIER1_DATA_MB 250000."
          setup_api_calls:
            - *s_clock
            - *s_ag_over
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_over_id}/resolve-purchase"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the resolved payload reports data_volume_cost_microcents == 388980000"
            - "the resolved payload reports marginal_tier_rate_microcents == 1139, never 1138 which is what flooring 1137.64 would give"
            - "GET /carriers/capacity-agreements/${ag_over_id}/usage-summary returns retroactive_volume_cost_microcents == 364480000"
            - "388980000 != 364480000 : the two pinned rounding orders diverge by 24500000"
            - "the retroactive branch applies 1139 to every megabyte, so its average unit cost is 1139 while the marginal branch's average is 1215.5625"

      - name: agreement_oversale_ladder_with_below_breakpoint_tier_cost
        grounds:
          - calculations.wholesale_allocated_data_mb
          - calculations.wholesale_volume_tier_cost
          - validations[priority=10]
          - errors.ERR_INSUFFICIENT_AGREEMENT_CAPACITY
          - entities.CapacityAgreement.fields.remaining_data_mb
        distinguishing_aspect: "Mode (a): on a 100000-megabyte agreement selling 3000-megabyte plans the oversale ceiling of 120000 megabytes is reached at exactly forty subscribers and the forty-first purchase is rejected, while the same agreement's volume tier cost is a flat 100000 * 1237 because the commitment sits below TIER1_DATA_MB — the two non-linear ladders resolve on one set of numbers."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_SMALL committed_data_mb 100000 with one offered 3000-megabyte plan; no subscribers yet."
          setup_api_calls:
            - *s_clock
            - &s_ag_small
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Small Host", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 100000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_sm_id: $.data.id, ag_sm_v0: $.data.version }
            - &s_plan_sm
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_sm_id}", plan_code: "S3", term_months: 3, intro_price_cents: 1999, renewal_price_cents: 3042, data_allotment_mb: 3000, voice_allotment_min: 500, sms_allotment_msg: 1000 }
              as: CapacityPlanner
              captures: { plan_sm_id: $.data.id }
            - call: "POST /carriers/plans/${plan_sm_id}/offer"
              payload: { expected_CapacityAgreement_version: "${ag_sm_v0}" }
              as: CapacityPlanner
            - call: "POST /carriers/capacity-agreements/${ag_sm_id}/activate"
              payload: { expected_CapacityAgreement_version: "${ag_sm_v0}" }
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_sm_id}/resolve-purchase"
              payload: {}
              as: CapacityPlanner
              captures: { marginal_sm: $.data.data_volume_cost_microcents, tier_rate_sm: $.data.marginal_tier_rate_microcents }
          assert:
            - "marginal_sm == 123700000 and there is no tier-2 term because committed_data_mb 100000 is below TIER1_DATA_MB 250000"
            - "GET /carriers/capacity-agreements/${ag_sm_id}/usage-summary returns allocated_data_mb == 0, remaining_data_mb == 100000 and congestion_index == 0"
            - "tier_rate_sm == 1139 is still reported even though the tier is never reached"
            - "an agreement holding forty subscribers on the 3000-megabyte plan has allocated_data_mb == 120000, which is exactly the 120 percent oversale ceiling, so the fortieth purchase succeeds"
            - "the ceiling is inclusive: a purchase bringing allocated_data_mb to 123000 fails with ERR_INSUFFICIENT_AGREEMENT_CAPACITY (409)"
            - "at the ceiling remaining_data_mb is -20000, which is the billable oversale volume, and the agreement is still ACTIVE because 120000 has not passed 120000 * OVERSALE_LIMIT_NUM / OVERSALE_LIMIT_DEN"

      - name: schedule_formula_int_floor_then_quality_then_integer_carry
        grounds:
          - calculations.schedule_formula_provisional_vs_final
          - calculations.deferred_revenue_aging
          - entities.CycleRecord.fields.earned_cents
          - entities.CycleRecord.fields.cycle_deprioritization_days
        distinguishing_aspect: "Mode (c): a cycle's earned cents depend on the quality term keyed on term_price_cents, while the running carry that decides deferred_revenue_cents depends on the per-cycle earned cents — the pinned order (per-cycle ceil, then integer carry, then subtract from term_price_cents) yields earned_revenue_cents 634 on a 6-month term after one fully deprioritized cycle where a sum-then-round evaluation yields 633."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "CA agreement with a 6-month plan at intro_price_cents 1999 and 8000-megabyte allotment; subscriber activated, one cycle consumed past the 8000-megabyte threshold on two distinct calendar days."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - &s_plan_l6
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_local_id}", plan_code: "L6", term_months: 6, intro_price_cents: 1999, renewal_price_cents: 2999, data_allotment_mb: 8000, voice_allotment_min: 1000, sms_allotment_msg: 2000 }
              as: CapacityPlanner
              captures: { plan_l6_id: $.data.id }
            - call: "POST /carriers/plans/${plan_l6_id}/offer"
              payload: { expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: CapacityPlanner
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - &s_sub_l6
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550006", full_name: "Priya Nandakumar", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_l6_id: $.data.id }
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_l6_id}", plan_id: "${plan_l6_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_l6_id}"
              captures: { term_l6_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_l6_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_l6_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_l6_id}", prepaid_term_id: "${term_l6_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_l6_id}"
              captures: { act_l6_id: $.data.id }
            - call: "POST /carriers/activations/${act_l6_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_l6_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_l6_id}"
            - call: "POST /carriers/subscribers/${sub_l6_id}/consume_data"
              payload: { data_mb: 8000 }
              as: CapacityPlanner
            - call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers/subscribers/${sub_l6_id}/consume_data"
              payload: { data_mb: 1 }
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/subscribers/${sub_l6_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the closed CycleRecord's earned_cents == 634"
            - "634 == ceil(1999/6) + ceil(1999*3/20) == 334 + 300, so the per-cycle integer values are computed first and only then summed"
            - "summing unrounded values first would give 633 and is rejected by the pinned order"
            - "PrepaidTerm.earned_revenue_cents == 634 and deferred_revenue_cents == 1365"
            - "1999 - 634 == 1365 shows the carry is subtracted from term_price_cents as integers"
            - "GET /carriers/cycles?prepaid_term_id=${term_l6_id} returns exactly one OPEN row at cycle_index 2 and one ROLLED row at cycle_index 1 with cycle_deprioritization_days == 2"
            - "the open cycle's earned_cents is 0 because only ROLLED cycles contribute to the running carry"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: plan_cyclic_offer_withdraw_reoffer
        grounds:
          - state_machines.Plan.DRAFT_to_OFFERED
          - state_machines.Plan.OFFERED_to_DRAFT
          - state_machines.Plan.ACTIVE_to_OFFERED
          - calculations.wholesale_allocated_data_mb
        distinguishing_aspect: "Plan loops rather than flowing one way: OFFERED to DRAFT to OFFERED is reachable indefinitely, so an operator can withdraw an unsold offer and re-offer it, with allocated_data_mb returning to 0 on the withdraw and back to 3000 once a subscriber holds the plan."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL ACTIVE with plan H3 offered but not yet sold, and plan M3 offered and sold to one PROVISIONED subscriber."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_plan_m
            - *s_plan_m_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_m
            - *s_term_m
            - call: "POST /carriers/prepaid-terms/${term_m_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_m_id}"
          trigger:
            - call: "GET /carriers/capacity-agreements/${ag_local_id}/usage-summary"
              payload: {}
              as: CapacityPlanner
              captures: { alloc_before: $.data.allocated_data_mb }
          assert:
            - "alloc_before == 15000, so the offered-but-unsold H3 contributes nothing while the sold M3 contributes its full allotment"
            - "Plan.${plan_h_id}.plan_status == OFFERED and its deprioritization_threshold_mb == 3000"
            - "POST /carriers/plans/${plan_h_id}/withdraw is accepted and leaves plan_status == DRAFT, then re-offering it with the agreement's current version leaves plan_status == OFFERED again"
            - "a second withdraw on the re-offered plan is also accepted, proving the OFFERED to DRAFT edge is reachable more than once"
            - "withdrawing plan M3 while its subscriber holds a live term is rejected with ERR_INVALID_STATE (409) because a plan with a non-terminal term cannot return to DRAFT"
            - "the DRAFT to OFFERED edge is not reachable from RETIRED"

      - name: activation_parallel_provisioning_and_porting_dimensions
        grounds:
          - state_machines.Activation.REQUESTED_to_PROVISIONED
          - state_machines.Activation.NONE_to_SUBMITTED
          - state_machines.Activation.SUBMITTED_to_REJECTED
          - state_machines.Activation.PROVISIONED_to_COMPLETED
          - calculations.settlement_clearing
        distinguishing_aspect: "The Activation row carries two independent state dimensions — activation_status and port_status — so port_status can reach REJECTED while activation_status stays PROVISIONED and then reaches COMPLETED, a pairing a single-axis machine cannot express."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan, CA eSIM inventory, CA subscriber 13055550001 holding a purchased term awaiting activation."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/activations/${act_h_id}/submit-port"
              payload: { porting_msisdn: "13055550001", losing_carrier: "Cascade Wireless", account_number_last4: "4471" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
          assert:
            - "after provision, Activation.${act_h_id} reports activation_status == PROVISIONED and port_status == NONE as two independent dimensions of one row"
            - "after submit-port, port_status == SUBMITTED while activation_status is still PROVISIONED, and held_data_mb == 3000"
            - "POST /carriers/activations/${act_h_id}/reject-port with rejection_code E0403 sets port_status == REJECTED, held_data_mb == 0 and Subscriber.${sub_h_id}.subscriber_status == GRACE while activation_status remains PROVISIONED"
            - "after the rejection the agreement's allocated_data_mb is still 3000 because the subscriber's PrepaidTerm is still AWAITING_ACTIVATION"
            - "POST /carriers/activations/${act_h_id}/complete then sets activation_status == COMPLETED while port_status remains REJECTED, so the subscriber goes live on the provisioned spare number"
            - "GET /carriers/activations/${act_h_id} reports accepted_msisdn == 13055550001 and provisioned_msisdn == 13055550001"

      - name: prepaid_term_cyclic_renewal_loop
        grounds:
          - state_machines.PrepaidTerm.ACTIVE_to_RENEWAL_DUE
          - state_machines.PrepaidTerm.RENEWAL_DUE_to_ACTIVE_RENEWAL
          - state_machines.PrepaidTerm.ACTIVE_RENEWAL_to_RENEWAL_DUE
          - calculations.prepaid_term_price
          - calculations.schedule_formula_provisional_vs_final
        distinguishing_aspect: "PrepaidTerm loops through the renewal cycle rather than terminating: ACTIVE to RENEWAL_DUE to ACTIVE_RENEWAL to RENEWAL_DUE is reachable repeatedly, and each pass through reprices the term at renewal_price_cents instead of intro_price_cents."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan (intro 1999, renewal 3042, term 3); subscriber 13055550003 activated on H3 with one open cycle."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - &s_sub_r
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550003", full_name: "Ravi Sethi", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_r_id: $.data.id }
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_r_id}", plan_id: "${plan_h_id}", expected_CapacityAgreement_version: "${ag_local_v0}" }
              as: Subscriber
              as_user_id: "${sub_r_id}"
              captures: { term_r_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_r_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_r_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_r_id}", prepaid_term_id: "${term_r_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_r_id}"
              captures: { act_r_id: $.data.id }
            - call: "POST /carriers/activations/${act_r_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_r_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_r_id}"
          trigger:
            - call: "POST /carriers/subscribers/${sub_r_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
              captures: { rolled_1: $.data.cycles_rolled }
          assert:
            - "PrepaidTerm.${term_r_id}.term_price_cents == 1999 because this is the subscriber's first term on the plan"
            - "three run_cycle calls bring the term to RENEWAL_DUE with rolled_1 == 1 after the first and cycles_rolled == 3 after the third"
            - "POST /carriers/prepaid-terms/${term_r_id}/accept_step_up is rejected with ERR_INVALID_STATE (409) while the term is still ACTIVE on cycle 3"
            - "after the third roll the term reports term_status == RENEWAL_DUE and a RENEWAL_PRICING SupportCase exists in status OPEN for subscriber ${sub_r_id}"
            - "accept_step_up then succeeds, sets term_status == ACTIVE_RENEWAL, term_price_cents == 3042 and cycles_rolled == 0"
            - "after the renewal the subscriber's allocatation still counts once, so the agreement's allocated_data_mb remains 3000 rather than doubling"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: activation_failure_deep_cascade_to_plan_dormancy
        grounds:
          - state_machines.Activation.PROVISIONED_to_FAILED
          - state_machines.Subscriber.PENDING_PORT_to_GRACE
          - state_machines.PrepaidTerm.AWAITING_ACTIVATION_to_PURCHASED
          - entities.SimInventory.fields.reserved_count
          - state_machines.Plan.ACTIVE_to_OFFERED
          - calculations.wholesale_allocated_data_mb
        distinguishing_aspect: "Depth 5: failing an activation mutates the subscriber into GRACE, which sends the term back to PURCHASED, which returns its reserved megabyte to the agreement, which empties the only plan holding it so the plan falls from ACTIVE back to OFFERED — each hop is caused by the previous hop, not by the original fail call."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan, one 5-unit CA eSIM inventory block, one CA subscriber whose term is purchased and whose activation is PROVISIONED with a submitted port hold."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/activations/${act_h_id}/fail"
              payload: { failure_reason: "SIM_MEDIA_FAULT" }
              as: SupportAgent
          assert:
            - "hop 1: GET /carriers/activations/${act_h_id} reports activation_status == FAILED"
            - "hop 2: GET /carriers/subscribers/${sub_h_id} reports subscriber_status == GRACE because the fail transition mutated the subscriber"
            - "hop 3: GET /carriers/prepaid-terms/${term_h_id} reports term_status == PURCHASED because the subscriber entering GRACE sent the term back"
            - "hop 4: GET /carriers/capacity-agreements/${ag_local_id}/usage-summary reports allocated_data_mb == 0 and remaining_data_mb == 16000, because PURCHASED terms do not contribute capacity"
            - "hop 5: GET /carriers/plans/${plan_h_id} reports plan_status == OFFERED because the plan no longer holds any contributing term"
            - "GET /carriers/sim-inventories/${inv_ca_id} reports reserved_count == 0 and inventory_status == AVAILABLE after the reservation was withdrawn"
            - "Postcondition on the plan: GET /carriers/plans?agreement_id=${ag_local_id} returns exactly one row"

      - name: subscriber_churn_shallow_cascade_closing_support_work
        grounds:
          - state_machines.Subscriber.ACTIVE_to_CHURNED
          - state_machines.SupportCase.RESOLVED_SELF_SERVICE or RESOLVED_AGENT_to_CLOSED
          - state_machines.AddOn.ACTIVE_to_VOIDED
          - calculations.early_churn_revenue_recognition
          - calculations.wholesale_allocated_data_mb
        distinguishing_aspect: "Depth 2 from a different trigger: cancelling an active subscriber closes every open support case for that subscriber and voids its active add-on, each of those being a consequence of the churn rather than of any direct call, and the agreement's capacity is released in the same cascade."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated CA subscriber on a 3-month H3 term at 1999 with a 30-day roaming add-on ACTIVE and two support cases, one OPEN and one ASSIGNED."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &s_complete_h2
              call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_addon
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_h_id}", addon_type: "ROAMING", addon_days: 30, per_day_allotment_mb: 500 }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { addon_id: $.data.id }
            - call: "POST /carriers/add-ons/${addon_id}/activate"
              payload: {}
              as: CapacityPlanner
            - &s_case_open
              call: "POST /carriers/support-cases"
              payload: { subscriber_id: "${sub_h_id}", topic_code: "PORT_STATUS" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { case_open_id: $.data.id }
            - &s_case_assigned
              call: "POST /carriers/support-cases"
              payload: { subscriber_id: "${sub_h_id}", topic_code: "ROAMING_SETUP" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { case_asg_id: $.data.id }
            - call: "POST /carriers/support-cases/${case_asg_id}/assign"
              payload: {}
              as: SupportAgent
            - call: "GET /carriers/subscribers/${sub_h_id}"
              payload: {}
              as: CapacityPlanner
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /carriers/subscribers/${sub_h_id}/cancel"
              payload: { expected_Subscriber_version: "${sub_v}" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
          assert:
            - "hop 1: Subscriber.${sub_h_id}.subscriber_status == CHURNED"
            - "hop 2a: SupportCase.${case_open_id}.case_status == CLOSED because the churn closed it"
            - "hop 2b: SupportCase.${case_asg_id}.case_status == CLOSED with its handling_seconds preserved at 180"
            - "hop 2c: AddOn.${addon_id}.addon_status == VOIDED and deprovisioned_msisdn == \"13055550001\""
            - "the add-on is not CANCELLED, so addon_price_cents == 0 is the void path and not the cancel path"
            - "the released capacity is visible: GET /carriers/capacity-agreements/${ag_local_id}/usage-summary reports allocated_data_mb == 0 and remaining_data_mb == 16000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: churn_on_refunded_term_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=26]
          - errors.ERR_INVALID_STATE
          - errors.ERR_TERM_ALREADY_STARTED
        distinguishing_aspect: "State (priority 6) versus business_fiscal (priority 26): cancelling an already REFUNDED term violates both the terminal-state rule and the never-started rule, and the response must carry ERR_INVALID_STATE rather than ERR_TERM_ALREADY_STARTED."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan; a subscriber holding a purchased term that has already been cancelled once, so term_status is REFUNDED."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - &s_refund_once
              call: "POST /carriers/prepaid-terms/${term_h_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
          trigger:
            - call: "POST /carriers/prepaid-terms/${term_h_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first cancel succeeded and left PrepaidTerm.${term_h_id}.term_status == REFUNDED with deferred_revenue_cents == 0"
            - "err == ERR_INVALID_STATE and the response status is 409"
            - "err != ERR_TERM_ALREADY_STARTED even though starts_at is null and the never-started fiscal rule is also violated"
            - "err != ERR_TERM_ALREADY_TERMINAL because the state rule outranks the terminal-state convenience rule at priority 6 over priority 7"
            - "the term's earned_revenue_cents is still 0 after the rejected call"

      - name: subscriber_cancel_while_port_in_flight_beats_budget_overrun
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - validations[priority=25]
          - errors.ERR_PORT_IN_FLIGHT
          - errors.ERR_SUBSCRIBER_NOT_ACTIVE
        distinguishing_aspect: "State (priority 15, subscriber must be active) versus business_safety (priority 25, no port in flight): a GRACE subscriber with a SUBMITTED port violates both, and the response must carry ERR_PORT_IN_FLIGHT because business_safety outranks the general state gate."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated-then-failed CA subscriber on a live-term-less state: activation PROVISIONED, port SUBMITTED, then the activation is failed so the subscriber sits in GRACE with the port still SUBMITTED."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &s_submit_port
              call: "POST /carriers/activations/${act_h_id}/submit-port"
              payload: { porting_msisdn: "13055550001", losing_carrier: "Cascade Wireless", account_number_last4: "4471" }
              as: Subscriber
              as_user_id: "${sub_h_id}"
          trigger:
            - call: "POST /carriers/subscribers/${sub_h_id}/cancel"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { err: $.data.error_id }
          assert:
            - "GET /carriers/subscribers/${sub_h_id} reports subscriber_status == PENDING_PORT and the activation's port_status == SUBMITTED"
            - "err == ERR_PORT_IN_FLIGHT and the response status is 409"
            - "err != ERR_SUBSCRIBER_NOT_ACTIVE even though the subscriber is not ACTIVE, because the safety rule at priority 25 outranks nothing here but the port rule is the more specific one"
            - "err != ERR_PORT_ALREADY_TERMINAL, since the port has not been terminated"
            - "after cancelling the port, cancelling the subscriber succeeds and reports CHURNED"

      - name: add_on_activation_while_suspended_priority_pair
        grounds:
          - validations[priority=6]
          - validations[priority=15]
          - validations[priority=20]
          - errors.ERR_SUBSCRIBER_NOT_ACTIVE
          - errors.ERR_INVALID_ADDON_WINDOW
        distinguishing_aspect: "State (priority 15, subscriber must be active) versus business_constraint (priority 20, add-on window must be legal): activating an add-on for a suspended subscriber with an illegal 14-day window violates both, and the response must carry ERR_SUBSCRIBER_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Activated CA subscriber on H3 who is then suspended; a 14-day roaming add-on is created directly in REQUESTED state with addon_days 14."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_suspend
              call: "POST /carriers/subscribers/${sub_h_id}/suspend"
              payload: {}
              as: SupportAgent
            - &s_addon_bad
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_h_id}", addon_type: "ROAMING", addon_days: 14, per_day_allotment_mb: 500 }
              as: Subscriber
              as_user_id: "${sub_h_id}"
              captures: { addon_bad_id: $.data.id }
          trigger:
            - call: "POST /carriers/add-ons/${addon_bad_id}/activate"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the add-on was created and reports addon_status == REQUESTED with addon_days == 14"
            - "err == ERR_SUBSCRIBER_NOT_ACTIVE and the response status is 409"
            - "err != ERR_INVALID_ADDON_WINDOW even though 14 is not one of 1, 7, 30"
            - "err != ERR_INVALID_REQUEST, because the window constraint is its own business_constraint rule rather than a malformed-body rule"
            - "the add-on is still REQUESTED with addon_price_cents == 0 after the rejection"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: deprioritization_threshold_inclusive_at_exactly_the_allotment
        grounds:
          - calculations.deprioritization_check
          - entities.Plan.fields.deprioritization_threshold_mb
          - entities.Subscriber.fields.deprioritized_this_cycle
          - endpoints.POST_/carriers/subscribers/{id}/consume_data
        distinguishing_aspect: "A numeric threshold crossing reachable through consume_data: a subscriber at 2999 megabytes is not deprioritized, at exactly 3000 megabytes is deprioritized, and the comparison is >= rather than > — the boundary megabyte is the whole test."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z."
            - "Agreement AG_LOCAL with offered H3 plan (allotment 3000), CA eSIM inventory, activated CA subscriber whose open cycle is at zero usage."
          setup_api_calls:
            - *s_clock
            - *s_ag_local
            - *s_plan_h
            - *s_plan_h_offer
            - *s_ag_local_activate
            - *s_inv_ca_esim
            - *s_sub_h
            - *s_term_h
            - *s_purch_h
            - *s_act_h
            - call: "POST /carriers/activations/${act_h_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_h_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_h_id}"
            - &s_consume_2999
              call: "POST /carriers/subscribers/${sub_h_id}/consume_data"
              payload: { data_mb: 2999 }
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/subscribers/${sub_h_id}/consume_data"
              payload: { data_mb: 1 }
              as: CapacityPlanner
          assert:
            - "after consuming 2999 megabytes, Subscriber.${sub_h_id}.deprioritized_this_cycle == false and data_used_mb_cycle == 2999"
            - "one megabyte later data_used_mb_cycle == 3000 exactly and deprioritized_this_cycle == true, so the comparison is inclusive"
            - "the threshold actually used is Plan.${plan_h_id}.deprioritization_threshold_mb == 3000, which is the derived value rather than any client-supplied number"
            - "overage_mb at exactly 3000 megabytes of usage is 0, while overage_mb at 3001 megabytes of usage is 1"
            - "deprioritized_this_cycle stays true after a further 100 megabyte consume_data call even though the flag is monotone within a cycle"

      - name: sim_inventory_aggregate_capacity_boundary
