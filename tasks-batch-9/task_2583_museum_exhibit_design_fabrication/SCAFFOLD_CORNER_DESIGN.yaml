            - "${ph1} == CLOSEOUT - the advance now succeeds even though ${pi2} is still OPEN, because only BLOCKING severity participates in the gate"
            - "${o0} == ${pi2} and ${o0sev} == MAJOR - the OPEN filter returns exactly the one remaining item"

      - name: tiered_shop_rate_and_material_rate_products_are_correct_for_known_inputs
        claim_type: correct_result
        grounds: [calculations.fabrication_cost_estimate]
        excluded_because:
          difficulty_instance: combinatorial_formula / three_enum_cross_product_selects_three_independent_constant_maps
          rationale: "Asserted as the arithmetic core of the named §1.8 instance, which pins every component of the estimate for a full cross product of complexity_tier, used_in and finish_grade."

      - name: the_complexity_tier_bands_are_each_probed_at_their_own_rate
        claim_type: tiered_pricing
        grounds: [calculations.fabrication_cost_estimate.constants]
        excluded_because:
          difficulty_instance: combinatorial_formula / three_enum_cross_product_selects_three_independent_constant_maps
          rationale: "Asserted as the constant-selection dimension of the named §1.8 instance, which drives all three SHOP_RATE tiers on otherwise identical drawings."

      - name: the_finishing_percentage_is_taken_from_the_rounded_material_subtotal
        claim_type: precision
        grounds: [calculations.fabrication_cost_estimate.precision]
        excluded_because:
          difficulty_instance: combinatorial_formula / per_line_item_rounding_order_changes_the_drawing_total
          rationale: "Asserted as the rounding-order core of the named §1.8 instance, which shows the finishing term keyed on the already-rounded material subtotal."

      - name: the_estimate_and_the_shop_actual_diverge_on_identical_geometry
        claim_type: variant_divergence
        grounds: [calculations.fabrication_cost_estimate.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / fabrication_estimate_versus_shop_actual_on_one_drawing
          rationale: "Asserted as the whole point of the named §1.8 instance, which computes both variants on one drawing row and pins the delta."

      - name: the_correct_durability_variant_is_selected_for_the_context
        claim_type: variant_selection
        grounds: [calculations.interactive_durability_index.variants]
        excluded_because:
          difficulty_instance: dual_variant_calc / durability_index_spec_versus_prototype_verified_moves_maintenance_tier
          rationale: "Asserted as the variant-selection claim of the named §1.8 instance, which shows the verified index taking over the maintenance tier once it is non-null."

      - name: the_weighted_penalty_terms_do_not_drift_when_one_input_changes
        claim_type: weighted_scoring
        grounds: [calculations.interactive_durability_index.formula]
        excluded_because:
          difficulty_instance: dual_variant_calc / verified_index_can_degrade_the_tier_and_raise_the_required_warranty
          rationale: "Asserted by the named §1.8 instance, which re-scores the same interactive after a worse prototype measurement and pins every weighted term."

      - name: the_ledger_reconciles_when_the_variant_switches_back
        claim_type: reconciliation
        grounds: [calculations.fabrication_cost_estimate.variants, entities.ExhibitProject.fields.committed_fabrication_cents]
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_an_approved_drawing_returns_every_cent_and_the_five_bucket_identity_never_drifts
          rationale: "Asserted as the delta-reversal claim of the named §1.8 instance, which voids an approved drawing and checks the five-bucket identity to the cent."

      - name: the_offgassing_thresholds_are_probed_below_at_and_above_each_limit
        claim_type: threshold
        grounds: [calculations.material_offgassing_verdict]
        excluded_because:
          difficulty_instance: boundary_precision_check / offgassing_verdict_at_the_limit_and_at_exactly_twice_the_limit
          rationale: "Asserted as the boundary sweep of the named §1.8 instance, which walks a spec across the limit and the two-times-limit branch points."

      - name: the_flow_score_threshold_is_probed_on_both_sides_of_sixty
        claim_type: threshold
        grounds: [calculations.package_flow_and_accessibility.constants]
        excluded_because:
          difficulty_instance: boundary_precision_check / flow_score_sixty_point_zero_passes_and_fifty_nine_point_four_nine_does_not
          rationale: "Asserted as the boundary sweep of the named §1.8 instance, which probes all three accessibility gates one at a time on their minimums."

      - name: buffered_intervals_that_merely_touch_do_not_conflict
        claim_type: interval_merge
