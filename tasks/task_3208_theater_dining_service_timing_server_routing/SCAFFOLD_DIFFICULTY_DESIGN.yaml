      - name: order_slip_alcohol_axis_voids_while_fulfilment_axis_advances
        grounds:
          - state_machines.OrderSlip.ACCEPTED_to_PREPARING
          - state_machines.OrderSlip.PREPARING_to_READY
          - state_machines.OrderSlip.ACCEPTED_to_VOIDED
          - entities.OrderSlip.fields.id_check_status
          - entities.OrderSlip.fields.status
          - endpoints.POST_/kitchen-tickets/{id}/verify-id
        distinguishing_aspect: |
          One row carries two dimensions that move on independent triggers: the
          fulfilment axis walks ACCEPTED -> PREPARING on the server's own action
          while the identification axis for the same row stays PENDING until
          verify-id is called, so a slip can be mid-kitchen and still unverified
          alcohol — and the fulfilment axis cannot reach DELIVERED while the other
          axis sits at PENDING.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, alcove_point_rate 3. BEVERAGE item L1 price 1500 prep 1 with is_alcoholic true. Server S1 hired into A."
