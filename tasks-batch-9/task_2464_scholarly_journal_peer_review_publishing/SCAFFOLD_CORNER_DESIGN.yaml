      - name: apc_small_residual_auto_written_off_below_min_billable
        claim_type: waterfall_allocation
        grounds:
          - calculations.apc_net_amount
          - calculations.invoice_total_with_surcharge
          - entities.APCInvoice.fields.auto_waived
        distinguishing_aspect: |
          The waterfall order and the write-off floor are both pinned: apc_base_cents 2200 under the
          CC_BY_NC_ND multiplier 0.85 rounds to base_cents 1870, the HIGH band contributes waiver 0,
          the institutional 15 percent is taken off the post-waiver remainder as round_half_up(280.5)
          = 281, so the residual 1589 is strictly between 0 and MIN_BILLABLE_CENTS 2000 and is
          written off to net 0 with auto_waived true - and that automatic write-off credits nothing
          to journal.apc_waived_cents, unlike an explicit WAIVE settlement.
