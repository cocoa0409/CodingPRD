  - section: complexity_layers
    instances:
      - name: location_version_occ_on_policy_activation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[policy-activate-stale-location]
          - errors[ERR_STALE_LOCATION_VERSION]
          - errors[ERR_POLICY_NOT_DRAFT]
          - validations.priority_11
          - validations.priority_23
          - state_machines.TipPoolPolicy
        distinguishing_aspect: >-
          Activation is the ONLY writer of Location.version, so the OCC window is exactly one
          successful activation wide: the version a caller read before the first activation is stale
          for the second, and replaying the first request verbatim is refused. The replay is refused
          by ERR_POLICY_NOT_DRAFT rather than ERR_STALE_LOCATION_VERSION, because the state check at
          priority 11 runs before the OCC check at priority 23 — the same request is stale in two
          different ways and only the earlier answer is returned.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T12:00:00Z."
            - "One Texas unit at version 1 and two DRAFT TIPPED_ONLY policies, pA and pB, both at that unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id, loc_v1: $.data.version }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "TIPS_RECEIVED_PCT", share_basis: "POINTS_ONLY", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /tip-pool-policies"
              payload: { location_id: "${loc_id}", pool_type: "TIPPED_ONLY", contribution_basis: "GROSS_SALES_PCT", share_basis: "HOURS_WEIGHTED_POINTS", cc_fee_pass_through: false }
              as: PayrollAdmin
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /tip-pool-policies/${pa_id}/activate"
              payload: { expected_location_version: "${loc_v1}" }
              as: ComplianceOfficer
            - call: "POST /tip-pool-policies/${pb_id}/activate"
              payload: { expected_location_version: "${loc_v1}" }
              as: ComplianceOfficer
              captures: { err_stale: $.data.error_id }
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { loc_v2: $.data.version }
            - call: "POST /tip-pool-policies/${pb_id}/activate"
              payload: { expected_location_version: "${loc_v2}" }
              as: ComplianceOfficer
            - call: "GET /locations/${loc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { loc_v3: $.data.version }
            - call: "POST /tip-pool-policies/${pa_id}/activate"
              payload: { expected_location_version: "${loc_v3}" }
              as: ComplianceOfficer
              captures: { err_not_draft: $.data.error_id }
          assert:
            - "the captured ${loc_v1} equals 1"
            - "trigger 1 returns HTTP 200 with status == ACTIVE and activated_at == 2026-08-10T12:00:00.000Z, and GET /locations/${loc_id} then reports version == 2: activation increments the parent by exactly 1"
            - "trigger 2 returns HTTP 412 with data.error_id == ERR_STALE_LOCATION_VERSION, the version 1 it presents having been consumed by trigger 1"
            - "after trigger 2 GET /tip-pool-policies/${pb_id} reports status == DRAFT with activated_at == null, and GET /locations/${loc_id} still reports version == 2: a 412 writes nothing, not even the parent version"
            - "the captured ${loc_v2} equals 2"
            - "trigger 4 returns HTTP 200 with status == ACTIVE, GET /tip-pool-policies/${pa_id} now reports status == SUPERSEDED, and GET /locations/${loc_id} reports version == 3"
            - "the captured ${loc_v3} equals 3"
            - "trigger 6 returns HTTP 409 with data.error_id == ERR_POLICY_NOT_DRAFT, not ERR_STALE_LOCATION_VERSION and not HTTP 200: pA is SUPERSEDED, and priority 11 answers before the OCC comparison at priority 23 even though the version presented is the current one"
            - "GET /locations/${loc_id} still reports version == 3 and GET /tip-pool-policies?location_id=${loc_id}&status=ACTIVE reports total_count == 1"

      - name: pay_line_version_occ_on_correction_issue
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[correction-create-stale-pay-line]
          - errors[ERR_STALE_PAY_LINE_VERSION]
          - validations.priority_24
          - validations.priority_37
          - entities.PayLine.fields.version
        distinguishing_aspect: >-
          PayLine.version is bumped by four different writers — compute, approve, correction issue
          and correction apply — so a compliance officer holding a version read one step ago is
          routinely stale. The OCC check at priority 24 is proven to run BEFORE the supersede rule at
          priority 37: a request that is both stale and missing its mandatory supersede pointer
          answers 412, not 422. Each 412 leaves the version untouched, so the caller's re-read
          converges instead of chasing a moving target.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T12:00:00Z."
            - "A Texas unit, a SERVER role, Ana with an acknowledged assignment, period P1 with one 480-minute CLOSED shift on 2026-08-04 declaring 15000 cash tips."
            - "op_prep_1 computes and op_comp_1 approves, leaving Ana's line FINAL with obligation 5800, gross 1704 and version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
              payload: { code: "SERVER", title: "Server", tip_status: "TIPPED", is_management: false, pool_contribution_pct_bps: 1500, pool_share_points: 10, side_work_eligible: true }
              as: PayrollAdmin
              captures: { server_role_id: $.data.id }
            - call: "POST /employees"
              payload: { location_id: "${loc_id}", full_name: "Ana Reyes", external_payroll_ref: "E1", monthly_tip_baseline_cents: 0 }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${emp_id}", job_role_id: "${server_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
            - call: "POST /pay-periods"
              payload: { location_id: "${loc_id}", start_date: "2026-08-03T00:00:00Z", end_date: "2026-08-09T00:00:00Z" }
              as: PayrollPreparer
              captures: { period_id: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${emp_id}", location_id: "${loc_id}", job_role_id: "${server_role_id}", pay_period_id: "${period_id}", business_date: "2026-08-04T00:00:00Z", start_at: "2026-08-04T16:00:00Z", end_at: "2026-08-05T00:00:00Z" }
              as: ShiftManager
              captures: { shift_id: $.data.id }
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: ShiftManager
            - call: "POST /shifts/${shift_id}/declare-tips"
              payload: { declared_cash_tips_cents: 15000, declared_charged_tips_cents: 0 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /pay-periods/${period_id}/compute"
              payload: {}
              as: PayrollPreparer
              as_user_id: "op_prep_1"
            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines?pay_period_id=${period_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { line_id: "$.data[0].id", v2: "$.data[0].version" }
          trigger:
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${line_id}", amount_cents: 400, reason_code: "SIDE_WORK_OVERAGE", expected_pay_line_version: "${v2}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_2"
              captures: { c1_id: $.data.id }
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${line_id}", amount_cents: 800, reason_code: "POOL_SHARE_SHORTFALL", expected_pay_line_version: "${v2}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_2"
              captures: { err_stale_and_unpointed: $.data.error_id }
            - call: "GET /pay-lines/${line_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { v3: $.data.version }
            - call: "POST /back-wage-corrections"
              payload: { pay_line_id: "${line_id}", supersedes_correction_id: "${c1_id}", amount_cents: 800, reason_code: "POOL_SHARE_SHORTFALL", expected_pay_line_version: "${v3}" }
              as: ComplianceOfficer
              as_user_id: "op_comp_2"
              captures: { c2_id: $.data.id }
            - call: "POST /back-wage-corrections/${c2_id}/apply"
