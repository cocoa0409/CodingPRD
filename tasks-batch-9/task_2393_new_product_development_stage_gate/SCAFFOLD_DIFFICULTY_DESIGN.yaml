  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: dev_budget_ledger_restored_after_pilot_run_cancel
        grounds:
          - calculations.committed_development_budget
          - entities.InnovationProject.fields.development_budget_committed_usd
          - state_machines.PilotRun.SCHEDULED_to_CANCELLED
          - errors.ERR_DEV_BUDGET_EXCEEDED
        distinguishing_aspect: |
          Conserved quantity: the monetary development-budget ledger. It sits at exactly the
          200000.00 cap (120000.00 scheduled run plus 80000.00 active study), refuses a further
          0.01, drops to 80000.00 when the run is cancelled, and returns to exactly 200000.00 when
          an identical run is re-booked — no cent of drift in either direction.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z."
            - "One pilot line and one BEVERAGE project with development_budget_cap_usd 200000.00."
            - "A DRAFT formulation carrying a SCHEDULED 120000.00 pilot run and an ACTIVE 80000.00 shelf-life study."
            - "The formulation version re-read after both commitments so later writes are not stale."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo Pilot", line_code: "TOL-2", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 850.00 }
              as: PortfolioAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Ledger Probe", brand: "AquaVida", category: "BEVERAGE", project_type: "NEW_BRAND", strategic_fit_score: 7, consumer_need_score: 8, target_gross_margin_pct: 32, category_attractiveness_score: 6, development_budget_cap_usd: 200000.00 }
              as: InnovationLead
              captures: { lp_id: $.data.id, lp_v1: $.data.version }
            - call: "POST /innovation-projects/${lp_id}/formulations"
              payload: { expected_project_version: "${lp_v1}", spec_summary: "Yuzu base A", allergen_regime: "NONE", target_shelf_life_days: 180, unit_cost_usd: 1.0500 }
              as: RnDLead
              captures: { lf_id: $.data.id }
            - call: "POST /formulations/${lf_id}/pilot-runs"
              payload: { pilot_line_id: "${ll_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 120000.00 }
              as: RnDLead
              captures: { lrun1_id: $.data.id }
            - call: "GET /formulations/${lf_id}"
              as: RnDLead
              captures: { lf_v2: $.data.version }
            - call: "POST /formulations/${lf_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${lf_v2}", duration_days: 30, committed_cost_usd: 80000.00, start_at: "2026-08-07T09:00:00Z" }
              as: RnDLead
              captures: { lstudy_id: $.data.id }
            - call: "GET /formulations/${lf_id}"
              as: RnDLead
              captures: { lf_v3: $.data.version }
          trigger:
            - call: "POST /formulations/${lf_id}/shelf-life-studies"
              payload: { expected_formulation_version: "${lf_v3}", duration_days: 15, committed_cost_usd: 0.01, start_at: "2026-08-08T09:00:00Z" }
              as: RnDLead
            - call: "POST /pilot-runs/${lrun1_id}/cancel"
              payload: { reason: "Line released for a customer trial" }
              as: RnDLead
            - call: "POST /formulations/${lf_id}/pilot-runs"
              payload: { pilot_line_id: "${ll_id}", window_start: "2026-08-06T08:00:00Z", window_end: "2026-08-06T16:00:00Z", planned_units: 10000, committed_cost_usd: 120000.00 }
              as: RnDLead
              captures: { lrun2_id: $.data.id }
          assert:
            - "before the trigger, InnovationProject.${lp_id}.development_budget_committed_usd == 200000.00, exactly the cap, and that write was accepted"
            - "the 0.01 study request returns 422 with error_id ERR_DEV_BUDGET_EXCEEDED"
            - "after the cancel, InnovationProject.${lp_id}.development_budget_committed_usd == 80000.00"
            - "after the re-booking, InnovationProject.${lp_id}.development_budget_committed_usd == 200000.00 again, with no drift"
            - "PilotRun.${lrun1_id}.status == CANCELLED and PilotRun.${lrun2_id}.status == SCHEDULED"
            - "ShelfLifeStudy.${lstudy_id}.status == ACTIVE with committed_cost_usd 80000.00 throughout"
            - "GET /formulations/${lf_id}/shelf-life-studies returns total_count 1, so the refused study was never stored"
            - "the re-booked run reuses the cancelled run's window without an ERR_PILOT_LINE_CONFLICT, because a CANCELLED run releases the line as well as the money"

