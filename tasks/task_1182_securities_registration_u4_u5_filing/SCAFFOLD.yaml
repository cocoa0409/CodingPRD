# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or unrecognized X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "authenticated role not in the endpoint's roles list"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path id or body FK references a non-existent entity"
  - id: ERR_DUPLICATE
    http: 409
    condition: "uniqueness constraint violated (crd_number; one invoice per request+year; one open exam window per requirement; one pending/approved affiliation per applicant+second firm)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity status does not permit the requested transition (includes terminal-state lockdown)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version (OCC)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting officer is the same user who submitted/filed the target under review"
  - id: ERR_REGULATORY_GATE
    http: 422
    condition: "approve blocked: exam not PASSED/WAIVED, no CLEARED fingerprint, or uncleared disclosure"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed field: missing required field, bad enum, min-length violation, bad jurisdiction code, window_end <= window_start"
  - id: ERR_TEMPORAL_VIOLATION
    http: 422
    condition: "future-dated event/termination, exam result outside its window, or inquiry response past due"
  - id: ERR_REFERENTIAL_VIOLATION
    http: 422
    condition: "cross-entity rule violated: same-firm dual registration, amendment without ACTIVE registration, non-SIE exam scheduled before SIE satisfied, jurisdiction added to non-editable request"
  - id: ERR_FISCAL_VIOLATION
    http: 422
    condition: "renewal invoice for non-ACTIVE registration or duplicate invoice for the cycle"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistrationPrincipal
    description: "Firm's registration desk principal; files U4/U5/amendments, manages jurisdictions, exams, fingerprints, disclosures"
    identity: "opaque"
    exclusive_operations:
      - "POST /registration-desk/applicants"
      - "POST /registration-desk/registration-requests and all its submit/withdraw/patch actions"
      - "POST /registration-desk/jurisdiction-selections and relinquish"
      - "POST /registration-desk/fingerprint-submissions"
      - "POST /registration-desk/background-disclosures"
      - "POST /registration-desk/exam-windows and cancel"
      - "POST /registration-desk/disclosure-events"
      - "POST /registration-desk/amendment-filings"
      - "POST /registration-desk/termination-filings and open/close-amendment"
      - "POST /registration-desk/affiliation-requests"
    shared_operations:
      - "GET read endpoints"
      - "POST /registration-desk/u5-comments"
  - name: ComplianceOfficer
    description: "Independent reviewer; approves/returns/denies requests, reviews disclosures, accepts/returns amendments, closes U5s, responds to inquiries; barred from acting on filings they themselves submitted (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST approve / return-deficient / deny on registration-requests"
      - "POST review on background-disclosures"
      - "POST waive on exam-requirements"
      - "POST accept / return on amendment-filings"
      - "POST close on termination-filings"
      - "POST approve / deny / revoke on affiliation-requests"
      - "POST respond on regulatory-inquiries"
    shared_operations:
      - "GET read endpoints"
      - "POST /registration-desk/u5-comments"
  - name: FinanceClerk
    description: "Firm finance operator; issues, pays, and voids renewal invoices"
    identity: "opaque"
    exclusive_operations:
      - "POST /registration-desk/renewal-invoices and pay/void"
    shared_operations:
      - "GET read endpoints including renewal-estimate"
  - name: SystemOperator
    description: "Platform operator; onboards firms, processes fingerprints, records exam results, routes/closes inquiries, drives the test clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /registration-desk/firms and PATCH"
      - "POST process on fingerprint-submissions"
      - "POST record-result on exam-windows"
      - "POST route / close on regulatory-inquiries"
      - "POST /registration-desk/_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints"
  - name: Regulator
    description: "External regulator; opens inquiries from filing content; read-only otherwise"
    identity: "opaque"
    exclusive_operations:
      - "POST /registration-desk/regulatory-inquiries"
    shared_operations:
      - "GET read endpoints"
