              as: Patient
              as_user_id: "${phf}"
            - call: "GET /catalog/carts/${carthf}"
              as: Patient
              as_user_id: "${phf}"
              captures: { carthf_v: '$.data.version' }
            - call: "POST /catalog/orders"
              payload: { cart_id: "${carthf}", fulfillment_mode: "HOME_KIT", expected_cart_version: "${carthf_v}" }
              as: Patient
              as_user_id: "${phf}"
              captures: { orderhf: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderhf}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${phf}"
            - call: "GET /catalog/order-lines?order_id=${orderhf}"
              as: CatalogAdmin
              captures: { olhf: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olhf}/collect"
              as: PhlebotomyTech
              captures: { spechf: '$.data.id' }
            - call: "POST /catalog/specimens/${spechf}/process"
              payload: { analyzer_value: 5 }
              as: LabTech
              captures: { reshf: '$.data.id' }
            - call: "POST /catalog/lab-results/${reshf}/release"
              as: LabTech
            - call: "PATCH /catalog/patients/${phf}"
              payload: { hsa_balance_cents: 0 }
              as: Patient
              as_user_id: "${phf}"
            - call: "GET /catalog/orders/${orderhf}"
              as: Patient
              as_user_id: "${phf}"
              captures: { orderhf_v: '$.data.version' }
          trigger:
