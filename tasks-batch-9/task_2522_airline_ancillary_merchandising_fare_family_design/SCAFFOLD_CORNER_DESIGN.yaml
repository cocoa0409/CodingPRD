              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          trigger:
            - call: "POST /fare-families/${f_lite_id}/submit"
              payload: {}
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_FAMILY_STATE_INVALID\""
