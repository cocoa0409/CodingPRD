      - name: overlap_plan_period_closed_interval_touching_collides
        grounds:
          - validations[priority=46]
          - state_machines.SamplePlan.DRAFT_to_OPEN.preconditions[CLOSED-interval collision]
          - entities.SamplePlan.fields.period_start
        distinguishing_aspect: |
          Deliberately the OPPOSITE interval semantics of the first instance: SamplePlan periods are
          CLOSED [start, end], so a plan starting at the exact instant another one ends collides,
          whereas the same touching arrangement was legal for evaluator windows. It is also a
          different resource axis -- the exclusion is scoped by form_id and by status IN {DRAFT,
          OPEN}, so an identical period under a different form is accepted -- and the check fires at
          plan CREATE, not only at open.
        test_recipe:
          setup:
            - "clock 2026-08-05T09:00:00Z; forms F1 and F2 both ACTIVE"
