        as: SponsorPrincipal
        as_user_id: sponsor-1
        captures:
          prop_id: $.data.id
          pv1: $.data.version
      - call: POST /trusts
        payload:
          property_id: ${prop_id}
          trust_name: DST 2423-A Cypress
          total_units: 620
          reserve_floor_cents: 5000000
          reserve_target_pct: 0.02
