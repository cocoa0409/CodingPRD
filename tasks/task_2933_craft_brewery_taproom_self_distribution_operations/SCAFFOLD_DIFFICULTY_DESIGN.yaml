              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /beers/${beer_id}/filings"
              payload: { filing_type: "LABEL", label_fields: { brand_name: "Ridgeline IPA", abv_statement: "6.8% ALC/VOL", net_contents: "15.5 GAL", health_warning: "GOVERNMENT WARNING: ACCORDING TO THE SURGEON GENERAL" } }
              as: ComplianceOfficer
            - call: "POST /beers/${beer_id}/filings/LABEL/decision"
              payload: { decision: "APPROVED", cola_id: "COLA-24-0917" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z", loss_basis: "PRO_RATA" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-DIST-1", package_type: "HALF_BBL_KEG", destination: "DISTRIBUTION", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /distribution-orders"
              payload: { beer_id: "${beer_id}", state_license_id: "${lic_id}", order_code: "SO-4001", bbl_requested: 3.00, ship_to_state_code: "ID", distance_miles: 120, requested_ship_utc: "2026-08-15T15:00:00Z" }
              as: BreweryAdmin
              captures: { order_id: $.data.id }
            - call: "POST /distribution-orders/${order_id}/allocate"
              payload: {}
              as: BreweryAdmin
          trigger:
            - call: "POST /brewery/notice"
              payload: { action: "SUSPEND", reason: "TTB audit hold on brewer's notice BR-OR-4417" }
              as: StateRegulator
          assert:
            - "Brewery.notice_status == SUSPENDED and suspension_reason == 'TTB audit hold on brewer's notice BR-OR-4417'"
            - "StateLicense.${lic_id}.status == SUSPENDED"
            - "DistributionOrder.${order_id}.state == REJECTED"
            - "DistributionOrder.${order_id}.rejection_reason == NOTICE_SUSPENDED"
            - "DistributionOrder.${order_id}.allocated_bbl == 0.000"
            - "DistributionOrder.${order_id}.allocation_lines == []"
            - "PackagingRun.${run_id}.allocated_bbl == 0.000"
            - "PackagingRun.${run_id}.available_bbl == 5.000"
            - "PackagingRun.${run_id}.shipped_bbl == 0.000"
            - "PackagingRun.${run_id}.bbl_removed == 5.000 (the cascade released the reservation without unwinding the packaging itself)"
            - "Beer.${beer_id}.taproom_sellable == false and Beer.${beer_id}.distribution_sellable == false"
            - "StateLicense.${lic_id}.barrels_shipped_ytd == 0.000"

      - name: keg_return_cascades_variance_to_outstanding_count_to_run_reconciliation
        grounds:
          - state_machines.KegAsset.TAPPED_to_EMPTY_DIRTY
          - calculations.keg_depletion_variance
          - state_machines.PackagingRun.reconciliation_state.OPEN_to_RECONCILED
          - entities.PackagingRun.fields.kegs_outstanding_count
          - entities.PackagingRun.fields.keg_shrinkage_oz
        distinguishing_aspect: |
          Chain depth 3 from a PHYSICAL cellar event rather than a regulatory one, and the hops
          carry arithmetic rather than states: RETURN -> (hop 1) this keg's depletion_variance_oz
          and shrinkage_flagged -> (hop 2) the owning run's kegs_outstanding_count falls to 0 ->
          (hop 3) reconciliation_state OPEN -> RECONCILED with keg_shrinkage_oz summed over BOTH
          sibling kegs, including the one whose own variance sat inside tolerance.
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT."
            - "Batch B-1001 conditioned at 16.000 bbl with one COMPLETED TAPROOM HALF_BBL_KEG run of 10 units."
            - "Two half-barrel kegs KEG-0001 and KEG-0002 filled from that run (1984.00 oz each); the run's reconciliation_state is OPEN with kegs_filled_count 2."
            - "KEG-0001 was tapped, poured twice at PINT_16OZ (32 oz) and RETURNED with 15.0 gal = 1920.00 oz - variance -32.00 oz against a 39.68 oz tolerance, inside tolerance, so kegs_outstanding_count is 1."
