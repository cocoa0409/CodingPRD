              as: ApCoordinator
            - call: "POST /courses"
              payload: { cycle_id: "${cyB}", subject_code: "AP_CALC_BC", program: "AP", exam_fee_cents: 9800, credit_threshold: 3 }
              as: ApCoordinator
              captures: { coB: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu B", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { sB: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${sB}", course_id: "${coB}" }
              as: Student
              as_user_id: "${sB}"
            - call: "POST /exam-orders"
              payload: { cycle_id: "${cyB}" }
              as: ApCoordinator
              captures: { ordB: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T12:00:00Z" }
              as: ApCoordinator
            - call: "POST /exam-orders/${ordA}/submit"
              as: ApCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T12:00:01Z" }
