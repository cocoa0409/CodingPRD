            - "same-codec create: Title.${t_id}.version is still ${t_ver2} (a rejected create bumps nothing)"
            - "HEVC create: HTTP status == 201 and state == QUEUED and committed_usd == 0.00"
            - "HEVC create: ${t_ver3} == ${t_ver2} + 1"
            - "AV1 create: HTTP status == 409 and error_id == ERR_REPROCESS_JOB_IN_FLIGHT"
            - "first abort: HTTP status == 200 and ReprocessJob.${j_id}.state == ABORTED and abort_reason == OPERATOR_ABORT and committed_usd == 0.00"
            - "second abort: HTTP status == 409 and error_id == ERR_JOB_STATE_INVALID"
            - "Title.${t_id}.encode_budget_remaining_usd == 5000.00 throughout"

      - name: live_reservation_referential_and_license_containment_are_rejected
