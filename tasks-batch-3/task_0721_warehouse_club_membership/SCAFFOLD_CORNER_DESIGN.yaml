  # ===========================================================================
  # SECTION: cross_cutting_complexity_layers
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_renew_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[renewal-stale-membership]'
          - 'endpoints."POST /memberships/{membershipId}/renew"'
          - 'entities.Membership.fields.version'
        distinguishing_aspect: "Renewing with expected_membership_version equal to the current version succeeds and bumps version by 1 — the OCC happy path for renewal-stale-membership."
        test_recipe:
          setup:
            - "ACTIVE BASIC member auto_renew false at version 1; clock 2026-03-01."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "OCCok Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "response code == 200"
            - "Membership.${m_id}.version == 2"

      - name: occ_renew_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[renewal-stale-membership]'
          - 'errors[ERR_STALE_MEMBERSHIP_VERSION]'
          - 'validations[priority=5]'
        distinguishing_aspect: "A second renew carrying the pre-renewal expected_membership_version (now stale because the first renew bumped version) returns ERR_STALE_MEMBERSHIP_VERSION (412)."
        test_recipe:
          setup:
            - "ACTIVE BASIC member auto_renew false at version 1; renewed once (version now 2); a second renew still carries the version-1 token."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "OCCstale Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "err == ERR_STALE_MEMBERSHIP_VERSION"

      - name: occ_cancel_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[cancel-stale-membership]'
          - 'errors[ERR_STALE_MEMBERSHIP_VERSION]'
          - 'endpoints."POST /memberships/{membershipId}/cancel"'
        distinguishing_aspect: "A cancel carrying a stale expected_membership_version (after an intervening renew bumped version) returns ERR_STALE_MEMBERSHIP_VERSION (412) — distinct write_endpoint from the renew OCC rule."
        test_recipe:
          setup:
            - "ACTIVE BASIC member auto_renew false at version 1; the client captures version 1, then a renew bumps version to 2; cancel still carries the version-1 token."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "OCCcancel Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /memberships/${m_id}/cancel"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 412"
            - "err == ERR_STALE_MEMBERSHIP_VERSION"

      - name: derived_field_fees_paid_after_signup
        claim_type: derived_field_reconciliation
        grounds:
          - 'entities.Membership.fields.fees_paid_cents'
          - 'state_machines.Membership.PENDING_PAYMENT_to_ACTIVE'
        distinguishing_aspect: "After signup activation, Membership.fees_paid_cents reconciles to the SIGNUP fee 6000 (sum of FeeEvent charges net of refunds)."
        test_recipe:
          setup:
            - "BASIC member annual_fee 6000 activated via SUCCEEDED SIGNUP payment."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Fees Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.fees_paid_cents == 6000"

      - name: rate_threshold_reward_cap_reset_on_renew
        claim_type: rate_threshold_triggers
        grounds:
          - 'state_machines.Membership.ACTIVE_to_ACTIVE'
          - 'entities.Membership.fields.reward_accrued_cents'
          - 'entities.RewardLedgerEntry.fields.entry_type'
        distinguishing_aspect: "Renewing resets the per-term reward cap baseline: reward_accrued_cents returns to 0 for the new term and an EXPIRY ledger entry zeroes the prior-term unredeemed reward."
        test_recipe:
          setup:
            - "EXECUTIVE ACTIVE member cap 100000 with 800 accrued reward (FINALIZED txn qty 5); clock 2026-03-01; then renewed."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-RESET", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Reset Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Membership.${m_id}.reward_accrued_cents == 0"
            - "reward-ledger for ${m_id} includes one EXPIRY entry"

      - name: cascade_signup_creates_feeevent
        claim_type: cascading_side_effects
        grounds:
          - 'state_machines.Membership.PENDING_PAYMENT_to_ACTIVE'
          - 'entities.FeeEvent.fields.kind'
        distinguishing_aspect: "Signup activation cascades a single FeeEvent kind=SIGNUP for the membership; verified via the FK reverse-reachability GET /fee-events."
        test_recipe:
          setup:
            - "BASIC member activated via SUCCEEDED SIGNUP payment."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "FeeCasc Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "GET /fee-events"
              payload: { membership_id: "${m_id}", kind: "SIGNUP" }
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "total_count == 1"
            - "result data[0].amount_cents == 6000"

  # ===========================================================================
  # SECTION: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_totals_visible_in_same_response
        claim_type: immediate
        grounds:
          - 'complexity_profile.consistency_model'
          - 'entities.Transaction.fields.net_cents'
          - 'state_machines.Transaction.OPEN_to_OPEN'
        distinguishing_aspect: "consistency_model is immediate: the line-add response's owning transaction reflects the updated net_cents in the same request cycle (re-read shows the same value)."
        test_recipe:
          setup:
            - "BASIC ACTIVE member; product member 8000, no discounts; OPEN transaction."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-IMM", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "Imm Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 2 }
              as: RegisterClerk
          trigger:
            - call: "GET /transactions/${txn_id}"
              payload: {}
              as: RegisterClerk
          assert:
            - "Transaction.${txn_id}.gross_cents == 16000"
            - "Transaction.${txn_id}.net_cents == 16000"
