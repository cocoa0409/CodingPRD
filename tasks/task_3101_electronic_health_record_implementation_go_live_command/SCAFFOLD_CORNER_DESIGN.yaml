# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3101_electronic_health_record_implementation_go_live_command
# EHR Implementation & Go-Live Command Center
#
# Breadth probe: every testable claim the §1.1-§1.7 surface declares that §1.8
# does not exercise. Corners already covered by §1.8 appear as excluded_because
# stubs with no test_recipe. section/claim_type values come from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: c_ehr_implementation_create_returns_all_declared_fields_and_planning
        claim_type: Creation
        grounds:
          - entities.EhrImplementation
          - endpoints.POST_/ehr-implementations
          - response_envelope.success
        distinguishing_aspect: "A program created with the three required inputs returns 201 with status PLANNING, readiness_posture OPEN, current_epoch_index 0, version 1, and non-null system id / created_at / updated_at, and an api_request_id in meta."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - &c_clk
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImplementationDirector
          trigger:
            - &c_prog
              call: "POST /ehr-implementations"
              payload: { program_name: "Cascade Valley EHR", vendor_release: "2026.2", go_live_target_utc: "2026-12-01T00:00:00Z" }
              as: ImplementationDirector
              captures: { prog_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "EhrImplementation.${prog_id}.status == PLANNING and readiness_posture == OPEN"
            - "EhrImplementation.${prog_id}.current_epoch_index == 0 and version == 1"
            - "the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: c_facility_get_with_unknown_id_returns_facility_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/facilities/{id}
          - errors[ERR_FACILITY_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "A syntactically valid but unallocated id on the facility path returns the entity-specific 404 ERR_FACILITY_NOT_FOUND rather than a generic error or a 400."
        test_recipe:
          setup:
            - "Logical clock at the default 2026-09-01T00:00:00Z; no facility exists."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "GET /facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ImplementationDirector
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_FACILITY_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: c_staff_create_missing_required_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Staff.fields.full_name
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "full_name is a required input with no default, so omitting it is a required-field failure at priority 7 producing 400 ERR_INVALID_REQUEST, and no Staff row is created."
        test_recipe:
          setup:
            - "A program, facility and department exist."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - &c_fac
              call: "POST /ehr-implementations/${prog_id}/facilities"
              payload: { name: "Cascade Valley Memorial", facility_type: "ACUTE_CARE", bed_count: 180, rollout_wave: 1, conversion_scope: "FULL_RECORD" }
              as: ImplementationDirector
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - &c_dept
              call: "POST /facilities/${fac_id}/departments"
              payload: { department_code: "LAB", application_scope: ["LAB"], required_staff_count: 10 }
              as: BuildAnalyst
              captures: { dept_id: $.data.id }
          trigger:
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-01T00:00:00Z" }
              as: TrainingCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /staffs?department_id=${dept_id} returns 0 rows"

      - name: c_patient_order_create_defaults_billing_and_clinical_states
        claim_type: Defaults
        grounds:
          - entities.PatientOrder.fields.billing_state
          - entities.PatientOrder.fields.paper_backfill_count
          - entities.PatientOrder.fields.balance_cents
          - calculations.charge_capture_reconciliation
        distinguishing_aspect: "A converted MEDICATION order is created with billing_state UNPOSTED, clinical_state CONVERTED, paper_backfill_count 0 and balance_cents 0 while the provisional charge is computed to 25750.00 — the client supplies none of the state fields."
        test_recipe:
          setup:
            - "A program and facility exist."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
          trigger:
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-8001", order_type: "MEDICATION", encounter_utc: "2026-08-30T00:00:00Z", legacy_charge_cents: 25000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
          assert:
            - "the response status is 201"
            - "PatientOrder.${order_id}.billing_state == UNPOSTED and clinical_state == CONVERTED"
            - "PatientOrder.${order_id}.paper_backfill_count == 0 and balance_cents == 0"
            - "PatientOrder.${order_id}.provisional_charge_cents == 25750.00"

      - name: c_build_item_create_out_of_enum_classification_rejected
        claim_type: Type Constraints
        grounds:
          - entities.SystemBuildItem.fields.build_classification
          - validations[priority=7]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "build_classification is a closed enum of exactly FOUNDATION_ADOPTED, FOUNDATION_ADAPTED and LOCAL_CUSTOM; any other value is rejected at priority 7 with 400 ERR_INVALID_REQUEST and no build item is persisted."
        test_recipe:
          setup:
            - "A program, facility and department exist."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
          trigger:
            - call: "POST /departments/${dept_id}/system-build-items"
              payload: { application_code: "LAB", build_classification: "FULL_LOCAL_COPY", customization_depth: 1, local_custom_fields: [] }
              as: BuildAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /departments/${dept_id}/system-build-items returns 0 rows"

      - name: c_interface_message_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds:
          - entities.InterfaceMessage
          - endpoints.GET_/interface-messages/{id}
        distinguishing_aspect: "InterfaceMessage declares common_fields: false, so its read payload carries id and received_utc but no version and no updated_at fields, and no endpoint mutates anything but validation_status."
        test_recipe:
          setup:
            - "A program with one LAB channel under message validation and one received message."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - call: "POST /ehr-implementations/${prog_id}/interface-channels"
              payload: { channel_type: "LAB", external_system: "Sysmex", message_format: "HL7_V2", throughput_per_hour: 500, max_latency_minutes: 5 }
              as: InterfaceEngineer
              captures: { ch_id: $.data.id }
            - call: "POST /interface-channels/${ch_id}/begin-build"
              payload: {}
              as: InterfaceEngineer
            - call: "POST /interface-channels/${ch_id}/messages"
              payload: { message_code: "ORU_R01", direction: "INBOUND", sent_utc: "2026-09-01T00:00:00Z" }
              as: InterfaceEngineer
              captures: { msg_id: $.data.id }
          trigger:
            - call: "GET /interface-messages/${msg_id}"
              payload: {}
              as: InterfaceEngineer
              captures: { status: $.data.validation_status }
          assert:
            - "InterfaceMessage.${msg_id}.validation_status == RECEIVED"
            - "the response data has no `version` field (the entity declares common_fields: false)"
            - "the response data has no `updated_at` field"
            - "InterfaceMessage.${msg_id}.received_utc is server-stamped and equals the logical clock 2026-09-01T00:00:00Z"

      - name: c_build_item_create_with_unknown_department_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.SystemBuildItem.fields.department_id
          - validations[priority=6]
          - errors[ERR_DEPARTMENT_NOT_FOUND]
        distinguishing_aspect: "Because the department is the parent in the path, an unallocated department id resolves to 404 ERR_DEPARTMENT_NOT_FOUND before any body field is examined."
        test_recipe:
          setup:
            - "Logical clock at the default."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "POST /departments/00000000-0000-4000-8000-000000000000/system-build-items"
              payload: { application_code: "LAB", build_classification: "LOCAL_CUSTOM", customization_depth: 2, local_custom_fields: ["CF01"] }
              as: BuildAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_DEPARTMENT_NOT_FOUND"
            - "GET /system-build-items returns 0 rows"

      - name: c_command_center_tickets_list_paginates_with_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/command-center-tickets
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three tickets on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "A program and facility with three command-center tickets."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - call: "POST /command-center-tickets"
              payload: { facility_id: "${fac_id}", target_ref: "${fac_id}", severity: "SEV3", at_the_elbow_zone: "ED" }
              as: CommandCenterLead
            - call: "POST /command-center-tickets"
              payload: { facility_id: "${fac_id}", target_ref: "${fac_id}", severity: "SEV4", at_the_elbow_zone: "PHARMACY" }
              as: CommandCenterLead
            - call: "POST /command-center-tickets"
              payload: { facility_id: "${fac_id}", target_ref: "${fac_id}", severity: "SEV2", at_the_elbow_zone: "ICU" }
              as: CommandCenterLead
          trigger:
            - call: "GET /command-center-tickets"
              payload: { ehr_implementation_id: "${prog_id}", facility_id: "${fac_id}", limit: 2, offset: 0 }
              as: CommandCenterLead
              captures: { n_first: $.data }
          assert:
            - "the response status is 200 and response_type is array"
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /command-center-tickets?facility_id=${fac_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /command-center-tickets?facility_id=${fac_id}&severity=SEV3 returns exactly 1 row"
            - "GET /command-center-tickets with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: c_new_department_starts_build_pending_with_closed_gate
        claim_type: Initial State
        grounds:
          - state_machines.Department.initial_state
          - entities.Department.fields.status
          - entities.Department.fields.proficiency_gate_open
        distinguishing_aspect: "A freshly created department starts BUILD_PENDING with proficiency_cleared_count 0, proficiency_cleared_ratio 0.00 and proficiency_gate_open false — the client supplies none of the state fields."
        test_recipe:
          setup:
            - "A program and facility exist."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
          trigger:
            - call: "POST /facilities/${fac_id}/departments"
              payload: { department_code: "ED", application_scope: ["ED"], required_staff_count: 8 }
              as: BuildAnalyst
              captures: { dept_new: $.data.id }
          assert:
            - "the response status is 201"
            - "Department.${dept_new}.status == BUILD_PENDING"
            - "Department.${dept_new}.proficiency_cleared_count == 0 and proficiency_cleared_ratio == 0.00"
            - "Department.${dept_new}.proficiency_gate_open == false and build_blocking_defect_count == 0"

      - name: c_facility_mark_validated_from_site_registered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Facility.SITE_REGISTERED_to_BUILD_CONFIGURED
          - state_machines.Facility.BUILD_CONFIGURED_to_VALIDATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "mark-validated is legal only from BUILD_CONFIGURED; a facility still in SITE_REGISTERED rejects it with 409 ERR_INVALID_STATE and stays SITE_REGISTERED."
        test_recipe:
          setup:
            - "A program and one facility in SITE_REGISTERED."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
          trigger:
            - call: "POST /facilities/${fac_id}/mark-validated"
              payload: {}
              as: ImplementationDirector
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Facility.${fac_id}.status == SITE_REGISTERED"

      - name: c_revoked_trainer_is_terminal_and_cannot_be_recertified
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CredentialedTrainer.CERTIFIED_to_REVOKED
          - state_machines.CredentialedTrainer.EXPIRED_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REVOKED is a terminal state; recertify is legal only from EXPIRED, so a revoked trainer record rejects recertify with 409 ERR_INVALID_STATE and stays REVOKED."
        test_recipe:
          setup:
            - "A program with one staffer whose trainer record has been certified then revoked."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Omar Haddad", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-10T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /credentialed-trainers/${tr_id}/certify"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /credentialed-trainers/${tr_id}/revoke"
              payload: {}
              as: TrainingCoordinator
              captures: { tr_state: $.data.status }
          trigger:
            - call: "POST /credentialed-trainers/${tr_id}/recertify"
              payload: {}
              as: TrainingCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "CredentialedTrainer.${tr_id}.status == REVOKED before the recertify attempt"
            - "the recertify returns 409 and error_id == ERR_INVALID_STATE"
            - "CredentialedTrainer.${tr_id}.status is still REVOKED"

      - name: c_second_resolve_on_resolved_defect_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.TestDefect.IN_REMEDIATION_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "resolve is legal only from IN_REMEDIATION; replaying the same resolve after the defect is already RESOLVED returns 409 ERR_INVALID_STATE and fires no side effects a second time."
        test_recipe:
          setup:
            - "A failing build item with one SEV3 defect already resolved."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - &c_item
              call: "POST /departments/${dept_id}/system-build-items"
              payload: { application_code: "LAB", build_classification: "FOUNDATION_ADOPTED", customization_depth: 1, local_custom_fields: [] }
              as: BuildAnalyst
              captures: { item_id: $.data.id }
            - &c_scen
              call: "POST /system-build-items/${item_id}/test-scenarios"
              payload: { scenario_class: "UNIT", step_count: 6 }
              as: TestLead
              captures: { scen_id: $.data.id }
            - &c_sb
              call: "POST /system-build-items/${item_id}/start-build"
              payload: {}
              as: BuildAnalyst
            - &c_cb
              call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
            - &c_st
              call: "POST /system-build-items/${item_id}/start-testing"
              payload: {}
              as: TestLead
            - &c_execfail
              call: "POST /test-scenarios/${scen_id}/execute"
              payload: { outcome: "FAIL", executed_epoch: 0 }
              as: TestLead
            - &c_defect
              call: "POST /test-scenarios/${scen_id}/record-defect"
              payload: { defect_code: "LBL-5001", severity: "SEV3" }
              as: TestLead
              captures: { defect_id: $.data.id }
            - call: "POST /test-defects/${defect_id}/begin-remediation"
              payload: {}
              as: BuildAnalyst
            - call: "POST /test-defects/${defect_id}/resolve"
              payload: {}
              as: BuildAnalyst
              captures: { res_epoch: $.data.resolution_epoch }
          trigger:
            - call: "POST /test-defects/${defect_id}/resolve"
              payload: {}
              as: BuildAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "TestDefect.${defect_id}.status == RESOLVED before the replay"
            - "the replay returns 409 and error_id == ERR_INVALID_STATE"
            - "TestDefect.${defect_id}.status is still RESOLVED and resolution_epoch is unchanged"

      - name: c_complete_validation_without_passed_scenario_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SystemBuildItem.IN_TESTING_to_VALIDATION_COMPLETE
          - state_machines.TestScenario.DEFINED_to_PASSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "complete-validation requires test_cycles_passed >= 1; a build item in IN_TESTING whose only scenario is still DEFINED rejects the call with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A build item in IN_TESTING with one scenario that has never executed."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - *c_item
            - *c_scen
            - *c_sb
            - *c_cb
            - *c_st
          trigger:
            - call: "POST /system-build-items/${item_id}/complete-validation"
              payload: {}
              as: TestLead
              captures: { error_id: $.data.error_id }
          assert:
            - "SystemBuildItem.${item_id}.test_cycles_passed == 0 and status == IN_TESTING"
            - "the complete-validation returns 409 and error_id == ERR_INVALID_STATE"
            - "after POST /test-scenarios/${scen_id}/execute with outcome PASS and executed_epoch 0, complete-validation returns 200 and status == VALIDATION_COMPLETE"

  # ===========================================================================
  - section: calculations
    instances:

      - name: c_revenue_cycle_index_tracks_denial_and_recovery
        claim_type: Correct Result
        grounds:
          - calculations.revenue_cycle_stabilization_index
          - state_machines.Facility.LIVE_to_STABILIZATION_AT_RISK
          - state_machines.PatientOrder.CLAIM_SUBMITTED_to_CLAIM_DENIED
        distinguishing_aspect: "With an encounter three days before the clock the AR factor is 100; a denial makes denial_factor 0 so the index reads 60.00 exactly, and reopening the claim removes the denial so it returns to 100.00."
        test_recipe:
          setup:
            - "A program and facility with one order reconciled, charged and claim-submitted."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-8100", order_type: "LAB", encounter_utc: "2026-08-29T00:00:00Z", legacy_charge_cents: 10000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
            - call: "POST /patient-orders/${order_id}/reconcile"
              payload: {}
              as: OrderReconciler
            - call: "POST /patient-orders/${order_id}/post-charge"
              payload: {}
              as: RevenueCycleAnalyst
            - call: "POST /patient-orders/${order_id}/submit-claim"
              payload: {}
              as: RevenueCycleAnalyst
          trigger:
            - call: "POST /patient-orders/${order_id}/record-claim-response"
              payload: { claim_response: "DENIED" }
              as: RevenueCycleAnalyst
              captures: { idx_denied: $.data.billing_state }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { idx_after_denial: $.data.revenue_cycle_stabilization_index }
            - call: "POST /patient-orders/${order_id}/reopen-claim"
              payload: {}
              as: RevenueCycleAnalyst
              captures: { reopened_bill: $.data.billing_state }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { idx_after_reopen: $.data.revenue_cycle_stabilization_index }
          assert:
            - "after the denial PatientOrder.${order_id}.billing_state == CLAIM_DENIED"
            - "after the denial Facility.${fac_id}.revenue_cycle_stabilization_index == 60.00"
            - "after reopen-claim PatientOrder.${order_id}.billing_state == CHARGE_POSTED"
            - "after reopen-claim Facility.${fac_id}.revenue_cycle_stabilization_index == 100.00"

      - name: c_test_cycle_count_filters_to_current_epoch
        claim_type: Input Set Filtering
        grounds:
          - calculations.test_validation_sweep
          - entities.TestScenario.fields.executed_epoch
          - endpoints.POST_/ehr-implementations/{id}/advance-epoch
        distinguishing_aspect: "test_cycles_passed counts only TestScenario rows whose executed_epoch equals the program's current_epoch_index, so a PASSED scenario from epoch 0 stops counting once the program advances to epoch 1."
        test_recipe:
          setup:
            - "A build item in IN_TESTING with one scenario passed at epoch 0."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - *c_item
            - *c_scen
            - *c_sb
            - *c_cb
            - *c_st
            - call: "POST /test-scenarios/${scen_id}/execute"
              payload: { outcome: "PASS", executed_epoch: 0 }
              as: TestLead
          trigger:
            - call: "GET /system-build-items/${item_id}"
              payload: {}
              as: TestLead
              captures: { cycles_epoch0: $.data.test_cycles_passed }
            - call: "POST /ehr-implementations/${prog_id}/advance-epoch"
              payload: {}
              as: ImplementationDirector
              captures: { epoch: $.data.current_epoch_index }
            - call: "GET /system-build-items/${item_id}"
              payload: {}
              as: TestLead
              captures: { cycles_epoch1: $.data.test_cycles_passed }
          assert:
            - "SystemBuildItem.${item_id}.test_cycles_passed == 1 at epoch 0"
            - "after advance-epoch the program current_epoch_index == 1"
            - "SystemBuildItem.${item_id}.test_cycles_passed == 0 at epoch 1 (the epoch-0 pass no longer counts)"
            - "TestScenario.${scen_id}.status is still PASSED and executed_epoch == 0"

      - name: c_customization_risk_variant_divergence_is_covered_by_difficulty_design
        claim_type: Variant Divergence
        grounds:
          - calculations.build_customization_risk
          - calculations.build_customization_risk.variants.summed_then_rounded
        excluded_because:
          difficulty_instance: r2_customization_risk_tiered_marginal_allocation_at_unit_cap
          rationale: "The tiered risk score, its single rounding point and the summed-then-rounded batch variant are exercised end-to-end by that §1.8 instance; a second corner asserting the same value adds no coverage."

  # ===========================================================================
  - section: validations
    instances:

      - name: c_sev1_defect_cannot_be_deferred
        claim_type: Violation -> Error
        grounds:
          - validations[priority=21]
          - errors[ERR_DEFECT_SEVERITY_NOT_DEFERRABLE]
          - endpoints.POST_/test-defects/{id}/defer
        distinguishing_aspect: "A defect in IN_REMEDIATION whose severity is SEV1 is refused deferral with 422 ERR_DEFECT_SEVERITY_NOT_DEFERRABLE; only SEV3 and SEV4 may be deferred, and the defect stays IN_REMEDIATION."
        test_recipe:
          setup:
            - "A build item driven into BUILD_REJECTED by a SEV1 defect, with the defect in IN_REMEDIATION."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - *c_item
            - *c_scen
            - *c_sb
            - *c_cb
            - *c_st
            - *c_execfail
            - call: "POST /test-scenarios/${scen_id}/record-defect"
              payload: { defect_code: "LBL-6001", severity: "SEV1" }
              as: TestLead
              captures: { defect_id: $.data.id }
            - call: "POST /test-defects/${defect_id}/begin-remediation"
              payload: {}
              as: BuildAnalyst
              captures: { pre_state: $.data.status }
          trigger:
            - call: "POST /test-defects/${defect_id}/defer"
              payload: {}
              as: TestLead
              captures: { error_id: $.data.error_id }
          assert:
            - "TestDefect.${defect_id}.status == IN_REMEDIATION before the defer attempt"
            - "the defer returns 422 and error_id == ERR_DEFECT_SEVERITY_NOT_DEFERRABLE"
            - "TestDefect.${defect_id}.status is still IN_REMEDIATION"

      - name: c_deferring_sev4_defect_succeeds
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=21]
          - state_machines.TestDefect.IN_REMEDIATION_to_DEFERRED
          - endpoints.POST_/test-defects/{id}/defer
        distinguishing_aspect: "The same defer endpoint accepts a SEV4 defect from IN_REMEDIATION with 200 and status DEFERRED, so the priority-21 rule gates on severity rather than blocking all deferrals."
        test_recipe:
          setup:
            - "A build item whose scenario failed with a SEV4 defect, the defect in IN_REMEDIATION."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - *c_item
            - *c_scen
            - *c_sb
            - *c_cb
            - *c_st
            - *c_execfail
            - call: "POST /test-scenarios/${scen_id}/record-defect"
              payload: { defect_code: "LBL-6002", severity: "SEV4" }
              as: TestLead
              captures: { defect_id: $.data.id }
            - call: "POST /test-defects/${defect_id}/begin-remediation"
              payload: {}
              as: BuildAnalyst
          trigger:
            - call: "POST /test-defects/${defect_id}/defer"
              payload: {}
              as: TestLead
              captures: { status: $.data.status }
          assert:
            - "the defer returns 200 and TestDefect.${defect_id}.status == DEFERRED"
            - "TestDefect.${defect_id}.blocks_go_live == false"

      - name: c_retest_before_cooldown_returns_retest_cooldown_active
        claim_type: Violation -> Error
        grounds:
          - validations[priority=18]
          - errors[ERR_RETEST_COOLDOWN_ACTIVE]
          - state_machines.ProficiencyExam.SCHEDULED_to_COMPLETED_FAIL
        distinguishing_aspect: "After a failed exam sets next_attempt_eligible_utc 24 hours ahead, recording the next attempt before the logical clock reaches it is refused with 409 ERR_RETEST_COOLDOWN_ACTIVE while the second exam stays SCHEDULED."
        test_recipe:
          setup:
            - "A program, facility, department and staffer; a certified trainer; a first exam failed at the 2026-09-01 clock, then a second exam scheduled."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Bianca Reyes", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-15T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /credentialed-trainers/${tr_id}/certify"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /staffs/${staff_id}/proficiency-exams"
              payload: { application_code: "CLN", proctored_by_trainer_id: "${tr_id}" }
              as: TrainingCoordinator
              captures: { exam1: $.data.id }
            - call: "POST /proficiency-exams/${exam1}/record-result"
              payload: { exam_score: 55 }
              as: CredentialedTrainer
              as_user_id: "${tr_id}"
              captures: { cooldown_until: $.data.next_attempt_eligible_utc }
            - call: "POST /staffs/${staff_id}/proficiency-exams"
              payload: { application_code: "CLN", proctored_by_trainer_id: "${tr_id}" }
              as: TrainingCoordinator
              captures: { exam2: $.data.id }
          trigger:
            - call: "POST /proficiency-exams/${exam2}/record-result"
              payload: { exam_score: 90 }
              as: CredentialedTrainer
              as_user_id: "${tr_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /proficiency-exams/${exam2}"
              payload: {}
              as: TrainingCoordinator
              captures: { exam2_state: $.data.status }
          assert:
            - "the clock is 2026-09-01, strictly before next_attempt_eligible_utc ${cooldown_until}"
            - "the record-result returns 409 and error_id == ERR_RETEST_COOLDOWN_ACTIVE"
            - "ProficiencyExam.${exam2}.status is still SCHEDULED"
            - "after advancing the clock to ${cooldown_until} the same record-result succeeds with status COMPLETED_PASS"

      - name: c_trainer_observation_below_floor_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=22]
          - errors[ERR_TRAINER_OBSERVATION_INSUFFICIENT]
          - endpoints.POST_/credentialed-trainers/{id}/certify
        distinguishing_aspect: "A trainer record created with 3 observation hours cannot be certified against the STANDARD floor of 8 hours: certify returns 422 ERR_TRAINER_OBSERVATION_INSUFFICIENT and the record stays PENDING_OBSERVATION."
        test_recipe:
          setup:
            - "A program, facility, department and staffer with a trainer record carrying 3 observation hours."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Dana Whitfield", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-16T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 3, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /credentialed-trainers/${tr_id}/certify"
              payload: {}
              as: TrainingCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the certify returns 422 and error_id == ERR_TRAINER_OBSERVATION_INSUFFICIENT"
            - "CredentialedTrainer.${tr_id}.status is still PENDING_OBSERVATION"

      - name: c_local_custom_build_over_risk_limit_blocks_validation
        claim_type: Aggregation / Conditional
        grounds:
          - validations[priority=15]
          - errors[ERR_CUSTOMIZATION_LIMIT_EXCEEDED]
          - calculations.build_customization_risk
        distinguishing_aspect: "A LOCAL_CUSTOM build item whose computed customization_risk_points reach 92.00 exceeds the 40.00 local-custom limit, so complete-validation returns 422 ERR_CUSTOMIZATION_LIMIT_EXCEEDED even though its scenario passed."
        test_recipe:
          setup:
            - "A LOCAL_CUSTOM build item with 12 customized fields and depth 2 in IN_TESTING with one passed scenario."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /departments/${dept_id}/system-build-items"
              payload: { application_code: "LAB", build_classification: "LOCAL_CUSTOM", customization_depth: 2, local_custom_fields: ["CF01", "CF02", "CF03", "CF04", "CF05", "CF06", "CF07", "CF08", "CF09", "CF10", "CF11", "CF12"] }
              as: BuildAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /system-build-items/${item_id}/test-scenarios"
              payload: { scenario_class: "UNIT", step_count: 6 }
              as: TestLead
              captures: { scen_id: $.data.id }
            - call: "POST /system-build-items/${item_id}/start-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
              captures: { risk: $.data.customization_risk_points }
            - call: "POST /system-build-items/${item_id}/start-testing"
              payload: {}
              as: TestLead
            - call: "POST /test-scenarios/${scen_id}/execute"
              payload: { outcome: "PASS", executed_epoch: 0 }
              as: TestLead
          trigger:
            - call: "POST /system-build-items/${item_id}/complete-validation"
              payload: {}
              as: TestLead
              captures: { error_id: $.data.error_id }
          assert:
            - "SystemBuildItem.${item_id}.customization_risk_points == 92.00 and test_cycles_passed == 1"
            - "the complete-validation returns 422 and error_id == ERR_CUSTOMIZATION_LIMIT_EXCEEDED"
            - "SystemBuildItem.${item_id}.status is still IN_TESTING"

      - name: c_completing_assignment_below_required_hours_returns_422
        claim_type: Violation -> Error
        grounds:
          - validations[priority=31]
          - errors[ERR_TRAINING_HOURS_INSUFFICIENT]
          - endpoints.POST_/training-assignments/{id}/complete
        distinguishing_aspect: "An assignment with 20 of 40 required hours logged is IN_PROGRESS but cannot be completed: the call returns 422 ERR_TRAINING_HOURS_INSUFFICIENT and the assignment stays IN_PROGRESS."
        test_recipe:
          setup:
            - "A staffer with a CLN100 assignment logged at 20 of 40 hours."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Elias Moreau", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-17T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id }
            - call: "POST /staffs/${staff_id}/training-assignments"
              payload: { curriculum_code: "CLN100", application_code: "CLN", required_hours: 40, due_utc: "2026-10-01T00:00:00Z" }
              as: TrainingCoordinator
              captures: { ta_id: $.data.id }
            - call: "POST /training-assignments/${ta_id}/log-hours"
              payload: { hours: 20 }
              as: TrainingCoordinator
              captures: { ta_state: $.data.status, ta_pct: $.data.completion_pct }
          trigger:
            - call: "POST /training-assignments/${ta_id}/complete"
              payload: {}
              as: TrainingCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "TrainingAssignment.${ta_id}.status == IN_PROGRESS and completion_pct == 50.00"
            - "the complete returns 422 and error_id == ERR_TRAINING_HOURS_INSUFFICIENT"
            - "after logging a further 20 hours the complete returns 200 and status == COMPLETED"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: c_conversion_batch_rollback_reverses_patient_count
        claim_type: Compensation
        grounds:
          - state_machines.DataConversionBatch.LOADED_to_ROLLED_BACK
          - endpoints.POST_/data-conversion-batches/{id}/rollback
          - entities.Facility.fields.converted_patient_count
        distinguishing_aspect: "Loading a 990-row PATIENT_DEMOGRAPHICS batch raises Facility.converted_patient_count to 990; rollback returns it to 0, so the load and its compensating rollback net to the pre-load count."
        test_recipe:
          setup:
            - "A program and a facility with a staged 1000/990 PATIENT_DEMOGRAPHICS batch."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - call: "POST /facilities/${fac_id}/data-conversion-batches"
              payload: { payload_class: "PATIENT_DEMOGRAPHICS", attempt_epoch: 0, source_count: 1000, reconciled_count: 990, expected_facility_version: "${fac_v0}" }
              as: ConversionAnalyst
              captures: { batch_id: $.data.id }
            - call: "POST /data-conversion-batches/${batch_id}/begin-validation"
              payload: {}
              as: ConversionAnalyst
            - call: "POST /data-conversion-batches/${batch_id}/load"
              payload: {}
              as: ConversionAnalyst
              captures: { loaded_state: $.data.status }
          trigger:
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { count_loaded: $.data.converted_patient_count }
            - call: "POST /data-conversion-batches/${batch_id}/rollback"
              payload: {}
              as: ConversionAnalyst
              captures: { rolled_state: $.data.status }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { count_rolled: $.data.converted_patient_count }
          assert:
            - "DataConversionBatch.${batch_id}.status == LOADED before rollback"
            - "Facility.${fac_id}.converted_patient_count == 990 after the load"
            - "DataConversionBatch.${batch_id}.status == ROLLED_BACK"
            - "Facility.${fac_id}.converted_patient_count == 0 after the rollback"

      - name: c_optimization_waterfall_overflows_large_item_to_next_epoch
        claim_type: Bulk action
        grounds:
          - calculations.optimization_release_allocation
          - state_machines.OptimizationBacklogItem.TRIAGED_to_SCHEDULED
          - errors[ERR_RELEASE_CAPACITY_EXCEEDED]
        distinguishing_aspect: "With 30 capacity points already consumed for epoch 1, scheduling an 8-point item sets scheduled_epoch to 2 (watershed overflow) rather than failing; the same epoch-1 target for a 5-point item is likewise scheduled at 2, and no rounding remainder is lost."
        test_recipe:
          setup:
            - "A program, facility and department; the program at epoch 1 (advanced from 0)."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/advance-epoch"
              payload: {}
              as: ImplementationDirector
              captures: { prog_v_after: $.data.version }
            - call: "POST /optimization-backlog-items"
              payload: { department_id: "${dept_id}", title: "Big release", effort_points: 30, expected_ehr_implementation_version: "${prog_v_after}" }
              as: OptimizationLead
              captures: { big_id: $.data.id }
            - call: "POST /optimization-backlog-items/${big_id}/triage"
              payload: {}
              as: OptimizationLead
            - call: "POST /optimization-backlog-items/${big_id}/schedule"
              payload: { target_epoch: 1 }
              as: OptimizationLead
              captures: { big_sched: $.data.scheduled_epoch }
          trigger:
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { prog_v2: $.data.version }
            - call: "POST /optimization-backlog-items"
              payload: { department_id: "${dept_id}", title: "Small release", effort_points: 8, expected_ehr_implementation_version: "${prog_v2}" }
              as: OptimizationLead
              captures: { small_id: $.data.id }
            - call: "POST /optimization-backlog-items/${small_id}/triage"
              payload: {}
              as: OptimizationLead
            - call: "POST /optimization-backlog-items/${small_id}/schedule"
              payload: { target_epoch: 1 }
              as: OptimizationLead
              captures: { small_sched: $.data.scheduled_epoch, small_state: $.data.status }
          assert:
            - "OptimizationBacklogItem.${big_id}.scheduled_epoch == 1 (it exactly consumes the 30-point capacity)"
            - "OptimizationBacklogItem.${small_id}.scheduled_epoch == 2 (the 8-point item overflows epoch 1)"
            - "OptimizationBacklogItem.${small_id}.status == SCHEDULED"
            - "no ERR_RELEASE_CAPACITY_EXCEEDED is raised — the allocator overflows rather than rejecting"

      - name: c_finalize_validation_blocked_by_unvalidated_channel
        claim_type: Conditional action
        grounds:
          - validations[priority=26]
          - errors[ERR_CHANNEL_NOT_VALIDATED]
          - endpoints.POST_/ehr-implementations/{id}/finalize-validation
        distinguishing_aspect: "A program in VALIDATION_IN_PROGRESS with a DEFINED interface channel cannot finalize validation: the call returns 422 ERR_CHANNEL_NOT_VALIDATED until every channel reaches VALIDATED."
        test_recipe:
          setup:
            - "A program with one facility and one DEFINED (never validated) interface channel, driven to VALIDATION_IN_PROGRESS."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - &c_ch
              call: "POST /ehr-implementations/${prog_id}/interface-channels"
              payload: { channel_type: "LAB", external_system: "Sysmex", message_format: "HL7_V2", throughput_per_hour: 500, max_latency_minutes: 5 }
              as: InterfaceEngineer
              captures: { ch_id: $.data.id }
            - call: "POST /ehr-implementations/${prog_id}/start-build"
              payload: {}
              as: ImplementationDirector
            - call: "POST /ehr-implementations/${prog_id}/start-validation"
              payload: {}
              as: ImplementationDirector
              captures: { prog_state: $.data.status }
          trigger:
            - call: "POST /ehr-implementations/${prog_id}/finalize-validation"
              payload: {}
              as: ImplementationDirector
              captures: { error_id: $.data.error_id }
          assert:
            - "EhrImplementation.${prog_id}.status == VALIDATION_IN_PROGRESS"
            - "the finalize-validation returns 422 and error_id == ERR_CHANNEL_NOT_VALIDATED"
            - "InterfaceChannel.${ch_id}.status == DEFINED"

      - name: c_staff_self_referential_preceptor_link_is_queryable
        claim_type: Parent Relationships
        grounds:
          - entities.Staff.fields.preceptor_staff_id
          - endpoints.GET_/staffs
          - relationship_patterns.self_referential
        distinguishing_aspect: "Staff.preceptor_staff_id is a self-referential foreign key; after a mentee is registered under a preceptor, GET /staffs?preceptor_staff_id=<preceptor> returns exactly the mentee, exercising the self-referential reverse lookup."
        test_recipe:
          setup:
            - "A program, facility and department; a preceptor staffer and a mentee registered with preceptor_staff_id set to the preceptor."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Mentor Ines", staff_type: "PROVIDER", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2025-06-01T00:00:00Z" }
              as: TrainingCoordinator
              captures: { preceptor_id: $.data.id }
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Mentee Jonas", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", preceptor_staff_id: "${preceptor_id}", hired_on: "2026-01-01T00:00:00Z" }
              as: TrainingCoordinator
              captures: { mentee_id: $.data.id }
          trigger:
            - call: "GET /staffs"
              payload: { preceptor_staff_id: "${preceptor_id}" }
              as: TrainingCoordinator
              captures: { n_rows: $.data }
          assert:
            - "the response status is 200 and response_type is array"
            - "GET /staffs?preceptor_staff_id=${preceptor_id} returns exactly 1 row, the mentee"
            - "Staff.${mentee_id}.preceptor_staff_id == ${preceptor_id}"
            - "GET /staffs?preceptor_staff_id=${mentee_id} returns 0 rows (the mentee precepts no one)"

  # ===========================================================================
  - section: errors
    instances:

      - name: c_ehr_implementation_get_with_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_EHR_IMPLEMENTATION_NOT_FOUND]
          - endpoints.GET_/ehr-implementations/{id}
        distinguishing_aspect: "An unallocated program id returns 404 ERR_EHR_IMPLEMENTATION_NOT_FOUND with the error envelope before any child lookup."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "GET /ehr-implementations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ImplementationDirector
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_EHR_IMPLEMENTATION_NOT_FOUND"
            - "the response data carries both error_id and message"

      - name: c_role_outside_endpoint_roles_returns_unauthorized
        claim_type: Not Found
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=2]
        distinguishing_aspect: "Creating a program as a role the endpoint does not list returns 403 ERR_UNAUTHORIZED and persists nothing."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clk
          trigger:
            - call: "POST /ehr-implementations"
              payload: { program_name: "Forbidden Program", vendor_release: "2026.2", go_live_target_utc: "2026-12-01T00:00:00Z" }
              as: TrainingCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "GET /ehr-implementations returns 0 rows"

  # ===========================================================================
  - section: rbac
    instances:

      - name: c_build_analyst_cannot_issue_credentials
        claim_type: "RBAC denial"
        grounds:
          - roles[BuildAnalyst]
          - roles[TrainingCoordinator]
          - endpoints.POST_/staffs/{id}/issue-credential
        distinguishing_aspect: "issue-credential is a TrainingCoordinator exclusive; a BuildAnalyst receives 403 ERR_UNAUTHORIZED and the staffer is not credentialed."
        test_recipe:
          setup:
            - "A program, facility, department and a staffer in REGISTERED."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Fiona Blake", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-18T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id }
          trigger:
            - call: "POST /staffs/${staff_id}/issue-credential"
              payload: {}
              as: BuildAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "Staff.${staff_id}.status is still REGISTERED"

      - name: c_implementation_analyst_cannot_advance_epoch
        claim_type: "RBAC denial"
        grounds:
          - roles[ImplementationAnalyst]
          - endpoints.POST_/ehr-implementations/{id}/advance-epoch
        distinguishing_aspect: "The read-only ImplementationAnalyst is refused 403 ERR_UNAUTHORIZED on advance-epoch and the program epoch stays 0."
        test_recipe:
          setup:
            - "A program at epoch 0."
          setup_api_calls:
            - *c_clk
            - *c_prog
          trigger:
            - call: "POST /ehr-implementations/${prog_id}/advance-epoch"
              payload: {}
              as: ImplementationAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "EhrImplementation.${prog_id}.current_epoch_index == 0"

      - name: c_credentialed_trainer_cannot_certify_trainer_records
        claim_type: "RBAC denial"
        grounds:
          - roles[CredentialedTrainer]
          - endpoints.POST_/credentialed-trainers/{id}/certify
        distinguishing_aspect: "Trainer certification is a TrainingCoordinator exclusive; a CredentialedTrainer actor receives 403 ERR_UNAUTHORIZED and the record stays PENDING_OBSERVATION."
        test_recipe:
          setup:
            - "A program, facility, department and a staffer with a pending trainer record."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Gita Shah", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-19T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /credentialed-trainers/${tr_id}/certify"
              payload: {}
              as: CredentialedTrainer
              as_user_id: "${tr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "CredentialedTrainer.${tr_id}.status is still PENDING_OBSERVATION"

      - name: c_conversion_analyst_cannot_reconcile_orders
        claim_type: "RBAC denial"
        grounds:
          - roles[ConversionAnalyst]
          - roles[OrderReconciler]
          - endpoints.POST_/patient-orders/{id}/reconcile
        distinguishing_aspect: "Order reconciliation is an OrderReconciler exclusive; the ConversionAnalyst who created the order receives 403 ERR_UNAUTHORIZED and the order stays CONVERTED."
        test_recipe:
          setup:
            - "A program and facility with one converted LAB order."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-8200", order_type: "LAB", encounter_utc: "2026-08-30T00:00:00Z", legacy_charge_cents: 10000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /patient-orders/${order_id}/reconcile"
              payload: {}
              as: ConversionAnalyst
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED"
            - "PatientOrder.${order_id}.clinical_state is still CONVERTED"

      - name: c_trainer_cannot_both_proctor_result_and_certify
        claim_type: "Segregation of duties"
        grounds:
          - roles[CredentialedTrainer]
          - roles[TrainingCoordinator]
          - errors[ERR_SOD_VIOLATION]
          - validations[priority=3]
        distinguishing_aspect: "After the acting X-User-ID records a proficiency exam result as the proctor of record, the same X-User-ID is refused 403 ERR_SOD_VIOLATION when it attempts to certify a trainer record — the segregated pair cannot be performed by one identity."
        test_recipe:
          setup:
            - "A program, facility, department; a certified trainer record; a staffer with a scheduled exam and a second pending trainer record."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Hana Ito", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-20T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { tr_id: $.data.id }
            - call: "POST /credentialed-trainers/${tr_id}/certify"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /staffs/${staff_id}/proficiency-exams"
              payload: { application_code: "CLN", proctored_by_trainer_id: "${tr_id}" }
              as: TrainingCoordinator
              captures: { exam_id: $.data.id }
            - call: "GET /staffs/${staff_id}"
              payload: {}
              as: TrainingCoordinator
              captures: { staff_v1: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN-ADV", certification_level: "ADVANCED", observation_hours: 12, expected_staff_version: "${staff_v1}" }
              as: TrainingCoordinator
              captures: { tr2_id: $.data.id }
          trigger:
            - call: "POST /proficiency-exams/${exam_id}/record-result"
              payload: { exam_score: 90 }
              as: CredentialedTrainer
              as_user_id: "${tr_id}"
              captures: { exam_state: $.data.status }
            - call: "POST /credentialed-trainers/${tr2_id}/certify"
              payload: {}
              as: TrainingCoordinator
              as_user_id: "${tr_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the record-result succeeds with status COMPLETED_PASS"
            - "the certify by the same X-User-ID ${tr_id} returns 403 and error_id == ERR_SOD_VIOLATION"
            - "CredentialedTrainer.${tr2_id}.status is still PENDING_OBSERVATION"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: c_stale_facility_version_on_batch_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[conversion-load-stale-facility]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Staging a data-conversion batch with the facility version read before an earlier batch advanced it returns 412 ERR_STALE_VERSION while the freshly-read version succeeds."
        test_recipe:
          setup:
            - "A program and facility; one batch already staged (advancing the facility version)."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - call: "POST /facilities/${fac_id}/data-conversion-batches"
              payload: { payload_class: "ORDERS", attempt_epoch: 0, source_count: 500, reconciled_count: 500, expected_facility_version: "${fac_v0}" }
              as: ConversionAnalyst
              captures: { batch_1: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { fac_v1: $.data.version }
          trigger:
            - call: "POST /facilities/${fac_id}/data-conversion-batches"
              payload: { payload_class: "BALANCES", attempt_epoch: 0, source_count: 500, reconciled_count: 500, expected_facility_version: "${fac_v0}" }
              as: ConversionAnalyst
              captures: { err_stale: $.data.error_id }
          assert:
            - "the stale create returns 412 and error_id == ERR_STALE_VERSION"
            - "retrying with expected_facility_version ${fac_v1} returns 201"
            - "GET /facilities/${fac_id}/data-conversion-batches returns exactly 2 batches"

      - name: c_stale_program_version_on_optimization_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[optimization-schedule-stale-program]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Raising an optimization item with the program version read before an epoch advance returns 412 ERR_STALE_VERSION; the fresh version succeeds."
        test_recipe:
          setup:
            - "A program at epoch 0 with version v; the epoch is then advanced."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/advance-epoch"
              payload: {}
              as: ImplementationDirector
              captures: { prog_v_new: $.data.version }
          trigger:
            - call: "POST /optimization-backlog-items"
              payload: { department_id: "${dept_id}", title: "Stale attempt", effort_points: 5, expected_ehr_implementation_version: "${prog_v_new} - 1" }
              as: OptimizationLead
              captures: { err_stale: $.data.error_id }
          assert:
            - "the stale create returns 412 and error_id == ERR_STALE_VERSION"
            - "retrying with expected_ehr_implementation_version ${prog_v_new} returns 201"

      - name: c_stale_staff_version_on_trainer_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[shift-create-stale-staff]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a second trainer record with the staff version read before the first trainer record advanced it returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup:
            - "A program, facility, department and a staffer whose version has advanced through a first trainer record."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - *c_fac
            - *c_dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Ivan Petrov", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-02-21T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { tr_1: $.data.id }
          trigger:
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN-ADV", certification_level: "ADVANCED", observation_hours: 12, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { err_stale: $.data.error_id }
          assert:
            - "the stale create returns 412 and error_id == ERR_STALE_VERSION"
            - "GET /staffs/${staff_id}/credentialed-trainers returns exactly 1 record"

      - name: c_program_version_increments_on_child_creation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.EhrImplementation
          - endpoints.POST_/ehr-implementations/{id}/facilities
        distinguishing_aspect: "The program version starts at 1 and increments to 2 after one facility is added, so a child create is reflected in the parent's version exactly once."
        test_recipe:
          setup:
            - "A program at version 1."
          setup_api_calls:
            - *c_clk
            - *c_prog
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { prog_v0: $.data.version }
          trigger:
            - call: "POST /ehr-implementations/${prog_id}/facilities"
              payload: { name: "Cascade Valley North", facility_type: "AMBULATORY", bed_count: 0, rollout_wave: 2, conversion_scope: "SCHEDULING_ONLY" }
              as: ImplementationDirector
              captures: { new_fac: $.data.id }
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { prog_v1: $.data.version }
          assert:
            - "EhrImplementation.${prog_id}.version == 1 before the child create"
            - "EhrImplementation.${prog_id}.version == 2 after one facility is added"
            - "GET /ehr-implementations/${prog_id}/facilities returns exactly 1 facility"

      - name: c_epoch_advance_gates_conversion_validation_is_covered_by_corner
        claim_type: ops_run_checkpoint
        grounds:
          - validations[priority=12]
          - calculations.test_validation_sweep
        excluded_because:
          difficulty_instance: r5b_state_precedes_fiscal_on_batch_load
          rationale: "The attempt_epoch == current_epoch_index gate is exercised by that §1.8 priority-conflict instance, and the epoch-scoped count is exercised by c_test_cycle_count_filters_to_current_epoch."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: c_created_resources_are_immediately_visible_on_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.GET_/facilities/{id}
          - endpoints.POST_/ehr-implementations/{id}/facilities
        distinguishing_aspect: "Under the immediate consistency model a facility created in one request is fully visible on the next read with every field echoed — no eventual-consistency lag."
        test_recipe:
          setup:
            - "A program exists."
          setup_api_calls:
            - *c_clk
            - *c_prog
          trigger:
            - call: "POST /ehr-implementations/${prog_id}/facilities"
              payload: { name: "Cascade Valley West", facility_type: "SPECIALTY", bed_count: 40, rollout_wave: 3, conversion_scope: "DEMOGRAPHICS_ONLY" }
              as: ImplementationDirector
              captures: { fac_new: $.data.id }
            - call: "GET /facilities/${fac_new}"
              payload: {}
              as: ImplementationDirector
              captures: { got_name: $.data.name, got_class: $.data.facility_type, got_status: $.data.status }
          assert:
            - "the create returns 201 and the read returns 200"
            - "Facility.${fac_new}.name == \"Cascade Valley West\" and facility_type == SPECIALTY"
            - "Facility.${fac_new}.bed_count == 40 and rollout_wave == 3 and conversion_scope == DEMOGRAPHICS_ONLY"
            - "Facility.${fac_new}.status == SITE_REGISTERED and is_live == false"
