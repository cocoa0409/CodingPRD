        distinguishing_aspect: "The 30-day issuance window after last_accrual_date is inclusive: issuance at exactly 2026-10-01T00:00:00Z succeeds; one second later fails 422 ERR_LATE_INVOICE_ISSUANCE (carrier ACTIVE, so only the temporal rule can fire)."
