  - method: GET
    path: "/api/till-sessions/{session_id}"
    description: "Get a till session"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: []
    output: TillSession
    side_effects: []
  - method: GET
    path: "/api/till-sessions"
    description: "List/filter till sessions (FK reverse for TillSession.cashier_worker_id)"
    roles: [StoreManager, IntakeAttendant, Pricer, Cashier, Driver, Volunteer, VolunteerCoordinator, FinanceClerk]
    code: 200
    input: ["cashier_worker_id?", "status?", "limit?", "offset?"]
    output: TillSession[]
    side_effects: []
  - method: POST
    path: "/api/till-sessions/{session_id}/count"
    description: "Manager blind count: OPEN -> RECONCILED (|over_short| <= 500) or PENDING_APPROVAL (>= 501)"
    roles: [StoreManager]
