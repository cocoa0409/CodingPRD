scenario: |
  2723. Winery Direct-to-Consumer Shipping Compliance (winery DTC shipping program): destination-state
  permit and license validity checks at order time, per-consumer and per-winery volume limits by state
  and rolling period, adult signature requirement and carrier program enrollment, excise and sales tax
  calculation and state-by-state remittance, dry-county and prohibited ZIP blocking, wine club recurring
  shipment scheduling with weather holds, order rejection, reroute and return-to-sender handling, monthly
  and annual state reporting with license renewal calendar

domain_name: winery-dtc-shipping-compliance
api_prefix: "/dtc"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit FK fields. Only two composition children
  # (OrderLine under Order, ProhibitedZip under StateRule) use nested URLs; every
  # other relationship is a flat FK plus a filtered-list reverse lookup.

  state_machine_shape: parallel
  # Order carries two independent state dimensions on one row
  # (compliance_status x fulfillment_status). Non-linear shapes also appear as
  # cycles on StatePermit (ACTIVE -> RENEWAL_FILED -> ACTIVE), Shipment
  # (IN_TRANSIT -> EXCEPTION -> IN_TRANSIT), ClubSubscription
  # (ACTIVE -> WEATHER_HELD -> ACTIVE), CarrierEnrollment
  # (APPROVED -> SUSPENDED -> APPROVED), Winery (ACTIVE -> SUSPENDED -> ACTIVE),
  # and as a fork with divergent side-effect sets on ComplianceException
  # (OPEN -> {APPROVED, DENIED}).

  relationship_patterns:
    - one_to_many
    - self_referential   # Shipment.replacement_of_shipment_id, TaxRemittance.supersedes_remittance_id
    - cross_aggregate    # VolumeLedgerEntry references Consumer, Winery, Order and Shipment

  role_model: segregation_of_duties
  # A ComplianceException may not be decided by the user who raised it, and a
  # TaxRemittance may not be marked REMITTED by the user who FILED it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Winery
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the winery
      - name: ttb_permit_number
        type: string
        source: input
        description: federal basic permit number
        constraints: unique across Winery
      - name: home_state_code
        type: string
        source: input
        description: two-letter code of the winery's production state
        constraints: exactly 2 uppercase letters
      - name: annual_production_gallons
        type: integer
        source: input
        description: annual production volume; drives the small-producer excise credit
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: operating status; SUSPENDED blocks order creation and club runs
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: suspension_reason
        type: string
        source: system
        description: free-text reason recorded by the last status change; null while ACTIVE
        default: null
      - name: excise_accrued_cents
        type: integer
        source: computed
        description: running sum of Order.excise_tax_cents over every Order of this winery that has reached compliance_status CLEARED at least once
        default: 0
      - name: excise_reversed_cents
        type: integer
        source: computed
        description: running sum of Order.excise_tax_cents reversed by return-to-sender or by a re-screen that rejects a previously cleared order (SUSPENDED_PERMIT -> REJECTED)
        default: 0
      - name: suspended_subscription_count
        type: integer
        source: computed
        description: count of ClubSubscription rows of this winery whose status is SUSPENDED_COMPLIANCE
        default: 0
      - name: open_exception_count
        type: integer
        source: computed
        description: count of ComplianceException rows with status OPEN on Orders of this winery
        default: 0

  - name: StateRule
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: destination state this configuration governs
        constraints: exactly 2 uppercase letters; unique across StateRule
      - name: allows_dtc
        type: boolean
        source: input
        description: whether direct-to-consumer wine shipment into this state is lawful at all
      - name: per_consumer_limit_liters
        type: number
        source: input
        description: maximum liters one Consumer may receive from one Winery within per_consumer_period
        constraints: "> 0; 3 decimal places"
      - name: per_consumer_period
        type: enum
        source: input
        description: rolling window shape used for the per-consumer limit
        constraints: "one of {ROLLING_12_MONTHS, CALENDAR_YEAR, ROLLING_30_DAYS}"
      - name: per_winery_annual_limit_liters
        type: number
        source: input
        description: maximum liters one Winery may ship into this state within the calendar year of the logical clock
        constraints: "> 0; 3 decimal places"
      - name: excise_rate_per_liter_cents
        type: integer
        source: input
        description: state excise rate applied to every liter of the order
        constraints: ">= 0"
      - name: large_format_surcharge_cents_per_liter
        type: integer
        source: input
        description: additional excise per liter contributed by lines whose bottle_ml is strictly greater than 1500
        constraints: ">= 0"
      - name: excise_cap_cents_per_shipment
        type: integer
        source: input
        description: hard ceiling applied to the credited excise of a single order
        constraints: "> 0"
      - name: sales_tax_rate_bps
        type: integer
        source: input
        description: destination sales tax rate in basis points
        constraints: ">= 0 and <= 2000"
      - name: tax_on_shipping
        type: boolean
        source: input
        description: whether shipping_cents enters the sales-tax base
      - name: excise_in_tax_base
        type: boolean
        source: input
        description: whether excise_tax_cents enters the sales-tax base
      - name: adult_signature_required
        type: boolean
        source: input
        description: whether delivery requires an age-verified adult signature
      - name: requires_carrier_program
        type: boolean
        source: input
        description: whether the winery must hold an APPROVED CarrierEnrollment on a program serving this state
      - name: reporting_frequency
        type: enum
        source: input
        description: cadence of the state's mandatory shipment report
        constraints: "one of {MONTHLY, ANNUAL}"
      - name: zero_filing_required
        type: boolean
        source: input
        description: whether a report period with zero qualifying orders must still be filed
      - name: min_purchaser_age
        type: integer
        source: input
        description: minimum purchaser age in whole years at the logical clock date
        default: 21
      - name: renewal_lead_days
        type: integer
        source: input
        description: number of days before permit expiration at which renewal becomes due
        default: 60

  - name: ProhibitedZip
    parent: StateRule
    common_fields: false
    fields:
      - name: state_rule_id
        type: string
        source: input
        description: "FK -> StateRule.id; the state configuration this blocked ZIP belongs to"
      - name: zip_code
        type: string
        source: input
        description: five-digit destination ZIP that may not receive wine
        constraints: exactly 5 digits; unique within state_rule_id
      - name: reason
        type: enum
        source: input
        description: statutory ground for the block
        constraints: "one of {DRY_COUNTY, PROHIBITED_MUNICIPALITY, PO_BOX_ONLY, CARRIER_UNSERVED}"
      - name: effective_from
        type: datetime
        source: input
        description: date (ISO 8601 date) from which the block applies; blocks with effective_from strictly after the logical clock date are ignored during screening

  - name: CarrierProgram
    parent: null
    common_fields: true
    fields:
      - name: carrier_code
        type: enum
        source: input
        description: carrier operating the licensed wine program
        constraints: "one of {UPS, FEDEX, GSO}"
      - name: program_name
        type: string
        source: input
        description: display name of the carrier's alcohol program
      - name: states_served
        type: array
        source: input
        description: array of two-letter state codes the program will deliver into
        constraints: non-empty array of 2-letter codes
      - name: requires_enrollment
        type: boolean
        source: input
        description: whether the carrier demands a per-winery enrollment before labels may be produced
      - name: adult_signature_service_code
        type: string
        source: input
        description: carrier service code that enforces age-verified adult signature; null when the program cannot offer it
        default: null

  - name: CarrierEnrollment
    parent: null
    common_fields: true
    fields:
      - name: winery_id
        type: string
        source: input
        description: "FK -> Winery.id; the enrolled winery"
      - name: carrier_program_id
        type: string
        source: input
        description: "FK -> CarrierProgram.id; the program enrolled into"
      - name: account_number
        type: string
        source: input
        description: carrier account number issued to the winery
      - name: status
        type: enum
        source: system
        description: enrollment standing
        default: PENDING
        constraints: "one of {PENDING, APPROVED, SUSPENDED}"
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent APPROVED decision; null while PENDING
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the CarrierAgent that issued the most recent decision
        default: null

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: purchaser name printed on the adult-signature label
      - name: email
        type: string
        source: input
        description: contact address
        constraints: unique across Consumer
      - name: birthdate
        type: datetime
        source: input
        description: ISO 8601 date of birth used by the age gate
      - name: address_line
        type: string
        source: input
        description: default street address
      - name: city
        type: string
        source: input
        description: default city
      - name: state_code
        type: string
        source: input
        description: default state; an order may still ship to a different state
      - name: zip_code
        type: string
        source: input
        description: default five-digit ZIP
      - name: id_verification_method
        type: enum
        source: system
        description: method recorded by the most recent identity verification
        default: NONE
        constraints: "one of {NONE, DOCUMENT, DATABASE}"
      - name: id_verified_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent successful identity verification; null when never verified
        default: null
      - name: rolling_liters_by_state
        type: object
        source: computed
        description: "map state_code -> liters (3 dp) produced by calculations.consumer_rolling_volume_liters over ALL VolumeLedgerEntry rows of this consumer inside the state's per_consumer_period window, regardless of the source order's fulfillment_status"
        default: {}
      - name: rolling_liters_settled_by_state
        type: object
        source: computed
        description: "map state_code -> liters (3 dp) over the same window but restricted to entries whose order_id is null or whose Order.fulfillment_status is in {IN_TRANSIT, DELIVERED, RETURNED}; consumed only by the SCREENING variant of calculations.consumer_compliance_risk_score"
        default: {}
      - name: return_credit_count
        type: integer
        source: computed
        description: count of VolumeLedgerEntry rows of this consumer with event_type RETURN_CREDIT inside the widest per_consumer_period window in play
        default: 0
      - name: denied_exception_count
        type: integer
        source: computed
        description: count of ComplianceException rows with status DENIED raised on Orders of this consumer
        default: 0
      - name: risk_score_screening
        type: integer
        source: computed
        description: SCREENING variant of calculations.consumer_compliance_risk_score; gates order clearance
        default: 0
      - name: risk_score_audit
        type: integer
        source: computed
        description: AUDIT variant of calculations.consumer_compliance_risk_score; reporting only, never gates an operation
        default: 0
      - name: screening_tier
        type: enum
        source: computed
        description: STANDARD while risk_score_screening < 50, ELEVATED once risk_score_screening >= 50
        default: STANDARD
        constraints: "one of {STANDARD, ELEVATED}"

  - name: StatePermit
    parent: null
    common_fields: true
    fields:
      - name: winery_id
        type: string
        source: input
        description: "FK -> Winery.id; the permit holder"
      - name: state_code
        type: string
        source: input
        description: destination state the permit authorizes; must equal an existing StateRule.state_code
      - name: permit_number
        type: string
        source: input
        description: state-issued license number
      - name: permit_type
        type: enum
        source: input
        description: license class
        constraints: "one of {DIRECT_SHIPPER, WINE_SHIPPER, COMMON_CARRIER_ENDORSEMENT}"
      - name: effective_date
        type: datetime
        source: input
        description: first ISO 8601 date on which the permit authorizes shipment (closed interval start)
      - name: expiration_date
        type: datetime
        source: input
        description: last ISO 8601 date on which the permit authorizes shipment (closed interval end)
      - name: status
        type: enum
        source: system
        description: license standing
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, RENEWAL_FILED, EXPIRED, REVOKED}"
      - name: renewal_reference
        type: string
        source: system
        description: state renewal filing reference recorded by the most recent file-renewal call
        default: null
      - name: renewal_filed_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent renewal filing
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: reason recorded when the permit was revoked
        default: null
      - name: renewal_cycle_count
        type: integer
        source: computed
        description: number of completed RENEWAL_FILED -> ACTIVE cycles on this permit row
        default: 0

  - name: ClubSubscription
    parent: null
    common_fields: true
    fields:
      - name: consumer_id
        type: string
        source: input
        description: "FK -> Consumer.id; the club member"
      - name: winery_id
        type: string
        source: input
        description: "FK -> Winery.id; the club operator"
      - name: cadence
        type: enum
        source: input
        description: recurrence interval
        constraints: "one of {MONTHLY, QUARTERLY}"
      - name: sku
        type: string
        source: input
        description: SKU written onto every generated OrderLine
      - name: bottles_per_shipment
        type: integer
        source: input
        description: bottle count written onto every generated OrderLine
        constraints: ">= 1"
      - name: bottle_ml
        type: integer
        source: input
        description: bottle size in millilitres written onto every generated OrderLine
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: per-bottle price written onto every generated OrderLine
        constraints: ">= 0"
      - name: next_run_date
        type: datetime
        source: input
        description: ISO 8601 date on or before which the next club run generates an Order; supplied at creation as the first scheduled run and advanced by the system after every successful run; null while status is SUSPENDED_COMPLIANCE
      - name: status
        type: enum
        source: system
        description: subscription standing
        default: ACTIVE
        constraints: "one of {ACTIVE, WEATHER_HELD, SUSPENDED_COMPLIANCE}"
      - name: hold_start_date
        type: datetime
        source: system
        description: first date of the current weather hold; null when not held
        default: null
      - name: hold_release_date
        type: datetime
        source: system
        description: date on which the current weather hold lapses; null when not held
        default: null
      - name: hold_reason
        type: enum
        source: system
        description: reason of the current or most recent hold
        default: null
        constraints: "one of {WEATHER_HEAT, WEATHER_FREEZE, CONSUMER_REQUEST}"
      - name: last_hold_release_date
        type: datetime
        source: system
        description: hold_release_date of the most recently ended hold; drives the 3-day buffer rule
        default: null
      - name: missed_run_count
        type: integer
        source: computed
        description: number of club runs whose generated Order ended in compliance_status REJECTED for this subscription since the last reset
        default: 0
      - name: annual_allotment
        type: integer
        source: input
        description: number of shipments the member has prepaid for the year
        constraints: ">= 1"
      - name: consumed_shipments
        type: integer
        source: computed
        description: number of club-run Orders generated for this subscription that are not in compliance_status REJECTED
        default: 0
      - name: remaining_allotment
        type: integer
        source: computed
        description: annual_allotment - consumed_shipments; never negative
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: winery_id
        type: string
        source: input
        description: "FK -> Winery.id; the shipping licensee"
      - name: consumer_id
        type: string
        source: input
        description: "FK -> Consumer.id; the purchaser"
      - name: club_subscription_id
        type: string
        source: input
        description: "FK -> ClubSubscription.id; set when the order belongs to a wine-club run or is manually attributed to a club member; null for one-off orders"
        default: null
      - name: ship_to_address_line
        type: string
        source: input
        description: destination street address
      - name: ship_to_state_code
        type: string
        source: input
        description: destination state; selects the StateRule that governs the whole order
      - name: ship_to_zip
        type: string
        source: input
        description: destination five-digit ZIP; rewritten by an accepted reroute scan
      - name: compliance_status
        type: enum
        source: system
        description: compliance dimension of the order; independent of fulfillment_status
        default: DRAFT
        constraints: "one of {DRAFT, CLEARED, REJECTED, OVERRIDE_PENDING, SUSPENDED_PERMIT}"
      - name: fulfillment_status
        type: enum
        source: system
        description: logistics dimension of the order; independent of compliance_status
        default: UNFULFILLED
        constraints: "one of {UNFULFILLED, LABELED, IN_TRANSIT, DELIVERED, RETURNED}"
      - name: rejection_error_id
        type: string
        source: computed
        description: error_id of the highest-priority screening check that failed on the most recent screen; null while DRAFT or CLEARED without prior failure
        default: null
      - name: override_applied
        type: boolean
        source: system
        description: true once an APPROVED ComplianceException cleared this order
        default: false
      - name: total_liters
        type: number
        source: computed
        description: sum of OrderLine.line_liters, 3 decimal places
      - name: subtotal_cents
        type: integer
        source: computed
        description: sum of OrderLine.line_subtotal_cents
      - name: shipping_gross_cents
        type: integer
        source: computed
        description: step 3 of calculations.order_charge_evaluation_chain, before the liter-tier multiplier
      - name: shipping_tiered_cents
        type: integer
        source: computed
        description: step 5 of calculations.order_charge_evaluation_chain, after the liter-tier multiplier and before the club discount
      - name: shipping_discount_cents
        type: integer
        source: computed
        description: club shipping discount subtracted at step 6; 0 when club_subscription_id is null
      - name: shipping_cents
        type: integer
        source: computed
        description: shipping_tiered_cents - shipping_discount_cents
      - name: excise_tax_cents
        type: integer
        source: computed
        description: output of calculations.order_excise_tax_cents
      - name: sales_tax_cents
        type: integer
        source: computed
        description: output of calculations.order_sales_tax_cents (sum of OrderLine.line_sales_tax_cents)
      - name: pre_fee_total_cents
        type: integer
        source: computed
        description: subtotal_cents + shipping_cents + excise_tax_cents + sales_tax_cents; the ONLY quantity compared against FEE_WAIVER_THRESHOLD_CENTS
      - name: compliance_handling_fee_cents
        type: integer
        source: computed
        description: 0 when pre_fee_total_cents >= FEE_WAIVER_THRESHOLD_CENTS, otherwise COMPLIANCE_HANDLING_FEE_CENTS
      - name: total_cents
        type: integer
        source: computed
        description: pre_fee_total_cents + compliance_handling_fee_cents
      - name: excise_reversed_cents
        type: integer
        source: computed
        description: excise reversed on this order by return-to-sender or by a DENIED override after clearance; 0 or equal to excise_tax_cents
        default: 0
      - name: sales_tax_reversed_cents
        type: integer
        source: computed
        description: sales tax reversed on this order by the same events; 0 or equal to sales_tax_cents
        default: 0
      - name: adult_signature_required
        type: boolean
        source: computed
        description: copied from the governing StateRule.adult_signature_required at the moment compliance_status first becomes CLEARED
        default: false
      - name: cleared_at
        type: datetime
        source: system
        description: logical-clock instant at which compliance_status first became CLEARED; drives ACCRUAL_BASIS period membership
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: logical-clock instant at which fulfillment_status became RETURNED
        default: null

  - name: OrderLine
    parent: Order
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the owning order"
      - name: line_index
        type: integer
        source: system
        description: 1-based position of this line in the request's lines array; the deterministic ordering key for shipping-remainder allocation
      - name: sku
        type: string
        source: input
        description: product code
      - name: bottle_ml
        type: integer
        source: input
        description: bottle size in millilitres
        constraints: "> 0"
      - name: bottles
        type: integer
        source: input
        description: bottle count
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: price per bottle
        constraints: ">= 0"
      - name: line_liters
        type: number
        source: computed
        description: round_half_up(bottles * bottle_ml / 1000, 3)
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: bottles * unit_price_cents
      - name: allocated_shipping_cents
        type: integer
        source: computed
        description: this line's share of the taxable shipping/excise pool per calculations.order_sales_tax_cents
      - name: line_taxable_cents
        type: integer
        source: computed
        description: line_subtotal_cents + allocated_shipping_cents
      - name: line_sales_tax_cents
        type: integer
        source: computed
        description: round_half_up(line_taxable_cents * StateRule.sales_tax_rate_bps / 10000, 0)

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being shipped"
      - name: carrier_enrollment_id
        type: string
        source: input
        description: "FK -> CarrierEnrollment.id; the enrollment the label is drawn against"
      - name: replacement_of_shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; set when this label replaces a RETURNED shipment of the same order"
        default: null
      - name: tracking_number
        type: string
        source: system
        description: server-minted tracking number, format TRK-<8 hex chars>
      - name: adult_signature_required
        type: boolean
        source: computed
        description: copied from Order.adult_signature_required at label creation
      - name: adult_signature_service_code
        type: string
        source: computed
        description: copied from the enrolled CarrierProgram.adult_signature_service_code when adult_signature_required is true, else null
        default: null
      - name: status
        type: enum
        source: system
        description: carrier-visible shipment standing
        default: LABEL_CREATED
        constraints: "one of {LABEL_CREATED, IN_TRANSIT, EXCEPTION, DELIVERED, RETURNED}"
      - name: exception_code
        type: enum
        source: system
        description: reason recorded by the most recent EXCEPTION scan
        default: null
        constraints: "one of {WEATHER, ADDRESS_UNDELIVERABLE, ADULT_SIGNATURE_UNAVAILABLE, REFUSED}"
      - name: reroute_zip
        type: string
        source: system
        description: destination ZIP accepted by the most recent reroute scan
        default: null
      - name: reroute_count
        type: integer
        source: computed
        description: number of accepted reroutes on this shipment; a shipment may be rerouted at most once
        default: 0
      - name: signed_by
        type: string
        source: system
        description: name captured on the delivery signature
        default: null
      - name: signer_age_verified
        type: boolean
        source: system
        description: whether the carrier verified the signer was of legal age
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant of the DELIVERED scan; drives DELIVERY_BASIS period membership
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: logical-clock instant of the RETURN_TO_SENDER scan
        default: null

  - name: ComplianceException
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order awaiting an override decision"
      - name: raised_rule
        type: enum
        source: input
        description: the overridable screening failure this exception seeks to override; MUST equal Order.rejection_error_id
        constraints: "one of {ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED, ERR_WINERY_VOLUME_LIMIT_EXCEEDED, ERR_ELEVATED_RISK_REVIEW_REQUIRED}"
      - name: justification
        type: string
        source: input
        description: narrative the requester files with the state compliance log
      - name: status
        type: enum
        source: system
        description: decision standing
        default: OPEN
        constraints: "one of {OPEN, APPROVED, DENIED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that raised the exception
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that decided; MUST differ from requested_by_user_id
        default: null
      - name: decision_note
        type: string
        source: system
        description: narrative recorded with the decision
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision
        default: null

  - name: VolumeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: consumer_id
        type: string
        source: input
        description: "FK -> Consumer.id; the consumer whose rolling volume this entry moves"
      - name: winery_id
        type: string
        source: input
        description: "FK -> Winery.id; the shipping winery whose annual state volume this entry moves"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order that produced this entry; null for MANUAL_ADJUSTMENT entries"
        default: null
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the shipment that produced this entry; null for SHIPMENT_ACCEPTED and MANUAL_ADJUSTMENT entries"
        default: null
      - name: state_code
        type: string
        source: input
        description: destination state the volume is attributed to
      - name: liters
        type: number
        source: input
        description: signed liters, 3 decimal places; positive consumes the limit, negative releases it
      - name: event_type
        type: enum
        source: system
        description: what produced the entry
        constraints: "one of {SHIPMENT_ACCEPTED, RETURN_CREDIT, MANUAL_ADJUSTMENT}"
      - name: occurred_at
        type: datetime
        source: input
        description: instant the entry is attributed to; defaults to the logical clock; the ONLY window key for rolling-period aggregation
      - name: reason
        type: string
        source: input
        description: narrative for MANUAL_ADJUSTMENT entries; null otherwise
        default: null

  - name: TaxRemittance
    parent: null
    common_fields: true
    fields:
      - name: winery_id
        type: string
        source: input
        description: "FK -> Winery.id; the remitting licensee"
      - name: supersedes_remittance_id
        type: string
        source: input
        description: "FK -> TaxRemittance.id; the FILED remittance this one amends; null for an original filing"
        default: null
      - name: state_code
        type: string
        source: input
        description: state the remittance is owed to
      - name: period_type
        type: enum
        source: input
        description: report cadence this remittance covers
        constraints: "one of {MONTHLY, ANNUAL}"
      - name: period_start
        type: datetime
        source: input
        description: inclusive ISO 8601 start date of the half-open reporting interval
      - name: period_end
        type: datetime
        source: input
        description: exclusive ISO 8601 end date of the half-open reporting interval; MUST be less than or equal to the logical clock date
      - name: basis
        type: enum
        source: input
        description: which variant of calculations.remittance_due_amounts computes this remittance
        constraints: "one of {ACCRUAL_BASIS, DELIVERY_BASIS}"
      - name: status
        type: enum
        source: system
        description: filing standing
        default: OPEN
        constraints: "one of {OPEN, FILED, REMITTED, AMENDED}"
      - name: excise_accrued_cents
        type: integer
        source: computed
        description: gross excise of the orders selected by basis
      - name: excise_reversed_cents
        type: integer
        source: computed
        description: excise of selected orders whose returned_at is strictly before period_end
      - name: excise_due_cents
        type: integer
        source: computed
        description: excise_accrued_cents - excise_reversed_cents
      - name: sales_tax_accrued_cents
        type: integer
        source: computed
        description: gross sales tax of the orders selected by basis
      - name: sales_tax_reversed_cents
        type: integer
        source: computed
        description: sales tax of selected orders whose returned_at is strictly before period_end
      - name: sales_tax_due_cents
        type: integer
        source: computed
        description: sales_tax_accrued_cents - sales_tax_reversed_cents
      - name: liters_total
        type: number
        source: computed
        description: sum of Order.total_liters over selected orders, 3 decimal places
      - name: shipment_count
        type: integer
        source: computed
        description: count of selected orders
      - name: included_order_ids
        type: array
        source: computed
        description: ids of the selected orders, ordered by Order.cleared_at ASC then Order.created_at ASC
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of filing
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that filed
        default: null
      - name: remitted_at
        type: datetime
        source: system
        description: logical-clock instant of payment
        default: null
      - name: remitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the ComplianceOfficer that remitted; MUST differ from filed_by_user_id
        default: null
      - name: payment_reference
        type: string
        source: system
        description: state payment confirmation reference
        default: null

# ============================================================================
# 1.2 State Machine Table
#
# Order carries TWO independent state dimensions on one row. They are declared
# as two state_machines entries distinguished by `dimension:`; neither dimension
# constrains the other's reachable set except through the explicit
# cross-dimension preconditions spelled out below.
# ============================================================================
state_machines:
  - entity: Order
    dimension: compliance_status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: CLEARED
        trigger: "POST /dtc/orders/{id}/screen — every screening check in validations priority 40..95 passes"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "Order.compliance_status == DRAFT"
          - "Winery.status == ACTIVE"
          - "a StatePermit for (Order.winery_id, Order.ship_to_state_code) exists with status == ACTIVE and expiration_date >= clock date"
        side_effects:
          - "Order.cleared_at = logical clock; Order.rejection_error_id = null"
          - "Order.adult_signature_required = governing StateRule.adult_signature_required"
          - "appends VolumeLedgerEntry{event_type: SHIPMENT_ACCEPTED, liters: +Order.total_liters, occurred_at: logical clock, order_id: Order.id, shipment_id: null, state_code: Order.ship_to_state_code}"
          - "because that ledger entry was appended, Consumer.rolling_liters_by_state, Consumer.rolling_liters_settled_by_state, Consumer.risk_score_screening, Consumer.risk_score_audit and Consumer.screening_tier are recomputed and Consumer.version increments by 1"
          - "Winery.excise_accrued_cents += Order.excise_tax_cents; Winery.version increments by 1"
          - "when Order.club_subscription_id is not null: ClubSubscription.consumed_shipments += 1 and ClubSubscription.remaining_allotment = annual_allotment - consumed_shipments"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /dtc/orders/{id}/screen — highest-priority failing check is NOT in the overridable set {ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED, ERR_WINERY_VOLUME_LIMIT_EXCEEDED, ERR_ELEVATED_RISK_REVIEW_REQUIRED}"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "Order.compliance_status == DRAFT"
        side_effects:
          - "Order.rejection_error_id = error_id of the lowest-numbered failing validations priority"
          - "no VolumeLedgerEntry is appended; Winery.excise_accrued_cents unchanged"
        note: "The endpoint returns HTTP 200 with the Order body; the failure is recorded in Order.rejection_error_id, not returned as an error envelope."
      - from: DRAFT
        to: OVERRIDE_PENDING
        trigger: "POST /dtc/orders/{id}/screen — highest-priority failing check IS in the overridable set"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "Order.compliance_status == DRAFT"
        side_effects:
          - "Order.rejection_error_id = error_id of the overridable failing check"
          - "no VolumeLedgerEntry is appended"
      - from: OVERRIDE_PENDING
        to: CLEARED
        trigger: "POST /dtc/compliance-exceptions/{id}/decision with decision APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceException.status == OPEN"
          - "ComplianceException.order_id == Order.id and Order.compliance_status == OVERRIDE_PENDING"
          - "X-User-ID != ComplianceException.requested_by_user_id"
        side_effects:
          - "Order.override_applied = true; Order.rejection_error_id = null; Order.cleared_at = logical clock"
          - "the same ledger-append and recompute chain as DRAFT -> CLEARED fires"
          - "Winery.open_exception_count -= 1"
      - from: OVERRIDE_PENDING
        to: REJECTED
        trigger: "POST /dtc/compliance-exceptions/{id}/decision with decision DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceException.status == OPEN"
          - "X-User-ID != ComplianceException.requested_by_user_id"
        side_effects:
          - "Order.rejection_error_id keeps the overridable error_id"
          - "Consumer.denied_exception_count += 1; because that counter moved, Consumer.risk_score_screening / risk_score_audit / screening_tier are recomputed and Consumer.version increments by 1"
          - "Winery.open_exception_count -= 1"
      - from: CLEARED
        to: SUSPENDED_PERMIT
        trigger: "system cascade from StatePermit ACTIVE -> REVOKED"
        actor: system
        preconditions:
          - "Order.winery_id == StatePermit.winery_id and Order.ship_to_state_code == StatePermit.state_code"
          - "Order.fulfillment_status == UNFULFILLED"
        side_effects:
          - "Order.rejection_error_id = ERR_PERMIT_NOT_ACTIVE"
          - "the SHIPMENT_ACCEPTED VolumeLedgerEntry is NOT reversed — suspension is not terminal and the liters stay reserved"
          - "because the order left CLEARED, any ClubSubscription named by Order.club_subscription_id whose status is ACTIVE transitions to SUSPENDED_COMPLIANCE"
        note: "Suspended orders are processed in Order.created_at ASC order so the cascade is replayable."
      - from: SUSPENDED_PERMIT
        to: CLEARED
        trigger: "POST /dtc/orders/{id}/screen after a fresh ACTIVE StatePermit exists for the destination state"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "Order.compliance_status == SUSPENDED_PERMIT"
          - "every screening check in validations priority 40..95 passes"
        side_effects:
          - "Order.rejection_error_id = null; Order.cleared_at is left at its original value"
          - "no second SHIPMENT_ACCEPTED entry is appended (the original debit was never reversed) and Winery.excise_accrued_cents is NOT incremented a second time"
      - from: SUSPENDED_PERMIT
        to: REJECTED
        trigger: "POST /dtc/orders/{id}/screen while the destination state still has no ACTIVE permit, or any other non-overridable check fails"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "Order.compliance_status == SUSPENDED_PERMIT"
        side_effects:
          - "Order.rejection_error_id = error_id of the lowest-numbered failing validations priority"
          - "appends VolumeLedgerEntry{event_type: RETURN_CREDIT, liters: -Order.total_liters, order_id: Order.id, shipment_id: null} reversing the original debit"
          - "Order.excise_reversed_cents = Order.excise_tax_cents; Order.sales_tax_reversed_cents = Order.sales_tax_cents; Winery.excise_reversed_cents += Order.excise_tax_cents"
          - "because the reversing entry was appended, Consumer rolling and risk fields are recomputed and Consumer.version increments by 1"
      - from: SUSPENDED_PERMIT
        to: OVERRIDE_PENDING
        trigger: "POST /dtc/orders/{id}/screen where the highest-priority failing check is in the overridable set"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "Order.compliance_status == SUSPENDED_PERMIT"
        side_effects:
          - "Order.rejection_error_id = error_id of the overridable failing check; ledger untouched"

  - entity: Order
    dimension: fulfillment_status
    initial_state: UNFULFILLED
    terminal_states: [DELIVERED]
    transitions:
      - from: UNFULFILLED
        to: LABELED
        trigger: "POST /dtc/shipments"
        actor: WineryOperator
        preconditions:
          - "Order.compliance_status == CLEARED"
          - "CarrierEnrollment.status == APPROVED and CarrierEnrollment.winery_id == Order.winery_id"
          - "the enrolled CarrierProgram.states_served contains Order.ship_to_state_code"
        side_effects:
          - "a Shipment row is created in LABEL_CREATED with a server-minted tracking_number"
          - "Shipment.adult_signature_required = Order.adult_signature_required"
      - from: LABELED
        to: IN_TRANSIT
        trigger: "POST /dtc/shipments/{id}/scan with scan_type PICKUP"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == LABEL_CREATED"
        side_effects:
          - "Shipment.status = IN_TRANSIT"
          - "because the order left LABELED, Consumer.rolling_liters_settled_by_state now includes this order's liters, so Consumer.risk_score_screening / screening_tier are recomputed and Consumer.version increments by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /dtc/shipments/{id}/scan with scan_type DELIVERED"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == IN_TRANSIT"
          - "when Shipment.adult_signature_required is true: signed_by is a non-empty string AND signer_age_verified == true"
        side_effects:
          - "Shipment.status = DELIVERED; Shipment.delivered_at = logical clock"
          - "Order.fulfillment_status = DELIVERED — this is what makes the order enter a DELIVERY_BASIS remittance period"
      - from: IN_TRANSIT
        to: RETURNED
        trigger: "POST /dtc/shipments/{id}/scan with scan_type RETURN_TO_SENDER (directly, or after an EXCEPTION scan)"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status in {IN_TRANSIT, EXCEPTION}"
        side_effects:
          - "see Shipment EXCEPTION -> RETURNED for the full four-hop cascade"
      - from: RETURNED
        to: LABELED
        trigger: "POST /dtc/shipments with replacement_of_shipment_id set to the RETURNED shipment"
        actor: WineryOperator
        preconditions:
          - "Order.compliance_status == CLEARED"
          - "the referenced Shipment.status == RETURNED and its order_id == Order.id"
          - "re-debiting Order.total_liters must not breach the per-consumer or per-winery volume limit"
        side_effects:
          - "a new Shipment row is created in LABEL_CREATED with replacement_of_shipment_id set"
          - "appends VolumeLedgerEntry{event_type: SHIPMENT_ACCEPTED, liters: +Order.total_liters, order_id: Order.id, shipment_id: null} re-debiting the liters the return credited back"
          - "Order.excise_reversed_cents = 0; Order.sales_tax_reversed_cents = 0; Winery.excise_reversed_cents -= Order.excise_tax_cents"
          - "because the re-debit entry was appended, Consumer rolling and risk fields are recomputed and Consumer.version increments by 1"
        note: "This is the reship loop that makes the fulfillment dimension cyclic: UNFULFILLED -> LABELED -> IN_TRANSIT -> RETURNED -> LABELED."

  - entity: StatePermit
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /dtc/state-permits/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "StatePermit.status == PENDING"
          - "StatePermit.effective_date <= logical clock date"
        side_effects:
          - "StatePermit.status = ACTIVE — orders into StatePermit.state_code may now clear"
      - from: ACTIVE
        to: RENEWAL_FILED
        trigger: "POST /dtc/state-permits/{id}/file-renewal"
        actor: ComplianceOfficer
        preconditions:
          - "StatePermit.status == ACTIVE"
          - "logical clock date >= expiration_date - StateRule.renewal_lead_days days"
        side_effects:
          - "StatePermit.renewal_reference recorded; StatePermit.renewal_filed_at = logical clock"
          - "the permit no longer authorizes new clearances while RENEWAL_FILED — screening records ERR_PERMIT_NOT_ACTIVE"
      - from: EXPIRED
        to: RENEWAL_FILED
        trigger: "POST /dtc/state-permits/{id}/file-renewal"
        actor: ComplianceOfficer
        preconditions:
          - "StatePermit.status == EXPIRED"
        side_effects:
          - "StatePermit.renewal_reference recorded; StatePermit.renewal_filed_at = logical clock"
        note: "No lead-time precondition applies once the permit has already expired."
      - from: RENEWAL_FILED
        to: ACTIVE
        trigger: "POST /dtc/state-permits/{id}/approve-renewal"
        actor: ComplianceOfficer
        preconditions:
          - "StatePermit.status == RENEWAL_FILED"
          - "new_expiration_date > StatePermit.expiration_date"
        side_effects:
          - "StatePermit.expiration_date = new_expiration_date; StatePermit.renewal_cycle_count += 1"
          - "StatePermit.renewal_reference = null; StatePermit.renewal_filed_at = null"
        note: "Closes the ACTIVE -> RENEWAL_FILED -> ACTIVE cycle on the same permit row."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system evaluation during POST /dtc/orders/{id}/screen, POST /dtc/club-runs or GET /dtc/renewal-calendar when logical clock date > expiration_date"
        actor: system
        preconditions:
          - "StatePermit.status == ACTIVE"
          - "logical clock date > StatePermit.expiration_date"
        side_effects:
          - "StatePermit.status = EXPIRED; StatePermit.version increments by 1"
          - "the screening call that observed the expiry records ERR_PERMIT_EXPIRED on the Order"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /dtc/state-permits/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "StatePermit.status in {PENDING, ACTIVE, RENEWAL_FILED, EXPIRED}"
        side_effects:
          - "StatePermit.status = REVOKED; StatePermit.revocation_reason recorded"
          - "hop 1: every Order with this winery_id and ship_to_state_code whose compliance_status == CLEARED and fulfillment_status == UNFULFILLED transitions CLEARED -> SUSPENDED_PERMIT, in Order.created_at ASC order"
          - "hop 2: because those orders left CLEARED, every ClubSubscription named by their club_subscription_id whose status == ACTIVE transitions ACTIVE -> SUSPENDED_COMPLIANCE and its next_run_date is set to null"
          - "hop 3: because those subscriptions became SUSPENDED_COMPLIANCE, Winery.suspended_subscription_count is recomputed as the count of SUSPENDED_COMPLIANCE subscriptions of the winery and Winery.version increments by 1"
      - from: RENEWAL_FILED
        to: REVOKED
        trigger: "POST /dtc/state-permits/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "StatePermit.status == RENEWAL_FILED"
        side_effects:
          - "same three-hop cascade as ACTIVE -> REVOKED"

  - entity: Shipment
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /dtc/shipments/{id}/scan with scan_type PICKUP"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == LABEL_CREATED"
        side_effects:
          - "Order.fulfillment_status = IN_TRANSIT"
      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "POST /dtc/shipments/{id}/scan with scan_type EXCEPTION and an exception_code"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == IN_TRANSIT"
          - "exception_code is present"
        side_effects:
          - "Shipment.exception_code recorded; Order.fulfillment_status stays IN_TRANSIT"
      - from: EXCEPTION
        to: IN_TRANSIT
        trigger: "POST /dtc/shipments/{id}/scan with scan_type REROUTE_ACCEPTED, reroute_zip and reroute_state_code"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == EXCEPTION"
          - "Shipment.reroute_count == 0 (a shipment may be rerouted at most once)"
          - "reroute_state_code == Order.ship_to_state_code"
          - "reroute_zip is not blocked by a ProhibitedZip of the destination state whose effective_from <= logical clock date"
        side_effects:
          - "Shipment.status = IN_TRANSIT; Shipment.reroute_zip recorded; Shipment.reroute_count += 1; Shipment.exception_code = null"
          - "Order.ship_to_zip = reroute_zip; Order.version increments by 1"
        note: "Closes the IN_TRANSIT -> EXCEPTION -> IN_TRANSIT cycle. No ledger movement: the destination state is unchanged, so no tax or volume attribution changes."
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /dtc/shipments/{id}/scan with scan_type DELIVERED"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == IN_TRANSIT"
          - "when Shipment.adult_signature_required is true: signed_by non-empty AND signer_age_verified == true"
        side_effects:
          - "Shipment.delivered_at = logical clock; Shipment.signed_by / signer_age_verified recorded"
          - "Order.fulfillment_status = DELIVERED"
      - from: EXCEPTION
        to: RETURNED
        trigger: "POST /dtc/shipments/{id}/scan with scan_type RETURN_TO_SENDER"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status in {IN_TRANSIT, EXCEPTION}"
        side_effects:
          - "hop 0: Shipment.status = RETURNED; Shipment.returned_at = logical clock"
          - "hop 1: because the shipment became RETURNED, Order.fulfillment_status = RETURNED and Order.returned_at = logical clock"
          - "hop 2: because the order became RETURNED, a VolumeLedgerEntry{event_type: RETURN_CREDIT, liters: -Order.total_liters, order_id: Order.id, shipment_id: Shipment.id, occurred_at: logical clock} is appended, Order.excise_reversed_cents = Order.excise_tax_cents, Order.sales_tax_reversed_cents = Order.sales_tax_cents, and Winery.excise_reversed_cents += Order.excise_tax_cents"
          - "hop 3: because a RETURN_CREDIT entry now exists, Consumer.rolling_liters_by_state, Consumer.rolling_liters_settled_by_state, Consumer.return_credit_count, Consumer.risk_score_screening and Consumer.risk_score_audit are recomputed and Consumer.version increments by 1"
          - "hop 4: because risk_score_screening moved, Consumer.screening_tier is re-derived — it becomes ELEVATED once risk_score_screening >= 50"
      - from: IN_TRANSIT
        to: RETURNED
        trigger: "POST /dtc/shipments/{id}/scan with scan_type RETURN_TO_SENDER without a preceding EXCEPTION scan"
        actor: CarrierAgent
        preconditions:
          - "Shipment.status == IN_TRANSIT"
        side_effects:
          - "identical hop 0..hop 4 cascade as EXCEPTION -> RETURNED"

  - entity: ComplianceException
    initial_state: OPEN
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /dtc/compliance-exceptions/{id}/decision with decision APPROVED"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceException.status == OPEN"
          - "X-User-ID != ComplianceException.requested_by_user_id"
          - "the referenced Order.compliance_status == OVERRIDE_PENDING"
        side_effects:
          - "decided_by_user_id, decision_note and decided_at recorded"
          - "Order OVERRIDE_PENDING -> CLEARED with override_applied = true, including the full ledger-append chain"
        note: "Fork branch A. The two branches carry disjoint side-effect sets: A debits the volume ledger and accrues excise, B moves consumer risk instead."
      - from: OPEN
        to: DENIED
        trigger: "POST /dtc/compliance-exceptions/{id}/decision with decision DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceException.status == OPEN"
          - "X-User-ID != ComplianceException.requested_by_user_id"
        side_effects:
          - "decided_by_user_id, decision_note and decided_at recorded"
          - "Order OVERRIDE_PENDING -> REJECTED; no ledger entry is appended and Winery.excise_accrued_cents is untouched"
          - "Consumer.denied_exception_count += 1 and the consumer risk fields are recomputed"
        note: "Fork branch B."

  - entity: ClubSubscription
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: WEATHER_HELD
        trigger: "POST /dtc/club-subscriptions/{id}/weather-hold"
        actor: WineryOperator | ComplianceOfficer | Consumer
        preconditions:
          - "ClubSubscription.status == ACTIVE"
          - "hold_release_date > hold_start_date"
          - "last_hold_release_date is null OR hold_start_date >= last_hold_release_date + HOLD_BUFFER_DAYS days"
        side_effects:
          - "hold_start_date, hold_release_date and hold_reason recorded"
          - "next_run_date is left untouched; the club run is what defers it"
      - from: WEATHER_HELD
        to: ACTIVE
        trigger: "POST /dtc/club-subscriptions/{id}/release-hold"
        actor: WineryOperator | ComplianceOfficer
        preconditions:
          - "ClubSubscription.status == WEATHER_HELD"
        side_effects:
          - "last_hold_release_date = hold_release_date; hold_start_date, hold_release_date and hold_reason are cleared to null"
        note: "Closes the ACTIVE -> WEATHER_HELD -> ACTIVE cycle."
      - from: WEATHER_HELD
        to: ACTIVE
        trigger: "system evaluation inside POST /dtc/club-runs when hold_release_date <= run_date"
        actor: system
        preconditions:
          - "ClubSubscription.status == WEATHER_HELD and hold_release_date <= run_date"
        side_effects:
          - "same field clearing as the manual release, then the subscription participates in the same run"
      - from: ACTIVE
        to: SUSPENDED_COMPLIANCE
        trigger: "system evaluation inside POST /dtc/club-runs when the generated Order lands in compliance_status REJECTED and missed_run_count reaches MISSED_RUN_SUSPEND_THRESHOLD"
        actor: system
        preconditions:
          - "ClubSubscription.status == ACTIVE"
          - "missed_run_count + 1 >= MISSED_RUN_SUSPEND_THRESHOLD"
        side_effects:
          - "missed_run_count += 1; next_run_date = null"
          - "Winery.suspended_subscription_count recomputed; Winery.version increments by 1"
      - from: ACTIVE
        to: SUSPENDED_COMPLIANCE
        trigger: "system cascade hop 2 from StatePermit ACTIVE -> REVOKED"
        actor: system
        preconditions:
          - "ClubSubscription.status == ACTIVE"
          - "an Order naming this subscription transitioned CLEARED -> SUSPENDED_PERMIT in hop 1 of the same cascade"
        side_effects:
          - "next_run_date = null"
          - "Winery.suspended_subscription_count recomputed; Winery.version increments by 1"
      - from: SUSPENDED_COMPLIANCE
        to: ACTIVE
        trigger: "POST /dtc/club-subscriptions/{id}/release-hold with reset_missed_runs true"
        actor: ComplianceOfficer
        preconditions:
          - "ClubSubscription.status == SUSPENDED_COMPLIANCE"
          - "the acting role is ComplianceOfficer — a WineryOperator attempt is rejected with ERR_COMPLIANCE_REINSTATE_FORBIDDEN"
        side_effects:
          - "missed_run_count = 0; next_run_date = logical clock date"
          - "Winery.suspended_subscription_count recomputed; Winery.version increments by 1"

  - entity: CarrierEnrollment
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /dtc/carrier-enrollments/{id}/decision with decision APPROVED"
        actor: CarrierAgent
        preconditions:
          - "CarrierEnrollment.status in {PENDING, SUSPENDED}"
        side_effects:
          - "approved_at = logical clock; decided_by_user_id = X-User-ID"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /dtc/carrier-enrollments/{id}/decision with decision SUSPENDED"
        actor: CarrierAgent
        preconditions:
          - "CarrierEnrollment.status == APPROVED"
        side_effects:
          - "decided_by_user_id = X-User-ID; new labels against this enrollment are refused with ERR_CARRIER_NOT_ENROLLED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /dtc/carrier-enrollments/{id}/decision with decision APPROVED"
        actor: CarrierAgent
        preconditions:
          - "CarrierEnrollment.status == SUSPENDED"
        side_effects:
          - "approved_at = logical clock"
        note: "Closes the APPROVED -> SUSPENDED -> APPROVED cycle."
      - from: APPROVED
        to: SUSPENDED
        trigger: "system supersede during POST /dtc/carrier-enrollments for the same (winery_id, carrier_program_id)"
        actor: system
        preconditions:
          - "an existing CarrierEnrollment for the same (winery_id, carrier_program_id) has status APPROVED"
        side_effects:
          - "the prior enrollment is SUSPENDED so exactly one enrollment per (winery, program) can be APPROVED"
          - "Winery.version increments by 1"

  - entity: Winery
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /dtc/wineries/{id}/status with status SUSPENDED"
        actor: PlatformAdmin
        preconditions:
          - "Winery.status == ACTIVE"
        side_effects:
          - "suspension_reason recorded; POST /dtc/orders and POST /dtc/club-runs for this winery are refused with ERR_WINERY_SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /dtc/wineries/{id}/status with status ACTIVE"
        actor: PlatformAdmin
        preconditions:
          - "Winery.status == SUSPENDED"
        side_effects:
          - "suspension_reason = null"

  - entity: TaxRemittance
    initial_state: OPEN
    terminal_states: [REMITTED, AMENDED]
    transitions:
      - from: OPEN
        to: FILED
        trigger: "POST /dtc/remittances/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "TaxRemittance.status == OPEN"
          - "shipment_count > 0 OR the governing StateRule.zero_filing_required == true"
        side_effects:
          - "filed_at = logical clock; filed_by_user_id = X-User-ID"
      - from: FILED
        to: REMITTED
        trigger: "POST /dtc/remittances/{id}/remit"
        actor: ComplianceOfficer
        preconditions:
          - "TaxRemittance.status == FILED"
          - "X-User-ID != TaxRemittance.filed_by_user_id"
        side_effects:
          - "remitted_at = logical clock; remitted_by_user_id = X-User-ID; payment_reference recorded"
      - from: FILED
        to: AMENDED
        trigger: "system supersede during POST /dtc/remittances carrying supersedes_remittance_id equal to this row's id"
        actor: system
        preconditions:
          - "TaxRemittance.status == FILED"
        side_effects:
          - "the superseded row becomes AMENDED and is excluded from the period-overlap check thereafter"
          - "the new row is created in OPEN with freshly computed amounts"

# ============================================================================
# 1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ============================================================================
concurrency_rules:
  - rule_id: order-create-stale-consumer
    parent_entity: Consumer
    write_endpoint: "POST /dtc/orders"
    occ_field: "expected_consumer_version"
    description: |
      Creating an Order for a Consumer whose version has advanced past the value
      the client last observed is rejected with 412. Order creation reserves part
      of the consumer's rolling volume headroom, so a second create issued from a
      stale read of the consumer would size its headroom against a superseded
      picture; under the product semantics that second order is otherwise
      perfectly lawful, which is exactly why the stale-version check — and not a
      state precondition — is what rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: enrollment-create-stale-winery
    parent_entity: Winery
    write_endpoint: "POST /dtc/carrier-enrollments"
    occ_field: "expected_winery_version"
    description: |
      Creating a CarrierEnrollment supersedes any APPROVED enrollment the winery
      already holds on the same carrier program (that prior row is SUSPENDED by
      the same call). A create issued from a stale read of the winery would
      supersede an enrollment the client never saw, so the write is rejected with
      412 when expected_winery_version does not match Winery.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: order_charge_evaluation_chain
    trigger: "POST /dtc/orders — every monetary field of the Order and of each OrderLine is computed once, at creation, from the governing StateRule (selected by ship_to_state_code) and the Winery"
    algorithm: constraint_propagation
    formula: |
      # The twelve steps below are the PINNED evaluation order. The chain looks
      # circular because step 11's waiver decision reads a total that step 12
      # then grows; it is well defined because the comparison is pinned to
      # pre_fee_total_cents, NOT to total_cents.
      step 1  for each line i (line_index = its 1-based position in the request array):
                 line_liters[i]        = round_half_up(bottles[i] * bottle_ml[i] / 1000, 3)
                 line_subtotal_cents[i]= bottles[i] * unit_price_cents[i]
      step 2  total_liters   = round_half_up(sum(line_liters), 3)
              subtotal_cents = sum(line_subtotal_cents)
      step 3  shipping_gross_cents = round_half_up(SHIPPING_BASE_CENTS
                                     + SHIPPING_PER_LITER_CENTS * total_liters, 0)
      step 4  tier_multiplier = 1.00 if total_liters <= LITER_TIER_1_MAX_L
                                0.90 if LITER_TIER_1_MAX_L < total_liters <= LITER_TIER_2_MAX_L
                                0.80 if total_liters > LITER_TIER_2_MAX_L
      step 5  shipping_tiered_cents = round_half_up(shipping_gross_cents * tier_multiplier, 0)
      step 6  shipping_discount_cents = round_half_up(shipping_tiered_cents
                                          * CLUB_SHIPPING_DISCOUNT_BPS / 10000, 0)
                                        if club_subscription_id is not null else 0
      step 7  shipping_cents = shipping_tiered_cents - shipping_discount_cents
      step 8  excise_tax_cents = calculations.order_excise_tax_cents   # needs total_liters only
      step 9  sales_tax_cents  = calculations.order_sales_tax_cents    # needs shipping_cents and excise_tax_cents
      step 10 pre_fee_total_cents = subtotal_cents + shipping_cents
                                    + excise_tax_cents + sales_tax_cents
      step 11 compliance_handling_fee_cents =
                 0                             if pre_fee_total_cents >= FEE_WAIVER_THRESHOLD_CENTS
                 COMPLIANCE_HANDLING_FEE_CENTS otherwise
      step 12 total_cents = pre_fee_total_cents + compliance_handling_fee_cents
    input_set: "the order's own lines only; no other Order, Shipment or ledger row participates. The StateRule is the single row whose state_code == Order.ship_to_state_code; the Winery is Order.winery_id."
    constants:
      SHIPPING_BASE_CENTS: 1500
      SHIPPING_PER_LITER_CENTS: 220
      LITER_TIER_1_MAX_L: 9.000
      LITER_TIER_2_MAX_L: 18.000
      CLUB_SHIPPING_DISCOUNT_BPS: 2500
      FEE_WAIVER_THRESHOLD_CENTS: 20000
      COMPLIANCE_HANDLING_FEE_CENTS: 900
    precision: "liters: 3 decimal places, round_half_up. Money: whole cents, round_half_up at every step named above; never round twice over the same intermediate."
    variants:
      - name: PINNED_PRE_FEE_WAIVER
        when: "always — this is the only sanctioned order"
        difference: "the waiver comparison at step 11 reads pre_fee_total_cents. Comparing total_cents instead (i.e. adding the fee first, then testing) flips the decision for any order whose pre_fee_total_cents is in [FEE_WAIVER_THRESHOLD_CENTS - COMPLIANCE_HANDLING_FEE_CENTS, FEE_WAIVER_THRESHOLD_CENTS): the fee would be waived and total_cents would come out 900 cents lower."
      - name: PINNED_TIER_BEFORE_CLUB_DISCOUNT
        when: "always"
        difference: "the liter-tier multiplier is applied to the gross shipping charge BEFORE the club discount (steps 5 then 6). Applying the club discount first and the tier multiplier second yields a different cent value whenever both are non-trivial, because each step rounds half-up independently."

  - name: order_excise_tax_cents
    trigger: "step 8 of calculations.order_charge_evaluation_chain during POST /dtc/orders"
    algorithm: threshold
    formula: |
      base_cents      = round_half_up(total_liters * StateRule.excise_rate_per_liter_cents, 0)
      large_format_l  = round_half_up(sum(line_liters[i] where bottle_ml[i] > 1500), 3)
      surcharge_cents = round_half_up(large_format_l
                          * StateRule.large_format_surcharge_cents_per_liter, 0)
      gross_cents     = base_cents + surcharge_cents
      credit_bps      = SMALL_PRODUCER_CREDIT_BPS
                          if Winery.annual_production_gallons <= SMALL_PRODUCER_MAX_GALLONS
                          else 0
      credited_cents  = gross_cents - round_half_up(gross_cents * credit_bps / 10000, 0)
      excise_tax_cents = min(credited_cents, StateRule.excise_cap_cents_per_shipment)
    input_set: "the order's own lines. The large-format surcharge counts ONLY lines with bottle_ml STRICTLY greater than 1500 — a 1500 ml line contributes zero surcharge liters."
    constants:
      SMALL_PRODUCER_MAX_GALLONS: 250000
      SMALL_PRODUCER_CREDIT_BPS: 1500
    precision: "whole cents, round_half_up; the credit is rounded before subtraction, and the cap is applied last (after the credit, never before)."

  - name: order_sales_tax_cents
    trigger: "step 9 of calculations.order_charge_evaluation_chain during POST /dtc/orders"
    algorithm: waterfall_allocation
    formula: |
      rate_bps   = StateRule.sales_tax_rate_bps
      alloc_pool = (shipping_cents      if StateRule.tax_on_shipping    else 0)
                 + (excise_tax_cents    if StateRule.excise_in_tax_base else 0)
      # 1. floor each line's pro-rata share of the pool by liters
      for each line i: raw_share[i]       = alloc_pool * line_liters[i] / total_liters
                       allocated[i]       = floor(raw_share[i])
      remainder = alloc_pool - sum(allocated)
      # 2. hand out the remaining whole cents one at a time, walking the lines
      #    ordered by line_liters DESC, then line_index ASC. Never by id.
      for k in 0 .. remainder-1: allocated[order_by(line_liters DESC, line_index ASC)[k]] += 1
      # 3. tax EACH line, round EACH line, THEN sum. This order is pinned.
      for each line i: line_taxable_cents[i]   = line_subtotal_cents[i] + allocated[i]
                       line_sales_tax_cents[i] = round_half_up(line_taxable_cents[i]
                                                   * rate_bps / 10000, 0)
      sales_tax_cents = sum(line_sales_tax_cents)
    input_set: "all lines of this order. The compliance handling fee NEVER enters the sales-tax base. When rate_bps == 0 every line's line_sales_tax_cents is 0 and allocation still runs (allocated shares are recorded for audit)."
    constants: {}
    precision: |
      Whole cents. ROUND PER LINE THEN SUM — round_half_up on each
      line_sales_tax_cents, then add. Summing the taxable bases first and
      rounding once (round_half_up(sum(line_taxable_cents) * rate_bps / 10000))
      is a DIFFERENT number: two lines of 10008 taxable cents at 825 bps give
      826 + 826 = 1652 per-line, but 1651 sum-then-round. Remainder cents are
      floor-allocated, never rounded.

  - name: consumer_rolling_volume_liters
    trigger: "recomputed whenever a VolumeLedgerEntry is appended (order clearance, return-to-sender credit, re-ship re-debit, manual adjustment) and read by validations priority 80 during POST /dtc/orders/{id}/screen"
    algorithm: aggregation
    formula: |
      window(state) = per StateRule.per_consumer_period of that state:
        ROLLING_12_MONTHS: occurred_at >= clock_now - 365 days  (inclusive)
                           AND occurred_at <= clock_now
        ROLLING_30_DAYS:   occurred_at >= clock_now - 30 days   (inclusive)
                           AND occurred_at <= clock_now
        CALENDAR_YEAR:     occurred_at >= January 1 00:00:00.000Z of clock_now's year
                           AND occurred_at <= clock_now
      rolling_liters_by_state[state] =
        round_half_up(sum(e.liters for e in VolumeLedgerEntry
                          where e.consumer_id == Consumer.id
                            and e.state_code == state
                            and e.occurred_at in window(state)), 3)
      rolling_liters_settled_by_state[state] = same sum restricted to entries whose
        order_id is null OR whose Order.fulfillment_status in {IN_TRANSIT, DELIVERED, RETURNED}
      # the screening limit check uses rolling_liters_by_state (ALL statuses, so a
      # cleared-but-unlabelled order still consumes headroom); only the SCREENING
      # risk variant uses rolling_liters_settled_by_state.
    input_set: "every VolumeLedgerEntry of the consumer for that state whose occurred_at falls in the window, regardless of event_type; SHIPMENT_ACCEPTED adds, RETURN_CREDIT subtracts, MANUAL_ADJUSTMENT does either by sign. Entries are aggregated by occurred_at, never by created_at."
    constants:
      ROLLING_12_MONTHS_DAYS: 365
      ROLLING_30_DAYS_DAYS: 30
    precision: "3 decimal places, round_half_up; a window boundary is INCLUSIVE at the lower edge (occurred_at exactly clock_now - 365 days is counted)."

  - name: winery_annual_state_volume_liters
    trigger: "read by validations priority 85 during POST /dtc/orders/{id}/screen"
    algorithm: aggregation
    formula: |
      year_start = January 1 00:00:00.000Z of clock_now's calendar year
      winery_annual_state_liters(winery, state) =
        round_half_up(sum(e.liters for e in VolumeLedgerEntry
                          where e.winery_id == winery
                            and e.state_code == state
                            and e.occurred_at >= year_start
                            and e.occurred_at <= clock_now), 3)
    input_set: "all consumers' entries for that (winery, state) inside the calendar year of the logical clock, all event_types, signed."
    constants: {}
    precision: "3 decimal places, round_half_up. The window is always the calendar year regardless of StateRule.per_consumer_period."

  - name: consumer_compliance_risk_score
    trigger: "recomputed on every VolumeLedgerEntry append, on every ComplianceException DENIED decision, and on every Order fulfillment_status change; read by validations priority 95 during POST /dtc/orders/{id}/screen and surfaced by GET /dtc/consumers/{id}/volume-summary"
    algorithm: weighted_scoring
    formula: |
      # utilisation state selection: among the states present in the relevant
      # liters map, pick the one with the greatest liters / per_consumer_limit_liters
      # ratio; tie-break by state_code ASC. Empty map -> f3 = 0.
      f1 = min(40, RETURN_WEIGHT   * return_credit_count_in_scope)
      f2 = min(30, DENIAL_WEIGHT   * denied_exception_count_in_scope)
      f3 = min(30, floor(30 * selected_liters / selected_state_limit_liters))
      score = min(100, f1 + f2 + f3)
    input_set: "see variants — the two variants differ ONLY in which ledger entries and exceptions are in scope."
    constants:
      RETURN_WEIGHT: 10
      DENIAL_WEIGHT: 15
      ELEVATED_TIER_THRESHOLD: 50
    precision: "integer score, floor on f3, min-capped per factor then min-capped at 100. screening_tier = ELEVATED when risk_score_screening >= ELEVATED_TIER_THRESHOLD, else STANDARD."
    variants:
      - name: SCREENING
        when: "written to Consumer.risk_score_screening; the ONLY variant that gates an operation (validations priority 95)"
        difference: "scope = ledger entries inside window(state) per StateRule.per_consumer_period AND whose order_id is null or whose Order.fulfillment_status is in {IN_TRANSIT, DELIVERED, RETURNED}; f3 reads rolling_liters_settled_by_state. Exceptions in scope are those decided inside the same window. A cleared order still sitting at fulfillment_status UNFULFILLED or LABELED is invisible to this variant."
      - name: AUDIT
        when: "written to Consumer.risk_score_audit; reporting only, never gates anything"
        difference: "scope = ALL ledger entries of the consumer for all time and ALL DENIED exceptions for all time, regardless of the source Order's fulfillment_status; f3 reads the all-time all-status liters per state. For a consumer holding a 22.500 L adjustment dated outside the rolling window plus one CLEARED but UNFULFILLED 4.500 L order against a 27.000 L limit, SCREENING scores 0 while AUDIT scores 30."

  - name: remittance_due_amounts
    trigger: "POST /dtc/remittances — computed once at creation from the basis field and frozen onto the row"
    algorithm: forward_looking
    formula: |
      period = [period_start, period_end)          # half-open, always
      selected = per variant (see below), restricted to Order.winery_id == winery_id
                 and Order.ship_to_state_code == state_code
      excise_accrued_cents   = sum(o.excise_tax_cents for o in selected)
      sales_tax_accrued_cents= sum(o.sales_tax_cents  for o in selected)
      reversed = [o for o in selected if o.returned_at is not null
                                     and o.returned_at < period_end]
      excise_reversed_cents    = sum(o.excise_tax_cents for o in reversed)
      sales_tax_reversed_cents = sum(o.sales_tax_cents  for o in reversed)
      excise_due_cents    = excise_accrued_cents    - excise_reversed_cents
      sales_tax_due_cents = sales_tax_accrued_cents - sales_tax_reversed_cents
      liters_total    = round_half_up(sum(o.total_liters for o in selected), 3)
      shipment_count  = count(selected)
      included_order_ids = ids of selected ordered by cleared_at ASC, then created_at ASC
    input_set: "Orders of the winery for the state; superseded (AMENDED) remittances never affect the numbers, which are recomputed from Orders every time."
    constants: {}
    precision: "whole cents; liters 3 decimal places, round_half_up. Interval is half-open: an order whose key date equals period_end is NOT included."
    variants:
      - name: ACCRUAL_BASIS
        when: "basis == ACCRUAL_BASIS"
        difference: "selected = Orders with compliance_status == CLEARED and cleared_at in [period_start, period_end). An order cleared on 2026-07-28 but delivered 2026-08-03 IS in the July MONTHLY period."
      - name: DELIVERY_BASIS
        when: "basis == DELIVERY_BASIS"
        difference: "selected = Orders that have a Shipment with status DELIVERED whose delivered_at is in [period_start, period_end). The same 2026-07-28 order is NOT in the July period. For two identical 4.500 L / 211-cent-excise orders cleared 2026-07-10 and 2026-07-28 but delivered 2026-07-20 and 2026-08-03, the July MONTHLY period yields excise_due_cents 422 on ACCRUAL_BASIS and 211 on DELIVERY_BASIS."

  - name: permit_renewal_calendar
    trigger: "GET /dtc/renewal-calendar"
    algorithm: projection
    formula: |
      for each StatePermit of the winery whose status in {PENDING, ACTIVE, RENEWAL_FILED, EXPIRED}:
        renewal_due_date = expiration_date - StateRule.renewal_lead_days days
        calendar_status  = OVERDUE if renewal_due_date < clock_date
                                      and StatePermit.status != RENEWAL_FILED
                           FILED   if StatePermit.status == RENEWAL_FILED
                           DUE     if renewal_due_date <= clock_date + horizon_days days
                           SCHEDULED otherwise
        included when calendar_status in {OVERDUE, FILED, DUE}
      for each such permit's StateRule:
        MONTHLY: report_period = the most recent complete calendar month
                 [first day of previous month, first day of clock month)
                 report_due_date = the 15th of the clock month
        ANNUAL:  report_period = the most recent complete calendar year
                 [Jan 1 of previous year, Jan 1 of clock year)
                 report_due_date = January 31 of the clock year
        report_filed = true when a TaxRemittance exists for
                 (winery, state_code, period_type, period_start, period_end)
                 with status in {FILED, REMITTED}
      permits_expiring ordered by renewal_due_date ASC, then state_code ASC
      reports_due      ordered by report_due_date ASC, then state_code ASC
    input_set: "StatePermits of the requested winery only; REVOKED permits are excluded entirely."
    constants:
      DEFAULT_HORIZON_DAYS: 90
    precision: "whole days on the logical clock's UTC date; date arithmetic is calendar-day arithmetic, not 30-day months."

  - name: club_run_selection
    trigger: "POST /dtc/club-runs"
    algorithm: chronological
    formula: |
      # (a) eligibility filter
      candidates = ClubSubscription where winery_id == request winery_id
                     and status in {ACTIVE, WEATHER_HELD}
                     and next_run_date is not null
                     and next_run_date <= run_date
                     and remaining_allotment >= 1
      # remaining_allotment = annual_allotment - consumed_shipments; a
      # subscription with 0 remaining is silently skipped (counted in
      # skipped_subscription_ids) and its next_run_date is left untouched.
      # WEATHER_HELD candidates whose hold_release_date <= run_date are released
      # first (system WEATHER_HELD -> ACTIVE) and then processed; WEATHER_HELD
      # candidates whose hold_release_date > run_date are SKIPPED and their
      # next_run_date is set to hold_release_date.
      # (b) ranking / processing order
      process in order: next_run_date ASC, then bottles_per_shipment DESC,
                        then created_at ASC        # never by id
      # (c) tie-break: created_at ASC is the final tie-break
      # (d) empty candidate set -> HTTP 200 with generated_count 0 and
      #     generated_order_ids [] ; never an error
      for each processed subscription:
        create an Order for (consumer_id, winery_id) with club_subscription_id set,
          ship_to_* copied from the Consumer's default address, and ONE line
          {sku, bottle_ml, bottles: bottles_per_shipment, unit_price_cents}
          -> the full order_charge_evaluation_chain runs
        immediately screen it exactly as POST /dtc/orders/{id}/screen would
        if the screened order is REJECTED:
            missed_run_count += 1 ; next_run_date unchanged
            if missed_run_count >= MISSED_RUN_SUSPEND_THRESHOLD:
                status = SUSPENDED_COMPLIANCE ; next_run_date = null
        else:                             # CLEARED or OVERRIDE_PENDING
            # consumed_shipments is NOT touched here: the DRAFT -> CLEARED
            # side effect of §1.2 already incremented it (and an
            # OVERRIDE_PENDING order deliberately consumes no allotment
            # until its exception is APPROVED). The run never double-counts.
            next_run_date = advance(next_run_date, cadence)
      advance(d, MONTHLY)   = same day-of-month one month later, clamped to that
                              month's last day
      advance(d, QUARTERLY) = same day-of-month three months later, same clamping
    input_set: "subscriptions of the requested winery only; a SUSPENDED_COMPLIANCE subscription is never a candidate (its next_run_date is null)."
    constants:
      MISSED_RUN_SUSPEND_THRESHOLD: 2
      HOLD_BUFFER_DAYS: 3
    precision: "whole calendar days; run_date is the request's run_date, which MUST be <= the logical clock date."

# ============================================================================
# 1.4 Validation Rules Table (ordered by priority — lowest number wins)
# ============================================================================
# Priorities 40..95 are the SCREENING LADDER evaluated by
# POST /dtc/orders/{id}/screen. That endpoint returns HTTP 200 and RECORDS the
# lowest-numbered failing rule's error_id in Order.rejection_error_id (see
# §1.2 Order.compliance_status); it does not emit an error envelope. The same
# error_ids ARE raised as real HTTP errors by the label-time re-verification on
# POST /dtc/shipments and by the two guarded write endpoints noted per rule.
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "ownership scoping — when X-User-Role is Consumer, X-User-ID must equal the Consumer.id reached through the target resource (Consumer.id itself, Order.consumer_id, ClubSubscription.consumer_id, VolumeLedgerEntry.consumer_id); when X-User-Role is WineryOperator, X-User-ID must equal the Winery.id reached through the target resource (Winery.id, StatePermit.winery_id, CarrierEnrollment.winery_id, Order.winery_id, Shipment -> Order.winery_id, ClubSubscription.winery_id, TaxRemittance.winery_id)"
    error_id: ERR_FORBIDDEN_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint whose roles include Consumer or WineryOperator"

  - priority: 10
    category: existence
    check: "every {id} path parameter resolves to a stored row, validated left-to-right; error_id is the one for the entity of the segment that failed"
    error_id: ERR_WINERY_NOT_FOUND | ERR_STATE_RULE_NOT_FOUND | ERR_STATE_PERMIT_NOT_FOUND | ERR_CARRIER_PROGRAM_NOT_FOUND | ERR_CARRIER_ENROLLMENT_NOT_FOUND | ERR_CONSUMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_COMPLIANCE_EXCEPTION_NOT_FOUND | ERR_CLUB_SUBSCRIPTION_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND | ERR_VOLUME_LEDGER_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints carrying a path parameter"

  - priority: 15
    category: existence
    check: "request body schema — every required input field is present and non-null; every field has the declared type; enum fields carry a declared member; numeric fields respect their constraints (bottles >= 1, bottle_ml in {375,500,750,1000,1500,3000}, unit_price_cents >= 1, lines array length >= 1 and <= 20, sales_tax_rate_bps 0..2000, period_start < period_end, horizon_days 1..365, run_date is a valid ISO date); unknown fields are ignored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 20
    category: existence
    check: "every FK named in the request BODY resolves to a stored row (winery_id, state_rule_id, consumer_id, carrier_program_id, carrier_enrollment_id, order_id, shipment_id, club_subscription_id, replacement_of_shipment_id, supersedes_remittance_id); ship_to_state_code must have a StateRule row"
    error_id: ERR_WINERY_NOT_FOUND | ERR_STATE_RULE_NOT_FOUND | ERR_CONSUMER_NOT_FOUND | ERR_CARRIER_PROGRAM_NOT_FOUND | ERR_CARRIER_ENROLLMENT_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CLUB_SUBSCRIPTION_NOT_FOUND | ERR_REMITTANCE_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields in the body"

  - priority: 25
    category: state
    check: "optimistic concurrency — the supplied expected_<parent>_version equals the parent's current version (see §1.2.1: expected_consumer_version on POST /dtc/orders, expected_winery_version on POST /dtc/carrier-enrollments)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /dtc/orders, POST /dtc/carrier-enrollments"

  - priority: 30
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2; the specific error_id names the offending resource kind"
    error_id: ERR_INVALID_STATE_TRANSITION | ERR_ORDER_ALREADY_SCREENED | ERR_ORDER_NOT_CLEARED | ERR_EXCEPTION_ALREADY_DECIDED | ERR_ENROLLMENT_ALREADY_DECIDED | ERR_SHIPMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "all POST action endpoints (activate, file-renewal, approve-renewal, revoke, decision, screen, scan, weather-hold, release-hold, file, remit, status) plus POST /dtc/shipments and POST /dtc/orders/{id}/compliance-exceptions"

  - priority: 32
    category: state
    check: "the owning Winery.status is ACTIVE — a SUSPENDED winery cannot create orders, label shipments, file renewals or open club subscriptions"
    error_id: ERR_WINERY_SUSPENDED
    http_status: 409
    applies_to: "POST /dtc/orders, POST /dtc/shipments, POST /dtc/club-subscriptions, POST /dtc/state-permits/{id}/file-renewal, POST /dtc/club-runs"

  - priority: 34
    category: auth
    check: "compliance-suspension authority — lifting a SUSPENDED_COMPLIANCE ClubSubscription (release-hold with reset_missed_runs true) is reserved to ComplianceOfficer; a WineryOperator may only release its own WEATHER_HELD subscriptions"
    error_id: ERR_COMPLIANCE_REINSTATE_FORBIDDEN
    http_status: 403
    applies_to: "POST /dtc/club-subscriptions/{id}/release-hold"

  - priority: 35
    category: state
    check: "segregation of duties on X-User-ID — the ComplianceOfficer who decides a ComplianceException must not be the X-User-ID recorded in ComplianceException.requested_by_user_id, and the ComplianceOfficer who remits a TaxRemittance must not be the X-User-ID recorded in TaxRemittance.filed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /dtc/compliance-exceptions/{id}/decision, POST /dtc/remittances/{id}/remit"

  # ---- screening ladder: priorities 40..95 ---------------------------------
  - priority: 40
    category: business_safety
    check: "the destination StateRule.allows_dtc is true — the state permits direct-to-consumer wine shipment at all"
    error_id: ERR_STATE_DTC_PROHIBITED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 45
    category: business_safety
    check: "no ProhibitedZip row of the destination StateRule matches the order — a row matches when its zip_code equals Order.ship_to_zip and its effective_from is on or before the logical clock date. Dry-county blocks are carried as ProhibitedZip rows with reason DRY_COUNTY, so a dry county is enforced through the ZIPs enumerated for it; rows whose effective_from is strictly after the clock date are ignored."
    error_id: ERR_PROHIBITED_DESTINATION
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised — the ZIP list may have grown since clearance)"

  - priority: 50
    category: business_safety
    check: "the Consumer is of legal purchasing age in the destination state at the logical clock date — completed whole years between Consumer.birthdate and the clock date (calendar-anniversary arithmetic: the birthday itself counts) must be >= StateRule.min_purchaser_age"
    error_id: ERR_CONSUMER_UNDERAGE
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 55
    category: business_safety
    check: "Consumer.id_verified_at is not null — government-ID verification has been recorded through POST /dtc/consumers/{id}/id-verification"
    error_id: ERR_ID_VERIFICATION_REQUIRED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 60
    category: business_temporal
    check: "a StatePermit row exists for (Order.winery_id, Order.ship_to_state_code) in any status other than REVOKED"
    error_id: ERR_PERMIT_MISSING_FOR_STATE
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 62
    category: business_temporal
    check: "that StatePermit.status is ACTIVE — PENDING, RENEWAL_FILED and REVOKED permits do not authorize a clearance"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 64
    category: business_temporal
    check: "that StatePermit has not lapsed — effective_date <= clock date AND clock date <= expiration_date, both inclusive. Observing a lapse also drives the ACTIVE -> EXPIRED system transition of §1.2 before the error_id is recorded/raised."
    error_id: ERR_PERMIT_EXPIRED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 66
    category: business_temporal
    check: "permit period exclusivity — a new StatePermit's CLOSED interval [effective_date, expiration_date] must not overlap any non-REVOKED StatePermit of the same (winery_id, state_code). Sharing an endpoint IS an overlap: a new permit starting exactly on an existing permit's expiration_date collides."
    error_id: ERR_PERMIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /dtc/state-permits"

  - priority: 68
    category: business_temporal
    check: "remittance period exclusivity — a new TaxRemittance's HALF-OPEN interval [period_start, period_end) must not overlap any TaxRemittance of the same (winery_id, state_code, period_type, basis) whose status is not AMENDED — the two bases are separate filing families, so the same period may be opened once per basis. Adjacency is allowed: a period starting exactly on an existing period's period_end is accepted. The scoping is type-scoped, so a MONTHLY period nested inside an ANNUAL period never collides. A request carrying supersedes_remittance_id is exempt against the row it supersedes."
    error_id: ERR_REMITTANCE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /dtc/remittances"

  - priority: 69
    category: business_temporal
    check: "weather-hold spacing — the requested hold_start_date must be on or after ClubSubscription.last_hold_release_date + HOLD_BUFFER_DAYS (3) days when last_hold_release_date is not null, and hold_release_date must be strictly after hold_start_date"
    error_id: ERR_HOLD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /dtc/club-subscriptions/{id}/weather-hold"

  - priority: 70
    category: business_referential
    check: "when StateRule.requires_carrier_program is true, the winery holds a CarrierEnrollment in status APPROVED whose CarrierProgram.states_served contains Order.ship_to_state_code"
    error_id: ERR_CARRIER_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 72
    category: business_referential
    check: "when Order.adult_signature_required is true, that enrollment's CarrierProgram.adult_signature_service_code must be non-null — a program without an adult-signature service cannot carry a signature-required shipment"
    error_id: ERR_ADULT_SIGNATURE_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/shipments (raised)"

  - priority: 74
    category: business_constraint
    check: "prohibited-ZIP uniqueness — (state_rule_id, zip_code) must not duplicate an existing ProhibitedZip row"
    error_id: ERR_DUPLICATE_PROHIBITED_ZIP
    http_status: 409
    applies_to: "POST /dtc/state-rules/{id}/prohibited-zips"

  - priority: 76
    category: business_constraint
    check: "reroute containment — a REROUTE_ACCEPTED scan's reroute_state_code must equal the SAME ship_to_state_code the order already cleared against; a cross-state reroute is refused because it would invalidate the permit, tax and volume decisions already frozen on the order"
    error_id: ERR_REROUTE_STATE_CHANGE
    http_status: 422
    applies_to: "POST /dtc/shipments/{id}/scan with scan_type REROUTE_ACCEPTED"

  - priority: 78
    category: business_constraint
    check: "club-run dating — the requested run_date must be on or before the logical clock date"
    error_id: ERR_RUN_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /dtc/club-runs"

  - priority: 80
    category: business_fiscal
    check: "per-consumer volume headroom — calculations.consumer_rolling_volume_liters for (consumer, destination state) PLUS this order's total_liters must be <= StateRule.per_consumer_limit_liters. Equality clears; exceeding by any amount fails. OVERRIDABLE."
    error_id: ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/volume-ledger-entries (raised — a positive MANUAL_ADJUSTMENT may not push a consumer past the state limit)"

  - priority: 85
    category: business_fiscal
    check: "per-winery volume headroom — calculations.winery_annual_state_volume_liters for (winery, destination state) PLUS this order's total_liters must be <= StateRule.per_winery_annual_limit_liters. Equality clears. OVERRIDABLE."
    error_id: ERR_WINERY_VOLUME_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/volume-ledger-entries (raised)"

  - priority: 90
    category: business_fiscal
    check: "filing substance — POST /dtc/remittances/{id}/file requires shipment_count >= 1 unless the governing StateRule.zero_filing_required is true, in which case an empty period may be filed"
    error_id: ERR_NOTHING_TO_REMIT
    http_status: 422
    applies_to: "POST /dtc/remittances/{id}/file"

  - priority: 95
    category: business_safety
    check: "risk gate — Consumer.screening_tier must be STANDARD; an ELEVATED consumer (risk_score_screening >= 50) requires manual compliance review. OVERRIDABLE."
    error_id: ERR_ELEVATED_RISK_REVIEW_REQUIRED
    http_status: 422
    applies_to: "POST /dtc/orders/{id}/screen (recorded), POST /dtc/club-subscriptions (raised — no new club subscription may be opened for an ELEVATED consumer)"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
# Every path parameter is named {id}. Every list endpoint accepts limit/offset
# and answers with the pagination fields declared in response_envelope.
endpoints:
  # ---- Winery -------------------------------------------------------------
  - method: POST
    path: "/dtc/wineries"
    description: "register a winery; status starts ACTIVE and every accrual counter starts 0"
    roles: [PlatformAdmin]
    code: 201
    input: [name, ttb_permit_number, home_state_code, annual_production_gallons]
    output: Winery
    side_effects: ["Winery created in status ACTIVE with version 1"]

  - method: GET
    path: "/dtc/wineries/{id}"
    description: "read one winery, including the excise accrual/reversal counters and version for OCC"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: []
    output: Winery
    side_effects: []

  - method: GET
    path: "/dtc/wineries"
    description: "list wineries"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["home_state_code?", "status?", "limit?", "offset?"]
    output: Winery[]
    side_effects: []

  - method: POST
    path: "/dtc/wineries/{id}/status"
    description: "suspend or reinstate a winery (Winery state machine)"
    roles: [PlatformAdmin]
    code: 200
    input: [status, "suspension_reason?"]
    output: Winery
    side_effects: ["Winery.status set; Winery.suspension_reason recorded or cleared; Winery.version += 1"]

  # ---- StateRule / ProhibitedZip -----------------------------------------
  - method: POST
    path: "/dtc/state-rules"
    description: "declare the compliance configuration of one destination state"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, allows_dtc, per_consumer_limit_liters, per_consumer_period, per_winery_annual_limit_liters, excise_rate_per_liter_cents, large_format_surcharge_cents_per_liter, excise_cap_cents_per_shipment, sales_tax_rate_bps, tax_on_shipping, excise_in_tax_base, adult_signature_required, requires_carrier_program, reporting_frequency, zero_filing_required, "min_purchaser_age?", "renewal_lead_days?"]
    output: StateRule
    side_effects: []

  - method: GET
    path: "/dtc/state-rules/{id}"
    description: "read one state rule"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: []
    output: StateRule
    side_effects: []

  - method: GET
    path: "/dtc/state-rules"
    description: "list state rules"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: ["state_code?", "allows_dtc?", "limit?", "offset?"]
    output: StateRule[]
    side_effects: []

  - method: POST
    path: "/dtc/state-rules/{id}/prohibited-zips"
    description: "add a prohibited ZIP (reason PROHIBITED_MUNICIPALITY, PO_BOX_ONLY or CARRIER_UNSERVED) or a dry-county ZIP (reason DRY_COUNTY) to a state rule"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [zip_code, reason, effective_from]
    output: ProhibitedZip
    side_effects: ["ProhibitedZip appended; immutable thereafter (no version, no update endpoint)"]

  - method: GET
    path: "/dtc/state-rules/{id}/prohibited-zips"
    description: "reverse lookup of every prohibited ZIP declared under a state rule"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: ["reason?", "limit?", "offset?"]
    output: ProhibitedZip[]
    side_effects: []

  # ---- StatePermit --------------------------------------------------------
  - method: POST
    path: "/dtc/state-permits"
    description: "file a destination-state DTC permit for a winery; starts PENDING"
    roles: [ComplianceOfficer]
    code: 201
    input: [winery_id, state_code, permit_number, permit_type, effective_date, expiration_date]
    output: StatePermit
    side_effects: ["StatePermit created in PENDING", "validations priority 66 enforces closed-interval exclusivity per (winery_id, state_code)"]

  - method: GET
    path: "/dtc/state-permits/{id}"
    description: "read one state permit"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: []
    output: StatePermit
    side_effects: []

  - method: GET
    path: "/dtc/state-permits"
    description: "list state permits; the reverse-reachability lookup for StatePermit.winery_id"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: ["winery_id?", "state_code?", "status?", "limit?", "offset?"]
    output: StatePermit[]
    side_effects: []

  - method: POST
    path: "/dtc/state-permits/{id}/activate"
    description: "activate a PENDING permit so it can authorize clearances"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StatePermit
    side_effects: ["StatePermit.status = ACTIVE"]

  - method: POST
    path: "/dtc/state-permits/{id}/file-renewal"
    description: "file the renewal application; the permit stops authorizing new clearances while RENEWAL_FILED"
    roles: [ComplianceOfficer, WineryOperator]
    code: 200
    input: [renewal_reference]
    output: StatePermit
    side_effects: ["StatePermit.status = RENEWAL_FILED; renewal_reference and renewal_filed_at recorded"]

  - method: POST
    path: "/dtc/state-permits/{id}/approve-renewal"
    description: "approve a filed renewal, extending the permit's expiration_date and returning it to ACTIVE"
    roles: [ComplianceOfficer]
    code: 200
    input: [expiration_date]
    output: StatePermit
    side_effects: ["StatePermit.expiration_date replaced; status = ACTIVE; renewal_cycle_count += 1; renewal_reference and renewal_filed_at cleared"]

  - method: POST
    path: "/dtc/state-permits/{id}/revoke"
    description: "revoke a permit; fires the three-hop cascade of §1.2 (orders -> subscriptions -> winery counter)"
    roles: [ComplianceOfficer]
    code: 200
    input: [revocation_reason]
    output: StatePermit
    side_effects: ["StatePermit.status = REVOKED", "hop 1: CLEARED + UNFULFILLED Orders of that (winery, state) -> SUSPENDED_PERMIT", "hop 2: their ACTIVE ClubSubscriptions -> SUSPENDED_COMPLIANCE with next_run_date = null", "hop 3: Winery.suspended_subscription_count recomputed and Winery.version += 1"]

  # ---- CarrierProgram / CarrierEnrollment --------------------------------
  - method: POST
    path: "/dtc/carrier-programs"
    description: "declare a carrier's licensed-shipper program"
    roles: [PlatformAdmin]
    code: 201
    input: [carrier_code, program_name, states_served, requires_enrollment, "adult_signature_service_code?"]
    output: CarrierProgram
    side_effects: []

  - method: GET
    path: "/dtc/carrier-programs/{id}"
    description: "read one carrier program"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, CarrierAgent]
    code: 200
    input: []
    output: CarrierProgram
    side_effects: []

  - method: GET
    path: "/dtc/carrier-programs"
    description: "list carrier programs"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, CarrierAgent]
    code: 200
    input: ["carrier_code?", "limit?", "offset?"]
    output: CarrierProgram[]
    side_effects: []

  - method: POST
    path: "/dtc/carrier-enrollments"
    description: "enroll a winery in a carrier program; OCC-guarded on the Winery per §1.2.1"
    roles: [WineryOperator, ComplianceOfficer]
    code: 201
    input: [winery_id, carrier_program_id, account_number, expected_winery_version]
    output: CarrierEnrollment
    side_effects: ["CarrierEnrollment created in PENDING", "any prior APPROVED or PENDING enrollment of the same (winery_id, carrier_program_id) is system-superseded to SUSPENDED", "Winery.version += 1"]

  - method: GET
    path: "/dtc/carrier-enrollments/{id}"
    description: "read one enrollment"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, CarrierAgent]
    code: 200
    input: []
    output: CarrierEnrollment
    side_effects: []

  - method: GET
    path: "/dtc/carrier-enrollments"
    description: "list enrollments; the reverse-reachability lookup for CarrierEnrollment.winery_id and .carrier_program_id"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, CarrierAgent]
    code: 200
    input: ["winery_id?", "carrier_program_id?", "status?", "limit?", "offset?"]
    output: CarrierEnrollment[]
    side_effects: []

  - method: POST
    path: "/dtc/carrier-enrollments/{id}/decision"
    description: "carrier-side decision on an enrollment: APPROVED or SUSPENDED"
    roles: [CarrierAgent]
    code: 200
    input: [decision, "note?"]
    output: CarrierEnrollment
    side_effects: ["CarrierEnrollment.status set; approved_at and decided_by_user_id recorded"]

  # ---- Consumer -----------------------------------------------------------
  - method: POST
    path: "/dtc/consumers"
    description: "register a consumer with a default shipping address"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [full_name, email, birthdate, address_line, city, state_code, zip_code]
    output: Consumer
    side_effects: ["Consumer created with id_verified_at null, both risk scores 0 and screening_tier STANDARD"]

  - method: GET
    path: "/dtc/consumers/{id}"
    description: "read one consumer, including version for OCC and both risk scores"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: []
    output: Consumer
    side_effects: []

  - method: GET
    path: "/dtc/consumers"
    description: "list consumers"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["state_code?", "screening_tier?", "limit?", "offset?"]
    output: Consumer[]
    side_effects: []

  - method: POST
    path: "/dtc/consumers/{id}/id-verification"
    description: "record government-ID verification, satisfying validations priority 55"
    roles: [ComplianceOfficer]
    code: 200
    input: [id_verification_method]
    output: Consumer
    side_effects: ["Consumer.id_verification_method set; Consumer.id_verified_at = logical clock; Consumer.version += 1"]

  - method: GET
    path: "/dtc/consumers/{id}/volume-summary"
    description: "computed read: per-state rolling volume, headroom and BOTH risk-score variants side by side"
    roles: [PlatformAdmin, ComplianceOfficer, Consumer]
    code: 200
    input: ["state_code?"]
    output: "{ consumer_id: string, as_of: string, per_state: object, risk_score_screening: integer, risk_score_audit: integer, screening_tier: string, return_credit_count: integer, denied_exception_count: integer }"
    side_effects: []

  # ---- ClubSubscription / club runs --------------------------------------
  - method: POST
    path: "/dtc/club-subscriptions"
    description: "open a wine-club subscription; refused for an ELEVATED consumer (validations priority 95)"
    roles: [WineryOperator, ComplianceOfficer]
    code: 201
    input: [consumer_id, winery_id, cadence, sku, bottles_per_shipment, bottle_ml, unit_price_cents, next_run_date, annual_allotment]
    output: ClubSubscription
    side_effects: ["ClubSubscription created in ACTIVE with missed_run_count 0, consumed_shipments 0 and remaining_allotment = annual_allotment"]

  - method: GET
    path: "/dtc/club-subscriptions/{id}"
    description: "read one subscription"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: []
    output: ClubSubscription
    side_effects: []

  - method: GET
    path: "/dtc/club-subscriptions"
    description: "list subscriptions; the reverse-reachability lookup for ClubSubscription.consumer_id and .winery_id"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: ["consumer_id?", "winery_id?", "status?", "limit?", "offset?"]
    output: ClubSubscription[]
    side_effects: []

  - method: POST
    path: "/dtc/club-subscriptions/{id}/weather-hold"
    description: "place a weather hold on a subscription (ACTIVE -> WEATHER_HELD)"
    roles: [WineryOperator, ComplianceOfficer]
    code: 200
    input: [hold_start_date, hold_release_date, hold_reason]
    output: ClubSubscription
    side_effects: ["ClubSubscription.status = WEATHER_HELD; hold_start_date, hold_release_date and hold_reason recorded", "validations priority 69 enforces the 3-day buffer against last_hold_release_date"]

  - method: POST
    path: "/dtc/club-subscriptions/{id}/release-hold"
    description: "release a weather hold early (WEATHER_HELD -> ACTIVE), optionally forgiving accumulated missed runs"
    roles: [WineryOperator, ComplianceOfficer]
    code: 200
    input: ["reset_missed_runs?"]
    output: ClubSubscription
    side_effects: ["ClubSubscription.status = ACTIVE; last_hold_release_date = hold_release_date; hold_* fields cleared", "when reset_missed_runs is true, missed_run_count = 0"]

  - method: POST
    path: "/dtc/club-runs"
    description: "run the club scheduler for one winery on one date; generates and screens one Order per eligible subscription per calculations.club_run_selection"
    roles: [WineryOperator, ComplianceOfficer]
    code: 200
    input: [winery_id, run_date]
    output: "{ winery_id: string, run_date: string, generated_count: integer, skipped_count: integer, generated_order_ids: string[], skipped_subscription_ids: string[] }"
    side_effects: ["due WEATHER_HELD subscriptions are released (WEATHER_HELD -> ACTIVE) before processing", "one Order per processed subscription, created AND screened; the full order_charge_evaluation_chain runs on each", "cleared orders append a SHIPMENT_ACCEPTED VolumeLedgerEntry and advance next_run_date; consumed_shipments += 1", "rejected orders increment missed_run_count and may drive ACTIVE -> SUSPENDED_COMPLIANCE at MISSED_RUN_SUSPEND_THRESHOLD", "generated orders are discoverable only through GET /dtc/orders?club_subscription_id=... or the returned generated_order_ids"]

  # ---- Order / OrderLine / screening / exceptions -------------------------
  - method: POST
    path: "/dtc/orders"
    description: "create a DTC order in compliance_status DRAFT with 1..20 lines; OCC-guarded on the Consumer per §1.2.1. All monetary fields are computed here and frozen."
    roles: [Consumer, WineryOperator, ComplianceOfficer]
    code: 201
    input: [winery_id, consumer_id, "club_subscription_id?", ship_to_address_line, ship_to_state_code, ship_to_zip, lines, expected_consumer_version]
    output: Order
    side_effects: ["one OrderLine per element of lines, line_index assigned 1..n in request order", "calculations.order_charge_evaluation_chain runs end to end (liters, subtotal, shipping tiers, club discount, excise, sales tax, pre-fee total, handling fee, total)", "Order.adult_signature_required copied from the destination StateRule.adult_signature_required", "Consumer.version += 1"]

  - method: GET
    path: "/dtc/orders/{id}"
    description: "read one order with both state dimensions, rejection_error_id and every frozen money field"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/dtc/orders"
    description: "list orders; the reverse-reachability lookup for Order.winery_id, .consumer_id and .club_subscription_id"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: ["winery_id?", "consumer_id?", "club_subscription_id?", "compliance_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/dtc/orders/{id}/lines"
    description: "reverse lookup of the order's lines with their per-line liters, allocated shipping and per-line sales tax"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, Consumer]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/dtc/orders/{id}/screen"
    description: "run the compliance screening ladder (validations priority 40..95) against the order. ALWAYS 200: the outcome lands in Order.compliance_status and, on failure, in Order.rejection_error_id."
    roles: [ComplianceOfficer, WineryOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["DRAFT|SUSPENDED_PERMIT -> CLEARED on full pass: cleared_at set, a SHIPMENT_ACCEPTED VolumeLedgerEntry appended, Winery.excise_accrued_cents += Order.excise_tax_cents, Consumer volume/risk fields recomputed and Consumer.version += 1", "-> REJECTED when the lowest-numbered failing rule is not overridable", "-> OVERRIDE_PENDING when it is one of ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED, ERR_WINERY_VOLUME_LIMIT_EXCEEDED, ERR_ELEVATED_RISK_REVIEW_REQUIRED", "a lapsed permit observed here also drives StatePermit ACTIVE -> EXPIRED"]

  - method: POST
    path: "/dtc/orders/{id}/compliance-exceptions"
    description: "raise a compliance exception seeking an override of the order's recorded overridable failure"
    roles: [ComplianceOfficer]
    code: 201
    input: [raised_rule, justification]
    output: ComplianceException
    side_effects: ["ComplianceException created in OPEN with requested_by_user_id = X-User-ID", "Winery.open_exception_count += 1", "raised_rule MUST equal Order.rejection_error_id, else ERR_INVALID_REQUEST"]

  - method: GET
    path: "/dtc/orders/{id}/compliance-exceptions"
    description: "reverse lookup of every exception raised on an order"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ComplianceException[]
    side_effects: []

  - method: GET
    path: "/dtc/compliance-exceptions/{id}"
    description: "read one compliance exception"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: []
    output: ComplianceException
    side_effects: []

  - method: POST
    path: "/dtc/compliance-exceptions/{id}/decision"
    description: "approve or deny an exception; segregation of duties applies (validations priority 35)"
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: ComplianceException
    side_effects: ["APPROVED: Order OVERRIDE_PENDING -> CLEARED with override_applied true, ledger entry appended, winery excise accrued, consumer volume/risk recomputed", "DENIED: Order OVERRIDE_PENDING -> REJECTED, Consumer.denied_exception_count += 1 and both risk scores recomputed", "Winery.open_exception_count -= 1 either way"]

  # ---- Shipment -----------------------------------------------------------
  - method: POST
    path: "/dtc/shipments"
    description: "create the carrier label for a CLEARED order; re-verifies the safety, permit and carrier gates at label time and RAISES them as HTTP errors. Setting replacement_of_shipment_id re-ships a RETURNED shipment."
    roles: [WineryOperator]
    code: 201
    input: [order_id, carrier_enrollment_id, "replacement_of_shipment_id?"]
    output: Shipment
    side_effects: ["Shipment created in LABEL_CREATED with a server-minted tracking_number", "Order.fulfillment_status UNFULFILLED|RETURNED -> LABELED", "Shipment.adult_signature_required and adult_signature_service_code copied from the order and the enrolled program", "re-ship: a SHIPMENT_ACCEPTED VolumeLedgerEntry re-debits the returned liters and Consumer volume/risk fields are recomputed"]

  - method: GET
    path: "/dtc/shipments/{id}"
    description: "read one shipment"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, CarrierAgent, Consumer]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/dtc/shipments"
    description: "list shipments; the reverse-reachability lookup for Shipment.order_id, .carrier_enrollment_id and the self-referential .replacement_of_shipment_id"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator, CarrierAgent]
    code: 200
    input: ["order_id?", "carrier_enrollment_id?", "replacement_of_shipment_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/dtc/shipments/{id}/scan"
    description: "carrier scan event driving the Shipment machine: PICKUP, EXCEPTION, REROUTE_ACCEPTED, DELIVERED, RETURN_TO_SENDER"
    roles: [CarrierAgent]
    code: 200
    input: [scan_type, "exception_code?", "reroute_zip?", "reroute_state_code?", "signed_by?", "signer_age_verified?"]
    output: Shipment
    side_effects: ["PICKUP: LABEL_CREATED -> IN_TRANSIT and Order.fulfillment_status -> IN_TRANSIT (settled liters now count toward the SCREENING risk variant)", "EXCEPTION: IN_TRANSIT -> EXCEPTION with exception_code recorded", "REROUTE_ACCEPTED: EXCEPTION -> IN_TRANSIT, reroute_zip recorded and reroute_count += 1; same-state only (validations priority 76)", "DELIVERED: -> DELIVERED with delivered_at; requires signed_by and signer_age_verified when adult_signature_required", "RETURN_TO_SENDER: the four-hop compensating cascade of §1.2 (shipment RETURNED -> order RETURNED with excise/sales-tax reversal -> RETURN_CREDIT ledger entry -> consumer volume/risk -> screening_tier)"]

  # ---- VolumeLedgerEntry --------------------------------------------------
  - method: POST
    path: "/dtc/volume-ledger-entries"
    description: "append a signed manual volume adjustment (event_type MANUAL_ADJUSTMENT) — the compliance operator's tool for correcting historical volume, and the only way to seed volume dated outside the current window"
    roles: [ComplianceOfficer]
    code: 201
    input: [consumer_id, winery_id, "order_id?", "shipment_id?", state_code, liters, occurred_at, reason]
    output: VolumeLedgerEntry
    side_effects: ["immutable VolumeLedgerEntry appended with event_type MANUAL_ADJUSTMENT", "Consumer rolling volumes, risk scores and screening_tier recomputed; Consumer.version += 1", "a positive adjustment that would breach the per-consumer or per-winery state limit is refused (validations priority 80 and 85)"]

  - method: GET
    path: "/dtc/volume-ledger-entries/{id}"
    description: "read one ledger entry"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: VolumeLedgerEntry
    side_effects: []

  - method: GET
    path: "/dtc/volume-ledger-entries"
    description: "list ledger entries; the reverse-reachability lookup for all four of its FKs and the audit trail behind every volume decision"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: ["consumer_id?", "winery_id?", "order_id?", "shipment_id?", "state_code?", "event_type?", "limit?", "offset?"]
    output: VolumeLedgerEntry[]
    side_effects: []

  # ---- TaxRemittance ------------------------------------------------------
  - method: POST
    path: "/dtc/remittances"
    description: "open a state remittance for a period on ACCRUAL_BASIS or DELIVERY_BASIS; all amounts are computed at creation per calculations.remittance_due_amounts"
    roles: [ComplianceOfficer]
    code: 201
    input: [winery_id, state_code, period_type, period_start, period_end, basis, "supersedes_remittance_id?"]
    output: TaxRemittance
    side_effects: ["TaxRemittance created in OPEN with accrued, reversed and due amounts, liters_total, shipment_count and included_order_ids frozen", "a supersedes_remittance_id target in status FILED transitions FILED -> AMENDED", "validations priority 68 enforces half-open, (type, basis)-scoped period exclusivity"]

  - method: GET
    path: "/dtc/remittances/{id}"
    description: "read one remittance"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: []
    output: TaxRemittance
    side_effects: []

  - method: GET
    path: "/dtc/remittances"
    description: "list remittances; the reverse-reachability lookup for TaxRemittance.winery_id and the self-referential .supersedes_remittance_id"
    roles: [PlatformAdmin, ComplianceOfficer, WineryOperator]
    code: 200
    input: ["winery_id?", "state_code?", "period_type?", "status?", "supersedes_remittance_id?", "limit?", "offset?"]
    output: TaxRemittance[]
    side_effects: []

  - method: POST
    path: "/dtc/remittances/{id}/file"
    description: "file the return with the state (OPEN -> FILED); an empty period may be filed only where StateRule.zero_filing_required is true"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TaxRemittance
    side_effects: ["TaxRemittance.status = FILED; filed_at = logical clock; filed_by_user_id = X-User-ID"]

  - method: POST
    path: "/dtc/remittances/{id}/remit"
    description: "record payment of a filed return (FILED -> REMITTED); the filer may not remit (validations priority 35)"
    roles: [ComplianceOfficer]
    code: 200
    input: [payment_reference]
    output: TaxRemittance
    side_effects: ["TaxRemittance.status = REMITTED; remitted_at = logical clock; remitted_by_user_id = X-User-ID; payment_reference recorded"]

  # ---- reporting ----------------------------------------------------------
  - method: GET
    path: "/dtc/renewal-calendar"
    description: "computed read: the winery's license renewal calendar and the state reports currently due, per calculations.permit_renewal_calendar"
    roles: [ComplianceOfficer, WineryOperator]
    code: 200
    input: [winery_id, "horizon_days?"]
    output: "{ winery_id: string, as_of: string, horizon_days: integer, permits_expiring: object[], reports_due: object[] }"
    side_effects: ["a permit observed past its expiration_date is driven ACTIVE -> EXPIRED before the calendar is rendered"]

  # ---- logical clock (test-driving endpoint, outside the business surface) -
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the clock reads that default and MUST NOT fall back to real wall-clock time. The clock is the sole source of every 'now' in this API: rolling windows, permit effective/expiration comparisons, age checks, hold releases, cleared_at, delivered_at and report due dates."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["subsequent requests evaluate every temporal rule against this instant"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  # ---- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty on any request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles"
  - id: ERR_FORBIDDEN_RESOURCE_OWNER
    http: 403
    condition: "a Consumer acts on another Consumer's order, subscription, ledger entry or profile, or a WineryOperator acts on another Winery's permit, enrollment, order, shipment, subscription or remittance"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ComplianceOfficer deciding a ComplianceException is the one who raised it (X-User-ID == requested_by_user_id), or the officer remitting a TaxRemittance is the one who filed it (X-User-ID == filed_by_user_id)"
  - id: ERR_COMPLIANCE_REINSTATE_FORBIDDEN
    http: 403
    condition: "a WineryOperator attempts to reinstate a SUSPENDED_COMPLIANCE ClubSubscription; only a ComplianceOfficer may lift a compliance suspension"

  # ---- request shape ------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, undeclared enum member, out-of-range number, empty or >20-element lines array, period_start >= period_end, or a ComplianceException raised_rule that does not equal the order's recorded rejection_error_id"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_consumer_version != Consumer.version on POST /dtc/orders, or expected_winery_version != Winery.version on POST /dtc/carrier-enrollments"

  # ---- existence ----------------------------------------------------------
  - id: ERR_WINERY_NOT_FOUND
    http: 404
    condition: "no Winery for the {id} path segment or the winery_id in the body"
  - id: ERR_STATE_RULE_NOT_FOUND
    http: 404
    condition: "no StateRule for the {id} path segment, or no StateRule for a supplied state_code / ship_to_state_code"
  - id: ERR_STATE_PERMIT_NOT_FOUND
    http: 404
    condition: "no StatePermit for the {id} path segment"
  - id: ERR_CARRIER_PROGRAM_NOT_FOUND
    http: 404
    condition: "no CarrierProgram for the {id} path segment or the carrier_program_id in the body"
  - id: ERR_CARRIER_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "no CarrierEnrollment for the {id} path segment or the carrier_enrollment_id in the body"
  - id: ERR_CONSUMER_NOT_FOUND
    http: 404
    condition: "no Consumer for the {id} path segment or the consumer_id in the body"
  - id: ERR_CLUB_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "no ClubSubscription for the {id} path segment or the club_subscription_id in the body"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no Order for the {id} path segment or the order_id in the body"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no Shipment for the {id} path segment, the shipment_id or the replacement_of_shipment_id in the body"
  - id: ERR_COMPLIANCE_EXCEPTION_NOT_FOUND
    http: 404
    condition: "no ComplianceException for the {id} path segment"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "no TaxRemittance for the {id} path segment or the supersedes_remittance_id in the body"
  - id: ERR_VOLUME_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "no VolumeLedgerEntry for the {id} path segment of GET /dtc/volume-ledger-entries/{id}"

  # ---- state --------------------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested transition is not declared from the target's current state — activating a non-PENDING permit, approving a renewal that was never filed, revoking an already REVOKED permit, releasing a hold on an ACTIVE subscription, weather-holding a SUSPENDED_COMPLIANCE subscription, filing an already FILED remittance, remitting an OPEN or AMENDED remittance, or reinstating a winery that is already ACTIVE"
  - id: ERR_ORDER_ALREADY_SCREENED
    http: 409
    condition: "POST /dtc/orders/{id}/screen on an order whose compliance_status is CLEARED, REJECTED or OVERRIDE_PENDING — only DRAFT and SUSPENDED_PERMIT orders may be screened"
  - id: ERR_ORDER_NOT_CLEARED
    http: 409
    condition: "POST /dtc/shipments for an order whose compliance_status is not CLEARED, or whose fulfillment_status is not UNFULFILLED (or RETURNED for a re-ship)"
  - id: ERR_EXCEPTION_ALREADY_DECIDED
    http: 409
    condition: "POST /dtc/compliance-exceptions/{id}/decision on an exception whose status is already APPROVED or DENIED"
  - id: ERR_ENROLLMENT_ALREADY_DECIDED
    http: 409
    condition: "POST /dtc/carrier-enrollments/{id}/decision that repeats the enrollment's current status, e.g. APPROVED on an already APPROVED enrollment"
  - id: ERR_SHIPMENT_NOT_ACTIVE
    http: 409
    condition: "a scan whose scan_type is not declared from the shipment's current status — PICKUP on an IN_TRANSIT shipment, REROUTE_ACCEPTED on a shipment that is not in EXCEPTION, or any scan on a DELIVERED or RETURNED shipment"
  - id: ERR_WINERY_SUSPENDED
    http: 409
    condition: "an order, label, subscription, renewal filing or club run is attempted for a Winery whose status is SUSPENDED"

  # ---- business: safety / compliance -------------------------------------
  - id: ERR_STATE_DTC_PROHIBITED
    http: 422
    condition: "the destination StateRule.allows_dtc is false. Recorded on Order.rejection_error_id by screening; raised by POST /dtc/shipments."
  - id: ERR_PROHIBITED_DESTINATION
    http: 422
    condition: "an effective ProhibitedZip row of the destination state matches Order.ship_to_zip (any reason value, DRY_COUNTY included). Recorded by screening; raised by POST /dtc/shipments when the ZIP was blocked after clearance."
  - id: ERR_CONSUMER_UNDERAGE
    http: 422
    condition: "the consumer's completed age at the logical clock date is below StateRule.min_purchaser_age. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_ID_VERIFICATION_REQUIRED
    http: 422
    condition: "Consumer.id_verified_at is null. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_ELEVATED_RISK_REVIEW_REQUIRED
    http: 422
    condition: "Consumer.screening_tier is ELEVATED (risk_score_screening >= 50). Recorded by screening as an OVERRIDABLE failure (order -> OVERRIDE_PENDING); raised by POST /dtc/club-subscriptions."

  # ---- business: temporal ------------------------------------------------
  - id: ERR_PERMIT_MISSING_FOR_STATE
    http: 422
    condition: "the winery holds no non-REVOKED StatePermit for the destination state. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 422
    condition: "the winery's permit for the destination state is PENDING, RENEWAL_FILED or REVOKED. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_PERMIT_EXPIRED
    http: 422
    condition: "the logical clock date is outside the permit's inclusive [effective_date, expiration_date] window. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_PERMIT_PERIOD_OVERLAP
    http: 409
    condition: "a new StatePermit's closed interval [effective_date, expiration_date] touches or overlaps a non-REVOKED permit of the same (winery_id, state_code) — sharing a single endpoint date is already a collision"
  - id: ERR_REMITTANCE_PERIOD_OVERLAP
    http: 409
    condition: "a new TaxRemittance's half-open interval [period_start, period_end) overlaps a non-AMENDED remittance of the same (winery_id, state_code, period_type, basis); exact adjacency is allowed, and neither a different period_type nor a different basis ever collides"
  - id: ERR_HOLD_WINDOW_CONFLICT
    http: 409
    condition: "a weather hold's hold_start_date is less than HOLD_BUFFER_DAYS (3) days after the subscription's last_hold_release_date, or hold_release_date is not strictly after hold_start_date"

  # ---- business: referential / constraint --------------------------------
  - id: ERR_CARRIER_NOT_ENROLLED
    http: 422
    condition: "StateRule.requires_carrier_program is true and the winery has no APPROVED CarrierEnrollment on a program whose states_served covers the destination state. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_ADULT_SIGNATURE_NOT_SUPPORTED
    http: 422
    condition: "the order requires an adult signature but the enrolled CarrierProgram has no adult_signature_service_code. Recorded by screening; raised by POST /dtc/shipments."
  - id: ERR_DUPLICATE_PROHIBITED_ZIP
    http: 409
    condition: "a ProhibitedZip with the same (state_rule_id, zip_code) already exists"
  - id: ERR_REROUTE_STATE_CHANGE
    http: 422
    condition: "a REROUTE_ACCEPTED scan carries a reroute_state_code different from the order's ship_to_state_code"
  - id: ERR_RUN_DATE_IN_FUTURE
    http: 422
    condition: "POST /dtc/club-runs run_date is after the logical clock date"

  # ---- business: fiscal ---------------------------------------------------
  - id: ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED
    http: 422
    condition: "the consumer's rolling volume for the destination state plus this order's liters exceeds StateRule.per_consumer_limit_liters. Recorded by screening as an OVERRIDABLE failure; raised by POST /dtc/volume-ledger-entries."
  - id: ERR_WINERY_VOLUME_LIMIT_EXCEEDED
    http: 422
    condition: "the winery's calendar-year volume into the destination state plus this order's liters exceeds StateRule.per_winery_annual_limit_liters. Recorded by screening as an OVERRIDABLE failure; raised by POST /dtc/volume-ledger-entries."
  - id: ERR_NOTHING_TO_REMIT
    http: 422
    condition: "POST /dtc/remittances/{id}/file on a remittance whose shipment_count is 0 while the governing StateRule.zero_filing_required is false"

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:
  - name: PlatformAdmin
    description: "platform operator: seeds wineries, state rules, prohibited ZIPs, carrier programs, consumers and the logical clock; never decides compliance outcomes"
    identity: "opaque"
    exclusive_operations:
      - "POST /dtc/wineries"
      - "POST /dtc/wineries/{id}/status"
      - "POST /dtc/state-rules"
      - "POST /dtc/carrier-programs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /dtc/state-rules/{id}/prohibited-zips (with ComplianceOfficer)"
      - "POST /dtc/consumers (with ComplianceOfficer)"
      - "every GET in §1.5 except GET /dtc/renewal-calendar"

  - name: ComplianceOfficer
    description: "licensing and tax authority: files and revokes permits, screens orders, decides exceptions, adjusts the volume ledger and files/remits state returns"
    identity: "opaque"
    exclusive_operations:
      - "POST /dtc/state-permits"
      - "POST /dtc/state-permits/{id}/activate"
      - "POST /dtc/state-permits/{id}/approve-renewal"
      - "POST /dtc/state-permits/{id}/revoke"
      - "POST /dtc/consumers/{id}/id-verification"
      - "POST /dtc/orders/{id}/compliance-exceptions"
      - "POST /dtc/compliance-exceptions/{id}/decision"
      - "POST /dtc/volume-ledger-entries"
      - "POST /dtc/remittances"
      - "POST /dtc/remittances/{id}/file"
      - "POST /dtc/remittances/{id}/remit"
      - "POST /dtc/club-subscriptions/{id}/release-hold with reset_missed_runs true on a SUSPENDED_COMPLIANCE subscription"
    shared_operations:
      - "POST /dtc/orders and POST /dtc/orders/{id}/screen (with WineryOperator)"
      - "POST /dtc/state-permits/{id}/file-renewal (with WineryOperator)"
      - "POST /dtc/carrier-enrollments (with WineryOperator)"
      - "POST /dtc/club-subscriptions, weather-hold, release-hold and POST /dtc/club-runs (with WineryOperator)"
      - "POST /dtc/state-rules/{id}/prohibited-zips and POST /dtc/consumers (with PlatformAdmin)"
      - "every GET in §1.5"
    notes: "segregation of duties is enforced on X-User-ID, not on the role: the officer who raised an exception cannot decide it, and the officer who filed a remittance cannot remit it (ERR_SEGREGATION_OF_DUTIES)."

  - name: WineryOperator
    description: "the winery itself: enrolls with carriers, files renewals, creates and screens its own orders, labels shipments and runs its wine club"
    identity: "entity_backed:Winery"
    exclusive_operations:
      - "POST /dtc/shipments"
    shared_operations:
      - "POST /dtc/orders and POST /dtc/orders/{id}/screen (with ComplianceOfficer and, for creation, Consumer)"
      - "POST /dtc/carrier-enrollments (with ComplianceOfficer)"
      - "POST /dtc/state-permits/{id}/file-renewal (with ComplianceOfficer)"
      - "POST /dtc/club-subscriptions, weather-hold, release-hold and POST /dtc/club-runs (with ComplianceOfficer)"
      - "GETs scoped to its own winery"
    notes: "X-User-ID MUST equal the Winery.id it acts for; reaching another winery's rows yields ERR_FORBIDDEN_RESOURCE_OWNER. A WineryOperator may release a weather hold but may NOT lift a compliance suspension (ERR_COMPLIANCE_REINSTATE_FORBIDDEN)."

  - name: Consumer
    description: "the wine buyer: places its own orders and reads its own volume summary, orders, subscriptions and shipments"
    identity: "entity_backed:Consumer"
    exclusive_operations: []
    shared_operations:
      - "POST /dtc/orders (with WineryOperator and ComplianceOfficer)"
      - "GET /dtc/consumers/{id}, GET /dtc/consumers/{id}/volume-summary, GET /dtc/orders, GET /dtc/orders/{id}, GET /dtc/orders/{id}/lines, GET /dtc/club-subscriptions, GET /dtc/club-subscriptions/{id}, GET /dtc/shipments/{id}, GET /dtc/state-rules/{id} — all scoped to itself"
    notes: "X-User-ID MUST equal the Consumer.id. A Consumer can never screen an order, raise an exception, label a shipment or read another consumer's data."

  - name: CarrierAgent
    description: "the shipping carrier: decides winery enrollments and posts the scan events that drive fulfillment"
    identity: "opaque"
    exclusive_operations:
      - "POST /dtc/carrier-enrollments/{id}/decision"
      - "POST /dtc/shipments/{id}/scan"
    shared_operations:
      - "GET /dtc/carrier-programs, GET /dtc/carrier-programs/{id}, GET /dtc/carrier-enrollments, GET /dtc/carrier-enrollments/{id}, GET /dtc/shipments, GET /dtc/shipments/{id}"
    notes: "the carrier decides enrollments and scans, but can never create an order, screen one, label a shipment or touch tax."
