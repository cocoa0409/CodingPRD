        claim_type: Error Triggerable
        grounds: ["validations[priority=14]", "errors[ERR_PROJECT_CLOSED]", "state_machines.Project.CLOSEOUT_to_CLOSED"]
        distinguishing_aspect: "Once the project reaches CLOSED, G5 rung 14 freezes every write regardless of the child entity: an upgrade attempt returns ERR_PROJECT_CLOSED (409) before any tier-direction check runs."
        test_recipe:
          setup: ["An OCCUPIED AGENT-payer project whose invoice was paid and whose project was then closed."]
          setup_api_calls: *occ_issued_c
          trigger:
