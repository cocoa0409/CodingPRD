          Three-point boundary walk on one review with a STRICT comparison: a CONDITIONAL NAME (5) plus a
          CONDITIONAL DEPICTION (25) lands the score exactly ON clearance_escalation_score (30), which
          must NOT escalate because the rule is > and not >=; a second CONDITIONAL NAME takes it to 35,
