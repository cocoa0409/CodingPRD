          rationale: "The named §1.8 instance drives the weighted sum with the 0.55 / 0.30 / 0.15 weights on both sides of the guarantor lift and asserts the exact 24.95 divergence, including the deliberate non-inheritance of the disclosure component."

      - name: settlement_netting_two_variants_same_intervals
        claim_type: variant_divergence
        grounds:
          - calculations.settlement_netting
        excluded_because:
          difficulty_instance: dual_variant_calc / settlement_netting_hourly_versus_monthly_diverges_by_50_00
          rationale: "The named §1.8 instance posts identical interval sets into an HOURLY period and a MONTHLY period and asserts the exact 50.00 divergence produced by the negative-price floor."

      - name: settlement_netting_variant_chosen_by_the_period_snapshot
        claim_type: variant_selection
        grounds:
