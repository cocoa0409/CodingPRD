  - section: rbac
    instances:
      - name: unknown_role_rejected
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_CONTEXT_HEADER]"]
        distinguishing_aspect: "X-User-Role 'Pirate' is not a declared role: rejected 400 ERR_MISSING_OR_INVALID_CONTEXT_HEADER before any role-authorization check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /contracts", payload: { casualty_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", plan_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", form: NO_CURE_NO_PAY }, as: Pirate, as_user_id: "pirate-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http 400"
      - name: surveyor_cannot_create_contract_rejected
        claim_type: role_denied
        grounds: [roles, "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "MarineSurveyor calling POST /contracts with a schema-valid payload is rejected 403 ERR_FORBIDDEN_ROLE — role authorization is independent of payload validity."
        test_recipe:
          setup: ["one casualty exists"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id } }
          trigger:
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"
      - name: salvagemaster_cannot_grant_permit_rejected
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "SalvageMaster calling /permits/{id}/grant is rejected 403 ERR_FORBIDDEN_ROLE; role check (p2) fires before existence (p3), so even an unknown permit id yields 403."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /permits/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/grant", payload: {}, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"
      - name: contractsofficer_cannot_decide_award_rejected
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "ContractsOfficer calling /awards/{id}/decide is rejected 403 — arbitration decisions are exclusive to the Arbitrator role."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /awards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide", payload: { awarded_amount_cents: 1000000 }, as: ContractsOfficer, as_user_id: "co-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE, http 403"
      - name: arbitrator_shared_read_allowed
        claim_type: role_allowed
        grounds: [roles]
        distinguishing_aspect: "All seven roles share the GET surface: Arbitrator can list casualties (200 with array envelope)."
        test_recipe:
          setup: ["one casualty exists"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "GET /casualties", payload: {}, as: Arbitrator, as_user_id: "arb-01" }
          assert:
            - "http 200, response_type == array, total_count == 1"

  - section: cross_cutting_layers
    instances:
      - name: contract_counter_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[contract-counter-stale-version]", "errors[ERR_STALE_CONTRACT_VERSION]"]
        distinguishing_aspect: "After a successful counter bumps the contract version to 3, a second counter carrying the previously observed version 2 is rejected 412 ERR_STALE_CONTRACT_VERSION — two strictly sequential requests, no wall-clock dependence."
        test_recipe:
          setup: ["NCNP contract OFFERED (version 2 after offer)"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
