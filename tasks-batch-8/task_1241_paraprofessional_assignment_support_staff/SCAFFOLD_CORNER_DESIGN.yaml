# =============================================================================
# Task 1241: Paraprofessional Assignment & Support Staff Allocation
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by §1.8. Sections and
# claim_types follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: plan_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.StaffingPlan.fields.benefit_threshold_minutes, entities.StaffingPlan.fields.benefit_surcharge_pct, entities.StaffingPlan.fields.travel_buffer_minutes]
        distinguishing_aspect: "Omitting the three optional plan config fields applies the documented defaults 1800 / 0.20 / 30, and computed fields initialize."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "Defaults", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /sped-staffing/plans/${plan_id}"
              as: Any
          assert:
            - "StaffingPlan.${plan_id}.benefit_threshold_minutes == 1800"
            - "StaffingPlan.${plan_id}.benefit_surcharge_pct == 0.20"
            - "StaffingPlan.${plan_id}.travel_buffer_minutes == 30"
            - "status == DRAFT, committed_cost_cents == 0, settled_cost_cents == 0, cost_balance_cents == 1000000, version == 1"

      - name: plan_creation_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.StaffingPlan.fields.total_budget_cents]
        distinguishing_aspect: "Omitting required total_budget_cents yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "No Budget", school_year: "2026-27" }
              as: DistrictStaffingAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: student_creation_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Student.fields.iep_service_level]
        distinguishing_aspect: "iep_service_level outside {ONE_TO_ONE, SHARED_SUPPORT, TRANSITIONAL} is rejected."
        test_recipe:
          setup: ["plan DRAFT with one building"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "BOGUS", iep_minutes_per_week: 300, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: timesheet_minutes_worked_computed
        claim_type: computed_fields
        grounds: [entities.TimesheetEntry.fields.minutes_worked]
        distinguishing_aspect: "minutes_worked is system-computed as end_minute - start_minute (700-480 = 220)."
        test_recipe:
          setup: ["plan ACTIVE, B1, P1, S1, A1 ACTIVE Mon-Fri 480-780 from 2026-05-04"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "ONE_TO_ONE", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/verify-qualifications"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments/${a1}/activate"
              as: SpecialEdCoordinator
          trigger:
            - call: "POST /sped-staffing/timesheets"
              payload: { assignment_id: "${a1}", work_date: "2026-05-04", start_minute: 480, end_minute: 700 }
              as: Paraprofessional
              as_user_id: "${p1}"
              captures: { t1: $.data.id, mins: $.data.minutes_worked }
          assert:
            - "TimesheetEntry.${t1}.minutes_worked == 220"

      - name: get_missing_resources_returns_not_found
        claim_type: not_found
        grounds: []
        distinguishing_aspect: "Every detail GET with a well-formed but nonexistent UUID returns its resource-specific 404 error_id."
        test_recipe:
          setup: ["empty DB (no fixtures needed)"]
          setup_api_calls: []
          trigger:
            - call: "GET /sped-staffing/plans/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_plan: $.data.error_id }
            - call: "GET /sped-staffing/buildings/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_bldg: $.data.error_id }
            - call: "GET /sped-staffing/students/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_stu: $.data.error_id }
            - call: "GET /sped-staffing/paraprofessionals/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_para: $.data.error_id }
            - call: "GET /sped-staffing/assignments/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_asg: $.data.error_id }
            - call: "GET /sped-staffing/coverage-plans/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_cp: $.data.error_id }
            - call: "GET /sped-staffing/absence-reports/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_ab: $.data.error_id }
            - call: "GET /sped-staffing/backfill-assignments/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_bf: $.data.error_id }
            - call: "GET /sped-staffing/timesheets/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_ts: $.data.error_id }
            - call: "GET /sped-staffing/evaluations/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_ev: $.data.error_id }
            - call: "GET /sped-staffing/allocation-formulas/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_f: $.data.error_id }
            - call: "GET /sped-staffing/funding-allocations/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_fa: $.data.error_id }
            - call: "GET /sped-staffing/service-change-orders/11111111-1111-1111-1111-111111111111"
              as: Any
              captures: { e_sco: $.data.error_id }
          assert:
            - "e_plan == ERR_PLAN_NOT_FOUND; e_bldg == ERR_BUILDING_NOT_FOUND; e_stu == ERR_STUDENT_NOT_FOUND"
            - "e_para == ERR_PARAPROFESSIONAL_NOT_FOUND; e_asg == ERR_ASSIGNMENT_NOT_FOUND; e_cp == ERR_COVERAGE_PLAN_NOT_FOUND"
            - "e_ab == ERR_ABSENCE_NOT_FOUND; e_bf == ERR_BACKFILL_NOT_FOUND; e_ts == ERR_TIMESHEET_NOT_FOUND"
            - "e_ev == ERR_EVALUATION_NOT_FOUND; e_f == ERR_FORMULA_NOT_FOUND; e_fa == ERR_ALLOCATION_NOT_FOUND"
            - "e_sco == ERR_CHANGE_ORDER_NOT_FOUND; all responses HTTP 404"

      - name: students_list_pagination_shape
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more."
        test_recipe:
          setup: ["plan DRAFT, building B1, three students created"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 300, required_qualification: "NONE" }
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-002", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 300, required_qualification: "NONE" }
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-003", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 300, required_qualification: "NONE" }
              as: SpecialEdCoordinator
          trigger:
            - call: "GET /sped-staffing/students"
              payload: { plan_id: "${plan_id}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "response envelope contains meta.api_request_id and response_type == 'array'"
            - "2 items returned; total_count == 3; has_more == true"
            - "second page (offset 2) returns 1 item; has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: assignment_initial_and_parallel_funding_state
        claim_type: initial_state
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "Newly created assignment starts status=PROPOSED and funding_status=PROVISIONALLY_FUNDED; computed weekly_minutes visible in the same response."
        test_recipe:
          setup: ["plan ACTIVE, B1, P1, S1 ACTIVE_IEP (TRANSITIONAL/NONE, 1500 min/wk)"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
          trigger:
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
          assert:
            - "Assignment.${a1}.status == PROPOSED"
            - "Assignment.${a1}.funding_status == PROVISIONALLY_FUNDED"
            - "Assignment.${a1}.weekly_minutes == 1500 and daily_cost_cents == 10000 (300/60 * 2000, no stipend for TRANSITIONAL)"

      - name: assignment_suspend_from_proposed_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "suspend is only declared from ACTIVE; from PROPOSED it must fail with ERR_ASSIGNMENT_INVALID_STATE and no side effects."
        test_recipe:
          setup: ["plan ACTIVE, B1, P1, S1 ACTIVE_IEP, A1 PROPOSED"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /sped-staffing/assignments/${a1}/suspend"
              as: SpecialEdCoordinator
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_ASSIGNMENT_INVALID_STATE"
            - "Assignment.${a1}.status remains PROPOSED"

      - name: assignment_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Assignment]
        distinguishing_aspect: "ENDED is terminal: every further transition (suspend shown) is rejected."
        test_recipe:
          setup: ["plan ACTIVE, B1, P1, S1 ACTIVE_IEP, A1 PROPOSED then ENDED"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 100000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { plan_v: $.data.version }
            - call: "POST /sped-staffing/paraprofessionals"
              payload: { plan_id: "${plan_id}", home_building_id: "${b1}", full_name: "Pat Para", email: "p1@district.test", base_hourly_wage_cents: 2000, contracted_max_weekly_minutes: 2400, hire_date: "2025-08-15" }
              as: DistrictStaffingAdmin
              captures: { p1: $.data.id }
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
            - call: "POST /sped-staffing/assignments"
              payload: { plan_id: "${plan_id}", student_id: "${s1}", para_id: "${p1}", building_id: "${b1}", start_date: "2026-05-04", end_date: "2026-06-30", days_of_week: ["MON","TUE","WED","THU","FRI"], daily_start_minute: 480, daily_end_minute: 780, expected_plan_version: "${plan_v}" }
              as: SpecialEdCoordinator
              captures: { a1: $.data.id }
            - call: "POST /sped-staffing/assignments/${a1}/end"
              as: SpecialEdCoordinator
          trigger:
            - call: "POST /sped-staffing/assignments/${a1}/suspend"
              as: SpecialEdCoordinator
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_ASSIGNMENT_INVALID_STATE"
            - "Assignment.${a1}.status remains ENDED and funding_status == SETTLED"

      - name: plan_terminal_lockdown_closed_rejects_activate
        claim_type: terminal_state_lockdown
        grounds: [state_machines.StaffingPlan]
        distinguishing_aspect: "CLOSED is terminal for StaffingPlan: activate from CLOSED is rejected."
        test_recipe:
          setup: ["plan with one building, activated, reconciled to CLOSED (no timesheets, no coverage plans)"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/begin-reconciliation"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/close"
              as: DistrictStaffingAdmin
          trigger:
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_NOT_DRAFT"
            - "StaffingPlan.${plan_id}.status remains CLOSED"

      - name: plan_reopen_cycle_and_wrong_state_rejection
        claim_type: valid_transition
        grounds: [state_machines.StaffingPlan.RECONCILING_to_ACTIVE]
        distinguishing_aspect: "ACTIVE -> RECONCILING -> ACTIVE revision loop works; reopen from ACTIVE (not RECONCILING) is rejected."
        test_recipe:
          setup: ["plan with one building, ACTIVE"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
          trigger:
            - call: "POST /sped-staffing/plans/${plan_id}/reopen"
              as: DistrictStaffingAdmin
              captures: { e_id: $.data.error_id }
            - call: "POST /sped-staffing/plans/${plan_id}/begin-reconciliation"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/plans/${plan_id}/reopen"
              as: DistrictStaffingAdmin
              captures: { st: $.data.status }
          assert:
            - "reopen from ACTIVE returns ERR_PLAN_NOT_RECONCILING"
            - "after begin-reconciliation + reopen: status == ACTIVE (cycle traversed)"

      - name: plan_activate_requires_building
        claim_type: precondition_enforcement
        grounds: [state_machines.StaffingPlan.DRAFT_to_ACTIVE]
        distinguishing_aspect: "activate with zero buildings fails with ERR_PLAN_HAS_NO_BUILDINGS."
        test_recipe:
          setup: ["plan DRAFT with no buildings"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
              captures: { e_id: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_HAS_NO_BUILDINGS"
            - "StaffingPlan.${plan_id}.status remains DRAFT"

      - name: sco_return_revision_cycle
        claim_type: valid_transition
        grounds: [state_machines.ServiceChangeOrder.APPROVED_to_FILED]
        distinguishing_aspect: "FILED -> APPROVED -> FILED -> APPROVED revision loop keeps the student SERVICE_CHANGE_PENDING throughout."
        test_recipe:
          setup: ["plan ACTIVE, B1, S1 ACTIVE_IEP, SCO filed"]
          setup_api_calls:
            - call: "POST /sped-staffing/plans"
              payload: { plan_name: "P", school_year: "2026-27", total_budget_cents: 1000000 }
              as: DistrictStaffingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /sped-staffing/buildings"
              payload: { plan_id: "${plan_id}", name: "Lincoln", building_code: "LIN", hardship_factor: 1.0 }
              as: DistrictStaffingAdmin
              captures: { b1: $.data.id }
            - call: "POST /sped-staffing/plans/${plan_id}/activate"
              as: DistrictStaffingAdmin
            - call: "POST /sped-staffing/students"
              payload: { plan_id: "${plan_id}", building_id: "${b1}", student_ref: "STU-001", iep_service_level: "TRANSITIONAL", iep_minutes_per_week: 1500, required_qualification: "NONE" }
              as: SpecialEdCoordinator
              captures: { s1: $.data.id }
            - call: "POST /sped-staffing/students/${s1}/activate-iep"
              as: SpecialEdCoordinator
