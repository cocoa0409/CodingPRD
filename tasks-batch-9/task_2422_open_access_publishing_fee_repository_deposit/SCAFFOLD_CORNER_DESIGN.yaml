      - name: corner_article_two_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.Article.initial_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / article_funding_and_compliance_dimensions_advance_independently
          rationale: "That instance drives funding_status DRAFT -> ELIGIBILITY_CHECKED -> FUNDING_REQUESTED while compliance_status moves PENDING_DEPOSIT -> EMBARGOED on the same row and asserts neither dimension perturbs the other."

      - name: corner_withdrawal_compensates_the_fund_ledger
        claim_type: compensation
        grounds:
          - state_machines.FundRequest.APPROVED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / withdrawal_releases_encumbrances_restoring_fund_ledgers
          rationale: "That instance withdraws an APPROVED request and asserts every ENCUMBERED allocation becomes RELEASED with released_reason REQUEST_WITHDRAWN and both funds' committed_cents / available_cents return to their pre-approval values."

      - name: corner_ingest_bubbles_up_to_article_grant_and_author
        claim_type: bubble_up
        grounds:
          - state_machines.RepositoryDeposit.SUBMITTED_to_INGESTED
        excluded_because:
          difficulty_instance: transitive_cascade / ingest_cascade_supersede_to_article_to_grant
          rationale: "That instance asserts the four-entity chain from one curation-decision: deposit v2 INGESTED, deposit v1 SUPERSEDED, article latest_deposit_ordinal 2 and COMPLIANT, grant compliant_output_count 1 and mandate_status SATISFIED."

  - section: calculations
    instances:
      - name: corner_screening_score_lands_in_the_watchlist_band
        claim_type: correct_result
        grounds:
          - calculations.predatory_screening_score
          - endpoints[POST /publishers/{id}/screening-runs]
          - entities.Publisher.fields.author_guidance
        distinguishing_aspect: |
          Signals doaj_indexed false (+25), cope_member false (+15), editorial_board_verified
          true (+0), retraction_rate_per_1000 2.0 (+min(25, round_half_up(10)) = 10),
          peer_review_days_median 30 (+0, not below 14) and apc_transparency_score 40
          (-round_half_up(4.0) = -4) sum to exactly 46, which is >= WATCH_MIN 35 and below
          FLAG_MIN 60, so the verdict is WATCHLIST with the pinned watchlist guidance string.
        test_recipe:
          setup:
            - "logical clock at 2026-08-04T00:00:00Z"
            - "one never-screened publisher"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: ScholCommLibrarian
            - call: "POST /publishers"
              payload: { name: "Borderline Publishing House", publisher_code: "BORDER", country_code: "IN" }
              as: AgreementAdmin
              captures: { k1_p_id: $.data.id, k1_status_before: $.data.screening_status, k1_v_before: $.data.version }
          trigger:
            - call: "POST /publishers/${k1_p_id}/screening-runs"
