            - call: "GET /fundraiser/prize-awards"
              payload: { seller_id: "${sA}" }
              as: FundraiserAdmin
              captures: { aw1: "$.data[0].id", aw1_status: "$.data[0].status" }
            - call: "GET /fundraiser/prizes/${pz1}"
              payload: {}
              as: FundraiserAdmin
              captures: { rem1: $.data.remaining_quantity }
            - { call: "POST /fundraiser/orders/${o1}/cancel", payload: {}, as: GroupCoordinator }
            - call: "GET /fundraiser/prize-awards/${aw1}"
              payload: {}
              as: FundraiserAdmin
              captures: { aw1_after: $.data.status }
            - call: "GET /fundraiser/prizes/${pz1}"
              payload: {}
              as: FundraiserAdmin
              captures: { rem2: $.data.remaining_quantity }
          assert:
            - "rem0 == 1 (no awards yet)"
            - "aw1_status == AWARDED and rem1 == 0 (submit evaluation granted the only unit)"
            - "aw1_after == FORFEITED and rem2 == 1 (cancel dropped units_sold to 0; stock restored)"
            - "stock conservation: remaining_quantity == stock_quantity - count(awards IN {AWARDED, FULFILLED}) at all three checkpoints (1==1-0, 0==1-1, 1==1-0)"
            - "ledger of ${gA}: PROVISIONAL_CREDIT +400, PRIZE_COST_DEBIT -25, SALE_REVERSAL_DEBIT -400, PRIZE_COST_REVERSAL +25 — balance returns to 0"
