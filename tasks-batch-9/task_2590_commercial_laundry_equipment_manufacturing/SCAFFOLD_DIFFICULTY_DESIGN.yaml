  - rule_id: boundary_precision_check
    instances:
      - name: bearing_preload_upper_bound_inclusive_on_station_log
        grounds:
          - validations[priority=37]
          - entities.StationLog.fields.bearing_preload_micron
          - errors[ERR_PRELOAD_OUT_OF_SPEC]
          - state_machines.BuildOrder.DRUM_DONE_to_BEARINGS_DONE
        distinguishing_aspect: |
          The AISI_304 preload window [18.00, 32.00] is closed at the top, so exactly 32.00 must be accepted while
          32.01 — one hundredth of a micron past the edge, the smallest representable step at 2-decimal precision —
          must be refused with 422 ERR_PRELOAD_OUT_OF_SPEC. An implementation using a strict `<` upper comparison
          or truncating to whole microns passes the wrong one of these two logs.
