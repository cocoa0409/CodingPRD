              as: PlatformAdmin
              captures: { x1_shp: $.data.id }
            - call: "POST /shippers/${x1_shp}/purchase-orders"
              payload: { po_number: "PO-O", destination_code: "LAX", booking_reference: "BK-O" }
              as: ShipperRep
              as_user_id: "${x1_shp}"
              captures: { x1_po: $.data.id, x1_po_v1: $.data.version }
            - call: "POST /shippers/${x1_shp}/shipments"
              payload: { carrier_id: "${x1_car}", connection_id: "${x1_conn}", mode: "TRUCKLOAD", tracking_reference: "OO-1", mode_reference: "PRO-O1", destination_code: "LAX", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
