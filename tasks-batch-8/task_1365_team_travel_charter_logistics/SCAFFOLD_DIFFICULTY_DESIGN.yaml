  # =====================================================================
  # Rule 4: transitive_cascade (>=2 instances, depth>=3 and depth>=2, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: trip_cancel_cascade_depth3
        grounds:
          - state_machines.Trip.DISRUPTED_to_CANCELLED
          - state_machines.CharterContract.transitions
          - state_machines.FlightLeg.transitions
          - state_machines.ManifestEntry.transitions
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger (trip cancel): Trip -> CharterContract
          (CANCELLED with penalty), CharterContract -> FlightLeg (each leg on the
          contract -> CANCELLED), FlightLeg -> ManifestEntry (every PENDING/CONFIRMED
          entry -> BUMPED with bump_reason=OVERBOOK). Each hop is caused by the
          previous hop, not by the original trip-cancel action directly.
        test_recipe:
          setup:
            - "Trip with executed charter contract, one leg BOOKED on it, two manifest entries CONFIRMED"
            - "Trip has reached DISRUPTED via a contingency event"
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "MIA", display_name: "Miami", league_rest_policy: "STANDARD" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
