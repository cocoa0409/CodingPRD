              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { first_missed: "$.data.cycles_missed_count", first_accruals: "$.data.accruals_posted_count", first_exposure: "$.data.penalty_exposure_cents" }
            - call: "POST /compliance/plan-years/${py}/compliance-runs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { second_missed: "$.data.cycles_missed_count", second_accruals: "$.data.accruals_posted_count", second_exposure: "$.data.penalty_exposure_cents" }
          assert:
            - "${first_missed} == 1, ${first_accruals} == 1 and ${first_exposure} == 60000 (10000 * 3 days * 2.0)"
            - "${second_missed} == 0, ${second_accruals} == 0 and ${second_exposure} == 60000"
            - "GET /compliance/penalty-ledger-entries?plan_year_id=${py} -> total_count == 1 with data[0].deficiency_type == \"MRF_REFRESH\", data[0].onset_date == \"2027-07-06\", data[0].days_open == 3"
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 3 and data.compliance_posture == \"AT_RISK\" (a repeat run does not double-count the same MISSED cycle)"

      - name: tool_sla_rate_threshold_fires_at_the_boundary_minute
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.tool_monthly_uptime
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: boundary_precision_check / tool_uptime_boundary_432_versus_435_downtime_minutes
          rationale: "That §1.8 instance evaluates the same month at 432 downtime minutes (99.00 == target, no breach) and at 435 minutes (98.99 < target, breach opens with a TOOL_SLA accrual), which is exactly the cumulative-threshold boundary pair this corner would ask for."

      - name: gag_escalation_cascade_reaches_every_downstream_entity
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ServiceProviderContract.gag_review_status
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / gag_escalation_cascade_five_links_to_voided_attestation
          rationale: "That §1.8 instance verifies the full five-link CASCADE-A chain end to end (gag flip -> accrual -> exposure/points recompute -> posture flip -> DRAFT attestation voided), including ordering, so a separate N-level chain corner would duplicate it."

      - name: broker_and_consultant_compensation_variants_diverge
        claim_type: dual_variant_calculation
        grounds:
          - calculations.compensation_reasonableness_score
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / compensation_variant_broker_total_vs_consultant_direct
          rationale: "That §1.8 instance feeds identical money to a BROKER and a CONSULTANT disclosure and asserts the divergent price ratios, scores and reasonableness outcomes produced by the TOTAL_WITH_INDIRECT and DIRECT_ONLY variants."

  - section: consistency_model
    instances:
      - name: assessment_response_already_reflects_derived_posture
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.compensation_reasonableness_score
          - calculations.plan_year_compliance_posture
        distinguishing_aspect: "Consistency is immediate and write-through: the assess response itself carries the freshly computed unreasonableness_score and status, and an immediately following read of the parent plan year already shows the +3 deficiency points and the AT_RISK posture — no compliance run, refresh call or second write is needed to materialise the derived parent fields."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 (covered_lives 6000) with a TPA contract and a BROKER contract; posture COMPLIANT with 0 deficiency points."
            - "One RECEIVED CompensationDisclosure on the BROKER contract: direct 1000000, indirect 400000, benchmark median 1000000, services_scope_score 5, disclosure_completeness_score 4."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Harborline Insurance Brokers", vendor_type: "BROKER", contact_email: "service@harborline.example" }
              as: PlanSponsorAdmin
              captures: { v_brk: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_brk}", contract_type: "BROKER", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 2400000 }
              as: PlanSponsorAdmin
              captures: { c_brk: "$.data.id" }
            - call: "POST /compliance/compensation-disclosures"
              payload: { contract_id: "${c_brk}", direct_comp_cents: 1000000, indirect_comp_cents: 400000, benchmark_median_cents: 1000000, services_scope_score: 5, disclosure_completeness_score: 4 }
              as: PlanSponsorAdmin
              captures: { cd: "$.data.id" }
          trigger:
            - call: "POST /compliance/compensation-disclosures/${cd}/assess"
              payload: { assessment_note: "Indirect commissions push the ratio above tolerance." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { score: "$.data.unreasonableness_score", status: "$.data.status" }
          assert:
            - "${score} == 67.67 and ${status} == \"UNREASONABLE\" — the computed score is present in the assess response itself, not only on a later read"
            - "GET /compliance/compensation-disclosures/${cd} -> data.unreasonableness_score == 67.67, data.variant_applied == \"TOTAL_WITH_INDIRECT\", data.assessed_at == \"2027-05-01T09:00:00Z\""
            - "GET /compliance/plan-years/${py} -> data.deficiency_points == 3, data.compliance_posture == \"AT_RISK\" and data.penalty_exposure_cents == 0 immediately after the assess call, with no compliance run in between"
