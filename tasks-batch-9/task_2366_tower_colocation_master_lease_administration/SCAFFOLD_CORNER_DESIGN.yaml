      - name: ground_lease_rent_uses_simple_escalator_with_one_rounding
        claim_type: precision
        grounds:
          - calculations.ground_lease_current_rent
          - entities.GroundLease.fields.current_monthly_rent_cents
        distinguishing_aspect: |
          The ground-lease escalator is SIMPLE with exactly one rounding step: 400000 at 2.5% with
          commencement 2020-06-01 read at the 2026-08-01 clock has n = 6 anniversaries, giving
          400000 * (1 + 0.025*6) = 460000 — not the compounded 464178 that per-anniversary
          rounding (the SiteAmendment rule) would produce.
        test_recipe:
          setup:
            - "One tower with an ACTIVE ground lease: base 400000 cents, escalator 2.5%, commencement 2020-06-01, term end 2031-05-31."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "Simple Escalator Slope", structure_type: "MONOPOLE", rated_capacity_load_units: 6000, min_colocation_elevation_ft: 50, max_elevation_ft: 250, ground_space_total_sqft: 6000 }
              as: PortfolioAdmin
