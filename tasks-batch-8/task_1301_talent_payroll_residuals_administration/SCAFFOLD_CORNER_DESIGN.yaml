# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_1301_talent_payroll_residuals_administration
# Breadth probe: every testable claim of §1.1-§1.7 NOT already covered by a
# §1.8 difficulty instance. Anchors (&c_*) are local to this file.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: union_agreement_create_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - "entities.UnionAgreement.fields.rate_tiers"
          - "validations[priority=28]"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "Omitting the required rate_tiers array is rejected with ERR_VALIDATION (400) before any business rule runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /payroll/union-agreements"
              payload: { union_code: "WGA", name: "WGA Minimum", effective_from: "2026-01-01", effective_to: "2027-01-01", meal_penalty_cents: 2500, rest_penalty_cents: 1000, turnaround_min_hours: 10, phw_pension_pct: 0.06, phw_health_pct: 0.085, phw_welfare_pct: 0.012, residual_base_pct_by_market: { SYNDICATION: 0.045 } }
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_VALIDATION (rate_tiers is a required input field)"
      - name: engagement_create_system_fields_server_minted
        claim_type: system_fields
        grounds:
          - "entities.Engagement"
        distinguishing_aspect: "Server mints id/created_at/updated_at and starts version at 1 on engagement creation."
        test_recipe:
          setup: ["agreement RATIFIED; production SHOOTING; performer registered"]
          setup_api_calls:
            - &c_agr
              call: "POST /payroll/union-agreements"
              payload: { union_code: "SAG_AFTRA", name: "SAG Basic 2026", effective_from: "2026-01-01", effective_to: "2027-01-01", rate_tiers: [{ tier_code: "T1", category: "PRINCIPAL", day_rate_cents: 100000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }, { tier_code: "T2", category: "BACKGROUND", day_rate_cents: 20000, ot_daily_threshold_minutes: 480, ot_multiplier: 1.5 }], meal_penalty_cents: 2500, rest_penalty_cents: 1000, turnaround_min_hours: 10, phw_pension_pct: 0.06, phw_health_pct: 0.085, phw_welfare_pct: 0.012, residual_base_pct_by_market: { NETWORK_REBROADCAST: 0.025, SYNDICATION: 0.045, STREAMING: 0.012 } }
              as: PayrollAdmin
              captures: { agr: $.data.id }
            - &c_ratify
              call: "POST /payroll/union-agreements/${agr}/ratify"
              payload: {}
              as: PayrollAdmin
            - &c_prod
              call: "POST /payroll/productions"
              payload: { title: "Picture A", production_company: "Studio X", union_agreement_id: "${agr}", production_type: "FILM", jurisdictions: [{ jurisdiction_code: "CA", tax_pct: 0.10, valid_from: "2026-01-01", valid_to: "2027-01-01" }, { jurisdiction_code: "NM", tax_pct: 0.05, valid_from: "2026-01-01", valid_to: "2027-01-01" }] }
              as: PayrollAdmin
              captures: { prod: $.data.id }
            - &c_adv
              call: "POST /payroll/productions/${prod}/advance"
              payload: {}
              as: PayrollAdmin
            - &c_perf
              call: "POST /payroll/performers"
              payload: { legal_name: "Pat Star", primary_union_code: "SAG_AFTRA", tax_residency_state: "CA" }
              as: PayrollAdmin
              captures: { perf: $.data.id }
          trigger:
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T1", payee_type: "DIRECT", weekly_guarantee_cents: 500000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11" }
              as: ProductionAccountant
              captures: { eng: $.data.id }
          assert:
            - "Response data carries a server-minted UUID id, ISO-8601 created_at/updated_at, version == 1, status == DRAFT"
            - "Computed fields initialize to zero: accrued_penalty_cents == 0, accrued_adjustment_cents == 0, ytd_paid_cents == 0"
      - name: garnishment_order_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.GarnishmentOrder.fields.fixed_amount_cents"
          - "entities.GarnishmentOrder.fields.total_withheld_cents"
        distinguishing_aspect: "Creating an order with pct_of_disposable only leaves fixed_amount_cents null, total_withheld_cents 0, status ACTIVE."
        test_recipe:
          setup: ["performer registered"]
          setup_api_calls:
            - *c_perf
          trigger:
            - call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf}", creditor_name: "County CSA", order_type: "CHILD_SUPPORT", priority_rank: 1, pct_of_disposable: 0.20 }
              as: PayrollAdmin
              captures: { g1: $.data.id }
          assert:
            - "GarnishmentOrder.${g1}.fixed_amount_cents is null (default), total_withheld_cents == 0 (default), status == ACTIVE"
      - name: engagement_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Reading a random UUID engagement yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /payroll/engagements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PayrollClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND"
      - name: engagement_create_with_missing_production_returns_404
        claim_type: parent_relationships
        grounds:
          - "validations[priority=3]"
          - "entities.Engagement.fields.production_id"
        distinguishing_aspect: "A body FK (production_id) pointing at a non-existent production is rejected 404 before tier/loan-out checks."
        test_recipe:
          setup: ["agreement RATIFIED; performer registered"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_perf
          trigger:
            - call: "POST /payroll/engagements"
              payload: { production_id: "00000000-0000-0000-0000-000000000000", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T1", payee_type: "DIRECT", weekly_guarantee_cents: 500000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11" }
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_NOT_FOUND (existence, priority 3, precedes ERR_TIER_NOT_FOUND at priority 21)"
      - name: timecard_computed_fields_server_derived
        claim_type: computed_fields
        grounds:
          - "entities.Timecard.fields.worked_minutes"
          - "entities.Timecard.fields.overtime_minutes"
          - "entities.Timecard.fields.provisional_penalty_cents"
        distinguishing_aspect: "worked_minutes/overtime_minutes/provisional_penalty_cents are computed server-side at creation: 630 / 150 / 2500 for the TC-A fixture."
        test_recipe:
          setup: ["standard fixture with engagement ACTIVE (T1)"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - &c_eng
              call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T1", payee_type: "DIRECT", weekly_guarantee_cents: 500000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11" }
              as: ProductionAccountant
              captures: { eng: $.data.id }
            - &c_engsub
              call: "POST /payroll/engagements/${eng}/submit"
              payload: {}
              as: ProductionAccountant
            - &c_engapp
              call: "POST /payroll/engagements/${eng}/approve"
              payload: {}
              as: PayrollSupervisor
          trigger:
            - &c_tca
              call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T14:30:00Z", first_meal_in: "2026-08-10T15:00:00Z", wrap_time: "2026-08-10T19:00:00Z", scheduled_hours: 10 }
              as: ProductionAccountant
              captures: { tc: $.data.id }
          assert:
            - "Timecard.${tc}.worked_minutes == 630 and overtime_minutes == 150 (server-computed)"
            - "provisional_penalty_cents == 2500 (scheduled_hours 10 > 6); review_status == SUBMITTED, payment_status == UNBATCHED (initial states)"
      - name: penalty_assessment_immutable_common_fields
        claim_type: immutability
        grounds:
          - "entities.PenaltyAssessment"
        distinguishing_aspect: "PenaltyAssessment is common_fields:false — its read payload exposes id and created_at but no version/updated_at; there is no update endpoint, only the waive action."
        test_recipe:
          setup: ["standard fixture; TC-A approved so its MEAL PenaltyAssessment exists"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - &c_tcaapp
              call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
          trigger:
            - call: "GET /payroll/penalty-assessments"
              payload: { timecard_id: "${tc}" }
              as: PayrollClerk
              captures: { pen: "$.data[0].id" }
          assert:
            - "Exactly one row: penalty_type == MEAL, units == 1, amount_cents == 2500, status == CONFIRMED"
            - "Row has id and created_at but no version or updated_at keys (immutable ledger row)"

  - section: state_machines
    instances:
      - name: timecard_approve_from_flagged_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.Timecard.review_FLAGGED_to_SUBMITTED"
          - "validations[priority=5]"
          - "errors[ERR_TIMECARD_INVALID_STATE]"
        distinguishing_aspect: "Approve is defined only from SUBMITTED; from FLAGGED it must fail with ERR_TIMECARD_INVALID_STATE and no side effects."
        test_recipe:
          setup: ["standard fixture; TC-A submitted then flagged"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - call: "POST /payroll/timecards/${tc}/flag"
              payload: { flag_reason: "verify meal times" }
              as: PayrollClerk
          trigger:
            - call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_TIMECARD_INVALID_STATE"
            - "Timecard.${tc}.review_status remains FLAGGED; no PenaltyAssessment rows exist for it"
      - name: timecard_double_approve_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Timecard.review_SUBMITTED_to_APPROVED"
          - "errors[ERR_TIMECARD_INVALID_STATE]"
        distinguishing_aspect: "Approving an already-APPROVED timecard is rejected; the second trigger must not double-create PenaltyAssessments."
        test_recipe:
          setup: ["standard fixture; TC-A approved once"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
          trigger:
            - call: "POST /payroll/timecards/${tc}/approve"
              payload: {}
              as: PayrollClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_TIMECARD_INVALID_STATE"
            - "GET /payroll/penalty-assessments?timecard_id=${tc} still returns exactly one row (no duplicate MEAL assessment)"
      - name: garnishment_release_from_released_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.GarnishmentOrder.ACTIVE_to_RELEASED"
          - "errors[ERR_RESOURCE_INVALID_STATE]"
        distinguishing_aspect: "RELEASED is terminal: a second release is rejected with ERR_RESOURCE_INVALID_STATE."
        test_recipe:
          setup: ["performer with an ACTIVE garnishment order, released once"]
          setup_api_calls:
            - *c_perf
            - call: "POST /payroll/garnishment-orders"
              payload: { performer_id: "${perf}", creditor_name: "County CSA", order_type: "CHILD_SUPPORT", priority_rank: 1, pct_of_disposable: 0.20 }
              as: PayrollAdmin
              captures: { g1: $.data.id }
            - call: "POST /payroll/garnishment-orders/${g1}/release"
              payload: {}
              as: PayrollAdmin
          trigger:
            - call: "POST /payroll/garnishment-orders/${g1}/release"
              payload: {}
              as: PayrollAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_RESOURCE_INVALID_STATE; status remains RELEASED"
      - name: residual_dispute_from_calculated_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.ResidualObligation.APPROVED_to_DISPUTED"
          - "errors[ERR_RESIDUAL_INVALID_STATE]"
        distinguishing_aspect: "Dispute is defined only from APPROVED; from CALCULATED it fails with ERR_RESIDUAL_INVALID_STATE."
        test_recipe:
          setup: ["standard fixture; residual SYNDICATION created and calculated (CALCULATED, never approved)"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - &c_resid
              call: "POST /payroll/residual-obligations"
              payload: { engagement_id: "${eng}", reuse_market: "SYNDICATION", window_start: "2027-01-05", window_end: "2027-06-30", reported_gross_receipts_cents: 20000000 }
              as: ProductionAccountant
              captures: { res: $.data.id }
            - &c_rescalc
              call: "POST /payroll/residual-obligations/${res}/calculate"
              payload: {}
              as: PayrollClerk
          trigger:
            - call: "POST /payroll/residual-obligations/${res}/dispute"
              payload: { dispute_reason: "premature dispute" }
              as: UnionAuditor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_RESIDUAL_INVALID_STATE; status remains CALCULATED"
      - name: amendment_approval_supersedes_target
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Engagement"
          - "concurrency_rules[engagement-amendment-stale-version]"
        distinguishing_aspect: "Happy-path OCC: amending with the current version flips the target ACTIVE -> AMENDMENT_PENDING at create and AMENDMENT_PENDING -> SUPERSEDED at amendment approval (self-referential amendment chain)."
        test_recipe:
          setup:
            - "standard fixture; E1 ACTIVE; its current version captured via GET (1 create + 1 submit + 1 approve = 3)"
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - call: "GET /payroll/engagements/${eng}"
              payload: {}
              as: PayrollClerk
              captures: { e1v: $.data.version }
          trigger:
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T2", payee_type: "DIRECT", weekly_guarantee_cents: 400000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11", supersedes_engagement_id: "${eng}", expected_engagement_version: "${e1v}" }
              as: ProductionAccountant
              captures: { eng2: $.data.id }
            - call: "POST /payroll/engagements/${eng2}/submit"
              payload: {}
              as: ProductionAccountant
            - call: "POST /payroll/engagements/${eng2}/approve"
              payload: {}
              as: PayrollSupervisor
          assert:
            - "After amendment create: Engagement.${eng}.status == AMENDMENT_PENDING and version == ${e1v} + 1 (OCC accepted the current version)"
            - "Amendment E2 was allowed to submit despite the identical window (supersede target excluded from the double-booking check)"
            - "After amendment approve: Engagement.${eng}.status == SUPERSEDED and Engagement.${eng2}.status == ACTIVE"
      - name: engagement_reject_restores_amendment_target
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Engagement.PENDING_APPROVAL_to_DRAFT"
        distinguishing_aspect: "Compensation pattern: rejecting a PENDING_APPROVAL amendment restores its target AMENDMENT_PENDING -> ACTIVE (the create-time side effect is undone, no drift)."
        test_recipe:
          setup: ["standard fixture; E1 ACTIVE; amendment E2 created (E1 now AMENDMENT_PENDING) and submitted"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - call: "GET /payroll/engagements/${eng}"
              payload: {}
              as: PayrollClerk
              captures: { e1v: $.data.version }
            - call: "POST /payroll/engagements"
              payload: { production_id: "${prod}", union_agreement_id: "${agr}", performer_id: "${perf}", tier_code: "T2", payee_type: "DIRECT", weekly_guarantee_cents: 400000, guaranteed_days: 20, start_date: "2026-08-03", end_date: "2026-09-11", supersedes_engagement_id: "${eng}", expected_engagement_version: "${e1v}" }
              as: ProductionAccountant
              captures: { eng2: $.data.id }
            - call: "POST /payroll/engagements/${eng2}/submit"
              payload: {}
              as: ProductionAccountant
          trigger:
            - call: "POST /payroll/engagements/${eng2}/reject"
              payload: {}
              as: PayrollSupervisor
          assert:
            - "Engagement.${eng2}.status returns to DRAFT (revert loop)"
            - "Engagement.${eng}.status returns to ACTIVE (compensation of the amendment create side effect)"
      - name: production_wrap_cascades_active_engagements
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Production.SHOOTING_to_WRAPPED"
          - "state_machines.Engagement.ACTIVE_to_WRAPPED"
        distinguishing_aspect: "Cascade-down: advancing SHOOTING -> WRAPPED wraps the production's ACTIVE engagements; a subsequent timecard create against the WRAPPED engagement fails ERR_ENGAGEMENT_NOT_ACTIVE."
        test_recipe:
          setup: ["standard fixture with E1 ACTIVE"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
          trigger:
            - call: "POST /payroll/productions/${prod}/advance"
              payload: {}
              as: PayrollAdmin
            - call: "POST /payroll/timecards"
              payload: { engagement_id: "${eng}", work_date: "2026-08-10", jurisdiction_code: "CA", call_time: "2026-08-10T08:00:00Z", first_meal_out: "2026-08-10T13:30:00Z", first_meal_in: "2026-08-10T14:00:00Z", wrap_time: "2026-08-10T17:00:00Z", scheduled_hours: 9 }
              as: ProductionAccountant
              captures: { err: $.data.error_id }
          assert:
            - "Production.${prod}.status == WRAPPED and Engagement.${eng}.status == WRAPPED (cascade)"
            - "Timecard create after wrap: HTTP 409 error_id == ERR_ENGAGEMENT_NOT_ACTIVE"
      - name: grievance_escalated_branch_resolves
        claim_type: valid_transition
        grounds:
          - "state_machines.GrievanceCase.UNDER_REVIEW_to_ESCALATED"
          - "state_machines.GrievanceCase.ESCALATED_to_RESOLVED"
        distinguishing_aspect: "Branching fork-join: the ESCALATED branch also reaches RESOLVED; a zero award creates no adjustment pay line."
        test_recipe:
          setup: ["standard fixture; grievance FILED then responded (UNDER_REVIEW); no OPEN batch needed (award 0)"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - &c_griev
              call: "POST /payroll/grievance-cases"
              payload: { engagement_id: "${eng}", category: "PENALTY_OMITTED", claimed_amount_cents: 2500, description: "meal penalty missing on 08-10" }
              as: UnionAuditor
              as_user_id: "aud-1"
              captures: { grv: $.data.id }
            - &c_grievresp
              call: "POST /payroll/grievance-cases/${grv}/respond"
              payload: { response_note: "under review" }
              as: PayrollClerk
          trigger:
            - call: "POST /payroll/grievance-cases/${grv}/escalate"
              payload: {}
              as: UnionAuditor
            - call: "POST /payroll/grievance-cases/${grv}/resolve"
              payload: { awarded_amount_cents: 0 }
              as: PayrollSupervisor
          assert:
            - "After escalate: status == ESCALATED"
            - "After resolve from ESCALATED: status == RESOLVED, awarded_amount_cents == 0"
            - "GET /payroll/pay-lines?engagement_id=${eng} shows zero GRIEVANCE_ADJUSTMENT lines (zero award creates no line; no OPEN batch required)"
  - section: calculations
    instances:
      - name: remittance_aggregation_matches_line_sums
        claim_type: correct_result
        grounds:
          - "calculations.remittance_aggregation"
          - "entities.RemittanceReport"
        distinguishing_aspect: "Remittance sums per-line round_half_up components over the batch's lines for the given agreement: 8963 pension + 12697 health + 1793 welfare = 23453, exactly the sum of member lines' phw_cents."
        test_recipe:
          setup: ["standard fixture; TC-A approved; batch closed, approved (SoD), disbursed"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
            - *c_perf
            - *c_eng
            - *c_engsub
            - *c_engapp
            - *c_tca
            - *c_tcaapp
            - &c_batch
              call: "POST /payroll/pay-batches"
              payload: { period_label: "2026-W33", cutoff_date: "2026-08-31" }
              as: PayrollClerk
              as_user_id: "clerk-1"
              captures: { bat: $.data.id }
            - &c_close
              call: "POST /payroll/pay-batches/${bat}/close"
              payload: {}
              as: PayrollClerk
            - &c_batapp
              call: "POST /payroll/pay-batches/${bat}/approve"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
            - &c_disb
              call: "POST /payroll/pay-batches/${bat}/disburse"
              payload: {}
              as: PayrollSupervisor
              as_user_id: "sup-1"
          trigger:
            - call: "POST /payroll/remittance-reports"
              payload: { pay_batch_id: "${bat}", union_agreement_id: "${agr}" }
              as: PayrollClerk
              captures: { rem: $.data.id }
          assert:
            - "RemittanceReport.${rem}.pension_cents == 8963 and health_cents == 12697 and welfare_cents == 1793"
            - "pension+health+welfare == 23453 == the batch's total_phw_cents (single agreement covers all lines)"
            - "status == DRAFT at creation"
      - name: residual_second_window_discount_applies
        claim_type: constants_applied
        grounds:
          - "calculations.residual_calculation"
        distinguishing_aspect: "Window-sequence tiering: the second SYNDICATION window for the same engagement computes with discount 0.90 (1 - 0.10 x (2-1)), giving 20000000 x 0.045 x 0.90 == 810000."
        test_recipe:
          setup: ["standard fixture; residual W1 (2027-01-05..2027-06-30) exists; residual W2 (2027-07-01..2027-12-31) same market created after W1"]
          setup_api_calls:
            - *c_agr
            - *c_ratify
            - *c_prod
            - *c_adv
