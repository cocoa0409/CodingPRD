      - name: settlement_finalize_non_monotone_batch_returns_sequence_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=9]
          - errors.ERR_BATCH_SEQ_NOT_MONOTONE
        distinguishing_aspect: "Finalizing batch 1 after batch 2 is already finalized fails the strictly-ascending sequence rule with ERR_BATCH_SEQ_NOT_MONOTONE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A HIGH-risk USD category and an ACTIVE DIRECT merchant with settlements in batches 1 and 2; batch 2 already finalized."
          setup_api_calls:
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkIssuer
            - call: "POST /network/industry-categories"
              payload: { industry_code: "USD-5812", industry_name: "USD Dining", risk_tier: "HIGH", base_discount_rate_bps: 250, high_risk_flag: true }
              as: NetworkAcquirer
              captures: { ic_v2: $.data.id }
            - call: "POST /network/merchants"
              payload: { industry_category_id: "${ic_v2}", merchant_name: "Validation Merchant 2", region_code: "US-NE", acquisition_channel: "DIRECT" }
              as: NetworkAcquirer
              captures: { m_v2: $.data.id, m_v2_v: $.data.version }
            - call: "POST /network/merchants/${m_v2}/accept"
              payload: { expected_merchant_version: "${m_v2_v}" }
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_v2}/activate"
              payload: {}
              as: NetworkAcquirer
            - call: "POST /network/merchants/${m_v2}/settlements"
              payload: { settlement_cycle: 1, gross_volume_cents: 500000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
            - call: "POST /network/merchants/${m_v2}/settlements"
              payload: { settlement_cycle: 2, gross_volume_cents: 500000, refund_volume_cents: 0 }
              as: NetworkSettlementOps
            - call: "POST /network/merchants/${m_v2}/funding/batches/2/finalize"
              payload: {}
              as: NetworkSettlementOps
          trigger:
            - call: "POST /network/merchants/${m_v2}/funding/batches/1/finalize"
              payload: {}
              as: NetworkSettlementOps
              captures: { v2_err: $.data.error_id }
          assert:
            - "the response status is 409 and the error_id is ERR_BATCH_SEQ_NOT_MONOTONE"

      - name: offer_consent_by_a_different_merchant_returns_forbidden
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
