scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lien_demand_provisional_vs_final_medicare
        grounds:
          - calculations.provisional_lien_demand
          - state_machines.Lien.IDENTIFIED_to_NOTIFIED
          - state_machines.Lien.NOTIFIED_to_RESOLVED
        distinguishing_aspect: |
          Different entity domain from attorney_fee (Lien, not Claim).
          The provisional variant discounts a Medicare lien by 40% at NOTIFIED,
          while the final variant on the holder-silent path uses the asserted
          amount undiscounted — producing different final_demand_cents for the
          same lien data.
        test_recipe:
          setup:
            - "Program exists with qsf_principal_cents=100000000"
            - "Published TierMatrix row: injury_category=QUALIFYING_CAT_A, severity [50,100], base_award_cents=10000000"
            - "Claimant with represented_by_counsel=false, injury_category=QUALIFYING_CAT_A, exposure 2020-01-01..2022-12-31, diagnosis 2021-06-15"
            - "Claim progressed to LIENS_PENDING via records & tier assignment"
            - "One MEDICARE lien with asserted_amount_cents=100000 identified, notified, then silent-resolved"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-T1", tort_name: "Glyphosate", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 50, severity_score_max: 100, base_award_cents: 10000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Alice Anderson", date_of_birth: "1960-01-01", ssn_last4: "1234", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id, claim_v0: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Gen Hosp", record_type: "DIAGNOSTIC", severity_score: 75, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { rid1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Gen Hosp", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { rid2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${rid1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${rid2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { claim_v_pre_tier: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${claim_v_pre_tier}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "MEDICARE", holder_name: "CMS", asserted_amount_cents: 100000 }
              as: LienAnalyst
              captures: { lid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid}/notify"
              payload: {}
              as: LienAnalyst
              captures: { provisional_seen: $.data.provisional_demand_cents }
            - call: "POST /settlement-programs/${pid}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: LienAnalyst
              captures: { claim_v_pre_resolve: $.data.version }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid}/resolve"
              payload: { expected_claim_version: "${claim_v_pre_resolve}" }
              as: LienAnalyst
              captures: { final_seen: $.data.final_demand_cents }
          assert:
            - "captured provisional_seen == 60000"
            - "captured final_seen == 100000"
            - "Lien.${lid}.final_demand_cents == 100000 (silent path: asserted, no 40% discount)"
            - "provisional variant (60000) differs from final variant (100000) for identical lien data"

      - name: attorney_fee_per_line_vs_sum_then_round
        grounds:
          - calculations.attorney_fee
          - entities.Claim.fields.attorney_fee_cents
        distinguishing_aspect: |
          Different entity domain from lien_demand (Claim-level attorney fee,
          not per-lien provisional). Canonical variant rounds each lien's fee
          share then sums; the rejected variant sums unrounded shares then
          rounds once. For lien finals of 101 and 103 cents the two variants
          diverge by 1 cent (81 vs 82).
        test_recipe:
          setup:
            - "Program exists with qsf_principal_cents=100000000"
            - "Published matrix: QUALIFYING_CAT_A, severity [50,100], base_award_cents=1000 (so gross=1000)"
            - "Claimant represented_by_counsel=true, QUALIFYING_CAT_A"
            - "Claim in TIER_ASSIGNED with gross_award_cents=1000"
            - "Two PRIVATE_INSURER liens resolved at 101 and 103 cents final_demand"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-T2", tort_name: "Talc", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 50, severity_score_max: 100, base_award_cents: 1000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Bob Brown", date_of_birth: "1955-03-01", ssn_last4: "9876", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: true }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Onc Center", record_type: "DIAGNOSTIC", severity_score: 80, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { rid1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Onc Center", record_type: "TREATMENT", severity_score: 70, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { rid2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${rid1}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records/${rid2}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { claim_v_pre_tier: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${claim_v_pre_tier}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "PRIVATE_INSURER", holder_name: "InsCo A", asserted_amount_cents: 101 }
              as: LienAnalyst
              captures: { lid1: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens"
              payload: { lien_type: "PRIVATE_INSURER", holder_name: "InsCo B", asserted_amount_cents: 103 }
              as: LienAnalyst
              captures: { lid2: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid1}/notify"
              payload: {}
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid1}/begin-negotiation"
              payload: {}
              as: LienAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: LienAnalyst
              captures: { v_r1: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid1}/resolve"
              payload: { expected_claim_version: "${v_r1}", final_demand_cents: 101 }
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid2}/notify"
              payload: {}
              as: LienAnalyst
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid2}/begin-negotiation"
              payload: {}
              as: LienAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: LienAnalyst
              captures: { v_r2: $.data.version }
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/liens/${lid2}/resolve"
              payload: { expected_claim_version: "${v_r2}", final_demand_cents: 103 }
              as: LienAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { fee_seen: $.data.attorney_fee_cents, total_lien_seen: $.data.total_lien_cents, net_seen: $.data.net_award_cents }
          assert:
            - "captured total_lien_seen == 204"
            - "captured fee_seen == 237 (per-line: round(101*.4)+round(103*.4)=40+41=81; gross-liens=796; round(796*.4)=318; 318-81=237)"
            - "captured net_seen == 559 (= 1000 - 204 - 237)"
            - "sum-then-round rejected variant would produce lien_share_total=82 -> fee=236, net=560; canonical variant yields 237/559"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_lien_demand_tiered_branch_mode_a
        grounds:
          - calculations.provisional_lien_demand
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and conditional branch on entity
          state. MEDICAL_PROVIDER lien discount switches from 0.80 to 0.40
          based on claim.gross_award_cents relative to HARDSHIP_FLOOR_CENTS
          (5000000). Inputs: lien_type, asserted_amount_cents,
          claim.gross_award_cents.
        test_recipe:
          setup:
            - "Two programs with published matrix yielding gross_award_cents=4000000 (below floor) and 6000000 (above floor)"
            - "Each program has a claim with a MEDICAL_PROVIDER lien, asserted=1000000, transitioned to NOTIFIED"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-LOW", tort_name: "Low", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid_low: $.data.id }
            - call: "POST /settlement-programs/${pid_low}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 4000000 }
              as: ProgramAdministrator
              captures: { tmid_low: $.data.id }
            - call: "POST /settlement-programs/${pid_low}/tier-matrices/${tmid_low}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid_low}/claimants"
              payload: { full_name: "Carol", date_of_birth: "1960-01-01", ssn_last4: "1111", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid_low: $.data.id }
            - call: "POST /settlement-programs/${pid_low}/claims"
              payload: { claimant_id: "${clid_low}" }
              as: IntakeSpecialist
              captures: { cid_low: $.data.id }
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
              captures: { r1_low: $.data.id }
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
              captures: { r2_low: $.data.id }
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/medical-records/${r1_low}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/medical-records/${r2_low}/accept"
              payload: {}
              as: RecordsAnalyst
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/verify-injury"
              payload: {}
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid_low}/claims/${cid_low}"
              as: ProgramAdministrator
              captures: { v_low: $.data.version }
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/assign-tier"
              payload: { tier_matrix_id: "${tmid_low}", expected_claim_version: "${v_low}" }
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid_low}/claims/${cid_low}/liens"
              payload: { lien_type: "MEDICAL_PROVIDER", holder_name: "Clinic A", asserted_amount_cents: 1000000 }
              as: LienAnalyst
              captures: { lid_low: $.data.id }
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-HIGH", tort_name: "High", qsf_principal_cents: 100000000 }
