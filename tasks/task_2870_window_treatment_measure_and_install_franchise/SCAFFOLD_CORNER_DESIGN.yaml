        excluded_because:
          difficulty_instance: commissioning_dimension_cycles_through_failed_while_install_status_stays_scheduled
          rationale: "The named §1.8 instance walks PENDING -> PAIRED -> FAILED -> PAIRED -> VERIFIED while install_status stays SCHEDULED, asserting both dimensions at every step."

