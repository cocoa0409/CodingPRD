# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Enumerates testable claims from SCAFFOLD.yaml §1.1-§1.7 not already covered by §1.8.
scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: affiliate_creation_defaults_active_and_zero_balances
        claim_type: creation_defaults
        grounds: [entities.Affiliate]
        distinguishing_aspect: "POST /pro/affiliates returns 201 with status ACTIVE, royalty_balance_cents 0, total_paid_cents 0, version 1 — input cannot preset computed fields."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Fresh Pub", party_type: PUBLISHER, affiliation_code: "FP1" }
              as: ProRegistrar
              captures: { fp_status: $.data.status, fp_bal: $.data.royalty_balance_cents, fp_paid: $.data.total_paid_cents, fp_ver: $.data.version }
          assert:
            - "fp_status == ACTIVE"
            - "fp_bal == 0 and fp_paid == 0"
            - "fp_ver == 1"
      - name: affiliate_duplicate_affiliation_code_rejected
        claim_type: type_constraint_uniqueness
        grounds: [entities.Affiliate.fields.affiliation_code]
        distinguishing_aspect: "affiliation_code is unique across affiliates; second create with the same code fails."
        test_recipe:
          setup: ["one affiliate with affiliation_code DUP1 exists"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "First", party_type: PUBLISHER, affiliation_code: "DUP1" }
              as: ProRegistrar
          trigger:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "Second", party_type: SONGWRITER, affiliation_code: "DUP1" }
              as: ProRegistrar
          assert:
            - "response error_id == ERR_VALIDATION (400) or a domain duplicate-code error; the second affiliate is not created"
      - name: work_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Work, response_envelope]
        distinguishing_aspect: "GET /pro/works honours limit/offset and returns total_count + has_more; envelope contains meta.api_request_id."
        test_recipe:
          setup: ["three works registered by one publisher"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "List Pub", party_type: PUBLISHER, affiliation_code: "LP1" }
              as: ProRegistrar
              captures: { lp_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "W1", registered_by_affiliate_id: "${lp_id}" }
              as: Publisher
              as_user_id: "${lp_id}"
            - call: "POST /pro/works"
              payload: { title: "W2", registered_by_affiliate_id: "${lp_id}" }
              as: Publisher
              as_user_id: "${lp_id}"
            - call: "POST /pro/works"
              payload: { title: "W3", registered_by_affiliate_id: "${lp_id}" }
              as: Publisher
              as_user_id: "${lp_id}"
          trigger:
            - call: "GET /pro/works"
              payload: { registered_by_affiliate_id: "${lp_id}", limit: 2, offset: 0 }
              as: ProRegistrar
              captures: { pg_first_title: "$.data[0].title", pg_second_title: "$.data[1].title" }
          assert:
            - "page returns exactly 2 rows (limit honored); envelope-level total_count == 3 and has_more == true as declared by response_envelope.pagination_fields"
            - "pg_first_title == W1 and pg_second_title == W2 (offset 0 page in created_at order)"
      - name: work_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Work, errors.ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /pro/works/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ProRegistrar
          assert:
            - "response error_id == ERR_NOT_FOUND (404)"
      - name: performance_event_computed_fields_ignore_input
        claim_type: computed_fields
        grounds: [entities.PerformanceEvent.fields.credit_units, entities.PerformanceEvent.fields.universe_estimated_plays]
        distinguishing_aspect: "credit_units and universe_estimated_plays are server-computed at ingest; a census MONITORING event with play_count 100 on NETWORK_TV/PRIME gets universe 100 and credit_units 250.0000 regardless of any client hint."
        test_recipe:
          setup: ["confirmed work + ACTIVE license covering 2026"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "CF Pub", party_type: PUBLISHER, affiliation_code: "CFP" }
              as: ProRegistrar
              captures: { cf_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "CF Song", registered_by_affiliate_id: "${cf_id}" }
              as: Publisher
              as_user_id: "${cf_id}"
              captures: { cf_work: $.data.id }
            - call: "POST /pro/works/${cf_work}/share-claims"
              payload: { affiliate_id: "${cf_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${cf_id}"
            - call: "POST /pro/works/${cf_work}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "CF Net", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { cf_lic_ee: $.data.id, cf_lic_ver: $.data.version }
            - call: "POST /pro/licensees/${cf_lic_ee}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${cf_lic_ver}" }
              as: ProLicensingAdmin
              captures: { cf_lic: $.data.id }
          trigger:
            - call: "POST /pro/performances"
              payload: { work_id: "${cf_work}", license_id: "${cf_lic}", performance_date: "2026-03-01", medium: NETWORK_TV, daypart: PRIME, source: MONITORING, play_count: 100 }
              as: RoyaltyDistributor
              captures: { cf_universe: $.data.universe_estimated_plays, cf_credit: $.data.credit_units }
          assert:
            - "cf_universe == 100"
            - "cf_credit == 250.0 (2.5 * 2.0 * 100, single writer claim count 1 so no feature bonus)"
      - name: feature_bonus_applies_with_three_writer_claims
        claim_type: computed_fields
        grounds: [calculations.performance_weight, entities.PerformanceEvent.fields.credit_units]
        distinguishing_aspect: "A work with three ACCEPTED writer claims gets FEATURE_BONUS_MULT 1.1: same medium/daypart/plays yields credit_units 275.0 instead of 250.0."
        test_recipe:
          setup: ["confirmed work with 3 ACCEPTED writer claims (2000+2000+2000 bps) plus 4000-bps publisher claim; ACTIVE license"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "FB Pub", party_type: PUBLISHER, affiliation_code: "FBP" }
              as: ProRegistrar
              captures: { fb_pub: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "FB W1", party_type: SONGWRITER, affiliation_code: "FBW1" }
              as: ProRegistrar
              captures: { fb_w1: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "FB W2", party_type: SONGWRITER, affiliation_code: "FBW2" }
              as: ProRegistrar
              captures: { fb_w2: $.data.id }
            - call: "POST /pro/affiliates"
              payload: { legal_name: "FB W3", party_type: SONGWRITER, affiliation_code: "FBW3" }
              as: ProRegistrar
              captures: { fb_w3: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "FB Song", registered_by_affiliate_id: "${fb_pub}" }
              as: Publisher
              as_user_id: "${fb_pub}"
              captures: { fb_work: $.data.id }
            - call: "POST /pro/works/${fb_work}/share-claims"
              payload: { affiliate_id: "${fb_w1}", role: WRITER, collection_share_bps: 2000, interest_share_bps: 2000 }
              as: Songwriter
              as_user_id: "${fb_w1}"
            - call: "POST /pro/works/${fb_work}/share-claims"
              payload: { affiliate_id: "${fb_w2}", role: WRITER, collection_share_bps: 2000, interest_share_bps: 2000 }
              as: Songwriter
              as_user_id: "${fb_w2}"
            - call: "POST /pro/works/${fb_work}/share-claims"
              payload: { affiliate_id: "${fb_w3}", role: WRITER, collection_share_bps: 2000, interest_share_bps: 2000 }
              as: Songwriter
              as_user_id: "${fb_w3}"
            - call: "POST /pro/works/${fb_work}/share-claims"
              payload: { affiliate_id: "${fb_pub}", role: PUBLISHER, collection_share_bps: 4000, interest_share_bps: 4000 }
              as: Publisher
              as_user_id: "${fb_pub}"
            - call: "POST /pro/works/${fb_work}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "FB Net", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { fb_lic_ee: $.data.id, fb_lic_ver: $.data.version }
            - call: "POST /pro/licensees/${fb_lic_ee}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${fb_lic_ver}" }
              as: ProLicensingAdmin
              captures: { fb_lic: $.data.id }
          trigger:
            - call: "POST /pro/performances"
              payload: { work_id: "${fb_work}", license_id: "${fb_lic}", performance_date: "2026-03-01", medium: NETWORK_TV, daypart: PRIME, source: MONITORING, play_count: 100 }
              as: RoyaltyDistributor
              captures: { fb_credit: $.data.credit_units }
          assert:
            - "fb_credit == 275.0 (2.5 * 2.0 * 1.1 * 100 — three ACCEPTED writer claims trigger the feature bonus)"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: work_confirm_from_confirmed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Work]
        distinguishing_aspect: "Confirming an already-CONFIRMED work is not a declared transition; returns ERR_INVALID_STATE and leaves the work unchanged."
        test_recipe:
          setup: ["work CONFIRMED via the standard claim+confirm chain"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "IC Pub", party_type: PUBLISHER, affiliation_code: "ICP" }
              as: ProRegistrar
              captures: { ic_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "IC Song", registered_by_affiliate_id: "${ic_id}" }
              as: Publisher
              as_user_id: "${ic_id}"
              captures: { ic_work: $.data.id }
            - call: "POST /pro/works/${ic_work}/share-claims"
              payload: { affiliate_id: "${ic_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${ic_id}"
            - call: "POST /pro/works/${ic_work}/confirm"
              payload: {}
              as: ProRegistrar
          trigger:
            - call: "POST /pro/works/${ic_work}/confirm"
              payload: {}
              as: ProRegistrar
          assert:
            - "response error_id == ERR_INVALID_STATE (409); work remains CONFIRMED"
      - name: withdrawn_work_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Work]
        distinguishing_aspect: "A WITHDRAWN work accepts no further transitions: share-claim insert, confirm, and withdraw all fail."
        test_recipe:
          setup: ["work WITHDRAWN by its registering publisher (no performances)" ]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "WD Pub", party_type: PUBLISHER, affiliation_code: "WDP" }
              as: ProRegistrar
              captures: { wd_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "WD Song", registered_by_affiliate_id: "${wd_id}" }
              as: Publisher
              as_user_id: "${wd_id}"
              captures: { wd_work: $.data.id }
            - call: "POST /pro/works/${wd_work}/share-claims"
              payload: { affiliate_id: "${wd_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${wd_id}"
            - call: "POST /pro/works/${wd_work}/withdraw"
              payload: {}
              as: Publisher
              as_user_id: "${wd_id}"
          trigger:
            - call: "POST /pro/works/${wd_work}/confirm"
              payload: {}
              as: ProRegistrar
          assert:
            - "response error_id == ERR_INVALID_STATE (409); WITHDRAWN is terminal"
      - name: license_suspend_requires_delinquent_standing
        claim_type: precondition_enforcement
        grounds: [state_machines.License.ACTIVE_to_SUSPENDED, errors.ERR_INVALID_STATE]
        distinguishing_aspect: "Suspending a license whose licensee is in GOOD standing violates the transition precondition."
        test_recipe:
          setup: ["licensee GOOD with an ACTIVE license"]
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Good Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 10 }
              as: ProLicensingAdmin
              captures: { gd_id: $.data.id, gd_ver: $.data.version }
            - call: "POST /pro/licensees/${gd_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${gd_ver}" }
              as: ProLicensingAdmin
              captures: { gd_lic: $.data.id }
          trigger:
            - call: "POST /pro/licenses/${gd_lic}/suspend"
              payload: {}
              as: ProLicensingAdmin
          assert:
            - "response error_id == ERR_INVALID_STATE (409) — suspend requires DELINQUENT licensee"
      - name: dispute_settle_from_open_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RateDispute]
        distinguishing_aspect: "Settle is only declared from NEGOTIATION; settling an OPEN dispute (no negotiation round yet) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["license with a freshly OPEN dispute"]
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Settle Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 10 }
              as: ProLicensingAdmin
              captures: { se_id: $.data.id, se_ver: $.data.version }
            - call: "POST /pro/licensees/${se_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${se_ver}" }
              as: ProLicensingAdmin
              captures: { se_lic: $.data.id }
            - call: "POST /pro/licenses/${se_lic}/disputes"
              payload: { opened_by_role: LICENSEE, disputed_fee_cents: 80000000 }
              as: Licensee
              as_user_id: "${se_id}"
              captures: { se_disp: $.data.id }
          trigger:
            - call: "POST /pro/disputes/${se_disp}/settle"
              payload: { agreed_fee_cents: 80000000 }
              as: ProLicensingAdmin
          assert:
            - "response error_id == ERR_INVALID_STATE (409); dispute remains OPEN"
      - name: rate_court_decide_from_filed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RateCourtCase]
        distinguishing_aspect: "A case must pass through HEARING; decide directly from FILED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["dispute escalated; case FILED"]
          setup_api_calls:
            - call: "POST /pro/licensees"
              payload: { legal_name: "Court Co", category: VENUE, reported_revenue_cents: 10000000000, usage_units: 10 }
              as: ProLicensingAdmin
              captures: { cc_id: $.data.id, cc_ver: $.data.version }
            - call: "POST /pro/licensees/${cc_id}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${cc_ver}" }
              as: ProLicensingAdmin
              captures: { cc_lic: $.data.id }
            - call: "POST /pro/licenses/${cc_lic}/disputes"
              payload: { opened_by_role: LICENSEE, disputed_fee_cents: 80000000 }
              as: Licensee
              as_user_id: "${cc_id}"
              captures: { cc_disp: $.data.id }
            - call: "POST /pro/disputes/${cc_disp}/escalate"
              payload: {}
              as: Licensee
              as_user_id: "${cc_id}"
              captures: { cc_case: $.data.id }
          trigger:
            - call: "POST /pro/rate-court-cases/${cc_case}/decide"
              payload: { adjudicated_fee_cents: 80000000 }
              as: RateCourtOfficer
          assert:
            - "response error_id == ERR_INVALID_STATE (409); case remains FILED"
      - name: performance_void_after_cycle_calculating_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PerformanceEvent.ACCEPTED_to_VOIDED]
        distinguishing_aspect: "Void is blocked once the owning cycle left COLLECTING; the void attempt on a captured event in a CALCULATING cycle returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["cycle in CALCULATING with one captured ACCEPTED performance"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "VD Pub", party_type: PUBLISHER, affiliation_code: "VDP" }
              as: ProRegistrar
              captures: { vd_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "VD Song", registered_by_affiliate_id: "${vd_id}" }
              as: Publisher
              as_user_id: "${vd_id}"
              captures: { vd_work: $.data.id }
            - call: "POST /pro/works/${vd_work}/share-claims"
              payload: { affiliate_id: "${vd_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${vd_id}"
            - call: "POST /pro/works/${vd_work}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "VD Net", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { vd_le: $.data.id, vd_le_ver: $.data.version }
            - call: "POST /pro/licensees/${vd_le}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${vd_le_ver}" }
              as: ProLicensingAdmin
              captures: { vd_lic: $.data.id }
            - call: "POST /pro/performances"
              payload: { work_id: "${vd_work}", license_id: "${vd_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 10 }
              as: RoyaltyDistributor
              captures: { vd_ev: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "VD1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: RoyaltyDistributor
              captures: { vd_cyc: $.data.id }
            - call: "POST /pro/cycles/${vd_cyc}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${vd_cyc}/performances/capture"
              payload: { performance_event_ids: ["${vd_ev}"] }
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${vd_cyc}"
              payload: {}
              as: RoyaltyDistributor
              captures: { vd_cv: $.data.version }
            - call: "POST /pro/cycles/${vd_cyc}/close-collection"
              payload: { expected_cycle_version: "${vd_cv}" }
              as: RoyaltyDistributor
          trigger:
            - call: "POST /pro/performances/${vd_ev}/void"
              payload: {}
              as: RoyaltyDistributor
          assert:
            - "response error_id == ERR_INVALID_STATE (409); event remains ACCEPTED and captured"
      - name: cycle_distribute_with_draft_statements_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DistributionCycle.CALCULATING_to_DISTRIBUTED, errors.ERR_STATEMENTS_NOT_FINALIZED]
        distinguishing_aspect: "Distribute requires every current-epoch statement FINALIZED; a DRAFT statement blocks with ERR_STATEMENTS_NOT_FINALIZED."
        test_recipe:
          setup: ["cycle CALCULATING with one DRAFT statement"]
          setup_api_calls:
            - call: "POST /pro/affiliates"
              payload: { legal_name: "DF Pub", party_type: PUBLISHER, affiliation_code: "DFP" }
              as: ProRegistrar
              captures: { df_id: $.data.id }
            - call: "POST /pro/works"
              payload: { title: "DF Song", registered_by_affiliate_id: "${df_id}" }
              as: Publisher
              as_user_id: "${df_id}"
              captures: { df_work: $.data.id }
            - call: "POST /pro/works/${df_work}/share-claims"
              payload: { affiliate_id: "${df_id}", role: PUBLISHER, collection_share_bps: 10000, interest_share_bps: 10000 }
              as: Publisher
              as_user_id: "${df_id}"
            - call: "POST /pro/works/${df_work}/confirm"
              payload: {}
              as: ProRegistrar
            - call: "POST /pro/licensees"
              payload: { legal_name: "DF Net", category: BROADCASTER, reported_revenue_cents: 300000000000, usage_units: 0 }
              as: ProLicensingAdmin
              captures: { df_le: $.data.id, df_le_ver: $.data.version }
            - call: "POST /pro/licensees/${df_le}/licenses"
              payload: { effective_date: "2026-01-01", expiry_date: "2026-12-31", expected_licensee_version: "${df_le_ver}" }
              as: ProLicensingAdmin
              captures: { df_lic: $.data.id }
            - call: "POST /pro/performances"
              payload: { work_id: "${df_work}", license_id: "${df_lic}", performance_date: "2026-02-01", medium: TERRESTRIAL_RADIO, daypart: DAY, source: MONITORING, play_count: 10 }
              as: RoyaltyDistributor
              captures: { df_ev: $.data.id }
            - call: "POST /pro/cycles"
              payload: { label: "DF1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: RoyaltyDistributor
              captures: { df_cyc: $.data.id }
            - call: "POST /pro/cycles/${df_cyc}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "POST /pro/cycles/${df_cyc}/performances/capture"
              payload: { performance_event_ids: ["${df_ev}"] }
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${df_cyc}"
              payload: {}
              as: RoyaltyDistributor
              captures: { df_cv: $.data.version }
            - call: "POST /pro/cycles/${df_cyc}/close-collection"
              payload: { expected_cycle_version: "${df_cv}" }
              as: RoyaltyDistributor
          trigger:
            - call: "POST /pro/cycles/${df_cyc}/distribute"
              payload: {}
              as: RoyaltyDistributor
          assert:
            - "response error_id == ERR_STATEMENTS_NOT_FINALIZED (422); cycle remains CALCULATING"
      - name: cycle_close_with_no_performances_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DistributionCycle.COLLECTING_to_CALCULATING, errors.ERR_CYCLE_NO_PERFORMANCES]
        distinguishing_aspect: "Closing collection on a cycle with zero captured ACCEPTED performances returns ERR_CYCLE_NO_PERFORMANCES."
        test_recipe:
          setup: ["cycle opened (COLLECTING), nothing captured"]
          setup_api_calls:
            - call: "POST /pro/cycles"
              payload: { label: "EMPTY1", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: RoyaltyDistributor
              captures: { ec_id: $.data.id }
            - call: "POST /pro/cycles/${ec_id}/open"
              payload: {}
              as: RoyaltyDistributor
            - call: "GET /pro/cycles/${ec_id}"
              payload: {}
              as: RoyaltyDistributor
              captures: { ec_ver: $.data.version }
          trigger:
            - call: "POST /pro/cycles/${ec_id}/close-collection"
              payload: { expected_cycle_version: "${ec_ver}" }
              as: RoyaltyDistributor
          assert:
            - "response error_id == ERR_CYCLE_NO_PERFORMANCES (422)"
      - name: adjustment_approve_twice_rejected
        claim_type: invalid_transition
