      - name: version_increments_exactly_once_per_write_and_never_on_reads
        claim_type: optimistic_concurrency
        grounds:
          - response_envelope
          - entities.Factory.fields.version
          - endpoints[PATCH /modular/factories/{factoryId}/line-state]
        distinguishing_aspect: |
          The version counters that both concurrency rules depend on must move by exactly one per
          write and not at all on reads, including the derived-field-refreshing set-readiness read.
          Two successive PATCHes must land on 2 then 3, never 3 in one hop.
        test_recipe:
          setup: ["clock at 2026-09-01T08:00:00Z; factory PMP1 and project Rainier Flats freshly created"]
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
              payload: { name: "Puget Modular Plant 1", code: "PMP1", takt_minutes: 90, station_count: 6, parallel_station_capacity: 2, wip_unit_value_cents: 8750000 }
              as: ProgramAdmin
              captures: { fac: "$.data.id" }
            - call: "POST /modular/projects"
              payload: { name: "Rainier Flats", factory_id: "${fac}", state_code: "WA", ahj_code: "SEA", planned_module_count: 4, contract_price_cents: 3200000000, forecast_wind_gust_mph: 0, crane_capacity_chart: [{ radius_ft: 90, capacity_lb: 96000 }] }
              as: ProgramAdmin
              captures: { proj: "$.data.id", projv: "$.data.version" }
          trigger:
            - call: "GET /modular/factories/${fac}"
              as: ProgramAdmin
              captures: { v1: "$.data.version" }
            - call: "PATCH /modular/factories/${fac}/line-state"
              payload: { line_state: "PAUSED" }
              as: ProgramAdmin
              captures: { v2: "$.data.version" }
            - call: "PATCH /modular/factories/${fac}/line-state"
              payload: { line_state: "RUNNING" }
              as: ProgramAdmin
              captures: { v3: "$.data.version" }
            - call: "GET /modular/projects/${proj}/set-readiness"
              as: ProgramAdmin
              captures: { pv: "$.data.version" }
            - call: "GET /modular/factories/${fac}"
              as: ProgramAdmin
              captures: { v4: "$.data.version" }
          assert:
            - "${v1} == 1 — the read did not bump the row"
            - "${v2} == 2 and ${v3} == 3 — one increment per PATCH, and updated_at advanced while created_at did not"
            - "${pv} == ${projv} == 1 — set-readiness recomputes derived fields without writing a version"
            - "${v4} == 3 — a final read is still stable"

      - name: cascading_side_effects_across_five_links
        claim_type: cascading_side_effects
        grounds:
