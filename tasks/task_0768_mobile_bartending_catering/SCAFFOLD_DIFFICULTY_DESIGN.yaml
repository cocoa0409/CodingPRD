  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bartender_shift_buffer_overlap
        grounds:
          - validations[priority=8]
          - errors[ERR_BARTENDER_DOUBLE_BOOKED]
          - entities.Assignment.fields.shift_start
        distinguishing_aspect: "Bartender resource, BUFFERED interval semantics: the new shift is dilated by a 90-min travel buffer on both sides, so a second shift starting only 60 min after the first ends is rejected with ERR_BARTENDER_DOUBLE_BOOKED even though the raw intervals do not overlap."
        test_recipe:
          setup:
            - "One bartender assigned to event A 17:00-23:30; a second event B where the same bartender is assigned starting 00:30 (60 min gap < 90-min buffer)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
