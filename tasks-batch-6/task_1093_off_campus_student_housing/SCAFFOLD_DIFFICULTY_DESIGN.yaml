# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Every instance grounds in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assertion below was executed against the declared formulas and
# constants and is written as a literal.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: lease_quoted_whole_month_vs_contracted_daily_proration
        grounds:
          - calculations.lease_term_total_cents
          - entities.Lease.fields.quoted_total_cents
          - entities.Lease.fields.total_contract_cents
          - entities.Lease.fields.term_type
          - entities.Lease.fields.partner_discount_cents
          - state_machines.Lease.PENDING_SIGNATURE_to_ACTIVE
        distinguishing_aspect: |
          This dual variant lives in the Lease money domain: the SAME lease row carries
          quoted_total_cents = 1080000 (whole-month basis, no partner discount) and
          total_contract_cents = 986679 (daily-proration basis with the 500 bps
          ACADEMIC_YEAR partner discount), a 93321-cent divergence from identical inputs.
        test_recipe:
          setup:
            - "Logical clock at its 2026-05-01T00:00:00Z startup default."
            - "PREFERRED university SU (academic year 2026-08-15 to 2027-05-15, verification_required true)."
            - "LISTED property with one 4-bed unit renting at 90000 cents per bed per month."
            - "One VERIFIED student holding a DRAFT lease on bed A for 2026-08-15 to 2027-08-01 (351 days, ACADEMIC_YEAR)."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /students/${s1}/verification-requests"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /students/${s1}/verification-decision"
              payload: { decision: "APPROVE" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
            - call: "POST /leases"
              payload: { student_id: "${s1}", unit_id: "${unit1}", bed_label: "A", term_start_date: "2026-08-15", term_end_date: "2027-08-01", installment_count: 10 }
              as: Student
              as_user_id: "${s1}"
              captures: { l1: $.data.id, l1_quoted: $.data.quoted_total_cents }
            - call: "POST /leases/${l1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s1}"
          trigger:
            - call: "POST /leases/${l1}/sign"
              payload: {}
              as: Student
              as_user_id: "${s1}"
              captures: { l1_total: $.data.total_contract_cents }
          assert:
            - "Lease.${l1}.term_days == 351"
            - "Lease.${l1}.quoted_total_cents == 1080000"
            - "Lease.${l1}.term_type == ACADEMIC_YEAR"
            - "Lease.${l1}.daily_rate_cents == 2959"
            - "Lease.${l1}.partner_discount_bps == 500"
            - "Lease.${l1}.partner_discount_cents == 51930"
            - "Lease.${l1}.total_contract_cents == 986679"
            - "Lease.${l1}.quoted_total_cents - Lease.${l1}.total_contract_cents == 93321"
            - "Lease.${l1}.lease_status == ACTIVE"

      - name: roommate_pairwise_mean_vs_lead_anchored_mean_diverge
        grounds:
          - calculations.roommate_match_score
          - entities.RoommateGroup.fields.average_match_score
          - entities.RoommateGroup.fields.lead_anchored_mean_score
          - entities.GroupMembership.fields.match_score
          - state_machines.RoommateGroup.FORMING_to_LOCKED
        distinguishing_aspect: |
          This dual variant lives in the roommate-compatibility domain (Student /
          RoommateGroup), not the money domain: on the identical four-member ACCEPTED
          set the PAIRWISE_MEAN variant yields average_match_score = 68 while the
          LEAD_ANCHORED variant yields lead_anchored_mean_score = 84, because
          non-lead friction (S2 vs S3 = 35) is invisible to the lead-anchored reading.
        test_recipe:
          setup:
            - "University SU, LISTED property with a 4-bed unit (as in the base fixture)."
            - "Four VERIFIED students: lead S1 (clean 4, noise 3, EARLY, non-smoker), S2 (3, 4, EARLY, non-smoker), S3 (5, 2, LATE, non-smoker), S4 (4, 3, EARLY, non-smoker)."
            - "A FORMING RoommateGroup led by S1 with required_size 4 and all three invitees ACCEPTED."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ben Two", email: "ben@su.edu", credit_score_band: "GOOD", cleanliness_level: 3, noise_tolerance: 4, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s2: $.data.id }
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Cara Three", email: "cara@su.edu", credit_score_band: "GOOD", cleanliness_level: 5, noise_tolerance: 2, sleep_schedule: "LATE", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s3: $.data.id }
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Dan Four", email: "dan@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s4: $.data.id }
            - call: "POST /roommate-groups"
              payload: { property_id: "${prop1}", name: "Maple Four", required_size: 4 }
              as: Student
              as_user_id: "${s1}"
              captures: { g1: $.data.id }
            - call: "POST /roommate-groups/${g1}/invitations"
              payload: { student_id: "${s2}" }
              as: Student
              as_user_id: "${s1}"
              captures: { m2: $.data.id, m2_score: $.data.match_score }
            - call: "POST /roommate-groups/${g1}/invitations"
              payload: { student_id: "${s3}" }
              as: Student
              as_user_id: "${s1}"
              captures: { m3: $.data.id, m3_score: $.data.match_score }
            - call: "POST /roommate-groups/${g1}/invitations"
              payload: { student_id: "${s4}" }
              as: Student
              as_user_id: "${s1}"
              captures: { m4: $.data.id }
            - call: "POST /group-memberships/${m2}/respond"
              payload: { decision: "ACCEPT" }
              as: Student
              as_user_id: "${s2}"
            - call: "POST /group-memberships/${m3}/respond"
              payload: { decision: "ACCEPT" }
              as: Student
              as_user_id: "${s3}"
            - call: "POST /group-memberships/${m4}/respond"
              payload: { decision: "ACCEPT" }
              as: Student
              as_user_id: "${s4}"
          trigger:
            - call: "POST /roommate-groups/${g1}/lock"
              payload: {}
              as: Student
              as_user_id: "${s1}"
              captures: { g1_avg: $.data.average_match_score, g1_lead: $.data.lead_anchored_mean_score }
          assert:
            - "GroupMembership.${m2}.match_score == 80"
            - "GroupMembership.${m3}.match_score == 55"
            - "GroupMembership.${m4}.match_score == 100"
            - "RoommateGroup.${g1}.average_match_score == 68"
            - "RoommateGroup.${g1}.lead_anchored_mean_score == 84"
            - "RoommateGroup.${g1}.average_match_score != RoommateGroup.${g1}.lead_anchored_mean_score"
            - "RoommateGroup.${g1}.status == LOCKED"
            - "RoommateGroup.${g1}.accepted_member_count == 4"

  - rule_id: combinatorial_formula
    instances:
      - name: installment_floor_first_then_residual_to_last_row
        grounds:
          - calculations.installment_schedule_allocation
          - calculations.lease_term_total_cents
          - entities.Installment.fields.amount_cents
          - entities.Installment.fields.sequence_number
          - state_machines.Lease.PENDING_SIGNATURE_to_ACTIVE
        distinguishing_aspect: |
          Mode (b) — nested rounding whose ORDER changes the cents. Splitting
          total_contract_cents 986679 across 10 installments by round_half_up per line
          gives 10 x 98668 = 986680, one cent more than the contract; the scaffold pins
          floor-per-line-then-residual-to-the-LAST-row, producing nine rows of 98667 and
          a final row of 98676 that sums to exactly 986679.
        test_recipe:
          setup:
            - "Base fixture: PREFERRED university SU, LISTED property, 4-bed unit at 90000 cents per bed."
            - "One VERIFIED student whose lease for 2026-08-15 to 2027-08-01 with installment_count 10 has just been signed (total_contract_cents 986679)."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /students/${s1}/verification-requests"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /students/${s1}/verification-decision"
              payload: { decision: "APPROVE" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
            - call: "POST /leases"
              payload: { student_id: "${s1}", unit_id: "${unit1}", bed_label: "A", term_start_date: "2026-08-15", term_end_date: "2027-08-01", installment_count: 10 }
              as: Student
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "POST /leases/${l1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /leases/${l1}/sign"
              payload: {}
              as: Student
              as_user_id: "${s1}"
          trigger:
            - call: "GET /leases/${l1}/installments"
              payload: { kind: "RENT" }
              as: Student
              as_user_id: "${s1}"
              captures: { i1: "$.data[0].id", i1_amt: "$.data[0].amount_cents" }
          assert:
            - "the response contains exactly 10 Installment rows with kind == RENT and total_count == 10"
            - "data[0].sequence_number == 1 and data[0].amount_cents == 98667 and data[0].due_date == 2026-08-15"
            - "data[1].amount_cents == 98667 and data[1].due_date == 2026-09-14"
            - "data[8].amount_cents == 98667 and data[8].due_date == 2027-04-12"
            - "data[9].sequence_number == 10 and data[9].amount_cents == 98676 and data[9].due_date == 2027-05-12"
            - "sum of amount_cents over the 10 rows == 986679 == Lease.${l1}.total_contract_cents"
            - "no row has amount_cents == 98668 (the round-half-up-per-line reading is not used)"
            - "every row has status == SCHEDULED and late_fee_cents == 0 and paid_cents == 0"

      - name: payout_tier_keyed_on_gross_then_rebate_keyed_on_subtotal
        grounds:
          - calculations.payout_settlement
          - entities.Payout.fields.platform_fee_bps
          - entities.Payout.fields.subtotal_cents
          - entities.Payout.fields.rebate_cents
          - entities.Payout.fields.net_amount_cents
          - concurrency_rules[payout-create-stale-property]
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order. The
          fee tier is selected from the PRE-fee gross (197334 -> 900 bps) while the
          loyalty rebate is keyed on the POST-fee subtotal (175627 >= 150000) and is a
          percentage of the fee itself, so net feeds back into nothing: fee 17760,
          holdback 3947, subtotal 175627, rebate 1776, net 177403.
        test_recipe:
          setup:
            - "Base fixture: PREFERRED university SU, LISTED property, 4-bed unit at 90000 cents per bed."
            - "Two VERIFIED students S1 and S2 each holding an ACTIVE 10-installment lease on beds A and B (total_contract_cents 986679, first installment 98667 due 2026-08-15)."
            - "Logical clock at 2026-08-16 and both first installments PAID on that date, so property escrow holds 197334 cents."
          setup_api_calls:
            - call: "POST /universities"
              payload: { name: "State University", code: "SU", partner_tier: "PREFERRED", verification_required: true, academic_year_start_date: "2026-08-15", academic_year_end_date: "2027-05-15", partner_admin_user_id: "uni-admin-su" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { uni_su: $.data.id }
            - call: "POST /properties"
              payload: { university_id: "${uni_su}", name: "Maple Commons", address_line: "12 Maple St", distance_to_campus_m: 800 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { prop1: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop1}", unit_number: "101", floorplan_code: "4x2", bedroom_count: 4, bathroom_count: 2, bed_labels: ["A", "B", "C", "D"], base_rent_cents_per_bed_monthly: 90000 }
              as: PropertyManager
              as_user_id: "mgr-1"
              captures: { unit1: $.data.id }
            - call: "POST /properties/${prop1}/list"
              payload: {}
              as: PropertyManager
              as_user_id: "mgr-1"
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ava Lead", email: "ava@su.edu", credit_score_band: "GOOD", cleanliness_level: 4, noise_tolerance: 3, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s1: $.data.id }
            - call: "POST /students"
              payload: { university_id: "${uni_su}", full_name: "Ben Two", email: "ben@su.edu", credit_score_band: "GOOD", cleanliness_level: 3, noise_tolerance: 4, sleep_schedule: "EARLY", smoker: false }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { s2: $.data.id }
            - call: "POST /students/${s1}/verification-requests"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /students/${s1}/verification-decision"
              payload: { decision: "APPROVE" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
            - call: "POST /students/${s2}/verification-requests"
              payload: {}
              as: Student
              as_user_id: "${s2}"
            - call: "POST /students/${s2}/verification-decision"
              payload: { decision: "APPROVE" }
              as: UniversityPartner
              as_user_id: "uni-admin-su"
            - call: "POST /leases"
              payload: { student_id: "${s1}", unit_id: "${unit1}", bed_label: "A", term_start_date: "2026-08-15", term_end_date: "2027-08-01", installment_count: 10 }
              as: Student
              as_user_id: "${s1}"
              captures: { l1: $.data.id }
            - call: "POST /leases/${l1}/submit"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /leases/${l1}/sign"
              payload: {}
              as: Student
              as_user_id: "${s1}"
            - call: "POST /leases"
              payload: { student_id: "${s2}", unit_id: "${unit1}", bed_label: "B", term_start_date: "2026-08-15", term_end_date: "2027-08-01", installment_count: 10 }
              as: Student
              as_user_id: "${s2}"
              captures: { l2: $.data.id }
            - call: "POST /leases/${l2}/submit"
              payload: {}
              as: Student
              as_user_id: "${s2}"
            - call: "POST /leases/${l2}/sign"
              payload: {}
              as: Student
              as_user_id: "${s2}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "GET /leases/${l1}/installments"
              payload: { kind: "RENT" }
              as: Student
              as_user_id: "${s1}"
              captures: { l1_i1: "$.data[0].id" }
            - call: "GET /leases/${l2}/installments"
              payload: { kind: "RENT" }
              as: Student
              as_user_id: "${s2}"
              captures: { l2_i1: "$.data[0].id" }
            - call: "POST /installments/${l1_i1}/pay"
              payload: { amount_cents: 98667 }
              as: Student
              as_user_id: "${s1}"
            - call: "POST /installments/${l2_i1}/pay"
              payload: { amount_cents: 98667 }
              as: Student
              as_user_id: "${s2}"
            - call: "GET /properties/${prop1}"
