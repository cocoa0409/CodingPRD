  # =======================================================================
  # SECTION: complexity_layers - optimistic concurrency, cascading side effects,
  # dual-variant calculation and rate threshold triggers.
  # =======================================================================
  - section: complexity_layers
    instances:

      - name: a_contribution_record_with_a_stale_expected_employer_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.contribution-record-stale-employer"
          - "errors[ERR_STALE_EMPLOYER_VERSION]"
          - "entities.ContributionRecord.fields.employer_version_at_apply"
        distinguishing_aspect: |
          The Employer row is the concurrency anchor for its whole contribution history,
          and every accepted filing bumps it - so a caller holding a token read before an
          earlier filing must be refused. The stamped employer_version_at_apply records the
          NEW value rather than the token that was presented, which is what makes the
          ledger auditable; a server that stamps the presented value produces two records
          claiming the same version.
        test_recipe:
          setup:
            - "An employer at version 1 with one accepted contribution record for plan year 2021, which advanced it to version 2."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Ironworkers District Pension Fund", industry: "GENERAL", allocation_method: "MODIFIED_PRESUMPTIVE", de_minimis_variant: "STATUTORY", interest_rate_bps: 700, mass_withdrawal_declared: false }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { plan_id: "$.data.id" }
            - call: "POST /controlled-groups"
              payload: { name: "Meridian Holdings Group", common_control_basis: "PARENT_SUBSIDIARY" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { cg_id: "$.data.id" }
            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Meridian Steel Erectors LLC", ein: "410000101", obligation_start_year: 2021, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_id: "$.data.id", emp_v1: "$.data.version" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2021, plan_year_end: 2021, contribution_base_units: 50000, contribution_amount_cents: 50000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { rec1_stamp: "$.data.employer_version_at_apply" }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v2: "$.data.version" }
          trigger:
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2022, plan_year_end: 2022, contribution_base_units: 50000, contribution_amount_cents: 50000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v1}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { err: "$.data.error_id" }
            - call: "POST /contribution-records"
              payload: { employer_id: "${emp_id}", plan_year_start: 2022, plan_year_end: 2022, contribution_base_units: 50000, contribution_amount_cents: 50000000, contribution_rate_cents_per_cbu: 1000, expected_employer_version: "${emp_v2}" }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { rec2_stamp: "$.data.employer_version_at_apply" }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_v3: "$.data.version" }
          assert:
            - "The first record stamped rec1_stamp == 2 and emp_v2 == 2: the accepted write incremented the anchor and recorded the new value."
            - "Replaying the version-1 token: HTTP 412 with data.error_id == \"ERR_STALE_EMPLOYER_VERSION\"."
            - "The rejected write did not consume a version: GET /employers/${emp_id} still reports version == 2 and GET /contribution-records?employer_id=${emp_id} returns total_count == 1."
            - "With the fresh token: HTTP 201 with rec2_stamp == 3 and emp_v3 == 3."
            - "GET /contribution-records?employer_id=${emp_id}&status=CERTIFIED returns total_count == 2."

      - name: regenerating_a_schedule_with_a_stale_expected_assessment_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules.schedule-generation-stale-assessment"
          - "errors[ERR_STALE_ASSESSMENT_VERSION]"
          - "entities.LiabilityAssessment.fields.active_schedule_generation"
        distinguishing_aspect: |
          The review decision that authorises the regeneration is itself a write on the
          assessment, so a token read at issuance is guaranteed to be stale by the time the
          regeneration is legal. That makes this the one OCC rule an implementation cannot
          satisfy by accident, and it is the guard that stops two actuaries from minting
          generation 2 twice off the same conceded amount. The retry then proves the full
          regeneration arithmetic: a 150000000 net with nothing paid amortizes in four
          years at 9375000 a quarter.
        test_recipe:
          setup:
            - "The baseline assessment issued at 2026-08-01 (net 250000000, annual payment 50000000, generation 1 with 28 installments). The employer challenges the interest rate and the trustee REDUCES the assessment to 150000000, which advances the assessment's version past the token captured at issuance."
          setup_api_calls:
            - call: "POST /plans"
