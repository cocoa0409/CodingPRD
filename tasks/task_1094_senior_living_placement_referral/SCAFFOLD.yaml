scenario: "Senior-Living Placement & Referral (A Place for Mom style): family inquiry & needs/budget assessment, community match & tour scheduling, care-level & availability, community-paid referral-fee & move-in confirmation, follow-up & satisfaction, advisor & caseload, financial/VA-benefit guidance, reporting"
domain_name: "senior-living-placement-referral"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; every write endpoint takes its
  # parent ids in the request body, and no URL nests deeper than
  # /<collection>/{id}/<action>. Children are discovered through filtered list
  # endpoints, never through nested collection paths.

  state_machine_shape: cyclic
  # Primary shape is cyclic: NeedsAssessment loops DRAFT -> SUBMITTED ->
  # REVISION_REQUESTED -> DRAFT, ReferralInvoice loops ISSUED -> DISPUTED ->
  # ISSUED, Match loops SHORTLISTED -> TOUR_SCHEDULED -> SHORTLISTED. Placement
  # additionally carries two parallel state axes (residency_status x
  # billing_status) that advance independently on the same row.

  relationship_patterns:
    - one_to_many
    - many_to_many        # Match is the junction entity between Inquiry and Community
    - cross_aggregate     # FeeLedgerEntry reconciles across Placement / ReferralInvoice / Community

  role_model: segregation_of_duties
  # The advisor who authors a NeedsAssessment may not approve it; the VA benefits
  # counselor may not be the advisor assigned to the inquiry; the BillingSpecialist
  # who issues a referral invoice is disjoint from the CommunityManager who accepts,
  # disputes, or pays it.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - name: primary_contact_name
        type: string
        source: input
        description: Name of the family member driving the search.
      - name: email
        type: string
        source: input
        description: Contact email; unique across families.
        constraints: "unique; must contain '@'"
      - name: phone
        type: string
        source: input
        description: Contact phone number.
      - name: relationship_to_senior
        type: enum
        source: input
        description: Relationship of the contact to the prospective resident.
        constraints: "one of SELF, SPOUSE, ADULT_CHILD, OTHER_RELATIVE, FRIEND"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the family.
      - name: senior_first_name
        type: string
        source: input
        description: First name of the prospective resident.
      - name: senior_age
        type: integer
        source: input
        description: Age of the prospective resident.
        constraints: ">= 55 and <= 120"

  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Advisor display name.
      - name: email
        type: string
        source: input
        description: Advisor email; unique across advisors.
        constraints: "unique"
      - name: region_code
        type: string
        source: input
        description: Market the advisor serves; must equal Inquiry.region_code to be assignable.
      - name: is_va_certified
        type: boolean
        source: input
        description: Whether this advisor may act under the BenefitsCounselor role.
        default: false
      - name: caseload_capacity
        type: integer
        source: input
        description: Maximum number of CaseloadAssignment rows this advisor may hold in status ACTIVE at once.
        constraints: ">= 1 and <= 25"
      - name: status
        type: enum
        source: system
        description: Availability of the advisor for new assignments.
        default: ACTIVE
        constraints: "one of ACTIVE, PAUSED, INACTIVE"
      - name: active_caseload_count
        type: integer
        source: computed
        description: Count of CaseloadAssignment rows with advisor_id == this advisor and status == ACTIVE.
        default: 0
      - name: headcount_load_index
        type: number
        source: computed
        description: Headcount variant of calculations.advisor_load_index (4 decimals).
        default: 0
      - name: weighted_load_index
        type: number
        source: computed
        description: Acuity-weighted variant of calculations.advisor_load_index (4 decimals).
        default: 0

  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Community trade name.
      - name: region_code
        type: string
        source: input
        description: Market the community sits in.
      - name: contract_tier
        type: enum
        source: input
        description: Referral contract tier; drives TIER_MULTIPLIER in calculations.referral_fee.
        constraints: "one of STANDARD, PREFERRED, PREMIER"
      - name: referral_fee_pct
        type: number
        source: input
        description: Contracted share of one month's rent paid as a referral fee.
        constraints: "> 0 and <= 1.00"
      - name: tour_slot_capacity
        type: integer
        source: input
        description: Maximum number of Tour rows with status SCHEDULED whose closed interval intersects a candidate interval.
        constraints: ">= 1 and <= 20"
      - name: quality_rating
        type: number
        source: input
        description: Editorial quality rating used by calculations.match_fit_score.
        constraints: ">= 0.0 and <= 5.0"
      - name: status
        type: enum
        source: system
        description: Contract standing of the community.
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, TERMINATED"
      - name: fee_balance_cents
        type: integer
        source: computed
        description: Signed sum of FeeLedgerEntry.amount_cents over every entry with community_id == this community.
        default: 0
      - name: satisfaction_survey_count
        type: integer
        source: computed
        description: Count of SatisfactionSurvey rows with community_id == this community.
        default: 0
      - name: avg_satisfaction_score
        type: number
        source: computed
        description: Mean of SatisfactionSurvey.composite_score over this community's surveys, round_half_up to 2 decimals; 0 when count is 0.
        default: 0

  - name: CommunityInventory
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; the community that owns this unit pool."
      - name: care_level
        type: enum
        source: input
        description: Care level this unit pool serves.
        constraints: "one of INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING; at most one row per (community_id, care_level)"
      - name: total_units
        type: integer
        source: input
        description: Physical unit count in this pool.
        constraints: ">= 0"
      - name: reserved_units
        type: integer
        source: computed
        description: Count of Placement rows on this inventory with residency_status == PENDING_MOVE_IN.
        default: 0
      - name: occupied_units
        type: integer
        source: computed
        description: Count of Placement rows on this inventory with residency_status in {MOVED_IN, RESIDENT_CONFIRMED}.
        default: 0
      - name: available_units
        type: integer
        source: computed
        description: total_units - reserved_units - occupied_units; never negative.
        default: 0
      - name: monthly_rate_cents
        type: integer
        source: input
        description: Published monthly rate; snapshotted onto Match.quoted_monthly_rate_cents at match creation.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: Whether the pool accepts new matches and placements.
        default: OPEN
        constraints: "one of OPEN, CLOSED"

  - name: Inquiry
    parent: null
    common_fields: true
    fields:
      - name: family_id
        type: string
        source: input
        description: "FK -> Family.id; the household that opened the inquiry."
      - name: assigned_advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; null until POST /inquiries/{inquiry_id}/assign succeeds."
        default: null
      - name: origin
        type: enum
        source: input
        description: Acquisition channel.
        constraints: "one of WEB, PHONE, PARTNER_REFERRAL"
      - name: region_code
        type: string
        source: input
        description: Market the family is searching in; must equal Advisor.region_code for assignment.
      - name: requested_care_level
        type: enum
        source: input
        description: Care level the family asked for at intake.
        constraints: "one of INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING"
      - name: target_move_in_date
        type: string
        source: input
        description: Desired move-in date, ISO 8601 calendar date (YYYY-MM-DD).
        constraints: ">= the logical clock's current UTC calendar date"
      - name: declared_budget_monthly_cents
        type: integer
        source: input
        description: Budget the family states at intake; input to calculations.inquiry_priority_score.
        constraints: "> 0"
      - name: priority_score
        type: number
        source: computed
        description: Output of calculations.inquiry_priority_score; frozen at creation and never recomputed.
      - name: status
        type: enum
        source: system
        description: Inquiry lifecycle state.
        default: NEW
        constraints: "one of NEW, ASSIGNED, ASSESSED, MATCHING, TOURING, PLACED, ON_HOLD, CLOSED_LOST"
      - name: match_count
        type: integer
        source: computed
        description: Count of Match rows with inquiry_id == this inquiry and status not in {DECLINED, WITHDRAWN}.
        default: 0
      - name: hold_reason
        type: string
        source: system
        description: Reason captured by POST /inquiries/{inquiry_id}/hold.
        default: null
      - name: close_reason_code
        type: string
        source: system
        description: Reason captured by POST /inquiries/{inquiry_id}/close.
        default: null
      - name: notes
        type: string
        source: input
        description: Free-text intake notes.
        default: null

  - name: NeedsAssessment
    parent: null
    common_fields: true
    fields:
      - name: inquiry_id
        type: string
        source: input
        description: "FK -> Inquiry.id; at most one NeedsAssessment per inquiry."
      - name: author_advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; taken from X-User-ID of the creating Advisor."
      - name: adl_score
        type: integer
        source: input
        description: Activities-of-daily-living acuity, 0 (independent) to 10 (total assist).
        constraints: ">= 0 and <= 10"
      - name: cognitive_score
        type: integer
        source: input
        description: Cognitive impairment acuity, 0 to 10.
        constraints: ">= 0 and <= 10"
      - name: mobility_score
        type: integer
        source: input
        description: Mobility impairment acuity, 0 to 10.
        constraints: ">= 0 and <= 10"
      - name: budget_monthly_cents
        type: integer
        source: input
        description: Assessed sustainable monthly budget.
        constraints: "> 0"
      - name: gross_monthly_income_cents
        type: integer
        source: input
        description: Household gross monthly income; input to calculations.va_benefit_estimate.
        constraints: ">= 0"
      - name: va_eligible
        type: boolean
        source: input
        description: Whether the household claims VA eligibility; gates POST /benefit-guidances.
      - name: marital_status
        type: enum
        source: input
        description: Marital status; selects the VA_MAX_MONTHLY_CENTS key.
        constraints: "one of SINGLE, MARRIED, WIDOWED"
      - name: recommended_care_level
        type: enum
        source: computed
        description: Output of calculations.recommended_care_level; recomputed on every DRAFT mutation.
        constraints: "one of INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING"
      - name: benefit_offset_cents
        type: integer
        source: computed
        description: estimated_monthly_benefit_cents of this assessment's BenefitGuidance with status ISSUED, else 0.
        default: 0
      - name: affordability_ceiling_cents
        type: integer
        source: computed
        description: Output of calculations.affordability_ceiling; set on APPROVE and recomputed whenever benefit_offset_cents changes.
        default: 0
      - name: status
        type: enum
        source: system
        description: Assessment review state.
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED"
      - name: revision_note
        type: string
        source: system
        description: Note supplied with a REQUEST_REVISION decision.
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of times this assessment entered REVISION_REQUESTED.
        default: 0

  - name: Match
    parent: null
    common_fields: true
    fields:
      - name: inquiry_id
        type: string
        source: input
        description: "FK -> Inquiry.id; the inquiry being matched."
      - name: community_id
        type: string
        source: input
        description: "FK -> Community.id; the community being proposed."
      - name: care_level
        type: enum
        source: input
        description: Care level proposed; must resolve to an OPEN CommunityInventory for community_id.
        constraints: "one of INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING"
      - name: quoted_monthly_rate_cents
        type: integer
        source: computed
        description: Snapshot of the resolved CommunityInventory.monthly_rate_cents at match creation; never re-snapshotted.
      - name: fit_score
        type: number
        source: computed
        description: Output of calculations.match_fit_score, 2 decimals; recomputed when the inquiry's NeedsAssessment.affordability_ceiling_cents changes.
      - name: status
        type: enum
        source: system
        description: Match lifecycle state.
        default: PROPOSED
        constraints: "one of PROPOSED, SHORTLISTED, TOUR_SCHEDULED, TOURED, SELECTED, DECLINED, WITHDRAWN"
      - name: decline_reason_code
        type: string
        source: system
        description: Reason code recorded by POST /matches/{match_id}/decline.
        default: null
      - name: tour_round
        type: integer
        source: computed
        description: Number of completed SHORTLISTED -> TOUR_SCHEDULED transitions on this match.
        default: 0

  - name: Tour
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; the match this tour exercises."
      - name: advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; copied from the match's Inquiry.assigned_advisor_id."
      - name: community_id
        type: string
        source: system
        description: "FK -> Community.id; copied from Match.community_id."
      - name: scheduled_start
        type: datetime
        source: input
        description: Tour start instant, ISO 8601 UTC.
      - name: scheduled_end
        type: datetime
        source: input
        description: Tour end instant, ISO 8601 UTC; must be after scheduled_start.
      - name: mode
        type: enum
        source: input
        description: IN_PERSON tours carry TRAVEL_BUFFER_MINUTES on the advisor axis; VIRTUAL tours carry zero buffer.
        constraints: "one of IN_PERSON, VIRTUAL"
      - name: status
        type: enum
        source: system
        description: Tour lifecycle state.
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED, NO_SHOW"
      - name: outcome_rating
        type: integer
        source: system
        description: Family reaction captured at completion, 1 to 5.
        default: null
      - name: cancel_reason_code
        type: string
        source: system
        description: Reason code recorded on cancellation, including cascaded cancellations.
        default: null

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - name: match_id
        type: string
        source: input
        description: "FK -> Match.id; the SELECTED match this placement realizes."
      - name: inquiry_id
        type: string
        source: system
        description: "FK -> Inquiry.id; copied from Match.inquiry_id."
      - name: community_id
        type: string
        source: system
        description: "FK -> Community.id; copied from Match.community_id."
      - name: inventory_id
        type: string
        source: input
        description: "FK -> CommunityInventory.id; the unit pool the reservation draws from."
      - name: care_level
        type: enum
        source: system
        description: Copied from Match.care_level at creation.
        constraints: "one of INDEPENDENT_LIVING, ASSISTED_LIVING, MEMORY_CARE, SKILLED_NURSING"
      - name: agreed_move_in_date
        type: string
        source: input
        description: Contracted move-in calendar date (YYYY-MM-DD).
      - name: actual_move_in_date
        type: string
        source: system
        description: Calendar date reported by the community at move-in confirmation.
        default: null
      - name: actual_care_level
        type: enum
        source: system
        description: Care level actually contracted at move-in; may differ from care_level.
        default: null
      - name: contracted_monthly_rate_cents
        type: integer
        source: input
        description: Negotiated monthly rate on the residency agreement.
        constraints: "> 0"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: Output of the `estimated` variant of calculations.referral_fee, set at creation.
      - name: final_fee_cents
        type: integer
        source: computed
        description: Output of the `final` variant of calculations.referral_fee, set at move-in confirmation.
        default: null
      - name: clawback_amount_cents
        type: integer
        source: computed
        description: Output of calculations.clawback_amount, set at move-out.
        default: 0
      - name: residency_status
        type: enum
        source: system
        description: Residency axis of the parallel state machine.
        default: PENDING_MOVE_IN
        constraints: "one of PENDING_MOVE_IN, MOVED_IN, RESIDENT_CONFIRMED, MOVED_OUT, CANCELLED"
      - name: billing_status
        type: enum
        source: system
        description: Billing axis of the parallel state machine; advances independently of residency_status.
        default: NOT_INVOICED
        constraints: "one of NOT_INVOICED, INVOICE_DRAFTED, INVOICED, PAID, CLAWED_BACK, VOIDED"
      - name: move_out_date
        type: string
        source: system
        description: Calendar date of move-out (YYYY-MM-DD).
        default: null
      - name: days_resided
        type: integer
        source: computed
        description: Whole days from actual_move_in_date to move_out_date; null until move-out.
        default: null

  - name: ReferralInvoice
    parent: null
    common_fields: true
    fields:
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; created by the move-in confirmation cascade, never by a public POST."
      - name: community_id
        type: string
        source: system
        description: "FK -> Community.id; copied from Placement.community_id."
      - name: final_fee_cents
        type: integer
        source: computed
        description: Amount billed to the community; seeded from Placement.final_fee_cents and replaced on adjustment.
      - name: paid_amount_cents
        type: integer
        source: computed
        description: Cash received from the community.
        default: 0
      - name: net_recognized_fee_cents
        type: integer
        source: computed
        description: Sum of FeeLedgerEntry.amount_cents over entries with invoice_id == this invoice and entry_type in {ACCRUAL, ADJUSTMENT, CLAWBACK, WRITE_OFF}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Invoice lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, DISPUTED, ACCEPTED, PAID, VOIDED, CLAWED_BACK"
      - name: dispute_reason
        type: string
        source: system
        description: Reason supplied by the community on dispute.
        default: null
      - name: claimed_rate_cents
        type: integer
        source: system
        description: Monthly rate the community claims is correct, supplied on dispute.
        default: null
      - name: adjustment_count
        type: integer
        source: computed
        description: Number of completed DISPUTED -> ISSUED adjustments; gates ERR_DISPUTE_LIMIT_EXCEEDED.
        default: 0
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent DRAFT/DISPUTED -> ISSUED transition.
        default: null

  - name: FeeLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: "FK -> ReferralInvoice.id; the invoice this entry books against."
      - name: placement_id
        type: string
        source: system
        description: "FK -> Placement.id; denormalized for placement-level reconciliation."
      - name: community_id
        type: string
        source: system
        description: "FK -> Community.id; the community whose fee_balance_cents this entry moves."
      - name: entry_type
        type: enum
        source: system
        description: Kind of ledger movement.
        constraints: "one of ACCRUAL, ADJUSTMENT, PAYMENT, CLAWBACK, WRITE_OFF"
      - name: amount_cents
        type: integer
        source: system
        description: Signed movement of the community's payable balance; positive increases what the community owes.
      - name: balance_after_cents
        type: integer
        source: computed
        description: Community fee_balance_cents immediately after applying this entry.
      - name: reason
        type: string
        source: system
        description: Human-readable cause of the entry.

  - name: BenefitGuidance
    parent: null
    common_fields: true
    fields:
      - name: inquiry_id
        type: string
        source: input
        description: "FK -> Inquiry.id; the inquiry receiving financial guidance."
      - name: assessment_id
        type: string
        source: system
        description: "FK -> NeedsAssessment.id; resolved from inquiry_id at creation."
      - name: counselor_advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; taken from X-User-ID of the acting BenefitsCounselor."
      - name: benefit_type
        type: enum
        source: input
        description: Funding instrument being estimated.
        constraints: "one of VA_AID_ATTENDANCE, VA_SURVIVOR_PENSION, LTC_INSURANCE, BRIDGE_LOAN"
      - name: unreimbursed_medical_cents
        type: integer
        source: computed
        description: Step 1 of calculations.va_benefit_estimate.
      - name: countable_income_cents
        type: integer
        source: computed
        description: Step 2 of calculations.va_benefit_estimate.
      - name: estimated_monthly_benefit_cents
        type: integer
        source: computed
        description: Step 3 of calculations.va_benefit_estimate; feeds NeedsAssessment.benefit_offset_cents.
      - name: status
        type: enum
        source: system
        description: Whether this guidance is the live one for its assessment.
        default: ISSUED
        constraints: "one of ISSUED, SUPERSEDED"

  - name: SatisfactionSurvey
    parent: null
    common_fields: false
    fields:
      - name: placement_id
        type: string
        source: input
        description: "FK -> Placement.id; the placement being rated."
      - name: respondent_family_id
        type: string
        source: system
        description: "FK -> Family.id; copied from the placement's Inquiry.family_id."
      - name: community_id
        type: string
        source: system
        description: "FK -> Community.id; copied from Placement.community_id."
      - name: days_after_move_in
        type: integer
        source: computed
        description: Whole days from Placement.actual_move_in_date to the logical clock's current UTC date.
      - name: nps_score
        type: integer
        source: input
        description: Net-promoter answer, 0 to 10.
        constraints: ">= 0 and <= 10"
      - name: care_rating
        type: integer
        source: input
        description: Care quality rating, 1 to 5.
        constraints: ">= 1 and <= 5"
      - name: value_rating
        type: integer
        source: input
        description: Value-for-money rating, 1 to 5.
        constraints: ">= 1 and <= 5"
      - name: composite_score
        type: number
        source: computed
        description: Output of calculations.satisfaction_composite_score, 2 decimals.

  - name: CaseloadAssignment
    parent: null
    common_fields: true
    fields:
      - name: advisor_id
        type: string
        source: system
        description: "FK -> Advisor.id; the advisor carrying the case."
      - name: inquiry_id
        type: string
        source: system
        description: "FK -> Inquiry.id; the case being carried."
      - name: assigned_at
        type: datetime
        source: system
        description: Logical-clock instant the assignment opened.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant the assignment left ACTIVE.
        default: null
      - name: release_reason
        type: enum
        source: system
        description: Why the assignment left ACTIVE.
        default: null
        constraints: "one of PLACED, CLOSED_LOST, REASSIGNED"
      - name: status
        type: enum
        source: system
        description: Assignment state.
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED, REASSIGNED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Inquiry
    initial_state: NEW
    terminal_states: [PLACED, CLOSED_LOST]
    transitions:
      - from: NEW
        to: ASSIGNED
        trigger: "POST /inquiries/{inquiry_id}/assign"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status == NEW"
          - "resolved advisor.status == ACTIVE"
          - "resolved advisor.region_code == inquiry.region_code"
          - "resolved advisor.active_caseload_count < resolved advisor.caseload_capacity"
        side_effects:
          - "sets Inquiry.assigned_advisor_id to the resolved advisor id"
          - "creates a CaseloadAssignment with status ACTIVE and assigned_at = logical clock"
          - "increments Advisor.active_caseload_count by 1"
          - "recomputes Advisor.headcount_load_index and Advisor.weighted_load_index per calculations.advisor_load_index"
          - "increments Advisor.version by 1"
        note: "When advisor_id is omitted the server applies the selector policy pinned in calculations.advisor_auto_selection."

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /inquiries/{inquiry_id}/reassign"
        actor: PlatformAdmin
        preconditions:
          - "inquiry.status in {ASSIGNED, ASSESSED, MATCHING, TOURING, ON_HOLD}"
          - "to_advisor_id != inquiry.assigned_advisor_id"
          - "target advisor.status == ACTIVE and target advisor.region_code == inquiry.region_code"
          - "target advisor.active_caseload_count < target advisor.caseload_capacity"
        side_effects:
          - "the inquiry's CaseloadAssignment with status ACTIVE moves to REASSIGNED with release_reason REASSIGNED and released_at = logical clock"
          - "decrements the previous Advisor.active_caseload_count by 1 and recomputes both of its load indices"
          - "creates a new CaseloadAssignment with status ACTIVE for the target advisor"
          - "increments the target Advisor.active_caseload_count by 1 and recomputes both of its load indices"
          - "sets Inquiry.assigned_advisor_id to to_advisor_id"
        note: "Inquiry.status is unchanged by reassignment; the transition is a self-loop on whichever of the five listed states the inquiry currently holds."

      - from: ASSIGNED
        to: ASSESSED
        trigger: "POST /assessments/{assessment_id}/review with decision APPROVE"
        actor: system
        preconditions:
          - "the approved NeedsAssessment.inquiry_id == this inquiry"
          - "inquiry.status == ASSIGNED"
        side_effects:
          - "increments Inquiry.version by 1"

      - from: ASSESSED
        to: MATCHING
        trigger: "POST /matches (first Match created for this inquiry)"
        actor: system
        preconditions:
          - "inquiry.status == ASSESSED"
        side_effects:
          - "increments Inquiry.match_count by 1"
          - "increments Inquiry.version by 1"
        note: "Subsequent matches keep the inquiry in MATCHING and still increment match_count."

      - from: MATCHING
        to: TOURING
        trigger: "POST /tours (first Tour scheduled on any Match of this inquiry)"
        actor: system
        preconditions:
          - "inquiry.status == MATCHING"
        side_effects:
          - "increments Inquiry.version by 1"

      - from: MATCHING
        to: ON_HOLD
        trigger: "POST /inquiries/{inquiry_id}/hold"
        actor: Advisor
        preconditions:
          - "inquiry.status == MATCHING"
        side_effects:
          - "sets Inquiry.hold_reason"

      - from: TOURING
        to: ON_HOLD
        trigger: "POST /inquiries/{inquiry_id}/hold"
        actor: Advisor
        preconditions:
          - "inquiry.status == TOURING"
        side_effects:
          - "sets Inquiry.hold_reason"
          - "every Tour of this inquiry with status SCHEDULED moves to CANCELLED with cancel_reason_code INQUIRY_ON_HOLD, and each such tour's Match moves TOUR_SCHEDULED -> SHORTLISTED"

      - from: ON_HOLD
        to: MATCHING
        trigger: "POST /inquiries/{inquiry_id}/resume"
        actor: Advisor
        preconditions:
          - "inquiry.status == ON_HOLD"
        side_effects:
          - "clears Inquiry.hold_reason"
        note: "Cycle: MATCHING -> ON_HOLD -> MATCHING and TOURING -> ON_HOLD -> MATCHING. Resume always lands on MATCHING regardless of which state the hold came from."

      - from: TOURING
        to: PLACED
        trigger: "POST /placements/{placement_id}/confirm-move-in (cascade level 2)"
        actor: system
        preconditions:
          - "inquiry.status == TOURING"
          - "the confirming Placement.inquiry_id == this inquiry"
        side_effects:
          - "CASCADE L3 (caused by this transition): every Match of this inquiry whose status is in {PROPOSED, SHORTLISTED, TOUR_SCHEDULED, TOURED} moves to WITHDRAWN"
          - "CASCADE L3 (caused by this transition): the inquiry's CaseloadAssignment with status ACTIVE moves to RELEASED with release_reason PLACED and released_at = logical clock; the owning Advisor.active_caseload_count is decremented by 1 and both load indices are recomputed"
          - "CASCADE L4 (caused by the L3 WITHDRAWN matches): every Tour with status SCHEDULED whose match_id is one of those withdrawn matches moves to CANCELLED with cancel_reason_code MATCH_WITHDRAWN, releasing its community tour slot"

      - from: MATCHING
        to: CLOSED_LOST
        trigger: "POST /inquiries/{inquiry_id}/close"
        actor: Advisor
        preconditions:
          - "inquiry.status in {ASSIGNED, ASSESSED, MATCHING, TOURING, ON_HOLD}"
          - "no Placement of this inquiry has residency_status in {PENDING_MOVE_IN, MOVED_IN, RESIDENT_CONFIRMED}"
        side_effects:
          - "sets Inquiry.close_reason_code"
          - "every Match of this inquiry whose status is in {PROPOSED, SHORTLISTED, TOUR_SCHEDULED, TOURED} moves to WITHDRAWN"
          - "every Tour with status SCHEDULED on those withdrawn matches moves to CANCELLED with cancel_reason_code MATCH_WITHDRAWN"
          - "the inquiry's CaseloadAssignment with status ACTIVE moves to RELEASED with release_reason CLOSED_LOST; the owning Advisor.active_caseload_count is decremented by 1 and both load indices are recomputed"
        note: "The from-set is exactly {ASSIGNED, ASSESSED, MATCHING, TOURING, ON_HOLD}; the row is keyed on MATCHING for reference purposes."

  - entity: NeedsAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /assessments/{assessment_id}"
        actor: Advisor
        preconditions:
          - "assessment.status == DRAFT"
          - "X-User-ID == assessment.author_advisor_id"
        side_effects:
          - "recomputes NeedsAssessment.recommended_care_level per calculations.recommended_care_level"

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /assessments/{assessment_id}/submit"
        actor: Advisor
        preconditions:
          - "assessment.status == DRAFT"
          - "X-User-ID == assessment.author_advisor_id"
        side_effects:
          - "recomputes NeedsAssessment.recommended_care_level"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /assessments/{assessment_id}/review with decision APPROVE"
        actor: Advisor
        preconditions:
          - "assessment.status == SUBMITTED"
          - "when the actor role is Advisor, X-User-ID != assessment.author_advisor_id (segregation of duties)"
        side_effects:
          - "sets NeedsAssessment.affordability_ceiling_cents per calculations.affordability_ceiling"
          - "the linked Inquiry moves ASSIGNED -> ASSESSED"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /assessments/{assessment_id}/review with decision REQUEST_REVISION"
        actor: Advisor
        preconditions:
          - "assessment.status == SUBMITTED"
          - "when the actor role is Advisor, X-User-ID != assessment.author_advisor_id (segregation of duties)"
        side_effects:
          - "sets NeedsAssessment.revision_note"
          - "increments NeedsAssessment.revision_count by 1"

      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "PATCH /assessments/{assessment_id}"
        actor: Advisor
        preconditions:
          - "assessment.status == REVISION_REQUESTED"
          - "X-User-ID == assessment.author_advisor_id"
        side_effects:
          - "clears NeedsAssessment.revision_note"
          - "recomputes NeedsAssessment.recommended_care_level"
        note: "Closes the revision cycle DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT."

  - entity: Match
    initial_state: PROPOSED
    terminal_states: [DECLINED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: SHORTLISTED
        trigger: "POST /matches/{match_id}/shortlist"
        actor: Advisor
        preconditions:
          - "match.status == PROPOSED"
        side_effects: []

      - from: SHORTLISTED
        to: TOUR_SCHEDULED
        trigger: "POST /tours"
        actor: Advisor
        preconditions:
          - "match.status == SHORTLISTED"
          - "match's Community.status == ACTIVE"
        side_effects:
          - "increments Match.tour_round by 1"
          - "the linked Inquiry moves MATCHING -> TOURING on the first tour"

      - from: TOUR_SCHEDULED
        to: TOURED
        trigger: "POST /tours/{tour_id}/complete"
        actor: Advisor
        preconditions:
          - "match.status == TOUR_SCHEDULED"
        side_effects: []

      - from: TOUR_SCHEDULED
        to: SHORTLISTED
        trigger: "POST /tours/{tour_id}/cancel or POST /tours/{tour_id}/no-show"
        actor: system
        preconditions:
          - "match.status == TOUR_SCHEDULED"
        side_effects: []
        note: "Cycle: SHORTLISTED -> TOUR_SCHEDULED -> SHORTLISTED; Match.tour_round records how many times the loop ran."

      - from: TOURED
        to: SHORTLISTED
        trigger: "POST /matches/{match_id}/shortlist"
        actor: Advisor
        preconditions:
          - "match.status == TOURED"
        side_effects: []
        note: "Second cycle edge: a family that wants a repeat visit returns the match to SHORTLISTED so a new tour can be booked."

      - from: TOURED
        to: SELECTED
        trigger: "POST /matches/{match_id}/select"
        actor: Advisor
        preconditions:
          - "match.status == TOURED"
          - "the match's Community.status == ACTIVE"
        side_effects: []

      - from: SHORTLISTED
        to: DECLINED
        trigger: "POST /matches/{match_id}/decline"
        actor: Advisor
        preconditions:
          - "match.status in {PROPOSED, SHORTLISTED, TOURED}"
        side_effects:
          - "sets Match.decline_reason_code"
          - "decrements Inquiry.match_count by 1"
        note: "The from-set is exactly {PROPOSED, SHORTLISTED, TOURED}; the row is keyed on SHORTLISTED for reference purposes."

      - from: SHORTLISTED
        to: WITHDRAWN
        trigger: "cascade from Inquiry -> PLACED or Inquiry -> CLOSED_LOST"
        actor: system
        preconditions:
          - "match.status in {PROPOSED, SHORTLISTED, TOUR_SCHEDULED, TOURED}"
        side_effects:
          - "decrements Inquiry.match_count by 1"
          - "every Tour with status SCHEDULED on this match moves to CANCELLED with cancel_reason_code MATCH_WITHDRAWN"

  - entity: Tour
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /tours/{tour_id}/complete"
        actor: Advisor
        preconditions:
          - "tour.status == SCHEDULED"
          - "X-User-ID == tour.advisor_id"
        side_effects:
          - "sets Tour.outcome_rating"
          - "the linked Match moves TOUR_SCHEDULED -> TOURED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tours/{tour_id}/cancel"
        actor: Advisor
        preconditions:
          - "tour.status == SCHEDULED"
        side_effects:
          - "sets Tour.cancel_reason_code"
          - "the linked Match moves TOUR_SCHEDULED -> SHORTLISTED"
          - "the community tour slot occupied by this tour is released for overlap accounting"

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /tours/{tour_id}/no-show"
        actor: Advisor
        preconditions:
          - "tour.status == SCHEDULED"
          - "X-User-ID == tour.advisor_id"
        side_effects:
          - "the linked Match moves TOUR_SCHEDULED -> SHORTLISTED"
          - "the community tour slot occupied by this tour is released for overlap accounting"

  - entity: Placement
    initial_state: PENDING_MOVE_IN
    terminal_states: [MOVED_OUT, CANCELLED]
    transitions:
      - from: PENDING_MOVE_IN
        to: MOVED_IN
        trigger: "POST /placements/{placement_id}/confirm-move-in"
        actor: CommunityManager
        preconditions:
          - "placement.residency_status == PENDING_MOVE_IN"
          - "X-User-ID == placement.community_id"
          - "actual_move_in_date <= the logical clock's current UTC calendar date"
        side_effects:
          - "CASCADE L1: sets actual_move_in_date and actual_care_level; computes Placement.final_fee_cents per the `final` variant of calculations.referral_fee"
          - "CASCADE L1: the linked CommunityInventory decrements reserved_units by 1, increments occupied_units by 1, recomputes available_units, and increments its version by 1"
          - "CASCADE L1: creates a ReferralInvoice with status DRAFT and final_fee_cents = Placement.final_fee_cents; Placement.billing_status moves NOT_INVOICED -> INVOICE_DRAFTED"
          - "CASCADE L2 (caused by L1): the linked Inquiry moves TOURING -> PLACED"
          - "CASCADE L3 (caused by L2): sibling Matches move to WITHDRAWN and the ACTIVE CaseloadAssignment moves to RELEASED"
          - "CASCADE L4 (caused by L3): SCHEDULED Tours on those withdrawn Matches move to CANCELLED"

      - from: MOVED_IN
        to: RESIDENT_CONFIRMED
        trigger: "POST /placements/{placement_id}/confirm-residency"
        actor: Advisor
        preconditions:
          - "placement.residency_status == MOVED_IN"
          - "the logical clock's current UTC calendar date >= actual_move_in_date + RESIDENCY_CONFIRM_DAYS"
        side_effects: []
        note: "Independent of billing_status: the placement may be in any of NOT_INVOICED, INVOICE_DRAFTED, INVOICED or PAID when this fires."

      - from: MOVED_IN
        to: MOVED_OUT
        trigger: "POST /placements/{placement_id}/move-out"
        actor: CommunityManager
        preconditions:
          - "placement.residency_status in {MOVED_IN, RESIDENT_CONFIRMED}"
          - "move_out_date >= actual_move_in_date and move_out_date <= the logical clock's current UTC calendar date"
        side_effects:
          - "CASCADE L1: sets move_out_date and days_resided; the linked CommunityInventory decrements occupied_units by 1, recomputes available_units, and increments its version by 1"
          - "CASCADE L2 (caused by L1): computes Placement.clawback_amount_cents per calculations.clawback_amount, which is 0 unless the placement has a ReferralInvoice with status in {ISSUED, ACCEPTED, PAID}; when it is greater than 0 that invoice moves to CLAWED_BACK and Placement.billing_status moves to CLAWED_BACK"
          - "CASCADE L3 (caused by L2): a FeeLedgerEntry with entry_type CLAWBACK and amount_cents = -clawback_amount_cents is appended, Community.fee_balance_cents is decremented by clawback_amount_cents, and ReferralInvoice.net_recognized_fee_cents is recomputed"
        note: "The from-set is exactly {MOVED_IN, RESIDENT_CONFIRMED}; the row is keyed on MOVED_IN for reference purposes."

      - from: PENDING_MOVE_IN
        to: CANCELLED
        trigger: "POST /placements/{placement_id}/cancel"
        actor: Advisor
        preconditions:
          - "placement.residency_status == PENDING_MOVE_IN"
        side_effects:
          - "the linked CommunityInventory decrements reserved_units by 1, recomputes available_units, and increments its version by 1"
          - "the linked Match remains SELECTED so a replacement Placement can be created"

  - entity: Placement
    initial_state: NOT_INVOICED
    terminal_states: [CLAWED_BACK, VOIDED]
    transitions:
      - from: NOT_INVOICED
        to: INVOICE_DRAFTED
        trigger: "POST /placements/{placement_id}/confirm-move-in (billing axis)"
        actor: system
        preconditions:
          - "placement.billing_status == NOT_INVOICED"
        side_effects:
          - "a ReferralInvoice row is created with status DRAFT"

      - from: INVOICE_DRAFTED
        to: INVOICED
        trigger: "POST /referral-invoices/{invoice_id}/issue"
        actor: system
        preconditions:
          - "placement.billing_status == INVOICE_DRAFTED"
        side_effects: []

      - from: INVOICED
        to: PAID
        trigger: "POST /referral-invoices/{invoice_id}/pay"
        actor: system
        preconditions:
          - "placement.billing_status == INVOICED"
        side_effects: []

      - from: INVOICED
        to: VOIDED
        trigger: "POST /referral-invoices/{invoice_id}/void"
        actor: system
        preconditions:
          - "placement.billing_status == INVOICED"
        side_effects: []

      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /placements/{placement_id}/move-out with clawback_amount_cents > 0"
        actor: system
        preconditions:
          - "placement.billing_status in {INVOICED, PAID}"
        side_effects: []
        note: "This is the billing axis of the same Placement row; it advances independently of residency_status, so a placement can sit at (residency MOVED_IN, billing PAID) or at (residency RESIDENT_CONFIRMED, billing INVOICE_DRAFTED)."

  - entity: ReferralInvoice
    initial_state: DRAFT
    terminal_states: [VOIDED, CLAWED_BACK]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /referral-invoices/{invoice_id}/issue"
        actor: BillingSpecialist
        preconditions:
          - "invoice.status == DRAFT"
          - "the linked Placement.residency_status in {MOVED_IN, RESIDENT_CONFIRMED}"
        side_effects:
          - "appends a FeeLedgerEntry with entry_type ACCRUAL and amount_cents = +invoice.final_fee_cents"
          - "increments Community.fee_balance_cents by invoice.final_fee_cents"
          - "recomputes ReferralInvoice.net_recognized_fee_cents"
          - "sets issued_at to the logical clock"
          - "the linked Placement moves billing_status INVOICE_DRAFTED -> INVOICED"

      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /referral-invoices/{invoice_id}/accept"
        actor: CommunityManager
        preconditions:
          - "invoice.status == ISSUED"
          - "X-User-ID == invoice.community_id"
        side_effects: []

      - from: ISSUED
        to: DISPUTED
        trigger: "POST /referral-invoices/{invoice_id}/dispute"
        actor: CommunityManager
        preconditions:
          - "invoice.status == ISSUED"
          - "X-User-ID == invoice.community_id"
          - "invoice.adjustment_count < MAX_DISPUTE_ROUNDS"
        side_effects:
          - "sets dispute_reason and claimed_rate_cents"

      - from: DISPUTED
        to: ISSUED
        trigger: "POST /referral-invoices/{invoice_id}/adjust"
        actor: BillingSpecialist
        preconditions:
          - "invoice.status == DISPUTED"
        side_effects:
          - "recomputes invoice.final_fee_cents from adjusted_rate_cents using the `final` variant of calculations.referral_fee"
          - "appends a FeeLedgerEntry with entry_type ADJUSTMENT and amount_cents = new final_fee_cents - previous final_fee_cents"
          - "adjusts Community.fee_balance_cents by the same signed delta"
          - "increments invoice.adjustment_count by 1 and refreshes issued_at"
        note: "Closes the negotiation cycle ISSUED -> DISPUTED -> ISSUED; MAX_DISPUTE_ROUNDS caps the loop."

      - from: ACCEPTED
        to: PAID
        trigger: "POST /referral-invoices/{invoice_id}/pay"
        actor: CommunityManager
        preconditions:
          - "invoice.status == ACCEPTED"
          - "X-User-ID == invoice.community_id"
          - "amount_cents == invoice.final_fee_cents"
        side_effects:
          - "appends a FeeLedgerEntry with entry_type PAYMENT and amount_cents = -amount_cents"
          - "decrements Community.fee_balance_cents by amount_cents"
          - "sets invoice.paid_amount_cents"
          - "the linked Placement moves billing_status INVOICED -> PAID"

      - from: ISSUED
        to: VOIDED
        trigger: "POST /referral-invoices/{invoice_id}/void"
        actor: BillingSpecialist
        preconditions:
          - "invoice.status in {ISSUED, DISPUTED}"
        side_effects:
          - "appends a FeeLedgerEntry with entry_type WRITE_OFF and amount_cents = -invoice.final_fee_cents"
          - "decrements Community.fee_balance_cents by invoice.final_fee_cents"
          - "recomputes ReferralInvoice.net_recognized_fee_cents"
          - "the linked Placement moves billing_status INVOICED -> VOIDED"
        note: "Compensating action for DRAFT -> ISSUED; the from-set is exactly {ISSUED, DISPUTED}."

      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /placements/{placement_id}/move-out with clawback_amount_cents > 0"
        actor: system
        preconditions:
          - "invoice.status in {ISSUED, ACCEPTED, PAID}"
        side_effects:
          - "appends a FeeLedgerEntry with entry_type CLAWBACK and amount_cents = -placement.clawback_amount_cents"
          - "decrements Community.fee_balance_cents by placement.clawback_amount_cents"
          - "recomputes ReferralInvoice.net_recognized_fee_cents"

  - entity: CaseloadAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED, REASSIGNED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "cascade from Inquiry -> PLACED or Inquiry -> CLOSED_LOST"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "sets released_at and release_reason (PLACED or CLOSED_LOST)"
          - "decrements Advisor.active_caseload_count by 1 and recomputes both Advisor load indices"

      - from: ACTIVE
        to: REASSIGNED
        trigger: "POST /inquiries/{inquiry_id}/reassign"
        actor: PlatformAdmin
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "sets released_at and release_reason REASSIGNED"
          - "decrements the losing Advisor.active_caseload_count by 1 and recomputes both of its load indices"

  - entity: BenefitGuidance
    initial_state: ISSUED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /benefit-guidances (a newer guidance is created for the same assessment_id)"
        actor: system
        preconditions:
          - "guidance.status == ISSUED"
          - "the incoming guidance targets the same assessment_id"
        side_effects:
          - "CASCADE L1: the new BenefitGuidance is created with status ISSUED and estimated_monthly_benefit_cents per calculations.va_benefit_estimate"
          - "CASCADE L2 (caused by L1): NeedsAssessment.benefit_offset_cents is set to the new guidance's estimated_monthly_benefit_cents, affordability_ceiling_cents is recomputed per calculations.affordability_ceiling, and NeedsAssessment.version is incremented by 1"
          - "CASCADE L3 (caused by L2): every Match of the inquiry whose status is in {PROPOSED, SHORTLISTED} has fit_score recomputed per calculations.match_fit_score against the new affordability_ceiling_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: placement-create-stale-inventory
    parent_entity: CommunityInventory
    write_endpoint: "POST /placements"
    occ_field: "expected_inventory_version"
    description: |
      Creating a Placement against a CommunityInventory whose version has advanced
      since the client last read it is rejected. A second Placement on the same
      unit pool is legitimate business behaviour whenever available_units is still
      positive, so the stale-version check is the only deterministic way to reject
      a writer whose view of the pool predates an earlier reservation, move-in,
      cancellation or rate change.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: guidance-create-stale-assessment
    parent_entity: NeedsAssessment
    write_endpoint: "POST /benefit-guidances"
    occ_field: "expected_assessment_version"
    description: |
      Creating a BenefitGuidance against a NeedsAssessment whose version has
      advanced since the client last read it is rejected. A new guidance legitimately
      supersedes the prior ISSUED one and rewrites the assessment's
      affordability_ceiling_cents, so a counselor working from a stale assessment
      snapshot would silently overwrite a colleague's freshly issued estimate.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inquiry_priority_score
    trigger: "POST /inquiries — computed once at creation and frozen; never recomputed"
    algorithm: weighted_scoring
    formula: |
      acuity_norm  = ACUITY_BY_CARE_LEVEL[inquiry.requested_care_level]          # 0..100, integer
      days_to_move = whole calendar days from date(logical_clock_now_utc) to inquiry.target_move_in_date
                     (validated to be >= 0)
      urgency_norm = round_half_up(
                       100 * (URGENCY_HORIZON_DAYS - min(days_to_move, URGENCY_HORIZON_DAYS))
                             / URGENCY_HORIZON_DAYS, 2)
      budget_norm  = min(100.00,
                       round_half_up(100 * inquiry.declared_budget_monthly_cents
                                     / BUDGET_REFERENCE_CENTS, 2))

      # PINNED EVALUATION / ROUNDING ORDER (round-then-sum):
      #   each weighted term is rounded to 2 decimals half-up FIRST, then the three
      #   rounded terms are added. The sum itself is NOT rounded again.
      priority_score = round_half_up(W_ACUITY  * acuity_norm , 2)
                     + round_half_up(W_URGENCY * urgency_norm, 2)
                     + round_half_up(W_BUDGET  * budget_norm , 2)
    input_set: "Exactly the three fields requested_care_level, target_move_in_date and declared_budget_monthly_cents of the Inquiry being created, plus the logical clock at creation time. No other Inquiry, Assessment or Match participates."
    constants:
      ACUITY_BY_CARE_LEVEL: { INDEPENDENT_LIVING: 22, ASSISTED_LIVING: 57, MEMORY_CARE: 86, SKILLED_NURSING: 100 }
      URGENCY_HORIZON_DAYS: 90
      BUDGET_REFERENCE_CENTS: 600000
      W_ACUITY: 0.45
      W_URGENCY: 0.35
      W_BUDGET: 0.20
    precision: "each weighted term 2 decimals round_half_up; the final sum is reported exactly as the sum of those three rounded terms"

  - name: recommended_care_level
    trigger: "POST /assessments and every PATCH /assessments/{assessment_id} that lands the row in DRAFT"
    algorithm: threshold
    formula: |
      acuity_total = adl_score + cognitive_score + mobility_score        # 0..30

      # PINNED BRANCH ORDER — first matching branch wins:
      if acuity_total >= 25:        recommended_care_level = SKILLED_NURSING
      elif cognitive_score >= 8:    recommended_care_level = MEMORY_CARE
      elif acuity_total <= 8:       recommended_care_level = INDEPENDENT_LIVING
      elif acuity_total <= 17:      recommended_care_level = ASSISTED_LIVING
      else:                         recommended_care_level = MEMORY_CARE
    input_set: "The three acuity fields of this NeedsAssessment only."
    constants:
      SKILLED_NURSING_ACUITY_FLOOR: 25
      MEMORY_CARE_COGNITIVE_FLOOR: 8
      INDEPENDENT_LIVING_ACUITY_CEILING: 8
      ASSISTED_LIVING_ACUITY_CEILING: 17
    precision: "integer comparisons; no rounding"

  - name: affordability_ceiling
    trigger: "POST /assessments/{assessment_id}/review with decision APPROVE, and again on every BenefitGuidance creation that changes NeedsAssessment.benefit_offset_cents"
    algorithm: aggregation
    formula: |
      benefit_offset_cents = estimated_monthly_benefit_cents of the BenefitGuidance rows
                             with assessment_id == this assessment and status == ISSUED
                             (at most one such row exists by construction), else 0
      affordability_ceiling_cents = round_half_up(assessment.budget_monthly_cents
                                                  * BUDGET_STRETCH_FACTOR)
                                  + benefit_offset_cents
    input_set: "This NeedsAssessment's budget_monthly_cents plus the single BenefitGuidance with status ISSUED for this assessment (status filter is exactly {ISSUED}; SUPERSEDED guidances are excluded)."
    constants:
      BUDGET_STRETCH_FACTOR: 1.10
    precision: "whole cents, round_half_up applied to the stretched budget before the benefit offset is added"

  - name: match_fit_score
    trigger: "POST /matches, and again on every recomputation triggered by a change to the inquiry's NeedsAssessment.affordability_ceiling_cents"
    algorithm: weighted_scoring
    formula: |
      inv          = the CommunityInventory with community_id == match.community_id
                     and care_level == match.care_level (unique by construction)
      rec          = the inquiry's NeedsAssessment.recommended_care_level
      ceiling      = the inquiry's NeedsAssessment.affordability_ceiling_cents
      rate         = match.quoted_monthly_rate_cents          # snapshot taken at creation, never refreshed

      # (1) care fit — conditional branch
      if match.care_level == rec:                          care_fit = CARE_EXACT
      elif CARE_ORDER[match.care_level] == CARE_ORDER[rec] + 1: care_fit = CARE_ADJACENT
      else:                                                care_fit = CARE_MISMATCH

      # (2) budget fit — nested conditional with a floor
      budget_ratio = rate / ceiling
      if budget_ratio > 1.0:            budget_fit = 0.00
      elif budget_ratio <= BUDGET_COMFORT_RATIO: budget_fit = 100.00
      else: budget_fit = round_half_up(max(0.0,
                             100 - BUDGET_FALLOFF_SLOPE * (budget_ratio - BUDGET_COMFORT_RATIO)), 2)

      # (3) quality fit and (4) availability fit — nested min
      quality_fit      = round_half_up(20 * community.quality_rating, 2)
      availability_fit = min(100.00, 20 * inv.available_units)          # live value at evaluation time

      # PINNED ROUNDING ORDER (sum-then-round) — deliberately the OPPOSITE of
      # inquiry_priority_score: the four weighted terms are summed at full
      # precision and the TOTAL is rounded once to 2 decimals half-up.
      fit_score = round_half_up(W_CARE         * care_fit
                              + W_BUDGET_FIT   * budget_fit
                              + W_QUALITY      * quality_fit
                              + W_AVAILABILITY * availability_fit, 2)
    input_set: "One Match, the unique OPEN CommunityInventory for (community_id, care_level), the Community row, and the inquiry's NeedsAssessment. quoted_monthly_rate_cents is the creation-time snapshot; available_units and quality_rating are read live at evaluation time."
    constants:
      CARE_EXACT: 100
      CARE_ADJACENT: 60
      CARE_MISMATCH: 0
      CARE_ORDER: { INDEPENDENT_LIVING: 1, ASSISTED_LIVING: 2, MEMORY_CARE: 3, SKILLED_NURSING: 4 }
      BUDGET_COMFORT_RATIO: 0.85
      BUDGET_FALLOFF_SLOPE: 300
      W_CARE: 0.40
      W_BUDGET_FIT: 0.35
      W_QUALITY: 0.15
      W_AVAILABILITY: 0.10
    precision: "budget_fit and quality_fit rounded to 2 decimals half-up before weighting; the weighted total rounded once to 2 decimals half-up"

  - name: advisor_load_index
    trigger: "every transition that changes Advisor.active_caseload_count (assign, reassign, cascade release) and every read of GET /advisors/{advisor_id} or GET /reports/advisor-caseload"
    algorithm: aggregation
    formula: |
      active = the CaseloadAssignment rows with advisor_id == advisor.id and status == ACTIVE
      headcount_load_index = round_half_up(count(active) / advisor.caseload_capacity, 4)
      weighted_load_index  = round_half_up(
                               sum(Inquiry.priority_score for the inquiry_id of each row in `active`)
                               / (advisor.caseload_capacity * PRIORITY_SCORE_MAX), 4)
    input_set: "CaseloadAssignment rows filtered to status == ACTIVE only (RELEASED and REASSIGNED rows are excluded), joined to their Inquiry for priority_score. Order is irrelevant because both aggregates are sums/counts."
    constants:
      PRIORITY_SCORE_MAX: 100
    precision: "4 decimals, round_half_up"
    variants:
      - name: headcount
        when: "used as the hard eligibility gate for assignment (active_caseload_count < caseload_capacity) and reported as Advisor.headcount_load_index"
        difference: "counts every ACTIVE assignment as exactly 1.0 regardless of the inquiry's acuity or urgency"
      - name: acuity_weighted
        when: "used as the ranking key of calculations.advisor_auto_selection and reported as Advisor.weighted_load_index"
        difference: "weights each ACTIVE assignment by its Inquiry.priority_score / 100, so the same caseload yields a different index; a caseload of low-priority cases produces a materially lower index than the headcount variant"

  - name: advisor_auto_selection
    trigger: "POST /inquiries/{inquiry_id}/assign when the request body omits advisor_id"
    algorithm: waterfall_allocation
    formula: |
      # (a) eligibility filter — explicit predicate over entity fields
      candidates = Advisor rows where
                     advisor.status == ACTIVE
                     AND advisor.region_code == inquiry.region_code
                     AND advisor.active_caseload_count < advisor.caseload_capacity

      # (b) ranking expression
      sort candidates by advisor.weighted_load_index ASC

      # (c) tie-break chain, applied in order
      #     1st tie-break: advisor.active_caseload_count ASC
      #     2nd tie-break: advisor.created_at ASC        (never advisor.id)

      # (d) empty-pool fallback
      if candidates is empty: reject the request with ERR_NO_ELIGIBLE_ADVISOR (409)
    input_set: "All Advisor rows; no other entity participates in candidate selection."
    constants: {}
    precision: "weighted_load_index compared at 4 decimals as stored"

  - name: referral_fee
    trigger: "POST /placements (estimated variant) and POST /placements/{placement_id}/confirm-move-in (final variant); the final variant also re-runs on POST /referral-invoices/{invoice_id}/adjust"
    algorithm: tiered_pricing
    formula: |
      # Shared component structure. `rate`, `level` and `ratio` are bound per variant.
      base_cents          = round_half_up(rate * community.referral_fee_pct * ratio)
      care_premium_cents  = round_half_up(rate * CARE_PREMIUM_PCT[level] * ratio)
      tier_bonus_cents    = round_half_up(base_cents * (TIER_MULTIPLIER[community.contract_tier] - 1.00))
      raw_cents           = base_cents + care_premium_cents + tier_bonus_cents
      fee_cents           = min(MAX_FEE_CENTS, max(MIN_FEE_CENTS, raw_cents))

      # PINNED ROUNDING ORDER: each of the three components is rounded to whole
      # cents half-up BEFORE the sum, and tier_bonus_cents is computed from the
      # ALREADY-ROUNDED base_cents — not from the unrounded product. The clamp is
      # applied last, to the summed total only.

      # proration helper used by the `final` variant only
      occupied_days   = min(PRORATION_BASIS_DAYS, 31 - day_of_month(actual_move_in_date))
      proration_ratio = occupied_days / PRORATION_BASIS_DAYS
    input_set: "One Placement, its Match (for quoted_monthly_rate_cents and care_level) and its Community (for referral_fee_pct and contract_tier). No other placement participates."
    constants:
      CARE_PREMIUM_PCT: { INDEPENDENT_LIVING: 0.00, ASSISTED_LIVING: 0.05, MEMORY_CARE: 0.12, SKILLED_NURSING: 0.15 }
      TIER_MULTIPLIER: { STANDARD: 1.00, PREFERRED: 1.10, PREMIER: 1.25 }
      MIN_FEE_CENTS: 150000
      MAX_FEE_CENTS: 900000
      PRORATION_BASIS_DAYS: 30
    precision: "whole cents; round_half_up per component, clamp applied to the sum"
    variants:
      - name: estimated
        when: "at POST /placements, stored in Placement.estimated_fee_cents"
        difference: "rate = match.quoted_monthly_rate_cents, level = match.care_level, ratio = 1.0 (no proration at all — the estimate always books a full first month)"
      - name: final
        when: "at POST /placements/{placement_id}/confirm-move-in, stored in Placement.final_fee_cents and copied onto the created ReferralInvoice"
        difference: "rate = placement.contracted_monthly_rate_cents, level = placement.actual_care_level, ratio = proration_ratio derived from the day-of-month of actual_move_in_date. Identical rate and care level still produce a different number from the estimate whenever the move-in day of month is not the 1st."

  - name: va_benefit_estimate
    trigger: "POST /benefit-guidances"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER — single forward pass, steps 1..4, no iteration.
      # The dependency LOOKS circular (the household's affordability ceiling depends
      # on the award, and the award depends on the care cost the household plans to
      # buy) so the order is nailed down here: step 1 always uses the assessment's
      # declared budget_monthly_cents as the projected care cost, NEVER the
      # affordability_ceiling_cents that step 4 goes on to write.

      step 1: projected_care_cost_cents      = assessment.budget_monthly_cents
              unreimbursed_medical_cents     = max(0, projected_care_cost_cents
                                                 - round_half_up(UME_INCOME_THRESHOLD_PCT
                                                                 * assessment.gross_monthly_income_cents))
      step 2: countable_income_cents         = max(0, assessment.gross_monthly_income_cents
                                                 - unreimbursed_medical_cents)
      step 3: cap = VA_MAX_MONTHLY_CENTS[benefit_key] where benefit_key is
                    VA_AID_ATTENDANCE_MARRIED  when benefit_type == VA_AID_ATTENDANCE and marital_status == MARRIED
                    VA_AID_ATTENDANCE_SINGLE   when benefit_type == VA_AID_ATTENDANCE and marital_status in {SINGLE, WIDOWED}
                    VA_SURVIVOR_PENSION        when benefit_type == VA_SURVIVOR_PENSION
                    LTC_INSURANCE              when benefit_type == LTC_INSURANCE
                    BRIDGE_LOAN                when benefit_type == BRIDGE_LOAN
              estimated_monthly_benefit_cents = max(0, min(cap, cap - countable_income_cents))
      step 4: assessment.benefit_offset_cents      = estimated_monthly_benefit_cents
              assessment.affordability_ceiling_cents = re-run calculations.affordability_ceiling
    input_set: "Exactly one NeedsAssessment (its budget_monthly_cents, gross_monthly_income_cents and marital_status) plus the requested benefit_type."
    constants:
      UME_INCOME_THRESHOLD_PCT: 0.05
      VA_MAX_MONTHLY_CENTS:
        VA_AID_ATTENDANCE_MARRIED: 276000
        VA_AID_ATTENDANCE_SINGLE: 233000
        VA_SURVIVOR_PENSION: 149800
        LTC_INSURANCE: 200000
        BRIDGE_LOAN: 120000
    precision: "whole cents, round_half_up on the 5% income threshold only"

  - name: clawback_amount
    trigger: "POST /placements/{placement_id}/move-out"
    algorithm: threshold
    formula: |
      days_resided = whole calendar days from placement.actual_move_in_date to move_out_date

      # Gate: a clawback only exists where a fee was actually recognised. If the
      # placement has no ReferralInvoice whose status is in {ISSUED, ACCEPTED, PAID}
      # — i.e. the invoice is still DRAFT, or already VOIDED or CLAWED_BACK —
      # clawback_amount_cents is 0, no FeeLedgerEntry is appended and
      # Placement.billing_status is left untouched.
      if no ReferralInvoice of this placement has status in {ISSUED, ACCEPTED, PAID}:
          clawback_amount_cents = 0
      else:
          if days_resided <= CLAWBACK_FULL_DAYS:       clawback_pct = 1.00
          elif days_resided <= CLAWBACK_PARTIAL_DAYS:  clawback_pct = 0.50
          else:                                        clawback_pct = 0.00
          clawback_amount_cents = round_half_up(placement.final_fee_cents * clawback_pct)
    input_set: "One Placement with a non-null final_fee_cents, plus its single ReferralInvoice filtered to status in {ISSUED, ACCEPTED, PAID}. Placements whose invoice is DRAFT, VOIDED or already CLAWED_BACK yield clawback_amount_cents 0 and write no ledger entry."
    constants:
      CLAWBACK_FULL_DAYS: 30
      CLAWBACK_PARTIAL_DAYS: 90
    precision: "whole cents, round_half_up; boundary is inclusive on both tiers (30 days is still a full clawback, 90 days is still a half clawback)"

  - name: satisfaction_composite_score
    trigger: "POST /surveys"
    algorithm: weighted_scoring
    formula: |
      nps_norm   = 10 * survey.nps_score          # 0..10  -> 0..100
      care_norm  = 20 * survey.care_rating        # 1..5   -> 20..100
      value_norm = 20 * survey.value_rating       # 1..5   -> 20..100
      composite_score = round_half_up(W_NPS * nps_norm + W_CARE * care_norm + W_VALUE * value_norm, 2)

      # community roll-up, recomputed on every survey insert:
      community.satisfaction_survey_count = count(SatisfactionSurvey rows with community_id == this community)
      community.avg_satisfaction_score    = round_half_up(
                                              sum(composite_score of those rows)
                                              / community.satisfaction_survey_count, 2)
    input_set: "One SatisfactionSurvey for the composite; for the roll-up, every SatisfactionSurvey row with community_id == the placement's community (no status filter exists — surveys are immutable and never withdrawn). Order-independent."
    constants:
      W_NPS: 0.40
      W_CARE: 0.35
      W_VALUE: 0.25
    precision: "2 decimals, round_half_up, applied once to the weighted sum"

  - name: community_fee_balance
    trigger: "every FeeLedgerEntry insert (ACCRUAL, ADJUSTMENT, PAYMENT, CLAWBACK, WRITE_OFF)"
    algorithm: chronological
    formula: |
      entries = FeeLedgerEntry rows with community_id == this community,
                processed in ascending created_at order; when two entries share the
                same created_at they are processed in the order the triggering
                transitions fired within the request (never by id)

      running = 0
      for e in entries:
          running = running + e.amount_cents
          e.balance_after_cents = running
      community.fee_balance_cents = running

      invoice.net_recognized_fee_cents = sum(e.amount_cents for e in that invoice's entries
                                             with entry_type in {ACCRUAL, ADJUSTMENT, CLAWBACK, WRITE_OFF})
    input_set: "All FeeLedgerEntry rows of the community, with no status filter (the ledger is append-only and entries are never deleted). net_recognized_fee_cents deliberately excludes PAYMENT rows, which move cash rather than recognized revenue."
    constants: {}
    precision: "whole cents; integers only, no rounding"

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path-parameter id resolves to a stored row, validated left-to-right"
    error_id: "ERR_FAMILY_NOT_FOUND | ERR_ADVISOR_NOT_FOUND | ERR_COMMUNITY_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_INQUIRY_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_TOUR_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_GUIDANCE_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path parameter"

  - priority: 4
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: every required field present, types correct, enum members legal, integers within their declared ranges, dates ISO 8601, and no unknown field carrying a system/computed field name"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: existence
    check: "every foreign-key id supplied in the request body resolves to a stored row"
    error_id: "ERR_FAMILY_NOT_FOUND | ERR_ADVISOR_NOT_FOUND | ERR_COMMUNITY_NOT_FOUND | ERR_INVENTORY_NOT_FOUND | ERR_INQUIRY_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /inventories, POST /inquiries, POST /assessments, POST /matches, POST /tours, POST /placements, POST /benefit-guidances, POST /surveys, POST /inquiries/{inquiry_id}/assign, POST /inquiries/{inquiry_id}/reassign"

  - priority: 6
    category: auth
    check: "entity-backed ownership: an Advisor may only act on an Inquiry whose assigned_advisor_id equals X-User-ID and on Tours whose advisor_id equals X-User-ID; a CommunityManager may only act on Communities, CommunityInventories, Placements and ReferralInvoices whose community_id equals X-User-ID; a Family may only act on Inquiries and Placements reachable from the Family whose id equals X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all write endpoints whose actor role is entity_backed"

  - priority: 7
    category: auth
    check: "the Advisor row identified by X-User-ID has is_va_certified == true"
    error_id: ERR_ADVISOR_NOT_VA_CERTIFIED
    http_status: 403
    applies_to: "POST /benefit-guidances"

  - priority: 8
    category: auth
    check: "segregation of duties: when the reviewing actor's role is Advisor, X-User-ID != assessment.author_advisor_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /assessments/{assessment_id}/review"

  - priority: 9
    category: auth
    check: "segregation of duties: the acting BenefitsCounselor's X-User-ID != inquiry.assigned_advisor_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /benefit-guidances"

  - priority: 10
    category: state
    check: "the target row's current state is in the from-set of the requested §1.2 transition (Inquiry.status, NeedsAssessment.status, Match.status, Tour.status, Placement.residency_status, Placement.billing_status, ReferralInvoice.status)"
    error_id: "ERR_INQUIRY_INVALID_STATE | ERR_ASSESSMENT_INVALID_STATE | ERR_MATCH_INVALID_STATE | ERR_TOUR_INVALID_STATE | ERR_PLACEMENT_INVALID_STATE | ERR_INVOICE_INVALID_STATE"
    http_status: 409
    applies_to: "every state-transition endpoint, evaluated against that endpoint's OWN target resource. POST /matches and POST /benefit-guidances take their inquiry-state gate at priority 13 instead, so this row never fires for them."

  - priority: 11
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version (OCC per §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /placements, POST /benefit-guidances"

  - priority: 12
    category: business_referential
    check: "the referenced Community.status == ACTIVE"
    error_id: ERR_COMMUNITY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /matches, POST /tours, POST /placements, POST /matches/{match_id}/select"

  - priority: 13
    category: business_referential
    check: "the inquiry has a NeedsAssessment and its status == APPROVED (otherwise ERR_ASSESSMENT_NOT_APPROVED). This row REPLACES the priority-10 inquiry-state check for these two endpoints; once the assessment is APPROVED, POST /matches additionally requires inquiry.status in {ASSESSED, MATCHING, TOURING} and POST /benefit-guidances additionally requires inquiry.status in {ASSESSED, MATCHING, TOURING, ON_HOLD}, and a violation of that second clause yields ERR_INQUIRY_INVALID_STATE"
    error_id: "ERR_ASSESSMENT_NOT_APPROVED | ERR_INQUIRY_INVALID_STATE"
    http_status: 409
    applies_to: "POST /matches, POST /benefit-guidances"

  - priority: 14
    category: business_referential
    check: "the invoice's Placement.residency_status is in {MOVED_IN, RESIDENT_CONFIRMED}"
    error_id: ERR_PLACEMENT_NOT_MOVED_IN
    http_status: 409
    applies_to: "POST /referral-invoices/{invoice_id}/issue"

  - priority: 15
    category: business_referential
    check: "the inquiry's NeedsAssessment.va_eligible == true"
    error_id: ERR_GUIDANCE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /benefit-guidances"

  - priority: 16
    category: business_constraint
    check: "no other CommunityInventory exists with the same (community_id, care_level)"
    error_id: ERR_DUPLICATE_INVENTORY
    http_status: 409
    applies_to: "POST /inventories"

  - priority: 17
    category: business_constraint
    check: "no Match exists for the same (inquiry_id, community_id) whose status is not in {DECLINED, WITHDRAWN}"
    error_id: ERR_DUPLICATE_MATCH
    http_status: 409
    applies_to: "POST /matches"

  - priority: 18
    category: business_constraint
    check: "the inquiry has no Placement whose residency_status is not in {CANCELLED, MOVED_OUT}"
    error_id: ERR_PLACEMENT_EXISTS
    http_status: 409
    applies_to: "POST /placements"

  - priority: 19
    category: business_constraint
    check: "no SatisfactionSurvey already exists for this placement_id"
    error_id: ERR_DUPLICATE_SURVEY
    http_status: 409
    applies_to: "POST /surveys"

  - priority: 20
    category: business_constraint
    check: "a CommunityInventory with status OPEN exists for (community_id, care_level)"
    error_id: ERR_CARE_LEVEL_UNAVAILABLE
    http_status: 409
    applies_to: "POST /matches"

  - priority: 21
    category: business_constraint
    check: "an explicitly named advisor has status == ACTIVE and region_code == inquiry.region_code"
    error_id: ERR_ADVISOR_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /inquiries/{inquiry_id}/assign, POST /inquiries/{inquiry_id}/reassign"

  - priority: 22
    category: business_constraint
    check: "auto-selection candidate pool from calculations.advisor_auto_selection is non-empty"
    error_id: ERR_NO_ELIGIBLE_ADVISOR
    http_status: 409
    applies_to: "POST /inquiries/{inquiry_id}/assign when advisor_id is omitted"

  - priority: 23
    category: business_constraint
    check: "invoice.adjustment_count < MAX_DISPUTE_ROUNDS (2)"
    error_id: ERR_DISPUTE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /referral-invoices/{invoice_id}/dispute"

  - priority: 24
    category: business_constraint
    check: "scheduled_end is strictly after scheduled_start, the duration is within [TOUR_MIN_MINUTES, TOUR_MAX_MINUTES] = [30, 180] minutes, and scheduled_start is at or after the logical clock's current instant"
    error_id: ERR_TOUR_OUTSIDE_HOURS
    http_status: 422
    applies_to: "POST /tours"

  - priority: 25
    category: business_constraint
    check: "COMMUNITY TOUR-SLOT CAPACITY — count the Tour rows with community_id == match.community_id and status == SCHEDULED whose CLOSED interval [scheduled_start, scheduled_end] intersects the candidate CLOSED interval (existing.scheduled_start <= candidate.scheduled_end AND candidate.scheduled_start <= existing.scheduled_end; touching endpoints DO intersect). That count must be strictly less than community.tour_slot_capacity"
    error_id: ERR_TOUR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /tours"

  - priority: 26
    category: business_temporal
    check: "ADVISOR CALENDAR — for every Tour row with advisor_id == inquiry.assigned_advisor_id and status == SCHEDULED, reject when candidate.scheduled_start < existing.scheduled_end + B AND existing.scheduled_start < candidate.scheduled_end + B, where B = TRAVEL_BUFFER_MINUTES (45) when either tour has mode IN_PERSON and B = 0 when both are VIRTUAL. The comparison is strict, so a gap of exactly B minutes is accepted"
    error_id: ERR_ADVISOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /tours"

  - priority: 27
    category: business_temporal
    check: "target_move_in_date is on or after the logical clock's current UTC calendar date"
    error_id: ERR_MOVE_IN_DATE_INVALID
    http_status: 422
    applies_to: "POST /inquiries"

  - priority: 28
    category: business_temporal
    check: "actual_move_in_date is on or before the logical clock's current UTC calendar date"
    error_id: ERR_MOVE_IN_DATE_INVALID
    http_status: 422
    applies_to: "POST /placements/{placement_id}/confirm-move-in"

  - priority: 29
    category: business_temporal
    check: "the logical clock's current UTC calendar date >= placement.actual_move_in_date + RESIDENCY_CONFIRM_DAYS (14)"
    error_id: ERR_RESIDENCY_CONFIRM_TOO_EARLY
    http_status: 409
    applies_to: "POST /placements/{placement_id}/confirm-residency"

  - priority: 30
    category: business_temporal
    check: "the logical clock's current UTC calendar date >= placement.actual_move_in_date + SURVEY_ELIGIBLE_DAYS (30)"
    error_id: ERR_SURVEY_TOO_EARLY
    http_status: 409
    applies_to: "POST /surveys"

  - priority: 31
    category: business_temporal
    check: "move_out_date >= placement.actual_move_in_date and move_out_date <= the logical clock's current UTC calendar date"
    error_id: ERR_MOVE_OUT_DATE_INVALID
    http_status: 422
    applies_to: "POST /placements/{placement_id}/move-out"

  - priority: 32
    category: business_fiscal
    check: "advisor.active_caseload_count < advisor.caseload_capacity (a count exactly equal to capacity is rejected)"
    error_id: ERR_ADVISOR_CASELOAD_FULL
    http_status: 409
    applies_to: "POST /inquiries/{inquiry_id}/assign, POST /inquiries/{inquiry_id}/reassign"

  - priority: 33
    category: business_fiscal
    check: "the resolved CommunityInventory.monthly_rate_cents <= the inquiry's NeedsAssessment.affordability_ceiling_cents (equality is accepted)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /matches"

  - priority: 34
    category: business_fiscal
    check: "inventory.available_units >= 1"
    error_id: ERR_NO_UNITS_AVAILABLE
    http_status: 409
    applies_to: "POST /placements"

  - priority: 35
    category: business_fiscal
    check: "the new total_units >= reserved_units + occupied_units"
    error_id: ERR_INVENTORY_UNDER_ALLOCATED
    http_status: 409
    applies_to: "PATCH /inventories/{inventory_id}"

  - priority: 36
    category: business_fiscal
    check: "amount_cents == invoice.final_fee_cents exactly"
    error_id: ERR_INVOICE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /referral-invoices/{invoice_id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: moves the server's logical clock to an explicit UTC instant. Before any call the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects:
      - "all subsequent date comparisons (urgency, residency confirmation, survey eligibility, clawback windows, tour scheduling) read this instant"

  - method: POST
    path: "/advisors"
    description: "Register a placement advisor."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, region_code, "is_va_certified?", caseload_capacity]
    output: Advisor
    side_effects:
      - "initialises active_caseload_count = 0, headcount_load_index = 0, weighted_load_index = 0, status = ACTIVE"

  - method: GET
    path: "/advisors/{advisor_id}"
    description: "Read one advisor, including both load-index variants."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Advisor
    side_effects: []

  - method: GET
    path: "/advisors"
    description: "List advisors with filtering and pagination."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["region_code?", "status?", "is_va_certified?", "limit?", "offset?"]
    output: Advisor[]
    side_effects: []

  - method: PATCH
    path: "/advisors/{advisor_id}"
    description: "Update advisor availability, capacity or VA certification."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "caseload_capacity?", "is_va_certified?"]
    output: Advisor
    side_effects:
      - "recomputes headcount_load_index and weighted_load_index when caseload_capacity changes"

  - method: POST
    path: "/communities"
    description: "Register a senior-living community and its referral contract terms."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, contract_tier, referral_fee_pct, tour_slot_capacity, quality_rating]
    output: Community
    side_effects:
      - "initialises status = ACTIVE, fee_balance_cents = 0, satisfaction_survey_count = 0, avg_satisfaction_score = 0"

  - method: GET
    path: "/communities/{community_id}"
    description: "Read one community, including its fee balance and satisfaction roll-up."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: GET
    path: "/communities"
    description: "List communities with filtering and pagination."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["region_code?", "status?", "contract_tier?", "limit?", "offset?"]
    output: Community[]
    side_effects: []

  - method: PATCH
    path: "/communities/{community_id}"
    description: "Update contract standing or commercial terms of a community."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "contract_tier?", "referral_fee_pct?", "tour_slot_capacity?", "quality_rating?"]
    output: Community
    side_effects:
      - "a status change to SUSPENDED or TERMINATED blocks new matches, tours and placements at this community; existing rows are untouched"

  - method: POST
    path: "/inventories"
    description: "Create a care-level unit pool for a community."
    roles: [PlatformAdmin, CommunityManager]
    code: 201
    input: [community_id, care_level, total_units, monthly_rate_cents]
    output: CommunityInventory
    side_effects:
      - "initialises reserved_units = 0, occupied_units = 0, available_units = total_units, status = OPEN"

  - method: GET
    path: "/inventories/{inventory_id}"
    description: "Read one unit pool, including its current version for optimistic concurrency."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: CommunityInventory
    side_effects: []

  - method: GET
    path: "/inventories"
    description: "List unit pools; filter by community_id to find a community's inventory."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["community_id?", "care_level?", "status?", "limit?", "offset?"]
    output: CommunityInventory[]
    side_effects: []

  - method: PATCH
    path: "/inventories/{inventory_id}"
    description: "Resize, reprice or close a unit pool."
    roles: [PlatformAdmin, CommunityManager]
    code: 200
    input: ["total_units?", "monthly_rate_cents?", "status?"]
    output: CommunityInventory
    side_effects:
      - "recomputes available_units"
      - "increments CommunityInventory.version by 1"

  - method: POST
    path: "/families"
    description: "Register the enquiring household."
    roles: [PlatformAdmin, Advisor]
    code: 201
    input: [primary_contact_name, email, phone, relationship_to_senior, state_code, senior_first_name, senior_age]
    output: Family
    side_effects: []

  - method: GET
    path: "/families/{family_id}"
    description: "Read one family."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Family
    side_effects: []

  - method: GET
    path: "/families"
    description: "List families with filtering and pagination."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Family[]
    side_effects: []

  - method: POST
    path: "/inquiries"
    description: "Open a placement inquiry for a family."
    roles: [PlatformAdmin, Advisor, Family]
    code: 201
    input: [family_id, origin, region_code, requested_care_level, target_move_in_date, declared_budget_monthly_cents, "notes?"]
    output: Inquiry
    side_effects:
      - "computes Inquiry.priority_score per calculations.inquiry_priority_score and freezes it"
      - "sets status = NEW and assigned_advisor_id = null"

  - method: GET
    path: "/inquiries/{inquiry_id}"
    description: "Read one inquiry, including its frozen priority_score and current version."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Inquiry
    side_effects: []

  - method: GET
    path: "/inquiries"
    description: "List inquiries; filter by family_id or assigned_advisor_id to walk the foreign keys."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["family_id?", "assigned_advisor_id?", "status?", "region_code?", "limit?", "offset?"]
    output: Inquiry[]
    side_effects: []

  - method: POST
    path: "/inquiries/{inquiry_id}/assign"
    description: "Assign an advisor to a NEW inquiry. When advisor_id is omitted the server applies calculations.advisor_auto_selection."
    roles: [PlatformAdmin]
    code: 200
    input: ["advisor_id?"]
    output: Inquiry
    side_effects:
      - "Inquiry NEW -> ASSIGNED"
      - "creates a CaseloadAssignment with status ACTIVE"
      - "increments Advisor.active_caseload_count by 1 and recomputes both Advisor load indices"

  - method: POST
    path: "/inquiries/{inquiry_id}/reassign"
    description: "Move a live inquiry from its current advisor to another advisor."
    roles: [PlatformAdmin]
    code: 200
    input: [to_advisor_id]
    output: Inquiry
    side_effects:
      - "the ACTIVE CaseloadAssignment moves to REASSIGNED and a new ACTIVE one is created for the target advisor"
      - "decrements the losing advisor's active_caseload_count by 1 and increments the gaining advisor's by 1; both advisors' load indices are recomputed"

  - method: POST
    path: "/inquiries/{inquiry_id}/hold"
    description: "Pause a search at the family's request."
    roles: [Advisor, PlatformAdmin]
    code: 200
    input: [reason]
    output: Inquiry
    side_effects:
      - "Inquiry MATCHING|TOURING -> ON_HOLD"
      - "from TOURING, every SCHEDULED Tour of the inquiry is CANCELLED and its Match returns to SHORTLISTED"

  - method: POST
    path: "/inquiries/{inquiry_id}/resume"
    description: "Resume a paused search; the inquiry always lands back on MATCHING."
    roles: [Advisor, PlatformAdmin]
    code: 200
    input: []
    output: Inquiry
    side_effects:
      - "Inquiry ON_HOLD -> MATCHING"

  - method: POST
    path: "/inquiries/{inquiry_id}/close"
    description: "Close an inquiry as lost."
    roles: [Advisor, PlatformAdmin]
    code: 200
    input: [reason_code]
    output: Inquiry
    side_effects:
      - "Inquiry -> CLOSED_LOST; non-terminal Matches -> WITHDRAWN; their SCHEDULED Tours -> CANCELLED; the ACTIVE CaseloadAssignment -> RELEASED with release_reason CLOSED_LOST"

  - method: POST
    path: "/assessments"
    description: "Create the needs and budget assessment for an inquiry; the acting advisor becomes its author."
    roles: [Advisor]
    code: 201
    input: [inquiry_id, adl_score, cognitive_score, mobility_score, budget_monthly_cents, gross_monthly_income_cents, va_eligible, marital_status]
    output: NeedsAssessment
    side_effects:
      - "sets author_advisor_id from X-User-ID and status = DRAFT"
      - "computes recommended_care_level per calculations.recommended_care_level"

  - method: GET
    path: "/assessments/{assessment_id}"
    description: "Read one assessment, including affordability_ceiling_cents and its current version for optimistic concurrency."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects: []

  - method: GET
    path: "/assessments"
    description: "List assessments; filter by inquiry_id or author_advisor_id to walk the foreign keys."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["inquiry_id?", "author_advisor_id?", "status?", "limit?", "offset?"]
    output: NeedsAssessment[]
    side_effects: []

  - method: PATCH
    path: "/assessments/{assessment_id}"
    description: "Edit a DRAFT or REVISION_REQUESTED assessment; a REVISION_REQUESTED row returns to DRAFT."
    roles: [Advisor]
    code: 200
    input: ["adl_score?", "cognitive_score?", "mobility_score?", "budget_monthly_cents?", "gross_monthly_income_cents?", "va_eligible?", "marital_status?"]
    output: NeedsAssessment
    side_effects:
      - "recomputes recommended_care_level"
      - "REVISION_REQUESTED -> DRAFT and clears revision_note"

  - method: POST
    path: "/assessments/{assessment_id}/submit"
    description: "Submit a DRAFT assessment for peer review."
    roles: [Advisor]
    code: 200
    input: []
    output: NeedsAssessment
    side_effects:
      - "NeedsAssessment DRAFT -> SUBMITTED"

  - method: POST
    path: "/assessments/{assessment_id}/review"
    description: "Peer-review a SUBMITTED assessment. decision is APPROVE or REQUEST_REVISION; an Advisor reviewer may not be the author."
    roles: [Advisor, PlatformAdmin]
    code: 200
    input: [decision, "revision_note?"]
    output: NeedsAssessment
    side_effects:
      - "APPROVE: status -> APPROVED, affordability_ceiling_cents computed, Inquiry ASSIGNED -> ASSESSED"
      - "REQUEST_REVISION: status -> REVISION_REQUESTED, revision_note stored, revision_count incremented"

  - method: POST
    path: "/matches"
    description: "Propose a community to an inquiry with an approved assessment."
    roles: [Advisor]
    code: 201
    input: [inquiry_id, community_id, care_level]
    output: Match
    side_effects:
      - "snapshots quoted_monthly_rate_cents from the resolved OPEN CommunityInventory"
      - "computes fit_score per calculations.match_fit_score"
      - "Inquiry ASSESSED -> MATCHING and match_count incremented"

  - method: GET
    path: "/matches/{match_id}"
    description: "Read one match, including its fit_score."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Match
    side_effects: []

  - method: GET
    path: "/matches"
    description: "List matches; filter by inquiry_id or community_id to walk the foreign keys."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["inquiry_id?", "community_id?", "status?", "limit?", "offset?"]
    output: Match[]
    side_effects: []

  - method: POST
    path: "/matches/{match_id}/shortlist"
    description: "Shortlist a PROPOSED match, or return a TOURED match to the shortlist for a repeat visit."
    roles: [Advisor, Family]
    code: 200
    input: []
    output: Match
    side_effects:
      - "Match PROPOSED -> SHORTLISTED or TOURED -> SHORTLISTED"

  - method: POST
    path: "/matches/{match_id}/decline"
    description: "Decline a match on the family's behalf."
    roles: [Advisor, Family]
    code: 200
    input: [reason_code]
    output: Match
    side_effects:
      - "Match -> DECLINED and Inquiry.match_count decremented"

  - method: POST
    path: "/matches/{match_id}/select"
    description: "Select a TOURED match as the family's choice."
    roles: [Advisor]
    code: 200
    input: []
    output: Match
    side_effects:
      - "Match TOURED -> SELECTED"

  - method: POST
    path: "/tours"
    description: "Book a tour for a SHORTLISTED match against the assigned advisor's calendar and the community's tour-slot capacity."
    roles: [Advisor]
    code: 201
    input: [match_id, scheduled_start, scheduled_end, mode]
    output: Tour
    side_effects:
      - "copies advisor_id from Inquiry.assigned_advisor_id and community_id from Match.community_id"
      - "Match SHORTLISTED -> TOUR_SCHEDULED and tour_round incremented"
      - "Inquiry MATCHING -> TOURING on the first tour"

  - method: GET
    path: "/tours/{tour_id}"
    description: "Read one tour."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: GET
    path: "/tours"
    description: "List tours; filter by match_id, advisor_id or community_id to walk the foreign keys."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["match_id?", "advisor_id?", "community_id?", "status?", "limit?", "offset?"]
    output: Tour[]
    side_effects: []

  - method: POST
    path: "/tours/{tour_id}/complete"
    description: "Record a completed tour and the family's reaction."
    roles: [Advisor]
    code: 200
    input: [outcome_rating]
    output: Tour
    side_effects:
      - "Tour SCHEDULED -> COMPLETED and Match TOUR_SCHEDULED -> TOURED"

  - method: POST
    path: "/tours/{tour_id}/cancel"
    description: "Cancel a scheduled tour and free its community slot."
    roles: [Advisor, Family]
    code: 200
    input: [reason_code]
    output: Tour
    side_effects:
      - "Tour SCHEDULED -> CANCELLED and Match TOUR_SCHEDULED -> SHORTLISTED"

  - method: POST
    path: "/tours/{tour_id}/no-show"
    description: "Record that the family did not attend."
    roles: [Advisor]
    code: 200
    input: []
    output: Tour
    side_effects:
      - "Tour SCHEDULED -> NO_SHOW and Match TOUR_SCHEDULED -> SHORTLISTED"

  - method: POST
    path: "/placements"
    description: "Reserve a unit for a SELECTED match. expected_inventory_version is the OCC guard from §1.2.1 rule placement-create-stale-inventory."
    roles: [Advisor]
    code: 201
    input: [match_id, inventory_id, agreed_move_in_date, contracted_monthly_rate_cents, expected_inventory_version]
    output: Placement
    side_effects:
      - "computes estimated_fee_cents per the `estimated` variant of calculations.referral_fee"
      - "increments CommunityInventory.reserved_units by 1 and recomputes available_units"
      - "increments CommunityInventory.version by 1"
      - "sets residency_status = PENDING_MOVE_IN and billing_status = NOT_INVOICED"

  - method: GET
    path: "/placements/{placement_id}"
    description: "Read one placement, including both state axes and both fee variants."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: Placement
    side_effects: []

  - method: GET
    path: "/placements"
    description: "List placements; filter by inquiry_id, community_id, match_id or inventory_id to walk the foreign keys."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["inquiry_id?", "community_id?", "match_id?", "inventory_id?", "residency_status?", "billing_status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []

  - method: POST
    path: "/placements/{placement_id}/confirm-move-in"
    description: "Community confirms the resident moved in; drives the four-level cascade and drafts the referral invoice."
    roles: [CommunityManager]
    code: 200
    input: [actual_move_in_date, actual_care_level]
    output: Placement
    side_effects:
      - "computes final_fee_cents per the `final` variant of calculations.referral_fee"
      - "CommunityInventory reserved_units -1, occupied_units +1, available_units recomputed, version +1"
      - "creates a ReferralInvoice with status DRAFT; billing_status NOT_INVOICED -> INVOICE_DRAFTED"
      - "Inquiry TOURING -> PLACED; sibling Matches -> WITHDRAWN; ACTIVE CaseloadAssignment -> RELEASED; SCHEDULED Tours on withdrawn Matches -> CANCELLED"

  - method: POST
    path: "/placements/{placement_id}/confirm-residency"
    description: "Advisor confirms the resident is still in place after RESIDENCY_CONFIRM_DAYS (14) days."
    roles: [Advisor]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "residency_status MOVED_IN -> RESIDENT_CONFIRMED; billing_status is untouched"

  - method: POST
    path: "/placements/{placement_id}/move-out"
    description: "Community reports a move-out; drives the three-level clawback cascade."
    roles: [CommunityManager, PlatformAdmin]
    code: 200
    input: [move_out_date, reason_code]
    output: Placement
    side_effects:
      - "sets move_out_date and days_resided; CommunityInventory occupied_units -1, available_units recomputed, version +1"
      - "computes clawback_amount_cents per calculations.clawback_amount; when positive the ReferralInvoice -> CLAWED_BACK and billing_status -> CLAWED_BACK"
      - "appends a CLAWBACK FeeLedgerEntry and decrements Community.fee_balance_cents"

  - method: POST
    path: "/placements/{placement_id}/cancel"
    description: "Cancel a reservation that never converted; releases the held unit."
    roles: [Advisor, CommunityManager]
    code: 200
    input: [reason_code]
    output: Placement
    side_effects:
      - "residency_status PENDING_MOVE_IN -> CANCELLED"
      - "CommunityInventory reserved_units -1, available_units recomputed, version +1"

  - method: GET
    path: "/referral-invoices/{invoice_id}"
    description: "Read one referral invoice."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: ReferralInvoice
    side_effects: []

  - method: GET
    path: "/referral-invoices"
    description: "List referral invoices; filter by placement_id or community_id. This is the only discovery channel for the invoice created by the move-in cascade."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["placement_id?", "community_id?", "status?", "limit?", "offset?"]
    output: ReferralInvoice[]
    side_effects: []

  - method: POST
    path: "/referral-invoices/{invoice_id}/issue"
    description: "Issue a DRAFT invoice to the community and accrue the fee."
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: ReferralInvoice
    side_effects:
      - "appends an ACCRUAL FeeLedgerEntry of +final_fee_cents and increments Community.fee_balance_cents"
      - "Placement billing_status INVOICE_DRAFTED -> INVOICED"

  - method: POST
    path: "/referral-invoices/{invoice_id}/accept"
    description: "Community accepts an issued invoice."
    roles: [CommunityManager]
    code: 200
    input: []
    output: ReferralInvoice
    side_effects:
      - "ReferralInvoice ISSUED -> ACCEPTED"

  - method: POST
    path: "/referral-invoices/{invoice_id}/dispute"
    description: "Community disputes an issued invoice, claiming a different monthly rate."
    roles: [CommunityManager]
    code: 200
    input: [dispute_reason, claimed_rate_cents]
    output: ReferralInvoice
    side_effects:
      - "ReferralInvoice ISSUED -> DISPUTED"

  - method: POST
    path: "/referral-invoices/{invoice_id}/adjust"
    description: "Billing re-prices a disputed invoice and re-issues it, closing one negotiation round."
    roles: [BillingSpecialist]
    code: 200
    input: [adjusted_rate_cents, note]
    output: ReferralInvoice
    side_effects:
      - "recomputes final_fee_cents from adjusted_rate_cents via the `final` variant of calculations.referral_fee"
      - "appends an ADJUSTMENT FeeLedgerEntry for the signed delta and moves Community.fee_balance_cents by the same delta"
      - "ReferralInvoice DISPUTED -> ISSUED and adjustment_count incremented"

  - method: POST
    path: "/referral-invoices/{invoice_id}/pay"
    description: "Community pays an accepted invoice in full."
    roles: [CommunityManager]
    code: 200
    input: [amount_cents]
    output: ReferralInvoice
    side_effects:
      - "appends a PAYMENT FeeLedgerEntry of -amount_cents and decrements Community.fee_balance_cents"
      - "ReferralInvoice ACCEPTED -> PAID and Placement billing_status INVOICED -> PAID"

  - method: POST
    path: "/referral-invoices/{invoice_id}/void"
    description: "Compensating action for issue: writes the accrual back off and voids the invoice."
    roles: [BillingSpecialist]
    code: 200
    input: [reason_code]
    output: ReferralInvoice
    side_effects:
      - "appends a WRITE_OFF FeeLedgerEntry of -final_fee_cents and decrements Community.fee_balance_cents"
      - "ReferralInvoice ISSUED|DISPUTED -> VOIDED and Placement billing_status INVOICED -> VOIDED"

  - method: GET
    path: "/ledger-entries"
    description: "List fee ledger entries; filter by invoice_id, placement_id or community_id."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["invoice_id?", "placement_id?", "community_id?", "entry_type?", "limit?", "offset?"]
    output: FeeLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries/{entry_id}"
    description: "Read one fee ledger entry."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: FeeLedgerEntry
    side_effects: []

  - method: POST
    path: "/benefit-guidances"
    description: "Issue a VA / financial benefit estimate for an inquiry. expected_assessment_version is the OCC guard from §1.2.1 rule guidance-create-stale-assessment."
    roles: [BenefitsCounselor]
    code: 201
    input: [inquiry_id, benefit_type, expected_assessment_version]
    output: BenefitGuidance
    side_effects:
      - "computes unreimbursed_medical_cents, countable_income_cents and estimated_monthly_benefit_cents per calculations.va_benefit_estimate"
      - "the previous BenefitGuidance with status ISSUED for this assessment moves to SUPERSEDED"
      - "NeedsAssessment.benefit_offset_cents and affordability_ceiling_cents are recomputed"
      - "increments NeedsAssessment.version by 1"
      - "every Match of the inquiry with status PROPOSED or SHORTLISTED has fit_score recomputed"

  - method: GET
    path: "/benefit-guidances/{guidance_id}"
    description: "Read one benefit guidance."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: BenefitGuidance
    side_effects: []

  - method: GET
    path: "/benefit-guidances"
    description: "List benefit guidances; filter by inquiry_id, assessment_id or counselor_advisor_id."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["inquiry_id?", "assessment_id?", "counselor_advisor_id?", "status?", "limit?", "offset?"]
    output: BenefitGuidance[]
    side_effects: []

  - method: POST
    path: "/surveys"
    description: "Family submits the post-move-in satisfaction survey."
    roles: [Family]
    code: 201
    input: [placement_id, nps_score, care_rating, value_rating]
    output: SatisfactionSurvey
    side_effects:
      - "computes composite_score and days_after_move_in"
      - "recomputes Community.satisfaction_survey_count and Community.avg_satisfaction_score"

  - method: GET
    path: "/surveys/{survey_id}"
    description: "Read one satisfaction survey."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: SatisfactionSurvey
    side_effects: []

  - method: GET
    path: "/surveys"
    description: "List satisfaction surveys; filter by placement_id, respondent_family_id or community_id."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["placement_id?", "respondent_family_id?", "community_id?", "limit?", "offset?"]
    output: SatisfactionSurvey[]
    side_effects: []

  - method: GET
    path: "/caseload-assignments"
    description: "List caseload assignments; filter by advisor_id or inquiry_id."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: ["advisor_id?", "inquiry_id?", "status?", "limit?", "offset?"]
    output: CaseloadAssignment[]
    side_effects: []

  - method: GET
    path: "/caseload-assignments/{assignment_id}"
    description: "Read one caseload assignment."
    roles: [PlatformAdmin, Advisor, BenefitsCounselor, BillingSpecialist, CommunityManager, Family]
    code: 200
    input: []
    output: CaseloadAssignment
    side_effects: []

  - method: GET
    path: "/reports/advisor-caseload"
    description: "Caseload report: both load-index variants side by side for one advisor or a whole region."
    roles: [PlatformAdmin, Advisor]
    code: 200
    input: ["advisor_id?", "region_code?"]
    output: "{ advisor_id: string, active_caseload_count: integer, caseload_capacity: integer, headcount_load_index: number, weighted_load_index: number, total_active_assignments: integer }"
    side_effects: []

  - method: GET
    path: "/reports/community-referrals"
    description: "Referral report: accrued, paid, clawed-back and net recognized fees for one community."
    roles: [PlatformAdmin, BillingSpecialist, CommunityManager]
    code: 200
    input: ["community_id?"]
    output: "{ community_id: string, placement_count: integer, accrued_fee_cents: integer, payment_cents: integer, clawback_cents: integer, write_off_cents: integer, fee_balance_cents: integer, avg_satisfaction_score: number }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint, or an entity-backed actor is acting on a resource it does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "an Advisor reviews an assessment they authored, or a BenefitsCounselor issues guidance on an inquiry they are assigned to"
  - id: ERR_ADVISOR_NOT_VA_CERTIFIED
    http: 403
    condition: "the Advisor row behind the BenefitsCounselor role has is_va_certified == false"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, wrong type, illegal enum member, out-of-range integer, or malformed ISO date"
  - id: ERR_FAMILY_NOT_FOUND
    http: 404
    condition: "family_id does not resolve"
  - id: ERR_ADVISOR_NOT_FOUND
    http: 404
    condition: "advisor_id or to_advisor_id does not resolve"
  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "community_id does not resolve"
  - id: ERR_INVENTORY_NOT_FOUND
    http: 404
    condition: "inventory_id does not resolve"
  - id: ERR_INQUIRY_NOT_FOUND
    http: 404
    condition: "inquiry_id does not resolve"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "assessment_id does not resolve, or the inquiry has no NeedsAssessment when one is required"
  - id: ERR_MATCH_NOT_FOUND
    http: 404
    condition: "match_id does not resolve"
  - id: ERR_TOUR_NOT_FOUND
    http: 404
    condition: "tour_id does not resolve"
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "placement_id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id does not resolve"
  - id: ERR_GUIDANCE_NOT_FOUND
    http: 404
    condition: "guidance_id does not resolve"
  - id: ERR_SURVEY_NOT_FOUND
    http: 404
    condition: "survey_id does not resolve"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "entry_id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not resolve"
  - id: ERR_INQUIRY_INVALID_STATE
    http: 409
    condition: "the inquiry's status is not in the from-set of the requested transition"
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "the assessment's status is not in the from-set of the requested transition"
  - id: ERR_MATCH_INVALID_STATE
    http: 409
    condition: "the match's status is not in the from-set of the requested transition"
  - id: ERR_TOUR_INVALID_STATE
    http: 409
    condition: "the tour's status is not SCHEDULED"
  - id: ERR_PLACEMENT_INVALID_STATE
    http: 409
    condition: "the placement's residency_status or billing_status is not in the from-set of the requested transition"
  - id: ERR_INVOICE_INVALID_STATE
    http: 409
    condition: "the invoice's status is not in the from-set of the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_inventory_version != CommunityInventory.version, or expected_assessment_version != NeedsAssessment.version"
  - id: ERR_COMMUNITY_NOT_ACTIVE
    http: 409
    condition: "the referenced community's status is SUSPENDED or TERMINATED"
  - id: ERR_ASSESSMENT_NOT_APPROVED
    http: 409
    condition: "the inquiry's NeedsAssessment status is not APPROVED"
  - id: ERR_PLACEMENT_NOT_MOVED_IN
    http: 409
    condition: "an invoice is issued while its placement's residency_status is still PENDING_MOVE_IN"
  - id: ERR_GUIDANCE_NOT_ELIGIBLE
    http: 409
    condition: "benefit guidance is requested for an assessment whose va_eligible is false"
  - id: ERR_DUPLICATE_INVENTORY
    http: 409
    condition: "a CommunityInventory already exists for the same (community_id, care_level)"
  - id: ERR_DUPLICATE_MATCH
    http: 409
    condition: "a Match already exists for the same (inquiry_id, community_id) with status not in {DECLINED, WITHDRAWN}"
  - id: ERR_PLACEMENT_EXISTS
    http: 409
    condition: "the inquiry already has a Placement with residency_status not in {CANCELLED, MOVED_OUT}"
  - id: ERR_DUPLICATE_SURVEY
    http: 409
    condition: "a SatisfactionSurvey already exists for this placement"
  - id: ERR_CARE_LEVEL_UNAVAILABLE
    http: 409
    condition: "no OPEN CommunityInventory exists for (community_id, care_level)"
  - id: ERR_ADVISOR_NOT_ELIGIBLE
    http: 409
    condition: "the explicitly named advisor is not ACTIVE or serves a different region_code than the inquiry"
  - id: ERR_NO_ELIGIBLE_ADVISOR
    http: 409
    condition: "auto-assignment found an empty candidate pool"
  - id: ERR_DISPUTE_LIMIT_EXCEEDED
    http: 409
    condition: "invoice.adjustment_count has already reached MAX_DISPUTE_ROUNDS (2)"
  - id: ERR_TOUR_OUTSIDE_HOURS
    http: 422
    condition: "tour duration outside [30, 180] minutes, scheduled_end not after scheduled_start, or scheduled_start before the logical clock"
  - id: ERR_TOUR_SLOT_CONFLICT
    http: 409
    condition: "the community already has tour_slot_capacity SCHEDULED tours whose closed intervals intersect the candidate closed interval"
  - id: ERR_ADVISOR_SCHEDULE_CONFLICT
    http: 409
    condition: "the assigned advisor already has a SCHEDULED tour within TRAVEL_BUFFER_MINUTES of the candidate interval"
  - id: ERR_MOVE_IN_DATE_INVALID
    http: 422
    condition: "target_move_in_date is before the logical clock's date, or actual_move_in_date is after it"
  - id: ERR_RESIDENCY_CONFIRM_TOO_EARLY
    http: 409
    condition: "residency confirmation attempted fewer than RESIDENCY_CONFIRM_DAYS (14) days after actual_move_in_date"
  - id: ERR_SURVEY_TOO_EARLY
    http: 409
    condition: "a survey is submitted fewer than SURVEY_ELIGIBLE_DAYS (30) days after actual_move_in_date"
  - id: ERR_MOVE_OUT_DATE_INVALID
    http: 422
    condition: "move_out_date is before actual_move_in_date or after the logical clock's date"
  - id: ERR_ADVISOR_CASELOAD_FULL
    http: 409
    condition: "advisor.active_caseload_count is already equal to or greater than advisor.caseload_capacity"
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "the resolved inventory's monthly_rate_cents is strictly greater than the assessment's affordability_ceiling_cents"
  - id: ERR_NO_UNITS_AVAILABLE
    http: 409
    condition: "the chosen CommunityInventory has available_units == 0"
  - id: ERR_INVENTORY_UNDER_ALLOCATED
    http: 409
    condition: "a PATCH would set total_units below reserved_units + occupied_units"
  - id: ERR_INVOICE_AMOUNT_MISMATCH
    http: 422
    condition: "the payment amount_cents does not exactly equal invoice.final_fee_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations staff: reference data, advisor assignment, logical clock, reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /advisors"
      - "PATCH /advisors/{advisor_id}"
      - "POST /communities"
      - "PATCH /communities/{community_id}"
      - "POST /inquiries/{inquiry_id}/assign"
      - "POST /inquiries/{inquiry_id}/reassign"
    shared_operations:
      - "POST /inventories, PATCH /inventories/{inventory_id} (with CommunityManager)"
      - "POST /families (with Advisor)"
      - "POST /inquiries (with Advisor, Family)"
      - "POST /inquiries/{inquiry_id}/hold, /resume, /close (with Advisor)"
      - "POST /assessments/{assessment_id}/review (with Advisor)"
      - "POST /placements/{placement_id}/move-out (with CommunityManager)"
      - "GET /reports/advisor-caseload (with Advisor), GET /reports/community-referrals (with BillingSpecialist, CommunityManager)"
      - "all GET read endpoints"

  - name: Advisor
    description: "Placement advisor who owns a caseload of inquiries and drives assessment, matching, touring and placement."
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "POST /assessments"
      - "PATCH /assessments/{assessment_id}"
      - "POST /assessments/{assessment_id}/submit"
      - "POST /matches"
      - "POST /matches/{match_id}/select"
      - "POST /tours"
      - "POST /tours/{tour_id}/complete"
      - "POST /tours/{tour_id}/no-show"
      - "POST /placements"
      - "POST /placements/{placement_id}/confirm-residency"
    shared_operations:
      - "POST /families (with PlatformAdmin)"
      - "POST /inquiries (with PlatformAdmin, Family)"
      - "POST /inquiries/{inquiry_id}/hold, /resume, /close (with PlatformAdmin)"
      - "POST /assessments/{assessment_id}/review (with PlatformAdmin) — never on an assessment they authored"
      - "POST /matches/{match_id}/shortlist, /decline (with Family)"
      - "POST /tours/{tour_id}/cancel (with Family)"
      - "POST /placements/{placement_id}/cancel (with CommunityManager)"
      - "GET /reports/advisor-caseload (with PlatformAdmin)"
      - "all GET read endpoints"

  - name: BenefitsCounselor
    description: "VA-certified advisor acting in a financial-guidance capacity; X-User-ID is an Advisor id whose is_va_certified is true."
    identity: "entity_backed:Advisor"
    exclusive_operations:
      - "POST /benefit-guidances"
    shared_operations:
      - "all GET read endpoints"

  - name: BillingSpecialist
    description: "Revenue operations: issues, adjusts and voids referral invoices. Never accepts, disputes or pays them."
    identity: "opaque"
    exclusive_operations:
      - "POST /referral-invoices/{invoice_id}/issue"
      - "POST /referral-invoices/{invoice_id}/adjust"
      - "POST /referral-invoices/{invoice_id}/void"
    shared_operations:
      - "GET /reports/community-referrals (with PlatformAdmin, CommunityManager)"
      - "all GET read endpoints"

  - name: CommunityManager
    description: "Operator of one senior-living community; X-User-ID equals that Community's id."
    identity: "entity_backed:Community"
    exclusive_operations:
      - "POST /placements/{placement_id}/confirm-move-in"
      - "POST /referral-invoices/{invoice_id}/accept"
      - "POST /referral-invoices/{invoice_id}/dispute"
      - "POST /referral-invoices/{invoice_id}/pay"
    shared_operations:
      - "POST /inventories, PATCH /inventories/{inventory_id} (with PlatformAdmin)"
      - "POST /placements/{placement_id}/move-out (with PlatformAdmin)"
      - "POST /placements/{placement_id}/cancel (with Advisor)"
      - "GET /reports/community-referrals (with PlatformAdmin, BillingSpecialist)"
      - "all GET read endpoints"

  - name: Family
    description: "The enquiring household; X-User-ID equals that Family's id."
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /surveys"
    shared_operations:
      - "POST /inquiries (with PlatformAdmin, Advisor)"
      - "POST /matches/{match_id}/shortlist, /decline (with Advisor)"
      - "POST /tours/{tour_id}/cancel (with Advisor)"
      - "all GET read endpoints"
