        grounds: ["concurrency_rules[retire-asset-stale-asset]", entities.Asset.fields.version]
        distinguishing_aspect: "OCC happy path: retiring with the current expected_asset_version succeeds, status RETIRED, and Asset.version increments by exactly 1."
        test_recipe:
          setup: ["an OPERATIONAL asset with no active work orders"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site OK", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset OK", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id, av: $.data.version }
          trigger:
            - call: "POST /assets/${aid}/retire"
              payload: { expected_asset_version: "${av}" }
              as: MaintenanceManager
              captures: { st: $.data.status, newv: $.data.version }
          assert:
            - "Asset.${aid}.status == RETIRED"
            - "Asset.${aid}.version == 2 (incremented by exactly 1 from the create version 1)"

      - name: derived_reserved_qty_reconciled_after_release
        claim_type: derived_field_reconciliation
        grounds: [entities.SparePart.fields.reserved_qty]
        distinguishing_aspect: "derived reserved_qty stays consistent with source rows: after reserving 3 then 2 (reserved_qty 5) and releasing the 3-unit reservation, reserved_qty reconciles to 2."
        test_recipe:
          setup: ["SparePart on_hand 10; UNASSIGNED work order with two reservations qty 3 and qty 2"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site DF", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "DF-1", name: "DF Part", on_hand_qty: 10, unit_cost_cents: 100 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset DF", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 3, expected_spare_part_version: "${pv0}" }
              as: InventoryClerk
              captures: { r1: $.data.id }
            - call: "GET /spare-parts/${pid}"
              as: InventoryClerk
              captures: { pv1: $.data.version }
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 2, expected_spare_part_version: "${pv1}" }
              as: InventoryClerk
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /reservations/${r1}/release"
              as: InventoryClerk
            - call: "GET /spare-parts/${pid}"
              as: InventoryClerk
              captures: { rq: $.data.reserved_qty }
          assert:
            - "SparePart.${pid}.reserved_qty == 2"
            - "SparePart.${pid}.on_hand_qty == 10 (still no debit)"

      - name: cancel_work_order_releases_reserved_parts_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.WorkOrder.UNASSIGNED_to_CANCELLED, entities.SparePart.fields.reserved_qty]
        distinguishing_aspect: "cancelling a work order with a RESERVED reservation cascades: reservation RELEASED, reserved_qty back to 0, on_hand_qty untouched (no commit ever occurred)."
        test_recipe:
          setup: ["UNASSIGNED work order with one RESERVED reservation qty 4 against a 10-unit part"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site CX", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "CX-1", name: "CX Part", on_hand_qty: 10, unit_cost_cents: 100 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset CX", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 4, expected_spare_part_version: "${pv}" }
              as: InventoryClerk
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /work-orders/${wid}/cancel"
              as: Planner
              captures: { es: $.data.execution_status }
            - call: "GET /spare-parts/${pid}"
              as: InventoryClerk
              captures: { rq: $.data.reserved_qty, oh: $.data.on_hand_qty }
          assert:
            - "WorkOrder.${wid}.execution_status == CANCELLED"
            - "SparePart.${pid}.reserved_qty == 0"
            - "SparePart.${pid}.on_hand_qty == 10"

      - name: scheduled_window_touching_endpoints_allowed
        claim_type: scheduled_actions
        grounds: ["validations[priority=20]", entities.WorkOrder.fields.scheduled_start]
        distinguishing_aspect: "closed/exclusive-end semantics: a technician's second window starting exactly when the first ends (11:00 == 11:00) does NOT overlap and is accepted."
        test_recipe:
          setup: ["technician with one window 09:00..11:00 booked; a second assigned work order"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site TW", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Ttw", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset TW1", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { a1: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset TW2", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { a2: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${a1}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${w1}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${w1}/schedule-window"
              payload: { scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Planner
            - call: "POST /work-orders"
              payload: { asset_id: "${a2}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { w2: $.data.id }
            - call: "POST /work-orders/${w2}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${w2}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
          trigger:
            - call: "POST /work-orders/${w2}/schedule-window"
              payload: { scheduled_start: "2026-06-02T11:00:00Z", scheduled_end: "2026-06-02T13:00:00Z" }
              as: Planner
              captures: { ss: $.data.scheduled_start }
          assert:
            - "response status 200"
            - "WorkOrder.${w2}.scheduled_start == 2026-06-02T11:00:00Z (touching window accepted)"

  # =========================================================================
  # Consistency model — immediate
  # =========================================================================
  - section: consistency_model
    instances:
      - name: close_cascade_visible_in_same_response_immediate
        claim_type: immediate_consistency
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_CLOSED, entities.Site.fields.budget_spent_cents]
        distinguishing_aspect: "immediate consistency: after close, the same transaction's cascade (budget charge) is visible — Site.budget_spent_cents reflects the just-closed work order's cost on the immediately-following read."
        test_recipe:
          setup: ["a non-warranty closed work order actual_cost_cents 70,000 on a site"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MaintenanceManager
            - call: "POST /sites"
              payload: { name: "Site IM", maintenance_budget_cents: 100000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tim", skill_level: "SENIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset IM", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "MAJOR", estimated_labor_hours: 2 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
            - call: "POST /work-orders/${wid}/start"
              as: Technician
              as_user_id: "${tid}"
            - call: "POST /work-orders/${wid}/close"
              payload: { actual_cost_cents: 70000 }
              as: Technician
              as_user_id: "${tid}"
          trigger:
            - call: "GET /sites/${sid}"
              as: MaintenanceManager
              captures: { spent: $.data.budget_spent_cents }
          assert:
            - "Site.${sid}.budget_spent_cents == 70000"
