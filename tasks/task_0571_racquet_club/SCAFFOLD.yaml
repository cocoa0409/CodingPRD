      - { name: full_name, type: string, source: input, description: "Coaching pro name" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Pro coaching rate per hour, integer cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "Availability state; system-initialized", default: ACTIVE, constraints: "ACTIVE" }

  - name: Lesson
    parent: null
