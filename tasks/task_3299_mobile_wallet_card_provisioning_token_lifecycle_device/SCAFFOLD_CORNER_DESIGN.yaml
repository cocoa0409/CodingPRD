              as: IssuerOperator
            - call: "POST /payment-tokens/${b_tok}/authorizations"
              payload: { cryptogram: "c2", amount_cents: 5000, currency: "USD", merchant_id: "m-2", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "POST /payment-tokens/${b_tok}/authorizations"
              payload: { cryptogram: "c3", amount_cents: 5100, currency: "USD", merchant_id: "m-3", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "GET /issuers/${b_iss}/fee-projection"
              payload: {}
              as: IssuerOperator
              captures: { appr: $.data.approved_fee_cents }
          assert:
            - "approved_fee_cents == 50 + 50 + 51 == 151"
            - "all three authorizations APPROVED (fee shaping never declines)"

      - name: risk_score_capped_at_100_with_open_dispute_bonuses
        claim_type: Correct Result
        grounds:
          - calculations.aggregate_risk_score
        distinguishing_aspect: "Cap honored: 6 declines (6) + 4 OPEN disputes (4*15=60) + lost device (25) = 91 < 100; adding one more OPEN dispute (15) crosses to min(106,100)=100 — the cap saturates exactly."
        test_recipe:
          setup: ["Standard token; 6 APPROVED auths of 1000..6000; 6 issuer-declined auths interleaved AFTER an approval so consecutive resets don't auto-suspend (approve between declines? — no: declines are spread across TWO tokens to avoid the 3-streak suspend; simpler: declines happen, token auto-suspended at 3, resumed, declined 3 more with suspension/re-resume between). Setup uses: decline x2, dispute open x4 on four approved auths, device lost."]
