  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: permit_revision_loop_blocks_fourth_revision_round
        grounds:
          - state_machines.DevelopmentPermit.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.DevelopmentPermit.REVISION_REQUIRED_to_UNDER_REVIEW
          - validations[priority=71]
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The permit traverses the UNDER_REVIEW <-> REVISION_REQUIRED cycle three times,
          reaching revision_round 3; the fourth REQUEST_REVISION is rejected with
          ERR_REVISION_LIMIT_EXCEEDED and the permit stays in UNDER_REVIEW, proving the loop
          is bounded rather than open-ended.
        test_recipe:
          setup:
            - "Community with freeboard_ft 1.5, EFFECTIVE AE panel with BFE 12.0, one parcel, one RESIDENTIAL structure."
            - "A permit that has been submitted and pushed round-trip three times, so revision_round == 3 and status == UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
