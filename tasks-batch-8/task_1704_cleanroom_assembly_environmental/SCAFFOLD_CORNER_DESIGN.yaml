  # ===========================================================================
  # Section: roles — RBAC denial for exclusive operations.
  # ===========================================================================
  - section: roles
    instances:
      - name: environment_tech_cannot_create_room
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "validations[priority=2]"
        distinguishing_aspect: "EnvironmentTech calling POST /cleanroom/rooms (QA-exclusive) is denied with 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-RB1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: EnvironmentTech
              captures: { err_rb1: $.data.error_id }
          assert:
            - "HTTP 403 error_id == ERR_FORBIDDEN"

      - name: production_operator_cannot_approve_investigation
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "validations[priority=2]"
        distinguishing_aspect: "ProductionOperator calling POST /cleanroom/investigations/{id}/approve (QA-exclusive) is denied with 403 ERR_FORBIDDEN even when the investigation is in DRAFT."
        test_recipe:
          setup: ["Room CR-RB2 with ACTIVE VIABLE point; excursion OPEN with DRAFT investigation"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
