  # ---- System / test-driving ----
  - method: POST
    path: /api/_clock/set_current_utc
    description: "Set the logical clock (ISO8601). Server startup default is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock; all 'now' semantics (received_at, deadlines, windows, expiry, retention) read this clock. Does not itself fire transitions - use POST /api/cases/{id}/reconcile per case."
    roles: [CaseAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock updated"]
  - method: POST
    path: /api/records/purge-run
    description: "Retention sweep: delete CaseEvent rows belonging to cases in a terminal state whose closed_at + RETENTION_YEARS(7 years) <= logical clock (inclusive boundary); cases and statistics are preserved"
    roles: [CaseAdministrator]
    code: 200
    input: []
    output: { purged_event_count: integer, purged_case_ids: "string[]" }
    side_effects: ["eligible CaseEvent rows permanently deleted (RETENTION_YEARS = 7, inclusive: closed_at + 7y <= now)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID, or entity-backed role id not found in PartyProfile" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not in the endpoint's roles list" }
  - { id: ERR_CASE_ACCESS_DENIED, http: 403, condition: "Party/Advisor read of a case (or case descendant) they are not affiliated with" }
  - { id: ERR_SUPPORTIVE_MEASURE_CONFIDENTIAL, http: 403, condition: "Party single-read of a supportive measure scoped to the other party only" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve (left-to-right path validation)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema failure: missing required field, wrong type, unknown enum member, empty non-empty array, malformed datetime" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Entity not in a from-state for the requested transition; terminal states reject all transitions" }
  - { id: ERR_CASE_ALREADY_TERMINAL, http: 409, condition: "Child mutation attempted on a case in CLOSED, REFERRED_TO_CONDUCT, or RESOLVED_INFORMAL" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Assignee already holds another official function on this case, or was previously recused for bias on this case" }
  - { id: ERR_OFFICIAL_IS_CASE_PARTY, http: 422, condition: "Assignee for an official function is the case complainant or respondent" }
  - { id: ERR_INFORMAL_RESOLUTION_PROHIBITED, http: 422, condition: "Informal resolution proposed where respondent role_type == EMPLOYEE and complainant role_type == STUDENT" }
  - { id: ERR_ONLY_COMPLAINANT_MAY_FILE, http: 422, condition: "Non-complainant attempted to file the formal complaint" }
  - { id: ERR_JURISDICTION_REQUIREMENTS_UNMET, http: 422, condition: "confirm-jurisdiction with program-activity/US facts false or no Title IX category present" }
  - { id: ERR_ADVISOR_REQUIRED, http: 422, condition: "Hearing convene while either party lacks an ACTIVE AdvisorAppointment" }
  - { id: ERR_QUESTIONER_NOT_CASE_ADVISOR, http: 422, condition: "Cross-exam question by non-advisor, advisor without ACTIVE appointment on the case, or target_side matching asker's own side" }
  - { id: ERR_ADVISOR_INELIGIBLE, http: 422, condition: "Advisor is the opposing party or a case official, or (university-appointed) lacks advisor_eligible" }
  - { id: ERR_STANDARD_OF_EVIDENCE_MISMATCH, http: 422, condition: "Issued standard_of_evidence differs from case.standard_of_evidence" }
  - { id: ERR_NOTICE_LEAD_TIME_INSUFFICIENT, http: 422, condition: "Event notice lead time below LEAD_DAYS (INTERVIEW 5d, HEARING 10d); also hearing scheduled_at - now < 10d" }
  - { id: ERR_NOTICE_ORDER_VIOLATION, http: 422, condition: "INTERVIEW notice created before any ALLEGATIONS notice exists on the case" }
  - { id: ERR_REVIEW_RESPONSE_LATE, http: 422, condition: "Review response after review_closes_at (strictly later than the inclusive close instant)" }
  - { id: ERR_REVIEW_WINDOW_OPEN, http: 422, condition: "Packet finalize while review window open and fewer than two party responses recorded" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal filed strictly after appeal_deadline (or dismissal deadline)" }
  - { id: ERR_HEARING_TIME_CONFLICT, http: 422, condition: "Decision-maker calendar overlap, buffer gap < 60 minutes, or scheduled_at not in the future" }
  - { id: ERR_DIRECTIVE_WINDOW_OVERLAP, http: 422, condition: "Directive half-open window overlaps an ACTIVE directive on a shared party scope without supersede_existing" }
  - { id: ERR_ACTIVE_PACKET_EXISTS, http: 409, condition: "Packet create while another packet on the case is DRAFT/RELEASED_FOR_REVIEW/REVIEW_CLOSED" }
  - { id: ERR_ACTIVE_HEARING_EXISTS, http: 409, condition: "Hearing create while another hearing on the case is non-terminal" }
  - { id: ERR_ACTIVE_INFORMAL_RESOLUTION_EXISTS, http: 409, condition: "Informal resolution proposed while another is PROPOSED/IN_PROGRESS on the case" }
  - { id: ERR_FORMAL_COMPLAINT_REQUIRED, http: 422, condition: "Informal resolution proposed without formal_complaint_signed" }
  - { id: ERR_INVESTIGATOR_ALREADY_ACTIVE, http: 409, condition: "Assignment proposed while another assignment on the case is ACTIVE" }
  - { id: ERR_NO_ACTIVE_INVESTIGATOR, http: 422, condition: "Evidence/packet action without an ACTIVE assignment held by the actor" }
  - { id: ERR_PENDING_QUESTIONS_REMAIN, http: 422, condition: "close-cross-exam with at least one PENDING CrossExamQuestion" }
  - { id: ERR_SANCTION_OUTSIDE_MATRIX, http: 422, condition: "Sanction selection type/duration outside final-tier bounds, selections present for non-RESPONSIBLE finding, or RESTITUTION below TIER_3" }
  - { id: ERR_DUPLICATE_ADVISOR, http: 409, condition: "Re-appointing the same advisor_id for a side already holding an ACTIVE appointment with that advisor" }
  - { id: ERR_NO_ADVISOR_AVAILABLE, http: 422, condition: "University-appointed advisor selector pool is empty" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "university_id or statistics year already exists; duplicate informal consent by same party" }
  - { id: ERR_DUPLICATE_RESPONSE, http: 409, condition: "Same party side submits a second review response on the same packet" }
  - { id: ERR_APPEAL_TARGET_INVALID, http: 422, condition: "Appeal target missing or not appealable (no ISSUED determination; case not DISMISSED; RESOLVED_INFORMAL; determination already FINAL/REVERSED/SUPERSEDED)" }
  - { id: ERR_APPEAL_OUTCOME_INCOMPATIBLE, http: 422, condition: "Outcome not allowed for appeal_target (REINSTATED only for DISMISSAL; REVERSED/REMANDED/SANCTION_MODIFIED only for DETERMINATION)" }
  - { id: ERR_REMAND_SCOPE_MISMATCH, http: 422, condition: "remand_scope incompatible with grounds, or resume target != case.remand_target" }
  - { id: ERR_PARTY_BINDING_MISMATCH, http: 422, condition: "Actor/party_side does not match the case's party binding for party-scoped actions" }
  - { id: ERR_NOT_HEARING_DECISION_MAKER, http: 422, condition: "Determination draft/issue, hearing convene/close-cross-exam, or question ruling by someone other than that hearing's decision-maker" }
  - { id: ERR_NOT_ASSIGNED_APPEAL_OFFICER, http: 422, condition: "Appeal decide attempted by an AppealOfficer other than the one assigned at begin-review" }
  - { id: ERR_RESTITUTION_ITEMS_REQUIRED, http: 422, condition: "RESTITUTION selection without items, or item amount_dollars <= 0" }
  - { id: ERR_STATISTICS_YEAR_INVALID, http: 422, condition: "Year outside 2000..2100, or amend without an existing published row" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_case_version differs from the case's current version on OCC-guarded creates" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: TitleIXCoordinator
    description: "Owns case triage, jurisdiction, dismissal, supportive measures, directives, investigator/appeal-officer assignment, informal resolution facilitation oversight, statistics publication"
    identity: "entity_backed:PartyProfile"
    exclusive_operations:
      - "POST /api/cases/{id}/begin-jurisdiction-review | confirm-jurisdiction | dismiss | finalize-closure | resume"
      - "POST /api/cases/{id}/supportive-measures, POST /api/supportive-measures/{id}/terminate"
      - "POST /api/cases/{id}/no-contact-directives, POST /api/no-contact-directives/{id}/lift"
      - "POST /api/directive-violations/{id}/substantiate | mark-unsubstantiated"
      - "POST /api/cases/{id}/investigator-assignments"
      - "POST /api/cases/{id}/hearings"
      - "POST /api/cases/{id}/informal-resolutions, POST /api/informal-resolutions/{id}/resolve"
      - "POST /api/appeals/{id}/begin-review"
      - "POST /api/annual-statistics/{year}/publish | amend"
      - "POST /api/cases/{id}/advisor-appointments/appoint-university"
    shared_operations:
      - "case/child reads, POST /api/cases, POST /api/cases/{id}/notices, POST /api/cases/{id}/reconcile, POST /api/cases/{id}/advisor-appointments, POST /api/advisor-appointments/{id}/withdraw, POST /api/investigator-assignments/{id}/recuse, POST /api/sanctions/{id}/mark-complete, POST /api/hearings/{id}/cancel, POST /api/no-contact-directives/{id}/violations"
  - name: Investigator
    description: "Gathers and rules on evidence, builds/releases/finalizes the evidence packet and investigative report"
    identity: "entity_backed:PartyProfile"
    exclusive_operations:
      - "POST /api/evidence-items/{id}/begin-review | rule-relevance"
      - "POST /api/cases/{id}/evidence-packets, POST /api/evidence-packets/{id}/attach-report | release | finalize | withdraw"
      - "POST /api/investigator-assignments/{id}/accept | decline"
    shared_operations:
      - "case/child reads, POST /api/cases/{id}/notices, POST /api/cases/{id}/evidence-items, POST /api/investigator-assignments/{id}/recuse"
  - name: DecisionMaker
    description: "Runs the live hearing, rules on cross-examination relevance, drafts and issues the determination"
    identity: "entity_backed:PartyProfile"
    exclusive_operations:
      - "POST /api/hearings/{id}/convene | adjourn | reconvene | close-cross-exam"
      - "POST /api/cross-exam-questions/{id}/rule"
      - "POST /api/cases/{id}/determinations, POST /api/determinations/{id}/issue"
    shared_operations:
      - "case/child reads, POST /api/cases/{id}/notices, POST /api/hearings/{id}/cancel"
  - name: AppealOfficer
    description: "Decides appeals; must be segregation-clean per case"
    identity: "entity_backed:PartyProfile"
    exclusive_operations:
      - "POST /api/appeals/{id}/decide"
    shared_operations:
      - "case/child reads"
  - name: Party
    description: "Complainant or respondent on a case; identity-bound to the case's party fields"
    identity: "entity_backed:PartyProfile"
    exclusive_operations:
      - "POST /api/cases/{id}/file-formal-complaint (complainant only)"
      - "POST /api/cases/{id}/appeals"
      - "POST /api/evidence-packets/{id}/review-responses"
      - "POST /api/informal-resolutions/{id}/consent | withdraw"
    shared_operations:
      - "affiliated case/child reads, POST /api/cases/{id}/evidence-items, POST /api/cases/{id}/advisor-appointments (own side), POST /api/advisor-appointments/{id}/withdraw, POST /api/no-contact-directives/{id}/violations"
  - name: Advisor
    description: "Advisor of choice or university-appointed; conducts cross-examination"
    identity: "entity_backed:PartyProfile"
    exclusive_operations:
      - "POST /api/hearings/{id}/cross-exam-questions"
    shared_operations:
      - "affiliated case/child reads, POST /api/advisor-appointments/{id}/withdraw"
  - name: CaseAdministrator
    description: "Operational staff: directory management, logical clock, retention purge, reconcile"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/records/purge-run"
      - "POST /api/party-profiles"
    shared_operations:
      - "case/child reads, POST /api/cases, POST /api/cases/{id}/reconcile, filtered-list reads"
