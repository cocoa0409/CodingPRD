      - name: artist_half_open_sessions_allow_adjacency_reject_overlap
        grounds:
          - validations[priority=20]
          - errors[ERR_ARTIST_SESSION_OVERLAP]
          - entities.ProcedureLog.fields.started_at
          - entities.ProcedureLog.fields.ended_at
        distinguishing_aspect: |
          Interval semantics here are HALF-OPEN [started_at, ended_at) with no buffer, on the
          Artist resource rather than the Establishment: a session starting exactly when the
          previous one ended is accepted, which the buffered closed-interval rule on
          inspections would have rejected.
        test_recipe:
          setup:
            - "An ACTIVE Establishment with operating_posture OPEN and one ACTIVE Artist holding unexpired bloodborne-pathogen training."
          setup_api_calls:
            - call: "POST /body-art/establishments"
