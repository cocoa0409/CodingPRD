            - "hop 1: GET /provider-referrals?patient_id=${pat_cb} returns total_count == 1, data[0].status == \"OPEN\" and data[0].expires_at == \"2027-01-28T00:00:00Z\""
            - "hop 2: GET /device-orders/${ord_cb} returns data.fulfillment_status == \"MEDICAL_HOLD\" and data.medical_hold_reason == \"MANDATORY_RED_FLAG\""
            - "hop 2: GET /device-orders/${ord_cb} returns data.payment_status == \"PENDING_AUTH\" (the payment dimension is untouched)"
