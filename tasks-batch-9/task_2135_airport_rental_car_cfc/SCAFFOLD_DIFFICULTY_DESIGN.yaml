              payload: { agreement_id: "${agr_a_id}", report_id: "${rep_id}", remittance_basis: "FINAL" }
              as: ConcessionaireOperator
              as_user_id: "${conc_a_id}"
              captures: { rem_id: $.data.id }
            - call: "POST /rac/cfc-remittances/${rem_id}/receive"
              payload: { amount_received_cents: 2000000 }
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "POST /rac/debt-service-obligations/${ob_id}/pay"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
            - call: "GET /rac/capital-projects/${proj_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: { proj_v: $.data.version }
