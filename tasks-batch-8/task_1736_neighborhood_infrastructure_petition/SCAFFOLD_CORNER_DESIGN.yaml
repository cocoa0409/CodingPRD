    grounds:
    - complexity_profile.consistency_model
    distinguishing_aspect: 'Immediate consistency: the payment response itself carries the waterfall split, and a read in the same logical instant shows the mutated invoice (PARTIALLY_PAID, paid_cents 5,000)
      and assessment (principal_balance 99,000).'
