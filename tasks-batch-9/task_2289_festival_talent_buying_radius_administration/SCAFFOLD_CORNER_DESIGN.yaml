      - name: budget_summary_computed_read_reconciles_ledgers_after_a_tier_closes
        claim_type: computed_read
        grounds:
          - endpoints[GET /festival-ops/festivals/{id}/budget-summary]
          - calculations.budget_commitment_conservation
          - entities.BudgetTier.fields.status
        distinguishing_aspect: |
          The summary is a pure reconciliation with no stored counterpart, so it has to
          agree with two independent recomputations at once. The fixture closes a tier
          by slot exhaustion rather than by money (1 of 1 slots used at 1200000 of a
          2000000 allocation), which both splits open_tier_count from closed_tier_count
          and fires CASCADE-1 hop 4, superseding the sibling HEADLINER offer that was
          still ISSUED.
        test_recipe:
          setup:
            - "Festival with talent_budget_cents 4000000 and contingency_reserve_pct 0.00, tiers HEADLINER 0.50 with max_slots 1 and MID_CARD 0.50 with max_slots 5, allocated to 2000000 each."
            - "Two draw_score 48 acts in different genres (Nova Kade ELECTRONIC, Vela Roan ROCK) each holding an ISSUED HEADLINER offer at guarantee 1200000 on a different event day."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 4000000, contingency_reserve_pct: 0.0 }
