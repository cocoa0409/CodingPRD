          - errors[ERR_PUNCH_CARD_EXHAUSTED]
        distinguishing_aspect: |
          Boundary on the punch-count metric via POST /range-sessions/{id}/participants: the 5th punch
          (punches_used == punches_total exactly) succeeds and flips the card EXHAUSTED; the 6th attempt
          is rejected ERR_PUNCH_CARD_EXHAUSTED — equality is the legal edge, not the violation.
