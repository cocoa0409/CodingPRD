              as: BillingAnalyst
              captures: { inv_min_id: $.data.id, inv_min_total: $.data.total_amount, inv_min_flag: $.data.minimum_bill_applied }
          assert:
            - "Invoice.${inv_min_id}.billed_energy_mwh == 4.000"
