        distinguishing_aspect: |
          Depth-6 chain from POST /amendment-proposals/{id}/reopen where each link is
          caused by the previous link: L1 review_status leaves APPROVED -> L2 the ACCEPTED
          analysis is SUPERSEDED because analysis_status went STALE -> L3 the certified
          cost is cleared because no ACCEPTED analysis remains -> L4 the cycle ledger is
          compensated because the certified figures were cleared -> L5 the DRAFT rule's
          schedule is recomputed because the cycle backlog changed (tier MEDIUM -> SMALL,
          notice 180 -> 120) -> L6 the cycle reverts RULEMAKING -> DELIBERATION because the
          compound gate no longer holds. This is the reopen trigger, not the withdrawal
          trigger of the sibling instance.
