  - section: errors
    instances:

      - name: inspection_trip_not_held_and_spec_not_released_are_both_triggerable
        claim_type: Violation → Error
        grounds:
          - validations[priority=25]
          - validations[priority=27]
          - errors.ERR_INSPECTION_TRIP_NOT_HELD
          - errors.ERR_SPEC_NOT_RELEASED
        distinguishing_aspect: |
          A change order may be DRAFTED against a merely SCHEDULED trip but cannot be
          SUBMITTED until that trip is HELD (409 ERR_INSPECTION_TRIP_NOT_HELD), and an
          award against an UNDER_REVIEW specification is 409 ERR_SPEC_NOT_RELEASED —
          the two catalog entries with no other home in this design.
        test_recipe:
          setup:
            - "one ACTIVE program with a RELEASED spec (for the unit) and a second spec left UNDER_REVIEW"
            - "one UnitOrder with a SCHEDULED PRE_CONSTRUCTION trip and a DRAFT ChangeOrder pinned to it"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Catalog program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
