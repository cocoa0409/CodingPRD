              as: GrowerManager
              as_user_id: "${org_id}"
              captures: { plan2_id: $.data.id }
            - call: "POST /agdata/data-plans/${plan2_id}/activate"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
            - call: "POST /agdata/machines/${machine2_id}/activate"
              payload: {}
              as: DealerTechnician
              as_user_id: "${dealer_id}"
            - *d_pkg
            - *d_pkg_pub
            - *d_delivery
            - call: "POST /agdata/update-deliveries"
              payload: { machine_id: "${machine2_id}", package_id: "${pkg_id}" }
              as: PlatformAdmin
              captures: { delivery2_id: $.data.id, ticket2_id: $.data.consent_ticket_id }
            - call: "POST /agdata/consent-tickets/${ticket2_id}/grant"
              payload: {}
              as: GrowerManager
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /agdata/software-packages/${pkg_id}/withdraw"
              payload: {}
