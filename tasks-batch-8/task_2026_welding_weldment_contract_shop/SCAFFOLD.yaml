  - method: GET
    path: "/weld-shop/shops/{id}/ndt-vendors"
    description: "List NDT vendors"
    roles: [Any]
    code: 200
    input: []
    output: "NDTVendor[]"
    side_effects: []

  # ---------- Ovens ----------
  - method: POST
    path: "/weld-shop/shops/{id}/ovens"
