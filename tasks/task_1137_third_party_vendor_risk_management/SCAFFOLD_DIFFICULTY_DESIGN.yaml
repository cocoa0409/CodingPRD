              payload: { financial_review_score: 70, security_review_score: 70, compliance_review_score: 70, financial_reviewer_id: "u_f9", security_reviewer_id: "u_s9", compliance_reviewer_id: "u_c9" }
              as: VendorRelationshipManager
              captures: { p_cyc: $.data.id }
            - call: "POST /tprm/due-diligence-packages/${p_cyc}/submit"
              payload: {}
              as: VendorRelationshipManager
            - call: "POST /tprm/due-diligence-packages/${p_cyc}/begin-review"
              payload: {}
              as: RiskOfficer
            - call: "POST /tprm/due-diligence-packages/${p_cyc}/reject"
              payload: {}
