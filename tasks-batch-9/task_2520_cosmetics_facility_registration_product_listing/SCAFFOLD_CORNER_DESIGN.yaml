          assert:
            - "${c0} == 0, ${ok0} == true and ${sell0} == false — a vacuous required set is complete, yet the listing is still not marketable"
            - "${c1} == 1 and ${ok1} == false after the undisclosed 0.0020 LEAVE_ON allergen"
            - "${c2} == 1 and ${ok2} == false — the DISCLOSED 0.0050 allergen is above threshold but satisfies its requirement"
            - "${sell2} == false — the disclosure gap keeps the listing unmarketable even though only one row is undisclosed"
            - "GET /cosmetics/listings/${lst_id}/ingredients?is_fragrance_allergen=true returns both rows with disclosure_required == true"

      - name: delist_is_available_only_once_no_recall_is_open
        claim_type: conditional_action
        grounds:
          - endpoints[POST /cosmetics/listings/{id}/delist]
          - validations[priority=48]
        excluded_because:
          difficulty_instance: delist_gated_by_open_recall_then_permitted_after_effective_closure
          rationale: |
            The conditional availability of this endpoint — refused while a recall is open, accepted once
            the withdrawal closes effectively — is exactly what that §1.8 cross-entity instance drives,
            including the counter movements on both sides of the gate.

  - section: rbac
    instances:
      - name: four_cross_role_operations_are_denied_with_forbidden_role
        claim_type: role_denied
        grounds:
          - rbac.roles
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          Each role is pushed at another role's exclusive operation in one world: the registrant at the
          reviewer's registration-decision, the responsible-person agent at the operator's sweep, the
          enforcement officer at the agent's recall plan, and the reviewer at the officer's recall
          creation. All four answer ERR_FORBIDDEN_ROLE (403) and none of them advances any state.
        test_recipe:
          setup:
            - "one PENDING_REVIEW facility, one listing, and one open recall so that every denied call has a real target"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "MANDATORY_ORDER", hazard_class: "CLASS_I" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "REJECT" }
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { err_registrant: $.data.error_id }
            - call: "POST /cosmetics/_ops/compliance-sweep"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { err_agent: $.data.error_id }
            - call: "POST /cosmetics/recall-actions/${ra_id}/plan"
              payload: { corrective_summary: "Officer trying to file the firm's plan", distribution_depth: "RETAIL" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { err_officer: $.data.error_id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "MANDATORY_ORDER", hazard_class: "CLASS_II" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
              captures: { err_reviewer: $.data.error_id }
          assert:
            - "${err_registrant} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — and the facility stays REGISTERED (the REJECT never lands)"
            - "${err_agent} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — the sweep is SystemOperator-exclusive"
            - "${err_officer} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — plan filing is ResponsiblePersonAgent-exclusive"
            - "${err_reviewer} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 — recall initiation is EnforcementOfficer-exclusive"
            - "RecallAction ${ra_id}.status is still \"INITIATED\" with plan_submitted_at null"
            - "GET /cosmetics/listings/${lst_id}/recall-actions returns exactly one row — the reviewer's attempt created nothing"

      - name: facility_registrant_cannot_browse_the_regulator_wide_facility_registry
        claim_type: role_denied
        grounds:
          - endpoints[GET /cosmetics/facilities]
          - rbac.roles.FacilityRegistrant
        distinguishing_aspect: |
          A read is denied while the neighbouring read is allowed: the registry-wide
          GET /cosmetics/facilities excludes FacilityRegistrant (and ResponsiblePersonAgent) entirely,
          yet the same caller may still read its OWN facility by id — so the boundary is the collection,
          not the entity.
        test_recipe:
          setup:
            - "one REGISTERED facility owned by the calling registrant"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
          trigger:
            - call: "GET /cosmetics/facilities?registration_status=REGISTERED"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { err_list: $.data.error_id }
            - call: "GET /cosmetics/facilities/${fac_id}"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
              captures: { own_status: $.data.registration_status }
            - call: "GET /cosmetics/facilities?registration_status=REGISTERED"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { officer_first: "$.data[0].registration_status" }
          assert:
            - "${err_list} == \"ERR_FORBIDDEN_ROLE\" with HTTP 403 for the registrant's collection read"
            - "${own_status} == \"REGISTERED\" — the by-id read is permitted for the same caller"
            - "${officer_first} == \"REGISTERED\" — an EnforcementOfficer gets the collection with total_count == 1"

      - name: a_foreign_registrant_cannot_submit_someone_elses_facility
        claim_type: peer_roles
        grounds:
          - validations[priority=13]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - rbac.roles.FacilityRegistrant
        distinguishing_aspect: |
          Correct ROLE plus wrong IDENTITY is still a denial: a second FacilityRegistrant calling
          submit-registration on the first registrant's facility gets ERR_NOT_RESOURCE_OWNER (403), which
          is a different code from the role denial, and the victim facility stays in DRAFT until its own
          owner submits it.
        test_recipe:
          setup:
            - "two DRAFT facilities owned by two different registrants"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_a: $.data.id }
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Brightline Fill Line", owner_operator_name: "Brightline Beauty Holdings", facility_type: "PROCESSOR", country_code: "US", state_or_province: "OH" }
              as: FacilityRegistrant
              captures: { fac_b: $.data.id }
          trigger:
            - call: "POST /cosmetics/facilities/${fac_a}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_b}"
              captures: { err_owner: $.data.error_id }
            - call: "POST /cosmetics/facilities/${fac_a}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_a}"
              captures: { ok_status: $.data.registration_status }
          assert:
            - "${err_owner} == \"ERR_NOT_RESOURCE_OWNER\" with HTTP 403 — not ERR_FORBIDDEN_ROLE, since the role itself is correct"
            - "${ok_status} == \"PENDING_REVIEW\" — the rightful owner's identical call succeeds"
            - "Facility ${fac_b}.registration_status is still \"DRAFT\" — the impersonation attempt touched neither facility"

      - name: reclassification_is_a_shared_operation_for_reviewer_and_agent
        claim_type: peer_roles
        grounds:
          - endpoints[POST /cosmetics/adverse-events/{id}/reclassify]
          - rbac.roles.RegulatoryReviewer
          - rbac.roles.ResponsiblePersonAgent
        distinguishing_aspect: |
          The one write in the domain with two permitted roles: a RegulatoryReviewer downgrades a SERIOUS
          event to NON_SERIOUS and a ResponsiblePersonAgent then upgrades a second event to SERIOUS — both
          succeed on the same endpoint, while an EnforcementOfficer attempting the identical call is
          refused with ERR_FORBIDDEN_ROLE.
        test_recipe:
          setup:
            - "one REGISTERED facility, one listing, two events (one SERIOUS, one NON_SERIOUS), clock at 2026-08-05T08:00:00Z"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Aster Brands Inc", us_address_line: "12 Market St, Newark NJ 07102", contact_phone: "+1-202-555-0110", contact_email: "safety@aster.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Aster Blush Powder", category_code: "07A", product_form: "LEAVE_ON", label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "safety@aster.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Severe reaction, later reassessed downward", received_at: "2026-08-05T00:00:00Z", seriousness: "SERIOUS", outcome_code: "INFECTION" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { ae_down: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/adverse-events"
              payload: { event_description: "Mild irritation, later reassessed upward", received_at: "2026-08-05T00:00:00Z", seriousness: "NON_SERIOUS", outcome_code: "NONE" }
              as: ResponsiblePersonAgent
