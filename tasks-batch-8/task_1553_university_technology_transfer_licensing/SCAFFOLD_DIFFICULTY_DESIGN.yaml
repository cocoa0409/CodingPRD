# =============================================================================
# Task 1553: §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_earned_vs_minimum_trueup
        grounds:
          - calculations.tiered_earned_royalty
          - calculations.annual_minimum_true_up
          - state_machines.RoyaltyReport.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Same licensee sales data, two valid algorithms on the RoyaltyReport
          financial domain: an intra-year report owes earned-only (500000)
          while the year-closing report with identical sales owes
          earned + true-up (1500000) because the 2000000 annual minimum binds.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure fully gated to PATENT_PURSUED with one CONFIRMED inventor at 10000bp"
            - "NON_EXCLUSIVE license: effective 2026-01-01, expiration 2030-01-01, rate 500bp, minimum_annual_royalty_cents 2000000, swept to ACTIVE"
            - "Two reports of 10000000 cents sales each: R1 [2026-01-01, 2026-07-01) intra-year; R2 [2026-07-01, 2027-01-01) year-closing"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "Acme Corp", exclusivity: "NON_EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 2000000, upfront_fee_cents: 0 }, as: LicensingManager, captures: { lic_id: "$.data.id", lic_v: "$.data.version" } }
            - { call: "POST /tlo/licenses/${lic_id}/execute", payload: { expected_license_version: "${lic_v}" }, as: LicensingManager }
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/licenses/${lic_id}/royalty-reports", payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", reported_sales_cents: 10000000 }, as: LicensingManager, captures: { rep1_id: "$.data.id" } }
            - { call: "POST /tlo/royalty-reports/${rep1_id}/accept", payload: {}, as: FinanceOfficer, captures: { rep1_accepted: "$.data.accepted_royalty_cents" } }
            - { call: "POST /tlo/licenses/${lic_id}/royalty-reports", payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", reported_sales_cents: 10000000 }, as: LicensingManager, captures: { rep2_id: "$.data.id" } }
          trigger:
            - { call: "POST /tlo/royalty-reports/${rep2_id}/accept", payload: {}, as: FinanceOfficer, captures: { rep2_earned: "$.data.earned_royalty_cents", rep2_trueup: "$.data.true_up_cents", rep2_accepted: "$.data.accepted_royalty_cents" } }
          assert:
            - "RoyaltyReport.${rep1_id}.accepted_royalty_cents == 500000 (earned-only variant; 10000000 * 500/10000)"
            - "RoyaltyReport.${rep1_id}.true_up_cents == 0 (not year-closing)"
            - "RoyaltyReport.${rep2_id}.earned_royalty_cents == 500000"
            - "RoyaltyReport.${rep2_id}.true_up_cents == 1000000 (max(0, 2000000 - (500000+500000)))"
            - "RoyaltyReport.${rep2_id}.accepted_royalty_cents == 1500000, diverging from the 500000 earned-only figure for identical sales"
      - name: startup_equity_fixed_vs_antidilution
        grounds:
          - calculations.startup_equity_bp
          - state_machines.Startup.INCORPORATION_to_EQUITY_ISSUED
        distinguishing_aspect: |
          Same startup-formation question on the Startup equity domain (not the
          RoyaltyReport financial domain): FIXED grants exactly 500bp while
          ANTI_DILUTION on identical startup data at 2000000000 post-money
          yields floor(800 * 1000000000 / 2000000000) = 400bp.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure gated to PATENT_PURSUED with one CONFIRMED inventor"
            - "Two startups on the disclosure: SFIXED (equity_model FIXED) and SAD (ANTI_DILUTION)"
            - "Each startup has an APPROVED COI plan for the rostered inventor covering [2026-01-01, 2027-01-01); clock at 2026-08-01"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/startups", payload: { name: "FixedCo", founded_date: "2026-02-01T00:00:00Z", equity_model: "FIXED" }, as: TechTransferOfficer, captures: { su_f: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/startups", payload: { name: "DiluteCo", founded_date: "2026-02-01T00:00:00Z", equity_model: "ANTI_DILUTION" }, as: TechTransferOfficer, captures: { su_a: "$.data.id" } }
            - { call: "POST /tlo/startups/${su_f}/coi-plans", payload: { inventor_id: "${inv_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z", management_plan_text: "Recusal plan" }, as: ComplianceOfficer, captures: { coi_f: "$.data.id" } }
            - { call: "POST /tlo/coi-plans/${coi_f}/approve", payload: {}, as: ComplianceDirector }
            - { call: "POST /tlo/startups/${su_a}/coi-plans", payload: { inventor_id: "${inv_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z", management_plan_text: "Recusal plan" }, as: ComplianceOfficer, captures: { coi_a: "$.data.id" } }
            - { call: "POST /tlo/coi-plans/${coi_a}/approve", payload: {}, as: ComplianceDirector }
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /tlo/startups/${su_f}/issue-equity", payload: {}, as: TechTransferOfficer, captures: { eq_f: "$.data.university_equity_bp" } }
            - { call: "POST /tlo/startups/${su_a}/issue-equity", payload: { post_money_valuation_cents: 2000000000 }, as: TechTransferOfficer, captures: { eq_a: "$.data.university_equity_bp" } }
          assert:
            - "Startup.${su_f}.university_equity_bp == 500 (FIXED variant ignores valuation)"
            - "Startup.${su_a}.university_equity_bp == 400 (floor(800 * 1000000000 / 2000000000), within [200, 1500])"
            - "Startup.${su_f}.status == EQUITY_ISSUED and Startup.${su_a}.status == EQUITY_ISSUED"

  - rule_id: combinatorial_formula
    instances:
      - name: distribution_waterfall_mode_a
        grounds:
          - calculations.distribution_waterfall
          - calculations.unreimbursed_cost_rollup
        distinguishing_aspect: |
          Mode (a): >=3 inputs (gross, unreimbursed costs, funding_source,
          startup linkage) with nested min() and conditional pct branches —
          startup-linked FEDERAL disclosure: offset 500000, net 500000,
          admin 125000, inventor pct 40-5=35 -> pool 175000, dept pool 200000,
          university 625000.
        test_recipe:
          setup:
            - "FEDERAL disclosure (agency NSF, grant 12345) gated to PATENT_PURSUED, one CONFIRMED inventor 10000bp in department EECS"
            - "Startup-linked NON_EXCLUSIVE license ACTIVE, rate 500bp, minimum 100000, effective 2026-01-01"
            - "PROVISIONAL patent application with two UNREIMBURSED costs 300000 + 200000 = 500000"
            - "One report [2026-01-01, 2026-07-01) sales 20000000 accepted -> earned 1000000, no true-up (intra-year; minimum 100000 < earned anyway)"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "FEDERAL", federal_agency: "NSF", grant_number: "12345" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/startups", payload: { name: "SpinCo", founded_date: "2026-02-01T00:00:00Z", equity_model: "FIXED" }, as: TechTransferOfficer, captures: { su_id: "$.data.id" } }
            - { call: "POST /tlo/startups/${su_id}/coi-plans", payload: { inventor_id: "${inv_id}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z", management_plan_text: "Recusal plan" }, as: ComplianceOfficer, captures: { coi_id: "$.data.id" } }
            - { call: "POST /tlo/coi-plans/${coi_id}/approve", payload: {}, as: ComplianceDirector }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "SpinCo", exclusivity: "NON_EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 100000, upfront_fee_cents: 0, startup_id: "${su_id}" }, as: LicensingManager, captures: { lic_id: "$.data.id", lic_v: "$.data.version" } }
            - { call: "POST /tlo/licenses/${lic_id}/execute", payload: { expected_license_version: "${lic_v}" }, as: LicensingManager }
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/disclosures/${disc_id}/patent-applications", payload: { docket_number: "DKT-1", application_type: "PROVISIONAL", filed_date: "2026-02-15T00:00:00Z" }, as: TechTransferOfficer, captures: { app_id: "$.data.id" } }
            - { call: "POST /tlo/patent-applications/${app_id}/costs", payload: { cost_type: "FILING_FEE", amount_cents: 300000, incurred_date: "2026-03-01T00:00:00Z" }, as: TechTransferOfficer }
            - { call: "POST /tlo/patent-applications/${app_id}/costs", payload: { cost_type: "ATTORNEY_FEE", amount_cents: 200000, incurred_date: "2026-03-02T00:00:00Z" }, as: TechTransferOfficer }
            - { call: "POST /tlo/licenses/${lic_id}/royalty-reports", payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", reported_sales_cents: 20000000 }, as: LicensingManager, captures: { rep_id: "$.data.id" } }
            - { call: "POST /tlo/royalty-reports/${rep_id}/accept", payload: {}, as: FinanceOfficer }
          trigger:
            - { call: "POST /tlo/royalty-reports/${rep_id}/distribution", payload: {}, as: FinanceOfficer, captures: { dist_id: "$.data.id" } }
          assert:
            - "RoyaltyDistribution.${dist_id}.gross_cents == 1000000"
            - "RoyaltyDistribution.${dist_id}.cost_offset_cents == 500000 (min(1000000, 500000))"
            - "RoyaltyDistribution.${dist_id}.net_cents == 500000"
            - "RoyaltyDistribution.${dist_id}.admin_fee_cents == 125000 (round_half_up(500000*0.25))"
            - "RoyaltyDistribution.${dist_id}.inventor_pool_cents == 175000 (startup-linked FEDERAL: 40%-5%=35%)"
            - "RoyaltyDistribution.${dist_id}.department_pool_cents == 200000 (remainder)"
            - "RoyaltyDistribution.${dist_id}.university_pool_cents == 625000 (500000 + 125000)"
      - name: inventor_share_split_mode_b
        grounds:
          - calculations.inventor_share_split
          - calculations.department_share_split
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — pool 175000 split by
          floor per entry then single-cent remainder to the highest-share/
          earliest-created entry yields 58327/58327/58346; the alternative
          round_half_up-per-entry interpretation yields 58328/58328/58345.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED; roster: inv1 3333bp, inv2 3333bp, inv3 3334bp (created in that order), all CONFIRMED; inv1+inv2 in dept A, inv3 in dept B"
            - "NON_EXCLUSIVE license ACTIVE rate 500bp minimum 0; report [2026-01-01, 2026-07-01) sales 10000000 accepted -> earned 500000; no costs"
            - "Waterfall: offset 0, net 500000, admin 125000, inventor pct 35% -> pool 175000, dept pool 200000"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_a: "$.data.id" } }
            - { call: "POST /tlo/departments", payload: { name: "Bio", college_name: "Medicine" }, as: SystemAdmin, captures: { dept_b: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Inv One", email: "i1@uni.edu", department_id: "${dept_a}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv1: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Inv Two", email: "i2@uni.edu", department_id: "${dept_a}", appointment_type: "STAFF" }, as: SystemAdmin, captures: { inv2: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Inv Three", email: "i3@uni.edu", department_id: "${dept_b}", appointment_type: "STUDENT" }, as: SystemAdmin, captures: { inv3: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Assay Kit", description: "Novel assay", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv1}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv1}", share_bp: 3333 }, as: TechTransferOfficer, captures: { e1: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv2}", share_bp: 3333 }, as: TechTransferOfficer, captures: { e2: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv3}", share_bp: 3334 }, as: TechTransferOfficer, captures: { e3: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${e1}/confirm", payload: {}, as: Inventor, as_user_id: "${inv1}" }
            - { call: "POST /tlo/disclosure-entries/${e2}/confirm", payload: {}, as: Inventor, as_user_id: "${inv2}" }
            - { call: "POST /tlo/disclosure-entries/${e3}/confirm", payload: {}, as: Inventor, as_user_id: "${inv3}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "MEDIUM", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "BioTools", exclusivity: "NON_EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 0 }, as: LicensingManager, captures: { lic_id: "$.data.id", lic_v: "$.data.version" } }
            - { call: "POST /tlo/licenses/${lic_id}/execute", payload: { expected_license_version: "${lic_v}" }, as: LicensingManager }
            - { call: "POST /tlo/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /tlo/licenses/${lic_id}/royalty-reports", payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", reported_sales_cents: 10000000 }, as: LicensingManager, captures: { rep_id: "$.data.id" } }
            - { call: "POST /tlo/royalty-reports/${rep_id}/accept", payload: {}, as: FinanceOfficer }
          trigger:
            - { call: "POST /tlo/royalty-reports/${rep_id}/distribution", payload: {}, as: FinanceOfficer, captures: { dist_id: "$.data.id" } }
          assert:
            - "RoyaltyDistribution.${dist_id}.inventor_pool_cents == 175000"
            - "inventor_shares[${inv1}] == 58327 (floor(175000*3333/10000))"
            - "inventor_shares[${inv2}] == 58327"
            - "inventor_shares[${inv3}] == 58346 (floor 58345 + 1 remainder cent, highest share_bp first)"
            - "sum(inventor_shares.amount_cents) == 175000 exactly"
            - "department_shares[${dept_a}] == 133320 (weight 6666), department_shares[${dept_b}] == 66680 (weight 3334), sum == 200000"

  - rule_id: non_linear_state_machine
    instances:
      - name: license_negotiation_and_default_cure_cycles
        grounds:
          - state_machines.LicenseAgreement.IN_NEGOTIATION_to_COUNTERED
          - state_machines.LicenseAgreement.COUNTERED_to_IN_NEGOTIATION
          - state_machines.LicenseAgreement.ACTIVE_to_DEFAULT_NOTICE
          - state_machines.LicenseAgreement.DEFAULT_NOTICE_to_ACTIVE
        distinguishing_aspect: |
          LicenseAgreement runs two independent cycles: negotiation toggling
          IN_NEGOTIATION<->COUNTERED (each round bumping version), and the
          DEFAULT_NOTICE->ACTIVE cure loop — not a linear pipeline.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure PATENT_PURSUED; license created (version 1, IN_NEGOTIATION)"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
            - { call: "POST /tlo/inventors", payload: { full_name: "Ada Lovelace", email: "ada@uni.edu", department_id: "${dept_id}", appointment_type: "FACULTY" }, as: SystemAdmin, captures: { inv_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures", payload: { title: "Tensor Compiler", description: "Novel compiler", funding_source: "NON_FEDERAL" }, as: Inventor, as_user_id: "${inv_id}", captures: { disc_id: "$.data.id" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventors", payload: { inventor_id: "${inv_id}", share_bp: 10000 }, as: TechTransferOfficer, captures: { entry_id: "$.data.id" } }
            - { call: "POST /tlo/disclosure-entries/${entry_id}/confirm", payload: {}, as: Inventor, as_user_id: "${inv_id}" }
            - { call: "GET /tlo/disclosures/${disc_id}", payload: {}, as: Any, captures: { disc_v: "$.data.version" } }
            - { call: "POST /tlo/disclosures/${disc_id}/inventorship/finalize", payload: { expected_disclosure_version: "${disc_v}" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/assessment", payload: { patentability_rating: "HIGH", market_rating: "HIGH" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/decision", payload: { decision: "PURSUE_PATENT" }, as: TechTransferOfficer }
            - { call: "POST /tlo/disclosures/${disc_id}/licenses", payload: { licensee_name: "Acme", exclusivity: "NON_EXCLUSIVE", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z", royalty_rate_bp: 500, minimum_annual_royalty_cents: 0, upfront_fee_cents: 0 }, as: LicensingManager, captures: { lic_id: "$.data.id" } }
          trigger:
            - { call: "POST /tlo/licenses/${lic_id}/counter", payload: { royalty_rate_bp: 450 }, as: LicensingManager, captures: { s1: "$.data.status", v1: "$.data.version" } }
            - { call: "POST /tlo/licenses/${lic_id}/counter", payload: { royalty_rate_bp: 475 }, as: LicensingManager, captures: { s2: "$.data.status", v2: "$.data.version" } }
