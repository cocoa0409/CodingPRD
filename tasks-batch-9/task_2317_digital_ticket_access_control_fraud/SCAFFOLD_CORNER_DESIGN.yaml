      - name: segregation_of_duties_blocks_the_requester_from_approving_the_request
        claim_type: violation_error
        grounds:
          - validations[priority=18]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
          - entities.CredentialRequest.fields.requested_by_user_id
