            - call: "GET /app-records/${app_id}/commerce-settlement?period_label=2026-Q1"
              payload: {}
              as: PublisherAdmin
              as_user_id: "${acct_id}"
          assert:
            - "the first call returns 200 with data.commission_rate_applied == 0.30 and data.commission_cents == 302"
            - "the first call returns data.reported_period_label == 2026-Q1"
            - "the second call returns 200 with data.line_count == 1, data.gross_cents_total == 1005, data.commission_cents_total == 302 and data.net_cents_total == 703"
            - "PublisherAccount.${acct_id}.settlement_finalized_periods == [\"2026-Q1\"]"

