      - name: immediate_visibility_after_mutation
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints.GET /wholesale/purchase-orders/{orderId}"]
        distinguishing_aspect: "Immediate consistency: the confirm response body itself shows CONFIRMED/INVOICED and a follow-up GET returns identical derived fields in the same request epoch."
        test_recipe:
          setup: ["Customer with FULL CA license; DRAFT order with one line 2 x 1500"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "ImRx", partner_kind: "CUSTOMER", dea_number: "AC7777750", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_im: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_im}", state_code: "CA", license_number: "LIC-IM", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000943", product_name: "IM", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1500, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_im: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_im}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_im: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_im}/lines"
              payload: { product_id: "${prod_im}", quantity_requested: 2 }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_im}/confirm"
              payload: {}
              as: OrderManager
              captures: { fs: $.data.fulfillment_status, fin: $.data.financial_status, tot: $.data.invoice_total_cents }
            - call: "GET /wholesale/purchase-orders/${ord_im}"
              payload: {}
              as: OrderManager
              captures: { fs2: $.data.fulfillment_status, tot2: $.data.invoice_total_cents }
          assert:
            - "fs == CONFIRMED and fin == INVOICED and tot == 3000 (provisional: 2 * 1500) in the mutation response itself"
            - "fs2 == CONFIRMED and tot2 == 3000 on the immediate follow-up read"
