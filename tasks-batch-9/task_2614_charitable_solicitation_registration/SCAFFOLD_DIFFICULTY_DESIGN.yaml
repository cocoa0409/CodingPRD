          The FL filing independently violates the fiscal assurance rule at priority 34 — its
          linked statement carries assurance_level NONE while required_financial_attestation is
          REVIEW — yet the cease-solicitation order in the domicile state makes priority 14 fire
          first, so the response is ERR_SOLICITATION_HALTED with 409 rather than
          ERR_ASSURANCE_LEVEL_INSUFFICIENT with 422. An implementation that evaluates fiscal
          checks eagerly, or that scopes the HALTED posture to the ceased state only, returns
          the 422.
