  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: pasteurizer_half_open_slot_with_cleaning_buffer
        grounds:
          - validations[priority=50]
          - errors.ERR_PASTEURIZER_SLOT_CONFLICT
          - endpoints[POST /milk-bank/pasteurization-runs]
          - entities.PasteurizationRun.fields.scheduled_start_at
          - entities.PasteurizationRun.fields.pasteurizer_id
          - entities.PasteurizationRun.fields.cycle_minutes
        distinguishing_aspect: |
          Interval semantics under test: HALF-OPEN [start, start + cycle_minutes + 15) on a
          named physical resource, where the exclusion window is longer than the cycle itself
          because of the 15-minute cleaning buffer. The probe pins all three edges at once —
          10:14 (inside the buffer, one minute before the end) is refused, 10:15 (exactly the
          buffer end, the open endpoint) is admitted, and 10:14 on a DIFFERENT pasteurizer_id
          is admitted — so an implementation that used a closed interval, that omitted the
          buffer, or that scoped the check globally instead of per pasteurizer all fail.
        test_recipe:
          setup:
            - "Logical clock is 2026-08-10T08:00:00Z."
            - "Pool POOL-0001 is COMMITTED with 2100 ml from three distinct donors."
            - "Run PAST-01/09:00 exists in SCHEDULED with cycle_minutes 60, so PAST-01 is occupied over [2026-08-10T09:00:00Z, 2026-08-10T10:15:00Z)."
