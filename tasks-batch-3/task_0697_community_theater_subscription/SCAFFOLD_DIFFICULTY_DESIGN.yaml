          The FRIEND boundary is >= 25000: a lifetime FULFILLED total of exactly 25000 yields donor_level=FRIEND,
          reachable through POST /donations/{id}/fulfill — a numeric-threshold boundary distinct from the
          zero-inventory edge below.
        test_recipe:
          setup:
            - "A patron with a single PLEDGED donation of exactly 25000"
