          The identical holder-change request is rejected and then accepted with nothing changed but a
          flag on a DIFFERENT entity: the incoming outfitter's prequalification_insurance_verified.
          Two further conditional arms are probed — transferring to the current holder is refused, and
          the successor, which now carries a predecessor_permit_id, may not be transferred again
