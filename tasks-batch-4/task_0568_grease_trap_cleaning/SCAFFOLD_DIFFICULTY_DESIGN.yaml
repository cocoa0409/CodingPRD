            - call: "POST /work-orders"
              payload: { site_id: "${site_id}", equipment_id: "${eq_id}", service_type: "SCHEDULED", planned_start: "2026-05-12T08:00:00Z", planned_end: "2026-05-12T10:00:00Z" }
              as: Dispatcher
              captures: { st_far: $.data.status }
          assert:
            - "creation 10h later response error_id == ERR_EQUIPMENT_SERVICE_TOO_SOON"
            - "creation ~46h later WorkOrder.status == SCHEDULED"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_conserves_outstanding_balance
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - calculations.customer_outstanding_balance
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.outstanding_balance_cents (money): ISSUE debits +12500 and the
          compensating VOID credits -12500, netting back to the pre-issue balance of 0.
        test_recipe:
          setup:
            - "Customer (outstanding 0); ACTIVE contract base_rate 12500; one invoice ISSUED (outstanding now 12500)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { business_name: "Conserve Cucina", billing_email: "co@x.com", credit_limit_cents: 1000000 }
              as: Admin
              captures: { cust_id: $.data.id }
            - call: "POST /service-contracts"
              payload: { customer_id: "${cust_id}", billing_cycle: "MONTHLY", base_rate_cents: 12500, tax_rate_bps: 0 }
              as: Admin
              captures: { contract_id: $.data.id }
            - call: "POST /service-contracts/${contract_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: Admin
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingClerk
              captures: { cust_v: $.data.version }
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", contract_id: "${contract_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_customer_version: "${cust_v}" }
              as: BillingClerk
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: BillingClerk
              captures: { inv_status: $.data.status }
          assert:
            - "Invoice.${inv_id}.status == VOID"
            - "Customer.${cust_id}.outstanding_balance_cents == 0"

      - name: manifest_void_conserves_pumped_gallons
        grounds:
          - entities.PumpOutManifest.fields.status
          - entities.Equipment.fields.lifetime_pumped_gallons
        distinguishing_aspect: |
          Conserved quantity = Equipment.lifetime_pumped_gallons (volume, a different conserved type
          than money): RECORD adds +800 and the compensating VOID subtracts -800, netting back to 0.
        test_recipe:
          setup:
            - "A grease-trap Equipment with an IN_PROGRESS WorkOrder; one RECORDED manifest of 800 gallons (lifetime_pumped_gallons == 800)"
          setup_api_calls:
