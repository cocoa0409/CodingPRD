  # ==========================================================================
  # Rule 3 - non_linear_state_machine (3 instances, different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_remand_cycle_reopens_investigation
        grounds:
          - state_machines.Case.APPEAL_REVIEW_to_REMANDED
          - state_machines.Case.REMANDED_to_INVESTIGATION
          - state_machines.Determination.ISSUED_to_SUPERSEDED
        distinguishing_aspect: |
          Case is cyclic: DETERMINATION_ISSUED -> APPEAL_REVIEW -> REMANDED -> INVESTIGATION closes a
          full loop, and the case afterwards accepts a brand-new evidence packet (packet_sequence 2) -
          proving the loop returns to a live working state rather than a terminal one.
        test_recipe:
          setup:
            - "Case [SEXUAL_ASSAULT] with a completed hearing and an ISSUED determination (SUSPENSION 120d; factors prior=0, aggravating=1, mitigating=0 -> score 50, TIER_3)"
            - "Respondent appeal on NEW_EVIDENCE grounds decided REMANDED with remand_scope INVESTIGATION"
          setup_api_calls:
            - { call: "POST /api/party-profiles", payload: { full_name: "Comp One", university_id: "U-C-1", role_type: "STUDENT", email: "c1@example.edu" }, as: CaseAdministrator, captures: { comp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Resp One", university_id: "U-R-1", role_type: "STUDENT", email: "r1@example.edu" }, as: CaseAdministrator, captures: { resp_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Coord One", university_id: "U-CO-1", role_type: "STAFF", email: "co1@example.edu" }, as: CaseAdministrator, captures: { coord_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Inv One", university_id: "U-INV-1", role_type: "STAFF", email: "inv1@example.edu" }, as: CaseAdministrator, captures: { inv_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "DM One", university_id: "U-DM-1", role_type: "FACULTY", email: "dm1@example.edu" }, as: CaseAdministrator, captures: { dm_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "AO One", university_id: "U-AO-1", role_type: "STAFF", email: "ao1@example.edu" }, as: CaseAdministrator, captures: { ao_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv C", university_id: "U-ADVC-1", role_type: "EXTERNAL", email: "advc@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advc_id: $.data.id } }
            - { call: "POST /api/party-profiles", payload: { full_name: "Adv R", university_id: "U-ADVR-1", role_type: "EXTERNAL", email: "advr@example.edu", advisor_eligible: true }, as: CaseAdministrator, captures: { advr_id: $.data.id } }
            - call: "POST /api/cases"
              payload: { complainant_id: "${comp_id}", respondent_id: "${resp_id}", coordinator_id: "${coord_id}", categories: ["SEXUAL_ASSAULT"], occurred_at: "2026-07-15T22:00:00Z", occurred_in_program_activity: true, occurred_in_united_states: true, received_via: "ONLINE_FORM" }
              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { case_id: $.data.id }
            - { call: "POST /api/cases/${case_id}/begin-jurisdiction-review", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/confirm-jurisdiction", as: TitleIXCoordinator, as_user_id: "${coord_id}" }
            - { call: "POST /api/cases/${case_id}/file-formal-complaint", as: Party, as_user_id: "${comp_id}" }
