      - name: donor_version_advances_on_every_write_including_cascaded_ones_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority 8]
          - endpoints[POST /athletics/point-recalculations/{id}/run]
          - endpoints[POST /athletics/donors/{id}/gifts]
        distinguishing_aspect: |
          The guide's optimistic_concurrency row requires that version increments
          on EVERY write, and the hard case is the writes a client did not issue
          against the donor at all: a gift create, a gift settle and a
          recalculation run each bump Donor.version as a declared side effect.
          A client that cached version 2 after creating the gift therefore holds a
          stale token by the time the cycle has run, which is exactly how the
          expected_donor_version contract bites. Reads must bump nothing, and the
          412 itself must bump nothing.
