            - "the same call with an unknown wine_id still returns 403 ERR_VENUE_SCOPE_VIOLATION, not 404 ERR_WINE_NOT_FOUND — priority 4 precedes the body-FK check at priority 11"
            - "the par report for ${v1_id} read by the ${v2_id} sommelier returns 403 ERR_VENUE_SCOPE_VIOLATION even though it is a pure read"
            - "the same par report read by the ${v1_id} sommelier returns 200 with venue_id ${v1_id}"
            - "GET /beverage-program/inventory-lots?venue_id=${v1_id} read as the ${v1_id} sommelier still returns exactly 1 row — nothing was created by the rejected calls"
      - name: same_user_cannot_submit_and_approve_a_write_off
