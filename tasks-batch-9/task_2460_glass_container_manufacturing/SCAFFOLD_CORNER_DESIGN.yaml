              as_user_id: "qe-2"
              captures: { dv4: "$.data.version" }
          trigger:
            - call: "POST /glass-plant/lightweighting-programs"
              payload: { baseline_design_id: "${d}", code: "LW-CC2-P1", target_weight_g: 189.00, annual_volume_units: 1000000, resin_free_glass_price_per_kg: 0.5000, expected_design_version: "${dv3}" }
              as: QualityEngineer
          assert:
            - "HTTP 412 and data.error_id == ERR_STALE_DESIGN_VERSION"
            - "${dv3} == 3 and ${dv4} == 4; BottleDesign.${d}.version is still 4 after the refusal"
            - "GET /glass-plant/lightweighting-programs with baseline_design_id ${d} returns total_count 0"
            - "the same body with expected_design_version ${dv4} returns 201 with status DRAFT and BottleDesign.${d}.version == 5"
