      - name: record_notification_failed_outcome_conditional_action
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/surveillance/contacts/{contactId}/record-notification
          - state_machines.Contact.NOTIFICATION_PENDING_to_NOTIFICATION_FAILED
          - entities.Contact.fields.notification_attempts
        distinguishing_aspect: |
          record-notification branches on the outcome field: outcome=FAILED moves a
          NOTIFICATION_PENDING contact to NOTIFICATION_FAILED and increments notification_attempts
          to 1 (the FAILED fork in isolation; §1.8 asserts the multi-step retry loop end state).
        test_recipe:
          setup:
            - "Program P, condition COVID19, jurisdiction J1, index case CI interviewed; contact KF elicited then queued (NOTIFICATION_PENDING)."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
            - call: "POST /surveillance/jurisdictions"
              payload: { program_id: "${prog}", name: "County 1", fips_code: "06001" }
              as: JurisdictionAdmin
              captures: { j1: $.data.id }
            - call: "POST /surveillance/reportable-conditions"
              payload: { program_id: "${prog}", condition_code: "COVID19", display_name: "COVID-19", presymptomatic_days: 2, infectious_tail_days: 10, quarantine_days: 14, test_based_release_days: 7, isolation_min_days: 5, fever_free_days: 1 }
              as: JurisdictionAdmin
            - call: "POST /surveillance/cases"
              payload: { program_id: "${prog}", jurisdiction_id: "${j1}", condition_code: "COVID19", patient_reference: "PT-I", symptom_onset_date: "2026-03-10T00:00:00.000Z", is_symptomatic: true }
              as: CaseInvestigator
              as_user_id: "${j1}"
              captures: { ci: $.data.id }
            - call: "POST /surveillance/cases/${ci}/interview"
              payload: {}
              as: CaseInvestigator
              as_user_id: "${j1}"
            - call: "POST /surveillance/contacts"
              payload: { program_id: "${prog}", source_case_id: "${ci}", monitoring_jurisdiction_id: "${j1}", contact_reference: "K-F", exposure_setting: "HOUSEHOLD", proximity_meters: 0.5, cumulative_exposure_minutes: 30, last_exposure_date: "2026-03-15T00:00:00.000Z" }
              as: ContactTracer
              as_user_id: "${j1}"
              captures: { kf: $.data.id }
            - call: "POST /surveillance/contacts/${kf}/queue-notification"
              payload: {}
              as: ContactTracer
              as_user_id: "${j1}"
          trigger:
            - call: "POST /surveillance/contacts/${kf}/record-notification"
              payload: { outcome: "FAILED" }
              as: ContactTracer
              as_user_id: "${j1}"
          assert:
            - "response.status == 200"
            - "Contact.${kf}.status == NOTIFICATION_FAILED"
            - "Contact.${kf}.notification_attempts == 1"

  # ===========================================================================
  # SECTION: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_user_context_header_returns_400
        claim_type: Violation to Error
        grounds:
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - validations[priority=1]
        distinguishing_aspect: |
          Priority-1 auth: a request with no X-User-Role header returns 400
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any resource logic.
        test_recipe:
          setup:
            - "Program P exists."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /surveillance/programs/${prog}"
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: unknown_role_header_returns_400
        claim_type: Violation to Error
        grounds:
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
          - validations[priority=1]
        distinguishing_aspect: |
          Priority-1 auth: an X-User-Role that is not one of the five known roles (SUPERHERO)
          returns 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER.
        test_recipe:
          setup:
            - "Program P exists."
          setup_api_calls:
            - call: "POST /surveillance/programs"
              payload: { name: "State PH" }
              as: JurisdictionAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /surveillance/programs/${prog}"
              as: SUPERHERO
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

