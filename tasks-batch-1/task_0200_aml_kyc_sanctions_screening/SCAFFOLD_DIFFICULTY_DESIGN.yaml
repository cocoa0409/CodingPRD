scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_scoring_provisional_vs_final_band_flip
        grounds:
          - calculations.risk_scoring
          - entities.RiskAssessment.fields.variant
          - entities.RiskAssessment.fields.total_score
          - entities.Customer.fields.risk_rating
        distinguishing_aspect: |
          On the Customer/RiskAssessment domain, identical factors (g=5,p=3,pep=4,media=3) score
          58 (MEDIUM) as PROVISIONAL but 75 (HIGH) as FINAL because FINAL bumps pep_factor +1 when
          a CONFIRMED derogatory ScreeningHit exists — the band flips MEDIUM->HIGH on the same inputs.
        test_recipe:
          setup:
            - "An INDIVIDUAL customer with one CONFIRMED derogatory (OFAC_SDN) screening hit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Pep Person", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1980-01-01", is_pep_self_declared: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/screening-hits"
              payload: { list_type: "OFAC_SDN", matched_name: "Pep Person", match_score: 0.97 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_id: $.data.id }
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "ESCALATE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_disp: $.data.disposition }
          trigger:
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 3, pep_factor: 4, adverse_media_factor: 3 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { prov_id: $.data.id, prov_score: $.data.total_score, prov_band: $.data.risk_band }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "FINAL", geography_factor: 5, product_factor: 3, pep_factor: 4, adverse_media_factor: 3 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { final_id: $.data.id, final_score: $.data.total_score, final_band: $.data.risk_band }
          assert:
            - "RiskAssessment.${prov_id}.total_score == 58.00"
            - "RiskAssessment.${prov_id}.risk_band == MEDIUM"
            - "RiskAssessment.${final_id}.total_score == 75.00"
            - "RiskAssessment.${final_id}.risk_band == HIGH"

      - name: alert_severity_varies_by_owning_customer_risk_rating
        grounds:
          - calculations.alert_severity
          - entities.Alert.fields.severity_score
          - entities.Customer.fields.risk_rating
        distinguishing_aspect: |
          On the Alert domain (different entity domain from risk_scoring), the same firing rule_code
          STRUCTURING yields severity 80.00 when the owning Customer is HIGH but 37.50 for HIGH_RISK_GEO
          on a MEDIUM customer — the score variant is selected by the owning customer's risk_rating multiplier.
        test_recipe:
          setup:
            - "An APPROVED HIGH-rated customer with a KYC_OK account that posts a STRUCTURING cash-in."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "High Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2010-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-SEV-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 4, pep_factor: 4, adverse_media_factor: 4 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_rating: $.data.risk_rating }
          trigger:
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 950000, posted_at: "2026-06-01T10:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { txn_rule: $.data.triggered_rule }
            - call: "GET /accounts/${acct_id}/alerts"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert0_sev: "$.data[0].severity_score", alert0_rule: "$.data[0].rule_code" }
          assert:
            - "Customer.${cust_id}.risk_rating == HIGH"
            - "Alert[account_id=${acct_id}][0].rule_code == STRUCTURING"
            - "Alert[account_id=${acct_id}][0].severity_score == 80.00"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: risk_scoring_nonlinear_pep_surcharge_mode_a
        grounds:
          - calculations.risk_scoring
          - entities.RiskAssessment.fields.total_score
        distinguishing_aspect: |
          Mode (a): >=4 weighted inputs with a non-linear max() surcharge — a single maxed factor
          (pep OR adverse_media == 5) adds +12 once (not per-factor). Factors g=5,p=5,pep=5,media=5
          give base 75; surcharge fires once -> 87, NOT 75+12+12.
        test_recipe:
          setup:
            - "A customer awaiting its first risk assessment."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Combo A", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1975-05-05" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 5, product_factor: 5, pep_factor: 5, adverse_media_factor: 5 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id, score: $.data.total_score, band: $.data.risk_band }
          assert:
            - "RiskAssessment.${ra_id}.total_score == 87.00"
            - "RiskAssessment.${ra_id}.risk_band == PROHIBITED"

      - name: alert_severity_pinned_evaluation_order_mode_c
        grounds:
          - calculations.alert_severity
          - entities.Alert.fields.severity_score
          - entities.Customer.fields.risk_rating
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by explicit order — base depends on rule_code,
          multiplier depends on the customer's risk_rating, and severity = round(base*mult) in a fixed
          3-step order. CTR_THRESHOLD base 20 on a MEDIUM customer -> 20*1.5 = 30.00 exactly.
        test_recipe:
          setup:
            - "An APPROVED MEDIUM-rated customer whose account accumulates two cash-ins crossing the CTR window."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Med Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2012-02-02" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-CTR-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 3, product_factor: 2, pep_factor: 3, adverse_media_factor: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rating: $.data.risk_rating }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 600000, posted_at: "2026-06-01T09:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { t1_rule: $.data.triggered_rule }
          trigger:
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 600000, posted_at: "2026-06-01T15:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { t2_rule: $.data.triggered_rule }
            - call: "GET /accounts/${acct_id}/alerts"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { a0_rule: "$.data[0].rule_code", a0_sev: "$.data[0].severity_score" }
          assert:
            - "Customer.${cust_id}.risk_rating == MEDIUM"
            - "Transaction(t2).triggered_rule == CTR_THRESHOLD"
            - "Alert[account_id=${acct_id}][0].rule_code == CTR_THRESHOLD"
            - "Alert[account_id=${acct_id}][0].severity_score == 30.00"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: customer_cyclic_approved_to_edd_back_to_approved
        grounds:
          - state_machines.Customer.APPROVED_to_EDD_REQUIRED
          - state_machines.Customer.EDD_REQUIRED_to_APPROVED
          - state_machines.ScreeningHit.ESCALATED_to_CONFIRMED
        distinguishing_aspect: |
          Customer is cyclic: an APPROVED customer driven to EDD_REQUIRED by a newly CONFIRMED derogatory
          hit returns to APPROVED via complete-edd once open_hit_count==0 — the same customer revisits APPROVED.
        test_recipe:
          setup:
            - "An APPROVED LOW-rated customer with no open hits, then a derogatory hit is confirmed."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Cycle Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1990-03-03" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 1, product_factor: 1, pep_factor: 1, adverse_media_factor: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { status_after_approve: $.data.cdd_status }
            - call: "POST /customers/${cust_id}/screening-hits"
              payload: { list_type: "OFAC_SDN", matched_name: "Cycle Co", match_score: 0.98 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_id: $.data.id }
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "ESCALATE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { status_after_confirm: $.data.disposition }
          trigger:
            - call: "POST /customers/${cust_id}/complete-edd"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { final_status: $.data.cdd_status }
          assert:
            - "Customer.${cust_id}.cdd_status == EDD_REQUIRED immediately after CONFIRM"
            - "Customer.${cust_id}.cdd_status == APPROVED after complete-edd (revisited)"

      - name: case_branching_fork_join_three_branches
        grounds:
          - state_machines.Case.INVESTIGATING_to_SAR_RECOMMENDED
          - state_machines.Case.INVESTIGATING_to_CTR_REQUIRED
          - state_machines.Case.INVESTIGATING_to_CLOSED_NO_ACTION
        distinguishing_aspect: |
          Case (a different entity from Customer) is a fork-join: INVESTIGATING branches to one of
          {SAR_RECOMMENDED, CTR_REQUIRED, CLOSED_NO_ACTION} with divergent side-effect sets, and the
          SAR/CTR branches re-converge on FILED. Here the REQUIRE_CTR branch is exercised.
        test_recipe:
          setup:
            - "An INVESTIGATING case with a LINKED CTR_THRESHOLD alert."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Fork Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2011-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-FORK-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 1000001, posted_at: "2026-06-02T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { txn_rule: $.data.triggered_rule }
            - call: "GET /accounts/${acct_id}/alerts"
              payload: {}
              as: Analyst
              as_user_id: "an-1"
              captures: { alert_id: "$.data[0].id", alert_rule: "$.data[0].rule_code" }
            - call: "POST /cases"
              payload: { customer_id: "${cust_id}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /cases/${case_id}/alerts"
              payload: { alert_id: "${alert_id}", expected_case_version: "${case_v0}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { disp_after_link: $.data.disposition }
          trigger:
            - call: "POST /cases/${case_id}/disposition"
              payload: { decision: "REQUIRE_CTR" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_disp: $.data.disposition }
          assert:
            - "Case.${case_id}.disposition == INVESTIGATING after first alert link"
            - "Case.${case_id}.disposition == CTR_REQUIRED after REQUIRE_CTR"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_hit_cascade_depth3_customer_then_accounts
        grounds:
          - state_machines.ScreeningHit.ESCALATED_to_CONFIRMED
          - state_machines.Customer.APPROVED_to_EDD_REQUIRED
          - state_machines.Account.kyc_status_KYC_OK_to_PENDING_KYC
        distinguishing_aspect: |
          Depth-3 chain from CONFIRM trigger: (1) hit -> CONFIRMED mutates (2) Customer APPROVED->EDD_REQUIRED;
          THAT customer transition itself mutates (3) each KYC_OK Account -> PENDING_KYC. Each link is caused
          by the prior link, not by the CONFIRM directly.
        test_recipe:
          setup:
            - "An APPROVED LOW customer with a KYC_OK account; an ESCALATED derogatory hit."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Casc Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1985-06-06" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-CASC-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 1, product_factor: 1, pep_factor: 1, adverse_media_factor: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_kyc_after_approve: $.data.cdd_status }
            - call: "POST /customers/${cust_id}/screening-hits"
              payload: { list_type: "EU_SANCTIONS", matched_name: "Casc Co", match_score: 0.96 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_id: $.data.id }
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "ESCALATE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_disp: $.data.disposition }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_status: $.data.cdd_status }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_kyc: $.data.kyc_status }
          assert:
            - "ScreeningHit.${hit_id}.disposition == CONFIRMED"
            - "Customer.${cust_id}.cdd_status == EDD_REQUIRED (link 2, caused by link 1)"
            - "Account.${acct_id}.kyc_status == PENDING_KYC (link 3, caused by link 2)"

      - name: lookback_escalate_cascade_depth2_alert_then_account
        grounds:
          - state_machines.LookbackReviewItem.QUEUED_to_ESCALATED
          - state_machines.Account.monitoring_status_ACTIVE_to_UNDER_INVESTIGATION
          - entities.Alert.fields.account_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (lookback-item ESCALATE): (1) item ESCALATE mints an Alert;
          THAT alert creation itself mutates (2) the item's Account ACTIVE->UNDER_INVESTIGATION. Distinct
          origin from the CONFIRM cascade above.
        test_recipe:
          setup:
            - "An IN_PROGRESS lookback review with one QUEUED item over an ACTIVE account that had an in-window transaction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { legal_name: "Look Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2009-09-09" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-LB-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 5000, posted_at: "2026-06-05T12:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { t_rule: $.data.triggered_rule }
            - call: "POST /lookback-reviews"
              payload: { reason: "OFAC list refresh", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-08T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { review_id: $.data.id }
            - call: "POST /lookback-reviews/${review_id}/enqueue"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { total: $.data.total_items, rev_status: $.data.status }
            - call: "GET /lookback-reviews/${review_id}/items"
              payload: {}
              as: Analyst
              as_user_id: "an-1"
              captures: { item_id: "$.data[0].id", item_status: "$.data[0].item_status" }
          trigger:
            - call: "POST /lookback-items/${item_id}/disposition"
              payload: { decision: "ESCALATE" }
              as: Analyst
              as_user_id: "an-1"
              captures: { item_final: $.data.item_status, gen_alert: $.data.generated_alert_id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_mon: $.data.monitoring_status }
          assert:
            - "LookbackReviewItem.${item_id}.item_status == ESCALATED"
            - "LookbackReviewItem.${item_id}.generated_alert_id != null (link 1: alert minted)"
            - "Account.${acct_id}.monitoring_status == UNDER_INVESTIGATION (link 2, caused by link 1)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_confirm_terminal_hit
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_HIT_NOT_CONFIRMABLE]
        distinguishing_aspect: |
          Category pair state (priority 7) vs business_safety (priority 10): a CONFIRM on a hit that is both
          already terminal (FALSE_POSITIVE) AND non-confirmable returns ERR_INVALID_STATE (state wins), not
          ERR_HIT_NOT_CONFIRMABLE.
        test_recipe:
          setup:
            - "A hit already dispositioned FALSE_POSITIVE (terminal) that is also non-derogatory."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Pri Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1970-07-07" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/screening-hits"
              payload: { list_type: "PEP", matched_name: "Pri Co", match_score: 0.50 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_id: $.data.id }
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "FALSE_POSITIVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { disp: $.data.disposition }
          trigger:
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "CONFIRM" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (state priority 7 beats business_safety priority 10)"

      - name: existence_beats_business_referential_on_link_alert
        grounds:
          - validations[priority=3]
          - validations[priority=15]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_ALERT_CUSTOMER_MISMATCH]
        distinguishing_aspect: |
          Category pair existence (priority 3) vs business_referential (priority 15): linking a non-existent
          alert_id to a case returns ERR_NOT_FOUND (existence wins) rather than the customer-mismatch
          referential error.
        test_recipe:
          setup:
            - "An INVESTIGATING-eligible case in TRIAGE; a bogus alert_id."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Ref Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2013-03-03" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /cases"
              payload: { customer_id: "${cust_id}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_id: $.data.id, case_v0: $.data.version }
          trigger:
            - call: "POST /cases/${case_id}/alerts"
              payload: { alert_id: "00000000-0000-0000-0000-000000000000", expected_case_version: "${case_v0}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (existence priority 3 beats business_referential priority 15)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ctr_threshold_strict_gt_boundary_on_transactions
        grounds:
          - calculations.transaction_monitoring
          - entities.Transaction.fields.triggered_rule
        distinguishing_aspect: |
          Numeric threshold metric on POST /accounts/{id}/transactions: a single CASH_IN of exactly
          1,000,000 cents does NOT fire CTR (window 1,000,000 is not > 1,000,000) and falls to STRUCTURING;
          1,000,001 fires CTR_THRESHOLD. Strict > boundary.
        test_recipe:
          setup:
            - "Two ACTIVE accounts under the same customer for two single-transaction probes."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Bnd Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2014-04-04" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-BND-EQ", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_eq: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-BND-GT", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_gt: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_eq}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 1000000, posted_at: "2026-06-03T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_eq: $.data.triggered_rule }
            - call: "POST /accounts/${acct_gt}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 1000001, posted_at: "2026-06-03T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_gt: $.data.triggered_rule }
          assert:
            - "Transaction(eq).triggered_rule == STRUCTURING (1,000,000 is not > 1,000,000)"
            - "Transaction(gt).triggered_rule == CTR_THRESHOLD (1,000,001 > 1,000,000)"

      - name: enqueue_empty_window_zero_accounts_on_lookback
        grounds:
          - state_machines.LookbackReview.PLANNED_to_IN_PROGRESS
          - errors[ERR_REVIEW_EMPTY]
          - entities.LookbackReview.fields.total_items
        distinguishing_aspect: |
          Empty-set metric on a different endpoint (POST /lookback-reviews/{id}/enqueue): when no account
          has any in-window transaction, total_items==0, the review does NOT advance to IN_PROGRESS, and
          enqueue returns ERR_REVIEW_EMPTY. Distinct edge (zero-count) from the numeric > boundary above.
        test_recipe:
          setup:
            - "A PLANNED lookback whose window contains no account transactions."
          setup_api_calls:
            - call: "POST /lookback-reviews"
              payload: { reason: "empty window probe", window_start: "2030-01-01T00:00:00Z", window_end: "2030-01-08T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /lookback-reviews/${review_id}/enqueue"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_REVIEW_EMPTY"
            - "LookbackReview.${review_id}.status == PLANNED (not advanced)"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_link_requires_alert_same_customer_pair_case_alert
        grounds:
          - validations[priority=15]
          - state_machines.Case.TRIAGE_to_INVESTIGATING
          - entities.Alert.fields.customer_id
          - entities.Case.fields.customer_id
        distinguishing_aspect: |
          Entity pair Case<-Alert: a Case's TRIAGE->INVESTIGATING link transition depends on the Alert's
          customer_id matching the Case's customer_id; an alert from a different customer is rejected with
          ERR_ALERT_CUSTOMER_MISMATCH.
        test_recipe:
          setup:
            - "A case for customer A; an OPEN alert belonging to customer B."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Cust A", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2010-10-10" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_a: $.data.id }
            - call: "POST /customers"
              payload: { legal_name: "Cust B", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2011-11-11" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_b: $.data.id }
            - call: "POST /customers/${cust_b}/accounts"
              payload: { account_ref: "AC-XB-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_b}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 950000, posted_at: "2026-06-04T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { t_rule: $.data.triggered_rule }
            - call: "GET /alerts"
              payload: { customer_id: "${cust_b}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { alert_b: "$.data[0].id" }
            - call: "POST /cases"
              payload: { customer_id: "${cust_a}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_a: $.data.id, case_a_v0: $.data.version }
          trigger:
            - call: "POST /cases/${case_a}/alerts"
              payload: { alert_id: "${alert_b}", expected_case_version: "${case_a_v0}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALERT_CUSTOMER_MISMATCH"
            - "Case.${case_a}.disposition == TRIAGE (link rejected, no advance)"

      - name: transaction_blocked_by_account_status_pair_transaction_account
        grounds:
          - validations[priority=19]
          - state_machines.Customer.APPROVED_to_OFFBOARDED
          - state_machines.Account.kyc_status_KYC_OK_to_KYC_BLOCKED
          - entities.Transaction.fields.account_id
        distinguishing_aspect: |
          Entity pair Transaction->Account (different pair from Case<-Alert): posting a Transaction depends
          on the Account's kyc_status/monitoring_status; an account KYC_BLOCKED/FROZEN by an OFFBOARDED owner
          rejects new transactions with ERR_ACCOUNT_NOT_TRANSACTABLE.
        test_recipe:
          setup:
            - "An OFFBOARDED customer whose account is KYC_BLOCKED + FROZEN by cascade."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Off Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1988-08-08" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id, cust_v0: $.data.version }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-OFF-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /customers/${cust_id}/risk-assessments"
              payload: { variant: "PROVISIONAL", geography_factor: 1, product_factor: 1, pep_factor: 1, adverse_media_factor: 1 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ra_id: $.data.id }
            - call: "POST /customers/${cust_id}/apply-rating"
              payload: { risk_assessment_id: "${ra_id}", expected_customer_version: "${cust_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/clear-screening"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /customers/${cust_id}/offboard"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_status: $.data.cdd_status }
          trigger:
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 5000, posted_at: "2026-06-05T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { err: $.data.error_id }
          assert:
            - "Customer.${cust_id}.cdd_status == OFFBOARDED"
            - "Account.${acct_id}.kyc_status == KYC_BLOCKED and monitoring_status == FROZEN (cascade)"
            - "response error_id == ERR_ACCOUNT_NOT_TRANSACTABLE"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: ctr_window_calendar_day_bucket_resets_at_utc_midnight
        grounds:
          - calculations.transaction_monitoring
          - entities.Account.fields.aggregate_cash_in_cents
          - entities.Transaction.fields.posted_at
        distinguishing_aspect: |
          Interval semantics A — AGGREGATE-CAPACITY within a half-open calendar-day bucket [00:00, next
          00:00) on the Account resource: two 600,000 CASH_INs on the SAME UTC day accumulate to 1,200,000
          and the day's bucket capacity (1,000,000) is exceeded so CTR fires, but a 600,000 on day 1 and a
          600,000 on day 2 do NOT — the bucket resets at the UTC-midnight adjacency boundary so the day-2
          txn sees window 600,000. (Aggregate-capacity-over-a-bucket interval arithmetic; resource = Account.)
        test_recipe:
          setup:
            - "An ACTIVE account that receives a 600k cash-in on 2026-06-06 and a 600k on 2026-06-07."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Win Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2015-05-05" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-WIN-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 600000, posted_at: "2026-06-06T23:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_day1: $.data.triggered_rule }
          trigger:
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 600000, posted_at: "2026-06-07T01:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { rule_day2: $.data.triggered_rule }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { agg: $.data.aggregate_cash_in_cents }
          assert:
            - "Transaction(day1).triggered_rule == null (600,000 not > 1,000,000, not in struct band)"
            - "Transaction(day2).triggered_rule == null (window reset at UTC midnight; day-2 window is 600,000)"
            - "Account.${acct_id}.aggregate_cash_in_cents == 600000 (day-2 bucket only)"

      - name: lookback_window_half_open_boundary_on_review
        grounds:
          - calculations.lookback_window_membership
          - state_machines.LookbackReview.PLANNED_to_IN_PROGRESS
          - entities.LookbackReview.fields.window_start
          - entities.LookbackReview.fields.window_end
          - entities.LookbackReview.fields.total_items
        distinguishing_aspect: |
          Interval semantics B — half-open [window_start, window_end) CONTAINMENT on the LookbackReview
          resource (a different resource entity from Account): a transaction at posted_at == window_start
          is IN-window (inclusive) but one at posted_at == window_end is OUT (exclusive). Enqueue over a
          window [2026-06-01T00:00:00Z, 2026-06-08T00:00:00Z) with one account txn at the start instant
          and one at the end instant materializes exactly 1 item. Boundary geometry (containment, end
          exclusive) differs from Account's accumulation/midnight-reset arithmetic.
        test_recipe:
          setup:
            - "Two accounts: acct_start has a txn at window_start; acct_end has a txn at window_end."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Win2 Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2016-06-06" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-WSTART", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_start: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-WEND", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_end: $.data.id }
            - call: "POST /accounts/${acct_start}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 5000, posted_at: "2026-06-01T00:00:00Z", counterparty_country: "US" }
              as: SystemFeed
            - call: "POST /accounts/${acct_end}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 5000, posted_at: "2026-06-08T00:00:00Z", counterparty_country: "US" }
              as: SystemFeed
            - call: "POST /lookback-reviews"
              payload: { reason: "half-open boundary probe", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-08T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /lookback-reviews/${review_id}/enqueue"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { total: $.data.total_items, rstatus: $.data.status }
            - call: "GET /lookback-items"
              payload: { account_id: "${acct_start}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { start_item: "$.data[0].id" }
          assert:
            - "LookbackReview.${review_id}.total_items == 1 (acct_start in-window at start instant; acct_end excluded at end instant)"
            - "LookbackReview.${review_id}.status == IN_PROGRESS"
            - "exactly one LookbackReviewItem exists, for acct_start (window_start inclusive, window_end exclusive)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: open_hit_count_conserved_escalate_then_reopen
        grounds:
          - state_machines.ScreeningHit.PENDING_to_ESCALATED
          - state_machines.ScreeningHit.ESCALATED_to_PENDING
          - entities.Customer.fields.open_hit_count
          - calculations.edd_gate
        distinguishing_aspect: |
          Conserved quantity 1 — Customer.open_hit_count (count of hits in {PENDING, ESCALATED}). ESCALATE
          (forward) then reopen (compensating) MUST leave open_hit_count unchanged: both PENDING and
          ESCALATED are in the counted set, so the round trip is exactly net-zero.
        test_recipe:
          setup:
            - "A customer with one PENDING hit (open_hit_count==1)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Inv Co", customer_type: "INDIVIDUAL", country_code: "US", date_of_birth: "1991-01-01" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/screening-hits"
              payload: { list_type: "OFAC_SDN", matched_name: "Inv Co", match_score: 0.97 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { hit_id: $.data.id }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ohc_before: $.data.open_hit_count }
          trigger:
            - call: "POST /screening-hits/${hit_id}/disposition"
              payload: { decision: "ESCALATE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { disp_mid: $.data.disposition }
            - call: "POST /screening-hits/${hit_id}/reopen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { disp_after: $.data.disposition }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ohc_after: $.data.open_hit_count }
          assert:
            - "Customer.${cust_id}.open_hit_count == 1 before ESCALATE"
            - "ScreeningHit.${hit_id}.disposition == PENDING after reopen"
            - "Customer.${cust_id}.open_hit_count == 1 after the ESCALATE->reopen round trip (conserved)"

      - name: account_monitoring_conserved_link_then_close_no_action
        grounds:
          - state_machines.Case.TRIAGE_to_INVESTIGATING
          - state_machines.Case.INVESTIGATING_to_CLOSED_NO_ACTION
          - state_machines.Account.monitoring_status_ACTIVE_to_UNDER_INVESTIGATION
          - state_machines.Account.monitoring_status_UNDER_INVESTIGATION_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity 2 — count of ACTIVE accounts (a different conserved quantity from open_hit_count).
          The forward investigation action (alert mint + link) takes the account out of ACTIVE
          (ACTIVE->UNDER_INVESTIGATION); the compensating CLOSE_NO_ACTION dismisses the linked alert and
          reverts the account UNDER_INVESTIGATION->ACTIVE, so the count of ACTIVE accounts returns to its
          pre-alert baseline (net-zero), pinned as |{Account: monitoring_status==ACTIVE}| unchanged across
          the round trip.
        test_recipe:
          setup:
            - "An ACTIVE account with one alert, linked into an INVESTIGATING case."
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Mon Co", customer_type: "LEGAL_ENTITY", country_code: "US", incorporation_date: "2017-07-07" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/accounts"
              payload: { account_ref: "AC-MON-1", opening_balance_cents: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/transactions"
              payload: { direction: "CASH_IN", amount_cents: 950000, posted_at: "2026-06-09T08:00:00Z", counterparty_country: "US" }
              as: SystemFeed
              captures: { t_rule: $.data.triggered_rule }
            - call: "GET /accounts/${acct_id}/alerts"
              payload: {}
              as: Analyst
              as_user_id: "an-1"
              captures: { alert_id: "$.data[0].id" }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mon_before: $.data.monitoring_status }
            - call: "POST /cases"
              payload: { customer_id: "${cust_id}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - call: "POST /cases/${case_id}/alerts"
              payload: { alert_id: "${alert_id}", expected_case_version: "${case_v0}" }
              as: Analyst
              as_user_id: "an-1"
              captures: { disp_after_link: $.data.disposition }
          trigger:
            - call: "POST /cases/${case_id}/disposition"
              payload: { decision: "CLOSE_NO_ACTION" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { case_disp: $.data.disposition }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { mon_after: $.data.monitoring_status }
          assert:
            - "Account.${acct_id}.monitoring_status == UNDER_INVESTIGATION after link (already UNDER_INVESTIGATION from alert mint)"
            - "Case.${case_id}.disposition == CLOSED_NO_ACTION"
            - "Account.${acct_id}.monitoring_status == ACTIVE after CLOSE_NO_ACTION (conserved net-zero vs pre-alert ACTIVE)"
