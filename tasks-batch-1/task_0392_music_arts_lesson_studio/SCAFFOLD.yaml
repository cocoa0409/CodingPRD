# =============================================================================
# PRD Benchmark Scaffold — Music & Arts Lesson Studio
# Difficulty band: Expert (§0.4)
# =============================================================================

scenario: |
  392. Music & Arts Lesson Studio: instructor/instrument & student matching,
  recurring lesson schedule & room, makeup/cancellation policy, tuition & auto-pay,
  recital/event registration, practice/progress log, instrument rental, family discount

domain_name: music-arts-lesson-studio
api_prefix: /studios/{studioId}

# =============================================================================
# Complexity Profile (§0.1–§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation        # provisional-prorated vs finalized tuition; weighted vs raw practice score
    - optimistic_concurrency          # OCC on Enrollment.version for recurring-slot claim
    - cascading_side_effects          # enrollment freeze -> occurrences -> makeup credits -> invoice
    - rate_threshold_triggers         # family-discount tiers, makeup-credit cap, recital capacity

  entity_topology: flat
  # flat: peer entities (Family, Student, Instructor, Room, Enrollment, LessonOccurrence,
  # MakeupCredit, TuitionInvoice, Payment, RecitalEvent, RecitalRegistration, InstrumentRental)
  # linked by FK references in the body, NOT by nested URL ownership chains.

  state_machine_shape: parallel
  # Enrollment carries TWO independent dimensions (lifecycle_status x billing_status).
  # LessonOccurrence is cyclic (SCHEDULED <-> MAKEUP_PENDING). RecitalEvent is branching.

  relationship_patterns:
    - one_to_many        # Family 1..* Student; Enrollment 1..* LessonOccurrence
    - many_to_many       # Student <-> RecitalEvent via RecitalRegistration
    - cross_aggregate    # Enrollment references Student, Instructor, Room across peers

  role_model: peer_roles
  # StudioAdmin (operations), Instructor (teaches, logs progress), ParentGuardian (family
  # account holder, enrolls students, manages auto-pay), BillingClerk (invoices/payments).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio display name" }
      - { name: current_utc, type: datetime, source: system, description: "Deterministic server clock (ISO 8601 UTC, ms). Defaults to 2026-01-01T00:00:00.000Z at creation; advanced only via POST /studios/{id}/_clock/set_current_utc" }
      - { name: family_discount_tiers, type: array, source: input, description: "Ordered ascending by min_active_enrollments: array of {min_active_enrollments:int, discount_pct:number}. Used by family_discount_pct calc. Default [{min_active_enrollments:1,discount_pct:0},{min_active_enrollments:2,discount_pct:0.05},{min_active_enrollments:3,discount_pct:0.10},{min_active_enrollments:4,discount_pct:0.15}]" }
      - { name: makeup_credit_cap_per_enrollment, type: integer, source: input, description: "Max concurrent count of OUTSTANDING makeup credits an enrollment may hold at once", default: 3 }
      - { name: cancellation_notice_hours, type: integer, source: input, description: "Min hours before lesson start for a cancellation to earn a makeup credit", default: 24 }
      - { name: makeup_credit_valid_days, type: integer, source: input, description: "Days after issue a makeup credit remains usable before it EXPIRES", default: 30 }
      - { name: status, type: enum, source: system, description: "OPEN", constraints: "OPEN at creation; studios are not closed in this version (single-value lifecycle)" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: household_name, type: string, source: input, description: "Family/household name" }
      - { name: autopay_enabled, type: boolean, source: input, description: "When true, finalized invoices are auto-charged against wallet on finalize", default: false }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Prepaid balance in cents; credited by POST .../wallet/credits, debited by successful Payments and refunds. Never negative." }
      - { name: active_enrollment_count, type: integer, source: computed, description: "Count of Enrollment rows for this family whose lifecycle_status == ACTIVE. Drives family_discount_pct." }
      - { name: family_discount_pct, type: number, source: computed, description: "Tier-selected discount fraction from Studio.family_discount_tiers keyed on active_enrollment_count" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "ACTIVE at creation; SUSPENDED blocks new enrollments and auto-pay" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id" }
      - { name: full_name, type: string, source: input, description: "Student name" }
      - { name: skill_level, type: enum, source: input, description: "BEGINNER | INTERMEDIATE | ADVANCED", default: "BEGINNER" }
      - { name: total_practice_minutes, type: integer, source: computed, description: "Sum of minutes over all PracticeLog entries for this student" }
      - { name: weighted_progress_score, type: number, source: computed, description: "Decay-weighted progress score (see weighted_progress_score calc); recomputed on each practice log" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: full_name, type: string, source: input, description: "Instructor name" }
      - { name: instruments, type: array, source: input, description: "Array of instrument enum strings this instructor teaches, from {PIANO,VIOLIN,GUITAR,DRUMS,VOICE,CELLO}" }
      - { name: weekly_availability, type: array, source: input, description: "Array of {weekday:0-6, start_min:int, end_min:int} half-open windows (minutes from midnight) the instructor can teach; weekday 0=Monday" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Tuition rate per 60 lesson-minutes, in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", constraints: "ACTIVE at creation; INACTIVE blocks new enrollment matches" }

  - name: Room
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: room_name, type: string, source: input, description: "Room label" }
      - { name: supported_instruments, type: array, source: input, description: "Array of instrument enum strings this room is equipped for, from {PIANO,VIOLIN,GUITAR,DRUMS,VOICE,CELLO}" }
      - { name: turnover_buffer_min, type: integer, source: input, description: "Minutes of mandatory clean/turnover gap required between two consecutive room occupations", default: 10 }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; derived from student.family_id at creation" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id" }
      - { name: instrument, type: enum, source: input, description: "PIANO | VIOLIN | GUITAR | DRUMS | VOICE | CELLO" }
      - { name: weekday, type: integer, source: input, description: "Recurring lesson weekday, 0=Monday..6=Sunday" }
      - { name: start_min, type: integer, source: input, description: "Recurring lesson start, minutes from midnight (local studio time)" }
      - { name: duration_min, type: integer, source: input, description: "Lesson length in minutes; start_min+duration_min defines a half-open [start,end) weekly window" }
      - { name: lifecycle_status, type: enum, source: system, description: "PENDING_MATCH | ACTIVE | FROZEN | CANCELLED (dimension 1)", constraints: "PENDING_MATCH at creation; CANCELLED terminal" }
      - { name: billing_status, type: enum, source: system, description: "UNBILLED | BILLED | PAST_DUE (dimension 2, evolves independently of lifecycle_status)", constraints: "UNBILLED at creation" }
      - { name: monthly_tuition_cents, type: integer, source: computed, description: "Base monthly tuition before family discount: round_half_up(instructor.hourly_rate_cents * duration_min / 60 * SESSIONS_PER_MONTH). See tuition_base calc." }

  - name: LessonOccurrence
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; copied from enrollment, may be reassigned on makeup scheduling" }
      - { name: instructor_id, type: string, source: system, description: "FK -> Instructor.id; copied from enrollment" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Occurrence start (ISO 8601 UTC, ms)" }
      - { name: scheduled_end_utc, type: datetime, source: system, description: "scheduled_start_utc + enrollment.duration_min; half-open [start,end)" }
      - { name: is_makeup, type: boolean, source: system, description: "True if created by consuming a MakeupCredit", default: false }
      - { name: consumed_credit_id, type: string, source: system, description: "FK -> MakeupCredit.id; set only when is_makeup is true" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED_LATE | CANCELLED_NOTICE | MAKEUP_PENDING", constraints: "SCHEDULED at creation; COMPLETED/CANCELLED_LATE terminal" }

  - name: MakeupCredit
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: origin_occurrence_id, type: string, source: system, description: "FK -> LessonOccurrence.id; the cancelled occurrence that minted this credit" }
      - { name: issued_utc, type: datetime, source: system, description: "Studio clock at issuance" }
      - { name: expires_utc, type: datetime, source: system, description: "issued_utc + Studio.makeup_credit_valid_days" }
      - { name: status, type: enum, source: system, description: "OUTSTANDING | CONSUMED | EXPIRED | VOIDED", constraints: "OUTSTANDING at issuance; CONSUMED/EXPIRED/VOIDED terminal" }

  - name: TuitionInvoice
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id" }
      - { name: billing_period, type: string, source: input, description: "Billing month as 'YYYY-MM'" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "Prorated estimate at issue: round_half_up(monthly_tuition_cents * remaining_sessions / SESSIONS_PER_MONTH) then family discount applied. See tuition_provisional calc." }
      - { name: finalized_amount_cents, type: integer, source: computed, description: "Actual charge at finalize: per-completed-occurrence rate summed then discounted. See tuition_finalized calc. 0 until finalized." }
      - { name: rental_surcharge_cents, type: integer, source: computed, description: "Sum of active InstrumentRental.period_fee_cents attributed to this invoice's family+period at finalize" }
      - { name: amount_due_cents, type: integer, source: computed, description: "finalized_amount_cents + rental_surcharge_cents once finalized; equals provisional_amount_cents while ISSUED" }
      - { name: status, type: enum, source: system, description: "ISSUED | FINALIZED | PAID | VOID", constraints: "ISSUED at creation; PAID/VOID terminal" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> TuitionInvoice.id" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; copied from invoice" }
      - { name: amount_cents, type: integer, source: system, description: "Charge amount = invoice.amount_due_cents at attempt time" }
      - { name: method, type: enum, source: input, description: "WALLET | AUTOPAY", default: "WALLET" }
      - { name: status, type: enum, source: system, description: "SUCCEEDED | FAILED | REFUNDED", constraints: "SUCCEEDED or FAILED at creation; REFUNDED terminal after success" }
      - { name: failure_reason, type: enum, source: system, description: "NONE | INSUFFICIENT_FUNDS", default: "NONE" }

  - name: RecitalEvent
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: title, type: string, source: input, description: "Recital title" }
      - { name: venue_capacity, type: integer, source: input, description: "Max confirmed performer registrations" }
      - { name: event_start_utc, type: datetime, source: input, description: "Recital start (ISO 8601 UTC, ms)" }
      - { name: registration_deadline_utc, type: datetime, source: input, description: "Last instant registrations are accepted; must be < event_start_utc" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of RecitalRegistration rows with status==CONFIRMED for this event" }
      - { name: waitlist_count, type: integer, source: computed, description: "Count of RecitalRegistration rows with status==WAITLISTED for this event" }
      - { name: status, type: enum, source: system, description: "REG_OPEN | REG_CLOSED | COMPLETED | CANCELLED", constraints: "REG_OPEN at creation; COMPLETED/CANCELLED terminal" }

  - name: RecitalRegistration
    parent: null
    common_fields: true
    fields:
      - { name: recital_event_id, type: string, source: input, description: "FK -> RecitalEvent.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: registered_utc, type: datetime, source: system, description: "Studio clock at registration; used as performance-order and waitlist-promotion sort key (ASC)" }
      - { name: performance_order, type: integer, source: computed, description: "1-based slot among CONFIRMED registrations for this event, ordered by registered_utc ASC then created_at ASC" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | WITHDRAWN", constraints: "CONFIRMED or WAITLISTED at creation; WITHDRAWN terminal" }

  - name: InstrumentRental
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id" }
      - { name: instrument_unit_code, type: string, source: input, description: "Identifier of the physical instrument unit (a finite resource; only one rental may occupy a unit's time window)" }
      - { name: period_fee_cents, type: integer, source: input, description: "Flat rental fee for this rental's window, added to the family's tuition invoice as rental_surcharge at finalize" }
      - { name: rental_start_utc, type: datetime, source: input, description: "Rental window start (ISO 8601 UTC, ms)" }
      - { name: rental_end_utc, type: datetime, source: input, description: "Rental window end; closed-interval [start,end] occupation of the unit (returns count as occupying through end)" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | RETURNED | CANCELLED", constraints: "RESERVED at creation; RETURNED/CANCELLED terminal" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- Enrollment: PARALLEL dimensions (lifecycle_status x billing_status) -----
  - entity: Enrollment
    field: lifecycle_status
    initial_state: PENDING_MATCH
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING_MATCH
        to: ACTIVE
        trigger: "POST /studios/{studioId}/enrollments/{enrollmentId}/activate"
        actor: StudioAdmin
        preconditions:
          - "Family.status == ACTIVE (else ERR_FAMILY_SUSPENDED)"
          - "Instructor.status == ACTIVE and instrument in Instructor.instruments (else ERR_INSTRUCTOR_INSTRUMENT_MISMATCH)"
          - "Room.supported_instruments contains instrument (else ERR_ROOM_INSTRUMENT_MISMATCH)"
          - "Recurring weekly window [start_min,start_min+duration_min) inside one Instructor.weekly_availability window for weekday (else ERR_OUTSIDE_AVAILABILITY)"
          - "No other ACTIVE Enrollment with same instructor_id collides on (weekday, [start,end)) (else ERR_INSTRUCTOR_DOUBLE_BOOKED)"
          - "No other ACTIVE Enrollment with same room_id collides on (weekday, [start,end)) including room.turnover_buffer_min (else ERR_ROOM_DOUBLE_BOOKED)"
          - "expected_enrollment_version matches current Enrollment.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Enrollment.lifecycle_status -> ACTIVE"
          - "Recompute Family.active_enrollment_count and Family.family_discount_pct (cascade: discount may change for ALL of this family's ISSUED invoices' implied rate, but only newly issued invoices observe it)"
          - "increments Enrollment.version by 1"
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /studios/{studioId}/enrollments/{enrollmentId}/freeze"
        actor: StudioAdmin
        preconditions:
          - "Enrollment.lifecycle_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Enrollment.lifecycle_status -> FROZEN"
          - "All this enrollment's LessonOccurrence in SCHEDULED with scheduled_start_utc >= Studio.current_utc -> CANCELLED_NOTICE (cascade hop 1)"
          - "Each such CANCELLED_NOTICE occurrence mints one MakeupCredit OUTSTANDING if enrollment OUTSTANDING-credit count < makeup_credit_cap_per_enrollment (cascade hop 2)"
          - "Recompute Family.active_enrollment_count and Family.family_discount_pct (FROZEN no longer counts as ACTIVE) (cascade hop 3)"
          - "increments Enrollment.version by 1"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /studios/{studioId}/enrollments/{enrollmentId}/resume"
        actor: StudioAdmin
        preconditions:
          - "Enrollment.lifecycle_status == FROZEN (else ERR_INVALID_STATE)"
          - "Recurring slot re-validated free against current ACTIVE instructor/room bookings (else ERR_INSTRUCTOR_DOUBLE_BOOKED / ERR_ROOM_DOUBLE_BOOKED)"
          - "expected_enrollment_version matches current Enrollment.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Enrollment.lifecycle_status -> ACTIVE"
          - "Recompute Family.active_enrollment_count and Family.family_discount_pct"
          - "increments Enrollment.version by 1"
      - from: [PENDING_MATCH, ACTIVE, FROZEN]
        to: CANCELLED
        trigger: "POST /studios/{studioId}/enrollments/{enrollmentId}/cancel"
        actor: StudioAdmin
        preconditions:
          - "Enrollment.lifecycle_status != CANCELLED (else ERR_INVALID_STATE)"
        side_effects:
          - "Enrollment.lifecycle_status -> CANCELLED"
          - "All future SCHEDULED LessonOccurrence -> CANCELLED_NOTICE (no makeup credits minted on enrollment cancellation)"
          - "All OUTSTANDING MakeupCredit for this enrollment -> VOIDED"
          - "Recompute Family.active_enrollment_count and Family.family_discount_pct"
          - "increments Enrollment.version by 1"

  - entity: Enrollment
    field: billing_status
    initial_state: UNBILLED
    terminal_states: []
    transitions:
      - from: UNBILLED
        to: BILLED
        trigger: "system (POST /studios/{studioId}/invoices issued for this enrollment+period)"
        actor: system
        preconditions:
          - "Enrollment.lifecycle_status in {ACTIVE, FROZEN} (else ERR_INVALID_STATE)"
        side_effects:
          - "Enrollment.billing_status -> BILLED"
      - from: BILLED
        to: PAST_DUE
        trigger: "system (invoice for this enrollment finalized and a Payment FAILED, or invoice unpaid past period)"
        actor: system
        preconditions:
          - "An associated TuitionInvoice is FINALIZED and not PAID"
        side_effects:
          - "Enrollment.billing_status -> PAST_DUE"
      - from: PAST_DUE
        to: BILLED
        trigger: "system (a Payment SUCCEEDED clears the enrollment's outstanding finalized invoice)"
        actor: system
        preconditions:
          - "Associated TuitionInvoice transitions to PAID"
        side_effects:
          - "Enrollment.billing_status -> BILLED"

  # ----- LessonOccurrence: CYCLIC (SCHEDULED <-> MAKEUP_PENDING) -----
  - entity: LessonOccurrence
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_LATE]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /studios/{studioId}/lesson-occurrences/{occId}/complete"
        actor: Instructor
        preconditions:
          - "Occurrence.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Studio.current_utc >= scheduled_start_utc (else ERR_LESSON_NOT_STARTED)"
          - "parent Enrollment.lifecycle_status == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"
        side_effects:
          - "Occurrence.status -> COMPLETED"
          - "Counts toward finalized tuition (tuition_finalized includes this occurrence)"
      - from: SCHEDULED
        to: CANCELLED_NOTICE
        trigger: "POST /studios/{studioId}/lesson-occurrences/{occId}/cancel (>= cancellation_notice_hours before start)"
        actor: [StudioAdmin, ParentGuardian]
        preconditions:
          - "Occurrence.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "(scheduled_start_utc - Studio.current_utc) >= Studio.cancellation_notice_hours hours (else this is the CANCELLED_LATE branch)"
        side_effects:
          - "Occurrence.status -> CANCELLED_NOTICE"
          - "Mint one MakeupCredit OUTSTANDING for the enrollment IF enrollment OUTSTANDING-credit count < makeup_credit_cap_per_enrollment (else ERR_MAKEUP_CAP_EXCEEDED and the cancel is rejected)"
      - from: SCHEDULED
        to: CANCELLED_LATE
        trigger: "POST /studios/{studioId}/lesson-occurrences/{occId}/cancel (< cancellation_notice_hours before start)"
        actor: [StudioAdmin, ParentGuardian]
        preconditions:
          - "Occurrence.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "(scheduled_start_utc - Studio.current_utc) < Studio.cancellation_notice_hours hours"
        side_effects:
          - "Occurrence.status -> CANCELLED_LATE (terminal; NO makeup credit minted — late cancel forfeits)"
      - from: SCHEDULED
        to: MAKEUP_PENDING
        trigger: "POST /studios/{studioId}/lesson-occurrences/{occId}/request-makeup"
        actor: [StudioAdmin, ParentGuardian]
        preconditions:
          - "Occurrence.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "Occurrence.is_makeup == false (a makeup occurrence cannot itself spawn a makeup) (else ERR_MAKEUP_NOT_ALLOWED)"
          - "(scheduled_start_utc - Studio.current_utc) >= Studio.cancellation_notice_hours hours (else ERR_LATE_CANCELLATION)"
          - "enrollment OUTSTANDING-credit count < makeup_credit_cap_per_enrollment (else ERR_MAKEUP_CAP_EXCEEDED)"
        side_effects:
          - "Occurrence.status -> MAKEUP_PENDING"
          - "Mint one MakeupCredit OUTSTANDING for the enrollment, origin_occurrence_id = this occurrence"
      - from: MAKEUP_PENDING
        to: SCHEDULED
        trigger: "system (a new makeup occurrence is created via POST .../make-up-occurrences consuming this occurrence's credit, re-opening the original as rescheduled)"
        actor: system
        preconditions:
          - "A MakeupCredit minted from this occurrence is OUTSTANDING and within validity window"
        side_effects:
          - "Occurrence.status -> SCHEDULED (origin restored as the now-rescheduled session is the new makeup occurrence; original stays SCHEDULED for audit and is NOT separately completed)"
          - "note: the cycle SCHEDULED->MAKEUP_PENDING->SCHEDULED captures request-then-reschedule round trips"

  # ----- RecitalEvent: BRANCHING (REG_OPEN -> {REG_CLOSED -> COMPLETED} | CANCELLED) -----
  - entity: RecitalEvent
    field: status
    initial_state: REG_OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REG_OPEN
        to: REG_CLOSED
        trigger: "POST /studios/{studioId}/recital-events/{eventId}/close-registration"
        actor: StudioAdmin
        preconditions:
          - "RecitalEvent.status == REG_OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "RecitalEvent.status -> REG_CLOSED (no new registrations accepted)"
          - "Recompute performance_order for all CONFIRMED registrations (ordered registered_utc ASC, created_at ASC)"
      - from: REG_CLOSED
        to: COMPLETED
        trigger: "POST /studios/{studioId}/recital-events/{eventId}/complete"
        actor: StudioAdmin
        preconditions:
          - "RecitalEvent.status == REG_CLOSED (else ERR_INVALID_STATE)"
          - "Studio.current_utc >= event_start_utc (else ERR_EVENT_NOT_STARTED)"
        side_effects:
          - "RecitalEvent.status -> COMPLETED"
      - from: [REG_OPEN, REG_CLOSED]
        to: CANCELLED
        trigger: "POST /studios/{studioId}/recital-events/{eventId}/cancel"
        actor: StudioAdmin
        preconditions:
          - "RecitalEvent.status in {REG_OPEN, REG_CLOSED} (else ERR_INVALID_STATE)"
        side_effects:
          - "RecitalEvent.status -> CANCELLED (branch divergent from COMPLETED)"
          - "All CONFIRMED and WAITLISTED RecitalRegistration -> WITHDRAWN (cascade)"

  # ----- RecitalRegistration -----
  - entity: RecitalRegistration
    field: status
    initial_state: CONFIRMED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (a CONFIRMED registration withdraws, freeing a seat; earliest WAITLISTED by registered_utc ASC, created_at ASC is promoted)"
        actor: system
        preconditions:
          - "RecitalEvent.confirmed_count < venue_capacity after the withdrawal"
          - "This registration is the earliest WAITLISTED by (registered_utc ASC, created_at ASC)"
        side_effects:
          - "RecitalRegistration.status -> CONFIRMED"
          - "Recompute RecitalEvent.confirmed_count and waitlist_count"
          - "Recompute performance_order for CONFIRMED registrations"
      - from: [CONFIRMED, WAITLISTED]
        to: WITHDRAWN
        trigger: "POST /studios/{studioId}/recital-registrations/{regId}/withdraw"
        actor: [StudioAdmin, ParentGuardian]
        preconditions:
          - "RecitalRegistration.status in {CONFIRMED, WAITLISTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "RecitalRegistration.status -> WITHDRAWN"
          - "Recompute RecitalEvent.confirmed_count and waitlist_count"
          - "If a CONFIRMED seat was freed and a WAITLISTED registration exists, promote earliest WAITLISTED -> CONFIRMED (cascade)"

  # ----- TuitionInvoice -----
  - entity: TuitionInvoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: FINALIZED
        trigger: "POST /studios/{studioId}/invoices/{invoiceId}/finalize"
        actor: BillingClerk
        preconditions:
          - "TuitionInvoice.status == ISSUED (else ERR_INVALID_STATE)"
          - "Billing period has ended: Studio.current_utc >= first instant of month AFTER billing_period (else ERR_PERIOD_NOT_ENDED)"
        side_effects:
          - "Compute finalized_amount_cents (tuition_finalized) and rental_surcharge_cents; set amount_due_cents = finalized_amount_cents + rental_surcharge_cents"
          - "TuitionInvoice.status -> FINALIZED"
          - "If Family.autopay_enabled and Family.status==ACTIVE: synthesize a Payment AUTOPAY (cascade hop 1). On success Payment.status=SUCCEEDED, invoice -> PAID (cascade hop 2), Family.wallet_balance_cents debited (cascade hop 3); on insufficient funds Payment FAILED, enrollment.billing_status -> PAST_DUE."
      - from: FINALIZED
        to: PAID
        trigger: "system (a SUCCEEDED Payment covers amount_due_cents)"
        actor: system
        preconditions:
          - "A Payment with status SUCCEEDED and amount_cents == amount_due_cents exists"
        side_effects:
          - "TuitionInvoice.status -> PAID"
          - "Associated Enrollment.billing_status PAST_DUE -> BILLED if applicable"
      - from: ISSUED
        to: VOID
        trigger: "POST /studios/{studioId}/invoices/{invoiceId}/void"
        actor: BillingClerk
        preconditions:
          - "TuitionInvoice.status == ISSUED (else ERR_INVALID_STATE)"
        side_effects:
          - "TuitionInvoice.status -> VOID"

  # ----- Payment -----
  - entity: Payment
    field: status
    initial_state: SUCCEEDED
    terminal_states: [FAILED, REFUNDED]
    transitions:
      - from: SUCCEEDED
        to: REFUNDED
        trigger: "POST /studios/{studioId}/payments/{paymentId}/refund"
        actor: BillingClerk
        preconditions:
          - "Payment.status == SUCCEEDED (else ERR_INVALID_STATE)"
          - "Family.wallet_balance_cents currently reflects the credit (refund returns amount to wallet)"
        side_effects:
          - "Payment.status -> REFUNDED"
          - "Family.wallet_balance_cents += amount_cents (compensating: wallet returns to pre-payment value)"
          - "Associated TuitionInvoice PAID -> FINALIZED (unpaid again)"

  # ----- InstrumentRental -----
  - entity: InstrumentRental
    field: status
    initial_state: RESERVED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /studios/{studioId}/instrument-rentals/{rentalId}/activate"
        actor: StudioAdmin
        preconditions:
          - "InstrumentRental.status == RESERVED (else ERR_INVALID_STATE)"
          - "Studio.current_utc >= rental_start_utc (else ERR_RENTAL_NOT_STARTED)"
        side_effects:
          - "InstrumentRental.status -> ACTIVE"
      - from: [RESERVED, ACTIVE]
        to: RETURNED
        trigger: "POST /studios/{studioId}/instrument-rentals/{rentalId}/return"
        actor: StudioAdmin
        preconditions:
          - "InstrumentRental.status in {RESERVED, ACTIVE} (else ERR_INVALID_STATE)"
        side_effects:
          - "InstrumentRental.status -> RETURNED (unit freed for future windows)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /studios/{studioId}/instrument-rentals/{rentalId}/cancel"
        actor: [StudioAdmin, ParentGuardian]
        preconditions:
          - "InstrumentRental.status == RESERVED (else ERR_INVALID_STATE)"
        side_effects:
          - "InstrumentRental.status -> CANCELLED (no surcharge attributed to any invoice)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-activate-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /studios/{studioId}/enrollments/{enrollmentId}/activate"
    occ_field: "expected_enrollment_version"
    description: |
      Activating an Enrollment whose version has advanced since the client last
      observed it is rejected. The canonical case: a client reads the enrollment,
      then a freeze+resume (or another activate-and-cancel) round trip bumps the
      enrollment's version; the stale activate then claims a recurring instructor/
      room slot under an out-of-date view and must be rejected on the version
      check before the slot is committed.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enrollment-resume-stale-version
    parent_entity: Enrollment
    write_endpoint: "POST /studios/{studioId}/enrollments/{enrollmentId}/resume"
    occ_field: "expected_enrollment_version"
    description: |
      Resuming a FROZEN Enrollment whose version has advanced (e.g., a cancel or a
      re-freeze occurred after the client's last read) is rejected on the stale
      version check before the recurring slot is re-claimed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 dual-variant pair, instance A (Invoice domain) ---
  - name: tuition_provisional
    trigger: "POST /studios/{studioId}/invoices (invoice issued)"
    algorithm: forward_looking
    formula: |
      # remaining_sessions = number of SCHEDULED LessonOccurrence for the enrollment
      #   whose scheduled_start_utc falls in billing_period AND >= Studio.current_utc.
      base = round_half_up(monthly_tuition_cents * remaining_sessions / SESSIONS_PER_MONTH)
      provisional_amount_cents = round_half_up(base * (1 - family.family_discount_pct))
      # Discount applied AFTER proration rounding (order pinned: prorate-then-round, then discount-then-round).
    input_set: "SCHEDULED occurrences in billing_period at or after current_utc; family_discount_pct read at issue time"
    constants:
      SESSIONS_PER_MONTH: 4
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: provisional
        when: "invoice ISSUED mid/forward-looking; counts SCHEDULED future occurrences"
        difference: "uses projected remaining SCHEDULED sessions, NOT completed ones"

  - name: tuition_finalized
    trigger: "POST /studios/{studioId}/invoices/{invoiceId}/finalize"
    algorithm: chronological
    formula: |
      # per_session_rate = round_half_up(monthly_tuition_cents / SESSIONS_PER_MONTH)
      per_session_rate = round_half_up(monthly_tuition_cents / SESSIONS_PER_MONTH)
      billable = count of LessonOccurrence for enrollment in billing_period
                 with status IN {COMPLETED, CANCELLED_LATE}     # late cancels forfeit -> still billed
      gross = per_session_rate * billable                        # ROUND-PER-SESSION-THEN-SUM (pinned)
      finalized_amount_cents = round_half_up(gross * (1 - family.family_discount_pct))
    input_set: "occurrences in billing_period with status IN {COMPLETED, CANCELLED_LATE}; CANCELLED_NOTICE and MAKEUP_PENDING excluded"
    constants:
      SESSIONS_PER_MONTH: 4
    precision: "integer cents; per-session rounding happens BEFORE summation (mode b pinned order)"
    variants:
      - name: finalized
        when: "invoice FINALIZED after period end"
        difference: "counts actually COMPLETED + CANCELLED_LATE sessions, not projected; rounds per session then sums (differs in cents from provisional which prorates the whole month then rounds once)"

  # --- Rule 1 second dual-variant pair, DIFFERENT domain (Student progress) ---
  - name: weighted_progress_score
    trigger: "POST /studios/{studioId}/students/{studentId}/practice-logs"
    algorithm: decay_function
    formula: |
      # Logs sorted by logged_utc ASC. For each log i with minutes m_i and
      # age_days = floor((current_utc - logged_utc)/86400000):
      #   weight_i = DECAY_BASE ** age_days
      # weighted_progress_score = round_half_up( sum(m_i * weight_i) / 60 , 2 )
      score = 0
      for log in logs:                      # chronological replay
        age_days = floor((current_utc - log.logged_utc) / 86400000)
        score += log.minutes * (DECAY_BASE ** age_days)
      weighted_progress_score = round_half_up(score / 60, 2)
    input_set: "all PracticeLog rows for the student; chronological by logged_utc ASC then created_at ASC"
    constants:
      DECAY_BASE: 0.95
    precision: "2 decimal places, round_half_up"
    variants:
      - name: weighted_decayed
        when: "weighted_progress_score field"
        difference: "older practice decays at 0.95/day; differs from raw total_practice_minutes which never decays"

  - name: total_practice_minutes
    trigger: "POST /studios/{studioId}/students/{studentId}/practice-logs"
    algorithm: aggregation
    formula: |
      total_practice_minutes = sum(minutes) over ALL PracticeLog rows for the student
    input_set: "all PracticeLog rows for the student, unfiltered, no decay"
    constants: {}
    precision: "integer minutes"
    variants:
      - name: raw_total
        when: "total_practice_minutes field"
        difference: "raw undecayed sum; same inputs as weighted_progress_score yield different numbers"

  # --- Rule 2 combinatorial, mode (a): tiered selection + non-linear ---
  - name: family_discount_pct
    trigger: "recompute on any Enrollment lifecycle transition into/out of ACTIVE"
    algorithm: tiered_pricing
    formula: |
      n = active_enrollment_count          # count of ACTIVE enrollments in family
      # Select the tier with the GREATEST min_active_enrollments <= n; if none, 0.
      eligible = [t for t in studio.family_discount_tiers if t.min_active_enrollments <= n]
      if eligible is empty: family_discount_pct = 0.0
      else: family_discount_pct = max(eligible, key=t.min_active_enrollments).discount_pct
    input_set: "ACTIVE enrollments only; FROZEN/PENDING_MATCH/CANCELLED excluded"
    constants: {}
    precision: "fraction with up to 2 decimals as declared in tiers"

  # --- Rule 2 combinatorial, mode (b) already covered by tuition_finalized rounding-order ---
  # tuition_finalized pins round-per-session-then-sum; tuition_provisional pins prorate-then-round-once.

  # --- Rule 9 conserved-quantity helpers ---
  - name: family_wallet_balance
    trigger: "wallet credit, Payment SUCCEEDED, Payment REFUNDED"
    algorithm: aggregation
    formula: |
      wallet_balance_cents = sum(credits) - sum(SUCCEEDED Payment.amount_cents) + sum(REFUNDED Payment.amount_cents)
      # INVARIANT: a Payment SUCCEEDED followed by its refund leaves wallet_balance_cents unchanged.
    input_set: "wallet credit events + Payment rows for the family by status"
    constants: {}
    precision: "integer cents, never negative"

  - name: outstanding_makeup_credit_count
    trigger: "MakeupCredit mint, consume, expire, void"
    algorithm: aggregation
    formula: |
      outstanding = count(MakeupCredit for enrollment with status==OUTSTANDING and expires_utc > current_utc)
      # INVARIANT: minting a credit then consuming/voiding it returns outstanding to its prior value.
    input_set: "MakeupCredit rows for the enrollment with status OUTSTANDING within validity window"
    constants: {}
    precision: "integer count"

  - name: room_occupancy_overlap
    trigger: "Enrollment activate/resume (recurring weekly window); makeup occurrence creation (dated window)"
    algorithm: interval_merge
    formula: |
      # Recurring (Enrollment) semantics: two ACTIVE enrollments on the same room collide if
      #   same weekday AND the half-open minute windows expanded by room.turnover_buffer_min overlap:
      #   [a.start, a.end + buffer) intersects [b.start, b.end + buffer).
      # Dated (makeup LessonOccurrence) semantics: a new makeup occurrence on a room collides if
      #   another non-cancelled occurrence on that room has half-open UTC window overlapping
      #   WITHOUT buffer expansion (instantaneous adjacency allowed): [a.start,a.end) intersect [b.start,b.end).
    input_set: "ACTIVE enrollments (recurring) or SCHEDULED/COMPLETED occurrences (dated) on the room"
    constants: {}
    precision: "minute / millisecond integer arithmetic"

  - name: instrument_unit_overlap
    trigger: "POST /studios/{studioId}/instrument-rentals (rental reservation)"
    algorithm: interval_merge
    formula: |
      # Closed-interval semantics on the physical unit: a new rental on instrument_unit_code collides if
      #   any RESERVED/ACTIVE rental on the same unit has [a.start,a.end] intersect [b.start,b.end]
      #   (touching endpoints DO collide — a return at T blocks a pickup at T).
      reject if exists RESERVED|ACTIVE rental r on same unit with
        new.rental_start_utc <= r.rental_end_utc AND new.rental_end_utc >= r.rental_start_utc
    input_set: "RESERVED and ACTIVE InstrumentRental rows on the same instrument_unit_code"
    constants: {}
    precision: "millisecond integer arithmetic; closed interval (endpoints inclusive)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (studioId, then sub-resource id)"
    error_id: "ERR_STUDIO_NOT_FOUND / ERR_FAMILY_NOT_FOUND / ERR_STUDENT_NOT_FOUND / ERR_INSTRUCTOR_NOT_FOUND / ERR_ROOM_NOT_FOUND / ERR_ENROLLMENT_NOT_FOUND / ERR_OCCURRENCE_NOT_FOUND / ERR_CREDIT_NOT_FOUND / ERR_INVOICE_NOT_FOUND / ERR_PAYMENT_NOT_FOUND / ERR_EVENT_NOT_FOUND / ERR_REGISTRATION_NOT_FOUND / ERR_RENTAL_NOT_FOUND"
    http_status: 404
    applies_to: all path-parameterized endpoints

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, types/enums valid, end>start where applicable"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: business_referential
    check: "FK bodies reference existing siblings within the same studio (e.g., student_id belongs to a Family in this studio; instructor_id/room_id belong to this studio)"
    error_id: ERR_CROSS_STUDIO_REFERENCE
    http_status: 422
    applies_to: "POST enrollments, POST recital-registrations, POST instrument-rentals"

  - priority: 6
    category: state
    check: "Target resource in correct state for the transition (lifecycle/billing/occurrence/invoice/event/registration/rental)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "Enrollment.lifecycle_status==ACTIVE required to complete an occurrence"
    error_id: ERR_ENROLLMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST .../lesson-occurrences/{id}/complete"

  - priority: 8
    category: state
    check: "Family.status must be ACTIVE for enrollment activation and auto-pay"
    error_id: ERR_FAMILY_SUSPENDED
    http_status: 409
    applies_to: "POST .../enrollments/{id}/activate, invoice finalize auto-pay"

  - priority: 9
    category: business_constraint
    check: "Instructor.status==ACTIVE and enrollment.instrument in instructor.instruments"
    error_id: ERR_INSTRUCTOR_INSTRUMENT_MISMATCH
    http_status: 422
    applies_to: "POST .../enrollments/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "Room.supported_instruments contains enrollment.instrument"
    error_id: ERR_ROOM_INSTRUMENT_MISMATCH
    http_status: 422
    applies_to: "POST .../enrollments/{id}/activate"

  - priority: 11
    category: business_temporal
    check: "Recurring weekly window must lie inside one instructor weekly_availability window for the weekday"
    error_id: ERR_OUTSIDE_AVAILABILITY
    http_status: 409
    applies_to: "POST .../enrollments/{id}/activate, .../resume"

  - priority: 12
    category: business_temporal
    check: "Instructor recurring-slot overlap (same weekday, half-open minute windows, no buffer)"
    error_id: ERR_INSTRUCTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST .../enrollments/{id}/activate, .../resume"

  - priority: 13
    category: business_temporal
    check: "Room recurring-slot overlap (same weekday, half-open minute windows expanded by room.turnover_buffer_min)"
    error_id: ERR_ROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST .../enrollments/{id}/activate, .../resume"

  - priority: 14
    category: business_temporal
    check: "Instrument-unit rental overlap (closed interval, endpoints inclusive) on instrument_unit_code"
    error_id: ERR_INSTRUMENT_UNIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST .../instrument-rentals"

  - priority: 15
    category: business_temporal
    check: "Makeup occurrence dated-window overlap (half-open, no buffer) on instructor or room"
    error_id: ERR_MAKEUP_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST .../make-up-occurrences"

  - priority: 16
    category: business_temporal
    check: "Lesson cancellation lead-time: >= cancellation_notice_hours earns makeup branch; otherwise late branch (no error, controls branch). request-makeup requires >= notice (else ERR_LATE_CANCELLATION)."
    error_id: ERR_LATE_CANCELLATION
    http_status: 409
    applies_to: "POST .../lesson-occurrences/{id}/request-makeup"

  - priority: 17
    category: business_constraint
    check: "Makeup credit cap: enrollment OUTSTANDING-credit count < makeup_credit_cap_per_enrollment before minting"
    error_id: ERR_MAKEUP_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST .../lesson-occurrences/{id}/request-makeup, /cancel (notice branch)"

  - priority: 18
    category: business_constraint
    check: "Makeup credit consumed at creation must be OUTSTANDING and current_utc <= expires_utc"
    error_id: ERR_CREDIT_NOT_USABLE
    http_status: 409
    applies_to: "POST .../make-up-occurrences"

  - priority: 19
    category: business_temporal
    check: "Recital registration only while REG_OPEN and current_utc < registration_deadline_utc"
    error_id: ERR_REGISTRATION_CLOSED
    http_status: 409
    applies_to: "POST .../recital-registrations"

  - priority: 20
    category: business_constraint
    check: "A student may hold at most one non-WITHDRAWN RecitalRegistration per RecitalEvent"
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST .../recital-registrations"

  - priority: 21
    category: business_temporal
    check: "Invoice finalize requires billing_period fully elapsed (current_utc >= month after billing_period)"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST .../invoices/{id}/finalize"

  - priority: 22
    category: business_fiscal
    check: "WALLET/AUTOPAY payment requires wallet_balance_cents >= amount_due_cents"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST .../payments, invoice finalize auto-pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Studio ----------
  - method: POST
    path: "/studios"
    description: "Create a Studio (clock defaults to 2026-01-01T00:00:00.000Z)"
    roles: [StudioAdmin]
    code: 201
    input: [name, "family_discount_tiers?", "makeup_credit_cap_per_enrollment?", "cancellation_notice_hours?", "makeup_credit_valid_days?"]
    output: Studio
    side_effects: ["status=OPEN, current_utc defaulted"]
  - method: GET
    path: "/studios"
    description: "List studios"
    roles: [StudioAdmin, Instructor, ParentGuardian, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Studio[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}"
    description: "Get a studio"
    roles: [StudioAdmin, Instructor, ParentGuardian, BillingClerk]
    code: 200
    input: []
    output: Studio
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/_clock/set_current_utc"
    description: "Test-driving: set the deterministic studio clock"
    roles: [StudioAdmin]
    code: 200
    input: [to_iso8601]
    output: Studio
    side_effects: ["Studio.current_utc set; MakeupCredit past expires_utc lazily treated as EXPIRED on next read/use"]

  # ---------- Family ----------
  - method: POST
    path: "/studios/{studioId}/families"
    description: "Create a Family (household account)"
    roles: [StudioAdmin]
    code: 201
    input: [household_name, "autopay_enabled?"]
    output: Family
    side_effects: ["status=ACTIVE, wallet_balance_cents=0, active_enrollment_count=0, family_discount_pct=0"]
  - method: GET
    path: "/studios/{studioId}/families"
    description: "List families (filterable)"
    roles: [StudioAdmin, BillingClerk]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "Family[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/families/{familyId}"
    description: "Get a family"
    roles: [StudioAdmin, BillingClerk, ParentGuardian]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: PATCH
    path: "/studios/{studioId}/families/{familyId}"
    description: "Update family autopay flag / suspend-reactivate"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: ["autopay_enabled?", "status?"]
    output: Family
    side_effects: ["status may toggle ACTIVE/SUSPENDED; autopay_enabled updated"]
  - method: POST
    path: "/studios/{studioId}/families/{familyId}/wallet/credits"
    description: "Credit prepaid funds to family wallet"
    roles: [StudioAdmin, BillingClerk]
    code: 201
    input: [amount_cents]
    output: Family
    side_effects: ["wallet_balance_cents += amount_cents"]

  # ---------- Student ----------
  - method: POST
    path: "/studios/{studioId}/students"
    description: "Create a Student under a Family"
    roles: [StudioAdmin, ParentGuardian]
    code: 201
    input: [family_id, full_name, "skill_level?"]
    output: Student
    side_effects: ["total_practice_minutes=0, weighted_progress_score=0"]
  - method: GET
    path: "/studios/{studioId}/students"
    description: "List students (filter by family_id)"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: ["family_id?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/students/{studentId}"
    description: "Get a student (computed practice fields)"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/students/{studentId}/practice-logs"
    description: "Append a practice/progress log; recomputes practice fields"
    roles: [Instructor, ParentGuardian]
    code: 201
    input: [minutes, "logged_utc?", "note?"]
    output: Student
    side_effects: ["Recompute total_practice_minutes and weighted_progress_score"]

  # ---------- Instructor ----------
  - method: POST
    path: "/studios/{studioId}/instructors"
    description: "Create an Instructor"
    roles: [StudioAdmin]
    code: 201
    input: [full_name, instruments, weekly_availability, hourly_rate_cents]
    output: Instructor
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/studios/{studioId}/instructors"
    description: "List instructors"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "Instructor[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/instructors/{instructorId}"
    description: "Get an instructor"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: []
    output: Instructor
    side_effects: []
  - method: PATCH
    path: "/studios/{studioId}/instructors/{instructorId}"
    description: "Update instructor status (activate/deactivate)"
    roles: [StudioAdmin]
    code: 200
    input: ["status?"]
    output: Instructor
    side_effects: ["status toggled ACTIVE/INACTIVE"]

  # ---------- Room ----------
  - method: POST
    path: "/studios/{studioId}/rooms"
    description: "Create a Room"
    roles: [StudioAdmin]
    code: 201
    input: [room_name, supported_instruments, "turnover_buffer_min?"]
    output: Room
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/rooms"
    description: "List rooms"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "Room[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/rooms/{roomId}"
    description: "Get a room"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: []
    output: Room
    side_effects: []

  # ---------- Enrollment ----------
  - method: POST
    path: "/studios/{studioId}/enrollments"
    description: "Create an Enrollment (instructor/instrument/student match + recurring slot)"
    roles: [StudioAdmin, ParentGuardian]
    code: 201
    input: [student_id, instructor_id, room_id, instrument, weekday, start_min, duration_min]
    output: Enrollment
    side_effects: ["lifecycle_status=PENDING_MATCH, billing_status=UNBILLED, family_id derived, monthly_tuition_cents computed"]
  - method: GET
    path: "/studios/{studioId}/enrollments"
    description: "List enrollments (filter by family_id, student_id, instructor_id, room_id)"
    roles: [StudioAdmin, Instructor, ParentGuardian, BillingClerk]
    code: 200
    input: ["family_id?", "student_id?", "instructor_id?", "room_id?", "studio_id?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/enrollments/{enrollmentId}"
    description: "Get an enrollment"
    roles: [StudioAdmin, Instructor, ParentGuardian, BillingClerk]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/enrollments/{enrollmentId}/activate"
    description: "Activate enrollment (claims recurring instructor+room slot; OCC)"
    roles: [StudioAdmin]
    code: 200
    input: [expected_enrollment_version]
    output: Enrollment
    side_effects: ["lifecycle_status=ACTIVE, recompute family discount, increments Enrollment.version by 1"]
  - method: POST
    path: "/studios/{studioId}/enrollments/{enrollmentId}/freeze"
    description: "Freeze enrollment (cancels future occurrences, mints makeup credits, recomputes discount)"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["lifecycle_status=FROZEN; cascade cancel future occurrences -> mint credits -> recompute discount; increments Enrollment.version by 1"]
  - method: POST
    path: "/studios/{studioId}/enrollments/{enrollmentId}/resume"
    description: "Resume a FROZEN enrollment (re-claims slot; OCC)"
    roles: [StudioAdmin]
    code: 200
    input: [expected_enrollment_version]
    output: Enrollment
    side_effects: ["lifecycle_status=ACTIVE, recompute discount, increments Enrollment.version by 1"]
  - method: POST
    path: "/studios/{studioId}/enrollments/{enrollmentId}/cancel"
    description: "Cancel an enrollment"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects: ["lifecycle_status=CANCELLED; cancel future occurrences; void outstanding credits; recompute discount; increments Enrollment.version by 1"]

  # ---------- LessonOccurrence ----------
  - method: POST
    path: "/studios/{studioId}/lesson-occurrences"
    description: "Create a single scheduled occurrence for an ACTIVE enrollment"
    roles: [StudioAdmin]
    code: 201
    input: [enrollment_id, scheduled_start_utc]
    output: LessonOccurrence
    side_effects: ["status=SCHEDULED, scheduled_end_utc=start+duration, room/instructor copied; instructor/room dated-window non-overlap enforced"]
  - method: GET
    path: "/studios/{studioId}/lesson-occurrences"
    description: "List occurrences (filter by enrollment_id, room_id, instructor_id, consumed_credit_id)"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: ["enrollment_id?", "room_id?", "instructor_id?", "consumed_credit_id?", "limit?", "offset?"]
    output: "LessonOccurrence[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/lesson-occurrences/{occId}"
    description: "Get an occurrence"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: []
    output: LessonOccurrence
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/lesson-occurrences/{occId}/complete"
    description: "Mark occurrence COMPLETED (counts toward finalized tuition)"
    roles: [Instructor, StudioAdmin]
    code: 200
    input: []
    output: LessonOccurrence
    side_effects: ["status=COMPLETED"]
  - method: POST
    path: "/studios/{studioId}/lesson-occurrences/{occId}/cancel"
    description: "Cancel an occurrence (notice vs late branch by lead time)"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: LessonOccurrence
    side_effects: ["status=CANCELLED_NOTICE (>=notice, mints credit if under cap) or CANCELLED_LATE (<notice, no credit)"]
  - method: POST
    path: "/studios/{studioId}/lesson-occurrences/{occId}/request-makeup"
    description: "Request a makeup for an upcoming occurrence (mints credit, occurrence -> MAKEUP_PENDING)"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: LessonOccurrence
    side_effects: ["status=MAKEUP_PENDING; mint MakeupCredit OUTSTANDING (origin_occurrence_id set)"]
  - method: POST
    path: "/studios/{studioId}/make-up-occurrences"
    description: "Schedule a makeup occurrence by consuming an OUTSTANDING credit"
    roles: [StudioAdmin, ParentGuardian]
    code: 201
    input: [credit_id, scheduled_start_utc, "room_id?"]
    output: LessonOccurrence
    side_effects: ["new LessonOccurrence is_makeup=true, consumed_credit_id set; MakeupCredit -> CONSUMED; origin occurrence MAKEUP_PENDING -> SCHEDULED; instructor/room dated-window non-overlap enforced"]

  # ---------- MakeupCredit ----------
  - method: GET
    path: "/studios/{studioId}/makeup-credits"
    description: "List makeup credits (filter by enrollment_id, origin_occurrence_id)"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: ["enrollment_id?", "origin_occurrence_id?", "limit?", "offset?"]
    output: "MakeupCredit[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/makeup-credits/{creditId}"
    description: "Get a makeup credit"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: MakeupCredit
    side_effects: []

  # ---------- TuitionInvoice ----------
  - method: POST
    path: "/studios/{studioId}/invoices"
    description: "Issue a provisional tuition invoice for an enrollment+period"
    roles: [BillingClerk, StudioAdmin]
    code: 201
    input: [enrollment_id, billing_period]
    output: TuitionInvoice
    side_effects: ["status=ISSUED; provisional_amount_cents computed; family_id derived; enrollment.billing_status UNBILLED->BILLED"]
  - method: GET
    path: "/studios/{studioId}/invoices"
    description: "List invoices (filter by family_id, enrollment_id)"
    roles: [BillingClerk, StudioAdmin, ParentGuardian]
    code: 200
    input: ["family_id?", "enrollment_id?", "limit?", "offset?"]
    output: "TuitionInvoice[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [BillingClerk, StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/invoices/{invoiceId}/finalize"
    description: "Finalize invoice (computes finalized amount + rental surcharge; auto-pay if enabled)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects: ["status=FINALIZED; finalized_amount_cents+rental_surcharge_cents set; auto-pay cascade may create Payment, PAID/PAST_DUE"]
  - method: POST
    path: "/studios/{studioId}/invoices/{invoiceId}/void"
    description: "Void an ISSUED invoice"
    roles: [BillingClerk]
    code: 200
    input: []
    output: TuitionInvoice
    side_effects: ["status=VOID"]

  # ---------- Payment ----------
  - method: POST
    path: "/studios/{studioId}/payments"
    description: "Create a manual WALLET payment against a FINALIZED invoice"
    roles: [BillingClerk, ParentGuardian]
    code: 201
    input: [invoice_id, "method?"]
    output: Payment
    side_effects: ["amount_cents=invoice.amount_due_cents; SUCCEEDED debits wallet + invoice->PAID + enrollment PAST_DUE->BILLED; FAILED sets failure_reason + enrollment->PAST_DUE"]
  - method: GET
    path: "/studios/{studioId}/payments"
    description: "List payments (filter by invoice_id, family_id)"
    roles: [BillingClerk, StudioAdmin, ParentGuardian]
    code: 200
    input: ["invoice_id?", "family_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/payments/{paymentId}"
    description: "Get a payment"
    roles: [BillingClerk, StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/payments/{paymentId}/refund"
    description: "Refund a SUCCEEDED payment (wallet restored, invoice re-opened)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Payment
    side_effects: ["status=REFUNDED; wallet_balance_cents += amount_cents; invoice PAID->FINALIZED"]

  # ---------- RecitalEvent ----------
  - method: POST
    path: "/studios/{studioId}/recital-events"
    description: "Create a recital event"
    roles: [StudioAdmin]
    code: 201
    input: [title, venue_capacity, event_start_utc, registration_deadline_utc]
    output: RecitalEvent
    side_effects: ["status=REG_OPEN, confirmed_count=0, waitlist_count=0"]
  - method: GET
    path: "/studios/{studioId}/recital-events"
    description: "List recital events"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: "RecitalEvent[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/recital-events/{eventId}"
    description: "Get a recital event"
    roles: [StudioAdmin, Instructor, ParentGuardian]
    code: 200
    input: []
    output: RecitalEvent
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/recital-events/{eventId}/close-registration"
    description: "Close registration; lock performance order"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: RecitalEvent
    side_effects: ["status=REG_CLOSED; performance_order recomputed"]
  - method: POST
    path: "/studios/{studioId}/recital-events/{eventId}/complete"
    description: "Complete a recital event"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: RecitalEvent
    side_effects: ["status=COMPLETED"]
  - method: POST
    path: "/studios/{studioId}/recital-events/{eventId}/cancel"
    description: "Cancel a recital event (withdraws all registrations)"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: RecitalEvent
    side_effects: ["status=CANCELLED; all CONFIRMED/WAITLISTED registrations -> WITHDRAWN"]

  # ---------- RecitalRegistration ----------
  - method: POST
    path: "/studios/{studioId}/recital-registrations"
    description: "Register a student for a recital (CONFIRMED if capacity, else WAITLISTED)"
    roles: [StudioAdmin, ParentGuardian]
    code: 201
    input: [recital_event_id, student_id]
    output: RecitalRegistration
    side_effects: ["status=CONFIRMED if confirmed_count<venue_capacity else WAITLISTED; recompute event counts + performance_order"]
  - method: GET
    path: "/studios/{studioId}/recital-registrations"
    description: "List registrations (filter by recital_event_id, student_id)"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: ["recital_event_id?", "student_id?", "limit?", "offset?"]
    output: "RecitalRegistration[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/recital-registrations/{regId}"
    description: "Get a registration"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: RecitalRegistration
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/recital-registrations/{regId}/withdraw"
    description: "Withdraw a registration (promotes earliest waitlisted if a confirmed seat freed)"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: RecitalRegistration
    side_effects: ["status=WITHDRAWN; recompute counts; promote earliest WAITLISTED -> CONFIRMED if seat freed"]

  # ---------- InstrumentRental ----------
  - method: POST
    path: "/studios/{studioId}/instrument-rentals"
    description: "Reserve an instrument rental (closed-interval unit overlap enforced)"
    roles: [StudioAdmin, ParentGuardian]
    code: 201
    input: [family_id, instrument_unit_code, period_fee_cents, rental_start_utc, rental_end_utc]
    output: InstrumentRental
    side_effects: ["status=RESERVED"]
  - method: GET
    path: "/studios/{studioId}/instrument-rentals"
    description: "List rentals (filter by family_id, instrument_unit_code)"
    roles: [StudioAdmin, ParentGuardian, BillingClerk]
    code: 200
    input: ["family_id?", "instrument_unit_code?", "studio_id?", "limit?", "offset?"]
    output: "InstrumentRental[]"
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/instrument-rentals/{rentalId}"
    description: "Get a rental"
    roles: [StudioAdmin, ParentGuardian, BillingClerk]
    code: 200
    input: []
    output: InstrumentRental
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/instrument-rentals/{rentalId}/activate"
    description: "Activate a reserved rental (pickup)"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: InstrumentRental
    side_effects: ["status=ACTIVE"]
  - method: POST
    path: "/studios/{studioId}/instrument-rentals/{rentalId}/return"
    description: "Return a rental (frees the unit)"
    roles: [StudioAdmin]
    code: 200
    input: []
    output: InstrumentRental
    side_effects: ["status=RETURNED"]
  - method: POST
    path: "/studios/{studioId}/instrument-rentals/{rentalId}/cancel"
    description: "Cancel a reserved rental"
    roles: [StudioAdmin, ParentGuardian]
    code: 200
    input: []
    output: InstrumentRental
    side_effects: ["status=CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  # --- existence ---
  - { id: ERR_STUDIO_NOT_FOUND, http: 404, condition: "studioId does not exist" }
  - { id: ERR_FAMILY_NOT_FOUND, http: 404, condition: "familyId does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "studentId does not exist" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "instructorId does not exist" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "roomId does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollmentId does not exist" }
  - { id: ERR_OCCURRENCE_NOT_FOUND, http: 404, condition: "occId does not exist" }
  - { id: ERR_CREDIT_NOT_FOUND, http: 404, condition: "creditId does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "invoiceId does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "paymentId does not exist" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId does not exist" }
  - { id: ERR_REGISTRATION_NOT_FOUND, http: 404, condition: "regId does not exist" }
  - { id: ERR_RENTAL_NOT_FOUND, http: 404, condition: "rentalId does not exist" }
  # --- request / referential ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad type/enum, or end<=start window" }
  - { id: ERR_CROSS_STUDIO_REFERENCE, http: 422, condition: "Body FK references an entity outside this studio (student/instructor/room/family mismatch)" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Completing an occurrence requires enrollment.lifecycle_status==ACTIVE" }
  - { id: ERR_FAMILY_SUSPENDED, http: 409, condition: "Family SUSPENDED blocks enrollment activation / auto-pay" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "Invoice finalize before billing_period has fully elapsed" }
  # --- matching / capability ---
  - { id: ERR_INSTRUCTOR_INSTRUMENT_MISMATCH, http: 422, condition: "Instructor inactive or does not teach enrollment.instrument" }
  - { id: ERR_ROOM_INSTRUMENT_MISMATCH, http: 422, condition: "Room does not support enrollment.instrument" }
  # --- temporal / overlap ---
  - { id: ERR_OUTSIDE_AVAILABILITY, http: 409, condition: "Recurring window outside instructor weekly availability for the weekday" }
  - { id: ERR_INSTRUCTOR_DOUBLE_BOOKED, http: 409, condition: "Recurring slot overlaps another ACTIVE enrollment on the same instructor (half-open, no buffer)" }
  - { id: ERR_ROOM_DOUBLE_BOOKED, http: 409, condition: "Recurring slot overlaps another ACTIVE enrollment on the same room (half-open + turnover buffer)" }
  - { id: ERR_INSTRUMENT_UNIT_UNAVAILABLE, http: 409, condition: "Rental window overlaps an existing RESERVED/ACTIVE rental on the unit (closed interval, endpoints inclusive)" }
  - { id: ERR_MAKEUP_SLOT_CONFLICT, http: 409, condition: "Makeup occurrence dated window overlaps an existing occurrence on instructor or room (half-open, no buffer)" }
  - { id: ERR_LATE_CANCELLATION, http: 409, condition: "request-makeup attempted within cancellation_notice_hours of lesson start" }
  # --- makeup / credit ---
  - { id: ERR_MAKEUP_CAP_EXCEEDED, http: 409, condition: "Enrollment already holds makeup_credit_cap_per_enrollment OUTSTANDING credits" }
  - { id: ERR_MAKEUP_NOT_ALLOWED, http: 409, condition: "A makeup occurrence cannot itself spawn another makeup (is_makeup==true)" }
  - { id: ERR_CREDIT_NOT_USABLE, http: 409, condition: "Consumed credit is not OUTSTANDING or is past expires_utc" }
  # --- lesson timing ---
  - { id: ERR_LESSON_NOT_STARTED, http: 409, condition: "Completing an occurrence before scheduled_start_utc" }
  # --- recital ---
  - { id: ERR_REGISTRATION_CLOSED, http: 409, condition: "Recital not REG_OPEN or past registration_deadline_utc" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "Student already has a non-WITHDRAWN registration for this event" }
  - { id: ERR_EVENT_NOT_STARTED, http: 409, condition: "Completing a recital before event_start_utc" }
  # --- rental timing ---
  - { id: ERR_RENTAL_NOT_STARTED, http: 409, condition: "Activating a rental before rental_start_utc" }
  # --- fiscal ---
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "wallet_balance_cents < amount_due_cents for a WALLET/AUTOPAY payment" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_enrollment_version does not match current Enrollment.version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StudioAdmin
    description: "Studio operations: configures studio/instructors/rooms, manages enrollment lifecycle and occurrences, recital lifecycle, rental fulfillment"
    identity: opaque
    exclusive_operations:
      - "POST /studios — create studio"
      - "POST /studios/{studioId}/_clock/set_current_utc — set clock"
      - "POST /studios/{studioId}/families — create family"
      - "POST /studios/{studioId}/instructors — create instructor"
      - "PATCH /studios/{studioId}/instructors/{instructorId} — update instructor status"
      - "POST /studios/{studioId}/rooms — create room"
      - "POST /studios/{studioId}/enrollments/{enrollmentId}/activate — activate enrollment"
      - "POST /studios/{studioId}/enrollments/{enrollmentId}/freeze — freeze enrollment"
      - "POST /studios/{studioId}/enrollments/{enrollmentId}/resume — resume enrollment"
      - "POST /studios/{studioId}/enrollments/{enrollmentId}/cancel — cancel enrollment"
      - "POST /studios/{studioId}/lesson-occurrences — create occurrence"
      - "POST /studios/{studioId}/recital-events — create recital"
      - "POST /studios/{studioId}/recital-events/{eventId}/close-registration"
      - "POST /studios/{studioId}/recital-events/{eventId}/complete"
      - "POST /studios/{studioId}/recital-events/{eventId}/cancel"
      - "POST /studios/{studioId}/instrument-rentals/{rentalId}/activate"
      - "POST /studios/{studioId}/instrument-rentals/{rentalId}/return"
    shared_operations:
      - "GET on all resources"
      - "POST /studios/{studioId}/students (with ParentGuardian)"
      - "POST /studios/{studioId}/families/{familyId}/wallet/credits (with BillingClerk)"
      - "PATCH /studios/{studioId}/families/{familyId} (with ParentGuardian)"
      - "POST /studios/{studioId}/enrollments (with ParentGuardian)"
      - "POST /studios/{studioId}/lesson-occurrences/{occId}/complete (with Instructor)"
      - "POST /studios/{studioId}/lesson-occurrences/{occId}/cancel (with ParentGuardian)"
      - "POST /studios/{studioId}/lesson-occurrences/{occId}/request-makeup (with ParentGuardian)"
      - "POST /studios/{studioId}/make-up-occurrences (with ParentGuardian)"
      - "POST /studios/{studioId}/invoices (with BillingClerk)"
      - "POST /studios/{studioId}/recital-registrations (with ParentGuardian)"
      - "POST /studios/{studioId}/recital-registrations/{regId}/withdraw (with ParentGuardian)"
      - "POST /studios/{studioId}/instrument-rentals (with ParentGuardian)"
      - "POST /studios/{studioId}/instrument-rentals/{rentalId}/cancel (with ParentGuardian)"

  - name: Instructor
    description: "Teaches lessons; completes occurrences; logs student practice/progress"
    identity: entity_backed:Instructor
    exclusive_operations: []
    shared_operations:
      - "GET on studios, students, instructors, rooms, enrollments, lesson-occurrences, recital-events"
      - "POST /studios/{studioId}/students/{studentId}/practice-logs (with ParentGuardian)"
      - "POST /studios/{studioId}/lesson-occurrences/{occId}/complete (with StudioAdmin)"

  - name: ParentGuardian
    description: "Family account holder: enrolls students, manages auto-pay/wallet, cancels/requests makeups, recital registration, instrument rental"
    identity: entity_backed:Family
    exclusive_operations: []
    shared_operations:
      - "GET on own family/students/enrollments/invoices/payments/registrations/rentals"
      - "POST /studios/{studioId}/students (with StudioAdmin)"
      - "PATCH /studios/{studioId}/families/{familyId} (with StudioAdmin)"
      - "POST /studios/{studioId}/students/{studentId}/practice-logs (with Instructor)"
      - "POST /studios/{studioId}/enrollments (with StudioAdmin)"
      - "POST /studios/{studioId}/lesson-occurrences/{occId}/cancel (with StudioAdmin)"
      - "POST /studios/{studioId}/lesson-occurrences/{occId}/request-makeup (with StudioAdmin)"
      - "POST /studios/{studioId}/make-up-occurrences (with StudioAdmin)"
      - "POST /studios/{studioId}/payments (with BillingClerk)"
      - "POST /studios/{studioId}/recital-registrations (with StudioAdmin)"
      - "POST /studios/{studioId}/recital-registrations/{regId}/withdraw (with StudioAdmin)"
