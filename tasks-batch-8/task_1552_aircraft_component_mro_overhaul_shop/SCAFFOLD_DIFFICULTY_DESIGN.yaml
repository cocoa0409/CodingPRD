          assert:
            - "cl_st == 'SUBMITTED' (500 <= 500 AND 24 <= 24 — both limits inclusive)"

  # =========================================================================
  # Rule 7 — cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: test_results_require_covering_booking
        grounds:
          - state_machines.WorkOrder.READY_FOR_TEST_to_TEST_PASSED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair WorkOrder x TestCellBooking: test-results is rejected unless a sibling
          booking in status BOOKED covers the current clock — the work order alone being
          READY_FOR_TEST is not sufficient.
        test_recipe:
          setup:
            - "Work order in READY_FOR_TEST; cell exists; a booking exists but its window is [2026-08-03T10:00:00Z, 2026-08-03T14:00:00Z) while the clock reads 2026-08-03T08:00:00Z (outside the half-open window)"
          setup_api_calls:
            - { call: "POST /mro/customers", payload: { name: "AeroAir", certificate_number: "AIR-001", contract_tat_hours: 100, tat_penalty_rate_cents_per_hour: 5000, tat_penalty_cap_pct: 50, credit_limit_cents: 1000000000 }, as: ShopManager, captures: { c_id: $.data.id } }
