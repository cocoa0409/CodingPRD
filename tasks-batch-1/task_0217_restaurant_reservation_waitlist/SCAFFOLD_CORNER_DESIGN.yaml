# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Restaurant Reservation & Waitlist — breadth probe.
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# Every active instance drives empty-DB → precondition via §1.5 endpoints only.
# excluded_because: stubs point at §1.8 instances by name.
# Shared fixture conventions identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_restaurant_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Restaurant, endpoints]
        distinguishing_aspect: "POST /restaurants with only name returns 201; defaults applied (status OPEN, per_seat_deposit_cents 2500, deposit_required_party_threshold 6, version 1)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /restaurants"
              payload: { name: "Solo" }
              as: Manager
              captures: { rid: $.data.id }
          assert:
            - "HTTP 201; Restaurant.status == OPEN; per_seat_deposit_cents == 2500; deposit_required_party_threshold == 6; version == 1"

      - name: get_table_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Table, endpoints]
        distinguishing_aspect: "GET /tables/{id} returns the stored table with status AVAILABLE and version 1 at creation."
        test_recipe:
          setup: ["a restaurant with a dining area and one table"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rg", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id }
          trigger:
            - call: "GET /tables/${tbl}"
              payload: {}
              as: Host
          assert:
            - "HTTP 200; Table.status == AVAILABLE; Table.version == 1; Table.max_party_size == 8"

      - name: list_reservations_paginated_envelope
        claim_type: Listing
        grounds: [entities.Reservation, endpoints]
        distinguishing_aspect: "GET /reservations returns response_type array with pagination fields total_count and has_more in meta/envelope."
        test_recipe:
          setup: ["a restaurant with one reservation"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rl", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Ll", phone: "+15552220001" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "GET /reservations?restaurant_id=${rid}"
              payload: { restaurant_id: "${rid}" }
              as: Host
          assert:
            - "response_type == array; envelope has total_count == 1 and has_more == false"

      - name: get_reservation_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Reservation, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /reservations/{id} for a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: create_table_missing_required_max_party_size_returns_validation
        claim_type: Required Fields
        grounds: [entities.Table.fields.max_party_size, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /tables without the required max_party_size returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["a restaurant with a dining area"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rv", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
          trigger:
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_VALIDATION"

      - name: create_dining_area_default_kind_standard
        claim_type: Defaults
        grounds: [entities.DiningArea.fields.kind]
        distinguishing_aspect: "POST /dining-areas omitting kind applies default STANDARD."
        test_recipe:
          setup: ["a restaurant"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rd", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN" }
              as: Manager
              captures: { area: $.data.id }
          assert:
            - "HTTP 201; DiningArea.kind == STANDARD; DiningArea.status == AVAILABLE"

      - name: reservation_turn_window_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Reservation.fields.turn_window_end, calculations.reservation_turn_window]
        distinguishing_aspect: "turn_window_end and release_at are server-computed from the table/restaurant turn config; an 18:00 start with default 90 + buffer 15 yields turn_window_end 19:30 and release_at 19:45 regardless of any client-supplied value."
        test_recipe:
          setup: ["a restaurant (turn 90, buffer 15) with a table and dinner period"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rc", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Cc", phone: "+15552220002" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
          assert:
            - "Reservation.${res}.turn_window_end == 2026-06-15T19:30:00.000Z"
            - "Reservation.${res}.release_at == 2026-06-15T19:45:00.000Z"

      - name: table_per_table_turn_override_applied
        claim_type: Computed Fields
        grounds: [entities.Table.fields.turn_time_minutes, calculations.reservation_turn_window]
        distinguishing_aspect: "A table with turn_time_minutes 120 overrides the restaurant default 90: an 18:00 booking yields turn_window_end 20:00 and release_at 20:15 (buffer 15)."
        test_recipe:
          setup: ["a restaurant default turn 90, a table overriding turn to 120"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rto", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8, turn_time_minutes: 120 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "To", phone: "+15552220003" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
          assert:
            - "Reservation.${res}.turn_window_end == 2026-06-15T20:00:00.000Z"
            - "Reservation.${res}.release_at == 2026-06-15T20:15:00.000Z"

      - name: customer_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Customer.fields.no_show_strikes, entities.Customer.fields.status]
        distinguishing_aspect: "POST /customers ignores any client no_show_strikes/status; server initializes no_show_strikes 0, status ACTIVE, settled_reliability_pct 100.0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Sf", phone: "+15552220004" }
              as: Customer
              captures: { cust: $.data.id }
          assert:
            - "Customer.no_show_strikes == 0; Customer.status == ACTIVE; Customer.settled_reliability_pct == 100.0"

      - name: register_customer_bad_phone_format_validation
        claim_type: Type Constraints
        grounds: [entities.Customer.fields.phone, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /customers with a non-E.164 phone (e.g. '5551234') returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Bad", phone: "5551234" }
              as: Customer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; error_id == ERR_VALIDATION"

      - name: special_request_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.SpecialRequest, endpoints]
        distinguishing_aspect: "SpecialRequest has common_fields false → its read carries id and created_at but no version field; there is no PUT/PATCH, only acknowledge."
        test_recipe:
          setup: ["a reservation with one special request"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rsr", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Sr", phone: "+15552220005" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/special-requests"
              payload: { category: "DIETARY", note: "nut allergy" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sr: $.data.id }
          assert:
            - "HTTP 201; SpecialRequest.acknowledged == false; response data has no version field"

      - name: create_table_wrong_parent_dining_area_not_found
        claim_type: Parent Relationships
        grounds: [entities.Table.fields.dining_area_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /tables with a dining_area_id that does not resolve returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /tables"
              payload: { dining_area_id: "00000000-0000-4000-8000-0000000000aa", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: seat_reservation_from_requested_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /reservations/{id}/seat on a REQUESTED (not CONFIRMED) reservation returns ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["a REQUESTED reservation"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rseat", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "St", phone: "+15552220006" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
          trigger:
            - call: "POST /reservations/${res}/seat"
              payload: {}
              as: Host
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Reservation.${res}.status == REQUESTED"

      - name: cancel_completed_reservation_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal COMPLETED no transition is possible; POST /reservations/{id}/cancel returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a COMPLETED reservation"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rterm", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "Tm", phone: "+15552220007" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
            - call: "POST /reservations/${res}/confirm"
              payload: {}
              as: Host
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T18:05:00Z" }
              as: Manager
            - call: "POST /reservations/${res}/seat"
              payload: {}
              as: Host
            - call: "POST /reservations/${res}/complete"
              payload: {}
              as: Host
          trigger:
            - call: "POST /reservations/${res}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Reservation.${res}.status == COMPLETED"

      - name: initial_state_reservation_is_requested
        claim_type: Initial State
        grounds: [state_machines.Reservation, entities.Reservation.fields.status]
        distinguishing_aspect: "A freshly created reservation starts in initial_state REQUESTED."
        test_recipe:
          setup: ["a restaurant with table and period"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rinit", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
              payload: { dining_area_id: "${area}", label: "T1", min_party_size: 1, max_party_size: 8 }
              as: Manager
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /service-periods"
              payload: { restaurant_id: "${rid}", name: "DINNER", start_local_time: "17:00", end_local_time: "23:00", slot_interval_minutes: 30, pacing_max_covers_per_slot: 10 }
              as: Manager
            - call: "POST /customers"
              payload: { full_name: "In", phone: "+15552220008" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /reservations"
              payload: { restaurant_id: "${rid}", customer_id: "${cust}", table_id: "${tbl}", expected_table_version: "${tbl_v0}", party_size: 2, reservation_start: "2026-06-15T18:00:00Z" }
              as: Customer
              as_user_id: "${cust}"
              captures: { res: $.data.id }
          assert:
            - "Reservation.${res}.status == REQUESTED"

      - name: private_dining_revise_cycle_back_to_inquiry
        claim_type: cyclic
        grounds: [state_machines.PrivateDiningEvent.PROPOSED_to_INQUIRY, entities.PrivateDiningEvent.fields.status]
        distinguishing_aspect: "PrivateDiningEvent PROPOSED→INQUIRY revise loop returns status to INQUIRY, exercising the third non-linear machine's cycle on a distinct entity."
        test_recipe:
          setup: ["a PROPOSED private dining event"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rrev", timezone: "UTC" }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "PRIVATE_ROOM", kind: "PRIVATE" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Rv", phone: "+15552220009" }
              as: Customer
              captures: { cust: $.data.id }
            - call: "POST /private-dining-events"
              payload: { restaurant_id: "${rid}", dining_area_id: "${area}", customer_id: "${cust}", party_size: 12, event_start: "2026-07-01T18:00:00Z", event_end: "2026-07-01T22:00:00Z", food_minimum_cents: 200000, deposit_pct: 0.25 }
              as: Manager
              captures: { pde: $.data.id }
            - call: "POST /private-dining-events/${pde}/propose"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /private-dining-events/${pde}/revise"
              payload: {}
              as: Manager
          assert:
            - "PrivateDiningEvent.${pde}.status == INQUIRY"

      - name: complete_sets_table_dirty_bubble_side_effect
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.SEATED_to_COMPLETED, entities.Table.fields.status, entities.Customer.fields.lifetime_reservations]
        distinguishing_aspect: "Completing a SEATED reservation sets Table.status DIRTY and increments Customer.lifetime_reservations to 1; both side effects observable post-complete."
        test_recipe:
          setup: ["a SEATED reservation"]
          setup_api_calls:
            - call: "POST /restaurants"
              payload: { name: "Rcomp", timezone: "UTC", default_turn_time_minutes: 90, cleanup_buffer_minutes: 15 }
              as: Manager
              captures: { rid: $.data.id }
            - call: "POST /dining-areas"
              payload: { restaurant_id: "${rid}", name: "MAIN", kind: "STANDARD" }
              as: Manager
              captures: { area: $.data.id }
            - call: "POST /tables"
