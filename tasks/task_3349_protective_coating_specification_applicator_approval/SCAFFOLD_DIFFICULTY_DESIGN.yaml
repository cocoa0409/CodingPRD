          - entities.InspectionReport.fields.holiday_verdict
          - entities.InspectionReport.fields.overall_verdict
        distinguishing_aspect: |
          The holiday_density metric uses an inclusive `<=` boundary: on a
          BRIDGE project (HOLIDAY_LIMIT 0.1) holiday_count 1 over
          tested_area_m2 10.0 yields density exactly 0.1 and
          holiday_verdict == PASS — a numeric-ratio boundary reached through
          the inspection-reports endpoint, a different metric and endpoint
          from the sibling's integer-cents warranty-budget boundary.
