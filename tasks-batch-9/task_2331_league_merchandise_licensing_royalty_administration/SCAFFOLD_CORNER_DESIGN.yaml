              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_b3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_b3: $.data.id }
          trigger:
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_b3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2027-01-01", term_end_date: "2028-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_b3}/contract-status"
              payload: { action: "TERMINATE", reason: "Replaced by a renewal" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_b3}", category_id: "${cat_jersey}", exclusivity_mode: "NON_EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2027-01-01", term_end_date: "2028-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          assert:
            - "the first create returns 409 with data.error_id == 'ERR_DUPLICATE_AGREEMENT' (2027-01-01..2027-12-31 overlaps the DRAFT row)"
            - "the TERMINATE call returns 200 with data.contract_status == 'TERMINATED'"
            - "the second create returns 201 with data.contract_status == 'DRAFT' and data.term_start_date == '2027-01-01'"

      - name: club_owned_mark_on_a_league_only_category_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_19
          - errors.ERR_MARK_CLASS_NOT_PERMITTED
          - entities.ProductCategory.fields.mark_usage_class
          - entities.MarkRight.fields.owner_type
        distinguishing_aspect: |
          Whether a mark may be used is decided by joining THREE rows — the
          submission's agreement, that agreement's category and the MarkRight —
          because LEAGUE_ONLY admits owner_type LEAGUE only. A CLUB-owned mark is
          a 422 ERR_MARK_CLASS_NOT_PERMITTED even though the mark is ACTIVE and
          the licensee is in good standing; the LEAGUE mark in the same call's
          retry is accepted. Checking only MarkRight.status misses this.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "category PIN has mark_usage_class LEAGUE_ONLY"
            - "an ACTIVE club ATL, an ACTIVE LEAGUE mark and an ACTIVE CLUB mark owned by ATL"
            - "licensee LIC_C3 ACTIVE with an ACTIVE agreement AGR_C3 on category PIN"
