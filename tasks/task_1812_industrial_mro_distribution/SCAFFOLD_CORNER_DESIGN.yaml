              payload: { sku: "QT-1", description: "Screws", item_class: "STOCKED", list_price_cents: 1000 }
              as: DistributionAdmin
              captures: { it_id: $.data.id }
            - call: "POST /mro/locations"
              payload: { location_code: "BR-QT", location_type: "BRANCH", region_state: "OH", same_day_cutoff_minute: 900 }
              as: DistributionAdmin
              captures: { br_id: $.data.id }
            - call: "POST /mro/locations/${br_id}/restock"
              payload: { item_id: "${it_id}", qty: 19 }
              as: DistributionAdmin
          trigger:
            - call: "POST /mro/orders"
