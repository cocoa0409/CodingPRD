          - errors[ERR_REINVESTMENT_DEADLINE_PASSED]
          - entities.ReinvestmentObligation.fields.reinvest_by_at
        distinguishing_aspect: "reinvest_by_at is arose_at + exactly 365 days and the deadline is inclusive: a repayment on 2026-12-01 must be redeployed on or before 2027-12-01, and an attempt on 2027-12-02 returns 422 ERR_REINVESTMENT_DEADLINE_PASSED — which outranks the also-violated deployment-window rule at priority 29."
