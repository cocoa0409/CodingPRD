            - { call: "POST /corrective-action-plans", payload: { payer_id: "${p1}", issue_code_id: "${ic}", title: "Fix auth capture", root_cause: "Auth not captured at scheduling" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { cap: $.data.id } }
            - { call: "POST /corrective-action-plans/${cap}/activate", payload: {}, as: DepartmentDirector }
            - { call: "POST /corrective-action-plans/${cap}/begin-effectiveness-check", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: RevenueCycleAdmin }
          trigger:
            - { call: "POST /corrective-action-plans/${cap}/verify", payload: {}, as: ComplianceOfficer, as_user_id: "co-2", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_FORBIDDEN_FOR_ROLE\" (not ERR_SEGREGATION_OF_DUTIES: the role check fires first)"

      - name: internal_auditor_cannot_activate_plan
        claim_type: role_denial
        grounds: ["roles[InternalAuditor]", "endpoints[POST /corrective-action-plans/{id}/activate]"]
        distinguishing_aspect: "Activate is DepartmentDirector-exclusive; InternalAuditor gets 403."
        test_recipe:
          setup: ["CAP in PROPOSED"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /corrective-action-plans", payload: { payer_id: "${p1}", issue_code_id: "${ic}", title: "Fix auth capture", root_cause: "Auth not captured" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { cap: $.data.id } }
          trigger:
            - { call: "POST /corrective-action-plans/${cap}/activate", payload: {}, as: InternalAuditor, as_user_id: "ia-1", captures: { err: $.data.error_id } }
          assert:
            - "err == \"ERR_FORBIDDEN_FOR_ROLE\""
            - "GET /corrective-action-plans/${cap} still shows PROPOSED"

      - name: payer_agent_ownership_positive
        claim_type: role_grant
        grounds: ["roles[PayerAgent]", "validations[priority=5]"]
        distinguishing_aspect: "PayerAgent whose X-User-ID equals the case's payer_id passes the ownership check and drives the case forward (RECORDS_SUBMITTED -> UNDER_PAYER_REVIEW)."
        test_recipe:
          setup: ["case in RECORDS_SUBMITTED"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
          trigger:
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}", captures: { c_st: $.data.status } }
          assert:
            - "c_st == \"UNDER_PAYER_REVIEW\" (entity_backed identity match succeeds)"

      - name: any_role_read_access_positive
        claim_type: role_grant
        grounds: ["roles[Any]"]
        distinguishing_aspect: "Every GET endpoint accepts the Any role marker; a plain read of the payer list succeeds."
        test_recipe:
          setup: ["one payer exists"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin }
          trigger:
            - { call: "GET /payers", payload: {}, as: Any }
          assert:
            - "200 with total_count == 1"

  # ===================================================================
  # Section: cross_cutting (complexity layers)
  # ===================================================================
  - section: cross_cutting
    instances:
      - name: occ_records_submission_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[records-submission-stale-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on AuditCase.version: a second amendment carrying the pre-first-submission version is rejected 412 ERR_STALE_VERSION even though RECORDS_SUBMITTED legitimately accepts amendments; retrying with the fresh version succeeds."
        test_recipe:
          setup: ["case in RECEIVED (no claim lines, so no cascade bumps version)"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id, c_v: $.data.version } }
          trigger:
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M-1", expected_audit_case_version: "${c_v}" }, as: HIMCoordinator, captures: { c_v2: $.data.version, c_st1: $.data.status } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M-2", expected_audit_case_version: "${c_v}" }, as: HIMCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M-2", expected_audit_case_version: "${c_v2}" }, as: HIMCoordinator, captures: { c_v3: $.data.version } }
          assert:
            - "c_v == 1 and c_st1 == \"RECORDS_SUBMITTED\" and c_v2 == 2"
            - "err == \"ERR_STALE_VERSION\" with http 412 (stale expected_audit_case_version)"
            - "c_v3 == 3 (fresh-version amendment succeeds — the state itself permits the write)"

      - name: occ_demand_adjustment_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[demand-adjustment-stale-demand]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on RecoupmentDemand.version: two sequential adjustments — the second carrying the creation-time version is rejected 412 even though DEMANDED permits adjustments; with the current version it succeeds."
        test_recipe:
          setup: ["determined case, line denied 100000, demand principal 100000 (version 1)"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}" }
            - { call: "POST /audit-cases/${c1}/recoupment-demands", payload: { principal_cents: 100000 }, as: PayerAgent, as_user_id: "${p1}", captures: { d1: $.data.id, d_v: $.data.version } }
          trigger:
            - { call: "POST /recoupment-demands/${d1}/adjustments", payload: { new_principal_cents: 80000, expected_recoupment_demand_version: "${d_v}" }, as: PayerAgent, as_user_id: "${p1}", captures: { d_v2: $.data.version, d_out: $.data.outstanding_principal_cents } }
            - { call: "POST /recoupment-demands/${d1}/adjustments", payload: { new_principal_cents: 70000, expected_recoupment_demand_version: "${d_v}" }, as: PayerAgent, as_user_id: "${p1}", captures: { err: $.data.error_id } }
            - { call: "POST /recoupment-demands/${d1}/adjustments", payload: { new_principal_cents: 70000, expected_recoupment_demand_version: "${d_v2}" }, as: PayerAgent, as_user_id: "${p1}", captures: { d_out2: $.data.outstanding_principal_cents } }
          assert:
            - "d_v == 1 and d_v2 == 2 and d_out == 80000"
            - "err == \"ERR_STALE_VERSION\" with http 412"
            - "d_out2 == 70000 (fresh-version retry succeeds)"

      - name: version_increments_on_every_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.AuditCase", "complexity_profile"]
        distinguishing_aspect: "AuditCase.version increments on every mutation including cascaded side effects: 1 at creation, 2 after a claim-line add (totals recompute), 3 after records submission."
        test_recipe:
          setup: ["fresh case"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id, v1: $.data.version } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator }
          trigger:
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { v2: $.data.version, billed2: $.data.total_billed_cents } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${v2}" }, as: HIMCoordinator, captures: { v3: $.data.version } }
          assert:
            - "v1 == 1 and v2 == 2 (claim-line cascade bumped the parent) and billed2 == 100000"
            - "v3 == 3"

      - name: cascade_layer_covered
        claim_type: cascading_side_effects
        grounds: ["complexity_profile"]
        excluded_because:
          difficulty_instance: favorable_decision_full_reversal_cascade
          rationale: "The N-level cascade claim is exercised end-to-end by that instance (decision -> line -> demand -> offset -> remittance -> case totals)."
      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds: ["complexity_profile"]
        excluded_because:
          difficulty_instance: exposure_gross_vs_net_divergence
          rationale: "Both variants asserted with a computed delta on the exposure endpoint."

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_determination_response
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /audit-cases/{id}/determination]"]
        distinguishing_aspect: "Immediate consistency: the determination's own 200 response already carries the recomputed totals and determination_issued_at — no re-read or reconciliation delay."
        test_recipe:
          setup: ["case in UNDER_PAYER_REVIEW with one line billed 100000"]
          setup_api_calls:
            - { call: "POST /payers", payload: { name: "P1", payer_type: "RAC", records_submission_days: 30, l1_deadline_days: 30, l2_deadline_days: 30, l3_deadline_days: 30, l4_deadline_days: 30, l5_deadline_days: 30, external_review_deadline_days: 30, concurrent_audit_cap: 10, hold_levels: [], interest_rate_bps_tier1: 100, interest_rate_bps_tier2: 200, interest_cap_pct: 25 }, as: RevenueCycleAdmin, captures: { p1: $.data.id } }
            - { call: "POST /issue-codes", payload: { code: "AUTH", category: "TECHNICAL", description: "Missing auth" }, as: RevenueCycleAdmin, captures: { ic: $.data.id } }
            - { call: "POST /audit-cases", payload: { payer_id: "${p1}", audit_type: "RAC_COMPLEX", received_at: "2026-08-01T00:00:00Z" }, as: HIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /audit-cases/${c1}/claim-lines", payload: { claim_number: "L-1", patient_account_number: "PA-1", service_start_date: "2026-01-01T00:00:00Z", service_end_date: "2026-01-03T00:00:00Z", billed_amount_cents: 100000 }, as: HIMCoordinator, captures: { l1: $.data.id } }
            - { call: "GET /audit-cases/${c1}", payload: {}, as: Any, captures: { c1v: $.data.version } }
            - { call: "POST /audit-cases/${c1}/records-submissions", payload: { manifest_ref: "M1", expected_audit_case_version: "${c1v}" }, as: HIMCoordinator }
            - { call: "POST /audit-cases/${c1}/begin-payer-review", payload: {}, as: PayerAgent, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /audit-cases/${c1}/determination", payload: { outcomes: [ { claim_line_id: "${l1}", outcome: "DENIED", denied_amount_cents: 100000, denial_category: "TECHNICAL", issue_code_id: "${ic}" } ] }, as: PayerAgent, as_user_id: "${p1}", captures: { c_st: $.data.status, c_den: $.data.total_denied_active_cents, c_det_at: $.data.determination_issued_at } }
          assert:
            - "c_st == \"DETERMINATION_ISSUED\" and c_den == 100000 in the SAME response"
            - "c_det_at == \"2026-08-01T00:00:00Z\" (logical clock default)"
