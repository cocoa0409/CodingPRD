  # ─────────────────────────────────────────────────────────────────────
  - rule_id: resource_temporal_overlap
    instances:
      - name: second_enrollment_overlaps_active_coverage_same_year
        grounds:
          - validations[priority=13]
          - errors[ERR_OVERLAPPING_COVERAGE]
          - state_machines.Enrollment.DETERMINED_to_ENROLLED
          - entities.Enrollment.fields.effective_date
        distinguishing_aspect: |
          Interval semantics: closed-interval coverage-period overlap on the Household's Enrollment resource.
          A household already holding a non-TERMINATED enrollment for coverage_year 2026 cannot create a second
          enrollment whose coverage interval shares any day with the first; ERR_OVERLAPPING_COVERAGE (409).
          Both intervals are closed on both ends — adjacency counts only if they share a boundary day.
        test_recipe:
          setup:
            - "Household hh15 (RA01,2026) already has one PENDING_EFFECTUATION enrollment for 2026 (full-year coverage)."
            - "A second DETERMINED application exists for the same household and a same-area 2026 plan."
