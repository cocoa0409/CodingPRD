  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirmed_hit_depth4_block_cascade
        grounds:
          - state_machines.SanctionsReviewCase.OPEN_to_CONFIRMED_HIT
          - state_machines.Vendor.SUSPENDED_to_BLOCKED
          - state_machines.Invoice.IN_PAYMENT_RUN_to_ON_HOLD
          - state_machines.Payment.PENDING_to_VOIDED
          - state_machines.PaymentRun.APPROVED_to_COMPILED
        distinguishing_aspect: |
          Depth-4 chain from disposition: case CONFIRMED_HIT -> Vendor BLOCKED -> IN_PAYMENT_RUN
          invoice ON_HOLD -> its PENDING payment VOIDED (VENDOR_BLOCKED) -> run totals recomputed to
          0/0 and the APPROVED run auto-demotes to COMPILED. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Vendor 'Cascade Holdings' ACTIVE (2026-06-01), bank VERIFIED primary, aged"
            - "inv1 100000 APPROVED and added to run (pay1 PENDING); run COMPILED then APPROVED"
            - "inv2 200000 PENDING_APPROVAL; inv3 50000 APPROVED (never added)"
            - "Watchlist REVIEW entry 'Cascade Holding' created AFTER onboarding; PATCH of legal_name to 'Cascade Holding' re-screens REVIEW: vendor SUSPENDED, case OPEN, inv2/inv3 ON_HOLD"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin, as_user_id: "u-sys-01" }
            - { call: "POST /approval-matrix-rules", payload: { cost_center: "GLOBAL", min_amount_cents: 0, max_amount_cents: 500000, tier: 1 }, as: Controller, as_user_id: "u-ctl-01" }
            - call: "POST /vendors"
              payload: { legal_name: "Cascade Holdings", tax_id: "10-0000006", remit_email: "ap@ch.com", phone: "+1-555-0700", address_line1: "8 Willow St", city: "Springfield", country: "US" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { v_id: $.data.id }
            - { call: "POST /vendors/${v_id}/documents", payload: { doc_type: "W9", valid_from: "2026-01-01", valid_until: "2027-12-31" }, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/submit", payload: {}, as: VendorSpecialist, as_user_id: "u-vs-01" }
            - { call: "POST /vendors/${v_id}/approve", payload: {}, as: VendorManager, as_user_id: "u-vm-01", captures: { v_ver: $.data.version } }
            - call: "POST /vendors/${v_id}/bank-accounts"
              payload: { account_number: "000222333444", routing_number: "021000021", account_holder_name: "Cascade Holdings", is_primary: true, expected_vendor_version: "${v_ver}" }
              as: VendorSpecialist
              as_user_id: "u-vs-01"
              captures: { ba_id: $.data.id }
