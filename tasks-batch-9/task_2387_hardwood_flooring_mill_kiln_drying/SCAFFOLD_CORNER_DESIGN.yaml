            - { call: "POST /mill/core-stocks", payload: { product_line_id: "${eng_line}", core_material: "BIRCH_PLY", lot_reference: "BP-2026-04", available_square_feet: 4000.00 }, as: MillAdmin, captures: { core_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/flooring-lots", payload: { product_line_id: "${eng_line}", kiln_charge_id: "${charge_a}", core_stock_id: "${core_id}", input_dry_bf: 2900 }, as: MillSupervisor, captures: { lot_big: "$.data.id" } }
