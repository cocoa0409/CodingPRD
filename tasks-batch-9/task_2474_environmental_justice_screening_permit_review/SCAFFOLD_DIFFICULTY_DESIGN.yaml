    instances:
      - name: decision_state_precondition_outranks_assessment_not_accepted
        grounds:
          - validations[priority=9]
          - validations[priority=19]
          - errors[ERR_INVALID_APPLICATION_STATE]
          - errors[ERR_ASSESSMENT_NOT_ACCEPTED]
          - state_machines.PermitApplication.PENDING_DECISION_to_ISSUED
        distinguishing_aspect: |
          Error-category pair is state (priority 9) versus business_referential
          (priority 19): an ISSUE decision on an ENHANCED_REVIEW application whose only
          assessment is still DRAFT violates both, and the response MUST be
          ERR_INVALID_APPLICATION_STATE (409), never ERR_ASSESSMENT_NOT_ACCEPTED.
