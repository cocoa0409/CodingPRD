            - "HospitalContract.${c1}.accrued_case_count == 1 and accrued_case_fee_cents == 400000 - the refused supersede posted no second accrual"
            - "${e_stale_contract} == ERR_STALE_CONTRACT_VERSION with HTTP 412 for the update quoting one version behind"
            - "HospitalContract.${c1}.per_case_fee_cents is still 400000 immediately after that refusal"
            - "the second update returns HTTP 200 with per_case_fee_cents == 450000 and version == ${c1_v_now2} + 1"
            - "${c1_v_now2} > 1 - the contract's version was advanced by the accrual cascade of the assignment, not only by direct writes to the contract"

      - name: preference_card_selector_prefers_revision_over_recency_and_pins_the_choice
        claim_type: selector_policy
        grounds:
          - endpoints[POST /bypass-cases/{id}/disposable-packs]
          - endpoints[POST /preference-cards]
          - entities.PreferenceCard.fields.revision
          - entities.PreferenceCard.fields.status
          - entities.DisposablePack.fields.applied_preference_card_id
        distinguishing_aspect: |
          Two ACTIVE cards exist for (s1, CABG) - revision 3 created earlier and revision 2 created later -
          so the selector's revision DESC, created_at DESC order must apply the revision-3 card; an
          implementation ordering by recency applies the revision-2 card and materialises the wrong lines,
          the wrong prime volume and the wrong cost.
        test_recipe:
          setup:
            - "LEAN BASE chain through assign-perfusionist, whose card pc1 is revision 1 for (s1, CABG)."
            - "A revision-3 card cardHi (single line A_OXYGENATOR 1055, prime 1600) created next, which supersedes pc1, then a revision-2 card cardMid (single line Z_BUDGET_PACK 500, prime 1200) created last, which leaves cardHi ACTIVE."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1600, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 3 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { cardHi: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1200, pack_line_items: [ { line_code: "Z_BUDGET_PACK", quantity: 1, unit_cost_cents: 500 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "ANTIFIBRINOLYTIC", min_hematocrit_pct: 30, revision: 2 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { cardMid: $.data.id }
          trigger:
            - call: "POST /bypass-cases/${case1}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { packSel: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1700, pack_line_items: [ { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 } ], required_safety_check_codes: ["ACT_BASELINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 3 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { cardTop: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T13:31:00Z", scheduled_end: "2026-08-02T19:31:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case2: $.data.id, case2_v: $.data.version }
            - call: "POST /bypass-cases/${case2}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case2_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
            - call: "POST /bypass-cases/${case2}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { packSel2: $.data.id }
          assert:
            - "after the two card creations PreferenceCard.${pc1}.status == SUPERSEDED, PreferenceCard.${cardHi}.status == ACTIVE and PreferenceCard.${cardMid}.status == ACTIVE - a new card supersedes only cards at or below its own revision"
            - "DisposablePack.${packSel}.applied_preference_card_id == ${cardHi} - revision 3 beats the more recently created revision 2"
            - "DisposablePack.${packSel}.pack_cost_cents == 1139 (1055 discounted 10 percent to 949.5 then marked up 20 percent to 1139.4, rounded half-up) and prime_volume_ml == 1600"
            - "DisposablePack.${packSel}.line_items has exactly 1 element with line_code == A_OXYGENATOR - the revision-2 card's Z_BUDGET_PACK line appears nowhere"
            - "after cardTop is created PreferenceCard.${cardHi}.status == SUPERSEDED and PreferenceCard.${cardMid}.status == SUPERSEDED, with PreferenceCard.${cardTop}.status == ACTIVE"
            - "DisposablePack.${packSel}.applied_preference_card_id is still ${cardHi} with pack_cost_cents still 1139 and prime_volume_ml still 1600 - an existing pack keeps its pinned card"
            - "DisposablePack.${packSel2}.applied_preference_card_id == ${cardTop} with pack_cost_cents == 1247 and prime_volume_ml == 1700 - the new case applies the only ACTIVE card"
            - "GET /preference-cards?surgeon_id=${s1}&procedure_type=CABG&status=ACTIVE returns total_count == 1"

      - name: alarm_cascade_is_verified_end_to_end_across_four_links
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PerfusionDevice.AVAILABLE_to_NEEDS_SERVICE
          - endpoints[POST /perfusion-devices/{id}/event-logs]
          - errors.ERR_DEVICE_FALLBACK_REQUIRED
        distinguishing_aspect: |
          One event log must move the device, revert only the pre-bypass cases holding it, invalidate their
          checklists and unwind their accruals, in that order, leaving ON_BYPASS cases untouched.
        excluded_because:
          difficulty_instance: "transitive_cascade / critical_alarm_cascades_device_case_checklist_billing"
          rationale: |
            That instance drives the ALARM_CRITICAL log against a fixture holding one PACK_CONFIGURED case,
            one SETUP_VERIFIED case and one ON_BYPASS case and asserts all four links plus the untouched
            ON_BYPASS case and the decremented contract ledger.

      - name: the_two_dual_variant_calculations_diverge_and_reconcile
        claim_type: dual_variant_calculation
        grounds:
          - calculations.case_fee_settlement.variants
          - calculations.perfusionist_readiness_score.variants
        distinguishing_aspect: |
          Both declared dual-variant calculations must produce different numbers for the same data and post
          the delta once when the variant switches.
        excluded_because:
          difficulty_instance: "dual_variant_calc / case_fee_provisional_vs_final_diverges_on_actual_pump_time"
          rationale: |
            That instance and its sibling readiness_admission_counts_pending_ce_audit_does_not together pin
            both variant pairs and the ledger delta posted at the provisional-to-final switch.

  - section: consistency_model
    instances:
      - name: assignment_effects_are_visible_in_the_same_response_and_on_immediate_reads
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /bypass-cases/{id}/assign-perfusionist]
          - entities.HospitalContract.fields.accrued_case_fee_cents
          - entities.Perfusionist.fields.readiness_score
        distinguishing_aspect: |
          The assignment's own 200 response must already carry the provisional fee and the new case status,
          and reads issued immediately afterwards must show the contract ledger, the perfusionist score and
          the coverage posture at their post-write values - nothing in this domain is allowed to settle later.
        test_recipe:
          setup:
            - "LEAN BASE chain through case creation, so case1 is SCHEDULED, the contract ledger is empty and p1 has readiness_score 0.0."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1: $.data.id, case1_v: $.data.version }
          trigger:
            - call: "POST /bypass-cases/${case1}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${case1_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { case1_v3: $.data.version }
            - call: "GET /hospital-contracts/${c1}"
              as: ContractAdmin
            - call: "GET /perfusionists/${p1}"
              as: ContractAdmin
            - call: "GET /bypass-cases/${case1}"
              as: ContractAdmin
          assert:
            - "the assignment response itself carries data.bypass_status == 'STAFFED', data.assigned_perfusionist_id == ${p1}, data.provisional_fee_cents == 400000, data.accrued_fee_cents == 400000, data.billing_status == 'PROVISIONAL_ACCRUED' and data.version == ${case1_v3}"
            - "the immediately following contract read shows accrued_case_fee_cents == 400000 and accrued_case_count == 1"
            - "the same contract read shows coverage_posture == THIN - the posture is recomputed on read from the single PRIMARY_CALL slot, with no staleness window"
            - "the perfusionist read shows readiness_score == 0.694 and readiness_variant_last == ADMISSION, written by the same request"
            - "the case read is byte-identical in its bypass_status, assigned_perfusionist_id, provisional_fee_cents, accrued_fee_cents, billing_status and version to the assignment response body"
            - "no repeated read changes any of these values - a second GET of the contract still shows accrued_case_fee_cents == 400000"
