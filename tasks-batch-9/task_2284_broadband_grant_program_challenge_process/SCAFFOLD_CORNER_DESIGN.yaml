      - name: ehcl_waiver_disabled_retains_high_cost_location
        claim_type: conditional_validation
        grounds:
          - entities.GrantProgram.fields.ehcl_waiver_enabled
          - calculations.award_obligation_amount
          - validations.ERR_ALL_LOCATIONS_EHCL_DEFERRED
        distinguishing_aspect: |
          Step 4 of the obligation waterfall is gated on a per-program flag. With
          ehcl_waiver_enabled false, a claim of 3000000 cents that is strictly above the 2500000
          threshold is still flagged is_ehcl but is NOT deferred: the location becomes AWARD_BOUND,
          ehcl_deferred_count stays 0 and the award obligates 2250000. With the flag left at its
          default of true the identical fixture would instead empty the retained set and be refused
          at priority 90, so the flag alone changes the outcome from 201 to a 4xx.
        test_recipe:
          setup:
            - "Program created with ehcl_waiver_enabled false (all other thresholds defaulted), CHALLENGE_OPEN at clock 2026-08-10T00:00:00Z."
