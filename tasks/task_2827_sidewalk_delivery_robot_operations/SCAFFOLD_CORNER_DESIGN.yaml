              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "POST /merchants"
              payload: { zone_id: "${z}", name: "Corner Bakery" }
              as: PlatformAdmin
              captures: { m: $.data.id }
            - call: "POST /robots"
              payload: { zone_id: "${z}", asset_tag: "RBT-001", width_cm: 78.0, container_capacity_liters: 60.0, max_speed_cm_s: 150 }
