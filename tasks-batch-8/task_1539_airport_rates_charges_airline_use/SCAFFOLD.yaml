# =============================================================================
# PRD Benchmark Scaffold — task_1539_airport_rates_charges_airline_use
# =============================================================================

scenario: |
  Airport Rates & Charges / Airline Use Agreement (airport finance department):
  cost-center allocation (airfield/terminal) & rate-setting methodology,
  residual vs compensatory approach, signatory vs non-signatory rate differential,
  landing fee by weight & terminal rent by space, annual settlement/true-up & credit,
  majority-in-interest approval on capital projects, PFC eligibility & collection,
  rate consultation & dispute.

domain_name: airport-rates-charges
api_prefix: /airport

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (10 entities)
# =============================================================================
entities:
  - name: FiscalYear
    parent: null
    common_fields: true
    fields:
      - { name: year_label, type: string, source: input, description: "Unique label e.g. FY2027", constraints: "unique; immutable after creation" }
      - { name: methodology, type: enum, source: input, description: "RESIDUAL | COMPENSATORY | HYBRID — rate-setting methodology for the year" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED — DRAFT until opened, CLOSED after settlement finalization" }
      - { name: airfield_opex_cents, type: integer, source: input, description: "Total airfield operating + capital-amortization cost pool for the year, in cents", constraints: ">= 0" }
      - { name: terminal_opex_cents, type: integer, source: input, description: "Total terminal operating + capital-amortization cost pool for the year, in cents", constraints: ">= 0" }
      - { name: nonairline_airfield_revenue_cents, type: integer, source: input, description: "Non-airline revenue offset credited against airfield pool (concessions, fuel flowage, etc.), cents", constraints: ">= 0" }
      - { name: nonairline_terminal_revenue_cents, type: integer, source: input, description: "Non-airline revenue offset credited against terminal pool (retail, parking share, etc.), cents", constraints: ">= 0" }
      - { name: terminal_total_space_sqft, type: integer, source: input, description: "Gross rentable terminal square footage", constraints: "> 0" }
      - { name: forecast_landed_weight_kg, type: integer, source: input, description: "Airport forecast of total signatory + non-signatory landed weight for the year, kg", constraints: "> 0" }
      - { name: prior_year_surplus_cents, type: integer, source: input, description: "Residual-methodology credit carried forward from prior-year settlement (may be negative = deficit)", constraints: "any integer; defaults 0 when methodology=COMPENSATORY", default: 0 }
      - { name: total_projected_landed_weight_kg, type: integer, source: computed, description: "Sum of ActivityRecord.landed_weight_kg over all records tied to this FiscalYear", default: 0 }
      - { name: total_signatory_landed_weight_kg, type: integer, source: computed, description: "Sum of landed_weight_kg over ActivityRecords whose airline is SIGNATORY at the time of the activity", default: 0 }
      - { name: total_rented_space_sqft, type: integer, source: computed, description: "Sum of AirlineAgreement.rented_space_sqft for agreements in ACTIVE status", default: 0 }
      - { name: settlement_id, type: string, source: system, description: "back-reference id of the AnnualSettlement for this year (not a FK; reverse-reachable via GET /airport/settlements/{id})", constraints: "nullable" }

  - name: Airline
    parent: null
    common_fields: true
    fields:
      - { name: iata_code, type: string, source: input, description: "2-letter IATA carrier code", constraints: "unique, uppercase, ^[A-Z]{2}$" }
      - { name: legal_name, type: string, source: input, description: "Carrier legal name" }
      - { name: carrier_class, type: enum, source: input, description: "PASSENGER | CARGO | CHARTER — drives PFC remit eligibility rules" }
      - { name: pfc_approved, type: boolean, source: input, description: "Whether carrier holds FAA PFC collection approval at this airport", default: false }
      - { name: mii_eligible_weight_kg, type: integer, source: computed, description: "Landed weight credited toward MII denominator — computed at vote close from activity in the rolling 12-month window" }

  - name: AirlineAgreement
    parent: null
    common_fields: true
    fields:
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id; the carrier under agreement" }
      - { name: fiscal_year_id, type: string, source: input, description: "FK -> FiscalYear.id; year this agreement covers" }
      - { name: signature_status, type: enum, source: system, description: "SIGNATORY | NON_SIGNATORY — parallel dimension 1; set by countersign/decline/lapse transitions" }
      - { name: credit_standing, type: enum, source: system, description: "GOOD | DELINQUENT | SUSPENDED — parallel dimension 2; driven by settlement line payment behavior" }
      - { name: rented_space_sqft, type: integer, source: input, description: "Terminal square footage under exclusive/preferential lease", constraints: ">= 0; when > 0 agreement MUST end SIGNATORY" }
      - { name: countersign_deadline, type: datetime, source: system, description: "ISO timestamp = RatesSetting.adopted_at + 30 days; deadline for carrier countersignature" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> AirlineAgreement.id; set when a newer agreement supersedes this one (CREATE-with-supersede)", constraints: "nullable" }

  - name: RatesSetting
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONSULTATION | ADOPTED | SUPERSEDED | EXPIRED" }
      - { name: airfield_requirement_cents, type: integer, source: computed, description: "airfield_opex - nonairline_airfield_revenue + (methodology=RESIDUAL ? prior_year_surplus : 0)" }
      - { name: signatory_landing_fee_per_1000kg_cents, type: integer, source: computed, description: "Per-1000-kg signatory landing fee; formula depends on methodology + forecast denominator; rounding per landing_fee_rate calc" }
      - { name: non_signatory_landing_fee_per_1000kg_cents, type: integer, source: computed, description: "= ceil(signatory_rate * NON_SIGNATORY_MARKUP_PCT / 100); pinned in calc" }
      - { name: terminal_rental_rate_per_sqft_year_cents, type: integer, source: computed, description: "terminal requirement / terminal_total_space_sqft, round_half_up to cents" }
      - { name: adopted_at, type: datetime, source: system, description: "ISO timestamp set at ADOPT transition; null otherwise", constraints: "nullable" }
      - { name: consultation_comment_count, type: integer, source: computed, description: "Number of ConsultationComment records against this RatesSetting", default: 0 }

  - name: ConsultationComment
    parent: RatesSetting
    common_fields: false
    fields:
      - { name: rates_setting_id, type: string, source: system, description: "FK -> RatesSetting.id" }
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id; commenting carrier" }
      - { name: body, type: string, source: input, description: "Free-text comment" }
      - { name: submitted_at, type: datetime, source: system, description: "ISO timestamp (logical clock)" }

  - name: ActivityRecord
    parent: FiscalYear
    common_fields: false
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id" }
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id" }
      - { name: activity_date, type: datetime, source: input, description: "ISO date of flight activity (logical-clock validated against fiscal-year window)" }
      - { name: landed_weight_kg, type: integer, source: input, description: "Maximum certificated gross landing weight actually landed this record, kg", constraints: "> 0" }
      - { name: signature_status_at_activity, type: enum, source: input, description: "SIGNATORY | NON_SIGNATORY — snapshot of carrier status on activity_date (drives rate pick)" }
      - { name: billed_landing_fee_cents, type: integer, source: computed, description: "landing fee charged for this record per landing_fee_charge calc; stamped at creation" }

  - name: CapitalProject
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id" }
      - { name: project_name, type: string, source: input, description: "Project name" }
      - { name: cost_center, type: enum, source: input, description: "AIRFIELD | TERMINAL — which pool would absorb the cost" }
      - { name: budget_cents, type: integer, source: input, description: "Proposed project budget", constraints: "> 0" }
      - { name: mii_threshold_pct, type: integer, source: input, description: "MII approval threshold percent applied to BOTH count and weight legs", constraints: "50 <= x <= 100" }
      - { name: status, type: enum, source: system, description: "PROPOSED | MII_VOTING | APPROVED | REJECTED | VETOED | CANCELLED" }
      - { name: votes_for_count, type: integer, source: computed, description: "Count of distinct signatory airlines with APPROVE MIIVote", default: 0 }
      - { name: votes_for_weight_kg, type: integer, source: computed, description: "Sum of mii_eligible_weight_kg over APPROVE voters", default: 0 }
      - { name: votes_against_weight_kg, type: integer, source: computed, description: "Sum of mii_eligible_weight_kg over REJECT voters (drives VETOED branch)", default: 0 }

  - name: MIIVote
    parent: CapitalProject
    common_fields: false
    fields:
      - { name: capital_project_id, type: string, source: system, description: "FK -> CapitalProject.id" }
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id; must be SIGNATORY in an ACTIVE AirlineAgreement for this FiscalYear at cast time" }
      - { name: ballot, type: enum, source: input, description: "APPROVE | REJECT" }
      - { name: cast_at, type: datetime, source: system, description: "ISO timestamp (logical clock)" }

  - name: AnnualSettlement
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMPUTED | AIRLINE_REVIEW | DISPUTED | RESOLVED | FINALIZED" }
      - { name: actual_airfield_requirement_cents, type: integer, source: computed, description: "airfield requirement recomputed against actual pools and actual weights" }
      - { name: actual_terminal_requirement_cents, type: integer, source: computed, description: "terminal requirement recomputed against actual pools and actual rented space" }
      - { name: total_billed_landing_cents, type: integer, source: computed, description: "Sum of billed_landing_fee_cents over ActivityRecords for this FiscalYear", default: 0 }
      - { name: total_billed_terminal_cents, type: integer, source: computed, description: "Sum over ACTIVE agreements of rented_space_sqft * adopted terminal rate", default: 0 }
      - { name: total_true_up_cents, type: integer, source: computed, description: "(actual_airfield + actual_terminal) - (total_billed_landing + total_billed_terminal); positive = airlines owe, negative = airport credits" }

  - name: AirlineSettlementLine
    parent: AnnualSettlement
    common_fields: true
    fields:
      - { name: annual_settlement_id, type: string, source: system, description: "FK -> AnnualSettlement.id" }
      - { name: airline_id, type: string, source: system, description: "FK -> Airline.id" }
      - { name: actual_airfield_share_cents, type: integer, source: computed, description: "This airline's actual airfield requirement share under the true-up waterfall" }
      - { name: actual_terminal_share_cents, type: integer, source: computed, description: "This airline's actual terminal requirement share under the waterfall" }
      - { name: billed_landing_cents, type: integer, source: computed, description: "This airline's share of total_billed_landing_cents" }
      - { name: billed_terminal_cents, type: integer, source: computed, description: "This airline's share of total_billed_terminal_cents" }
      - { name: true_up_cents, type: integer, source: computed, description: "(actual_airfield_share + actual_terminal_share) - (billed_landing + billed_terminal); positive = airline owes, negative = airport credits airline" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PAID | CREDITED | WRITTEN_OFF — driven by record-payment or credit application" }

  - name: PFCApplication
    parent: FiscalYear
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id" }
      - { name: airline_id, type: string, source: input, description: "FK -> Airline.id; remitting carrier" }
      - { name: enplaned_passengers, type: integer, source: input, description: "Number of revenue enplaned passengers subject to PFC", constraints: ">= 0" }
      - { name: pfc_amount_cents, type: integer, source: computed, description: "= enplaned_passengers * PFC_PER_PAX_CENTS; only when carrier is PFC-eligible" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Populated when status=REJECTED", constraints: "nullable" }

# =============================================================================
# Table 2: State Machine Table (5 machines, incl. parallel + cyclic + branching)
# =============================================================================
state_machines:
  - entity: FiscalYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /airport/fiscal_years/{fy_id}/open"
        actor: AirportFinance
        preconditions:
          - "methodology is set"
          - "airfield_opex_cents, terminal_opex_cents, terminal_total_space_sqft, forecast_landed_weight_kg all > 0 where required"
        side_effects:
          - "status = OPEN"
          - "increments FiscalYear.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system — fired automatically when AnnualSettlement.status transitions COMPUTED|RESOLVED → FINALIZED"
        actor: system
        preconditions:
          - "FiscalYear.settlement_id is not null"
          - "AnnualSettlement.status == FINALIZED"
        side_effects:
          - "status = CLOSED"
          - "blocks further ActivityRecord creation (validation priority 9)"
          - "increments FiscalYear.version by 1"

  - entity: RatesSetting
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: DRAFT
        to: CONSULTATION
        trigger: "POST /airport/rates_settings/{id}/publish"
        actor: AirportFinance
        preconditions:
          - "parent FiscalYear.status == OPEN"
          - "computed rate fields populated"
        side_effects:
          - "status = CONSULTATION"
          - "consultation_comment_count = 0"
          - "increments RatesSetting.version by 1"
      - from: CONSULTATION
        to: ADOPTED
        trigger: "POST /airport/rates_settings/{id}/adopt"
        actor: AirportDirector
        preconditions:
          - "logical clock time >= RatesSetting created_at + CONSULTATION_MIN_DAYS (default 30 days)"
          - "parent FiscalYear.status == OPEN"
        side_effects:
          - "status = ADOPTED; adopted_at = current logical time"
          - "for every ACTIVE AirlineAgreement on this FiscalYear: countersign_deadline = adopted_at + 30 days (cascades, increments agreement.version)"
          - "increments RatesSetting.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system — fired when a new RatesSetting on same FiscalYear transitions DRAFT → CONSULTATION (publish-supersedes)"
        actor: system
        preconditions: []
        side_effects:
          - "status = SUPERSEDED"
          - "existing ACTIVE AirlineAgreements keyed to this RatesSetting become supersession-eligible"
          - "increments RatesSetting.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "system — fired when parent FiscalYear transitions OPEN → CLOSED while this RatesSetting is still DRAFT"
        actor: system
        preconditions: []
        side_effects:
          - "status = EXPIRED"

  - entity: AirlineAgreement
    initial_state: NON_SIGNATORY  # signature_status dimension; credit_standing starts GOOD
    terminal_states: []           # parallel dimensions; no terminal — signature_status: SIGNATORY|NON_SIGNATORY, credit_standing: GOOD|DELINQUENT|SUSPENDED
    transitions:
      - from: NON_SIGNATORY
        to: SIGNATORY
        trigger: "POST /airport/airline_agreements/{id}/countersign"
        actor: SignatoryAirline
        preconditions:
          - "logical clock time <= countersign_deadline (ERR_COUNTERSIGN_LAPSED otherwise)"
          - "parent RatesSetting.status == ADOPTED"
          - "credit_standing != SUSPENDED"
        side_effects:
          - "signature_status = SIGNATORY"
          - "FiscalYear.total_rented_space_sqft recomputed (rented_space_sqft now counted)"
          - "increments AirlineAgreement.version by 1"
      - from: SIGNATORY
        to: NON_SIGNATORY
        trigger: "system — fired when logical clock advances past countersign_deadline while still SIGNATORY but payment_status of any open AirlineSettlementLine is PENDING past due (lapse), OR when POST /airport/airline_agreements/{id}/decline-renewal is called"
        actor: system
        preconditions: []
        side_effects:
          - "signature_status = NON_SIGNATORY"
          - "FiscalYear.total_rented_space_sqft recomputed (rented_space_sqft no longer counted)"
          - "cascade: any APPROVE MIIVote cast by this Airline on a CapitalProject still in MII_VOTING is excluded from votes_for_count and votes_for_weight_kg recomputation"
          - "increments AirlineAgreement.version by 1"
      - from: GOOD
        to: DELINQUENT
        trigger: "system — fired when logical clock passes AirlineSettlementLine payment due date with payment_status=PENDING"
        actor: system
        preconditions: []
        side_effects:
          - "credit_standing = DELINQUENT"
          - "increments AirlineAgreement.version by 1"
      - from: DELINQUENT
        to: SUSPENDED
        trigger: "POST /airport/airline_agreements/{id}/suspend"
        actor: AirportFinance
        preconditions:
          - "at least one AirlineSettlementLine for this airline on this FiscalYear has payment_status == PENDING"
        side_effects:
          - "credit_standing = SUSPENDED"
          - "while SUSPENDED: blocks ActivityRecord creation for this airline (ERR_AIRLINE_SUSPENDED)"
          - "increments AirlineAgreement.version by 1"
      - from: DELINQUENT
        to: GOOD
        trigger: "system — fired when all open AirlineSettlementLines for this airline transition to PAID or CREDITED"
        actor: system
        preconditions: []
        side_effects:
          - "credit_standing = GOOD"
          - "increments AirlineAgreement.version by 1"
      - from: SUSPENDED
        to: GOOD
        trigger: "POST /airport/airline_agreements/{id}/reinstate"
        actor: AirportFinance
        preconditions:
          - "no AirlineSettlementLine for this airline on this FiscalYear has payment_status == PENDING"
        side_effects:
          - "credit_standing = GOOD"
          - "increments AirlineAgreement.version by 1"

  - entity: CapitalProject
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, VETOED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: MII_VOTING
        trigger: "POST /airport/capital_projects/{id}/open-voting"
        actor: AirportFinance
        preconditions:
          - "parent FiscalYear.status == OPEN"
        side_effects:
          - "status = MII_VOTING"
          - "votes_for_count = 0; votes_for_weight_kg = 0; votes_against_weight_kg = 0"
          - "increments CapitalProject.version by 1"
      - from: MII_VOTING
        to: APPROVED
        trigger: "system — fired on MIIVote insert when BOTH (a) votes_for_count * 100 >= mii_threshold_pct * total_signatory_count AND (b) votes_for_weight_kg * 100 >= mii_threshold_pct * total_signatory_weight_kg"
        actor: system
        preconditions: []
        side_effects:
          - "status = APPROVED"
          - "post-approval: any subsequent REJECT vote is rejected with ERR_PROJECT_ALREADY_DECIDED"
      - from: MII_VOTING
        to: VETOED
        trigger: "system — fired on MIIVote insert when votes_against_weight_kg * 100 > (100 - mii_threshold_pct) * total_signatory_weight_kg (blocking-minority veto on the weight leg)"
        actor: system
        preconditions: []
        side_effects:
          - "status = VETOED"
          - "post-veto: subsequent votes rejected with ERR_PROJECT_ALREADY_DECIDED"
      - from: MII_VOTING
        to: REJECTED
        trigger: "POST /airport/capital_projects/{id}/close-voting"
        actor: AirportFinance
        preconditions:
          - "neither APPROVED nor VETOED threshold was reached during open voting"
        side_effects:
          - "status = REJECTED"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /airport/capital_projects/{id}/cancel"
        actor: AirportFinance
        preconditions: []
        side_effects:
          - "status = CANCELLED"

  - entity: AnnualSettlement
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: COMPUTED
        trigger: "POST /airport/fiscal_years/{fy_id}/settlement/compute"
        actor: AirportFinance
        preconditions:
          - "parent FiscalYear.status == OPEN"
          - "at least one ActivityRecord exists for the FiscalYear (ERR_NO_ACTIVITY otherwise)"
        side_effects:
          - "runs annual_true_up calculation"
          - "creates one AirlineSettlementLine per Airline with any activity or rented space in the year"
          - "sets FiscalYear.settlement_id"
          - "increments AnnualSettlement.version by 1; increments FiscalYear.version by 1"
      - from: COMPUTED
        to: AIRLINE_REVIEW
        trigger: "POST /airport/settlements/{id}/publish-review"
        actor: AirportFinance
        preconditions: []
        side_effects:
          - "status = AIRLINE_REVIEW"
          - "cascade: each AirlineSettlementLine.payment_status = PENDING and a 60-day payment due-date is stamped on the line"
      - from: AIRLINE_REVIEW
        to: DISPUTED
        trigger: "POST /airport/settlements/{id}/dispute"
        actor: SignatoryAirline
        preconditions:
          - "caller airline must have an AirlineSettlementLine in this settlement"
          - "dispute must be raised within DISPUTE_WINDOW_DAYS (45) of publish-review"
        side_effects:
          - "status = DISPUTED"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /airport/settlements/{id}/resolve"
        actor: AirportDirector
        preconditions:
          - "resolution_payload.override_true_up_cents is present when director overrides; else system-recomputed true_up_cents stands"
        side_effects:
          - "status = RESOLVED"
          - "if override present: rewrite AirlineSettlementLine.true_up_cents per override allocation waterfall; payment_status reset to PENDING for affected lines"
      - from: RESOLVED
        to: DISPUTED
        trigger: "POST /airport/settlements/{id}/dispute (cycle: dispute may reopen a RESOLVED settlement if reopened within DISPUTE_WINDOW_DAYS of the resolve action)"
        actor: SignatoryAirline
        preconditions:
          - "caller airline must have an AirlineSettlementLine in this settlement"
          - "reopen is within DISPUTE_WINDOW_DAYS of the most recent resolve"
        side_effects:
          - "status = DISPUTED"
      - from: RESOLVED
        to: FINALIZED
        trigger: "POST /airport/settlements/{id}/finalize"
        actor: AirportDirector
        preconditions:
          - "no AirlineSettlementLine has payment_status == PENDING (each is PAID, CREDITED, or WRITTEN_OFF)"
        side_effects:
          - "status = FINALIZED"
          - "cascade: parent FiscalYear.status OPEN → CLOSED"
          - "cascade: any RatesSetting on this FiscalYear still in DRAFT transitions to EXPIRED"
      - from: AIRLINE_REVIEW
        to: FINALIZED
        trigger: "POST /airport/settlements/{id}/finalize"
        actor: AirportDirector
        preconditions:
          - "no AirlineSettlementLine has payment_status == PENDING"
        side_effects:
          - "status = FINALIZED"
          - "cascade: parent FiscalYear.status OPEN → CLOSED"
          - "cascade: any RatesSetting on this FiscalYear still in DRAFT transitions to EXPIRED"

# =============================================================================
# §1.2.1 Concurrency Rules (true OCC races only)
# =============================================================================
concurrency_rules:
  - rule_id: rates-setting-create-stale-fy
    parent_entity: FiscalYear
    write_endpoint: "POST /airport/fiscal_years/{fy_id}/rates_settings"
    occ_field: "expected_fiscal_year_version"
    description: |
      Creating a RatesSetting against a FiscalYear whose version has advanced
      since the client last observed it is rejected. Captures the case where
      another writer has just published a RatesSetting on the same FiscalYear
      (which legitimately supersedes the prior DRAFT), leaving the current
      writer's view stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-recompute-stale-settlement
    parent_entity: AnnualSettlement
    write_endpoint: "POST /airport/settlements/{id}/recompute"
    occ_field: "expected_annual_settlement_version"
    description: |
      Recomputing an AnnualSettlement whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      writer has just resolved a dispute (legitimately overwriting
      true_up_cents via the override waterfall) and the current writer's
      baseline is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (7 rules)
# =============================================================================
calculations:
  - name: landing_fee_rate
    trigger: "RatesSetting transitions DRAFT → CONSULTATION (publish); also re-derived on GET /airport/rates_settings/{id}"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order pinned (circular-looking dependency broken):
      #   step 1: airfield_requirement_cents (depends on methodology + prior_year_surplus)
      #   step 2: choose denominator
      #   step 3: rate
      #   step 4: non-signatory markup (depends on step 3 result)
      #
      # RESIDUAL:
      #   airfield_requirement_cents = airfield_opex_cents
      #                                - nonairline_airfield_revenue_cents
      #                                + prior_year_surplus_cents           # may push requirement up or down
      #   denominator_kg = forecast_landed_weight_kg                       # residual: ALL traffic
      # COMPENSATORY:
      #   airfield_requirement_cents = airfield_opex_cents - nonairline_airfield_revenue_cents
      #   denominator_kg = forecast_landed_weight_kg                       # forecast base; signatory-only at settlement
      # HYBRID:
      #   airfield_requirement_cents = airfield_opex_cents - nonairline_airfield_revenue_cents
      #                                + floor(prior_year_surplus_cents / 2)   # half the carry-forward
      #   denominator_kg = forecast_landed_weight_kg
      #
      # signatory_landing_fee_per_1000kg_cents =
      #     round_half_up( airfield_requirement_cents * 1000 / denominator_kg )
      # non_signatory_landing_fee_per_1000kg_cents =
      #     ceil( signatory_landing_fee_per_1000kg_cents * NON_SIGNATORY_MARKUP_PCT / 100 )
    input_set: "FiscalYear fields as keyed by RatesSetting.fiscal_year_id; RatesSetting in DRAFT or CONSULTATION"
    constants:
      NON_SIGNATORY_MARKUP_PCT: 125
      KG_PER_RATE_UNIT: 1000
    precision: "integer cents; round_half_up on signatory rate; ceil on non-signatory"
    variants:
      - name: residual_methodology
        when: "FiscalYear.methodology == RESIDUAL"
        difference: "airfield requirement INCLUDES prior_year_surplus_cents (can be negative → deficit increases requirement)"
      - name: compensatory_methodology
        when: "FiscalYear.methodology == COMPENSATORY"
        difference: "airfield requirement EXCLUDES prior_year_surplus_cents entirely"
      - name: hybrid_methodology
        when: "FiscalYear.methodology == HYBRID"
        difference: "airfield requirement includes floor(prior_year_surplus_cents / 2)"

  - name: terminal_rental_rate
    trigger: "RatesSetting transitions DRAFT → CONSULTATION"
    algorithm: tiered_pricing
    formula: |
      # Terminal requirement then per-sqft rate; signatory vs non-signatory divergence
      terminal_requirement_cents = terminal_opex_cents - nonairline_terminal_revenue_cents
      terminal_rental_rate_per_sqft_year_cents =
          round_half_up( terminal_requirement_cents / terminal_total_space_sqft )
      # tier overlay: when total_rented_space_sqft / terminal_total_space_sqft >= OCCUPANCY_HIGH_TIER_PCT/100
      # the airport grants a signatory-volume discount by reducing the effective terminal requirement
      # by VOLUME_REBATE_PCT of the requirement attributable to signatory-rented space.
      # (Evaluation order: compute base rate first, then apply rebate at charge time, not at rate time.)
    input_set: "FiscalYear terminal pool fields; AirlineAgreement records with status ACTIVE for occupancy overlay"
    constants:
      OCCUPANCY_HIGH_TIER_PCT: 85
      VOLUME_REBATE_PCT: 5
    precision: "integer cents; round_half_up"

  - name: landing_fee_charge
    trigger: "ActivityRecord insert (billed_landing_fee_cents stamped at creation)"
    algorithm: threshold
    formula: |
      # rate_unit_kg = 1000
      # units = floor(landed_weight_kg / 1000); remainder = landed_weight_kg - units*1000
      # charge_units = units + (remainder >= REMAINDER_ROUND_UP_KG ? 1 : 0)
      # base_rate = signature_status_at_activity == SIGNATORY
      #             ? signatory_landing_fee_per_1000kg_cents
      #             : non_signatory_landing_fee_per_1000kg_cents
      # billed_landing_fee_cents = charge_units * base_rate
      # Rounding: round-half-up at the 500kg remainder boundary — a record at exactly 500kg rounds UP.
      # A record at 1499 kg → 1 unit + (499 >= 500 ? 0) = 1 unit. At 1500 kg → 1 + 1 = 2 units.
    input_set: "ActivityRecord.landed_weight_kg, ActivityRecord.signature_status_at_activity; current ADOPTED RatesSetting rates on the parent FiscalYear"
    constants:
      RATE_UNIT_KG: 1000
      REMAINDER_ROUND_UP_KG: 500
    precision: "integer cents"

  - name: annual_true_up
    trigger: "POST /airport/fiscal_years/{fy_id}/settlement/compute; also POST /airport/settlements/{id}/recompute"
    algorithm: waterfall_allocation
    formula: |
      # ---- Airfield share waterfall (per airline) ----
      # actual_airfield_requirement_cents = airfield_opex - nonairline_airfield_revenue (+prior_year_surplus if RESIDUAL)
      # signatory_pool_weight_kg = sum of landed_weight_kg over ActivityRecords where signature_status_at_activity=SIGNATORY
      # total_weight_kg = sum over all ActivityRecords
      # Per signatory airline A:
      #   airfield_share_signatory_A = round_half_up( actual_airfield_requirement * A.signatory_weight / signatory_pool_weight )
      # Non-signatory airlines do NOT share in residual true-up; they paid non-signatory markup at charge time.
      #
      # ---- Terminal share waterfall (per airline) ----
      # actual_terminal_requirement_cents = terminal_opex - nonairline_terminal_revenue
      # Per airline A with an ACTIVE agreement:
      #   terminal_share_A = round_half_up( actual_terminal_requirement * A.rented_space_sqft / total_rented_space_sqft )
      #
      # ---- Rounding-remainder reconciliation (mode b: per-line rounding, remainder to largest share) ----
      # For airfield: compute each signatory share with round_half_up; sum may differ from
      # actual_airfield_requirement by delta_airfield ∈ {-k..+k} cents. Allocate delta_airfield
      # to the airline with the largest signatory_weight (ties broken by Airline.created_at ASC).
      # For terminal: same recipe using largest rented_space_sqft, ties by Airline.created_at ASC.
      #
      # ---- Per-line true_up ----
      # A.true_up_cents = (A.airfield_share + A.terminal_share)
      #                   - (A.billed_landing + A.billed_terminal)
      # Positive → airline owes. Negative → airport credits airline (payment_status CREDITED when applied).
      #
      # ---- Settlement-level total ----
      # AnnualSettlement.total_true_up_cents = sum over lines of true_up_cents.
      # INVARIANT: total_true_up_cents ==
      #   (actual_airfield_requirement + actual_terminal_requirement)
      #   - (total_billed_landing + total_billed_terminal)
      # This is the compensating-invariant formula for settlement recompute.
    input_set: "FiscalYear with OPEN status; all ActivityRecords for the FY; all ACTIVE AirlineAgreements for the FY; adopted RatesSetting"
    constants: {}
    precision: "integer cents; round_half_up per line; remainder allocated to largest share with Airline.created_at ASC tie-break"
    variants:
      - name: provisional_estimate
        when: "computed while FiscalYear.status == OPEN and ActivityRecords may still arrive — used for budget preview"
        difference: "uses forecast_landed_weight_kg in denominators, no remainder reconciliation; does NOT persist AirlineSettlementLine"
      - name: final_actual
        when: "computed at settlement/finalize after all ActivityRecords are loaded"
        difference: "uses actual signatory_pool_weight_kg and actual total_rented_space_sqft; remainder-reconciled; persists lines"

  - name: mii_tally
    trigger: "MIIVote insert (recomputes CapitalProject.votes_for_count, votes_for_weight_kg, votes_against_weight_kg); also drives auto-transition to APPROVED or VETOED"
    algorithm: threshold
    formula: |
      # Two-leg majority-in-interest; BOTH legs must pass for APPROVED.
      # eligible_voters = distinct airlines with an ACTIVE AirlineAgreement whose signature_status == SIGNATORY
      #                   on this FiscalYear at the moment of tally.
      # For each eligible voter, weight_kg = Airline.mii_eligible_weight_kg
      #   (recomputed at vote-open from rolling-12-month activity, snapshotted onto the Airline).
      #
      # total_signatory_count = |eligible_voters|
      # total_signatory_weight_kg = sum of weight_kg over eligible_voters
      #
      # APPROVE threshold (both must hold):
      #   votes_for_count       * 100 >= mii_threshold_pct * total_signatory_count
      #   votes_for_weight_kg   * 100 >= mii_threshold_pct * total_signatory_weight_kg
      #
      # VETO threshold (blocking-minority on weight leg only):
      #   votes_against_weight_kg * 100 >  (100 - mii_threshold_pct) * total_signatory_weight_kg
      #
      # Boundary: >= on APPROVE legs (a vote AT the threshold approves); > on VETO leg
      # (a vote AT exactly the complementary threshold does NOT veto — it leaves the project open).
    input_set: "MIIVote rows for this CapitalProject; AirlineAgreement records ACTIVE+SIGNATORY on the parent FiscalYear"
    constants: {}
    precision: "integer arithmetic; percent comparison in cents-precision (multiply by 100 before compare)"

  - name: pfc_amount
    trigger: "PFCApplication insert"
    algorithm: threshold
    formula: |
      # PFC charged per revenue enplaned passenger.
      # Eligibility: carrier must be carrier_class == PASSENGER AND pfc_approved == true
      #              AND the parent FiscalYear must be OPEN.
      # pfc_amount_cents = enplaned_passengers * PFC_PER_PAX_CENTS
      # Cap: enplaned_passengers above PFC_ANNUAL_CAP_PAX are not collectible; the amount is
      # computed on min(enplaned_passengers, PFC_ANNUAL_CAP_PAX).
    input_set: "PFCApplication.enplaned_passengers; Airline.carrier_class, Airline.pfc_approved"
    constants:
      PFC_PER_PAX_CENTS: 450
      PFC_ANNUAL_CAP_PAX: 2000000
    precision: "integer cents"

  - name: signatory_rate_differential
    trigger: "derived view on GET /airport/rates_settings/{id}/summary"
    algorithm: weighted_scoring
    formula: |
      # Differential exposed for reporting:
      #   differential_pct = (non_signatory_landing_fee_per_1000kg_cents
      #                       - signatory_landing_fee_per_1000kg_cents) * 100
      #                      / signatory_landing_fee_per_1000kg_cents
      # Weights in the sense that the signatory rate itself is a weighted blend across the
      # airfield requirement's three cost inputs (opex, non-airline offset, prior surplus)
      # and the per-mode weight differs by methodology.
    input_set: "current ADOPTED RatesSetting on the FiscalYear"
    constants: {}
    precision: "two-decimal percent; round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-parameter ids resolve to existing entities, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: business_referential
    check: "Body FK references resolve (airline_id, fiscal_year_id, capital_project_id, annual_settlement_id, etc.)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "POST endpoints with FK in body"
  - priority: 5
    category: business_constraint
    check: "Required input fields present and well-typed; enum values within declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 6
    category: state
    check: "Target resource in a state that admits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 7
    category: state
    check: "OCC expected_<parent>_version matches current parent version (on OCC-guarded endpoints)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /airport/fiscal_years/{fy_id}/rates_settings, POST /airport/settlements/{id}/recompute"
  - priority: 8
    category: business_temporal
    check: "Logical clock satisfies time-window preconditions (consultation min days, countersign deadline, dispute window, activity_date inside fiscal-year window)"
    error_id: ERR_TEMPORAL_VIOLATION
    http_status: 422
    applies_to: "adopt, countersign, dispute, activity-record create, settlement finalize"
  - priority: 9
    category: business_safety
    check: "Parent FiscalYear.status permits the operation (must be OPEN for rate/activity/PFC/vote mutations; CLOSED locks writes)"
    error_id: ERR_FISCAL_YEAR_CLOSED
    http_status: 409
    applies_to: "all POST endpoints keyed under a FiscalYear"
  - priority: 10
    category: business_safety
    check: "Airline credit_standing != SUSPENDED when creating ActivityRecord or PFCApplication"
    error_id: ERR_AIRLINE_SUSPENDED
    http_status: 409
    applies_to: "POST /airport/fiscal_years/{fy_id}/activity_records, POST /airport/fiscal_years/{fy_id}/pfc_applications"
  - priority: 11
    category: business_referential
    check: "MIIVote: voting airline must hold an ACTIVE+SIGNATORY AirlineAgreement on the parent FiscalYear"
    error_id: ERR_NOT_SIGNATORY
    http_status: 422
    applies_to: "POST /airport/capital_projects/{id}/mii_votes"
  - priority: 12
    category: business_constraint
    check: "MIIVote: at most one vote per (capital_project_id, airline_id)"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /airport/capital_projects/{id}/mii_votes"
  - priority: 13
    category: business_constraint
    check: "MIIVote allowed only while CapitalProject.status == MII_VOTING"
    error_id: ERR_PROJECT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /airport/capital_projects/{id}/mii_votes"
  - priority: 14
    category: business_fiscal
    check: "RatesSetting terminal rate * rented_space_sqft aggregate must not exceed terminal pool; rental-rate derivation divisors non-zero"
    error_id: ERR_RATE_NOT_DERIVABLE
    http_status: 422
    applies_to: "POST /airport/fiscal_years/{fy_id}/rates_settings, POST /airport/rates_settings/{id}/publish"
  - priority: 15
    category: business_fiscal
    check: "Settlement compute precondition: at least one ActivityRecord exists for the FiscalYear"
    error_id: ERR_NO_ACTIVITY
    http_status: 422
    applies_to: "POST /airport/fiscal_years/{fy_id}/settlement/compute"
  - priority: 16
    category: business_fiscal
    check: "Settlement finalize precondition: every AirlineSettlementLine payment_status in {PAID, CREDITED, WRITTEN_OFF}"
    error_id: ERR_UNSETTLED_LINES
    http_status: 409
    applies_to: "POST /airport/settlements/{id}/finalize"
  - priority: 17
    category: business_constraint
    check: "PFC eligibility: Airline.carrier_class == PASSENGER AND Airline.pfc_approved == true"
    error_id: ERR_PFC_INELIGIBLE
    http_status: 422
    applies_to: "POST /airport/fiscal_years/{fy_id}/pfc_applications"
  - priority: 18
    category: business_temporal
    check: "Countersign window: logical clock <= AirlineAgreement.countersign_deadline"
    error_id: ERR_COUNTERSIGN_LAPSED
    http_status: 422
    applies_to: "POST /airport/airline_agreements/{id}/countersign"

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (28 endpoints)
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/airport/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call, the logical clock reads 2026-08-01T00:00:00Z exactly; never falls back to wall-clock."
    roles: [AirportFinance, AirportDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["drives deadline/expiry/window rules deterministically"]

  # ---- FiscalYear ----
  - method: POST
    path: "/airport/fiscal_years"
    description: "Create a FiscalYear in DRAFT"
    roles: [AirportFinance]
    code: 201
    input: [year_label, methodology, airfield_opex_cents, terminal_opex_cents, nonairline_airfield_revenue_cents, nonairline_terminal_revenue_cents, terminal_total_space_sqft, forecast_landed_weight_kg, "prior_year_surplus_cents?"]
    output: FiscalYear
    side_effects: ["status=DRAFT, computed totals initialized to 0"]
  - method: GET
    path: "/airport/fiscal_years"
    description: "List FiscalYears (paginated)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?", "status?", "methodology?"]
    output: "FiscalYear[]"
    side_effects: []
  - method: GET
    path: "/airport/fiscal_years/{id}"
    description: "Get one FiscalYear"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: FiscalYear
    side_effects: []
  - method: POST
    path: "/airport/fiscal_years/{id}/open"
    description: "Transition FiscalYear DRAFT → OPEN"
    roles: [AirportFinance]
    code: 200
    input: []
    output: FiscalYear
    side_effects: ["status=OPEN", "increments FiscalYear.version by 1"]

  # ---- Airline ----
  - method: POST
    path: "/airport/airlines"
    description: "Register an Airline"
    roles: [AirportFinance]
    code: 201
    input: [iata_code, legal_name, carrier_class, "pfc_approved?"]
    output: Airline
    side_effects: []
  - method: GET
    path: "/airport/airlines"
    description: "List Airlines (paginated)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?", "carrier_class?", "pfc_approved?"]
    output: "Airline[]"
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}"
    description: "Get one Airline"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: Airline
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}/agreements"
    description: "List AirlineAgreements for one airline (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AirlineAgreement[]"
    side_effects: []

  # ---- AirlineAgreement ----
  - method: POST
    path: "/airport/airline_agreements"
    description: "Create AirlineAgreement (CREATE-with-supersede: setting superseded_by_id on any prior agreement for same airline+fiscal_year)"
    roles: [AirportFinance]
    code: 201
    input: [airline_id, fiscal_year_id, "rented_space_sqft?"]
    output: AirlineAgreement
    side_effects: ["signature_status=NON_SIGNATORY, credit_standing=GOOD; if prior ACTIVE agreement exists for (airline,fiscal_year), set prior.superseded_by_id to the new id and recompute FiscalYear.total_rented_space_sqft"]
  - method: GET
    path: "/airport/airline_agreements/{id}"
    description: "Get one AirlineAgreement"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: AirlineAgreement
    side_effects: []
  - method: POST
    path: "/airport/airline_agreements/{id}/countersign"
    description: "Carrier countersigns: signature_status NON_SIGNATORY → SIGNATORY"
    roles: [SignatoryAirline]
    code: 200
    input: []
    output: AirlineAgreement
    side_effects: ["signature_status=SIGNATORY", "FiscalYear.total_rented_space_sqft recomputed", "increments AirlineAgreement.version by 1"]
  - method: POST
    path: "/airport/airline_agreements/{id}/decline-renewal"
    description: "Carrier declines: signature_status SIGNATORY → NON_SIGNATORY"
    roles: [SignatoryAirline]
    code: 200
    input: []
    output: AirlineAgreement
    side_effects: ["signature_status=NON_SIGNATORY", "MIIVote exclusion cascade for in-flight MII_VOTING projects", "increments AirlineAgreement.version by 1"]
  - method: POST
    path: "/airport/airline_agreements/{id}/suspend"
    description: "Airport suspends a delinquent carrier"
    roles: [AirportFinance]
    code: 200
    input: []
    output: AirlineAgreement
    side_effects: ["credit_standing=SUSPENDED"]
  - method: POST
    path: "/airport/airline_agreements/{id}/reinstate"
    description: "Airport reinstates a suspended carrier (no PENDING lines remain)"
    roles: [AirportFinance]
    code: 200
    input: []
    output: AirlineAgreement
    side_effects: ["credit_standing=GOOD"]

  # ---- RatesSetting ----
  - method: POST
    path: "/airport/fiscal_years/{id}/rates_settings"
    description: "Create a RatesSetting DRAFT for the FiscalYear (OCC-guarded on FiscalYear.version)"
    roles: [AirportFinance]
    code: 201
    input: [expected_fiscal_year_version]
    output: RatesSetting
    side_effects: ["status=DRAFT; computed rate fields populated via landing_fee_rate + terminal_rental_rate", "increments FiscalYear.version by 1"]
  - method: GET
    path: "/airport/rates_settings/{id}"
    description: "Get one RatesSetting"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: RatesSetting
    side_effects: []
  - method: GET
    path: "/airport/fiscal_years/{id}/rates_settings"
    description: "List RatesSettings for one FiscalYear (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "RatesSetting[]"
    side_effects: []
  - method: POST
    path: "/airport/rates_settings/{id}/publish"
    description: "RatesSetting DRAFT → CONSULTATION; supersedes prior ADOPTED RatesSetting on same FiscalYear"
    roles: [AirportFinance]
    code: 200
    input: []
    output: RatesSetting
    side_effects: ["status=CONSULTATION; if another RatesSetting on same FiscalYear is ADOPTED, that one transitions to SUPERSEDED", "increments RatesSetting.version by 1"]
  - method: POST
    path: "/airport/rates_settings/{id}/adopt"
    description: "RatesSetting CONSULTATION → ADOPTED (AirportDirector only; requires consultation window elapsed)"
    roles: [AirportDirector]
    code: 200
    input: []
    output: RatesSetting
    side_effects: ["status=ADOPTED; adopted_at stamped", "cascade: ACTIVE AirlineAgreement countersign_deadline recomputed", "increments RatesSetting.version by 1"]

  # ---- ConsultationComment ----
  - method: POST
    path: "/airport/rates_settings/{id}/comments"
    description: "Signatory airline files a consultation comment"
    roles: [SignatoryAirline]
    code: 201
    input: [airline_id, body]
    output: ConsultationComment
    side_effects: ["RatesSetting.consultation_comment_count += 1"]
  - method: GET
    path: "/airport/rates_settings/{id}/comments"
    description: "List comments on a RatesSetting (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsultationComment[]"
    side_effects: []

  # ---- ActivityRecord ----
  - method: POST
    path: "/airport/fiscal_years/{id}/activity_records"
    description: "Record one landed-weight activity; stamps billed_landing_fee_cents"
    roles: [AirportFinance]
    code: 201
    input: [airline_id, activity_date, landed_weight_kg, signature_status_at_activity]
    output: ActivityRecord
    side_effects: ["billed_landing_fee_cents computed via landing_fee_charge", "FiscalYear.total_projected_landed_weight_kg recomputed", "if signature_status_at_activity == SIGNATORY, FiscalYear.total_signatory_landed_weight_kg recomputed"]
  - method: GET
    path: "/airport/fiscal_years/{id}/activity_records"
    description: "List ActivityRecords for one FiscalYear (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?", "airline_id?", "signature_status_at_activity?"]
    output: "ActivityRecord[]"
    side_effects: []

  # ---- CapitalProject + MIIVote ----
  - method: POST
    path: "/airport/fiscal_years/{id}/capital_projects"
    description: "Propose a CapitalProject"
    roles: [AirportFinance]
    code: 201
    input: [project_name, cost_center, budget_cents, mii_threshold_pct]
    output: CapitalProject
    side_effects: ["status=PROPOSED"]
  - method: GET
    path: "/airport/capital_projects/{id}"
    description: "Get one CapitalProject"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: CapitalProject
    side_effects: []
  - method: POST
    path: "/airport/capital_projects/{id}/open-voting"
    description: "CapitalProject PROPOSED → MII_VOTING; snapshots Airline.mii_eligible_weight_kg from rolling-12-month activity"
    roles: [AirportFinance]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status=MII_VOTING; per signatory airline, recompute Airline.mii_eligible_weight_kg"]
  - method: POST
    path: "/airport/capital_projects/{id}/close-voting"
    description: "Close voting (no threshold reached) → REJECTED"
    roles: [AirportFinance]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status=REJECTED"]
  - method: POST
    path: "/airport/capital_projects/{id}/cancel"
    description: "Cancel a PROPOSED CapitalProject"
    roles: [AirportFinance]
    code: 200
    input: []
    output: CapitalProject
    side_effects: ["status=CANCELLED"]
  - method: POST
    path: "/airport/capital_projects/{id}/mii_votes"
    description: "Cast a majority-in-interest vote"
    roles: [SignatoryAirline]
    code: 201
    input: [airline_id, ballot]
    output: MIIVote
    side_effects: ["mii_tally recompute on parent CapitalProject", "possible auto-transition MII_VOTING → APPROVED or MII_VOTING → VETOED"]
  - method: GET
    path: "/airport/capital_projects/{id}/mii_votes"
    description: "List votes on a CapitalProject (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?", "ballot?"]
    output: "MIIVote[]"
    side_effects: []

  # ---- AnnualSettlement + lines ----
  - method: POST
    path: "/airport/fiscal_years/{id}/settlement/compute"
    description: "AnnualSettlement DRAFT → COMPUTED; runs annual_true_up and creates AirlineSettlementLine per airline"
    roles: [AirportFinance]
    code: 201
    input: []
    output: AnnualSettlement
    side_effects: ["status=COMPUTED", "creates AirlineSettlementLine records", "sets FiscalYear.settlement_id", "increments AnnualSettlement.version by 1; increments FiscalYear.version by 1"]
  - method: GET
    path: "/airport/settlements/{id}"
    description: "Get one AnnualSettlement"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: AnnualSettlement
    side_effects: []
  - method: POST
    path: "/airport/settlements/{id}/publish-review"
    description: "COMPUTED → AIRLINE_REVIEW; stamps payment due date on each line"
    roles: [AirportFinance]
    code: 200
    input: []
    output: AnnualSettlement
    side_effects: ["status=AIRLINE_REVIEW", "each AirlineSettlementLine.payment_status=PENDING with due-date stamped"]
  - method: POST
    path: "/airport/settlements/{id}/dispute"
    description: "AIRLINE_REVIEW → DISPUTED; RESOLVED → DISPUTED (cycle)"
    roles: [SignatoryAirline]
    code: 200
    input: [airline_id, reason]
    output: AnnualSettlement
    side_effects: ["status=DISPUTED"]
  - method: POST
    path: "/airport/settlements/{id}/resolve"
    description: "DISPUTED → RESOLVED; optional override_true_up_cents redistribution"
    roles: [AirportDirector]
    code: 200
    input: ["override_true_up_cents?"]
    output: AnnualSettlement
    side_effects: ["status=RESOLVED; if override present, rewrite AirlineSettlementLine.true_up_cents per override waterfall and reset payment_status=PENDING on affected lines"]
  - method: POST
    path: "/airport/settlements/{id}/recompute"
    description: "Re-run annual_true_up against current ActivityRecords (OCC-guarded on AnnualSettlement.version)"
    roles: [AirportFinance]
    code: 200
    input: [expected_annual_settlement_version]
    output: AnnualSettlement
    side_effects: ["rewrites AirlineSettlementLine computed fields; compensating-invariant: total_true_up_cents unchanged in aggregate modulo explicit rounding remainder", "increments AnnualSettlement.version by 1"]
  - method: POST
    path: "/airport/settlements/{id}/finalize"
    description: "AIRLINE_REVIEW|RESOLVED → FINALIZED; cascades FiscalYear → CLOSED and DRAFT RatesSetting → EXPIRED"
    roles: [AirportDirector]
    code: 200
    input: []
    output: AnnualSettlement
    side_effects: ["status=FINALIZED", "parent FiscalYear OPEN → CLOSED", "any DRAFT RatesSetting on this FiscalYear → EXPIRED"]
  - method: GET
    path: "/airport/settlements/{id}/lines"
    description: "List AirlineSettlementLines for a settlement (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?", "airline_id?", "payment_status?"]
    output: "AirlineSettlementLine[]"
    side_effects: []
  - method: POST
    path: "/airport/settlement_lines/{id}/record-payment"
    description: "Mark a line PAID (airline owed) or CREDITED (airport owed); may cascade credit_standing on the agreement"
    roles: [AirportFinance]
    code: 200
    input: [outcome]
    output: AirlineSettlementLine
    side_effects: ["payment_status=PAID|CREDITED per outcome enum", "if no PENDING lines remain for the airline on this FY, agreement credit_standing DELINQUENT → GOOD"]
  - method: POST
    path: "/airport/settlement_lines/{id}/write-off"
    description: "Mark a line WRITTEN_OFF (uncollectible)"
    roles: [AirportDirector]
    code: 200
    input: []
    output: AirlineSettlementLine
    side_effects: ["payment_status=WRITTEN_OFF"]

  # ---- PFCApplication ----
  - method: POST
    path: "/airport/fiscal_years/{id}/pfc_applications"
    description: "Submit a PFC remittance application"
    roles: [SignatoryAirline]
    code: 201
    input: [airline_id, enplaned_passengers]
    output: PFCApplication
    side_effects: ["status=SUBMITTED; pfc_amount_cents computed via pfc_amount"]
  - method: GET
    path: "/airport/fiscal_years/{id}/pfc_applications"
    description: "List PFCApplications for a FiscalYear (reverse-reachability)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?", "airline_id?", "status?"]
    output: "PFCApplication[]"
    side_effects: []
  - method: GET
    path: "/airport/pfc_applications/{id}"
    description: "Get one PFCApplication"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: PFCApplication
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}/pfc_applications"
    description: "List PFCApplications for an Airline (reverse-reachability for airline_id FK)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "PFCApplication[]"
    side_effects: []
  - method: POST
    path: "/airport/pfc_applications/{id}/decide"
    description: "AirportDirector accepts or rejects a PFC application"
    roles: [AirportDirector]
    code: 200
    input: [decision, "rejection_reason?"]
    output: PFCApplication
    side_effects: ["status=ACCEPTED|REJECTED"]

  # ---- Single-resource GETs (for lint collection-segment derivation + direct reads) ----
  - method: GET
    path: "/airport/consultation_comments/{id}"
    description: "Get one ConsultationComment"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: ConsultationComment
    side_effects: []
  - method: GET
    path: "/airport/activity_records/{id}"
    description: "Get one ActivityRecord"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: ActivityRecord
    side_effects: []
  - method: GET
    path: "/airport/mii_votes/{id}"
    description: "Get one MIIVote"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: MIIVote
    side_effects: []
  - method: GET
    path: "/airport/settlement_lines/{id}"
    description: "Get one AirlineSettlementLine"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: AirlineSettlementLine
    side_effects: []

  # ---- Reverse-reachability GETs for remaining FKs ----
  - method: GET
    path: "/airport/fiscal_years/{id}/agreements"
    description: "List AirlineAgreements for a FiscalYear (reverse-reachability for AirlineAgreement.fiscal_year_id)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AirlineAgreement[]"
    side_effects: []
  - method: GET
    path: "/airport/airline_agreements/{id}/successors"
    description: "List AirlineAgreements whose superseded_by_id == this agreement (reverse-reachability for self-FK)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AirlineAgreement[]"
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}/comments"
    description: "List ConsultationComments filed by an Airline (reverse-reachability for ConsultationComment.airline_id)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsultationComment[]"
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}/activity_records"
    description: "List ActivityRecords for an Airline (reverse-reachability for ActivityRecord.airline_id)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ActivityRecord[]"
    side_effects: []
  - method: GET
    path: "/airport/fiscal_years/{id}/capital_projects"
    description: "List CapitalProjects for a FiscalYear (reverse-reachability for CapitalProject.fiscal_year_id)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "CapitalProject[]"
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}/mii_votes"
    description: "List MIIVotes cast by an Airline (reverse-reachability for MIIVote.airline_id)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "MIIVote[]"
    side_effects: []
  - method: GET
    path: "/airport/fiscal_years/{id}/settlement"
    description: "List AnnualSettlement for a FiscalYear (reverse-reachability for AnnualSettlement.fiscal_year_id); array of length 0 or 1"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: []
    output: "AnnualSettlement[]"
    side_effects: []
  - method: GET
    path: "/airport/airlines/{id}/settlement_lines"
    description: "List AirlineSettlementLines for an Airline (reverse-reachability for AirlineSettlementLine.airline_id)"
    roles: [AirportFinance, AirportDirector, SignatoryAirline, AirportAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AirlineSettlementLine[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (22 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing / wrong type / enum value outside declared set" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve (left-to-right path validation)" }
  - { id: ERR_FK_NOT_FOUND, http: 422, condition: "Body FK reference (airline_id, fiscal_year_id, etc.) does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in wrong state for this transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_TEMPORAL_VIOLATION, http: 422, condition: "Logical clock outside allowed window (consultation/adopt/countersign/dispute/activity-date)" }
  - { id: ERR_FISCAL_YEAR_CLOSED, http: 409, condition: "FiscalYear.status == CLOSED; writes blocked" }
  - { id: ERR_AIRLINE_SUSPENDED, http: 409, condition: "Airline credit_standing == SUSPENDED; ActivityRecord/PFCApplication creation blocked" }
  - { id: ERR_NOT_SIGNATORY, http: 422, condition: "MIIVote by non-signatory airline" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "Airline has already voted on this CapitalProject" }
  - { id: ERR_PROJECT_ALREADY_DECIDED, http: 409, condition: "CapitalProject.status is APPROVED / REJECTED / VETOED / CANCELLED; no further votes" }
  - { id: ERR_RATE_NOT_DERIVABLE, http: 422, condition: "Rate derivation divisor zero or terminal pool exceeded" }
  - { id: ERR_NO_ACTIVITY, http: 422, condition: "Settlement compute requires at least one ActivityRecord" }
  - { id: ERR_UNSETTLED_LINES, http: 409, condition: "Finalize blocked: at least one AirlineSettlementLine still PENDING" }
  - { id: ERR_PFC_INELIGIBLE, http: 422, condition: "carrier_class != PASSENGER or pfc_approved == false" }
  - { id: ERR_COUNTERSIGN_LAPSED, http: 422, condition: "logical clock past countersign_deadline" }
  - { id: ERR_METHODOLOGY_MISMATCH, http: 422, condition: "Operation valid only under a different methodology (e.g., residual-only true-up path invoked on COMPENSATORY year)" }
  - { id: ERR_DISPUTE_WINDOW_EXPIRED, http: 422, condition: "Dispute raised after DISPUTE_WINDOW_DAYS from publish-review or last resolve" }
  - { id: ERR_AGREEMENT_SUPERSEDED, http: 409, condition: "AirlineAgreement.superseded_by_id is set; mutations blocked on the superseded row" }
  - { id: ERR_DOUBLE_COUNTERSIGN, http: 409, condition: "Countersign attempted on an agreement already in signature_status == SIGNATORY" }

# =============================================================================
# Table 7: RBAC Matrix (4 roles)
# =============================================================================
roles:
  - name: AirportFinance
    description: "Airport finance department staff; operates rates, activity, settlement compute, voting administration"
    identity: "opaque"
    exclusive_operations:
      - "POST /airport/fiscal_years"
      - "POST /airport/fiscal_years/{fy_id}/open"
      - "POST /airport/fiscal_years/{fy_id}/rates_settings"
      - "POST /airport/rates_settings/{rs_id}/publish"
      - "POST /airport/fiscal_years/{fy_id}/activity_records"
      - "POST /airport/fiscal_years/{fy_id}/capital_projects"
      - "POST /airport/capital_projects/{project_id}/open-voting"
      - "POST /airport/capital_projects/{project_id}/close-voting"
      - "POST /airport/capital_projects/{project_id}/cancel"
      - "POST /airport/fiscal_years/{fy_id}/settlement/compute"
      - "POST /airport/settlements/{settlement_id}/publish-review"
      - "POST /airport/settlements/{settlement_id}/recompute"
      - "POST /airport/settlement_lines/{line_id}/record-payment"
      - "POST /airport/airline_agreements (create)"
      - "POST /airport/airline_agreements/{id}/suspend"
      - "POST /airport/airline_agreements/{id}/reinstate"
      - "POST /airport/airlines"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /airport/_clock/set_current_utc"
  - name: AirportDirector
    description: "Airport director; approves rates, resolves disputes, finalizes settlements, decides PFC, writes off lines"
    identity: "opaque"
    exclusive_operations:
      - "POST /airport/rates_settings/{rs_id}/adopt"
      - "POST /airport/settlements/{settlement_id}/resolve"
      - "POST /airport/settlements/{settlement_id}/finalize"
      - "POST /airport/settlement_lines/{line_id}/write-off"
      - "POST /airport/pfc_applications/{pfc_id}/decide"
    shared_operations:
      - "GET (all read endpoints)"
      - "POST /airport/_clock/set_current_utc"
  - name: SignatoryAirline
    description: "An airline user; countersigns agreement, files consultation comments, casts MII votes, disputes settlements, submits PFC"
    identity: "entity_backed:Airline"
    exclusive_operations:
      - "POST /airport/airline_agreements/{id}/countersign"
      - "POST /airport/airline_agreements/{id}/decline-renewal"
      - "POST /airport/rates_settings/{rs_id}/comments"
      - "POST /airport/capital_projects/{project_id}/mii_votes"
      - "POST /airport/settlements/{settlement_id}/dispute"
      - "POST /airport/fiscal_years/{fy_id}/pfc_applications"
    shared_operations:
      - "GET (all read endpoints)"
  - name: AirportAuditor
    description: "Read-only auditor; no write operations"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints)"
