            - { call: "POST /showing-desk/agents", payload: { full_name: "BA Fourteen", license_number: "LIC-BA-14", brokerage_name: "B2" }, as: Anonymous, captures: { ba_id: $.data.id } }
            - { call: "POST /showing-desk/agents/${ba_id}/verification-cases", payload: { license_document_ref: "doc-ba-14" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { case_id: $.data.id } }
            - { call: "POST /showing-desk/verification-cases/${case_id}/review", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /showing-desk/sellers", payload: { full_name: "SB14", contact_email: "sb14@x.com", auto_approve: true }, as: PlatformAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /showing-desk/listings", payload: { seller_id: "${s_id}", address: "81 Gate Rd", occupancy_type: "VACANT" }, as: ListingAgent, as_user_id: "${la_id}", captures: { l_id: $.data.id } }
            - { call: "POST /showing-desk/showing-requests", payload: { listing_id: "${l_id}", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T10:30:00Z" }, as: BuyerAgent, as_user_id: "${ba_id}", captures: { r1_id: $.data.id } }
          trigger:
            - { call: "POST /showing-desk/showing-requests/${r1_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { err: $.data.error_id } }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/confirm", payload: {}, as: BuyerAgent, as_user_id: "${ba_id}" }
            - { call: "POST /showing-desk/showing-requests/${r1_id}/access-credentials", payload: { credential_type: "LOCKBOX_CODE" }, as: ListingAgent, as_user_id: "${la_id}", captures: { c_st: $.data.status } }
