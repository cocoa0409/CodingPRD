  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_in_same_read
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Under immediate consistency, the deliver response's contractor reflects recomputed ytd/final accrual on the very next GET with no lag."
        test_recipe:
          setup: ["contractor with SHIPPED order of line total 2,000,000"]
          setup_api_calls:
            - call: "POST /api/v1/contractors"
              payload: { company_name: "Imm Co", license_number: "LIC-C900" }
              as: DistributorAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "CU-I900", equipment_type: "CONDENSER", refrigerant_type: "R410A", capacity_btuh: 36000, family_code: "FAM-M1", list_price_cents: 2000000 }
              as: DistributorAdmin
              captures: { mi_id: $.data.id }
            - call: "POST /api/v1/orders"
              payload: { contractor_id: "${ci_id}" }
              as: ContractorUser
              as_user_id: "${ci_id}"
              captures: { oi_id: $.data.id }
            - call: "POST /api/v1/orders/${oi_id}/lines"
              payload: { equipment_model_id: "${mi_id}", quantity: 1 }
              as: ContractorUser
              as_user_id: "${ci_id}"
            - call: "POST /api/v1/orders/${oi_id}/submit"
              payload: {}
              as: ContractorUser
              as_user_id: "${ci_id}"
            - call: "POST /api/v1/orders/${oi_id}/ship"
