        distinguishing_aspect: "The inclusion gate needs both halves: a vendor meeting only 3 of the 6 criteria is refused even with a strong weighted score, and the placement stays UNDER_EVALUATION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, one ACTIVE vendor, one DRAFT document and an inclusion with 3 of 6 criteria met but a strong score."
          setup_api_calls:
            - *c_clock
