        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one DataBroker operating in CA with a 500000-cent fee deposit."
            - "One ACCEPTED CA Registration covering 2026-09-01T00:00:00Z to 2027-03-01T00:00:00Z with all four required disclosures at full length, so the broker's standing is COMPLIANT."
