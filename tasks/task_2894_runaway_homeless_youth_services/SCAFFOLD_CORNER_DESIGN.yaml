  - section: complexity_layers
    instances:
      - name: stale_youth_version_on_case_open_is_rejected
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules.case-open-stale-youth
          - validations[priority=7]
          - errors.ERR_STALE_YOUTH_VERSION
        distinguishing_aspect: "The OCC guard on POST /ryhs/reunification-cases compares expected_youth_version to the live Youth.version: one less than the observed value is 412 ERR_STALE_YOUTH_VERSION with no case created, the observed value succeeds, and the successful open bumps the youth's version so replaying the same expected value is stale in turn."
        test_recipe:
          setup:
            - "one youth Yael Duarte at version 1 with no screening and no admission, so posture is OPEN and the OCC check is the only gate in play"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Yael", legal_last_name: "Duarte", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { occ_youth_id: $.data.id, occ_youth_v: $.data.version }
          trigger:
            - call: "POST /ryhs/reunification-cases"
              payload: { youth_id: "${occ_youth_id}", guardian_household_label: "Duarte household", expected_youth_version: "${occ_youth_v} - 1" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { occ_err_id: $.data.error_id }
            - call: "POST /ryhs/reunification-cases"
              payload: { youth_id: "${occ_youth_id}", guardian_household_label: "Duarte household", expected_youth_version: "${occ_youth_v}" }
              as: ReunificationSpecialist
              as_user_id: "spec-1"
              captures: { occ_case_id: $.data.id }
          assert:
            - "the first request returns HTTP 412 with error_id ERR_STALE_YOUTH_VERSION"
            - "immediately after the refused request, GET /ryhs/youths/${occ_youth_id}/reunification-cases returns total_count 0"
            - "Youth.${occ_youth_id}.version is unchanged by the refused request"
            - "the second request returns HTTP 201 and ReunificationCase.${occ_case_id}.status == OPENED"
            - "after the successful open, GET /ryhs/youths/${occ_youth_id} reports a version strictly greater than ${occ_youth_v}"
            - "Youth.${occ_youth_id}.status == REUNIFIED_PENDING"

      - name: stale_placement_version_on_a_savings_entry_is_rejected
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - concurrency_rules.savings-entry-stale-placement
          - validations[priority=8]
          - errors.ERR_STALE_PLACEMENT_VERSION
        distinguishing_aspect: "The savings ledger's OCC guard is checked before any fiscal rule: an expected_placement_version one behind the live value is 412 ERR_STALE_PLACEMENT_VERSION even for an affordable deposit, and after the accepted entry the same expected value is stale because the entry itself incremented the placement version."
        test_recipe:
          setup:
            - "an EMERGENCY_SHELTER program plus a TRANSITIONAL_LIVING program"
            - "youth Zeno Abarca (dob 2010-03-15, age 16) taken to SHELTERED with risk_posture OPEN via a CLEARED screening, an ACTIVE admission and a GuardianNotification attempted by PHONE then resolved CONTACTED, then placed with documented_monthly_income_cents 90000"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { poc_shelter_id: $.data.id }
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Northside Transitional Living", program_type: "TRANSITIONAL_LIVING", licensed_bed_capacity: 3, min_age_years: 16, max_age_years: 20, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { poc_tlp_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Zeno", legal_last_name: "Abarca", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { poc_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${poc_youth_id}/safety-screenings"
              payload: { indicator_codes: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { poc_scr_id: $.data.id }
            - call: "POST /ryhs/safety-screenings/${poc_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /ryhs/admissions"
              payload: { youth_id: "${poc_youth_id}", program_id: "${poc_shelter_id}", planned_discharge_at: "2026-08-15T00:00:00Z" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { poc_adm_id: $.data.id }
            - call: "GET /ryhs/admissions/${poc_adm_id}/guardian-notifications"
              payload: {}
              as: ShelterCaseManager
              as_user_id: "cm-1"
              captures: { poc_gn_id: "$.data[0].id" }
            - call: "POST /ryhs/guardian-notifications/${poc_gn_id}/attempt"
              payload: { attempt_channel: "PHONE" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/guardian-notifications/${poc_gn_id}/resolve"
              payload: { outcome: "CONTACTED" }
              as: ShelterCaseManager
              as_user_id: "cm-1"
            - call: "POST /ryhs/tlp-placements"
              payload: { youth_id: "${poc_youth_id}", program_id: "${poc_tlp_id}", documented_monthly_income_cents: 90000 }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { poc_plc_id: $.data.id, poc_plc_v: $.data.version }
          trigger:
            - call: "POST /ryhs/tlp-placements/${poc_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, expected_placement_version: "${poc_plc_v} - 1", source_note: "stale write" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { poc_err_id: $.data.error_id }
            - call: "POST /ryhs/tlp-placements/${poc_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, expected_placement_version: "${poc_plc_v}", source_note: "fresh write" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { poc_entry_id: $.data.id }
            - call: "POST /ryhs/tlp-placements/${poc_plc_id}/savings-entries"
              payload: { entry_type: "DEPOSIT", amount_cents: 1000, expected_placement_version: "${poc_plc_v}", source_note: "replayed write" }
              as: TlpCoordinator
              as_user_id: "tlp-1"
              captures: { poc_replay_err: $.data.error_id }
          assert:
            - "the first request returns HTTP 412 with error_id ERR_STALE_PLACEMENT_VERSION"
            - "immediately after the refused request, TlpPlacement.${poc_plc_id}.savings_balance_cents == 0 and GET /ryhs/tlp-placements/${poc_plc_id}/savings-entries returns total_count 0"
            - "the second request returns HTTP 201 with balance_after_cents 1250 and match_component_cents 250"
            - "the replay with the same expected_placement_version returns HTTP 412 with error_id ERR_STALE_PLACEMENT_VERSION"
            - "GET /ryhs/tlp-placements/${poc_plc_id}/savings-entries returns total_count 1"
            - "TlpPlacement.${poc_plc_id}.savings_balance_cents == 1250"

      - name: youth_version_increments_once_per_mutating_write
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.optimistic_concurrency
          - entities.Youth.fields.version
          - endpoints.POST_youths_outreach_contacts.side_effects
        distinguishing_aspect: "Version is a per-write counter, not a per-field one: a single outreach contact that changes four derived fields at once still moves Youth.version by exactly 1, and reads never move it at all."
        test_recipe:
          setup:
            - "one youth Ines Vargas at version 1 with no contacts"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Ines", legal_last_name: "Vargas", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { ver_youth_id: $.data.id }
          trigger:
            - call: "GET /ryhs/youths/${ver_youth_id}"
              payload: {}
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${ver_youth_id}/outreach-contacts"
              payload: { engagement_stage: "FIRST_CONTACT", basic_needs_provided: ["FOOD", "HYGIENE_KIT"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
            - call: "POST /ryhs/youths/${ver_youth_id}/outreach-contacts"
              payload: { engagement_stage: "RAPPORT_BUILDING", basic_needs_provided: ["CLOTHING"], indicator_flags: [] }
              as: OutreachWorker
              as_user_id: "worker-1"
          assert:
            - "Youth.${ver_youth_id}.version == 1 at creation"
            - "the GET returns version 1 and does not change it"
            - "after the first outreach contact Youth.${ver_youth_id}.version == 2, engagement_contact_count == 1, basic_needs_provision_count == 2 and status == ENGAGED"
            - "after the second outreach contact Youth.${ver_youth_id}.version == 3, engagement_contact_count == 2 and basic_needs_provision_count == 3"
            - "status stays ENGAGED across the second contact, since ENGAGED -> ENGAGED is a self-loop"

      - name: trafficking_tier_boundaries_sit_at_exactly_thirty_and_sixty
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
          - calculations.trafficking_risk_score
          - entities.SafetyScreening.fields.tier
          - entities.Youth.fields.trafficking_risk_tier
        distinguishing_aspect: "The tier thresholds are inclusive at exactly 30 and exactly 60: 25 is LOW, DOCUMENT_WITHHELD + CURFEW_ENFORCED sums to precisely 30 and is ELEVATED, and COMMERCIAL_SEX + DOCUMENT_WITHHELD sums to precisely 60 and is CRITICAL - and none of the three screenings moves the youth's own trafficking_risk_tier, which is fed only by outreach history."
        test_recipe:
          setup:
            - "three youths with no outreach contacts, each carrying one SUBMITTED SafetyScreening: QUOTA_DEBT (25), DOCUMENT_WITHHELD + CURFEW_ENFORCED (20 + 10 = 30), COMMERCIAL_SEX + DOCUMENT_WITHHELD (40 + 20 = 60)"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Bea", legal_last_name: "Torres", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { thr_y1_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Cato", legal_last_name: "Torres", date_of_birth: "2010-04-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { thr_y2_id: $.data.id }
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Delia", legal_last_name: "Torres", date_of_birth: "2010-05-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { thr_y3_id: $.data.id }
          trigger:
            - call: "POST /ryhs/youths/${thr_y1_id}/safety-screenings"
              payload: { indicator_codes: ["QUOTA_DEBT"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { thr_s1_id: $.data.id }
            - call: "POST /ryhs/youths/${thr_y2_id}/safety-screenings"
              payload: { indicator_codes: ["DOCUMENT_WITHHELD", "CURFEW_ENFORCED"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { thr_s2_id: $.data.id }
            - call: "POST /ryhs/youths/${thr_y3_id}/safety-screenings"
              payload: { indicator_codes: ["COMMERCIAL_SEX", "DOCUMENT_WITHHELD"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { thr_s3_id: $.data.id }
          assert:
            - "SafetyScreening.${thr_s1_id}.score == 25 and tier == LOW"
            - "SafetyScreening.${thr_s2_id}.score == 30 and tier == ELEVATED"
            - "SafetyScreening.${thr_s3_id}.score == 60 and tier == CRITICAL"
            - "Youth.${thr_y1_id}.trafficking_risk_score == 0 and trafficking_risk_tier == LOW"
            - "Youth.${thr_y2_id}.trafficking_risk_score == 0 and trafficking_risk_tier == LOW"
            - "Youth.${thr_y3_id}.trafficking_risk_score == 0 and trafficking_risk_tier == LOW"
            - "all three screenings are in status SUBMITTED"

      - name: cascading_side_effects_reach_five_levels_from_one_discharge
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints.POST_admissions_discharge.side_effects
        excluded_because:
          difficulty_instance: discharge_releases_bed_then_promotes_waitlist_then_creates_notification
          rationale: "That difficulty instance already walks the full depth-5 chain end-to-end - terminate, release the bed, recompute the posture, promote from the waitlist, mint the new obligation - and asserts every hop plus the ordering sensitivity that makes hops 4 and 5 conditional on hop 3. A corner instance could only restate it."

      - name: dual_variant_calculation_produces_two_answers_from_one_dataset
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.trafficking_risk_score.variants
        excluded_because:
          difficulty_instance: trafficking_risk_score_screening_snapshot_versus_decayed_outreach_history
          rationale: "Variant divergence, variant selection and the per-contact floor of the decayed variant are all asserted there against a single shared dataset, including the delta between the screening_time snapshot and the outreach_history recomputation. The second dual-variant rule, admission_billable_nights, has its own difficulty instance as well."

      - name: selector_policy_picks_a_single_deterministic_winner
        claim_type: complexity_layer
        grounds:
          - complexity_profile.complexity_layers.selector_policy
          - calculations.admission_priority_score
          - state_machines.Admission.WAITLISTED_to_ACTIVE
        excluded_because:
          difficulty_instance: discharge_releases_bed_then_promotes_waitlist_then_creates_notification
          rationale: "The waitlist selector is exercised there with two competing WAITLISTED rows at priority_score 41 and 39, and the instance asserts that exactly one - the higher-scoring row - is promoted while the other stays WAITLISTED. The scoring formula's own caps and clamps are covered by admission_priority_score_nested_caps_and_critical_bump_clamp."

  - section: consistency_model
    instances:
      - name: discharge_response_already_carries_every_derived_field
        claim_type: consistency_model
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_admissions_discharge.side_effects
          - calculations.admission_billable_nights
        distinguishing_aspect: "The consistency model is immediate, so the discharge response itself - not a later read - already reports final_billable_nights 4 and status DISCHARGED, and follow-up reads of the admission, the youth and the program return byte-identical derived values with no settling period."
        test_recipe:
          setup:
            - "an EMERGENCY_SHELTER program with one ACTIVE admission for CLEARED youth Fabio Renzi, admitted at 2026-08-01T00:00:00Z, whose GuardianNotification was attempted by PHONE then resolved CONTACTED"
            - "the clock is moved to 2026-08-05T00:00:00Z before the discharge, so the chronological_actual variant yields 4 nights"
          setup_api_calls:
            - call: "POST /ryhs/shelter-programs"
              payload: { name: "Riverside Emergency Shelter", program_type: "EMERGENCY_SHELTER", licensed_bed_capacity: 2, min_age_years: 12, max_age_years: 17, max_stay_nights: 21, max_placement_days: 540, savings_match_rate_bp: 2500, required_savings_rate_bp: 2000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { imd_program_id: $.data.id }
