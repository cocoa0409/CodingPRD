      - "{NOTICED, DISPUTED} → SETTLED, records the amount, basis and composer_share_cents"
      - "appends a SETTLEMENT ledger entry whose cash_recognized_at is the clock when payment_received = true and null otherwise"
      - "returns the Composition to AVAILABLE once open_claim_count reaches 0"

  - method: POST
    path: /music-library/infringement-claims/{claim_id}/escalate
    roles: [RightsManager]
    input: [escalation_note]
    output: InfringementClaim
    status_code: 200
    side_effects: ["DISPUTED → ESCALATED with no ledger entry; returns the Composition to AVAILABLE once open_claim_count reaches 0"]

