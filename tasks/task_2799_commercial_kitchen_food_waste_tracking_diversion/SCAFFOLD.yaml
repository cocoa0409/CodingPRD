    input: [site_id, hauler_id, channel, pickup_window_start, pickup_window_end, "container_tare_grams?"]
    output: DiversionConsignment
    side_effects: ["reserves the half-open interval [pickup_window_start, pickup_window_end) against Hauler.max_concurrent_pickups; logistics_status DRAFT, settlement_status UNBILLED"]
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_IDENTITY_NOT_RECOGNIZED, ERR_INVALID_REQUEST, ERR_SITE_NOT_FOUND, ERR_HAULER_NOT_FOUND, ERR_SITE_SCOPE_VIOLATION, ERR_HAULER_CHANNEL_UNSUPPORTED, ERR_HAULER_WINDOW_CAPACITY]

