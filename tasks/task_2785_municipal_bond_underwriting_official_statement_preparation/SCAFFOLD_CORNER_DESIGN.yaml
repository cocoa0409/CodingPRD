      - name: a_section_author_may_not_approve_their_own_section
        claim_type: segregation_of_duties
        grounds:
          - validations[section-author-is-not-approver] (priority 12, category business_safety)
          - errors[ERR_SECTION_SELF_APPROVAL]
        distinguishing_aspect: |
          MSRB Rule G-17 segregation of duties turns on X-User-Id, not on the role: both users are
          BondCounsel and both pass the RBAC check, so the refusal is a 422
          ERR_SECTION_SELF_APPROVAL and not a 403. The author is captured from the CREATE call's
          X-User-Id, so a second BondCounsel user approves the very same section successfully, and
          the approver is recorded separately in approved_by_user_id.
        test_recipe:
          setup:
