scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_composite_provisional_vs_final
        grounds:
          - calculations.assessment_composite
          - entities.OrganizationalAssessment.fields.provisional_rating
          - entities.OrganizationalAssessment.fields.final_rating
        distinguishing_aspect: |
          Assessment domain: identical dimension scores (80/90/70) produce
          composite 81.00/ADEQUATE provisionally but 86.00/STRONG in the final
          variant once the +5 site-visit adjustment applies — a different rating
          band for identical inputs, driving a different member charter outcome.
        test_recipe:
          setup:
            - "NetworkMember m1 in APPLICANT, then UNDER_ASSESSMENT with a DRAFT assessment"
            - "assessment submitted with governance 80, finance 90, program 70 by Assessor A1"
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Harbor Housing", ein: "111111111", state_code: "CA", service_regions: ["06037"] }
              as: NetworkDirector
              captures: { m1: $.data.id }
            - call: "POST /housing-network/members/${m1}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { a1: $.data.id }
            - call: "POST /housing-network/assessments/${a1}/submit"
              payload: { governance_score: 80, finance_score: 90, program_capacity_score: 70 }
              as: Assessor
            - call: "POST /housing-network/assessments/${a1}/score"
              payload: {}
              as: NetworkDirector
          trigger:
            - call: "POST /housing-network/assessments/${a1}/adjudicate"
              payload: { site_visit_adjustment: 5 }
              as: NetworkDirector
              captures: { final_rating: $.data.final_rating, composite: $.data.composite_score }
          assert:
            - "OrganizationalAssessment.${a1}.composite_score == 86.00"
            - "OrganizationalAssessment.${a1}.final_rating == STRONG"
            - "OrganizationalAssessment.${a1}.provisional_rating == ADEQUATE (frozen from submit-time provisional variant 81.00)"
            - "NetworkMember.${m1}.charter_status == PROVISIONAL"

      - name: match_requirement_reduced_vs_standard
        grounds:
          - calculations.match_requirement
          - entities.GrantAward.fields.required_match_cents
        distinguishing_aspect: |
          Award fiscal domain (distinct from the assessment domain of the
          sibling instance): two awards with identical totals of 100000 cents
          require 10000 vs 25000 match cents purely because one member was
          chartered 12 months ago (reduced 10% rate) and the other 30 months
          ago (standard 25% rate).
        test_recipe:
          setup:
            - "Members mNew (chartered 12 months ago) and mOld (chartered 30 months ago), each CHARTERED with one UNDER_REVIEW formula-only application requesting 100000 formula cents in an AWARDED cycle with formula_pool 1000000"
            - "clock managed via /_clock/set_current_utc so charter dates differ by 18 months"
          setup_api_calls:
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2024-03-01T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/members"
              payload: { legal_name: "Old Roots Housing", ein: "222222222", state_code: "TX", service_regions: ["48001"] }
              as: NetworkDirector
              captures: { m_old: $.data.id }
            - call: "POST /housing-network/members/${m_old}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { a_old: $.data.id }
            - call: "POST /housing-network/assessments/${a_old}/submit"
              payload: { governance_score: 90, finance_score: 90, program_capacity_score: 90 }
              as: Assessor
            - call: "POST /housing-network/assessments/${a_old}/score"
              payload: {}
              as: NetworkDirector
            - call: "POST /housing-network/assessments/${a_old}/adjudicate"
              payload: { site_visit_adjustment: 0 }
              as: NetworkDirector
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${m_old}", full_name: "Old Counselor", email: "old.counselor@x.com" }
              as: NetworkDirector
              captures: { c_old: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "HO-101", title: "Homeownership Basics", program_area: "HOMEOWNERSHIP", capacity: 10, ce_eligible: false, ce_credits: 0, delivery_start: "2024-03-02T00:00:00Z", delivery_end: "2024-03-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crs_old: $.data.id }
            - call: "POST /housing-network/courses/${crs_old}/enrollments"
              payload: { counselor_id: "${c_old}" }
              as: TrainingRegistrar
              captures: { e_old: $.data.id }
            - call: "POST /housing-network/_clock/set_current_utc"
