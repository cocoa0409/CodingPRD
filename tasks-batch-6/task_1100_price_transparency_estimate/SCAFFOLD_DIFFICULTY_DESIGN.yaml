        grounds:
          - validations[priority=11]
          - errors[ERR_PROVIDER_UNAVAILABLE]
          - entities.Appointment.fields.provider_id
        distinguishing_aspect: "Provider resource, buffered semantics: an existing appointment 10:00-11:00 blocks a new appointment 11:05-12:00 on the same provider (5-minute gap < CLEANUP_BUFFER_MINUTES=15) even though the raw intervals do not overlap -> ERR_PROVIDER_UNAVAILABLE. Room is free (different room), isolating the provider conflict."
