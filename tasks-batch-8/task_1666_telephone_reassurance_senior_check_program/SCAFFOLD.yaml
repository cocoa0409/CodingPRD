# =============================================================================
# Task 1666 — Telephone Reassurance & Senior Check-In Program (seed tables)
# =============================================================================

scenario: |
  Telephone Reassurance & Senior Check-In Program (area agency on aging program): participant enrollment & emergency contact/escalation plan, call schedule & assignment to volunteer callers, no-answer protocol & welfare check escalation, call log documentation & concern flagging, volunteer training & confidentiality, referral to services from identified needs, program capacity & waitlist, satisfaction & outcome tracking

domain_name: senior-check-in
api_prefix: /api

complexity_profile:
  primary_archetype: quota_allocation        # program capacity + waitlist promotion with reserved slots
  secondary_archetype: compliance_audit      # no-answer escalation protocol, SoD on resolution, confidentiality gating
  complexity_layers:
    - optimistic_concurrency                 # OCC on Participant / Program / CallAssignment versions
    - cascading_side_effects                 # no-answer and training-lapse cascades, depth 4-5
    - rate_threshold_triggers                # no-answer streak threshold, reliability tiers, SLA breach
    - selector_policy                        # volunteer auto-selection with eligibility filter + ranking + tie-break
  entity_topology: flat                      # peer collections linked by FK references, flat URLs under /api
  state_machine_shape: cyclic                # participant/volunteer/waitlist/referral loops + branching escalation
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties          # escalation opener cannot resolve; peer roles split intake/coordination/review
  consistency_model: immediate               # all mutations and computed fields visible in the same response

# =============================================================================
# Table 1: Entity-Relationship Table (16 entities)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: total_capacity, type: integer, source: input, description: "Maximum concurrently served participants (ENROLLED+SUSPENDED+WELFARE_HOLD)", constraints: "1..10000" }
      - { name: max_reserve_slots, type: integer, source: input, default: 5, description: "Upper bound on slots reserved for CRITICAL-tier waitlisted applicants", constraints: "0..total_capacity" }
      - { name: no_answer_threshold, type: integer, source: input, default: 3, description: "Consecutive unanswered/b_busy/wrong-number call logs that open an escalation", constraints: ">=1" }
      - { name: escalation_retry_hours, type: integer, source: input, default: 4, description: "Hours an escalation STEP_1_RETRY must wait before advancing unless a retry log exists" }
      - { name: contact_phase_hours, type: integer, source: input, default: 24, description: "Hours STEP_2_CONTACT must wait before advancing unless all ACTIVE contacts attempted" }
      - { name: offer_ttl_hours, type: integer, source: input, default: 72, description: "Waitlist offer time-to-live in hours" }
      - { name: reapply_cooling_days, type: integer, source: input, default: 30, description: "Cooling-off days before a DENIED/DISENROLLED/EXITED participant may re-apply" }
      - { name: survey_valid_days, type: integer, source: input, default: 30, description: "Days a satisfaction survey stays returnable" }
      - { name: doc_buffer_minutes, type: integer, source: input, default: 15, description: "Documentation buffer appended to every assignment window for load and conflict math" }
      - { name: current_policy_version, type: string, source: input, description: "Confidentiality policy version that agreements must match to be current" }
      - { name: intake_posture, type: enum, source: system, description: "OPEN | PAUSED — PAUSED blocks new applications and approvals" }
      - { name: occupied_slots, type: integer, source: computed, description: "Count of Participants with status in {ENROLLED, SUSPENDED, WELFARE_HOLD}" }
      - { name: waiting_count, type: integer, source: computed, description: "Count of WaitlistEntry rows with status in {WAITING, OFFERED}" }
      - { name: promotion_epoch, type: integer, source: system, description: "Starts 0; incremented by every successful promotion run" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: phone, type: string, source: input, description: "Primary phone number" }
      - { name: address, type: string, source: input, description: "Service address" }
      - { name: primary_language, type: string, source: input, default: "en", description: "ISO 639-1 language code; non-en requires volunteer language match" }
      - { name: referral_source, type: enum, source: input, description: "SELF | FAMILY | APS_REFERRAL | HOSPITAL_DISCHARGE | OTHER_PROVIDER" }
      - { name: age_band, type: enum, source: input, description: "AGE_65_74 | AGE_75_84 | AGE_85_PLUS" }
      - { name: lives_alone, type: boolean, source: input, description: "Lives alone flag" }
      - { name: mobility, type: enum, source: input, description: "NONE | LIMITED | SEVERE" }
      - { name: cognitive_concern, type: boolean, source: input, description: "Documented cognitive concern" }
      - { name: chronic_conditions_count, type: integer, source: input, description: "Count of chronic conditions", constraints: "0..10" }
      - { name: recent_hospitalization, type: boolean, source: input, description: "Hospitalization in past 90 days" }
      - { name: recent_bereavement, type: boolean, source: input, description: "Loss of spouse/partner in past 12 months" }
      - { name: acuity_score, type: integer, source: computed, description: "Intake acuity score 0..100 (capped), computed at submit-review; never recomputed afterwards" }
      - { name: acuity_tier, type: enum, source: computed, description: "LOW | MODERATE | HIGH | CRITICAL from acuity_score bands" }
      - { name: rolling_acuity_score, type: number, source: computed, description: "Outcome-signal acuity recomputed by each daily-closeout; null until first closeout after enrollment" }
      - { name: rolling_acuity_tier, type: enum, source: computed, description: "LOW | MODERATE | HIGH | CRITICAL from rolling_acuity_score; null until computed" }
      - { name: effective_acuity_tier, type: enum, source: computed, description: "More severe of acuity_tier and rolling_acuity_tier (rolling null -> acuity_tier)" }
      - { name: status, type: enum, source: system, description: "APPLICANT | UNDER_REVIEW | WAITLISTED | ENROLLED | SUSPENDED | WELFARE_HOLD | DENIED | DISENROLLED | EXITED" }
      - { name: consecutive_no_answer_count, type: integer, source: system, description: "Streak of logs with outcome in {NO_ANSWER, BUSY, WRONG_NUMBER}; reset to 0 on REACHED_*/REFUSED and on escalation resolution" }
      - { name: open_escalation_id, type: string, source: system, description: "id of the single non-terminal EscalationCase, null when none" }
      - { name: coverage_deficient, type: boolean, source: computed, description: "True when ACTIVE CallSchedule weekly sessions < required weekly contacts for effective_acuity_tier, or when future SCHEDULED assignments were cancelled and not replaced" }
      - { name: enrolled_at, type: datetime, source: system, description: "Timestamp of last transition into ENROLLED; null if never enrolled" }
      - { name: last_status_change_at, type: datetime, source: system, description: "Timestamp of most recent status transition (drives reapply cooling-off)" }

  - name: EmergencyContact
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; owning participant" }
      - { name: full_name, type: string, source: input, description: "Contact name" }
      - { name: phone, type: string, source: input, description: "Contact phone" }
      - { name: relationship, type: string, source: input, description: "Relationship to participant" }
      - { name: contact_rank, type: enum, source: input, description: "PRIMARY | SECONDARY — contacts attempted PRIMARY first, then SECONDARY by created_at ASC" }
      - { name: accepts_24h, type: boolean, source: input, default: false, description: "Willing to accept calls at any hour (required for HIGH/CRITICAL enrollees)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNREACHABLE | REMOVED" }

  - name: WaitlistEntry
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; waitlisted participant (at most one non-terminal entry per participant)" }
      - { name: status, type: enum, source: system, description: "WAITING | OFFERED | ACCEPTED | REMOVED" }
      - { name: waitlist_entered_at, type: datetime, source: system, description: "When the participant was waitlisted (drives days_waiting and tie-breaks)" }
      - { name: offered_at, type: datetime, source: system, description: "When current offer was made; null while WAITING" }
      - { name: offer_expires_at, type: datetime, source: system, description: "offered_at + program.offer_ttl_hours; expired only when clock strictly greater" }
      - { name: declines_count, type: integer, source: system, description: "Times the applicant declined an offer; entry auto-REMOVED at 2" }
      - { name: expires_count, type: integer, source: system, description: "Times an offer lapsed unanswered; entry auto-REMOVED at 2" }
      - { name: priority_score_at_offer, type: integer, source: system, description: "Priority score computed at promotion time; null while never offered" }
      - { name: removal_reason, type: enum, source: system, description: "WITHDRAWN | MAX_DECLINES | MAX_EXPIRES | null" }

  - name: VolunteerCaller
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: phone, type: string, source: input, description: "Volunteer phone" }
      - { name: languages, type: array, source: input, default: ["en"], description: "ISO 639-1 language codes the volunteer can call in" }
      - { name: max_weekly_minutes, type: integer, source: input, default: 240, description: "Weekly cap on assigned slot+buffer minutes", constraints: "60..600" }
      - { name: status, type: enum, source: system, description: "APPLICANT | IN_TRAINING | ACTIVE | INACTIVE | LAPSED | SEPARATED" }
      - { name: reliability_windowed, type: number, source: computed, description: "Showed-up rate over trailing 28 days, 1dp; null until >=10 denominators" }
      - { name: reliability_streak_adj, type: number, source: computed, description: "reliability_windowed minus 5 per consecutive trailing EXPIRED miss, floor 0; null until computable" }
      - { name: reliability_tier, type: enum, source: computed, description: "GOLD | SILVER | BRONZE | PROBATION from reliability_windowed; SILVER while history < 10" }
      - { name: max_concurrent_assignments, type: integer, source: computed, description: "Tier cap: GOLD 12 | SILVER 10 | BRONZE 8 | PROBATION 4" }
      - { name: current_week_minutes, type: integer, source: computed, description: "Sum over non-terminal assignments in the current ISO week of (window minutes + doc_buffer_minutes)" }

  - name: AvailabilityWindow
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> VolunteerCaller.id; owning volunteer" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN" }
      - { name: window_start, type: string, source: input, description: "HH:MM 24h, half-open interval start" }
      - { name: window_end, type: string, source: input, description: "HH:MM 24h, half-open interval end; must be after window_start" }
      - { name: effective_from, type: string, source: input, description: "ISO date from which the window applies" }
      - { name: effective_to, type: string, source: input, description: "ISO date until which the window applies (inclusive); null = open-ended" }

  - name: TrainingRecord
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> VolunteerCaller.id; owning volunteer" }
      - { name: module, type: enum, source: input, description: "SAFETY_PROTOCOL | LISTENING_SKILLS | MANDATED_REPORTING | CONFIDENTIALITY_BASICS" }
      - { name: completed_at, type: datetime, source: input, description: "When training was completed" }
      - { name: valid_until, type: datetime, source: input, description: "Expiry instant; record is EXPIRED when clock > valid_until" }
      - { name: status, type: enum, source: computed, description: "VALID | EXPIRED — derived from valid_until vs logical clock" }

  - name: ConfidentialityAgreement
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> VolunteerCaller.id; signing volunteer" }
      - { name: policy_version, type: string, source: input, description: "Policy version signed; must equal program.current_policy_version to be current" }
      - { name: signed_at, type: datetime, source: system, description: "Server timestamp of signing" }
      - { name: valid_until, type: datetime, source: input, description: "Expiry instant; agreement EXPIRED when clock > valid_until" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | REVOKED | EXPIRED — at most one ACTIVE per volunteer" }

  - name: CallSchedule
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; owning participant" }
      - { name: weekday, type: enum, source: input, description: "MON | TUE | WED | THU | FRI | SAT | SUN" }
      - { name: window_start, type: string, source: input, description: "HH:MM 24h; half-open start; must be before window_end" }
      - { name: window_end, type: string, source: input, description: "HH:MM 24h; total window must be 15..120 minutes" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | ARCHIVED — at most one ACTIVE or PAUSED per (participant, weekday)" }

  - name: CallAssignment
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; called participant" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> VolunteerCaller.id; assigned volunteer (explicit or selector-chosen); null only on selector-failed escalation retries" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date of the call" }
      - { name: window_start, type: string, source: input, description: "HH:MM 24h call window start (closed interval for conflict math)" }
      - { name: window_end, type: string, source: input, description: "HH:MM 24h call window end; must be after window_start" }
      - { name: source, type: enum, source: input, default: REGULAR, description: "REGULAR | MAKEUP — ESCALATION_RETRY is system-set only" }
      - { name: escalation_id, type: string, source: system, description: "FK -> EscalationCase.id; set only on system-created retry assignments; else null" }
      - { name: rescheduled_from_id, type: string, source: system, description: "FK -> CallAssignment.id; set on the replacement created by reschedule; else null" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | UNREACHED | CANCELLED | EXPIRED" }
      - { name: cancel_reason, type: enum, source: system, description: "PARTICIPANT_SUSPEND | WELFARE_HOLD | VOLUNTEER_LAPSED | RESCHEDULED | MANUAL | null" }

  - name: CallLog
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> CallAssignment.id; exactly one log per assignment" }
      - { name: called_at, type: datetime, source: input, description: "When the call was placed; must not be after the logical clock" }
      - { name: duration_seconds, type: integer, source: input, description: "Call duration", constraints: ">=0" }
      - { name: outcome, type: enum, source: input, description: "REACHED_OK | REACHED_CONCERN | NO_ANSWER | BUSY | REFUSED | WRONG_NUMBER" }
      - { name: concern_level, type: enum, source: input, default: NONE, description: "NONE | ROUTINE | URGENT | IMMEDIATE_DANGER" }
      - { name: concern_categories, type: array, source: input, default: [], description: "Subset of HEALTH | SAFETY | MOOD | NUTRITION | MEDICATION | HOUSING | OTHER" }
      - { name: concern_flag, type: boolean, source: computed, description: "True iff outcome == REACHED_CONCERN or concern_level != NONE" }
      - { name: follow_up_needed, type: boolean, source: input, default: false, description: "Whether a follow-up is required" }
      - { name: follow_up_plan, type: string, source: input, description: "Required non-empty when concern_level == IMMEDIATE_DANGER" }
      - { name: supervisor_notified, type: boolean, source: input, default: false, description: "Must be true when concern_level == IMMEDIATE_DANGER" }
      - { name: notes, type: string, source: input, description: "Free-text call notes" }

  - name: EscalationCase
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; subject participant" }
      - { name: trigger_type, type: enum, source: system, description: "NO_ANSWER_PROTOCOL | CONCERN_IMMEDIATE | MANUAL — CONCERN_IMMEDIATE opens directly at STEP_3_WELFARE" }
      - { name: stage, type: enum, source: system, description: "STEP_1_RETRY | STEP_2_CONTACT | STEP_3_WELFARE | RESOLVED_OK | RESOLVED_CONTACT_CONFIRMED | RESOLVED_WITH_REFERRAL | CLOSED_SUPERSEDED | CLOSED_FALSE_ALARM" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that opened the case (system for auto-opened); resolver must differ" }
      - { name: opened_at, type: datetime, source: system, description: "Open timestamp" }
      - { name: stage_entered_at, type: datetime, source: system, description: "When current stage began; drives step deadlines" }
      - { name: retry_assignment_id, type: string, source: system, description: "FK -> CallAssignment.id; auto-created retry assignment at STEP_1_RETRY; null when pool empty" }
      - { name: supersedes_escalation_id, type: string, source: system, description: "FK -> EscalationCase.id; the OPEN case this one closed via supersede; else null" }
      - { name: contact_attempts, type: array, source: system, description: "Append-only [{contact_id, outcome, attempted_at}] recorded at STEP_2_CONTACT" }
      - { name: resolution_note, type: string, source: system, description: "Resolution note; null while open" }

  - name: WelfareCheckRequest
    parent: null
    common_fields: true
    fields:
      - { name: escalation_id, type: string, source: system, description: "FK -> EscalationCase.id; originating escalation" }
      - { name: participant_id, type: string, source: system, description: "FK -> Participant.id; denormalized subject for partner queries" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DISPATCHED | COMPLETED | DECLINED" }
      - { name: disposition, type: enum, source: system, description: "NONE | OK | ASSIST_NEEDED | NOT_FOUND" }
      - { name: requested_at, type: datetime, source: system, description: "Creation timestamp" }
      - { name: dispatched_at, type: datetime, source: system, description: "Dispatch timestamp; null until dispatched" }
      - { name: completed_at, type: datetime, source: system, description: "Completion timestamp; null until completed" }
      - { name: responder_note, type: string, source: system, description: "Partner note; null until provided" }

  - name: ServiceReferral
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; referred participant" }
      - { name: source_call_log_id, type: string, source: input, description: "FK -> CallLog.id; identifying call log — when present its concern_flag must be true; null only for coordinator-observed needs" }
      - { name: escalation_id, type: string, source: system, description: "FK -> EscalationCase.id; set when auto-created by ASSIST_NEEDED resolution; else null" }
      - { name: service_type, type: enum, source: input, description: "MEALS | TRANSPORT | HOME_HEALTH | ADULT_DAY | CAREGIVER_SUPPORT | BEHAVIORAL_HEALTH" }
      - { name: priority, type: enum, source: input, default: STANDARD, description: "URGENT | STANDARD | ROUTINE — auto-created referrals are always URGENT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | DECLINED | WITHDRAWN | CLOSED" }
      - { name: submitted_at, type: datetime, source: system, description: "First transition into SUBMITTED; null until submitted" }
      - { name: sla_due_at, type: datetime, source: computed, description: "submitted_at + SLA hours by priority (URGENT 24 | STANDARD 72 | ROUTINE 168); null until submitted" }
      - { name: overdue, type: boolean, source: computed, description: "True iff status == SUBMITTED and logical clock strictly greater than sla_due_at" }
      - { name: decline_reason, type: string, source: system, description: "Reason captured on DECLINED; null otherwise" }

  - name: SatisfactionSurvey
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id; surveyed participant — at most one survey per (participant, period_month)" }
      - { name: period_month, type: string, source: input, description: "Survey period YYYY-MM" }
      - { name: issued_at, type: datetime, source: system, description: "Issue timestamp" }
      - { name: status, type: enum, source: system, description: "ISSUED | SCORED | EXPIRED" }
      - { name: items, type: array, source: input, description: "Exactly 5 integers 1..5 in fixed order [companionship, mood, safety, usefulness, overall]" }
      - { name: survey_mean, type: number, source: computed, description: "Weighted mean with weights [1,2,1,1,2], round_half_up to 2dp; null until SCORED" }

  - name: OutcomeReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; reported program" }
      - { name: period_month, type: string, source: input, description: "Reported period YYYY-MM" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINALIZED — finalize requires logical clock past period end" }
      - { name: calls_scheduled, type: integer, source: computed, description: "Assignments with scheduled_date in period; provisional counts only scheduled_date <= today" }
      - { name: calls_completed, type: integer, source: computed, description: "Assignments COMPLETED in period" }
      - { name: completion_rate, type: number, source: computed, description: "round_half_up(calls_completed / denominator * 100, 1); denominator variant-dependent; null when denominator 0" }
      - { name: escalations_opened, type: integer, source: computed, description: "Escalations opened in period" }
      - { name: escalations_resolved, type: integer, source: computed, description: "Escalations reaching RESOLVED_* in period" }
      - { name: referrals_submitted, type: integer, source: computed, description: "Referrals with submitted_at in period" }
      - { name: unique_participants_reached, type: integer, source: computed, description: "Distinct participants with a REACHED_* log in period" }
      - { name: satisfaction_index, type: number, source: computed, description: "round_half_up(mean of survey_mean over SCORED surveys in period, 2); null when none" }

# =============================================================================
# Table 2: State Machine Table (13 machines)
# =============================================================================
state_machines:
  - entity: Participant
    field: status
    initial_state: APPLICANT
    terminal_states: []
    transitions:
      - from: APPLICANT
        to: UNDER_REVIEW
        trigger: "POST /api/participants/{id}/submit-review"
        actor: IntakeWorker
        preconditions:
          - "Participant.status == APPLICANT (ERR_INVALID_STATE)"
          - "All intake fields present (enforced at creation)"
        side_effects:
          - "acuity_score and acuity_tier computed (calculation participant_acuity_score, variant intake)"
          - "last_status_change_at set to logical clock"
      - from: UNDER_REVIEW
        to: ENROLLED
        trigger: "POST /api/participants/{id}/approve (capacity branch admits)"
        actor: IntakeWorker
        preconditions:
          - "Participant.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Program.intake_posture == OPEN (ERR_INTAKE_PAUSED)"
          - "At least one ACTIVE EmergencyContact with contact_rank == PRIMARY (ERR_EMERGENCY_CONTACT_REQUIRED)"
          - "If effective tier is HIGH or CRITICAL: at least one ACTIVE EmergencyContact with accepts_24h == true (ERR_NO_24H_CONTACT)"
          - "Capacity branch per calculation effective_capacity: gross_free >= 1 for CRITICAL tier; gross_free - reserved >= 1 otherwise; else this transition is not taken and the applicant is waitlisted"
        side_effects:
          - "Program.occupied_slots += 1 and Program.version += 1"
          - "enrolled_at and last_status_change_at set"
      - from: UNDER_REVIEW
        to: WAITLISTED
        trigger: "POST /api/participants/{id}/approve (capacity branch waitlists)"
        actor: IntakeWorker
        preconditions:
          - "Same safety preconditions as UNDER_REVIEW -> ENROLLED (safety errors fire before the capacity branch is evaluated)"
        side_effects:
          - "WaitlistEntry created with status WAITING, waitlist_entered_at = clock"
          - "Program.waiting_count += 1"
          - "last_status_change_at set"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/participants/{id}/deny"
        actor: IntakeWorker
        preconditions:
          - "Participant.status == UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects:
          - "last_status_change_at set"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "POST /api/waitlist-entries/{id}/accept"
        actor: IntakeWorker
        preconditions:
          - "Linked WaitlistEntry.status == OFFERED (ERR_OFFER_NOT_OPEN)"
          - "Logical clock <= offer_expires_at (else ERR_OFFER_NOT_OPEN; closeout requeues)"
          - "Capacity re-check at accept time per effective_capacity: gross_free >= 1 (CRITICAL) or gross_free - reserved >= 1 (others) else ERR_CAPACITY_REACHED and entry stays OFFERED"
        side_effects:
          - "WaitlistEntry -> ACCEPTED; Program.waiting_count -= 1"
          - "Program.occupied_slots += 1 and Program.version += 1"
          - "enrolled_at and last_status_change_at set"
      - from: WAITLISTED
        to: EXITED
        trigger: "system (linked WaitlistEntry reaches REMOVED) or POST /api/waitlist-entries/{id}/withdraw"
        actor: system
        preconditions:
          - "Linked entry in WAITING or OFFERED"
        side_effects:
          - "Program.waiting_count -= 1"
          - "last_status_change_at set"
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /api/participants/{id}/suspend"
        actor: ProgramCoordinator
        preconditions:
          - "Participant.status == ENROLLED (ERR_INVALID_STATE)"
        side_effects:
          - "All CallAssignments with status == SCHEDULED -> CANCELLED with cancel_reason PARTICIPANT_SUSPEND; each cancellation recomputes volunteer current_week_minutes and participant coverage_deficient (coverage_deficient set true when future coverage was removed)"
          - "Program.occupied_slots unchanged (SUSPENDED still occupies a slot)"
          - "last_status_change_at set"
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /api/participants/{id}/resume"
        actor: ProgramCoordinator
        preconditions:
          - "Participant.status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "One new CallAssignment (source REGULAR) created per ACTIVE CallSchedule whose next occurrence falls within the next 7 days: window = schedule.window_start through schedule.window_start + 30 minutes on that occurrence date, volunteer chosen by the selector; when the selector pool is empty no assignment is created for that weekday and coverage_deficient is set true"
          - "coverage_deficient recomputed"
          - "last_status_change_at set"
      - from: ENROLLED
        to: WELFARE_HOLD
        trigger: "system (an EscalationCase for this participant enters STEP_3_WELFARE)"
        actor: system
        preconditions:
          - "Participant.status == ENROLLED"
        side_effects:
          - "All future-dated SCHEDULED CallAssignments -> CANCELLED with cancel_reason WELFARE_HOLD; volunteer current_week_minutes recomputed per cancellation"
          - "Program.occupied_slots unchanged (WELFARE_HOLD still occupies a slot)"
          - "last_status_change_at set"
      - from: WELFARE_HOLD
        to: ENROLLED
        trigger: "system (linked WelfareCheckRequest COMPLETED with disposition OK, or escalation resolved without disenrollment)"
        actor: system
        preconditions:
          - "Escalation resolved and no WelfareCheckRequest with disposition in {ASSIST_NEEDED, NOT_FOUND} remains actionable"
        side_effects:
          - "consecutive_no_answer_count reset to 0"
          - "Assignments regenerated as in SUSPENDED -> ENROLLED; coverage_deficient recomputed"
          - "last_status_change_at set"
      - from: WELFARE_HOLD
        to: DISENROLLED
        trigger: "POST /api/participants/{id}/disenroll"
        actor: ProgramCoordinator
        preconditions:
          - "Participant.status in {ENROLLED, SUSPENDED, WELFARE_HOLD} (ERR_INVALID_STATE)"
        side_effects:
          - "Program.occupied_slots -= 1 and Program.version += 1"
          - "All SCHEDULED CallAssignments -> CANCELLED with cancel_reason MANUAL"
          - "last_status_change_at set"
      - from: ENROLLED
        to: DISENROLLED
        trigger: "POST /api/participants/{id}/disenroll"
        actor: ProgramCoordinator
        preconditions: ["Participant.status in {ENROLLED, SUSPENDED, WELFARE_HOLD} (ERR_INVALID_STATE)"]
        side_effects: ["Same as WELFARE_HOLD -> DISENROLLED"]
      - from: SUSPENDED
        to: DISENROLLED
        trigger: "POST /api/participants/{id}/disenroll"
        actor: ProgramCoordinator
        preconditions: ["Participant.status in {ENROLLED, SUSPENDED, WELFARE_HOLD} (ERR_INVALID_STATE)"]
        side_effects: ["Same as WELFARE_HOLD -> DISENROLLED"]
      - from: DENIED
        to: APPLICANT
        trigger: "POST /api/participants/{id}/reapply"
        actor: IntakeWorker
        preconditions:
          - "Participant.status in {DENIED, DISENROLLED, EXITED} (ERR_INVALID_STATE)"
          - "Logical clock >= last_status_change_at + program.reapply_cooling_days (ERR_REAPPLICATION_TOO_SOON)"
        side_effects:
          - "acuity fields cleared (recomputed on next submit-review); consecutive_no_answer_count reset 0"
          - "last_status_change_at set"
      - from: DISENROLLED
        to: APPLICANT
        trigger: "POST /api/participants/{id}/reapply"
        actor: IntakeWorker
        preconditions: ["Same as DENIED -> APPLICANT"]
        side_effects: ["Same as DENIED -> APPLICANT"]
      - from: EXITED
        to: APPLICANT
        trigger: "POST /api/participants/{id}/reapply"
        actor: IntakeWorker
        preconditions: ["Same as DENIED -> APPLICANT"]
        side_effects: ["Same as DENIED -> APPLICANT"]

  - entity: WaitlistEntry
    field: status
    initial_state: WAITING
    terminal_states: [ACCEPTED, REMOVED]
    transitions:
      - from: WAITING
        to: OFFERED
        trigger: "POST /api/programs/{id}/promotion-runs (selector offers to top-ranked entries within free slots)"
        actor: IntakeWorker
        preconditions:
          - "Entry status == WAITING"
          - "Entry ranks within the offered window per calculation waitlist_promotion"
        side_effects:
          - "offered_at = clock; offer_expires_at = clock + program.offer_ttl_hours"
          - "priority_score_at_offer set to the computed score"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/waitlist-entries/{id}/accept"
        actor: IntakeWorker
        preconditions:
          - "Entry status == OFFERED (ERR_OFFER_NOT_OPEN)"
          - "Capacity re-check passes (else ERR_CAPACITY_REACHED, entry unchanged)"
        side_effects:
          - "Participant WAITLISTED -> ENROLLED; Program.occupied_slots += 1, waiting_count -= 1, Program.version += 1"
      - from: OFFERED
        to: WAITING
        trigger: "POST /api/waitlist-entries/{id}/decline"
        actor: IntakeWorker
        preconditions: ["Entry status == OFFERED (ERR_OFFER_NOT_OPEN)"]
        side_effects:
          - "declines_count += 1; offered_at and offer_expires_at cleared"
          - "If declines_count >= 2 after increment: entry -> REMOVED with removal_reason MAX_DECLINES and Participant WAITLISTED -> EXITED"
      - from: OFFERED
        to: WAITING
        trigger: "system (POST /api/programs/{id}/daily-closeout finds clock strictly greater than offer_expires_at)"
        actor: system
        preconditions: ["Entry status == OFFERED and clock > offer_expires_at"]
        side_effects:
          - "expires_count += 1; offered_at and offer_expires_at cleared"
          - "If expires_count >= 2 after increment: entry -> REMOVED with removal_reason MAX_EXPIRES and Participant WAITLISTED -> EXITED"
      - from: WAITING
        to: REMOVED
        trigger: "POST /api/waitlist-entries/{id}/withdraw"
        actor: IntakeWorker
        preconditions: ["Entry status in {WAITING, OFFERED} (ERR_OFFER_NOT_OPEN)"]
        side_effects: ["removal_reason WITHDRAWN; Participant WAITLISTED -> EXITED"]
      - from: OFFERED
        to: REMOVED
        trigger: "POST /api/waitlist-entries/{id}/withdraw"
        actor: IntakeWorker
        preconditions: ["Entry status in {WAITING, OFFERED} (ERR_OFFER_NOT_OPEN)"]
        side_effects: ["Same as WAITING -> REMOVED"]

  - entity: VolunteerCaller
    field: status
    initial_state: APPLICANT
    terminal_states: [SEPARATED]
    transitions:
      - from: APPLICANT
        to: IN_TRAINING
        trigger: "POST /api/volunteers/{id}/begin-training"
        actor: ProgramCoordinator
        preconditions: ["VolunteerCaller.status == APPLICANT (ERR_INVALID_STATE)"]
        side_effects: []
      - from: IN_TRAINING
        to: ACTIVE
        trigger: "POST /api/volunteers/{id}/certify"
        actor: ProgramCoordinator
        preconditions:
          - "VolunteerCaller.status in {IN_TRAINING, LAPSED} (ERR_INVALID_STATE)"
          - "TrainingRecords with modules {SAFETY_PROTOCOL, LISTENING_SKILLS, MANDATED_REPORTING} all status VALID (ERR_VOLUNTEER_NOT_CERTIFIED)"
          - "An ACTIVE ConfidentialityAgreement with policy_version == program.current_policy_version and clock <= valid_until (ERR_CONFIDENTIALITY_NOT_CURRENT)"
        side_effects: ["reliability fields initialized from history (tier SILVER while denominator < 10)"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /api/volunteers/{id}/certify"
        actor: ProgramCoordinator
        preconditions: ["Same as IN_TRAINING -> ACTIVE"]
        side_effects: ["Same as IN_TRAINING -> ACTIVE"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/volunteers/{id}/deactivate"
        actor: ProgramCoordinator
        preconditions: ["VolunteerCaller.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["Existing SCHEDULED assignments are NOT cancelled (volunteer may return); no new assignments may be created"]
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /api/volunteers/{id}/reactivate"
        actor: ProgramCoordinator
        preconditions:
          - "VolunteerCaller.status == INACTIVE (ERR_INVALID_STATE)"
          - "Same training and confidentiality currency checks as certify (ERR_VOLUNTEER_NOT_CERTIFIED / ERR_CONFIDENTIALITY_NOT_CURRENT)"
        side_effects: []
      - from: ACTIVE
        to: LAPSED
        trigger: "system (POST /api/programs/{id}/daily-closeout finds a required TrainingRecord EXPIRED or the ACTIVE agreement EXPIRED or policy_version stale)"
        actor: system
        preconditions: ["VolunteerCaller.status == ACTIVE and certification currency lost"]
        side_effects:
          - "All future-dated SCHEDULED CallAssignments of this volunteer -> CANCELLED with cancel_reason VOLUNTEER_LAPSED"
          - "Each cancelled assignment recomputes its participant's coverage_deficient (set true)"
      - from: IN_TRAINING
        to: SEPARATED
        trigger: "POST /api/volunteers/{id}/separate"
        actor: ProgramCoordinator
        preconditions: ["VolunteerCaller.status != SEPARATED (ERR_INVALID_STATE)"]
        side_effects: ["Any future-dated SCHEDULED assignments -> CANCELLED with cancel_reason MANUAL"]
      - from: ACTIVE
        to: SEPARATED
        trigger: "POST /api/volunteers/{id}/separate"
        actor: ProgramCoordinator
        preconditions: ["VolunteerCaller.status != SEPARATED (ERR_INVALID_STATE)"]
        side_effects: ["Same as IN_TRAINING -> SEPARATED"]
      - from: INACTIVE
        to: SEPARATED
        trigger: "POST /api/volunteers/{id}/separate"
        actor: ProgramCoordinator
        preconditions: ["VolunteerCaller.status != SEPARATED (ERR_INVALID_STATE)"]
        side_effects: ["Same as IN_TRAINING -> SEPARATED"]
      - from: LAPSED
        to: SEPARATED
        trigger: "POST /api/volunteers/{id}/separate"
        actor: ProgramCoordinator
        preconditions: ["VolunteerCaller.status != SEPARATED (ERR_INVALID_STATE)"]
        side_effects: ["Same as IN_TRAINING -> SEPARATED"]

  - entity: CallAssignment
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, UNREACHED, CANCELLED, EXPIRED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/call-assignments/{id}/call-logs with outcome in {REACHED_OK, REACHED_CONCERN, REFUSED}"
        actor: VolunteerCaller
        preconditions:
          - "CallAssignment.status == SCHEDULED (ERR_INVALID_STATE)"
          - "called_at <= logical clock (ERR_FUTURE_DATED_CALL_LOG)"
        side_effects:
          - "Participant.consecutive_no_answer_count reset to 0"
          - "If outcome == REACHED_CONCERN and concern_level == IMMEDIATE_DANGER: auto-escalation cascade fires (see EscalationCase)"
          - "Volunteer reliability fields recomputed"
      - from: SCHEDULED
        to: UNREACHED
        trigger: "POST /api/call-assignments/{id}/call-logs with outcome in {NO_ANSWER, BUSY, WRONG_NUMBER}"
        actor: VolunteerCaller
        preconditions: ["Same as SCHEDULED -> COMPLETED"]
        side_effects:
          - "Participant.consecutive_no_answer_count += 1"
          - "If resulting count >= program.no_answer_threshold and participant.open_escalation_id is null: EscalationCase auto-created at STEP_1_RETRY (trigger NO_ANSWER_PROTOCOL) and a retry CallAssignment (source ESCALATION_RETRY) is created via the volunteer selector; retry failure to select leaves retry_assignment_id null"
          - "Volunteer reliability fields recomputed (UNREACHED counts as showed-up)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/call-assignments/{id}/cancel, reschedule, or cascade (suspend / welfare hold / volunteer lapse / separate / disenroll)"
        actor: ProgramCoordinator
        preconditions: ["CallAssignment.status == SCHEDULED (ERR_INVALID_STATE)"]
        side_effects:
          - "cancel_reason set per trigger"
          - "Volunteer current_week_minutes recomputed; participant coverage_deficient recomputed"
      - from: SCHEDULED
        to: EXPIRED
        trigger: "system (POST /api/programs/{id}/daily-closeout finds scheduled_date before today with no CallLog)"
        actor: system
        preconditions: ["CallAssignment.status == SCHEDULED and scheduled_date < current date"]
        side_effects:
          - "Volunteer reliability fields recomputed (EXPIRED counts as a volunteer miss)"
          - "Participant coverage_deficient recomputed"

  - entity: CallSchedule
    field: status
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/call-schedules/{id}/pause"
        actor: ProgramCoordinator
        preconditions: ["CallSchedule.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["Participant coverage_deficient recomputed"]
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/call-schedules/{id}/resume"
        actor: ProgramCoordinator
        preconditions: ["CallSchedule.status == PAUSED (ERR_INVALID_STATE)"]
        side_effects: ["Participant coverage_deficient recomputed"]
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /api/call-schedules/{id}/archive"
        actor: ProgramCoordinator
        preconditions: ["CallSchedule.status in {ACTIVE, PAUSED} (ERR_INVALID_STATE)"]
        side_effects: ["Participant coverage_deficient recomputed; existing CallAssignments unaffected"]
      - from: PAUSED
        to: ARCHIVED
        trigger: "POST /api/call-schedules/{id}/archive"
        actor: ProgramCoordinator
        preconditions: ["CallSchedule.status in {ACTIVE, PAUSED} (ERR_INVALID_STATE)"]
        side_effects: ["Same as ACTIVE -> ARCHIVED"]

  - entity: EscalationCase
    field: stage
    initial_state: STEP_1_RETRY
    terminal_states: [RESOLVED_OK, RESOLVED_CONTACT_CONFIRMED, RESOLVED_WITH_REFERRAL, CLOSED_SUPERSEDED, CLOSED_FALSE_ALARM]
    transitions:
      - from: STEP_1_RETRY
        to: STEP_2_CONTACT
        trigger: "POST /api/escalations/{id}/advance or system via daily-closeout"
        actor: ProgramCoordinator
        preconditions:
          - "EscalationCase.stage in {STEP_1_RETRY, STEP_2_CONTACT} (ERR_NO_OPEN_ESCALATION when terminal)"
          - "At least one no-answer-family CallLog exists on retry_assignment_id, OR logical clock >= stage_entered_at + program.escalation_retry_hours (ERR_ESCALATION_STEP_NOT_DUE)"
        side_effects: ["stage_entered_at reset to clock"]
      - from: STEP_2_CONTACT
        to: STEP_3_WELFARE
        trigger: "POST /api/escalations/{id}/advance or system via daily-closeout"
        actor: ProgramCoordinator
        preconditions:
          - "EscalationCase.stage == STEP_2_CONTACT (ERR_NO_OPEN_ESCALATION when terminal)"
          - "Every ACTIVE EmergencyContact of the participant has >=1 contact_attempts entry, OR logical clock >= stage_entered_at + program.contact_phase_hours (ERR_ESCALATION_STEP_NOT_DUE)"
        side_effects:
          - "WelfareCheckRequest created (status REQUESTED, participant denormalized)"
          - "Participant ENROLLED -> WELFARE_HOLD with assignment cancellation cascade"
          - "stage_entered_at reset to clock"
      - from: STEP_1_RETRY
        to: RESOLVED_OK
        trigger: "system (retry CallAssignment logs outcome in {REACHED_OK, REACHED_CONCERN, REFUSED}) or POST /api/escalations/{id}/resolve"
        actor: system
        preconditions: ["Escalation is open"]
        side_effects:
          - "Participant.consecutive_no_answer_count reset to 0; open_escalation_id cleared"
      - from: STEP_1_RETRY
        to: RESOLVED_CONTACT_CONFIRMED
        trigger: "POST /api/escalations/{id}/resolve"
        actor: QualityReviewer
        preconditions:
          - "Escalation is open (ERR_NO_OPEN_ESCALATION)"
          - "X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["Same streak/field cleanup as RESOLVED_OK"]
      - from: STEP_2_CONTACT
        to: RESOLVED_CONTACT_CONFIRMED
        trigger: "POST /api/escalations/{id}/resolve with resolution RESOLVED_CONTACT_CONFIRMED"
        actor: QualityReviewer
        preconditions:
          - "Escalation is open (ERR_NO_OPEN_ESCALATION)"
          - "X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "At least one contact_attempts entry with outcome REACHED (ERR_INVALID_STATE)"
        side_effects: ["Streak reset; open_escalation_id cleared"]
      - from: STEP_3_WELFARE
        to: RESOLVED_OK
        trigger: "system (WelfareCheckRequest COMPLETED with disposition OK)"
        actor: system
        preconditions: []
        side_effects:
          - "Participant WELFARE_HOLD -> ENROLLED cascade; streak reset; open_escalation_id cleared"
      - from: STEP_3_WELFARE
        to: RESOLVED_WITH_REFERRAL
        trigger: "system (WelfareCheckRequest COMPLETED with disposition ASSIST_NEEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "ServiceReferral auto-created (status SUBMITTED, priority URGENT, escalation_id set, submitted_at = clock)"
          - "Participant WELFARE_HOLD -> ENROLLED cascade; streak reset; open_escalation_id cleared"
      - from: STEP_1_RETRY
        to: CLOSED_FALSE_ALARM
        trigger: "POST /api/escalations/{id}/resolve with resolution CLOSED_FALSE_ALARM"
        actor: QualityReviewer
        preconditions: ["Escalation is open (ERR_NO_OPEN_ESCALATION)", "X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["Streak reset; open_escalation_id cleared; participant status unchanged"]
      - from: STEP_2_CONTACT
        to: CLOSED_FALSE_ALARM
        trigger: "POST /api/escalations/{id}/resolve with resolution CLOSED_FALSE_ALARM"
        actor: QualityReviewer
        preconditions: ["Same as STEP_1_RETRY -> CLOSED_FALSE_ALARM"]
        side_effects: ["Same as STEP_1_RETRY -> CLOSED_FALSE_ALARM"]
      - from: STEP_3_WELFARE
        to: CLOSED_FALSE_ALARM
        trigger: "POST /api/escalations/{id}/resolve with resolution CLOSED_FALSE_ALARM"
        actor: QualityReviewer
        preconditions: ["Escalation is open (ERR_NO_OPEN_ESCALATION)", "X-User-ID != opened_by_user_id (ERR_SEGREGATION_OF_DUTIES)", "No WelfareCheckRequest in {REQUESTED, DISPATCHED} remains (ERR_INVALID_STATE — complete or decline it first)"]
        side_effects: ["Participant WELFARE_HOLD -> ENROLLED cascade if held; streak reset; open_escalation_id cleared"]
      - from: STEP_1_RETRY
        to: CLOSED_SUPERSEDED
        trigger: "system (a new EscalationCase is opened for the same participant)"
        actor: system
        preconditions: []
        side_effects: ["New case carries supersedes_escalation_id = this case; open_escalation_id repointed"]
      - from: STEP_2_CONTACT
        to: CLOSED_SUPERSEDED
        trigger: "system (a new EscalationCase is opened for the same participant)"
        actor: system
        preconditions: []
        side_effects: ["Same as STEP_1_RETRY -> CLOSED_SUPERSEDED"]
      - from: STEP_3_WELFARE
        to: CLOSED_SUPERSEDED
        trigger: "system (a new EscalationCase is opened for the same participant)"
        actor: system
        preconditions: []
        side_effects: ["Same as STEP_1_RETRY -> CLOSED_SUPERSEDED; any REQUESTED/DISPATCHED WelfareCheckRequest of the old case remains valid and its completion resolves the NEW case"]

  - entity: WelfareCheckRequest
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED]
    transitions:
      - from: REQUESTED
        to: DISPATCHED
        trigger: "POST /api/welfare-checks/{id}/dispatch"
        actor: ExternalResponder
        preconditions: ["WelfareCheckRequest.status == REQUESTED (ERR_INVALID_STATE)"]
        side_effects: ["dispatched_at = clock"]
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /api/welfare-checks/{id}/complete"
        actor: ExternalResponder
        preconditions: ["WelfareCheckRequest.status == DISPATCHED (ERR_INVALID_STATE)"]
        side_effects:
          - "completed_at = clock; disposition set (OK | ASSIST_NEEDED | NOT_FOUND)"
          - "disposition OK -> owning escalation STEP_3_WELFARE -> RESOLVED_OK cascade"
          - "disposition ASSIST_NEEDED -> owning escalation -> RESOLVED_WITH_REFERRAL cascade (auto ServiceReferral)"
          - "disposition NOT_FOUND -> no automatic resolution; coordinator must disenroll or QualityReviewer must close after no REQUESTED/DISPATCHED checks remain"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /api/welfare-checks/{id}/decline"
        actor: ExternalResponder
        preconditions: ["WelfareCheckRequest.status in {REQUESTED, DISPATCHED} (ERR_INVALID_STATE)"]
        side_effects: ["Escalation remains at STEP_3_WELFARE awaiting coordinator action"]
      - from: DISPATCHED
        to: DECLINED
        trigger: "POST /api/welfare-checks/{id}/decline"
        actor: ExternalResponder
        preconditions: ["WelfareCheckRequest.status in {REQUESTED, DISPATCHED} (ERR_INVALID_STATE)"]
        side_effects: ["Same as REQUESTED -> DECLINED"]

  - entity: ServiceReferral
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/service-referrals/{id}/submit"
        actor: ProgramCoordinator
        preconditions:
          - "ServiceReferral.status == DRAFT (ERR_INVALID_STATE)"
          - "If source_call_log_id is set: that CallLog.concern_flag == true (ERR_CONCERN_NOT_FLAGGED)"
        side_effects: ["submitted_at = clock; sla_due_at computed by priority"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/service-referrals/{id}/accept"
        actor: ProgramCoordinator
        preconditions: ["ServiceReferral.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /api/service-referrals/{id}/decline"
        actor: ProgramCoordinator
        preconditions: ["ServiceReferral.status == SUBMITTED (ERR_INVALID_STATE)"]
        side_effects: ["decline_reason set"]
      - from: DECLINED
        to: DRAFT
        trigger: "POST /api/service-referrals/{id}/revise"
        actor: ProgramCoordinator
        preconditions: ["ServiceReferral.status == DECLINED (ERR_INVALID_STATE)"]
        side_effects: ["decline_reason cleared; submitted_at and sla_due_at cleared until resubmitted"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/service-referrals/{id}/withdraw"
        actor: ProgramCoordinator
        preconditions: ["ServiceReferral.status in {DRAFT, SUBMITTED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/service-referrals/{id}/withdraw"
        actor: ProgramCoordinator
        preconditions: ["ServiceReferral.status in {DRAFT, SUBMITTED} (ERR_INVALID_STATE)"]
        side_effects: []
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /api/service-referrals/{id}/close"
        actor: QualityReviewer
        preconditions: ["ServiceReferral.status == ACCEPTED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: SatisfactionSurvey
    field: status
    initial_state: ISSUED
    terminal_states: [SCORED, EXPIRED]
    transitions:
      - from: ISSUED
        to: SCORED
        trigger: "POST /api/satisfaction-surveys/{id}/return"
        actor: IntakeWorker
        preconditions: ["SatisfactionSurvey.status == ISSUED (ERR_INVALID_STATE)"]
        side_effects: ["survey_mean computed (calculation satisfaction_index, per-survey step)"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (POST /api/programs/{id}/daily-closeout finds clock strictly greater than issued_at + program.survey_valid_days)"
        actor: system
        preconditions: ["SatisfactionSurvey.status == ISSUED and past validity"]
        side_effects: []

  - entity: ConfidentialityAgreement
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, REVOKED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a new ConfidentialityAgreement is signed by the same volunteer)"
        actor: system
        preconditions: []
        side_effects: ["Exactly one ACTIVE agreement per volunteer is conserved"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/confidentiality-agreements/{id}/revoke"
        actor: QualityReviewer
        preconditions: ["ConfidentialityAgreement.status == ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["Volunteer fails currency checks until a new agreement is signed; volunteer lapses at next daily-closeout"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (POST /api/programs/{id}/daily-closeout finds clock > valid_until)"
        actor: system
        preconditions: ["ConfidentialityAgreement.status == ACTIVE and clock > valid_until"]
        side_effects: ["Volunteer ACTIVE -> LAPSED cascade fires in the same closeout"]

  - entity: Program
    field: intake_posture
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: PAUSED
        trigger: "POST /api/programs/{id}/pause-intake"
        actor: ProgramCoordinator
        preconditions: ["Program.intake_posture == OPEN (ERR_INVALID_STATE)"]
        side_effects: ["New applications and approvals rejected with ERR_INTAKE_PAUSED"]
      - from: PAUSED
        to: OPEN
        trigger: "POST /api/programs/{id}/resume-intake"
        actor: ProgramCoordinator
        preconditions: ["Program.intake_posture == PAUSED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: OutcomeReport
    field: status
    initial_state: PROVISIONAL
    terminal_states: [FINALIZED]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /api/outcome-reports/{id}/finalize"
        actor: QualityReviewer
        preconditions:
          - "OutcomeReport.status == PROVISIONAL (ERR_INVALID_STATE)"
          - "Logical clock > period end (last instant of period_month) (ERR_REPORT_PERIOD_OPEN)"
        side_effects: ["All metric fields recomputed under the final variant of outcome_report_monthly"]

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: escalation-create-stale-participant
    parent_entity: Participant
    write_endpoint: "POST /api/escalations"
    occ_field: expected_participant_version
    description: |
      Opening an EscalationCase supersedes any currently open case for the
      participant (a legitimate outcome under the protocol), so the create must
      carry the participant version the caller last observed. A create whose
      expected_participant_version no longer matches Participant.version is
      rejected: the caller's view of the participant's escalation state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: promotion-run-stale-program
    parent_entity: Program
    write_endpoint: "POST /api/programs/{id}/promotion-runs"
    occ_field: expected_program_version
    description: |
      A promotion run is a legal, repeatable batch operation; repeating it with
      a program version the caller read before an intervening mutation (another
      promotion run, an enrollment that bumped occupied_slots) must be rejected
      so offers are never issued from a stale capacity snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: program-config-update-stale-version
    parent_entity: Program
    write_endpoint: "PATCH /api/programs/{id}"
    occ_field: expected_program_version
    description: |
      Program configuration (capacity, thresholds, policy version) is freely
      editable at any time, so a PATCH carrying an expected_program_version that
      no longer matches Program.version is rejected: an intervening mutation
      (another config change, an enrollment-driven occupied_slots bump, a
      promotion run) has advanced the program since the caller read it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (10 calculations)
# =============================================================================
calculations:
  - name: participant_acuity_score
    trigger: "POST /api/participants/{id}/submit-review (variant intake); POST /api/programs/{id}/daily-closeout for every participant with status in {ENROLLED, SUSPENDED, WELFARE_HOLD} (variant rolling)"
    algorithm: weighted_scoring
    formula: |
      VARIANT intake (runs once at submit-review):
        age_points      = {AGE_65_74: 0, AGE_75_84: 10, AGE_85_PLUS: 20}[age_band]
        alone_points    = 25 if lives_alone else 0
        mobility_points = {NONE: 0, LIMITED: 10, SEVERE: 20}[mobility]
        cog_points      = 20 if cognitive_concern else 0
        chronic_points  = min(3, chronic_conditions_count) * 5
        hosp_points     = 10 if recent_hospitalization else 0
        bereave_points  = 5  if recent_bereavement else 0
        acuity_score    = min(100, sum of the seven components)
        acuity_tier     = LOW if score <= 29; MODERATE if 30..59; HIGH if 60..84; CRITICAL if >= 85
      VARIANT rolling (runs at each daily-closeout):
        window = CallLogs whose called_at falls in [clock - 30d, clock], joined via CallAssignment to this participant
        signal = min(100, concerns*15 + noans*10 + esc*25 + refs*10) where
          concerns = count of window logs with concern_flag == true
          noans    = count of window logs with outcome in {NO_ANSWER, BUSY, WRONG_NUMBER}
          esc      = count of EscalationCases for participant with opened_at in window
          refs     = count of ServiceReferrals for participant with submitted_at in window
        rolling_acuity_score = round_half_up(0.7 * acuity_score + 0.3 * signal, 1)
        rolling_acuity_tier  = same bands as acuity_tier applied to rolling_acuity_score
        effective_acuity_tier = the MORE SEVERE of (acuity_tier, rolling_acuity_tier); severity order LOW < MODERATE < HIGH < CRITICAL; when rolling is null, effective = acuity_tier
    input_set: "Participant intake fields (intake); trailing-30-day CallLogs, EscalationCases, ServiceReferrals (rolling)"
    constants:
      TIER_LOW_MAX: 29
      TIER_MODERATE_MAX: 59
      TIER_HIGH_MAX: 84
      ROLLING_INTAKE_WEIGHT: 0.7
      ROLLING_SIGNAL_WEIGHT: 0.3
    precision: "intake: integer; rolling: 1 decimal place, round_half_up"
    variants:
      - name: intake
        when: "At submit-review; the only score until the first post-enrollment closeout"
        difference: "Static intake answers only; produces integer acuity_score/acuity_tier"
      - name: rolling
        when: "Every daily-closeout after enrollment"
        difference: "Blends 70% intake with 30% trailing-30-day outcome signals; produces rolling_acuity_score (1dp) and can raise effective_acuity_tier above the intake tier"

  - name: volunteer_reliability_score
    trigger: "Recomputed after every CallLog creation, every assignment EXPIRED transition (daily-closeout), and on certify"
    algorithm: aggregation
    formula: |
      Pool P = CallAssignments of this volunteer with scheduled_date in (today - 28d, today]
               and status in {COMPLETED, UNREACHED, EXPIRED}.
      denominator = |P|
      If denominator < 10: reliability_windowed = null, reliability_streak_adj = null, tier = SILVER.
      Else:
        showed_up = count of P with status in {COMPLETED, UNREACHED}   # UNREACHED = participant-side miss
        reliability_windowed = round_half_up(showed_up / denominator * 100, 1)
        streak = length of the trailing run of EXPIRED rows when P is ordered by scheduled_date ASC,
                 then by window_start ASC, then by created_at ASC
        reliability_streak_adj = max(0, reliability_windowed - 5 * streak)
        tier from reliability_windowed: GOLD if >= 95.0; SILVER if >= 80.0; BRONZE if >= 60.0; PROBATION otherwise
      max_concurrent_assignments = {GOLD: 12, SILVER: 10, BRONZE: 8, PROBATION: 4}[tier]
    input_set: "CallAssignment rows of the volunteer in the trailing 28-day window with terminal show/no-show statuses"
    constants:
      WINDOW_DAYS: 28
      MIN_HISTORY: 10
      STREAK_PENALTY: 5
      TIER_GOLD_MIN: 95.0
      TIER_SILVER_MIN: 80.0
      TIER_BRONZE_MIN: 60.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: windowed
        when: "Primary metric; drives reliability_tier and max_concurrent_assignments"
        difference: "Pure ratio over the trailing window"
      - name: streak_adjusted
        when: "Surfaced as reliability_streak_adj for coordinator review and outcome reports"
        difference: "Subtracts 5 points per consecutive trailing EXPIRED miss; for identical assignment history it is strictly below reliability_windowed whenever the most recent rows contain an unbroken EXPIRED run"

  - name: waitlist_promotion
    trigger: "POST /api/programs/{id}/promotion-runs"
    algorithm: weighted_scoring
    formula: |
      Evaluation order is pinned; each step consumes only outputs of earlier steps.
      Step 1: occupied = Program.occupied_slots (ENROLLED + SUSPENDED + WELFARE_HOLD)
      Step 2: For every WaitlistEntry with status == WAITING, compute the RAW score
              (no pressure bump): score = tier_points + source_points + 2 * min(days_waiting, 30) + alone_bonus
              tier_points   = {CRITICAL: 100, HIGH: 70, MODERATE: 40, LOW: 10}[participant.acuity_tier]
              source_points = {APS_REFERRAL: 50, HOSPITAL_DISCHARGE: 40, OTHER_PROVIDER: 30, FAMILY: 20, SELF: 10}[participant.referral_source]
              days_waiting  = whole days between waitlist_entered_at and clock (floor)
              alone_bonus   = 15 if participant.lives_alone else 0
      Step 3: critical_waiting = count of WAITING entries whose participant.acuity_tier == CRITICAL (raw tier, no bump)
      Step 4: reserved = min(program.max_reserve_slots, critical_waiting)
      Step 5: gross_free = max(0, program.total_capacity - occupied);
              noncritical_budget = max(0, gross_free - reserved)
      Step 6: pressure bump: if occupied / program.total_capacity >= 0.95, add 30 to the score of
              CRITICAL-tier entries only (affects RANKING ONLY; step 3/4 already used raw tiers)
      Step 7: rank all WAITING entries by final score DESC, tie-break waitlist_entered_at ASC,
              then participant created_at ASC (never id)
      Step 8: walk the ranked list; a CRITICAL-tier entry is offered while gross_free_remaining >= 1
              (decrementing it); a non-CRITICAL entry is offered while noncritical_budget_remaining >= 1
              (decrementing it). Entries beyond the window stay WAITING.
      Each offered entry: status OFFERED, offered_at = clock, offer_expires_at = clock + offer_ttl_hours,
      priority_score_at_offer = final score; Program.promotion_epoch += 1 and Program.version += 1 once per run.
    input_set: "WaitlistEntry rows with status == WAITING, joined to Participant acuity_tier/referral_source/lives_alone/created_at; Program capacity fields"
    constants:
      DAYS_WAITING_CAP: 30
      PRESSURE_OCCUPANCY_RATIO: 0.95
      PRESSURE_BUMP: 30
      MAX_DECLINES: 2
      MAX_EXPIRES: 2
    precision: "integer scores"
    variants: []

  - name: satisfaction_index
    trigger: "POST /api/satisfaction-surveys/{id}/return (per-survey step); OutcomeReport generation/finalization (program step)"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED — round per survey first, then aggregate:
        survey_mean = round_half_up( (1*items[0] + 2*items[1] + 1*items[2] + 1*items[3] + 2*items[4]) / 7 , 2 )
        satisfaction_index = round_half_up( mean of survey_mean over all SCORED SatisfactionSurveys
                                            of the program with matching period_month , 2 )
        satisfaction_index is null when no SCORED surveys exist for the period.
      The alternative unpinned order (pool all weighted item scores across surveys, then divide once)
      yields different hundredths; it is explicitly NOT used.
    input_set: "SatisfactionSurveys with status == SCORED for the program and period"
    constants:
      ITEM_WEIGHTS: [1, 2, 1, 1, 2]
      ITEM_COUNT: 5
      ITEM_MIN: 1
      ITEM_MAX: 5
    precision: "2 decimal places, round_half_up at each pinned step"
    variants:
      - name: per_survey_then_aggregate
        when: "Always (pinned)"
        difference: "Rounds each survey_mean to 2dp before averaging; pooling raw item scores first (rejected variant) produces different hundredths — e.g. surveys [5,4,3,4,5] and [1,1,1,1,1] give 2.65 pinned vs 2.64 pooled"

  - name: effective_capacity
    trigger: "POST /api/participants/{id}/approve; POST /api/waitlist-entries/{id}/accept; POST /api/programs/{id}/promotion-runs"
    algorithm: constraint_propagation
    formula: |
      Circular-looking dependency pinned to a strict order (this is the same order as
      waitlist_promotion steps 1-5; approve/accept evaluate it for a single applicant):
        1. occupied  = Program.occupied_slots
        2. gross_free = program.total_capacity - occupied   (physical slots, reserve NOT subtracted)
        3. critical_waiting = count of WaitlistEntry status == WAITING whose participant.acuity_tier == CRITICAL
        4. reserved  = min(program.max_reserve_slots, critical_waiting)
      Admission rule for a single applicant of tier T:
        T == CRITICAL : admit iff gross_free >= 1              (criticals may use reserved slots)
        otherwise     : admit iff gross_free - reserved >= 1   (reserve protects critical-only capacity)
      Note the apparent loop — reserved depends on waiting tiers, and tier-aware admission depends on
      reserved — is resolved because step 2 uses ONLY raw intake tiers of WAITING entries and never
      the applicant being decided.
    input_set: "Program capacity fields; WAITING WaitlistEntries joined to Participant.acuity_tier"
    constants: {}
    precision: "integer"
    variants: []

  - name: no_answer_streak
    trigger: "POST /api/call-assignments/{id}/call-logs"
    algorithm: chronological
    formula: |
      outcome in {REACHED_OK, REACHED_CONCERN, REFUSED}   -> consecutive_no_answer_count = 0
      outcome in {NO_ANSWER, BUSY, WRONG_NUMBER}          -> consecutive_no_answer_count += 1
      Escalation trigger (boundary is INCLUSIVE): when the increment makes
      consecutive_no_answer_count >= program.no_answer_threshold AND participant.open_escalation_id is null,
      the system opens an EscalationCase (trigger NO_ANSWER_PROTOCOL, stage STEP_1_RETRY) and creates
      a retry CallAssignment (source ESCALATION_RETRY, window starting at the log's called_at,
      duration 30 minutes, scheduled_date = date(called_at)) via the volunteer selector; if the
      selector pool is empty the escalation still opens with retry_assignment_id null.
      Logs recorded while open_escalation_id is not null still mutate the streak but never open
      a second case.
    input_set: "The new CallLog; Participant.consecutive_no_answer_count and open_escalation_id; Program.no_answer_threshold"
    constants:
      RETRY_WINDOW_MINUTES: 30
    precision: "integer count"
    variants: []

  - name: volunteer_weekly_load
    trigger: "CallAssignment create / cancel / reschedule / expire"
    algorithm: aggregation
    formula: |
      ISO week of a scheduled_date (Monday-start).
      current_week_minutes(v, week) = sum over CallAssignments of v with scheduled_date in that week
        and status in {SCHEDULED, COMPLETED, UNREACHED} of
        (minutes(window_start..window_end) + program.doc_buffer_minutes)
      CANCELLED and EXPIRED rows contribute 0.
      Admission check on create/reschedule: current_week_minutes + new slot minutes + doc_buffer_minutes
      <= volunteer.max_weekly_minutes   (EQUALITY IS ALLOWED — the bound is inclusive)
    input_set: "CallAssignments of the volunteer in the target ISO week"
    constants: {}
    precision: "integer minutes"
    variants: []

  - name: volunteer_selector
    trigger: "POST /api/call-assignments when volunteer_id is omitted; escalation retry assignment creation; resume regeneration"
    algorithm: constraint_propagation
    formula: |
      Eligibility filter (candidate pool), all clauses required:
        - VolunteerCaller.status == ACTIVE
        - TrainingRecords VALID for modules {SAFETY_PROTOCOL, LISTENING_SKILLS, MANDATED_REPORTING}
        - An ACTIVE ConfidentialityAgreement with policy_version == program.current_policy_version
          and clock <= valid_until
        - An AvailabilityWindow containing [window_start, window_end) for the scheduled_date's
          weekday, effective on scheduled_date
        - If participant.primary_language != "en": volunteer.languages contains primary_language
        - No buffer-inclusive conflict with the volunteer's SCHEDULED assignments that date
        - current_week_minutes + slot + doc_buffer_minutes <= max_weekly_minutes
        - future-dated SCHEDULED count < max_concurrent_assignments
      Ranking: current_week_minutes ASC, then reliability_tier rank DESC
      (GOLD > SILVER > BRONZE > PROBATION), then volunteer created_at ASC (never id).
      Empty pool -> ERR_NO_ELIGIBLE_VOLUNTEER for the endpoint; escalation-retry creation instead
      opens the escalation with retry_assignment_id null; resume regeneration leaves the weekday
      unassigned and sets coverage_deficient true.
    input_set: "All VolunteerCaller rows of the deployment; their windows, records, agreements, and current-week assignments"
    constants: {}
    precision: "integer minutes"
    variants: []

  - name: assignment_conflict
    trigger: "POST /api/call-assignments; POST /api/call-assignments/{id}/reschedule"
    algorithm: interval_merge
    formula: |
      Volunteer double-booking uses CLOSED, BUFFER-INCLUSIVE intervals:
        occupied(a) = [a.window_start, a.window_end + program.doc_buffer_minutes]  (both bounds inclusive)
        conflict(new, existing) iff new.window_start <= occupied_end(existing)
                                   AND existing.window_start <= occupied_end(new)
      over the volunteer's CallAssignments on the same scheduled_date with status == SCHEDULED.
      Touching at the buffered endpoint IS a conflict (e.g. existing 09:00-09:30 with 15-minute buffer
      occupies through 09:45 inclusive; a new 09:45 start conflicts; 09:46 does not).
      Contrast AvailabilityWindow overlap which is half-open with NO buffer.
      Coverage checks (separate, also on create/reschedule):
        the [window_start, window_end) of the new assignment must lie inside an ACTIVE CallSchedule
        window of the participant for the scheduled_date's weekday (ERR_WINDOW_OUTSIDE_SCHEDULE),
        and inside an AvailabilityWindow of the volunteer effective on scheduled_date
        (ERR_WINDOW_OUTSIDE_AVAILABILITY); participant language: when participant.primary_language
        != "en", the volunteer's languages must contain it (ERR_NO_ELIGIBLE_VOLUNTEER via selector,
        ERR_WINDOW_OUTSIDE_AVAILABILITY never applies to language).
    input_set: "Volunteer's SCHEDULED assignments on the date; participant's ACTIVE CallSchedules; volunteer's AvailabilityWindows"
    constants: {}
    precision: "minute resolution"
    variants: []

  - name: outcome_report_monthly
    trigger: "POST /api/programs/{id}/outcome-reports (PROVISIONAL); POST /api/outcome-reports/{id}/finalize (FINALIZED recompute)"
    algorithm: aggregation
    formula: |
      Period = calendar month period_month [first instant, last instant].
      escalations_opened    = count EscalationCases of program participants with opened_at in period
      escalations_resolved  = count EscalationCases reaching any RESOLVED_* stage in period
      referrals_submitted   = count ServiceReferrals with submitted_at in period
      unique_participants_reached = count distinct participants with a CallLog outcome in
                                    {REACHED_OK, REACHED_CONCERN, REFUSED} and called_at in period
      satisfaction_index    = calculation satisfaction_index for the period
      VARIANT provisional (status PROVISIONAL):
        calls_scheduled = assignments with scheduled_date in period AND scheduled_date <= today
        denominator     = count of those with status in {COMPLETED, UNREACHED, EXPIRED}
                          (past-due still-SCHEDULED rows are EXCLUDED from the denominator)
      VARIANT final (on finalize):
        calls_scheduled = all assignments with scheduled_date in period and status != CANCELLED
        denominator     = calls_scheduled (still-SCHEDULED rows count as misses)
      Both variants: calls_completed = count COMPLETED in period;
        completion_rate = round_half_up(calls_completed / denominator * 100, 1); null when denominator == 0.
      For identical rows with a past-due SCHEDULED assignment, provisional rate strictly exceeds final rate.
    input_set: "CallAssignments, CallLogs, EscalationCases, ServiceReferrals, SatisfactionSurveys of the program's participants for the period"
    constants: {}
    precision: "rates 1 decimal place, round_half_up; satisfaction_index 2dp via satisfaction_index"
    variants:
      - name: provisional
        when: "Generated while the period is still open"
        difference: "Excludes past-due SCHEDULED assignments from the denominator"
      - name: final
        when: "At finalize (clock past period end)"
        difference: "Counts every non-CANCELLED assignment; still-open SCHEDULED rows are misses"

  - name: referral_sla
    trigger: "Read of a ServiceReferral; daily-closeout sweep; OutcomeReport generation"
    algorithm: threshold
    formula: |
      sla_hours = {URGENT: 24, STANDARD: 72, ROUTINE: 168}[priority]
      sla_due_at = submitted_at + sla_hours (set on DRAFT -> SUBMITTED)
      overdue = (status == SUBMITTED) AND (logical clock > sla_due_at)   # STRICTLY greater; at exact sla_due_at not overdue
    input_set: "ServiceReferral rows with submitted_at set"
    constants:
      SLA_URGENT_HOURS: 24
      SLA_STANDARD_HOURS: 72
      SLA_ROUTINE_HOURS: 168
    precision: "second resolution"
    variants: []

  - name: required_contact_frequency
    trigger: "CallSchedule create/pause/resume/archive; effective_acuity_tier change; coverage_deficient recompute"
    algorithm: threshold
    formula: |
      required_weekly = {CRITICAL: 5, HIGH: 3, MODERATE: 2, LOW: 1}[participant.effective_acuity_tier]
      planned_weekly  = count of the participant's CallSchedules with status == ACTIVE
      coverage_deficient = (planned_weekly < required_weekly) OR
                           (a future-dated SCHEDULED assignment was cancelled without replacement)
      coverage_deficient is cleared to false only when planned_weekly >= required_weekly AND
      every ACTIVE weekday schedule for the coming 7 days has at least one future-dated
      SCHEDULED or completed-this-week assignment.
    input_set: "Participant.effective_acuity_tier; the participant's CallSchedules and CallAssignments"
    constants:
      FREQ_CRITICAL: 5
      FREQ_HIGH: 3
      FREQ_MODERATE: 2
      FREQ_LOW: 1
    precision: "integer"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Ownership: X-User-Role == VolunteerCaller requires X-User-ID == the volunteer_id of the target assignment/window/agreement resource"
    error_id: ERR_NOT_OWN_RESOURCE
    http_status: 403
    applies_to: "POST /api/call-assignments/{id}/call-logs; POST /api/volunteers/{id}/availability-windows; DELETE /api/availability-windows/{id}; POST /api/volunteers/{id}/confidentiality-agreements"
  - priority: 4
    category: existence
    check: "Every id in the path exists, validated left-to-right; body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body references"
  - priority: 5
    category: existence
    check: "OCC: expected_<parent>_version equals the parent's current version (only on endpoints declaring the field)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/escalations; POST /api/programs/{id}/promotion-runs; PATCH /api/programs/{id}"
  - priority: 6
    category: state
    check: "Target resource is in a valid from-state for the requested transition (includes ERR_OFFER_NOT_OPEN, ERR_NO_OPEN_ESCALATION, ERR_PARTICIPANT_NOT_ENROLLED, ERR_INVALID_STATE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints; state-gated creates"
  - priority: 7
    category: state
    check: "Related-resource state gates: Program.intake_posture == OPEN for application creation and approve (ERR_INTAKE_PAUSED)"
    error_id: ERR_INTAKE_PAUSED
    http_status: 409
    applies_to: "POST /api/participants; POST /api/participants/{id}/approve"
  - priority: 8
    category: business_safety
    check: "Safety gates: emergency-contact requirements on approve; volunteer training + confidentiality currency on certify/reactivate/assignment creation; IMMEDIATE_DANGER call-log field completeness"
    error_id: ERR_EMERGENCY_CONTACT_REQUIRED
    http_status: 422
    applies_to: "approve (also ERR_NO_24H_CONTACT 422); assignment creation (ERR_VOLUNTEER_NOT_CERTIFIED 409, ERR_CONFIDENTIALITY_NOT_CURRENT 409); call-log creation (ERR_SAFETY_FIELDS_REQUIRED 422)"
  - priority: 9
    category: business_temporal
    check: "Temporal rules: called_at not after logical clock; escalation step deadlines; offer expiry; availability-window half-open overlap; assignment buffer-inclusive conflict; window-inside-schedule and window-inside-availability coverage"
    error_id: ERR_FUTURE_DATED_CALL_LOG
    http_status: 422
    applies_to: "call logs (ERR_FUTURE_DATED_CALL_LOG 422); escalation advance (ERR_ESCALATION_STEP_NOT_DUE 409); availability windows (ERR_AVAILABILITY_OVERLAP 409); assignments (ERR_ASSIGNMENT_WINDOW_CONFLICT 409, ERR_WINDOW_OUTSIDE_SCHEDULE 422, ERR_WINDOW_OUTSIDE_AVAILABILITY 422); offer accept (ERR_OFFER_NOT_OPEN 409)"
  - priority: 10
    category: business_referential
    check: "Cross-entity referential conditions: referral source_call_log_id must point to a CallLog with concern_flag == true; new escalation supersedes only an OPEN case"
    error_id: ERR_CONCERN_NOT_FLAGGED
    http_status: 422
    applies_to: "POST /api/service-referrals/{id}/submit; POST /api/escalations"
  - priority: 11
    category: business_constraint
    check: "Aggregate/constraint rules: capacity admission branch; volunteer weekly load (inclusive bound); max concurrent assignments; one ACTIVE/PAUSED schedule per (participant, weekday); one survey per (participant, period_month); non-empty eligible-volunteer pool"
    error_id: ERR_CAPACITY_REACHED
    http_status: 409
    applies_to: "offer accept (ERR_CAPACITY_REACHED 409); assignment create (ERR_WEEKLY_LOAD_EXCEEDED 409, ERR_MAX_ASSIGNMENTS_REACHED 409, ERR_NO_ELIGIBLE_VOLUNTEER 409); schedule create (ERR_DUPLICATE_SCHEDULE 409); survey create (ERR_SURVEY_PERIOD_DUPLICATE 409)"
  - priority: 12
    category: business_temporal
    check: "Cooling-off: reapply only when logical clock >= last_status_change_at + program.reapply_cooling_days"
    error_id: ERR_REAPPLICATION_TOO_SOON
    http_status: 409
    applies_to: "POST /api/participants/{id}/reapply"
  - priority: 13
    category: business_constraint
    check: "Segregation-of-duties is enforced at the role layer and additionally: resolver X-User-ID must differ from escalation.opened_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/escalations/{id}/resolve"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (86 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default (before any set call) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time; every time-dependent rule reads this clock."
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["No lazy expiry fires on read; time-based transitions fire only via daily-closeout"]

  # --- Program ---
  - method: POST
    path: "/api/programs"
    description: "Create the program with capacity and protocol configuration"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, total_capacity, current_policy_version, "max_reserve_slots?", "no_answer_threshold?", "escalation_retry_hours?", "contact_phase_hours?", "offer_ttl_hours?", "reapply_cooling_days?", "survey_valid_days?", "doc_buffer_minutes?"]
    output: Program
    side_effects: ["intake_posture = OPEN; occupied_slots = 0; waiting_count = 0; promotion_epoch = 0"]
  - method: GET
    path: "/api/programs/{id}"
    description: "Get a program"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer, VolunteerCaller, ExternalResponder]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: PATCH
    path: "/api/programs/{id}"
    description: "Update program configuration (OCC-guarded; see program-config-update-stale-version); bumping current_policy_version makes all ACTIVE agreements with a different policy_version non-current for future checks"
    roles: [ProgramCoordinator]
    code: 200
    input: [expected_program_version, "name?", "total_capacity?", "max_reserve_slots?", "no_answer_threshold?", "escalation_retry_hours?", "contact_phase_hours?", "offer_ttl_hours?", "reapply_cooling_days?", "survey_valid_days?", "doc_buffer_minutes?", "current_policy_version?"]
    output: Program
    side_effects: ["increments Program.version by 1"]
  - method: POST
    path: "/api/programs/{id}/pause-intake"
    description: "Pause new applications and approvals"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: ["intake_posture -> PAUSED; increments Program.version by 1"]
  - method: POST
    path: "/api/programs/{id}/resume-intake"
    description: "Resume intake"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Program
    side_effects: ["intake_posture -> OPEN; increments Program.version by 1"]
  - method: POST
    path: "/api/programs/{id}/promotion-runs"
    description: "Run one waitlist promotion epoch (OCC-guarded; see concurrency rule promotion-run-stale-program)"
    roles: [IntakeWorker]
    code: 201
    input: [expected_program_version]
    output: { epoch: integer, offers_created: integer, offered_entry_ids: array, gross_free_after: integer }
    side_effects: ["calculation waitlist_promotion; qualifying entries -> OFFERED; increments promotion_epoch by 1; increments Program.version by 1"]
  - method: POST
    path: "/api/programs/{id}/daily-closeout"
    description: "Advance the daily ops epoch: expire past-due SCHEDULED assignments, expire offers past TTL, lapse volunteers whose training/agreement expired, expire surveys past validity, advance escalations whose step deadline passed, recompute rolling acuity and reliability"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: { expired_assignment_ids: array, expired_offer_entry_ids: array, lapsed_volunteer_ids: array, expired_survey_ids: array, advanced_escalation_ids: array }
    side_effects: ["calculations participant_acuity_score (rolling), volunteer_reliability_score, referral_sla sweep; cascades per state machines; increments Program.version by 1"]
  - method: POST
    path: "/api/programs/{id}/outcome-reports"
    description: "Generate the monthly outcome report (PROVISIONAL) for a period"
    roles: [QualityReviewer]
    code: 201
    input: [period_month]
    output: OutcomeReport
    side_effects: ["calculation outcome_report_monthly (provisional variant)"]
  - method: GET
    path: "/api/programs/{id}/outcome-reports"
    description: "List outcome reports of a program"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: ["period_month?", "limit?", "offset?"]
    output: OutcomeReport[]
    side_effects: []

  # --- Participant ---
  - method: POST
    path: "/api/participants"
    description: "Create a participant application (status APPLICANT)"
    roles: [IntakeWorker]
    code: 201
    input: [full_name, date_of_birth, phone, address, referral_source, age_band, lives_alone, mobility, cognitive_concern, chronic_conditions_count, recent_hospitalization, recent_bereavement, "primary_language?"]
    output: Participant
    side_effects: ["status = APPLICANT; consecutive_no_answer_count = 0; coverage_deficient = false"]
  - method: GET
    path: "/api/participants"
    description: "List participants with filters and pagination"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer, VolunteerCaller, ExternalResponder]
    code: 200
    input: ["status?", "acuity_tier?", "coverage_deficient?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []
  - method: GET
    path: "/api/participants/{id}"
    description: "Get a participant"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer, VolunteerCaller, ExternalResponder]
    code: 200
    input: []
    output: Participant
    side_effects: []
  - method: PATCH
    path: "/api/participants/{id}"
    description: "Edit intake fields while APPLICANT or UNDER_REVIEW"
    roles: [IntakeWorker]
    code: 200
    input: ["full_name?", "date_of_birth?", "phone?", "address?", "primary_language?", "referral_source?", "age_band?", "lives_alone?", "mobility?", "cognitive_concern?", "chronic_conditions_count?", "recent_hospitalization?", "recent_bereavement?"]
    output: Participant
    side_effects: ["increments Participant.version by 1; edits while UNDER_REVIEW require re-running submit-review to recompute acuity"]
  - method: POST
    path: "/api/participants/{id}/submit-review"
    description: "Submit application for review; computes intake acuity"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> UNDER_REVIEW; calculation participant_acuity_score (intake)"]
  - method: POST
    path: "/api/participants/{id}/approve"
    description: "Approve under-review applicant: safety contact gates first, then capacity branch -> ENROLLED or WAITLISTED"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Participant
    side_effects: ["calculation effective_capacity; ENROLLED branch: occupied_slots += 1 and Program.version += 1; WAITLISTED branch: WaitlistEntry created"]
  - method: POST
    path: "/api/participants/{id}/deny"
    description: "Deny an under-review applicant"
    roles: [IntakeWorker]
    code: 200
    input: [reason]
    output: Participant
    side_effects: ["status -> DENIED"]
  - method: POST
    path: "/api/participants/{id}/suspend"
    description: "Suspend an enrolled participant; cancels future SCHEDULED assignments"
    roles: [ProgramCoordinator]
    code: 200
    input: [reason]
    output: Participant
    side_effects: ["status -> SUSPENDED; assignment cancellation cascade; occupied_slots unchanged"]
  - method: POST
    path: "/api/participants/{id}/resume"
    description: "Resume a suspended participant; regenerates near-term assignments from ACTIVE schedules"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> ENROLLED; assignment regeneration via volunteer selector; coverage_deficient recomputed"]
  - method: POST
    path: "/api/participants/{id}/disenroll"
    description: "Disenroll from ENROLLED, SUSPENDED, or WELFARE_HOLD"
    roles: [ProgramCoordinator]
    code: 200
    input: [reason]
    output: Participant
    side_effects: ["status -> DISENROLLED; occupied_slots -= 1 and Program.version += 1; assignments CANCELLED (MANUAL)"]
  - method: POST
    path: "/api/participants/{id}/reapply"
    description: "Re-open a DENIED/DISENROLLED/EXITED participant as APPLICANT after the cooling-off period"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: Participant
    side_effects: ["status -> APPLICANT; acuity fields cleared; streak reset"]

  # --- EmergencyContact ---
  - method: GET
    path: "/api/participants/{id}/emergency-contacts"
    description: "List a participant's emergency contacts"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmergencyContact[]
    side_effects: []
  - method: POST
    path: "/api/participants/{id}/emergency-contacts"
    description: "Add an emergency contact"
    roles: [IntakeWorker, ProgramCoordinator]
    code: 201
    input: [full_name, phone, relationship, contact_rank, "accepts_24h?"]
    output: EmergencyContact
    side_effects: ["status = ACTIVE"]
  - method: POST
    path: "/api/emergency-contacts/{id}/deactivate"
    description: "Mark a contact REMOVED"
    roles: [IntakeWorker, ProgramCoordinator]
    code: 200
    input: []
    output: EmergencyContact
    side_effects: ["status -> REMOVED"]
  - method: POST
    path: "/api/emergency-contacts/{id}/reactivate"
    description: "Return an UNREACHABLE or REMOVED contact to ACTIVE"
    roles: [IntakeWorker, ProgramCoordinator]
    code: 200
    input: []
    output: EmergencyContact
    side_effects: ["status -> ACTIVE"]

  # --- WaitlistEntry ---
  - method: GET
    path: "/api/participants/{id}/waitlist-entries"
    description: "List waitlist entries of a participant"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: WaitlistEntry[]
    side_effects: []
  - method: GET
    path: "/api/waitlist-entries/{id}"
    description: "Get a waitlist entry"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: []
  - method: POST
    path: "/api/waitlist-entries/{id}/accept"
    description: "Accept an OFFERED entry; capacity re-checked at accept time"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["Entry -> ACCEPTED; Participant WAITLISTED -> ENROLLED; occupied_slots += 1; Program.version += 1"]
  - method: POST
    path: "/api/waitlist-entries/{id}/decline"
    description: "Decline an offer; requeues to WAITING, auto-REMOVED at 2 declines"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["declines_count += 1; conditional transition to REMOVED (MAX_DECLINES) with Participant -> EXITED"]
  - method: POST
    path: "/api/waitlist-entries/{id}/withdraw"
    description: "Withdraw a WAITING or OFFERED entry"
    roles: [IntakeWorker]
    code: 200
    input: []
    output: WaitlistEntry
    side_effects: ["Entry -> REMOVED (WITHDRAWN); Participant WAITLISTED -> EXITED"]

  # --- CallSchedule ---
  - method: GET
    path: "/api/participants/{id}/call-schedules"
    description: "List a participant's call schedules"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CallSchedule[]
    side_effects: []
  - method: POST
    path: "/api/participants/{id}/call-schedules"
    description: "Create a weekly recurring schedule; one ACTIVE/PAUSED per (participant, weekday)"
    roles: [ProgramCoordinator]
    code: 201
    input: [weekday, window_start, window_end]
    output: CallSchedule
    side_effects: ["status = ACTIVE; coverage_deficient recomputed"]
  - method: POST
    path: "/api/call-schedules/{id}/pause"
    description: "Pause a schedule"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CallSchedule
    side_effects: ["status -> PAUSED; coverage_deficient recomputed"]
  - method: POST
    path: "/api/call-schedules/{id}/resume"
    description: "Resume a paused schedule"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CallSchedule
    side_effects: ["status -> ACTIVE; coverage_deficient recomputed"]
  - method: POST
    path: "/api/call-schedules/{id}/archive"
    description: "Archive a schedule (terminal); existing assignments unaffected"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CallSchedule
    side_effects: ["status -> ARCHIVED; coverage_deficient recomputed"]

  # --- VolunteerCaller ---
  - method: POST
    path: "/api/volunteers"
    description: "Register a volunteer (status APPLICANT)"
    roles: [ProgramCoordinator]
    code: 201
    input: [full_name, phone, "languages?", "max_weekly_minutes?"]
    output: VolunteerCaller
    side_effects: ["status = APPLICANT; reliability_tier = SILVER (no history)"]
  - method: GET
    path: "/api/volunteers"
    description: "List volunteers with filters and pagination"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: ["status?", "reliability_tier?", "limit?", "offset?"]
    output: VolunteerCaller[]
    side_effects: []
  - method: GET
    path: "/api/volunteers/{id}"
    description: "Get a volunteer"
    roles: [ProgramCoordinator, QualityReviewer, VolunteerCaller]
    code: 200
    input: []
    output: VolunteerCaller
    side_effects: []
  - method: POST
    path: "/api/volunteers/{id}/begin-training"
    description: "Move APPLICANT volunteer into training"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: VolunteerCaller
    side_effects: ["status -> IN_TRAINING"]
  - method: POST
    path: "/api/volunteers/{id}/certify"
    description: "Certify an IN_TRAINING or LAPSED volunteer after training + confidentiality currency checks"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: VolunteerCaller
    side_effects: ["status -> ACTIVE; reliability fields recomputed"]
  - method: POST
    path: "/api/volunteers/{id}/deactivate"
    description: "Deactivate an ACTIVE volunteer (keeps existing assignments)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: VolunteerCaller
    side_effects: ["status -> INACTIVE"]
  - method: POST
    path: "/api/volunteers/{id}/reactivate"
    description: "Reactivate an INACTIVE volunteer (re-checks certification currency)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: VolunteerCaller
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/api/volunteers/{id}/separate"
    description: "Permanently separate a volunteer (terminal); cancels future assignments"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: VolunteerCaller
    side_effects: ["status -> SEPARATED; future SCHEDULED assignments CANCELLED (MANUAL)"]

  # --- AvailabilityWindow ---
  - method: GET
    path: "/api/volunteers/{id}/availability-windows"
    description: "List a volunteer's availability windows"
    roles: [ProgramCoordinator, QualityReviewer, VolunteerCaller]
    code: 200
    input: ["weekday?", "limit?", "offset?"]
    output: AvailabilityWindow[]
    side_effects: []
  - method: POST
    path: "/api/volunteers/{id}/availability-windows"
    description: "Add an availability window; half-open overlap with existing same-weekday windows rejected"
    roles: [ProgramCoordinator, VolunteerCaller]
    code: 201
    input: [weekday, window_start, window_end, effective_from, "effective_to?"]
    output: AvailabilityWindow
    side_effects: []
  - method: DELETE
    path: "/api/availability-windows/{id}"
    description: "Delete an availability window"
    roles: [ProgramCoordinator, VolunteerCaller]
    code: 204
    input: []
    output: null
    side_effects: []

  # --- TrainingRecord ---
  - method: GET
    path: "/api/volunteers/{id}/training-records"
    description: "List a volunteer's training records"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: ["module?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: POST
    path: "/api/volunteers/{id}/training-records"
    description: "Record a completed training module"
    roles: [ProgramCoordinator]
    code: 201
    input: [module, completed_at, valid_until]
    output: TrainingRecord
    side_effects: ["status computed VALID/EXPIRED vs logical clock"]

  # --- ConfidentialityAgreement ---
  - method: GET
    path: "/api/volunteers/{id}/confidentiality-agreements"
    description: "List a volunteer's confidentiality agreements"
    roles: [ProgramCoordinator, QualityReviewer, VolunteerCaller]
    code: 200
    input: ["limit?", "offset?"]
    output: ConfidentialityAgreement[]
    side_effects: []
  - method: POST
    path: "/api/volunteers/{id}/confidentiality-agreements"
    description: "Sign a confidentiality agreement (the volunteer's own act); supersedes the previous ACTIVE agreement"
    roles: [VolunteerCaller]
    code: 201
    input: [policy_version, valid_until]
    output: ConfidentialityAgreement
    side_effects: ["status = ACTIVE; prior ACTIVE agreement -> SUPERSEDED"]
  - method: POST
    path: "/api/confidentiality-agreements/{id}/revoke"
    description: "Revoke an ACTIVE agreement"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: ConfidentialityAgreement
    side_effects: ["status -> REVOKED"]

  # --- CallAssignment ---
  - method: GET
    path: "/api/call-assignments"
    description: "List assignments with filters and pagination"
    roles: [ProgramCoordinator, QualityReviewer, VolunteerCaller]
    code: 200
    input: ["participant_id?", "volunteer_id?", "escalation_id?", "rescheduled_from_id?", "status?", "scheduled_date?", "limit?", "offset?"]
    output: CallAssignment[]
    side_effects: []
  - method: POST
    path: "/api/call-assignments"
    description: "Create an assignment; volunteer_id optional — omitted triggers the deterministic volunteer selector"
    roles: [ProgramCoordinator]
    code: 201
    input: [participant_id, scheduled_date, window_start, window_end, "volunteer_id?", "source?"]
    output: CallAssignment
    side_effects: ["status = SCHEDULED; volunteer current_week_minutes recomputed; increments CallAssignment.version baseline to 1"]
  - method: GET
    path: "/api/call-assignments/{id}"
    description: "Get an assignment"
    roles: [ProgramCoordinator, QualityReviewer, VolunteerCaller]
    code: 200
    input: []
    output: CallAssignment
    side_effects: []
  - method: POST
    path: "/api/call-assignments/{id}/cancel"
    description: "Cancel a SCHEDULED assignment"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CallAssignment
    side_effects: ["status -> CANCELLED (MANUAL); volunteer current_week_minutes and participant coverage_deficient recomputed"]
  - method: POST
    path: "/api/call-assignments/{id}/reschedule"
    description: "Supersede a SCHEDULED assignment with a new window; the old row is cancelled (RESCHEDULED) so a second reschedule of the same row fails the state precondition"
    roles: [ProgramCoordinator]
    code: 201
    input: [new_scheduled_date, new_window_start, new_window_end]
    output: CallAssignment
    side_effects: ["old assignment -> CANCELLED (RESCHEDULED) with version incremented; new assignment created with rescheduled_from_id; all create-time checks (schedule coverage, availability, conflict, load, caps) re-applied to the new window"]

  # --- CallLog ---
  - method: GET
    path: "/api/call-assignments/{id}/call-logs"
    description: "List logs of an assignment (at most one)"
    roles: [ProgramCoordinator, QualityReviewer, VolunteerCaller]
    code: 200
    input: ["limit?", "offset?"]
    output: CallLog[]
    side_effects: []
  - method: POST
    path: "/api/call-assignments/{id}/call-logs"
    description: "Record the outcome of a call (append-only; exactly one per assignment); fires streak, escalation and reliability cascades"
    roles: [VolunteerCaller, ProgramCoordinator]
    code: 201
    input: [called_at, duration_seconds, outcome, "concern_level?", "concern_categories?", "follow_up_needed?", "follow_up_plan?", "supervisor_notified?", "notes?"]
    output: CallLog
    side_effects: ["assignment -> COMPLETED or UNREACHED; calculations no_answer_streak and volunteer_reliability_score; concern/escalation cascades per state machines"]

  # --- EscalationCase ---
  - method: GET
    path: "/api/escalations"
    description: "List escalations with filters"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: ["participant_id?", "supersedes_escalation_id?", "retry_assignment_id?", "stage?", "limit?", "offset?"]
    output: EscalationCase[]
    side_effects: []
  - method: POST
    path: "/api/escalations"
    description: "Open an escalation manually or for an immediate concern (OCC-guarded; supersedes any OPEN case). trigger_type CONCERN_IMMEDIATE opens at STEP_3_WELFARE with auto WelfareCheckRequest; MANUAL opens at STEP_1_RETRY"
    roles: [ProgramCoordinator]
    code: 201
    input: [participant_id, trigger_type, expected_participant_version, "note?"]
    output: EscalationCase
    side_effects: ["prior OPEN case -> CLOSED_SUPERSEDED; participant.open_escalation_id set; increments Participant.version by 1; CONCERN_IMMEDIATE additionally creates the WelfareCheckRequest and runs the WELFARE_HOLD cascade"]
  - method: GET
    path: "/api/escalations/{id}"
    description: "Get an escalation"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: []
    output: EscalationCase
    side_effects: []
  - method: POST
    path: "/api/escalations/{id}/advance"
    description: "Advance STEP_1_RETRY -> STEP_2_CONTACT -> STEP_3_WELFARE once the step's deadline or work precondition holds"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: EscalationCase
    side_effects: ["stage transition; STEP_3 entry creates WelfareCheckRequest and WELFARE_HOLD cascade"]
  - method: POST
    path: "/api/escalations/{id}/record-contact-attempt"
    description: "Append an emergency-contact attempt at STEP_2_CONTACT; UNREACHABLE marks the contact UNREACHABLE"
    roles: [ProgramCoordinator]
    code: 200
    input: [contact_id, outcome]
    output: EscalationCase
    side_effects: ["contact_attempts appended; outcome in {REACHED, UNREACHABLE, REFUSED}; UNREACHABLE -> EmergencyContact.status UNREACHABLE"]
  - method: POST
    path: "/api/escalations/{id}/resolve"
    description: "Resolve an open escalation (segregation of duties: resolver != opener)"
    roles: [QualityReviewer]
    code: 200
    input: [resolution, "note?"]
    output: EscalationCase
    side_effects: ["resolution in {RESOLVED_OK, RESOLVED_CONTACT_CONFIRMED, CLOSED_FALSE_ALARM}; streak reset; open_escalation_id cleared; WELFARE_HOLD release cascade when applicable"]

  # --- WelfareCheckRequest ---
  - method: GET
    path: "/api/escalations/{id}/welfare-checks"
    description: "List welfare check requests of an escalation"
    roles: [ProgramCoordinator, QualityReviewer, ExternalResponder]
    code: 200
    input: ["limit?", "offset?"]
    output: WelfareCheckRequest[]
    side_effects: []
  - method: GET
    path: "/api/welfare-checks"
    description: "List welfare check requests with filters"
    roles: [ProgramCoordinator, QualityReviewer, ExternalResponder]
    code: 200
    input: ["participant_id?", "status?", "limit?", "offset?"]
    output: WelfareCheckRequest[]
    side_effects: []
  - method: GET
    path: "/api/welfare-checks/{id}"
    description: "Get a welfare check request"
    roles: [ProgramCoordinator, QualityReviewer, ExternalResponder]
    code: 200
    input: []
    output: WelfareCheckRequest
    side_effects: []
  - method: POST
    path: "/api/welfare-checks/{id}/dispatch"
    description: "Mark a welfare check dispatched"
    roles: [ExternalResponder]
    code: 200
    input: []
    output: WelfareCheckRequest
    side_effects: ["status -> DISPATCHED"]
  - method: POST
    path: "/api/welfare-checks/{id}/complete"
    description: "Complete a dispatched welfare check with a disposition; drives escalation auto-resolution"
    roles: [ExternalResponder]
    code: 200
    input: [disposition, "note?"]
    output: WelfareCheckRequest
    side_effects: ["status -> COMPLETED; disposition OK -> escalation RESOLVED_OK; ASSIST_NEEDED -> RESOLVED_WITH_REFERRAL + auto ServiceReferral; NOT_FOUND -> no auto-resolution"]
  - method: POST
    path: "/api/welfare-checks/{id}/decline"
    description: "Decline a requested/dispatched welfare check"
    roles: [ExternalResponder]
    code: 200
    input: [reason]
    output: WelfareCheckRequest
    side_effects: ["status -> DECLINED"]

  # --- ServiceReferral ---
  - method: GET
    path: "/api/service-referrals"
    description: "List service referrals with filters"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: ["participant_id?", "escalation_id?", "source_call_log_id?", "status?", "overdue?", "limit?", "offset?"]
    output: ServiceReferral[]
    side_effects: []
  - method: POST
    path: "/api/service-referrals"
    description: "Create a referral (DRAFT) from an identified need"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 201
    input: [participant_id, service_type, "priority?", "source_call_log_id?", "notes?"]
    output: ServiceReferral
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/api/service-referrals/{id}"
    description: "Get a referral"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: []
  - method: POST
    path: "/api/service-referrals/{id}/submit"
    description: "Submit a draft referral; computes SLA deadline"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> SUBMITTED; submitted_at and sla_due_at set"]
  - method: POST
    path: "/api/service-referrals/{id}/accept"
    description: "Record provider acceptance"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> ACCEPTED"]
  - method: POST
    path: "/api/service-referrals/{id}/decline"
    description: "Record provider decline"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: ServiceReferral
    side_effects: ["status -> DECLINED; decline_reason set"]
  - method: POST
    path: "/api/service-referrals/{id}/revise"
    description: "Return a DECLINED referral to DRAFT for revision (rework loop)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> DRAFT; submitted_at/sla_due_at cleared"]
  - method: POST
    path: "/api/service-referrals/{id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED referral"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> WITHDRAWN"]
  - method: POST
    path: "/api/service-referrals/{id}/close"
    description: "Close an ACCEPTED referral"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: ServiceReferral
    side_effects: ["status -> CLOSED"]

  # --- SatisfactionSurvey ---
  - method: GET
    path: "/api/participants/{id}/satisfaction-surveys"
    description: "List a participant's satisfaction surveys"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: ["period_month?", "limit?", "offset?"]
    output: SatisfactionSurvey[]
    side_effects: []
  - method: POST
    path: "/api/participants/{id}/satisfaction-surveys"
    description: "Issue a satisfaction survey for a period (one per participant-period)"
    roles: [IntakeWorker]
    code: 201
    input: [period_month]
    output: SatisfactionSurvey
    side_effects: ["status = ISSUED; issued_at = clock"]
  - method: GET
    path: "/api/satisfaction-surveys/{id}"
    description: "Get a survey"
    roles: [ProgramCoordinator, IntakeWorker, QualityReviewer]
    code: 200
    input: []
    output: SatisfactionSurvey
    side_effects: []
  - method: POST
    path: "/api/satisfaction-surveys/{id}/return"
    description: "Record returned survey items; computes survey_mean"
    roles: [IntakeWorker]
    code: 200
    input: [items]
    output: SatisfactionSurvey
    side_effects: ["status -> SCORED; survey_mean computed (calculation satisfaction_index per-survey step)"]

  # --- OutcomeReport ---
  - method: GET
    path: "/api/outcome-reports/{id}"
    description: "Get an outcome report"
    roles: [ProgramCoordinator, QualityReviewer]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: []
  - method: POST
    path: "/api/outcome-reports/{id}/finalize"
    description: "Finalize a PROVISIONAL report once the period has ended; recomputes metrics under the final variant"
    roles: [QualityReviewer]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: ["status -> FINALIZED; calculation outcome_report_monthly (final variant)"]

# =============================================================================
# Table 6: Error Code Catalog (32 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_NOT_OWN_RESOURCE, http: 403, condition: "VolunteerCaller acting on a resource whose volunteer_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Escalation resolver X-User-ID equals opened_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, unknown field, invalid enum, window_start >= window_end, out-of-range value" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_INTAKE_PAUSED, http: 409, condition: "Program intake_posture == PAUSED blocks application creation and approval" }
  - { id: ERR_PARTICIPANT_NOT_ENROLLED, http: 409, condition: "Operation requires Participant.status == ENROLLED (assignments, schedules, surveys)" }
  - { id: ERR_CAPACITY_REACHED, http: 409, condition: "Offer accept finds free_slots exhausted by an intervening enrollment" }
  - { id: ERR_OFFER_NOT_OPEN, http: 409, condition: "Waitlist entry not in OFFERED status, or offer already past offer_expires_at" }
  - { id: ERR_REAPPLICATION_TOO_SOON, http: 409, condition: "Reapply before last_status_change_at + reapply_cooling_days" }
  - { id: ERR_EMERGENCY_CONTACT_REQUIRED, http: 422, condition: "Approve without at least one ACTIVE PRIMARY emergency contact" }
  - { id: ERR_NO_24H_CONTACT, http: 422, condition: "Approve of HIGH/CRITICAL effective tier without an ACTIVE accepts_24h contact" }
  - { id: ERR_VOLUNTEER_NOT_CERTIFIED, http: 409, condition: "Volunteer lacks VALID required training or is not status ACTIVE for assignment" }
  - { id: ERR_CONFIDENTIALITY_NOT_CURRENT, http: 409, condition: "No ACTIVE agreement matching program.current_policy_version within validity" }
  - { id: ERR_SAFETY_FIELDS_REQUIRED, http: 422, condition: "concern_level IMMEDIATE_DANGER requires follow_up_needed=true, supervisor_notified=true, non-empty follow_up_plan" }
  - { id: ERR_FUTURE_DATED_CALL_LOG, http: 422, condition: "called_at is after the logical clock" }
  - { id: ERR_AVAILABILITY_OVERLAP, http: 409, condition: "New availability window overlaps an existing same-weekday window under half-open semantics with overlapping effective ranges" }
  - { id: ERR_WINDOW_OUTSIDE_AVAILABILITY, http: 422, condition: "Assignment window not contained in any volunteer AvailabilityWindow effective on the scheduled_date" }
  - { id: ERR_WINDOW_OUTSIDE_SCHEDULE, http: 422, condition: "Assignment window not contained in any ACTIVE CallSchedule window for the participant on that weekday" }
  - { id: ERR_ASSIGNMENT_WINDOW_CONFLICT, http: 409, condition: "Assignment collides with another SCHEDULED assignment of the volunteer under closed buffer-inclusive interval semantics" }
  - { id: ERR_WEEKLY_LOAD_EXCEEDED, http: 409, condition: "Assignment would push volunteer current-week minutes strictly above max_weekly_minutes" }
  - { id: ERR_MAX_ASSIGNMENTS_REACHED, http: 409, condition: "Volunteer already holds max_concurrent_assignments future-dated SCHEDULED assignments" }
  - { id: ERR_NO_ELIGIBLE_VOLUNTEER, http: 409, condition: "Selector pool empty after eligibility filters (status, certification, confidentiality, availability, language, load, caps)" }
  - { id: ERR_NO_OPEN_ESCALATION, http: 409, condition: "Advance/resolve/record-contact-attempt on a terminal escalation" }
  - { id: ERR_ESCALATION_STEP_NOT_DUE, http: 409, condition: "Advance before the step's deadline and before its work precondition is met" }
  - { id: ERR_CONCERN_NOT_FLAGGED, http: 422, condition: "Referral submit with source_call_log_id whose concern_flag is false" }
  - { id: ERR_SURVEY_PERIOD_DUPLICATE, http: 409, condition: "A survey already exists for the participant and period_month" }
  - { id: ERR_REPORT_PERIOD_OPEN, http: 409, condition: "Finalize requested while the logical clock is still within the report period" }
  - { id: ERR_DUPLICATE_SCHEDULE, http: 409, condition: "An ACTIVE or PAUSED CallSchedule already exists for the participant on that weekday" }

# =============================================================================
# Table 7: RBAC Matrix (5 roles)
# =============================================================================
roles:
  - name: IntakeWorker
    description: "Enrollment and waitlist operations: applications, review decisions, offers, surveys"
    identity: opaque
    exclusive_operations:
      - "POST /api/participants and PATCH /api/participants/{id}"
      - "POST submit-review / approve / deny / reapply"
      - "POST /api/programs/{id}/promotion-runs"
      - "POST waitlist-entry accept / decline / withdraw"
      - "POST satisfaction-survey issue / return"
    shared_operations:
      - "Read participants, contacts, schedules, waitlist entries, surveys"
      - "POST /api/_clock/set_current_utc"
      - "Emergency contact create / deactivate / reactivate"
  - name: ProgramCoordinator
    description: "Day-to-day operations: program config, volunteers, schedules, assignments, call logs, escalations (open/advance), referrals"
    identity: opaque
    exclusive_operations:
      - "POST/PATCH /api/programs; pause-intake / resume-intake; daily-closeout"
      - "Volunteer lifecycle: create, begin-training, certify, deactivate, reactivate, separate; training records"
      - "Call schedules and assignments create / cancel / reschedule"
      - "POST /api/escalations; advance; record-contact-attempt"
      - "Referral submit / accept / decline / revise / withdraw"
      - "Participant suspend / resume / disenroll"
    shared_operations:
      - "Read all operational resources"
      - "POST call logs (as coordinator fallback)"
      - "POST /api/_clock/set_current_utc"
      - "Emergency contact create / deactivate / reactivate"
      - "Availability window create/delete (any volunteer)"
  - name: QualityReviewer
    description: "Independent review: resolves escalations (never ones the same user opened), closes referrals, finalizes reports, revokes agreements"
    identity: opaque
    exclusive_operations:
      - "POST /api/escalations/{id}/resolve (subject to ERR_SEGREGATION_OF_DUTIES)"
      - "POST /api/service-referrals/{id}/close"
      - "POST /api/programs/{id}/outcome-reports; POST /api/outcome-reports/{id}/finalize"
      - "POST /api/confidentiality-agreements/{id}/revoke"
    shared_operations:
      - "Read participants, volunteers, escalations, welfare checks, referrals, reports"
      - "POST /api/_clock/set_current_utc"
      - "POST /api/service-referrals (create DRAFT)"
  - name: VolunteerCaller
    description: "Volunteer caller: manages own availability, signs own confidentiality agreement, logs outcomes on own assignments"
    identity: entity_backed:VolunteerCaller
    exclusive_operations:
      - "POST /api/volunteers/{self}/confidentiality-agreements (sign own)"
    shared_operations:
      - "POST /api/call-assignments/{id}/call-logs (own assignments only; ERR_NOT_OWN_RESOURCE otherwise)"
      - "POST /api/volunteers/{self}/availability-windows; DELETE /api/availability-windows/{id} (own)"
      - "Read own volunteer record, own windows/agreements, own assignments"
  - name: ExternalResponder
    description: "External welfare-check partner (e.g., police / APS liaison): dispatches, completes, declines welfare check requests"
    identity: opaque
    exclusive_operations:
      - "POST /api/welfare-checks/{id}/dispatch / complete / decline"
    shared_operations:
      - "Read welfare checks, participants, programs"
