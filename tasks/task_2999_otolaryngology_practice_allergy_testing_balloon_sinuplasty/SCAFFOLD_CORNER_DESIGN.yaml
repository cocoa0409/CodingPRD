              payload: { patient_id: "${pat_3}", procedure_type: "TYMPANOSTOMY_TUBES", venue: "SURGERY_CENTER", start_at: "2026-08-10T08:00:00Z", end_at: "2026-08-10T10:00:00Z", physician_user_id: "u_ent_1", surgery_center_block_id: "${block_id}" }
              as: PracticeAdmin
