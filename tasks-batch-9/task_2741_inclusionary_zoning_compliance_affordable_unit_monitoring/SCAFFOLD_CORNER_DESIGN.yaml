            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Stale Unit", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-CU-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "CC-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u1_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "CC-201", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "OWNERSHIP", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u2_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u1_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units/${u2_id}/record-restriction", payload: { original_purchase_price_cents: 32500000, recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Hana Iyer", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h1_id: $.data.id } }
            - { call: "POST /iz-compliance/households", payload: { applicant_name: "Jonas Wolf", household_size: 3, gross_annual_income_cents: 6000000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { h2_id: $.data.id } }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h1_id}", unit_id: "${u1_id}", certified_income_cents: 6000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h2_id}", unit_id: "${u2_id}", certified_income_cents: 6000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "GET /iz-compliance/affordable-units/${u1_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u1_v0: $.data.version } }
            - { call: "GET /iz-compliance/affordable-units/${u2_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u2_v0: $.data.version } }
          trigger:
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u1_id}", expected_unit_version: "${u1_v0}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h1_id}", captures: { t1_id: $.data.id } }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u1_id}", expected_unit_version: "${u1_v0}", proposed_price_cents: 31000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h1_id}", captures: { e1: $.data.error_id } }
            - { call: "GET /iz-compliance/affordable-units/${u1_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u1_v1: $.data.version } }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u1_id}", expected_unit_version: "${u1_v1}", proposed_price_cents: 31000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h1_id}", captures: { t2_id: $.data.id } }
            - { call: "GET /iz-compliance/resale-transactions/${t1_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2027-03-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/monitoring-reviews", payload: { unit_id: "${u2_id}", review_year: 2027, reported_rent_cents: 0, reported_income_cents: 6000000, occupancy_verified: false }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { mv_id: $.data.id } }
            - { call: "POST /iz-compliance/monitoring-reviews/${mv_id}/submit-cure", payload: { corrected_rent_cents: 0 }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/monitoring-reviews/${mv_id}/escalate", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-2" }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u2_id}", expected_unit_version: "${u2_v0}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h2_id}", captures: { e2: $.data.error_id } }
            - { call: "GET /iz-compliance/affordable-units/${u2_id}", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { u2_v1: $.data.version } }
            - { call: "POST /iz-compliance/resale-transactions", payload: { unit_id: "${u2_id}", expected_unit_version: "${u2_v1}", proposed_price_cents: 32000000, appraised_value_cents: 41000000, capital_improvements_cents: 0, deferred_maintenance_cents: 0, broker_fee_cents: 1000000 }, as: Resident, as_user_id: "${h2_id}", captures: { e3: $.data.error_id } }
          assert:
            - "the first submission on CC-101 returns 201 SUBMITTED and increments AffordableUnit.${u1_id}.version, so ${u1_v1} > ${u1_v0}"
            - "the second submission quoting ${u1_v0} returns 412 ERR_STALE_UNIT_VERSION; ${t1_id} is still SUBMITTED and the transaction list for ${u1_id} has total_count 1"
            - "the retry quoting ${u1_v1} returns 201 as ${t2_id}, and the read of ${t1_id} now shows SUPERSEDED — supersession is a consequence of the accepted write only"
            - "issuing the occupancy finding on CC-201 bumps AffordableUnit.${u2_id}.version as a cascade from a write to a DIFFERENT entity, and the escalation leaves compliance_status OUT_OF_COMPLIANCE with the project posture UNDER_ENFORCEMENT"
            - "submitting a resale on the escalated unit with the pre-review version ${u2_v0} returns 412 ERR_STALE_UNIT_VERSION — NOT 422 ERR_UNIT_OUT_OF_COMPLIANCE — because priority 8 precedes priority 22"
            - "resubmitting with the refreshed ${u2_v1} now returns 422 ERR_UNIT_OUT_OF_COMPLIANCE, proving the earlier 412 was the version guard and not the enforcement guard, and no ResaleTransaction exists for ${u2_id}"

      - name: excluded_cascade_fan_out_from_a_single_write
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ResaleTransaction.BUYER_CERTIFIED_to_CLOSED
        excluded_because:
          difficulty_instance: resale_close_cascades_to_unit_basis_seller_certification_and_fund
          rationale: |
            The §1.8 instance already drives the deepest cascade in the domain from one close call —
            the unit's occupant and frozen purchase basis, the seller's certification, the trust-fund
            recapture inflow and the project posture all move together — and asserts every limb plus
            the untouched neighbours. A §1.9 restatement would re-run the identical call graph with
            the identical assertions, so the layer is exhausted there; the sibling instance
            withdraw_unit_cascades_to_substitution_fee_and_posture_flip covers the second fan-out
            shape (obligation recomputation) for the same reason.

      - name: excluded_two_formulas_over_one_input_set
        claim_type: dual_variant_calculation
        grounds:
          - calculations.max_resale_price
        excluded_because:
          difficulty_instance: resale_price_ami_indexed_vs_shared_appreciation_diverge
          rationale: |
            The dual-variant layer lives entirely in max_resale_price, and the §1.8 instance pins
            both branches on byte-identical inputs, shows the ceilings diverging, and proves the
            branch is chosen by the recorded agreement rather than the payload. The calculations
            section of this file already carries the selection claim
            (the_resale_formula_branch_comes_from_the_agreement_not_the_payload) and a stub for the
            divergence itself, so a further §1.9 instance would only duplicate the §1.8 arithmetic.

      - name: excluded_threshold_crossing_changes_the_rate
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.in_lieu_fee_amount
        excluded_because:
          difficulty_instance: in_lieu_fee_capped_surcharge_and_post_surcharge_tier_scan
          rationale: |
            Every rate threshold in the domain — the project-size applicability floor, the surcharge
            cap and the discount-tier ladder — is exercised by the §1.8 instance, which forces the
            surcharge to clamp and then shows the tier being selected on the POST-surcharge total so
            that the cap and the ladder interact. The §1.9 calculations and validations sections hold
            the boundary-inclusive companions (project size at exactly ten units, the refinance cap
            at the exact ceiling), leaving nothing distinct for this row.

  # ===========================================================================
  # SECTION 9 — Consistency Model (Table 9): §1.0 declares `immediate`.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_cascade_limb_is_readable_in_the_same_request_that_caused_it
        claim_type: immediate
        grounds:
          - endpoints.POST_/iz-compliance/resale-transactions/{resale_transaction_id}/close
          - state_machines.ResaleTransaction.BUYER_CERTIFIED_to_CLOSED
        distinguishing_aspect: |
          The declared consistency model is immediate, so there is no settlement step, no queue and
          no eventual reconciliation anywhere in the program: the close response already carries the
          full waterfall, and the very next reads — with no intervening write and no clock movement
          — show the unit re-based and re-occupied, the seller's certification superseded, the
          buyer's certification live, the fund inflow updated and the derived funder report already
          quoting the new occupant. Re-reading a second time returns identical bytes, which
          distinguishes immediate visibility from a value that is merely computed lazily on first
          read.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, dev-1) screened SUBJECT, ONSITE elected, agreement recorded (AMI_INDEXED, 2500 bps share, 9000 bps LTV)."
            - "OWNERSHIP 2br unit CM-101 restricted at 32500000, occupied by seller H1 (size 3, 6000000) certified at rent 0; buyer H2 (size 2, 5000000) certified on the same unit."
            - "A resale priced 32000000 with broker_fee_cents 1000000 and no improvements is approved by hco-1, the ROFR is waived, and hco-2 certifies the buyer."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
