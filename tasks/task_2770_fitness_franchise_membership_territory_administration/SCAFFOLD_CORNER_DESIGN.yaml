  - section: cross_cutting_complexity_layers
    instances:
      - name: corner_occ_rule_one_rejects_a_stale_club_version_then_accepts_a_fresh_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.agreement-create-stale-club
          - endpoints[POST /franchise/agreements]
          - errors.ERR_STALE_CLUB_VERSION
        distinguishing_aspect: "The §1.2.1 rule agreement-create-stale-club is exercised end to end on its declared write endpoint and occ_field: an inspection score bumps Club.version between the read and the write, the stale expected_club_version is refused with ERR_STALE_CLUB_VERSION (412), and the retry with the re-read version succeeds and bumps Club.version again."
        test_recipe:
          setup:
            - "One franchisee with one OPEN CA club, a PUBLISHED CORE12 plan and one member."
            - "The club version is read, then an inspection scored 95 / 92 / 90 at 12 months bumps it, so the first read is stale."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harborline Fitness LLC", contact_email: "ops@harborlinefit.example" }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown", opened_on: "2024-05-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v_stale: $.data.version }
            - call: "POST /franchise/inspections"
              payload: { club_id: "${c1_id}", inspection_date: "2026-07-15" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { insp_id: $.data.id }
            - call: "POST /franchise/inspections/${insp_id}/score"
              payload: { equipment_condition_pts: 95, cleanliness_pts: 92, safety_pts: 90, equipment_age_months_max: 12 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v_stale}", signed_on: "2026-08-01", multi_club_access: false }
              as: ClubManager
              as_user_id: "${c1_id}"
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v_fresh: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v_fresh}", signed_on: "2026-08-01", multi_club_access: false }
              as: ClubManager
