  - rule_id: transitive_cascade
    instances:
      - name: close_cycle_lapse_suspends_path_and_disqualifies_entry_depth_five
        grounds:
          - state_machines.Membership.ACTIVE_to_LAPSED
          - state_machines.EducationPath.ACTIVE_to_SUSPENDED
          - state_machines.ContestEntry.ENTERED_to_DISQUALIFIED
          - state_machines.Membership.ISSUED_to_OVERDUE
          - calculations.dues_quote
        distinguishing_aspect: |
          A five-hop cascade triggered by POST /clubs/{id}/close-cycle: the close marks the unpaid
          invoice OVERDUE, the membership lapses, the education path suspends, the contest entry is
          disqualified and the contest's entry_count falls to zero, each hop caused by the previous
          one rather than by the original call.
