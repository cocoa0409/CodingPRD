# ============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2696 — Transit Fare Enforcement & Proof of Payment
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric assertion below was executed against the §1.3 formulas and their
# constants; the literals are the computed results, not estimates.
#
# Fixture conventions used throughout:
#   * the logical clock starts at 2026-08-01T00:00:00Z (§1.5 POST /_clock/set_current_utc)
#   * zone Z1 carries penalty_multiplier_bps 12000, required_sign_count 10,
#     max_concurrent_deployments 2, enforcement_policy CITATION_IMMEDIATE
#   * deployment windows are 2026-08-05T06:00:00Z -> 2026-08-05T14:00:00Z
#     (480 minutes; 3 inspectors -> enforcement_cost_cents 136080 in a 12000-bps zone)
# ============================================================================

scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: offense_sequence_variants_diverge_on_prior_warning
        grounds:
          - calculations.citation_offense_sequence
          - calculations.citation_assessed_penalty_cents
          - calculations.citation_admin_fee_cents
          - entities.Citation.fields.offense_sequence
          - entities.Citation.fields.citation_only_sequence
          - entities.Citation.fields.reduction_floor_cents
          - state_machines.InspectionEncounter.PENDING_to_CITATION_ISSUED
        distinguishing_aspect: |
          Both variants of citation_offense_sequence run over the SAME rider history in the
          Citation domain and disagree by exactly one ladder step: warning_inclusive counts the
          rider's single prior WARNING_ISSUED encounter and returns 2 (tier 15000 -> assessed
          18000), while citation_only ignores warnings and returns 1 (tier 7500 -> reduction
          floor 9000). A single-variant implementation makes reduction_floor_cents equal
          assessed_penalty_cents.
        test_recipe:
          setup:
            - "Zone Z1 DESIGNATED with signage_compliance_pct 1.0000, penalty_multiplier_bps 12000, enforcement_policy CITATION_IMMEDIATE."
            - "Line L1 assigned to Z1; deployment D1 ACTIVE over 2026-08-05T06:00:00Z..14:00:00Z with 3 inspectors and target_sample_size 5."
            - "Rider R-100 (no fare assistance) has exactly one prior WARNING_ISSUED encounter at 2026-08-05T07:00:00Z and one PENDING NO_PROOF encounter at 2026-08-05T08:00:00Z."
            - "Logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones"
              payload: { zone_code: "Z1", name: "Downtown POP Zone", required_sign_count: 10, penalty_multiplier_bps: 12000, enforcement_policy: "CITATION_IMMEDIATE", max_concurrent_deployments: 2 }
              as: EnforcementPlanner
              captures: { z1: $.data.id }
            - call: "POST /transit-lines"
              payload: { line_code: "L1", mode: "LIGHT_RAIL", daily_boardings: 42000, baseline_evasion_rate_bps: 600 }
              as: EnforcementPlanner
              captures: { l1: $.data.id }
            - call: "POST /zone-line-assignments"
              payload: { zone_id: "${z1}", line_id: "${l1}", platform_segment_count: 4, effective_from: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/submit-for-signage"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /signage-audits"
              payload: { zone_id: "${z1}", audited_at: "2026-08-01T01:00:00Z", signs_verified_count: 10 }
              as: EnforcementPlanner
            - call: "POST /fare-zones/${z1}/designate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /inspectors"
              payload: { badge_number: "B-100", display_name: "Inspector One", certification_expiry: "2027-01-01T00:00:00Z", status: "ACTIVE" }
              as: EnforcementPlanner
              captures: { i1: $.data.id }
            - call: "POST /riders"
              payload: { rider_ref: "R-100", display_name: "Rider One", demographic_band: "BAND_A", residence_geo_tract: "T-001", fare_assistance_enrolled: false }
              as: EnforcementPlanner
              captures: { r1: $.data.id }
            - call: "POST /inspection-deployments"
              payload: { line_id: "${l1}", zone_id: "${z1}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T14:00:00Z", planned_inspector_count: 3, sampling_method: "SYSTEMATIC_INTERVAL", target_sample_size: 5 }
              as: EnforcementPlanner
              captures: { d1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-deployments/${d1}/activate"
              payload: {}
              as: EnforcementPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: EnforcementPlanner
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T07:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e1: $.data.id }
            - call: "POST /inspection-encounters/${e1}/resolve"
              payload: { disposition: "WARNING_ISSUED" }
              as: FareInspector
              as_user_id: "${i1}"
            - call: "POST /inspection-encounters"
              payload: { deployment_id: "${d1}", inspector_id: "${i1}", rider_id: "${r1}", occurred_at: "2026-08-05T08:00:00Z", fare_media_type: "NONE", identity_capture_method: "GOVT_ID" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /citations"
              payload: { encounter_id: "${e2}" }
              as: FareInspector
              as_user_id: "${i1}"
              captures: { cit1: $.data.id }
          assert:
            - "Citation.${cit1}.offense_sequence == 2"
            - "Citation.${cit1}.citation_only_sequence == 1"
            - "Citation.${cit1}.assessed_penalty_cents == 18000"
            - "Citation.${cit1}.reduction_floor_cents == 9000"
            - "Citation.${cit1}.admin_fee_cents == 2160"
            - "Citation.${cit1}.total_due_cents == 20160"
            - "Citation.${cit1}.outstanding_balance_cents == 20160"
            - "Citation.${cit1}.reduction_floor_cents != Citation.${cit1}.assessed_penalty_cents"
            - "Citation.${cit1}.contest_deadline_at == 2026-09-04T09:00:00Z"
            - "InspectionEncounter.${e2}.outcome == CITATION_ISSUED"
            - "Rider.${r1}.prior_warning_count == 1"
            - "Rider.${r1}.prior_citation_count == 1"
            - "Inspector.${i1}.citations_issued_count == 1"

      - name: evasion_rate_variants_diverge_on_identity_refusal
        grounds:
          - calculations.deployment_evasion_rate_bps
          - calculations.deployment_sample_adequacy_ratio
          - calculations.deployment_enforcement_cost_cents
          - entities.InspectionDeployment.fields.measured_evasion_rate_bps
