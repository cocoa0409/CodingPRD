              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { std_a_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "OM.2", title: "Day camp arrival logs", domain: "OPERATIONS", mandatory: false, scoring_weight: 1, applies_to_camp_types: ["DAY"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { std_b_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}", standard_id: "${std_a_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { ev_a_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}", standard_id: "${std_b_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { ev_b_id: "$.data[0].id" }
          trigger:
            - call: "PATCH /accreditation/standard-evaluations/${ev_b_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cycle_id}/submit-self-assessment"
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/camps/${camp_id}/health-center"
              payload: { health_staffing_level: "PHYSICIAN_ONSITE" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cycle_id}/submit-self-assessment"
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_a_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cycle_id}/submit-self-assessment"
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version_2: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_version_2}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "HEALTH_CARE", body_ref: "plan/health-care/v1", effective_date: "2026-08-01", expires_at: "2027-08-01", physician_reviewed: false, expected_camp_version: "${camp_version_2}" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /accreditation/written-plans/${plan_id}/review"
              payload: { decision: "VERIFY", verification_note: "health care plan review" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/written-plans/${plan_id}/review"
              payload: { decision: "REJECT", verification_note: "no physician sign off on file" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "call 1: 422 ERR_STANDARD_NOT_APPLICABLE - the OPERATIONS evaluation was frozen applicable false by the DAY gate"
            - "call 2: 422 ERR_HEALTH_STAFFING_INSUFFICIENT - RN_ONSITE rank 3 is below the required PHYSICIAN_ONSITE rank 4, and this outranks the incompleteness at priority 45"
            - "call 3: 200 with Camp.${camp_id}.health_staffing_level == PHYSICIAN_ONSITE, required_health_staffing_level == PHYSICIAN_ONSITE and compliance_posture back to OPEN"
            - "call 4: 422 ERR_SELF_ASSESSMENT_INCOMPLETE - the same request now surfaces the lower-priority rule because the staffing gap is closed"
            - "call 6: 200 with AccreditationCycle.${cycle_id}.self_assessment_submitted_at == 2026-08-01T00:00:00Z - the non-applicable evaluation is not required to carry a self_score"
            - "call 8: 409 ERR_DUPLICATE_CYCLE_YEAR - a second 2026 cycle for the same camp is refused rather than superseding the first"
            - "call 10: 422 ERR_PHYSICIAN_REVIEW_REQUIRED - a HEALTH_CARE plan cannot be VERIFIED while physician_reviewed is false, and the plan stays SUBMITTED"
            - "call 11: 200 with WrittenPlan.${plan_id}.status == REJECTED - the same endpoint accepts the REJECT decision on an unreviewed health care plan"

