          setup:
            - "Logical clock 2026-09-01. Two contractors A (seeded to 999999 cents rolling spend) and B (seeded to 1000000 cents) at the same ACTIVE dealer with SPECIALTY line S1 at 100 cents."
          setup_api_calls:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { clock_now: $.data.current_utc }
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: PlatformAdmin
