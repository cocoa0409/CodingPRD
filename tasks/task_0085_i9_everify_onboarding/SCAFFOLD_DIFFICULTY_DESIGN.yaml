# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_0085_i9_everify_onboarding  (Expert)
# 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: stem_cap_gap_within_vs_clamped
        grounds:
          - calculations.stem_extension_window
          - entities.WorkAuthorization.fields.cap_gap_days
          - entities.WorkAuthorization.fields.effective_valid_until
        distinguishing_aspect: |
          On the WorkAuthorization domain: a requested 120-day cap-gap yields
          cap_gap_days=120 while a 250-day request clamps to 180 — same base
          OPT end, two valid evaluations differ by the min(.,180) ceiling.
        test_recipe:
          setup:
            - "Onboarding ob1 created, ALIEN_AUTHORIZED, hire_date 2026-06-01."
            - "Base F1_OPT WorkAuthorization wa_base valid_from 2026-04-01, valid_until 2026-09-30, ACTIVE."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Aiko Tan", employee_email: "aiko@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { ob1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob1}", auth_type: "F1_OPT", valid_from: "2026-04-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { wa_base: $.data.id }
          trigger:
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob1}", auth_type: "F1_STEM_OPT", valid_from: "2026-09-30T00:00:00Z", valid_until: "2028-09-30T00:00:00Z", stem_extension_applied: true, supersedes_id: "${wa_base}", requested_gap_days: 120 }
              as: HRReviewer
              captures: { wa_stem: $.data.id }
          assert:
            - "WorkAuthorization.${wa_stem}.cap_gap_days == 120"
            - "WorkAuthorization.${wa_stem}.effective_valid_until == 2027-01-28T00:00:00.000Z"

      - name: onboarding_risk_overdue_vs_clamped
        grounds:
          - calculations.onboarding_compliance_risk
          - entities.Onboarding.fields.is_overdue
          - validations[priority=14]
        distinguishing_aspect: |
          On the Onboarding domain (different entity from STEM): an onboarding
          with overdue+late posture scores 65 while a maxed-out posture sums to
          110 and clamps to 100 — the dual evaluation is unclamped sum vs
          clamp-to-100, distinct from the WorkAuthorization cap-gap variant.
        test_recipe:
          setup:
            - "Onboarding ob_late created with hire_date 2026-06-01 (Section 2 deadline 2026-06-04)."
            - "Clock advanced to 2026-06-10 so the onboarding is overdue before Section 2."
            - "Section 1 attested; Section 2 completed late; E-Verify case submitted late with a reason."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Bo Li", employee_email: "bo@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob_late: $.data.id, ob_late_v: $.data.version }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_late}" }
              as: HRReviewer
              captures: { form_late: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_late}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "P123", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_a: $.data.id }
            - call: "POST /onboardings/${ob_late}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_late_v1: $.data.version }
            - call: "POST /onboardings/${ob_late}/section2-complete"
              payload: { document_ids: ["${doc_a}"], expected_onboarding_version: "${ob_late_v1}" }
              as: HRReviewer
              captures: { ob_late_v2: $.data.version }
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob_late}", i9_form_id: "${form_late}", expected_onboarding_version: "${ob_late_v2}", late_reason: "system outage" }
              as: EVerifyOperator
          trigger:
            - call: "GET /onboardings/${ob_late}/risk"
              payload: {}
              as: ComplianceOfficer
              captures: { rscore: $.data.risk_score }
          assert:
            - "risk_score == 65"
            - "Onboarding.${ob_late}.is_overdue == true"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: section2_deadline_business_day_skip
        grounds:
          - calculations.section2_deadline
          - entities.Onboarding.fields.section2_deadline
        distinguishing_aspect: |
          Mode (a) non-linear multi-input: 3-business-day count interacts with
          weekend skips AND the FEDERAL_HOLIDAYS set — hire 2026-06-17 (Wed)
          crosses the 06-19 Juneteenth holiday plus a weekend, landing the
          deadline on 2026-06-23, not a naive hire+3.
        test_recipe:
          setup:
            - "Onboarding created with hire_date 2026-06-17 (Wed) straddling Juneteenth + weekend."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Cy Park", employee_email: "cy@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-17T00:00:00Z" }
              as: HRReviewer
              captures: { ob_hol: $.data.id }
          trigger:
            - call: "GET /onboardings/${ob_hol}"
              payload: {}
              as: HRReviewer
              captures: { dl: $.data.section2_deadline }
          assert:
            - "Onboarding.${ob_hol}.section2_deadline == 2026-06-23T23:59:59.999Z"

      - name: onboarding_risk_sum_then_round_clamp
        grounds:
          - calculations.onboarding_compliance_risk
          - entities.EVerifyCase.fields.tnc_type
          - entities.IdentityDocument.fields.receipt_resolution_deadline
        distinguishing_aspect: |
          Mode (b) rounding-order pinned: the risk weights are summed FIRST then
          rounded then clamped (sum-then-round), distinct from the section2
          deadline's interval arithmetic; a maxed posture sums 110 and clamps to
          100, proving the order is sum -> clamp, not per-term clamp.
        test_recipe:
          setup:
            - "Onboarding ob_max with hire_date 2026-06-01; clock advanced to 2026-06-10 (overdue)."
            - "Section 2 completed late with a List-A receipt whose 90-day resolution lapses before clock; E-Verify case late with a TNC open; a controlling auth expiring within 30 days."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Di Wu", employee_email: "di@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-06-20T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob_max: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_max}" }
              as: HRReviewer
              captures: { form_max: $.data.0.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_max}", auth_type: "EAD", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-06-20T00:00:00Z" }
              as: HRReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_max}", list_category: "LIST_A", document_title: "EAD", document_number: "R1", is_receipt: true }
              as: HRReviewer
              captures: { doc_rcpt: $.data.id }
            - call: "POST /onboardings/${ob_max}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_max_v1: $.data.version }
            - call: "POST /onboardings/${ob_max}/section2-complete"
              payload: { document_ids: ["${doc_rcpt}"], expected_onboarding_version: "${ob_max_v1}" }
              as: HRReviewer
              captures: { ob_max_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob_max}", i9_form_id: "${form_max}", expected_onboarding_version: "${ob_max_v2}", late_reason: "delayed paperwork" }
              as: EVerifyOperator
              captures: { case_max: $.data.id }
            - call: "POST /everify-cases/${case_max}/result"
              payload: { result: "TNC", agency: "SSA" }
              as: EVerifyOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /onboardings/${ob_max}/risk"
              payload: {}
              as: ComplianceOfficer
              captures: { rmax: $.data.risk_score }
          assert:
            - "risk_score == 100"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: everify_tnc_branch_refer_then_authorize
        grounds:
          - state_machines.EVerifyCase.SUBMITTED_to_TNC_ISSUED
          - state_machines.EVerifyCase.TNC_ISSUED_to_REFERRED
          - state_machines.EVerifyCase.REFERRED_to_EMPLOYMENT_AUTHORIZED
        distinguishing_aspect: |
          Branching fork-join on EVerifyCase: SUBMITTED forks to {AUTHORIZED,
          TNC_ISSUED}; the TNC branch itself forks to {REFERRED, FINAL_NON} with
          divergent onboarding side-effects — distinct entity from the
          WorkAuthorization cycle below.
        test_recipe:
          setup:
            - "Onboarding through Section 2; E-Verify case SUBMITTED, then TNC issued, then REFERRED, then AUTHORIZED."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Ed Ro", employee_email: "ed@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob_t: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_t}" }
              as: HRReviewer
              captures: { form_t: $.data.0.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_t}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "P9", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_t: $.data.id }
            - call: "POST /onboardings/${ob_t}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_t_v1: $.data.version }
            - call: "POST /onboardings/${ob_t}/section2-complete"
              payload: { document_ids: ["${doc_t}"], expected_onboarding_version: "${ob_t_v1}" }
              as: HRReviewer
              captures: { ob_t_v2: $.data.version }
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob_t}", i9_form_id: "${form_t}", expected_onboarding_version: "${ob_t_v2}" }
              as: EVerifyOperator
              captures: { case_t: $.data.id }
            - call: "POST /everify-cases/${case_t}/result"
              payload: { result: "TNC", agency: "DHS" }
              as: EVerifyOperator
            - call: "POST /everify-cases/${case_t}/refer"
              payload: {}
              as: EVerifyOperator
          trigger:
            - call: "POST /everify-cases/${case_t}/result"
              payload: { result: "AUTHORIZED" }
              as: EVerifyOperator
              captures: { case_t_status: $.data.status }
          assert:
            - "EVerifyCase.${case_t}.status == EMPLOYMENT_AUTHORIZED"
            - "Onboarding.${ob_t}.status == AUTHORIZED"

      - name: workauth_cycle_active_extended_superseded
        grounds:
          - state_machines.WorkAuthorization.ACTIVE_to_EXTENDED
          - state_machines.WorkAuthorization.EXTENDED_to_SUPERSEDED
          - state_machines.Onboarding.REVERIFICATION_DUE_to_AUTHORIZED
        distinguishing_aspect: |
          Cyclic/revision shape on WorkAuthorization (different entity than
          EVerifyCase): ACTIVE -> EXTENDED (STEM) -> SUPERSEDED (Section 3
          reverification) loops authorization records, each hop carrying its own
          side-effect set on the base record's status.
        test_recipe:
          setup:
            - "Onboarding AUTHORIZED via non-E-Verify path; base F1_OPT auth extended via STEM, then superseded by a Section 3 reverification."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Fi Ng", employee_email: "fi@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-09-30T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_w: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_w}" }
              as: HRReviewer
              captures: { form_w: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_w}", auth_type: "F1_OPT", valid_from: "2026-04-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { wa_b: $.data.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_w}", auth_type: "F1_STEM_OPT", valid_from: "2026-09-30T00:00:00Z", valid_until: "2028-09-30T00:00:00Z", stem_extension_applied: true, supersedes_id: "${wa_b}", requested_gap_days: 120 }
              as: HRReviewer
              captures: { wa_e: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_w}", list_category: "LIST_A", document_title: "EAD", document_number: "E1", expiration_date: "2028-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { doc_w: $.data.id }
            - call: "POST /onboardings/${ob_w}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_w_v1: $.data.version }
            - call: "POST /onboardings/${ob_w}/section2-complete"
              payload: { document_ids: ["${doc_w}"], expected_onboarding_version: "${ob_w_v1}" }
              as: HRReviewer
            - call: "POST /onboardings/${ob_w}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-29T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /onboardings/${ob_w}/advance-lifecycle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_w}", auth_type: "EAD", valid_from: "2028-09-29T00:00:00Z", valid_until: "2031-09-29T00:00:00Z" }
              as: HRReviewer
              captures: { wa_new: $.data.id }
          trigger:
            - call: "POST /i9-forms/${form_w}/section3"
              payload: { work_authorization_id: "${wa_new}", reverification_reason: "EXPIRING_AUTH", new_expiration_date: "2031-09-29T00:00:00Z" }
              as: HRReviewer
              captures: { rev_w: $.data.id }
          assert:
            - "WorkAuthorization.${wa_e}.status == SUPERSEDED"
            - "Onboarding.${ob_w}.status == AUTHORIZED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: everify_final_nonconfirm_cascade_to_termination
        grounds:
          - state_machines.EVerifyCase.TNC_ISSUED_to_FINAL_NONCONFIRMATION
          - state_machines.Onboarding.EVERIFY_PENDING_to_TERMINATED_NONCONFIRMED
          - entities.AuditEntry.fields.action
        distinguishing_aspect: |
          Depth-3 cascade from the TNC referral-deadline crossing: clock advance
          drives EVerifyCase TNC_ISSUED -> FINAL_NONCONFIRMATION (link 1), which
          itself drives Onboarding EVERIFY_PENDING -> TERMINATED_NONCONFIRMED
          (link 2), which itself appends an AuditEntry(FINAL_NONCONFIRMATION)
          (link 3) — each link caused by the prior, not the clock advance.
        test_recipe:
          setup:
            - "Onboarding in EVERIFY_PENDING with a TNC issued at 2026-06-10; referral window closes 2026-06-25; no referral filed."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Gu Ha", employee_email: "gu@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob_f: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_f}" }
              as: HRReviewer
              captures: { form_f: $.data.0.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_f}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "P3", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_f: $.data.id }
            - call: "POST /onboardings/${ob_f}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_f_v1: $.data.version }
            - call: "POST /onboardings/${ob_f}/section2-complete"
              payload: { document_ids: ["${doc_f}"], expected_onboarding_version: "${ob_f_v1}" }
              as: HRReviewer
              captures: { ob_f_v2: $.data.version }
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob_f}", i9_form_id: "${form_f}", expected_onboarding_version: "${ob_f_v2}" }
              as: EVerifyOperator
              captures: { case_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /everify-cases/${case_f}/result"
              payload: { result: "TNC", agency: "SSA" }
              as: EVerifyOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /onboardings/${ob_f}/advance-lifecycle"
              payload: {}
              as: EVerifyOperator
              captures: { ob_f_status: $.data.status }
          assert:
            - "EVerifyCase.${case_f}.status == FINAL_NONCONFIRMATION"
            - "Onboarding.${ob_f}.status == TERMINATED_NONCONFIRMED"
            - "GET /audit-entries?onboarding_id=${ob_f} contains an entry with action == FINAL_NONCONFIRMATION"

      - name: section2_complete_cascade_document_supersession
        grounds:
          - state_machines.Onboarding.SECTION1_COMPLETE_to_SECTION2_COMPLETE
          - entities.IdentityDocument.fields.status
          - entities.I9Form.fields.chosen_document_path
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (section2-complete): accepting
          the chosen List-A document (link 1) itself supersedes every other
          PRESENTED document on the onboarding (link 2) — chained supersession
          caused by the acceptance, originating from a distinct transition than
          the E-Verify cascade above.
        test_recipe:
          setup:
            - "Onboarding past Section 1 with TWO presented documents: a List A passport (chosen) and an extra List B license (must be superseded)."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Ha Yo", employee_email: "ha@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_s: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_s}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "PA", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_keep: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_s}", list_category: "LIST_B", document_title: "DRIVERS_LICENSE", document_number: "DL", expiration_date: "2029-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_drop: $.data.id }
            - call: "POST /onboardings/${ob_s}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_s_v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob_s}/section2-complete"
              payload: { document_ids: ["${doc_keep}"], expected_onboarding_version: "${ob_s_v1}" }
              as: HRReviewer
              captures: { ob_s_path: $.data.id }
          assert:
            - "IdentityDocument.${doc_keep}.status == ACCEPTED"
            - "IdentityDocument.${doc_drop}.status == SUPERSEDED"
            - "I9Form for ${ob_s} chosen_document_path == LIST_A"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: combination_invalid_beats_expired_document
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          business_constraint (priority 9, ERR_DOCUMENT_COMBINATION_INVALID) vs
          business_temporal (priority 10, ERR_DOCUMENT_EXPIRED): a request whose
          set is BOTH an invalid combination AND contains an expired document
          must return the combination error (lower priority number wins).
        test_recipe:
          setup:
            - "Onboarding past Section 1; two List B documents presented (invalid combo), one of which is also expired."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Iv Lo", employee_email: "iv@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_p: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_p}", list_category: "LIST_B", document_title: "DRIVERS_LICENSE", document_number: "B1", expiration_date: "2020-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_b1: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_p}", list_category: "LIST_B", document_title: "SCHOOL_ID", document_number: "B2", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_b2: $.data.id }
            - call: "POST /onboardings/${ob_p}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_p_v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob_p}/section2-complete"
              payload: { document_ids: ["${doc_b1}", "${doc_b2}"], expected_onboarding_version: "${ob_p_v1}" }
              as: HRReviewer
              captures: { err_p: $.data.error_id }
          assert:
            - "error_id == ERR_DOCUMENT_COMBINATION_INVALID"
            - "HTTP status == 422"

      - name: invalid_state_beats_document_not_owned
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          state (priority 5, ERR_INVALID_STATE) vs business_referential
          (priority 7, ERR_DOCUMENT_NOT_OWNED): completing Section 2 on an
          onboarding still in CREATED (Section 1 not attested) while ALSO passing
          a document owned by a different onboarding returns the state error,
          a different category pair than instance one.
        test_recipe:
          setup:
            - "Onboarding ob_a in CREATED (no Section 1); a document owned by a SECOND onboarding ob_b is passed in."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Jo Ka", employee_email: "jo@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_a: $.data.id, ob_a_v: $.data.version }
            - call: "POST /onboardings"
              payload: { employee_full_name: "Ka Mo", employee_email: "ka@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_b: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_b}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "FP", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_foreign: $.data.id }
          trigger:
            - call: "POST /onboardings/${ob_a}/section2-complete"
              payload: { document_ids: ["${doc_foreign}"], expected_onboarding_version: "${ob_a_v}" }
              as: HRReviewer
              captures: { err_state: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: document_expiry_strict_greater_than_boundary
        grounds:
          - calculations.document_validity
          - validations[priority=10]
        distinguishing_aspect: |
          Numeric/temporal threshold (strict >): a document whose expiration_date
          equals the clock EXACTLY is EXPIRED (invalid), reached through
          section2-complete; expiration == clock fails, expiration > clock passes.
        test_recipe:
          setup:
            - "Onboarding past Section 1; clock at 2026-06-15T12:00:00Z; chosen List A document expires at exactly 2026-06-15T12:00:00Z."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Lo Pe", employee_email: "lo@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_e: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_e}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "PE", expiration_date: "2026-06-15T12:00:00Z" }
              as: HRReviewer
              captures: { doc_e: $.data.id }
            - call: "POST /onboardings/${ob_e}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_e_v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob_e}/section2-complete"
              payload: { document_ids: ["${doc_e}"], expected_onboarding_version: "${ob_e_v1}" }
              as: HRReviewer
              captures: { err_e: $.data.error_id }
          assert:
            - "error_id == ERR_DOCUMENT_EXPIRED"

      - name: section2_empty_document_set_rejected
        grounds:
          - calculations.section2_document_sufficiency
          - validations[priority=9]
        distinguishing_aspect: |
          Empty-collection edge on a DIFFERENT metric/endpoint than the expiry
          threshold: completing Section 2 with an EMPTY document_ids array (zero
          documents) fails the exactly-one-path cardinality with
          ERR_DOCUMENT_COMBINATION_INVALID.
        test_recipe:
          setup:
            - "Onboarding past Section 1; Section 2 attempted with an empty document_ids list."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Mo Qi", employee_email: "mo@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_z: $.data.id }
            - call: "POST /onboardings/${ob_z}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_z_v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob_z}/section2-complete"
              payload: { document_ids: [], expected_onboarding_version: "${ob_z_v1}" }
              as: HRReviewer
              captures: { err_z: $.data.error_id }
          assert:
            - "error_id == ERR_DOCUMENT_COMBINATION_INVALID"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: everify_case_requires_onboarding_section2_complete
        grounds:
          - state_machines.EVerifyCase.DRAFT_to_SUBMITTED
          - state_machines.Onboarding.SECTION2_COMPLETE_to_EVERIFY_PENDING
          - validations[priority=5]
        distinguishing_aspect: |
          EVerifyCase -> Onboarding pair: creating an E-Verify case is only valid
          when the backing Onboarding.status == SECTION2_COMPLETE; an onboarding
          still in SECTION1_COMPLETE rejects the case with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Onboarding only through Section 1 (SECTION1_COMPLETE); E-Verify case attempted prematurely."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "No Ra", employee_email: "no@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob_c: $.data.id, ob_c_v0: $.data.version }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_c}" }
              as: HRReviewer
              captures: { form_c: $.data.0.id }
            - call: "POST /onboardings/${ob_c}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_c_v1: $.data.version }
          trigger:
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob_c}", i9_form_id: "${form_c}", expected_onboarding_version: "${ob_c_v1}" }
              as: EVerifyOperator
              captures: { err_c: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: section3_reverify_requires_onboarding_reverification_due
        grounds:
          - state_machines.Onboarding.REVERIFICATION_DUE_to_AUTHORIZED
          - state_machines.WorkAuthorization.ACTIVE_to_SUPERSEDED
          - validations[priority=5]
        distinguishing_aspect: |
          ReverificationEvent -> Onboarding pair (different entity pair than the
          E-Verify dependency): recording a Section 3 block is only valid when
          the Onboarding.status == REVERIFICATION_DUE; an AUTHORIZED onboarding
          not yet due rejects with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Onboarding AUTHORIZED with an unexpired controlling auth (not yet REVERIFICATION_DUE); Section 3 attempted early."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Op Su", employee_email: "op@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2027-09-30T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_r: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_r}" }
              as: HRReviewer
              captures: { form_r: $.data.0.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_r}", auth_type: "EAD", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { wa_r: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_r}", list_category: "LIST_A", document_title: "EAD", document_number: "ER", expiration_date: "2027-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { doc_r: $.data.id }
            - call: "POST /onboardings/${ob_r}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_r_v1: $.data.version }
            - call: "POST /onboardings/${ob_r}/section2-complete"
              payload: { document_ids: ["${doc_r}"], expected_onboarding_version: "${ob_r_v1}" }
              as: HRReviewer
            - call: "POST /onboardings/${ob_r}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_r}", auth_type: "EAD", valid_from: "2027-09-30T00:00:00Z", valid_until: "2030-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { wa_r2: $.data.id }
          trigger:
            - call: "POST /i9-forms/${form_r}/section3"
              payload: { work_authorization_id: "${wa_r2}", reverification_reason: "EXPIRING_AUTH", new_expiration_date: "2030-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { err_r: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: stem_extension_filing_window_inclusive_boundary
        grounds:
          - calculations.stem_extension_window
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics A (inclusive <= on the filing instant vs the base
          OPT interval END): a STEM extension filed strictly after the base
          F1_OPT valid_until collides with the closed filing window and is
          rejected — adjacency is treated as inside (<=) for the filing instant.
        test_recipe:
          setup:
            - "Base F1_OPT auth valid_until 2026-09-30; clock set past that to 2026-10-01; STEM filed late."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Pa Te", employee_email: "pa@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-09-30T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_st: $.data.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_st}", auth_type: "F1_OPT", valid_from: "2026-04-01T00:00:00Z", valid_until: "2026-09-30T00:00:00Z" }
              as: HRReviewer
              captures: { wa_st_base: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_st}", auth_type: "F1_STEM_OPT", valid_from: "2026-10-01T00:00:00Z", valid_until: "2028-10-01T00:00:00Z", stem_extension_applied: true, supersedes_id: "${wa_st_base}", requested_gap_days: 120 }
              as: HRReviewer
              captures: { err_st: $.data.error_id }
          assert:
            - "error_id == ERR_STEM_WINDOW_MISSED"

      - name: tnc_referral_window_strict_boundary
        grounds:
          - state_machines.EVerifyCase.TNC_ISSUED_to_REFERRED
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics B on a DIFFERENT resource (EVerifyCase referral
          window, not the WorkAuthorization filing window): a referral attempted
          after referral_deadline (clock > deadline, strict) is rejected with
          ERR_REFERRAL_WINDOW_CLOSED — a buffer-less aggregate window rather than
          the inclusive filing-instant check.
        test_recipe:
          setup:
            - "E-Verify case with TNC issued 2026-06-10; referral_deadline 2026-06-25; clock advanced to 2026-06-26; referral attempted late."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Qu Vi", employee_email: "qu@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: true }
              as: HRReviewer
              captures: { ob_rf: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_rf}" }
              as: HRReviewer
              captures: { form_rf: $.data.0.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_rf}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "PR", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { doc_rf: $.data.id }
            - call: "POST /onboardings/${ob_rf}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_rf_v1: $.data.version }
            - call: "POST /onboardings/${ob_rf}/section2-complete"
              payload: { document_ids: ["${doc_rf}"], expected_onboarding_version: "${ob_rf_v1}" }
              as: HRReviewer
              captures: { ob_rf_v2: $.data.version }
            - call: "POST /everify-cases"
              payload: { onboarding_id: "${ob_rf}", i9_form_id: "${form_rf}", expected_onboarding_version: "${ob_rf_v2}" }
              as: EVerifyOperator
              captures: { case_rf: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /everify-cases/${case_rf}/result"
              payload: { result: "TNC", agency: "DHS" }
              as: EVerifyOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-26T09:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /everify-cases/${case_rf}/refer"
              payload: {}
              as: EVerifyOperator
              captures: { err_rf: $.data.error_id }
          assert:
            - "error_id == ERR_REFERRAL_WINDOW_CLOSED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: document_acceptance_count_invariant
        grounds:
          - state_machines.Onboarding.SECTION1_COMPLETE_to_SECTION2_COMPLETE
          - entities.IdentityDocument.fields.status
          - entities.IdentityDocument.fields.accepted_for_section2
        distinguishing_aspect: |
          Conserved quantity 1 — document population conservation: across
          Section 2 completion, the count of IdentityDocuments for the onboarding
          is invariant (each PRESENTED doc becomes exactly one of ACCEPTED or
          SUPERSEDED; none created or destroyed). Total = ACCEPTED + SUPERSEDED +
          PRESENTED must equal the pre-action total.
        test_recipe:
          setup:
            - "Onboarding past Section 1 with three presented documents (1 List A chosen, 1 List B extra, 1 List C extra)."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Ra Si", employee_email: "ra@x.com", citizenship_status: "US_CITIZEN", hire_date: "2026-06-01T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_inv: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_inv}", list_category: "LIST_A", document_title: "US_PASSPORT", document_number: "IA", expiration_date: "2030-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { d_a: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_inv}", list_category: "LIST_B", document_title: "DRIVERS_LICENSE", document_number: "IB", expiration_date: "2029-01-01T00:00:00Z" }
              as: HRReviewer
              captures: { d_b: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_inv}", list_category: "LIST_C", document_title: "SS_CARD", document_number: "IC" }
              as: HRReviewer
              captures: { d_c: $.data.id }
            - call: "POST /onboardings/${ob_inv}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_inv_v1: $.data.version }
          trigger:
            - call: "POST /onboardings/${ob_inv}/section2-complete"
              payload: { document_ids: ["${d_a}"], expected_onboarding_version: "${ob_inv_v1}" }
              as: HRReviewer
          assert:
            - "GET /identity-documents?onboarding_id=${ob_inv} total_count == 3 (unchanged)"
            - "count(status==ACCEPTED) == 1 and count(status==SUPERSEDED) == 2"

      - name: work_authorization_active_record_invariant
        grounds:
          - state_machines.WorkAuthorization.ACTIVE_to_SUPERSEDED
          - state_machines.Onboarding.REVERIFICATION_DUE_to_AUTHORIZED
          - entities.WorkAuthorization.fields.status
        distinguishing_aspect: |
          Conserved quantity 2 (different type — singular active-authorization
          conservation, not document population): across a Section 3
          reverification, exactly ONE WorkAuthorization for the onboarding is in
          {ACTIVE, EXTENDED} before and after; the prior controlling record flips
          to SUPERSEDED as the new one becomes ACTIVE, so the active-count stays
          at 1.
        test_recipe:
          setup:
            - "Onboarding AUTHORIZED then REVERIFICATION_DUE with one controlling auth; a successor auth presented at Section 3."
          setup_api_calls:
            - call: "POST /onboardings"
              payload: { employee_full_name: "Sa Tu", employee_email: "sa@x.com", citizenship_status: "ALIEN_AUTHORIZED", hire_date: "2026-06-01T00:00:00Z", work_auth_expiration: "2026-12-31T00:00:00Z", requires_everify: false }
              as: HRReviewer
              captures: { ob_iv2: $.data.id }
            - call: "GET /i9-forms"
              payload: { onboarding_id: "${ob_iv2}" }
              as: HRReviewer
              captures: { form_iv2: $.data.0.id }
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_iv2}", auth_type: "EAD", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: HRReviewer
              captures: { wa_old: $.data.id }
            - call: "POST /identity-documents"
              payload: { onboarding_id: "${ob_iv2}", list_category: "LIST_A", document_title: "EAD", document_number: "IE", expiration_date: "2026-12-31T00:00:00Z" }
              as: HRReviewer
              captures: { doc_iv2: $.data.id }
            - call: "POST /onboardings/${ob_iv2}/section1-attest"
              payload: {}
              as: HRReviewer
              captures: { ob_iv2_v1: $.data.version }
            - call: "POST /onboardings/${ob_iv2}/section2-complete"
              payload: { document_ids: ["${doc_iv2}"], expected_onboarding_version: "${ob_iv2_v1}" }
              as: HRReviewer
            - call: "POST /onboardings/${ob_iv2}/finalize"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /onboardings/${ob_iv2}/advance-lifecycle"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /work-authorizations"
              payload: { onboarding_id: "${ob_iv2}", auth_type: "EAD", valid_from: "2027-01-02T00:00:00Z", valid_until: "2030-01-02T00:00:00Z" }
              as: HRReviewer
              captures: { wa_succ: $.data.id }
          trigger:
            - call: "POST /i9-forms/${form_iv2}/section3"
              payload: { work_authorization_id: "${wa_succ}", reverification_reason: "EXPIRING_AUTH", new_expiration_date: "2030-01-02T00:00:00Z" }
              as: HRReviewer
          assert:
            - "WorkAuthorization.${wa_old}.status == SUPERSEDED"
            - "WorkAuthorization.${wa_succ}.status == ACTIVE"
            - "GET /work-authorizations?onboarding_id=${ob_iv2}&status=ACTIVE total_count == 1"
