        grounds:
          - state_machines.AgentAppointment.NOTICE_PENDING_to_RESIGNED
          - state_machines.ForeignQualification.QUALIFIED_to_REVOKED
          - state_machines.AnnualFiling.SCHEDULED_to_WITHDRAWN
          - calculations.compliance_posture_derivation
        distinguishing_aspect: |
          Depth-3 chain triggered by POST finalize-resignation: AgentAppointment
          RESIGNED -> LegalEntity posture recomputed (coverage lost in J3 while
          qualification QUALIFIED: POSTURE_CHANGED event + suspended_since set)
          -> ForeignQualification QUALIFIED -> REVOKED -> that jurisdiction's
          SCHEDULED AnnualFiling -> WITHDRAWN. Each hop is caused by the
          previous hop's mutation, not by the original request. After the
          cascade, posture recomputes to GOOD_STANDING because REVOKED removes
          J3 from registered_jurisdictions (J1 coverage remains intact).
        test_recipe:
          setup:
            - "J1 (formation) with agent AG1; J3 (US-NV, FIXED 9/30, franchise NONE) with agent AG3"
            - "E1 ACTIVE in J1; AgentAppointment AA3 covers (E1, J3) since 2026-06-01, status ACTIVE"
            - "AUTHORIZE_QUALIFICATION resolution for J3 ADOPTED; ForeignQualification Q3 QUALIFIED"
            - "J3 generated an ANNUAL_REPORT period 2026 due 2026-09-30, status SCHEDULED (no FRANCHISE_TAX: method NONE)"
            - "logical clock at the 2026-08-01 default; resignation notice filed on AA3 at 2026-08-01 -> effective_end_date 2026-08-31; clock advanced to 2026-08-31 (ripe: today >= effective_end_date)"
