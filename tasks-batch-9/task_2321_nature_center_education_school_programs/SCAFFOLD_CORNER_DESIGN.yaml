      - name: moving_the_logical_clock_forward_puts_yesterday_s_slots_out_of_reach
        claim_type: Action endpoint
        grounds:
          - endpoints.POST /_clock/set_current_utc
          - validations.priority_29
          - errors.ERR_BOOKING_START_IN_PAST
        distinguishing_aspect: |
          The clock endpoint is the only writable source of 'now', so it is advanced past a date
