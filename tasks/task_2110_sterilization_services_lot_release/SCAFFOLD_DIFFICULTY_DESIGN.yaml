            - "Cycle.${cyc_id}.status == CANCELLED and loaded_pallet_count == 0 and load_density_g_per_cm3 == 0.0"
            - "Lot.${lot1_id}.status == RECEIVED, staged_pallet_count == 0, available_pallet_count == 2"
            - "GET /sterilization/load-positions?cycle_id=${cyc_id} returns total_count == 0"

      - name: delete_load_position_conserves_pallet_count_across_lot_and_cycle
        grounds:
          - state_machines.Cycle.LOADING_to_LOADING
          - state_machines.Cycle.LOADING_to_PLANNED
          - entities.Lot.fields.staged_pallet_count
          - entities.Lot.fields.available_pallet_count
          - entities.Cycle.fields.loaded_pallet_count
          - calculations.cycle_load_density
          - invariants.pallet_conservation
