  # =========================================================================
  # Table 8 (Cross-cutting complexity layers). The profile declares
  # [optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
  # selector_policy]; selector_policy has no guide row, and its breadth is
  # covered by the conditional_action instance above.
  - section: cross_cutting_complexity_layers
    instances:
      - name: all_three_occ_rules_reject_a_stale_parent_version_and_admit_the_retry
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-offer-stale-ensemble]
          - concurrency_rules[chair-rotation-stale-ensemble]
          - concurrency_rules[aid-award-run-stale-season]
          - errors[ERR_STALE_ENSEMBLE_VERSION]
          - errors[ERR_STALE_SEASON_VERSION]
          - validations[priority 30]
          - validations[priority 31]
        distinguishing_aspect: |
          §1.7 declares exactly three OCC-guarded writes and this recipe walks all three
          with the same shape: read the parent version, let a legitimate write of the caller's
          own advance it, then replay the ORIGINAL token. Each replay is 412 - the two
          ensemble-guarded writes report ERR_STALE_ENSEMBLE_VERSION, the season-guarded
          award run reports ERR_STALE_SEASON_VERSION - and each retry with the freshly read
          version succeeds, which proves the 412 is a staleness verdict and not a business
          refusal. The chair-rotation case is the sharpest: the very token that just drove a
          successful rotation is stale for the next one, because the rotation itself re-seated
          the section and bumped Ensemble.version.
        test_recipe:
          setup:
            - "Season 2026-27 in PLACEMENT with aid_budget_cents 100000 and tuition_base_cents"
            - "123223. One Philharmonic ensemble (max_total_size 6) owns a ROTATING VIOLIN"
            - "section min 1 / target 3 / max 3. Occ One, Occ Two and Occ Three (years_in_org"
            - "3, 2, 1; all BAND_B) hold ADJUDICATED auditions at 81.80 -> PHILHARMONIC."
            - "The ensemble is FORMING with offered_count 0 and seated_count 0, and its current"
            - "version was captured as ens_v1. The clock reads 2026-08-05T09:00:00Z."
