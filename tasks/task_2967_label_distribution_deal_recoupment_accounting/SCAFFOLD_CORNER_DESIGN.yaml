  # ---------------------------------------------------------------------------
  # Cross-cutting complexity layers — §1.0 complexity_layers is
  # [dual_variant_calculation, cascading_side_effects, optimistic_concurrency,
  # rate_threshold_triggers]. The optimistic_concurrency layer gets one
  # stale-version instance per §1.2.1 rule (four rules) plus a version-increment
  # walk; the other three layers are already probed in depth by §1.8 and are
  # recorded here as exclusions so the mapping stays auditable.
  # Every stale value below is derived from a CAPTURED version, never a literal.
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_deal_version_rejects_the_second_accept
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-accept-stale-deal]
          - endpoints[POST /dsp-revenue-reports/{id}/accept]
          - validations[priority 7]
        distinguishing_aspect: |
          Two revenue reports on ONE deal are each independently acceptable, so the second accept
          cannot be rejected on state grounds — the only thing wrong with it is that its advance
          waterfall was computed from a deal snapshot the first accept superseded. The client reads
          the deal once, accepts report A with that version, then replays the SAME version on report
          B: 412. Re-reading the deal and retrying the identical body succeeds, which proves the
          rejection is a version echo and not a hidden state precondition.
        test_recipe:
          setup:
            - "one EXECUTED deal (advance 500000, cross_collateralized true, fee 0.1500) with one RELEASED release"
            - "two SUBMITTED reports on that deal for disjoint quarters, each carrying one 250000-stream PREMIUM/US line worth 100000 gross"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 500000, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id, deal_v_create: $.data.version }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000266", title: "Version Echo", planned_release_date: "2026-02-01", formats: ["DIGITAL"], advance_share_cents: 500000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-L1-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-01-01", period_end: "2026-03-31" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_a_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_a_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 250000 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_a_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports"
              payload: { deal_id: "${deal_id}", dsp_code: "STRM", period_start: "2026-04-01", period_end: "2026-06-30" }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { rep_b_id: $.data.id }
            - call: "POST /dsp-revenue-reports/${rep_b_id}/lines"
              payload: { release_id: "${rel1_id}", territory_code: "US", tier: "PREMIUM", stream_count: 250000 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "POST /dsp-revenue-reports/${rep_b_id}/submit"
              payload: {}
              as: DistributionPartner
              as_user_id: "${dist_id}"
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v0: $.data.version }
          trigger:
            - call: "POST /dsp-revenue-reports/${rep_a_id}/accept"
              payload: { expected_deal_version: "${deal_v0}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rep_a_status: $.data.status, rep_a_applied: $.data.advance_applied_cents }
            - call: "POST /dsp-revenue-reports/${rep_b_id}/accept"
              payload: { expected_deal_version: "${deal_v0}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { e_stale: $.data.error_id }
            - call: "GET /dsp-revenue-reports/${rep_b_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rep_b_status_after_412: $.data.status }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v1: $.data.version, deal_recouped_1: $.data.advance_recouped_cents }
            - call: "POST /dsp-revenue-reports/${rep_b_id}/accept"
              payload: { expected_deal_version: "${deal_v1}" }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { rep_b_status: $.data.status, rep_b_applied: $.data.advance_applied_cents }
            - call: "GET /distribution-deals/${deal_id}"
              payload: {}
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { deal_v2: $.data.version, deal_recouped_2: $.data.advance_recouped_cents, deal_unrecouped_2: $.data.unrecouped_advance_cents }
          assert:
            - "${rep_a_status} == \"ACCEPTED\" and ${rep_a_applied} == 85000 == 100000 - round_half_up(100000 * 0.1500)"
            - "${e_stale} == \"ERR_STALE_DEAL_VERSION\" with HTTP 412 — priority 7, ahead of the priority-8 report-state and deal-collecting checks"
            - "${rep_b_status_after_412} == \"SUBMITTED\" and ${deal_recouped_1} == 85000: the rejected accept wrote nothing on either entity"
            - "${deal_v1} == ${deal_v0} + 1: only the successful accept advanced the deal"
            - "${rep_b_status} == \"ACCEPTED\" and ${rep_b_applied} == 85000 for the identical body once the fresh version is echoed"
            - "${deal_v2} == ${deal_v1} + 1, ${deal_recouped_2} == 170000 and ${deal_unrecouped_2} == 330000 == 500000 - 170000"

      - name: stale_deal_version_rejects_the_dispute_reversal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[report-dispute-stale-deal]
          - endpoints[POST /dsp-revenue-reports/{id}/dispute]
          - validations[priority 7]
        distinguishing_aspect: |
          The dispute path is the accept path's reversal and carries its own OCC rule, so the guard
          must be implemented on BOTH endpoints rather than only on the forward write. Here the deal
          version goes stale because a DIFFERENT report was accepted after the read — the dispute of
          report A is perfectly legal on its own terms, and the retry with the refreshed version
          proves it by reversing exactly 85000 cents of recoupment.
        test_recipe:
          setup:
            - "the same deal and two reports as the accept instance, with BOTH reports already ACCEPTED so advance_recouped_cents is 170000"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Vector Digital", legal_entity: "Vector Digital LLC", default_returns_reserve_pct: 0.1000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 500000, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
