      - name: a_remand_at_the_third_round_is_rejected_by_the_round_limit
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Arbitration.transitions.REMANDED_to_BRIEFING"
          - "validations[priority=12]"
          - "errors[ERR_ARBITRATION_ROUND_LIMIT]"
          - "calculations.arbitration_window"
        distinguishing_aspect: |
          MAX_ARBITRATION_ROUNDS is 3 and the two comparisons differ: a REMAND award needs
          round_number < 3 while an advance back to BRIEFING needs round_number <= 3. So
