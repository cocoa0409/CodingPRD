# =============================================================================
# Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — §1.9
# Provider Enrollment & Payer Roster Synchronization
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: provider_creation_creates_caqh_profile
        claim_type: creation
        grounds:
          - entities.Provider
          - entities.CAQHProfile
        distinguishing_aspect: "POST /api/practice-groups/{id}/providers returns 201 with status ACTIVE, recoupment_balance_cents 0, version 1; the cascade-created CAQHProfile is discoverable via the reverse-reachability GET with status NEVER_ATTESTED and due_at null."
        test_recipe:
          setup: ["Empty database; one practice group"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
          trigger:
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id, st: $.data.status, bal: $.data.recoupment_balance_cents, ver: $.data.version }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq_status: "$.data[0].status", cq_due: "$.data[0].due_at", cq_prov: "$.data[0].provider_id" }
          assert:
            - "${st} == ACTIVE and ${bal} == 0 and ${ver} == 1"
            - "${cq_status} == NEVER_ATTESTED and ${cq_due} == null and ${cq_prov} == ${prov}"
            - "Provider.${prov}.practice_group_id == ${pg}"

      - name: provider_duplicate_npi_rejected
        claim_type: type_constraints
        grounds:
          - entities.Provider.fields.npi
          - errors[ERR_DUPLICATE_NPI]
        distinguishing_aspect: "NPI uniqueness is enforced across all providers regardless of group; second create with the same npi fails with ERR_DUPLICATE_NPI."
        test_recipe:
          setup: ["One practice group with provider NPI-DUP"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-DUP", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
          trigger:
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-DUP", full_name: "Dr Two", specialty: "PD" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_NPI"

      - name: provider_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Provider
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns the error envelope with ERR_NOT_FOUND and response_type error."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/providers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_FOUND with HTTP 404"
            - "Error envelope carries meta.api_request_id and response_type == 'error'"

      - name: application_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.EnrollmentApplication.fields.requested_effective_date
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting requested_effective_date from application creation is rejected at priority 4 with ERR_INVALID_REQUEST before any state or business check runs."
        test_recipe:
          setup: ["Provider and payer exist"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
          trigger:
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL" }
              as: EnrollmentSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: claim_initial_status_hold_release_denied
        claim_type: computed_fields
        grounds:
          - calculations.claim_hold_evaluation
          - entities.Claim.fields.status
          - entities.Claim.fields.denial_reason
        distinguishing_aspect: "The creation-time claim_hold_evaluation picks three different initial states from the same endpoint: RELEASED when a covering record exists, HELD when uncovered with holds enabled, DENIED with PAYER_HOLD_DISABLED when uncovered with holds disabled."
        test_recipe:
          setup:
            - "Attested provider; payer H (hold enabled) with approved record effective 2026-08-01; payer N (claims_hold_enabled false)"
            - "Logical clock 2026-08-10"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PH", name: "Payer H", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_h: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PN", name: "Payer N", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: false, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_n: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_h}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_h}", service_date: "2026-08-05", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { st_rel: $.data.status }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_h}", service_date: "2026-07-01", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { st_held: $.data.status }
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_n}", service_date: "2026-08-05", amount_cents: 1000 }
              as: EnrollmentSpecialist
              captures: { st_den: $.data.status, den_reason: $.data.denial_reason }
          assert:
            - "${st_rel} == RELEASED (service 2026-08-05 >= effective 2026-08-01)"
            - "${st_held} == HELD (service 2026-07-01 before effective date — not covered)"
            - "${st_den} == DENIED and ${den_reason} == PAYER_HOLD_DISABLED (payer N has holds disabled)"

      - name: enrollment_record_fields_set_on_approval
        claim_type: computed_fields
        grounds:
          - entities.EnrollmentRecord.fields.source_application_id
          - entities.EnrollmentRecord.fields.benefit_assignment
          - entities.EnrollmentRecord.fields.last_revalidation_completed_at
        distinguishing_aspect: "Approval copies scope, maps GROUP_LINK to benefit_assignment GROUP (reassignment of benefits), links source_application_id, and seeds the revalidation baseline from the approval timestamp."
        test_recipe:
          setup: ["Attested provider; payer; SUBMITTED GROUP_LINK application"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "GROUP_LINK", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { source_application_id: "${app}" }
              as: EnrollmentSpecialist
              captures: { rec_scope: "$.data[0].enrollment_scope", rec_ba: "$.data[0].benefit_assignment", rec_src: "$.data[0].source_application_id", rec_base: "$.data[0].last_revalidation_completed_at", rec_status: "$.data[0].status" }
          assert:
            - "${rec_scope} == GROUP_LINK and ${rec_ba} == GROUP"
            - "${rec_src} == ${app}"
            - "${rec_base} == '2026-08-01T00:00:00Z' (default clock at approval)"
            - "${rec_status} == ACTIVE"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: rejected_application_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.EnrollmentApplication
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "From terminal REJECTED no transition is possible: approve, submit, request-info and withdraw all fail with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Attested provider; application rejected by the payer"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/reject"
              payload: { reason: "incomplete" }
              as: PayerRepresentative
          trigger:
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "EnrollmentApplication.${app}.status remains REJECTED with decision_reason 'incomplete'"

      - name: reverse_recoupment_rejected_when_not_recouped
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Claim.RECOUPED_to_RELEASED
          - errors[ERR_CLAIM_NOT_RECOUPED]
        distinguishing_aspect: "The compensating action is only defined from RECOUPED; invoking it on a RELEASED claim fails with the domain error ERR_CLAIM_NOT_RECOUPED, not the generic state error."
        test_recipe:
          setup: ["Attested provider with approved record; one RELEASED claim"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-01", amount_cents: 2000 }
              as: EnrollmentSpecialist
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /api/claims/${cl}/reverse-recoupment"
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLAIM_NOT_RECOUPED"
            - "Claim.${cl}.status remains RELEASED"

      - name: roster_line_reconfirm_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RosterLine.PENDING_to_CONFIRMED
          - errors[ERR_ROSTER_LINE_NOT_PENDING]
        distinguishing_aspect: "Confirm is not idempotent: a second confirm on an already-CONFIRMED line fails with ERR_ROSTER_LINE_NOT_PENDING (line-level error reported before the parent file's state error)."
        test_recipe:
          setup: ["Agreement ACTIVE; single-line ADD roster; line confirmed once (record created)"]
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/delegation-agreements"
              payload: { practice_group_id: "${pg}", payer_id: "${py_a}", effective_date: "2026-01-01", expiry_date: "2027-12-31" }
              as: ComplianceOfficer
              captures: { ag: $.data.id, ag_v: $.data.version }
            - call: "POST /api/roster-files"
              payload:
                agreement_id: "${ag}"
                expected_agreement_version: "${ag_v}"
                lines:
                  - { provider_id: "${prov}", action: "ADD", enrollment_scope: "GROUP_LINK", benefit_assignment: "GROUP", expected_effective_date: "2026-08-01" }
              as: EnrollmentSpecialist
              captures: { rf: $.data.id }
            - call: "GET /api/roster-files/${rf}/lines"
              as: EnrollmentSpecialist
              captures: { ln: "$.data[0].id" }
            - call: "POST /api/roster-files/${rf}/lines/${ln}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
          trigger:
            - call: "POST /api/roster-files/${rf}/lines/${ln}/confirm"
              payload: { confirmed_effective_date: "2026-08-01" }
              as: PayerRepresentative
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ROSTER_LINE_NOT_PENDING"
            - "Exactly one EnrollmentRecord exists for (provider, payer) — no duplicate created"

      - name: revalidation_window_cycle_completes
        claim_type: valid_transition
        grounds:
          - state_machines.EnrollmentRecord.ACTIVE_to_PENDING_REVALIDATION
          - state_machines.EnrollmentRecord.PENDING_REVALIDATION_to_ACTIVE
          - calculations.revalidation_schedule
        distinguishing_aspect: "Commercial record approved 2026-08-10 enters PENDING_REVALIDATION when the clock reaches the window (2026-12-28 .. 2027-02-26) and returns to ACTIVE on revalidate with the schedule rebased to 2027-08-03 — a full loop of the cyclic machine."
        test_recipe:
          setup:
            - "Attested provider; commercial payer interval 200; application approved at clock 2026-08-10 (due 2027-02-26, window from 2026-12-28)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/enrollment-applications"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", enrollment_scope: "INDIVIDUAL", requested_effective_date: "2026-08-10" }
              as: EnrollmentSpecialist
              captures: { app: $.data.id }
            - call: "POST /api/enrollment-applications/${app}/submit"
              as: EnrollmentSpecialist
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/enrollment-applications/${app}/approve"
              as: PayerRepresentative
            - call: "GET /api/enrollment-records"
              payload: { provider_id: "${prov}", payer_id: "${py_a}" }
              as: EnrollmentSpecialist
              captures: { rec: "$.data[0].id" }
          trigger:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /api/enrollment-records/${rec}"
              as: EnrollmentSpecialist
              captures: { st_mid: $.data.status }
            - call: "POST /api/enrollment-records/${rec}/revalidate"
              as: EnrollmentSpecialist
              captures: { st_after: $.data.status, due_after: $.data.revalidation_due_date }
          assert:
            - "${st_mid} == PENDING_REVALIDATION (2027-01-15 is inside [2026-12-28, 2027-02-26])"
            - "${st_after} == ACTIVE and ${due_after} == '2027-08-03' (rebased from 2027-01-15 + 200 days)"

      - name: missed_revalidation_deadline_deactivates_and_denies
        claim_type: side_effect_execution
        grounds:
          - state_machines.EnrollmentRecord.PENDING_REVALIDATION_to_DEACTIVATED
          - state_machines.Claim.HELD_to_DENIED
          - errors[ERR_CAQH_ATTESTATION_NOT_CURRENT]
        distinguishing_aspect: "Missing the revalidation deadline auto-deactivates the record and the deactivation cascade denies the provider+payer's HELD claims with ENROLLMENT_DEACTIVATED; already-RELEASED claims are untouched (no retro effect)."
        test_recipe:
          setup:
            - "Attested provider; payer interval 200; record approved 2026-08-10 (due 2027-02-26)"
            - "Claim c_old HELD (service 2026-08-05 < effective 2026-08-10, created before approval); claim c_ok RELEASED (service 2026-08-12, created at clock 2026-08-20)"
          setup_api_calls:
            - call: "POST /api/practice-groups"
              payload: { name: "G", tax_id: "T1", group_npi: "GNPI1" }
              as: ComplianceOfficer
              captures: { pg: $.data.id }
            - call: "POST /api/practice-groups/${pg}/providers"
              payload: { npi: "NPI-P1", full_name: "Dr One", specialty: "IM" }
              as: EnrollmentSpecialist
              captures: { prov: $.data.id }
            - call: "GET /api/providers/${prov}/caqh-profile"
              as: EnrollmentSpecialist
              captures: { cq: "$.data[0].id" }
            - call: "POST /api/caqh-profiles/${cq}/attest"
              as: Provider
              as_user_id: "${prov}"
            - call: "POST /api/payers"
              payload: { payer_code: "PA", name: "Payer A", is_medicare: false, effective_date_policy: "APPROVAL_DATE", claims_hold_enabled: true, revalidation_interval_days: 200 }
              as: ComplianceOfficer
              captures: { py_a: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/claims"
              payload: { provider_id: "${prov}", payer_id: "${py_a}", service_date: "2026-08-05", amount_cents: 3000 }
              as: EnrollmentSpecialist
              captures: { c_old: $.data.id }
            - call: "POST /api/enrollment-applications"
