  - section: state_machines
    instances:
      - name: program_year_starts_in_draft_and_open_window_advances_it
        claim_type: Initial State
        grounds:
          - state_machines.ProgramYear.DRAFT_to_WINDOW_OPEN
          - entities.ProgramYear.fields.status
        distinguishing_aspect: "A new ProgramYear is DRAFT (its declared initial_state) and only POST /open-window moves it to WINDOW_OPEN, bumping version from 1 to 2."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id, py_v1: $.data.version }
          trigger:
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
              captures: { py_v2: $.data.version }
          assert:
            - "before the trigger, ProgramYear.${py_id}.status == DRAFT and ${py_v1} == 1"
            - "after the trigger, ProgramYear.${py_id}.status == WINDOW_OPEN"
            - "${py_v2} == 2 (every write bumps version by exactly 1)"
            - "ProgramYear.${py_id}.current_quarter == 0 (opening the window disburses nothing)"

      - name: application_submit_after_window_close_returns_window_closed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - validations[priority=19]
          - errors.ERR_APPLICATION_WINDOW_CLOSED
        distinguishing_aspect: "The DRAFT row was created inside the window, but at submit time the clock reads 2026-10-01, past window_close_at 2026-09-30T23:59:59Z, so submit must fail 409 and leave the application in DRAFT."
        test_recipe:
          setup:
            - "ProgramYear 2026-27 is WINDOW_OPEN with window_close_at 2026-09-30T23:59:59Z."
            - "Student S1 created a DRAFT application while the clock read 2026-09-01; the clock has since moved to 2026-10-01."
          setup_api_calls:
            - call: "POST /esa/program-years"
              payload: { label: "2026-27", residency_state: "TX", total_seats: 2, window_open_at: "2026-08-15T00:00:00Z", window_close_at: "2026-09-30T23:59:59Z", term_start_date: "2026-08-01", term_end_date: "2027-06-30", base_award_cents: 731500, rollover_cap_pct: 0.25, admin_fee_pct: 0.0175, acceptance_deadline_days: 14, min_assessment_percentile: 40, min_portfolio_artifacts: 6 }
              as: ProgramAdmin
              captures: { py_id: $.data.id }
            - call: "POST /esa/program-years/${py_id}/open-window"
              payload: {}
              as: ProgramAdmin
            - call: "POST /esa/students"
              payload: { household_id: "HH-1", first_name: "Ana", last_name: "Reyes", date_of_birth: "2014-04-02", residency_state: "TX", prior_enrollment: "PUBLIC_SCHOOL_FULL_YEAR", income_band: "BAND_B", category_flags: ["DISABILITY_IEP"], has_enrolled_sibling: false }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /esa/applications"
              payload: { program_year_id: "${py_id}", student_id: "${s1_id}", claimed_income_band: "BAND_B", claimed_category_flags: ["DISABILITY_IEP"] }
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { a1_id: $.data.id }
            - call: "POST /esa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /esa/applications/${a1_id}/submit"
              payload: {}
              as: Guardian
              as_user_id: "${s1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_APPLICATION_WINDOW_CLOSED"
            - "Application.${a1_id}.status == DRAFT with submitted_at null and provisional_award_cents null"

      - name: resubmitting_a_submitted_application_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - errors.ERR_INVALID_STATE_TRANSITION
          - validations[priority=20]
        distinguishing_aspect: "The second submit is not a silent no-op: it returns 409 ERR_INVALID_STATE_TRANSITION and submitted_at keeps its original 2026-09-01 value instead of being re-stamped."
