  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: restricted_kind_selectivity_employee_only_vs_client_only
        claim_type: conditional_validation
        grounds: ["validations[priority=15]", "entities.RestrictedListEntry.fields.restriction_kind"]
        distinguishing_aspect: "The same ERR_SYMBOL_RESTRICTED gate is conditional on kind: EMPLOYEE_ONLY blocks preclearance but not client routing; CLIENT_ONLY blocks routing but not preclearance."
        test_recipe:
          setup: ["ACTIVE entries: ACME EMPLOYEE_ONLY, BETA CLIENT_ONLY (both flipped by ops run); employee ACTIVE/CURRENT; venue + ACTIVE arrangement"]
          setup_api_calls:
            - { call: "POST /surveillance/employees", payload: { full_name: "Kind Select", employee_ref: "EMP-160", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "ACME", restriction_kind: "EMPLOYEE_ONLY", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/restricted-list-entries", payload: { symbol: "BETA", restriction_kind: "CLIENT_ONLY", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/ops/runs", payload: {}, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_acme: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "BETA", side: "BUY", quantity: 10 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { t_beta: "$.data.id" } }
            - { call: "POST /surveillance/orders", payload: { client_ref: "K1", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_acme: "$.data.id" } }
            - { call: "POST /surveillance/orders", payload: { client_ref: "K2", symbol: "BETA", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_beta: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/personal-trades/${t_acme}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err_emp: "$.data.error_id" } }
            - { call: "POST /surveillance/personal-trades/${t_beta}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { t_beta_status: "$.data.status" } }
            - { call: "POST /surveillance/orders/${o_acme}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin, captures: { o_acme_status: "$.data.status" } }
            - { call: "POST /surveillance/orders/${o_beta}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin, captures: { err_cli: "$.data.error_id" } }
          assert:
            - "EMPLOYEE_ONLY blocks preclearance: ${err_emp} == ERR_SYMBOL_RESTRICTED"
            - "EMPLOYEE_ONLY does NOT block client routing: ${o_acme_status} == ROUTED"
            - "CLIENT_ONLY does NOT block preclearance: ${t_beta_status} == APPROVED"
            - "CLIENT_ONLY blocks client routing: ${err_cli} == ERR_SYMBOL_RESTRICTED"
      - name: min_holding_period_exactly_30_days_boundary
        claim_type: temporal_validation
        grounds: ["validations[priority=16]", "errors[ERR_MIN_HOLDING_PERIOD]"]
        distinguishing_aspect: "SELL approval one second before 30*86400s after the reconciled BUY execution is rejected; exactly 30*86400s after is allowed (boundary exclusive)."
        test_recipe:
          setup: ["Employee with RECONCILED BUY ACME executed_at 2026-08-01T12:00:00Z; SELL preclearance requested"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/employees", payload: { full_name: "Hold Period", employee_ref: "EMP-170", department: "TRADING", attestation_due_at: "2027-01-01T00:00:00Z" }, as: ComplianceAdmin, captures: { e_id: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "BUY", quantity: 50 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { tb: "$.data.id" } }
            - { call: "POST /surveillance/personal-trades/${tb}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades/${tb}/transition", payload: { to_status: "EXECUTION_REPORTED", executed_price_cents: 10000, executed_at: "2026-08-01T12:00:00Z" }, as: CoveredEmployee, as_user_id: "${e_id}" }
            - { call: "POST /surveillance/personal-trades/${tb}/transition", payload: { to_status: "RECONCILED" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/personal-trades", payload: { symbol: "ACME", side: "SELL", quantity: 50 }, as: CoveredEmployee, as_user_id: "${e_id}", captures: { ts: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T11:59:59Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/personal-trades/${ts}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/personal-trades/${ts}/transition", payload: { to_status: "APPROVED" }, as: ComplianceAdmin, captures: { ts_status: "$.data.status" } }
          assert:
            - "29 days 23:59:59 after the BUY execution: ${err} == ERR_MIN_HOLDING_PERIOD"
            - "Exactly 30*86400s after: ${ts_status} == APPROVED"
      - name: route_before_arrangement_window_opens_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=21]", "errors[ERR_NO_ACTIVE_ARRANGEMENT]"]
        distinguishing_aspect: "An arrangement can be ACTIVE while its window lies in the future (activation only requires effective_to > now), but ROUTING requires now inside the half-open window."
        test_recipe:
          setup: ["Venue ACTIVE; arrangement window [2026-08-10, 2026-09-01) activated at clock 2026-08-05 (future window); order RECEIVED"]
          setup_api_calls:
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin, captures: { a_status: "$.data.status" } }
            - { call: "POST /surveillance/orders", payload: { client_ref: "W9", symbol: "ACME", side: "BUY", quantity: 10, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "Activation with a future window succeeded: ${a_status} == ACTIVE"
            - "Routing before the window opens: ${err} == ERR_NO_ACTIVE_ARRANGEMENT"
      - name: review_submit_requires_locked_snapshots_and_complete_decisions
        claim_type: aggregate_validation
        grounds: ["validations[priority=23]", "validations[priority=26]", "errors[ERR_SNAPSHOT_NOT_LOCKED]", "errors[ERR_INCOMPLETE_VENUE_DECISIONS]"]
        distinguishing_aspect: "Two aggregate gates at submit: referenced evidence must be LOCKED (any PROVISIONAL fails) and the decision set must cover every ACTIVE venue exactly once."
        test_recipe:
          setup: ["Two ACTIVE venues NYSE + ARCA; snapshot for NYSE still PROVISIONAL"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v1: "$.data.id" } }
            - { call: "POST /surveillance/venues", payload: { venue_code: "ARCA", name: "NYSE Arca", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v2: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v1}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { snap: "$.data.id" } }
            - { call: "POST /surveillance/best-ex-reviews", payload: { quarter: "2026-Q3", snapshot_ids: [ "${snap}" ], venue_decisions: [ { venue_id: "${v1}", determination: "CONTINUE" }, { venue_id: "${v2}", determination: "MODIFY" } ] }, as: BestExAnalyst, as_user_id: "ba-1", captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "IN_COMMITTEE" }, as: BestExAnalyst, as_user_id: "ba-1", captures: { err1: "$.data.error_id" } }
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "IN_COMMITTEE" }, as: BestExAnalyst, as_user_id: "ba-1", captures: { r_status: "$.data.status" } }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "DRAFT" }, as: CommitteeMember, as_user_id: "cm-9" }
            - { call: "POST /surveillance/best-ex-reviews", payload: { quarter: "2026-Q3", snapshot_ids: [ "${snap}" ], venue_decisions: [ { venue_id: "${v1}", determination: "CONTINUE" } ] }, as: BestExAnalyst, as_user_id: "ba-1", captures: { r2: "$.data.id" } }
            - { call: "POST /surveillance/best-ex-reviews/${r2}/transition", payload: { to_status: "IN_COMMITTEE" }, as: BestExAnalyst, as_user_id: "ba-1", captures: { err2: "$.data.error_id" } }
          assert:
            - "PROVISIONAL evidence: ${err1} == ERR_SNAPSHOT_NOT_LOCKED"
            - "After lock the same review submits: ${r_status} == IN_COMMITTEE"
            - "Decision set missing ACTIVE venue ARCA: ${err2} == ERR_INCOMPLETE_VENUE_DECISIONS"
      - name: review_publish_requires_published_disclosure
        claim_type: cross_entity_validation
        grounds: ["validations[priority=24]", "errors[ERR_DISCLOSURE_NOT_PUBLISHED]"]
        distinguishing_aspect: "Cross-entity pair BestExReview -> PfofDisclosure: an APPROVED review cannot publish while no PUBLISHED disclosure exists for its quarter."
        test_recipe:
          setup: ["Venue ACTIVE; LOCKED snapshot; review APPROVED (3 votes); NO disclosure created for 2026-Q3"]
          setup_api_calls:
            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots", payload: { venue_id: "${v_id}", order_type: "MARKET", period_month: "2026-08", variant: "FAR_TOUCH" }, as: ComplianceAdmin, captures: { snap: "$.data.id" } }
            - { call: "POST /surveillance/execution-quality-snapshots/${snap}/lock", payload: {}, as: ComplianceAdmin }
            - { call: "POST /surveillance/best-ex-reviews", payload: { quarter: "2026-Q3", snapshot_ids: [ "${snap}" ], venue_decisions: [ { venue_id: "${v_id}", determination: "CONTINUE" } ] }, as: BestExAnalyst, as_user_id: "ba-1", captures: { r_id: "$.data.id" } }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "IN_COMMITTEE" }, as: BestExAnalyst, as_user_id: "ba-1" }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/vote", payload: {}, as: CommitteeMember, as_user_id: "cm-1" }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/vote", payload: {}, as: CommitteeMember, as_user_id: "cm-2" }
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/vote", payload: {}, as: CommitteeMember, as_user_id: "cm-3" }
          trigger:
            - { call: "POST /surveillance/best-ex-reviews/${r_id}/transition", payload: { to_status: "PUBLISHED" }, as: BestExAnalyst, as_user_id: "ba-1", captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_DISCLOSURE_NOT_PUBLISHED and review stays APPROVED"
      - name: disclosure_submit_blocked_by_uncovered_volume
        claim_type: cross_entity_validation
        grounds: ["validations[priority=22]", "errors[ERR_UNCOVERED_VOLUME]"]
        distinguishing_aspect: "An order routed inside its arrangement window but EXECUTED after the window closed has no covering arrangement at executed_at; submit must fail until coverage is restored."
        test_recipe:
          setup: ["Arrangement window [2026-08-01, 2026-08-20); order routed 2026-08-19, executed 2026-08-21T10:00:00Z"]
          setup_api_calls:
