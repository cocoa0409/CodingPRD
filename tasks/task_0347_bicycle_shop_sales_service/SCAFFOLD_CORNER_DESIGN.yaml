scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_sku_returns_201_with_all_fields
        claim_type: Creation
        grounds: ["entities.Sku", "endpoints"]
        distinguishing_aspect: "POST /shop/skus with all required fields returns 201 and a Sku whose reserved==0, version==1, and id is a server-minted UUID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/skus"
              payload: { name: "Chain", category: "PART", list_price_cents: 2500, on_hand: 7 }
              as: ShopManager
              captures: { sku_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Sku.${sku_id}.reserved == 0"
            - "Sku.${sku_id}.version == 1"
            - "Sku.${sku_id}.on_hand == 7"

      - name: get_sku_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Sku", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /shop/skus/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shop/skus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_sku_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Sku.fields.category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shop/skus missing the required category field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/skus"
              payload: { name: "No Category", list_price_cents: 1000 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_sku_invalid_enum_category_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Sku.fields.category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /shop/skus with category='GADGET' (not in {BIKE,PART,ACCESSORY}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/skus"
              payload: { name: "Bad Enum", category: "GADGET", list_price_cents: 1000 }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_sku_default_on_hand_zero_warranty_none
        claim_type: Defaults
        grounds: ["entities.Sku.fields.on_hand", "entities.Sku.fields.warranty_class"]
        distinguishing_aspect: "Omitting on_hand and warranty_class applies defaults on_hand=0 and warranty_class=NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/skus"
              payload: { name: "Defaults Sku", category: "ACCESSORY", list_price_cents: 3000 }
              as: ShopManager
              captures: { sku_id: $.data.id }
          assert:
            - "Sku.${sku_id}.on_hand == 0"
            - "Sku.${sku_id}.warranty_class == NONE"

      - name: create_customer_system_fields_generated
        claim_type: System Fields
        grounds: ["entities.Customer", "entities.Customer.fields.store_credit_cents"]
        distinguishing_aspect: "POST /shop/customers ignores any client-supplied id/store_credit_cents; server mints id and sets store_credit_cents=0, open_recall_count=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /shop/customers"
              payload: { full_name: "Sys Field", email: "sys@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.store_credit_cents == 0"
            - "Customer.${cust_id}.open_recall_count == 0"
            - "Customer.${cust_id}.version == 1"

      - name: order_line_unit_price_snapshot_ignores_input
        claim_type: Computed Fields
        grounds: ["entities.OrderLine.fields.unit_price_cents", "endpoints"]
        distinguishing_aspect: "OrderLine.unit_price_cents is computed as a snapshot of Sku.list_price_cents (8000) at create; any client value is ignored and the field equals the Sku price."
        test_recipe:
          setup: ["A Sku priced 8000; a PENDING order."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Snap Shot", email: "snap@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Grip Set", category: "PART", list_price_cents: 8000, on_hand: 5 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
          assert:
            - "OrderLine.${line_id}.unit_price_cents == 8000"

      - name: list_skus_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Sku", "endpoints"]
        distinguishing_aspect: "GET /shop/skus returns an array response_type with pagination fields total_count and has_more in meta/envelope; limit=1 over 2 skus yields has_more=true."
        test_recipe:
          setup: ["Two skus exist."]
          setup_api_calls:
            - call: "POST /shop/skus"
              payload: { name: "Sku A", category: "PART", list_price_cents: 1000, on_hand: 1 }
              as: ShopManager
            - call: "POST /shop/skus"
              payload: { name: "Sku B", category: "PART", list_price_cents: 1000, on_hand: 1 }
              as: ShopManager
          trigger:
            - call: "GET /shop/skus?limit=1&offset=0"
              payload: {}
              as: ShopManager
          assert:
            - "response.response_type == array"
            - "response.total_count == 2"
            - "response.has_more == true"

      - name: list_skus_invalid_pagination_returns_400
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_PAGINATION]"]
        distinguishing_aspect: "GET /shop/skus?limit=0 violates the limit>=1 bound and returns ERR_INVALID_PAGINATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /shop/skus?limit=0"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_PAGINATION"

      - name: duplicate_customer_email_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Creating a second customer with the same email (case-insensitive) returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "First", email: "dup@x.com" }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/customers"
              payload: { full_name: "Second", email: "DUP@x.com" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: recall_notice_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.RecallNotice"]
        distinguishing_aspect: "RecallNotice has common_fields:false — its create response carries id and created_at but no version field and there is no update endpoint."
        test_recipe:
          setup: ["A Sku exists."]
          setup_api_calls:
            - call: "POST /shop/skus"
              payload: { name: "Recalled Bike", category: "BIKE", list_price_cents: 50000, on_hand: 2 }
              as: ShopManager
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /shop/recall-notices"
              payload: { sku_id: "${sku_id}", severity: "ADVISORY", remedy: "Inspect fork" }
              as: ShopManager
              captures: { rn_id: $.data.id }
          assert:
            - "response.status == 201"
            - "RecallNotice.${rn_id}.sku_id == ${sku_id}"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: ticket_initial_state_is_intake
        claim_type: Initial State
        grounds: ["state_machines.ServiceTicket", "entities.ServiceTicket.fields.status"]
        distinguishing_aspect: "A freshly created ServiceTicket has status==INTAKE before any transition."
        test_recipe:
          setup: ["A tier exists."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Init Tial", email: "init@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
          trigger:
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
          assert:
            - "ServiceTicket.${ticket_id}.status == INTAKE"

      - name: approve_ticket_from_intake_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.ServiceTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a ticket still in INTAKE (no quote yet) is not a defined transition and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A ticket in INTAKE owned by the customer."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Inv State", email: "inv@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: cancel_closed_ticket_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.ServiceTicket", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLOSED ticket is terminal: cancel returns ERR_INVALID_STATE (409) and the ticket stays CLOSED."
        test_recipe:
          setup: ["A paid ticket driven to CLOSED."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Term Inal", email: "term@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
            - call: "POST /shop/service-tickets/${ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${ticket_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shop/service-tickets/${ticket_id}/complete"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/service-tickets/${ticket_id}/close"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/service-tickets/${ticket_id}/cancel"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ServiceTicket.${ticket_id}.status == CLOSED"

      - name: special_order_confirm_without_deposit_invalid_or_deposit_short
        claim_type: Precondition Enforcement
        grounds: ["state_machines.SpecialOrder.QUOTED_to_CONFIRMED", "validations[priority=15]", "errors[ERR_DEPOSIT_SHORT]"]
        distinguishing_aspect: "Confirming a QUOTED special order with deposit_paid_cents (0) < deposit_required_cents fails with ERR_DEPOSIT_SHORT (409)."
        test_recipe:
          setup: ["A special order in QUOTED with no deposit paid (Sku price 60000 -> deposit_required 18000)."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Dep Short", email: "dep@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Special Wheel", category: "PART", list_price_cents: 60000, on_hand: 0 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /shop/special-orders"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /shop/special-orders/${so_id}/confirm"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DEPOSIT_SHORT"

      - name: layaway_fulfill_not_paid_off
        claim_type: Precondition Enforcement
        grounds: ["state_machines.LayawayPlan.ACTIVE_to_FULFILLED", "validations[priority=16]", "errors[ERR_LAYAWAY_NOT_PAID_OFF]"]
        distinguishing_aspect: "Fulfilling an ACTIVE layaway whose deposit_cents (15000) < price_cents (40000) fails with ERR_LAYAWAY_NOT_PAID_OFF (409)."
        test_recipe:
          setup: ["An ACTIVE layaway plan, price 40000, deposit 15000."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Not PaidOff", email: "npo@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Layaway Bike", category: "BIKE", list_price_cents: 40000, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/layaway-plans"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1, expected_sku_version: "${sku_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /shop/payments"
              payload: { target_type: "LAYAWAY_PLAN", target_id: "${plan_id}", amount_cents: 15000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/layaway-plans/${plan_id}/fulfill"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_LAYAWAY_NOT_PAID_OFF"

      - name: build_mark_parts_reserved_before_ready
        claim_type: Precondition Enforcement
        grounds: ["state_machines.BuildJob.DRAFT_to_PARTS_RESERVED", "validations[priority=11]", "errors[ERR_BUILD_NOT_READY]"]
        distinguishing_aspect: "Marking parts reserved on a DRAFT build with reserved_part_count (0) < required_part_count (2) fails with ERR_BUILD_NOT_READY (409)."
        test_recipe:
          setup: ["A DRAFT build with required_part_count 2 and no part reservations."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Not Ready", email: "nr@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Build Frame", category: "BIKE", list_price_cents: 50000, on_hand: 2 }
              as: ShopManager
              captures: { frame_id: $.data.id }
            - call: "POST /shop/build-jobs"
              payload: { customer_id: "${cust_id}", frame_sku_id: "${frame_id}", required_part_count: 2 }
              as: ServiceAdvisor
              captures: { build_id: $.data.id }
          trigger:
            - call: "POST /shop/build-jobs/${build_id}/mark-parts-reserved"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BUILD_NOT_READY"

      - name: build_cancel_releases_reservations_compensation
        claim_type: Compensation
        grounds: ["state_machines.BuildJob.DRAFT_to_CANCELLED", "calculations.sku_available_units", "entities.Sku.fields.reserved"]
        distinguishing_aspect: "Cancelling a DRAFT build with one frame + one part reservation releases both: the frame Sku.reserved returns to 0 and the part Sku.reserved returns to 0 (compensation, no drift)."
        test_recipe:
          setup: ["A DRAFT build with a frame reservation and one part reservation."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Comp Ensate", email: "comp@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Comp Frame", category: "BIKE", list_price_cents: 50000, on_hand: 2 }
              as: ShopManager
              captures: { frame_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Comp Part", category: "PART", list_price_cents: 1000, on_hand: 5 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /shop/build-jobs"
              payload: { customer_id: "${cust_id}", frame_sku_id: "${frame_id}", required_part_count: 1 }
              as: ServiceAdvisor
              captures: { build_id: $.data.id }
            - call: "POST /shop/build-jobs/${build_id}/reserve-frame"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/build-jobs/${build_id}/cancel"
              payload: {}
              as: ServiceAdvisor
              captures: { st: $.data.status }
          assert:
            - "BuildJob.${build_id}.status == CANCELLED"
            - "Sku.${frame_id}.reserved == 0"
            - "Sku.${part_id}.reserved == 0"

      - name: special_order_receive_bubbles_stock_and_reservation
        claim_type: Cross-entity
        grounds: ["state_machines.SpecialOrder.CONFIRMED_to_ARRIVED", "calculations.sku_available_units", "entities.Sku.fields.on_hand"]
        distinguishing_aspect: "Receiving a CONFIRMED special order (qty 1) raises the Sku.on_hand by 1 (0->1) and creates an ACTIVE reservation so reserved becomes 1, leaving available 0."
        test_recipe:
          setup: ["A CONFIRMED special order for a Sku with on_hand 0, deposit paid in full (price 60000 -> deposit 18000)."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Rec Eive", email: "rec@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Imported Frame", category: "BIKE", list_price_cents: 60000, on_hand: 0 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /shop/special-orders"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /shop/payments"
              payload: { target_type: "SPECIAL_ORDER", target_id: "${so_id}", amount_cents: 18000 }
              as: SalesAssociate
            - call: "POST /shop/special-orders/${so_id}/confirm"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /shop/special-orders/${so_id}/receive"
              payload: {}
              as: SalesAssociate
              captures: { st: $.data.status }
          assert:
            - "SpecialOrder.${so_id}.status == ARRIVED"
            - "Sku.${sku_id}.on_hand == 1"
            - "Sku.${sku_id}.reserved == 1"

      - name: tradein_reject_terminal
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.TradeIn.APPRAISED_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A REJECTED trade-in is terminal: a subsequent accept returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A trade-in rejected from APPRAISED."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Trade Reject", email: "tr@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${cust_id}", description: "Rusty", condition_grade: "C", appraised_value_cents: 10000 }
              as: SalesAssociate
              captures: { ti_id: $.data.id }
            - call: "POST /shop/trade-ins/${ti_id}/reject"
              payload: {}
              as: ShopManager
          trigger:
            - call: "POST /shop/trade-ins/${ti_id}/accept"
              payload: {}
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TradeIn.${ti_id}.status == REJECTED"

      - name: bay_booking_release_then_rebook_invalid_state
        claim_type: Idempotency
        grounds: ["state_machines.BayBooking.BOOKED_to_RELEASED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Releasing an already-RELEASED booking a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A bay booking released once."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Bay Rel", email: "bayrel@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}" }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
            - call: "POST /shop/service-bays"
              payload: { name: "Bay 2" }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /shop/bay-bookings"
              payload: { bay_id: "${bay_id}", ticket_id: "${ticket_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:00:00Z" }
              as: ServiceAdvisor
              captures: { booking_id: $.data.id }
            - call: "POST /shop/bay-bookings/${booking_id}/release"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/bay-bookings/${booking_id}/release"
              payload: {}
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: service_ticket_cycle_already_in_18
        claim_type: cyclic
        grounds: ["state_machines.ServiceTicket.IN_PROGRESS_to_AWAITING_APPROVAL"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / service_ticket_revision_cycle
          rationale: "The IN_PROGRESS<->AWAITING_APPROVAL cycle and revision_count are exercised by the named §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: ticket_quote_rush_surcharge_and_turnaround
        claim_type: Correct Result
        grounds: ["calculations.ticket_quote", "entities.ServiceTicket.fields.labor_subtotal_cents"]
        distinguishing_aspect: "A rush ticket on a BASIC tier (base 8000, +50%, 5h) computes labor_subtotal_cents=12000 from the rushed base alone (no labor lines) and promised_ready_at = current_utc + ceil(5/2)=3h."
        test_recipe:
          setup: ["Clock set to 2026-06-14T00:00:00Z; a BASIC tier; a rush ticket with no labor lines, quoted."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: ShopManager
            - call: "POST /shop/customers"
              payload: { full_name: "Rush Tick", email: "rush@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/tune-up-tiers"
              payload: { code: "BASIC", base_labor_cents: 8000, turnaround_hours: 5 }
              as: ShopManager
              captures: { tier_id: $.data.id }
            - call: "POST /shop/service-tickets"
              payload: { customer_id: "${cust_id}", tier_id: "${tier_id}", is_rush: true }
              as: ServiceAdvisor
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /shop/service-tickets/${ticket_id}/quote"
              payload: {}
              as: ServiceAdvisor
              captures: { labor: $.data.labor_subtotal_cents, prom: $.data.promised_ready_at }
          assert:
            - "ServiceTicket.${ticket_id}.labor_subtotal_cents == 12000"
            - "ServiceTicket.${ticket_id}.customer_owes_cents == 12000"
            - "ServiceTicket.${ticket_id}.promised_ready_at == 2026-06-14T03:00:00.000Z"

      - name: tradein_offer_grade_b_with_handling
        claim_type: Correct Result
        grounds: ["calculations.tradein_offer", "entities.TradeIn.fields.offer_cents", "entities.Customer.fields.store_credit_cents"]
        distinguishing_aspect: "Accepting a grade-B trade-in appraised 100000 yields offer_cents = round_half_up(100000*0.70) - 1500 = 70000 - 1500 = 68500, credited to store_credit_cents."
        test_recipe:
          setup: ["A grade-B trade-in appraised 100000, apply_to STORE_CREDIT, in APPRAISED."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Grade B", email: "gb@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${cust_id}", description: "Good condition road bike", condition_grade: "B", appraised_value_cents: 100000, apply_to: "STORE_CREDIT" }
              as: SalesAssociate
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /shop/trade-ins/${ti_id}/accept"
              payload: {}
              as: ShopManager
              captures: { offer: $.data.offer_cents }
          assert:
            - "TradeIn.${ti_id}.offer_cents == 68500"
            - "Customer.${cust_id}.store_credit_cents == 68500"

      - name: tradein_offer_floor_at_zero
        claim_type: Constants Applied
        grounds: ["calculations.tradein_offer", "entities.TradeIn.fields.offer_cents"]
        distinguishing_aspect: "A grade-C trade-in appraised 1000 yields after_haircut=500, minus HANDLING 1500 = -1000, floored to offer_cents=0; no negative credit."
        test_recipe:
          setup: ["A grade-C trade-in appraised 1000, apply_to CASH, in APPRAISED."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Zero Floor", email: "zf@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${cust_id}", description: "Junk", condition_grade: "C", appraised_value_cents: 1000, apply_to: "CASH" }
              as: SalesAssociate
              captures: { ti_id: $.data.id }
          trigger:
            - call: "POST /shop/trade-ins/${ti_id}/accept"
              payload: {}
              as: ShopManager
              captures: { offer: $.data.offer_cents }
          assert:
            - "TradeIn.${ti_id}.offer_cents == 0"
            - "Customer.${cust_id}.store_credit_cents == 0"

      - name: special_order_deposit_min_floor_applies
        claim_type: Constants Applied
        grounds: ["calculations.special_order_deposit", "entities.SpecialOrder.fields.deposit_required_cents"]
        distinguishing_aspect: "For a Sku priced 10000 qty 1, 30% = 3000 is below DEPOSIT_MIN 5000, so the floor pins deposit_required_cents=5000 (distinct from the cap case in §1.8)."
        test_recipe:
          setup: ["A Sku priced 10000."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Min Floor", email: "mf@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Mid Part", category: "PART", list_price_cents: 10000, on_hand: 0 }
              as: ShopManager
              captures: { sku_id: $.data.id }
          trigger:
            - call: "POST /shop/special-orders"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
              captures: { dep: $.data.deposit_required_cents }
          assert:
            - "SpecialOrder.deposit_required_cents == 5000"

      - name: order_total_partial_payment_status
        claim_type: Correct Result
        grounds: ["calculations.order_total", "entities.SalesOrder.fields.amount_paid_cents", "entities.SalesOrder.fields.payment_status"]
        distinguishing_aspect: "An order with subtotal 30000 paid 10000 has amount_paid_cents=10000 and payment_status=PARTIALLY_PAID; a further 20000 flips it to PAID."
        test_recipe:
          setup: ["A PENDING order with one line subtotal 30000."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Part Pay", email: "pp@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Wheelset", category: "PART", list_price_cents: 30000, on_hand: 4 }
              as: ShopManager
              captures: { sku_id: $.data.id }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 10000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 20000 }
              as: SalesAssociate
          assert:
            - "SalesOrder.${ord_id}.amount_paid_cents == 30000"
            - "SalesOrder.${ord_id}.payment_status == PAID"

      - name: build_fee_base_band_one_part
        claim_type: tiered_pricing
        grounds: ["calculations.build_fee"]
        distinguishing_aspect: "A build with required_part_count=1 charges base 5000 + 1*1200 = 6200 (single tier-1 part), a band boundary distinct from the 8-part case in §1.8."
        test_recipe:
          setup: ["A build with required_part_count=1, frame + 1 part reserved, advanced to ASSEMBLING."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "One Part", email: "op@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Small Frame", category: "BIKE", list_price_cents: 40000, on_hand: 2 }
              as: ShopManager
              captures: { frame_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "One Part Sku", category: "PART", list_price_cents: 1000, on_hand: 5 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /shop/build-jobs"
              payload: { customer_id: "${cust_id}", frame_sku_id: "${frame_id}", required_part_count: 1 }
              as: ServiceAdvisor
              captures: { build_id: $.data.id }
            - call: "POST /shop/build-jobs/${build_id}/reserve-frame"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/reserve-part"
              payload: { sku_id: "${part_id}", qty: 1 }
              as: ServiceAdvisor
            - call: "POST /shop/build-jobs/${build_id}/mark-parts-reserved"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /shop/build-jobs/${build_id}/start"
              payload: {}
              as: ServiceAdvisor
              captures: { fee: $.data.build_fee_cents }
          assert:
            - "BuildJob.${build_id}.build_fee_cents == 6200"

      - name: customer_open_recall_count_derived
        claim_type: Correct Result
        grounds: ["calculations.customer_open_recall_count", "entities.Customer.fields.open_recall_count"]
        distinguishing_aspect: "A customer who has a DELIVERED purchase of a Sku that then gets a RecallNotice has open_recall_count==1; after acknowledging it the count returns to 0."
        test_recipe:
          setup: ["A delivered purchase of a Sku; a recall notice published on that Sku."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Recall Holder", email: "rh@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Recalled Part", category: "PART", list_price_cents: 5000, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { ord_id: $.data.id }
            - call: "POST /shop/order-lines"
              payload: { order_id: "${ord_id}", sku_id: "${sku_id}", qty: 1 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/reserve"
              payload: { expected_sku_version: "${sku_v}" }
              as: SalesAssociate
            - call: "POST /shop/payments"
              payload: { target_type: "SALES_ORDER", target_id: "${ord_id}", amount_cents: 5000 }
              as: SalesAssociate
            - call: "POST /shop/sales-orders/${ord_id}/deliver"
              payload: {}
              as: SalesAssociate
            - call: "POST /shop/recall-notices"
              payload: { sku_id: "${sku_id}", severity: "ADVISORY", remedy: "Replace part" }
              as: ShopManager
              captures: { rn_id: $.data.id }
          trigger:
            - call: "GET /shop/customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { orc: $.data.open_recall_count }
          assert:
            - "Customer.${cust_id}.open_recall_count == 1"

      - name: layaway_forfeit_floor_dominates
        claim_type: Correct Result
        grounds: ["calculations.layaway_settlement", "entities.LayawayPlan.fields.forfeit_fee_cents"]
        distinguishing_aspect: "Forfeiting a plan price 10000 deposit 8000: 15% = 1500 is below FORFEIT_FLOOR 2000, so forfeit_fee_cents=2000 and refund_cents=6000 (floor dominates, distinct from the percentage case in §1.8)."
        test_recipe:
          setup: ["An ACTIVE layaway plan, price 10000, deposit 8000."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Floor Dom", email: "fd@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /shop/skus"
              payload: { name: "Cheap Bike", category: "BIKE", list_price_cents: 10000, on_hand: 3 }
              as: ShopManager
              captures: { sku_id: $.data.id, sku_v: $.data.version }
            - call: "POST /shop/layaway-plans"
              payload: { customer_id: "${cust_id}", sku_id: "${sku_id}", qty: 1, expected_sku_version: "${sku_v}" }
              as: SalesAssociate
              captures: { plan_id: $.data.id }
            - call: "POST /shop/payments"
              payload: { target_type: "LAYAWAY_PLAN", target_id: "${plan_id}", amount_cents: 8000 }
              as: SalesAssociate
          trigger:
            - call: "POST /shop/layaway-plans/${plan_id}/forfeit"
              payload: {}
              as: ShopManager
              captures: { fee: $.data.forfeit_fee_cents }
          assert:
            - "LayawayPlan.${plan_id}.forfeit_fee_cents == 2000"
            - "LayawayPlan.${plan_id}.refund_cents == 6000"
            - "Customer.${cust_id}.store_credit_cents == 6000"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: frame_sku_not_bike_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_FRAME_NOT_BIKE]"]
        distinguishing_aspect: "Creating a BuildJob whose frame_sku_id points at a PART (not BIKE) returns ERR_FRAME_NOT_BIKE (409)."
        test_recipe:
          setup: ["A PART Sku exists."]
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { full_name: "Frame Bad", email: "fb@x.com" }
