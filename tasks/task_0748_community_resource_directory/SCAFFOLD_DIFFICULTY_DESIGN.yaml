            - "Same moment: Program.${prog6_id}.intake_posture == RESTRICTED (dimension 1 is 4 slots / 5 = 0.80 — unchanged by the report)"
            - "The two posture dimensions moved on independent triggers — parallel state axes confirmed"

  # =========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers; depth 3 and depth 2)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_revoke_cascades_referral_withdraw_and_transport_cancel_depth_3
        grounds:
          - state_machines.ConsentGrant.GRANTED_to_REVOKED
          - state_machines.Referral.ACCEPTED_to_WITHDRAWN
          - state_machines.TransportPlan.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Trigger: POST /consent-grants/{id}/revoke. Depth-3 cascade — Link 1 revokes the
          consent, Link 2 (caused by Link 1) withdraws every in-flight Referral bound to
          this consent, Link 3 (caused by Link 2's ACCEPTED→WITHDRAWN) cancels the SCHEDULED
          TransportPlan hanging off that Referral. Each link is caused by the previous link,
          not by the original human action.
        test_recipe:
          setup:
            - "clock 2026-06-01T00:00:00Z"
            - "Funder F7, Provider P7, Program PROG7 (capacity=5), Client C7, Intake I7 SCREENED, Consent CG7 GRANTED"
            - "Referral R7 ACCEPTED"
            - "TransportPlan TP7 SCHEDULED for R7"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F7", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
