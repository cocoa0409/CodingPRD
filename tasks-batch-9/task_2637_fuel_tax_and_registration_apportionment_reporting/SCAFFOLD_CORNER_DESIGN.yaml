          - errors[ERR_NO_FILED_RETURN_FOR_PERIOD]
        distinguishing_aspect: "A carrier with no prepared return at all still scores: ratio 300.0/1000.0 = 0.3000 saturates the ratio weight at 40, the null fleet_mpg contributes 0 rather than saturating, 2 late filings add 10 and 4 deficiencies add 20, giving exactly 70 — SELECTED at the inclusive threshold. retention-review then fails at priority 36 with ERR_NO_FILED_RETURN_FOR_PERIOD 409 because the quarter was never filed."
