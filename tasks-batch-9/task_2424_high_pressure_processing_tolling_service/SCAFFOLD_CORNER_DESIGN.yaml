            - { call: "POST /chargeback-lines/${cb_id}/waive", payload: { waive_reason: "goodwill credit for first offence" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /chargeback-lines/${cb_id}/waive", payload: { waive_reason: "duplicate goodwill request" }, as: FacilityAdmin, captures: { e_cbstate: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_CHARGEBACK_STATE"
            - "ChargebackLine.${cb_id}.status == WAIVED with amount_cents still 6788 and waive_reason == goodwill credit for first offence"
            - "Customer.${cust_id}.chargeback_balance_cents == 0"

      - name: corner_release_before_the_cycle_is_dispositioned_is_refused
        claim_type: Triggerable
        grounds:
          - errors[ERR_CYCLE_NOT_DISPOSITIONED]
          - validations.p8[POST /lots/{id}/release-decision -> ERR_CYCLE_NOT_DISPOSITIONED]
        distinguishing_aspect: "Quality cannot release ahead of the money: with C1 only COMPLETED_CLEAN and no open deviation to blame, the release is refused specifically because the parent cycle has not reached DISPOSITIONED."
        test_recipe:
          setup:
            - "the standard world; C1 is COMPLETED_CLEAN, PAL-001 is TREATED and NOT_RELEASED, and no Deviation exists"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
