            - "WorkSession.${ws_id}.attendance_status == SCHEDULED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rto_participant_rest_buffer_violation
        grounds:
          - calculations.participant_rest_buffer
          - validations[priority=14]
          - entities.WorkSession.fields.participant_id
        distinguishing_aspect: "Participant resource, buffered pairwise semantics: a second session starting 30 min after the first ends (gap 30 < REST_BUFFER_MINUTES 60) is rejected ERR_SESSION_OVERLAP even though the clock intervals do not overlap."
        test_recipe:
          setup:
            - "Capacity-5 site; ACTIVE placement; existing session 09:00-11:00; candidate session 11:30-12:30 for the same participant (gap 30 min)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1" }
            - { call: "POST /sites", payload: { name: "Green Park", agency_type: "NONPROFIT", address: "1 Main St", capacity_slots: 5 }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { site_id: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { site_id: "${site_id}", carrier: "Acme", coverage_amount_cents: 1000000, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { pol_id: "$.data.id" } }
