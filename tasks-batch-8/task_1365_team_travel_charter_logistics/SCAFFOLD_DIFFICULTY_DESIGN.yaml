              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem"
              payload: { service_date: "2027-01-20", day_kind: "GAME_DAY", meals_provided_count: 0 }
              as: TravelFinanceLead
              captures: { ledger_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/scratch"
              payload: {}
              as: TravelManager
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem/${ledger_id}/approve"
              payload: {}
              as: TravelFinanceLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MEMBER_NOT_IN"
