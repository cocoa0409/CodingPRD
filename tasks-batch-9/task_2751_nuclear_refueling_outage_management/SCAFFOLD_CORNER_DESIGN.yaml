            - "${clpa_status_mid} == SUPERSEDED — creating CLP-B retired the live DRAFT CLP-A"
            - "${clpb_status_mid} == APPROVED with reactivity_margin_pcm == 1586.00 and approved_by_user_id == \"re-beta\""
            - "${clpb_status_after_create} == APPROVED — creating CLP-C does NOT retire an APPROVED pattern"
            - "CoreLoadPattern.${clpc_id}.status == APPROVED and CoreLoadPattern.${clpb_id}.status == SUPERSEDED after the final approve"
            - "GET /outages/${o_id}/core-load-patterns?status=APPROVED returns exactly 1 row, ${clpc_id} — an outage never holds two approved reload designs"

      - name: work_order_revision_loop_returns_an_approved_order_to_planning
        claim_type: cyclic
        grounds: ["state_machines.WorkOrder.transitions[APPROVED->PLANNED]", "complexity_profile.state_machine_shape"]
        excluded_because:
          difficulty_instance: work_order_revision_cycle_traverses_approved_planned_twice
          rationale: "That §1.8 instance already walks the APPROVED -> PLANNED -> APPROVED loop twice and asserts the scope-cost rollup after each hop, which subsumes any single-lap cyclic-shape claim."

      - name: supplemental_worker_fork_and_join_and_badge_ledger
        claim_type: branching
        grounds: ["state_machines.SupplementalWorker.transitions[SCREENING->BADGE_READY]", "state_machines.SupplementalWorker.transitions[BADGE_READY->BADGED].side_effects", "calculations.outage_badging_rollup"]
        excluded_because:
          difficulty_instance: supplemental_worker_fork_join_needs_both_branches
          rationale: "That §1.8 instance drives both onboarding branches independently, proves the join fires only when background_status is CLEAR and training_status is COMPLETE, and reconciles Outage.badged_worker_count afterwards — covering the branching shape and the badge ledger-sync side effect in one recipe."

      - name: permit_void_and_reservation_release_reverse_their_side_effects
        claim_type: compensation
        grounds: ["state_machines.RadiologicalWorkPermit.transitions[APPROVED->VOIDED]", "state_machines.PoolCellReservation.transitions[RESERVED->RELEASED]"]
        excluded_because:
          difficulty_instance: permit_void_restores_outage_dose_ledger_exactly
          rationale: "The §1.8 compensating-invariant pair (this instance plus pool_reservation_release_restores_cell_ledger_exactly) already asserts that every field the forward transition moved returns to its exact pre-transition value, with no drift and with the ledger rows retained."

      - name: permit_approval_requires_its_work_order_to_be_approved
        claim_type: guarded_transition
        grounds: ["state_machines.RadiologicalWorkPermit.transitions[DRAFT->APPROVED].preconditions", "errors[ERR_WORK_ORDER_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: rwp_approve_requires_owning_work_order_approved
          rationale: "That §1.8 cross-entity-state instance is exactly this guarded transition: it approves the same permit under a PLANNED work order (rejected) and under an APPROVED one (admitted), holding every other input constant."

      - name: alara_posture_flip_holds_the_other_draft_permits
        claim_type: conditional_cascade
        grounds: ["state_machines.RadiologicalWorkPermit.transitions[DRAFT->HELD_FOR_ALARA]", "state_machines.RadiologicalWorkPermit.transitions[HELD_FOR_ALARA->DRAFT]"]
        excluded_because:
          difficulty_instance: rwp_approval_cascade_holds_other_drafts_for_alara
          rationale: "That §1.8 transitive-cascade instance already shows the hold applying only to DRAFT permits above ALARA_RESTRICTED_HOLD_MREM and the return leg firing when the posture comes back to NORMAL."

      - name: emergent_approval_cascade_reaches_six_hops
        claim_type: cascade_down
        grounds: ["state_machines.EmergentWorkItem.transitions[REPORTED->APPROVED].side_effects"]
        excluded_because:
          difficulty_instance: emergent_approval_cascade_defers_discretionary_and_voids_permit
          rationale: "That §1.8 transitive-cascade instance walks the full eight-step dispose cascade end to end, including the pinned rule that schedule_posture is fixed at step 5 and not re-evaluated after step 7, which no shorter cascade claim can reach."

  # =========================================================================
  - section: calculations
    instances:

      - name: core_load_reactivity_margin_computed_from_known_inputs
        claim_type: correct_result
        grounds: ["calculations.core_load_reactivity_margin", "entities.CoreLoadPattern.fields.reactivity_margin_pcm"]
        distinguishing_aspect: "A pattern with fresh_assembly_count 40 and cycle_length_mwd_mtu 18000 yields 800 + 12 * 40 - 15 * (18000 / 1000) = 800 + 480 - 270 = 1010.00 pcm, and discharge_assembly_count 80 does not appear anywhere in the arithmetic."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING at version 1."
            - "The burnup term divides the cycle length by 1000 BEFORE applying the 15 pcm/GWd penalty; multiplying 15 by 18000 directly would give a wildly negative margin."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
          trigger:
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 40, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
          assert:
            - "HTTP 201 — 1010.00 is at or above MIN_SHUTDOWN_MARGIN_PCM 1000, so the pattern is persisted"
            - "CoreLoadPattern.${clp_id}.reactivity_margin_pcm == 1010.00"
            - "CoreLoadPattern.${clp_id}.status == DRAFT and discharge_assembly_count == 80"
            - "Outage.${o_id}.version == ${o_v1} + 1 — the create bumps the parent version"

      - name: scope_cost_rollup_counts_only_approved_executing_and_complete
        claim_type: input_set_filtering
        grounds: ["calculations.outage_scope_cost_rollup.input_set", "entities.Outage.fields.approved_scope_cost_usd"]
        distinguishing_aspect: "Three work orders of 1000000, 500000 and 300000 USD sit in APPROVED, PLANNED and SCOPED. The base is 1000000.00, not 1800000.00. Deferring the approved one empties the input set and drives the base back to 0.00 — a SCOPED or PLANNED row never contributed in the first place."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING with duration_target_hours 720."
            - "WO-A (MAINTENANCE, 200 h, 1000000 USD) is APPROVED; its priority_score is 20 + min(30, 83.33) = 50.00 so its band is HIGH and the ERR_SCOPE_FROZEN gate does not apply. WO-B (500000 USD) stops at PLANNED and WO-C (300000 USD) stays SCOPED."
            - "Base 1000000.00 is below SCOPE_TIER_1_CEILING 5000000, so rate 0.08 gives contingency 80000.00 and total 1080000.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO-A main generator inspection support", estimated_hours: 200, estimated_cost_usd: 1000000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { woa_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO-B valve rebuild", estimated_hours: 100, estimated_cost_usd: 500000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wob_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "WO-C insulation replacement", estimated_hours: 50, estimated_cost_usd: 300000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { woc_id: "$.data.id" }
            - call: "POST /work-orders/${woa_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wob_id}/plan"
              payload: {}
              as: OutagePlanner
          trigger:
            - call: "POST /work-orders/${woa_id}/approve-scope"
              payload: {}
              as: OutageDirector
              captures: { woa_status: "$.data.status" }
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { base_mid: "$.data.approved_scope_cost_usd", total_mid: "$.data.total_scope_cost_usd" }
            - call: "POST /work-orders/${woa_id}/defer"
              payload: { deferral_reason: "Scope moved to the following cycle" }
              as: OutageDirector
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { base_after: "$.data.approved_scope_cost_usd", total_after: "$.data.total_scope_cost_usd" }
          assert:
            - "${woa_status} == APPROVED and WorkOrder.${woa_id}.priority == HIGH with priority_score == 50.00"
            - "${base_mid} == 1000000.00 and ${total_mid} == 1080000.00 — WO-B (PLANNED) and WO-C (SCOPED) are outside the input set"
            - "${base_after} == 0.00 and ${total_after} == 0.00 — DEFERRED is outside the input set too"
            - "WorkOrder.${wob_id}.status == PLANNED and WorkOrder.${woc_id}.status == SCOPED — neither was touched by the rollup"

      - name: priority_band_constants_decide_at_exactly_seventy_five
        claim_type: constants_applied
        grounds: ["calculations.work_order_priority_score.constants", "entities.WorkOrder.fields.priority"]
        distinguishing_aspect: "PRIORITY_CRITICAL_MIN is compared with >=, so a score of exactly 75.00 is CRITICAL. The paired work order differs only by 100 mrem of estimated dose, which subtracts exactly one DOSE_PENALTY_DIVISOR block and drops the score to 74.00 — one hundredth below the boundary is HIGH."
        test_recipe:
          setup:
            - "Safety function UNIT_1 / DECAY_HEAT_REMOVAL with trains_total 3 and min_trains_required 1."
            - "Outage UNIT_1 / 1R24 with duration_target_hours 100000, chosen so that a 1-hour work order's raw duration pressure is 1 / 100000 * 300 = 0.003 and rounds to 0.00, isolating the constant terms."
            - "Both work orders are INSPECTION (type weight 30), both name the safety function (+25) and both carry a regulatory commitment (+20): 30 + 25 + 20 = 75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /safety-functions"
              payload: { station_unit: "UNIT_1", function_code: "DECAY_HEAT_REMOVAL", trains_total: 3, min_trains_required: 1 }
              as: StationAdmin
              captures: { sf_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 100000, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Steam generator eddy current inspection", estimated_hours: 1, estimated_cost_usd: 100000, estimated_dose_mrem: 0, regulatory_commitment: true, safety_function_id: "${sf_id}" }
              as: OutagePlanner
              captures: { wo_crit_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Reactor coolant pump inspection", estimated_hours: 1, estimated_cost_usd: 100000, estimated_dose_mrem: 100, regulatory_commitment: true, safety_function_id: "${sf_id}" }
              as: OutagePlanner
              captures: { wo_high_id: "$.data.id" }
          assert:
            - "WorkOrder.${wo_crit_id}.priority_score == 75.00 and priority == CRITICAL — the band test is >=, not >"
            - "WorkOrder.${wo_high_id}.priority_score == 74.00 and priority == HIGH"
            - "The 100 mrem work order lost exactly 1.00 point: the penalty is floor(100 / 100) == 1, capped at DOSE_PENALTY_CAP 15"
            - "SafetyFunction.${sf_id}.max_concurrent_oos_trains == 2 — trains_total 3 minus min_trains_required 1"

      - name: per_worker_dose_tie_rounds_half_up_not_half_even
        claim_type: precision
        grounds: ["calculations.rwp_committed_dose.precision", "entities.RadiologicalWorkPermit.fields.per_worker_dose_mrem"]
        distinguishing_aspect: "The per-worker figure lands exactly on a half at the third decimal with an EVEN digit in front of it: 12.5 mrem/h * 3.7 h * (1 - 0.5) = 23.125. ROUND_HALF_UP gives 23.13; banker's rounding would give 23.12 and every downstream figure would then differ. This pins the rounding MODE, whereas the §1.8 combinatorial instance pins the rounding ORDER."
        test_recipe:
          setup:
            - "Rad area UNIT_1 / AUX-EL306 with dose_rate_mrem_per_hr 12.5, occupancy_limit_workers 10 and survey_buffer_hours 1."
            - "Outage UNIT_1 / 1R24 in PLANNING with one SCOPED work order to hang the draft permit from."
            - "Chain: per_worker_raw 23.125 -> 23.13; collective 23.13 * 2 = 46.26; contingency 46.26 * 0.2 = 9.252 -> 9.25; committed 46.26 + 9.25 = 55.51. The ALARA gate reads 46.26 against ALARA_REVIEW_THRESHOLD_MREM 300, so no review is required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "AUX-EL306", dose_rate_mrem_per_hr: 12.5, occupancy_limit_workers: 10, survey_buffer_hours: 1 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "INSPECTION", title: "Auxiliary building survey", estimated_hours: 8, estimated_cost_usd: 20000, estimated_dose_mrem: 50, requires_rad_work: true }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
          trigger:
            - call: "POST /work-orders/${wo_id}/rwps"
              payload: { rad_area_id: "${ra_id}", worker_count: 2, shielding_factor: 0.5, planned_start_offset_hours: 0, planned_duration_hours: 3.7 }
              as: RadProtectionPlanner
              captures: { rwp_id: "$.data.id" }
          assert:
            - "RadiologicalWorkPermit.${rwp_id}.per_worker_dose_mrem == 23.13"
            - "RadiologicalWorkPermit.${rwp_id}.collective_dose_mrem == 46.26"
            - "RadiologicalWorkPermit.${rwp_id}.contingency_dose_mrem == 9.25"
            - "RadiologicalWorkPermit.${rwp_id}.committed_dose_mrem == 55.51"
            - "RadiologicalWorkPermit.${rwp_id}.alara_review_required == false and status == DRAFT"

      - name: scope_contingency_tier_boundary_is_exclusive_below_and_inclusive_at
        claim_type: tiered_pricing
        grounds: ["calculations.outage_scope_cost_rollup.constants", "calculations.outage_scope_cost_rollup.formula"]
        distinguishing_aspect: "The tier-1 test is `base < SCOPE_TIER_1_CEILING`, so a base of exactly 5000000.00 falls through to the 0.12 rate while 4999999.00 keeps 0.08. One dollar of base changes the contingency from 399999.92 to 600000.00 — the rate is flat over the whole base, not marginal over the band."
        test_recipe:
          setup:
            - "Two independent outages, each with duration_target_hours 720. Outage AT holds one APPROVED work order of exactly 5000000 USD; outage BELOW holds one APPROVED work order of 4999999 USD."
            - "Both work orders are MAINTENANCE with estimated_hours 200, so priority_score is 20 + min(30, round(200 / 720 * 300, 2)) = 50.00 and the band is HIGH — the discretionary scope gate never fires."
            - "AT: rate 0.12, contingency round_half_up(5000000 * 0.12, 2) = 600000.00, total 5600000.00. BELOW: rate 0.08, contingency round_half_up(4999999 * 0.08, 2) = 399999.92, total 5399998.92."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24-AT", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_at: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_2", designation: "2R24-BELOW", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_below: "$.data.id" }
            - call: "POST /outages/${o_at}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Turbine overhaul at the boundary", estimated_hours: 200, estimated_cost_usd: 5000000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo_at: "$.data.id" }
            - call: "POST /outages/${o_below}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Turbine overhaul one dollar below", estimated_hours: 200, estimated_cost_usd: 4999999, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo_below: "$.data.id" }
            - call: "POST /work-orders/${wo_at}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_below}/plan"
              payload: {}
              as: OutagePlanner
          trigger:
            - call: "POST /work-orders/${wo_at}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "POST /work-orders/${wo_below}/approve-scope"
              payload: {}
              as: OutageDirector
          assert:
            - "Outage.${o_at}.approved_scope_cost_usd == 5000000.00, scope_contingency_usd == 600000.00, total_scope_cost_usd == 5600000.00"
            - "Outage.${o_below}.approved_scope_cost_usd == 4999999.00, scope_contingency_usd == 399999.92, total_scope_cost_usd == 5399998.92"
            - "The contingency difference is 200000.08 for one dollar of base — proof the rate is flat, not marginal"

      - name: critical_path_over_disconnected_chains_takes_the_longest
        claim_type: topological
        grounds: ["calculations.outage_critical_path.formula", "entities.Outage.fields.projected_duration_hours", "entities.ScheduleActivity.fields.is_critical_path"]
        distinguishing_aspect: "The activity graph is two disconnected components — a two-hop chain of 250 hours and a lone 300-hour root. The projection is the maximum over components, not their sum, and is_critical_path is true only for the winner and its ancestors, so both members of the losing chain are false."
        test_recipe:
          setup:
            - "Outage UNIT_1 / 1R24 in PLANNING with duration_target_hours 720."
            - "Component one: A1 (offset 0, 100 h) then A2 (offset 100, 150 h, predecessor A1) — path lengths 100.00 and 250.00."
            - "Component two: B1 (offset 0, 300 h, no predecessor) — path length 300.00."
            - "All three activities are unlinked, so each hop inflates by UNLINKED_CONTINGENCY_PCT 0.1: A1 risk 110.00, A2 risk 110.00 + 165.00 = 275.00, B1 risk 330.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "A1 cavity flood-up", planned_start_offset_hours: 0, planned_duration_hours: 100 }
              as: OutagePlanner
              captures: { a1_id: "$.data.id" }
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "A2 core offload", planned_start_offset_hours: 100, planned_duration_hours: 150, predecessor_activity_id: "${a1_id}" }
              as: OutagePlanner
              captures: { a2_id: "$.data.id" }
          trigger:
            - call: "POST /outages/${o_id}/schedule-activities"
              payload: { label: "B1 main generator rotor work", planned_start_offset_hours: 0, planned_duration_hours: 300 }
              as: OutagePlanner
              captures: { b1_id: "$.data.id" }
          assert:
            - "ScheduleActivity.${a1_id}.path_length_hours == 100.00 and risk_adjusted_path_length_hours == 110.00"
            - "ScheduleActivity.${a2_id}.path_length_hours == 250.00 and risk_adjusted_path_length_hours == 275.00"
            - "ScheduleActivity.${b1_id}.path_length_hours == 300.00 and risk_adjusted_path_length_hours == 330.00"
            - "Outage.${o_id}.projected_duration_hours == 300.00 and risk_adjusted_duration_hours == 330.00 — the maximum over components, never 550.00"
            - "Outage.${o_id}.critical_path_activity_id == ${b1_id}; is_critical_path is true for ${b1_id} and false for both ${a1_id} and ${a2_id}"
            - "Outage.${o_id}.schedule_posture == ON_TRACK — 300.00 is at or below the 720-hour target"

      - name: dose_ledger_replay_nets_a_closeout_underrun_against_the_commitment
        claim_type: aggregation
        grounds: ["calculations.outage_dose_ledger.formula", "state_machines.RadiologicalWorkPermit.transitions[APPROVED->CLOSED].side_effects"]
        distinguishing_aspect: "A running total verified after an add and after a partial reversal: approval commits 180.00, closeout at an actual of 100.00 appends a RELEASE of exactly 80.00 (not a replacement row), and the replay nets to 100.00 with both rows retained in the append-only ledger."
        test_recipe:
          setup:
            - "Rad area UNIT_1 / CTMT-EL471 with dose_rate_mrem_per_hr 25 and survey_buffer_hours 2. Outage UNIT_1 / 1R24 with dose_budget_total_mrem 5000, driven to EXECUTION."
            - "The permit covers 2 workers for 6 hours at shielding_factor 0.5: per-worker 75.00, collective 150.00, contingency 30.00, committed 180.00."
            - "Closeout records actual_dose_mrem 100.00, so the release amount is 180.00 - 100.00 = 80.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /rad-areas"
              payload: { station_unit: "UNIT_1", area_code: "CTMT-EL471", dose_rate_mrem_per_hr: 25, occupancy_limit_workers: 10, survey_buffer_hours: 2 }
              as: StationAdmin
              captures: { ra_id: "$.data.id" }
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
