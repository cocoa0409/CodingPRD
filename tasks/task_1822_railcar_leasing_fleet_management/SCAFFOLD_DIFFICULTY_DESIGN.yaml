# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: car_hire_provisional_current_vs_final_pinned
        grounds:
          - calculations.calc_car_hire_settlement
          - entities.LeaseAssignment.fields.pinned_car_hire_daily_cents
          - entities.CarHireStatement.fields.tariff_source
        distinguishing_aspect: |
          Billing domain: the provisional variant prices August with the tariff CURRENT at
          generation time (10000/day, 60/mile) while the final variant reprices the SAME month
          with the assignment-pinned tariff (9000/day, 55/mile) and validated miles (950 not
          1000), yielding final_net_cents 226750 against a last provisional of 253000.
        test_recipe:
          setup:
            - "Tariffs for COVERED_HOPPER: CAR_HIRE_BASE 9000 and MILEAGE_CREDIT 55, both 2026-01-01..2027-01-01"
            - "Lessee credit_limit 100000000; FULL_SERVICE lease ACTIVE 2026-08-01..2027-07-31 (share 100%, cap 20000)"
            - "Assignment on car GATX2001 (built 2015), GRAIN, 2026-08-01..2027-06-30, delivered at default clock 2026-08-01"
            - "Both tariffs amended to 10000 / 60 after pinning; August mileage report submitted loaded 1000 empty 200"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin, captures: { th_id: "$.data.id", th_v: "$.data.version" } }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin, captures: { tm_id: "$.data.id", tm_v: "$.data.version" } }
            - { call: "POST /lessees", payload: { company_name: "Acme Grain Co", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX2001", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2027-06-30" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "PUT /tariff-rates/${th_id}", payload: { unit_rate_cents: 10000, expected_tariff_version: "${th_v}" }, as: LeaseAdmin }
            - { call: "PUT /tariff-rates/${tm_id}", payload: { unit_rate_cents: 60, expected_tariff_version: "${tm_v}" }, as: LeaseAdmin }
            - { call: "POST /mileage-reports", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", report_month: "2026-08", loaded_miles: 1000, empty_miles: 200 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id" } }
          trigger:
            - { call: "POST /car-hire-statements/generate", payload: { statement_month: "2026-08" }, as: BillingAnalyst, captures: { stmt: "$.data[0].id" } }
            - { call: "POST /mileage-reports/${rep}/validate", payload: { validated_loaded_miles: 950, validated_empty_miles: 200 }, as: BillingAnalyst }
            - { call: "POST /car-hire-statements/${stmt}/finalize", payload: {}, as: BillingAnalyst }
          assert:
            - "CarHireStatement.${stmt}.provisional_net_cents == 253000 (current tariff 10000/day x 31 days - 950 x 60 after validation recompute)"
            - "CarHireStatement.${stmt}.final_net_cents == 226750 (pinned 9000/day x 31 - 950 x 55 = 279000 - 52250)"
            - "CarHireStatement.${stmt}.gross_car_hire_cents == 279000 (pinned rate used, not current 10000)"
            - "CarHireStatement.${stmt}.tariff_source == PINNED and loaded_miles_used == 950"
            - "CarHireStatement.${stmt}.provisional_net_cents != CarHireStatement.${stmt}.final_net_cents (delta 26250)"
            - "Lessee.${les}.outstanding_balance_cents == 226750"

      - name: retrofit_penalty_accrued_vs_assessed
        grounds:
          - calculations.calc_retrofit_penalty
          - entities.ComplianceDirective.fields.grace_days
          - state_machines.ComplianceDirective.ANNOUNCED_to_EFFECTIVE
        distinguishing_aspect: |
          Compliance domain (distinct from billing): the accrued variant ignores grace and cap
          (45 days x 25000 = 1125000) while the assessed variant on the SAME car/day deducts the
          30-day grace and applies the cap, yielding 375000; both come from one read.
        test_recipe:
          setup:
            - "Tank car GATX3001 (TANK_GENERAL, built 2015) AVAILABLE, no retrofit orders"
            - "Directive DOT-117R covering TANK_GENERAL, deadline 2026-12-31, grace 30, daily penalty 25000, cap 500000, promoted at default clock 2026-08-01"
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX3001", car_type: "TANK_GENERAL", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /compliance-directives", payload: { directive_code: "DOT-117R", description: "Tank car retrofit", applies_to_car_types: ["TANK_GENERAL"], retrofit_deadline: "2026-12-31", grace_days: 30, daily_penalty_cents: 25000, penalty_cap_cents: 500000 }, as: ComplianceOfficer, captures: { dir: "$.data.id" } }
            - { call: "POST /compliance-directives/${dir}/promote", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /railcars/${car}/compliance", payload: {}, as: ComplianceOfficer, captures: { acc: "$.data.accrued_penalty_cents", ass: "$.data.assessed_penalty_cents" } }
          assert:
            - "GET compliance returns posture == NON_COMPLIANT and days_since_oldest_effective == 45"
            - "accrued_penalty_cents == 1125000 (45 x 25000, no grace, no cap)"
            - "assessed_penalty_cents == 375000 ((45 - 30) x 25000, capped at 500000 not binding)"
            - "accrued_penalty_cents != assessed_penalty_cents (delta 750000 == grace days x daily penalty)"

  - rule_id: combinatorial_formula
    instances:
      - name: repair_split_three_way_branching
        grounds:
          - calculations.calc_repair_responsibility_split
          - entities.RepairAuthorization.fields.lessee_preauth_required
        distinguishing_aspect: |
          Mode (a): three inputs (lease_type x defect_cause x cost vs cap) interact non-linearly
          with a nested max() allowance branch: identical 100000 estimate yields lessee share
          30000 under FULL_SERVICE+WEAR_AND_TEAR but 100000 under NET, and the preauth flag
          flips with the cap comparison (30000 > 20000 true; 100000 > 200000 false).
        test_recipe:
          setup:
            - "Tariffs COVERED_HOPPER 9000/55 for 2026-01-01..2027-01-01; two lessees L1, L2 with high credit limits"
            - "L1 lease FULL_SERVICE cap 20000 ACTIVE; L2 lease NET cap 200000 ACTIVE"
            - "Cars GATX4001/L1 and GATX4002/L2 each assigned 2026-08-01..2026-12-31"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L1", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { l1: "$.data.id" } }
            - { call: "POST /lessees", payload: { company_name: "L2", credit_tier: "TIER_B", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { l2: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX4001", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { c1: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX4002", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { c2: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${l1}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea1: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea1}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea1}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${l2}", lease_type: "NET", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 200000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea2: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea2}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea2}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea1}", railcar_id: "${c1}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { a1: "$.data.id" } }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea2}", railcar_id: "${c2}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { a2: "$.data.id" } }
          trigger:
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${c1}", lease_assignment_id: "${a1}", defect_description: "worn brake shoes", defect_cause: "WEAR_AND_TEAR", estimate_cents: 100000, requires_shop: false }, as: MaintenanceController, captures: { r1: "$.data.id" } }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${c2}", lease_assignment_id: "${a2}", defect_description: "worn brake shoes", defect_cause: "WEAR_AND_TEAR", estimate_cents: 100000, requires_shop: false }, as: MaintenanceController, captures: { r2: "$.data.id" } }
          assert:
            - "RepairAuthorization.${r1}.lessee_share_cents == 30000 (round_half_up(0.40 x max(0, 100000-25000))) and lessor_share_cents == 70000"
            - "RepairAuthorization.${r1}.lessee_preauth_required == true (30000 > cap 20000)"
            - "RepairAuthorization.${r2}.lessee_share_cents == 100000 and lessor_share_cents == 0 (NET lease pays all wear)"
            - "RepairAuthorization.${r2}.lessee_preauth_required == false (100000 <= cap 200000)"

      - name: damage_billing_per_line_rounding_order
        grounds:
          - calculations.calc_damage_billing_schedule
          - entities.DamageAssessment.fields.lessee_liable_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per-line-then-sum; on a 35-year-old car the two
          LESSEE_DAMAGE lines round to 64688 and 12937 (sum 77625), whereas the forbidden
          sum-then-round order yields 77624 — a one-cent divergence the test must catch.
        test_recipe:
          setup:
            - "Car GATX5001 built 1991 (car_age_years 35 >= BETTERMENT_AGE_YEARS 30)"
            - "Lessee + ACTIVE FULL_SERVICE lease + assignment GRAIN window 2026-08-01..2026-12-31 (tariffs 9000/55)"
            - "Damage assessment with three lines submitted and finalized"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX5001", car_type: "COVERED_HOPPER", built_year: 1991 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /damage-assessments", payload: { lease_assignment_id: "${asg}", railcar_id: "${car}" }, as: MaintenanceController, captures: { da: "$.data.id" } }
          trigger:
            - { call: "POST /damage-assessments/${da}/submit", payload: { line_items: [ { component: "WHEEL_SET", severity: "MODERATE", cause: "LESSEE_DAMAGE", parts_cents: 50000, labor_hours: 2.0, replaced: true }, { component: "BRAKE_BEAM", severity: "MINOR", cause: "LESSEE_DAMAGE", parts_cents: 9999, labor_hours: 0.5, replaced: true }, { component: "COUPLER_LUBRICATION", severity: "MINOR", cause: "WEAR_AND_TEAR", parts_cents: 4000, labor_hours: 0.25, replaced: false } ] }, as: MaintenanceController }
            - { call: "POST /damage-assessments/${da}/finalize", payload: {}, as: MaintenanceController }
          assert:
            - "DamageAssessment.${da}.total_assessed_cents == 111124 (86250 + 17249 + 7625)"
            - "DamageAssessment.${da}.lessee_liable_cents == 77625 (per-line: round(86250x0.75)=64688, round(17249x0.75)=12937, wear line 0)"
            - "lessee_liable_cents != 77624 (the sum-then-round value round(103499x0.75)=77624 is the forbidden order)"

      - name: settle_proration_pinned_evaluation_order
        grounds:
          - calculations.calc_lease_proration
          - state_machines.LeaseAssignment.RETURNED_to_SETTLED
        distinguishing_aspect: |
          Mode (c): the formula's circular-looking inputs (rent needs billable days, billable
          days need shop exclusions, exclusions need repair responsibility) are pinned to the
          declared order responsibility -> excluded days -> billable days -> rent -> fee; a
          naive rent-first reading bills 20 days (100000) while the pinned order bills 16 (80000).
        test_recipe:
          setup:
            - "FULL_SERVICE lease base rate 5000, cap 100000, 2026-08-01..2027-07-31 ACTIVE; lessee limit 100000000"
            - "Car GATX6001 assigned 2026-08-01..2026-08-31, delivered 2026-08-01"
            - "WEAR_AND_TEAR shop repair 100000 approved; car IN_SHOP 2026-08-05, completed 2026-08-09 (4 excluded days, lessor share 70000 > 0)"
            - "Car returned 2026-08-21; no damage assessments; lease still ACTIVE (fee 0)"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX6001", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 100000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-08-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", defect_description: "wheel wear", defect_cause: "WEAR_AND_TEAR", estimate_cents: 100000, requires_shop: true }, as: MaintenanceController, captures: { rep: "$.data.id" } }
            - { call: "POST /repair-authorizations/${rep}/approve", payload: { approved_amount_cents: 100000 }, as: MaintenanceController }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /repair-authorizations/${rep}/start-work", payload: {}, as: MaintenanceController }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-09T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /repair-authorizations/${rep}/complete", payload: { final_cost_cents: 100000 }, as: MaintenanceController }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /lease-assignments/${asg}/return", payload: {}, as: FleetPlanner }
          trigger:
            - { call: "POST /lease-assignments/${asg}/settle", payload: {}, as: BillingAnalyst }
          assert:
            - "LeaseAssignment.${asg}.billable_days == 16 (raw 20 days 08-01..08-21 exclusive, minus 4 shop days [08-05, 08-09))"
            - "LeaseAssignment.${asg}.final_rent_cents == 80000 (16 x 5000), not 100000"
            - "LeaseAssignment.${asg}.termination_fee_cents == 0 (lease ACTIVE)"
            - "Lessee.${les}.outstanding_balance_cents == 110000 (repair lessee share 30000 billed at complete + 80000 rent)"

  - rule_id: non_linear_state_machine
    instances:
      - name: railcar_shop_cycle_restores_prior_status
        grounds:
          - state_machines.Railcar.AVAILABLE_to_IN_SHOP
          - state_machines.Railcar.IN_SHOP_to_AVAILABLE
          - entities.Railcar.fields.status_before_shop
        distinguishing_aspect: |
          Railcar runs a true cycle AVAILABLE -> IN_SHOP -> AVAILABLE (not a pipeline), and the
          return leg restores the saved status_before_shop instead of landing on a fixed state.
        test_recipe:
          setup:
            - "Car GATX7001 AVAILABLE; PRE_EXISTING repair 80000 with requires_shop approved (no lease linked: FULL_SERVICE default, lessee share 0)"
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX7001", car_type: "BOX", built_year: 2018 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${car}", defect_description: "door track", defect_cause: "PRE_EXISTING", estimate_cents: 80000, requires_shop: true }, as: MaintenanceController, captures: { rep: "$.data.id" } }
            - { call: "POST /repair-authorizations/${rep}/approve", payload: { approved_amount_cents: 80000 }, as: MaintenanceController }
          trigger:
            - { call: "POST /repair-authorizations/${rep}/start-work", payload: {}, as: MaintenanceController }
            - { call: "GET /railcars/${car}", payload: {}, as: FleetPlanner, captures: { mid_status: "$.data.status" } }
            - { call: "POST /repair-authorizations/${rep}/complete", payload: { final_cost_cents: 80000 }, as: MaintenanceController }
            - { call: "GET /railcars/${car}", payload: {}, as: FleetPlanner }
          assert:
            - "after start-work: Railcar.${car}.status == IN_SHOP, status_before_shop == AVAILABLE, open_shop_repair_count == 1"
            - "after complete: Railcar.${car}.status == AVAILABLE (restored), status_before_shop == null, open_shop_repair_count == 0"
            - "RepairAuthorization.${rep}.status == COMPLETED and lessee_share_cents == 0"

      - name: repair_revision_cycle_resets_preauthorization
        grounds:
          - state_machines.RepairAuthorization.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.RepairAuthorization.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.RepairAuthorization.fields.revision_count
        distinguishing_aspect: |
          RepairAuthorization loops UNDER_REVIEW -> REVISION_REQUESTED -> UNDER_REVIEW; the loop
          recomputes the split on the new estimate (100000 -> 40000 drops the share below the
          50000 cap) and resets a previously granted lessee preauthorization.
        test_recipe:
          setup:
            - "NET lease cap 50000 ACTIVE; car GATX7002 assigned 2026-08-01..2026-12-31 (tariffs 9000/55 in place)"
            - "Repair estimate 100000, WEAR_AND_TEAR (NET -> lessee share 100000 > cap): preauth required and granted"
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX7002", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "NET", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 50000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", defect_description: "roof leak", defect_cause: "WEAR_AND_TEAR", estimate_cents: 100000, requires_shop: false }, as: MaintenanceController, captures: { rep: "$.data.id" } }
            - { call: "POST /repair-authorizations/${rep}/preauthorize", payload: {}, as: LesseeRep, as_user_id: "${les}" }
          trigger:
            - { call: "POST /repair-authorizations/${rep}/request-revision", payload: { notes: "too expensive" }, as: MaintenanceController }
            - { call: "POST /repair-authorizations/${rep}/revise", payload: { estimate_cents: 40000 }, as: MaintenanceController }
            - { call: "POST /repair-authorizations/${rep}/approve", payload: { approved_amount_cents: 40000 }, as: MaintenanceController }
          assert:
