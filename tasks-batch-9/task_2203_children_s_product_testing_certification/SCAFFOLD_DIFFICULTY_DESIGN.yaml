      - name: non_linear_certificate_parallel_dimensions_issuance_and_accompaniment_advance_independently
        grounds:
          - state_machines.ChildrensProductCertificate.DRAFT_to_VOIDED
          - state_machines.ChildrensProductCertificate.NOT_FURNISHED_to_FURNISHED
          - state_machines.ChildrensProductCertificate.FURNISHED_to_RECALLED_FROM_SHIPMENTS
          - entities.ChildrensProductCertificate.fields.accompaniment_status
        distinguishing_aspect: "PARALLEL state dimensions on one row rather than a cycle. issuance_status and accompaniment_status are moved by disjoint endpoint sets owned by disjoint roles (CertificationOfficer versus DistributionManager), and each axis must reach a terminal value without dragging the other. The first certificate reaches issuance_status VOIDED while accompaniment_status is still at its initial NOT_FURNISHED; the second reaches accompaniment_status RECALLED_FROM_SHIPMENTS while issuance_status stays at ISSUED. A single-enum implementation that collapses the two axes cannot represent either combination. This differs from the retest-cycle instance both in entity and in shape: no state is ever re-entered here."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register one lead-content rule, a non-durable category with sampling_floor_units 1, and map the rule ALWAYS."
            - "Register an INDEPENDENT laboratory with a current attestation and a zero-surcharge accreditation, concurrent_slot_capacity 4."
            - "Register a product, add one painted part, scope it onto FULL_PRODUCT_TEST, create and activate an INITIAL plan."
            - "Book, start and PASS one order (measured_value 40) so the product reaches EVIDENCE_COMPLETE with risk_weighted_gap_score 0 and compliance_posture CLEARED."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/applicable-rules"
              payload:
