            - "PlanSubmission.${plan_lind}.status == \"SEALED\""
            - "PlanSubmission.${plan_lind}.seal_affixed_at == \"2026-08-01T00:00:00.000Z\""

      - name: err_penalty_unpaid_on_consent_order_execution
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PENALTY_UNPAID
          - validations[priority=45]
          - calculations.civil_penalty_assessment
        distinguishing_aspect: "The consent order records penalty_paid_cents 100000 against a penalty_cents of 298000 copied from the case assessment, so execution is refused with 402 (a fiscal status, not 409/422) and both the order and the sanction axis stay PROPOSED."
