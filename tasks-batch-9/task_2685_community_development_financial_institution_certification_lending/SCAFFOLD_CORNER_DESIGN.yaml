      - name: clock_endpoint_moves_the_instant_that_side_effects_stamp
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /cdfi/_clock/set_current_utc]
          - state_machines.TargetMarket.DRAFT_to_APPROVED
          - entities.BoardSeat.fields.resigned_at
        distinguishing_aspect: |
          Every timestamp side effect reads the logical clock at the moment of the request, not
          wall time: an approval taken at 2026-09-05 stamps approved_at 2026-09-05, and after the
          clock is moved forward a resignation on the same institution stamps resigned_at
          2026-09-06 while approved_at is left alone.
