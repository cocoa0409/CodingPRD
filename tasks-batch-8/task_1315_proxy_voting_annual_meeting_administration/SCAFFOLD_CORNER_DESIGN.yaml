scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: meeting_creation_applies_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Meeting, state_machines.Meeting]
        distinguishing_aspect: "A meeting created with all required fields returns 201 with status DRAFT, version 1, walk_in_shares 0, filed_at null, and created_at stamped from the default logical clock."
        test_recipe:
          setup: ["empty database; logical clock untouched (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id, m_status: $.data.status, m_v: $.data.version, m_created: $.data.created_at }
          assert:
            - "status == DRAFT (initial state)"
            - "version == 1"
            - "walk_in_shares == 0 and filed_at == null and filing_reference == null"
            - "created_at == 2026-08-01T00:00:00.000Z (logical clock default, not wall clock)"

      - name: meeting_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Meeting.fields.outstanding_shares, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required outstanding_shares yields ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5 }
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; HTTP 400"

      - name: meeting_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Meeting.fields.meeting_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "meeting_type 'PROXY' is not a declared enum member and yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "PROXY", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; HTTP 400"

      - name: account_creation_applies_defaults_and_mints_control_number
        claim_type: defaults
        grounds: [entities.ShareholderAccount.fields.delivery_preference, entities.ShareholderAccount.fields.householding_opt_out, entities.ShareholderAccount.fields.control_number, entities.ShareholderAccount.fields.status]
        distinguishing_aspect: "Omitting delivery_preference and householding_opt_out applies defaults NOTICE_AND_ACCESS and false; the system mints a non-null control_number; status starts PENDING."
        test_recipe:
          setup: ["a DRAFT meeting exists"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a_id: $.data.id, a_pref: $.data.delivery_preference, a_opt: $.data.householding_opt_out, a_cn: $.data.control_number, a_status: $.data.status }
          assert:
            - "delivery_preference == NOTICE_AND_ACCESS (default applied)"
            - "householding_opt_out == false (default applied)"
            - "control_number is a non-null system-minted string"
            - "status == PENDING (initial state before record-date lock)"

      - name: create_account_zero_shares_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ShareholderAccount.fields.shares_held, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "shares_held == 0 violates the > 0 constraint and yields ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["a DRAFT meeting exists"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Zero Holder", account_number: "A-1001", share_class: "COMMON", shares_held: 0 }
              as: TransferAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; HTTP 400"

      - name: account_creation_blocked_after_record_date_lock
        claim_type: parent_relationships
        grounds: [entities.ShareholderAccount.fields.meeting_id, state_machines.Meeting.DRAFT_to_RECORD_DATE_LOCKED, "errors[ERR_INVALID_MEETING_STATE]"]
        distinguishing_aspect: "The record-date list is frozen at lock: creating an account for a meeting already in RECORD_DATE_LOCKED fails with ERR_INVALID_MEETING_STATE."
        test_recipe:
          setup: ["meeting with one account; record date locked"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Late Holder", account_number: "A-1002", share_class: "COMMON", shares_held: 100 }
              as: TransferAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEETING_STATE; HTTP 409"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: open_voting_from_draft_returns_invalid_meeting_state
        claim_type: invalid_transition
        grounds: [state_machines.Meeting.MATERIALS_DISTRIBUTED_to_VOTING_OPEN, "errors[ERR_INVALID_MEETING_STATE]"]
        distinguishing_aspect: "open-voting is only valid from MATERIALS_DISTRIBUTED; from DRAFT it fails with ERR_INVALID_MEETING_STATE and no transition occurs."
        test_recipe:
          setup: ["meeting in DRAFT"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEETING_STATE; HTTP 409"
            - "GET /proxy/meetings/${m_id} still shows status == DRAFT"

      - name: double_lock_record_date_returns_invalid_meeting_state
        claim_type: idempotency
        grounds: [state_machines.Meeting.DRAFT_to_RECORD_DATE_LOCKED, "errors[ERR_INVALID_MEETING_STATE]"]
        distinguishing_aspect: "Locking the record date a second time is rejected; the same trigger is not idempotent and fires no side effects."
        test_recipe:
          setup: ["meeting with one account already locked to RECORD_DATE_LOCKED"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEETING_STATE; HTTP 409"
            - "meeting status remains RECORD_DATE_LOCKED"

      - name: lock_record_date_activates_eligible_accounts
        claim_type: side_effect_execution
        grounds: [state_machines.Meeting.DRAFT_to_RECORD_DATE_LOCKED, state_machines.ShareholderAccount.PENDING_to_ELIGIBLE]
        distinguishing_aspect: "The lock transition's side effect flips every meeting account PENDING -> ELIGIBLE (record-date list snapshot)."
        test_recipe:
          setup: ["DRAFT meeting with two PENDING accounts"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder Two", account_number: "A-1002", share_class: "COMMON", shares_held: 4000 }
              as: TransferAgent
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
          assert:
            - "GET /proxy/shareholder-accounts/${a1_id} shows status == ELIGIBLE"
            - "GET /proxy/shareholder-accounts/${a2_id} shows status == ELIGIBLE"

      - name: distribution_generation_activates_draft_proposals
        claim_type: side_effect_execution
        grounds: [state_machines.Meeting.RECORD_DATE_LOCKED_to_MATERIALS_DISTRIBUTED, state_machines.Proposal.DRAFT_to_ACTIVE, calculations.householding_grouping]
        distinguishing_aspect: "First distribution generation moves the meeting to MATERIALS_DISTRIBUTED and flips all DRAFT proposals to ACTIVE in one side-effect set."
        test_recipe:
          setup: ["RECORD_DATE_LOCKED meeting with one account and one DRAFT proposal"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
              captures: { pkg_status: "$.data[0].status" }
          assert:
            - "GET /proxy/meetings/${m_id} shows status == MATERIALS_DISTRIBUTED"
            - "GET /proxy/proposals/${p1_id} shows status == ACTIVE"
            - "created package status == ACTIVE"

      - name: conclude_from_adjourned_returns_invalid_meeting_state
        claim_type: invalid_transition
        grounds: [state_machines.Meeting.MEETING_IN_PROGRESS_to_MEETING_HELD, "errors[ERR_INVALID_MEETING_STATE]"]
        distinguishing_aspect: "conclude is only valid from MEETING_IN_PROGRESS; from ADJOURNED it fails with ERR_INVALID_MEETING_STATE (reconvene first)."
        test_recipe:
          setup: ["meeting convened then adjourned; a1 6000 COMMON voted FOR"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/adjourn"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/meetings/${m_id}/conclude"
              payload: {}
              as: ProxyAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_MEETING_STATE; HTTP 409"
            - "meeting status remains ADJOURNED"

      - name: full_lifecycle_to_filed_meeting_locks_terminal_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Meeting, state_machines.Proposal.ACTIVE_to_PASSED, state_machines.InspectorCertification.DRAFT_to_SIGNED, "errors[ERR_INVALID_MEETING_STATE]"]
        distinguishing_aspect: "Happy path DRAFT -> ... -> FILED_8K: sign flips the ACTIVE proposal to PASSED per CERTIFIED tabulation, file-8k stamps filed_at, and from terminal FILED_8K any further transition (adjourn) fails."
        test_recipe:
          setup: ["ANNUAL meeting MEETING_HELD; a1 6000 COMMON voted FOR; quorum met; DRAFT certification by insp-1; no OPEN challenges"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
            - call: "POST /proxy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T16:00:00Z" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/convene"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/conclude"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/inspector-certifications"
              payload: { meeting_id: "${m_id}" }
              as: InspectorOfElection
              as_user_id: "insp-1"
              captures: { cert_id: $.data.id }
            - call: "GET /proxy/meetings/${m_id}"
              as: InspectorOfElection
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /proxy/inspector-certifications/${cert_id}/sign"
              payload: { expected_meeting_version: "${m_v}" }
              as: InspectorOfElection
              as_user_id: "insp-2"
              captures: { cert_status: $.data.status }
            - call: "POST /proxy/meetings/${m_id}/file-8k"
              payload: { filing_reference: "8-K-2026-0001" }
              as: ProxyAdministrator
              captures: { m_status: $.data.status, m_filed: $.data.filed_at }
            - call: "POST /proxy/meetings/${m_id}/adjourn"
              payload: {}
              as: ProxyAdministrator
              captures: { term_err: $.data.error_id }
          assert:
            - "sign: certification status == SIGNED"
            - "after sign: GET /proxy/proposals/${p1_id} shows status == PASSED and GET /proxy/meetings/${m_id} shows status == RESULTS_CERTIFIED"
            - "file-8k: meeting status == FILED_8K, filed_at == 2026-09-15T16:00:00.000Z (logical clock), filing_reference == 8-K-2026-0001"
            - "adjourn from FILED_8K: error_id == ERR_INVALID_MEETING_STATE (terminal lockdown)"

      - name: vote_on_withdrawn_proposal_returns_proposal_not_active
        claim_type: precondition_enforcement
        grounds: [state_machines.Proposal.ACTIVE_to_WITHDRAWN, "errors[ERR_PROPOSAL_NOT_ACTIVE]"]
        distinguishing_aspect: "Withdrawing an ACTIVE proposal supersedes its VALIDATED votes; a subsequent vote on it fails with ERR_PROPOSAL_NOT_ACTIVE."
        test_recipe:
          setup: ["meeting VOTING_OPEN; p1 ACTIVE with a1's VALIDATED FOR vote (6000 shares)"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /proxy/proposals/${p1_id}/withdraw"
              payload: {}
              as: ProxyAdministrator
              captures: { p_status: $.data.status }
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "AGAINST", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "withdraw: proposal status == WITHDRAWN"
            - "cascade: GET /proxy/vote-instructions/${v1_id} shows status == SUPERSEDED"
            - "vote on withdrawn proposal: error_id == ERR_PROPOSAL_NOT_ACTIVE; HTTP 409"

      - name: revoke_superseded_vote_returns_vote_not_alterable
        claim_type: invalid_transition
        grounds: [state_machines.VoteInstruction.VALIDATED_to_SUPERSEDED, state_machines.VoteInstruction.VALIDATED_to_REVOKED, "errors[ERR_VOTE_NOT_ALTERABLE]"]
        distinguishing_aspect: "A re-vote supersedes the prior VALIDATED instruction; revoking the SUPERSEDED one fails with ERR_VOTE_NOT_ALTERABLE."
        test_recipe:
          setup: ["meeting VOTING_OPEN; a1 voted FOR then re-voted AGAINST (v1 SUPERSEDED, v2 VALIDATED)"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Acme Corp", ticker: "ACME", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
