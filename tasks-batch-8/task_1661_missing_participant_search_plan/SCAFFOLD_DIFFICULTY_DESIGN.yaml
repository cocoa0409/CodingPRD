            - { call: "POST /search-cases/${sc_sg}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_sg}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
