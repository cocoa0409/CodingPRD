              payload: { patron_id: "${p1_id}" }
              as: Patron
              as_user_id: "${p1_id}"
              captures: { only_id: "$.data[0].id" }
          assert:
            - "data array length == 1 and Entry[0].id == ${e1_id}"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_double_booking_via_difficulty
        claim_type: violation_to_error
        grounds: ["errors[ERR_DOUBLE_BOOKING]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rto_permit_grant_buffer_expanded_overlap
          rationale: "ERR_DOUBLE_BOOKING is the asserted failure of the buffer-overlap §1.8 instance."

      - name: error_stale_version_grant_explicit
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[permit-grant-stale-facility]"]
        distinguishing_aspect: "Grant carrying a stale expected_facility_version (the pre-bump value, after a sibling grant bumped it) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Two APPLIED permits on a facility (non-overlapping windows). Grant P1 (facility version bumps). Grant P2 with the pre-P1 facility version (stale)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "OCC Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "O1", email: "o1@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p1_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "O2", email: "o2@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p2_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p1_id}", start_at: "2026-09-01T10:00:00Z", end_at: "2026-09-01T12:00:00Z" }
              as: Patron
              as_user_id: "${p1_id}"
              captures: { perm1_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p2_id}", start_at: "2026-09-01T14:00:00Z", end_at: "2026-09-01T16:00:00Z" }
              as: Patron
              as_user_id: "${p2_id}"
              captures: { perm2_id: $.data.id }
            - call: "POST /permits/${perm1_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
            - call: "POST /permits/${perm2_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm1_id}/grant"
              payload: { expected_facility_version: "${fac_v0}" }
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm2_id}/grant"
              payload: { expected_facility_version: "${fac_v0}" }
              as: RecCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response 412; data.error_id == ERR_STALE_VERSION"
            - "Permit.${perm2_id}.status == APPLIED (unchanged)"

  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: missing_auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request with an unknown/blank X-User-Role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { name: "NoAuth", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "Response 401; data.error_id == ERR_UNAUTHENTICATED"

      - name: patron_cannot_create_facility_forbidden
        claim_type: rbac_denial
        grounds: [roles.Patron, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "POST /facilities is RecCoordinator-exclusive; a Patron is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["One patron registered."]
          setup_api_calls:
            - call: "POST /patrons"
              payload: { full_name: "PF", email: "pf@x.com", residency: "RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { name: "Sneak", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 403; data.error_id == ERR_FORBIDDEN"

      - name: patron_cannot_grant_permit_forbidden
        claim_type: rbac_denial
        grounds: [roles.RecCoordinator, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Grant is RecCoordinator-exclusive; a Patron grant attempt -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["APPLIED permit owned by the patron."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Grant Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "GP", email: "gp@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 403; data.error_id == ERR_FORBIDDEN"
            - "Permit.${perm_id}.status == APPLIED (unchanged)"

      - name: patron_cannot_cancel_other_patrons_permit_not_owner
        claim_type: rbac_denial
        grounds: [roles.Patron, "validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Patron cancelling another patron's permit -> ERR_NOT_RESOURCE_OWNER (403); ownership is X-User-ID == Permit.patron_id."
        test_recipe:
          setup: ["P_owner has an APPLIED permit; P_other tries to cancel it."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Own Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Owner", email: "owner@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Other", email: "other@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { other_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${owner_id}", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:00:00Z" }
              as: Patron
              as_user_id: "${owner_id}"
              captures: { perm_id: $.data.id }
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/cancel"
              payload: { refund_destination: "ORIGINAL" }
              as: Patron
              as_user_id: "${other_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 403; data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "Permit.${perm_id}.status == APPLIED (unchanged)"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_grant_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[permit-grant-stale-facility]", entities.Facility.fields.version]
        distinguishing_aspect: "Grant with the CURRENT expected_facility_version succeeds and increments Facility.version by exactly 1."
        test_recipe:
          setup: ["Facility version 1; one APPLIED permit with payment captured."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "OK Field", facility_type: "FIELD", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "OK", email: "ok@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-09-04T10:00:00Z", end_at: "2026-09-04T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 0 }
              as: FinanceClerk
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
              captures: { st: $.data.status }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: RecCoordinator
              captures: { v_after: $.data.version }
          assert:
            - "Permit.${perm_id}.status == GRANTED"
            - "Facility.${fac_id}.version == 2 (was 1, +1 on grant)"

      - name: cascade_league_cancel_via_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.LeagueSeries.transitions]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_league_cancel_to_permit_to_refund_depth3
          rationale: "The depth-3 league-cancel cascade is the named §1.8 transitive_cascade instance."

      - name: clock_set_gates_temporal_precondition
        claim_type: scheduled_actions
        grounds: [endpoints./_clock/set_current_utc.POST, state_machines.Permit.GRANTED_to_COMPLETED]
        distinguishing_aspect: "Advancing the clock past end_at via /_clock/set_current_utc enables COMPLETE that was previously rejected as ERR_INVALID_STATE."
        test_recipe:
          setup: ["Granted permit 2026-09-05T10:00-12:00; advance clock past end then complete succeeds."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: RecCoordinator
            - call: "POST /facilities"
              payload: { name: "Clk Pool", facility_type: "POOL", hourly_rate_cents: 10000, resident_discount_pct: 0.0, prime_multiplier: 1.5, prime_start_hour: 18, prime_end_hour: 22, deposit_cents: 3000 }
              as: RecCoordinator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /patrons"
              payload: { full_name: "CK", email: "ck@x.com", residency: "NON_RESIDENT" }
              as: RecCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /facilities/${fac_id}/permits"
              payload: { patron_id: "${p_id}", start_at: "2026-09-05T10:00:00Z", end_at: "2026-09-05T12:00:00Z" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { perm_id: $.data.id }
            - call: "POST /permits/${perm_id}/payments"
              payload: { fee_component_cents: 20000, deposit_component_cents: 3000 }
              as: FinanceClerk
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/grant"
              payload: { expected_facility_version: "${fac_v}" }
              as: RecCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T13:00:00Z" }
              as: RecCoordinator
          trigger:
            - call: "POST /facilities/${fac_id}/permits/${perm_id}/complete"
              payload: {}
              as: RecCoordinator
              captures: { st: $.data.status }
          assert:
            - "Permit.${perm_id}.status == COMPLETED"
            - "Refund for ${perm_id}: deposit_refund_cents == 3000"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_grant_visible_in_same_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.Permit.APPLIED_to_GRANTED]
        distinguishing_aspect: "A grant's effects (status GRANTED, final_fee_cents, deposit_held_cents) are present in the grant call's own response (immediate consistency)."
