scaffold_corner_design:
  # =========================================================================
  # Section: entities (§1.1 claims: creation, defaults, required fields,
  # type constraints, not-found, listing/pagination, immutability, FK integrity)
  # =========================================================================
  - section: entities
    instances:
      - name: home_create_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Home.fields.timezone
          - entities.Home.fields.status
          - entities.Home.fields.open_case_count
          - entities.Home.fields.current_census
        distinguishing_aspect: "A home created without the optional timezone field gets the default America/Los_Angeles, starts PROVISIONAL at version 1, and both computed counters start at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at default 2026-05-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C001", name: "Corner Maple", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
          assert:
            - "Home.${home_id}.timezone == 'America/Los_Angeles' (default applied)"
            - "Home.${home_id}.status == PROVISIONAL (initial state)"
            - "Home.${home_id}.version == 1"
            - "Home.${home_id}.open_case_count == 0 and Home.${home_id}.current_census == 0"

      - name: bed_create_default_medicaid_certified_false
        claim_type: defaults
        grounds:
          - entities.Bed.fields.medicaid_certified
          - entities.Bed.fields.status
        distinguishing_aspect: "A bed created without medicaid_certified defaults to false and starts AVAILABLE at version 1."
        test_recipe:
          setup:
            - "One PROVISIONAL home"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C002", name: "Corner Cedar", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id }
          assert:
            - "Bed.${bed_id}.medicaid_certified == false (default applied)"
            - "Bed.${bed_id}.status == AVAILABLE (initial state)"
            - "Bed.${bed_id}.version == 1"

      - name: resident_create_required_fields_and_enum_enforced
        claim_type: required_fields
        grounds:
          - entities.Resident.fields.payer_type
          - validations[priority=22]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required payer_type is a 400; supplying an enum value outside {PRIVATE_PAY, MEDICAID} is also a 400 — two distinct malformed-payload probes on the same endpoint."
        test_recipe:
          setup:
            - "One PROVISIONAL home"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C003", name: "Corner Birch", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "No Payer", date_of_birth: "1940-01-01" }
              as: Nurse
              captures: { err_missing: $.data.error_id }
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Bad Payer", date_of_birth: "1940-01-01", payer_type: "MEDICARE" }
              as: Nurse
              captures: { err_enum: $.data.error_id }
          assert:
            - "err_missing == ERR_INVALID_REQUEST with HTTP 400 (missing required field)"
            - "err_enum == ERR_INVALID_REQUEST with HTTP 400 (enum outside declared set)"

      - name: home_bed_capacity_bounds_enforced
        claim_type: type_constraints
        grounds:
          - entities.Home.fields.licensed_bed_capacity
          - validations[priority=22]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "licensed_bed_capacity is constrained to 2..6: capacity 7 (above) and capacity 1 (below) are both rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C004", name: "Too Big", licensed_bed_capacity: 7 }
              as: Provider
              captures: { err_high: $.data.error_id }
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C005", name: "Too Small", licensed_bed_capacity: 1 }
              as: Provider
              captures: { err_low: $.data.error_id }
          assert:
            - "err_high == ERR_INVALID_REQUEST with HTTP 400 (7 > 6)"
            - "err_low == ERR_INVALID_REQUEST with HTTP 400 (1 < 2)"

      - name: shift_end_not_after_start_rejected
        claim_type: type_constraints
        grounds:
          - entities.Shift.fields.end_at
          - validations[priority=22]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A shift with end_at == start_at violates 'strictly after' and is rejected 400 even when the OCC caregiver version is correct (malformed-payload check still fires)."
        test_recipe:
          setup:
            - "One home with one ACTIVE caregiver"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C006", name: "Corner Fir", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg Fir", credential_id: "HCA-C006" }
              as: Provider
              captures: { cg_id: $.data.id, cg_v: $.data.version }
          trigger:
            - call: "POST /api/shifts"
              payload: { home_id: "${home_id}", caregiver_id: "${cg_id}", start_at: "2026-06-01T13:00:00Z", end_at: "2026-06-01T13:00:00Z", expected_caregiver_version: "${cg_v}" }
              as: Provider
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST with HTTP 400 (end <= start)"

      - name: get_nonexistent_resources_return_404
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET on a well-formed but unknown UUID returns ERR_NOT_FOUND for both a root-level entity (Home) and a child-collected entity (Resident)."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /api/homes/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Provider
              captures: { err_home: $.data.error_id }
            - call: "GET /api/residents/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: Provider
              captures: { err_res: $.data.error_id }
          assert:
            - "err_home == ERR_NOT_FOUND with HTTP 404"
            - "err_res == ERR_NOT_FOUND with HTTP 404"

      - name: list_beds_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint honors limit/offset and reports total_count plus has_more: 3 beds with limit=2 page into 2+1, and the envelope carries the four pagination fields."
        test_recipe:
          setup:
            - "One home with three beds"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C007", name: "Corner Holly", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1B" }
              as: Provider
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1C" }
              as: Provider
          trigger:
            - call: "GET /api/homes/${home_id}/beds"
              payload: { limit: 2, offset: 0 }
              as: Provider
            - call: "GET /api/homes/${home_id}/beds"
              payload: { limit: 2, offset: 2 }
              as: Provider
          assert:
            - "GET page 1 (limit=2, offset=0) returns 2 Bed items with total_count == 3 and has_more == true"
            - "GET page 2 (limit=2, offset=2) returns 1 Bed item with total_count == 3 and has_more == false"

      - name: medication_log_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.MedicationLog
        distinguishing_aspect: "MedicationLog is common_fields:false — the created row carries id and created_at but no version or updated_at, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Licensed home, ADMITTED resident, ACTIVE order with schedule_times ['08:00'] (window 14:00Z-16:00Z in June PDT)"
            - "Caregiver with a SCHEDULED shift 2026-06-02T13:00Z-2026-06-03T05:00Z covering the administration"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C008", name: "Corner Ivy", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg Ivy", credential_id: "HCA-C008" }
              as: Provider
              captures: { cg_id: $.data.id, cg_v: $.data.version }
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res Log", date_of_birth: "1940-01-01", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 2, adl_dependency_score: 1, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "${bed_id}", assessment_id: "${asm_id}", expected_admission_date: "2026-05-25", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_id: $.data.id }
            - call: "POST /api/admissions/${adm_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/admissions/${adm_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/residents/${res_id}/medication-orders"
              payload: { drug_name: "Lisinopril", dose: "5mg oral", schedule_times: ["08:00"] }
              as: Nurse
              captures: { ord_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { home_id: "${home_id}", caregiver_id: "${cg_id}", start_at: "2026-06-02T13:00:00Z", end_at: "2026-06-03T05:00:00Z", expected_caregiver_version: "${cg_v}" }
              as: Provider
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T14:00:00Z" }
              as: Provider
          trigger:
            - call: "POST /api/medication-logs"
              payload: { resident_id: "${res_id}", order_id: "${ord_id}", administered_at: "2026-06-02T14:30:00Z", outcome: "GIVEN", caregiver_id: "${cg_id}" }
              as: Nurse
              captures: { log_id: $.data.id }
          assert:
            - "MedicationLog.${log_id} created with HTTP 201 and carries id and created_at"
            - "MedicationLog.${log_id} response contains no version and no updated_at field (common_fields: false)"

      - name: admission_with_unknown_bed_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.Admission.fields.bed_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "FK integrity: POST /api/admissions referencing a non-existent bed_id is rejected ERR_NOT_FOUND at existence priority 3, before the OCC version check is evaluated."
        test_recipe:
          setup:
            - "One PROVISIONAL home with one real bed and one APPLICANT resident with a FINALIZED assessment"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C009", name: "Corner Juniper", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res FK", date_of_birth: "1940-01-01", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 2, adl_dependency_score: 1, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
          trigger:
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "11111111-2222-3333-4444-555555555555", assessment_id: "${asm_id}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND with HTTP 404 (unknown bed_id, existence beats OCC)"
  # =========================================================================
  # Section: state_machines (§1.2 claims: valid/invalid transitions,
  # preconditions, side effects, initial state, terminal lockdown)
  # =========================================================================
  - section: state_machines
    instances:
      - name: home_license_requires_bed_and_active_caregiver
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Home.PROVISIONAL_to_LICENSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Licensing a home with no bed and no caregiver violates both PROVISIONAL->LICENSED preconditions and is rejected 409; adding one bed plus one ACTIVE caregiver makes the same call succeed."
        test_recipe:
          setup:
            - "One PROVISIONAL home with no beds and no caregivers"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C101", name: "Pre Lic", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
              captures: { err_id: $.data.error_id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg Lic", credential_id: "HCA-C101" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
              captures: { home_status: $.data.status }
          assert:
            - "err_id == ERR_INVALID_STATE with HTTP 409 (preconditions unmet)"
            - "home_status == LICENSED after bed and caregiver exist"

      - name: home_terminal_closed_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Home.LICENSED_to_CLOSED
          - state_machines.Home.LICENSED_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CLOSED is terminal: after LICENSED->CLOSED (which also pushes the bed OUT_OF_SERVICE), POST suspend is rejected ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "One LICENSED home (census 0) with one bed and one caregiver"
          setup_api_calls:
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C102", name: "Close Lock", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg CL", credential_id: "HCA-C102" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/close"
              payload: {}
              as: Provider
          trigger:
            - call: "POST /api/homes/${home_id}/suspend"
              payload: {}
              as: Provider
              captures: { err_id: $.data.error_id }
            - call: "GET /api/beds/${bed_id}"
              payload: {}
              as: Provider
              captures: { bed_status: $.data.status }
          assert:
            - "Home.${home_id}.status == CLOSED"
            - "bed_status == OUT_OF_SERVICE (closure cascade)"
            - "err_id == ERR_INVALID_STATE with HTTP 409 (no transitions from CLOSED)"

      - name: resident_terminal_discharged_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Resident.ADMITTED_to_DISCHARGED
          - state_machines.Resident.APPLICANT_to_PROSPECT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "DISCHARGED is terminal for Resident: withdraw on a discharged resident is rejected ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Licensed home with one resident admitted then discharged (VOLUNTARY, 30 days notice)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C103", name: "Res Lock", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg RL", credential_id: "HCA-C103" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res Lock", date_of_birth: "1940-01-01", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 2, adl_dependency_score: 1, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "${bed_id}", assessment_id: "${asm_id}", expected_admission_date: "2026-05-25", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_id: $.data.id }
            - call: "POST /api/admissions/${adm_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/admissions/${adm_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/residents/${res_id}/discharge"
              payload: { reason: "VOLUNTARY", notice_days: 30 }
              as: Provider
          trigger:
            - call: "POST /api/residents/${res_id}/withdraw"
              payload: {}
              as: Provider
              captures: { err_id: $.data.error_id }
          assert:
            - "Resident.${res_id}.status == DISCHARGED"
            - "err_id == ERR_INVALID_STATE with HTTP 409 (no transitions from DISCHARGED)"

      - name: invoice_terminal_paid_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Invoice.DRAFT_to_VOID
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PAID is terminal: voiding a fully paid invoice is rejected ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Licensed home, ADMITTED resident (PRIVATE_PAY, LOW band), 1-day invoice [2026-06-01, 2026-06-02) subtotal 15000, issued on time (no late fee), paid in full"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-C104", name: "Inv Lock", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg IL", credential_id: "HCA-C104" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "PRIVATE_PAY", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res Inv", date_of_birth: "1940-01-01", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "${bed_id}", assessment_id: "${asm_id}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_id: $.data.id }
            - call: "POST /api/admissions/${adm_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: Provider
            - call: "POST /api/admissions/${adm_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "GET /api/residents/${res_id}"
              payload: {}
              as: Provider
              captures: { res_v: $.data.version }
            - call: "POST /api/residents/${res_id}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-02", due_date: "2026-06-20", expected_resident_version: "${res_v}" }
              as: Provider
              captures: { inv_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: Provider
            - call: "POST /api/invoices/${inv_id}/issue"
