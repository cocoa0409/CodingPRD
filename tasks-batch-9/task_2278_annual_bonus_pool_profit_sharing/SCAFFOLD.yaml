# =============================================================================
# PRD Benchmark Scaffold — Annual Bonus Pool & Profit Sharing Administration
# Difficulty band: beyond Expert (§0.4) — 12 entities, 59 endpoints,
# 8 state machines (3 cyclic + 1 parallel-dimension), 15 calculations,
# 72 ordered validations, 69 errors, 6 roles, 3 OCC concurrency rules.
# =============================================================================
scenario: "2278. Annual Bonus Pool & Profit Sharing Administration (corporate incentive plan team): plan design with company, business unit and individual performance weightings and funding formulas, target bonus assignment by job level with proration for hires, transfers and leaves, performance metric certification and pool funding approval by the compensation committee, discretionary adjustment authority with governance limits and documentation, manager allocation within a fixed pool with distribution guidelines and calibration review, payout timing, eligibility on the payment date and treatment of terminations, accrual accounting during the year with true-up at settlement, communication and dispute resolution"
domain_name: annual-bonus-pool-profit-sharing
# Flat topology: every resource is a top-level collection linked by explicit
# foreign keys. `api_prefix` is empty so each collection segment is its own root.
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential      # EligibilityEvent.supersedes_event_id -> EligibilityEvent.id
    - cross_aggregate       # BusinessUnitPool aggregates ParticipantAward money into BonusPlan ledgers
  role_model: segregation_of_duties
  consistency_model: immediate

  notes: |
    Core coupling: a fixed pool of money is minted once by a committee vote
    (funding formula over certified metrics), split per business unit by
    per-pool rounding, spent by managers award-by-award under distribution
    guidelines, perturbed by a separately-budgeted discretionary authority,
    accrued monthly against a *forecast* of the same formula, and finally
    trued-up in cash. The same prose supports two readings at four places
    (round-per-pool vs round-on-total, round-per-segment vs round-on-sum,
    forecast vs certified funding basis, strict payment-date eligibility vs
    good-leaver proration); the scaffold pins one reading at each and stores
    the divergence so the wrong reading is observable.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: BonusPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_year
        type: integer
        source: input
        description: "Performance year the plan covers"
        constraints: "1900..2999; unique together with plan_name"
      - name: plan_name
        type: string
        source: input
        description: "Human label of the plan"
      - name: plan_period_start
        type: string
        source: input
        description: "First day of the performance period (inclusive)"
        constraints: "ISO 8601 date YYYY-MM-DD"
      - name: plan_period_end
        type: string
        source: input
        description: "End of the performance period, EXCLUSIVE (half-open [start, end))"
        constraints: "ISO 8601 date; must be exactly 365 days after plan_period_start"
      - name: payment_date
        type: string
        source: input
        description: "Scheduled payout date; eligibility is tested on this date"
        constraints: "ISO 8601 date; must be >= plan_period_end"
      - name: company_weight_pct
        type: number
        source: input
        description: "Weight of the company performance component of the funding formula"
        constraints: "0..100, 2 decimals"
      - name: business_unit_weight_pct
        type: number
        source: input
        description: "Weight of the business-unit component of the funding formula"
        constraints: "0..100, 2 decimals"
      - name: individual_weight_pct
        type: number
        source: input
        description: "Weight of the individual component; funds at exactly 100.00 achievement because individual differentiation happens inside the pool"
        constraints: "0..100, 2 decimals; the three weights must sum to exactly 100.00"
      - name: discretionary_budget_pct
        type: number
        source: input
        description: "Percent of the funded pool reserved for discretionary adjustments"
        default: 10.00
        constraints: "0..25, 2 decimals"
      - name: termination_treatment_policy
        type: enum
        source: input
        description: "Selects which payout variant runs at PayoutRun execute"
        default: STRICT_PAYMENT_DATE
        constraints: "STRICT_PAYMENT_DATE | GOOD_LEAVER_PRORATION"
      - name: status
        type: enum
        source: system
        description: "Plan lifecycle state (see §1.2 BonusPlan)"
        default: DRAFT
        constraints: "DRAFT | TARGETS_SET | PENDING_CERTIFICATION | CERTIFIED | ALLOCATION_OPEN | CALIBRATION_REVIEW | LOCKED | PAID_OUT | SETTLED"
      - name: company_achievement_pct
        type: number
        source: computed
        description: "Weighted company metric achievement; written by calc company_achievement"
        default: 0.00
      - name: bu_weighted_achievement_pct
        type: number
        source: computed
        description: "Target-weighted BU achievement across pools with calibration_status SCORECARD_CERTIFIED"
        default: 0.00
      - name: blended_achievement_pct
        type: number
        source: computed
        description: "Company/BU/individual blended achievement driving the funding curve"
        default: 0.00
      - name: funding_multiplier
        type: number
        source: computed
        description: "Piecewise-linear funding curve output, 4 decimals"
        default: 0.0000
      - name: total_target_cents
        type: integer
        source: computed
        description: "Sum of ParticipantAward.prorated_target_cents where eligibility_status != INELIGIBLE_MIN_SERVICE"
        default: 0
      - name: funded_pool_cents
        type: integer
        source: computed
        description: "Authoritative pool size = SUM of BusinessUnitPool.funded_cents (round per pool, then sum)"
        default: 0
      - name: aggregate_rounding_delta_cents
        type: integer
        source: computed
        description: "round_half_up(total_target_cents * funding_multiplier) - funded_pool_cents; audit-only record of the rounding-order divergence"
        default: 0
      - name: discretionary_budget_cents
        type: integer
        source: computed
        description: "round_half_up(funded_pool_cents * discretionary_budget_pct / 100)"
        default: 0
      - name: discretionary_used_cents
        type: integer
        source: computed
        description: "Sum of abs(adjustment_cents) over DiscretionaryAdjustment with status APPROVED"
        default: 0
      - name: accrued_base_cents
        type: integer
        source: computed
        description: "Cumulative posted accrual before employer burden (sum of AccrualPeriod.period_accrual_cents where status POSTED)"
        default: 0
      - name: accrued_total_cents
        type: integer
        source: computed
        description: "Cumulative posted accrual including burden (sum of AccrualPeriod.total_period_cents where status POSTED)"
        default: 0
      - name: locked_total_cents
        type: integer
        source: computed
        description: "Sum of ParticipantAward.final_award_cents at the moment the plan locked"
        default: 0
      - name: paid_total_cents
        type: integer
        source: computed
        description: "Sum of ParticipantAward.payout_amount_cents where payment_status PAID"
        default: 0
      - name: forfeited_total_cents
        type: integer
        source: computed
        description: "Sum of ParticipantAward.final_award_cents where payment_status FORFEITED"
        default: 0
      - name: dispute_adjustment_cents
        type: integer
        source: computed
        description: "Signed sum of (Dispute.adjusted_amount_cents - award.final_award_cents) over disputes resolved ADJUST"
        default: 0
      - name: settlement_burden_cents
        type: integer
        source: computed
        description: "Employer burden on paid_total_cents computed at settle-true-up"
        default: 0
      - name: true_up_cents
        type: integer
        source: computed
        description: "(paid_total_cents + settlement_burden_cents) - accrued_total_cents; signed"
        default: 0
      - name: over_allocated_pool_count
        type: integer
        source: computed
        description: "Count of BusinessUnitPool of this plan with distribution_status OVER_ALLOCATED"
        default: 0
      - name: under_utilized_pool_count
        type: integer
        source: computed
        description: "Count of BusinessUnitPool of this plan with distribution_status UNDER_UTILIZED"
        default: 0
      - name: governance_posture
        type: enum
        source: computed
        description: "BREACHED if over_allocated_pool_count >= 2; else FLAGGED if over_allocated_pool_count == 1 or under_utilized_pool_count >= 1; else COMPLIANT"
        default: COMPLIANT
        constraints: "COMPLIANT | FLAGGED | BREACHED"
      - name: certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CompensationCommittee member who ran certification-decision CERTIFY; null before certification"
      - name: locked_by_user_id
        type: string
        source: system
        description: "X-User-ID of the CompensationCommittee member who locked the plan; null before lock"

  - name: CompanyMetric
    parent: BonusPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; the plan this metric funds"
      - name: metric_code
        type: string
        source: input
        description: "Metric identifier"
        constraints: "unique per plan_id"
      - name: weight_pct
        type: number
        source: input
        description: "Weight inside the company component"
        constraints: "0.01..100, 2 decimals; weights of a plan must sum to exactly 100.00 before certification"
      - name: threshold_value
        type: number
        source: input
        description: "Value scoring exactly 50.00 achievement"
      - name: target_value
        type: number
        source: input
        description: "Value scoring exactly 100.00 achievement"
        constraints: "> threshold_value"
      - name: max_value
        type: number
        source: input
        description: "Value scoring the 150.00 achievement cap"
        constraints: "> target_value"
      - name: actual_value
        type: number
        source: input
        description: "Audited actual; supplied by POST /company-metrics/{metricId}/actual"
      - name: source_note
        type: string
        source: input
        description: "Provenance note recorded with the actual"
      - name: achievement_pct
        type: number
        source: computed
        description: "Piecewise achievement of actual_value against threshold/target/max, capped at 150.00"
        default: 0.00
      - name: status
        type: enum
        source: system
        description: "DRAFT until an actual is filed, then ACTUAL_ENTERED"
        default: DRAFT
        constraints: "DRAFT | ACTUAL_ENTERED"

  - name: BusinessUnit
    parent: null
    common_fields: true
    fields:
      - name: unit_code
        type: string
        source: input
        description: "Short code of the business unit"
        constraints: "globally unique"
      - name: name
        type: string
        source: input
        description: "Business unit display name"

  - name: JobLevelTarget
    parent: BonusPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan whose job-level grid this row belongs to"
      - name: job_level
        type: string
        source: input
        description: "Job level code (e.g. L3, L5)"
        constraints: "unique per plan_id"
      - name: target_bonus_pct
        type: number
        source: input
        description: "Target bonus as percent of annual base salary for this level"
        constraints: "0.01..200, 2 decimals"
      - name: guideline_min_ratio
        type: number
        source: input
        description: "Minimum allowed proposed_allocation_cents / prorated_target_cents for a non-zero allocation at this level"
        constraints: "0..5, 2 decimals"
      - name: guideline_max_ratio
        type: number
        source: input
        description: "Maximum allowed proposed_allocation_cents / prorated_target_cents at this level"
        constraints: "> guideline_min_ratio, <= 5, 2 decimals"

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan the employee participates in"
      - name: business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; business unit at hire / at plan entry"
      - name: employee_code
        type: string
        source: input
        description: "Employee identifier"
        constraints: "unique per plan_id"
      - name: full_name
        type: string
        source: input
        description: "Employee name used in award communication"
      - name: job_level
        type: string
        source: input
        description: "Job level at plan entry; must match a JobLevelTarget.job_level of the plan"
      - name: base_salary_cents
        type: integer
        source: input
        description: "Annual base salary in cents at plan entry"
        constraints: ">= 1"
      - name: hire_date
        type: string
        source: input
        description: "Hire date (inclusive first credited day)"
        constraints: "ISO 8601 date"
      - name: employment_status
        type: enum
        source: system
        description: "Driven by EligibilityEvent stream"
        default: ACTIVE
        constraints: "ACTIVE | ON_LEAVE | TERMINATED"
      - name: termination_date
        type: string
        source: system
        description: "Last day worked, set by a TERMINATION EligibilityEvent; null while employed"
      - name: termination_reason
        type: enum
        source: system
        description: "Reason recorded on the TERMINATION event"
        constraints: "VOLUNTARY_RESIGNATION | TERMINATED_FOR_CAUSE | REDUNDANCY | RETIREMENT | DEATH | DISABILITY"
      - name: current_job_level
        type: string
        source: computed
        description: "Job level in effect on the last credited day of the participation window"
      - name: current_base_salary_cents
        type: integer
        source: computed
        description: "Base salary in effect on the last credited day of the participation window"
      - name: current_business_unit_id
        type: string
        source: computed
        description: "FK -> BusinessUnit.id; business unit in effect on the last credited day of the participation window"

  - name: EligibilityEvent
    parent: Participant
    common_fields: false
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; subject of the event"
      - name: event_type
        type: enum
        source: input
        description: "Kind of eligibility event"
        constraints: "TRANSFER | LEAVE | TERMINATION"
      - name: effective_date
        type: string
        source: input
        description: "TRANSFER: first day at the new level/salary/unit. LEAVE: first day of leave. TERMINATION: last day worked."
        constraints: "ISO 8601 date; within [plan_period_start, plan_period_end) and >= Participant.hire_date"
      - name: new_job_level
        type: string
        source: input
        description: "TRANSFER only: job level from effective_date onward"
      - name: new_base_salary_cents
        type: integer
        source: input
        description: "TRANSFER only: base salary from effective_date onward"
        constraints: ">= 1 when present"
      - name: new_business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; TRANSFER only: business unit from effective_date onward"
      - name: leave_end_date
        type: string
        source: input
        description: "LEAVE only: last day of leave (INCLUSIVE); the occupied interval is [effective_date, leave_end_date + 1 day)"
        constraints: "ISO 8601 date >= effective_date; required when event_type == LEAVE"
      - name: paid_leave
        type: boolean
        source: input
        description: "LEAVE only: paid leave days are always fully credited; unpaid leave days consume the 30-day credit cap"
        default: false
      - name: termination_reason
        type: enum
        source: input
        description: "TERMINATION only"
        constraints: "VOLUNTARY_RESIGNATION | TERMINATED_FOR_CAUSE | REDUNDANCY | RETIREMENT | DEATH | DISABILITY; required when event_type == TERMINATION"
      - name: supersedes_event_id
        type: string
        source: input
        description: "FK -> EligibilityEvent.id; when set, the named event is excluded from every proration input set (data correction)"
      - name: superseded
        type: boolean
        source: computed
        description: "true when a later EligibilityEvent names this row in supersedes_event_id"
        default: false
      - name: note
        type: string
        source: input
        description: "Free-text audit note"

  - name: BusinessUnitPool
    parent: BonusPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan being funded"
      - name: business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; unit whose scorecard and allocation pool this row is"
        constraints: "unique together with plan_id"
      - name: bu_metric_achievement_pct
        type: number
        source: input
        description: "Business-unit scorecard achievement, capped at 150.00 when it enters the funding formula"
        constraints: "0..200, 2 decimals"
      - name: scorecard_narrative
        type: string
        source: input
        description: "Manager narrative supporting the scorecard"
      - name: calibration_status
        type: enum
        source: system
        description: "Pool lifecycle (see §1.2 BusinessUnitPool)"
        default: DRAFT
        constraints: "DRAFT | SCORECARD_SUBMITTED | SCORECARD_CERTIFIED | FUNDED | ALLOCATING | CALIBRATION_SUBMITTED | CALIBRATED | LOCKED"
      - name: eligible_target_cents
        type: integer
        source: computed
        description: "Sum of ParticipantAward.prorated_target_cents for awards with bu_pool_id == this pool and eligibility_status != INELIGIBLE_MIN_SERVICE"
        default: 0
      - name: eligible_headcount
        type: integer
        source: computed
        description: "Count of those same awards"
        default: 0
      - name: funded_cents
        type: integer
        source: computed
        description: "round_half_up(eligible_target_cents * BonusPlan.funding_multiplier); frozen at fund-pool and never re-derived afterwards"
        default: 0
      - name: allocated_cents
        type: integer
        source: computed
        description: "Sum of (proposed_allocation_cents + adjustment_total_cents) over awards of this pool with allocation_status IN {PROPOSED, CALIBRATED, LOCKED}"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "funded_cents - allocated_cents; may be negative when discretionary adjustments overshoot"
        default: 0
      - name: min_utilization_cents
        type: integer
        source: computed
        description: "floor(funded_cents * 9950 / 10000) — the utilization floor below which the pool is UNDER_UTILIZED"
        default: 0
      - name: utilization_pct
        type: number
        source: computed
        description: "round_half_up(allocated_cents * 10000 / funded_cents) / 100, display only; 0.00 when funded_cents == 0"
        default: 0.00
      - name: top_tier_award_count
        type: integer
        source: computed
        description: "Count of awards of this pool with allocation_ratio >= 1.50 and allocation_status IN {PROPOSED, CALIBRATED, LOCKED}"
        default: 0
      - name: max_top_tier_count
        type: integer
        source: computed
        description: "max(1, floor(eligible_headcount * 25 / 100))"
        default: 0
      - name: distribution_status
        type: enum
        source: computed
        description: "NO_ELIGIBLE_PARTICIPANTS when eligible_headcount == 0; OVER_ALLOCATED when allocated_cents > funded_cents; UNDER_UTILIZED when allocated_cents < min_utilization_cents; else WITHIN_GUIDELINES"
        default: NO_ELIGIBLE_PARTICIPANTS
        constraints: "NO_ELIGIBLE_PARTICIPANTS | UNDER_UTILIZED | WITHIN_GUIDELINES | OVER_ALLOCATED"
      - name: calibration_returned_count
        type: integer
        source: computed
        description: "Number of times calibration-decision RETURN sent this pool back to ALLOCATING"
        default: 0
      - name: scorecard_certified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the committee member who certified the scorecard; null before certification"

  - name: ParticipantAward
    parent: BusinessUnitPool
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan the award belongs to"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; award subject"
      - name: business_unit_id
        type: string
        source: input
        description: "FK -> BusinessUnit.id; unit in effect on the last credited day of the participation window"
      - name: bu_pool_id
        type: string
        source: input
        description: "FK -> BusinessUnitPool.id; pool the allocation is drawn from"
      - name: target_bonus_pct
        type: number
        source: computed
        description: "JobLevelTarget.target_bonus_pct of the level in effect on the last credited day (display copy)"
        default: 0.00
      - name: credited_days
        type: integer
        source: computed
        description: "Total credited days across all participation segments"
        default: 0
      - name: excluded_leave_days
        type: integer
        source: computed
        description: "Unpaid leave days beyond the 30-day credit cap, excluded from proration"
        default: 0
      - name: segment_count
        type: integer
        source: computed
        description: "Number of participation segments the proration was rounded over"
        default: 0
      - name: prorated_target_cents
        type: integer
        source: computed
        description: "Sum of per-segment rounded targets (round per segment, then sum); 0 when INELIGIBLE_MIN_SERVICE"
        default: 0
      - name: eligibility_status
        type: enum
        source: computed
        description: "INELIGIBLE_MIN_SERVICE when credited_days < 90; GOOD_LEAVER / BAD_LEAVER once terminated; else ELIGIBLE"
        default: ELIGIBLE
        constraints: "ELIGIBLE | INELIGIBLE_MIN_SERVICE | GOOD_LEAVER | BAD_LEAVER"
      - name: allocation_status
        type: enum
        source: system
        description: "Allocation dimension of the parallel state machine"
        default: UNALLOCATED
        constraints: "UNALLOCATED | PROPOSED | CALIBRATED | LOCKED"
      - name: payment_status
        type: enum
        source: system
        description: "Payment dimension of the parallel state machine; evolves independently of allocation_status"
        default: PENDING
        constraints: "PENDING | DEFERRED | PAID | FORFEITED"
      - name: proposed_allocation_cents
        type: integer
        source: system
        description: "Manager allocation inside the fixed pool"
        default: 0
      - name: allocation_ratio
        type: number
        source: computed
        description: "round_half_up(proposed_allocation_cents / prorated_target_cents, 4); 0.0000 when prorated_target_cents == 0"
        default: 0.0000
      - name: adjustment_total_cents
        type: integer
        source: computed
        description: "Signed sum of adjustment_cents over DiscretionaryAdjustment of this award with status APPROVED"
        default: 0
      - name: final_award_cents
        type: integer
        source: computed
        description: "proposed_allocation_cents + adjustment_total_cents"
        default: 0
      - name: payout_amount_cents
        type: integer
        source: computed
        description: "Cash actually paid, written by PayoutRun execute and by dispute resolution"
        default: 0
      - name: allocation_rationale
        type: string
        source: system
        description: "Rationale captured with the latest propose-allocation"
      - name: retraction_count
        type: integer
        source: computed
        description: "Number of successful retract-allocation calls on this award"
        default: 0

  - name: DiscretionaryAdjustment
    parent: ParticipantAward
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan whose discretionary budget is drawn on"
      - name: award_id
        type: string
        source: input
        description: "FK -> ParticipantAward.id; award being adjusted"
      - name: adjustment_cents
        type: integer
        source: input
        description: "Signed adjustment applied to the award on approval"
        constraints: "non-zero integer"
      - name: justification
        type: string
        source: input
        description: "Mandatory business justification"
        constraints: "min length 1"
      - name: documentation_ref
        type: string
        source: input
        description: "Reference to the filed governance documentation; required when abs(adjustment_cents) > 100000"
      - name: per_award_cap_cents
        type: integer
        source: computed
        description: "max(50000, round_half_up(award.prorated_target_cents * 25 / 100)) frozen at creation time"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Adjustment lifecycle (see §1.2 DiscretionaryAdjustment)"
        default: PENDING_APPROVAL
        constraints: "PENDING_APPROVAL | APPROVED | REJECTED | REVERSED"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the creator; opaque operator id, compared against the approver for segregation of duties"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the committee member who approved/rejected; null while PENDING_APPROVAL"
      - name: decision_note
        type: string
        source: system
        description: "Note supplied with the decision or the reversal"

  - name: AccrualPeriod
    parent: BonusPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan being accrued"
      - name: period_start
        type: string
        source: input
        description: "First day of the accrual period (INCLUSIVE)"
        constraints: "ISO 8601 date; must equal plan_period_start for the first period, else previous period_end + 1 day"
      - name: period_end
        type: string
        source: input
        description: "Last day of the accrual period (INCLUSIVE)"
        constraints: "ISO 8601 date >= period_start and < plan_period_end + 1 day"
      - name: forecast_company_achievement_pct
        type: number
        source: input
        description: "Forecast company achievement used by the provisional funding variant"
        constraints: "0..200, 2 decimals"
      - name: status
        type: enum
        source: system
        description: "OPEN | POSTED | REVERSED (see §1.2 AccrualPeriod)"
        default: OPEN
        constraints: "OPEN | POSTED | REVERSED"
      - name: provisional_target_basis
        type: enum
        source: computed
        description: "AWARD_PRORATED when the plan has ParticipantAward rows, else PARTICIPANT_UNPRORATED"
        constraints: "AWARD_PRORATED | PARTICIPANT_UNPRORATED"
      - name: provisional_pool_cents
        type: integer
        source: computed
        description: "Forecast pool size under the provisional funding variant"
        default: 0
      - name: elapsed_days
        type: integer
        source: computed
        description: "Days from plan_period_start to period_end inclusive"
        default: 0
      - name: cumulative_accrual_target_cents
        type: integer
        source: computed
        description: "round_half_up(provisional_pool_cents * elapsed_days / 365)"
        default: 0
      - name: period_accrual_cents
        type: integer
        source: computed
        description: "cumulative_accrual_target_cents - BonusPlan.accrued_base_cents at posting time; may be negative"
        default: 0
      - name: burden_rate_pct
        type: number
        source: computed
        description: "Employer burden rate selected from cumulative_accrual_target_cents BEFORE burden is added"
        default: 0.00
      - name: burden_cents
        type: integer
        source: computed
        description: "round_half_up(period_accrual_cents * burden_rate_pct / 100)"
        default: 0
      - name: total_period_cents
        type: integer
        source: computed
        description: "period_accrual_cents + burden_cents"
        default: 0
      - name: posting_note
        type: string
        source: system
        description: "Note supplied at posting"
      - name: reversal_reason
        type: string
        source: system
        description: "Note supplied at reversal"

  - name: PayoutRun
    parent: BonusPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan being paid"
      - name: run_note
        type: string
        source: input
        description: "Operator note for the run"
      - name: status
        type: enum
        source: system
        description: "DRAFT | EXECUTED | SETTLED"
        default: DRAFT
        constraints: "DRAFT | EXECUTED | SETTLED"
      - name: payment_date_used
        type: string
        source: computed
        description: "Logical-clock date the run executed on"
      - name: paid_award_count
        type: integer
        source: computed
        description: "Awards moved to payment_status PAID by this run"
        default: 0
      - name: deferred_award_count
        type: integer
        source: computed
        description: "Awards moved to payment_status DEFERRED because a dispute was OPEN or UNDER_REVIEW"
        default: 0
      - name: forfeited_award_count
        type: integer
        source: computed
        description: "Awards moved to payment_status FORFEITED by the active payout variant"
        default: 0
      - name: total_paid_cents
        type: integer
        source: computed
        description: "Sum of payout_amount_cents over awards this run set to PAID"
        default: 0
      - name: total_forfeited_cents
        type: integer
        source: computed
        description: "Sum of final_award_cents over awards this run set to FORFEITED"
        default: 0
      - name: settlement_burden_cents
        type: integer
        source: computed
        description: "Employer burden on BonusPlan.paid_total_cents, written at settle-true-up"
        default: 0
      - name: true_up_cents
        type: integer
        source: computed
        description: "Signed true-up written at settle-true-up; mirrors BonusPlan.true_up_cents"
        default: 0
      - name: settlement_note
        type: string
        source: system
        description: "Note supplied at settlement"

  - name: Dispute
    parent: ParticipantAward
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> BonusPlan.id; plan of the disputed award"
      - name: award_id
        type: string
        source: input
        description: "FK -> ParticipantAward.id; award being disputed"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the filing employee"
      - name: dispute_reason
        type: string
        source: input
        description: "Employee statement of the dispute"
      - name: claimed_amount_cents
        type: integer
        source: input
        description: "Amount the employee believes is owed"
        constraints: ">= 0 when present"
      - name: status
        type: enum
        source: system
        description: "OPEN | UNDER_REVIEW | RESOLVED_UPHELD | RESOLVED_ADJUSTED"
        default: OPEN
        constraints: "OPEN | UNDER_REVIEW | RESOLVED_UPHELD | RESOLVED_ADJUSTED"
      - name: reviewer_note
        type: string
        source: system
        description: "Note captured at assign-review"
      - name: resolution
        type: enum
        source: system
        description: "UPHOLD keeps the award as-is; ADJUST overrides the payout"
        constraints: "UPHOLD | ADJUST"
      - name: adjusted_amount_cents
        type: integer
        source: system
        description: "Payout written to the award when resolution == ADJUST"
      - name: resolution_note
        type: string
        source: system
        description: "Note captured at resolve"
      - name: assigned_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HRBusinessPartner who took the dispute under review"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the HRBusinessPartner who resolved the dispute"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: BonusPlan
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: TARGETS_SET
        trigger: "POST /bonus-plans/{planId}/target-assignments"
        actor: PlanAdmin
        preconditions:
          - "plan.status == DRAFT"
          - "at least one JobLevelTarget exists for plan_id"
          - "at least one BusinessUnitPool exists for plan_id"
          - "at least one Participant exists for plan_id"
          - "every Participant.current_job_level of the plan matches a JobLevelTarget.job_level of the plan, else ERR_JOB_LEVEL_TARGET_MISSING"
        side_effects:
          - "For every Participant of the plan, create (or refresh) exactly one ParticipantAward: runs calc participant_prorated_target, writing credited_days, excluded_leave_days, segment_count, prorated_target_cents, target_bonus_pct, eligibility_status"
          - "Sets award.business_unit_id and award.bu_pool_id from the BusinessUnit in effect on the last credited day of the participation window (calc award_pool_assignment)"
          - "Because award rows changed, each BusinessUnitPool recomputes eligible_target_cents, eligible_headcount, max_top_tier_count, allocated_cents, available_cents, distribution_status (calc pool_distribution_state)"
          - "Because pool.eligible_target_cents changed, plan.total_target_cents = SUM of pool.eligible_target_cents over pools of the plan"
      - from: TARGETS_SET
        to: TARGETS_SET
        trigger: "POST /bonus-plans/{planId}/target-assignments (re-run after eligibility events)"
        actor: PlanAdmin
        preconditions:
          - "plan.status == TARGETS_SET"
        side_effects:
          - "Same recompute chain as DRAFT -> TARGETS_SET; existing ParticipantAward rows are updated in place (id preserved, version incremented) and awards whose participant no longer exists are untouched"
        note: "Self-transition; the only way to refresh proration after TRANSFER/LEAVE corrections before certification."
      - from: TARGETS_SET
        to: PENDING_CERTIFICATION
        trigger: "POST /bonus-plans/{planId}/submit-for-certification"
        actor: PlanAdmin
        preconditions:
          - "plan.status == TARGETS_SET"
          - "SUM of CompanyMetric.weight_pct over the plan == 100.00 exactly, else ERR_METRIC_WEIGHTS_INVALID"
          - "every CompanyMetric of the plan has status ACTUAL_ENTERED, else ERR_METRICS_NOT_ALL_ACTUALIZED"
          - "every BusinessUnitPool of the plan has calibration_status == SCORECARD_CERTIFIED, else ERR_SCORECARDS_NOT_ALL_CERTIFIED"
          - "plan.total_target_cents > 0, else ERR_NO_ELIGIBLE_PARTICIPANTS"
        side_effects:
          - "No money fields change; plan.version increments"
      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /bonus-plans/{planId}/certification-decision with decision=CERTIFY"
        actor: CompensationCommittee
        preconditions:
          - "plan.status == PENDING_CERTIFICATION"
        side_effects:
          - "Runs calc company_achievement -> plan.company_achievement_pct"
          - "Runs calc bu_weighted_achievement -> plan.bu_weighted_achievement_pct (pools with calibration_status SCORECARD_CERTIFIED only)"
          - "Runs calc blended_achievement -> plan.blended_achievement_pct, then calc funding_curve_multiplier -> plan.funding_multiplier"
          - "plan.certified_by_user_id = X-User-ID of the acting committee member"
      - from: PENDING_CERTIFICATION
        to: TARGETS_SET
        trigger: "POST /bonus-plans/{planId}/certification-decision with decision=RETURN"
        actor: CompensationCommittee
        preconditions:
          - "plan.status == PENDING_CERTIFICATION"
        side_effects:
          - "Every BusinessUnitPool of the plan with calibration_status SCORECARD_CERTIFIED moves back to DRAFT and clears scorecard_certified_by_user_id"
          - "Because those pools left SCORECARD_CERTIFIED, the certified-pool input set of calc bu_weighted_achievement becomes empty, so plan.bu_weighted_achievement_pct, plan.blended_achievement_pct and plan.funding_multiplier are reset to 0.00 / 0.00 / 0.0000"
          - "plan.certified_by_user_id is cleared"
        note: "Revision cycle: the plan returns to TARGETS_SET and every scorecard must be resubmitted."
      - from: CERTIFIED
        to: ALLOCATION_OPEN
        trigger: "POST /bonus-plans/{planId}/fund-pool"
        actor: CompensationCommittee
        preconditions:
          - "plan.status == CERTIFIED"
          - "plan.funding_multiplier > 0.0000, else ERR_FUNDING_MULTIPLIER_ZERO"
        side_effects:
          - "Runs calc pool_funding_split: for each BusinessUnitPool, funded_cents = round_half_up(eligible_target_cents * plan.funding_multiplier) and min_utilization_cents = floor(funded_cents * 9950 / 10000); the pool moves SCORECARD_CERTIFIED -> FUNDED"
          - "plan.funded_pool_cents = SUM of the per-pool funded_cents just written (round per pool, then sum)"
          - "plan.aggregate_rounding_delta_cents = round_half_up(plan.total_target_cents * plan.funding_multiplier) - plan.funded_pool_cents"
          - "plan.discretionary_budget_cents = round_half_up(plan.funded_pool_cents * plan.discretionary_budget_pct / 100)"
          - "Because each pool now has funded_cents > 0 while allocated_cents == 0, calc pool_distribution_state sets its distribution_status to UNDER_UTILIZED (pools with eligible_headcount == 0 stay NO_ELIGIBLE_PARTICIPANTS)"
          - "Because pool.distribution_status changed, plan.under_utilized_pool_count is recomputed and plan.governance_posture becomes FLAGGED while any pool is UNDER_UTILIZED"
      - from: ALLOCATION_OPEN
        to: CALIBRATION_REVIEW
        trigger: "POST /bonus-plans/{planId}/open-calibration"
        actor: PlanAdmin
        preconditions:
          - "plan.status == ALLOCATION_OPEN"
          - "every BusinessUnitPool of the plan has calibration_status IN {CALIBRATION_SUBMITTED, CALIBRATED}, else ERR_POOL_CALIBRATION_PENDING"
        side_effects:
          - "plan.version increments; no money field changes"
      - from: CALIBRATION_REVIEW
        to: ALLOCATION_OPEN
        trigger: "system: cascade of POST /bu-pools/{poolId}/calibration-decision with decision=RETURN"
        actor: system
        preconditions:
          - "plan.status == CALIBRATION_REVIEW at the moment a pool of this plan is returned to ALLOCATING"
        side_effects:
          - "plan.status reverts to ALLOCATION_OPEN so the returned pool can be reallocated"
        note: "Bubble-up revision cycle; the plan can traverse ALLOCATION_OPEN -> CALIBRATION_REVIEW -> ALLOCATION_OPEN any number of times."
      - from: CALIBRATION_REVIEW
        to: LOCKED
        trigger: "POST /bonus-plans/{planId}/lock"
        actor: CompensationCommittee
        preconditions:
          - "plan.status == CALIBRATION_REVIEW"
          - "every BusinessUnitPool of the plan has calibration_status == CALIBRATED, else ERR_POOL_CALIBRATION_PENDING"
          - "plan.governance_posture == COMPLIANT, else ERR_GOVERNANCE_POSTURE_BREACHED"
          - "X-User-ID != plan.certified_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Every BusinessUnitPool of the plan moves CALIBRATED -> LOCKED"
          - "Because each pool locked, every ParticipantAward of that pool with allocation_status CALIBRATED moves to LOCKED"
          - "plan.locked_total_cents = SUM of ParticipantAward.final_award_cents over awards with allocation_status LOCKED"
          - "plan.locked_by_user_id = X-User-ID"
      - from: LOCKED
        to: PAID_OUT
        trigger: "system: cascade of POST /payout-runs/{payoutRunId}/execute"
        actor: system
        preconditions:
          - "plan.status == LOCKED"
        side_effects:
          - "plan.paid_total_cents and plan.forfeited_total_cents are written from the run's per-award verdicts"
      - from: PAID_OUT
        to: SETTLED
        trigger: "POST /payout-runs/{payoutRunId}/settle-true-up"
        actor: FinanceController
        preconditions:
          - "plan.status == PAID_OUT"
          - "no ParticipantAward of the plan has payment_status DEFERRED, else ERR_DEFERRED_AWARDS_PENDING"
        side_effects:
          - "Runs calc settlement_true_up -> plan.settlement_burden_cents, plan.true_up_cents"

  - entity: CompanyMetric
    initial_state: DRAFT
    terminal_states: [ACTUAL_ENTERED]
    transitions:
      - from: DRAFT
        to: ACTUAL_ENTERED
        trigger: "POST /company-metrics/{metricId}/actual"
        actor: PlanAdmin
        preconditions:
          - "metric.status == DRAFT, else ERR_METRIC_ACTUAL_ALREADY_FILED"
          - "plan.status IN {DRAFT, TARGETS_SET}, else ERR_PLAN_NOT_IN_SETUP"
        side_effects:
          - "Runs calc metric_achievement -> metric.achievement_pct (capped at 150.00)"

  - entity: BusinessUnitPool
    initial_state: DRAFT
    terminal_states: [LOCKED]
    transitions:
      - from: DRAFT
        to: SCORECARD_SUBMITTED
        trigger: "POST /bu-pools/{poolId}/submit-scorecard"
        actor: BusinessUnitManager
        preconditions:
          - "pool.calibration_status == DRAFT"
          - "plan.status IN {DRAFT, TARGETS_SET}, else ERR_PLAN_NOT_IN_SETUP"
          - "X-User-ID == pool.business_unit_id, else ERR_FORBIDDEN_RESOURCE_OWNERSHIP"
        side_effects:
          - "pool.bu_metric_achievement_pct and pool.scorecard_narrative are overwritten with the submitted values"
      - from: SCORECARD_SUBMITTED
        to: SCORECARD_CERTIFIED
        trigger: "POST /bu-pools/{poolId}/scorecard-decision with decision=CERTIFY"
        actor: CompensationCommittee
        preconditions:
          - "pool.calibration_status == SCORECARD_SUBMITTED"
        side_effects:
          - "pool.scorecard_certified_by_user_id = X-User-ID"
      - from: SCORECARD_SUBMITTED
        to: DRAFT
        trigger: "POST /bu-pools/{poolId}/scorecard-decision with decision=RETURN"
        actor: CompensationCommittee
        preconditions:
          - "pool.calibration_status == SCORECARD_SUBMITTED"
        side_effects:
          - "pool.scorecard_certified_by_user_id is cleared"
        note: "Scorecard revision cycle DRAFT -> SCORECARD_SUBMITTED -> DRAFT."
      - from: SCORECARD_CERTIFIED
        to: DRAFT
        trigger: "system: cascade of POST /bonus-plans/{planId}/certification-decision with decision=RETURN"
        actor: system
        preconditions:
          - "pool.calibration_status == SCORECARD_CERTIFIED"
          - "plan.status == PENDING_CERTIFICATION at the moment of the RETURN"
        side_effects:
          - "pool.scorecard_certified_by_user_id is cleared; the scorecard must be resubmitted and re-certified before the plan can be submitted again"
        note: "Second, longer scorecard revision cycle: SCORECARD_CERTIFIED -> DRAFT is reachable only through the plan-level RETURN, never through scorecard-decision."
      - from: SCORECARD_CERTIFIED
        to: FUNDED
        trigger: "system: cascade of POST /bonus-plans/{planId}/fund-pool"
        actor: system
        preconditions:
          - "pool.calibration_status == SCORECARD_CERTIFIED"
        side_effects:
          - "pool.funded_cents, pool.min_utilization_cents, pool.available_cents written; distribution_status recomputed"
      - from: FUNDED
        to: ALLOCATING
        trigger: "system: cascade of the first successful POST /participant-awards/{awardId}/propose-allocation against an award of this pool"
        actor: system
        preconditions:
          - "pool.calibration_status == FUNDED"
        side_effects:
          - "pool.allocated_cents / available_cents / utilization_pct / top_tier_award_count / distribution_status recomputed by calc pool_distribution_state"
      - from: FUNDED
        to: CALIBRATION_SUBMITTED
        trigger: "POST /bu-pools/{poolId}/submit-calibration"
        actor: BusinessUnitManager
        preconditions:
          - "pool.calibration_status == FUNDED"
          - "plan.status == ALLOCATION_OPEN, else ERR_PLAN_NOT_IN_ALLOCATION"
          - "pool.distribution_status == NO_ELIGIBLE_PARTICIPANTS, else ERR_POOL_NOT_WITHIN_GUIDELINES"
          - "X-User-ID == pool.business_unit_id, else ERR_FORBIDDEN_RESOURCE_OWNERSHIP"
        side_effects:
          - "pool.version increments; no award changes (the pool has no eligible awards)"
        note: "Empty-pool short circuit: a unit with zero eligible participants calibrates directly from FUNDED."
      - from: ALLOCATING
        to: CALIBRATION_SUBMITTED
        trigger: "POST /bu-pools/{poolId}/submit-calibration"
        actor: BusinessUnitManager
        preconditions:
          - "pool.calibration_status == ALLOCATING"
          - "plan.status == ALLOCATION_OPEN, else ERR_PLAN_NOT_IN_ALLOCATION"
          - "X-User-ID == pool.business_unit_id, else ERR_FORBIDDEN_RESOURCE_OWNERSHIP"
          - "pool.distribution_status IN {WITHIN_GUIDELINES, NO_ELIGIBLE_PARTICIPANTS}, else ERR_POOL_NOT_WITHIN_GUIDELINES"
          - "pool.top_tier_award_count <= pool.max_top_tier_count, else ERR_TOP_TIER_CONCENTRATION"
        side_effects:
          - "pool.version increments"
      - from: CALIBRATION_SUBMITTED
        to: CALIBRATED
        trigger: "POST /bu-pools/{poolId}/calibration-decision with decision=CERTIFY"
        actor: PlanAdmin
        preconditions:
          - "pool.calibration_status == CALIBRATION_SUBMITTED"
          - "pool.distribution_status IN {WITHIN_GUIDELINES, NO_ELIGIBLE_PARTICIPANTS}, else ERR_POOL_NOT_WITHIN_GUIDELINES"
        side_effects:
          - "Every ParticipantAward of this pool with allocation_status PROPOSED moves to CALIBRATED"
      - from: CALIBRATION_SUBMITTED
        to: ALLOCATING
        trigger: "POST /bu-pools/{poolId}/calibration-decision with decision=RETURN"
        actor: PlanAdmin
        preconditions:
          - "pool.calibration_status == CALIBRATION_SUBMITTED"
        side_effects:
          - "pool.calibration_returned_count += 1"
          - "Because the pool reopened, every ParticipantAward of this pool with allocation_status CALIBRATED moves back to PROPOSED"
          - "Because the pool left CALIBRATION_SUBMITTED while plan.status == CALIBRATION_REVIEW, the plan reverts to ALLOCATION_OPEN"
        note: "Calibration revision cycle ALLOCATING -> CALIBRATION_SUBMITTED -> ALLOCATING."
      - from: CALIBRATED
        to: ALLOCATING
        trigger: "POST /bu-pools/{poolId}/calibration-decision with decision=RETURN"
        actor: PlanAdmin
        preconditions:
          - "pool.calibration_status == CALIBRATED"
          - "plan.status IN {ALLOCATION_OPEN, CALIBRATION_REVIEW}, else ERR_PLAN_NOT_IN_ALLOCATION"
        side_effects:
          - "pool.calibration_returned_count += 1"
          - "Every ParticipantAward of this pool with allocation_status CALIBRATED moves back to PROPOSED"
          - "Because the pool left CALIBRATED while plan.status == CALIBRATION_REVIEW, the plan reverts to ALLOCATION_OPEN"
      - from: CALIBRATED
        to: LOCKED
        trigger: "system: cascade of POST /bonus-plans/{planId}/lock"
        actor: system
        preconditions:
          - "pool.calibration_status == CALIBRATED"
        side_effects:
          - "Awards of this pool with allocation_status CALIBRATED move to LOCKED"

  - entity: ParticipantAward
    initial_state: UNALLOCATED
    terminal_states: []
    note: |
      PARALLEL STATE DIMENSIONS on one row: `allocation_status`
      (UNALLOCATED -> PROPOSED -> CALIBRATED -> LOCKED, with retract and
      calibration-return cycles) and `payment_status`
      (PENDING -> DEFERRED|PAID|FORFEITED) evolve independently. The
      allocation axis is driven by managers and the calibration workflow; the
      payment axis is driven exclusively by PayoutRun execution and dispute
      resolution. `eligibility_status` is a computed classification, not a
      state axis.
    transitions:
      - from: "allocation_status=UNALLOCATED"
        to: "allocation_status=PROPOSED"
        trigger: "POST /participant-awards/{awardId}/propose-allocation"
        actor: BusinessUnitManager
        preconditions:
          - "award.allocation_status == UNALLOCATED"
          - "plan.status == ALLOCATION_OPEN, else ERR_PLAN_NOT_IN_ALLOCATION"
          - "pool.calibration_status IN {FUNDED, ALLOCATING}, else ERR_POOL_NOT_ALLOCATING"
          - "X-User-ID == award.business_unit_id, else ERR_FORBIDDEN_RESOURCE_OWNERSHIP"
          - "award.eligibility_status IN {ELIGIBLE, GOOD_LEAVER}, else ERR_AWARD_NOT_ELIGIBLE"
          - "expected_pool_version == pool.version, else ERR_STALE_POOL_VERSION"
          - "guideline_min_ratio <= proposed ratio <= guideline_max_ratio for a non-zero amount, else ERR_GUIDELINE_RATIO_BREACH"
          - "pool.allocated_cents (after this allocation) <= pool.funded_cents, else ERR_POOL_FUNDS_EXCEEDED"
        side_effects:
          - "award.proposed_allocation_cents, allocation_rationale, allocation_ratio, final_award_cents written"
          - "Because the award now counts as allocated, pool.allocated_cents / available_cents / utilization_pct / top_tier_award_count / distribution_status are recomputed and pool.version increments"
          - "Because pool.distribution_status changed, plan.over_allocated_pool_count / under_utilized_pool_count and plan.governance_posture are recomputed"
          - "If the pool was FUNDED it auto-transitions to ALLOCATING"
      - from: "allocation_status=PROPOSED"
        to: "allocation_status=PROPOSED"
        trigger: "POST /participant-awards/{awardId}/propose-allocation (revised amount)"
        actor: BusinessUnitManager
        preconditions:
          - "same preconditions as UNALLOCATED -> PROPOSED, with pool capacity evaluated after removing this award's previous proposed_allocation_cents"
        side_effects:
          - "Replaces proposed_allocation_cents and re-runs the same pool and plan recompute chain"
        note: "Self-transition: re-proposing is the normal way a manager rebalances inside a fixed pool."
      - from: "allocation_status=PROPOSED"
        to: "allocation_status=UNALLOCATED"
        trigger: "POST /participant-awards/{awardId}/retract-allocation"
        actor: BusinessUnitManager
        preconditions:
          - "award.allocation_status == PROPOSED"
          - "plan.status == ALLOCATION_OPEN, else ERR_PLAN_NOT_IN_ALLOCATION"
          - "X-User-ID == award.business_unit_id, else ERR_FORBIDDEN_RESOURCE_OWNERSHIP"
          - "expected_pool_version == pool.version, else ERR_STALE_POOL_VERSION"
          - "award.adjustment_total_cents == 0, else ERR_AWARD_HAS_APPROVED_ADJUSTMENT"
        side_effects:
          - "award.proposed_allocation_cents = 0, allocation_ratio = 0.0000, final_award_cents = 0, retraction_count += 1"
          - "Because the award released money, pool.allocated_cents / available_cents / utilization_pct / top_tier_award_count / distribution_status are recomputed and pool.version increments"
          - "Because pool.distribution_status changed, plan.over_allocated_pool_count / under_utilized_pool_count and plan.governance_posture are recomputed"
      - from: "allocation_status=PROPOSED"
        to: "allocation_status=UNALLOCATED"
        trigger: "system: cascade of POST /eligibility-events (event_type=TERMINATION) that classifies the award BAD_LEAVER"
        actor: system
        preconditions:
          - "award.allocation_status == PROPOSED and the recomputed eligibility_status == BAD_LEAVER"
        side_effects:
          - "award.proposed_allocation_cents = 0, allocation_ratio = 0.0000, final_award_cents = 0"
      - from: "allocation_status=PROPOSED"
        to: "allocation_status=CALIBRATED"
        trigger: "system: cascade of POST /bu-pools/{poolId}/calibration-decision with decision=CERTIFY"
        actor: system
        preconditions:
          - "award.allocation_status == PROPOSED"
        side_effects:
          - "No money fields change"
      - from: "allocation_status=CALIBRATED"
        to: "allocation_status=PROPOSED"
        trigger: "system: cascade of POST /bu-pools/{poolId}/calibration-decision with decision=RETURN"
        actor: system
        preconditions:
          - "award.allocation_status == CALIBRATED"
        side_effects:
          - "No money fields change"
      - from: "allocation_status=CALIBRATED"
        to: "allocation_status=LOCKED"
        trigger: "system: cascade of POST /bonus-plans/{planId}/lock"
        actor: system
        preconditions:
          - "award.allocation_status == CALIBRATED"
        side_effects:
          - "Contributes final_award_cents to plan.locked_total_cents"
      - from: "payment_status=PENDING"
        to: "payment_status=PAID"
        trigger: "POST /payout-runs/{payoutRunId}/execute"
        actor: FinanceController
        preconditions:
          - "award.allocation_status == LOCKED"
          - "calc payout_verdict returns amount > 0 for this award"
          - "no Dispute of this award has status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "award.payout_amount_cents = verdict amount; contributes to run.total_paid_cents and plan.paid_total_cents"
      - from: "payment_status=PENDING"
        to: "payment_status=FORFEITED"
        trigger: "POST /payout-runs/{payoutRunId}/execute"
        actor: FinanceController
        preconditions:
          - "award.allocation_status == LOCKED"
          - "calc payout_verdict returns amount == 0 for this award"
          - "no Dispute of this award has status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "award.payout_amount_cents = 0; contributes final_award_cents to run.total_forfeited_cents and plan.forfeited_total_cents"
      - from: "payment_status=PENDING"
        to: "payment_status=DEFERRED"
        trigger: "POST /payout-runs/{payoutRunId}/execute"
        actor: FinanceController
        preconditions:
          - "award.allocation_status == LOCKED"
          - "at least one Dispute of this award has status IN {OPEN, UNDER_REVIEW}"
        side_effects:
          - "award.payout_amount_cents = the verdict amount calc payout_verdict produced, held unpaid; contributes to run.deferred_award_count only"
        note: "Conditional cascade: the verdict is computed for every locked award, but a live dispute defers the cash."
      - from: "payment_status=DEFERRED"
        to: "payment_status=PAID"
        trigger: "POST /disputes/{disputeId}/resolve"
        actor: HRBusinessPartner
        preconditions:
          - "award.payment_status == DEFERRED"
          - "resolution == ADJUST, or (resolution == UPHOLD and award.payout_amount_cents > 0)"
        side_effects:
          - "resolution == ADJUST: award.payout_amount_cents = dispute.adjusted_amount_cents and plan.dispute_adjustment_cents += (adjusted_amount_cents - award.final_award_cents)"
          - "Because the award is now paid, plan.paid_total_cents is recomputed"
      - from: "payment_status=DEFERRED"
        to: "payment_status=FORFEITED"
        trigger: "POST /disputes/{disputeId}/resolve with resolution=UPHOLD"
        actor: HRBusinessPartner
        preconditions:
          - "award.payment_status == DEFERRED"
          - "award.payout_amount_cents == 0 (the run's verdict was forfeiture)"
        side_effects:
          - "Because the forfeiture stands, plan.forfeited_total_cents += award.final_award_cents"

  - entity: DiscretionaryAdjustment
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, REVERSED]
    note: "Branching fork-join: APPROVED and REJECTED leave the same state with disjoint side-effect sets; only the APPROVED branch touches money and can be compensated by REVERSED."
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /discretionary-adjustments/{adjustmentId}/decision with decision=APPROVE"
        actor: CompensationCommittee
        preconditions:
          - "adjustment.status == PENDING_APPROVAL, else ERR_ADJUSTMENT_NOT_PENDING"
          - "plan.status IN {ALLOCATION_OPEN, CALIBRATION_REVIEW}, else ERR_PLAN_NOT_IN_ALLOCATION"
          - "X-User-ID != adjustment.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "abs(adjustment_cents) <= adjustment.per_award_cap_cents, else ERR_ADJUSTMENT_EXCEEDS_PER_AWARD_LIMIT"
          - "plan.discretionary_used_cents + abs(adjustment_cents) <= plan.discretionary_budget_cents, else ERR_DISCRETIONARY_BUDGET_EXCEEDED"
          - "award.final_award_cents + adjustment_cents >= 0, else ERR_NEGATIVE_AWARD_NOT_ALLOWED"
        side_effects:
          - "adjustment.decided_by_user_id = X-User-ID; plan.discretionary_used_cents += abs(adjustment_cents)"
          - "Because the adjustment is approved, award.adjustment_total_cents += adjustment_cents and award.final_award_cents = proposed_allocation_cents + adjustment_total_cents"
          - "Because award.final_award_cents changed, pool.allocated_cents / available_cents / utilization_pct / distribution_status are recomputed (the pool can go OVER_ALLOCATED because the discretionary budget is separate from the pool)"
          - "Because pool.distribution_status changed, plan.over_allocated_pool_count and plan.governance_posture are recomputed"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /discretionary-adjustments/{adjustmentId}/decision with decision=REJECT"
        actor: CompensationCommittee
        preconditions:
          - "adjustment.status == PENDING_APPROVAL, else ERR_ADJUSTMENT_NOT_PENDING"
          - "X-User-ID != adjustment.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "adjustment.decided_by_user_id = X-User-ID and decision_note recorded; NO money field on award, pool or plan changes"
        note: "Divergent branch: the reject path deliberately fires none of the approve path's four money side effects."
      - from: APPROVED
        to: REVERSED
        trigger: "POST /discretionary-adjustments/{adjustmentId}/reverse"
        actor: CompensationCommittee
        preconditions:
          - "adjustment.status == APPROVED"
          - "plan.status IN {ALLOCATION_OPEN, CALIBRATION_REVIEW}, else ERR_PLAN_NOT_IN_ALLOCATION"
        side_effects:
          - "plan.discretionary_used_cents -= abs(adjustment_cents)"
          - "Because the adjustment is reversed, award.adjustment_total_cents -= adjustment_cents and award.final_award_cents is recomputed"
          - "Because award.final_award_cents changed, pool.allocated_cents / available_cents / utilization_pct / distribution_status are recomputed"
          - "Because pool.distribution_status changed, plan.over_allocated_pool_count and plan.governance_posture are recomputed"
        note: "Compensating action for the APPROVED branch; see §1.3 invariant discretionary_budget_conservation."

  - entity: AccrualPeriod
    initial_state: OPEN
    terminal_states: [REVERSED]
    transitions:
      - from: OPEN
        to: POSTED
        trigger: "POST /accrual-periods/{periodId}/post"
        actor: FinanceController
        preconditions:
          - "period.status == OPEN, else ERR_ACCRUAL_ALREADY_POSTED"
          - "plan.status NOT IN {PAID_OUT, SETTLED}, else ERR_PLAN_ALREADY_SETTLED"
          - "every earlier AccrualPeriod of the plan (period_end < this period_start) has status IN {POSTED, REVERSED}, else ERR_ACCRUAL_PERIOD_GAP"
        side_effects:
          - "Runs calc provisional_pool_funding then calc period_accrual_with_burden -> provisional_target_basis, provisional_pool_cents, elapsed_days, cumulative_accrual_target_cents, period_accrual_cents, burden_rate_pct, burden_cents, total_period_cents"
          - "plan.accrued_base_cents += period_accrual_cents and plan.accrued_total_cents += total_period_cents"
      - from: POSTED
        to: REVERSED
        trigger: "POST /accrual-periods/{periodId}/reverse"
        actor: FinanceController
        preconditions:
          - "period.status == POSTED"
          - "plan.status != SETTLED, else ERR_PLAN_ALREADY_SETTLED"
          - "no later AccrualPeriod of the plan with status POSTED exists, else ERR_ACCRUAL_REVERSAL_OUT_OF_ORDER"
        side_effects:
          - "plan.accrued_base_cents -= period_accrual_cents and plan.accrued_total_cents -= total_period_cents (exact compensation, see §1.3 invariant accrual_ledger_conservation)"
          - "period.reversal_reason recorded; the period's computed amounts are retained for audit"

  - entity: PayoutRun
    initial_state: DRAFT
    terminal_states: [SETTLED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /payout-runs/{payoutRunId}/execute"
        actor: FinanceController
        preconditions:
          - "run.status == DRAFT, else ERR_PAYOUT_ALREADY_EXECUTED"
          - "plan.status == LOCKED, else ERR_PLAN_NOT_LOCKED"
          - "logical clock date >= plan.payment_date, else ERR_PAYMENT_DATE_NOT_REACHED"
        side_effects:
          - "Runs calc payout_verdict per locked award under plan.termination_treatment_policy, writing each award's payment_status and payout_amount_cents"
          - "run.payment_date_used, paid_award_count, deferred_award_count, forfeited_award_count, total_paid_cents, total_forfeited_cents written"
          - "Because per-award verdicts landed, plan.paid_total_cents / plan.forfeited_total_cents are written and the plan moves LOCKED -> PAID_OUT"
      - from: EXECUTED
        to: SETTLED
        trigger: "POST /payout-runs/{payoutRunId}/settle-true-up"
        actor: FinanceController
        preconditions:
          - "run.status == EXECUTED"
          - "plan.status == PAID_OUT"
          - "no ParticipantAward of the plan has payment_status DEFERRED, else ERR_DEFERRED_AWARDS_PENDING"
        side_effects:
          - "Runs calc settlement_true_up -> run.settlement_burden_cents, run.true_up_cents, mirrored onto plan.settlement_burden_cents / plan.true_up_cents"
          - "Because settlement completed, the plan moves PAID_OUT -> SETTLED (terminal)"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_ADJUSTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /disputes/{disputeId}/assign-review"
        actor: HRBusinessPartner
        preconditions:
          - "dispute.status == OPEN"
        side_effects:
          - "dispute.assigned_by_user_id = X-User-ID; reviewer_note recorded"
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: "POST /disputes/{disputeId}/resolve with resolution=UPHOLD"
        actor: HRBusinessPartner
        preconditions:
          - "dispute.status == UNDER_REVIEW, else ERR_DISPUTE_NOT_UNDER_REVIEW"
        side_effects:
          - "If the award is DEFERRED it settles to PAID (payout_amount_cents > 0) or FORFEITED (payout_amount_cents == 0)"
          - "Because the award left DEFERRED, plan.paid_total_cents or plan.forfeited_total_cents is recomputed"
      - from: UNDER_REVIEW
        to: RESOLVED_ADJUSTED
        trigger: "POST /disputes/{disputeId}/resolve with resolution=ADJUST"
        actor: HRBusinessPartner
        preconditions:
          - "dispute.status == UNDER_REVIEW, else ERR_DISPUTE_NOT_UNDER_REVIEW"
          - "adjusted_amount_cents present and >= 0, else ERR_INVALID_REQUEST"
          - "adjusted_amount_cents <= 2 * award.final_award_cents, else ERR_DISPUTE_ADJUSTMENT_EXCEEDS_LIMIT"
        side_effects:
          - "award.payout_amount_cents = adjusted_amount_cents; award.payment_status = PAID"
          - "plan.dispute_adjustment_cents += (adjusted_amount_cents - award.final_award_cents) and plan.paid_total_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: allocation-propose-stale-pool
    parent_entity: BusinessUnitPool
    write_endpoint: "POST /participant-awards/{awardId}/propose-allocation"
    occ_field: "expected_pool_version"
    description: |
      A manager allocating inside a fixed pool must present the pool version
      their remaining-balance view was computed from. When another allocation
      has already been recorded against the same pool, the presented version is
      stale and the request is rejected, because the balance the manager was
      spending against no longer exists. The rejected request would otherwise
      have been perfectly legal on its own terms (a different award, an amount
      inside the guidelines), so a state precondition cannot express it.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

  - rule_id: allocation-retract-stale-pool
    parent_entity: BusinessUnitPool
    write_endpoint: "POST /participant-awards/{awardId}/retract-allocation"
    occ_field: "expected_pool_version"
    description: |
      Releasing money back to the pool also requires the pool version the
      manager last observed; a retraction computed against a superseded pool
      balance is rejected as stale rather than silently re-deriving the
      remainder.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

  - rule_id: adjustment-create-stale-plan
    parent_entity: BonusPlan
    write_endpoint: "POST /discretionary-adjustments"
    occ_field: "expected_plan_version"
    description: |
      A discretionary adjustment is drawn against the plan-level discretionary
      budget. The creator must present the plan version whose
      discretionary_budget_cents / discretionary_used_cents pair they inspected;
      once any other adjustment has been approved the presented version is
      stale and the new draw is rejected, since the new adjustment would
      legitimately supersede the remaining-budget arithmetic it was sized from.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# Money is integer cents everywhere. `round_half_up(x)` means Decimal
# quantize to 0 decimals with ROUND_HALF_UP unless a precision is given.
# No calculation, selector, tie-break or ordering rule anywhere in this
# scaffold reads `id`; `created_at ASC` is the only permitted fallback order.
# =============================================================================
calculations:

  - name: metric_achievement
    trigger: "POST /company-metrics/{metricId}/actual (CompanyMetric DRAFT -> ACTUAL_ENTERED)"
    algorithm: threshold
    formula: |
      a = actual_value; t = threshold_value; g = target_value; m = max_value
      if a <  t:            achievement = 0.00
      elif a <  g:          achievement = 50 + (a - t) / (g - t) * 50
      elif a <  m:          achievement = 100 + (a - g) / (m - g) * 50
      else:                 achievement = 150.00          # hard cap
      metric.achievement_pct = round_half_up(achievement, 2)
    input_set: "The single CompanyMetric row being actualised. `a == t` scores exactly 50.00 (the `<` branch is strict); `a == g` scores exactly 100.00; `a >= m` scores exactly 150.00."
    constants:
      THRESHOLD_ACHIEVEMENT_PCT: 50.00
      TARGET_ACHIEVEMENT_PCT: 100.00
      MAX_ACHIEVEMENT_PCT: 150.00
    precision: "2 decimal places, round_half_up"

  - name: company_achievement
    trigger: "POST /bonus-plans/{planId}/certification-decision with decision=CERTIFY (BonusPlan PENDING_CERTIFICATION -> CERTIFIED)"
    algorithm: weighted_scoring
    formula: |
      company_achievement_pct = round_half_up(
          SUM over CompanyMetric of (metric.weight_pct / 100 * metric.achievement_pct),
          2)
    input_set: "Every CompanyMetric with plan_id == this plan and status == ACTUAL_ENTERED. Submission for certification already guarantees all metrics are ACTUAL_ENTERED and that SUM(weight_pct) == 100.00, so no re-normalisation is applied — the weights are used as declared."
    precision: "2 decimal places, round_half_up; each term is kept at full precision and only the total is rounded"

  - name: bu_weighted_achievement
    trigger: "POST /bonus-plans/{planId}/certification-decision with decision=CERTIFY"
    algorithm: aggregation
    formula: |
      # target-weighted mean of capped BU scorecards, single division, no per-pool rounding
      numerator = SUM over pools of (pool.eligible_target_cents
                                     * min(150.00, pool.bu_metric_achievement_pct))
      bu_weighted_achievement_pct = round_half_up(numerator / plan.total_target_cents, 2)
      # empty input set (no certified pool carries eligible target) -> 0.00
    input_set: "BusinessUnitPool rows with plan_id == this plan AND calibration_status == SCORECARD_CERTIFIED AND eligible_target_cents > 0. Pools with eligible_target_cents == 0 contribute neither numerator nor weight. If the filtered set is empty the result is 0.00."
    constants:
      BU_ACHIEVEMENT_CAP_PCT: 150.00
    precision: "2 decimal places, round_half_up"

  - name: blended_achievement
    trigger: "POST /bonus-plans/{planId}/certification-decision with decision=CERTIFY"
    algorithm: weighted_scoring
    formula: |
      # three weighted inputs; the individual component is deliberately pinned at
      # target because individual differentiation happens inside the pool later
      blended_achievement_pct = round_half_up(
            plan.company_weight_pct        / 100 * plan.company_achievement_pct
          + plan.business_unit_weight_pct  / 100 * plan.bu_weighted_achievement_pct
          + plan.individual_weight_pct     / 100 * INDIVIDUAL_COMPONENT_PCT , 2)
    input_set: "The plan's three weights (validated to sum to exactly 100.00 at creation) plus the two achievement fields written earlier in the same request, in the order company_achievement -> bu_weighted_achievement -> blended_achievement."
    constants:
      INDIVIDUAL_COMPONENT_PCT: 100.00
    precision: "2 decimal places, round_half_up on the total only"

  - name: funding_curve_multiplier
    trigger: "POST /bonus-plans/{planId}/certification-decision with decision=CERTIFY (immediately after blended_achievement)"
    algorithm: threshold
    formula: |
      b = plan.blended_achievement_pct
      if   b <  CURVE_FLOOR_PCT:                       # b < 80
          multiplier = 0.0000
      elif b <  CURVE_TARGET_PCT:                      # 80 <= b < 100
          multiplier = 0.50 + (b - 80) / 20 * 0.50
      elif b <  CURVE_CAP_PCT:                         # 100 <= b < 120
          multiplier = 1.00 + (b - 100) / 20 * 0.50
      else:                                            # b >= 120
          multiplier = 1.5000
      plan.funding_multiplier = round_half_up(multiplier, 4)
    input_set: "plan.blended_achievement_pct only. Boundary semantics are inclusive-at-the-bottom: b == 80.00 funds at exactly 0.5000 (not 0.0000), b == 100.00 at exactly 1.0000, b == 120.00 at the 1.5000 cap."
    constants:
      CURVE_FLOOR_PCT: 80.00
      CURVE_FLOOR_MULTIPLIER: 0.5000
      CURVE_TARGET_PCT: 100.00
      CURVE_CAP_PCT: 120.00
      CURVE_CAP_MULTIPLIER: 1.5000
    precision: "4 decimal places, round_half_up"

  - name: participant_prorated_target
    trigger: "POST /bonus-plans/{planId}/target-assignments (DRAFT -> TARGETS_SET and the TARGETS_SET self-transition); also re-run for a single award as a cascade of POST /eligibility-events"
    algorithm: chronological
    formula: |
      # 1. participation window, half-open [win_start, win_end)
      win_start = max(plan.plan_period_start, participant.hire_date)
      win_end   = plan.plan_period_end
      if participant.employment_status == TERMINATED:
          win_end = min(plan.plan_period_end, participant.termination_date + 1 day)
      # 2. segment boundaries: every non-superseded TRANSFER effective_date inside
      #    (win_start, win_end), ascending by effective_date, ties broken by
      #    created_at ASC (never by id). Each segment carries the (job_level,
      #    base_salary_cents, business_unit_id) in force at its start.
      segments = split(win_start, win_end, transfer_dates)
      # 3. unpaid-leave exclusion, chronological with a 30-day credit cap
      unpaid_days = []                      # dates, ascending
      for ev in non-superseded LEAVE events with paid_leave == false, ordered by
               effective_date ASC then created_at ASC:
          unpaid_days += every date in [ev.effective_date, ev.leave_end_date + 1 day)
                         that also lies in [win_start, win_end)
      credited_leave = first LEAVE_CREDIT_CAP_DAYS entries of unpaid_days
      excluded_days  = unpaid_days minus credited_leave      # award.excluded_leave_days
      # 4. per-segment target, ROUNDED PER SEGMENT then summed (pinned order)
      prorated_target_cents = 0
      for s in segments:
          s.credited_days = length(s) - count(excluded_days inside s)
          pct = JobLevelTarget(plan, s.job_level).target_bonus_pct
          prorated_target_cents += round_half_up(
              s.credited_days * s.base_salary_cents * pct / 100 / PLAN_DAY_BASIS)
      credited_days = SUM of s.credited_days
      # 5. minimum-service gate
      if credited_days < MIN_SERVICE_DAYS:
          eligibility_status = INELIGIBLE_MIN_SERVICE ; prorated_target_cents = 0
      elif participant.employment_status == TERMINATED:
          eligibility_status = GOOD_LEAVER if termination_reason IN GOOD_LEAVER_REASONS
                               else BAD_LEAVER
      else:
          eligibility_status = ELIGIBLE
      award.segment_count = count(segments)
      award.target_bonus_pct = target pct of the LAST segment
    input_set: "EligibilityEvent rows of the participant with superseded == false, restricted to effective_date inside [plan_period_start, plan_period_end). Superseded events (named by a later event's supersedes_event_id) are excluded entirely, including their leave days."
    constants:
      PLAN_DAY_BASIS: 365
      MIN_SERVICE_DAYS: 90
      LEAVE_CREDIT_CAP_DAYS: 30
      GOOD_LEAVER_REASONS: [REDUNDANCY, RETIREMENT, DEATH, DISABILITY]
      BAD_LEAVER_REASONS: [VOLUNTARY_RESIGNATION, TERMINATED_FOR_CAUSE]
    precision: |
      Integer cents. ROUNDING ORDER IS PINNED: round each segment to whole cents
      with ROUND_HALF_UP and then sum the segments. The alternative reading —
      sum the un-rounded segment amounts and round once — is explicitly NOT the
      rule and differs by up to (segment_count - 1) cents.
    note: "credited_days == MIN_SERVICE_DAYS (exactly 90) is ELIGIBLE; 89 is INELIGIBLE_MIN_SERVICE."

  - name: award_pool_assignment
    trigger: "POST /bonus-plans/{planId}/target-assignments; also re-run as a cascade of a TRANSFER EligibilityEvent"
    algorithm: chronological
    formula: |
      last_credited_day = win_end - 1 day           # from participant_prorated_target
      candidate_events = non-superseded TRANSFER events of the participant with
                         new_business_unit_id != null
                         AND effective_date <= last_credited_day
      if candidate_events is empty:
          unit_id = participant.business_unit_id
      else:
          # ranking: latest effective_date wins; ties broken by created_at ASC,
          # i.e. among same-date transfers the FIRST recorded one wins
          unit_id = new_business_unit_id of max(candidate_events by
                    (effective_date ASC, created_at ASC))
      award.business_unit_id = unit_id
      award.bu_pool_id = the BusinessUnitPool with plan_id == plan
                         AND business_unit_id == unit_id
      if that pool does not exist: reject the whole target-assignments call
                                   with ERR_POOL_MISSING_FOR_UNIT
    input_set: "TRANSFER events only; LEAVE and TERMINATION events never move a participant between pools."
    precision: "n/a (selector)"

  - name: pool_funding_split
    trigger: "POST /bonus-plans/{planId}/fund-pool (BonusPlan CERTIFIED -> ALLOCATION_OPEN)"
    algorithm: waterfall_allocation
    formula: |
      for pool in pools of the plan ordered by created_at ASC:
          pool.funded_cents = round_half_up(pool.eligible_target_cents
                                            * plan.funding_multiplier)
          pool.min_utilization_cents = floor(pool.funded_cents * UNDER_UTILIZATION_BP / 10000)
          pool.available_cents = pool.funded_cents - pool.allocated_cents
      plan.funded_pool_cents = SUM of pool.funded_cents            # per-pool, then sum
      plan.aggregate_rounding_delta_cents =
          round_half_up(plan.total_target_cents * plan.funding_multiplier)
          - plan.funded_pool_cents
      plan.discretionary_budget_cents =
          round_half_up(plan.funded_pool_cents * plan.discretionary_budget_pct / 100)
    input_set: "All BusinessUnitPool rows of the plan, including pools with eligible_target_cents == 0 (they are funded with 0 cents and keep distribution_status NO_ELIGIBLE_PARTICIPANTS). Processing order is created_at ASC and affects nothing but audit ordering."
    constants:
      UNDER_UTILIZATION_BP: 9950
    precision: |
      Integer cents. ROUNDING ORDER IS PINNED: round per pool, then sum. The
      plan-level total is NOT round_half_up(total_target_cents * multiplier);
      that competing reading is computed anyway and stored as
      plan.aggregate_rounding_delta_cents, which is non-zero whenever the
      per-pool remainders do not cancel.

  - name: pool_distribution_state
    trigger: "Any change to an award of the pool: propose-allocation, retract-allocation, target-assignments, an approved or reversed DiscretionaryAdjustment, or a TERMINATION cascade"
    algorithm: aggregation
    formula: |
      A = awards with bu_pool_id == pool.id
      pool.eligible_target_cents = SUM over a in A where a.eligibility_status !=
                                   INELIGIBLE_MIN_SERVICE of a.prorated_target_cents
      pool.eligible_headcount    = COUNT of those same rows
      pool.max_top_tier_count    = max(1, floor(pool.eligible_headcount * TOP_TIER_MAX_PCT / 100))
      allocated = SUM over a in A where a.allocation_status IN
                  {PROPOSED, CALIBRATED, LOCKED}
                  of (a.proposed_allocation_cents + a.adjustment_total_cents)
      pool.allocated_cents = allocated
      pool.available_cents = pool.funded_cents - allocated
      pool.utilization_pct = 0.00 if pool.funded_cents == 0 else
                             round_half_up(allocated * 10000 / pool.funded_cents, 0) / 100
      pool.top_tier_award_count = COUNT over a in A where a.allocation_status IN
                                  {PROPOSED, CALIBRATED, LOCKED}
                                  AND a.allocation_ratio >= TOP_TIER_RATIO
      if pool.eligible_headcount == 0:              pool.distribution_status = NO_ELIGIBLE_PARTICIPANTS
      elif allocated >  pool.funded_cents:          pool.distribution_status = OVER_ALLOCATED
      elif allocated <  pool.min_utilization_cents: pool.distribution_status = UNDER_UTILIZED
      else:                                         pool.distribution_status = WITHIN_GUIDELINES
      # bubble up to the plan
      plan.over_allocated_pool_count  = COUNT of pools with distribution_status OVER_ALLOCATED
      plan.under_utilized_pool_count  = COUNT of pools with distribution_status UNDER_UTILIZED
      plan.governance_posture = BREACHED if plan.over_allocated_pool_count >= 2
                                else FLAGGED if plan.over_allocated_pool_count == 1
                                              or plan.under_utilized_pool_count >= 1
                                else COMPLIANT
    input_set: "ParticipantAward rows of the pool. UNALLOCATED awards contribute to eligible_target_cents but never to allocated_cents. funded_cents is frozen at fund-pool time and is never re-derived here."
    constants:
      TOP_TIER_RATIO: 1.50
      TOP_TIER_MAX_PCT: 25
    precision: "Integer cents; utilization_pct is 2 decimals and is display-only — every gate compares cents, never utilization_pct."
    note: "allocated_cents == min_utilization_cents exactly is WITHIN_GUIDELINES (the UNDER_UTILIZED branch is strict `<`); allocation_ratio == 1.50 exactly IS top tier (the count uses `>=`)."

  - name: discretionary_cap
    trigger: "POST /discretionary-adjustments (creation) — frozen onto the adjustment row"
    algorithm: threshold
    formula: |
      per_award_cap_cents = max(ADJ_FLOOR_CENTS,
                                round_half_up(award.prorated_target_cents
                                              * PER_AWARD_CAP_PCT / 100))
    input_set: "The single target award, read at creation time; later changes to prorated_target_cents do NOT move an existing adjustment's frozen cap."
    constants:
      ADJ_FLOOR_CENTS: 50000
      PER_AWARD_CAP_PCT: 25
      DOC_REQUIRED_ABOVE_CENTS: 100000
    precision: "Integer cents"
    note: "abs(adjustment_cents) == per_award_cap_cents exactly is allowed (the approval gate is `<=`); documentation_ref is required when abs(adjustment_cents) > 100000 (strictly greater)."

  - name: provisional_pool_funding
    trigger: "POST /accrual-periods/{periodId}/post (AccrualPeriod OPEN -> POSTED)"
    algorithm: forward_looking
    formula: |
      # forecast company component replaces the certified one
      forecast_blended = round_half_up(
            plan.company_weight_pct       / 100 * period.forecast_company_achievement_pct
          + plan.business_unit_weight_pct / 100 * forecast_bu_pct
          + plan.individual_weight_pct    / 100 * 100.00 , 2)
      where forecast_bu_pct = 100.00 when NO pool of the plan has
            calibration_status == SCORECARD_CERTIFIED,
            else the value calc bu_weighted_achievement produces over the
            certified pools
      multiplier = funding_curve_multiplier(forecast_blended)
      if the plan has at least one ParticipantAward row:
          basis = AWARD_PRORATED
          target_basis_cents = SUM over awards with eligibility_status !=
                               INELIGIBLE_MIN_SERVICE of prorated_target_cents
      else:
          basis = PARTICIPANT_UNPRORATED
          target_basis_cents = SUM over Participant of the plan with
                               employment_status IN {ACTIVE, ON_LEAVE} of
                               round_half_up(current_base_salary_cents
                                             * JobLevelTarget(current_job_level).target_bonus_pct / 100)
      period.provisional_target_basis = basis
      period.provisional_pool_cents   = round_half_up(target_basis_cents * multiplier)
    input_set: "See the two branches: the award-prorated basis excludes INELIGIBLE_MIN_SERVICE awards but INCLUDES BAD_LEAVER awards (their target is still an accounting obligation until the payout variant forfeits it); the participant-unprorated basis excludes TERMINATED participants and ignores proration entirely."
    precision: "Integer cents; the multiplier is the same 4-decimal curve output used at certification"
    variants:
      - name: provisional_forecast
        when: "Accrual posting during the year (this calculation)"
        difference: "Company achievement comes from period.forecast_company_achievement_pct; the BU component defaults to 100.00 until scorecards are certified; the target basis may be un-prorated whole-year targets of currently-employed participants."
      - name: certified_final
        when: "POST /bonus-plans/{planId}/fund-pool, via calc pool_funding_split"
        difference: "Company achievement comes from audited CompanyMetric actuals, the BU component from certified scorecards, and the target basis is always the sum of per-segment-prorated award targets. For identical underlying data the two variants return different cents, and the difference is exactly what plan.true_up_cents settles."

  - name: period_accrual_with_burden
    trigger: "POST /accrual-periods/{periodId}/post, immediately after provisional_pool_funding"
    algorithm: chronological
    formula: |
      # EVALUATION ORDER IS PINNED — the four steps run in this order and the
      # burden tier is selected from the PRE-BURDEN cumulative figure.
      # 1. elapsed
      elapsed_days = (period.period_end - plan.plan_period_start) in days + 1
      # 2. cumulative target
      cumulative = round_half_up(period.provisional_pool_cents
                                 * elapsed_days / PLAN_DAY_BASIS)
      # 3. this period's movement against the ledger already posted
      period_accrual_cents = cumulative - plan.accrued_base_cents     # may be negative
      # 4. burden: tier keyed on `cumulative` (step 2), NOT on
      #    (period_accrual_cents + burden) and NOT on plan.accrued_total_cents
      burden_rate_pct = 7.65  if cumulative <  BURDEN_TIER_1_CENTS
                        else 9.25  if cumulative < BURDEN_TIER_2_CENTS
                        else 10.50
      burden_cents = round_half_up(period_accrual_cents * burden_rate_pct / 100)
      total_period_cents = period_accrual_cents + burden_cents
    input_set: "plan.accrued_base_cents is the running accumulator over AccrualPeriod rows with status POSTED (reversed periods have already been subtracted back out), so periods must be posted in ascending period_start order."
    constants:
      PLAN_DAY_BASIS: 365
      BURDEN_TIER_1_CENTS: 5000000
      BURDEN_TIER_2_CENTS: 20000000
      BURDEN_RATE_TIER_1_PCT: 7.65
      BURDEN_RATE_TIER_2_PCT: 9.25
      BURDEN_RATE_TIER_3_PCT: 10.50
    precision: "Integer cents, round_half_up; burden is rounded once, after the tier is fixed"
    note: |
      Circular-looking dependency, pinned: the loaded accrual
      (period_accrual_cents + burden_cents) can sit in a higher burden tier than
      `cumulative` does. The tier is nevertheless chosen from `cumulative`
      alone; choosing it from the loaded figure is the wrong reading and yields
      a different burden for the same inputs.

  - name: payout_verdict
    trigger: "POST /payout-runs/{payoutRunId}/execute, once per ParticipantAward with allocation_status LOCKED"
    algorithm: projection
    formula: |
      policy = plan.termination_treatment_policy
      employed_on_payment_date = participant.employment_status IN {ACTIVE, ON_LEAVE}
                                 OR (participant.termination_date != null
                                     AND participant.termination_date >= plan.payment_date)
      if policy == STRICT_PAYMENT_DATE:
          verdict_cents = award.final_award_cents if employed_on_payment_date else 0
      else:                              # GOOD_LEAVER_PRORATION
          if employed_on_payment_date:                             verdict_cents = award.final_award_cents
          elif award.eligibility_status == GOOD_LEAVER:            verdict_cents = award.final_award_cents
          else:                                                    verdict_cents = 0
      # the payment axis is then set by the dispute filter (see §1.2)
      if any Dispute of the award has status IN {OPEN, UNDER_REVIEW}:
          payment_status = DEFERRED ; payout_amount_cents = verdict_cents  # held
      elif verdict_cents > 0:
          payment_status = PAID ; payout_amount_cents = verdict_cents
      else:
          payment_status = FORFEITED ; payout_amount_cents = 0
    input_set: "Awards with allocation_status == LOCKED only. Awards left UNALLOCATED or PROPOSED at lock time (there are none, because lock requires every pool CALIBRATED) are untouched. A participant whose termination_date equals plan.payment_date exactly counts as employed on the payment date."
    precision: "Integer cents; no rounding (amounts are copied)"
    variants:
      - name: strict_payment_date
        when: "plan.termination_treatment_policy == STRICT_PAYMENT_DATE"
        difference: "ANY termination before the payment date forfeits the whole award, regardless of reason; the retiree and the resigner are treated identically."
      - name: good_leaver_proration
        when: "plan.termination_treatment_policy == GOOD_LEAVER_PRORATION"
        difference: "A GOOD_LEAVER (REDUNDANCY, RETIREMENT, DEATH, DISABILITY) keeps the full already-prorated final award; only BAD_LEAVER reasons forfeit. For one retired participant the two variants differ by exactly that award's final_award_cents."

  - name: settlement_true_up
    trigger: "POST /payout-runs/{payoutRunId}/settle-true-up (PayoutRun EXECUTED -> SETTLED, BonusPlan PAID_OUT -> SETTLED)"
    algorithm: aggregation
    formula: |
      paid = plan.paid_total_cents        # SUM of payout_amount_cents where payment_status PAID
      settlement_burden_cents = round_half_up(paid * burden_rate_for(paid) / 100)
      # same tier table as period_accrual_with_burden, keyed on `paid`
      true_up_cents = (paid + settlement_burden_cents) - plan.accrued_total_cents
    input_set: "Awards of the plan with payment_status == PAID at settlement time, including awards that were DEFERRED and later paid through dispute resolution. FORFEITED awards contribute 0."
    constants:
      BURDEN_TIER_1_CENTS: 5000000
      BURDEN_TIER_2_CENTS: 20000000
      BURDEN_RATE_TIER_1_PCT: 7.65
      BURDEN_RATE_TIER_2_PCT: 9.25
      BURDEN_RATE_TIER_3_PCT: 10.50
    precision: "Integer cents, round_half_up"
    note: |
      Named invariant `accrual_settlement_closure`:
      plan.accrued_total_cents + plan.true_up_cents
        == plan.paid_total_cents + plan.settlement_burden_cents
      holds exactly after settlement, for any sequence of posted and reversed
      accrual periods.

  - name: conserved_quantity_invariants
    trigger: "Asserted after every compensating action (retract-allocation, adjustment reverse, accrual reverse)"
    algorithm: constraint_propagation
    formula: |
      # I1 pool cash conservation (per pool, at all times)
      pool.funded_cents == pool.allocated_cents + pool.available_cents
      # and after a propose/retract pair on the same award:
      pool.allocated_cents and pool.available_cents return to their pre-propose values
      # I2 accrual ledger conservation (per plan, at all times)
      plan.accrued_base_cents  == SUM over AccrualPeriod status POSTED of period_accrual_cents
      plan.accrued_total_cents == SUM over AccrualPeriod status POSTED of total_period_cents
      # I3 discretionary authority conservation (per plan, at all times)
      plan.discretionary_used_cents ==
          SUM over DiscretionaryAdjustment status APPROVED of abs(adjustment_cents)
      # and after an approve/reverse pair:
      award.adjustment_total_cents, award.final_award_cents, pool.allocated_cents,
      pool.available_cents, pool.distribution_status and plan.governance_posture
      all return to their pre-approval values
    input_set: "All pools of a plan for I1; all AccrualPeriod rows of a plan for I2; all DiscretionaryAdjustment rows of a plan for I3."
    precision: "Exact integer equality — no tolerance"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# The ladder is TOTAL: every row has a distinct priority, so any request that
# violates several rules returns the error of the lowest-numbered row it
# violates. Domain ordering of the business block: identity/ownership ->
# lifecycle state -> concurrency -> governance safety -> temporal integrity ->
# referential integrity -> distribution constraints -> money (fiscal last),
# because an incentive plan must refuse an unauthorised or out-of-sequence
# action before it ever reports a budget number.
# =============================================================================
validations:

  # --- auth -------------------------------------------------------------
  - priority: 10
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 15
    category: auth
    check: "X-User-Role is one of the six declared roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  # --- existence, path params left-to-right -----------------------------
  - priority: 25
    category: existence
    check: "{unitId} resolves to a BusinessUnit"
    error_id: ERR_BUSINESS_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /business-units/{unitId}"
  - priority: 26
    category: existence
    check: "{targetId} resolves to a JobLevelTarget"
    error_id: ERR_JOB_LEVEL_TARGET_NOT_FOUND
    http_status: 404
    applies_to: "GET /job-level-targets/{targetId}"
  - priority: 30
    category: existence
    check: "{planId} resolves to a BonusPlan"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {planId}"
  - priority: 31
    category: existence
    check: "{metricId} resolves to a CompanyMetric"
    error_id: ERR_METRIC_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {metricId}"
  - priority: 32
    category: existence
    check: "{participantId} resolves to a Participant"
    error_id: ERR_PARTICIPANT_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {participantId}"
  - priority: 33
    category: existence
    check: "{eventId} resolves to an EligibilityEvent"
    error_id: ERR_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /eligibility-events/{eventId}"
  - priority: 34
    category: existence
    check: "{poolId} resolves to a BusinessUnitPool"
    error_id: ERR_POOL_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {poolId}"
  - priority: 35
    category: existence
    check: "{awardId} resolves to a ParticipantAward"
    error_id: ERR_AWARD_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {awardId}"
  - priority: 36
    category: existence
    check: "{adjustmentId} resolves to a DiscretionaryAdjustment"
    error_id: ERR_ADJUSTMENT_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {adjustmentId}"
  - priority: 37
    category: existence
    check: "{periodId} resolves to an AccrualPeriod"
    error_id: ERR_ACCRUAL_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {periodId}"
  - priority: 38
    category: existence
    check: "{payoutRunId} resolves to a PayoutRun"
    error_id: ERR_PAYOUT_RUN_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {payoutRunId}"
  - priority: 39
    category: existence
    check: "{disputeId} resolves to a Dispute"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "every path containing {disputeId}"

  # --- request schema ---------------------------------------------------
  - priority: 40
    category: existence
    check: |
      Request body is well-formed: every required field of the endpoint's
      `input:` present, enums inside their declared value set, dates ISO 8601
      YYYY-MM-DD, integer cents fields integral, limit in 1..100, offset >= 0,
      conditionally-required fields present (leave_end_date for LEAVE,
      termination_reason for TERMINATION, new_job_level + new_base_salary_cents
      + new_business_unit_id for TRANSFER, adjusted_amount_cents for
      resolution=ADJUST)
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  # --- referenced-entity existence from the body ------------------------
  - priority: 45
    category: existence
    check: "Body FKs resolve: plan_id -> BonusPlan, participant_id -> Participant, business_unit_id / new_business_unit_id -> BusinessUnit, bu_pool_id -> BusinessUnitPool, award_id -> ParticipantAward, supersedes_event_id -> EligibilityEvent; each returns its own NOT_FOUND"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields (the error_id is the NOT_FOUND of whichever FK failed, checked in the order the fields appear in §1.1)"

  # --- intra-entity field relationships ---------------------------------
  - priority: 50
    category: business_constraint
    check: "company_weight_pct + business_unit_weight_pct + individual_weight_pct == 100.00 exactly"
    error_id: ERR_PLAN_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /bonus-plans"
  - priority: 51
    category: business_temporal
    check: "plan_period_end == plan_period_start + 365 days AND payment_date >= plan_period_end"
    error_id: ERR_PLAN_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /bonus-plans"
  - priority: 52
    category: business_constraint
    check: "threshold_value < target_value < max_value"
    error_id: ERR_METRIC_BAND_INVALID
    http_status: 422
    applies_to: "POST /company-metrics"
  - priority: 53
    category: business_constraint
    check: "guideline_min_ratio < guideline_max_ratio and both within 0..5"
    error_id: ERR_GUIDELINE_BAND_INVALID
    http_status: 422
    applies_to: "POST /job-level-targets"
  - priority: 54
    category: business_constraint
    check: "Uniqueness: (plan_year, plan_name); (plan_id, metric_code); unit_code; (plan_id, job_level); (plan_id, employee_code); (plan_id, business_unit_id) for pools"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /bonus-plans, POST /company-metrics, POST /business-units, POST /job-level-targets, POST /participants, POST /bu-pools"

  # --- ownership --------------------------------------------------------
  - priority: 55
    category: auth
    check: |
      Resource ownership for entity-backed roles: BusinessUnitManager's
      X-User-ID must equal pool.business_unit_id (pool endpoints) or
      award.business_unit_id (award endpoints); Employee's X-User-ID must equal
      the participant_id of the award being disputed
    error_id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
    http_status: 403
    applies_to: "POST /bu-pools/{poolId}/submit-scorecard, POST /bu-pools/{poolId}/submit-calibration, POST /participant-awards/{awardId}/propose-allocation, POST /participant-awards/{awardId}/retract-allocation, POST /disputes"

  # --- lifecycle state --------------------------------------------------
  - priority: 60
    category: state
    check: "BonusPlan is in the state the requested transition declares in §1.2 (target-assignments needs DRAFT|TARGETS_SET, submit-for-certification needs TARGETS_SET, certification-decision needs PENDING_CERTIFICATION, fund-pool needs CERTIFIED, open-calibration needs ALLOCATION_OPEN, lock needs CALIBRATION_REVIEW)"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "all POST /bonus-plans/{planId}/* endpoints"
  - priority: 61
    category: state
    check: "Setup-only writes require plan.status IN {DRAFT, TARGETS_SET}"
    error_id: ERR_PLAN_NOT_IN_SETUP
    http_status: 409
    applies_to: "POST /company-metrics, POST /company-metrics/{metricId}/actual, POST /job-level-targets, POST /participants, POST /bu-pools, POST /bu-pools/{poolId}/submit-scorecard, POST /bu-pools/{poolId}/scorecard-decision"
  - priority: 62
    category: state
    check: "Allocation-phase writes require plan.status == ALLOCATION_OPEN (propose-allocation, retract-allocation, submit-calibration) or plan.status IN {ALLOCATION_OPEN, CALIBRATION_REVIEW} (discretionary-adjustment create / decision / reverse, calibration-decision)"
    error_id: ERR_PLAN_NOT_IN_ALLOCATION
    http_status: 409
    applies_to: "POST /participant-awards/{awardId}/propose-allocation, POST /participant-awards/{awardId}/retract-allocation, POST /bu-pools/{poolId}/submit-calibration, POST /bu-pools/{poolId}/calibration-decision, POST /discretionary-adjustments, POST /discretionary-adjustments/{adjustmentId}/decision, POST /discretionary-adjustments/{adjustmentId}/reverse"
  - priority: 63
    category: state
    check: "metric.status == DRAFT (an actual may be filed exactly once)"
    error_id: ERR_METRIC_ACTUAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /company-metrics/{metricId}/actual"
  - priority: 64
    category: state
    check: "Pool is in the calibration_status the requested transition declares in §1.2 (submit-scorecard needs DRAFT, scorecard-decision needs SCORECARD_SUBMITTED, submit-calibration needs FUNDED|ALLOCATING, calibration-decision needs CALIBRATION_SUBMITTED|CALIBRATED)"
    error_id: ERR_POOL_STATE_INVALID
    http_status: 409
    applies_to: "all POST /bu-pools/{poolId}/* endpoints"
  - priority: 65
    category: state
    check: "pool.calibration_status IN {FUNDED, ALLOCATING} when money moves into an award of it"
    error_id: ERR_POOL_NOT_ALLOCATING
    http_status: 409
    applies_to: "POST /participant-awards/{awardId}/propose-allocation, POST /participant-awards/{awardId}/retract-allocation, POST /discretionary-adjustments"
  - priority: 66
    category: state
    check: "award.allocation_status == UNALLOCATED or PROPOSED for propose-allocation; == PROPOSED for retract-allocation; IN {PROPOSED, CALIBRATED} for a discretionary adjustment"
    error_id: ERR_AWARD_STATE_INVALID
    http_status: 409
    applies_to: "POST /participant-awards/{awardId}/propose-allocation, POST /participant-awards/{awardId}/retract-allocation, POST /discretionary-adjustments"
  - priority: 67
    category: state
    check: "adjustment.status == PENDING_APPROVAL for a decision; == APPROVED for a reverse"
    error_id: ERR_ADJUSTMENT_NOT_PENDING
    http_status: 409
    applies_to: "POST /discretionary-adjustments/{adjustmentId}/decision, POST /discretionary-adjustments/{adjustmentId}/reverse"
  - priority: 68
    category: state
    check: "period.status == OPEN for post; == POSTED for reverse"
    error_id: ERR_ACCRUAL_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /accrual-periods/{periodId}/post, POST /accrual-periods/{periodId}/reverse"
  - priority: 69
    category: state
    check: "plan.status NOT IN {PAID_OUT, SETTLED} when accruing; plan.status != SETTLED when reversing an accrual"
    error_id: ERR_PLAN_ALREADY_SETTLED
    http_status: 409
    applies_to: "POST /accrual-periods, POST /accrual-periods/{periodId}/post, POST /accrual-periods/{periodId}/reverse"
  - priority: 70
    category: state
    check: "run.status == DRAFT for execute; == EXECUTED for settle-true-up; at most one PayoutRun per plan may exist"
    error_id: ERR_PAYOUT_ALREADY_EXECUTED
    http_status: 409
    applies_to: "POST /payout-runs, POST /payout-runs/{payoutRunId}/execute, POST /payout-runs/{payoutRunId}/settle-true-up"
  - priority: 71
    category: state
    check: "plan.status == LOCKED when a payout run executes; plan.status == PAID_OUT when it settles"
    error_id: ERR_PLAN_NOT_LOCKED
    http_status: 409
    applies_to: "POST /payout-runs/{payoutRunId}/execute, POST /payout-runs/{payoutRunId}/settle-true-up"
  - priority: 72
    category: state
    check: "dispute.status == OPEN for assign-review; == UNDER_REVIEW for resolve"
    error_id: ERR_DISPUTE_NOT_UNDER_REVIEW
    http_status: 409
    applies_to: "POST /disputes/{disputeId}/assign-review, POST /disputes/{disputeId}/resolve"
  - priority: 73
    category: state
    check: "plan.status IN {LOCKED, PAID_OUT} when a dispute is filed (an award must exist and be final before it can be disputed)"
    error_id: ERR_DISPUTE_NOT_ALLOWED_YET
    http_status: 409
    applies_to: "POST /disputes"

  # --- concurrency ------------------------------------------------------
  - priority: 75
    category: state
    check: "expected_pool_version == pool.version (see §1.2.1 allocation-propose-stale-pool / allocation-retract-stale-pool)"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /participant-awards/{awardId}/propose-allocation, POST /participant-awards/{awardId}/retract-allocation"
  - priority: 76
    category: state
    check: "expected_plan_version == plan.version (see §1.2.1 adjustment-create-stale-plan)"
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412
    applies_to: "POST /discretionary-adjustments"

  # --- governance safety (before every money check) ---------------------
  - priority: 80
    category: business_safety
    check: "Segregation of duties: X-User-ID != adjustment.submitted_by_user_id when deciding an adjustment; X-User-ID != plan.certified_by_user_id when locking the plan"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /discretionary-adjustments/{adjustmentId}/decision, POST /bonus-plans/{planId}/lock"
  - priority: 81
    category: business_safety
    check: "documentation_ref is present and non-empty when abs(adjustment_cents) > 100000"
    error_id: ERR_ADJUSTMENT_DOCUMENTATION_REQUIRED
    http_status: 422
    applies_to: "POST /discretionary-adjustments"
  - priority: 82
    category: business_safety
    check: "plan.governance_posture == COMPLIANT when locking the plan"
    error_id: ERR_GOVERNANCE_POSTURE_BREACHED
    http_status: 409
    applies_to: "POST /bonus-plans/{planId}/lock"

  # --- temporal integrity -----------------------------------------------
  - priority: 85
    category: business_temporal
    check: "EligibilityEvent.effective_date inside [plan.plan_period_start, plan.plan_period_end)"
    error_id: ERR_EVENT_DATE_OUTSIDE_PLAN_PERIOD
    http_status: 422
    applies_to: "POST /eligibility-events"
  - priority: 86
    category: business_temporal
    check: "EligibilityEvent.effective_date >= participant.hire_date, and for a LEAVE also leave_end_date >= effective_date"
    error_id: ERR_EVENT_DATE_BEFORE_HIRE
    http_status: 422
    applies_to: "POST /eligibility-events"
  - priority: 87
    category: business_temporal
    check: |
      A new LEAVE interval [effective_date, leave_end_date + 1 day) must not
      overlap any existing non-superseded LEAVE interval of the same
      participant. Half-open semantics: an interval starting exactly on the day
      after another's leave_end_date is ADJACENT and allowed.
    error_id: ERR_LEAVE_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /eligibility-events"
  - priority: 88
    category: business_temporal
    check: "No event may be recorded with effective_date strictly after an existing non-superseded TERMINATION effective_date of the same participant, and a second TERMINATION is refused unless it supersedes the first"
    error_id: ERR_PARTICIPANT_ALREADY_TERMINATED
    http_status: 409
    applies_to: "POST /eligibility-events"
  - priority: 89
    category: business_temporal
    check: |
      AccrualPeriod intervals are CLOSED-INCLUSIVE [period_start, period_end]
      and must tile the plan period without overlap: a new period must not
      overlap any existing non-REVERSED period of the plan.
    error_id: ERR_ACCRUAL_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /accrual-periods"
  - priority: 90
    category: business_temporal
    check: |
      Contiguity: period_start must equal plan.plan_period_start for the first
      period of a plan, otherwise the latest existing period_end + 1 day. A
      one-day hole is rejected — unlike LEAVE intervals, accrual periods may not
      be adjacent-with-a-gap.
    error_id: ERR_ACCRUAL_PERIOD_GAP
    http_status: 422
    applies_to: "POST /accrual-periods"
  - priority: 91
    category: business_temporal
    check: "Every earlier AccrualPeriod of the plan is POSTED or REVERSED before this one posts"
    error_id: ERR_ACCRUAL_PERIOD_GAP
    http_status: 422
    applies_to: "POST /accrual-periods/{periodId}/post"
  - priority: 92
    category: business_temporal
    check: "No later AccrualPeriod of the plan is still POSTED when reversing (reversal is LIFO)"
    error_id: ERR_ACCRUAL_REVERSAL_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /accrual-periods/{periodId}/reverse"
  - priority: 93
    category: business_temporal
    check: "The logical clock date is >= plan.payment_date when a payout run executes"
    error_id: ERR_PAYMENT_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /payout-runs/{payoutRunId}/execute"

  # --- referential integrity --------------------------------------------
  - priority: 100
    category: business_referential
    check: "Every FK-bearing child belongs to the same plan as its siblings: award.plan_id == pool.plan_id, adjustment.plan_id == award.plan_id, dispute.plan_id == award.plan_id, dispute.participant_id == award.participant_id, participant.business_unit_id has a pool in this plan"
    error_id: ERR_PLAN_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /discretionary-adjustments, POST /disputes, POST /accrual-periods, POST /payout-runs"
  - priority: 101
    category: business_referential
    check: "Every Participant's job level in effect on any segment has a JobLevelTarget row in the plan"
    error_id: ERR_JOB_LEVEL_TARGET_MISSING
    http_status: 422
    applies_to: "POST /bonus-plans/{planId}/target-assignments"
  - priority: 102
    category: business_referential
    check: "Each award's resolved business unit has a BusinessUnitPool in the plan"
    error_id: ERR_POOL_MISSING_FOR_UNIT
    http_status: 422
    applies_to: "POST /bonus-plans/{planId}/target-assignments"
  - priority: 103
    category: business_referential
    check: "supersedes_event_id, when present, names an EligibilityEvent of the SAME participant that is not already superseded"
    error_id: ERR_SUPERSEDES_EVENT_INVALID
    http_status: 422
    applies_to: "POST /eligibility-events"
  - priority: 104
    category: business_referential
    check: "SUM of CompanyMetric.weight_pct over the plan == 100.00 exactly, and at least one metric exists"
    error_id: ERR_METRIC_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /bonus-plans/{planId}/submit-for-certification"
  - priority: 105
    category: business_referential
    check: "Every CompanyMetric of the plan has status ACTUAL_ENTERED"
    error_id: ERR_METRICS_NOT_ALL_ACTUALIZED
    http_status: 409
    applies_to: "POST /bonus-plans/{planId}/submit-for-certification"
  - priority: 106
    category: business_referential
    check: "Every BusinessUnitPool of the plan has calibration_status == SCORECARD_CERTIFIED"
    error_id: ERR_SCORECARDS_NOT_ALL_CERTIFIED
    http_status: 409
    applies_to: "POST /bonus-plans/{planId}/submit-for-certification"
  - priority: 107
    category: business_referential
    check: "plan.total_target_cents > 0 (at least one award survived the minimum-service gate)"
    error_id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http_status: 409
    applies_to: "POST /bonus-plans/{planId}/submit-for-certification"
  - priority: 108
    category: business_referential
    check: "Every BusinessUnitPool of the plan has calibration_status IN {CALIBRATION_SUBMITTED, CALIBRATED} to open calibration review, and == CALIBRATED to lock"
    error_id: ERR_POOL_CALIBRATION_PENDING
    http_status: 409
    applies_to: "POST /bonus-plans/{planId}/open-calibration, POST /bonus-plans/{planId}/lock"
  - priority: 109
    category: business_referential
    check: "No ParticipantAward of the plan has payment_status DEFERRED when settling"
    error_id: ERR_DEFERRED_AWARDS_PENDING
    http_status: 409
    applies_to: "POST /payout-runs/{payoutRunId}/settle-true-up"

  # --- distribution constraints ------------------------------------------
  - priority: 110
    category: business_constraint
    check: "plan.funding_multiplier > 0.0000 when funding the pool (a plan that missed the 80.00 funding floor cannot open allocation)"
    error_id: ERR_FUNDING_MULTIPLIER_ZERO
    http_status: 409
    applies_to: "POST /bonus-plans/{planId}/fund-pool"
  - priority: 111
    category: business_constraint
    check: "award.eligibility_status IN {ELIGIBLE, GOOD_LEAVER} — an INELIGIBLE_MIN_SERVICE or BAD_LEAVER award cannot receive an allocation or an adjustment"
    error_id: ERR_AWARD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /participant-awards/{awardId}/propose-allocation, POST /discretionary-adjustments"
  - priority: 112
    category: business_constraint
    check: |
      For a non-zero proposed_allocation_cents, the ratio
      proposed_allocation_cents / award.prorated_target_cents must satisfy
      guideline_min_ratio <= ratio <= guideline_max_ratio of the award's
      JobLevelTarget. Zero is always allowed (a manager may award nothing).
    error_id: ERR_GUIDELINE_RATIO_BREACH
    http_status: 422
    applies_to: "POST /participant-awards/{awardId}/propose-allocation"
  - priority: 113
    category: business_constraint
    check: "pool.top_tier_award_count <= pool.max_top_tier_count (awards at allocation_ratio >= 1.50 are capped at 25% of eligible headcount, floor, minimum 1)"
    error_id: ERR_TOP_TIER_CONCENTRATION
    http_status: 422
    applies_to: "POST /bu-pools/{poolId}/submit-calibration"
  - priority: 114
    category: business_constraint
    check: "pool.distribution_status IN {WITHIN_GUIDELINES, NO_ELIGIBLE_PARTICIPANTS} — an UNDER_UTILIZED or OVER_ALLOCATED pool cannot be submitted for or certified through calibration"
    error_id: ERR_POOL_NOT_WITHIN_GUIDELINES
    http_status: 422
    applies_to: "POST /bu-pools/{poolId}/submit-calibration, POST /bu-pools/{poolId}/calibration-decision"
  - priority: 115
    category: business_constraint
    check: "award.adjustment_total_cents == 0 when retracting (an approved discretionary adjustment must be reversed first)"
    error_id: ERR_AWARD_HAS_APPROVED_ADJUSTMENT
    http_status: 409
    applies_to: "POST /participant-awards/{awardId}/retract-allocation"
  - priority: 116
    category: business_constraint
    check: "award.final_award_cents + adjustment_cents >= 0 on approval"
    error_id: ERR_NEGATIVE_AWARD_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /discretionary-adjustments/{adjustmentId}/decision"
  - priority: 117
    category: business_constraint
    check: "dispute.adjusted_amount_cents <= 2 * award.final_award_cents"
    error_id: ERR_DISPUTE_ADJUSTMENT_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /disputes/{disputeId}/resolve"

  # --- fiscal (last) -----------------------------------------------------
  - priority: 120
    category: business_fiscal
    check: "abs(adjustment_cents) <= adjustment.per_award_cap_cents (max(50000, 25% of the prorated target), frozen at creation)"
    error_id: ERR_ADJUSTMENT_EXCEEDS_PER_AWARD_LIMIT
    http_status: 422
    applies_to: "POST /discretionary-adjustments/{adjustmentId}/decision"
  - priority: 121
    category: business_fiscal
    check: "pool.allocated_cents after this proposal (this award's previous amount removed first) <= pool.funded_cents"
    error_id: ERR_POOL_FUNDS_EXCEEDED
    http_status: 422
    applies_to: "POST /participant-awards/{awardId}/propose-allocation"
  - priority: 122
    category: business_fiscal
    check: "plan.discretionary_used_cents + abs(adjustment_cents) <= plan.discretionary_budget_cents"
    error_id: ERR_DISCRETIONARY_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /discretionary-adjustments/{adjustmentId}/decision"

# =============================================================================
# §1.5 API Endpoint Table
# Flat topology (api_prefix ""): every entity is its own top-level collection.
# Reverse-reachability: plan-scoped children are reachable as sub-resources of
# /bonus-plans/{planId}; every other FK is reachable through a filtered list.
# =============================================================================
endpoints:

  # ---------------- BonusPlan ----------------
  - method: POST
    path: "/bonus-plans"
    description: "Create a bonus plan: performance window, the three funding weights, discretionary budget percentage and the termination-treatment policy that selects the payout variant."
    roles: [PlanAdmin]
    code: 201
    input: [plan_year, plan_name, plan_period_start, plan_period_end, payment_date, company_weight_pct, business_unit_weight_pct, individual_weight_pct, "discretionary_budget_pct?", "termination_treatment_policy?"]
    output: BonusPlan
    side_effects: ["status = DRAFT", "all money and achievement fields initialised to 0", "governance_posture = COMPLIANT"]

  - method: POST
    path: "/bonus-plans/{planId}/target-assignments"
    description: "Build or refresh one ParticipantAward per participant: runs the proration calculation over the eligibility-event stream, assigns each award to a business-unit pool, and rolls the eligible targets up to the pools and the plan. Re-runnable while the plan is in TARGETS_SET."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: BonusPlan
    side_effects: ["calc participant_prorated_target per participant", "calc award_pool_assignment per award", "calc pool_distribution_state per pool", "plan.total_target_cents recomputed", "plan.status DRAFT -> TARGETS_SET (or TARGETS_SET self-transition)"]

  - method: POST
    path: "/bonus-plans/{planId}/submit-for-certification"
    description: "Submit the plan to the compensation committee: requires complete metric weights, all actuals filed, every business-unit scorecard certified and a positive total target."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: BonusPlan
    side_effects: ["plan.status TARGETS_SET -> PENDING_CERTIFICATION"]

  - method: POST
    path: "/bonus-plans/{planId}/certification-decision"
    description: "Compensation committee vote. decision=CERTIFY computes company, business-unit and blended achievement and the funding-curve multiplier; decision=RETURN sends the plan back to TARGETS_SET, decertifies every scorecard and clears the achievement fields."
    roles: [CompensationCommittee]
    code: 200
    input: [decision, "decision_note?"]
    output: BonusPlan
    side_effects: ["CERTIFY: calc company_achievement, bu_weighted_achievement, blended_achievement, funding_curve_multiplier; certified_by_user_id recorded", "RETURN: pools SCORECARD_CERTIFIED -> DRAFT; achievement fields and funding_multiplier reset; certified_by_user_id cleared"]

  - method: POST
    path: "/bonus-plans/{planId}/fund-pool"
    description: "Mint the fixed money: split the funded pool across business units by rounding each pool separately, freeze each pool's utilization floor, record the aggregate rounding divergence and reserve the discretionary budget."
    roles: [CompensationCommittee]
    code: 200
    input: []
    output: BonusPlan
    side_effects: ["calc pool_funding_split", "each pool SCORECARD_CERTIFIED -> FUNDED and distribution_status -> UNDER_UTILIZED", "plan.governance_posture -> FLAGGED while any pool is UNDER_UTILIZED", "plan.status CERTIFIED -> ALLOCATION_OPEN"]

  - method: POST
    path: "/bonus-plans/{planId}/open-calibration"
    description: "Close manager allocation and open the calibration review once every pool has submitted or been calibrated."
    roles: [PlanAdmin]
    code: 200
    input: []
    output: BonusPlan
    side_effects: ["plan.status ALLOCATION_OPEN -> CALIBRATION_REVIEW"]

  - method: POST
    path: "/bonus-plans/{planId}/lock"
    description: "Committee lock: freezes every calibrated pool and award, sums the locked total. Requires a COMPLIANT governance posture and an actor different from the certifier."
    roles: [CompensationCommittee]
    code: 200
    input: []
    output: BonusPlan
    side_effects: ["pools CALIBRATED -> LOCKED", "awards CALIBRATED -> LOCKED", "plan.locked_total_cents and locked_by_user_id written", "plan.status CALIBRATION_REVIEW -> LOCKED"]

  - method: GET
    path: "/bonus-plans/{planId}"
    description: "Read one bonus plan with every derived ledger field."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController, Employee]
    code: 200
    input: []
    output: BonusPlan
    side_effects: []

  - method: GET
    path: "/bonus-plans"
    description: "List bonus plans with pagination."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController, Employee]
    code: 200
    input: ["plan_year?", "status?", "limit?", "offset?"]
    output: BonusPlan[]
    side_effects: []

  - method: GET
    path: "/bonus-plans/{planId}/funding-summary"
    description: "Computed read: the full funding chain in one payload — company / business-unit / blended achievement, funding multiplier, per-pool funded total, aggregate rounding delta, discretionary budget and used amount, accrual ledger, governance posture."
    roles: [PlanAdmin, CompensationCommittee, FinanceController]
    code: 200
    input: []
    output: BonusPlan
    side_effects: []

  - method: GET
    path: "/company-metrics"
    description: "List company metrics filtered by plan or status, in created_at ASC order (reverse lookup for CompanyMetric.plan_id)."
    roles: [PlanAdmin, CompensationCommittee, FinanceController]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: CompanyMetric[]
    side_effects: []

  - method: GET
    path: "/job-level-targets"
    description: "List the job-level target grid filtered by plan or level, in created_at ASC order (reverse lookup for JobLevelTarget.plan_id)."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: ["plan_id?", "job_level?", "limit?", "offset?"]
    output: JobLevelTarget[]
    side_effects: []

  - method: GET
    path: "/accrual-periods"
    description: "List accrual periods filtered by plan or status, in period_start ASC order (reverse lookup for AccrualPeriod.plan_id)."
    roles: [PlanAdmin, FinanceController]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: AccrualPeriod[]
    side_effects: []

  - method: GET
    path: "/payout-runs"
    description: "List payout runs filtered by plan or status, in created_at ASC order (reverse lookup for PayoutRun.plan_id)."
    roles: [PlanAdmin, FinanceController]
    code: 200
    input: ["plan_id?", "status?", "limit?", "offset?"]
    output: PayoutRun[]
    side_effects: []

  # ---------------- CompanyMetric ----------------
  - method: POST
    path: "/company-metrics"
    description: "Add a company performance metric with its threshold / target / max band and its weight inside the company component."
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, metric_code, weight_pct, threshold_value, target_value, max_value]
    output: CompanyMetric
    side_effects: ["status = DRAFT", "achievement_pct = 0.00"]

  - method: POST
    path: "/company-metrics/{metricId}/actual"
    description: "File the audited actual for a metric exactly once and score it on the piecewise achievement curve (capped at 150.00)."
    roles: [PlanAdmin]
    code: 200
    input: [actual_value, "source_note?"]
    output: CompanyMetric
    side_effects: ["calc metric_achievement -> achievement_pct", "status DRAFT -> ACTUAL_ENTERED"]

  - method: GET
    path: "/company-metrics/{metricId}"
    description: "Read one company metric."
    roles: [PlanAdmin, CompensationCommittee, FinanceController]
    code: 200
    input: []
    output: CompanyMetric
    side_effects: []

  # ---------------- BusinessUnit ----------------
  - method: POST
    path: "/business-units"
    description: "Register a business unit. Its id is also the X-User-ID a BusinessUnitManager acts as."
    roles: [PlanAdmin]
    code: 201
    input: [unit_code, name]
    output: BusinessUnit
    side_effects: []

  - method: GET
    path: "/business-units/{unitId}"
    description: "Read one business unit."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: []
    output: BusinessUnit
    side_effects: []

  - method: GET
    path: "/business-units"
    description: "List business units."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: ["unit_code?", "limit?", "offset?"]
    output: BusinessUnit[]
    side_effects: []

  # ---------------- JobLevelTarget ----------------
  - method: POST
    path: "/job-level-targets"
    description: "Define a job level's target bonus percentage and the manager distribution guideline band (min/max allocation ratio) for that level."
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, job_level, target_bonus_pct, guideline_min_ratio, guideline_max_ratio]
    output: JobLevelTarget
    side_effects: []

  - method: GET
    path: "/job-level-targets/{targetId}"
    description: "Read one job-level target row."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: []
    output: JobLevelTarget
    side_effects: []

  # ---------------- Participant ----------------
  - method: POST
    path: "/participants"
    description: "Enrol an employee in the plan with hire date, job level, annual base salary and home business unit."
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, business_unit_id, employee_code, full_name, job_level, base_salary_cents, hire_date]
    output: Participant
    side_effects: ["employment_status = ACTIVE", "current_job_level / current_base_salary_cents / current_business_unit_id seeded from the input values"]

  - method: GET
    path: "/participants/{participantId}"
    description: "Read one participant including the current job level, salary and business unit derived from the eligibility-event stream."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController, Employee]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List participants filtered by plan, home business unit, current business unit or employment status (reverse lookup for Participant.plan_id, Participant.business_unit_id and Participant.current_business_unit_id)."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: ["plan_id?", "business_unit_id?", "current_business_unit_id?", "employment_status?", "job_level?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  # ---------------- EligibilityEvent ----------------
  - method: POST
    path: "/eligibility-events"
    description: "Append an append-only eligibility event (TRANSFER, LEAVE or TERMINATION). Immediately updates the participant's derived employment fields and, once awards exist, re-prorates the affected award and cascades the money roll-up through its pool to the plan. A correction is filed as a new event naming the mistaken one in supersedes_event_id."
    roles: [HRBusinessPartner]
    code: 201
    input: [participant_id, event_type, effective_date, "new_job_level?", "new_base_salary_cents?", "new_business_unit_id?", "leave_end_date?", "paid_leave?", "termination_reason?", "supersedes_event_id?", "note?"]
    output: EligibilityEvent
    side_effects: ["participant.employment_status / termination_date / termination_reason / current_job_level / current_base_salary_cents / current_business_unit_id updated", "the named supersedes_event_id row gets superseded = true", "if a ParticipantAward exists for the participant: calc participant_prorated_target and calc award_pool_assignment re-run, then calc pool_distribution_state on the old and new pool, then the plan roll-up", "a TERMINATION classified BAD_LEAVER zeroes a PROPOSED allocation"]

  - method: GET
    path: "/eligibility-events/{eventId}"
    description: "Read one eligibility event."
    roles: [PlanAdmin, HRBusinessPartner, CompensationCommittee, FinanceController]
    code: 200
    input: []
    output: EligibilityEvent
    side_effects: []

  - method: GET
    path: "/eligibility-events"
    description: "List eligibility events filtered by participant, destination business unit, superseded event or event type, in effective_date then created_at order (reverse lookup for EligibilityEvent.participant_id, EligibilityEvent.new_business_unit_id and EligibilityEvent.supersedes_event_id)."
    roles: [PlanAdmin, HRBusinessPartner, CompensationCommittee, FinanceController]
    code: 200
    input: ["participant_id?", "new_business_unit_id?", "supersedes_event_id?", "event_type?", "superseded?", "limit?", "offset?"]
    output: EligibilityEvent[]
    side_effects: []

  # ---------------- BusinessUnitPool ----------------
  - method: POST
    path: "/bu-pools"
    description: "Create the business unit's scorecard-and-allocation pool for a plan (one per plan and unit)."
    roles: [PlanAdmin]
    code: 201
    input: [plan_id, business_unit_id, "bu_metric_achievement_pct?", "scorecard_narrative?"]
    output: BusinessUnitPool
    side_effects: ["calibration_status = DRAFT", "distribution_status = NO_ELIGIBLE_PARTICIPANTS"]

  - method: POST
    path: "/bu-pools/{poolId}/submit-scorecard"
    description: "Business unit manager submits the unit scorecard achievement and its narrative for committee certification."
    roles: [BusinessUnitManager]
    code: 200
    input: [bu_metric_achievement_pct, scorecard_narrative]
    output: BusinessUnitPool
    side_effects: ["bu_metric_achievement_pct and scorecard_narrative overwritten", "calibration_status DRAFT -> SCORECARD_SUBMITTED"]

  - method: POST
    path: "/bu-pools/{poolId}/scorecard-decision"
    description: "Committee decision on a submitted scorecard: decision=CERTIFY moves it to SCORECARD_CERTIFIED, decision=RETURN sends it back to DRAFT for revision."
    roles: [CompensationCommittee]
    code: 200
    input: [decision, "decision_note?"]
    output: BusinessUnitPool
    side_effects: ["CERTIFY: scorecard_certified_by_user_id recorded, calibration_status -> SCORECARD_CERTIFIED", "RETURN: scorecard_certified_by_user_id cleared, calibration_status -> DRAFT"]

  - method: POST
    path: "/bu-pools/{poolId}/submit-calibration"
    description: "Manager submits the finished allocation of the pool for calibration review. Requires the pool to be within the utilization guidelines and the top-tier award count to be inside the concentration cap."
    roles: [BusinessUnitManager]
    code: 200
    input: ["scorecard_narrative?"]
    output: BusinessUnitPool
    side_effects: ["calibration_status FUNDED|ALLOCATING -> CALIBRATION_SUBMITTED"]

  - method: POST
    path: "/bu-pools/{poolId}/calibration-decision"
    description: "Plan admin calibration verdict: decision=CERTIFY promotes every proposed award to CALIBRATED, decision=RETURN reopens the pool for reallocation, demotes its calibrated awards back to PROPOSED and bubbles the plan back from CALIBRATION_REVIEW to ALLOCATION_OPEN."
    roles: [PlanAdmin]
    code: 200
    input: [decision, "decision_note?"]
    output: BusinessUnitPool
    side_effects: ["CERTIFY: awards PROPOSED -> CALIBRATED, calibration_status -> CALIBRATED", "RETURN: calibration_returned_count += 1, awards CALIBRATED -> PROPOSED, calibration_status -> ALLOCATING, plan CALIBRATION_REVIEW -> ALLOCATION_OPEN"]

  - method: GET
    path: "/bu-pools/{poolId}"
    description: "Read one business-unit pool with its funded, allocated, available and utilization figures."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: []
    output: BusinessUnitPool
    side_effects: []

  - method: GET
    path: "/bu-pools"
    description: "List business-unit pools filtered by plan, unit, calibration status or distribution status (reverse lookup for BusinessUnitPool.plan_id and BusinessUnitPool.business_unit_id)."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: ["plan_id?", "business_unit_id?", "calibration_status?", "distribution_status?", "limit?", "offset?"]
    output: BusinessUnitPool[]
    side_effects: []

  # ---------------- ParticipantAward ----------------
  - method: POST
    path: "/participant-awards/{awardId}/propose-allocation"
    description: "Manager allocates money to one award inside the fixed pool. Requires the pool version the manager's remaining-balance view was computed from, a ratio inside the level's guideline band and enough remaining pool money. Re-callable to revise the amount."
    roles: [BusinessUnitManager]
    code: 200
    input: [proposed_allocation_cents, allocation_rationale, expected_pool_version]
    output: ParticipantAward
    side_effects: ["award.proposed_allocation_cents / allocation_ratio / final_award_cents / allocation_rationale written", "allocation_status UNALLOCATED -> PROPOSED (or PROPOSED self-transition)", "pool FUNDED -> ALLOCATING on the first allocation", "calc pool_distribution_state then the plan governance roll-up", "pool.version increments"]

  - method: POST
    path: "/participant-awards/{awardId}/retract-allocation"
    description: "Manager releases an allocation back to the pool. Compensating action: every pool and plan figure returns to its pre-allocation value. Blocked while an approved discretionary adjustment sits on the award."
    roles: [BusinessUnitManager]
    code: 200
    input: [expected_pool_version, "retraction_reason?"]
    output: ParticipantAward
    side_effects: ["proposed_allocation_cents = 0, allocation_ratio = 0.0000, final_award_cents = 0, retraction_count += 1, allocation_rationale = retraction_reason", "allocation_status PROPOSED -> UNALLOCATED", "calc pool_distribution_state then the plan governance roll-up", "pool.version increments"]

  - method: GET
    path: "/participant-awards/{awardId}"
    description: "Read one award: proration inputs (credited_days, excluded_leave_days, segment_count), eligibility classification, both state dimensions and every money field."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController, Employee]
    code: 200
    input: []
    output: ParticipantAward
    side_effects: []

  - method: GET
    path: "/participant-awards"
    description: "List awards filtered by plan, participant, business unit, pool, allocation status, payment status or eligibility status (reverse lookup for ParticipantAward.plan_id, participant_id, business_unit_id and bu_pool_id)."
    roles: [PlanAdmin, CompensationCommittee, BusinessUnitManager, HRBusinessPartner, FinanceController]
    code: 200
    input: ["plan_id?", "participant_id?", "business_unit_id?", "bu_pool_id?", "allocation_status?", "payment_status?", "eligibility_status?", "limit?", "offset?"]
    output: ParticipantAward[]
    side_effects: []

  - method: GET
    path: "/participant-awards/{awardId}/payout-preview"
    description: "Computed read: what the payout verdict would be for this award under the plan's active termination-treatment policy, without changing any state."
    roles: [PlanAdmin, CompensationCommittee, FinanceController, HRBusinessPartner]
    code: 200
    input: []
    output: ParticipantAward
    side_effects: []

  # ---------------- DiscretionaryAdjustment ----------------
  - method: POST
    path: "/discretionary-adjustments"
    description: "File a discretionary adjustment against an award, drawn on the plan-level discretionary budget. The per-award cap is frozen at creation. Requires the plan version whose remaining discretionary budget the amount was sized from, and documentation for any adjustment above 100000 cents."
    roles: [PlanAdmin, HRBusinessPartner]
    code: 201
    input: [plan_id, award_id, adjustment_cents, justification, "documentation_ref?", expected_plan_version]
    output: DiscretionaryAdjustment
    side_effects: ["calc discretionary_cap -> per_award_cap_cents frozen", "submitted_by_user_id = X-User-ID", "status = PENDING_APPROVAL; no money moves yet"]

  - method: POST
    path: "/discretionary-adjustments/{adjustmentId}/decision"
    description: "Committee decision on an adjustment. decision=APPROVE enforces segregation of duties, the frozen per-award cap and the plan discretionary budget, then pushes the money through award, pool and plan; decision=REJECT records the verdict and moves no money."
    roles: [CompensationCommittee]
    code: 200
    input: [decision, "decision_note?"]
    output: DiscretionaryAdjustment
    side_effects: ["APPROVE: plan.discretionary_used_cents += abs(adjustment_cents), award.adjustment_total_cents / final_award_cents updated, calc pool_distribution_state, plan governance roll-up", "REJECT: decided_by_user_id and decision_note only"]

  - method: POST
    path: "/discretionary-adjustments/{adjustmentId}/reverse"
    description: "Reverse an approved adjustment. Compensating action: the discretionary budget, the award total, the pool figures and the plan governance posture all return to their pre-approval values."
    roles: [CompensationCommittee]
    code: 200
    input: [decision_note]
    output: DiscretionaryAdjustment
    side_effects: ["plan.discretionary_used_cents -= abs(adjustment_cents)", "award.adjustment_total_cents -= adjustment_cents and final_award_cents recomputed", "calc pool_distribution_state, plan governance roll-up", "status APPROVED -> REVERSED"]

  - method: GET
    path: "/discretionary-adjustments/{adjustmentId}"
    description: "Read one discretionary adjustment with its frozen per-award cap and its decision trail."
    roles: [PlanAdmin, CompensationCommittee, HRBusinessPartner, FinanceController]
    code: 200
    input: []
    output: DiscretionaryAdjustment
    side_effects: []

  - method: GET
    path: "/discretionary-adjustments"
    description: "List discretionary adjustments filtered by plan, award or status (reverse lookup for DiscretionaryAdjustment.plan_id and DiscretionaryAdjustment.award_id)."
    roles: [PlanAdmin, CompensationCommittee, HRBusinessPartner, FinanceController]
    code: 200
    input: ["plan_id?", "award_id?", "status?", "limit?", "offset?"]
    output: DiscretionaryAdjustment[]
    side_effects: []

  # ---------------- AccrualPeriod ----------------
  - method: POST
    path: "/accrual-periods"
    description: "Open an accrual period. Periods are closed-inclusive and must tile the plan period contiguously with no overlap and no gap."
    roles: [FinanceController]
    code: 201
    input: [plan_id, period_start, period_end, forecast_company_achievement_pct]
    output: AccrualPeriod
    side_effects: ["status = OPEN"]

  - method: POST
    path: "/accrual-periods/{periodId}/post"
    description: "Post the period: value the pool under the provisional (forecast) funding variant, accrue it pro rata over elapsed days, take the difference against the ledger already posted, and load employer burden at the tier selected from the pre-burden cumulative figure."
    roles: [FinanceController]
    code: 200
    input: ["posting_note?"]
    output: AccrualPeriod
    side_effects: ["calc provisional_pool_funding then calc period_accrual_with_burden", "plan.accrued_base_cents += period_accrual_cents, plan.accrued_total_cents += total_period_cents", "status OPEN -> POSTED"]

  - method: POST
    path: "/accrual-periods/{periodId}/reverse"
    description: "Reverse the most recent posted period. Compensating action: both plan accrual accumulators return to their pre-posting values while the period keeps its computed amounts for audit."
    roles: [FinanceController]
    code: 200
    input: [reversal_reason]
    output: AccrualPeriod
    side_effects: ["plan.accrued_base_cents -= period_accrual_cents, plan.accrued_total_cents -= total_period_cents", "status POSTED -> REVERSED"]

  - method: GET
    path: "/accrual-periods/{periodId}"
    description: "Read one accrual period with its provisional basis, elapsed days, cumulative target, period movement, burden rate and loaded total."
    roles: [PlanAdmin, FinanceController, CompensationCommittee]
    code: 200
    input: []
    output: AccrualPeriod
    side_effects: []

  # ---------------- PayoutRun ----------------
  - method: POST
    path: "/payout-runs"
    description: "Open the payout run for a locked plan (at most one run per plan)."
    roles: [FinanceController]
    code: 201
    input: [plan_id, "run_note?"]
    output: PayoutRun
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/payout-runs/{payoutRunId}/execute"
    description: "Execute the payout on or after the plan's payment date: applies the plan's termination-treatment variant to every locked award, defers awards under live dispute, and moves the plan to PAID_OUT."
    roles: [FinanceController]
    code: 200
    input: []
    output: PayoutRun
    side_effects: ["calc payout_verdict per locked award -> payment_status PAID | FORFEITED | DEFERRED and payout_amount_cents", "run counters and totals written", "plan.paid_total_cents / forfeited_total_cents written, plan.status LOCKED -> PAID_OUT", "status DRAFT -> EXECUTED"]

  - method: POST
    path: "/payout-runs/{payoutRunId}/settle-true-up"
    description: "Settle the plan: recompute employer burden on the cash actually paid and book the signed true-up against the accrued ledger. Blocked while any award is still deferred by a dispute."
    roles: [FinanceController]
    code: 200
    input: ["settlement_note?"]
    output: PayoutRun
    side_effects: ["calc settlement_true_up -> settlement_burden_cents, true_up_cents mirrored onto the plan", "status EXECUTED -> SETTLED, plan.status PAID_OUT -> SETTLED"]

  - method: GET
    path: "/payout-runs/{payoutRunId}"
    description: "Read one payout run with its per-verdict counters, totals and settlement figures."
    roles: [PlanAdmin, FinanceController, CompensationCommittee]
    code: 200
    input: []
    output: PayoutRun
    side_effects: []

  # ---------------- Dispute ----------------
  - method: POST
    path: "/disputes"
    description: "Employee files a dispute against their own final award once the plan is locked. A live dispute defers the cash at payout time."
    roles: [Employee]
    code: 201
    input: [plan_id, award_id, participant_id, dispute_reason, "claimed_amount_cents?"]
    output: Dispute
    side_effects: ["status = OPEN"]

  - method: POST
    path: "/disputes/{disputeId}/assign-review"
    description: "HR business partner takes the dispute under review."
    roles: [HRBusinessPartner]
    code: 200
    input: ["reviewer_note?"]
    output: Dispute
    side_effects: ["assigned_by_user_id recorded", "status OPEN -> UNDER_REVIEW"]

  - method: POST
    path: "/disputes/{disputeId}/resolve"
    description: "Resolve the dispute: resolution=UPHOLD releases the deferred award to its computed verdict, resolution=ADJUST overrides the payout (capped at twice the final award) and books the difference on the plan."
    roles: [HRBusinessPartner]
    code: 200
    input: [resolution, "adjusted_amount_cents?", "resolution_note?"]
    output: Dispute
    side_effects: ["award payment_status DEFERRED -> PAID or FORFEITED", "ADJUST: award.payout_amount_cents = adjusted_amount_cents, plan.dispute_adjustment_cents updated", "plan.paid_total_cents / forfeited_total_cents recomputed", "status UNDER_REVIEW -> RESOLVED_UPHELD | RESOLVED_ADJUSTED"]

  - method: GET
    path: "/disputes/{disputeId}"
    description: "Read one dispute with its review and resolution trail."
    roles: [PlanAdmin, CompensationCommittee, HRBusinessPartner, FinanceController, Employee]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes filtered by plan, award, participant or status (reverse lookup for Dispute.plan_id, Dispute.award_id and Dispute.participant_id)."
    roles: [PlanAdmin, CompensationCommittee, HRBusinessPartner, FinanceController]
    code: 200
    input: ["plan_id?", "award_id?", "participant_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  # ---------------- test-driving surface ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every date comparison in this domain reads (payment-date reachability, accrual posting, event recording). MANDATORY DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlanAdmin, FinanceController]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["The logical clock used by every subsequent request is set to current_utc"]

# =============================================================================
# §1.6 Error Code Catalog
# Every id below is reachable from at least one §1.5 endpoint; the §1.4 ladder
# fixes which one wins when several apply.
# =============================================================================
errors:

  # --- auth / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or naming a role outside §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_FORBIDDEN_RESOURCE_OWNERSHIP
    http: 403
    condition: "An entity-backed role acts on a resource it does not own: BusinessUnitManager whose X-User-ID differs from pool.business_unit_id / award.business_unit_id, or Employee whose X-User-ID differs from the disputed award's participant_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the incompatible earlier step: approving an adjustment they submitted, or locking a plan they certified"

  # --- not found ---
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "{planId} or a body plan_id names no BonusPlan"
  - id: ERR_METRIC_NOT_FOUND
    http: 404
    condition: "{metricId} names no CompanyMetric"
  - id: ERR_BUSINESS_UNIT_NOT_FOUND
    http: 404
    condition: "{unitId}, business_unit_id or new_business_unit_id names no BusinessUnit"
  - id: ERR_JOB_LEVEL_TARGET_NOT_FOUND
    http: 404
    condition: "{targetId} names no JobLevelTarget"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "{participantId} or a body participant_id names no Participant"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "{eventId} or supersedes_event_id names no EligibilityEvent"
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "{poolId} or a body bu_pool_id names no BusinessUnitPool"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "{awardId} or a body award_id names no ParticipantAward"
  - id: ERR_ADJUSTMENT_NOT_FOUND
    http: 404
    condition: "{adjustmentId} names no DiscretionaryAdjustment"
  - id: ERR_ACCRUAL_PERIOD_NOT_FOUND
    http: 404
    condition: "{periodId} names no AccrualPeriod"
  - id: ERR_PAYOUT_RUN_NOT_FOUND
    http: 404
    condition: "{payoutRunId} names no PayoutRun"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "{disputeId} names no Dispute"

  # --- request shape / uniqueness ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required input field, enum outside its declared set, malformed date, non-integer cents, pagination outside 1..100 / offset < 0, or a conditionally-required field absent for the given event_type / decision / resolution"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A declared uniqueness constraint is violated: (plan_year, plan_name), (plan_id, metric_code), unit_code, (plan_id, job_level), (plan_id, employee_code) or (plan_id, business_unit_id) for a pool"

  # --- intra-entity field relationships ---
  - id: ERR_PLAN_WEIGHTS_INVALID
    http: 422
    condition: "The three funding weights do not sum to exactly 100.00"
  - id: ERR_PLAN_PERIOD_INVALID
    http: 422
    condition: "plan_period_end is not exactly 365 days after plan_period_start, or payment_date precedes plan_period_end"
  - id: ERR_METRIC_BAND_INVALID
    http: 422
    condition: "The metric band is not strictly increasing: threshold_value < target_value < max_value violated"
  - id: ERR_GUIDELINE_BAND_INVALID
    http: 422
    condition: "guideline_min_ratio is not strictly below guideline_max_ratio, or a ratio falls outside 0..5"

  # --- lifecycle state ---
  - id: ERR_PLAN_STATE_INVALID
    http: 409
    condition: "The plan is not in the state the requested plan transition requires"
  - id: ERR_PLAN_NOT_IN_SETUP
    http: 409
    condition: "A setup-phase write (metric, target grid, participant, pool, scorecard) was attempted while the plan had already left DRAFT / TARGETS_SET"
  - id: ERR_PLAN_NOT_IN_ALLOCATION
    http: 409
    condition: "An allocation-phase write was attempted while the plan was outside ALLOCATION_OPEN (or ALLOCATION_OPEN / CALIBRATION_REVIEW for adjustment and calibration operations)"
  - id: ERR_PLAN_NOT_LOCKED
    http: 409
    condition: "A payout run tried to execute on a plan that is not LOCKED, or to settle a plan that is not PAID_OUT"
  - id: ERR_PLAN_ALREADY_SETTLED
    http: 409
    condition: "An accrual period was created, posted or reversed after the plan reached PAID_OUT / SETTLED"
  - id: ERR_METRIC_ACTUAL_ALREADY_FILED
    http: 409
    condition: "An actual was filed for a CompanyMetric already in ACTUAL_ENTERED"
  - id: ERR_POOL_STATE_INVALID
    http: 409
    condition: "The pool is not in the calibration_status the requested pool transition requires"
  - id: ERR_POOL_NOT_ALLOCATING
    http: 409
    condition: "Money was moved into an award whose pool is not FUNDED or ALLOCATING"
  - id: ERR_AWARD_STATE_INVALID
    http: 409
    condition: "The award's allocation_status forbids the requested operation (retracting an unallocated award, allocating to a locked award, adjusting an unallocated award)"
  - id: ERR_ADJUSTMENT_NOT_PENDING
    http: 409
    condition: "A decision was requested on an adjustment that is not PENDING_APPROVAL, or a reversal on one that is not APPROVED"
  - id: ERR_ACCRUAL_ALREADY_POSTED
    http: 409
    condition: "post was called on a period that is not OPEN, or reverse on a period that is not POSTED"
  - id: ERR_PAYOUT_ALREADY_EXECUTED
    http: 409
    condition: "execute was called on a run that is not DRAFT, settle-true-up on a run that is not EXECUTED, or a second PayoutRun was opened for the same plan"
  - id: ERR_DISPUTE_NOT_UNDER_REVIEW
    http: 409
    condition: "assign-review was called on a dispute that is not OPEN, or resolve on a dispute that is not UNDER_REVIEW"
  - id: ERR_DISPUTE_NOT_ALLOWED_YET
    http: 409
    condition: "A dispute was filed before the plan reached LOCKED, or after it settled"

  # --- concurrency ---
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_pool_version does not match the pool's current version (see §1.2.1)"
  - id: ERR_STALE_PLAN_VERSION
    http: 412
    condition: "expected_plan_version does not match the plan's current version (see §1.2.1)"

  # --- governance safety ---
  - id: ERR_ADJUSTMENT_DOCUMENTATION_REQUIRED
    http: 422
    condition: "abs(adjustment_cents) exceeds 100000 while documentation_ref is absent or empty"
  - id: ERR_GOVERNANCE_POSTURE_BREACHED
    http: 409
    condition: "A lock was attempted while plan.governance_posture is FLAGGED or BREACHED"

  # --- temporal integrity ---
  - id: ERR_EVENT_DATE_OUTSIDE_PLAN_PERIOD
    http: 422
    condition: "An eligibility event's effective_date falls outside [plan_period_start, plan_period_end)"
  - id: ERR_EVENT_DATE_BEFORE_HIRE
    http: 422
    condition: "An eligibility event predates the participant's hire_date, or a LEAVE ends before it starts"
  - id: ERR_LEAVE_INTERVAL_OVERLAP
    http: 409
    condition: "A new LEAVE interval [effective_date, leave_end_date + 1 day) overlaps an existing non-superseded LEAVE of the same participant; adjacency (start == previous end + 1 day) is allowed"
  - id: ERR_PARTICIPANT_ALREADY_TERMINATED
    http: 409
    condition: "An event was recorded after an existing non-superseded TERMINATION, or a second TERMINATION was filed without superseding the first"
  - id: ERR_ACCRUAL_PERIOD_OVERLAP
    http: 409
    condition: "A new closed-inclusive accrual interval overlaps an existing non-REVERSED period of the plan"
  - id: ERR_ACCRUAL_PERIOD_GAP
    http: 422
    condition: "A new accrual period does not start on plan_period_start (first period) or on the previous period_end + 1 day, or an earlier period of the plan is still OPEN when this one posts"
  - id: ERR_ACCRUAL_REVERSAL_OUT_OF_ORDER
    http: 409
    condition: "A period was reversed while a later period of the plan is still POSTED"
  - id: ERR_PAYMENT_DATE_NOT_REACHED
    http: 409
    condition: "The payout run executed before the logical clock reached plan.payment_date"

  # --- referential integrity ---
  - id: ERR_PLAN_SCOPE_MISMATCH
    http: 422
    condition: "A child references entities from different plans, or a dispute's participant_id differs from the award's participant_id"
  - id: ERR_JOB_LEVEL_TARGET_MISSING
    http: 422
    condition: "A participant holds a job level with no JobLevelTarget row in the plan"
  - id: ERR_POOL_MISSING_FOR_UNIT
    http: 422
    condition: "An award's resolved business unit has no BusinessUnitPool in the plan"
  - id: ERR_SUPERSEDES_EVENT_INVALID
    http: 422
    condition: "supersedes_event_id names an event of a different participant or one that is already superseded"
  - id: ERR_METRIC_WEIGHTS_INVALID
    http: 422
    condition: "The plan's CompanyMetric weights do not sum to exactly 100.00, or the plan has no metric at all"
  - id: ERR_METRICS_NOT_ALL_ACTUALIZED
    http: 409
    condition: "Certification was requested while some CompanyMetric of the plan is still DRAFT"
  - id: ERR_SCORECARDS_NOT_ALL_CERTIFIED
    http: 409
    condition: "Certification was requested while some BusinessUnitPool of the plan is not SCORECARD_CERTIFIED"
  - id: ERR_NO_ELIGIBLE_PARTICIPANTS
    http: 409
    condition: "Certification was requested while plan.total_target_cents == 0 (no award survived the 90-day minimum-service gate)"
  - id: ERR_POOL_CALIBRATION_PENDING
    http: 409
    condition: "open-calibration found a pool outside {CALIBRATION_SUBMITTED, CALIBRATED}, or lock found a pool that is not CALIBRATED"
  - id: ERR_DEFERRED_AWARDS_PENDING
    http: 409
    condition: "Settlement was attempted while some award is still DEFERRED by a live dispute"

  # --- distribution constraints ---
  - id: ERR_FUNDING_MULTIPLIER_ZERO
    http: 409
    condition: "fund-pool was called on a plan whose blended achievement missed the 80.00 funding floor, so the multiplier is 0.0000"
  - id: ERR_AWARD_NOT_ELIGIBLE
    http: 422
    condition: "An allocation or adjustment targeted an award classified INELIGIBLE_MIN_SERVICE or BAD_LEAVER"
  - id: ERR_GUIDELINE_RATIO_BREACH
    http: 422
    condition: "A non-zero allocation ratio falls outside the job level's [guideline_min_ratio, guideline_max_ratio] band"
  - id: ERR_TOP_TIER_CONCENTRATION
    http: 422
    condition: "The pool's count of awards at allocation_ratio >= 1.50 exceeds max(1, floor(eligible_headcount * 25 / 100))"
  - id: ERR_POOL_NOT_WITHIN_GUIDELINES
    http: 422
    condition: "Calibration was submitted or certified while the pool is UNDER_UTILIZED or OVER_ALLOCATED"
  - id: ERR_AWARD_HAS_APPROVED_ADJUSTMENT
    http: 409
    condition: "Retraction was attempted while the award still carries a non-zero adjustment_total_cents"
  - id: ERR_NEGATIVE_AWARD_NOT_ALLOWED
    http: 422
    condition: "Approving the adjustment would drive award.final_award_cents below zero"
  - id: ERR_DISPUTE_ADJUSTMENT_EXCEEDS_LIMIT
    http: 422
    condition: "A dispute resolution's adjusted_amount_cents exceeds twice the award's final_award_cents"

  # --- fiscal ---
  - id: ERR_ADJUSTMENT_EXCEEDS_PER_AWARD_LIMIT
    http: 422
    condition: "abs(adjustment_cents) exceeds the per-award cap frozen at creation: max(50000, 25% of the prorated target)"
  - id: ERR_POOL_FUNDS_EXCEEDED
    http: 422
    condition: "The proposed allocation would push the pool's allocated_cents above its frozen funded_cents"
  - id: ERR_DISCRETIONARY_BUDGET_EXCEEDED
    http: 422
    condition: "Approving the adjustment would push plan.discretionary_used_cents above plan.discretionary_budget_cents"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# The plan admin builds and calibrates, the committee certifies / funds / locks
# and rules on discretionary money, managers spend inside their own pool,
# finance accrues and pays, HR owns the employee record and disputes, and the
# employee may only look at and dispute their own award. Two same-user
# prohibitions are enforced on top of the role split: an adjustment's submitter
# may not decide it, and the plan's certifier may not lock it.
# =============================================================================
roles:

  - name: PlanAdmin
    description: "Corporate incentive plan team: designs the plan, the metric set, the job-level target grid, the participant population and the pools; runs target assignment; opens and adjudicates calibration; files discretionary adjustments."
    identity: opaque
    exclusive_operations:
      - "POST /bonus-plans"
      - "POST /bonus-plans/{planId}/target-assignments"
      - "POST /bonus-plans/{planId}/submit-for-certification"
      - "POST /bonus-plans/{planId}/open-calibration"
      - "POST /company-metrics"
      - "POST /company-metrics/{metricId}/actual"
      - "POST /business-units"
      - "POST /job-level-targets"
      - "POST /participants"
      - "POST /bu-pools"
      - "POST /bu-pools/{poolId}/calibration-decision"
    shared_operations:
      - "POST /discretionary-adjustments (with HRBusinessPartner)"
      - "POST /_clock/set_current_utc (with FinanceController)"
      - "all GET reads of plans, metrics, targets, participants, events, pools, awards, adjustments, accrual periods, payout runs and disputes"

  - name: CompensationCommittee
    description: "Governance body: certifies the performance metrics and the business-unit scorecards, approves pool funding, rules on discretionary adjustments and locks the plan."
    identity: opaque
    exclusive_operations:
      - "POST /bonus-plans/{planId}/certification-decision"
      - "POST /bonus-plans/{planId}/fund-pool"
      - "POST /bonus-plans/{planId}/lock"
      - "POST /bu-pools/{poolId}/scorecard-decision"
      - "POST /discretionary-adjustments/{adjustmentId}/decision"
      - "POST /discretionary-adjustments/{adjustmentId}/reverse"
    shared_operations:
      - "all GET reads of plans, metrics, pools, awards, adjustments, accrual periods, payout runs and disputes"
    note: "May not lock a plan it certified (X-User-ID compared against plan.certified_by_user_id) and may not decide an adjustment it submitted."

  - name: BusinessUnitManager
    description: "Business unit leader: submits the unit scorecard, allocates the unit's fixed pool award by award, and submits the finished distribution for calibration. Acts only on its own unit."
    identity: "entity_backed:BusinessUnit"
    exclusive_operations:
      - "POST /bu-pools/{poolId}/submit-scorecard"
      - "POST /bu-pools/{poolId}/submit-calibration"
      - "POST /participant-awards/{awardId}/propose-allocation"
      - "POST /participant-awards/{awardId}/retract-allocation"
    shared_operations:
      - "GET /bonus-plans, GET /bonus-plans/{planId}, GET /job-level-targets"
      - "GET /business-units, GET /business-units/{unitId}, GET /job-level-targets/{targetId}"
      - "GET /participants, GET /participants/{participantId}"
      - "GET /bu-pools, GET /bu-pools/{poolId}, GET /participant-awards, GET /participant-awards/{awardId}"
    note: "X-User-ID is a BusinessUnit.id; every write is gated on X-User-ID == pool.business_unit_id or award.business_unit_id."

  - name: HRBusinessPartner
    description: "HR operations: records transfers, leaves and terminations as append-only eligibility events, files discretionary adjustment requests, and reviews and resolves employee disputes."
    identity: opaque
    exclusive_operations:
      - "POST /eligibility-events"
      - "POST /disputes/{disputeId}/assign-review"
      - "POST /disputes/{disputeId}/resolve"
    shared_operations:
      - "POST /discretionary-adjustments (with PlanAdmin)"
      - "GET reads of plans, job-level targets, business units, participants, eligibility events, pools, awards, payout previews, adjustments and disputes"

  - name: FinanceController
    description: "Accounting: opens, posts and reverses accrual periods during the year, executes the payout on the payment date and books the settlement true-up."
    identity: opaque
    exclusive_operations:
      - "POST /accrual-periods"
      - "POST /accrual-periods/{periodId}/post"
      - "POST /accrual-periods/{periodId}/reverse"
      - "POST /payout-runs"
      - "POST /payout-runs/{payoutRunId}/execute"
      - "POST /payout-runs/{payoutRunId}/settle-true-up"
    shared_operations:
      - "POST /_clock/set_current_utc (with PlanAdmin)"
      - "GET reads of plans, funding summary, metrics, targets, business units, participants, eligibility events, pools, awards, payout previews, adjustments, accrual periods, payout runs and disputes"

  - name: Employee
    description: "Plan participant: reads their own plan, participant record and award, and files a dispute against their own award once the plan is locked."
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /disputes"
    shared_operations:
      - "GET /bonus-plans, GET /bonus-plans/{planId}"
      - "GET /participants/{participantId}"
      - "GET /participant-awards/{awardId}"
      - "GET /disputes/{disputeId}"
    note: "X-User-ID is a Participant.id; filing a dispute requires X-User-ID == award.participant_id == body participant_id."
