# =============================================================================
# Task 1996: Demolition Contracting & Salvage — scaffold seed tables
# =============================================================================

scenario: |
  1996. Demolition Contracting & Salvage (demolition contractor): structure survey & hazardous material abatement prerequisite, utility disconnect verification & permit, demolition method & engineering survey for structural stability, salvage/deconstruction value & material diversion, dust/noise control & neighbor notification, debris hauling & landfill/recycling tickets, site backfill/grading & erosion control, final inspection & lot closure

domain_name: demolition-contracting-salvage
api_prefix: /demolition

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # permits, abatement clearance gating, SoD, audit user ids
  secondary_archetype: workflow_orchestration # multi-prerequisite release gate, phase pipeline
  complexity_layers:
    - cascading_side_effects      # depth-3 cascades: eng revision / permit expiry / dust exceedance
    - dual_variant_calculation    # salvage valuation; erosion coverage provisional vs final
    - rate_threshold_triggers     # dust exposure threshold, diversion tiers, compaction spec
    - optimistic_concurrency      # OCC on Project.version (engineering pin) and DemolitionPermit.version (renewal)
    - derived_field_reconciliation # project tonnage counters + diversion rate kept in sync per ticket event
    - scheduled_deferred_actions  # logical clock drives permit expiry sweep + notification wait window
  entity_topology: hybrid                     # Project tree + FK cross-references (pin -> EngineeringSurvey)
  state_machine_shape: parallel               # Project phase x work_posture; UtilityDisconnect dual dims; plus cyclic machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate        # Project.pinned_engineering_survey_id -> EngineeringSurvey.id
  role_model: segregation_of_duties           # certifier != performer on abatement/utility/engineering steps
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: address, type: string, source: input, description: "Site street address" }
      - { name: lot_area_sqft, type: integer, source: input, description: "Lot area in square feet, > 0" }
      - { name: required_diversion_rate, type: number, source: input, default: 0.5, description: "Minimum debris diversion rate required for lot closure, in [0,1]" }
      - { name: blackout_dates, type: array, source: input, default: [], description: "ISO dates (YYYY-MM-DD) on which neighbor notification delivery is forbidden" }
      - { name: status, type: enum, source: system, description: "DRAFT | SURVEY_PHASE | PRECONDITIONS_PENDING | RELEASED | DEMOLITION_ACTIVE | DEBRIS_CLEARANCE | BACKFILL_PHASE | FINAL_REVIEW | CLOSED" }
      - { name: work_posture, type: enum, source: system, default: "WORKABLE", description: "WORKABLE | STOPPED — parallel dimension to status; STOPPED set by dust exceedance, cleared by resume" }
      - { name: pinned_engineering_survey_id, type: string, source: system, default: null, description: "FK -> EngineeringSurvey.id; the engineering survey revision the release relies on" }
      - { name: pinned_engineering_revision, type: integer, source: system, default: null, description: "revision_number of the pinned engineering survey at pin time" }
      - { name: cumulative_exposure_score, type: number, source: computed, default: 0, description: "Sum of exposure_score over all DustNoiseLog events of the project" }
      - { name: in_transit_tons, type: number, source: computed, default: 0, description: "Sum of gross_tons over DebrisTicket status MANIFESTED" }
      - { name: landfill_tons, type: number, source: computed, default: 0, description: "Sum of disposed_tons over DebrisTicket status IN {RECEIVED, DISPUTED, RECONCILED}" }
      - { name: diverted_tons, type: number, source: computed, default: 0, description: "Sum of diverted_tons over DebrisTicket status IN {RECEIVED, DISPUTED, RECONCILED}" }
      - { name: removed_tons, type: number, source: computed, default: 0, description: "Sum of gross_tons over DebrisTicket status IN {VOIDED, CANCELLED}" }
      - { name: diversion_rate, type: number, source: computed, default: 0, description: "round_half_up(diverted_tons / (landfill_tons + diverted_tons), 4); 0 when denominator is 0" }
      - { name: diversion_tier, type: enum, source: computed, default: "STANDARD", description: "GOLD if diversion_rate >= 0.7500, SILVER if >= 0.5000, else STANDARD" }

  - name: StructureSurvey
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: structure_label, type: string, source: input, description: "Label for the structure surveyed, e.g. 'Main Bldg'" }
      - { name: survey_type, type: enum, source: input, default: "INITIAL", description: "INITIAL | ADDENDUM" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETE" }
      - { name: hazmat_found, type: boolean, source: input, default: false, description: "Set via COMPLETE transition payload: whether hazardous material was found" }
      - { name: findings_summary, type: string, source: input, default: "", description: "Set via COMPLETE transition payload: narrative findings" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when COMPLETE transition fired" }

  - name: HazmatAbatement
    parent: StructureSurvey
    common_fields: true
    fields:
      - { name: structure_survey_id, type: string, source: system, description: "FK -> StructureSurvey.id; survey that identified the hazard" }
      - { name: material_type, type: enum, source: input, description: "ASBESTOS | LEAD_PAINT | PCB | MERCURY | OTHER" }
      - { name: description, type: string, source: input, description: "What/where the hazardous material is" }
      - { name: containment_method, type: string, source: input, description: "Abatement containment method" }
      - { name: status, type: enum, source: system, description: "IDENTIFIED | ABATEMENT_ACTIVE | CLEARANCE_PENDING | CLEARANCE_CERTIFIED | CLEARANCE_FAILED" }
      - { name: started_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded on START; SoD anchor for clearance certification" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded on CERTIFY_CLEARANCE" }
      - { name: certified_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of clearance certification" }

  - name: UtilityDisconnect
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: utility_type, type: enum, source: input, description: "ELECTRIC | GAS | WATER | SEWER | TELECOM" }
      - { name: provider_name, type: string, source: input, description: "Utility provider name" }
      - { name: disconnect_window_start, type: datetime, source: input, description: "Scheduled disconnect window start (ISO 8601 UTC)" }
      - { name: disconnect_window_end, type: datetime, source: input, description: "Scheduled disconnect window end; must be > start; half-open [start, end)" }
      - { name: disconnect_status, type: enum, source: system, description: "SCHEDULED | REPORTED_DISCONNECTED — parallel dimension 1" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | FIELD_VERIFIED | VERIFICATION_REJECTED | CONFIRMED — parallel dimension 2" }
      - { name: reported_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded on REPORT_DISCONNECTED" }
      - { name: verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded on VERIFY; SoD anchor for CONFIRM" }
      - { name: confirmed_by_user_id, type: string, source: system, default: null, description: "X-User-ID recorded on CONFIRM" }

  - name: DemolitionPermit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: permit_number, type: string, source: input, description: "Municipal permit application number" }
      - { name: gross_floor_area_sqft, type: integer, source: input, description: "Gross floor area of structures to demolish, > 0" }
      - { name: fee_cents, type: integer, source: computed, description: "Permit fee per permit_fee calculation (tiered, pinned evaluation order)" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | REVISION_REQUIRED | APPROVED | ACTIVE | REJECTED | EXPIRED" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "How many times the authority requested revision" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "How many renewals extended this permit" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of ACTIVATE" }
      - { name: expires_at, type: datetime, source: computed, default: null, description: "activated_at + PERMIT_VALIDITY_DAYS days; extended +90 days per renewal" }

  - name: EngineeringSurvey
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "1 at creation; +1 whenever a CERTIFIED survey is sent back by REQUEST_REVISION" }
      - { name: demolition_method, type: enum, source: input, description: "IMPLOSION | HIGH_REACH_ARM | MECHANICAL | SELECTIVE_DECONSTRUCTION" }
      - { name: structural_stability_rating, type: enum, source: input, description: "STABLE | CONDITIONALLY_STABLE | UNSTABLE" }
      - { name: max_structure_height_ft, type: integer, source: input, description: "Tallest structure height, > 0" }
      - { name: adjacent_structure_distance_ft, type: integer, source: input, description: "Distance to nearest adjacent structure, >= 0" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of creating StructuralEngineer; SoD anchor for CERTIFY" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of certifying PeerReviewEngineer" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CERTIFIED" }

  - name: SalvageManifest
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: valuation_policy, type: enum, source: input, description: "OPTIMISTIC | CONSERVATIVE — which valuation variant is contractual for net_credit_cents" }
      - { name: processing_fee_cents, type: integer, source: input, description: "Flat fee subtracted from salvage credit, >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | AMENDED" }
      - { name: optimistic_total_cents, type: integer, source: computed, default: 0, description: "Sum over items of high_unit_value_cents * quantity" }
      - { name: conservative_total_cents, type: integer, source: computed, default: 0, description: "Sum over items of low_unit_value_cents * quantity" }
      - { name: net_credit_cents, type: integer, source: computed, default: 0, description: "Policy-variant total minus processing_fee_cents; recomputed on FINALIZE and on each AMENDED item add" }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Number of AMEND transitions applied" }
      - { name: finalized_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of most recent FINALIZE" }

  - name: SalvageItem
    parent: SalvageManifest
    common_fields: true
    fields:
      - { name: salvage_manifest_id, type: string, source: system, description: "FK -> SalvageManifest.id; owning manifest" }
      - { name: material, type: enum, source: input, description: "STEEL | COPPER | BRICK | TIMBER | CONCRETE | FIXTURES" }
      - { name: description, type: string, source: input, description: "Item description" }
      - { name: quantity, type: integer, source: input, description: "> 0 for normal lines; signed (may be negative) only when manifest is AMENDED (amendment lines)" }
      - { name: unit, type: enum, source: input, description: "TON | LB | EACH | CU_YD" }
      - { name: low_unit_value_cents, type: integer, source: input, description: "Conservative per-unit salvage value, >= 0" }
      - { name: high_unit_value_cents, type: integer, source: input, description: "Optimistic per-unit salvage value, >= low_unit_value_cents" }
      - { name: is_amendment_line, type: boolean, source: system, default: false, description: "true when added while manifest status == AMENDED" }
      - { name: extended_value_cents, type: integer, source: computed, default: 0, description: "quantity * (high or low unit value per manifest valuation_policy)" }

  - name: NeighborNotification
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: address, type: string, source: input, description: "Neighbor address notified" }
      - { name: notice_method, type: enum, source: input, description: "CERTIFIED_MAIL | DOOR_HANGER | POSTING" }
      - { name: scheduled_delivery_date, type: string, source: input, description: "Planned delivery date YYYY-MM-DD (informational; actual delivery uses logical clock)" }
      - { name: status, type: enum, source: system, description: "PENDING_DELIVERY | DELIVERED | VOIDED" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp set by DELIVER transition" }

  - name: DustNoiseLog
    parent: Project
    common_fields: false   # append-only event: id + created_at only; no update endpoints
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: reading_type, type: enum, source: input, description: "PM25 | PM10 | NOISE_DB" }
      - { name: measured_value, type: number, source: input, description: "Instrument reading (ug/m3 or dB), >= 0" }
      - { name: wind_speed_mph, type: number, source: input, description: "Wind speed at reading time, >= 0" }
      - { name: duration_hours, type: number, source: input, description: "Duration the reading covers, > 0" }
      - { name: exposure_score, type: number, source: computed, description: "Per dust_exposure_score calculation" }
      - { name: is_exceedance, type: boolean, source: computed, description: "exposure_score >= DUST_EXCEEDANCE_THRESHOLD (75.0)" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical-clock timestamp at creation" }

  - name: DebrisTicket
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: ticket_number, type: string, source: input, description: "Hauler ticket number" }
      - { name: facility_type, type: enum, source: input, description: "LANDFILL | RECYCLING | TRANSFER" }
      - { name: material_class, type: enum, source: input, description: "CONCRETE | METAL | WOOD | MIXED_CD" }
      - { name: gross_tons, type: number, source: input, description: "Manifested gross weight, > 0, max 3 decimals" }
      - { name: diverted_tons, type: number, source: system, default: 0, description: "Diverted-from-landfill tons; set on RECEIVE, corrected on RECONCILE; 0 <= diverted <= gross" }
      - { name: disposed_tons, type: number, source: computed, default: 0, description: "= gross_tons - diverted_tons (recomputed on RECEIVE/RECONCILE)" }
      - { name: status, type: enum, source: system, description: "MANIFESTED | RECEIVED | DISPUTED | RECONCILED | VOIDED | CANCELLED" }
      - { name: received_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of RECEIVE" }

  - name: BackfillPlan
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: design_disturbed_area_sqft, type: integer, source: input, description: "Design disturbed area, > 0" }
      - { name: planned_protected_area_sqft, type: integer, source: input, description: "Planned erosion-protected area, >= 0" }
      - { name: fill_volume_cu_yd, type: integer, source: input, description: "Backfill volume, > 0" }
      - { name: required_compaction_pct, type: number, source: input, description: "Required compaction percentage, e.g. 95.0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | COMPACTION_VERIFIED | EROSION_VERIFIED | COMPLETE" }
      - { name: provisional_coverage_ratio, type: number, source: computed, default: 0, description: "planned_protected_area_sqft / design_disturbed_area_sqft computed at APPROVE (4 decimals, round_half_up)" }
      - { name: compaction_pct_achieved, type: number, source: system, default: null, description: "Measured compaction recorded by RECORD_COMPACTION" }
      - { name: measured_disturbed_area_sqft, type: integer, source: system, default: null, description: "As-built disturbed area recorded by VERIFY_EROSION" }
      - { name: measured_protected_area_sqft, type: integer, source: system, default: null, description: "As-built protected area recorded by VERIFY_EROSION" }
      - { name: final_coverage_ratio, type: number, source: computed, default: 0, description: "measured_protected_area_sqft / measured_disturbed_area_sqft at VERIFY_EROSION (4 decimals, round_half_up)" }

  - name: FinalInspection
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning demolition project" }
      - { name: inspection_type, type: enum, source: input, description: "FINAL_LOT | EROSION_CLOSEOUT" }
      - { name: scheduled_date, type: string, source: input, description: "Scheduled inspection date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | CANCELLED" }
      - { name: attempt_count, type: integer, source: system, default: 0, description: "+1 on each FAIL" }
      - { name: inspector_note, type: string, source: input, default: "", description: "Optional note on PASS/FAIL/RESCHEDULE" }
      - { name: passed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of PASS" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED]
    # Two parallel dimensions: status (phase pipeline) x work_posture (WORKABLE | STOPPED).
    transitions:
      - from: DRAFT
        to: SURVEY_PHASE
        trigger: "system (automatic on first StructureSurvey creation for the project)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: SURVEY_PHASE
        to: PRECONDITIONS_PENDING
        trigger: "system (automatic on StructureSurvey COMPLETE when >= 1 survey exists and ALL surveys of the project are COMPLETE)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: PRECONDITIONS_PENDING
        to: SURVEY_PHASE
        trigger: "system (automatic on new StructureSurvey creation or survey REOPEN while PRECONDITIONS_PENDING)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: PRECONDITIONS_PENDING
        to: RELEASED
        trigger: "POST /demolition/projects/{id}/release"
        actor: SiteSupervisor | ContractorAdmin
        preconditions:
          - "work_posture == WORKABLE"
          - "all StructureSurveys COMPLETE (ERR_SURVEY_INCOMPLETE)"
          - "no HazmatAbatement of any survey of the project outside CLEARANCE_CERTIFIED (ERR_HAZMAT_UNRESOLVED)"
          - ">= 1 UtilityDisconnect and all have disconnect_status == REPORTED_DISCONNECTED and verification_status == CONFIRMED (ERR_UTILITY_UNVERIFIED)"
          - "a DemolitionPermit of the project is ACTIVE with expires_at > current logical time (ERR_PERMIT_NOT_ACTIVE)"
          - "pinned EngineeringSurvey exists, is CERTIFIED (ERR_ENGINEERING_NOT_CERTIFIED) and its revision_number == pinned_engineering_revision (ERR_ENGINEERING_PIN_STALE)"
          - ">= 1 NeighborNotification and all are DELIVERED (ERR_NOTIFICATIONS_INCOMPLETE)"
          - "current logical time >= max(delivered_at) + 72h over DELIVERED notifications (ERR_NOTIFICATION_WINDOW_OPEN)"
        side_effects: ["increments Project.version by 1"]
      - from: RELEASED
        to: DEMOLITION_ACTIVE
        trigger: "POST /demolition/projects/{id}/transition action=START_DEMOLITION"
        actor: SiteSupervisor
        preconditions:
          - "work_posture == WORKABLE"
          - "permit still ACTIVE and not expired (ERR_PERMIT_NOT_ACTIVE)"
          - "notification wait window still satisfied (ERR_NOTIFICATION_WINDOW_OPEN)"
        side_effects: ["increments Project.version by 1"]
      - from: DEMOLITION_ACTIVE
        to: DEBRIS_CLEARANCE
        trigger: "POST /demolition/projects/{id}/transition action=COMPLETE_STRUCTURE_REMOVAL"
        actor: SiteSupervisor
        preconditions: ["work_posture == WORKABLE (ERR_PROJECT_STOPPED)"]
        side_effects: ["increments Project.version by 1"]
      - from: DEBRIS_CLEARANCE
        to: BACKFILL_PHASE
        trigger: "POST /demolition/projects/{id}/transition action=START_BACKFILL"
        actor: SiteSupervisor
        preconditions:
          - "work_posture == WORKABLE (ERR_PROJECT_STOPPED)"
          - ">= 1 BackfillPlan of the project has status IN {APPROVED, COMPACTION_VERIFIED, EROSION_VERIFIED, COMPLETE} (ERR_BACKFILL_NOT_APPROVED)"
        side_effects: ["increments Project.version by 1"]
      - from: BACKFILL_PHASE
        to: FINAL_REVIEW
        trigger: "POST /demolition/projects/{id}/transition action=SUBMIT_FINAL_REVIEW"
        actor: SiteSupervisor
        preconditions: ["work_posture == WORKABLE (ERR_PROJECT_STOPPED)"]
        side_effects: ["increments Project.version by 1"]
      - from: FINAL_REVIEW
        to: CLOSED
        trigger: "system (automatic when a FinalInspection of the project transitions to PASSED)"
        actor: system
        preconditions: []
        side_effects: ["increments Project.version by 1"]
      - from: RELEASED
        to: PRECONDITIONS_PENDING
        trigger: "system (cascade: pinned EngineeringSurvey sent back via REQUEST_REVISION, or ACTIVE DemolitionPermit expires)"
        actor: system
        preconditions: []
        side_effects:
          - "pinned_engineering_survey_id and pinned_engineering_revision kept but now stale (release will fail ERR_ENGINEERING_PIN_STALE until re-pinned)"
          - "all NeighborNotification of the project with status PENDING_DELIVERY -> VOIDED"
          - "increments Project.version by 1"
      - from: DEMOLITION_ACTIVE
        to: PRECONDITIONS_PENDING
        trigger: "system (cascade: ACTIVE DemolitionPermit expires via logical-clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "all DebrisTicket of the project with status MANIFESTED -> CANCELLED; project.in_transit_tons -= ticket.gross_tons and project.removed_tons += ticket.gross_tons per ticket"
          - "increments Project.version by 1"
      - from: DEMOLITION_ACTIVE
        to: DEMOLITION_ACTIVE
        trigger: "work_posture dimension: WORKABLE -> STOPPED on system (DustNoiseLog with is_exceedance == true created while status IN {DEMOLITION_ACTIVE, DEBRIS_CLEARANCE, BACKFILL_PHASE, FINAL_REVIEW})"
        actor: system
        preconditions: []
        side_effects:
          - "work_posture := STOPPED"
          - "all FinalInspection of the project with status SCHEDULED -> CANCELLED"
          - "increments Project.version by 1"
        note: "status phase unchanged; only work_posture flips (parallel dimension). Same self-transition fires when status is DEBRIS_CLEARANCE, BACKFILL_PHASE, or FINAL_REVIEW."
      - from: DEMOLITION_ACTIVE
        to: DEMOLITION_ACTIVE
        trigger: "POST /demolition/projects/{id}/resume — work_posture STOPPED -> WORKABLE"
        actor: SiteSupervisor
        preconditions: ["work_posture == STOPPED (ERR_INVALID_STATE otherwise)"]
        side_effects: ["work_posture := WORKABLE", "increments Project.version by 1"]
        note: "same self-transition shape applies when status is DEBRIS_CLEARANCE or BACKFILL_PHASE"

  - entity: StructureSurvey
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /demolition/structure-surveys/{id}/transition action=COMPLETE"
        actor: Surveyor
        preconditions: []
        side_effects:
          - "hazmat_found and findings_summary set from payload; completed_at := logical clock"
          - "if all surveys of parent project COMPLETE and project SURVEY_PHASE -> PRECONDITIONS_PENDING"
      - from: COMPLETE
        to: IN_PROGRESS
        trigger: "POST /demolition/structure-surveys/{id}/transition action=REOPEN"
        actor: Surveyor
        preconditions: ["parent project status IN {SURVEY_PHASE, PRECONDITIONS_PENDING} (ERR_INVALID_STATE otherwise)"]
        side_effects:
          - "completed_at := null"
          - "if project PRECONDITIONS_PENDING -> SURVEY_PHASE"
        note: "cyclic reopen for unforeseen contamination discovered later"

  - entity: HazmatAbatement
    initial_state: IDENTIFIED
    terminal_states: [CLEARANCE_CERTIFIED]
    transitions:
      - from: IDENTIFIED
        to: ABATEMENT_ACTIVE
        trigger: "POST /demolition/abatements/{id}/transition action=START"
        actor: AbatementSupervisor
        preconditions: []
        side_effects: ["started_by_user_id := X-User-ID"]
      - from: CLEARANCE_FAILED
        to: ABATEMENT_ACTIVE
        trigger: "POST /demolition/abatements/{id}/transition action=START"
        actor: AbatementSupervisor
        preconditions: []
        side_effects: ["started_by_user_id := X-User-ID"]
        note: "re-abatement cycle after failed clearance"
      - from: ABATEMENT_ACTIVE
        to: CLEARANCE_PENDING
        trigger: "POST /demolition/abatements/{id}/transition action=REQUEST_CLEARANCE"
        actor: AbatementSupervisor
        preconditions: ["parent StructureSurvey status == COMPLETE (ERR_SURVEY_INCOMPLETE)"]
        side_effects: []
      - from: CLEARANCE_PENDING
        to: CLEARANCE_CERTIFIED
        trigger: "POST /demolition/abatements/{id}/transition action=CERTIFY_CLEARANCE"
        actor: ClearanceOfficer
        preconditions: ["X-User-ID != started_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["certified_by_user_id := X-User-ID", "certified_at := logical clock"]
      - from: CLEARANCE_PENDING
        to: CLEARANCE_FAILED
        trigger: "POST /demolition/abatements/{id}/transition action=FAIL_CLEARANCE"
        actor: ClearanceOfficer
        preconditions: []
        side_effects: []

  - entity: UtilityDisconnect
    initial_state: "SCHEDULED x UNVERIFIED (parallel dimensions)"
    terminal_states: []
    transitions:
      - from: "disconnect_status SCHEDULED"
        to: "disconnect_status REPORTED_DISCONNECTED"
        trigger: "POST /demolition/utility-disconnects/{id}/transition action=REPORT_DISCONNECTED"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: ["reported_by_user_id := X-User-ID"]
      - from: "verification_status UNVERIFIED"
        to: "verification_status FIELD_VERIFIED"
        trigger: "POST /demolition/utility-disconnects/{id}/transition action=VERIFY"
        actor: UtilityCoordinator
        preconditions: ["disconnect_status == REPORTED_DISCONNECTED (ERR_INVALID_STATE)"]
        side_effects: ["verified_by_user_id := X-User-ID"]
      - from: "verification_status VERIFICATION_REJECTED"
        to: "verification_status FIELD_VERIFIED"
        trigger: "POST /demolition/utility-disconnects/{id}/transition action=VERIFY"
        actor: UtilityCoordinator
        preconditions: ["disconnect_status == REPORTED_DISCONNECTED (ERR_INVALID_STATE)"]
        side_effects: ["verified_by_user_id := X-User-ID"]
        note: "verification dimension cycles REJECTED -> FIELD_VERIFIED"
      - from: "verification_status FIELD_VERIFIED"
        to: "verification_status VERIFICATION_REJECTED"
        trigger: "POST /demolition/utility-disconnects/{id}/transition action=REJECT_VERIFICATION"
        actor: UtilityCoordinator
        preconditions: []
        side_effects: []
      - from: "verification_status FIELD_VERIFIED"
        to: "verification_status CONFIRMED"
        trigger: "POST /demolition/utility-disconnects/{id}/transition action=CONFIRM"
        actor: UtilityCoordinator
        preconditions: ["X-User-ID != verified_by_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["confirmed_by_user_id := X-User-ID"]

  - entity: DemolitionPermit
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /demolition/permits/{id}/transition action=SUBMIT"
        actor: PermitCoordinator
        preconditions: ["no other permit of the same project in {DRAFT, UNDER_REVIEW, REVISION_REQUIRED, APPROVED, ACTIVE} (ERR_DUPLICATE_ACTIVE_PERMIT)"]
        side_effects: []
      - from: REVISION_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /demolition/permits/{id}/transition action=SUBMIT"
        actor: PermitCoordinator
        preconditions: []
        side_effects: []
        note: "authority revision loop (cycle)"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /demolition/permits/{id}/transition action=APPROVE"
        actor: AuthorityReviewer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /demolition/permits/{id}/transition action=REQUEST_REVISION"
        actor: AuthorityReviewer
        preconditions: []
        side_effects: ["revision_count += 1"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /demolition/permits/{id}/transition action=REJECT"
        actor: AuthorityReviewer
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /demolition/permits/{id}/transition action=ACTIVATE"
        actor: PermitCoordinator
        preconditions: [">= 1 UtilityDisconnect on the project and ALL have verification_status == CONFIRMED and disconnect_status == REPORTED_DISCONNECTED (ERR_UTILITY_UNVERIFIED)"]
        side_effects:
          - "activated_at := logical clock; expires_at := activated_at + 90 days"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /demolition/permits/{id}/renewals"
        actor: PermitCoordinator
        preconditions:
          - "status == ACTIVE (ERR_PERMIT_EXPIRED when the permit is EXPIRED; ERR_INVALID_STATE from DRAFT/UNDER_REVIEW/REVISION_REQUIRED/APPROVED/REJECTED)"
          - "expected_permit_version == current permit.version (ERR_STALE_VERSION, OCC)"
        side_effects:
          - "expires_at += 90 days; renewal_count += 1"
          - "increments DemolitionPermit.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical-clock sweep: current time > expires_at; sweep runs on POST /_clock/set_current_utc and on any permit/project interaction)"
        actor: system
        preconditions: []
        side_effects:
          - "if parent project status IN {RELEASED, DEMOLITION_ACTIVE}: project -> PRECONDITIONS_PENDING (see Project cascade)"
          - "if project was DEMOLITION_ACTIVE: MANIFESTED DebrisTickets -> CANCELLED with tonnage counter moves"

  - entity: EngineeringSurvey
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /demolition/engineering-surveys/{id}/transition action=SUBMIT"
        actor: StructuralEngineer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /demolition/engineering-surveys/{id}/transition action=CERTIFY"
        actor: PeerReviewEngineer
        preconditions: ["X-User-ID != author_user_id (ERR_SOD_VIOLATION)"]
        side_effects: ["certified_by_user_id := X-User-ID"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /demolition/engineering-surveys/{id}/transition action=REQUEST_REVISION"
        actor: PeerReviewEngineer
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: DRAFT
        trigger: "POST /demolition/engineering-surveys/{id}/transition action=REQUEST_REVISION"
        actor: PeerReviewEngineer
        preconditions: []
        side_effects:
          - "revision_number += 1; certified_by_user_id := null"
          - "if this survey is the project's pinned_engineering_survey_id and project status == RELEASED: project -> PRECONDITIONS_PENDING and PENDING_DELIVERY NeighborNotifications -> VOIDED"
        note: "certified revision loop; revision bump makes the project pin stale"

  - entity: SalvageManifest
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /demolition/salvage-manifests/{id}/transition action=FINALIZE"
        actor: SalvageEstimator
        preconditions: [">= 1 SalvageItem exists for the manifest (ERR_MANIFEST_EMPTY)"]
        side_effects: ["net_credit_cents computed per valuation_policy variant minus processing_fee_cents", "finalized_at := logical clock"]
      - from: AMENDED
        to: FINALIZED
        trigger: "POST /demolition/salvage-manifests/{id}/transition action=FINALIZE"
        actor: SalvageEstimator
        preconditions: [">= 1 SalvageItem exists (ERR_MANIFEST_EMPTY)"]
        side_effects: ["net_credit_cents recomputed including amendment lines", "finalized_at := logical clock"]
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /demolition/salvage-manifests/{id}/transition action=AMEND"
        actor: SalvageEstimator
        preconditions: []
        side_effects: ["amendment_count += 1"]
        note: "cycle FINALIZED -> AMENDED -> FINALIZED with compensating amendment lines"

  - entity: NeighborNotification
    initial_state: PENDING_DELIVERY
    terminal_states: [DELIVERED, VOIDED]
    transitions:
      - from: PENDING_DELIVERY
        to: DELIVERED
        trigger: "POST /demolition/neighbor-notifications/{id}/transition action=DELIVER"
        actor: SiteSupervisor
        preconditions:
          - "logical-clock date not in project.blackout_dates (ERR_BLACKOUT_DATE)"
          - "delivery occupation [now, now + 30min) must not intersect quiet window [19:00, 07:00) UTC (ERR_QUIET_HOURS)"
          - "fewer than 3 other notifications of the project already DELIVERED on the same UTC date (ERR_DAILY_DELIVERY_CAP)"
        side_effects: ["delivered_at := logical clock"]
      - from: PENDING_DELIVERY
        to: VOIDED
        trigger: "system (cascade when project loses release readiness) or POST transition action=VOID"
        actor: "system | SiteSupervisor"
        preconditions: []
        side_effects: []

  - entity: DebrisTicket
    initial_state: MANIFESTED
    terminal_states: [RECONCILED, VOIDED, CANCELLED]
    transitions:
      - from: MANIFESTED
        to: RECEIVED
        trigger: "POST /demolition/debris-tickets/{id}/transition action=RECEIVE"
        actor: HaulingDispatcher
        preconditions: ["payload diverted_tons satisfies 0 <= diverted_tons <= gross_tons (ERR_TICKET_WEIGHT_INVALID)"]
        side_effects:
          - "diverted_tons set; disposed_tons := gross_tons - diverted_tons; received_at := logical clock"
          - "project.in_transit_tons -= gross_tons; project.landfill_tons += disposed_tons; project.diverted_tons += diverted_tons; diversion_rate/tier recomputed"
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /demolition/debris-tickets/{id}/transition action=DISPUTE"
        actor: HaulingDispatcher
        preconditions: []
        side_effects: []
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /demolition/debris-tickets/{id}/transition action=RECONCILE"
        actor: HaulingDispatcher
        preconditions:
          - "|corrected_gross_tons - gross_tons| <= 2.0 and |corrected_diverted_tons - diverted_tons| <= 2.0 (ERR_RECONCILE_DELTA_EXCEEDED)"
          - "0 <= corrected_diverted_tons <= corrected_gross_tons (ERR_TICKET_WEIGHT_INVALID)"
        side_effects: ["project counters adjusted by deltas; diversion_rate/tier recomputed"]
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /demolition/debris-tickets/{id}/transition action=RECONCILE"
        actor: HaulingDispatcher
        preconditions: ["same delta-cap and weight checks as RECEIVED -> RECONCILED"]
        side_effects: ["project counters adjusted by deltas; diversion_rate/tier recomputed"]
      - from: MANIFESTED
        to: VOIDED
        trigger: "POST /demolition/debris-tickets/{id}/transition action=VOID"
        actor: HaulingDispatcher
        preconditions: []
        side_effects: ["project.in_transit_tons -= gross_tons; project.removed_tons += gross_tons"]
      - from: RECEIVED
        to: VOIDED
        trigger: "POST /demolition/debris-tickets/{id}/transition action=VOID"
        actor: HaulingDispatcher
        preconditions: []
        side_effects: ["project.landfill_tons -= disposed_tons; project.diverted_tons -= diverted_tons; project.removed_tons += gross_tons; diversion_rate/tier recomputed"]
      - from: MANIFESTED
        to: CANCELLED
        trigger: "system (cascade: project leaves DEMOLITION_ACTIVE on permit expiry)"
        actor: system
        preconditions: []
        side_effects: ["project.in_transit_tons -= gross_tons; project.removed_tons += gross_tons"]

  - entity: BackfillPlan
    initial_state: DRAFT
    terminal_states: [COMPLETE]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /demolition/backfill-plans/{id}/transition action=APPROVE"
        actor: StructuralEngineer
        preconditions: []
        side_effects: ["provisional_coverage_ratio := round_half_up(planned_protected_area_sqft / design_disturbed_area_sqft, 4)"]
      - from: APPROVED
        to: COMPACTION_VERIFIED
        trigger: "POST /demolition/backfill-plans/{id}/transition action=RECORD_COMPACTION"
        actor: SiteSupervisor
        preconditions: ["payload compaction_pct >= required_compaction_pct (ERR_COMPACTION_BELOW_SPEC)"]
        side_effects: ["compaction_pct_achieved := payload compaction_pct"]
      - from: COMPACTION_VERIFIED
        to: EROSION_VERIFIED
        trigger: "POST /demolition/backfill-plans/{id}/transition action=VERIFY_EROSION"
        actor: MunicipalInspector
        preconditions: ["final_coverage_ratio = round_half_up(measured_protected_area_sqft / measured_disturbed_area_sqft, 4) >= 0.9000 (ERR_EROSION_COVERAGE_INSUFFICIENT)"]
        side_effects: ["measured_* fields and final_coverage_ratio set"]
      - from: EROSION_VERIFIED
        to: COMPLETE
        trigger: "POST /demolition/backfill-plans/{id}/transition action=COMPLETE"
        actor: SiteSupervisor
        preconditions: []
        side_effects: []

  - entity: FinalInspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /demolition/final-inspections/{id}/transition action=PASS"
        actor: MunicipalInspector
        preconditions:
          - "parent project status == FINAL_REVIEW (ERR_INVALID_STATE)"
          - ">= 1 BackfillPlan of the project has status == COMPLETE (ERR_BACKFILL_INCOMPLETE)"
          - "project.diversion_rate >= project.required_diversion_rate (ERR_DIVERSION_BELOW_REQUIREMENT)"
        side_effects:
          - "passed_at := logical clock"
          - "project FINAL_REVIEW -> CLOSED"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /demolition/final-inspections/{id}/transition action=FAIL"
        actor: MunicipalInspector
        preconditions: []
        side_effects: ["attempt_count += 1"]
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /demolition/final-inspections/{id}/transition action=RESCHEDULE"
        actor: MunicipalInspector
        preconditions: ["payload scheduled_date present (ERR_VALIDATION)"]
        side_effects: ["scheduled_date := payload"]
        note: "re-inspection cycle"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade: project work_posture becomes STOPPED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: project-pin-stale-version
    parent_entity: Project
    write_endpoint: "POST /demolition/projects/{id}/engineering-pin"
    occ_field: expected_project_version
    description: |
      Pinning an engineering survey to a Project whose version has advanced since
      the client last observed it is rejected. A pin legitimately supersedes any
      prior pin, so a second sequential pin carrying an up-to-date version would
      succeed; only a stale expected_project_version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: permit-renew-stale-version
    parent_entity: DemolitionPermit
    write_endpoint: "POST /demolition/permits/{id}/renewals"
    occ_field: expected_permit_version
    description: |
      Renewing a DemolitionPermit whose version has advanced since the client
      last observed it is rejected. A renewal legitimately extends the prior
      expiry, so a second sequential renewal carrying an up-to-date version
      would succeed; only a stale expected_permit_version is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: salvage_valuation
    trigger: "SalvageItem create; SalvageManifest FINALIZE"
    algorithm: aggregation
    formula: |
      optimistic_total_cents   = sum(item.quantity * item.high_unit_value_cents) over ALL items of the manifest (including amendment lines with signed quantity)
      conservative_total_cents = sum(item.quantity * item.low_unit_value_cents)  over ALL items of the manifest
      On FINALIZE: net_credit_cents = (policy == OPTIMISTIC ? optimistic_total_cents : conservative_total_cents) - processing_fee_cents
      Invariant (Rule 9): at all times net_credit_cents == policy_total_cents - processing_fee_cents; an AMEND cycle followed by item additions and re-FINALIZE preserves this identity.
    input_set: "all SalvageItem rows of the manifest regardless of is_amendment_line"
    precision: "integer cents; no rounding"
    variants:
      - name: OPTIMISTIC
        when: "manifest.valuation_policy == OPTIMISTIC"
        difference: "uses high_unit_value_cents; yields a strictly greater total whenever any item has high > low"
      - name: CONSERVATIVE
        when: "manifest.valuation_policy == CONSERVATIVE"
        difference: "uses low_unit_value_cents"

  - name: erosion_coverage
    trigger: "BackfillPlan APPROVE (provisional) and VERIFY_EROSION (final)"
    algorithm: threshold
    formula: |
      provisional_coverage_ratio = round_half_up(planned_protected_area_sqft / design_disturbed_area_sqft, 4)
      final_coverage_ratio       = round_half_up(measured_protected_area_sqft / measured_disturbed_area_sqft, 4)
      VERIFY_EROSION passes iff final_coverage_ratio >= MIN_FINAL_COVERAGE (0.9000)
    input_set: "the single BackfillPlan being transitioned"
    constants:
      MIN_FINAL_COVERAGE: 0.9
    precision: "4 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "computed at APPROVE from design values"
        difference: "uses planned/design areas; informational only, never gates"
      - name: FINAL
        when: "computed at VERIFY_EROSION from as-built measurements"
        difference: "uses measured areas; gates EROSION_VERIFIED at 0.9000 boundary"

  - name: dust_exposure_score
    trigger: "DustNoiseLog creation"
    algorithm: weighted_scoring
    formula: |
      wind_factor = 0.5 if wind_speed_mph < 5
                    1.0 if 5 <= wind_speed_mph <= 12
                    1.6 if 12 < wind_speed_mph <= 20
                    2.4 if wind_speed_mph > 20
      raw = measured_value * wind_factor * duration_hours
      exposure_score = min(raw, RAW_CAP) / 10        # 1 decimal, exact division by 10
      is_exceedance = exposure_score >= DUST_EXCEEDANCE_THRESHOLD
      project.cumulative_exposure_score += exposure_score (every log, exceedance or not)
      if is_exceedance and project.status IN {DEMOLITION_ACTIVE, DEBRIS_CLEARANCE, BACKFILL_PHASE}:
          project.work_posture := STOPPED; SCHEDULED FinalInspections -> CANCELLED
    input_set: "the single DustNoiseLog being created"
    constants:
      RAW_CAP: 1000
      DUST_EXCEEDANCE_THRESHOLD: 75.0
    precision: "exposure_score reported to 1 decimal place"

  - name: diversion_rate
    trigger: "DebrisTicket RECEIVE / RECONCILE / VOID (from RECEIVED) / CANCEL cascade"
    algorithm: aggregation
    formula: |
      PINNED ORDER (mode b — nested rounding): per-ticket tons are already at 3-decimal inputs;
      totals are summed FIRST at full precision, then the rate is rounded ONCE:
        landfill_tons  = sum(disposed_tons) over tickets with status IN {RECEIVED, DISPUTED, RECONCILED}
        diverted_tons  = sum(diverted_tons) over tickets with status IN {RECEIVED, DISPUTED, RECONCILED}
        diversion_rate = round_half_up(diverted_tons / (landfill_tons + diverted_tons), 4); 0 if denominator == 0
        diversion_tier = GOLD if diversion_rate >= 0.7500 else SILVER if >= 0.5000 else STANDARD
      Explicitly NOT the average of per-ticket rates (that variant yields different tiers; it is rejected).
      Mass invariant (Rule 9): in_transit_tons + landfill_tons + diverted_tons + removed_tons
        == sum(gross_tons) over ALL tickets ever created for the project (including VOIDED/CANCELLED).
    input_set: "all DebrisTicket rows of the project; rate numerator/denominator restricted to status IN {RECEIVED, DISPUTED, RECONCILED}"
    constants:
      GOLD_THRESHOLD: 0.75
      SILVER_THRESHOLD: 0.5
    precision: "4 decimal places, round_half_up"

  - name: permit_fee
    trigger: "DemolitionPermit creation"
    algorithm: tiered_pricing
    formula: |
      PINNED EVALUATION ORDER (mode c — circular-looking dependency resolved):
        1. provisional_subtotal_cents = BASE_FEE_CENTS + gross_floor_area_sqft * BASE_RATE_CENTS
        2. tier = TIER2 if provisional_subtotal_cents >= TIER2_THRESHOLD_CENTS else TIER1
        3. fee_cents = BASE_FEE_CENTS + gross_floor_area_sqft * tier_rate + (tier == TIER2 ? TIER2_SURCHARGE_CENTS : 0)
           where tier_rate is TIER1_RATE_CENTS for TIER1 and TIER2_RATE_CENTS for TIER2.
      The tier is selected by the provisional subtotal computed with the BASE rate — never by the final fee.
    input_set: "the DemolitionPermit being created"
    constants:
      BASE_FEE_CENTS: 150000
      BASE_RATE_CENTS: 12
      TIER2_THRESHOLD_CENTS: 500000
      TIER2_RATE_CENTS: 18
      TIER2_SURCHARGE_CENTS: 25000
    precision: "integer cents"

  - name: notification_wait_window
    trigger: "Project release; START_DEMOLITION re-check"
    algorithm: threshold
    formula: |
      wait_window_end = max(delivered_at over NeighborNotifications of the project with status == DELIVERED) + 72 hours
      release allowed iff current logical time >= wait_window_end   # exactly at the boundary is allowed
    input_set: "NeighborNotifications of the project with status == DELIVERED; empty set fails ERR_NOTIFICATIONS_INCOMPLETE before this check"
    precision: "second precision on ISO 8601 UTC timestamps"

  - name: permit_expiry_sweep
    trigger: "POST /_clock/set_current_utc; any permit or project interaction"
    algorithm: chronological
    formula: |
      for each DemolitionPermit with status == ACTIVE and expires_at < current logical time:
        permit -> EXPIRED, then fire Project permit-expiry cascade.
      Boundary: current time == expires_at exactly is NOT expired (strictly greater than).
    input_set: "all ACTIVE permits"
    precision: "second precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: existence, check: "Request body shape: required fields present, types correct, enum members valid, ranges valid (quantity, tons, areas)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 4, category: existence, check: "Path ids resolve and are correctly scoped (child belongs to parent in path)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 5, category: state, check: "Entity state machine allows the requested transition from current state; project phase gates child creation (tickets require DEMOLITION_ACTIVE/DEBRIS_CLEARANCE; surveys require DRAFT/SURVEY_PHASE/PRECONDITIONS_PENDING; inspections require FINAL_REVIEW); then work_posture == WORKABLE for posture-gated writes", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition/action endpoints" }
  - { priority: 5, category: state, check: "work_posture == WORKABLE when creating DebrisTickets or advancing project phases while monitoring is active", error_id: ERR_PROJECT_STOPPED, http_status: 409, applies_to: "POST /demolition/projects/{id}/debris-tickets, POST /demolition/projects/{id}/transition" }
  - { priority: 6, category: business_safety, check: "OCC: expected_<parent>_version matches current version on guarded writes", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /demolition/projects/{id}/engineering-pin, POST /demolition/permits/{id}/renewals" }
  - { priority: 7, category: business_safety, check: "Segregation of duties: actor X-User-ID differs from the prior-step actor (abatement CERTIFY vs started_by; utility CONFIRM vs verified_by; engineering CERTIFY vs author_user_id)", error_id: ERR_SOD_VIOLATION, http_status: 403, applies_to: "certify/confirm transitions" }
  - { priority: 8, category: business_safety, check: "Release prerequisites in sub-order: surveys complete (ERR_SURVEY_INCOMPLETE) -> abatements certified (ERR_HAZMAT_UNRESOLVED) -> utilities confirmed (ERR_UTILITY_UNVERIFIED) -> permit ACTIVE & unexpired (ERR_PERMIT_NOT_ACTIVE) -> pinned engineering survey CERTIFIED (ERR_ENGINEERING_NOT_CERTIFIED)", error_id: "ERR_SURVEY_INCOMPLETE / ERR_HAZMAT_UNRESOLVED / ERR_UTILITY_UNVERIFIED / ERR_PERMIT_NOT_ACTIVE / ERR_ENGINEERING_NOT_CERTIFIED", http_status: 409, applies_to: "POST /demolition/projects/{id}/release" }
  - { priority: 9, category: business_temporal, check: "Notifications: >= 1 exists and all DELIVERED (ERR_NOTIFICATIONS_INCOMPLETE), then wait window elapsed now >= max(delivered_at)+72h (ERR_NOTIFICATION_WINDOW_OPEN)", error_id: "ERR_NOTIFICATIONS_INCOMPLETE / ERR_NOTIFICATION_WINDOW_OPEN", http_status: 409, applies_to: "POST /demolition/projects/{id}/release and START_DEMOLITION" }
  - { priority: 9, category: business_temporal, check: "Delivery timing in sub-order: date not blacked out (ERR_BLACKOUT_DATE) -> [now, now+30min) outside quiet window [19:00,07:00) UTC (ERR_QUIET_HOURS) -> fewer than 3 deliveries already DELIVERED same UTC date (ERR_DAILY_DELIVERY_CAP)", error_id: "ERR_BLACKOUT_DATE / ERR_QUIET_HOURS / ERR_DAILY_DELIVERY_CAP", http_status: 422, applies_to: "POST /demolition/neighbor-notifications/{id}/transition action=DELIVER" }
  - { priority: 10, category: business_referential, check: "Pinned engineering revision still equals survey revision_number (ERR_ENGINEERING_PIN_STALE) on release; backfill plan APPROVED+ for START_BACKFILL (ERR_BACKFILL_NOT_APPROVED); backfill plan COMPLETE for inspection PASS (ERR_BACKFILL_INCOMPLETE); no other SCHEDULED FinalInspection on the project at create (ERR_INSPECTION_OUTSTANDING)", error_id: "ERR_ENGINEERING_PIN_STALE / ERR_BACKFILL_NOT_APPROVED / ERR_BACKFILL_INCOMPLETE / ERR_INSPECTION_OUTSTANDING", http_status: 409, applies_to: "release, project transition, inspection create/PASS" }
  - { priority: 11, category: business_constraint, check: "Disconnect windows: same project + same utility_type half-open [start,end) overlap rejected, adjacency allowed (ERR_DISCONNECT_WINDOW_OVERLAP); no second permit in non-terminal status per project (ERR_DUPLICATE_ACTIVE_PERMIT); manifest non-empty on FINALIZE (ERR_MANIFEST_EMPTY); compaction_pct >= required (ERR_COMPACTION_BELOW_SPEC); final_coverage_ratio >= 0.9000 (ERR_EROSION_COVERAGE_INSUFFICIENT)", error_id: "ERR_DISCONNECT_WINDOW_OVERLAP / ERR_DUPLICATE_ACTIVE_PERMIT / ERR_MANIFEST_EMPTY / ERR_COMPACTION_BELOW_SPEC / ERR_EROSION_COVERAGE_INSUFFICIENT", http_status: 422, applies_to: "disconnect create, permit create/SUBMIT, manifest FINALIZE, backfill transitions" }
  - { priority: 11, category: business_constraint, check: "Ticket weights: 0 <= diverted <= gross on RECEIVE; corrected weights consistent and |delta| <= 2.0 tons on RECONCILE", error_id: "ERR_TICKET_WEIGHT_INVALID / ERR_RECONCILE_DELTA_EXCEEDED", http_status: 422, applies_to: "debris-ticket transitions" }
  - { priority: 12, category: business_fiscal, check: "Closure compliance: project.diversion_rate >= project.required_diversion_rate", error_id: ERR_DIVERSION_BELOW_REQUIREMENT, http_status: 409, applies_to: "POST /demolition/final-inspections/{id}/transition action=PASS" }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Project ---
  - { method: POST, path: "/demolition/projects", description: "Create a demolition project", roles: [ContractorAdmin], code: 201, input: [name, address, lot_area_sqft, "required_diversion_rate?", "blackout_dates?"], output: Project, side_effects: ["status=DRAFT, work_posture=WORKABLE, counters=0, version=1"] }
  - { method: GET, path: "/demolition/projects", description: "List projects with pagination and optional filters (status; pinned_engineering_survey_id finds the project pinned to a given engineering survey)", roles: [ContractorAdmin, SiteSupervisor, Surveyor, AbatementSupervisor, ClearanceOfficer, UtilityCoordinator, PermitCoordinator, AuthorityReviewer, StructuralEngineer, PeerReviewEngineer, SalvageEstimator, EnvironmentalMonitor, HaulingDispatcher, MunicipalInspector], code: 200, input: ["status?", "pinned_engineering_survey_id?", "limit?", "offset?"], output: "Project[]", side_effects: [] }
  - { method: GET, path: "/demolition/projects/{id}", description: "Get one project (computed fields included)", roles: [ContractorAdmin, SiteSupervisor, Surveyor, AbatementSupervisor, ClearanceOfficer, UtilityCoordinator, PermitCoordinator, AuthorityReviewer, StructuralEngineer, PeerReviewEngineer, SalvageEstimator, EnvironmentalMonitor, HaulingDispatcher, MunicipalInspector], code: 200, input: [], output: Project, side_effects: ["permit expiry sweep for this project"] }
  - { method: POST, path: "/demolition/projects/{id}/transition", description: "Phase transitions: START_DEMOLITION | COMPLETE_STRUCTURE_REMOVAL | START_BACKFILL | SUBMIT_FINAL_REVIEW", roles: [SiteSupervisor], code: 200, input: [action, "note?"], output: Project, side_effects: ["per Project state machine; increments Project.version by 1"] }
  - { method: POST, path: "/demolition/projects/{id}/release", description: "Run the full release gate (surveys/abatement/utilities/permit/engineering pin/notifications)", roles: [SiteSupervisor, ContractorAdmin], code: 200, input: ["note?"], output: Project, side_effects: ["status RELEASED; increments Project.version by 1"] }
  - { method: POST, path: "/demolition/projects/{id}/resume", description: "Clear STOPPED work posture back to WORKABLE", roles: [SiteSupervisor], code: 200, input: ["note?"], output: Project, side_effects: ["work_posture := WORKABLE; increments Project.version by 1"] }
  - { method: POST, path: "/demolition/projects/{id}/engineering-pin", description: "Pin a CERTIFIED engineering survey revision to the project (OCC-guarded; supersedes prior pin); allowed only when project status is PRECONDITIONS_PENDING or RELEASED (else ERR_INVALID_STATE); survey must be CERTIFIED and belong to this project (ERR_ENGINEERING_NOT_CERTIFIED / ERR_NOT_FOUND)", roles: [SiteSupervisor], code: 200, input: [engineering_survey_id, expected_project_version], output: Project, side_effects: ["pinned_engineering_survey_id/revision set; increments Project.version by 1"] }

  # --- StructureSurvey / HazmatAbatement ---
  - { method: POST, path: "/demolition/projects/{id}/structure-surveys", description: "Create a structure survey (first one advances project DRAFT->SURVEY_PHASE; creation while PRECONDITIONS_PENDING regresses project to SURVEY_PHASE)", roles: [Surveyor], code: 201, input: [structure_label, "survey_type?"], output: StructureSurvey, side_effects: ["project phase auto-transitions per Project machine"] }
  - { method: GET, path: "/demolition/projects/{id}/structure-surveys", description: "List surveys of a project", roles: [ContractorAdmin, SiteSupervisor, Surveyor, AbatementSupervisor, ClearanceOfficer], code: 200, input: ["limit?", "offset?"], output: "StructureSurvey[]", side_effects: [] }
  - { method: GET, path: "/demolition/structure-surveys/{id}", description: "Get one structure survey", roles: [ContractorAdmin, SiteSupervisor, Surveyor, AbatementSupervisor, ClearanceOfficer], code: 200, input: [], output: StructureSurvey, side_effects: [] }
  - { method: POST, path: "/demolition/structure-surveys/{id}/transition", description: "COMPLETE (payload hazmat_found, findings_summary) | REOPEN", roles: [Surveyor], code: 200, input: [action, "hazmat_found?", "findings_summary?"], output: StructureSurvey, side_effects: ["project bubble-up / regression per Project machine"] }
  - { method: POST, path: "/demolition/structure-surveys/{id}/abatements", description: "Open a hazmat abatement order from a survey finding", roles: [Surveyor, AbatementSupervisor], code: 201, input: [material_type, description, containment_method], output: HazmatAbatement, side_effects: ["status=IDENTIFIED"] }
  - { method: GET, path: "/demolition/structure-surveys/{id}/abatements", description: "List abatement orders of a survey", roles: [ContractorAdmin, SiteSupervisor, Surveyor, AbatementSupervisor, ClearanceOfficer], code: 200, input: ["limit?", "offset?"], output: "HazmatAbatement[]", side_effects: [] }
  - { method: POST, path: "/demolition/abatements/{id}/transition", description: "START | REQUEST_CLEARANCE | CERTIFY_CLEARANCE | FAIL_CLEARANCE", roles: [AbatementSupervisor, ClearanceOfficer], code: 200, input: [action], output: HazmatAbatement, side_effects: ["per HazmatAbatement machine; SoD enforced on CERTIFY_CLEARANCE"] }

  # --- UtilityDisconnect ---
  - { method: POST, path: "/demolition/projects/{id}/utility-disconnects", description: "Schedule a utility disconnect; half-open window overlap on same project+utility_type rejected", roles: [UtilityCoordinator], code: 201, input: [utility_type, provider_name, disconnect_window_start, disconnect_window_end], output: UtilityDisconnect, side_effects: ["disconnect_status=SCHEDULED, verification_status=UNVERIFIED"] }
  - { method: GET, path: "/demolition/projects/{id}/utility-disconnects", description: "List utility disconnects of a project", roles: [ContractorAdmin, SiteSupervisor, UtilityCoordinator, PermitCoordinator], code: 200, input: ["limit?", "offset?"], output: "UtilityDisconnect[]", side_effects: [] }
  - { method: POST, path: "/demolition/utility-disconnects/{id}/transition", description: "REPORT_DISCONNECTED | VERIFY | REJECT_VERIFICATION | CONFIRM (SoD: confirmer != verifier)", roles: [UtilityCoordinator], code: 200, input: [action], output: UtilityDisconnect, side_effects: ["per UtilityDisconnect dual-dimension machine"] }

  # --- DemolitionPermit ---
  - { method: POST, path: "/demolition/projects/{id}/permits", description: "Create permit application; fee_cents computed via permit_fee; at most one non-terminal permit per project", roles: [PermitCoordinator], code: 201, input: [permit_number, gross_floor_area_sqft], output: DemolitionPermit, side_effects: ["status=DRAFT; fee_cents computed"] }
  - { method: GET, path: "/demolition/projects/{id}/permits", description: "List permits of a project", roles: [ContractorAdmin, SiteSupervisor, PermitCoordinator, AuthorityReviewer], code: 200, input: ["limit?", "offset?"], output: "DemolitionPermit[]", side_effects: [] }
  - { method: POST, path: "/demolition/permits/{id}/transition", description: "SUBMIT | APPROVE | REQUEST_REVISION | REJECT | ACTIVATE (ACTIVATE requires all utilities CONFIRMED)", roles: [PermitCoordinator, AuthorityReviewer], code: 200, input: [action], output: DemolitionPermit, side_effects: ["per DemolitionPermit machine; ACTIVATE sets activated_at/expires_at from logical clock"] }
  - { method: POST, path: "/demolition/permits/{id}/renewals", description: "Renew an ACTIVE permit, extends expires_at by 90 days (OCC-guarded; renewal supersedes prior expiry)", roles: [PermitCoordinator], code: 200, input: [expected_permit_version], output: DemolitionPermit, side_effects: ["expires_at += 90 days; renewal_count += 1; increments DemolitionPermit.version by 1"] }

  # --- EngineeringSurvey ---
  - { method: POST, path: "/demolition/projects/{id}/engineering-surveys", description: "Author an engineering survey (demolition method + structural stability)", roles: [StructuralEngineer], code: 201, input: [demolition_method, structural_stability_rating, max_structure_height_ft, adjacent_structure_distance_ft], output: EngineeringSurvey, side_effects: ["status=DRAFT, revision_number=1, author_user_id := X-User-ID"] }
  - { method: GET, path: "/demolition/projects/{id}/engineering-surveys", description: "List engineering surveys of a project", roles: [ContractorAdmin, SiteSupervisor, StructuralEngineer, PeerReviewEngineer], code: 200, input: ["limit?", "offset?"], output: "EngineeringSurvey[]", side_effects: [] }
  - { method: POST, path: "/demolition/engineering-surveys/{id}/transition", description: "SUBMIT | CERTIFY (SoD: certifier != author) | REQUEST_REVISION (on CERTIFIED: revision_number+1 and project pin-stale cascade)", roles: [StructuralEngineer, PeerReviewEngineer], code: 200, input: [action], output: EngineeringSurvey, side_effects: ["per EngineeringSurvey machine; REQUEST_REVISION on pinned CERTIFIED survey cascades to project and notifications"] }

  # --- SalvageManifest / SalvageItem ---
  - { method: POST, path: "/demolition/projects/{id}/salvage-manifests", description: "Create a salvage manifest with a valuation policy", roles: [SalvageEstimator], code: 201, input: [valuation_policy, processing_fee_cents], output: SalvageManifest, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/demolition/projects/{id}/salvage-manifests", description: "List salvage manifests of a project", roles: [ContractorAdmin, SiteSupervisor, SalvageEstimator], code: 200, input: ["limit?", "offset?"], output: "SalvageManifest[]", side_effects: [] }
  - { method: GET, path: "/demolition/salvage-manifests/{id}", description: "Get one salvage manifest (both valuation variants + net credit)", roles: [ContractorAdmin, SiteSupervisor, SalvageEstimator], code: 200, input: [], output: SalvageManifest, side_effects: [] }
  - { method: POST, path: "/demolition/salvage-manifests/{id}/items", description: "Add a salvage line; normal lines (quantity>0) in DRAFT, signed amendment lines while AMENDED", roles: [SalvageEstimator], code: 201, input: [material, description, quantity, unit, low_unit_value_cents, high_unit_value_cents], output: SalvageItem, side_effects: ["manifest optimistic/conservative totals recomputed; extended_value_cents per policy"] }
  - { method: GET, path: "/demolition/salvage-manifests/{id}/items", description: "List items of a manifest", roles: [ContractorAdmin, SiteSupervisor, SalvageEstimator], code: 200, input: ["limit?", "offset?"], output: "SalvageItem[]", side_effects: [] }
  - { method: POST, path: "/demolition/salvage-manifests/{id}/transition", description: "FINALIZE (requires >= 1 item; computes net_credit_cents) | AMEND (FINALIZED -> AMENDED)", roles: [SalvageEstimator], code: 200, input: [action], output: SalvageManifest, side_effects: ["per SalvageManifest machine; net_credit invariant maintained"] }

  # --- NeighborNotification ---
  - { method: POST, path: "/demolition/projects/{id}/neighbor-notifications", description: "Create a neighbor notification (PENDING_DELIVERY)", roles: [SiteSupervisor], code: 201, input: [address, notice_method, scheduled_delivery_date], output: NeighborNotification, side_effects: ["status=PENDING_DELIVERY"] }
  - { method: GET, path: "/demolition/projects/{id}/neighbor-notifications", description: "List notifications of a project", roles: [ContractorAdmin, SiteSupervisor], code: 200, input: ["status?", "limit?", "offset?"], output: "NeighborNotification[]", side_effects: [] }
  - { method: POST, path: "/demolition/neighbor-notifications/{id}/transition", description: "DELIVER (logical-clock timestamp; blackout/quiet-hours/daily-cap checks) | VOID", roles: [SiteSupervisor], code: 200, input: [action], output: NeighborNotification, side_effects: ["delivered_at := logical clock on DELIVER"] }

  # --- DustNoiseLog ---
  - { method: POST, path: "/demolition/projects/{id}/dust-noise-logs", description: "Append a dust/noise monitoring event (project status must be DEMOLITION_ACTIVE, DEBRIS_CLEARANCE, BACKFILL_PHASE, or FINAL_REVIEW; allowed in either work_posture); exceedance triggers STOPPED posture cascade", roles: [EnvironmentalMonitor], code: 201, input: [reading_type, measured_value, wind_speed_mph, duration_hours], output: DustNoiseLog, side_effects: ["exposure_score computed; project.cumulative_exposure_score += score; on exceedance project work_posture := STOPPED and SCHEDULED FinalInspections -> CANCELLED"] }
  - { method: GET, path: "/demolition/projects/{id}/dust-noise-logs", description: "List monitoring events of a project", roles: [ContractorAdmin, SiteSupervisor, EnvironmentalMonitor], code: 200, input: ["limit?", "offset?"], output: "DustNoiseLog[]", side_effects: [] }

  # --- DebrisTicket ---
  - { method: POST, path: "/demolition/projects/{id}/debris-tickets", description: "Manifest a debris haul ticket (project must be DEMOLITION_ACTIVE or DEBRIS_CLEARANCE and WORKABLE)", roles: [HaulingDispatcher], code: 201, input: [ticket_number, facility_type, material_class, gross_tons], output: DebrisTicket, side_effects: ["status=MANIFESTED; project.in_transit_tons += gross_tons"] }
  - { method: GET, path: "/demolition/projects/{id}/debris-tickets", description: "List debris tickets of a project", roles: [ContractorAdmin, SiteSupervisor, HaulingDispatcher], code: 200, input: ["status?", "limit?", "offset?"], output: "DebrisTicket[]", side_effects: [] }
  - { method: POST, path: "/demolition/debris-tickets/{id}/transition", description: "RECEIVE (diverted_tons) | DISPUTE | RECONCILE (corrected weights, delta cap 2.0t) | VOID", roles: [HaulingDispatcher], code: 200, input: [action, "diverted_tons?", "corrected_gross_tons?", "corrected_diverted_tons?", "reason?"], output: DebrisTicket, side_effects: ["per DebrisTicket machine; project tonnage counters and diversion_rate/tier recomputed"] }

  # --- BackfillPlan ---
  - { method: POST, path: "/demolition/projects/{id}/backfill-plans", description: "Create a backfill/grading & erosion control plan", roles: [SiteSupervisor], code: 201, input: [design_disturbed_area_sqft, planned_protected_area_sqft, fill_volume_cu_yd, required_compaction_pct], output: BackfillPlan, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/demolition/projects/{id}/backfill-plans", description: "List backfill plans of a project", roles: [ContractorAdmin, SiteSupervisor, StructuralEngineer, MunicipalInspector], code: 200, input: ["limit?", "offset?"], output: "BackfillPlan[]", side_effects: [] }
  - { method: POST, path: "/demolition/backfill-plans/{id}/transition", description: "APPROVE (StructuralEngineer; provisional coverage) | RECORD_COMPACTION (SiteSupervisor) | VERIFY_EROSION (MunicipalInspector; final coverage) | COMPLETE (SiteSupervisor)", roles: [SiteSupervisor, StructuralEngineer, MunicipalInspector], code: 200, input: [action, "compaction_pct?", "measured_protected_area_sqft?", "measured_disturbed_area_sqft?"], output: BackfillPlan, side_effects: ["per BackfillPlan machine; coverage ratios computed"] }

  # --- FinalInspection ---
  - { method: POST, path: "/demolition/projects/{id}/final-inspections", description: "Schedule a final inspection (project FINAL_REVIEW; only one SCHEDULED at a time)", roles: [MunicipalInspector], code: 201, input: [inspection_type, scheduled_date], output: FinalInspection, side_effects: ["status=SCHEDULED"] }
  - { method: GET, path: "/demolition/projects/{id}/final-inspections", description: "List final inspections of a project", roles: [ContractorAdmin, SiteSupervisor, MunicipalInspector], code: 200, input: ["limit?", "offset?"], output: "FinalInspection[]", side_effects: [] }
  - { method: POST, path: "/demolition/final-inspections/{id}/transition", description: "PASS (backfill COMPLETE + diversion requirement; closes project) | FAIL | RESCHEDULE", roles: [MunicipalInspector], code: 200, input: [action, "inspector_note?", "scheduled_date?"], output: FinalInspection, side_effects: ["PASS -> project CLOSED; FAIL -> attempt_count += 1"] }

  # --- Test-driving (logical clock) ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock (ISO 8601 UTC). Startup default is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Setting the clock fires the permit expiry sweep.", roles: [ContractorAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["permit_expiry_sweep runs; ACTIVE permits past expires_at -> EXPIRED with cascades"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, invalid enum member, or invalid range (e.g. quantity 0 on a normal salvage line, negative tons, window end <= start)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist or child not scoped under the path parent" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State machine rejects the transition from the current state, or project phase gates the operation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Same X-User-ID attempted two segregated steps (certify vs performer)" }
  - { id: ERR_SURVEY_INCOMPLETE, http: 409, condition: "Release/clearance requires surveys COMPLETE; or abatement REQUEST_CLEARANCE while parent survey IN_PROGRESS" }
  - { id: ERR_HAZMAT_UNRESOLVED, http: 409, condition: "Release blocked: an abatement order is outside CLEARANCE_CERTIFIED" }
  - { id: ERR_UTILITY_UNVERIFIED, http: 409, condition: "Release/permit ACTIVATE blocked: missing or unconfirmed utility disconnect" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Release/START_DEMOLITION blocked: no ACTIVE unexpired permit" }
  - { id: ERR_PERMIT_EXPIRED, http: 409, condition: "Renewal attempted on an EXPIRED permit" }
  - { id: ERR_ENGINEERING_NOT_CERTIFIED, http: 409, condition: "Release/pin blocked: engineering survey missing or not CERTIFIED" }
  - { id: ERR_ENGINEERING_PIN_STALE, http: 409, condition: "Release blocked: pinned revision != survey's current revision_number" }
  - { id: ERR_NOTIFICATIONS_INCOMPLETE, http: 409, condition: "Release blocked: no notifications exist, or some are not DELIVERED" }
  - { id: ERR_NOTIFICATION_WINDOW_OPEN, http: 409, condition: "Release blocked: 72h wait window since last delivery not yet elapsed" }
  - { id: ERR_BLACKOUT_DATE, http: 422, condition: "Delivery date (logical clock) is in project.blackout_dates" }
  - { id: ERR_QUIET_HOURS, http: 422, condition: "Delivery occupation [now, now+30min) intersects quiet window [19:00, 07:00) UTC" }
  - { id: ERR_DAILY_DELIVERY_CAP, http: 409, condition: "Fourth notification delivery on the same project + UTC date" }
  - { id: ERR_DISCONNECT_WINDOW_OVERLAP, http: 409, condition: "Same project + utility_type half-open windows overlap" }
  - { id: ERR_PROJECT_STOPPED, http: 409, condition: "Write blocked because project work_posture == STOPPED" }
  - { id: ERR_DUPLICATE_ACTIVE_PERMIT, http: 409, condition: "Second non-terminal permit on the same project" }
  - { id: ERR_MANIFEST_EMPTY, http: 422, condition: "FINALIZE with zero salvage items" }
  - { id: ERR_TICKET_WEIGHT_INVALID, http: 422, condition: "diverted_tons outside [0, gross_tons] (or corrected equivalent)" }
  - { id: ERR_RECONCILE_DELTA_EXCEEDED, http: 422, condition: "Reconcile correction exceeds 2.0 tons on gross or diverted" }
  - { id: ERR_COMPACTION_BELOW_SPEC, http: 422, condition: "compaction_pct < required_compaction_pct" }
  - { id: ERR_EROSION_COVERAGE_INSUFFICIENT, http: 422, condition: "final_coverage_ratio < 0.9000" }
  - { id: ERR_BACKFILL_NOT_APPROVED, http: 409, condition: "START_BACKFILL without an APPROVED-or-later backfill plan" }
  - { id: ERR_BACKFILL_INCOMPLETE, http: 409, condition: "Inspection PASS without a COMPLETE backfill plan" }
  - { id: ERR_INSPECTION_OUTSTANDING, http: 409, condition: "Creating an inspection while another is SCHEDULED on the project" }
  - { id: ERR_DIVERSION_BELOW_REQUIREMENT, http: 409, condition: "Inspection PASS with project.diversion_rate < required_diversion_rate" }

# =============================================================================
# Table 7: RBAC Permission Matrix (all identities opaque; SoD via X-User-ID)
# =============================================================================
roles:
  - name: ContractorAdmin
    description: "Contractor back-office admin; sets up projects and drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /demolition/projects", "POST /_clock/set_current_utc"]
    shared_operations: ["GET endpoints", "POST /demolition/projects/{id}/release"]
  - name: SiteSupervisor
    description: "Contractor's site lead; drives phases, release, resume, pins, notifications, backfill execution"
    identity: opaque
    exclusive_operations: ["POST /demolition/projects/{id}/transition", "POST /demolition/projects/{id}/resume", "POST /demolition/projects/{id}/engineering-pin", "POST /demolition/projects/{id}/neighbor-notifications", "POST /demolition/neighbor-notifications/{id}/transition", "POST /demolition/projects/{id}/backfill-plans"]
    shared_operations: ["GET endpoints", "POST /demolition/projects/{id}/release", "POST /demolition/backfill-plans/{id}/transition"]
  - name: Surveyor
    description: "Building surveyor; owns structure surveys and opens abatement orders"
    identity: opaque
    exclusive_operations: ["POST /demolition/projects/{id}/structure-surveys", "POST /demolition/structure-surveys/{id}/transition"]
    shared_operations: ["GET endpoints", "POST /demolition/structure-surveys/{id}/abatements"]
  - name: AbatementSupervisor
    description: "Licensed abatement supervisor; performs abatement work steps"
    identity: opaque
    exclusive_operations: ["abatement START and REQUEST_CLEARANCE actions"]
    shared_operations: ["GET endpoints", "POST /demolition/structure-surveys/{id}/abatements", "POST /demolition/abatements/{id}/transition"]
  - name: ClearanceOfficer
    description: "Independent industrial hygienist; certifies or fails clearance (SoD vs AbatementSupervisor)"
    identity: opaque
    exclusive_operations: ["abatement CERTIFY_CLEARANCE and FAIL_CLEARANCE actions"]
    shared_operations: ["GET endpoints", "POST /demolition/abatements/{id}/transition"]
  - name: UtilityCoordinator
