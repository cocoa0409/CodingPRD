              payload: { member_nr: "MB", full_name: "Broker" }
              as: AssociationStaff
              captures: { mb_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/offices"
              payload: { office_code: "O1", broker_member_id: "${mb_id}" }
              as: AssociationStaff
              captures: { office_id: $.data.id }
            - call: "POST /mls/associations/${assoc_id}/dues-periods"
