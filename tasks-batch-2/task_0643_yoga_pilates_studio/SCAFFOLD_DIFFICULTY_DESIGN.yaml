              as: Member
              as_user_id: "${m_id}"
            - call: "POST /class-sessions/${p2_id}/start"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions/${p2_id}/complete"
              payload: {}
              as: StudioManager
            # The session-under-test S with a BOOKED reservation R.
            - call: "POST /class-sessions"
