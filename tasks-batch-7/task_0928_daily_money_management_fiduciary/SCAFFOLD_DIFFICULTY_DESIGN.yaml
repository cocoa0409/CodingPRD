  # =======================================================================
  # Rule 8 — resource temporal-overlap conflicts, different interval semantics
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: reconciliation_period_months_partition_the_account_timeline
        grounds:
          - validations[priority=18]
          - errors[ERR_PERIOD_OVERLAP]
          - entities.ReconciliationPeriod.fields.period_month
        distinguishing_aspect: |
          Interval semantics 1 - the resource is a ClientAccount and its
          timeline is partitioned into EXACT, NON-OVERLAPPING calendar months.
          Adjacency is always legal (2026-06 and 2026-07 touch and both
          succeed) and only an exact repeat of the same month collides. There
          is no buffer and no tolerance.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z"
            - "one ACTIVE client with one CHECKING account and no reconciliation periods yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin"
            - call: "POST /dmm/clients"
              payload: { full_name: "Rosa Mendel", date_of_birth: "1941-03-08", intake_reference: "INT-9023" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { cl_id: $.data.id }
            - call: "POST /dmm/clients/${cl_id}/capacity-determination"
              payload: { determination: "RETAINS_CAPACITY", determined_on: "2026-05-15" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/clients/${cl_id}/status-change"
              payload: { to_status: "ACTIVE" }
              as: FiduciaryManager
              as_user_id: "u-mgr"
            - call: "POST /dmm/accounts"
              payload: { client_id: "${cl_id}", institution_name: "First Community Bank", account_label: "Operating", account_type: "CHECKING", opening_balance_cents: 5000000 }
              as: FiduciaryManager
              as_user_id: "u-mgr"
              captures: { acct_id: $.data.id }
            - call: "POST /dmm/reconciliation-periods"
              payload: { account_id: "${acct_id}", period_month: "2026-06" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { per_jun: $.data.id }
            - call: "POST /dmm/reconciliation-periods"
              payload: { account_id: "${acct_id}", period_month: "2026-07" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { per_jul: $.data.id }
          trigger:
            - call: "POST /dmm/reconciliation-periods"
              payload: { account_id: "${acct_id}", period_month: "2026-06" }
              as: BillPaySpecialist
              as_user_id: "u-spec"
              captures: { err_id: $.data.error_id }
          assert:
            - "the adjacent 2026-07 period was created successfully with HTTP 201"
            - "the repeat of 2026-06 returns HTTP 409 with error_id ERR_PERIOD_OVERLAP"
            - "ReconciliationPeriod.${per_jun}.status == OPEN"
            - "ReconciliationPeriod.${per_jul}.status == OPEN"
            - "exactly 2 ReconciliationPeriod rows exist for account ${acct_id}"

      - name: duplicate_payment_buffer_is_symmetric_and_inclusive_at_three_days
        grounds:
          - validations[priority=19]
          - calculations.duplicate_payment_collision
          - errors[ERR_DUPLICATE_PAYMENT_WINDOW]
          - entities.Payment.fields.duplicate_override
        distinguishing_aspect: |
          Interval semantics 2, on a different resource - the (account, payee,
          amount) triple. Here the geometry is a SYMMETRIC buffer of
          DUPLICATE_PAYMENT_BUFFER_DAYS days around a single point, inclusive
          at the boundary, so two settlement dates exactly 3 days apart
          collide. That is the opposite treatment of adjacency from the
          exact-month partition above, where touching intervals never collide.
        test_recipe:
          setup:
            - "logical clock at 2026-06-01T09:00:00Z, one IN_FORCE bond with ample coverage"
            - "one ACTIVE client, one ACTIVE FULL_AGENCY authorization, one account with 5000000 cents"
            - "one RECURRING_BILLER payee and a UTILITIES budget line for 2026-06 allocated 300000 cents"
            - "one SCHEDULED BILLER_DIRECT payment of 40000 cents projecting to settle on 2026-06-01"
          setup_api_calls:
