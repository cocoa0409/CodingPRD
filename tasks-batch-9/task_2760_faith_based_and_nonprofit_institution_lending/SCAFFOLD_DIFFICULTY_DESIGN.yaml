  - rule_id: resource_temporal_overlap
    instances:
      - name: giving_period_closed_interval_touching_endpoint_collides
        grounds:
          - validations[priority=36].ERR_GIVING_PERIOD_OVERLAP
          - entities.GivingPeriod.fields.period_start
          - entities.GivingPeriod.fields.period_end
          - endpoints["POST /giving-periods"]
        distinguishing_aspect: |
          GivingPeriod intervals are CLOSED-CLOSED and scoped per institution, so sharing a
          single instant collides: a period starting exactly at the incumbent's 2025-03-31
          end and a period ending exactly at its 2025-01-01 start are both rejected with
          ERR_GIVING_PERIOD_OVERLAP, while the one-day-off neighbours (2025-04-01 start and
          2024-12-31 end) are both accepted. The identical colliding window is accepted for a
          SECOND institution, proving the check is per-institution rather than global. A
          half-open implementation accepts the two touching cases and fails this instance.
        test_recipe:
          setup:
            - "Institution A with a single filed period 2025Q1 spanning [2025-01-01, 2025-03-31]."
            - "Institution B with no periods at all."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3, endowment_market_value_cents: 800000000 }
              as: PlatformAdmin
              captures: { inst_a: $.data.id }
            - call: "POST /institutions"
              payload: { legal_name: "Trinity Lutheran School", institution_type: "SCHOOL", denomination_code: "ELCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 300000000, bylaws_quorum_pct: 0.5000, community_program_count: 1, endowment_market_value_cents: 0 }
              as: PlatformAdmin
              captures: { inst_b: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_a}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
              captures: { gp1: $.data.id }
          trigger:
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_a}", period_label: "2025Q2-TOUCHING-START", period_start: "2025-03-31T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_a}", period_label: "2024Q4-TOUCHING-END", period_start: "2024-10-01T00:00:00Z", period_end: "2025-01-01T00:00:00Z", source: "AUDITED", total_contributions_cents: 58000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39000000, member_household_count: 495 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_a}", period_label: "2025Q2", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
              captures: { gp_q2: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_a}", period_label: "2024Q4", period_start: "2024-10-01T00:00:00Z", period_end: "2024-12-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 58000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39000000, member_household_count: 495 }
              as: CreditAnalyst
              captures: { gp_q4_prior: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst_b}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 20000000, restricted_contributions_cents: 2000000, donor_restricted_endowment_draw_cents: 0, operating_expense_cents: 15000000, member_household_count: 120 }
              as: CreditAnalyst
              captures: { gp_b: $.data.id }
          assert:
            - "Touching-start attempt (period_start == 2025-03-31): 409 with data.error_id == \"ERR_GIVING_PERIOD_OVERLAP\""
            - "Touching-end attempt (period_end == 2025-01-01): 409 with data.error_id == \"ERR_GIVING_PERIOD_OVERLAP\""
            - "Adjacent 2025-04-01 attempt succeeds (201) and adjacent 2024-12-31 attempt succeeds (201) — a one-day gap is enough"
            - "Institution B's identical [2025-01-01, 2025-03-31] window succeeds (201) — the interval check is scoped by institution_id"
            - "Institution.${inst_a}.period_count == 3 and Institution.${inst_b}.period_count == 1 after all five attempts"
            - "GivingPeriod.${gp_q2}.unrestricted_contributions_cents == 52000000 and net_available_for_debt_service_cents == 11000050 — the accepted rows still compute their own derived fields"

      - name: collateral_lien_window_half_open_with_thirty_day_buffer_conflicts
        grounds:
          - validations[priority=37].ERR_COLLATERAL_LIEN_WINDOW_CONFLICT
          - entities.CollateralAsset.fields.lien_effective_from
          - entities.CollateralAsset.fields.lien_effective_to
          - entities.CollateralAsset.fields.lien_history
          - endpoints["POST /collateral-assets/{collateral_asset_id}/assignments"]
          - endpoints["POST /collateral-assets/{collateral_asset_id}/release"]
        distinguishing_aspect: |
          Lien occupations are HALF-OPEN and a released occupation keeps the asset blocked
          for LIEN_RELEASE_BUFFER_DAYS (30) past its declared end, so the released
          [2026-08-01, 2026-09-01) window behaves as [2026-08-01, 2026-10-01): a re-assignment
          starting exactly at the unbuffered end 2026-09-01 is rejected with
          ERR_COLLATERAL_LIEN_WINDOW_CONFLICT, while one starting exactly at the buffered end
          2026-10-01 is accepted. This is the opposite endpoint convention from
          giving_period_closed_interval_touching_endpoint_collides — touching the buffered end
          is legal here, touching the closed end is not there.
        test_recipe:
          setup:
            - "One institution, one sanctuary asset (appraised 500000000, score 2, appraised 2025-06-01), and two DRAFT applications on the same governance packet."
            - "The asset was assigned first lien to application 1 for [2026-08-01, 2026-09-01) and then released, so the occupation lives only in lien_history."
