            - call: "POST /fleet/trailers"
              payload: { trailer_code: "VAN-911", domicile_id: "${dom_slc_id}", trailer_type: "DRY_VAN", capacity_cases: 3200, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
