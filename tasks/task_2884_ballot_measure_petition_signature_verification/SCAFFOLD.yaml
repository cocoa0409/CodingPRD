scenario: |
  2884. Ballot Measure Petition Signature Verification (secretary of state initiative program): petition format and single-subject review before circulation with title and summary preparation, circulator registration, training and affidavit requirements with paid-circulator disclosure, signature submission deadlines with county distribution requirements, raw count, random sample verification and full check thresholds by state formula, signature validation against voter records for registration status, duplicate detection and signature comparison, cure or supplemental signature periods where allowed, certification or failure determination with challenge and court review, fraud referral for forged signatures and circulator misconduct

domain_name: ballot-measure-petition-signature-verification
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Flat peer entities joined by explicit foreign keys. Only two nested URL
  # segments exist (POST /petitions/{id}/verification-rounds, /cure-periods,
  # /challenges) because those children are minted in the parent's context;
  # every other relationship is a body-level FK plus a filtered list endpoint.

  state_machine_shape: cyclic
  # Petition.status carries two documented cycles (FORMAT_REVIEW -> FORMAT_REJECTED
  # -> FORMAT_REVIEW, bounded by MAX_FORMAT_REVIEW_ROUNDS, and the CURE_PERIOD
  # self-loop driven by a CURE_RECHECK tally, bounded by MAX_CURE_PERIODS);
  # Petition also carries a second, independent dimension (challenge_status) that
  # advances in parallel with status and itself cycles CHALLENGE_FILED -> NONE on
  # dismissal; Circulator.registration_status cycles REGISTERED -> SUSPENDED ->
  # REGISTERED; SignatureBatch.status is a fork-join diamond
  # (AFFIDAVIT_VERIFIED -> {SAMPLED, FULLY_CHECKED} -> FULLY_CHECKED) with a
  # compensating INVALIDATED -> status_before_invalidation return edge.

  relationship_patterns:
    - one_to_many
    - many_to_many          # CirculationAssignment joins Petition x Circulator
    - self_referential      # SignatureRecord.duplicate_of_signature_id -> SignatureRecord.id
    - cross_aggregate       # SignatureRecord.matched_voter_record_id crosses into the voter-roll aggregate

  role_model: segregation_of_duties
  # The ElectionsExaminer who tallied the round that produced a petition's
  # determination may not issue that petition's CERTIFY determination, and the
  # examiner who opened a FraudReferral may not adjudicate it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 65 endpoints / 67 error codes / 11 calculations / 15 validation
  # priorities / 10 state machine dimensions across 8 entities / 2 OCC rules.
  # The error catalog sits above the usual expert band on purpose: with 12
  # entities each carrying its own NOT_FOUND and 65 endpoints spanning ten
  # lifecycles, collapsing codes would force generic names and lose the
  # priority-pair distinctions §1.4 depends on.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: VerificationStandard
    parent: null
    common_fields: false
    kind: configuration
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: "Short code of the jurisdiction whose statutory formula this standard encodes."
        constraints: "2-8 characters; unique across VerificationStandard"
      - name: gubernatorial_vote_total
        type: integer
        source: input
        description: "Total votes cast for governor at the last general election; the base of the signature formula."
        constraints: ">= 1"
      - name: signature_pct_bps
        type: integer
        source: input
        description: "Basis points of gubernatorial_vote_total required as valid signatures."
        constraints: "1..10000"
      - name: sample_pct_bps
        type: integer
        source: input
        description: "Basis points of the accepted raw pool drawn into a RANDOM_SAMPLE round."
        constraints: "1..10000"
      - name: sample_min_count
        type: integer
        source: input
        description: "Statutory minimum sample size; the sample is clamped to the pool size when the pool is smaller."
        constraints: ">= 1"
      - name: sufficiency_upper_bps
        type: integer
        source: input
        description: "Basis points of required_valid_signatures at or above which a sample projection is SUFFICIENT."
        constraints: ">= 10000"
      - name: sufficiency_lower_bps
        type: integer
        source: input
        description: "Basis points of required_valid_signatures at or below which a sample projection is INSUFFICIENT."
        constraints: "1..10000"
      - name: stratification_mode
        type: enum
        source: input
        description: "Selects which sample_projection variant applies to RANDOM_SAMPLE rounds."
        constraints: "POOLED | STRATIFIED"
      - name: county_distribution_pct_bps
        type: integer
        source: input
        description: "Basis points of a county registered_voter_count that county must contribute to qualify."
        constraints: "1..10000"
      - name: required_qualifying_counties
        type: integer
        source: input
        description: "Number of counties that must qualify before a petition may be certified."
        constraints: ">= 1"
      - name: cure_allowed
        type: boolean
        source: input
        description: "Whether a supplemental (cure) signature period is available in this jurisdiction."
        default: true
      - name: cure_window_days
        type: integer
        source: input
        description: "Length in whole days of each cure period; deadline_at equals opened_at plus this many days."
        default: 30
        constraints: ">= 1"
      - name: cure_eligibility_floor_bps
        type: integer
        source: input
        description: "Basis points of required_valid_signatures a petition must already hold to be cure-eligible."
        default: 8000
      - name: circulation_window_days
        type: integer
        source: input
        description: "Whole days from cleared_at to circulation_deadline."
        default: 180
        constraints: ">= 1"
      - name: verification_rate_millicents_per_signature
        type: integer
        source: input
        description: "County reimbursement rate in millicents for each signature examined."
        constraints: ">= 1"
      - name: county_surcharge_bps
        type: integer
        source: input
        description: "Basis points administrative surcharge applied to the discounted invoice subtotal."
        constraints: "0..10000"

  - name: County
    parent: null
    common_fields: false
    kind: configuration
    fields:
      - name: county_code
        type: string
        source: input
        description: "Canonical county code used in CirculationAssignment.assigned_county_codes and in every ordering rule."
        constraints: "2-12 uppercase characters; unique across County"
      - name: name
        type: string
        source: input
        description: "Display name of the county elections office."
      - name: registered_voter_count
        type: integer
        source: input
        description: "Registered voters of record in this county; base of the county distribution minimum."
        constraints: ">= 1"

  - name: VoterRecord
    parent: null
    common_fields: false
    kind: configuration
    fields:
      - name: county_id
        type: string
        source: input
        description: "FK -> County.id; county in whose roll this voter appears."
      - name: voter_id_number
        type: string
        source: input
        description: "Statewide voter identifier that a SignatureRecord claims via claimed_voter_id_number."
        constraints: "unique across VoterRecord"
      - name: full_name
        type: string
        source: input
        description: "Registered name of the voter."
      - name: registration_status
        type: enum
        source: input
        description: "Registration standing used by signature validation; only ACTIVE counts toward validity."
        default: ACTIVE
        constraints: "ACTIVE | INACTIVE | CANCELLED | PENDING"
      - name: signature_on_file_hash
        type: string
        source: input
        description: "Hash of the signature exemplar on file; compared against SignatureRecord.signature_hash."
      - name: registration_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the registration took effect."

  - name: Petition
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: standard_id
        type: string
        source: input
        description: "FK -> VerificationStandard.id; the statutory formula in force for this petition."
      - name: proponent_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Proponent that created the petition; Proponent ownership checks compare X-User-ID to this field."
      - name: proponent_name
        type: string
        source: input
        description: "Name of the proponent committee as filed."
      - name: submitted_title
        type: string
        source: input
        description: "Title as submitted by the proponent, before official title preparation."
      - name: measure_subject_codes
        type: array
        source: input
        description: "Subject codes the measure touches; single-subject review requires exactly one to clear."
        constraints: "1..5 items, each of TAX | ELECTIONS | EDUCATION | HEALTH | ENVIRONMENT | PUBLIC_SAFETY; no duplicates"
      - name: official_title
        type: string
        source: system
        description: "Official title prepared by the TitleExaminer; null until PUT /petitions/{id}/title-summary succeeds."
        default: null
      - name: official_summary
        type: string
        source: system
        description: "Official summary prepared by the TitleExaminer; null until PUT /petitions/{id}/title-summary succeeds."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle dimension of the petition."
        default: DRAFT
        constraints: "DRAFT | FORMAT_REVIEW | FORMAT_REJECTED | TITLE_PENDING | CLEARED | SIGNATURES_FILED | SAMPLE_VERIFICATION | FULL_CHECK | CURE_PERIOD | PENDING_CERTIFICATION | PENDING_FAILURE | CERTIFIED | FAILED"
      - name: challenge_status
        type: enum
        source: system
        description: "Second, independent state dimension tracking challenge and court review; advances without gating status transitions except at court ruling."
        default: NONE
        constraints: "NONE | CHALLENGE_FILED | COURT_REVIEW | COURT_AFFIRMED | COURT_REVERSED"
      - name: format_review_round
        type: integer
        source: system
        description: "Count of completed format review rounds; incremented on every REJECT format decision."
        default: 0
      - name: cleared_at
        type: datetime
        source: system
        description: "Logical-clock instant the petition was cleared for circulation; null before clearance."
        default: null
      - name: circulation_deadline
        type: datetime
        source: system
        description: "cleared_at plus VerificationStandard.circulation_window_days; null before clearance."
        default: null
      - name: required_valid_signatures
        type: integer
        source: computed
        description: "Output of calculations.required_valid_signature_threshold; frozen at clearance."
        default: 0
      - name: raw_signature_count
        type: integer
        source: computed
        description: "Output of calculations.petition_raw_and_accepted_counts (raw leg)."
        default: 0
      - name: accepted_raw_total
        type: integer
        source: computed
        description: "Output of calculations.petition_raw_and_accepted_counts (accepted leg); the projection base and the conserved quantity of invariant signature_count_ledger."
        default: 0
      - name: projected_valid_count
        type: integer
        source: computed
        description: "Output of calculations.sample_projection for the latest CLOSED round, recomputed whenever accepted_raw_total changes."
        default: 0
      - name: verified_valid_count
        type: integer
        source: computed
        description: "Face-value count of SignatureRecord rows with validation_status == VALID across non-invalidated batches; written only by FULL_CHECK and CURE_RECHECK tallies."
        default: 0
      - name: qualifying_county_count
        type: integer
        source: computed
        description: "Output of calculations.county_distribution_compliance."
        default: 0
      - name: verification_cost_accrued_cents
        type: integer
        source: computed
        description: "Running county reimbursement ledger; the conserved quantity of invariant verification_cost_ledger."
        default: 0
      - name: voided_signature_count
        type: integer
        source: computed
        description: "Count of SignatureRecord rows for this petition whose validation_status == VOIDED."
        default: 0
      - name: cure_period_count
        type: integer
        source: computed
        description: "Count of CurePeriod rows for this petition in any status; capped by constant MAX_CURE_PERIODS."
        default: 0

  - name: Circulator
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the circulator as registered."
      - name: residency_state_code
        type: string
        source: input
        description: "Two-letter state code of the circulator residence, as sworn in the registration."
        constraints: "exactly 2 uppercase characters"
      - name: is_paid
        type: boolean
        source: input
        description: "Whether the circulator is compensated; true requires a paid-circulator disclosure before affidavit filing."
        default: false
      - name: employer_name
        type: string
        source: input
        description: "Employer or contractor paying the circulator; null permitted only when is_paid == false."
        default: null
      - name: disclosure_document_id
        type: string
        source: system
        description: "Identifier of the filed paid-circulator disclosure document; written by PUT /circulators/{id}/paid-disclosure."
        default: null
      - name: paid_disclosure_on_file
        type: boolean
        source: computed
        description: "True when is_paid == false, or when is_paid == true and both employer_name and disclosure_document_id are non-null."
        default: true
      - name: registration_status
        type: enum
        source: system
        description: "Registration dimension of the circulator."
        default: PENDING_TRAINING
        constraints: "PENDING_TRAINING | TRAINED | REGISTERED | SUSPENDED | REVOKED"
      - name: training_course_code
        type: string
        source: system
        description: "Course code recorded at training completion."
        default: null
      - name: training_completed_at
        type: datetime
        source: system
        description: "Logical-clock instant training completed."
        default: null
      - name: affidavit_filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the circulator affidavit was filed."
        default: null
      - name: misconduct_strike_count
        type: integer
        source: computed
        description: "Count of FraudReferral rows for this circulator with status == SUBSTANTIATED."
        default: 0
      - name: credibility_score_bps
        type: integer
        source: computed
        description: "Output of calculations.circulator_credibility_score; variant selected by misconduct_strike_count."
        default: 10000

  - name: CirculationAssignment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; petition this circulator is authorised to circulate."
      - name: circulator_id
        type: string
        source: input
        description: "FK -> Circulator.id; the assigned circulator."
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the assignment occupation interval on the circulator."
      - name: effective_to
        type: datetime
        source: input
        description: "Inclusive end of the assignment occupation interval on the circulator."
        constraints: "strictly after effective_from"
      - name: assigned_county_codes
        type: array
        source: input
        description: "County.county_code values this assignment covers; a batch county must appear here."
        constraints: "1..10 items, no duplicates, each an existing County.county_code"
      - name: paid_disclosure_ack
        type: boolean
        source: input
        description: "Proponent acknowledgement that the paid-circulator disclosure was reviewed."
        default: false
      - name: status
        type: enum
        source: system
        description: "Assignment standing; SUSPENDED blocks new batches but preserves existing ones, TERMINATED invalidates non-terminal batches."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | TERMINATED"

  - name: SignatureBatch
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; petition the sheets belong to."
      - name: circulator_id
        type: string
        source: input
        description: "FK -> Circulator.id; circulator who swore the batch affidavit."
      - name: county_id
        type: string
        source: input
        description: "FK -> County.id; county whose clerk verifies these sheets."
      - name: cure_period_id
        type: string
        source: input
        description: "FK -> CurePeriod.id; set only when is_supplemental == true, null otherwise."
        default: null
      - name: is_supplemental
        type: boolean
        source: input
        description: "True for supplemental sheets filed inside a cure period; excluded from RANDOM_SAMPLE pools."
        default: false
      - name: affidavit_signed
        type: boolean
        source: input
        description: "Circulator attestation that the batch affidavit is executed."
      - name: affidavit_notary_id
        type: string
        source: system
        description: "Notary identifier recorded by the county clerk at affidavit verification."
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the batch was received; secondary key of the duplicate keeper ranking."
      - name: raw_count
        type: integer
        source: computed
        description: "Count of SignatureRecord rows attached to this batch."
        default: 0
      - name: accepted_raw_count
        type: integer
        source: computed
        description: "raw_count minus format_defect_count once AFFIDAVIT_VERIFIED; exactly 0 while RECEIVED, REJECTED_FORMAT or INVALIDATED."
        default: 0
      - name: format_defect_count
        type: integer
        source: computed
        description: "Count of SignatureRecord rows struck at affidavit verification with validation_status == INVALID_FORMAT_DEFECT."
        default: 0
      - name: checked_signature_count
        type: integer
        source: computed
        description: "Count of SignatureRecord rows in this batch whose validation_status is not PENDING and not INVALID_FORMAT_DEFECT; the billing base."
        default: 0
      - name: verification_cost_cents
        type: integer
        source: computed
        description: "Output of calculations.batch_verification_cost, stored so the compensating void subtracts the stored amount rather than recomputing it."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Batch lifecycle; the fork-join dimension."
        default: RECEIVED
        constraints: "RECEIVED | AFFIDAVIT_VERIFIED | SAMPLED | FULLY_CHECKED | REJECTED_FORMAT | INVALIDATED"
      - name: status_before_invalidation
        type: enum
        source: system
        description: "Status held immediately before INVALIDATED; restored verbatim by POST /signature-batches/{id}/reinstate."
        default: null
      - name: invalidation_reason
        type: string
        source: system
        description: "Free-text reason recorded on invalidation or reinstatement."
        default: null

  - name: SignatureRecord
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> SignatureBatch.id; the batch this signature line belongs to."
      - name: line_number
        type: integer
        source: input
        description: "Line position on the petition sheet; tertiary key of every ordering rule."
        constraints: ">= 1; unique within batch_id"
      - name: signer_name
        type: string
        source: input
        description: "Name as signed on the line."
      - name: claimed_voter_id_number
        type: string
        source: input
        description: "Voter identifier written on the line; matched against VoterRecord.voter_id_number at validation."
      - name: signed_on
        type: datetime
        source: input
        description: "Logical instant the line was signed; primary key of every ordering rule."
      - name: signature_hash
        type: string
        source: input
        description: "Hash of the signature image on the line; compared with VoterRecord.signature_on_file_hash."
      - name: matched_voter_record_id
        type: string
        source: system
        description: "FK -> VoterRecord.id; set at validation when claimed_voter_id_number resolves, null otherwise."
        default: null
      - name: duplicate_of_signature_id
        type: string
        source: system
        description: "FK -> SignatureRecord.id; self-referential pointer to the keeper line when this line is INVALID_DUPLICATE."
        default: null
      - name: validated_in_round_id
        type: string
        source: system
        description: "FK -> VerificationRound.id; the round that selected this line for examination."
        default: null
      - name: in_sample
        type: boolean
        source: computed
        description: "True while this line is selected by an OPEN or CLOSED round; reset to false when that round is VOIDED."
        default: false
      - name: validation_status
        type: enum
        source: system
        description: "Verification outcome of the line."
        default: PENDING
        constraints: "PENDING | VALID | INVALID_NOT_REGISTERED | INVALID_DUPLICATE | INVALID_SIGNATURE_MISMATCH | INVALID_WRONG_COUNTY | INVALID_FORMAT_DEFECT | VOIDED"
      - name: status_before_void
        type: enum
        source: system
        description: "validation_status held immediately before VOIDED; restored verbatim by batch reinstatement."
        default: null
      - name: void_reason
        type: enum
        source: system
        description: "Why the line was voided."
        default: null
        constraints: "BATCH_INVALIDATED | CIRCULATOR_REVOKED | FRAUD_SUBSTANTIATED"
      - name: manual_match_override_applied
        type: boolean
        source: system
        description: "True when the clerk accepted a signature-hash mismatch under manual_match_override."
        default: false

  - name: VerificationRound
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; the petition under verification."
      - name: cure_period_id
        type: string
        source: system
        description: "FK -> CurePeriod.id; set only on CURE_RECHECK rounds, null otherwise."
        default: null
      - name: round_type
        type: enum
        source: input
        description: "Which verification algorithm this round runs."
        constraints: "RANDOM_SAMPLE | FULL_CHECK | CURE_RECHECK"
      - name: round_index
        type: integer
        source: system
        description: "1-based sequence number of the round within its petition, assigned in creation order."
      - name: status
        type: enum
        source: system
        description: "Round lifecycle."
        default: OPEN
        constraints: "OPEN | CLOSED | VOIDED"
      - name: eligible_pool_size
        type: integer
        source: computed
        description: "Size of the eligible SignatureRecord pool observed at round creation."
        default: 0
      - name: sample_size
        type: integer
        source: computed
        description: "Output of calculations.sample_selection; number of lines this round selected."
        default: 0
      - name: sampled_valid_count
        type: integer
        source: computed
        description: "Count of this round's selected lines with validation_status == VALID at tally."
        default: 0
      - name: validity_rate_bps
        type: integer
        source: computed
        description: "floor(sampled_valid_count * 10000 / sample_size), recorded for audit in every round type."
        default: 0
      - name: projected_valid_count
        type: integer
        source: computed
        description: "Output of calculations.sample_projection for this round; face-value valid count for FULL_CHECK and CURE_RECHECK."
        default: 0
      - name: determination
        type: enum
        source: system
        description: "Statutory band outcome of the round, from calculations.sufficiency_band_determination."
        default: PENDING
        constraints: "PENDING | SUFFICIENT | INSUFFICIENT | FULL_CHECK_REQUIRED"
      - name: tallied_by_examiner_id
        type: string
        source: system
        description: "Opaque X-User-ID of the ElectionsExaminer who tallied; the segregation-of-duties bar for CERTIFY."
        default: null
      - name: accrued_cost_cents
        type: integer
        source: computed
        description: "Sum of the verification_cost_cents deltas this round accrued; subtracted verbatim on void."
        default: 0
      - name: voided_reason
        type: string
        source: system
        description: "Reason recorded when the round is VOIDED."
        default: null

  - name: CurePeriod
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; petition being cured."
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant at creation; inclusive start of the half-open occupation interval."
      - name: deadline_at
        type: datetime
        source: system
        description: "opened_at plus VerificationStandard.cure_window_days; exclusive end of the half-open occupation interval."
      - name: shortfall_at_open
        type: integer
        source: computed
        description: "Output of calculations.cure_target_computation, step 2."
        default: 0
      - name: assumed_validity_rate_bps
        type: integer
        source: computed
        description: "Output of calculations.cure_target_computation, step 3."
        default: 0
      - name: cure_target_raw_signatures
        type: integer
        source: computed
        description: "Output of calculations.cure_target_computation, step 4; raw supplemental lines the proponent must file."
        default: 0
      - name: supplemental_raw_count
        type: integer
        source: computed
        description: "Sum of raw_count over SignatureBatch rows with this cure_period_id and status not in {REJECTED_FORMAT, INVALIDATED}."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Cure period lifecycle."
        default: OPEN
        constraints: "OPEN | CLOSED_SUFFICIENT | CLOSED_INSUFFICIENT | EXPIRED"

  - name: Challenge
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; petition whose determination is challenged."
      - name: challenger_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the Challenger that filed; ownership checks compare X-User-ID to this field."
      - name: challenger_name
        type: string
        source: input
        description: "Name of the challenging party."
      - name: grounds
        type: enum
        source: input
        description: "Statutory ground pleaded."
        constraints: "COUNT_ERROR | FORGERY | CIRCULATOR_INELIGIBLE | FORMAT_DEFECT"
      - name: statement
        type: string
        source: input
        description: "Narrative statement of the challenge."
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the challenge was filed."
      - name: review_deadline_at
        type: datetime
        source: system
        description: "filed_at plus constant CHALLENGE_REVIEW_DAYS; after this instant no court escalation is accepted."
      - name: court_docket_number
        type: string
        source: system
        description: "Docket number recorded when the challenge is escalated to court review."
        default: null
      - name: ruling
        type: enum
        source: system
        description: "Court ruling recorded at RULE."
        default: null
        constraints: "AFFIRM | REVERSE"
      - name: status
        type: enum
        source: system
        description: "Challenge lifecycle."
        default: FILED
        constraints: "FILED | COURT_REVIEW | UPHELD | DISMISSED"

  - name: FraudReferral
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: petition_id
        type: string
        source: input
        description: "FK -> Petition.id; petition the suspected fraud touches."
      - name: circulator_id
        type: string
        source: input
        description: "FK -> Circulator.id; circulator referred."
      - name: batch_id
        type: string
        source: input
        description: "FK -> SignatureBatch.id; batch whose lines are voided on substantiation; null for referrals with no batch."
        default: null
      - name: referral_type
        type: enum
        source: input
        description: "Nature of the referral."
        constraints: "FORGED_SIGNATURES | CIRCULATOR_MISCONDUCT | FALSE_AFFIDAVIT"
      - name: narrative
        type: string
        source: input
        description: "Examiner narrative supporting the referral."
      - name: opened_by_examiner_id
        type: string
        source: system
        description: "Opaque X-User-ID of the opening ElectionsExaminer; the segregation-of-duties bar for adjudication."
      - name: adjudicated_by_examiner_id
        type: string
        source: system
        description: "Opaque X-User-ID of the adjudicating ElectionsExaminer."
        default: null
      - name: referred_to_ag
        type: boolean
        source: system
        description: "True once the referral has been forwarded to the Attorney General."
        default: false
      - name: finding
        type: enum
        source: system
        description: "Adjudication finding."
        default: null
        constraints: "SUBSTANTIATED | UNSUBSTANTIATED"
      - name: voided_signature_count
        type: integer
        source: computed
        description: "Count of SignatureRecord rows voided by this referral with void_reason == FRAUD_SUBSTANTIATED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Referral lifecycle."
        default: OPENED
        constraints: "OPENED | REFERRED_TO_AG | SUBSTANTIATED | UNSUBSTANTIATED"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Petition
    field: status
    initial_state: DRAFT
    terminal_states: [CERTIFIED, FAILED]
    transitions:
      - from: DRAFT
        to: FORMAT_REVIEW
        trigger: "POST /petitions/{petition_id}/submit"
        actor: Proponent
        preconditions:
          - "petition.status == DRAFT"
          - "petition.format_review_round < MAX_FORMAT_REVIEW_ROUNDS"
          - "measure_subject_codes contains 1..5 distinct valid codes"
        side_effects: []

      - from: FORMAT_REJECTED
        to: FORMAT_REVIEW
        trigger: "POST /petitions/{petition_id}/submit"
        actor: Proponent
        preconditions:
          - "petition.status == FORMAT_REJECTED"
          - "petition.format_review_round < MAX_FORMAT_REVIEW_ROUNDS"
        side_effects: []
        note: "Revision cycle. The third submit attempt is refused with ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED because format_review_round has reached MAX_FORMAT_REVIEW_ROUNDS."

      - from: FORMAT_REVIEW
        to: FORMAT_REJECTED
        trigger: "POST /petitions/{petition_id}/format-decision with decision == REJECT"
        actor: ElectionsExaminer
        preconditions:
          - "petition.status == FORMAT_REVIEW"
        side_effects:
          - "increments petition.format_review_round by 1"

      - from: FORMAT_REVIEW
        to: TITLE_PENDING
        trigger: "POST /petitions/{petition_id}/format-decision with decision == APPROVE"
        actor: ElectionsExaminer
        preconditions:
          - "petition.status == FORMAT_REVIEW"
          - "len(petition.measure_subject_codes) == 1 (single-subject rule), else ERR_SINGLE_SUBJECT_VIOLATION"
        side_effects:
          - "increments petition.format_review_round by 1"

      - from: TITLE_PENDING
        to: TITLE_PENDING
        trigger: "PUT /petitions/{petition_id}/title-summary"
        actor: TitleExaminer
        preconditions:
          - "petition.status == TITLE_PENDING"
          - "request carries expected_petition_version equal to petition.version"
        side_effects:
          - "sets petition.official_title and petition.official_summary, superseding any previously prepared pair"
          - "increments petition.version by 1"
        note: "Self-transition. A revised title legitimately supersedes the prior one, so this write is guarded by OCC rule title-summary-stale-petition rather than by a state precondition."

      - from: TITLE_PENDING
        to: CLEARED
        trigger: "POST /petitions/{petition_id}/clear-for-circulation"
        actor: SosAdmin
        preconditions:
          - "petition.status == TITLE_PENDING"
          - "petition.official_title is non-null and petition.official_summary is non-null, else ERR_TITLE_SUMMARY_MISSING"
        side_effects:
          - "sets petition.cleared_at to the logical clock"
          - "sets petition.circulation_deadline to cleared_at plus standard.circulation_window_days"
          - "computes petition.required_valid_signatures via calculations.required_valid_signature_threshold"

      - from: CLEARED
        to: SIGNATURES_FILED
        trigger: "POST /petitions/{petition_id}/file-signatures"
        actor: Proponent
        preconditions:
          - "petition.status == CLEARED"
          - "logical clock <= petition.circulation_deadline, else ERR_CIRCULATION_DEADLINE_PASSED"
          - "at least one SignatureBatch for this petition has status == AFFIDAVIT_VERIFIED, else ERR_NO_VERIFIED_BATCHES"
        side_effects:
          - "recomputes petition.raw_signature_count and petition.accepted_raw_total via calculations.petition_raw_and_accepted_counts"
          - "recomputes petition.qualifying_county_count via calculations.county_distribution_compliance"

      - from: SIGNATURES_FILED
        to: SAMPLE_VERIFICATION
        trigger: "POST /petitions/{petition_id}/verification-rounds with round_type == RANDOM_SAMPLE"
        actor: ElectionsExaminer
        preconditions:
          - "petition.status == SIGNATURES_FILED"
          - "no VerificationRound for this petition has status == OPEN, else ERR_ROUND_ALREADY_OPEN"
        side_effects:
          - "creates a VerificationRound in OPEN with sample_size from calculations.sample_selection"
          - "sets in_sample and validated_in_round_id on every selected SignatureRecord"

      - from: SIGNATURES_FILED
        to: FULL_CHECK
        trigger: "POST /petitions/{petition_id}/verification-rounds with round_type == FULL_CHECK"
        actor: ElectionsExaminer
        preconditions:
          - "petition.status == SIGNATURES_FILED"
          - "no VerificationRound for this petition has status == OPEN"
        side_effects:
          - "creates a VerificationRound in OPEN that selects every eligible SignatureRecord"

      - from: SAMPLE_VERIFICATION
        to: FULL_CHECK
        trigger: "POST /verification-rounds/{round_id}/tally producing determination == FULL_CHECK_REQUIRED"
        actor: ElectionsExaminer
        preconditions:
          - "round.status == OPEN and round.petition_id == petition.id"
          - "every selected SignatureRecord of the round has validation_status != PENDING, else ERR_ROUND_HAS_PENDING_SIGNATURES"
        side_effects:
          - "closes the round and records determination, validity_rate_bps and projected_valid_count"
          - "sets petition.projected_valid_count from the round"

      - from: FULL_CHECK
        to: FULL_CHECK
        trigger: "POST /petitions/{petition_id}/verification-rounds with round_type == FULL_CHECK"
        actor: ElectionsExaminer
        preconditions:
          - "petition.status == FULL_CHECK"
          - "no VerificationRound for this petition has status == OPEN"
          - "the eligible pool is non-empty, else ERR_EMPTY_ELIGIBLE_POOL"
        side_effects:
          - "creates a VerificationRound in OPEN selecting every still-unexamined eligible line"
        note: "Self-transition. This is how the fork-join join edge on SignatureBatch (SAMPLED to FULLY_CHECKED) is reached after a RANDOM_SAMPLE round returned FULL_CHECK_REQUIRED."

      - from: CURE_PERIOD
        to: CURE_PERIOD
        trigger: "POST /petitions/{petition_id}/verification-rounds with round_type == CURE_RECHECK and a cure_period_id"
        actor: ElectionsExaminer
        preconditions:
          - "petition.status == CURE_PERIOD"
          - "cure_period_id names an OPEN CurePeriod of this petition"
          - "no VerificationRound for this petition has status == OPEN"
        side_effects:
          - "creates a CURE_RECHECK VerificationRound in OPEN selecting every still-unexamined eligible line, supplemental lines included"

      - from: SAMPLE_VERIFICATION
        to: PENDING_CERTIFICATION
        trigger: "POST /verification-rounds/{round_id}/tally producing determination == SUFFICIENT"
        actor: ElectionsExaminer
        preconditions:
          - "round.status == OPEN and round.round_type == RANDOM_SAMPLE"
          - "every selected SignatureRecord of the round has validation_status != PENDING"
        side_effects:
          - "sets petition.projected_valid_count from the round"

      - from: SAMPLE_VERIFICATION
        to: CURE_PERIOD
        trigger: "POST /verification-rounds/{round_id}/tally producing determination == INSUFFICIENT while the petition is cure-eligible"
        actor: ElectionsExaminer
        preconditions:
          - "standard.cure_allowed == true"
          - "petition.cure_period_count < MAX_CURE_PERIODS"
          - "round.projected_valid_count * 10000 >= petition.required_valid_signatures * standard.cure_eligibility_floor_bps"
        side_effects:
          - "sets petition.projected_valid_count from the round"

      - from: SAMPLE_VERIFICATION
        to: PENDING_FAILURE
        trigger: "POST /verification-rounds/{round_id}/tally producing determination == INSUFFICIENT while the petition is not cure-eligible"
        actor: ElectionsExaminer
        preconditions:
          - "standard.cure_allowed == false OR petition.cure_period_count == MAX_CURE_PERIODS OR the projection is below the cure eligibility floor"
        side_effects:
          - "sets petition.projected_valid_count from the round"

      - from: FULL_CHECK
        to: PENDING_CERTIFICATION
        trigger: "POST /verification-rounds/{round_id}/tally of a FULL_CHECK round producing determination == SUFFICIENT"
        actor: ElectionsExaminer
        preconditions:
          - "round.status == OPEN and round.round_type == FULL_CHECK"
          - "every selected SignatureRecord of the round has validation_status != PENDING"
        side_effects:
          - "sets petition.verified_valid_count and petition.projected_valid_count to the face-value valid count"
          - "recomputes petition.qualifying_county_count"

      - from: FULL_CHECK
        to: CURE_PERIOD
        trigger: "POST /verification-rounds/{round_id}/tally of a FULL_CHECK round producing determination == INSUFFICIENT while the petition is cure-eligible"
        actor: ElectionsExaminer
        preconditions:
          - "standard.cure_allowed == true and petition.cure_period_count < MAX_CURE_PERIODS and the face-value valid count is at or above the cure eligibility floor"
        side_effects:
          - "sets petition.verified_valid_count to the face-value valid count"

      - from: FULL_CHECK
        to: PENDING_FAILURE
        trigger: "POST /verification-rounds/{round_id}/tally of a FULL_CHECK round producing determination == INSUFFICIENT while the petition is not cure-eligible"
        actor: ElectionsExaminer
        preconditions:
          - "the petition fails at least one cure-eligibility condition"
        side_effects:
          - "sets petition.verified_valid_count to the face-value valid count"

      - from: CURE_PERIOD
        to: PENDING_CERTIFICATION
        trigger: "POST /verification-rounds/{round_id}/tally of a CURE_RECHECK round producing determination == SUFFICIENT"
        actor: ElectionsExaminer
        preconditions:
          - "round.round_type == CURE_RECHECK and round.cure_period_id is non-null"
        side_effects:
          - "sets the CurePeriod status to CLOSED_SUFFICIENT"
          - "sets petition.verified_valid_count to the face-value valid count across non-invalidated batches"

      - from: CURE_PERIOD
        to: CURE_PERIOD
        trigger: "POST /verification-rounds/{round_id}/tally of a CURE_RECHECK round producing determination == INSUFFICIENT while petition.cure_period_count < MAX_CURE_PERIODS"
        actor: ElectionsExaminer
        preconditions:
          - "round.round_type == CURE_RECHECK"
          - "the face-value valid count is at or above the cure eligibility floor"
        side_effects:
          - "sets the CurePeriod status to CLOSED_INSUFFICIENT"
          - "leaves petition.status at CURE_PERIOD so a second CurePeriod may be opened"
        note: "Second documented cycle on this dimension."

      - from: CURE_PERIOD
        to: PENDING_FAILURE
        trigger: "POST /verification-rounds/{round_id}/tally of a CURE_RECHECK round producing determination == INSUFFICIENT while petition.cure_period_count == MAX_CURE_PERIODS, or POST /cure-periods/{cure_period_id}/expire"
        actor: ElectionsExaminer | SosAdmin
        preconditions:
          - "for the expire path: logical clock >= cure_period.deadline_at and cure_period.status == OPEN"
        side_effects:
          - "sets the CurePeriod status to CLOSED_INSUFFICIENT or EXPIRED"

      - from: PENDING_CERTIFICATION
        to: CERTIFIED
        trigger: "POST /petitions/{petition_id}/determination with determination == CERTIFY"
        actor: SosAdmin | ElectionsExaminer
        preconditions:
          - "petition.status == PENDING_CERTIFICATION"
          - "petition.challenge_status not in {CHALLENGE_FILED, COURT_REVIEW}, else ERR_CHALLENGE_PENDING"
          - "no FraudReferral for this petition has status in {OPENED, REFERRED_TO_AG}, else ERR_FRAUD_REFERRAL_OPEN"
          - "petition.qualifying_county_count >= standard.required_qualifying_counties, else ERR_COUNTY_DISTRIBUTION_UNMET"
          - "X-User-ID != the tallied_by_examiner_id of the latest closed round, else ERR_SEGREGATION_OF_DUTIES"
        side_effects: []

      - from: PENDING_FAILURE
        to: FAILED
        trigger: "POST /petitions/{petition_id}/determination with determination == FAIL"
        actor: SosAdmin | ElectionsExaminer
        preconditions:
          - "petition.status == PENDING_FAILURE"
          - "petition.challenge_status not in {CHALLENGE_FILED, COURT_REVIEW}"
          - "X-User-ID != the tallied_by_examiner_id of the latest closed round"
        side_effects: []

      - from: PENDING_CERTIFICATION
        to: PENDING_FAILURE
        trigger: "POST /challenges/{challenge_id}/rule with ruling == REVERSE"
        actor: SosAdmin
        preconditions:
          - "challenge.status == COURT_REVIEW"
        side_effects:
          - "sets petition.challenge_status to COURT_REVERSED and challenge.status to UPHELD"

      - from: PENDING_FAILURE
        to: PENDING_CERTIFICATION
        trigger: "POST /challenges/{challenge_id}/rule with ruling == REVERSE"
        actor: SosAdmin
        preconditions:
          - "challenge.status == COURT_REVIEW"
        side_effects:
          - "sets petition.challenge_status to COURT_REVERSED and challenge.status to UPHELD"
        note: "The court ruling flips whichever pending determination the petition holds; it never writes a terminal status directly."

  - entity: Petition
    field: challenge_status
    initial_state: NONE
    terminal_states: [COURT_AFFIRMED, COURT_REVERSED]
    transitions:
      - from: NONE
        to: CHALLENGE_FILED
        trigger: "POST /petitions/{petition_id}/challenges"
        actor: Challenger
        preconditions:
          - "petition.status in {PENDING_CERTIFICATION, PENDING_FAILURE}, else ERR_CHALLENGE_WINDOW_CLOSED"
          - "petition.challenge_status == NONE, else ERR_CHALLENGE_ALREADY_FILED"
        side_effects:
          - "creates a Challenge in FILED with review_deadline_at = filed_at plus CHALLENGE_REVIEW_DAYS"
        note: "Runs on a dimension independent of petition.status; filing does not change petition.status, it only blocks the determination endpoint."

      - from: CHALLENGE_FILED
        to: COURT_REVIEW
        trigger: "POST /challenges/{challenge_id}/escalate"
        actor: Challenger
        preconditions:
          - "challenge.status == FILED"
          - "logical clock < challenge.review_deadline_at, else ERR_CHALLENGE_REVIEW_WINDOW_EXPIRED"
        side_effects:
          - "sets challenge.court_docket_number and challenge.status to COURT_REVIEW"

      - from: CHALLENGE_FILED
        to: NONE
        trigger: "POST /challenges/{challenge_id}/dismiss"
        actor: SosAdmin
        preconditions:
          - "challenge.status == FILED"
        side_effects:
          - "sets challenge.status to DISMISSED"
        note: "Returns the dimension to NONE, which re-opens the determination endpoint and permits a further challenge."

      - from: COURT_REVIEW
        to: COURT_AFFIRMED
        trigger: "POST /challenges/{challenge_id}/rule with ruling == AFFIRM"
        actor: SosAdmin
        preconditions:
          - "challenge.status == COURT_REVIEW"
        side_effects:
          - "sets challenge.ruling to AFFIRM and challenge.status to DISMISSED"
          - "leaves petition.status unchanged"

      - from: COURT_REVIEW
        to: COURT_REVERSED
        trigger: "POST /challenges/{challenge_id}/rule with ruling == REVERSE"
        actor: SosAdmin
        preconditions:
          - "challenge.status == COURT_REVIEW"
        side_effects:
          - "sets challenge.ruling to REVERSE and challenge.status to UPHELD"
          - "flips petition.status between PENDING_CERTIFICATION and PENDING_FAILURE"

  - entity: Circulator
    field: registration_status
    initial_state: PENDING_TRAINING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_TRAINING
        to: TRAINED
        trigger: "POST /circulators/{circulator_id}/training"
        actor: SosAdmin | CirculatorAgent
        preconditions:
          - "circulator.registration_status == PENDING_TRAINING"
          - "training_course_code is one of APPROVED_TRAINING_COURSES, else ERR_TRAINING_COURSE_NOT_APPROVED"
        side_effects:
          - "sets training_course_code and training_completed_at to the logical clock"

      - from: TRAINED
        to: REGISTERED
        trigger: "POST /circulators/{circulator_id}/affidavit"
        actor: CirculatorAgent
        preconditions:
          - "circulator.registration_status == TRAINED, else ERR_TRAINING_NOT_COMPLETE"
          - "circulator.paid_disclosure_on_file == true, else ERR_PAID_DISCLOSURE_MISSING"
          - "sworn == true, else ERR_AFFIDAVIT_NOT_SWORN"
        side_effects:
          - "sets affidavit_filed_at to the logical clock"

      - from: REGISTERED
        to: SUSPENDED
        trigger: "POST /circulators/{circulator_id}/suspend, or the substantiation cascade of POST /fraud-referrals/{referral_id}/adjudicate"
        actor: SosAdmin | system
        preconditions:
          - "circulator.registration_status == REGISTERED"
        side_effects:
          - "sets every ACTIVE CirculationAssignment of this circulator to SUSPENDED"
          - "leaves every existing SignatureBatch status untouched"
        note: "Conditional cascade: suspension touches assignments only, unlike revocation which reaches batches and records."

      - from: SUSPENDED
        to: REGISTERED
        trigger: "POST /circulators/{circulator_id}/reinstate"
        actor: SosAdmin
        preconditions:
          - "circulator.registration_status == SUSPENDED"
          - "circulator.misconduct_strike_count < MISCONDUCT_SUSPENSION_THRESHOLD, else ERR_CIRCULATOR_REINSTATEMENT_BARRED"
        side_effects:
          - "sets every SUSPENDED CirculationAssignment of this circulator back to ACTIVE"

      - from: PENDING_TRAINING
        to: REVOKED
        trigger: "POST /circulators/{circulator_id}/revoke"
        actor: SosAdmin
        preconditions:
          - "circulator.registration_status != REVOKED"
        side_effects:
          - "sets every non-TERMINATED CirculationAssignment of this circulator to TERMINATED"

      - from: TRAINED
        to: REVOKED
        trigger: "POST /circulators/{circulator_id}/revoke"
        actor: SosAdmin
        preconditions:
          - "circulator.registration_status != REVOKED"
        side_effects:
          - "sets every non-TERMINATED CirculationAssignment of this circulator to TERMINATED"

      - from: REGISTERED
        to: REVOKED
        trigger: "POST /circulators/{circulator_id}/revoke"
        actor: SosAdmin
        preconditions:
          - "circulator.registration_status != REVOKED"
        side_effects:
          - "sets every non-TERMINATED CirculationAssignment of this circulator to TERMINATED"
          - "sets every SignatureBatch of those assignments whose status is not in {REJECTED_FORMAT, INVALIDATED} to INVALIDATED, recording status_before_invalidation"
          - "sets every non-VOIDED SignatureRecord of those batches to VOIDED with void_reason CIRCULATOR_REVOKED, recording status_before_void"
          - "recomputes accepted_raw_total, projected_valid_count, verified_valid_count, voided_signature_count and qualifying_county_count on each affected Petition"
        note: "Four-level cascade: Circulator to CirculationAssignment to SignatureBatch to SignatureRecord, with a fifth level of derived-field reconciliation on Petition."

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /circulators/{circulator_id}/revoke"
        actor: SosAdmin
        preconditions:
          - "circulator.registration_status != REVOKED"
        side_effects:
          - "identical cascade to the REGISTERED to REVOKED transition"

  - entity: CirculationAssignment
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "cascade of POST /circulators/{circulator_id}/suspend"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "blocks POST /signature-batches for this assignment while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "cascade of POST /circulators/{circulator_id}/reinstate"
        actor: system
        preconditions:
          - "assignment.status == SUSPENDED"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /circulation-assignments/{assignment_id}/terminate, or the revoke cascade"
        actor: SosAdmin | Proponent | system
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "releases the assignment occupation interval on the circulator so a new overlapping assignment becomes admissible"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /circulation-assignments/{assignment_id}/terminate, or the revoke cascade"
        actor: SosAdmin | Proponent | system
        preconditions:
          - "assignment.status == SUSPENDED"
        side_effects:
          - "releases the assignment occupation interval on the circulator"

  - entity: SignatureBatch
    field: status
    initial_state: RECEIVED
    terminal_states: [REJECTED_FORMAT]
    transitions:
      - from: RECEIVED
        to: AFFIDAVIT_VERIFIED
        trigger: "POST /signature-batches/{batch_id}/verify-affidavit with at least one line surviving"
        actor: CountyClerk
        preconditions:
          - "batch.status == RECEIVED"
          - "batch.raw_count >= 1, else ERR_BATCH_EMPTY"
          - "every entry of format_defect_line_numbers matches a SignatureRecord line_number in this batch, else ERR_LINE_NUMBER_NOT_FOUND"
        side_effects:
          - "sets validation_status INVALID_FORMAT_DEFECT on each listed line and sets format_defect_count"
          - "sets accepted_raw_count to raw_count minus format_defect_count"
          - "sets affidavit_notary_id"
          - "recomputes petition.raw_signature_count and petition.accepted_raw_total"

      - from: RECEIVED
        to: REJECTED_FORMAT
        trigger: "POST /signature-batches/{batch_id}/verify-affidavit where format_defect_line_numbers covers every line"
        actor: CountyClerk
        preconditions:
          - "batch.status == RECEIVED"
          - "len(format_defect_line_numbers) == batch.raw_count"
        side_effects:
          - "sets accepted_raw_count to 0 and excludes the batch from every eligible pool"
        note: "Terminal. The batch keeps its INVALID_FORMAT_DEFECT lines so raw_signature_count still counts them while accepted_raw_total does not."

      - from: AFFIDAVIT_VERIFIED
        to: SAMPLED
        trigger: "POST /verification-rounds/{round_id}/tally of a RANDOM_SAMPLE round that selected at least one line of this batch"
        actor: ElectionsExaminer
        preconditions:
          - "batch.status == AFFIDAVIT_VERIFIED"
        side_effects:
          - "sets batch.checked_signature_count and batch.verification_cost_cents via calculations.batch_verification_cost"
          - "adds the batch cost delta to petition.verification_cost_accrued_cents and to round.accrued_cost_cents"

      - from: AFFIDAVIT_VERIFIED
        to: FULLY_CHECKED
        trigger: "POST /verification-rounds/{round_id}/tally of a FULL_CHECK or CURE_RECHECK round covering every remaining line of this batch"
        actor: ElectionsExaminer
        preconditions:
          - "batch.status == AFFIDAVIT_VERIFIED"
        side_effects:
          - "sets batch.checked_signature_count and batch.verification_cost_cents"
          - "adds the batch cost delta to petition.verification_cost_accrued_cents and to round.accrued_cost_cents"

      - from: SAMPLED
        to: FULLY_CHECKED
        trigger: "POST /verification-rounds/{round_id}/tally of a FULL_CHECK round covering the batch's remaining lines"
        actor: ElectionsExaminer
        preconditions:
          - "batch.status == SAMPLED"
        side_effects:
          - "recomputes batch.checked_signature_count and batch.verification_cost_cents and adds only the delta to the petition ledger"
        note: "Join point of the fork-join diamond; the cost ledger must move by the delta, never by the full recomputed amount."

      - from: AFFIDAVIT_VERIFIED
        to: INVALIDATED
        trigger: "POST /signature-batches/{batch_id}/invalidate, the revoke cascade, or the fraud substantiation cascade"
        actor: SosAdmin | system
        preconditions:
          - "batch.status not in {REJECTED_FORMAT, INVALIDATED}, else ERR_BATCH_ALREADY_TERMINAL"
        side_effects:
          - "records status_before_invalidation and invalidation_reason"
          - "sets every non-VOIDED line to VOIDED with status_before_void recorded"
          - "sets accepted_raw_count to 0 and subtracts the stored verification_cost_cents from petition.verification_cost_accrued_cents"
          - "recomputes petition.accepted_raw_total, verified_valid_count, projected_valid_count, voided_signature_count and qualifying_county_count"

      - from: SAMPLED
        to: INVALIDATED
        trigger: "POST /signature-batches/{batch_id}/invalidate, the revoke cascade, or the fraud substantiation cascade"
        actor: SosAdmin | system
        preconditions:
          - "batch.status not in {REJECTED_FORMAT, INVALIDATED}"
        side_effects:
          - "identical to the AFFIDAVIT_VERIFIED to INVALIDATED side effects"

      - from: FULLY_CHECKED
        to: INVALIDATED
        trigger: "POST /signature-batches/{batch_id}/invalidate, the revoke cascade, or the fraud substantiation cascade"
        actor: SosAdmin | system
        preconditions:
          - "batch.status not in {REJECTED_FORMAT, INVALIDATED}"
        side_effects:
          - "identical to the AFFIDAVIT_VERIFIED to INVALIDATED side effects"

      - from: INVALIDATED
        to: AFFIDAVIT_VERIFIED
        trigger: "POST /signature-batches/{batch_id}/reinstate where status_before_invalidation == AFFIDAVIT_VERIFIED"
        actor: SosAdmin
        preconditions:
          - "batch.status == INVALIDATED"
          - "the batch circulator's registration_status != REVOKED, else ERR_CIRCULATOR_REVOKED"
          - "no FraudReferral naming this batch has status == SUBSTANTIATED, else ERR_FRAUD_SUBSTANTIATED_BATCH"
        side_effects:
          - "restores batch.status from status_before_invalidation and clears it"
          - "restores every line's validation_status from status_before_void and clears status_before_void and void_reason"
          - "adds the stored verification_cost_cents back to petition.verification_cost_accrued_cents"
          - "recomputes petition.accepted_raw_total, verified_valid_count, projected_valid_count, voided_signature_count and qualifying_county_count"
        note: "Compensation. Every side effect of invalidation is reversed exactly, leaving no drift in either the signature ledger or the cost ledger."

      - from: INVALIDATED
        to: SAMPLED
        trigger: "POST /signature-batches/{batch_id}/reinstate where status_before_invalidation == SAMPLED"
        actor: SosAdmin
        preconditions:
          - "batch.status == INVALIDATED"
        side_effects:
          - "identical compensation to the INVALIDATED to AFFIDAVIT_VERIFIED transition"

      - from: INVALIDATED
        to: FULLY_CHECKED
        trigger: "POST /signature-batches/{batch_id}/reinstate where status_before_invalidation == FULLY_CHECKED"
        actor: SosAdmin
        preconditions:
          - "batch.status == INVALIDATED"
        side_effects:
          - "identical compensation to the INVALIDATED to AFFIDAVIT_VERIFIED transition"

  - entity: SignatureRecord
    field: validation_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: INVALID_FORMAT_DEFECT
        trigger: "POST /signature-batches/{batch_id}/verify-affidavit listing this line in format_defect_line_numbers"
        actor: CountyClerk
        preconditions:
          - "batch.status == RECEIVED"
        side_effects:
          - "excludes the line from every eligible pool and from checked_signature_count"

      - from: PENDING
        to: VALID
        trigger: "POST /signature-records/{signature_record_id}/validate"
        actor: CountyClerk
        preconditions:
          - "record.in_sample == true and record.validated_in_round_id names an OPEN round, else ERR_SIGNATURE_NOT_IN_OPEN_ROUND"
          - "claimed_voter_id_number resolves to a VoterRecord"
          - "that VoterRecord.registration_status == ACTIVE"
          - "that VoterRecord.county_id == batch.county_id"
          - "signature_hash == VoterRecord.signature_on_file_hash, or manual_match_override == true"
          - "no earlier-ranked non-struck record for the same petition claims the same voter"
        side_effects:
          - "sets matched_voter_record_id"

      - from: PENDING
        to: INVALID_NOT_REGISTERED
        trigger: "POST /signature-records/{signature_record_id}/validate where the claimed voter is absent from the roll or not ACTIVE"
        actor: CountyClerk
        preconditions:
          - "record.in_sample == true and its round is OPEN"
        side_effects:
          - "sets matched_voter_record_id when a non-ACTIVE VoterRecord was found, leaves it null when no roll entry exists"

      - from: PENDING
        to: INVALID_WRONG_COUNTY
        trigger: "POST /signature-records/{signature_record_id}/validate where the matched voter is registered in another county"
        actor: CountyClerk
        preconditions:
          - "record.in_sample == true and its round is OPEN"
        side_effects:
          - "sets matched_voter_record_id"

      - from: PENDING
        to: INVALID_SIGNATURE_MISMATCH
        trigger: "POST /signature-records/{signature_record_id}/validate where signature_hash differs from the exemplar and manual_match_override is absent or false"
        actor: CountyClerk
        preconditions:
          - "record.in_sample == true and its round is OPEN"
        side_effects:
          - "sets matched_voter_record_id"

      - from: PENDING
        to: INVALID_DUPLICATE
        trigger: "POST /signature-records/{signature_record_id}/validate where a better-ranked record for the same petition claims the same voter"
        actor: CountyClerk
        preconditions:
          - "record.in_sample == true and its round is OPEN"
        side_effects:
          - "sets matched_voter_record_id and duplicate_of_signature_id to the keeper chosen by calculations.duplicate_keeper_selection"

      - from: VALID
        to: VOIDED
        trigger: "batch invalidation, circulator revocation, or fraud substantiation"
        actor: system
        preconditions:
          - "record.validation_status != VOIDED"
        side_effects:
          - "records status_before_void and void_reason and decrements the petition signature ledger"

      - from: INVALID_NOT_REGISTERED
        to: VOIDED
        trigger: "batch invalidation, circulator revocation, or fraud substantiation"
        actor: system
        preconditions:
          - "record.validation_status != VOIDED"
        side_effects:
          - "records status_before_void and void_reason"

      - from: INVALID_DUPLICATE | INVALID_SIGNATURE_MISMATCH | INVALID_WRONG_COUNTY | INVALID_FORMAT_DEFECT
        to: VOIDED
        trigger: "batch invalidation, circulator revocation, or fraud substantiation"
        actor: system
        preconditions:
          - "record.validation_status != VOIDED"
        side_effects:
          - "records status_before_void and void_reason; a line struck as INVALID_FORMAT_DEFECT returns to INVALID_FORMAT_DEFECT on reinstatement"

      - from: PENDING
        to: VOIDED
        trigger: "batch invalidation, circulator revocation, or fraud substantiation of a batch whose lines were never examined"
        actor: system
        preconditions:
          - "record.validation_status == PENDING"
        side_effects:
          - "records status_before_void PENDING and void_reason, so batch reinstatement returns the line to PENDING and it re-enters later eligible pools"

      - from: VOIDED
        to: VALID
        trigger: "POST /signature-batches/{batch_id}/reinstate where status_before_void == VALID"
        actor: SosAdmin
        preconditions:
          - "record.void_reason == BATCH_INVALIDATED"
        side_effects:
          - "clears status_before_void and void_reason and re-increments the petition signature ledger"
        note: "Fraud-substantiated and revocation voids are not reinstatable; only BATCH_INVALIDATED voids compensate."

      - from: VOIDED
        to: PENDING | INVALID_NOT_REGISTERED | INVALID_DUPLICATE | INVALID_SIGNATURE_MISMATCH | INVALID_WRONG_COUNTY | INVALID_FORMAT_DEFECT
        trigger: "POST /signature-batches/{batch_id}/reinstate, restoring status_before_void verbatim"
        actor: SosAdmin
        preconditions:
          - "record.void_reason == BATCH_INVALIDATED"
        side_effects:
          - "clears status_before_void and void_reason; a line restored to PENDING becomes eligible for a later round again"

  - entity: VerificationRound
    field: status
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /verification-rounds/{round_id}/tally"
        actor: ElectionsExaminer
        preconditions:
          - "round.status == OPEN"
          - "every selected line has validation_status != PENDING, else ERR_ROUND_HAS_PENDING_SIGNATURES"
        side_effects:
          - "computes sampled_valid_count, validity_rate_bps, projected_valid_count and determination"
          - "sets tallied_by_examiner_id to the acting X-User-ID"
          - "advances the batches it touched and accrues the county cost deltas"
          - "advances petition.status per the determination"

      - from: OPEN
        to: VOIDED
        trigger: "POST /verification-rounds/{round_id}/void"
        actor: SosAdmin
        preconditions:
          - "round.status == OPEN"
        side_effects:
          - "clears in_sample and validated_in_round_id on every line the round selected and resets those lines to PENDING"
          - "restores every batch the round touched to the status it held before the round and resets that batch's stored verification_cost_cents to 0"
          - "subtracts round.accrued_cost_cents from petition.verification_cost_accrued_cents"
          - "returns petition.status to SIGNATURES_FILED when no other CLOSED round exists"

      - from: CLOSED
        to: VOIDED
        trigger: "POST /verification-rounds/{round_id}/void"
        actor: SosAdmin
        preconditions:
          - "round.status == CLOSED"
          - "petition.status not in {CERTIFIED, FAILED}, else ERR_INVALID_PETITION_STATE"
        side_effects:
          - "identical compensation to the OPEN to VOIDED transition"
          - "recomputes petition.projected_valid_count and petition.verified_valid_count from the new latest closed round, or 0 when none remains"

  - entity: CurePeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED_SUFFICIENT, CLOSED_INSUFFICIENT, EXPIRED]
    transitions:
      - from: OPEN
        to: CLOSED_SUFFICIENT
        trigger: "POST /verification-rounds/{round_id}/tally of the CURE_RECHECK round naming this cure period, determination SUFFICIENT"
        actor: ElectionsExaminer
        preconditions:
          - "cure_period.status == OPEN"
        side_effects:
          - "moves petition.status to PENDING_CERTIFICATION"
      - from: OPEN
        to: CLOSED_INSUFFICIENT
        trigger: "POST /verification-rounds/{round_id}/tally of the CURE_RECHECK round naming this cure period, determination INSUFFICIENT"
        actor: ElectionsExaminer
        preconditions:
          - "cure_period.status == OPEN"
        side_effects:
          - "leaves petition.status at CURE_PERIOD when another cure period is still permitted, otherwise moves it to PENDING_FAILURE"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /cure-periods/{cure_period_id}/expire"
        actor: SosAdmin
        preconditions:
          - "cure_period.status == OPEN"
          - "logical clock >= cure_period.deadline_at, else ERR_CURE_PERIOD_NOT_EXPIRED"
        side_effects:
          - "moves petition.status to PENDING_FAILURE"
          - "rejects any later supplemental batch naming this cure period"

  - entity: Challenge
    field: status
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: COURT_REVIEW
        trigger: "POST /challenges/{challenge_id}/escalate"
        actor: Challenger
        preconditions:
          - "challenge.status == FILED"
          - "logical clock < challenge.review_deadline_at"
          - "X-User-ID == challenge.challenger_user_id, else ERR_NOT_CHALLENGE_OWNER"
        side_effects:
          - "sets court_docket_number and petition.challenge_status to COURT_REVIEW"
      - from: COURT_REVIEW
        to: UPHELD
        trigger: "POST /challenges/{challenge_id}/rule with ruling == REVERSE"
        actor: SosAdmin
        preconditions:
          - "challenge.status == COURT_REVIEW"
        side_effects:
          - "flips the petition pending determination and sets petition.challenge_status to COURT_REVERSED"
      - from: COURT_REVIEW
        to: DISMISSED
        trigger: "POST /challenges/{challenge_id}/rule with ruling == AFFIRM"
        actor: SosAdmin
        preconditions:
          - "challenge.status == COURT_REVIEW"
        side_effects:
          - "sets petition.challenge_status to COURT_AFFIRMED"
      - from: FILED
        to: DISMISSED
        trigger: "POST /challenges/{challenge_id}/dismiss"
        actor: SosAdmin
        preconditions:
          - "challenge.status == FILED"
        side_effects:
          - "sets petition.challenge_status back to NONE"

  - entity: FraudReferral
    field: status
    initial_state: OPENED
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: OPENED
        to: REFERRED_TO_AG
        trigger: "POST /fraud-referrals/{referral_id}/refer-to-ag"
        actor: ElectionsExaminer | SosAdmin
        preconditions:
          - "referral.status == OPENED"
        side_effects:
          - "sets referred_to_ag to true"
      - from: REFERRED_TO_AG
        to: UNSUBSTANTIATED
        trigger: "POST /fraud-referrals/{referral_id}/adjudicate with finding == UNSUBSTANTIATED"
        actor: ElectionsExaminer | SosAdmin
        preconditions:
          - "referral.status == REFERRED_TO_AG, else ERR_REFERRAL_NOT_WITH_AG"
          - "X-User-ID != referral.opened_by_examiner_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets finding and adjudicated_by_examiner_id; no cascade"
      - from: REFERRED_TO_AG
        to: SUBSTANTIATED
        trigger: "POST /fraud-referrals/{referral_id}/adjudicate with finding == SUBSTANTIATED"
        actor: ElectionsExaminer | SosAdmin
        preconditions:
          - "referral.status == REFERRED_TO_AG"
          - "X-User-ID != referral.opened_by_examiner_id"
        side_effects:
          - "when batch_id is non-null, sets that batch to INVALIDATED and every non-VOIDED line to VOIDED with void_reason FRAUD_SUBSTANTIATED, recording referral.voided_signature_count"
          - "increments circulator.misconduct_strike_count and recomputes circulator.credibility_score_bps with the adjudicated variant"
          - "sets the circulator to SUSPENDED once misconduct_strike_count >= MISCONDUCT_SUSPENSION_THRESHOLD, which in turn suspends its ACTIVE assignments"
          - "recomputes the affected petition ledgers"
        note: "Four-level cascade: FraudReferral to SignatureBatch to SignatureRecord and FraudReferral to Circulator to CirculationAssignment."

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: title-summary-stale-petition
    parent_entity: Petition
    write_endpoint: "PUT /petitions/{petition_id}/title-summary"
    occ_field: "expected_petition_version"
    description: |
      Preparing an official title and summary for a Petition whose version has
      advanced since the client last read it is rejected. A revised title
      legitimately supersedes the previously prepared one while the petition sits
      in TITLE_PENDING, so no state precondition can distinguish a writer working
      from a stale view; the stale expected_petition_version is the only signal.
    error_id: ERR_STALE_PETITION_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-circulator
    parent_entity: Circulator
    write_endpoint: "POST /circulation-assignments"
    occ_field: "expected_circulator_version"
    description: |
      Creating a CirculationAssignment against a Circulator whose version has
      advanced since the client last read it is rejected. A circulator may hold
      several assignments across petitions and non-overlapping windows, so a
      further create is legitimate under the product rules and cannot be refused
      by any state precondition; rejection rests solely on the stale
      expected_circulator_version.
    error_id: ERR_STALE_CIRCULATOR_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: required_valid_signature_threshold
    trigger: "POST /petitions/{petition_id}/clear-for-circulation; frozen on petition.required_valid_signatures thereafter"
    algorithm: threshold
    formula: |
      standard = VerificationStandard(petition.standard_id)
      required_valid_signatures =
          ceil(standard.gubernatorial_vote_total * standard.signature_pct_bps / 10000)
    input_set: "Exactly one VerificationStandard, resolved through petition.standard_id at clearance time. Later edits to the standard never move an already-cleared petition's threshold."
    constants:
      MAX_FORMAT_REVIEW_ROUNDS: 2
      CHALLENGE_REVIEW_DAYS: 15
      ASSIGNMENT_BUFFER_DAYS: 3
      MISCONDUCT_SUSPENSION_THRESHOLD: 1
      APPROVED_TRAINING_COURSES: ["SOS-CIRC-101", "SOS-CIRC-201"]
    precision: "integer cents-free count, ceil (a fractional signature always rounds up)"
    note: "The constants block above is the scaffold's single source of truth for the statutory gates referenced by §1.2 and §1.4, not only by this formula."

  - name: petition_raw_and_accepted_counts
    trigger: "POST /petitions/{petition_id}/file-signatures, POST /signature-batches/{batch_id}/signatures, POST /signature-batches/{batch_id}/verify-affidavit, batch invalidate/reinstate, and every cascade that changes a batch status"
    algorithm: aggregation
    formula: |
      raw_signature_count =
          sum(b.raw_count for b in batches(petition) if b.status != "INVALIDATED")
      accepted_raw_total =
          sum(b.accepted_raw_count for b in batches(petition)
              if b.status in {"AFFIDAVIT_VERIFIED", "SAMPLED", "FULLY_CHECKED"})
      voided_signature_count =
          count(r for r in records(petition) if r.validation_status == "VOIDED")
    input_set: "All SignatureBatch rows of the petition. REJECTED_FORMAT batches still contribute to raw_signature_count (the sheets were physically filed) but contribute 0 to accepted_raw_total. INVALIDATED batches contribute to neither."
    constants: {}
    precision: "integer counts; recomputed in full on every trigger, never incrementally patched"
    note: "accepted_raw_total is the conserved quantity of the signature_count_ledger invariant: invalidate then reinstate must return it to the identical value."

  - name: sample_selection
    trigger: "POST /petitions/{petition_id}/verification-rounds"
    algorithm: chronological
    formula: |
      # 1. Build the eligible pool.
      if round_type in {"RANDOM_SAMPLE", "FULL_CHECK"}:
          pool = [r for r in records(petition)
                  if r.batch.status in {"AFFIDAVIT_VERIFIED", "SAMPLED", "FULLY_CHECKED"}
                  and r.batch.is_supplemental == false
                  and r.validation_status == "PENDING"
                  and r.validated_in_round_id is null]
      else:   # CURE_RECHECK
          pool = [r for r in records(petition)
                  if r.batch.status in {"AFFIDAVIT_VERIFIED", "SAMPLED", "FULLY_CHECKED"}
                  and r.validation_status == "PENDING"
                  and r.validated_in_round_id is null]

      # 2. Pin the pool order (no random draw, no id anywhere).
      pool.sort(key = (r.signed_on ASC,
                       County(r.batch.county_id).county_code ASC,
                       r.batch.filed_at ASC,
                       r.line_number ASC))
      N = len(pool)
      eligible_pool_size = N

      # 3. Size the draw.
      if round_type == "RANDOM_SAMPLE":
          size = min(N, max(standard.sample_min_count,
                            ceil(N * standard.sample_pct_bps / 10000)))
      else:
          size = N

      # 4. Systematic interval draw (POOLED shape).
      k = floor(N / size)                       # size >= 1 whenever N >= 1
      selected = [pool[i * k] for i in 0 .. size - 1]

      # 5. STRATIFIED shape: repeat steps 2-4 inside each county stratum,
      #    strata visited in county_code ASC order, then concatenate.
      sample_size = len(selected)
    input_set: "SignatureRecord rows of the petition still PENDING and not yet claimed by any round. A RANDOM_SAMPLE or FULL_CHECK round never reaches supplemental batches; a CURE_RECHECK round reaches both supplemental and any still-unexamined ordinary lines. An empty pool is rejected with ERR_EMPTY_ELIGIBLE_POOL."
    constants: {}
    precision: "integer indices; ceil on the size, floor on the interval k"
    variants:
      - name: pooled_draw
        when: "standard.stratification_mode == POOLED"
        difference: "One draw across the whole petition-level pool; size is computed once from N."
      - name: stratified_draw
        when: "standard.stratification_mode == STRATIFIED"
        difference: "The pool is partitioned by county_code and a separate size and interval are computed per stratum, so sample_min_count is applied once per county rather than once per petition. For a pool of 2 lines per county with sample_pct_bps 5000 and sample_min_count 2, POOLED draws 2 lines in total while STRATIFIED draws 4."
    note: "Selection is fully determined by (signed_on, county_code, batch.filed_at, line_number). No UUID or random id participates in the draw, the ordering, or any tie-break."

  - name: sample_projection
    trigger: "POST /verification-rounds/{round_id}/tally, and every recompute of petition.projected_valid_count after accepted_raw_total changes"
    algorithm: projection
    formula: |
      # latest_closed_round(petition) := the VerificationRound of this petition
      #   with status == CLOSED, ranked by (round_index DESC, created_at DESC),
      #   first element; null when none exists.

      sampled_valid_count = count(r in round.selected if r.validation_status == "VALID")
      validity_rate_bps   = floor(sampled_valid_count * 10000 / round.sample_size)

      if round.round_type == "RANDOM_SAMPLE":
          # POOLED
          projected_valid_count =
              floor(petition.accepted_raw_total * validity_rate_bps / 10000)
          # STRATIFIED
          projected_valid_count = sum over strata c in county_code ASC of
              floor(accepted_raw_total_of_county(c)
                    * floor(valid_c * 10000 / size_c) / 10000)
      else:
          # FULL_CHECK and CURE_RECHECK are face-value, not projected.
          projected_valid_count = count(r in records(petition)
              if r.validation_status == "VALID"
              and r.batch.status in {"AFFIDAVIT_VERIFIED","SAMPLED","FULLY_CHECKED"})
          verified_valid_count = projected_valid_count
    input_set: "For a RANDOM_SAMPLE round: only the lines that round selected, plus petition.accepted_raw_total as the extrapolation base. For FULL_CHECK and CURE_RECHECK: every VALID line across the petition's non-invalidated batches, supplemental batches included."
    constants: {}
    precision: "basis points as integers; floor at every step, including inside each stratum before summing"
    variants:
      - name: pooled_projection
        when: "standard.stratification_mode == POOLED"
        difference: "A single petition-wide validity rate is extrapolated over accepted_raw_total, so a county with a poor validity rate is diluted by better counties."
      - name: stratified_projection
        when: "standard.stratification_mode == STRATIFIED"
        difference: "Each county's own rate is extrapolated over that county's accepted lines and the per-county projections are summed, so a poor county drags only its own share. For identical data (2 accepted lines in each of two counties, one invalid line in the first) POOLED yields 4 and STRATIFIED yields 3."
    note: "round.validity_rate_bps is always the round-level rate even under stratified_projection, so the audit field and the projection can legitimately disagree."

  - name: sufficiency_band_determination
    trigger: "POST /verification-rounds/{round_id}/tally, immediately after sample_projection"
    algorithm: threshold
    formula: |
      required = petition.required_valid_signatures
      upper_gate = ceil(required * standard.sufficiency_upper_bps / 10000)
      lower_gate = floor(required * standard.sufficiency_lower_bps / 10000)

      if round.round_type == "RANDOM_SAMPLE":
          if projected_valid_count >= upper_gate:  determination = "SUFFICIENT"
          elif projected_valid_count <= lower_gate: determination = "INSUFFICIENT"
          else:                                    determination = "FULL_CHECK_REQUIRED"
      else:
          determination = "SUFFICIENT" if projected_valid_count >= required
                          else "INSUFFICIENT"

      cure_eligible =
          standard.cure_allowed
          and petition.cure_period_count < MAX_CURE_PERIODS
          and projected_valid_count * 10000
              >= required * standard.cure_eligibility_floor_bps
    input_set: "The round just tallied plus the petition's frozen required_valid_signatures and its standard's three band parameters."
    constants:
      MAX_CURE_PERIODS: 2
    precision: "ceil on the upper gate, floor on the lower gate; both comparisons are inclusive, so a projection exactly equal to the lower gate is INSUFFICIENT and one exactly equal to the upper gate is SUFFICIENT"
    note: "FULL_CHECK and CURE_RECHECK rounds have no middle band; only RANDOM_SAMPLE can return FULL_CHECK_REQUIRED."

  - name: duplicate_keeper_selection
    trigger: "POST /signature-records/{signature_record_id}/validate, after the registration, county and signature-comparison checks have passed"
    algorithm: chronological
    formula: |
      candidates = [r for r in records(petition)
                    if r.matched_voter_record_id == this.matched_voter_record_id
                    and r.validation_status in {"PENDING", "VALID"}
                    and r.batch.status not in {"REJECTED_FORMAT", "INVALIDATED"}]
      candidates.sort(key = (r.signed_on ASC,
                             r.batch.filed_at ASC,
                             r.line_number ASC))
      keeper = candidates[0]
      if keeper.id == this.id:
          validation_status = "VALID"
      else:
          validation_status = "INVALID_DUPLICATE"
          duplicate_of_signature_id = keeper.id
    input_set: "Every line of the petition claiming the same VoterRecord whose validation_status is still PENDING or already VALID, across counties and batches. Lines already struck as INVALID_FORMAT_DEFECT, already resolved to another INVALID_ reason, or sitting in a REJECTED_FORMAT or INVALIDATED batch are excluded, which is what makes the outcome independent of the order in which the clerk validates the two lines."
    constants: {}
    precision: "exact ranking on (signed_on, batch.filed_at, line_number); ties beyond that triple are impossible because line_number is unique within a batch and only one batch can carry a given filed_at for a given county pair"
    note: "The keeper is never chosen by id. Duplicate detection runs last in the per-line check cascade, so a line that is both unregistered and duplicated reports INVALID_NOT_REGISTERED."

  - name: county_distribution_compliance
    trigger: "POST /petitions/{petition_id}/file-signatures, POST /verification-rounds/{round_id}/tally, every batch invalidate/reinstate, and GET /petitions/{petition_id}/distribution-report"
    algorithm: threshold
    formula: |
      for each County c having at least one batch of this petition with
          status in {"AFFIDAVIT_VERIFIED", "SAMPLED", "FULLY_CHECKED"}:

        county_minimum = ceil(c.registered_voter_count
                              * standard.county_distribution_pct_bps / 10000)

        if latest_closed_round(petition) is null:
            county_credited = 0
        elif latest_closed_round.round_type == "RANDOM_SAMPLE":
            rate = stratum rate of c when the standard is STRATIFIED,
                   else latest_closed_round.validity_rate_bps
            county_credited = floor(accepted_raw_total_of_county(c) * rate / 10000)
        else:
            county_credited = count(VALID lines of this petition in county c)

        c qualifies iff county_credited >= county_minimum

      qualifying_county_count = number of qualifying counties
    input_set: "Counties reachable from the petition's non-terminal batches only. A county whose only batch is REJECTED_FORMAT or INVALIDATED drops out of the numerator and out the denominator alike."
    constants: {}
    precision: "ceil on the county minimum, floor on the credited projection; comparison is >= so a county exactly at its minimum qualifies"
    note: "Certification is gated on qualifying_county_count >= standard.required_qualifying_counties, so invalidating a single batch can un-qualify a county and block a petition that already reached its statewide total."

  - name: batch_verification_cost
    trigger: "POST /verification-rounds/{round_id}/tally, for each batch the round touched"
    algorithm: aggregation
    formula: |
      checked_signature_count = count(r in batch.records
          if r.validation_status not in {"PENDING", "INVALID_FORMAT_DEFECT"})

      verification_cost_cents = round_half_up(
          checked_signature_count
          * standard.verification_rate_millicents_per_signature / 1000)

      # Ledger move is always a delta against the stored value.
      delta = new verification_cost_cents - stored verification_cost_cents
      petition.verification_cost_accrued_cents += delta
      round.accrued_cost_cents               += delta
    input_set: "Only lines of that one batch, and only lines actually examined. Format-defect lines were struck before any examination and are never billed."
    constants: {}
    precision: "millicents divided by 1000 to cents, round_half_up, applied ONCE PER BATCH and only then summed. At a rate of 4750 millicents the per-batch amounts are 1 line -> 5, 2 lines -> 10, 3 lines -> 14, 4 lines -> 19 cents; two batches of 2 lines therefore accrue 20 cents, whereas rounding the 4-line total in one step would yield 19."
    note: "verification_cost_cents is stored so that invalidation subtracts exactly what was added and reinstatement adds exactly what was subtracted. This is the conserved quantity of the verification_cost_ledger invariant."

  - name: county_reimbursement_invoice
    trigger: "GET /petitions/{petition_id}/verification-invoice"
    algorithm: tiered_pricing
    formula: |
      gross_cents = sum(b.verification_cost_cents for b in batches(petition)
                        if b.status in {"SAMPLED", "FULLY_CHECKED"})

      if gross_cents >= TIER_B_FLOOR_CENTS:
          tier = "TIER_B"; discount_bps = TIER_B_DISCOUNT_BPS
      elif gross_cents >= TIER_A_FLOOR_CENTS:
          tier = "TIER_A"; discount_bps = TIER_A_DISCOUNT_BPS
      else:
          tier = "TIER_NONE"; discount_bps = 0

      discount_cents  = floor(gross_cents * discount_bps / 10000)
      subtotal_cents  = gross_cents - discount_cents
      surcharge_cents = ceil(subtotal_cents * standard.county_surcharge_bps / 10000)
      total_cents     = subtotal_cents + surcharge_cents
    input_set: "Only batches actually examined (SAMPLED or FULLY_CHECKED). AFFIDAVIT_VERIFIED batches never reached an examiner and INVALIDATED batches were struck, so both are excluded even though they may hold a non-zero stored cost."
    constants:
      TIER_A_FLOOR_CENTS: 20
      TIER_B_FLOOR_CENTS: 100
      TIER_A_DISCOUNT_BPS: 1000
      TIER_B_DISCOUNT_BPS: 1500
    precision: "floor on the discount, ceil on the surcharge, and the tier is keyed on gross_cents BEFORE the discount. At a surcharge of 250 bps: gross 10 -> TIER_NONE, discount 0, subtotal 10, surcharge 1, total 11; gross 20 -> TIER_A, discount 2, subtotal 18, surcharge 1, total 19. Rounding the whole 4-line examination in one step gives gross 19, which slips under TIER_A_FLOOR_CENTS and yields total 20; skipping the discount yields total 21."
    note: "gross_cents exactly at TIER_A_FLOOR_CENTS selects TIER_A, so the boundary is inclusive."

  - name: cure_target_computation
    trigger: "POST /petitions/{petition_id}/cure-periods"
    algorithm: threshold
    formula: |
      round = latest_closed_round(petition)          # never null at this point
      if round.round_type == "RANDOM_SAMPLE":
          best_valid = round.projected_valid_count
      else:
          best_valid = petition.verified_valid_count

      shortfall_at_open        = max(0, petition.required_valid_signatures - best_valid)
      assumed_validity_rate_bps = min(10000, max(MIN_ASSUMED_VALIDITY_BPS,
                                                round.validity_rate_bps))
      cure_target_raw_signatures = ceil(shortfall_at_open * 10000
                                        / assumed_validity_rate_bps)
      opened_at   = logical clock
      deadline_at = opened_at + standard.cure_window_days days
    input_set: "The single latest CLOSED VerificationRound of the petition plus the frozen required_valid_signatures. VOIDED rounds are invisible here, so voiding the round that triggered the cure and closing a fresh one changes the target."
    constants:
      MIN_ASSUMED_VALIDITY_BPS: 2500
    precision: "ceil on the target so a partial signature always rounds up; the clamp is applied before the division. A shortfall of 1 at an observed rate of 2500 bps yields a target of 4 raw signatures; the same shortfall at 5000 bps yields 2."
    note: "The clamp keeps a pathological 0 bps observed rate from producing an infinite target; MIN_ASSUMED_VALIDITY_BPS is the floor and 10000 the ceiling."

  - name: circulator_credibility_score
    trigger: "POST /signature-records/{signature_record_id}/validate, POST /fraud-referrals, POST /fraud-referrals/{referral_id}/adjudicate"
    algorithm: weighted_scoring
    formula: |
      # effective_status(r) := r.status_before_void when r.validation_status == "VOIDED",
      #                       else r.validation_status
      checked = count(r in records of this circulator's batches
                      if effective_status(r) not in {"PENDING", "INVALID_FORMAT_DEFECT"})
      invalid = count(r in the same set
                      if effective_status(r) startswith "INVALID_")
      invalid_rate_bps = 0 if checked == 0 else floor(invalid * 10000 / checked)

      strikes = circulator.misconduct_strike_count
      open_referrals = count(FraudReferral of this circulator
                             with status in {"OPENED", "REFERRED_TO_AG"})

      if strikes == 0:      # provisional variant
          raw = 10000
                - floor(invalid_rate_bps * PROVISIONAL_WEIGHT_BPS / 10000)
                - PROVISIONAL_OPEN_REFERRAL_PENALTY_BPS * open_referrals
      else:                 # adjudicated variant
          raw = 10000
                - floor(invalid_rate_bps * ADJUDICATED_WEIGHT_BPS / 10000)
                - SUBSTANTIATED_STRIKE_PENALTY_BPS * strikes

      credibility_score_bps = min(10000, max(CREDIBILITY_FLOOR_BPS, raw))
    input_set: "Every SignatureRecord in every SignatureBatch this circulator swore, across petitions, scored on its effective status so that voiding a line does not erase the history that produced the score."
    constants:
      PROVISIONAL_WEIGHT_BPS: 5000
      ADJUDICATED_WEIGHT_BPS: 10000
      PROVISIONAL_OPEN_REFERRAL_PENALTY_BPS: 500
      SUBSTANTIATED_STRIKE_PENALTY_BPS: 2000
      CREDIBILITY_FLOOR_BPS: 1000
    precision: "floor on the weighted invalid-rate term, then clamp into [CREDIBILITY_FLOOR_BPS, 10000]. A brand-new circulator with nothing examined scores 10000. One examined valid line and one examined invalid line give invalid_rate_bps 5000, hence 7500 under the provisional variant and 3000 under the adjudicated variant with a single strike."
    variants:
      - name: provisional
        when: "circulator.misconduct_strike_count == 0"
        difference: "The invalid rate is weighted at half strength and each still-open referral costs a flat 500 bps, reflecting an unproven allegation."
      - name: adjudicated
        when: "circulator.misconduct_strike_count >= 1"
        difference: "The invalid rate is weighted at full strength, open-referral penalties drop away, and each substantiated strike costs 2000 bps. Identical line data therefore scores 7500 provisionally and 3000 once one referral is substantiated."
    note: "The floor clamp is observable: with every examined line invalid (10000 bps) and one strike the raw value is -2000 and the reported score is exactly CREDIBILITY_FLOOR_BPS."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and neither is an empty string"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "X-User-Role appears in the acting endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request shape: every required input field present and non-null, enums within their declared value set, integers within their declared range, arrays within their declared cardinality and free of duplicates, datetimes valid ISO 8601 UTC instants, effective_to strictly after effective_from, limit in 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every id in the path resolves, left to right"
    error_id: "ERR_PETITION_NOT_FOUND | ERR_CIRCULATOR_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_SIGNATURE_RECORD_NOT_FOUND | ERR_ROUND_NOT_FOUND | ERR_CURE_PERIOD_NOT_FOUND | ERR_CHALLENGE_NOT_FOUND | ERR_FRAUD_REFERRAL_NOT_FOUND | ERR_VERIFICATION_STANDARD_NOT_FOUND | ERR_COUNTY_NOT_FOUND | ERR_VOTER_RECORD_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 6
    category: existence
    check: "Every foreign key in the request body resolves, in the order the fields are declared in §1.1: standard_id, petition_id, circulator_id, county_id, batch_id, cure_period_id, and each entry of assigned_county_codes against County.county_code"
    error_id: "ERR_VERIFICATION_STANDARD_NOT_FOUND | ERR_PETITION_NOT_FOUND | ERR_CIRCULATOR_NOT_FOUND | ERR_COUNTY_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_CURE_PERIOD_NOT_FOUND"
    http_status: 404
    applies_to: "POST /petitions, POST /circulation-assignments, POST /signature-batches, POST /voter-records, POST /fraud-referrals, POST /petitions/{petition_id}/verification-rounds"

  - priority: 7
    category: auth
    check: "Ownership for entity-backed and owner-scoped roles: a CountyClerk may only act on a SignatureBatch or SignatureRecord whose batch.county_id equals X-User-ID and on a VoterRecord whose county_id equals X-User-ID; a CirculatorAgent may only act on a Circulator whose id equals X-User-ID and may only create a SignatureBatch whose circulator_id equals X-User-ID; a Proponent may only act on a Petition whose proponent_user_id equals X-User-ID; a Challenger may only escalate a Challenge whose challenger_user_id equals X-User-ID"
    error_id: "ERR_NOT_RESOURCE_OWNER | ERR_NOT_CHALLENGE_OWNER"
    http_status: 403
    applies_to: "every mutating endpoint reachable by CountyClerk, CirculatorAgent, Proponent or Challenger"

  - priority: 8
    category: auth
    check: "Segregation of duties: the acting X-User-ID differs from the tallied_by_examiner_id of the petition's latest closed round on POST /petitions/{petition_id}/determination, and differs from referral.opened_by_examiner_id on POST /fraud-referrals/{referral_id}/adjudicate"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /petitions/{petition_id}/determination, POST /fraud-referrals/{referral_id}/adjudicate"

  - priority: 9
    category: business_constraint
    check: "Optimistic concurrency: expected_petition_version equals petition.version on PUT /petitions/{petition_id}/title-summary, and expected_circulator_version equals circulator.version on POST /circulation-assignments"
    error_id: "ERR_STALE_PETITION_VERSION | ERR_STALE_CIRCULATOR_VERSION"
    http_status: 412
    applies_to: "PUT /petitions/{petition_id}/title-summary, POST /circulation-assignments"

  - priority: 10
    category: state
    check: "The target resource is in a state that admits the requested transition, per §1.2. Includes: petition status gates; batch status gates with the dedicated already-terminal signal; round status gates and the one-open-round-per-petition rule; circulator registration gates; challenge status gates; referral must sit at REFERRED_TO_AG before adjudication; a petition may hold at most one non-NONE challenge_status"
    error_id: "ERR_INVALID_PETITION_STATE | ERR_INVALID_BATCH_STATE | ERR_BATCH_ALREADY_TERMINAL | ERR_INVALID_ROUND_STATE | ERR_ROUND_ALREADY_OPEN | ERR_INVALID_CIRCULATOR_STATE | ERR_INVALID_CHALLENGE_STATE | ERR_REFERRAL_NOT_WITH_AG | ERR_CHALLENGE_ALREADY_FILED"
    http_status: 409
    applies_to: "every state-advancing endpoint"

  - priority: 11
    category: business_constraint
    check: "Uniqueness: VerificationStandard.jurisdiction_code, County.county_code, VoterRecord.voter_id_number globally, and SignatureRecord.line_number within its batch"
    error_id: "ERR_DUPLICATE_JURISDICTION_CODE | ERR_DUPLICATE_COUNTY_CODE | ERR_DUPLICATE_VOTER_ID_NUMBER | ERR_DUPLICATE_LINE_NUMBER"
    http_status: 409
    applies_to: "POST /verification-standards, POST /counties, POST /voter-records, POST /signature-batches/{batch_id}/signatures"

  - priority: 12
    category: business_safety
    check: "Statutory eligibility and compliance gates: single-subject rule at format approval; official title and summary present before clearance; training course on the approved list; training complete before affidavit; paid-circulator disclosure on file before affidavit; affidavit sworn; the batch circulator is REGISTERED; a REVOKED circulator blocks every write that touches it or its batches; a circulator carrying a substantiated strike cannot be reinstated"
    error_id: "ERR_SINGLE_SUBJECT_VIOLATION | ERR_TITLE_SUMMARY_MISSING | ERR_TRAINING_COURSE_NOT_APPROVED | ERR_TRAINING_NOT_COMPLETE | ERR_PAID_DISCLOSURE_MISSING | ERR_AFFIDAVIT_NOT_SWORN | ERR_CIRCULATOR_NOT_REGISTERED | ERR_CIRCULATOR_REVOKED | ERR_CIRCULATOR_REINSTATEMENT_BARRED"
    http_status: 422
    applies_to: "POST /petitions/{petition_id}/format-decision, POST /petitions/{petition_id}/clear-for-circulation, POST /circulators/{circulator_id}/training, POST /circulators/{circulator_id}/affidavit, POST /circulators/{circulator_id}/reinstate, POST /signature-batches, POST /signature-batches/{batch_id}/reinstate"

  - priority: 13
    category: business_referential
    check: "Cross-entity linkage: the batch circulator holds an ACTIVE CirculationAssignment for the batch petition; the batch county_code appears in that assignment's assigned_county_codes; a supplemental batch names an OPEN CurePeriod of the same petition and a non-supplemental batch names none; the line under validation is in_sample on an OPEN round; every entry of format_defect_line_numbers matches a line of that batch; a batch named by a SUBSTANTIATED FraudReferral cannot be reinstated"
    error_id: "ERR_NO_ACTIVE_ASSIGNMENT | ERR_COUNTY_NOT_IN_ASSIGNMENT | ERR_SUPPLEMENTAL_WITHOUT_CURE_PERIOD | ERR_CURE_PERIOD_NOT_OPEN | ERR_SIGNATURE_NOT_IN_OPEN_ROUND | ERR_LINE_NUMBER_NOT_FOUND | ERR_FRAUD_SUBSTANTIATED_BATCH"
    http_status: 409
    applies_to: "POST /signature-batches, POST /signature-batches/{batch_id}/verify-affidavit, POST /signature-batches/{batch_id}/reinstate, POST /signature-records/{signature_record_id}/validate"

  - priority: 14
    category: business_temporal
    check: "Window and interval rules: signatures may only be filed while the logical clock is at or before circulation_deadline; every SignatureRecord.signed_on lies within [petition.cleared_at, petition.circulation_deadline] and, for a supplemental batch, additionally within [cure_period.opened_at, cure_period.deadline_at); a new CirculationAssignment interval must clear every ACTIVE or SUSPENDED interval of the same circulator by at least ASSIGNMENT_BUFFER_DAYS on both sides; a new CurePeriod must not overlap the half-open interval of any existing CurePeriod of the petition; a CurePeriod may only be expired at or after its deadline_at; a Challenge may only be escalated strictly before review_deadline_at and may only be filed while the petition holds a pending determination"
    error_id: "ERR_CIRCULATION_DEADLINE_PASSED | ERR_SIGNED_OUTSIDE_WINDOW | ERR_ASSIGNMENT_WINDOW_CONFLICT | ERR_CURE_PERIOD_OVERLAP | ERR_CURE_PERIOD_NOT_EXPIRED | ERR_CHALLENGE_REVIEW_WINDOW_EXPIRED | ERR_CHALLENGE_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /petitions/{petition_id}/file-signatures, POST /signature-batches/{batch_id}/signatures, POST /circulation-assignments, POST /petitions/{petition_id}/cure-periods, POST /cure-periods/{cure_period_id}/expire, POST /petitions/{petition_id}/challenges, POST /challenges/{challenge_id}/escalate"

  - priority: 15
    category: business_fiscal
    check: "Counting and quota gates evaluated last: format review rounds not exhausted; cure period count below MAX_CURE_PERIODS and the petition above the cure eligibility floor; the eligible pool is non-empty at round creation; no selected line still PENDING at tally; at least one AFFIDAVIT_VERIFIED batch before filing; a batch holds at least one line before affidavit verification; county distribution satisfied before certification; no pending challenge and no open fraud referral before a determination"
    error_id: "ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED | ERR_CURE_LIMIT_REACHED | ERR_CURE_NOT_ELIGIBLE | ERR_EMPTY_ELIGIBLE_POOL | ERR_ROUND_HAS_PENDING_SIGNATURES | ERR_NO_VERIFIED_BATCHES | ERR_BATCH_EMPTY | ERR_COUNTY_DISTRIBUTION_UNMET | ERR_CHALLENGE_PENDING | ERR_FRAUD_REFERRAL_OPEN"
    http_status: 409
    applies_to: "POST /petitions/{petition_id}/submit, POST /petitions/{petition_id}/cure-periods, POST /petitions/{petition_id}/verification-rounds, POST /verification-rounds/{round_id}/tally, POST /petitions/{petition_id}/file-signatures, POST /signature-batches/{batch_id}/verify-affidavit, POST /petitions/{petition_id}/determination"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:
  # --- test-driving surface ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server logical clock to an arbitrary ISO 8601 UTC instant. Every deadline, window, expiry and filed_at in this system reads this clock and never the wall clock. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [SosAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["moves the logical clock, which re-evaluates every subsequent deadline, window and expiry comparison"]

  # --- verification standards ---------------------------------------------
  - method: POST
    path: "/verification-standards"
    description: "Registers the statutory formula parameters for a jurisdiction."
    roles: [SosAdmin]
    code: 201
    input: [jurisdiction_code, gubernatorial_vote_total, signature_pct_bps, sample_pct_bps, sample_min_count, sufficiency_upper_bps, sufficiency_lower_bps, stratification_mode, county_distribution_pct_bps, required_qualifying_counties, verification_rate_millicents_per_signature, county_surcharge_bps, "cure_allowed?", "cure_window_days?", "cure_eligibility_floor_bps?", "circulation_window_days?"]
    output: VerificationStandard
    side_effects: []
  - method: GET
    path: "/verification-standards/{standard_id}"
    description: "Reads one verification standard."
    roles: [SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger]
    code: 200
    input: []
    output: VerificationStandard
    side_effects: []
  - method: GET
    path: "/verification-standards"
    description: "Lists verification standards."
    roles: [SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger]
    code: 200
    input: ["jurisdiction_code?", "stratification_mode?", "limit?", "offset?"]
    output: VerificationStandard[]
    side_effects: []

  # --- counties -------------------------------------------------------------
  - method: POST
    path: "/counties"
    description: "Registers a county elections office."
    roles: [SosAdmin]
    code: 201
    input: [county_code, name, registered_voter_count]
    output: County
    side_effects: []
  - method: GET
    path: "/counties/{county_id}"
    description: "Reads one county."
    roles: [SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger]
    code: 200
    input: []
    output: County
    side_effects: []
  - method: GET
    path: "/counties"
    description: "Lists counties."
    roles: [SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger]
    code: 200
    input: ["county_code?", "limit?", "offset?"]
    output: County[]
    side_effects: []

  # --- voter roll -----------------------------------------------------------
  - method: POST
    path: "/voter-records"
    description: "Adds a voter to a county roll."
    roles: [SosAdmin, CountyClerk]
    code: 201
    input: [county_id, voter_id_number, full_name, signature_on_file_hash, registration_date, "registration_status?"]
    output: VoterRecord
    side_effects: []
  - method: GET
    path: "/voter-records/{voter_record_id}"
    description: "Reads one voter record."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk]
    code: 200
    input: []
    output: VoterRecord
    side_effects: []
  - method: GET
    path: "/voter-records"
    description: "Lists voter records; the reverse-reachability channel from County to VoterRecord."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk]
    code: 200
    input: ["county_id?", "voter_id_number?", "registration_status?", "limit?", "offset?"]
    output: VoterRecord[]
    side_effects: []
  - method: PUT
    path: "/voter-records/{voter_record_id}/registration-status"
    description: "Moves a voter between ACTIVE, INACTIVE, CANCELLED and PENDING."
    roles: [SosAdmin, CountyClerk]
    code: 200
    input: [registration_status]
    output: VoterRecord
    side_effects: ["changes the outcome of every later signature validation against this voter; already-validated lines are untouched"]

  # --- petitions ------------------------------------------------------------
  - method: POST
    path: "/petitions"
    description: "Files a new petition in DRAFT."
    roles: [Proponent]
    code: 201
    input: [standard_id, proponent_name, submitted_title, measure_subject_codes]
    output: Petition
    side_effects: ["stores proponent_user_id from X-User-ID"]
  - method: GET
    path: "/petitions/{petition_id}"
    description: "Reads one petition with all derived counters."
    roles: [SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger]
    code: 200
    input: []
    output: Petition
    side_effects: []
  - method: GET
    path: "/petitions"
    description: "Lists petitions; the reverse-reachability channel from VerificationStandard to Petition."
    roles: [SosAdmin, ElectionsExaminer, TitleExaminer, Proponent, CountyClerk, CirculatorAgent, Challenger]
    code: 200
    input: ["standard_id?", "status?", "challenge_status?", "limit?", "offset?"]
    output: Petition[]
    side_effects: []
  - method: POST
    path: "/petitions/{petition_id}/submit"
    description: "Submits the petition for format and single-subject review."
    roles: [Proponent]
    code: 200
    input: []
    output: Petition
    side_effects: ["moves petition.status to FORMAT_REVIEW from DRAFT or FORMAT_REJECTED"]
  - method: POST
    path: "/petitions/{petition_id}/format-decision"
    description: "Records the format and single-subject review outcome."
    roles: [ElectionsExaminer]
    code: 200
    input: [decision, "reviewer_note?"]
    output: Petition
    side_effects: ["increments petition.format_review_round by 1", "moves petition.status to TITLE_PENDING on APPROVE or FORMAT_REJECTED on REJECT"]
  - method: PUT
    path: "/petitions/{petition_id}/title-summary"
    description: "Prepares or supersedes the official title and summary. Guarded by OCC rule title-summary-stale-petition."
    roles: [TitleExaminer]
    code: 200
    input: [official_title, official_summary, expected_petition_version]
    output: Petition
    side_effects: ["sets petition.official_title and petition.official_summary", "increments Petition.version by 1"]
  - method: POST
    path: "/petitions/{petition_id}/clear-for-circulation"
    description: "Clears the petition for circulation and freezes its signature threshold."
    roles: [SosAdmin]
    code: 200
    input: []
    output: Petition
    side_effects: ["sets cleared_at from the logical clock and circulation_deadline from standard.circulation_window_days", "computes required_valid_signatures", "moves petition.status to CLEARED"]
  - method: POST
    path: "/petitions/{petition_id}/file-signatures"
    description: "Closes circulation and files the verified batches for verification."
    roles: [Proponent]
    code: 200
    input: []
    output: Petition
    side_effects: ["recomputes raw_signature_count, accepted_raw_total and qualifying_county_count", "moves petition.status to SIGNATURES_FILED"]
  - method: POST
    path: "/petitions/{petition_id}/verification-rounds"
    description: "Opens a verification round and performs the deterministic line selection."
    roles: [ElectionsExaminer]
    code: 201
    input: [round_type, "cure_period_id?"]
    output: VerificationRound
    side_effects: ["assigns round_index in creation order", "computes eligible_pool_size and sample_size via calculations.sample_selection", "sets in_sample and validated_in_round_id on every selected SignatureRecord", "moves petition.status to SAMPLE_VERIFICATION or FULL_CHECK"]
  - method: POST
    path: "/petitions/{petition_id}/cure-periods"
    description: "Opens a supplemental signature (cure) period."
    roles: [SosAdmin]
    code: 201
    input: []
    output: CurePeriod
    side_effects: ["computes shortfall_at_open, assumed_validity_rate_bps and cure_target_raw_signatures via calculations.cure_target_computation", "sets opened_at from the logical clock and deadline_at from standard.cure_window_days", "increments petition.cure_period_count by 1"]
  - method: POST
    path: "/petitions/{petition_id}/challenges"
    description: "Files a challenge against a pending determination."
    roles: [Challenger]
    code: 201
    input: [challenger_name, grounds, statement]
    output: Challenge
    side_effects: ["stores challenger_user_id from X-User-ID", "sets filed_at from the logical clock and review_deadline_at from CHALLENGE_REVIEW_DAYS", "moves petition.challenge_status to CHALLENGE_FILED, which blocks POST /petitions/{petition_id}/determination"]
  - method: POST
    path: "/petitions/{petition_id}/determination"
    description: "Issues the final certification or failure determination."
    roles: [SosAdmin, ElectionsExaminer]
    code: 200
    input: [determination]
    output: Petition
    side_effects: ["moves petition.status to CERTIFIED or FAILED"]
  - method: GET
    path: "/petitions/{petition_id}/distribution-report"
    description: "Computed read: per-county minimum, credited count and qualification flag, plus qualifying_county_count and the standard's required_qualifying_counties."
    roles: [SosAdmin, ElectionsExaminer, Proponent, Challenger]
    code: 200
    input: []
    output: "{ petition_id: string, required_qualifying_counties: integer, qualifying_county_count: integer, counties: object[] }"
    side_effects: []
  - method: GET
    path: "/petitions/{petition_id}/verification-invoice"
    description: "Computed read of calculations.county_reimbursement_invoice. Each element of counties[] carries county_code, distribution_minimum, credited_count and qualifies."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk]
    code: 200
    input: []
    output: "{ petition_id: string, gross_cents: integer, tier: string, discount_bps: integer, discount_cents: integer, subtotal_cents: integer, surcharge_cents: integer, total_cents: integer }"
    side_effects: []

  # --- circulators ----------------------------------------------------------
  - method: POST
    path: "/circulators"
    description: "Registers a circulator in PENDING_TRAINING."
    roles: [SosAdmin, Proponent]
    code: 201
    input: [full_name, residency_state_code, "is_paid?", "employer_name?"]
    output: Circulator
    side_effects: ["computes paid_disclosure_on_file", "computes credibility_score_bps with the provisional variant"]
  - method: GET
    path: "/circulators/{circulator_id}"
    description: "Reads one circulator."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, CirculatorAgent]
    code: 200
    input: []
    output: Circulator
    side_effects: []
  - method: GET
    path: "/circulators"
    description: "Lists circulators."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, CirculatorAgent]
    code: 200
    input: ["registration_status?", "is_paid?", "limit?", "offset?"]
    output: Circulator[]
    side_effects: []
  - method: POST
    path: "/circulators/{circulator_id}/training"
    description: "Records completion of an approved circulator training course."
    roles: [SosAdmin, CirculatorAgent]
    code: 200
    input: [training_course_code]
    output: Circulator
    side_effects: ["sets training_course_code and training_completed_at", "moves registration_status to TRAINED"]
  - method: PUT
    path: "/circulators/{circulator_id}/paid-disclosure"
    description: "Files the paid-circulator disclosure document."
    roles: [SosAdmin, CirculatorAgent]
    code: 200
    input: [disclosure_document_id, "employer_name?"]
    output: Circulator
    side_effects: ["sets disclosure_document_id and optionally employer_name", "recomputes paid_disclosure_on_file"]
  - method: POST
    path: "/circulators/{circulator_id}/affidavit"
    description: "Files the sworn circulator affidavit and completes registration."
    roles: [CirculatorAgent, SosAdmin]
    code: 200
    input: [sworn]
    output: Circulator
    side_effects: ["sets affidavit_filed_at", "moves registration_status to REGISTERED"]
  - method: POST
    path: "/circulators/{circulator_id}/suspend"
    description: "Suspends a registered circulator."
    roles: [SosAdmin]
    code: 200
    input: ["reason?"]
    output: Circulator
    side_effects: ["moves registration_status to SUSPENDED", "sets every ACTIVE CirculationAssignment of this circulator to SUSPENDED", "leaves every SignatureBatch untouched"]
  - method: POST
    path: "/circulators/{circulator_id}/reinstate"
    description: "Returns a suspended circulator to REGISTERED."
    roles: [SosAdmin]
    code: 200
    input: []
    output: Circulator
    side_effects: ["moves registration_status to REGISTERED", "sets every SUSPENDED CirculationAssignment of this circulator back to ACTIVE"]
  - method: POST
    path: "/circulators/{circulator_id}/revoke"
    description: "Permanently revokes a circulator and cascades through assignments, batches, lines and petition ledgers."
    roles: [SosAdmin]
    code: 200
    input: ["reason?"]
    output: Circulator
    side_effects: ["moves registration_status to REVOKED", "terminates every non-TERMINATED CirculationAssignment", "invalidates every non-terminal SignatureBatch of those assignments, recording status_before_invalidation", "voids every non-VOIDED SignatureRecord of those batches with void_reason CIRCULATOR_REVOKED, recording status_before_void", "recomputes accepted_raw_total, projected_valid_count, verified_valid_count, voided_signature_count, verification_cost_accrued_cents and qualifying_county_count on every affected Petition"]

  # --- circulation assignments ---------------------------------------------
  - method: POST
    path: "/circulation-assignments"
    description: "Authorises a circulator to circulate a petition in named counties over a closed date interval. Guarded by OCC rule assignment-create-stale-circulator."
    roles: [SosAdmin, Proponent]
    code: 201
    input: [petition_id, circulator_id, effective_from, effective_to, assigned_county_codes, expected_circulator_version, "paid_disclosure_ack?"]
    output: CirculationAssignment
    side_effects: ["occupies the closed interval [effective_from, effective_to] on the circulator plus an ASSIGNMENT_BUFFER_DAYS clearance on both sides", "increments Circulator.version by 1"]
  - method: GET
    path: "/circulation-assignments/{assignment_id}"
    description: "Reads one circulation assignment."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, CirculatorAgent]
    code: 200
    input: []
    output: CirculationAssignment
    side_effects: []
  - method: GET
    path: "/circulation-assignments"
    description: "Lists circulation assignments; the reverse-reachability channel from Petition and from Circulator to CirculationAssignment."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, CirculatorAgent]
    code: 200
    input: ["petition_id?", "circulator_id?", "status?", "limit?", "offset?"]
    output: CirculationAssignment[]
    side_effects: []
  - method: POST
    path: "/circulation-assignments/{assignment_id}/terminate"
    description: "Ends an assignment early, releasing its interval on the circulator without touching the circulator's own registration or any filed batch."
    roles: [SosAdmin, Proponent]
    code: 200
    input: ["reason?"]
    output: CirculationAssignment
    side_effects: ["moves assignment.status to TERMINATED", "releases the occupied interval so a later overlapping assignment becomes admissible", "blocks further POST /signature-batches under this assignment"]

  # --- signature batches ----------------------------------------------------
  - method: POST
    path: "/signature-batches"
    description: "Files a batch of petition sheets with a county elections office."
    roles: [CirculatorAgent, Proponent]
    code: 201
    input: [petition_id, circulator_id, county_id, affidavit_signed, "is_supplemental?", "cure_period_id?"]
    output: SignatureBatch
    side_effects: ["sets filed_at from the logical clock", "starts the batch in RECEIVED with raw_count 0 and accepted_raw_count 0"]
  - method: GET
    path: "/signature-batches/{batch_id}"
    description: "Reads one signature batch with its counters and stored cost."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, CirculatorAgent]
    code: 200
    input: []
    output: SignatureBatch
    side_effects: []
  - method: GET
    path: "/signature-batches"
    description: "Lists signature batches; the reverse-reachability channel from Petition, Circulator, County and CurePeriod to SignatureBatch."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, CirculatorAgent]
    code: 200
    input: ["petition_id?", "circulator_id?", "county_id?", "cure_period_id?", "status?", "is_supplemental?", "limit?", "offset?"]
    output: SignatureBatch[]
    side_effects: []
  - method: POST
    path: "/signature-batches/{batch_id}/signatures"
    description: "Adds one signature line to a received batch."
    roles: [CirculatorAgent, Proponent]
    code: 201
    input: [line_number, signer_name, claimed_voter_id_number, signed_on, signature_hash]
    output: SignatureRecord
    side_effects: ["increments batch.raw_count by 1", "recomputes petition.raw_signature_count"]
  - method: POST
    path: "/signature-batches/{batch_id}/verify-affidavit"
    description: "County clerk verifies the batch affidavit and strikes format-defective lines."
    roles: [CountyClerk]
    code: 200
    input: [affidavit_notary_id, "format_defect_line_numbers?"]
    output: SignatureBatch
    side_effects: ["sets validation_status INVALID_FORMAT_DEFECT on each listed line and sets format_defect_count", "sets accepted_raw_count to raw_count minus format_defect_count", "moves batch.status to AFFIDAVIT_VERIFIED, or to REJECTED_FORMAT when every line is struck", "recomputes petition.raw_signature_count and petition.accepted_raw_total"]
  - method: POST
    path: "/signature-batches/{batch_id}/invalidate"
    description: "Strikes an entire batch, voiding its lines and reversing its cost."
    roles: [SosAdmin]
    code: 200
    input: [invalidation_reason]
    output: SignatureBatch
    side_effects: ["records status_before_invalidation and invalidation_reason", "voids every non-VOIDED line with void_reason BATCH_INVALIDATED, recording status_before_void", "sets accepted_raw_count to 0 and subtracts the stored verification_cost_cents from petition.verification_cost_accrued_cents", "recomputes petition.accepted_raw_total, verified_valid_count, projected_valid_count, voided_signature_count and qualifying_county_count"]
  - method: POST
    path: "/signature-batches/{batch_id}/reinstate"
    description: "Compensating undo of an invalidation; restores the batch and every line to their pre-invalidation values."
    roles: [SosAdmin]
    code: 200
    input: ["invalidation_reason?"]
    output: SignatureBatch
    side_effects: ["restores batch.status from status_before_invalidation and clears it", "restores every line's validation_status from status_before_void and clears status_before_void and void_reason", "restores accepted_raw_count and adds the stored verification_cost_cents back to petition.verification_cost_accrued_cents", "recomputes petition.accepted_raw_total, verified_valid_count, projected_valid_count, voided_signature_count and qualifying_county_count"]

  # --- signature records ----------------------------------------------------
  - method: GET
    path: "/signature-records/{signature_record_id}"
    description: "Reads one signature line with its validation outcome."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk, Proponent, Challenger]
    code: 200
    input: []
    output: SignatureRecord
    side_effects: []
  - method: GET
    path: "/signature-records"
    description: "Lists signature lines; the reverse-reachability channel from SignatureBatch, VoterRecord, VerificationRound and from SignatureRecord to itself."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk, Proponent, Challenger]
    code: 200
    input: ["batch_id?", "matched_voter_record_id?", "duplicate_of_signature_id?", "validated_in_round_id?", "validation_status?", "in_sample?", "limit?", "offset?"]
    output: SignatureRecord[]
    side_effects: []
  - method: POST
    path: "/signature-records/{signature_record_id}/validate"
    description: "County clerk validates one sampled line against the voter roll, comparing registration status, county, signature exemplar and duplicates."
    roles: [CountyClerk]
    code: 200
    input: ["manual_match_override?"]
    output: SignatureRecord
    side_effects: ["sets matched_voter_record_id and validation_status", "sets duplicate_of_signature_id when the line loses the keeper ranking", "sets manual_match_override_applied when a hash mismatch is accepted", "recomputes the batch circulator's credibility_score_bps"]

  # --- verification rounds --------------------------------------------------
  - method: GET
    path: "/verification-rounds/{round_id}"
    description: "Reads one verification round with its sample size, rate, projection and determination."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, Challenger]
    code: 200
    input: []
    output: VerificationRound
    side_effects: []
  - method: GET
    path: "/verification-rounds"
    description: "Lists verification rounds; the reverse-reachability channel from Petition and CurePeriod to VerificationRound."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, Challenger]
    code: 200
    input: ["petition_id?", "cure_period_id?", "round_type?", "status?", "determination?", "limit?", "offset?"]
    output: VerificationRound[]
    side_effects: []
  - method: POST
    path: "/verification-rounds/{round_id}/tally"
    description: "Closes a round, computes the projection, band determination and county cost deltas, and advances the petition."
    roles: [ElectionsExaminer]
    code: 200
    input: []
    output: VerificationRound
    side_effects: ["computes sampled_valid_count, validity_rate_bps, projected_valid_count and determination", "sets tallied_by_examiner_id from X-User-ID", "advances every touched SignatureBatch and accrues its cost delta into round.accrued_cost_cents and petition.verification_cost_accrued_cents", "sets petition.projected_valid_count and, for FULL_CHECK and CURE_RECHECK, petition.verified_valid_count", "recomputes petition.qualifying_county_count", "advances petition.status and, for a CURE_RECHECK, closes the CurePeriod"]
  - method: POST
    path: "/verification-rounds/{round_id}/void"
    description: "Voids a round as an examination error; compensating reversal of every effect the round produced."
    roles: [SosAdmin]
    code: 200
    input: [voided_reason]
    output: VerificationRound
    side_effects: ["clears in_sample and validated_in_round_id on every selected line and returns those lines to PENDING", "restores every touched batch to the status it held before the round examined it and resets that batch's stored verification_cost_cents to 0", "subtracts round.accrued_cost_cents from petition.verification_cost_accrued_cents", "recomputes petition.projected_valid_count and petition.verified_valid_count from the new latest closed round, or 0 when none remains", "returns petition.status to SIGNATURES_FILED when no other CLOSED round exists"]

  # --- cure periods ---------------------------------------------------------
  - method: GET
    path: "/cure-periods/{cure_period_id}"
    description: "Reads one cure period with its shortfall and raw target."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, Challenger]
    code: 200
    input: []
    output: CurePeriod
    side_effects: []
  - method: GET
    path: "/cure-periods"
    description: "Lists cure periods; the reverse-reachability channel from Petition to CurePeriod."
    roles: [SosAdmin, ElectionsExaminer, Proponent, CountyClerk, Challenger]
    code: 200
    input: ["petition_id?", "status?", "limit?", "offset?"]
    output: CurePeriod[]
    side_effects: []
  - method: POST
    path: "/cure-periods/{cure_period_id}/expire"
    description: "Closes an unmet cure period once its deadline has passed."
    roles: [SosAdmin]
    code: 200
    input: []
    output: CurePeriod
    side_effects: ["moves cure_period.status to EXPIRED", "moves petition.status to PENDING_FAILURE", "blocks any later supplemental batch naming this cure period"]

  # --- challenges -----------------------------------------------------------
  - method: GET
    path: "/challenges/{challenge_id}"
    description: "Reads one challenge."
    roles: [SosAdmin, ElectionsExaminer, Proponent, Challenger]
    code: 200
    input: []
    output: Challenge
    side_effects: []
  - method: GET
    path: "/challenges"
    description: "Lists challenges; the reverse-reachability channel from Petition to Challenge."
    roles: [SosAdmin, ElectionsExaminer, Proponent, Challenger]
    code: 200
    input: ["petition_id?", "status?", "grounds?", "limit?", "offset?"]
    output: Challenge[]
    side_effects: []
  - method: POST
    path: "/challenges/{challenge_id}/escalate"
    description: "Escalates a filed challenge to court review."
    roles: [Challenger]
    code: 200
    input: [court_docket_number]
    output: Challenge
    side_effects: ["moves challenge.status to COURT_REVIEW and petition.challenge_status to COURT_REVIEW"]
  - method: POST
    path: "/challenges/{challenge_id}/rule"
    description: "Records the court ruling on a challenge under review."
    roles: [SosAdmin]
    code: 200
    input: [ruling]
    output: Challenge
    side_effects: ["sets challenge.ruling", "on AFFIRM sets challenge.status DISMISSED and petition.challenge_status COURT_AFFIRMED", "on REVERSE sets challenge.status UPHELD, petition.challenge_status COURT_REVERSED, and flips petition.status between PENDING_CERTIFICATION and PENDING_FAILURE"]
  - method: POST
    path: "/challenges/{challenge_id}/dismiss"
    description: "Administratively dismisses a filed challenge before any court review."
    roles: [SosAdmin]
    code: 200
    input: ["reason?"]
    output: Challenge
    side_effects: ["moves challenge.status to DISMISSED and petition.challenge_status back to NONE, which re-opens the determination endpoint"]

  # --- fraud referrals ------------------------------------------------------
  - method: POST
    path: "/fraud-referrals"
    description: "Opens a fraud referral for forged signatures, circulator misconduct or a false affidavit."
    roles: [ElectionsExaminer, SosAdmin, CountyClerk]
    code: 201
    input: [petition_id, circulator_id, referral_type, narrative, "batch_id?"]
    output: FraudReferral
    side_effects: ["stores opened_by_examiner_id from X-User-ID", "recomputes the circulator's credibility_score_bps under the provisional variant, applying the open-referral penalty", "blocks POST /petitions/{petition_id}/determination while the referral is not adjudicated"]
  - method: GET
    path: "/fraud-referrals/{referral_id}"
    description: "Reads one fraud referral."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk, Challenger]
    code: 200
    input: []
    output: FraudReferral
    side_effects: []
  - method: GET
    path: "/fraud-referrals"
    description: "Lists fraud referrals; the reverse-reachability channel from Petition, Circulator and SignatureBatch to FraudReferral."
    roles: [SosAdmin, ElectionsExaminer, CountyClerk, Challenger]
    code: 200
    input: ["petition_id?", "circulator_id?", "batch_id?", "referral_type?", "status?", "limit?", "offset?"]
    output: FraudReferral[]
    side_effects: []
  - method: POST
    path: "/fraud-referrals/{referral_id}/refer-to-ag"
    description: "Forwards an opened referral to the Attorney General."
    roles: [ElectionsExaminer, SosAdmin]
    code: 200
    input: []
    output: FraudReferral
    side_effects: ["sets referred_to_ag true and moves status to REFERRED_TO_AG"]
  - method: POST
    path: "/fraud-referrals/{referral_id}/adjudicate"
    description: "Records the adjudication finding; a substantiated finding cascades through the batch, its lines, the circulator and its assignments."
    roles: [ElectionsExaminer, SosAdmin]
    code: 200
    input: [finding]
    output: FraudReferral
    side_effects: ["sets finding and adjudicated_by_examiner_id from X-User-ID", "on SUBSTANTIATED with a batch_id, invalidates that batch and voids its non-VOIDED lines with void_reason FRAUD_SUBSTANTIATED, recording referral.voided_signature_count", "on SUBSTANTIATED increments circulator.misconduct_strike_count and recomputes credibility_score_bps under the adjudicated variant", "on SUBSTANTIATED moves the circulator to SUSPENDED once misconduct_strike_count reaches MISCONDUCT_SUSPENSION_THRESHOLD, which suspends its ACTIVE assignments", "recomputes the affected petition ledgers"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  # -- authentication and authorization --
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent, or present as an empty string"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity-backed or owner-scoped role acts on a resource it does not own: a CountyClerk on another county's batch, record or voter roll; a CirculatorAgent on another circulator; a Proponent on another proponent's petition"
  - id: ERR_NOT_CHALLENGE_OWNER
    http: 403
    condition: "A Challenger escalates a Challenge whose challenger_user_id is a different X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID tallied the petition's latest closed round and now tries to issue that petition's determination, or opened a fraud referral and now tries to adjudicate it"

  # -- request shape --
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, null in a required field, unknown enum value, integer outside its declared range, array outside its declared cardinality or containing duplicates, malformed ISO 8601 instant, effective_to not strictly after effective_from, or pagination limit outside 1..100 or negative offset"

  # -- existence --
  - id: ERR_VERIFICATION_STANDARD_NOT_FOUND
    http: 404
    condition: "standard_id in a path or body does not resolve"
  - id: ERR_COUNTY_NOT_FOUND
    http: 404
    condition: "county_id does not resolve, or an entry of assigned_county_codes matches no County.county_code"
  - id: ERR_VOTER_RECORD_NOT_FOUND
    http: 404
    condition: "voter_record_id does not resolve"
  - id: ERR_PETITION_NOT_FOUND
    http: 404
    condition: "petition_id in a path or body does not resolve"
  - id: ERR_CIRCULATOR_NOT_FOUND
    http: 404
    condition: "circulator_id in a path or body does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not resolve"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "batch_id in a path or body does not resolve"
  - id: ERR_SIGNATURE_RECORD_NOT_FOUND
    http: 404
    condition: "signature_record_id does not resolve"
  - id: ERR_ROUND_NOT_FOUND
    http: 404
    condition: "round_id does not resolve"
  - id: ERR_CURE_PERIOD_NOT_FOUND
    http: 404
    condition: "cure_period_id in a path or body does not resolve, or names a cure period belonging to a different petition"
  - id: ERR_CHALLENGE_NOT_FOUND
    http: 404
    condition: "challenge_id does not resolve"
  - id: ERR_FRAUD_REFERRAL_NOT_FOUND
    http: 404
    condition: "referral_id does not resolve"

  # -- optimistic concurrency --
  - id: ERR_STALE_PETITION_VERSION
    http: 412
    condition: "expected_petition_version does not equal petition.version on PUT /petitions/{petition_id}/title-summary"
  - id: ERR_STALE_CIRCULATOR_VERSION
    http: 412
    condition: "expected_circulator_version does not equal circulator.version on POST /circulation-assignments"

  # -- state preconditions --
  - id: ERR_INVALID_PETITION_STATE
    http: 409
    condition: "The petition is not in a status that admits the requested transition, including any write against a CERTIFIED or FAILED petition"
  - id: ERR_INVALID_BATCH_STATE
    http: 409
    condition: "The batch is not in a status that admits the requested operation, for example verifying an affidavit twice or adding a line to an already verified batch"
  - id: ERR_BATCH_ALREADY_TERMINAL
    http: 409
    condition: "Invalidating a batch that is already INVALIDATED or is REJECTED_FORMAT"
  - id: ERR_INVALID_ROUND_STATE
    http: 409
    condition: "Tallying a round that is not OPEN, or voiding a round that is already VOIDED"
  - id: ERR_ROUND_ALREADY_OPEN
    http: 409
    condition: "Creating a verification round for a petition that already has an OPEN round"
  - id: ERR_INVALID_CIRCULATOR_STATE
    http: 409
    condition: "Suspending a circulator that is not REGISTERED, reinstating one that is not SUSPENDED, revoking one already REVOKED, or recording training for one past PENDING_TRAINING"
  - id: ERR_INVALID_CHALLENGE_STATE
    http: 409
    condition: "Escalating a challenge that is not FILED, ruling on one that is not in COURT_REVIEW, or dismissing one that is not FILED"
  - id: ERR_REFERRAL_NOT_WITH_AG
    http: 409
    condition: "Adjudicating a fraud referral that is still OPENED or already adjudicated"
  - id: ERR_CHALLENGE_ALREADY_FILED
    http: 409
    condition: "Filing a challenge while petition.challenge_status is not NONE"

  # -- uniqueness --
  - id: ERR_DUPLICATE_JURISDICTION_CODE
    http: 409
    condition: "A VerificationStandard already exists with the submitted jurisdiction_code"
  - id: ERR_DUPLICATE_COUNTY_CODE
    http: 409
    condition: "A County already exists with the submitted county_code"
  - id: ERR_DUPLICATE_VOTER_ID_NUMBER
    http: 409
    condition: "A VoterRecord already exists with the submitted voter_id_number"
  - id: ERR_DUPLICATE_LINE_NUMBER
    http: 409
    condition: "The batch already carries a SignatureRecord with the submitted line_number"

  # -- statutory compliance and eligibility --
  - id: ERR_SINGLE_SUBJECT_VIOLATION
    http: 422
    condition: "Approving format review for a petition whose measure_subject_codes holds more than one code"
  - id: ERR_TITLE_SUMMARY_MISSING
    http: 422
    condition: "Clearing a petition for circulation before official_title and official_summary are both prepared"
  - id: ERR_TRAINING_COURSE_NOT_APPROVED
    http: 422
    condition: "training_course_code is not in APPROVED_TRAINING_COURSES"
  - id: ERR_TRAINING_NOT_COMPLETE
    http: 422
    condition: "Filing a circulator affidavit before the training transition has been recorded"
  - id: ERR_PAID_DISCLOSURE_MISSING
    http: 422
    condition: "Filing an affidavit for a paid circulator whose paid_disclosure_on_file is false, that is with employer_name or disclosure_document_id still null"
  - id: ERR_AFFIDAVIT_NOT_SWORN
    http: 422
    condition: "The affidavit request carries sworn == false"
  - id: ERR_CIRCULATOR_NOT_REGISTERED
    http: 422
    condition: "Filing a signature batch under a circulator whose registration_status is not REGISTERED"
  - id: ERR_CIRCULATOR_REVOKED
    http: 422
    condition: "Any write that would attach work to, or restore work of, a REVOKED circulator, including reinstating one of its invalidated batches"
  - id: ERR_CIRCULATOR_REINSTATEMENT_BARRED
    http: 422
    condition: "Reinstating a suspended circulator whose misconduct_strike_count has reached MISCONDUCT_SUSPENSION_THRESHOLD"

  # -- cross-entity referential --
  - id: ERR_NO_ACTIVE_ASSIGNMENT
    http: 409
    condition: "The batch circulator holds no ACTIVE CirculationAssignment for the batch petition, because none was ever created or because the only one is SUSPENDED or TERMINATED"
  - id: ERR_COUNTY_NOT_IN_ASSIGNMENT
    http: 409
    condition: "The batch county_code is absent from the covering assignment's assigned_county_codes"
  - id: ERR_SUPPLEMENTAL_WITHOUT_CURE_PERIOD
    http: 409
    condition: "is_supplemental is true with no cure_period_id, or cure_period_id is present while is_supplemental is false"
  - id: ERR_CURE_PERIOD_NOT_OPEN
    http: 409
    condition: "A supplemental batch names a CurePeriod whose status is not OPEN"
  - id: ERR_SIGNATURE_NOT_IN_OPEN_ROUND
    http: 409
    condition: "Validating a line that is not in_sample, or whose validated_in_round_id names a round that is CLOSED or VOIDED, or that already carries a non-PENDING validation_status"
  - id: ERR_LINE_NUMBER_NOT_FOUND
    http: 409
    condition: "An entry of format_defect_line_numbers matches no SignatureRecord line_number in that batch"
  - id: ERR_FRAUD_SUBSTANTIATED_BATCH
    http: 409
    condition: "Reinstating a batch named by a FraudReferral whose status is SUBSTANTIATED"

  # -- temporal --
  - id: ERR_CIRCULATION_DEADLINE_PASSED
    http: 409
    condition: "Filing signatures when the logical clock is strictly after petition.circulation_deadline"
  - id: ERR_SIGNED_OUTSIDE_WINDOW
    http: 409
    condition: "signed_on falls outside [petition.cleared_at, petition.circulation_deadline], or for a supplemental batch outside the half-open [cure_period.opened_at, cure_period.deadline_at)"
  - id: ERR_ASSIGNMENT_WINDOW_CONFLICT
    http: 409
    condition: "The requested closed interval does not clear every ACTIVE or SUSPENDED assignment interval of the same circulator by at least ASSIGNMENT_BUFFER_DAYS on both sides"
  - id: ERR_CURE_PERIOD_OVERLAP
    http: 409
    condition: "The new CurePeriod's half-open [opened_at, deadline_at) interval overlaps that of an existing CurePeriod of the same petition"
  - id: ERR_CURE_PERIOD_NOT_EXPIRED
    http: 409
    condition: "Expiring a CurePeriod while the logical clock is still strictly before its deadline_at"
  - id: ERR_CHALLENGE_REVIEW_WINDOW_EXPIRED
    http: 409
    condition: "Escalating a challenge at or after its review_deadline_at"
  - id: ERR_CHALLENGE_WINDOW_CLOSED
    http: 409
    condition: "Filing a challenge while the petition status is not PENDING_CERTIFICATION or PENDING_FAILURE"

  # -- counting and quota gates --
  - id: ERR_FORMAT_REVIEW_ROUNDS_EXHAUSTED
    http: 409
    condition: "Submitting for format review when format_review_round has reached MAX_FORMAT_REVIEW_ROUNDS"
  - id: ERR_CURE_LIMIT_REACHED
    http: 409
    condition: "Opening a cure period when petition.cure_period_count has reached MAX_CURE_PERIODS"
  - id: ERR_CURE_NOT_ELIGIBLE
    http: 409
    condition: "Opening a cure period when the standard forbids cures, or when the best available valid count is below required_valid_signatures times cure_eligibility_floor_bps"
  - id: ERR_EMPTY_ELIGIBLE_POOL
    http: 409
    condition: "Creating a verification round when the eligible SignatureRecord pool is empty"
  - id: ERR_ROUND_HAS_PENDING_SIGNATURES
    http: 409
    condition: "Tallying a round while at least one selected line is still PENDING"
  - id: ERR_NO_VERIFIED_BATCHES
    http: 409
    condition: "Filing signatures when the petition has no AFFIDAVIT_VERIFIED batch"
  - id: ERR_BATCH_EMPTY
    http: 409
    condition: "Verifying the affidavit of a batch that carries no SignatureRecord"
  - id: ERR_COUNTY_DISTRIBUTION_UNMET
    http: 409
    condition: "Certifying a petition whose qualifying_county_count is below standard.required_qualifying_counties"
  - id: ERR_CHALLENGE_PENDING
    http: 409
    condition: "Issuing a determination while petition.challenge_status is CHALLENGE_FILED or COURT_REVIEW"
  - id: ERR_FRAUD_REFERRAL_OPEN
    http: 409
    condition: "Issuing a determination while a FraudReferral of the petition is OPENED or REFERRED_TO_AG"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: SosAdmin
    description: "Secretary of State initiative program administrator; owns configuration, clearance, cure periods, batch invalidation and reinstatement, round voiding, circulator discipline and court ruling entry."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /verification-standards"
      - "POST /counties"
      - "POST /petitions/{petition_id}/clear-for-circulation"
      - "POST /petitions/{petition_id}/cure-periods"
      - "POST /signature-batches/{batch_id}/invalidate"
      - "POST /signature-batches/{batch_id}/reinstate"
      - "POST /verification-rounds/{round_id}/void"
      - "POST /cure-periods/{cure_period_id}/expire"
      - "POST /circulators/{circulator_id}/suspend"
      - "POST /circulators/{circulator_id}/reinstate"
      - "POST /circulators/{circulator_id}/revoke"
      - "POST /challenges/{challenge_id}/rule"
      - "POST /challenges/{challenge_id}/dismiss"
    shared_operations:
      - "POST /voter-records and PUT /voter-records/{voter_record_id}/registration-status (with CountyClerk)"
      - "POST /circulators (with Proponent)"
      - "POST /circulators/{circulator_id}/training (with CirculatorAgent)"
      - "PUT /circulators/{circulator_id}/paid-disclosure (with CirculatorAgent)"
      - "POST /circulators/{circulator_id}/affidavit (with CirculatorAgent)"
      - "POST /circulation-assignments and POST /circulation-assignments/{assignment_id}/terminate (with Proponent)"
      - "POST /petitions/{petition_id}/determination (with ElectionsExaminer)"
      - "POST /fraud-referrals, refer-to-ag and adjudicate (with ElectionsExaminer)"
      - "every GET"

  - name: ElectionsExaminer
    description: "Division of elections examiner; runs format review, opens and tallies verification rounds, opens and adjudicates fraud referrals, and may issue determinations for petitions it did not tally."
    identity: "opaque"
    exclusive_operations:
      - "POST /petitions/{petition_id}/format-decision"
      - "POST /petitions/{petition_id}/verification-rounds"
      - "POST /verification-rounds/{round_id}/tally"
    shared_operations:
      - "POST /petitions/{petition_id}/determination (with SosAdmin, subject to the segregation-of-duties bar)"
      - "POST /fraud-referrals (with SosAdmin and CountyClerk)"
      - "POST /fraud-referrals/{referral_id}/refer-to-ag and adjudicate (with SosAdmin)"
      - "every GET except the voter roll write endpoints"

  - name: TitleExaminer
    description: "Title and summary preparer in the Attorney General's office; the only role that can write a petition's official title and summary."
    identity: "opaque"
    exclusive_operations:
      - "PUT /petitions/{petition_id}/title-summary"
    shared_operations:
      - "GET /petitions/{petition_id}, GET /petitions, GET /verification-standards, GET /counties"

  - name: Proponent
    description: "Initiative proponent committee; owns its own petitions, may register circulators, create and terminate assignments, and file batches and lines on a circulator's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /petitions"
      - "POST /petitions/{petition_id}/submit"
      - "POST /petitions/{petition_id}/file-signatures"
    shared_operations:
      - "POST /circulators (with SosAdmin)"
      - "POST /circulation-assignments and terminate (with SosAdmin)"
      - "POST /signature-batches and POST /signature-batches/{batch_id}/signatures (with CirculatorAgent)"
      - "GET on petitions, circulators, assignments, batches, records, rounds, cure periods and challenges"
    note: "Ownership is enforced against Petition.proponent_user_id; a Proponent cannot touch another proponent's petition."

  - name: CountyClerk
    description: "County elections office; verifies batch affidavits, strikes format defects, validates individual signature lines against its own county roll, and may open fraud referrals."
    identity: "entity_backed:County"
    exclusive_operations:
      - "POST /signature-batches/{batch_id}/verify-affidavit"
      - "POST /signature-records/{signature_record_id}/validate"
    shared_operations:
      - "POST /voter-records and PUT /voter-records/{voter_record_id}/registration-status (with SosAdmin)"
      - "POST /fraud-referrals (with ElectionsExaminer and SosAdmin)"
      - "GET on petitions, circulators, assignments, batches, records, rounds, cure periods, the voter roll and the verification invoice"
    note: "X-User-ID is a County.id. A clerk may only verify or validate work filed with its own county and may only write its own county's roll."

  - name: CirculatorAgent
    description: "The registered circulator acting for itself; completes training, files its disclosure and affidavit, and files batches and lines it circulated."
    identity: "entity_backed:Circulator"
    exclusive_operations: []
    shared_operations:
      - "POST /circulators/{circulator_id}/training (with SosAdmin)"
      - "PUT /circulators/{circulator_id}/paid-disclosure (with SosAdmin)"
      - "POST /circulators/{circulator_id}/affidavit (with SosAdmin)"
      - "POST /signature-batches and POST /signature-batches/{batch_id}/signatures (with Proponent)"
      - "GET on circulators, assignments, batches and petitions"
    note: "X-User-ID is a Circulator.id. The agent may only act on itself and may only file batches whose circulator_id equals its own id."

  - name: Challenger
    description: "Any elector or party challenging a pending determination; files a challenge and escalates it to court review."
    identity: "opaque"
    exclusive_operations:
      - "POST /petitions/{petition_id}/challenges"
      - "POST /challenges/{challenge_id}/escalate"
    shared_operations:
      - "GET on petitions, challenges, signature records, rounds, cure periods, fraud referrals and the distribution report"
    note: "Ownership is enforced against Challenge.challenger_user_id for escalation; filing is open to any Challenger while the petition holds a pending determination."
