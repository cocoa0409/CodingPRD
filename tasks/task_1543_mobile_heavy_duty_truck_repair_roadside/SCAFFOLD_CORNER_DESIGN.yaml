  # ---------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request with no X-User-Role / X-User-ID fails 401 before any role, existence, or shape check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: OpsAdmin, captures: { err: $.data.error_id } }
            # NOTE for the test author: send this request with X-User-Role / X-User-ID headers OMITTED;
            # the `as:` above is nominal scaffolding only. The instance name marks it a negative trigger.
          assert:
            - "HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"

      - name: existence_beats_shape_on_missing_resource
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]"]
        distinguishing_aspect: "A triage call to a non-existent call id with a body missing required severity triggers both existence (4) and shape (6): ERR_NOT_FOUND wins. Distinct pair from the Section 1.8 conflicts."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /roadside/service-calls/11111111-2222-4333-8444-555566667777/triage", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (404), not ERR_VALIDATION"

      - name: odometer_regression_on_complete_repair
        claim_type: violation_to_error
        grounds: ["validations[priority=19]", "errors[ERR_ODOMETER_REGRESSION]"]
        distinguishing_aspect: "The odometer monotone rule binds at complete-repair: recording 89500 against vehicle.odometer_miles 90000 fails 422."
        test_recipe:
          setup: ["retail call in REPAIR_IN_PROGRESS; vehicle odometer 90000"]
          setup_api_calls:
            - { call: "POST /roadside/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: OpsAdmin }
            - { call: "POST /roadside/rate-cards", payload: { name: "STD-2026", labor_rate_standard_cents: 14500, labor_rate_master_cents: 17500, after_hours_multiplier_bp: 15000, travel_free_miles: 25, travel_per_mile_cents: 425, travel_time_per_minute_cents: 200, emergency_callout_fee_cents: 25000, parts_tax_rate_bp: 725, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }, as: OpsAdmin, captures: { rc: $.data.id } }
            - { call: "POST /roadside/vehicles", payload: { vin: "1FUJHHDR1LLLW0002", unit_number: "R-01", make: "Kenworth", model: "T680", year: 2020, odometer_miles: 90000 }, as: Dispatcher, captures: { veh: $.data.id } }
            - { call: "POST /roadside/technicians", payload: { full_name: "Tom Standard", employee_code: "T-101", certifications: ["ENGINE"], labor_rate_class: "STANDARD", home_depot_city: "Denver" }, as: OpsAdmin, captures: { t2: $.data.id } }
            - { call: "POST /roadside/technicians/${t2}/set-status", payload: { to_status: "AVAILABLE" }, as: Technician, as_user_id: "${t2}" }
