  - section: complexity_layers
    instances:
      - name: both_occ_rules_demand_exact_version_equality_and_every_guarded_write_bumps_the_parent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.analysis-create-stale-design
          - concurrency_rules.freight-load-create-stale-dealer
          - validations.p8
          - errors.ERR_STALE_DESIGN_VERSION
          - errors.ERR_STALE_DEALER_VERSION
        distinguishing_aspect: "Both declared OCC rules are driven on one fixture, and each is driven by REPLAYING a version that was correct one call earlier - the realistic stale-write shape - rather than by inventing a wrong number. The two rules guard different parents: the analysis create guards BinDesign.version, which the analysis create itself increments even though it writes no BinDesign field the client sent, and the freight-load create guards Dealer.version, which it increments through the staged_kit_count recompute. The second analysis is the interesting case because it changes design_method from ASD to LRFD, so the rejected and accepted calls differ in their computed output (allowable 90.0 / 12 stiffeners versus 101.25 / 11), which proves the 412 was not a duplicate-suppression."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (min wind 95, category A), GrainProfile CORN, CoatingSpec G115, engineer PE-1001."
            - "Dealer Alpha with staging_slots 2 so two PLANNED loads on one window are legal."
