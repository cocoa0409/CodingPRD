  - section: errors
    instances:
      - name: fund_closed_rejects_application_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_FUND_CLOSED]", "validations[priority=22]"]
        distinguishing_aspect: "Creating an application against a CLOSED fund fails with ERR_FUND_CLOSED even though the client is eligible — the fund lifecycle gate, distinct from submission-time QUEUED behavior on an EXHAUSTED fund."
        test_recipe:
          setup: ["ACTIVE client with VERIFIED assessment; fund created and immediately CLOSED (no applications)"]
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "C Co", email: "coord@hub.test", staff_role: "INTAKE_COORDINATOR" }
              as: HubAdmin
