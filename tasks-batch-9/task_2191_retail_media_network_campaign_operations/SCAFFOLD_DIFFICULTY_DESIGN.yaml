        grounds:
          - calculations.auction_settlement_amount
          - calculations.second_price_clearing
          - calculations.relevance_score_composition
          - entities.EngagementEvent.fields.billable_cents
          - entities.EngagementEvent.fields.event_type
          - entities.EngagementEvent.fields.occurred_at
          - entities.AuctionEvent.fields.settled_spend_cents
          - entities.AuctionEvent.fields.clearing_price_cents
          - entities.LineItem.fields.bid_type
          - entities.LineItem.fields.spend_cents
          - state_machines.AuctionEvent.AWARDED_to_SETTLED
          - validations[priority=49]
          - validations[priority=69]
        distinguishing_aspect: |
          Mode (b) — the scaffold pins sum-then-round at the auction level and then distributes the residue, so six CPM impressions at clearing_price_cents 1250 must produce settled_spend_cents == round_half_up(1250 * 6 / 1000) == round_half_up(7.5) == 8 with per-event billable_cents [2, 2, 1, 1, 1, 1] ordered by occurred_at ASC, whereas rounding each event first (round_half_up(1.25) == 1 per event) totals only 6 — a two-cent difference produced purely by rounding order, and the interleaved CLICK stays at 0 because CLICK is not billable under CPM.
