            - "${ops_read_total} == 1  # OperationsAdmin holds every GET, so the write refusal is not a read refusal"

  # ===========================================================================
  # Section 8 - cross_cutting_complexity_layers
  #
  # §0.2 declares four layers: optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation and rate_threshold_triggers. Each of the five
  # §1.2.1 concurrency_rules gets its own stale-version instance driven from its
  # declared write_endpoint and occ_field. The envelope, pagination and ordering
  # contracts of §1.0 and the (absent) idempotency contract are pinned here too.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: cc_occ_stale_partner_version_refuses_the_status_change
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.partner-status-change-stale-partner
          - validations.occ-partner-version
          - errors[ERR_STALE_PARTNER_VERSION]
          - endpoints[POST /partners/{partnerId}/status-changes]
        distinguishing_aspect: "The reinstatement carrying the pre-suspension expected_partner_version is refused with ERR_STALE_PARTNER_VERSION (412) even though SUSPENDED -> ACTIVE is a legal transition, and the identical body with the current version succeeds; the refusal itself bumps nothing."
        test_recipe:
          setup:
            - "One partner with one AVAILABLE product, activated and then suspended, clock 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
              as_user_id: "pa-001"
            - call: "POST /partners"
              payload: { name: "Cascadia Water", utility_type: "WATER", state_code: "OR", brand_approval_required: true, min_days_between_drops: 21, max_mailings_per_year: 2, rate_filing_required: false, bill_insert_supported: true }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { partner_id: $.data.id, v_created: $.data.version, created_status: $.data.status }
            - call: "POST /service-line-products"
              payload: { partner_id: "${partner_id}", name: "Water Line Protect", line_type: "WATER_SERVICE_LINE", ownership_boundary: "CURB_STOP", required_owned_segment: "WATER_CURB_STOP_TO_HOME", monthly_price_cents: 2499, waiting_period_days: 30, per_occurrence_cap_cents: 800000, annual_cap_cents: 1000000, permit_covered: true, restoration_covered_scope: "BASIC_BACKFILL", cap_reset_basis: "ENROLLMENT_ANNIVERSARY" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { product_id: $.data.id }
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { v_after_filing: $.data.version }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Product filed and onboarding complete.", expected_partner_version: "${v_after_filing}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { v_active: $.data.version }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "SUSPENDED", reason: "Marketing paused pending a disclosure review.", expected_partner_version: "${v_active}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { v_suspended: $.data.version, suspended_status: $.data.status }
          trigger:
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Reinstated from the pre-suspension snapshot.", expected_partner_version: "${v_active}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { e_id: $.data.error_id }
            - call: "GET /partners/${partner_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { v_after_refusal: $.data.version, status_after_refusal: $.data.status }
            - call: "POST /partners/${partner_id}/status-changes"
              payload: { target_status: "ACTIVE", reason: "Reinstated from the current snapshot.", expected_partner_version: "${v_suspended}" }
              as: PlatformAdmin
              as_user_id: "pa-001"
              captures: { ok_status: $.data.status, ok_version: $.data.version, ok_reason: $.data.suspension_reason }
          assert:
            - "${created_status} == ONBOARDING and ${v_created} == 1"
            - "${v_after_filing} == 1  # §1.5 GAP: POST /service-line-products declares no UtilityPartner.version increment, yet §1.2.1 partner-status-change-stale-partner says a product filing bumps it; the endpoint side-effect list is authoritative here, so the activation still passes with expected_partner_version 1"
            - "${v_active} == 2 and ${v_suspended} == 3 and ${suspended_status} == SUSPENDED"
            - "${e_id} == ERR_STALE_PARTNER_VERSION with HTTP 412  # expected_partner_version 2 against current version 3"
            - "${v_after_refusal} == 3 and ${status_after_refusal} == SUSPENDED  # the refused write is a no-op"
            - "${ok_status} == ACTIVE, ${ok_version} == 4 and ${ok_reason} == null  # the same body with expected_partner_version 3 is accepted"

      - name: cc_occ_stale_premises_version_refuses_the_enrollment
        claim_type: optimistic_concurrency
        grounds:
