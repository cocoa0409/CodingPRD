        as: CDISpecialist
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_LEADING_LANGUAGE
  - name: non_leading_lint_catches_empty_indicators
    claim_type: correct_result
    grounds:
    - calculations.non_leading_lint
    distinguishing_aspect: Empty clinical_indicators array triggers NO_INDICATORS finding.
    test_recipe:
      setup:
      - ACTIVE review, DRAFT query with clinical_indicators=[]
      setup_api_calls:
      - call: POST /api/cdi-programs
        payload:
          facility_name: F
          program_code: P
          baseline_cmi: 1.0
        as: CDIManager
        captures:
          prog: $.data.id
      - call: POST /api/escalation-policies
        payload:
          cdi_program_id: ${prog}
          name: EP
          response_due_periods: 1
          escalation_stage_periods: 1
          max_escalation_stage: 1
          is_default: true
        as: CDIManager
        captures:
          ep: $.data.id
      - call: POST /api/providers
        payload:
          cdi_program_id: ${prog}
          npi: N
          full_name: D
