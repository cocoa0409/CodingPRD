        preconditions: ["ProductionAsset.availability_state == OUTAGE", "ProductionAsset.fuel_contract_id is null or the referenced FuelSupplyContract.status == ACTIVE"]
        side_effects: ["sets ProductionAsset.availability_state = AVAILABLE", "increments ProductionAsset.version by 1"]
      - from: OUTAGE
        to: DERATED
        trigger: "POST /district-energy/production-assets/{asset_id}/availability with availability_state=DERATED"
        actor: SystemController
        preconditions: ["ProductionAsset.availability_state == OUTAGE", "ProductionAsset.derated_capacity_kw > 0"]
        side_effects: ["sets ProductionAsset.availability_state = DERATED", "increments ProductionAsset.version by 1"]

  - entity: LoadForecast
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /district-energy/load-forecasts/{forecast_id}/publish"
        actor: DispatchOperator
        preconditions: ["LoadForecast.forecast_state == DRAFT", "when variant == ACTUAL_WEIGHTED_FINAL both actual_heating_degree_hours and actual_cooling_degree_hours are supplied"]
        side_effects: ["runs calculations.forecast_load_projection", "stores coincident_demand_kw, projected_energy_mwh, contributing_agreement_count, variant_applied", "sets LoadForecast.forecast_state = PUBLISHED", "supersedes any other PUBLISHED LoadForecast with the same loop_id and service_date"]
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: cascade from POST /district-energy/load-forecasts/{forecast_id}/publish for the same loop_id and service_date"
        actor: system
        preconditions: ["LoadForecast.forecast_state == PUBLISHED", "the newly published forecast has the same loop_id and service_date"]
        side_effects: ["sets LoadForecast.forecast_state = SUPERSEDED", "increments LoadForecast.version by 1"]

  - entity: DispatchPlan
    initial_state: DRAFT
    terminal_states: [RECONCILED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/optimize"
        actor: DispatchOperator
        preconditions: ["DispatchPlan.plan_state == DRAFT", "the referenced LoadForecast.forecast_state == PUBLISHED", "at least one ProductionAsset on the loop has availability_state IN {AVAILABLE, DERATED}"]
        side_effects: ["deletes every existing DispatchOrder for this plan", "runs calculations.merit_order_dispatch and creates one DispatchOrder per dispatched asset", "runs calculations.plan_reliability_metrics", "stores allocated_capacity_kw, unserved_demand_kw, total_dispatch_cost, total_emissions_kg, reserve_margin_pct, fuel_diversity_hhi", "increments DispatchPlan.version by 1"]
        note: "self-loop; re-optimizing replaces the previous order set wholesale"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/submit"
        actor: DispatchOperator
        preconditions: ["DispatchPlan.plan_state == DRAFT", "this plan has at least one DispatchOrder", "DispatchPlan.unserved_demand_kw == 0.0"]
        side_effects: ["sets DispatchPlan.plan_state = SUBMITTED", "increments DispatchPlan.version by 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/review with decision=APPROVE"
        actor: SystemController
        preconditions: ["DispatchPlan.plan_state == SUBMITTED", "X-User-ID differs from DispatchPlan.authored_by_user_id", "DispatchPlan.reserve_margin_pct >= MIN_RESERVE_MARGIN_PCT", "DispatchPlan.fuel_diversity_hhi <= MAX_FUEL_DIVERSITY_HHI"]
        side_effects: ["sets DispatchPlan.plan_state = APPROVED", "stores DispatchPlan.reviewed_by_user_id = X-User-ID", "cascades NetworkLoop.posture CONSTRAINED to NORMAL when open_isolation_count == 0", "increments DispatchPlan.version by 1"]
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/review with decision=REJECT"
        actor: SystemController
        preconditions: ["DispatchPlan.plan_state == SUBMITTED", "X-User-ID differs from DispatchPlan.authored_by_user_id"]
        side_effects: ["sets DispatchPlan.plan_state = DRAFT", "stores DispatchPlan.reviewed_by_user_id = X-User-ID", "increments DispatchPlan.version by 1"]
      - from: APPROVED
        to: DRAFT
        trigger: "system event: cascade from POST /district-energy/fuel-supply-contracts/{contract_id}/status with status=SUSPENDED affecting an asset on this plan's loop"
        actor: system
        preconditions: ["DispatchPlan.plan_state == APPROVED", "at least one ProductionAsset referenced by this plan's DispatchOrder rows was cascaded to DERATED or OUTAGE"]
        side_effects: ["sets DispatchPlan.plan_state = DRAFT", "sets DispatchPlan.reviewed_by_user_id = null", "cascades NetworkLoop.posture NORMAL to CONSTRAINED", "increments DispatchPlan.version by 1"]
      - from: APPROVED
        to: COMMITTED
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/commit"
        actor: DispatchOperator
        preconditions: ["DispatchPlan.plan_state == APPROVED", "NetworkLoop.posture == NORMAL", "for every DispatchOrder with discharged_kwh > 0 the referenced ProductionAsset.state_of_charge_kwh >= discharged_kwh"]
        side_effects: ["sets DispatchPlan.plan_state = COMMITTED", "decrements ProductionAsset.state_of_charge_kwh by DispatchOrder.discharged_kwh for every storage order", "increments ProductionAsset.version by 1 for each affected asset", "increments DispatchPlan.version by 1"]
      - from: COMMITTED
        to: DRAFT
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/decommit"
        actor: SystemController
        preconditions: ["DispatchPlan.plan_state == COMMITTED"]
        side_effects: ["sets DispatchPlan.plan_state = DRAFT", "sets DispatchPlan.reviewed_by_user_id = null", "increments ProductionAsset.state_of_charge_kwh by DispatchOrder.discharged_kwh for every storage order, restoring the pre-commit ledger", "increments ProductionAsset.version by 1 for each affected asset", "increments DispatchPlan.version by 1"]
        note: "compensating transition; the storage energy ledger returns to its pre-commit total exactly"
      - from: COMMITTED
        to: RECONCILED
        trigger: "POST /district-energy/dispatch-plans/{plan_id}/reconcile"
        actor: SystemController
        preconditions: ["DispatchPlan.plan_state == COMMITTED", "the referenced LoadForecast.variant_applied == ACTUAL_WEIGHTED_FINAL"]
        side_effects: ["sets DispatchPlan.plan_state = RECONCILED", "increments DispatchPlan.version by 1"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: cascade from POST /district-energy/dispatch-plans creating a newer plan for the same loop_id"
        actor: system
        preconditions: ["DispatchPlan.plan_state == DRAFT"]
        side_effects: ["sets DispatchPlan.plan_state = SUPERSEDED", "increments DispatchPlan.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system event: cascade from POST /district-energy/dispatch-plans creating a newer plan for the same loop_id"
        actor: system
        preconditions: ["DispatchPlan.plan_state == SUBMITTED"]
        side_effects: ["sets DispatchPlan.plan_state = SUPERSEDED", "increments DispatchPlan.version by 1"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system event: cascade from POST /district-energy/dispatch-plans creating a newer plan for the same loop_id"
        actor: system
        preconditions: ["DispatchPlan.plan_state == APPROVED"]
        side_effects: ["sets DispatchPlan.plan_state = SUPERSEDED", "increments DispatchPlan.version by 1"]

  - entity: ConnectionAgreement
    initial_state: PENDING_CAPACITY
    terminal_states: [TERMINATED, WRITTEN_OFF]
    transitions:
      - from: PENDING_CAPACITY
        to: ACTIVE
        trigger: "POST /district-energy/connection-agreements/{agreement_id}/activate"
        actor: BillingAnalyst
        preconditions: ["ConnectionAgreement.contract_state == PENDING_CAPACITY", "NetworkLoop.posture != ISOLATED", "calculations.loop_capacity_reservation_sweep reports no breach for the agreement's service window"]
        side_effects: ["sets ConnectionAgreement.contract_state = ACTIVE", "increases NetworkLoop.committed_reserved_kw by ConnectionAgreement.reserved_capacity_kw", "increments NetworkLoop.version by 1", "increments ConnectionAgreement.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /district-energy/connection-agreements/{agreement_id}/status with contract_state=SUSPENDED"
        actor: BillingAnalyst
        preconditions: ["ConnectionAgreement.contract_state == ACTIVE"]
        side_effects: ["sets ConnectionAgreement.contract_state = SUSPENDED", "leaves NetworkLoop.committed_reserved_kw unchanged because SUSPENDED agreements still hold their reservation", "increments ConnectionAgreement.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /district-energy/connection-agreements/{agreement_id}/status with contract_state=ACTIVE"
        actor: BillingAnalyst
        preconditions: ["ConnectionAgreement.contract_state == SUSPENDED"]
        side_effects: ["sets ConnectionAgreement.contract_state = ACTIVE", "leaves NetworkLoop.committed_reserved_kw unchanged", "increments ConnectionAgreement.version by 1"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /district-energy/connection-agreements/{agreement_id}/status with contract_state=TERMINATED"
        actor: BillingAnalyst
        preconditions: ["ConnectionAgreement.contract_state == ACTIVE"]
        side_effects: ["sets ConnectionAgreement.contract_state = TERMINATED", "decreases NetworkLoop.committed_reserved_kw by ConnectionAgreement.reserved_capacity_kw", "increments NetworkLoop.version by 1", "cascades every MeteringPoint of this agreement whose meter_state IN {INSTALLED, COMMISSIONED} to REMOVED", "cascades billing_state IN_ARREARS to WRITTEN_OFF", "increments ConnectionAgreement.version by 1"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /district-energy/connection-agreements/{agreement_id}/status with contract_state=TERMINATED"
        actor: BillingAnalyst
        preconditions: ["ConnectionAgreement.contract_state == SUSPENDED"]
        side_effects: ["sets ConnectionAgreement.contract_state = TERMINATED", "decreases NetworkLoop.committed_reserved_kw by ConnectionAgreement.reserved_capacity_kw", "increments NetworkLoop.version by 1", "cascades every MeteringPoint of this agreement whose meter_state IN {INSTALLED, COMMISSIONED} to REMOVED", "cascades billing_state IN_ARREARS to WRITTEN_OFF", "increments ConnectionAgreement.version by 1"]
      - from: PENDING_CAPACITY
        to: TERMINATED
        trigger: "POST /district-energy/connection-agreements/{agreement_id}/status with contract_state=TERMINATED"
        actor: BillingAnalyst
        preconditions: ["ConnectionAgreement.contract_state == PENDING_CAPACITY"]
        side_effects: ["sets ConnectionAgreement.contract_state = TERMINATED", "leaves NetworkLoop.committed_reserved_kw unchanged because the reservation was never counted", "increments ConnectionAgreement.version by 1"]
      - from: CURRENT
        to: IN_ARREARS
        trigger: "system event: cascade from POST /district-energy/invoices/{invoice_id}/issue"
        actor: system
        preconditions: ["ConnectionAgreement.billing_state == CURRENT", "recomputed ConnectionAgreement.balance_due > ARREARS_THRESHOLD_AMOUNT"]
        side_effects: ["sets ConnectionAgreement.billing_state = IN_ARREARS", "increments ConnectionAgreement.version by 1"]
        note: "billing dimension, independent of contract_state; initial billing_state is CURRENT"
      - from: IN_ARREARS
        to: CURRENT
        trigger: "system event: cascade from POST /district-energy/invoices/{invoice_id}/payments"
        actor: system
        preconditions: ["ConnectionAgreement.billing_state == IN_ARREARS", "recomputed ConnectionAgreement.balance_due <= ARREARS_THRESHOLD_AMOUNT"]
        side_effects: ["sets ConnectionAgreement.billing_state = CURRENT", "increments ConnectionAgreement.version by 1"]
      - from: IN_ARREARS
        to: WRITTEN_OFF
        trigger: "system event: cascade from POST /district-energy/connection-agreements/{agreement_id}/status with contract_state=TERMINATED"
        actor: system
        preconditions: ["ConnectionAgreement.billing_state == IN_ARREARS", "the contract dimension reached TERMINATED in the same request"]
        side_effects: ["sets ConnectionAgreement.billing_state = WRITTEN_OFF", "increments ConnectionAgreement.version by 1"]

  - entity: MeteringPoint
    initial_state: INSTALLED
    terminal_states: [REMOVED]
    transitions:
      - from: INSTALLED
        to: COMMISSIONED
        trigger: "POST /district-energy/metering-points/{point_id}/commission"
        actor: FieldTechnician
        preconditions: ["MeteringPoint.meter_state == INSTALLED", "the referenced PipeSegment.condition != UNDER_REPAIR"]
        side_effects: ["sets MeteringPoint.meter_state = COMMISSIONED", "increments MeteringPoint.version by 1"]
      - from: COMMISSIONED
        to: REMOVED
        trigger: "POST /district-energy/metering-points/{point_id}/remove, or system cascade from ConnectionAgreement reaching TERMINATED"
        actor: FieldTechnician
        preconditions: ["MeteringPoint.meter_state == COMMISSIONED"]
        side_effects: ["sets MeteringPoint.meter_state = REMOVED", "increments MeteringPoint.version by 1"]
      - from: INSTALLED
        to: REMOVED
        trigger: "POST /district-energy/metering-points/{point_id}/remove, or system cascade from ConnectionAgreement reaching TERMINATED"
        actor: FieldTechnician
        preconditions: ["MeteringPoint.meter_state == INSTALLED"]
        side_effects: ["sets MeteringPoint.meter_state = REMOVED", "increments MeteringPoint.version by 1"]

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /district-energy/invoices/{invoice_id}/issue"
        actor: BillingAnalyst
        preconditions: ["Invoice.invoice_state == DRAFT", "the referenced ConnectionAgreement.contract_state IN {ACTIVE, SUSPENDED}"]
        side_effects: ["sets Invoice.invoice_state = ISSUED", "recomputes ConnectionAgreement.balance_due", "raises ConnectionAgreement.billed_demand_ratchet_kw to Invoice.billed_demand_kw when it is higher", "cascades billing_state CURRENT to IN_ARREARS when balance_due exceeds ARREARS_THRESHOLD_AMOUNT", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]
      - from: ISSUED
        to: ADJUSTED
        trigger: "POST /district-energy/invoices/{invoice_id}/adjust"
        actor: BillingAnalyst
        preconditions: ["Invoice.invoice_state == ISSUED", "the referenced ConnectionAgreement.contract_state IN {ACTIVE, SUSPENDED}"]
        side_effects: ["re-runs calculations.invoice_billing_determinants under the requested variant", "overwrites billed_energy_mwh, billed_demand_kw, load_factor_pct, energy_charge, demand_charge, fixed_charge, total_amount, minimum_bill_applied, variant_applied", "sets Invoice.invoice_state = ADJUSTED", "recomputes ConnectionAgreement.balance_due", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]
      - from: ADJUSTED
        to: ADJUSTED
        trigger: "POST /district-energy/invoices/{invoice_id}/adjust"
        actor: BillingAnalyst
        preconditions: ["Invoice.invoice_state == ADJUSTED", "the referenced ConnectionAgreement.contract_state IN {ACTIVE, SUSPENDED}"]
        side_effects: ["re-runs calculations.invoice_billing_determinants under the requested variant", "overwrites the determinant and charge fields", "recomputes ConnectionAgreement.balance_due", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]
        note: "self-loop; repeated adjustment is permitted and always recomputes from current MeterReading data"
      - from: ISSUED
        to: PAID
        trigger: "POST /district-energy/invoices/{invoice_id}/payments"
        actor: CustomerAccount
        preconditions: ["Invoice.invoice_state == ISSUED", "payment amount equals Invoice.total_amount", "X-User-ID equals Invoice.agreement_id"]
        side_effects: ["sets Invoice.paid_amount = amount", "sets Invoice.invoice_state = PAID", "recomputes ConnectionAgreement.balance_due", "cascades billing_state IN_ARREARS to CURRENT when balance_due is at or below ARREARS_THRESHOLD_AMOUNT", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]
      - from: ADJUSTED
        to: PAID
        trigger: "POST /district-energy/invoices/{invoice_id}/payments"
        actor: CustomerAccount
        preconditions: ["Invoice.invoice_state == ADJUSTED", "payment amount equals Invoice.total_amount", "X-User-ID equals Invoice.agreement_id"]
        side_effects: ["sets Invoice.paid_amount = amount", "sets Invoice.invoice_state = PAID", "recomputes ConnectionAgreement.balance_due", "cascades billing_state IN_ARREARS to CURRENT when balance_due is at or below ARREARS_THRESHOLD_AMOUNT", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]
      - from: DRAFT
        to: VOID
        trigger: "POST /district-energy/invoices/{invoice_id}/void"
        actor: BillingAnalyst
        preconditions: ["Invoice.invoice_state == DRAFT"]
        side_effects: ["sets Invoice.invoice_state = VOID", "increments Invoice.version by 1"]
      - from: ISSUED
        to: VOID
        trigger: "POST /district-energy/invoices/{invoice_id}/void"
        actor: BillingAnalyst
        preconditions: ["Invoice.invoice_state == ISSUED"]
        side_effects: ["sets Invoice.invoice_state = VOID", "recomputes ConnectionAgreement.balance_due", "cascades billing_state IN_ARREARS to CURRENT when balance_due is at or below ARREARS_THRESHOLD_AMOUNT", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]
      - from: ADJUSTED
        to: VOID
        trigger: "POST /district-energy/invoices/{invoice_id}/void"
        actor: BillingAnalyst
        preconditions: ["Invoice.invoice_state == ADJUSTED"]
        side_effects: ["sets Invoice.invoice_state = VOID", "recomputes ConnectionAgreement.balance_due", "cascades billing_state IN_ARREARS to CURRENT when balance_due is at or below ARREARS_THRESHOLD_AMOUNT", "increments ConnectionAgreement.version by 1", "increments Invoice.version by 1"]

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PERMIT_PENDING
        trigger: "POST /district-energy/work-orders/{work_order_id}/submit-permit"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == DRAFT", "calculations.work_window_conflict_detection reports no conflicting window on the same PipeSegment"]
        side_effects: ["sets WorkOrder.work_state = PERMIT_PENDING", "sets WorkOrder.permit_decision = PENDING", "increments WorkOrder.version by 1"]
      - from: PERMIT_PENDING
        to: SCHEDULED
        trigger: "POST /district-energy/work-orders/{work_order_id}/permit-decision with permit_decision=GRANTED"
        actor: NetworkEngineer
        preconditions: ["WorkOrder.work_state == PERMIT_PENDING"]
        side_effects: ["sets WorkOrder.permit_decision = GRANTED", "sets WorkOrder.work_state = SCHEDULED", "increments WorkOrder.version by 1"]
      - from: PERMIT_PENDING
        to: DRAFT
        trigger: "POST /district-energy/work-orders/{work_order_id}/permit-decision with permit_decision=DENIED"
        actor: NetworkEngineer
        preconditions: ["WorkOrder.work_state == PERMIT_PENDING"]
        side_effects: ["sets WorkOrder.permit_decision = DENIED", "sets WorkOrder.work_state = DRAFT", "increments WorkOrder.version by 1"]
        note: "revert edge; the order returns to DRAFT and may be re-submitted after the window is changed"
      - from: SCHEDULED
        to: EXCAVATING
        trigger: "POST /district-energy/work-orders/{work_order_id}/begin-excavation"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == SCHEDULED", "WorkOrder.permit_decision == GRANTED", "when WorkOrder.requires_isolation == true no DispatchPlan on the loop has plan_state == COMMITTED", "the logical clock is at or after WorkOrder.window_start and at or before WorkOrder.window_end"]
        side_effects: ["sets WorkOrder.work_state = EXCAVATING", "cascades PipeSegment.condition to UNDER_REPAIR", "when requires_isolation is true cascades NetworkLoop.posture to ISOLATED and increments NetworkLoop.open_isolation_count by 1", "increments WorkOrder.version by 1"]
      - from: EXCAVATING
        to: REPAIRING
        trigger: "POST /district-energy/work-orders/{work_order_id}/begin-repair"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == EXCAVATING"]
        side_effects: ["sets WorkOrder.work_state = REPAIRING", "increments WorkOrder.version by 1"]
      - from: REPAIRING
        to: BACKFILLED
        trigger: "POST /district-energy/work-orders/{work_order_id}/backfill"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == REPAIRING"]
        side_effects: ["sets WorkOrder.work_state = BACKFILLED", "increments WorkOrder.version by 1"]
      - from: BACKFILLED
        to: COMPLETED
        trigger: "POST /district-energy/work-orders/{work_order_id}/complete"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == BACKFILLED", "X-User-ID differs from WorkOrder.reported_by_user_id"]
        side_effects: ["sets WorkOrder.work_state = COMPLETED", "stores WorkOrder.completed_by_user_id = X-User-ID", "cascades PipeSegment out of UNDER_REPAIR into the band implied by its recomputed leak_risk_score", "decrements NetworkLoop.open_isolation_count by 1 when requires_isolation is true", "cascades NetworkLoop.posture ISOLATED to NORMAL or CONSTRAINED", "increments WorkOrder.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /district-energy/work-orders/{work_order_id}/cancel"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == DRAFT"]
        side_effects: ["sets WorkOrder.work_state = CANCELLED", "increments WorkOrder.version by 1"]
      - from: PERMIT_PENDING
        to: CANCELLED
        trigger: "POST /district-energy/work-orders/{work_order_id}/cancel"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == PERMIT_PENDING"]
        side_effects: ["sets WorkOrder.work_state = CANCELLED", "increments WorkOrder.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /district-energy/work-orders/{work_order_id}/cancel"
        actor: FieldTechnician
        preconditions: ["WorkOrder.work_state == SCHEDULED"]
        side_effects: ["sets WorkOrder.work_state = CANCELLED", "increments WorkOrder.version by 1"]

  - entity: ExpansionProject
    initial_state: SCREENING
    terminal_states: [REJECTED, CONVERTED]
    transitions:
      - from: SCREENING
        to: SIZED
        trigger: "POST /district-energy/expansion-projects/{project_id}/size"
        actor: NetworkEngineer
        preconditions: ["ExpansionProject.project_state == SCREENING", "calculations.expansion_sizing_and_npv finds at least one feasible standard diameter"]
        side_effects: ["stores selected_diameter_mm, design_flow_m3_per_h, estimated_capex, annual_net_margin, npv", "sets ExpansionProject.project_state = SIZED", "increments ExpansionProject.version by 1"]
      - from: SIZED
        to: SIZED
        trigger: "POST /district-energy/expansion-projects/{project_id}/size"
        actor: NetworkEngineer
        preconditions: ["ExpansionProject.project_state == SIZED", "calculations.expansion_sizing_and_npv finds at least one feasible standard diameter"]
        side_effects: ["overwrites selected_diameter_mm, design_flow_m3_per_h, estimated_capex, annual_net_margin, npv", "increments ExpansionProject.version by 1"]
        note: "self-loop; re-sizing after a route or capacity revision"
      - from: SIZED
        to: APPROVED
        trigger: "POST /district-energy/expansion-projects/{project_id}/decision with decision=APPROVE"
        actor: SystemController
        preconditions: ["ExpansionProject.project_state == SIZED", "ExpansionProject.npv >= 0.0"]
        side_effects: ["sets ExpansionProject.project_state = APPROVED", "increments ExpansionProject.version by 1"]
      - from: SIZED
        to: REJECTED
        trigger: "POST /district-energy/expansion-projects/{project_id}/decision with decision=REJECT"
        actor: SystemController
        preconditions: ["ExpansionProject.project_state == SIZED"]
        side_effects: ["sets ExpansionProject.project_state = REJECTED", "increments ExpansionProject.version by 1"]
      - from: APPROVED
        to: CONVERTED
        trigger: "POST /district-energy/expansion-projects/{project_id}/convert"
        actor: BillingAnalyst
        preconditions: ["ExpansionProject.project_state == APPROVED"]
        side_effects: ["creates a ConnectionAgreement on the same loop_id and rate_schedule_id with contract_state PENDING_CAPACITY", "sets ExpansionProject.project_state = CONVERTED", "increments ExpansionProject.version by 1"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /district-energy/expansion-projects/{project_id}/decision with decision=REJECT"
        actor: SystemController
        preconditions: ["ExpansionProject.project_state == APPROVED"]
        side_effects: ["sets ExpansionProject.project_state = REJECTED", "increments ExpansionProject.version by 1"]

concurrency_rules:
  - rule_id: dispatch-plan-create-stale-loop
    parent_entity: NetworkLoop
    write_endpoint: "POST /district-energy/dispatch-plans"
    occ_field: "expected_loop_version"
    description: |
      Creating a DispatchPlan for a NetworkLoop whose version has advanced past
      the value the client last read is rejected. Plan creation legitimately
      supersedes every non-terminal plan on the loop, so a second sequential
      create carrying an outdated expected_loop_version would silently discard a
      plan the client never observed; the stale-version check rejects it instead.
    error_id: ERR_STALE_LOOP_VERSION
    http_status: 412
  - rule_id: invoice-create-stale-agreement
    parent_entity: ConnectionAgreement
    write_endpoint: "POST /district-energy/invoices"
    occ_field: "expected_agreement_version"
    description: |
      Creating an Invoice against a ConnectionAgreement whose version has
      advanced past the value the client last read is rejected. Invoice creation
      reads billed_demand_ratchet_kw and balance_due off the agreement, both of
      which are rewritten by issue, adjust, payment and status cascades, so a
      create carrying an outdated expected_agreement_version would bill against
      determinants the client never observed.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

calculations:
  - name: forecast_load_projection
    trigger: "POST /district-energy/load-forecasts/{forecast_id}/publish (LoadForecast DRAFT to PUBLISHED)"
    algorithm: forward_looking
    formula: |
      OCC = OCCUPANCY_FACTOR[forecast.occupancy_profile]
      if variant == WEATHER_NORMAL_PROVISIONAL:
          hdh = forecast.heating_degree_hours
          cdh = forecast.cooling_degree_hours
      else:                                   # ACTUAL_WEIGHTED_FINAL
          hdh = round(ACTUAL_WEIGHT * forecast.actual_heating_degree_hours
                      + (1 - ACTUAL_WEIGHT) * forecast.heating_degree_hours, 2)
          cdh = round(ACTUAL_WEIGHT * forecast.actual_cooling_degree_hours
                      + (1 - ACTUAL_WEIGHT) * forecast.cooling_degree_hours, 2)
      weather_kw = round(hdh * HDH_KW_PER_DEGREE_HOUR + cdh * CDH_KW_PER_DEGREE_HOUR, 2)
      # per-agreement contributions are each rounded to 2 decimals BEFORE they are summed,
      # walking the input set in created_at ASC order
      contributions = []
      for A in input_set ordered by created_at ASC:
          contributions.append(round(A.reserved_capacity_kw
                                     * CLASS_DIVERSITY_FACTOR[A.customer_class] * OCC, 2))
      diversified_kw = sum(contributions)
      coincident_demand_kw = round((diversified_kw + weather_kw) * (1 + DISTRIBUTION_LOSS_FACTOR), 2)
      projected_energy_mwh = round(coincident_demand_kw * DISPATCH_BLOCK_HOURS
                                   * FORECAST_LOAD_FACTOR / 1000, 3)
      contributing_agreement_count = count(input_set)
    input_set: "ConnectionAgreement rows where loop_id == forecast.loop_id AND contract_state == ACTIVE AND service_start_date <= forecast.service_date AND service_end_date > forecast.service_date; walked in created_at ASC order"
    constants:
      OCCUPANCY_FACTOR: { WEEKDAY_FULL: 1.00, WEEKEND_REDUCED: 0.72, HOLIDAY_MINIMAL: 0.45 }
      CLASS_DIVERSITY_FACTOR: { RESIDENTIAL_MULTIFAMILY: 0.62, COMMERCIAL_OFFICE: 0.78, HOSPITAL: 0.90, UNIVERSITY: 0.70, INDUSTRIAL_PROCESS: 0.95 }
      HDH_KW_PER_DEGREE_HOUR: 3.5
      CDH_KW_PER_DEGREE_HOUR: 2.8
      DISTRIBUTION_LOSS_FACTOR: 0.08
      DISPATCH_BLOCK_HOURS: 24
      FORECAST_LOAD_FACTOR: 0.62
      ACTUAL_WEIGHT: 0.70
    precision: "per-agreement contribution and weather_kw 2 decimals round_half_up, rounded before summation; coincident_demand_kw 2 decimals round_half_up; projected_energy_mwh 3 decimals round_half_up"
    variants:
      - name: WEATHER_NORMAL_PROVISIONAL
        when: "publish is called with variant=WEATHER_NORMAL_PROVISIONAL; the weather-normal degree hours stored on the forecast are used unchanged"
        difference: "ignores actual_heating_degree_hours and actual_cooling_degree_hours entirely"
      - name: ACTUAL_WEIGHTED_FINAL
        when: "publish is called with variant=ACTUAL_WEIGHTED_FINAL and both actual degree-hour fields are supplied"
        difference: "blends actuals and weather-normals at ACTUAL_WEIGHT before the weather adder is computed, and the blended degree hours are themselves rounded to 2 decimals first"

  - name: merit_order_dispatch
    trigger: "POST /district-energy/dispatch-plans/{plan_id}/optimize (DispatchPlan DRAFT to DRAFT)"
    algorithm: waterfall_allocation
    formula: |
      ranked = input_set sorted by (marginal_cost_per_mwh ASC,
                                    emission_factor_kg_per_mwh ASC,
                                    created_at ASC)
      remaining_kw = LoadForecast.coincident_demand_kw
      rank = 0
      for asset in ranked:
          if asset.asset_type == THERMAL_STORAGE:
              # nameplate sizing: the planning horizon uses storage_capacity_kwh,
              # NOT the live state_of_charge_kwh, which is only checked at commit
              effective_kw = min(asset.rated_capacity_kw,
                                 round(asset.storage_capacity_kwh / STORAGE_DISCHARGE_HOURS, 2))
          elif asset.availability_state == DERATED:
              effective_kw = asset.derated_capacity_kw
          else:
              effective_kw = asset.rated_capacity_kw
          block_kw = min(effective_kw, remaining_kw)
          if block_kw <= 0.0:                        continue
          if block_kw < asset.min_stable_output_kw:   continue    # strict <, so block_kw == min_stable_output_kw dispatches
          rank = rank + 1
          hours = STORAGE_DISCHARGE_HOURS if asset.asset_type == THERMAL_STORAGE
                  else DISPATCH_BLOCK_HOURS
          block_energy_mwh   = round(block_kw * hours / 1000, 3)
          discharged_kwh     = round(block_kw * STORAGE_DISCHARGE_HOURS, 2)
                               if asset.asset_type == THERMAL_STORAGE else 0.0
          order_cost         = round(block_energy_mwh * asset.marginal_cost_per_mwh, 2)
          order_emissions_kg = round(block_energy_mwh * asset.emission_factor_kg_per_mwh, 2)
          emit DispatchOrder(merit_rank=rank, allocated_kw=block_kw, block_energy_mwh,
                             discharged_kwh, order_cost, order_emissions_kg)
          remaining_kw = round(remaining_kw - block_kw, 2)
          if remaining_kw <= 0.0: break
      unserved_demand_kw     = max(remaining_kw, 0.0)
      allocated_capacity_kw  = round(sum of DispatchOrder.allocated_kw, 2)
      total_dispatch_cost    = round(sum of DispatchOrder.order_cost, 2)
      total_emissions_kg     = round(sum of DispatchOrder.order_emissions_kg, 2)
    input_set: "ProductionAsset rows where loop_id == plan.loop_id AND availability_state IN {AVAILABLE, DERATED} AND (fuel_contract_id is null OR the referenced FuelSupplyContract.status IN {ACTIVE, SUSPENDED}); empty candidate set raises ERR_NO_ELIGIBLE_ASSETS"
    constants:
      DISPATCH_BLOCK_HOURS: 24
      STORAGE_DISCHARGE_HOURS: 4
    precision: "allocated_kw and discharged_kwh 2 decimals round_half_up; block_energy_mwh 3 decimals round_half_up; order_cost and order_emissions_kg 2 decimals round_half_up, each rounded per order before the plan totals are summed"

  - name: plan_reliability_metrics
    trigger: "POST /district-energy/dispatch-plans/{plan_id}/optimize (DispatchPlan DRAFT to DRAFT), immediately after merit_order_dispatch"
    algorithm: threshold
    formula: |
      eligible = merit_order_dispatch.input_set for this plan
      effective_kw(asset) is defined exactly as in merit_order_dispatch
      available_kw   = round(sum over eligible of effective_kw(asset), 2)
      largest_kw     = max over eligible of effective_kw(asset)
                       # tie-break: the tied asset with the earliest created_at
      n1_available_kw = round(available_kw - largest_kw, 2)
      demand_kw      = LoadForecast.coincident_demand_kw
      reserve_margin_pct = 0.0 if demand_kw == 0.0 else
                           round((n1_available_kw - demand_kw) / demand_kw * 100, 2)
      # fuel concentration over the plan's dispatched energy
      for each DispatchOrder O of this plan:
          fuel_key(O) = FuelSupplyContract.fuel_type of O.asset when asset.fuel_contract_id is not null,
                        else the literal key STORAGE
      total_mwh = round(sum over O of O.block_energy_mwh, 3)
      fuel_diversity_hhi = 0.0 if total_mwh == 0.0 else
                           round(sum over distinct fuel_key k of
                                 (round(sum of block_energy_mwh with fuel_key k, 3) / total_mwh) ** 2, 4)
    input_set: "same eligible ProductionAsset set as merit_order_dispatch for available_kw and largest_kw; the plan's own DispatchOrder rows for the HHI"
    constants:
      MIN_RESERVE_MARGIN_PCT: 15.0
      MAX_FUEL_DIVERSITY_HHI: 0.55
    precision: "available_kw and n1_available_kw 2 decimals round_half_up; reserve_margin_pct 2 decimals round_half_up; fuel_diversity_hhi 4 decimals round_half_up"

  - name: invoice_billing_determinants
    trigger: "POST /district-energy/invoices (Invoice created in DRAFT) and POST /district-energy/invoices/{invoice_id}/adjust (Invoice ISSUED to ADJUSTED and ADJUSTED to ADJUSTED)"
    algorithm: tiered_pricing
    formula: |
      S1  readings = input_set ordered by read_at ASC, then created_at ASC
      S2  if count(readings) < 2 -> ERR_INSUFFICIENT_METER_DATA
      S3  for each MeteringPoint p contributing at least two readings:
              raw_delta(p) = last(p).cumulative_energy_mwh - first(p).cumulative_energy_mwh
      S4      point_energy(p) = round(raw_delta(p) * p.multiplier, 3)
      S5  billed_energy_mwh = round(sum over p of point_energy(p), 3)   # per-point rounding first
      S6  metered_peak_kw = max over readings of peak_demand_kw
                            # tie-break: the tied reading with the earliest read_at
      S7  reserved_floor_kw = round(agreement.reserved_capacity_kw * RESERVED_FLOOR_PCT, 2)
      S8  ratchet_kw = 0.0 if variant == ESTIMATED
                       else agreement.billed_demand_ratchet_kw
      S9  billed_demand_kw = round(max(metered_peak_kw, reserved_floor_kw, ratchet_kw), 2)
      S10 period_hours = (period_end - period_start) expressed in whole hours
          load_factor_pct = 0.0 if billed_demand_kw == 0.0 else
                            round(billed_energy_mwh * 1000
                                  / (billed_demand_kw * period_hours) * 100, 2)
      S11 tier = the first entry of RateSchedule.tiers, walked by load_factor_max ASC,
                 whose load_factor_max >= load_factor_pct; when none qualifies, the last entry
          energy_charge = round(billed_energy_mwh * tier.energy_rate_per_mwh, 2)
          demand_charge = round(billed_demand_kw * rate.demand_charge_per_kw, 2)
          fixed_charge  = rate.fixed_service_charge
      S12 subtotal = round(energy_charge + demand_charge + fixed_charge, 2)
          if subtotal < rate.minimum_bill_amount:
              total_amount = rate.minimum_bill_amount ; minimum_bill_applied = true
          else:
              total_amount = subtotal ; minimum_bill_applied = false
    input_set: "MeterReading rows whose point_id belongs to a MeteringPoint of this agreement with meter_state IN {COMMISSIONED, REMOVED}, and whose read_at >= Invoice.period_start and read_at < Invoice.period_end; the ESTIMATED variant admits read_type IN {ACTUAL, ESTIMATED} while ACTUAL_TRUE_UP admits only read_type == ACTUAL"
    constants:
      RESERVED_FLOOR_PCT: 0.50
      ARREARS_THRESHOLD_AMOUNT: 25000.00
    precision: "point_energy and billed_energy_mwh 3 decimals round_half_up, per-point rounding before summation; billed_demand_kw, load_factor_pct and every charge 2 decimals round_half_up; the subtotal is rounded before the minimum-bill comparison"
    variants:
      - name: ESTIMATED
        when: "the invoice is created or adjusted with variant=ESTIMATED, typically before the actual register read lands"
        difference: "admits ESTIMATED read_type readings into the input set AND treats the agreement's billed_demand_ratchet_kw as 0.0, so the demand determinant floors at reserved_floor_kw only"
      - name: ACTUAL_TRUE_UP
        when: "the invoice is created or adjusted with variant=ACTUAL_TRUE_UP once ACTUAL register reads exist"
        difference: "restricts the input set to read_type == ACTUAL AND applies the agreement's billed_demand_ratchet_kw as a third floor on billed_demand_kw"

  - name: segment_leak_risk_score
    trigger: "POST /district-energy/pipe-segments/{segment_id}/condition-assessment, and the PipeSegment UNDER_REPAIR cascade of POST /district-energy/work-orders/{work_order_id}/complete"
    algorithm: weighted_scoring
    formula: |
      age_years        = calendar year of the logical clock - segment.install_year
      age_component    = round(min(age_years / AGE_FULL_YEARS, 1.0) * 100, 2)
      makeup_component = round(min(segment.makeup_water_ratio / MAKEUP_FULL_RATIO, 1.0) * 100, 2)
      hist_component   = round(min(segment.historical_leak_count / HIST_FULL_COUNT, 1.0) * 100, 2)
      insul_component  = round(INSULATION_PENALTY[segment.insulation_class] * 100, 2)
      leak_risk_score  = round(W_AGE * age_component + W_MAKEUP * makeup_component
                               + W_HIST * hist_component + W_INSUL * insul_component, 2)
      condition = SUSPECT   if leak_risk_score >= SUSPECT_SCORE_FLOOR
                  MONITORED if leak_risk_score >= MONITORED_SCORE_FLOOR
                  SOUND     otherwise
    input_set: "the single PipeSegment being assessed; no other entity contributes"
    constants:
      W_AGE: 0.35
      W_MAKEUP: 0.30
      W_HIST: 0.20
      W_INSUL: 0.15
      AGE_FULL_YEARS: 60
      MAKEUP_FULL_RATIO: 0.05
      HIST_FULL_COUNT: 3
      INSULATION_PENALTY: { A: 0.10, B: 0.45, C: 0.85 }
      MONITORED_SCORE_FLOOR: 45.0
      SUSPECT_SCORE_FLOOR: 70.0
    precision: "each of the four components is rounded to 2 decimals round_half_up before the weighted sum; leak_risk_score 2 decimals round_half_up; band comparisons use >= against the floors"

  - name: loop_capacity_reservation_sweep
    trigger: "POST /district-energy/connection-agreements/{agreement_id}/activate (ConnectionAgreement PENDING_CAPACITY to ACTIVE)"
    algorithm: interval_merge
    formula: |
      ceiling_kw = round(loop.rated_capacity_kw * OVERSUBSCRIPTION_FACTOR, 2)
      peers = input_set
      windows = peers plus the candidate agreement, each treated as the
                half-open interval [service_start_date, service_end_date)
      boundaries = sorted ascending distinct list of every service_start_date in windows
      for b in boundaries:
          concurrent = every w in windows with w.service_start_date <= b < w.service_end_date
          total_kw = round(sum over concurrent of reserved_capacity_kw, 2)
          if total_kw > ceiling_kw:          # strict >, equality is allowed
              breach at b -> ERR_LOOP_CAPACITY_EXCEEDED
      no breach at any boundary -> the activation proceeds
    input_set: "ConnectionAgreement rows where loop_id == candidate.loop_id AND contract_state IN {ACTIVE, SUSPENDED} AND id != candidate.id"
    constants:
      OVERSUBSCRIPTION_FACTOR: 1.15
    precision: "ceiling_kw and total_kw 2 decimals round_half_up; interval boundaries are half-open, so an agreement ending exactly at b does not overlap one starting at b"

  - name: work_window_conflict_detection
    trigger: "POST /district-energy/work-orders/{work_order_id}/submit-permit (WorkOrder DRAFT to PERMIT_PENDING)"
    algorithm: interval_merge
    formula: |
      for peer in input_set:
          peer_effective_end      = peer.window_end + REFILL_BUFFER_HOURS
          candidate_effective_end = candidate.window_end + REFILL_BUFFER_HOURS
          conflict when candidate.window_start <= peer_effective_end
                    AND peer.window_start <= candidate_effective_end
      any conflict -> ERR_WORK_WINDOW_CONFLICT
    input_set: "WorkOrder rows where segment_id == candidate.segment_id AND work_state IN {PERMIT_PENDING, SCHEDULED, EXCAVATING, REPAIRING, BACKFILLED} AND id != candidate.id"
    constants:
      REFILL_BUFFER_HOURS: 6
    precision: "window comparisons are closed on both ends and each window_end is extended by REFILL_BUFFER_HOURS whole hours before the overlap test; a candidate starting exactly at a peer's buffered end conflicts"

  - name: expansion_sizing_and_npv
    trigger: "POST /district-energy/expansion-projects/{project_id}/size (ExpansionProject SCREENING to SIZED and SIZED to SIZED)"
    algorithm: constraint_propagation
    formula: |
      design_flow_m3_per_h = round(project.requested_capacity_kw
                                   / (FLOW_COEFF_KW_PER_M3H_K * project.design_delta_t_c), 3)
      for d in STANDARD_DIAMETERS_MM walked ascending:
          area_m2      = round(PI * (d / 1000) ** 2 / 4, 6)
          velocity_m_s = round(design_flow_m3_per_h / 3600 / area_m2, 4)
          drop_kpa_km  = round(FRICTION_COEFF * velocity_m_s ** 2 / (d / 1000) * 1000, 2)
          feasible(d)  = velocity_m_s <= MAX_VELOCITY_M_S
                         AND drop_kpa_km <= MAX_PRESSURE_DROP_KPA_PER_KM
      selected_diameter_mm = the smallest feasible d; when no d is feasible -> ERR_NO_FEASIBLE_PIPE_SIZE
      estimated_capex = round(selected_diameter_mm * project.route_length_m * COST_PER_MM_PER_M
                              + CONNECTION_FIXED_CAPEX, 2)
      fallback_tier   = the entry of RateSchedule.tiers with the largest load_factor_max
      annual_revenue  = round(project.assumed_annual_energy_mwh * fallback_tier.energy_rate_per_mwh
                              + project.requested_capacity_kw * rate.demand_charge_per_kw * 12
                              + rate.fixed_service_charge * 12, 2)
      annual_variable_cost = round(project.assumed_annual_energy_mwh
                                   * project.assumed_marginal_cost_per_mwh, 2)
      annual_fixed_opex    = round(estimated_capex * ANNUAL_OPEX_RATE, 2)
      annual_net_margin    = round(annual_revenue - annual_variable_cost - annual_fixed_opex, 2)
      npv = round(annual_net_margin * PV_ANNUITY_FACTOR_20Y_6PCT - estimated_capex, 2)
    input_set: "the single ExpansionProject being sized plus the RateSchedule referenced by its rate_schedule_id"
    constants:
      FLOW_COEFF_KW_PER_M3H_K: 1.163
      PI: 3.14159265
      FRICTION_COEFF: 0.01
      STANDARD_DIAMETERS_MM: [80, 100, 125, 150, 200, 250, 300, 400]
      MAX_VELOCITY_M_S: 2.0
      MAX_PRESSURE_DROP_KPA_PER_KM: 100.0
      COST_PER_MM_PER_M: 9.5
      CONNECTION_FIXED_CAPEX: 85000.00
      ANNUAL_OPEX_RATE: 0.025
      PV_ANNUITY_FACTOR_20Y_6PCT: 11.46992122
    precision: "design_flow_m3_per_h 3 decimals round_half_up; area_m2 6 decimals; velocity_m_s 4 decimals; drop_kpa_km, capex, revenue, cost, margin and npv 2 decimals round_half_up; the 20-year 6 percent discounting is pinned to the PV_ANNUITY_FACTOR_20Y_6PCT constant rather than a per-year loop"

  - name: loop_emissions_efficiency_summary
    trigger: "GET /district-energy/network-loops/{loop_id}/emissions-summary"
    algorithm: aggregation
    formula: |
      orders = every DispatchOrder whose plan_id belongs to input_set
      total_energy_mwh   = round(sum over orders of block_energy_mwh, 3)
      total_emissions_kg = round(sum over orders of order_emissions_kg, 2)
      delivered_energy_mwh = round(total_energy_mwh * (1 - DISTRIBUTION_LOSS_FACTOR), 3)
      system_efficiency_pct = 0.0 if total_energy_mwh == 0.0 else
                              round(delivered_energy_mwh / total_energy_mwh * 100, 2)
      emissions_intensity_kg_per_mwh = 0.0 if delivered_energy_mwh == 0.0 else
                              round(total_emissions_kg / delivered_energy_mwh, 2)
      target_gap_kg_per_mwh = round(emissions_intensity_kg_per_mwh
                                    - CITY_TARGET_KG_PER_MWH, 2)
      climate_goal_status = COMPLIANT if target_gap_kg_per_mwh <= 0.0 else EXCEEDING
    input_set: "DispatchPlan rows where loop_id == the path loop AND plan_state IN {COMMITTED, RECONCILED}; DRAFT, SUBMITTED, APPROVED and SUPERSEDED plans are excluded"
    constants:
      DISTRIBUTION_LOSS_FACTOR: 0.08
      CITY_TARGET_KG_PER_MWH: 150.0
    precision: "energy figures 3 decimals round_half_up, emissions and intensity 2 decimals round_half_up; the compliance comparison is <= 0.0 on target_gap_kg_per_mwh"

  - name: agreement_balance_ledger
    trigger: "cascades of POST /district-energy/invoices/{invoice_id}/issue, POST /district-energy/invoices/{invoice_id}/adjust, POST /district-energy/invoices/{invoice_id}/payments and POST /district-energy/invoices/{invoice_id}/void"
    algorithm: aggregation
    formula: |
      balance_due = round(sum over input_set of Invoice.total_amount, 2)
      billed_demand_ratchet_kw = max(agreement.billed_demand_ratchet_kw,
                                     the issuing Invoice.billed_demand_kw)
                                 # only raised, never lowered, and only on the DRAFT to ISSUED edge
      billing_state cascade: CURRENT to IN_ARREARS when balance_due > ARREARS_THRESHOLD_AMOUNT,
                             IN_ARREARS to CURRENT when balance_due <= ARREARS_THRESHOLD_AMOUNT
    input_set: "Invoice rows where agreement_id == this agreement AND invoice_state IN {ISSUED, ADJUSTED}; DRAFT, PAID and VOID invoices are excluded"
    constants:
      ARREARS_THRESHOLD_AMOUNT: 25000.00
    precision: "balance_due 2 decimals round_half_up; the arrears comparison is strict > on entry and <= on exit"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID request headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in the RBAC matrix and that role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body and query parameters conform to the endpoint input schema: required fields present, enum members valid, numbers within their declared ranges, limit within 1..100, offset >= 0, window_end > window_start, period_end > period_start, service_end_date > service_start_date, tiers non-empty with strictly increasing load_factor_max"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 4
    category: existence
    check: "NetworkLoop named by a path id exists"
    error_id: ERR_LOOP_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/network-loops/{loop_id}, GET /district-energy/network-loops/{loop_id}/emissions-summary"
  - priority: 4
    category: existence
    check: "PipeSegment named by a path id exists"
    error_id: ERR_SEGMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/pipe-segments/{segment_id}, POST /district-energy/pipe-segments/{segment_id}/condition-assessment"
  - priority: 4
    category: existence
    check: "FuelSupplyContract named by a path id exists"
    error_id: ERR_FUEL_CONTRACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/fuel-supply-contracts/{contract_id}, POST /district-energy/fuel-supply-contracts/{contract_id}/status"
  - priority: 4
    category: existence
    check: "ProductionAsset named by a path id exists"
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/production-assets/{asset_id}, POST /district-energy/production-assets/{asset_id}/availability"
  - priority: 4
    category: existence
    check: "LoadForecast named by a path id exists"
    error_id: ERR_FORECAST_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/load-forecasts/{forecast_id}, POST /district-energy/load-forecasts/{forecast_id}/publish"
  - priority: 4
    category: existence
    check: "DispatchPlan named by a path id exists"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/dispatch-plans/{plan_id} and every POST /district-energy/dispatch-plans/{plan_id}/* action"
  - priority: 4
    category: existence
    check: "DispatchOrder named by a path id exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/dispatch-orders/{order_id}"
  - priority: 4
    category: existence
    check: "RateSchedule named by a path id exists"
    error_id: ERR_RATE_SCHEDULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/rate-schedules/{rate_schedule_id}"
  - priority: 4
    category: existence
    check: "ConnectionAgreement named by a path id exists"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/connection-agreements/{agreement_id}, POST /district-energy/connection-agreements/{agreement_id}/activate, POST /district-energy/connection-agreements/{agreement_id}/status"
  - priority: 4
    category: existence
    check: "MeteringPoint named by a path id exists"
    error_id: ERR_METERING_POINT_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/metering-points/{point_id}, GET /district-energy/metering-points/{point_id}/readings, POST /district-energy/metering-points/{point_id}/commission, POST /district-energy/metering-points/{point_id}/remove, POST /district-energy/metering-points/{point_id}/readings"
  - priority: 4
    category: existence
    check: "MeterReading named by a path id exists"
    error_id: ERR_READING_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/meter-readings/{reading_id}"
  - priority: 4
    category: existence
    check: "Invoice named by a path id exists"
    error_id: ERR_INVOICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/invoices/{invoice_id} and every POST /district-energy/invoices/{invoice_id}/* action"
  - priority: 4
    category: existence
    check: "WorkOrder named by a path id exists"
    error_id: ERR_WORK_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/work-orders/{work_order_id} and every POST /district-energy/work-orders/{work_order_id}/* action"
  - priority: 4
    category: existence
    check: "ExpansionProject named by a path id exists"
    error_id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    applies_to: "GET /district-energy/expansion-projects/{project_id} and every POST /district-energy/expansion-projects/{project_id}/* action"
  - priority: 5
    category: business_referential
    check: "every foreign key supplied in the request body resolves to an existing row, evaluated in body-field declaration order: loop_id, upstream_segment_id, fuel_contract_id, forecast_id, rate_schedule_id, agreement_id, segment_id"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST /district-energy/pipe-segments, POST /district-energy/production-assets, POST /district-energy/load-forecasts, POST /district-energy/dispatch-plans, POST /district-energy/connection-agreements, POST /district-energy/metering-points, POST /district-energy/invoices, POST /district-energy/work-orders, POST /district-energy/expansion-projects"
  - priority: 6
    category: auth
    check: "when X-User-Role is CustomerAccount, X-User-ID equals the agreement_id of the targeted Invoice or the id of the targeted ConnectionAgreement"
    error_id: ERR_FORBIDDEN_AGREEMENT
    http_status: 403
    applies_to: "POST /district-energy/invoices/{invoice_id}/payments, GET /district-energy/connection-agreements/{agreement_id}, GET /district-energy/invoices/{invoice_id}"
  - priority: 7
    category: state
    check: "expected_loop_version equals the current NetworkLoop.version"
    error_id: ERR_STALE_LOOP_VERSION
    http_status: 412
    applies_to: "POST /district-energy/dispatch-plans"
  - priority: 7
    category: state
    check: "expected_agreement_version equals the current ConnectionAgreement.version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /district-energy/invoices"
  - priority: 8
    category: business_constraint
    check: "code uniqueness: NetworkLoop.code globally, PipeSegment.code within loop_id, ProductionAsset.code within loop_id, FuelSupplyContract.supplier_code globally, RateSchedule.code globally, MeteringPoint.code globally"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /district-energy/network-loops, POST /district-energy/pipe-segments, POST /district-energy/production-assets, POST /district-energy/fuel-supply-contracts, POST /district-energy/rate-schedules, POST /district-energy/metering-points"
  - priority: 9
    category: business_referential
    check: "PipeSegment.upstream_segment_id, when supplied, belongs to the same loop_id and following upstream_segment_id links from the new segment must terminate at a segment with a null upstream_segment_id without revisiting a segment"
    error_id: ERR_SEGMENT_CYCLE
    http_status: 409
    applies_to: "POST /district-energy/pipe-segments"
  - priority: 9
    category: business_referential
    check: "WorkOrder.loop_id equals the referenced PipeSegment.loop_id, and MeteringPoint.segment_id belongs to the same NetworkLoop as MeteringPoint.agreement_id"
    error_id: ERR_SEGMENT_LOOP_MISMATCH
    http_status: 409
    applies_to: "POST /district-energy/work-orders, POST /district-energy/metering-points"
  - priority: 9
    category: business_referential
    check: "ConnectionAgreement.customer_class equals the referenced RateSchedule.customer_class, and ExpansionProject.customer_class equals the referenced RateSchedule.customer_class"
    error_id: ERR_CUSTOMER_CLASS_MISMATCH
    http_status: 409
    applies_to: "POST /district-energy/connection-agreements, POST /district-energy/expansion-projects"
  - priority: 9
    category: business_referential
    check: "ConnectionAgreement.service_mode is compatible with NetworkLoop.service_mode: identical, or the loop is DUAL"
    error_id: ERR_SERVICE_MODE_MISMATCH
    http_status: 409
    applies_to: "POST /district-energy/connection-agreements"
  - priority: 9
    category: business_referential
    check: "DispatchPlan.forecast_id references a LoadForecast whose loop_id equals DispatchPlan.loop_id"
    error_id: ERR_FORECAST_LOOP_MISMATCH
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans"
  - priority: 10
    category: state
    check: "the target entity is in the from-state the requested transition declares in state_machines: DispatchPlan optimize/submit require DRAFT, review requires SUBMITTED, commit requires APPROVED, decommit and reconcile require COMMITTED"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/optimize, POST /district-energy/dispatch-plans/{plan_id}/submit, POST /district-energy/dispatch-plans/{plan_id}/review, POST /district-energy/dispatch-plans/{plan_id}/commit, POST /district-energy/dispatch-plans/{plan_id}/decommit, POST /district-energy/dispatch-plans/{plan_id}/reconcile"
  - priority: 10
    category: state
    check: "LoadForecast.forecast_state == DRAFT on publish, and the LoadForecast referenced by an optimize call has forecast_state == PUBLISHED"
    error_id: ERR_FORECAST_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/load-forecasts/{forecast_id}/publish, POST /district-energy/dispatch-plans/{plan_id}/optimize"
  - priority: 10
    category: state
    check: "ConnectionAgreement.contract_state == PENDING_CAPACITY on activate, and the requested contract_state transition on status is declared in state_machines.ConnectionAgreement"
    error_id: ERR_AGREEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/connection-agreements/{agreement_id}/activate, POST /district-energy/connection-agreements/{agreement_id}/status"
  - priority: 10
    category: state
    check: "Invoice.invoice_state permits the requested action: issue requires DRAFT, adjust requires ISSUED or ADJUSTED, payments require ISSUED or ADJUSTED, void requires DRAFT, ISSUED or ADJUSTED; additionally the referenced ConnectionAgreement.contract_state IN {ACTIVE, SUSPENDED} for create, issue and adjust"
    error_id: ERR_INVOICE_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/invoices, POST /district-energy/invoices/{invoice_id}/issue, POST /district-energy/invoices/{invoice_id}/adjust, POST /district-energy/invoices/{invoice_id}/payments, POST /district-energy/invoices/{invoice_id}/void"
  - priority: 10
    category: state
    check: "WorkOrder.work_state permits the requested action per state_machines.WorkOrder, and begin-excavation additionally requires permit_decision == GRANTED"
    error_id: ERR_WORK_ORDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/work-orders/{work_order_id}/submit-permit, POST /district-energy/work-orders/{work_order_id}/permit-decision, POST /district-energy/work-orders/{work_order_id}/begin-excavation, POST /district-energy/work-orders/{work_order_id}/begin-repair, POST /district-energy/work-orders/{work_order_id}/backfill, POST /district-energy/work-orders/{work_order_id}/complete, POST /district-energy/work-orders/{work_order_id}/cancel"
  - priority: 10
    category: state
    check: "ExpansionProject.project_state permits the requested action: size requires SCREENING or SIZED, decision requires SIZED or APPROVED, convert requires APPROVED"
    error_id: ERR_PROJECT_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/expansion-projects/{project_id}/size, POST /district-energy/expansion-projects/{project_id}/decision, POST /district-energy/expansion-projects/{project_id}/convert"
  - priority: 10
    category: state
    check: "MeteringPoint.meter_state permits the requested action: commission requires INSTALLED, remove requires INSTALLED or COMMISSIONED, recording a reading requires COMMISSIONED, and commission additionally requires the referenced PipeSegment.condition != UNDER_REPAIR"
    error_id: ERR_METER_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/metering-points/{point_id}/commission, POST /district-energy/metering-points/{point_id}/remove, POST /district-energy/metering-points/{point_id}/readings"
  - priority: 10
    category: state
    check: "FuelSupplyContract.status permits the requested status transition per state_machines.FuelSupplyContract; EXPIRED is terminal, and ProductionAsset.availability_state permits the requested availability transition"
    error_id: ERR_AVAILABILITY_STATE_INVALID
    http_status: 409
    applies_to: "POST /district-energy/fuel-supply-contracts/{contract_id}/status, POST /district-energy/production-assets/{asset_id}/availability"
  - priority: 11
    category: business_safety
    check: "the reviewing X-User-ID differs from DispatchPlan.authored_by_user_id, and the completing X-User-ID differs from WorkOrder.reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/review, POST /district-energy/work-orders/{work_order_id}/complete"
  - priority: 12
    category: business_safety
    check: "a WorkOrder with requires_isolation == true may begin excavation only while no DispatchPlan on the same loop has plan_state == COMMITTED"
    error_id: ERR_ISOLATION_CLEARANCE_DENIED
    http_status: 409
    applies_to: "POST /district-energy/work-orders/{work_order_id}/begin-excavation"
  - priority: 12
    category: business_safety
    check: "the DispatchPlan reserve margin from plan_reliability_metrics is at or above MIN_RESERVE_MARGIN_PCT on approval"
    error_id: ERR_RESERVE_MARGIN_INSUFFICIENT
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/review with decision=APPROVE"
  - priority: 12
    category: business_safety
    check: "the DispatchPlan fuel concentration index from plan_reliability_metrics is at or below MAX_FUEL_DIVERSITY_HHI on approval"
    error_id: ERR_FUEL_DIVERSITY_BREACH
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/review with decision=APPROVE"
  - priority: 12
    category: business_safety
    check: "NetworkLoop.posture != ISOLATED when a ConnectionAgreement is activated"
    error_id: ERR_LOOP_ISOLATED
    http_status: 409
    applies_to: "POST /district-energy/connection-agreements/{agreement_id}/activate"
  - priority: 12
    category: business_safety
    check: "NetworkLoop.posture == NORMAL when a DispatchPlan is committed"
    error_id: ERR_LOOP_NOT_NORMAL
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/commit"
  - priority: 13
    category: business_temporal
    check: "calculations.work_window_conflict_detection reports no conflicting WorkOrder window on the same PipeSegment"
    error_id: ERR_WORK_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /district-energy/work-orders/{work_order_id}/submit-permit"
  - priority: 13
    category: business_temporal
    check: "the logical clock is at or after WorkOrder.window_start and at or before WorkOrder.window_end when excavation begins"
    error_id: ERR_OUTSIDE_WORK_WINDOW
    http_status: 409
    applies_to: "POST /district-energy/work-orders/{work_order_id}/begin-excavation"
  - priority: 13
    category: business_temporal
    check: "the requested Invoice billing period does not overlap the half-open period of any existing Invoice for the same agreement whose invoice_state IN {DRAFT, ISSUED, ADJUSTED, PAID}"
    error_id: ERR_INVOICE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /district-energy/invoices"
  - priority: 14
    category: business_referential
    check: "a new MeterReading.cumulative_energy_mwh is greater than or equal to MeteringPoint.last_reading_energy_mwh and its read_at is strictly after the read_at of the newest existing reading for the point"
    error_id: ERR_READING_NOT_MONOTONIC
    http_status: 409
    applies_to: "POST /district-energy/metering-points/{point_id}/readings"
  - priority: 15
    category: business_constraint
    check: "merit_order_dispatch has at least one eligible ProductionAsset for the loop"
    error_id: ERR_NO_ELIGIBLE_ASSETS
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/optimize"
  - priority: 15
    category: business_constraint
    check: "the DispatchPlan has at least one DispatchOrder when submitted"
    error_id: ERR_PLAN_HAS_NO_ORDERS
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/submit"
  - priority: 16
    category: business_constraint
    check: "DispatchPlan.unserved_demand_kw == 0.0 when submitted, so the merit-order waterfall covered the whole coincident demand"
    error_id: ERR_INSUFFICIENT_GENERATION
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/submit"
  - priority: 16
    category: business_constraint
    check: "every storage DispatchOrder's discharged_kwh is at or below the referenced ProductionAsset.state_of_charge_kwh when the plan is committed"
    error_id: ERR_STORAGE_ENERGY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /district-energy/dispatch-plans/{plan_id}/commit"
  - priority: 16
    category: business_constraint
    check: "expansion_sizing_and_npv finds at least one standard diameter satisfying both the velocity and pressure-drop limits"
    error_id: ERR_NO_FEASIBLE_PIPE_SIZE
    http_status: 422
    applies_to: "POST /district-energy/expansion-projects/{project_id}/size"
  - priority: 16
    category: business_constraint
    check: "the Invoice billing period contains at least two admissible MeterReading rows under the requested variant"
    error_id: ERR_INSUFFICIENT_METER_DATA
    http_status: 422
    applies_to: "POST /district-energy/invoices, POST /district-energy/invoices/{invoice_id}/adjust"
  - priority: 17
    category: business_fiscal
    check: "calculations.loop_capacity_reservation_sweep reports no boundary where concurrent reserved capacity exceeds the loop oversubscription ceiling"
    error_id: ERR_LOOP_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /district-energy/connection-agreements/{agreement_id}/activate"
  - priority: 17
    category: business_fiscal
    check: "ExpansionProject.npv is at or above 0.0 when the project decision is APPROVE"
    error_id: ERR_PROJECT_NPV_NEGATIVE
    http_status: 422
    applies_to: "POST /district-energy/expansion-projects/{project_id}/decision with decision=APPROVE"
  - priority: 17
    category: business_fiscal
    check: "the payment amount equals Invoice.total_amount exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /district-energy/invoices/{invoice_id}/payments"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint that positions the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time, so every window, expiry and age rule is deterministic before any call to this endpoint."
    roles: [SystemController]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["repositions the logical clock used by segment_leak_risk_score age_years, the WorkOrder window checks and every created_at/updated_at stamp"]

