  # =======================================================================
  - section: complexity_layers
    instances:

      - name: a_second_work_order_on_the_same_lot_must_re_read_the_blank_ledger_first
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.work-order-create-stale-glass-lot
          - errors.ERR_STALE_GLASS_LOT_VERSION
          - validations.priority_6
          - calculations.blank_conservation_ledger
        distinguishing_aspect: |
          Two work orders drawing on one lot are both legitimate, so nothing in the state machine stops
          the second writer — the OCC guard is the only thing that does. The first create is admitted with
          the version the client read and bumps the lot to 3; the second create replaying that same value
          is refused with 412 ERR_STALE_GLASS_LOT_VERSION and reserves nothing; re-reading the lot and
          replaying the request with version 3 then succeeds, which proves the guard is about staleness
          and not about the lot being busy.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "The lot's version is 2 after its certification, and that value is captured as the client's view."
            - "Each work order has element_count 2, so each reserves 2 + max(1, ceil(2 * 0.25)) == 3 blanks."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
          trigger:
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-A", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-B", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
              captures: { w2: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
            - call: "GET /optics/work-orders"
              payload: { limit: 10, offset: 0 }
              as: ProcessTechnician
          assert:
            - "the first create returns HTTP 201 with reserved_blank_count 3 and spare_blank_count 1"
            - "the lot read after it reports version 3, reserved_blank_count 3 and available_blank_count 17"
            - "the second create carrying the stale version 2 returns HTTP 412 with error_id ERR_STALE_GLASS_LOT_VERSION"
            - "GlassLot.${g1} still reads version 3 / reserved 3 / available 17 after the refusal, so the refused create neither reserved a blank nor bumped the version"
            - "replaying the identical payload with version 3 returns HTTP 201"
            - "GlassLot.${g1} then reads version 4, reserved_blank_count 6, consumed 0, scrapped 0 and available_blank_count 14"
            - "the work-order list holds exactly 2 rows, so WO-2540-B was created once and only once"
            - "20 == 14 + 6 + 0 + 0, so the conservation invariant survived the refused write"

      - name: the_second_element_of_an_assembly_must_carry_the_version_the_first_one_produced
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.component-add-stale-assembly
          - errors.ERR_STALE_ASSEMBLY_VERSION
          - validations.priority_6
          - calculations.assembly_transmitted_wavefront
        distinguishing_aspect: |
          Adding a second element to the same assembly is a legitimate operation, so the stale-version
          check is the only guard that stops a writer who has not re-read the slot table: the add that
          replays the pre-first-element version is refused with 412 ERR_STALE_ASSEMBLY_VERSION even though
          its slot_index 2 is free, and after a re-read the identical body is admitted. The refusal must
          not touch the assembly's five wavefront outputs, which are still null until the align.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio_at_scheduling is 0.0500."
            - "WO-2540-1 (element_count 2) reached RELEASED_TO_ASSEMBLY through the full fabrication, coating and export path."
            - "Assembly AS-2540-1 was created KITTED and its version 1 was captured before any component existed."
            - "The first component (slot 1, 0.0600 waves) bumps the assembly to version 2, so the captured value goes stale."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
