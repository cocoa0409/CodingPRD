            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M1", body: "first" }, as: Patient, as_user_id: "${pat}", captures: { m1: "$.data.id", m1_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m1}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m1_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m1}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m1}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m1}", entry_kind: "CLINICAL_REVIEW", minutes: 6 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m1}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m1_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m1}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m1_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m1}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent1: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent1}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat}" }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:59:59Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M3", body: "too soon" }, as: Patient, as_user_id: "${pat}", captures: { m3: "$.data.id", m3_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m3}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m3_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m3}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m3}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m3}", entry_kind: "CLINICAL_REVIEW", minutes: 5 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M2", body: "exactly 168h" }, as: Patient, as_user_id: "${pat}", captures: { m2: "$.data.id", m2_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m2}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m2_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m2}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m2}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m2}", entry_kind: "CLINICAL_REVIEW", minutes: 5 }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "GET /inbox/portal-messages/${m2}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m2_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m2}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m2_v2}" }, as: Provider, as_user_id: "${prov_id}", captures: { m2_st: "$.data.status" } }
            - { call: "GET /inbox/portal-messages/${m3}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m3_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m3}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m3_v2}" }, as: Provider, as_user_id: "${prov_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "M2 (prior CHARGEABLE exactly 168h earlier, exclusive lower bound): determine succeeds, status == PENDING_CONSENT"
            - "M3 (prior CHARGEABLE 167h59m59s earlier, inside window): error_id == ERR_EVISIT_DUPLICATE_WITHIN_7_DAYS (409)"

      - name: deadline_dual_variant_covered_by_difficulty
        claim_type: variant_divergence
        grounds:
          - "calculations.response_deadline"
        excluded_because:
          difficulty_instance: deadline_from_receipt_vs_from_triage_policy
          rationale: "Both deadline variants computed and asserted on identical inputs in the named §1.8 instance."

      - name: burden_dual_variant_covered_by_difficulty
        claim_type: variant_divergence
        grounds:
          - "calculations.provider_inbox_burden"
        excluded_because:
          difficulty_instance: burden_attributed_vs_touched
          rationale: "ATTRIBUTED vs TOUCHED divergence asserted with literal values in the named §1.8 instance."

      - name: tier_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds:
          - "calculations.e_visit_tier_selection"
        excluded_because:
          difficulty_instance: evisit_tier_boundary_10_vs_11_minutes
          rationale: "10/11-minute tier boundary asserted in the named §1.8 instance."

      - name: sla_boundary_covered_by_difficulty
        claim_type: correct_result
        grounds:
          - "calculations.sla_breach_evaluation"
        excluded_because:
          difficulty_instance: sla_breach_strictly_greater_than_due
          rationale: "Strictly-greater breach semantics at the exact due instant asserted in the named §1.8 instance."

      - name: rounding_order_covered_by_difficulty
        claim_type: precision
        grounds:
          - "calculations.patient_responsibility"
        excluded_because:
          difficulty_instance: coinsurance_per_claim_rounding
          rationale: "Per-claim round-then-sum vs sum-then-round divergence (3334 vs 3333) asserted in the named §1.8 instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call with neither X-User-ID nor X-User-Role headers is rejected 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /inbox/portal-messages/00000000-0000-4000-8000-000000000000", payload: {}, as: "(no headers)", captures: { err: "$.data.error_id" } }
          assert: ["http 400; error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (auth precedes existence — a 404 here is wrong)"]

      - name: invalid_enum_value_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=31]"
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.PortalMessage.fields.urgency"
        distinguishing_aspect: "An out-of-enum urgency value on triage is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Nurse, provider pool, patient, message RECEIVED"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "WHENEVER", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err: "$.data.error_id" } }
          assert: ["http 400; error_id == ERR_INVALID_REQUEST", "message stays RECEIVED"]

      - name: time_entry_minutes_range_enforced
        claim_type: violation_to_error
        grounds:
          - "validations[priority=31]"
          - "entities.StaffTimeEntry.fields.minutes"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "minutes must satisfy 1 <= minutes <= 480: 0 and 481 are rejected, 1 is accepted."
        test_recipe:
          setup: ["Message IN_REVIEW assigned to nurse (nurse pool, coverage)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
          trigger:
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "ADMINISTRATIVE", minutes: 0 }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err0: "$.data.error_id" } }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "ADMINISTRATIVE", minutes: 481 }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { err481: "$.data.error_id" } }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "ADMINISTRATIVE", minutes: 1 }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { te: "$.data.id" } }
          assert: ["minutes == 0: ERR_INVALID_REQUEST (400)", "minutes == 481: ERR_INVALID_REQUEST (400)", "minutes == 1: 201 created"]

      - name: time_range_must_be_strictly_positive
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_INVALID_TIME_RANGE]"
        distinguishing_aspect: "end_utc == start_utc is rejected (zero-length interval), as is end < start; applies to windows, shifts, and grants."
        test_recipe:
          setup: ["Nurse + provider + pools exist"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T09:00:00Z", end_utc: "2026-08-03T09:00:00Z" }, as: PracticeAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /inbox/on-call-shifts", payload: { provider_id: "${prov_id}", start_utc: "2026-08-03T20:00:00Z", end_utc: "2026-08-03T08:00:00Z" }, as: PracticeAdmin, captures: { err2: "$.data.error_id" } }
          assert: ["zero-length coverage window: ERR_INVALID_TIME_RANGE (400)", "inverted on-call shift: ERR_INVALID_TIME_RANGE (400)"]

      - name: delegation_window_touch_overlap_and_pair_isolation
        claim_type: temporal_validation
        grounds:
          - "validations[priority=21]"
          - "errors[ERR_DELEGATION_WINDOW_OVERLAP]"
        distinguishing_aspect: "Delegation grants use CLOSED semantics per (delegator, delegate) pair: a new grant starting exactly at the existing grant's end conflicts; the same window for a DIFFERENT delegate is accepted."
        test_recipe:
          setup: ["Provider P, nurses N1 and N2, PROVIDER_INBOX pool; grant G1 P->N1 [2026-08-03 09:00, 2026-08-05 17:00]"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse A", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n1: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse B", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n2: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/delegation-grants", payload: { delegate_staff_id: "${n1}", pool_id: "${pool_p}", start_utc: "2026-08-03T09:00:00Z", end_utc: "2026-08-05T17:00:00Z" }, as: Provider, as_user_id: "${prov_id}", captures: { g1: "$.data.id" } }
          trigger:
            - { call: "POST /inbox/delegation-grants", payload: { delegate_staff_id: "${n1}", pool_id: "${pool_p}", start_utc: "2026-08-05T17:00:00Z", end_utc: "2026-08-06T09:00:00Z" }, as: Provider, as_user_id: "${prov_id}", captures: { err: "$.data.error_id" } }
            - { call: "POST /inbox/delegation-grants", payload: { delegate_staff_id: "${n2}", pool_id: "${pool_p}", start_utc: "2026-08-05T17:00:00Z", end_utc: "2026-08-06T09:00:00Z" }, as: Provider, as_user_id: "${prov_id}", captures: { g2: "$.data.id" } }
          assert:
            - "same (delegator, delegate) pair touching at 2026-08-05T17:00:00Z: ERR_DELEGATION_WINDOW_OVERLAP (409) — closed semantics"
            - "same window for a different delegate: 201 created (overlap rule is per pair)"

      - name: consent_pending_blocks_redetermination
        claim_type: violation_to_error
        grounds:
          - "validations[priority=26]"
          - "errors[ERR_CONSENT_REQUEST_PENDING]"
        distinguishing_aspect: "While a REQUESTED consent exists, any further determine-billing call is rejected ERR_CONSENT_REQUEST_PENDING."
        test_recipe:
          setup: ["Message PENDING_CONSENT (8 provider minutes; consent REQUESTED open)"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v3: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "NOT_BILLABLE", expected_message_version: "${m_v3}" }, as: Provider, as_user_id: "${prov_id}", captures: { err: "$.data.error_id" } }
          assert: ["error_id == ERR_CONSENT_REQUEST_PENDING (409)", "message stays PENDING_CONSENT; original consent still REQUESTED"]

      - name: claim_in_flight_blocks_close
        claim_type: violation_to_error
        grounds:
          - "validations[priority=28]"
          - "errors[ERR_CLAIM_IN_FLIGHT]"
          - "state_machines.PortalMessage.RESOLVED_to_CLOSED"
        distinguishing_aspect: "A RESOLVED message with a DRAFT claim cannot be closed: ERR_CLAIM_IN_FLIGHT."
        test_recipe:
          setup: ["Full billing flow: message RESOLVED + CHARGEABLE, claim DRAFT exists"]
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "S", body: "B" }, as: Patient, as_user_id: "${pat}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
