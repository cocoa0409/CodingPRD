      - name: booth_fee_multiplier_constants_are_applied_as_declared
        claim_type: constants_applied
        grounds:
          - calculations.booth_space_fee.constants
        excluded_because:
          difficulty_instance: booth_space_fee_three_input_multiplicative_grid_with_volume_tier
          rationale: "§1.8 already exercises LOCATION_MULT, ZONE_MULT, VOLUME_TIER_PCT and MIN_DEPOSIT_PCT together over a grid of booths and asserts each line to the cent, which is the strongest possible constants-applied check."

      - name: rounding_mode_and_order_are_honoured
        claim_type: precision
        grounds:
          - calculations.show_post_show_report.precision
          - calculations.booth_space_fee.precision
        excluded_because:
          difficulty_instance: post_show_lead_quality_rounds_per_contract_then_averages
          rationale: "§1.8 pins the two-pass rounding order of the lead-quality index and shows that pooling the scans yields a different number, so the precision claim is already discriminating."

      - name: sponsorship_inventory_running_total_survives_a_reversal
        claim_type: aggregation
        grounds:
          - calculations.sponsorship_inventory_conservation
          - entities.SponsorshipPackage.fields.inventory_available
        excluded_because:
          difficulty_instance: propose_then_cancel_restores_the_sponsorship_unit_count
          rationale: "§1.8 asserts inventory_committed and inventory_available after the add and again after the reversal, which is exactly the aggregation row's add-then-reverse claim."

      - name: volume_tier_boundaries_are_inclusive
        claim_type: tiered_pricing
        grounds:
          - calculations.booth_space_fee
        excluded_because:
          difficulty_instance: volume_tier_at_exactly_1000_sqft_undercuts_999_sqft
          rationale: "§1.8 tests the 1000 sqft tier edge from both sides and proves the >= comparison is inclusive, including the counter-intuitive result that one more square foot lowers the invoice."

      - name: cancellation_money_fills_the_deposit_bucket_first
        claim_type: waterfall_allocation
        grounds:
          - calculations.space_contract_cancellation_fee
        excluded_because:
          difficulty_instance: cancellation_waterfall_conserves_every_collected_cent
          rationale: "§1.8 covers both overflow directions (refund-only and balance-due-only) and asserts that exactly one of refund_cents and balance_due_cents is non-zero, which is the whole waterfall claim."

      - name: bundle_discount_propagates_without_iterating
        claim_type: constraint_propagation
        grounds:
          - calculations.space_contract_invoice_total
        excluded_because:
          difficulty_instance: invoice_bundle_tier_reads_the_pre_discount_subtotal
          rationale: "§1.8 drives a sponsorship signature through the contract repricing chain and asserts the tier is selected from the pre-discount subtotal and never re-selected from the discounted total, i.e. the fixed point is reached in one pass."

      - name: provisional_points_look_forward_at_unsigned_holds
        claim_type: forward_looking
        grounds:
          - calculations.exhibitor_priority_points.variants[PROVISIONAL]
        excluded_because:
          difficulty_instance: exhibitor_priority_points_provisional_versus_certified_divergence
          rationale: "§1.8 shows the provisional variant counting an OFFERED hold that the certified variant ignores, and re-checks both after the hold changes, which is the forward-looking row's pending-plus-confirmed claim."

      - name: the_two_service_rate_variants_diverge_on_identical_input
        claim_type: variant_divergence
        grounds:
          - calculations.service_order_line_total.variants
        excluded_because:
          difficulty_instance: service_order_advance_versus_floor_variant_divergence
          rationale: "§1.8 computes both variants for the same quantity and asserts the exact delta; the variant_selection instance above covers which one is chosen, so a divergence copy here would duplicate the arithmetic."

      - name: closing_a_show_moves_points_from_provisional_to_certified
        claim_type: reconciliation
        grounds:
          - state_machines[SpaceContract].transitions[SIGNED->CLOSED_OUT].side_effects
          - calculations.exhibitor_priority_points
        excluded_because:
          difficulty_instance: exhibitor_priority_points_provisional_versus_certified_divergence
          rationale: "§1.8 follows the same contract across the CLOSED_OUT boundary and asserts both ledgers before and after the switch, so the delta-on-switch reconciliation is already pinned."

