            - "e_anon == ERR_UNAUTHENTICATED with HTTP 401, proving priority 1 runs before the role check that would also have rejected the call"
            - "GET /employees returns total_count 1, so neither the PlatformAdmin enrolment nor the anonymous catalogue write created a row"
            - "GET /employee-groups/${grp_id}/budget-rules returns total_count 1 with the single ACTIVE rule ${rule_id}"
            - "BenefitPeriod.${per_id}.status is still OPEN and Order.${ord_id}.fulfillment_status is still PLACED"

      - name: shared_reads_serve_every_declared_role_but_stay_scoped_to_the_owning_employee
        claim_type: shared_operations
        grounds:
