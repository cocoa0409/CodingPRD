            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv1}", name: "T2", organization: "Gym2", category: "CHEER", level: 3, coach_user_id: "coach-2" }, as: TeamCoach, as_user_id: "coach-2", captures: { t2: $.data.id } }
