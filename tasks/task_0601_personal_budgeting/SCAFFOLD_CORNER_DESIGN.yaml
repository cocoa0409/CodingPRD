          - "validations[priority=13]"
        distinguishing_aspect: "Closing a period with expected_household_version one below the current version returns ERR_STALE_HOUSEHOLD (412); the parent's version having advanced makes the stale request fail."
        test_recipe:
          setup: ["Household with a zero-based current period P1 (income 0, allocated 0); version observed then deliberately decremented for the OCC negative"]
          setup_api_calls:
            - call: "POST /households"
              payload: { name: "Acme", owner_email: "o@x.com", owner_display_name: "Owner" }
              as: PlatformAdmin
              captures: { hh_id: $.data.id, owner_id: $.data.owner_member_id }
            - call: "POST /households/${hh_id}/budget-periods"
              payload: { month: "2026-01", income_expected_cents: 0 }
