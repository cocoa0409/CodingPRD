            - "call 1: 422 ERR_SPECIALIST_CERTIFICATION_REQUIRED - the lead holds a valid ASSIGNED seat on the IN_PROGRESS visit, so the seat check passes and the endorsement rule answers"
            - "call 2: 422 ERR_VISIT_CYCLE_MISMATCH - camp B's evaluation is not in the cycle the acting visitor is seated on"
            - "call 3: 200 with StandardEvaluation.${ev_a_aq_id}.visitor_score == MET and scored_by_visitor_id == ${aq_id} - the AQUATICS_SPECIALIST may score the same row the lead could not"
            - "call 4: 422 ERR_MANDATORY_SCORING_INCOMPLETE - the SUPERVISION row still has a null visitor_score, and the visit stays IN_PROGRESS"
            - "call 5: 200 - an INTERVIEW-sourced MET is accepted on a SUPERVISION standard, which needs no endorsement"
            - "call 6: 200 with AccreditationVisit.${visit_a_id}.status == SCORED and provisional_mandatory_pct == 100.00 - the INTERVIEW row is outside PROVISIONAL_SOURCES so the provisional denominator is 1, not 2"
            - "StandardEvaluation.${ev_b_su_id}.visitor_score is still null - the mismatch attempt wrote nothing"

      - name: report_year_gates_each_disclosure_and_the_attested_count_must_cover_them
        claim_type: Violation → Error
        grounds:
          - validations[priority 43]
          - validations[priority 47]
          - validations[priority 55]
          - errors[ERR_INCIDENT_OUTSIDE_REPORT_YEAR]
          - errors[ERR_DECLARED_COUNT_BELOW_DISCLOSED]
          - errors[ERR_DUPLICATE_CYCLE_YEAR]
          - entities.AnnualReport.fields.due_date
        distinguishing_aspect: "due_date is March 1 of the year after report_year, so at clock 2026-08-01 the 2026 report is on time and the 2025 report is late - the same submit endpoint lands in two different states; and the attested count must cover disclosures the camp filed itself, not just those the office knows about."
        test_recipe:
          setup:
            - "clock 2026-08-01; one camp with a DRAFT 2026 report (due 2027-03-01) and a DRAFT 2025 report (due 2026-03-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Reporting Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/annual-reports"
              payload: { camp_id: "${camp_id}", report_year: 2026 }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { rpt26_id: "$.data.id" }
            - call: "POST /accreditation/annual-reports"
              payload: { camp_id: "${camp_id}", report_year: 2025 }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { rpt25_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/incident-disclosures"
              payload: { annual_report_id: "${rpt26_id}", incident_type: "HOSPITALIZATION", occurred_at: "2025-07-04T14:00:00.000Z" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/incident-disclosures"
              payload: { annual_report_id: "${rpt26_id}", incident_type: "HOSPITALIZATION", occurred_at: "2026-07-04T14:00:00.000Z" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/incident-disclosures"
              payload: { annual_report_id: "${rpt26_id}", incident_type: "MEDICATION_ERROR", occurred_at: "2026-07-05T09:00:00.000Z" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports/${rpt26_id}/submit"
              payload: { declared_incident_count: 1 }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports/${rpt26_id}/submit"
              payload: { declared_incident_count: 2 }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports"
              payload: { camp_id: "${camp_id}", report_year: 2026 }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports/${rpt25_id}/submit"
              payload: { declared_incident_count: 0 }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/annual-reports/${rpt25_id}/review"
              payload: { decision: "ACCEPT", reviewer_note: "late filing accepted" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "after setup: AnnualReport.${rpt26_id}.due_date == 2027-03-01 and AnnualReport.${rpt25_id}.due_date == 2026-03-01, both status DRAFT with disclosed_incident_count 0"
            - "call 1: 422 ERR_INCIDENT_OUTSIDE_REPORT_YEAR - occurred_at is in 2025 but the parent report_year is 2026"
            - "call 2: 201 and call 3: 201 - AnnualReport.${rpt26_id}.disclosed_incident_count == 2, each disclosure stamped status DISCLOSED"
            - "call 4: 422 ERR_DECLARED_COUNT_BELOW_DISCLOSED - attesting to 1 incident against 2 disclosed rows"
            - "call 5: 200 with AnnualReport.${rpt26_id}.status == SUBMITTED, declared_incident_count == 2, submitted_at == 2026-08-01T00:00:00Z and attested_by_user_id == ${camp_id} - the clock date is inside the 2027-03-01 deadline"
            - "call 6: 409 ERR_DUPLICATE_CYCLE_YEAR - report_year is unique per camp, and the rule is shared with cycle years"
            - "call 7: 200 with AnnualReport.${rpt25_id}.status == LATE - the identical request lands in LATE because 2026-08-01 is past 2026-03-01"
            - "call 8: 200 with AnnualReport.${rpt25_id}.status == ACCEPTED - the LATE branch of review reaches the same target as the SUBMITTED branch"

      - name: cycle_state_check_versus_plan_ownership_check_on_the_same_self_assessment_write
        claim_type: Priority Ordering
        grounds:
          - validations[priority 23]
          - validations[priority 49]
        excluded_because:
          difficulty_instance: cycle_state_precondition_outranks_plan_camp_mismatch_on_self_assessment
          rationale: "The §1.8 instance issues one request that violates the cycle-state rule and the plan-ownership rule together, asserts the lower-numbered error, then repairs only the state violation to expose the second - which is the whole content of this claim."

      - name: conflict_of_interest_check_versus_travel_overlap_check_on_the_same_seat
        claim_type: Priority Ordering
        grounds:
          - validations[priority 34]
          - validations[priority 39]
        excluded_because:
          difficulty_instance: visitor_conflict_of_interest_outranks_travel_overlap_on_assignment
          rationale: "The §1.8 instance seats a visitor who is both conflicted and already travelling, asserts the conflict error, then clears the conflict to surface the travel error from the same payload shape."

      - name: cross_entity_licence_state_decides_whether_a_visit_may_be_scheduled
        claim_type: Cross-entity validation
        grounds:
          - validations[priority 30]
        excluded_because:
          difficulty_instance: visit_schedule_blocked_by_pending_state_license_then_allowed_after_reinstatement
          rationale: "The §1.8 instance drives the licence axis from PENDING to ACTIVE and replays the identical schedule request, covering both the blocked and the allowed side of the cross-entity rule."

      - name: satisfied_form_of_every_blocked_write_succeeds_unchanged
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority 30]
        excluded_because:
          difficulty_instance: visit_schedule_blocked_by_pending_state_license_then_allowed_after_reinstatement
          rationale: "The same §1.8 instance replays a byte-identical request after the blocking condition clears and asserts success, and the four corner instances in this section each carry their own satisfied-form assertion inline."

      - name: written_plan_requirement_applies_only_to_standards_that_name_a_plan_type
        claim_type: Conditional validation
        grounds:
          - validations[priority 31]
        excluded_because:
          difficulty_instance: self_score_met_requires_verified_written_plan_of_the_named_type
          rationale: "The §1.8 instance contrasts a standard that names a plan type with one that does not, and walks SUBMITTED versus VERIFIED plan states, covering the flag-conditional shape of this rule."

      - name: aggregate_controlled_dose_count_inside_the_rolling_window
        claim_type: Aggregate validation
        grounds:
          - validations[priority 40]
        excluded_because:
          difficulty_instance: controlled_dose_window_half_open_boundary_at_exactly_24_hours
          rationale: "The §1.8 instance admits two doses per camper inside the window and rejects the third at the exact boundary, which is the aggregate-limit claim in its strongest form."

  - section: endpoints
    instances:
      - name: both_computed_reads_reconcile_with_the_stored_rows_before_and_after_the_decision
        claim_type: Computed read
        grounds:
          - endpoints[GET /accreditation/cycles/{cycleId}/compliance-summary]
          - endpoints[GET /accreditation/camps/{campId}/risk-index]
          - calculations.mandatory_compliance_score
          - calculations.accreditation_decision_level
          - calculations.camp_risk_index
        distinguishing_aspect: "The summary exposes both mandatory denominators side by side for the same rows - 1 provisional against 2 final, because one MET row is INTERVIEW-sourced - and its projected_decision_level must already equal the level the decision endpoint later stamps, while the risk read must break the same 16.00 into components that sum through the population multiplier."
        test_recipe:
          setup:
            - "one cycle with SU.1 mandatory weight 3, SU.2 mandatory weight 1 and OM.3 non-mandatory weight 2; scored MET/OBSERVED, MET/INTERVIEW and NOT_MET/OBSERVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Summary Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-SUM", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 3 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { std_1_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.2", title: "Staff screening", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { std_2_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "OM.3", title: "Operations records", domain: "OPERATIONS", mandatory: false, scoring_weight: 2 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { std_3_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}", standard_id: "${std_1_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { ev_1_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}", standard_id: "${std_2_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { ev_2_id: "$.data[0].id" }
            - call: "GET /accreditation/standard-evaluations"
              payload: { cycle_id: "${cycle_id}", standard_id: "${std_3_id}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { ev_3_id: "$.data[0].id" }
            - call: "PATCH /accreditation/standard-evaluations/${ev_1_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_2_id}/self-assessment"
              payload: { self_score: "MET" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_3_id}/self-assessment"
              payload: { self_score: "PARTIAL" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cycle_id}/submit-self-assessment"
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Summary Lead", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { lead_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Summary Member", home_state_code: "PA", trained_through_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { member_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cycle_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_version: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-01", window_end_date: "2026-08-07", expected_cycle_version: "${cycle_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${lead_id}", team_role: "LEAD", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${member_id}", team_role: "MEMBER", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/schedule"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visits/${visit_id}/start"
              as: Visitor
              as_user_id: "${lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_1_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_2_id}/visitor-score"
              payload: { visitor_score: "MET", score_source: "INTERVIEW" }
              as: Visitor
              as_user_id: "${lead_id}"
            - call: "PATCH /accreditation/standard-evaluations/${ev_3_id}/visitor-score"
              payload: { visitor_score: "NOT_MET", score_source: "OBSERVED" }
              as: Visitor
              as_user_id: "${lead_id}"
            - call: "POST /accreditation/visits/${visit_id}/finalize-scoring"
              as: Visitor
              as_user_id: "${lead_id}"
          trigger:
            - call: "GET /accreditation/cycles/${cycle_id}/compliance-summary"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}/risk-index"
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/cycles/${cycle_id}/decision"
              as: AccreditationOfficer
              as_user_id: "officer-2"
            - call: "GET /accreditation/cycles/${cycle_id}/compliance-summary"
              as: CampDirector
              as_user_id: "${camp_id}"
          assert:
            - "call 1: 200 with cycle_id == ${cycle_id}, applicable_standard_count == 3, applicable_mandatory_count == 2"
            - "call 1: provisional_denominator == 1, provisional_numerator == 1, provisional_mandatory_pct == 100.00 - the INTERVIEW row is outside PROVISIONAL_SOURCES"
            - "call 1: final_denominator == 2, final_numerator == 2, final_mandatory_pct == 100.00 - the office counts the INTERVIEW MET"
            - "call 1: weighted_total == 6, weighted_met == 4, final_weighted_pct == 66.67 (round_half_up of 66.666...)"
            - "call 1: open_deficiency_count == 1 and projected_decision_level == ACCREDITED_WITH_CORRECTION, computed before any decision is issued"
            - "call 2: 200 with risk_index_variant == POST_VISIT, incident_component == 0.00, program_component == 0.00, staffing_gap_penalty == 0.00, license_penalty == 6.00, compliance_component == 0.00, population_multiplier == 1.00 and risk_index == 16.00 - no mandatory finding is open, so only the base and the unlicensed penalty survive"
            - "call 2: risk_index equals the stored Camp.${camp_id}.risk_index exactly"
            - "call 3: 200 with AccreditationCycle.${cycle_id}.decision_level == ACCREDITED_WITH_CORRECTION, final_mandatory_pct == 100.00, final_weighted_pct == 66.67, status == IN_CORRECTION and assessed_fee_cents == 204050 (95000 + 1050 + 0 + 108000)"
            - "call 4: 200 with the identical twelve numbers as call 1, and projected_decision_level now equal to the stamped decision_level - the computed read never drifts from the stored row"

      - name: seating_a_visitor_links_both_sides_and_the_derived_counters_agree
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /accreditation/visit-assignments]
          - entities.AccreditationVisit.fields.team_size
          - entities.AccreditationVisit.fields.lead_visitor_id
          - entities.Visitor.fields.committed_travel_days
          - calculations.visitor_travel_commitment
        distinguishing_aspect: "One write must land on three rows at once - the seat itself, the visit's lead pointer and team size, and the visitor's committed travel days - with travel_days counted on the closed interval, so a 2026-08-02..2026-08-06 block is 5 days and not 4."
        test_recipe:
          setup:
            - "a DRAFT visit on a SELF_ASSESSMENT cycle with no seats yet, and two ACTIVE visitors"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Seating Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-SEAT", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_version: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cycle_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_version: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-01", window_end_date: "2026-08-07", expected_cycle_version: "${cycle_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Seat Lead", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { lead_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Seat Member", home_state_code: "PA", trained_through_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { member_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${lead_id}", team_role: "LEAD", travel_block_start_date: "2026-08-01", travel_block_end_date: "2026-08-03" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { seat_lead_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", visitor_id: "${member_id}", team_role: "MEMBER", travel_block_start_date: "2026-08-02", travel_block_end_date: "2026-08-06" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { seat_member_id: "$.data.id" }
            - call: "GET /accreditation/visit-assignments"
              payload: { visit_id: "${visit_id}", status: "ASSIGNED" }
              as: AccreditationOfficer
