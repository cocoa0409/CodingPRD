              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harborline Downtown Annex", opened_on: "2024-07-01" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/clubs/${c1_id}/open"
