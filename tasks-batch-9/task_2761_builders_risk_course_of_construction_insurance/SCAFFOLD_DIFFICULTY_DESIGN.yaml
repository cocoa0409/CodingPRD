          on POST /builders-risk/policies/{id}/quote. Three otherwise identical FRAME / FLOOD_A
          submissions differ only in hard_cost_value_cents, which moves value_pts through
          floor(tiv / 500000000) = 14, 15 and 16, so submission_risk_score lands on 74, 75 and 76.
