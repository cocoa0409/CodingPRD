      - name: physician_eval_exactly_24_hours_before_admission_passes_and_one_minute_earlier_fails
        claim_type: temporal_validation
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_EVAL_WINDOW_EXPIRED]"
          - entities.Episode.fields.physician_eval_at
        distinguishing_aspect: "The evaluation window is inclusive on both edges: an evaluation stamped exactly 24 hours before the admission instant admits, and one stamped 24 hours and 1 minute before is rejected with ERR_EVAL_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Two ELIGIBLE ED referrals for qualifying conditions; referral EDGE has in_person_eval_at 2026-06-01T08:00:00Z and referral STALE has 2026-06-01T07:59:00Z."
            - "The clock is set to 2026-06-02T08:00:00Z before either admission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
