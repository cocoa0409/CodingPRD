            - call: "POST /academic-terms/${term_id}/open"
              payload: {}
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
            - call: "POST /students"
              payload: { student_number: "GS-SUSP-001", full_name: "Susp Student", degree_level: "DOCTORAL", is_international: false, cumulative_gpa: 3.50, visa_type: "NONE", enrolled_credit_hours: 0, external_weekly_hours: 0 }
              as: GradSchoolAdmin
              as_user_id: "user-gs-1"
              captures: { stu_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-SUSP-01", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true, sponsor_code: "NSF", grant_effort_cap_pct: 100, auto_reinstate_threshold_cents: 0 }
              as: GrantAccountant
