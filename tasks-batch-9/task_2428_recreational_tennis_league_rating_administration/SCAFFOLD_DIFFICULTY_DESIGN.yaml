# =============================================================================
# §1.8  SCAFFOLD DIFFICULTY DESIGN — Test Targeting Index
# Task 2428 · Recreational Tennis League & Rating Administration
#
# Depth probe. Nine §0.5 Difficulty Rules × 3 instances each = 27 instances.
# Every instance grounds ONLY in elements declared by SCAFFOLD.yaml §1.1–§1.7:
# no new entity, transition, calculation, validation, endpoint or role is
# introduced here. Deleting this file leaves the declared behaviour identical.
#
# Conventions used by every test_recipe below:
#   * The logical clock starts at 2026-08-01T00:00:00Z (§1.5 clock endpoint) and
#     only ever moves forward; no wall-clock waits anywhere.
#   * Leagues are created with tier SECTION (parent_league_id null) unless the
#     instance is specifically about the LOCAL -> DISTRICT -> SECTION ladder,
#     because §1.4 priority 43 requires parent_league_id null iff tier==SECTION.
#   * POST /tennis/roster-spots is OCC-guarded on Team.version. Team.version is
#     captured once from POST /tennis/teams (version 1) and each subsequent add
#     is expressed as an arithmetic expression over that capture, because every
#     accepted add increments Team.version by exactly 1 (§1.5 side_effects).
#   * Every numeric literal in an assert: line was produced by executing the
#     relevant §1.3 formula with Decimal round_half_up at 3 decimals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # Two+ dual-variant calculations on DIFFERENT entity domains:
  #   1a/2a-side: player_dynamic_rating  -> Player rating domain
  #   1b:         team_standings_points  -> Team standings domain
  #   1c:         year_end_rating_recalculation -> Section rating-epoch domain
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dynamic_rating_in_season_recency_vs_year_end_playoff_weight
        grounds:
          - calculations.player_dynamic_rating
          - calculations.year_end_rating_recalculation
          - entities.Player.fields.dynamic_rating
          - entities.Player.fields.proposed_recalc_dynamic
          - entities.Match.fields.stage
          - state_machines.Match.REPORTED_to_VERIFIED
        distinguishing_aspect: |
          On one identical set of stored rows the Player-domain calculation returns two
          different numbers: variant in_season_provisional gives the unweighted mean of the
          player's counted lines (Player.dynamic_rating == 3.783) while variant
          year_end_final re-weights the PLAYOFF line by 1.5 (proposed_recalc_dynamic ==
          3.740), so a single-implementation shortcut cannot satisfy both fields.
        test_recipe:
          setup:
            - "Section SOCAL-2026 (season_year 2026) in rating_period_status OPEN_SEASON."
            - "One SECTION-tier league at ntrp_level 4.0, MENS_DOUBLES, AGE_18_OVER, lines_per_match 3, min_active_roster_size 6, match_duration_minutes 180."
            - "Two teams of six COMPUTER_RATED players each; home players all rated 4.0, away players alternating 4.0 / 3.5 so every home line faces opp_level_avg 3.75."
            - "One REGULAR match (2026-08-15) verified from a fully played scorecard, and one PLAYOFF match (2026-11-07, after season_end_at) verified from a second scorecard."
            - "Player h1 therefore owns exactly two counted lines: 4.000 (REGULAR) and 3.566 (PLAYOFF)."
            - "Clock at 2026-11-07T21:00:00Z; no year-end recalculation has run yet, so proposed_recalc_dynamic is still null."
          setup_api_calls:
            - { call: "POST /tennis/sections", payload: { code: "SOCAL-2026", name: "Southern California", season_year: 2026, min_matches_for_playoff_eligibility: 1, strike_limit: 3, disqualification_strike_limit: 6 }, as: SectionAdmin, captures: { sec: $.data.id } }
            - { call: "POST /tennis/facilities", payload: { section_id: "${sec}", name: "Balboa Courts", court_count: 3, turnaround_buffer_minutes: 30, surface: "HARD" }, as: SectionAdmin, captures: { fac: $.data.id } }
            - { call: "POST /tennis/leagues", payload: { section_id: "${sec}", tier: "SECTION", ntrp_level: 4.0, age_group: "AGE_18_OVER", format: "MENS_DOUBLES", lines_per_match: 3, min_active_roster_size: 6, max_roster_size: 14, min_playoff_eligible_players: 6, max_teams: 8, advancement_slots: 1, match_duration_minutes: 180, allow_same_day_doubleheader: false, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-08T00:00:00Z", roster_lock_at: "2026-08-08T00:00:00Z", season_end_at: "2026-10-31T00:00:00Z" }, as: SectionAdmin, captures: { lg: $.data.id } }
            - { call: "POST /tennis/leagues/${lg}/open-registration", payload: {}, as: SectionAdmin }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H1 Alvarez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H2 Boyd", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H3 Cortez", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph3: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H4 Diallo", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph4: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H5 Eng", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph5: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "H6 Fournier", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { ph6: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A1 Garza", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa1: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A2 Haruki", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa2: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A3 Ibarra", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa3: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A4 Jensen", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa4: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A5 Kwan", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa5: $.data.id } }
            - { call: "POST /tennis/players", payload: { section_id: "${sec}", full_name: "A6 Lindqvist", birth_year: 1990, gender: "M" }, as: SectionAdmin, captures: { pa6: $.data.id } }
            - { call: "POST /tennis/players/${ph1}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${ph2}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${ph3}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${ph4}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${ph5}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${ph6}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa1}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa2}/ratings", payload: { source: "COMPUTER", level: 3.5 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa3}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa4}/ratings", payload: { source: "COMPUTER", level: 3.5 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa5}/ratings", payload: { source: "COMPUTER", level: 4.0 }, as: LeagueCoordinator }
            - { call: "POST /tennis/players/${pa6}/ratings", payload: { source: "COMPUTER", level: 3.5 }, as: LeagueCoordinator }
            - { call: "POST /tennis/teams", payload: { league_id: "${lg}", name: "Balboa Aces", home_facility_id: "${fac}" }, as: Captain, as_user_id: "${ph1}", captures: { th: $.data.id, tvh: $.data.version } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${th}", player_id: "${ph1}", expected_team_version: "${tvh}" }, as: Captain, as_user_id: "${ph1}", captures: { rh1: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${th}", player_id: "${ph2}", expected_team_version: "${tvh} + 1" }, as: Captain, as_user_id: "${ph1}", captures: { rh2: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${th}", player_id: "${ph3}", expected_team_version: "${tvh} + 2" }, as: Captain, as_user_id: "${ph1}", captures: { rh3: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${th}", player_id: "${ph4}", expected_team_version: "${tvh} + 3" }, as: Captain, as_user_id: "${ph1}", captures: { rh4: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${th}", player_id: "${ph5}", expected_team_version: "${tvh} + 4" }, as: Captain, as_user_id: "${ph1}", captures: { rh5: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${th}", player_id: "${ph6}", expected_team_version: "${tvh} + 5" }, as: Captain, as_user_id: "${ph1}", captures: { rh6: $.data.id } }
            - { call: "POST /tennis/roster-spots/${rh1}/activate", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/roster-spots/${rh2}/activate", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/roster-spots/${rh3}/activate", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/roster-spots/${rh4}/activate", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/roster-spots/${rh5}/activate", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/roster-spots/${rh6}/activate", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/teams", payload: { league_id: "${lg}", name: "Volley Kings", home_facility_id: "${fac}" }, as: Captain, as_user_id: "${pa1}", captures: { ta: $.data.id, tva: $.data.version } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa1}", expected_team_version: "${tva}" }, as: Captain, as_user_id: "${pa1}", captures: { ra1: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa2}", expected_team_version: "${tva} + 1" }, as: Captain, as_user_id: "${pa1}", captures: { ra2: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa3}", expected_team_version: "${tva} + 2" }, as: Captain, as_user_id: "${pa1}", captures: { ra3: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa4}", expected_team_version: "${tva} + 3" }, as: Captain, as_user_id: "${pa1}", captures: { ra4: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa5}", expected_team_version: "${tva} + 4" }, as: Captain, as_user_id: "${pa1}", captures: { ra5: $.data.id } }
            - { call: "POST /tennis/roster-spots", payload: { team_id: "${ta}", player_id: "${pa6}", expected_team_version: "${tva} + 5" }, as: Captain, as_user_id: "${pa1}", captures: { ra6: $.data.id } }
            - { call: "POST /tennis/roster-spots/${ra1}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/roster-spots/${ra2}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/roster-spots/${ra3}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/roster-spots/${ra4}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/roster-spots/${ra5}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/roster-spots/${ra6}/activate", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/teams/${th}/register", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/teams/${ta}/register", payload: {}, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/_clock/set_current_utc", payload: { current_utc: "2026-08-08T00:00:00Z" }, as: SectionAdmin }
            - { call: "POST /tennis/leagues/${lg}/lock-rosters", payload: {}, as: LeagueCoordinator }
            - { call: "POST /tennis/leagues/${lg}/start-play", payload: {}, as: LeagueCoordinator }
            - { call: "POST /tennis/matches", payload: { league_id: "${lg}", home_team_id: "${th}", away_team_id: "${ta}", stage: "REGULAR", round_number: 1 }, as: LeagueCoordinator, captures: { m1: $.data.id, m1v: $.data.version } }
            - { call: "POST /tennis/matches/${m1}/schedule", payload: { facility_id: "${fac}", scheduled_start_at: "2026-08-15T18:00:00Z", courts_required: 3, expected_match_version: "${m1v}" }, as: LeagueCoordinator }
            - { call: "POST /tennis/matches/${m1}/confirm", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/_clock/set_current_utc", payload: { current_utc: "2026-08-15T21:00:00Z" }, as: SectionAdmin }
            - { call: "POST /tennis/matches/${m1}/mark-played", payload: {}, as: LeagueCoordinator }
            - call: "POST /tennis/scorecards"
              payload:
                match_id: "${m1}"
                lines:
                  - { line_number: 1, home_player_ids: ["${ph1}", "${ph2}"], away_player_ids: ["${pa1}", "${pa2}"], set_scores: [{ home_games: 6, away_games: 4 }, { home_games: 6, away_games: 0 }], default_side: null }
                  - { line_number: 2, home_player_ids: ["${ph3}", "${ph4}"], away_player_ids: ["${pa3}", "${pa4}"], set_scores: [{ home_games: 6, away_games: 4 }, { home_games: 6, away_games: 3 }], default_side: null }
                  - { line_number: 3, home_player_ids: ["${ph5}", "${ph6}"], away_player_ids: ["${pa5}", "${pa6}"], set_scores: [{ home_games: 4, away_games: 6 }, { home_games: 4, away_games: 6 }], default_side: null }
              as: Captain
              as_user_id: "${ph1}"
              captures: { sc1: $.data.id }
            - { call: "POST /tennis/scorecards/${sc1}/review", payload: { decision: "VERIFY" }, as: Captain, as_user_id: "${pa1}" }
            - { call: "POST /tennis/matches", payload: { league_id: "${lg}", home_team_id: "${th}", away_team_id: "${ta}", stage: "PLAYOFF", round_number: 1 }, as: LeagueCoordinator, captures: { m2: $.data.id, m2v: $.data.version } }
            - { call: "POST /tennis/matches/${m2}/schedule", payload: { facility_id: "${fac}", scheduled_start_at: "2026-11-07T18:00:00Z", courts_required: 3, expected_match_version: "${m2v}" }, as: LeagueCoordinator }
            - { call: "POST /tennis/matches/${m2}/confirm", payload: {}, as: Captain, as_user_id: "${ph1}" }
            - { call: "POST /tennis/_clock/set_current_utc", payload: { current_utc: "2026-11-07T21:00:00Z" }, as: SectionAdmin }
            - { call: "POST /tennis/matches/${m2}/mark-played", payload: {}, as: LeagueCoordinator }
            - call: "POST /tennis/scorecards"
              payload:
                match_id: "${m2}"
                lines:
                  - { line_number: 1, home_player_ids: ["${ph1}", "${ph2}"], away_player_ids: ["${pa1}", "${pa2}"], set_scores: [{ home_games: 6, away_games: 7 }, { home_games: 0, away_games: 6 }], default_side: null }
                  - { line_number: 2, home_player_ids: ["${ph3}", "${ph4}"], away_player_ids: ["${pa3}", "${pa4}"], set_scores: [{ home_games: 3, away_games: 6 }, { home_games: 4, away_games: 6 }], default_side: null }
                  - { line_number: 3, home_player_ids: ["${ph5}", "${ph6}"], away_player_ids: ["${pa5}", "${pa6}"], set_scores: [{ home_games: 6, away_games: 2 }, { home_games: 6, away_games: 2 }], default_side: null }
              as: Captain
              as_user_id: "${ph1}"
              captures: { sc2: $.data.id }
            - { call: "POST /tennis/scorecards/${sc2}/review", payload: { decision: "VERIFY" }, as: Captain, as_user_id: "${pa1}" }
          trigger:
            - { call: "POST /tennis/sections/${sec}/year-end-recalc", payload: {}, as: SectionAdmin }
          assert:
            - "Player.${ph1}.dynamic_rating == 3.783"
            - "Player.${ph1}.proposed_recalc_dynamic == 3.740"
            - "Player.${ph1}.dynamic_rating != Player.${ph1}.proposed_recalc_dynamic"
            - "Player.${ph3}.dynamic_rating == 3.750 and Player.${ph3}.proposed_recalc_dynamic == 3.724"
            - "Player.${ph5}.dynamic_rating == 3.825 and Player.${ph5}.proposed_recalc_dynamic == 3.860"
            - "Player.${pa1}.dynamic_rating == 3.967 and Player.${pa1}.proposed_recalc_dynamic == 4.010"
            - "Player.${ph1}.verified_line_count == 2 and Player.${ph1}.verified_match_count == 2"
            - "Player.${ph1}.proposed_recalc_level == 4.0"
            - "Player.${pa2}.proposed_recalc_level == 4.0"
            - "Player.${ph1}.rating_level == 4.0"
            - "Section.${sec}.recalculated_player_count == 12"
            - "Section.${sec}.rating_period_status == RECALC_IN_PROGRESS"

      - name: standings_official_persisted_vs_provisional_reported_basis
        grounds:
          - calculations.team_standings_points
          - calculations.match_default_resolution
          - entities.Team.fields.standings_points
          - entities.Team.fields.lines_won
          - state_machines.Match.PENDING_to_REPORTED
          - state_machines.Match.REPORTED_to_VERIFIED
        distinguishing_aspect: |
          The Team-standings domain answers the same question two ways over one row set: the
          persisted official basis counts only the VERIFIED match (Team.standings_points == 1
          for the away team) while GET /tennis/leagues/{id}/standings?basis=PROVISIONAL adds
          the still-REPORTED match and returns 7 for the same team, and the home team's two
          bases coincide at 5 so a test cannot pass by uniformly inflating both.
        test_recipe:
          setup:
            - "Same section, facility, league and two six-player rosters as instance dynamic_rating_in_season_recency_vs_year_end_playoff_weight."
            - "Match M1 (2026-08-15) is VERIFIED: home wins lines 1 and 2, away wins line 3, so home 2 lines / away 1 line, sets 4-2, games 32-23."
            - "Match M3 (2026-08-20) is only REPORTED: the away captain's scorecard sweeps all three lines 6-2 6-2, i.e. away 3 lines, sets 0-6, games 12-36; nobody has reviewed it."
            - "Clock at 2026-08-20T21:00:00Z."
