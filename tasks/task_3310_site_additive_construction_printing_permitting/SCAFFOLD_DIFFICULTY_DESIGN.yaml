  # =====================================================================
  # Rule 9 — compensating_invariant (≥ 2, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:

      - name: fee_payment_plus_refund_conserves_outstanding
        grounds:
          - entities.PermitApplication.fields.fee_due_cents
          - entities.PermitApplication.fields.fee_paid_cents
          - calculations.permit_fee_calculation
        distinguishing_aspect: |
          Conserved quantity: outstanding_fee_cents = fee_due_cents - fee_paid_cents.
          Forward action: pay-fee adds X to fee_paid_cents. Compensating action: a
          resubmission recomputes fee_due_cents upward (with markup) — the
          invariant is that outstanding_fee_cents is always equal to
          permit_fee_calculation(current state) - fee_paid_cents, regardless of
          how many pay-fee and resubmit cycles have run. Pin inputs: original fee
          = 875000, pay 875000, outstanding == 0; resubmit (round 1) → fee_due
          becomes round_half_up(875000 * 1.1) = 962500, outstanding == 962500 - 875000 == 87500.
        test_recipe:
          setup:
            - "AM-routed PermitApplication in RESUBMIT_REQUIRED with review_round = 0 and fee_paid_cents = 875000."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JZ", name: "J-Z", permits_prescriptive_printed_path: false, alternative_means_review_days: 1, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jz_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan Z", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 100 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "ALTERNATIVE_MEANS" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${jz_id}", address: "801 T St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "ALTERNATIVE_MEANS" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "PAY_FEE", amount_cents: 875000 }
              as: PermitCoordinator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /construction/sites/${site_id}/permit-applications/${pa_id}"
              payload: {}
              as: PermitCoordinator
          trigger:
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "RESUBMIT" }
              as: PermitCoordinator
          assert:
            - "PermitApplication.${pa_id}.review_round == 1"
            - "PermitApplication.${pa_id}.fee_paid_cents == 875000 (payment preserved)"
            - "PermitApplication.${pa_id}.fee_due_cents == 962500"
            - "outstanding = fee_due_cents - fee_paid_cents == 87500 (conserved across forward pay and compensating resubmit)"

      - name: interruption_minutes_conserve_continuous_run
        grounds:
          - entities.PrintJob.fields.cumulative_interruption_minutes
          - entities.PrintJob.fields.continuous_run_minutes
          - calculations.cure_penalty_layers
        distinguishing_aspect: |
          Conserved quantity: actual_end_at - actual_start_at = continuous_run_minutes + cumulative_interruption_minutes.
          Forward action: an interruption adds N minutes to cumulative_interruption_minutes.
          Compensating action: complete stamps actual_end_at — the invariant is that
          continuous_run_minutes == (actual_end_at - actual_start_at) - cumulative_interruption_minutes,
          regardless of how many pauses occurred. Pin: actual run = 60 min wall, two pauses of
          5 and 7 minutes → cumulative = 12 → continuous_run = 48.
        test_recipe:
          setup:
            - "PrintJob started at 2026-09-04T08:00:00Z; paused WEATHER at 08:10, resumed at 08:15; paused OPERATOR at 08:30, resumed at 08:37."
            - "All 30 layers inspected and ACCEPTED. Job about to complete at 09:00."
          setup_api_calls:
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/jurisdictions"
              payload: { code: "JV", name: "J-V", permits_prescriptive_printed_path: true, alternative_means_review_days: 30, weather_station_id: "WX" }
              as: PlatformAdmin
              captures: { jv_id: $.data.id }
            - call: "POST /construction/structural-plans"
              payload: { title: "Plan V", structural_system: "PRINTED_WALL", wall_thickness_mm: 200, wall_height_mm: 3000, plan_area_m2: 80 }
              as: Engineer
              captures: { plan_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions"
              payload: { engineering_notes: "r1", required_code_path: "PRESCRIPTIVE" }
              as: Engineer
              captures: { rev_id: $.data.id }
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "SUBMIT" }
              as: Engineer
              as_user_id: "eng-alice"
            - call: "POST /construction/structural-plans/${plan_id}/revisions/${rev_id}/action"
              payload: { action: "APPROVE" }
              as: Engineer
              as_user_id: "eng-bob"
            - call: "POST /construction/sites"
              payload: { jurisdiction_id: "${jv_id}", address: "901 U St", soil_class: "A", foundation_kind: "SLAB" }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/action"
              payload: { action: "POUR_FOUNDATION" }
              as: SiteManager
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/action"
              payload: { action: "CONFIRM_CURE" }
              as: SiteManager
            - call: "GET /construction/sites/${site_id}"
              payload: {}
              as: PrintOperator
              captures: { site_v: $.data.version }
            - call: "POST /construction/sites/${site_id}/printer-setups"
              payload: { gantry_model: "VULCAN_II", rail_span_mm: 10000, leveling_tolerance_mm: 5.0, measured_level_deviation_mm: 3.0, expected_site_version: "${site_v}" }
              as: PrintOperator
              captures: { ps_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "LEVELED" }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/printer-setups/${ps_id}/advance"
              payload: { to_state: "QUALIFIED" }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/material-batches"
              payload: { mix_code: "LAVACRETE_C", water_cement_ratio: 0.40, target_slump_mm: 100, measured_slump_mm: 100, pump_consistency_kg_per_min: 40 }
              as: PrintOperator
              captures: { batch_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/material-batches/${batch_id}/qualify"
              payload: {}
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/weather-observations"
              payload: { observed_at: "2026-09-04T07:30:00Z", air_temp_c: 22.0, relative_humidity_pct: 50.0, wind_speed_mps: 3.0, precipitation_mm: 0 }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/permit-applications"
              payload: { plan_revision_id: "${rev_id}", requested_path: "PRESCRIPTIVE" }
              as: PermitCoordinator
              captures: { pa_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "SUBMIT" }
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "PAY_FEE", amount_cents: 99999999 }
              as: PermitCoordinator
            - call: "POST /construction/sites/${site_id}/permit-applications/${pa_id}/action"
              payload: { action: "DECIDE", decision: "APPROVE" }
              as: JurisdictionReviewer
            - call: "GET /construction/sites/${site_id}"
              payload: {}
              as: PrintOperator
              captures: { site_v2: $.data.version }
            - call: "POST /construction/sites/${site_id}/print-jobs"
              payload: { plan_revision_id: "${rev_id}", printer_setup_id: "${ps_id}", scheduled_start_at: "2026-09-04T08:00:00Z", scheduled_end_at: "2026-09-04T16:00:00Z", total_layers_planned: 30, expected_site_version: "${site_v2}" }
              as: PrintOperator
              captures: { job_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "READY_TO_PRINT" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:10:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PAUSED", cause: "WEATHER" }
              as: PrintOperator
            - call: "POST /construction/sites/${site_id}/weather-observations"
              payload: { observed_at: "2026-09-04T08:14:00Z", air_temp_c: 22.0, relative_humidity_pct: 50.0, wind_speed_mps: 3.0, precipitation_mm: 0 }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:15:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:30:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PAUSED", cause: "OPERATOR" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:37:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "PRINTING" }
              as: PrintOperator
            - call: "POST /construction/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/layer-inspections"
              payload: { layer_index_start: 1, layer_index_end: 30, bond_strength_mpa: 2.0, dimensional_deviation_mm: 4 }
              as: QualityInspector
              captures: { insp_id: $.data.id }
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/layer-inspections/${insp_id}/disposition"
              payload: { disposition: "ACCEPTED" }
              as: QualityInspector
          trigger:
            - call: "POST /construction/sites/${site_id}/print-jobs/${job_id}/transition"
              payload: { to_state: "COMPLETED" }
              as: PrintOperator
          assert:
            - "PrintJob.${job_id}.status == COMPLETED"
            - "PrintJob.${job_id}.cumulative_interruption_minutes == 12"
            - "PrintJob.${job_id}.continuous_run_minutes == 48"
            - "actual_end_at (09:00) - actual_start_at (08:00) = 60 min = 48 + 12 (conserved)"
