      - name: job_and_downtime_and_incident_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Job
          - state_machines.DowntimeEvent
          - state_machines.IncidentReport
        distinguishing_aspect: "Newly created Job starts execution_status=QUOTED with safety_status=CLEAR; a NEAR_MISS incident starts REPORTED and does NOT move safety_status (only SERIOUS/MAJOR trigger stop-work)."
