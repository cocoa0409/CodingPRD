            - "the ninth cycle (target_marker_present true) -> 200 with recurrent_genome_pct == 99.900 (still capped, still no bonus), bc_generation == 10, status == CONVERTED and BreedingLine.${rec_id}.disease_resistance_scores.SDS == 8"

