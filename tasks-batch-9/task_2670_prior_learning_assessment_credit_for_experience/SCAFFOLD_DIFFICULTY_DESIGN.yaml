  - rule_id: priority_pair_validation_conflict
    instances:
      - name: articulation_not_approved_priority21_beats_pla_cap_exceeded_priority39
        grounds:
          - validations[priority=21 ERR_ARTICULATION_NOT_APPROVED]
          - validations[priority=39 ERR_PLA_CAP_EXCEEDED]
          - calculations.program_pla_credit_capacity
          - endpoints[POST /pla-claims/{claim_id}/award]
          - endpoints[POST /articulation-rules/{rule_id}/suspend]
          - endpoints[PATCH /programs/{program_id}]
        distinguishing_aspect: |
          Both candidate errors carry HTTP 409, so the status code cannot
          discriminate them — only error_id can. The referential rule (21) and the
          fiscal capacity rule (39) are made simultaneously true on a single
          SCORED claim, and the response must be ERR_ARTICULATION_NOT_APPROVED;
          an implementation that computes the cheap arithmetic cap check before
          walking the crosswalk's status returns ERR_PLA_CAP_EXCEEDED and fails.
        test_recipe:
          setup:
            - "Program BSCS created with pla_max_credits 30 so nothing is capped while the claim is built."
            - "Course CS150 (6 credits, LOWER) with OC1 weight_bp 8000 / mastery 7000 and OC2 weight_bp 2000 / mastery 7000."
            - "CredentialRecommendation CLEP-CS PUBLISHED with ArticulationRule R1 -> CS150 APPROVED, awarded_credits 6, window [2026-01-01T00:00:00Z, open)."
            - "A CREDIT_BY_EXAM claim for 6 credits pinned to R1, invoice 19000 paid, assessor scored OC1 4/4 and OC2 3/4 so verified_coverage_bp is 9500 and the claim is SCORED with assessor_recommendation PASS."
            - "R1 is then SUSPENDED (suspend_reason MANUAL_REVIEW) — a SCORED claim is deliberately left untouched by the suspend cascade."
            - "The program's pla_max_credits is then PATCHed down to 3 so the cap is violated too."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["CREDIT_BY_EXAM", "PORTFOLIO"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /credential-recommendations"
              payload: { source_type: "CREDIT_BY_EXAM", credential_code: "CLEP-CS", title: "CLEP Computing", issuing_body: "College Board", recommended_credits: 6, recommended_level: "LOWER", effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { rec_id: "$.data.id" }
            - call: "POST /credential-recommendations/${rec_id}/publish"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "POST /articulation-rules"
              payload: { recommendation_id: "${rec_id}", course_id: "${course_id}", awarded_credits: 6, effective_from: "2026-01-01T00:00:00Z" }
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
              captures: { r1_id: "$.data.id" }
            - call: "POST /articulation-rules/${r1_id}/submit-for-review"
              as: ArticulationOfficer
              as_user_id: "officer-reviewer"
            - call: "GET /credential-recommendations/${rec_id}"
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { rec_v1: "$.data.version" }
            - call: "POST /articulation-rules/${r1_id}/approve"
              payload: { expected_recommendation_version: "${rec_v1}" }
              as: ArticulationOfficer
              as_user_id: "officer-approver"
              captures: { r1_pin: "$.data.pinned_recommendation_version" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "CREDIT_BY_EXAM", credits_requested: 6, articulation_rule_id: "${r1_id}", attempt_date: "2026-06-15T00:00:00Z", rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
