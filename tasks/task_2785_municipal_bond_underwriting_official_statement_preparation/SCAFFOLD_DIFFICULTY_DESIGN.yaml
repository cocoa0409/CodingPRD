          - calculations.credit_enhancement_premium_and_net_proceeds
          - state_machines.OfficialStatementSection.APPROVED_to_NEEDS_REVISION
        distinguishing_aspect: |
          Different trigger (POST /credit-enhancements/{id}/withdraw) and a different four-hop
          chain that starts in the enhancement, not in the disclosure: enhancement status (hop 1)
          -> the insured tranche loses is_insured and reverts rating_basis to UNDERLYING (hop 2,
          only because hop 1 happened) -> Deal.credit_enhancement_premium_usd collapses from
          33750.00 to 0.00 because the deal now has no insured tranche (hop 3, only because hop 2
          cleared the flag) -> APPROVED sections carrying references_credit_enhancement true drop
          to NEEDS_REVISION and clearance is downgraded (hop 4, only because hop 3 changed a
          disclosed figure). Sections without the flag are untouched, which is what separates this
          cascade's hop 2 scoping from the RISK_FACTOR scoping of the revision cascade.
        test_recipe:
          setup:
            - "One municipal advisor firm, one underwriting firm and one issuer exist."
            - "A PRICING_NEGOTIATED deal carries tranche 1 of 5,000,000 (coupon 5.000, matures 2036-08-01, 20 semiannual periods) and tranche 2 of 5,000,000 (coupon 5.000, matures 2046-08-01)."
            - "A COMMITTED BOND_INSURANCE enhancement at 45 bps insures tranche 1 only, so insured_debt_service_usd is 7500000.00 and premium_usd is 33750.00."
            - "Statement POS-1 is IN_REVIEW with four APPROVED mandatory sections; the UNDERWRITING section carries references_credit_enhancement true and the TAX_MATTERS section does not."
