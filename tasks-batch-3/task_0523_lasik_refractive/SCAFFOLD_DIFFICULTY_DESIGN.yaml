  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_active_booking_count_to_zero
        grounds:
          - state_machines.SurgeryCase.clinical_status=PLANNED_to_clinical_status=SCHEDULED
          - state_machines.SurgeryCase.clinical_status IN {PLANNED, SCHEDULED, CONSENTED}_to_clinical_status=CANCELLED
          - entities.SuiteBooking.fields.status
        distinguishing_aspect: |
          Conserved quantity = count of ACTIVE SuiteBookings for a case. Forward (book) makes it 1; compensating (cancel) releases the
          booking so the count returns to exactly 0 with no drift — a count invariant, distinct from the retained-cents money invariant below.
        test_recipe:
          setup:
            - "A SCHEDULED, funded case with exactly one ACTIVE SuiteBooking."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v0: $.data.version }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 100000, term_months: 12, apr_bps: 0 }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v0}" }
              as: Coordinator
            - call: "GET /refractive/cases/${case1}"
              payload: {}
              as: Coordinator
              captures: { case1_v1: $.data.version }
          trigger:
            - call: "POST /refractive/cases/${case1}/cancel"
              payload: { expected_case_version: "${case1_v1}" }
              as: Coordinator
            - call: "GET /refractive/cases/${case1}/bookings"
              payload: {}
              as: Coordinator
          assert:
            - "Before cancel: exactly 1 SuiteBooking of the case with status ACTIVE"
            - "After cancel: GET /refractive/cases/${case1}/bookings returns 1 booking, all with status RELEASED (0 ACTIVE)"

      - name: refund_pro_rata_conserves_retained_deposit
        grounds:
          - calculations.refund_payout
          - entities.FinancingPlan.fields.amount_settled_cents
          - entities.TreatmentPackage.fields.deposit_cents
          - state_machines.RefundClaim.PENDING_to_PAID
        distinguishing_aspect: |
          Conserved quantity = center-retained cents after a PRO_RATA refund == package.deposit_cents. Forward = collect base 500000;
          compensating = refund settled - deposit (450000), so retained == amount_settled_cents - refund_amount_cents == 50000 == deposit,
          exactly, with zero drift. A money invariant, distinct from the booking-count invariant above.
        test_recipe:
          setup:
            - "A HEALED, PAID_IN_FULL case (settled 500000) on a PRO_RATA package (deposit 50000), missed guarantee (final 0.5 < 1.0), with a PENDING refund claim."
          setup_api_calls:
            - call: "POST /refractive/packages"
              payload: { tier: "STANDARD", base_price_cents: 500000, deposit_cents: 50000, enhancement_window_days: 365, outcome_guarantee_uncorrected_va: 1.0, refund_mode: "PRO_RATA" }
              as: Coordinator
              captures: { pkg: $.data.id }
            - call: "POST /refractive/optometrists"
              payload: { full_name: "OD A" }
              as: Coordinator
              captures: { od_id: $.data.id }
            - call: "POST /refractive/surgeons"
              payload: { full_name: "Dr A", max_daily_cases: 5 }
              as: Coordinator
              captures: { surg_id: $.data.id }
            - call: "POST /refractive/suites"
              payload: { name: "S1", turnaround_buffer_minutes: 15, daily_case_cap: 5 }
              as: Coordinator
              captures: { suite_id: $.data.id }
            - call: "POST /refractive/patients"
              payload: { full_name: "P1", date_of_birth: "2000-01-01" }
              as: Coordinator
              captures: { pat1: $.data.id }
            - call: "POST /refractive/screenings"
              payload: { patient_id: "${pat1}", performed_by_optometrist_id: "${od_id}", corneal_thickness_um: 550, topography_k_max: 44.0, refractive_error_diopters: 3.0 }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { scr1: $.data.id }
            - call: "POST /refractive/screenings/${scr1}/submit"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /refractive/screenings/${scr1}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/cases"
              payload: { patient_id: "${pat1}", screening_id: "${scr1}", package_id: "${pkg}" }
              as: Coordinator
              captures: { case1: $.data.id, case1_v: $.data.version }
            - call: "POST /refractive/cases/${case1}/financing"
              payload: { down_payment_cents: 500000, term_months: 1, apr_bps: 0 }
              as: Coordinator
              captures: { plan1: $.data.id }
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/bookings"
              payload: { suite_id: "${suite_id}", surgeon_id: "${surg_id}", slot_start: "2026-06-01T09:00:00Z", slot_end: "2026-06-01T10:00:00Z", expected_case_version: "${case1_v}" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/consent"
              payload: { drops_regimen_started: true, signed_by_patient_id: "${pat1}" }
              as: Patient
              as_user_id: "${pat1}"
            - call: "POST /refractive/cases/${case1}/operate"
              payload: {}
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: Coordinator
            - call: "POST /refractive/cases/${case1}/heal"
              payload: { final_uncorrected_va: 0.5 }
              as: Surgeon
              as_user_id: "${surg_id}"
            - call: "POST /refractive/refund-claims"
              payload: { case_id: "${case1}" }
              as: Coordinator
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /refractive/refund-claims/${claim}/adjudicate"
              payload: { decision: "PAY" }
              as: Coordinator
              captures: { refund_amt: $.data.refund_amount_cents }
          assert:
            - "RefundClaim.${claim}.refund_amount_cents == 450000"
            - "FinancingPlan.${plan1}.amount_settled_cents - RefundClaim.${claim}.refund_amount_cents == 50000"
            - "That retained amount 50000 == TreatmentPackage(pkg).deposit_cents"
