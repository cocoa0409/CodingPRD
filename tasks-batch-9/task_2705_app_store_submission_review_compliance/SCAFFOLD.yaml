      - "state = DRAFT; every other Submission of the app still in state DRAFT moves to DEVELOPER_WITHDRAWN (with its expedite refunds)"
      - "Increments AppRecord.version by 1"

  - method: GET
    path: /submissions
    description: "List submissions."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformReviewer, PlatformAppealBoard, PlatformPolicyAdmin, Auditor]
    input: ["app_record_id?", "signing_credential_id?", "review_window_id?", "state?", "priority_band?", "submission_channel?", "limit?", "offset?"]
