              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /facility-consults"
              payload: { case_id: "${case}", facility_id: "${fac}", consult_duration_minutes: 90 }
              as: Toxicologist
              as_user_id: "${tox}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_FACILITY_NOT_ACCEPTING (409)"
            - "HealthcareFacility.${fac}.active_consult_count == 0 (unchanged)"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: case_followup_halfopen_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_FOLLOWUP_OVERLAP]
          - entities.FollowUpCall.fields.scheduled_start
        distinguishing_aspect: |
          Two follow-up calls on the SAME case may not overlap under half-open [start,end)
          semantics: [00:15,00:45) overlapping an existing [00:00,00:30) is rejected, while an
          adjacent [00:30,01:00) (end==start) is accepted; the case is the contended resource.
        test_recipe:
          setup:
            - "A triaged case; two specialists (spi placing call 1, spi2 for later calls to isolate the case-overlap rule from the specialist-buffer rule)."
            - "Follow-up call 1 scheduled [2026-06-02T00:00Z, 00:30Z) by spi."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Pat SPI2", credential: "SPI" }
              as: SystemAdmin
              captures: { spi2: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi}", sequence_index: 0, scheduled_start: "2026-06-02T00:00:00Z", scheduled_end: "2026-06-02T00:30:00Z" }
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /exposure-cases/${case}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi2}", sequence_index: 1, scheduled_start: "2026-06-02T00:15:00Z", scheduled_end: "2026-06-02T00:45:00Z" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
            - call: "POST /exposure-cases/${case}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi2}", sequence_index: 2, scheduled_start: "2026-06-02T00:30:00Z", scheduled_end: "2026-06-02T01:00:00Z" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { adj: $.data.id }
          assert:
            - "trigger[0] error_id == ERR_FOLLOWUP_OVERLAP (409) for [00:15,00:45) vs [00:00,00:30)"
            - "trigger[1] FollowUpCall.${adj}.status == SCHEDULED (adjacency end==start allowed)"

      - name: specialist_buffer_double_booking
        grounds:
          - validations[priority=13]
          - errors[ERR_SPECIALIST_DOUBLE_BOOKED]
          - entities.FollowUpCall.fields.assigned_specialist_id
        distinguishing_aspect: |
          The same assigned_specialist_id cannot hold two calls across DIFFERENT cases whose
          closed intervals are < 15 minutes apart: [10:30,10:45] is rejected against an existing
          [10:00,10:30] (0-min gap), while [10:45,11:00] (exactly 15-min gap) is accepted; a
          closed-interval + buffer semantics on the Specialist resource, unlike the case-level
          half-open adjacency.
        test_recipe:
          setup:
            - "One specialist spi; two triaged cases case1 and case2."
            - "case1 has a follow-up [2026-06-02T10:00Z,10:30Z] assigned to spi."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "case1" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case1: $.data.id }
            - call: "POST /exposure-cases/${case1}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case1}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case1}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi}", sequence_index: 0, scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T10:30:00Z" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 7, patient_weight_kg: 22, patient_sex: "FEMALE", chief_complaint: "case2" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case2: $.data.id }
            - call: "POST /exposure-cases/${case2}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case2}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
          trigger:
            - call: "POST /exposure-cases/${case2}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi}", sequence_index: 0, scheduled_start: "2026-06-02T10:30:00Z", scheduled_end: "2026-06-02T10:45:00Z" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
            - call: "POST /exposure-cases/${case2}/follow-up-calls"
              payload: { assigned_specialist_id: "${spi}", sequence_index: 1, scheduled_start: "2026-06-02T10:45:00Z", scheduled_end: "2026-06-02T11:00:00Z" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ok: $.data.id }
          assert:
            - "trigger[0] error_id == ERR_SPECIALIST_DOUBLE_BOOKED (409) for [10:30,10:45] (0-min gap < 15)"
            - "trigger[1] FollowUpCall.${ok}.status == SCHEDULED ([10:45,11:00], exactly 15-min gap allowed)"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: facility_active_consult_count_invariant
        grounds:
          - state_machines.FacilityConsult.ACTIVE_to_CLOSED
          - entities.HealthcareFacility.fields.active_consult_count
          - entities.FacilityConsult.fields.status
        distinguishing_aspect: |
          Opening a FacilityConsult increments HealthcareFacility.active_consult_count and closing
          it decrements; the conserved quantity active_consult_count == count of ACTIVE consults
          for the facility returns to 0 after the open+close pair.
        test_recipe:
          setup:
            - "ACCEPTING facility (capacity 2); a triaged MODERATE case with a COMPLETED RiskAssessment; confirmed dose kept at 1500 so no escalation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /healthcare-facilities"
              payload: { name: "Metro ED", facility_type: "ED", status: "ACCEPTING", consult_capacity: 2 }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Tara Tox", credential: "TOXICOLOGIST" }
              as: SystemAdmin
              captures: { tox: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /facility-consults"
              payload: { case_id: "${case}", facility_id: "${fac}", consult_duration_minutes: 90 }
              as: Toxicologist
              as_user_id: "${tox}"
              captures: { consult: $.data.id }
          trigger:
            - call: "POST /facility-consults/${consult}/close"
              payload: { confirmed_dose_mg: 1500 }
              as: Toxicologist
              as_user_id: "${tox}"
          assert:
            - "HealthcareFacility.${fac}.active_consult_count == 0 after close (was 1 after open)"
            - "FacilityConsult.${consult}.status == CLOSED"

      - name: substance_surveillance_count_invariant
        grounds:
          - state_machines.NpdsReport.SUBMITTED_to_RETRACTED
          - entities.Substance.fields.aggregate_case_count
          - validations[priority=16]
        distinguishing_aspect: |
          Submitting an NpdsReport increments Substance.aggregate_case_count and retracting
          decrements; the conserved quantity aggregate_case_count == count of SUBMITTED reports
          for the substance returns to 0 after the submit+retract pair -- a different conserved
          quantity than facility consult load.
        test_recipe:
          setup:
            - "A triaged case with a COMPLETED RiskAssessment (active); substance acetaminophen."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /npds-reports"
              payload: { case_id: "${case}", primary_substance_id: "${sub_apap}" }
              as: SurveillanceOfficer
              captures: { report: $.data.id }
          trigger:
            - call: "POST /npds-reports/${report}/retract"
              payload: {}
              as: SurveillanceOfficer
          assert:
            - "Substance.${sub_apap}.aggregate_case_count == 0 after retract (was 1 after submit)"
            - "NpdsReport.${report}.report_status == RETRACTED"
