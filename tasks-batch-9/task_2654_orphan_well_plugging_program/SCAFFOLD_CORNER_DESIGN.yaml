          - state_machines.Operator.transitions.INSOLVENT_to_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / bond_forfeiture_cascades_operator_to_funding_source_to_wells_to_scores
          rationale: "The four-hop forfeiture cascade is asserted end-to-end by that 1.8 instance."

      - name: ledger_sync_plugging_acceptance_recomputes_operator_aggregates
        claim_type: Ledger sync
        grounds:
          - endpoints["POST /plugging-jobs/{id}/review"].side_effects
          - state_machines.Well.transitions.PLUGGING_SCHEDULED_to_PLUGGED
        excluded_because:
          difficulty_instance: transitive_cascade / plugging_acceptance_cascades_job_to_well_to_operator_standing_and_tasks
          rationale: "The job -> well -> operator standing chain and the three task rows are asserted by that 1.8 instance."

  - section: calculations
    instances:
      - name: risk_components_are_rounded_to_two_dp_before_any_weighting
        claim_type: Precision
        grounds:
          - calculations.orphan_priority_score.precision
          - calculations.orphan_priority_score.formula
        distinguishing_aspect: |
          Two rounding decisions are pinned in one row: each risk component is rounded to 2 dp
          BEFORE it is weighted (weighting the raw 3.337/5 = 0.6674 gives 7.96 / 9.76 instead of
          7.97 / 9.77), and the weighted sum itself is round_half_up, since the remediation total
          lands exactly on 9.765 where banker's rounding would report 9.76.
        test_recipe:
          setup:
            - "one Operator; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Wind River Petroleum", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 1000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30001", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 3.337, groundwater_depth_ft: 600, population_within_1000ft: 3, surface_disturbance_acres: 0.777 }
              as: FieldInspector
              as_user_id: "u_insp"
          assert:
            - "HTTP 201 with data.screening_score == 7.97"
            - "data.remediation_score == 9.77"
            - "screening_score is NOT 7.96, the value obtained by weighting the unrounded 0.6674 methane component"
            - "remediation_score is NOT 9.76, the value obtained by weighting the unrounded methane component"
            - "remediation_score is NOT 9.76 by half-even rounding of the exact 9.765 weighted sum: round_half_up is required"
            - "data.idle_months == 999 and data.cumulative_boe_60mo == 0"

      - name: groundwater_band_boundaries_select_the_adjacent_constant
        claim_type: Constants Applied
        grounds:
          - calculations.orphan_priority_score.constants.GROUNDWATER_BAND_FT
          - calculations.orphan_priority_score.constants.GROUNDWATER_BAND_SCORES
        distinguishing_aspect: |
          All three band edges are probed from both sides with every other risk input zeroed, so the
          score is a pure readout of the band constant: 50 ft and 51 ft, 200 ft and 201 ft, 500 ft
          and 501 ft. The upper edge belongs to the deeper-protection band (<=), so 50 -> 100 and
          51 -> 75; an implementation using < would report 22.50 for the 50 ft well.
        test_recipe:
          setup:
            - "one Operator; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Wind River Petroleum", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 1000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30050", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 0, groundwater_depth_ft: 50, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30051", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 0, groundwater_depth_ft: 51, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30200", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 0, groundwater_depth_ft: 200, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30201", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 0, groundwater_depth_ft: 201, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30500", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 0, groundwater_depth_ft: 500, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30501", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 0, groundwater_depth_ft: 501, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
          assert:
            - "the 50 ft well: screening_score == 30.00 and remediation_score == 25.00"
            - "the 51 ft well: screening_score == 22.50 and remediation_score == 18.75"
            - "the 200 ft well: screening_score == 22.50 and remediation_score == 18.75"
            - "the 201 ft well: screening_score == 12.00 and remediation_score == 10.00"
            - "the 500 ft well: screening_score == 12.00 and remediation_score == 10.00"
            - "the 501 ft well: screening_score == 3.00 and remediation_score == 2.50"
            - "no well reports a screening_score of 0, which is what an unbanded linear depth term would produce"
            - "with population_within_1000ft == 0 the remediation >= 5 resident override does not fire, so the two variants differ only by their weight vectors"

      - name: variant_divergence_on_a_single_well_row
        claim_type: Variant Divergence
        grounds:
          - calculations.orphan_priority_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / well_screening_variant_vs_remediation_variant_diverge_on_one_row
          rationale: "The screening/remediation delta on identical inputs, including the >= 5 resident population override, is the whole substance of that 1.8 instance."

      - name: unrounded_row_boe_is_summed_and_rounded_once_at_the_aggregate
        claim_type: Precision
        grounds:
          - calculations.orphan_classification_criteria.precision
          - entities.ProductionRecord.fields.boe
        distinguishing_aspect: |
          Three identical months of 1 mcf each expose the aggregation order: 1/6 stored unrounded
          three times sums to exactly 0.5 -> 0.50, while rounding each row to 0.17 first and then
          summing yields 0.51. Only one number can be right and the two differ by a cent of BOE
          right where the de-minimis test is decided.
        test_recipe:
          setup:
            - "one Well with no production history; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Wind River Petroleum", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 1000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30777", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-06", oil_bbl: 0, gas_mcf: 1 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 0, gas_mcf: 1 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-08", oil_bbl: 0, gas_mcf: 1 }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "each of the three POSTs returns HTTP 201 with data.boe equal to the unrounded 1/6 (0.1666..., not 0.17)"
            - "after the third record Well.${w_id}.cumulative_boe_60mo == 0.50"
            - "cumulative_boe_60mo is NOT 0.51, the value produced by rounding each row to 0.17 before summing"
            - "Well.${w_id}.last_production_month == 2026-08 and idle_months == 0"
            - "Well.${w_id}.screening_score == 59.90 and remediation_score == 81.00 are unchanged by production reporting"

      - name: de_minimis_window_is_sixty_inclusive_months_ending_at_the_clock_month
        claim_type: Input Set Filtering
        grounds:
          - calculations.orphan_classification_criteria.input_set
          - calculations.orphan_classification_criteria.constants.DE_MINIMIS_WINDOW_MONTHS
        distinguishing_aspect: |
          With the clock at 2026-08 the window is 2021-09 through 2026-08 inclusive, so the row at
          2021-08 is one month outside and must be dropped even though it is stored and returned by
          the list endpoint. That row alone carries 5000 bbl, so an off-by-one window boundary does
          not merely shift the total, it flips the well from de-minimis to producing volumes.
        test_recipe:
          setup:
            - "one Well with three production months: 2021-08 (outside the window), 2021-09 (the first in-window month) and 2026-08 (the clock month)"
            - "logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Wind River Petroleum", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 1000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-013-30888", operator_id: "${op_id}", spud_year: 1961, total_depth_ft: 2500, casing_strings: 1, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2021-08", oil_bbl: 5000, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op_id}"
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2021-09", oil_bbl: 10, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-08", oil_bbl: 20, gas_mcf: 0 }
              as: Operator
              as_user_id: "${op_id}"
          assert:
            - "after the 2021-08 row alone: Well.${w_id}.cumulative_boe_60mo == 0.00 (the row is outside the inclusive window)"
            - "after the 2021-09 row: Well.${w_id}.cumulative_boe_60mo == 10.00 (2021-09 is exactly the first in-window month)"
            - "after the trigger: Well.${w_id}.cumulative_boe_60mo == 30.00"
            - "cumulative_boe_60mo is NOT 5030.00: the 2021-08 row is never counted"
            - "GET /wells/${w_id}/production-records returns total_count == 3, so the excluded row is stored and readable, only filtered out of the aggregate"
            - "Well.${w_id}.last_production_month == 2026-08 and idle_months == 0"

      - name: depth_tier_boundaries_are_inclusive_on_their_upper_edge
        claim_type: Constants Applied
        grounds:
          - calculations.operator_financial_assurance_requirement.constants.DEPTH_TIER_FT
          - calculations.operator_financial_assurance_requirement.constants.DEPTH_TIER_BASE_CENTS
        distinguishing_aspect: |
          Both tier edges are straddled inside a single operator inventory: 3000 ft and 3001 ft,
          7000 ft and 7001 ft. Because the comparison is <=, the 3000 ft well takes 250000 and the
          7000 ft well takes 750000; a < comparison would push both up a tier and report 4250000
          instead of 3250000 for the same four wells.
        test_recipe:
          setup:
            - "one BLANKET operator; logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Powder River Deep Gas", region_code: "WY", financial_assurance_tier: "BLANKET", bond_amount_cents: 3250000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { api_well_number: "49-005-13000", operator_id: "${op_id}", spud_year: 1988, total_depth_ft: 3000, casing_strings: 2, methane_scfd: 0, groundwater_depth_ft: 600, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-005-13001", operator_id: "${op_id}", spud_year: 1988, total_depth_ft: 3001, casing_strings: 2, methane_scfd: 0, groundwater_depth_ft: 600, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-005-17000", operator_id: "${op_id}", spud_year: 1988, total_depth_ft: 7000, casing_strings: 3, methane_scfd: 0, groundwater_depth_ft: 600, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells"
              payload: { api_well_number: "49-005-17001", operator_id: "${op_id}", spud_year: 1988, total_depth_ft: 7001, casing_strings: 3, methane_scfd: 0, groundwater_depth_ft: 600, population_within_1000ft: 0, surface_disturbance_acres: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
          assert:
            - "after the 3000 ft well: Operator.${op_id}.required_bond_cents == 250000"
            - "after the 3001 ft well: Operator.${op_id}.required_bond_cents == 1000000"
            - "after the 7000 ft well: Operator.${op_id}.required_bond_cents == 1750000"
            - "after the 7001 ft well: Operator.${op_id}.required_bond_cents == 3250000"
            - "required_bond_cents is NOT 4250000, the total a strict < tier comparison would produce"
            - "Operator.${op_id}.active_well_count == 4 and status == ACTIVE (bond_amount_cents 3250000 exactly equals the requirement)"

      - name: price_score_basis_is_the_cheapest_responsive_bid_not_the_cheapest_bid
        claim_type: Input Set Filtering
        grounds:
          - calculations.bid_composite_score.input_set
          - calculations.bid_composite_score.formula
        distinguishing_aspect: |
          The cheapest bid in the solicitation is NONRESPONSIVE, so it must leave the price_score
          denominator basis untouched and receive no scores at all. Including it would rescale every
          responsive bid (the winner's price_score would be 84.66 and its composite 82.80 instead of
          100.00 and 92.00) without changing which bid wins, so only the numbers expose the bug.
        test_recipe:
          setup:
            - "one EVALUATING solicitation with three bids from three contractors: the cheapest marked NONRESPONSIVE, two marked RESPONSIVE"
            - "logical clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /contractors"
              payload: { name: "Lowball Well Service", license_number: "P-20001", bond_amount_cents: 2500000, performance_score: 40 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { cx_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-20002", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { cy_id: $.data.id }
            - call: "POST /contractors"
              payload: { name: "Teton Cementing", license_number: "P-20003", bond_amount_cents: 2500000, performance_score: 95 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { cz_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "district 3 orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${cx_id}", cement_per_sack_cents: 3000, rig_day_rate_cents: 700000, casing_per_ft_cents: 1000, mobilization_fee_cents: 2000000, technical_score: 55 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bx_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${cy_id}", cement_per_sack_cents: 4000, rig_day_rate_cents: 800000, casing_per_ft_cents: 1200, mobilization_fee_cents: 2400000, technical_score: 80 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { by_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${cz_id}", cement_per_sack_cents: 5000, rig_day_rate_cents: 1000000, casing_per_ft_cents: 1500, mobilization_fee_cents: 3000000, technical_score: 95 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bz_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bx_id}/evaluation"
              payload: { outcome: "NONRESPONSIVE", reason: "technical score 55 below the 70 minimum" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${by_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bz_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
          trigger:
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_award"
          assert:
            - "at submission time the three bids carry evaluated_unit_cost_cents 5960000, 7040000 and 8800000 with price_score == null and composite_score == null"
            - "after the award Bid.${by_id}.price_score == 100.00 and composite_score == 92.00"
            - "after the award Bid.${bz_id}.price_score == 80.00 and composite_score == 86.00"
