              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_1"
            - call: "POST /serving-endpoints"
              payload: { name: "rt-cluster-a", region: "us-east-1", serving_feature_spec_hash: "fs-v1", max_traffic_pct: 100.00, deploy_cooldown_minutes: 30 }
              as: PlatformAdmin
              as_user_id: "u_admin_1"
              captures: { se1_id: $.data.id, se1_v: $.data.version }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "REALTIME", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v}", fallback_strategy: "PREVIOUS_CHAMPION" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_id: $.data.id }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
          trigger:
            - call: "POST /skew-checks"
              payload: { model_version_id: "${v1_id}", deployment_id: "${d1_id}", training_feature_stats: { amount: { mean: 0.8000 } }, serving_feature_stats: { amount: { mean: 0.99992 } } }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { just_under_ratio: $.data.max_skew_ratio, just_under_status: $.data.status }
            - call: "POST /skew-checks"
              payload: { model_version_id: "${v1_id}", deployment_id: "${d1_id}", training_feature_stats: { amount: { mean: 0.8000 } }, serving_feature_stats: { amount: { mean: 0.99998 } } }
              as: MLEngineer
