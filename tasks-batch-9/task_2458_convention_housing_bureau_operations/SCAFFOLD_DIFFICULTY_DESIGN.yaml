            - "HotelBlock.${block_id}.revision_round == 3"
            - "HotelBlock.${block_id}.status == CHANGES_REQUESTED"
            - "HotelBlock.${block_id}.negotiated_nightly_rate_cents == 22900"
            - "HotelBlock.${block_id}.version == ${block_v7}"

      - name: reservation_occupancy_and_transmission_axes_evolve_independently
        grounds:
          - state_machines.Reservation.reservation_status.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.transmission_status.NOT_TRANSMITTED_to_TRANSMITTED
          - state_machines.Reservation.transmission_status.TRANSMITTED_to_CHANGE_PENDING
          - state_machines.Reservation.transmission_status.CHANGE_PENDING_to_TRANSMITTED
          - calculations.rooming_list_transmission_set
        distinguishing_aspect: |
          Non-linearity on Reservation is parallel state dimensions on one row, a different entity
          from the HotelBlock cycle: the row ends at reservation_status == CANCELLED (terminal on the
          occupancy axis) while its transmission_status still moves TRANSMITTED -> CHANGE_PENDING ->
          TRANSMITTED, so a cancelled stay is legitimately re-transmitted in batch_seq 2.
