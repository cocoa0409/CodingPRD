              captures: { nf_officer: $.data.error_id }
            - call: "GET /show-up-curves/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_curve: $.data.error_id }
            - call: "GET /flight-schedule-entries/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_flight: $.data.error_id }
            - call: "GET /time-bands/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_band: $.data.error_id }
            - call: "GET /staffing-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_plan: $.data.error_id }
            - call: "GET /lane-assignments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_assignment: $.data.error_id }
            - call: "GET /wait-observations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_observation: $.data.error_id }
            - call: "GET /escalation-tickets/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_ticket: $.data.error_id }
            - call: "GET /screening-referrals/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_referral: $.data.error_id }
            - call: "GET /surge-details/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              expect_status: 404
              captures: { nf_detail: $.data.error_id }
          assert:
            - "each capture equals its own code: ${nf_checkpoint} ERR_CHECKPOINT_NOT_FOUND, ${nf_lane} ERR_LANE_NOT_FOUND, ${nf_equipment} ERR_EQUIPMENT_UNIT_NOT_FOUND, ${nf_officer} ERR_OFFICER_NOT_FOUND, ${nf_curve} ERR_SHOW_UP_CURVE_NOT_FOUND"
            - "${nf_flight} ERR_FLIGHT_SCHEDULE_ENTRY_NOT_FOUND, ${nf_band} ERR_TIME_BAND_NOT_FOUND, ${nf_plan} ERR_STAFFING_PLAN_NOT_FOUND, ${nf_assignment} ERR_LANE_ASSIGNMENT_NOT_FOUND"
            - "${nf_observation} ERR_WAIT_TIME_OBSERVATION_NOT_FOUND, ${nf_ticket} ERR_ESCALATION_TICKET_NOT_FOUND, ${nf_referral} ERR_SCREENING_REFERRAL_NOT_FOUND, ${nf_detail} ERR_SURGE_DETAIL_NOT_FOUND"
            - "every response carries HTTP 404 and a non-empty ${nf_message}"

      - name: body_foreign_keys_are_resolved_in_declared_input_order
        claim_type: error_triggerable
        grounds:
          - validations[priority 5]
          - endpoints.POST_lane-assignments
          - endpoints.POST_staffing-plans
          - endpoints.POST_flight-schedule-entries
        distinguishing_aspect: "With several dangling FKs in one body, WHICH 404 comes back is fully determined by the order of the endpoint's input[] declaration, and the whole FK-existence layer sits ahead of the OCC check — so a bad checkpoint plus a stale version is a 404, never a 412."
        test_recipe:
          setup: ["one checkpoint with an equipped lane, one officer, one curve, one forecast band"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "00000000-0000-0000-0000-0000000000ff", lane_id: "00000000-0000-0000-0000-0000000000ff", officer_id: "00000000-0000-0000-0000-0000000000ff", time_band_id: "00000000-0000-0000-0000-0000000000ff" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 404
              captures: { fk_first: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "00000000-0000-0000-0000-0000000000ff", officer_id: "00000000-0000-0000-0000-0000000000ff", time_band_id: "00000000-0000-0000-0000-0000000000ff" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 404
              captures: { fk_second: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "00000000-0000-0000-0000-0000000000ff", time_band_id: "00000000-0000-0000-0000-0000000000ff" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 404
              captures: { fk_third: $.data.error_id }
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "00000000-0000-0000-0000-0000000000ff" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 404
              captures: { fk_fourth: $.data.error_id }
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "00000000-0000-0000-0000-0000000000ff", show_up_curve_id: "00000000-0000-0000-0000-0000000000ff", flight_number: "AA900", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              expect_status: 404
              captures: { fk_flight_first: $.data.error_id }
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "00000000-0000-0000-0000-0000000000ff", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v1}" }
              as: StaffingPlanner
              as_user_id: planner-1
              expect_status: 404
              captures: { fk_plan_before_occ: $.data.error_id }
          assert:
            - "${fk_first} == ERR_STAFFING_PLAN_NOT_FOUND — staffing_plan_id is declared first"
            - "${fk_second} == ERR_LANE_NOT_FOUND, ${fk_third} == ERR_OFFICER_NOT_FOUND, ${fk_fourth} == ERR_TIME_BAND_NOT_FOUND — the codes walk the input[] order as each earlier id is repaired"
            - "${fk_flight_first} == ERR_CHECKPOINT_NOT_FOUND, not ERR_SHOW_UP_CURVE_NOT_FOUND — checkpoint_id precedes show_up_curve_id"
            - "${fk_plan_before_occ} == ERR_CHECKPOINT_NOT_FOUND (404) — priority 5 runs ahead of the priority 9 OCC check, so no 412 is possible when the parent does not exist"
            - "no LaneAssignment row exists after all five rejections: GET /lane-assignments?staffing_plan_id=${plan_id} is empty"

      - name: check_in_is_refused_while_the_assignments_lane_is_not_open
        claim_type: error_triggerable
        grounds:
          - validations[priority 13]
          - errors[ERR_LANE_NOT_OPEN]
        distinguishing_aspect: "The gate reads the LANE, not the assignment or the plan: an ACTIVATED plan and a SCHEDULED assignment are both perfectly valid, and only the lane's PAUSED state blocks the check-in. Re-opening the lane makes the identical call succeed."
        test_recipe:
          setup: ["an ACTIVATED plan with one SCHEDULED assignment on a lane that is then paused"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - *c_approve
            - *c_activate
            - *c_open
            - call: "POST /lanes/${lane_id}/stand-down"
              payload: { target_state: "PAUSED", paused_reason_code: "LOW_DEMAND" }
              as: CheckpointManager
              captures: { ln_paused: $.data.lane_state }
          trigger:
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              expect_status: 409
              captures: { ln_error: $.data.error_id }
            - call: "GET /lane-assignments/${asg1_id}"
              payload: {}
              as: StaffingPlanner
              captures: { ln_state_after_fail: $.data.assignment_state, ln_checked_in_at: $.data.checked_in_at_utc }
            - call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
              captures: { ln_reopened: $.data.lane_state }
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              captures: { ln_ci_state: $.data.assignment_state, ln_ci_at: $.data.checked_in_at_utc }
          assert:
            - "${ln_paused} == PAUSED with the plan still ACTIVATED, so priority 12 cannot fire"
            - "${ln_error} == ERR_LANE_NOT_OPEN (409)"
            - "${ln_state_after_fail} == SCHEDULED and ${ln_checked_in_at} is null — the refused check-in stamped nothing"
            - "${ln_reopened} == OPEN and ${ln_ci_state} == CHECKED_IN with ${ln_ci_at} == 2026-09-10T08:00:00Z from the logical clock"
            - "Officer.committed_duty_minutes is 30 both before and after the check-in — the conserved quantity does not move on this edge"

  # ===========================================================================
  - section: rbac
    instances:

      - name: missing_or_whitespace_only_identity_headers_are_unauthenticated
        claim_type: role_enforcement
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A header that is present but consists only of spaces counts as ABSENT, and priority 1 outranks every later rung — so a request with no role against a non-existent id is 401, never 404."
        test_recipe:
          setup: ["one checkpoint"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
          trigger:
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "admin-1"
              expect_status: 401
              captures: { au_no_role: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "(X-User-ID header omitted entirely)"
              expect_status: 401
              captures: { au_no_user: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: "   "
              as_user_id: "admin-1"
              expect_status: 401
              captures: { au_ws_role: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "   "
              expect_status: 401
              captures: { au_ws_user: $.data.error_id }
            - call: "GET /checkpoints/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: "(X-User-Role header omitted entirely)"
              as_user_id: "admin-1"
              expect_status: 401
              captures: { au_outranks_404: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { au_ok_id: $.data.id }
          assert:
            - "${au_no_role}, ${au_no_user}, ${au_ws_role} and ${au_ws_user} are all ERR_UNAUTHENTICATED (401) — a whitespace-only header is treated exactly like an absent one, not as the literal value \"   \""
            - "${au_outranks_404} == ERR_UNAUTHENTICATED (401) and NOT ERR_CHECKPOINT_NOT_FOUND — priority 1 runs before the priority 4 existence check"
            - "${au_ok_id} == ${cp_id} with both headers present and non-blank"

      - name: roles_not_listed_on_the_endpoint_are_forbidden_before_the_body_is_read
        claim_type: role_enforcement
        grounds:
          - validations[priority 2]
          - roles[PlatformAdmin]
          - roles[StaffingPlanner]
          - roles[ScreeningOfficer]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Two failure modes share one code: a role that is not one of the six declared roles at all, and a declared role that is simply absent from this endpoint's roles[]. Priority 2 also outranks priority 3, so an unauthorised role sending a malformed body gets 403 rather than 400."
        test_recipe:
          setup: ["one checkpoint with a forecast band, so a plan create would otherwise be well-formed"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_cpver
          trigger:
            - call: "POST /checkpoints"
              payload: { name: "T9", terminal_code: "T9", total_lane_positions: 2, wait_threshold_minutes_standard: 15, wait_threshold_minutes_expedited: 8, connecting_pax_discount_pct: 0, secondary_slot_capacity: 1, plan_cost_cap_cents: 10000000 }
              as: ScreeningOfficer
              as_user_id: "someone"
              expect_status: 403
              captures: { fr_not_listed: $.data.error_id }
            - call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: "Auditor"
              as_user_id: "auditor-1"
              expect_status: 403
              captures: { fr_undeclared: $.data.error_id }
            - call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v1}" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              expect_status: 403
              captures: { fr_admin_blocked: $.data.error_id }
            - call: "POST /checkpoints"
              payload: { name: "T9" }
              as: ScreeningOfficer
              as_user_id: "someone"
              expect_status: 403
              captures: { fr_outranks_400: $.data.error_id }
          assert:
            - "${fr_not_listed} == ERR_FORBIDDEN_ROLE (403) — POST /checkpoints lists PlatformAdmin only"
            - "${fr_undeclared} == ERR_FORBIDDEN_ROLE (403) — \"Auditor\" is not one of the six declared roles even though every role may read checkpoints"
            - "${fr_admin_blocked} == ERR_FORBIDDEN_ROLE (403) — PlatformAdmin seeds reference data but is deliberately outside the plan chain, so there is NO hierarchical override in this role model"
            - "${fr_outranks_400} == ERR_FORBIDDEN_ROLE (403) and NOT ERR_INVALID_REQUEST — the body was missing seven required fields and was never inspected"
            - "no checkpoint beyond ${cp_id} exists and no plan was created"

      - name: action_values_are_gated_per_role_on_endpoints_the_role_may_call
        claim_type: role_enforcement
        grounds:
          - validations[priority 6]
          - errors[ERR_FORBIDDEN_ACTION_FOR_ROLE]
        distinguishing_aspect: "The role passes the endpoint-level check and fails on the VALUE it sent — a field on PATCH, an outcome on resolve. The same call with a different value from the same role succeeds, which is what separates this code from ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["an OPEN lane with an IN_PROGRESS referral raised by the supervisor and resolved by a second officer"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_off_sup
            - *c_off_res
            - call: "POST /officers/${res_id}/duty-status"
              payload: { duty_status: "ON_DUTY" }
              as: CheckpointManager
              captures: { fa_res_duty: $.data.duty_status }
            - *c_referral_raise
            - call: "POST /screening-referrals/${ref_id}/begin"
              payload: { resolving_officer_id: "${res_id}" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { fa_ref_state: $.data.state }
          trigger:
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { suspended: true }
              as: PlatformAdmin
              expect_status: 403
              captures: { fa_admin_suspend: $.data.error_id }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { plan_cost_cap_cents: 5000 }
              as: CheckpointManager
              expect_status: 403
              captures: { fa_mgr_cap: $.data.error_id }
            - call: "POST /screening-referrals/${ref_id}/resolve"
              payload: { outcome: "REFERRED_LEO", resolution_note: "line officer overreach" }
              as: ScreeningOfficer
              as_user_id: "${res_id}"
              expect_status: 403
              captures: { fa_officer_leo: $.data.error_id }
            - call: "PATCH /checkpoints/${cp_id}"
              payload: { wait_threshold_minutes_standard: 14 }
              as: PlatformAdmin
              captures: { fa_admin_threshold: $.data.wait_threshold_minutes_standard }
            - call: "POST /screening-referrals/${ref_id}/resolve"
              payload: { outcome: "CLEARED" }
              as: ScreeningOfficer
              as_user_id: "${res_id}"
              captures: { fa_cleared: $.data.state }
          assert:
            - "${fa_res_duty} == ON_DUTY and ${fa_ref_state} == IN_PROGRESS"
            - "${fa_admin_suspend} == ERR_FORBIDDEN_ACTION_FOR_ROLE (403) — PlatformAdmin is on the endpoint but suspended is CheckpointManager-only"
            - "${fa_mgr_cap} == ERR_FORBIDDEN_ACTION_FOR_ROLE (403) — plan_cost_cap_cents is PlatformAdmin-only"
            - "${fa_officer_leo} == ERR_FORBIDDEN_ACTION_FOR_ROLE (403) — a ScreeningOfficer may resolve, but only with outcome CLEARED"
            - "${fa_admin_threshold} == 14 — the very same role and endpoint succeed on a permitted field, so the gate is per value and not per role"
            - "${fa_cleared} == CLEARED and Checkpoint.posture is still NORMAL"
            - "the checkpoint was never suspended: GET /checkpoints/${cp_id} reports suspended false"

      - name: entity_backed_actors_own_their_assignment_except_supervisor_release
        claim_type: ownership_enforcement
        grounds:
          - validations[priority 7]
          - state_machines.LaneAssignment[CHECKED_IN -> RELEASED]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "The ownership rule binds BOTH entity_backed roles for CHECK_IN and both break actions, and carves out exactly one action — RELEASE by a SupervisoryOfficer on their own checkpoint. It also outranks the break-due check, so a foreign officer starting a break that is not due still gets 403 rather than 409."
        test_recipe:
          setup: ["an ACTIVATED plan with one SCHEDULED assignment for officer 1, plus a second officer and a supervisor"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_officer
            - *c_officer2
            - *c_off_sup
            - *c_curve
            - *c_band1000
            - *c_flight1030
            - *c_forecast1
            - *c_cpver
            - *c_plan
            - *c_asg1
            - *c_submit
            - *c_approve
            - *c_activate
            - *c_open
          trigger:
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off2_id}"
              expect_status: 403
              captures: { ow_other_officer: $.data.error_id }
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              expect_status: 403
              captures: { ow_supervisor_checkin: $.data.error_id }
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
              captures: { ow_state: $.data.assignment_state, ow_baseline: $.data.break_baseline_utc }
            - call: "POST /lane-assignments/${asg1_id}/break"
              payload: { action: "START" }
              as: ScreeningOfficer
              as_user_id: "${off2_id}"
              expect_status: 403
              captures: { ow_other_break: $.data.error_id }
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "RELEASE" }
              as: SupervisoryOfficer
              as_user_id: "${sup_id}"
              captures: { ow_released: $.data.assignment_state, ow_actual: $.data.actual_minutes }
            - call: "GET /officers/${off_id}"
              payload: {}
              as: CheckpointManager
              captures: { ow_committed: $.data.committed_duty_minutes }
          assert:
            - "${ow_other_officer} == ERR_NOT_RESOURCE_OWNER (403) — a ScreeningOfficer may not check in on someone else's row"
            - "${ow_supervisor_checkin} == ERR_NOT_RESOURCE_OWNER (403) — the carve-out does NOT extend to CHECK_IN"
            - "${ow_state} == CHECKED_IN with ${ow_baseline} == 2026-09-10T08:00:00Z"
            - "${ow_other_break} == ERR_NOT_RESOURCE_OWNER (403) and NOT ERR_BREAK_NOT_DUE — priority 7 precedes priority 14 even though break_state is NOT_DUE"
            - "${ow_released} == RELEASED with ${ow_actual} == 0 — the supervisor RELEASE carve-out applies because the lane belongs to their checkpoint"
            - "${ow_committed} == 0 — RELEASE recomputed the officer's committed minutes downward by planned_minutes 30"

      - name: segregation_of_duties_blocks_self_approval_on_both_chains
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 8]
          - roles[StaffingPlanner]
          - roles[DutyManager]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The rule compares X-User-ID values, not roles: a legitimate DutyManager is refused purely because the id they present is the one that prepared the plan. The same rule runs on a second, unrelated chain (referral detect vs resolve), so a single implementation must consult two different stored user ids."
        test_recipe:
          setup: ["a SUBMITTED plan prepared by planner-1 and an IN_PROGRESS referral detected by the supervisor"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
            - *c_eq_wtmd
            - *c_eq_xray
            - *c_eq_ai
            - *c_open
            - *c_officer
            - *c_off_sup
            - *c_off_res
            - call: "POST /officers/${res_id}/duty-status"
