# §1.9 Scaffold Corner Design (breadth coverage of every other testable claim §1.1-§1.7 declares)
# Sections and claim_type values come from references/claim-extraction-guide.md.
# Same gates as §1.8: every call resolves to a §1.5 endpoint, every ${var} is bound by an earlier
# captures:, every formula-derived number is a pre-computed literal.
scaffold_corner_design:
  - section: entities
    instances:
      - name: e_season_create_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Season.fields.season_status
          - entities.Season.fields.dynamic_pricing_mode
          - entities.Season.fields.contracted_revenue_cents
          - endpoints[POST /ticketing/seasons]
        distinguishing_aspect: "A freshly created Season answers with season_status PLANNING, dynamic_pricing_mode AGGRESSIVE, revenue_goal_met false, all four seat counters 0, renewal_opened_at_utc null and version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to its startup default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TicketOpsAdmin
          trigger:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
          assert:
            - "HTTP status == 201"
            - "Season.${season_id}.season_status == PLANNING"
            - "Season.${season_id}.dynamic_pricing_mode == AGGRESSIVE"
            - "Season.${season_id}.revenue_goal_met == false"
            - "Season.${season_id}.contracted_revenue_cents == 0"
            - "Season.${season_id}.total_seat_count == 0 and available_seat_count == 0 and held_seat_count == 0 and assigned_seat_count == 0"
            - "Season.${season_id}.renewal_opened_at_utc == null"
            - "Season.${season_id}.version == 1"

      - name: e_season_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "validations[priority=30]"
          - "errors[ERR_INVALID_REQUEST]"
          - endpoints[POST /ticketing/seasons]
        distinguishing_aspect: "Omitting revenue_goal_cents - an input field with no default - is rejected with ERR_INVALID_REQUEST 400 and no Season row is created."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TicketOpsAdmin
          trigger:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z" }
              as: TicketOpsAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: e_seat_bulk_create_mints_the_whole_range_and_lists_by_season
        claim_type: Creation
        grounds:
          - endpoints[POST /ticketing/seats]
          - endpoints[GET /ticketing/seats]
          - entities.Seat.fields.seat_number
          - calculations.seat_occupancy_and_season_census
        distinguishing_aspect: "One POST /ticketing/seats with seat_number_from 1 and seat_number_to 4 returns exactly four AVAILABLE Seat rows in ascending seat_number order and drives Season.total_seat_count to 4."
        test_recipe:
          setup:
            - "A Season in PLANNING with no seats"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 4 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id", s4: "$.data[3].id" }
            - call: "GET /ticketing/seats"
              payload: { season_id: "${season_id}" }
              as: TicketOpsAdmin
          assert:
            - "HTTP status == 201 and the response array holds 4 Seat objects"
            - "Seat.${s1}.seat_number == 1 and Seat.${s4}.seat_number == 4"
            - "Seat.${s1}.seat_status == AVAILABLE and Seat.${s1}.assigned_account_id == null"
            - "Seat.${s1}.scanned_game_ids == []"
            - "GET /ticketing/seats?season_id=${season_id} returns total_count == 4"
            - "Season.${season_id}.total_seat_count == 4 and available_seat_count == 4"

      - name: e_account_lookup_with_unknown_id_returns_account_not_found
        claim_type: Not Found
        grounds:
          - "validations[priority=40]"
          - "errors[ERR_ACCOUNT_NOT_FOUND]"
          - endpoints[GET /ticketing/accounts/{account_id}]
        distinguishing_aspect: "A well-formed but unknown account UUID answers ERR_ACCOUNT_NOT_FOUND with HTTP 404, not an empty object."
        test_recipe:
          setup:
            - "At least one unrelated account exists so the collection is non-empty"
          setup_api_calls:
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
          trigger:
            - call: "GET /ticketing/accounts/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: TicketOpsAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response data.error_id == ERR_ACCOUNT_NOT_FOUND"

      - name: e_game_list_pagination_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /ticketing/games]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three games in one season, limit 2 / offset 0 returns 2 items with total_count 3 and has_more true, and offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "A Season in PLANNING carrying exactly three games"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 3, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "AAA", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "BBB", opponent_tier: "STANDARD", game_date_utc: "2026-10-20T23:00:00Z", day_bucket: "WEEKDAY", demand_index: 50 }
              as: TicketOpsAdmin
              captures: { g2: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "CCC", opponent_tier: "VALUE", game_date_utc: "2026-10-30T23:00:00Z", day_bucket: "WEEKDAY", demand_index: 20 }
              as: TicketOpsAdmin
              captures: { g3: "$.data.id" }
          trigger:
            - call: "GET /ticketing/games"
              payload: { season_id: "${season_id}", limit: 2, offset: 0 }
              as: RevenueManager
            - call: "GET /ticketing/games"
              payload: { season_id: "${season_id}", limit: 2, offset: 2 }
              as: RevenueManager
          assert:
            - "first call: response array length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second call: response array length == 1, total_count == 3, has_more == false, offset == 2"

      - name: e_service_rep_status_defaults_to_active
        claim_type: Defaults
        grounds:
          - entities.ServiceRep.fields.rep_status
          - endpoints[POST /ticketing/service-reps]
        distinguishing_aspect: "Omitting rep_status yields rep_status ACTIVE with assigned_account_count 0 and touchpoints_logged_count 0; passing ON_LEAVE stores ON_LEAVE."
        test_recipe:
          setup:
            - "Empty rep roster"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TicketOpsAdmin
          trigger:
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep Default", territory_code: "NORTH", book_capacity: 3 }
              as: TicketOpsAdmin
              captures: { rep_default: "$.data.id" }
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep Leave", territory_code: "NORTH", book_capacity: 3, rep_status: "ON_LEAVE" }
              as: TicketOpsAdmin
              captures: { rep_leave: "$.data.id" }
          assert:
            - "ServiceRep.${rep_default}.rep_status == ACTIVE"
            - "ServiceRep.${rep_default}.assigned_account_count == 0"
            - "ServiceRep.${rep_default}.touchpoints_logged_count == 0"
            - "ServiceRep.${rep_leave}.rep_status == ON_LEAVE"

      - name: e_seat_create_with_invalid_enum_price_zone_rejected
        claim_type: Type Constraints
        grounds:
          - "validations[priority=30]"
          - "errors[ERR_INVALID_REQUEST]"
          - entities.Seat.fields.price_zone
        distinguishing_aspect: "price_zone ZONE_Z is outside the declared enum and is rejected with ERR_INVALID_REQUEST 400 before any seat row is minted."
        test_recipe:
          setup:
            - "A Season in PLANNING with no seats"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_Z", seat_number_from: 1, seat_number_to: 2 }
              as: TicketOpsAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "Season.${season_id}.total_seat_count == 0"

      - name: e_plan_order_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.PlanOrder.fields.order_status
          - entities.PlanOrder.fields.quoted_total_cents
          - endpoints[POST /ticketing/plan-orders]
        distinguishing_aspect: "Client-supplied id, order_status and quoted_total_cents on order creation are ignored: the server mints its own id, forces DRAFT and writes the computed 9905 quote."
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with one PREMIUM/WEEKEND/85 game, two ZONE_C seats, a PUBLISHED plan and an account with an assigned rep"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 2 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
          trigger:
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}"], id: "99999999-8888-4777-8666-555555555555", order_status: "CONFIRMED", quoted_total_cents: 1 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
          assert:
            - "PlanOrder.${order1}.id != 99999999-8888-4777-8666-555555555555"
            - "PlanOrder.${order1}.order_status == DRAFT"
            - "PlanOrder.${order1}.quoted_total_cents == 9905"
            - "PlanOrder.${order1}.final_total_cents == 0"
            - "PlanOrder.${order1}.version == 1"

      - name: e_partial_plan_derives_from_a_published_full_season_base_plan
        claim_type: Parent Relationships
        grounds:
          - entities.SeasonPlan.fields.base_plan_id
          - "validations[priority=82]"
          - endpoints[POST /ticketing/season-plans]
          - endpoints[GET /ticketing/season-plans]
        distinguishing_aspect: "A PARTIAL plan naming a PUBLISHED FULL_SEASON base plan and two of its three games is accepted with included_game_count 2, and is discoverable through GET /ticketing/season-plans?base_plan_id=."
        test_recipe:
          setup:
            - "Season in PLANNING with three games and a PUBLISHED FULL_SEASON plan covering all three"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 3, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "AAA", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "BBB", opponent_tier: "STANDARD", game_date_utc: "2026-10-20T23:00:00Z", day_bucket: "WEEKDAY", demand_index: 50 }
              as: TicketOpsAdmin
              captures: { g2: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "CCC", opponent_tier: "VALUE", game_date_utc: "2026-10-30T23:00:00Z", day_bucket: "WEEKDAY", demand_index: 20 }
              as: TicketOpsAdmin
              captures: { g3: "$.data.id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}", "${g2}", "${g3}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { base_plan: "$.data.id" }
            - call: "POST /ticketing/season-plans/${base_plan}/publish"
              payload: {}
              as: RevenueManager
          trigger:
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "PARTIAL", game_ids: ["${g1}", "${g3}"], min_seats: 1, max_seats: 4, base_plan_id: "${base_plan}" }
              as: RevenueManager
              captures: { partial_plan: "$.data.id" }
            - call: "GET /ticketing/season-plans"
              payload: { base_plan_id: "${base_plan}" }
              as: RevenueManager
          assert:
            - "HTTP status == 201"
            - "SeasonPlan.${partial_plan}.plan_status == DRAFT"
            - "SeasonPlan.${partial_plan}.included_game_count == 2"
            - "SeasonPlan.${partial_plan}.base_plan_id == ${base_plan}"
            - "GET /ticketing/season-plans?base_plan_id=${base_plan} returns total_count == 1"

  - section: state_machines
    instances:
      - name: sm_zero_discount_submit_forks_straight_to_approved
        claim_type: Valid Transition
        grounds:
          - state_machines.PlanOrder.order_status.DRAFT_to_APPROVED
          - endpoints[POST /ticketing/plan-orders/{order_id}/submit]
        distinguishing_aspect: "A DRAFT order with discount_pct 0 lands directly in APPROVED with submitted_by_user_id stamped and reviewed_by_user_id still null - the review branch is skipped entirely."
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with one PREMIUM/WEEKEND/85 game, two ZONE_C seats, a PUBLISHED plan, an account with an assigned rep and a DRAFT single-seat order carrying discount_pct 0"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 2 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}"], discount_pct: 0 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
          trigger:
            - call: "POST /ticketing/plan-orders/${order1}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { st: "$.data.order_status" }
          assert:
            - "PlanOrder.${order1}.order_status == APPROVED"
            - "PlanOrder.${order1}.submitted_by_user_id == ${rep_of_acct1}"
            - "PlanOrder.${order1}.reviewed_by_user_id == null"
            - "PlanOrder.${order1}.payment_status == NOT_STARTED"

      - name: sm_discounted_order_revision_cycle_returns_to_draft_then_reapproves
        claim_type: Valid Transition
        grounds:
          - state_machines.PlanOrder.order_status.DRAFT_to_PENDING_APPROVAL
          - state_machines.PlanOrder.order_status.PENDING_APPROVAL_to_DRAFT
          - state_machines.PlanOrder.order_status.PENDING_APPROVAL_to_APPROVED
          - endpoints[POST /ticketing/plan-orders/{order_id}/review]
        distinguishing_aspect: "A REVISE decision drives PENDING_APPROVAL back to DRAFT and clears submitted_by_user_id, and the same order can be resubmitted and then APPROVED, proving the loop is re-enterable."
        test_recipe:
          setup:
            - "Season in RENEWAL_OPEN with one PREMIUM/WEEKEND/85 game, two ZONE_C seats, a PUBLISHED plan and an account with an assigned rep"
            - "A DRAFT single-seat order with discount_pct 0.10, so quoted_total_cents is 8915 and submission requires review"
          setup_api_calls:
            - call: "POST /ticketing/seasons"
              payload: { code: "2026-27", year: 2026, total_home_games: 1, renewal_deadline_utc: "2026-09-15T00:00:00Z", revenue_goal_cents: 100000000 }
              as: TicketOpsAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /ticketing/games"
              payload: { season_id: "${season_id}", opponent_code: "RIV", opponent_tier: "PREMIUM", game_date_utc: "2026-10-10T23:00:00Z", day_bucket: "WEEKEND", demand_index: 85 }
              as: TicketOpsAdmin
              captures: { g1: "$.data.id" }
            - call: "POST /ticketing/seats"
              payload: { season_id: "${season_id}", section_code: "104", row_label: "A", price_zone: "ZONE_C", seat_number_from: 1, seat_number_to: 2 }
              as: TicketOpsAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /ticketing/season-plans"
              payload: { season_id: "${season_id}", plan_type: "FULL_SEASON", game_ids: ["${g1}"], min_seats: 1, max_seats: 4 }
              as: RevenueManager
              captures: { plan_id: "$.data.id" }
            - call: "POST /ticketing/season-plans/${plan_id}/publish"
              payload: {}
              as: RevenueManager
            - call: "POST /ticketing/seasons/${season_id}/open-renewal"
              payload: {}
              as: TicketOpsAdmin
            - call: "POST /ticketing/service-reps"
              payload: { rep_name: "Rep North", territory_code: "NORTH", book_capacity: 5 }
              as: TicketOpsAdmin
              captures: { rep1: "$.data.id" }
            - call: "POST /ticketing/accounts"
              payload: { account_name: "Acct One", account_type: "INDIVIDUAL", territory_code: "NORTH", tenure_years: 0 }
              as: TicketOpsAdmin
              captures: { acct1: "$.data.id" }
            - call: "POST /ticketing/accounts/${acct1}/assign-rep"
              payload: {}
              as: TicketOpsAdmin
              captures: { rep_of_acct1: "$.data.assigned_rep_id" }
            - call: "POST /ticketing/plan-orders"
              payload: { account_id: "${acct1}", plan_id: "${plan_id}", seat_ids: ["${s1}"], discount_pct: 0.10 }
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
              captures: { order1: "$.data.id" }
            - call: "POST /ticketing/plan-orders/${order1}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "${rep_of_acct1}"
          trigger:
