          The Customer role is entity_backed by Customer, so the SAME endpoints
          succeed or fail purely on row ownership: CUS-CD-1 reads and withdraws
          its own claim, while CUS-CD-S9 — an equally ACTIVE customer — is
          refused 403 ERR_CUSTOMER_SCOPE_VIOLATION on that claim, on the hull it
          does not own, on another customer's acknowledgement and on a claim
          intake that names someone else's customer_id, and sees total_count 0 in
          the scoped list rather than a 403.
