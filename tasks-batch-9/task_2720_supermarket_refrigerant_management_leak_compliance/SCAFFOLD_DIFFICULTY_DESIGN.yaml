  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: retired_system_beats_expired_certification_state_over_safety
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_SYSTEM_RETIRED]
          - errors[ERR_TECHNICIAN_CERT_EXPIRED]
        distinguishing_aspect: |
          Category pair state (priority 10) versus business_safety (priority 15).
          One request violates both: the system is RETIRED and the named
          technician's certification expired a month before performed_at. The
          409 ERR_SYSTEM_RETIRED must win over the 422
          ERR_TECHNICIAN_CERT_EXPIRED - an implementation that runs the
          technician eligibility block before the entity-state block returns the
          422 and fails, and the two errors even differ in HTTP status so the
          ordering is unambiguous.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A."
            - "SYS_X: full_charge_lbs 60.0, initial_charge_lbs 0.0, installed_on 2025-03-01T00:00:00Z; with zero charge and no leak events it is retired immediately, so operational_status == RETIRED."
            - "Technician T_EXP: TYPE_II but certification_expires_on 2026-07-01T00:00:00Z, one month before the work timestamp."
            - "EQ1 certified HIGH and verified 2026-06-01; CYL1 holding 40.0 lbs of R-404A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-03-01T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sysx_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Marta Vogel", epa_certification_number: "EPA-608-33333", certification_type: "TYPE_II", certification_expires_on: "2026-07-01T00:00:00Z" }
              as: ComplianceManager
              captures: { tech_exp_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech_exp_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "POST /systems/${sysx_id}/retirement"
              payload: { retirement_reason_code: "END_OF_LIFE_REPLACEMENT" }
              as: ComplianceManager
              captures: { retired_status: $.data.operational_status }
            - call: "GET /systems/${sysx_id}"
              payload: {}
              as: ComplianceManager
              captures: { sysx_v: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sysx_id}", technician_id: "${tech_exp_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sysx_v}" }
              as: Technician
              as_user_id: "${tech_exp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_SYSTEM_RETIRED"
            - "error_id != ERR_TECHNICIAN_CERT_EXPIRED"
            - "no ServiceRecord row is created; RefrigerantSystem.${sysx_id}.current_charge_lbs == 0.0 and version == ${sysx_v}"
            - "Cylinder.${cyl1_id}.current_contents_lbs == 40.0 (untouched)"

      - name: uncertified_recovery_machine_beats_cylinder_fill_limit_safety_over_constraint
        grounds:
          - validations[priority=17]
          - validations[priority=39]
          - errors[ERR_RECOVERY_EQUIPMENT_NOT_CERTIFIED]
          - errors[ERR_CYLINDER_FILL_LIMIT_EXCEEDED]
          - entities.RecoveryEquipment.fields.status
        distinguishing_aspect: |
          A different category pair - business_safety (priority 17) versus
          business_constraint (priority 39) - and both errors carry HTTP 422, so
          only the error_id distinguishes them and an implementation cannot get
          the answer right by accident of status codes. The recovery machine is
          overdue for its annual AHRI-740 verification and the destination
          cylinder is already at its 80 percent DOT fill limit; the equipment
          safety error must be returned.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, R-404A, SYS1 (full 100.0, initial 80.0)."
            - "T1 TYPE_II, valid certification."
            - "EQ_STALE: certified_for_pressure_class HIGH but last_verification_on 2025-01-01T00:00:00Z, more than 365 days before the clock, so status == VERIFICATION_OVERDUE."
            - "CYL1: nominal_capacity_lbs 50.0, initial_contents_lbs 40.0, which is exactly fill_limit_lbs (0.8 * 50.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-8888", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2025-01-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq_stale_id: $.data.id, eq_stale_status: $.data.status }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id, cyl1_limit: $.data.fill_limit_lbs }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq_stale_id}", cylinder_id: "${cyl1_id}", service_type: "RECOVER_REFRIGERANT", refrigerant_recovered_lbs: 5.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "RecoveryEquipment.${eq_stale_id}.status == VERIFICATION_OVERDUE at creation"
            - "Cylinder.${cyl1_id}.fill_limit_lbs == 40.0"
            - "HTTP 422"
            - "error_id == ERR_RECOVERY_EQUIPMENT_NOT_CERTIFIED"
            - "error_id != ERR_CYLINDER_FILL_LIMIT_EXCEEDED"
            - "RefrigerantSystem.${sys1_id}.current_charge_lbs == 80.0 and Cylinder.${cyl1_id}.current_contents_lbs == 40.0"

      - name: refrigerant_type_mismatch_beats_insufficient_cylinder_contents_referential_over_constraint
        grounds:
          - validations[priority=21]
          - validations[priority=40]
          - errors[ERR_REFRIGERANT_TYPE_MISMATCH]
          - errors[ERR_INSUFFICIENT_CYLINDER_CONTENTS]
        distinguishing_aspect: |
          A third distinct category pair - business_referential (priority 21)
          versus business_constraint (priority 40). The cylinder holds the wrong
          chemistry AND is empty, so a quantity-first implementation reports
          ERR_INSUFFICIENT_CYLINDER_CONTENTS; the referential cross-check on
          refrigerant identity must be reported instead, because charging the
          wrong refrigerant is the substantive violation and the empty cylinder
          is merely arithmetic.
        test_recipe:
