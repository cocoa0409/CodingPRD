      - name: settled_obligation_void_with_wrong_reason_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 42]", "errors.ERR_OBLIGATION_NOT_VOIDABLE"]
        distinguishing_aspect: "From SETTLED the only accepted void_reason is SETTLEMENT_REVERSED, so CREATED_IN_ERROR returns ERR_OBLIGATION_NOT_VOIDABLE (409) and the settled 50000 stays in the ledger — an accounting reversal cannot be disguised as a data-entry correction."
        test_recipe:
