  # -------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_pairing_approve_conflict
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SUPPLIER_NOT_APPROVED]
        distinguishing_aspect: |
          Error-category pair: state (P4) vs business_safety (P6). A pairing
          already in APPROVED state whose supplier is then suspended presents
          both violations on a re-approve attempt: the state check wins, so
          ERR_INVALID_STATE (409) is returned, not ERR_SUPPLIER_NOT_APPROVED.
        test_recipe:
          setup:
            - "SupplierIngredientApproval already APPROVED; supplier later SUSPENDED"
          setup_api_calls:
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "India Supply", fsma_facility_id: "FSMA-I001", country_code: "US", risk_tier: "HIGH" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Duck Meal", ingredient_code: "DKML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.60, CRUDE_FAT: 0.13, MOISTURE: 0.08 }, allergen_class: "POULTRY" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-4001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/suppliers/${sup_id}/suspend"
              payload: {}
              as: QAApprover
          trigger:
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (priority 4 state beats priority 6 business_safety)"
            - "http status == 409"

      - name: business_referential_vs_business_constraint_substantiate_conflict
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_UNAPPROVED_INGREDIENT_SOURCE]
          - errors[ERR_SUBSTANTIATION_UNMET]
        distinguishing_aspect: |
          Error-category pair: business_referential (P9) vs business_constraint
          (P11). Substantiating a FORMULATION-basis formula whose profile is
          DEFICIENT AND whose ingredient lacks any APPROVED pairing violates
          both P9 and P11; the referential check wins, so
          ERR_UNAPPROVED_INGREDIENT_SOURCE is returned, not
          ERR_SUBSTANTIATION_UNMET.
        test_recipe:
          setup:
            - "Formula in NUTRIENT_REVIEW with DEFICIENT profile (protein 10.0 < 18.0 floor) and no APPROVED pairing for its ingredient"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Juliet Pets", fein: "923456780", contact_email: "ra@juliet.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Rice Bran", ingredient_code: "RCBR0001", nutrient_matrix: { CRUDE_PROTEIN: 0.12, CRUDE_FAT: 0.03, MOISTURE: 0.10 }, allergen_class: "GRAIN" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "JL-001", product_name: "Juliet Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 10.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
          trigger:
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAPPROVED_INGREDIENT_SOURCE (priority 9 beats priority 11)"
            - "http status == 422"

  # -------------------------------------------------------------------------
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: yield_variance_exactly_at_hold_threshold
        grounds:
          - calculations.yield_variance_calculation
          - validations[priority=15]
          - errors[ERR_YIELD_VARIANCE_HOLD]
        distinguishing_aspect: |
          Metric: yield_variance_pct (numeric threshold, strict >). Planned
          1000 kg, actual 1050 kg gives exactly +5.00 — the boundary value does
          NOT require override (rule is strict >). Actual 1051 kg gives +5.10
          and is rejected with ERR_YIELD_VARIANCE_HOLD absent an override.
          Endpoint under test: POST /petfood/production-batches/{id}/complete.
        test_recipe:
          setup:
            - "Two LOCKed formulas each with a batch IN_PROCESS, planned_kg 1000"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Kilo Pets", fein: "113456780", contact_email: "qa@kilo.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Kilo Supply", fsma_facility_id: "FSMA-K001", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Beef Meal", ingredient_code: "BFML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.58, CRUDE_FAT: 0.12, MOISTURE: 0.09 }, allergen_class: "BEEF" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-5001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "KL-001", product_name: "Kilo Dog A", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f1_id: $.data.id }
            - call: "POST /petfood/formulas/${f1_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f1_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f1_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f1_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f1_id}/lock"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/formulas/${f1_id}"
              payload: {}
              as: ProductionPlanner
              captures: { f1_ver: $.data.version }
            - call: "POST /petfood/formulas/${f1_id}/production-batches"
              payload: { planned_kg: 1000.0, line_id: "LINE-C", scheduled_start: "2026-08-12T08:00:00Z", expected_formula_version: "${f1_ver}" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "POST /petfood/formulas/${f1_id}/production-batches"
              payload: { planned_kg: 1000.0, line_id: "LINE-D", scheduled_start: "2026-08-12T08:00:00Z", expected_formula_version: "${f1_ver} + 1" }
              as: ProductionPlanner
              captures: { b2_id: $.data.id }
            - call: "POST /petfood/production-batches/${b1_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b1_id}/start-run"
              payload: {}
              as: LineOperator
            - call: "POST /petfood/production-batches/${b2_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b2_id}/start-run"
              payload: {}
              as: LineOperator
          trigger:
            - call: "POST /petfood/production-batches/${b1_id}/complete"
              payload: { actual_kg: 1050.0 }
              as: LineOperator
              captures: { b1_var: $.data.yield_variance_pct, b1_status: $.data.status }
            - call: "POST /petfood/production-batches/${b2_id}/complete"
              payload: { actual_kg: 1051.0 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "Batch b1 yield_variance_pct == 5.0 and status == COMPLETED (boundary not held)"
            - "Batch b2 complete rejected with error_id == ERR_YIELD_VARIANCE_HOLD (5.1 > 5.00)"

      - name: trial_completion_ratio_exactly_at_pass_floor
        grounds:
          - state_machines.FeedingTrialProtocol.ANALYSIS_to_PASSED
          - state_machines.FeedingTrialProtocol.ANALYSIS_to_FAILED
          - entities.FeedingTrialProtocol.fields.completion_ratio
        distinguishing_aspect: |
          Metric: completion_ratio (different metric from yield variance), with
          a >= boundary. 6 of 8 animals completing gives ratio exactly 0.75,
          which satisfies the >= 0.75 floor and routes record-verdict to
          PASSED; 5 of 8 (0.625) routes to FAILED. Endpoint under test:
          POST /petfood/feeding-trial-protocols/{id}/record-verdict.
        test_recipe:
          setup:
            - "Two FEEDING_TRIAL formulas each with a protocol in ANALYSIS: P1 completed 6/8, P2 completed 5/8"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Lima Pets", fein: "133456780", contact_email: "ra@lima.example" }
