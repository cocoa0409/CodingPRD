              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2027, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED" }
              as: ProgramAdmin
              captures: { pc_id: $.data.id }
            - call: "GET /program-cycles/${pc_id}"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { stale_pc_v: $.data.version }
            - call: "POST /program-cycles/${pc_id}/lock"
              payload: {}
              as: ProgramAdmin
            - call: "POST /program-cycles/${pc_id}/reopen"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /program-cycles/${pc_id}/candidates"
              payload: { expected_program_cycle_version: "${stale_pc_v}", bridge_id: "${br_id}", source_inspection_id: "${ins_id}", justification: "Superstructure rating 3" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { err_stale: $.data.error_id }
            - call: "GET /program-cycles/${pc_id}"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { fresh_pc_v: $.data.version }
            - call: "POST /program-cycles/${pc_id}/candidates"
              payload: { expected_program_cycle_version: "${fresh_pc_v}", bridge_id: "${br_id}", source_inspection_id: "${ins_id}", justification: "Superstructure rating 3" }
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { cand_id: $.data.id }
            - call: "GET /program-cycles/${pc_id}"
              payload: {}
              as: DistrictEngineer
              as_user_id: "${dist_id}"
              captures: { after_pc_v: $.data.version }
          assert:
            - "The stale create returns 412 with data.error_id == ERR_STALE_CYCLE_VERSION; the lock and the reopen each advanced ProgramCycle.version past ${stale_pc_v}"
            - "The refusal leaves the cycle untouched: status PLANNING, identified_count 0, unprogrammed_cost_cents 0 and no ProjectCandidate row"
            - "The identical body with ${fresh_pc_v} returns 201, so the refusal was purely a version comparison and not a state or eligibility problem"
            - "${after_pc_v} == ${fresh_pc_v} + 1 because candidate creation is a write against the cycle, and ProjectCandidate.${cand_id}.status == IDENTIFIED with origin MANUAL"
            - "The 412 is returned before the priority-35 eligibility check would run: substituting a never-inspected bridge id into the same stale-version request still yields ERR_STALE_CYCLE_VERSION"

      - name: inspection_aggregates_reconcile_with_their_element_rows
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.bridge_deficiency_pct
          - calculations.element_health_index
          - entities.Inspection
          - entities.Bridge
        distinguishing_aspect: "Every stored aggregate is re-derivable from the rows it summarises, before AND after an edit: the inspection's element_count, reported_quantity_total, deficient_quantity_total and photo_count_total equal the sums over GET /element-conditions, and after the acceptance the Bridge's inventoried_quantity_total and deficiency_pct equal the same sums - no counter drifts from its source."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, stepped to 2026-09-02T12:00:00Z and 2026-09-03T09:00:00Z."
            - "The canonical four-element inspection of Cedar Creek Bridge (DECK 1000, GIRDER 300, BEARING 4, ABUTMENT 4), with one quantity redistribution applied while still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /personnel"
              payload: { full_name: "Quinn Qa", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 1000, cs1_qty: 600, cs2_qty: 200, cs3_qty: 150, cs4_qty: 50, photo_count: 6, defect_notes: "Spalling and delamination in bay 3" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_deck_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 300, cs1_qty: 0, cs2_qty: 100, cs3_qty: 100, cs4_qty: 100, photo_count: 8, defect_notes: "Section loss at girder 2 web" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "BEARING", element_group: "SUPERSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 0, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 3, defect_notes: "Frozen rocker bearing at pier 1" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "ABUTMENT", element_group: "SUBSTRUCTURE", unit: "EA", total_quantity: 4, cs1_qty: 3, cs2_qty: 1, cs3_qty: 0, cs4_qty: 0, photo_count: 1, defect_notes: "Minor map cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "GET /inspections/${ins_id}"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
              captures: { draft_reported: $.data.reported_quantity_total }
            - call: "PUT /element-conditions/${ec_deck_id}"
              payload: { total_quantity: 1000, cs1_qty: 500, cs2_qty: 300, cs3_qty: 100, cs4_qty: 100, photo_count: 6, defect_notes: "Re-measured: more CS2, more CS4" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { edited_ehi: $.data.element_health_index }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/submit"
              payload: { inspection_date: "2026-09-02T10:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { submitted_deficient: $.data.deficient_quantity_total }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /inspections/${ins_id}/qa-claim"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "POST /inspections/${ins_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QaReviewer
              as_user_id: "${qa_id}"
            - call: "GET /bridges/${br_id}"
              payload: {}
              as: QaReviewer
              as_user_id: "${qa_id}"
              captures: { bridge_inventory: $.data.inventoried_quantity_total }
          assert:
            - "Before the edit: Inspection.${ins_id}.element_count == 4, reported_quantity_total == 1308 (1000 + 300 + 4 + 4), deficient_quantity_total == 402 (200 + 200 + 2 + 0) and photo_count_total == 18, each equal to the sum over GET /element-conditions?inspection_id=${ins_id}"
            - "The DECK edit keeps total_quantity 1000 but moves 50 units from CS3 into CS4, so ${edited_ehi} == 78.00 (100*(500 + 240 + 40 + 0)/1000) while reported_quantity_total stays 1308"
            - "After the edit deficient_quantity_total is still 402 - CS3 and CS4 both count as deficient, so redistribution WITHIN the deficient band leaves the aggregate fixed while the health index moves"
            - "The submitted inspection reports deficient_quantity_total 402 and its own quantity_balanced true for all four rows"
            - "After the acceptance Bridge.${br_id}.inventoried_quantity_total == 1308 and deficiency_pct == 30.73 (round_half_up(100*402/1308, 2)), reconciling with the element rows and with the inspection's own totals"
            - "Bridge.bridge_health_index recomputes to 63.87 from the edited element indices (0.30*78.00 + 0.25*40.00 + 0.10*50.00 + 0.10*95.00 = 23.40 + 10.00 + 5.00 + 9.50 = 47.90, divided by the 0.75 weight sum = 63.8666... -> 63.87), so the summary field and its inputs stay consistent"

      - name: accept_cascade_verified_end_to_end_across_five_hops
        excluded_because:
          difficulty_instance: inspection_accept_cascade_bridge_interval_candidate_cycle
          rationale: "The cascading_side_effects layer's N-level chain claim is exactly that transitive_cascade instance: element indices to component ratings to Bridge ratings to interval and due date to auto candidate to cycle counters, asserted hop by hop."

      - name: closure_cascade_ordering_from_finding_to_permit_revocation
        excluded_because:
          difficulty_instance: finding_closure_cascade_posture_permit_analysis_revocation
          rationale: "The layer's ordering-sensitivity claim is covered there: the posture must change before the permit analyses are re-derived, and the revocation only reaches applications already APPROVED or APPROVED_WITH_CONDITIONS."

      - name: load_rating_dual_variant_delta_on_switch
        excluded_because:
          difficulty_instance: load_rating_operating_vs_inventory_diverge
          rationale: "The dual_variant_calculation layer's both-variants-and-delta claim is that instance's whole subject, including the 1.35 vs 1.75 live-load factor swap and the divergent posting outcome."

      - name: priority_score_dual_variant_delta_on_policy_switch
        excluded_because:
          difficulty_instance: candidate_priority_condition_vs_risk_policy_diverge
          rationale: "The second dual-variant surface - CONDITION_BASED 43.41 versus RISK_BASED 36.21 on identical condition data - is asserted there, including which inputs each variant ignores."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_write_is_visible_to_the_immediately_following_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.ScourEvaluation.DRAFT_to_FINAL
          - endpoints.GET_bridges_id_compliance_summary
        distinguishing_aspect: "consistency_model is immediate, so no read ever needs a retry: the very next GET after the scour finalize already shows the new scour_status, the bumped version, the auto-created plan of action and the flipped poa_compliant, and the derived compliance projection reflects them on the first call."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; a water-crossing bridge and a licensed engineer; nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Rita Rating", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", load_rating_engineer_licensed: true, pe_license_number: "PE-11021" }
              as: ProgramAdmin
              captures: { rita_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/scour-evaluations"
              payload: { evaluated_by_id: "${rita_id}", evaluation_method: "DETAILED_HYDRAULIC", scour_code: 2, foundation_type: "SPREAD_FOOTING", observed_scour_depth_m: 2.8 }
              as: RatingEngineer
              as_user_id: "${rita_id}"
              captures: { se_id: $.data.id }
          trigger:
            - call: "POST /scour-evaluations/${se_id}/finalize"
              payload: {}
              as: RatingEngineer
              as_user_id: "${rita_id}"
              captures: { se_status: $.data.status }
            - call: "GET /bridges/${br_id}"
              payload: {}
              as: FhwaReviewer
              captures: { scour_now: $.data.scour_status }
            - call: "GET /bridges/${br_id}/compliance-summary"
              payload: {}
              as: FhwaReviewer
              captures: { poa_flag: $.data.poa_compliant }
            - call: "GET /plans-of-action?bridge_id=${br_id}"
              payload: {}
              as: FhwaReviewer
              captures: { poa_id: "$.data[0].id" }
          assert:
            - "The finalize response itself already carries status FINAL and derived_scour_status SCOUR_CRITICAL - the write's own response is authoritative, not a pending acknowledgement"
            - "The immediately following GET /bridges/${br_id} shows scour_status SCOUR_CRITICAL, inspection_interval_months 12 and poa_compliant false on the FIRST call, with no retry loop"
            - "The compliance-summary projection, computed on read, agrees on the first call: poa_compliant false and inspection_interval_months 12"
            - "The cascade-created PlanOfAction ${poa_id} is listable immediately with status REQUIRED, monitoring_frequency_months null and revision_count 0"
            - "A different role (FhwaReviewer) reading immediately after another role's write sees the same state: visibility is not per-session or per-role"
            - "No endpoint in §1.5 returns 202 and no field anywhere is described as eventually consistent, so a test may assert post-state on the next call without any settling delay"
