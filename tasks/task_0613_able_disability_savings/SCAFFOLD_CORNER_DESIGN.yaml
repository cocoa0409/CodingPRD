# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims in
# SCAFFOLD.yaml §1.1-§1.7 not already exercised by §1.8. Walks
# references/claim-extraction-guide.md section by section. excluded_because:
# stubs cite a §1.8 instance by name. Every active instance's setup_api_calls
# chain is empty-DB executable against §1.5.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_beneficiary_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Beneficiary
          - "endpoints['POST /able/beneficiaries']"
        distinguishing_aspect: "POST with required fields returns 201; eligibility_status defaults to UNCERTIFIED, is_deceased=false, receives_ssi=false, other_countable_resources_cents=0."
        test_recipe:
          setup: ["A Program exists."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "New Ben", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id, elig: $.data.eligibility_status }
          assert:
            - "HTTP status == 201"
            - "Beneficiary.${ben_id}.eligibility_status == UNCERTIFIED"
            - "Beneficiary.${ben_id}.is_deceased == false"
            - "Beneficiary.${ben_id}.other_countable_resources_cents == 0"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Account
          - "endpoints['GET /able/accounts/{id}']"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /able/accounts/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB (no accounts)."]
          setup_api_calls: []
          trigger:
            - call: "GET /able/accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND, HTTP 404"

      - name: list_contributions_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Contribution
          - "endpoints['GET /able/contributions']"
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /able/contributions?account_id=... returns an array envelope with total_count and has_more; limit/offset honored."
        test_recipe:
          setup: ["OPEN account with two POSTED contributions."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Lister L", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 100000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
              captures: { acct_v2: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 200000, expected_account_version: "${acct_v2}" }
              as: ProgramAdministrator
          trigger:
            - call: "GET /able/contributions?account_id=${acct_id}&limit=1&offset=0"
              payload: { account_id: "${acct_id}", limit: 1, offset: 0 }
              as: ProgramAdministrator
          assert:
            - "response_type == array; data has length 1; total_count == 2; has_more == true"

      - name: account_computed_ledger_correct_after_contribution
        claim_type: Computed Fields
        grounds:
          - entities.Account.fields.balance_cents
          - entities.Account.fields.basis_cents
          - "endpoints['POST /able/accounts/{id}/contributions']"
        distinguishing_aspect: "After a single REGULAR contribution of 300000, computed balance_cents==300000, basis_cents==300000, earnings_cents==0, regular_contrib_ytd_cents==300000."
        test_recipe:
          setup: ["OPEN account, empty ledger."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Calc C", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 300000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "GET /able/accounts/${acct_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { bal: $.data.balance_cents, basis: $.data.basis_cents }
          assert:
            - "Account.${acct_id}.balance_cents == 300000"
            - "Account.${acct_id}.basis_cents == 300000"
            - "Account.${acct_id}.earnings_cents == 0"
            - "Account.${acct_id}.regular_contrib_ytd_cents == 300000"

      - name: system_fields_id_version_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Program.fields.id
          - entities.Program.fields.version
        distinguishing_aspect: "POST /able/programs returns a server-minted UUID id (no prefix) and version==1; client cannot set them."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id, v: $.data.version }
          assert:
            - "Program.${prog_id}.version == 1"
            - "Program.${prog_id}.id is a UUID with no type prefix"

      - name: create_beneficiary_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Beneficiary.fields.disability_onset_date
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /able/beneficiaries omitting disability_onset_date returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A Program exists."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Missing M", birth_date: "2005-03-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST, HTTP 422"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: contribution_reverse_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Contribution.POSTED_to_REVERSED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reversing an already-REVERSED contribution a second time returns ERR_INVALID_STATE (409); no further ledger change."
        test_recipe:
          setup: ["OPEN account with one POSTED contribution of 100000, then REVERSED."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Twice T", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 100000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
              captures: { contrib_id: $.data.id }
            - call: "POST /able/contributions/${contrib_id}/reverse"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /able/contributions/${contrib_id}/reverse"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"

      - name: disburse_requested_distribution_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Distribution.APPROVED_to_DISBURSED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Disbursing a REQUESTED (not yet APPROVED) distribution returns ERR_INVALID_STATE (409); disburse requires APPROVED."
        test_recipe:
          setup: ["OPEN account funded; one REQUESTED distribution (never approved)."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Inv I", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1000000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
              captures: { acct_v2: $.data.version }
            - call: "POST /able/accounts/${acct_id}/distributions"
              payload: { amount_cents: 200000, category: "HEALTH" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /able/distributions/${dist_id}/disburse"
              payload: { expected_account_version: "${acct_v2}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"
            - "Distribution.${dist_id}.status == REQUESTED (unchanged)"

      - name: closed_account_settle_again_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Account.FROZEN_DEATH_to_CLOSED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "After an Account is CLOSED, settling its already-SETTLED Medicaid claim again returns ERR_INVALID_STATE (409); CLOSED is terminal."
        test_recipe:
          setup: ["Deceased beneficiary's account CLOSED after a Medicaid claim was filed and settled."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Term T", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1000000, expected_account_version: "${acct_v}" }
              as: ProgramAdministrator
            - call: "POST /able/beneficiaries/${ben_id}/record_death"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /able/accounts/${acct_id}/medicaid-claims"
              payload: { claimed_amount_cents: 300000 }
              as: MedicaidAgency
              captures: { claim_id: $.data.id }
            - call: "POST /able/accounts/${acct_id}/medicaid-claims/${claim_id}/settle"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /able/accounts/${acct_id}/medicaid-claims/${claim_id}/settle"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE, HTTP 409"
            - "Account.${acct_id}.status == CLOSED (unchanged)"

      - name: certify_onset_age_ineligible
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Certification.PENDING_to_CERTIFIED
          - "validations[priority=10]"
          - "errors[ERR_ONSET_AGE_INELIGIBLE]"
        distinguishing_aspect: "Approving a certification whose beneficiary disability_onset_date is on/after the 26th birthday (birth 2005-03-01, onset 2031-04-01) returns ERR_ONSET_AGE_INELIGIBLE (409)."
        test_recipe:
          setup: ["Beneficiary birth_date 2005-03-01, disability_onset_date 2031-04-01 (age 26 at onset); a PENDING certification."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30, disability_onset_max_age: 26 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Old Onset", birth_date: "2005-03-01", disability_onset_date: "2031-04-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
          trigger:
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ONSET_AGE_INELIGIBLE, HTTP 409"
            - "Certification.${cert_id}.status == PENDING (unchanged)"

      - name: distribution_substantiate_full_qde_success
        claim_type: side_effect_execution
        grounds:
          - state_machines.Distribution.DISBURSED_to_SUBSTANTIATED
          - entities.Distribution.fields.qualified_amount_cents
        distinguishing_aspect: "Disbursed distribution of 1000000 with two QDERecords (600000+400000) summing to 1000000 substantiates: status SUBSTANTIATED, qualified_amount_cents 1000000, nonqualified_amount_cents 0, additional_tax_cents 0."
        test_recipe:
          setup: ["OPEN account, REGULAR 1900000 + earnings 600000 (ratio 0.24); distribution 1000000 DISBURSED with two QDERecords 600000 and 400000 attached."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
              captures: { opt_id: $.data.id }
            - call: "POST /able/beneficiaries"
              payload: { program_id: "${prog_id}", full_name: "Sub S", birth_date: "2005-03-01", disability_onset_date: "2018-06-01", state_code: "CA" }
              as: ProgramAdministrator
              captures: { ben_id: $.data.id }
            - call: "POST /able/beneficiaries/${ben_id}/certifications"
              payload: { basis: "SSI_SSDI_ENTITLEMENT", effective_date: "2026-01-01", expires_on: "2027-01-01" }
              as: ProgramAdministrator
              captures: { cert_id: $.data.id }
            - call: "POST /able/certifications/${cert_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "POST /able/accounts"
              payload: { beneficiary_id: "${ben_id}", investment_option_id: "${opt_id}" }
              as: ProgramAdministrator
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /able/accounts/${acct_id}/contributions"
              payload: { contribution_type: "REGULAR", amount_cents: 1900000, expected_account_version: "${acct_v}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /_market/credit_earnings"
              payload: { account_id: "${acct_id}", earnings_delta_cents: 600000 }
              as: ProgramAdministrator
              captures: { acct_v2: $.data.version }
            - call: "POST /able/accounts/${acct_id}/distributions"
              payload: { amount_cents: 1000000, category: "HEALTH" }
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { dist_id: $.data.id }
            - call: "POST /able/distributions/${dist_id}/approve"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /able/distributions/${dist_id}/disburse"
              payload: { expected_account_version: "${acct_v2}" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /able/distributions/${dist_id}/qde-records"
              payload: { expense_category: "HEALTH", amount_cents: 600000, receipt_reference: "R-1", expense_date: "2026-02-01" }
              as: Beneficiary
              as_user_id: "${ben_id}"
            - call: "POST /able/distributions/${dist_id}/qde-records"
              payload: { expense_category: "HEALTH", amount_cents: 400000, receipt_reference: "R-2", expense_date: "2026-02-02" }
              as: Beneficiary
              as_user_id: "${ben_id}"
          trigger:
            - call: "POST /able/distributions/${dist_id}/substantiate"
              payload: {}
              as: Beneficiary
              as_user_id: "${ben_id}"
              captures: { st: $.data.status, qa: $.data.qualified_amount_cents, tax: $.data.additional_tax_cents }
          assert:
            - "Distribution.${dist_id}.status == SUBSTANTIATED"
            - "Distribution.${dist_id}.qualified_amount_cents == 1000000"
            - "Distribution.${dist_id}.nonqualified_amount_cents == 0"
            - "Distribution.${dist_id}.additional_tax_cents == 0"

      - name: distribution_clawback_partial_qde_penalty
        claim_type: side_effect_execution
        grounds:
          - state_machines.Distribution.DISBURSED_to_CLAWED_BACK
          - calculations.nonqualified_penalty
          - entities.Distribution.fields.additional_tax_cents
        distinguishing_aspect: "Disbursed distribution 1000000 (earnings_portion 240000) with only one QDERecord of 600000, then clawed back: nonqualified_amount_cents 400000, additional_tax_cents 9600 (10% of 240000*0.4=96000)."
        test_recipe:
          setup: ["OPEN account, REGULAR 1900000 + earnings 600000 (ratio 0.24); distribution 1000000 DISBURSED (earnings_portion 240000) with one QDERecord 600000 attached."]
          setup_api_calls:
            - call: "POST /able/programs"
              payload: { name: "CA ABLE", state_code: "CA", annual_contribution_cap_cents: 1900000, able_to_work_fpl_cents: 1506000, program_fee_bps: 30, nonqualified_additional_tax_pct: 0.10 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /able/investment-options"
              payload: { program_id: "${prog_id}", name: "Moderate", risk_tier: "MODERATE" }
              as: ProgramAdministrator
