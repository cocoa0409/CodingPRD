scaffold_corner_design:

  # =====================================================================
  # SECTION: entities
  # =====================================================================
  - section: entities
    instances:

      - name: corner_plan_creation_returns_declared_fields
        claim_type: Creation
        grounds: ["entities.Plan", "endpoints.POST_/kidswear/plans"]
        distinguishing_aspect: "A plan created with all required fields returns 201 and echoes tier, slots_per_box, swaps_per_cycle and monthly_fee_cents, with status defaulted to ACTIVE and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/plans"
              payload: { tier: "STARTER", slots_per_box: 3, swaps_per_cycle: 1, monthly_fee_cents: 4900 }
              as: PlatformAdmin
              captures: { cp_plan: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "Plan.${cp_plan}.tier == STARTER"
            - "Plan.${cp_plan}.slots_per_box == 3"
            - "Plan.${cp_plan}.monthly_fee_cents == 4900"
            - "Plan.${cp_plan}.status == ACTIVE"
            - "Plan.${cp_plan}.version == 1"
            - "Plan.${cp_plan}.discount_pct == 0"

      - name: corner_plan_listing_returns_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Plan", "endpoints.GET_/kidswear/plans"]
        distinguishing_aspect: "GET /kidswear/plans with limit 1 and offset 1 over three plans returns exactly one row, total_count 3 and has_more true."
        test_recipe:
          setup: ["Three ACTIVE plans exist."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "STARTER", slots_per_box: 2, swaps_per_cycle: 0, monthly_fee_cents: 3900 }
              as: PlatformAdmin
              captures: { pg_p1: $.data.id }
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 3, swaps_per_cycle: 1, monthly_fee_cents: 5900 }
              as: PlatformAdmin
              captures: { pg_p2: $.data.id }
            - call: "POST /kidswear/plans"
              payload: { tier: "PLUS", slots_per_box: 5, swaps_per_cycle: 2, monthly_fee_cents: 8900 }
              as: PlatformAdmin
              captures: { pg_p3: $.data.id }
          trigger:
            - call: "GET /kidswear/plans"
              payload: { limit: 1, offset: 1 }
              as: PlatformAdmin
              captures: { pg_first: "$.data[0].id" }
          assert:
            - "the response meta carries api_request_id and api_request_timestamp"
            - "response_type == array"
            - "total_count == 3"
            - "has_more == true"
            - "the returned array has length 1"

      - name: corner_member_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Member", "errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /kidswear/members/{id} with a syntactically valid but unknown UUID returns ERR_MEMBER_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /kidswear/members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_mnf: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "the captured err_mnf equals ERR_MEMBER_NOT_FOUND"
            - "response_type == error"

      - name: corner_member_creation_missing_child_size_is_rejected
        claim_type: Required Fields
        grounds: ["entities.Member.fields.child_size_code", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required child_size_code on POST /kidswear/members returns ERR_VALIDATION with HTTP 422 and creates no Member."
        test_recipe:
          setup: ["One ACTIVE plan exists."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { rq_plan: $.data.id }
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${rq_plan}", email: "nosize@kidswear.test", display_name: "No Size" }
              as: PlatformAdmin
              captures: { err_rq: $.data.error_id }
          assert:
            - "the trigger returns HTTP 422"
            - "the captured err_rq equals ERR_VALIDATION"
            - "GET /kidswear/members returns total_count 0"

      - name: corner_member_defaults_applied_when_optionals_omitted
        claim_type: Defaults
        grounds: ["entities.Member.fields.protection_enrolled", "entities.Member.fields.auto_apply_credit", "entities.Member.fields.status"]
        distinguishing_aspect: "Omitting protection_enrolled and auto_apply_credit yields false and true respectively, and status defaults to PENDING."
        test_recipe:
          setup: ["One ACTIVE plan exists."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { df_plan: $.data.id }
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${df_plan}", email: "defaults@kidswear.test", display_name: "Defaults", child_size_code: "4T" }
              as: PlatformAdmin
              captures: { df_m: $.data.id }
          assert:
            - "Member.${df_m}.protection_enrolled == false"
            - "Member.${df_m}.auto_apply_credit == true"
            - "Member.${df_m}.status == PENDING"
            - "Member.${df_m}.credit_balance_cents == 0"
            - "Member.${df_m}.outstanding_balance_cents == 0"
            - "Member.${df_m}.completed_cycles == 0"

      - name: corner_member_system_fields_generated_and_client_input_ignored
        claim_type: System Fields
        grounds: ["entities.Member.fields.size_effective_at", "entities.Member.fields.status"]
        distinguishing_aspect: "size_effective_at is stamped from the logical clock at creation (2026-04-10T00:00:00Z) and status is server-assigned PENDING regardless of what the client sends; id is a bare UUID with no type prefix."
        test_recipe:
          setup: ["The logical clock is set to 2026-04-10T00:00:00Z and one ACTIVE plan exists."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sf_plan: $.data.id }
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sf_plan}", email: "sysfields@kidswear.test", display_name: "Sys Fields", child_size_code: "6" }
              as: PlatformAdmin
              captures: { sf_m: $.data.id }
          assert:
            - "Member.${sf_m}.size_effective_at == 2026-04-10T00:00:00.000Z"
            - "Member.${sf_m}.status == PENDING"
            - "Member.${sf_m}.version == 1"
            - "Member.${sf_m}.id is a bare UUID carrying no type prefix"

      - name: corner_member_invalid_size_enum_is_rejected
        claim_type: Type Constraints
        grounds: ["entities.Member.fields.child_size_code", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "child_size_code is on the closed ERR_INVALID_ENUM list, so the off-ladder value 16 returns ERR_INVALID_ENUM and NOT ERR_VALIDATION."
        test_recipe:
          setup: ["One ACTIVE plan exists."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { en_plan: $.data.id }
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${en_plan}", email: "badenum@kidswear.test", display_name: "Bad Enum", child_size_code: "16" }
              as: PlatformAdmin
              captures: { err_en: $.data.error_id }
          assert:
            - "the trigger returns HTTP 422"
            - "the captured err_en equals ERR_INVALID_ENUM"
            - "the captured err_en does NOT equal ERR_VALIDATION"

      - name: corner_member_duplicate_email_is_rejected
        claim_type: Type Constraints
        grounds: ["entities.Member.fields.email", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "A second member registered with an email already in use returns ERR_DUPLICATE_EMAIL with HTTP 409."
        test_recipe:
          setup: ["One ACTIVE plan and one member holding the email dup@kidswear.test."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { du_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${du_plan}", email: "dup@kidswear.test", display_name: "First", child_size_code: "5" }
              as: PlatformAdmin
              captures: { du_m1: $.data.id }
          trigger:
            - call: "POST /kidswear/members"
              payload: { plan_id: "${du_plan}", email: "dup@kidswear.test", display_name: "Second", child_size_code: "5" }
              as: PlatformAdmin
              captures: { err_du: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_du equals ERR_DUPLICATE_EMAIL"

      - name: corner_garment_style_duplicate_sku_is_rejected
        claim_type: Type Constraints
        grounds: ["entities.GarmentStyle.fields.sku", "errors[ERR_DUPLICATE_SKU]"]
        distinguishing_aspect: "A second style created with an existing sku returns ERR_DUPLICATE_SKU with HTTP 409; uniqueness is global, not per season."
        test_recipe:
          setup: ["One ACTIVE style with sku SKU-UNIQ-1."]
          setup_api_calls:
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-UNIQ-1", name: "Unique One", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { uq_st: $.data.id }
          trigger:
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-UNIQ-1", name: "Unique Two", brand_tier: "PREMIUM", retail_price_cents: 4000, size_code: "8", season: "AW", category: "BOTTOM" }
              as: MerchandisePlanner
              captures: { err_uq: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_uq equals ERR_DUPLICATE_SKU"
            - "GET /kidswear/garment-styles returns total_count 1"

      - name: corner_garment_style_demand_band_defaults_to_medium
        claim_type: Defaults
        grounds: ["entities.GarmentStyle.fields.demand_band", "entities.GarmentStyle.fields.units_ever_acquired"]
        distinguishing_aspect: "Omitting demand_band yields MEDIUM, and units_ever_acquired starts at 0 before any unit is acquired."
        test_recipe:
          setup: ["Empty catalog."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-DEF-1", name: "Default Band", brand_tier: "VALUE", retail_price_cents: 1500, size_code: "3T", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { db_st: $.data.id }
          assert:
            - "GarmentStyle.${db_st}.demand_band == MEDIUM"
            - "GarmentStyle.${db_st}.units_ever_acquired == 0"
            - "GarmentStyle.${db_st}.status == ACTIVE"

      - name: corner_garment_unit_creation_increments_style_acquisition_counter
        claim_type: Computed Fields
        grounds: ["entities.GarmentUnit.fields.acquisition_source", "entities.GarmentStyle.fields.units_ever_acquired", "calculations.unit_conservation_invariant"]
        distinguishing_aspect: "Acquiring two units of one style sets acquisition_source PURCHASED and state IN_STOCK on each, and raises GarmentStyle.units_ever_acquired from 0 to 2."
        test_recipe:
          setup: ["One ACTIVE style with no units."]
          setup_api_calls:
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-ACQ-1", name: "Acq Style", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { ac_st: $.data.id }
          trigger:
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${ac_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { ac_u1: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${ac_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { ac_u2: $.data.id }
          assert:
            - "GarmentUnit.${ac_u1}.state == IN_STOCK"
            - "GarmentUnit.${ac_u1}.acquisition_source == PURCHASED"
            - "GarmentUnit.${ac_u1}.cycles_completed == 0"
            - "GarmentUnit.${ac_u1}.cumulative_cleaning_cost_cents == 0"
            - "GarmentUnit.${ac_u1}.current_grade == A"
            - "GarmentUnit.${ac_u1}.retirement_eligible == false"
            - "GarmentStyle.${ac_st}.units_ever_acquired == 2"

      - name: corner_garment_unit_creation_against_unknown_style_returns_not_found
        claim_type: Parent Relationships
        grounds: ["entities.GarmentUnit.fields.style_id", "errors[ERR_STYLE_NOT_FOUND]"]
        distinguishing_aspect: "A unit acquired against an unknown style_id returns ERR_STYLE_NOT_FOUND with HTTP 404 and creates nothing."
        test_recipe:
          setup: ["Empty catalog."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "11111111-2222-3333-4444-555555555555", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { err_gsnf: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "the captured err_gsnf equals ERR_STYLE_NOT_FOUND"
            - "GET /kidswear/garment-units returns total_count 0"

      - name: corner_cycle_window_fields_are_computed_from_start_at
        claim_type: Computed Fields
        grounds: ["calculations.cycle_window_derivation", "entities.Cycle.fields.swap_by_at", "entities.Cycle.fields.return_due_at", "entities.Cycle.fields.grace_ends_at", "entities.Cycle.fields.cycle_index"]
        distinguishing_aspect: "A cycle starting 2026-05-01 derives swap_by_at 2026-05-21, return_due_at 2026-05-31 and grace_ends_at 2026-06-05, and takes cycle_index 1 as the member's first cycle."
        test_recipe:
          setup: ["One ACTIVE member on a CORE plan."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { cw_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${cw_plan}", email: "cycwin@kidswear.test", display_name: "Cycle Windows", child_size_code: "5" }
              as: PlatformAdmin
              captures: { cw_m: $.data.id }
            - call: "POST /kidswear/members/${cw_m}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${cw_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cw_cyc: $.data.id }
          assert:
            - "Cycle.${cw_cyc}.swap_by_at == 2026-05-21T00:00:00.000Z"
            - "Cycle.${cw_cyc}.return_due_at == 2026-05-31T00:00:00.000Z"
            - "Cycle.${cw_cyc}.grace_ends_at == 2026-06-05T00:00:00.000Z"
            - "Cycle.${cw_cyc}.cycle_index == 1"
            - "Cycle.${cw_cyc}.status == SCHEDULED"
            - "Cycle.${cw_cyc}.swaps_used == 0"

      - name: corner_box_slot_capacity_frozen_from_plan_at_creation
        claim_type: Computed Fields
        grounds: ["entities.Box.fields.slot_capacity", "entities.Box.fields.slots_free", "entities.Box.fields.member_id"]
        distinguishing_aspect: "A box created for a cycle copies slot_capacity from Plan.slots_per_box (3), sets slots_free to 3 and denormalises member_id from the cycle's owner."
        test_recipe:
          setup: ["One ACTIVE member on a plan with 3 box slots and one OPEN cycle."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "PLUS", slots_per_box: 3, swaps_per_cycle: 2, monthly_fee_cents: 7000 }
              as: PlatformAdmin
              captures: { bx_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${bx_plan}", email: "boxcap@kidswear.test", display_name: "Box Cap", child_size_code: "5" }
              as: PlatformAdmin
              captures: { bx_m: $.data.id }
            - call: "POST /kidswear/members/${bx_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${bx_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bx_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${bx_cyc}/open"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${bx_cyc}" }
              as: WarehouseOperator
              captures: { bx_box: $.data.id }
          assert:
            - "Box.${bx_box}.slot_capacity == 3"
            - "Box.${bx_box}.slots_free == 3"
            - "Box.${bx_box}.status == DRAFT"
            - "Box.${bx_box}.member_id equals ${bx_m}"
            - "Box.${bx_box}.outbound_shipment_id is null"

      - name: corner_box_item_starts_on_both_initial_axis_values
        claim_type: Defaults
        grounds: ["entities.BoxItem.fields.fulfillment_status", "entities.BoxItem.fields.settlement_status", "entities.BoxItem.fields.slot_index"]
        distinguishing_aspect: "A freshly allocated box item starts at (ALLOCATED, OPEN) with slot_index 0, is_capsule_item false, embargo_until null and both fee fields at 0."
        test_recipe:
          setup: ["One ACTIVE member, one IN_STOCK size-5 unit, one OPEN cycle with a DRAFT box."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 2, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { bi_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${bi_plan}", email: "bitem@kidswear.test", display_name: "Box Item", child_size_code: "5" }
              as: PlatformAdmin
              captures: { bi_m: $.data.id }
            - call: "POST /kidswear/members/${bi_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-BI-5", name: "Item Style", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { bi_st: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${bi_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { bi_u: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${bi_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { bi_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${bi_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${bi_cyc}" }
              as: WarehouseOperator
              captures: { bi_box: $.data.id }
          trigger:
            - call: "POST /kidswear/boxes/${bi_box}/allocate"
              payload: { unit_id: "${bi_u}" }
              as: WarehouseOperator
              captures: { bi_item: $.data.id }
          assert:
            - "BoxItem.${bi_item}.fulfillment_status == ALLOCATED"
            - "BoxItem.${bi_item}.settlement_status == OPEN"
            - "BoxItem.${bi_item}.slot_index == 0"
            - "BoxItem.${bi_item}.is_capsule_item == false"
            - "BoxItem.${bi_item}.embargo_until is null"
            - "BoxItem.${bi_item}.days_late == 0"
            - "BoxItem.${bi_item}.late_fee_cents == 0"
            - "GarmentUnit.${bi_u}.state == RESERVED"
            - "Box.${bi_box}.slots_free == 1"

      - name: corner_shipping_label_expiry_and_reissue_self_reference
        claim_type: Computed Fields
        grounds: ["entities.ShippingLabel.fields.expires_at", "entities.ShippingLabel.fields.replaces_label_id", "entities.ShippingLabel.fields.reissue_count", "calculations.label_expiry"]
        distinguishing_aspect: "A label minted at 2026-05-01 expires at 2026-05-15; after voiding, the reissued successor is a NEW row whose replaces_label_id points back at the predecessor (a self-referential FK) and whose reissue_count is 1."
        test_recipe:
          setup: ["One ACTIVE member and one ISSUED RETURN label minted at the default clock instant."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { lb_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${lb_plan}", email: "label@kidswear.test", display_name: "Label Household", child_size_code: "5" }
              as: PlatformAdmin
              captures: { lb_m: $.data.id }
            - call: "POST /kidswear/members/${lb_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${lb_m}", direction: "RETURN" }
              as: LogisticsCoordinator
              captures: { lb_l1: $.data.id }
            - call: "POST /kidswear/shipping-labels/${lb_l1}/void"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /kidswear/shipping-labels/${lb_l1}/reissue"
              payload: {}
              as: LogisticsCoordinator
              captures: { lb_l2: $.data.id }
          assert:
            - "ShippingLabel.${lb_l1}.expires_at == 2026-05-15T00:00:00.000Z"
            - "ShippingLabel.${lb_l1}.status == VOIDED"
            - "ShippingLabel.${lb_l1}.reissue_count == 0"
            - "ShippingLabel.${lb_l2}.status == ISSUED"
            - "ShippingLabel.${lb_l2}.reissue_count == 1"
            - "ShippingLabel.${lb_l2}.replaces_label_id equals ${lb_l1}"
            - "ShippingLabel.${lb_l2}.direction == RETURN"

      - name: corner_condition_assessment_with_both_targets_is_rejected
        claim_type: Type Constraints
        grounds: ["entities.ConditionAssessment.fields.unit_id", "entities.ConditionAssessment.fields.trade_in_item_id", "errors[ERR_ASSESSMENT_TARGET_MISMATCH]"]
        distinguishing_aspect: "The polymorphic assessment target is exclusive: supplying neither unit_id nor trade_in_item_id returns ERR_ASSESSMENT_TARGET_MISMATCH with HTTP 422."
        test_recipe:
          setup: ["Empty database apart from the clock default."]
          setup_api_calls:
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/condition-assessments"
              payload: { pipeline: "RENTAL" }
              as: GradingTechnician
              as_user_id: "grader-90"
              captures: { err_tgt: $.data.error_id }
          assert:
            - "the trigger returns HTTP 422"
            - "the captured err_tgt equals ERR_ASSESSMENT_TARGET_MISMATCH"

      - name: corner_credit_entry_expiry_computed_from_grant_instant
        claim_type: Computed Fields
        grounds: ["entities.CreditLedgerEntry.fields.expires_at", "entities.CreditLedgerEntry.fields.remaining_cents", "calculations.credit_expiry"]
        distinguishing_aspect: "A credit granted at 2026-05-01 with no pause carries expires_at 2026-10-28 (180 days later), remaining_cents equal to amount_cents, status AVAILABLE and paused_days_extension 0."
        test_recipe:
          setup: ["One ACTIVE member with no pauses."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { ce_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${ce_plan}", email: "credexp@kidswear.test", display_name: "Credit Expiry", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { ce_m: $.data.id }
            - call: "POST /kidswear/members/${ce_m}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/members/${ce_m}/credit-adjustments"
              payload: { amount_cents: 2500, reason: "goodwill" }
              as: BillingAgent
              captures: { ce_e: $.data.id }
          assert:
            - "CreditLedgerEntry.${ce_e}.amount_cents == 2500"
            - "CreditLedgerEntry.${ce_e}.remaining_cents == 2500"
            - "CreditLedgerEntry.${ce_e}.status == AVAILABLE"
            - "CreditLedgerEntry.${ce_e}.granted_at == 2026-05-01T00:00:00.000Z"
            - "CreditLedgerEntry.${ce_e}.expires_at == 2026-10-28T00:00:00.000Z"
            - "CreditLedgerEntry.${ce_e}.paused_days_extension == 0"
            - "Member.${ce_m}.credit_balance_cents == 2500"

      - name: corner_charge_entry_net_due_mirrors_amount_before_any_credit
        claim_type: Computed Fields
        grounds: ["entities.ChargeLedgerEntry.fields.net_due_cents", "entities.ChargeLedgerEntry.fields.credit_applied_cents", "calculations.member_outstanding_balance"]
        distinguishing_aspect: "A freshly raised 1800-cent SHIPPING_FEE charge is ASSESSED with credit_applied_cents 0 and net_due_cents 1800, and lifts Member.outstanding_balance_cents to exactly 1800."
        test_recipe:
          setup: ["One ACTIVE member with an empty ledger."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { ch_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${ch_plan}", email: "charge@kidswear.test", display_name: "Charge Household", child_size_code: "5", auto_apply_credit: false }
              as: PlatformAdmin
              captures: { ch_m: $.data.id }
            - call: "POST /kidswear/members/${ch_m}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/members/${ch_m}/charge-adjustments"
              payload: { charge_type: "SHIPPING_FEE", amount_cents: 1800 }
              as: BillingAgent
              captures: { ch_e: $.data.id }
          assert:
            - "ChargeLedgerEntry.${ch_e}.amount_cents == 1800"
            - "ChargeLedgerEntry.${ch_e}.credit_applied_cents == 0"
            - "ChargeLedgerEntry.${ch_e}.net_due_cents == 1800"
            - "ChargeLedgerEntry.${ch_e}.status == ASSESSED"
            - "ChargeLedgerEntry.${ch_e}.charge_type == SHIPPING_FEE"
            - "Member.${ch_m}.outstanding_balance_cents == 1800"
            - "Member.${ch_m}.status == ACTIVE"

      - name: corner_capsule_embargo_until_computed_on_announce
        claim_type: Computed Fields
        grounds: ["entities.Capsule.fields.embargo_until", "calculations.capsule_embargo_end", "state_machines.Capsule.DRAFT_to_ANNOUNCED"]
        distinguishing_aspect: "A capsule released 2026-06-01 has no embargo_until while DRAFT; announcing it stamps embargo_until at 2026-06-22, which is 21 days after release and NOT tied to close_at."
        test_recipe:
          setup: ["One DRAFT SS capsule with release_at 2026-06-01 and close_at 2026-06-15, deliberately closing BEFORE its own embargo ends."]
          setup_api_calls:
            - call: "POST /kidswear/capsules"
              payload: { season: "SS", name: "Short Window", release_at: "2026-06-01T00:00:00Z", close_at: "2026-06-15T00:00:00Z", quota_per_member: 2 }
              as: MerchandisePlanner
              captures: { cap_emb: $.data.id }
          trigger:
            - call: "POST /kidswear/capsules/${cap_emb}/announce"
              payload: {}
              as: MerchandisePlanner
          assert:
            - "Capsule.${cap_emb}.status == ANNOUNCED"
            - "Capsule.${cap_emb}.embargo_until == 2026-06-22T00:00:00.000Z"
            - "Capsule.${cap_emb}.close_at == 2026-06-15T00:00:00.000Z"
            - "Capsule.${cap_emb}.embargo_until is strictly later than Capsule.${cap_emb}.close_at"

      - name: corner_pause_request_end_at_computed_from_days_requested
        claim_type: Computed Fields
        grounds: ["entities.PauseRequest.fields.end_at", "entities.PauseRequest.fields.status"]
        distinguishing_aspect: "A pause requested for 12 days from 2026-05-05 derives end_at 2026-05-17, the EXCLUSIVE endpoint of the half-open window, and starts at status REQUESTED with proration_credit_cents 0."
        test_recipe:
          setup: ["One ACTIVE member with no prior pauses."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { pr_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${pr_plan}", email: "pausefields@kidswear.test", display_name: "Pause Fields", child_size_code: "5" }
              as: PlatformAdmin
              captures: { pr_m: $.data.id }
            - call: "POST /kidswear/members/${pr_m}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/members/${pr_m}/pause-requests"
              payload: { start_at: "2026-05-05T00:00:00Z", days_requested: 12 }
              as: Member
              as_user_id: "${pr_m}"
              captures: { pr_id: $.data.id }
          assert:
            - "PauseRequest.${pr_id}.end_at == 2026-05-17T00:00:00.000Z"
            - "PauseRequest.${pr_id}.status == REQUESTED"
            - "PauseRequest.${pr_id}.proration_credit_cents == 0"
            - "Member.${pr_m}.status == ACTIVE"
            - "Member.${pr_m}.pause_days_used_lifetime == 0"

      - name: corner_cycles_filtered_list_resolves_the_member_fk_in_reverse
        claim_type: Retrieval
        grounds: ["entities.Cycle.fields.member_id", "endpoints.GET_/kidswear/cycles"]
        distinguishing_aspect: "GET /kidswear/cycles filtered by member_id returns only that member's cycles: with two members holding one cycle each, the filtered call returns total_count 1."
        test_recipe:
          setup: ["Two ACTIVE members on one plan, each with one SCHEDULED cycle."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { fk_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${fk_plan}", email: "fk1@kidswear.test", display_name: "FK One", child_size_code: "5" }
              as: PlatformAdmin
              captures: { fk_m1: $.data.id }
            - call: "POST /kidswear/members/${fk_m1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/members"
              payload: { plan_id: "${fk_plan}", email: "fk2@kidswear.test", display_name: "FK Two", child_size_code: "5" }
              as: PlatformAdmin
              captures: { fk_m2: $.data.id }
            - call: "POST /kidswear/members/${fk_m2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${fk_m1}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fk_c1: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${fk_m2}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fk_c2: $.data.id }
          trigger:
            - call: "GET /kidswear/cycles"
              payload: { member_id: "${fk_m1}" }
              as: PlatformAdmin
              captures: { fk_first: "$.data[0].id" }
          assert:
            - "total_count == 1"
            - "the captured fk_first equals ${fk_c1}"
            - "GET /kidswear/cycles with no filter returns total_count 2"

      - name: corner_trade_in_item_starts_on_both_initial_axis_values
        claim_type: Defaults
        grounds: ["entities.TradeInItem.fields.grading_status", "entities.TradeInItem.fields.disposition_status", "entities.TradeInItem.fields.credit_cents"]
        distinguishing_aspect: "A declared trade-in garment starts at (PENDING, NONE) with credit_cents 0, granted_credit_cents 0, assessed_grade null and demand_band defaulted to MEDIUM before grading."
        test_recipe:
          setup: ["One ACTIVE member with a DRAFT trade-in submission declaring 3 items."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { ti_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${ti_plan}", email: "tifields@kidswear.test", display_name: "TI Fields", child_size_code: "6" }
              as: PlatformAdmin
              captures: { ti_m: $.data.id }
            - call: "POST /kidswear/members/${ti_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/trade-in-submissions"
              payload: { member_id: "${ti_m}", declared_item_count: 3 }
              as: Member
              as_user_id: "${ti_m}"
              captures: { ti_sub: $.data.id }
          trigger:
            - call: "POST /kidswear/trade-in-submissions/${ti_sub}/items"
              payload: { declared_brand_tier: "VALUE", declared_size_code: "6" }
              as: Member
              as_user_id: "${ti_m}"
              captures: { ti_item: $.data.id }
          assert:
            - "TradeInItem.${ti_item}.grading_status == PENDING"
            - "TradeInItem.${ti_item}.disposition_status == NONE"
            - "TradeInItem.${ti_item}.credit_cents == 0"
            - "TradeInItem.${ti_item}.granted_credit_cents == 0"
            - "TradeInItem.${ti_item}.assessed_grade is null"
            - "TradeInSubmission.${ti_sub}.status == DRAFT"
            - "TradeInSubmission.${ti_sub}.credited_total_cents == 0"

  # =====================================================================
  # SECTION: state_machines
  # =====================================================================
  - section: state_machines
    instances:

      - name: corner_sm_member_second_activation_is_rejected
        claim_type: Idempotency
        grounds: ["state_machines.Member.PENDING_to_ACTIVE", "errors[ERR_INVALID_STATE]", "validations[priority=32]"]
        distinguishing_aspect: "Activating an already-ACTIVE member returns ERR_INVALID_STATE with HTTP 409 and does not bump Member.version a second time."
        test_recipe:
          setup: ["One member activated exactly once, whose version is therefore 2."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sm1_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sm1_plan}", email: "sm1@kidswear.test", display_name: "SM One", child_size_code: "5" }
              as: PlatformAdmin
              captures: { sm1_m: $.data.id }
            - call: "POST /kidswear/members/${sm1_m}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { sm1_v: $.data.version }
          trigger:
            - call: "POST /kidswear/members/${sm1_m}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err_sm1: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_sm1 equals ERR_INVALID_STATE"
            - "Member.${sm1_m}.status == ACTIVE"
            - "Member.${sm1_m}.version equals the captured sm1_v"

      - name: corner_sm_cycle_open_before_start_at_is_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Cycle.SCHEDULED_to_OPEN", "validations[priority=34]", "errors[ERR_CYCLE_NOT_STARTED]"]
        distinguishing_aspect: "Opening a cycle whose start_at is 2026-06-01 while the clock reads 2026-05-01 returns ERR_CYCLE_NOT_STARTED and creates no PLAN_CHARGE."
        test_recipe:
          setup: ["One ACTIVE member and one SCHEDULED cycle starting a month in the future."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sm2_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sm2_plan}", email: "sm2@kidswear.test", display_name: "SM Two", child_size_code: "5" }
              as: PlatformAdmin
              captures: { sm2_m: $.data.id }
            - call: "POST /kidswear/members/${sm2_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${sm2_m}", start_at: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sm2_cyc: $.data.id }
          trigger:
            - call: "POST /kidswear/cycles/${sm2_cyc}/open"
              payload: {}
              as: PlatformAdmin
              captures: { err_sm2: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_sm2 equals ERR_CYCLE_NOT_STARTED"
            - "Cycle.${sm2_cyc}.status == SCHEDULED"
            - "Member.${sm2_m}.outstanding_balance_cents == 0"

      - name: corner_sm_close_swap_window_before_swap_by_at_is_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Cycle.OPEN_to_SWAP_CLOSED", "validations[priority=35]", "errors[ERR_SWAP_WINDOW_STILL_OPEN]"]
        distinguishing_aspect: "Closing the swap window at exactly swap_by_at is rejected with ERR_SWAP_WINDOW_STILL_OPEN because the transition requires STRICTLY AFTER, the mirror image of the inclusive submit boundary."
        test_recipe:
          setup: ["One ACTIVE member and an OPEN cycle whose swap_by_at is 2026-05-21."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sm3_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sm3_plan}", email: "sm3@kidswear.test", display_name: "SM Three", child_size_code: "5" }
              as: PlatformAdmin
              captures: { sm3_m: $.data.id }
            - call: "POST /kidswear/members/${sm3_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${sm3_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sm3_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${sm3_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-21T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /kidswear/cycles/${sm3_cyc}/close-swap-window"
              payload: {}
              as: PlatformAdmin
              captures: { err_sm3: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_sm3 equals ERR_SWAP_WINDOW_STILL_OPEN"
            - "Cycle.${sm3_cyc}.status == OPEN"

      - name: corner_sm_box_pack_with_unfilled_slots_is_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Box.DRAFT_to_PACKED", "errors[ERR_BOX_NOT_FULL]"]
        distinguishing_aspect: "Packing a 2-slot box holding only one ALLOCATED item returns ERR_BOX_NOT_FULL with HTTP 409 and leaves the box in DRAFT."
        test_recipe:
          setup: ["One ACTIVE member on a 2-slot plan with an OPEN cycle whose DRAFT box holds exactly one allocated item."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 2, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sm4_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sm4_plan}", email: "sm4@kidswear.test", display_name: "SM Four", child_size_code: "5" }
              as: PlatformAdmin
              captures: { sm4_m: $.data.id }
            - call: "POST /kidswear/members/${sm4_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/garment-styles"
              payload: { sku: "SKU-SM4-5", name: "SM Four Tee", brand_tier: "STANDARD", retail_price_cents: 3000, size_code: "5", season: "SS", category: "TOP" }
              as: MerchandisePlanner
              captures: { sm4_st: $.data.id }
            - call: "POST /kidswear/garment-units"
              payload: { style_id: "${sm4_st}", acquired_at: "2026-02-01T00:00:00Z" }
              as: MerchandisePlanner
              captures: { sm4_u: $.data.id }
            - call: "POST /kidswear/cycles"
              payload: { member_id: "${sm4_m}", start_at: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sm4_cyc: $.data.id }
            - call: "POST /kidswear/cycles/${sm4_cyc}/open"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/boxes"
              payload: { cycle_id: "${sm4_cyc}" }
              as: WarehouseOperator
              captures: { sm4_box: $.data.id }
            - call: "POST /kidswear/boxes/${sm4_box}/allocate"
              payload: { unit_id: "${sm4_u}" }
              as: WarehouseOperator
              captures: { sm4_bi: $.data.id }
          trigger:
            - call: "POST /kidswear/boxes/${sm4_box}/pack"
              payload: {}
              as: WarehouseOperator
              captures: { err_sm4: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_sm4 equals ERR_BOX_NOT_FULL"
            - "Box.${sm4_box}.status == DRAFT"
            - "Box.${sm4_box}.slots_free == 1"

      - name: corner_sm_shipment_second_departure_is_rejected
        claim_type: Idempotency
        grounds: ["state_machines.Shipment.CREATED_to_IN_TRANSIT", "errors[ERR_SHIPMENT_INVALID_STATE]", "validations[priority=28]"]
        distinguishing_aspect: "A second depart on an already IN_TRANSIT shipment returns ERR_SHIPMENT_INVALID_STATE with HTTP 409 and does not restamp shipped_at."
        test_recipe:
          setup: ["One ACTIVE member with an IN_TRANSIT RETURN shipment departed at 2026-05-01."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sm5_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sm5_plan}", email: "sm5@kidswear.test", display_name: "SM Five", child_size_code: "5" }
              as: PlatformAdmin
              captures: { sm5_m: $.data.id }
            - call: "POST /kidswear/members/${sm5_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${sm5_m}", direction: "RETURN" }
              as: LogisticsCoordinator
              captures: { sm5_lbl: $.data.id }
            - call: "POST /kidswear/shipments"
              payload: { member_id: "${sm5_m}", label_id: "${sm5_lbl}", direction: "RETURN", item_count: 0 }
              as: LogisticsCoordinator
              captures: { sm5_shp: $.data.id }
            - call: "POST /kidswear/shipments/${sm5_shp}/depart"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /kidswear/shipments/${sm5_shp}/depart"
              payload: {}
              as: LogisticsCoordinator
              captures: { err_sm5: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "the captured err_sm5 equals ERR_SHIPMENT_INVALID_STATE"
            - "Shipment.${sm5_shp}.status == IN_TRANSIT"
            - "Shipment.${sm5_shp}.shipped_at == 2026-05-01T00:00:00.000Z"
            - "Shipment.${sm5_shp}.ever_scanned == true"

      - name: corner_sm_label_departure_after_expiry_is_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ShippingLabel.ISSUED_to_IN_TRANSIT", "validations[priority=37]", "errors[ERR_LABEL_EXPIRED]"]
        distinguishing_aspect: "A label minted 2026-05-01 and used at 2026-05-16 — one day past its 14-day validity — is refused with ERR_LABEL_EXPIRED; this rung is SHARED by both pipelines."
        test_recipe:
          setup: ["One ACTIVE member with a CREATED TRADE_IN_INBOUND shipment on a label that expired at 2026-05-15."]
          setup_api_calls:
            - call: "POST /kidswear/plans"
              payload: { tier: "CORE", slots_per_box: 1, swaps_per_cycle: 1, monthly_fee_cents: 5000 }
              as: PlatformAdmin
              captures: { sm6_plan: $.data.id }
            - call: "POST /kidswear/members"
              payload: { plan_id: "${sm6_plan}", email: "sm6@kidswear.test", display_name: "SM Six", child_size_code: "5" }
              as: PlatformAdmin
              captures: { sm6_m: $.data.id }
            - call: "POST /kidswear/members/${sm6_m}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /kidswear/shipping-labels"
              payload: { member_id: "${sm6_m}", direction: "TRADE_IN_INBOUND" }
              as: LogisticsCoordinator
              captures: { sm6_lbl: $.data.id }
            - call: "POST /kidswear/shipments"
              payload: { member_id: "${sm6_m}", label_id: "${sm6_lbl}", direction: "TRADE_IN_INBOUND", item_count: 0 }
              as: LogisticsCoordinator
