  - method: GET
    path: "/nac/contract-tiers/{contract_tier_id}"
    description: "Read one markup tier."
    roles: [NationalAccountManager, PricingAnalyst, OperatorBuyer, ContractAuditor, RebateAccountant]
    code: 200
    input: []
    output: ContractTier
    side_effects: []

  - method: GET
    path: "/nac/contract-tiers"
    description: "List markup tiers, filterable by contract, class and status."
    roles: [NationalAccountManager, PricingAnalyst, OperatorBuyer, ContractAuditor, RebateAccountant]
    code: 200
    input: ["contract_id?", "product_class_code?", "status?", "limit?", "offset?"]
    output: ContractTier[]
    side_effects: []

  - method: POST
    path: "/nac/dc-coverages"
    description: "Map a distribution center to a contract as in-market or out-of-market coverage."
    roles: [NationalAccountManager]
    code: 201
    input: [contract_id, distribution_center_id, coverage_type, coverage_from, coverage_to, "service_fee_waived?"]
    output: DcCoverage
    side_effects: []

  - method: GET
    path: "/nac/dc-coverages/{dc_coverage_id}"
    description: "Read one coverage mapping."
    roles: [NationalAccountManager, OperatorBuyer, ContractAuditor]
    code: 200
    input: []
    output: DcCoverage
    side_effects: []

  - method: GET
    path: "/nac/dc-coverages"
    description: "List coverage mappings, filterable by contract, DC, type and status."
    roles: [NationalAccountManager, OperatorBuyer, ContractAuditor]
    code: 200
    input: ["contract_id?", "distribution_center_id?", "coverage_type?", "status?", "limit?", "offset?"]
    output: DcCoverage[]
    side_effects: []

  # --- deviated pricing -----------------------------------------------------
  - method: POST
    path: "/nac/deviation-agreements"
    description: "Draft an off-invoice deviated price for a contracted item, resolving deviated_price_cents and checking the operator ceiling. Requires the caller's last-observed Contract.version."
    roles: [PricingAnalyst]
    code: 201
    input: [contract_id, product_id, manufacturer_id, bill_back_basis, "protected_discount_cents?", "requested_net_price_cents?", max_operator_price_cents, effective_from, effective_to, expected_contract_version]
    output: DeviationAgreement
    side_effects:
      - "deviated_price_cents resolved by deviated_price_resolution"
      - "increments Contract.version by 1"

  - method: GET
    path: "/nac/deviation-agreements/{deviation_agreement_id}"
    description: "Read one deviation agreement."
    roles: [PricingAnalyst, NationalAccountManager, ManufacturerRep, RebateAccountant, ContractAuditor, OperatorBuyer]
    code: 200
    input: []
    output: DeviationAgreement
    side_effects: []

  - method: GET
    path: "/nac/deviation-agreements"
    description: "List deviation agreements, filterable by contract, product, manufacturer and status."
    roles: [PricingAnalyst, NationalAccountManager, ManufacturerRep, RebateAccountant, ContractAuditor, OperatorBuyer]
    code: 200
    input: ["contract_id?", "product_id?", "manufacturer_id?", "status?", "limit?", "offset?"]
    output: DeviationAgreement[]
    side_effects: []

  - method: POST
    path: "/nac/deviation-agreements/{deviation_agreement_id}/submit"
    description: "Submit (or resubmit after a revision request) the deviation to the manufacturer."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: DeviationAgreement
    side_effects: ["DRAFT or REVISION_REQUESTED -> SUBMITTED", "records submitted_by_user_id", "increments revision_round when resubmitting", "increments DeviationAgreement.version by 1"]

  - method: POST
    path: "/nac/deviation-agreements/{deviation_agreement_id}/manufacturer-decision"
    description: "Manufacturer approves, rejects, or requests a revision of the submitted deviation."
    roles: [ManufacturerRep]
    code: 200
    input: [decision, "decision_note?"]
    output: DeviationAgreement
    side_effects: ["SUBMITTED -> MANUFACTURER_APPROVED | REJECTED | REVISION_REQUESTED", "increments DeviationAgreement.version by 1"]

  - method: POST
    path: "/nac/deviation-agreements/{deviation_agreement_id}/activate"
    description: "Activate an approved deviation; the activating manager may not be the analyst who submitted it."
    roles: [NationalAccountManager]
    code: 200
    input: []
    output: DeviationAgreement
    side_effects: ["MANUFACTURER_APPROVED -> ACTIVE", "increments DeviationAgreement.version by 1"]

  # --- substitution ---------------------------------------------------------
  - method: POST
    path: "/nac/substitution-rules"
    description: "Declare a ranked substitute for a contracted item, with its price-protection mode and price-delta tolerance."
    roles: [NationalAccountManager]
    code: 201
    input: [contract_id, primary_product_id, substitute_product_id, rank, price_protection_mode, max_price_delta_pct]
    output: SubstitutionRule
    side_effects: []

  - method: GET
    path: "/nac/substitution-rules/{substitution_rule_id}"
    description: "Read one substitution rule."
    roles: [NationalAccountManager, OperatorBuyer, ContractAuditor, PricingAnalyst]
    code: 200
    input: []
    output: SubstitutionRule
    side_effects: []

  - method: GET
    path: "/nac/substitution-rules"
    description: "List substitution rules, filterable by contract, primary item and substitute item."
    roles: [NationalAccountManager, OperatorBuyer, ContractAuditor, PricingAnalyst]
    code: 200
    input: ["contract_id?", "primary_product_id?", "substitute_product_id?", "status?", "limit?", "offset?"]
    output: SubstitutionRule[]
    side_effects: []

  # --- price change notices -------------------------------------------------
  - method: POST
    path: "/nac/price-change-notices"
    description: "Issue a cost change notice, resolving the new cost from the market index or the proposed cost and deriving the required notice window."
    roles: [PricingAnalyst]
    code: 201
    input: [contract_id, product_id, cost_basis, effective_at, "published_index_value?", "proposed_cost_cents?"]
    output: PriceChangeNotice
    side_effects: ["new_cost_cents, delta_pct, notice_required_days, earliest_effective_at and submitted_at computed by market_index_cost_reset"]

  - method: GET
    path: "/nac/price-change-notices/{price_change_notice_id}"
    description: "Read one price change notice."
    roles: [PricingAnalyst, NationalAccountManager, OperatorBuyer, ContractAuditor]
    code: 200
    input: []
    output: PriceChangeNotice
    side_effects: []

  - method: GET
    path: "/nac/price-change-notices"
    description: "List price change notices, filterable by contract, product and status."
    roles: [PricingAnalyst, NationalAccountManager, OperatorBuyer, ContractAuditor]
    code: 200
    input: ["contract_id?", "product_id?", "status?", "limit?", "offset?"]
    output: PriceChangeNotice[]
    side_effects: []

  - method: POST
    path: "/nac/price-change-notices/{price_change_notice_id}/acknowledge"
    description: "Operator acknowledges a pending or disputed notice."
    roles: [OperatorBuyer]
    code: 200
    input: []
    output: PriceChangeNotice
    side_effects: ["PENDING or DISPUTED -> ACKNOWLEDGED", "increments PriceChangeNotice.version by 1"]

  - method: POST
    path: "/nac/price-change-notices/{price_change_notice_id}/dispute"
    description: "Operator objects to a pending notice."
    roles: [OperatorBuyer]
    code: 200
    input: [note]
    output: PriceChangeNotice
    side_effects: ["PENDING -> DISPUTED", "records dispute_note", "increments PriceChangeNotice.version by 1"]

  - method: POST
    path: "/nac/price-change-notices/{price_change_notice_id}/revise"
    description: "Analyst revises a disputed notice; the notice clock restarts and the window is re-derived."
    roles: [PricingAnalyst]
    code: 200
    input: [cost_basis, effective_at, "published_index_value?", "proposed_cost_cents?"]
    output: PriceChangeNotice
    side_effects: ["DISPUTED -> PENDING", "submitted_at, new_cost_cents, delta_pct, notice_required_days and earliest_effective_at recomputed", "increments PriceChangeNotice.version by 1"]

  - method: POST
    path: "/nac/price-change-notices/{price_change_notice_id}/activate"
    description: "Apply an acknowledged notice once its effective_at has arrived; drives the four-hop cost cascade."
    roles: [PricingAnalyst]
    code: 200
    input: []
    output: PriceChangeNotice
    side_effects:
      - "HOP 1: the Product cost field named by cost_basis is overwritten with new_cost_cents and cost_effective_at stamped"
      - "HOP 2: ACTIVE COST_PLUS_PROTECTED deviations on that product re-derive deviated_price_cents and increment price_revision_count"
      - "HOP 3: any re-derived price above max_operator_price_cents moves that deviation ACTIVE -> PRICE_CEILING_BREACHED and increments Contract.deviation_breach_count"
      - "HOP 4: Contract.compliance_posture recomputed to RESTRICTED once deviation_breach_count reaches DEVIATION_BREACH_POSTURE_LIMIT"
      - "increments PriceChangeNotice.version by 1"

  - method: POST
    path: "/nac/price-change-notices/{price_change_notice_id}/withdraw"
    description: "Analyst withdraws a notice, freeing its rolling notice-window slot."
    roles: [PricingAnalyst]
    code: 200
    input: ["reason?"]
    output: PriceChangeNotice
    side_effects: ["PENDING, ACKNOWLEDGED or DISPUTED -> WITHDRAWN", "increments PriceChangeNotice.version by 1"]

  # --- rebate periods -------------------------------------------------------
  - method: POST
    path: "/nac/rebate-periods"
    description: "Open a rebate measurement period on a contract."
    roles: [RebateAccountant]
    code: 201
    input: [contract_id, period_start, period_end]
    output: RebatePeriod
    side_effects: ["RebatePeriod.status set to OPEN"]

  - method: GET
    path: "/nac/rebate-periods/{rebate_period_id}"
    description: "Read one rebate period including its computed compliance and rebate figures."
    roles: [RebateAccountant, NationalAccountManager, OperatorBuyer, ContractAuditor, ManufacturerRep]
    code: 200
    input: []
    output: RebatePeriod
    side_effects: []

  - method: GET
    path: "/nac/rebate-periods"
    description: "List rebate periods, filterable by contract and status."
    roles: [RebateAccountant, NationalAccountManager, OperatorBuyer, ContractAuditor, ManufacturerRep]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: RebatePeriod[]
    side_effects: []

  - method: POST
    path: "/nac/rebate-periods/{rebate_period_id}/close"
    description: "Close the period: compute contracted-item compliance, select the rebate rate, accrue the operator rebate and split its funding."
    roles: [RebateAccountant]
    code: 200
    input: []
    output: RebatePeriod
    side_effects:
      - "OPEN -> CLOSED with all compliance and rebate fields computed"
      - "Contract.rebate_payable_cents increased; Manufacturer.rebate_funding_payable_cents increased"
      - "Contract.compliance_posture recomputed"
      - "increments RebatePeriod.version by 1"

  - method: POST
    path: "/nac/rebate-periods/{rebate_period_id}/settle"
    description: "Settle the accrued rebate to the operator and draw down the manufacturer funding accrual."
    roles: [RebateAccountant]
    code: 200
    input: [settlement_reference]
    output: RebatePeriod
    side_effects:
      - "CLOSED -> SETTLED; settled_amount_cents, settled_at and settled_by_user_id stamped"
      - "Contract.rebate_payable_cents decreased and rebate_settled_total_cents increased by the same amount"
      - "Manufacturer.rebate_funding_payable_cents decreased"
      - "increments RebatePeriod.version by 1"

  - method: POST
    path: "/nac/rebate-periods/{rebate_period_id}/reverse-settlement"
    description: "Compensating action: unwind a settlement, restoring every rebate ledger term to its pre-settlement value."
    roles: [ContractAuditor]
    code: 200
    input: [reason]
    output: RebatePeriod
    side_effects:
      - "SETTLED -> CLOSED; settled_amount_cents reset to 0"
      - "Contract.rebate_payable_cents restored and rebate_settled_total_cents reduced"
      - "Manufacturer.rebate_funding_payable_cents restored"
      - "increments RebatePeriod.version by 1"

  # --- order lines ----------------------------------------------------------
  - method: POST
    path: "/nac/order-lines"
    description: "Price and record an order line: tier selection on prior class volume, cost-plus markup, deviated override, out-of-market service fee, contracted-item flag."
    roles: [OperatorBuyer]
    code: 201
    input: [contract_id, product_id, distribution_center_id, quantity_cases]
    output: OrderLine
    side_effects:
      - "order_date stamped from the logical clock; rebate_period_id resolved to the covering OPEN period"
      - "applied_tier_id, cost_basis_snapshot_cents, list_unit_price_cents, invoiced_unit_price_cents, extended_price_cents computed by contract_line_price"
      - "service_fee_cents and invoice_total_cents computed by out_of_market_service_fee"
      - "is_contracted_item computed; pricing_status DRAFT_PRICED; billback_status NOT_APPLICABLE"

  - method: GET
    path: "/nac/order-lines/{order_line_id}"
    description: "Read one order line with all pricing fields and both status dimensions."
    roles: [OperatorBuyer, NationalAccountManager, PricingAnalyst, RebateAccountant, ContractAuditor, ManufacturerRep]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/nac/order-lines"
    description: "List order lines, filterable by every foreign key and both status dimensions."
    roles: [OperatorBuyer, NationalAccountManager, PricingAnalyst, RebateAccountant, ContractAuditor, ManufacturerRep]
    code: 200
    input: ["contract_id?", "product_id?", "distribution_center_id?", "rebate_period_id?", "deviation_agreement_id?", "substituted_from_product_id?", "substitution_rule_id?", "applied_tier_id?", "bill_back_claim_id?", "pricing_status?", "billback_status?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/nac/order-lines/{order_line_id}/substitute"
    description: "Fill an out-of-stock contracted item from the ranked substitution rules; the server selects the substitute."
    roles: [OperatorBuyer]
    code: 200
    input: ["reason?"]
    output: OrderLine
    side_effects:
      - "substitute chosen by substitute_selection; substituted_from_product_id, product_id and substitution_rule_id rewritten"
      - "all pricing fields, service_fee_cents, invoice_total_cents and is_contracted_item recomputed"
      - "increments OrderLine.version by 1"

  - method: POST
    path: "/nac/order-lines/{order_line_id}/invoice"
    description: "Invoice the line, opening the bill-back accrual dimension when a deviation was applied."
    roles: [NationalAccountManager]
    code: 200
    input: []
    output: OrderLine
    side_effects:
      - "pricing_status DRAFT_PRICED or REPRICED -> INVOICED"
      - "billback_status NOT_APPLICABLE -> ACCRUED when deviation_agreement_id is not null"
      - "increments OrderLine.version by 1"

  - method: POST
    path: "/nac/order-lines/{order_line_id}/reprice"
    description: "Reprice an invoiced line against the currently ACTIVE tier and current cost basis while its period is still OPEN."
    roles: [NationalAccountManager]
    code: 200
    input: []
    output: OrderLine
    side_effects:
      - "pricing_status INVOICED -> REPRICED with all pricing fields recomputed"
      - "increments OrderLine.version by 1"

  # --- bill-back recovery ---------------------------------------------------
  - method: POST
    path: "/nac/bill-back-claims"
    description: "Accrue a manufacturer bill-back claim over a window of invoiced deviated lines. Requires the caller's last-observed DeviationAgreement.version."
    roles: [RebateAccountant]
    code: 201
    input: [deviation_agreement_id, claim_period_start, claim_period_end, expected_deviation_agreement_version]
    output: BillBackClaim
    side_effects:
      - "claimed_cases and claimed_amount_cents computed by bill_back_claim_amount"
      - "swept OrderLine rows move billback_status ACCRUED -> CLAIMED and record bill_back_claim_id"
      - "increments DeviationAgreement.version by 1"

  - method: GET
    path: "/nac/bill-back-claims/{bill_back_claim_id}"
    description: "Read one bill-back claim."
    roles: [RebateAccountant, ManufacturerRep, ContractAuditor, NationalAccountManager, PricingAnalyst]
    code: 200
    input: []
    output: BillBackClaim
    side_effects: []

  - method: GET
    path: "/nac/bill-back-claims"
    description: "List bill-back claims, filterable by deviation, manufacturer and status."
    roles: [RebateAccountant, ManufacturerRep, ContractAuditor, NationalAccountManager, PricingAnalyst]
    code: 200
    input: ["deviation_agreement_id?", "manufacturer_id?", "status?", "limit?", "offset?"]
    output: BillBackClaim[]
    side_effects: []

  - method: POST
    path: "/nac/bill-back-claims/{bill_back_claim_id}/submit"
    description: "Submit an accrued or disputed claim to the manufacturer."
    roles: [RebateAccountant]
    code: 200
    input: []
    output: BillBackClaim
    side_effects: ["ACCRUED or DISPUTED -> SUBMITTED", "records submitted_by_user_id and submitted_at", "Manufacturer.open_claim_exposure_cents recomputed", "increments BillBackClaim.version by 1"]

  - method: POST
    path: "/nac/bill-back-claims/{bill_back_claim_id}/dispute"
    description: "Manufacturer disputes a submitted claim; the claimed amount is recomputed from the current line state."
    roles: [ManufacturerRep]
    code: 200
    input: [note]
    output: BillBackClaim
    side_effects: ["SUBMITTED or PARTIALLY_RECOVERED -> DISPUTED", "claimed_amount_cents recomputed", "Manufacturer.open_claim_exposure_cents recomputed", "increments BillBackClaim.version by 1"]

  - method: POST
    path: "/nac/bill-back-claims/{bill_back_claim_id}/write-off"
    description: "Auditor writes off an unrecoverable claim; the writer may not be the accountant who submitted it."
    roles: [ContractAuditor]
    code: 200
    input: [write_off_reason]
    output: BillBackClaim
    side_effects: ["-> WRITTEN_OFF", "swept OrderLine rows move billback_status CLAIMED -> WRITTEN_OFF", "Manufacturer.open_claim_exposure_cents recomputed", "increments BillBackClaim.version by 1"]

  - method: POST
    path: "/nac/bill-back-remittances"
    description: "Apply manufacturer cash across open claims oldest-period-first; any surplus parks on the manufacturer's unapplied credit."
    roles: [RebateAccountant]
    code: 201
    input: [manufacturer_id, remitted_amount_cents, remittance_reference]
    output: BillBackRemittance
    side_effects:
      - "applied_claim_ids, applied_amount_cents and unapplied_amount_cents computed by bill_back_remittance_waterfall"
      - "each touched claim's recovered_amount_cents and status updated; fully recovered claims move their lines to RECOVERED"
      - "Manufacturer.total_remitted_cents, unapplied_credit_cents and open_claim_exposure_cents updated"

  - method: GET
    path: "/nac/bill-back-remittances/{bill_back_remittance_id}"
    description: "Read one remittance with its allocation breakdown."
    roles: [RebateAccountant, ManufacturerRep, ContractAuditor]
    code: 200
    input: []
    output: BillBackRemittance
    side_effects: []

  - method: GET
    path: "/nac/bill-back-remittances"
    description: "List remittances, filterable by manufacturer and status."
    roles: [RebateAccountant, ManufacturerRep, ContractAuditor]
    code: 200
    input: ["manufacturer_id?", "status?", "limit?", "offset?"]
    output: BillBackRemittance[]
    side_effects: []

  - method: POST
    path: "/nac/bill-back-remittances/{bill_back_remittance_id}/reverse"
    description: "Compensating action: unwind an applied remittance, restoring every claim slice and both manufacturer cash counters."
    roles: [RebateAccountant]
    code: 200
    input: [reason]
    output: BillBackRemittance
    side_effects:
      - "APPLIED -> REVERSED"
      - "each applied claim's recovered_amount_cents reduced by its slice and status recomputed; RECOVERED lines revert to CLAIMED"
      - "Manufacturer.total_remitted_cents and unapplied_credit_cents reduced; open_claim_exposure_cents recomputed"
      - "increments BillBackRemittance.version by 1"

  # --- pricing disputes and audit ------------------------------------------
  - method: POST
    path: "/nac/pricing-disputes"
    description: "Operator disputes the price invoiced on a line."
    roles: [OperatorBuyer]
    code: 201
    input: [order_line_id, claimed_correct_unit_price_cents, dispute_reason]
    output: PricingDispute
    side_effects: ["contract_id copied from the line; opened_by_user_id stamped; status OPEN"]

  - method: GET
    path: "/nac/pricing-disputes/{pricing_dispute_id}"
    description: "Read one pricing dispute including audit variance figures."
    roles: [OperatorBuyer, ContractAuditor, NationalAccountManager, RebateAccountant, PricingAnalyst]
    code: 200
    input: []
    output: PricingDispute
    side_effects: []

  - method: GET
    path: "/nac/pricing-disputes"
    description: "List pricing disputes, filterable by contract, order line and status."
    roles: [OperatorBuyer, ContractAuditor, NationalAccountManager, RebateAccountant, PricingAnalyst]
    code: 200
    input: ["contract_id?", "order_line_id?", "status?", "limit?", "offset?"]
    output: PricingDispute[]
    side_effects: []

  - method: POST
    path: "/nac/pricing-disputes/{pricing_dispute_id}/start-audit"
    description: "Auditor reprices the disputed line under the retroactive_tier variant and records the variance."
    roles: [ContractAuditor]
    code: 200
    input: []
    output: PricingDispute
    side_effects:
      - "OPEN -> UNDER_AUDIT"
      - "audited_correct_unit_price_cents, variance_cents_per_case and variance_pct computed by dispute_audit_repricing"
      - "increments PricingDispute.version by 1"

  - method: POST
    path: "/nac/pricing-disputes/{pricing_dispute_id}/request-info"
    description: "Auditor sends the dispute back for more information, clearing the audit figures."
    roles: [ContractAuditor]
    code: 200
    input: [note]
    output: PricingDispute
    side_effects: ["UNDER_AUDIT -> OPEN", "audited_correct_unit_price_cents, variance_cents_per_case and variance_pct reset to null", "increments PricingDispute.version by 1"]

  - method: POST
    path: "/nac/pricing-disputes/{pricing_dispute_id}/resolve"
    description: "Auditor upholds or rejects the dispute; UPHELD requires the variance to clear the audit tolerance."
    roles: [ContractAuditor]
    code: 200
    input: [resolution, "note?"]
    output: PricingDispute
    side_effects: ["UNDER_AUDIT -> UPHELD or REJECTED", "increments PricingDispute.version by 1"]

  - method: POST
    path: "/nac/pricing-disputes/{pricing_dispute_id}/issue-credit"
    description: "Issue the operator credit for an upheld dispute; drives the four-hop credit cascade through line, period, contract and manufacturer."
    roles: [ContractAuditor]
    code: 200
    input: []
    output: PricingDispute
    side_effects:
      - "HOP 1: UPHELD -> CREDIT_ISSUED with credit_amount_cents computed"
      - "HOP 2: the OrderLine moves to CREDITED, its invoiced price is rewritten and credited_amount_cents increased"
      - "HOP 3: the covering CLOSED RebatePeriod reopens to OPEN, clearing all computed metrics and incrementing reopen_count"
      - "HOP 4: Contract.rebate_payable_cents and Manufacturer.rebate_funding_payable_cents are reduced and Contract.compliance_posture is recomputed"
      - "SIDE BRANCH: a CLAIMED line's BillBackClaim moves SUBMITTED -> DISPUTED with claimed_amount_cents recomputed"

  - method: POST
    path: "/nac/pricing-disputes/{pricing_dispute_id}/withdraw"
    description: "Operator withdraws its dispute, unblocking settlement of the period."
    roles: [OperatorBuyer]
    code: 200
    input: ["reason?"]
    output: PricingDispute
    side_effects: ["OPEN or UNDER_AUDIT -> WITHDRAWN", "increments PricingDispute.version by 1"]

  # --- test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/nac/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which stamps order_date, submitted_at, closed_at and every window comparison. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Advancing the clock also runs the expiry sweep: contracts past effective_to expire (cascading to their deviations and coverages) and ACTIVE or PRICE_CEILING_BREACHED deviations at or past effective_to expire."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, expired_contract_ids: string[], expired_deviation_ids: string[] }"
    side_effects:
      - "Contract ACTIVE or SUSPENDED -> EXPIRED when the new clock passes effective_to, cascading tiers and coverages"
      - "DeviationAgreement ACTIVE or PRICE_CEILING_BREACHED -> EXPIRED when the new clock reaches effective_to"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint, or an entity_backed role acts on a resource it does not own"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, unknown field, wrong type, enum value outside the declared set, or a numeric field outside its constraint (including quantity_cases < 1 and a resolved deviated_price_cents <= 0)"
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "operator_id does not resolve"
  - id: ERR_MANUFACTURER_NOT_FOUND
    http: 404
    condition: "manufacturer_id or rebate_funding_manufacturer_id does not resolve"
  - id: ERR_DISTRIBUTION_CENTER_NOT_FOUND
    http: 404
    condition: "distribution_center_id does not resolve"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "product_id, primary_product_id or substitute_product_id does not resolve"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "contract_id does not resolve"
  - id: ERR_CONTRACT_TIER_NOT_FOUND
    http: 404
    condition: "contract_tier_id does not resolve"
  - id: ERR_DC_COVERAGE_NOT_FOUND
    http: 404
    condition: "dc_coverage_id does not resolve"
  - id: ERR_DEVIATION_NOT_FOUND
    http: 404
    condition: "deviation_agreement_id does not resolve"
  - id: ERR_SUBSTITUTION_RULE_NOT_FOUND
    http: 404
    condition: "substitution_rule_id does not resolve"
  - id: ERR_PRICE_CHANGE_NOTICE_NOT_FOUND
    http: 404
    condition: "price_change_notice_id does not resolve"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "order_line_id does not resolve"
  - id: ERR_BILL_BACK_CLAIM_NOT_FOUND
    http: 404
    condition: "bill_back_claim_id does not resolve"
  - id: ERR_BILL_BACK_REMITTANCE_NOT_FOUND
    http: 404
    condition: "bill_back_remittance_id does not resolve"
  - id: ERR_REBATE_PERIOD_NOT_FOUND
    http: 404
    condition: "rebate_period_id does not resolve"
  - id: ERR_PRICING_DISPUTE_NOT_FOUND
    http: 404
    condition: "pricing_dispute_id does not resolve"
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: "the contract is not in a from-state of the requested contract transition"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "the governing contract's status is not ACTIVE for an operation that requires a live contract"
  - id: ERR_PARENT_CONTRACT_NOT_AMENDING
    http: 409
    condition: "an amendment draft is signed while its parent contract is not in AMENDING"
  - id: ERR_DEVIATION_INVALID_STATE
    http: 409
    condition: "the deviation agreement is not in a from-state of the requested transition"
  - id: ERR_NOTICE_INVALID_STATE
    http: 409
    condition: "the price change notice is not in a from-state of the requested transition"
  - id: ERR_ORDER_LINE_INVALID_STATE
    http: 409
    condition: "the order line's pricing_status or billback_status is not a from-state of the requested transition, including disputing a line that has not been invoiced"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "the bill-back claim is not in a from-state of the requested transition"
  - id: ERR_REMITTANCE_INVALID_STATE
    http: 409
    condition: "the remittance is already REVERSED"
  - id: ERR_REBATE_PERIOD_INVALID_STATE
    http: 409
    condition: "the rebate period is not in a from-state of the requested transition"
  - id: ERR_DISPUTE_INVALID_STATE
    http: 409
    condition: "the pricing dispute is not in a from-state of the requested transition"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not match the referenced Contract.version"
  - id: ERR_STALE_DEVIATION_VERSION
    http: 412
    condition: "expected_deviation_agreement_version does not match the referenced DeviationAgreement.version"
  - id: ERR_DEVIATION_MANUFACTURER_MISMATCH
    http: 422
    condition: "the deviation's manufacturer_id differs from the deviated product's manufacturer_id"
  - id: ERR_SUBSTITUTE_GROUP_MISMATCH
    http: 422
    condition: "the substitute and primary products do not share a non-null substitution_group_code and product_class_code, or they are the same product"
  - id: ERR_NO_TIER_FOR_PRODUCT_CLASS
    http: 422
    condition: "no ACTIVE ContractTier of the contract covers the product's class at the relevant case volume"
  - id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http: 409
    condition: "the acting user is the same person who performed the incompatible earlier step (deviation submitter activating it, or claim submitter writing it off)"
  - id: ERR_CONTRACT_POSTURE_RESTRICTED
    http: 409
    condition: "Contract.compliance_posture is RESTRICTED and the operation is one the posture gates"
  - id: ERR_MANUFACTURER_SUSPENDED
    http: 409
    condition: "the manufacturer's status is SUSPENDED"
  - id: ERR_SETTLED_PERIOD_IMMUTABLE
    http: 409
    condition: "a credit would have to reopen a rebate period that has already been SETTLED"
  - id: ERR_DEVIATION_PERIOD_OVERLAP
    http: 409
    condition: "the deviation's half-open effective window intersects another live deviation on the same contract and product"
  - id: ERR_DC_COVERAGE_BUFFER_CONFLICT
    http: 409
    condition: "the coverage's closed interval is not separated from an existing ACTIVE coverage of the same contract and DC by more than DC_COVERAGE_BUFFER_DAYS clear days"
  - id: ERR_NOTICE_WINDOW_CONFLICT
    http: 409
    condition: "another PENDING or ACKNOWLEDGED notice for the product has an effective_at inside the rolling NOTICE_WINDOW_DAYS window"
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "effective_at precedes earliest_effective_at derived from the notice's delta_pct"
  - id: ERR_NOTICE_NOT_YET_EFFECTIVE
    http: 409
    condition: "the notice is activated before the logical clock reaches effective_at"
  - id: ERR_INDEX_VALUE_REQUIRED
    http: 422
    condition: "an indexed product's notice omits published_index_value or supplies proposed_cost_cents, or a non-indexed product's notice does the reverse"
  - id: ERR_ORDER_DATE_OUTSIDE_CONTRACT_TERM
    http: 422
    condition: "the logical clock lies outside the contract's inclusive effective term"
  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "the new rebate period's half-open window intersects an existing period of the same contract"
  - id: ERR_PERIOD_NOT_ENDED
    http: 409
    condition: "a rebate period is closed before the logical clock reaches its period_end"
  - id: ERR_CLAIM_PERIOD_OVERLAP
    http: 409
    condition: "the new claim window intersects a non-written-off claim on the same deviation"
  - id: ERR_TIER_BAND_OVERLAP
    http: 409
    condition: "the new tier's case-volume band intersects an ACTIVE tier of the same contract and product class"
  - id: ERR_MAX_REVISION_ROUNDS_EXCEEDED
    http: 409
    condition: "a deviation is resubmitted after MAX_REVISION_ROUNDS negotiation loops"
  - id: ERR_DC_NOT_COVERED
    http: 409
    condition: "no ACTIVE DcCoverage of the contract covers the requested DC at the order date"
  - id: ERR_OUT_OF_MARKET_NOT_PERMITTED
    http: 409
    condition: "OUT_OF_MARKET coverage is requested on a contract whose allow_out_of_market is false"
  - id: ERR_NO_OPEN_REBATE_PERIOD
    http: 409
    condition: "no OPEN rebate period of the contract contains the order date"
  - id: ERR_PRODUCT_IN_STOCK
    http: 409
    condition: "substitution is requested while the referenced product is IN_STOCK"
  - id: ERR_NO_ELIGIBLE_SUBSTITUTE
    http: 409
    condition: "the substitution candidate set is empty after the eligibility filter"
  - id: ERR_NO_QUALIFYING_LINES
    http: 422
    condition: "a bill-back claim window sweeps zero eligible lines"
  - id: ERR_OPEN_DISPUTES_BLOCK_SETTLEMENT
    http: 409
    condition: "settlement is attempted while a dispute on one of the period's lines is OPEN or UNDER_AUDIT"
  - id: ERR_REBATE_PERIOD_NOT_CLOSED
    http: 409
    condition: "an audit is started while the disputed line's rebate period is still OPEN"
  - id: ERR_DISPUTE_ALREADY_EXISTS_FOR_LINE
    http: 409
    condition: "a live dispute already exists for the order line"
  - id: ERR_DEVIATED_PRICE_ABOVE_CEILING
    http: 422
    condition: "the resolved deviated price exceeds max_operator_price_cents at create or activate time"
  - id: ERR_VARIANCE_BELOW_AUDIT_TOLERANCE
    http: 422
    condition: "UPHELD is requested while variance_pct is below AUDIT_TOLERANCE_PCT or the variance favours the operator"
  - id: ERR_REBATE_PAYABLE_OUTSTANDING
    http: 409
    condition: "a contract with a non-zero rebate_payable_cents is terminated"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Owns reference data (operators, manufacturers, distribution centers, products) and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /nac/operators"
      - "POST /nac/manufacturers"
      - "POST /nac/distribution-centers"
      - "POST /nac/products"
      - "POST /nac/products/{product_id}/availability"
      - "POST /nac/_clock/set_current_utc"
    shared_operations:
      - "GET /nac/operators/{operator_id}"
      - "GET /nac/manufacturers/{manufacturer_id}"
      - "GET /nac/distribution-centers/{distribution_center_id}"
      - "GET /nac/products/{product_id}"
      - "GET /nac/products"
      - "GET /nac/contracts/{contract_id}"
      - "GET /nac/contracts"

  - name: NationalAccountManager
    description: "Constructs contracts, markup tiers, DC coverage and substitution rules; activates deviations; invoices and reprices lines."
    identity: "opaque"
    exclusive_operations:
      - "POST /nac/contracts"
      - "POST /nac/contracts/{contract_id}/submit-for-signature"
      - "POST /nac/contracts/{contract_id}/amendments"
      - "POST /nac/contracts/{contract_id}/suspend"
      - "POST /nac/contracts/{contract_id}/reinstate"
      - "POST /nac/contracts/{contract_id}/terminate"
      - "POST /nac/contract-tiers"
      - "POST /nac/dc-coverages"
      - "POST /nac/substitution-rules"
      - "POST /nac/deviation-agreements/{deviation_agreement_id}/activate"
      - "POST /nac/order-lines/{order_line_id}/invoice"
      - "POST /nac/order-lines/{order_line_id}/reprice"
    shared_operations:
      - "GET /nac/contracts/{contract_id}/compliance-report"
      - "GET /nac/contract-tiers, GET /nac/dc-coverages, GET /nac/deviation-agreements, GET /nac/substitution-rules, GET /nac/price-change-notices, GET /nac/order-lines, GET /nac/bill-back-claims, GET /nac/rebate-periods, GET /nac/pricing-disputes and their single-resource reads"

  - name: PricingAnalyst
    description: "Drafts and submits deviated pricing agreements and issues, revises, withdraws and activates price change notices."
    identity: "opaque"
    exclusive_operations:
      - "POST /nac/deviation-agreements"
      - "POST /nac/deviation-agreements/{deviation_agreement_id}/submit"
      - "POST /nac/price-change-notices"
      - "POST /nac/price-change-notices/{price_change_notice_id}/revise"
      - "POST /nac/price-change-notices/{price_change_notice_id}/activate"
      - "POST /nac/price-change-notices/{price_change_notice_id}/withdraw"
    shared_operations:
      - "GET /nac/products, GET /nac/products/{product_id}, GET /nac/contracts, GET /nac/contracts/{contract_id}"
      - "GET /nac/contract-tiers, GET /nac/deviation-agreements, GET /nac/substitution-rules, GET /nac/price-change-notices, GET /nac/order-lines, GET /nac/bill-back-claims, GET /nac/pricing-disputes and their single-resource reads"

  - name: OperatorBuyer
    description: "Acts for one Operator: signs or returns contracts, places and substitutes order lines, acknowledges or disputes notices, opens and withdraws pricing disputes."
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /nac/contracts/{contract_id}/sign"
      - "POST /nac/contracts/{contract_id}/return-to-draft"
      - "POST /nac/order-lines"
      - "POST /nac/order-lines/{order_line_id}/substitute"
      - "POST /nac/price-change-notices/{price_change_notice_id}/acknowledge"
      - "POST /nac/price-change-notices/{price_change_notice_id}/dispute"
      - "POST /nac/pricing-disputes"
      - "POST /nac/pricing-disputes/{pricing_dispute_id}/withdraw"
    shared_operations:
      - "GET /nac/contracts/{contract_id}/compliance-report"
      - "GET /nac/contracts, GET /nac/contract-tiers, GET /nac/dc-coverages, GET /nac/products, GET /nac/substitution-rules, GET /nac/price-change-notices, GET /nac/order-lines, GET /nac/rebate-periods, GET /nac/deviation-agreements, GET /nac/pricing-disputes and their single-resource reads"

  - name: ManufacturerRep
    description: "Acts for one Manufacturer: decides on submitted deviations and disputes submitted bill-back claims."
    identity: "entity_backed:Manufacturer"
    exclusive_operations:
      - "POST /nac/deviation-agreements/{deviation_agreement_id}/manufacturer-decision"
      - "POST /nac/bill-back-claims/{bill_back_claim_id}/dispute"
    shared_operations:
      - "GET /nac/manufacturers/{manufacturer_id}, GET /nac/products/{product_id}"
      - "GET /nac/deviation-agreements, GET /nac/bill-back-claims, GET /nac/bill-back-remittances, GET /nac/order-lines, GET /nac/rebate-periods and their single-resource reads"

  - name: RebateAccountant
    description: "Opens, closes and settles rebate periods and drives bill-back accrual, submission and cash application."
    identity: "opaque"
    exclusive_operations:
      - "POST /nac/rebate-periods"
      - "POST /nac/rebate-periods/{rebate_period_id}/close"
