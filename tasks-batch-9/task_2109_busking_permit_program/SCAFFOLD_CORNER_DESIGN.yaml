      - name: corner_missing_auth_headers_outrank_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=10]", "validations[priority=30]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID against a non-existent pitch id returns 401 ERR_UNAUTHENTICATED, not 404: priority 10 outranks priority 30."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /busking/pitches/00000000-0000-4000-8000-000000000000"
              as: NONE
              captures: { e_auth: "$.data.error_id" }
          assert:
            - 'HTTP status is 401'
            - 'data.error_id == "ERR_UNAUTHENTICATED"'

      - name: corner_forbidden_role_outranks_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=20]", "validations[priority=30]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Resident calling GET /busking/permits/{id} on a non-existent id returns 403 ERR_FORBIDDEN_ROLE (priority 20) rather than 404 ERR_PERMIT_NOT_FOUND (priority 30), because Resident is not on that endpoint's role list."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /busking/permits/00000000-0000-4000-8000-000000000000"
              as: Resident
              as_user_id: "resident-1"
              captures: { e_role: "$.data.error_id" }
          assert:
            - 'HTTP status is 403'
            - 'data.error_id == "ERR_FORBIDDEN_ROLE"'

