      - name: rollover_net_shortfall_boundary_at_thirty_thousand_limit
        grounds:
          - validations.priority_105_ERR_ROLLOVER_SHORTFALL_EXCEEDS_LIMIT
          - calculations.rollover_and_new_loan_principal
          - entities.InstallmentLoan.fields.rolled_over_balance_cents
