      - name: corner_third_deficiency_finding_auto_denies_the_application
        claim_type: Idempotency
        grounds:
          - state_machines.LicenseApplication.SUBMITTED_to_DENIED
          - state_machines.LicenseApplication.DEFICIENT_to_SUBMITTED
        distinguishing_aspect: "The same DEFICIENT decision body produces DEFICIENT twice and DENIED with denial_reason EXCESSIVE_DEFICIENCY_ROUNDS on the third pass, so repetition is not idempotent on this cycle."
        excluded_because:
          difficulty_instance: application_deficiency_cure_loop_denies_on_third_finding
          rationale: "That §1.8 instance already drives the cure loop through both DEFICIENT rounds and asserts the automatic third-round DENIED with deficiency_round_count 3 and denial_reason EXCESSIVE_DEFICIENCY_ROUNDS."

      - name: corner_accepted_screening_forks_on_the_classification_flag
        claim_type: Valid Transition
        grounds:
          - state_machines.Complaint.RECEIVED_to_MEDIATION
          - state_machines.Complaint.RECEIVED_to_INVESTIGATION
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "One identical ACCEPTED body reaches MEDIATION (round 1, deadline armed) or INVESTIGATION (round 0, deadline null) purely from the subject licence's classification flag."
        excluded_because:
          difficulty_instance: complaint_screening_forks_into_mediation_or_direct_investigation
          rationale: "That §1.8 instance screens two complaints with byte-identical request bodies against a mediation_required and a non-mediation classification and asserts both branches' divergent side-effect sets."

      - name: corner_license_status_and_compliance_posture_move_independently
        claim_type: parallel
        grounds:
          - state_machines.License
          - calculations.license_compliance_posture
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "compliance_posture is a second, independent dimension: it can traverse NON_COMPLIANT -> COMPLIANT -> CONDITIONAL while License.status never leaves ACTIVE."
        excluded_because:
          difficulty_instance: license_posture_dimension_moves_three_times_while_status_stays_active
          rationale: "That §1.8 instance walks the posture dimension through three values with the licensure dimension pinned at ACTIVE and asserts every intermediate posture."

      - name: corner_bond_cancellation_suspends_the_license_and_releases_the_slot
        claim_type: Cascade down
        grounds:
          - state_machines.CoverageRecord.VERIFIED_to_CANCELLED
          - state_machines.License.ACTIVE_to_SUSPENDED
          - state_machines.QualifierAssignment.ACTIVE_to_SUSPENDED_BY_LICENSE
        distinguishing_aspect: "Cancelling the only live bond runs a four-hop cascade: expiration_date rewritten, posture NON_COMPLIANT, licence SUSPENDED with BOND_LAPSE, designation SUSPENDED_BY_LICENSE and the qualifier's count decremented."
        excluded_because:
          difficulty_instance: bond_cancellation_cascade_lapses_coverage_suspends_license_and_drops_count
          rationale: "That §1.8 instance asserts every hop of the cancellation cascade including the suspension_reason and the qualifier count delta."

      - name: corner_full_repayment_reactivates_the_suspended_designation
        claim_type: Compensation
        grounds:
          - state_machines.License.SUSPENDED_to_ACTIVE
          - state_machines.QualifierAssignment.SUSPENDED_BY_LICENSE_to_ACTIVE
          - state_machines.RecoveryFundClaim.PAID_to_REIMBURSED
        distinguishing_aspect: "Repaying the payout in full undoes every side effect of the disbursement: the claim becomes REIMBURSED, the licence returns to ACTIVE with a null suspension_reason and the designation returns to ACTIVE bumping the count back up."
        excluded_because:
          difficulty_instance: qualifier_slot_count_is_conserved_across_a_payout_and_a_full_repayment
          rationale: "That §1.8 instance asserts the conserved qualifier-slot count across the payout and the full repayment, covering both reversal hops end to end."

