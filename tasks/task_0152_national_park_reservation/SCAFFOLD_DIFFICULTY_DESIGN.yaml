scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: campground_refund_standard_vs_group_strict
        grounds:
          - calculations.campground_refund
          - calculations.campground_refund.variants.group_site_strict
          - entities.CampgroundReservation.fields.site_kind
          - entities.CampgroundReservation.fields.refund_cents
        distinguishing_aspect: |
          Cancelling at >= 336h with identical total_fee and nightly_rate inputs produces
          a DIFFERENT refund on the SAME entity row depending on site_kind: STANDARD
          returns 7624 cents (total - booking_fee), while GROUP returns 26944 cents
          (total - booking_fee - nightly) for total=39744, nightly=12000, booking_fee=800
          — i.e., GROUP retains one extra non-refundable night that STANDARD does not.
        test_recipe:
          setup:
            - "Park P (OPEN, tz America/Los_Angeles), Campground C with nightly_standard_fee_cents=3500, nightly_group_fee_cents=12000, max_consecutive_nights=14"
            - "Visitor V1 wallet_balance_cents=20000, V2 wallet_balance_cents=80000"
            - "Reservation R_STD by V1: STANDARD, party 2, 2 nights — total_fee_cents=8424 at confirm"
            - "Reservation R_GRP by V2: GROUP, party 10, 3 nights — total_fee_cents=39744 at confirm"
            - "Clock advanced so both reservations are 400 hours before check-in"
          trigger:
            - "POST /campgrounds/{C}/reservations/{R_STD}/cancel"
            - "POST /campgrounds/{C}/reservations/{R_GRP}/cancel"
          assert:
            - "R_STD.refund_cents == 7624"
            - "R_GRP.refund_cents == 26944"
            - "R_STD.refund_cents != R_GRP.refund_cents - (R_GRP.total_fee_cents - R_STD.total_fee_cents)"

      - name: timed_entry_refund_paid_vs_pass_waived
        grounds:
          - calculations.timed_entry_refund
          - calculations.timed_entry_refund.variants.pass_waived
          - entities.TimedEntryReservation.fields.entry_fee_cents
          - entities.TimedEntryReservation.fields.pass_id
          - entities.AmericaTheBeautifulPass.fields.status
        distinguishing_aspect: |
          On a TimedEntryReservation (a different entity from CampgroundReservation), the
          same calendar cancellation timing produces a different refund: a paid reservation
          cancelled >= 168h out refunds 3500 cents, while a pass_waived reservation refunds
          0 cents because entry_fee_cents was 0 at confirm — same tiered formula applied to
          different input values produced by the variant selector.
        test_recipe:
          setup:
            - "Park P with timed_entry_daily_capacity=10, timed_entry_window_minutes=60"
            - "Visitor V1 with ANNUAL pass valid_from past, valid_until far-future"
            - "Visitor V2 with no pass, wallet_balance_cents=5000"
            - "Reservation R_PAID by V2 confirmed (entry_fee_cents=3500)"
            - "Reservation R_PASS by V1 confirmed using ANNUAL pass (entry_fee_cents=0)"
            - "Clock advanced to 200 hours before entry window start (both)"
          trigger:
            - "POST /parks/{P}/timed-entry/{R_PAID}/cancel"
            - "POST /parks/{P}/timed-entry/{R_PASS}/cancel"
          assert:
            - "R_PAID.entry_fee_cents == 3500 and the FEE_REFUND LedgerEntry for V2 == 3500"
            - "R_PASS.entry_fee_cents == 0 and no FEE_REFUND LedgerEntry written for V1"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: booking_total_rounding_order_mode_b
        grounds:
          - calculations.booking_total
          - entities.CampgroundReservation.fields.total_fee_cents
          - entities.Campground.fields.nightly_standard_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins:
          total = (nightly * nights + BOOKING_FEE) + floor((nightly * nights + BOOKING_FEE) * TAX).
          For nightly=3500, nights=2, booking_fee=800, tax=0.08 the pinned order yields 8424;
          the WRONG order (floor each nightly fee with tax first, then sum) would yield
          (3500 + floor(3500*0.08))*2 + 800 + floor(800*0.08) = (3780)*2 + 800 + 64 = 8424
          numerically by coincidence here, but the formula language forbids floor-then-sum
          per-line — the assertion pins the SUM-FIRST evaluation order.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C with nightly_standard_fee_cents=3500"
            - "Visitor V with wallet 10000"
          trigger:
            - "POST /campgrounds/{C}/reservations with site_kind=STANDARD, party_size=2, 2 nights"
          assert:
            - "Reservation.total_fee_cents == 8424"
            - "Reservation.nightly_rate_cents == 3500 (not 3780 — tax is applied at the total level)"

      - name: backcountry_overlap_with_buffer_mode_a
        grounds:
          - calculations.backcountry_overlap
          - entities.BackcountryZone.fields.ranger_buffer_minutes
          - entities.BackcountryZone.fields.nightly_quota_people
          - state_machines.BackcountryPermit.HELD_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a) — formula with >= 3 inputs (entry, exit, buffer, plus per-night party
          aggregation) and non-linear interaction: collision is `a < d + buffer AND c < b + buffer`
          combined with a per-overnight-night running sum against nightly_quota_people. The
          two checks are gated by different error codes (ERR_RANGER_BUFFER_VIOLATION vs
          ERR_BACKCOUNTRY_FULL) and the buffer check fires BEFORE the quota check.
        test_recipe:
          setup:
            - "Park P OPEN, BackcountryZone Z with ranger_buffer_minutes=30, nightly_quota_people=20, per_party_fee_cents=1500"
            - "Visitor V1 wallet 5000; Visitor V2 wallet 5000"
            - "Permit A (V1) entry=2026-06-01 09:00 local, exit=2026-06-01 11:00 local, party 2 — CONFIRMED"
          trigger:
            - "Permit B1 by V2: entry=2026-06-01 11:15 local, exit=2026-06-01 13:00 local, party 2; POST .../confirm"
            - "Permit B2 by V2: entry=2026-06-01 11:30 local, exit=2026-06-01 13:00 local, party 2; POST .../confirm"
          assert:
            - "B1 confirm rejected with ERR_RANGER_BUFFER_VIOLATION (gap 15min < 30min)"
            - "B2 confirm succeeds (gap 30min >= 30min) and B2.status == CONFIRMED"

  # =========================================================================
  # Rule 3: Non-linear state machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lottery_application_branching_with_revert
        grounds:
          - state_machines.LotteryApplication
          - state_machines.LotteryApplication.SUBMITTED_to_AWARDED
          - state_machines.LotteryApplication.SUBMITTED_to_WAITLISTED
          - state_machines.LotteryApplication.AWARDED_to_DECLINED
          - state_machines.LotteryApplication.AWARDED_to_FORFEITED
        distinguishing_aspect: |
          Branching fork-join: from SUBMITTED the draw forks into AWARDED or WAITLISTED with
          divergent side-effect sets (AWARDED writes award_expires_at; WAITLISTED does not).
          From AWARDED the machine branches again to ACCEPTED, DECLINED, or FORFEITED, with
          DECLINED/FORFEITED triggering a slot-return cascade absent from ACCEPTED.
        test_recipe:
          setup:
            - "Park P OPEN, LotteryPermit L with daily_slot_count=5, open/close in past, hike_date future"
            - "Three SUBMITTED applications: A1(party=3, rank_seed=10), A2(party=4, rank_seed=20), A3(party=2, rank_seed=30)"
          trigger:
            - "POST /lottery-permits/{L}/draw"
          assert:
            - "A1.status == AWARDED (remaining slots 5 -> 2)"
            - "A2.status == WAITLISTED (remaining 2 < party 4)"
            - "A3.status == AWARDED (remaining 2 -> 0)"
            - "A1.award_expires_at == draw_at + 72h; A2.award_expires_at IS NULL"

      - name: park_compound_status_with_revert
        grounds:
          - state_machines.Park
          - state_machines.Park.OPEN_to_RESTRICTED
          - state_machines.Park.RESTRICTED_to_FROZEN
          - state_machines.Park.FROZEN_to_OPEN
        distinguishing_aspect: |
          Park machine on a DIFFERENT entity from LotteryApplication is branching with
          reversible transitions (revert): OPEN -> RESTRICTED -> FROZEN, RESTRICTED -> OPEN,
          FROZEN -> OPEN. Each non-terminal state has different gating behaviour for
          downstream creates (RESTRICTED blocks timed-entry + backcountry but not campground;
          FROZEN blocks all). Multiple paths from OPEN to FROZEN exist (direct vs via
          RESTRICTED) with identical end-state but different intermediate creates allowed.
        test_recipe:
          setup:
            - "Park P, Campground C, BackcountryZone Z, Visitor V wallet 10000"
            - "Park P -> RESTRICTED via POST /parks/{P}/restrict"
          trigger:
            - "POST /campgrounds/{C}/reservations by V (STANDARD, 1 night)"
            - "POST /backcountry-zones/{Z}/permits by V"
            - "POST /parks/{P}/reopen"
            - "POST /parks/{P}/freeze"
            - "POST /campgrounds/{C}/reservations by V (STANDARD, 1 night, different date)"
          assert:
            - "Campground create in RESTRICTED succeeds"
            - "Backcountry create in RESTRICTED rejected with ERR_PARK_RESTRICTED"
            - "Campground create after FROZEN rejected with ERR_PARK_FROZEN"
            - "Park P.status sequence OPEN -> RESTRICTED -> OPEN -> FROZEN observed"

  # =========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: campground_cancel_to_waitlist_promotion_to_new_reservation
        grounds:
          - state_machines.CampgroundReservation.CONFIRMED_to_CANCELLED
          - calculations.waitlist_promote
          - state_machines.WaitlistEntry.WAITING_to_PROMOTED
          - state_machines.CampgroundReservation
        distinguishing_aspect: |
          Cascade depth 3 from CampgroundReservation cancel: A) cancel transitions
          Reservation.status CONFIRMED -> CANCELLED which B) releases site inventory which
          itself triggers C) waitlist_promote that mutates WaitlistEntry.status WAITING ->
          PROMOTED and D) creates a NEW CampgroundReservation in HELD for the waitlister.
          Each step is caused by the previous step's state mutation, not by the original
          cancel action directly.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C with standard_site_count=1, waitlist_window_hours=24, nightly_standard_fee=3500"
            - "Visitor V1 (holder) wallet 12000; Visitor V2 (waitlister) wallet 12000"
            - "R1 by V1: STANDARD 2 nights, CONFIRMED; check-in 12 hours from now"
            - "Wait entry W1 by V2 for same campground/site_kind/dates, status WAITING"
          trigger:
            - "POST /campgrounds/{C}/reservations/{R1}/cancel"
          assert:
            - "R1.status == CANCELLED"
            - "W1.status == PROMOTED"
            - "W1.promoted_reservation_id != null"
            - "A new CampgroundReservation R2 exists with visitor_id == V2.id, status == HELD, held_until == now + 4h"

      - name: lottery_decline_to_waitlist_promotion_to_award_expiry_clock
        grounds:
          - state_machines.LotteryApplication.AWARDED_to_DECLINED
          - calculations.lottery_draw
          - state_machines.LotteryApplication.SUBMITTED_to_WAITLISTED
          - entities.LotteryApplication.fields.award_expires_at
        distinguishing_aspect: |
          Cascade depth 2 from a DIFFERENT trigger (lottery decline, not campground cancel):
          A) Decline transitions Application.status AWARDED -> DECLINED, which returns the
          freed slots to the LotteryPermit pool, which B) promotes the lowest-rank_seed
          WAITLISTED application to AWARDED and stamps award_expires_at on the newly-promoted
          application. Different originating transition, different cascade target field.
        test_recipe:
          setup:
            - "Setup as lottery_application_branching_with_revert through draw step (A1 AWARDED, A2 WAITLISTED, A3 AWARDED)"
            - "Wallet for A1's visitor 0 so they decline"
          trigger:
            - "POST /lottery-applications/{A1}/decline"
          assert:
            - "A1.status == DECLINED"
            - "A2.status == AWARDED (was WAITLISTED — promoted because slots returned now allow party_size=4)"
            - "A2.award_expires_at == now + 72h (stamped at promotion)"

  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_park_frozen_beats_insufficient_funds
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - errors[ERR_PARK_FROZEN]
          - errors[ERR_INSUFFICIENT_FUNDS]
        distinguishing_aspect: |
          Error-category pair `state` (Park frozen) vs `business_fiscal` (insufficient funds):
          when a visitor with empty wallet POSTs a campground reservation in a FROZEN park,
          BOTH checks would fail. Priority 5 (state) wins over priority 17 (fiscal), so the
          response is ERR_PARK_FROZEN, not ERR_INSUFFICIENT_FUNDS.
        test_recipe:
          setup:
            - "Park P with status FROZEN (created OPEN, then POST /parks/{P}/freeze)"
            - "Campground C under P"
            - "Visitor V with wallet_balance_cents=0"
          trigger:
            - "POST /campgrounds/{C}/reservations by V (STANDARD, 1 night)"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PARK_FROZEN (not ERR_INSUFFICIENT_FUNDS)"

      - name: safety_vs_capacity_strike_limit_beats_campground_full
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - errors[ERR_STRIKE_LIMIT_REACHED]
          - errors[ERR_CAMPGROUND_FULL]
        distinguishing_aspect: |
          DIFFERENT error-category pair from the first instance: `business_safety` (strike
          limit on group sites) vs `business_constraint` (campground full). A strike-flagged
          visitor requesting a GROUP site at a campground that is already full triggers both
          checks; priority 7 (safety) wins over priority 16 (constraint), yielding
          ERR_STRIKE_LIMIT_REACHED rather than ERR_CAMPGROUND_FULL.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C with group_site_count=1"
            - "Visitor V with lottery_strikes=3 (set via three NO_SHOW lottery applications)"
            - "Visitor V2 occupying the single GROUP site for the requested dates"
          trigger:
            - "POST /campgrounds/{C}/reservations by V (GROUP, party 8, 1 night, same dates as V2)"
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_STRIKE_LIMIT_REACHED (not ERR_CAMPGROUND_FULL or 409)"

  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refund_at_exact_336h_boundary_inclusive
        grounds:
          - calculations.campground_refund
          - entities.CampgroundReservation.fields.refund_cents
        distinguishing_aspect: |
          Numeric threshold metric `hours_to_checkin` on the campground_refund endpoint.
          The `>=` boundary is inclusive: at exactly 336.0h the FULL-refund branch fires
          (refund = total - booking_fee = 7624), at 335.99h the 50% branch fires
          (refund = 3812). The two cases sit one second apart on the same metric.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C, Visitor V wallet 12000"
            - "Reservation R STANDARD 2 nights, total 8424, CONFIRMED"
            - "Set check-in 336 hours from now via clock arithmetic"
          trigger:
            - "POST /campgrounds/{C}/reservations/{R}/cancel"
          assert:
            - "R.refund_cents == 7624 (the >=336h branch fired)"
            - "Repeating the same setup with clock advanced one minute past 335h59m yields R.refund_cents == 3812"

      - name: empty_set_lottery_draw_zero_eligible_apps
        grounds:
          - calculations.lottery_draw
          - state_machines.LotteryPermit
          - validations[priority=6]
        distinguishing_aspect: |
          A different metric type — empty-set boundary, reachable through a DIFFERENT endpoint
          (POST /lottery-permits/{id}/draw, not the cancel endpoint). When zero applications
          are eligible (all strike-flagged) the draw still flips LotteryPermit.status to
          DRAWN but creates zero AWARDED rows; the visitor count is exactly 0, not 1.
        test_recipe:
          setup:
            - "Park P OPEN, LotteryPermit L with daily_slot_count=5"
            - "Two SUBMITTED applications by visitors with lottery_strikes==3 (achieved via earlier sweeps; applications were submitted BEFORE strike accumulation)"
          trigger:
            - "POST /lottery-permits/{L}/draw"
          assert:
            - "L.status == DRAWN"
            - "Count of LotteryApplication where lottery_permit_id==L AND status==AWARDED equals 0"
            - "Both applications remain status==SUBMITTED (filtered out by strike eligibility)"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: campground_create_depends_on_park_status
        grounds:
          - validations[priority=5]
          - state_machines.Park
          - state_machines.CampgroundReservation
          - entities.Park.fields.status
        distinguishing_aspect: |
          Cross-entity pair Park <-> CampgroundReservation: a CampgroundReservation can only
          be CREATED while Park.status IN {OPEN, RESTRICTED}; status==FROZEN blocks. The
          target entity transition (CampgroundReservation HELD creation) is gated by the
          parent entity's state.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C, Visitor V wallet 10000"
            - "Confirm freeze with POST /parks/{P}/freeze"
          trigger:
            - "POST /campgrounds/{C}/reservations by V (STANDARD, 1 night)"
          assert:
            - "HTTP 409 and error_id == ERR_PARK_FROZEN"
            - "After POST /parks/{P}/reopen the identical request returns HTTP 201"

      - name: timed_entry_fee_depends_on_pass_status
        grounds:
          - validations[priority=8]
          - entities.TimedEntryReservation.fields.entry_fee_cents
          - entities.TimedEntryReservation.fields.pass_id
          - entities.AmericaTheBeautifulPass.fields.status
        distinguishing_aspect: |
          DIFFERENT cross-entity pair: AmericaTheBeautifulPass <-> TimedEntryReservation.
          Reservation creation succeeds with entry_fee_cents=0 only if the referenced pass's
          status is ACTIVE at entry_date_local; if the pass is REVOKED the reservation is
          rejected with ERR_PASS_INVALID. The same entry-fee calculation depends on a sibling
          entity's state, not the parent park's.
        test_recipe:
          setup:
            - "Park P OPEN, Visitor V, ANNUAL pass issued and then REVOKED via POST .../revoke"
          trigger:
            - "POST /parks/{P}/timed-entry by V with pass_id=revoked_pass_id, entry_date_local 5 days future"
          assert:
            - "HTTP 422 and error_id == ERR_PASS_INVALID"
            - "Repeating the request omitting pass_id succeeds with entry_fee_cents > 0"

  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: backcountry_buffer_expanded_open_intervals
        grounds:
          - calculations.backcountry_overlap
          - entities.BackcountryZone.fields.ranger_buffer_minutes
          - errors[ERR_RANGER_BUFFER_VIOLATION]
        distinguishing_aspect: |
          Interval semantics: half-open [entry, exit) on BackcountryPermit expanded by the
          ranger buffer on both sides; collision iff `a < d + buffer AND c < b + buffer`.
          Buffer-equal-to-gap is NOT a collision (>=). The semantic is `geometric-expansion
          half-open`, distinct from the next instance's semantic.
        test_recipe:
          setup:
            - "Park P OPEN, BackcountryZone Z with ranger_buffer_minutes=30, nightly_quota_people=20"
            - "Visitor V1, V2 wallet 5000 each"
            - "Permit A by V1: 2026-06-01 09:00 -> 11:00 local, party 2, CONFIRMED"
          trigger:
            - "Permit B by V2: 2026-06-01 11:15 -> 13:00 local, party 2; POST .../confirm"
          assert:
            - "B confirm rejected with HTTP 409 ERR_RANGER_BUFFER_VIOLATION"
            - "Repeating with B entry 2026-06-01 11:30 succeeds (gap exactly 30 minutes)"

      - name: campground_aggregate_inventory_closed_half_open
        grounds:
          - validations[priority=16]
          - entities.Campground.fields.standard_site_count
          - errors[ERR_CAMPGROUND_FULL]
        distinguishing_aspect: |
          DIFFERENT interval semantic on a DIFFERENT resource entity (Campground): per-night
          aggregate capacity using closed-on-checkin / open-on-checkout [check_in, check_out)
          inventory counters. There is no buffer expansion; instead two reservations sharing
          ANY single night exhaust capacity if standard_site_count is reached. The check is a
          counter sum per night, not a 2-interval geometric expansion.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C with standard_site_count=1"
            - "Visitor V1, V2 wallet 12000"
            - "R1 by V1: STANDARD 2 nights 2026-06-01 -> 2026-06-03, CONFIRMED"
          trigger:
            - "R2 by V2: STANDARD 1 night 2026-06-02 -> 2026-06-03 (overlaps 1 night)"
            - "R3 by V2: STANDARD 1 night 2026-06-03 -> 2026-06-04 (touches check-out edge)"
          assert:
            - "R2 creation rejected with HTTP 409 ERR_CAMPGROUND_FULL (shares night 06-02)"
            - "R3 creation succeeds (check-out date is open boundary; night 06-03 free)"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: wallet_invariant_after_full_refund
        grounds:
          - state_machines.CampgroundReservation.CONFIRMED_to_CANCELLED
          - calculations.campground_refund
          - entities.Visitor.fields.wallet_balance_cents
          - entities.LedgerEntry
        distinguishing_aspect: |
          Conserved quantity: Visitor.wallet_balance_cents. Forward action confirm debits
          total_fee_cents; compensating action cancel at >= 336h refunds total - booking_fee.
          Invariant: after the pair, wallet_balance_cents must equal initial_wallet minus
          booking_fee (i.e., the only retained quantity is BOOKING_FEE_CENTS=800). For
          initial_wallet=12000 and total_fee_cents=8424, end-state wallet must equal 11200.
        test_recipe:
          setup:
            - "Park P OPEN, Campground C, Visitor V wallet 12000"
            - "Reservation R STANDARD 2 nights, total 8424; clock set so check-in >= 336h out"
          trigger:
            - "POST .../confirm then POST .../cancel"
          assert:
            - "Final Visitor.wallet_balance_cents == 12000 - 800 == 11200"
            - "Sum over LedgerEntry.amount_cents for V == -800 (one FEE_CHARGE of -8424 and one FEE_REFUND of +7624)"

      - name: backcountry_zone_quota_invariant_after_cancel
        grounds:
          - state_machines.BackcountryPermit.CONFIRMED_to_CANCELLED
          - calculations.backcountry_overlap
          - entities.BackcountryZone.fields.nightly_quota_people
        distinguishing_aspect: |
          DIFFERENT conserved quantity: per-night people-count usage on BackcountryZone.
          Forward action confirm increments zone_usage[night] += party_size for each overnight
          night; compensating action cancel decrements by the same. Invariant: after the pair
          and any number of other CONFIRMED permits in between, the running per-night sum at
          the cancelled permit's nights MUST equal the sum without the cancelled permit ever
          having existed. This is a different quantity (integer per-night usage on Zone) from
          the wallet invariant (cents on Visitor).
        test_recipe:
          setup:
            - "Park P OPEN, BackcountryZone Z with nightly_quota_people=20, per_party_fee=1500"
            - "Visitor V1 wallet 5000"
            - "Permit A by V1: 2026-06-01 14:00 -> 2026-06-03 10:00 (2 overnight nights), party_size=5, CONFIRMED"
            - "Snapshot per-night usage on Z for night 2026-06-01: U1=5 and for 2026-06-02: U2=5"
          trigger:
            - "POST /backcountry-zones/{Z}/permits/{A}/cancel"
          assert:
            - "A.status == CANCELLED"
            - "Per-night usage on Z for 2026-06-01 == U1 - 5 == 0 (compensated exactly)"
            - "Per-night usage on Z for 2026-06-02 == U2 - 5 == 0"
            - "Subsequent permit B by V2 of party_size=20 on 2026-06-01 succeeds (full quota restored)"
