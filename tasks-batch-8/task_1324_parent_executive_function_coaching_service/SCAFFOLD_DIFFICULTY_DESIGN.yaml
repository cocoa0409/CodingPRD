  - rule_id: non_linear_state_machine
    instances:
      - name: intake_revision_cycle
        grounds:
          - state_machines.IntakeAssessment.NEEDS_REVISION_to_DRAFT
          - state_machines.IntakeAssessment.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on IntakeAssessment: the UNDER_REVIEW ->
          NEEDS_REVISION -> DRAFT -> SUBMITTED -> UNDER_REVIEW -> APPROVED loop
          closes a true cycle (A->B->A); a linear pipeline could never revisit
          DRAFT after SUBMITTED.
        test_recipe:
          setup:
            - "Family with one client; CERTIFIED coach; intake in DRAFT"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam IC", primary_email: "ic@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid I", date_of_birth: "2013-06-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id" } }
            - { call: "POST /api/coaches", payload: { full_name: "Coach I", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "v1", baseline_score: 40 }, as: FamilyMember, as_user_id: "${fam_id}", captures: { in_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { st1: "$.data.status" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}", captures: { st2: "$.data.status" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "NEEDS_REVISION", review_notes: "expand goals" }, as: Coach, as_user_id: "${co_id}", captures: { st3: "$.data.status" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "DRAFT" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { st4: "$.data.status" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}", captures: { st5: "$.data.status" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}", captures: { st6: "$.data.status" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}", captures: { st7: "$.data.status" } }
          assert:
            - "st1 == SUBMITTED"
            - "st2 == UNDER_REVIEW"
            - "st3 == NEEDS_REVISION"
            - "st4 == DRAFT (cycle closed: DRAFT revisited after SUBMITTED)"
            - "st5 == SUBMITTED"
            - "st6 == UNDER_REVIEW"
            - "st7 == APPROVED"

      - name: session_parallel_dimensions
        grounds:
          - state_machines.Session.SCHEDULED_to_COMPLETED
          - state_machines.Session.SCHEDULED_to_CANCELLED_EARLY
          - state_machines.Session.SCHEDULED_to_NO_SHOW
          - entities.Session.fields.attendance_state
          - entities.Session.fields.billing_state
        distinguishing_aspect: |
          Parallel state dimensions on Session (different entity than
          IntakeAssessment): three sessions exit SCHEDULED via different
          transitions and land in independent (attendance x billing) pairings
          COMPLETEDxCONSUMED, CANCELLED_EARLYxRETURNED, NO_SHOWxFORFEITED, with
          package counters consumed 1 / forfeited 1 / remaining 6.
        test_recipe:
          setup:
            - "ACTIVE WEEKLY plan; 8-credit INDIVIDUAL package (price 120000+2500=122500, per_credit round_half_up(122500/8)=15313)"
            - "Sessions s1 2026-08-03, s2 2026-08-08, s3 2026-08-13 (all 15:00-16:00Z, gaps 5 days)"
          setup_api_calls:
            - { call: "POST /api/families", payload: { account_name: "Fam PD", primary_email: "pd@x.com" }, as: PracticeAdmin, captures: { fam_id: "$.data.id" } }
            - { call: "POST /api/families/${fam_id}/clients", payload: { full_name: "Kid D", date_of_birth: "2014-07-01", track: "INDIVIDUAL" }, as: PracticeAdmin, captures: { cl_id: "$.data.id", cl_v: "$.data.version" } }
            - { call: "POST /api/families/${fam_id}/transition", payload: { to_state: "ACTIVE" }, as: PracticeAdmin }
            - { call: "POST /api/coaches", payload: { full_name: "Coach D", credential_level: "CERTIFIED" }, as: PracticeAdmin, captures: { co_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/intakes", payload: { presenting_concerns: "org", baseline_score: 62 }, as: PracticeAdmin, captures: { in_id: "$.data.id" } }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "SUBMITTED" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "UNDER_REVIEW" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/intakes/${in_id}/transition", payload: { to_state: "APPROVED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/families/${fam_id}/packages", payload: { track: "INDIVIDUAL", credits_total: 8 }, as: PracticeAdmin, captures: { pk_id: "$.data.id" } }
            - { call: "POST /api/clients/${cl_id}/plans", payload: { coach_id: "${co_id}", intake_id: "${in_id}", cadence: "WEEKLY", expected_client_version: "${cl_v}" }, as: Coach, as_user_id: "${co_id}", captures: { pl_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/goals", payload: { title: "G", target_date: "2026-09-01" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "PROPOSED" }, as: Coach, as_user_id: "${co_id}" }
            - { call: "POST /api/plans/${pl_id}/transition", payload: { to_state: "ACTIVE" }, as: FamilyMember, as_user_id: "${fam_id}" }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-03T15:00:00Z", scheduled_end: "2026-08-03T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-08T15:00:00Z", scheduled_end: "2026-08-08T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s2_id: "$.data.id" } }
            - { call: "POST /api/plans/${pl_id}/sessions", payload: { package_id: "${pk_id}", scheduled_start: "2026-08-13T15:00:00Z", scheduled_end: "2026-08-13T16:00:00Z" }, as: Coach, as_user_id: "${co_id}", captures: { s3_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T15:30:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s1_id}/complete", payload: {}, as: Coach, as_user_id: "${co_id}", captures: { s1_att: "$.data.attendance_state", s1_bill: "$.data.billing_state" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s2_id}/cancel", payload: {}, as: FamilyMember, as_user_id: "${fam_id}", captures: { s2_att: "$.data.attendance_state", s2_bill: "$.data.billing_state", s2_fee: "$.data.cancellation_fee_cents" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T16:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /api/sessions/${s3_id}/mark-no-show", payload: {}, as: Coach, as_user_id: "${co_id}", captures: { s3_att: "$.data.attendance_state", s3_bill: "$.data.billing_state", s3_fee: "$.data.cancellation_fee_cents" } }
            - { call: "GET /api/packages/${pk_id}", as: PracticeAdmin, captures: { pk_consumed: "$.data.credits_consumed", pk_forfeited: "$.data.credits_forfeited", pk_remaining: "$.data.credits_remaining", pk_reserved: "$.data.reserved_count" } }
          assert:
            - "s1_att == COMPLETED and s1_bill == CONSUMED"
            - "s2_att == CANCELLED_EARLY and s2_bill == RETURNED and s2_fee == 0"
            - "s3_att == NO_SHOW and s3_bill == FORFEITED and s3_fee == 15313"
            - "pk_consumed == 1"
            - "pk_forfeited == 1"
            - "pk_remaining == 6"
            - "pk_reserved == 0"

  - rule_id: transitive_cascade
    instances:
      - name: no_show_exhaustion_posture_cascade
        grounds:
          - state_machines.Session.SCHEDULED_to_NO_SHOW
          - state_machines.Package.ACTIVE_to_EXHAUSTED
          - entities.CoachingPlan.fields.posture
          - calculations.delinquency_evaluation
        distinguishing_aspect: |
          Depth-3 cascade from the mark-no-show trigger: Session billing ->
          FORFEITED mutates Package counters (link 1); credits_remaining hitting
          0 flips Package ACTIVE -> EXHAUSTED (link 2, caused by link 1); the
          package flip recomputes CoachingPlan.posture -> SCHEDULING_BLOCKED
          (link 3, caused by link 2); a second chain from the same trigger runs
          the 100% fee charge into the Family ledger, flipping the Family
          ACTIVE -> SUSPENDED (link 2'), which also blocks scheduling
          (link 3').
        test_recipe:
          setup:
            - "ACTIVE WEEKLY plan; 1-credit INDIVIDUAL package (price 17500, per_credit 17500); session s1 at 2026-08-03T15:00:00Z reserved the only credit"
