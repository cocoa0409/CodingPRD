            - "${susp_after} == 1, ${active_after} == 1 and ${posture_after} == CRITICAL — a driver is counted as suspended once, not once per action, so two ISSUED suspensions do not double-count"
            - "GET /disciplinary-actions?driver_id=${d_id} returns exactly 2 rows, both ISSUED with retraining_status PENDING, and their windows are [2026-08-02, 2026-08-09) and [2026-08-10, 2026-08-17)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: rescind_settlement_restores_claim_ledger_and_layer_capacity
        grounds:
          - invariants.claim_exposure_conserved
          - state_machines.Demand.SETTLED_to_OFFER_OUTSTANDING
          - state_machines.SubrogationDemand.READY_TO_PURSUE_to_DRAFT
          - calculations.settlement_layer_waterfall
          - entities.Claim.fields.claim_exposure_cents
          - entities.Claim.fields.layer_allocations
          - entities.Demand.fields.rescission_count
        distinguishing_aspect: |
          Conserved quantity: the MONETARY ledger
          Claim.claim_exposure_cents (outstanding + indemnity_paid + alae_paid +
          reserve_released), which must read 20,000,000 identically before the
          settlement, after it and after the rescission, while its four
          components and the policy-layer allocations move and then move back —
          a cents-denominated conservation law, unlike the safety-scoring and
          headcount quantity conserved by the appeal instance.
        setup_note: "A DEMAND_BASED reserve revision precedes the settlement so the priority-72 reserve check cannot fire; the rescission happens at the same logical instant as the settlement, well inside the 168-hour window."
        test_recipe:
          setup:
            - "Terminal QCY01 and one Driver hired 2011-09-19 (tenure_band OVER_36_MONTHS, so no tenure loading)."
            - "A MODERATE crash on 2026-07-28T08:00:00Z with third_party_at_fault true, no injuries, no hazmat, and NO evidence items, so evidence_posture is PARTIAL and preventability_status is UNDER_REVIEW."
            - "A 2026 tower: layer_index 1 SIR attachment 0 limit 10,000,000; layer_index 2 PRIMARY attachment 10,000,000 limit 5,000,000; total capacity 15,000,000."
            - "A Claim with litigation_risk_score 10 (UNDER_REVIEW) + 5 (PARTIAL) = 15, so litigation_risk_multiplier 1.00 and counsel_required false; no counsel is assigned, so no expense loading enters the reserve."
            - "One THIRD_PARTY_PROPERTY Demand of 20,000,000 (property damage, so the bodily-injury counsel gate on offers does not apply), a DEMAND_BASED reserve revision setting outstanding_reserve_cents to 20,000,000 * 1.00 = 20,000,000, and one standing offer of 12,000,000."
            - "One SubrogationDemand in DRAFT against the at-fault third party with at_fault_percentage 35."
            - "Clock at 2026-08-01T00:00:00Z and never moved."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Quincy Terminal", terminal_code: "QCY01", region_code: "OH", annual_miles_millions: 4.0 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1801", full_name: "Gareth Ollivant", cdl_number: "OH-CDL-1801", hire_date: "2011-09-19" }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { d_id: $.data.id }
            - call: "POST /policy-layers"
              payload: { program_year: 2026, layer_index: 1, layer_type: "SIR", attachment_point_cents: 0, limit_cents: 10000000, insurer_name: "Self-Insured Retention" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { pl_sir_id: $.data.id }
            - call: "POST /policy-layers"
              payload: { program_year: 2026, layer_index: 2, layer_type: "PRIMARY", attachment_point_cents: 10000000, limit_cents: 5000000, insurer_name: "Continental Freight Casualty" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { pl_pri_id: $.data.id }
            - call: "POST /crashes"
              payload: { driver_id: "${d_id}", terminal_id: "${t_id}", occurred_at: "2026-07-28T08:00:00Z", notified_at: "2026-07-28T08:30:00Z", location_text: "SR-3 at Bethel Rd", severity: "MODERATE", route_class: "REGIONAL", tow_away: false, tow_reason: "NONE", injury_transported_count: 0, fatality_count: 0, hazmat_release: false, mechanical_factor: false, third_party_at_fault: true }
              as: Dispatcher
              as_user_id: "disp-001"
              captures: { c_id: $.data.id }
            - call: "POST /claims"
              payload: { crash_id: "${c_id}", claimant_notice_date: "2026-07-29", adjuster_note: "third-party property damage, other unit ran the stop sign" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_id: $.data.id, risk_score: $.data.litigation_risk_score, mult: $.data.litigation_risk_multiplier, counsel_req: $.data.counsel_required }
            - call: "POST /claims/${cl_id}/demands"
              payload: { claimant_name: "Adams County Grain Co", claimant_type: "THIRD_PARTY_PROPERTY", demand_amount_cents: 20000000, represented_by_counsel: false, demand_received_at: "2026-07-30T12:00:00Z" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { dm_id: $.data.id }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { cl_v2: $.data.version }
            - call: "POST /claims/${cl_id}/reserve-revisions"
              payload: { expected_claim_version: "${cl_v2}", basis: "DEMAND_BASED", revision_note: "reserving to the demand before any payment" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { out_setup: $.data.outstanding_reserve_cents }
            - call: "POST /demands/${dm_id}/offers"
              payload: { carrier_offer_cents: 12000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { nr_id: $.data.id }
            - call: "POST /claims/${cl_id}/subrogation-demands"
              payload: { third_party_name: "Bracken Hauling LLC", at_fault_percentage: 35, basis_note: "third party failed to yield at a posted stop" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { sub_id: $.data.id, sub_status_setup: $.data.status, sub_base_setup: $.data.recoverable_base_cents }
          trigger:
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { exp_before: $.data.claim_exposure_cents, out_before: $.data.outstanding_reserve_cents, ind_before: $.data.indemnity_paid_cents, alae_before: $.data.alae_paid_cents, inc_before: $.data.total_incurred_cents }
            - call: "POST /demands/${dm_id}/settle"
              payload: { settlement_reference: "SET-2026-QCY-0001" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { st_status: $.data.status, st_amt: $.data.settled_amount_cents, st_alae: $.data.alae_cents, st_total: $.data.settlement_total_cents, st_at: $.data.settled_at }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { exp_mid: $.data.claim_exposure_cents, out_mid: $.data.outstanding_reserve_cents, ind_mid: $.data.indemnity_paid_cents, alae_mid: $.data.alae_paid_cents, sir_mid: $.data.sir_eroded_cents, ins_mid: $.data.insured_paid_cents, alloc_mid: $.data.layer_allocations, inc_mid: $.data.total_incurred_cents }
            - call: "GET /subrogation-demands/${sub_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { sub_status_mid: $.data.status, sub_base_mid: $.data.recoverable_base_cents, sub_max_mid: $.data.max_recoverable_cents }
            - call: "POST /demands/${dm_id}/rescind-settlement"
              payload: { rescission_reason: "release agreement was executed by an unauthorised representative" }
              as: ClaimsManager
              as_user_id: "cmgr-001"
              captures: { rs_status: $.data.status, rs_amt: $.data.settled_amount_cents, rs_alae: $.data.alae_cents, rs_total: $.data.settlement_total_cents, rs_at: $.data.settled_at, rs_ref: $.data.settlement_reference, rs_count: $.data.rescission_count }
            - call: "GET /claims/${cl_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { exp_after: $.data.claim_exposure_cents, out_after: $.data.outstanding_reserve_cents, ind_after: $.data.indemnity_paid_cents, alae_after: $.data.alae_paid_cents, sir_after: $.data.sir_eroded_cents, ins_after: $.data.insured_paid_cents, alloc_after: $.data.layer_allocations, inc_after: $.data.total_incurred_cents, hs_after: $.data.handling_status, rsv_after: $.data.reserve_status }
            - call: "GET /demands/${dm_id}/negotiation-rounds"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { rounds_after: $.data }
            - call: "GET /subrogation-demands/${sub_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { sub_status_after: $.data.status, sub_base_after: $.data.recoverable_base_cents, sub_max_after: $.data.max_recoverable_cents }
          assert:
            - "${risk_score} == 15, ${mult} == 1.00 and ${counsel_req} == false, so ${out_setup} == 20000000 — the DEMAND_BASED reserve is the raw demand with no multiplier or expense loading"
            - "${sub_status_setup} == DRAFT and ${sub_base_setup} == null — nothing is paid yet"
            - "${exp_before} == 20000000 with ${out_before} == 20000000, ${ind_before} == 0, ${alae_before} == 0, ${inc_before} == 20000000"
            - "${st_status} == SETTLED, ${st_amt} == 12000000, ${st_alae} == 1440000 (round_half_up(12,000,000 * 0.12), the 5,000,000-24,999,999 tier), ${st_total} == 13440000, ${st_at} == 2026-08-01T00:00:00Z"
            - "${exp_mid} == 20000000 — UNCHANGED across the settlement, while its components moved: ${out_mid} == 6560000, ${ind_mid} == 12000000, ${alae_mid} == 1440000"
            - "${inc_mid} == 20000000 — 12,000,000 + 1,440,000 + 6,560,000 - 0"
            - "${alloc_mid} == [{ policy_layer_id: ${pl_sir_id}, layer_index: 1, layer_type: SIR, allocated_cents: 10000000 }, { policy_layer_id: ${pl_pri_id}, layer_index: 2, layer_type: PRIMARY, allocated_cents: 3440000 }] with ${sir_mid} == 10000000 and ${ins_mid} == 3440000 — the SIR fills to its limit before the primary takes the remaining 3,440,000"
            - "${sub_status_mid} == READY_TO_PURSUE, ${sub_base_mid} == 13440000 (indemnity_paid + alae_paid frozen at that instant) and ${sub_max_mid} == 4704000 (round_half_up(13,440,000 * 35 / 100))"
            - "${rs_status} == OFFER_OUTSTANDING with ${rs_amt}, ${rs_alae}, ${rs_total}, ${rs_at} and ${rs_ref} all null, and ${rs_count} == 1"
            - "${exp_after} == 20000000 — the SAME value read before and after, which is the conservation claim"
            - "${out_after} == 20000000, ${ind_after} == 0, ${alae_after} == 0, ${sir_after} == 0, ${ins_after} == 0 and ${alloc_after} is an empty array — every component returned to its pre-settlement value with no residue"
            - "${inc_after} == 20000000 and Claim.${cl_id}.reserve_released_cents == 0"
            - "${hs_after} == NEGOTIATION and ${rsv_after} == REVISED — the claim fell back to the negotiating state and kept its revised reserve maturity"
            - "${rounds_after} contains exactly 1 row, round_index 1, carrier_offer_cents 12000000, outcome OPEN — the accepted round is standing again rather than being deleted or duplicated"
            - "${sub_status_after} == DRAFT with ${sub_base_after} == null and ${sub_max_after} == null — the subrogation demand un-froze because there is no longer a paid loss to pursue"
            - "The policy layers themselves are untouched: GET /policy-layers still reports limit_cents 10000000 and 5000000, so a fresh settlement of up to 15,000,000 is possible again"

      - name: appeal_grant_restores_driver_points_and_terminal_counters
        grounds:
          - invariants.driver_points_and_terminal_headcount_conserved
          - state_machines.Crash.PREVENTABLE_to_UNDER_REVIEW
          - state_machines.Driver.SUSPENDED_PENDING_ACTION_to_ACTIVE
          - state_machines.DisciplinaryAction.ISSUED_to_VOIDED
          - calculations.driver_preventable_points
          - calculations.terminal_crash_rate
          - calculations.terminal_staffing_posture
        distinguishing_aspect: |
          Conserved quantity: the SAFETY-SCORING and HEADCOUNT bundle
          (Driver.preventable_points, the pair active_driver_count /
          suspended_driver_count, and Terminal.preventable_crash_count), which
          must return to its pre-decision values of 2.0 points, 1 active / 0
          suspended and 1 preventable crash — a non-monetary conservation law
          whose correct restore point is a NON-ZERO prior baseline, not the empty
          state, in contrast to the cents ledger conserved by the rescission
          instance.
        setup_note: "The driver already carries one older preventable crash, so a compensation that merely zeroes the counters is visibly wrong."
        test_recipe:
          setup:
            - "Terminal RVN01 with annual_miles_millions 0.6666 and exactly one Driver hired 2011-09-19."
            - "PRIOR crash P: MINOR, occurred 2026-06-15T11:00:00Z, mechanical_factor false, with only its required TELEMATICS_SNAPSHOT evidence PRESERVED, so evidence_posture is COMPLETE. Its ReviewCase is DECIDED with three unanimous PREVENTABLE ballots of (3,3,3,3,3): the vehicle criterion is renormalised away, so each member scores (3*0.30 + 3*0.25 + 3*0.20 + 3*0.10)/0.85 = 3.00 and committee_score is 3.00. Crash P is PREVENTABLE."
            - "So the baseline is Driver.preventable_points 2.0 (MINOR 2 at decay 1.0), required_action_tier COACHING, Terminal.preventable_crash_count 1, crash_rate_per_million_miles round_half_up(1/0.6666, 3) = 1.500, risk_tier ELEVATED, active_driver_count 1, suspended_driver_count 0, staffing_posture OK."
            - "NEW crash N: SEVERE, occurred 2026-07-30T04:00:00Z, mechanical_factor true, all three required evidence kinds PRESERVED so evidence_posture is COMPLETE. Its ReviewCase is in DELIBERATION with three unanimous PREVENTABLE ballots of (3,4,3,4,3) -> 3.45 each, cast by cm-001, cm-002 and cm-003."
            - "No DisciplinaryAction exists yet for either crash. Clock at 2026-08-01T00:00:00Z and never moved, so no decay or analytics-window boundary is crossed during the test."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Ravenna Terminal", terminal_code: "RVN01", region_code: "OH", annual_miles_millions: 0.6666 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-1901", full_name: "Hollis Barnaby", cdl_number: "OH-CDL-1901", hire_date: "2011-09-19" }
              as: SafetyAdmin
              as_user_id: "sa-001"
