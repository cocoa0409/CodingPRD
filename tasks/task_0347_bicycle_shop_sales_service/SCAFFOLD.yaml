    input: ["full_name", "email"]
    output: Customer
    side_effects: []
  - method: GET
    path: "/shop/customers/{id}"
    description: "Read a customer, including computed store_credit_cents and open_recall_count."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: ["run calc customer_open_recall_count for the response"]
  - method: GET
    path: "/shop/customers"
    description: "List customers (paginated)."
    roles: [SalesAssociate, ServiceAdvisor, ShopManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ---- Sku ----
  - method: POST
    path: "/shop/skus"
