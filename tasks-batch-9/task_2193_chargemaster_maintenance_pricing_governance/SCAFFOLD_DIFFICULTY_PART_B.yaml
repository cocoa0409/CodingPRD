      - name: transitive_cascade__price_rule_supersession_stales_five_items_restricts_facility
        grounds:
          - state_machines.ChargeItem.PRICED_CURRENT_to_PRICE_STALE
          - state_machines.Facility.chargemaster_posture
          - entities.PriceRule.fields.superseded_by_rule_id
          - entities.PriceRule.fields.status
          - entities.PriceRule.fields.applied_item_count
          - entities.Facility.fields.stale_price_item_count
          - entities.ChargeItem.fields.applied_price_rule_id
          - calculations.gross_charge_from_price_rule
          - validations[priority=15]
          - errors.ERR_FACILITY_RESTRICTED
        distinguishing_aspect: |
          This cascade originates from a completely different triggering transition than the
          implement cascade — PriceRule ACTIVE -> SUPERSEDED raised by POST /chargemaster/price-rules
          carrying supersede_rule_id — and each hop is caused by the one before it: the rule's
          supersession is what drives all five ChargeItems PRICED_CURRENT -> PRICE_STALE (hop 1);
          those price_status changes are what push Facility.stale_price_item_count to exactly 5
          (hop 2); that count crossing the >= 5 boundary is what derives
          Facility.chargemaster_posture = RESTRICTED (hop 3), which then rejects a new CPT item with
          ERR_FACILITY_RESTRICTED.
