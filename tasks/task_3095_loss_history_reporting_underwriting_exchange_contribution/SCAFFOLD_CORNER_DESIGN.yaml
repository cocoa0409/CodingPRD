      - name: under_dispute_claims_are_excluded_from_new_reports
        claim_type: Input Set Filtering
        grounds:
          - calculations.report_inclusion_set
          - state_machines.LossClaim.ACTIVE_to_UNDER_DISPUTE
        distinguishing_aspect: "The inclusion set filters on claim status ACTIVE: a claim that flips to UNDER_DISPUTE between two inquiries drops out of the second report while remaining stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B2 ACTIVE; consumer Fay2 with 2 claims; report R1 issued (count 2); dispute filed on the newer claim."
