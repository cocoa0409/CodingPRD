            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-PD-A", planned_length_ft: 2000, line_code: "EXT-3", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_a: $.data.id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", order_id: "${ord_id}", lot_code: "LOT-PD-B", planned_length_ft: 2000, line_code: "EXT-4", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v2}" }
              as: ProcessEngineer
              captures: { lot_b: $.data.id }
            - call: "POST /production-lots/${lot_a}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 160.0, measured_max_wall_mils: 175.0, measured_avg_od_mm: 21.60 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_a}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_a}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 35.0, breakdown_detected: false, duration_sec: 900 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "STRANDING" }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/process-steps"
              payload: { step: "EXTRUSION", measured_min_wall_mils: 160.0, measured_max_wall_mils: 175.0, measured_avg_od_mm: 21.60 }
              as: ProcessEngineer
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "SPARK", faults_detected: 0, duration_sec: 60 }
              as: QualityEngineer
              as_user_id: "qe-001"
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "HIPOT", test_voltage_kv: 35.0, breakdown_detected: false, duration_sec: 900 }
              as: QualityEngineer
              as_user_id: "qe-001"
          trigger:
            - call: "POST /production-lots/${lot_a}/tests"
              payload: { test_type: "PARTIAL_DISCHARGE", pd_level_pc: 5.0, duration_sec: 600 }
              as: QualityEngineer
              as_user_id: "qe-001"
              captures: { pd_at_limit: $.data.result }
            - call: "POST /production-lots/${lot_b}/tests"
              payload: { test_type: "PARTIAL_DISCHARGE", pd_level_pc: 5.1, duration_sec: 600 }
              as: QualityEngineer
              as_user_id: "qe-001"
              captures: { pd_over_limit: $.data.result }
          assert:
            - "at the limit: the CableTest created for ${lot_a} has result == PASS because 5.0 <= 5.0"
            - "at the limit: ProductionLot.${lot_a}.process_state == TESTED and quality_state == PENDING - the PD row does not move the process dimension (the inline pair had already promoted the lot), it decides whether the lot can be RELEASED at all"
            - "one tick over: the CableTest created for ${lot_b} has result == FAIL because 5.1 > 5.0"
            - "one tick over: ProductionLot.${lot_b}.quality_state == NONCONFORMING while process_state stays TESTED - the failing off-line result poisons the quality dimension without rewinding the process dimension"
            - "below the limit is unremarkable: a PARTIAL_DISCHARGE test at 4.9 pC on an equivalent lot also yields PASS, so the discriminating reading is exactly 5.0"
            - "the limit is voltage-class keyed, not global: PD_LIMIT_PC[MV_35KV] is 3.0, so 5.0 pC on an MV_35KV SKU would be FAIL"

