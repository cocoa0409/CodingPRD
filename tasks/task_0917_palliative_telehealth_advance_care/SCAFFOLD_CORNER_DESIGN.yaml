  # =========================================================================
  # Cross-cutting complexity layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_patient_version_rejects_the_second_document_execution
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[document-execute-stale-patient]
          - errors[ERR_STALE_PATIENT_VERSION]
        distinguishing_aspect: "Executing document one advances Patient.version, so a second execute still carrying the version read before that write is rejected with ERR_STALE_PATIENT_VERSION and HTTP 412, and re-reading the patient makes the identical call succeed."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with jurisdiction_code JUR_TWO_WITNESS."
            - "Two LIVING_WILL AdvanceCareDocument rows, each with two witness signatures and status PENDING_EXECUTION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2049", full_name: "Yara Cohen", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "DNR" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc1_id: $.data.id }
            - call: "POST /palliative/advance-care-documents/${doc1_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents/${doc1_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_2" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents"
              payload: { patient_id: "${p_id}", document_type: "LIVING_WILL", stated_code_status: "DNR_DNI", supersedes_document_id: "${doc1_id}" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { doc2_id: $.data.id }
            - call: "POST /palliative/advance-care-documents/${doc2_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_1" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/advance-care-documents/${doc2_id}/signatures"
              payload: { signature_type: "WITNESS", signer_user_id: "u_witness_2" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "GET /palliative/patients/${p_id}"
              payload: {}
              as: ProgramAdmin
              captures: { p_v_before: $.data.version }
          trigger:
            - call: "POST /palliative/advance-care-documents/${doc1_id}/execute"
              payload: { expected_patient_version: "${p_v_before}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/advance-care-documents/${doc2_id}/execute"
              payload: { expected_patient_version: "${p_v_before}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { err: $.data.error_id }
            - call: "GET /palliative/patients/${p_id}"
              payload: {}
              as: ProgramAdmin
              captures: { p_v_after: $.data.version }
            - call: "POST /palliative/advance-care-documents/${doc2_id}/execute"
              payload: { expected_patient_version: "${p_v_after}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
          assert:
            - "AdvanceCareDocument.${doc1_id}.status == SUPERSEDED"
            - "${err} == ERR_STALE_PATIENT_VERSION"
            - "HTTP status of the stale execute == 412"
            - "AdvanceCareDocument.${doc2_id}.status == EXECUTED"
            - "Patient.${p_id}.code_status == FULL_CODE"

      - name: occ_stale_care_plan_version_rejects_the_second_revision
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[care-plan-revision-stale-plan]
          - errors[ERR_STALE_CARE_PLAN_VERSION]
        distinguishing_aspect: "The accepted revision advances CarePlan.version, so a second revision still carrying the pre-revision version is rejected with ERR_STALE_CARE_PLAN_VERSION and the plan's problem_list is left as the first revision wrote it."
        test_recipe:
          setup:
            - "One Patient in program_status ACTIVE with one ACTIVE CarePlan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2050", full_name: "Zeb Karlsen", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/care-plans"
              payload: { patient_id: "${p_id}", plan_title: "Plan", problem_list: ["pain"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_id: $.data.id }
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { cp_v: $.data.version }
          trigger:
            - call: "POST /palliative/care-plans/${cp_id}/revisions"
              payload: { expected_care_plan_version: "${cp_v}", revised_problem_list: ["pain", "dyspnea"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans/${cp_id}/activate"
              payload: {}
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/care-plans/${cp_id}/revisions"
              payload: { expected_care_plan_version: "${cp_v}", revised_problem_list: ["nausea"] }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_CARE_PLAN_VERSION"
            - "HTTP status == 412"
            - "CarePlan.${cp_id}.status == ACTIVE"
            - "CarePlan.${cp_id}.revision_number == 1"
            - "CarePlan.${cp_id}.problem_list has length 2"

      - name: occ_stale_election_version_rejects_the_second_benefit_period
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hospice-period-stale-election]
          - errors[ERR_STALE_ELECTION_VERSION]
        distinguishing_aspect: "Opening benefit period 1 advances HospiceElection.version, so the period-2 call still carrying the pre-period version is rejected with ERR_STALE_ELECTION_VERSION at rung 8, before the cadence and face-to-face rungs are ever consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-02T09:00:00Z."
            - "One Patient in program_status ACTIVE with an ATTESTED IDT CareConference."
            - "One HospiceElection in status CERTIFIED with certification_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/patients"
              payload: { mrn: "MRN-2051", full_name: "Ada Villanueva", date_of_birth: "1950-01-01", jurisdiction_code: "JUR_TWO_WITNESS", attending_clinician_user_id: "u_attending_1", opioid_status: "OPIOID_TOLERANT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { p_id: $.data.id }
            - call: "POST /palliative/referrals"
              payload: { patient_id: "${p_id}", source: "HOSPITAL_DISCHARGE", prognosis_months: 6, serious_illness_criteria_count: 3 }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
              captures: { ref_id: $.data.id }
            - call: "POST /palliative/referrals/${ref_id}/decision"
              payload: { decision: "ACCEPT" }
              as: IntakeCoordinator
              as_user_id: "u_intake_1"
            - call: "POST /palliative/conferences"
              payload: { patient_id: "${p_id}", conference_type: "IDT", modality: "TELEHEALTH", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T10:00:00Z" }
              as: SocialWorker
              as_user_id: "u_sw_1"
              captures: { conf_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /palliative/conferences/${conf_id}/hold"
              payload: { documented_minutes: 46, disciplines_present: ["PHYSICIAN", "NURSE", "SOCIAL_WORKER", "CHAPLAIN"] }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "PHYSICIAN", note_text: "prognosis reviewed" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "NURSE", note_text: "symptoms reviewed" }
              as: PalliativeNurse
              as_user_id: "u_nurse_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "SOCIAL_WORKER", note_text: "supports reviewed" }
              as: SocialWorker
              as_user_id: "u_sw_1"
            - call: "POST /palliative/conferences/${conf_id}/attestations"
              payload: { discipline: "CHAPLAIN", note_text: "spiritual care reviewed" }
              as: Chaplain
              as_user_id: "u_chaplain_1"
            - call: "POST /palliative/hospice-elections"
              payload: { patient_id: "${p_id}" }
              as: PalliativePhysician
              as_user_id: "u_physician_1"
              captures: { he_id: $.data.id }
            - call: "POST /palliative/hospice-elections/${he_id}/certifications"
