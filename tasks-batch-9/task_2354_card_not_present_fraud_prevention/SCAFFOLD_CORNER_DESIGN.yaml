      - name: auto_assign_prefers_most_headroom_then_cheapest_seniority
        claim_type: topological
        grounds:
          - calculations.review_queue_selector
          - endpoints[POST /fraud/review-cases/{id}/auto-assign]
        distinguishing_aspect: "The selector's filter runs before its order, and key 1 (remaining headroom DESC) outranks key 2 (seniority ASC): the JUNIOR with headroom 5 is filtered out on skill, the JUNIOR with headroom 2 loses to a SENIOR with headroom 3, and the LEAD tied at headroom 3 loses on the seniority tiebreak."
        test_recipe:
          setup:
            - "BOOT-W plus assessment A2 (p 0.5417 -> blended 50.00) scored to REVIEW, creating case C1 in QUEUED with primary_signal_family BEHAVIORAL."
            - "Four analysts: AN_A JUNIOR [BEHAVIORAL] capacity 2 (headroom 2); AN_B SENIOR [BEHAVIORAL] capacity 3 (headroom 3); AN_C JUNIOR [DEVICE] capacity 5 (headroom 5 but wrong family); AN_D LEAD [BEHAVIORAL] capacity 3 (headroom 3)."
