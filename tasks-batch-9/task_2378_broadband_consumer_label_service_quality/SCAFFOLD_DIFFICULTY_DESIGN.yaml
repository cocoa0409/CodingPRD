            - call: "POST /service-plans"
              payload: { plan_code: "OFFPEAK300", display_name: "Cable 300", technology: "CABLE", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 5999, early_termination_fee_cents: 0, required_locales: ["en-US"] }
              as: ComplianceOfficer
