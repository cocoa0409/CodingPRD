    roles: [Any]
    code: 200
    input: ["status?"]
    output: "ProtocolMilestone[]"
    side_effects: []

  # --- Protocol milestones -----------------------------------------------------
  - method: GET
    path: "/programs/milestones/{id}"
    description: "Get a protocol milestone"
    roles: [Any]
    code: 200
    input: []
    output: ProtocolMilestone
    side_effects: []
  - method: POST
    path: "/programs/protocol-milestones/{id}/defer-visit"
    description: "Defer a pending milestone to an affiliate clinic closer to the family's home"
    roles: [AffiliateClinicCoordinator]
    code: 200
    input: [affiliate_clinic_id]
    output: ProtocolMilestone
    side_effects:
      - "status -> DUE"
      - "deferred_from_milestone_id set to the preceding milestone"
      - "affiliate_clinic_id set to the coordinating affiliate"
      - "a referral intent is raised for the affiliate site"
  - method: POST
    path: "/programs/protocol-milestones/{id}/execute"
    description: "Mark a due milestone executed"
    roles: [AffiliateClinicCoordinator]
    code: 200
    input: []
    output: ProtocolMilestone
    side_effects: ["status -> EXECUTED", "executed_at stamped", "the next pending milestone is promoted to DUE"]
  - method: GET
    path: "/programs/protocol-milestones"
    description: "List protocol milestones"
    roles: [Any]
    code: 200
    input: ["enrollment_id?", "affiliate_clinic_id?", "deferred_from_milestone_id?", "status?", "limit?", "offset?"]
    output: "ProtocolMilestone[]"
    side_effects: []

  # --- Survivorship ------------------------------------------------------------
  - method: GET
    path: "/programs/clinical-protocols/{id}/affiliations"
    description: "List affiliation agreements pinning this protocol at affiliate sites"
    roles: [Any]
    code: 200
    input: ["clinic_id?", "status?"]
    output: "AffiliationAgreement[]"
    side_effects: []
  - method: POST
    path: "/programs/clinical-protocols/{id}/studies"
    description: "Create a survivorship follow-up study on a protocol"
    roles: [SurvivorshipCoordinator]
    code: 201
    input: [study_code, follow_up_interval_months, min_years_after_completion]
    output: SurvivorshipStudy
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/programs/survivorship-studies"
    description: "List survivorship studies"
    roles: [Any]
    code: 200
    input: ["protocol_id?", "status?", "limit?", "offset?"]
    output: "SurvivorshipStudy[]"
    side_effects: []
  - method: POST
    path: "/programs/survivorship-studies/{id}/enrollments"
    description: "Enroll a survivor into a follow-up study"
    roles: [SurvivorshipCoordinator]
    code: 201
    input: [enrollment_id, completed_treatment_at]
    output: SurvivorshipEnrollment
    side_effects: ["status = ON_STUDY", "next_due_at computed from completed_treatment_at"]
  - method: GET
    path: "/programs/survivorship-studies/{id}/enrollments"
    description: "List enrollment courses on this study"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "SurvivorshipEnrollment[]"
    side_effects: []
  - method: GET
    path: "/programs/survivorship-enrollments/{id}"
    description: "Get a survivorship enrollment"
    roles: [Any]
    code: 200
    input: []
    output: SurvivorshipEnrollment
    side_effects: []
  - method: POST
    path: "/programs/survivorship-enrollments/{id}/follow-ups"
    description: "Log a follow-up visit, advancing the next-due date by one interval"
    roles: [SurvivorshipCoordinator]
    code: 200
    input: [completed_at]
    output: SurvivorshipFollowUp
    side_effects: ["a visit is logged", "next_due_at advanced by one interval", "status -> GRADUATED when the terminal visit is reached"]
  - method: POST
    path: "/programs/survivorship-enrollments/{id}/withdraw"
    description: "Withdraw a survivor from follow-up"
    roles: [SurvivorshipCoordinator]
    code: 200
    input: [withdrawal_reason]
    output: SurvivorshipEnrollment
    side_effects: ["status -> WITHDRAWN"]
  - method: GET
    path: "/programs/survivorship-enrollments/{id}/follow-ups"
    description: "List follow-up visits for a survivorship enrollment"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "SurvivorshipFollowUp[]"
    side_effects: []

  # --- Family support services -------------------------------------------------
  - method: POST
    path: "/programs/family-support-services"
    description: "Create a family-support service line"
    roles: [PatientSupportOfficer]
    code: 201
    input: [fund_id, service_code, display_name, base_allowance_cents, "is_stimulation_eligible?", "stimulation_rate?", "stimulation_cap_cents?"]
    output: FamilySupportService
    side_effects: ["a FamilyServiceLedger is created with status ACTIVE"]
  - method: GET
    path: "/programs/family-support-services"
    description: "List family-support service lines"
    roles: [Any]
    code: 200
    input: ["fund_id?", "service_code?", "limit?", "offset?"]
    output: "FamilySupportService[]"
    side_effects: []
  - method: GET
    path: "/programs/family-support-services/{id}"
    description: "Get a family-support service line"
    roles: [Any]
    code: 200
    input: []
    output: FamilySupportService
    side_effects: []
  - method: POST
    path: "/programs/family-support-services/{id}/allowances"
    description: "Accrue a family allowance into the service ledger, applying the stimulation markup"
    roles: [PatientSupportOfficer]
    code: 201
    input: [family_count, "ledger_epoch?"]
    output: { allowance_cents: integer, markup_cents: integer, family_service_ledger_id: string, service_ledger_status: string, ledger_accumulated_cents: integer, fund_research_balance_cents: integer }
    side_effects:
      - "the ledger's accumulated_cents updated"
      - "ResearchFund.research_balance_cents += markup when the ledger is ACTIVE and the service is eligible"
      - "ResearchFund.patient_support_balance_cents -= base_allowance_cents * family_count"
  - method: GET
    path: "/programs/family-service-ledgers/{id}"
    description: "Get a family service ledger"
    roles: [Any]
    code: 200
    input: []
    output: FamilyServiceLedger
    side_effects: []
  - method: POST
    path: "/programs/family-service-ledgers/{id}/freeze"
    description: "Freeze a family service ledger, pausing markup accrual"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: FamilyServiceLedger
    side_effects: ["status -> FROZEN", "markup accrual paused"]
  - method: GET
    path: "/programs/family-support-services/{id}/ledgers"
    description: "List service ledgers for a service line"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "FamilyServiceLedger[]"
    side_effects: []

  # --- Sibling services --------------------------------------------------------
  - method: GET
    path: "/programs/sibling-support-services"
    description: "List sibling support services"
    roles: [Any]
    code: 200
    input: ["enrollment_id?", "service_type?", "status?", "limit?", "offset?"]
    output: "SiblingSupportService[]"
    side_effects: []
  - method: GET
    path: "/programs/sibling-support-services/{id}"
    description: "Get a sibling support service"
    roles: [Any]
    code: 200
    input: []
    output: SiblingSupportService
    side_effects: []
  - method: POST
    path: "/programs/sibling-support-services/{id}/sessions"
    description: "Deliver sibling support sessions, honouring the monthly window limit"
    roles: [PatientSupportOfficer]
    code: 200
    input: [session_count]
    output: SiblingSupportService
    side_effects: ["sessions_delivered += session_count", "has_reached_monthly_limit recomputed from sessions_per_window", "no ResearchFund balance moves: sibling services are delivery counters, not allowances"]
    note: "rejected with ERR_SIBLING_SESSION_LIMIT_REACHED once has_reached_monthly_limit is already true"
  - method: POST
    path: "/programs/sibling-support-services/{id}/cancel"
    description: "Cancel a sibling support service"
    roles: [PatientSupportOfficer]
    code: 200
    input: []
    output: SiblingSupportService
    side_effects: ["status -> CANCELLED"]

  # --- Auxiliary index routes --------------------------------------------------
  - method: GET
    path: "/programs/milestones"
    description: "List protocol milestones across enrollments, optionally filtered by affiliate"
    roles: [Any]
    code: 200
    input: ["enrollment_id?", "affiliate_clinic_id?", "deferred_from_milestone_id?", "status?", "limit?", "offset?"]
    output: "ProtocolMilestone[]"
    side_effects: []
  - method: GET
    path: "/programs/survivorship-enrollments"
    description: "List survivorship enrollments across studies"
    roles: [Any]
    code: 200
    input: ["study_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: "SurvivorshipEnrollment[]"
    side_effects: []

  # --- Ops-run checkpoint ------------------------------------------------------
  - method: POST
    path: "/_ops/run-checkpoint"
    description: "Test-driving endpoint: advance the service-ledger epoch, freezing ledgers whose accumulated_cents exceeds their service cap"
    roles: [PlatformAdmin]
    code: 200
    input: [advance_to_epoch]
    output: { ledger_epoch: integer, frozen_ledger_count: integer }
    side_effects:
      - "every FamilyServiceLedger.ledger_epoch set to advance_to_epoch"
      - "ledgers whose accumulated_cents exceeds their service stimulation_cap_cents -> FROZEN"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or unresolvable" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Acting role is not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A resource id in the path or body does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Referral id does not exist" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "ClinicalProtocol id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_HOUSING_ASSIGNMENT_NOT_FOUND, http: 404, condition: "HousingAssignment id does not exist" }
  - { id: ERR_HOUSING_FACILITY_NOT_FOUND, http: 404, condition: "HousingFacility id does not exist" }
  - { id: ERR_PLEDGE_NOT_FOUND, http: 404, condition: "FamilySupportPledge id does not exist" }
  - { id: ERR_TRAVEL_NOT_FOUND, http: 404, condition: "TravelArrangement id does not exist" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "ProtocolMilestone id does not exist" }
  - { id: ERR_STUDY_NOT_FOUND, http: 404, condition: "SurvivorshipStudy id does not exist" }
  - { id: ERR_SURVIVORSHIP_ENROLLMENT_NOT_FOUND, http: 404, condition: "SurvivorshipEnrollment id does not exist" }
  - { id: ERR_CLINIC_NOT_FOUND, http: 404, condition: "AffiliateClinic id does not exist" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "AffiliationAgreement id does not exist" }
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "FamilySupportService id does not exist" }
  - { id: ERR_LEDGER_NOT_FOUND, http: 404, condition: "FamilyServiceLedger id does not exist" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "ResearchFund id does not exist" }
  - { id: ERR_SIBLING_SERVICE_NOT_FOUND, http: 404, condition: "SiblingSupportService id does not exist" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "ProtocolHold id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, or an out-of-range integer" }
  - { id: ERR_DUPLICATE_ENTITY, http: 409, condition: "A declared uniqueness constraint is violated (protocol_code, facility_code, clinic_code, service_code, sibling_alias)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "An expected_*_version OCC field does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "The target resource is not in the state the operation requires" }
  - { id: ERR_PROTOCOL_NOT_OPEN, http: 409, condition: "ClinicalProtocol is not OPEN" }
  - { id: ERR_PROTOCOL_NOT_IN_DRAFT, http: 409, condition: "ClinicalProtocol is not in DRAFT" }
  - { id: ERR_PROTOCOL_NOT_HELD, http: 409, condition: "ClinicalProtocol is not in HELD" }
  - { id: ERR_PROTOCOL_HELD, http: 409, condition: "ClinicalProtocol is frozen by an active hold or review lock" }
  - { id: ERR_PROTOCOL_HOLD_ACTIVE, http: 409, condition: "A ProtocolHold on this protocol is still ACTIVE" }
  - { id: ERR_PROTOCOL_HAS_ENROLLED_PATIENTS, http: 409, condition: "ClinicalProtocol still carries enrolled patients" }
  - { id: ERR_ARM_ASSENT_BLOCKED_BY_HOLD, http: 409, condition: "Assent confirmation and enrollment completion are blocked while the protocol carries a review lock" }
  - { id: ERR_HOLD_NOT_ACTIVE, http: 409, condition: "ProtocolHold is not in ACTIVE status" }
  - { id: ERR_HOLD_NOT_IRB_REVIEW, http: 409, condition: "ProtocolHold hold_reason is not IRB_REVIEW" }
  - { id: ERR_REFERRAL_NOT_SUBMITTED, http: 409, condition: "Referral is not in SUBMITTED status" }
  - { id: ERR_REFERRAL_NOT_ACCEPTED, http: 409, condition: "Referral is not in ACCEPTED status" }
  - { id: ERR_REFERRAL_NOT_DECLINED, http: 409, condition: "Referral is not in DECLINED status" }
  - { id: ERR_DUPLICATE_PATIENT_ELIGIBILITY, http: 409, condition: "Another referral sharing the protected eligibility_alias is already ACCEPTED or ARRIVED" }
