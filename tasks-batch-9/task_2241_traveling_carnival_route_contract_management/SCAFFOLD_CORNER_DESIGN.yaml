              as: LotBoss
              captures: { alloc_c1b: "$.data.id" }
          assert:
            - "Replayed version: HTTP 412 with data.error_id == \"ERR_STALE_ROUTE_STOP_VERSION\""
            - "After the refusal RouteStop.${stop_c1}.version == 2 and allocated_sqft_used == 5414 — unchanged by the failed write"
            - "Retry with the re-read version: HTTP 201, RideAllocation.${alloc_c1b}.footprint_charged_sqft == 1925 (ceil(1750 * 1.10)) and power_charged_amps == 100.0 (KIDDIE surge 0 pct)"
            - "RouteStop.${stop_c1}.allocated_sqft_used == 7339, power_amps_used == 475.0 and version == 3"
            - "GET /route-stops/${stop_c1}/ride-allocations returns total_count == 2"

