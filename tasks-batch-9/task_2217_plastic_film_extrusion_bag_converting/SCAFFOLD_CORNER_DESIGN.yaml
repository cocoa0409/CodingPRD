          - errors[ERR_RECIPE_STATE_INVALID]
        distinguishing_aspect: "The submit action is not idempotent: replaying it on a SUBMITTED recipe must fail rather than silently re-stamp submitted_by_user_id with the second caller."
        test_recipe:
