        excluded_because:
          difficulty_instance: cross_entity_state_dependency / intervention_grant_denied_when_target_application_withdrawn
          rationale: "The named §1.8 instance drives the target application out of COMPLETENESS_REVIEW and asserts this error id on the dependent write."

