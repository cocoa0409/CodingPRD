# =============================================================================
# PRD Benchmark Seed Tables — Coffee Roasting Plant & Green Coffee Contracts
# Task: task_1609_coffee_roasting_plant_green_coffee
# =============================================================================

scenario: |
  Coffee Roasting Plant & Green Coffee Contracts (commercial coffee roaster):
  green contract (differential/fixed) & shipment schedule, warehouse position &
  inventory financing, roast profile by product & batch yield loss, blend recipe
  & lot substitution rules, freshness dating & distribution channel,
  private-label & subscription fulfillment, quality cupping & rejection,
  price-to-be-fixed & futures hedging.

domain_name: coffee-roasting-plant
api_prefix: /roastery

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite green-lot mass competed for by contracts, batches, recipes, and financing reserve
  secondary_archetype: ledger_reconciliation # PTBF contracts + futures hedge + dual cost-basis (provisional vs final settlement)
  complexity_layers:
    - dual_variant_calculation               # provisional vs final contract settlement; provisional vs final batch yield
    - cascading_side_effects                 # cupping-reject cascades into shipment-dispute, contract-shortfall, position-recompute
    - derived_field_reconciliation           # WarehousePosition.open_to_sell_lbs, InventoryFinancingLine.utilized_usd
    - optimistic_concurrency                 # OCC on Contract.version for price-fix and blend-version pinning
    - rate_threshold_triggers                # financing margin-call thresholds, freshness aging buckets, shrinkage bands
  entity_topology: hierarchical              # Contract → Shipment → GreenLot; Product → BlendRecipe → RecipeComponent; RoastBatch → RoastInputAllocation
  state_machine_shape: parallel              # Contract has pricing_status × fulfillment_status; Shipment has transit × qc; RoastBatch has production × qc
  relationship_patterns:
    - one_to_many                            # Contract→Shipment, Shipment→GreenLot, Product→BlendRecipe, RoastBatch→RoastInputAllocation
    - many_to_many                           # RoastInputAllocation joins RoastBatch ↔ GreenLot; FulfillmentLine joins FulfillmentOrder ↔ FinishedGoodsLot
    - cross_aggregate                        # FuturesHedge.contract_id; InventoryFinancingLine tied to aggregate position not a single lot
  role_model: segregation_of_duties          # Trader ≠ RiskManager on price-fix/hedge; RoastOperator ≠ QAGrader on roast/cupping
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — do not edit)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Counterparty
    parent: null
    common_fields: true
    fields:
      - { name: counterparty_ref, type: string, source: input, description: "External counterparty reference code (supplier or importer)" }
      - { name: legal_name, type: string, source: input, description: "Legal entity name" }
      - { name: counterparty_kind, type: enum, source: input, description: "SUPPLIER | IMPORTER | CUSTOMER" }
      - { name: credit_limit_usd, type: number, source: input, description: "Maximum allowed open exposure for this counterparty" }
      - { name: counterparty_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }
      - { name: open_exposure_usd, type: number, source: computed, description: "Sum of unfixed PTBF contract notional + unpaid fixed contract remainder for this counterparty; never negative" }

  - name: Contract
    parent: Counterparty
    common_fields: true
    fields:
      - { name: counterparty_id, type: string, source: input, description: "FK -> Counterparty.id; seller of the green coffee" }
      - { name: contract_ref, type: string, source: input, description: "Trader-assigned contract reference (e.g. NYC-2026-014)" }
      - { name: pricing_mode, type: enum, source: input, description: "DIFFERENTIAL_PTBF | FIXED_OUTRIGHT" }
      - { name: coffee_grade, type: enum, source: input, description: "SHB | HG | NY2_3 | ROBUSTA_GRADE1" }
      - { name: total_lbs, type: integer, source: input, description: "Total contracted green pounds" }
      - { name: fixed_price_usd_per_lb, type: number, source: input, description: "Outright price when pricing_mode = FIXED_OUTRIGHT; null for PTBF" }
      - { name: differential_usd_per_lb, type: number, source: input, description: "Differential over ICE C futures when pricing_mode = DIFFERENTIAL_PTBF; null for fixed" }
      - { name: delivery_window_start, type: datetime, source: input, description: "Earliest acceptable shipment arrival (ISO8601)" }
      - { name: delivery_window_end, type: datetime, source: input, description: "Latest acceptable shipment arrival (ISO8601); must be strictly after start" }
      - { name: pricing_status, type: enum, source: system, description: "UNFIXED | PARTIALLY_FIXED | FULLY_FIXED | NOT_APPLICABLE (NOT_APPLICABLE only for FIXED_OUTRIGHT)" }
      - { name: fulfillment_status, type: enum, source: system, description: "OPEN | PARTIALLY_RECEIVED | FULLY_RECEIVED | SHORT_CLOSED | CANCELLED" }
      - { name: fixed_lbs_accum, type: integer, source: computed, description: "Sum of pounds price-fixed to date under PTBF; 0 for FIXED_OUTRIGHT" }
      - { name: weighted_avg_fixed_futures_usd, type: number, source: computed, description: "Weighted average futures level locked via price-fix events; null until first fix; precision 5 decimals" }
      - { name: received_lbs_accum, type: integer, source: computed, description: "Sum of GreenLot.received_lbs over shipments in RECEIVED or later" }
      - { name: priced_notional_usd, type: number, source: computed, description: "Dollar value of fixed portion: fixed_lbs_accum * (weighted_avg_fixed_futures_usd + differential)" }
      - { name: unpriced_lbs, type: integer, source: computed, description: "total_lbs - fixed_lbs_accum; 0 for FIXED_OUTRIGHT" }

  - name: PriceFixEvent
    parent: Contract
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: fix_lbs, type: integer, source: input, description: "Pounds fixed in this event; strictly positive; cumulative fix_lbs must not exceed contract.total_lbs" }
      - { name: futures_price_usd_per_lb, type: number, source: input, description: "ICE C futures price at moment of fix; precision 5 decimals" }
      - { name: fixed_at, type: datetime, source: system, description: "Server clock timestamp when fix was recorded" }
      - { name: fixed_by_trader_id, type: string, source: system, description: "X-User-ID of the Trader who executed the fix; immutable" }

  - name: Shipment
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: shipment_ref, type: string, source: input, description: "Bill-of-lading / booking reference" }
      - { name: planned_lbs, type: integer, source: input, description: "Planned green pounds on this shipment" }
      - { name: scheduled_arrival, type: datetime, source: input, description: "Planned arrival timestamp (ISO8601)" }
      - { name: transit_status, type: enum, source: system, description: "BOOKED | IN_TRANSIT | ARRIVED | RECEIVED | CANCELLED" }
      - { name: qc_status, type: enum, source: system, description: "PENDING_CUP | CUP_PASSED | CUP_FAILED | NOT_REQUIRED" }
      - { name: dispute_status, type: enum, source: system, description: "NONE | DISPUTED | RESOLVED_ACCEPTED | RESOLVED_REJECTED" }
      - { name: received_lbs, type: integer, source: system, description: "Pounds actually received; null until RECEIVED" }

  - name: GreenLot
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id" }
      - { name: lot_code, type: string, source: input, description: "Mill / ICO lot code" }
      - { name: received_lbs, type: integer, source: input, description: "Pounds received into warehouse for this lot" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture at intake; percent 0–100" }
      - { name: warehouse_location, type: string, source: input, description: "Warehouse zone code (e.g. WH-A-3)" }
      - { name: landed_cost_usd_per_lb, type: number, source: computed, description: "Computed at receipt from contract pricing at time of receipt: fixed component + differential + freight_per_lb" }
      - { name: available_lbs, type: integer, source: computed, description: "received_lbs - sum(RoastInputAllocation.allocated_lbs where allocation_status = ACTIVE) - sum(reserved_lbs on active FinancingReserve covering this lot)" }
      - { name: cup_score, type: number, source: system, description: "Specialty Coffee Association cup score 0–100 with 1 decimal; null until cupped" }
      - { name: lot_status, type: enum, source: system, description: "QUARANTINE | RELEASED | REJECTED | DEPLETED" }

  - name: WarehousePosition
    parent: null
    common_fields: true
    fields:
      - { name: position_as_of, type: datetime, source: system, description: "Server timestamp of last recompute; refreshed on every position-affecting mutation" }
      - { name: physical_lbs, type: integer, source: computed, description: "Sum of received_lbs over GreenLot where lot_status IN {RELEASED, QUARANTINE}" }
      - { name: committed_lbs, type: integer, source: computed, description: "Sum of RoastInputAllocation.allocated_lbs where allocation_status = ACTIVE" }
      - { name: reserved_for_financing_lbs, type: integer, source: computed, description: "Sum of FinancingReserve.reserved_lbs where reserve_status = ACTIVE" }
      - { name: open_to_sell_lbs, type: integer, source: computed, description: "physical_lbs - committed_lbs - reserved_for_financing_lbs; must remain >= 0; any mutation that would drive it negative is rejected" }
      - { name: weighted_avg_landed_cost_usd, type: number, source: computed, description: "Mass-weighted average landed cost across RELEASED lots; precision 5 decimals; null when no RELEASED lots" }

  - name: InventoryFinancingLine
    parent: null
    common_fields: true
    fields:
      - { name: lender_name, type: string, source: input, description: "Name of lender / bank" }
      - { name: facility_limit_usd, type: number, source: input, description: "Maximum borrowing capacity" }
      - { name: advance_rate_pct, type: number, source: input, description: "Fraction of eligible collateral value the lender will advance (0–1)" }
      - { name: utilized_usd, type: number, source: computed, description: "Current outstanding advance; sum over ACTIVE FinancingReserve.reserve_advance_usd" }
      - { name: collateral_value_usd, type: number, source: computed, description: "Sum over ACTIVE FinancingReserve of (reserved_lbs * lot's landed_cost_usd_per_lb)" }
      - { name: financing_status, type: enum, source: system, description: "OPEN | SUSPENDED | CLOSED" }

  - name: FinancingReserve
    parent: InventoryFinancingLine
    common_fields: true
    fields:
      - { name: financing_line_id, type: string, source: input, description: "FK -> InventoryFinancingLine.id" }
      - { name: green_lot_id, type: string, source: input, description: "FK -> GreenLot.id; lot pledged as collateral" }
      - { name: reserved_lbs, type: integer, source: input, description: "Pounds of the lot pledged to the line; strictly positive; must not exceed lot.available_lbs at time of pledge" }
      - { name: reserve_advance_usd, type: number, source: computed, description: "reserved_lbs * lot.landed_cost_usd_per_lb * line.advance_rate_pct; 2 decimals round_half_up" }
      - { name: reserve_status, type: enum, source: system, description: "ACTIVE | RELEASED" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Stock-keeping unit code" }
      - { name: display_name, type: string, source: input, description: "Human-readable product name" }
      - { name: channel, type: enum, source: input, description: "PRIVATE_LABEL | SUBSCRIPTION | WHOLESALE" }
      - { name: target_roast_profile_id, type: string, source: input, description: "FK -> RoastProfile.id; the profile this product is roasted to" }
      - { name: freshness_days, type: integer, source: input, description: "Shelf life in days from roast completion; strictly positive" }
      - { name: product_status, type: enum, source: system, description: "ACTIVE (sole value in v1; always ACTIVE on creation, no transitions defined)" }

  - name: RoastProfile
    parent: null
    common_fields: true
    fields:
      - { name: profile_code, type: string, source: input, description: "Roast curve code (e.g. RP-CITY-01)" }
      - { name: charge_temp_c, type: integer, source: input, description: "Charge temperature in Celsius" }
      - { name: target_drop_temp_c, type: integer, source: input, description: "Target drop temperature in Celsius; must be > charge_temp_c" }
      - { name: expected_yield_loss_pct, type: number, source: input, description: "Expected roast shrinkage fraction 0–1 (e.g. 0.16 for 16%)" }
      - { name: shrinkage_alert_band_pct, type: number, source: input, description: "Tolerance band around expected_yield_loss_pct outside which a batch is flagged; 0–0.10" }

  - name: BlendRecipe
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: recipe_version, type: integer, source: system, description: "Monotonic 1, 2, 3... incrementing on each superseding recipe created for the same product" }
      - { name: recipe_status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED | RETIRED" }
      - { name: approved_at, type: datetime, source: system, description: "Server timestamp when APPROVED; null until approval" }

  - name: RecipeComponent
    parent: BlendRecipe
    common_fields: true
    fields:
      - { name: recipe_id, type: string, source: input, description: "FK -> BlendRecipe.id" }
      - { name: required_grade, type: enum, source: input, description: "SHB | HG | NY2_3 | ROBUSTA_GRADE1 — primary grade this component draws from" }
      - { name: component_pct, type: number, source: input, description: "Fraction of blend 0–1; all components of a recipe must sum to exactly 1.00000" }
      - { name: substitution_grade, type: enum, source: input, description: "Grade that may substitute when required_grade has insufficient RELEASED lot mass; must differ from required_grade; null = no substitution permitted" }
      - { name: substitution_max_pct, type: number, source: input, description: "Maximum fraction of this component's mass that may come from substitution_grade (0–1); null iff substitution_grade is null" }

  - name: RoastBatch
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: recipe_id, type: string, source: input, description: "FK -> BlendRecipe.id; version-pinned at schedule time; MUST be recipe_status = APPROVED" }
      - { name: scheduled_green_lbs, type: integer, source: input, description: "Total green pounds charged into the roaster" }
      - { name: production_status, type: enum, source: system, description: "SCHEDULED | IN_DRUM | ROASTED | PACKED | VOIDED" }
      - { name: qc_status, type: enum, source: system, description: "PENDING_QC | QC_PASSED | QC_FAILED | NOT_REQUIRED" }
      - { name: actual_roasted_lbs, type: integer, source: system, description: "Actual roasted output measured at ROASTED transition; null until then" }
      - { name: actual_yield_loss_pct, type: number, source: computed, description: "1 - actual_roasted_lbs / scheduled_green_lbs; null until ROASTED; precision 5 decimals" }
      - { name: yield_variance_flag, type: enum, source: computed, description: "WITHIN_BAND | ABOVE_BAND | BELOW_BAND | UNKNOWN — compares actual vs profile expected ± shrinkage_alert_band_pct" }
      - { name: recipe_version_pinned, type: integer, source: system, description: "Copy of BlendRecipe.recipe_version at schedule time; used to detect stale recipes at roast start" }
      - { name: roast_completed_at, type: datetime, source: system, description: "Server timestamp at ROASTED transition; freshness clock starts here" }

  - name: RoastInputAllocation
    parent: RoastBatch
    common_fields: true
    fields:
      - { name: roast_batch_id, type: string, source: input, description: "FK -> RoastBatch.id" }
      - { name: green_lot_id, type: string, source: input, description: "FK -> GreenLot.id" }
      - { name: component_id, type: string, source: input, description: "FK -> RecipeComponent.id; which blend line this allocation serves" }
      - { name: allocated_lbs, type: integer, source: input, description: "Pounds of green lot allocated; strictly positive" }
      - { name: is_substitution, type: boolean, source: system, description: "True iff lot's grade != component.required_grade" }
      - { name: allocation_status, type: enum, source: system, description: "ACTIVE | CONSUMED | RELEASED" }

  - name: FinishedGoodsLot
    parent: RoastBatch
    common_fields: true
    fields:
      - { name: roast_batch_id, type: string, source: input, description: "FK -> RoastBatch.id" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; copied from batch" }
      - { name: packed_lbs, type: integer, source: input, description: "Pounds of roasted coffee packed into this finished lot" }
      - { name: packed_at, type: datetime, source: system, description: "Server timestamp at creation" }
      - { name: sellable_until, type: datetime, source: computed, description: "roast_batch.roast_completed_at + product.freshness_days days; after this the lot is STALE" }
      - { name: available_lbs, type: integer, source: computed, description: "packed_lbs - sum(FulfillmentLine.allocated_lbs where line_status = ACTIVE)" }
      - { name: lot_status, type: enum, source: system, description: "FRESH | STALE | DEPLETED | RECALLED" }

  - name: CuppingSession
    parent: null
    common_fields: true
    fields:
      - { name: subject_kind, type: enum, source: input, description: "GREEN_LOT | ROAST_BATCH" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic reference. For GREEN_LOT, may be either the GreenLot.id directly OR the parent Shipment.id (in which case the server resolves to that shipment's single GreenLot child — each shipment produces exactly one lot at receive). For ROAST_BATCH, must be the RoastBatch.id. The stored value is always the resolved GreenLot.id (or RoastBatch.id), not the client-supplied alias." }
      - { name: panelist_count, type: integer, source: input, description: "Number of graders on the panel; must be >= 3 for a decisive session" }
      - { name: score_aroma, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_flavor, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_aftertaste, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_acidity, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_body, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_balance, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_uniformity, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_clean_cup, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_sweetness, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: score_overall, type: number, source: input, description: "0–10 in 0.25 steps" }
      - { name: defects_subtracted, type: integer, source: input, description: "Total defect deductions across the panel; integer >= 0" }
      - { name: final_score, type: number, source: computed, description: "Sum of 10 attribute scores minus defects_subtracted; precision 2 decimals round_half_up" }
      - { name: session_verdict, type: enum, source: system, description: "PASS | FAIL | PENDING_REVIEW" }
      - { name: reviewed_by_qa_id, type: string, source: system, description: "X-User-ID of the QAGrader who finalized the verdict; null until finalized" }

  - name: FulfillmentOrder
    parent: Counterparty
    common_fields: true
    fields:
      - { name: customer_counterparty_id, type: string, source: input, description: "FK -> Counterparty.id; the buying CUSTOMER counterparty" }
      - { name: channel, type: enum, source: input, description: "PRIVATE_LABEL | SUBSCRIPTION | WHOLESALE" }
      - { name: requested_ship_date, type: datetime, source: input, description: "Customer-requested ship date" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | RESERVED | PACKED | SHIPPED | CANCELLED" }
      - { name: total_reserved_lbs, type: integer, source: computed, description: "Sum over its FulfillmentLine.allocated_lbs where line_status = ACTIVE" }

  - name: FulfillmentLine
    parent: FulfillmentOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> FulfillmentOrder.id" }
      - { name: finished_goods_lot_id, type: string, source: input, description: "FK -> FinishedGoodsLot.id" }
      - { name: allocated_lbs, type: integer, source: input, description: "Pounds allocated from this finished lot" }
      - { name: line_status, type: enum, source: system, description: "ACTIVE | SHIPPED | RELEASED" }

  - name: FuturesHedge
    parent: Contract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the PTBF contract whose unpriced exposure this hedge covers" }
      - { name: hedge_side, type: enum, source: input, description: "BUY_FUTURES | SELL_FUTURES" }
      - { name: hedge_lbs, type: integer, source: input, description: "Pounds hedged; strictly positive" }
      - { name: entry_price_usd_per_lb, type: number, source: input, description: "Futures price at hedge placement; precision 5 decimals" }
      - { name: exit_price_usd_per_lb, type: number, source: input, description: "Futures price at lift; null until lifted" }
      - { name: realized_pnl_usd, type: number, source: computed, description: "For BUY: (exit - entry) * hedge_lbs; for SELL: (entry - exit) * hedge_lbs; null until LIFTED; 2 decimals round_half_up" }
      - { name: hedge_status, type: enum, source: system, description: "WORKING | APPROVED | LIFTED | CANCELLED" }
      - { name: approved_by_risk_id, type: string, source: system, description: "X-User-ID of the RiskManager who approved; segregation-of-duties: MUST differ from submitting trader" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Counterparty
    field: counterparty_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system when counterparty.open_exposure_usd exceeds credit_limit_usd after a recompute, or manual RiskManager suspension (no endpoint exposed in v1; treated as derived / informational)"
        actor: system
        preconditions:
          - "open_exposure_usd > credit_limit_usd (strictly greater)"
        side_effects:
          - "Counterparty.version incremented by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system when counterparty.open_exposure_usd falls to or below credit_limit_usd after a recompute"
        actor: system
        preconditions:
          - "open_exposure_usd <= credit_limit_usd"
        side_effects:
          - "Counterparty.version incremented by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system on explicit Trader close action (v1: not exposed as endpoint; treated as terminal bookkeeping)"
        actor: system
        preconditions:
          - "no Contract in fulfillment_status IN {OPEN, PARTIALLY_RECEIVED}"
        side_effects:
          - "Counterparty.version incremented by 1"

  - entity: Contract
    field: pricing_status
    initial_state: UNFIXED
    terminal_states: [FULLY_FIXED, NOT_APPLICABLE]
    transitions:
      - from: UNFIXED
        to: PARTIALLY_FIXED
        trigger: "POST /roastery/contracts/{contract_id}/price-fixes"
        actor: Trader
        preconditions:
          - "contract.pricing_mode == DIFFERENTIAL_PTBF"
          - "contract.fulfillment_status IN {OPEN, PARTIALLY_RECEIVED, FULLY_RECEIVED} (pricing may continue after receipt completes)"
          - "fix_lbs > 0"
          - "fixed_lbs_accum + fix_lbs < total_lbs (strictly less; == total_lbs goes to FULLY_FIXED)"
        side_effects:
          - "fixed_lbs_accum += fix_lbs"
          - "weighted_avg_fixed_futures_usd recomputed as weighted average over all PriceFixEvent (see calc_weighted_avg_fixed_futures)"
          - "priced_notional_usd recomputed"
          - "unpriced_lbs recomputed"
          - "Counterparty.open_exposure_usd recomputed (see calc_counterparty_open_exposure)"
          - "Contract.version incremented by 1"
      - from: UNFIXED
        to: FULLY_FIXED
        trigger: "POST /roastery/contracts/{contract_id}/price-fixes with fixed_lbs_accum + fix_lbs == total_lbs"
        actor: Trader
        preconditions:
          - "contract.pricing_mode == DIFFERENTIAL_PTBF"
          - "contract.fulfillment_status IN {OPEN, PARTIALLY_RECEIVED, FULLY_RECEIVED}"
          - "fix_lbs > 0"
          - "fixed_lbs_accum + fix_lbs == total_lbs exactly"
        side_effects:
          - "fixed_lbs_accum = total_lbs"
          - "unpriced_lbs = 0"
          - "weighted_avg_fixed_futures_usd recomputed"
          - "priced_notional_usd recomputed"
          - "Counterparty.open_exposure_usd recomputed"
          - "All FuturesHedge rows for this contract with hedge_status = APPROVED auto-transition to LIFTED (see hedge auto-lift cascade)"
          - "Contract.version incremented by 1"
      - from: PARTIALLY_FIXED
        to: FULLY_FIXED
        trigger: "POST /roastery/contracts/{contract_id}/price-fixes with fixed_lbs_accum + fix_lbs == total_lbs"
        actor: Trader
        preconditions:
          - "contract.pricing_mode == DIFFERENTIAL_PTBF"
          - "fix_lbs > 0"
          - "fixed_lbs_accum + fix_lbs == total_lbs exactly"
        side_effects:
          - "Same side effects as UNFIXED → FULLY_FIXED"
      - from: UNFIXED
        to: NOT_APPLICABLE
        trigger: "system on Contract creation when pricing_mode = FIXED_OUTRIGHT"
        actor: system
        preconditions:
          - "contract.pricing_mode == FIXED_OUTRIGHT"
        side_effects:
          - "fixed_lbs_accum set to total_lbs"
          - "unpriced_lbs set to 0"
          - "weighted_avg_fixed_futures_usd left null (no futures leg)"
          - "priced_notional_usd = total_lbs * fixed_price_usd_per_lb"

  - entity: Contract
    field: fulfillment_status
    initial_state: OPEN
    terminal_states: [FULLY_RECEIVED, SHORT_CLOSED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_RECEIVED
        trigger: "system when first Shipment of this contract transitions to RECEIVED"
        actor: system
        preconditions:
          - "sum of GreenLot.received_lbs over RECEIVED shipments of this contract > 0 but < total_lbs"
        side_effects:
          - "received_lbs_accum recomputed"
          - "Contract.version incremented by 1"
      - from: PARTIALLY_RECEIVED
        to: FULLY_RECEIVED
        trigger: "system when received_lbs_accum reaches total_lbs"
        actor: system
        preconditions:
          - "received_lbs_accum == total_lbs"
        side_effects:
          - "Contract.version incremented by 1"
      - from: PARTIALLY_RECEIVED
        to: SHORT_CLOSED
        trigger: "POST /roastery/contracts/{contract_id}/short-close"
        actor: Trader
        preconditions:
          - "fulfillment_status == PARTIALLY_RECEIVED"
          - "received_lbs_accum < total_lbs"
          - "no Shipment of this contract has transit_status IN {BOOKED, IN_TRANSIT, ARRIVED}"
        side_effects:
          - "unpriced_lbs set to 0 (shortfall is written off; no obligation to fix the unfixed remainder)"
          - "All FuturesHedge rows for this contract with hedge_status IN {WORKING, APPROVED} transition to CANCELLED"
          - "Counterparty.open_exposure_usd recomputed"
          - "Contract.version incremented by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /roastery/contracts/{contract_id}/cancel"
        actor: Trader
        preconditions:
          - "fulfillment_status == OPEN"
          - "no Shipment exists for this contract"
          - "no PriceFixEvent exists for this contract"
          - "no FuturesHedge in hedge_status IN {WORKING, APPROVED} for this contract"
        side_effects:
          - "unpriced_lbs set to 0"
          - "Counterparty.open_exposure_usd recomputed"
          - "Contract.version incremented by 1"

  - entity: Shipment
    field: transit_status
    initial_state: BOOKED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: BOOKED
        to: IN_TRANSIT
        trigger: "POST /roastery/shipments/{shipment_id}/depart"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transit_status == BOOKED"
        side_effects:
          - "Shipment.version incremented by 1"
      - from: IN_TRANSIT
        to: ARRIVED
        trigger: "POST /roastery/shipments/{shipment_id}/arrive"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transit_status == IN_TRANSIT"
        side_effects:
          - "Shipment.version incremented by 1"
      - from: ARRIVED
        to: RECEIVED
        trigger: "POST /roastery/shipments/{shipment_id}/receive"
        actor: WarehouseClerk
        preconditions:
          - "shipment.transit_status == ARRIVED"
          - "received_lbs > 0"
          - "received_lbs <= planned_lbs (over-receipt not permitted)"
        side_effects:
          - "Creates one GreenLot child with received_lbs = received_lbs, lot_status = QUARANTINE, qc_status on shipment set to PENDING_CUP"
          - "Contract.received_lbs_accum recomputed; if crossing 0 boundary → Contract.fulfillment_status OPEN → PARTIALLY_RECEIVED; if reaching total_lbs → FULLY_RECEIVED"
          - "Contract.version incremented by 1"
          - "Shipment.version incremented by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /roastery/shipments/{shipment_id}/cancel"
        actor: LogisticsCoordinator
        preconditions:
          - "shipment.transit_status == BOOKED (only unshipped bookings may be cancelled)"
        side_effects:
          - "Shipment.version incremented by 1"

  - entity: Shipment
    field: qc_status
    initial_state: NOT_REQUIRED
    terminal_states: [CUP_PASSED, CUP_FAILED, NOT_REQUIRED]
    transitions:
      - from: NOT_REQUIRED
        to: PENDING_CUP
        trigger: "system when shipment transitions ARRIVED → RECEIVED"
        actor: system
        preconditions: []
        side_effects:
          - "Shipment.version incremented by 1"
      - from: PENDING_CUP
        to: CUP_PASSED
        trigger: "system when a CuppingSession on this shipment's GreenLot finalizes with verdict = PASS"
        actor: system
        preconditions: []
        side_effects:
          - "GreenLot.lot_status QUARANTINE → RELEASED"
          - "GreenLot.cup_score set to session.final_score"
          - "WarehousePosition recompute (physical_lbs now counts this lot toward eligible collateral)"
          - "Shipment.version incremented by 1"
      - from: PENDING_CUP
        to: CUP_FAILED
        trigger: "system when a CuppingSession on this shipment's GreenLot finalizes with verdict = FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "GreenLot.lot_status QUARANTINE → REJECTED"
          - "GreenLot.cup_score set to session.final_score"
          - "Shipment.dispute_status NONE → DISPUTED"
          - "WarehousePosition recompute (rejected lot excluded from physical_lbs used as collateral)"
          - "Shipment.version incremented by 1"

  - entity: Shipment
    field: dispute_status
    initial_state: NONE
    terminal_states: [RESOLVED_ACCEPTED, RESOLVED_REJECTED]
    transitions:
      - from: NONE
        to: DISPUTED
        trigger: "system on CUP_FAILED"
        actor: system
        preconditions: []
        side_effects:
          - "Shipment.version incremented by 1"
      - from: DISPUTED
        to: RESOLVED_ACCEPTED
        trigger: "POST /roastery/shipments/{shipment_id}/resolve-dispute with outcome = ACCEPT"
        actor: Trader
        preconditions:
          - "dispute_status == DISPUTED"
          - "qc_status == CUP_FAILED"
        side_effects:
          - "GreenLot.lot_status REJECTED → RELEASED with landed_cost_usd_per_lb recomputed at the negotiated discount (see calc_disputed_lot_landed_cost)"
          - "WarehousePosition recompute"
          - "Shipment.version incremented by 1"
      - from: DISPUTED
        to: RESOLVED_REJECTED
        trigger: "POST /roastery/shipments/{shipment_id}/resolve-dispute with outcome = REJECT"
        actor: Trader
        preconditions:
          - "dispute_status == DISPUTED"
          - "qc_status == CUP_FAILED"
        side_effects:
          - "GreenLot.lot_status stays REJECTED; lot marked for return/destruction (physical_lbs unchanged — rejected lot was already excluded)"
          - "Contract.fulfillment_status re-evaluated: if received_lbs now leaves contract under-received and no further shipments pending, Trader may short-close (separate call)"
          - "Shipment.version incremented by 1"

  - entity: GreenLot
    field: lot_status
    initial_state: QUARANTINE
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "system on CUP_PASSED, or system on dispute RESOLVED_ACCEPTED"
        actor: system
        preconditions: []
        side_effects:
          - "WarehousePosition recompute (lot now eligible for allocation and financing collateral)"
          - "GreenLot.version incremented by 1"
      - from: QUARANTINE
        to: REJECTED
        trigger: "system on CUP_FAILED"
        actor: system
        preconditions: []
        side_effects:
          - "WarehousePosition recompute"
          - "GreenLot.version incremented by 1"
      - from: RELEASED
        to: DEPLETED
        trigger: "system when available_lbs reaches 0 and all allocations CONSUMED"
        actor: system
        preconditions:
          - "available_lbs == 0"
          - "no RoastInputAllocation for this lot in allocation_status = ACTIVE"
        side_effects:
          - "WarehousePosition recompute"
          - "GreenLot.version incremented by 1"

  - entity: InventoryFinancingLine
    field: financing_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /roastery/financing-lines/{line_id}/suspend"
        actor: RiskManager
        preconditions:
          - "financing_status == OPEN"
        side_effects:
          - "Line blocks new FinancingReserve creation"
          - "InventoryFinancingLine.version incremented by 1"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /roastery/financing-lines/{line_id}/unsuspend"
        actor: RiskManager
        preconditions:
          - "financing_status == SUSPENDED"
        side_effects:
          - "InventoryFinancingLine.version incremented by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /roastery/financing-lines/{line_id}/close"
        actor: RiskManager
        preconditions:
          - "financing_status == OPEN"
          - "utilized_usd == 0"
          - "no FinancingReserve in reserve_status = ACTIVE"
        side_effects:
          - "InventoryFinancingLine.version incremented by 1"

  - entity: FinancingReserve
    field: reserve_status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /roastery/financing-reserves/{reserve_id}/release"
        actor: RiskManager
        preconditions:
          - "reserve_status == ACTIVE"
        side_effects:
          - "GreenLot.available_lbs += reserved_lbs (mass returns to open pool)"
          - "InventoryFinancingLine.utilized_usd -= reserve_advance_usd"
          - "InventoryFinancingLine.collateral_value_usd -= (reserved_lbs * landed_cost_usd_per_lb)"
          - "WarehousePosition recompute"
          - "FinancingReserve.version incremented by 1"

  - entity: BlendRecipe
    field: recipe_status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /roastery/recipes/{recipe_id}/approve"
        actor: HeadRoaster
        preconditions:
          - "recipe_status == DRAFT"
          - "sum of RecipeComponent.component_pct == 1.00000 exactly (5-decimal precision)"
          - "every RecipeComponent with substitution_grade non-null has substitution_max_pct non-null AND 0 < substitution_max_pct <= 1"
          - "no other BlendRecipe for the same product in recipe_status = APPROVED with the same recipe_version"
        side_effects:
          - "approved_at = now"
          - "Any previously APPROVED recipe for this product auto-transitions APPROVED → SUPERSEDED"
          - "BlendRecipe.version incremented by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system when a newer recipe for the same product is APPROVED"
        actor: system
        preconditions: []
        side_effects:
          - "Existing RoastBatch rows pinned to this recipe keep recipe_version_pinned; their IN_DRUM transition checks staleness (see RoastBatch.SCHEDULED → IN_DRUM)"
          - "BlendRecipe.version incremented by 1"
      - from: DRAFT
        to: RETIRED
        trigger: "POST /roastery/recipes/{recipe_id}/retire"
        actor: HeadRoaster
        preconditions:
          - "recipe_status == DRAFT"
          - "no RoastBatch references this recipe"
        side_effects:
          - "BlendRecipe.version incremented by 1"

  - entity: RoastBatch
    field: production_status
    initial_state: SCHEDULED
    terminal_states: [PACKED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_DRUM
        trigger: "POST /roastery/roast-batches/{batch_id}/start"
        actor: RoastOperator
        preconditions:
          - "production_status == SCHEDULED"
          - "BlendRecipe.recipe_status == APPROVED AND BlendRecipe.recipe_version == batch.recipe_version_pinned (stale-recipe guard)"
          - "every RoastInputAllocation for this batch is allocation_status = ACTIVE"
          - "sum of RoastInputAllocation.allocated_lbs == scheduled_green_lbs exactly"
        side_effects:
          - "All RoastInputAllocation rows transition ACTIVE → CONSUMED"
          - "Each referenced GreenLot.available_lbs -= allocated_lbs; if that drives lot to 0 and no other ACTIVE allocations, lot → DEPLETED"
          - "WarehousePosition recompute"
          - "RoastBatch.version incremented by 1"
      - from: IN_DRUM
        to: ROASTED
        trigger: "POST /roastery/roast-batches/{batch_id}/finish"
        actor: RoastOperator
        preconditions:
          - "production_status == IN_DRUM"
          - "actual_roasted_lbs > 0"
          - "actual_roasted_lbs < scheduled_green_lbs (output strictly less than input; 100% yield is physically impossible)"
        side_effects:
          - "actual_roasted_lbs recorded"
          - "actual_yield_loss_pct computed"
          - "yield_variance_flag computed via calc_yield_variance"
          - "roast_completed_at = now (freshness clock starts)"
          - "qc_status NOT_REQUIRED → PENDING_QC"
          - "RoastBatch.version incremented by 1"
      - from: ROASTED
        to: PACKED
        trigger: "POST /roastery/roast-batches/{batch_id}/pack"
        actor: RoastOperator
        preconditions:
          - "production_status == ROASTED"
          - "qc_status == QC_PASSED"
          - "packed_lbs > 0 AND packed_lbs <= actual_roasted_lbs"
        side_effects:
          - "Creates FinishedGoodsLot with sellable_until = roast_completed_at + product.freshness_days"
          - "RoastBatch.version incremented by 1"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /roastery/roast-batches/{batch_id}/void"
        actor: RoastOperator
        preconditions:
          - "production_status == SCHEDULED"
        side_effects:
          - "All RoastInputAllocation rows transition ACTIVE → RELEASED; mass returns to GreenLot.available_lbs"
          - "WarehousePosition recompute"
          - "RoastBatch.version incremented by 1"

  - entity: RoastBatch
    field: qc_status
    initial_state: NOT_REQUIRED
    terminal_states: [QC_PASSED, QC_FAILED, NOT_REQUIRED]
    transitions:
      - from: NOT_REQUIRED
        to: PENDING_QC
        trigger: "system on IN_DRUM → ROASTED"
        actor: system
        preconditions: []
        side_effects:
          - "RoastBatch.version incremented by 1"
      - from: PENDING_QC
        to: QC_PASSED
        trigger: "system when CuppingSession on this batch finalizes with verdict = PASS"
        actor: system
        preconditions: []
        side_effects:
          - "RoastBatch.version incremented by 1"
      - from: PENDING_QC
        to: QC_FAILED
        trigger: "system when CuppingSession on this batch finalizes with verdict = FAIL"
        actor: system
        preconditions: []
        side_effects:
          - "Any FinishedGoodsLot rows already created for this batch (should not exist since PACKED requires QC_PASSED, but defensive) transition to RECALLED"
          - "RoastBatch.version incremented by 1"

  - entity: FinishedGoodsLot
    field: lot_status
    initial_state: FRESH
    terminal_states: [DEPLETED, RECALLED]
    transitions:
      - from: FRESH
        to: STALE
        trigger: "system (lazy evaluation at read/allocation time) when current server time > sellable_until"
        actor: system
        preconditions:
          - "current server time > sellable_until (strictly greater; at exactly sellable_until the lot is still FRESH)"
        side_effects:
          - "Existing ACTIVE FulfillmentLine rows stay ACTIVE (reservation honored) but new allocations rejected"
          - "FinishedGoodsLot.version incremented by 1"
      - from: FRESH
        to: DEPLETED
        trigger: "system when available_lbs reaches 0"
        actor: system
        preconditions:
          - "available_lbs == 0"
        side_effects:
          - "FinishedGoodsLot.version incremented by 1"
      - from: FRESH
        to: RECALLED
        trigger: "system when parent RoastBatch.qc_status flips to QC_FAILED after pack (defensive cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "All ACTIVE FulfillmentLine rows transition to RELEASED; mass is NOT returned (recalled product is destroyed)"
          - "FinishedGoodsLot.version incremented by 1"
      - from: STALE
        to: DEPLETED
        trigger: "system when available_lbs reaches 0 (all SHIPPED)"
        actor: system
        preconditions:
          - "available_lbs == 0"
        side_effects:
          - "FinishedGoodsLot.version incremented by 1"

  - entity: FulfillmentOrder
    field: order_status
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /roastery/fulfillment-orders/{order_id}/reserve"
        actor: FulfillmentPlanner
        preconditions:
          - "order_status == DRAFT"
          - "at least one FulfillmentLine exists"
          - "for each line: referenced FinishedGoodsLot.lot_status == FRESH (STALE or RECALLED lots cannot be allocated)"
          - "for each line: allocated_lbs <= FinishedGoodsLot.available_lbs at time of reservation"
        side_effects:
          - "Each line → line_status = ACTIVE; FinishedGoodsLot.available_lbs -= allocated_lbs"
          - "total_reserved_lbs computed"
          - "FulfillmentOrder.version incremented by 1"
      - from: RESERVED
        to: PACKED
        trigger: "POST /roastery/fulfillment-orders/{order_id}/pack"
        actor: FulfillmentPlanner
        preconditions:
          - "order_status == RESERVED"
        side_effects:
          - "FulfillmentOrder.version incremented by 1"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /roastery/fulfillment-orders/{order_id}/ship"
        actor: FulfillmentPlanner
        preconditions:
          - "order_status == PACKED"
        side_effects:
          - "Each FulfillmentLine → line_status = SHIPPED"
          - "FinishedGoodsLot rows whose available_lbs reaches 0 transition to DEPLETED"
          - "FulfillmentOrder.version incremented by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /roastery/fulfillment-orders/{order_id}/cancel"
        actor: FulfillmentPlanner
        preconditions:
          - "order_status == DRAFT"
        side_effects:
          - "FulfillmentOrder.version incremented by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /roastery/fulfillment-orders/{order_id}/cancel"
        actor: FulfillmentPlanner
        preconditions:
          - "order_status == RESERVED"
        side_effects:
          - "All ACTIVE FulfillmentLine rows transition ACTIVE → RELEASED; FinishedGoodsLot.available_lbs += allocated_lbs"
          - "FulfillmentOrder.version incremented by 1"

  - entity: FuturesHedge
    field: hedge_status
    initial_state: WORKING
    terminal_states: [LIFTED, CANCELLED]
    transitions:
      - from: WORKING
        to: APPROVED
        trigger: "POST /roastery/futures-hedges/{hedge_id}/approve"
        actor: RiskManager
        preconditions:
          - "hedge_status == WORKING"
        side_effects:
          - "approved_by_risk_id = approver X-User-ID"
          - "FuturesHedge.version incremented by 1"
        note: "Segregation-of-duties check (priority 8) and over-hedge check (priority 25) are validation rules, not state preconditions, so they produce domain errors rather than ERR_INVALID_STATE."
      - from: APPROVED
        to: LIFTED
        trigger: "POST /roastery/futures-hedges/{hedge_id}/lift"
        actor: Trader
        preconditions:
          - "hedge_status == APPROVED"
          - "exit_price_usd_per_lb provided and > 0"
        side_effects:
          - "realized_pnl_usd computed via calc_hedge_realized_pnl"
          - "Counterparty.open_exposure_usd recomputed (hedge lift closes the offsetting position)"
          - "FuturesHedge.version incremented by 1"
      - from: APPROVED
        to: LIFTED
        trigger: "system on Contract → FULLY_FIXED (auto-lift cascade)"
        actor: system
        preconditions:
          - "hedge_status == APPROVED"
          - "parent Contract.pricing_status transitions to FULLY_FIXED"
        side_effects:
          - "exit_price_usd_per_lb set to the contract's final weighted_avg_fixed_futures_usd"
          - "realized_pnl_usd computed via calc_hedge_realized_pnl"
          - "FuturesHedge.version incremented by 1"
      - from: WORKING
        to: CANCELLED
        trigger: "POST /roastery/futures-hedges/{hedge_id}/cancel"
        actor: Trader
        preconditions:
          - "hedge_status == WORKING"
        side_effects:
          - "FuturesHedge.version incremented by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "system on Contract fulfillment_status → SHORT_CLOSED"
        actor: system
        preconditions: []
        side_effects:
          - "FuturesHedge.version incremented by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: contract-price-fix-stale-version
    parent_entity: Contract
    write_endpoint: "POST /roastery/contracts/{contract_id}/price-fixes"
    occ_field: "expected_contract_version"
    description: |
      Recording a PriceFixEvent against a Contract whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just posted a fix (advancing fixed_lbs_accum,
      weighted_avg_fixed_futures_usd, and unpriced_lbs) and the current
      writer's view of remaining unpriced exposure is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: contract-short-close-stale-version
    parent_entity: Contract
    write_endpoint: "POST /roastery/contracts/{contract_id}/short-close"
    occ_field: "expected_contract_version"
    description: |
      Short-closing a Contract whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has just recorded a receipt or a price-fix that changed
      received_lbs_accum / fixed_lbs_accum, so the current writer's decision
      to write off the shortfall is based on stale state.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: recipe-approve-stale-product-version
    parent_entity: Product
    write_endpoint: "POST /roastery/recipes/{recipe_id}/approve"
    occ_field: "expected_product_version"
    description: |
      Approving a BlendRecipe against a Product whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just approved a competing recipe for the same
      product (superseding the previously APPROVED one) and the current
      writer's view of which recipe is current is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_weighted_avg_fixed_futures
    description: "Weighted average futures level across all price-fix events on a PTBF contract"
    trigger: "on every PriceFixEvent creation"
    algorithm: aggregation
    formula: |
      inputs: PriceFixEvent rows for contract, ordered by created_at ASC (oldest first)
      total_lbs_fixed = sum(e.fix_lbs for e in events)
      if total_lbs_fixed == 0: return null
      weighted_sum = sum(e.fix_lbs * e.futures_price_usd_per_lb for e in events)
      return weighted_sum / total_lbs_fixed
    input_set: "All PriceFixEvent rows whose contract_id == this contract (no status filter; PriceFixEvent is append-only)"
    constants: {}
    precision: "5 decimal places, round_half_up"
    variants: []

  - name: calc_priced_notional
    description: "Dollar notional of the priced portion of a contract"
    trigger: "on every PriceFixEvent creation and on contract creation for FIXED_OUTRIGHT"
    algorithm: aggregation
    formula: |
      if contract.pricing_mode == FIXED_OUTRIGHT:
        return contract.total_lbs * contract.fixed_price_usd_per_lb
      else:
        return contract.fixed_lbs_accum * (contract.weighted_avg_fixed_futures_usd + contract.differential_usd_per_lb)
    input_set: "Single contract"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: calc_counterparty_open_exposure
    description: "Total USD exposure to a counterparty across unfixed PTBF notional and unpaid fixed remainder — two valid accounting treatments produce different results"
    trigger: "on any of: PriceFixEvent creation, FuturesHedge approval/lift, Shipment receive, Contract short-close"
    algorithm: forward_looking
    formula: |
      Variant PROVISIONAL (used for credit-limit gating on new price-fixes):
        exposure = sum over contracts of counterparty where fulfillment_status IN {OPEN, PARTIALLY_RECEIVED}:
          unpriced_lbs * (current_spot_futures_usd_per_lb + contract.differential_usd_per_lb)
          where current_spot_futures_usd_per_lb is the most recent PriceFixEvent.futures_price_usd_per_lb
          across ANY contract in the system (or contract's differential only if no fixes exist yet,
          i.e. fallback = differential alone representing flat-price-at-zero-futures)
        PLUS sum over FIXED_OUTRIGHT contracts: (total_lbs - received_lbs_accum) * fixed_price_usd_per_lb
        MINUS sum over FuturesHedge in hedge_status = APPROVED on those contracts: hedge_lbs * entry_price_usd_per_lb

      Variant FINAL (used for margin-call evaluation and reporting):
        exposure = sum over contracts of counterparty where fulfillment_status IN {OPEN, PARTIALLY_RECEIVED}:
          priced_notional_usd (the already-fixed portion only; unfixed remainder is NOT counted)
        MINUS sum over FuturesHedge in hedge_status = APPROVED: hedge_lbs * entry_price_usd_per_lb
    input_set: "All contracts for the counterparty in fulfillment_status IN {OPEN, PARTIALLY_RECEIVED}; all their APPROVED FuturesHedge rows"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "credit-limit gating at price-fix time (validations priority 12)"
        difference: "Includes unfixed PTBF remainder marked to the latest observed futures level; this is the conservative (higher) number"
      - name: final
        when: "margin-call evaluation and counterparty reporting"
        difference: "Only counts already-fixed notional; unfixed remainder contributes 0 — this is the realized-exposure number"

  - name: calc_landed_cost_at_receipt
    description: "Landed cost per lb of a GreenLot at receipt, which depends on pricing mode and fix history at the moment of receipt"
    trigger: "on Shipment ARRIVED → RECEIVED"
    algorithm: chronological
    formula: |
      if contract.pricing_mode == FIXED_OUTRIGHT:
        landed = contract.fixed_price_usd_per_lb
      else:
        if contract.pricing_status == UNFIXED:
          # Provisional: use differential alone (no futures leg yet) — this is the provisional cost basis
          landed = contract.differential_usd_per_lb
        else:
          # Final: use the weighted-average fixed futures level as of receipt time
          landed = contract.weighted_avg_fixed_futures_usd + contract.differential_usd_per_lb
      return landed
    input_set: "Single contract + the receipt event's timestamp"
    constants: {}
    precision: "5 decimal places, round_half_up"
    variants:
      - name: provisional_basis
        when: "PTBF contract with no price-fix events at receipt time"
        difference: "Cost basis = differential alone; subsequent price fixes do NOT retroactively revalue this lot"
      - name: final_basis
        when: "PTBF contract with at least one price-fix before receipt, or FIXED_OUTRIGHT"
        difference: "Cost basis locked at receipt timestamp using weighted_avg_fixed_futures_usd + differential (or outright fixed price)"

  - name: calc_warehouse_position
    description: "Recompute derived WarehousePosition fields from source-of-truth rows"
    trigger: "on any of: GreenLot created/released/rejected, RoastInputAllocation created/consumed/released, FinancingReserve created/released"
    algorithm: aggregation
    formula: |
      physical_lbs = sum(g.received_lbs for g in GreenLot where g.lot_status IN {RELEASED, QUARANTINE})
      committed_lbs = sum(a.allocated_lbs for a in RoastInputAllocation where a.allocation_status = ACTIVE)
      reserved_for_financing_lbs = sum(r.reserved_lbs for r in FinancingReserve where r.reserve_status = ACTIVE)
      open_to_sell_lbs = physical_lbs - committed_lbs - reserved_for_financing_lbs
      released_lots = [g for g in GreenLot where g.lot_status == RELEASED]
      if released_lots is empty:
        weighted_avg_landed_cost_usd = null
      else:
        weighted_avg_landed_cost_usd = sum(g.received_lbs * g.landed_cost_usd_per_lb for g in released_lots) / sum(g.received_lbs for g in released_lots)
    input_set: "GreenLot with lot_status filter; RoastInputAllocation with allocation_status filter; FinancingReserve with reserve_status filter"
    constants: {}
    precision: "integer pounds; weighted cost 5 decimals round_half_up"
    variants: []

  - name: calc_financing_reserve_advance
    description: "Dollar advance the lender provides against a pledged lot"
    trigger: "on FinancingReserve creation"
    algorithm: aggregation
    formula: |
      reserve_advance_usd = reserved_lbs * green_lot.landed_cost_usd_per_lb * line.advance_rate_pct
    input_set: "Single FinancingReserve, its GreenLot, its InventoryFinancingLine"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: calc_financing_utilization
    description: "Utilization ratio for the financing line; informational, not a state driver"
    trigger: "on FinancingReserve create/release"
    algorithm: aggregation
    formula: |
      if line.collateral_value_usd == 0: return null
      return line.utilized_usd / line.collateral_value_usd
    input_set: "Single InventoryFinancingLine"
    constants: {}
    precision: "ratio computed at full float precision"
    variants: []

  - name: calc_blend_allocation
    description: "Given a RoastBatch and its pinned recipe, allocate green lot mass across components honoring substitution rules and inventory availability"
    trigger: "on POST /roastery/roast-batches (creates batch with its RoastInputAllocation rows in one call)"
    algorithm: waterfall_allocation
    formula: |
      For each RecipeComponent of the pinned recipe, in order of component.component_pct DESC,
      tie-break by component.created_at ASC:
        component_target_lbs = round_half_up(scheduled_green_lbs * component.component_pct, 0)  # round per-line to integer lbs
        # Adjust final component so that the sum exactly equals scheduled_green_lbs (remainder goes to the LARGEST component by pct;
        # if pct tie, the component with earliest created_at).
        eligible_lots_primary = GreenLot where lot_status == RELEASED AND grade == component.required_grade
          ORDER BY green_lot.created_at ASC  # oldest lot first (FIFO by receipt)
        eligible_lots_substitute = GreenLot where lot_status == RELEASED AND grade == component.substitution_grade
          ORDER BY green_lot.created_at ASC
        substitution_cap_lbs = floor(component_target_lbs * component.substitution_max_pct) if substitution_grade is set else 0
        # Waterfall: fill from primary first up to component_target_lbs; shortfall may be filled from substitute up to substitution_cap_lbs;
        # if still short, the batch creation fails with ERR_INSUFFICIENT_GREEN_INVENTORY.
        allocated = 0
        for lot in eligible_lots_primary:
          take = min(lot.available_lbs, component_target_lbs - allocated)
          if take > 0: create RoastInputAllocation(lot, component, take, is_substitution=false); allocated += take
          if allocated == component_target_lbs: break
        if allocated < component_target_lbs and substitution_cap_lbs > 0:
          sub_allocated = 0
          for lot in eligible_lots_substitute:
            take = min(lot.available_lbs, component_target_lbs - allocated, substitution_cap_lbs - sub_allocated)
            if take > 0: create RoastInputAllocation(lot, component, take, is_substitution=true); allocated += take; sub_allocated += take
            if allocated == component_target_lbs: break
        if allocated < component_target_lbs:
          raise ERR_INSUFFICIENT_GREEN_INVENTORY
    input_set: "Pinned BlendRecipe + its RecipeComponent rows; GreenLot rows in lot_status = RELEASED ordered by created_at ASC"
    constants: {}
    precision: "integer pounds; round per-component then adjust largest component to reconcile"
    variants: []

  - name: calc_yield_variance
    description: "Compares actual batch shrinkage against profile expectation, flagging out-of-band batches"
    trigger: "on RoastBatch IN_DRUM → ROASTED"
    algorithm: threshold
    formula: |
      actual_yield_loss_pct = 1 - actual_roasted_lbs / scheduled_green_lbs  # 5 decimals
      expected = product.target_roast_profile.expected_yield_loss_pct
      band = product.target_roast_profile.shrinkage_alert_band_pct
      if actual_yield_loss_pct > expected + band: return ABOVE_BAND     # strictly greater; at boundary is WITHIN_BAND
      elif actual_yield_loss_pct < expected - band: return BELOW_BAND   # strictly less; at boundary is WITHIN_BAND
      else: return WITHIN_BAND
    input_set: "Single RoastBatch + its Product + its RoastProfile"
    constants: {}
    precision: "5 decimals round_half_up for the ratio; boundary comparison at exact equality is WITHIN_BAND"
    variants: []

  - name: calc_cupping_final_score
    description: "SCA-style 100-point cup score: sum of 10 attributes minus defects"
    trigger: "on CuppingSession finalization (POST /roastery/cupping-sessions/{id}/finalize)"
    algorithm: weighted_scoring
    formula: |
      base = score_aroma + score_flavor + score_aftertaste + score_acidity + score_body
           + score_balance + score_uniformity + score_clean_cup + score_sweetness + score_overall
      final_score = base - defects_subtracted
      # verdict thresholds
      if subject_kind == GREEN_LOT:
        verdict = PASS if final_score >= 80.00 else FAIL     # specialty threshold; at exactly 80.00 is PASS
      else:  # ROAST_BATCH
        verdict = PASS if final_score >= 78.00 else FAIL     # roasted product threshold is lower
    input_set: "Single CuppingSession"
    constants:
      SPECIALTY_GREEN_THRESHOLD: 80.00
      ROASTED_BATCH_THRESHOLD: 78.00
    precision: "2 decimal places round_half_up for final_score; threshold comparison at exact boundary is PASS (>=)"
    variants: []

  - name: calc_hedge_realized_pnl
    description: "Dollar P&L on a lifted futures hedge"
    trigger: "on FuturesHedge APPROVED → LIFTED (manual or auto)"
    algorithm: aggregation
    formula: |
      if hedge_side == BUY_FUTURES:
        realized_pnl_usd = (exit_price_usd_per_lb - entry_price_usd_per_lb) * hedge_lbs
      else:  # SELL_FUTURES
        realized_pnl_usd = (entry_price_usd_per_lb - exit_price_usd_per_lb) * hedge_lbs
    input_set: "Single FuturesHedge"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: calc_freshness_sellable_until
    description: "Compute the freshness cutoff for a FinishedGoodsLot"
    trigger: "on RoastBatch ROASTED → PACKED (when FinishedGoodsLot is created)"
    algorithm: chronological
    formula: |
      sellable_until = roast_batch.roast_completed_at + product.freshness_days * 86400 seconds
      # Comparison is strict: at current_time == sellable_until the lot is still FRESH;
      # only current_time > sellable_until flips to STALE.
    input_set: "Single FinishedGoodsLot + parent RoastBatch + Product"
    constants: {}
    precision: "ISO8601 timestamp to the second"
    variants: []

  - name: calc_disputed_lot_landed_cost
    description: "Recomputed landed cost when a failed-cup lot is accepted at a discount"
    trigger: "on Shipment dispute RESOLVED_ACCEPTED"
    algorithm: aggregation
    formula: |
      # discount_pct provided in the resolve-dispute call
      new_landed_cost = original_landed_cost * (1 - discount_pct)
    input_set: "Single GreenLot + dispute-resolution payload"
    constants: {}
    precision: "5 decimal places, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role declared in X-User-Role is a recognized role name"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role is authorized to invoke this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every id referenced in the path exists; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every FK id referenced in the request body exists"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 6
    category: state
    check: "Entity referenced in path is in a state that permits this operation per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "For OCC-guarded endpoints, expected_<parent>_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /roastery/contracts/{contract_id}/price-fixes, POST /roastery/contracts/{contract_id}/short-close, POST /roastery/recipes/{recipe_id}/approve"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: FuturesHedge approver X-User-ID != submitting Trader X-User-ID recorded at hedge creation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /roastery/futures-hedges/{hedge_id}/approve"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: CuppingSession finalizer (QAGrader) cannot be the RoastOperator who ran the batch (when subject_kind = ROAST_BATCH)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /roastery/cupping-sessions/{session_id}/finalize"

  - priority: 10
    category: business_constraint
    check: "Recipe component percentages sum to exactly 1.00000 at recipe approval"
    error_id: ERR_RECIPE_COMPONENT_SUM_INVALID
    http_status: 422
    applies_to: "POST /roastery/recipes/{recipe_id}/approve"

  - priority: 11
    category: business_constraint
    check: "Substitution configuration is internally consistent: substitution_grade non-null iff substitution_max_pct non-null; substitution_grade != required_grade"
    error_id: ERR_SUBSTITUTION_RULE_INVALID
    http_status: 422
    applies_to: "POST /roastery/recipes/{recipe_id}/components, POST /roastery/recipes/{recipe_id}/approve"

  - priority: 12
    category: business_fiscal
    check: "Price-fix would not push Counterparty.open_exposure_usd (provisional variant) above counterparty.credit_limit_usd"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /roastery/contracts/{contract_id}/price-fixes"

  - priority: 13
    category: business_fiscal
    check: "Price-fix cumulative fixed_lbs_accum + fix_lbs must not exceed contract.total_lbs"
    error_id: ERR_OVER_FIX
    http_status: 422
    applies_to: "POST /roastery/contracts/{contract_id}/price-fixes"

  - priority: 14
    category: business_fiscal
    check: "FinancingReserve creation: line.utilized_usd + new reserve_advance_usd <= line.facility_limit_usd"
    error_id: ERR_FACILITY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /roastery/financing-lines/{line_id}/reserves"

  - priority: 15
    category: business_constraint
    check: "RoastBatch creation: sufficient RELEASED green lot mass exists to satisfy all recipe components (primary + permitted substitution)"
    error_id: ERR_INSUFFICIENT_GREEN_INVENTORY
    http_status: 422
    applies_to: "POST /roastery/roast-batches"

  - priority: 16
    category: business_constraint
    check: "RoastBatch creation: pinned BlendRecipe is APPROVED and belongs to the specified product"
    error_id: ERR_RECIPE_NOT_APPROVED
    http_status: 422
    applies_to: "POST /roastery/roast-batches"

  - priority: 17
    category: business_constraint
    check: "FulfillmentOrder reservation: every referenced FinishedGoodsLot is FRESH at reservation time"
    error_id: ERR_STALE_GOODS
    http_status: 422
    applies_to: "POST /roastery/fulfillment-orders/{order_id}/reserve"

  - priority: 18
    category: business_constraint
    check: "FulfillmentOrder reservation: for each line, allocated_lbs <= FinishedGoodsLot.available_lbs"
    error_id: ERR_INSUFFICIENT_FINISHED_GOODS
    http_status: 422
    applies_to: "POST /roastery/fulfillment-orders/{order_id}/reserve"

  - priority: 19
    category: business_temporal
    check: "Shipment scheduled_arrival falls within contract delivery window [delivery_window_start, delivery_window_end] inclusive on both ends"
    error_id: ERR_DELIVERY_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /roastery/contracts/{contract_id}/shipments"

  - priority: 30
    category: business_constraint
    check: "Shipment planned_lbs plus sum of planned_lbs over sibling non-CANCELLED shipments of the same contract must not exceed contract.total_lbs (aggregate capacity overlap on the contract's fulfillment budget)"
    error_id: ERR_CONTRACT_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /roastery/contracts/{contract_id}/shipments"

  - priority: 20
    category: business_temporal
    check: "Contract delivery_window_end strictly after delivery_window_start"
    error_id: ERR_INVALID_DELIVERY_WINDOW
    http_status: 422
    applies_to: "POST /roastery/counterparties/{counterparty_id}/contracts"

  - priority: 21
    category: business_constraint
    check: "FinancingReserve reserved_lbs <= GreenLot.available_lbs at pledge time AND lot.lot_status == RELEASED"
    error_id: ERR_LOT_NOT_PLEDGEABLE
    http_status: 422
    applies_to: "POST /roastery/financing-lines/{line_id}/reserves"

  - priority: 22
    category: business_constraint
    check: "Enum fields: all enum values are members of the declared set; numeric ranges respected (e.g. advance_rate_pct in 0–1, score fields in 0–10 in 0.25 steps)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 23
    category: business_constraint
    check: "Required fields present; unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 24
    category: business_referential
    check: "RoastBatch pack: packed_lbs > 0 AND packed_lbs <= actual_roasted_lbs"
    error_id: ERR_INVALID_PACK_QUANTITY
    http_status: 422
    applies_to: "POST /roastery/roast-batches/{batch_id}/pack"

  - priority: 25
    category: business_fiscal
    check: "FuturesHedge approval: cumulative APPROVED hedge_lbs + this hedge_lbs <= contract.unpriced_lbs at approval time"
    error_id: ERR_OVER_HEDGE
    http_status: 422
    applies_to: "POST /roastery/futures-hedges/{hedge_id}/approve"

  - priority: 26
    category: business_constraint
    check: "Price-fix fix_lbs > 0; futures_price_usd_per_lb > 0"
    error_id: ERR_INVALID_FIX_QUANTITY
    http_status: 422
    applies_to: "POST /roastery/contracts/{contract_id}/price-fixes"

  - priority: 27
    category: state
    check: "CuppingSession subject_id resolves to an entity matching subject_kind AND the subject is in a cuppable state (GreenLot in QUARANTINE; RoastBatch in qc_status = PENDING_QC)"
    error_id: ERR_NOT_CUPPABLE
    http_status: 409
    applies_to: "POST /roastery/cupping-sessions, POST /roastery/cupping-sessions/{session_id}/finalize"

  - priority: 28
    category: business_constraint
    check: "CuppingSession finalization: panelist_count >= 3"
    error_id: ERR_PANEL_TOO_SMALL
    http_status: 422
    applies_to: "POST /roastery/cupping-sessions/{session_id}/finalize"

  - priority: 29
    category: business_constraint
    check: "RoastBatch finish: actual_roasted_lbs > 0 AND actual_roasted_lbs < scheduled_green_lbs"
    error_id: ERR_INVALID_YIELD
    http_status: 422
    applies_to: "POST /roastery/roast-batches/{batch_id}/finish"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Counterparty ---
  - method: POST
    path: "/roastery/counterparties"
    description: "Register a new counterparty (supplier, importer, or customer)"
    roles: [Trader]
    code: 201
    input: [counterparty_ref, legal_name, counterparty_kind, credit_limit_usd]
    output: Counterparty
    side_effects: ["counterparty_status = ACTIVE", "open_exposure_usd = 0"]

  - method: GET
    path: "/roastery/counterparties/{id}"
    description: "Fetch one counterparty"
    roles: [Trader, RiskManager, HeadRoaster, FulfillmentPlanner]
    code: 200
    input: []
    output: Counterparty
    side_effects: []

  - method: GET
    path: "/roastery/counterparties"
    description: "List counterparties; supports counterparty_kind filter"
    roles: [Trader, RiskManager, HeadRoaster, FulfillmentPlanner]
    code: 200
    input: ["counterparty_kind?", "limit?", "offset?"]
    output: Counterparty[]
    side_effects: []

  # --- Contract ---
  - method: POST
    path: "/roastery/counterparties/{counterparty_id}/contracts"
    description: "Book a green coffee contract with a counterparty"
    roles: [Trader]
    code: 201
    input: [contract_ref, pricing_mode, coffee_grade, total_lbs, "fixed_price_usd_per_lb?", "differential_usd_per_lb?", delivery_window_start, delivery_window_end]
    output: Contract
    side_effects:
      - "pricing_status = UNFIXED for DIFFERENTIAL_PTBF, NOT_APPLICABLE for FIXED_OUTRIGHT"
      - "fulfillment_status = OPEN"
      - "fixed_lbs_accum = 0 (or total_lbs for FIXED_OUTRIGHT)"
      - "priced_notional_usd computed"
      - "Counterparty.open_exposure_usd recomputed"

  - method: GET
    path: "/roastery/contracts/{id}"
    description: "Fetch one contract"
    roles: [Trader, RiskManager, LogisticsCoordinator]
    code: 200
    input: []
    output: Contract
    side_effects: []

  - method: GET
    path: "/roastery/contracts"
    description: "List contracts; supports counterparty_id / pricing_status / fulfillment_status filters"
    roles: [Trader, RiskManager, LogisticsCoordinator]
    code: 200
    input: ["counterparty_id?", "pricing_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []

  - method: POST
    path: "/roastery/contracts/{contract_id}/price-fixes"
    description: "Record a price-fix event against a PTBF contract (converts unpriced lbs to priced at a futures level); OCC-guarded"
    roles: [Trader]
    code: 201
    input: [fix_lbs, futures_price_usd_per_lb, expected_contract_version]
    output: PriceFixEvent
    side_effects:
      - "Appends PriceFixEvent"
      - "Contract.fixed_lbs_accum += fix_lbs; weighted_avg_fixed_futures_usd recomputed; priced_notional_usd recomputed; unpriced_lbs recomputed"
      - "Contract.pricing_status may transition UNFIXED → PARTIALLY_FIXED → FULLY_FIXED"
      - "If Contract reaches FULLY_FIXED: all APPROVED FuturesHedge for this contract auto-LIFTED"
      - "Counterparty.open_exposure_usd recomputed"
      - "increments Contract.version by 1"

  - method: GET
    path: "/roastery/contracts/{id}/price-fixes"
    description: "List price-fix events for a contract"
    roles: [Trader, RiskManager]
    code: 200
    input: ["limit?", "offset?"]
    output: PriceFixEvent[]
    side_effects: []

  - method: POST
    path: "/roastery/contracts/{contract_id}/short-close"
    description: "Write off the un-received shortfall of a partially received contract; OCC-guarded"
    roles: [Trader]
    code: 200
    input: [expected_contract_version]
    output: Contract
    side_effects:
      - "fulfillment_status → SHORT_CLOSED"
      - "unpriced_lbs = 0"
      - "WORKING/APPROVED FuturesHedge rows for this contract → CANCELLED"
      - "Counterparty.open_exposure_usd recomputed"
      - "increments Contract.version by 1"

  - method: POST
    path: "/roastery/contracts/{contract_id}/cancel"
    description: "Cancel an unshipped, unfixed contract"
    roles: [Trader]
    code: 200
    input: []
    output: Contract
    side_effects:
      - "fulfillment_status → CANCELLED"
      - "Counterparty.open_exposure_usd recomputed"
      - "increments Contract.version by 1"

  # --- Shipment ---
  - method: POST
    path: "/roastery/contracts/{contract_id}/shipments"
    description: "Book a shipment against a contract"
    roles: [LogisticsCoordinator]
    code: 201
    input: [shipment_ref, planned_lbs, scheduled_arrival]
    output: Shipment
    side_effects:
      - "transit_status = BOOKED; qc_status = NOT_REQUIRED; dispute_status = NONE"

  - method: GET
    path: "/roastery/shipments/{id}"
    description: "Fetch one shipment"
    roles: [Trader, LogisticsCoordinator, WarehouseClerk, QAGrader]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/roastery/contracts/{id}/shipments"
    description: "List shipments for a contract"
    roles: [Trader, LogisticsCoordinator, WarehouseClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/roastery/shipments/{shipment_id}/depart"
    description: "Mark shipment IN_TRANSIT"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["increments Shipment.version by 1"]

  - method: POST
    path: "/roastery/shipments/{shipment_id}/arrive"
    description: "Mark shipment ARRIVED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["increments Shipment.version by 1"]

  - method: POST
    path: "/roastery/shipments/{shipment_id}/receive"
    description: "Receive a shipment into the warehouse; creates the GreenLot child"
    roles: [WarehouseClerk]
    code: 200
    input: [received_lbs, lot_code, moisture_pct, warehouse_location]
    output: Shipment
    side_effects:
      - "transit_status ARRIVED → RECEIVED"
      - "qc_status NOT_REQUIRED → PENDING_CUP"
      - "Creates GreenLot child (lot_status = QUARANTINE, landed_cost_usd_per_lb via calc_landed_cost_at_receipt)"
      - "Contract.received_lbs_accum recomputed; fulfillment_status may transition"
      - "increments Shipment.version by 1; increments Contract.version by 1"

  - method: POST
    path: "/roastery/shipments/{shipment_id}/cancel"
    description: "Cancel a BOOKED shipment"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["increments Shipment.version by 1"]

