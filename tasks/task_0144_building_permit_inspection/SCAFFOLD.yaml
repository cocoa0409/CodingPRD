scenario: "Building Permit & Inspection: permit application/plan review, valuation-based fee, inspection scheduling (rough/final), correction notice, contractor license/bond verification, certificate of occupancy, stop-work order, expiration/renewal"
domain_name: building-permit-inspection
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys; no entity nesting in URL paths. A
  # PermitApplication references a Contractor and a Jurisdiction by FK; PlanReview,
  # Inspection, StopWorkOrder, CertificateOfOccupancy, FeePayment, CorrectionNotice
  # and PermitEvent all reference PermitApplication by FK. Inspection references an
  # InspectionSlot and an Inspector by FK.

  state_machine_shape: cyclic
  # PermitApplication carries a cyclic plan-review loop (UNDER_REVIEW -> CORRECTIONS_REQUIRED
  # -> UNDER_REVIEW) plus a branching issuance/closeout path; Inspection carries a
  # branching PASS/FAIL fork with a re-request cycle; StopWorkOrder carries a parallel
  # gating dimension. Not a single linear pipeline.

  relationship_patterns:
    - one_to_many        # PermitApplication -> PlanReview / Inspection / FeePayment / StopWorkOrder / PermitEvent
    - flat_references    # PermitApplication -> Contractor, Jurisdiction; Inspection -> InspectionSlot, Inspector
    - cross_aggregate    # Inspection scheduling reads Contractor.license/bond posture and StopWorkOrder posture

  role_model: segregation_of_duties
  # The PlanReviewer who approves a permit's plan review cannot also perform that
  # permit's final building inspection (same person cannot do design approval and
  # field sign-off). Inspector and PlanReviewer are distinct entity-backed roles;
  # PermitClerk and BuildingOfficial are operator roles.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Jurisdiction display name"
      - name: code_edition
        type: string
        source: input
        description: "Adopted building-code edition label, e.g. IBC-2021"
      - name: valuation_fee_rate_per_1000
        type: number
        source: input
        description: "Dollars of base permit fee charged per $1000 of project valuation (used by valuation-method fee)"
        constraints: ">= 0"
      - name: square_foot_rate
        type: number
        source: input
        description: "Dollars of construction value imputed per square foot (used by square-foot-method fee)"
        constraints: ">= 0"
      - name: plan_review_fee_pct
        type: number
        source: input
        description: "Plan-review surcharge as a fraction of the base permit fee, e.g. 0.65"
        constraints: ">= 0"
      - name: minimum_permit_fee
        type: number
        source: input
        description: "Floor applied to the base permit fee after tiering"
        constraints: ">= 0"
      - name: renewal_fee_pct
        type: number
        source: input
        description: "Renewal fee as a fraction of the original total fee"
        constraints: ">= 0"
        default: 0.5
      - name: permit_valid_days
        type: integer
        source: input
        description: "Number of days a permit remains valid from issuance before expiring"
        constraints: ">= 1"
        default: 180

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: business_name
        type: string
        source: input
        description: "Contractor business name"
      - name: license_number
        type: string
        source: input
        description: "State contractor license number"
        constraints: "unique across Contractor"
      - name: license_status
        type: enum
        source: input
        description: "License standing"
        constraints: "one of {ACTIVE, SUSPENDED, EXPIRED}"
        default: ACTIVE
      - name: license_expiry
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the license lapses; license treated as not-current when current clock >= this value"
      - name: bond_amount
        type: number
        source: input
        description: "Surety bond face amount in dollars"
        constraints: ">= 0"
      - name: bond_status
        type: enum
        source: input
        description: "Bond standing"
        constraints: "one of {VERIFIED, UNVERIFIED, REVOKED}"
        default: UNVERIFIED
      - name: verification_status
        type: enum
        source: computed
        description: "Derived overall verification posture combining license_status, license_expiry vs clock, bond_status and bond_amount; see calculations.contractor_verification_posture"
        constraints: "one of {VERIFIED, FAILED}"

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id"
      - name: work_class
        type: enum
        source: input
        description: "Construction work classification"
        constraints: "one of {NEW_CONSTRUCTION, ADDITION, ALTERATION, REPAIR}"
      - name: fee_method
        type: enum
        source: input
        description: "Which fee algorithm to apply"
        constraints: "one of {VALUATION, SQUARE_FOOT}"
      - name: declared_valuation
        type: number
        source: input
        description: "Owner-declared project valuation in dollars (used when fee_method=VALUATION)"
        constraints: ">= 0"
        default: 0
      - name: floor_area_sqft
        type: number
        source: input
        description: "Conditioned floor area in square feet (used when fee_method=SQUARE_FOOT)"
        constraints: ">= 0"
        default: 0
      - name: assessed_valuation
        type: number
        source: computed
        description: "Valuation the fee is actually computed against; see calculations.assessed_valuation"
      - name: base_permit_fee
        type: number
        source: computed
        description: "Tiered base fee before plan-review surcharge; see calculations.base_permit_fee"
      - name: plan_review_fee
        type: number
        source: computed
        description: "Plan-review surcharge; see calculations.total_permit_fee"
      - name: total_permit_fee
        type: number
        source: computed
        description: "base_permit_fee + plan_review_fee, rounded; see calculations.total_permit_fee"
      - name: amount_paid
        type: number
        source: computed
        description: "Sum of FeePayment.amount for this permit with payment_status=CLEARED; see calculations.amount_paid"
      - name: balance_due
        type: number
        source: computed
        description: "total_permit_fee + accrued_renewal_fees - amount_paid; see calculations.balance_due"
      - name: accrued_renewal_fees
        type: number
        source: computed
        description: "Sum of renewal fees added by RENEW transitions; see calculations.balance_due"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle status; see state_machines.PermitApplication"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, CORRECTIONS_REQUIRED, APPROVED, ISSUED, EXPIRED, FINALED, WITHDRAWN}"
        default: SUBMITTED
      - name: work_status
        type: enum
        source: computed
        description: "Parallel field-work gating dimension independent of status; see state_machines.PermitApplication note on parallel dimensions"
        constraints: "one of {NOT_STARTED, ACTIVE, STOPPED}"
        default: NOT_STARTED
      - name: open_correction_count
        type: integer
        source: computed
        description: "Count of CorrectionNotice rows for this permit with item_status=OPEN; gates RESUBMIT and plan-review re-approval"
        default: 0
      - name: review_cycle
        type: integer
        source: computed
        description: "Number of completed plan-review cycles; increments each time the permit re-enters UNDER_REVIEW from CORRECTIONS_REQUIRED"
        default: 0
      - name: issued_at
        type: datetime
        source: computed
        description: "Clock instant captured at the SUBMITTED/APPROVED -> ISSUED transition"
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + Jurisdiction.permit_valid_days; recomputed on RENEW; see calculations.expires_at"
      - name: approving_reviewer_id
        type: string
        source: computed
        description: "FK -> PlanReviewer.id; set to the PlanReviewer who drove the final APPROVE; used by the segregation-of-duties check on FINAL inspection"

  - name: PlanReview
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> PlanReviewer.id"
      - name: cycle_number
        type: integer
        source: computed
        description: "The permit review_cycle value at the time this review row was opened"
      - name: decision
        type: enum
        source: computed
        description: "Reviewer's decision; see state_machines.PlanReview"
        constraints: "one of {PENDING, APPROVED, CORRECTIONS}"
        default: PENDING
      - name: review_status
        type: enum
        source: computed
        description: "Lifecycle status of this review row; see state_machines.PlanReview"
        constraints: "one of {OPEN, COMPLETED}"
        default: OPEN

  - name: CorrectionNotice
    parent: null
    common_fields: true
    fields:
      - name: plan_review_id
        type: string
        source: input
        description: "FK -> PlanReview.id"
      - name: permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: code_section
        type: string
        source: input
        description: "Cited code section, e.g. R311.7"
      - name: description
        type: string
        source: input
        description: "What must be corrected"
      - name: item_status
        type: enum
        source: computed
        description: "Whether the correction has been cleared; see state_machines.CorrectionNotice"
        constraints: "one of {OPEN, RESOLVED}"
        default: OPEN

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Inspector name"
      - name: badge_number
        type: string
        source: input
        description: "Inspector badge id"
        constraints: "unique across Inspector"

  - name: PlanReviewer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Plan reviewer name"
      - name: cert_number
        type: string
        source: input
        description: "Plan-reviewer certification id"
        constraints: "unique across PlanReviewer"

  - name: InspectionSlot
    parent: null
    common_fields: true
    fields:
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id"
      - name: window_start
        type: datetime
        source: input
        description: "ISO 8601 UTC start of the inspector's availability window (inclusive)"
      - name: window_end
        type: datetime
        source: input
        description: "ISO 8601 UTC end of the inspector's availability window (exclusive)"
        constraints: "window_end > window_start"
      - name: max_inspections
        type: integer
        source: input
        description: "Aggregate capacity: max number of booked Inspection rows whose interval falls inside this window"
        constraints: ">= 1"
        default: 1
      - name: booked_count
        type: integer
        source: computed
        description: "Count of Inspection rows referencing this slot with inspection_status in {SCHEDULED, PASSED, FAILED}; see calculations.slot_booked_count"
        default: 0

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: slot_id
        type: string
        source: input
        description: "FK -> InspectionSlot.id"
      - name: inspector_id
        type: string
        source: computed
        description: "FK -> Inspector.id; copied from the chosen InspectionSlot.inspector_id at scheduling"
      - name: inspection_type
        type: enum
        source: input
        description: "Stage of inspection"
        constraints: "one of {ROUGH, FINAL}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC requested start of this inspection (inclusive)"
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC requested end of this inspection (exclusive)"
        constraints: "scheduled_end > scheduled_start"
      - name: inspection_status
        type: enum
        source: computed
        description: "Lifecycle of this inspection; see state_machines.Inspection"
        constraints: "one of {SCHEDULED, PASSED, FAILED, CANCELLED}"
        default: SCHEDULED

  - name: StopWorkOrder
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: reason
        type: string
        source: input
        description: "Why work was halted"
      - name: order_status
        type: enum
        source: computed
        description: "Whether the order is in force; see state_machines.StopWorkOrder"
        constraints: "one of {ACTIVE, LIFTED}"
        default: ACTIVE

  - name: CertificateOfOccupancy
    parent: null
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: system
        description: "FK -> PermitApplication.id; set by the cascade that creates this row"
      - name: final_inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the passed FINAL inspection that authorizes the certificate, set by the cascade"
      - name: co_type
        type: enum
        source: computed
        description: "Certificate kind; set by the cascade that creates this row on a FINAL inspection PASS"
        constraints: "one of {FINAL}"
        default: FINAL
      - name: co_status
        type: enum
        source: computed
        description: "Whether the certificate stands; see state_machines.CertificateOfOccupancy"
        constraints: "one of {ISSUED, REVOKED}"
        default: ISSUED

  - name: FeePayment
    parent: null
    common_fields: false
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: amount
        type: number
        source: input
        description: "Payment amount in dollars"
        constraints: "> 0"
      - name: payment_status
        type: enum
        source: input
        description: "Whether the payment cleared (append-only; counts toward amount_paid only when CLEARED)"
        constraints: "one of {CLEARED, VOID}"
        default: CLEARED

  - name: PermitEvent
    parent: null
    common_fields: false
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> PermitApplication.id"
      - name: event_type
        type: enum
        source: system
        description: "Audit event kind appended on every PermitApplication transition and on stop-work / CofO / correction changes"
        constraints: "one of {SUBMITTED, REVIEW_OPENED, CORRECTIONS_REQUIRED, RESUBMITTED, APPROVED, ISSUED, INSPECTION_SCHEDULED, INSPECTION_PASSED, INSPECTION_FAILED, STOP_WORK_ISSUED, STOP_WORK_LIFTED, CO_ISSUED, CO_REVOKED, RENEWED, EXPIRED, WITHDRAWN}"
      - name: detail
        type: string
        source: system
        description: "Human-readable audit detail"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PermitApplication
    initial_state: SUBMITTED
    terminal_states: [FINALED, WITHDRAWN]
    note: |
      Two independent dimensions evolve on the same row: `status` (the review/issuance
      lifecycle below) and `work_status` (NOT_STARTED -> ACTIVE -> STOPPED), which is a
      parallel gating dimension driven by StopWorkOrder issue/lift. EXPIRED is reachable
      from ISSUED via the clock-driven expire transition; FINALED requires a passed FINAL
      inspection AND balance_due == 0.
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /permits/{id}/reviews (open a plan review)"
        actor: PlanReviewer
        preconditions:
          - "permit.status == SUBMITTED"
          - "no OPEN PlanReview exists for this permit"
        side_effects:
          - "create PlanReview {review_status: OPEN, decision: PENDING, cycle_number = permit.review_cycle}"
          - "append PermitEvent {event_type: REVIEW_OPENED}"
          - "increment PermitApplication.version by 1"
      - from: UNDER_REVIEW
        to: CORRECTIONS_REQUIRED
        trigger: "POST /reviews/{id}/decide with decision=CORRECTIONS (>=1 correction notice attached)"
        actor: PlanReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "the acting PlanReviewer is PlanReview.reviewer_id"
          - "at least one CorrectionNotice with item_status=OPEN exists for this PlanReview"
        side_effects:
          - "set PlanReview.decision=CORRECTIONS, review_status=COMPLETED"
          - "recompute PermitApplication.open_correction_count from OPEN CorrectionNotice rows"
          - "append PermitEvent {event_type: CORRECTIONS_REQUIRED}"
          - "increment PermitApplication.version by 1"
      - from: CORRECTIONS_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /permits/{id}/resubmit"
        actor: Applicant
        preconditions:
          - "permit.status == CORRECTIONS_REQUIRED"
          - "open_correction_count == 0 (every CorrectionNotice for the latest review is RESOLVED)"
        side_effects:
          - "increment PermitApplication.review_cycle by 1"
          - "create a fresh PlanReview {review_status: OPEN, decision: PENDING, cycle_number = new review_cycle}"
          - "append PermitEvent {event_type: RESUBMITTED}"
          - "increment PermitApplication.version by 1"
        note: "Cycle: CORRECTIONS_REQUIRED -> UNDER_REVIEW re-enters the review loop (cyclic shape)."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /reviews/{id}/decide with decision=APPROVED"
        actor: PlanReviewer
        preconditions:
          - "permit.status == UNDER_REVIEW"
          - "the acting PlanReviewer is PlanReview.reviewer_id"
          - "open_correction_count == 0"
        side_effects:
          - "set PlanReview.decision=APPROVED, review_status=COMPLETED"
          - "set PermitApplication.approving_reviewer_id = PlanReview.reviewer_id"
          - "append PermitEvent {event_type: APPROVED}"
          - "increment PermitApplication.version by 1"
      - from: APPROVED
        to: ISSUED
        trigger: "POST /permits/{id}/issue (expected_permit_application_version required)"
        actor: PermitClerk
        preconditions:
          - "permit.status == APPROVED"
          - "balance_due == 0 (full fee paid)"
          - "Contractor.verification_status == VERIFIED (license ACTIVE & current, bond VERIFIED & bond_amount >= required)"
        side_effects:
          - "set issued_at = current clock; set expires_at = issued_at + Jurisdiction.permit_valid_days days"
          - "set work_status = ACTIVE"
          - "append PermitEvent {event_type: ISSUED}"
          - "increment PermitApplication.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /_clock/advance crossing expires_at, then POST /permits/{id}/expire (system sweep)"
        actor: system
        preconditions:
          - "permit.status == ISSUED"
          - "current clock >= expires_at"
          - "no CertificateOfOccupancy with co_status=ISSUED exists for this permit"
        side_effects:
          - "set work_status = STOPPED"
          - "cancel every Inspection for this permit whose inspection_status == SCHEDULED (set CANCELLED)"
          - "append PermitEvent {event_type: EXPIRED}"
          - "increment PermitApplication.version by 1"
        note: "Cascade origin: EXPIRED -> cancels SCHEDULED inspections -> each cancel frees its InspectionSlot.booked_count."
      - from: EXPIRED
        to: ISSUED
        trigger: "POST /permits/{id}/renew (expected_permit_application_version required)"
        actor: PermitClerk
        preconditions:
          - "permit.status == EXPIRED"
          - "Contractor.verification_status == VERIFIED"
        side_effects:
          - "add renewal fee = round(total_permit_fee * Jurisdiction.renewal_fee_pct, 2) to accrued_renewal_fees (recompute balance_due)"
          - "set issued_at = current clock; set expires_at = issued_at + Jurisdiction.permit_valid_days days"
          - "set work_status = ACTIVE"
          - "append PermitEvent {event_type: RENEWED}"
          - "increment PermitApplication.version by 1"
        note: "Cycle: ISSUED -> EXPIRED -> ISSUED renewal loop."
      - from: ISSUED
        to: FINALED
        trigger: "POST /permits/{id}/finalize"
        actor: BuildingOfficial
        preconditions:
          - "permit.status == ISSUED"
          - "work_status != STOPPED (no ACTIVE StopWorkOrder)"
          - "a CertificateOfOccupancy with co_status=ISSUED exists for this permit"
          - "balance_due == 0"
        side_effects:
          - "append PermitEvent {event_type: ISSUED is NOT re-applied; closeout audit detail recorded}"
          - "increment PermitApplication.version by 1"
        note: "Terminal success state; work_status is left as-is (ACTIVE)."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /permits/{id}/withdraw"
        actor: Applicant
        preconditions:
          - "permit.status in {SUBMITTED, UNDER_REVIEW, CORRECTIONS_REQUIRED, APPROVED}"
        side_effects:
          - "complete any OPEN PlanReview (review_status=COMPLETED)"
          - "append PermitEvent {event_type: WITHDRAWN}"
          - "increment PermitApplication.version by 1"
        note: "Allowed from SUBMITTED, UNDER_REVIEW, CORRECTIONS_REQUIRED, APPROVED (any pre-issuance status). Not allowed once ISSUED."

  - name_note: "work_status parallel dimension on PermitApplication"
    entity: PermitApplication
    initial_state: NOT_STARTED
    terminal_states: []
    note: "Second (parallel) state axis on the same PermitApplication row, driven by StopWorkOrder. NOT_STARTED set at create; ACTIVE on ISSUE/RENEW; STOPPED while an ACTIVE StopWorkOrder exists."
    transitions:
      - from: ACTIVE
        to: STOPPED
        trigger: "POST /permits/{id}/stop-work-orders"
        actor: BuildingOfficial
        preconditions:
          - "permit.work_status == ACTIVE"
          - "permit.status == ISSUED"
        side_effects:
          - "create StopWorkOrder {order_status: ACTIVE}"
          - "cancel every Inspection for this permit whose inspection_status == SCHEDULED (set CANCELLED)"
          - "append PermitEvent {event_type: STOP_WORK_ISSUED}"
          - "increment PermitApplication.version by 1"
        note: "Cascade origin: STOP_WORK_ISSUED -> cancels SCHEDULED inspections -> each cancel frees its InspectionSlot.booked_count."
      - from: STOPPED
        to: ACTIVE
        trigger: "POST /stop-work-orders/{id}/lift"
        actor: BuildingOfficial
        preconditions:
          - "the StopWorkOrder.order_status == ACTIVE"
          - "no other StopWorkOrder for this permit has order_status == ACTIVE"
        side_effects:
          - "set StopWorkOrder.order_status = LIFTED"
          - "set permit.work_status = ACTIVE"
          - "append PermitEvent {event_type: STOP_WORK_LIFTED}"
          - "increment PermitApplication.version by 1"

  - entity: PlanReview
    initial_state: OPEN
    terminal_states: [COMPLETED]
    note: "Branching fork on decision: OPEN -> {APPROVED, CORRECTIONS} with divergent side-effect sets."
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /reviews/{id}/decide with decision=APPROVED"
        actor: PlanReviewer
        preconditions:
          - "review_status == OPEN"
          - "the acting PlanReviewer is PlanReview.reviewer_id"
          - "permit.open_correction_count == 0"
        side_effects:
          - "set decision=APPROVED, review_status=COMPLETED"
          - "drive PermitApplication UNDER_REVIEW -> APPROVED (cross-entity)"
        note: "APPROVED branch: no correction side effects."
      - from: OPEN
        to: COMPLETED
        trigger: "POST /reviews/{id}/decide with decision=CORRECTIONS"
        actor: PlanReviewer
        preconditions:
          - "review_status == OPEN"
          - "the acting PlanReviewer is PlanReview.reviewer_id"
          - "at least one CorrectionNotice with item_status=OPEN exists for this PlanReview"
        side_effects:
          - "set decision=CORRECTIONS, review_status=COMPLETED"
          - "drive PermitApplication UNDER_REVIEW -> CORRECTIONS_REQUIRED (cross-entity)"
        note: "CORRECTIONS branch: divergent side effect — bumps open_correction_count, blocks issuance."

  - entity: CorrectionNotice
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /correction-notices/{id}/resolve"
        actor: Applicant
        preconditions:
          - "item_status == OPEN"
          - "the parent permit.status == CORRECTIONS_REQUIRED"
        side_effects:
          - "set item_status = RESOLVED"
          - "recompute PermitApplication.open_correction_count (decrement)"
          - "increment PermitApplication.version by 1"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, CANCELLED]
    note: |
      Branching fork on result: SCHEDULED -> {PASSED, FAILED}. FAILED is non-terminal — a
      failed inspection can be re-requested (a new Inspection row is created). A FINAL PASS
      cascades into CofO issuance.
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/result with outcome=PASS"
        actor: Inspector
        preconditions:
          - "inspection_status == SCHEDULED"
          - "permit.status == ISSUED"
          - "permit.work_status != STOPPED"
          - "for inspection_type=FINAL: the acting Inspector.id != permit.approving_reviewer_id (segregation of duties — the plan approver may not field-sign the final)"
          - "for inspection_type=FINAL: a PASSED ROUGH Inspection exists for this permit"
        side_effects:
          - "set inspection_status = PASSED"
          - "append PermitEvent {event_type: INSPECTION_PASSED}"
          - "if inspection_type=FINAL: cascade create CertificateOfOccupancy {co_status: ISSUED, final_inspection_id = this.id}; that creation appends PermitEvent {event_type: CO_ISSUED}"
        note: "Cascade origin: INSPECTION_PASSED(FINAL) -> CofO created -> CofO.created appends CO_ISSUED audit + unlocks FINALED precondition."
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/result with outcome=FAIL"
        actor: Inspector
        preconditions:
          - "inspection_status == SCHEDULED"
          - "permit.status == ISSUED"
        side_effects:
          - "set inspection_status = FAILED"
          - "append PermitEvent {event_type: INSPECTION_FAILED}"
        note: "FAILED is non-terminal: applicant may schedule a new Inspection of the same type."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspections/{id}/cancel OR cascade from STOP_WORK_ISSUED / EXPIRED"
        actor: Applicant
        preconditions:
          - "inspection_status == SCHEDULED"
        side_effects:
          - "set inspection_status = CANCELLED"
          - "recompute InspectionSlot.booked_count (decrement, freeing capacity)"
        note: "Compensation: cancel reverses the slot booking so booked_count returns to its pre-schedule value."

  - entity: StopWorkOrder
    initial_state: ACTIVE
    terminal_states: [LIFTED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "POST /stop-work-orders/{id}/lift"
        actor: BuildingOfficial
        preconditions:
          - "order_status == ACTIVE"
        side_effects:
          - "set order_status = LIFTED"
          - "set parent permit.work_status = ACTIVE if no other ACTIVE StopWorkOrder remains"
          - "append PermitEvent {event_type: STOP_WORK_LIFTED}"

  - entity: CertificateOfOccupancy
    initial_state: ISSUED
    terminal_states: [REVOKED]
    transitions:
      - from: ISSUED
        to: REVOKED
        trigger: "POST /certificates/{id}/revoke OR cascade from STOP_WORK_ISSUED"
        actor: BuildingOfficial
        preconditions:
          - "co_status == ISSUED"
        side_effects:
          - "set co_status = REVOKED"
          - "append PermitEvent {event_type: CO_REVOKED}"
        note: "Cascade target: issuing a StopWorkOrder also revokes any ISSUED CofO for the permit (compliance lock)."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: issue-stale-permit-version
    parent_entity: PermitApplication
    write_endpoint: "POST /permits/{id}/issue"
    occ_field: "expected_permit_application_version"
    description: |
      Issuing a permit carries the permit version the clerk last observed. If the
      permit's version has advanced since then — because another clerk already
      issued it (legitimately moving APPROVED -> ISSUED and bumping the version) —
      the stale request is rejected on the version mismatch rather than attempting
      a second issuance.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
  - rule_id: renew-stale-permit-version
    parent_entity: PermitApplication
    write_endpoint: "POST /permits/{id}/renew"
    occ_field: "expected_permit_application_version"
    description: |
      Renewing an expired permit carries the version the clerk last observed. A
      renewal whose expected version no longer matches — because another clerk
      already renewed it (legitimately moving EXPIRED -> ISSUED, adding a renewal
      fee and bumping the version) — is rejected on the version mismatch so the
      renewal fee is never added twice.
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: assessed_valuation
    trigger: "on PermitApplication create and on any recompute of the fee"
    algorithm: forward_looking
    formula: |
      if fee_method == VALUATION:
          assessed_valuation = declared_valuation
      else:  # SQUARE_FOOT
          assessed_valuation = floor_area_sqft * Jurisdiction.square_foot_rate
    input_set: "the single PermitApplication being priced and its Jurisdiction"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: valuation_method
        when: "fee_method == VALUATION"
        difference: "assessed value is the owner's declared_valuation verbatim"
      - name: square_foot_method
        when: "fee_method == SQUARE_FOOT"
        difference: "assessed value is imputed = floor_area_sqft * square_foot_rate; declared_valuation ignored"

  - name: base_permit_fee
    trigger: "on PermitApplication create and on any recompute of the fee"
    algorithm: tiered_pricing
    formula: |
      # Progressive (marginal) tiers on assessed_valuation, NOT flat-rate on the whole value.
      # Tier rates are dollars per $1000 of valuation that falls inside each band.
      # The valuation_fee_rate_per_1000 from Jurisdiction scales the bands.
      v = assessed_valuation
      r = Jurisdiction.valuation_fee_rate_per_1000
      tier1 = min(v, 50000)                      # first $50k
      tier2 = min(max(v - 50000, 0), 450000)     # next $450k  (50k..500k)
      tier3 = max(v - 500000, 0)                 # above $500k
      raw = (tier1/1000)*r*1.00 + (tier2/1000)*r*0.80 + (tier3/1000)*r*0.60
      base_permit_fee = max(round(raw, 2), Jurisdiction.minimum_permit_fee)
    input_set: "the single PermitApplication and its Jurisdiction.valuation_fee_rate_per_1000 / minimum_permit_fee"
    constants:
      TIER1_CEILING: 50000
      TIER2_CEILING: 500000
      TIER1_MULT: 1.00
      TIER2_MULT: 0.80
      TIER3_MULT: 0.60
    precision: "2 decimal places, round_half_up; the minimum floor is applied AFTER rounding the tiered raw value"

  - name: total_permit_fee
    trigger: "on PermitApplication create; recomputed if fee inputs change before SUBMITTED leaves"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: round base, round plan-review surcharge of the
      # ROUNDED base, then sum. (round-each-then-sum, NOT round(base*(1+pct))).
      base = base_permit_fee                          # already rounded
      plan_review_fee = round(base * Jurisdiction.plan_review_fee_pct, 2)
      total_permit_fee = round(base + plan_review_fee, 2)
    input_set: "single PermitApplication; depends on base_permit_fee and Jurisdiction.plan_review_fee_pct"
    precision: "2 decimal places, round_half_up; round base first, round surcharge of rounded base, then sum (per-component rounding pinned)"

  - name: amount_paid
    trigger: "on read of PermitApplication and before any balance_due check"
    algorithm: aggregation
    formula: |
      amount_paid = sum(p.amount for p in FeePayment
                        where p.permit_id == permit.id and p.payment_status == CLEARED)
    input_set: "all FeePayment rows for this permit with payment_status == CLEARED (VOID excluded)"
    precision: "2 decimal places, round_half_up"

  - name: balance_due
    trigger: "before ISSUE, FINALIZE, and on read"
    algorithm: aggregation
    formula: |
      balance_due = round(total_permit_fee + accrued_renewal_fees - amount_paid, 2)
    input_set: "single PermitApplication; total_permit_fee + accrued_renewal_fees minus CLEARED payments"
    precision: "2 decimal places, round_half_up"
    note: "balance_due == 0 (exact) gates ISSUE and FINALIZE; > 0 blocks, < 0 (overpayment) does NOT block."

  - name: expires_at
    trigger: "on ISSUE and on RENEW"
    algorithm: projection
    formula: |
      expires_at = issued_at + (Jurisdiction.permit_valid_days days)
    input_set: "single PermitApplication issued_at + its Jurisdiction.permit_valid_days"
    precision: "datetime, UTC, millisecond"

  - name: contractor_verification_posture
    trigger: "on read of Contractor and as a precondition of ISSUE and RENEW"
    algorithm: threshold
    formula: |
      # Risk/eligibility scoring on the Contractor domain (distinct from fee accounting).
      license_current = (license_status == ACTIVE) and (current_clock < license_expiry)
      bond_ok = (bond_status == VERIFIED) and (bond_amount >= REQUIRED_BOND_FLOOR)
      verification_status = VERIFIED if (license_current and bond_ok) else FAILED
    input_set: "single Contractor; uses license_status, license_expiry vs clock, bond_status, bond_amount"
    constants:
      REQUIRED_BOND_FLOOR: 15000
    precision: "boolean composition; license_expiry comparison is strict < (license current only while clock < expiry; clock == expiry is NOT current)"
    note: "Boundary precision: clock == license_expiry => license NOT current (strict <); bond_amount == 15000 => bond_ok (>=)."
    variants:
      - name: license_leg
        when: "evaluating whether the license is current"
        difference: "FAILED is reached via license_status != ACTIVE OR current_clock >= license_expiry (strict <), independent of bond"
      - name: bond_leg
        when: "evaluating whether the bond is sufficient"
        difference: "FAILED is reached via bond_status != VERIFIED OR bond_amount < REQUIRED_BOND_FLOOR (>= boundary), independent of license"

  - name: slot_booked_count
    trigger: "on Inspection schedule (increment) and on Inspection cancel/expire-cascade (decrement)"
    algorithm: aggregation
    formula: |
      booked_count = count(i for i in Inspection
                           where i.slot_id == slot.id
                           and i.inspection_status in {SCHEDULED, PASSED, FAILED})
    input_set: "all Inspection rows referencing this InspectionSlot in a non-cancelled state"
    precision: "integer count"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path/body id references an existing resource, validated left-to-right"
    error_id: ERR_PERMIT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a resource id"
    note: "Resource-specific not-found ids: ERR_PERMIT_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_SWO_NOT_FOUND, ERR_CO_NOT_FOUND, ERR_CORRECTION_NOT_FOUND, ERR_JURISDICTION_NOT_FOUND"
  - priority: 4
    category: business_constraint
    check: "required body fields present and well-typed; enum values in declared sets"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all writes"
  - priority: 5
    category: business_constraint
    check: "license_number unique on Contractor create; badge_number unique on Inspector; cert_number unique on PlanReviewer"
    error_id: ERR_DUPLICATE_LICENSE
    http_status: 409
    applies_to: "POST /contractors, POST /inspectors, POST /plan-reviewers"
  - priority: 6
    category: state
    check: "target resource is in the correct state for the requested transition (state machine from: match); for inspection scheduling the parent PermitApplication.status must be ISSUED; for correction-notice attach the parent PlanReview.review_status must be OPEN"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints; POST /permits/{id}/inspections (parent permit must be ISSUED); POST /reviews/{id}/correction-notices (parent review must be OPEN)"
  - priority: 7
    category: state
    check: "OCC: expected_permit_application_version matches current PermitApplication.version on issue/renew"
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    applies_to: "POST /permits/{id}/issue, POST /permits/{id}/renew"
  - priority: 8
    category: business_referential
    check: "decision endpoint actor must be the PlanReview.reviewer_id; resolve/resubmit actor must own the permit chain"
    error_id: ERR_NOT_ASSIGNED_REVIEWER
    http_status: 403
    applies_to: "POST /reviews/{id}/decide"
  - priority: 9
    category: business_safety
    check: "segregation of duties — for a FINAL inspection result, the acting Inspector.id must differ from permit.approving_reviewer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /inspections/{id}/result (inspection_type=FINAL)"
  - priority: 10
    category: business_safety
    check: "contractor license/bond verification — Contractor.verification_status must be VERIFIED before ISSUE and before RENEW"
    error_id: ERR_CONTRACTOR_UNVERIFIED
    http_status: 409
    applies_to: "POST /permits/{id}/issue, POST /permits/{id}/renew"
  - priority: 11
    category: business_safety
    check: "an ACTIVE StopWorkOrder blocks inspection result entry, FINALIZE, and is a hard gate while present"
    error_id: ERR_WORK_STOPPED
    http_status: 409
    applies_to: "POST /inspections/{id}/result, POST /permits/{id}/finalize"
  - priority: 12
    category: business_constraint
    check: "a CORRECTIONS decision requires at least one OPEN CorrectionNotice on that PlanReview; an APPROVED decision and a RESUBMIT require open_correction_count == 0"
    error_id: ERR_OPEN_CORRECTIONS
    http_status: 409
    applies_to: "POST /reviews/{id}/decide, POST /permits/{id}/resubmit"
  - priority: 13
    category: business_constraint
    check: "a FINAL inspection cannot be scheduled or passed unless a PASSED ROUGH inspection already exists for the permit"
    error_id: ERR_ROUGH_NOT_PASSED
    http_status: 409
    applies_to: "POST /permits/{id}/inspections (FINAL), POST /inspections/{id}/result (FINAL)"
  - priority: 14
    category: business_temporal
    check: "requested inspection interval [scheduled_start, scheduled_end) must lie within the chosen slot window [window_start, window_end)"
    error_id: ERR_OUTSIDE_SLOT_WINDOW
    http_status: 409
    applies_to: "POST /permits/{id}/inspections"
  - priority: 15
    category: business_temporal
    check: "the inspector for the chosen slot must not already have an Inspection whose [scheduled_start, scheduled_end) overlaps the requested interval (half-open overlap; touching endpoints do NOT overlap)"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /permits/{id}/inspections"
  - priority: 16
    category: business_constraint
    check: "slot aggregate capacity — booked_count must be < InspectionSlot.max_inspections before adding another booking"
    error_id: ERR_SLOT_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /permits/{id}/inspections"
  - priority: 17
    category: business_fiscal
    check: "balance_due must equal 0 before ISSUE and before FINALIZE"
    error_id: ERR_BALANCE_DUE
    http_status: 409
    applies_to: "POST /permits/{id}/issue, POST /permits/{id}/finalize"
  - priority: 18
    category: business_constraint
    check: "FINALIZE requires an ISSUED CertificateOfOccupancy for the permit"
    error_id: ERR_NO_CERTIFICATE
    http_status: 409
    applies_to: "POST /permits/{id}/finalize"
  - priority: 19
    category: business_constraint
    check: "a FeePayment.amount must be > 0; CofO revoke requires co_status ISSUED; stop-work lift requires order_status ACTIVE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /permits/{id}/payments and related"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Jurisdiction ----
  - method: POST
    path: "/jurisdictions"
    description: "Create a jurisdiction (fee schedule reference)"
    roles: [BuildingOfficial]
    code: 201
    input: [name, code_edition, valuation_fee_rate_per_1000, square_foot_rate, plan_review_fee_pct, minimum_permit_fee, "renewal_fee_pct?", "permit_valid_days?"]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}"
    description: "Fetch a jurisdiction"
    roles: [BuildingOfficial, PermitClerk, Applicant, PlanReviewer, Inspector]
    code: 200
    input: []
    output: Jurisdiction

  # ---- Contractor ----
  - method: POST
    path: "/contractors"
    description: "Register a contractor with license + bond data"
    roles: [PermitClerk, BuildingOfficial]
    code: 201
    input: [business_name, license_number, "license_status?", license_expiry, bond_amount, "bond_status?"]
    output: Contractor
    side_effects: ["compute verification_status"]
  - method: GET
    path: "/contractors/{id}"
    description: "Fetch a contractor with derived verification_status"
    roles: [PermitClerk, BuildingOfficial, Applicant]
    code: 200
    input: []
    output: Contractor
  - method: PATCH
    path: "/contractors/{id}"
    description: "Update a contractor's license/bond standing (re-verify)"
    roles: [PermitClerk, BuildingOfficial]
    code: 200
    input: ["license_status?", "license_expiry?", "bond_amount?", "bond_status?"]
    output: Contractor
    side_effects: ["recompute verification_status"]

  # ---- Inspector / PlanReviewer (role-backed) ----
  - method: POST
    path: "/inspectors"
    description: "Register an inspector"
    roles: [BuildingOfficial]
    code: 201
    input: [full_name, badge_number]
    output: Inspector
  - method: GET
    path: "/inspectors/{id}"
    description: "Fetch an inspector"
    roles: [BuildingOfficial, PermitClerk, Applicant, Inspector]
    code: 200
    input: []
    output: Inspector
  - method: POST
    path: "/plan-reviewers"
    description: "Register a plan reviewer"
    roles: [BuildingOfficial]
    code: 201
    input: [full_name, cert_number]
    output: PlanReviewer
  - method: GET
    path: "/plan-reviewers/{id}"
    description: "Fetch a plan reviewer"
    roles: [BuildingOfficial, PermitClerk, Applicant, PlanReviewer]
    code: 200
    input: []
    output: PlanReviewer

  # ---- PermitApplication core ----
  - method: POST
    path: "/permits"
    description: "Submit a permit application; computes assessed_valuation, base_permit_fee, plan_review_fee, total_permit_fee"
    roles: [Applicant, PermitClerk]
    code: 201
    input: [jurisdiction_id, contractor_id, work_class, fee_method, "declared_valuation?", "floor_area_sqft?"]
    output: PermitApplication
    side_effects: ["compute assessed_valuation", "compute base_permit_fee", "compute total_permit_fee", "append PermitEvent SUBMITTED", "status=SUBMITTED, work_status=NOT_STARTED"]
  - method: GET
    path: "/permits/{id}"
    description: "Fetch a permit with computed fee + balance fields"
    roles: [Applicant, PermitClerk, BuildingOfficial, PlanReviewer, Inspector]
    code: 200
    input: []
    output: PermitApplication
  - method: GET
    path: "/permits"
    description: "List permits, filterable by contractor / jurisdiction / approving reviewer / status"
    roles: [Applicant, PermitClerk, BuildingOfficial, PlanReviewer, Inspector]
    code: 200
    input: ["contractor_id?", "jurisdiction_id?", "approving_reviewer_id?", "status?", "limit?", "offset?"]
    output: PermitApplication[]
  - method: POST
    path: "/permits/{id}/withdraw"
    description: "Withdraw a pre-issuance permit"
    roles: [Applicant, PermitClerk]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["complete OPEN PlanReview", "append PermitEvent WITHDRAWN"]
  - method: POST
    path: "/permits/{id}/resubmit"
    description: "Resubmit a corrected permit, re-entering plan review (cyclic)"
    roles: [Applicant, PermitClerk]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["increment review_cycle", "create fresh OPEN PlanReview", "status CORRECTIONS_REQUIRED -> UNDER_REVIEW", "append PermitEvent RESUBMITTED"]
  - method: POST
    path: "/permits/{id}/issue"
    description: "Issue an approved permit (OCC-guarded); sets issued_at/expires_at, work_status ACTIVE"
    roles: [PermitClerk]
    code: 200
    input: [expected_permit_application_version]
    output: PermitApplication
    side_effects: ["set issued_at, expires_at", "set work_status ACTIVE", "increments PermitApplication.version by 1", "append PermitEvent ISSUED"]
  - method: POST
    path: "/permits/{id}/renew"
    description: "Renew an expired permit (OCC-guarded); adds renewal fee, resets expiry"
    roles: [PermitClerk]
    code: 200
    input: [expected_permit_application_version]
    output: PermitApplication
    side_effects: ["add renewal fee to accrued_renewal_fees", "reset issued_at, expires_at", "set work_status ACTIVE", "increments PermitApplication.version by 1", "append PermitEvent RENEWED"]
  - method: POST
    path: "/permits/{id}/expire"
    description: "System sweep: mark an ISSUED permit EXPIRED once clock >= expires_at; cascades inspection cancellations"
    roles: [BuildingOfficial]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status ISSUED -> EXPIRED", "work_status STOPPED", "cancel SCHEDULED inspections (cascade -> free slot capacity)", "append PermitEvent EXPIRED"]
  - method: POST
    path: "/permits/{id}/finalize"
    description: "Close out an issued permit once a CofO is issued and balance is zero"
    roles: [BuildingOfficial]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status ISSUED -> FINALED", "append PermitEvent (closeout)"]

  # ---- Fee payments (FK reverse-reachability for FeePayment) ----
  - method: POST
    path: "/permits/{id}/payments"
    description: "Record a fee payment toward a permit; recomputes amount_paid/balance_due"
    roles: [Applicant, PermitClerk]
    code: 201
    input: [amount, "payment_status?"]
    output: FeePayment
    side_effects: ["recompute PermitApplication.amount_paid and balance_due"]
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a single fee payment"
    roles: [Applicant, PermitClerk, BuildingOfficial]
    code: 200
    input: []
    output: FeePayment
  - method: GET
    path: "/payments"
    description: "List fee payments, filterable by permit"
    roles: [Applicant, PermitClerk, BuildingOfficial]
    code: 200
    input: ["permit_id?", "limit?", "offset?"]
    output: FeePayment[]

  # ---- Plan reviews (FK reverse-reachability for PlanReview) ----
  - method: POST
    path: "/permits/{id}/reviews"
    description: "Open a plan review on a permit (SUBMITTED -> UNDER_REVIEW)"
    roles: [PlanReviewer]
    code: 201
    input: [reviewer_id]
    output: PlanReview
    side_effects: ["status SUBMITTED|... -> UNDER_REVIEW", "append PermitEvent REVIEW_OPENED"]
  - method: GET
    path: "/reviews/{id}"
    description: "Fetch a plan review"
    roles: [PlanReviewer, PermitClerk, BuildingOfficial, Applicant]
    code: 200
    input: []
    output: PlanReview
  - method: GET
    path: "/reviews"
    description: "List plan reviews, filterable by permit or reviewer"
    roles: [PlanReviewer, PermitClerk, BuildingOfficial, Applicant]
    code: 200
    input: ["permit_id?", "reviewer_id?", "limit?", "offset?"]
    output: PlanReview[]
  - method: POST
    path: "/reviews/{id}/decide"
    description: "Reviewer decides APPROVED or CORRECTIONS (branching fork)"
    roles: [PlanReviewer]
    code: 200
    input: [decision]
    output: PlanReview
    side_effects: ["APPROVED: permit UNDER_REVIEW -> APPROVED, set approving_reviewer_id", "CORRECTIONS: permit UNDER_REVIEW -> CORRECTIONS_REQUIRED, bump open_correction_count"]

  # ---- Correction notices (FK reverse-reachability for CorrectionNotice) ----
  - method: POST
    path: "/reviews/{id}/correction-notices"
    description: "Attach a correction notice to an OPEN plan review"
    roles: [PlanReviewer]
    code: 201
    input: [code_section, description]
    output: CorrectionNotice
    side_effects: ["increment permit.open_correction_count"]
  - method: GET
    path: "/correction-notices/{id}"
    description: "Fetch a single correction notice"
    roles: [PlanReviewer, PermitClerk, BuildingOfficial, Applicant]
    code: 200
    input: []
    output: CorrectionNotice
  - method: GET
    path: "/correction-notices"
    description: "List correction notices, filterable by plan review or permit"
    roles: [PlanReviewer, PermitClerk, BuildingOfficial, Applicant]
    code: 200
    input: ["plan_review_id?", "permit_id?", "limit?", "offset?"]
    output: CorrectionNotice[]
  - method: POST
    path: "/correction-notices/{id}/resolve"
    description: "Mark a correction notice resolved"
    roles: [Applicant, PermitClerk]
    code: 200
    input: []
    output: CorrectionNotice
    side_effects: ["item_status OPEN -> RESOLVED", "decrement permit.open_correction_count"]

  # ---- Inspection slots ----
  - method: POST
    path: "/inspection-slots"
    description: "Publish an inspector availability window with aggregate capacity"
    roles: [BuildingOfficial, Inspector]
    code: 201
    input: [inspector_id, window_start, window_end, "max_inspections?"]
    output: InspectionSlot
  - method: GET
    path: "/inspection-slots/{id}"
    description: "Fetch a slot with derived booked_count"
    roles: [BuildingOfficial, Inspector, Applicant, PermitClerk]
    code: 200
    input: []
    output: InspectionSlot
  - method: GET
    path: "/inspection-slots"
    description: "List inspection slots, filterable by inspector"
    roles: [BuildingOfficial, Inspector, Applicant, PermitClerk]
    code: 200
    input: ["inspector_id?", "limit?", "offset?"]
    output: InspectionSlot[]

  # ---- Inspections (FK reverse-reachability for Inspection: by permit, by slot, by inspector) ----
  - method: POST
    path: "/permits/{id}/inspections"
    description: "Schedule a ROUGH or FINAL inspection into a slot; parent permit must be ISSUED; enforces window fit, double-booking, capacity"
    roles: [Applicant, PermitClerk]
    code: 201
    input: [slot_id, inspection_type, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["copy inspector_id from slot", "increment InspectionSlot.booked_count", "append PermitEvent INSPECTION_SCHEDULED"]
    note: "Precondition: parent PermitApplication.status == ISSUED (cross-entity state dependency); else ERR_INVALID_STATE."
  - method: GET
    path: "/inspections/{id}"
    description: "Fetch an inspection"
    roles: [Applicant, PermitClerk, BuildingOfficial, Inspector]
    code: 200
    input: []
    output: Inspection
  - method: GET
    path: "/inspections"
    description: "List inspections, filterable by permit, slot, or inspector"
    roles: [Applicant, PermitClerk, BuildingOfficial, Inspector]
    code: 200
    input: ["permit_id?", "slot_id?", "inspector_id?", "limit?", "offset?"]
    output: Inspection[]
  - method: POST
    path: "/inspections/{id}/result"
    description: "Inspector records PASS or FAIL (branching fork; FINAL PASS cascades a CofO)"
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: Inspection
    side_effects: ["PASS: status PASSED; FINAL PASS cascades CertificateOfOccupancy creation + CO_ISSUED event", "FAIL: status FAILED", "append INSPECTION_PASSED/INSPECTION_FAILED"]
  - method: POST
    path: "/inspections/{id}/cancel"
    description: "Cancel a scheduled inspection; frees slot capacity (compensation)"
    roles: [Applicant, PermitClerk]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status SCHEDULED -> CANCELLED", "decrement InspectionSlot.booked_count"]

  # ---- Stop-work orders (FK reverse-reachability for StopWorkOrder) ----
  - method: POST
    path: "/permits/{id}/stop-work-orders"
    description: "Issue a stop-work order; cascades inspection cancellation and CofO revocation"
    roles: [BuildingOfficial]
    code: 201
    input: [reason]
    output: StopWorkOrder
    side_effects: ["work_status ACTIVE -> STOPPED", "cancel SCHEDULED inspections (cascade -> free slot capacity)", "revoke ISSUED CofO (cascade -> CO_REVOKED)", "append PermitEvent STOP_WORK_ISSUED"]
  - method: GET
    path: "/stop-work-orders/{id}"
    description: "Fetch a single stop-work order"
    roles: [BuildingOfficial, PermitClerk, Applicant]
    code: 200
    input: []
    output: StopWorkOrder
  - method: GET
    path: "/stop-work-orders"
    description: "List stop-work orders, filterable by permit"
    roles: [BuildingOfficial, PermitClerk, Applicant]
    code: 200
    input: ["permit_id?", "limit?", "offset?"]
    output: StopWorkOrder[]
  - method: POST
    path: "/stop-work-orders/{id}/lift"
    description: "Lift an active stop-work order"
    roles: [BuildingOfficial]
    code: 200
    input: []
    output: StopWorkOrder
    side_effects: ["order_status ACTIVE -> LIFTED", "work_status -> ACTIVE if no other ACTIVE SWO", "append PermitEvent STOP_WORK_LIFTED"]

  # ---- Certificates of occupancy (FK reverse-reachability for CertificateOfOccupancy) ----
  - method: GET
    path: "/certificates/{id}"
    description: "Fetch a certificate of occupancy"
    roles: [BuildingOfficial, PermitClerk, Applicant]
    code: 200
    input: []
    output: CertificateOfOccupancy
  - method: GET
    path: "/certificates"
    description: "List certificates, filterable by permit or final inspection"
    roles: [BuildingOfficial, PermitClerk, Applicant]
    code: 200
    input: ["permit_id?", "final_inspection_id?", "limit?", "offset?"]
    output: CertificateOfOccupancy[]
  - method: POST
    path: "/certificates/{id}/revoke"
    description: "Revoke an issued certificate of occupancy"
    roles: [BuildingOfficial]
    code: 200
    input: []
    output: CertificateOfOccupancy
    side_effects: ["co_status ISSUED -> REVOKED", "append PermitEvent CO_REVOKED"]

  # ---- Permit events (FK reverse-reachability for PermitEvent: sub-resource form) ----
  - method: GET
    path: "/permits/{id}/events"
    description: "List a permit's append-only audit events"
    roles: [BuildingOfficial, PermitClerk, Applicant, PlanReviewer, Inspector]
    code: 200
    input: ["limit?", "offset?"]
    output: PermitEvent[]

  # ---- Test-driving clock endpoint (last-resort, /_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC clock to a fixed instant"
    roles: [BuildingOfficial]
    code: 200
    input: [to_iso8601]
    output: null
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving: advance the server's current UTC clock by a number of days"
    roles: [BuildingOfficial]
    code: 200
    input: [days]
    output: null

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_NOT_ASSIGNED_REVIEWER
    http: 403
    condition: "actor on a review decision is not the assigned PlanReview.reviewer_id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit id does not exist"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "contractor id does not exist"
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "jurisdiction id does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "plan review id does not exist"
  - id: ERR_CORRECTION_NOT_FOUND
    http: 404
    condition: "correction notice id does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id does not exist"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "inspection slot id does not exist"
  - id: ERR_SWO_NOT_FOUND
    http: 404
    condition: "stop-work order id does not exist"
  - id: ERR_CO_NOT_FOUND
    http: 404
    condition: "certificate of occupancy id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/invalid required field, bad enum, or non-positive payment amount"
  - id: ERR_DUPLICATE_LICENSE
    http: 409
    condition: "license_number / badge_number / cert_number already in use"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a valid state for the requested transition"
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "expected_permit_application_version does not match current PermitApplication.version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "FINAL inspection actor equals the permit's approving_reviewer_id"
  - id: ERR_CONTRACTOR_UNVERIFIED
    http: 409
    condition: "Contractor.verification_status != VERIFIED at issue/renew"
  - id: ERR_WORK_STOPPED
    http: 409
    condition: "an ACTIVE StopWorkOrder blocks the operation"
  - id: ERR_OPEN_CORRECTIONS
    http: 409
    condition: "open correction notices exist where the operation requires none (or none exist where CORRECTIONS decision requires one)"
  - id: ERR_ROUGH_NOT_PASSED
    http: 409
    condition: "FINAL inspection scheduled/passed without a prior PASSED ROUGH inspection"
  - id: ERR_OUTSIDE_SLOT_WINDOW
    http: 409
    condition: "requested inspection interval not contained in the slot window"
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "inspector already has an overlapping inspection interval"
  - id: ERR_SLOT_CAPACITY_FULL
    http: 409
    condition: "slot booked_count already at max_inspections"
  - id: ERR_BALANCE_DUE
    http: 409
    condition: "balance_due != 0 at issue or finalize"
  - id: ERR_NO_CERTIFICATE
    http: 409
    condition: "finalize attempted without an ISSUED CertificateOfOccupancy"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Applicant
    description: "Owner/agent submitting the permit, paying fees, resolving corrections, scheduling inspections"
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/{id}/resolve corrections (correction-notices/{id}/resolve)"
    shared_operations:
      - "POST /permits"
      - "POST /permits/{id}/withdraw"
      - "POST /permits/{id}/resubmit"
      - "POST /permits/{id}/payments"
      - "POST /permits/{id}/inspections"
      - "POST /inspections/{id}/cancel"
      - "GET reads of permits, reviews, inspections, payments, certificates, events"
  - name: PermitClerk
    description: "Counter staff who can create on behalf of applicants and who issues/renews permits"
    identity: "opaque"
    exclusive_operations:
      - "POST /permits/{id}/issue"
      - "POST /permits/{id}/renew"
    shared_operations:
      - "POST /contractors / PATCH /contractors/{id}"
      - "POST /permits"
      - "POST /permits/{id}/payments"
      - "POST /permits/{id}/inspections"
      - "POST /correction-notices/{id}/resolve"
      - "all GET reads"
  - name: PlanReviewer
    description: "Certified reviewer who opens reviews, issues correction notices, and approves plans"
    identity: "entity_backed:PlanReviewer"
    exclusive_operations:
      - "POST /permits/{id}/reviews"
      - "POST /reviews/{id}/decide"
      - "POST /reviews/{id}/correction-notices"
    shared_operations:
      - "GET reads of permits, reviews, correction-notices"
  - name: Inspector
    description: "Field inspector who records ROUGH/FINAL inspection results and publishes own slots"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/result"
    shared_operations:
      - "POST /inspection-slots"
      - "GET reads of inspections, slots, permits"
  - name: BuildingOfficial
    description: "Authority who configures jurisdictions/inspectors/reviewers, issues stop-work orders, expires/finalizes permits, revokes certificates"
    identity: "opaque"
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /inspectors"
      - "POST /plan-reviewers"
      - "POST /permits/{id}/stop-work-orders"
      - "POST /stop-work-orders/{id}/lift"
      - "POST /permits/{id}/expire"
      - "POST /permits/{id}/finalize"
      - "POST /certificates/{id}/revoke"
      - "POST /_clock/set_current_utc"
      - "POST /_clock/advance"
    shared_operations:
      - "POST /contractors / PATCH /contractors/{id}"
      - "POST /inspection-slots"
      - "all GET reads"
