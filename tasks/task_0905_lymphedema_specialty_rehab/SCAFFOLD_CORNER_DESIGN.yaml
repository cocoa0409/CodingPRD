              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 with data.error_id == ERR_EVALUATION_PATIENT_MISMATCH"

      - name: error_evaluation_not_finalized_on_plan
        claim_type: Violation to Error
        grounds: ["validations[priority=6]"]
        distinguishing_aspect: "Creating a plan against a DRAFT (not finalized) evaluation returns 409 ERR_EVALUATION_NOT_FINALIZED."
        test_recipe:
          setup: ["Patient with a DRAFT eval and an authorization."]
          setup_api_calls:
            - call: "POST /patients"
              payload: { full_name: "P", mrn: "MRN-1" }
