        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - entities.ProgramOfStudy.fields.approval_status
          - endpoints[POST /cte/expenditures/{id}/certify-allowability]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / expenditure_certification_reads_the_program_of_study_approval_state
          rationale: "That instance certifies the identical line against a non-approved and an approved program and asserts both outcomes."

      - name: an_operation_valid_today_is_refused_because_of_a_future_conflict
        claim_type: temporal_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_ASSET_PERIOD_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / tagged_asset_periods_are_closed_and_inflated_by_a_fourteen_day_mobilisation_buffer
          rationale: "That instance pins the buffered closed-interval comparison at a 14-day gap (rejected) and a 15-day gap (accepted)."

