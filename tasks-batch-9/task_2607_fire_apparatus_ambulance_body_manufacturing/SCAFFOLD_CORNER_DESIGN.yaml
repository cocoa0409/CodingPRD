      - name: empty_specification_and_duplicate_clause_code_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=42]
          - validations[priority=44]
          - errors.ERR_SPEC_HAS_NO_CLAUSES
          - errors.ERR_DUPLICATE_CLAUSE_CODE
        distinguishing_aspect: |
          A clause-less specification cannot enter review (422
          ERR_SPEC_HAS_NO_CLAUSES) while still DRAFT, and clause_code uniqueness is
          scoped to the specification: the same code "C1" is rejected 409 on the
          owning spec but freely accepted on a sibling specification of the same
          program.
        test_recipe:
          setup:
            - "two DRAFT BidSpecification rows on the same program, one of them empty"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Clause program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
