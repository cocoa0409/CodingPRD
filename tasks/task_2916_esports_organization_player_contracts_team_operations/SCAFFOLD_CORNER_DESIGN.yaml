            - call: "POST /players"
              payload: { full_name: "Rin Adachi", birth_date: "2001-05-14", region_code: "US" }
              as: Scout
              as_user_id: "scout-7"
              captures: { p1_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Dana Reyes", birth_date: "2002-03-09", region_code: "US" }
