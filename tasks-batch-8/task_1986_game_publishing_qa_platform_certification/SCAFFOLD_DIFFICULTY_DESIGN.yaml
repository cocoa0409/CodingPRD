  # ---------------------------------------------------------------- rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: bug_report_reopen_cycle
        grounds:
          - state_machines.BugReport.RESOLVED_to_REOPENED
          - state_machines.BugReport.VERIFIED_to_REOPENED
          - entities.BugReport.fields.reopened_count
        distinguishing_aspect: |
          BugReport is cyclic: VERIFIED -> REOPENED -> IN_PROGRESS -> RESOLVED ->
          VERIFIED -> REOPENED loops twice on one row and reopened_count reaches 2 —
          a shape impossible on the linear GameTitle machine. Sibling instance
          submission_package_remediation_round_cycle is a different entity with a
          round-incrementing cross-instance cycle.
        test_recipe:
          setup:
            - "Title T; Build B in IN_TEST (not CANDIDATE, so no blocker cascade can fire)"
            - "Bug BG created MAJOR and triaged MAJOR"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CYC-BUG", name: "Cyc Bug", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "MAJOR", category: "GAMEPLAY" }
              as: QALead
              captures: { bug: $.data.id }
            - { call: "POST /qa-cert/bugs/${bug}/triage", payload: { severity: "MAJOR" }, as: QALead }
          trigger:
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "IN_PROGRESS" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "RESOLVED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "VERIFIED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "REOPENED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "IN_PROGRESS" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "RESOLVED" }, as: QALead }
            - call: "POST /qa-cert/bugs/${bug}/transition"
              payload: { to_status: "REOPENED" }
              as: QALead
              captures: { rc: $.data.reopened_count, st: $.data.status }
          assert:
            - "bug.reopened_count == 2 after two full RESOLVED->REOPENED loops"
            - "bug.status == REOPENED (loop re-entry is legal)"
            - "title.open_blocker_count == 0 throughout (severity stayed MAJOR)"

      - name: submission_package_remediation_round_cycle
        grounds:
          - state_machines.SubmissionPackage.IN_REVIEW_to_REJECTED
          - state_machines.SubmissionPackage.REJECTED_to_CLOSED
          - state_machines.CertFinding.FIXED_IN_BUILD_to_OPEN
          - calculations.submission_fee
        distinguishing_aspect: |
          SubmissionPackage is cyclic ACROSS ROUNDS: round 1 ASSEMBLING -> SUBMITTED
          -> IN_REVIEW -> REJECTED, remediation on a newer build reopens then verifies
          the CATEGORY_A finding, the failed package auto-closes REJECTED -> CLOSED,
          and the remediation package (round == 2) submits at the 0.50 round tier
          (fee 60000). A different entity and a different cycle shape from
          bug_report_reopen_cycle (intra-row loop vs round-incrementing remediation).
        test_recipe:
          setup:
            - "Title T (PS5), budget 2000000, IN_DEVELOPMENT; ESRB GRANTED; plan APPROVED->LOCKED"
            - "Clock 2026-08-03T09:00:00Z for build B1 creation, 10:00 for PKG1 submit (Monday, fee 120000)"
            - "PKG1 REJECTED with CATEGORY_A finding F1 (filed in IN_REVIEW)"
            - "Build B2 created at 11:00 (strictly newer than B1), driven to CANDIDATE; PKG2 created (round 2)"
            - "F1 marked FIXED_IN_BUILD on B2; PKG2's checklist fully verified; clock 2026-08-03T12:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CYC-PKG", name: "Cyc Pkg", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 2000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorC", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv1: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv1}" }
              as: CertificationLead
              captures: { pkg1: $.data.id, cid1: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid1}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /qa-cert/submission-packages/${pkg1}/transition", payload: { to_status: "SUBMITTED" }, as: CertificationLead, as_user_id: "cl-1" }
            - { call: "POST /qa-cert/submission-packages/${pkg1}/transition", payload: { to_status: "IN_REVIEW" }, as: PlatformReviewer }
            - call: "POST /qa-cert/submission-packages/${pkg1}/findings"
              payload: { severity: "CATEGORY_A", requirement_code: "TRC-PS-02", description: "Crash on suspend/resume" }
              as: PlatformReviewer
              captures: { f1: $.data.id }
            - { call: "POST /qa-cert/submission-packages/${pkg1}/transition", payload: { to_status: "REJECTED" }, as: PlatformReviewer, as_user_id: "pr-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T11:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.1" }
              as: QALead
              captures: { b2: $.data.id }
            - { call: "POST /qa-cert/builds/${b2}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b2}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b2}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv2: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b2}", test_plan_id: "${pid}", expected_title_version: "${tv2}" }
              as: CertificationLead
              captures: { pkg2: $.data.id, cid2: $.data.checklist_id, rd2: $.data.round }
            - { call: "POST /qa-cert/cert-findings/${f1}/transition", payload: { to_status: "FIXED_IN_BUILD", build_id: "${b2}" }, as: CertificationLead }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid2}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: PlatformAdmin }
          trigger:
            - call: "POST /qa-cert/submission-packages/${pkg2}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
              captures: { err_blocked: $.data.error_id }
            - { call: "POST /qa-cert/cert-findings/${f1}/transition", payload: { to_status: "VERIFIED", passed: true }, as: PlatformReviewer }
            - call: "GET /qa-cert/submission-packages/${pkg1}"
              as: Any
              captures: { pkg1_status: $.data.status }
            - call: "POST /qa-cert/submission-packages/${pkg2}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
              captures: { fee2: $.data.fee_cents, st2: $.data.status }
          assert:
            - "blocked submit returns ERR_OPEN_CATEGORY_A_FINDINGS (finding FIXED_IN_BUILD is not yet VERIFIED)"
            - "after F1 VERIFIED: pkg1.status == CLOSED (auto REJECTED -> CLOSED on last finding verified)"
            - "pkg2.round == 2"
            - "second submit succeeds: pkg2.status == SUBMITTED and pkg2.fee_cents == 60000 (round-2 tier 0.50 x 120000, weekday)"

  # ---------------------------------------------------------------- rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: blocker_reopen_cascade_build_package_window
        grounds:
          - state_machines.BugReport.VERIFIED_to_REOPENED
          - state_machines.Build.CANDIDATE_to_IN_TEST
          - state_machines.SubmissionPackage.SUBMITTED_to_WITHDRAWN
          - state_machines.ReleaseWindow.RESERVED_to_RELEASED
          - entities.SubmissionPackage.fields.withdrawn_cause
        distinguishing_aspect: |
          Depth-3 chain where each hop is caused by the previous hop, not by the
          original trigger: bug reopen with effective severity BLOCKER (hop 0) demotes
          its CANDIDATE build (hop 1); the build demotion auto-withdraws the
          SUBMITTED package referencing it and refunds its escrow (hop 2); the
          system-caused withdrawal releases the title+platform's RESERVED LAUNCH
          window (hop 3). Sibling vendor_termination_cascade_assignments_plan starts
          from a different trigger (vendor termination) at depth 2.
        test_recipe:
          setup:
            - "Title T (PS5), budget 1000000, IN_DEVELOPMENT; plan APPROVED->LOCKED; ESRB GRANTED (spent 40000)"
            - "Build B1 CANDIDATE; PKG submitted Monday 2026-08-03T10:00:00Z (fee 120000 in escrow; available 840000)"
            - "W: LAUNCH window PS5 [2026-08-10T09:00Z, 2026-08-10T17:00Z) RESERVED"
            - "Bug BG on B1 filed MAJOR, triaged MAJOR, resolved, verified (no cascade yet — effective severity only becomes BLOCKER at reopen)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CASC-BLK", name: "Casc Blk", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorX", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { b1: $.data.id }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${b1}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${b1}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "SUBMITTED" }, as: CertificationLead, as_user_id: "cl-1" }
            - call: "POST /qa-cert/release-windows"
              payload: { title_id: "${tid}", platform_code: "PS5", kind: "LAUNCH", start_utc: "2026-08-10T09:00:00Z", end_utc: "2026-08-10T17:00:00Z" }
              as: ReleaseManager
              captures: { win: $.data.id }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${b1}", severity: "MAJOR", category: "GRAPHICS" }
              as: QALead
              captures: { bug: $.data.id }
            - { call: "POST /qa-cert/bugs/${bug}/triage", payload: { severity: "MAJOR" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "IN_PROGRESS" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "RESOLVED" }, as: QALead }
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "VERIFIED" }, as: QALead }
          trigger:
            - { call: "POST /qa-cert/bugs/${bug}/transition", payload: { to_status: "REOPENED", severity: "BLOCKER" }, as: QALead }
            - call: "GET /qa-cert/builds/${b1}"
              as: Any
              captures: { b_st: $.data.status }
            - call: "GET /qa-cert/submission-packages/${pkg}"
              as: Any
              captures: { p_st: $.data.status, p_cause: $.data.withdrawn_cause }
            - call: "GET /qa-cert/release-windows/${win}"
              as: Any
              captures: { w_st: $.data.status }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { t_esc: $.data.cert_budget_escrow_cents, t_avail: $.data.cert_budget_available_cents, t_blk: $.data.open_blocker_count }
          assert:
            - "hop 1: build.status == IN_TEST (demoted from CANDIDATE by the BLOCKER reopen)"
            - "hop 2: package.status == WITHDRAWN and withdrawn_cause == SYSTEM_BUILD_INVALIDATED"
            - "hop 3: window.status == RELEASED (system withdrawal releases RESERVED LAUNCH windows)"
            - "escrow refunded: title.cert_budget_escrow_cents == 0 and cert_budget_available_cents == 960000 (1000000 - 40000 spent ESRB fee)"
            - "bug.reopened_count == 1 and title.open_blocker_count == 1"

      - name: vendor_termination_cascade_assignments_plan
        grounds:
          - state_machines.QaVendor.ACTIVE_to_TERMINATED
          - state_machines.TestAssignment.SCHEDULED_to_CANCELLED
          - state_machines.TestPlan.APPROVED_to_DRAFT
          - calculations.entry_coverage
        distinguishing_aspect: |
          Depth-2 chain from a different trigger than the sibling cascade: vendor
          TERMINATED (hop 0) cancels its SCHEDULED assignments and releases their
          reserved hours (hop 1); each cancellation recomputes entry coverage and the
          APPROVED plan demotes to DRAFT when a cert-blocker entry loses COVERED
          (hop 2). Different conserved resource (vendor hours) and different
          propagation path than the blocker cascade.
        test_recipe:
          setup:
            - "Logical clock 2026-08-04T00:00:00Z (ISO week of 2026-08-03)"
            - "Vendor V cap 40h rate 5000; plan with cert-blocker entries COMBAT (10h) and NETWORK (6h)"
            - "A1 covers COMBAT with 10h, A2 covers NETWORK with 6h (both SCHEDULED, week 2026-08-03); plan APPROVED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CASC-VND", name: "Casc Vnd", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 500000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorTerm", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "NETWORK", platform_layer: "SERVICE", is_cert_blocker: true, required_coverage_hours: 6 }, as: QALead }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }
              as: VendorManager
              captures: { a1: $.data.id }
            - call: "POST /qa-cert/assignments"
              payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "NETWORK", week_start_date: "2026-08-03", reserved_hours: 6 }
              as: VendorManager
              captures: { a2: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
          trigger:
            - { call: "POST /qa-cert/vendors/${vid}/transition", payload: { to_status: "TERMINATED" }, as: VendorManager }
            - call: "GET /qa-cert/assignments/${a1}"
              as: Any
              captures: { a1_st: $.data.status }
            - call: "GET /qa-cert/assignments/${a2}"
              as: Any
              captures: { a2_st: $.data.status }
            - call: "GET /qa-cert/test-plans/${pid}"
              as: Any
              captures: { p_st: $.data.status, p_cov: $.data.covered_required_count }
            - call: "GET /qa-cert/vendors/${vid}"
              as: Any
              captures: { v_st: $.data.status, v_comm: $.data.committed_hours_current_week }
          assert:
            - "hop 1: A1.status == CANCELLED and A2.status == CANCELLED (system, vendor termination)"
            - "hop 2: plan.status == DRAFT (demoted from APPROVED; COMBAT and NETWORK uncovered)"
            - "plan.covered_required_count == 0 (of 2 required entries)"
            - "vendor.status == TERMINATED and committed_hours_current_week == 0 (hours released)"

  # ---------------------------------------------------------------- rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_state_beats_fiscal
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - calculations.submission_fee
          - calculations.age_rating_filing_fee
        distinguishing_aspect: |
          Error-category pair state (p4) vs business_fiscal (p9): the package is
          WITHDRAWN (submit illegal, ERR_PACKAGE_NOT_ASSEMBLING) AND the title's
          available budget (55300) is below the fee that would be computed (120000,
          ERR_CERT_BUDGET_EXCEEDED). The state error must win. Sibling instance
          hotfix_embargo_beats_build_mismatch exercises a different pair
          (business_safety vs business_referential).
        test_recipe:
          setup:
            - "Title T (PS5), budget 150000, IN_DEVELOPMENT; plan APPROVED->LOCKED; build CANDIDATE"
            - "Budget drawn down by four filed age-rating filings: ESRB 40000 (0 other active), PEGI 25000 (1 other), CERO 16200 (2 others => 10% bundle), USK 13500 (3 others => 10%) => spent 94700, available 55300 < 120000"
            - "PKG created then manually withdrawn from ASSEMBLING (no escrow ever held)"
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "PRIO-SF", name: "Prio SF", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 150000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - { call: "POST /qa-cert/titles/${tid}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorP", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${tid}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { f1: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${f1}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "PEGI", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { f2: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${f2}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "CERO", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { f3: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${f3}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "USK", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { f4: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${f4}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - call: "GET /qa-cert/titles/${tid}"
              as: Any
              captures: { tv: $.data.version, avail: $.data.cert_budget_available_cents }
            - call: "POST /qa-cert/titles/${tid}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${bid}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "WITHDRAWN" }, as: CertificationLead, as_user_id: "cl-1" }
          trigger:
            - call: "POST /qa-cert/submission-packages/${pkg}/transition"
              payload: { to_status: "SUBMITTED" }
              as: CertificationLead
              as_user_id: "cl-1"
              captures: { err: $.data.error_id }
          assert:
            - "title.cert_budget_available_cents == 55300 at trigger time (fiscal failure armed: 55300 < 120000)"
            - "response error_id == ERR_PACKAGE_NOT_ASSEMBLING (state, priority 4) — NOT ERR_CERT_BUDGET_EXCEEDED (business_fiscal, priority 9)"
            - "http status == 409"

      - name: hotfix_embargo_beats_build_mismatch
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Hotfix
        distinguishing_aspect: |
          Error-category pair business_safety (p5) vs business_referential (p7):
          the hotfix targets an EMBARGOED title (ERR_TITLE_UNDER_EMBARGO) AND its
          build_id belongs to a different title (ERR_BUILD_TITLE_MISMATCH). The
          safety error must win. Different category pair than
          submit_state_beats_fiscal (state vs business_fiscal).
        test_recipe:
          setup:
            - "Title A fully LAUNCHED (approved package chain, CERT_APPROVED -> LAUNCHED), then embargoed by ComplianceManager"
            - "Title B with build B1 (any status) — B1 belongs to B, not A"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "PRIO-SA", name: "Prio SA", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { ta: $.data.id }
            - { call: "POST /qa-cert/titles/${ta}/transition", payload: { to_status: "IN_DEVELOPMENT" }, as: ReleaseManager }
            - { call: "POST /qa-cert/titles/${ta}/transition", payload: { to_status: "CERTIFICATION" }, as: ReleaseManager }
            - call: "POST /qa-cert/vendors"
              payload: { name: "VendorS", weekly_capacity_hours: 40, cost_rate_cents_per_hour: 5000 }
              as: VendorManager
              captures: { vid: $.data.id }
            - call: "POST /qa-cert/test-plans"
              payload: { title_id: "${ta}", platform_code: "PS5" }
              as: QALead
              captures: { pid: $.data.id }
            - { call: "POST /qa-cert/test-plans/${pid}/entries", payload: { feature_area: "COMBAT", platform_layer: "GAME", is_cert_blocker: true, required_coverage_hours: 10 }, as: QALead }
            - { call: "POST /qa-cert/assignments", payload: { vendor_id: "${vid}", plan_id: "${pid}", feature_area: "COMBAT", week_start_date: "2026-08-03", reserved_hours: 10 }, as: VendorManager }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "IN_REVIEW" }, as: QALead }
            - { call: "POST /qa-cert/test-plans/${pid}/transition", payload: { to_status: "APPROVED" }, as: QALead }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${ta}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { ba: $.data.id }
            - { call: "POST /qa-cert/builds/${ba}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - { call: "POST /qa-cert/builds/${ba}/transition", payload: { to_status: "TEST_PASSED" }, as: QALead }
            - { call: "POST /qa-cert/builds/${ba}/transition", payload: { to_status: "CANDIDATE" }, as: QALead }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${ta}", territory: "ESRB", content_descriptors: ["MILD_VIOLENCE"] }
              as: ReleaseManager
              captures: { fid: $.data.id }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "FILED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/age-rating-filings/${fid}/transition", payload: { to_status: "GRANTED" }, as: PlatformReviewer }
            - call: "GET /qa-cert/titles/${ta}"
              as: Any
              captures: { tv: $.data.version }
            - call: "POST /qa-cert/titles/${ta}/submission-packages"
              payload: { platform_code: "PS5", build_id: "${ba}", test_plan_id: "${pid}", expected_title_version: "${tv}" }
              as: CertificationLead
              captures: { pkg: $.data.id, cid: $.data.checklist_id }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-01", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-02", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-03", result: "PASSED" }, as: ComplianceManager }
            - { call: "POST /qa-cert/compliance-checklists/${cid}/items/verify", payload: { requirement_code: "TRC-PS-04", result: "NA" }, as: ComplianceManager }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "SUBMITTED" }, as: CertificationLead, as_user_id: "cl-1" }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "IN_REVIEW" }, as: PlatformReviewer }
            - { call: "POST /qa-cert/submission-packages/${pkg}/transition", payload: { to_status: "APPROVED" }, as: PlatformReviewer, as_user_id: "pr-1" }
            - { call: "POST /qa-cert/titles/${ta}/transition", payload: { to_status: "CERT_APPROVED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/titles/${ta}/transition", payload: { to_status: "LAUNCHED" }, as: ReleaseManager }
            - { call: "POST /qa-cert/titles/${ta}/embargo", payload: { embargoed: true, reason: "compliance audit hold" }, as: ComplianceManager }
