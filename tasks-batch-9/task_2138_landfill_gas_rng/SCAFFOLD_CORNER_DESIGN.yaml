              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2026-09-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
